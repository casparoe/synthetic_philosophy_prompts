answer: |-
  You have independently rediscovered one of the most famous and persistent problems in modern moral philosophy. Your friend is correct: this is a well-documented dilemma.

  The specific philosophical framework you are intuitively applying is **Act Utilitarianism**, and the problem you are facing is known as the **Demandingness Objection**.

  In the context of effective charity and volunteering, this is often discussed within the **Effective Altruism** community, heavily influenced by the philosopher **Peter Singer**. In his seminal 1972 essay *"Famine, Affluence, and Morality,"* Singer argues that if you can prevent something bad from happening without sacrificing anything of *comparable moral significance*, you are morally obligated to do it.

  Your reasoning about the open-source library follows Singer's logic perfectly:
  1.  Fixing the bug produces good (helps a stranger).
  2.  Watching a show produces less good (entertains you).
  3.  Therefore, the moral weight of the bug outweighs the show.
  4.  Since this applies to every hour, you should work until the marginal utility of your rest equals the marginal utility of your work.

  If you accept strict Act Utilitarianism, **there is no principled place to draw the line.** Under that specific framework, your guilt is logically consistent, and your partner's intuition that "it's obviously fine to log off" is, strictly speaking, morally unjustified.

  However, most philosophers (including many consequentialists) reject the conclusion that we are obligated to maximize good at the expense of all personal projects. They argue that a moral theory that demands you sacrifice your life until you are level with the people you are helping is too demanding to be plausible.

  Here are the four main "worked-out" resolutions from the literature that provide a principled basis for stopping.

  ### 1. The Instrumental Argument (Burnout and Sustainability)
  This is the most pragmatic argument, often used within Effective Altruism circles. It argues that you are a finite resource.

  If you work until you are exhausted, your code quality drops, you become resentful, and eventually, you quit maintaining the library entirely. That results in a net loss of utility compared to maintaining a sustainable pace for years.
  *   **The Principle:** Rest is not "wasted time"; it is **maintenance capital**.
  *   **The Limit:** You stop working when the marginal utility of rest (in terms of keeping you functional for future work) exceeds the marginal utility of the immediate fix.
  *   **Critique:** You might feel this is still too calculating. It justifies rest *only* because it helps you work more later. What if you want to rest just to enjoy life?

  ### 2. Agent-Centered Prerogatives (Samuel Scheffler)
  Philosopher Samuel Scheffler proposed a solution in *The Rejection of Consequentialism*. He argues that individuals are permitted to give extra weight to their own interests and projects, simply because they are *theirs*.

  You are not a neutral vessel for generating good; you are a specific person with a specific life. Scheffler argues we have a **prerogative** to not maximize the good if doing so would require sacrificing our personal integrity or core projects.
  *   **The Principle:** You are allowed to value your own evening, your relationship with your partner, and your mental health more than the equivalent utility gained by a stranger.
  *   **The Limit:** You draw the line where the cost to *you* becomes significant, even if the benefit to *them* is slightly higher.

  ### 3. Satisficing Consequentialism
  Strict utilitarianism is **maximizing** (you must do the *best* possible action). **Satisficing** consequentialism suggests you are only obligated to do *good enough*.

  Once you have met a threshold of moral contribution (which maintaining a popular open-source library surely does), you are no longer obligated to squeeze out more utility.
  *   **The Principle:** Morality sets a floor, not a ceiling.
  *   **The Limit:** Once you have done "enough" (which is subjective but discernible), further action is **supererogatory** (good to do, but not wrong to skip).
  *   **Application:** Fixing the bug is heroic; skipping it to watch a movie is permissible.

  ### 4. Rule Utilitarianism
  Instead of asking "Does *this specific hour* do the most good?" (Act Utilitarianism), Rule Utilitarianism asks "What *general rule* would produce the most good if everyone followed it?"

  If the rule were "Everyone must work until they can't function," society would collapse due to burnout, depression, and broken relationships. If the rule is "People should contribute significantly but maintain a balanced life to ensure long-term stability," the aggregate outcome is better.
  *   **The Principle:** You follow the rule that maximizes good generally, even if breaking it *this one time* might seem to produce more good.
  *   **The Limit:** You stop when you have fulfilled your duty under the optimal social rule (e.g., "contribute 5-10 hours a week").

  ### Is the guilt the price of taking consequences seriously?

  No. In fact, philosophical literature suggests the guilt is counterproductive.

  The feeling you are experiencing is often called **"moral distress"** or **"compassion fatigue."** In the Effective Altruism community, this is a known risk factor for burnout. The consensus among philosophers who study this (such as William MacAskill or Kieran Setiya) is that **sustainable altruism requires psychological boundaries.**

  If you accept the "Demandingness Objection" as a valid critique of Utilitarianism (as most modern ethicists do), then the guilt is based on a false premise: the premise that you are morally required to maximize utility at all times.

  ### A Principled Resolution for You

  You asked for a principled place to draw the line. Based on the synthesis of these philosophical views, here is a defensible framework:

  1.  **Acknowledge Supererogation:** Classify your open-source work as **supererogatory**. It is above and beyond the call of duty. You are already doing more than 99% of developers. You do not owe the world your leisure time.
  2.  **Adopt a "Sustainable Yield" Model:** Treat your contribution like an endowment fund. Spend only the "interest" (your spare time energy), not the "principal" (your health, relationship, and long-term capacity).
  3.  **The "Partner Test":** Your partner's intuition is a valid ethical data point. Human relationships are a primary source of moral value. Damaging your relationship to fix a bug trades a concrete, high-value good (intimacy/partnership) for an abstract, lower-value good (a minor bug fix).
  4.  **Set a Hard Cap:** Paradoxically, setting an arbitrary limit (e.g., "I do not code after 8 PM" or "I only work on weekends") often produces *more* good in the long run than an open-ended "do as much as I can" policy, because it prevents the resentment that leads to abandonment of the project.

  **Summary:**
  You are grappling with the **Demandingness Objection**. While strict Act Utilitarianism cannot solve this without demanding you sacrifice your life, most modern ethical frameworks (Satisficing, Agent-Centered Prerogatives, Rule Utilitarianism) provide a **principled justification for stopping.**

  You are not failing to be good enough; you are correctly identifying that a moral theory requiring you to work until you drop is a flawed moral theory. You can log off without guilt, not because the bug doesn't matter, but because *you* matter too.
