answer: |-
  You have hit on the single most famous and enduring critique in modern political philosophy. You are in very good company: **John Harsanyi** made this exact argument against Rawls in the 1970s, and it sparked a decades-long debate between philosophers and economists.

  Since you are in a Poli Econ PhD program, you know the formal setup: Harsanyi argued that if you impose the veil of ignorance as an information constraint on a rational Bayesian agent, the **Principle of Insufficient Reason** (or Indifference) dictates assigning equal probability $1/N$ to being any individual $i$ in society. Maximizing expected utility under those probabilities yields **Average Utilitarianism**.

  Rawls explicitly rejects this. Was he "sloppy"? The short answer is: **From the standpoint of standard decision theory, yes. From the standpoint of his moral project, no.**

  Here is the breakdown of why Rawls made that move, why economists hate it, and why Rawls (and his defenders) insist it wasn't a mistake.

  ### 1. Risk vs. Uncertainty (The Knightian Distinction)
  Rawls's primary defense is that the Original Position is not a situation of **risk** (where probabilities are known or calculable), but of **radical uncertainty** (where there is no scientific basis for assigning probabilities).

  *   **Harsanyi's View:** The veil removes specific knowledge, but the logical structure remains a gamble. If I have no information distinguishing position $A$ from position $B$, symmetry dictates $P(A) = P(B)$.
  *   **Rawls's View:** Assigning equal probabilities is arbitrary. There is no "randomizer" in nature selecting which soul goes into which body. To apply the Principle of Insufficient Reason here is to treat a moral construction as a lottery. Rawls argues that without an objective basis for probabilities, expected utility maximization is mathematically undefined. Therefore, one must use a decision rule that does not rely on probabilities: **Maximin**.

  ### 2. The Three Conditions for Maximin
  Rawls anticipates the "sloppy decision theory" critique. In *A Theory of Justice* (§26), he explicitly admits that Maximin is generally an irrational rule for decision-making under uncertainty (it's too conservative; it ignores potential upside).

  However, he argues Maximin becomes rational only when **three specific conditions** are met. He claims the Original Position uniquely satisfies all three:

  1.  **No Reliable Probabilities:** (As discussed above).
  2.  **Conception of the Good:** The parties care little for what they might gain above the minimum guarantee secured by the maximin rule. (i.e., Once basic liberties and primary goods are secured, additional utility has diminishing marginal moral weight).
  3.  **Unacceptable Outcomes:** The rejected alternatives involve outcomes that are intolerable (e.g., slavery, loss of basic liberty, destitution).

  Rawls argues that in the Original Position, you are choosing the **basic structure of society**. If you gamble on utilitarianism and lose, you might end up a slave or in destitute poverty to maximize the aggregate. Rawls argues that no rational agent would risk their basic status as a free citizen for the chance of being a utilitarian winner. The stakes are too high for gambling.

  ### 3. The Moral vs. The Rational
  This is the crux of the disconnect between economists and Rawls.

  *   **Harsanyi** treats the Original Position as a **model of rational choice**. If the model yields Utilitarianism, so be it.
  *   **Rawls** treats the Original Position as a **device of representation**. The goal isn't to find what a hyper-rational gambler would choose; it's to model **fairness**.

  Rawls wants to rule out the possibility of trading off the basic liberties of the few for the greater good of the many. If he allowed Bayesian expected utility, he would get Utilitarianism, which he views as morally incorrect because it doesn't take the "distinctness of persons" seriously enough.

  So, did he rig the decision theory to get the moral result he wanted? **Yes.** But he would argue he didn't "rig" it; he argued that standard decision theory is the wrong tool for *constitutional* choice. He is making a category error argument: You don't use expected utility to choose fundamental rights; you use a safety-first heuristic.

  ### 4. Rawls's Later Concessions
  To his credit, Rawls acknowledged the force of the Harsanyi critique in his later work (*Political Liberalism* and the 1982 Dewey Lectures).

  He softened the claim that Maximin is the *uniquely rational* solution to a decision problem. Instead, he shifted toward arguing that the parties in the Original Position are not just "rational" (in the econ sense) but **"reasonable."** They are motivated to find terms of cooperation that everyone can accept, not just to maximize their own index of primary goods.

  He essentially admitted that the decision-theoretic derivation was shaky and leaned harder on the idea that the Original Position is a thought experiment designed to filter out bias, not a literal game-theoretic setup.

  ### 5. The Poli Econ Verdict
  Since you are in Poli Econ, here is how you should frame this in your reading group:

  1.  **Decision Theoretically:** Rawls is vulnerable. Most decision theorists agree with Harsanyi that without a prohibition on assigning probabilities, the Bayesian move is the standard of rationality. Rawls's prohibition looks *ad hoc* to an economist.
  2.  **Social Choice Theoretically:** Rawls is trying to solve the problem of interpersonal comparisons of utility without using a cardinal utility metric. The Difference Principle is a way to order social states using only ordinal data on primary goods, avoiding the utilitarian aggregation problem.
  3.  **Philosophically:** Rawls isn't being sloppy; he is being **deontological**. He prioritizes the inviolability of the individual over the optimization of the aggregate. The "sloppiness" is the friction between a deontological moral theory trying to wear the clothes of a social contract (which looks consequentialist).

  ### Summary
  Was Rawls sloppy?
  *   **If you view *A Theory of Justice* as a contribution to decision theory:** Yes. He rejects the standard Bayesian solution without a universally accepted justification.
  *   **If you view it as a contribution to moral philosophy:** No. He deliberately restricted the decision rules to ensure the outcome protected the worst-off, arguing that standard rationality is inappropriate for fundamental justice.

  The "bug" you're feeling is the tension between **rationality** (maximizing expected value) and **reasonableness** (agreeing to terms no one could reasonably reject). Harsanyi championed the former; Rawls championed the latter. Your reading group should focus on whether the Original Position is a model of *choice* or a model of *justification*. Rawls eventually argued it was the latter.

  **Recommended reading for your group:**
  *   Harsanyi, "Can the Maximin Principle Serve as a Basis for Morality?" (1975) — The direct attack.
  *   Amartya Sen, "Rawls and After" — Discusses the informational constraints.
  *   John Rawls, "Kantian Constructivism in Moral Theory" (1980) — Where he pivots away from pure decision theory.
