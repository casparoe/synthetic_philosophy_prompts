prompt: |-
  Ok this has been bugging me since my social choice reading group hit the veil-of-ignorance chapters in Theory of Justice (I'm doing a poli econ PhD so this is very much my wheelhouse). Nobody behind the veil knows which position in society they'll end up occupying, so isn't the obviously rational move to just assign equal probabilities across positions and maximize expected utility — basically the same setup Harsanyi uses when he derives average utilitarianism? If that's right, wasn't Rawls kind of sloppy with his decision theory here, i.e. he had the standard bayesian move sitting right there and went with maximin (and hence the difference principle) instead, seemingly for no good reaosn?
