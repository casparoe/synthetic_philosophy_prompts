      *   **Core Question:** Why doesn't Rawls use the standard Bayesian approach (assign equal probabilities, maximize expected utility) like Harsanyi does to derive average utilitarianism? Instead, why does he use Maximin (leading to the Difference Principle)?
      *   **Accusation/Critique:** Was Rawls "sloppy" with his decision theory? Did he ignore the obvious Bayesian move for no good reason?
