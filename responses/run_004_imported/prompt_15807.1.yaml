      *   **Explain Rawls's specific rejection of probabilities:** Rawls argues there is *no basis* for assigning probabilities. It's not just "I don't know"; it's "There is no fact of the matter" or "The situation is too unique." He distinguishes between decision-making under *risk* (probabilities known) and *uncertainty* (probabilities unknown).
      *   **Explain the "Special Features" of the Veil:** Rawls argues Maximin is only rational under three specific conditions (which he claims the Original Position satisfies):
          1.  No knowledge of probabilities.
          2.  Care little for gains above the minimum guarantee.
          3.  Rejected alternatives have unacceptable outcomes (catastrophic).
      *   **Explain the Moral vs. Rational distinction:** Rawls isn't just doing decision theory; he's constructing a moral argument. The Veil isn't just an information constraint; it's a device to ensure fairness. Maximin ensures the worst-off are protected, which aligns with his conception of justice as fairness, not just rational choice.
      *   **Address the "Sloppiness" Charge:** It's not necessarily sloppiness, but a deliberate philosophical choice that prioritizes the *stability* and *moral acceptability* of the outcome over strict Bayesian rationality. However, admit that many economists (including Harsanyi) find his decision-theoretic justification unconvincing.
