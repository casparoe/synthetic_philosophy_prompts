      *   *Is the user right about Rawls?* Yes, Rawls explicitly rejects the principle of insufficient reason (assigning equal probabilities) and adopts the Maximin rule.
      *   *Was Rawls "sloppy"?* This is the contentious part. The standard critique (from Harsanyi, Sen, etc.) is that Rawls's decision theory is weak. However, Rawls defenders argue he wasn't doing standard decision theory under risk/uncertainty but something else (non-probabilistic uncertainty, or a specific moral construction).
      *   *Key Distinction:* Risk vs. Uncertainty (Knightian). Harsanyi treats it as risk (probabilities known/assignable). Rawls treats it as radical uncertainty (no basis for probabilities).

  3.  **Formulate the Argument:**
