  4.  **Develop the Disanalogy (The "Why it's different" part):**
      *   *On-Call:* Tests *retention* of competence under stress. The goal is to maintain judgment.
      *   *Alcohol:* Tests *loss* of competence under intoxication. The goal (biologically) is impairment.
      *   *Agency:* In an outage, you choose how to respond. With alcohol (especially if topped up by a superior), your capacity to choose is being chemically eroded.
      *   *Job Relevance:* Tech leads need *better* impulse control, not less. Alcohol reduces impulse control.

