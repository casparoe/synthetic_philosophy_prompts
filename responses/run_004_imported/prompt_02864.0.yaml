      *   **Relevance:** Does drunken behavior correlate with technical leadership? (Predictive validity).
      *   **Power Dynamics:** The VP is sober; the candidates are being encouraged to drink. This creates an asymmetry.
      *   **Context:** A social setting vs. a professional setting.
