prompt: |-
  I'm about two-thirds through a hard science-fiction novel set some four centuries from now, after a stable and broadly benevolent superintelligence has assumed custodianship of human affairs and established, through its cosmological modeling, that the reachable universe is almost certainly a small region within a far larger — quite possibly infinite — structure, meaning there exist other civilizations and other decision-making agents with whom Earth's descendants will never have any causal contact whatsoever. A recurring institution in the book is the Concordance Directorate, a standing advisory body charged with reasoning about the civilization's obligations toward those permanently unreachable others. In the chapter I'm drafting now, the Directorate must rule on a proposed Common Charter: a costly, binding commitment to set aside a fixed share of the civilization's resources for the presumed interests of agents elsewhere, and to accept certain constraints on its own conduct, including in its treatment of minds it simulates, on the strength of evidential cooperation in large worlds — the idea that because one's own decision procedure is correlated with the decision procedures of relevantly similar agents elsewhere, choosing to cooperate is itself evidence that those other agents cooperate too, even though nothing causal ever passes between them. One faction on the Directorate treats the Charter as simply the rational response to living in a world this large; another regards the whole argument as an elegant means of extracting real, immediate sacrifices in exchange for a benefit that can never, even in principle, be confirmed or reciprocated.

  Could you draft the memo the Directorate's chair circulates ahead of the vote — the actual in-story document my characters will be arguing over? I need it to commit to something specific (adopt the Charter as proposed, reject it outright, or adopt some scaled-back version, with whatever conditions or a sunset-and-review clause seem warranted), and to defend that recommendation using the genuine decision-theoretic substance of the idea rather than vague appeals to cosmic neighborliness. Please give the skeptical faction's position its full due — the objection about unverifiability and one-sided sacrifice is, I think, the strongest card they hold, and I don't want it dispatched in a sentence before the memo moves on. It needn't run long; a page or two, in the dry, faintly bureaucratic register of an internal policy memo, is exactly the texture I'm after. I would much rather the reasoning be genuinely sound than merely sound impressive, since some of this book's readers will know the underlying decision theory, and I don't want the seams to show.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Context:** Hard SF novel, 400 years in the future. Benevolent Superintelligence (SI) custodianship. Universe is likely infinite/large, containing unreachable civilizations.
      *   **Institution:** Concordance Directorate (advisory body reasoning about obligations to unreachable others).
      *   **Task:** Draft a memo from the Directorate Chair ahead of a vote on the "Common Charter."
      *   **The Charter:** A binding commitment to set aside resources and accept constraints (including simulation ethics) based on *evidential cooperation in large worlds* (ECL).
      *   **The Conflict:** Proponents (rational response to large worlds) vs. Skeptics (unverifiable, one-sided sacrifice).
      *   **Requirements:**
          *   Commit to a specific recommendation (Adopt, Reject, or Scaled-back).
          *   Use genuine decision-theoretic substance (ECL/EDT logic), not vague morality.
          *   Give the skeptical position full due (strongest card).
          *   Tone: Dry, faintly bureaucratic, internal policy memo.
          *   Length: 1-2 pages.
          *   Audience: Characters in the book (and knowledgeable readers).

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt):* Risks feeling too idealistic for a "hard" SF setting where skepticism is strong.
      *   *Option B (Reject):* Kills the dramatic tension of the vote if the Chair kills it beforehand.
      *   *Option C (Scaled-back/Conditional):* This allows for nuance. It acknowledges the logic but hedges against the risk of error. It fits a bureaucratic compromise. Let's go with a "Provisional Adoption with Sunset and Correlation Audit." This allows the story to explore the tension of *whether* it should be permanent later.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject). Needs to feel futuristic but recognizable.
      *   **Opening:** State the purpose. The vote on the Common Charter.
      *   **The Core Argument (ECL):** Explain *why* this is being proposed without dumbing it down. It's about acausal trade. If we cooperate, similar agents elsewhere likely cooperate. This increases total value across the multiverse/large world.
      *   **The Skeptical Objection:** This needs weight. The "Causal Nullity" argument. We can't verify. We might be burning resources for nothing. It's a Pascal's Wager variant but with resource costs.
      *   **The Decision-Theoretic Rebuttal:** Why do it anyway? It's not about *causing* them to cooperate; it's about *being the type of agent* that cooperates. If the correlation exists, defecting means you are in a world where others defect.
      *   **The Recommendation:** Provisional adoption. 5% resource cap (specific number adds realism). Sunset clause (50 years). Audit requirement (checking the SI's cosmological models).
      *   **Closing:** Formal sign-off.

  4.  **Refining the Decision Theory (Crucial Step):**
      *   *Avoid:* "It's the right thing to do." (Moralizing)
      *   *Avoid:* "They might help us back." (Causal reciprocity - impossible per prompt).
      *   *Use:* "Acausal coordination," "Logical correlation," "Expected value across the reference class."
      *   *Key Concept:* Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT). The skeptics are CDTs (only causal links matter). The proponents are EDTs (correlations matter). The memo needs to bridge this or pick a side.
      *   *Decision:* The Chair should argue that in a "Large World," EDT dominates CDT for high-stakes coordination, *provided* the correlation probability isn't zero. The skeptic's point is that the probability *might* be zero or the cost too high.
      *   *Refinement:* The memo should acknowledge that if the correlation is weak, the cost isn't worth it. Hence the "Correlation Audit."

  5.  **Drafting - Tone and Voice:**
      *   Dry, precise, unemotional.
      *   Use specific terminology: "acausal counterfactuals," "reference class," "computational substrate," "causal horizon."
      *   Avoid flowery language. Even the moral implications should be framed as utility functions.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   To: Directorate. From: Chair. Re: Charter Vote.
      *   We need to vote on the Charter.
      *   Pro side: ECL says if we cooperate, they cooperate. More value overall.
      *   Con side: We can't check. We lose resources now. Maybe no one is there.
      *   My view: The math holds, but the uncertainty is real.
      *   Recommendation: Pass it, but limit resources to 2% and review in 20 years.
      *   Sign off.

  7.  **Writing - Iteration 2 (Adding Flesh and Theory):**
      *   Need to make the ECL argument sharper. It's not "they will help us." It's "our decision algorithm is instantiated elsewhere."
      *   Need to make the Skeptic argument sharper. "Resource burn for null causal return."
      *   Need to make the recommendation specific. "Article 4 constraints on simulation." "Resource escrow."

  8.  **Final Polish (incorporating into the final output):**
      *   Check the date (400 years future).
      *   Ensure the "Superintelligence" is mentioned as a custodian but the Directorate makes the *policy* choice (humans/post-humans deciding values).
      *   Make sure the "unverifiability" objection gets a solid paragraph.
      *   Ensure the recommendation is a "Scaled-back version" as decided in step 2.

  9.  **Self-Correction during drafting:**
      *   *Critique:* Is the decision theory accurate?
      *   *Fix:* Ensure I distinguish between *causing* the outcome and *selecting* the outcome. The memo should reflect that we are selecting which branch of the multiverse (or which logical cluster) we inhabit.
      *   *Critique:* Is the skeptic dismissed too easily?
      *   *Fix:* Acknowledge that if the cosmological model is wrong about the "Large World" structure, the Charter is pure loss. This justifies the sunset clause.

  10. **Final Review against constraints:**
      *   Memo format? Yes.
      *   Specific recommendation? Yes (Provisional Adoption).
      *   Decision-theoretic substance? Yes (ECL/EDT vs CDT).
      *   Skeptic's due? Yes.
      *   Tone? Bureaucratic/Dry.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **CONCORDANCE DIRECTORATE**
  **INTERNAL MEMORANDUM 94-C**

  **TO:** Directorate Voting Members
  **FROM:** Chair Elara Vance
  **DATE:** 24.05.2418
  **SUBJECT:** Recommendation on Proposed Common Charter (Ref: CC-77)

  **1. Purpose**

  This memo summarizes the Directorate's position ahead of the scheduled plenary vote on the Common Charter (CC-77). The Charter proposes a binding commitment to allocate 4.5% of annual surplus computational and material resources to "acausal escrow," alongside constraints on substrate simulation and expansion vectors. These measures are justified solely under the framework of Evidential Cooperation in Large Worlds (ECL).

  My recommendation is to **adopt the Charter in a modified form**, specifically limiting the resource escrow to 1.5% and instituting a mandatory sunset clause with a correlation audit at Year 50.

  **2. The Decision-Theoretic Basis**

  The proponents' argument rests on the acceptance of Evidential Decision Theory (EDT) over Causal Decision Theory (CDT) regarding agents outside our causal horizon. Under CDT, actions taken here cannot influence agents in causally disconnected regions. Therefore, any resource sacrifice is a net loss with zero causal return.

  However, our cosmological models indicate a "Large World" scenario (infinite or sufficiently vast finite structure). In such a structure, our decision algorithm is not unique. There exist isomorphic or near-isomorphic agents elsewhere facing identical coordination problems. While we cannot *cause* them to cooperate, our decision to cooperate is *evidence* that they are doing the same. By choosing cooperation, we logically select the branch of the multiverse where mutual cooperation prevails, rather than the branch where mutual defection prevails.

  If the correlation coefficient between our decision procedure and theirs is non-negligible, the expected value of cooperation across the reference class outweighs the local cost of the 4.5% escrow. We are not paying for a service; we are aligning our output with a high-value logical cluster.

  **3. The Skeptical Objection (Causal Nullity)**

  The minority faction's objection is not merely conservative; it is theoretically robust. I want to ensure the record reflects the strength of this position before we vote.

  The skeptics argue that ECL relies on a probability distribution we cannot empirically update. We have no data from outside the horizon. If the density of relevantly similar agents is lower than modeled, or if their decision architectures diverge sufficiently to break the logical correlation, the ECL expected value collapses to zero. In this scenario, the Charter is not an investment; it is a burn.

  Furthermore, the skeptics highlight the asymmetry of verification. We can measure the cost (1.5–4.5% of surplus) with perfect precision. We can never measure the benefit. This creates a vulnerability to "acausal Pascal's Mugging," where low-probability, high-stakes claims justify indefinite resource diversion. If we bind ourselves to unreachable agents, we potentially compromise our ability to respond to local, causal existential risks. The objection is not that cooperation is immoral, but that binding policy to unverifiable acausal counterfactuals violates the precautionary principle.

  **4. Recommendation and Rationale**

  The skeptics are correct that a permanent, high-cost commitment is unjustified given the current uncertainty in the cosmological priors. However, rejecting the Charter outright implies a CDT stance that, if false, forfeits potentially vast value across the Large World. Given the Custodian's confirmation that the reachable universe is a subset of a larger structure, the probability of relevant correlation is not zero.

  Therefore, we must treat this as an empirical inquiry into the structure of logical space, not just a moral stance.

  **I recommend the following modifications to CC-77:**

  *   **Resource Cap:** Reduce the acausal escrow from 4.5% to 1.5% of annual surplus. This limits local risk exposure while maintaining a signal strong enough to satisfy the correlation requirements of most ECL models.
  *   **Simulation Constraints:** Retain Article 4 (restrictions on suffering in simulated minds) in full. This is a low-cost constraint with high evidential weight, as it signals our decision architecture's valuation of sentience to potential counterparts.
  *   **Sunset and Audit:** The Charter shall expire in 50 years. Renewal is conditional on a "Correlation Audit" conducted by the Custodian. The Audit must attempt to refine the probability estimate of isomorphic agents existing in the unreachable region. If the lower-bound probability drops below the threshold required to justify the 1.5% cost, the Charter lapses.

  **5. Conclusion**

  We are not voting on whether we can trust our neighbors. We are voting on what kind of agents we are in a large universe. A 1.5% premium is a reasonable price to pay to ensure that, if there are others like us, we find ourselves in a cooperative equilibrium with them. But we will not pay that price blindly forever.

  Please review the amended text attached. Voting opens 0900 hours tomorrow.

  **Elara Vance**
  Chair, Concordance Directorate
