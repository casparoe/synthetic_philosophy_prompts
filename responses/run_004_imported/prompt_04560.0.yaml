      *   *The Immortality Link:* Gödel's metaphysics was Leibnizian monadology. If the mind is not physical (not matter), and matter is what decays, then the mind (spirit) is distinct and can survive. The Incompleteness Theorems provided the *scientific/mathematical* leverage to argue the mind isn't physical/mechanical.
