prompt: |-
  I write about science and the ideas that shape it, and lately much of that work has meant covering the replication crisis in psychology. Partly on the strength of a piece I wrote on p-hacking and the preregistration movement, a psychology department recently invited me onto its newly formed Open Science Committee as the outside, non-specialist member. The committee has just run into its first genuinely hard case, and both factions have asked me to draft the memo, since neither entirely trusts the other to state its opponent's position fairly.

  Two years ago the department pre-registered a well-powered Registered Report attempting to replicate a well-known ego-depletion effect, committing in the Stage 1 protocol to a one-tailed t-test at α = .05 with a specified sequential stopping rule. The finished study lands at p = .058 — just outside the pre-registered threshold, which by the letter of the protocol makes it a null result and nothing more. The complication is that one committee member, a Bayesian statistician, reran the same data (a reanalysis that was not itself part of the pre-registered plan) and reports a Bayes factor of roughly 8-to-1 favoring the null. She wants the write-up and any press release to describe the effect as actively disconfirmed rather than merely "not significant," and points out that her method isn't even sensitive to the stopping rule the frequentist plan specified so carefully in advance. Two other members insist we report exactly what was pre-registered and nothing else, arguing that introducing a different statistical framework after seeing the data reopens precisely the interpretive latitude Registered Reports exist to close off, whatever that framework's merits in the abstract.

  Could you draft the memo I'll circulate to the department chair before we meet with the full faculty next month? I need a specific, defensible recommendation for how this result should be characterized and reported, ideally a standing rule the committee could apply the next time this situation comes up, and real engagement with the Bayesian statistician's argument rather than a default retreat to "the protocol is the protocol."
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Outside, non-specialist member of an Open Science Committee in a Psychology Department.
      *   **Task:** Draft a memo to the Department Chair regarding a specific conflict over reporting a replication study result.
      *   **Context:** The replication crisis in psychology, p-hacking, preregistration, Registered Reports.
      *   **The Case:**
          *   Study: Replication of ego-depletion effect (Registered Report).
          *   Protocol: One-tailed t-test, $\alpha = .05$, sequential stopping rule.
          *   Result: $p = .058$ (Fail to reject null by protocol).
          *   Conflict:
              *   *Faction A (Strict Preregistration):* Report exactly as pre-registered ("not significant"/null result). Adding analysis now violates the spirit of Registered Reports (prevents HARKing/p-hacking).
              *   *Faction B (Bayesian Reanalysis):* Bayes Factor ($BF_{01}$) $\approx 8$. Claims this actively supports the null. Notes BF is insensitive to the stopping rule. Wants to claim "active disconfirmation."
      *   **Requirements:**
          *   Specific, defensible recommendation.
          *   A standing rule for future cases.
          *   Real engagement with the Bayesian argument (not just "rules are rules").
          *   Tone: Professional, balanced, scientifically rigorous, suitable for a department chair and faculty.

  2.  **Deconstruct the Scientific/Philosophical Issues:**
      *   **Registered Reports (RR):** The core value is *commitment*. You commit to an analysis plan *before* seeing data to prevent researcher degrees of freedom. Deviating post-hoc undermines this.
      *   **Frequentist ($p$-value):** $p = .058$ means "data this extreme or more is unlikely if null is true," but it crosses the pre-specified threshold. It is *not* evidence *for* the null, just failure to reject it.
      *   **Bayesian (Bayes Factor):** $BF_{01} = 8$ means the data are 8 times more likely under the null than the alternative. This *is* evidence for the null.
      *   **Stopping Rules:** Frequentist inference is sensitive to stopping intentions (optional stopping inflates Type I error). Bayesian inference is generally considered insensitive to stopping rules (Likelihood Principle).
      *   **The Conflict:** If we allow the Bayesian analysis now, are we "p-hacking" with Bayes? Or are we using a more informative tool that was available but not specified? If we forbid it, are we ignoring relevant evidence?
      *   **The "Active Disconfirmation" Claim:** A BF of 8 is "moderate" to "substantial" evidence (depending on the scale, e.g., Jeffreys), but claiming "active disconfirmation" might be too strong for a single replication, even with a BF. However, it is stronger than "not significant."

  3.  **Formulate a Recommendation:**
      *   *Can we just say "Follow the protocol"?* No, the prompt asks for engagement with the Bayesian argument. Dismissing it outright ignores the statistical reality that the BF *does* provide evidence for the null, which the $p$-value does not.
      *   *Can we say "Use the Bayesian result"?* No, that undermines the Registered Report framework. If you can swap analysis plans after seeing $p = .058$, the commitment is meaningless.
      *   *Middle Ground:* The primary claim must adhere to the Registered Report (Stage 1 acceptance was based on the frequentist plan). However, the Bayesian analysis can be included as *secondary, exploratory, or supportive* evidence, provided it is clearly labeled as such.
      *   *Refining the "Active Disconfirmation":* A BF of 8 is good, but "disconfirmed" implies truth. "Evidence favoring the null" is better.
      *   *The Standing Rule:* We need a policy on *post-hoc* analyses in Registered Reports. They should be allowed but clearly demarcated from the confirmatory analysis.
      *   *Addressing the Stopping Rule:* Acknowledge the Bayesian is right about stopping rules, but note that the *commitment* was to the frequentist design. The stopping rule was part of the error control mechanism agreed upon.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the gravity of the situation. This is a test case for the committee's credibility.
      *   **Summary of Conflict:** Briefly state the two positions (Protocol Fidelity vs. Evidential Richness).
      *   **Analysis of the Bayesian Argument:**
          *   Acknowledge validity: BF *does* quantify evidence for the null.
          *   Acknowledge stopping rule insensitivity: This is technically correct.
          *   *Crucial Caveat:* Doing this post-hoc introduces "analysis flexibility." If we knew $p$ was .058, choosing a BF is a form of selection bias (even if unintentional).
      *   **Analysis of the Protocol Argument:**
          *   Core strength: Trust and credibility.
          *   Risk: Dogmatism. Ignoring useful info.
      *   **Recommendation (The "Verdict"):**
          *   Primary Conclusion: Adhere to Stage 1 protocol for the *confirmatory* claim ($p > .05$, fail to reject).
          *   Secondary Presentation: Include the BF in the results/discussion, but label it *exploratory/post-hoc*.
          *   Wording: Avoid "disconfirmed." Use "evidence favors the null."
      *   **Standing Rule (Policy):**
          *   Distinguish Confirmatory vs. Exploratory.
          *   Pre-register Bayesian plans if they are to be confirmatory.
          *   Transparency is key.
      *   **Closing:** Reiterate commitment to Open Science values.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Avoid taking sides personally, but take a side on the *principle*.
      *   Show understanding of the stats (don't dumb it down too much, but keep it accessible).
      *   *Self-Correction during drafting:* I initially thought about suggesting they publish both as equal. No, that undermines the RR. The RR acceptance was based on the frequentist plan. The BF must be secondary.
      *   *Addressing the "Stopping Rule" point:* The Bayesian is right that BF doesn't care about stopping. But the *study design* did. If we validate the BF now, we implicitly validate ignoring the stopping rule, which might set a bad precedent for frequentist RRs. Need to nuance this.

  6.  **Final Polish:**
      *   Check against constraints: Specific recommendation? Yes. Standing rule? Yes. Engagement with Bayesian argument? Yes.
      *   Ensure the distinction between "confirmatory" and "exploratory" is the pivot point.

  7.  **Final Review of the Output:** (Mental check)
      *   Does it sound like an outside expert? Yes, objective.
      *   Does it solve the immediate problem? Yes.
      *   Does it prevent future fights? Yes, via the standing rule.

  *(Self-Correction Note)*: I need to make sure I don't validate the Bayesian claim *too* much. A BF of 8 is not definitive proof. It's moderate evidence. The recommendation should reflect that nuance. Also, need to emphasize that *choosing* the Bayesian analysis after seeing the p-value is itself a researcher degree of freedom.

  8.  **Finalizing the Text:** (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Dr. Elena Rosales, Chair, Department of Psychology
  **FROM:** [Your Name], External Member, Open Science Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Reporting Standards for Registered Report [Study ID]

  **Purpose**

  This memo addresses the current disagreement within the Open Science Committee regarding the reporting of the recent ego-depletion replication study. As an external observer invited to bridge the divide between methodological fidelity and statistical interpretation, I have reviewed the Stage 1 protocol, the resulting data, and the competing arguments regarding the Bayesian reanalysis.

  My recommendation below seeks to preserve the integrity of the Registered Report framework while acknowledging the evidentiary value of the Bayesian analysis. I conclude with a proposed standing rule to prevent similar conflicts in future committee deliberations.

  **The Core Conflict**

  The committee is currently divided between two principled positions:

  1.  **Protocol Fidelity:** The study was accepted as a Registered Report based on a specific frequentist analysis plan (one-tailed $t$-test, $\alpha = .05$). The result ($p = .058$) fails to meet the threshold for a positive finding. Adhering strictly to the protocol prevents "analysis flexibility"—the very practice Registered Reports were designed to eliminate.
  2.  **Evidential Completeness:** A post-hoc Bayesian reanalysis yields a Bayes Factor ($BF_{01}$) of approximately 8. This suggests the data are eight times more likely under the null hypothesis than the alternative. Furthermore, Bayesian inference is largely insensitive to the sequential stopping rule specified in the frequentist protocol. Proponents argue that withholding this information misrepresents the strength of the evidence regarding the null.

  **Analysis of the Bayesian Argument**

  The Bayesian faction's statistical reasoning is sound in isolation. A $BF_{01}$ of 8 generally constitutes "moderate" to "substantial" evidence for the null (depending on the scale used), whereas a $p$-value of .058 technically provides no evidence *for* the null, only a failure to reject it. Additionally, they are correct that the Likelihood Principle renders the Bayes Factor insensitive to the stopping intentions that complicate the frequentist interpretation.

  However, accepting this reanalysis as the *primary* basis for the conclusion introduces a critical vulnerability. The decision to compute a Bayes Factor was made *after* the frequentist result was known to be marginally non-significant. While the Bayesian math itself is robust to stopping rules, the *choice of analytical framework* is not. If researchers know they can default to a Bayesian analysis whenever a frequentist $p$-value misses the cutoff, we have simply replaced $p$-hacking with "BF-hacking." This undermines the pre-commitment value of the Registered Report.

  **Recommendation for Current Study**

  I recommend the committee adopt a **Dual-Reporting Strategy with Hierarchical Weighting**:

  1.  **Primary Claim (Confirmatory):** The abstract and primary conclusion must adhere to the Stage 1 protocol. The result should be characterized as a **failure to replicate** (or "null result") based on the pre-registered frequentist criteria. We cannot claim the effect is "disconfirmed" in the confirmatory section, as the Stage 1 acceptance was granted on the basis of error rate control ($\alpha = .05$), not evidential odds.
  2.  **Secondary Claim (Exploratory):** The Bayesian analysis should be included in the Results and Discussion sections, but it must be explicitly labeled as a **post-hoc, exploratory analysis**.
  3.  **Wording:** Press releases and summaries should state that the study "failed to find significant evidence for the effect under pre-registered criteria, with additional exploratory analyses suggesting moderate evidence in favor of the null hypothesis."

  This approach honors the contract of the Registered Report while ensuring the faculty and public are not deprived of relevant statistical information. It avoids the dogmatism of ignoring the BF without sacrificing the credibility gained by pre-registration.

  **Proposed Standing Rule for Future Cases**

  To prevent this ambiguity from recurring, I propose the committee adopt the following policy regarding analysis plans in Registered Reports:

  > **Policy on Post-Hoc Analytical Frameworks:**
  >
  > 1.  **Confirmatory Status:** Only analyses specified in the Stage 1 protocol qualify as confirmatory. Any deviation from the pre-registered statistical framework (e.g., switching from frequentist to Bayesian, or changing priors) must be designated as exploratory.
  > 2.  **Pre-registration of Bayesian Methods:** If a team intends for a Bayesian analysis to serve as the primary basis for inference, the specific model, priors, and decision criteria (e.g., BF thresholds) must be pre-registered in Stage 1.
  > 3.  **Transparency Requirement:** Post-hoc analyses are permitted and encouraged, provided they are clearly distinguished from pre-registered analyses in the manuscript. Authors must disclose the timing of the decision to conduct these analyses (e.g., "conducted after review of primary outcomes").

  **Rationale**

  This policy acknowledges that Bayesian methods are valid tools for Open Science but treats the *choice of tool* as a researcher degree of freedom that must be constrained. It validates the Bayesian statistician's contribution without allowing it to override the department's commitment to pre-registration.

  **Conclusion**

  The credibility of our Open Science initiative depends on our willingness to follow our own rules, even when the results are inconvenient. However, openness also demands we do not hide data that speaks to the question at hand. By categorizing the frequentist result as confirmatory and the Bayesian result as exploratory, we maintain the integrity of the Registered Report while providing a nuanced, scientifically honest account of the evidence.

  I am available to discuss this recommendation with the full faculty prior to next month's meeting.

  Respectfully,

  [Your Name]
  External Member, Open Science Committee
