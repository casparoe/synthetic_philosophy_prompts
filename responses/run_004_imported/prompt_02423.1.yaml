      *   **Key Insight for the Novel:** Tibetan debate logic (Tshad-ma) is classical. Dialetheism is a modern Western lens. A monk arguing Dev's position in a traditional courtyard would be seen as confused, not profound. Roz's position aligns with the *Prāsaṅgika* tradition dominant in Tibet.

  7.  **Refining the Philosophical Nuance:**
      *   Make sure to distinguish between *prasajya-pratiṣedha* (non-implicative) and *paryudāsa* (implicative).
