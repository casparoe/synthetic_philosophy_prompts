      *   *Section 3: The Strongest Replies (Kamm & Others).*
          *   Kamm: It's not about summing pain, it's about *claims*. Each person has a claim to be saved. More claims outweigh fewer claims. This bypasses the "summing badness" issue.
          *   Scanlon (Contractualism): What rule could no one reasonably reject? A rule ignoring numbers might be rejectable by the larger group.
          *   The "Continuum Argument": If you save 1 over 2, why not 1 over 1,000,000? Parfit's *reductio*.
      *   *Section 4: The Deep Objection (The "Category Error").*
