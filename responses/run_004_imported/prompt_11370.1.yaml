      *   *Parfit ("Innumerate Ethics" / "Overpopulation" / "Reasons and Persons"):* Parfit attacks Taurek. He uses "Wide Scope" vs. "Narrow Scope" arguments. He argues that if we don't count numbers, we get absurd results in large cases (e.g., saving 1 vs. a million). He argues for the "Impartiality" principle which implies aggregation.
