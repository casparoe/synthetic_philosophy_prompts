      *   **Specific Wrinkle:** Moore admits that appreciating a person's *mental* qualities in isolation (without bodily expression) might be less valuable than appreciating their *physical* beauty alone.
      *   **The Conflict:** Moore ranks Personal Affection (specifically "love of love") as the highest good, above Aesthetic Appreciation. Does the admission about mental vs. physical beauty undercut this ranking? Or does the "love of love" move save it?
