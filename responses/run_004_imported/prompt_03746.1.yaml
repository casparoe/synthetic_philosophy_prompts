answer: |-
  This is a sharp catch. You've identified the precise tension in Section 52–53 of *Principia Ethica* that keeps exegetes up at night. If Moore builds both goods on the same structural formula (Cognition + Emotion), but admits the cognitive object in one case (the mind) is harder to access and potentially less valuable *in isolation* than the cognitive object in the other (the body), how does the first case win?

  Here is the walk-through of the argument structure, the nature of the deficit, and how the "love of love" move attempts to rescue the ranking.

  ### 1. The Parallel Structure (The Setup)
  Moore begins by establishing that the two greatest goods are **organic unities**. They are not just sums of parts; the value emerges from the combination. Both share an identical initial structure:

  *   **Aesthetic Appreciation:** [Cognition of a Beautiful Object] + [Appropriate Emotion toward that Object].
  *   **Personal Affection:** [Cognition of a Person's Mental Qualities] + [Appropriate Emotion toward that Person].

  At this stage, they are parallel. If value were purely additive, you would simply compare the value of the Object and the value of the Emotion.

  ### 2. The Wrinkle (The Cognitive Deficit)
  This is where your sticking point arises. Moore is an epistemic realist about beauty but a skeptic about direct access to other minds.

  *   **In Aesthetics:** The object (a landscape, a painting, a body) is directly present to consciousness. The cognition is clear, distinct, and intense.
  *   **In Affection:** The object (the other person's mind/virtues) is *not* directly present. We infer it from bodily signs.

  Moore admits that if we strip away the bodily expression, the **appreciation of mental qualities in isolation** is faint, uncertain, and arguably less valuable than the **appreciation of physical beauty**. He worries we often conflate the two, loving the body and projecting virtue onto it.

  **The Threat:** If the [Cognition] component of Personal Affection is *less* valuable than the [Cognition] component of Aesthetic Appreciation, then for Personal Affection to win, the [Emotion] component would have to be massively more valuable to compensate. But Moore has argued that the *type* of emotion (admiration/love) is structurally similar in both cases. So, on a simple part-by-part comparison, Personal Affection looks like it should lose.

  ### 3. The "Love of Love" Move (The Asymmetry)
  Moore rescues the ranking not by strengthening the *parts*, but by changing the *structure* of the whole. He breaks the parallel.

  Personal Affection allows for something Aesthetic Appreciation generally does not: **Reciprocal Consciousness.**

  *   **Aesthetic Whole:** I love the Beautiful Object. (The Object does not love back).
  *   **Affection Whole:** I love the Person. **The Person loves me (or loves the good).**

  Moore argues that the highest good is not merely "my love for a person," but a complex organic unity that includes **the consciousness of being loved in return** or, more specifically, **the love of the other person's love of the good.**

  This introduces a new layer of organic unity:
  1.  **First Order:** I appreciate your good mental state.
  2.  **Second Order:** I appreciate *your appreciation* of good things (including me).

  This "Love of Love" creates a multiplier effect. The value isn't just in the object (the mind), but in the **mutual cognition of emotion.**

  ### 4. Does it Rescue the Ranking?
  **Yes, but it shifts the ground.**

  The admission about mental qualities *does* undercut the idea that Personal Affection is higher because the *object* (the mind) is superior to the *object* (the beautiful thing). Moore effectively concedes that point.

  However, the "Love of Love" rescues the ranking by arguing that Personal Affection generates a **more complex organic unity** than Aesthetic Appreciation.

  *   **The Argument:** The value of the whole is not determined solely by the intrinsic value of the cognitive object. It is determined by the complexity of the conscious states involved.
  *   **The Calculation:**
      *   *Aesthetic Value:* Cognition(Beauty) + Emotion(Love).
      *   *Affection Value:* Cognition(Mind) + Emotion(Love) + **Cognition(Their Love) + Emotion(Love for that Love).**

  Moore's claim is that the addition of that second layer (the reciprocity/mutual consciousness) adds so much intrinsic value that it overwhelms the deficit caused by the fuzziness of perceiving mental qualities.

  ### 5. The Seminar Takeaway
  If you are presenting this, the critical nuance is this: Moore saves the ranking of Personal Affection, but he sacrifices the idea that we love people *primarily* because their minds are more beautiful objects than bodies.

  Instead, he argues we love people because **only persons can participate in the "Love of Love."**

  *   **Does the admission undercut him?** It undercuts a *simpler* version of his argument (that minds are just "more beautiful" than bodies).
  *   **Does "Love of Love" rescue it?** Yes, because it introduces a qualitative difference in the *structure of the whole*, not just the value of the parts. The "Love of Love" is a distinct good that is impossible in mere aesthetic appreciation.

  **The Weakness to Highlight:**
  The rescue relies entirely on the *consciousness* of the reciprocity. If the love is unrequited or unknown, Moore's logic suggests the value drops precipitously, potentially back below aesthetic appreciation (given the cognitive deficit of the mind). This makes the highest good in *Principia Ethica* incredibly fragile—it depends on mutual knowledge of mutual love.

  **Summary for your seminar:** The admission admits a deficit in the *object* of affection, but the "love of love" creates a surplus in the *relation* of affection. The relation outweighs the object.
