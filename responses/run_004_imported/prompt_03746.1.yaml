prompt: |-
  Quick one for you -- I'm prepping a seminar on Moore and there's a wrinkle in the 'Ideal' chapter of Principia Ethica that I keep getting stuck on. Moore sets up aesthetic appreciation and personal affection as basically parallel organic unities (cognition of something good/beautiful plus the fitting emotion toward it), and he eventually wants personal affection to come out on top, culminating in that odd 'love of love' idea -- loving someone's own loving appreciation of whats good -- as the single highest good, way ahead of mere love of beauty. But on the way there he admits that appreciating a person's admirable mental qualities in isolation, apart from thier bodily/behavioral expression, might actually be worth less than just appreciating someone's physical beauty by itself. So compare how he builds up value in the two cases and tell me: does that admission quietly undercut his ranking of personal affection over aesthetic appreciation, or does the 'love of love' move rescue it? Walk through the actual structure of the argument, not just the headline conclusion.
