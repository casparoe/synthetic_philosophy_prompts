      *   *Section 3: The "Love of Love" (The Surplus).* Explain how Personal Affection breaks the parallel. It introduces *reciprocity*. The object of affection can also be a subject of affection.
      *   *Section 4: The Verdict.* Does it rescue? Yes, because the *organic unity* of mutual love creates a value explosion that outweighs the deficit in the cognitive object. However, note the fragility (it relies on the *consciousness* of the love).
