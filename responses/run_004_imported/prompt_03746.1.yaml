      *   *The Two Great Goods:*
          1.  The pleasures of human intercourse (Personal Affection).
          2.  The enjoyment of beautiful objects (Aesthetic Appreciation).
      *   *Structure of Aesthetic Appreciation:* Cognition of a beautiful object + Appropriate emotion (admiration/love) toward it.
      *   *Structure of Personal Affection:* Cognition of a person's mental qualities + Appropriate emotion (love) toward them.
      *   *The "Love of Love" Climax:* The highest good isn't just loving a person; it's loving the fact that they are loving good things (reciprocal appreciation of good states of mind).
      *   *The "Wrinkle" (Section 52/53 area):* Moore discusses the difficulty of appreciating mental qualities directly. We usually perceive them through bodily signs. He suggests that if we *could* perceive mental qualities directly, it would be great, but since we can't, we rely on expressions. He makes a comparative claim: The appreciation of beautiful *bodily* form might be more valuable than the appreciation of admirable *mental* qualities if the latter is stripped of the former.
      *   *The Ranking:* Ultimately, Personal Affection > Aesthetic Appreciation.

  3.  **Analyze the Specific Tension:**
