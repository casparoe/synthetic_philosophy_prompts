          *   Chalmers is about *metaphysical possibility* (Hard Problem/Supervenience). "You can have the gears without the feeling."
      *   *Verdict:* They are cousins, not twins. Leibniz is the grandfather of the "Hard Problem," but the logical mechanism differs slightly. Leibniz focuses on the category error of finding qualia in extension/motion. Chalmers focuses on the logical contingency of qualia on physics.

