      *   *Key Nuance:* Leibniz isn't saying the machine *doesn't* feel. He's saying even if we *assume* it feels (for the sake of argument), looking at the physics won't *explain* how or where that feeling happens. It's an explanatory gap argument.

  3.  **Deconstruct Chalmers' "Philosophical Zombie" Argument:**
      *   *Premise 1:* Physicalism claims physical facts determine all facts (including consciousness).
