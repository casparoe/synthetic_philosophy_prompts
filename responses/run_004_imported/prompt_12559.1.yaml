answer: |-
  **MEMORANDUM**

  **TO:** Judicial Council Committee on Jury Instructions
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding "Loss-of-Life" (Hedonic) Damages in Survival Actions

  **I. Introduction and Recommendation**

  The Committee is currently considering whether to augment our model jury instructions for survival actions to include a distinct category of damages for the decedent's "loss of life" (often termed hedonic damages). This category would compensate the estate for the future life the decedent was denied, separate from pre-death pain and suffering, and separate from the survivors' own losses in companionship or support.

  A compelling objection has been raised by Judge [Name], relying on the Epicurean tradition: because the decedent no longer exists to experience the loss, there is no subject to harm, and thus no damages should lie. While philosophically coherent, this view creates a dissonance with our legal system's fundamental treatment of personal injury.

  I recommend that the Committee **adopt the new category**, but with specific instructional guardrails. We should instruct juries that these damages compensate for the *deprivation of life's ordinary pleasures and activities*, calculated based on the decedent's *ante-mortem* trajectory, rather than an abstract metaphysical value of existence. This approach answers the Epicurean objection on its own terms while providing the jury with a legally administrable standard.

  **II. Addressing the Epicurean Objection**

  Judge [Name]'s memo correctly identifies the central philosophical puzzle: If death is the end of consciousness, how can the dead person be harmed? As Epicurus argued, "when we are, death is not; and when death is, we are not." If harm requires a subject to feel pain or regret, and death eliminates the subject, then death cannot be a harm *to the decedent*.

  However, this argument conflates *experiencing* a harm with *suffering* a harm. Our tort law already rejects the notion that consciousness is a prerequisite for compensation. We award damages for loss of earning capacity to a plaintiff in a permanent coma, even though they will never consciously "experience" the loss of those wages. The harm is not the feeling of loss, but the objective reduction of the person's capabilities and future.

  The prevailing philosophical counter to Epicurus is the "Deprivation Account." On this view, death is a harm because it deprives the individual of the goods of life they would have otherwise experienced. The comparison is not between the decedent's state *after* death (non-existence) and life, but between the actual world (where they died) and the possible world (where they continued living). The "subject" harmed is the person as they existed prior to the tortious act, whose natural trajectory was unlawfully truncated.

  To accept the Epicurean view in this context leads to the absurdity noted by other Committee members: it implies that killing a healthy twenty-year-old is, in terms of damages to the *decedent*, no worse than maiming them, provided the maiming causes more conscious pain. Our law recognizes that death is the ultimate injury precisely because it forecloses all future capacity for enjoyment. To deny this category is to tell the jury to ignore the most significant consequence of the defendant's conduct.

  **III. The Legal-Philosophic Bridge: Capacity and Deprivation**

  Adopting this category does not require us to engage in metaphysical speculation about the value of a soul or existence in the abstract. Instead, we can ground "loss-of-life" damages in the same principle as "loss of earning capacity."

  Earning capacity damages compensate for the loss of the *means* to enjoy life. Hedonic damages compensate for the loss of the *opportunity* to enjoy life. Both are future-oriented. Both rely on counterfactuals (what *would* the person have earned or done?). If we accept the former as calculable, the latter is not categorially distinct, only evidentially different.

  The concern that there is "no one left to compensate" is procedurally answered by the survival statute itself. The estate stands in the shoes of the decedent. The right of action accrues at the moment of injury/death. At that moment, the harm—the truncation of life—becomes fixed. The estate enforces the decedent's right to be made whole for that truncation. The fact that the decedent cannot spend the award is irrelevant; just as wrongful death proceeds often go to heirs, survival proceeds for loss of life are the monetary recognition of the value of the life taken.

  **IV. Drafting Instructions for Administrability**

  The primary risk of adopting this category is not philosophical, but practical: arbitrary jury awards. If we simply tell jurors to compensate for "loss of life," they may resort to guesswork or emotion. To make this instruction workable, and to ensure we are compensating the *decedent's* loss rather than the *survivors'* grief (which is covered under wrongful death), the instruction must focus on objective indicators of the life lost.

  I propose the instruction include the following guidance for calculating these damages:

  1.  **Focus on Activities, Not Existence:** Jurors should be instructed to consider the loss of specific ordinary pleasures and activities the decedent would likely have pursued (e.g., family interactions, hobbies, career milestones), rather than an abstract value of "being alive."
  2.  **Ante-Mortem Evidence:** The calculation must be grounded in evidence of the decedent's health, age, interests, and habits prior to death. This anchors the award in the "Deprivation Account" (what was taken from *this* person) rather than speculative metaphysics.
  3.  **Distinct from Survivor Loss:** The instruction must explicitly distinguish this from the survivors' loss of companionship. This is the estate's claim for what the *decedent* lost, not what the family lost.
  4.  **No Requirement of Consciousness:** The instruction should clarify that the decedent's awareness of the loss is not required. As with loss of earning capacity, the harm lies in the deprivation, not the cognition of the deprivation.

  **V. Conclusion**

  Judge [Name]'s Epicurean argument is a valuable check against inflating damages with metaphysical speculation. It reminds us that we cannot compensate for "suffering" after death. However, it should not prevent us from compensating for the *loss* of the future.

  By adopting the "loss-of-life" category with instructions that focus on the deprivation of life's ordinary goods, we align our model instructions with the intuitive moral judgment that killing is worse than maiming, and with the legal logic that recognizes loss of future capacity as a compensable harm. We acknowledge the harm to the decedent without requiring the decedent to be present to feel it.

  I urge the Committee to vote for adoption, contingent on the drafting of these specific evidentiary guardrails.

  Respectfully submitted,

  [Your Name]
  Committee Member
