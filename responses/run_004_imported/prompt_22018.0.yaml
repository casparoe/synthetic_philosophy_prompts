      *   **The Collective as Idol:** Any collective (state, church, party) tends to become an idol that demands worship over God/Truth. A single party is the ultimate idol.
      *   **Truth is Impersonal:** Truth doesn't belong to a group. It belongs to the individual soul in contact with the divine/good.
      *   **Anarchist/Mystic Strain:** Weil's later work (*The Need for Roots*, *Gravity and Grace*) shows deep suspicion of institutional power. She admired the Languedoc democracies (medieval communes) not because they had one party, but because they were decentralized and focused on local truth.

