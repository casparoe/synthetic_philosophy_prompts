answer: |-
  The invitation said the Town Council would convene at seven to discuss the Matter of the Bridge. Silas arrived at six-forty-five, standing in the rain outside the municipal hall, clutching the wet brim of his hat. He had held the pilings together with his own back for four hours while the floodwaters rose. He had not thought then. He had acted. Now, he was expected to discuss it.

  Inside, the chamber was warm and smelled of lemon oil and old paper. Three committee members sat at the dais: Mr. Henderson, Mrs. Gable, and Mr. Aris. They did not look like judges. They looked like accountants who had lost a ledger.

  "Mr. Vane," Henderson said, not unkindly. "Please. Sit."

  "I'd prefer to stand," Silas said. "You said you had a decision regarding the Medal of Valor."

  "We have been reviewing the… feedback," Mrs. Gable said. She shuffled a stack of papers. None of them bore letterheads or signatures. They were printed slips, anonymous and uniform. "There is a great deal of sentiment regarding the incident."

  "Sentiment?" Silas asked. "The bridge held. The town didn't wash into the sea."

  "Certainly," Aris said, steepling his fingers. "And your contribution is noted. However, the Committee is sensitive to the broader narrative. We must consider how the award reflects on the community as a whole."

  Silas felt a familiar tightening in his chest. It wasn't anger, exactly. It was the sensation of trying to grasp a smoke ring. "I don't understand. I did the work. The medal is for individual bravery."

  "In principle, yes," Henderson said. "But principles are static. The public mood is fluid. We have received numerous communications suggesting that singling out one individual might… distort the reality of the situation."

  "What reality?" Silas asked. "I was there. No one else was."

  "That is precisely the difficulty," Gable said. She picked up one of the anonymous slips. "There is a concern that emphasizing your solitary effort undermines the collective resilience of the town. If the bridge was saved by one man, what does that say about the rest of us? That we were unnecessary? That we were helpless?"

  Silas looked at the three of them. "So you're punishing me because I succeeded where you didn't?"

  "Not punishing," Aris corrected smoothly. "Leveling. It is a matter of equity. We are proposing a revision to the citation."

  "Read it," Silas said.

  Henderson cleared his throat. "'Awarded to Silas Vane, on behalf of the Citizenry, for serving as the vessel through which our shared communal strength was expressed during the flood.'"

  Silas stared at them. "I wasn't a vessel. I was a man holding a beam."

  "Semantics," Gable said. "The point is that the honor must not isolate you. Isolation is dangerous. It creates hierarchy. We are all equal here."

  "Equal?" Silas laughed, a short, dry sound. "I have blisters on my hands that go to the bone. You have ink stains. We are not equal."

  "But we are," Aris said. "In the eyes of the Public, we are. And the Public is the only judge that matters in this age."

  "Who is the Public?" Silas demanded. He stepped forward, leaning on the dais. "You three are sitting here. You signed the invitation. Show me the names on those slips. Show me who says I shouldn't get the medal."

  Henderson looked uncomfortable. He glanced at the slips. "These are aggregations. Trends. It isn't about specific names. It's about… the atmosphere."

  "The atmosphere," Silas repeated. "So if I want to argue, I argue with the air?"

  "You argue with reason," Gable said. "And reason suggests that excessive praise is corrosive. It breeds envy. Not necessarily our envy, you understand, but the general envy. If you are elevated too high, you become a target. We are protecting you, Mr. Vane. By bringing you down to us, we ensure you remain safe among us."

  "I don't want safety," Silas said. "I want truth."

  "Truth is a heavy thing," Aris said. "Opinion is lighter. It circulates. It allows us to discuss the event without being burdened by the event itself. We have discussed the flood endlessly in the papers, in the cafes. We have formed opinions on the structural integrity, on the weather patterns, on your psychological state during the ordeal. This chatter… it sustains us. It keeps the event alive without requiring anyone to actually go out into the rain again."

  Silas realized then that he was not facing opponents. He was facing a mirror that refused to reflect anything distinct. If he struck Henderson, he struck a representative of "the town." If he shouted, he shouted against "consensus." There was no one to hold accountable. They had dissolved themselves into the abstraction they served.

  "If I refuse the award?" Silas asked.

  "Then you refuse the Town," Henderson said softly. "And who can stand against the Town? It is everywhere. It is in the shops, the homes, the conversations you will have tomorrow. It will not hate you. Hate is too passionate. It will simply… discuss you. It will analyze your refusal. It will turn your 'no' into another topic for conversation, another piece of chatter to be consumed over coffee. You will not be a rebel. You will be content."

  Silas looked at the medal sitting on the table. It was gold, but it looked cheap under the electric lights. It was a token for a transaction that hadn't happened. He had given action; they offered reflection.

  "And if I accept?"

  "Then you acknowledge that your deed belongs to all of us," Gable said. "You validate the leveling. You confirm that no one man is greater than the sum of the parts. It is very democratic."

  Silas thought of the cold water, the weight of the wood, the singular, burning focus of those four hours. In that moment, he had been entirely himself. There was no "Public" in the flood. There was only gravity and friction and will. Now, standing in the dry warmth, he was being asked to trade that reality for a ghost story.

  He reached out and touched the medal. It was warm.

  "I understand," Silas said.

  "We knew you would," Aris said, smiling. It was a smile of relief, not triumph. They hadn't won a battle; they had avoided a disturbance. "We'll schedule the ceremony for Friday. The press will be there. We've drafted a speech for you. It emphasizes humility."

  "Keep it," Silas said. "I won't speak."

  "Of course. Silence is also a form of participation. It allows others to project their meanings onto you."

  Silas turned to leave. At the door, he paused. He wanted to say something that would pierce the abstraction, something that would force one of them to stand up and say, *I did this. I decided this.*

  "Who signed the slips?" he asked again, holding up the stack of anonymous papers Henderson had left on the edge of the desk.

  Henderson looked at the papers, then at Silas. For a second, the mask slipped. Silas saw a flicker of shame, a human recognition of the cowardice involved. But then Henderson looked at his colleagues, and the mask settled back into place.

  "It doesn't matter," Henderson said. "They represent the General Voice."

  "The General Voice is silent," Silas said. "It's just you talking to yourselves."

  "Perhaps," Aris said, picking up a pen. "But we are writing the minutes. And the minutes become the history."

  Silas walked out into the rain. It was falling harder now, washing the streets clean. He walked home alone. He knew that on Friday, he would stand on the stage. He knew the crowd would clap. He knew they would feel good about themselves, having successfully absorbed his exception into their rule. They would go home and talk about the ceremony, analyzing his posture, his expression, the appropriateness of the citation. They would feel connected to one another through the discussion, bound by the shared knowledge that no one was allowed to stand too tall.

  He unlocked his door and hung his wet hat on the rack. The house was quiet. There was no one to discuss it with. There was no abstraction here, only the damp wool of his coat and the ache in his shoulders. He sat in his chair and listened to the rain. It was the only thing that spoke without asking for permission, the only thing that fell without checking the consensus of the ground below.

  He closed his eyes and waited for the noise of the town to start again in his head, the endless chatter that would explain away his silence. But for now, there was only the water, and the dark, and the truth that he had held the bridge, and no one else had. That would have to be enough. It was all the Public could not take from him.
