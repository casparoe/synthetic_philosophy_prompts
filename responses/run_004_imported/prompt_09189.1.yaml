      *   *The Public:* It's not a people, a community, or a generation. It's a phantom. It's everyone and no one. It allows individuals to hide behind "what people say." Responsibility is dissolved.
      *   *Leveling:* Not true equality (which is before God/ethical), but a mathematical reduction. Excellence is suspect. The exceptional individual is pulled down to the average. It's a negative unity.
      *   *Envy:* Not just wanting what someone has, but a secret admiration mixed with resentment. It prevents celebration of the great. It keeps everyone on the same flat plane. "If he succeeds, we pull him down; if he fails, we laugh."
      *   *Chatter:* Talk without action. Reflection without decision. Knowing everything but doing nothing. Opinion becomes currency.

