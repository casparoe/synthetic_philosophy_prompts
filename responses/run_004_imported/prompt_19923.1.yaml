answer: |-
  This is one of the most difficult ethical and aesthetic tightropes a writer can walk. You are navigating the tension between *mimetic fidelity* (the duty to represent the truth of a time and place) and *ethical responsibility* (the duty not to inflict unnecessary harm, particularly on those whose trauma is being depicted).

  Your early readers represent the two poles of a legitimate debate. Reader B argues from the tradition of realism and free expression: to sanitize the dialogue is to lie about the nature of the evil. Reader A argues from the tradition of trauma-informed ethics: some representations replicate the violence they seek to condemn.

  There is no absolute rule that will solve this for you, but there is a principled framework you can use to test whether your "quoting" defense holds. Here are four considerations to help you determine where that defense runs out.

  ### 1. The Curator's Responsibility
  The defense "I am only quoting him" relies on the idea that dialogue is a separate sphere from the author's voice. In practice, it is not. You are the curator of every word on the page. By including the slur, you are not merely reporting that racism occurred; you are making the reader inhabit the sonic reality of that racism, however briefly.

  The question is not whether the character *would* say it (he clearly would), but whether the reader *needs to hear it* to understand the indictment.
  *   **The Test:** If you removed the specific word but kept the scene's action, the power dynamic, and the aftermath, would the reader's understanding of the policeman's cruelty diminish? If the answer is "no," then the word is decorative, not structural. If the answer is "yes," you must ask *why* it is structurally necessary. Is it necessary for the white reader to feel shock, or for the Black character's pain to be validated?

  ### 2. The Specificity of the Context
  You are not writing about generic racism. You are writing about the South African State of Emergency, and the specific slur you are referencing is not merely an insult; it was a linguistic instrument of the state's violence. In that context, the word functioned as a verbal cuff, a prelude to physical abuse, and a marker of sub-human status.

  Reader A's reaction suggests that for those who lived under that system, the word is not a signifier of racism; it is a trigger of the trauma itself.
  *   **The Test:** Distinguish between *depicting* racism and *deploying* it. Depicting racism involves showing the mechanics of oppression. Deploying it involves using the actual tools of oppression (the slur) to achieve a literary effect. If the effect you are achieving (shock, realism) relies on the reader feeling a fraction of the dehumanization Black South Africans felt, you must ask if it is ethical to ask Black readers specifically to pay that tax.

  ### 3. The Distribution of Burden
  This is perhaps the most critical ethical metric. Who bears the cost of your artistic choice?
  *   **The White Reader:** May feel discomfort, shock, or moral clarity. This is often the intended "indictment."
  *   **The Black Reader (specifically those with lived experience):** May feel re-traumatization, alienation, or a sense that their pain is being used as set dressing.

  If the "indictment" of the system relies on Black readers enduring the slur to validate the realism of the white protagonist's cruelty, the burden of your moral argument is falling disproportionately on the victims of the cruelty.
  *   **The Test:** Does the presence of the word serve the victims (by honoring the truth of their experience) or the perpetrator (by fleshing out his character)? You mentioned later chapters shift to the victims' POV. Do those chapters require the echo of that specific word to land, or do they stand on the weight of the actions themselves?

  ### 4. The "Truth" of the TRC vs. The Truth of Fiction
  You mention using TRC testimony for texture. It is worth noting the function of the TRC itself. While it was about uncovering truth, it was also about *restoration*. Many victims chose not to hear the specifics of their loved ones' deaths to preserve their own sanity. The TRC acknowledged that some truths are too heavy to be carried without support.

  Fiction does not have the same restorative mechanisms as a truth commission. A reader closes the book and returns to a world where that language still exists.
  *   **The Test:** Is your commitment to "not softening it" a commitment to historical accuracy, or is it a commitment to your own authorial autonomy? There is a difference between a "small dishonesty" and a protective omission. If you describe the *effect* of the word—the silence that follows, the flinch of the victim, the coldness in the air—you may be telling a deeper truth about the violence than by printing the phonetics.

  ### A Possible Middle Path
  You do not necessarily have to choose between "printing the slur" and "sanitizing history." There are narrative techniques that convey the weight without the wound:

  1.  **The Ellipsis of Horror:** You can indicate the word was spoken without printing it, focusing entirely on the reaction. *He said the word that turned men into boys, and the room went still.* This acknowledges the word's power without reproducing it.
  2.  **The Translation of Power:** Describe the word not linguistically but physically. Describe it as a spit, a blow, a revocation of citizenship. This aligns with your goal of indicting the system rather than just the man.
  3.  **The Victim's Gaze:** If you keep the word, ensure the immediate narrative focus following the slur is not the policeman's toughness, but the victim's interiority. If the reader is forced to sit with the victim's humiliation immediately after the word is spoken, it prevents the word from becoming a badge of the policeman's "edginess."

  ### Conclusion
  Reader B is right that taken to the logical limit, their argument forbids depicting racism. But Reader A is right that some depictions cross from *representation* into *replication*.

  The "quoting" defense runs out at the point where the inclusion of the word ceases to illuminate the system and begins to replicate its violence upon the reader. If Reader A, whose lived experience validates the reality you are depicting, tells you the word causes harm that the context cannot undo, that is data you cannot ignore.

  You might consider this: The ultimate indictment of the apartheid system is not that it allowed white men to say that word; it is that the word had the power to destroy lives. If you can convey the destruction without printing the word, you may find you have written a scene that is more truthful, because it centers the damage rather than the weapon.
