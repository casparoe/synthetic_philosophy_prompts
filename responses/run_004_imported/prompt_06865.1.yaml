answer: |-
  Good evening, everyone. For those who don't know me, I'm the person who writes the program notes. I'm also currently finishing a philosophy PhD, which is why our Artistic Director told me I'm the "smart person" for the job tonight. I suspect she just needed someone who could talk for four minutes without asking for a raise.

  But since I'm standing here, and since I know what some of you are thinking, I want to address the elephant in the room. Or rather, the stone statue in the banquet hall.

  I know the question. I hear it at every intermission. "Why *Don Giovanni*? Why not *La Bohème*? *Bohème* is safe. People understand dying of tuberculosis. They don't understand a stone statue crashing dinner to drag a man to hell."

  It is a fair question. Especially for a company like ours, where every ticket sale feels like a miracle. Why program the absurd?

  The philosopher Bernard Williams, who wrote brilliantly about Mozart, argued that complaining opera is "absurd" because people sing while they die is actually a misunderstanding of what opera *is*. He suggested that if you want realism, you go to the theater. Opera isn't trying to mimic the way we speak; it's trying to reveal the way we *feel*.

  In real life, we hide our true selves behind polite conversation. In opera, the music tears that mask off. When Mimi dies in *Bohème*, it is heartbreaking. But it is sentimental. It confirms what we already know about sadness.

  *Don Giovanni* is different. Williams argued that Giovanni isn't just a villain; he is a force of energy that refuses to be categorized. He doesn't sing about his feelings; his music *is* his will. He lives entirely in the present moment. That is terrifying. And that is why society—the other characters, the moral order, the stone statue—has to destroy him.

  If we staged *Bohème* tonight, we would be offering you a safe cry. We would be telling you that art is a comfort. But this company, perpetually broke and perpetually stubborn, isn't in the business of comfort. We are in the business of vitality.

  Williams noted that the "absurdity" of the statue isn't a special effect gimmick. It is the moment reality finally catches up with a man who thought he could outrun consequences forever. It is the collision between human desire and the limits of the world.

  That is a risky thing to stage. It's a risky thing to fund. I know many of you are here because you support the arts, even if you secretly think a man singing a catalogue of his conquests is a bit much. But I ask you to lean into that absurdity tonight.

  Don't watch for the realism. Watch for the truth that only music can tell. Watch for the energy that refuses to be tamed, even when the stone guest arrives.

  So, if you would raise your glasses.

  To Bernard Williams, for giving us the words. To Mozart and Da Ponte, for giving us the music. And to all of you, for having the courage to fund the absurd, rather than the safe.

  To *Don Giovanni*. Cheers.
