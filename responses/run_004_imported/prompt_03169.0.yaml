answer: |-
  This is one of the best philosophical rabbit holes to fall down, and you've grasped the core tension perfectly. Radford says we are irrational messes; Walton says we are rational players of a game.

  To make the strongest case for Radford, we have to argue that Walton's solution is essentially semantic sleight-of-hand. He doesn't solve the paradox; he dissolves it by redefining the terms so narrowly that they no longer match human experience. Radford, by contrast, respects the intensity of the experience enough to call it what it is: a genuine contradiction in the human psyche.

  Here is the case for Radford, and why Walton's "quasi-emotion" is a distinction without a difference.

  ### 1. The Phenomenological Argument: If it hurts, it's real
  The strongest argument for Radford is phenomenological: it focuses on what the experience *feels like* from the inside.

  When you watch *Anna Karenina* throw herself under the train, your chest tightens, your throat constricts, and you feel a pang of grief. When Charles watches the green slime, his heart races, his palms sweat, and he grips the chair.

  Walton argues that because Charles knows the slime isn't real, he isn't experiencing *fear*, but *quasi-fear*. But ask yourself: What is the difference? If I prick your finger with a real needle, you feel pain. If I prick your finger with a fake needle in a VR simulation, but your nerves fire the exact same way and you feel the exact same sting, is it "quasi-pain"?

  No. It's pain. The *cause* might be illusory, but the *sensation* is not.

  Radford wins here because he acknowledges that the emotion itself is the primary reality. To the person crying, the sadness is not "quasi." It is actual sadness. By labeling it "quasi," Walton is prioritizing the *object* of the emotion (Anna) over the *subject* of the emotion (You). Radford correctly identifies that the paradox lies in the fact that **real effects are being produced by non-existent causes.** Walton tries to sanitize this by saying the effects aren't "real emotions," which feels like gaslighting the viewer. Radford's honesty—that we are genuinely moved by nothing—is a more accurate description of the human condition.

  ### 2. The "Action Tendency" Flaw
  Walton's specific defense regarding Charles is that a truly fearful person would flee or call the police. Since Charles stays in his seat, he isn't *really* scared.

  This is the weakest link in Walton's armor, and Radford would tear it apart. The assumption that "real emotion always leads to corresponding action" is empirically false, even in real-life scenarios.

  Consider a person watching their spouse die of a terminal illness in a hospital bed. They feel profound fear and grief. Do they run? Do they call the police? No. They sit in the chair. They are helpless. The lack of action does not negate the reality of the fear; it merely reflects the context of **helplessness.**

  When we watch fiction, we are in a state of total helplessness. We cannot save Anna Karenina. We cannot shoot the green slime. The lack of action isn't proof that the emotion is "quasi"; it's proof that the situation renders action futile. Radford's view accommodates this: we feel the emotion (fear/sadness), we recognize the object is unreachable (fiction), and we sit there in irrational distress. Walton tries to use the lack of action to prove the emotion isn't real, but real life is full of "inactionable" emotions. Radford's framework handles helplessness better than Walton's.

  ### 3. Addressing the Comeback: The "Intentional Object" Defense
  You asked specifically to deal with the obvious comeback: *Walton isn't denying Charles's heart rate is real; he's denying that the heart rate constitutes "fear" because fear requires a belief in the object.*

  This is Walton's strongest technical point. He defines emotion as a package deal: **Physiology + Belief.** If you remove Belief, you don't have Emotion; you have Quasi-Emotion.

  Here is why Radford still wins this exchange: **Walton is solving a logical problem by sacrificing the psychological truth.**

  Walton is essentially protecting the definition of "Rationality." He wants to prove that humans are consistent. To do that, he has to argue that what feels like fear *isn't* fear. He is saving the subject (Charles) from the charge of irrationality by downgrading the emotion.

  Radford, however, argues that **humans are inherently inconsistent.**

  If you accept Radford, you accept that human cognition is not a sealed logical system. We are capable of holding two contradictory states simultaneously:
  1.  "Anna does not exist." (Cognitive Belief)
  2.  "Anna is suffering, and that is terrible." (Emotional Belief)

  Walton says, "State 2 isn't a real belief, it's a make-believe belief."
  Radford says, "State 2 is a real emotional response, and it contradicts State 1."

  Why is Radford better? Because Walton's explanation requires us to believe we are constantly engaged in a complex game of "make-believe" that we aren't consciously playing. When I cry at a movie, I am not thinking, *"I am now engaging in a pretense of sadness."* I am just sad.

  Radford takes the experience at face value. He argues that art bypasses our rational belief-checking mechanisms. The emotion is real, the belief is absent, and that makes the emotion **irrational.** Walton tries to tell us the emotion is *rational* because it's only "quasi." But that doesn't match the data. The tears are saltwater, not "quasi-saltwater." The cortisol spike is real, not "quasi-cortisol."

  By insisting on the term "quasi," Walton is essentially saying, "You aren't really feeling what you think you're feeling." Radford says, "You are really feeling it, which is weird, because you know it's not real." Radford's position is more humble before the mystery of consciousness. He admits we are paradoxical creatures. Walton tries to turn us into logical computers.

  ### 4. The Neuroscientific Verdict
  Modern neuroscience actually backs Radford over Walton. fMRI studies show that when we process social pain in fiction (like a character being ostracized), the same neural pathways light up as when we experience real social pain (the anterior cingulate cortex).

  The brain does not have a "fiction switch." It does not process the input as "make-believe" before sending it to the emotional centers. The signal hits the amygdala *before* the prefrontal cortex has time to remind you, "This is a movie."

  Walton's theory requires a level of cognitive distance that simply doesn't exist in the moment of engagement. If the brain processes the stimulus as real, the resulting emotion is real. If the emotion is real, but the object is fake, then Radford is right: **The system is malfunctioning.**

  Walton calls it "functioning correctly within the rules of make-believe."
  Radford calls it "functioning irrationally regarding reality."

  Given that the biology treats it as reality, Radford's label of "irrationality" is more scientifically accurate than Walton's "make-believe." We are tricking our own biology. That is an irrational process, even if it's a pleasant one.

  ### The Conclusion
  Walton solves the *logical* paradox by denying the premise that we feel real emotions. He makes the world safe for rationality.
  Radford solves the *human* paradox by accepting that we are not purely rational beings.

  Walton's "quasi-fear" is indeed a fancier name for the same thing, but it's a name designed to exonerate us. Radford indicts us. He says, "Yes, you are crying over a lie. Yes, it is inconsistent. Yes, it is irrational."

  And that is the stronger case. Because when you leave the theater and your eyes are red from crying, you don't feel like you just finished a game of make-believe. You feel like you just went through something real. Radford honors that feeling. Walton explains it away. In philosophy, the theory that best accounts for the raw data of experience without explaining it away is usually the superior one. Radford respects the tears; Walton respects the logic. Since the paradox is about the *tears*, Radford wins.
