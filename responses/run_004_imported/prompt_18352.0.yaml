      *   *Check Mechanism:* Reality (did the event actually occur?).
      *   *Crucial Difference:* In the gas gauge case, Roxanne *only* has the gauge to tell her if the tank is full. In the prediction case, the user (presumably) finds out if the event happened through *other* means (news, observation, verification), not just by re-asking their intuition.

