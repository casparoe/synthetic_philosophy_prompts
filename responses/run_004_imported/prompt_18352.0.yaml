      *   *Point 1: The Independence Advantage.* The strongest defense is that reality provides the check, not the faculty itself. If the verification of the prediction is independent of the judgment being tested, it's not bootstrapping. It's empirical testing.
      *   *Point 2: The Verification Bottleneck.* Where does the verification come from? If I predict "Stock X will rise" and verify it by looking at my brokerage app, is the app reliable? If I trust the app because of my judgment, we have a loop. The user needs to ensure the *feedback signal* is epistemically independent.
      *   *Point 3: Domain Specificity vs. General Reliability.* Bootstrapping often attacks the move from "Process P worked in instances 1-n" to "Process P is reliable generally." Tracking helps with specific domains (e.g., "I'm good at sports predictions") but might not bootstrap to "I'm good at everything." This limits the scope of the warrant.
      *   *Point 4: Defeasibility.* Bootstrapping suggests the knowledge is "too easy" (immune to defeat). A track record is *not* immune. If I get a string of losses, my warrant drops. This makes it more robust than the classic bootstrapping case.
