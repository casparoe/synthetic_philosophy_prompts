      *   *The "Meet" of Partitions:* Common knowledge corresponds to the *meet* of the partitions ($\Pi_i \wedge \Pi_j$). An event is common knowledge at $\omega$ if it holds for the entire cell of the meet containing $\omega$.
      *   *The Failure Point:* If we only have finite iteration (say, level $k$), we are effectively restricting the "reach" of the information flow.
