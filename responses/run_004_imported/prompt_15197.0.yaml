prompt: |-
  I'm the only non-lawyer on my county DA's Conviction Integrity Unit panel, added specifically so the review of old cases doesn't stay entirely in-house. We're currently looking at a twenty-two-year-old murder conviction built on a confession and two eyewitness identifications; new DNA testing has just excluded the convicted man from the crime-scene evidence. The retired detective who built the original case, whom the rest of the panel still speaks of with real respect, says the DNA result changes nothing for him: he's certain of the man's guilt from the years he spent on the investigation, and takes it as given that the sample was somehow contaminated or mishandled, without having looked into how. A couple of panel members want to treat his certainty as a reason to slow down before reopening anything; others think that gets the burden of proof backwards. Please draft the short memo I'll bring to our next meeting: it should recommend a concrete next step with a rough timeframe, and it should take the detective's position seriously on its own terms rather than simply asserting that the new evidence outweighs it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Non-lawyer member of a County DA's Conviction Integrity Unit (CIU) panel.
      *   **Context:** Reviewing a 22-year-old murder conviction based on confession + 2 eyewitness IDs. New DNA excludes the convicted man.
      *   **Conflict:** A respected retired detective (original investigator) insists the DNA doesn't matter (contamination/mishandling assumed, not investigated) and stands by his certainty. Some panel members want to slow down because of his certainty; others think this reverses the burden of proof.
      *   **Task:** Draft a short memo for the next meeting.
      *   **Requirements:**
          *   Recommend a concrete next step with a rough timeframe.
          *   Take the detective's position seriously (don't just dismiss it as "new evidence wins").
          *   Maintain professional, objective tone suitable for a CIU panel.

  2.  **Determine the Goal of the Memo:**
      *   The goal isn't to declare innocence or guilt immediately. It's to propose a *process* to resolve the conflict between the DNA exclusion and the original investigative certainty.
      *   It needs to bridge the gap between the "slow down" camp (respecting the detective) and the "burden of proof" camp (respecting the science).
      *   The concrete step should be an *investigation into the chain of custody/testing process* to validate or invalidate the detective's hypothesis (contamination).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the gravity of the situation (22 years, murder conviction, new DNA).
      *   **Addressing the Detective's Concern (Crucial Step):** I need to validate the retired detective's experience without validating his conclusion. His concern about contamination is *theoretically* valid in forensics, even if unsubstantiated here. Framing it as "verifying the integrity of the new testing" respects his skepticism while moving the process forward.
      *   **The Conflict:** Briefly acknowledge the tension between the original evidence (confession/IDs) and the new evidence (DNA), and the detective's stance.
      *   **Recommendation (Concrete Next Step):** What actually needs to happen? We need to know if the DNA testing was solid.
          *   Action: Audit the chain of custody and lab protocols for the *new* testing.
          *   Action: Re-interview the original evidence custodians if possible (or review logs).
          *   Timeframe: Needs to be realistic but urgent. 30-45 days?
      *   **Rationale:** Why this step? It addresses the detective's specific worry (contamination) objectively. If the testing holds up, his certainty becomes harder to sustain without new justification. If it doesn't, the CIU avoids a wrongful exoneration based on bad science. This satisfies both sides of the panel.
      *   **Closing:** Reiterate the CIU's mission (justice/integrity).

  4.  **Refining the Tone:**
      *   *Avoid:* "The detective is wrong," "We must exonerate," "This is obvious."
      *   *Use:* "Due diligence," "Verifying integrity," "Objective assessment," "Respecting investigative experience."
      *   *Key Insight:* The detective's argument is essentially a hypothesis: "The DNA is wrong because of contamination." The scientific method requires testing that hypothesis, not accepting it on authority. The memo should frame the next step as *testing that hypothesis*.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey team, about the Smith case. DNA says not him. Detective says DNA is bad. We need to check if DNA is bad. Let's hire an expert to look at the lab work. Give it a month. This respects the detective by checking his theory but keeps us moving.

  6.  **Drafting - Iteration 2 (Adding Professional Polish):**
