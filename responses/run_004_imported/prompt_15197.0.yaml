      *   We have a conflict. Old evidence vs. New DNA. Detective X says contamination.
      *   We shouldn't ignore Detective X because he built the case. But we can't stop either.
      *   Proposal: Let's audit the new DNA testing. Check chain of custody.
      *   Time: 30 days.
      *   This proves if the detective's worry is real.

  7.  **Drafting - Iteration 3 (Final Polish per constraints):**
      *   Make sure it explicitly acknowledges the detective's reputation.
      *   Make sure it doesn't sound like I'm taking sides, but rather facilitating the truth.
      *   Ensure the recommendation is specific (independent audit/review of lab protocols).
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm attacking the detective. Frame his skepticism as a "quality control check" that the CIU should welcome.

  8.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Concrete next step? Yes (Independent forensic audit).
      *   Rough timeframe? Yes (30-45 days).
      *   Take detective's position seriously? Yes (Frames his concern as a necessary verification step).
      *   Non-lawyer perspective? Yes (Focuses on process/logic rather than legal statutes).

  9.  **Final Polish:** (Produces the provided output). I will ensure the language is diplomatic but firm on the need for verification. The core argument is: "To honor the detective's experience, we must verify his hypothesis about contamination, not just accept it."

  *(Self-Correction Note)*: Wait, I should ensure I don't overstep my role as a non-lawyer. I am making a procedural recommendation, not a legal determination. The tone should be collaborative.

