      *   *Nuance:* Hegel distinguishes between the courage of the individual (feudal) and the courage of the citizen (modern). Modern courage is about discipline. But discipline without risk is just labor. The "ethical health" comes from the *finitude* of human life being placed at the disposal of the Universal.
