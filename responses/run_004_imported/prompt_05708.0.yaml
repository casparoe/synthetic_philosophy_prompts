answer: |-
  Your intuition is correct, and your friend is running into one of the most famous problems in formal epistemology: **the problem of logical omniscience.**

  While her argument is valid within the framework of *ideal* Bayesianism, it relies on a norm that is widely rejected as a requirement for *human* rationality. Here is the breakdown of where the argument goes wrong, tailored to your background.

  ### 1. The Principle of Logical Omniscience
  Your friend's argument rests on the standard Bayesian axiom that a rational credence function $P$ must satisfy:
  $$ \text{If } \vdash A, \text{ then } P(A) = 1 $$
  Since the Collatz Conjecture ($C$) is a statement of arithmetic, it is either necessarily true or necessarily false (assuming standard arithmetic). Therefore, an ideal reasoner must assign $P(C) = 1$ or $P(C) = 0$.

  This requirement is known as **Logical Omniscience**. It implies that a rational agent knows all logical consequences of their beliefs and assigns extreme credences to all necessary truths. As you noted, this makes learning mathematics impossible (why investigate a conjecture if you are already rationally required to be certain of its truth value?) and renders almost all actual humans irrational.

  Most contemporary formal epistemologists (e.g., Garber 1983, Hacking 1967, Eells 1985) agree that while Logical Omniscience might characterize an *ideal* god-like agent, it is not a norm for *rational* bounded agents. Rationality is sensitive to computational limits and proof accessibility.

  ### 2. The Dutch Book Flaw
  Your friend claims that assigning $P(C) = 0.5$ leaves you exposed to a Dutch Book (a sequence of fair bets guaranteeing a loss). This is technically true **only if the bookie is logically omniscient.**

  To Dutch Book you on a necessary truth $C$ where you assign $P(C) = 0.5$:
  1.  The bookie must know that $C$ is true (or false).
  2.  If $C$ is true, the bookie sells you a bet on $C$ for $\$0.60$ that pays $\$1.00$. You accept (since your fair price is $\$0.50$, wait—if your price is 0.5, you wouldn't buy at 0.6).
      *   *Correction:* If $P(C)=0.5$, you are willing to buy a ticket for $\$0.50$ that pays $\$1$ if $C$.
      *   If $C$ is necessary, the bookie knows you will win. The bookie loses.
      *   To Dutch *you* (make you lose), the bookie needs to sell you a bet on $\neg C$ or buy a bet on $C$ from you.
      *   If $C$ is true, and you assign $P(C)=0.5$, you are willing to *sell* a ticket on $C$ for $\$0.50$ (paying $\$1$ if $C$). The bookie buys it from you. You collect $\$0.50$, but since $C$ is true, you must pay $\$1.00$. You lose $\$0.50$.

  **The Catch:** This "guaranteed loss" is only guaranteed from the perspective of an agent who *knows* the truth value of $C$. If the bookie is also ignorant of the Collatz Conjecture (which they are), they cannot construct this book. They do not know whether to buy or sell the bet on $C$ to ensure your loss.

  Therefore, the Dutch Book argument fails to establish *pragmatic* irrationality in this context. You are only vulnerable to a bookie who possesses information (the proof) that you lack. Rationality norms generally do not require immunity to exploitation by omniscient beings, only immunity to exploitation based on information available to the agents involved.

  ### 3. Logical Uncertainty and Logical Induction
  In the last decade, this specific problem has been addressed formally under the heading of **Logical Uncertainty**.

  The standard probability axioms are insufficient for reasoning about logical statements whose truth values are unknown. Recent work, most notably the **Logical Induction** criterion (Garrabrant et al., 2016), provides a formal framework where a reasoner can assign non-extreme probabilities to mathematical conjectures without being "Dutch Booked" in a computable sense.

  A logical inducer assigns credences to logical sentences over time. While they will eventually converge to 0 or 1 for provable statements, they are not required to be 0 or 1 *before* the proof is found. Crucially, they cannot be exploited by any *polynomial-time* trader (bookie). Since no polynomial-time trader knows the truth value of Collatz (otherwise P would likely equal NP or we'd have a proof), you are safe from a realistic Dutch Book.

  ### 4. The Resolution Conditions of the Bet
  There is a pragmatic layer to your bet as well. When philosophers or mathematicians bet on conjectures, the resolution condition is rarely "Is $C$ true in the standard model of arithmetic?" (which is fixed but unknown). It is almost always "Is $C$ proven or disproven within a specified timeframe?"

  If the bet resolves on *proof*, the proposition is not a necessary truth in the epistemic sense; it is a contingent fact about the mathematical community's future state of knowledge. In that case, $P(C) = 0.5$ is perfectly coherent, as it reflects the subjective likelihood of a proof emerging, not the metaphysical status of the numbers.

  ### Conclusion
  Your friend is applying an **idealized norm (Logical Omniscience)** to a **non-ideal context (human mathematical inquiry)**.

  *   **Is she right technically?** Within the strict axioms of standard Bayesianism, yes, those axioms require logical omniscience.
  *   **Is she right philosophically?** No. Those axioms are widely acknowledged to be inadequate for modeling rational belief in logical truths.
  *   **Is she right about the Dutch Book?** No. The Dutch Book requires an omniscient bookie. Against a fellow ignorant PhD student, your 0.5 credence is coherent.

  You should collect your dinner. The flaw is in the premise that rationality requires certainty about all necessary truths. If that were true, we couldn't rationally investigate any open mathematical problem.

  **Suggested reading to send her:**
  *   Daniel Garber, "Old Evidence and Logical Omniscience in Bayesian Confirmation Theory" (1983).
  *   Garrabrant et al., "Logical Induction" (2016).
  *   Ian Hacking, "Slightly More Realistic Personal Probability" (1967).
