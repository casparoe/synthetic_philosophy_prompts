prompt: |-
  My younger sister, Ingrid, is getting married next month, and I've been asked to give the toast at the reception, largely, I suspect, because I'm the sibling who writes about ideas for a living and can be trusted not to embarrass her in front of her entire philosophy department. Ingrid has built her career on Wittgenstein's On Certainty, and specifically on "hinge propositions" — those bedrock certainties (that the earth existed long before I was born, that this is my hand, that memory is broadly reliable) which Wittgenstein argued are never actually known or evidentially justified in the ordinary sense, but simply have to stand fast, unquestioned, before any doubting or reasoning can get going at all. I've absorbed a fair amount of this secondhand, from a decade of family dinners and from covering the politics of expertise and public trust for my own beat, which overlaps with hinge epistemology rather more than I would have guessed.

  Her fiancé, Sam, is a structural engineer, and in structural engineering a hinge is itself a precise technical term for a joint that permits rotation while still carrying load, which means every person in her cohort has already made the obvious joke about a woman who studies hinges marrying a man who designs them. I would like to retire that joke rather than repeat it. What I actually need is a toast, four or five minutes long, that uses her real philosophical commitments as its structural logic without ever tipping into an actual philosophy lecture: roughly a third of the room — her advisor, her co-authors, the graduate students she supervises — will know this material cold and wince at a wrong move, while the rest, including our parents, need it to work as a warm, legible tribute with no background required. The one move I cannot afford, because she would correct me on the spot, is describing her certainty about Sam as a very well-justified belief ("I've never been more sure of anything") or as a leap of faith taken once the evidence ran out — both quietly misstate her own position, which is that some certainties are not graded conclusions awaiting more support, and are not acts of faith either, but the ground on which the marriage's ordinary, everyday doubts and disagreements get to stand. Could you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Older sibling of the bride (Ingrid). Writes about ideas/politics/expertise for a living.
      *   **Audience:** Mixed. ~1/3 Philosophy department (advisor, co-authors, students) who know Wittgenstein's *On Certainty* and "hinge propositions" intimately. ~2/3 Family/Friends (including parents) who need it to be warm and accessible.
      *   **Bride (Ingrid):** Career built on Wittgenstein's *On Certainty*, specifically "hinge propositions" (bedrock certainties that are not empirically justified but must stand fast for inquiry to happen). She is precise and will correct misstatements.
      *   **Groom (Sam):** Structural Engineer.
      *   **Constraint 1 (The Joke):** Do *not* make the "hinge philosopher marries hinge engineer" joke. It's too obvious and needs retiring.
      *   **Constraint 2 (The Philosophy):** Do *not* describe her love as "highly justified belief" (empiricism) or "leap of faith" (fideism). It must be framed as a *hinge*: a ground on which doubt/reasoning happens, not a conclusion reached by them.
      *   **Length:** 4-5 minutes spoken (approx. 600-750 words).
      *   **Tone:** Warm, legible, intellectually respectful but not lecture-y.

  2.  **Deconstruct the Philosophy (Wittgenstein's *On Certainty*):**
      *   *Hinge Propositions:* Things like "The world exists," "I have hands." We don't prove them; we act on them. If you doubt them, the language game stops.
      *   *Application to Marriage:* Marriage isn't a hypothesis tested daily. It's the framework within which daily tests happen. You don't wake up and prove your spouse loves you using evidence; you wake up *within* the certainty of that love, and then you argue about dishes or finances.
      *   *Avoid:* "I have so much evidence Sam is great" (Justificationism). "I just have faith" (Fideism).
      *   *Embrace:* "This love is the floor we walk on."

  3.  **Deconstruct the Engineering Connection (without the pun):**
      *   Sam designs structures. Structures need foundations.
      *   Ingrid studies the foundations of thought.
      *   Connection: Both care about what holds things up when the wind blows. Not "hinges" as joints, but "hinges" as the pivot points of reality.
      *   *Idea:* Focus on *load-bearing*. What carries the weight?

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role. Self-deprecating humor about being the "writer" sibling. Establish the stakes (don't embarrass her in front of her department).
      *   **The Philosophy (Light Touch):** Introduce Ingrid's work without jargon overload. Use the "world exists" example. Make it relatable.
      *   **The Pivot to Sam/Marriage:** How does this apply to love? Avoid the "justified belief" trap.
      *   **The Engineering Connection:** Acknowledge Sam's job. Connect structure to certainty. Avoid the "hinge joint" pun. Focus on *standing fast*.
      *   **The Core Message:** Marriage as a hinge. It's not the question; it's the background for the questions.
      *   **Closing:** Warm wish for the future. Raise a glass.

  5.  **Refining the Philosophy (Crucial Step):**
      *   *Drafting thought:* "Ingrid knows Sam is the one." -> *Correction:* No, that sounds like a conclusion.
      *   *Better:* "Ingrid doesn't treat Sam as a hypothesis."
      *   *Drafting thought:* "It's a leap of faith." -> *Correction:* No, the prompt explicitly forbids "leap of faith."
      *   *Better:* "It's the ground they stand on."
      *   *Key Wittgenstein phrase:* "Stand fast." Use this. It resonates with engineering too.

  6.  **Refining the Tone:**
      *   Needs to sound like a sibling. Warm, slightly protective, proud.
      *   Needs to signal to the philosophers: "I know the material." (Use specific terminology correctly).
      *   Needs to signal to the parents: "This is about love." (Translate the terminology into emotion).

  7.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the writer. Ingrid is the thinker. She studies hinges. Sam builds them. I won't make that joke. Ingrid says we can't prove the world exists, we just live in it. Same with marriage. You don't prove you love each other every day. You just do. Sam builds bridges that stay up. Ingrid builds thoughts that stay up. Together they are strong. Cheers.
      *Critique:* Too dry. Needs more heart. Needs to be more precise on the "no justification" rule.

  8.  **Drafting - Iteration 2 (Focusing on the "Stand Fast" concept):**
      Start with the pressure of speaking to philosophers. Explain *On Certainty* using the "hand" example. Transition to how we usually talk about love (evidence vs. faith). Explain why Ingrid rejects both. It's a hinge. It allows doubt about small things (dishes) because the big thing (us) is fixed. Sam understands load-bearing. This marriage is load-bearing.
      *Check:* Did I make the hinge joke? No. Did I call it a leap of faith? No. Did I call it justified belief? No.

  9.  **Writing the Toast (incorporating sensory details and rhythm):**
      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 4 minutes = ~550 words. 5 minutes = ~700 words. I should aim for around 650-700 to allow for pauses and laughter.
      *   *Specific Wittgenstein nod:* Mention "riverbed" or "stand fast." "Stand fast" is better for engineering overlap.
      *   *Specific Engineering nod:* "Load," "Structure," "Foundation."

  10. **Final Polish:**
      *   Ensure the distinction between "doubt within the system" vs "doubt about the system" is clear but emotional.
      *   Make sure the parents feel included (the "ordinary life" aspect).
      *   Check the ending for warmth.

      *(Self-Correction during drafting)*: I need to be careful not to make Ingrid sound cold or robotic. Wittgenstein can sound dry. Emphasize that this *allows* for warmth and safety. The certainty provides safety.

      *(Refining the "No Joke" rule)*: I should explicitly acknowledge the elephant in the room without making the pun. "I know what you're thinking... I'm not going to say it." This shows awareness without committing the sin.

      *(Refining the Philosophy)*: Ensure I don't say "hinge propositions are true." Wittgenstein says they are *exempt from verification*. They are the scaffolding. I need to convey that this makes the love *more* secure, not less examined.

  11. **Final Review against constraints:**
      *   4-5 mins? Yes.
      *   No hinge joint joke? Yes.
      *   No "justified belief"? Yes.
      *   No "leap of faith"? Yes.
      *   Philosophers won't wince? (Using "stand fast," avoiding "truth claims" about hinges).
      *   Parents understand? (Metaphor of foundation/ground).

      *Let's write.*
answer: |-
  Good evening. For those who don't know me, I'm the older sibling. I'm also the one who writes for a living, which is why I'm holding the microphone. Ingrid tells me this is because I can be trusted to articulate complex ideas clearly. I suspect it's because if she gave me the microphone, she'd spend the whole reception correcting my syntax.

  Speaking of corrections: I am acutely aware that roughly a third of this room holds advanced degrees in philosophy. I know that if I misuse a term, I will hear about it during the dissertation defense later. So, I'm going to tread carefully.

  Ingrid has spent her career studying Wittgenstein's *On Certainty*. For the rest of you, the shorthand version is this: We spend most of our lives asking questions and demanding evidence. But for that questioning to make sense, some things have to remain unquestioned. Things like "the earth exists," or "my name is Ingrid." Wittgenstein called these "hinge propositions." They aren't conclusions we reach after looking at the data. They are the ground we stand on *while* we look at the data. They don't need to be proven; they need to *stand fast*.

  Now, when people talk about marriage, they usually reach for one of two metaphors. They talk about love as a conclusion: "I have weighed the evidence, and you are the optimal partner." Or, they talk about love as a leap of faith: "I have no evidence, but I'm jumping anyway."

  Knowing Ingrid, I know she rejects both. To treat Sam as a hypothesis to be tested every morning would be exhausting. But to treat him as a blind gamble would be irresponsible.

  Instead, I think she sees what they have built as a hinge.

  In a marriage, you will absolutely have doubts. You will have disagreements about finances, or where to live, or whose turn it is to do the dishes. Those are ordinary doubts. They are the work of the marriage. But those doubts only make sense against a background of certainty. You don't wake up and ask, "Are we still married?" before you ask, "Who is making coffee?" The certainty of the union is what allows you to navigate the uncertainty of the day.

  Sam, you are a structural engineer. You know better than anyone that a building doesn't survive the wind because every single beam is flexible. It survives because the load-bearing walls stand fast. They hold the weight so the rest of the structure can move, breathe, and settle without collapsing.

  Ingrid, you have spent your life studying what it means for something to hold the weight of our reality without cracking under the pressure of scrutiny.

  Watching you two together, I see that dynamic. I see a relationship where the commitment isn't a fragile thing that needs constant propping up with grand gestures or renewed vows. It is the quiet infrastructure. It is the riverbed through which the water flows. It is the thing that allows you to be vulnerable, to be wrong, to be uncertain about everything else, because you are certain about *this*.

  To the philosophers in the room: I hope I haven't misrepresented the epistemology.
  To our parents: I hope that didn't sound too much like a lecture.
  And to Ingrid and Sam: My wish for you is that your hinge holds fast. May it carry the load of the ordinary days, the difficult years, and the quiet joys. May it allow you the freedom to doubt the small things, because you never have to doubt the big one.

  Please raise your glasses. To Ingrid and Sam.
