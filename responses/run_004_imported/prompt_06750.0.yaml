      *   *Nuance:* The distinction between necessary and contingent truths is crucial. Logical omniscience usually pertains to logical consequences (necessary truths). Leibniz says necessary truths *are* finitely reducible. So, in principle, a human *could* know them all. But in practice, they don't. Why? Complexity? Or is there a deeper metaphysical limit?
      *   *Modern Parallel:* The distinction resembles the difference between *competence* (what is logically implied) and *performance* (what is actually derived given resource constraints). Modern logic often ignores resource constraints (complexity theory addresses this, but standard epistemic logic does not).

  3.  **Analyzing Leibniz's Resources:**
      *   **Finite vs. Infinite Analysis:**
          *   Necessary Truths: Predicate contained in subject. Analysis terminates in finite steps. Identity is reached.
          *   Contingent Truths: Predicate contained in subject. Analysis proceeds *in infinitum*. Never reaches identity for us.
          *   *Implication for Omniscience:* If logical omniscience concerns necessary truths (logical consequences), Leibniz admits these *are* accessible in principle to finite minds. So, the "infinite analysis" escape hatch applies primarily to *contingent* truths, not logical consequences.
