          *   Leibniz knew humans make errors in calculation. He didn't assume perfect execution.
          *   However, if the question is about *modeling* knowledge (as in epistemic logic), the *Calculus* defines the consequence relation. If $K\phi$ and $\phi \to \psi$ is a theorem, does $K\psi$ follow? For Leibniz, ideally yes, *if* the calculation is performed. But he distinguishes between *truth* (metaphysical) and *knowledge* (epistemic).

