      *   **Modern Puzzle:** The Problem of Logical Omniscience in Epistemic Logic (Hintikka-style possible worlds semantics). Agents know all logical truths and all consequences of their knowledge.
      *   **The Question:** Does Leibniz's finite/infinite analysis distinction provide resources to solve/explain the failure of finite reasoners to achieve omniscience? OR, would his *Calculus Ratiocinator* succumb to the same problem as modern formal systems?

