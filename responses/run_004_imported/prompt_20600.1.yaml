  5.  **Refining the Philosophical Nuance (Self-Correction during drafting):**
      *   *Caution:* Make sure I don't imply she *wasn't* a person before the dementia. Menkiti's view is often misread as "you aren't a person until you're old/wise." Thandeka's nuance was that the *community* protects the vulnerable.
