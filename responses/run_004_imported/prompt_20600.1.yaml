answer: |-
  Good morning. For those of you who don't know me, I'm Thandeka's nephew. Looking around this room, I see a map of my aunt's life. There are the family members who knew her as the woman who burned the toast but made the best tea. There are the colleagues and former students who know her as a rigorous mind who could dismantle an argument before finishing her coffee. And there are friends who knew her simply as the one who showed up.

  If you knew her well, you probably know that Thandeka loved to sing. You also probably know she was terrible at it. She wasn't just pitchy; she was cheerfully, confidently wrong. But she never stopped. Whether it was a hymn in chapel or a lullaby for a grandchild, she sang with her whole chest. I used to think this was just stubbornness. But lately, I've realized it was something else. For Thandeka, the value of the song wasn't in the perfection of the performance; it was in the act of joining her voice to the room. It was an act of connection.

  That instinct—to build connection, to weave herself into the lives of others—wasn't just a personality quirk. It was her life's work.

  In her forties, when many people are thinking about slowing down, Thandeka and her husband opened their home to two foster children. It wasn't easy. It added noise and chaos to a house that had finally gotten quiet. But she didn't see it as a burden. She saw it as an expansion. She used to say that you don't find yourself by looking in the mirror; you find yourself by looking at who is relying on you. By taking on the responsibility for those children, she wasn't just helping them; she was becoming more fully who she was meant to be.

  This wasn't just sentimentality. This was philosophy.

  Thandeka spent thirty years teaching a specific idea about what it means to be a person. She would happily derail Christmas dinner to argue about it. There was a debate in her field between two giants, Menkiti and Gyekye, about the old African maxim: "A person is a person through other persons."

  Some interpreted this to mean that if you lose the ability to interact with others—if you lose your memory, your sharpness, your capacity to reciprocate—you risk losing your standing as a person. Thandeka fought against that. She argued that personhood is indeed an achievement, built over a lifetime of moral growth and community. But she insisted that the community's job doesn't end when your capacity fades.

  She wrote that when we can no longer hold up our end of the relation, the community doesn't withdraw; it leans in. It carries the weight.

  I tell you this because I know how hard the last three years were for many of you. Watching her in the memory-care facility, unable to recognize her own children, felt like a theft. It is tempting to think that the Thandeka we knew was gone, that the dementia had taken the person away and left only the body.

  But if we honor her actual beliefs, we cannot say that.

  Thandeka taught us that personhood is not a solitary light that flickers out when the mind dims. It is a web. For fifty years, she wove that web with incredible industry—through her teaching, her parenting, her fostering, her friendship. She built a reservoir of relational wealth. And when her own memory could no longer hold her identity, she didn't fall into a void. She fell into us.

  In those final years, when she couldn't remember the words to the songs she loved, we sang them for her. When she couldn't navigate the room, we guided her hand. We weren't just caring for a patient; we were holding her place. We were keeping her personhood warm, exactly as she argued we should.

  So, if you are feeling the grief of that loss, of not being recognized, I want to offer you this: She knew you. Not necessarily in the final months, but in the decades that built the safety net she landed in. She knew you enough to build a community strong enough to carry her when she could no longer walk.

  There is a comfort in this, I think. It means we don't have to be afraid of fading. It means that we are not alone in the work of being human. We are not isolated islands trying to stay afloat. We are a fleet. When one ship takes on water, the others draw close.

  Thandeka achieved her personhood brilliantly. She earned her place in this web through a lifetime of love, of argument, of fostering children, and of singing off-key with joy. And now, the work passes to us. We maintain that web by remembering her. By telling stories about the foster kids she loved, about the papers she wrote, about the way she hummed while grading.

  She is not gone, because the relations she built are still active. They are active in this room. They are active in the way we treat each other as we leave here today.

  So, let us do for her now what she taught us to do. Let us carry her. Let us hold her memory, hold her family, and hold fast to the idea that no one among us is ever truly alone.

  Thank you.
