answer: |-
  The chair hummed, a low vibration that Mara felt in her teeth rather than her ears. Across the glass partition, Dr. Aris adjusted a dial that didn't seem to control anything visible.

  "Remember," Aris said over the intercom, his voice flat. "We aren't turning you off. We are loosening the glue. We want to see if the 'you' persists when the binding weakens."

  Mara nodded. She knew the theory. Panpsychism suggested her neurons, even her atoms, possessed rudimentary experience. The Combination Problem asked why those billion tiny experiences didn't just sit side-by-side like stones in a jar, but somehow melted into the singular, unified stream of consciousness she called 'I'. Today, they were trying to un-melt them.

  "Initiating decoupling," Aris said.

  At first, nothing changed. Then, the hum deepened. Mara looked at her left hand resting on the armrest. Usually, she felt the hand as *hers*, an extension of a central command. Now, the sensation shifted. The thumb felt cold, but the index finger felt warm. Not just physically—*experientially*.

  It wasn't that she lost control. It was that the ownership fractured. She could feel the thumb's pressure against the plastic as a distinct, isolated event, sealed off from the index finger's contact. There was no overarching 'Mara' holding them together. There was just the thumb-experience and the finger-experience, occurring simultaneously but never meeting.

  *Is this what it is?* she thought. But even the thought felt splintered. The concept of 'this' belonged to the visual cortex, while the fear belonged to the amygdala, and they weren't talking. They were just shouting into the same void.

  She was a crowd. A hundred billion micro-subjects screaming in a dark room, synchronized by habit but fundamentally alone. There was no sum. There was only the aggregate. William James was right; you cannot pile feelings to make a new feeling. You just get a pile.

  "Status?" Aris asked.

  Mara opened her mouth to speak, but the coordination required to form a word seemed impossible. Who was speaking? The throat? The tongue? The intention? They were disjointed. She managed a grunt.

  "Stability holding," Aris muttered to himself. "Re-engaging binding sequence."

  The hum spiked. The isolation snapped.

  It happened instantly. The thumb and finger merged back into a single sensation of 'hand'. The fear and the concept fused back into 'I am afraid'. The crowd vanished, replaced by the monarch. Mara gasped, sucking in air as a unified lung capacity.

  "Welcome back," Aris said. "Report. Did the subject survive?"

  Mara blinked. The room was solid again. She was one person sitting in a chair. But the memory of the fragmentation lingered like a phantom limb.

  "I... I was there," she said. Her voice sounded smooth, unified.

  "Which 'I'?" Aris pressed. "When the binding loosened, was there a single observer watching the fragments? Or were there just the fragments?"

  Mara frowned. She tried to reach back into the moment of decoupling. She tried to find the witness who had observed the thumb and finger as separate. But she couldn't find him. There was only the memory of the thumb feeling cold and the finger feeling warm. There was no one who had held both sensations together, because holding them together would have required the very unity that was switched off.

  "I don't know," she whispered.

  "Think," Aris said. "When the binding returned, did a new subject emerge? Or did the old one wake up?"

  Mara looked at her hands. They were still. If the 'I' was just the sum of the parts synchronizing, then the 'I' was an illusion, a trick of the light created by efficient communication. If the 'I' was a fundamental entity that rode on top of the parts, then where had it gone during the decoupling?

  "If I was just the sum," Mara said slowly, "then I died when you loosened the glue. And whoever is speaking to you now is a new entity, constructed from the same parts, with false memories of being the one who sat down."

  Aris didn't write anything down. He just watched her.

  "But," Mara continued, her voice trembling, "if I am a fundamental entity... then why did I feel the separation? Why did the unity feel like a return rather than a constant?"

  She looked up at the glass. She saw Aris on the other side. He was leaning forward, his hands clasped.

  "Dr. Aris?"

  "Yes?"

  "When you look at me," she asked, "do you see one person? Or do you see a collection of particles that your brain is forcing into a shape?"

  Aris paused. He looked at his own hands, clasped on the console. He unclasped them, spreading his fingers. He stared at them for a long moment, as if expecting them to drift apart like smoke.

  "I don't know," Aris said softly.

  The hum of the machine settled into a silence that felt heavy, pregnant with the unsolved equation. Mara felt the unity of her own mind, solid and undeniable, yet suddenly suspect. It felt like a story she was telling herself, a narrative woven over a billion tiny, silent lights.

  "Should we run it again?" Aris asked.

  Mara looked at her hand. She willed the fingers to move. They moved. But she couldn't tell if she had moved them, or if they had simply agreed to move together.

  "I don't know," she said. "Who would be running it?"
