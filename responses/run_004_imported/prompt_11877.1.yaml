answer: |-
  You have hit on exactly the right nerve. This is the single most technical and contested pivot point in *A Theory of Justice*. Most introductory summaries gloss over it because it requires wading into decision theory, but you are correct: if the parties in the Original Position used standard expected-utility calculus (averaging the odds), they would likely land on average utilitarianism, not Rawls's Two Principles.

  Rawls knows this. He doesn't just wave a wand and say "people are scared." In **Section 13 ("The Rationality of the Two Principles")**, he explicitly argues that **Maximin is not a general rule of rational choice**, but rather becomes rational *only* under three specific structural conditions that define the Original Position.

  Here is the actual argument for why a rational agent in the Original Position rejects the "casino bet" (expected utility) in favor of Maximin.

  ### 1. The Distinction Between Risk and Uncertainty
  Your intuition about "playing the odds" relies on what decision theorists call **decision-making under risk**. In a casino, you know the probability distribution (e.g., there are 38 slots on the wheel, so you have a 1/38 chance of hitting a number). You can calculate expected value.

  Rawls argues the Original Position is **decision-making under uncertainty**. The parties have *no basis* for assigning probabilities to which social position they will occupy.
  *   **The Principle of Insufficient Reason:** Some critics (like John Harsanyi) argued that if you have no information, you should assume an equal probability for all outcomes (Laplace's principle).
  *   **Rawls's Rebuttal:** Rawls argues this is arbitrary. There is no objective basis for saying there is a 1% chance you'll be a CEO and a 1% chance you'll be a janitor. Social structures aren't random lotteries; they are historically contingent. Because there is no objective knowledge of probabilities, you cannot mathematically calculate an "average" outcome. You are flying blind. When you cannot estimate probabilities, standard expected utility theory breaks down.

  ### 2. The Three Conditions for Maximin
  Rawls claims Maximin only becomes the rational strategy when three specific conditions are met. He argues the Original Position is uniquely designed to satisfy all three.

  **Condition A: The Guaranteeable Minimum is Significant**
  The parties care about securing a baseline of "Primary Goods" (rights, liberties, opportunities, income, self-respect).
  *   In a normal bet, you might risk $10 to win $100.
  *   In the Original Position, the "bet" is your entire life.
  *   Rawls argues that once you have secured a sufficient level of primary goods (enough to exercise your moral powers and pursue a conception of the good), the marginal value of *more* goods diminishes. Gaining the chance to be a billionaire is not worth the risk of ending up in a position where you lack basic liberties or subsistence. The "upside" doesn't compensate for the "downside."

  **Condition B: The Alternatives Involve Unacceptable Risks**
  This is the crux of the anti-utilitarian argument.
  *   If you choose Utilitarianism, you are agreeing to a system where your rights can be sacrificed if it maximizes the aggregate happiness.
  *   Rawls argues there are some outcomes that are **intolerable**. For example, slavery, religious persecution, or destitution.
  *   If you gamble on expected utility and lose, you might end up in a society where you are the sacrificed minority. Because the parties in the Original Position represent free and equal moral persons, they cannot rationally agree to a principle that allows them to be enslaved or oppressed, even if the *average* happiness is high. The risk is existential, not financial. You can't recover from a "loss" in the Original Position because you only get one life.

  **Condition C: The Rejected Alternatives Have Little Gain**
  Rawls argues that compared to the Two Principles, Utilitarianism doesn't offer enough *extra* benefit to justify the risk.
  *   If Utilitarianism promised a utopia where everyone was incredibly happy (except for a few slaves), the gamble might be tempting.
  *   But Rawls argues that a society ordered by the Two Principles (with the Difference Principle) will still be very prosperous. You aren't giving up much potential upside by securing the floor. The "cost" of insurance is low compared to the catastrophic nature of the risk.

  ### 3. The "One-Shot" Nature of the Choice
  This is often overlooked but vital to Rawls's logic.
  *   **Casino:** You can lose a hand and play again. You can hedge bets over time.
  *   **Original Position:** This is a **non-repeatable choice** for the basic structure of society. It determines the starting place for your *only* life.
  *   When a decision is irreversible and the stakes involve the fundamental conditions of your agency (liberty/conscience), rationality shifts from "maximizing average gain" to "securing the conditions for agency." If you end up in the worst-off position under Utilitarianism, you may lack the resources or liberties to pursue *any* conception of the good. Under Rawls's principles, even the worst-off position guarantees the social bases of self-respect and basic liberty.

  ### 4. Why Not Just "Risk Aversion"?
  You mentioned you didn't want the "Rawls assumes people are risk-averse" answer. Here is the nuance:
  Rawls does not build risk aversion into the *psychology* of the parties. The parties are "mutually disinterested"—they aren't altruistic, but they aren't envious or gamblers either.
  *   **The Argument:** It is not that the *people* are inherently cautious. It is that the *structure of the situation* (no probabilities + intolerable outcomes + one-shot choice) makes caution the only rational output.
  *   If you put a daredevil in the Original Position, Rawls argues they would *still* choose Maximin, because the math of the situation (unknown probabilities + existential stakes) forces that conclusion regardless of personality.

  ### The Harsanyi Counter-Point (For Context)
  Since you mentioned this is contested, it's worth noting why economists like John Harsanyi disagreed. Harsanyi argued that "rationality" *just means* maximizing expected utility. He claimed Rawls was smuggling in a moral preference (equality) by disguising it as a decision-theory rule (Maximin). Harsanyi insisted that without objective probabilities, you *must* assume equal probability (Principle of Insufficient Reason), which leads back to Utilitarianism.

  Rawls's response is essentially: "No, the stakes are too high for arbitrary probability assumptions." He views the choice of principles of justice as different in kind from choosing a business strategy or a bet. It is a choice about the terms of social cooperation among free and equals. To gamble with your basic liberties is, in Rawls's view, irrational for a free moral agent.

  ### Summary
  Rawls isn't saying "people are scared." He is saying:
  1.  You can't calculate odds (no probability data).
  2.  The downside is catastrophic (loss of liberty/subsisence), not just "losing money."
  3.  The upside of gambling isn't worth that catastrophic risk.
  4.  You only get one shot.

  Therefore, the rational move is to make the worst-case scenario as good as possible. That *is* the Difference Principle: maximize the minimum share of primary goods.

  If you accept Rawls's premise that the Original Position creates a unique category of "radical uncertainty with existential stakes," Maximin follows. If you reject that and view it as a standard probability problem, Harsanyi wins. That is the actual philosophical battleground.
