      *   *Wait, one nuance:* The prompt asks me to pick one and argue *for it*. I shouldn't spend too much time bashing the other, but using the other's weakness to highlight my strength is valid.
      *   *Swampman Strategy:* The strongest defense for Etiological is usually the "Normativity" argument. Function implies a standard of success/failure. Swampman's heart can't *fail* to pump in a biological sense if it has no history. It just breaks. This is a key distinction.

  5.  **Final Polish:**
