answer: |-
  You are absolutely right to trust your intuition here. What you are witnessing is a textbook case of **Simpson's Paradox**.

  This is a statistical phenomenon where a trend appears in several different groups of data but disappears or reverses when these groups are combined. It is not noise; it is a structural artifact of how the data is weighted.

  Here is the breakdown of what is actually happening, why the pooled number is misleading in this context, and how you can argue for the correct decision in your committee meeting.

  ### 1. The Diagnosis: Simpson's Paradox
  Your suspicion is correct: the per-channel numbers are the accurate reflection of performance, while the pooled number is distorted by an uneven distribution of work.

  To see why, we have to look at two hidden variables in your data: **Channel Difficulty** and **Workload Distribution**.

  **Variable A: Channel Difficulty**
  Look at the success rates for *both* employees.
  *   **Phone:** Riley (90%), Priya (80%).
  *   **Chat:** Riley (50%), Priya (40%).

  Regardless of who is working the ticket, **Phone tickets are significantly easier to resolve than Chat tickets.** Everyone has a higher success rate on Phone. This makes "Channel" a confounding variable; you cannot compare overall averages without accounting for the difficulty of the mix.

  **Variable B: Workload Distribution**
  Now look at how many tickets of each type each person handled.
  *   **Riley:** 100 Phone (25% of workload) / 300 Chat (75% of workload).
  *   **Priya:** 300 Phone (75% of workload) / 100 Chat (25% of workload).

  **The Mechanism of the Reversal**
  Priya's overall average is higher (70% vs. 60%) not because she is better at resolving tickets, but because **she was assigned (or selected) a much larger share of the easier tickets.**
  *   Priya did 300 of the "easy" Phone tickets.
  *   Riley did 300 of the "hard" Chat tickets.

  The pooled average weights the results by volume. Because Priya's volume is concentrated in the high-success channel, her overall percentage gets pulled up. Because Riley's volume is concentrated in the low-success channel, their overall percentage gets dragged down.

  ### 2. The Verdict: Who is the Stronger Performer?
  **Riley is the stronger performer.**

  If you award this based on the pooled number (70% vs. 60%), you are effectively rewarding Priya for having an easier workload and penalizing Riley for taking on the harder tickets.

  In performance management, you want to measure **efficacy** (how good are they at the task?) rather than **opportunity** (how many easy tasks did they get?).
  *   In a head-to-head on Phone tickets, Riley wins by 10 points.
  *   In a head-to-head on Chat tickets, Riley wins by 10 points.

  Riley outperforms Priya in every specific context available. There is no context in which Priya outperforms Riley. Therefore, Riley is the more effective support agent.

  ### 3. How to Explain This to the Committee
  The committee member arguing for the pooled figure is operating on the logical assumption that "more data is better." You need to explain that in this specific case, aggregating the data hides the relevant context.

  Here is a script/approach you can use:

  > "I've analyzed the discrepancy, and it turns out this is a known statistical phenomenon called Simpson's Paradox. The pooled number is misleading because it conflates *skill* with *ticket mix*.
  >
  > "We all agree that Phone tickets are easier to resolve than Chat tickets; both agents have much higher success rates on Phone. The problem is that Priya handled 300 Phone tickets and only 100 Chat tickets, while Riley handled the reverse.
  >
  > "Priya's higher overall average is driven by the fact that she worked the easier channel more often. Riley took on the harder workload (75% Chat) and still beat Priya's success rate in both individual categories. If we give the award based on the pooled number, we are incentivizing agents to cherry-pick easy tickets next quarter. To reward actual performance skill, we have to look at the per-channel rates."

  ### 4. Recommendations for Future Quarters
  To prevent this disagreement from happening again, I recommend proposing a change to how you track metrics for the next award cycle:

  1.  **Weighted Averages:** If you must have a single "Overall Resolution Rate," calculate it based on a **standardized mix**. For example, assume a standard quarter is 50% Phone / 50% Chat. Calculate what their overall rate *would* have been if they had handled an equal mix.
      *   *Riley Standardized:* (90% + 50%) / 2 = **70%**
      *   *Priya Standardized:* (80% + 40%) / 2 = **60%**
      *   *Result:* This removes the workload bias and clearly shows Riley's superiority.
  2.  **Ticket Assignment Protocol:** If possible, ensure ticket distribution is random or rotated evenly. If agents can choose their queues, high performers might avoid hard tickets to protect their stats, which hurts the team long-term.
  3.  **Difficulty Weighting:** If Chat tickets are harder, perhaps a resolved Chat ticket should be worth more points than a resolved Phone ticket in your scoring system.

  ### Summary
  *   **The Phenomenon:** Simpson's Paradox.
  *   **The Cause:** Uneven distribution of "easy" vs. "hard" tickets between the two agents.
  *   **The Decision:** **Riley** deserves the award.
  *   **The Reason:** Riley demonstrated higher competence in every specific category. Priya's higher overall number is an artifact of luck or assignment bias, not superior skill.

  You have the statistical high ground here. Stick to the per-channel data; it is the only metric that compares like-with-like.
