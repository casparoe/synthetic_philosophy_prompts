      *   *Key Distinction:* Contextualism says the *meaning/truth conditions* of "knows" change. Pragmatic Encroachment says the *meaning/truth conditions* stay the same, but the *status of the belief* (justification/warrant) changes due to practical factors.

  3.  **Deconstruct the Two Theories:**

      *   **Epistemic Contextualism (e.g., Cohen, DeRose, Lewis):**
