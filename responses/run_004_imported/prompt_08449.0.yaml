          *   *Role of Stakes:* High stakes raise the *standards* for applying the word "knows."
          *   *Truth:* In a low-stakes context, "Hannah knows the bank is open" is True. In a high-stakes context, "Hannah knows the bank is open" is False (even if Hannah's mental state hasn't changed).
          *   *Location of Variance:* Semantics of the knowledge attribution.

      *   **Pragmatic Encroachment (e.g., Fantl, McGrath, Stanley):**
          *   *Core Claim:* Knowledge itself (the mental state/relation) is sensitive to practical stakes. Practical factors "encroach" on the epistemic.
          *   *Role of Stakes:* High stakes affect whether the belief is *justified* or counts as knowledge, regardless of who is talking.
          *   *Truth:* If stakes are high, Hannah *does not know*, period. It's not about the speaker's context; it's about the subject's situation.
