      *   **Premise 2:** LST applies to first-order theories. If there's an infinite model, there's a countable model. Let's call this model $M$.
      *   **Premise 3:** Inside $M$, there is a set $S$ that corresponds to "the real numbers" or $\mathcal{P}(\mathbb{N})$.
      *   **Premise 4:** ZFC proves $\neg \exists f: S \to \mathbb{N}$ such that $f$ is a bijection.
      *   **The Apparent Contradiction:** $M$ is countable (from the outside). So the elements of $S$ are countable (from the outside). But $M$ thinks $S$ is uncountable.
      *   **The Resolution:** "Countable" is relative.
          *   *External Countability:* There exists a bijection between the domain of $M$ and $\mathbb{N}$ (in the metatheory).
