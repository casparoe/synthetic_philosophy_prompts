      *   **Key Figures/Texts:** Quine ("On the Nature of Moral Values", *Theories and Things*), Harman (*The Nature of Morality*), Sturgeon/Boyd (Cornell Realists).
      *   **Core Conflict:** Quine dissolves analytic/synthetic and fact/value dualisms (suggesting continuity) *but* denies moral judgments answer to sensory experience (suggesting discontinuity). Harman says moral facts are explanatorily idle. Sturgeon/Boyd say moral facts *do* explain and fit the "web of belief."
      *   **Task:** Write a qualifying-exam style essay. Weigh both sides. **Defend a definite verdict** (do not leave it open).
      *   **Tone:** Academic, philosophical, rigorous, argumentative.

  2.  **Deconstruct the Arguments:**

      *   **Quine's Position:**
          *   *Anti-dualism:* Fact/value is a difference of degree, not kind (like analytic/synthetic).
          *   *Empiricism:* Science answers to the "tribunal of sensory experience."
          *   *The Tension:* If fact/value is continuous, why are values excluded from the tribunal? Quine suggests moral sentences don't impinge on sensory surfaces in the way physics does. They are more about fostering social cooperation than describing the world.
          *   *Verdict:* Quine is a non-cognitivist or error theorist (mostly reticent, but leans skeptical).

      *   **Harman's Challenge (Skepticism):**
          *   *Explanatory Test:* To believe in $X$, $X$ must help explain our observations.
          *   *Application:* We observe a burning cat. Physics/Chemistry explains the burning. Does "wrongness" explain the observation? No. Our psychological/sociological conditioning explains why we *think* it's wrong.
          *   *Alignment:* Fits Quine's demand for empirical anchoring.

      *   **Sturgeon/Boyd's Counter (Realism):**
          *   *Holistic Coherentism:* Quine's "web of belief." We don't test sentences one by one against experience; we test the whole web.
