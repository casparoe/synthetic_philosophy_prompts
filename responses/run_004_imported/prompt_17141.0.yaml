answer: |-
  **Title:** The Flinching Naturalist: Why Quinean Holism Demands Moral Realism

  **Introduction**

  Willard Van Orman Quine occupies a paradoxical position in the history of metaethics. As the great dismantler of dualisms, he famously argued that the boundary between the analytic and the synthetic is a dogma of empiricists, and that the fact/value distinction is merely a matter of degree rather than kind. Yet, despite this theoretical leveling, Quine maintained a steadfast reticence regarding substantive ethics, ultimately denying moral judgments the cognitive standing afforded to natural science. In "On the Nature of Moral Values," Quine suggests that while moral claims are continuous with factual claims in terms of their revisability, they fail to answer to the "tribunal of sensory experience" in the way physical theories do. This tension invites a critical question: Is Quine's skepticism about ethics a necessary consequence of his naturalism, or is it an inconsistent residue of the very empiricist dogmas he sought to destroy?

  This essay argues that while Quine's skepticism aligns with his behaviorist semantics, it is ultimately in tension with his core doctrine of confirmational holism. Gilbert Harman's skepticism reinforces Quine's empiricist caution by demanding direct explanatory utility for moral facts. However, the Cornell Realists, Nicholas Sturgeon and Richard Boyd, better capture the spirit of Quine's mature naturalism by applying the criterion of ontological commitment consistently across the "web of belief." A fully consistent Quinean naturalist cannot stop at Harman's skepticism; the logic of Quine's own holism compels us to side with Sturgeon and Boyd. Quine's naturalism is more radical than he realized, and it requires the admission of moral properties as legitimate posits within our best scientific explanation of the world.

  **Quine's Naturalism and the Ethical Exception**

  To understand the tension, one must first characterize Quine's naturalism. For Quine, epistemology is contained within natural science; there is no first philosophy standing outside the scientific enterprise to judge it. Ontological commitment is determined by the bound variables of our best scientific theories ("to be is to be the value of a variable"). Crucially, the justification for these theories lies in their ability to predict and control the flow of sensory stimulation.

  In "On the Nature of Moral Values," Quine grants that moral sentences are part of our overall theory of the world. They are revisable and interconnected with other beliefs. However, he draws a line at the point of empirical anchoring. Physical theory, Quine argues, is answerable to observation sentences that report sensory surfaces. Moral theory, conversely, is answerable to a different master: social cohesion and the fostering of cooperative behavior. Quine views moral learning as a process of conditioning and acculturation rather than the detection of mind-independent properties. Consequently, while he dissolves the *logical* gap between fact and value, he maintains a *functional* gap. Moral sentences function to guide action and maintain social order, whereas scientific sentences function to describe the causal structure of the universe.

  This position allows Quine to be a naturalist without being a moral realist. He naturalizes ethics by explaining it away as a sociological and psychological phenomenon, rather than vindicating it as a descriptive discipline. But this move relies on a specific conception of how language hooks onto the world—one that prioritizes direct causal chains from object to sensory surface.

  **The Case for Skepticism: Harman and the Explanatory Test**

  Gilbert Harman's argument in *The Nature of Morality* provides the strongest support for Quine's reticence. Harman sharpens Quine's empiricism into a specific test for ontological commitment: the explanatory test. We are justified in believing in the existence of unobservable entities (like electrons or quarks) only if positing them helps explain our observations.

  Harman argues that moral facts fail this test. If an observer sees a group of youths burning a cat and judges "that is wrong," the explanation for the observation requires physics (the fire), biology (the pain), and psychology (the observer's conditioning). It does not require the actual *wrongness* of the act. The moral fact is explanatorily idle; it is an epiphenomenon. Harman contends that our moral observations are explained entirely by our moral sensibilities, not by moral facts themselves.

  This argument resonates deeply with Quine's behaviorist leanings. For Quine, meaning is rooted in stimulus conditions. Since there is no specific sensory stimulus that triggers a moral observation in the way a red patch triggers "red," moral terms lack the empirical content necessary for cognitive significance. Harman's skepticism thus appears to be the logical culmination of Quine's demand that theories answer to the tribunal of experience. If naturalism means deferring to the methods of the natural sciences, and the natural sciences rely on causal explanation of sensory data, then ethics—as Harman shows—seems to fall outside the ontological pale. From this perspective, Quine's skepticism is earned; it is the price of admission to a rigorous scientific worldview.

  **The Case for Realism: Sturgeon, Boyd, and the Web of Belief**

  However, the Cornell Realists, Sturgeon and Boyd, argue that Harman (and by extension Quine) applies a double standard. They invoke Quine's own doctrine of confirmational holism—the idea that our beliefs face the tribunal of experience not individually, but as a corporate body. In "Two Dogmas of Empiricism," Quine dismantled the idea that individual statements can be verified or falsified in isolation. Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system.

  Sturgeon and Boyd leverage this holism to defend moral realism. They argue that moral properties *do* play a genuine explanatory role in our best theories of the world, particularly in history and sociology. Sturgeon offers the example of Hitler: Why did Hitler start World War II? A complete explanation must reference his moral depravity and his ideological commitments. To say "Hitler was morally depraved" is not merely to express an attitude; it is to cite a causal factor that explains historical events. Similarly, Boyd argues that moral terms refer to homeostatic property clusters that stabilize social cooperation, and referencing these clusters explains the success or failure of social institutions.

  If Quinean naturalism licenses belief in unobservable physical posits because they contribute to the coherence and explanatory power of the web of belief, it must do the same for moral posits. The Cornell Realists contend that the disanalogy Harman draws between physics and ethics is one of degree, not kind. Biology and psychology also lack the precise predictive capacity of physics, yet Quine happily naturalizes them. If we accept "species" or "beliefs" as real because they figure in our best explanations, we should accept "injustice" or "cruelty" for the same reason. To exclude them requires a reductionist standard of evidence that Quine explicitly rejected when he abandoned the analytic/synthetic distinction.

  **Verdict: The Inconsistency of Quine's Reticence**

  Weighing these considerations, the verdict must be that Quine's skepticism is in tension with his naturalism, and that a consistent Quinean must side with Sturgeon and Boyd. The core of this judgment lies in identifying the source of Quine's skepticism: it is a residue of the very reductionist empiricism he famously critiqued.

  Quine's argument against ethics relies on the notion that for a statement to be cognitive, it must be traceable to specific sensory stimulations. But this is a version of the "dogma of reductionism" that Quine attacked in "Two Dogmas." He argued there that individual sentences do not have their own empirical content; only the whole theory does. If we apply Quine's holism consistently, the question is not "Does the moral sentence *alone* predict a sensory stimulus?" but rather "Does the inclusion of moral vocabulary improve the overall explanatory efficacy of our web of belief?"

  As Sturgeon demonstrates, the answer is yes. Our best historical and sociological explanations rely on moral categories. If we excise them, our understanding of human behavior becomes impoverished. A Quinean naturalist is committed to the ontology of our best science. If the social sciences are part of science (which Quine grants), and if they indispensably employ moral explanations, then moral properties are part of the naturalist's ontology. Quine's refusal to acknowledge this stems from a lingering behaviorist intuition that privileges physics as the sole paradigm of reality. But Quine's own holism undermines physics' privilege; physics is simply the most central strand of the web, not the only legitimate one.

  Furthermore, Quine's claim that the fact/value distinction is a matter of "degree" cuts against his skepticism. If it is only a matter of degree, then there is no sharp metaphysical line where description ends and prescription begins. To deny moral judgments cognitive standing while granting it to theoretical physics is to treat a difference of degree as a difference of kind—precisely the error Quine accused the logical positivists of committing regarding analyticity. Harman's skepticism attempts to re-establish this kind-based distinction via the explanatory test, but the Cornell Realists successfully show that the test, properly applied to a holistic web, admits moral facts.

  Therefore, Quine's reticence is not earned by his naturalism; it is a failure of nerve. He successfully naturalized epistemology but stopped short of naturalizing axiology. He treated ethics as a subject *for* science (psychology/sociology) rather than a source of scientific knowledge itself. A fully consistent Quinean naturalism recognizes that if moral posits do explanatory work within the coherent system of beliefs that helps us navigate the world, they are as real as electrons.

  **Conclusion**

  Quine's legacy in metaethics is one of unresolved tension. He provided the tools—holism, the rejection of the analytic/synthetic distinction, and naturalized epistemology—that dismantle the barriers to moral realism, yet he refused to walk through the open door he created. Gilbert Harman's skepticism respects Quine's empiricist caution but ignores his holism. Nicholas Sturgeon and Richard Boyd respect the holism and push the naturalism to its logical conclusion.

  For the qualifying candidate asking whether Quine's skepticism is consistent: it is not. It relies on a foundationalist view of empirical evidence that Quine's mature philosophy renders obsolete. A consistent Quinean naturalist must be a moral realist, not because morality is supernatural, but because it is natural. It is part of the causal fabric of the human world, indispensable to our best explanations of that world, and vindicated by the very web of belief that Quine taught us to trust. Quine was right to dissolve the dualisms, but he was wrong to think the dissolution stopped at the edge of the laboratory. The naturalist must follow the explanation wherever it leads, even into the realm of value.
