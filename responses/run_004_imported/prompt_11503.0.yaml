answer: |-
  You have hit on one of the most subtle and important distinctions in the philosophy of probability. You are absolutely correct: the journalistic shorthand ("the model says 70%, so your credence should be 70%") is a colloquial invocation of David Lewis's **Principal Principle (PP)**. And you are also correct that the naive formulation is technically false without the **admissibility** clause.

  Here is the breakdown of why the naive version fails, what admissibility actually does, and a concrete case where ignoring it leads to irrationality.

  ### 1. The Naive Principle vs. Lewis's Principle

  **The Naive Version (The "Chance Trumps All" View)**
  $$C(A \mid Ch(A) = x) = x$$
  *Translation:* If your evidence is simply that the objective chance of event $A$ is $x$, your credence (degree of belief) in $A$ should be $x$.
  *The Implication:* Objective chance is the final authority. Once you know the chance, no other evidence should move you away from matching it.

  **Lewis's Actual Principal Principle**
  $$C(A \mid Ch(A) = x \land E) = x$$
  *Condition:* **Provided that $E$ is admissible.**
  *Translation:* If your evidence is that the chance is $x$ *plus* some other evidence $E$, your credence should be $x$—*but only if* $E$ is the right *kind* of evidence.

  ### 2. The Concrete Case: Where the Naive Version Breaks

  To see why the naive version is dangerous, we need a scenario where you know the objective chance, but you *also* have evidence that rationally compels you to ignore that chance.

  **The Scenario: The Quantum Coin and the Oracle**
  Imagine a genuinely indeterministic quantum coin. Based on the laws of physics and the current state of the coin, the objective chance of it landing Heads ($H$) is exactly 50% ($Ch(H) = 0.5$).

  *   **The Naive Application:**
      You know $Ch(H) = 0.5$. The naive principle says your credence $C(H)$ must be 0.5.
      Now, suppose a reliable Oracle (or a time traveler) tells you, "I have seen the future; the coin lands Heads."
      Your total evidence is now: $\{ Ch(H) = 0.5 \text{ AND } \text{Oracle says } H \}$.
      If you follow the *spirit* of the naive view (that chance is the ultimate trump card), you might think you should still stick to 50% because "the chance is 50%."

  *   **The Rational Reality:**
      If you trust the Oracle, your credence $C(H)$ should be **1.0** (or near 1.0), not 0.5.
      If you stick to 0.5 despite knowing the outcome, you are being irrational. You are ignoring direct evidence about the truth of $H$ in favor of probabilistic tendencies.

  *   **The Breakdown:**
      The naive principle implies that knowing the chance *screens off* all other evidence. It suggests $C(H \mid Ch(H)=0.5 \land \text{Oracle}) = 0.5$. This is false.
      Lewis's principle saves itself by declaring the Oracle's testimony **inadmissible**. Because the Oracle's info is inadmissible, the Principal Principle simply *does not apply* to that conjunction. You are free to update your credence to 1.0 via standard Bayesian conditionalization on the Oracle's testimony.

  ### 3. Exactly What Work "Admissibility" Is Doing

  Admissibility is a filter that protects the **Total Evidence Requirement**.

  In Bayesian epistemology, you are required to condition your credences on *all* available evidence. The danger of the Principal Principle is that it looks like a rule telling you to *ignore* evidence in favor of chance.

  **Admissibility defines the "Epistemic Lane" of Chance:**
  1.  **Admissible Evidence:** Information about the past, the present, and the laws of nature. This is the kind of evidence that *determines* the chances. (e.g., "The coin is fair," "The atom has a 5-year half-life," "Polling data from last week").
  2.  **Inadmissible Evidence:** Information about the *future outcome* itself that bypasses the chance process. (e.g., "The coin landed Heads," "The Oracle's prophecy," "A completed ballot count").

  **The Work It Does:**
  Admissibility ensures that the Principal Principle only governs your credence when you are in the **epistemic position of the present**. It says: "Objective chance is the guide to the future *only when you don't already know the future*."

  If you have inadmissible evidence, you have "stepped outside" the probabilistic gap between past and future. You no longer need the chance to guide you; you have the truth (or a direct line to it). Admissibility prevents the principle from commanding you to be less confident than your evidence allows.

  ### 4. Why This Matters for Election Reporting

  In the context of your reporting, this distinction clarifies when it is rational to "trust the model" and when it isn't.

  **When the Naive View Works (Admissible Evidence):**
  Most public information is admissible. Polling data, economic indicators, and historical trends are facts about the *past and present*. They inform the model's calculation of the chance.
  *   *Situation:* You have no insider info. You only know the model says 70%.
  *   *Verdict:* The evidence is admissible. Lewis's PP applies. Your credence should be 70%.

  **When the Naive View Breaks (Inadmissible Evidence):**
  The naive view breaks if you possess evidence that the model *cannot* account for because it pertains to the outcome directly or future events that alter the chance setup.
  *   *Situation:* You are a reporter who has uncovered a scandal that will break tomorrow (future evidence relative to the model's run) or you have access to a leaked internal poll from Election Day (outcome-adjacent evidence).
  *   *Verdict:* This evidence is likely inadmissible relative to the model's published chance. If your leaked poll says the candidate is down by 20 points, your credence should not be the model's 70%. It should match the leaked poll. To stick to 70% because "the model says so" would be irrational.

  ### 5. The Deep Cut: The "Undermining Future"

  There is one more technical reason Lewis needed the admissibility clause, which might be relevant if you want to go deeper into the "rabbit hole."

  Lewis believed in **Humean Supervenience**: the idea that laws and chances are just summaries of the total pattern of events in the universe (past, present, and *future*).
  *   **The Problem:** If chances depend on the *future* pattern of events, then a specific future sequence could "undermine" the present chance.
  *   **Example:** Suppose the current chance of a coin landing Heads 100% of the time is 0. But, if it *did* land Heads 100% of the time, that future pattern would make the "Best System" of laws say the chance *was* 100%.
  *   **The Contradiction:** If you know the future pattern (even theoretically), you know the present chance is different than the current theory says.
  *   **Lewis's Fix:** He had to declare such future-pattern evidence "inadmissible" to prevent the Principal Principle from contradicting itself.

  ### Summary for Your Piece

  You can frame it like this:
  > "Treating a forecast as a commandment ('The model says 70%, so I must believe 70%') relies on a philosophical rule called the Principal Principle. But philosophers have known for decades that this rule has a critical escape clause: **admissibility**.
  >
  > The principle only holds if your evidence is limited to what the model knows (past and present data). If you have 'inadmissible' evidence—information that gives you a direct line to the outcome, like insider knowledge or future facts—the model's probability ceases to be your guide. Admissibility is the philosophical firewall that prevents objective chance from overruling direct knowledge. Without it, you'd be forced to ignore a crystal ball just because a coin is theoretically fair."

  This allows you to acknowledge the sophistication of the models while explaining why "blindly trusting" them is philosophically incoherent if you possess superior information.
