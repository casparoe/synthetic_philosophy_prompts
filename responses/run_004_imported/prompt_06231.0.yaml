  3.  **Drafting the Argument (Goethe):**
      *   *Acknowledge the tension:* Yes, it looks like a reversal. "He got comfortable" is the cynical take (and has some truth), but it's insufficient for a seminar.
      *   *Reframe the Early Goethe:* *Götz* and *Werther* aren't proto-liberal democracy. They are about *individual authenticity* vs. *social constraint*, not necessarily constitutional rights. *Götz* is a feudal knight resisting centralization, not a citizen demanding a parliament.
      *   *The Weimar Experience:* Goethe saw administration up close. He learned that abstract ideals crash against reality. This leads to his "Realism."
      *   *The French Revolution:* Why did he hate it? Not because he loved kings, but because he hated *violence* and *abstraction*. He saw it as a mob destroying culture (the "demonic" element). He preferred reform from above (Enlightened Despotism) over revolution from below.
      *   *Napoleon:* Why the admiration? Napoleon represented *order*, *meritocracy* (to an extent), and *world literature* (cosmopolitanism). He was a "man of deed," which Goethe respected.
      *   *The Philosophical Core:* *Bildung* (self-cultivation). Freedom is internal first, external second. Sudden political change disrupts the slow growth of culture.
      *   *Key Text:* *Reineke Fuchs* (cynicism about power), *Hermann und Dorothea* (refugees from Revolution), *Wilhelm Meister* (society as organic).

  4.  **Drafting the Argument (Schiller):**
      *   *The Contrast:* Schiller *did* stay more overtly political/liberal (*Don Carlos*, *Tell*).
      *   *The Nuance:* Schiller's liberty is aesthetic/moral before it is political. "Aesthetic Education of Man." You can't have a free state without free people.
      *   *The Partnership:* They pushed each other. Goethe grounded Schiller's idealism; Schiller pushed Goethe toward universal humanism.
      *   *Did they disagree?* Yes, but productively. Schiller believed in the *idea* of freedom; Goethe believed in the *practice* of limitation and form.
      *   *Correction on Schiller:* By the end (e.g., *Tell*), Schiller is also wary of mob rule (the character of Johannes Parricida). It's not simple liberalism.

