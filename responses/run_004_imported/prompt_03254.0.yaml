          *   If you can't sum them, you can't apply the Axiom of Benevolence impartially across persons.
          *   Therefore, to maintain the "Point of View of the Universe," you must accept that small pains sum up.
          *   Sidgwick writes: "If the conduct which tends most to the Universal Happiness is not also the conduct which tends most to the individual's Happiness, there would be a fundamental contradiction in our reason." (Though this is about Egoism vs. Utilitarianism, the logic of summing holds).
          *   He would likely argue that our intuition fails because we cannot *grasp* the number 3^^^3. Our moral sense evolved for small numbers. From the "Point of View of the Universe," the number matters.

      *   *Argument for Intuition (The Methodological Route):*
          *   Sidgwick values "clear and precise" intuitions. Is the revulsion against torture a clear intuition? Yes.
