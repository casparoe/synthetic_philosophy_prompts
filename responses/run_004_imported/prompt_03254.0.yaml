      *   *Hedonistic Calculus:* Sidgwick is a quantitative hedonist. He believes pleasure and pain are measurable on a single scale. If $P$ is pain intensity and $D$ is duration, Total Pain = $P \times D \times N$ (number of people).
      *   *Axiom of Benevolence:* "The good of any one individual is of no more importance, from the point of view of the Universe, than the good of any other." This implies strict aggregation.
      *   *Methodological Intuitionism:* Sidgwick treats common-sense morality not as the final authority, but as *data* to be systematized. If common sense conflicts with the axioms, the axioms usually win *unless* the conflict reveals a flaw in the derivation or the applicability of the axioms. However, he acknowledges that if the utilitarian conclusion is too repugnant, it might undermine the confidence in the utilitarian axiom itself.
      *   *The Dualism:* He admits that Rational Egoism and Rational Utilitarianism might conflict without a theological resolution. This shows he isn't afraid of uncomfortable conclusions, but he is honest about the lack of a final synthesis.

  3.  **Analyze the Dust Specks vs. Torture Dilemma:**
      *   *The Math:* 3^^^3 (using Knuth's up-arrow notation) is an unimaginably large number. Even a tiny disutility ($\epsilon$) multiplied by 3^^^3 exceeds a large disutility ($L$) multiplied by 1.
      *   *The Intuition:* Most people feel torture is categorically worse, regardless of the number of dust specks. This is a "lexical" or "threshold" intuition.
