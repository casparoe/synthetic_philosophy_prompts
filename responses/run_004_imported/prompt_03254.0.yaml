      *   **The Problem:** Eliezer Yudkowsky's "Torture vs. Dust Specks" dilemma (3^^^3 people getting a dust speck vs. 1 person getting 50 years of torture).
      *   **The Question:** How would Sidgwick come down on this? Would his axioms force him to accept the utilitarian calculus (dust specks are worse), or would his methodological caution/intuitionism lead him to reject unrestricted aggregation?

