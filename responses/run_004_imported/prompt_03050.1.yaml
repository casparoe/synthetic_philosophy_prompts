answer: |-
  This is one of the most celebrated and contentious problems in the history of philosophy of science. You have identified precisely the tension that sparked the famous Leibniz-Clarke correspondence (1715–1716), in which Gottfried Wilhelm Leibniz attacked Newton's conception of space as making God material, and Samuel Clarke (Newton's close friend and theological mouthpiece) attempted to defend it.

  Given your background in physics, you are accustomed to treating "absolute space" as a kinematic framework. However, for Newton, metaphysics and physics were inseparable. To understand the "sensorium" passages, one must look beyond the *Opticks* to his unpublished manuscript *De Gravitatione* and his broader theological commitment to God's "Dominion."

  Here is a situating of those passages within Newton's wider commitments, addressing your specific questions about literalism, anthropomorphism, and the "World Soul."

  ### 1. The Ontological Status of Space
  To understand the "sensorium," you must first understand what Newton thought Space *was*. In the *Principia*, space is treated mathematically. But in *De Gravitatione* (written earlier but unpublished), Newton argues that space is not a substance, nor is it a mere relation between bodies (as Leibniz held).

  Instead, Newton defines space as an **"emanative effect" of God.**

  For Newton, existence implies location. To exist is to be *somewhere*. Since God exists eternally and necessarily, He must be everywhere. Infinite Space is not a container that God sits inside; it is the manifestation of God's eternal presence. As Newton writes in *De Gravitatione*: "Space is an affection of a being just as a being."

  Therefore, when Newton calls space God's "sensorium," he is not saying God built a room and sits in it. He is saying that **Space is the mode of God's presence.**

  ### 2. Literal vs. Figurative: The Analogical Middle Ground
  You ask if the language is literal (a perceptual organ) or figurative (omnipresence). The answer, in Newton's view, is neither and both. It is **analogical**.

  Newton is trying to explain divine cognition to human readers. Human beings perceive through a *sensorium* (the brain/nervous system) where sensory data converges. We are finite, so our sensorium is finite. God is infinite, so His "sensorium" is infinite space.

  *   **Why it isn't merely figurative:** If it were *only* a metaphor for omnipresence, Newton wouldn't need the functional implication of the word "sensorium." He uses the term to explain *how* God knows things. For humans, presence does not guarantee knowledge (I can be in a room and not notice a dust mote). For God, presence *is* knowledge. Because God sustains the existence of every particle in space at every moment, He has immediate access to them. The "sensorium" describes this epistemic access grounded in ontological presence.
  *   **Why it isn't literally an organ:** In 17th-century Latin, *sensorium* did not necessarily imply a fleshy organ (like an eye). It meant the "seat of sensation" or the "place of perception." Newton explicitly denies God has parts or organs (Query 31) because organs imply passivity and mechanism. An eye receives light; it is acted upon. Newton's God is pure Act; He is never acted upon.

  So, Newton is claiming that space functions for God *analogously* to how a sensorium functions for us: it is the medium through which He is present to things and knows them. But unlike our sensorium, it is not a material receiver; it is the substance of His own ubiquity.

  ### 3. Why Deny the "World Soul"?
  This is the crux of your second question. If God is present in space, and space contains the world, why isn't the world God's body (the Stoic or Spinozist view)?

  Newton's theology is deeply rooted in the concept of **Dominion** (Pantokrator). Newton was an Arian (anti-Trinitarian) who believed in a hierarchical universe with one supreme God the Father. For Newton, God is a **Lord**, and Lordship requires subjects distinct from the Lord.

  *   **The World Soul Argument:** If the universe is God's body (as the Stoics held), then God is intrinsically tied to the fate of matter. If a star explodes or a man sins, God physically suffers or changes. This violates Newton's view of God's immutability and perfection.
  *   **The Sensorium Argument:** By calling space a "sensorium" but denying the world is a "body," Newton preserves God's transcendence. A human being is not their sensory field; a human *has* a sensory field through which they perceive the world. Similarly, God *has* space as His presence, through which He perceives and moves matter, but He is not *constituted* by that matter.

  Newton writes in the General Scholium of the *Principia*: "He is not eternity or infinity, but eternal and infinite." This distinction is vital. Space is an attribute of God, but Matter is a creation of God. Conflating the two (Pantheism) destroys the "Lordship" necessary for Newton's natural theology.

  ### 4. "Immediate Presence" and Voluntarism
  You noted Newton's phrase: "comprehends them wholly by their immediate presence to himself." This connects to Newton's **Voluntarism**.

  Descartes had made God distant; God created the laws of motion and then let the clockwork run (occasionalism was a later fix to this). Newton found this theologically insufficient. For Newton, gravity was a problem: how does the Sun move the Earth without touching it?

  Newton's solution is theological: God is literally present at the location of the Earth and the Sun. He doesn't need to send a signal through space to move a planet; He wills it *there*, where He already *is*.
  *   **Human Will:** I will my arm to move -> signal travels through nerves -> arm moves.
  *   **Divine Will:** God wills a planet to move -> God is already present at the planet -> planet moves.

  The "sensorium" language in Query 31 ("more able by his Will to move the Bodies within his boundless uniform Sensorium") is Newton's way of explaining Action at a Distance. It is not magic; it is the mechanical consequence of God's omnipresence. He can move matter "within his sensorium" just as you move your arm within your bodily reach, but without the friction or delay.

  ### 5. The Clarke Correction (and Newton's Displeasure)
  It is worth noting that even Newton's allies found this language dangerous. In the Leibniz-Clarke correspondence, Leibniz mocked the idea of God having a sensorium, arguing it made God a finite perceiver dependent on a physical organ.

  Samuel Clarke, defending Newton, claimed the term was figurative and meant only that God is present everywhere. Historical evidence suggests Newton was privately annoyed by Clarke's retreat. Newton believed the language was necessary to convey the *reality* of God's interaction with space, not just a poetic flourish. He wanted to avoid the Deist trap of a distant God, but also the Spinozist trap of an immanent God who *is* the universe.

  ### Summary
  To reconcile the passages as a physicist:

  1.  **Space is a Field of Presence:** Think of Infinite Space not as a void, but as a field of God's existence.
  2.  **Sensorium is Functional, Not Anatomical:** It describes the *function* of perception and agency, not the *structure*. God perceives matter because He sustains it in existence within His field of presence.
  3.  **The Distinction is Ontological:** The "World Soul" theory makes God and Matter the same substance (Monism). Newton's "Sensorium" theory makes Space an attribute of God, and Matter a distinct creation within that attribute (Dualism with intimate contact).

  Newton is claiming that **omnipresence is the precondition for omniscience and omnipotence.** God knows the universe because He is everywhere in it; He moves the universe because He is everywhere in it. The "sensorium" is the bridge concept that allows a human mind to grasp how Presence translates into Knowledge and Will, without reducing God to a biological organism.

  You are right to be unsettled; Newton is asking you to abandon the Cartesian split between the mental and the spatial. For Newton, God's mind and God's space are intimately linked, though not identical to the material world contained within that space.
