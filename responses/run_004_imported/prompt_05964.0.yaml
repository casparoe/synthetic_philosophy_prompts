answer: |-
  Here are ten interview questions (five main questions with five targeted follow-ups) designed to move beyond the introductory mechanics of Frankfurt cases and engage with the technical objections your guest specializes in refuting.

  **Topic 1: The "Flicker of Freedom" Strategy**

  **1.** Critics of your position often argue that even in the cleanest Frankfurt case, there remains a "flicker of freedom"—a tiny alternative possibility, such as the difference between choosing on one's own versus choosing because an intervener was present. If the Principle of Alternative Possibilities (PAP) simply states that responsibility requires *some* alternative possibility, doesn't the existence of this flicker vindicate PAP, even if the alternative is trivial?

  **2.** *[Follow-up keyed to her likely defense: She will likely argue that the flicker is not a "robust" alternative and therefore morally irrelevant.]*
  If I understand you correctly, you're arguing that for an alternative possibility to defeat a Frankfurt case, it must be "robust"—meaning it must offer a genuine route to avoiding responsibility. But who gets to decide what counts as robust? Are we defining "robustness" in a way that simply begs the question by excluding the very flickers incompatibilists claim are essential?

  **Topic 2: The "Prior Sign" Dilemma**

  **3.** A classic objection to Frankfurt cases is the "prior sign" dilemma: for the counterfactual intervener (Black) to know when to step in, there must be a prior sign indicating what the agent (Jones) will do. If that sign is causally sufficient, haven't you just presupposed determinism to prove determinism doesn't matter? If it isn't, doesn't Jones retain the power to avoid the sign and thus avoid the intervention?

  **4.** *[Follow-up keyed to her likely defense: She will likely argue that the sign need not be infallible or deterministic, merely reliable enough for the thought experiment.]*
  You might say the sign only needs to be reliable, not infallible. But if there is even a probabilistic chance that Jones could act differently *before* the intervention triggers, doesn't that mean the "actual sequence" is never fully insulated from alternative possibilities? How do you close that gap without sliding back into hard determinism?

  **Topic 3: "Buffered" or "Blocked" Redesigns (Mele & Robb)**

  **5.** Later iterations of these cases, like those by Mele and Robb, attempt to remove the "prior sign" entirely by positing a deterministic process that is "buffered" or blocked from producing an effect unless the agent decides otherwise. Do you view these buffered cases as a successful isolation of the actual sequence, or do they merely push the problem of the prior sign back one step in the causal chain?

  **6.** *[Follow-up keyed to her likely defense: She will likely argue that these cases successfully show that causal determination of the choice is compatible with responsibility.]*
  If you argue these cases successfully isolate the actual sequence, aren't you asking the libertarian to accept a definition of "control" that is compatible with determinism from the outset? In other words, does the buffered case work only if we've already agreed that causal determination doesn't negate control?

  **Topic 4: PAP vs. Compatibilism (The Pereboom Challenge)**

  **7.** Let's broaden the scope. Even if we grant that Frankfurt cases successfully refute PAP, that doesn't automatically secure compatibilism. A skeptic like Derk Pereboom can accept your verdict on alternative possibilities and still deny responsibility, arguing that determinism undermines the *sourcehood* of the action. If PAP falls, what specific work is left for the compatibilist to do to secure responsibility?

  **8.** *[Follow-up keyed to her likely defense: She will likely argue that "sourcehood" or "actual sequence" control is sufficient for responsibility, regardless of alternatives.]*
  You'll likely say that "sourcehood" is the real key—that as long as the action issues from the agent's own mechanisms, they are responsible. But if those mechanisms are themselves the inevitable result of factors outside the agent's control (genetics, environment), how is that sourcehood meaningfully different from a puppet who loves its strings?

  **Topic 5: Changing Minds**

  **9.** Philosophical positions often harden around specific intuitions. Is there a specific variation of a Frankfurt case, or a particular argument regarding alternative possibilities, that would actually change your mind? If an incompatibilist could show you one thing that proved PAP is necessary, what would that look like?

  **10.** *[Follow-up keyed to her likely defense: She will likely cite a failure of intuition or a logical contradiction in the incompatibilist's view.]*
  If your answer relies on the intuition that we *feel* responsible in Frankfurt scenarios, how do you weigh that against the equally strong intuition that "could not have done otherwise" exculpates us in almost every other context, from criminal law to everyday blame? At what point does the philosophical case override the legal or cultural intuition?
