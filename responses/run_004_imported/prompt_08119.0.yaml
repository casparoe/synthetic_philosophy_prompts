  hey, weird one for you. I was reading up on three-valued logic (the NULL / "unknown" kind of thing, kinda like Kleene logic or how SQL handles NULL comparisons) and some hacker news comment mentioned this whole idea traces back to Aristotle's "sea battle" bit in On Interpretation, so me being a curious nerd went and dug up an old translation of the actual passage. zero philosophy training over here and this paragraph is wrecking my brain:

  "I mean, for example: it is necessary for there to be or not be a sea battle tomorrow; but is not necessary for a sea-battle to take place tomorrow, nor for one not to take place — though it is necessary for one to take place or not to take place. So, since statements are true according to how the actual things are, it is clear that wherever these are such as to allow of contraries as chance has it, the same necessarily holds for the contradictories also. Nor, however, can we say that neither is true — that it neither will be nor will not be so. For, firstly, though the affirmation is false the negation is not true, and though the negation is false the affirmation, on this view, is not true. Moreover, if it is true to say that something is white and large, both have to hold of it, and if true that they will hold tomorrow, they will have to hold tomorrow; and if it neither will be nor will not be the case tomorrow, then there is no 'as chance has it'. Take a sea-battle: it would have neither to happen nor not to happen."

  so isnt he literally ruling out the "third value" option right in the middle there ("nor can we say that neither is true")? thats the opposite of what I was told this passage is famous for. is the popular "aristotle basically invented truth-value gaps" story just wrong, or is there some subtlety in what "neither true nor false" means that he's rejecting vs. whatever he's actually committing to instead? trying to actually get this straight before I go around confidently citing it at standup lol
