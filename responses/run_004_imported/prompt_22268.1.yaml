prompt: |-
  I'm a retired chemist who's been working through classic philosophy-of-mind papers for fun lately, starting with Turing's 1950 piece on machine intelligence. I got stuck on the bit where he says the statistical evidence for telepathy is "overwhelming" and frets about psycho-kinesis messing with his imitation game -- pretty wild for a paper thats supposed to be a hard-nosed operational test for machine thought. Doesn't that mean the whole argument only holds up if you already grant that ESP is real, and it basically collapses for the rest of us who don't buy into that stuff? Is that maybe why some anthologies quietly cut that section out?
