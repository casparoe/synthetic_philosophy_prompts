answer: |-
  You have a sharp eye, and as a fellow skeptic with a scientific background, your reaction is completely understandable. It is one of the most jarring moments in 20th-century philosophy of mind to read Turing, the father of computer science, writing that the statistical evidence for telepathy is "overwhelming."

  However, the short answer to your worry is: **No, the argument does not collapse if you reject ESP.**

  Here is the breakdown of why Turing included it, why it doesn't invalidate the Test, and why you're right to notice it feels out of place.

  ### 1. Historical Context: 1950 Science vs. 2024 Science
  To a modern chemist, parapsychology is pseudoscience. But in 1950, the landscape was different. J.B. Rhine's work at Duke University on ESP (using Zener cards) was receiving significant attention in mainstream scientific journals. While always controversial, it hadn't yet been fully relegated to the fringe.

  Turing wasn't being "woo-woo"; he was being empirically cautious. He was looking at the data available at the time and concluding that, statistically, he couldn't rule it out. In a rigorous experimental design, you don't ignore variables just because you find them implausible; you control for them.

  ### 2. The Logical Structure: Control Variables, Not Axioms
  This is the most critical point for your concern. Turing does not build the Turing Test *on the foundation* that ESP is real. He treats ESP as a potential **confounding variable**.

  Think of it like running a chemical assay. If you suspect there might be a specific contaminant in the water supply that could react with your reagent, you design the experiment to use distilled water.
  *   If the contaminant exists, your control works.
  *   If the contaminant doesn't exist, your control is unnecessary, but it doesn't invalidate the results of the assay.

  Turing does the same. He writes:
  > *"In view of these possibilities [of telepathy], it will be wise to provide a 'telepathy-proof room'."*

  He is essentially saying: *"To ensure the Interrogator is judging intelligence and not mind-reading, we should shield the participants."* If ESP is nonsense, the shield does nothing, and the test proceeds as normal. If ESP is real, the shield ensures the test remains fair. The validity of the Imitation Game remains intact either way.

  ### 3. The "Argument from Various Disabilities"
  The section you are reading is where Turing lists objections of the form: "A machine can never do X." He brings up ESP in the context of a specific objection: that a machine couldn't replicate the full range of human behavior if humans have non-physical capabilities.

  Turing's counter-move is brilliant in its pragmatism. He argues that even if humans *do* have ESP, we can still test the machine. He suggests that if the human witness uses telepathy to guess cards, and the machine uses random number generation, the interrogator might still fail to distinguish them if the machine's probability algorithms are good enough. He is effectively neutralizing the "human advantage" of ESP by treating it as just another data stream the machine might simulate.

  ### 4. Regarding the Anthologies
  You are correct that some popular abridgments or introductory textbooks sometimes trim this section. There are two reasons for this:
  1.  **Streamlining:** Editors often want to get to the "meat" of the functionalist argument without getting bogged down in 1950s parapsychology debates.
  2.  **Embarrassment:** There is a tendency in hindsight to "sanitize" the reputations of great scientists. Acknowledging that Turing took Rhine's data seriously can be uncomfortable for hard-nosed materialists who want to claim Turing as a pure patron saint of computationalism.

  However, cutting it is a disservice. It hides the fact that Turing was a radical empiricist. He was willing to follow the data wherever it led, even into uncomfortable corners, rather than sticking to a rigid materialist dogma.

  ### Summary
  Your skepticism is well-founded, but Turing's logic holds up. He isn't asking you to grant that ESP is real; he is asking you to grant that **experimental conditions must control for all possible variables, even unlikely ones.**

  As a chemist, you know that a robust experimental design anticipates interference. Turing was simply applying rigorous experimental design to philosophy. The Test doesn't require telepathy to exist; it only requires that if telepathy *did* exist, it shouldn't be allowed to cheat the exam.

  Keep reading closely—that friction you felt between the "hard-nosed test" and the "telepathy" comment is exactly where the interesting philosophy lives. It shows Turing was more concerned with the integrity of the experiment than with adhering to the orthodoxies of his peers (then or now).
