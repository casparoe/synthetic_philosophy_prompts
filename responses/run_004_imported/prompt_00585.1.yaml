answer: |-
  **The Yellow Line**

  **Vienna, 1913**

  Dr. Otto Vane watched the man through the one-way glass. The patient, a clerk named Herr Abel, stood perfectly still in the center of the examination room. He was not catatonic; his eyes tracked the dust motes dancing in the shaft of afternoon light. But his feet were rooted.

  "Walk to the door, Herr Abel," Vane said, entering the room.

  Abel took one step. Then he stopped. He looked at the floor, specifically at the seam between the wooden planks. "I cannot cross the join, Herr Doctor. Not until the whistle blows."

  "There is no whistle. We are in a clinic."

  "Then I wait," Abel said. He began to tremble, a fine, rhythmic shaking of the left hand. *Tap. Tap. Tap.* Against his thigh.

  Vane diagnosed it as *Bahnhof-Starre* (Station Stiffness). A hysteria of the new age. The railways had compressed time and space, and men like Abel could not reconcile the departure with the arrival. He wrote the case study for the *Journal of Nervous Disease*. He described the tremor as "unconscious mimicry of the telegraph key." He published it. He sent copies to his colleagues in Berlin and Paris.

  Two weeks later, Abel returned for a follow-up.

  "The tremor," Vane asked, watching the hand. "Is it still like a telegraph?"

  Abel looked at his hand, then at Vane. He had read the journal. Vane knew this because Abel's wife had brought him the copy; she was proud, in a grim way, that her husband was a medical curiosity.

  "No, Doctor," Abel said. "You wrote that it is a signal. So I listened."

  The tapping changed. It was no longer a frantic Morse code. It slowed down. It became deliberate. *Tap… Tap… Tap.*

  "It is the clock now," Abel said. "I am counting the seconds until the whistle I know will not come."

  Vane felt a strange vertigo. The symptom had shifted to align with the theory. The disease was not a rock he had found in the dirt; it was a plant that had grown around the trellis he had built. He amended the notes. *Subject exhibits awareness of classification. Symptom evolves to match diagnostic expectation.*

  He filed the addendum. He died three years later, leaving the file in a cabinet marked *Interactive Kinds*.

  ***

  **London, 1978**

  Dr. Elena Vane, Otto's granddaughter, sat across from the woman. The office was not wood and dust, but fluorescent hum and formica. The patient, Sarah, was a ticket collector at Victoria Station.

  "I stop at the yellow line," Sarah said. Her voice was flat, practiced. "I can't step over it until the doors chime."

  "Even if the train is gone?"

  "Especially then."

  Elena opened the green file folder. The paper was brittle, the German script spidery. *Bahnhof-Starre.* She had translated it years ago. She knew the history. She knew that in 1913, the tremor was a telegraph. In the 1930s, it had become a piston. In the 1950s, a ticking clock.

  "Sarah," Elena said. "Have you heard of this condition before?"

  Sarah looked at the folder. She knew what was in it. In the waiting room, there were always other patients. They traded stories like baseball cards. *Do you hear the bell? Do you see the line? I read about a man in Vienna who counted the seconds.*

  "I know about Herr Abel," Sarah said. "I know he counted. But counting is… old fashioned. It's analog."

  "What is it for you?"

  Sarah held up her hand. She wasn't trembling. Instead, she was pressing her thumb against her index finger, over and over. A squeeze. A release.

  "It's a check," Sarah said. "Like a barcode. I have to scan myself before I can cross the line. If I don't scan, the system won't let me through."

  Elena wrote it down. *Symptom: Digital verification compulsion.*

  The loop was tightening. Abel had reacted to the *name* of the illness. Sarah was reacting to the *history* of the illness. She wasn't just performing the sickness; she was updating the software. She needed her diagnosis to be modern, to fit the world of scanners and punch cards. If she had trembled like Abel, she would have been dismissed as a relic. By scanning her thumb, she made the illness viable for 1978.

  "It feels real?" Elena asked.

  "It feels necessary," Sarah said. "If I don't scan, I'm not a passenger. I'm just… luggage."

  Elena updated the manual. She changed the classification from *Station Stiffness* to *Transit Verification Anxiety*. She published a paper citing the 1913 case as the progenitor. She sent it to the journals. She felt a thrill of discovery, mixed with a quiet dread. She was not observing a creature in the wild. She was writing the script for the next act.

  ***

  **Zurich, 1999**

  Elena sat in the retirement home, the green file on her lap. The room was quiet. There were no trains outside, only the hum of the highway.

  She had tracked the cases. There had been a cluster in Tokyo in 1985 (the bowing compulsion). A cluster in New York in 1992 (the turnstile hesitation).

  But the file was closed now.

  She had visited Victoria Station last month. She wanted to see the yellow line. It was still there, painted on the concrete. But the ticket collectors were gone. The gates were automatic glass barriers that opened when you waved a plastic card. There was no human to stop. There was no human to scan.

  The niche had collapsed.

  To have *Transit Verification Anxiety*, you needed a gatekeeper. You needed a moment of human judgment to resist. You needed the friction of the threshold. But the system was seamless now. You didn't cross the line; the line dissolved around you.

  She thought of Sarah. She wondered if Sarah still squeezed her thumb. Probably not. Without the gate, without the collector, without the possibility of being stopped, the compulsion had no anchor. It hadn't been cured. It had simply become impossible to perform.

  Elena took a pen from her pocket. She opened the file to the last page. She didn't write a new symptom. She didn't add a new addendum.

  She wrote: *Ecological niche extinct.*

  She closed the folder. The looping effect required a feedback channel—a patient to hear the label, and a world to provide the stage. The stage had been dismantled. The actors had gone home. The illness was not dead; it was just unemployed.

  Elena placed the file on the table. It sat there, heavy and silent, a taxonomy of ghosts. Outside, a train passed, silent and electric, sliding past the station without stopping, carrying no one who knew how to wait.
