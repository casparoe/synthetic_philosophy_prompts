          *   Core idea: Precommitment is rational when future preferences are expected to be *weak-willed* or *irrational* (time inconsistency).
          *   Condition: The future self must be "bound" to protect the higher-order preferences of the past self.
          *   Caveat: Precommitment is *not* rational if preferences change due to *new information* or *legitimate learning*. If Past-Self was wrong, binding Future-Self is irrational.
      *   **Stephen Holmes (*Passions and Constraint*):**
          *   Core idea: Constitutions (and precommitments) are *enabling*, not just restrictive. They create agency.
