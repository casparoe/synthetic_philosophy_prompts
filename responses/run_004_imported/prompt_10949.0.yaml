prompt: |-
  Random one but it's actually relevant to my diss (con law theory, precommitment chapter). Been deep in Elster (Ulysses and the Sirens / Ulysses Unbound) and Holmes's point that constitutional constraints can be enabling rather than just restrictive -- tying yourself to the mast isn't automatically irrational or anti-democratic, its what lets you get where your going. Anyway, in a fit of productivity guilt last month I set up my own mini Ulysses contract with my advisor: public monthly deadlines, and if I miss one she emails my whole committee (and my mom) announcing it. Felt very rational at the time. Now I'm two deadlines from disaster and past-me's preferences about how to spend this semester don't really match current-me's anymore. So, what are the most important implications of the philosophical debates over Ulysses contracts/constitutional precommitment for whether something like this is actually rational or legitimate, given that the self who signs the contract and the self who's bound by it aren't fully the same?
