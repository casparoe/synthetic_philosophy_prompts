answer: |-
  Here are eight interview questions designed to engage with the structural commitments of a Taurekian view without inviting the "view from nowhere" slogan. Each includes the primary question, a brief note on the anticipated reply, and a targeted follow-up to keep the pressure on.

  ### 1. The Structure of the Obligation
  **Question:** "Taurek's original argument focuses heavily on what the *sufferer* experiences—namely, that the one person who dies loses 100% of their future, just as any individual in the group of five does. But your work seems to shift the focus toward the *agent's* obligation. Do you ground the duty to flip a coin in the rights of the victims to equal concern, or in a constraint on the rescuer against making comparative judgments they aren't licensed to make?"

  *   **Anticipated Reply:** She will likely emphasize the agent's lack of authority to weigh lives, rather than victim rights.
  *   **Follow-up:** "If it's a constraint on the agent's authority, does that imply that if a *committee* were deciding rather than an individual, the prohibition on counting numbers would dissolve? Or is the prohibition structural to the moral situation itself, regardless of who decides?"

  ### 2. Public Policy and Ex Ante Consistency
  **Question:** "Critics often argue that rejecting aggregation in rescue cases forces you into counterintuitive positions regarding public policy. If we shouldn't save the greater number in a one-off rescue, it seems we also shouldn't adopt safety regulations that predictably save more lives at the cost of fewer lives elsewhere. How do you distinguish the moral arithmetic of a specific rescue dilemma from the *ex ante* rules we set for institutions, without conceding that numbers matter in the latter case?"

  *   **Anticipated Reply:** She will likely draw a sharp line between *ex post* rescue (specific identified victims) and *ex ante* policy (statistical lives), arguing aggregation is permissible for rules but not individuals.
  *   **Follow-up:** "But once the policy is enacted and a disaster occurs, the victims become identified. If we knowingly upheld a policy that resulted in five deaths when an alternative would have yielded one, haven't we effectively chosen the five deaths? Does the *ex ante* justification still hold once the victims are no longer statistical?"

  ### 3. Kamm's Weighted Lottery
  **Question:** "Frances Kamm proposes a weighted lottery as a compromise: you still use chance, but you give the larger group a proportionally higher probability of being saved. She argues this respects the separateness of persons while acknowledging the greater number of claims. Why do you insist on a flat fifty-fifty chance? Does a weighted lottery actually violate the individual standing of the person in the smaller group, or is your objection simply that any weighting smuggles in aggregation?"

  *   **Anticipated Reply:** She will argue that weighting treats the group of five as a single entity with five votes, violating the one person's equal standing.
  *   **Follow-up:** "But in a flat fifty-fifty split, doesn't the individual in the group of five effectively get 'diluted'? If I am the fifth person in the larger group, my chance of survival in a flat lottery is lower than in a weighted one. Are you prioritizing the procedural purity of the choice over the actual survival probability of the individuals in the larger set?"

  ### 4. Scanlon's Tie-Breaking Argument
  **Question:** "T.M. Scanlon argues we can save the greater number without aggregation by using a tie-breaking justification. He suggests that if you save the one, you can't justify to the five why you didn't save them, but if you save the five, you *can* justify to the one that you had to break a tie. Since this relies on individual justifiability rather than summing welfare, does Scanlon's contractualism avoid your objection to the 'view from nowhere,' or does it still rely on a hidden premise about the value of numbers?"

  *   **Anticipated Reply:** She will likely claim Scanlon's justification is hollow because "breaking a tie" isn't a sufficient reason to let someone die when a coin flip was an option.
  *   **Follow-up:** "So is your claim that 'fairness' (the coin flip) trumps 'justifiability' (Scanlon's reason)? If the one person knows you could have saved five but chose a coin flip instead, do you really think they can be reasonably reconciled to that procedure, or does the procedure only make sense from the rescuer's perspective?"

  ### 5. The Phenomenology of Choice
  **Question:** "There is a psychological intuition that facing five grieving families feels morally heavier than facing one. You argue this is a psychological bias, not a moral truth. But if moral obligations are meant to guide human agents, does your view require us to cultivate a kind of moral blindness to the scale of the outcome? Are you asking rescuers to suppress a natural moral perception, or are you saying that perception is illusory?"

  *   **Anticipated Reply:** She will argue it's not blindness, but clarity: seeing the situation as five separate 'one-vs-one' conflicts rather than one '5-vs-1' conflict.
  *   **Follow-up:** "If I see it as five separate conflicts, doesn't that logically lead me to resolve each 'one-vs-one' conflict in favor of the group, effectively saving the five anyway? How do you prevent the agent from re-aggregating the separate conflicts once they've acknowledged them?"

  ### 6. The Boundary of Special Duties
  **Question:** "Taurek allows that special duties—like a parent saving their own child—can override the duty to flip a coin. But where do you draw the line between a 'special duty' and a general moral obligation? If a doctor has a professional duty to maximize lives saved, does that professional role create a 'special duty' that collapses your distinction in clinical triage settings?"

  *   **Anticipated Reply:** She will likely distinguish between personal relationships (which ground partiality) and professional roles (which should remain impartial).
  *   **Follow-up:** "But if the professional role is just a proxy for the community's moral will, and the community believes numbers count, isn't the doctor bound by the community's aggregation? Or are you suggesting the medical profession itself is operating on a mistaken moral theory?"

  ### 7. The Metaphysics of Loss
  **Question:** "A common rebuttal to your position is that while 'loss' isn't additive across minds, the *total amount of suffering* in the world is objectively higher when five die than when one dies. Even if there is no super-observer, isn't the world itself in a worse state? Do you deny that 'world states' can be ranked morally, or do you deny that death contributes to a ranking in that way?"

  *   **Anticipated Reply:** She will deny that "world states" are the proper object of moral evaluation; only actions toward individuals are.
  *   **Follow-up:** "If world states aren't the object of evaluation, what happens to preventative ethics? If we can't say a world with fewer disasters is better than a world with more, do we lose the vocabulary to explain why we should prevent tragedies before the rescue dilemma even arises?"

  ### 8. Real-World Application (Closing)
  **Question:** "To close, I want to move out of the seminar room. Philosophers often treat the 'rescue case' as a controlled experiment, but you've argued this reflects a deep truth about moral obligation. Can you point to a specific real-world protocol—whether in disaster response, organ allocation, or military triage—where you believe current practice is wrong because it counts numbers? If your view is correct, what specific policy would you change tomorrow?"

  *   **Anticipated Reply:** She may hesitate here, often noting that real-world cases involve complicating factors (likelihood of survival, age, etc.) that muddy the pure numbers game.
  *   **Follow-up:** "If real-world cases are always too messy for the pure argument to apply, does that suggest the 'numbers don't count' principle is a negative constraint on theory rather than a positive guide for practice? In other words, is your view mostly about stopping utilitarians from overreaching, rather than telling rescuers what to do?"
