answer: |-
  **Setting:** *A café table directly across from the gilded entrance of the 'Golden Chance' Casino. It is 7:45 PM. Rain streaks the window. Outside, under the awning, stands MARK (30s). He is dry, but looking at the doors. He checks his watch. He puts a hand in his pocket, then takes it out.*

  **Characters:**
  *   **ELENA:** Defends the Holtonian view (Will as Resolution).
  *   **SAM:** Defends the Ainsliean/Picoeconomic view (Will as Hyperbolic Discounting).

  **SAM:** Look at him. The intersection is happening right now. See the posture? Shoulders tight, head tilted toward the noise. Last night, Mark's discount curve was shallow. The value of 'financial security next month' outweighed 'slot machine tonight.' But now? He's inside the event horizon. The immediate reward is spiking. The curve has gone hyperbolic.

  **ELENA:** You're describing the *pressure*, Sam, not the *failure*. If Mark walks through those doors, it won't be because a graph crossed a line. It will be because he is abandoning a resolution he explicitly formed to resist this exact pressure. He made a rule: *No casinos.* That's not a preference ranking; it's a policy.

  **SAM:** A policy is just a preference with a longer time horizon. What you call a "resolution," Ainslie calls "bundling." Mark's self from last night tried to bundle this moment with all future moments of temptation to increase the stakes. He told himself, "If I gamble now, I gamble forever." But that bargaining agreement is collapsing because the present self values the immediate hit more than the abstract bundle. There's no need to posit a "will" that got weak. There's just a shift in valuation between successive selves.

  **ELENA:** That reduces the agent to a battlefield. If you're right, Mark isn't *failing*; he's just being outvoted by a louder temporal part. But look at his face. He looks conflicted, not just buffeted. He feels he *ought* to keep walking. That normative force—the sense that he is betraying himself—is invisible to your picoeconomics. You explain the urge, but you don't explain the weakness. Weakness of will is specifically the capitulation to temptation *against* one's better judgment. Your model says his judgment has actually changed.

  **SAM:** His judgment hasn't changed; his perspective has. Last night's Mark was a different agent than Tonight's Mark. They have different utility functions because they occupy different temporal locations. To say Tonight's Mark is "weak" is to privilege Last Night's Mark's preferences as the 'true' ones. Why? Just because they were formed earlier? That's the "tyranny of the past." If Tonight's Mark decides the thrill is worth the risk, that's a rational update based on proximity. Your "resolution" is just a ghost in the machine, a homunculus shouting "No!" while the real math gets done underneath.

  **ELENA:** It's not a ghost; it's a capacity. Holton's point is that resolutions are distinct from intentions. An intention is to *do* X. A resolution is to *resist* temptations to do not-X. Mark has the capacity to maintain that resolution even when his preferences shift. If he walks in, it's not because his preferences changed—it's because he failed to exercise the capacity to shield his prior judgment from the distortion of temptation. Your view makes weakness of will inevitable whenever the curve spikes. But people *do* walk past casinos. Why?

  **SAM:** Because for them, the bundled value of sobriety still outweighs the immediate hit. Or they've used pre-commitment devices. Maybe they left their wallet at home. That's all mechanical. If Mark walks in, it's because the discount rate won. If he walks past, it's because the bundle held. Adding a "capacity to stick to resolutions" adds zero predictive power. It's just a label you slap on the outcome after the fact. "He walked past? Strong will." "He went in? Weak will." It's circular. My model predicts the breaking point based on the magnitude of the reward and the delay.

  **ELENA:** It's not circular; it's normative. Suppose Mark goes in because he sees a friend inside having a heart attack. He breaks his resolution. Is that weakness of will?

  **SAM:** No, that's a change in circumstances. The utility of saving a life outweighs the gamble.

  **ELENA:** Exactly. But on your view, how do you distinguish that from him going in because he just *really wants* to gamble? In both cases, the immediate preference outweighs the long-term plan. For you, both are just preference maximizations. For me, one is a justified revision of intention, the other is a failure of will. Weakness of will isn't acting against preference; it's acting against a resolution *without good reason*. Your hyperbolic discounting can't distinguish between a rational update and a capitulation. It treats the craving as a reason.

  **SAM:** The craving *is* a reason. It's a data point about current utility. You're smuggling in a moral judgment and calling it metaphysics. You want Mark to be responsible, so you invent a "will" that could have done otherwise. But look at him. *(Mark steps forward, then stops.)* He's trembling. That's not a moral agent deliberating; that's a conflict between limbic reward processing and prefrontal inhibition. The inhibition is what you call "will." It's a resource, like glucose. It depletes. It's not a faculty of rational adherence.

  **ELENA:** Even if it relies on cognitive resources, the *content* of the effort matters. He is trying to hold a line. If I tell a soldier, "Hold this trench," and he runs, you might say his fear curve spiked. But we court-martial him because he broke a commitment. Mark is court-martialing himself right now. That internal sanction—the guilt he's anticipating—isn't just a negative utility signal in a bargaining game between selves. It's the recognition of authority. He acknowledges Last Night's Mark as having authority over Tonight's Mark.

  **SAM:** Authority is just leverage in the intertemporal bargain. I trust my future self to diet only if my present self believes my future self will punish me for cheating. It's a reputation market within one skin. If Mark goes in, he's defaulting on a loan from his future self. It's bankruptcy, not sin. Your view does no explanatory work because you can't say *how* the will holds the line. You just say "he willed it." I say he recruited competing motives—maybe he thought about his daughter, maybe he feared the shame. Those are competing rewards.

  **ELENA:** But who recruits them? That's the point! The will is the capacity to direct attention to those competing motives *in service of the resolution*. Hyperbolic discounting treats attention as passive, pulled by the strongest stimulus. But Mark can *choose* to look away from the neon. He can *choose* to recite his rule. If he doesn't, it's not just that the gambling stimulus was brighter; it's that he failed to manage his attention in accordance with his resolution. That management *is* the will. Without it, you don't have an agent; you have a weather system of competing desires.

  **SAM:** And yet, my weather system predicts relapse rates in addiction with 80% accuracy. Your "capacity to manage attention" predicts nothing unless you know the strength of the attention-management resource, which varies... how? Based on fatigue? Stress? Which brings us back to biology and economics. You're positing a 'little man' inside Mark who decides how much attention to pay. But who decides for the little man? Infinite regress.

  **ELENA:** It's not a little man; it's a higher-order function. Look, he's moving.

  *(Outside, Mark turns his collar up against the rain. He turns his back on the casino door. He begins to walk away, fast.)*

  **SAM:** Interesting. The bundle held. The discounted value of 'self-trust tomorrow' spiked higher than the 'slots tonight.' Maybe he imagined the guilt vividly enough to alter the curve.

  **ELENA:** No. He kept his resolution. He felt the pull—the hyperbolic spike you love—and he didn't let it revise his policy. He recognized the temptation as a reason-distorter, not a reason. He exercised the capacity to stick to the plan *because* it was the plan.

  **SAM:** He exercised a neural inhibition pathway that won out over a dopaminergic drive. Call it "will" if it makes you feel better about holding him responsible. But if he comes back next week, don't tell me his "character" degraded. Tell me his discount rate adjusted based on the near-miss reward of walking away.

  **ELENA:** And if he comes back, I'll tell you he failed to learn how to maintain a resolution. You can explain the mechanics of the engine, Sam. But you can't explain the driving.

  **SAM:** There is no driver, Elena. Just the road and the gravity.

  **ELENA:** Then why is he walking away?

  **SAM:** Because the road curved.

  **ELENA:** Because he steered.

  *(They watch Mark disappear into the rainy street. The neon sign buzzes, reflecting in the empty café window.)*
