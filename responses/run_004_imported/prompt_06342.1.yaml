answer: |-
  **Title:** The Unity of Agency: Why Parfit's Hitchhiker Refutes "Rational Irrationality"

  Parfit's Hitchhiker case presents a stark dilemma for decision theory. A traveler stranded in the desert faces a driver who will offer rescue only if confident the traveler will pay a fee upon reaching town. Once in town, however, the traveler has no causal leverage; the ride is secured, and paying constitutes a pure loss. Causal Decision Theory (CDT) dictates that the traveler should not pay, as the act cannot causally influence the past prediction. Yet, a CDT agent, known to be rational in this sense, will not be picked up and will die. This outcome forces a choice between two interpretations: either genuine rationality requires a "rational irrationality" (being disposed to perform an act that is locally irrational), or the isolation of the payment act is a category error, rendering payment rational outright under a diachronic or non-causal standard. This essay argues for the latter position. Parfit's Hitchhiker does not establish the phenomenon of rational irrationality; rather, it demonstrates that Causal Decision Theory employs an impoverished temporal slice of agency. Paying is rational outright when assessed as part of a resolute plan, and this dispute is structurally identical to the disagreement between one-boxers and two-boxers in Newcomb's Problem.

  To understand the allure of "rational irrationality," one must engage directly with the Causal Decision Theorist's case. CDT evaluates acts based on their causal consequences. At the moment of choice in town ($t_2$), the driver's decision to rescue was made in the past ($t_1$). The traveler's current choice to pay or not pay cannot causally reach back to $t_1$. Therefore, the state of the world (being in town) is screened off from the action. The causal expected utility of paying is $-Fee$, while the utility of reneging is $0$. CDT concludes that reneging is the uniquely rational act at $t_2$. However, because the driver predicts this reasoning at $t_1$, the CDT agent is left in the desert. David Gauthier famously responded to this by arguing that it is rational to cultivate a "constrained maximization" disposition—to be the kind of person who pays—even though the act of paying itself remains irrational when the moment arrives. This is the thesis of rational irrationality: rationality governs the disposition, but condemns the act.

  This conclusion, however, is a *reductio ad absurdum* of the premise that the "moment of choice" is the sole locus of rational assessment. To claim that an agent is rational for cultivating a disposition but irrational for exercising it is to fracture the unity of agency. If rationality is the systematic pursuit of one's ends, and the only means to secure the primary end (survival) is the execution of the payment, then the payment cannot be irrational. Edward McClennen's theory of resolute choice captures this best. A resolute chooser does not treat prior plans as mere suggestions to be re-evaluated at every node; they treat the plan itself as the unit of choice. By resolving at $t_1$ to pay at $t_2$, the agent makes the payment at $t_2$ rational *because* it fulfills the plan that secured the rescue. To assess the payment in isolation is to ignore the causal history that made the situation possible. The "irrationality" of the act is an artifact of myopic evaluation, not a feature of the act itself.

  This defense of outright rationality hinges on rejecting the CDT insistence that only causal influence matters. In cases involving prediction, evidential relevance is sufficient for rational choice. This brings us to the relationship between Parfit's Hitchhiker and Newcomb's Problem. The structural isomorphism between the two is precise. In Newcomb's Problem, a Predictor places $1 million in Box B if they predict you will take only Box B (one-box). Box A always contains $1,000. Two-boxers (aligned with CDT) argue that the money is already in the boxes; taking both cannot causally change the past prediction, so taking both dominates. One-boxers (aligned with Evidential Decision Theory or EDT) argue that choosing one box is strong evidence that the million is there, yielding a higher expected utility.

  The Hitchhiker case is simply Newcomb's Problem with negative utilities for the "boxes." Refusing to pay is two-boxing (taking the guaranteed small gain of keeping the fee, risking the large loss of no ride). Paying is one-boxing (forgoing the small gain to ensure the large gain was made available). The disagreement is exactly the same: it turns on whether rational agents should respect the evidential link between their choice and a past prediction. CDT proponents in both cases rely on the principle that "you can't change the past." But this slogan is misleading. The agent is not changing the past; they are acting in a way that was predicted. If the predictor is reliable, the agent's type determines the past state.

  Some might argue the cases pull apart because Newcomb's involves a mysterious predictor, whereas Hitchhiker involves a strategic interaction. However, this distinction does not save CDT. In both cases, the agent's reasoning process is the object of prediction. If the driver is a perfect psychologist, they predict the traveler's decision theory. If the traveler uses CDT, the driver predicts reneging and leaves. If the traveler uses a policy-based theory (like EDT or resolute choice), the driver predicts payment and rescues. The "rational irrationality" view attempts to bridge this by saying "Use CDT, but pretend to be non-CDT." But if the driver is sufficiently astute, they will predict the traveler's *actual* decision at $t_2$, not just their $t_1$ disposition. A disposition that fails to execute is no disposition at all. Therefore, to survive, the agent must actually intend to pay, making the payment rational outright.

  A qualified verdict is necessary regarding the reliability of the driver. If the driver's foresight is no better than chance, CDT is correct: paying is irrational because it does not correlate with rescue. However, Parfit's case stipulates the driver *refuses* to set off unless *confident*. This implies a threshold of reliability high enough to make the correlation robust. In this specific region of reliability, the CDT agent is "money-pumped" (or life-pumped) by the resolute agent. Since a theory of rationality that systematically leads to death in predictable environments is deficient, we must reject the CDT assessment of the act.

  Consequently, "rational irrationality" is a misnomer. It suggests a contradiction where there is only a temporal myopia. If an act is required by the only rational plan available to an agent, the act inherits the rationality of the plan. To assert otherwise is to claim that it is rational to tie oneself to the mast (to resist the Sirens) but irrational to remain tied when the Sirens sing. This fractures the agent into a series of temporal selves rather than treating them as a unified entity extending through time.

  In conclusion, Parfit's Hitchhiker does not show that rationality requires irrational acts. It shows that Causal Decision Theory defines rationality too narrowly, ignoring the evidential significance of choices in prediction-laden environments. The payment is rational outright because it is the execution of a resolute plan that maximizes expected utility ex-ante. This verdict aligns perfectly with the one-boxer solution to Newcomb's Problem; both cases demonstrate that when a predictor is involved, the rational agent must choose the policy that correlates with the best outcome, not the act that dominates in a causal vacuum. Rationality is not about winning the battle at the moment of payment; it is about winning the war of survival, and that requires a theory of choice that honors the binding nature of rational plans.
