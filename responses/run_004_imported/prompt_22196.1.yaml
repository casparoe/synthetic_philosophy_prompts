  Let's write.

  *Title Idea:* The Dry Bed, The Moving Water, The Translator's Gap. Let's go with *The River Bed*.

  *Opening:* Start with the map.
  *Middle:* The linguistic mapping.
  *End:* The pen hovering.

  *Key Phrase to avoid:* "Verbal dispute." Instead: "They are speaking past each other," "The words sit differently."

