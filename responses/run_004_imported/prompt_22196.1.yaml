answer: |-
  The map lay spread across the drafting table, weighted at the corners by stones from the shrine itself. It was a good map, drawn by neutral surveyors before the Great Rain, but it was already a lie. The blue line marked *Vess* meandered through the center of the paper, bisecting the island where the shrine stood. Outside the tent, the actual Vess flowed three miles to the east, a broad, muddy scar across the plain.

  Elara adjusted her headset, though the room was silent. The two delegations sat on opposite sides of the table, separated by the width of the paper and three generations of blood.

  On the left, High Speaker Torin of the Kaeli. His people followed the water. To them, the border was alive, shifting with the seasons and the floods.
  On the right, Matriarch Vesa of the Oren. Her people followed the stone. To them, the border was a promise etched into the earth, immutable.

  "The shrine sits on our bank," Torin said. His voice was low, tired. "The water defines the land. The water is now here." He tapped the dry ground east of the island. "Therefore, the land is ours."

  "The shrine sits on our bank," Vesa countered. She did not look at the map. She looked at Torin. "The channel defines the river. The channel is still there." She tapped the dried mud of the old riverbed that now cradled the island. "Therefore, the land is ours."

  Elara watched them. She was the translator, though lately she felt more like a mechanic trying to mesh gears that had been filed into different shapes. For three weeks, they had argued. Not about the history—both agreed the flood had come in the night, three years ago. Not about the physics—both agreed the water had abandoned the old channel and carved a new one. They agreed on every particle of silt and every drop of rain. They disagreed only on what to call the result.

  That night, Elara stayed in her quarters while the delegates slept. She spread her notebooks out. She had transcribed every hour of the negotiation. She began to isolate the nouns.

  When Torin said *Vess*, he pointed to the continuous stream of water originating in the northern peaks.
  When Vesa said *Vess*, she pointed to the continuous depression in the earth originating in the northern peaks.

  She wrote it down: *Referent A = Water-Stream. Referent B = River-Bed.*

  It seemed simple. Too simple. If it were just that, they would have solved it in an hour. She dug deeper into the grammar.

  In Kaeli, the verb *to flow* was transitive when applied to borders. *The river flows the boundary.* The boundary was an object carried by the water.
  In Oren, the verb *to hold* was used. *The bed holds the boundary.* The boundary was an object possessed by the earth.

  Elara tried to construct a sentence in the neutral tongue that satisfied both grammatical structures.
  *The water currently occupies the eastern plain.* (Fact)
  *The depression currently occupies the central plain.* (Fact)
  *The shrine sits in the depression.* (Fact)
  *The water does not touch the shrine.* (Fact)

  She stared at the page. There was no contradiction. If she stripped away the word *Vess* and replaced it with *Water-Stream* and *River-Bed*, the dispute vanished. There was no mystery about where the border was, because there was no single thing called *The Border* that existed independently of the definition. There was only the water and the earth, and the rules they chose to apply to them.

  It was a verbal knot. She could feel the looseness of it now. They were fighting over a label, treating the word *Vess* as if it were a rigid designator for a specific metaphysical object, when it was actually a variable slot filled by different concepts. Once she forced them to see the slot, the conflict should dissolve.

  She slept poorly. The next morning, the air in the tent was thick with dust and anticipation.

  "I have a proposal for the transcript," Elara said. She placed a new sheet of paper before them. "I ask that we cease using the proper noun *Vess* in all legal clauses regarding the boundary."

  Torin frowned. "The river is the Vess. It is in the treaty."

  "The word is in the treaty," Elara said. "But the word is doing two jobs. Speaker Torin, when you say *Vess*, do you mean the water that moves?"

  "I mean the life of the land," Torin said. "Water brings the border."

  "Matriarch Vesa, when you say *Vess*, do you mean the channel that stays?"

  "I mean the memory of the land," Vesa said. "Stone keeps the border."

  "Then let us write this," Elara said, sliding the paper forward. "Clause One: The Water-Stream currently flows three miles east of the Shrine. Clause Two: The River-Bed currently encompasses the Shrine. Clause Three: Both parties agree on the physical location of the Water-Stream and the River-Bed."

  She waited. This was the moment of dissolution. In the philosophy texts she'd scavenged from the university ruins, this was where the ontological tension released. Once the quantifier variance was exposed, once they saw that existence claims were just choices of language, the anger should evaporate. They would see they were describing the same world with different maps.

  Torin read the clause. He looked at Vesa.
  Vesa read the clause. She looked at Torin.

  "This is true," Torin said slowly.
  "This is accurate," Vesa agreed.

  "So," Elara said, feeling a surge of relief. "We agree on the facts. The metaphysical dispute is resolved. There is no further fact about whether the shrine is 'really' on the Vess, only whether it is on the Stream or the Bed."

  The silence that followed was not the silence of peace. It was heavier.

  Torin leaned forward. "Translator. You have clarified the geography. You have not clarified the law."

  "The treaty says the border follows the Vess," Elara said. "Now we know what the Vess is. Or rather, that it is two things."

  "Which one gets the shrine?" Vesa asked. Her voice was quiet, but it cut through the tent like a knife.

  Elara blinked. "I... I thought if we agreed on the description, the entitlement would follow. If there is no fact of the matter about the river's identity, then the dispute was merely verbal."

  "There is no fact about the river," Torin said. He picked up a stone from the table, weighing it. "But there is a fact about the shrine. It belongs to someone. You have told us that our words were loose. Fine. We will tighten them. But you have not told us which tightening is *just*."

  Vesa nodded. "You have shown us that the river does not decide. So we must decide. But if we decide based on the Water-Stream, you favor the Kaeli concept. If we decide based on the River-Bed, you favor the Oren concept. Your 'neutral' language is not neutral. It is a menu."

  Elara felt the floor drop out of her argument. She had assumed that proving the dispute was verbal would solve the problem. But the verbal dispute had been a container for something else. They hadn't been fighting about the river because they cared about the metaphysics of water. They had been using the metaphysics of water to fight about the shrine.

  "But..." Elara struggled. "If there is no deeper fact about the river, then neither side is wrong about the world. You are both describing reality correctly, just using different conventions."

  "Then which convention rules the shrine?" Torin pressed. "Does the shrine follow the water, because water gives life? Or does it follow the bed, because stone keeps faith?"

  Elara looked at her notes. She had successfully demonstrated the Hirschian point: the ontological disagreement was shallow. There was no "joint" in the reality of the river that one side was carving and the other missing. Both vocabularies were valid. But in doing so, she had stripped the river of its authority to decide the case.

  Previously, they could pretend the river itself dictated the border. *The Vess says so.* Now, they knew the Vess was just a word they had chosen to bind themselves with. The choice of the word was the law, not the water.

  "So the dispute wasn't about the river," Elara said softly.

  "No," Vesa said. "It was about who gets the shrine. We used the river because it is easier to argue about water than about greed."

  Torin stood up. He walked to the flap of the tent and looked out at the dry ground where the shrine stood. "You have cleared the fog, Translator. I can see the shrine clearly now. I can see the water clearly now. I see there is no magic in the word *Vess*." He turned back. "So now we must choose. Not what is true, but what is right. And you cannot translate that for us."

  "But," Elara said, the philosophical implication hitting her hard, "if you choose based on justice, doesn't that imply there is a real fact about entitlement? A joint in the moral reality?"

  Vesa smiled, a thin, tired expression. "Perhaps. Or perhaps we just pick a language and enforce it. Perhaps the 'joint' is only made by the sword, or the pen."

  "Is there a fact of the matter?" Elara asked. "About who owns it? Independent of what you decide?"

  Torin looked at her, and for the first time, he looked uncertain. "If there is, God has not written it in the water or the stone. We must write it ourselves."

  He sat down. He picked up the pen. He hovered it over the new clause sheet Elara had provided. The sheet stated the physical facts perfectly. It dissolved the ontological confusion. It left the normative question entirely open.

  "If I sign this," Torin said, "I admit the river-bed is a valid concept. But I do not admit it holds the border."

  "If I sign this," Vesa said, "I admit the water-stream is a valid concept. But I do not admit it carries the border."

  "Then what determines the border?" Elara asked. "If the metaphysics is neutral..."

  "Then power does," Torin said. "Or mercy. Or history. But not the river."

  Vesa reached out and touched the paper. "Or perhaps the choice of language *is* the carving. If we choose the Kaeli language for the treaty, we carve the world one way. If we choose the Oren language, we carve it another. There is no 'world' underneath the carving that tells us which knife to use."

  Elara looked at the map. The blue line was still there, ghostly on the paper. Outside, the wind blew dust over the dry channel. The water rushed unseen miles away. She had done her job. She had shown them that the universe did not care about their border. The universe simply was. The border was a thing they made.

  But knowing that didn't tell them how to make it.

  She realized then why the texts she had read always ended in frustration. Sider had argued that one vocabulary must carve at the joints. But looking at Torin and Vesa, she wondered if the joints weren't in the earth at all. Maybe the joints were in the agreement itself. Maybe the only thing that was 'real' was the commitment they were about to make, and the metaphysics was just the scaffolding they were now dismantling.

  Torin capped the pen. "We need to recess."

  "To discuss the entitlement?" Elara asked.

  "To discuss which world we wish to live in," Vesa corrected. "The one where the water moves, or the one where the stone stays. Both are true. Both cannot be law."

  They stood. The tension had shifted. It was no longer the frustration of misunderstanding. It was the weight of decision. They walked out into the sunlight, leaving Elara alone with the map.

  She looked at the clause she had written. *Clause One: The Water-Stream currently flows three miles east...* It was perfect. It was empty.

  She wondered if she had solved anything. She had removed the illusion that the answer was waiting in the mud. But in doing so, she had forced them to look at each other instead of the river. That was harder.

  Elara packed her notes. She left the map on the table. The blue line remained, dividing the paper, dividing the room, dividing the world. It was just ink. It was everything.

  Outside, the wind picked up, blowing sand across the old riverbed, filling the cracks, smoothing the surface until it was impossible to tell where the water had once been. She watched the dust settle, waiting to see which way the wind would blow tomorrow, knowing it wouldn't tell her where the border lay. Only the pen would do that. And the pen was still uncapped.
