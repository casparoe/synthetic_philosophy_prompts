      *   **Alicke's Culpable Control:** The user describes the "speeding to hide illicit thing vs. anniversary present" scenario. This refers to Alicke's work on *culpable control* and *spontaneous trait inference*. Alicke did show that negative motives/outcomes inflate judgments of causality, foreseeability, and control. The user's summary ("settle on how much blame... then adjust... factual judgments") is a fair summary of the *motivated reasoning* aspect of Alicke's model.
      *   **Timeline:** Knobe's seminal paper was 2003 ("Intentional Action and Side Effects in Ordinary Language"). Alicke's work on culpable control started appearing in the 90s (e.g., 1992 "Culpable Causation"). So Priya is right that the psychological mechanism was discussed earlier.
      *   **Verdict:** The representations are broadly accurate, though nuances exist (e.g., Alicke focuses heavily on *causality* and *blame*, Knobe on *intentionality* and *conceptual structure*).

  3.  **Evaluate the "Collapse" Worry (Task 2):**
      *   **The User's Argument:** Knobe Effect persists in non-moral norm violations (e.g., Pettit & Knobe 2009, or Knobe's later work on norms). Therefore, it's about *norms*, not just *blame*.
      *   **Priya's Potential Counter:** Expand "blame" to "normative evaluation."
