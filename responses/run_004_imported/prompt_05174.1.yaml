          *   **Philosophy View (User/Knobe):** Moral/Normative influence is *constitutive*. The folk concept of "intentional" *includes* normative judgment. There is no "true" neutral concept being distorted.
          *   **The "Norm" Shift:** Even if Priya says "Norm-based validation," if she views it as a heuristic/bias to assign responsibility, she differs from the view that normativity is *part of the meaning* of intentional action.
