              *   **Philosophy (Knobe/x-phi):** Focuses on the *concept*. The distortion *is* the concept. Intentionality *is* partly normative. It's a feature of the concept, not a bug in the processing.
          *   **The "Deep" Distinction:** Alicke treats the moral influence as a *bias* interfering with a neutral assessment of intentionality. Knobe (and the x-phi interpretation the user is defending) suggests the moral/normative element is *constitutive* of the folk concept of intentionality.
          *   **The "Norm" Expansion:** Even if Priya adopts "norm-based validation," does she treat it as a *bias* or as *conceptual structure*? If she treats it as a bias (we *shouldn't* judge intentionality this way, but we do), she remains in the descriptive/error psychology camp. If she accepts the normativity is built into the concept, she is doing conceptual analysis (philosophy).
      *   **Key Literature:** Mention the "Deep Self" model (Sripada), the "Normative Competence" view (Knobe later moved this way), and the distinction between *performance errors* vs. *competence*.

