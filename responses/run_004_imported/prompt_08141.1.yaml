prompt: |-
  In my AP European History class, we recently spent a week on the Marquis de Condorcet as part of a unit on the Enlightenment, and the detail that stuck with me most was not his political activism but a mathematical result our teacher mentioned almost in passing: the Condorcet Jury Theorem, from his 1785 essay applying probability theory to majority decisions. The idea that a group of voters who are each only slightly more likely than not to be correct about some factual question will, if their judgments are independent, reach the right verdict with near certainty as the group grows large enough seems to have been, for Condorcet, just one piece of a larger project of building a genuine "social mathematics" that could ground political decisions in something more rigorous than tradition, rhetoric, or aristocratic privilege. What impressed me further is that he applied this commitment to equality with unusual consistency: he was one of the very few Enlightenment figures to argue seriously for extending full citizenship and the vote to women, and he chaired the constitutional committee that in 1793 produced a draft constitution for France, sometimes called the Girondin constitution, which was quietly set aside once his political allies fell from power.

  Not long after that unit, a friend sent me a link to a blog post about "futarchy," a governance proposal from the economist Robin Hanson, whose slogan for it is roughly "vote on values, but bet on beliefs": an elected body would decide on and periodically update some measurable definition of national welfare, while the choice of which specific policy to adopt in order to raise that measure would be handed over to speculative markets, where anyone willing to risk money could bet on the outcomes of different proposed policies, with whichever policy the market currently prices as most likely to raise expected welfare being the one that actually gets implemented. It struck me as a strange descendant of exactly the kind of probability-driven, anti-rhetorical approach to collective judgment that Condorcet was reaching for, except that it replaces his equally-weighted, independent voters with self-selected traders whose influence over the outcome is proportional to how much money they are willing and able to stake.

  I would like you to reconstruct, as specifically as you can from Condorcet's own arguments rather than from a generic impression of "Enlightenment rationalism," what verdict he would likely have reached about futarchy as a mechanism of governance. Would he have welcomed it as finally realizing, through real institutions and incentives, the kind of mathematically disciplined aggregation of judgment his jury theorem only gestured toward on paper? Or would his own theoretical commitments have generated principled objections to it, for instance about whether traders who can observe and imitate one another's positions still satisfy the independence condition his theorem depends on, or about whether letting wealth determine political influence betrays the same egalitarian instincts that led him to defend women's suffrage and to distrust arguments from mere privilege? I would also be curious whether you think the divide at the center of futarchy, between values settled democratically and beliefs settled by markets, corresponds to anything in Condorcet's own writing about which political questions should be left to specialized judgment and which should be decided by the broader citizenry.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Compare Marquis de Condorcet's political/mathematical philosophy (specifically the Condorcet Jury Theorem and his egalitarianism) with Robin Hanson's "Futarchy" ("vote on values, bet on beliefs").
      *   **Task:** Reconstruct Condorcet's likely verdict on Futarchy based *specifically* on his own arguments and commitments, not just generic Enlightenment tropes.
      *   **Key Questions to Address:**
          *   Would he see Futarchy as a realization of "social mathematics"?
          *   Would he object based on the *independence condition* of his Jury Theorem (traders observing/imitating each other)?
          *   Would he object based on *egalitarianism* (wealth determining influence vs. one person, one vote)?
          *   Does the Futarchy split (values vs. beliefs) map onto Condorcet's distinction between questions for citizens vs. specialists?

  2.  **Deconstruct Condorcet's Core Commitments (based on historical knowledge):**
      *   *The Condorcet Jury Theorem (CJT):* Requires independence of voters, competence ($p > 0.5$), and sincere voting based on truth-seeking. As $N \to \infty$, probability of correct majority decision $\to 1$.
      *   *Epistemology:* Truth is discoverable through reason and evidence. Probability is the tool for managing uncertainty in social affairs ("social mathematics").
      *   *Political Egalitarianism:* Universal suffrage (including women), equality of rights. Privilege (birth, wealth) should not dictate political power.
      *   *Role of Experts vs. People:* He believed in education to raise competence ($p$). He distinguished between *principles/rights* (universal reason) and *technical administration* (expertise), but ultimately sovereignty lies with the people.
      *   *Sincerity:* Voters must vote their conscience/judgment, not under coercion or undue influence.

  3.  **Deconstruct Futarchy (Hanson's Proposal):**
      *   *Mechanism:* Democracy sets a utility function (values). Prediction markets select policies to maximize that function (beliefs/facts).
      *   *Incentive:* Traders profit by predicting outcomes correctly.
      *   *Weighting:* Influence is proportional to capital staked (wealth), not one-person-one-vote.
      *   *Information Aggregation:* Relies on the "Wisdom of Crowds" / Efficient Market Hypothesis.

  4.  **Synthesize/Compare (The "Verdict"):**

      *   *Point 1: Social Mathematics & Probability.*
          *   *Condorcet:* Would likely appreciate the *intent*. Using probability to guide policy is exactly his "social mathematics."
          *   *Futarchy:* Uses market prices as probability estimates.
          *   *Verdict:* Sympathetic to the *goal*, but skeptical of the *method*. Markets aren't the same as independent jurors.

      *   *Point 2: The Independence Condition (Crucial Technical Point).*
          *   *Condorcet:* CJT *requires* independence. If voters copy each other, the effective $N$ shrinks, and the theorem fails.
          *   *Futarchy:* Markets are inherently interactive. Traders watch prices and adjust. Herding is a known market failure.
          *   *Verdict:* Strong objection. Markets violate the independence axiom of his own theorem.

      *   *Point 3: Equality and Wealth.*
          *   *Condorcet:* Radical egalitarian. Women's suffrage. Opposed property qualifications for voting. Believed political right stems from human capacity for reason, not wealth.
          *   *Futarchy:* Plutocratic element. Richer traders have more say on "beliefs" (policies).
          *   *Verdict:* Strong objection. This reintroduces aristocracy of wealth, which he fought against. It conflates economic power with epistemic authority.

      *   *Point 4: Values vs. Beliefs (The Split).*
          *   *Condorcet:* Distinguished between *rights* (universal) and *administration* (technical). However, he believed the people could judge the *outcome* of administration. He didn't outsource policy selection to a non-democratic mechanism. He trusted educated citizens to judge means-ends relationships.
          *   *Futarchy:* Outsourcing policy selection to markets.
          *   *Verdict:* Condorcet would likely argue that judging the efficacy of policies is a matter of public reason and education, not gambling. He would prefer raising $p$ (competence) via education rather than weighting by wealth.

      *   *Point 5: Sincerity vs. Incentive.*
          *   *Condorcet:* Voters vote truthfully based on judgment.
          *   *Futarchy:* Traders bet profitably.
          *   *Verdict:* Condorcet might worry that profit motives distort the search for truth (e.g., manipulation, insider trading) whereas civic duty fosters sincere judgment.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Establish Condorcet's dual identity (mathematician + radical democrat).
      *   *Section 1: The Mathematical Objection (Independence).* Focus on the CJT. Explain why market interaction violates independence. Condorcet knew about correlation of errors.
      *   *Section 2: The Political Objection (Equality).* Focus on his 1790 essay on women's citizenship. Wealth as a qualification for influence is anathema to him. Futarchy creates an "aristocracy of capital."
      *   *Section 3: The Epistemic Objection (Education vs. Incentives).* Condorcet's solution to low competence was *education* (raising $p$), not *weighting* by wealth. He believed in the perfectibility of man.
      *   *Section 4: Values vs. Beliefs.* Analyze the split. Condorcet saw policy as applied reason, accessible to all. Markets obscure the *why*.
      *   *Conclusion:* Summarize the verdict. He would admire the ambition but reject the mechanism as a betrayal of both his math and his morals.

  6.  **Refining Specific References:**
      *   Mention *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785).
      *   Mention *On the Admission of Women to the Rights of Citizenship* (1790).
      *   Mention the *Sketch for a Historical Picture of the Progress of the Human Mind* (1795) regarding education/perfectibility.
      *   Ensure the distinction between "competence" ($p$) and "weight" is clear.

  7.  **Self-Correction/Nuance Check:**
      *   *Did Condorcet believe in experts?* Yes, he believed in representative systems where representatives might be more informed, but they were bound by mandates and recall. He didn't support unaccountable technocrats. Futarchy markets are unaccountable technocrats in a sense.
      *   *Is the independence condition absolute?* In CJT, yes, for the strong convergence result. Condorcet was aware of "correlated errors."
      *   *Tone:* Keep it analytical, historical, and philosophical. Avoid taking sides on whether Futarchy works, focus on Condorcet's *likely view*.

  8.  **Final Polish:** Check against the prompt's specific questions (independence, wealth/privilege, values/beliefs split). (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a remarkably precise juxtaposition. You have identified a genuine intellectual lineage: Robin Hanson's futarchy is, in a sense, a modern market-libertarian attempt to solve the same problem Condorcet tackled with probability theory—how to aggregate dispersed information to make optimal collective decisions without falling prey to demagoguery or ignorance.

  However, if we reconstruct Condorcet's verdict based on his specific writings—particularly the *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785), his *On the Admission of Women to the Rights of Citizenship* (1790), and the *Sketch for a Historical Picture of the Progress of the Human Mind* (1795)—it is highly likely he would reject futarchy. While he would admire its ambition to create a "social mathematics," he would view its mechanisms as violating the mathematical prerequisites of his own theorem and betraying the moral foundations of his republicanism.

  Here is a reconstruction of Condorcet's likely objections, categorized by his mathematical, political, and epistemic commitments.

  ### 1. The Mathematical Objection: The Violation of Independence
  The most technical but devastating objection Condorcet would raise concerns the **independence condition** of the Jury Theorem.

  Condorcet's theorem relies on the assumption that voters make judgments independently. If voters are influenced by one another, the errors become correlated. If Voter B simply copies Voter A, you do not have two votes; you have one vote with double weight. As the correlation of errors increases, the probability that the majority reaches the correct decision does not converge to 1, even as the group size grows. In extreme cases of "herding," a large group can be confidently wrong.

  Condorcet was acutely aware of this. In his 1785 *Essay*, he distinguished between decisions made by independent jurors and those made by assemblies where rhetoric and factionalism could sway opinion. He feared the "influence of opinions" that destroys independence.

  **The Verdict on Futarchy:**
  Condorcet would argue that prediction markets inherently violate independence. Traders do not arrive at prices in a vacuum; they observe the market price (the aggregate belief) and trade based on that observation. This creates a feedback loop. If a market price shifts, traders often interpret that as information ("smart money is moving"), leading to herding behavior. For Condorcet, a market price is not a clean aggregation of $N$ independent judgments; it is a dynamic system where judgments are causally linked. He would likely view futarchy as susceptible to bubbles and cascades, failing the mathematical rigor he demanded for "social mathematics."

  ### 2. The Political Objection: Wealth as Epistemic Authority
  Your intuition about Condorcet's egalitarianism is historically well-founded. Condorcet was unique among the *philosophes* for arguing that political rights derive from the capacity for moral reasoning, which is universal, rather than from property or gender. In *On the Admission of Women to the Rights of Citizenship*, he wrote:

  > "Either no individual of the human race has any true rights, or all have the same; and he who votes against the right of another, whatever his religion, colour or sex, thereby abjures his own."

  For Condorcet, the "one person, one vote" principle was not just a moral preference; it was an epistemic necessity. If every human possesses reason, excluding some based on arbitrary traits (like sex or wealth) reduces the sample size ($N$) of the jury without improving the average competence ($p$).

  **The Verdict on Futarchy:**
  Futarchy weights influence by capital. A billionaire's "belief" counts for more than a pauper's "belief." Condorcet would view this as a resurrection of the aristocracy of wealth he fought to destroy. He would argue that wealth is not a proxy for competence ($p$). In fact, he might argue that wealth introduces bias: a trader with a large stake in a specific industry might bet against a policy that is socially optimal but hurts their portfolio, regardless of the "truth" of the outcome.

  By allowing money to determine policy selection, futarchy conflates *economic power* with *epistemic authority*. Condorcet would see this as a violation of the equality of rights. He would ask: Why should the man who owns the most grain have the greatest say on whether a tariff on grain improves national welfare? To Condorcet, this is not rational aggregation; it is privilege masquerading as mathematics.

  ### 3. The Epistemic Objection: Education vs. Incentives
  This is perhaps the deepest philosophical divide. Condorcet's solution to the problem of voter incompetence was **education**, not **incentives**.

  In the *Sketch*, Condorcet outlines a vision of human perfectibility. He believed that through public instruction, the average competence ($p$) of the citizenry could be raised above the 0.5 threshold reliably. He trusted that if you educate people, they can discern the truth. His "social mathematics" was meant to guide the design of institutions (like voting systems) that protect the truth-seeking capacity of an educated populace.

  Hanson's futarchy, conversely, is somewhat pessimistic about the public's ability to know facts ("bet on beliefs"), so it outsources factual judgment to those with "skin in the game."

  **The Verdict on Futarchy:**
  Condorcet would likely view the reliance on monetary incentives as a moral and civic failure. He believed citizens should vote based on **conscience and reason**, not personal gain. In a jury, you are not supposed to bet on the verdict; you are supposed to deliberate to find the truth.
  *   **Sincerity:** Condorcet valued sincere voting. In futarchy, a trader might bet on a policy they *know* will fail, if they can profit from the failure (e.g., shorting the national currency). This decouples the mechanism from the pursuit of the common good.
  *   **Transparency:** Condorcet wanted political reasoning to be public and debatable. Market prices are opaque signals. A policy chosen by a market does not come with a public justification that citizens can understand or contest. For Condorcet, legitimacy requires that citizens understand *why* a law is passed, not just that it was the "winning bet."

  ### 4. The Values/Beliefs Split
  You asked whether the futarchy divide (values = democracy, beliefs = markets) maps onto Condorcet's writing. Condorcet did distinguish between **principles** (rights, justice) and **facts** (administration, policy efficacy). However, he did not believe facts were the exclusive domain of a technocratic or market elite.

  Condorcet believed that while representatives might draft laws (due to efficiency), the *principles* and the *judgment of outcomes* belonged to the people. He advocated for frequent elections and the ability of constituents to instruct their representatives. He believed the "general will" could discern the connection between means and ends if properly informed.

  **The Verdict on Futarchy:**
  Condorcet would reject the idea that "beliefs" about policy efficacy should be removed from the democratic sphere. To him, determining whether a policy serves the public welfare is a matter of **public reason**, not speculative gambling.
  *   If the people define "national welfare" (values) but are barred from judging how to achieve it (beliefs), they are sovereign in name only.
  *   Condorcet would argue that separating values from beliefs creates a class of unaccountable governors (the market traders). If the market chooses a policy that devastates the poor but technically raises the GDP metric, the people have no recourse, because the market was "right" about the belief (GDP went up) even if it violated the spirit of the value (welfare). Condorcet would see this as a dangerous abdication of civic responsibility.

  ### Summary: The Verdict
  If Condorcet were to review Robin Hanson's futarchy, his judgment would likely be:

  **"A brilliant but dangerous error."**

  He would applaud the **intent**: the desire to replace rhetoric with calculation and to use probability to serve the public good. He would recognize futarchy as a kindred spirit in the project of "social mathematics."

  However, he would reject the **institution**:
  1.  **Mathematically:** Because markets violate the independence condition required for the wisdom of crowds to converge on truth.
  2.  **Politically:** Because weighting votes by wealth reinstates the aristocracy of privilege he sought to abolish.
  3.  **Morally:** Because it substitutes civic virtue and education with profit motives and gambling.

  Condorcet's alternative would not be to bet on beliefs, but to **teach** them. He would argue that the resources spent building complex prediction markets should instead be spent on universal public education to raise the $p$ of every voter. For Condorcet, the only legitimate "social mathematics" is one that treats every rational mind as an equal variable in the equation of the general will. Futarchy, by weighting variables by gold, would strike him as solving the wrong variable.
