      The granddaughter's perspective (the love).
      Final image: Him, finally signed as himself on the coffin/card.

  10. **Review against constraints:**
      *   4-5 mins? (Word count check: ~700 words is usually good for this pace).
      *   Voice? (Grief + Pride).
      *   No confession? (It implies, doesn't state).
      *   What was lost? (The witness to his own genius).

      *Let's write.* (Proceeds to generate the eulogy based on these thoughts).

      *Post-Draft Check:* Does it feel like an argument? I need to ensure it doesn't sound like she's justifying the crime. It needs to sound like she's mourning the *sacrifice*. The sacrifice of identity.

      *Refining the "Loss":* It's not that he didn't get famous. It's that he had to kill a part of himself to do it. Every drawing was a suicide of the ego. That's the tragedy.

      *Final Tweak:* Make sure the ending lands on the granddaughter's relationship with him, grounding the high concepts in personal love.

