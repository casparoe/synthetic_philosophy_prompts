answer: |-
  Thank you all for coming. I know… I know this is a complicated room.

  There are people here who knew him as the man who made tea at six o'clock, who fixed the loose banister, who told the same three stories about the war every Christmas. There are others here who knew him as a hand that could move across a page with a certainty most of us only dream of. And there are others still who knew him as a question they could never quite answer.

  He was all of those things.

  We spend a lot of time talking about what my grandfather made. But I've been thinking, these last few days, about what he gave away.

  To make something beautiful is an act of love. But to make something beautiful and then tell the world it belongs to someone else… that is an act of erasure. It requires a kind of silence that most of us couldn't endure.

  I watched him work, sometimes. Not the work you saw—the sketches on the kitchen table, the copies of the copies. I mean the real work. The hours where the rest of the house had to be quiet. Where the light had to be just so. I saw him hold a pen that cost more than our groceries, and I saw him hesitate. Just for a second. Before he put down a name that wasn't his.

  People talk about authenticity. We treat it like it's a chemical property, something you can test for with a microscope or a black light. But I think my grandfather knew that authenticity is actually a relationship. It's the bond between the hand that makes and the eye that sees. It's the witness.

  Every time he finished a piece, every time he achieved that thing he chased for forty years—that perfect, breathing likeness—he had to sever that bond. He had to look at the best thing he had ever done and say, "This is not me."

  I don't think he did it for the money. Not mostly. I think he did it because he was in love with the masters, in the way a prisoner is in love with the outside world. He wanted to live inside their heads. He wanted to know how a line felt before it became a shadow. But the rent for that apartment was his own identity.

  And that is what was lost. Not to the buyers. They got the beauty they paid for. The loss was his.

  Imagine spending your life speaking a language fluently, perfectly, but never being allowed to say "I." Imagine writing a letter to someone you love, and signing it with a stranger's name, over and over, until you forget the shape of your own signature.

  There is a specific kind of loneliness in being unseen when you are standing in plain sight. He accepted that loneliness. He accepted that he would be the secret history of the things he loved. He accepted that the truth of his life would have to live in the subtext, in the margins, in the foxing on the paper and the age of the ink.

  I know there are people in this room who spent a long time trying to prove he was a liar. I don't blame you. It was your job to find the crack in the glass. But I hope, today, you can acknowledge that the glass held.

  And I know there are people here who helped him age the paper. Who helped him build the disguise. You gave him the time he needed.

  But to me, he wasn't a disguise. He was the only constant I ever had.

  He taught me that art isn't about the name in the corner. It's about the attention. It's about the care. He poured forty years of attention into work that carried other men's names. That is a tragedy, yes. It is a waste of a human life to be a ghost in your own story.

  But it was also a gift. Because it means that nothing he made was ever about ego. It was never about fame. It was about the work itself. He served the drawing, not the other way around.

  He is gone now. And for the first time in forty years, there is no name to be written. No mask to be fitted. There is just the man in the box, under his own name, in a room full of people who loved him for exactly who he was.

  He doesn't have to be anyone else anymore.

  So, if you knew him as the artist, honor the hand. If you knew him as the mystery, honor the silence. And if you knew him as Grandfather, just honor the man.

  He paid the price. He did the work. And he is finally, finally signed.

  Thank you.
