  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Context:** End of a novel about "Grandfather," a master forger of old-master drawings who was never caught. Two of his works are still attributed to masters in private collections.
      *   **Scene:** Penultimate chapter, his wake. Narrated by his adult granddaughter (the POV character).
      *   **Task:** Write the eulogy she delivers.
