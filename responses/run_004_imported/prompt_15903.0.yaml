      *Key Phrase Idea:* "He was a ghost in his own life." "The price of the perfect lie is that you have to disappear." -> Too blunt.
      *Better:* "He gave away the best parts of himself, wrapped in someone else's skin."

      *Let's focus on the act of signing.* That's the specific moment of loss. The pen hovering. The decision to write "Rembrandt" instead of his own name.

  9.  **Final Polish (incorporating into the final output):**
      *   Ensure the rhythm is speech-like.
      *   Make sure the detective feels acknowledged but not challenged.
      *   Make sure the family feels comforted, not betrayed.
