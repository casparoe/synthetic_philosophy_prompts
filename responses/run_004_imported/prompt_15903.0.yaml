      *   **Constraints:**
          *   Cannot be an "argument wearing a black tie" (too intellectual/cold).
          *   Cannot dismiss the fraud as meaningless (insults the detective and the book's logic).
          *   Cannot be a public confession (inappropriate for a eulogy, risky for the family).
          *   Must address: What was *lost* to him every time a drawing left his hands credited to someone else?
          *   Core Theme: He was a serious artist never permitted to sign his own name.
          *   Tone: Grief and pride coexisting, not canceling each other out. Spoken voice, not written essay.
          *   Length: 4-5 minutes read aloud (approx. 600-800 words).

  2.  **Deconstruct the Core Conflict:**
      *   *The Granddaughter's Truth:* He was an artist.
      *   *The Detective's Truth:* He was a criminal/deceiver.
      *   *The Family's Truth:* He was a beloved grandfather.
      *   *The Associate's Truth:* He was a master craftsman.
      *   *The "Loss":* It's not about the money or the fame. It's about the *silence*. It's about the separation of the hand from the name. It's about the intimacy of creation being severed from the public acknowledgment.

  3.  **Determine the Voice:**
      *   Needs to sound spoken. Pauses, repetitions, slight imperfections in syntax.
      *   Needs to be coded. She can't say "He was a forger." She has to say things that mean "He was a forger" to the detective and associate, but "He was a humble artist" to the family.
      *   Emotional register: Warm, steady, a bit tired, but firm. Not angry, but resolute.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room. The awkwardness. The silence of the man himself.
      *   **The Work (Coded):** Talk about his hands, his discipline, the hours. Avoid the word "fake" or "forgery." Use words like "channeling," "listening," "becoming."
      *   **The Conflict (The Loss):** Address the namelessness. This is the keystone. Why did it hurt? Because a parent wants to claim their child; an artist wants to claim their work. He gave them away.
      *   **Addressing the Detective (Subtly):** Acknowledge the scrutiny. The idea of "truth." Reframe truth not as provenance, but as the moment of creation.
      *   **Addressing the Associate:** Acknowledge the collaboration without naming it. The materials, the aging.
      *   **The Conclusion:** Bringing it back to love. He did it for the act, not the acclaim. But the cost was high.

  5.  **Refining the "Loss":**
      *   The prompt asks: *What was actually lost to him?*
      *   Idea: The loss of the *witness*. When you make something beautiful, you want someone to see *you* in it. He made sure no one could see him. He erased himself. That is a kind of death before death.
      *   Metaphor: Signing a letter. Speaking a language. A song without a singer.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Thanks for coming. He was quiet. He worked hard. Some of you know what he did. Some don't. He made beautiful things. But he couldn't sign them. That was sad. He let others take the credit. The detective knows this. The friend helped him. But to me, he was just Grandfather. He loved art more than fame. That's what we remember.

      *Critique 1:* Too simple. Too much like a confession. Needs more poetry and ambiguity. Needs to hit the "what was lost" harder.

  7.  **Drafting - Iteration 2 (Focusing on Voice and Subtext):**
      *   Start with his hands. They shook at the end, but not when he worked.
      *   Talk about the "other names." He lived in other men's shadows.
      *   The detective is here. He knows the truth. But the truth isn't just legality. It's about skill.
      *   The loss: He never heard his own name spoken with the awe he deserved.
      *   Ending: He is here now, in this room, finally under his own name.

  8.  **Drafting - Iteration 3 (Polishing for the Prompt's Specifics):**
      *   *Constraint Check:* Is it 4-5 minutes? (Need to expand on the emotional weight).
      *   *Constraint Check:* Does it avoid being an argument? (Yes, keep it personal).
