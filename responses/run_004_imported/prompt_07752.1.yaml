answer: |-
  It is a pleasure to engage with someone who knows the literature on kin selection and cooperative breeding as intimately as you do. Your intuition is shared by many who approach ethics from a naturalistic standpoint: if behavior $X$ can be modeled as a fitness-maximizing strategy (even if the payoff is indirect, delayed, or inclusive), doesn't that drain the moral category of "self-sacrifice" of its content?

  However, from the perspective of moral philosophy, the evolutionary explanation does not render supererogation redundant. Rather, it suggests that the two frameworks are answering fundamentally different questions. The conflict you perceive arises from what is often called a **category error**, specifically conflating *ultimate causation* with *proximate motivation*, and *descriptive origins* with *normative status*.

  Here are four specific reasons why the evolutionary story, while robust, does not dissolve the philosophical concept of supererogation.

  ### 1. Tinbergen's Levels: Ultimate vs. Proximate
  As a behavioral ecologist, you are intimately familiar with Tinbergen's four questions. Evolutionary biology primarily addresses **ultimate causation** (why did this trait evolve? what is its phylogenetic history? how does it impact fitness?). Moral philosophy, however, is concerned with **proximate causation** (what is the agent's motivation?) and **normative evaluation** (what *ought* the agent to do?).

  When a soldier smothers a grenade, the evolutionary explanation might posit that the *disposition* toward group loyalty was selected for because it enhanced the survival of the unit (and thus the genes of kin within it) in the ancestral environment. But that explains the existence of the *capacity* for sacrifice, not the moral status of the *act*.

  For the act to be supererogatory, the soldier does not need to be free from evolutionary predispositions; he simply needs to be acting from a motivation that exceeds moral obligation. He is not thinking, "I am doing this to maximize my inclusive fitness." He is thinking, "I am saving my friends." The philosophical category of supererogation describes the **logic of the moral situation**, not the **genealogy of the psychology**. Knowing *why* we have a moral sense does not tell us how to *use* that moral sense to distinguish between duty and beyond-duty.

  ### 2. The Ambiguity of "Self-Interest"
  Your argument rests on the idea that if an act pays off in the "currency of genes or reputation," it is not beyond self-interest. This relies on equating **genetic self-interest** with **psychological or moral self-interest**.

  Dawkins himself was careful to note that the "Selfish Gene" is a metaphor. Genes are not psychological agents; they do not have intentions. An organism can be genuinely altruistic (psychologically motivated by concern for others) even if the *gene* propagates itself through that behavior.

  In moral philosophy, "self-interest" refers to the agent's own welfare, rights, or obligations.
  *   **Duty:** What I owe to others (e.g., keeping promises, not harming).
  *   **Supererogation:** What I give to others at a cost to myself that I did not owe (e.g., dying for them).

  Even if the *disposition* to be heroic was selected because it helped our ancestors survive, the *act itself* in the present moment often involves a net loss of fitness for the individual (death, injury, resource depletion). If a modern human donates a kidney to a stranger in a different continent, there is almost certainly no reciprocal altruism or kin selection at play. The evolutionary explanation struggles to account for this without invoking "mismatch" theory (i.e., we are misfiring in a modern context). But if the behavior is a "mismatch" or "maladaptive" in terms of fitness, then the claim that it is "really self-interested" collapses. The biological payoff is absent, yet the moral praise remains.

  ### 3. The Is-Ought Gap (Normativity)
  Evolutionary biology is descriptive; ethics is normative. This is the classic Humean Guillotine. Even if we prove that "saintly" behavior is a stable evolutionary strategy, that does not tell us whether such behavior is **obligatory**.

  Urmson's essay was largely motivated by a critique of Utilitarianism, which tends to demand that we always maximize the good. If maximizing the good is our duty, then there is no room for supererogation; anything less than the best act is morally wrong. Urmson argued that a plausible moral code must allow for a zone of discretion.

  Evolution might explain why we *do* help, but it cannot tell us if we *must* help.
  *   **Biology:** "Organisms with trait $T$ (heroism) had higher inclusive fitness in environment $E$."
  *   **Ethics:** "Agent $A$ is not morally blameworthy for failing to perform act $H$ (heroism), though $A$ is praiseworthy for doing it."

  The biological fact that heroism *can* be a winning strategy does not convert heroism into a moral requirement. If evolution favors a mix of strategies (some hawks, some doves; some heroes, some bystanders), then biology actually supports the idea that heroism is not universalizable. If it were obligatory, selection might have fixed it universally (barring frequency-dependent selection). The very fact that it is variable suggests it is not a strict biological "duty," mirroring the philosophical claim that it is not a moral duty.

  ### 4. The Function of Moral Categories
  Finally, we must ask: What work does the concept of supererogation *do*?

  Moral concepts are tools for social regulation and deliberation. Distinguishing between duty and supererogation is crucial for maintaining a sustainable moral community.
  *   If we classify all good acts as **duties**, we create a moral system that is too demanding (the "demandingness objection"). People will reject the system entirely.
  *   If we classify all good acts as **optional**, we lose the ability to condemn negligence.

  The category of supererogation exists to encourage excellence without mandating it. Whether the *impulse* to be excellent comes from a "selfish gene" trying to propagate itself is irrelevant to the social function of the category. We need to label the grenade-smothering act as "beyond duty" so that we do not expect every soldier to do it, while still honoring those who do. The evolutionary origin of the impulse does not change the social necessity of the distinction.

  ### Conclusion
  You are correct that evolutionary biology has demystified the *origins* of altruistic dispositions. It shows us that "selflessness" is not magic; it is a biological strategy.

  However, it does not make supererogation redundant because:
  1.  **Different Levels:** Biology explains the *capacity*; philosophy evaluates the *act*.
  2.  **Different Definitions:** Genetic "selfishness" is not psychological self-interest.
  3.  **Normativity:** You cannot derive moral obligation (or the lack thereof) from fitness payoffs.
  4.  **Modern Context:** Many supererogatory acts today are biologically maladaptive, severing the link between the act and genetic payoff.

  The evolutionary story explains why we *can* be saints and heroes. The philosophical story explains why we *praise* them without *requiring* everyone to be one. They are complementary narratives, not competing ones. The biologist explains the engine; the philosopher explains the traffic laws. Knowing how the engine works doesn't tell you whether you're allowed to drive off-road.
