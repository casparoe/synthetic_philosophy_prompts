answer: |-
  The debate over verisimilitude (truthlikeness) constitutes one of the most technical and consequential chapters in twentieth-century philosophy of science. Following Karl Popper's admission that his 1963 definition of verisimilitude was logically untenable—a fact demonstrated independently by David Miller and Pavel Tichý in 1974—the "similarity approach" emerged as the standard repair. Developed by Ilkka Niiniluoto, Tichý, and Graham Oddie, this approach defines truthlikeness via distances in a logical space of constituents. However, Miller subsequently launched a second, devastating-appearing objection: these similarity measures are language-variant. A change in the primitive vocabulary can reverse the ordering of theories, rendering verisimilitude arbitrary.

  The standard response to Miller has often been concession: verisimilitude is perhaps an incoherent goal. I argue here that this concession is unprincipled. Miller's language-variance objection is structurally identical to the problem of language-relativity in Carnapian inductive logic and the "New Riddle of Induction" (Grue) faced by Bayesian confirmation theory. Philosophers of science generally tolerate language-dependence in confirmation theory by appealing to pragmatic constraints or natural kinds. To reject similarity-based verisimilitude on grounds of language variance while retaining Bayesian confirmation is to apply a double standard. If the language-relativity of priors does not invalidate Bayesianism, the language-relativity of distance metrics does not invalidate verisimilitude.

  ### 1. Miller's Translation Objection

  To understand the force of the objection, one must grasp the mechanism of the similarity approach. In Tichý's and Niiniluoto's accounts, we define a logical space based on primitive predicates (e.g., *hot*, *rainy*, *windy*). The "truth" is one specific constituent (state description) in this space. A theory is assessed by its distance from the true constituent.

  Miller's objection relies on the fact that logical spaces are not unique. We can define a new set of primitive predicates via boolean combinations of the old ones. For example, if the original primitives are $h$ (hot), $r$ (rainy), and $w$ (windy), Miller constructs new primitives $h^*$, $r^*$, and $w^*$ such that they are logically independent but map differently onto the state descriptions.

  Miller demonstrated that under the standard Hamming distance metric (counting the number of differing primitives), Theory A might be closer to the truth than Theory B in language $L$, but Theory B is closer than Theory A in language $L^*$. Since standard logic provides no formal criterion to prefer $L$ over $L^*$, the judgment of which theory is "closer to the truth" appears to be an artifact of linguistic convention rather than a fact about the world. If verisimilitude is to be an objective guide to scientific progress, Miller argues, it must be translation-invariant.

  ### 2. The Parallel in Inductive Logic

  This problem is not unique to verisimilitude. It is the foundational crisis of Carnapian inductive logic. Rudolf Carnap sought to define a logical probability function, $c(h, e)$, that would determine the degree of confirmation of a hypothesis $h$ given evidence $e$. However, Carnap's $c$-functions depend entirely on the choice of the linguistic framework: the family of predicates and the parameter $\lambda$.

  If we describe a set of emeralds using the predicate "Green," the inductive support for "All emeralds are green" is high. If we describe them using Goodman's predicate "Grue" (green if observed before time $t$, blue otherwise), the inductive support shifts dramatically. The confirmation value is not invariant under predicate transformation.

  Bayesian confirmation theory inherited this problem. The posterior probability $P(H|E)$ is a function of the prior $P(H)$. Assigning priors often relies on the Principle of Indifference, which is notoriously language-dependent (as seen in the Bertrand Paradoxes). If we partition the possibility space differently (i.e., use a different language), we assign different priors, leading to different posterior confirmations.

  ### 3. The Bayesian Resolution: Naturalness and Pragmatism

  How does contemporary philosophy of science handle the language-variance of confirmation? It does not reject Bayesianism. Instead, it accepts that language-variance is a manageable feature of epistemic modeling, solved by constraints external to pure logic.

  1.  **Subjectivism and Coherence:** Subjective Bayesians argue that there is no single "correct" prior. Rationality requires coherence, not uniqueness. Language variance is tolerated because priors reflect the agent's conceptual scheme.
  2.  **Natural Kinds:** Following David Lewis, many realists argue that while logic allows infinite predicate transformations, the world does not. Some predicates carve nature at its joints ("Green", "Mass", "Charge") while others do not ("Grue", Miller's transformed weather predicates). We restrict our inductive and confirmatory practices to "natural" predicates.
  3.  **Convergence:** Even if priors vary due to language, the Bernstein-von Mises theorem suggests that with sufficient evidence, posterior probabilities converge, *provided* the language captures the relevant causal structure.

  In short, the Bayesian accepts that confirmation is relative to a linguistic framework but argues that this is not fatal because we have pragmatic and metaphysical reasons to prefer certain frameworks.

  ### 4. Applying the Bayesian Defense to Verisimilitude

  Miller's objection assumes that verisimilitude must be defined *purely logically*, without recourse to extra-logical facts about the world. But this is a demand not placed on confirmation theory. If we apply the same defenses used for Bayesianism to verisimilitude, Miller's objection loses its sting.

  **The Natural Kind Defense:** Just as "Grue" is rejected in induction because it is not a natural kind, Miller's transformed predicates can be rejected in verisimilitude calculations because they do not correspond to real properties. If *hot*, *rainy*, and *windy* correspond to objective physical magnitudes, and Miller's $h^*$, $r^*$, $w^*$ correspond to gerrymandered boolean disjunctions with no physical unity, then the distance metric defined over the former is objectively privileged. The variance is not a flaw in the concept of truthlikeness, but a flaw in using the wrong vocabulary to measure it.

  **The Epistemic Utility Defense:** Verisimilitude is often invoked not as a metaphysical absolute, but as a goal of inquiry (an epistemic utility). Just as a Bayesian agent maximizes expected utility relative to their partition, a scientist maximizes estimated verisimilitude relative to their best current ontology. That this estimate is language-relative does not make it arbitrary; it makes it context-dependent, just like probability.

  **The Convergence Argument:** Niiniluoto has argued that even if estimates of verisimilitude vary by language, the *truth* remains the same. As science progresses, our languages tend to evolve to better match the causal structure of the world (the "no miracles" argument). Therefore, the language-variance is a temporary problem of immature science, not a permanent logical barrier.

  ### 5. The Charge of Unprincipled Selectivity

  The crux of the argument is consistency. Consider the following dilemma:

  *   **Horn A:** Language-variance is fatal to a formal account of scientific rationality.
  *   **Horn B:** Language-variance is a tolerable feature of formal accounts, solvable by pragmatic/naturalistic constraints.

  If one chooses **Horn A**, one must reject similarity-based verisimilitude. But consistency demands one also reject Bayesian confirmation theory and Carnapian induction, as they suffer from the exact same variance (the Grue problem and the problem of priors). This leads to a sweeping skepticism about formal epistemology that most philosophers of science are unwilling to accept.

  If one chooses **Horn B** (the standard position for Bayesians), one accepts that formal measures depend on a privileged vocabulary grounded in natural kinds or pragmatic success. But if this move saves Bayesian confirmation, it must also save similarity-based verisimilitude. To argue that "priors can be constrained by natural kinds" but "distance metrics cannot" is special pleading. Both measures attempt to quantify a relation between theory and world; both require a vocabulary to do so; and both are vulnerable to gerrymandered predicates.

  Miller's objection effectively proves that *no* semantic measure (whether truthlikeness or confirmation) can be purely syntactic. It forces us to be realists about properties. If we are willing to be realists about properties to save induction (by saying "Green is real, Grue is not"), we must be willing to be realists about properties to save verisimilitude (by saying "Hot is real, Miller's $h^*$ is not").

  ### Conclusion

  David Miller's language-variance objection is a powerful logical result, but its philosophical import has been overstated. It demonstrates that verisimilitude, like probability, is not a purely syntactic relation but depends on the semantic content of the predicates employed. This is not a unique failure of the similarity approach; it is a general feature of formalizing the relation between language and the world.

  To reject verisimilitude on these grounds while maintaining that Bayesian confirmation is a viable account of scientific rationality is unprincipled. Both frameworks rely on the assumption that our descriptive vocabulary latches onto the structure of reality. If we tolerate the language-relativity of priors and projectible predicates in confirmation theory—resolving it through appeals to natural kinds and pragmatic success—we are logically committed to tolerating the language-relativity of distance metrics in verisimilitude. Miller did not kill truthlikeness; he merely showed that truthlikeness, like confirmation, requires a realist metaphysics to function.
