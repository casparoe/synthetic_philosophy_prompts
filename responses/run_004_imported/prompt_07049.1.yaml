prompt: |-
  Okay so this is a bit of a weird ask, but I'm stuck on a scene and don't wanna fake it with vibes. My protagonist's mom, dying, made him promise he'd never tell his little sister that the man who raised her wasn't her real dad. Mom's been gone twelve years, nobody else alive even knows there was ever a secret, and now the sister did one of those ancestry DNA kits for fun and the numbers don't add up - she's spiraling a bit, sure it's a lab error, and keeps asking him if he knows anything. He does. He still feels like keeping his word to Mom matters more than telling her, even though Mom will never know either way, and the whole reason she wanted it buried - protecting her marriage, keeping the peace - doesn't even apply anymore since both parents are gone now. Before I write him working through it, I want the real answer, not the greeting-card one: is he actually right to feel bound by that promise, and why? Geniunely different takes welcome if there are any - I wanna pick whichever one actually fits him.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **The Situation:** Protagonist (Brother) promised dying Mom never to tell Sister that Dad (who raised her) isn't her bio dad. Mom's been dead 12 years. Dad is also dead (implied by "both parents are gone"). Sister just took a DNA test, sees discrepancies, suspects lab error, asks Brother. Brother knows the truth. Brother feels bound by the promise despite the original reasons (protecting marriage/peace) being moot.
      *   **The Ask:** The user wants the *real* answer, not the "greeting-card" one. Is the brother actually right to feel bound by that promise? Why? They want genuinely different takes/philosophical angles to help decide what fits *their* character.
      *   **The Constraint:** "Don't wanna fake it with vibes." They need logical/ethical grounding for the scene.

  2.  **Deconstruct the Ethical Dilemma:**
      *   **The Promise:** A deathbed promise. High emotional weight.
      *   **The Secret:** Parentage/Paternity. Fundamental to identity.
      *   **The Stakeholders:**
          *   Brother (Keeper of the secret).
          *   Sister (Owner of the truth about herself).
          *   Mom (Requester, deceased).
          *   Dad (Social father, deceased).
          *   Bio Dad (Unknown/irrelevant to the immediate conflict?).
      *   **The Context:** 12 years later. Both parents dead. No external threat to the marriage.

  3.  **Brainstorming Perspectives (The "Real Answers"):**

      *   *Perspective 1: The Deontological/Duty View (Yes, keep the promise).*
          *   Why? A promise is a contract of the soul. Death doesn't void it. Integrity is internal, not external. If he breaks it, *he* becomes untrustworthy, even if no one else knows.
          *   Nuance: It's about *his* character, not Mom's reputation.

      *   *Perspective 2: The Autonomy/Truth View (No, break the promise).*
          *   Why? Bodily/Genetic autonomy. She has a right to her medical history, lineage, identity. Mom stole that right from her. The promise was coercive (dying wish guilt).
          *   Nuance: The lie is an active harm continuing after death.

      *   *Perspective 3: The Relational/Protective View (It depends on the Dad).*
          *   Why? If Dad was a monster, the secret protects her from a painful origin. If Dad was great, the secret protects his memory.
          *   Nuance: "Father" is a verb, not a noun. Does the bio truth erase the social bond?

      *   *Perspective 4: The Psychological/Burden View (The promise is about the Brother).*
          *   Why? He's using the promise as a shield. It's easier to keep the secret than deal with the fallout of the truth. The "honor" is a rationalization for cowardice or control.
          *   Nuance: This is the most "real" and gritty take.

      *   *Perspective 5: The "Dead Hands" View (Mom's control).*
          *   Why? Why does a dead woman get to dictate the living's reality? It's necrotic control.
          *   Nuance: Grief vs. Liberation.

  4.  **Developing the Arguments (Drafting the Content):**

      *   *Argument for "Yes, Bound":* Focus on *Integrity as Identity*. It's not about Mom anymore; it's about who *he* is. If he lies to her, he changes the foundation of their sibling relationship. Also, the "Father" aspect—if the man who raised her is the only dad that matters, revealing the bio truth might cheapen that man's sacrifice.
      *   *Argument for "No, Not Bound":* Focus on *Agency*. She is an adult (presumably, or close to it, given 12 years + DNA kit). Mom made the decision for her. That's theft of self. The "lab error" spiral is psychological torture caused by the lie.
      *   *Argument for "It's Control":* This is the dark take. He holds the power. As long as he knows and she doesn't, he has leverage/authority. Keeping the promise makes him the "good son" in a vacuum.
      *   *Argument for "The Nature of Truth":* Truth isn't a switch. Once DNA is involved, the cat is out. Denying it makes him complicit in gaslighting.

  5.  **Refining for the User's Needs:**
      *   The user wants to know if he is *right to feel bound*. This is subjective. I need to validate the feeling without necessarily validating the action.
      *   I need to avoid moralizing. No "You should do X." Instead, "If he believes X, then Y follows."
      *   Structure: Break it down by ethical frameworks/character motivations.
      *   Tone: Honest, gritty, analytical, writer-to-writer.

  6.  **Self-Correction/Review during drafting:**
