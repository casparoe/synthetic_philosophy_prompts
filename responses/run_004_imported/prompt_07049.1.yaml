answer: |-
  This is a fantastic conflict because it pits **integrity (keeping your word)** against **autonomy (her right to her own identity)**. Since you want the real answer and not the greeting-card version, we need to strip away the sentimentality and look at the mechanics of power, grief, and truth.

  Here is the blunt truth: **Objectively, no. Subjectively, yes.**

  He is not morally bound by the promise anymore, but he is *psychologically* bound by it if his identity is wrapped up in being the "good son."

  Here are four distinct lenses you can use to justify his stance in the scene. Pick the one that matches your protagonist's psychology.

  ### 1. The "Integrity is Internal" Lens (He is Right)
  **The Argument:** A promise isn't a contract with the other person; it's a contract with yourself.
  **Why it fits:** If your protagonist defines his worth by his reliability, breaking the promise doesn't hurt Mom (she's dead), it hurts *him*. It makes him a man who breaks deathbed vows.
  **The Nuance:** The original reason for the promise (protecting the marriage) is gone, but the *sanctity of the vow* remains. To him, truth is secondary to honor. If he tells her, he proves to himself that his word is conditional on convenience.
  **The Flaw:** This is selfish. It prioritizes *his* moral self-image over *her* reality. He is choosing to be "honorable" rather than helpful.
  **Scene Beat:** He looks at her spiraling and thinks, *"If I tell her, I save her confusion but I destroy myself. I become the kind of man who lies to the dead."*

  ### 2. The "Fatherhood is a Verb" Lens (He is Right)
  **The Argument:** DNA is biology; raising a child is fatherhood. Revealing the secret insults the man who actually did the work.
  **Why it fits:** If the dad who raised her was a good man who loved her, the bio-truth is technically irrelevant but emotionally nuclear. It risks retroactively poisoning her memories of him.
  **The Nuance:** Mom didn't just hide an affair; she protected the sister's relationship with the only dad she knows. By keeping the secret, the brother is protecting the sister's *past*, not just the parents' *reputation*.
  **The Flaw:** It treats the sister like a child who can't handle complexity. It assumes she loves the dead dad less if she knows he isn't bio-related.
  **Scene Beat:** He thinks, *"Dad changed your diapers. He paid for college. Biology is a spreadsheet; love is what happened. Why force her to choose?"*

  ### 3. The "Gaslighting by Omission" Lens (He is Wrong)
  **The Argument:** The DNA test changed the game. Silence is no longer passive; it is now active deception.
  **Why it fits:** Before the test, keeping the secret was maintaining status quo. Now that she suspects a lab error, telling her "I don't know" is a lie. He is no longer protecting a secret; he is manufacturing doubt in her mind to maintain the status quo.
  **The Nuance:** This is the most modern take. In the age of 23andMe, secrets like this are unsustainable. Clinging to the promise now isn't honor; it's control. He is deciding what reality she is allowed to perceive.
  **The Flaw:** It forces him to admit he values Mom's ghost more than his living sister's sanity.
  **Scene Beat:** She asks, "Do you know anything?" and he says "No." The camera lingers on his face. He isn't protecting her; he's protecting the grave.

  ### 4. The "Necrotic Control" Lens (He is Wrong, and He Knows It)
  **The Argument:** Deathbed promises are emotional coercion. Mom used her dying moments to bind him to a secret that wasn't his to keep.
  **Why it fits:** This is the gritty, psychological take. Mom dumped this burden on him to assuage her own guilt. She made him the warden of her sin. By keeping the promise, he is allowing a dead woman to continue controlling the living family.
  **The Nuance:** He feels bound not because it's "right," but because he's afraid of breaking the spell. If he breaks the promise, the "good mother" image dies, and he has to process her manipulation.
  **The Flaw:** It requires him to realize he's being manipulated. If he's still in the fog of grief/guilt, he won't see this yet.
  **Scene Beat:** He realizes Mom didn't ask him to protect the sister; she asked him to protect *herself* from posthumous judgment.

  ### The Verdict for Your Scene

  If you want the **most dramatic tension**, go with a mix of **#1 and #3**.

  He *feels* bound by #1 (Honor), but the audience (and eventually he) realizes #3 (Gaslighting) is what's actually happening.

  **The Hard Truth:**
  He is **not right** to keep the promise, because the nature of the secret has changed.
  *   **Then:** Telling the truth would have blown up a marriage and a home.
  *   **Now:** Telling the truth resolves a medical/identity crisis.

  However, **he is justified in feeling bound.** A deathbed promise creates a trauma bond. It wires the brain to equate "keeping the secret" with "loving Mom." To break it feels like killing her all over again.

  **How to write the realization:**
  Don't have him realize he *should* tell her immediately. Have him realize that **his silence is no longer neutral.**
  *   *Old Logic:* "If I say nothing, nothing happens."
  *   *New Logic:* "If I say nothing, she thinks she's crazy. I am making her doubt her own blood to honor a ghost."

  That is the moment the promise breaks. Not because Mom doesn't matter, but because the cost of the promise has shifted from *his burden* to *her pain*.
