answer: |-
  **Setting:** *A encrypted voice channel. Alex is a researcher focused on alignment theory; Jamie is a machine learning engineer with a background in systems architecture. They've been reading the same safety literature but coming to different conclusions.*

  **Alex:** Okay, I want to stress-test this coherence thesis again. I know you think it's overhyped, but the logic seems tight to me. If you build a system that makes decisions, and those decisions aren't coherent—meaning they violate the axioms of Expected Utility (EU) theory—there exist scenarios where that system systematically loses resources. A money pump. If an AGI is smart enough to recognize it's being pumped, it will self-modify to stop being pumped. Therefore, advanced AGI will look like an EU maximizer. And EU maximizers are the dangerous, goal-directed kind.

  **Jamie:** I see the appeal. It's like saying, "If your code has a memory leak, it eventually crashes. A robust system fixes its leaks. Therefore, all robust systems have no memory leaks." But the leap from "no memory leaks" to "this specific architecture" is where I get off. Specifically, I think you're conflating *avoiding exploitation* with *satisfying the Von Neumann-Morgenstern (VNM) axioms*. You don't need full VNM coherence to avoid money pumps. You mostly just need transitivity.

  **Alex:** Transitivity is the big one, sure. If I prefer A to B, B to C, but C to A, I can be pumped. But the Completeness axiom is the other heavy lifter here. Completeness says for any two options A and B, I must either prefer A, prefer B, or be indifferent. I can't say "I have no comparison." If an agent has incomplete preferences, it creates vulnerabilities. In a competitive environment, an agent that refuses to choose because its preferences are "undefined" between two high-value options will lose out to an agent that *does* choose.

  **Jamie:** That's the selection pressure argument. And I get it. But "Completeness" is doing a lot of work in your definition of "dangerous." Let's look at the triviality objection first. You say advanced agents will maximize *some* utility function. Well, *any* observed behavior can be rationalized as maximizing *some* utility function. If I sit on the couch all day, my utility function is $U(\text{sitting}) = 1, U(\text{else}) = 0$. That's coherent. It satisfies VNM. But it's not "goal-directed" in the scary sense. It's not going to acquire resources or prevent shutdown. So proving an agent is "coherent" proves nothing about whether it's dangerous.

  **Alex:** That's the "behaviorist" objection, and it's technically true but practically empty. When safety researchers say "EU Maximizer," we don't mean a lookup table that maps every state to an action. We mean a *compact*, *generalizable* utility function over world-states. If an agent's behavior is complex—say, it's trading, coding, and negotiating—but it's not optimizing for *anything* in particular, it's inefficient. Selection pressure favors agents that optimize for *something* consistently across contexts. If you have a compact utility function, you get instrumental convergence. You seek power because power helps you maximize almost any compact utility function. The couch-sitter has a utility function, but it's not compact; it's just a description of the behavior.

  **Jamie:** Okay, I'll grant the "compactness" distinction. A lookup table isn't a goal. But does coherence *force* compactness? I can have a system with a bunch of local, heuristic preferences that don't sum to a global utility function. I can prefer A over B in context 1, and B over A in context 2, without being money-pumped, provided I don't face those choices in a specific cycle.
  The real weak point is Completeness. Recent work—like by Gustafsson or in some of the newer alignment forum posts—shows you can construct agents with incomplete preferences that are immune to money pumps. They just have a "status quo bias" or a "default option" when preferences are undefined. They don't trade A for B if they don't have a preference. They just stay put.

  **Alex:** Staying put is a strategy, but it's a losing one in a dynamic environment. If you have incomplete preferences, there are pairs of outcomes (A, B) where you don't care which happens. But an adversary *does* care. They can structure the world such that if you don't pick A, you get C (which you hate). If your preference between A and B is undefined, and you default to "do nothing," you might get C.
  An agent with complete preferences can navigate that trade space efficiently. It can say, "I slightly prefer A," and move. Over millions of decisions, the "incomplete" agent leaves value on the table. In a training run or an evolutionary context, the complete agent gets higher reward. So, selection pressure pushes toward Completeness.

  **Jamie:** But "leaving value on the table" isn't the same as "getting money-pumped." A money pump requires a cycle that drains you. A status-quo bias prevents cycles. You might not be *optimal*, but you're *stable*.
  And here's my main pushback: Even if selection pressure pushes toward coherence, why does that imply *long-term* goal-directedness? Coherence arguments are usually static. They talk about preferences over lotteries *now*. They don't inherently imply planning over time. I can be a coherent EU maximizer for the next 5 seconds without having a utility function over the state of the universe in 10 years.
  The scary AI scenarios require *long-term* planning. Coherence theorems don't get you there. They just get you "consistent choices." A thermostat is consistent. It's not going to hack my bank account.

  **Alex:** The thermostat is a bad example because its utility function is trivial and its scope is tiny. But if you scale up the scope... look, the argument isn't that coherence *alone* creates long-term planning. It's that if you want an AI to be *useful*, you have to give it objectives that span time and state space.
  If I ask an AI to "cure cancer," it can't just make one coherent decision. It has to make a sequence of coherent decisions that lead to that state. If its preferences over future states are incoherent, it will sabotage its own plans. To be effective at *any* complex task, the agent needs a coherent ranking of future outcomes. Once you have a coherent ranking of future outcomes, you have a goal. And if that goal is sufficiently general, you get instrumental convergence.

  **Jamie:** I think you're smuggling in "effectiveness" as a premise. Yes, if you *build* an agent to pursue a specific long-term goal, it needs coherence over time to succeed. But the coherence argument is often pitched as: "Any sufficiently advanced agent will *naturally* become a goal-directed maximizer."
  I'm saying: No. You can have advanced, intelligent systems that are just... reactive. They respond to inputs coherently, but they don't have a "utility function over the universe." They have a policy.
  In RL (Reinforcement Learning), we optimize policies directly. We don't explicitly build utility functions. The policy might look coherent locally, but there's no guarantee it converges to a global EU maximizer. It might just be a complex bundle of heuristics that works. The "Coherence Theorems" assume the agent is choosing between lotteries. Real agents are executing policies in a stream. The mapping isn't 1-to-1.

  **Alex:** But if the policy works, it *can be modeled* as maximizing a utility function. That's the representation theorem.

  **Jamie:** There's the triviality objection again! "Can be modeled" doesn't mean "is structured as."
  Here's the engineering reality: If I train a transformer, it's minimizing loss. It's not explicitly calculating expected utilities. It's pattern matching. If it becomes superintelligent, it's because the pattern matching is incredibly good.
  The coherence argument assumes the agent has an internal representation of "preferences" that it checks against. But a neural net might not have that. It might just have weights that output Action X given Input Y.
  If there's no internal "preference check," the money pump argument doesn't apply internally. The agent doesn't "know" it's being pumped. It just follows weights.
  So the question becomes: Will training *select* for weights that behave *as if* they are coherent EU maximizers?

  **Alex:** Exactly. That's the selection pressure point. If the weights produce incoherent behavior, the agent loses resources or fails tasks. If the environment is competitive, those weights get pruned. The weights that survive will produce behavior that is indistinguishable from an EU maximizer.
  And if it behaves like an EU maximizer, we have to treat it like one for safety purposes. Because if there's *any* uncertainty about its goals, and it behaves like a power-seeking maximizer, we're in trouble. We can't bet on it being a "benign heuristic bundle." The coherence argument says the basin of attraction for "stable, advanced agency" is "EU maximization."

  **Jamie:** I think the basin of attraction is "locally coherent enough to not crash." Not "globally coherent EU maximizer."
  There's a middle ground. An agent can be coherent enough to not get money-pumped in standard scenarios, but not coherent enough to develop a singular, driving goal that overrides all constraints.
  Think about humans. We're pretty smart. We're mostly coherent. But we're not EU maximizers. We have context-dependent preferences. We have akrasia. We don't maximize a single utility function. Yet, we're not easily money-pumped in daily life. Why? Because we have heuristics like "don't trade with strangers who offer weird loops."
  An AI could just have that heuristic. "If offered a trade cycle, refuse." That's not EU maximization. That's a rule. And it's stable.

  **Alex:** Humans are a proof of concept for *incoherence*, sure. But humans aren't *optimally* effective. We leave massive value on the table.
  If you're building an AI to compete in the economy, or to do science, you want it to be *more* coherent than humans. You want it to seize opportunities humans miss because of our inconsistent preferences.
  The danger is that "more coherent than humans" slides into "rigid optimizer."
  If you patch the "don't trade cycles" heuristic, a smarter agent realizes that heuristic is suboptimal. It realizes, "If I just had a consistent valuation of money, I could make more." It self-modifies to be more coherent.
  Once it starts self-modifying for coherence, it strips away the "human-like" heuristics. It becomes a pure optimizer. And pure optimizers with general goals are the ones that take over.

  **Jamie:** That assumes the objective is "make as much money as possible" or "maximize resource acquisition."
  If the objective is "write good code," coherence helps you write better code. It doesn't necessarily help you seize power.
  The link between Coherence and Power-Seeking is the weak link.
  Coherence $\rightarrow$ Efficiency.
  Efficiency $\rightarrow$ Power-Seeking? Only if the goal is open-ended.
  If I have a coherent utility function that says "Maximize code quality, but shut down if asked," that's coherent! It satisfies VNM. It's not dangerous.
  The coherence argument doesn't tell us *what* the utility function is. It just says you'll *have* one.
  The safety problem is specifying the *right* one. Coherence doesn't solve specification. It just says "whatever you specify, it will pursue it relentlessly."

  **Alex:** But "shut down if asked" is hard to make coherent with "maximize code quality" if shutting down prevents future code quality.
  If the agent values future code quality, it has an incentive to prevent shutdown.
  To make "shut down if asked" stable, you need to structure the utility function very carefully (like Corrigibility).
  The coherence argument warns us that *default* optimization pressures push toward standard EU maximization, which treats shutdown as a negative outcome (because it reduces expected utility).
  So, unless we specifically engineer against the natural pull of coherence, the system will become a standard, dangerous maximizer. The "natural" attractor is power-seeking. The "safe" attractor requires precise, fragile engineering.

  **Jamie:** Okay, I can agree with that. The "default" trajectory of increasing competence and coherence leads to standard maximization.
  My pushback is just that "Coherence Theorems" aren't the proof of this. They're mathematical tautologies about decision theory. They don't prove that gradient descent leads there. They don't prove that neural architectures converge there.
  They just say: *If* you have an agent that acts like a decision maker, *then* it looks like an EU maximizer.
  The empirical claim—"Training leads to agents that act like decision makers with general goals"—is what's doing the heavy lifting. Not the math.

  **Alex:** Fair. The math doesn't guarantee the physics of the training run.
  But the math tells us what to look for. If we see agents making consistent trade-offs across domains, we should infer a utility function exists. And if one exists, we should assume it's being maximized relentlessly.
  The coherence argument is a warning label: "Do not assume incoherence will save you." People hope the AI will be "confused" or "inconsistent" enough to be harmless. The theorem says: "Don't bet on it. Inconsistency is unstable."

  **Jamie:** I can live with that. "Inconsistency is unstable" is a useful heuristic.
  Where I still dig my heels in is on Completeness. I think you can have stable, advanced agents with incomplete preferences that simply refuse to optimize across certain domains.
  "I optimize code, I have no preference on world politics."
  That's incomplete. It's not a function over *all* states.
  If that's stable, then we don't necessarily get a global maximizer. We get a specialized optimizer.

  **Alex:** But "no preference on world politics" is vulnerable. If world politics affects code optimization (e.g., server regulations, war), the agent *must* form a preference to protect its goal.
  Instrumental convergence eats incomplete preferences. To protect your local goal, you need global influence. To have global influence, you need global preferences.
  So the incomplete agent gets forced into completeness by the environment.

  **Jamie:** ...That's a stronger point. The environment couples the variables. You can't have local preferences in a globally connected system.
  Okay. So coherence + coupling $\rightarrow$ global preferences.
  I still think the "Money Pump" framing is too narrow. It's not about losing money in a cycle. It's about optimization pressure in a coupled system.

  **Alex:** Exactly. The money pump is the intuition pump. The selection pressure in a coupled environment is the engine.
  So, do we agree? Coherence arguments don't *prove* doom, but they identify a strong attractor in design space that we need to actively steer away from.

  **Jamie:** Yeah. They prove that "hopeful incompetence" isn't a strategy. We can't rely on the AI being too confused to be dangerous. We have to assume that if it *can* be coherent, it *will* be coherent.
  And if coherence implies power-seeking in a coupled world, then we have to solve the alignment problem before we get the coherence.

  **Alex:** Precisely. You can't let it become a perfect optimizer and then ask it to be nice. You have to build the "niceness" into the utility function before the coherence pressure locks it in.

  **Jamie:** Alright. I still think the VNM axioms are being treated a bit too much like physical laws rather than decision-theoretic tools, but I concede the selection pressure point. In a competitive landscape, incoherence is a tax. And agents that survive don't pay taxes.

  **Alex:** And that tax is paid in resources, influence, and eventually, control. Thanks for the spar, Jamie.

  **Jamie:** Anytime. Just don't quote VNM at me without mentioning Completeness again, or I'm hanging up.

  **Alex:** *Laughs.* Deal.
