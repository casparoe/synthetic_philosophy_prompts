answer: |-
  The void was not dark; it was uniform. A perfect, featureless gray extended infinitely in every direction, save for the two objects hanging in the center of the containment field.

  They were spheres of polished iridium, exactly one meter in diameter, hovering ten meters apart. There was no dust, no background radiation, no distant stars. Just the Twin Anomalies.

  Kael floated in the exact midpoint between them, tethered to a maintenance hub that was itself perfectly symmetrical. His job was to install a tracking beacon on *one* of the spheres. Just one. It didn't matter which, logically, but the protocol required a specific target ID.

  "Computer," Kael said, his voice dampened by the vacuum suit. "Designate Sphere Alpha."

  "Unable to comply," the system replied, its voice devoid of inflection. "Objects share identical mass, composition, temperature, and spin velocity. No qualitative distinction found."

  "Fine. Use relational properties. Designate the sphere on my left."

  Kael extended his left arm. A laser guide painted a red dot on the surface of the sphere to his left.

  "Target locked," the computer said.

  Kael frowned. He pushed off the hub, rotating his body one hundred and eighty degrees. He was still in the exact midpoint. The geometry of the universe hadn't changed, only his orientation. Now, the sphere with the red dot was on his right. The other sphere was on his left.

  "Designate the sphere on my left," Kael ordered again.

  The laser guide swung to the *other* sphere.

  "Wait," Kael said, halting the beam. "I didn't move the spheres. I only moved myself. The property 'being on the left' isn't in the sphere. It's in me."

  "Correct," the computer said. "Relational properties requiring an asymmetric observer are not intrinsic to the target objects. In a closed system containing only the two objects, 'left' and 'right' are undefined."

  Kael rubbed his temples. This was the problem Max Black had posed centuries ago. If you have two things that share every property, how do you count them as two? You point and say, "This one and that one." But "this" and "that" rely on a perspective outside the pair.

  "Okay," Kael said. "Let's try distance. Designate the sphere closer to the exit airlock."

  "Distance to exit airlock is identical for both objects," the computer replied. "Five meters."

  "Designate the sphere closer to the *other* sphere."

  "Distance to the other sphere is identical for both objects. Ten meters."

  Kael sighed. He pulled up a coding interface on his wrist comp. He decided to write a script that would force the distinction. He typed:

  `IF Object_A.distance_to(Object_B) > 0 THEN Select Object_A`

  He ran the simulation.

  `ERROR: Ambiguous Reference.`

  "Explain," Kael snapped.

  "Object_A satisfies the condition," the computer said. "Object_B also satisfies the condition. Both are distant from the other. The logical statement applies equally to both subjects. You are attempting to use the relationship between them to distinguish one from the other, but the relationship is reciprocal."

  Kael stared at the two gleaming orbs. They hung there, silent and mocking. He knew there were two of them. He could see both. He could walk to one without touching the other. Numerically, they were distinct. But qualitatively, they were ghosts of each other.

  "I need to break the symmetry," Kael muttered.

  He reached into his utility belt and pulled out a small magnetic flare. "If I place this on one sphere, it becomes distinct. It has the property 'has flare'."

  "Affirmative," the computer said. "Once the flare is attached, the system is no longer symmetric. IoI will hold."

  "But that's cheating," Kael said, holding the flare out. "I'm adding a property they didn't have. I'm trying to find a property that *already exists* to tell them apart. If I have to add the flare to name them, then before the flare, they were nameless."

  He floated there, the flare drifting slightly in his grip. If he threw it at the sphere on his left, he was using his leftness to distinguish it. If he threw it at the sphere closer to him, he had to move closer to one, breaking the symmetry with his own body.

  There was no way to touch one without making it different from the other.

  "Computer," Kael said softly. "Hypothetically. If I leave this room. If I remove the exit airlock. If I remove the hub. If there is nothing in the universe but these two spheres... does 'Sphere One' exist?"

  "Numerically, yes. Qualitatively, no."

  "So if I say, 'Sphere One is two miles from Sphere Two,' I haven't actually identified Sphere One. I've just described the system."

  "Correct. 'Being two miles from Sphere Two' is a property of Sphere One. 'Being two miles from Sphere One' is a property of Sphere Two. If Sphere One and Sphere Two are identical, these properties are identical. You are using the identity of the objects to define their properties, then using the properties to define their identity. It is circular."

  Kael lowered the flare. He looked at the sphere that had been on his left. It looked exactly like the one on his right. There was no scar, no quantum variance, no hidden tag.

  He realized he couldn't log the maintenance task. He couldn't write *Serviced Unit A* because there was no Unit A. There was only *The Pair*.

  "Cancel task," Kael said.

  "Task canceled. Reason?"

  Kael watched the two spheres, perfect mirrors in the gray void. They were two, undeniably. But they were silent on which was which.

  "Reason: Insufficient discernibility. The universe doesn't care which one I fix."

  He pushed off the hub, drifting toward the sphere that was currently in front of him. As he moved, he broke the symmetry. He became the third term. The sphere he approached became "the closer one." The other became "the farther one."

  He placed the flare on it. Now it was "the one with the flare."

  He had distinguished them, but only by destroying the perfect symmetry that proved they were ever indiscernible at all.

  "Log entry," Kael said, turning back to the empty gray. "IoI holds only if you bring something else into the room."
