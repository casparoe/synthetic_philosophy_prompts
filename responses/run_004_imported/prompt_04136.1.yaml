          *   *Weighing:* Humphrey is a phenomenological/semantic hit. Intrinsics is a logical hit. Logical hits can be patched (indexing). Semantic hits (changing the subject) are harder to patch.
      *   *Section 2: The Vagueness/Multiplicity Problem.*
          *   This is Lewis's Achilles heel. Identity is all-or-nothing. Similarity is a matter of degree.
          *   If "Humphrey might have won" is indeterminate because counterparts disagree, CT fails to capture modal logic's bivalence.
