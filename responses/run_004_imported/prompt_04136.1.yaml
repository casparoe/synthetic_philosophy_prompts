          *   *Core:* Modality is *de re*. When I say "Humphrey might have won," I care about *Humphrey*, not some counterpart.
          *   *Lewis's Reply:* "Might have won" means "has a counterpart who won." The concern is misplaced; we care about counterparts because they represent what *we* could have been.
          *   *Weakness:* It feels like a change of subject. It severs the existential link between the actual individual and the modal property.

      *   **Lewis's Accidental Intrinsics Objection (Against Transworld Identity - TWI):**
          *   *Core:* If $x$ exists in $w_1$ and $w_2$, and is $F$ in $w_1$ but not $F$ in $w_2$ (where $F$ is intrinsic like shape), then $x$ is both $F$ and not-$F$. Contradiction.
          *   *TWI Reply (Kripke/Plantinga):* Relativize properties. $x$ is $F$-in-$w_1$ and not-$F$-in-$w_2$. No contradiction.
          *   *Lewis's Counter:* Intrinsic properties shouldn't be relations to worlds. That makes them extrinsic.
          *   *Weakness:* Is "having a shape" really intrinsic if it depends on a world index? Plantinga argues haecceities solve this without overlap.

      *   **Lewis's Companion Difficulty (Vagueness/Multiplicity):**
          *   *Core:* Counterpart relation is based on similarity. Similarity is vague and context-dependent. One actual object can have multiple counterparts with different properties.
