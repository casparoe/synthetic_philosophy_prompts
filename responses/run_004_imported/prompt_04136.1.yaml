answer: |-
  This is an excellent prompt for a capstone session because it forces the seminar to confront the *costs* of metaphysical commitment rather than the *features* of metaphysical description. The standard textbook treatment often treats Lewis and Kripke as offering two different languages for the same modal facts. Your student is right to suspect this is complacent. The dispute is not merely terminological; it is a disagreement about the truthmakers of modal claims and the logical coherence of property instantiation.

  To provide the considered answer you need, I will argue that while Lewis's Accidental Intrinsics objection is logically sharper, the Transworld Identity (TWI) theorist (specifically in the Plantinga-style Actualist guise) pays the lower philosophical price. The dispute is substantive, turning on the tension between qualitative grounding and *de re* persistence, and the TWI framework ultimately preserves the logical integrity of modal discourse better than Counterpart Theory (CT).

  ### 1. The Humphrey Objection vs. Accidental Intrinsics

  Let us first weigh the two "killer arguments" you identified.

  **Kripke's Humphrey Objection** targets the semantic and phenomenological adequacy of CT. When we assert "Humphrey might have won," we intend to predicate a possibility of *Humphrey*. Lewis replies that we are predicating a property of Humphrey (having a winner-counterpart), but Kripke insists this is a change of subject. Humphrey does not care about a distinct individual in another concrete universe, no matter how similar.
  *   **The Cost for Lewis:** This objection suggests CT fails to capture the *de re* nature of modal thought. It renders modal claims *de dicto* about counterparts rather than *de re* about the subject. Lewis's defense—that counterparts represent us sufficiently to ground our concern—is pragmatic, not metaphysical. It concedes that strict *de re* modality is lost but argues we shouldn't want it. This is a high price: it severs the existential link between the actual agent and their modal potentialities.

  **Lewis's Accidental Intrinsics Objection** targets the logical coherence of TWI. If object $x$ exists in $w_1$ and $w_2$, and is bent in $w_1$ but straight in $w_2$, and "bent" is an intrinsic property, then $x$ is both bent and not-bent.
  *   **The Cost for TWI:** To avoid contradiction, the TWI theorist must relativize properties. $x$ is *bent-at-$w_1$* and *straight-at-$w_2$*. Lewis argues this turns intrinsic properties into relations to worlds, thereby destroying their intrinsicality.
  *   **The Rebuttal:** This is where the TWI theorist (following Plantinga) can absorb the blow more effectively than Lewis can absorb Humphrey. Plantinga argues that properties are not monadic simpliciter but are always exemplified relative to a world-state. This does not make shape a *relation* in the sense that "being a brother" is a relation; it makes the *exemplification* of the property world-relative. This is not ad hoc; it is required by the very definition of a "possible world" as a maximal state of affairs. If worlds are maximal, property exemplification must be indexed to them. The TWI theorist preserves the intuition that *Humphrey* is the subject of the modal claim by accepting that Humphrey's properties are indexed.

  **Weighing the Cost:** The Accidental Intrinsics objection forces TWI to refine its theory of properties (indexing), which is a technical adjustment. The Humphrey objection forces CT to refine its theory of *reference*, which is a semantic overhaul. It is less costly to accept world-indexed properties than to accept that when I worry about my own death, I am actually worrying about the death of a distinct counterpart. The former preserves the logic of the subject; the latter changes the subject.

  ### 2. The Vagueness and Multiplicity Problem

  This is the decisive factor that tips the scale against Lewis. You rightly note that Lewis was forced to abandon the postulate that nothing is a counterpart to its worldmates. The deeper issue is that the counterpart relation is based on similarity, and similarity is vague, context-dependent, and gradable.

  In TWI, identity is an all-or-nothing affair. Either Humphrey exists in world $w$ or he does not. Consequently, the proposition "Humphrey wins in $w$" has a determinate truth value.

  In CT, because similarity admits of degrees, Humphrey may have multiple counterparts in a single world $w$. Suppose Humphrey has two equally good counterparts in $w$: $C_1$ wins the election, and $C_2$ loses.
  *   **The Truth-Value Gap:** Is it true that "Humphrey might have won"? If truth requires *some* counterpart to win, it is true. But if the context shifts to emphasize the counterpart who lost, it might be false. Lewis accepted this context-dependence, but for a graduate seminar on the *metaphysics* of modality, this is devastating. It implies that modal facts are not fixed by the structure of reality but by our conversational context.
  *   **Logical Consequences:** Standard modal logic (S5) assumes bivalence. If CT renders many modal claims indeterminate (because the counterpart relation is indeterminate), CT cannot serve as the semantic foundation for standard modal logic without significant revision.

  The TWI theorist faces no such problem. Whether Humphrey wins in $w$ is a fixed fact about the world-state. The price TWI pays here is zero; the price CT pays is the loss of determinate truth conditions for modal claims.

  ### 3. Substantive Dispute or Terminological Variance?

  Is it possible that a careful TWI theorist (like Plantinga) holds a position extensionally indistinguishable from CT?

  **The Verdict:** The dispute is **substantive**, not merely terminological.

  While both theories aim to validate the same modal sentences (e.g., $\Diamond F a$), they disagree on the **truthmakers**.
  1.  **Qualitative vs. Haecceitistic Grounding:** CT grounds modality in *qualitative similarity*. There must be some qualitative resemblance between Humphrey and his counterpart for the modal claim to be true. TWI (specifically Plantinga's Actualism) grounds modality in *haecceities* (primitive thisness). Humphrey can exist in a world where he is qualitatively identical to someone else, or even qualitatively indiscernible from nothing, provided his essence is exemplified.
  2.  **Symmetric Worlds:** Consider a world containing two indiscernible spheres. For the TWI theorist, Humphrey could be *this* sphere or *that* sphere (distinct possibilities based on haecceity). For the Lewisian counterpart theorist, there is no fact of the matter as to which sphere is the counterpart, as similarity cannot distinguish them. This leads to different truth conditions for claims like "Humphrey could have been the left sphere."
  3.  **Extensional Divergence:** Because CT relies on similarity, there are cases where TWI affirms a possibility that CT denies (e.g., radical qualitative change where no counterpart relation holds, but the haecceity persists) and vice versa (e.g., a perfect duplicate exists, securing a counterpart relation where the TWI theorist denies transworld identity).

  Therefore, the theories are not notational variants. They represent a deep divide between a **qualitative metaphysics** (Lewis) and a **haecceitistic metaphysics** (Plantinga/Kripke).

  ### 4. Final Judgment: Who Pays the Higher Price?

  In my judgment, **David Lewis's Counterpart Theory pays the higher philosophical price.**

  Here is the defense of that verdict:

  1.  **Preservation of *De Re* Modality:** The primary intuition driving the metaphysics of modality is that possibilities are possibilities *for things*. TWI preserves this intuition directly. CT preserves it only by redefining "for things" to mean "for things' representatives." In a capstone seminar, we should prioritize the theory that respects the primary data of modal experience. The Humphrey objection is not just a complaint; it is a report on the phenomenology of modal thought that CT fails to accommodate.
  2.  **Logical Determinacy:** A metaphysical theory of modality should underwrite a logic of modality. TWI supports classical bivalence and S5 naturally. CT introduces vagueness into the truth conditions of modal claims due to the elasticity of the counterpart relation. Accepting truth-value gaps for fundamental metaphysical claims is a higher cost than accepting world-indexed properties.
  3.  **Ontological Parsimony (The Twist):** Lewis is often praised for parsimony because he avoids haecceities. However, this is a false economy. Lewis pays for this with **Concrete Modal Realism** (an infinity of concrete universes), which is ontologically extravagant. If we compare CT *as a logical mechanism* against TWI *as a logical mechanism* (bracketing the concrete vs. abstract worlds debate), CT still loses on the vagueness front. But if we include Lewis's concrete realism, the cost is astronomical. Even if we restrict Lewis to "Ersatz" counterpart theory, the vagueness of the counterpart relation remains a structural flaw that TWI avoids via the precision of identity.

  **Conclusion for the Seminar:**
  You should advise your students that while Lewis's Accidental Intrinsics argument is a powerful logical probe, it is met successfully by the Plantinga-style move to world-indexed properties. In contrast, the Humphrey objection and the Problem of Vagueness strike at the heart of CT's ability to function as a semantics for modal discourse.

  The dispute is substantive: it is a choice between grounding modality in **primitive identity (haecceities)** or **qualitative similarity**. The former is metaphysically obscure but logically robust; the latter is metaphysically naturalistic but logically indeterminate and semantically deficient regarding *de re* concern. The robust logic and preservation of *de re* reference make Transworld Identity (in its Actualist, non-overlapping form) the superior framework, despite the "spookiness" of haecceities. The price of haecceities is lower than the price of losing Humphrey.
