      *   *The "Two Audiences" Defense:* The *Guide* is esoteric (for philosophers), the *Mishneh Torah* is exoteric (for the masses). Maimonides hides his true view (that sacrifice will *not* actually return) in the *Guide*, while writing standard halakha in the *Mishneh Torah*.
      *   *Selection:* The "Two Audiences/Esoteric" defense is the most common scholarly attempt to resolve this. However, a stronger harmonization is the "Instrumental vs. Intrinsic" distinction: The *Guide* explains the *origin*, but not necessarily the *eternal function*. Or, the "Messianic Regression" argument: The Messianic age is political/national restoration, not necessarily ontological perfection of human nature (that's the World to Come).
      *   *Best Harmonization to Engage:* The distinction between the *Messianic Age* (Olam HaZeh continued) and the *World to Come* (Olam HaBa). In the Messianic age, human nature hasn't fundamentally changed, so the "concession" is still legally binding even if philosophically secondary.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** State the thesis clearly. There is a deep fissure, not a surface crack. It challenges the coherence of the concession theory.
      *   **Exposition of the Texts:** Briefly summarize *Guide* III:32 (gradualism, divine plan, no intrinsic value) and *Hilchot Melachim* (restoration of sacrifices).
      *   **The Harmonizing Reply (The Steel Man):** Present the best argument *against* inconsistency.
          *   *Argument:* The distinction between the Messianic Age and the World to Come. Maimonides rationalizes the *origin* but upholds the *law*. The Messianic age is political restoration, not a change in human psychology. Therefore, the "weaning" isn't complete because human nature remains the same. The *Guide* explains *why* it was given; the *Mishneh Torah* explains *what* the law remains.
      *   **Dismantling the Harmonization (The Core Task):**
          *   *Point 1: The Teleology of the Law.* If the purpose of the Law is human perfection (intellectual/moral), and sacrifice is a hindrance or merely a crutch, a perfected era (Messianic) should discard the crutch. Restoring it implies the crutch is essential, contradicting the *Guide*.
          *   *Point 2: The Nature of the "Divine Ruse".* If God employed a ruse because human nature *couldn't* handle abstraction, does the Messianic age fix human nature? Maimonides says the Messiah doesn't change the order of nature. If human nature is static, the need for the ruse is static. If the need is static, why call it a temporary weaning in the *Guide*?
          *   *Point 3: Intrinsic Value vs. Historical Accident.* If the Messiah restores it, it implies it has *kedushah* (holiness) independent of historical context. The *Guide* denies this. You can't have it both ways: either it's inherently holy (contradicting *Guide*) or it's a historical fossil (contradicting *Mishneh Torah*'s future tense).
