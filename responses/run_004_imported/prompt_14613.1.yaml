      *   *Angle 1: The Nature of Agency.* Agency isn't a series of disconnected snapshots. It's a temporally extended project. If I can't bind my future self to my past reasoning, I'm not an agent; I'm a sequence of agent-stages.
      *   *Angle 2: The Source of Preferences.* Where do the local preferences come from? If they are cyclic, they are structurally defective. Why privilege a defective local preference over a coherent global plan?
      *   *Angle 3: The Definition of Rationality.* Rationality is about achieving ends. If the end is "don't get pumped," and the means is "resolute adherence," then deviating is the irrational act because it guarantees failure of the higher-order goal.
      *   *Angle 4: The "Separability" Assumption.* The standard objection assumes "Dynamic Separability" (what you do now depends only on the current subtree). Resolute choice rejects this. The history of the choice matters.

  4.  **Drafting - Section by Section:**

