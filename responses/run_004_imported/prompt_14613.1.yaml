      *   **Point 2: The Epistemology of Preference (Local vs. Global).** Cyclic preferences are a bug, not a feature. The local preference at the final node is "tainted" by the cycle. The plan represents the *reflective* preference, while the local node represents the *impulsive* preference. Privileging the local one is like privileging the craving over the diet plan.
      *   **Point 3: The Normativity of Plans (Plans as Reasons).** A plan isn't just a prediction; it's a reason-generating structure. By adopting a plan, I create a new reason for action at the later node. So, at the final node, it's *not* true that I prefer A to C *all-things-considered*. I prefer A to C *ceteris paribus*, but the fact that "this is part of my rational plan" adds weight to C. Thus, no preference violation occurs.
      *   **Point 4: The Pragmatic Vindication.** If rationality is about not being a sucker (instrumental rationality), the resolute chooser wins. The synchronic chooser loses money. If the definition of rationality leads to guaranteed loss, the definition is wrong.
