answer: |-
  Here is the case for the resolute chooser, stripped of the usual textbook framing and aimed directly at the metaphysical and normative assumptions driving your seminar's skepticism.

  The intuition that the resolute chooser is irrational at the final node relies on a specific, often unarticulated metaphysical picture of agency: **Temporal Atomism.** This is the view that an agent is merely a sequence of distinct "agent-stages," where rationality is a property that applies strictly to the relationship between an agent-stage and its immediate options.

  To defend resolute choice, you must argue that Temporal Atomism is false. Rationality is not a property of snapshots; it is a property of trajectories. Here is the strongest version of that case, built on three pillars: the constitution of preference, the normativity of history, and the definition of agency.

  ### 1. The "All-Things-Considered" Preference is Diachronic
  The standard objection claims that at the final node, the agent prefers A to C. Therefore, choosing C is choosing against one's preference. This assumes that the preference at the final node can be evaluated in isolation (synchronically).

  But preferences are not atomic sensations like pain or hunger; they are judgments of comparative value. For a temporally extended agent, a judgment of value is inherently comparative across time. When the resolute chooser arrives at the final node, they are not asking, "Do I want A or C right now?" They are asking, "Do I want the trajectory that ends in C (and avoids the pump) or the trajectory that ends in A (and confirms I am a sucker)?"

  If you accept that the *object* of rational choice is the extended trajectory rather than the terminal node, then the resolute chooser **does not** have a preference reversal at the final node. Their "all-things-considered" preference at $t_3$ includes the value of having successfully executed a rational plan. The local preference for A over C is merely a *pro tanto* preference, overridden by the higher-order preference for plan-integrity. To call this irrational is to insist that the only preferences that count are the most immediate, local ones—a view that would also classify saving for retirement, dieting, or studying for an exam as irrational acts of self-denial.

  ### 2. History Matters: Rejecting Dynamic Separability
  The money pump argument relies on an axiom called **Dynamic Separability**. This axiom states that the rational choice at any node depends only on the subtree of future possibilities available at that node; the past is bygones.

  The resolute chooser rejects Dynamic Separability. They argue that **how you got there matters.**

  Consider two agents at the final node holding C.
  *   **Agent X** arrived there by random assignment.
  *   **Agent Y** arrived there by resolving to avoid a money pump.

  The standard view says Agent X and Agent Y face the exact same rational situation. If A > C, both should trade.
  The resolute view says this is absurd. Agent Y is in the middle of a normative project. The fact that C was *chosen as part of a plan* imbues it with a normative status that C does not have for Agent X. To ignore the history of the choice is to treat the agent as a amnesiac at every time step.

  If rationality is about coherence, then coherence must hold across time, not just within a time slice. A choice that is locally optimal but globally catastrophic is not rational; it is myopic. The "fishy" feeling you get about resolute choice comes from the ingrained habit of thinking that the past cannot causally or normatively constrain the present. But in human agency, the past (in the form of commitments, promises, and plans) *always* constrains the present. Resolute choice simply makes this constraint explicit in decision theory.

  ### 3. Agency as Plan-Execution, Not Max-Maxing
  Finally, we need to challenge the definition of rationality itself. The objection assumes rationality is **Maximization of Local Utility.** But a more robust definition of rationality is **Effective Agency.**

  An effective agent is one who can formulate a strategy to achieve their goals and then *execute* it. If an agent formulates a plan at $t_1$ that they know will be abandoned at $t_3$ simply because $t_3$ feels like trading, that agent is not a unified agent; they are a collection of warring impulses.

  The resolute chooser is the only one acting as a **unified sovereign** over their own timeline.
  *   The **Naive** chooser is a slave to the immediate impulse.
  *   The **Sophisticated** chooser (McClennen's middle ground) avoids the pump by refusing to start, but this is a form of capitulation. They admit they cannot trust themselves to finish the job, so they don't start. This is a limitation on agency.
  *   The **Resolute** chooser asserts sovereignty. They say, "My judgment at $t_1$ (when I was calm and reflective) governs my action at $t_3$ (when I am tempted by the cycle)."

  To call this irrational is to privilege the *tempted* self over the *deliberating* self. Why should the preference at the final node (where the agent is effectively being "pumped") be the gold standard of rationality? That preference is the *cause* of the vulnerability. The plan is the *cure*. It is not irrational to follow the cure; it is irrational to let the disease dictate the treatment.

  ### The Knockout Punch
  The strongest argument against the "irrationality" objection is this: **The objection proves too much.**

  If choosing against a local preference in service of a global plan is irrational *per se*, then **no long-term project is rational.**
  *   A soldier staying at their post because of a prior commitment, despite a local preference to flee danger, is irrational.
  *   A spouse staying married because of a vow, despite a local preference to leave during a hard patch, is irrational.
  *   An investor holding a index fund, despite a local preference to day-trade during a volatility spike, is irrational.

  We intuitively recognize these as paradigmatic cases of *rational* behavior (specifically, resoluteness or integrity). The only reason it feels "fishy" in the money pump case is that the preferences are cyclic, which feels artificial. But the structure of the choice is identical to the soldier or the spouse.

  If you declare the resolute chooser irrational in the money pump, you must logically declare the soldier and the spouse irrational as well. If you aren't willing to do that, then your objection isn't about rationality; it's about a discomfort with the idea that **past reasoning can bind future action.**

  The resolute chooser is not irrational. They are simply the only one in the room treating themselves as a single person existing through time, rather than a series of strangers passing a wallet down the line.
