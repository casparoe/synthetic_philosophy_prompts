answer: |-
  The rain blurred the office window, turning the campus lights into smeared streaks of gold. Vikram leaned against the doorframe, holding two mugs of tea. Elena sat at her desk, surrounded by stacks of student papers, a red pen hovering over a paragraph she hadn't read in ten minutes.

  "You're still worried about the witness," Vikram said, setting a mug down. "In the manuscript."

  "I'm worried about the epistemology," Elena corrected, not looking up. "If your protagonist treats his uncle's confession as knowledge just because he heard it, you're making him a fool. It's testimony, Vikram. It's *hearsay*. Unless he can infer the uncle's reliability from independent evidence, he doesn't *know* it. He just believes it."

  "That's the Humean hangover talking," Vikram said, pulling up a chair. "In Nyāya, *śabda*—testimony—is a *pramāṇa*. A basic source of knowledge. Like perception. If a trustworthy person speaks, and I understand the sentence, the knowledge arises immediately. I don't need to construct a syllogism to verify it."

  "But that makes belief too cheap," Elena said, finally meeting his eyes. "If testimony is basic, then I know whatever you tell me the moment I understand the words. That erases the distinction between trust and gullibility. If I tell you the sky is green, and you accept it as a basic knowledge source, you aren't rational. We check sources. We weigh credibility. That weighing *is* the work. It's an inference: 'Vikram is usually reliable; Vikram says X; therefore X is likely true.' Without that middle step, you're just a vessel."

  Vikram took a sip of tea, steam rising between them. "You're confusing the *condition* for knowledge with the *process* of knowing. For *śabda* to work, the speaker must be an *āpta*—competent and honest. But I don't need to *infer* that honesty every time you speak. I recognize it, or I don't. If I have to infer your reliability before I can understand you, communication would never start. I'd need testimony to verify your reliability, and testimony to verify that testimony. It's an infinite regress. Trust isn't a conclusion we reach; it's the ground we stand on to reach conclusions."

  "Okay, but look at the developmental data," Elena countered, leaning forward. "Small children believe everything. They don't distinguish between a reliable speaker and a liar until they're years old. If testimony were a basic source of knowledge, children would be little knowers. But they aren't. They're little believers. They lack the capacity to evaluate the inference. If they can't verify the reliability, they can't have knowledge. Which means the knowledge *must* come from the inference, not the hearing. The hearing is just the data input; the justification is the assessment."

  "And yet, without that default acceptance, the child never learns language," Vikram said softly. "If the child had to verify every word against reality before accepting it, they'd never acquire the vocabulary needed to describe reality. The capacity to learn from speech is innate. It's a cognitive faculty, not a calculation. Just because a child misapplies it—trusting a liar—doesn't mean the faculty is broken. It means the *instrument* was compromised. If I look at a mirage, my eyes aren't inferring water; my eyes are functioning normally in deceptive conditions. The error is in the object, not the perception."

  "But that's the thing," Elena said, tapping her pen against the desk. "When we have two witnesses, the story becomes more solid. When we have one, it's fragile. Why? If knowledge is direct and basic, one reliable witness should be enough. The fact that we feel the need for corroboration proves we're doing probability math in our heads. We're aggregating data points. One data point is noise; two is a signal. That's induction. That's reductionism. You can't explain why a second witness matters if the first one already gave you direct knowledge."

  "A second witness doesn't create knowledge," Vikram insisted. "It removes *doubt*. Nyāya distinguishes between knowing and being certain. The first witness gives me knowledge. But if I have a reason to doubt—maybe the lighting was bad, maybe the stakes are high—that doubt blocks me from acting on the knowledge. The second witness clears the doubt. They don't supply the truth; they supply the confidence. In this family saga of yours, the tragedy isn't that they don't know the truth. It's that they can't stop doubting it."

  "Then why does the knowledge vanish the moment we find a lie?" Elena pressed. "If I find out your uncle lied about his age, suddenly his confession about the murder is worthless. We discount the whole testimony. If it were direct perception, like seeing a color, finding out he lied about something else shouldn't bleach the color from your eyes. The only reason it destroys the knowledge is because the justification was conditional on his character all along. We were inferring truth from character. No character, no inference."

  Vikram set his mug down. The ceramic clicked loudly in the quiet room. "Think of a telescope. If the lens is scratched, you can't see the star. Does that mean you were inferring the star's existence from the glass? No. The glass is the instrument. The speaker is the instrument of testimony. If the instrument is flawed, the knowledge doesn't arise. Finding the lie reveals the scratch. It doesn't prove the vision was an inference; it proves the tool was broken. You want autonomy, Elena. You want the knower to be the sole judge."

  "And you want dependence," she said, her voice dropping. "You want the knower to be part of a chain. If testimony is basic, then we are fundamentally reliant on others. We aren't isolated minds verifying the world; we're nodes in a network. If that's true, then your protagonist can't ever truly know his family's history on his own. He's stuck with what he's told."

  "That's the human condition," Vikram said. "We are born into a story we didn't write. The question isn't whether we can verify it all. It's whether we trust the tellers."

  Elena looked back at her student's paper, the red pen still uncapped. "I just don't think we can afford to trust them. Not without the math."

  "And I don't think we can live without it," Vikram replied. He stood up, leaving the tea on the desk. "But until you decide which one you are, you can't finish the scene."

  He walked out into the rain. Elena sat alone, listening to the sound of his footsteps fade, wondering if she had heard them at all, or if she was just inferring he was gone.
