      *   *Metaphysics vs. Physics:* Leibniz argues from PSR/PII (metaphysical principles). E&N argue from Determinism (a physical virtue of theories). This makes the argument harder for a scientific realist to ignore.
      *   *The Role of General Covariance:* In Newtonian physics, the shift is a symmetry of the *laws*, but the models are distinct. In GR, due to general covariance, the transformed metric is *also* a solution to the field equations given the same stress-energy tensor. This creates the specific indeterminism problem.
      *   *Haecceitism:* The Hole Argument specifically targets the identity of spacetime points (haecceity) across models, whereas Leibniz targeted the position of matter relative to a container.

  5.  **Address the "Leibniz Plus Tensors" Claim:**
