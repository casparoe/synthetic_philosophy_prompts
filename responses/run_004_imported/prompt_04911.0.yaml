answer: |-
  # The Limit of Agreement: Why Aumann's Theorem Is Not a Moral Duty

  In the ecosystem of rationalist discourse, few results are cited with as much reverence and as little precision as Aumann's Agreement Theorem. On blogs like *Overcoming Bias* and *LessWrong*, the theorem is often transmuted from a technical result in game theory into a moral imperative: if you consider someone an epistemic peer, and you share their commitment to truth, you cannot honestly disagree with them. To sustain a disagreement is to imply that either you or they are failing in your rational duties—hiding information, succumbing to bias, or arrogantly privileging your own judgment.

  This "folklore Aumannism" exerts a powerful social pressure. It suggests that persistent disagreement is a bug in the system of human communication, a failure to be debugged through sufficient humility. Yet, anyone who has participated in these communities knows the reality: brilliant, well-intentioned truth-seekers disagree constantly, often after years of exchange. They do not converge. They do not even seem to be moving toward convergence.

  This tension forces a choice between two interpretations. The first, championed by Robin Hanson and Tyler Cowen, treats persistent disagreement as evidence of epistemic vice. It argues that agents are likely operating on "self-favoring priors," unknowingly weighting their own judgment as more reliable than their peer's. The second interpretation treats the theorem as a mathematical limit case that tells us little about actual human discourse, arguing that its idealizations—specifically the Common Prior Assumption and common knowledge of rationality—are so violated in reality that the theorem's normative force evaporates.

  While the moralistic reading offers an inspiring ideal of intellectual humility, it is ultimately a category error that conflates mathematical constraints on omniscient Bayesians with behavioral norms for bounded humans. We must reject the demand for forced convergence. The correct view is the second: Aumann's theorem describes a world we do not inhabit. Persistent disagreement is frequently compatible with correct reasoning, and the obligation to update on a peer's belief is limited strictly to cases of asymmetric information, not asymmetric priors or computational limits.

  ### The Folklore and the Formalism

  To understand why the moralistic reading fails, we must recall what the theorem actually says. Robert Aumann's 1976 result demonstrates that if two agents share a **common prior** probability distribution and have **common knowledge** of each other's posterior probabilities (their current beliefs after seeing private evidence), their posteriors must be identical. They cannot "agree to disagree." Later work by Geanakoplos and Polemarchakis showed that this agreement isn't just static; if agents repeatedly announce their posteriors to one another, they will converge in finite time. The Milgrom-Stokey no-trade theorem extends this to markets: if agents start at a Pareto-optimal allocation, they will never make a speculative bet based purely on private information, because the offer to bet reveals information that kills the bet's profitability.

  The rationalist moral draws a direct line from this math to behavior: If you trust your peer's rationality, you should treat their belief as a summary of their evidence. If your beliefs differ, you are effectively ignoring their evidence. Therefore, to remain rational, you must adjust your credence until you match theirs.

  Hanson and Cowen sharpen this into an accusation of hidden bias. They suggest that while we claim to share priors with our peers, we secretly operate on "self-favoring" ones. We believe *we* are processing the evidence correctly, while the other person is likely influenced by some subtle bias, even if we can't name it. In this view, the persistence of disagreement is proof that at least one party is not being fully honest about their uncertainty or their trust in the other.

  ### The Impossibility of Common Priors

  The fatal flaw in the moralistic interpretation is the Common Prior Assumption (CPA). Aumann's theorem *requires* that agents start with the same probability distribution over the state of the world before receiving any private information. For human beings, this is demonstrably false.

  Priors are not chosen; they are inherited. They are the product of genetics, upbringing, culture, and prior life experiences that shape how we model reality before we even begin a specific conversation. Two rationalists may both be perfect Bayesians, but if one grew up in a environment that reinforced high-trust social models and the other in an environment that reinforced high-threat models, their priors on "Is this stranger trustworthy?" will differ. This is not a failure of rationality; it is a feature of embodied cognition.

  When the moralists demand we treat priors as common, they are asking us to ignore the very data that constitutes our cognitive architecture. If I have a prior that physicalism is true, and my peer has a prior that dualism is plausible, Aumann does not demand we meet in the middle. It demands that if we *had started* with the same prior, we would agree. But we didn't. To pretend we did is to engage in a fiction that obscures the actual source of the disagreement.

  Furthermore, the requirement of **common knowledge of rationality** is even more stringent. It is not enough for me to know you are rational, or for you to know I am rational. I must know that you know that I know, ad infinitum. In reality, I have direct introspective access to my own reasoning process. I know how hard I am trying to be unbiased. I do not have that access to you. I can only infer your rationality from your output. It is therefore Bayesianly correct for me to weight my own reasoning slightly higher than yours, not out of arrogance, but out of data asymmetry. Hanson calls this a "self-favoring prior," implying it is a bias to be corrected. In fact, it is a rational assessment of available evidence. I am the only person in the universe whose internal state I can observe directly. To treat my own rationality as identical to yours is to ignore that observation.

  ### The Danger of Forced Convergence

  Adopting the moralistic view carries significant epistemic risks. If disagreement is treated as a failure state, the pressure to converge can overwhelm the pressure to be accurate. This leads to "epistemic learned helplessness," where agents defer to the consensus of their perceived peer group rather than engaging with the evidence themselves. It privileges social cohesion over truth-tracking.

  Moreover, the Milgrom-Stokey no-trade theorem highlights why disagreement can be valuable. In a world where everyone agrees, there is no incentive to gather new information. Persistent disagreement signals that there is private information or divergent models in the system that have not yet been reconciled. If we force agreement to satisfy a normative ideal, we may prematurely collapse the search space, settling on a compromise that satisfies the social norm of rationality but misses the truth.

  The moralistic view also misunderstands the nature of "updating." Aumann requires us to update on the *posterior* (the belief). But in the real world, we should update on the *evidence* that likely caused the belief. If my peer believes X, I should ask "What did they see that I didn't?" not "How do I make my number match theirs?" Sometimes, knowing their belief gives me no new information about the world, only information about their priors. If I already know their priors differ from mine, their belief confirms their priors, not the truth of the proposition.

  ### A Defense of the Idealization View

  This brings us to the second response: that Aumann's theorem is an idealization that rarely applies to humans. This is not a dismissal of rationality, but a precise application of it. A model is only useful if its assumptions hold. When the assumptions break, the conclusions do not bind.

  Defending this view does not mean "anything goes." It does not grant license to ignore peers. It means we must relocate the normative force of disagreement. We should not update because Aumann says we must converge; we should update because a peer's belief is *evidence*. But the weight of that evidence depends on the source of the divergence.

  This leads to a specific, general rule for when extended disagreement should move your credence:

  **Disagreement should move your credence only when you have reason to believe the divergence stems from asymmetric information regarding a shared model. It is fully compatible with correct reasoning when the divergence stems from asymmetric priors, asymmetric computational resources, or fundamental model uncertainty.**

  If I am a climate scientist and you are a climate scientist, and we share the same physical models of atmospheric chemistry (shared model), but I have seen a new dataset you haven't (asymmetric information), Aumann's spirit applies. I should expect us to agree once I show you the data. If we still disagree after sharing the data, one of us is likely making a computational error or acting in bad faith.

  However, if we are discussing the likelihood of a technological singularity, we likely do not share a model. You might weight historical precedents heavily; I might weight theoretical computer science heavily. These are prior differences. Or, perhaps the problem is simply computationally intractable. We are both bounded agents. You have spent 100 hours thinking about the problem; I have spent 10. Our posteriors differ because our computational investments differ, not because one of us is irrational. In this case, disagreement is expected. To demand agreement is to demand that I pretend to have done the computation I haven't done.

  ### Conclusion: Rationality Without Convergence

  The rationalist community's fascination with Aumann's Agreement Theorem is understandable. It offers a vision of a world where truth is singular and accessible, where conflict is merely a lack of communication. But clinging to this vision as a moral duty distorts the practice of rationality. It turns the theorem into a weapon for shaming dissent rather than a tool for understanding the limits of communication.

  We must accept that rational agents can disagree. They can disagree because they started from different places (priors). They can disagree because they have different limits (computation). They can disagree because they are not certain of each other's sanity (lack of common knowledge). None of this requires us to accuse our peers of dishonesty or self-deception.

  The true lesson of Aumann is not that we must agree, but that agreement is a fragile state that requires conditions humans rarely meet. When we encounter a peer who disagrees with us, we should not rush to converge to satisfy a theorem. We should investigate the source of the divergence. Is it information? Then update. Is it a prior? Then acknowledge the difference and argue about the priors, not the posteriors. Is it complexity? Then accept that uncertainty is the rational position.

  By releasing ourselves from the moral obligation to agree, we free ourselves to be more honest about why we disagree. That honesty is a far better foundation for truth-seeking than the illusion of consensus.
