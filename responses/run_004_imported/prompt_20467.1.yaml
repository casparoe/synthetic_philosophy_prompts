answer: |-
  1. **The Genesis of Normativity**
  Your theory posits that a joint commitment creates obligations *sui generis*—that the act of committing itself generates the normative bond, without needing a pre-existing moral framework or legal institution to underwrite it. But normativity usually requires a source: I am obligated to keep a promise because of the moral principle of fidelity, or to obey a law because of the state's authority. If we strip away the moral principle and the legal authority, what exactly is the *mechanism* that turns a shared psychological state into a genuine "ought"?

  2. **The Standing to Rebuke**
  You argue that joint commitment gives parties the "standing to rebuke" one another for non-compliance. In a legal contract, that standing is enforced by a court; in a friendship, it's enforced by social friction. In your plural-subject account, the standing seems to exist in a vacuum. If I rebuke you based solely on our joint commitment, and you simply say, "I no longer care about that commitment," what leverage does my rebuke actually have, other than my own disappointment?

  3. **The Unflattering Case (Joint Theft)**
  Let's test the neutrality of this account. Suppose two criminals jointly commit to carrying out a theft. They express willingness, they have common knowledge, and they form a plural subject. On your view, do they thereby acquire genuine obligations and entitlements toward one another? If one thief abandons the heist, does the other have the *normative standing* to rebuke him for violating their commitment, even though the commitment itself is to do something immoral?

  4. **Follow-up to Q3 (Obligation vs. Expectation)**
  *I anticipate you will say yes, they do have obligations, but that these are overridden by moral obligations not to steal.* If the "obligation" is so easily overridden by background morality that it cannot actually compel action, why is "obligation" the right word? At that point, aren't you just describing a high-stakes mutual expectation or a prudential reliance? What work is the word "obligation" doing if it doesn't imply a binding force that persists even when the content is bad?

  5. **The Circularity of Expression**
  You define the formation of a joint commitment through the "open expression of willingness" by all parties plus "common knowledge" of that expression. But "open expression" is a normative concept—it relies on shared conventions about what counts as expressing willingness. Doesn't this analysis presuppose the very rich, shared communicative background that your theory is supposed to be explaining from the ground up? Are you grounding joint commitment, or are you just describing how it looks within a community that already understands commitment?

  6. **Follow-up to Q5 (The Normativity of Rationality)**
  *If you respond that we don't need conventions, just basic rationality or natural signs:* Is basic rationality itself normative? If you argue that a rational agent *ought* to recognize an expression of willingness, you seem to be smuggling in a normative principle to explain the origin of normativity. If you aren't smuggling that in, then what stops me from claiming I simply didn't interpret your "expression" as an expression, thereby dissolving the commitment before it began?

  7. **Scalability to Large Groups**
  This account works intuitively for dyads, like my co-founder and me. But how does it extend to large, loosely structured groups, such as a leaderless protest movement or a nation's citizenry? Nobody in a protest holds a pairwise joint commitment with everyone else. If you say they commit to the *goal* rather than the *people*, you risk trivializing the "joint" aspect. How do you maintain the rigorous "plural subject" requirement without resorting to a fiction that everyone has committed to everyone else?

  8. **Follow-up to Q7 (The Representation Problem)**
  *If you suggest that focal points or representatives can bind the group:* Doesn't that reintroduce the very institutions and conventions you claimed were unnecessary? If a protest movement requires a spokesperson or a specific signal to transform a crowd into a plural subject, then the normative force comes from the *convention of the signal*, not the joint commitment itself. Have you not just pushed the problem of authority back one step rather than solving it?

  9. **Unilateral Dissolution**
  If a joint commitment creates genuine obligations, it seems it cannot be dissolved unilaterally, or else the obligation was illusory. But if I am bound to a co-founder or a partner indefinitely until *they* agree to release me, doesn't this view entail a form of involuntary servitude? Is there any point at which an individual's autonomy overrides the plural subject's claim on them, and if so, doesn't that reintroduce the individualistic morality you sought to bypass?

  10. **Evidence of Absence**
  To close: In my own startup, we behaved exactly as if we were jointly committed for a year, yet my co-founder claims no obligation existed until we signed. Short of a signed contract, what could possibly count as evidence that two people who behave exactly as if they were jointly committed *in fact are not*? If the behavioral output is identical, is the existence of the "plural subject" actually falsifiable, or is it a label we simply apply retrospectively to successful cooperators?
