answer: |-
  Your friend is right.

  I know that's the frustrating answer, especially because your pragmatic objection ("no one is actually going to take these bets") feels intuitively solid. But in the context of rationality, calibration, and decision theory, the inconsistency is a genuine cognitive bug, not just a harmless quirk of language.

  Here is why the math nerd wins this argument, broken down by why the "no one will exploit me" defense doesn't hold up.

  ### 1. The Dutch Book Argument is About Coherence, Not Gambling
  The Dutch Book Theorem is often explained using money because money is a universal metric for value, but the theorem isn't actually about finance. It's about **logical coherence**.

  When you assign probabilities to a set of mutually exclusive and exhaustive outcomes (Win/Loss/Draw), you are making a claim about the structure of reality. You are saying, "Of the total set of all possible futures, 55% look like Team A wins, 40% look like Team B wins, and 15% look like a Draw."

  If those numbers sum to 110%, you are effectively claiming that the total measure of possibility space is larger than 100%. You believe in more "worlds" than actually exist.

  The fact that no one is there to sell you a contract based on that error doesn't fix the error in your map of reality. It's analogous to believing that $2 + 2 = 5$. If you never try to buy four apples, nobody will charge you for five, and you'll never lose money on the transaction. But your arithmetic is still wrong, and that error will propagate into other calculations you make where the consequences *are* real.

  ### 2. It Distorts Your Decision-Making (Expected Utility)
  You argued that this flaw doesn't affect your real life because you aren't placing bets. But you place "bets" every day; we just call them **decisions**.

  Rational decision-making is generally modeled as maximizing Expected Utility (EU). $EU = \text{Probability} \times \text{Payoff}$.

  If your probabilities are incoherent (summing to >100%), your EU calculations are systematically inflated.
  *   **Scenario:** You're deciding whether to invest time in a project that pays off only if your team wins.
  *   **Your Calculation:** You see a 55% chance of success.
  *   **Reality:** Because your total probability mass is 110%, your *normalized* probability of winning is actually $55/110 = 50\%$.

  You are systematically overconfident. Over time, this leads to taking risks you shouldn't take, under-preparing for failure states, and misallocating resources. You might prepare for the Win scenario with 55% intensity and the Loss scenario with 40% intensity, effectively preparing 95% for a single outcome event. You are burning cognitive energy on "possibility mass" that doesn't exist.

  ### 3. It Breaks Calibration (Your Group's Actual Goal)
  You mentioned your group does this to see "who's better calibrated over time." This is the strongest point against you.

  Calibration is measured using proper scoring rules (like the Brier Score or Log Score). These mathematical formulas punish incoherence.
  *   If you submit probabilities that sum to 110%, you are mathematically guaranteed to have a worse score than someone who submitted the same *relative* confidence but normalized to 100%.
  *   By refusing to normalize, you are voluntarily handicapping your score.

  If the goal of the exercise is to track accuracy, submitting incoherent probabilities is like submitting a temperature reading in Fahrenheit when the log requires Celsius. It doesn't matter if you "feel" like it's 70 degrees; if you input the wrong scale, your data is noise. Your friend is pointing out that your data is currently noise.

  ### 4. The "Money Pump" is Internal
  Your friend said: *"The inconsistency is sitting there in your head regardless of whether anyone ever acts on it."*

  This is the crux of it. In rationalist circles, we worry about **internal money pumps**.
  If you have incoherent preferences or probabilities, *you* can be pumped by *your future self*.
  *   **Today:** You assign 55% to a Win. You make Plan A.
  *   **Tomorrow:** You assign 40% to a Loss. You make Plan B.
  *   **Next Week:** You assign 15% to a Draw. You make Plan C.

  Because you treated these as overlapping possibilities rather than partitioning the same 100% of reality, you likely over-invested in contingency planning. You paid a "premium" in anxiety, preparation time, or opportunity cost for that extra 10% of probability mass that shouldn't exist. You paid the cost; the bookie just didn't collect it.

  ### The Verdict
  Your argument rests on the idea that probabilities are merely expressions of "vibes" or "confidence levels" that only become real when money changes hands.
  Your friend's argument rests on the idea that probabilities are **logic**.

  If you want to use numbers as vague confidence heaters, call them "confidence scores" and don't call them probabilities. But the moment you call them probabilities, you invoke the axioms of Kolmogorov. Violating those axioms means your reasoning engine is producing errors.

  It doesn't matter if the car crashes today. If the brakes are disconnected, the car is flawed. Your friend is pointing out the disconnected brakes; you're arguing that the road is currently flat. He's right. Normalize your probabilities (divide each by 1.10), take the hit on the confidence, and keep your internal logic solvent.
