answer: |-
  Good evening, everyone. For those who don't know me, I'm the Best Man. And for those who *do* know me, you know I'm currently taking a seminar on Free Will, which is why Owen looked me dead in the eye last week and said, "If you use the word 'deserve' in this speech, I will leave."

  So, let's be clear: Owen does not believe he *chose* to be here. He doesn't believe he *chose* [Partner's Name]. And he certainly doesn't believe he *chose* to be the kind of person who cries during Disney movies. According to Owen's reading of Galen Strawson's Basic Argument, none of us are the ultimate authors of ourselves. To be responsible for your actions, you'd have to be responsible for the character that produced them. But to be responsible for your character, you'd have to have chosen it. And to choose it, you'd need reasons, which come from... your existing character. It's an infinite regress. You can't be *causa sui*. You can't pull yourself up by your own bootstraps, because you wouldn't have the boots, or the arms, or the desire to try, unless something else gave them to you.

  And before the physics majors in the back try to save us: Owen knows that quantum randomness doesn't help. If your actions are random, that's not freedom, that's just noise. So, no, Owen didn't "work hard" to become the man standing here today. The universe simply unfolded in such a way that this man emerged.

  Now, for the family members wondering why we're ruining a perfectly good wedding with metaphysics: this actually matters. Because standard wedding speeches are built on the idea of merit. We say, "Look at the life you've built," or "You two earned this happiness." But Owen knows that "earning" implies a ledger in the sky, and the ledger is empty.

  However, there is a twist. And this is for the philosophy cohort in the room. Owen spends his life citing Galen Strawson. But Galen's father was P.F. Strawson. And P.F. Strawson wrote the famous paper "Freedom and Resentment." His argument was basically: "Look, maybe ultimate responsibility is impossible. But try telling that to your wife when you forget your anniversary."

  P.F. argued that our "reactive attitudes"—love, gratitude, resentment—are natural facts of human life. They don't require metaphysical justification. They just *happen*. And honestly, looking at Owen and [Partner's Name], I think the father was right, even if the son won't admit it.

  Owen, you may not have *chosen* to love [Partner's Name] in a libertarian free-will sense. You didn't weigh options in a vacuum and select a spouse like a consumer picking a toaster. But the causal chain of the universe conspired to put you in the same room, with the same chemistry, with the same shared inability to leave a party without discussing the nature of agency.

  And [Partner's Name], you didn't "earn" Owen. But you also didn't have to. You simply encountered him. And in a universe governed by entropy and blind causality, the fact that two complex human beings found a pattern that resonates this deeply isn't about merit. It's about luck. It's about grace. It's about the sheer statistical miracle that you exist at the same time, in the same place, and want the same future.

  So, I am not going to toast to the choices you've made. I'm not going to toast to the person Owen has "become," as if he sculpted himself from marble.

  Instead, I want to toast to the inevitability of this.

  I toast to the fact that given the laws of physics, the history of your families, and the random collisions of your days, it was always going to lead to this moment. I toast to P.F. Strawson, for reminding us that even if we aren't ultimately responsible, our love is still real, still necessary, and still the only thing that makes the regress stop.

  Owen, you are not the author of your life. But you are the narrator of this one. And [Partner's Name], you are the co-author of whatever comes next, determined or not.

  Please raise your glasses. To the happy accident of meeting, the causal necessity of falling in love, and to a future that unfolds exactly as it must—but hopefully, filled with as much joy as possible.

  To Owen and [Partner's Name].
