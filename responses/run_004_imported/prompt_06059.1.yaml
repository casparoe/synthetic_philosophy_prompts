      *(Self-Correction on the Women argument)*: I need to be careful. Spinoza's argument about women is one of the few places he seems to appeal to a "nature" that isn't just power. He suggests a psychological incapacity. I need to argue that he would view this as a *malleable* affective disposition, not a fixed essence, given his determinism. If the environment changes (education, social structure), the affects change.

