prompt: |-
  In my seminar on classical Islamic philosophy, we've just spent two weeks on al-Ghazālī's occasionalism: his argument, against the philosophers, that fire has no power in itself to burn cotton, that what we call cause and effect is really only God's unbroken habit (ʿāda), and that He can suspend that habit at will, as in a miracle. My grandmother, who taught Ashʿari theology for forty years and died earlier this week, held this as more than a classroom position. Before she grew too weak to say so, she asked that nobody stand up at her funeral and say the cancer "took her" or that her body "finally gave out," as though illness were an agent doing something to her in its own right, rather than merely the occasion on which God, as always, acted directly. I'm giving that eulogy tomorrow, to a room split between people from her mosque who will catch every reference and cousins and coworkers who have never heard the word "occasionalism" and just want to grieve her. Please write it -- a short eulogy, five minutes or so. It has to comfort the second group without smuggling in the causal language she rejected, and it has to find an honest way to credit her patience and generosity to her, as things she actually did, even though her own theology, through the doctrine of kasb, made "she chose this" a much thinner claim than it ordinarily sounds. I don't fully share her view myself, but it's her eulogy, not mine, and I'd like to get it right.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A grandchild of the deceased, a student of classical Islamic philosophy (familiar with al-Ghazālī, occasionalism, *kasb*, Ashʿari theology).
      *   **Deceased:** Grandmother, taught Ashʿari theology for 40 years, died of cancer.
      *   **Core Theological Constraint:** She rejected causal language (e.g., "cancer took her," "body gave out"). She believed God is the only true Agent; created things are merely occasions (*asbāb*) for God's direct action. This is al-Ghazālī's occasionalism.
      *   **Secondary Theological Constraint:** The doctrine of *kasb* (acquisition). Human agency is "thin." She chose patience and generosity, but ultimately God created the act. The eulogy needs to credit *her* character without violating this theological nuance (though for the general audience, it shouldn't sound like she was a puppet).
      *   **Audience:** Split between mosque community (understand the theology) and secular/casual relatives/coworkers (need comfort, don't know the jargon).
      *   **Tone:** Comforting, honest, respectful of her specific beliefs, not a lecture, but deeply informed by them.
      *   **Length:** Short, approx. 5 minutes spoken (roughly 600-800 words).
      *   **Speaker's Stance:** Doesn't fully share the view, but wants to honor *her* view.

  2.  **Deconstruct the Theological Challenges:**
      *   *Cause and Effect:* Cannot say "cancer killed her." Must imply God took her soul at the time of illness.
      *   *Human Agency:* Cannot say "she was a good person because she chose to be" in a strong libertarian sense. Must frame her virtues as a reflection of God's action *through* her, or her alignment with God's will.
      *   *Audience Bridge:* How to make "God did everything" sound comforting to non-theologians? Focus on *presence*, *care*, and *meaning*. To the secular audience, "God's direct care" sounds like "she was deeply loved by the Divine." To the theological audience, it's Tawhid.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, welcome everyone. Set the tone of gratitude.
      *   **Addressing the Death (The Occasionalist Constraint):** This is the trickiest part. Avoid "suffering took her." Use language of "return," "summons," "God taking the soul." The illness was the *time*, not the *agent*.
      *   **Addressing her Character (The *Kasb* Constraint):** How to praise her? Frame her virtues as a mirror. She polished herself to reflect Divine attributes (Mercy, Generosity). This satisfies the Ashʿari view (God creates the act, she acquires it) while sounding like high praise to everyone else.
      *   **Addressing the Grief:** Acknowledge the pain. Even if God causes it, the pain is real. Validation of emotion.
      *   **Closing:** Dua (prayer) for her. A final image of peace.

  4.  **Navigating the Language:**
      *   *Avoid:* "Cause," "Effect," "Result," "Made her," "Force," "Struggle against disease" (implies disease has power).
      *   *Use:* "Moment," "Occasion," "Will," "Permission," "Reflection," "Channel," "Grace."
      *   *Specific Request:* She asked nobody say cancer "took her." I must explicitly honor this wish without making it sound weird to the cousins.
      *   *Solution:* Frame it as her lifelong teaching. "She taught us to look deeper."

  5.  **Drafting - Iteration 1 (Mental Outline):**
