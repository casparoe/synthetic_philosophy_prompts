      *Word Count Check:* ~750 words is about 5 minutes at a moderate speaking pace.

      *Final Polish on the "Agency" constraint:* The prompt asks to "find an honest way to credit her patience and generosity to her... even though her own theology... made 'she chose this' a much thinner claim."
      *Solution:* Focus on her *attention* and *intention*. In Ashʿari thought, the *kasb* is the connection of the will to the act. So praising her *willingness* to be a vessel is the correct theological move that also sounds like praise to outsiders. "She made space for grace."

