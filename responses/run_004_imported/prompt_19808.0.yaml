  6.  **Drafting - Iteration 2 (Adding Warmth & Nuance):**
      Welcome. My grandmother was a teacher of faith. She had a specific view on how the world works. She believed every moment is God speaking. So when she got sick, it wasn't the sickness winning. It was God calling her. She was generous. We can say she chose that, but really it was God shining through her. To the family who doesn't know this, just know she felt very close to God. We are sad.
      *Critique:* Better. But needs to handle the *kasb* issue more gracefully. If I say "really it was God shining through," it might diminish her effort to the secular audience. I need to phrase it so her *submission* is the virtue.

  7.  **Drafting - Iteration 3 (Refining the Theology for the Audience):**
      *   *The "Cancer" line:* "She asked us not to say the illness took her. She believed nothing takes but God."
      *   *The "Virtue" line:* "Her patience wasn't just endurance; it was an opening."
      *   *The "Grief" line:* "We feel the absence."

  8.  **Final Polish (incorporating the prompt's specific constraints):**
      *   Make sure I don't sound like I'm preaching *my* philosophy (since I don't fully share it), but honoring *hers*.
      *   Ensure the secular audience feels comforted, not confused by metaphysics.
      *   Check word count for 5 minutes.

      *(Self-Correction during drafting)*: I need to be careful not to make the secular audience feel alienated. I can frame her theology as "deep attentiveness." To the mosque crowd, it's *Tawhid*. To the coworkers, it's "she saw the sacred in everything."

      *Regarding Kasb:* Instead of explaining *kasb*, I will describe her actions as "aligning her will." This honors her agency as she understood it (acquisition) without asserting independent power.

      *Regarding the Cancer:* I will explicitly mention her request. It's a powerful story that illustrates her conviction without needing a lecture on occasionalism.

  9.  **Final Review against constraints:**
