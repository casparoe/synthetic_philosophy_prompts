answer: |-
  In the name of God, the Merciful, the Compassionate.

  Thank you all for being here. For those who knew my grandmother only as a mother, a colleague, or a friend, you know her warmth. For those who knew her as a student of faith, you know her depth. But to understand the woman she was, we have to understand how she saw the world.

  She was a teacher of theology for forty years. She spent her life contemplating the nature of action, of power, and of love. And because she thought so deeply about these things, she left us with a specific request for today. She asked that we not stand here and say that cancer "took" her. She asked that we not say her body "gave out," as if her cells were rebels that overthrew her, or as if illness were a conqueror with power of its own.

  This might sound unusual to some of us. We are used to speaking in causes and effects. We say the storm broke the branch, or the virus caused the fever. But my grandmother lived with a profound conviction: that nothing in this universe acts but by permission. She believed that fire does not burn by its own nature, but because God creates the burning at the moment the fire touches the cotton. She believed that life is not held by our breath, but by a continuous, unbroken gift from the Divine.

  So, when she faced her illness, she did not see herself as a victim of a biological agent. She saw herself as a guest whose Host was finally calling her to a different room. She did not fight the cancer as an enemy with independent power; she endured the *occasion* of the illness with a patience that she knew was not hers alone, but a light shining through her.

  To her cousins and coworkers here, who may not share her specific vocabulary: please know that this belief did not make her passive. It did not make her feel like a puppet. On the contrary, it made her incredibly present. If every moment is a direct gift from God, then every moment is sacred. If every breath is renewed by mercy, then gratitude is the only logical response.

  And this is where we find the truth of her character. We are here to honor her patience and her generosity. Now, in her view, even her ability to be patient was a grace she received. But—and this is essential—she was the one who polished the mirror. She was the one who aligned her will, again and again, to let that grace pass through to us.

  When she fed the hungry, she believed God was the Provider, but she was the hand. When she comforted the grieving, she believed God was the Comforter, but she was the voice. She spent a lifetime clearing away the ego that claims credit, so that goodness could flow through her without obstruction. That clearing away? That was her work. That was her choice. That is what we celebrate today.

  I know many of us are heartbroken. We feel the absence of her voice in our phones, her seat at our tables. Even if we believe God is the only Agent, our grief is real. The Prophet wept for his son. Grief is not a lack of faith; it is the price of love. We are allowed to miss her, even as we submit to the One who gave her to us and has now recalled her.

  She taught me that the world is not a machine of cold causes, but a web of living signs. Because of her, I try to look past the surface of things. When I see kindness, I try to see the Source of it. When I feel loss, I try to remember that nothing is truly lost to the One who holds all things.

  She has returned to the only Reality she ever truly trusted. The habit of this world has continued, as it must, and she has passed from the occasion of this life to the next.

  May God envelop her in the mercy she spent a lifetime reflecting. May He expand her grave with light, and may He grant us the patience to follow in her footsteps, polishing our own mirrors until we, too, reflect something of His peace.

  To God we belong, and to Him we return. Thank you.
