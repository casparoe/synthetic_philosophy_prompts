      *   **Coherence/Dutch Book:** A set of beliefs is coherent if no Dutch Book (a guaranteed loss) can be made against you. This leads to the axioms of probability.
      *   **Context Sensitivity:** Ramsey was a pragmatist. He cared about *action*. Beliefs are habits of action.
      *   **The "System of Beliefs":** Ramsey emphasizes that beliefs aren't isolated; they exist within a system.
      *   **Measurement Conditions:** Crucially, Ramsey assumes the conditions for measuring belief must be stable. The bet must be clearly defined.

  3.  **Apply Ramsey to Sleeping Beauty:**
      *   **The Problem:** SBP introduces indexical uncertainty and self-locating belief, which Ramsey didn't explicitly address.
      *   **The Betting Setup:** The crux of the SBP Dutch Book debate is *how the bet is offered and settled*.
          *   *Scenario A (Per-Awakening):* Beauty is offered a bet *each time* she wakes. If Tails, she bets twice.
          *   *Scenario B (Per-Experiment):* Beauty is offered a bet that counts once per experiment, regardless of awakenings.
      *   **Ramsey's Likely Reaction:** He would focus on the *pragmatic context*. What is the decision problem?
      *   **Individuation of Occasions:** The user notes Beauty can't tell Monday from Tuesday. Ramsey requires that the conditions for the bet be clear to the bettor. If the bet is "I pay \$X now, get \$1 if Heads," Ramsey would ask: "When do you pay? When do you get paid?"
      *   **Coherence:** Ramsey's Dutch Book argument proves that *if* you have degrees of belief, they must obey probability calculus to avoid sure loss *given a specific betting protocol*. It doesn't necessarily dictate what the prior probability *is* (that's often where the Halfer/Thirder split happens), but it constrains how you update or act given that probability.
