      *   **Core Question:** What would Frank Ramsey (author of "Truth and Probability," 1926) have said about SBP? Would he be a Halfer, a Thirder, or reject the applicability of his framework? How would he handle the issue of individuating betting occasions when the subject can't distinguish them? Would he care about SSA/SIA?
      *   **Tone:** Intellectual, historically grounded, philosophically nuanced, engaging with the specific technical details of Ramsey's work.

  2.  **Deconstruct Ramsey's Framework ("Truth and Probability"):**
