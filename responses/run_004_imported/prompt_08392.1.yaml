answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I'm [Aunt's Name]'s nephew/niece. I'm also a software engineer. Which, as it turns out, is a dangerous thing to be when you're toasting an evolutionary biologist.

  I spend my days writing code that tells computers what to do. [Aunt's Name] spent forty years trying to read the code that tells life what to do. And I know, looking around this room, that about half of you are her former students and collaborators. So, I have a request: If I get the biology wrong, please wait until after the dessert to correct me. I'll be the one hiding behind the bar.

  I've been thinking a lot about how to talk about [Aunt's Name]'s work without turning this into a lecture. In my field, we distinguish between the backend code—the invisible logic that runs the system—and the user interface—the part you actually see and interact with.

  For forty years, [Aunt's Name] has been a champion of the "gene's-eye view." Roughly translated for the non-scientists in the back: she argued that the "backend code" of evolution is written at the level of the gene. Now, this theory is famously associated with the phrase "The Selfish Gene." And this is where the family joke comes in.

  We've always teased her that it is deeply ironic for the woman who taught us the theory of the "Selfish Gene" to be the most selfless person we know. When we were kids, she was the one driving three hours to pick us up when our cars broke down. She's the one who quietly paid for cousins' textbooks, who hosted every holiday when no one else had the energy, who gave her time until she had none left for herself.

  To the family, "selfish gene" sounds like a contradiction in terms when applied to her. But to the scientists here, I think I'm starting to understand the connection.

  I know she spent a decade in a spirited debate about worker ants. On one side, people argued the ant sacrifices itself for the "good of the colony." On her side, she argued you don't need to appeal to the colony; you just need to look at the shared genes. The math works out. The gene propagates *through* the sacrifice.

  What I've come to realize is that her life has been the ultimate proof of concept.

  Yes, the mechanism might be rooted in replication. Yes, the "code" might be strict. But look at the output. Look at the user interface. The theory she defended doesn't predict a world of cold, calculating individuals. It predicts a world where sacrifice makes sense. Where caring for your kin, where community, where generosity is the most logical strategy of all.

  She spent her career explaining *how* altruism is possible. But she spent her life showing us *why* it matters.

  There is a temptation, when you study the machinery of life, to become cynical. To think that if you can explain the mechanism, you've explained away the magic. That if an ant sacrifices itself for shared DNA, it's not "true" sacrifice. That if a woman helps her family because she loves them, it's just biology.

  [Aunt's Name] never fell for that trap. She knew that understanding the brushstrokes doesn't ruin the painting. Knowing that generosity is written into our evolutionary history doesn't make it less holy; it makes it more fundamental.

  She fought hard for her view of the science. I know that dispute with her colleague was intense. But I never saw her fight for credit. I never saw her fight for status. She fought for the truth, and then she went home and made sure her nieces and nephews had a place to sleep.

  So, to the students here: You know better than anyone how rigorous she was. You know she never took the easy answer.
  And to the family: We know better than anyone how warm she is. We know she never took us for granted.

  [Aunt's Name], you taught us that even if the genes are selfish, the organism doesn't have to be. You showed us that the best code produces the kindest results.

  Thank you for forty years of brilliant work, and a lifetime of even better examples.

  Please raise your glasses. To [Aunt's Name]. May your retirement be full of all the things you gave so freely to others: time, peace, and joy.

  Cheers.
