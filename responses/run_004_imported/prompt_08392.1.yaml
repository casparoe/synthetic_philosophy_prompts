      *   **Specific Conflict:** A decade-long dispute about worker ants sacrificing themselves (kin selection vs. group selection). She argues shared genes explain it; no need for "good of the colony."
      *   **The Irony/Joke:** She is famously generous and self-sacrificing in real life, contrasting with the "Selfish Gene" label.
      *   **Audience:** 50% scientists (students/collaborators) who know the science, 50% family who just want warmth.
      *   **Tone:** Affectionate, not a lecture, accurate enough for scientists, accessible enough for family.
      *   **Length:** Roughly 5 minutes (approx. 600-800 words spoken at a moderate pace).

  2.  **Determine the Core Theme:**
      *   The central tension is between the *theory* of selfish genes and the *reality* of a selfless woman.
      *   The resolution shouldn't be "the science is wrong," but rather "the science explains the mechanism, but her humanity transcends the mechanism." Or, better yet, "She proved that selfish genes can build selfless people."
      *   *Correction/Refinement:* Actually, the "Selfish Gene" theory *does* explain altruism through kin selection. The irony is linguistic ("selfish" sounds bad) vs. biological (genes propagate via altruistic acts). The toast needs to acknowledge this nuance without getting bogged down. The family joke is that she isn't "selfish." The scientific reality is that her theory explains *why* she is selfless.
      *   *Angle:* As a software engineer, I can use an analogy. Code vs. User Interface. The gene is the code; the organism/person is the interface. The code might be "selfish" (replication), but the output is beautiful cooperation.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the intimidation factor. I'm a coder, she's a biologist. Half the room are experts. Keep it humble.
      *   **The Science (Simplified):** Explain the "Gene's-Eye View" without jargon. Use the software analogy. Genes = Source Code. Organism = Running Program.
      *   **The Ant Dispute:** Mention the ant debate lightly. Don't take a side scientifically, but frame it as her passion. She fought for the idea that small things (genes) drive big things (sacrifice).
      *   **The Irony:** Address the "Selfish Gene" label. The family joke. She is the least selfish person.
      *   **The Synthesis:** Connect the science to her character. The theory doesn't demand selfish behavior; it explains how selflessness evolves. She lived the proof.
      *   **Closing:** Raise a glass. Retirement wish.

  4.  **Refining the Science (Crucial Step):**
      *   *Constraint:* I must not get the science wrong for the students/collaborators.
      *   *Concept:* The "Selfish Gene" (Dawkins) posits that genes act *as if* they are selfish to replicate. This often results in organismal altruism (kin selection).
      *   *The Ant Debate:* This sounds like the E.O. Wilson (Group Selection) vs. Nowak/Dawkins (Kin Selection) debate, or perhaps a specific localized version. The prompt says she defends the gene's-eye view against "good of the colony."
      *   *Accuracy Check:* If I say "She proved genes are selfish," that's wrong. If I say "She showed how selfish genes build selfless organisms," that's right.
      *   *Software Analogy:* In software, we have backend logic (invisible, strict) and frontend experience (visible, user-friendly). The backend doesn't need to be "nice" to produce a "nice" app.

  5.  **Drafting - Tone Check:**
      *   Avoid: "So, basically, evolution is..." (Too lecture-y).
      *   Include: "I write code for a living..." (Establishes perspective).
      *   Emotion: Warmth, admiration.
      *   Humor: The family joke about her generosity.

