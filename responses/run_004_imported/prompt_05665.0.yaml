answer: |-
  **Setting:** *A makeshift triage zone in the rear of a collapsed stadium. The air is thick with dust and the low hum of generators. Dr. Elena Rostova and Dr. Marcus Thorne stand over a map of the sector. They have one mobile surgical unit remaining. Battery life: one procedure. Time before irreversible shock sets in for all pending criticals: four minutes.*

  **Thorne:** (Pointing to the map) Sector 4 has the single crush injury. Male, forty. Without us, he's dead in ten minutes. Sector 7 has the bus rollover. Five criticals. Pediatric and geriatric mix. Without us, they're all dead in ten minutes. We can't split the team. We can't shuttle. It's Sector 4 or Sector 7.

  **Rostova:** (Pulling off bloody gloves) Then we flip for it.

  **Thorne:** Excuse me?

  **Rostova:** A coin. Heads, the man in Sector 4. Tails, the five in Sector 7. It's the only way to show equal concern for each individual.

  **Thorne:** Elena, look at the board. One life against five. If we flip, we are implicitly telling the five in Sector 7 that their collective need counts for no more than the single man's. You're discounting four lives simply because they happen to be in the same bus.

  **Rostova:** I'm not discounting them. I'm refusing to aggregate them. To the man in Sector 4, his death is the loss of his entire world. To the first child in Sector 7, her death is the loss of her entire world. There is no "super-loss" that exists over and above the individual losses. We owe a duty to *each* patient. How do I discharge a duty to six people equally when I can only save some? By giving them equal chance.

  **Thorne:** Equal chance of *what*? Being saved? Or equal chance of *us* doing our job? If I have five drowning swimmers on my left and one on my right, and I can only swim to one group, you're saying I should close my eyes and pick a direction?

  **Rostova:** I'm saying the numbers don't change the moral relationship between the rescuer and the rescued.

  **Thorne:** Okay. Let's test the integrity of that relationship. Suppose it isn't a bus. Suppose it's a structural collapse in a high-rise. Sector 7 isn't five patients. It's five *hundred*. Or five thousand. All critical. All certainly dying without us. Sector 4 is still just the one man. Do you still flip?

  **Rostova:** (Pauses, looking at the timer) That is the *reductio*, Marcus. I know it.

  **Thorne:** Do you accept it?

  **Rostova:** Logically? Yes. If the moral weight rests on the loss *to the loser*, then one person loses everything in the first scenario, and one person loses everything in the second. The five thousand others are not a single entity that suffers a "big death." They are five thousand individuals suffering five thousand "small deaths." My obligation is to the individuals.

  **Thorne:** So if there were five million people on the left, you'd still give the one man on the right a 50% chance?

  **Rostova:** I would say that the one man has a claim to life that is not dissolved by the existence of others. But... (She hesitates) I will concede this: As the numbers on the other side rise, the *probability* that I am the *only* rescuer available drops. In a scenario with five thousand victims, surely other teams arrive. But here? In this closed system? Yes. The principle holds. To sacrifice the one for the many is to treat him as a means to the aggregate good. He is not a vessel for utility. He is a person.

  **Thorne:** And that's where the principle breaks. You say you aren't treating him as a means. But by flipping, you are treating the five in Sector 7 as if they don't exist as a group. You say aggregation is a fiction. I say *isolation* is the fiction. We are practicing public health medicine, Elena. We are stewards of a resource.

  **Rostova:** You're stewarding resources. I'm stewarding patients.

  **Thorne:** You can't separate them. If I choose the five, am I saying the one man's claim to life is worthless?

  **Rostova:** I'm asking if his claim is *outweighable*. If numbers decide, then any individual claim, no matter how strong, is fragile. It can always be crushed by a large enough crowd. Does a person have a right to life, or do they only have a right to life provided not enough other people need it more?

  **Thorne:** They have a right to life. But rights collide. When they collide, and we cannot honor all of them, fairness dictates we minimize the violation of rights.

  **Rostova:** How is letting five die less of a violation than letting one die?

  **Thorne:** Because the *total* rights violated are fewer. Look, answer me this. If you admit that in the 1 vs. 5,000 case you would feel a moral compulsion to save the 5,000, then you admit numbers *do* count. You just set the threshold arbitrarily high to protect your intuition here.

  **Rostova:** (Quietly) I admit that the psychological burden becomes impossible. But moral truth isn't determined by when my conscience breaks.

  **Thorne:** It's determined by what we owe the community. If I save the one, I return one citizen to the world. If I save the five, I return five. In a triage scenario, the goal is not to keep my hands clean of aggregation; it's to mitigate the disaster.

  **Rostova:** And if the one man is a surgeon who saves thousands later? Do we count that?

  **Thorne:** No. We don't play God with social value. We count lives. Period. One life equals one life. That's why five beats one. It's not that the one man matters less. It's that the *outcome* of five living is better than the outcome of one living, ceteris paribus.

  **Rostova:** But you're asking me to accept that the one man's claim is *defeasible*. That enough other claims can render his null.

  **Thorne:** Not null. *Overridden.* There is a difference. His claim remains valid. We acknowledge it. We mourn it. But in a world of scarcity, valid claims compete. If I have one dose of antidote and five people poisoned, and I give it to one because "his claim is equal," I haven't treated them equally. I've treated the four who died as if their need didn't add weight to the scale.

  **Rostova:** (Looks at the watch) Three minutes.

  **Thorne:** Elena. The coin implies that the difference between one death and five deaths is morally negligible. It is not.

  **Rostova:** The coin implies that I cannot look at the five and say to the one, "You matter less because you are alone."

  **Thorne:** We aren't saying he matters less. We are saying the *tragedy* is less if he dies than if the five die. We are minimizing the tragedy, not the worth of the soul.

  **Rostova:** (She looks at the chart for Sector 4, then the chart for Sector 7. Her hand hovers over the coin in her pocket.)

  **Thorne:** We have to move. The window is closing.

  **Rostova:** If we go to Sector 7... I am signing the death warrant for the man in Sector 4. Actively bypassing him.

  **Thorne:** We are signing the death warrant for the five in Sector 7 if we go to Sector 4. There is no neutral ground. Inaction is a choice.

  **Rostova:** (She takes her hand out of her pocket. It is empty.) Taurek argued that we should not grieve more for the five than the one, because grief is for the individual loss.

  **Thorne:** Taurek wasn't standing in a disaster zone. He was in an office.

  **Rostova:** No. He was protecting the individual from the calculus. But... (She exhales sharply) If I flip, and it lands on the one, and I leave the five to die... I can live with that. If I choose the five, and the one dies... I can also live with that. But if I flip, and it lands on the one, and I look at the families of the five... I cannot tell them their loved ones were worth a coin toss.

  **Thorne:** Then you agree?

  **Rostova:** I agree that the *political* reality of medicine demands aggregation. I do not agree it is morally pure.

  **Thorne:** There is no purity here, Elena. There is only the least worst option.

  **Rostova:** (She turns to the runner waiting with the gurney) Prep the mobile unit for Sector 7.

  **Thorne:** (Nods, relief and sorrow mixing in his voice) Copy that. Sector 7.

  **Rostova:** Marcus?

  **Thorne:** Yes?

  **Rostova:** Document that the man in Sector 4 was bypassed due to resource scarcity, not medical futility.

  **Thorne:** I will.

  **Rostova:** And mark it as a moral loss. Not just a statistical one.

  **Thorne:** (Already moving) It's always a moral loss. That's why we count them.

  *(They turn and run toward the ambulance bay. The coin remains in Rostova's pocket, unflipped.)*
