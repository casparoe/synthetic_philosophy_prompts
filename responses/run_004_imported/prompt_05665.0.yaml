      *   **Ending:** Must show what the team *actually does*.
      *   **Tone:** Academic but urgent (clinical setting), philosophically rigorous but grounded in the reality of triage.

  2.  **Character Development:**
      *   *Dr. Elena Rostova (Taurekian):* Needs to sound principled, perhaps a bit weary of utilitarian calculus, focused on the individual relationship between doctor and patient.
      *   *Dr. Marcus Thorne (Aggregativist):* Needs to sound pragmatic, focused on outcomes, public health perspective, but respectful of the moral weight of individual life.
      *   *Setting:* A chaotic ER or triage tent. Background noise implied. High stakes.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes immediately. The choice is here and now.
