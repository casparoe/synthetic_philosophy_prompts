answer: |-
  Good evening. For those of you who don't know me, I'm [Name], and I had the distinct privilege of being [Bride] and [Groom]'s doctoral advisor. And for those of you who *do* know me, you know that standing here feels a bit like presiding over a peace treaty between two nations that have been in a state of vigorous, intellectual war for the better part of a decade.

  Their story began in a graduate seminar I taught on Moral Worth. It was a heated semester. [Bride] took a stand that was unapologetically Kantian. She argued that an action only has true moral value if it is done *from duty*. She loved the example of the honest shopkeeper. If a shopkeeper charges you the correct price only because he's afraid of getting a bad reputation, he's honest, sure, but he deserves no moral credit. He's just calculating. To [Bride], doing the right thing requires doing it *because* it is the right thing, period.

  [Groom], naturally, took the opposing chair. He spent the next six years arguing that [Bride] was too rigid. He drew on the story of Huckleberry Finn. Huck helps his friend Jim escape slavery, even though he believes society's rules say he shouldn't. Huck isn't following a duty; he's following his heart. He is responding to the human being in front of him. [Groom] argued, drawing on modern philosophers like Nomy Arpaly and Julia Markovits, that what matters isn't the rule in your head, but whether you are responsive to the reasons that actually make an act good.

  For years, they have debated this. Is it the duty that counts? Or is it the responsiveness to the good?

  Now, looking at them today, standing here in front of their family and friends, I realize that this marriage is the only successful synthesis of their dissertation arguments I have ever seen.

  Because, let's be honest, marriage requires both.

  There will be days when the "Huck Finn" approach is what saves them. Days when the world is difficult, and the rules don't quite apply, and what matters is simply looking at the person across the breakfast table and responding to their needs with empathy, without checking a rulebook. That responsiveness, that intuitive care, is the lifeblood of love.

  But there will also be days—let's be realistic—when the feelings are tired, when the reasons are clouded, and when the only thing holding a promise together is the sheer, stubborn Kantian will to do what is right simply because you said you would. The duty. The vow. The maxim that says, "I stay, because I promised."

  [Bride] wanted a partner who respects the duty. [Groom] wanted a partner who respects the reason. In finding each other, they found someone who challenges them to be better than they would be alone.

  And this brings me to the only conclusion a professor could possibly draw. For years, they have argued about *Moral Worth*. They have scrutinized what makes an action valuable, what makes a person good, and what credit is due.

  But tonight, we are not here to evaluate their moral worth. We are not here to examine their maxims or audit their reasons. We are here to celebrate a different kind of value entirely.

  The philosophers in the room know that in ethics, "worth" is a technical term. But for the rest of us, and I think finally for them, "worth" is a much simpler calculation. It is found in the quiet moments, the shared laughs, and the commitment to walk through life side-by-side.

  So, I cannot say they are marrying for "all the right reasons," because I know that phrase would start a fight that would last through the honeymoon. Instead, I will say this: After years of debating what makes an act worthy, they have finally found something that is simply *worth it*.

  If their love has moral worth, it is because it is real. If it has value, it is because they give it to each other, freely, every day.

  So, if everyone could please rise.

  To [Bride] and [Groom]. May your life together be full of the right reasons, bound by the strongest duties, and may you always, always be worth the argument.

  To the happy couple!
