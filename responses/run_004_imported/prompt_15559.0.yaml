prompt: |-
  So I had this whole argument with my friend Priya last night that went like 2 hours past when we were supposed to leave the bar, and I kind of want a neutral third party to help sort out who was closer to right (tbh I don't think either of us fully nailed it). We were going back and forth on that bit in Kripke's Naming and Necessity, lecture III, where he compares "heat is the motion of molecules" to "pain is the firing of C-fibers." Priya's take was that the two cases are structurally identical — in both you've got two rigid designators, so if the identity holds at all it's necessary, and the apparent contingency in both cases is just an illusion from mixing up the thing itself with how we epistemically pick it out. Like, "heat" picks out molecular motion via the contingent sensation it happens to cause in us, so we can imagine that sensation occuring without the motion and think we're imagining heat without molecular motion, when really we're just imagining some other thing (an "epistemic counterpart") that feels the same but isn't heat. She figured you can run the exact same move for pain and C-fibers and defuse Kripke's argument just as easy.

  I argued there's a real disanalogy there and that's basically the crux of the whole passage — with heat you can peel apart "whatever causes sensation S in us" from "sensation S itself," and once you've done that the appearance of contingency evaporates, since we're not actually imagining heat without molecular motion, just a heat-mimicking impostor. But pain doesn't have that kind of gap to exploit: it isn't picked out via some contingent causal go-between the way heat is, so you can't reinterpret "C-fibers firing without pain" as merely "C-fibers firing without the-thing-that-usually-causes-pain-sensations," because there's no seperate "thing" there to substitute in — for pain, seeming like pain and being pain are supposedly the same. Anyway we never resolved it (and now I sort of want to know if I was just repeating something I half-remembered from a seminar rather than actually being right). Can you lay out why Kripke thinks this heat/pain asymmetry holds, and then tell me whether Priya's "it's an illusion either way" move is actually defensible against it, or whether it just fails to engage with what's supposedly special about the mental case? Don't need the whole 101 on rigid designators, more just want to get to the bottom of this one specific move.
