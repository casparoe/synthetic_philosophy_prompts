answer: |-
  **Setting:** *The observation deck overlooking the Sleeping Beauty containment room. It is sterile, quiet. Through the one-way glass, BEAUTY is sitting on the edge of the bed. She holds a small slip of paper in her hand. She has just read it. She looks contemplative.*

  **Characters:**
  *   **HAL:** A committed Halfer (Lewisian). Calm, focused on the integrity of the prior.
  *   **TRI:** A committed Thirder (Elgan). Intense, focused on the independence of variables.

  ***

  **TRI:** Look at her. She's processing it. "Today is Monday." That's the key. Right now, in this exact second, her credence in Heads has to snap back to one-half.

  **HAL:** Does it? Because my math says she should be moving to two-thirds.

  **TRI:** Two-thirds? Hal, stop. The coin was fair. The day of the week is causally disconnected from the flip. The coin doesn't know it's Monday. The calendar doesn't know it's Tails. If learning the date changes her belief about the coin from anything *other* than 1/2, you're implying a correlation that doesn't exist. You're making the day of the week evidence for the coin toss.

  **HAL:** I'm not making it evidence in a causal sense. I'm making it evidence in a Bayesian sense. Think about the likelihoods, Tri. If the coin landed Heads, what is the probability she is woken on a Monday? One hundred percent.

  **TRI:** Sure.

  **HAL:** If the coin landed Tails, what is the probability she is woken on a Monday? Fifty percent. Because she's also woken on Tuesday.

  **TRI:** I know the likelihood ratio. $P(Mon|H) = 1$, $P(Mon|T) = 1/2$. That's exactly why your starting position is broken. You're treating "It is Monday" as if she was randomly sampled from a bag of days. But she isn't. She's a conscious agent located in time.

  **HAL:** She *is* located in time, and she just received new information about her location. Before she read that slip, she knew she was awake, but she didn't know *when*. Now she does. That eliminates the possibility of "Tuesday and Tails."

  **TRI:** But it shouldn't eliminate it in a way that biases the coin! Look, if you start at 1/2 on Sunday, and you wake up and stay at 1/2, you've decided that "waking up" is null evidence. Fine. But then you tell her "It's Monday," and suddenly Heads becomes more likely? That means "It's Monday" is *positive* evidence for Heads. How does the calendar favor Heads?

  **HAL:** It favors Heads because Heads *only* happens on Monday. Tails happens on Monday *and* Tuesday. When you rule out Tuesday, you rule out a chunk of the Tails possibility space that has no corresponding chunk in the Heads space. You've cut off a leg of the Tails stool. Of course the stool tips toward Heads.

  **TRI:** That's the trick. You're treating "Tails-Monday" and "Tails-Tuesday" as two separate, distinct possibilities that split the probability mass of Tails. But they aren't distinct outcomes of the coin flip. They are the *same* outcome experienced twice.

  **HAL:** They are distinct centered worlds. From her perspective, being awake on Tails-Monday is a different experience than being awake on Tails-Tuesday. She could be told "It's Monday" in one, and "It's Tuesday" in the other. They are mutually exclusive self-locations.

  **TRI:** They are mutually exclusive, yes. But you assigned them equal weight *relative to Heads*. You said $P(Heads-Monday) = 1/2$. And $P(Tails-Monday) = 1/4$. Why? Why does the single Heads-Monday scenario outweigh the Tails-Monday scenario? They are identical from the inside! Same room, same light, same memory state.

  **HAL:** Because the coin flip determines the weight. The coin is the root variable. $P(Heads) = 1/2$. That entire mass sits on Monday. $P(Tails) = 1/2$. That mass is spread over two days. So Tails-Monday only gets half of the Tails mass. That's 1/4. It's simple conservation of probability.

  **TRI:** It's not simple, it's circular. You're assuming the 1/2 prior on waking is correct to prove that the update leads to 2/3. But the intuition that leads to 2/3 is absurd. Imagine a variant. Suppose if Tails, she is woken a million times. If Heads, once.

  **HAL:** The Million Tails variant. I know it.

  **TRI:** She wakes up. You, as a Halfer, say her credence in Heads is still 1/2. Then you tell her, "It is the first Monday." By your logic, since $P(FirstMonday|H) = 1$ and $P(FirstMonday|T) = 1/1,000,000$, her credence in Heads should skyrocket to near 1. Just by telling her the date!

  **HAL:** Yes.

  **TRI:** That's insane. She knows the protocol. She knows that if it's Tails, she will be woken a million times. One of those times *has* to be the first Monday. Learning that she is in *that* specific waking shouldn't convince her the coin was Heads.

  **HAL:** Why not? If the coin was Tails, it is incredibly unlikely that she would find herself on the *first* Monday specifically, compared to any of the other 999,999 days. But if the coin was Heads, it is certain she is on the first Monday. Finding herself on the first Monday is a massive likelihood update in favor of Heads.

  **TRI:** But she *had* to be on *some* day. If you tell her "It is the 453rd Tuesday," the same logic applies. No matter what day you name, the likelihood ratio favors Heads. So no matter what day it is, she should believe Heads is more likely. Which means she should believe Heads is more likely *before* you tell her the day. Which contradicts your starting position of 1/2!

  **HAL:** [Pauses, taps a pen against the glass] That's the "Specialist" objection. I've heard it. But it conflates "Some day is today" with "This specific day is today." Before you tell her the date, she conditions on "I am awake on *some* day." Under Heads, that's 1 day. Under Tails, that's a million days. If you treat each waking as a distinct sample, you get the Thirder result. But I don't treat the wakings as samples. I treat the *coin* as the sample.

  **TRI:** But she's the one betting! If we offer her a bet every time she wakes up, your 1/2 credence loses her money.

  **HAL:** We're not talking about betting frequencies. We're talking about credence. What is the probability the coin *landed* Heads. Not "what fraction of wakings are Heads."

  **TRI:** And I'm telling you, you can't separate those two when the observer is the one being multiplied. Look at her. [Gestures to Beauty] She's holding the slip. "Monday." If she believes you, she thinks Heads is 2/3. If she believes me, she thinks Heads is 1/2. Which woman is rational? The one who thinks the calendar is neutral, or the one who thinks the calendar is loaded?

  **HAL:** The calendar isn't loaded. The *selection* is. She is selecting a centered world from the set of available centered worlds. The set of available centered worlds where it is Monday is {H-Mon, T-Mon}. In my model, H-Mon has weight 1/2, T-Mon has weight 1/4. Normalizing that gives 2/3.

  **TRI:** But why does H-Mon have weight 1/2? Just because the coin is fair?

  **HAL:** Yes.

  **TRI:** That's the dogma, Hal. You're privileging the coin flip over the observer's experience. You're saying the metaphysical weight of the outcome "Heads" must equal "Tails," regardless of how many times that outcome manifests an observer. I'm saying the metaphysical weight of the *observer moments* should be equal unless there's a reason otherwise.

  **HAL:** If you do that, you violate the Principal Principle. You have a fair coin, known to be fair. You haven't seen the result. Yet you assign probability 1/3 to Heads. You are ignoring the known physical chance of the coin because of... what? Because of how many times she opens her eyes?

  **TRI:** I'm not ignoring the chance. I'm acknowledging that "I am awake now" is indexical evidence. It tells me I am in a world with more wakings. Tails worlds have more wakings. Therefore, "I am awake" is evidence for Tails. That brings the 1/2 down to 1/3. Then, "It is Monday" removes the extra Tails wakings. That brings the 1/3 back up to 1/2. The circle closes. The coin remains fair.

  **HAL:** And in my circle, "I am awake" is not evidence. It was guaranteed to happen either way. So the prior stays 1/2. Then "It is Monday" is evidence, because it's not guaranteed under Tails. So the posterior goes to 2/3. The circle closes. The coin remains fair.

  **TRI:** But your posterior implies that if she waits until Tuesday... wait, she won't be awake Tuesday if it's Heads.

  **HAL:** Exactly.

  **TRI:** So she can never check. She can never see a Tuesday to verify the likelihood.

  **HAL:** That doesn't make the inference invalid. It just makes the evidence asymmetric.

  **TRI:** [Sighs, leans back] It comes down to this, doesn't it? Do we distribute probability mass over the coin outcomes, or over the observer moments?

  **HAL:** I distribute over the coin. The observer is just the vessel.

  **TRI:** I distribute over the observer. The coin is just the generator.

  *[Silence stretches between them. Below, Beauty places the slip of paper on the bedside table. She looks up at the camera, expressionless. She knows it is Monday. She does not know the coin.]*

  **HAL:** She's waiting for us to tell her what she should believe.

  **TRI:** She's waiting to see if the universe makes sense. If telling her the day changes the coin, the universe doesn't make sense.

  **HAL:** If telling her the day *doesn't* account for the fact that Tails creates more days, then *you're* not making sense of the information she received.

  **TRI:** [Softly] 1/2.

  **HAL:** [Softly] 2/3.

  *[They both watch her. She closes her eyes. Neither looks away.]*
