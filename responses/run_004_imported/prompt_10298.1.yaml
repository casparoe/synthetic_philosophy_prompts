answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name], [Aunt Name]'s nephew/niece.

  If you've spent any time with this family over the last sixty years, you probably have a favorite story about [Aunt Name]. Usually, it involves a police station. Maybe it's the sit-in in the sixties. Maybe it's the fence in the eighties. Maybe it's the pipeline access road just two summers ago, when she was nearly eighty.

  I know a lot of my cousins are thinking of her right now as a rebel. A troublemaker. A badass grandma who didn't care about rules. And honestly? I get the appeal. It's a great story.

  But if [Aunt Name] were here—and if she were in charge of this script—she would stop me right there. She would clear her throat, adjust her glasses, and tell me I was getting it wrong. Because to her, there was a massive difference between being a "rebel" and being a citizen.

  She hated the idea that she was breaking the law because she thought she was above it. She hated the phrase "following her conscience" if it implied her private feelings mattered more than public justice. She actually had a specific term for just following your own heart: "conscientious refusal." Like a draft resister hiding in the basement. She was a little sniffy about that. She thought that was private.

  What she did was public.

  She believed that if you are going to break a law, you have to do it in the open, nonviolently, and you have to appeal to everyone's shared sense of fairness. And most importantly, you have to accept the punishment.

  I remember one time, a lawyer told her she didn't actually have to turn herself in. There was a loophole. She could have skipped the booking, the mugshot, the night in a cell. But she went anyway. She insisted on it.

  When we asked her why she wanted to sit in a jail cell when she didn't have to, she told us it was about respect. She said, "I am not attacking the legal system. I am asking it to be better. If I break the rule and then hide from the consequence, I'm just a criminal. If I break the rule and take the penalty, I'm showing that I respect the law enough to pay the price for changing it."

  That was the pedantic part of her that we all loved and sometimes rolled our eyes at. She took a night class decades ago—something about political philosophy, Rawls or his critics—and she held onto those definitions like they were heirlooms. She wanted us to use the right words. Not because she was bossy, but because she believed that using the right words was how we kept our thinking clear. And clear thinking was how we kept the world just.

  To my cousins who see her as a rebel: She was tough, yes. But she wasn't chaotic. She was incredibly disciplined. She followed the rules of her protest more strictly than most people follow the speed limit.

  To her friends from the discussion group sitting in the back: I hope I'm getting the distinction right. I know she'd want me to try.

  And to the rest of the family, who just remember her coming home from a protest and making sandwiches for everyone: That's the part that matters most. The philosophy wasn't cold to her. It wasn't just books and vocabulary. It was how she loved us.

  She believed we owed each other truth. She believed we owed each other a society that worked for everyone. And she believed that love wasn't just a feeling you kept in your chest; it was something you dragged your body out into the street for. Even when you were eighty. Even when it was raining. Even when it meant missing a family dinner because you were in booking.

  [Aunt Name] didn't want us to remember her as someone who broke rules. She wanted us to remember her as someone who kept promises. Promises to justice, to her neighbors, and to the future.

  So, if you want to honor her, don't just tell the mugshot stories. Tell the stories about why she was there. And if you find yourself facing something unjust, don't just follow your heart. Do the harder thing. Be public. Be nonviolent. And stand by what you do.

  She was a lot of things to us. An aunt, a friend, a pain in the neck about vocabulary. But mostly, she was a citizen in the truest sense of the word. And we are all less safe, less challenged, and less loved without her.

  Thank you.
