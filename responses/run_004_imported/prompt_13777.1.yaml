          *   If it fails (Collaborator's view): Magic binds *souls/life*. Golems are free/immune. Themes of creation, autonomy, what makes a being.
      *   *Step 4: Propose a solution strategy.*
          *   Stop looking backward (it's a dead end).
          *   Look forward (narrative utility).
          *   Consider the "Third Option" (maybe it works differently?).
      *   *Step 5: Collaboration tips.* How to decide together without ego.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm on the logic.
      *   Avoid taking sides.
      *   Use literary terms (canon, retcon, internal consistency) but keep it accessible.
      *   Highlight that *ambiguity* in the past is actually an *opportunity* now.

  6.  **Final Polish (Self-Correction during drafting):**
