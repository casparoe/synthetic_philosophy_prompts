answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** [Your Name], Chair, Ad Hoc Committee on Decision Mechanisms
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Futarchy Pilot Proposal (Gen-Ed Curriculum)

  **1. Introduction and Context**

  The Committee has reviewed the joint proposal from the Departments of Economics and Computer Science to pilot Robin Hanson's "futarchy" mechanism for selecting the next General Education curriculum. Under this proposal, the Senate would vote on a welfare metric (five-year graduation rate, weighted for first-generation students), and a campus-wide prediction market would determine the curriculum choice based on which option traders price as more likely to maximize that metric.

  We recognize the intellectual ambition of this proposal. Futarchy offers a compelling theoretical separation of normative questions (what we value) from epistemic questions (what actions achieve those values). In an environment often plagued by deadlock and opaque committee reasoning, the promise of a mechanism that aggregates dispersed information via financial incentives is tantalizing.

  However, after rigorous deliberation, the Committee must weigh theoretical elegance against institutional risk. This memo outlines our recommendation to **narrow the pilot** to a non-binding, advisory capacity, contingent upon specific design safeguards.

  **2. Critical Analysis of the Proposal**

  Our analysis centers on two primary vulnerabilities: the normative weight of the metric and the epistemic reliability of the market.

  *   **The Normative Bottleneck:** Proponents argue that voting on the metric settles the "values" portion of the equation, leaving the market to handle "facts." We find this distinction porous. By selecting *only* graduation rates (even weighted), the Senate effectively precludes other values—such as depth of inquiry, civic engagement, or faculty workload—from the decision function. Fixing the metric does not merely settle values; it narrows the horizon of what counts as a successful education. If the market optimizes for graduation rates, it may incentivize grade inflation or curriculum dilution, outcomes that satisfy the metric but violate the broader mission of the university.
  *   **The Thin Market Problem:** The most severe objection concerns market efficiency. Futarchy relies on the Efficient Market Hypothesis—that prices reflect all available information. This requires liquidity and diverse participation. A campus market of a few hundred traders, resolving five years out, is structurally "thin." Capital is expensive to tie up for half a decade, discouraging participation. In a thin market, the cost to manipulate the price is low. An interested party (e.g., a textbook vendor, a department seeking enrollment protection, or an external ideological group) could profitably distort the market price to select their preferred curriculum, decoupling the price from the true probability of success.

  **3. Recommendation: Narrow the Pilot**

  The Committee recommends **narrowing the pilot**. We advise the Senate to authorize the creation and operation of the prediction market, but **without binding the Senate to its outcome.**

  Instead, the market should serve as a high-fidelity advisory signal alongside traditional committee recommendations. The Senate retains final ratification authority. This approach allows us to test the mechanism's information-aggregation capabilities without exposing the university's academic core to the risks of a manipulable or misaligned algorithm.

  **4. Required Design Safeguards**

  Should the Senate accept this narrowed pilot, the Committee stipulates the following safeguards to ensure data integrity and minimize manipulation:

  1.  **Liquidity Subsidies:** The university must subsidize the market pool. By providing capital that absorbs bets, we lower the barrier to entry for honest traders and raise the cost for manipulators who must move a larger pool of capital to shift prices.
  2.  **Position Limits:** No single trader (or coordinated group) may hold more than 5% of the outstanding shares on either curriculum option. This prevents "whale" dominance.
  3.  **Transparent Order Books:** All bids and asks must be publicly visible in real-time to allow for peer monitoring of anomalous trading patterns.
  4.  **Metric Operationalization:** The definition of the welfare metric must be locked prior to market opening. Specifically, "weighted for first-generation students" requires a precise formula to prevent post-hoc accounting adjustments that could invalidate the market's resolution.

  **5. The Strongest Objection to This Recommendation**

  We anticipate a forceful objection from the proposal's supporters, particularly our colleagues in Economics. They will argue that **making the market advisory gutsets the mechanism.**

  Futarchy works only if traders have "skin in the game"—if they profit from truth and lose from error. If the Senate retains veto power, the market price no longer reflects the probability of the curriculum *being adopted and succeeding*, but rather the probability of the Senate *agreeing with the market*. This introduces a second-order speculation layer that corrupts the price signal. By removing the binding nature of the vote, we are not testing futarchy; we are testing a poll with play money. We risk gathering no useful data on whether futarchy actually works, rendering the two-year pilot an exercise in theater rather than inquiry.

  **6. Rebuttal and Conclusion**

  This objection is theoretically sound. An advisory market is not a true futarchy. However, we must prioritize **institutional fiduciary duty** over experimental purity.

  To run a binding pilot on a decision with a five-year horizon and known susceptibility to manipulation is to treat the student body as subjects in an unproven economic experiment. If the market is manipulated, and the inferior curriculum is adopted, the cost is measured in delayed graduations and diminished education for thousands of students. We cannot ethically justify imposing that risk to test a hypothesis, however elegant.

  By running the market in parallel with traditional decision-making, we can compare the market's signal against committee findings. If they align, it bolsters confidence in both. If they diverge, it prompts necessary investigation before a final vote. This preserves the epistemic value of the market while retaining the normative responsibility of the Senate.

  We move that the Senate authorize the prediction market as an advisory instrument, subject to the safeguards listed above, for the duration of the curriculum selection process.

  Respectfully submitted,

  [Your Name]
  Chair, Ad Hoc Committee on Decision Mechanisms
