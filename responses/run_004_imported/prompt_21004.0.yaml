answer: |-
  **Title:** The Limits of Aggregation: Harsanyi's Theorem and the Ex Ante/Ex Post Dilemma

  **Introduction**

  John Harsanyi's 1955 aggregation theorem is frequently cited as the most promising formal vindication of utilitarianism. The allure is obvious: if we accept that individuals and a social evaluator satisfy the von Neumann-Morgenstern (vNM) axioms of rationality under uncertainty, and if the social evaluator respects a weak Pareto condition, the social welfare function *must* take the form of a weighted sum of individual utilities. For proponents like John Broome, this suggests that utilitarianism is not merely a substantive moral claim but a requirement of rational consistency. However, as your seminar discussions have highlighted, the move from a mathematical representation theorem to a substantive theory of distributive justice is fraught with peril.

  This essay evaluates whether Harsanyi's theorem provides good reason to accept utilitarianism or whether the objections raised by Amartya Sen and Peter Diamond demonstrate that the theorem's premises are either question-begging or normatively insufficient. I will argue that while Harsanyi successfully identifies a structural constraint on rational social choice under uncertainty, the theorem fails to vindicate utilitarianism as a theory of *distributive ethics*. The Sen and Diamond objections reveal that the theorem conflates risk-preference with welfare and ignores the moral significance of distribution itself. Consequently, the tension between *ex ante* and *ex post* perspectives on the Pareto principle cannot be formally resolved within the vNM framework; it must be lived with, and for the purposes of distributive justice, the *ex post* perspective must take precedence.

  **The Harsanyi-Broome Defense: Rationality as Morality**

  To appreciate the strength of the Harsanyi program, we must state its strongest version. Harsanyi does not merely assert that we should sum utilities; he argues that any social evaluator who disagrees is being irrational. The argument rests on two pillars: the vNM representation of preferences and the Pareto principle.

  If an individual's preferences over lotteries satisfy the vNM axioms (completeness, transitivity, continuity, and independence), those preferences can be represented by a utility function unique up to positive affine transformation. Harsanyi adds the "Pareto Indifference" condition: if every individual is indifferent between two social lotteries, society must be indifferent. Under these conditions, the social utility function $W$ is an affine transformation of the sum of individual utility functions $U_i$.

  John Broome has refined this by arguing that the theorem bypasses the traditional objection that interpersonal comparisons of utility are impossible. In the vNM framework, utility is cardinalized by attitudes toward risk. If we accept that the social evaluator is essentially an "impartial observer" who adopts the preferences of individuals under a veil of ignorance (or simply respects their rational preferences), the weights in the aggregation fall out naturally. On this view, utilitarianism is not a controversial moral doctrine about the "good," but a logical consequence of respecting individual rationality and unanimity. To reject the additive form is to violate the Pareto principle or the axioms of rational choice. Thus, the theorem earns its utilitarian conclusion by showing that non-utilitarian aggregators are formally inconsistent with basic rationality constraints.

  **Sen's Measurement Objection: The Equivocation on Utility**

  Amartya Sen's objection strikes at the interpretative link between the mathematics and the morality. Sen argues that Harsanyi's theorem trades on an equivocation between two distinct concepts of utility.

  In the vNM framework, an individual's utility function $U_i$ is a numerical index of their attitude toward risk. It measures how much probability of a preferred outcome an individual requires to compensate for the risk of a less preferred one. It does *not* necessarily measure the intensity of their welfare, well-being, or happiness. I might have a high vNM utility for a risky outcome because I am risk-seeking, not because that outcome makes me significantly better off in welfare terms.

  For the summation $W = \sum U_i$ to represent utilitarianism (the maximization of total welfare), the $U_i$ terms must represent interpersonally comparable levels of welfare. However, the vNM axioms alone do not fix the zero points or the units of the $U_i$ functions in a way that allows for interpersonal comparison. We can scale Individual A's utility arbitrarily relative to Individual B's without violating the vNM axioms. Harsanyi typically resolves this by invoking an "ethical preference" or anonymity to fix weights, but Sen points out that this is an additional normative assumption, not a result of the theorem itself.

  Therefore, the theorem proves only that social preferences must be linear in *something* that represents individual risk preferences. It does not prove that social preferences must be linear in *welfare*. By treating the vNM index as a proxy for welfare, Harsanyi begs the question. The additive structure is an artifact of the representation theorem, not a discovery about the shape of the good. If utility is merely preference satisfaction under risk, summing it tells us nothing about the distribution of well-being, which is the core concern of distributive ethics.

  **Diamond's Fairness Objection: The Ex Ante/Ex Post Conflict**

  While Sen attacks the measurement of the inputs, Peter Diamond attacks the aggregation procedure itself. Diamond's 1967 critique focuses on the moral significance of the *process* of distribution, specifically regarding fairness.

  Consider Diamond's famous example: An indivisible benefit (say, a life-saving drug) must be allocated to one of two individuals, A and B, who are equally situated. The options are: (1) Give to A; (2) Give to B; (3) Flip a fair coin.
  If A and B have identical vNM utilities for the drug, the expected utility of all three options is identical. Harsanyi's theorem, relying on expected utility maximization, implies society should be indifferent between assigning the drug deterministically and flipping a coin.

  Diamond argues this is morally blind. The coin toss has intrinsic value because it treats the individuals with equal respect *ex ante*, giving each a fair chance, even if the *ex post* outcome is the same. Harsanyi's framework, which evaluates lotteries solely by their expected utility, cannot capture the value of procedural fairness. It collapses the distinction between a fair lottery and an arbitrary assignment, provided the probabilities are the same.

  This objection highlights a deeper structural conflict between *Ex Ante Pareto* and *Ex Post Pareto*.
  *   **Ex Ante Pareto:** If every individual prefers Lottery L to Lottery M (based on expected utility), Society should prefer L to M. Harsanyi's theorem relies on this.
  *   **Ex Post Pareto:** If, in every possible state of the world, outcome O1 is Pareto superior to O2, Society should prefer O1 to O2.

  In the Diamond case, the coin toss is preferred *ex ante* (by the participants who value fairness), but standard vNM social evaluation looks only at the *ex post* expected sum. Conversely, if we strictly follow Harsanyi's *Ex Ante* Pareto, we are committed to ignoring the distribution of outcomes across states of the world. We are committed to saying that a world where A gets everything is just as good as a world where chances are equalized, provided the expectations match. For distributive ethics, which is fundamentally concerned with the actual distribution of goods and burdens, this is unacceptable.

  **The Impossibility of Resolution**

  Your colleague in decision theory suggests these objections are answerable. It is true that one can modify the axioms. For instance, one could incorporate "fairness" directly into individual utility functions (making individuals prefer the coin toss). However, this merely pushes the problem back: it requires individuals to have specific moral preferences over procedures, which violates the standard interpretation of vNM utility as self-interested welfare.

  More formally, Philippe Mongin (1995) demonstrated that under standard conditions, it is impossible to satisfy the vNM axioms, the *Ex Ante* Pareto principle, and the *Ex Post* Pareto principle simultaneously without resulting in a dictatorship or ignoring risk entirely. You cannot have it both ways. You must choose whether social rationality mirrors individual rationality over lotteries (*Ex Ante*) or whether it respects the ranking of outcomes once uncertainty is resolved (*Ex Post*).

  Harsanyi chooses *Ex Ante*. This makes his theorem a result about **social choice under uncertainty**, but it disqualifies it as a complete theory of **distributive justice**. Distributive justice is primarily concerned with the *ex post* reality of who gets what. If a theory tells us that a society where one person starves and another feasts is equivalent to a society where both are moderately fed (because the expected utility is the same), it has failed as a theory of distribution, regardless of its mathematical elegance.

  **Conclusion: Living with the Tension**

  Does Harsanyi's aggregation theorem give us good reason to accept utilitarianism? The answer is no. It gives us good reason to accept that if we treat social choice as a problem of maximizing expected utility under a specific set of rationality constraints, we arrive at a utilitarian *structure*. But as Sen shows, that structure does not guarantee we are measuring welfare, and as Diamond shows, that structure ignores the moral value of fairness and distribution.

  The theorem succeeds as a consistency check for welfarist consequentialists who already accept that risk-preference is the correct metric for welfare and that *ex ante* efficiency trumps *ex post* equity. But it fails as an independent argument for utilitarianism because it smuggles in these substantive moral commitments as formal axioms.

  Regarding the tension between *ex ante* and *ex post* Pareto: This tension cannot be resolved within the vNM framework. It is a fundamental incompatibility between respecting individual preferences over risk and respecting social preferences over outcome distributions. We must live with it. For a seminar on *distributive ethics*, the verdict must be that the *Ex Post* perspective is normatively prior. We cannot allow the mathematical convenience of expected utility aggregation to obscure the moral reality of inequality. Harsanyi's theorem remains a landmark in social choice theory, but it does not deliver utilitarianism "for free." It delivers a specific form of rationality, and we must still do the hard moral work of deciding whether that rationality is just.
