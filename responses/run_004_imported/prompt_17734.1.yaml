answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Two philosophers of psychiatry, ELENA and MARCUS, are reviewing a case study submitted by a former student—a 34-year-old woman recently diagnosed with autism.*

  **Elena:** It's a compelling narrative, isn't it? She describes the exact mechanism Hacking warned us about. She finds the label, the label changes her self-conception, she joins a community, and that community lobbies to change the clinical criteria. She calls it a "moving target." I think we have to concede that for interactive kinds like this, the target *must* move. And if the target moves in response to the aiming, can we really say the target was there independently of the aim?

  **Marcus:** I concede the looping, Elena. I don't dispute Hacking's description. The category "autistic" is undeniably interactive. People read about it, advocate for it, and change how they behave. But I reject the inference that this makes the category unreal. A medical concept can be revised without the underlying condition being invented by the revision.

  **Elena:** But look at the history she cites. Asperger's Syndrome existed, then it didn't. DSM-5 folded it into ASD. That wasn't a discovery of new biological data. That was a consensus decision. If the *kind* itself can be legislated out of existence by a committee, it suggests the boundaries are drawn by social utility, not natural joints.

  **Marcus:** The *label* "Asperger's" was retired. The people didn't vanish. The committee decided that the distinction between Asperger's and High-Functioning Autism wasn't reliable. That's a correction of the map, not the territory. Think of it like the reclassification of Pluto. Pluto didn't cease to be a rock in the Kuiper Belt because astronomers changed the definition of "planet." Similarly, the woman in this case didn't cease to have her specific neurocognitive profile because the DSM changed.

  **Elena:** That analogy assumes autism is like a rock. Hacking's point is that human kinds are *not* like rocks. Rocks don't read the periodic table and decide to behave differently. When we classify a person as "autistic," we offer them a script. She mentions reading outside her lane, adopting the "neurodiversity" framework. She now interprets her social difficulties not as "deficits" but as a "two-way mismatch." That's a profound ontological shift in what the condition *is*. If the definition of the symptoms changes based on political advocacy, how can you claim realism?

  **Marcus:** Because the *mismatch* was always there. For decades, clinicians framed it as a one-way deficit because they were looking through a neurotypical lens. The neurodiversity movement didn't invent the social friction; they corrected the interpretation of it. That's not anti-realism; that's better realism. It's like realizing a ruler was bent. If you measure a board with a bent ruler, then switch to a straight one, the measurement changes. Does that mean the board wasn't real? No, it means your tool was biased. The "looping" here is the correction of the bias through the testimony of the classified.

  **Elena:** But the testimony *changes* the classified. She says she was "missed for years" because the criteria were built on young boys. Now that the criteria include female presentations, she fits. But her traits existed then. So, what is the "autism" that persisted? If the diagnostic criteria are the only access point we have to the kind, and those criteria are mutable based on who is advocating, then the kind is constituted by that advocacy. You're positing a "ghost in the machine"—a hidden neurocognitive substrate that we never actually see, only the shifting social categories.

  **Marcus:** I'm not positing a ghost. I'm positing a causal basis. There is a biological and developmental reality that causes her sensory sensitivities, her communication style, her need for routine. That reality existed when she was ten, even if the clinicians called her "shy." The looping effect acts on the *experience* of the condition and the *social consequences*, not necessarily the underlying causal mechanism. The category picks out that mechanism, albeit imperfectly.

  **Elena:** "Imperfectly" is doing a lot of heavy lifting there. If the looping is strong enough, the mechanism itself might adapt. If she learns to mask differently because of her diagnosis, or if she avoids certain environments because she now identifies as autistic, her neural pathways and behavioral outputs shift. The classification feeds back into the biology. If the thing classified changes its nature because of the classification, in what sense is the classification "tracking" a stable entity?

  **Marcus:** It tracks a stable *disposition*, even if the *manifestation* varies. A disposition to process sensory input differently, or to prioritize pattern recognition over social cueing. That doesn't vanish because she learns to cope. Look at her phrase: "traits I had always chalked up to being introverted." The traits were there. The *explanation* changed. Realism doesn't require that our concepts be static. It only requires that there be something in the world that constrains our concepts. We can't just decide *anything* is autism. There are limits.

  **Elena:** I agree there are limits. But constraints aren't the same as natural kinds. Money is constrained—you can't just print infinite cash without consequence—but it's a social kind. I'm arguing autism is more like money than like gold. It's a way of organizing human variation that serves a function: access to support, community identity, explanatory power. The "looping" proves it's a negotiation, not a discovery. When she says the category is a "moving target," she's acknowledging that the target is defined by the shooters.

  **Marcus:** But why does the negotiation converge? Why do clinicians, patients, and researchers keep coming back to similar clusters of traits? Sensory issues, social communication differences, repetitive behaviors. If it were purely a social negotiation like currency, we could negotiate it to mean something else entirely tomorrow. We can't. The "resistance of the world" is what makes it real. Her struggle isn't imagined. The looping modifies how she navigates the struggle, but the struggle exists independently of the label.

  **Elena:** The struggle exists, yes. But does the *kind* "Autism" exist? Or is "Autism" just the name we give to that struggle when it fits a specific institutional framework? My worry is that your "modest realism" comforts people by suggesting they have a "real" condition, but it obscures the fact that the "realness" is dependent on the very social structures we're critiquing. If the Double Empathy Problem becomes the dominant model, "autism" might eventually cease to be a medical diagnosis at all and become a sociological description. If the category dissolves into a description of social mismatch, your "underlying substrate" becomes irrelevant.

  **Marcus:** Even if it becomes a sociological description, it describes a *real* mismatch rooted in *real* neurocognitive differences. I'm willing to be revisable on the *status* of the category—medical vs. sociological—but I insist it tracks a persistent feature of human diversity. Your eliminativism risks telling her that her diagnosis is "just" a story.

  **Elena:** Not "just" a story. A constitutive narrative. But yes, I worry that your realism reifies a boundary that is actually porous. You say the traits were there when she was ten. I say the *traits* were there, but "autism" wasn't, because "autism" is the looped interaction between those traits and the diagnostic community.

  **Marcus:** So here is where we are stuck. We agree on the facts: The criteria changed (DSM-5). The interpretation changed (Double Empathy). The population changed (adult women included). We agree looping occurs.

  **Elena:** Exactly.

  **Marcus:** But our disagreement is metaphysical. It comes down to this: Do I believe the looping effect *constitutes* the kind, or do I believe the looping effect *interacts* with the kind?

  **Elena:** Precisely. I argue that for interactive kinds, the constitution *is* the interaction. There is no "autism" outside of the feedback loop between the person and the classification. To say there is something "independent" is to posit a noumenal thing we can never access.

  **Marcus:** And I argue that the feedback loop requires something to feed back. There must be a stable causal node—the neurotype—that anchors the loop. Without that anchor, the looping is just noise. I am claiming that the "moving target" is actually a stable object seen through a moving lens. You are claiming the movement of the lens creates the object.

  **Elena:** So, for the woman in the case study...

  **Marcus:** I would tell her: The label changed, and your understanding changed, but the neurocognitive style that made you feel different at ten and makes you feel different at thirty-four is a real, stable feature of your biology. The looping refined the concept to fit *you*, not the other way around.

  **Elena:** And I would tell her: The label gave you a language to organize your experience, and in doing so, it changed who you are. That doesn't make it fake, but it makes it a partnership between you and the category. You aren't "really" autistic in a static sense; you are participating in the ongoing creation of what "autistic" means.

  **Marcus:** Then our disagreement is not about the *facts* of the diagnosis. It is about whether the "truth" of the diagnosis lies in its *causal history* (my view) or its *current functional role* (your view).

  **Elena:** Agreed. You want to know what caused the traits. I want to know what the traits *do* now that they are named.

  **Marcus:** And until we resolve whether psychiatric kinds are defined by their etiology or their ecology, we will keep talking past each other.

  **Elena:** But at least we agree the conversation itself is part of the loop.

  **Marcus:** Indeed. And by having it, we're changing the philosophy of psychiatry. Which proves your point.

  **Elena:** And validates mine.

  **Marcus:** *Smiles.* Shall we get coffee?

  **Elena:** Only if you promise not to categorize my order.

  **Marcus:** I'll try to resist the diagnostic impulse.
