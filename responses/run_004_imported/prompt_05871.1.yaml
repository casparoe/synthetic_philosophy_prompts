  **MEMORANDUM**

  **TO:** Clinical Director, Residential Treatment Center
  **FROM:** Clinical Ethics Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Emergency Review: Enforcement of Self-Binding Directive (Patient ID: [Redacted])

  **I. RECOMMENDATION**

  The Ethics Committee recommends that the clinical team **honor the self-binding directive** signed by the patient three weeks ago. We advise that the patient be held for the stipulated 72-hour stabilization period, despite her current demand for discharge.

  This recommendation is contingent on the Medical Director's confirmation that enforcing this directive does not violate specific state statutory language regarding civil commitment. Assuming the legal risk is manageable, the ethical obligation is to uphold the precommitment.

  **II. ETHICAL RATIONALE FOR MAJORITY VIEW**

  The core ethical justification rests on the principle of **precedent autonomy** applied to a known pathology of volition.

  1.  **Autonomy as Extended in Time:** Standard bioethics prioritizes the "contemporaneous self." However, addiction is clinically characterized by *akrasia* (weakness of will) and hyperbolic discounting, where the value of immediate relief drastically outweighs long-term well-being. The patient, when sober and stable (T1), accurately predicted that her preferences during withdrawal (T2) would be distorted by physiological compulsion. By signing the directive, she exercised her autonomy at T1 to protect her critical interests (long-term recovery) against her experiential interests at T2 (immediate relief from withdrawal distress).
  2.  **The Nature of the "Hold":** This is not a standard involuntary commitment imposed by the state against a citizen's will. It is a contractual enforcement of a will the patient herself authored. To release her now is to privilege the "addicted self" over the "sober self," effectively treating the addiction as a legitimate decision-maker rather than the condition the patient is seeking to treat.
  3.  **Integrity of the Treatment Model:** The program was designed specifically for this contingency. To override the directive now undermines the therapeutic framework for all current and future patients. If the "Ulysses contract" is voided the moment the "Sirens" are heard, the mechanism offers no actual safety, and the trust placed in the institution by future patients will be compromised.

  **III. MINORITY VIEW AND COUNTER-ARGUMENT**

  A significant minority of the committee argues that the patient must be **discharged immediately**. Their position relies on the principle of **current competence and bodily sovereignty**.

  1.  **Competence is Decision-Specific:** The patient is currently lucid, oriented, and able to articulate reasons for her discharge. She correctly identifies that she does not meet the state's "danger to self/others" standard. In medical ethics, a competent adult has the right to refuse treatment, even if that refusal leads to harm or death. By holding her, we are asserting that we know her interests better than she does *right now*, which is the definition of paternalism.
  2.  **The "Philosophy Costume" Risk:** There is a danger of using philosophical concepts (like hyperbolic discounting) to rationalize overriding a patient's civil liberties. If a patient can contract away their right to leave while competent, we risk creating a class of "contractual detainees." This sets a precarious precedent where admission contracts could erode statutory protections against false imprisonment.
  3.  **Therapeutic Alliance:** Enforcing the hold may secure 72 hours of safety, but it risks destroying the therapeutic relationship. If the patient feels coerced by a document she signed under duress (early recovery), her engagement upon readmission (which is statistically likely) may be compromised by resentment and a sense of betrayal.

  **IV. STANDING POLICY REVISION**

  While we recommend enforcing the directive in this specific case to maintain program integrity, the Committee identifies a critical vulnerability in the current policy.

  **Effective immediately:** All future Self-Binding Directives must include a specific capacity assessment clause. The directive should state that enforcement is triggered not merely by a *request* to leave, but by a clinical determination that the patient currently lacks **decision-making capacity regarding discharge**, with the signed directive serving as *prima facie* evidence of that anticipated incapacity. Furthermore, Legal Counsel must review the language to ensure it functions as a revocable admission agreement rather than a waiver of habeas corpus rights, to minimize liability exposure.

  **V. ACTION PLAN**

  *   **Tonight:** Medical Director to document specific deficits in decision-making capacity related to withdrawal symptoms, referencing the directive as prior evidence of the patient's own insight into these deficits.
  *   **Shift Change:** Inform patient that the directive is being honored based on her prior autonomous choice, not as a punishment. Re-orient to treatment goals.
  *   **Follow-up:** Committee to reconvene in 14 days to review the legal feedback and revise the directive form.

  **Signed,**

  *Clinical Ethics Committee*
