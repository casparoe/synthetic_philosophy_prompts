answer: |-
  **Setting:** *A university office, late afternoon. The remains of a seminar on Practical Reasoning are scattered on the table—coffee cups, printouts of Ruth Chang's "Hard Choices" and John Broome's "Is Incommensurability Vagueness?" Elena (defending Parity) is packing her bag. Marcus (defending Vagueness) is leaning against the whiteboard, marker in hand.*

  **Marcus:** You looked frustrated when I brought up the sorites series in the seminar. I take it you think the Small-Improvement Argument (SIA) survives the vagueness objection?

  **Elena:** Frustrated is polite. I think you're treating the SIA like a linguistic puzzle when it's a structural claim about normative space. Look, take the case we used: Law ($L$) versus Cello ($C$). I'm torn. According to you, that's just because "better than" is a vague predicate. There's no fact of the matter yet.

  **Marcus:** Precisely. Just like "tall." If I add one millimeter to a borderline tall person, they don't suddenly become determinately tall. There's a zone of indeterminacy. Why should value be different? If $L$ and $C$ are roughly equal, adding five hundred dollars to the Law salary ($L+$) puts us still within the zone of indeterminacy. $L+$ is not determinately better than $C$. That explains the intuition without positing a fourth relation.

  **Elena:** But that misses the specific force of the improvement. The SIA isn't about adding one millimeter forever. It's about the *eventual* collapse of the tie. If $L$ and $C$ are merely vaguely equal, there must be *some* improvement to $L$—say, an extra million dollars—that makes $L+$ determinately better than $C$. You agree?

  **Marcus:** Eventually, yes. If the salary is infinite, Law is better.

  **Elena:** Okay. Now, imagine the range between the current offer and that million-dollar breakpoint. In the vagueness model, as we slide up the salary scale, we move from "indeterminately equal" to "indeterminately better" to "determinately better." But in that middle zone, where $L+$ is significantly sweeter but not yet determinately better, how does $L+$ relate to $C$?

  **Marcus:** It's indeterminate whether $L+$ is better than $C$.

  **Elena:** And is $L+$ better than $L$?

  **Marcus:** Determinately yes. More money is better, ceteris paribus.

  **Elena:** So we have: $L+$ is better than $L$. $L$ is roughly equal to $C$. But $L+$ is *not* better than $C$. This violates the transitivity of "at least as good as." If $L+$ is better than $L$, and $L$ is at least as good as $C$, then $L+$ must be better than $C$. The vagueness account saves the trichotomy (better, worse, equal) only by sacrificing the transitivity of rational preference. Parity saves transitivity by expanding the relations.

  **Marcus:** That's a heavy price to pay for a new relation. You're saying we should rewrite the logic of preference rather than accept that "better than" has blurry boundaries? Look, Elena, you're assuming that "roughly equal" functions like a precise equation that tips over. But higher-order vagueness blocks that. There is no sharp boundary between the region where "equal" holds and the region where "better" holds. So there is no specific point where transitivity *fails*; it's just that the predicates don't apply. You're reifying the boundary itself.

  **Elena:** I'm not reifying the boundary; I'm reifying the *space* between the boundaries. Here's the charge I need you to answer: If it's just vagueness, then my struggle is epistemic. I'm waiting for the fog to lift. I'm waiting to discover whether $L$ is better or $C$ is better. But that's not what it feels like. It feels like I have to *make* it the case. Parity explains that. When two items are on a par, reason runs out, but rationality doesn't. I can exercise my normative power to create a reason through commitment. Vagueness leaves me paralyzed, waiting for a determinacy that isn't there.

  **Marcus:** That's the phenomenological pitch. But metaphysically, it looks like you're labeling our uncertainty "Parity" and calling it a discovery. You say parity allows for will-creation. I say vagueness allows for *permissibility*. If it's indeterminate whether $L$ is better than $C$, then it's permissible to choose either. You don't need a magical fourth relation to explain why I'm not irrational for picking Cello. The logic of vagueness already grants me that permission. So, what explanatory work is Parity actually doing? It looks like a synonym for "permissible indeterminacy."

  **Elena:** It's not synonymous. Permissibility is a deontic status; Parity is a comparative relation. If it's just vagueness, then strictly speaking, one option *is* better, or they *are* equal, we just can't say which. That implies there's a truth of the matter I'm missing. If I choose Cello, and it turns out Law was *actually* better (just unknowably so), did I make a mistake?

  **Marcus:** On the vagueness view, there is no "actually." That's the point. It's not epistemic uncertainty; it's ontic indeterminacy. The world hasn't settled it.

  **Elena:** But if the world hasn't settled it, and I choose Cello, did my choice settle it?

  **Marcus:** No. The value facts remain indeterminate. Your choice is just consistent with the indeterminate facts.

  **Elena:** There it is. That's why Parity is necessary. On your view, my choice is passive. It fits into the gaps. On my view, the Parity relation signals that the values are *commensurable*—they speak to each other—but they don't dictate an outcome. That gap is where agency lives. If I choose Cello, I make it true that Cello is the thing to do, not because the values shifted, but because I committed. Parity is the structural condition that makes commitment possible rather than merely capricious. If it were just vagueness, commitment would be a guess. If it's parity, commitment is an exercise of normative power.

  **Marcus:** You're smuggling in a very robust, almost existentialist notion of agency to solve a problem in value theory. I'm worried about the coherence of the relation itself. You say Parity is symmetric but not transitive. $A$ is on a par with $B$, $B$ is on a par with $C$, but $A$ could be better than $C$.

  **Elena:** Correct. That's chaining.

  **Marcus:** But if $A$ and $B$ are "in the same neighborhood" of value, and $B$ and $C$ are in the same neighborhood, how do we avoid $A$ and $C$ being in the same neighborhood? If Parity isn't transitive, it threatens to collapse the whole ordering of value. It makes the value landscape look like a series of isolated islands rather than a topography.

  **Elena:** The value landscape *is* fragmented. That's the insight of hard choices. We want a single metric—utility, goodness—that orders everything. Parity says: sometimes values are comparable without being rankable. The non-transitivity isn't a bug; it's the feature that captures the distinctness of different value spheres. Law and Cello are on a par. Cello and Teaching are on a par. But Law might be better than Teaching regarding security, while Teaching is better regarding meaning. Parity lets us hold those comparisons without forcing a global ranking.

  **Marcus:** But then Parity starts looking like "incomparability" with extra steps. If $A$ and $C$ aren't on a par, and aren't equal, and one isn't better... wait, no, you said $A$ could be better than $C$. So they are comparable. The issue is that Parity seems to do the work of "roughly equal" but insists it's not "equal." Why not just say the relation is "approximately as good as," and accept that "approximately" tolerates non-transitivity?

  **Elena:** Because "approximately as good as" implies there is a precise "as good as" that we are approximating. It implies a loss of precision. Parity implies no loss of precision because there was no precision to be had. It's not that we can't measure the difference; it's that there is no difference in value to measure, yet they aren't equal. Think of it like this: If $L$ and $C$ were equal, then a small improvement to $L$ *must* make $L+$ better. You agreed to that earlier.

  **Marcus:** I agreed only that eventually, a large improvement would. I deny that a *small* improvement must tip the scale if we are in a higher-order vague region.

  **Elena:** But the SIA relies on the intuition that if they were equal, *any* improvement breaks the tie. If you deny that, you're saying equality can tolerate small differences. But that's not equality; that's a range. And if it's a range, what relates the items within the range? "Vagueness" describes the predicate; "Parity" describes the relation between the items.

  **Marcus:** I think we're circling the same drain. You think Parity is needed to save the phenomenology of agency and the logic of improvement. I think Parity is an ontological inflation that solves a problem created by demanding too much precision from value predicates. You want a relation that holds between $L$ and $C$ such that $L+$ is not better than $C$. I say the relation is just that "Better than" does not apply.

  **Elena:** But "Better than" not applying is incomparability. And we agree they *are* comparable. I can reason between them. I can trade off.

  **Marcus:** Comparability doesn't require a positive relation. It just requires the absence of incomparability. Look, Elena, suppose I grant you Parity. What changes in the decision procedure? I still have to weigh the factors. I still feel the conflict. I still choose.

  **Elena:** It changes the justification. If I choose Cello under vagueness, I say, "It wasn't false that Cello was better." If I choose Cello under parity, I say, "Cello and Law were on a par, and I willed Cello into being the choice." The first is defensive; the second is constitutive.

  **Marcus:** Constitutive of what? The value of the career? Or just your preference?

  **Elena:** The reason. I create a reason that wasn't there before.

  **Marcus:** And that's where I balk. I can accept you create a *motive*. I can't accept you create a *normative reason* simply by choosing, unless the choice tracks a prior value. If Parity allows choice to create reason ex nihilo, it looks like voluntarism. If it doesn't, then the reason was already there, lurking in the vagueness.

  **Elena:** It's not ex nihilo. It's based on the Parity relation itself. The Parity relation invites the will.

  **Marcus:** "Invites." That's poetic. But technically? If the relation invites the will, is it a value property? If so, is it objective?

  **Elena:** Yes.

  **Marcus:** Then we have an objective property that is indeterminate yet not vague, that permits non-transitivity, and that triggers agency. It feels like you've built a machine to solve a problem that dissolves if we just accept that value concepts are fuzzy.

  **Elena:** And it feels like you're dissolving the agent to save the ontology. You'd rather have a fuzzy world than a world where my choice matters metaphysically.

  **Marcus:** I'd rather not posit a fourth relation unless the third relation is proven impossible. You haven't proven "roughly equal" is impossible. You've only proven it's uncomfortable for a certain kind of rational agency.

  **Elena:** And you haven't proven Parity is impossible. You've only proven it's expensive for a certain kind of metaphysics.

  *(Marcus puts the cap back on the marker. He looks at the whiteboard, where he's drawn a sorites heap next to a scale.)*

  **Marcus:** So we're left with a trade-off. Parsimony versus Phenomenology.

  **Elena:** Or, Metaphysics versus Normativity. You want the value facts to be clean, even if they're fuzzy. I want the rational activity to be robust, even if the relations are complex.

  **Marcus:** I suppose the seminar paper will have to reflect that we haven't settled whether the "hardness" is in the world or in the logic of our descriptions.

  **Elena:** Or whether the hardness is the point. If it were just vagueness, we'd wait it out. Because it's parity, we have to jump.

  **Marcus:** *(Smiling)* Well, I'm not jumping yet. I'll stick with the fog.

  **Elena:** Then you'll never get anywhere.

  **Marcus:** Or I'll get where I'm going without claiming I built the road.

  *(Elena slings her bag over her shoulder. They walk toward the door together, the whiteboard left with the unfinished diagrams.)*
