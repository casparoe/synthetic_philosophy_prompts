      *   *Idea 1: Ambiguity vs. Emptiness.* The music isn't empty; it's *rich* and *ambiguous*. Like a poem, it has multiple layers. Emptiness implies nothing is there. Ambiguity implies *too much* is there, allowing different entries.
      *   *Idea 2: Morphology of Emotion.* Music mimics the *shape* or *dynamics* of emotion, not the *cause*. Grief and deep love (weddings) share similar contours (longing, tenderness, vulnerability). The music captures the contour, not the specific story.
