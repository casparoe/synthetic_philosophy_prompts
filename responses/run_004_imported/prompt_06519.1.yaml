      *   **User's Intuition:** They don't believe the friend, but can't articulate why.
      *   **Goal:** Provide a more satisfying philosophical/psychological/aesthetic explanation for how abstract music can feel specific yet be versatile.

  2.  **Initial Assessment & Empathy:**
      *   *Crucial Step:* Acknowledge the loss. This isn't just an abstract philosophy question; it's rooted in personal grief. The tone must be compassionate, respectful, and validating.
