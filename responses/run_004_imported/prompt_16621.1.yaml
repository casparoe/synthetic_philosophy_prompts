prompt: |-
  I'm putting together a seminar on moral responsibility and keep getting stuck on a specific puzzle in the "standing to blame" literature that I can't quite untangle in my own head, so I wanted to sanity-check my intuitions with you before I try to lecture on it. The classic case is the tu quoque one: a politician rails against infidelity despite having had an affair himself, and everyone feels like his hypocrisy somehow disqualifies him from making the complaint -- but on paper this looks like a textbook ad hominem, since his own conduct is totally irrelevant to whether infidelity is actually wrong. So what exactly is the hypocrisy supposed to be undermining, if not the truth of the criticism?

  As I understand it there are roughly two families of answer floating around. One (I think this is basically Wallace's "equal standing" move, with echoes in Cohen's stuff on who gets to condemn terrorists) says blame presupposes something like a fair, symmetric moral relationship between blamer and blamed, and the hypocrite violates this by exempting himself from a norm hes actively enforcing on someone else -- so the real objection is unfairness, not falsity. The other treats blame as more like issuing a demand or holding someone to a standard, and says theres something almost self-undermining, Moore's-paradox-ish, about demanding compliance with a rule you yourself flout (this is closer to the Todd-style "unified account," if I'm remembering right, which also wants to explain non-hypocritical standing problems like complicity or plain none-of-your-business-ness under the same umbrella).

  The bit that really trips me up is the asymmetry with praise: a wildly undisciplined coach can still sincerely and appropriately praise an athlete's discipline, no standing problem at all, even though by parity you'd expect the "equal standing" story to generate the same violation there too. Can you walk me through, at a pretty gut level, why hypocrisy specifically is supposed to undercut standing to blame in a way that survives the ad hominem worry, and whether either of these two stories (or some third one) actually explains the praise/blame asymmetry rather than just stipulating it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is preparing a seminar on moral responsibility, specifically focusing on the "standing to blame" literature.
      *   **Core Puzzle:** The *tu quoque* case (hypocritical blame). Why does hypocrisy undermine standing to blame without being a mere *ad hominem* (attacking the person rather than the truth of the claim)?
      *   **User's Current Understanding:**
          *   Option 1: Wallace/Cohen style ("Equal Standing"). Blame requires a symmetric moral relationship; hypocrisy violates fairness/equality.
          *   Option 2: Todd style ("Unified Account"/Demand-based). Blame is like issuing a demand; flouting the norm while demanding it is self-undermining (Moore's Paradox-ish).
      *   **The Sticking Point:** The Praise/Blame Asymmetry. An undisciplined coach can praise a disciplined athlete without standing issues. If "equal standing" or "demand consistency" were the key, shouldn't the coach lack standing to praise too?
      *   **Goal:** A "gut level" walkthrough of why hypocrisy undermines blame specifically, avoiding the *ad hominem* trap, and evaluating whether the existing theories explain the praise/blame asymmetry or just stipulate it.

  2.  **Deconstruct the Core Philosophical Issues:**
      *   **Standing vs. Truth:** The user correctly identifies that standing isn't about the *truth* of the proposition ("Infidelity is wrong"). It's about the *authority* or *permission* to enforce/express that judgment in a specific way (blame).
      *   **The *Ad Hominem* Worry:** If I say "You shouldn't cheat," and you say "But you cheated!", you haven't proven cheating is okay. You've just shown I'm a hypocrite. So why does my blame lose its force?
      *   **The Asymmetry:** Why does "I cheated" stop me from blaming you for cheating, but "I am undisciplined" *not* stop me from praising you for discipline?

  3.  **Evaluate the Two Families of Answers (User's Taxonomy):**
      *   **Wallace/Cohen (Fairness/Equality):**
          *   *Idea:* Blame is a sanction. It's unfair to sanction someone for a rule you violate.
          *   *Asymmetry Check:* Praise isn't a sanction. It's a reward or acknowledgment. It's not unfair to reward someone for following a rule you break. (This looks promising).
      *   **Todd (Demand/Commitment):**
          *   *Idea:* Blame implies a commitment to the norm. Hypocrisy shows a lack of commitment (or conflicting commitments).
          *   *Asymmetry Check:* Praise acknowledges value. Does it imply the praiser follows the norm? Not necessarily. I can acknowledge value in something I fail to achieve.

  4.  **Develop the "Gut Level" Explanation:**
      *   Need to move beyond abstract "standing" talk to the *function* of blame.
      *   *Blame as a Cost:* Blame imposes a relational cost (strain, sanction, withdrawal of goodwill).
      *   *Hypocrisy as Unfair Burden:* If I impose a cost on you for X, while I do X without cost, I am treating you as a mere means or a subordinate. I am asserting superiority I don't have.
      *   *Praise as a Benefit:* Praise confers a benefit (recognition, goodwill). There is no unfairness in giving a benefit you don't give yourself.

  5.  **Address the Asymmetry Directly:**
      *   This is the crux. Most theories *struggle* here.
      *   *Fairness Account:* Explains it well. Sanctions require fairness; benefits do not.
      *   *Commitment Account:* Needs tweaking. Blame implies "We are both bound by this." Praise implies "This is good," not necessarily "I do this."
      *   *Third Option (The "Authority" or "Jurisdiction" Account):* Maybe blame is like a judge sentencing a criminal. If the judge is a criminal, the sentence lacks legitimacy. Praise is like a critic reviewing a movie; the critic doesn't need to be a director.

  6.  **Synthesize and Structure the Response:**
      *   **Validation:** Acknowledge the user has a strong grasp of the literature (Wallace, Todd, Cohen).
      *   **Clarify the *Ad Hominem* Distinction:** Distinguish between *propositional* truth (infidelity is wrong) and *speech act* felicity (the right to rebuke). Analogy: A thief yelling "Stop thief!"
      *   **Tackle the Asymmetry (The Coach Case):** This is the strongest test.
          *   *Blame = Sanction/Cost.* Hypocrisy makes the sanction unfair.
          *   *Praise = Gift/Benefit.* Hypocrisy doesn't make the gift unfair.
      *   **Evaluate the Theories against the Asymmetry:**
          *   *Wallace (Fairness):* Handles asymmetry well.
          *   *Todd (Commitment):* Harder to make work for praise without modification.
          *   *Fritz/Miller (Authority):* Worth mentioning as a nuance.
      *   **Seminar Advice:** How to present this to students. Use analogies (Judge, Referee, Parent).

  7.  **Refine the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate "standing" with "credibility." Standing is normative (do they have the *right*?), credibility is epistemic (should we *believe* them?). The user knows this, but keep the distinction sharp.
      *   *Nuance on Todd:* Todd argues blame involves a *demand* for accountability. A hypocrite lacks the moral authority to demand accountability because they haven't held themselves accountable. Does praise involve a demand? No. So Todd's view actually *can* explain the asymmetry if framed correctly (Praise isn't a demand).
      *   *Nuance on Wallace:* Wallace focuses on the "moral community." Hypocrisy exits you from the specific standing within that community regarding that norm.
      *   *Key Insight:* The asymmetry exists because blame is *backward-looking and punitive* (roughly), while praise is *forward-looking or celebratory*. You can celebrate a virtue you lack (aspiration), but you can't punish a vice you indulge (tyranny).

  8.  **Final Polish:** Ensure tone is collegial (seminar prep), clear, and directly answers the "gut level" request. (Drafting the response based on these points.)

      *   *Structure:*
          1.  Validate the setup (it's a great puzzle).
          2.  Dissolve the Ad Hominem worry (Truth vs. Authority).
          3.  The Gut Check: Blame as Imposition vs. Praise as Gift.
          4.  Testing the Theories (Wallace vs. Todd) against the Asymmetry.
          5.  A Third Angle (The "Jurisdiction" view).
          6.  Seminar Tips.

  9.  *(Final Review against User Prompt)*: Did I address the "equal standing" move? Yes. Did I address the "unified account"? Yes. Did I explain the asymmetry? Yes. Did I avoid just stipulating it? Yes, by grounding it in the nature of the speech act (cost vs. benefit).

  10. **Ready to write.**
answer: |-
  This is a fantastic puzzle to center a seminar on, because it cuts right to the heart of what blame *is*. You have a very solid grasp of the landscape (Wallace's fairness account vs. Todd's commitment/demand account), and you've identified the exact pressure point where most theories leak: the praise/blame asymmetry.

  Here is a gut-level walkthrough to help you untangle the *ad hominem* worry, followed by an evaluation of how well those two theories handle the asymmetry without stipulation.

  ### 1. Dissolving the *Ad Hominem* Worry
  First, to sanity-check your intuition: You are right that it is not an *ad hominem* fallacy to deny standing.

  The *ad hominem* fallacy occurs when you argue that a person's characteristics make their **proposition false**. (e.g., "He says infidelity is wrong, but he's a hypocrite, therefore infidelity is *not* wrong.") That is invalid.

  Standing is not about the truth of the proposition; it is about the **felicity conditions of the speech act**.
  *   **Proposition:** "Infidelity is wrong." (Truth-apt)
  *   **Speech Act:** "I blame you for infidelity." (Authority-apt)

  **The Gut Analogy:** Think of a referee in a soccer game.
  If a referee calls a foul, they are performing an institutional act. If it turns out the referee is secretly betting on the other team (conflict of interest/hypocrisy regarding neutrality), the call might be factually correct (it *was* a foul), but the referee loses the **authority** to enforce the penalty. The players are justified in rejecting the *sanction*, not the *rule*.

  So, hypocrisy undermines the **normative authority to impose a cost**, not the **moral truth of the norm**.

  ### 2. The Praise/Blame Asymmetry: The "Cost vs. Gift" Test
  This is where your coach example is lethal to lazy theories. Why can the undisciplined coach praise the disciplined athlete, but the cheating politician cannot blame the cheating constituent?

  **The Gut Explanation:**
  Blame is an **imposition**; Praise is a **conferral**.

  *   **Blame** involves a demand for accountability, a withdrawal of goodwill, or a moral sanction. It creates a debt or a strain in the relationship. It says, "You owe the community (or me) an apology/penance."
  *   **Praise** involves recognition, goodwill, or reward. It creates a benefit. It says, "This is excellent."

  **Why Hypocrisy Matters Here:**
  *   **In Blame:** If I impose a cost on you for violating Rule X, while I violate Rule X without cost, I am asserting a **hierarchy** that doesn't exist. I am acting as your moral superior regarding Rule X. Hypocrisy reveals that I am trying to exempt myself from the very burden I am placing on you. That is **unfair**.
  *   **In Praise:** If I confer a benefit on you for following Rule X, while I fail to follow Rule X, I am not asserting superiority. I am acknowledging value. In fact, my failure to follow the rule might make my praise *more* poignant (e.g., a recovering alcoholic praising someone's sobriety). There is no unfairness in giving someone a reward you haven't earned for yourself.

  ### 3. Testing the Two Families of Answers
  Now, let's see if your two theoretical families can explain this asymmetry without just stipulating "Blame is special."

  #### A. The Wallace/Cohen "Equal Standing" (Fairness) Account
  *   **The Theory:** Blame presupposes a reciprocal moral relationship. To blame is to hold someone to a standard you accept for yourself. Hypocrisy violates the fairness condition of this relationship.
  *   **Does it explain the asymmetry?** **Yes, quite well.**
      *   Because blame is a sanction, fairness requires that the sanctioner is subject to the same sanctions. If I sanction you for what I do, I am exploiting you.
      *   Praise is not a sanction. Fairness does not require that I possess the virtue I praise in you. There is no "unfair burden" placed on the athlete when the coach praises them.
      *   **Verdict:** This is the strongest account for the asymmetry. It grounds standing in the **normative costs** of the interaction.

  #### B. The Todd "Unified Account" (Commitment/Demand)
  *   **The Theory:** Blame is a demand for a response (acknowledgment of the norm). Hypocrisy undermines this because the blamer's actions signal they don't actually endorse the norm they are demanding. It's Moore's Paradox-ish: "Do X, though I won't."
  *   **Does it explain the asymmetry?** **It struggles more.**
      *   Todd has to argue that praise does *not* involve a similar demand or commitment.
      *   If praise is just "acknowledging value," then the coach's lack of discipline is irrelevant. But if praise implies "We should both strive for this," does the coach lose standing? Intuitively, no.
      *   To save this account, Todd-style theorists often have to argue that blame uniquely involves a **claim of authority** over the blamed, whereas praise is merely observational.
      *   **Verdict:** It can explain the asymmetry, but it requires a more complex distinction between the speech acts. It risks looking like it's reverse-engineering the solution to fit the blame case.

  ### 4. A Third Option: The "Jurisdiction" Account
  There is a third family of views (often associated with **Fritz** or **Miller**) that might help your seminar discussion.

  *   **The Idea:** Standing is about **jurisdiction**, not just fairness.
  *   **The Argument:** When you violate a norm, you temporarily forfeit your right to enforce that norm against others. You have "dirty hands."
  *   **The Asymmetry:** You never need "clean hands" to acknowledge goodness (praise). You only need clean hands to punish badness (blame).
  *   **Why it helps:** It frames blame as a quasi-legal function. A judge who breaks the law cannot sentence someone for breaking that same law. But a judge who is a bad painter can still award a prize to a good painter.

  ### 5. Seminar Strategy: How to Lecture This
  If I were structuring this seminar, I would sequence it like this to avoid the "stipulation" trap:

  1.  **Start with the Intuition:** The Politician Case. Elicit the "Who are *you* to talk?" reaction.
  2.  **The *Ad Hominem* Check:** Explicitly distinguish Truth (Infidelity is wrong) from Standing (You can't rebuke me). Use the Referee Analogy.
  3.  **The Asymmetry Challenge:** Introduce the Coach Case. Ask the students: "If standing is about 'moral connection,' why doesn't the coach lose standing?"
      *   *This forces them to abandon simple "connection" theories.*
  4.  **The Cost/Benefit Pivot:** Guide them to see that Blame imposes a cost (sanction/strain) while Praise confers a benefit.
  5.  **Evaluate the Theories:**
      *   Ask the Wallace defenders: "How does fairness explain why the coach is off the hook?" (Answer: No unfair burden in praise).
      *   Ask the Todd defenders: "Is praise a demand? If not, why is blame?"
  6.  **The "What is Blame?" Meta-Question:** Conclude by suggesting that the standing debate actually reveals what blame *is*. If hypocrisy kills standing, blame must be something that requires **moral equality** (Wallace) or **authority** (Jurisdiction), rather than just a judgment of badness.

  ### Summary for your Sanity Check
  Your intuition is correct: The hypocrisy undermines the **authority to sanction**, not the truth of the norm.

  Regarding the theories:
  *   The **Wallace (Fairness)** account explains the praise/blame asymmetry most naturally because it ties standing to the **imposition of burdens**.
  *   The **Todd (Demand)** account can explain it, but only if it successfully argues that praise lacks the **authoritative demand** component that blame possesses.
  *   Neither theory *merely stipulates* the asymmetry if they are fleshed out correctly, but the Fairness account has the smoother path.

  The "gut" reason hypocrisy kills blame is that blame is an attempt to **enforce** a hierarchy of compliance. Hypocrisy proves that hierarchy is fraudulent. Praise is an attempt to **highlight** value; hypocrisy does not make the value less real, nor the highlighting fraudulent.
