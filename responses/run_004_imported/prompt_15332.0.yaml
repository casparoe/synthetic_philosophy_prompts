      *   *Decision Theory:* This is the big one. NE and CE are compatible with Causal Decision Theory (CDT). Superrationality is the ancestor of Evidential Decision Theory (EDT) and Functional Decision Theory (FDT). In CDT, $P(\text{Opponent Cooperates} | \text{I Cooperate}) = P(\text{Opponent Cooperates})$. In Superrationality, they are linked.
      *   *The "Magic" Problem:* Game theorists (especially economists) dislike superrationality because it violates the "independence of actions" axiom unless explicitly modeled via communication. It assumes my choice *causes* (or logically necessitates) yours in a one-shot game without communication. To a physicist, this might look like entanglement, but in social science, it's seen as magical thinking.
