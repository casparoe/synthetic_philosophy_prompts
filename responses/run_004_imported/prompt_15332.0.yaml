answer: |-
  This is a profound question that cuts to the heart of how game theorists model agency, causality, and rationality. Given your background in theoretical physics, you will likely appreciate that the distinction is not merely semantic; it reflects a fundamental disagreement about the "causal structure" of decision-making.

  While it is true that both Correlated Equilibrium (CE) and Superrationality allow players to achieve payoffs outside the convex hull of Nash Equilibria (such as mutual cooperation in a one-shot Prisoner's Dilemma), game theorists treat them as distinct categories because they rely on incompatible assumptions about **where the correlation comes from** and **how decisions map to outcomes**.

  Here is the breakdown of why Superrationality remains non-standard, structured by the technical divergences from the Aumann framework.

  ### 1. The Source of Correlation: Exogenous vs. Endogenous
  **Aumann's Correlated Equilibrium** posits an **exogenous** correlation device.
  In a CE, there exists a probability distribution over strategy profiles (a "mediator" or "sunspot") that sends signals to the players. The players agree *ex ante* to follow the signal. Crucially, the correlation exists *outside* the players' reasoning processes.
  *   **Mathematically:** We expand the strategy space to include functions $s_i: S \to A_i$, where $S$ is the signal space. The joint probability distribution $P(a_1, a_2)$ is not required to factorize ($P(a_1)P(a_2)$), but the correlation is attributed to the variable $S$.
  *   **Physics Analogy:** This is classical correlation. Two particles are prepared in a correlated state by a common source, then separated. Measuring one does not influence the other; they simply reveal pre-existing correlations established by the source.

  **Hofstadter's Superrationality** posits an **endogenous** logical correlation.
  Superrationality claims that the correlation arises purely from the logical structure of the reasoning process itself, without an external signal. It asserts that because the players are identical rational agents facing an identical problem, their decision algorithms must output the same result.
  *   **Mathematically:** This implies a logical constraint $a_1 = a_2$ (in symmetric games) derived from the identity of the reasoning process, not from a shared random variable.
  *   **Physics Analogy:** This looks suspiciously like quantum entanglement or non-locality. It suggests that "choosing" an action here logically necessitates the action there, without a mediating field or prior common cause in the standard sense.

  **Why theorists object:** Standard game theory assumes **causal independence** of actions. In the Nash/Aumann framework, my choice is a free variable that cannot physically or logically force your choice in a one-shot game without communication. Superrationality violates this "independence of actions" axiom by treating logical implication as a causal link.

  ### 2. Decision Theory: CDT vs. EDT/FDT
  The deepest divergence lies in the underlying decision theory.

  *   **Standard Game Theory (Nash/Aumann)** is compatible with **Causal Decision Theory (CDT)**.
      In CDT, when I calculate my expected utility, I treat the other player's action as fixed (or probabilistically independent of my current volition).
      $$ \text{Maximize } \sum P(a_{-i}) U(a_i, a_{-i}) $$
      Even in Correlated Equilibrium, once I receive the signal, my action is conditionally independent of yours. I do not believe that *changing* my mind would change the signal or your action.

  *   **Superrationality** is an early formulation of **Evidential Decision Theory (EDT)** or, more accurately, **Functional Decision Theory (FDT)**.
      In this framework, I treat my decision as the output of a logical function. If I am rational, and you are rational, we are running the same function. Therefore, if I output "Cooperate," the function outputs "Cooperate" for you as well.
      $$ \text{Maximize } \sum P(a_{-i} | \text{I choose } a_i) U(a_i, a_{-i}) $$
      Here, $P(a_{-i} | \text{I choose } a_i) \neq P(a_{-i})$.

  **Why theorists object:** Most economists and game theorists view the CDT assumption as normative for rational agency. They argue that "logical dependence" is not a mechanism that can be exploited in a physical universe. To a standard game theorist, superrationality commits the "magical thinking" error: believing that wishing (or deciding) something makes it so for another independent agent.

  ### 3. Robustness and Common Knowledge
  Aumann's framework relies on **Common Priors**. If we share a prior and update on different information, we cannot agree to disagree. CE is robust to heterogeneity; we can have different payoff matrices or different signals, provided the incentive compatibility constraints hold.

  Superrationality relies on **Common Algorithms**. It is incredibly brittle.
  *   If I am 100% rational but I suspect you are only 99% rational (or that you define rationality differently), the logical link breaks.
  *   In the Nash/Aumann framework, I can model your irrationality as a probability distribution over your strategies.
  *   In Superrationality, if the logical identity is broken, the justification for cooperation collapses immediately back to Defect (Nash).

  Game theorists prefer models that are continuous and robust. Superrationality is discontinuous: it works perfectly with identical rational agents and fails completely with slightly heterogeneous ones.

  ### 4. Implementability
  Correlated Equilibrium is **implementable**. We can build a mediator, use a public randomization device, or observe market prices. It describes a mechanism that can actually be constructed in a social system.

  Superrationality is **metaphysical**. There is no mechanism to implement it other than hoping both agents read Hofstadter and accept the philosophical argument. It does not describe a social institution or a communication channel; it describes a specific epistemic stance. Since game theory is often used for mechanism design and institutional analysis, a concept that cannot be engineered is less useful.

  ### 5. The Modern Revival: Functional Decision Theory
  It is worth noting that your intuition is shared by a subset of researchers in computer science and decision theory (notably at MIRI and in some AI safety circles). They have formalized Hofstadter's intuition into **Functional Decision Theory (FDT)**.

  FDT explicitly models agents as source code. If Agent A and Agent B have similar source code, FDT dictates that A should reason that its output is logically linked to B's. In this specific subfield, Superrationality is not controversial; it is the correct solution for agents that can read each other's code (or in Newcomb-like problems).

  However, in **mainstream economics**, agents are not treated as transparent source code. They are treated as "black boxes" with preferences. Without the assumption of transparent logical structure, the superrational link cannot be established.

  ### Summary
  To a physicist, the distinction might feel like a distinction without a difference: both CE and Superrationality access a larger set of feasible payoff vectors than Nash Equilibrium.

  However, to a game theorist:
  1.  **CE** expands the **strategy space** (adding signals) while keeping **causal structure** standard.
  2.  **Superrationality** keeps the **strategy space** standard but alters the **causal/logical structure** of decision-making.

  Game theorists treat Superrationality as controversial because it requires accepting that logical implication can substitute for causal influence in the utility maximization calculus. Until there is a consensus that "logical causality" is a valid physical or social mechanism (perhaps in a world of AI agents with open source code), it will remain a fascinating philosophical footnote rather than a standard tool like Aumann's Correlated Equilibrium.
