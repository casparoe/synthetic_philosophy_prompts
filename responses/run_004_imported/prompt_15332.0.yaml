  2.  **Deconstruct the Concepts:**

      *   **Nash Equilibrium (NE):** Independent randomization. No communication. Each player maximizes utility given the *fixed* strategies of others. $P(A, B) = P(A)P(B)$.
      *   **Aumann's Correlated Equilibrium (CE):** Introduces a *correlation device* (external signal). Players observe a signal $s$ from a distribution $\mu(s)$. Strategies are maps $s \to action$. Incentive compatibility holds conditional on the signal. $P(A, B)$ can be correlated, but the correlation comes from an *external* source agreed upon *ex ante*.
      *   **Hofstadter's Superrationality:** No external device. Correlation arises from *logical identity*. "I am rational, you are rational, we face the same problem, therefore we choose the same action." It implies a causal or logical link between my decision and yours *without* communication or a pre-existing device. It treats the decision as a logical truth rather than a free variable.

  3.  **Identify the Key Distinctions (The "Why"):**

      *   **Source of Correlation:**
          *   CE: External mediator/signals (objective probability distribution).
          *   Superrationality: Internal logical deduction (subjective/epistemic identity).
      *   **Causal/Counterfactual Structure:**
          *   CE: Standard causal decision theory (CDT). My choice doesn't change yours, but we both respond to $s$.
          *   Superrationality: Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). My choice *implies* yours (logical dependence).
      *   **Common Priors vs. Logical Identity:**
          *   CE relies on Common Priors (Harsanyi/Aumann).
          *   Superrationality relies on "Common Algorithms" or "Logical Subjunctive Dependence."
