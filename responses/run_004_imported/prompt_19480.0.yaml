answer: |-
  This is one of the most persistent and uncomfortable tensions in intergenerational ethics. You are correct that the "Ramsey-Sidgwick" consensus (that a pure rate of time preference is ethically indefensible) dominates philosophical discourse. To defend the opposing view without smuggling in probability of extinction or economic growth requires digging into deeper claims about **moral reciprocity, political agency, and the ontology of the present.**

  Here is the strongest rigorous case for a positive pure rate of time preference (PRTP), constructed to meet your constraints, followed by the specific defense against the "space vs. time" objection.

  ### The Core Argument: Reciprocity and the Bounds of Moral Community

  The most robust defense of a positive PRTP rests on a **contractualist** or **relational** theory of obligation. This argument posits that moral duties are not free-floating abstract imperatives but arise from relationships of mutual accountability and shared agency.

  **1. The Argument from Asymmetric Causality**
  In a spatial context (distant contemporaries), causality is bidirectional. If I harm a person in another continent, they (or their agents, governments, or allies) can potentially retaliate, sanction, or demand restitution. We share a causal field. This mutual vulnerability creates a baseline of equality that grounds equal moral weighting.

  In a temporal context, causality is strictly unidirectional. We can affect the future, but the future cannot affect us. Future people cannot vote, protest, trade, or punish us. Because they lack leverage over us, they cannot be partners in a moral or political contract; they are merely beneficiaries (or victims) of our unilateral decisions.
  *   **The Defense:** A positive PRTP acknowledges this asymmetry. It is not a denial of the future's value, but an acknowledgment that obligations are strongest where relationships are reciprocal. To weight the claims of those who can hold us accountable (the present) equally with those who cannot (the future) is to ignore the structural reality of moral agency. We prioritize the present not because the future matters less *in itself*, but because the *relationship* is different.

  **2. The Argument from Ontological Priority (The "Realization" View)**
  This is a metaphysical argument. Well-being is not a static property like mass; it is an *experience*. An experience must be *lived* to have moral weight.
  *   **The Defense:** Present well-being is "realized"; future well-being is "projected." Even if we hold certainty constant (i.e., we know the future benefit *will* occur), it remains ontologically distinct from present experience. It has not yet entered the realm of actuality.
  *   A rational planner operates from the "moving now." To treat a future experience as identical to a present one is to adopt a "view from nowhere" (a God's-eye view) that no human agent actually occupies. Since ethics must be action-guiding for situated agents, it is rational to prioritize the *actual* over the *potential*, even if the potential is guaranteed. A positive PRTP is the mathematical recognition that human agents exist in time, not outside it.

  **3. The Argument Against the "Tyranny of the Future"**
  This is a structural argument about the sustainability of moral systems. If the PRTP is zero, and the future is infinite (or indefinitely long), the aggregate utility of the future is infinite.
  *   **The Defense:** Any finite sacrifice by the present generation, no matter how catastrophic (short of total extinction), could be mathematically justified to produce a marginal gain for the infinite future. This leads to what philosopher Richard Posner and others have called a "tyranny of the future," where the living generation is morally enslaved to hypothetical successors.
  *   A positive PRTP is not a "fudge" to avoid sacrifice; it is a **boundary condition** required for a coherent ethical system. It ensures that the present generation retains moral standing relative to the future. Without it, the present becomes a mere instrument for the future, violating the Kantian injunction that people should be treated as ends in themselves. The current generation are ends; they are not merely bridges to the future.

  ### Addressing the "Space vs. Time" Objection

  This is the critical pivot point. If discounting based on distance in time is ethical, why not distance in space? The defense relies on the distinction between **synchronicity** and **diachronicity**.

  **1. The Shared "Now"**
  Spatially distant people share the same temporal coordinate. They suffer, hope, and act *now*. Their interests are contemporaneous with ours. Temporally distant people do not share our "now."
  *   **The Distinction:** Moral urgency is tied to simultaneity. If a child is drowning in a pond next to me, I must act. If a child is drowning in a pond in Australia, I can wire money to help *now*. The transaction is synchronous. If a child will drown in 100 years, I cannot save them *now*; I can only alter conditions.
  *   **The Argument:** Discounting time is not about "distance"; it is about **presence**. Spatially distant people are present members of the moral community. Temporally distant people are future members. We owe duties to the community that currently exists. To treat future non-members identically to current members dissolves the boundary of the political community that makes collective action possible.

  **2. Epistemic Access and Feedback Loops**
  Even holding "uncertainty" fixed in your prompt's sense (i.e., assuming we *know* the outcome), there is a difference in **epistemic access**.
  *   **The Distinction:** With spatially distant people, if our model of their needs is wrong, they can correct us. They can communicate. There is a feedback loop. With future people, there is no feedback loop until it is too late.
  *   **The Argument:** A positive PRTP accounts for the **irreversibility of error** in temporal planning. Because we cannot course-correct based on feedback from the future, we must weight the known preferences of the present more heavily than the projected preferences of the future. This is not uncertainty about *whether* they will exist, but uncertainty about the *validity of our representation* of their interests. Spatial distance allows for correction; temporal distance does not.

  ### Summary for Your Readers

  To summarize the opposing case for your article, you might frame it this way:

  The defense of a positive pure rate of time preference does not rest on the claim that future people are less human, or that their happiness counts for less in a vacuum. Rather, it rests on the claim that **ethics is a practice embedded in time and community.**

  1.  **Reciprocity:** Moral obligations are strongest where mutual accountability exists. The future cannot hold us accountable; the present can.
  2.  **Agency:** The present generation are moral ends in themselves, not merely custodians for the future. Zero discounting risks reducing the living to instruments for the unborn.
  3.  **Presence:** Spatial distance separates people who co-exist and can interact. Temporal distance separates people who cannot interact. Discounting time acknowledges the moral significance of the "shared now."

  Proponents of this view argue that Ramsey's "ethically indefensible" label assumes a God's-eye view of the universe. From the human perspective—situated in a specific moment, within a specific political community, lacking feedback from the future—a positive discount rate is not a failure of imagination, but a recognition of the **limits of moral jurisdiction.** We govern the present; we can only steward the future. Stewardship implies a different, and necessarily lesser, weight than governance.

  ### Sources and Voices to Consult
  While most philosophers reject PRTP > 0, you may find nuanced defenses or discussions of these specific arguments in:
  *   **William Nordhaus:** He often defends higher discount rates on pragmatic grounds that touch on the "tyranny" argument.
  *   **Larry Summers:** Has controversially suggested that low discount rates imply absurd savings rates, touching on the "over-demandingness" problem.
  *   **Thomas Christiano:** Writes on democratic authority and why the *current* demos has priority.
  *   **Jacob T. Levy:** Has written on the limits of political theory when applied across generations.
  *   **Economic literature on "Hyperbolic Discounting":** Some behavioral economists argue that time preference is a rational feature of bounded agency, not a bug.

  This framing allows you to present the defense not as "greed" or "impatience," but as a coherent, albeit minority, philosophical position regarding the nature of moral community and political agency.
