      *   **Task:** Assess five specific argumentative moves/exempla used by Cato (the main speaker) in the dialogue.
      *   **Moves to Assess:**
          1.  "Appius" (Appius Claudius Caecus speaking against Pyrrhus).
          2.  "Sophocles" (Sophocles defending his competence via his poetry).
          3.  "Archytas" (Archytas on bodily pleasure).
          4.  "StageExit" (Life as a play, don't need to finish the last act).
          5.  "RipeFruit" (Death as natural ripening/falling of fruit).
      *   **Criterion:** Rank from strongest to weakest in *genuine argumentative force* against the specific complaint each answers. Not rhetorical vividness. An exemplum illustrating possibility < one giving reason to revise the complaint.
      *   **Output Format:** JSON object with "ranking" (list of strings) and "justification" (object with keys for each move).
      *   **Constraint:** Justify each placement in a sentence or two.

  2.  **Analyze the Five Moves in Context of *De Senectute*:**

      *   **Complaint 1: Old age withdraws us from active pursuits (negotia).**
          *   *Move:* "Appius" (Appius Claudius Caecus).
          *   *Context:* Cato uses Appius to show that old men can still guide the state through counsel (auctoritas) even if physical strength fails. Appius was blind and old but still influential.
          *   *Argumentative Force:* It's a counter-example to the claim that old age *necessarily* removes one from active life. However, it's an exceptional case (a famous statesman), not a general proof. It shows possibility, not necessity. But it directly addresses the specific complaint about political activity.

      *   **Complaint 2: Old age enfeebles the body/mind (corpus et ingenium).**
          *   *Move:* "Sophocles".
          *   *Context:* Responding to the claim that old age makes one mentally incompetent (like a bad steward). Sophocles wrote *Oedipus at Colonus* (or similar) in old age.
          *   *Argumentative Force:* Strong counter-evidence. It shows mental faculties can remain sharp. Like Appius, it's an exemplum of an exceptional figure, but it directly rebuts the claim of universal mental decline. It proves competence is possible despite age.

      *   **Complaint 3: Old age deprives us of physical pleasures (voluptates).**
          *   *Move:* "Archytas".
          *   *Context:* Cato argues this is actually a *benefit*, not a drawback. He quotes Archytas calling pleasure the "bane of life."
          *   *Argumentative Force:* This reframes the complaint entirely. Instead of saying "you still get pleasure," it says "losing pleasure is good." This is a philosophical pivot rather than just empirical counter-evidence. It attacks the value premise of the complaint. This is arguably very strong argumentatively because it changes the valuation.

      *   **Complaint 4: Old age is not far from death (mors proxima).**
          *   *Move:* "StageExit" (Life as a play).
          *   *Context:* We don't need to see the whole play to appreciate it.
          *   *Argumentative Force:* This is an analogy meant to comfort regarding the brevity of remaining life. It's somewhat weak argumentatively because it doesn't address the fear of non-existence, just the sense of completion. It's more consolatory than logical.

      *   **Complaint 5: Old age makes death desirable/natural (mors natura).**
          *   *Move:* "RipeFruit" (Nature ripening).
          *   *Context:* Death in old age is natural, unlike death in youth which is violent.
          *   *Argumentative Force:* This addresses the *fear* of death by naturalizing it. It argues that dying old is according to nature, making it less terrible. It's a Stoic/Peripatetic naturalistic argument. It's stronger than the Stage Exit because it appeals to natural teleology rather than aesthetic completion.

  3.  **Evaluate Argumentative Force (Strongest to Weakest):**

      *   *Criterion:* Does it give reason to revise the complaint, or just illustrate a possibility?
      *   *Archytas:* This is the strongest. It doesn't just say "old age isn't bad regarding pleasure," it says "the complaint is based on a false value system." It undermines the premise that pleasure is a good thing to lose. It transforms the complaint into a benefit.
