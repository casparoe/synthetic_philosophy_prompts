          3.  *Moral Error:* Our legal system is imperfect. Just because we allow fine substitution doesn't mean it's just.
          4.  *Nature of the Penalty:* Prison affects the *person* (liberty); fines affect *property* (external). Property is transferable; liberty is not.

  6.  **Evaluate "Which Holds Together Better":**
