prompt: |-
  ok so i was going down a philosophy rabbit hole and found out david lewis (yeah, the modal realism / possible-worlds guy) wrote this weird short paper asking whether we actually believe in penal substitution, like the christian idea that jesus got punished instead of sinners. instead of arguing theology directly tho, he mostly just points out that in normal criminal law nobody thinks a murderer's devoted friend should be alowed to serve his death sentence or prison time for him, but pretty much everyone's fine with a friend paying off someone's fine instead. can you compare what lewis is doing there to the standard retributivist view that punishment has to land on the guilty person specifically and cant just be handed off to an innocent substitute? does the fine "loophole" actually break retributivism, or is there some way for a retributivist to patch it up and still rule out real penal substitution? overall which picture do you think holds together better, lewis's kind of "two-minded" view or strict retributivism, and why?
