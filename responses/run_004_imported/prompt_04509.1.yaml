      *   *Observation:* This suggests our intuition about punishment isn't unified. We treat fines more like a debt/price than a punitive suffering.
      *   *Implication for Theology:* If penal substitution requires punishment to be non-transferable (like prison), then the doctrine is incoherent. If it's transferable (like fines), it might be coherent, but then is it really *punishment* or just a *cost*?
