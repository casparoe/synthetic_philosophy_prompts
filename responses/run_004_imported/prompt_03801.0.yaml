answer: |-
  The debate over multiple realizability (MR) constitutes one of the central fault lines in contemporary philosophy of mind. On one side stand Hilary Putnam and Jerry Fodor, who wield MR as a battering ram against mind-brain type-identity theory, using it to secure the autonomy of psychology and motivate functionalism. On the other stands Jaegwon Kim, who turns the argument on its head, suggesting that MR renders mental properties metaphysically suspect, thereby motivating "local reductions" that threaten the very autonomy Fodor seeks to protect.

  Below, I compare these two uses of the MR argument and assess whether Kim's local-reduction strategy successfully undermines the functionalist case for autonomy.

  ### 1. Putnam and Fodor: MR as the Basis for Autonomy

  Putnam's original argument was negative: it aimed to refute Type-Identity Theory. If pain is identical to C-fiber firing, then anything without C-fibers cannot feel pain. However, Putnam argued that creatures with vastly different physiologies (octopuses, Martians, silicon-based robots) could plausibly be in pain. Therefore, pain cannot be identical to any specific physical state-type.

  Fodor extended this into a positive argument for the **autonomy of special sciences** (like psychology). His argument rests on the nature of scientific explanation and laws:
  *   **Generalizations:** Psychology relies on generalizations (e.g., "Fear causes avoidance"). These generalizations hold across diverse physical implementations.
  *   **Heterogeneity:** Because the physical realizers of "fear" are heterogeneous (different neural structures in humans, different circuits in robots), there is no *single* physical law that covers all instances of fear.
  *   **Autonomy:** If we reduced psychology to neuroscience, we would lose the ability to state these general laws. We would be forced to write a separate law for every physical realization. Therefore, psychology must remain autonomous; mental kinds are functional kinds, defined by their causal roles, not their physical constitution.

  For Fodor, MR is the *proof* that mental properties are distinct from physical properties and that psychology captures causal patterns that neuroscience misses.

  ### 2. Jaegwon Kim: MR as the Basis for Local Reduction

  Kim accepts the premise of MR but rejects the functionalist conclusion. He argues that Putnam and Fodor misunderstand the metaphysical implications of MR. His critique centers on the **causal efficacy** and **projectibility** of multiply realized properties.

  *   **The Disjunction Problem:** If a mental property $M$ is realized by physical properties $P_1, P_2, P_3 \dots$, what is $M$? Kim argues $M$ is essentially the disjunction ($P_1 \lor P_2 \lor P_3 \dots$). In science, arbitrary disjunctions are not "natural kinds." They are not *projectible*—meaning they cannot figure in genuine causal laws. (Example: "Being jade" is not a natural kind because jade is either jadeite or nephrite; laws about jade must actually be laws about jadeite or laws about nephrite).
  *   **Local Reduction:** Kim argues that while *global* reduction (reducing $M$ to $P$ universally) fails due to MR, *local* reduction succeeds. We can reduce "pain-in-humans" to "C-fiber firing" and "pain-in-Martians" to "X-state."
  *   **The Threat to Autonomy:** If mental properties are just disjunctions of physical realizers, they have no independent causal power. The real causal work is done by the specific physical realizers ($P_1, P_2$, etc.). Consequently, the "autonomy" Fodor prizes is an illusion. Psychology is either a placeholder for a disjunction of local physical theories or it is eliminable in favor of those local theories.

  For Kim, MR does not save functionalism; it reveals that functional properties are not robust enough to support the causal laws Fodor claims they do.

  ### 3. Assessment: Does Kim Undermine the Functionalist Case?

  Kim's local-reduction strategy is metaphysically potent but explanatorily limited. Whether it "succeeds" depends on what kind of autonomy the functionalist is claiming.

  #### Where Kim Succeeds: Metaphysical Robustness
  Kim successfully exposes a weakness in "non-reductive physicalism." If mental properties are defined solely by their diverse realizers, it is difficult to explain what binds them together other than our linguistic conventions. If $M$ is just a disjunction of $P$'s, then $M$ lacks the unity required to be a fundamental natural kind.
  Kim forces the functionalist to admit that **causal closure of the physical** implies that the specific physical realizers are the primary causal agents. If one holds that only fundamental natural kinds can be causal, Kim wins: the global mental property is epiphenomenal, and only the local physical properties do the work. This undermines the "strong" ontological autonomy of psychology.

  #### Where Kim Fails: Explanatory Autonomy
  However, Kim's strategy fails to eliminate the *explanatory* necessity of psychology, which is the core of Fodor's autonomy claim.

  1.  **The Determinable/Determinate Model:** Critics (like Shoemaker and later Kim himself, to an extent) have noted that the relation between a functional property and its realizers resembles the relation between a *determinable* (e.g., "Red") and its *determinates* (e.g., "Scarlet," "Crimson"). "Red" is multiply realized by specific wavelengths. We do not say "Red" is an arbitrary disjunction that doesn't exist. We acknowledge that "Red" picks out a genuine similarity relevant to explanation (e.g., "The red light caused the driver to stop"). Similarly, mental states may be determinables that capture causally relevant features shared by their realizers, even if the realizers are physically distinct.
  2.  **Explanatory Loss:** Even if local reduction is metaphysically permissible, it is explanatorily disastrous. To explain why a human and a robot both avoid a fire, a local reduction requires two entirely different explanations (one involving carbon chemistry, one involving silicon circuits). A functional explanation ("Both detected heat and initiated avoidance protocols") captures a genuine pattern that the local reductions obscure. Science values unification; Kim's local reduction fragments explanation.
  3.  **Structural Similarity:** MR is rarely total chaos. Realizers often share structural or computational similarities (e.g., neural network topologies). If the realizers share a higher-order structure, the mental property tracks that structure. Kim's claim that $M$ is a *heterogeneous* disjunction assumes the realizers have nothing in common but the label $M$, which is an empirical assumption that may be false.

  ### Conclusion

  Kim's local-reduction strategy **succeeds in undermining the metaphysical claim** that mental properties are fundamental, irreducible natural kinds distinct from the physical order. He shows that if physicalism is true, the causal power resides in the local realizers.

  However, Kim **fails to undermine the functionalist case for explanatory autonomy.** The autonomy of psychology does not rest on mental properties being metaphysically magical; it rests on the fact that functional descriptions capture causal patterns that are invisible at the level of local physical description. Kim's local reductions are technically possible but pragmatically useless for the goals of psychology.

  Therefore, while Kim forces functionalists to retreat from strong ontological independence to a view where mental properties are "second-order" or determinable properties grounded in the physical, he does not succeed in showing that psychology should be eliminated or reduced in practice. The autonomy of psychology survives not as an ontological fortress, but as an explanatory necessity.
