      *   *Fodor's Extension:* Psychology deals with functional roles, not physical implementation. If we reduce psychology to neuroscience, we lose the generalizations that make psychology scientific (e.g., "Fear causes avoidance" applies to all fearful creatures, not just those with specific neural wiring).
      *   *Conclusion:* Mental kinds are *sui generis*. Psychology is autonomous from neuroscience. Reduction is impossible because the mapping is one-to-many.

  3.  **Analyze Kim's Position (The Local Reduction Case):**
      *   *The Challenge:* If a mental property $M$ is realized by $P_1$ in humans, $P_2$ in Martians, etc., what is $M$ itself?
      *   *Kim's Diagnosis:* $M$ looks like a disjunction ($P_1 \lor P_2 \lor P_3 \dots$). Disjunctions are not "projectible" (cannot support laws). If $M$ isn't a natural kind, it can't be in causal laws.
      *   *Local Reduction:* We can't reduce $M$ to *a* physical kind globally. But we *can* reduce $M$-in-humans to $P_1$, and $M$-in-Martians to $P_2$.
      *   *Consequence:* This fragments the mental kind. "Pain" isn't one thing; it's "Human-Pain," "Martian-Pain," etc.
      *   *Implication for Autonomy:* If psychology relies on generalizations across these disparate realizers, and those generalizations aren't underpinned by unified physical laws, do the mental generalizations hold? Kim suggests this leads to eliminativism or epiphenomenalism regarding the higher-level property *qua* higher-level.

  4.  **Compare the Two Uses of MR:**
      *   *Putnam/Fodor:* MR $\rightarrow$ Anti-Reduction $\rightarrow$ Autonomy. MR shows physical concepts are too narrow to capture mental concepts.
