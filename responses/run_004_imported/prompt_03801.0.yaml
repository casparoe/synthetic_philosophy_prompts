      *   *Strengths of Kim:* He hits the metaphysical weak spot of non-reductive physicalism. If the mental is multiply realized, what binds the realizers together other than the functional definition? If it's just the definition, is it causal? The "Disjunction Problem" is serious. Local reduction saves physicalism but sacrifices the *generality* of psychology.
      *   *Weaknesses/Counter-arguments:*
          *   *Shoemaker/Lewis:* Functional properties *are* real properties (second-order properties). They have causal powers in virtue of the realizers having powers.
