answer: |-
  This is a textbook case study for a seminar on practical reason. You have stumbled into one of the central debates in contemporary meta-ethics: the dispute between **Reasons Internalism** and **Reasons Externalism**.

  While the personal sting of the situation is real, philosophically, your friend has adopted a specific (and controversial) theoretical stance to justify his behavior. To determine who has the more defensible position, we need to map his argument onto the philosophical landscape and test its coherence.

  ### 1. The Friend's Position: Reasons Internalism
  Your friend is articulating a view most famously associated with **Bernard Williams** (in his paper *Internal and External Reasons*) and rooted in the **Humean Theory of Motivation**.

  *   **The Thesis:** For a consideration to count as a reason for an agent $A$ to $\phi$, it must be possible for $A$ to arrive at the conclusion to $\phi$ via a sound deliberative route starting from their "Subjective Motivational Set" (their desires, projects, commitments, and dispositions).
  *   **The Application:** Your friend argues that because the "promise" and the "friendship" no longer exist in his Subjective Motivational Set (he no longer cares about them), there is no sound deliberative route that leads to repayment. Therefore, he claims, the reason does not exist *for him*.
  *   **The Appeal:** This view respects the link between reasons and motivation. It explains why we often fail to act on reasons we don't "feel." It avoids positing "queer" objective values floating in the universe that compel us regardless of our psychology.

  ### 2. Your Position: Reasons Externalism
  Your intuition aligns with **Reasons Externalism** (defended by philosophers like **Thomas Scanlon**, **Derek Parfit**, and **Christine Korsgaard**).

  *   **The Thesis:** There are facts that constitute reasons for action independently of an agent's desires or subjective motivational set. The fact that "I promised" is itself a reason-giving fact.
  *   **The Application:** The obligation created by the promise exists objectively. Your friend's failure to care about it is a failure of *rationality* or *moral perception*, not a dissolution of the reason itself.
  *   **The Appeal:** This preserves the normativity of morality. It explains why we blame people for doing wrong even when they "didn't care." It prevents agents from "opting out" of obligations simply by altering their psychology.

  ### 3. Why Your Position is More Defensible
  While Internalism is a sophisticated philosophical position, your friend's specific application of it is vulnerable to several devastating objections. In the context of a seminar on practical reason, your intuition holds more water for the following reasons:

  #### A. The "Bootstrapping" Objection
  If your friend is correct, an agent can eliminate a reason for action simply by ceasing to care about the relevant value. This leads to the absurd conclusion that one can "bootstrap" oneself out of obligations through apathy.
  *   **The Problem:** If I promise to meet you for lunch, but on the way I decide I no longer care about promises or your time, Internalism suggests I no longer have a reason to show up.
  *   **The Externalist Rebuttal:** Reasons are not subject to voluntary control in this way. The reason was created by the *act of promising*, not by the *desire to keep the promise*. Allowing desires to dictate reasons makes normativity too fragile. As **T.M. Scanlon** argues, the reason lies in the expectations and reliance created by the promise, not in the promisor's current mood.

  #### B. Confusing Motivating Reasons with Normative Reasons
  Your friend is conflating two distinct concepts:
  1.  **Motivating Reasons:** The psychological states that actually move an agent to act (e.g., "I want to keep my friend happy").
  2.  **Normative Reasons:** The considerations that *justify* or *count in favor* of an action, regardless of whether the agent is moved by them (e.g., "It is right to repay debts").

  Your friend is correct that he lacks a *motivating* reason. He is not moved to pay you. However, he is incorrect to claim he lacks a *normative* reason. In a seminar context, you can argue that he is making a category error. He is describing his psychology, but trying to pass it off as a normative justification.

  #### C. The Rationality of Consistency
  Even if we grant a more sophisticated Internalism (like **Christine Korsgaard's**), your friend is still in trouble. Korsgaard argues that while reasons stem from our practical identities, we are committed to being consistent agents.
  *   **The Argument:** When he borrowed the money, he *did* care about the promise (otherwise he wouldn't have made it to secure the loan). To now say he doesn't care is to contradict his past practical identity.
  *   **The Defect:** A rational agent must will their maxims as universal laws (Kant) or maintain coherence in their practical identity. By arbitrarily shedding the commitment when it becomes inconvenient, he is acting irrationally, not just immorally. He is treating his past self's commitment as irrelevant, which undermines the coherence of his agency over time.

  ### 4. The Verdict
  **You have the more defensible position.**

  Your friend's argument relies on a crude version of Internalism that collapses the distinction between "I don't want to" and "There is no reason to." While Williams-style Internalism is a serious philosophical theory, it is generally understood that moral obligations (like promises) place constraints on the Subjective Motivational Set. You cannot simply delete a commitment from your set to escape the reason it generates.

  If his view were correct, moral discourse would be impossible. We could never criticize a sociopath, provided the sociopath honestly reported that they didn't care about harm. Since we intuitively believe the sociopath *does* have a reason not to harm (even if they are unmoved by it), Externalism (your view) offers a better account of moral reality.

  ### 5. Seminar Takeaways
  Since this is for your seminar, here are three angles you can explore in your papers or discussions based on this case:

  1.  **Williams vs. Parfit:** Contrast Bernard Williams' *Internal and External Reasons* with Derek Parfit's *On What Matters*. Parfit explicitly argues against Williams using cases very similar to yours (where agents claim they have no reason to avoid agony or keep promises).
  2.  **The Normativity of Rationality:** Look into **John Broome** or **Niko Kolodny**. They discuss whether rationality requires us to respond to reasons we have, even if we lack the motivation.
  3.  **Scanlon's Contractualism:** Read **T.M. Scanlon's *What We Owe to Each Other***. He argues that the reason to keep a promise is based on the principle that no one could reasonably reject. Your friend's principle ("I can break promises when I stop caring") is easily rejectable by you, the lender.

  ### A Personal Note
  Philosophically, you are on solid ground. Your friend is employing a "shameless" strategy that works only if we accept that reasons are entirely subservient to current desires.

  However, a word of practical wisdom: Winning the philosophical argument will not necessarily get your money back. Your friend has signaled that he does not value the friendship or the norm of promise-keeping. In the real world, a reason only functions as a reason if the agent acknowledges its force. You have established that he *ought* to pay you; he has established that he *won't*.

  For the seminar, champion the Externalist view. For your bank account, consider the money the cost of learning your friend's true theory of value.
