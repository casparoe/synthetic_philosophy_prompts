      *   *Holism (The Duhem-Quine Thesis):* Experiments test a whole web of beliefs, not a single hypothesis. If an experiment fails, you don't know which part of the web is wrong.
      *   *Anti-Realism about Atoms:* He rejected atomism because atoms were unobservable entities posited to explain phenomena. He preferred thermodynamics/energetics.
