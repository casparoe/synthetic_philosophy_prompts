answer: |-
  This is a fantastic problem to have. Most writers worry about plot holes; you're worrying about the metaphysical grounding of your crew's agency. That level of rigor usually translates into subtext that readers feel even if they can't name it.

  You are correct that the distinction isn't just semantic; it changes the *nature of the betrayal* when a crew member bails. Here is the substantive breakdown of the three positions, followed by how each dictates the drama of your "two minutes before go-time" scene.

  ### 1. The Substantive Differences: Where does the "We" live?

  The core disagreement is about **reductionism** and **normativity**.

  **Michael Bratman (The Architect): Reductive & Functional**
  *   **The View:** There is no "we" in the room. There are only five "I"s. Shared intention is just a specific structure of interlocking individual intentions. I intend that we $J$; you intend that we $J$; we both know this; and our sub-plans mesh.
  *   **The Metaphysics:** The "group" is a shorthand for a complex web of individual mental states. If you remove the individuals, the group vanishes.
  *   **The Obligation:** Obligations arise from **reliance**. If I change my mind, I frustrate your reliance on me. I owe you because I led you to depend on me, not because we formed a new entity.

  **John Searle (The Biologist): Primitive & Psychological**
  *   **The View:** Like Bratman, Searle denies a "group mind" existing outside our heads. *However*, he argues Bratman is wrong to reduce "We intend" to "I intend." "We-intention" is a primitive, biological state in the individual brain. I don't think "I intend + you intend"; I think "We intend."
  *   **The Metaphysics:** The "we" exists, but only as a specific mode of consciousness within each individual. It is irreducible.
  *   **The Obligation:** Obligations are internal to the content of the intention. If I stop "we-intending," I am not just changing a plan; I am altering my fundamental mode of engagement with the world. The betrayal is psychological discontinuity.

  **Margaret Gilbert (The Sociologist): Normative & Plural**
  *   **The View:** Gilbert goes the furthest. When we jointly commit, we create a **Plural Subject**. This isn't just a psychological state; it's a normative reality. The "Plural Subject" has authority over the individuals.
  *   **The Metaphysics:** A new entity *is* formed (metaphorically or socially real). You cannot unilaterally dissolve a joint commitment any more than a citizen can unilaterally dissolve their citizenship without consequence.
  *   **The Obligation:** Obligations are **sui generis** (of their own kind). They aren't just about reliance or feelings; the other members have a *right* to demand compliance. To quit is not just to disappoint; it is to violate the constitutive rules of the "us."

  ---

  ### 2. The Scene: The Bailout Two Minutes Before Go-Time

  Here is how the metaphysics changes the dialogue, the anger, and the stakes in your novel.

  #### If Bratman is Right (The Contractual View)
  *   **The Metaphysics:** The crew was never a "unit." It was a temporary alignment of five self-interested plans that happened to mesh.
  *   **The Betrayal:** The leaver is breaking a chain of reliance.
  *   **The Reaction:** The remaining four are angry because their *individual* plans are now ruined. They feel screwed because they invested resources based on her word.
  *   **Sample Dialogue:**
      > "You knew my whole plan relied on your position at the vent. You can't just change your mind now. I bought the gear *because* you said you were in."
  *   **Verdict:** She is breaking a promise. The others are owed compensation or an apology for the *damage caused*, but she has the right to quit. The group dissolves because the interlocking intentions no longer mesh.

  #### If Searle is Right (The Psychological View)
  *   **The Metaphysics:** The crew existed as a shared state of mind. They were mentally "coupled."
  *   **The Betrayal:** The leaver is severing a cognitive bond. She is shifting from a "We-mode" to an "I-mode."
  *   **The Reaction:** The remaining four feel a sense of *disorientation*. It's not just that the plan is broken; it's that the reality they were inhabiting together has collapsed. The anger is more existential. "How can you stop being part of this *us*?"
  *   **Sample Dialogue:**
      > "We're doing this. Not you and me. *We*. You can't just decide to be an 'I' again when the 'We' is already moving."
  *   **Verdict:** She is breaking the shared intentional state. It feels like a deeper betrayal than Bratman, but ultimately, she still controls her own brain. The group dissolves because the "We-intention" is no longer shared by all.

  #### If Gilbert is Right (The Plural Subject View)
  *   **The Metaphysics:** The crew is a single body (a Plural Subject). The individual members are organs of that body.
  *   **The Betrayal:** The leaver is committing treason, not just quitting. She is trying to unilaterally dissolve a bond that requires mutual rescission.
  *   **The Reaction:** The remaining four feel they have the **authority** to stop her. They aren't just hurt; they are *offended* on behalf of the Group. They have the *right* to rebuke her. In a thriller context, this justifies extreme measures to keep her in line.
  *   **Sample Dialogue:**
      > "You don't get to quit. We didn't agree to let you quit. You belong to this job now. If you walk, you're not just leaving us, you're breaking the pact that makes us us."
  *   **Verdict:** She is violating an obligation inherent to the group's existence. The group *persists* even if she tries to leave, and it can demand she return or face sanctions.

  ### 3. Which One Serves a Heist Novel?

  For a thriller, **Gilbert is your best friend**, but **Bratman is your reality check.**

  If you want high stakes and moral justification for the crew holding each other at gunpoint (metaphorically or literally), you want **Gilbert's Plural Subject**. It allows your characters to say, "You don't have a choice anymore," and have it be metaphysically defensible. The obligation isn't just "you promised," it's "you are part of this body now."

  However, if you want the tension to come from the *fragility* of the group, **Bratman** is better. It highlights that the "We" is an illusion maintained only by constant negotiation. If one person pulls their "I intend," the whole thing collapses. This creates anxiety.

  **Recommendation for your Draft:**
  Write the scene as if **Gilbert is true**, but have the characters *fear* that **Bratman is true**.

  The crew *wants* to believe they are a Plural Subject (Gilbert)—that they owe each other everything, that no one can bail, that they are a single entity. This justifies their loyalty. But the character trying to bail is arguing from **Bratman**: "I'm just me. I changed my mind. You relied on me, sorry, here's my cut, I'm gone."

  The conflict of the scene becomes a clash of metaphysics:
  *   **The Leader (Gilbertian):** "You can't leave. We are committed."
  *   **The Leaver (Bratmanian):** "I'm just a person. I'm opting out."

  This gives you a defensible metaphysical backbone for the emotional conflict. The tragedy isn't just that the heist might fail; it's that the "Plural Subject" they built is being reduced back to five scared individuals.

  ### Summary Table for Quick Reference

  | Feature | Bratman (Shared Cooperative Activity) | Searle (Collective Intentionality) | Gilbert (Joint Commitment) |
  | :--- | :--- | :--- | :--- |
  | **Is there a Group Mind?** | No. Just interlocking "I"s. | No. But "We" is a primitive mental state. | Yes (Plural Subject). A new normative entity. |
  | **Can I quit unilaterally?** | Yes (but owe reliance damages). | Yes (by changing mental state). | No (requires mutual rescission). |
  | **Nature of Obligation** | Moral/Prudential (based on reliance). | Psychological (based on shared content). | Normative (based on rights/authority). |
  | **If she bails...** | She breaks a promise/plan. | She breaks the shared mindset. | She commits treason against the "Us". |

  If you write the crew reacting as if she has committed **treason** (Gilbert), while she argues she is just **changing her mind** (Bratman), you will have a philosophically robust conflict that feels incredibly high-stakes.
