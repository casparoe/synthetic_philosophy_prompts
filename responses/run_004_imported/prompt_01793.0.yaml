  6.  **Final Polish:** Ensure the distinction between the *justification* of induction (Hume) and the *definition* of confirmable hypotheses (Goodman) is clear. (Hume: We can't justify it. Goodman: Even if we accept we do it, how do we distinguish valid from invalid predictions?)

  7.  *(Final Review against User Prompt)*:
