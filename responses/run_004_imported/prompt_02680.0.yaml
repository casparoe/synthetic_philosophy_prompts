answer: |-
  Your friend is right that this is Moore's Paradox, but her explanation ("it's absurd to assert") is the philosophical shorthand, not the mechanical reality. For a writer, that shorthand isn't useful because it doesn't explain *why* the machinery jams in one configuration but runs smoothly in the others.

  To fix the scene, you need to understand that the problem isn't logical; it's **performative**.

  Here is the substantive breakdown of why First-Person Present (FPP) breaks this specific sentence structure, while First-Person Past (FPPast) and Third-Person (3rd) do not.

  ### 1. Expression vs. Report
  The core mechanical failure lies in the difference between *expressing* a mental state and *reporting* on it.

  *   **Reporting:** "I believe that P." (This is a description of my internal weather.)
  *   **Expressing:** "P." (This is an act of engaging with the world.)

  In standard communication, when you assert a fact ("He is leaving me"), you are not just transmitting data; you are **expressing** your belief. To assert "P" sincerely *is* to manifest the belief that P. It is a speech act that functions as evidence of your mental state.

  **The Glitch in FPP:**
  When your narrator says, *"He's leaving me,"* she is currently **expressing** the belief. She is performing the act of accepting the reality.
  When she immediately adds, *"but I don't believe it,"* she is **reporting** on her belief state and denying it.

  In FPP, the "I" who speaks and the "I" who thinks are the same entity in the same nanosecond. You cannot simultaneously *perform* a belief (by asserting the fact) and *deny* holding that belief (by reporting on your mind). It creates a "sincerity condition" violation. It's like shouting "I am not shouting!" The content might be true (maybe you have a loud voice), but the act of saying it contradicts the content.

  **Why Past Tense Fixes It:**
  *"He was leaving me, but I didn't believe it."*
  Here, both clauses are **reports**.
  1.  "He was leaving me" is a report by the *current* narrator about a past fact.
  2.  "I didn't believe it" is a report by the *current* narrator about a past mental state.
  The "Narrating I" (who knows the truth) is distinct from the "Experiencing I" (who was in denial). There is no conflict because the Narrating I is not currently expressing the belief; she is recounting history. She can sincerely assert the past fact while sincerely reporting her past ignorance.

  **Why Third Person Fixes It:**
  *"He's leaving her, but she doesn't believe it."*
  Here, the subjects are different.
  1.  "He's leaving her" is asserted by the **Narrator**.
  2.  "She doesn't believe it" is a report about the **Character**.
  The Narrator believes it; the Character does not. There is no single consciousness trying to hold two contradictory stances at once.

  ### 2. The Transparency Condition
  Philosopher Gareth Evans described a mechanism called "Transparency." He argued that when we are asked, "Do you believe P?", we don't look inside our heads to find a belief-object. We look *outward* at the world to see if P is true.

  *   If I look outside and see rain, I answer "Yes, I believe it's raining."
  *   My access to my own belief is **transparent** to the fact itself.

  In FPP literary fiction, the reader is inside this transparency. We are looking at the world *through* the narrator's eyes.
  *   If the narrator says "He is leaving," she is looking at the world and seeing him leave.
  *   If she says "I don't believe it," she is claiming she *doesn't* see him leaving.

  In FPP, she cannot look at the world, see him leaving, and simultaneously claim she doesn't see it, because her vision *is* the narrative. In Past Tense or Third Person, there is a layer of mediation. The narrator can say, "Here is the world (he left), and here is how it looked to her (she didn't believe it)." In FPP, there is no "here is how it looked." There is only "here is what is happening."

  ### 3. The Authority Problem
  In FPP, the narrator has **privileged authority** over her own mind. If she says "I am in pain," she cannot be wrong. If she says "I don't believe he's leaving," the reader must accept that she doesn't believe it.

  However, she also has **observational authority** over the narrative present. If she says "He is packing his bags," that is the narrative truth.

  When she combines them ("He is packing... but I don't believe he's leaving"), she is claiming authority over the external fact while simultaneously revoking her own authority to process that fact. It forces the reader to ask: *Who is telling me he is leaving?*
  *   If *she* knows he is leaving enough to tell us, she believes it.
  *   If she *doesn't* believe it, she shouldn't be able to assert it as a narrative fact in the present tense.

  In Past Tense, the "Narrator" has the authority to tell us the fact, and the "Past Self" has the authority to be deluded. The authority is split across time. In FPP, the authority is concentrated in one point, causing a short circuit.

  ### How to Write the Scene (The Fix)
  You want the *effect* of denial without triggering the *paradox* of assertion. You need to separate the **Fact** from the **Endorsement**.

  In FPP, you cannot have the narrator assert the fact as absolute truth *and* deny believing it. You have to choose one lane, or blur the observation.

  **Option A: Blur the Observation (Keep the Denial)**
  Don't assert "He is leaving me" as an objective fact. Assert it as an interpretation she is resisting.
  *   *Instead of:* "He's leaving me, but I don't believe it."
  *   *Try:* "He says he's leaving. He's packing the car. But the words don't stick. They slide off the glass of the kitchen window. I watch him lift the suitcase, but my brain refuses to connect the lift to the departure."
      *   *Why this works:* You are reporting physical actions (packing, lifting) which are undeniable facts, but you are withholding the *conclusion* ("He is leaving") as a belief she hasn't accepted.

  **Option B: Somatic Denial (Bypass the Belief Report)**
  Moore's Paradox breaks when you explicitly report on the belief ("I don't believe"). It often works if you describe the *sensation* of disbelief without labeling it as a belief state.
  *   *Try:* "He is leaving me. I know the shape of the words, I hear the sound of the zipper closing, but my body is still set for dinner. My hands are washing the lettuce. There is a lag, a buffering error between the zipper and the lettuce."
      *   *Why this works:* You assert the fact ("He is leaving me"), but you don't follow it with "I don't believe it." You follow it with evidence of the dissonance. The reader infers the disbelief without you violating the sincerity condition of the assertion.

  **Option C: The "As If" Frame**
  Acknowledge the performance of the fact.
  *   *Try:* "By all accounts, he is leaving me. The evidence is stacked by the door. But to say I believe it would be to say I understand it, and I don't."
      *   *Why this works:* You attribute the fact to "accounts" or "evidence" rather than your own direct assertion, creating a tiny sliver of distance between the narrator and the fact.

  ### Summary
  The sentence breaks in FPP because **assertion is an act of belief.**
  *   **Past Tense:** Assertion is an act of *memory*. (Safe)
  *   **Third Person:** Assertion is an act of *observation*. (Safe)
  *   **First-Person Present:** Assertion is an act of *conviction*. (Unsafe if denied)

  To keep the FPP voice, stop telling us she doesn't believe it. Show us the world crashing into a mind that refuses to update its map. Don't say "I don't believe the wall is there." Say "I walked into the wall."
