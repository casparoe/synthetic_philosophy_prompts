      *   *Key Distinction:* The difference between *expressing* a belief and *reporting* a belief.
          *   "He is leaving" = Expresses belief.
          *   "I believe he is leaving" = Reports belief.
          *   Moore's paradox mixes an Expression with a Report that denies it.
      *   *Why Past Tense works:* "He was leaving" (Report of past fact) + "I didn't believe" (Report of past belief). Both are reports. No expression involved in the present moment.
