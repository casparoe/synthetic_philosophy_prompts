          *   *The Bullet:* Alex needs to admit that on his view, the King *could* theoretically hold a different commitment, making skepticism harder to block. Sam needs to admit that calling it "madness" relies on *our* bedrock, which is circular.
          *   *Refinement:* Let's make Alex bite the bullet on the King. If hinges are commitments, maybe the King *is* just different, and we can't prove him wrong, only exclude him. Sam bites the bullet on normativity: we can't justify our bedrock, we just stand on it.

      *   **Closing:** Bring it back to the Linguistics student's interest (Common Ground). Acknowledge the Stalnaker connection.

  4.  **Refining the Argument (Self-Correction during drafting):**
