prompt: |-
  So I'm a linguistics PhD student (semantics/pragmatics side, working on presupposition and common ground stuff, very Stalnaker-flavored) and I somehow got dragged into my housemate's Wittgenstein reading group because she keeps insisting that "common ground" is basically just a formalized version of what Wittgenstein was pointing at with "hinge propositions" in On Certainty. Fine, I'm hooked now, but the thing I can't get straight after three meetings is this specific fight that keeps recurring in the secondary lit between what the group calls the "it's-still-some-kind-of-commitment" camp (roughly Duncan Pritchard's line — hinges are a weird, sui generis propositional attitude, not belief exactly, arational because of the framework role they play, but still something you could say a person "holds") versus the "no, it's just animal certainty" camp (roughly Danièle Moyal-Sharrock's line — hinges aren't propositional attitudes at all, not held or entertained in any mental sense, they only show up in what you do, closer to knowing how to ride a bike than knowing that anything is the case). Everyone just quotes different OC section numbers at each other and it never quite clicks for me why this is supposed to matter so much, especially for what both sides want out of it, which is some kind of answer to the skeptic.

  Could you write me a dialogue between one proponent of each camp, having an actual argument rather than just each restating their own view? I want them to genuinely push on each others weak spots — I'd love it if they got into at least: what exactly Moore is doing wrong when he says "here is one hand" (is it that he's demanding justification for something arational-but-propositional, or that he's trying to assert something that was never proposition-shaped to begin with); how either view explains the fact that Wittgenstein's own river-bed can apparently shift over time, with old hinges going soft and new ones hardening into place, given that hinges supposedly aren't the kind of thing that responds to reasons; and that passage where Wittgenstein wonders whether a king could be raised from birth to believe the world began with him — whether calling that "mad" rather than merely "different" is something each view can actually earn, or whether it's just borrowed from ordinary epistemic vocabulary that neither camp is fully entitled to. Set it wherever's fun (a delayed train, the hallway after the talk, whatever), I just want two people who really know this material and at least one moment where somebody has to genuinely bite a bullet instead of just citing another paragraph of OC at each other.
