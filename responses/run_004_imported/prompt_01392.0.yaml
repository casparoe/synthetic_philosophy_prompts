          *   *Alex:* That sounds like relativism. If it's just causal drift, how is it normative?
          *   *Sam:* It's not normative in the justification sense. It's the bedrock of normativity.

      *   **Topic 3: The King (Madness vs. Difference).**
          *   *Alex:* If hinges are commitments, the King lacks a necessary commitment. He is epistemically broken.
          *   *Sam:* If hinges are action, the King cannot play the language game. He isn't "wrong"; he's unintelligible.
