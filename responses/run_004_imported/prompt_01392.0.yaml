          *   *Alex (Pritchard):* Moore is trying to justify the unjustifiable. He treats hinges as empirical knowledge. They are rational commitments, but arational.
          *   *Sam (Moyal-Sharrock):* No, Moore is making a category mistake. "I know" implies doubt is possible. Hinges aren't known; they are enacted. Saying "I know" turns a rule into a move in the game, which is nonsense.
          *   *Conflict:* Alex pushes on the fact that Wittgenstein *writes* them as propositions. Sam pushes back that grammar is misleading.

      *   **Topic 2: The River-Bed (Fluidity).**
