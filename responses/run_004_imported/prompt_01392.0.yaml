answer: |-
  **Setting:** *A train platform, 11:45 PM. The board has read "DELAYED" for forty minutes. A light rain is misting the canopy. ALEX (Pritchard-leaning) is pacing slightly. SAM (Moyal-Sharrock-leaning) is leaning against a pillar, scrolling through a PDF on their phone.*

  **Alex:** You know, when you said the reading group was going to be "lively," I assumed you meant people shouting about section 23. I didn't expect the whole room to fracture over whether "I know" is a verb or a grunt.

  **Sam:** *[Looks up]* It's not about the verb. It's about whether *On Certainty* is still doing epistemology or burying it. You guys want to save the concept of justification by carving out a special zone for hinges. We think Wittgenstein is showing you that the zone was never there to begin with.

  **Alex:** That's the Moyal-Sharrock line. "Enactivism." Hinges aren't propositions, they're actions. But look, if I say "The earth has existed for many years," that has propositional form. It enters into inferences. If I deny it, I contradict myself. If it's just "riding a bike," as you say, why does it look like a claim?

  **Sam:** Because grammar misleads us. That's Wittgenstein 101. Just because it looks like "I believe X" doesn't mean there's a mental state of believing X. When I reach for a door handle, I don't think "The door handle exists." I just reach. The certainty is in the reach. Your camp, Pritchard's camp, wants to say, "Okay, it's not knowledge, but it's a *commitment*. A sui generis attitude." But that's just epistemology panic. You're terrified of losing the propositional format because you think without it, you can't block the skeptic.

  **Alex:** I'm terrified of it because if hinges aren't commitments, if they aren't something we *hold*, then Moore wasn't making a category mistake when he held up his hands. He was just... grunting loudly?

  **Sam:** Moore was trying to *prove* the hinge. That's the error. He treated "Here is one hand" as a move *within* the language game of justification. But hinges are the scaffolding. You can't use the scaffolding to build the building. When Moore says "I know," he implies doubt is logically possible. But with hinges, doubt is empty. It's not that we're committed to them arationally; it's that they aren't the *kind* of thing you can be committed to. They are the background against which commitment makes sense.

  **Alex:** Okay, but let's push on the "arational" bit. This is where your view gets slippery. Wittgenstein talks about the river-bed. Hard propositions become fluid, fluid ones harden. If hinges are just "what we do," fine, practices change. But if they are commitments, even weird ones, how do they change? Do I get a *reason* to stop committing to "There is an external world"?

  **Sam:** No. You don't get a reason. The river bed shifts.

  **Alex:** *[Stops pacing]* See, that's the bullet I can't let you swallow easily. If the bed shifts without reasons, then it's causal, not normative. It's just history. But Wittgenstein is clearly worried about *madness*, not just difference. Think about the King. The one raised to believe the world began with him.

  **Sam:** Right. Section 92.

  **Alex:** Exactly. Wittgenstein asks: Would we say he is mad? Or just different? Now, on your view, if hinges are just enacted practices, the King just has a different practice. He enacts a world where he is the origin. Why is that "mad"? It sounds like you have to say, "Well, *our* practice says he's mad." But that's relativism. It borrows the normative force of "madness" from our local game and applies it globally.

  **Sam:** And what about you? On the Pritchard view, the King lacks a specific *commitment*. He fails to hold the arational attitude we hold. So you can say he's epistemically defective. But wait—if hinges are arational, if they don't respond to reasons, on what grounds do you call him defective? You're just saying, "He doesn't share our brute commitments." You're in the same relativist boat, Alex. You just painted it with analytic vocabulary so it looks like a life raft.

  **Alex:** *[Sighs, leans against the map board]* Ouch. Okay. Fair. But here's where I think I have to bite the bullet, and where you might be glossing over the cost. If I admit that hinges are commitments—even sui generis ones—I have to admit they are, in some sense, *ours*. We adopt them to make the system work.

  **Sam:** There it is. "Adopt."

  **Alex:** Not voluntarily. But functionally. And if that's true, then regarding the King... I have to admit that I can't prove he's wrong. I can only say that if he doesn't share this commitment, he can't play *our* game. He's excluded. The "madness" isn't an objective diagnosis of his mind; it's a boundary marker of our community.

  **Sam:** That's a big bullet for an epistemologist. You're conceding that the answer to the skeptic is essentially, "We don't talk to people who don't trust their hands."

  **Alex:** I'm conceding that the answer to the skeptic isn't a *proof*. It's a description of what we do. But that's where your view hits the wall for me. If hinges aren't propositions, if they aren't in the head, how do you explain the *feeling* of shock when a hinge breaks? When someone says, "Actually, I think the earth was created five minutes ago," I don't just see them acting differently. I feel a cognitive rupture. I want to say they are *wrong*.

  **Sam:** But "wrong" is the trap! You want to say they are wrong about a fact. Wittgenstein is saying they are outside the system where "fact" has traction. The shock you feel? That's not the sensation of detecting a falsehood. That's the sensation of the grammar breaking. It's like hearing someone use a noun as a verb in a way that makes no sense. You don't say they're "false"; you say they're unintelligible.

  **Alex:** But unintelligibility *is* a kind of failure. And if it's a failure, there's a norm. If there's a norm, there's a standard. Where does the standard come from if not from some kind of... I don't know, rational requirement?

  **Sam:** The standard comes from the form of life. Not a rulebook. A form of life. Look, think about your linguistics stuff. You like Stalnaker, right? Common ground?

  **Alex:** Sure. Mutually accepted propositions for the sake of conversation.

  **Sam:** Stalnaker treats common ground as a set of propositions we *accept*. A commitment. Wittgenstein is saying the real common ground isn't the set of propositions. It's the fact that we're standing on the same floor. You can update the common ground with new info. You can't update the floor. If the floor moves, you don't say the conversation failed. You say *we* fell.

  **Alex:** That's poetic, Sam. But let's go back to the River-Bed. Section 99. "The mythology may change back into a state of flux." If the floor is just "what we do," then when the mythology changes, it's just a new floor. But Wittgenstein seems to think some hardening is *better* than flux. He worries about the loss of certainty. If it's just enactive, why worry? Why not celebrate the flux?

  **Sam:** Because flux without any hardness makes action impossible. You can't ride a bike if the ground turns to water every second. The worry isn't that we lose "truth." It's that we lose the ability to act. The King who thinks the world began with him... he can't plan. He can't build. His "practice" is solipsistic paralysis. We call it mad because it leads to a dead end in acting, not because it violates a logical law.

  **Alex:** Okay. So the normativity is pragmatic.

  **Sam:** It's not even pragmatic in the sense of "useful." It's constitutive. You can't play chess if you move the rook diagonally. Is that a rule? Yes. Is it a proposition in your head? No. It's in the move. The King is moving the rook diagonally and calling it chess.

  **Alex:** *[The train announcement chimes, but the time remains blank]* So, on Moore. You think he's trying to move the rook diagonally?

  **Sam:** I think he's pointing at the board and saying "This is wood." While playing the game. It's irrelevant. It stops the game.

  **Alex:** And I think he's trying to show the skeptic that we *have* a board. But he's using a move *on* the board to prove the board exists.

  **Sam:** Which is why he fails.

  **Alex:** But here's my pushback. If I'm right, and hinges are commitments, then I can explain why Moore feels compelled to speak. He feels the commitment. He's just misdescribing it as knowledge. On your view, Moore is just confused by grammar. He's a victim of a picture.

  **Sam:** We're all victims of pictures. That's the point.

  **Alex:** But if we're all victims, then your "enactive" view is just another picture. You're saying, "Hinges are actions." That's a theoretical claim. You're doing the very thing you say Wittgenstein warns against. You're theorizing the untheorizable.

  **Sam:** *[Pauses. Looks at the rain.]* That... stings.

  **Alex:** Does it?

  **Sam:** It does. Because Moyal-Sharrock does write books. She makes arguments. If hinges are truly just shown in action, why are we arguing about them? Why isn't the reading group just... silently building something together?

  **Alex:** Exactly. If the commitment view is right, we can argue about the nature of the commitment. If the enactive view is right, this conversation is literally nonsense. We are trying to say what can only be shown.

  **Sam:** *[Smiles wryly]* So I'm in a performative contradiction.

  **Alex:** You're on a train platform talking about why talking is the wrong tool.

  **Sam:** Okay. I'll bite it. Maybe the "enactive" label is too theoretical. Maybe it's just a reminder to stop looking for the mental state. But you have to bite one too.

  **Alex:** Name it.

  **Sam:** If hinges are commitments, even arational ones, you have to admit that they are, ultimately, groundless. You can't justify the commitment without circularity. So when the King says the world began with him, you can't say he's irrational. You can only say he's *other*. You lose the right to call him epistemically bankrupt. He's just a neighbor with a different lease on reality.

  **Alex:** *[Long silence. The train light finally appears in the tunnel.]* I can live with that. Actually... I think I have to. If I say his commitment is "wrong," I'm pretending I have a view from nowhere. I don't. I have my hinges. He has his. The tragedy isn't that he's false. It's that we can't meet.

  **Sam:** And the tragedy on my view is that I'm standing here theorizing about how I shouldn't theorize, while the train is late.

  **Alex:** *[Chuckles]* So, common ground?

  **Sam:** For the next twenty minutes? Sure. We're waiting for the 11:55.

  **Alex:** That's a hinge I can commit to.

  **Sam:** Don't say you "know" it, Alex. Just get on the train when it arrives.

  **Alex:** Deal.
