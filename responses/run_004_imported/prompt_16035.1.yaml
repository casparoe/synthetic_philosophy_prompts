answer: |-
  This is a fantastic question because it cuts right to the heart of epistemology (how we know what we know) and Bayesian reasoning (how we update beliefs). You are right to separate this into two distinct problems: **(1) The reliability of the testimony** and **(2) The inference to the best explanation.**

  Your LessWrong-adjacent friends were actually practicing a form of intellectual humility by shrugging. They recognized that *not knowing the specific trick* does not equal *magic*. However, that can feel unsatisfying. Here is a principled way to untangle the two levels of your discomfort.

  ### Level 1: Evaluating the Testimony (Did it happen as described?)

  You noted that your friend is a credible witness: an actuary, skeptical, rational. Normally, testimony from a reliable source is good evidence. However, when evaluating anomalous claims, we have to account for specific failure modes that affect even the most rational people.

  **1. Memory is Reconstructive, Not Reproductive**
  Human memory does not work like a video camera. It works like a wiki page that gets edited every time you access it.
  *   **The Compression Effect:** A psychic reading is usually a 45-minute stream of consciousness containing dozens of vague statements, fishing expeditions, and misses. Over the course of a few weeks, the brain compresses this into a "highlight reel" of the hits.
  *   **Retrospective Coherence:** A statement like "I see an injury to the hand" is vague in the moment. If the grandfather lost a finger, the memory solidifies as "She said he lost a finger." Your friend isn't lying; her brain is optimizing the story for meaning.

  **2. The "Mom" Vector (Information Leakage)**
  This is the most critical variable. Your friend went *with her mom*, in *her mom's town*, to see *a local medium*.
  *   **The Network Effect:** Even with zero online footprint, small towns are high-bandwidth information networks. The medium might know the mom, or the mom's friends, or the grandfather's reputation.
  *   **Unconscious Signaling:** Even if the mom didn't speak, "Warm Reading" relies on micro-expressions. If the medium says, "He worked hard on the land," and the mom nods slightly or leans forward, the medium locks that in. "He had an accident... with machinery?" If the mom's breath hitches, the medium goes deeper. The friend might not notice the mom's reactions because she is focused on the medium.
  *   **Collusion (Benign):** Is it possible the mom wanted this experience to be real for her own grief processing? She might have provided more info beforehand than she admitted to her skeptical daughter, to ensure the "connection" felt real.

  **3. Base Rates and Specificity**
  "Old farm accident that cost him a finger" feels incredibly specific. But for a man of a certain generation in a rural area, the base rate of agricultural machinery accidents involving digits is actually quite high. It feels specific because it is *personal*, not because it is *statistically rare*.

  **The Bayesian Update on Testimony:**
  Should you update your priors? Yes, but slightly. You should update your belief that *your friend had a compelling experience* to near 100%. But you should not update your belief that *the events occurred exactly as objectively described* very much. The gap between "I felt she knew" and "She objectively knew information she couldn't access" is where the error lives.

  ### Level 2: Evaluating the Explanation (Does this imply Psychic Powers?)

  This is where your second nagging feeling is spot on. Even if we grant that the medium knew things she shouldn't, "Psychic Powers" is not the only alternative to "Fraud."

  **1. The Argument from Ignorance**
  The logical structure of the psychic claim is:
  *   Premise 1: The medium knew X.
  *   Premise 2: There is no *obvious* way she knew X.
  *   Conclusion: Therefore, she knew X via supernatural means.

  This is a classic *God of the Gaps* fallacy. "I cannot explain the mechanism" is not evidence for "Magic." It is simply evidence that "I do not know the mechanism." The mechanism could be:
  *   Hot reading (research done faster than you think).
  *   Cold reading (psychological techniques you aren't trained to spot).
  *   Information leakage (the mom).
  *   Coincidence (the law of truly large numbers: millions of readings happen; some will be hits).

  **2. The Prior Probability of Magic**
  In Bayesian terms, the prior probability of $P(\text{Psychic Powers})$ is vanishingly small. It contradicts our understanding of physics, neuroscience, and information theory.
  *   To overcome a very low prior, you need evidence with an extremely high Likelihood Ratio.
  *   Anecdotal testimony, even from smart people, has a low Likelihood Ratio because human error is common.
  *   To prove psychic powers, you need controlled conditions where information leakage is impossible, repeated over many trials. A single data point, no matter how striking, cannot overturn established physics.

  **3. The "Map vs. Territory" Distinction**
  Your friends in the rationalist community shrugged because they distinguish between the *map* (our understanding of the event) and the *territory* (what actually happened).
  *   They know their map is incomplete (they don't know the trick).
  *   But they know the *territory* of reality doesn't usually allow for magic.
  *   Therefore, they trust the *territory* (magic is unlikely) over the *map* (this specific story seems unexplained).

  ### How to Resolve the Nagging Feeling

  You aren't overthinking it; you are engaging in proper skepticism. Here is a framework to file this away:

  1.  **Accept the Experience, Question the Interpretation:** Your friend had a profound, meaningful experience. That is real. The *interpretation* that it was supernatural is the weak link.
  2.  **The "Black Box" Rule:** Treat the medium as a Black Box. Input: Grieving people. Output: Specific-sounding statements. We don't need to know the internal wiring (the trick) to know that the box doesn't contain a ghost. We know that similar boxes (magicians, mentalists) produce similar outputs without magic.
  3.  **The Cost of Belief:** If you update your priors significantly on psychic powers based on this, you must also update your priors on every other claim that relies on similar testimony (homeopathy, conspiracy theories, religious miracles). The mechanism of "trustworthy person saw weird thing" is the same for all of them. Consistency demands you treat them similarly.

  **Summary:**
  Your friend's credibility confirms she *believes* it happened. It does not confirm *how* it happened. The gap between "I can't explain this" and "It's psychic" is filled by human psychology, information networks, and probability. You can respect your friend's experience without updating your model of the universe. The "boring explanation" exists even if we can't name it specifically, because boring explanations are vastly more common than magic.
