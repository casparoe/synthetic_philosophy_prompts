  I'm a PhD student in philosophy currently serving as a teaching assistant for a graduate seminar on the metaphysics of propositions, and I would like help drafting a handout that compares strategies for blocking Bradley's regress in accounts of the unity of the proposition. Please sort the following six proposals into tiers based on how successfully each blocks the regress without simply stipulating the very unity it is meant to explain: Frege's appeal to the unsaturatedness of concepts; Russell's multiple-relation theory of judgment; the Tractarian idea that a proposition is itself a fact whose logical form is shown by the arrangement of its signs rather than said by any further sign; Armstrong's claim that a state of affairs involves a primitive, non-mereological mode of composition rather than a mere aggregate of a particular and a universal; the deflationary view, associated with Jeffrey King, that propositions simply are facts, so that their unity is just the unity any fact already has; and Hanks and Soames's act-based theory, on which unity is secured by the cognitive act of predication rather than by any further tie among static constituents. Use four tiers: S (genuinely dissolves the regress), A (blocks it, but only at a significant theoretical cost), B (makes real progress but leaves the core worry largely intact), and C (essentially relabels the problem rather than solving it). Please give your answer as a JSON object, with each tier mapping to an array of the relevant proposals (referred to by philosopher's name), formatted as follows:

  ```json
