      *Correction:* The money pump usually involves cycling between options $A, B, C$. If $A$ is "Shutdown now" and $B$ is "Shutdown later," and the agent is indifferent, a pump isn't obvious there. The pump arises if there are intermediate states.
      *Actually, the specific objection is:* If you have a gap between Length 5 and Length 10, and someone offers to switch you from 5 to 10 for \$1, then 10 to 5 for \$1... you lose money. To stop this, you must prefer 5 to 10 (or vice versa) OR prefer Status Quo to Change. If you prefer Status Quo, you resist shutdown (if shutdown is a change).
      *This is the killer point for the Friend.* If the sophisticated policy is "Status Quo Bias," then the agent resists shutdown. If the policy is not Status Quo Bias, it's vulnerable.

      *Wait, Thornley's counter:* The agent can have a policy "Do not make trades that exploit incompleteness" without having a preference over the lengths. But if the shutdown is initiated by the *operator*, is that a "trade"?
