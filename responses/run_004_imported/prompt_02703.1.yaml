      *   **Consensus:** The "sophisticated choice" defense is the standard counter to money pumps, but it comes at the cost of behavioral completeness. Whether this counts as "really" incomplete depends on whether you define preferences by internal state or revealed behavior. In AI safety (behavioral), the friend has the stronger point. In normative theory (internal), the user might hold ground.

