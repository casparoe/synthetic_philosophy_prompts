      *   **Thornley (2023/2024):** Argues incomplete preferences avoid shutdown resistance. Acknowledges money pumps. Suggests "trajectories of different lengths are incomparable."
      *   **Gustafsson (2022):** Argues that sophisticated choice makes the agent act *as if* preferences are complete.
