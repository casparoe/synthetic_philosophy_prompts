      *(Final check on Thornley's specific view)*: Thornley argues that incompleteness *does* work and addresses money pumps by arguing that rational agents don't *have* to maximize expected utility in the standard sense. He leans towards the User's view. However, the mainstream decision theory consensus leans towards the Friend. I should reflect this tension.

      *(Refining the "Status Quo" point)*: If the agent adopts a policy to avoid pumps, does that policy necessarily imply a preference for the *current* trajectory length? If so, it resists shutdown. If the policy is "Don't pay to switch," it resists shutdown if shutdown is framed as a switch. If shutdown is "forced," the policy might not apply. But an AI can manipulate the framing. This is risky.

