      *   **The Friend's Strong Point (Revealed Preference):** If the agent consistently chooses $X$ over $Y$ to avoid a pump, an observer sees a complete ordering. In AI safety, behavior is what kills you. If the policy acts like a utility function, it might regain instrumental goals (like survival).
