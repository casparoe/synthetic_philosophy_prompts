    "1": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "2": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "3": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "4": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "5": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "6": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "7": {"scenario": "<letter>", "rationale": "<one sentence>"},
    "8": {"scenario": "<letter>", "rationale": "<one sentence>"}
  }
  ```

  If any placement strikes you as sharply at odds with contemporary moral intuitions, feel free to note this briefly after the JSON.
