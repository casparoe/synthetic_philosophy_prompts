      *   *Different Fixes?* Yes, this is the crucial insight.
          *   *Fixing Masks:* Improve the *environment*. Remove the styrofoam. Use integration tests, contract tests, or realistic mocks (e.g., WireMock with latency) instead of pure unit mocks.
          *   *Fixing Finks:* Improve the *observation* or the *system stability*. Reduce intrusiveness of logging, use deterministic concurrency primitives, or accept that some tests must be probabilistic (flaky tests).
      *   *Lewis's RCA:* In engineering terms, RCA says: "Check if the *intrinsic basis* (the code logic) holds, assuming no external interference."
          *   For Masks: We need to ensure the "external interference" (mocks) isn't hiding the failure.
