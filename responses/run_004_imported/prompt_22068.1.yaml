          *   *Conditional Analysis:* Defining a disposition as "If $S$ (stimulus) happened, then $M$ (manifestation) would happen." (e.g., Fragile = If dropped, then breaks).
          *   *Finks:* Something that removes the disposition *just before* the stimulus occurs (e.g., Live wire that becomes dead upon touch). The disposition exists, but the conditional is false.
          *   *Masks:* Something that prevents the manifestation *despite* the disposition and stimulus (e.g., Fragile glass wrapped in styrofoam). The disposition exists, the stimulus occurs, but the conditional is false.
          *   *David Lewis:* Tried to fix the conditional analysis (Reformed Conditional Analysis).
          *   *C.B. Martin:* Credited with the fink examples.
      *   **User's Analogy:**
