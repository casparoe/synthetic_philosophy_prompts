  7.  **Final Polish:** Check the specific examples (Payment gateway mock = Mask, Debugger = Fink). Ensure the distinction between "fixing the code" and "fixing the test" is clear. (Actually, masks often require fixing the *test strategy*, finks might require fixing the *code's determinism*).

      *Wait, one nuance:* In metaphysics, the disposition is real. In engineering, the "disposition to crash" is a bug.
      *   Mask: Bug exists, test hides it.
      *   Fink: Bug exists, test removes it.
      *   Fixing the *engineering problem* means eliminating the disposition (the bug).
