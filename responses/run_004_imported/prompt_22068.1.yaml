          *   *Heisenbugs:* Disappear when debugging/logging is added. User compares this to a *fink* (property disappears upon stimulus/observation).
      *   **The Question:** What are the implications of the finks-vs-masks distinction (and Lewis's fix) for the *epistemic weight of a green test suite*? Do "fink-like" and "mask-like" failures require genuinely different engineering fixes, or is this just fancy vocabulary for ordinary testing problems?

  2.  **Deconstruct the Philosophy (Briefly & Accurately):**
      *   *Simple Conditional Analysis (SCA):* $x$ is disposed to $M$ in response to $S$ iff if $x$ were to undergo $S$, $x$ would $M$.
      *   *Finks:* The disposition is lost *before* manifestation due to the stimulus itself (or something triggered by it). $S$ causes $\neg D$, so $\neg M$.
      *   *Masks:* The disposition remains, $S$ occurs, but an interfering factor prevents $M$.
      *   *Lewis's Reformed Conditional Analysis (RCA):* Adds a "causal basis" clause. $x$ is disposed to $M$ in response to $S$ iff $x$ has some intrinsic property $B$ (basis) such that if $x$ were to undergo $S$ and $B$ were to hold throughout, $x$ would $M$. This tries to rule out finks (where $B$ doesn't hold) and masks (where external factors interfere).
      *   *Critique:* Even RCA has issues (reverse finks, etc.), but for the user's purpose, the *distinction* is more valuable than the ultimate metaphysical truth of RCA.

  3.  **Map Philosophy to Engineering:**
      *   *Disposition:* The code's intended behavior (e.g., "handles concurrent requests safely").
      *   *Stimulus:* The test input/environment condition (e.g., "high load," "real network latency").
      *   *Manifestation:* The expected outcome (e.g., "correct transaction," "no crash").
      *   *Mask:* The test environment prevents the bug from manifesting even though the bug (disposition to fail) exists.
