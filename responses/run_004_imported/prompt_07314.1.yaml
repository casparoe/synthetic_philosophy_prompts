answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, City Supportive Housing Coalition
  **FROM:** Prioritization Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Recommendation: Vulnerability Score Cutoffs and Gender Disparity

  **Executive Summary**
  The Prioritization Committee recommends **against** implementing sex-specific score cutoffs for supportive housing allocation. Instead, we recommend maintaining a single score threshold while immediately implementing a **"Critical Safety Override"** protocol. This protocol grants priority status to individuals with documented high-severity safety risks (e.g., survivors of trafficking, severe domestic violence, pregnancy-related risks) regardless of their numerical vulnerability score.

  This approach addresses the underrepresentation of women in the top-priority tier without violating federal non-discrimination statutes or jeopardizing funding compliance.

  **Context and Problem Statement**
  Our current vulnerability model is statistically calibrated: a score of 85 predicts the same probability of mortality or ER admission for a man as it does for a woman. However, because women experiencing homelessness have a lower base rate of these specific medical outcomes than men, fewer women reach the high-score threshold required for priority housing.

  Outreach partners confirm that unsheltered women face acute risks (violence, exploitation, rapid health deterioration) that are not fully captured by a model weighted toward mortality and ER usage. Consequently, the current single-cutoff system creates a disparate impact, excluding high-risk women who are equally deserving of intervention.

  **Analysis of Options**

  **1. Adopt Sex-Specific Cutoffs (Rejected)**
  *Proposal:* Lower the priority threshold for women to achieve demographic parity.
  *Risk:* While this corrects the statistical disparity, explicit sorting by sex for government-funded benefits presents significant legal liability under the Fair Housing Act and Equal Protection principles.
  *Impact:* If challenged, this practice could jeopardize not only this specific program but the Coalition's broader funding stream. It also risks undermining public trust by appearing to manipulate data to hit quotas rather than assess risk.

  **2. Maintain Status Quo (Rejected)**
  *Proposal:* Keep the single cutoff and accept the gender disparity.
  *Risk:* This fails our ethical mission. We are systematically denying housing to women who outreach workers identify as critically vulnerable, simply because their vulnerability manifests differently than men's.
  *Impact:* Continued preventable harm to women on the street and erosion of trust with outreach partners.

  **3. Single Cutoff + Critical Safety Override (Recommended)**
  *Proposal:* Retain the single vulnerability score cutoff to ensure compliance, but add a qualitative bypass mechanism. Applicants with specific, documented safety risk factors receive automatic priority tier placement.
  *Rationale:* These risk factors correlate strongly with the female population but are not defined by sex. This captures the missed high-risk women without explicit sex-based sorting.
  *Impact:* Aligns allocation with actual risk on the ground while maintaining legal defensibility.

  **Implementation Plan & Timeline**

  *   **Immediate (Week of Nov 6):** Committee to finalize the criteria for the "Critical Safety Override." Criteria will include documented history of sex trafficking, recent severe domestic violence, or third-trimester pregnancy without shelter.
  *   **Short-Term (Week of Nov 13):** Outreach teams trained on documenting these override qualifiers during intake.
  *   **Medium-Term (Jan 1, 2024):** Full implementation of the Override Protocol alongside the existing vulnerability score.
  *   **Review (March 1, 2024):** Committee to review allocation data. If gender disparity persists despite the Override, we will commission a third-party legal and statistical audit to explore further model recalibration.

  **Decision Requested**
  We request Board approval to adopt the **Single Cutoff + Critical Safety Override** model effective January 1, 2024. This decision allows us to act immediately to protect at-risk women while safeguarding the Coalition's compliance standing and long-term funding security.

  **Signed,**

  [Your Name]
  Chair, Prioritization Committee
