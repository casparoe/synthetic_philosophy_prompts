  ### The Case of the Somatic Lock

  **The Setup**
  Elara stands in the control gallery of a deep-sea habitat. A catastrophic pressure breach is imminent in Sector 4. To save the rest of the station, Sector 4 must be jettisoned immediately, killing the twelve people inside. If it is not jettisoned, the breach will cascade, killing all two hundred souls on board.

  **The Action**
  Elara places her hand on the manual release lever. She feels no conflict. She believes jettisoning the sector is the only moral choice. She pulls the lever. Sector 4 is severed. The station is saved.

  **The Unseen Contingency**
  Unbeknownst to Elara, her superior officer, Commander Vance, is hidden in the shadows of the gallery behind her. He is not watching her face or her hands; he is watching a biometric feed from the lever itself. The lever is equipped with a "Somatic Lock."

  The Lock measures micro-tremors and galvanic skin response. It is calibrated to Elara's specific physiology. It knows that when Elara is *resolute*, her grip is steady and her skin conductivity is low. When she is *hesitant* or *conflicted* (even if she tries to hide it), her body betrays her with involuntary micro-tremors and a spike in sweat.

  **The Contingency Plan**
  Vance has his own weapon trained at the hydraulic mechanism of the lever.
  1.  **If Elara pulls the lever steadily (Resolute):** Vance does nothing. Elara acts on her own.
  2.  **If Elara hesitates (Tremor detected):** The Somatic Lock signals Vance. He immediately shoots the hydraulic mechanism, forcing the lever down and jettisoning the sector.
  3.  **If Elara refuses (Hand removed):** The Somatic Lock signals Vance. He shoots the mechanism, forcing the lever down.

  **The Outcome**
  Elara pulls the lever steadily. Vance never fires. The sector is jettisoned. Later, the crew learns of Vance's presence and the Somatic Lock. They still hold Elara fully responsible for the deaths in Sector 4.

  ***

  ### Why This Shuts Off the "Flicker" Escape

  The standard "Flicker of Freedom" rebuttal argues that even in Frankfurt's original case, the agent (Jones) retains the power to *initiate* the intervention (e.g., by choosing to frown or show the prior sign). Because Jones could have chosen to trigger Black's intervention, he technically had an alternative possibility, preserving the Principle of Alternate Possibilities (PAP).

  My "Somatic Lock" case blocks this route for two specific reasons:

  **1. The Sign is Non-Volitional**
  In the classic case, the "sign" (a frown, a neural pattern) is often treated as something the agent *does*. In this scenario, the sign is an **involuntary physiological byproduct** of hesitation. Elara cannot *choose* to tremble any more than she can *choose* to digest food. She can only choose actions that might *result* in trembling.
  *   *The Critic's Objection:* "She could have tried to make herself hesitate."
  *   *The Block:* Hesitation is not an action; it is the *absence* or *fracturing* of a decision. One cannot voluntarily "decide to be undecided." To successfully trigger the tremor, she would actually have to *be* hesitant. If she is truly resolved to act (as she is in the actual sequence), she physically cannot produce the sign. There is no "thin" voluntary action available to her that triggers the intervener without actually changing her mental state.

  **2. The Blockage of Robust Alternatives**
  Even if a critic argues that the *thought* of hesitating is a flicker of freedom, this case employs a "Blockage" strategy. The alternative possibility (triggering Vance) leads to the **exact same outcome** via a causal chain that bypasses her agency entirely.
  *   In many FSCs, the agent can argue, "If I had wavered, *I* wouldn't have done it; *Black* would have." This preserves a sense of "I could have been innocent."
  *   Here, the Somatic Lock ensures that if she wavers, the mechanism is forced *through her hand* (or the lever she is touching) in a way that makes the physical act indistinguishable from her own. But more importantly, the narrative stakes remove the "robustness" of the flicker. The "choice" to tremble is not a choice to save the twelve people in Sector 4; it is merely a choice to change *who* moves the lever. Since the death of the twelve is inevitable once she enters the gallery (either by her hand or Vance's bullet), the flicker is too insubstantial to ground moral exoneration.

  By making the trigger **involuntary** and the outcome **causally pre-empted** by the environment rather than a waiting agent's *choice*, you remove the space where a critic can claim she "could have done otherwise" in any meaningful sense. She had no control over the sign, and no control over the outcome once she stepped into the room.
