answer: |-
  This is actually a classic philosophical problem that law students and metaphysicians argue about all the time. Your friends stumbled into a debate about **omissive causation** (can doing *nothing* cause something?) and the difference between **causal responsibility** (physics/logic) and **moral responsibility** (duty/blame).

  Here is the move-by-move breakdown of who is winning the logic at each step, followed by the big concept they are both missing.

  ### The Move-by-Move Breakdown

  **Move 1**
  *   **Alex:** "If she'd clicked submit... we'd have passed, so thats literally what made the difference."
  *   **Nora:** "Not clicking a button isnt an event... the deadline closing is what caused it."
  *   **Who has the point?** **Alex.**
  *   **Why:** Alex is using the **"But-For Test"** (Counterfactual Dependence). This is the standard standard for causation in science and law. *But for* Mia's inaction, the zero would not exist. Nora is arguing from a **Process Theory** of causation (cause requires energy transfer or a physical event). While philosophically interesting, in the real world, we treat failures to act as causes all the time (e.g., a lifeguard drowning a swimmer by *not* swimming). Nora's claim that the deadline caused it is weak; the deadline is a *condition*, not the *cause*. The cause is the missing submission.

  **Move 2**
  *   **Alex:** "If 'would this still have happened without it' is the test... Mia fails that test."
  *   **Nora:** "Wait, but then literally everyone in the group had the link... so by that logic we all 'caused' the zero."
  *   **Who has the point?** **Nora.**
  *   **Why:** Nora just trapped Alex in the problem of **Omissive Overdetermination**. If causation is just "anyone who could have stopped it but didn't," then the teacher caused the zero (she could have extended the deadline), the IT guy caused the zero (he could have fixed the portal), and you caused the zero. This leads to **Causal Inflation**, where everything is a cause, which makes the word "cause" useless. Alex's logic holds up mathematically, but Nora shows it breaks down practically.

  **Move 3**
  *   **Alex:** "No, because it was specifically Mia's job... thats the whole reason its on her."
  *   **Nora:** "Now the reason its 'her cause' isnt actually about cause and effect anymore, its about whose job it was... maybe 'Mia caused the zero' isnt even literally true."
  *   **Who has the point?** **Tie (They are talking past each other).**
  *   **Why:** Alex has pivoted from *metaphysics* to *norms*. He is admitting that pure physics/logic isn't enough to assign cause; you need a rule system (the group agreement). Nora correctly identifies that Alex has changed the definition of "cause." She is right that "Mia caused this" is becoming shorthand for "Mia is to blame." Alex is right that without that distinction, we can't function socially.

  **Move 4**
  *   **Alex:** "Someone has to actually be responsible for it... that zero came from somewhere."
  *   **Who has the point?** **Alex (Pragmatically).**
  *   **Why:** Alex is arguing for the **Principle of Agency**. In human systems, we require a causal agent to make sense of outcomes. If we say "no one caused the zero, it just happened," the system breaks. We *need* to assign causation to an agent to learn and correct behavior.

  ---

  ### The Missing Piece: What they are both missing

  Both Alex and Nora are stuck because they are using the word **"Cause"** to mean two different things at the same time. They are missing the distinction between **Cause-in-Fact** and **Proximate Cause**, and the role of **Normality**.

  Here is the synthesis that resolves the debate:

  **1. The Ontology of Omissions (Nora's worry)**
  Nora is technically right that "nothing" isn't a physical event. In physics, an omission doesn't transfer energy. However, in **human systems**, omissions *are* treated as events. This is called **Negative Causation**. If a doctor fails to give a life-saving drug, we say the doctor "killed" the patient, even if the disease was the physical cause of death. So, Nora is right about physics, but Alex is right about human reality.

  **2. The "Normal Condition" vs. "Abnormal Intervention" (The Solution)**
  This is the concept that solves Nora's "everyone had the link" problem. Philosophers H.L.A. Hart and Tony Honoré argued that we select the cause based on what is **abnormal**.
  *   **Background Condition:** The deadline passing, the internet working, the other group members *not* submitting. These are "normal" or "expected" states.
  *   **Abnormal Intervention:** Mia *agreeing* to submit and then *not* doing it.

  The reason Mia caused the zero and the rest of you didn't isn't just because she *could* have submitted (like Nora said, you all could have). It's because **her not submitting was a deviation from the expected plan, while your not submitting was part of the expected plan.**

  **3. Causal Responsibility vs. Moral Responsibility**
  *   **Alex** is arguing for **Moral Responsibility** (Who do we blame?).
  *   **Nora** is arguing for **Metaphysical Causation** (What physically occurred?).

  **The Verdict:**
  *   **Alex is right** that Mia is the cause *in the context of the group agreement*. In social contexts, causation is normative. If you are the designated submitter, your omission is the "active" cause of failure.
  *   **Nora is right** that strictly speaking, the zero was caused by the *absence of a file in the portal*, not by Mia's brain state. She is also right that Alex switched from talking about physics to talking about duties.

  **How to resolve the debate for your friends:**
  Tell them they are both right, but they are playing different sports.
  *   **Alex** is playing **Law/Ethics**: In this game, omissions count as causes if there is a **duty of care**. Mia had the duty, so her omission is the legal cause.
  *   **Nora** is playing **Physics/Metaphysics**: In this game, only positive actions count as causes. The "cause" was the server closing the upload window.

  **The "Actually True" Answer:**
  Mia is the **Proximate Cause** (the responsible agent), but the **Cause-in-Fact** was the combination of the deadline passing + no file being present. We single out Mia not because she is the *only* physical cause, but because her inaction was the only **normatively relevant** variable.

  So, Alex wins the argument on who gets the blame, but Nora wins the argument on the strict definition of physical causation. The zero exists because of the deadline, but it exists *on your record* because of Mia.
