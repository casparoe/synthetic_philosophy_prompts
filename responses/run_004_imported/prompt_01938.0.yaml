      *   **5. Forward Induction / Rationalizability (Battigalli, etc.):**
          *   *Pros:* Takes the deviation seriously. If P1 cooperates, P2 infers P1 plans to cooperate later to justify the move.
          *   *Cons:* Can lead to multiple equilibria.
