answer: |-
  You are exactly right to be skeptical of the compressed folk summary. The "Utilitarianism falls out for free" narrative obscures significant ethical assumptions hidden in the mathematical premises, specifically regarding the **sign** of the weights and the **scale** of the utilities.

  Here is the mechanical walkthrough of Harsanyi's Aggregation Theorem, isolating the three specific points you raised.

  ### The Setup

  Let there be $n$ individuals. Let $\mathcal{L}$ be a set of lotteries over outcomes.
  Assume each individual $i$ has preferences $\succeq_i$ over $\mathcal{L}$ satisfying the von Neumann–Morgenstern (vNM) axioms. These are represented by utility functions $U_i: \mathcal{L} \to \mathbb{R}$, unique up to positive affine transformation (PAT).
  Let society have preferences $\succeq_0$ satisfying vNM axioms, represented by $W: \mathcal{L} \to \mathbb{R}$.

  The core mathematical claim is that if $\succeq_0$ respects the individual preferences in a specific way, $W$ must be an affine combination of the $U_i$.

  ---

  ### (a) Pareto Indifference and the Sign Problem

  **The Condition:**
  Pareto Indifference (sometimes called Weak Pareto Indifference) states:
  $$ \text{If } \forall i, U_i(L) = U_i(L'), \text{ then } W(L) = W(L'). $$

  **The Mechanics:**
  Mathematically, this condition asserts that $W$ is functionally dependent on the vector $\mathbf{U} = (U_1, \dots, U_n)$. Since $W$ and all $U_i$ are linear in probabilities (by the vNM expected utility theorem), this functional dependence must be linear.

  This is essentially an application of a linear algebra lemma (often related to Farkas' Lemma or the theorem of the alternative). If we view the utilities as vectors in the space of lotteries, Pareto Indifference implies that the hyperplane defined by $W$ contains the intersection of the hyperplanes defined by the $U_i$. Consequently, $W$ must lie in the linear span of the $U_i$.

  Thus, there exist constants $a_1, \dots, a_n$ and $b$ such that:
  $$ W(L) = \sum_{i=1}^n a_i U_i(L) + b $$

  **Where the Signs Fail:**
  Pareto Indifference only constrains $W$ when **all** individuals are indifferent ($\Delta U_i = 0$ for all $i$). It is silent when preferences diverge.
  Consider a society with two members and the social welfare function:
  $$ W = U_1 - U_2 $$
  If $U_1$ and $U_2$ are both constant between $L$ and $L'$, then $W$ is constant. Pareto Indifference is satisfied.
  However, if $U_2$ increases while $U_1$ stays fixed, $W$ decreases. This represents a "malevolent" dictator regarding person 2. Nothing in the indifference condition prevents $a_i$ from being negative. The linear algebra guarantees $W$ is in the *span* of the $U_i$, but the span includes negative coefficients.

  Therefore, Pareto Indifference alone yields **weighted utilitarianism with arbitrary weights**, allowing for negative weights (anti-utilitarianism regarding specific individuals).

  ---

  ### (b) Strong Pareto and Fixing the Signs

  **The Condition:**
  To rule out negative weights, we need a condition that triggers when individuals are *not* indifferent. The standard requirement is **Strong Pareto** (or sometimes just "Pareto"):
  $$ \text{If } \forall i, U_i(L) \geq U_i(L') \text{ and } \exists j, U_j(L) > U_j(L'), \text{ then } W(L) > W(L'). $$
  (There is also a Weak Pareto condition: If $\forall i, U_i(L) > U_i(L')$, then $W(L) > W(L')$. This is sufficient for non-negative weights, but Strong Pareto is usually invoked to ensure strictly positive weights for everyone).

  **The Mechanics:**
  We return to the equation derived in (a): $W = \sum a_i U_i + b$.
  We need to prove $a_k \geq 0$ for all $k$.

  To do this mechanically, we require a **Richness Assumption** (often implicit in the theorem statement). We must assume the domain of lotteries is rich enough that we can vary one individual's utility while holding others constant. Formally, for any individual $k$, there exist lotteries $L, L'$ such that:
  $$ U_k(L) > U_k(L') \quad \text{and} \quad \forall j \neq k, U_j(L) = U_j(L'). $$
  *(Note: This is a non-trivial assumption. It requires that individuals' preferences are not perfectly correlated. If $U_1$ and $U_2$ are identical, you cannot vary one without the other.)*

  Given this richness:
  1.  Construct $L, L'$ such that $U_k$ increases and all other $U_j$ remain constant.
  2.  By the Strong Pareto condition, since $k$ is strictly better off and no one is worse off, society must be strictly better off: $W(L) > W(L')$.
  3.  Substitute the affine combination:
      $$ \sum a_i U_i(L) + b > \sum a_i U_i(L') + b $$
      $$ \sum a_i [U_i(L) - U_i(L')] > 0 $$
  4.  Since $U_j(L) - U_j(L') = 0$ for all $j \neq k$, the sum collapses to:
      $$ a_k [U_k(L) - U_k(L')] > 0 $$
  5.  Since we constructed the lotteries such that $[U_k(L) - U_k(L')] > 0$, it must be that **$a_k > 0$**.

  **Conclusion:**
  Strong Pareto forces all weights $a_i$ to be non-negative (and strictly positive if the richness condition holds and we use the strict version of Pareto). This rules out malevolence. However, it still leaves the *magnitude* of the $a_i$ entirely undetermined.

  ---

  ### (c) The Scaling Problem and Interpersonal Comparability

  This is the crux of Sen's critique. Even with positive weights, the theorem does not deliver classical Utilitarianism ($W = \sum U_i$) without further assumptions.

  **The Mechanics of vNM Scaling:**
  A vNM utility function $U_i$ is unique only up to a **Positive Affine Transformation (PAT)**.
  For any $\alpha_i > 0$ and $\beta_i \in \mathbb{R}$, the function $U_i^* = \alpha_i U_i + \beta_i$ represents the exact same preferences $\succeq_i$.

  Now look at the social welfare function derived by Harsanyi:
  $$ W = \sum_{i=1}^n a_i U_i + b $$
  If we decide to rescale individual $k$'s utility (which we are mathematically allowed to do without changing their preferences), say we double their scale ($\alpha_k = 2$), the new representation is $U_k^* = 2U_k$.
  To represent the *same* social preferences $\succeq_0$, the social utility function $W$ must remain ordinally equivalent. In the vNM context, this means $W$ can also undergo a PAT, but the *relative weights* in the summation must adjust to compensate for the individual rescaling.

  If we substitute $U_k = \frac{1}{2} U_k^*$ into the social equation:
  $$ W = a_1 U_1 + \dots + a_k (\frac{1}{2} U_k^*) + \dots + a_n U_n + b $$
  $$ W = a_1 U_1 + \dots + \frac{a_k}{2} U_k^* + \dots + a_n U_n + b $$

  **The Consequence:**
  The weight $a_k$ is inversely proportional to the arbitrary scaling factor $\alpha_k$ of individual $k$'s utility.
  $$ a_k^* = \frac{a_k}{\alpha_k} $$

  Because vNM theory provides no natural "zero" or "unit" for utility (no interpersonal standard of measurement), $\alpha_k$ is arbitrary for each person.
  *   If I measure your utility in "happiness units" and mine in "decihappiness units," my weight in the social function will appear 10 times larger than yours, even if Harsanyi's theorem assigns us equal ethical weight.
  *   The theorem proves $W$ is a linear combination of $U_i$, but it **does not determine the ratios** $a_i / a_j$.

  **Sen's Critique (Mechanically):**
  Amartya Sen argues that Harsanyi's theorem solves the **aggregation** problem (how to combine utilities) but presupposes the **measurement** problem (how to make utilities comparable) is already solved.
  1.  **Informational Base:** The theorem takes as input the informational base of vNM utilities ($\bar{U}$). This base contains ordinal information + risk attitudes, but *excludes* interpersonal level or unit comparability.
  2.  **Invariance:** The social welfare function must be invariant to admissible transformations of the input data. Since admissible transformations for vNM utilities include independent scaling for each person ($\alpha_i$), the social weights $a_i$ cannot be fixed by the theorem alone.
  3.  **The "Veil of Ignorance" Fix:** Harsanyi often attempts to fix the weights ($a_i = 1/n$) by invoking an "equiprobability" assumption behind a veil of ignorance. However, mechanically, this only works if one assumes that behind the veil, the *range* of possible utilities is identical for all agents (e.g., everyone maps worst outcome to 0 and best to 1). This is an assumption of **unit comparability** smuggled in to fix the $\alpha_i$.

  **Summary of the Shortfall:**
  Harsanyi's theorem establishes:
  $$ \text{Social Preference} \implies W = \sum a_i U_i $$
  But because $U_i \to \alpha_i U_i$ is an admissible transformation that leaves individual preferences unchanged, the ratio $\frac{a_i}{a_j}$ is indeterminate without an external ethical stipulation on how to scale $U_i$ relative to $U_j$.

  Therefore, the theorem does not derive Utilitarianism from rationality and Pareto alone. It derives **Weighted Utilitarianism** from rationality, Pareto, and **an arbitrary choice of interpersonal scaling**. The "folk summary" typically conflates the derivation of the *linear form* with the justification of the *weights*.
