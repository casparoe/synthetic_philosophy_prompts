      *   Closing: You were right to feel uneasy. Jae conflated "social norm" with "Lewisian convention."

  9.  (Drafting the response based on these points...) *Ensure I emphasize that Lewis is talking about specific game-theoretic structures, not just "things everyone does."* *Make sure to mention Ullmann-Margalit as a follow-up read.* *Clarify the difference between "I do X because you do X" (Convention) and "I do X because it's right/I gain from it even if you don't" (Morality).*

  10. *Final Polish:* Check for clarity and tone. Ensure the distinction between "equilibrium" and "arbitrary equilibrium" is clear. (Self-correction: A PD has an equilibrium [defect/defect], but it's suboptimal. A Coordination game has multiple equilibria [left/left, right/right]. Morality often looks like trying to escape a PD to get to a better outcome, not just picking between two equal outcomes.)

