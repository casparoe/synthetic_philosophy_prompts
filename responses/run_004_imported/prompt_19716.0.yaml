answer: |-
  You were right to feel uneasy. Your 10 AM intuition is correcting your 1 AM exhaustion.

  Jae is making a move that is very common in philosophy (often called "conventionalism about morality"), and it *sounds* compelling because it treats all social norms as the same kind of beast. However, if we are talking about David Lewis's **technical** definition in *Convention* (1969), Jae is almost certainly wrong.

  Lewis sets up a very specific game-theoretic box for what counts as a convention. Moral norms like honesty and promise-keeping generally fall outside that box for three specific reasons. Here is the breakdown you can use to argue back.

  ### 1. The Arbitrariness Condition
  This is the strongest technical block. For Lewis, a convention must be **arbitrary**.

  To be precise: There must be at least one alternative regularity ($R'$) that could have solved the coordination problem just as well as the current regularity ($R$).
  *   **Driving:** Driving on the right ($R$) and driving on the left ($R'$) are functionally equivalent. As long as we *match*, the payoff is the same. Neither is intrinsically better.
  *   **Honesty:** Is a world of universal honesty functionally equivalent to a world of universal lying? Most game-theoretic models suggest **no**.

  A society where everyone tells the truth generally yields higher utility and stability than a society where everyone lies (where communication collapses, trust evaporates, and transaction costs skyrocket). If one equilibrium is Pareto-superior to the other, the choice is not arbitrary. Lewis requires that the agents prefer $R$ over $R'$ *only because* others are doing $R$. If agents prefer $R$ because $R$ produces a better world *independent* of what others do (or even if they prefer the *state of affairs* of honesty), it fails the arbitrariness test.

  Jae's claim that a "lying world" would be "just as stable" is empirically and theoretically dubious. A world where everyone lies is often not a stable equilibrium at all because language and promising cease to have meaning. If I know you *always* lie, I just invert your statements, and then you have an incentive to tell the truth to confuse me, and the whole system unravels. Driving on the left doesn't unravel if everyone switches; universal lying tends to destroy the medium (language/trust) itself.

  ### 2. Coordination Problems vs. Prisoner's Dilemmas
  Lewisian conventions solve **Coordination Problems**. In these games, our interests perfectly align. I want to do what you do. I don't care *what* we do, only that we *match*.

  Moral norms often solve **Prisoner's Dilemmas** (or Free Rider problems). In these games, our interests conflict.
  *   **Driving:** I never gain by driving on the left if you are driving on the right. My best move is always to match you.
  *   **Honesty:** Even if you are honest, I might gain a specific advantage by lying to you (exploiting your trust).

  In a Lewisian convention, conformity is a **conditional preference**: "I prefer to conform *on the condition* that you conform."
  In many moral contexts, the preference is not purely conditional. We often feel (and game theory suggests) that while we *prefer* mutual honesty, we have a dominant incentive to defect (lie) if we can get away with it.

  Because moral norms often require suppressing a temptation to defect for individual gain, they function more like **enforced solutions to conflict** than **arbitrary solutions to coordination**. Edna Ullmann-Margalit (in *The Emergence of Norms*) makes this distinction explicitly: she calls Lewis-style rules "conventions" and moral-style rules "norms," precisely to avoid the confusion Jae is leaning into.

  ### 3. Common Knowledge of Alternatives
  Lewis requires it to be **common knowledge** that an alternative regularity would have worked.
  *   **Driving:** We all know we could have driven on the left. We all know the British do.
  *   **Honesty:** Do we actually share the common knowledge that "routine lying would have worked just as well"?

  Most people inside the "honesty convention" do *not* believe that. They believe honesty is *better*. For Lewis, the agents must recognize the arbitrariness. If the population believes the norm is binding because it is *right* or *optimal*, rather than just *coordinated*, it fails the common knowledge condition of a Lewisian convention.

  ### Where Jae Might Have a Point (The Concession)
  Jae isn't 100% crazy. Lewis does allow that *some* norms that look moral might be conventions.
  *   **Property Rules:** Which side of the fence is your property? That is arbitrary. We could have drawn the line five feet left or right. As long as we agree, it works. Lewis would likely admit property boundaries are conventions.
  *   **Specific Promissory Rituals:** Saying "I do" vs. signing a contract. The *form* is conventional.

  But the underlying obligation ("keep the promise," "respect the boundary") is usually grounded in something deeper (like an agreement or the need for security) that isn't arbitrary.

  ### The Verdict
  Jae is conflating **"social norm"** with **"Lewisian convention."**
  *   **Social Norm:** Any regularity sustained by expectations and sanctions. (Yes, honesty fits here).
  *   **Lewisian Convention:** A specific subset of social norms that solve recurrent coordination problems via arbitrary regularities where interests perfectly align. (Honesty does not fit here).

  **How to argue it back:**
  Tell Jae: "Lewis requires **arbitrariness**. For honesty to be a convention, a world of universal lying would have to be a stable equilibrium with equal payoff to a world of honesty. It isn't. Honesty solves a conflict-of-interest problem (Prisoner's Dilemma), not a pure coordination problem. You're describing a norm, but you've dropped the technical constraints that make Lewis's definition work."

  You didn't lose the argument at 1 AM; you just lacked the game-theoretic vocabulary to pinpoint where the analogy broke. Sleep on it, and you're right: morality isn't just traffic rules.
