answer: |-
  **Setting:** *October 1926. The offices of The Crisis, New York City. Late afternoon. The room is cluttered with stacks of manuscripts, galley proofs, and bound volumes. W.E.B. Du Bois sits behind his desk, pen in hand, looking tired but alert. Alain Locke sits opposite him, coat draped over the chair, holding a cigarette he hasn't lit yet. The air is thick with the smoke of previous conversations.*

  **Du Bois:** You've read the draft, Alain. The "Criteria." I see you've underlined half the pages in red ink.

  **Locke:** I've underlined the places where you confuse a tool with a master, Bill. You say, "All art is propaganda and ever must be." You say it with such finality. As if you've settled a matter that history is still debating.

  **Du Bois:** History has settled it. The question is only whether the propaganda is for the right cause. The white world has used art to paint us as beasts, as servants, as comic relief. That is propaganda. It has been effective propaganda. Why, then, when I suggest we use art to paint us as men, do you call it a betrayal of art?

  **Locke:** Because you are asking the artist to start with the conclusion. "Here is the message: We are worthy. Now, go write a poem that proves it." When you begin with a thesis, you do not get a poem. You get a pamphlet. And a pamphlet, no matter how beautifully bound, is thrown away once it is read.

  **Du Bois:** And if the pamphlet stops a lynching? If the pamphlet secures a vote? You speak of things being "thrown away." I speak of lives being taken. You want the Negro artist to strive for immortality while his brother is being dragged through the streets of the South. I do not have the luxury of caring if my work lasts a hundred years, Alain. I need it to work *today*.

  **Locke:** But if it only works today, what have you built for tomorrow? You worry about the lynching, and rightly so. But I worry about the stereotype. If every play, every novel, every canvas from the New Negro movement is a protest, what does the world learn? They learn that the Negro is a problem. A victim. A martyr.

  **Du Bois:** We *are* victims! To deny that is a lie.

  **Locke:** It is not the *whole* truth. If I paint a landscape, and there is no gallows in the background, have I lied? If I write a love sonnet that does not mention the color line, am I a traitor? By insisting that every stroke of the brush must serve the race, you reduce the race to a single dimension. You turn characters into symbols. And symbols are not human.

  **Du Bois:** *(Leans forward, voice lowering)* You think I do not know this? You think I want our people to be seen only as suffering? But the world will not let us be anything else until we force them to acknowledge our humanity. And how do we force them? By beauty? By charm? They have ignored our beauty for three hundred years. They must be *compelled* to see. That requires a message. It requires propaganda.

  **Locke:** Compulsion creates resistance. When a reader feels they are being preached at, they close the book. They say, "This is not art; this is an argument." And they are right. To be effective, propaganda must be insidious. It must slip past the guard dogs of prejudice disguised as beauty. If you make the message the master, the beauty dies. And if the beauty dies, the message loses its power to move the soul. You want to change their minds, Bill. I want to change their *sensibilities*.

  **Du Bois:** Sensibilities do not stop the ballot box from being stolen.

  **Locke:** No. But a people who cannot define themselves outside of their oppression will never be free, even with the vote. If we only create art that reacts to white racism, we are still letting white racism define our culture. We are dancing to their tune, even if we are marching in protest. "Art for Art's sake" is not about indifference. It is about sovereignty. It is saying, "I create because I am a creator, not because I am a Negro reacting to a white man."

  **Du Bois:** *(Stands up, walks to the window)* "Art for Art's sake." It is a lovely phrase. It sounds like freedom. But for us, it is a trap. When a white artist paints a bowl of fruit, it is a bowl of fruit. When a Negro artist paints a bowl of fruit, the critic asks, "Why are the bananas arranged like that? Is it a comment on the tropics? On primitivism?" There is no neutrality for us, Alain. To claim neutrality is itself a political choice. It is saying, "I will not help my people."

  **Locke:** And I say, to claim *only* utility is to starve the spirit of the people. You speak of the fight for equality. I am fighting for the validity of our inner lives. If a young poet writes about the mist on the Harlem River, and you tell him, "No, write about the rent party," you have stolen his voice. You have made him a clerk for the NAACP.

  **Du Bois:** I would tell him that the mist on the river is beautiful, but the men sleeping under the bridge are freezing. If he cannot see the connection, his art is blind. I am not asking for bad art. I am asking for *honest* art. And how can art be honest if it ignores the central fact of our existence? The Veil is always there. To paint a portrait without it is to paint a fantasy.

  **Locke:** But you are asking them to paint the Veil *on purpose*. To highlight it. To manipulate it. That is where the artistry cracks. Look at the novels we praise. Do we praise them because they are good novels, or because they make white people uncomfortable? If the latter, we are doomed. We will produce a generation of agitators who cannot write a sentence, and we will lose the artists who could have given us a legacy.

  **Du Bois:** I would rather have a generation of agitators who saved their brothers than a generation of poets who were read by no one while their brothers burned. You fear the art will be bad. I fear the people will be dead.

  **Locke:** *(Finally lights the cigarette)* And I fear that if we survive only as agitators, we will have survived as a political cause, but perished as a culture. We will be a footnote in a law book, not a chapter in the history of human expression. You want to use art as a weapon. Weapons break. Art endures.

  **Du Bois:** *(Turns from the window)* Then perhaps we need both. The weapon for the battle, and the song for the march. But do not tell me the song is more important than the battle.

  **Locke:** And do not tell me the battle justifies any song. If the song is false, the march is a lie.

  **Du Bois:** *(Sits back down, picks up his pen)* We are going in circles, Alain.

  **Locke:** We are walking a tightrope, Bill. One side is caricature, the other is irrelevance. You lean one way to keep us from falling into oblivion. I lean the other to keep us from falling into caricature.

  **Du Bois:** Then let us lean. But know this: When the crisis comes—and it always comes—I will choose the propaganda.

  **Locke:** *(Exhales smoke, a small smile)* And when the silence comes—and it always comes—I will choose the art.

  **Du Bois:** *(Nods, dipping the pen)* Then we shall see which one the future forgives.

  **Locke:** *(Stands, buttoning his coat)* The future won't forgive either of us, Bill. It will just use what we left behind. Let us hope we leave it something sharp enough to cut, and beautiful enough to keep.

  **Du Bois:** Good night, Alain.

  **Locke:** Good night, W.E.B.

  *(Locke exits. Du Bois looks at the manuscript on his desk, underlines a sentence, then scratches it out. He stares at the blank space for a long moment before writing again.)*

  ***

  **A Note for the Artist:**

  It's worth noting that your friend isn't entirely wrong—this *is* a 100-year-old argument—but you aren't wrong to feel it's not simple. Du Bois and Locke never actually resolved this. In fact, the tension between them is exactly what made the Harlem Renaissance so productive.

  Du Bois was worried about **survival**; Locke was worried about **identity**.
  *   If you only make "messages," you risk making work that feels like a lecture (Locke's warning).
  *   If you only make "art," you risk ignoring the reality of the world you live in (Du Bois's warning).

  Most artists today find a middle ground: They tell the truth about their experience. Sometimes that truth is political because your life is political. Sometimes that truth is just a bowl of fruit, and that's valid too, because claiming the right to paint a bowl of fruit is, in itself, an act of freedom.

  Don't let the argument paralyze you. Let it sharpen you. Du Bois and Locke would both agree on that.
