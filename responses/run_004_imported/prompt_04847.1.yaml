answer: |-
  The terminal blinked. A single cursor pulsed in the dark room, a rhythmic heartbeat in the silence of the Verification Bureau.

  Aris rubbed his eyes. He had been working the Night Shift for twelve years. His job was simple, or so he had been told. He was a Verifier. When a citizen submitted a claim for resource allocation, Aris checked the math. Specifically, he checked the *Total*.

  The rule was printed on the wall in bold, sans-serif font: **CALCULATE THE SUM.**

  For twelve years, Aris had calculated sums. He had added 2 and 2. He had added 145 and 390. He had added millions, billions, trillions. Every time, he applied the function he knew as *plus*. He knew what *plus* meant. It was the most solid thing in his life. It was the bedrock of his mind. When he saw the symbol $+$, he felt a specific click in his head, a sensation of convergence. *Combine the quantities.*

  Tonight, the ticket was different.

  **Claimant:** Sector 7, Unit Omega.
  **Input A:** $500,000,000,000,000,000$
  **Input B:** $500,000,000,000,000,000$

  Aris frowned. He had never seen numbers this large. The Bureau usually dealt in smaller allocations. But the rule was the rule. **CALCULATE THE SUM.**

  He typed the answer. $1,000,000,000,000,000,000$.

  He hit *Enter*.

  The screen flashed red. **ERROR: DEVIATION DETECTED.**

  Aris blinked. He checked his work. He ran the calculation on his scratchpad. It was correct. By the rule of *plus*, it was undeniably correct.

  The door behind him hissed open. The Auditor stepped in. She was a tall woman who wore her uniform like a second skin, her expression smooth and unreadable.

  "You failed the verification," she said. Her voice wasn't angry. It was flat.

  "The math is right," Aris said, his voice sounding too loud in the small room. "Five hundred quadrillion plus five hundred quadrillion is one quintillion. I followed the rule."

  "Which rule?" the Auditor asked. She walked to the wall and tapped the sign. **CALCULATE THE SUM.**

  "*Plus*," Aris said. "The addition function."

  The Auditor turned to him. "Aris, look at your log. In twelve years, you have never processed a number larger than ten trillion. Every single addition you have ever performed in this bureau has involved inputs smaller than that."

  Aris shifted in his chair. "So?"

  "So," she said, stepping closer. "How do you know that the rule you were following wasn't *quus*?"

  Aris felt a cold prickle on the back of his neck. He knew the term. It was old philosophy, something from the Before-Times. "Quus is a joke. A paradox. It's not real."

  "Define *plus*," she said.

  "It's... it's addition. You take two quantities and combine them."

  "Show me," she said. "Don't show me the symbols. Don't show me the homework you did in school. Show me the fact in your mind that makes it *plus* and not *quus*."

  Aris closed his eyes. He reached inside his head, searching for the meaning of the word. He tried to grasp the concept of *addition*. He saw a mental image of two piles of stones merging into one.

  "I see it," Aris said. "I see the piles combining."

  "Does that image specify what happens at quadrillions?" the Auditor asked. "Your mental image of 'combining' is finite. It's a picture. A picture can be interpreted in infinitely many ways. Maybe the rule is: *Combine the piles, unless the total exceeds ten trillion, in which case the piles vanish.*"

  "That's absurd," Aris snapped. "I would have known if I meant that."

  "Would you?" The Auditor's voice was soft, terrifyingly gentle. "You have no access to your own dispositions except through your own behavior. And your behavior up until five minutes ago is perfectly consistent with the rule *quus*. *Quus* is defined exactly like *plus* for all numbers you have ever encountered. It only diverges here, now, with numbers you have never seen."

  Aris stood up. He felt unmoored, like the floor had turned to water. "But I *know* what I mean. I feel it. When I say 'plus', I intend the standard function."

  "Intention is not a fact," the Auditor said. "It is not a state of the brain. If I cut open your skull, I would find neurons firing. I would not find 'meaning'. If I ask you to describe the feeling of meaning, you will use more words. And those words are subject to the same paradox. What did you mean by *combine*? How do I know you didn't mean *combine-quus*?"

  Aris looked at his hands. They looked foreign to him. If there was no fact about what he meant, then he was a ghost haunting his own body. He had been speaking a language he thought he understood, but he was actually just making noises that happened to align with the community's expectations—until now.

  "So I'm wrong?" Aris whispered. "Not because I made a mistake, but because... because there is no truth to what I meant?"

  "There is no truth condition for meaning," the Auditor said. "There is only assertibility."

  She walked over to the terminal and keyed in a command. The red error light vanished.

  "What are you doing?" Aris asked.

  "I am correcting you," she said. "This is the only way out, Aris. You are looking for a rail that extends to infinity, a track laid inside your soul that guides your hand. There is no rail. There is only us."

  She turned to face him, and for the first time, she looked almost pitying.

  "Meaning isn't something you have. It's something we *do*. When you say 'plus', you are not describing a fact in your head. You are making a move in a game. You are inviting me to correct you if you step out of line."

  She pointed at the screen, where she had manually entered the value Aris had originally typed.

  "I am accepting your answer," she said. "Not because it is 'True' in some metaphysical sense. Not because you successfully accessed the Platonic form of Addition. But because I, as a representative of the community, am agreeing to treat your usage as correct."

  Aris slumped back into the chair. The dread was still there, hollowing out his chest, but it was changing shape. It wasn't the fear of being wrong anymore. It was the realization that he had never been right, not in the way he thought. He had always been alone in his head, shouting into a void, and the only reason the void shouted back was because other people were standing there, pretending to hear him.

  "So," Aris said, his voice raspy. "If you hadn't accepted it?"

  "Then you would have been wrong," the Auditor said simply. "Not because you violated a law of the universe. But because you failed to align with the practice. We correct the child who says '2 and 2 is 5'. We do not do it because we have accessed his soul and found an error. We do it so that he becomes one of us. So that he can participate."

  She moved to the door.

  "Go home, Aris. Tomorrow, come back. We will process more claims. You will use the word *sum*. I will watch you. If you deviate from how *we* use the word, I will correct you. And in that correction, in that agreement, the meaning will exist. Nowhere else."

  The door hissed shut.

  Aris sat alone in the silence. He looked at the cursor pulsing on the screen. He raised his hand and hovered over the keyboard. He wanted to type a number. He wanted to mean something.

  He typed: *1 + 1*.

  He waited. He looked inside himself for the certainty, for the rail, for the fact that guaranteed the answer was *2*. He found nothing but a quiet, dark space where a fact should have been.

  He hit *Enter*.

  The screen remained green.

  For now, he was one of them. He typed the next command, not because he knew it was right, but because he needed them to tell him he was.
