prompt: |-
  I sit on the town council of Amity Hollow, a planned community founded twelve years ago around an ideal of direct, participatory civic life: weekly open town meetings at which any resident may speak and vote, a volunteer-run fire watch and school co-op, and a homemade harvest festival that serves as the town's only real "entertainment." A resident who sold a startup has offered to fund a permanent theater and underwrite a resident troupe for its first five seasons, and most of the council is inclined to accept. One member, explicitly invoking Rousseau's Letter to d'Alembert, argues that we would be converting citizens who currently make their own civic and social life into paying spectators of professionals' counterfeited passions, and that an institution tolerable in a large, already-corrupt city is not a harmless import for a small town that has not yet contracted whatever disease theater is supposed to remedy. In the spirit of Chesterton's Fence, I do not want to dismiss this as merely quaint, but neither do I want to lose a generous, time-limited offer to an eighteenth-century pamphlet without a real argument on the merits. Please draft the memo I will circulate before next month's vote: a concrete recommendation -- accept, decline, or accept with specific conditions -- that engages the strongest form of the participation-versus-spectatorship worry rather than dismissing it, and states honestly what the town gives up under whichever option you recommend.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Town Council Member of Amity Hollow (a 12-year-old planned community focused on direct participation).
      *   **Audience:** Fellow Council Members and potentially the public (since it's a memo circulating before a vote).
      *   **The Issue:** A wealthy resident offers to fund a permanent theater and professional troupe for 5 years.
      *   **The Conflict:** Most want to accept. One member objects based on Rousseau's *Letter to d'Alembert* (theater turns active citizens into passive spectators, corrupts simple morals, imports urban vice).
      *   **The Constraint/Goal:** Apply Chesterton's Fence (don't remove a fence until you know why it was put there). Do not dismiss the Rousseauian argument as quaint. Engage it seriously. Make a concrete recommendation (Accept, Decline, or Accept with Conditions). Be honest about trade-offs.
      *   **Tone:** Thoughtful, civic-minded, philosophical but practical, respectful of the community's founding ideals.

  2.  **Deconstruct the Philosophical Arguments:**
      *   **Rousseau (*Letter to d'Alembert*):** Theater creates passivity. It substitutes pity for action (we cry at the play but don't help the neighbor). It introduces luxury, inequality (seating), and artificiality. It undermines the *fêtes* (public gatherings where everyone participates). In a small, virtuous republic, it's a solvent of social bonds.
      *   **The Pro-Theater Argument (Implicit):** Culture, beauty, shared experience, economic draw, utilizing the gift, not rejecting art.
      *   **Chesterton's Fence:** The "fence" here is the norm of total participation/amateurism. Why is it there? To maintain social cohesion, agency, and equality. If we build the theater, are we dismantling that fence?

  3.  **Evaluate the Options:**
      *   *Option A: Decline.* Honors Rousseau completely. Preserves the "active citizen" model. Risks: Insulting the donor, stagnation, appearing anti-art, missing a chance to enhance community life without necessarily destroying it.
      *   *Option B: Accept Unconditionally.* Maximizes the gift. Risks: Validating the spectator model, creating a class divide (performers vs. audience), potentially killing the harvest festival spirit, dependency after 5 years.
      *   *Option C: Accept with Conditions.* Attempts to synthesize. Uses the resource to *enhance* participation rather than replace it. This seems the most "Chestertonian" approach—understanding the purpose of the fence (participation) and ensuring the new structure doesn't bypass it.

  4.  **Develop the Recommendation (Option C):**
      *   *Core Principle:* The theater must not be a place where we *watch* others live, but where we *gather* to create.
      *   *Conditions:*
          1.  **No Ticket Prices:** It must remain a public good, not a commercial enterprise (avoids class exclusion).
          2.  **The "Amity Mandate":** The professional troupe must serve as teachers/instructors, not just performers. Their KPI is not attendance, but resident participation in productions.
          3.  **Programming Balance:** A percentage of stages must be reserved for resident-led, amateur productions (preserving the harvest festival spirit).
          4.  **The Sunset Clause:** After 5 years, the funding stops. The town must decide if it can sustain it *without* creating a spectator class.
          5.  **Architectural/Seating:** Avoid hierarchical seating (orchestra vs. balcony) if possible, or keep it flat/flexible.

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard Council Memo format.
      *   **Opening:** Acknowledge the generosity and the gravity of the decision. State the purpose of the memo.
      *   **The Rousseauian Objection (The "Fence"):** Articulate the opposing member's argument clearly and charitably. Don't strawman it. Explain *why* participation matters (social glue, agency).
      *   **The Risk of Acceptance:** Be honest about what is lost. The shift from "we do" to "we watch." The risk of passivity.
      *   **The Recommendation:** Accept with Conditions.
      *   **The Conditions (The "Guardrails"):** Detail the specific constraints designed to mitigate the Rousseauian risk.
      *   **The Trade-off:** Acknowledge that even with conditions, the dynamic *will* change. We are inviting professionalism into a volunteer space.
      *   **Conclusion:** A call to vote based on civic philosophy, not just economics.

  6.  **Refining the Tone:**
      *   Avoid bureaucratic jargon. Use language suited for a community founded on ideals ("civic life," "participation," "virtue").
      *   Ensure the Rousseau reference is accurate (spectatorship, pity vs. action, the *fête*).
      *   Ensure Chesterton's Fence is applied (we understand the fence before we open the gate).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the recommendation too wishy-washy?
      *   *Fix:* Make the conditions binding. The contract with the donor must reflect them.
      *   *Critique:* Did I address the "disease" Rousseau mentions?
      *   *Fix:* Explicitly mention that theater isn't inherently evil, but dangerous *in this specific context* of a small republic.
      *   *Critique:* Is the trade-off honest?
      *   *Fix:* Admit that some passivity is inevitable. We can't fully inoculate against spectatorship, only manage it.

  8.  **Final Polish:** Check formatting, clarity, and ensure the "voice" sounds like a thoughtful council member speaking to peers. (Proceed to generate output based on this thought process.)

  9.  *(Post-Drafting Check)*: Does this meet the prompt's requirement to "state honestly what the town gives up"? Yes, in the "Cost of This Path" section. Does it engage the strongest form of the worry? Yes, by centering the memo around the active/passive citizen distinction.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** The Amity Hollow Town Council
  **FROM:** [Your Name], Council Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Proposed Theater Endowment and Facility

  **I. PURPOSE**

  Next month, this Council must vote on the offer from resident [Donor Name] to fund the construction of a permanent theater and underwrite a professional resident troupe for five years. This is not merely a zoning or budgetary decision; it is a decision about the civic character of Amity Hollow.

  The majority of the Council is inclined to accept. One member has voiced a principled objection, explicitly citing Jean-Jacques Rousseau's *Letter to d'Alembert*. The objection is that theater transforms active citizens into passive spectators, substituting the consumption of simulated emotion for the practice of real virtue.

  In the spirit of Chesterton's Fence—the principle that we should not remove a barrier until we understand why it was put there—this memo argues that we cannot dismiss the Rousseauian objection as quaint anti-modernism. The "fence" in Amity Hollow is our norm of radical participation. However, I recommend we **Accept the Offer with Specific Binding Conditions** designed to preserve that participation. Below is the reasoning, the specific safeguards, and an honest accounting of what we risk losing.

  **II. THE ROUSSEAUIAN OBJECTION (THE FENCE)**

  Our founding ideal is that Amity Hollow is not a place where life happens *to* us, but one we make *for* ourselves. Our harvest festival, our fire watch, and our town meetings rely on the assumption that every resident is a protagonist in the community's story.

  Rousseau argued that in a small, virtuous republic, the theater is a solvent. His concerns are threefold, and they remain potent:

  1.  **Passivity:** Theater requires us to sit in the dark and be still. It trains us to be an audience. If we become accustomed to watching professionals express passion on stage, we may become less inclined to express commitment in the town meeting.
  2.  **Substitution of Pity for Action:** Rousseau noted that theater allows us to weep for fictional tragedies while remaining indifferent to real neighbors. It satisfies our moral impulses vicariously.
  3.  **The End of the *Fête*:** Rousseau contrasted the theater with the *fête*—an open-air gathering where the people themselves are the spectacle, where there is no distinction between performer and observer. Our Harvest Festival is a *fête*. A theater building is, by architectural definition, a place of separation.

  To ignore these arguments is to assume that "culture" is an unalloyed good. In a city of strangers, theater provides shared myths. In a town of neighbors, it risks introducing a class division between the talented (who speak) and the untalented (who listen).

  **III. RECOMMENDATION: ACCEPT WITH CONDITIONS**

  We should not refuse beauty, nor should we insult the generosity of a neighbor who wishes to contribute. However, we cannot import a professionalized cultural model without modifying it to fit our civic constitution.

  I move to accept the donation, contingent on the following four conditions being written into the binding agreement with the donor and the troupe:

  1.  **The "Amity Mandate" (Participation Ratio):** The professional troupe is hired not solely as performers, but as *instructors*. Their contract must stipulate that 40% of all productions per season must include at least 30% non-professional resident cast/crew. The goal is not to watch them, but to learn from them.
  2.  **No Ticket Prices:** The theater must remain a public utility, not a commercial venue. Admission must be free to all residents. Charging for seats introduces economic stratification into our leisure time, violating our norm of equality.
  3.  **Architectural Flexibility:** The seating design must not be fixed raked seating facing a proscenium. The space must be configurable (flat floor, movable seating) to allow for town meetings, dances, and resident-led gatherings where the "stage" is in the center. The building must serve the *fête* as well as the play.
  4.  **The Sunset Review:** The five-year endowment is a trial. At month 54, a citizen's assembly will vote on whether to continue the troupe using public funds. If the "participation ratio" (Condition 1) has not been met, the funding defaults to the school co-op.

  **IV. THE TRADE-OFF: WHAT WE GIVE UP**

  We must be honest. Even with these conditions, accepting this offer changes Amity Hollow. We are lowering the drawbridge.

  *   **We Lose Purity of Agency:** By introducing professionals, we admit that some among us are "better" at art than others. This creates a subtle hierarchy. The volunteer fire watch does not have "stars"; the theater inevitably will. We risk making our own amateur efforts feel inferior by comparison.
  *   **We Risk Dependency:** For five years, we will enjoy high-quality production. When the money stops, we may find our own volunteer efforts have atrophied because we grew accustomed to a higher standard of polish. We may find ourselves unwilling to return to the "rough" charm of the Harvest Festival.
  *   **We Invite Spectatorship:** We cannot fully inoculate against passivity. There will be nights where residents simply sit and watch. We are accepting a small dose of the "disease" Rousseau feared in hopes that the medicine (education and access) will counteract it.

  **V. CONCLUSION**

  Rousseau was right that institutions shape souls. A theater *can* turn citizens into consumers. But a school *can* turn citizens into specialists, and yet we have a school co-op because we believe education can be structured to serve liberty.

  If we build this theater as a palace of spectacle, we betray our founding. If we build it as a workshop for civic imagination, it may strengthen us.

  I urge the Council to vote **YES**, but only if the Donor agrees to the conditions above. We must not tear down the fence of participation; we must build a gate that ensures we remain the authors of our own community, even when we are being entertained.

  Respectfully,

  [Your Name]
  Town Council, Amity Hollow
