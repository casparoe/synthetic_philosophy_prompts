      *   *Purpose:* To save utilitarianism from being too demanding, or to capture moral intuition that heroes aren't *obligated* to be heroes.

  4.  **Compare and Contrast (The Bridge):**
      *   *Similarity:* Both deal with the idea of "going beyond the call of duty."
      *   *Difference in Scope:*
          *   **Theological:** Vertical relationship (Human to God). Concerned with *Salvation* and *Merit*.
          *   **Philosophical:** Horizontal relationship (Human to Human). Concerned with *Moral Praise* and *Obligation*.
      *   *Difference in "Merit":*
          *   **Reformers:** Reject the idea that extra works create a *credit* that can be banked or transferred for salvation.
          *   **Philosophers:** Don't care about salvation credits. They care about categorizing actions. They aren't saying the hero *earns salvation*, just that the act is praiseworthy but not mandatory.
      *   *Did the Reformers hate heroism?* No. They valued charity and sacrifice. They hated the *system* of merit attached to it.
      *   *Conclusion:* The term survived, but the debate shifted from "Can I buy salvation with extra good deeds?" to "Is this action morally required?"

