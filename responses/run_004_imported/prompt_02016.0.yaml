      *   *What is the text saying?* It says you can't teach that you can do *more* than God commands without being arrogant. Why? Because even if you do everything commanded, you are still an "unprofitable servant" (Luke 17:10).
      *   *What is the target?* Roman Catholic theology of the 16th century (specifically late Medieval scholasticism).
      *   *Key Concept:* The "Treasury of Merit." The idea that saints/monks did *extra* good works beyond what was needed for their own salvation. This extra merit could be transferred to others (via indulgences) or stored up.
      *   *Why did Reformers hate this?*
          1.  **Soteriology (Salvation):** It undermines *Sola Fide* (Faith Alone) and *Sola Gratia* (Grace Alone). If I can earn extra merit, salvation becomes a transaction, not a gift.
          2.  **Christology:** It implies Christ's sacrifice wasn't sufficient. If I need to add my own "extra" merits (or buy someone else's), Christ's work is incomplete.
          3.  **Pastoral/Practical:** It leads to a two-tier Christianity (ordinary believers vs. "spiritual elites" like monks/nuns). It creates anxiety (did I do enough?) or complacency (I can buy my way out).
          4.  **Arrogance:** Claiming to do *more* than God requires presumes to know God's full requirements and claim one has exceeded them.
      *   *Specific Practices:* Monastic vows (poverty, chastity, obedience) viewed as "counsels of perfection" vs. commandments for all. Indulgences (remission of temporal punishment).

  3.  **Deconstruct Modern Moral Philosophy (Secular Context):**
      *   *Definition:* Actions that are good to do but not wrong to omit. (Heroism, extreme generosity).
      *   *Function:* Distinguishes between *duty* (obligation) and *goodness* (value).
