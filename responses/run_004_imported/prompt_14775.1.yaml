prompt: |-
  I'm a PhD student in philosophy (formal ethics-ish), and a few of us run a small giving circle out of our department that regrants pooled donations from grad students and a few alumni -- about $30k this year. The committee's stuck: half the group want to just fund whatever comes out ahead under our best-guess moral theory, and once you factor in how uncertain we all are about how much weight to give animals whose sentience is genuinely unclear (insects, other invertebrates), that ends up meaning we dump most of the pot into whichever intervention has the biggest numbers attached, since the expected value swamps everything else. The other half thinks that's exactly the kind of fanaticism that should make you distrust naive expected-value reasoning under moral uncertainty, and wants to split the money across "buckets" representing different plausible theories instead (something like Bostrom's moral parliament), even though that means each dollar ends up justified by a theory that, individually, none of us think is more likely than not. Nobody's budging and we vote next week. Can you draft the actual memo I'll circulate to the group -- it needs to recommend a real split or decision procedure, not just "reasonable people disagree," and it has to take the loosing side's strongest objection seriously rather than strawmanning it.
