answer: |-
  **MEMORANDUM**

  **TO:** Giving Circle Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for FY2024 Allocation Procedure: Constrained Maximization

  **1. Context and Goal**

  We are currently deadlocked between two decision procedures: (1) maximizing expected choice-worthiness (MEC) under our aggregate credences, and (2) a moral parliament model that allocates funds proportionally to credence in competing normative theories.

  This disagreement is not merely procedural; it reflects a substantive tension in formal ethics between *normative consistency* (doing what is most likely best) and *epistemic humility* (hedging against model error). Given our $30k capital constraint and the high variance in our empirical estimates regarding invertebrate sentience and scale, neither pure MEC nor pure Parliamentarism is optimal.

  I am recommending we adopt a **70/30 Constrained Maximization Procedure** for this cycle.

  **2. The Proposal**

  *   **70% of the pot ($21k):** Allocated to the intervention that ranks highest under our best-guess MEC calculation, using our current aggregate credences and scale estimates.
  *   **30% of the pot ($9k):** Allocated via a credence-weighted split across the top three distinct cause areas/theoretical frameworks represented in the committee (e.g., longtermism, sentientist welfarism, deontological constraints), regardless of their MEC ranking.

  **3. Rationale**

  This hybrid approach attempts to capture the upside of the MEC view while purchasing insurance against the specific risks highlighted by the Parliament view.

  *   **For the MEC Proponents:** The 70% majority ensures that the bulk of our capital drives the intervention we currently judge to be highest impact. We are not abandoning maximization; we are acknowledging that our *empirical* inputs (particularly regarding population sizes and sentience probabilities) have high error bars.
  *   **For the Parliament Proponents:** The 30% minority ensures that no plausible moral theory is completely disenfranchised. This mitigates the risk of "moral tyranny," where a theory with 51% credence dictates 100% of the action, potentially violating constraints held by the 49%.

  **4. Addressing the Strongest Objections**

  I want to steelman the strongest objection from the side that is being asked to compromise most here: the **MEC proponents' objection to splitting funds.**

  *The Objection:*
  The core argument against splitting is that it violates a dominance principle. If, under our best aggregation of moral uncertainty, Cause A has higher expected choice-worthiness than Cause B, then diverting funds to B is *guaranteed* to be suboptimal. It is effectively lighting money on fire from the perspective of our current best judgment. If we believe invertebrate welfare is 100x more pressing than human development, funding human development isn't "humility"; it's knowingly doing less good. To split is to act against our own all-things-considered judgment.

  *The Response:*
  This objection holds only if our *empirical* estimates are sufficiently precise to justify the magnitude of the EV difference. In our case, the "swamping" effect comes largely from high-variance empirical claims (e.g., the probability of sentience in insects, the tractability of influencing long-term futures).

  When the EV differential relies on parameters with orders-of-magnitude uncertainty, maximizing based on the mean estimate is vulnerable to **optimizer's curse**. By diverting 30% to diversified causes, we are not necessarily acting against our moral judgment; we are hedging against the possibility that our *empirical model* is wrong. We are treating the 30% not as "funding inferior causes," but as "paying a premium for robustness against estimation error." If our scale estimates for the top MEC cause are off by a factor of 10 (a plausible error rate in this domain), the pure MEC strategy collapses. The split protects us from catastrophic model failure without sacrificing the majority of our expected impact.

  *The Counter-Objection (from Parliament Proponents):*
  The strongest objection from the Parliament side is that 70% is still too high to concentrate on a single, potentially fanatic intervention.

  *The Response:*
  We must acknowledge that $30k is a small sum. The marginal difference in *actual world impact* between the #1 MEC cause and the #3 cause is likely within the noise of our measurement. However, concentrating 100% creates significant reputational and cohesion risk for the circle. The 70% cap forces the MEC proponents to demonstrate that their top choice is robust enough to command that majority, while the 30% floor ensures the group remains a pluralistic endeavor rather than a vehicle for a single worldview.

  **5. Implementation and Vote**

  To implement this:
  1.  We will finalize our aggregate credence distribution by next Tuesday.
  2.  We will calculate the MEC winner for the 70% bucket.
  3.  We will identify the top three distinct theoretical frameworks for the 30% bucket.

  I move that we adopt the **70/30 Constrained Maximization Procedure** for FY2024. This allows us to act decisively on our best guesses while formally institutionalizing our uncertainty.

  Please review this proposal before our vote next week. I believe this is the only path that respects the formal rigor of the MEC argument while taking the risk-sensitivity of the Parliament argument seriously.

  Best,

  [Your Name]
