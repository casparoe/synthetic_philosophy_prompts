answer: |-
  Otto squints, thumbing the leather edge of his notebook. "53rd Street… 53rd…"

  "See?" says the Critic, leaning over Otto's left shoulder. "He's consulting a tool. It's a causal link. Eye meets paper, information transfers. Distinct processes."

  The Defender, hovering on the right, shakes their head. "Apply the **Parity Principle**. If Inga recalled this address from biological memory, you'd call it a belief. Otto's notebook plays the exact same functional role. It's reliably accessible, automatically endorsed. Why deny it status just because it's outside the skin?"

  "Because location isn't arbitrary," the Critic counters. "You're committing the **Coupling-Constitution Fallacy**. Just because the notebook is causally hooked up to his cognitive processes doesn't mean it *constitutes* them. It's upstream, like a protein kinase activating a pathway. You wouldn't call the kinase the pathway itself."

  "But why is the skull a magic boundary?" the Defender presses. "Neurons fire because of input; Otto flips pages because of input. Both are causal chains leading to retrieval. If the output is identical, why privilege the carbon-based substrate?"

  "Because intrinsics matter," the Critic insists. "Neural processing involves intrinsic intentionality; the notebook is derivative. It only means '53rd Street' because Otto interprets it. You're blurring 'causally hooked up to' with 'literally a part of.' That's sloppiness. In the lab, we don't confuse the pipette with the hand holding it."

  "The pipette isn't integrated," the Defender shoots back. "Otto's notebook is. It's a constant in his life. If you damaged it, he'd feel a cognitive loss, not just a tool loss. The system isn't Otto *plus* book; it's Otto-book. The boundary is where the control loop closes, not where the epidermis ends."

  "That's where you lose me," the Critic says, watching Otto trace a line with his finger. "The loop closes in the brain. The book is static. It doesn't process; it stores. You're expanding 'mind' until it covers everything the agent touches. If he used a calculator, is that part of his math mind? If he uses a map, is that his spatial cortex?"

  "If the integration is tight enough, yes," the Defender says. "We're cyborgs by nature. Your objection relies on a gut feeling about where 'Otto' stops. But biology is just messy coupling too. Synapses are external to the soma. Why is a synapse constitutive but a notebook merely causal?"

  "Because the synapse is biologically owned," the Critic replies. "There's a unified metabolic system. The notebook can be lost, stolen, or closed. Otto's memory persists through distraction. You're conflating reliability with constitution. Just because the coupling is reliable doesn't make the external object a mental constituent. It makes it a very good prop."

  Otto stops flipping. "Here. Museum of Modern Art."

  "Prop or part?" the Defender asks.

  "Tool," the Critic says immediately.

  "Memory," the Defender corrects.

  They watch Otto step off the curb, the book tucked under his arm, the argument unresolved between them.
