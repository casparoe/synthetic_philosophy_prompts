answer: |-
  1. **The Construct of the "Ordinary Reader"**
  Textualism relies heavily on the "ordinary meaning" of the text at the time of enactment. But legal scholarship often points out that the "ordinary reader" is a legal fiction; in complex regulatory schemes, there is no actual ordinary person reading the statute. How do you prevent this "ordinary reader" from becoming a vessel for the judge's own intuitions about what the language *should* mean, rather than what it *does* mean?

  2. **Llewellyn's Canons and Determinacy**
  Karl Llewellyn famously demonstrated that for nearly every canon of construction, there exists an equally respectable counter-canon—for example, "statutes in derogation of the common law are strictly construed" versus "remedial statutes are liberally construed." If the toolkit itself contains contradictory tools, how can textualism credibly claim to be more determinate or objective than purposivism, which at least admits it is balancing policy goals?

  3. **Follow-up to Llewellyn (Anticipated Answer: Linguistic vs. Substantive Canons)**
  *Context: She will likely respond that modern textualists have discarded Llewellyn's substantive canons and rely only on "linguistic" canons (like grammar or syntax) which she claims are neutral.*
  **Follow-up:** Even linguistic canons can be manipulated depending on how you frame the context. If a textualist judge decides that a specific linguistic canon applies in one case but ignores it in a factually similar case because it yields an "unreasonable" result, hasn't the claim of neutrality collapsed back into judicial discretion?

  4. **Stare Decisis vs. Textual Correctness**
  There is an inherent tension between textualism and *stare decisis*. If a precedent has settled on a statutory interpretation that is demonstrably wrong according to the text, a pure textualist theory suggests it should be overruled. However, doing so disrupts reliance interests and stability. Where exactly do you draw the line? Is textual accuracy more important than the stability of the law, and if not, doesn't that concede that consequences matter more than text?

  5. **The Absurdity Doctrine and Scrivener's Errors**
  Textualists often reject the "absurdity doctrine" on the grounds that it allows judges to substitute their policy preferences for Congress's. However, most textualists concede they will correct an obvious "scrivener's error." In practice, how do you distinguish between a genuine typo that no Congress could have intended, and a statute that simply produces a harsh or silly outcome that Congress *did* intend but perhaps didn't foresee?

  6. **Follow-up to Absurdity (Anticipated Answer: The "High Bar" Defense)**
  *Context: She will likely argue that the bar for correcting an error is exceptionally high and requires clear evidence from the text itself.*
  **Follow-up:** But who defines what counts as "clear evidence" within the text? If a judge decides that a specific outcome is so "absurd" that it *must* be a typo, aren't they necessarily making a judgment about legislative purpose—specifically, the purpose that Congress does not intend absurd results? How is that not importing the very purpose textualism claims to reject?

  7. **Bostock v. Clayton County and Expected Applications**
  In *Bostock*, the majority held that discriminating against someone for being gay or transgender is discrimination "because of sex" under Title VII. While the outcome is celebrated by many, several prominent textualists argued the opinion ignored the expected applications of the 1964 Congress. Do you view *Bostock* as a triumph of textualism following the semantic meaning wherever it leads, or do you worry it was purposivism dressed up in textualist clothing to reach a morally preferred outcome?

  8. **Follow-up to Bostock (Anticipated Answer: Defense of Semantic Meaning)**
  *Context: She will likely defend the opinion by arguing that the text's semantic meaning covers the conduct, regardless of what the 1964 legislators expected.*
  **Follow-up:** If we accept that the text can outgrow the legislators' expectations to that degree, how do you reconcile that with the "elephant in the mousehole" canon, which suggests Congress doesn't hide major policy changes in vague statutory terms? At what point does updating the text's application become a de facto amendment by the judiciary?

  9. **Corpus Linguistics as a Methodological Tool**
  Some textualists are increasingly turning to corpus linguistics—analyzing large databases of historical language use—to determine ordinary meaning. Do you view this as a necessary evolution to make textualism more empirical, or do you worry it risks becoming a "law office history" where judges simply cherry-pick data sets that confirm their pre-existing conclusions about the text?

  10. **The "Dead Hand" Problem and Democratic Legitimacy**
  Textualism is often defended on democratic grounds: it respects the words Congress passed. However, critics argue it binds the current populace to the specific linguistic choices of a past Congress, even when circumstances have radically changed. Does textualism risk privileging the "dead hand" of a past legislature over the ability of the current political process to address modern problems through flexible interpretation?
