answer: |-
  Here are ten interview questions drafted for your podcast. The first three form the requested sequence on the "disintegration thesis," while questions four through six address the specific objections from Devlin's critics (Disgust, Hart, and Dworkin), complete with follow-ups. The final four questions broaden the scope to pluralism, proportionality, and practical application.

  ### Part 1: The Disintegration Thesis (Sequence)

  **1.** In your recent talk, you clarified that your argument isn't a sociological prediction that society will literally collapse if surrogacy is legal, but rather a conceptual claim about what constitutes a political community's identity. If we grant you that opening move—that shared morality is the "bond" of society rather than just a tool for survival—how do we identify *which* specific moral bonds are essential enough to maintain that identity, and which are merely peripheral preferences?

  **2.** Following up on that: If the threat isn't empirical collapse but a loss of "identity," doesn't that lower the bar for state coercion? Historically, societies have changed their moral identities significantly without ceasing to be societies. Why is preserving this specific moral identity worth the liberty cost of criminalization, rather than just social censure or civil regulation?

  **3.** You've argued that pointing to liberal societies that haven't collapsed misses the point because your thesis is conceptual, not empirical. But if no empirical evidence can count against your view, we have to ask: What *would* you accept as evidence against it? Is there any observation, argument, or real-world outcome that could convince you that commercial surrogacy should *not* be criminalized on these grounds?

  ### Part 2: Classic Objections (With Follow-Ups)

  **4.** Devlin famously argued that the law is justified when the "reasonable man" feels feelings of "intolerance, indignation, and disgust." However, history shows these exact feelings often tracked nothing more than prejudice—justifying anti-miscegenation laws or sodomy laws. How does your revival of this view distinguish between a "genuine moral conviction" worthy of criminal law and "bare prejudice" that should be ignored, without simply importing the liberal principles you're critiquing?
  *   **Follow-up:** *If he answers that we use "rational reflection" to filter out prejudice:* Who gets to decide what counts as rational? If the majority feels disgust even after reflecting on the facts, does your theory still require the state to criminalize the behavior?

  **5.** H.L.A. Hart criticized Devlin for conflating a society's "positive morality" (what people *happen* to believe) with "critical morality" (what is *actually* justifiable). By criminalizing surrogacy based on current shared feelings, aren't you risking the enforcement of a positive morality that might be critically wrong? Why should the law defer to the former rather than aiming for the latter?
  *   **Follow-up:** *If he answers that democratic law must reflect the people's values:* Does that mean if 51% of the population believed surrogacy was a form of witchcraft based on bad science, the law should treat it as such?

  **6.** Ronald Dworkin objected that what looks like moral consensus is often just shared prejudice, factual error, or people repeating what they've been told dressed up as conviction. If public opposition to surrogacy is partly based on misconceptions about biology or the nature of parenthood, does your theory require us to criminalize based on those mistakes?
  *   **Follow-up:** *If he answers that we should educate the public first:* If education doesn't change the feeling, and the "consensus" remains based on a factual error, does the state still have the right to enforce that error through the criminal law?

  ### Part 3: Scope and Application

  **7.** Devlin wrote in a context where British society was relatively homogeneous. In a pluralistic society like the U.S., where there are deep moral disagreements about family, biology, and commerce, who determines what the "shared morality" actually is? Does your view risk imposing the morality of one demographic over others in the name of "community"?

  **8.** Devlin eventually adopted a "toleration principle," suggesting the law should not intervene in private matters unless they become public. Commercial surrogacy is contractual and often private until a birth occurs. How do you justify moving this from the private sphere into the realm of criminal offenses without violating Devlin's own safeguard against over-criminalization?

  **9.** Even if we accept that surrogacy is morally wrong on your account, criminal law is the blunt instrument of the state. Why is *criminalization* the necessary response rather than, say, refusing to enforce surrogacy contracts in civil court, or imposing regulations that discourage the practice without threatening imprisonment?

  **10.** To close, many of our listeners are high school students interested in law and philosophy. If they take away one thing from your book regarding the relationship between morality and law, what do you hope it is? And for those who disagree with you, how do you hope they engage with the legal moralist tradition moving forward?
