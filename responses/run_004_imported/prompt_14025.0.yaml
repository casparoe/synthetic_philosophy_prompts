              1.  Pre-existing math (non-Euclidean geometry, group theory) developed *before* physical application (challenges "selection for" physics).
              2.  Wigner's point on extrapolation/predictive power beyond original motivation (Newtonian gravitation).
              3.  Dirac's equation (mathematical elegance guiding discovery *ahead* of evidence).
              4.  Concrete definition of what *would* count as "unreasonable" effectiveness if Wigner's examples don't.
          *   Format: Each question needs a short follow-up anticipating a sidestep.
          *   Tone: Intellectual, respectful, probing, suitable for a podcast conversation between a scientist and a philosopher.

  2.  **Deconstruct the Guest's Thesis (Selection Bias/Streetlight Effect):**
      *   *Core Argument:* We only notice the math that works. We ignore the math that doesn't. Therefore, the success rate isn't surprising.
      *   *Weaknesses/Challenges:*
          *   Math developed without *any* physical intent that later fits perfectly.
          *   Math that predicts *new* phenomena, not just fits old data.
          *   The role of aesthetic criteria (elegance, symmetry) in choosing math *before* empirical verification.
          *   The definition of "unreasonable" – if this isn't it, what is?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: Introduction/Context.* Need to set the stage without just asking "Tell us your thesis." Let's ask about the *scope* of the bias.
      *   *Question 2: The "Pre-existing Math" Challenge (Required).* Focus on Riemann/Group Theory. How do you select for physics if physics isn't the goal?
          *   *Follow-up:* She might say "mathematicians select for internal consistency which happens to align." Need to press on *why* that alignment exists.
      *   *Question 3: The "Extrapolation" Challenge (Required).* Newton/Kepler. Fitting data vs. predicting new domains. Selection bias explains fitting, does it explain extrapolation?
          *   *Follow-up:* She might say "we forget the theories that failed to extrapolate." Press on the *degree* of success.
      *   *Question 4: The "Dirac/Elegance" Challenge (Required).* Aesthetic guidance. If math is just a tool, why does beauty work?
