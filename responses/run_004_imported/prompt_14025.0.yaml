      *   *Question 6: The "Tool vs. Language" distinction.* Is math invented or discovered? How does her view fit?
      *   *Question 7: The "Failed Math" inventory.* Can she name specific mathematical frameworks that were applied to physics and *failed*? If the pile is so big, show us the corpses.
      *   *Question 8: The Role of the Physicist.* Are physicists passive samplers or active shapers? Do we force nature into the streetlight?
      *   *Question 9: The "Unification" aspect.* Math often unifies disparate phenomena (Maxwell). Does selection bias explain unification?
      *   *Question 10: Closing/Implications.* If Wigner is wrong, what does that mean for future theory building?

  4.  **Refining and Polishing (Checking against constraints):**
      *   *Tone Check:* Ensure it sounds like a physicist talking (pragmatic, empirical focus) to a philosopher (conceptual focus).
      *   *Constraint Check:* Did I cover Non-Euclidean/Group Theory? Yes (Q2). Newton/Extrapolation? Yes (Q3). Dirac/Elegance? Yes (Q4). Definition of Unreasonable? Yes (Q5).
      *   *Count:* Need 9 or 10. I have 10 ideas above. Let's refine them to be sharp.
      *   *Follow-ups:* Ensure they anticipate specific philosophical dodges (e.g., moving the goalposts, redefining terms, appealing to social construction).

  5.  **Final Review of the Draft:**
      *   *Q1 (Scope):* Focus on the denominator of the bias.
      *   *Q2 (Pre-existing):* Riemann/Group Theory. *Follow-up:* Anticipate "math evolves to match cognition."
      *   *Q3 (Extrapolation):* Newton/General Relativity. *Follow-up:* Anticipate "survivorship bias on theories."
      *   *Q4 (Dirac):* Aesthetic guidance. *Follow-up:* Anticipate "beauty is just symmetry."
      *   *Q5 (Definition):* What counts as evidence against her? *Follow-up:* Anticipate "it's a philosophical claim, not empirical."
      *   *Q6 (Failed Math):* Ask for examples of math that *didn't* work. *Follow-up:* Anticipate "they weren't serious attempts."
      *   *Q7 (Active Shaping):* Do we tune experiments to fit math? *Follow-up:* Anticipate "all observation is theory-laden."
      *   *Q8 (Unification):* Maxwell/Standard Model. *Follow-up:* Anticipate "we define unification as success."
      *   *Q9 (Cognitive Alignment):* Is it our brains or the world? *Follow-up:* Anticipate "evolutionary psychology."
      *   *Q10 (Future):* Should we stop looking for deep math? *Follow-up:* Anticipate "pragmatism."

      *Self-Correction on Q1:* Make it more about the "streetlight" metaphor itself. Where is the dark?
      *Self-Correction on Q5:* Make sure it asks for a *concrete* scenario.

      *Let's finalize the list to ensure high quality and variety.*

