answer: |-
  **Setting:** *The back corner of "Page & Paradox," a used bookstore that smells of vanilla and decaying lignin. It's a rainy Tuesday. ELIAS (50s, wears a corduroy jacket, prefers the Summa) and MARA (30s, wears a worn denim jacket, prefers the Commentaries) are standing in the Scholasticism aisle. They have clearly done this before.*

  **MARA:** *(Pulling a slim paperback from the shelf)* You're avoiding the *Sentences*. I can see it in your face. You walk past the green spine like it's cursed.

  **ELIAS:** It's not cursed, Mara. It's a student commentary. It's Aquinas reading Peter Lombard, not Aquinas thinking for himself. If you want the mature position, you go to the *Summa* or *De Regno*. And in both of those, the door is shut. Private tyrannicide is sedition. Sedition is a mortal sin. End of story.

  **MARA:** That is a very convenient end to the story, but it requires you to ignore the text where he explicitly says the opposite. In *In II Sent., d. 44, q. 2, a. 2*, he's asked if it's licit to kill a tyrant. He doesn't say "wait for public authority." He says, "He who frees his country by killing a tyrant is praised and rewarded." *Laudatur et praemiatur.* That's not the language of someone hedging a bet.

  **ELIAS:** Context. In that same passage, he's discussing the Old Law. He's talking about figures like Ehud and Eglon. Ehud wasn't a private citizen acting on a whim; he was a Judge of Israel. He held a commission. He was acting with public authority, even if that authority was divinely inspired rather than procedurally elected. Aquinas is consistent: you cannot kill a ruler unless you have the standing to judge him. A private individual has no standing.

  **MARA:** But that begs the question of what a "ruler" is. This is where your reading of *De Regno* gets too cozy with the crown. Aquinas makes a distinction, right there in the text, between the tyrant *ex defectu tituli* and the tyrant *ex parte exercitii*.

  **ELIAS:** *(Sighs, leaning against a stack of encyclopedias)* Here we go. The usurper versus the bad king.

  **MARA:** It's not just a label, Elias. It's ontological. If a man seizes power by force, without election, without hereditary right, without the consent of the community—he has no title. He is not a king. He is an aggressor. Aquinas says authority is for the common good. If you seize power for private gain, you haven't entered the office of kingship. You're just a criminal with a larger sword. Killing him isn't regicide; it's self-defense.

  **ELIAS:** And who decides that? You? Me? The guy with the gun in the next province? That is the precise danger Aquinas warns about in *De Regno*. He says if private persons presume to kill tyrants, "no tyrant could be more deadly to the multitude than this."

  **MARA:** He's warning against killing a *legitimate* king who has gone bad. I agree with that. If the king has the title but rules poorly, you cannot kill him. You have to wait for public authority to depose him, or pray, or suffer. But Aquinas isn't a pacifist about injustice. If the "king" is actually a usurper, the public authority *is* the people defending themselves. There is no higher court to appeal to.

  **ELIAS:** But that assumes the people can accurately judge the validity of a title without causing a civil war. Look at the example Aquinas uses in *De Regno*. Caesar. Was Caesar a usurper? Many Romans thought so. Brutus thought so. They killed him to "free the republic." And what happened? Augustus. A worse tyranny. Aquinas uses this historically to argue that the risk of the remedy is often worse than the disease. He prioritizes order because disorder is the death of the common good.

  **MARA:** Order for whom? If I'm living under a usurper, I'm already in a state of war. Aquinas knows that law is an ordinance of reason for the common good. A usurper's edicts aren't law; they're acts of violence. In the *Summa*, II-II, Q. 64, he says it's lawful to kill an aggressor in self-defense. Why is the polity not allowed to defend itself against the ultimate aggressor?

  **ELIAS:** Because the polity acts through its heads, not its hands. That's the body politic metaphor. You don't let the hand cut off the head because the head hurts; you let the nervous system—the public institutions—handle it. Even with a usurper, Aquinas insists in *De Regno* that you should look to a "superior authority" to intervene.

  **MARA:** And if there is no superior? That's the Cyprus problem. *De Regno* was written for the King of Cyprus. Of course he's going to tell a king, "Don't let people kill rulers." It's advice *for* a ruler. The *Sentences* is theology. It's about the moral act itself. If the title is defective, the bond of allegiance is void. There is no "superior" to a sovereign. If the sovereign is a fake, the bond is dead.

  **ELIAS:** You're making it sound like a contract. It's not a contract; it's an order of being. Even a bad legitimate king holds the *place* of God on earth. That's why Aquinas says in *De Regno* that tyranny is permitted by God to punish the people's sins. To kill him is to fight against God's judgment.

  **MARA:** And that's where I think you flatten him. Aquinas is an Aristotelian. Authority comes from below, from the community, ultimately. He says in *De Regno* that it's better for a kingdom to be administered by one man, *provided* he seeks the common good. If he seeks private good, he is a tyrant. But the distinction matters. If he *never* had the right to be there, he isn't punishing the people; he's robbing them. Aquinas says in the *Sentences* that such a man "does not incur the crime of sedition" who kills him. That is a specific exemption.

  **ELIAS:** "Sedition." That's the key word. Sedition is opposing the unity of the multitude. But in the *Summa*, he broadens the prohibition on killing. He says private individuals cannot execute justice. It doesn't matter if the guy is a usurper. If you kill him without a public mandate, you are usurping the function of judgment. You are making yourself the judge. And Aquinas thinks that pride is the root of sin.

  **MARA:** But judgment can be implicit. If a burglar breaks into my house, I don't wait for a judge to tell me I can lock the door. The urgency of the threat confers the right of defense. A usurper is a burglar in the house of the state.

  **ELIAS:** The state isn't a house, Mara. It's a complex web of obligations. If you kill the burglar, fine. But if you kill the man everyone *thinks* is the owner, you plunge the neighborhood into a feud. Aquinas is a pragmatist. He knows that most "liberators" become tyrants. He says in *De Regno*, "Often, those who kill tyrants end up tyrants themselves." The psychological corruption of the act is part of the moral calculus.

  **MARA:** So we just suffer? That's the *De Regno* conclusion. "Wait on public authority." But what if the public authority is the tyrant's army? What if the "superior" is the Pope who is in the tyrant's pocket? Aquinas isn't naive. He knows the Church and Empire are messy. The *Sentences* passage is the safety valve. It acknowledges that there are edge cases where the title is so void, the tyranny so absolute, that the act of killing is an act of justice, not sedition.

  **ELIAS:** A safety valve that explodes the boiler. If you tell people, "You can kill him if you think his title is bad," you will never have peace. Every faction will claim the other is a usurper. The Wars of Religion proved this. The Huguenots read Aquinas exactly like you do. "He's a tyrant *ex defectu tituli*." So they killed. And Europe burned for a century.

  **MARA:** And sometimes, Europe needed to burn to clear out the rot. But look, I'm not saying it's a free-for-all. Aquinas sets a high bar. He says the tyranny must be excessive. He says the killer must be motivated by love of country, not ambition.

  **ELIAS:** And who verifies the motivation? Only God. Which means, for human law and human morality, the act remains illicit. That's why the *Summa* is the final word. It systematizes the earlier thoughts. In the *Summa*, he doesn't reiterate the "praised and rewarded" line about tyrannicide. He emphasizes the sin of sedition. The silence is deafening.

  **MARA:** Or he assumes the distinction is understood. You're reading the *Summa* as a retraction. I'm reading it as a foundation. He lays out the general rule in the *Summa*: private killing is wrong. He lays out the exception in the *Sentences*: unless the authority is non-existent. They fit together. You're trying to make the exception disappear because it makes you nervous.

  **ELIAS:** It makes me nervous because Aquinas was nervous. He lived in a world of feuding barons. He knew that "tyrant" is the first word every rebel shouts. His caution in *De Regno* isn't just political advice; it's moral theology. It's about the virtue of patience. It's about trusting that God can bring good out of evil without you having to commit murder.

  **MARA:** Patience is a virtue. Complicity is a vice. If I see a man enslaving my neighbors, and I have the knife, and I know he has no right to be there... Aquinas says I merit praise. You say I merit hell. I think I know which Aquinas is closer to the Gospel.

  **ELIAS:** *(Taps the spine of a thick volume)* And I think you're reading the Gospel through the lens of a revolutionary. Aquinas is a Dominican. He's a friar. His job is to save souls, not regimes. A dead tyrant doesn't save a soul if the killer loses his own to pride.

  **MARA:** *(Puts the book back on the shelf, but keeps her hand on it)* Then why keep the *Sentences* in the canon? Why not burn it?

  **ELIAS:** Because it shows he was human. He thought it through. And he landed on order.

  **MARA:** *(Smiles faintly)* He landed on justice. Order is just the box justice lives in. Sometimes you have to break the box.

  **ELIAS:** *(Shakes his head, picking up his own basket)* And sometimes the box is all that's keeping the roof up. I'm buying the *Summa*. Again.

  **MARA:** I'll take the *Sentences*. Maybe I'll find a note in the margin this time.

  **ELIAS:** Just don't act on it without a public mandate, Mara.

  **MARA:** Only if the mandate comes from heaven, Elias. Only if it comes from heaven.

  *(They nod, a silent acknowledgment that neither has moved the other an inch, and walk toward the counter in opposite directions.)*
