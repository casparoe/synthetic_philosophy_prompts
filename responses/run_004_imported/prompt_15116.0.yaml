          *   *View B (Usurper vs. Legitimate):* There is a genuine distinction between a *tyrannus ex defectu tituli* (usurper, no claim) and a *tyrannus ex parte exercitii* (legitimate title, bad exercise). Killing the usurper is licensed/praised; killing the legitimate tyrant is not.
