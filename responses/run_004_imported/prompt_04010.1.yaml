  **(C) Contradiction in the Will:** While a world where everyone protects their emotional health is conceivable, a rational agent cannot consistently will a universal law that denies mutual aid during suffering, as they themselves necessarily will to receive help when in need.

  **(D) Contradiction in the Will:** Corresponding to Kant's "buried talent" example, this fails because rational beings necessarily will the development of their faculties as means to various ends, and cannot consistently will a universal law of neglecting them for mere leisure.

  **(E) Contradiction in the Will:** Although not logically impossible, a rational agent cannot will a universal law of selfishly appropriating shared resources, as this creates a state of conflict that undermines the cooperative conditions rational beings require for shared comfort.

