  1.  **Analyze the Request:**
      *   **Task:** Apply Kant's Formula of Universal Law (FUL) two-step procedure to six specific maxims (A-F).
      *   **Procedure:**
          1.  Check for Contradiction in Conception (CC): Can the maxim be universalized without logical contradiction? If no -> Perfect Duty (Impermissible).
          2.  Check for Contradiction in the Will (CW): If it passes CC, can a rational agent will this universal law without contradicting their own will (given necessary ends of rational beings)? If no -> Imperfect Duty (Impermissible).
          3.  If it passes both -> Permissible.
      *   **Output Format:** JSON block with "classification" and "ranking", followed by a couple of sentences of justification per maxim.
      *   **Ranking:** From "most clearly impermissible" to "least clearly impermissible" (note: this implies ordering by severity of failure, but some might pass. I need to interpret "least clearly impermissible" carefully. Usually, this means worst violation to best/no violation. However, the prompt asks to rank "all six maxims from most to least clearly impermissible under the test overall". This suggests a spectrum where passing maxims are at the "least impermissible" end. I should order them: CC failures (perfect duties) first, then CW failures (imperfect duties), then passes. Within categories, judge severity.)
      *   **Constraint:** The user wants a JSON block followed by text justifications.

