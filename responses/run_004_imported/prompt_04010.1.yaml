          *   *CC:* No logical contradiction. The world can exist where everyone does this.
          *   *CW:* Can a rational agent will this? Yes. It promotes self-discipline and preparation. It doesn't undermine any necessary end of rational agency.
          *   *Verdict:* **Passes**. (Permissible, possibly even commendable, but not strictly required as a duty in this specific formulation).

      *   **Maxim (B):** "I will claim credit for group projects whenever my individual contribution is too ambiguous for others to verify, since some ambiguity in group work is unavoidable."
          *   *Universalization:* Everyone claims credit for group projects whenever individual contribution is ambiguous/unverifiable.
          *   *CC:* If everyone did this, the concept of "credit" or "verification of contribution" would collapse. Trust in group work attribution would vanish. The institution of collaborative credit relies on honesty. If everyone lies when they can get away with it, the system of assigning credit becomes meaningless. This is similar to False Promising.
          *   *Verdict:* **Contradiction in Conception**. (Perfect Duty against lying/fraud).

      *   **Maxim (C):** "I will withhold emotional support from friends going through hard times whenever giving it would require me to relive my own past pain, since self-protection can reasonably take priority over comforting others."
