prompt: |-
  I write about forecasting and the "superforecaster" world for a living, and a couple years back I did a piece that touched on van Fraassen's Reflection Principle -- roughly, the idea that your credence now should equal whatever you expect your future, presumably better-informed credence to be, on pain of being exploitable across time the same way an incoherent bettor is exploitable right now. Mostly forgot about it until this week, because I somehow ended up on the methodology committee for a university forecasting tournament (a decade of covering this stuff apparently gets you drafted onto things), and we've got a real mess. Our top-ranked forecaster had an independent 15% on a big geopolitical question, then revised to 45% right after the live consensus number went up on the leaderboard, and her rationale literally reads: "my own analysis hasn't moved, but when this many good forecasters disagree with me I should expect that's roughly where I'll land once I actually see their reasoning, so I'm just moving now instead of waiting." Half the committee wants to score this as exactly the calibrated humility we should be rewarding; the other half thinks its contentless herding that'll gut the independence the whole wisdom-of-crowds effect depends on if we start scoring it well. We need an actual policy before the next season opens in six weeks: how should the scoring rule, and our guidance to forecasters, treat "deferring to my anticipated future self" as grounds for revising a forecast? Write the committee memo -- a real recommendation, not a survey of considerations, and be honest about the strongest case for whichever side you don't pick.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university forecasting tournament methodology committee.
      *   **Audience:** The rest of the committee (experts, likely mixed backgrounds in stats, psych, forecasting).
      *   **Task:** Write a committee memo recommending a specific policy on how to treat forecast revisions based *solely* on the "Reflection Principle" (deferring to anticipated future self/consensus) without new private information.
      *   **Context:** A top forecaster moved from 15% to 45% solely because the consensus moved, citing van Fraassen's Reflection Principle (expecting to agree with better-informed future self/peers).
      *   **Conflict:** Half the committee sees this as calibrated humility (good); half sees it as contentless herding (bad for independence/wisdom of crowds).
      *   **Constraint:** Must make a *real recommendation*, not just list pros/cons. Must be honest about the strongest case for the *rejected* side.
      *   **Tone:** Professional, analytical, decisive, nuanced (since the user writes about this for a living, they know the jargon and the stakes).

  2.  **Deconstruct the Core Issue:**
      *   **The Principle:** Van Fraassen's Reflection Principle states $P_t(A) = E_t[P_{t+1}(A)]$. If I expect my future self (with more info) to believe $X$, I should believe $X$ now.
      *   **The Application:** The forecaster treats the *current consensus* as a proxy for their *future informed self*. They haven't seen the new info (the reasoning of others), but they trust the aggregate judgment.
      *   **The Risk:** If everyone does this, independence vanishes. The crowd becomes an echo chamber. Scoring rules (Brier/Log) reward accuracy, but if the "truth" is binary, herding reduces the diversity needed to find the truth.
      *   **The Benefit:** It prevents stubbornness. It acknowledges that the crowd often knows more than the individual. It aligns with Bayesian updating where the "evidence" is the existence of other experts' beliefs.

  3.  **Determine the Recommendation:**
      *   *Option A: Ban it.* (Too hard to enforce, punishes Bayesian updating on social evidence).
      *   *Option B: Reward it fully.* (Encourages herding, kills diversity).
      *   *Option C: A Middle Path (The "Meta-Belief" Distinction).* Distinguish between updating on *information* vs. updating on *social pressure*.
      *   *Decision:* The recommendation should be to **allow the revision but decouple it from "independence" metrics, and potentially weight scoring to penalize pure herding in aggregation.** However, for a *scoring rule* policy, the cleanest approach is to treat the *reasoning* as the key.
      *   *Refined Decision:* We cannot police thoughts. We must police the *incentive structure*. If we want independence, we need to reward *unique accurate signal*, not just *accuracy*.
      *   *Best Policy:* **Accept the revision as valid for individual scoring (Brier), but explicitly exclude it from "diversity" or "independence" bonuses, and issue guidance that distinguishes between "updating on the fact of consensus" (valid Bayesian evidence) vs. "updating to match consensus" (herding).**
      *   *Actually, stronger stance:* The prompt asks how to treat "deferring to anticipated future self" as grounds. The problem is using the *current* consensus as a proxy for *future* information without actually acquiring the information. This is "social proof" masquerading as "reflection."
      *   *Final Verdict:* **Endorse the revision for individual accuracy scoring (because it's likely more accurate), but flag it in guidance as distinct from analytical updating. Do not penalize the score, but do not reward it as "insight."** Wait, the prompt asks about *scoring rule and guidance*.
      *   *Pivot:* If we penalize it, we punish rationality. If we reward it, we encourage herding. The solution is to **maintain standard proper scoring rules (Brier/Log) which reward accuracy regardless of reasoning, BUT add a specific guidance clause that requires forecasters to distinguish between 'private signal' and 'social signal' in their rationales, and use the latter only for aggregation weighting, not individual scoring.**
      *   *Wait, simpler:* The committee needs a policy *now*. The most robust position is: **Individual scoring remains blind to reasoning (accuracy is king), BUT tournament ranking/aggregation should discount forecasts identified as pure herding.**
      *   *Actually, the most practical policy:* **Do not change the scoring rule (proper scoring rules must remain proper), but change the *guidance* to clarify that Reflection Principle applies to *information*, not *opinions*, unless those opinions are treated as data.**
      *   *Let's go with this:* **Recommendation: Retain standard proper scoring for individual accuracy (don't punish rational updating), but implement a "Reasoning Transparency" requirement where forecasters must tag updates as 'New Info' vs. 'Consensus Shift'. Forecasts tagged 'Consensus Shift' are excluded from 'Top Diverse Forecaster' awards and down-weighted in the aggregation algorithm.** This balances accuracy with diversity.

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Subject:** Policy on Forecast Revisions Based on Consensus/Reflection Principle.
      *   **Opening:** Acknowledge the specific incident (15% -> 45%). State the recommendation clearly upfront.
      *   **Rationale (The "Why"):** Explain why we keep proper scoring (accuracy matters) but why we need to protect diversity (wisdom of crowds).
      *   **The Strongest Counter-Argument:** Acknowledge that penalizing/discouting herding might punish Bayesian rationality. If the crowd is right, following them is smart.
      *   **Implementation:** Specific changes to the platform/guidance.
      *   **Closing:** Timeline for rollout.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is discounting herding in aggregation feasible? Yes, many tournaments use weighted averages.
      *   *Critique:* Is asking forecasters to tag updates feasible? Yes, a dropdown menu.
      *   *Nuance:* The Reflection Principle argument is technically about *your own* future credence. Using *current consensus* as a proxy is an extension (Social Reflection). I need to make sure I don't conflate them too much. The forecaster argued: "I expect to land there once I see their reasoning." That is a valid Bayesian update on the *existence* of their reasoning, even before seeing it.
      *   *Key Distinction:* Updating on the *fact* of disagreement vs. updating to *match* the disagreement.
      *   *Policy:* We can't ban the update. It might be accurate. We must protect the *ecosystem*.
      *   *Revised Recommendation:* **Keep scoring rules unchanged (accuracy is objective), but introduce a "Diversity Weighting" mechanism for tournament prizes/aggregation that penalizes high correlation with the mean *unless* justified by new private information.**
      *   *Wait, one more check:* The prompt asks about "scoring rule AND guidance." Proper scoring rules (Brier) *cannot* be modified to penalize herding without ceasing to be proper (they would no longer incentivize true credence). I must be careful not to suggest breaking the proper scoring rule.
      *   *Correction:* I cannot change the *scoring rule* itself (e.g., Brier Score) to penalize herding, because that breaks the incentive to report true probability. I can only change *how scores are used* (ranking, prizes, aggregation).
      *   *Final Plan:*
          1.  Scoring Rule: No change (must remain proper).
          2.  Guidance: Clarify the distinction between updating on evidence (consensus as data) vs. social conformity.
          3.  Incentives: Introduce a "Independent Insight" bonus/metric that requires low correlation with consensus + high accuracy.

  6.  **Writing the Tone:**
      *   Needs to sound like someone who knows forecasting (Brier, Log, Calibration, Resolution, Independence).
      *   Needs to be decisive but respectful of the philosophical depth (van Fraassen).
      *   Needs to address the "honesty about the other side" constraint.

  7.  **Final Polish:** Check the van Fraassen reference. Reflection Principle is $P_t(A) = E_t[P_{t+1}(A)]$. The forecaster is saying $P_{t+1}$ (after reading reasons) $\approx$ Consensus$_t$. So $P_t$ should move to Consensus$_t$. This is rational *if* the consensus is a reliable proxy for the future info. The risk is circularity if everyone does it.

      *Decision:* I will recommend **maintaining the proper scoring rule** (to preserve truth-telling incentives) but **modifying the tournament ranking criteria** to reward *uncorrelated accuracy*. I will also mandate **update tagging**.

      *Wait, looking at the prompt again:* "How should the scoring rule, and our guidance to forecasters, treat 'deferring to my anticipated future self'..."
      Okay, I need to address the scoring rule specifically. I should argue *against* changing the scoring rule itself, but *for* changing the guidance and the *aggregation/ranking* layer. Changing the scoring rule to penalize herding makes it improper. I need to explain *why* I'm not changing the scoring rule as part of the recommendation.

      *Actually, a bolder move:* Recommend a **hybrid scoring system**. Base score on Brier (accuracy). Bonus score on "Contribution to Crowd Wisdom" (how much you moved the needle uniquely). This addresses both sides.

      *Let's stick to the cleanest policy:*
      1.  **Scoring:** Keep Brier/Log unchanged. (Crucial for integrity).
      2.  **Guidance:** Explicitly validate "Consensus as Evidence" but warn against "Consensus as Anchor."
      3.  **Ranking:** Add a "Resolution" or "Independence" metric for final standings.

      *Wait, the prompt asks for a "real recommendation."* I need to pick a side on whether this behavior is *good* or *bad* for the *tournament's goals*.
      If the goal is Accuracy: It's good.
      If the goal is Wisdom of Crowds (diversity): It's bad.
      Most tournaments want accurate aggregate forecasts.
      *My stance:* The behavior is rational for the individual but toxic for the collective if unchecked.
      *Policy:* Allow it for individual scoring, but discount it for *leaderboard ranking* if it lacks private signal.
      *Actually, the most actionable advice:* **Require forecasters to distinguish between 'Information Updates' and 'Social Updates' in the rationale field. Social Updates count for individual accuracy scores but are excluded from 'Top Forecaster' qualification which requires a minimum 'Independent Signal' score.**

      *Let's write it.*

      *Structure:*
      1.  Header.
      2.  Executive Summary (The Recommendation).
      3.  Analysis of the Incident (Reflection Principle vs. Herding).
      4.  The Policy (Scoring + Guidance).
      5.  The Counter-Argument (The case for pure herding).
      6.  Implementation.

      *Tone Check:* Professional, authoritative, slightly academic but practical.

      *Key phrase to include:* "Proper scoring rules must remain proper."
      *Key distinction:* "Updating on the *existence* of evidence vs. updating on the *content* of evidence."

      *Let's refine the "Strongest Case for the other side".* The other side says this is calibrated humility. The strongest case is that refusing to update on consensus is *arrogance* and leads to worse individual calibration. I need to acknowledge that punishing this hurts individual rationality.

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Methodology Committee, University Forecasting Tournament
  **FROM:** [Your Name], Methodology Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Policy Recommendation on Forecast Revisions Based on Consensus/Reflection Principle

  ### Executive Summary

  Following the incident in Question #42 (Geopolitical Stability Index), where a top-ranked forecaster revised their probability from 15% to 45% citing only the movement of the live consensus, the committee must clarify our stance on "social updating."

  **Recommendation:** We should **retain our current proper scoring rules (Brier/Log) unchanged** for individual question scoring, but **implement a dual-track ranking system** for season-end awards. Individual accuracy scores will reflect all valid revisions. However, eligibility for "Top Forecaster" distinctions and weight in the tournament's aggregate "Superforecast" will require a minimum threshold of "Independent Signal"—defined as accurate revisions accompanied by private information or novel reasoning, rather than consensus alignment alone.

  Simultaneously, we will update **Forecaster Guidance** to explicitly distinguish between *updating on the existence of evidence* (valid) and *updating to match the crowd* (herding). We will require forecasters to tag revisions as "New Information," "New Analysis," or "Consensus Alignment" upon submission.

  ### Analysis of the Conflict

  The forecaster in question invoked van Fraassen's Reflection Principle: $P_t(A) = E_t[P_{t+1}(A)]$. Their argument is that the current consensus is a high-fidelity proxy for the information they will possess once they review the community's reasoning. Therefore, to remain diachronically coherent, they should update now.

  **The Case for Allowing It (Calibrated Humility):**
  This is Bayesian rationality applied to social epistemology. If I know 50 experts have seen data I haven't, their aggregate belief *is* data. Refusing to update on that fact is stubbornness, not independence. If we penalize this via the scoring rule, we are effectively punishing forecasters for being rational Bayesians. We risk incentivizing "contrarianism for contrarianism's sake," where forecasters ignore strong social signals to game a diversity metric, degrading individual calibration.

  **The Case Against It (Contentless Herding):**
  If the Reflection Principle becomes the dominant strategy, the tournament collapses. If Forecaster B updates solely because Forecaster A updated, and Forecaster A updated because of the consensus, we create a feedback loop with no anchor to reality. The "Wisdom of Crowds" relies on the *independence* of errors. If errors become correlated through social deference, the aggregate forecast loses its predictive power. We risk turning the tournament into a beauty contest where the goal is to guess what others will guess, rather than guess what will happen.

  ### The Recommendation

  We cannot solve this by altering the **scoring rule** itself. A scoring rule that penalizes herding ceases to be a *proper* scoring rule; it would no longer incentivize forecasters to report their true credence, but rather to report a "strategic" credence that balances accuracy against correlation. This breaks the fundamental integrity of the tournament.

  Instead, we solve this at the **incentive and aggregation layer**.

  **1. Scoring Rule (No Change)**
  Individual question scores (Brier/Log) will continue to reward accuracy regardless of the rationale. If the event happens, and the forecaster moved to 45% because the crowd did, they deserve the points. To do otherwise is to punish truth-tracking.

  **2. Forecast Guidance (New Protocol)**
  We will issue a directive clarifying the "Reflection Principle" in a tournament context:
  *   **Valid:** "I am updating because the *existence* of this consensus implies private information exists within the crowd that I have not yet seen." (Treating consensus as data).
  *   **Invalid:** "I am updating because I want to align with the crowd to avoid being an outlier." (Social conformity).
  *   **Requirement:** All revisions must be tagged with one of three labels: *New Info*, *New Analysis*, or *Consensus Alignment*.

  **3. Ranking and Aggregation (The "Independent Signal" Metric)**
  This is the critical lever.
  *   **Season Awards:** To qualify for "Top Forecaster" prizes, participants must derive at least 40% of their score from questions where their revision tag was *New Info* or *New Analysis*. This ensures our champions are generating signal, not just riding it.
  *   **Tournament Aggregate:** In constructing the official "University Forecast" (the crowd prediction), weights will be dynamically adjusted. Forecasts tagged *Consensus Alignment* will receive reduced weight in the aggregation algorithm relative to *New Analysis* forecasts. This preserves the wisdom of the crowd by prioritizing the diverse inputs that create it.

  ### The Strongest Case for the Rejected Alternative

  I must be candid about the risk of this recommendation. By creating a "Independent Signal" requirement for awards, we are effectively creating a tax on rationality.

  There will be instances where the crowd is overwhelmingly right, and the only rational move *is* to herd. In those specific cases, our policy forces a forecaster to choose between **being right** (following the crowd) and **being rewarded** (finding a unique angle that may not exist). We risk incentivizing forecasters to manufacture false nuance or dig for low-value private signals simply to clear the "Independence" threshold.

  The opposing committee members are correct that true calibration sometimes requires surrendering independence. If the market price of a binary option is 99%, and my model says 60%, the Reflection Principle suggests I am missing something massive. By down-weighting that 99% forecast in our aggregation or making it ineligible for awards, we may be systematically discarding our most accurate predictions in high-clarity scenarios. We are prioritizing the *health of the ecosystem* over the *accuracy of specific predictions*.

  ### Implementation Timeline

  *   **Weeks 1-2:** Update platform UI to include revision tagging dropdown.
  *   **Weeks 3-4:** Draft and publish "Guidance on Social Updating" for participant review.
  *   **Week 5:** Finalize aggregation algorithm weights for *Consensus Alignment* tags.
  *   **Week 6:** Season Launch.

  ### Conclusion

  We cannot ban forecasters from being rational. But we can structure the tournament to ensure that rationality does not cannibalize the diversity required for the crowd to be wise. We reward accuracy universally, but we reserve prestige and aggregation weight for those who contribute new light, not just reflect existing heat.

  Please review by Friday so we can finalize the participant handbook.
