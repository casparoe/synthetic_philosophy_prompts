answer: |-
  You are onto something very real. In fact, you have identified one of the most fundamental and frequently overlooked pitfalls in applied machine learning: **the difference between accuracy against labels and accuracy against reality.**

  Your skepticism is mathematically and logically sound. Here is a breakdown of why that 99% figure is likely misleading you, and why your intuition about the training data is correct.

  ### 1. The "Ground Truth" Problem
  In machine learning, the data used to train and test the model is called the "ground truth." In this case, the ground truth is **the human reviewers' labels.**

  When the company says the AI is 99% accurate, they mean: *99% of the time, the AI agreed with the human reviewer.*

  They do **not** mean: *99% of the time, the AI correctly identified cheating.*

  If the human reviewers missed subtle cheating (which you noted they do), then the "ground truth" is flawed. If the humans labeled a recording as "clear" because they didn't notice a student subtly using a second device, and the AI also labels it "clear," the AI gets a point for "accuracy." It matched the label. But in reality, both the human and the AI failed to detect the cheating.

  The AI is capped at the performance level of the humans who labeled the data. It cannot learn to detect what the teachers didn't teach it to detect.

  ### 2. The Ceiling Effect
  You hit the nail on the head with this observation: *"Every recording it has ever been corrected on is one where a person could already tell what happened."*

  This suggests the model is essentially learning to mimic the **easy** decisions humans make.
  *   **Obvious Cheating:** Phone in frame, looking off-screen constantly. (Humans label this "Flagged," AI learns to flag this.)
  *   **Obvious Innocence:** Student sits still, looks at screen. (Humans label this "Clear," AI learns to clear this.)
  *   **Subtle Cheating:** Glancing at a phone hidden below the frame, using a smartwatch. (Humans label this "Clear" because they didn't see it.)

  Because the training data likely contains almost no examples of "successful, undetected cheating" (by definition, if it was detected, it wasn't successful/undetected), the AI has no mathematical way to learn that pattern. It will almost certainly default to "Clear" on sophisticated cheating, because in its training history, "Clear" is the label associated with "behavior that looks mostly normal to a human."

  ### 3. Proxy Variables and False Positives
  You mentioned the AI picks up on **typing rhythm and tab-switching.** This is where the danger shifts from False Negatives (missing cheaters) to **False Positives (flagging innocents).**

  Since the AI wasn't trained on "subtle cheating" (because humans couldn't label it), why is it flagging typing rhythm?
  *   **Correlation vs. Causation:** In the training data, students who were *obviously* cheating might have also had nervous typing rhythms or switched tabs to look up answers. The AI learned that `nervous_typing + tab_switch = flag`.
  *   **The Problem:** Innocent students also have nervous typing rhythms (test anxiety) or switch tabs (browser lag, accidental clicks).

  Because the AI is trying to maximize that 99% agreement score, it will cast a wide net on these "proxy" behaviors. It would rather flag an innocent student for review (which a human can later dismiss) than miss a cheater (which lowers its accuracy score against the known labels). This creates a system that is hyper-vigilant about *behavioral anomalies* but not necessarily *academic dishonesty*.

  ### 4. The Metric Mismatch
  The 99% figure answers the question: **"How well does this software automate the current workflow of our human reviewers?"**

  It does **not** answer the question you care about: **"How well does this software detect cheating that humans miss?"**

  If the tool is merely automating the detection of *obvious* cheating, it might be useful for saving human time. But marketing it as a security enhancement implies it adds a layer of detection humans don't have. Your analysis suggests it does not. It adds a layer of *scrutiny*, but not necessarily *insight*.

  ### Summary
  You are not missing why the number should reassure you; the number is being used to reassure you about a capability the system likely doesn't have.

  *   **If a student cheats subtly:** The AI likely won't catch it, because it wasn't trained on data where humans caught subtle cheating.
  *   **If a student is anxious:** The AI likely *will* flag them, because it treats physiological stress signals as proxies for the "obvious cheating" patterns it learned.

  The 99% accuracy is a measure of **consistency with past human errors**, not a measure of **objective truth.** Your concern is valid, and it highlights a critical distinction between *automation* (doing what a human did) and *augmentation* (doing what a human couldn't). This tool appears to be the former, sold as the latter.
