      *   **The "Ground Truth" Problem:** The "99% accuracy" is measured against the *human labels*. If the human labels are incomplete (missing subtle cheating), the AI's accuracy is only high relative to an incomplete truth. This is a classic "garbage in, garbage out" or "label bias" scenario.
      *   **Generalization vs. Overfitting:** The AI might be picking up correlates of cheating (like nervous typing) that weren't explicitly labeled but correlate with the labeled data. However, if the training data doesn't include "successful undetected cheating," the AI can't learn to identify it.
