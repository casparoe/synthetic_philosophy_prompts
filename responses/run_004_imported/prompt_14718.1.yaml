      *   Avoid condescension.
      *   Be precise about Sidgwick's text (*Methods*, *Personal Idealism*, letters).
      *   Reference specific scholars (Schultz is essential here).

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Did Sidgwick say the SPR failed?* He said evidence was inconclusive but promising enough to warrant hope. He died hoping. But for the *ethical system*, inconclusive = failure to resolve the Dualism.
