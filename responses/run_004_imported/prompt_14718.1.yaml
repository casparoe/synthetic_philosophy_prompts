answer: |-
  This is an exceptionally sharp reading of Sidgwick, and you are right to resist the tendency to compartmentalize the SPR work as a Victorian eccentricity. In recent decades, scholars like Bart Schultz (*Henry Sidgwick: Eye of the Universe*) and Christian Perring have argued exactly what you are suggesting: the psychical research was not a hobby, but a *meta-ethical necessity* for Sidgwick's system.

  You have identified the structural spine of Sidgwick's late thought: **The *Methods of Ethics* identifies a wound (the Dualism); the SPR was the attempt to find a empirical cure for that wound after the theological cure had been surgically removed.**

  Here is a breakdown of the implications of this reading for the two questions you posed.

  ### 1. The Status of the Dualism: Open Problem or Systemic Failure?

  If we accept that the SPR was Sidgwick's attempt to empirically verify the "theological postulate" (that virtue and happiness are ultimately harmonized by a moral governor), then the failure of the SPR to produce conclusive evidence has profound implications for how we read the Dualism of Practical Reason.

  **It transforms the Dualism from an epistemic gap into an ontological feature.**
  In the *Methods*, Sidgwick presents the Dualism as a "fundamental contradiction" in our apparent intuitions of reason. He writes that if the harmony between Duty and Self-Interest cannot be established, "the Cosmos of Duty is thus really reduced to a chaos."
  *   **The Standard Reading:** Sidgwick ran out of time or philosophical tools. Maybe future philosophy will solve it.
  *   **The SPR Reading:** Sidgwick spent 20 years trying to solve it with the tools of empirical science (the only tools left to a post-religious rationalist). He found nothing.

  This suggests we should take the Dualism **extremely seriously**, more so than most contemporary ethicists do. Sidgwick isn't just saying, "I can't figure out how to reconcile these." He is saying, "I have looked for the mechanism that would reconcile these (divine justice or empirical survival), and I cannot find it. Therefore, Reason is currently divided against itself."

  **The Implication for Sidgwick's System:**
  This creates a tension in Sidgwick's own self-conception. He wants to be a rational intuitionist. He believes the axioms of Prudence and Benevolence are equally self-evident.
  *   If the SPR failed to find evidence of survival, then the axiom of Prudence (maximize your own good) and the axiom of Benevolence (maximize the general good) remain in permanent conflict in cases where they diverge (e.g., significant self-sacrifice).
  *   Since Reason cannot adjudicate between two equally self-evident axioms without a higher unifying principle (God/Survival), **Reason is not unified.**

  Therefore, the Dualism is not a bug that can be patched; it is a feature of a secular, rationalist ethics. Sidgwick's honesty forces us to admit that without a metaphysical guarantee, **Rational Egoism is not irrational.** It is just as rational as Utilitarianism. This means the *Methods* ends not with a vindication of Utilitarianism, but with a vindication of the *coherence* of Utilitarianism, paired with an admission that it cannot claim exclusive rational authority over Egoism.

  ### 2. Implications for the Modern Secular Utilitarian (You and the EAs)

  This is where it gets uncomfortable for the modern EA-adjacent philosopher. The EA mindset often operates on the assumption that the "impartial point of view" is the *rational* point of view, and that failing to be impartial is a form of irrationality or bias. Sidgwick's failed rescue attempt suggests otherwise.

  **A. The Loss of "Rational Requirement"**
  If Sidgwick is right, and the Dualism remains unresolved due to the lack of survival/justice guarantees, then impartial altruism is **not rationally required** in the strong sense.
  *   Sidgwick would tell you that when you donate a significant portion of your income to effective charities at the cost of your own life projects or happiness, you are following the axiom of Rational Benevolence.
  *   However, the person who keeps the money to secure their own happiness is following the axiom of Rational Prudence.
  *   Without the "cosmic sanction" (the guarantee that the sacrifice will be compensated in the long run, either via social utility feedback loops or afterlife), Reason has no veto power over the Egoist.

  For the secular utilitarian, this implies that your commitment to impartiality is a **commitment of will**, not a discovery of pure reason. It is a choice to prioritize one self-evident intuition over another. This doesn't make it *wrong*, but it strips it of the "categorical" force that Kantians or some Utilitarians claim for it. You are not obeying Reason *simpliciter*; you are obeying the Moral Reason, while acknowledging that Prudential Reason is shouting just as loud.

  **B. The "Chaos" is Manageable**
  However, there is a way to read this that leaves Utilitarianism in better shape, though it requires modifying Sidgwick's premises.
  Sidgwick assumed that for Ethics to be valid, it must be a system of *commands* that override all other considerations. If Prudence conflicts, Ethics fails.
  *   **Modern Move:** Many contemporary meta-ethicists (e.g., Rawls, Korsgaard, or even Parfit) reject the idea that Rational Egoism is a self-evident axiom comparable to Benevolence.
  *   **Parfit's Solution:** In *On What Matters*, Parfit tries to dissolve the Dualism by arguing that Rational Egoism is not actually self-evident or coherent upon deep reflection. If you can show that Egoism is based on a confusion about personal identity or time, the Dualism vanishes, and Benevolence wins by default.
  *   **The EA Implication:** If you follow Parfit, you can ignore Sidgwick's worry. But if you stick with Sidgwick's intuitionism (that Prudence *is* self-evident), you must accept that your altruism is a **moral project**, not a **rational necessity**.

  **C. The "Sidgwickian Bargain"**
  There is a more pragmatic reading available to you. Sidgwick hoped for evidence of survival to *motivate* the harmony. But perhaps the "harmony" doesn't need to be ontological; it needs to be psychological or sociological.
  *   If you can demonstrate that, in the long run, a society of impartial utilitarians creates better conditions for *everyone's* self-interest (including the agent's), you might recover a weak harmony.
  *   Sidgwick was skeptical of this (he knew martyrs exist and don't get rewarded), but modern game theory and institutional design (core EA tools) attempt to solve exactly this: aligning self-interest with the general good so the Dualism rarely arises in practice.
  *   **Implication:** You don't need ghosts to solve the Dualism; you need better institutions. But this concedes that in *non-ideal* theory (where institutions fail), the Egoist is still rationally permitted to defect.

  ### Summary: Did Sidgwick Prove His Theory Needs a Postulate It Can't Have?

  **Yes, basically.**
  Sidgwick demonstrated that Classical Utilitarianism, when stripped of Christian theology and grounded solely in rational intuitionism, cannot prove that it is the *sole* rational dictate. It requires a "moral government of the universe" to make Duty and Interest coincide.
  *   He resigned his fellowship because he couldn't affirm the theology.
  *   He founded the SPR because he couldn't live with the chaos.
  *   He died without the proof.

  **What this means for you:**
  If you want to be a Sidgwickian Utilitarian today, you have three options, none of which are easy:
  1.  **Accept the Dualism:** Admit that morality is one rational voice among others, and that being moral sometimes means being "irrational" from the perspective of self-interest. (This is honest but demoralizing).
  2.  **Reject Rational Egoism:** Argue (like Parfit) that Prudence isn't actually an axiom of Reason. (This saves Utilitarianism but requires abandoning Sidgwick's intuitionism).
  3.  **Naturalize the Sanction:** Argue that "survival" doesn't matter; what matters is that the *concept* of the self is such that helping others *is* helping yourself (a more Buddhist or Humean move).

  Sidgwick's tragedy is that he was too honest to take option 3, too rigorous to take option 2 lightly, and too scientific to take option 1 comfortably. For you, the lesson is likely that **impartial altruism is a noble commitment, but you cannot claim it is the only thing a perfectly rational agent would do unless you are willing to make metaphysical assumptions Sidgwick found untenable.**

  The "chaos" he feared might not be the end of ethics, but it is the end of ethics as a system of *rational coercion*. It becomes, instead, a system of rational invitation. And perhaps, for a secular age, that has to be enough.
