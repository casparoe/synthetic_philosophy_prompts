answer: |-
  **Seminar Handout: The Tension in Nyāya-sūtra 1.1.4**
  **Topic:** Reconciling *Avyapadeśya* and *Vyavasāyātmaka* in the Definition of Perception

  **1. The Textual Problem**
  **NS 1.1.4:** *indriyārthasannikarṣotpannam jñānam avyapadeśyam avyabhicāri vyavasāyātmakaṃ pratyakṣam*
  ("Perception is a cognition produced by sense-object contact that is *avyapadeśya*, non-deviating, and determinate.")

  **The Apparent Contradiction:**
  *   **Vyavasāyātmaka:** Implies a determinate judgment (e.g., "This is a cow"), which seemingly requires identifying a particular as an instance of a universal (*sāmānya*), invoking conceptual/linguistic structures.
  *   **Avyapadeśya:** Literally "not to be named/expressed." If perception involves judgment ("This is a cow"), how can it be "inexpressible" or "non-verbal"?

  **2. Exegetical Resolutions: How to Read the Sūtra**
  There are two primary strategies in the commentarial tradition to render these qualifiers jointly satisfiable.

  **A. The Causal Reading (Vātsyāyana's *Bhāṣya*)**
  Vātsyāyana argues that *avyapadeśya* does not mean "devoid of conceptual content" (the Buddhist reading) but **"not produced by verbal testimony."**
  *   **Argument:** A cognition is *avyapadeśya* if its *cause* (*utpatti-hetu*) is sense-contact, not a statement from a reliable speaker (*āpta-vākya*).
  *   **Resolution:** One can have a determinate cognition ("This is a cow") that is *vyavasāyātmaka* (definite) yet *avyapadeśya* (because I saw it, I wasn't told).
  *   **Philosophical Cost:** This saves the sūtra but leaves Nyāya vulnerable to the Buddhist charge that *any* cognition involving universals is conceptual construction (*kalpanā*), regardless of its cause.

  **B. The Temporal/Structural Reading (Later Nyāya: Udayana, Gaṅgeśa)**
  To counter Dignāga, later Naiyāyikas explicitly bifurcate perception into two stages, reading NS 1.1.4 as defining the *genus* of perception which encompasses both.
  *   **Nirvikalpaka (Indeterminate):** The initial flash of sense-contact. It grasps the particular, universal, and quality, but *without* relating them. It is truly *avyapadeśya* (pre-linguistic).
  *   **Savikalpaka (Determinate):** The subsequent cognition that relates the qualifier to the qualificand (*viśeṣaṇa-viśeṣya-bhāva*). This is *vyavasāyātmaka*.
  *   **Resolution:** The sūtra lists qualities that apply to perception *as a whole*. Some qualities (like *avyapadeśya*) apply primarily to the first stage; others (like *vyavasāyātmaka*) apply to the second. Both are "perception" because both stem directly from sense-contact, not memory or inference.

  **3. The Stakes: Why This "Seam" Drives the Nyāya–Buddhist Dispute**
  This is not merely terminological; it determines the ontological status of universals and the validity of inference.

  *   **The Buddhist Epistemic Cut (Dignāga/Dharmakīrti):**
      *   **Premise:** Reality consists only of unique particulars (*svalakṣaṇa*). Universals are mental fictions.
      *   **Definition:** Perception must be *kalpanāpoḍha* (free from conceptual construction).
      *   **Implication:** If Nyāya admits *vyavasāyātmaka* (judgment) into perception, Nyāya "perception" is actually inference/thought. If Nyāya admits universals are perceived, Nyāya is reifying mental constructs.
      *   **Goal:** Isolate perception as ineffable experience, making language/inference a separate, conventional domain.

  *   **The Nyāya Realist Defense:**
      *   **Premise:** Universals (*sāmānya*) are real entities inhering in particulars.
      *   **Definition:** Perception must reveal the world *as it is structured* (qualified objects), not just raw sense-data.
      *   **Implication:** If perception were *only* indeterminate (*nirvikalpaka*), it could not serve as the foundation for inference (*anumāna*). Inference requires a major premise ("All smoke is fire") based on a perceived relation (*vyāpti*). If we cannot *perceive* the connection between universal smoke-ness and universal fire-ness, inference has no ontological grounding.
      *   **Goal:** Maintain that language tracks reality. The judgment "This is a cow" is perceptual because cow-ness is *in the object*, not just in the mind.

  **4. Discussion Question for Seminar**
  Does Vātsyāyana's causal reading of *avyapadeśya* successfully insulate Nyāya from Dignāga's critique, or does it merely talk past the Buddhist concern regarding the *content* of cognition? If we accept the later two-stage theory, does the *nirvikalpaka* stage do any epistemic work, or is it merely a theoretical posit to satisfy the definition?
