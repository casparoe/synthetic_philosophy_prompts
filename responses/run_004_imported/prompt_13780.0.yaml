      *   *The Text:* NS 1.1.4: *indriyārthasannikarṣotpannam jñānam avyapadeśyam avyabhicāri vyavasāyātmakaṃ pratyakṣam*.
      *   *The Tension:* If perception must be *vyavasāyātmaka* (determinate judgment like "This is a cow"), it involves identifying a particular as an instance of a universal. This implies language/concepts. But *avyapadeśya* literally means "not to be spoken/named."
      *   *The Buddhist Critique:* Dignāga defines perception as *kalpanāpoḍha* (free from conceptual construction). If Nyāya admits concepts in perception, it's not perception; it's inference/thought. If Nyāya denies concepts, how do we get knowledge of universals?
      *   *The Nyāya Defense:* Nyāya needs perception to be the foundation of inference. If perception is *only* raw sense data (nirvikalpaka), how do we get to the propositional content needed for inference (*parāmarśa*)?

  3.  **Address Question 1: Reconciling *Avyapadeśya* and *Vyavasāyātmaka*:**
      *   *Option A: Two Stages.* Later Nyāya (Navya-Nyāya) explicitly splits perception into *nirvikalpaka* (indeterminate) and *savikalpaka* (determinate). NS 1.1.4 is often read as defining the *genus* of perception, covering both.
      *   *Option B: The Meaning of Avyapadeśya.* Vātsyāyana's commentary is key. He doesn't mean "devoid of all conceptual content." He means "not produced *by* words/testimony." The cognition arises from sense-contact, not from hearing someone say "cow."
      *   *Option C: The Meaning of Vyavasāyātmaka.* This doesn't necessarily mean a *linguistic* judgment in the moment, but a *definite* apprehension of the object's nature.
      *   *Synthesis for Handout:* The most defensible reading is that *avyapadeśya* restricts the *causal origin* (not born of testimony), while *vyavasāyātmaka* describes the *phenomenological character* (definite awareness). However, the later distinction (nirvikalpaka/savikalpaka) is the systematic solution to the logical tension. Gautama is likely compressing the *ideal* perceptual knowledge (which is useful for debate/action) into the definition, while acknowledging the pre-linguistic root.
      *   *Refinement:* Actually, for a graduate handout, it's better to highlight the *evolution*. Gautama's sūtra is ambiguous. Vātsyāyana leans towards "not caused by words." Later Naiyāyikas (Udayana, Gaṅgeśa) admit the two stages to save the definition against Buddhists. The "joint satisfiability" in the *sūtra* itself is best read as: A perceptual cognition is one that is *grounded* in sense-contact (hence *avyapadeśya* in origin) and results in a *definite* awareness of the object (*vyavasāyātmaka*), even if the full linguistic articulation comes slightly later. But the strongest philosophical move is Vātsyāyana's: *avyapadeśya* excludes *śabda-pramāṇa*, not *nāma* (names) inherent in the object's structure.

  4.  **Address Question 2: The Nyāya-Buddhist Dispute:**
      *   *Buddhist Position (Dignāga):* Perception = *svalakṣaṇa* (particulars) only. Universals are mental constructs (*kalpanā*). Therefore, perception must be *kalpanāpoḍha* (free from construction).
      *   *Nyāya Position:* Realism. Universals (*sāmānya*) are real entities inhering in particulars. We *see* cow-ness in the cow.
      *   *The Seam:* If NS 1.1.4 allows *vyavasāyātmaka* (judgment), Nyāya claims we perceive relations (qualifier-qualified, *viśeṣya-viśeṣaṇa*). Buddhists say relations are mental.
      *   *Why it matters:* If perception includes universals, inference (*anumāna*) rests on a real foundation (vyāpti is real). If perception is only particulars, inference is merely a useful mental habit without ontological grounding. The definition of perception determines the ontology of the world (Realism vs. Nominalism/Idealism).

