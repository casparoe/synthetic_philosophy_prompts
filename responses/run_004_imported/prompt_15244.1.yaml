      *   **Contractualism (Scanlon):** What principles could no one reasonably reject? If you are the skier, can you reasonably reject a principle that says "save the greater number"? Maybe. But if you are one of the five, can you reject "flip a coin"? Probably.
      *   **Fairness/Lottery (Broome, Saunders):** When claims are equal, how do we aggregate? Does the number of people create a stronger *collective* claim, or does each individual have an equal *individual* claim that deserves a chance?
      *   **Professional SAR Protocols:** Triage isn't just philosophy; it's policy. Standard protocols usually prioritize "greatest good for the greatest number" in mass casualty or resource-constrained incidents.

  3.  **Evaluate the "Lottery" Argument:**
      *   *Why consider it?* It respects the individual moral worth of the skier. It acknowledges that being outnumbered shouldn't morally condemn you to death without a chance.
      *   *Why reject it?* It treats the five hikers as one unit vs. the skier. If you lottery 50/50, you are effectively saying 5 lives = 1 life in terms of probability weight. Over many iterations, a lottery policy saves fewer lives than a maximization policy.
      *   *Proportional Lottery:* Give the skier 1/6 chance, hikers 5/6. This mathematically aligns with utilitarianism over repeated trials but feels weird in a one-off case.

