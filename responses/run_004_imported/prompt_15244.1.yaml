      *   **The "Ex Ante" Perspective:** What policy would you want in place *before* you know who you are? (Veil of Ignorance). You'd want the policy that maximizes your chance of survival. Since you are more likely to be in a group than alone (statistically), or simply because maximizing total survival rates benefits society, the maximization rule wins.
