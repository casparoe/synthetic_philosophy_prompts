      *   *The "Fair Chance" Argument:* If the skier knew the policy beforehand, would they accept it? Most SAR volunteers agree to protocols that prioritize maximizing lives.

  5.  **Synthesize the Rationalist Perspective vs. Moral Intuition:**
      *   Rationalist view: Expected value is clear. $5 \times P(\text{save}) > 1 \times P(\text{save})$.
      *   Psychological view: Identifiable Victim Effect. The skier is specific; the five are a group.
      *   Philosophical nuance: Aggregation vs. Non-Aggregation.
      *   *Key Insight:* The user is asking if their discomfort is a bug (bias) or a feature (moral insight).
      *   *Verdict:* It's largely a bias (scope insensitivity/identifiable victim), *but* there are legitimate philosophical debates about aggregation. However, in SAR *practice*, maximization is the standard for good reason.

  6.  **Drafting the Response:**
