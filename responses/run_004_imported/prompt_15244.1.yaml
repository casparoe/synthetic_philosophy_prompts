answer: |-
  This is a profound and heavy question, and first, I want to acknowledge the weight of carrying that decision. The fact that it nags at you isn't necessarily a failure of your rationality; it's a sign of your empathy. However, from both an ethical and operational standpoint, the committee's decision was the defensible one.

  Your intuition—that the skier's claim doesn't seem weaker just because he is outnumbered—is a classic tension in moral philosophy known as the **Aggregation Problem**. It pits the "separateness of persons" against the "maximization of good."

  Here is a breakdown of why the headcount decision holds up, why the lottery argument is tempting but flawed in this context, and where your intuition is likely being tricked by cognitive biases.

  ### 1. The Utilitarian Calculation (Shut Up and Multiply)
  In the rationalist framework, the math is stark. You have a resource (one helicopter window) and a currency (human lives).
  *   **Option A:** 1 life saved.
  *   **Option B:** 5 lives saved.

  If every life has equal intrinsic value, Option B produces 5 units of value, and Option A produces 1. To choose Option A is to implicitly state that the skier's life is worth five times as much as any single hiker's life simply by virtue of his isolation.

  You asked if this is scope-insensitivity talking. **Yes, largely.** Scope insensitivity usually manifests as valuing 1 life almost as much as 100 lives. In your case, it's manifesting as feeling that 1 life is *morally comparable* to 5 lives in a zero-sum tradeoff. The "nagging" feeling is the emotional brain struggling to comprehend the magnitude of the difference between 1 and 5.

  ### 2. The Case for the Lottery (and why it fails here)
  You proposed a lottery (equal or proportional odds). This argument is most famously associated with philosopher John Taurek, who argued that numbers shouldn't count because there is no "super-observer" who experiences the sum of the suffering; there are only individuals.

  **The Equal Lottery (50/50):**
  If you flip a coin, you are treating the *group* of five as a single moral entity equivalent to the *individual* skier. This effectively dilutes the value of the five hikers. If you run this scenario 100 times, a coin flip saves 50 skiers and 250 hikers (300 total lives). A maximization policy saves 0 skiers and 500 hikers (500 total lives). The lottery costs 200 lives over the long run.

  **The Proportional Lottery (1/6 vs 5/6):**
  This aligns with the utilitarian math over repeated trials. However, in a single high-stakes decision, introducing randomness where the outcome is known (we *know* we can save the 5) adds moral risk without moral benefit. It turns a duty to save the greater number into a gamble.

  **The "Individual Claim" Argument:**
  Your intuition is that the skier's claim is as strong as *any one hiker's* claim. That is true. The skier's claim is equal to Hiker #1's claim. But Hiker #1 is accompanied by Hikers #2, #3, #4, and #5, who also have claims of equal strength. The skier is not fighting the hikers; he is fighting the *sum* of their claims.

  ### 3. The Veil of Ignorance
  The strongest defense for the committee's decision isn't just the math; it's the policy perspective. Imagine you are designing SAR protocols behind a "Veil of Ignorance" (Rawls). You do not know if you will be the solo skier or one of the five hikers.

  *   **Policy A (Maximize Lives):** If you are the skier, you die. If you are a hiker, you live.
  *   **Policy B (Lottery):** If you are the skier, you have a 50% (or 1/6) chance. If you are a hiker, your individual chance drops significantly.

  Statistically, you are more likely to be in a group than alone (depending on the activity, but generally, groups are common). More importantly, under Policy A, the *total probability of survival for the population* is maximized. Rational agents behind the veil would agree to the policy that maximizes the total number of survivors, accepting that in the specific instance where they are the outnumbered minority, they will be sacrificed.

  ### 4. Operational Reality and Moral Distress
  In Search and Rescue, triage protocols are explicitly utilitarian. They exist to protect volunteers from exactly the kind of moral distress you are feeling. By codifying "save the greatest number," the committee absorbs the blame so the pilot and the team can act without hesitation.

  If you introduce a lottery, you introduce **moral wiggle room**. You allow the decision-maker to subconsciously favor the "identifiable victim" (the solo skier often feels more poignant than a group) under the guise of fairness. The hard rule prevents bias from creeping in.

  ### 5. Why it still nags (and why that's okay)
  Even if the decision was correct, your discomfort is valid. This is **Moral Residue**.
  *   **The Identifiable Victim Effect:** We are evolutionarily wired to care deeply about the specific individual in front of us. The skier is a specific narrative; the five hikers are a statistic. Overriding this instinct feels like a violation of human connection, even if it is ethically correct.
  *   **The "Clean Hands" Desire:** A lottery feels like it keeps your hands cleaner ("It was chance, not me who chose him to die"). But refusing to choose the greater number is still a choice.

  ### Conclusion
  It would **not** have been more defensible to use a lottery.
  1.  **Ethically:** It fails to respect the equal value of the five hikers' lives.
  2.  **Rationally:** It reduces expected value (lives saved).
  3.  **Systemically:** It undermines the triage protocols that make SAR possible.

  The skier's claim to rescue *is* weaker, not because his life is worth less, but because his claim is unaccompanied. He is a single voice shouting against a chorus of five. Ignoring the chorus to hear the single voice is a poetic gesture, but in rescue, it is a moral failure.

  You saved five people. The guilt you feel regarding the one is the price of that success. Do not let the "nagging" convince you that a coin flip would have been more just. It would only have been more comfortable.
