prompt: |-
  So i went down a bit of a rabbit hole a while back because some guy online kept quoting karl popper to argue evolution "isn't even real science" - the quote was popper calling natural selection a "metaphysical research programme" instead of an actual testable theory. I looked into it and yeah, popper really did say that (also called it "almost tautological" somewhere, objective knowledge i think?). But then i found out that later on, in some lecture, he basically recanted and said he'd changed his mind about the testability of the whole thing. Can you compare these two popper positions - the original tautology/metaphysical-programme view and the later recantation - and tell me if they're actually reconcilable or if he just flat out contradicted himself? Also curious which of his two "selves" you think had the stronger argument, early skeptical popper or the one who walked it back later. Justify it a bit, don't just pick a side for no reason.
