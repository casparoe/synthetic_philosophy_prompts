answer: |-
  You have done your homework correctly. This is one of the most common "gotcha" quotes used in online debates about evolution, and like many internet philosophy snippets, it is often stripped of crucial context.

  You are right on both counts: Karl Popper did famously criticize natural selection as a "metaphysical research programme" and "almost tautological," but he explicitly recanted this view later in life.

  Here is a breakdown of the two positions, an analysis of whether they contradict, and an evaluation of which argument holds more water.

  ### 1. The Early Popper: The Skeptic (1970s and prior)
  **The Claim:** In works like *Unended Quest* (1974) and various lectures from the early 70s, Popper argued that Darwinism (specifically natural selection) was not a testable scientific theory but a "metaphysical research programme."

  **The Reasoning:**
  *   **The Tautology Charge:** Popper focused on the phrase "survival of the fittest." He argued that if you ask, "Who are the fittest?" and the answer is "Those who survive," the statement becomes circular. It explains everything but predicts nothing. If a trait survives, it was fit; if it dies out, it wasn't. To Popper, this looked like a logical truth rather than an empirical discovery.
  *   **Falsificationism:** Popper's core philosophy was that for a theory to be scientific, it must be *falsifiable* (capable of being proven wrong). He felt natural selection was too flexible. It could explain any outcome post-hoc (after the fact), which meant no observation could ever contradict it.
  *   **The Value:** Crucially, Popper **never said evolution was false.** He thought it was likely true and immensely important. He just didn't think it met his strict logical criteria for "empirical science" at the time. He compared it to Freudian psychoanalysis or Marxism in terms of structure (explanatory power without predictive risk), though he valued it much higher.

  ### 2. The Later Popper: The Recantation (1978 onwards)
  **The Claim:** In a 1978 lecture at Darwin College, Cambridge (later published in revised editions of *Objective Knowledge*), Popper stated: "I have changed my mind."

  **The Reasoning:**
  *   **Testability of Specific Models:** Popper realized he had been attacking a straw man. While the *general principle* of selection might sound abstract, biologists use it to build specific, testable models. For example, predicting how a specific moth population will change color in response to soot, or how bacteria will develop resistance to a specific antibiotic.
  *   **Fitness is Not Just Survival:** He accepted the biological rebuttal to the tautology charge. "Fitness" is not defined merely by survival; it is defined by specific traits (phenotypes) that confer a reproductive advantage. You can measure the trait independently of the survival outcome. Therefore, if a trait predicted to be advantageous fails to spread, the theory is falsified.
  *   **Historical Science:** Popper came to appreciate that evolutionary biology is a "historical science." It doesn't always predict the future in the way physics does, but it makes testable claims about the past (e.g., predicting what kind of transitional fossils should exist in specific geological strata).

  ### 3. Contradiction or Reconciliation?
  **Is it a flat contradiction?**
  Yes, on the specific question of the *status* of the theory. You cannot logically hold that "Natural Selection is untestable/metaphysical" and "Natural Selection is testable/scientific" simultaneously. Popper admitted this was a reversal.

  **Is it reconcilable within his philosophy?**
  In a way, yes. Popper was a **fallibilist**. He believed all knowledge is tentative and that admitting error is a virtue of science. By changing his mind in the face of better understanding of how biologists actually work, he was practicing what he preached. He applied his own skepticism to his own previous claim.

  So, while the *claims* contradict, the *method* was consistent. He evaluated the evidence, found his previous criterion too rigid or misapplied, and updated his position.

  ### 4. Which "Popper" Had the Stronger Argument?
  If we are judging based on accuracy regarding how science works and the actual track record of evolutionary biology, **Later Popper had the stronger argument.**

  Here is the justification for that verdict:

  **Why Early Popper was weaker:**
  *   **Misunderstanding of Practice:** Early Popper was judging biology by the standards of 1930s physics. He was doing "armchair philosophy." He didn't fully engage with how evolutionary biologists constructed hypotheses.
  *   **The "Just-So Story" Risk is not Fatal:** Early Popper was worried about "adaptationism" (explaining every trait as an adaptation). While this is a valid warning (later echoed by Gould and Lewontin in *The Spandrels of San Marco*), the existence of bad science doesn't make the whole field metaphysical. Newtonian physics had errors, but that didn't make physics metaphysical.
  *   **Predictive Success:** By the late 70s, evolutionary theory had already made successful predictions that Early Popper ignored. For example, the prediction of specific transitional fossils (like *Tiktaalik* much later, but the logic existed earlier) or the genetic mechanisms of resistance. A theory that successfully predicts empirical data cannot be "metaphysical" in the untestable sense.

  **Why Early Popper still has value (The Nuance):**
  *   Early Popper's critique served as a necessary "immune system" for biology. His warning forced biologists to be more rigorous. It pushed them to ensure they weren't just telling "Just-So Stories." In this sense, his *skepticism* was useful, even if his *conclusion* was wrong.

  **Why Later Popper is stronger:**
  *   **Alignment with Reality:** Later Popper recognized that science is what scientists *do*, not just what philosophers *say they should do*. Evolutionary biology generates risky predictions (e.g., "If evolution is true, we should find no rabbit fossils in the Precambrian era"). We have never found a rabbit in the Precambrian. That is a falsifiable test that the theory passed.
  *   **Resolution of the Tautology:** The later position accepts the mathematical definition of fitness (reproductive success relative to specific traits), which dissolves the tautology charge.

  ### Summary for your debates
  When you encounter someone quoting Early Popper to dismiss evolution:

  1.  **Acknowledge the quote:** Yes, Popper said that.
  2.  **Drop the recantation:** Popper explicitly changed his mind in 1978 because he realized evolutionary models *are* testable.
  3.  **Point out the motive:** Popper's early critique was about the *logical structure* of the theory, not its *truth*. He never denied evolution happened.
  4.  **The Verdict:** The consensus among philosophers of science today is that Later Popper was correct. Evolution is a historical science that makes testable predictions. Early Popper was applying a logical filter that was too coarse for the complexity of biology.

  **Final Verdict:** Later Popper wins. He corrected his error based on evidence, which is exactly what he demanded of scientists. Using his early error to deny evolution is ironically un-Popperian, because it refuses to update a hypothesis in light of new information (Popper's own recantation).
