answer: |-
  Good evening. For those who don't know me, I'm the brother of the bride. I'm also a novelist. Which, in this room, puts me in a precarious position. To the English department, I'm a storyteller. To the Philosophy department, I'm a purveyor of contingent truths. And to my Gran, I'm the one who lies for a living.

  I was terrified when asked to give this toast. Mostly because I know my sister's thesis inside out. She's spent the last three years living in Wittgenstein's *On Certainty*. And I know that half the people at this table will dissect my syntax for hidden epistemic contradictions. So, I want to be precise.

  We all know the dynamic between [Sister] and [Fiancé]. He is a trauma surgeon. His entire life is built on data. Vitals, labs, scans. If he can't measure it, he can't fix it. He needs evidence. And [Sister], well, she has spent their entire relationship telling him that some things aren't the kind of thing evidence applies to.

  If you ask [Fiancé] how he knows he loves her, he might look for proof. He might point to the way they navigate a crisis, or the compatibility of their schedules. He looks for the data points.

  But [Sister] argues that asking for proof of the foundation is like asking a door to prove its hinge.

  For Gran, and for the rest of us who didn't major in existential dread: Wittgenstein said that doubt only makes sense if there is something you *don't* doubt. If I want to check if this microphone is working, I have to assume the speakers are on. I have to assume I have ears. I have to assume sound exists. Those assumptions aren't proven by the test; they are the things that *allow* the test to happen. Wittgenstein called them "hinge propositions." They don't swing open to be examined. They hold the door up so everything else can move.

  [Fiancé], you spend your life saving people by looking for the break, the fracture, the anomaly. You are trained to question everything. But [Sister] is telling you that a marriage cannot be a series of tests. You cannot wake up every morning and demand new evidence that she is your wife.

  If you treat love as a hypothesis to be proven, you will spend your life in the lab. Because evidence can always be interpreted differently. A quiet night could mean contentment, or it could mean distance. A gift could be love, or it could be guilt. The data is never enough on its own.

  The data only makes sense because of the hinge.

  The commitment you made—the vow—isn't the conclusion of an investigation. It's the framework. It's the thing that makes the evidence meaningful. When you make her coffee, it counts as love *because* the hinge is already in place. When she waits up for you after a shift, it counts as devotion *because* you aren't questioning the foundation.

  [Sister], you taught me that certainty isn't about having all the answers. It's about knowing which questions don't need to be asked. And [Fiancé], you've taught her that while the hinge doesn't swing, the door is useless if it doesn't open. She provides the certainty; you provide the action. She holds the frame; you move through it.

  There was a moment, early in their engagement, when [Fiancé] tried to apply triage logic to an argument they were having. He asked for a "statistically significant gesture" to de-escalate the situation. [Sister] just looked at him and said, "I am not a patient, and this is not a crisis. This is just us."

  That is the wisdom I want to toast to.

  In a world that demands we verify everything, that tells us to keep our options open and our hearts protected until the data is irrefutable, they have chosen to install the hinge. They have decided that some things are too important to be treated as theories.

  So, please raise your glasses.

  To [Sister] and [Fiancé]. May you never feel the need to test the hinge. And may your door always swing wide.
