      *   **Core Theme:** Wittgenstein's "hinge propositions" from *On Certainty*. The idea that some things aren't proven by evidence but are the framework *within which* evidence makes sense.
      *   **Constraint 1:** Must not be a shallow "love doesn't need reasons" cliché. It needs to accurately reflect the sister's philosophical view (hinges vs. empirical claims).
      *   **Constraint 2:** Must be accessible to the grandmother (no jargon without explanation).
