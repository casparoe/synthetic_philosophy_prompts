  2.  **Deconstruct the Philosophy (Wittgenstein's *On Certainty*):**
      *   *The Concept:* We doubt things based on other things we hold certain. For example, if I doubt I have hands, I can't use my hands to check. The certainty that "I have hands" is a hinge. It doesn't swing open (it's not questioned); it allows the door (inquiry/doubt) to move.
      *   *The Application to Marriage:* You don't gather evidence that your spouse loves you every day to prove it. The trust *is* the hinge. Without that hinge, the daily actions (making coffee, listening) have no meaning.
      *   *The Surgeon Angle:* Surgeons live by evidence (vitals, scans, blood work). This creates a perfect tension/complementarity. He needs proof; she knows some things are pre-proof.

  3.  **Drafting - Section by Section:**

