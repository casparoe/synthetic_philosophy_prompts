      *   *Point:* If I don't know who they are, can I intend *their* death?
      *   *Anscombe's reply:* You intend the death of *whoever is there*. If whoever is there includes innocents, you intend the death of innocents. The description of the act is "killing people in this zone," not "killing Mr. Terrorist."

  9.  **Final Structure:**
      *   Intro: Confirm dates, clarify the philosophical stakes (Intention & Innocence).
      *   The Truman Precedent: Briefly recap why Truman was guilty (civilians as means).
      *   Signature Strikes & Intention: Analyze the "unknown identity" problem.
