  So I had this whole argument with my friend Alex after his sister's barbecue last weekend and I still can't decide who was right. Alex told us their dog got hit by a car a few days before because the backyard gate got left open, and the story kind of spiraled into a whole debate between the two of us in the car on the way home. Turns out the brother-in-law was on a work call and forgot to latch the gate after bringing the trash bins in, which was specifically his job that evening. Alex is 100% sure the brother-in-law caused the dog's death, no debate needed there. But I pointed out that the neighbor on the other side always glances at that gate when she's out gardening and just happened not to be outside that evening, and their teenage kid had also been told to keep an eye on it and was on his phone instead. If "caused it" just means "the dog would still be alive if this person had done the one thing they didn't do," then all three of them pass that test equally, so why does only the brother-in-law get called the cause?

  Alex says im being deliberately obtuse - obviously its him, since it was literally his assigned job that night, not some vague background expectation like with the neighbor or the kid. I said that explains who we're annoyed at, not who actually caused anything, and that if "he caused it" can't mean anything more than "he was supposed to stop it and didn't," then we're not tracking some extra fact about the world, we're just restating whose job it was and calling that causation. Alex thinks I'm overcomplicating something obvious and that this is just how blame works, full stop. We went back and forth for a solid 40 minutes and neither of us gave an inch. Who's actually right - is there a real, substantive difference between causing something through inaction versus just being the one person who was supposed to stop it, or is my objection just a fancy way of dodging an answer we both already know?
