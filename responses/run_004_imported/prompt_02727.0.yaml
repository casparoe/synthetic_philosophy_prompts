answer: |-
  This is one of the sharpest knives in meta-ethics. You have correctly identified the "Desert Island" (or "Last Man") counter-example as the stress test that breaks the back of pure conventionalism.

  If the obligation to keep a promise were *only* about maintaining a useful social technology (Hume) or playing fair within a cooperative game (Rawls), then a scenario where the technology is useless and the game is over should dissolve the obligation. Yet, as you note, our intuition screams that the survivor is still bound.

  Here is a gears-level walkthrough of how the major frameworks attempt to digest this case, where they jam, and whether we are forced to accept a "primitive" normative power.

  ---

  ### 1. The Conventionalists (Hume, Rawls, Lewis)
  **The Mechanism:** The obligation is artificial. It is created by a social practice that exists because it is mutually advantageous. To promise is to invoke a rule of a game.
  **The Source of Obligation:** Utility of the institution + Fairness to those who rely on the institution.

  **Handling the Desert Island:**
  Strictly speaking, **they fail.**
  *   **Hume:** For Hume, a promise without a social context is literally unintelligible. He argues that you cannot "will a new obligation into existence" any more than you can will a new physical law. In the Island case, there is no society, no convention, and no future utility to the practice. A strict Humean must say there is no *moral* obligation, only perhaps a sentimental feeling of regret.
  *   **Rawls:** Rawls refines this by saying the obligation comes from the "Principle of Fairness." If you benefit from a practice, you must obey its rules. But on the Island, there is no ongoing practice to benefit from. The dying man cannot benefit from the *institution* of promising because the institution ends with the survivor.

  **The Rescue Attempt:**
  Conventionalists often resort to **psychological internalization.** They argue that we are so deeply conditioned by the social practice that we project the obligation even into contexts where it doesn't functionally apply.
  *   *The Cost:* This turns the Island intuition into an **error theory.** It says, "You *feel* bound, but you aren't actually bound; you're just hallucinating a social rule where none exists."
  *   *Verdict:* This is unsatisfying. It explains the *feeling* but denies the *reality* of the obligation. If you share the intuition that the survivor *would be wrong* to break the promise, Hume/Rawls are dead in the water here.

  ### 2. The Expectation/Reliance View (Scanlon, Gibbard)
  **The Mechanism:** Promising isn't a magical act; it's a specific way of inducing expectations. The wrong is not breaking a "rule," but rather **betraying a trust** you intentionally invited.
  **The Source of Obligation:** A general principle against manipulating others' expectations to their detriment (Scanlon's "Principle F").

  **Handling the Desert Island:**
  **They succeed, but at a cost to "distinctiveness."**
  *   **Scanlon's Move:** Scanlon explicitly designs his theory to handle this. He argues you don't need a social institution. You only need:
      1.  Agent A intentionally leads B to expect X.
      2.  A knows B wants this assurance.
      3.  A acts to ensure B knows this assurance is given.
  *   On the Island, the survivor does exactly this. The dying man forms an expectation based on the survivor's assurance. Breaking the promise violates the principle of fidelity (don't manipulate expectations).
  *   *The Cost:* This reduces the wrong of promising to a subset of the wrong of **lying or deception.** It loses the "distinctive" nature of the promise. For Scanlon, there is no special "promise obligation," just a specific configuration of the general obligation not to harm people by messing with their heads.
  *   *Verdict:* It saves the obligation in the Island case, but it dissolves the *sui generis* nature of promising. It says the wrong is about *harm/trust*, not about the *promise itself*.

  ### 3. The Authority/Rights View (Shiffrin, Owens, Raz)
  **The Mechanism:** Promising is a **normative power.** When you promise, you transfer a slice of your autonomy to the promisee. You give them a right to control your action.
  **The Source of Obligation:** The promisee now holds a **right** that you perform. Breaking the promise isn't just disappointing them; it is violating their sovereignty over that action.

  **Handling the Desert Island:**
  **This is the strongest fit for your intuition.**
  *   **Seana Shiffrin's Argument:** Shiffrin argues that promising creates a distinctive relationship of authority. Even on the Island, when the survivor says "I promise," they are handing the dying man the "governorship" of that future action.
  *   **Why it binds:** It binds because the dying man now *owns* the claim. It doesn't matter if society exists. It doesn't matter if the man dies immediately after. He holds a right, and you are violating his right.
  *   **Distinctiveness:** This captures the "distinctive wrong" perfectly. The wrong isn't that the dead man is hurt (he's dead); it's that his **authority was usurped.** You took back control you had given away.
  *   *The Cost:* This requires accepting that human beings have the metaphysical power to change moral reality by speaking words. It invites Hume's "transubstantiation" charge head-on. It posits a primitive normative power: the ability to create obligations *ex nihilo* through will.
  *   *Verdict:* It matches the intuition best, but it is metaphysically "expensive." It requires believing in a kind of moral magic that Hume rejected.

  ### 4. The Volitional/Integrity View (Kant, Early Moderns)
  **The Mechanism:** The obligation is primarily to **oneself.** A promise is an act of self-legislation.
  **The Source of Obligation:** Consistency of the will. To break a promise is to contradict your own past rational will.

  **Handling the Desert Island:**
  **Mixed results.**
  *   **The Strength:** It works in isolation. You don't need society. You are bound because *you* bound yourself.
  *   **The Weakness:** It fails to explain why the wrong is *to the promisee*. If I break a promise to a dead man on an island, a Kantian says I have damaged my own integrity. But our intuition is that I have wronged *him*, not just degraded *myself*. It misses the relational component.

  ---

  ### The Honest Assessment: Are We Stuck with the "Primitive"?

  You asked to be honest about whether any of these succeed or if we must admit the obligation comes from something primitive.

  **1. Conventionalism (Hume/Rawls) is dead on the Island.**
  Unless you are willing to tell the survivor, "Actually, you have no moral duty to that dying man, it's just a habit you have," conventionalism cannot account for the intuition. It locates the obligation *outside* the agents (in society), but the Island case proves the obligation feels *internal* to the relationship.

  **2. Expectation Views (Scanlon) survive but reduce.**
  They save the obligation but lose the "distinctiveness." If Scanlon is right, then promising isn't a unique moral category; it's just a high-stakes version of not lying. Many philosophers find this unsatisfying because we treat promises differently than mere predictions or assurances.

  **3. Authority Views (Shiffrin/Owens) win the intuition but lose the metaphysics.**
  This is where your "gears-level" question hits the wall. To explain the Island case without reducing it to harm or convention, you have to accept **Normative Powers.**
  You have to accept that human speech acts can genuinely alter the deontic landscape (the landscape of rights and duties) independent of social utility.

  **The Verdict:**
  You are likely right to sense that convention and expectation cannot fully capture the distinctive wrong.
  *   If the wrong were just **harm**, we could break the promise if we found a slightly better outcome (utilitarianism). But we feel we can't, even if the harm is zero.
  *   If the wrong were just **convention**, the Island case wouldn't bind. But it does.

  This leaves us with the **Authority View** as the only viable contender that respects the "distinctive wrong." But this forces us to accept Hume's "transubstantiation" charge as a feature, not a bug. We *do* will obligations into existence.

  **Why is this not magic?**
  Defenders of the Authority View (like Raz or Shiffrin) argue it's not magic because it is grounded in the **value of autonomy.**
  *   Part of being an autonomous agent is having the power to bind yourself and relate to others.
  *   If we *couldn't* bind ourselves in the absence of social sanctions, our autonomy would be impoverished. We would be slaves to our immediate desires unless society watched us.
  *   Therefore, the "primitive" power to promise is actually a **necessary condition of full moral agency.**

  **Conclusion:**
  The Desert Island case suggests that the obligation to keep a promise is not derived from the *goodness of the practice* (Hume) or the *harm of disappointment* (Scanlon), but from the **status of the promisee.**

  By promising, you elevate the promisee from a bystander to a **rights-holder** regarding your action. Breaking the promise on the island is a distinctive wrong because it is a **usurpation of authority.** You are taking back a right you gifted.

  So, yes: You are stuck admitting the obligation comes from something more primitive than convention. It comes from the normative power of the will to create rights in others. Hume thought this was unintelligible; modern deontologists argue it is the only thing that makes us moral agents rather than just social animals. The "transubstantiation" is real; it's just moral, not physical.
