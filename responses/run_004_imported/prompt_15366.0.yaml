  5.  **Formulate the Thesis:**
      *   Douglass would likely view contemporary originalism (as described) as a **betrayal** (or at least a perversion) of his method, despite superficial similarities.
      *   *Why?* Because Douglass's textualism was instrumental to *liberty*, not just historical accuracy. He separated text from intent to *empower* the document to do moral work, whereas the described originalism uses history to *constrain* the document's moral reach.

  6.  **Drafting the Argument (incorporating specific structural elements):**

      *   *Point 1: Text vs. Intent.* Douglass argued we must ignore the "secret intentions" of the framers if the text is clear. Contemporary originalism often digs into historical expectations (intent/understanding) to limit rights. If the text of the 14th Amendment says "equal protection," Douglass would argue that means *equal protection*, regardless of whether 1868 voters expected it to cover affirmative action. Originalism that says "they didn't expect this, so it's forbidden" relies on the very "secret intentions" Douglass rejected.
