  3.  **Deconstruct Contemporary Originalism (as described in the prompt):**
      *   *Claim:* Fidelity to original meaning.
      *   *Application (per prompt):* Narrowing Reconstruction Amendments (e.g., *Shelby County*, *Students for Fair Admissions*).
      *   *Method:* Often focuses on "original public meaning" at the time of ratification.

  4.  **Compare the Structures:**
