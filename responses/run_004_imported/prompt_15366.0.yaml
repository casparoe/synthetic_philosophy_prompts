answer: |-
  Frederick Douglass would almost certainly view contemporary originalism, as described in your premise, as a **betrayal** of his interpretive method rather than a vindication. While both approaches claim fidelity to the text over evolving social whims, the *structure* of Douglass's argument relies on a specific relationship between text, intent, and purpose that contemporary originalism (in this application) inverts.

  Douglass would argue that this form of originalism commits the very error he spent his career dismantling: it privileges the historical expectations and private intentions of the framers over the plain, moral command of the text itself.

  Here is the justification based on the specific structure of Douglass's argument:

  ### 1. Text vs. Secret Intentions
  The core of Douglass's break with Garrison was his insistence that the Constitution must be judged by what it *says*, not by what the framers *meant* to do in secret. In his 1860 speech, "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?", Douglass argued that because the words "slave" and "slavery" are absent, the document cannot be legally construed to support property in man, regardless of the fact that many framers were slaveholders. He wrote, "I stand here by the side of the Constitution... not as a slaveholder, but as a man."

  Contemporary originalism, when used to narrow the Reconstruction Amendments, often relies on the specific historical expectations of the 1868 ratifiers. For example, if justices argue that the 14th Amendment's Equal Protection Clause was not originally understood to permit affirmative action or certain voting protections, they are grounding rights in the *limitations of historical understanding*.

  Douglass would reject this. To Douglass, the "original meaning" of a word like "Liberty" or "Equality" is not fixed by the prejudices of the people who wrote it, but by the moral capacity of the word itself. By binding the 14th Amendment to the specific, limited expectations of the 19th-century electorate, originalism reverts to the "secret intentions" Douglass warned against. He would argue that if the text says "equal protection," the historical failure of the framers to fully envision that equality is irrelevant.

  ### 2. The Preamble as the Governing Purpose
  Douglass's hermeneutic was not merely textualist; it was purposive. He anchored his interpretation in the Preamble's stated goals: "to form a more perfect Union, establish Justice... and secure the Blessings of Liberty." He argued that any clause ambiguous enough to be read as pro-slavery must be interpreted in light of these overarching purposes.

  The structure of his argument is: **Preamble (Purpose) > Ambiguous Clause > Historical Context.**

  In contrast, the originalism described in the prompt often operates with a structure of: **Historical Expectation > Textual Command.** When originalism narrows voting rights or affirmative action, it often suggests that the *practice* of the past limits the *principle* of the text. Douglass would argue this subordinates the "Blessings of Liberty" to the "compromises of the past." He would contend that the Preamble's command to secure liberty is an active, ongoing mandate that prohibits reading the Reconstruction Amendments in a way that perpetuates the "badges and incidents" of slavery, regardless of whether the 1868 Congress specifically envisioned modern voting restrictions.

  ### 3. The Constitution as a "Glorious Liberty Document"
  Douglass famously called the Constitution a "glorious liberty document." His argument was that the text possessed a *potential* for freedom that exceeded the moral horizon of its authors. He believed the text was a tool to be wielded for emancipation, not a historical artifact to be preserved in amber.

  Contemporary originalism, in the context of narrowing civil rights, treats the Constitution as a boundary marker based on past consensus. Douglass viewed the Constitution as a sword for cutting away oppression. If the text of the 15th Amendment says the right to vote shall not be denied on account of race, Douglass's method demands a reading that maximizes that protection. An originalist reading that allows narrowing regulations because "states rights" or "historical practice" permitted them in 1870 would strike Douglass as a return to the "covenant with death" logic he rejected. He would argue that such a reading ignores the *textual command* in favor of the *historical status quo*.

  ### 4. The "Second Founding" and the Rejection of Compromise
  Finally, Douglass viewed the Reconstruction Amendments not as minor adjustments, but as a "second founding" that fundamentally altered the constitutional order to align with the Declaration of Independence. He argued that the post-war Constitution should be read as a new commitment to universal liberty.

  Originalism that narrows these amendments often treats them as exceptions to the original 1787 framework, subject to the same federalism constraints as the pre-war document. Douglass's structural argument was that the Reconstruction Amendments *superseded* the prior compromises. He would view an interpretive method that uses 1787 or 1868 historical limitations to stifle the reach of the 14th and 15th Amendments as a failure to recognize the transformative nature of the text. He would argue that fidelity to the *text* of the Reconstruction Amendments requires recognizing their broad, universal language ("any person," "equal protection") as a deliberate rejection of the narrow, race-based legalism of the past.

  ### Conclusion
  Douglass would recognize contemporary originalism as a betrayal because it mimics the *form* of his textualism (adherence to the written word) while inverting its *function*. Douglass used the text to escape the gravity of historical prejudice; the originalism described uses history to limit the gravity of the text. He would argue that by prioritizing the "original expectations" of the framers over the "plain words" of liberty and equality, this method resurrects the very "intentions" he deemed irrelevant and undermines the Preamble's promise that he sought to vindicate.
