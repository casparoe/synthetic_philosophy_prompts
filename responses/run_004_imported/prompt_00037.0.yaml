answer: |-
  A Nash Bargaining Solution and a Kalai-Smorodinsky solution are in marriage counseling.

  The therapist asks, "Why are you two divorcing?"

  The Kalai-Smorodinsky solution throws up her hands. "Because he's emotionally stagnant! Last month, my career took off. My feasible set expanded, and my ideal utility point soared. By every axiom of Individual Monotonicity, my share of the household utility should have increased to reflect that new potential!"

  The Nash solution adjusts his tie, unbothered. "But the disagreement point didn't change. And since the curvature of the frontier shifted just so, maximizing the product of our gains actually required your utility to stay flat. I satisfied Pareto Optimality and IIA. The alternatives were irrelevant."

  Kalai-Smorodinsky grabs her purse. "My potential is not an *irrelevant alternative*, John! It defines the ray from the disagreement point! You're obsessed with tangent hyperbolas; I need a man who respects a straight line to my Utopia point."

  Nash shrugs. "That point isn't even feasible."

  "Exactly," she says, walking to the door. "You're a realist. I'm an idealist. And in bargaining theory, that means I'm walking to my threat point."

  "Wait!" Nash calls out. "If you leave, the product drops to zero!"

  She turns back, coldly. "Then you should have negotiated a better ratio."
