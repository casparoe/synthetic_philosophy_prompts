answer: |-
  The subjectivist position your friend defends—rooted in the Savage-de Finetti tradition—is seductive because it offers a clean, formal definition of rationality: coherence. If your beliefs obey the probability axioms and you update via Bayes' rule, you are rational. Full stop. On this view, priors are indeed primitive inputs, like taste preferences. If I prefer chocolate and you prefer vanilla, we need not agree; similarly, if I start with a prior that assigns high probability to God's existence and you start with a low one, we are merely different, not irrational.

  However, this defense collapses when we shift our conception of rationality from *internal coherence* to *truth-tracking*. If the goal of belief is to map the territory accurately, then treating priors as unassailable personal tastes is a category error. I will argue that Robin Hanson is correct: ideally rational agents must share a common prior unless they can articulate a specific, non-question-begging "origin dispute." To deny this is to surrender the possibility of objective knowledge and retreat into solipsism.

  ### The Failure of Subjectivism as a Normative Standard

  Your friend's objection relies on conflating *descriptive* psychology with *normative* rationality. It is true that, causally, priors are "given" to us. I do not choose my intuition that the future will resemble the past; I simply have it. But rationality is not about accepting our causal givens; it is about critiquing them.

  Consider a thermometer. If two thermometers placed in the same room read different temperatures, we do not say, "Well, temperature readings are just primitive inputs; both are valid." We assume there is a fact of the matter about the temperature and that the instruments are attempting to track it. If they diverge, at least one is malfunctioning.

  Human brains are belief-forming instruments. When you and I disagree on a prior (say, the base rate of intelligent life in the universe), we are effectively two instruments outputting different readings before processing specific local data. The subjectivist says, "Different calibrations are allowed." The objectivist (and Hanson) asks, "Why?" If the universe is uniform and our cognitive equipment is designed to model that universe, there is no principled reason for our calibrations to differ unless there is a difference in the *equipment* or the *calibration process*.

  To claim that priors are free choices is to claim that rationality has no grip on where we start, only on how we move. But if you start far enough from the truth, no amount of coherent updating will get you there in a finite time. A rationality that permits priors that are arbitrarily disconnected from reality is a rationality that has abandoned truth as its telos. Therefore, the presumption must be that identical information states regarding the *origin* of beliefs should yield identical priors.

  ### The Indexical Bias and the Veil of Ignorance

  The strongest argument for the Common Prior Requirement (CPR) is the indexicality argument you alluded to. Imagine a "veil of ignorance" scenario where you exist before you know which physical brain you will inhabit. You know there will be two agents, Alice and Bob, who will have access to different private evidence later, but right now, behind the veil, you must choose the prior policy for both.

  Would you choose a policy where Alice's prior depends on the fact that she is Alice, and Bob's depends on the fact that he is Bob? No. That would be an unprincipled bias toward a specific coordinate in spacetime. "I am me" is not a factual proposition about the world that warrants a probability shift; it is a tautology.

  If Alice says, "I should trust my prior because it is *mine*," she is making a claim that her specific biological instantiation is more likely to be truth-conducive than Bob's. But behind the veil, she doesn't know she will be Alice. To commit to a divergent prior is to bet that *this* brain is special. That is an empirical claim, not a primitive axiom. If she cannot justify why her brain's initial settings are superior to Bob's without referencing the fact that it is hers, she is guilty of indexical bias. Ideally rational agents must treat their own cognitive origins as contingent facts subject to evaluation, not as privileged foundations.

  ### Defining Legitimate "Origin Disputes"

  This brings us to the crux of the matter: When *can* priors differ? Hanson's phrase "origin disputes" is precise. It does not mean "we disagree about the world." It means "we disagree about the causal history that produced our belief-forming machinery."

  A legitimate origin dispute requires asymmetric information about the *reliability* of the cognitive process that generated the prior.

  **What Counts as a Legitimate Origin Dispute:**
  1.  **Known Cognitive Defeaters:** Alice knows she has a brain lesion affecting risk assessment; Bob does not. Bob is rational to trust his prior over Alice's regarding financial risk. The dispute is about the hardware, not the software.
  2.  **Asymmetric Training Data:** Alice was raised by a community of expert physicists; Bob was raised by flat-earthers. Alice can argue her prior on gravity is more trustworthy because her "training data" during cognitive development was higher quality. Note: This is not just "I learned different things." It is "My belief-forming process was calibrated against better feedback loops."
  3.  **Evolutionary/Structural Arguments:** If Alice can demonstrate that her prior aligns with known structural constraints of the universe (e.g., symmetry principles) while Bob's does not, she has an origin story that appeals to external validity, not internal feeling.

  **What Does NOT Count:**
  1.  **"I just feel it":** Intuition is a report on the output of the prior, not evidence for its reliability.
  2.  **"I was raised differently" (without quality assessment):** Mere cultural divergence is not a justification. Unless you can argue your culture's epistemology is objectively superior, this is just an explanation of cause, not a justification of validity.
  3.  **"You are biased":** Accusing the other of bias is empty unless you can specify the causal mechanism of that bias and show you are immune to it. (Usually, this leads to a symmetric standoff, which CPR says should force convergence).

  ### The Implications for Everyday Disagreement

  This is where the argument bites hardest, and where I must be unyielding. If we accept the Common Prior Requirement, **most persistent disagreement among careful, well-informed people is indeed irrational.**

  The rationalist community's suspicion of disagreement is not just a heuristic; it is a logical consequence of CPR. If two agents share a prior, Aumann's Agreement Theorem tells us they cannot agree to disagree on posteriors. If they *do* disagree on posteriors, and they claim to share a prior, one is lying or mistaken about their updating. If they claim *different* priors, Hanson's argument demands they resolve the origin dispute.

  In practice, this means that when two intellectuals disagree on politics or philosophy, they are almost certainly failing to "pre-rationalize." They are treating their own priors as given and the other's as requiring evidence. They are failing to step behind the veil of ignorance.

  Does this leave *any* room for disagreement? Yes, but it shrinks the space significantly.
  1.  **Private Evidence:** We can disagree because we have seen different data. But we must agree on the *likelihood ratios* that data should produce.
  2.  **Unresolved Origin Disputes:** We can disagree temporarily while we investigate whose cognitive origin is more reliable. But we must treat this as an empirical investigation (e.g., "Let's test who is better calibrated on neutral questions"), not a standoff of intuitions.
  3.  **Computational Limits:** Ideally rational agents would agree. Boundedly rational agents might not have the compute to verify the other's updating. But this is a concession to limitation, not a validation of the disagreement.

  ### Conclusion

  Your friend's subjectivist defense protects our ego. It allows us to say, "I am rational, you are rational, and we see the world differently." It is a polite fiction that preserves social harmony at the cost of epistemic integrity.

  Hanson's pre-rationality argument is the harder, more demanding truth. It asserts that rationality is not a private game of consistency but a public project of convergence. If we are both trying to model the same reality, there is no room for two different "starting truths." To claim otherwise is to assert that the truth depends on who is looking.

  Therefore, the conclusion is unavoidable: Ideally rational agents must share a common prior. Any deviation requires a defensible claim about the causal superiority of one belief-forming origin over another. In the absence of such a claim, persistent disagreement is not a feature of a diverse rational community; it is a bug in the agents' rationality. We should treat everyday disagreement not as a natural state of affairs, but as a signal that we have failed to locate and correct the bias in our own origins.
