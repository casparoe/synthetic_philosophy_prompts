  **MEMORANDUM**

  **TO:** Artistic Advisory Committee
  **FROM:** [Your Name], Artistic Advisory Committee
  **DATE:** October 26, 2024
  **SUBJECT:** Recommendation Regarding *Don Giovanni* Directorial Concept

  **Recommendation:** Approve the Director's concept, with a specific artistic mandate to preserve musical ambiguity.

  We are deadlocked on a question that is both aesthetic and ethical. The Director proposes staging Giovanni's conquests as unambiguous assault; the Dramaturg warns this reduces Mozart and Da Ponte's complex moral architecture to a didactic case study, citing Bernard Williams's observation that the opera's greatness lies in the music's refusal to be moralized.

  After weighing both positions, I recommend we **approve the Director's concept**, provided the creative team understands that "unambiguous assault" must not mean "one-dimensional horror." We must reject the traditional staging, not merely for ethical reasons, but because the artistic cost of the "charming predator" trope has become prohibitive.

  **The Cost of the Traditional Staging**
  We must calculate the cost of a "traditional" *Giovanni* honestly. In 2025, staging these interactions as seductive charm does not merely preserve historical context; it actively gaslights the audience. For the patrons in our own community who have experienced sexual violence, a charming Giovanni is not an aesthetic pleasure; it is a re-traumatization that validates the mechanics of coercion. When art normalizes predation as wit, it ceases to be a period piece and becomes a participant in contemporary harm. The "artistic risk" of offending traditionalists is outweighed by the human risk of alienating and injuring survivors.

  **Reconciling with Williams**
  The Dramaturg is correct to invoke Bernard Williams. Williams argued that the score's vitality resists the plot's moralizing. However, this tension does not require Giovanni to be *likable*; it requires the *music* to be seductive while the *action* is not.

  If we stage the acts as assault, but allow Mozart's score to remain lush, vibrant, and energetically complicit, we do not lose the Williams tension—we sharpen it. The audience will feel a profound dissonance: *Why does this beautiful music accompany this violation?* This makes the music itself a subject of scrutiny, rather than a mere vehicle for charm. This approach transforms the production from a "case study" into a philosophical inquiry on the aesthetics of evil, which is precisely what Williams valued.

  **Path Forward**
  I move we approve the concept on the condition that the Director and Music Director collaborate to ensure the score is not "darkened" to match the staging. The horror must be in the blocking and acting; the music must retain its dangerous vitality. This preserves the aesthetic complexity the Dramaturg defends while accepting the ethical imperative the Director demands.

  We cannot afford a *Giovanni* that asks our survivors to suspend their reality for the sake of 18th-century charm. Let us stage the predator as he is, and let the music wrestle with the consequences.

  Please indicate your vote by Friday so we may meet the brochure deadline.
