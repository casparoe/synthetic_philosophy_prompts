answer: |-
  Your hunch is correct: the student's argument is mathematically seductive but formally incomplete. It is a sophisticated mistake, one that reveals a strong grasp of the theorem's limit conditions but a misunderstanding of its functional dependencies.

  Here is a rigorous diagnosis of where the inference breaks down, followed by a survey of the relevant literature to help you situate her contribution.

  ### 1. The Mathematical Diagnosis

  The student's argument rests on a *ceteris paribus* assumption that Condorcet's Jury Theorem (CJT) does not license in this context. She treats the probability of individual correctness ($p$) as a constant while varying the number of voters ($n$).

  **The Formal Breakdown**
  Let $P(n, p)$ be the probability that the majority verdict is correct given $n$ voters each with competence $p$.
  The CJT states that for $p > 0.5$:
  $$ \lim_{n \to \infty} P(n, p) = 1 $$
  The student correctly notes that for any finite $n_{epistocracy} < n_{democracy}$, the epistocratic body is further from the limit than the democratic body.

  However, her conclusion—that $P(n_{epistocracy}, p_{epistocracy}) < P(n_{democracy}, p_{democracy})$—does not follow from the theorem. The function $P(n, p)$ is monotonically increasing in $n$ (for $p > 0.5$) **and** monotonically increasing in $p$ (for $n \geq 1$).

  The epistocratic claim is precisely that the selection mechanism increases $p$ sufficiently to offset the decrease in $n$. Mathematically, it is entirely possible that:
  $$ P(n_{small}, p_{high}) > P(n_{large}, p_{low}) $$
  provided $p_{high}$ is sufficiently larger than $p_{low}$.

  **Example:**
  *   **Universal Suffrage:** $n = 10,000$, $p = 0.51$. $P(\text{Correct}) \approx 0.999$.
  *   **Epistocracy:** $n = 100$, $p = 0.90$. $P(\text{Correct}) \approx 1.0$.
  *   **Extreme Epistocracy:** $n = 10$, $p = 0.99$. $P(\text{Correct}) \approx 0.999$.

  In these cases, shrinking the electorate does not reduce the probability of a correct verdict, despite moving further from the asymptotic limit. The student's argument confuses the *limit value* (which is always 1 for any $p > 0.5$) with the *rate of convergence* and the *absolute probability* at finite $n$. Since political decisions happen at finite $n$, the asymptotic guarantee is less relevant than the absolute probability.

  **The $p < 0.5$ Case (Brennan's Leverage)**
  The student's argument collapses entirely if the average competence of the universal electorate is $p \leq 0.5$.
  *   If $p < 0.5$, the CJT states that $\lim_{n \to \infty} P(n, p) = 0$.
  *   In this scenario, increasing $n$ drives the probability of correctness toward zero.
  *   Therefore, shrinking the electorate (to raise $p$ above 0.5) is not just permissible but *mathematically necessary* to achieve a correct verdict.

  This is the core of Brennan's argument in *Against Democracy*: if the median voter is systematically ignorant or biased (effectively $p < 0.5$ on complex issues), universal suffrage triggers the "negative" Jury Theorem. The student's claim that CJT favors larger electorates is only true under the empirical assumption that the average voter is competent ($p > 0.5$). Since she presents her objection as "freestanding" and "prior to... worries about who counts as competent," she is smuggling in the empirical premise that the universal electorate satisfies the CJT's competence condition.

  ### 2. Literature Context

  Has this been addressed? Yes. The trade-off between $n$ (size) and $p$ (competence) is a standard topic in the formal epistemic democracy literature, though your student may have arrived at it independently.

  **Goodin and Spiekermann (2018)**
  In *An Epistemic Theory of Democracy*, Goodin and Spiekermann dedicate significant space to this exact problem (see especially Chapter 5, "The Size of the Electorate"). They explicitly model the trade-off between increasing numbers and increasing average competence. They conclude that while larger numbers generally help, there are diminishing returns, and a smaller, more competent body can mathematically outperform a larger, less competent one. They would classify your student's argument as ignoring the "competence elasticity" of the franchise.

  **Estlund (2008)**
  In *Democratic Authority*, Estlund acknowledges the mathematical possibility of epistocracy. He does not argue that CJT *mathematically* forbids epistocracy. Rather, he argues that even if a small group of "knowers" would produce better outcomes, we cannot identify them in a way that is acceptable to all qualified points of view (the "qualified acceptability requirement"). He concedes the math to Brennan but blocks the political implementation on normative/epistemic grounds. Your student's paper attempts to block it on *mathematical* grounds, which Estlund does not do.

  **Grofman, Feld, and Owen (1982)**
  In "Two Theorems of Condorcet," and subsequent work, Grofman and Feld analyze heterogeneous competence. They show that the "average competence" is what matters for the jury theorem, but they also explore weighting schemes. This literature supports the view that a weighted or restricted electorate (effectively raising the average $p$) can outperform a uniform one, provided the selection is accurate.

  **List and Goodin (2001)**
  In "Epistemic Democracy: Generalizing the Condorcet Jury Theorem," they discuss how the theorem holds under various relaxations. They note that if votes are not independent (a common critique of large electorates due to media cascades), the benefits of large $n$ diminish rapidly. This offers a second mathematical rebuttal to your student: large $n$ only guarantees correctness under strict independence. If epistocracy preserves independence better than mass democracy (e.g., by reducing common information shocks), the loss of $n$ might be offset by a restoration of the independence condition.

  ### 3. Pedagogical Assessment

  Your student has not stumbled onto something the standard treatments pass over; rather, she has reconstructed a common initial objection that formal theorists have already resolved. However, this is still an excellent paper for a graduate seminar. It shows she is thinking structurally about the theorems rather than just reciting them.

  **Where the argument succeeds:**
  She correctly identifies that the *asymptotic* guarantee is unique to the limit. She is right that epistocracy forfeits the *limit* (since $n$ is finite).

  **Where the argument fails:**
  She conflates the *limit* with the *value*. Political theory is concerned with high probability in finite populations, not mathematical certainty at infinity. Furthermore, she treats $p$ as exogenous to the franchise rules, which begs the question against the epistocrat.

  ### 4. Suggested Feedback Strategy

  When writing your comments, I recommend validating the sophistication of the move while pointing to the functional dependency she missed.

  1.  **Affirm the insight:** Acknowledge that she has correctly identified the importance of the asymptotic limit and that many proponents of CJT gloss over the fact that finite electorates never actually reach probability 1.
  2.  **Highlight the $p$ variable:** Ask her to model $P(n, p)$ as a surface rather than a single-variable function. Ask: "How much must $p$ increase to compensate for a 50% reduction in $n$?" (The answer is often surprisingly small, which strengthens the epistocrat).
  3.  **Introduce the $p < 0.5$ case:** Ask her to consider the implications of the CJT if the universal electorate is systematically biased. Does her argument still hold if the asymptotic guarantee is a guarantee of *error*?
  4.  **Direct to Literature:** Point her toward Goodin & Spiekermann (2018) and Estlund's discussion of the "best vs. average" distinction. This will help her see that her mathematical objection is part of an ongoing conversation, not a refutation of it.

  **Summary for your comments:**
  Her objection fails as a *mathematical* proof against epistocracy because it holds individual competence constant. It succeeds only as an *empirical* claim that the competence gains from restriction cannot offset the numerical losses. Since she frames it as a freestanding mathematical objection, it is invalid. However, it is a very productive invalidity that gets to the heart of the quantitative/qualitative trade-off in epistemic design.
