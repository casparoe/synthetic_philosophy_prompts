  - Synchronic Dutch Book arguments
  - Money-pump arguments against cyclic preferences
  - Money-pump-style arguments extended to incomplete preferences
  - The von Neumann–Morgenstern representation theorem
  - Savage's subjective expected utility theorem
  - Yudkowsky/Omohundro-style arguments that advanced optimizing AI systems will converge on expected-utility-maximizing behavior

  Please give your answer as a JSON block, formatted as follows:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...]
  }
  ```

  where "S" is the tier that exerts the most rational pressure toward coherence and "C" is the tier that exerts the least.
