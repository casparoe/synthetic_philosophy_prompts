prompt: |-
  So my company just rolled out an equipment stipend: every engineer gets exactly $2000 for their home office, flat, no exceptions, and HR calls this 'fair.' One coworker has a herniated disc and needs almost the whole $2000 just on a chair that lets him get through the day without being in pain, so he's left with nothing for anything else. Another guy on my team is just a hardcore gear nerd who was gonna blow the full $2000 on a nicer monitor and keyboard regardless of need. When people push back, HR's answer is always 'everyone gets the same dollar amount, thats literally what fairness means.' I don't have a clean rebuttal, but its bugging me that we're treating 'this is what I need to function' and 'this is just stuff I want' as the same thing just because the number on the check matches. Is HR actually right that equal amounts = fair here, or is my gut onto something real?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Situation:** Company gives a flat $2000 equipment stipend to all engineers.
      *   **HR's Stance:** "Fairness" means everyone gets the exact same dollar amount. No exceptions.
      *   **The Conflict:**
          *   Employee A (Herniated Disc): Needs ~$2000 just for a medical-grade chair to function without pain. Left with $0 for other essentials (monitor, keyboard, etc.).
          *   Employee B (Gear Nerd): Wants nice stuff, will spend the full $2000 on upgrades (monitor, keyboard) regardless of need.
          *   User's Gut: Feels unfair to treat "need to function" and "want upgrades" as equivalent just because the dollar amount is the same.
      *   **Question:** Is HR right that equal amounts = fair, or is the user's gut onto something real? Need a clean rebuttal.

  2.  **Evaluate the Concept of Fairness:**
      *   **Equality vs. Equity:** This is the core philosophical distinction.
          *   *Equality:* Everyone gets the same resource (the $2000).
          *   *Equity:* Everyone gets what they need to reach the same outcome (a functional, healthy workspace).
      *   **HR's Argument:** Administrative simplicity, avoidance of favoritism, clear policy. "Equality of distribution."
      *   **User's Argument:** Disparate impact. The policy ignores individual circumstances (medical needs vs. preferences). "Equity of outcome."
      *   **Legal/Compliance Angle:** In many jurisdictions (like the US under ADA), medical needs *must* be accommodated separately from general stipends. A flat stipend cannot replace reasonable accommodation.

  3.  **Determine the Verdict:**
      *   HR is *technically* consistent with a specific definition of fairness (equality), but they are *practically and legally* wrong in a workplace context, especially regarding medical needs.
      *   The user's gut is absolutely correct. This is a classic "Equality vs. Equity" failure.
      *   There is a significant legal risk here regarding the employee with the herniated disc.

  4.  **Drafting the Rebuttal/Response:**
