          3.  Question on Bentham's unpublished status (limits of calculative argument vs. fear of backlash).
          4.  Question comparing Bentham's route to toleration vs. Mill's Harm Principle (*On Liberty*).
          5.  Each question needs a short follow-up keyed to a likely deflection.
      *   **Tone:** Intellectual, engaging, suitable for a high school audience but rigorous enough for a professor.

  2.  **Deconstruct Bentham's "Offences Against One's Self":**
      *   *Core Argument:* Utilitarianism. Pain vs. Pleasure.
      *   *The Act:* "Irregularities of the venereal appetite" (homosexuality/sodomy).
      *   *The Law:* Punishment by death (hanging).
      *   *Bentham's Calculation:* The pain of punishment (death, shame, blackmail) vastly outweighs any pain caused by the act itself (which he argues is negligible or non-existent regarding third parties).
      *   *Key Tension:* Public disgust exists. Does that count as pain in the calculus? Bentham usually says "sympathy and antipathy" are nonsense reasons for law, but if people *feel* pain from disgust, utilitarianism must count it.
