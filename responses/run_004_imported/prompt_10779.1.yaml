          *   *Follow-up:* She might say "Bentham is more realistic." Counter: But Mill offers stronger protection.

      *   *Filling the remaining 4-6 questions (Need to focus on mechanics):*
          *   *Idea 5: The definition of "Harm."* Bentham focuses on physical pain. What about moral corruption? How does he dismiss "moral harm" without begging the question?
          *   *Idea 6: The role of Shame.* Bentham argues punishment creates shame which creates pain. But isn't shame internal? Can law fix internal shame?
          *   *Idea 7: Consent.* Bentham doesn't really use "consent" like modern liberals. He uses "no victim." How does this distinction matter?
          *   *Idea 8: Theological Objections.* He dismisses religious arguments as "prejudice." How does a secular calculus talk to a religious public?
          *   *Idea 9: Blackmail.* He mentions blackmail as a side effect of criminalization. Is this a pragmatic or moral argument?
