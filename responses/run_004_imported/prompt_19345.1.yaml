  The private room smelled of truffle oil and old money. Julian, our host, spun a gold coin across the tablecloth. It settled near the centerpiece, catching the candlelight.

  "The rules are simple," Julian said, smiling with that specific hedge-fund mischief that suggests money is merely a scorekeeping error. "Heads, your stake grows sixty percent. Tails, it shrinks by half. We flip once a minute. You decide the fraction of your current stack to risk before each toss. I'm backing both of you. Unlimited capital, provided you don't blow up."

  Dana didn't look at the coin. She looked at Priya. "Sixteen percent. Anything more is suicide."

  Priya swirled her Pinot, unbothered. "The arithmetic expected value is positive five percent per flip. If I bet the full stack, the expected value grows exponentially. Why should I leave money on the table because you're scared of volatility?"

  "It's not fear, it's measure theory," Dana said, her voice flat. "You're calculating the ensemble average. You're averaging across a million parallel universes where a million versions of me flip once. In most of those universes, they win. But I am not a million versions of me. I am one person moving through time. In the time average, wealth compounds multiplicatively. The geometric mean of one-sixty and one-half is less than one. If you bet full size, you converge to zero with probability one. It's not risk appetite, Priya. It's ergodicity."

  Priya set her glass down. "Von Neumann–Morgenstern rationality doesn't dictate a specific utility function. It demands consistency. If I prefer the higher expected value because I have a short horizon or outside capital to replenish losses, that is a valid preference. Log utility is just a curve, Dana. It's not a law of physics."

  "It is when the process is non-ergodic," Dana countered, leaning in. "When the time average differs from the ensemble average, maximizing expected value is literally maximizing the probability of ruin. You're optimizing for a population of counterfactual selves that don't exist. I'm optimizing for the self that has to eat dinner tomorrow. If you bet everything, you might win big in the ensemble, but in the timeline we actually inhabit, you vanish."

  "And who lives in the limit?" Priya shot back. "Your argument relies on the number of flips going to infinity. But no trader operates on an infinite horizon. I have quarterly returns. I have investors who redeem. If I can survive the drawdowns with sufficient capital reserves, the law of large numbers works in my favor across my portfolio, not just across time. I don't need to survive forever; I need to survive until Friday."

  "You're assuming independence," Dana said. "You're thinking of your portfolio as a basket of uncorrelated coins. But in a crisis, correlations go to one. The system becomes a single coin flip. When that happens, your arithmetic averaging fails because you're exposed to the same multiplicative drag everyone else is. Diversification is just hidden leverage until it isn't."

  "Diversification is risk management," Priya insisted. "Variance is a proxy for uncertainty. By penalizing variance, I'm accounting for the fact that I can't tolerate infinite drawdowns. That's what my utility function does. It prices the pain of being wrong. You're claiming log utility is 'true,' but it's just a specific attitude toward risk. I'm willing to tolerate a higher probability of ruin for a higher ceiling. That's not a mathematical mistake; it's a business decision."

  "It is a mistake if you confuse the map for the territory," Dana said. "You treat risk as a parameter to be priced. I treat it as a constraint to be respected. If you violate the Kelly criterion, you are actively subtracting from your growth rate. You aren't taking 'more risk' for 'more return.' You are literally accepting less growth for more volatility. You're paying to jiggle the numbers."

  "And if the edge isn't static?" Priya asked. "Your Kelly fraction assumes you know the probabilities. I know we're dealing with a fair coin here, but in the market, the odds shift. If I over-leverage based on a miscalibrated edge, I'm dead. But if I under-leverage based on your dogmatic log utility, I starve. My utility function adapts to the business needs. Yours assumes the math is the only reality."

  "The math is the only reason there is a business," Dana said. "Compounding is the engine. If you break the engine because you like the sound of the horsepower numbers, you don't get to drive."

  Julian cleared his throat, picking up the coin. "So. Fractions?"

  Priya smoothed her napkin. "I'm not betting my life on a single coin, Dana. I'm betting a position size that aligns with my fund's mandate. If I want to bet big, I can." She looked at Julian. "I'll take fifty percent."

  Dana shook her head, almost pitying. "You're optimizing for a universe you won't be in." She turned to Julian. "Sixteen percent. Exactly."

  "And if I flip tails ten times in a row?" Julian asked Priya.

  "Then I rebalance," Priya said. "Because I'm not done."

  "And if you flip heads ten times?" Dana asked.

  "Then I have more capital to lose," Priya said.

  Dana picked up her water glass. "You think capital is the constraint. It's not. Time is."

  "And you think time is infinite," Priya replied. "It's not."

  Julian flipped the coin. It spun, silver and blurred, hanging in the air between them while the argument waited, unresolved, for gravity to take it.
