          *   **Crucial Constraint:** The guest tends to deflect criticism by saying "that's an implementation detail, not a problem with debate itself." Each question needs a specific follow-up designed to counter this deflection.
      *   **Tone:** Respectful but probing (suitable for a club podcast, not an adversarial debate, but needs to dig deep).

  2.  **Deconstruct the Core Concept (AI Debate):**
      *   *Premise:* Two AIs argue, human judge picks winner.
      *   *Goal:* Align superhuman AI by making truth the most persuasive strategy.
      *   *Key Vulnerabilities:* Persuasion $\neq$ Truth, Obfuscation, Judge Bias, Computational Cost, Game Theory equilibria.

  3.  **Drafting the Questions (Iterative Process):**

