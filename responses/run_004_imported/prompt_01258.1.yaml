answer: |-
  A strict act-utilitarian is walking down the street when he sees a child about to fall into a well.

  His friend shouts, "Pull the child out! It's the moral thing to do!"

  The utilitarian freezes, hand hovering in the air. "I can't," he says. "The universe contains an infinite amount of value."

  "So?"

  "So, saving the child adds a finite amount of good. But infinity plus finite is still infinity. The total moral value of the universe remains unchanged."

  "Okay, but letting them fall is bad!"

  "Is it? Infinity minus finite is *also* infinity. Mathematically, saving the child and watching them fall result in the exact same cosmic sum. The marginal utility of my action is zero."

  "So you're just going to stand there?"

  "Worse. Since the outcome is identical, I have no moral vector to move along. Choosing to act implies a preference where none exists. I'm suffering from Infinitarian Paralysis."

  "That's just laziness!"

  "No, laziness is a vice. This is rigorous ethics. Now shh, I'm conserving calories until the heat death of the universe. It's the only way to ensure I don't accidentally alter the infinite total with unnecessary movement."
