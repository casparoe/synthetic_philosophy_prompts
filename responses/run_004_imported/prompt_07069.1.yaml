      *   *Depression and Illusions:* A 2010 study (Matthews et al.) suggested depressed individuals were less susceptible to the Müller-Lyer. So if the character *is* susceptible, that's normal. If she *isn't*, that's depressive realism. Neither fits the "world warping" vibe the user wants perfectly.
