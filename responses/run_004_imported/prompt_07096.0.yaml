prompt: |-
  I'm reporting a piece on this whole "cooperative AI" research wave (there's apparently a whole group out of Carnegie Mellon built around it), and I keep running into a result called program equilibrium that I can't quite get straight in my head. From talking to a couple of researchers, here's what I've got so far: if you let two agents in a one-shot Prisoner's Dilemma submit little computer programs instead of just picking cooperate or defect -- programs that get to inspect eachother's code before "deciding" -- it's now basically a mathematical fact that two rational agents will end up cooperating instead of defecting. One of the researchers I talked to was pretty emphatic that this overturns the classic 1950s game theory result that defection is the only rational move in a one-shot Prisoner's Dilemma: his pitch was that von Neumann and Nash just didn't have the "let them read each other's source code" trick available, and that once you add it in, their whole conclusion about the Prisoner's Dilemma stops holding.

  Before that goes in the piece I'd like to actually understand the mechanics instead of just repeating the soundbite. Can you walk me through why giving agents access to eachother's source code supposedly flips a one-shot Prisoner's Dilemma from mutual defection to mutual cooperation, in a way that counts as a genuine equilibrium and not just wishful thinking? I tried working through the original Tennenholtz paper on program equilibrium and got lost in the notation pretty fast, so honestly a plain-English but accurate version of the argument -- including whatever the catch turns out to be, if there is one -- would save me from embarrassing myself in print.
