prompt: |-
  I help maintain an open source formalized-math library, kind of like Lean's mathlib. Someone's PR adds a bunch of genuinely useful theorems -- every vector space has a basis, Tychonoff's theorem, existence of a non-measurable set -- that all depend on the axiom of choice, and proposes we just declare `choice` a blanket axiom for the whole library instead of tagging it per theorem. Half the maintainers are upset, since that quietly makes huge parts of the library noncomputable (no more extracting actual running code from those proofs) and smuggles choice into lemmas that constructive-math users downstream never opted into. The other half say refusing choice means we can't formalize most of real analysis or algebra, making the library useless for that. We vote at next weeks maintainer call and I have to circulate a recommendation first -- can you draft it? I need an actual call (adopt globally, opt-in tagging per theorem, or fork a seperate constructive-only library), with reasoning that would actually land with the anti-choice camp and not just 'choice is standard, deal with it.'
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation draft:

  1.  **Analyze the Situation:**
      *   **Context:** Open source formalized math library (like Lean's `mathlib`).
      *   **Conflict:** A PR introduces heavy AC-dependent theorems (Basis, Tychonoff, Non-measurable set). The proposer wants to make `choice` a global axiom.
      *   **Stakeholders:**
          *   *Pro-Choice:* Want to formalize standard analysis/algebra. Fear the library becomes "useless" without AC.
          *   *Anti-Choice (Constructive/Computational):* Care about computability/extraction. Fear "smuggling" AC into lemmas they use. Feel betrayed if defaults change without explicit opt-in.
      *   **Goal:** Draft a recommendation for the maintainer call.
      *   **Requirement:** Must make an *actual call* (Global, Per-Theorem, or Fork). Must persuade the anti-choice camp (not just dismiss them). Must acknowledge the pro-choice needs.

  2.  **Evaluate the Options:**

      *   **Option A: Global Axiom (`choice` everywhere).**
          *   *Pros:* Easiest for classical mathematicians. Matches standard ZFC practice. Maximizes theorem count in one namespace.
          *   *Cons:* Kills computability entirely. Alienates constructive users. Violates the principle of explicit assumptions. Hard to track dependencies.
          *   *Verdict:* Too aggressive for a library that values constructivity/computability. Likely to cause a fork anyway.

      *   **Option B: Fork (Separate Constructive Library).**
          *   *Pros:* Clean separation. Each side gets what they want.
          *   *Cons:* Splits community effort. Duplicates maintenance. Confuses users (which library to import?). "Fork" sounds divisive/negative.
          *   *Verdict:* A last resort. Bad for community health if avoidable.

      *   **Option C: Opt-in Tagging (Classical Namespace / Axiom Scoping).**
          *   *Pros:* Preserves computability for core. Explicitly marks classical results. Allows both user bases to coexist. Follows best practices in formalization (like `mathlib`'s `open_classical` or `noncomputable` sections).
          *   *Cons:* More boilerplate for classical users. Requires discipline from contributors.
          *   *Verdict:* The standard industry best practice for dependent type theory libraries (Lean, Coq, Agda). It balances both needs.

  3.  **Determine the Strategy for Persuasion:**
      *   *To the Anti-Choice Camp:* Acknowledge their validity. Computability is a feature, not a bug. Explicitness prevents "axiom leakage."
      *   *To the Pro-Choice Camp:* Acknowledge their validity. Classical math is the majority use case. We shouldn't block progress.
      *   *The Compromise:* "Classical by default *in specific namespaces*, constructive by default *in core*." Or, more accurately for type theory: "Constructive core, classical extensions."
      *   *Key Argument:* Maintaining a *single* library with clear boundaries is better than a fork. Explicit tagging actually *helps* classical users by clarifying why a proof doesn't compute.

  4.  **Drafting the Recommendation - Section by Section:**

      *   **Subject Line:** Needs to be clear and urgent.
      *   **Opening:** Acknowledge the value of the PR and the depth of the disagreement. Validate both sides.
      *   **The Recommendation:** Be direct. (Opt-in/Scoped approach).
      *   **Reasoning (The "Why"):**
          *   *Computability:* Preserve the ability to extract code.
          *   *Transparency:* Users should know what axioms they are using.
          *   *Community:* Avoid a toxic fork.
          *   *Precedent:* Cite how `mathlib` or similar projects handle this (they don't make AC global; they use `noncomputable` and `classical` namespaces).
      *   **Implementation Plan:** How do we actually do this? (Namespaces, attributes, CI checks).
      *   **Closing:** Call for unity.

  5.  **Refining the Tone:**
      *   Avoid "Deal with it."
      *   Avoid "Constructivism is impractical."
      *   Use terms like "Axiom Leakage," "Computational Content," "Modularity."
      *   Make sure the Pro-Choice side feels welcomed, not restricted. The goal isn't to ban AC, but to *label* it.

  6.  **Self-Correction/Edge Case Check:**
      *   *Wait, does Lean's mathlib actually do this?* Yes, `mathlib` is classical by default *but* marks things `noncomputable`. However, the prompt implies a library that *currently* values constructivity. If I suggest "Global Classical," I lose the constructive users. If I suggest "Fork," I lose community cohesion.
      *   *Correction:* In Lean `mathlib`, `classical` is actually opened by default in many places, but `noncomputable` is required for definitions. However, for a library where half the maintainers are upset about *global* axioms, the "Scoped/Opt-in" approach is the diplomatic middle ground. It respects the constructive roots while allowing classical math.
      *   *Crucial distinction:* There's a difference between "Global Axiom" (adding `axiom choice : ...` to the root) vs "Using Classical Logic" (using `classical.some`). The prompt says "declare `choice` a blanket axiom." This is the technical sin. The recommendation should be to use *scoped* classical reasoning, not a global axiom declaration.

  7.  **Finalizing the Recommendation:**
      *   **Decision:** Reject Global Axiom. Adopt "Constructive Core, Classical Extensions" (Opt-in/Scoped).
      *   **Rationale:** Prevents axiom leakage, preserves extraction, keeps community together.
      *   **Actionable items:** Use `noncomputable` tags, isolate classical namespaces, update CI to check for unmarked axioms.

  8.  **Drafting the Content:** (Mental Outline)
      *   Subject: Recommendation on AC Policy.
      *   Context: The PR is good math, but the *method* is the issue.
      *   Decision: No global axiom. Use scoped classical reasoning.
      *   Why: 1. Computability (Constructive side). 2. Clarity/Modularity (Both sides). 3. Sustainability (Avoid fork).
      *   Path Forward: Merge theorems with tags. Create `Classical` namespace.
      *   Closing: Let's keep building together.

  9.  **Review against constraints:**
      *   Actual call? Yes.
      *   Reasoning for anti-choice? Yes (leakage, extraction).
      *   Not just "choice is standard"? Yes (focuses on software engineering/modularity aspects).

  10. **Final Polish:** Ensure the tone is professional, empathetic, and decisive. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm banning classical math. The prompt says "refusing choice means we can't formalize most of real analysis." So the recommendation *must* allow classical math, just not *globally*. The distinction is "Global Axiom" vs "Local/Scoped Usage." I will emphasize this technical distinction.

  *(Refining the "Fork" option)*: I should explicitly argue *against* the fork as a first step, framing the scoped approach as the way to prevent the fork.

  *(Refining the "Global" option)*: I need to explain *why* global is bad technically, not just philosophically. (Axiom leakage breaks refactoring and extraction).

