answer: |-
  **To:** Core Maintainers
  **From:** [Your Name]
  **Subject:** Recommendation: Axiom of Choice Policy and PR # [Number]
  **Date:** [Date]

  Team,

  I've reviewed the feedback on PR #[Number] and the ensuing discussion regarding the Axiom of Choice (AC). We have a genuine impasse: one side views AC as essential for standard mathematics, while the other views global AC as a violation of our computational guarantees and modularity.

  Both positions are technically and philosophically defensible. However, as a software project, we must decide based on **maintainability, user expectations, and architectural integrity.**

  ### The Recommendation

  **I recommend we reject the proposal to declare `choice` a global axiom for the root namespace.**

  Instead, we will adopt a **"Constructive Core, Classical Extensions"** policy:
  1.  **Core Library:** Remains constructive by default. No global axioms.
  2.  **Classical Results:** Theorems requiring AC (like Tychonoff or Hamel bases) are merged but must be explicitly tagged (e.g., `noncomputable`, `uses_choice`) or isolated within a designated `Classical` namespace.
  3.  **CI Enforcement:** We update our linter to flag any unmarked usage of choice in the core namespace.

  ### Reasoning

  I know this requires more boilerplate for classical users. However, this approach is the only one that satisfies our technical constraints without fracturing the community. Here is why:

  **1. Preventing "Axiom Leakage" (Addressing the Constructive Camp)**
  The primary technical objection to a global axiom is not philosophical; it is about dependency tracking. If we declare `choice` globally, it becomes invisible to the type checker's dependency graph. A downstream user might import a seemingly benign lemma about finite sets, only to discover later that their entire program relies on AC, breaking code extraction.
  *   **Explicit is better than implicit:** By tagging theorems, we guarantee that a user who wants constructive guarantees can inspect imports and know they are safe.
  *   **Preserving Extraction:** We maintain the unique selling point of our library: that proofs can, where possible, be turned into running code. A global axiom burns this bridge permanently.

  **2. Enabling Classical Math Without a Fork (Addressing the Classical Camp)**
  The fear is that restricting AC makes the library useless for analysis. This is a false dichotomy. We are not *banning* AC; we are *scoping* it.
  *   **Coexistence:** We can have a `Mathlib.Classical` namespace where `open Choice` is active by default. Classical users can import that single module and proceed with standard ZFC-style reasoning for analysis and algebra.
  *   **Avoiding Fragmentation:** If we force a global axiom, the constructive users *will* fork. If we force a total ban, the classical users *will* fork. By scoping, we keep the community, issue tracker, and review pool unified. A single library with clear boundaries is healthier than two divergent forks.

  **3. Architectural Hygiene**
  In formalization, knowing *why* a proof works is as important as the proof itself.
  *   **Refactoring Safety:** If we later find a constructive proof for a theorem currently using AC, a tagged theorem makes it obvious that the dependency can be removed. A global axiom hides this technical debt.
  *   **Precedent:** This mirrors the architecture of successful libraries like Lean's `mathlib` (which distinguishes `noncomputable` definitions) and Coq's standard library (which separates `Classical` modules). They allow classical math but do not force it on the kernel.

  ### Implementation Plan

  If this recommendation is accepted at the call, I propose the following path forward for PR #[Number]:

  1.  **Refactor:** The contributor moves the AC-dependent theorems into a `Theory.Classical` module.
  2.  **Tag:** All definitions relying on choice are marked `noncomputable` (or equivalent).
  3.  **Document:** We add a `CONTRIBUTING.md` section clarifying that core modules must be choice-free, while classical modules are welcome in their designated namespace.

  ### Conclusion

  This decision is not a judgment on the validity of classical mathematics. It is a commitment to **transparency.** We should not smuggle axioms into a user's context quietly. By making choice explicit, we respect the constructive users' need for computability and the classical users' need for power, without forcing either group to abandon the project.

  Let's discuss this on the call, but I urge we vote to preserve the constructive core while formally welcoming classical extensions via scoping.

  Best,

  [Your Name]
