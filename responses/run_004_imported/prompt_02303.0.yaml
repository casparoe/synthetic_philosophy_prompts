      *   **The James-Lange Theory of Emotion:** This is the big one. James-Lange suggests emotion *is* the perception of physiological arousal. If propranolol blocks the arousal (heart pounding, shaking), does it block the emotion? The sister says "yes, mostly." The user says "no, the cognitive dread is still there initially."
      *   **Cognitive-Behavioral Model:** Anxiety has cognitive (worry), physiological (arousal), and behavioral (avoidance) components. Propranolol targets physiology. It doesn't necessarily fix the cognitive schema ("I might fail"). However, breaking the feedback loop (no shaking -> no panic about shaking) can reduce cognitive anxiety *during* the act.
