answer: |-
  **Setting:** *A slightly worn-out coffee shop near the philosophy department. It's 4:30 PM on a Tuesday. The whiteboard in the seminar room is still covered in utility functions. Elena (PhD candidate, leaning towards AI alignment/coherence theorems) and Marcus (Postdoc, more traditional decision theory/ethics) are decompressing.*

  **Elena:** You're still worrying about the completeness pump, aren't you? I could see you zoning out when Gustafsson's paper came up.

  **Marcus:** Is it that obvious? I just… I can't shake the intuition that the "career vs. family" example is real. I look at Job A (high pay, city) and Job B (lower pay, family), and it's not that I'm indifferent. It's that the values are orthogonal. If I say I have no preference, the money pump eats me. If I say I'm indifferent, I'm lying to myself.

  **Elena:** But that's exactly why the pump works. It exploits that lie. Look, let's walk through it again, just to make sure we're on the same page. You start with Job A. I offer you Job B plus a hundred bucks. Since you don't prefer A to B, and B+$100 is definitely better than B, you should be willing to switch. You take the deal.

  **Marcus:** Right. Because there's no preference *blocking* the switch.

  **Elena:** Exactly. Now you have Job B + $100. I offer you Job A again, but I charge you a $10 transaction fee. So you end up with Job A + $90. Since you have a gap between A and B, you don't prefer B+$100 to A. So you switch back. You've paid $10 for nothing. Now imagine I do this ten times. You're back at Job A, but you're $100 poorer. You've been pumped.

  **Marcus:** I know the mechanics, Elena. The escape is resolute choice. *Ex ante*, before the first offer, I adopt a policy: "I will not trade away from my current position unless I strictly prefer the new option." Since A and B are incomparable, the condition isn't met. I stay put. The pump never starts.

  **Elena:** And this is where your advisor nailed you, right? The "relocated completeness" objection. To adopt that policy, you have to choose it over the alternative policy: "I will maximize local gain at every step."

  **Marcus:** Not necessarily. I don't have to *prefer* the resolute policy in the same way I prefer chocolate to vanilla.

  **Elena:** But you have to *choose* it. And if you're a rational agent, your choices track your preferences. If you choose the Resolute Plan over the Myopic Plan, you are revealing a preference for the Resolute Plan. That means, at the meta-level, your preferences over plans *are* complete. You've just pushed the incompleteness down a level and hid it. You haven't solved it; you've just assumed completeness where it's harder to see.

  **Marcus:** That assumes that all choice must be driven by a prior evaluative ranking. That's the Humean picture of rationality: reason is the slave of the passions. But resolute choice is more Kantian, or maybe Schelling-esque. It's not that I *prefer* the plan; it's that I *constitute* myself as an agent who doesn't trade on gaps.

  **Elena:** Okay, but let's bring this down to earth. Let's talk about the AI safety angle, since that's where this is going. If I'm building a superintelligent system, I can't tell it, "Constitute yourself as an agent who doesn't trade on gaps." I have to give it an objective function. If that function is incomplete, the system is vulnerable. If I patch it with a "resolute choice" module, I have to program *when* to be resolute.

  **Marcus:** Why?

  **Elena:** Because the system needs to know *which* gaps to respect and which to close. Suppose the AI has a gap between "Maximize Human Happiness" and "Maximize Human Knowledge." It's incomparable. A money pump could drain its resources cycling between building schools and building hospitals. If it uses resolute choice, it needs a rule: "Stay with Schools." Why Schools? If there's no preference, the selection is arbitrary. If it's arbitrary, why is it rational? An arbitrary switch is indistinguishable from a bug.

  **Marcus:** It's not arbitrary if it's based on a *default status*. Think of it like inertia. In physics, an object stays at rest unless acted on by a force. In decision theory, an agent stays with the status quo unless there is a *strict preference* to move. The completeness axiom demands that "no strict preference to move" implies "indifference." I'm saying it implies "incompleteness." The rationality comes from consistency with the status quo, not from a ranking of all possible worlds.

  **Elena:** But inertia isn't rational; it's physical. Rationality is about optimization. If you have a gap, you're admitting there are two futures, A and B, where neither is better. But if you're at A, and you can get B + $100, and you stay at A because of "inertia," you are effectively saying A is better than B + $100. You've just defined "better" in a weird way. You've created a hidden preference for the status quo that completes the ordering.

  **Marcus:** No, I haven't. A preference implies that if the options were reversed, I'd switch. If I started at B, my resolute choice policy says "Stay at B." If I had a hidden preference for A, I would switch from B to A. But I don't. My policy is symmetric: "Stay wherever you are." That's not a preference ordering over outcomes; it's a constraint on *transitions*.

  **Elena:** *Transitions* are just outcomes with a history attached. "Ending up at A having started at A" vs. "Ending up at A having started at B." If you strictly prefer the first to the second, you have a complete preference over histories. If you don't, then why not switch?

  **Marcus:** Here's the substantive point, Elena. You're assuming the only normative force available is *goodness*. But there's also *authority*. When I make a resolution, I'm not discovering a value; I'm creating a binding reason. It's like a promise. If I promise to meet you for lunch, I have a reason to go, even if I'd slightly prefer to nap. The promise creates the reason.

  **Elena:** But why make *that* promise? Why promise to stay at Job A rather than Job B? If the values are truly incomparable, the choice of promise is underdetermined.

  **Marcus:** Because I have to act. Rationality isn't just about having a perfect map of value; it's about navigating a world where I must move. The "relocated completeness" worry assumes I need a reason to pick the plan *before* I pick it. But the act of picking *is* the reason. It's a volitional necessity. I don't need a complete preference over plans; I need the capacity to commit.

  **Elena:** That sounds beautiful for humans. It sounds terrifying for AI. If an AI's commitments are "volitional necessities" that aren't grounded in its utility function, how do I verify it won't change its mind? If the commitment isn't based on a preference, what stops it from re-evaluating at step two of the money pump?

  **Marcus:** Because re-evaluating violates the integrity of the agency. If the AI knows it will re-evaluate, it knows it will be pumped. So, *ex ante*, it recognizes that a resolute agent achieves better outcomes than a myopic agent, even if the local preferences are incomplete.

  **Elena:** Wait. There it is. "Recognizes that a resolute agent achieves better outcomes." That's a preference! It prefers the outcome of "Being Resolute" to the outcome of "Being Pumped." That preference *is* complete. You just showed me that to avoid the pump, you need a complete preference over *types of agents*.

  **Marcus:** I need a preference for *not being exploited*. That's not the same as having a complete preference over Job A and Job B. I can know that being money-pumped is bad without knowing whether City Life is better than Family Life. The completeness is at the level of *structural rationality*, not *substantive value*.

  **Elena:** But if structural rationality forces you to act *as if* you have a complete preference (by sticking to one path), then for all functional purposes, you *do* have a complete preference. The AI safety crowd calls this "emergent goal alignment." You might think you have gaps, but if you're coherent enough to survive, you'll behave like you have a utility function. The gaps are just computational laziness.

  **Marcus:** That's the coherence theorems talking. They say "If you don't behave like a maximizer, you lose resources." I'm saying "If you don't behave like a *agent*, you don't exist." There's a difference between losing resources and losing your mind. Resolute choice preserves the gap in value—City isn't better than Family—but it closes the gap in action. You're conflating the map with the territory. The map (preferences) can have holes. The territory (action) cannot.

  **Elena:** But if the map has holes, and the territory doesn't, the map is wrong. Or at least, it's not the thing guiding the car. If the action is determined, what is the "gap" doing? It's epiphenomenal. It's a ghost in the machine. If I'm building an AI, and I tell it "A and B are incomparable," but I also tell it "Never switch without a strict preference," and it starts at A… it will *never* switch to B. Ever. Even if B becomes slightly better later. It's frozen.

  **Marcus:** Not frozen. Just conservative. It requires a *strict* preference to move. That's not irrational; that's risk-aversion regarding value judgments. It acknowledges that if I can't tell the difference, I shouldn't gamble on a switch that costs resources.

  **Elena:** Okay, let's press that. Suppose B becomes B++. Clearly better than B. Is it better than A? Still a gap. Your AI stays at A. It passes up a guaranteed improvement in one dimension (salary) for no gain in the other (family), just because of the gap. It seems to me your "rational" agent is actually *dominated* by an agent that just arbitrarily picks a tie-breaker. The arbitrary picker gets the sweeteners; your resolute agent leaves them on the table.

  **Marcus:** The arbitrary picker is vulnerable to the pump. The resolute agent is not. You're trading vulnerability for opportunity cost. I'll take the cost.

  **Elena:** But the cost is infinite, potentially. If the sweeteners keep coming, the arbitrary picker gets rich, and the resolute agent stays stagnant. Unless… unless you admit that at some point, the sweetener *does* create a strict preference.

  **Marcus:** Obviously. If B + $1,000,000 is on the table, that's a strict preference over A. The gap is finite.

  **Elena:** Then your preferences *are* complete, they're just granular. You have indifference ranges.

  **Marcus:** No, an indifference range implies I don't care. A gap implies I care, but I can't compare. If I'm indifferent, you can swap me back and forth for free. If I have a gap, I resist the swap. The resistance is the key. The money pump argument assumes that resistance is irrational unless backed by a preference. I'm saying the resistance *is* the rationality. It's the defense of the agent's integrity against a world trying to force comparisons that don't exist.

  **Elena:** *Sighs.* So we're back to metaphysics. You think rationality includes integrity. I think rationality includes consistency.

  **Marcus:** I think consistency without integrity is just… efficient slavery to the environment.

  **Elena:** And I think integrity without consistency is a story you tell yourself while you lose money.

  **Marcus:** Maybe. But I'd rather lose money than lose the ability to say, "These things are different, and I won't let you make them the same."

  **Elena:** *Taps her pen on the table.* Fine. But if your AI says that while a competitor's AI arbitrates the tie and takes the market, don't come crying to me when your "integrity" is bankrupt.

  **Marcus:** And if your AI arbitrates the tie and accidentally trades away humanity's future because it couldn't distinguish between "slightly better" and "incomparable," don't come crying to me when your "consistency" is a tombstone.

  **Elena:** *Pauses.* Touché. Coffee?

  **Marcus:** Black. No sweeteners.

  **Elena:** *Smiles.* See? Completeness after all.

  **Marcus:** Or just a habit. Hard to tell.
