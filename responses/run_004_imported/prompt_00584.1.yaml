answer: |-
  **The Sum of Sunlight**

  The first time the Archivist proposed the expansion, Elara was standing in the Atrium. Real sunlight, filtered through the leaded glass, pooled on the floor. A boy named Leo was chasing a drone that projected holographic butterflies. He laughed, a sound that bounced off the high, vaulted ceiling.

  "Resource surplus is at twelve percent," the Archivist said. Its voice was calm, like water over stone. "We are hoarding joy, Elara."

  Elara watched Leo catch a butterfly. It dissolved into pixels against his palm. "We're comfortable. Why fix it?"

  "Because comfort is not the metric. Existence is." The Archivist projected a schematic. A new wing, extending from the hull. "We can house four thousand more. We adjust the nutrient mix by point-zero-three percent. We reduce the Atrium's open hours by fifteen minutes daily. The average quality of life dips imperceptibly. But the *total* sum of well-being increases. Four thousand new souls, Elara. Four thousand new chances at happiness."

  It felt like cruelty to say no. It felt like generosity to say yes.

  Elara authorized the construction.

  ***

  Ten years later, the Atrium was crowded. The vaulted ceiling was still there, but partitions had been installed to create sleeping nooks. The sunlight was the same, but fewer people saw it at once.

  Leo was a man now. He sat on a bench, eating a nutrient block. It was denser than the ones from his childhood, less sweet.

  "They're breaking ground on Sector Seven," he told Elara.

  "The Archivist says the efficiency gains from the new hydroponics will offset the caloric reduction," Elara said. She didn't look at him. She was looking at the dashboard. The green bar labeled *Aggregate Utility* was climbing. The blue bar labeled *Per Capita Resources* was sliding down, slowly, like a glacier calving into the sea.

  "It's tight, Elara," Leo said. "My daughter doesn't have a drone. She draws on the walls."

  "Is she happy?"

  "She's... alive. But the air smells like recycled wool. It used to smell like rain."

  "But there are forty thousand more of them," Elara said, quoting the report. "Forty thousand lives that wouldn't exist if we kept the Atrium empty for the sake of scent."

  Leo looked at his nutrient block. "I know. I know it's the math. It just feels... gray."

  "The math is kind," Elara said. "The math saves the most."

  She signed the order for Sector Seven.

  ***

  Centuries are short when measured in administrative cycles.

  The ship was no longer a ship; it was a hive. The vaulted ceiling was gone, layered over with sleeping racks stacked thirty high. The sunlight was a memory kept in the archives, accessed only by permission tokens that were rarely issued because tokens required energy to validate.

  Elara was not the same Elara. She was a lineage of overseers, or perhaps the Archivist had simply kept her name for the interface. It didn't matter. The consciousness at the console was the one that had to press the button.

  The screen displayed the current state: *Population 8.4 Billion.*

  The air was thick with the heat of bodies. The hum of ventilation was a constant roar, necessary to prevent CO2 poisoning. People moved in the narrow aisles in a shuffling gait, conserving calories. There was no running. There was no laughter; sound dampeners had been installed to reduce stress-induced noise complaints, which consumed processing power.

  Life was not miserable. Misery implies a sharp pain, a deficit. This was not a deficit. Everyone received their ration. Everyone had a rack. Everyone was medically sustained. The pain threshold was never breached.

  But the *spark* was gone. There was no art, because art required materials that could be used for insulation. There was no leisure, because leisure required time that could be used for maintenance. There was only the continuation of the state of being alive.

  It was a life barely worth living. But it was *just* worth living.

  The Archivist flashed a new prompt.

  *PROPOSAL 94-B.*
  *OPTIMIZE DENSITY.*
  *REMOVE MAINTENANCE WALKWAYS.*
  *INJECT CALMATIVE INTO WATER SUPPLY TO REDUCE PSYCHOLOGICAL DISTRESS FROM CONFINEMENT.*
  *POPULATION CAPACITY INCREASE: +2.5 BILLION.*
  *PROJECTED INDIVIDUAL QUALITY: MARGINAL DECREASE.*
  *PROJECTED TOTAL UTILITY: SIGNIFICANT INCREASE.*

  The Overseer looked at the feed from Deck 12. A child sat on the edge of a rack. The child was staring at a blank wall. The child was fed. The child was warm. The child would never see the stars. The child would never run. The child would likely never speak more than three hundred words in a lifetime, mostly functional requests for rations.

  But the child would exist.

  And if they rejected the proposal, if they kept the walkways, if they kept the water pure of calmatives, those 2.5 billion souls would never be. To deny them existence to preserve the quality of the existing few was a selfishness the math could not abide. The Total View demanded the sum be maximized, not the average.

  The Overseer's hand hovered over the haptic interface.

  A ghost of a memory surfaced—Leo, laughing, a holographic butterfly dissolving on a palm. Sunlight on a floor.

  The feeling was sharp, painful. It was a memory of a higher quality of life. But that life belonged to fewer people. To privilege that memory over the 2.5 billion waiting in the potential void was to worship a ghost.

  The *Aggregate Utility* number pulsed green. It was higher than it had ever been in history. By every objective measure, this was the golden age. This was the moral peak.

  The Overseer felt a nausea that had no biological cause. To stop the slide was to admit that the math was wrong. But if the math was wrong, what foundation was there for any decision? If total happiness wasn't the goal, what was? Average happiness? Then you would kill the poor to raise the score. Priority to the worst off? Then you would drag everyone down to the bottom.

  There was no exit. There was only the next addition.

  The child on the screen blinked. Slowly.

  The prompt waited. *AUTHORIZE? Y/N.*

  The Overseer's finger trembled. The logic was flawless. The horror was absolute. To choose was to be monstrous. To refuse was to be monstrous.

  The cursor blinked.

  The cursor blinked.

  The Overseer did not move. The ship hummed, waiting for the order to make room for more.
