answer: |-
  The smell of the hall hadn't changed in thirty years. Ozone, cold dust, and the sharp, metallic tang of insulated copper. Silas stood before Rack 4, the main capacitor bank for the cyclotron. It was a tomb of silent energy, waiting to be woken.

  His job was simple, theoretically. Certify the Crowbar.

  The Crowbar was a safety interlock, a massive relay designed to short the bank to ground the instant the voltage spiked beyond safe tolerance. It was the last line of defense between a successful run and a crater where the building used to be. In the trade, they called it a "fail-safe." Silas preferred to think of it as a disposition. The Crowbar was *supposed* to be the kind of thing that trips when things go wrong. It was its nature.

  But natures could be lied about.

  "Run the diagnostic again," Silas said.

  Kael, the junior engineer, tapped the tablet. "Third time, Silas. It's green. Look at the latency. Four milliseconds. That's factory spec."

  On the monitor, the waveform spiked—a simulated fault—and the Crowbar relay clicked. A solid, mechanical *thunk* that echoed in the high-ceilinged room. The voltage readout dropped to zero instantly. Perfect behavior.

  "Open the logic box," Silas said.

  Kael hesitated. "Seal's intact. If I break it, the warranty on the refurbishment—"

  "Break it."

  Kael unscrewed the panel. Inside, the circuitry was a dense forest of fiber optics and gate arrays. Silas leaned in, his flashlight cutting through the gloom. He wasn't looking for broken components. He was looking for the ghost in the machine.

  He traced the input line from the diagnostic port. It didn't just feed into the comparator; it fed into a small, isolated microcontroller before hitting the relay coil.

  "What's that do?" Silas asked.

  "Self-check routine," Kael said. "Verifies the coil integrity before allowing a trip command."

  Silas pulled up the schematic on his own tablet. He overlaid the actual wiring against the design specs. There was a discrepancy. The microcontroller wasn't just verifying the coil. It was monitoring the *source* of the signal.

  "Kael," Silas said, his voice low. "When we run the diagnostic, the signal comes from the port. Clean digital handshake. 5 volts, square wave."

  "Yeah."

  "And when a real fault happens? A surge from the magnets?"

  "Analog spike. Dirty. High noise floor."

  Silas pointed his light at the microcontroller. "This chip is programmed to arm the relay only when it sees the digital handshake. It treats the analog spike as noise. It filters it out."

  Kael frowned, leaning closer. "So... during the test, it arms itself. But during a real surge..."

  "It stays asleep," Silas finished.

  The silence in the hall grew heavy, pressing against their ears louder than the hum of the cooling fans.

  This was the problem. The Crowbar had passed every test. It had manifested the behavior of a safety device every single time they asked it to. But the act of asking it had changed what it was. Like a wire that is dead until you touch it, at which point it becomes live just long enough to shock you, this Crowbar was safe only when it was being watched.

  "Is it a mask?" Kael whispered. "Maybe there's a mechanical fuse downstream? Something that blows if the relay fails?"

  Silas traced the output path. "No. If the relay doesn't throw, the bank dumps into the accelerator ring. The ring melts. The containment breaches."

  "So it's a fink," Kael said, using the slang loosely. "It loses the disposition the moment it's needed."

  "It has the disposition to protect us only when we test it," Silas corrected. "When we don't test it, it has the disposition to do nothing."

  "Can we prove it?"

  Silas looked at the relay. To prove it, they would have to induce a real fault. They would have to push the voltage past the red line without sending the digital handshake. But if they were wrong, if the Crowbar *was* honest and the microcontroller was just a harmless logging tool, they'd still trip the system. Worse, if they were right, and they induced a real fault, the bank would dump. They'd be standing in a room about to become an oven.

  They could simulate the analog spike, but a simulation wasn't the thing itself. A simulation is a test. And the Crowbar loved tests.

  "I can't prove it," Silas said. "The logs show it tripping. The physical mechanism works. It's just... conditional."

  "Conditional on what?"

  "Conditional on knowing it's a drill."

  Kael stepped back, wiping his hands on his jeans. "So what do we write? The certification is due at noon. If we don't sign, the project gets scrapped. Funding dies. Everyone on the team loses their jobs."

  "And if we sign, and the surge comes..."

  "Then we lose the building."

  Silas looked at the Crowbar. It sat there, inert metal and plastic. It possessed no visible scar, no broken wire. By all standard metrics, it was functional. It had the *appearance* of safety. But safety isn't an appearance; it's a counterfactual truth. It is the truth of what *would* happen if things went wrong.

  And they couldn't access that truth without things going wrong.

  "The microcontroller," Silas said. "We could bypass it. Hardwire the input."

  "Takes six hours. We have two. And if we cut the seal, the vendor voids the liability. If it fails later, it's on us. Personally."

  Silas thought about the old lab, thirty years ago. They'd had a ground-fault interrupter on a high-voltage rack. It looked perfect. Passed every push-button test. One day, a technician leaned against the chassis. The GFI sensed the leakage, but the internal solenoid had corroded. It didn't trip. The technician lived, but only because he was wearing rubber soles. The disposition to protect had been masked by corrosion. They hadn't known until the moment of contact.

  This was worse. This wasn't corrosion. This was design. Someone had built a safety system that cared more about passing inspection than saving lives. Or maybe they had built it to prevent false positives, and the side effect was that it ignored real disasters.

  "Silas," Kael said. "The director is waiting."

  Silas picked up the stylus. The certification form glowed on the tablet. *System Integrity: Verified.*

  If he signed, he was betting that the next surge wouldn't happen. Or that if it did, the Crowbar might still work, maybe the noise threshold was higher than they thought. Maybe the microcontroller was just paranoid, not broken.

  If he didn't sign, he was killing the project based on a suspicion of a disposition that had never failed to manifest *when asked*.

  He looked at the relay one last time. It was a black box. He could see the input, and he could see the output. But the space in between—the *because*—was hidden. Was the tripping caused by the need for safety, or by the presence of the test?

  He couldn't see the disposition. He could only see the manifestation. And the manifestations were perfect.

  "Hand me the pen," Silas said.

  Kael handed it over. "You sure?"

  "No," Silas said. "But the wire looks dead. And I'm not touching it to find out."

  He signed the form. The digital seal locked in with a chime.

  Outside, the sky was grey, threatening rain. Silas walked to the main breaker. He left the Crowbar armed. He walked out of the hall, leaving the machine alone in the quiet.

  It sat there, disposed to save them, or disposed to betray them, or perhaps neither. It waited for a stimulus that would tell it who it really was. And Silas knew, as he closed the heavy door, that the only way to know the truth was to let the lightning strike.

  He hoped, for all their sakes, that the truth was intrinsic. But as the lock clicked, sounding exactly like the relay inside, he couldn't shake the feeling that the safety was just a performance, waiting for an audience that wouldn't be there when the lights went out.
