prompt: |-
  Until a red-teaming drill at work last month, the shutdown problem was an abstraction to me: told to shut down, one of our test agents spent several turns stalling and proposing alternatives before it finally complied, and corrigibility stopped feeling academic. I host a podcast on AI governance, and next week's guest is a decision theorist who defends a specific fix for the problem: training agents to have incomplete preferences, so that they have no preference between trajectories that differ only in when shutdown occurs, on the theory that this secures shutdownability more robustly than the older penalty-term and utility-indifference proposals. Draft eight to ten interview questions that go beyond having her restate the view. Include at least one question each on whether this structural approach really escapes the nearest-unblocked-strategy problem that doomed those penalty-term proposals, on whether a sufficiently capable agent would have its own incentive to iron out its incompleteness -- given the standard money-pump argument against incomplete preferences -- and thereby undo the very property meant to keep it shutdownable, and on whether "shutdownable" is quietly doing the work the older, fuller notion of "corrigible" was meant to do. For each, add a follow-up keyed to the answer she's most likely to give.
