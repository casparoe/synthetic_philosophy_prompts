      *   *The Goal:* Not necessarily truth, but *peace* and *order*. Pascal is a Jansenist Catholic; he believes in Original Sin. Human nature is fallen. We cannot achieve perfect justice on earth. Therefore, we settle for stability to prevent war of all against all.
