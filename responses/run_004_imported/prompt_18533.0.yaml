  **MEMORANDUM**

  **TO:** Incident Command Committee
  **FROM:** Deputy IT Director
  **DATE:** October 24, 2023
  **SUBJECT:** RECOMMENDATION ON RANSOM DEMAND AND RECOVERY STRATEGY

  **EXECUTIVE SUMMARY**

  After reviewing the forensic assessment, clinical impact reports, and the strategic implications of our response, I recommend the Committee **decline the ransom demand and maintain our standing policy of non-payment.**

  However, this recommendation is not based on rigid adherence to protocol. It is based on a strategic assessment that paying the demand introduces a greater, more certain risk to patient safety over the next 12–24 months than the operational risks we face during a non-payment recovery. To mitigate the immediate clinical risks, I am simultaneously proposing an emergency resource allocation plan to support our clinical units during the recovery window.

  **CURRENT SITUATION & CLINICAL IMPACT**

  We are three days into a significant ransomware incident. Two clinical units are operating on paper charts. The Chief Medical Officer has reported two medication near-misses attributed to the loss of digital verification systems. Our forensics vendor estimates a clean recovery without attacker interaction will take 7–14 days. The attackers are demanding a sum fully covered by our cyber-insurance policy.

  Four Committee members have proposed a one-time exception to our five-year "No Pay" policy. Their argument is grounded in immediate utilitarian calculus: the harm to patients this week is concrete, while the deterrent value of our policy is speculative.

  I take this argument fully seriously. If this were purely a financial decision, the calculation would be simple. But this is a patient safety decision with a time horizon longer than this week.

  **STRATEGIC RATIONALE: THE CREDIBLE COMMITMENT**

  Our "No Pay" policy was not adopted as a moral stance; it was adopted as a survival strategy. It functions on the logic of *credible commitment*.

  Ransomware actors are economic agents. They invest resources in attacking networks based on the expected return on investment (ROI). Our reputation for never paying is the single most effective control we have to lower that ROI. If we pay now, we do not merely solve this incident; we permanently alter our risk profile.

  1.  **Signaling Vulnerability:** Attackers monitor breach disclosures and industry chatter. If we pay, specifically citing "patient safety pressure" as the reason, we signal to every criminal syndicate monitoring us that we are a high-yield target. We teach them that the most effective way to breach our defenses is to wait until clinical operations are strained, then strike.
  2.  **The "Just Once" Fallacy:** A policy that includes an exception for "high stakes" is not a policy; it is a suggestion. Because ransomware attacks *always* create high stakes (patient care is always critical), an exception clause effectively nullifies the rule. If we pay today, we cannot credibly claim we will not pay next year.
  3.  **No Guarantee of Recovery:** Payment does not guarantee decryption. We have seen cases where keys are faulty, or attackers demand additional payments after the first is made. Paying funds criminal infrastructure that targets hospitals, increasing the likelihood of attacks on our network and our peers in the future.

  **MITIGATING IMMEDIATE PATIENT RISK**

  Rejecting payment is only the responsible choice if we aggressively manage the recovery risk. We cannot simply tell Clinical to "wait it out." If we hold firm on payment, we must bend over backward on support.

  I recommend the Committee immediately authorize the following **Emergency Mitigation Measures**, funded by the capital reserved for the potential ransom payment:

  *   **Staff Augmentation:** Immediately contract temporary nursing and administrative staff to reduce the workload on our current teams operating on paper charts. This reduces fatigue-related errors.
  *   **Mutual Aid Activation:** Formalize a data-sharing and patient diversion agreement with [Partner Hospital Network] for high-acuity cases that require digital integration we currently lack.
  *   **Enhanced Manual Protocols:** Deploy a "Safety SWAT Team" of pharmacy and IT staff to physically rotate through the affected units, double-checking manual medication logs against whatever backup data we can access offline.
  *   **Recovery Acceleration:** Authorize our forensics vendor to bring in additional engineering teams on a 24-hour rotation to compress the 14-day estimate.

  **DECISION FRAMEWORK**

  We are facing a choice between a *certain* long-term risk and a *manageable* short-term risk.

  *   **Paying** solves the immediate technical problem but guarantees we are targeted again, likely with more sophisticated malware, knowing we will capitulate when patients are at risk. It trades the safety of future patients for the convenience of current operations.
  *   **Not Paying** requires us to endure a difficult two weeks of degraded operations. However, it preserves the security posture that protects our patients for the next decade.

  The near-misses reported by the CMO are unacceptable. But the solution to near-misses is not funding the criminals who caused them; it is reinforcing our manual safeguards and accelerating our technical recovery.

  **RECOMMENDED ACTION**

  1.  **Vote to decline the ransom demand.**
  2.  **Authorize the Emergency Mitigation Budget** (equal to the ransom amount) to fund staff augmentation and recovery acceleration immediately.
  3.  **Issue a unified statement** to staff and the public affirming our commitment to patient safety and our refusal to fund criminal activity, framing our resilience as a core component of care quality.

  We must be the kind of organization that attackers know will not pay, even when it is hard. That is the only way to ensure they stop trying.

  **APPROVAL REQUIRED BY:** 17:00 Tomorrow
