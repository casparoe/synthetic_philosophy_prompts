          *   Ockham: Single future (ontologically determinate), Bivalence holds *simpliciter*.
          *   Prior (Branching): Multiple futures (ontologically indeterminate), Bivalence holds only *relative to a history*.
      *   *Verdict on Lineage:* It's a case of "family resemblance" rather than strict descent. Prior admired Ockham's attempt to save contingency, but the metaphysics shifted from Theological Determinism (God sees the one line) to Modal Realism/Possibilism (many branches). Calling Prior's view "Ockhamist" is partly homage, partly technical classification regarding how they handle the "necessity of the past."
      *   *The "Thin Red Line":* Some modern Ockhamists *do* posit a single actual future (like Ockham), but Prior's branching time usually implies the future is *open* in a way Ockham's wasn't (Ockham's future was open causally, but settled epistemically by God).

