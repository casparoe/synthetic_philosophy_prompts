      *   *Correction:* In modern temporal logic, "Ockhamist Semantics" usually means: Truth is evaluated at a moment/history pair. A sentence is "Ockhamist True" if it is true on the *actual* history. This preserves bivalence.
      *   *So:* Both views preserve bivalence. The difference is *why*. Ockham: God sees the line. Prior: We stipulate an actual history for semantics.
      *   *For the Protagonist:* She needs to sever the link between **Truth** and **Causal Necessity**. Both Ockhams do this. But the Medieval one admits the future is settled (by God/Oracle). The Priorian one admits the future is open (branches).
      *   *If the Oracle is infallible:* The future *must* be settled (ontologically). So Medieval Ockham is the honest fit. Prior's branching time suggests the Oracle *couldn't* know unless she forces the branch.
      *   *Argument:* The protagonist should argue that the Oracle's knowledge is a "Soft Fact." It depends on *our* choice. Therefore, we are not fated; the Oracle just sees what we *will* freely choose.
