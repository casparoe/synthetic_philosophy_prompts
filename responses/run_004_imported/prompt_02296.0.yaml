      *   *Priorian* is better for the "Freedom" aspect but struggles if the Oracle claims access to *The* Truth. If truth is history-relative, what history is the Oracle reading? If she reads the "actual" one, we are back to a single future.
      *   *Recommendation:* The protagonist should use a hybrid. Acknowledge the proposition might be true (saving the Oracle's reputation) but deny that truth implies causal necessity. However, the *strongest* logical move against "Fate" in this specific context (Oracle = Infallible) is to challenge the *temporal status* of the truth.
