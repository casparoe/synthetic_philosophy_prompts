      *   *For the Novel:* If the Oracle says "Battle will happen," and she is infallible, she implies "True *simpliciter*." The protagonist can argue: "Even if True *simpliciter*, it is not Necessary." This is the Medieval Ockham move. The Priorian move is "It is only True relative to the history where we fight."
