      *   **Section 3: Advice for the Protagonist.**
          *   The constraint: Oracle is infallible. This kills pure Branching Time (unless the Oracle picks the branch).
          *   The Goal: Deny Fate (Necessity), not Truth.
          *   The Winning Argument: Medieval Ockham's "Soft Fact." The Oracle's prophecy is true, but it is true *because* you will fight, not that you fight *because* it is true. The truth is dependent on the action, not the cause of it.
          *   Why Prior is riskier: If truth is history-relative, the Oracle's statement is incomplete without specifying the history. If she specifies the "actual" history, we are back to Medieval Ockham.
      *   **Section 4: The Verdict.**
          *   Medieval Ockham is the stronger shield here. It accepts the Oracle's power but neuters its coercive force.
          *   Caveat: It requires accepting the future is "settled" but not "necessary." This is a subtle distinction the protagonist must articulate clearly.

  6.  **Refining the Logic (Self-Correction during drafting):**
      *   *Check:* Did Prior actually call his view Ockhamist? Prior wrote *The Formal Logic of Existence*. He discussed Ockham. The specific semantics (Moment/History pairs) is often attributed to Thomason or Belnap, but labeled "Ockhamist" to distinguish from "Peircean" (no future truth).
      *   *Clarification:* In modern temporal logic, "Ockhamist" = Future contingents have truth values (Bivalence). "Peircean" = Future contingents lack truth values.
