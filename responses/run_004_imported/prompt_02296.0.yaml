  2.  **Deconstruct the Two "Ockhamisms":**

      *   **Medieval Ockhamism (William of Ockham, 14th Century):**
          *   *Problem:* Divine Foreknowledge vs. Human Freedom. If God knows $X$ will happen, $X$ must happen. How is $X$ free?
          *   *Solution:* Distinction between "Hard Facts" (settled, unchangeable past) and "Soft Facts" (past facts that depend on the future). God's past knowledge is a *soft fact*.
          *   *Metaphysics:* There *is* a single true future. God sees it. It is determinate *for God*. Propositions about the future are bivalent (True or False) *simpliciter*, even now.
          *   *Key Feature:* Bivalence holds. The future is ontologically settled (by God's vision), but causally open (to us).

      *   **Priorian Ockhamism (Arthur Prior/Nuel Belnap/John MacFarlane, 20th Century):**
          *   *Problem:* Logical Fatalism (Aristotle's Sea Battle) + Indeterminism. If "There will be a sea battle" is True now, is it necessary?
          *   *Solution:* Branching Time (Ockhamist Semantics). Truth is relative to a *moment* AND a *history* (chronicle).
          *   *Metaphysics:* There is *no* single true future ontologically. The future branches.
          *   *Key Feature:* Bivalence often fails *at the moment of utterance* unless you specify a history. However, "Ockhamist Validity" often tries to save bivalence by saying "True on the *actual* history," but since we don't know which history is actual, it gets tricky.
