answer: |-
  This is a precise and well-posed question that cuts to the heart of a confusion that plagues even professional metaphysicians. You have correctly identified that the label "Ockhamism" is doing heavy lifting in two very different architectural schemes.

  Here is the comparison you need, stripped of the history textbook padding, followed by a recommendation for your protagonist's specific tactical situation.

  ### 1. The Lineage: Homage or Heist?

  To answer your central worry directly: **Prior's formal apparatus does not capture Ockham's metaphysics.** Calling it "Ockhamist" is a case of philosophical branding rather than strict lineage. They are securing similar *logical* results (the preservation of bivalence) but via incompatible *ontological* routes.

  **William of Ockham (14th Century): The Single Line**
  *   **Metaphysics:** There is exactly one future. It is ontologically settled. God sees it as clearly as we see the past.
  *   **The Mechanism:** The distinction between *Hard Facts* (the past is fixed, e.g., "Caesar crossed the Rubicon") and *Soft Facts* (the past depends on the future, e.g., "God believed yesterday that Caesar would cross").
  *   **What it Secures:** It secures **Bivalence** (the statement "The battle will occur" is strictly True or False right now) without securing **Necessity**. The future is *determinate* (there is a fact of the matter) but not *necessary* (it could have been otherwise, prior to the choice).
  *   **The Cost:** It requires accepting that the future is already "there" in some sense (in the divine mind), even if we can't see it.

  **Arthur Prior / Modern Ockhamist Semantics (20th Century): The Branching Tree**
  *   **Metaphysics:** The future is ontologically open. There is no single "actual" future yet; there are many branching possibilities.
  *   **The Mechanism:** Truth is relativized. A proposition is not True *simpliciter*, but True-at-(Moment, History).
  *   **What it Secures:** It secures **Contingency** (the battle is genuinely not settled) while trying to salvage **Bivalence** (by saying "It is true on *this* history").
  *   **The Cost:** It requires abandoning the idea that there is a unique "Truth" about the future independent of a chosen timeline.

  **The Verdict on Lineage:**
  The modern label "Ockhamist" is applied to Prior's semantics because, like Ockham, it refuses to surrender bivalence (unlike the rival "Peircean" view, which says future contingents are neither true nor false). However, Ockham believed in a **Thin Red Line** (a single actual future known to God), whereas standard branching time semantics treats all histories as ontologically equal until they pass.

  So, to your question: *Does something essential disappear?* **Yes.** Ockham's "single true future" vanishes in Prior's branching tree. In Ockham's view, the Oracle speaks the Truth because there *is* a Truth to be spoken. In Prior's view, the Oracle speaks a truth only relative to a specific branch she is presupposing.

  ### 2. The Protagonist's Dilemma

  Your protagonist faces a specific constraint: **The Oracle is infallible.** She has never been wrong.

  This constraint creates a problem for the Priorian view. If the future is genuinely branching and open, an infallible Oracle is metaphysically impossible unless she *forces* the branch (which is fate) or she sees a "Thin Red Line" (which is Ockham's view). If your protagonist argues from Priorian branching time ("There is no fact of the matter yet!"), she implicitly accuses the Oracle of lying or guessing, which contradicts the novel's premise that the Oracle *never* errs.

  Therefore, the **Medieval Ockhamist** view is the stronger shield for her, but she must wield it carefully.

  #### Why Medieval Ockhamism Wins Here
  Your protagonist wants to deny that the battle is *fated*. In philosophical terms, she wants to deny **Necessity**, not **Truth**.

  *   **The Priest's Argument:** "The Oracle says 'Battle.' The Oracle is never wrong. Therefore, 'Battle' is True. If it is True, it must happen. Therefore, it is Fated."
  *   **The Priorian Counter:** "'Battle' is not True yet. It is only true relative to histories where we fight. We can choose a history where we don't."
      *   *Weakness:* This undermines the Oracle's infallibility. It suggests the Oracle is speaking from a perspective that doesn't exist yet.
  *   **The Medieval Ockhamist Counter:** "'Battle' *is* True. The Oracle is right. But Truth does not imply Causal Necessity."

  #### The Argument She Should Make
  She should argue that the Oracle's prophecy is a **Soft Fact**.

  1.  **Acknowledge the Truth:** "I do not deny the Oracle speaks truly. I grant that the proposition 'The battle will occur' is True right now." (This disarms the priests who will accuse her of heresy/denial).
  2.  **Attack the Direction of Fit:** "But you mistake the direction of dependence. The proposition is not true *causing* us to fight. The proposition is true *because* we will fight."
  3.  **The Soft Fact Distinction:** "God's knowledge (or the Oracle's vision) of our action is parasitic on the action itself. It is a 'soft fact' about the present. It looks like a settled constraint from this side of time, but it is actually a reflection of a free choice made on the other side."
  4.  **The Conclusion:** "The battle is certain, but it is not necessary. It is certain *given* our choices. If we choose differently, the Oracle would have spoken differently. The prophecy is a mirror, not a chain."

  ### 3. The Philosophical Cost (For Your Scene)

  If she takes this route, she must accept a hard pill: **The future is settled.**

  This is the "steep price" you asked about. By using Medieval Ockhamism to save freedom, she concedes that there *is* a single future where the battle happens. She is arguing that *they will freely choose to fight*, and that is why the Oracle is right.

  If her goal is to say "We can choose *not* to fight, and thus prove the Oracle wrong," she **cannot** use Ockhamism (Medieval or Priorian). She must use **Aristotelian Open Future** (Peircean semantics), which states the proposition is currently neither True nor False. But this forces her to call the Oracle a liar (or speaking nonsense), which contradicts the "never wrong" premise.

  **Recommendation:**
  Have her use the **Medieval Ockhamist** argument. It is more sophisticated and fits the "Infallible Oracle" world-building.
  *   **The Drama:** The tension comes not from "Can we change the future?" but from "Can we own the future?"
  *   **The Logic:** She admits the battle *will* happen (Truth), but denies it is *fated* (Necessity). She argues that the Oracle's infallibility is proof of their freedom, not their bondage. If they were puppets, the Oracle would be a programmer. Because they are free, the Oracle is a witness.

  ### 4. Summary for the Logician

  *   **Are they the same?** No. Medieval Ockhamism = Single Future + Soft Facts. Priorian Ockhamism = Branching Futures + Relative Truth.
  *   **Which helps her?** Medieval Ockhamism.
  *   **Why?** It respects the Oracle's infallibility (Bivalence holds) while severing the link between Truth and Causal Necessity.
  *   **The Price:** She must admit the battle *will* occur. Her victory is not avoiding the battle, but reclaiming the *agency* within it. She argues that the prophecy is true *because* they choose to fight, not that they fight *because* it is true.

  This gives her a defensible logical position that doesn't require breaking the rules of your world (the Oracle's power) but reinterprets the metaphysical implications of that power. It turns the scene from a debate about *prediction* into a debate about *dependence*.
