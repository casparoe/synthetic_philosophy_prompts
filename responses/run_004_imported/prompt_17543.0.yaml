  Both students are arguing fluently within the framework of 1990s physicalism, but they are jointly missing the contemporary shift away from the metaphysics of "causal oomph." They both assume that for the mental to be a cause, it must compete with the physical for the same causal slot (a "production" view of causation). They are missing **interventionism** (e.g., Woodward), which defines causation via invariance under manipulation rather than sufficient physical production; on this view, mental properties can be causes even if physically realized, provided they support distinct counterfactuals. They are also overlooking **non-competitive realization models** (e.g., Wilson's subset strategy or constitution views), which argue that the mental and physical do not stand in a relation of distinct existence that would allow for exclusion in the first place. Essentially, they are fighting over who gets to drive the car, when the better move might be to argue that the driver and the engine aren't competing entities.
