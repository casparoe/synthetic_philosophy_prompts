answer: |-
  This is a fantastic student objection, and it is a very common misunderstanding of Nozick's entitlement theory. It's great that she's pushing on the implications, but on the specific point of whether "older history is irrelevant," **she is mistaken, and your instinct to worry about the rectification chapter is correct.**

  Here is the breakdown of why her reading doesn't hold up, which should help you structure your email.

  ### 1. Entitlement Theory is *Fully* Historical, Not Just "Recent" Historical
  Nozick's theory consists of three principles:
  1.  **Justice in Acquisition:** How unowned things become owned.
  2.  **Justice in Transfer:** How owned things move between people.
  3.  **Justice in Rectification:** What happens when 1 or 2 are violated.

  A distribution is just only if everyone is entitled to what they hold based on **the entire chain of history**, not just the most recent link. This is the *nemo dat quod non habet* principle ("no one gives what they do not have"). If I steal a watch, I am not entitled to it. If I voluntarily sell it to you, you are not entitled to it, even though our transaction was consensual. My lack of entitlement infects the chain.

  The student is treating Nozick as a **transactional voluntarist** (only the current handshake matters) rather than a **historical entitlement theorist** (the whole lineage matters).

  ### 2. The Scope of the Wilt Chamberlain Argument
  The Wilt Chamberlain argument is a *conditional* argument. It says:
  *   **IF** D1 is just (everyone is entitled to their holdings in D1),
  *   **AND** the transfers to D2 are voluntary,
  *   **THEN** D2 is just.

  The argument is designed to show that **liberty upsets patterns**. It is not designed to show that **voluntary transfers cure past injustices.**

  Nozick explicitly assumes D1 is just for the sake of the argument. He is attacking egalitarians who say D2 is unjust *because it violates equality*, even if D1 was equal and the transfers were voluntary. He is not arguing that D1 is automatically just regardless of how it came about.

  ### 3. Why Rectification Matters (and why the student is wrong about "washing out")
  You are exactly right to point to the rectification principle. If the student were right—that only recent transfers matter—Nozick wouldn't need a principle of rectification. He could just say, "As long as the current owner bought it willingly, it's theirs."

  But Nozick acknowledges that much of the real-world property distribution is tainted by past violations of justice in acquisition (theft, conquest, slavery) or justice in transfer (fraud, coercion). Because those violations occurred, current holdings are theoretically suspect, regardless of how many voluntary hands the property has passed through since.

  This is why Nozick writes:
  > "The principle of rectification presumably will make use of its best estimate of subjunctive information about what would have occurred... or a patterned principle of distribution of holdings."

  He admits that because history is so messy, we might not be able to trace every chain back to a just acquisition. But that is a **practical/epistemic limitation**, not a **theoretical concession**. Theoretically, the history matters all the way back. Practically, we might have to approximate.

  ### 4. How to Frame the Reply to the Student
  You can validate her sharpness while correcting the interpretation. Something like this:

  *   **Praise:** "This is an excellent implication to draw, and it highlights a tension many readers feel."
  *   **Correction:** "However, Nozick's theory is more demanding than just looking at the recent transaction. For Nozick, entitlement is like a chain of title in property law. A voluntary transfer cannot cleanse a title that was stolen three generations ago. If the original acquisition was unjust, the entitlement never properly passed, regardless of subsequent voluntary exchanges."
  *   **The Wilt Limit:** "The Wilt Chamberlain argument assumes the starting point (D1) is already just. It proves that voluntary action disrupts *patterns*, not that voluntary action erases *history*."
  *   **The Rectification Hook:** "This is precisely why Nozick spends so much time on 'rectification' later. He knows that if we take historical entitlement seriously, most modern property claims are vulnerable because of past injustices (slavery, colonization, etc.). He doesn't think history washes out; he thinks fixing it is incredibly difficult."

  ### Summary
  The student has conflated **"Liberty upsets patterns"** with **"Liberty cures theft."** Nozick endorses the former, but the latter would undermine his entire Lockean proviso and historical entitlement framework.

  Your intuition is spot on: if history didn't matter, the rectification chapter would be unnecessary. The fact that it exists proves that for Nozick, the "year dot" (or at least the point of first unjust acquisition) matters immensely.
