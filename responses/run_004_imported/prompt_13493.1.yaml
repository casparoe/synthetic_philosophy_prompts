      *   *Why Stalnaker?* Stalnaker sees the "contingency" of necessary truths as an artifact of our ignorance of the actual world, not a distinct modal dimension. He doesn't need to ban strong necessities to save physicalism; he just denies that 1-possibility implies 2-possibility in the way C&J want. He treats the 2D framework as describing *information states*, not *modal reality*.
