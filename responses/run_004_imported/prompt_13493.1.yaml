      *   **Stalnaker:** 2DS (specifically diagonalization) is a tool for *pragmatics* and *communication*. It explains how we update the "common ground" when we learn identity statements (e.g., Hesperus is Phosphorus). It is *externalist*. Content is determined by the world, not just by internal concepts. The "diagonal proposition" isn't a distinct layer of *meaning* residing in the head; it's a function of how context resolves reference. For Stalnaker, necessary truths can be informative because we don't know which world we are in. He doesn't need the 1-intension to track *metaphysical* possibility, only *epistemic* situations compatible with our knowledge.
      *   **The Clash:** C&J treat the 1-intension as revealing the *nature* of concepts (internalist/fregean). Stalnaker treats the diagonal as revealing the *structure of information exchange* (externalist/russellian).
