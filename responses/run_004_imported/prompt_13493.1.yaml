      *   *Implication:* For C&J, if you can conceive it, it's a scenario. For Stalnaker, if you can conceive it, it's just a context you haven't ruled out yet.

  6.  **Finalizing the Argument:**
      *   **Stake:** Metaphysical discovery (C&J) vs. Epistemic tracking (Stalnaker).
      *   **Strong Necessities:** C&J must ban them to bridge the gap. Stalnaker accepts the *appearance* of them as epistemic limitations.
