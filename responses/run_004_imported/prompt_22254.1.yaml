      *   **The Anthropic/Polis Case Study:**
          *   Analyze what they actually did. They asked people to propose and rate principles.
          *   Did they filter for liberal neutrality? Yes, implicitly (e.g., no hate speech).
          *   So, was it pure crowdsourcing? No, it was crowdsourcing *within bounds*.
      *   **Why the Label Matters:**
