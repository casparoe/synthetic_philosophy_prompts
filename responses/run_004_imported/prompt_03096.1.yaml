  I'm about a third of the way into a novel whose protagonist, Ada Voss, was raised in an isolated religious community in the mountains and left it a decade ago, at nineteen. The chapter I'm drafting now takes place on a single sleepless night some years later, when a small discrepancy in an old photograph sets off a far larger unraveling: Ada begins interrogating, one by one, the things she has simply taken for granted, and finds she can't always tell whether a given belief is a piece of the community's peculiar theology, an ordinary fact about the world she could in principle be wrong about, or something so basic that doubting it would be a category mistake rather than an act of intellectual courage. I want the scene's internal logic to be philosophically load-bearing rather than merely atmospheric, so I've been rereading Wittgenstein's On Certainty for a more exact vocabulary of how doubt actually works.

  What I take from the book is that Wittgenstein doesn't treat certainty as a single property running from "very sure" to "very unsure." Some propositions function as hinges: not things we've checked and found true, but fixed points that make checking anything else possible in the first place, as in the well-known hinge passage (remarks 341–343). Yet he's equally insistent, in the river-bed passages (remarks 96–99), that the boundary between a hinge and an ordinary empirical claim isn't fixed for all time, and, on one natural reading of those remarks, that what does hinge-work within one form of life needn't do hinge-work within another. That second point is exactly Ada's difficulty: she cannot tell, of any given certainty she carries, whether it is a hinge for any rational creature whatsoever, a hinge that was only ever local to her upbringing, or simply an untested empirical belief she never thought to question.

  To get the scene's psychology right, I'd like help sorting the ten beliefs below, all candidates for what might be running through Ada's mind that night, into five tiers by how resistant to doubt they are in this specific Wittgensteinian sense, rather than by ordinary confidence. Use S for propositions no rational agent could coherently doubt without the whole practice of doubting collapsing; A for propositions that functioned as hinges within Ada's particular upbringing but aren't obviously binding on just any thinker; B for propositions that are genuinely contested in the secondary literature as hinges either way; C for ordinary empirical beliefs that could in principle be revised by evidence without any special crisis; and D for claims that are simply false, or were never more than untested folk belief even locally.

  (a) She has two hands.
  (b) The earth existed for a long stretch of time before she was born.
  (c) She is not, at this moment, dreaming.
  (d) Two plus two equals four.
  (e) Other people have inner experience roughly like her own.
  (f) The sun will rise again tomorrow.
  (g) The community's founder could not have been wrong about core doctrine.
  (h) The name she has always gone by is really her name.
  (i) Her memories of her childhood in the community are broadly accurate.
  (j) The land beyond the community's boundary is barren and uninhabitable, as she was taught.

  Please add a one-sentence justification for each placement, one that engages with what specifically makes the belief hinge-like or not rather than with how confident an ordinary person would be in it, and format the whole answer as a JSON block along these lines:

  ```json
  {
    "S": ["(a)", ...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...],
    "justifications": {
      "(a)": "...",
      ...
    }
  }
  ```
