prompt: |-
  My grandmother, Marguerite, died nine days ago at eighty-six, and I have been asked — as the family's resident novelist, apparently a transferable skill — to write and deliver her eulogy this coming Saturday. The room will be a genuinely mixed one: her three surviving sisters, most of her old bridge club, a dozen grandchildren, and my brother, who is two years from finishing a philosophy doctorate and will be listening for something none of the others will even notice if I get it wrong.

  For the last decade of her life Marguerite had Alzheimer's, and she managed it, long after she had stopped reliably recognizing most of us, through an elaborate system of index cards that had begun decades earlier as the ordinary habit of a woman who liked to keep track of things, and hardened by necessity into something closer to a second memory: who everyone was, what she had already told you twice, which pills came before lunch. My brother has taken to calling her, only half in jest, "the most literal Otto anyone in this family will ever meet." He means Otto the Alzheimer's patient from an old thought experiment by Andy Clark and David Chalmers, who consulted a notebook the way the rest of us consult memory, and whom Clark and Chalmers argued had, in a perfectly literal sense, part of his mind sitting on the page rather than behind his eyes — not a prosthetic standing outside his cognition but a working piece of it, precisely because he checked it constantly, trusted what it told him without a second thought, and had put every word there himself, over years, by his own earlier hand. My brother wants the eulogy to lean on this, gently: to say that Marguerite was not fading behind her cards during those ten years but was, in some real sense, distributed across them — as fully present as anyone whose memory happens to live entirely on the inside.

  I want to get this right, and I can see two ways to fail. The philosophical way is to let the idea run away with the eulogy: half the room has never heard of the extended mind thesis and did not come to a funeral for an argument, however elegant, about the metaphysics of memory — they want to feel something true about where their sister or grandmother actually was, not follow a proof that she was there. The other is a constraint from Marguerite herself, who, in one of her last unambiguously lucid weeks, made my mother promise that nobody would stand up at this service and describe her as having "gone behind the cards" once she came to depend on them, since she considered that both maudlin and, by her own lights, false. What I'd like, then, is a eulogy of about five minutes that takes the philosophy seriously enough to let it do real work — shaping what I am and am not entitled to claim about the last decade of her life — without turning into a seminar, and without helping itself to a certainty about the metaphysics of mind that even my brother admits the theory was never quite built to supply.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Grandchild (resident novelist).
      *   **Subject:** Grandmother Marguerite (died at 86, 9 days ago).
      *   **Audience:** Mixed (3 surviving sisters, bridge club, 12 grandchildren, philosopher brother).
      *   **Key Theme:** Marguerite's Alzheimer's and her use of index cards.
      *   **Philosophical Angle:** The "Extended Mind Thesis" (Clark & Chalmers' Otto example). She wasn't fading *behind* the cards; she was distributed *across* them.
      *   **Constraints:**
          *   Don't make it a philosophy seminar (keep it accessible/emotional).
          *   Honor Marguerite's wish (don't say she "went behind the cards" or imply she was lost).
          *   Don't overclaim metaphysical certainty (keep it gentle/plausible, not dogmatic).
          *   Length: About 5 minutes (roughly 600-800 words spoken at a moderate pace).
      *   **Tone:** Respectful, warm, intellectually honest but grounded in love.

  2.  **Deconstruct the Philosophical Concept (Extended Mind Thesis):**
      *   *Otto:* Has Alzheimer's, uses a notebook.
      *   *Inga:* Normal memory.
      *   *Argument:* If Otto trusts the notebook, accesses it easily, and it guides his action just like biological memory, the notebook is *part of his mind*.
      *   *Application to Marguerite:* Her index cards weren't a crutch; they were her memory. She wasn't less present; her presence was just expanded into the physical world.
      *   *Nuance:* The prompt warns against "overclaiming certainty." So, phrase it as a way of seeing her, a lens of love, rather than a scientific proof.

  3.  **Address the Constraints:**
      *   *The Sisters/Bridge Club:* Need stories, warmth, recognition of her character (organized, loving, present). Avoid jargon.
      *   *The Brother:* Needs the philosophical nod to be accurate but integrated. He needs to feel the *spirit* of the argument without needing the footnotes.
      *   *Marguerite's Wish:* Explicitly avoid the phrase "gone behind the cards" or the sentiment that she was "lost" during the last decade. Frame the cards as an extension of her agency.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the mixed crowd, and the task. Establish the voice (novelist grandchild).
      *   **The Middle (The Cards):** Describe the system. It wasn't just medical; it was *her*. Connect it to who she always was (organized, bridge player).
      *   **The Philosophical Turn (Gentle):** Introduce the brother's insight. Use the "Otto" reference but keep it light. Explain the core idea: the cards *were* her memory, not a replacement for it.
      *   **The Emotional Core:** How did this look in practice? She was still Marguerite. She still loved us. The medium changed, the message didn't.
      *   **Closing:** Bring it back to the present. Where is she now? Not in the cards, but in us. A final farewell that honors her specific wish.

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Replace "Extended Mind Thesis" with "a way of thinking about where we live." Keep the Otto reference brief or implied. Let's mention Otto but explain it simply.
      *   *Critique:* Is it too sentimental?
      *   *Fix:* Ground it in the physical reality of the index cards. The smell of them, the handwriting.
      *   *Critique:* Did I violate her wish?
      *   *Fix:* Ensure I explicitly state she didn't retreat. She expanded.

  6.  **Drafting - Specific Phrasing:**
      *   *Instead of:* "Clark and Chalmers argue..."
      *   *Try:* "My brother, who studies how we think, told me about a philosopher's thought experiment..."
      *   *Instead of:* "She was cognitively distributed."
      *   *Try:* "Her mind wasn't shrinking; it was reaching out."
      *   *Key Constraint Check:* Make sure to say she didn't "go behind the cards."

  7.  **Timing Check:**
      *   Average speaking pace is ~130 words per minute.
      *   5 minutes = ~650 words.
      *   I need to keep it tight.

  8.  **Final Polish:**
      *   Check the rhythm. Eulogies need pauses.
      *   Ensure the transition from the philosophy back to the emotion is smooth.
      *   Make sure the ending lands on the sisters and the family.

  **(Self-Correction during drafting):** I initially thought about explaining the Otto experiment in detail. No, that's the "seminar" trap. Just mention the name briefly for the brother, but focus on the *implication* for the rest of the room. The core message is: *She was still here.*

  9.  **Final Review against Prompt:**
      *   5 minutes? Yes.
      *   Philosophy included but not dominant? Yes.
      *   Marguerite's wish respected? Yes.
      *   Brother satisfied (subtly)? Yes.
      *   Sisters/Bridge club engaged? Yes.

