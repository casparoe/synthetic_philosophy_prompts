answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], Marguerite's granddaughter. I've been asked to speak today, ostensibly because I'm the family novelist, which apparently qualifies me to summarize a life of eighty-six years in five minutes. It is a daunting assignment, mostly because Marguerite was a woman who valued precision. She would have edited this speech before I ever stepped up to the microphone.

  For the last decade of her life, Marguerite lived with Alzheimer's. We all know what that disease is supposed to do. It is supposed to take a person away before they leave. It is supposed to dim the lights from the inside out. And for a while, I think many of us watched her with that specific, quiet grief reserved for people who are physically present but seemingly fading behind a glass wall.

  But Marguerite refused to fade.

  As many of you know, she managed her condition with a system of index cards. Some of you saw them. The shoeboxes in the living room, the stacks on the nightstand, the cards in her pockets. They told her who we were. They reminded her to take her pills before lunch, not after. They recorded what she had already told you, so she wouldn't repeat the story about the bridge tournament in 1974 unless she knew you hadn't heard it yet.

  To look at her then, shuffling through those cards, it would be easy to think she was relying on a crutch. It would be easy to say that her real self was retreating, and these cards were just a prosthetic, a substitute for the woman she used to be.

  But Marguerite made my mother promise something, during one of her last clear weeks. She said that no one was to stand up here and say she had "gone behind the cards." She said that was maudlin. And she said it was false.

  She was right.

  My brother, who is finishing a doctorate in philosophy, helped me understand why. He told me about a thought experiment involving a man named Otto, who also had memory loss and used a notebook to navigate the world. Philosophers argued that Otto's notebook wasn't just a tool he used; in a very real sense, it *was* his memory. Because he trusted it completely, because he accessed it constantly, and because he had written the words himself, the notebook wasn't outside his mind. It was part of it.

  When I look back at the last ten years, I realize this is what Marguerite was doing. She wasn't shrinking. She was expanding.

  When she picked up a card to check my name, that wasn't a moment of loss. That was a moment of connection. She had built a bridge between her mind and the world, and she crossed it every day to find us. The love in her eyes when she recognized me wasn't happening *despite* the cards. It was happening *through* them. The cards were the architecture of her attention. They were how she made sure that when she looked at you, she saw you clearly.

  So, I am not going to tell you that the Marguerite of the last decade was a ghost of the Marguerite who came before. She was not hiding. She was distributed. She was in the handwriting on those index cards. She was in the order of the shoeboxes. She was in the deliberate way she asked you about your job, because she had written herself a reminder to care about the answer.

  To her sisters, here today: She kept your names at the very top of the stack.
  To her bridge club: She kept the score of the game, even when she couldn't keep the date.
  To her grandchildren: She kept a record of our birthdays, long after she stopped knowing how old she was.

  There is a comfort in this, I think. We often worry about where people go when their memories fail. But Marguerite taught us that memory isn't just a biological spark behind the eyes. It is a practice. It is something we build, something we write down, something we share.

  She did not go behind the cards. She wrote herself into them. And now, as we put those cards away, we have to recognize that the work of remembering her doesn't stay in a shoebox. It passes to us.

  She was present then, as fully as anyone can be. And she is present now, not in the paper, but in the way we choose to keep track of one another. She was a woman who believed that if you loved someone, you wrote it down. You kept track. You made sure you knew who they were.

  So, we will do the same for her. We will remember Marguerite not as someone who was lost, but as someone who found a new way to stay found.

  Thank you.
