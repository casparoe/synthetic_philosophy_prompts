      *   **Jaynes' Solution:** Use the Principle of Transformation Groups (PTG). The problem statement implies the circle's size and position are irrelevant. Therefore, the distribution must be invariant under translation and scaling.
      *   **Jaynes' Derivation:** He derives a specific measure $dP = \frac{1}{2\pi R} dp \, d\theta$ (where $p$ is distance from center, $\theta$ is angle). This leads to the $1/2$ result (random radius point).
      *   **The Friend's Objection:** Invariance conditions depend on *what* is being transformed. Jaynes assumes the "straw" method (lines in the plane intersecting the circle). If you assume the "dart" method (points inside the circle defining midpoints), that is *also* invariant under translation/scaling of the circle itself, but yields $1/4$.
