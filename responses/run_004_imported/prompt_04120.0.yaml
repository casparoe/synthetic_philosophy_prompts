      *   *Check Jaynes' specific claim:* Jaynes explicitly argues that the "dart" method violates translation invariance. If you move the circle, the dart thrower moves with it (conditional on hitting the circle). If you throw straws from a fixed frame, moving the circle changes which straws hit.
      *   *Friend's Counter:* But the problem statement doesn't specify a fixed frame external to the circle. It just says "a circle." If the circle is the universe, translation invariance is meaningless. If the circle is in a plane, we need to know the distribution of lines in that plane.
