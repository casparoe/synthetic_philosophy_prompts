      *   **The Role of Determinism:** Strawson explicitly states the Basic Argument works *regardless* of determinism or indeterminism. It is not a standard hard-determinist argument.
      *   **The Role of Indeterminism (Randomness):** If an action is random, it is not *authored* by the agent. If it's not authored, the agent isn't responsible. Randomness doesn't equal freedom/control.
