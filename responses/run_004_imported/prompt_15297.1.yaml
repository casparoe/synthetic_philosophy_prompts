answer: |-
  Sorry to break it to you, but on the specific terms of Galen Strawson's **Basic Argument**, your housemate is right.

  It is a very common reaction to think Strawson is just rehashing standard hard determinism, and it's frustrating because it *feels* like indeterminism (randomness) should solve the problem. But Strawson designed the Basic Argument specifically to block that escape hatch.

  If you want to win (or at least hold your ground) next time, you need to stop treating it like a physics argument about cause-and-effect and start treating it like a logic argument about **self-creation**.

  Here is the breakdown of why your housemate is correct about Strawson, why randomness doesn't help, and how you can actually push back without looking like you missed the reading.

  ### 1. It's Not Hard Determinism (It's Hard Incompatibilism)
  Standard hard determinism says: *You aren't responsible because the past + laws of nature determine your actions.*
  Your counter: *But what if the past doesn't determine the actions? What if there's randomness?*

  Strawson's Basic Argument says: *You aren't responsible because you didn't create yourself.*
  Your counter: *But what if there's randomness?*
  Strawson's reply: *Randomness doesn't make you the creator.*

  The Basic Argument is distinct because it claims moral responsibility is impossible **whether determinism is true or false**. It relies on the concept of **Ultimate Responsibility (UR)**. To be ultimately responsible for an action, you must be responsible for the mental state that produced the action. But to be responsible for *that* mental state, you must have chosen it based on a *previous* mental state... and so on, forever.

  ### 2. Why Indeterminism (Randomness) Fails Here
  Your intuition is that if an event isn't caused by the past, it must be caused by *me*. Strawson (and many others) argue there is a third option: **Luck.**

  Imagine your decision is like a train.
  *   **Determinism:** The train is on tracks laid by the past. You aren't driving.
  *   **Indeterminism:** The tracks end, and the train flies off into the void randomly.

  In the indeterminist scenario, the action isn't determined by your past character, sure. But if it's truly undetermined, it's essentially a random quantum glitch in your neurons. If your choice to save a puppy instead of kicking it is the result of a random neural fluctuation, **you didn't author it.** It just happened *in* you.

  For moral responsibility, you need **control**.
  *   Determinism removes control (you are pushed by the past).
  *   Randomness removes control (you are pushed by chance).

  Neither gives *you* the steering wheel. This is often called the **"Dilemma of Determinism"**: If it's determined, it's not free; if it's random, it's not free.

  ### 3. The *Causa Sui* (Self-Cause) Point
  Your housemate mentioned *causa sui*, and while it sounds like pretentious jargon, it is the actual core of Strawson's argument.

  To be truly morally responsible, you would have to be the cause of your own nature. You would have to choose your own genes, your own upbringing, and your own initial preferences.
  *   But to make a choice, you already have to have *some* preferences (reasons for choosing A over B).
  *   Where did those preferences come from?
  *   If you chose them, you needed prior preferences to make that choice.
  *   If you didn't choose them, you aren't responsible for them.

  This is the regress. You cannot pull yourself up by your own bootstraps. You cannot exist *before* you exist in order to design the person who will eventually exist. Since you can't be *causa sui* (self-caused), you can never be ultimately responsible.

  ### 4. How to Not Lose Next Time
  Okay, so your housemate is right about Strawson. Does that mean you have to concede the whole debate? No. You can shift the ground to where the argument is actually weak.

  **Move 1: Attack the Definition of Responsibility**
  Strawson sets the bar for "moral responsibility" impossibly high (Ultimate Responsibility). You can argue that this isn't the kind of responsibility we actually care about.
  *   *Argument:* "Strawson proves we can't be 'God-like' creators of ourselves. But do we need to be? We just need to be responsive to reasons. If I can deliberate and act on my desires, that's enough for practical responsibility, even if I didn't choose those desires originally."
  *   *Why it works:* This moves you to **Compatibilism**. Most philosophers today are compatibilists. They agree with Strawson that *Ultimate* Responsibility is impossible, but argue that *Moral* Responsibility (blame/praise based on current capacities) is still valid and useful.

  **Move 2: The "Luck" Objection goes both ways**
  Strawson assumes randomness is just "luck." But Libertarians (philosophers who believe in free will) argue that agent-causation allows the self to be a substance that initiates chains without being determined.
  *   *Argument:* "Strawson assumes the only options are 'determined by past' or 'random noise.' He ignores the possibility that the 'Self' is a distinct causal power that isn't reducible to neurons. If the Self is the cause, it's not random, and it's not determined by the past."
  *   *Warning:* This is metaphysically spooky and many philosophers hate it, but it is a valid counter-position to Strawson.

  **Move 3: Call out the "Regress" as a Trick**
  *   *Argument:* "Strawson's regress proves too much. By his logic, I can't be responsible for anything unless I created the universe. That suggests his definition of responsibility is broken, not that free will is impossible. If a standard makes responsibility impossible for any finite being, it's a bad standard."

  ### Summary for your 1 AM Recap
  If you talk about this again, lead with this:

  > "I looked into it. You were right that Strawson's Basic Argument isn't just hard determinism. It's designed to block indeterminism too by arguing that randomness doesn't equal authorship (*causa sui*). I was conflating the Basic Argument with the Consequence Argument. **However**, Strawson only proves that *Ultimate* Responsibility is impossible. He doesn't prove we lack the kind of practical responsibility required for society and ethics. So, he wins on metaphysics, but we can still keep moral blame/praise on pragmatic grounds."

  That shows you understood his argument (giving your housemate credit) but kept your own philosophical position intact ( Compatibilism). Good luck!
