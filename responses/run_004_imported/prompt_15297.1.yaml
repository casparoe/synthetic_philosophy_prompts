prompt: |-
  Me and my housemate got into a whole thing last night about free will after our seminar reading on Galen Strawson's Basic Argument against moral responsibility (that "Impossibility of Moral Responsibility" paper of his), and I can't stop thinking about it. My understanding is that the Basic Argument is basically just a fancier version of the standard hard-determinist line -- the reason you can never be truly responsible for anything is that your actions are the inevitable output of a causal chain (genes, upbringing, whatever) stretching back before you were even born, so of course you didn't "really" choose to be the kind of person who does what you do. Given that, it seems like the obvious escape hatch is indeterminism: if there's genuine quantum randomness feeding into how our brains form character and make choices, that breaks the deterministic chain and gives us some room to actually originate our own actions instead of just being pushed along by prior causes.

  My housemate thinks this whole "just add randomness" move is a total non-starter and that Strawson's regress bites just as hard under indeterminism, but when I pushed her on why, she just kept repeating something about "causa sui" and how you'd have to create yourself from nothing, which honestly sounded like a dodge to me -- surely undetermined events are exactly what you'd need to stop everything being "caused by prior causes"? We went back and forth for like an hour and never got anywhere, it was kind of a dumb arguement to have at 1am tbh. Can you settle it: is the Basic Argument really just hard determinism in disguise, so that showing indeterminism is real would refute it, or is there something to her claim that it doesn't matter either way and I'm just missing something obvious? I'd definitly like to understand this well enough to not lose the argument next time.
