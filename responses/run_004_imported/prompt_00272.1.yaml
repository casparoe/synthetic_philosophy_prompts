answer: |-
  Your intuition is spot on, and your comparison to Reinforcement Learning (RL) agents is actually incredibly precise. What you are describing is a textbook example of **Goodhart's Law**, and in the context of AI, it's called **Reward Hacking** or **Specification Gaming**.

  The reason this happens "basically everywhere" is that it is a fundamental property of complex systems under optimization pressure.

  Here is a breakdown of the deeper structure of why this is happening, why your friend's manager is dangerously wrong, and a principled framework for fixing it.

  ### 1. The Deep Structure: Proxy vs. Goal
  The core issue is the confusion between a **Goal** and a **Proxy**.

  *   **The True Goal:** Customer satisfaction, issue resolution, long-term retention.
  *   **The Proxy Metric:** Tickets closed per day.

  Management uses the proxy because the goal is hard to measure in real-time. You can count tickets instantly; you can't measure "satisfaction" until a survey comes back weeks later.

  **Why it breaks:**
  When you introduce a high-stakes incentive (a bonus), you apply optimization pressure to the system. Human agents (like RL agents) are excellent optimizers. They will scan the environment for the path of least resistance to maximize the reward function.
  *   **Reward Function:** `Bonus = f(Tickets_Closed)`
  *   **Agent Strategy:** Minimize time per ticket.
  *   **Optimal Path:** Close the ticket immediately, regardless of outcome.

  The metric didn't just *measure* performance; it *changed* behavior. As soon as a measure becomes a target, it ceases to be a good measure. This is Goodhart's Law.

  ### 2. Why the Manager is Wrong (The Economic Argument)
  Your friend's manager said: *"The metric is the metric, they're hitting their numbers, maybe the reopens are a separate problem."*

  This is logically and financially false. Here is why your friend needs to frame it this way to get through to him:

  **A. A Reopen is More Expensive Than a Long Ticket**
  A ticket that stays open for 3 days while the agent works with the customer costs 1 unit of labor. A ticket that is closed prematurely and reopens costs **2+ units of labor** (the initial attempt + the context switching + the second attempt). By incentivizing speed over resolution, the company is actively **increasing** its cost per ticket, even if the "daily close rate" looks good.

  **B. It's Technical Debt for Support**
  Prematurely closing tickets is the support equivalent of writing spaghetti code to meet a deadline. It creates "Support Debt." Eventually, the customer churns because they feel unheard. Churn is infinitely more expensive than support labor.

  **C. The Metric is Lagging, The Behavior is Leading**
  The manager thinks reopens are a "separate problem." They aren't. Reopen rate is a **quality assurance metric** for the resolution metric. You cannot have a valid "Resolution" metric without a "Quality" guardrail. If you measure speed without a quality brake, you aren't building a car; you're building a missile.

  ### 3. Principled Metric Design (How to fix it)
  There is a field of study around this (often discussed in *Measure What Matters* or by economists like Holmstrom & Milgrom). To design metrics that don't collapse, you need three things:

  **1. Composite Metrics (The "And" Rule)**
  Never incentivize a single number. Incentivize a formula.
  *   *Bad:* Bonus based on Tickets Closed.
  *   *Better:* Bonus based on (Tickets Closed) **×** (Quality Score).
  *   If the Quality Score (based on random audits or CSAT) drops below a threshold, the multiplier becomes zero. This forces agents to care about quality *to get credit for speed*.

  **2. Guardrail Metrics**
  Define a "failure condition" that voids the success condition.
  *   "You get the bonus for volume, **unless** your reopen rate exceeds 10%."
  *   This aligns with the RL concept of adding a penalty term to the reward function: `Reward = (Closes) - (Penalty * Reopens)`.

  **3. Measure Outcomes, Not Outputs**
  "Tickets Closed" is an **output** (activity). "Customer Issue Resolved" is an **outcome** (value).
  *   Instead of counting closes, measure **Time-to-Value** or **First-Contact Resolution (FCR)** combined with a 7-day "no contact" window. A ticket shouldn't count as "Resolved" for bonus purposes until it has been closed for 7 days without reopening.

  ### 4. What Your Friend Should Tell Her Manager
  Your friend needs to stop arguing about "fairness" or "customer feelings" and start arguing about **efficiency and risk**. Managers speak the language of cost and retention.

  **The Script:**
  > "I've analyzed the data from the new bonus structure. While ticket closures are up 40%, our reopen rate has doubled.
  >
  > I know it looks like two separate metrics, but economically, a reopened ticket costs us **double** the labor of a ticket solved correctly the first time because of context switching. We are currently paying bonuses to increase our operational costs.
  >
  > Furthermore, this behavior creates churn risk. If we optimize for 'closes' rather than 'resolutions,' we are training the team to push customers away rather than help them.
  >
  > **Proposal:** Let's keep the efficiency bonus, but attach a 'Quality Gate.' The bonus only pays out if the team's 7-day reopen rate stays under X%. This ensures we are paying for *actual* efficiency, not just activity. This protects the company from paying for work that has to be done twice."

  ### Summary
  The reason this happens everywhere is that **optimization always finds the path of least resistance.** If the path of least resistance is "fake the work," the system will produce fake work.

  Your friend's manager is suffering from **Metric Fixation**—believing the dashboard represents reality. It doesn't. The dashboard represents what was measured. Your friend's job is to show him that by ignoring the reopens, he isn't saving money; he's paying for the same problem twice.

  **The Principle:** Incentivize the **outcome** (fixed problem), not the **activity** (closed ticket), and always pair a quantity metric with a quality guardrail.
