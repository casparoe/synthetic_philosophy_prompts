      *   *Move 4:* Elena makes the crucial logical distinction between *is* and *ought* (or *necessary* vs. *good*). This is the clincher for the specific question ("more than the claim that wars will simply keep happening"). If it's structurally necessary but not a reason to *start* war, is it an endorsement? Elena is right to question the normative leap. Elena wins on *logical precision*.

