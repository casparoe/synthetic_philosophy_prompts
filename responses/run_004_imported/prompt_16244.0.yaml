answer: |-
  Good morning. Thank you for being here.

  I know why many of you are in this room. I also know why some of you are hesitant to be here.

  For the funders and colleagues joining us for the first time: there is history in this room. Last year, an open letter signed by many prominent scientists characterized Integrated Information Theory, or IIT, as "pseudoscience." For the IIT researchers here, that label felt like an excommunication before the data was fully in. For the signatories, it felt like a necessary defense of empirical rigor against a theory they viewed as untestable.

  It is tempting to open a workshop like this with a plea for civility. We could ask everyone to play nice, to remember we are all on the same team. But I think that undersells the moment. This isn't just a personality clash. It isn't even just a turf war over grant money or journal space.

  This is a disagreement about the rules of the game itself. Specifically, it is a disagreement about what counts as evidence for consciousness. And to understand that, we have to talk about one specific axiom of IIT that sits at the heart of this friction: the **Exclusion Postulate**.

  I want to explain this in a way that doesn't require a degree in mathematics, because it is crucial for those of you deciding where the future of this field is invested.

  In standard neuroscience, we tend to think of consciousness as something that might be layered. You might assume that if a brain is conscious, then perhaps large networks within it are conscious, and maybe even smaller clusters contribute their own tiny bits of experience. We look for correlates of consciousness across different scales.

  IIT says no.

  The Exclusion Postulate states that consciousness exists only at the specific scale where integrated information is maximized. Nothing more, nothing less. If a system has a "maximum" of integration, that is the locus of experience. Any subsystem within it is excluded from having its own consciousness. Any larger system containing it is also excluded.

  Think of it like a photograph. You can look at a photo as millions of individual pixels, or as a single landscape. IIT argues that consciousness isn't in the pixels, and it isn't in the album the photo is pasted into. It exists *only* at the resolution of the image itself. If you look one zoom-level higher or lower, the experience doesn't just get fuzzy—it ceases to exist.

  Now, consider the friction this creates.

  For the IIT proponents, this postulate is a feature, not a bug. It provides a precise definition of *where* to look. It tells you that if you are measuring the wrong scale, you aren't just measuring noise; you are measuring nothing.

  But for the critics in this room, this creates a profound evidentiary problem. If consciousness is excluded from all scales except the one precise maximum of integration, how do you measure it without already assuming the theory is true? If I can't find the signal at the scale you predict, you can say I was looking at an "excluded" level.

  To the critics, this looks like moving the goalposts. To the proponents, it looks like the critics are refusing to accept the definition of the object they are studying.

  This is why I asked you all here. This is not a debate about who is smarter or who is more scientific. It is a methodological impasse.

  One side of this room believes that a theory of consciousness must be subservient to current methods of measurement. If we can't measure it with our current tools, the theory is suspect.

  The other side believes that our methods of measurement must be subservient to the theory of what consciousness *is*. If the theory says the signal is at a specific scale of integration, then our tools are inadequate, not the theory.

  For the funders in the room, this distinction is vital. You are not just funding experiments; you are funding definitions. If you fund IIT research, you are funding the search for a specific mathematical structure in the brain. If you fund the critics, you are funding the demand for behavioral and neural correlates that fit existing paradigms.

  Neither approach is "pseudoscience." One is a top-down axiomatic approach; the other is a bottom-up empirical approach. History shows us that science often stalls when these two languages stop translating.

  So, my request for the next two days is not that you agree. It is that you recognize the category of your disagreement.

  When you hear an IIT researcher speak about the Exclusion Postulate, do not hear an excuse for lack of data. Hear a claim about the fundamental ontology of experience.

  When you hear a critic demand falsifiable predictions, do not hear a refusal to think deeply. Hear a demand for public, shareable verification.

  We are not here to decide who gets the label of "scientist." We are here to decide if these two ways of seeing the mind can ever speak the same language. If they can, we might find a way to test the untestable. If they cannot, we need to know that, too, so we don't spend the next decade talking past one another.

  The hard problem of consciousness is difficult enough without us making it harder. Let's get to work.

  Thank you.
