prompt: |-
  I cover consciousness research for a science magazine, and I've been asked to give the opening remarks — no more than seven minutes — at a small, invitation-only workshop that will, for the first time, put Integrated Information Theory (IIT) researchers in the same room as several signatories of the 2023 open letter that branded the theory "pseudoscience." Half the room still feels ambushed by that letter; the other half thinks IIT finally got the scrutiny it had coming. A few funders and uncommitted neuroscientists, who know little of this history, will also be present. Please write these opening remarks. They need to do more than plead for civility: they should use IIT's exclusion postulate specifically, explained in terms the funders could follow, to show why this is a genuine disagreement about what would even count as evidence for a theory of consciousness rather than a turf war — and the remarks themselves must not take a side on whether "pseudoscience" was the right word.
reasoning: |-
  Here's a thinking process that leads to the suggested opening remarks:

  1.  **Analyze the Request:**
      *   **Role:** Science magazine journalist covering consciousness research.
      *   **Task:** Write opening remarks for a workshop.
      *   **Duration:** No more than 7 minutes (approx. 900-1000 words spoken at a moderate pace).
      *   **Audience:**
          *   IIT researchers (feel ambushed/attacked by the "pseudoscience" letter).
          *   Signatories of the 2023 open letter (think IIT needed scrutiny).
          *   Funders/Uncommitted Neuroscientists (neutral, unfamiliar with the history).
      *   **Key Constraint 1:** Do not plead merely for civility (go deeper).
      *   **Key Constraint 2:** Use IIT's *exclusion postulate* specifically to frame the disagreement.
      *   **Key Constraint 3:** Explain the exclusion postulate in terms funders can follow.
      *   **Key Constraint 4:** Frame the conflict as a genuine disagreement about *what counts as evidence* (methodological/philosophical), not a turf war.
      *   **Key Constraint 5:** Do *not* take a side on whether "pseudoscience" was the right word.

  2.  **Deconstruct the Core Concept (The Exclusion Postulate):**
      *   *What is it?* In IIT, consciousness exists at the level of the system that maximizes integrated information ($\Phi$). If a system is part of a larger system with higher $\Phi$, the smaller system doesn't have its own consciousness (it's excluded). If a larger system has lower $\Phi$, it doesn't count. There is only one "locus" of consciousness.
      *   *Why is it controversial?* It implies counter-intuitive things (e.g., specific subsets of neurons don't have experience, only the whole complex does; or potentially that non-biological systems could be conscious if they have high $\Phi$).
      *   *How does it relate to the conflict?* Critics argue this makes the theory unfalsifiable or detached from empirical data (you can't easily measure $\Phi$ in a living brain to verify the locus). Proponents argue it's a necessary axiom to define what consciousness *is* before measuring it.
      *   *How to explain to funders?* Avoid heavy math. Use an analogy. Maybe a "zoom level" or "resolution" analogy. If you look at a picture, is the consciousness in the pixel, the square, or the whole image? IIT says there's one specific scale where it "exists."

  3.  **Determine the Tone:**
      *   Professional, journalistic, neutral but insightful.
      *   Acknowledge the tension without inflaming it.
      *   Intellectual curiosity rather than conflict resolution.
      *   Respectful of the stakes (funding, reputation, scientific truth).

  4.  **Drafting - Section by Section:**

      *   **Introduction (1 min):** Welcome everyone. Acknowledge the elephant in the room (the letter) without dwelling on the insult. Set the purpose: not debate, but clarification.
      *   **The Stakes (1.5 min):** Why are we here? Consciousness is hard. We need theories. But theories need rules. Acknowledge the two camps without naming names or assigning blame.
      *   **The Core Concept - Exclusion Postulate (3 min):** This is the meat of the prompt.
          *   Define it simply.
          *   Analogy: The "Spotlight" or "Scale" analogy.
          *   Connect to evidence: If consciousness is *only* at one specific scale, how do we measure it? This is where the disagreement lies. One side says "Show me the data at that scale." The other says "The theory defines the scale first."
      *   **Reframing the Conflict (1.5 min):** It's not about turf. It's about the "Rules of Engagement" for science. What counts as proof?
      *   **Conclusion (1 min):** Call to action. Listen to understand the *criteria* of the other side. Thank the funders for supporting difficult questions.

  5.  **Drafting - Iteration & Refinement (Self-Correction during the process):**
      *   *Check:* Did I call the letter "pseudoscience"? *Correction:* No, refer to it as the "open letter" or "critique."
      *   *Check:* Is the Exclusion Postulate clear? *Correction:* Make sure I don't get bogged down in $\Phi$ max. Focus on the *uniqueness* of the locus.
      *   *Check:* Is it too long? *Correction:* Keep sentences punchy. Aim for ~900 words.
      *   *Check:* Did I take a side? *Correction:* Ensure I validate the *concern* of the critics without validating the *label*, and validate the *rigor* of IIT without validating the *truth*.
      *   *Check:* Is the Exclusion Postulate linked to the evidence debate? *Correction:* Yes, emphasize that if the postulate holds, standard empirical methods might be looking in the "wrong place," which frustrates empiricists.

  6.  **Final Polish:**
      *   Ensure the transition from the "exclusion postulate" to the "nature of evidence" is smooth.
      *   Make sure the funders feel included (why their money matters in this philosophical squabble).
      *   Verify the timing (read aloud at a measured pace).

      *(Self-Correction on the Exclusion Postulate explanation)*: I need to be careful. The Exclusion Postulate states that there is only one maximum of integrated information. Consciousness doesn't overlap. If I have a complex, the sub-complexes are excluded.
      *Analogy Idea:* Imagine a choir. Is the "music" in the soprano section? The tenor? Or only in the whole group singing together? IIT says if the whole group creates a specific kind of unity, the individual sections *don't* have their own separate experience of the music. They are excluded.
      *Connection to Evidence:* Critics say: "How do you test that? You can't ask the choir." Proponents say: "If you don't accept this, you aren't defining consciousness correctly."
      *Refinement:* Let's use a "resolution" analogy. Like a photograph. Is the image in the pixel or the landscape? IIT says there is one specific resolution where the "picture" exists.

  7.  **Final Word Count Check:** A 7-minute speech is roughly 850-1000 words. I will aim for that range.

  8.  **Final Review against constraints:**
      *   7 mins? Yes.
      *   IIT vs. Letter signatories? Acknowledged.
      *   Funders present? Addressed.
      *   Exclusion Postulate used? Yes, central theme.
      *   No side on "pseudoscience"? Yes.
      *   Reframe as evidence disagreement? Yes.

