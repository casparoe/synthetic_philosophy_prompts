answer: |-
  # The Logic of the Leap: Adjudicating the Role of Updatelessness in Commitment Races

  Commitment races are among the most perilous dynamics in game theory. They occur when agents compete to restrict their own future options first, thereby forcing opponents to yield. The classic example is a game of Chicken: the driver who credibly throws their steering wheel out the window first wins, provided the opponent sees it and values survival over pride.

  The dispute between you and your friend centers on the relationship between these races and Updateless Decision Theory (UDT). Your friend argues that updatelessness is the *cause* of commitment races, positing that the willingness to bind one's future self irrevocably is what makes early commitment rational. You argue that updatelessness merely changes the *timing and shape* of the race, as sophisticated updateful agents face the same structural pressures to commit early.

  To adjudicate this, we must distinguish between the **incentive** to commit and the **capacity** to commit. While your friend correctly identifies that UDT perfects the capacity for commitment, your position is ultimately more robust: the strategic pressure to race is a feature of the game structure, not the decision theory. Updatelessness does not create the race; it intensifies it and shifts it from the temporal domain to the logical domain.

  ### The Friend's Case: Updatelessness as the Engine

  Your friend's argument rests on a compelling observation: naive updateful agents (such as those following standard Causal Decision Theory) struggle to make credible commitments. A naive agent calculates the optimal move at the moment of action. If threatening to punish an opponent is costly at the moment of execution, a naive updateful agent will not follow through. Knowing this, opponents ignore the threat.

  UDT solves this by choosing a policy *ex-ante* (before observing specific details of the situation) that maximizes expected utility across all possible worlds. A UDT agent effectively binds its future self at the moment of its creation or policy selection. It will carry out a threat even if it is locally costly, because deviating from the policy would have reduced expected utility at the time the policy was chosen.

  From this perspective, your friend argues that UDT *drives* commitment races. If agents are updateless, they are inherently designed to ignore information that would tempt them to back down. When two such agents meet, they are both running rigid policies selected to maximize leverage. If both select "hardline" policies, they crash. The friend suggests that without this updateless architecture, agents would remain flexible, updating on new information and negotiating their way out of the crash. Therefore, the rigidity of updatelessness creates the conditions for the race.

  ### The User's Case: Structural Incentives and Sophisticated Updatefulness

  Your counter-argument relies on the distinction between decision theory and game structure. Commitment races arise whenever there is a first-mover advantage in restricting options. This is a feature of the payoff matrix, not the agent's internal algorithm.

  Even a "sophisticated" updateful agent—one capable of using external precommitment devices like contracts, reputation mechanisms, or burning bridges—faces the pressure to commit early. If I know you are rational and capable of signing a binding contract to play hardball, I am incentivized to sign that contract *before* you do. If I wait, I risk you committing first and forcing me to yield.

  In this view, updatelessness is simply an internalization of precommitment technology. It removes the need for external devices (like burning a bridge), but it does not create the underlying incentive. The incentive exists because the game rewards the agent who can convincingly signal that they have no choice. Whether that signal is sent via a UDT algorithm or a signed legal contract, the strategic pressure to signal first remains.

  ### Adjudication: Cause vs. Intensifier

  To reach a verdict, we must ask: If we remove updatelessness but keep sophisticated updateful agents (capable of precommitment), do commitment races disappear?

  The answer is no. History is replete with commitment races between humans, who are notoriously updateful. Nations mobilize armies to signal resolve; strikers lock themselves to factory gates; negotiators set public deadlines. These are updateful agents engaging in commitment races. They do so because the strategic landscape rewards the appearance of inflexibility.

  Therefore, your friend is mistaken in identifying updatelessness as the *primary cause*. The cause is the strategic incentive to manipulate opponent expectations through the restriction of one's own agency.

  However, your friend is not entirely wrong. Updatelessness acts as a potent **intensifier** and **transformer** of the dynamic.

  1.  **Credibility:** Updateful agents often suffer from a credibility gap. Can I really trust that you will burn the bridge? A UDT agent's commitment is mathematically certain (assuming the code is visible). This certainty raises the stakes. In a world of UDT agents, bluffing is impossible. You either have the hardline policy or you don't. This removes the "fog of war" that sometimes allows updateful agents to de-escalate.
  2.  **The Shift from Time to Logic:** This is the crux of your argument about "timing and shape." For updateful agents, the race is temporal: *Who commits first in time?* For UDT agents, the race is logical: *Whose policy was selected first in the order of logical dependency?* Since UDT agents select policies "at the beginning" (conceptually), two UDT agents interacting are effectively committing simultaneously at $t=0$. This transforms the temporal race into a "clash of commitments." If both agents pre-select hardline policies, they cannot update to avoid disaster.

  Thus, updatelessness does not cause the race; it removes the escape hatches. An updateful agent might commit early but retain a sliver of flexibility to back down if the cost becomes too high (renegotiating the contract, damaging reputation slightly). A UDT agent cannot. By making commitments perfectly credible and irreversible, UDT makes the consequences of the race more severe, but it does not generate the incentive to race.

  ### The Verdict

  You win the dispute, but with a caveat.

  **Verdict:** Updatelessness is **not the primary cause** of commitment races; it is a **modifier of dynamics** that would exist regardless.

  The primary cause of commitment races is the game-theoretic advantage of being the first to credibly restrict one's own options. This incentive exists for any agent that possesses *any* mechanism for precommitment, whether internal (UDT) or external (contracts/reputation). Sophisticated updateful agents face the exact same pressure to commit early that you described.

  However, your friend's intuition captures a vital risk: Updatelessness removes the ability to *react* to the race once it has begun. By collapsing the decision timeline to the moment of policy selection, UDT turns a temporal competition into a logical deadlock. It makes the race more dangerous and the commitments more rigid, but it does not light the fuse. The fuse is lit by the strategic structure of the interaction itself.

  In summary, updatelessness does not create the fire; it simply removes the sprinkler system. The pressure to burn the bridge comes from the enemy across the river, not from the match in your hand.
