answer: |-
  First, please do not feel embarrassed. You have not stumbled upon a defect in your committee's competence; you have empirically rediscovered the foundational problems of **Social Choice Theory**. As a political scientist, you have effectively run a natural experiment that replicates the exact conditions that led to some of the most famous theorems in the discipline.

  The short answer to your question is: **No, there is no perfect procedure.** There is no mathematical way to aggregate individual rankings into a collective decision that satisfies all the intuitive criteria of fairness simultaneously.

  The longer answer provides the vocabulary you are looking for, explains why your experience was inevitable, and offers practical advice for next year.

  ### 1. Naming the Phenomena

  You encountered three distinct theoretical failures, each corresponding to a major concept in political science.

  **A. The Plurality Failure (The Condorcet Loser)**
  When D won on first-place votes despite being ranked last by a majority, D was what formal theorists call a **Condorcet Loser**. A Condorcet Loser is a candidate who would lose in a head-to-head matchup against every other candidate. Plurality voting (counting only first-place votes) is notoriously bad at identifying Condorcet Losers because it ignores all information below the first rank. It rewards polarization (being the top choice of a passionate minority) over broad acceptability.

  **B. The Cycle (The Condorcet Paradox)**
  When you moved to head-to-head comparisons among A, B, and C, you found that A beat B, B beat C, and C beat A. This is the **Condorcet Paradox** (or voting cycle). It demonstrates that collective preferences are not necessarily **transitive**, even if every individual voter's preferences are transitive.
  *   Individual level: If I prefer A > B and B > C, I must prefer A > C.
  *   Collective level: The "majority" can prefer A > B, B > C, and C > A simultaneously.
  This means there is no stable "will of the majority" to discover. The outcome depends entirely on the order in which you hold the votes (e.g., if you vote A vs. B first, then the winner vs. C, C will win. If you vote B vs. C first, then the winner vs. A, A will win). This is known as **path dependence**.

  **C. The Points System Failure (Violation of IIA)**
  When you used the points system (known as the **Borda Count**), you got a clear winner. However, when you removed D, the ranking between A and B flipped. This is a violation of the **Independence of Irrelevant Alternatives (IIA)**.
  IIA states that the social preference between two options (A and B) should depend *only* on how individuals rank A and B, not on whether a third option (D) is present. The Borda Count violates this because it assigns value based on position relative to the *entire* set. By removing D, you changed the "scale" of the measurement. For example, a voter who ranked A > D > B gives A 3 points and B 1 point. If D is removed, that same voter might rank A > B, giving A 2 points and B 1 point. The *relative* point gap between A and B shrinks, potentially changing the winner.

  ### 2. The Impossibility Theorem

  You asked if there is a principled way to design a process that avoids this instability. In 1951, Kenneth Arrow (a Nobel laureate in economics) proved that there is not.

  **Arrow's Impossibility Theorem** demonstrates that no rank-order voting system can satisfy a set of seemingly minimal fairness criteria simultaneously. Specifically, no system can guarantee all of the following:
  1.  **Unrestricted Domain:** It works for any possible set of individual preferences.
  2.  **Pareto Efficiency:** If everyone prefers A to B, the group prefers A to B.
  3.  **Independence of Irrelevant Alternatives (IIA):** Removing a losing candidate doesn't change the winner among the remaining candidates.
  4.  **Non-Dictatorship:** No single voter determines the outcome.

  Your committee ran into the wall of Arrow's Theorem. You tried a system that satisfied IIA poorly (Borda) to solve a system that satisfied Majority Rule poorly (Plurality/Condorcet). The instability you felt was not a bug in your bookkeeping; it was a structural feature of aggregation.

  ### 3. Practical Recommendations for Your Committee

  Since mathematical perfection is impossible, you must choose which flaw you are most willing to tolerate based on the *goals* of the prize. Is the goal to find the candidate with the most passionate support (Plurality)? The most broad consensus (Borda)? Or the one who can beat anyone in a debate (Condorcet)?

  For a small departmental committee (N=9), I recommend the following:

  **1. Prioritize Deliberation over Aggregation**
  With only nine voters, voting is often a substitute for discussion, but it shouldn't be. The "cycle" among A, B, and C suggests the committee is genuinely divided on different criteria (e.g., some value research, others value teaching).
  *   **Recommendation:** Use the ballots as a starting point for discussion, not a final tally. If a cycle emerges, the committee should discuss *why* the preferences are distributed that way. Often, talking reveals that one candidate is actually broadly acceptable, even if not first-choice.

  **2. Pre-commit to a Tie-Breaking Rule**
  The grumbling about your tie-break occurred because the rule was improvised *ex post*.
  *   **Recommendation:** Adopt a written charter. "In the event of a Condorcet cycle, we will use the Borda Count." Or, "In the event of a cycle, the Chair decides." It matters less *which* rule you pick than that you agree to it *before* seeing the ballots. This legitimizes the outcome procedurally, even if it isn't mathematically "perfect."

  **3. Consider Ranked Choice (Instant Runoff)**
  If you want to move away from simple plurality without using Borda (which violates IIA), you might consider **Instant Runoff Voting (IRV)**.
  *   **How it works:** Count first-place votes. If no one has a majority, eliminate the last-place candidate and redistribute their votes to the second choice. Repeat.
  *   **Pros:** It ensures the winner has majority support and avoids the "Condorcet Loser" problem you saw with D.
  *   **Cons:** It can still produce cycles (though less visibly) and violates another criterion called *monotonicity* (sometimes, ranking a candidate higher can hurt them). However, for a small prize committee, it is often more intuitive than Borda.

  **4. Accept "Cloning" Risks with Borda**
  If you prefer the Borda Count (because it rewards consensus), you must accept the IIA violation you discovered.
  *   **Risk:** This makes the system vulnerable to strategic nomination. If faction A knows they will lose to candidate B, they can nominate a "clone" candidate D who is similar to A. D will siphon points from B, allowing A to win.
  *   **Mitigation:** Ensure the nomination process is rigorous so that "irrelevant" candidates like D (who was ranked last by everyone) do not make it onto the ballot in the first place.

  ### Summary

  You have encountered the **Condorcet Paradox** and a violation of **Independence of Irrelevant Alternatives**, bounded by **Arrow's Impossibility Theorem**.

  There is no procedure that guarantees a stable, fair winner in all cases. The instability is inherent to the task of aggregating preferences. For next year, the most defensible approach is to **adopt a specific voting rule in your committee charter *before* nominations open** (e.g., "We use Borda, understanding its limitations," or "We use IRV") and to treat the vote as a prompt for deliberation rather than a mechanical decider.

  You should not feel embarrassed; you have just done some excellent empirical political science. You might even consider citing this experience if you ever teach a course on research methods or political institutions.
