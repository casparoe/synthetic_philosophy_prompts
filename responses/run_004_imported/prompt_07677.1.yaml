answer: |-
  Your skepticism is well-founded. The forum poster identified the genealogical link correctly—ECL is indeed the intellectual descendant of Hofstadter's superrationality—but calling them "basically the same" obscures critical structural differences. As a physicist, you might appreciate the distinction as one between a **symmetry argument** (superrationality) and a **statistical correlation argument** (ECL).

  Hofstadter's superrationality relies on logical identity; ECL relies on probabilistic correlation across a prior distribution of agents. When you move from the former to the latter, you trade logical necessity for Bayesian wagering.

  Here is a breakdown of where the logic holds, where it fractures, and what extra machinery ECL requires to function.

  ### 1. The Common Core: Non-Causal Correlation
  Both arguments rest on the rejection of **Causal Decision Theory (CDT)** in favor of **Evidential Decision Theory (EDT)** or **Logical Decision Theory (LDT)**.

  *   **CDT:** My action cannot causally influence a causally disconnected agent. Therefore, I should defect.
  *   **EDT/LDT:** My action is *evidence* (or logically linked) to the action of the other agent. Therefore, I should cooperate to "acausalize" the benefit.

  In both cases, the agent treats their own decision algorithm as a sample that updates the probability of other instances of that algorithm (or similar ones) outputting a specific action. This is the shared DNA.

  ### 2. Divergence 1: Identity vs. Correlation
  This is the most significant break.

  **Superrationality (Hofstadter):**
  *   **Assumption:** The agents are **logically identical**. They are running the same source code on different hardware.
  *   **Mechanism:** If I am a deterministic reasoner, and you are identical to me, and we face the same problem, we *must* output the same answer. $P(C_{you} | C_{me}) = 1$.
  *   **Robustness:** High. If the premise of identity holds, the cooperation is logically necessitated. You cannot "choose" to defect while expecting the other to cooperate, because that implies a contradiction in the source code.

  **ECL:**
  *   **Assumption:** The agents are **correlated but distinct**. They are not running the same code; they are running *different* codes that are sufficiently similar in structure or origin.
  *   **Mechanism:** My choosing to cooperate increases the *probability* that similar agents elsewhere cooperate, but not to certainty. $P(C_{other} | C_{me}) > P(C_{other})$.
  *   **Fragility:** This introduces the **Reference Class Problem**. How do we define "similar enough"? Does a human reasoning about ECL correlate with an AI? With an alien biology? With a simulation?
  *   **The "Shakier Machinery":** ECL requires a prior over the distribution of reasoners in the multiverse. You must believe that "cooperative reasoners" are common enough, and that their correlation with you is strong enough, to outweigh the local cost of cooperation. Hofstadter never needed a prior; he needed only a mirror.

  ### 3. Divergence 2: Symmetry of Values
  **Superrationality:**
  *   Typically assumes a symmetric Prisoner's Dilemma. We both want the same payoff matrix. We cooperate to maximize *our shared utility*.

  **ECL:**
  *   Explicitly assumes **asymmetric values**. The whole point of ECL is "moral trade." I care about value $A$ (e.g., hedonic utilitarianism); the distant agent cares about value $B$ (e.g., paperclip maximization or a different moral framework).
  *   **The Trade:** I cooperate on $A$ (sacrificing local $A$-value) as evidence that they will cooperate on $B$ (sacrificing local $B$-value). Since the universe is large, the gain in $B$ elsewhere outweighs my loss in $A$, and vice versa.
  *   **The Risk:** This requires a **double correlation**. Not only must my *action* correlate with theirs, but their *values* must be such that they are willing to trade. If the distant agents are "value fundamentalists" (who only care about their own values regardless of correlation), the trade fails. Hofstadter's setup didn't need to worry about the other player wanting something different.

  ### 4. Divergence 3: The Decision Theoretic Basis
  Hofstadter's argument was informal. ECL is formalized within specific decision theories, which exposes new vulnerabilities.

  *   **EDT (Evidential):** ECL is most naturally argued via EDT. However, EDT is susceptible to "spurious correlations." (e.g., "I see that people who wear red shirts cooperate more, so I'll wear a red shirt to make others cooperate.") ECL proponents must argue that the correlation is *logical* or *structural*, not merely observational.
  *   **FDT/LDT (Functional/Logical):** Modern rationalists often prefer Functional Decision Theory. FDT handles superrationality well (logical identity). However, applying FDT to ECL requires asserting that your decision algorithm is *logically subjunctively dependent* on the algorithms of causally disconnected agents.
  *   **The Gap:** Justifying logical dependence across causally disconnected regions of an infinite universe is harder than justifying it between two copies of the same program in a lab. It requires a assumption about the **uniformity of mathematical truth instantiation** across the multiverse. If the "physics" of the other region implements logic differently, or if their initial conditions drive their reasoning down a divergent path, the logical link breaks.

  ### 5. Does the Cooperative Conclusion Survive?
  When you drop the clean "two identical minds" setup, the cooperative conclusion becomes **contingent on priors** rather than **derivable from logic**.

  Here is where the load-bearing parts get lost:

  1.  **The "Free Rider" on Correlation:** In Hofstadter's setup, you can't free-ride because you *are* the other player. In ECL, you can theoretically reason: "I will defect, because my defection is only weak evidence against their cooperation, but guarantees my local gain." If the correlation isn't near-perfect, CDT-style defection starts to look rational again.
  2.  **The Dilution Problem:** In a large world, there may be vastly more agents who *do not* reason via ECL. If 99% of agents are CDT-defectors, your evidential influence on the 1% of ECL-reasoners might be swamped by the noise of the defectors. The expected value calculation flips.
  3.  **Acausal Extortion:** If you open the door to acausal influence, you also open it to acausal threats. ("Cooperate with me or I will simulate and torture you.") Superrationality avoids this via symmetry; ECL invites it via asymmetry.

  ### Summary Comparison

  | Feature | Hofstadter's Superrationality | Evidential Cooperation (ECL) |
  | :--- | :--- | :--- |
  | **Relation** | Logical Identity (Same Algorithm) | Statistical/Logical Correlation (Similar Algorithms) |
  | **Probability** | $P(C_{other} \| C_{me}) = 1$ | $P(C_{other} \| C_{me}) > P(C_{other})$ |
  | **Values** | Symmetric (Same Goal) | Asymmetric (Moral Trade) |
  | **Decision Theory** | Implicit LDT / EDT | Explicit EDT / FDT |
  | **Key Assumption** | We are identical reasoners. | Reasoners are correlated across the multiverse. |
  | **Failure Mode** | One agent is irrational/broken. | Priors on agent distribution are wrong; correlation is weak. |
  | **Status** | Logical Necessity (given premises) | Bayesian Wager |

  ### Verdict
  The forum poster was right that ECL is **superrationality scaled up**, but wrong that it is **the same argument**.

  Hofstadter's argument is a **proof**: *If* we are identical, cooperation is the only consistent output.
  ECL is a **bet**: *If* the universe is structured such that reasoners are sufficiently correlated, and *if* there are enough of them, and *if* they value trade, then cooperation pays.

  For a physicist, the distinction is akin to the difference between **conservation laws** (Superrationality: symmetry implies a hard constraint) and **statistical mechanics** (ECL: we assume the system is ergodic and the ensemble average favors cooperation). The latter works most of the time in large systems, but it relies on assumptions about the ensemble (the priors on agent types) that are currently untestable and highly sensitive to model specification.

  So, your intuition is correct: the "tidy equivalence" glosses over the fact that ECL replaces a logical lock with a probabilistic hinge. That hinge is where the skepticism should live.
