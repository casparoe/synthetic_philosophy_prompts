          2.  **Symmetry vs. Asymmetry:** Superrationality usually assumes symmetric payoffs and identical goals. ECL explicitly assumes *different* values (that's why we trade). I maximize $V_A$, they maximize $V_B$. This introduces the "moral trade" complexity.
