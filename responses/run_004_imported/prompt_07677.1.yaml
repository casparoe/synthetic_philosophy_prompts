      *   **Evidential Cooperation in Large Worlds (ECL):** Proposed by Oesterheld, Conitzer, etc., within the EA/rationalist sphere. Context: Infinite/large universe. Key assumption: Agents are *correlated* but not necessarily identical. Logic: My action is *evidence* of their action. Uses Evidential Decision Theory (EDT).
      *   **Key Distinction:** Identity vs. Correlation. Symmetry vs. Asymmetry. Local vs. Global.
      *   **Structure of the Answer:**
