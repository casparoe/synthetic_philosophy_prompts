answer: |-
  Your intuition is absolutely correct. This is a famous probability puzzle known as the **Two Envelopes Problem**, and your friend’s reasoning contains a classic mathematical fallacy.

  ### The Flaw in the Friend’s Reasoning
  Your friend calculated the expected value of the other envelope as:
  $$E = 0.5(\$40) + 0.5(\$160) = \$100$$

  The logic seems sound: since the other envelope is equally likely to be half or double your amount, the average is higher. However, this calculation relies on a hidden, unjustified assumption: **it assumes that the probability of the pair being $(\$40, \$80)$ is exactly the same as the probability of the pair being $(\$80, \$160)$.**

  In reality, we have no information about how the charity chooses these amounts. 

  ### The "Bounded Reality" Test
  To see why this assumption fails, imagine the charity has a maximum prize limit of $\$100$. 
  *   If you open your envelope and find $\$80$, the other envelope **cannot** contain $\$160$.
  *   In this case, the other envelope **must** contain $\$40$. 
  *   If you swap, you lose $\$40$ with 100% certainty.

  Because your friend's logic ("always swap") fails in this bounded scenario, the logic is fundamentally flawed. Without knowing the distribution of money the charity uses, you cannot assume a 50/50 split between the "half" and "double" scenarios.

  ### The Variable vs. Constant Error
  Mathematically, your friend is treating the amount in your hand ($A = \$80$) as a **fixed constant** while simultaneously treating it as a **random variable**.

  Let’s look at the potential gain or loss in absolute terms:
  1.  **If you have the smaller amount ($x$):** You gain $x$ by swapping.
  2.  **If you have the larger amount ($2x$):** You lose $x$ by swapping.

  In both cases, the absolute amount you stand to win or lose is the same ($x$). Since you had a 50/50 chance of picking the smaller or larger envelope initially, the expected gain is zero. The "paradox" only appears when you treat the observed value ($\$80$) as the baseline for both scenarios, which ignores the fact that $\$80$ represents different underlying values ($x$ vs. $2x$) in each case.

  ### Conclusion
  Your friend's reasoning is wrong because it ignores the **prior probability distribution**. Unless you know how the charity generates its prize amounts, you cannot calculate a positive expected value for swapping. Your intuition regarding the absurdity of "infinite swapping" is the correct one: if the logic were true, you would swap forever, which is impossible.
