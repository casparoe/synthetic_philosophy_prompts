      *   *Realism:* Representations are real, mind-independent (or model-independent) structures that causally explain behavior.
      *   *Instrumentalism/Deflationism:* Representations are useful fictions, projections, or mere descriptions of input-output mappings without ontological weight.

      *   **1. Universality:** If independent models converge on the same circuits, it suggests these structures aren't arbitrary artifacts of a specific training run but reflect something robust about the task or data. *Strong support for realism.*
      *   **2. Linear Representation Hypothesis:** If concepts map to linear directions, it suggests a structured, readable geometry. However, linearity could be a convenient approximation rather than ontological truth. *Moderate support.*
      *   **3. Superposition/Polysemanticity:** This complicates the picture. If neurons aren't 1-to-1 with features, it challenges simple realism. However, realists argue this is just a compression mechanism for *real* features. Instrumentalists argue it shows features aren't truly distinct entities in the network. *Mixed/Weak support for realism (often used by skeptics).*
      *   **4. Causal Validation:** If manipulating a "feature" changes behavior predictably, it shows the feature isn't just correlational but causally efficacious. This is crucial for mechanistic explanation. *Very strong support for realism.*
      *   **5. Grandmother-cell analogy:** This refers to the local vs. distributed debate. Finding "grandmother cells" (localist) would support simple realism, but most evidence points to distributed coding. The analogy itself is neutral or slightly negative if used to show how naive localist realism fails. *Weak/Neutral.*
      *   **6. Multiple Realizability:** Classically used by Putnam/Fodor to support functionalism/realism about mental states despite physical differences. However, in ML interpretability, if weights are vastly different but behavior is same, it makes finding *the* representation harder. Instrumentalists use this to say the internal structure doesn't matter. Realists say the functional role matters. In the context of *mechanistic* interpretability (which cares about weights/circuits), high multiple realizability undermines the claim that specific circuits are real. *Counts against specific mechanistic realism.*
      *   **7. Interpretability Illusions:** If features look real but break on out-of-distribution data, it suggests they are artifacts of the probe/dataset, not real properties of the model. *Strongly counts against realism.*
