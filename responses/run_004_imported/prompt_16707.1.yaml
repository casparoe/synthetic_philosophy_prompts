answer: |-
  **Setting:** *A dimly lit university laboratory, late evening. The hum of ventilation is the only sound. In the corner sits a heavy lead pig, its lid slightly ajar. On the bench between them is a Geiger-Müller counter and a printout of a decay curve. Two figures stand over the equipment.*

  **Characters:**
  *   **ARIS (The Frequentist):** A statistician turned physicist. Wears a rumpled blazer. Believes probability is a property of collectives, not individuals.
  *   **ELENA (The Propensity Theorist):** A philosopher of physics. Sharp-eyed, intense. Believes probability is a physical disposition inherent in single cases.

  ***

  **ARIS:** (Tapping the Geiger counter) Thirty-five years you spent in rooms like this, and tell me: when you told a graduate student that *this* specific nucleus had a fifty percent chance of decaying in the next hour, did you really believe the number lived inside that little speck of Cobalt?

  **ELENA:** I believed the physics lived there, Aris. The instability. The tension in the strong force. The propensity is as real as the mass or the charge. It's a disposition to manifest a specific outcome.

  **ARIS:** A disposition to do what? To decay? But it only decays once. If it decays, the propensity was 100%. If it doesn't, the propensity was 0%. The "50%" is a ghost. It's a shorthand for what would happen if I had a trillion of these things lined up. It's a fact about the ensemble, not the individual.

  **ELENA:** That's the old evasion. If the probability is only in the ensemble, then *this* nucleus—the one sitting in the detector right now—has no probability of decaying. It just has a future. But we use that number to make decisions *now*. We shield the lab *now*. We calculate risk *now*. If the probability isn't a property of the single case, your safety protocols are based on a fiction.

  **ARIS:** They're based on the best empirical guide we have: the long-run frequency. I look at the reference class. All Cobalt-60 nuclei in this energy state, in this magnetic environment. I count how many decay in an hour. That ratio is the probability. It's solid. It's measurable.

  **ELENA:** Ah, the reference class. The frequentist's Achilles' heel. Which class, Aris? All Cobalt-60 nuclei in the universe? Or just the ones in this lab? Or just the ones measured by this specific detector, at this temperature, under this gravitational potential? If I change the reference class, I change the frequency. So which frequency is the "true" probability for *this* nucleus?

  **ARIS:** (Shifts weight) We choose the class based on relevant physical conditions. We hold constant the variables that causally matter.

  **ELENA:** But to know which variables causally matter, you already need to know the probabilities. You're circular. You need the probability to define the class, but you need the class to define the probability. For *this* specific nucleus, sitting here, unique in its spacetime coordinates, your theory leaves it probability-less until it joins a crowd. But it never joins a crowd. It sits there. It decays or it doesn't.

  **ARIS:** It sits there as a member of a kind. That's all science ever does. We trade in kinds. You want to say there's a metaphysical glue inside this atom, a "propensity," that dictates the 50%. But tell me, Elena, how does this propensity obey the calculus of probability? Specifically, Bayes' Theorem.

  **ELENA:** Bayes is a tool for inference. Propensity is a tool for ontology. They operate at different levels.

  **ARIS:** Do they? Let's say $A$ is the nucleus being in a specific quantum state, and $B$ is the detector clicking. Your propensity theory says the physical setup generates a propensity for $B$ given $A$. $P(B|A)$. That makes sense; the state causes the click. But the probability calculus also gives us $P(A|B)$. If the detector clicks, there is a high probability the nucleus was in state $A$.

  **ELENA:** Of course. That's inverse inference.

  **ARIS:** Is it a propensity? If propensities are physical, causal dispositions, then $P(A|B)$ implies the detector clicking has a physical disposition to cause the nucleus to have been in state $A$. That's backward causation. The effect is dictating the propensity of the cause. Humphreys nailed this shut. Propensities are directional; time flows one way. But probabilities flow both ways. If you identify probability with propensity, you break the math. If you keep the math, you admit probability isn't just propensity.

  **ELENA:** (Leans against the bench) You're conflating the *measure* of the disposition with the disposition itself. The symmetry in Bayes' theorem is epistemic—it's about how *we* update our beliefs given evidence. The asymmetry in propensity is ontological—it's about how the world *produces* events.

  **ARIS:** Then you've surrendered the objectivity you claimed! If the inverse probability is just about "our beliefs," then probability isn't fully "out there" in the nucleus. It's partly in the head of the observer. And if it's in the head, I'm right: it's about our expectations based on frequencies, not a physical force inside the atom.

  **ELENA:** No. The *evidence* is relational, the *propensity* is not. Look, Aris. Imagine a loaded die. It has a weight inside. That weight gives it a propensity to land on six. That exists even if I never roll it. Even if I destroy the die after one roll. Your frequentism says if I only roll it once, the "bias" is meaningless. That's absurd. The physics is in the die, not in the sequence of rolls.

  **ARIS:** But I can't *measure* the bias without the rolls. I can't verify your claim without my reference class. If you tell me this specific nucleus has a 50% propensity, and it doesn't decay, how do I prove you wrong? I can't. It's unfalsifiable metaphysics.

  **ELENA:** And if you tell me it has a 50% frequency, but it's the only nucleus in the universe, you're speaking nonsense. There is no frequency. Yet quantum mechanics still applies. The Schrödinger equation still evolves. The physics doesn't vanish because the ensemble is missing. Therefore, the probability must be a property of the single state vector.

  **ARIS:** Quantum mechanics is a model. Models predict frequencies. When the model says "50%," it means "in the limit of infinite trials, half will decay." That's what the Born rule tells us.

  **ELENA:** The Born rule applies to single systems too. That's the whole point of the measurement problem. If probability were only long-run, quantum tunneling in a single transistor wouldn't be predictable. But it is. The disposition is real. Regarding Humphreys: The fact that we can reason backwards from effect to cause doesn't mean the cause was produced by the effect. It means the propensity structure of the world leaves traces. The math describes the traces; the propensity describes the source.

  **ARIS:** But then you have two different things both called "probability." One that flows forward (propensity) and one that flows both ways (calculus). You've fractured the concept.

  **ELENA:** I've refined it. You've flattened it. You want to say that because we can't see the disposition without a crowd, the crowd creates the disposition. I'm saying the crowd reveals the disposition that was already there.

  **ARIS:** (Gestures to the lead pig) In this lab, we don't deal in "already there." We deal in counts. Clicks. Integrals. If I take that Cobalt button out of the pig, I don't worry about its soul. I worry about the dose rate. And the dose rate is a frequency.

  **ELENA:** And if you stand in front of the beam, *you* are the single case. You don't get cancer at a "frequency." You get it or you don't. When you decide whether to put on the lead apron, you are betting on a single-case propensity. You act like a propensity theorist every morning, Aris. You only preach frequentism when you're grading papers.

  **ARIS:** (Pauses, looks at the counter) I act on the best available data. Which comes from the collective.

  **ELENA:** The collective is just a heap of singles. If the single has no probability, the heap has nothing to sum.

  **ARIS:** And if the single has a propensity that defies the inverse calculus, you have no way to test it.

  *(Silence stretches between them. The Geiger counter gives a solitary, sharp click. Both look at it.)*

  **ELENA:** There. Did you hear that?

  **ARIS:** One count.

  **ELENA:** One realization of a propensity.

  **ARIS:** One data point for a frequency that doesn't exist yet.

  **ELENA:** It happened. Here. Not in a hypothetical infinite future. Here.

  **ARIS:** (Sighs) We're going to be at this all night.

  **ELENA:** Until the heat death of the universe. Or the next decay. Whichever comes first.

  **ARIS:** (A faint smile) Well. The half-life on this argument seems infinite.

  **ELENA:** Or zero. Depending on your reference class.

  *(Aris picks up his notebook. Elena adjusts the detector. The hum of the ventilation continues, indifferent to the interpretation.)*

  ***
