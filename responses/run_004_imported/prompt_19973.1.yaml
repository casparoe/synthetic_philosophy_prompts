          *   Reny's point: Rationality includes maximizing utility given *beliefs*. If the node is reached, my beliefs about your rationality must update.

      *   **Section 4: Taking a Side (The Verdict):**
          *   Argument: Aumann treats CKR as a static property of the world, but games are dynamic processes of belief revision.
          *   The "Impossible World" problem: Aumann's proof operates in a world where deviations *cannot* happen. But to analyze the game, we *must* consider what happens if they do.
          *   Therefore, CKR alone is insufficient. We need "Lexicographic beliefs" or "Trembling Hand" to make sense of off-path nodes.
