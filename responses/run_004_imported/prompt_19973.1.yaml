      *   *Aumann's Position (1995):* Common Knowledge of Rationality (CKR) implies BI. If everyone knows everyone is rational, and knows they know, etc., the logic holds all the way up.
      *   *Binmore/Reny Position (The "Paradox"):* If a player deviates from BI, CKR is falsified. So, asking what a rational player does *at that node* is counterfactual nonsense. You can't assume CKR *and* a deviation.
      *   *My Stance:* I need to pick one.
