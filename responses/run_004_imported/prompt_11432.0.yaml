      *   *Clarification:* Ensure the distinction between *psychological certainty* (I can't doubt it now) and *metaphysical certainty* (It is impossible for it to be false) is clear. That's the key to the God/Math link.
      *   *Tone Check:* Keep it helpful, not just giving the answer. Guide them to the argument.
      *   *Specific Question:* "Is Arnauld's circle literally the same shape?" Need to be nuanced. Structurally similar (A supports B, B supports A), but epistemically distinct (deductive validity vs. inductive warrant).

  8.  **Final Polish:** Check against the prompt requirements.
      *   Break down "insomuch that"? Yes.
      *   Why God unlocks Math? Yes.
      *   Step-by-step mapping to Cohen/Vogel? Yes.
      *   Circle vs. Bootstrapping structural difference? Yes.
