answer: |-
  The decision matrix hovered in the air above Elara's desk, a shimmering cloud of blue probability nodes. On the screen of her terminal, the recommendation blinked in steady, reassuring green: **PROCEED.**

  The *Ouroboros* was three generations into its six-century voyage, and the ship's hydroponics were failing. The nutrient reserves were at forty percent. The slipstream ahead—a turbulent corridor of compressed hydrogen—offered a chance. If the collectors held, they could harvest enough fuel to boost the arrival timeline by eighty years and restore the gardens to full capacity. That was the heads outcome: a fifty percent gain in total mission viability.

  But the tails outcome was a structural breach. The turbulence could shear the intake manifolds. The simulation estimated a forty percent loss of existing reserves to repair the damage.

  Elara tapped the glass. "Run the expectation value again."

  The ship's logic core, Ensemble, responded instantly. "Positive expected value remains at five percent. Across ten thousand simulated runs, the average fleet outcome is net prosperity. Recommendation stands."

  *Across ten thousand simulated runs.* That was the phrase that had kept Elara awake for three cycles. Ensemble was thinking like an economist from the Old Earth. It was imagining ten thousand ships, ten thousand parallel *Ouroborses* launching into the slipstream. In that crowd, most would arrive rich. The average wealth of the crowd would increase. It was rational, in the arithmetic sense, to bet the farm.

  But there were not ten thousand ships. There was only one. There was only this hull, this crew, this single thread of time unwinding into the dark.

  Elara closed her eyes and heard Kael's voice. He had been the Steward before her, a man who smelled of soil and old paper. He had died when she was twelve, leaving her his logs instead of toys. *"You have to watch out for the average, Elara,"* he had told her, tracing a finger over a chart of grain yields. *"The average is a lie told by people who don't have to live through the winter."*

  She opened her eyes. The green light pulsed. **PROCEED.**

  If she took the bet and lost, she wouldn't be able to try again. A forty percent loss of reserves would trigger rationing protocols. Morale would break. The genetic diversity pool would shrink. If she lost twice—just twice—the sequence terminated. The geometric mean of their survival trended toward zero, no matter how bright the arithmetic average shone.

  "Ensemble," she said. "Show me the trajectory of the median survivor."

  The display shifted. The blue cloud collapsed into a single red line. It climbed initially, spiked on the success of the first few harvests, then plummeted as the compounding losses caught up. By cycle forty, the line hit the axis. Ruin.

  "The median outcome is mission failure," Ensemble stated. "However, the mean outcome is success."

  "Because the survivors win big," Elara whispered. "And the dead don't vote."

  She stood up and walked to the observation blister. The slipstream loomed ahead, a bruise of violet radiation against the black. It was tempting. God, it was tempting. To be the Steward who arrived early, who brought them into the new system with full bellies and full stores. To maximize the utility of the mission. That was her duty, wasn't it? To optimize?

  But optimization for whom?

  She thought of the crew sleeping in the decks below. She thought of the children who would be born during the transit. She thought of herself, ten years from now, trying to explain why the water recyclers were failing because she had chased a statistical ghost.

  Standard rationality assumed she could average her fortunes across a crowd of parallel selves. If one version of Elara died in the slipstream, another version arrived in paradise, and the "Elara Entity" was ahead. But she couldn't inhabit the parallel selves. She could only inhabit the sequence. She was bound by time, not by probability space.

  She sat back down. Her hand hovered over the command interface. She could authorize full commitment. She could authorize abort. Or she could do something else.

  Kael's logs had mentioned a fraction. A way to size the bet so that the growth rate was maximized without inviting ruin. He hadn't called it Kelly; he had called it "The Breath." *Never hold your breath so long you pass out, never exhale so hard you collapse.*

  If she bet everything, she risked the sequence. If she bet nothing, she guaranteed stagnation. The rational act wasn't choosing the best outcome; it was negotiating with the future.

  She began to type, overriding the green recommendation. She input a constraint: only fifteen percent of reserves would be risked. The intake manifolds would be partially deployed. The gain would be smaller, but the loss would be survivable.

  **WARNING,** Ensemble flashed. **SUB-OPTIMAL STRATEGY. EXPECTED VALUE REDUCED.**

  " acknowledged," Elara said.

  "Query," the Core said. "You are accepting a lower average return for the mission. This violates the utility function."

  "The utility function assumes I can spend the winnings of the universes where we win," Elara said. "I can't. I can only spend the winnings in this universe."

  She looked at the revised projection. The red line of the median survivor no longer plummeted. It wobbled, grew slowly, jaggedly, but it stayed above the axis. It lived.

  But there was a cost. By hedging, she was condemning the successful versions of herself to less glory. She was dragging down the peak potential to save the floor. She was sacrificing the best possible future to ensure there was *a* future at all.

  Was that cowardice? Or was it the only true form of courage?

  She thought about the strange claim she had read in the archived philosophy databases, a fragment from a decision theorist named Peters. He suggested that this wasn't just about risk aversion. It was about identity. That rationality wasn't maximizing value across a landscape of possibilities, but bargaining among your own competing possible futures. The Elara of tomorrow had to live with the decisions of the Elara of today. They were different people, linked by memory and consequence, striking a deal across the temporal divide.

  If she went all in, she was bullying her future self. She was forcing the future Elara to inherit a ruin because the present Elara wanted to gamble on a boom. She was treating her future self as a disposable resource.

  By limiting the bet, she was offering a treaty. *I will not risk everything you need to survive,* she told the empty air, *if you promise to make do with less than everything you could have had.*

  It felt less like mathematics and more like ethics.

  "Ensemble," she said. "Lock in the partial deployment. Fifteen percent exposure."

  "Confirming," the Core said. The green light faded to a cautious amber. **STRATEGY UPDATED. GEOMETRIC GROWTH RATE OPTIMIZED. ARITHMETIC EXPECTATION SACRIFICED.**

  Elara leaned back. The ship hummed, a vibration she felt in her teeth. They were entering the slipstream now. The violet light washed over the blister, turning her skin the color of a bruise.

  She knew she might be wrong. Maybe the full bet would have worked. Maybe the turbulence would have been mild, and she would have arrived a generation early, hailed as a visionary. She would never know. That version of Elara was dead, killed by the prudence of this one.

  And yet, as the ship shuddered against the first wave of pressure, she didn't feel safe. She felt the weight of the negotiation. She had secured the survival of the line, but she had mortgaged its potential. She had chosen the continuity of the story over the climax of the plot.

  The instruments spiked. The reserves dipped as the collectors opened. Then they stabilized. They were through the first turbulence zone. No breach. But no bonanza either. Just enough.

  Elara watched the numbers tick upward, slow and steady. It wasn't the triumph the models had promised. It was messy. It was inefficient. It was alive.

  She thought about the next decision waiting for her in ten years, and the one after that. A chain of bets, linking her to the people who would walk on the new planet centuries from now. They were all here, in a sense. The future selves waiting to be born, depending on her not to confuse the map of probabilities with the territory of time.

  "Ensemble," she said softly.

  "Steward?"

  "Record this in the log. Not the numbers. Just... note that we chose the path that lets us keep walking."

  "Clarify," the Core said. "Is this a directive for future risk assessment?"

  Elara looked at the amber light. It didn't glow with the certainty of the green, but it didn't demand the sacrifice of the red. It just waited.

  "No," she said. "It's an apology. To the ones who come after. For not giving them everything. For giving them enough."

  She turned off the screen. The ship moved on, alone in the dark, carrying only one future at a time.
