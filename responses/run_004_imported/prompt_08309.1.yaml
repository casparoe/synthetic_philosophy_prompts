answer: |-
  It makes complete sense that this hit home. When philosophy stops being abstract and starts describing the exact texture of a fight you just had with your brother, it can feel less like an intellectual discovery and more like finding the blueprint of your own frustration.

  You have correctly identified the battlefield. Your brother is arguing for **External Reasons** (reasons exist independently of your psychology). You are instinctively arguing for **Internal Reasons** (reasons must anchor to something in you). Bernard Williams' 1980 paper *"Internal and External Reasons"* is indeed the canonical text for this.

  Here is the substance of the debate, broken down by your questions.

  ---

  ### 1. Williams' Internalism: Why it's not just "Do What You Want"

  Your suspicion is the most common critique of Williams: *If reasons depend on my motivations, doesn't that mean I only have reason to do what I already feel like doing?*

  Williams says **no**, and the distinction lies in two specific concepts: the **Subjective Motivational Set (S)** and the **Sound Deliberative Route**.

  **The Subjective Motivational Set (S)**
  Williams is careful not to call these "desires." If S were just "current cravings," his theory would be trivial. Instead, S is a broad bucket containing:
  *   Dispositions of evaluation.
  *   Patterns of emotional reaction.
  *   Personal loyalties.
  *   Projects and commitments (e.g., "I want to be a good person," "I value honesty").
  *   Raw desires (e.g., "I want gin").

  **The Sound Deliberative Route**
  This is the engine. Williams argues that having a reason isn't about looking at what you *currently* want; it's about what you *would* want if you thought clearly. A "sound deliberative route" allows you to arrive at a motivation you don't currently have. This route includes:
  *   **Correcting factual errors:** (e.g., You don't want to drink that liquid because you think it's gin, but it's petrol. Once you know, your motivation changes.)
  *   **Instrumental reasoning:** (e.g., You want health; exercise leads to health; therefore, you have a reason to exercise, even if you hate running.)
  *   **Constitutive reasoning:** (e.g., You value "being a supportive sibling." You realize that *sometimes* being supportive means setting boundaries, not just showing up. This might change your view on therapy.)
  *   **Imagination:** (e.g., You can't currently imagine liking therapy, but if you vividly imagined the relief of closure, that might generate a new motivation.)

  **So, why isn't it weak?**
  Because Williams allows that deliberation can *transform* your Motivational Set. You might go into therapy hating it, but if you have *any* element in your S (say, "curiosity" or "desire for peace") that, via sound deliberation, leads you to see therapy as useful, then you have an internal reason.

  **Applying it to your fight:**
  Williams would ask your brother: "Is there *anything* in the user's S that could link to therapy via deliberation?"
  *   **Brother's view:** The reason exists because he is your father. (External)
  *   **Williams' view:** If you truly have *no* element in your S (no guilt, no love, no curiosity, no desire for closure, no fear of regret) that could link to therapy, then **there is no reason for you to go.** Not even a moral one.

  Williams thinks saying "You have a reason" when there is no possible way to motivate you is just making a noise. It's empty.

  ---

  ### 2. The Externalist Case: Reasons as Objective Facts

  The strongest opposition comes from philosophers like **John McDowell** and **Thomas Nagel**. They argue that Williams is too cynical and misses the normative force of morality.

  **The Core Argument:**
  Externalists argue that reasons are facts about the world that count in favor of an action, regardless of whether the agent cares.
  *   **Nagel:** If someone is in pain, that is an objective reason to help them. It doesn't matter if I am in a bad mood or don't know them. The pain *itself* generates the reason.
  *   **McDowell (Virtue Ethics):** McDowell argues that the "virtuous person" perceives reasons that the unmotivated person is blind to. If you don't feel a reason to visit your sick father, you aren't proving that the reason doesn't exist; you are proving that you lack moral perception. You are "blind" to the demand the situation places on you.

  **Why this matters for your situation:**
  Your brother is essentially taking the McDowell line. He believes the *relationship itself* creates a normative demand. To him, your lack of feeling is a failure of perception or character, not proof that the reason is absent.

  **The Strongest Point for Externalism:**
  It preserves the ability to criticize. If Williams is right, and a psychopath has no internal motivation to be kind, we have to say the psychopath has *no reason* to be kind. Externalists say: "No, he has a reason, he is just irrational/immoral for ignoring it." They want to keep morality binding on everyone, even those who don't care about being good.

  ---

  ### 3. The Amoralist Objection: The Bullet Williams Bites

  This is the crux of your final question. *Does Williams' view commit him to saying a total amoralist has zero reason not to be cruel?*

  **The Short Answer:** Yes. Williams bites this bullet.

  **Williams' Reply:**
  Williams argues that we need to be honest about what the word "reason" does. The function of a reason is to explain or guide action.
  *   If an agent has **nothing** in their Motivational Set that links to morality (no sympathy, no fear of punishment, no desire for social standing, no commitment to fairness), then telling them "You have a reason to be moral" is like telling a rock it has a reason to fall up.
  *   Williams distinguishes between **"There is a reason"** and **"We should blame them."**
      *   We can still punish the amoralist to protect society.
      *   We can still express our outrage.
      *   But strictly speaking, if we are talking about *rational justification for the agent*, Williams says the amoralist is unreachable. There is no argument that can hook onto them.

  **Is this a dealbreaker?**
  *   **Externalists say Yes:** It makes morality too contingent. It means if you successfully train yourself to not care about others, you successfully escape moral reasons. That feels dangerous.
  *   **Williams says No:** It's just realism. If someone truly doesn't care, arguing about "reasons" is a charade. We should stop pretending we are reasoning with them and admit we are just negotiating or fighting.

  **A Nuanced Reply (The "Rationality" Counter):**
  Some philosophers (like Christine Korsgaard) try to split the difference. They argue that being an *agent* at all requires valuing your own humanity. If you value your own humanity, consistency demands you value the humanity of others. Therefore, even the amoralist has an internal reason (based on their own self-conception as an agent) not to be cruel. Williams would likely reply that the amoralist just doesn't value their humanity in that way, and we're back to square one.

  ---

  ### Bringing it back to you and your brother

  This debate explains why your conversation feels like a stalemate. You are speaking different languages.

  *   **You (Williams/Internal):** "I have looked at my Motivational Set. I have run the deliberative route. There is no hook there. No love, no guilt, no curiosity. Therefore, for me, the reason does not exist."
  *   **Your Brother (McDowell/External):** "The reason exists because he is your father. Your inability to feel it is a defect in you, not evidence that the reason is absent."

  **The Philosophical Verdict:**
  Williams would likely validate your feeling. If you have genuinely deliberated and found no connection to your S, he would say your brother is wrong to insist a reason exists *for you*. He might suggest your brother is using the word "reason" to mean "something I wish you would do" or "something society expects."

  However, the Externalist would warn you: Be careful that your "Subjective Motivational Set" isn't being protected by avoidance. Sometimes we claim we "feel nothing" to protect ourselves from the pain of feeling *something*. If there is even a tiny strand of "wanting to understand why I feel nothing," Williams would say *that* is a hook. That is an element in S that could lead to therapy via a deliberative route.

  But if that strand is truly gone? Williams says you're free. The externalists say you're blind. Philosophy can't tell you which one is true, but it clarifies that your brother cannot prove you wrong using logic alone, because he is assuming a framework (Externalism) that you are currently rejecting (Internalism).
