          *   State the objection clearly.
          *   Williams' concession (Yes, no internal reason).
          *   Williams' defense (Reasons must be capable of motivating; otherwise, what work is the word "reason" doing?).
          *   Externalist reply (Rationality requires acknowledging moral reasons).
      *   **Conclusion:** Bring it back to the user. Philosophy doesn't solve the family drama, but it clarifies the stalemate. The brother speaks "External," the user speaks "Internal." Neither can prove the other wrong easily because they disagree on the definition of "reason."

  6.  **Refine the Tone:**
