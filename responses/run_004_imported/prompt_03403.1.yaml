answer: |-
  Two meta-ethicists, Alan and Beth, are sitting in a café. Alan is defending his dissertation on the Buck-Passing Account of value.

  **Alan:** "It's simple, really. To say something is 'good' is just to say there are sufficient reasons to adopt a pro-attitude toward it. Value reduces to reasons."

  **Beth:** "Okay. So, imagine an evil demon appears behind you. He says, 'If you do not admire this saucer of mud, I will burn down the café.'"

  **Alan:** "Okay..."

  **Beth:** "Do you now have a sufficient reason to admire the mud?"

  **Alan:** "Yes. Saving our lives is a compelling reason."

  **Beth:** "So, according to your theory, the mud is good."

  **Alan:** "No! That's the *Wrong Kind* of Reason. It makes admiring the mud *prudent*, but it doesn't make the mud *admirable*."

  **Beth:** "Fair enough. So how do you distinguish the Right Kind from the Wrong Kind?"

  **Alan:** "The Right Kind of reasons are those that make the attitude *fitting*."

  **Beth:** "And what makes an attitude fitting?"

  **Alan:** "When the reasons stem from the object's actual value."

  **Beth:** "Wait. You said value is defined by the reasons. Now you're saying the right reasons are defined by the value."

  **Alan:** "Well, when you put it that way..."

  **Beth:** "So the mud is good if there are Right Kind reasons, but a reason is only Right Kind if the mud is already good?"

  **Alan:** "It's not circular. It's... hermeneutic."

  **Beth:** "Alan, look at the bill. Do you have a reason to pay it?"

  **Alan:** "Yes, otherwise you'll be angry."

  **Beth:** "Wrong Kind. Unless my anger makes you *deserving* of payment."

  **Alan:** "Look, just let me pay."

  **Beth:** "Why?"

  **Alan:** "Because I want to avoid an awkward silence."

  **Beth:** "Wrong Kind. Unless the silence is *bad*."

  **Alan:** "Fine! The silence is bad!"

  **Beth:** "Aha! So you knew the silence was bad *before* you cited the reason?"

  **Alan:** "Yes."

  **Beth:** "Then you didn't need the reasons to tell you it was bad. You needed the badness to tell you which reasons counted."

  **Alan:** *(Sighs and puts down his credit card)*

  **Beth:** "See? You just passed the buck, but you still had to pay the value."
