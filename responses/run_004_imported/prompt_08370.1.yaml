      *   *Strengths:* Captures Locke's pragmatic tone. Locke *does* believe children lack reason initially. The goal *is* to avoid the pain of constant conflict ("struggling or repining"). If the child doesn't remember the imposition, they don't feel the psychological sting of submission.
