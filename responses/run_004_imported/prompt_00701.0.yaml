answer: |-
  This is a classic philosophical puzzle (often associated with Thomas Nagel and Bernard Williams), and your intuition that your friend is misapplying the Kantian text is well-founded. In fact, your friend's argument contains a performative contradiction: she claims Kant makes outcomes irrelevant to judgment, yet she uses an outcome (the death of the child) to justify a difference in blameworthiness. If Kant is right that outcomes are irrelevant, then—given your stipulation that the drivers were *equally* drunk and *equally* reckless—their moral blameworthiness must be identical.

  Here is a breakdown of the passage you cited (*Groundwork* 4:393–394) addressing your three specific sticking points, followed by a synthesis of why this text actually supports your position more than hers.

  ### 1. Is "shine by its own light" an argument or an image?

  It is **rhetorical reinforcement, not a logical proof.**

  Kant is not using the jewel metaphor to *prove* that only volition has unconditional value. Rather, he has already asserted that premise in the first sentence ("A good will is good not because of what it performs... but simply by virtue of the volition"). The metaphor serves to illustrate the *consequence* of that premise: if value resides entirely in the will, then external failure cannot diminish it, just as a jewel's value does not vanish if it is kept in a box where it illuminates nothing.

  **Why this matters for your debate:**
  This distinction is crucial because it shows Kant is defining the *conditions* of moral worth, not observing empirical data. He is stipulating that for morality to be rational and universal, it cannot depend on contingent facts (like whether a child happens to be on the road). If your friend claims Kant "settled the question," she is right that he settled the *definition* of moral worth, but she is wrong to think that definition allows for differential blame based on results. The metaphor underscores independence from consequences; it does not provide a loophole to reintroduce them.

  ### 2. What does "the summoning of all means in our power" commit an agent to?

  This phrase is Kant's safeguard against **velleity** (mere wishing) versus **volition** (practical commitment).

  Kant is distinguishing between a "good intention" that remains passive and a "good will" that actively strives. To "summon all means" means the agent must employ every resource within their control to realize the moral end.

  **Application to the Drunk Driver:**
  This clause does **not** excuse the driver who failed to brake.
  *   **The Prior Act:** By choosing to drive drunk, the driver already failed to summon the primary "means in his power" to ensure safety (i.e., staying sober or not driving). The corruption of the will happened at the moment of ignition, not at the moment of impact.
  *   **The Immediate Act:** If the child darts out and the driver *could* have braked but didn't (due to intoxication), he is failing to summon the means *in that moment* as well. Kant requires that the will be effective *so far as lies within the agent's power*. Intoxication is a self-imposed limitation. Kant would argue you are responsible for the capacities you impair.

  However, this phrase also prevents the "lucky" driver from claiming moral superiority. If the lucky driver also drove drunk, he also failed to summon the means of safety. The fact that he didn't *need* to brake hard enough to avoid a death is a matter of fortune, not a sign that he "summoned more means" than the unlucky driver. Both failed the requirement to secure the safety of others as a duty.

  ### 3. Does this passage address Resultant, Circumstantial, or Constitutive Luck?

  The passage explicitly addresses **Resultant Luck**, implicitly acknowledges **Circumstantial Luck**, and largely sidesteps **Constitutive Luck**.

  *   **Resultant Luck (Outcomes):** This is the passage's main target. When Kant writes, *"Even if it should happen that... this will should wholly lack power to accomplish its purpose,"* he is insulating moral worth from resultant luck. Whether the driver kills a child or arrives home safely is a matter of "purpose accomplishment." Kant says this adds or subtracts nothing from the moral evaluation of the will. **This supports your view.**
  *   **Circumstantial Luck (The Road):** Kant mentions *"special disfavour of fortune."* This acknowledges that circumstances vary. However, he treats these circumstances as obstacles to *success*, not as variables that change the *goodness of the will*. For Kant, the moral act is adopting the maxim (e.g., "I will drive drunk to get home faster"). That maxim is immoral regardless of whether the road is empty or crowded. The luck of the road is irrelevant to the blameworthiness of adopting the maxim.
  *   **Constitutive Luck (Temperament/Upbringing):** Kant mentions the *"niggardly provision of a step-motherly nature."* He admits nature can limit our *power* to act, but he insists it cannot diminish the *value* of the will. However, Kant generally argues that we have a duty to cultivate our character regardless of our natural temperament. This passage doesn't solve the problem of constitutive luck (why one person has a reckless temperament and another doesn't); it simply asserts that even a person with a difficult nature can possess a good will if they strive against it. In the case of the drunk drivers, unless one can prove a pathological incapacity, Kant assumes both had the rational capacity to choose otherwise.

  ### The Verdict on Your Friend's Argument

  Your friend is caught in a contradiction. She argues two incompatible propositions:
  1.  Kant locates moral worth in the will alone, making outcomes irrelevant.
  2.  The driver who killed the child is more blameworthy.

  If (1) is true, (2) must be false (assuming the wills were equally reckless). If (2) is true, (1) must be false (because she is judging based on the outcome).

  **Where Kant actually stands:**
  Kant distinguishes between **ethical imputation** (moral blame) and **juridical imputation** (legal liability).
  *   **Legally:** We punish the killer more. This is pragmatic; it protects society and acknowledges the harm done. Kant accepts this in the *Metaphysics of Morals*.
  *   **Morally:** In the *Groundwork*, Kant is concerned with the purity of the moral law. From the perspective of the "noumenal" self (the rational will), both drivers violated the Categorical Imperative equally by treating humanity (themselves and others) as a mere means to getting home, risking lives for convenience.

  **Conclusion:**
  The passage you found supports **your** intuition, not your friend's. Kant uses this text to argue that moral worth is immune to the "disfavour of fortune." The driver who killed the child is indeed more *unfortunate* (as you said), and legally more liable, but on the specific Kantian metric of the *good/bad will*, they are equally blameworthy. Your friend is likely conflating the *horror of the consequence* with the *degree of moral fault*, a conflation Kant explicitly warns against in this very passage.

  You can tell her: "If Kant makes outcomes irrelevant, then the death of the child is an outcome. Therefore, by your own citation, it cannot increase his blameworthiness. You are using Kant to argue against Kant."
