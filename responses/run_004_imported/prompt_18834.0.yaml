answer: |-
  # The Bet-Sizing Wars: Geometric Rationality vs. Expected Utility

  Your friend is exciting to talk to at parties, but he is selling you a half-truth wrapped in mathematical certainty. He is channeling a modern revival of an old idea, often branded as "Ergodicity Economics" (championed by physicists like Ole Peters) or the "Rationalist" take on investing (popularized by figures like Edward Thorp and certain LessWrong sequences). Their claim is seductive: Expected Value (EV) thinking is broken because it assumes parallel universes, whereas real life happens in a single timeline. Therefore, maximizing the geometric growth rate (Kelly) isn't just a strategy; it is the *only* rational way to act.

  On the other side stands the old guard of economics, led by Paul Samuelson. Samuelson's critique is that this "new" insight is just Expected Utility Theory (EUT) in disguise. By choosing Kelly, you aren't escaping utility functions; you are secretly selecting a logarithmic utility function and pretending it's a law of physics.

  Here is the breakdown of the fight, followed by a verdict that tells you exactly when to listen to your friend and when to ignore him.

  ### The Case for Geometric Rationality

  The strongest argument for your friend's position rests on the concept of **ergodicity**.

  In standard probability, we calculate Expected Value by averaging outcomes across an *ensemble*. If 100 people flip a coin once, the average result is the ensemble average. Standard finance assumes this is the same as the *time* average: if one person flips a coin 100 times, their average result should match the group's.

  The Ergodicity crowd points out that this is false for multiplicative processes (like investing).
  Imagine a bet: Flip a coin. Heads, you gain 50% of your current wealth. Tails, you lose 40%.
  *   **Ensemble Average (EV):** $(0.5 \times 1.5) + (0.5 \times 0.6) = 1.05$. This is a positive 5% expected return. A naive EV maximizer says "Bet everything."
  *   **Time Average (Growth):** If you bet everything and play repeatedly, a single "Tails" reduces your capital, making the next "Heads" worth less. Over time, the volatility drags down the compound return. In fact, if you bet 100% of your bankroll on this specific bet repeatedly, you will almost surely go to zero.

  The geometric rationality argument posits that because we live in one timeline, not a multiverse, we should maximize the *time-average growth rate*. Mathematically, maximizing the time-average growth rate of wealth is identical to maximizing the expected value of the *logarithm* of wealth. This yields the Kelly Criterion.

  The pitch is that this removes "risk aversion" from the equation. You don't need to ask an investor how they feel about risk. The math of compounding *dictates* that betting too much leads to ruin. Therefore, Kelly isn't a preference; it's a physical constraint on survival. If you want to stay in the game, you must bet geometrically.

  ### The Samuelson Objection

  Paul Samuelson, the titan of 20th-century economics, found this line of thinking dangerously dogmatic. His critique, summarized in papers like *"The 'Fallacy' of Maximizing the Geometric Mean in Long Sequences of Investing"* (1971), cuts to the philosophical core of rationality.

  **1. The "Smuggled Utility" Argument**
  Samuelson argued that maximizing geometric mean wealth is mathematically equivalent to maximizing Expected Utility with a logarithmic utility function ($U(W) = \ln(W)$). There is no escape from utility theory. By claiming Kelly is "objective," the geometric rationalists are simply asserting that *everyone* should have log utility. But why?
  Utility is subjective. Some people have a liability due next month (e.g., a mortgage payment). For them, the utility of wealth is not smooth and logarithmic; it is a step-function where falling below a certain threshold means disaster. For them, Kelly betting might still be too aggressive.

  **2. The Finite Horizon Problem**
  Kelly is asymptotically optimal—it wins in the long run. But as Keynes famously said, "In the long run we are all dead." If you have a finite investment horizon (e.g., you are retiring in 10 years), maximizing the geometric mean is not necessarily the strategy that maximizes your expected utility at the end of those 10 years. Depending on your specific needs, you might want to bet less (to secure a minimum) or more (to catch up on a shortfall).

  **3. The One-Syllable Takedown**
  There is a famous anecdote (often attributed to Samuelson or his contemporaries) where a proponent of geometric mean maximization was challenged to explain their theory using only one-syllable words. The point was that the "deep truth" of ergodicity dissolves into simple arithmetic when stripped of jargon: it's just a specific preference for growth over safety. Samuelson's core point was that **rationality is about satisfying preferences, not obeying growth laws.** If your preference is to ensure you can eat tomorrow, maximizing long-term growth is irrational.

  ### The Verdict

  I am picking a side: **Samuelson is right, and your friend is wrong.**

  Expected Utility Theory is the correct framework for rational choice. The claim that Kelly is "rationality full stop" is a category error. However, this does not mean your friend is useless. It means he is mistaking a specific *application* for the *general theory*.

  Here is the defense of this verdict. "Rationality" is the efficient pursuit of *goals*. It is an instrumental virtue. To say a strategy is "rational" without knowing the agent's goal is meaningless.
  *   If your goal is to maximize the probability of dying with the most money possible after 1,000 bets, Kelly is rational.
  *   If your goal is to maximize the probability of having \$50,000 for a down payment in 3 years, Kelly is likely irrational (too volatile).
  *   If your goal is to minimize the chance of ruin below a subsistence level, Kelly is irrational (you should bet smaller).

  By claiming Kelly is *the* theory of rational choice, your friend is hardcoding a specific goal (infinite horizon wealth maximization) and pretending it is a universal law. Samuelson correctly identified that risk tolerance is a feature of the agent, not the math. The math can tell you the consequences of a bet, but only the agent's utility function can tell you if those consequences are desirable.

  ### The "Malignant Tumor" Conditions

  You asked for the conditions under which one framework wins out over the other, specified like a medical diagnosis. Do not use Kelly as a universal rule. Use it only if the patient (your investment scenario) meets **all four** of the following criteria. If any one of these is false, Expected Utility (customized to your situation) must override Kelly.

  **1. The Dynamics Must Be Multiplicative**
  *   **Condition:** Your wealth must compound. Gains must be reinvested, and losses must reduce the base for future bets.
  *   **Why:** If you are making additive bets (e.g., you get paid a fixed salary plus a bonus that doesn't affect your base salary), EV maximization is actually correct. Kelly is specifically the solution to volatility drag in compounding systems.
  *   **Test:** If I lose 50% today, is tomorrow's bet size automatically halved? If yes, use Kelly logic. If no, use EV.

  **2. The Horizon Must Be Effectively Infinite**
  *   **Condition:** You are not planning to liquidate the portfolio at a fixed future date to consume the proceeds. You are playing a game that continues indefinitely or for a very long time relative to the bet frequency.
  *   **Why:** Kelly maximizes the *rate* of growth. In short timeframes, the variance of Kelly betting is huge. You can be "right" about the growth rate but bankrupt before the math converges.
  *   **Test:** Can you afford to be down 90% for five years without your life falling apart? If no, Kelly is too aggressive.

  **3. No Intermediate Consumption or Liabilities**
  *   **Condition:** You are not withdrawing money from the portfolio to live, and you have no external debts that could force liquidation.
  *   **Why:** This is the "ruin" constraint. If you have a mortgage, your utility function has a "cliff" at the payment amount. Log utility (Kelly) is smooth; it doesn't account for the sudden death of a margin call or a missed mortgage payment.
  *   **Test:** Is this money "risk capital" that, if lost to zero, changes nothing about your lifestyle? If yes, Kelly is viable. If no, you need a custom Utility function.

  **4. The Goal Is Terminal Wealth Maximization**
  *   **Condition:** Your sole objective is to have the highest possible net worth at the end of the horizon. You do not care about the path, provided you don't go to zero.
  *   **Why:** This is the hidden preference. Some people derive utility from *not feeling stress*. Some people derive utility from *beating a benchmark*. Kelly ignores all of these. It only cares about the final number.
  *   **Test:** If offered a guaranteed 5% return vs. a Kelly strategy with an expected 10% return but high volatility, would you take the guarantee? If you take the guarantee, you do not have Log Utility, and Kelly is irrational for you.

  ### Summary

  Your friend is suffering from the "man with a hammer" syndrome. He has found a hammer (Kelly/Ergodicity) that is excellent for a specific nail (repeated, multiplicative, unconstrained wealth growth), and he is claiming it is the only tool that exists.

  Samuelson wins the theoretical debate because **rationality requires a utility function.** There is no "objective" risk tolerance. However, for a professional trader managing a proprietary book with no liabilities and a long horizon, the Kelly criterion is the *practical* winner because their utility function *should* be logarithmic.

  **Prescription:** Use Expected Utility Theory to define your goals and constraints. If—and only if—your goals align with long-term, unconstrained, multiplicative growth, *then* prescribe the Kelly Criterion. Otherwise, treat your friend's advice as dangerous dogma.
