answer: |-
  This is a sharp distinction to draw, and you're right that the Rationalist consensus often glosses over Lewis's specific metaphysical machinery in favor of Parfit's reductionist conclusion. The standard LessWrong take is essentially: "Parfit showed identity breaks, so we should care about R." Lewis's counter is: "Identity doesn't break; your conception of what a 'person' is was just too three-dimensional."

  Here is the breakdown of Lewis's overlap move, followed by a verdict on whether he actually saves "Identity" or just smuggles Relation R back in under a new name.

  ### The Machinery: Stages, Worms, and Overlap

  To understand Lewis's rebuttal in *Survival and Identity* (1976), you have to buy into his **Four-Dimensionalism (Perdurantism)**.

  1.  **Person-Stages:** You are not a wholly present object enduring through time. You are a series of temporal parts (stages). The "you" of 2020 and the "you" of 2030 are distinct entities, related by psychological continuity.
  2.  **Persons as Worms:** A "Person" is the maximal aggregate of these person-stages connected by the right relations (psychological continuity, etc.). Think of a person as a space-time worm.
  3.  **The I-Relation vs. The R-Relation:**
      *   **R-Relation:** Psychological continuity and connectedness (Parfit's Relation R). This holds between *stages*.
      *   **I-Relation:** Strict numerical identity. This holds between *persons* (the whole worms).

  **Parfit's Trap:** In a fission case (e.g., brain bisection), Stage $S$ (pre-fission) is R-related to Stage $L$ (left successor) and Stage $R$ (right successor). If Person = Worm, and identity is transitive, we have a problem. If Person-Pre is identical to Person-Left, and Person-Pre is identical to Person-Right, then Person-Left must be identical to Person-Right. But they are two different people living distinct lives. Contradiction. Parfit concludes: Identity does not hold; only R holds.

  **Lewis's Escape (The Overlap Thesis):**
  Lewis argues that Parfit assumes there is only *one* person-stage before the fission. Lewis says: **No.**

  In a fission scenario, there are **two** distinct person-worms present *before* the fission occurs. They are not identical, but they **overlap**. They share all the same pre-fission stages.
  *   **Person A:** Comprises Pre-Fission Stages + Left Successor.
  *   **Person B:** Comprises Pre-Fission Stages + Right Successor.

  Before the fork, Person A and Person B are distinct entities occupying the same space-time region (like two roads running together before diverging). When the fission happens, they don't split; they *separate*.
  *   Does Person A survive? Yes, as the Left Successor.
  *   Does Person B survive? Yes, as the Right Successor.
  *   Is identity one-to-one? Yes. A is identical to Left. B is identical to Right. A is not identical to B. Transitivity is preserved.

  When you (the current stage) ask, "Will I survive?", Lewis says you are a stage shared by two persons. Both persons survive. Therefore, you have two futures. Identity holds in both cases.

  ### The Verdict: Rescue or Repackaging?

  Does Lewis genuinely rescue the claim that "Identity is what matters," or is this just Relation R with extra steps?

  **The Verdict:** Lewis successfully rescues the **logic** of identity, but he fails to rescue the **intuition** behind why we think identity matters. He avoids repackaging R as Identity by making a substantive metaphysical claim (overlapping worms), but in doing so, he concedes the practical ground to Parfit.

  Here is the breakdown of why this is a **Pyrrhic Victory** for Lewis.

  #### 1. It is not *just* repackaging (The Metaphysical Cost)
  Critics often accuse Lewis of semantic trickery—defining "person" such that identity always holds. But this is unfair. Lewis's view has genuine truth-conditional differences from Parfit's.
  *   **Parfit:** Before fission, there is one person. After fission, that person ceases to exist, and two new people begin. Statements like "I will be Lefty" are false (or empty).
  *   **Lewis:** Before fission, there are two people. After fission, they continue. Statements like "I will be Lefty" are true (relative to Person A).

  This is not just slapping a label on R. It requires an ontological commitment to coincident entities (two people sitting in your chair right now thinking the same thought). If you accept 4Dism, Lewis's solution is logically superior because it preserves the transitivity of identity without denying survival. He proves that "Identity is what matters" is *consistent* with fission, whereas Parfit argues it is *inconsistent*. On purely logical grounds, Lewis wins.

  #### 2. The "Extrinsicness" Problem (Where Lewis Bleeds)
  However, Lewis saves Identity only by making it **extrinsic**.
  Whether *I* (the current stage) am identical to the future Lefty depends on whether the Righty exists. If the Righty branch is destroyed immediately, I am part of a single worm. If the Righty branch survives, I am part of two overlapping worms.
  *   **Parfit's Objection:** How can my survival depend on what happens to someone else (the other branch)? Survival should be intrinsic.
  *   **Lewis's Reply:** Identity *is* extrinsic. Deal with it.

  Here, Lewis saves the word "Identity" but sacrifices the feature of identity that made it desirable in the first place. We care about survival because it's about *us*. If whether "I" survive depends on external factors (the existence of a fission partner), then Identity loses its normative force. Lewis preserves the *relation* of identity, but he strips it of the **intrinsic significance** we usually attach to it.

  #### 3. The "What Matters" Question
  This is the crux of your prompt. Parfit argues that since Identity fails in fission, but we still care about the successors (we anticipate their experiences), Identity cannot be what matters. R is what matters.

  Lewis argues: "No, Identity *is* what matters. In fission, Identity *holds* (to both successors), so it's no wonder we care."

  But does this actually change the phenomenology of survival?
  *   **Parfit:** I don't survive as identical to either, but I should anticipate both experiences because they are R-related to me.
  *   **Lewis:** I am two people. Both survive. I should anticipate both experiences.

  Practically, the advice is identical. Both tell the pre-fission agent to care about both successors equally. Lewis insists this care is based on Identity, while Parfit insists it is based on R. But since Lewis constructs Identity *out of* R-connected stages (plus the overlap rule), the **ground** of the value is still R.

  Lewis hasn't shown that Identity has value *independent* of R. He has shown that Identity can be *defined* in a way that tracks R even in fission cases. If the value of survival comes from psychological continuity (anticipation, memory, character), then Lewis is still relying on R to do the heavy lifting; he's just ensuring the label "Identity" sticks to it.

  ### Final Judgment

  Lewis does not cop out, and he isn't merely repackaging. He offers a robust metaphysical model where Identity remains intact. However, he fails to rescue the **traditional significance** of Identity.

  By accepting overlapping persons, Lewis makes "Identity" a matter of counting space-time worms rather than a matter of unique, singular persistence. When we say "Identity is what matters," we usually mean "My unique, singular existence continuing." Lewis saves "Identity" by denying the "unique, singular" part (there are two of you all along).

  **So, the verdict:**
  Lewis proves that **Identity is compatible with fission**, but only by redefining Identity such that it loses the exclusivity that made it the candidate for "what matters" in the first place. He saves the *logic* of the claim "Identity is what matters," but Parfit wins the *normative* argument. We care about the future because of Relation R (psychological continuity); Lewis just constructs a notion of Identity that shadows R perfectly.

  If you care about logical consistency above all, Lewis wins. If you care about whether "Identity" captures the specific, exclusive self-concern that drives the debate, Parfit is right: Lewis has saved the word, but the substance is still Relation R. Lewis's move is metaphysically brilliant but normatively inert.
