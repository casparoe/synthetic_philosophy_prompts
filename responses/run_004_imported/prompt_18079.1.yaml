          *   Person B: Stages $1...n$ + Right Successor.
          *   Before fission, Person A and Person B share the same stages. They are distinct but coincident.
      *   **The Crucial Distinction:** Lewis distinguishes between the *I-relation* (Identity) and the *R-relation* (Psychological Continuity). For Lewis, Identity *is* what matters, but we must understand identity correctly (as identity of person-stages within a maximal person).

