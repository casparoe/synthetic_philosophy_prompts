answer: |-
  You have hit on one of the most famous and enduring cruxes in medieval Jewish philosophy. Your friend is likely referring to **Nahmanides (Ramban)**, who, in his commentary on Leviticus, explicitly attacks Maimonides' view in the *Guide* precisely because of the problem you identified. Nahmanides argues that if sacrifices were merely a concession to idolatry, they would indeed be a regression in the Messianic age.

  However, you asked me not to give you the standard harmonizations or the "smart people have debated this" cop-out. You want the case made that this is a **genuine, unresolved contradiction** internal to Maimonides' own system. You want to see how the logic of the *Guide* dismantles the eschatology of the *Mishneh Torah*.

  Here is the argument for why Maimonides is logically trapped, and why the restoration of sacrifices in the Messianic age constitutes a philosophical regression based on his own reasoning in *The Guide for the Perplexed*.

  ### 1. The Teleological Argument: Means vs. Ends
  In *Guide* 3:32, Maimonides advances a **teleological** argument about the Law. He posits that religious practices have a trajectory.
  *   **The Premise:** The ultimate goal of the Torah is the perfection of the human intellect and the true knowledge of God.
  *   **The Mechanism:** Because the Israelites were psychologically incapable of jumping straight from idolatrous materialism to pure intellectualism, God instituted sacrifices as a *transitional mechanism* (a *tachbulah*, or stratagem).
  *   **The Implication:** Sacrifices are instrumental, not intrinsic. They are a ladder to be climbed and then kicked away.

  If the Messianic Age represents the culmination of history—the point where "the earth shall be full of the knowledge of the Lord" (Isaiah 11:9)—then the *condition* that necessitated the concession has been removed.
  *   In the *Guide*, the necessity for sacrifice is **contingent** upon the prevalence of idolatrous custom.
  *   In the Messianic Age, idolatry is eradicated.
  *   **The Contradiction:** To restore a contingent mechanism after the contingency has vanished is irrational. It is like continuing to administer a medicine after the disease has been cured. If the *Guide* is correct that sacrifices are the "medicine" for the "disease" of idolatrous habit, then the Messianic restoration of sacrifice implies either that the disease wasn't actually cured (undermining the definition of the Messiah) or that the medicine is actually nutritious food (undermining the *Guide*'s concession theory).

  ### 2. The Problem of Divine Consistency
  Maimonides leans heavily on Jeremiah 7:22 in the *Guide*: *"For I spoke not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt offerings or sacrifices."*
  Maimonides uses this to argue that sacrifice was not God's primary will. It was a secondary accommodation.

  Now, look at the *Mishneh Torah* (Hilkhot Melakhim 11:1). The Messiah is defined by his adherence to and restoration of the Mosaic Law. If the Law includes sacrifices, and the Messiah restores them, then sacrifices are part of the **eternal divine will**.

  Here is the logical trap:
  *   **Position A (Guide):** God's *primary* desire is prayer/intellect; sacrifice is a concession to human weakness.
  *   **Position B (Mishneh Torah):** God's *eternal* desire includes sacrifice, as evidenced by its restoration in the perfected world.

  If Position B is true, Position A is a lie (or at best, a "noble lie" for the masses). If Position A is true, Position B depicts a God who, upon achieving the perfection of the world, decides to reinstate a ritual He previously admitted was not His primary command. This makes God appear inconsistent. It suggests that in the *Guide*, Maimonides is describing a God who tolerates imperfection to cure it, but in the *Mishneh Torah*, he is describing a God who demands the ritual even when the imperfection is gone.

  ### 3. The Definition of "Human Nature"
  The most common defense of Maimonides is that "human nature doesn't change." People always need physical acts to connect to the spiritual. Therefore, even in the Messianic age, we need sacrifices.

  **This defense collapses under the weight of *Guide* 3:32.**
  Maimonides does *not* argue there that sacrifice is necessary because of inherent human ontology (i.e., "humans are physical beings"). He argues it is necessary because of **historical circumstance** (i.e., "humans *at that time* were accustomed to sacrificial worship").

  He writes:
  > *"It was in accordance with the wisdom and plan of God... that He did not command us to give up and to discontinue all these manners of service, for to obey such a commandment at that time would have been contrary to the nature of man which generally cleaves to that to which it is accustomed."*

  Note the qualifier: *"at that time."*
  Maimonides explicitly grounds the necessity of sacrifice in the *custom of the age*. The Messianic Age, by definition, is a new age with new customs (universal knowledge, no idolatry). If the "nature of man" that requires sacrifice is actually just "the habit of man living in an idolatrous culture," then the Messianic man, freed from that culture, should be freed from the ritual. To insist he still needs it is to contradict the *Guide*'s specific historical diagnosis.

  ### 4. The Conflict Between the Codifier and the Philosopher
  This is the deepest cut. Maimonides is wearing two hats, and they are incompatible on this issue.

  **Maimonides the Codifier (Mishneh Torah):**
  He is bound by the Talmudic principle that "the commandments are not to be abolished in the future." He is building a legal system that must remain binding *ad infinitum*. To suggest sacrifices might end is heresy according to the 13 Principles of Faith (Torah is eternal). He *must* say sacrifices return.

  **Maimonides the Philosopher (The Guide):**
  He is trying to explain the *reasons* for the commandments to an intellectual elite who find sacrifices primitive. To save the Torah from the charge of primitivism, he *must* argue that sacrifices are a historical concession.

  **The Contradiction:**
  You cannot simultaneously hold that:
  1.  The Law is perfect and eternal because it reflects God's unchanging wisdom.
  2.  Specific laws (sacrifices) exist only because of a temporary historical defect in the recipients of the Law.

  If (2) is true, then the Law is historically contingent, not eternally perfect. If the Law is historically contingent, it should change when history changes (i.e., in the Messianic Age). By insisting in the *Mishneh Torah* that the Law *does not* change, Maimonides undermines the philosophical argument of the *Guide*. By insisting in the *Guide* that the Law *was* a concession, he undermines the legal argument of the *Mishneh Torah*.

  ### 5. Why This Is a Regression, Not a Completion
  You asked specifically to argue why the Messianic restoration is a **regression**.

  In the *Guide*, Maimonides outlines a hierarchy of worship:
  1.  **Lowest:** Idolatrous sacrifice (offering to stars/angels).
  2.  **Middle:** Monotheistic sacrifice (offering to God, but still material).
  3.  **Highest:** Prayer and Intellectual Contemplation (offering the mind/heart).

  The movement of history, according to the *Guide*, is a climb from 1 to 3. The Sinai legislation was a brilliant move to jump from 1 to 2, with the hope of eventually reaching 3.

  The Messianic Age is described by Maimonides (in *Hilkhot Melakhim*) not as a time of miracles, but as a time where Israel is free to study Torah and wisdom without oppression. It is the triumph of the intellect.
  If the Messianic Age is the triumph of the intellect (Level 3), but Maimonides mandates a return to material sacrifice (Level 2), he is forcing a regression. He is demanding that a perfected humanity return to a "pedagogical tool" designed for an immature humanity.

  It is akin to a university professor arguing that calculus is only taught because students aren't ready for pure theoretical mathematics, and then, upon the students finally mastering pure theory, requiring them to go back to using an abacus.

  ### Conclusion
  You are right to feel that these two positions do not sit comfortably together. Maimonides attempted to rationalize the irrational without discarding it. He wanted to tell the philosophers, "Don't worry, God doesn't *need* the blood," while telling the traditionalists, "Don't worry, the blood is still mandatory forever."

  But logic demands a choice. If the sacrifice is a concession to human limitation, a world without limitation needs no concession. If the sacrifice is an eternal divine requirement, it was never merely a concession. Maimonides tries to have it both ways, but in doing so, he creates a system where the Messianic redemption—supposedly the pinnacle of religious history—requires the reinstatement of a practice he explicitly defined as a remedy for a spiritual sickness that the Messiah is supposed to cure.

  That is not a resolution. That is a contradiction.
