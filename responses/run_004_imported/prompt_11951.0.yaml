answer: |-
  Here are 10 questions designed to press the substantive vulnerabilities of Naive Realist Disjunctivism (NRD), including the three specific topics you requested. Each question includes a "menu" of three follow-ups keyed to the standard defensive moves you identified, so you can deploy the right counter-argument in real-time.

  ### 1. The Causal/Neural Identity Challenge (Required)
  **Question:** "Consider a case of direct cortical stimulation where the proximal neural cause of a hallucination is type-identical to the proximal neural cause of a veridical perception. If the immediate physical realizer of the mental state is identical in both cases, on what grounds do you insist the mental states themselves are different *fundamental kinds* rather than the same kind with different distal causes?"

  *   **If she denies the common-kind assumption:** "If the mental states are fundamentally different kinds despite identical neural realizers, doesn't that imply mental kinds don't supervene on local physical states? Are you prepared to accept that level of non-locality?"
  *   **If she bites the bullet on the causal case:** "If you accept neural identity but mental difference, aren't you effectively positing a brute modal coincidence? What explains why the *same* neural state supports two *different* metaphysical relations?"
  *   **If she retreats to a disjunctive concept:** "If 'experience' is just a disjunctive label covering two unrelated states, doesn't that dissolve the unity of the subject's perspective? How can *I* navigate the world using a concept that picks out no single functional or phenomenological kind?"

  ### 2. The Epistemological "Screening Off" Problem (Required)
  **Question:** "In the McDowell/Pritchard tradition, you claim the veridical subject has factive reasons the hallucinating subject lacks. But since the subject cannot tell from the inside which case they are in, doesn't the possibility of the bad case 'screen off' the good case? How does a factive reason do any justificatory work for the agent if its availability is opaque to them?"

  *   **If she denies the common-kind assumption:** "If the rational standing is fundamentally different in the good case, why does the subject's own confidence and betting behavior remain identical across both cases?"
  *   **If she bites the bullet on the causal case:** "Are you suggesting that two agents with identical internal evidence and cognitive histories have different rational permissions? Doesn't that sever the link between rationality and responsible agency?"
  *   **If she retreats to a disjunctive concept:** "If justification is disjunctive, can the agent ever cite their reason in deliberation? Or does this turn epistemology into a third-person assessment tool that the first-person agent can't actually use?"

  ### 3. The Time-Lag Argument (Required)
  **Question:** "Naive realism posits a direct relation to a presently existing object. But given light transmission and neural processing time, the object we perceive may have ceased to exist or changed properties by the time the experience occurs. What is the relata of the perceptual relation in these cases? If it's not the present object, isn't the 'directness' claim compromised?"

  *   **If she denies the common-kind assumption:** "Are you suggesting veridical perception of a dead star is a different *kind* of state than perception of a nearby hand? If so, doesn't that fragment the unity of perceptual consciousness?"
  *   **If she bites the bullet on the causal case:** "If you claim we are related to the object *as it was*, aren't you admitting a form of indirect realism where the immediate object of awareness is temporally displaced?"
  *   **If she retreats to a disjunctive concept:** "If the 'perceptual relation' is disjunctive (sometimes present object, sometimes past object), what work is the notion of 'presence' doing in your definition of perception?"

  ### 4. The Phenomenal Indistinguishability Problem
  **Question:** "You argue the good and bad cases are metaphysically distinct. Yet, by definition, they are subjectively indistinguishable. If there is no phenomenological difference available to the subject, in what sense is the 'phenomenal character' constituted by the external object rather than the internal state?"

  *   **If she denies the common-kind assumption:** "If the phenomenal character is different, why is the subject's phenomenal report identical? Are you positing a difference that makes no phenomenological difference?"
  *   **If she bites the bullet on the causal case:** "Does this imply that phenomenal character is not intrinsic to the experience but extrinsic? If so, how does it guide action in the moment?"
  *   **If she retreats to a disjunctive concept:** "If the phenomenology is disjunctive, does the term 'what it is like' still refer to a unified property? Or have you redefined phenomenology to include metaphysical relations the subject can't access?"

  ### 5. The Supervenience and Physicalism Worry
  **Question:** "Most philosophy of mind aims to integrate with cognitive science, which assumes mental states supervene on brain states. If a veridical perception and a perfect hallucination can share a brain state but differ in mental kind, doesn't NRD require a rejection of local supervenience?"

  *   **If she denies the common-kind assumption:** "If mental kinds don't supervene on local neural kinds, how do we explain the causal efficacy of the mental in a physical world?"
  *   **If she bites the bullet on the causal case:** "Are you willing to say that the neuroscience of perception is studying something other than the metaphysics of perception? How do we bridge that gap?"
  *   **If she retreats to a disjunctive concept:** "If the mental kind is disjunctive, can it enter into strict psychological laws? Doesn't this make the mind scientifically opaque?"

  ### 6. The "Bad Case" Dependency Problem
  **Question:** "Disjunctivists often define the hallucinatory case negatively—as what is left when the veridical relation fails. But doesn't this make the bad case parasitic on the good case? How can you give a positive account of what a hallucination *is* without referencing the veridical state it mimics?"

  *   **If she denies the common-kind assumption:** "If the bad case has no positive nature of its own, is it a mental state at all, or just a failure of a mental state? How does a failure guide behavior?"
  *   **If she bites the bullet on the causal case:** "If the bad case is just a 'failure,' why does it have such robust causal powers to induce belief and action?"
  *   **If she retreats to a disjunctive concept:** "If the concept of experience relies on this asymmetry, isn't the disjunction biased? Doesn't this make the theory circular, defining perception via the very relation it's trying to explain?"

  ### 7. Action Guidance in the Bad Case
  **Question:** "In a hallucination, I can successfully reach for the apple, navigate the room, and avoid obstacles. If there is no representational content and no object to relate to, what explains the precision of motor guidance in the bad case?"

  *   **If she denies the common-kind assumption:** "If the motor guidance system is operating on a different kind of state in the bad case, why is the output behaviorally identical to the good case?"
  *   **If she bites the bullet on the causal case:** "Are you suggesting the motor system is fooled by a state that lacks the very properties (spatial, object-based) it needs to compute trajectories?"
  *   **If she retreats to a disjunctive concept:** "If action guidance is disjunctive, do we need two different theories of motor control? Doesn't this violate the theoretical unity of psychology?"

  ### 8. The Continuum of Illusion
  **Question:** "Perception isn't binary; there are degrees of distortion, blur, and partial occlusion. If veridical perception is a relation to an object, at what precise point along the continuum of distortion does the relation break and the 'different kind' of state begin?"

  *   **If she denies the common-kind assumption:** "If there is a sharp cutoff between relational and non-relational states, why does phenomenology present itself as a smooth continuum?"
  *   **If she bites the bullet on the causal case:** "Are you committed to saying that a 1% distortion is a relation, but a 2% distortion is a fundamentally different kind of state? That seems arbitrary."
  *   **If she retreats to a disjunctive concept:** "If the concept is disjunctive across a continuum, doesn't 'perception' become a vague term that fails to carve nature at its joints?"

  ### 9. Cognitive Penetration
  **Question:** "If my beliefs or desires can alter how an object looks (e.g., the dress looks blue or gold), does the perceptual relation change? If the object stays the same but the experience changes, isn't the variance internal rather than relational?"

  *   **If she denies the common-kind assumption:** "If cognitive penetration changes the kind of state, does the subject stand in a different relation to the *same* object? How is that metaphysically possible?"
  *   **If she bites the bullet on the causal case:** "Are you saying the object itself changes its apparent properties based on my mind? Doesn't that concede the point to the representationalist?"
  *   **If she retreats to a disjunctive concept:** "If the relation is sensitive to cognitive states, isn't the 'directness' of the relation mediated by the very cognitive factors you want to exclude?"

  ### 10. Ontological Parsimony
  **Question:** "Standard representationalism posits one kind of state with two causes (veridical vs. non-veridical). Disjunctivism posits two kinds of states to preserve one metaphysical intuition. Given that both theories must explain the same data, isn't the disjunctivist ontological cost prohibitive?"

  *   **If she denies the common-kind assumption:** "Is preserving 'directness' worth doubling the ontology of mental states? What explanatory gain offsets this cost?"
  *   **If she bites the bullet on the causal case:** "If you accept the ontological bloat, do you gain any predictive power? Or is this cost paid solely for metaphysical comfort?"
  *   **If she retreats to a disjunctive concept:** "If 'experience' is disjunctive, haven't you just renamed the problem? Isn't 'disjunctive kind' just a label for 'we don't have a unified theory yet'?"
