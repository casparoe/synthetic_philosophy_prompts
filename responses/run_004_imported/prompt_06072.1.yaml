answer: |-
  This is a fantastic connection to make. Your software engineering intuition is actually quite close to the mark regarding the *structure* of Hobbes's thought, but as you suspect, Hobbes is making a metaphysical claim that goes deeper than mere semantic hygiene.

  Douglas Jesseph's *Squaring the Circle: The War Between Hobbes and Wallis* is indeed the definitive modern treatment of this, and it supports your hunch: Hobbes wasn't merely being stubborn. He was operating from a coherent, materialist epistemology that made his rejection of Wallis's methods principled, even if his specific calculations were disastrous.

  Here is an unpacking of the *Leviathan* passage and how it connects to the Wallis dispute.

  ### 1. Geometry as the Only Science: Definitions vs. Construction

  You asked whether the epistemic work is done by "definitions as such" or by something deeper about geometrical objects. The answer is the latter. For Hobbes, definitions are necessary, but they are only sufficient for certainty because of **who creates the object being defined.**

  **The "Names" Theory of Truth**
  In the passage you quoted, Hobbes states that "truth consisteth in the right ordering of names." This is a nominalist position. There are no universal "Truths" floating in the ether; there are only true *propositions*. A proposition is true if the predicate name is correctly contained within the subject name (e.g., "A man is a living creature" is true because the concept of 'living creature' is part of the definition of 'man').

  **Why Geometry is Unique**
  If truth is just about names, why can't we have a rigorous science of biology or physics? Why is geometry the "only science that it hath pleased God hitherto to bestow on mankind"?

  For Hobbes, certainty requires knowledge of **causes**.
  *   **Natural Philosophy (Physics):** We observe effects (a stone falls) and try to reason backward to the cause (gravity? magnetism? inherent nature?). But because we did not create the stone, we cannot be certain we have identified the true cause. We are guessing at God's work.
  *   **Geometry:** We define the object *by its cause*. When a geometer defines a circle, they do not just say "a round thing." They define it by its **generation**: *the figure described by a body moved around a fixed point with a constant radius.*

  Because **we** stipulate the motion that generates the figure, we know everything there is to know about it. We possess the "source code" of the geometric object. In your SE analogy:
  *   **Physics** is like trying to reverse-engineer a legacy binary without documentation. You can guess what the API does, but you can't be certain why.
  *   **Geometry** is like writing a library from scratch. You define the types and the constructors. Therefore, you can prove theorems about them with absolute certainty.

  So, the "settling of significations" (definitions) works in geometry not just because the words are clear, but because the definitions refer to **constructible mental objects** whose entire existence is exhausted by the definition. There is no "hidden state" in a Hobbesian circle.

  ### 2. Reasoning as "Reckoning" and the Wallis Dispute

  This brings us to your second question: Did Hobbes's theory of reasoning give him principled grounds for trusting his flawed proofs against Wallis?

  **Reasoning is Computation**
  When Hobbes says reasoning is "reckoning," he means it literally. He views logic as a form of arithmetic. To reason is to add and subtract the consequences of names.
  *   *Addition:* "Man" + "Rational" = "Human."
  *   *Subtraction:* "Human" - "Rational" = "Animal."

  If you start with settled definitions (types) and perform valid operations (logic), the result *must* be true. This is where Hobbes's confidence came from. He believed he was following the syntactic rules of reasoning perfectly.

  **The Clash with Wallis**
  John Wallis represented the "new analysis." He used algebraic symbolism, infinitesimals, and indivisibles (early calculus concepts). To a modern mathematician, Wallis was right and Hobbes was wrong. But to Hobbes, Wallis was committing a category error that violated the very conditions of *scientia*.

  1.  **Ontological Commitment:** Hobbes was a strict materialist. For him, "body" is the only substance. A geometric point is a body with magnitude ignored; a line is the trace of a moving body.
  2.  **The Problem of Infinitesimals:** Wallis talked about "infinitely small" quantities or ratios of indivisibles. For Hobbes, this was nonsense. There is no such thing as an "infinitely small body." It is a name without a signification.
  3.  **The "Principled" Error:** When Wallis showed Hobbes a contradiction in his squaring of the circle, Hobbes didn't just say "I made a mistake." He often argued that Wallis's *method* of finding the mistake was invalid.

  In Hobbes's mind, if Wallis is using symbols that do not correspond to conceivable bodies in motion, then Wallis is not doing geometry; he is playing a game with meaningless marks. Therefore, even if Wallis's result matched reality, his *demonstration* was not scientific.

  Hobbes stayed unmovable because, by his own lights, **he was the only one actually doing geometry.** He believed he was adhering to the strict Euclidean synthetic method (constructing figures, proving via congruence) which aligned with his materialist metaphysics. Wallis was using "mystical" algebraic shortcuts that Hobbes viewed as intellectually dishonest.

  Jesseph points out that Hobbes often made elementary arithmetic errors in his proofs. However, Hobbes tended to treat these not as calculation slips, but as logical necessities. If his reasoning (reckoning) followed the definitions, the conclusion *had* to be true. If it contradicted Wallis, then Wallis's understanding of the definitions must be wrong.

  ### 3. Why He Couldn't Back Down (The Political Stakes)

  There is one final layer to this, which explains the intensity of the 25-year feud. It wasn't just about math; it was about *Leviathan*.

  Hobbes's political philosophy relies on the possibility of certainty in human affairs. He wants politics to be a science like geometry.
  *   If geometry is uncertain (as Wallis might imply by introducing complex, non-constructive methods that lead to paradoxes), then the model for political certainty collapses.
  *   If Hobbes admits he cannot square the circle, he admits that human reason is fallible even in the one domain God gave us to master.
  *   If human reason is fallible, then the Sovereign's authority cannot be grounded in rational demonstration, but only in force or tradition.

  For Hobbes, admitting error to Wallis wasn't just conceding a math problem; it was conceding that the universities (which Wallis represented) were right and that Hobbes's entire project of a "Civil Science" based on geometric certainty was flawed.

  ### Summary

  To return to your software analogy:
  *   **Hobbes's View:** Geometry is the only domain where we own the repo, we wrote the spec, and we control the runtime. Therefore, bugs are impossible if the code compiles (i.e., if the reasoning is valid).
  *   **The Wallis Conflict:** Wallis started importing libraries (algebra/infinitesimals) that Hobbes believed had undefined dependencies and violated the type system (materialism).
  *   **The Stubbornness:** Hobbes wasn't just ignoring compiler errors; he was arguing that the compiler Wallis was using was fundamentally unsound. He trusted his own "code" because he wrote the spec, even when the output didn't match the expected behavior.

  Hobbes was wrong about the math, but Jesseph shows us he was remarkably consistent about the philosophy. He sacrificed his mathematical reputation to preserve the integrity of his materialist epistemology. He chose to be the king of a small, certain kingdom (flawed geometry) rather than a subject in Wallis's expanding, uncertain empire (modern analysis).
