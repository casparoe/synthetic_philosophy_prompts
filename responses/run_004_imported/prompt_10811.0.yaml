answer: |-
  This is a fantastic topic for a philosophy of science term paper, and your roommate is pointing you toward a very live debate in the field. However, if you commit to the thesis that "the replication crisis is a frequentist problem with a Bayesian solution," you are walking into a trap.

  Your roommate is **technically correct on the narrow statistical point**, but she is **likely overstating the broader sociological conclusion.**

  Here is a sanity check broken down into where she is right, where the argument falls short, and how you can turn this into a nuanced A-grade paper rather than a one-sided polemic.

  ### 1. Where She Is Right: The Likelihood Principle
  Your roommate's core statistical claim is sound. This is the "Grain of Truth."

  *   **The Frequentist Issue:** In Neyman-Pearson (NHST) statistics, the p-value is calculated based on the *sampling distribution*. This distribution depends on the "sampling plan" or stopping rule. If you intend to collect $N=100$ but peek at $N=50$ and stop if $p < .05$, you have altered the sampling space. You have increased the probability of finding a significant result by chance (Type I error inflation). To a frequentist, *intentions matter*.
  *   **The Bayesian Defense:** Bayesian inference obeys the **Likelihood Principle**. It states that all evidence contained in the data regarding the parameters is contained in the likelihood function. How you got the data (whether you stopped at $N=50$ because you planned to, or because the look was pretty) is irrelevant to the posterior distribution. As long as you update on the data you *have*, optional stopping does not invalidate the inference.
  *   **Wagenmakers' Crowd:** You are correct that this is a flagship argument for the "Amsterdam School" (Wagenmakers, Verhagen, et al.). They argue that Bayesian methods are more robust to the flexible data collection practices that are common in psychology.

  **Verdict:** On the specific issue of optional stopping inflating false positives, she is right. Bayesian methods are more robust here.

  ### 2. Where the Argument Falters: Why Bayes Isn't a Panacea
  The replication crisis is not *only* about optional stopping. It is a multi-causal phenomenon. Switching to Bayesian statistics does not solve the following issues:

  **A. "Researcher Degrees of Freedom" (The Garden of Forking Paths)**
  Even if you can't "peek and stop," you can still "peek and model."
  *   **Prior Hacking:** If a Bayes Factor (BF) is inconclusive (e.g., BF = 1.5), a researcher might try a different prior distribution until the BF > 3.
  *   **Data Exclusion:** A researcher can decide that certain outliers "don't belong" and remove them to shift the posterior.
  *   **Covariate Fishing:** You can add or remove control variables until the Bayesian model supports your hypothesis.
  *   **Philosophical Point:** The crisis is partly about *flexibility in analysis*, not just flexibility in *stopping*. Bayesian methods reduce one degree of freedom (stopping) but leave others open. Gelman calls this the "Garden of Forking Paths."

  **B. Publication Bias and Incentives**
  The replication crisis is largely a **sociological** problem, not just a statistical one.
  *   If journals only publish studies with BF > 10 (just as they only published $p < .05$), the "File Drawer Problem" remains.
  *   If researchers are incentivized to produce novel, clean positive results, they will find a way to get them, regardless of the statistic used.
  *   **Crucial Evidence:** Even Wagenmakers and other Bayesian proponents advocate for **Preregistration**. If Bayesian stats alone solved the problem, preregistration (a procedural fix, not a statistical one) wouldn't be necessary. The fact that Bayesians *also* demand preregistration admits that statistics alone are insufficient.

  **C. Low Power and Small Samples**
  Many replication failures occur because the original studies were massively underpowered.
  *   Bayesian methods do not magically create signal from noise. With small sample sizes, Bayes Factors can be insensitive (favoring the null simply because the data is noisy) or, conversely, can provide strong evidence for an effect that isn't there if the prior is misspecified.
  *   Switching the math doesn't fix the fact that psychology often studies weak effects with $N=20$.

  **D. Calibration and Decision Rules**
  There is a philosophical counter-argument from the frequentist side (e.g., Deborah Mayo's *Error Statistics*).
  *   Bayesians care about *degree of belief*. Scientists often care about *error control* (long-run reliability).
  *   If you treat a Bayes Factor threshold (e.g., BF > 3) as a decision rule and *do* use optional stopping, simulation studies show you *can* still inflate false discovery rates in the long run, even if the specific posterior is "valid" by likelihood standards. If science is about producing a literature that is mostly true over time, calibration matters.

  ### 3. Advice for Your Term Paper
  If you write "The Replication Crisis is a Frequentist Problem with a Bayesian Solution," your professors (especially in a Phil Sci seminar) will likely critique you for technological determinism.

  **A Better Thesis:**
  Instead of arguing that Bayesian stats *solve* the crisis, argue that they **mitigate specific inferential vulnerabilities but fail to address the systemic incentives that drive the crisis.**

  **Suggested Structure:**
  1.  **Concede the Statistical Point:** Acknowledge that regarding optional stopping and the Likelihood Principle, the Bayesian framework is superior and does remove a specific source of false positives.
  2.  **Introduce the Sociological Counterpoint:** Argue that the replication crisis is driven by *incentives* (publish or perish), not just *inference*.
  3.  **The "QRPs" Argument:** Show how Questionable Research Practices (QRPs) migrate. If you ban p-hacking, you get "BF-hacking" or "prior-hacking."
  4.  **The Synthesis:** Conclude that while Bayesian methods are a *necessary* improvement for psychological science, they are not *sufficient*. The solution requires a combination of better statistics (Bayes) AND better norms (Preregistration, Open Data, Registered Reports).

  ### 4. Key Philosophers/Papers to Cite
  To make this a Philosophy of Science paper rather than a Stats paper, engage with these perspectives:
  *   **Eric-Jan Wagenmakers:** Read his 2011 paper *"An Agenda for Purely Confirmatory Research"* or his work on the Bayesian t-test. He is the source of your roommate's view.
  *   **Andrew Gelman:** Look for his work on the "Garden of Forking Paths." He is a frequentist (mostly) who argues that *researcher flexibility* is the real enemy, not p-values per se.
  *   **Deborah Mayo:** Her book *Error and the Growth of Experimental Knowledge*. She defends frequentist error statistics on the grounds that science requires *severe testing*, not just belief updating. This provides a great counter-weight to the Bayesian view.
  *   **Ioannidis:** *"Why Most Published Research Findings Are False."* This is the foundational text on the replication crisis. Note that his model includes bias and flexibility, not just alpha levels.

  ### Summary
  Your roommate is right that **optional stopping is less damning in a Bayesian framework.**
  She is wrong that **this dissolves the replication crisis.**

  If you frame your paper as an investigation into *why* the statistical fix isn't enough (touching on the sociology of science, incentives, and the nature of scientific warrant), you will have a much stronger, more defensible, and philosophically richer project. Don't let the stats seduce you into ignoring the science.
