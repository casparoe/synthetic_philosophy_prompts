      *   *Normative Claim:* Trade balances themselves don't matter much in the long run. Wealth is production/capacity, not just the stock of bullion.
      *   *Limitation:* It explains *adjustment*, not necessarily *gains from trade*. It says you *can't* exploit others permanently, but doesn't explicitly prove both sides *gain* from the exchange itself (though Hume implies it).

