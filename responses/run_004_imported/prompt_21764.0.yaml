answer: |-
  Your friend was right to call you out, but you were right to reach for Hume. The conflation of Hume and Ricardo is one of the most common elisions in the history of economic thought, often lumped together under the banner of "classical free trade." However, they are attacking different dragons with different weapons.

  To go back to your friend with a coherent account, you need to distinguish between **macro-monetary stability** (Hume) and **micro-real efficiency** (Ricardo). Hume explains why trade wars over bullion are futile; Ricardo explains why trade barriers are wasteful.

  Here is the breakdown of the two arguments, how they differ, and what each actually licenses.

  ### 1. Hume: The Price-Specie-Flow Mechanism
  **The Target:** Mercantilism (specifically the obsession with the balance of trade).
  **The Mechanism:** Monetary adjustment via price levels.
  **The Core Claim:** A persistent trade surplus is impossible to maintain through policy because money is neutral in the long run.

  In *Of the Balance of Trade* (1752), Hume was not primarily arguing that trade makes nations richer in terms of goods. He was arguing that the Mercantilist definition of wealth (gold and silver specie) was incoherent.

  His logic relies on the Quantity Theory of Money. If a nation runs a trade surplus, gold flows in. This increases the domestic money supply. Assuming the velocity of money and output remain relatively stable, an increased money supply leads to higher domestic prices (inflation). As domestic prices rise, that nation's goods become more expensive to foreigners, and foreign goods become cheaper to locals. Exports fall, imports rise, and the gold flows back out.

  **The "Four-Fifths" Thought Experiment:**
  You reconstructed this well. Hume asks us to imagine wiping out 80% of Britain's money overnight. Prices would collapse. British goods would be incredibly cheap on the global market. Foreigners would rush to buy them, pouring gold into Britain until prices rose back to the international equilibrium level. The money *must* return.

  **What This Licenses:**
  *   **Futility, not Efficiency:** Hume's argument does not strictly prove that trade is *mutually beneficial* in the sense of increasing total output. It proves that trade balances are *self-correcting*. It licenses the policy conclusion that governments should stop trying to manipulate the balance of trade because they *cannot* succeed permanently.
  *   **Monetary Dependence:** This argument **cannot** work in a barter economy. It relies entirely on the link between the stock of money (specie) and the general price level. Without money acting as a medium that influences prices, the mechanism breaks.
  *   **The "Zero-Sum" Rebuttal:** Hume dismantles the idea that one nation's gain is another's loss *regarding bullion*. He shows the system tends toward equilibrium.

  ### 2. Ricardo: Comparative Advantage
  **The Target:** Protectionism (specifically the Corn Laws).
  **The Mechanism:** Reallocation of labor based on opportunity costs.
  **The Core Claim:** Trade increases total global output even if one nation is more productive at everything.

  Ricardo's *Principles of Political Economy and Taxation* (1817) comes 65 years later. He isn't worried about gold flowing in or out. He is worried about labor being used inefficiently.

  His logic relies on relative productivity. Even if Portugal is better than England at making both wine and cloth, Portugal should specialize in the good where its advantage is *greatest*, and England should specialize in the good where its disadvantage is *least*. By specializing and trading, both countries consume beyond their individual production possibility frontiers.

  **What This Licenses:**
  *   **Positive-Sum Gains:** Unlike Hume, Ricardo explicitly proves that trade is **mutually beneficial**. It creates more stuff for everyone. It licenses the policy conclusion that tariffs reduce total wealth by forcing domestic production of goods that could be obtained more cheaply via trade.
  *   **Barter Compatibility:** This argument **does not depend on money**. You can tell the story of the English cloth and Portuguese wine entirely in terms of labor hours exchanged for labor hours. Money is a "veil"; the gains from trade are real resource gains, not monetary phenomena.
  *   **Structural Efficiency:** Ricardo argues that restrictions on trade distort the allocation of capital and labor, reducing the total pie.

  ### 3. Direct Comparison: Answering Your Specific Questions

  Here is how you can frame the distinction to your friend:

  **Q1: Does Hume's mechanism give reason to think trade is mutually beneficial?**
  **A:** Not really. Hume's specie-flow mechanism is an argument about **equilibrium**, not **gain**. It tells us that Nation A cannot permanently exploit Nation B by hoarding their gold. It reassures us that trade won't result in one nation draining the other of all money. However, it doesn't technically prove that exchanging goods makes either nation richer in terms of consumption. It simply proves that the *balance of payments* will take care of itself. Hume believed trade was beneficial (argued in other essays like *Of Commerce*), but the *Price-Specie-Flow* argument specifically targets the feasibility of mercantilist policy, not the efficiency of exchange.

  **Q2: Does Comparative Advantage depend on Hume's monetary dynamics?**
  **A:** No. Ricardo's argument holds perfectly in a barter economy. If England and Portugal traded cloth for wine directly without gold changing hands, the logic of opportunity cost remains identical. In fact, Ricardo treated money as neutral in this context. Hume's argument, conversely, *requires* money. Without a monetary medium affecting price levels, there is no "flow" to correct the balance.

  **Q3: Are they interchangeable defenses of free trade?**
  **A:** No. They defend different versions of "free trade."
  *   **Hume defends a free hand for the Treasury:** He tells the government, "Don't bother trying to subsidize exports or tax imports to accumulate gold; it won't work."
  *   **Ricardo defends a free hand for the Merchant:** He tells the government, "Don't block imports with tariffs; you are forcing your workers to make things inefficiently."

  ### 4. How to Synthesize Them for Your Friend

  You can concede the point to your friend while saving your own argument. The conflation is understandable because the two arguments are complementary layers of the classical case against protectionism.

  *   **Hume clears the ground:** He destroys the Mercantilist fear that imports are "bad" and exports are "good." He shows that imports are necessary to drain excess specie and keep prices competitive. He makes the world safe for trade by showing it isn't a war for finite bullion.
  *   **Ricardo builds the house:** Once Hume has shown that we don't need to fear trade deficits, Ricardo explains why we should actively embrace trade. He provides the positive case for efficiency.

  **The Verdict:**
  Your friend is correct that you slid between two distinct arguments. Hume's argument is **macroeconomic and monetary**; it explains why trade imbalances self-correct. Ricardo's argument is **microeconomic and real**; it explains why specialization increases wealth.

  If your argument with your friend was about whether tariffs can be used to "win" a trade war by accumulating wealth (a mercantilist view), **Hume is the stronger citation.** He proves that attempt is self-defeating.

  If your argument was about whether tariffs reduce overall economic welfare and consumption (a modern efficiency view), **Ricardo is the stronger citation.** He proves that restrictions destroy value.

  You can tell your friend: *"You were right that they are distinct mechanisms. Hume proves we can't exploit others via trade balances (monetary adjustment), while Ricardo proves we shouldn't try to restrict trade because we hurt ourselves (real efficiency). I was using Hume to kill the mercantilist logic, but I should have brought in Ricardo to prove the gains from exchange."*

  That should buy you the next round.
