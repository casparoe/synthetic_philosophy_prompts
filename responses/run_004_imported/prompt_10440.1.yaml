answer: |-
  Thank you all for being here.

  For those of you who know me, you know that I spend my days listening to the hearts of children. I deal in pulses, in breaths, in the tangible, measurable signs of life continuing. My father, as you know, spent his days listening to the structure of arguments. He dealt in validity, in inference, in the invisible architecture that holds truth together.

  I am a pediatrician. He was a logician. And because of that difference, standing here today feels like standing on a fault line. I want to speak to his heart, but I am bound by a promise I made to his mind.

  A month ago, in the hospital, he made me promise that if I spoke today, I would not offer you the usual comforts. He asked for no platitudes about him "watching over us." He asked for no soft-focus assurances that he is in a better place. He spent thirty-five years teaching that clarity is a form of kindness, and that muddying a distinction to make someone feel better is ultimately a betrayal of trust. He did not want comfort that required him to check his brain at the door, even on his way out. And so, he asked me to speak the truth as he understood it, specifically regarding the one question that matters most to us today: whether anything of him remains.

  He held a conviction, carefully qualified, that something survives. But he insisted this was not religious faith. It was a logical inference. He found it in the letters Kurt Gödel wrote to his mother—the same letters many of his colleagues here have read. I am going to try to state his version of that argument exactly, because to get it wrong would be to dishonor him, and to get it right is the only way I know to keep him present.

  The argument begins with the nature of the world. My father believed that the universe is genuinely rational, not brute and arbitrary. It is a cosmos, not a chaos.

  The second premise concerns the human mind. We observe that a human mind takes a lifetime to mature. We spend our first decades merely acquiring the tools to think. We spend our middle decades applying them. It is often only in the later years, when the body begins to fail, that the mind reaches its sharpest, most synthesized capacity for understanding.

  The conclusion follows: If the world is truly rational, it would amount to a standing absurdity for a mind to spend a lifetime barely beginning to develop its capacities, only to be extinguished the moment it starts to get somewhere. A rational world does not waste potential on that scale. Therefore, a rational world gives us real, if modest, grounds to expect that this development continues in some form.

  I need to be precise about what this does not say, because he was always precise about what it did not say. This is not a proof. It does not guarantee a heaven. It does not promise a reunion. It does not tell us *what* survives, or *how*. It simply suggests that for the mind to be cut off at the precipice of its greatest utility would be inconsistent with a rational universe. It offers modest grounds for expectation, not certainty.

  I tell you this, and I risk losing the half of this room who just wants to feel he is at peace. But I also risk losing the half of this room who knows that if I claim this argument proves immortality, I am lying about his life's work.

  I tell you this because this *was* his peace.

  To his colleagues and students: You know he never flattened a difficult concept to make it palatable. He treated this hope with the same rigor he treated a proof in class. He never claimed more than the premises could support.

  To his family, his siblings, and my children: You might hear this and think it sounds cold. But I ask you to look at how he lived. He never stopped developing. Even in retirement, even when his hands shook, he was reading, questioning, refining. He was a man who was just getting somewhere. He was a mind that had finally reached the vantage point he had spent eighty years climbing toward.

  If his argument holds—if the world is rational—then it is the truncation that is the tragedy, not the end. The tragedy would be if all that capacity, all that love, all that hard-won wisdom, was simply deleted because a heart stopped beating. He found comfort not in knowing he would live forever, but in the reasoned hope that a universe capable of producing a mind like his would not treat that mind as disposable trash the moment it became useful.

  He used this argument on me once before. When I was thirteen, and my mother died. He sat me down, with the same gentle seriousness he used in his office hours, and explained that while he could not know she was okay, it was reasonable to hope she was. He did not tell me she was an angel. He told me that the world was not absurd. That was the only gift he could give me then. It was the only gift he wanted from me now.

  So, where does that leave us, standing here in the grief of the eleventh day?

  It leaves us with an uncertainty. I cannot tell you he is here. I cannot tell you he is gone. I can only tell you that he lived a life consistent with the hope that he continues.

  For my children, who are too young for Gödel: Your grandfather was a man who believed that things matter because they fit together. He believed that love, and thought, and effort are not accidents. He believed that you do not build a cathedral of the mind just to watch it crumble the moment the spire is placed.

  For his friends: We miss him. We miss the sharpness of his wit and the depth of his silence.

  For his colleagues: The lecture hall is quieter. The argument is unfinished.

  And for me: I am a doctor. I know that bodies stop. I have held hands as pulses faded. I know the biology of the end. But I am also his son. And I know that he spent a lifetime developing a capacity for love and reason that feels far too substantial to simply vanish.

  If the world is rational, then he is not lost. He is merely beyond the next step of the proof. We cannot see the solution from where we stand. But we can trust the mathematician. We can trust the integrity of the question he asked.

  He asked us not to comfort ourselves with lies. So I will not tell you I know he is safe. I will only say that he gave us grounds to hope he is. And in a world that often feels arbitrary, that modest ground is solid enough to stand on. It is solid enough to grieve from.

  He taught us that truth is the only foundation that doesn't shift. So we stand on that. We honor him by thinking clearly, by loving deeply, and by refusing to believe that the development of a good mind is ever truly wasted.

  Thank you.
