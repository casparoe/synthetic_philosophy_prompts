      *   **The Argument:** If the world is rational (not brute/arbitrary), it is absurd for a mind to spend a lifetime developing capacities only to be extinguished just as it matures. Therefore, a rational world gives *modest grounds* to expect continuation.
      *   **Audience:** Mixed. 50% academics (logic colleagues/students) who know the Gödel reference and will spot errors. 50% family/friends/children who need comfort and connection but don't know logic.
      *   **Tone:** Honest, structured by the argument, grieving but steady, honoring the father's intellectual integrity.
      *   **Time:** ~8 minutes. Average speaking pace is 130-150 words per minute. So, roughly 1000-1200 words.

  2.  **Deconstruct the Argument & Emotional Arc:**
      *   *Premise 1:* The world is rational (not arbitrary).
      *   *Premise 2:* Human minds develop slowly, reaching potential late in life.
      *   *Conclusion:* It would be irrational/absurd for this development to be cut off at the peak. Therefore, continuation is plausible *if* the world is rational.
      *   *Caveat:* This doesn't *prove* immortality. It only suggests it's consistent with a rational universe. It's a hope based on reason, not faith or evidence.
      *   *Emotional Arc:* Acknowledge loss -> Introduce the father's method (logic) -> Present the argument (the core promise) -> Apply it to him (his life's development) -> Acknowledge the limit (we don't *know*) -> Find comfort in the integrity of the question itself.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the grief. Establish the relationship (pediatrician vs. logician). Set the stage for the specific promise.
