answer: |-
  **Title:** The Pedagogy of Blood: Maimonides, Nahmanides, and the Teleology of Sacrifice

  The standard "Sunday School" summary of Maimonides' theory of sacrifice is, as your students noted, deceptively simple: God did not want sacrifices; He tolerated them as a historical concession to an idolatrous mindset. This is the "accommodation theory," primarily articulated in *Guide of the Perplexed* III:32. It is a bold, rationalist move that seeks to preserve divine incorporeality and intellectual purity by treating the sacrificial cult as a divine placebo—a medication for a specific historical ailment rather than a nutritional staple for the soul.

  However, as your seminar has uncovered, this reading collapses under the weight of two formidable objections. First, there is Nahmanides' (Ramban's) textual critique: the Patriarchs offered sacrifices long before the Exodus, without any surrounding Sabian idolatry to wean them from, and God found them pleasing. Second, there is Maimonides' own legal codification: in the *Mishneh Torah*, he unequivocally states that the Messiah will rebuild the Temple and restore the sacrificial order. If sacrifice is merely a concession to ancient primitive psychology, why does it feature in the utopian future?

  While Ramban's objection is textually devastating to a crude reading of the *Guide*, I argue that **Maimonides offers the superior philosophical account of why sacrifices are in the Torah.** Ramban correctly identifies the *primordial nature* of the sacrificial impulse, but he fails to explain the *Sinaitic legislation* as effectively as Maimonides. Maimonides is not arguing that sacrifice is inherently evil, but that its *commandment* was a regulatory act of divine pedagogy. When read in light of his Messianic expectation, Maimonides' theory transforms from a story of divine compromise into a sophisticated theology of religious evolution. Ramban's mysticism preserves the sanctity of the ritual but staticizes religious history; Maimonides preserves the rationality of God and dynamicizes the purpose of law.

  ### The Accommodation Theory and Its Discontents

  To understand the stakes, we must be precise about Maimonides' claim in *Guide* III:32. He does not say God *hated* sacrifice. He says that given the universal religious context of the ancient Near East, where sacrifice was the *only* recognized mode of worship, an immediate abolition would have been psychologically impossible. Maimonides uses the analogy of a prophet who claims to have seen God without angels; the people would not believe him because their conceptual framework requires intermediaries. Similarly, to ask the Israelites to worship God solely through prayer and intellect would have been to ask them to worship in a vacuum.

  Thus, God "redirected" the impulse. He kept the *action* (slaughtering animals) but radically altered the *object* (YHWH alone), the *location* (one centralized Temple), and the *agents* (a specific priestly caste). The goal was to break the association between sacrifice and idolatry, eventually leading humanity toward a higher form of worship.

  Ramban, in his commentary on Leviticus 1:9, strikes at the heart of this historical contingency. He points to Abel, Noah, and Abraham. These figures were not fleeing Egyptian idolatry; they were acting on a spontaneous spiritual intuition. Furthermore, the Torah uses the phrase *rei'ach nichoach* ("a pleasing aroma") to describe God's reception of these offerings. For Ramban, this language indicates an intrinsic metaphysical value in the sacrifice itself. He argues that Maimonides' view reduces the divine commandments to "empty purposes" (*ta'amei ha-mitzvot* as mere utility), implying that God's will is subject to historical circumstances rather than eternal wisdom. For Ramban, sacrifice is a channel for divine influx (*shefa*); it connects the physical and spiritual worlds. To say it is merely a concession is to deny the mystical reality of the Torah.

  ### The Messianic Wrinkle

  The tension sharpens when we turn to Maimonides' *Mishneh Torah*, *Hilchot Melachim* 11:1. He writes that the Messiah will "fight the wars of God, succeed, build the Temple in its place, and gather the dispersed of Israel... and he will prepare the whole world to serve God together." This preparation includes the restoration of the sacrificial service.

  If the *Guide* argues that sacrifice is a ladder to be kicked away once we reach the roof of intellectual worship, why does the *Mishneh Torah* promise the ladder's return in the Messianic era? This is the crux of the problem. If Maimonides believed sacrifices were obsolete for an enlightened humanity, he should have predicted their cessation in the Messianic age. The fact that he predicts their restoration suggests either that he changed his mind, that he is writing exoterically in the *Mishneh Torah* to avoid heresy charges (the Straussian move), or that the accommodation theory is more nuanced than "sacrifices are bad."

  I reject the Straussian evasion. Maimonides was a halakhist; he believed in the eternal validity of the Torah's law. To claim he secretly believed sacrifices would never return is to drive a wedge between his philosophy and his law that he himself did not acknowledge. Instead, we must reconcile the *Guide* and the *Mishneh Torah* by refining the accommodation theory.

  ### The Verdict: Maimonides as Theologian of Religious Evolution

  Ramban wins the argument regarding the *origin* of the sacrificial impulse, but Maimonides wins the argument regarding the *purpose* of the sacrificial law.

  Ramban is correct that the impulse to offer sacrifice is innate to the religious human condition. Abel and Noah did not need to be weaned off idolatry to offer sacrifices; they did so because offering something tangible is a fundamental way humans express devotion. Ramban's error is in conflating this *anthropological constant* with the *Sinaitic legislation*. The question is not "Why did humans sacrifice?" but "Why did the Torah *command* sacrifice in this specific, restricted way?"

  Maimonides' answer remains superior because it accounts for the *regulatory* nature of the Torah. The Torah does not invent sacrifice; it tames it. By restricting sacrifice to one place and one tribe, the Torah prevents the sacrificial impulse from devolving into the chaotic, idolatrous high places of the Canaanites.

  Here is where the Messianic expectation resolves the tension. In Maimonides' view, the Messianic era is not a suspension of natural law or halakha, but the perfection of human knowledge. In the *Guide*, Maimonides explains that the obstacle to pure worship is not sacrifice itself, but the *idolatrous associations* attached to it. In the ancient world, you could not have sacrifice without idolatry. In the Messianic era, however, Maimonides cites Zechariah 13:2: "I will remove the spirit of impurity from the earth."

  When the Messiah comes, the "Sabian context" will be permanently erased. Idolatry will not just be suppressed; it will be intellectually obsolete. In that context, the restoration of sacrifice is not a return to concession, but the restoration of a *purified symbol*. The sacrifice returns not because God needs the blood, but because humanity, even in perfection, requires physical acts to anchor spiritual truths. However, because the idolatrous baggage is gone, the sacrifice is no longer a "weaning" tool; it is a pure language of devotion.

  This makes Maimonides' account more robust than Ramban's for two reasons.

  First, **Maimonides preserves Divine Independence.** Ramban's view that God enjoys a "pleasing aroma" risks anthropomorphism. Even if interpreted mystically, it suggests God is in some way dependent on human ritual action to complete a metaphysical circuit. Maimonides maintains that God is unchanged by human action; the change is entirely in the human worshipper. The sacrifice is for *us*, to discipline our impulses and focus our minds. This is a more philosophically defensible position for a rigorous monotheism.

  Second, **Maimonides accounts for Religious History.** Ramban's view is static: sacrifice was good for Abel, good for Moses, and will be good for the Messiah. It offers no explanation for why the Torah goes to such lengths to restrict and regulate the practice if it is inherently wholesome. Maimonides explains the *restrictions*. If sacrifice were intrinsically perfect (as Ramban suggests), why limit it to one Temple? Why forbid it outside Jerusalem? Maimonides' theory explains the *fences* around the sacrifice. The restrictions exist precisely because the impulse is dangerous and prone to idolatrous corruption. The Torah acknowledges the impulse (validating Ramban's observation of the Patriarchs) but legislates it to prevent corruption (validating Maimonides' accommodation).

  ### Conclusion

  Ramban's critique forces us to abandon the simplistic "Sunday School" version of Maimonides. We cannot say God "never wanted" sacrifice. But we need not abandon Maimonides entirely. Instead, we must recognize that Maimonides is offering a theory of **religious pedagogy**, not just historical contingency.

  The verdict is this: **Maimonides provides the better explanation for why korbanot are in the Torah.** Ramban explains why humans *offer* sacrifices, but Maimonides explains why God *commanded* them. The commandment was a strategic intervention to harness a primordial human impulse and direct it toward monotheism. The Messianic restoration confirms this: once the impulse is fully purified of idolatry, the practice remains as a permanent, physical language of worship, stripped of its concessionary status.

  Ramban's mysticism is comforting, but it leaves the restrictions of the sacrificial law arbitrary. Maimonides' rationalism makes the restrictions necessary and the history meaningful. In a seminar on philosophy, the account that renders the divine law intelligible within the flow of human history must take precedence over the account that relegates it to static mystery. Maimonides does not deny the sanctity of the sacrifice; he explains its necessity in a fallen world and its permanence in a redeemed one.
