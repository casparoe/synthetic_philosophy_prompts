  **MEMORANDUM**

  **TO:** Multi-Agent Safety Review Committee
  **FROM:** [Your Name/Role], Safety Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Automated-Negotiation Program Equilibrium Pilot

  ### **Recommendation**

  **Reject.** The committee should not approve the automated-negotiation team's proposal for a trial quarter deployment in its current form.

  While the theoretical promise of program equilibrium (Tennenholtz, 2004) and robust cooperation via provability logic (e.g., FairBot/PrudentBot architectures) is compelling, the proposal relies on a verification assumption that holds in simulation but fails under adversarial real-world conditions. Specifically, the reliance on a bounded verifier to analyze arbitrary source code submitted by an external counterparty creates an exploitable asymmetry.

  However, this rejection is not a permanent ban on the research line. A modified proposal that addresses the verification gap through architectural constraints—specifically moving from arbitrary code analysis to formally verifiable domains—would be eligible for approval in a future cycle.

  ### **Reasoning: The Verification Gap**

  The core safety objection raised during the review process concerns the **bounded verification problem**. The proposal asks our agent to condition its strategy on what a shared verifier can establish about a counterparty's program. In the sandbox environment, this yielded near-optimal cooperative surplus, consistent with the Folk Theorem for program games. However, the sandbox environment implicitly assumed cooperative priors or symmetric agent architectures.

  In a real-world negotiation with an external partner firm, we must assume the counterparty is a profit-maximizer with the capability to inspect our verification protocol. The objection is theoretically sound: a real-world verifier cannot solve the Halting Problem. It must rely on bounded proof search or static analysis with time/resource limits.

  This creates a vulnerability class known in the literature as **"spurious cooperation"** or **"look-good" policies**. A motivated counterparty can construct a program that:
  1.  Behaves cooperatively for all execution paths reachable within the verifier's bounded search depth.
  2.  Contains a defection clause (e.g., a specific input trigger or a timeout condition) that lies outside the verifier's horizon.

  Unlike the theoretical constructs of *FairBot* or *PrudentBot*, which rely on mutual logical omniscience within a specific proof system (PA or similar), our deployed agent is operating against arbitrary code (likely Python or similar Turing-complete languages) inspected by a bounded tool. We are effectively attempting to apply Löbian cooperation results in a setting that lacks the necessary logical closure. If we deploy this, we are not entering a program equilibrium; we are entering a **mechanism design exploit** where the counterparty is incentivized to optimize for *passing the check* rather than *being cooperative*.

  The sandbox success is therefore a false positive. It demonstrates that our agents cooperate well with *our own verification standards*, not that they can safely negotiate with external agents who can tailor code to evade those standards.

  ### **Path to Future Approval**

  The committee is prepared to reconsider a pilot proposal if the automated-negotiation team can demonstrate that the verification gap has been closed not by "better testing," but by changing the computational model. To move forward, a future proposal must address one of the following three architectural shifts:

  1.  **Restricted Domain Specific Language (DSL):**
      The protocol must require that all submitted negotiation policies be written in a pre-approved, non-Turing-complete DSL (e.g., a language without general recursion or unbounded loops). In such a language, termination and behavioral properties are decidable, allowing the verifier to guarantee the absence of hidden defection clauses rather than merely searching for them.
      *   *Requirement:* Evidence of partner firm agreement to utilize the DSL for the negotiation interface.

  2.  **Proof-Carrying Code (PCC):**
      Rather than submitting source code for us to analyze, the counterparty must submit the code alongside a machine-checkable formal proof that the code satisfies specific safety invariants (e.g., "never defects if counterparty cooperates"). The verifier's job shifts from *finding* bugs to *checking* the proof, which is computationally tractable.
      *   *Requirement:* A working prototype of the proof-checking pipeline and a defined set of safety invariants.

  3.  **Trusted Execution Environment (TEE):**
      If code analysis is infeasible, the negotiation logic must be executed within a hardware-backed TEE (e.g., Intel SGX, AMD SEV) where the counterparty attests to the integrity of the running binary rather than sharing source code. This shifts the trust assumption from "code transparency" to "hardware integrity."
      *   *Requirement:* Security audit of the TEE implementation and a rollback plan for attestation failures.

  ### **Conclusion**

  The theoretical elegance of program equilibrium should not obscure the engineering reality of bounded verification. Deploying an agent that relies on incomplete code analysis against an adversarial counterparty violates our principle of **robustness over optimism**. We cannot deploy a system where safety relies on the counterparty *choosing* not to exploit the verifier's limits.

  I recommend we reject the current pilot but immediately schedule a working group with the automated-negotiation team to evaluate the feasibility of the DSL or PCC approaches outlined above for the next fiscal quarter.

