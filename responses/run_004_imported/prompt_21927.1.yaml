prompt: |-
  So I've fallen back down the anthropics rabbit hole again (rereading old Overcoming Bias posts and the relevant chapters of Bostrom's Anthropic Bias), and I keep hitting the same wall: I can recite "halfer" and "thirder" as labels, but if you asked me to pass an ideological turing test for either side I don't think I'd manage it. A friend from my old meetup group is in the same spot -- he's a halfer by gut instinct, I'm a thirder by gut instinct, and neither of us can actually steelman the other position past the 101 level. So I want to see two people who've actually done the reading have this fight properly.

  Could you write me a dialogue between a committed halfer and a committed thirder arguing about Sleeping Beauty? Skip the version where one just says "the coin's fair, waking up tells you nothing new" and the other says "a third of your awakenings are heads-awakenings, obviously" -- I want them to get into the actual machinery: whether SSA or SIA (or some hybrid) is doing the work for their view, how the reference class problem bites each of them, and what happens to their position once it's forced to answer for the Doomsday argument or Bostrom's presumptuous philosopher. If you can work in the "extreme" version of the case too -- wake her up a million times instead of twice on tails -- i'd love that, since that's the variant that actually moved my intuitions and I want to know if the halfer has a real answer to it or just bites the bullet. Extra credit if one of them raises the idea that this whole fight is really about betting/decision theory rather than credence per se, since ive seen that move made online and never fully understood whether it's a genuine dissolution of the problem or just a dodge.

  Main thing I care about: make it a real fight. Both of them should already know the standard objections to their own view and have a response ready, and they should actually engage with what the other person just said instead of delivering two parallel monologues. It doesn't need to end in agreement -- honestly I'd be a little suspicious if it did -- I just want it to feel like two sharp people who've been having this argument for years.
