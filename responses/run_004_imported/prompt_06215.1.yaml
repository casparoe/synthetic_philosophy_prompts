  You did **not** mess up the algebra. Your intuition that they *should* differ is correct in the general case, but your specific example (linear frontier + disagreement at the origin) is a special case where they mathematically coincide.

  Here is the breakdown of why that happened, followed by a concrete example where they genuinely diverge.

  ### 1. Why they matched in your example
  **The Short Answer:** For any **linear** Pareto frontier with a disagreement point at the **origin** $(0,0)$, the Nash Bargaining Solution (NBS) and the Kalai-Smorodinsky Solution (KSS) will always yield the same outcome.

  **The Geometry:**
  *   **Nash Solution:** Maximizes the area of the rectangle $(x \cdot y)$ under the line. For a straight line $ax + by = c$, the maximum area rectangle always touches the line at its **midpoint** (i.e., at $x = \frac{c}{2a}, y = \frac{c}{2b}$).
  *   **Kalai-Smorodinsky:** Draws a line from the disagreement point $(0,0)$ to the "Ideal Point" $(c/a, c/b)$. This line is $y = \frac{c/b}{c/a}x = \frac{a}{b}x$. The intersection of this diagonal line with the constraint $ax+by=c$ is *also* exactly at the midpoint.

  **The Catch:** If you move the disagreement point $d$ away from $(0,0)$, even a linear frontier will produce different results. However, the most standard way to demonstrate the theoretical difference (IIA vs. Individual Monotonicity) is to use a **curved (strictly convex)** frontier.

  ---

  ### 2. A Concrete Example Where They Differ
  To see the solutions part ways, we need a feasible set with a **curved boundary** (diminishing marginal returns) and **asymmetry**.

  **The Setup:**
  *   **Feasible Set ($S$):** The area under the parabola $y = 10 - x^2$ (with $x, y \ge 0$).
      *   Equation: $x^2 + y \le 10$.
  *   **Disagreement Point ($d$):** $(0,0)$.

  #### Step A: Find the Ideal Point ($a$)
  The Ideal Point $a = (a_1, a_2)$ consists of the maximum possible payoff for each player individually.
  *   **Player 1 Max ($a_1$):** Set $y=0 \Rightarrow x^2 = 10 \Rightarrow x = \sqrt{10} \approx 3.16$.
  *   **Player 2 Max ($a_2$):** Set $x=0 \Rightarrow y = 10$.
  *   **Ideal Point:** $a = (\sqrt{10}, 10)$.

  ---

  #### Step B: Calculate Kalai-Smorodinsky (KSS)
  KSS requires proportional gains relative to the ideal point. We draw a line from $d(0,0)$ to $a(\sqrt{10}, 10)$ and find where it hits the frontier.

  1.  **Slope of the line:** $m = \frac{10 - 0}{\sqrt{10} - 0} = \sqrt{10}$.
  2.  **Equation of the line:** $y = \sqrt{10}x$.
  3.  **Intersect with Frontier:** Substitute $y$ into $y = 10 - x^2$.
      $$ \sqrt{10}x = 10 - x^2 $$
      $$ x^2 + \sqrt{10}x - 10 = 0 $$
  4.  **Solve for $x$ (Quadratic Formula):**
      $$ x = \frac{-\sqrt{10} + \sqrt{10 - 4(1)(-10)}}{2} = \frac{-\sqrt{10} + \sqrt{50}}{2} $$
      $$ x \approx \frac{-3.16 + 7.07}{2} \approx \mathbf{1.95} $$
  5.  **Solve for $y$:**
      $$ y = \sqrt{10}(1.95) \approx \mathbf{6.17} $$

  **KSS Outcome:** $\approx (1.95, 6.17)$

  ---

  #### Step C: Calculate Nash Bargaining Solution (NBS)
  NBS maximizes the product of gains: $(x - 0)(y - 0) = xy$.

  1.  **Objective:** Maximize $P = x(10 - x^2) = 10x - x^3$.
  2.  **First Order Condition:** Take the derivative with respect to $x$ and set to 0.
      $$ \frac{dP}{dx} = 10 - 3x^2 = 0 $$
      $$ 3x^2 = 10 \Rightarrow x^2 = \frac{10}{3} $$
      $$ x = \sqrt{\frac{10}{3}} \approx \mathbf{1.83} $$
  3.  **Solve for $y$:**
      $$ y = 10 - x^2 = 10 - \frac{10}{3} = \frac{20}{3} \approx \mathbf{6.67} $$

  **NBS Outcome:** $\approx (1.83, 6.67)$

  ---

  ### 3. Comparison & Intuition

  | Solution | Player 1 ($x$) | Player 2 ($y$) | Ratio ($y/x$) |
  | :--- | :--- | :--- | :--- |
  | **Kalai-Smorodinsky** | 1.95 | 6.17 | 3.16 (Matches Ideal Ratio) |
  | **Nash** | 1.83 | 6.67 | 3.64 |

  **Why did they part ways?**

  1.  **Kalai-Smorodinsky (Individual Monotonicity):**
      *   KS only cares about the **endpoints** (the Ideal Point). It sees that Player 2 *could* get 10 while Player 1 *could* only get 3.16.
      *   It insists that they split the "potential" proportionally. It ignores how hard it is to get those points (the curvature).
      *   Notice the ratio $y/x = 3.16$ is exactly the ratio of the ideal point $10/\sqrt{10}$.

  2.  **Nash (IIA / Sensitivity to Curvature):**
      *   Nash cares about the **marginal trade-off** at the solution.
      *   Because the frontier is $y = 10 - x^2$, Player 1's payoff diminishes rapidly (quadratically). To gain a little more $x$, Player 2 loses a lot of $y$.
      *   The Nash solution "backs off" on Player 1's share (1.83 vs 1.95) to preserve more total product for Player 2. It accounts for the fact that Player 1's utility is "more expensive" to generate near the optimum than the linear KS line assumes.

  **Summary for your course:**
  *   **Linear Frontier + Origin:** NBS = KSS (Your example).
  *   **Curved Frontier:** NBS $\neq$ KSS.
  *   **The Axiom:** NBS satisfies **IIA** (if you cut off the top of the feasible set but keep the solution, the solution doesn't change). KSS violates IIA (if you cut off the top, the Ideal Point changes, so the proportional line changes, moving the solution). KSS satisfies **Individual Monotonicity** (if the set expands in a way that helps one player's max potential, that player shouldn't lose out), which NBS violates.
