answer: |-
  This is an excellent passage for a history-of-science paper. It captures a pivotal moment where the boundaries of "legitimate" science were being actively negotiated. Sidgwick is not just talking about ghosts; he is talking about the sociology of scientific knowledge.

  Here is a breakdown of the argument, the rhetoric, and the evidentiary strategy, tailored to help you reconstruct the logic for your paper.

  ### 1. Untangling the Grammar: What exactly is the "scandal"?

  The sentence structure is dense because Sidgwick is stacking multiple clauses to define the "present state of things."

  *   **The Main Clause:** "…the present state of things is a scandal to the enlightened age in which we live."
  *   **The Explanatory Clause:** The rest of the passage (starting with "That the dispute…") is an appositive clause explaining *what* the "state of things" actually is.

  Sidgwick lists three conditions that constitute this state, followed by a contradictory reaction:
  1.  **Condition A:** The dispute over these phenomena is still ongoing (unresolved).
  2.  **Condition B:** Many "competent witnesses" claim they are real.
  3.  **Condition C:** Many people are "profoundly interested" in the answer.
  4.  **The Reaction:** "And yet… the educated world, as a body, should still be simply in the attitude of incredulity."

  **The Plain Meaning:**
  Sidgwick is **not** claiming it is a scandal that the phenomena might be fake. He is **not** even definitively claiming it is a scandal that the phenomena are real (note his conditional phrase: *"if only a tenth part… could be shewn to be true"*).

  **The Scandal is Epistemic Negligence.**
  Sidgwick argues that the "scandal" is the behavior of the "educated world" (the scientific establishment). He is claiming that in an "enlightened age" devoted to inquiry, it is shameful that a question supported by credible testimony and possessing huge potential scientific importance is being dismissed *a priori* rather than investigated. The scandal is the **dogmatic skepticism** of the scientific community, not the existence of the spirits.

  ### 2. "Scandal" vs. Neutrality: Is Sidgwick Contradicting Himself?

  You asked whether calling the situation a "scandal" undermines his claim that the Society is "unpledged" and has "no foregone conclusion."

  **The Short Answer:** It is technically consistent, but rhetorically loaded.

  **The Nuanced Analysis:**
  Sidgwick distinguishes between **ontological neutrality** and **methodological bias**.
  *   **Ontological Neutrality:** He is not pledging that ghosts/telepathy *exist*. He maintains the SPR will determine the "nature" of the phenomena later.
  *   **Methodological Bias:** He *is* pledging that the phenomena *deserve investigation*.

  By calling the skepticism a "scandal," he is framing the *dismissal* of the evidence as the irrational position, not the *investigation* of it. In his view, true science follows the evidence wherever it leads. If "competent witnesses" say they saw something, a true scientist investigates. To refuse to investigate is to be dogmatic.

  **Does this give away his side?**
  It suggests he expects the *investigation* to be vindicated, not necessarily the *spiritualists*. He likely anticipates one of two outcomes:
  1.  The phenomena are real (vindication of the witnesses).
  2.  The phenomena are illusions/fraud, but understanding *why* credible people believe them is scientifically valuable (vindication of the SPR's necessity).

  However, for your paper, you can argue that the word "scandal" **politicizes the boundary**. By labeling mainstream skepticism as a "scandal to the enlightened age," Sidgwick is attempting to shame the scientific establishment into granting the SPR legitimacy. He is arguing that *excluding* these topics is what makes one unscientific, rather than *including* them.

  ### 3. "Competent Witnesses": Evidential Work or Appeal to Authority?

  This is the richest point for a history-of-science paper. In modern logic, relying on the character of the witness rather than the reproducibility of the data is often considered an *argumentum ad verecundiam* (appeal to authority). However, in 1882, this was a specific epistemic strategy.

  **Is it doing evidential work?**
  In the context of psychical research, direct physical evidence was (and is) elusive. You cannot put a ghost in a test tube. Therefore, the **testimony** *is* the primary data. Sidgwick cannot point to a specimen; he can only point to people.

  **Is it an Appeal to Authority?**
  Yes, but specifically a **social appeal to credibility**.
  *   **Victorian Context:** In the 19th century, "science" was not just a method; it was a social status. A "competent witness" was not just someone with good eyesight; it was a gentleman, a professor, a judge, or a clergyman. Their "competence" was tied to their social standing and moral reputation.
  *   **The Strategy:** Spiritualism was often associated with women, the working class, and emotionalism. By emphasizing "competent witnesses," Sidgwick is trying to **masculinize and professionalize** the data. He is arguing: *"This isn't hysterical nonsense from a séance room; this is attested by Fellows of the Royal Society."*

  **For your paper:**
  You can argue that Sidgwick is using **social capital to purchase epistemic space**. He knows the phenomena look "pseudoscientific." To counter this, he leans on the reputation of the observers. He is trying to shift the burden of proof: *"If men of science believe this, you cannot dismiss it as superstition without insulting their competence."*

  ### Summary for Your Argument Reconstruction

  If you are reconstructing Sidgwick's argument in your paper, it looks like this:

  1.  **Premise 1:** The "enlightened age" values empirical inquiry and refuses dogmatic dismissal.
  2.  **Premise 2:** There exists a mass of testimony regarding psychical phenomena from witnesses of high social and intellectual standing ("competent witnesses").
  3.  **Premise 3:** If true, these phenomena are of immense scientific importance.
  4.  **Observation:** The "educated world" currently dismisses these phenomena without investigation (attitude of incredulity).
  5.  **Conclusion:** This dismissal is a "scandal" (a failure of scientific duty). Therefore, a new Society (SPR) is required to investigate the matter neutrally, not to prove the phenomena true, but to cure the scandal of neglect.

  **Historical Irony:**
  For your conclusion, you might note the irony that Sidgwick's attempt to bring these topics *into* the fold of science by emphasizing "neutral investigation" ultimately helped cement the boundary *against* them. By creating a specific society for this, it allowed mainstream science to say, "Let the SPR handle that," effectively quarantining psychical research as a separate, lesser category of inquiry. Sidgwick wanted to normalize the phenomena; history shows he helped marginalize them.
