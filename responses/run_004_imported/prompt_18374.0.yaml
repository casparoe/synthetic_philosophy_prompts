answer: |-
  This is a profound intersection of metaphysics, population ethics, and intimate family planning. Your friend is correct: if you accept Kripke's *Necessity of Origin* thesis, the Non-Identity Problem is not merely a logical puzzle but a metaphysical constraint on your decision.

  Here is an analysis of how rigid designators and the necessary *a posteriori* reshape the ethical landscape of polygenic embryo screening (PES), and specifically how they alter the weight of the claim that "the selected embryo will have a better life."

  ### 1. The Metaphysical Constraint: Identity is Fixed at Conception
  Kripke argues in *Naming and Necessity* that proper names are rigid designators—they refer to the same object in all possible worlds where that object exists. Crucially, he argues that a person's origin (the specific sperm and egg) is an essential property.
  *   **The Implication:** Embryo A (derived from gametes $g_1, g_2$) and Embryo B (derived from gametes $g_3, g_4$) are not merely qualitatively different versions of "your future child." They are numerically distinct individuals.
  *   **The Necessary *A Posteriori*:** You discover *a posteriori* (via genetic testing) which gametes constitute which embryo. But once identified, it is *necessary* that Embryo A is Embryo A. There is no possible world where Embryo A exists but originated from $g_3, g_4$.

  **Impact on Ethics:** This cements Parfit's Non-Identity Problem. If you select Embryo A, you cannot say you have benefited Embryo A *compared to the alternative*, because the alternative was non-existence for A (and existence for B). You have not made a specific person better off; you have chosen which person exists.

  ### 2. The Ethical Pivot: Person-Affecting vs. Impersonal Views
  This metaphysical reality forces a choice between two ethical frameworks, and it significantly changes the weight of the "better life" claim.

  #### The Person-Affecting View (PAV)
  *   **Definition:** An act is wrong only if it makes some *particular* person worse off than they would otherwise have been.
  *   **Application to PES:** If Kripke is right, PAV struggles to justify selecting the "healthier" embryo. If you select the embryo with a higher risk of schizophrenia, you have not harmed *that child* (they would not exist otherwise).
  *   **Weight on "Better Life":** Under strict PAV, the claim "Embryo A will have a better life than Embryo B would have" carries **zero moral weight** regarding harm/benefit to the subjects. It is a comparison between two different subjects, not a counterfactual for one subject.

  #### The Impersonal View (Total/Principle of Beneficence)
  *   **Definition:** It is better if people with high welfare exist than people with low welfare, even if they are different people.
  *   **Application to PES:** This view supports screening. Creating Person A (high expected welfare) is better than creating Person B (lower expected welfare).
  *   **Weight on "Better Life":** The claim retains **full normative weight**, but the *mechanism* changes. It is no longer a duty of *care* (beneficence toward a specific patient); it is a duty of *selection* (optimizing the value of the outcome state).

  ### 3. Re-evaluating the "Better Life" Claim
  You asked specifically whether this changes how much weight you should put on the claim: *"The selected embryo will have a better life than the alternative would have had."*

  **The Semantic Shift:**
  Strictly speaking, under Kripkean metaphysics, that sentence is slightly malformed if interpreted as a comparison of welfare for a single subject. It should be read as: *"The life of the person who will exist (A) has higher expected utility than the life of the person who would have existed (B)."*

  **Does it change the weight?**
  1.  **It removes "Guilt" but adds "Responsibility":** If you choose the embryo with lower polygenic scores, you haven't *harmed* your future child. You cannot be accused of violating their rights or making them worse off. However, under the Impersonal View, you may be responsible for a suboptimal outcome. The moral pressure shifts from "don't hurt" to "choose wisely."
  2.  **It weakens the "Maximization" Obligation:** In standard medical ethics (beneficence), we often feel compelled to maximize the health of *the* patient. If the patient is not fixed until selection, the obligation to maximize is diluted. You are not obligated to find the *absolute* best embryo in the universe, only to avoid creating a life not worth living (the "Threshold View") or to satisfy a reasonable standard of selection.
  3.  **It highlights the "Asymmetry":** Many philosophers (following Parfit) argue there is an asymmetry between creating happy people and creating miserable people. We have a strong duty not to create a child who will suffer greatly, but a weak (or non-existent) duty to create a child who will be exceptionally happy. Kripkean identity sharpens this: You aren't denying happiness to Embryo B by not selecting it; you are preventing its existence.

  ### 4. The Probabilistic Complication (PES Specifics)
  There is a tension between Kripke's metaphysical necessity and the epistemic uncertainty of Polygenic Embryo Screening.

  *   **Identity is Binary; Scores are Continuous:** Kripke says identity is fixed by gametes. But PES gives probabilistic predictions (e.g., "20% reduced risk of depression").
  *   **The "Fuzzy" Non-Identity:** If Embryo A and Embryo B differ by only 0.1 standard deviations in a polygenic score, are they ethically distinct enough to trigger the full weight of the Non-Identity Problem?
      *   *Metaphysically:* Yes. They are different people.
      *   *Ethically:* Perhaps not. If the expected welfare difference is negligible, the Impersonal View yields little guidance.
  *   **Implication:** The "better life" claim is empirically fragile. Because PES predicts probabilities, not destinies, the claim "A will have a better life than B" is rarely known to be true. It is usually "A has a higher *expected* welfare."
      *   If you accept the Non-Identity Problem, you must acknowledge that you are gambling with *who* exists, not just *how* they exist. This suggests a precautionary principle: prioritize screening for severe, high-penetrance conditions over marginal gains in traits like height or IQ, where the "better life" claim is weakest.

  ### 5. Practical Synthesis for Your Decision
  How should this actually affect you and your partner?

  1.  **Abandon the "Harm" Narrative:** Do not torture yourselves with the idea that selecting a lower-scoring embryo would "hurt" that child. Metaphysically, it cannot. That specific child only exists if selected. This should alleviate a specific type of moral anxiety.
  2.  **Adopt a "Threshold" rather than "Maximizing" Heuristic:** Since you are choosing *who* exists, rather than improving a fixed subject, the ethical imperative is generally understood to be avoiding lives of severe suffering rather than engineering the "best" possible life. Use PES to screen out significant risks, but feel less pressure to maximize every polygenic score.
  3.  **Acknowledge the "Wide" Person-Affecting Intuition:** Despite the Kripkean logic, most humans (and many ethicists) operate on a "Wide Person-Affecting View." We intuitively feel that choosing the healthier embryo is "better for the child" in a loose, counterfactual sense. It is permissible to retain this intuition as a heuristic, provided you recognize it is metaphorical. It helps maintain the emotional bond of "doing the best for our baby," even if "our baby" is not a rigid designator until the choice is made.
  4.  **The "Necessary A Posteriori" Humility:** Remember that the necessity of origin is known *a posteriori*. You do not know *which* embryo is which until you test, and you do not know *what life* they will have until they live it. The metaphysical certainty of their identity does not grant epistemic certainty about their future welfare. This argues for humility in how much weight you put on the screening results.

  ### Summary
  If Kripke and Parfit are right, the claim "the selected embryo will have a better life" **does not justify the choice via beneficence to that specific child**, because no specific child is the subject of both the actual and counterfactual scenarios.

  However, it **does justify the choice via the impersonal value of creating a person with higher expected welfare.**

  **Recommendation:** Let this metaphysics relieve you of the burden of "harm." You are not harming the unselected embryos. But do not let it relieve you of the responsibility of selection. You are still choosing which world to actualize: one containing Person A (with risks $X$) or Person B (with risks $Y$). The weight of the "better life" claim remains, but it functions as a guide for **world-building**, not **patient care**. Use the screening to avoid severe suffering (where the moral imperative is strongest), but treat marginal gains with skepticism, knowing that you are trading one unique, necessary individual for another based on probabilistic data.
