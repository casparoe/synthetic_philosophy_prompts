prompt: |-
  So I've been down a bit of a Kierkegaard rabbit hole lately, specifically the stuff on 'the public' and the press from The Present Age. Every blog post I find does the lazy 'lol he predicted twitter' take without actually engaging with what he's arguing (the leveling concept, the public as this weird phantom/abstraction with no real existence of it's own, idle talk vs passion, anonymity, etc). I maintain a decent sized open source project with an active discord + forum, and we're constantly arguing about things like: should accounts be pseudonymous or tied to real identities, should we even have upvotes/karma, and how much say random commenters should get vs just letting the maintainers decide. Can you lay out the most important implications of Kierkegaard's actual arguments (not the meme version) for how I should think about these kinds of moderation and platform design calls, and be honest about where the 1846-vs-now analogy just breaks down? don't want a puff piece.
