      *(Refining the "Information" section)*: The prompt asks about maternal cytoplasm. I need to explicitly state why cytoplasm isn't "information" in the same way. Cytoplasm provides the *resources* and the *interpreter*, but DNA provides the *specificity* that varies between individuals while the machinery remains constant.

  7.  **Final Review:** Check word count and flow. Ensure the verdict is unmistakable. (The verdict: Genetic information is real, relational, and indispensable).

  8.  **Final Polish:** Check for clarity on the "Frozen Accident." Crick argued the mapping wasn't chemically determined. If it were, it wouldn't be a code. If stereochemical affinity exists, does it kill the code theory? I will argue no, because the affinity is not sufficient to explain the *entire* system, and the system relies on the *machinery* to enforce the mapping, making it functionally arbitrary even if historically influenced by chemistry.

