      *   *Information:* Distinguish "information about" (correlation) vs. "information for" (function). Tree rings are "about" age. DNA is "for" building proteins. This is the "teleosemantic" view (Millikan, Godfrey-Smith). This solves the "maternal cytoplasm" problem. Cytoplasm is context; DNA is the instruction.
      *   *Reductionism:* Why not just say "chemistry"? Because chemistry is too specific. Code talk allows us to understand mutation, evolution, and engineering (CRISPR). If it were just chemistry, changing a base would be like changing a bond angle. But it's like changing a letter in a sentence. The *meaning* changes, not just the physical state.
