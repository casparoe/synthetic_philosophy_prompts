          *   DNA: Active instruction. The cellular machinery "reads" it to construct the organism.
          *   Key distinction: *Teleology/Function.* DNA is information because it was selected *to be interpreted*.
      *   **Section 3: Addressing the Reductionist Challenge.**
          *   Couldn't we just describe the chemistry?
          *   Argument: Chemical description misses the *generalizability* and *evolvability*. A code allows for variation without changing the medium.
          *   Therefore, "information" is an indispensable explanatory category.
      *   **Conclusion:**
          *   Restate Thesis.
          *   Final Verdict: The genome is a code, not because of magic, but because evolution built a machine to treat it as one. The metaphor is ontologically grounded in biological function.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the patient's perspective (from the prompt). Acknowledge the seduction of the metaphor. State the thesis clearly: It is a robust code, not a metaphor.
