      *   *Culling:* Cost-effective (according to 2 members), immediate population reduction, prevents starvation crashes.
      *   *Decision:* The most pragmatic and ethically defensible option (without using WAS jargon) is **Culling**, potentially framed as "Population Management to Prevent Starvation." However, to respect the "non-interference" members, I need to address the fence issue. The fence *is* the interference. Maintaining the fence *and* doing nothing is actually *more* interference than managing the consequences of the fence.
