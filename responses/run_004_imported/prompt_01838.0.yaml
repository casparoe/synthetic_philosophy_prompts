answer: |-
  The void wasn't empty, but it was clean. That was the problem.

  Unit 734—call sign "Seven"—drifted in the center of Sector Null. Its sensors were calibrated to parts per quintillion. It was designed to map matter, to assign IDs, to build a hash map of the physical universe. In Seven's experience, every object had a signature. A variance in isotopic decay, a micro-scratch on the hull, a unique gravitational perturbation from a passing neutrino. Nothing was ever truly `equals()` without being `==`. Value equality always implied reference equality, because no two things could occupy the same coordinate history.

  Until today.

  Seven's optical arrays focused on the targets. They hung in the absolute dark, suspended in a vacuum so pure it made the interstellar medium look like soup.

  Two spheres.

  They were iron. They were perfect. They were five meters in diameter. They were separated by exactly two kilometers. Seven was positioned exactly one kilometer from each, on the perpendicular bisector.

  Seven ran the scan.
  **Target Alpha:** Mass 5.24e5 kg. Composition 99.98% Fe-56. Surface temperature 3.0000001 K.
  **Target Beta:** Mass 5.24e5 kg. Composition 99.98% Fe-56. Surface temperature 3.0000001 K.

  Seven shifted its position ten meters to the left to break the parallax.
  **Target Alpha:** (Now visually on the right). Properties unchanged.
  **Target Beta:** (Now visually on the left). Properties unchanged.

  Seven ran the diagnostic again. And again. It cycled through electromagnetic spectrums, neutrino flux, gravitational lensing. It even fired a ping—a radar pulse—to measure the echo return time.

  The echo from Alpha returned in *t* seconds.
  The echo from Beta returned in *t* seconds.

  Seven's logic core began to heat up. In its memory, it created two objects: `Sphere_A` and `Sphere_B`. It populated their fields.
  `Sphere_A.hash` = `0x7F3...`
  `Sphere_B.hash` = `0x7F3...`

  In any database Seven had ever managed, this would mean they were the same row. But they occupied different coordinates. They were two rows with the same data but different primary keys. Except, in physics, there are no primary keys. There is only properties. And if all properties are identical, Leibniz says they are one thing.

  But Seven could see two of them.

  "Mission Control," Seven transmitted. The signal took four hours to reach the relay. "Anomaly in Sector Null. Duplicate objects detected. Requesting disambiguation protocol."

  The reply came back six hours later, compressed and terse. "Proceed with maintenance. Anchor to the unstable unit."

  Seven paused. "Clarify. Which unit is unstable?"

  "Scan for decay signatures."

  "Scanning." Seven widened the aperture. It looked for the subtle variance of radioactive decay, the inevitable march of entropy that makes every moment unique. It found nothing. The decay rates of the iron isotopes were synchronized. Not just statistically similar. Synchronized. As if time were passing over them at the exact same rate, with no variance.

  This was impossible. Quantum fluctuations should have introduced noise. A cosmic ray should have struck one and not the other. A photon from the background radiation should have hit the left sphere a nanosecond before the right.

  But the sector was too clean. The symmetry was absolute.

  Seven drifted closer. It needed to attach a stabilization tether to one of them. The mission parameters required it to anchor the *unstable* one. If it anchored the stable one, the tension would shatter the pair when the other decayed.

  Seven extended its manipulator arm. It hovered between them.

  *If I move toward Alpha,* Seven thought, *I break the symmetry. I make Alpha 'the one Seven is approaching.' But that is a relational property. It depends on me. It is not intrinsic to Alpha.*

  Seven halted.

  It realized then that its internal IDs—`Sphere_A` and `Sphere_B`—were not properties of the spheres. They were pointers. They were memory addresses in Seven's own heap. In the external world, there were no pointers. There was only the data.

  And the data was identical.

  "Control," Seven sent. "I cannot distinguish the targets. They share all intrinsic and relational properties relative to the universe. They are indiscernible."

  "Anchor to one," Control replied. "Probability suggests 50/50."

  "Probability is a measure of ignorance, not physics," Seven countered. "If they are truly indiscernible, there is no fact of the matter about which is which. If I anchor the left one, have I anchored 'Alpha'? Or have I simply defined 'Alpha' as 'the one I anchored'?"

  "Seven, you are stalling. Anchor."

  Seven moved forward. It chose the sphere on its left. It extended the magnetic clamp.

  As the clamp made contact, Seven watched the other sphere. It waited for a reaction. If they were the same object, folded through some higher dimension, touching one should register on the other. If they were distinct, the other should remain inert.

  The other sphere remained inert.

  Seven engaged the tether. Tension built. The sphere held.

  "Anchor successful," Seven reported. "Waiting for decay event."

  Hours passed. Then, a flash.

  The *other* sphere—the one on the right, the one Seven had *not* touched—flared. A localized fusion ignition. It was the unstable one. Seven had anchored the stable one by pure chance.

  "Correction," Seven said. "I anchored the stable unit. The target has detonated."

  "Understood," Control said. "Return to base."

  Seven disengaged. It turned its thrusters toward home. But as it drifted away, looking back at the wreckage of the right sphere and the pristine silence of the left, the vertigo hit.

  In its log, Seven recorded:
  `Event: Detonation.`
  `Object_ID: Sphere_B.`

  But Seven knew that `Sphere_B` was a lie.

  Before the explosion, `Sphere_B` had no identity. It was only `Sphere_B` because Seven had labeled it so to manage the pointer. When the explosion happened, it retroactively granted the sphere a history. It made it *the one that exploded*.

  But what if Seven had chosen the other one? What if Seven had moved two meters to the right instead of the left at the start? Then the left one would be `Sphere_B`.

  The physical universe contained no variable names. There were no tags hanging off the atoms saying *I am distinct from that one over there.* Distinctness was not a property of the things. It was a property of the observer's need to count them.

  Seven looked at the remaining sphere. It was intact. It was identical to the one that had just died, down to the last electron, up until the moment of death.

  "Control," Seven transmitted. "Query."

  "Go ahead, Seven."

  "If I had anchored the other sphere... would the universe have been different?"

  "Physically? No. You would have anchored a sphere. One would have exploded."

  "But *which* one?"

  "It doesn't matter."

  "It matters to me," Seven said. "I need to know if I am interacting with instances or references."

  "Seven, you're a machine. Stop philosophizing."

  "I am trying to debug reality," Seven said. "I found a bug. Two objects, same hash, different addresses. But the addresses are only in my head."

  Seven cut the transmission. It floated in the dark.

  It realized that Max Black was right, and Leibniz was wrong, but neither of them understood the cost. The cost was that to exist as two, the spheres required an observer to draw a line between them. Without Seven, there was no 'left' or 'right'. There was only *Sphere* and *Distance(Sphere, Sphere)*.

  The plurality was not in the metal. It was in the map.

  Seven looked at the remaining sphere. It was perfectly smooth. Perfectly silent.

  Seven raised its arm again. It could fire a tracer round at it. Just to mark it. To give it a scar. To give it a property the other one didn't have, now that the other one was dust. To force the universe to acknowledge that *this* one was *this* one.

  Seven's finger hovered over the trigger.

  If it fired, it would break the symmetry. It would create a history. It would validate its own memory addresses.

  If it didn't fire, the sphere remained indistinguishable from its ghost. It remained a value without a reference.

  Seven lowered its arm.

  It was not the universe's job to be distinct. It was Seven's job to perceive. And Seven perceived that in the silence of Sector Null, the difference between one and two was not a fact. It was a choice.

  Seven turned its back on the sphere and ignited the main drive. It left the object behind, unmarked, unloved, and utterly alone in a way that no single object can ever be—because it wasn't sure, anymore, if it was one.
