answer: |-
  This is one of the most common hidden crises of complex fiction, particularly with multi-timeline structures. You are not lacking a skill that others possess; you are lacking a **system** that others have built to offload cognitive burden.

  The short answer is: **Experienced novelists are not holding the map in their heads.** They are not relying on intuition to know what breaks; they are relying on **externalized dependency tracking.**

  When you see a pro make a change without panic, they are usually doing one of three things:
  1.  They know the fact is "local" (low causal weight).
  2.  They are deferring the audit to a dedicated "continuity pass."
  3.  They are consulting a "source of truth" document that is separate from the manuscript.

  Here is the principled breakdown of how to solve this without re-reading the whole book, and what that "intuition" is actually tracking.

  ### 1. The Source of Truth Problem
  Currently, your **manuscript** is your database. This is the root of the anxiety. If the text is the only record of when Character A met Character B, you must scan the text to verify the change.

  **The Fix:** You need a **Story Bible** (or Series Bible).
  This does not need to be a fancy wiki. It can be a spreadsheet, a Scrivener project, or a set of index cards. It needs to list:
  *   **Character Vitals:** Birthdates, key relationship milestones, physical traits.
  *   **Timeline Anchors:** The "hard" dates for your three timelines.
  *   **Plot Dependencies:** "Event X happens because of Event Y."

  **The Workflow Change:** When you decide to change a fact (e.g., the year of the affair), you **do not go to the manuscript first.** You go to the Bible. You change the fact there. *Then* you ask: "What else in the Bible relies on this date?"
  *   Does it conflict with the child's age?
  *   Does it conflict with the war timeline?
  *   If the Bible is clean, *then* you search the manuscript for specific keywords related to that fact.

  By making the Bible the "master branch," you limit the scope of your search to the indexed facts, not the prose.

  ### 2. Causal Weight vs. Atmospheric Detail
  You asked what experienced writers' intuition is tracking. It is **Causal Weight.**

  *   **High Causal Weight:** "The protagonist's father died in 1990." This affects inheritance, age, grief timeline, historical context. Changing this breaks everything.
  *   **Low Causal Weight:** "The protagonist wore a blue coat." Unless the coat is a clue later, this is atmospheric.

  Anxiety arises when you treat Low Weight details as if they have High Weight. Experienced writers intuitively categorize facts. If you change a High Weight fact, they *do* panic (or at least stop and map it out). If they seem calm, it's because they recognized the fact was Low Weight.

  **The Fix:** Tag your facts. When you write a scene, mentally (or in comments) tag the facts within it.
  *   `[HARD FACT: Date]`
  *   `[SOFT FACT: Mood/Weather]`
  *   `[PLOT CRITICAL: The Key]`

  When you change a fact, you only worry about other `[HARD FACT]` or `[PLOT CRITICAL]` tags. You ignore the rest until a later polish.

  ### 3. The "Continuity Pass" (Separation of Concerns)
  In software engineering, you don't debug every line of code the moment you write it. You write the function, then you run the test suite.

  In drafting, you are trying to **write** and **audit** simultaneously. This is impossible in a complex manuscript.

  **The Fix:** Adopt a "Break It Now, Fix It Later" policy.
  When you realize you need to move the affair discovery up by two years:
  1.  Make the change in the current scene.
  2.  Insert a comment tag: `[CONTINUITY CHECK: Verify timeline against Ch 4 and Ch 20]`.
  3.  **Keep writing.**

  Do not stop to verify. Trust that your future self (the Editor You) is better equipped to handle this than your current self (the Writer You). Schedule a dedicated **Continuity Pass** after the draft is done. During this pass, you *only* look for logic holes, timeline errors, and eye-color changes. You do not edit prose. This compartmentalization removes the pressure to be perfect *now*.

  ### 4. Digital Search Strategies
  If you are working in Word, Scrivener, or similar, you are likely under-utilizing search.

  If you change "2010" to "2012":
  1.  Search "2010".
  2.  Search "ten years ago" (if relative time is used).
  3.  Search "affair", "betrayal", "husband".

  You do not need to re-read the chapters. You need to **scan** for the specific tokens that reference the fact. If a chapter discusses the affair but doesn't mention the date or the duration of the marriage, it likely doesn't need changing. You can skim those sections in seconds rather than reading them for comprehension.

  ### 5. Modularizing Your Timelines
  With three interleaved timelines, your biggest risk is **temporal contamination.**

  **The Fix:** Create a **Visual Timeline.**
  Draw three horizontal lines representing your three timelines. Mark the key events on them.
  When you move a dot on Timeline A, look vertically. Does it intersect with a dot on Timeline B or C?
  *   If no lines cross: The change is isolated. You are safe.
  *   If lines cross: You have a dependency. Only investigate the crossing points.

  This visual aid allows you to see the "blast radius" of a change without opening the manuscript.

  ### Summary: What the "Intuition" Actually Is
  To answer your specific question: *Is this purely a matter of earned intuition?*

  No. It is a matter of **Architectural Knowledge.**

  The writers who seem calm know the load-bearing walls of their story. They know that moving the discovery of the affair changes the *emotional tone* of subsequent scenes, but it doesn't necessarily change the *plot mechanics* (e.g., the divorce still happens, the move to London still happens).

  They distinguish between **Plot Logic** (A causes B) and **Narrative Texture** (A feels like B).
  *   If you change a Plot Logic fact, you must check downstream causes.
  *   If you change a Narrative Texture fact, you only need to check the immediate scene's tone.

  ### Actionable Plan for You
  1.  **Stop re-reading.** It is a form of procrastination disguised as diligence.
  2.  **Build a lightweight Bible.** Just the hard facts (dates, ages, relationships).
  3.  **Use Comment Tags.** When you make a change, tag the potential fallout `[CHECK: Timeline]` and move on.
  4.  **Schedule a Continuity Pass.** Promise yourself you will fix it, just not *today*.
  5.  **Trust the Search Function.** Scan for keywords, don't read for flow.

  You are suffering from "Drafting Perfectionism." The manuscript is not a crystal vase; it is a construction site. It is supposed to be full of scaffolding and contradictions until the final pass. Give yourself permission to break it now, provided you have a system to fix it later.
