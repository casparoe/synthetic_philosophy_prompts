      *   **Tight Coupling:** The plot might be too interdependent (Rube Goldberg machine vs. modular scenes).
      *   **Cognitive Load:** Holding a complex world in working memory is impossible without aids.
      *   **Perfectionism:** The fear that *any* inconsistency breaks the illusion.

  4.  **Develop Principled Solutions (The "How-To"):**
