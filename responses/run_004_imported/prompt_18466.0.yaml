prompt: |-
  I'm a PhD student in bioethics doing a clinical ethics practicum, which gives me a non-voting seat on my hospital's ethics consultation service. The service is drafting a documentation policy and has split over a genuine disagreement: currently, a consult note states only the recommendation (e.g., 'withdrawing artificial nutrition would not wrong this patient') without the supporting reasoning, since the treating team is expected to trust the consultant's judgment much as they would a radiologist's reading of a scan. A minority of consultants, including our newest hire, argue this analogy fails for moral verdicts specifically -- this looks to me like a version of what philosophers call the problem of moral testimony -- since deferring to someone else's bare say-so, without grasping why the act is permissible, seems to leave the physician unable to act from her own understanding, which many think matters both for the moral worth of her choice and for whether she'll get the next, slightly different case right on her own. Others on the service reply that demanding a full ethical argument in every note is unworkable given caseloads of six or more consults a day, and that plenty of ordinary moral deference -- to parents, mentors, clergy -- seems perfectly fine. Please draft the short memo I'll bring to next week's meeting, recommending a specific documentation standard -- bare verdict, full reasoning, or some conditional policy in between -- with an implementation timeframe, and take the epistemic objection to moral deference as seriously as the workload objection rather than letting the latter win by default.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** PhD student in bioethics, clinical ethics practicum, non-voting seat on hospital ethics consultation service (ECS).
      *   **Task:** Draft a short memo for next week's meeting regarding a documentation policy dispute.
      *   **The Dispute:**
          *   *Current Practice/ Majority View:* Notes state only the recommendation (bare verdict). Analogy: Radiology report. Rationale: Trust, efficiency (high caseload).
          *   *Minority View (including new hire):* Notes must include reasoning. Analogy: Moral testimony problem. Rationale: Physicians need to understand *why* to act autonomously/morally and handle future cases.
      *   **Constraints/Requirements:**
          *   Recommend a specific standard (bare, full, or conditional).
          *   Include an implementation timeframe.
          *   Take the epistemic objection (moral testimony) seriously (don't just let workload win).
          *   Take the workload objection seriously (don't just let theory win).
          *   Tone: Professional, academic yet practical, suitable for a clinical setting.
          *   Length: "Short memo."

  2.  **Deconstruct the Ethical/Philosophical Issues:**
      *   *Moral Testimony:* The idea that deferring to moral experts without understanding the reasons undermines moral agency or autonomy. In a clinical context, the treating physician retains ultimate responsibility. If they just follow orders without understanding, are they morally complicit if it goes wrong? Do they learn?
      *   *Radiology Analogy:* Radiologists provide data/interpretation, but the treating MD integrates it. However, radiology is descriptive/factual (mostly). Ethics is normative. A "verdict" without reasons is harder to integrate into a care plan than a "fracture detected."
      *   *Workload:* 6+ consults/day is high. Writing detailed philosophical arguments for each is unsustainable and might delay urgent care.
      *   *Middle Ground:* Is there a way to provide *enough* reasoning to satisfy the epistemic concern without writing a dissertation? Yes: Key ethical principles, relevant facts, and the bridge between them.

  3.  **Determine the Recommendation:**
      *   *Option A (Bare Verdict):* Reject. Ignores the valid philosophical concern about moral agency and learning. Risks "black box" ethics.
      *   *Option B (Full Reasoning):* Reject. Ignores the valid practical concern about workload and timeliness.
      *   *Option C (Conditional/Structured Middle Ground):* **Select this.** A "Structured Rationale" approach. Require the *elements* of reasoning (principles, key facts, trade-offs) without requiring a full narrative argument. This respects the physician's need to understand the "why" (addressing moral testimony) while keeping it template-driven for efficiency (addressing workload).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly (recommendation on documentation policy).
      *   **Context:** Briefly acknowledge the disagreement (Efficiency vs. Moral Agency/Epistemic Value).
      *   **Analysis:**
          *   Acknowledge the Radiology Analogy's limit (Normative vs. Descriptive).
          *   Acknowledge the Workload reality (6+ consults).
          *   Synthesize: The goal is *moral transparency* without *narrative bloat*.
      *   **Recommendation:** "Structured Rationale" policy.
          *   Must include: Recommendation, Key Ethical Principles, Salient Clinical Facts, Balance of Burdens/Benefits.
          *   No need for: Academic literature review, exhaustive philosophical derivation.
      *   **Implementation:** Phased approach. Pilot period, training, review.
      *   **Closing:** Offer to help draft templates.

  5.  **Refining the Tone:**
      *   Needs to sound like a PhD student (philosophically literate) but also a team member (pragmatic).
      *   Avoid overly dense jargon, but use terms like "moral agency," "normative," "epistemic."
      *   Ensure the "non-voting" status is respected (advisory tone, not dictatorial).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 6 consults a day realistic for detailed notes?
      *   *Fix:* Emphasize *structured* fields or bullet points, not prose. This makes it fast.
      *   *Critique:* Did I address the moral testimony problem?
      *   *Fix:* Explicitly mention that treating physicians need to own the decision. The note facilitates that ownership.
      *   *Critique:* Is the timeframe realistic?
      *   *Fix:* Suggest a 3-month pilot.

  7.  **Final Polish:** Check word count and formatting. Ensure the distinction between "verdict" and "reasoning" is clear. (The resulting memo below follows this structure.)

  8.  **Final Output Generation:** (Proceed to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Consultation Service (ECS) Committee
  **FROM:** [Your Name], PhD Candidate & Ethics Practicum Fellow
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Documentation Standards for Ethics Consults

  **Purpose**
  This memo offers a recommendation regarding the ongoing dispute over ECS documentation standards: specifically, whether consult notes should record only the final recommendation (the "bare verdict") or include supporting ethical reasoning.

  **Analysis of Competing Concerns**
  The committee faces a tension between two valid obligations:
  1.  **Epistemic & Moral Agency:** As the minority view suggests, the "radiology analogy" is limited. Unlike a radiological finding (descriptive), an ethics recommendation is normative. If treating physicians defer to a bare verdict without grasping the underlying justification, they risk acting without full moral understanding. This undermines their moral agency and hinders their ability to navigate similar gray areas in future cases independently.
  2.  **Clinical Utility & Workload:** As the majority view notes, our volume (6+ consults/day) makes exhaustive philosophical argumentation unsustainable. Documentation must be timely to remain clinically relevant.

  **Recommendation: A "Structured Rationale" Standard**
  I recommend adopting a **conditional policy** that requires a *Structured Rationale* rather than a narrative essay or a bare verdict. This approach treats the consult note not as an academic paper, but as a tool for moral transparency that facilitates the treating team's ownership of the decision.

  **Policy Specifics:**
  Every consult note must include the Recommendation *plus* the following four bulleted elements:
  *   **Salient Facts:** The specific clinical/social facts driving the ethical weight.
  *   **Key Principles:** The specific ethical norms at play (e.g., "Autonomy vs. Beneficence," "Best Interest Standard").
  *   **The Bridge:** One to two sentences explaining how the principles apply to the facts to yield the recommendation.
  *   **Alternatives Considered:** Briefly note viable alternatives that were rejected and why.

  *Example:* Instead of "Withdrawal is permissible," the note reads: "Withdrawal is permissible (Recommendation) because the patient's prior directive prioritizes cognitive awareness over biological life (Fact/Principle), and current PVS status precludes awareness (Bridge). Continued ventilation maintains biological function but imposes burdens inconsistent with patient values (Alternatives/Burdens)."

  **Implementation Timeframe**
  *   **Phase 1 (Months 1-2):** Pilot the Structured Rationale template. I will draft a dot-phrase/template for the EMR to minimize typing time.
  *   **Phase 2 (Month 3):** Review. The committee will assess if the template adds significant time per consult and whether treating teams report better clarity.
  *   **Phase 3 (Month 4):** Formal adoption or adjustment.

  **Rationale**
  This standard respects the *problem of moral testimony* by ensuring the treating team sees the "why," enabling them to act from understanding rather than blind deference. Simultaneously, it respects the *workload objection* by utilizing templates and bullet points, avoiding the need for prose-heavy argumentation.

  I am happy to draft the EMR templates for discussion at next week's meeting.
