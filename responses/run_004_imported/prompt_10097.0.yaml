  My brother and I grew up in the same messed up house, but he clawed his way out through pure willpower and now everyone in the family treats him like a hero while treating me like I'm just weak for not pulling myself together the same way. Im not a philosophy person, I just can't shake the feeling that something is off about that. Once at a family dinner when I pushed back a little, my uncle jumped in with "well actually science says the brain isn't totally determined anyway, theres random quantum stuff happening in neurons, so people really do choose freely," which shut me up at the time but still felt like a dodge. Even granting him the quantum stuff, is there still something wrong with him getting all the credit and me getting all the blame for how we turned out, and if so, what's actually wrong with my uncle's argument?
