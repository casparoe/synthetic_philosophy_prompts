answer: |-
  **MEMORANDUM**

  **TO:** Governance Council
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Income Pooling and External Ventures

  **Recommendation**
  I recommend we adopt a **Tiered Contribution Model** effective immediately. Under this policy, outside earnings are pooled at 100% up to a threshold of 3x the house median income. Earnings above this threshold are pooled at 50%, with the remainder retained by the earner. This policy applies retroactively to the current fiscal quarter and establishes a standing precedent for all future high-income ventures (startups, book deals, consulting) undertaken by residents.

  **Rationale: Preserving the Insurance Function**
  Our bylaw was founded on a specific moral technology: mutual insurance against career risk. The mechanism only functions if the pool remains robust during both downturns and windfalls. If we grant a clean exemption, we establish a precedent that success constitutes an exit ticket from the social contract. This creates an adverse selection problem: the fund supports members when they are vulnerable, but loses their contributions the moment they become net positive. Over five years, this would hollow out the fund and betray the members currently taking risks (the grad students, the unemployed researchers) who joined relying on the promise of "all earnings above stipend."

  However, a rigid 100% pool on outlier income (6x median) risks treating the house as a confiscatory state rather than a voluntary partnership. We must balance solidarity with sustainability.

  **Engaging the Nozick Objection**
  Housemate A's reliance on Nozick's "Wilt Chamberlain" argument is philosophically provocative but legally inapplicable. Nozick's critique targets *state-enforced* patterned distribution imposed on non-consenting citizens. It argues that liberty upsets patterns. In our case, the pattern was chosen *via* liberty. We voluntarily signed a contract agreeing to a patterned distribution (equality) in exchange for security. By entering the house, Housemate A waived the specific entitlement Nozick defends. She cannot claim a right to the fruits of voluntary exchange when she pre-committed to sharing those fruits as a condition of membership.

  However, while her *rights-based* objection fails, her *pragmatic* objection holds weight. Nozick's deeper insight is that ignoring individual agency and effort undermines the system's stability. If the cost of participation becomes too high for high-earners, they will leave, and the community loses the very talent it aims to nurture. The 100% pool risks punishing the exact "career risk" the house is meant to support. If the penalty for a successful startup is total confiscation of upside, rational actors will either hide income or avoid the house entirely. The Tiered Model acknowledges this: it honors the contract (the bulk is still pooled) while respecting the agency that generated the surplus (a portion is retained).

  **The "House Support" Counter-Argument**
  The council members arguing for full pooling note that Housemate A utilized house resources (feedback, audience, credibility). This is correct and strengthens the case for *some* pooling, but it does not justify *total* pooling. The house provided seed capital (social and intellectual), but Housemate A provided the labor and execution. In venture terms, the house holds an equity stake, not 100% ownership.

  If we rule that using house networks mandates 100% income surrender, we create a perverse incentive: members will hide their projects until they are profitable enough to move out. The Tiered Model formalizes the house's "equity" claim. By pooling the first 3x median, the house recoups its investment in her development and supports the community. By allowing her to keep 50% of the surplus, we acknowledge her specific labor and prevent the house from becoming a drag on high-impact careers.

  **Precedent and Future Application**
  This decision sets a clear precedent for the next decade of the house's operation.
  1.  **Definition of Income:** All revenue generated by a resident, regardless of source, is subject to the Tiered Model.
  2.  **Venture Scaling:** If a resident's venture grows to require full-time focus outside the house, they may transition to "alumni status," paying a fixed tithe rather than pooling income, preventing the need to hide success.
  3.  **Risk Incentive:** This structure signals to current and future residents that the house rewards successful risk-taking, rather than merely insuring against failure.

  **Conclusion**
  We are not a state, but we are not merely roommates. We are a voluntary association with a redistributive mission. Nozick reminds us that voluntary exchanges matter, but our contract reminds us that we agreed to share the results. The Tiered Model respects both truths. It upholds the bylaw's intent without transforming our mutual aid pact into a penalty on competence. I urge the council to vote for the Cap.
