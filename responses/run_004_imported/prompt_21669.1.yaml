answer: |-
  Your intuition is correct: your friend is mistaken. While Arrow's Impossibility Theorem is one of the most important results in social choice theory, it does not prove that interpersonal utility comparisons (IUCs) are incoherent or impossible. In fact, the logic of the theorem runs in the opposite direction of her claim.

  The flaw in her argument lies in confusing the **assumptions** of the theorem with its **conclusions**. Arrow did not prove that IUCs are impossible; he proved that if you **assume** IUCs are impossible (by restricting the informational input to ordinal preferences), then consistent aggregation is impossible.

  Here is a precise breakdown of where her argument goes wrong and how modern economics actually handles this issue.

  ### 1. The Assumption vs. The Conclusion
  Arrow's theorem addresses the following question: *Can we construct a social welfare function that aggregates individual preferences into a social ranking, given a specific set of constraints?*

  One of the critical constraints (often implicit in the formal setup) is the **informational base**. Arrow's framework assumes that the only information available to the social planner is the **ordinal ranking** of alternatives by each individual.
  *   **Ordinal:** I prefer A to B.
  *   **Not Cardinal:** I do not know *how much* I prefer A to B.
  *   **Not Interpersonally Comparable:** I do not know if my preference for A is stronger than your preference for A.

  Arrow proved that if you restrict yourself to this thin slice of information, you cannot satisfy a set of reasonable conditions (Pareto efficiency, Non-dictatorship, Unrestricted Domain, and Independence of Irrelevant Alternatives).

  Your friend interprets this as: "Since aggregation fails, IUCs must be nonsense."
  The correct interpretation is: "Since aggregation fails **without** IUCs, we need more information (like IUCs) to aggregate successfully."

  ### 2. Amartya Sen and the "Informational Enrichment"
  The economist who most definitively settled this debate is Amartya Sen (who won the Nobel Prize largely for this work). Sen demonstrated that Arrow's impossibility result is not a metaphysical truth about human welfare, but a result of **informational poverty**.

  Sen showed that if you relax Arrow's informational constraints and allow the social welfare function to access more data—specifically, if you allow for **cardinal utility** and **interpersonal comparisons**—the impossibility vanishes.
  *   If you allow **level comparability** (we can compare how well off Person A is vs. Person B), you can justify egalitarian social welfare functions.
  *   If you allow **unit comparability** (we can compare the *size* of utility gains/losses across people), you can justify utilitarian social welfare functions (summing utilities).

  Therefore, Arrow's theorem does not rule out IUCs; rather, it highlights that IUCs are **necessary** if we want to escape the impossibility result and make coherent social choices. To use your friend's logic against her: If IUCs were truly incoherent category mistakes, then social choice would be logically impossible. Since we do make social choices (and economists model them), the coherence of IUCs is a prerequisite for solving Arrow's paradox, not a victim of it.

  ### 3. Ordinalism vs. Cardinalism
  Your friend's argument relies on a strict **ordinalist** view of utility, which was dominant in economics during Arrow's time (the mid-20th century). In that framework, utility is just a numerical representation of a ranking; saying "My utility is 10 and yours is 5" means nothing other than "I prefer my bundle to yours." Under strict ordinalism, IUCs are indeed meaningless because the scale is arbitrary.

  However, modern welfare economics and policy analysis generally operate with a **cardinal** conception of utility (or "well-being"). When an economist says, "A hundred dollars means more to a poor person," they are usually relying on:
  1.  **Diminishing Marginal Utility of Income:** An empirical/psychological claim that the satisfaction gained from an extra dollar decreases as total income rises.
  2.  **A Specific Social Welfare Function:** An ethical judgment that society should maximize a function where the welfare of the poor is weighted more heavily.

  This is not a "category mistake." It is an explicit ethical and empirical model. The economist is not claiming to measure "utils" with a ruler; they are claiming that there is a defensible basis for comparing welfare impacts across individuals, often grounded in observable behavior or philosophical principles (like prioritarianism).

  ### 4. Why Economists Aren't Being "Sloppy"
  Your friend suggests economists are sloppy for ignoring Arrow. In reality, welfare economists are quite careful about this. When they make policy recommendations involving redistribution, they are implicitly or explicitly invoking a **Social Welfare Function (SWF)** that incorporates IUCs.

  For example, a standard utilitarian SWF sums individual utilities: $W = U_1 + U_2 + ... + U_n$.
  To calculate this, you *must* have cardinal, comparable utility. Economists who use this are not violating Arrow; they are working in a framework that **relaxes Arrow's informational constraints** to make the problem solvable. They acknowledge that this requires ethical assumptions (e.g., "one person's utility gain counts the same as another's"), but they do not regard those assumptions as incoherent.

  ### 5. The Philosophical Dimension
  Finally, your friend's claim that IUCs are a "category mistake" is a philosophical stance (logical positivism/behaviorism) that was popular in the 1930s-50s but has largely fallen out of favor.

  To say IUCs are incoherent is to say we cannot meaningfully discuss whether a child starving in one country is suffering more than a adult with a mild headache in another. While measuring this precisely is difficult, claiming it is *logically incoherent* to make the comparison renders most moral reasoning impossible. Arrow's theorem is a mathematical result about aggregation rules, not a metaphysical proof about the privacy of consciousness.

  ### Summary for Your Next Dinner
  You can tell your friend that she has inverted the logic of the theorem.
  1.  **Arrow's Theorem:** "If you forbid interpersonal utility comparisons, you cannot aggregate preferences consistently."
  2.  **Her Claim:** "Because you cannot aggregate preferences consistently, interpersonal utility comparisons are forbidden."
  3.  **The Reality:** Because we *need* to aggregate preferences (to make policy), and Arrow shows we can't do it with ordinal data alone, we **must** allow interpersonal utility comparisons (or other enriched information) to proceed.

  Arrow didn't close the matter on IUCs; he opened the door to showing why they are essential for coherent social choice. Your economists friends aren't being sloppy; they are using the enriched informational base required to solve the very problem Arrow identified.
