      *   *The "Impossibility":* The impossibility arises *because* the information base is restricted to ordinal, non-comparable preferences.
      *   *The Friend's Error:* She is treating the *assumption* of the theorem (no IUCs) as the *conclusion* of the theorem. Arrow doesn't prove IUCs are impossible; he proves that *without* IUCs (and other info), you can't aggregate consistently.
      *   *Cardinal vs. Ordinal:* IUCs require cardinal utility (or at least unit comparability). Arrow's framework is ordinal.
      *   *Sen's Contribution:* Amartya Sen is the key figure here. He showed that if you relax Arrow's informational constraints (allow IUCs), the impossibility disappears.

  4.  **Formulate the Counter-Argument:**
