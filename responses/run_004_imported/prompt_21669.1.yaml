      *   **The "Informational Base":** Arrow's result is about the insufficiency of ordinal data. If you add cardinal data (IUCs), the theorem no longer applies (or rather, the impossibility vanishes).
      *   **Sen's Critique:** Cite Amartya Sen. He demonstrated that allowing IUCs resolves Arrow's paradox. This implies IUCs are coherent enough to be used as inputs.
