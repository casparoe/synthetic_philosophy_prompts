          *   *Assessment:* Solid legal theory point (textualism vs. intentionalism).
      *   **(3) Noor's Rebuttal:** Euphemisms work backwards. Clauses only make sense as protections for slaveholders. Everyone at the Convention knew this. Neutral wording = disguise, not silence allowing better reading.
          *   *Assessment:* Strong historical/contextual argument. Challenges the "neutral" claim.
      *   **(4) Callum's Counter:** Meaning $\neq$ Intention. What matters is what words commit the country to. Hold future generations to stated promises, not private hopes.
          *   *Assessment:* Philosophical strength. Focuses on the normative power of the text for the future.
      *   **(5) Noor's Counter:** Proves too much. Same words read as pro-slavery by courts (Prigg, Dred Scott). "What words commit" = what they enforce. Douglass's reading is wishful, not principled.
          *   *Assessment:* Strong realist argument. Points out the disconnect between text and legal reality of the time.
      *   **(6) Callum's Counter:** Conflates meaning with enforcement. Collapsing two is Garrison's mistake in reverse (letting bad rulings = bad law).
