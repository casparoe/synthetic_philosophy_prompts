      *   **Body 3: The Underlying Logic.** Why does he think this? The "Commerce Civilizes" thesis. He believes trade reduces conflict. Empire is bad *because* it disrupts free trade, not because dominion is inherently wrong.
      *   **Conclusion:** Deliver the verdict. "Anti-imperialist" is a modern label that doesn't fit. He is a **Liberal Imperialist** or a **Reformist**. The verdict: It overstates his radicalism to call him an anti-imperialist.

