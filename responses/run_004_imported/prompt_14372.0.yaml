          *   Underlying assumption: Commerce civilizes. Trade softens manners. Empire *could* be good if run correctly (i.e., not mercantilist).

  3.  **Synthesize and Evaluate:**
      *   *The Core Tension:* Smith hates *mercantilism* (state-managed trade for gold/monopoly). He loves *natural liberty* (free markets). Empire in the 18th century was inextricably linked to mercantilism (Navigation Acts, monopolies). Therefore, Smith attacks the *economic engine* of empire.
