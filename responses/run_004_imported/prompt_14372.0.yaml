prompt: |-
  So I'm taking a history of economic thought class this semester, and after the Adam Smith week my friend Priya and I ended up arguing about it for like two hours at a bar afterward (poor bartender). The fight was basically: is Smith secretly an anti-imperialist, or is that a total modern reading-in? She kept pointing to the obviously damning stuff in the Wealth of Nations — the line about the "savage injustice of the Europeans" toward the natives of the East and West Indies, his whole demolition of the East India Company as a monopoly that made the Bengal famine worse, and that famous bit near the end of the book where he says Britain doesn't actually have an empire in America, just "the project of an empire," and should drop it if the colonies won't cover their own costs. I kept arguing that's cherry-picking — the same guy proposes just giving the American colonies proportional seats in Parliament instead of ever floating independence, still thinks colonial trade is fine once you strip out the mercantile monopolies, and never once calls for abolishing slavery even though he spends a bunch of time explaining why its economically irrational. We never got anywhere and it's been bugging me for days.

  Can you settle this for me (or at least give me ammo)? Write an essay that goes through Smith's actual scattered remarks on colonies and empire across the Wealth of Nations — not just the most quotable anti-empire lines, and not just the counterexamples either — and then actually reaches a verdict: on balance, should Smith be read as a genuine early critic of empire, or does that overstate how radical he really was? Please don't cop out with a "well, both sides have a point" ending, I want an actual position defended, even if it's something qualified like "critic of the mercantile system but not of empire as such."
