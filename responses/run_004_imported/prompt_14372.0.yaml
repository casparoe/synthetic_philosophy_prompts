      *   *Slavery:* Need to be careful here. In *Lectures on Jurisprudence*, he is clearer on the immorality. In WN, he focuses on cost. I should mention this distinction but focus on WN as requested.
      *   *Tone:* Keep it engaging. "The Bartender's Verdict."

  6.  **Final Polish:** Check quotes and specific references (Book IV, Chapter 7 is the main battleground). Ensure the distinction between "Mercantilism" and "Empire" is clear. (Mercantilism = policy; Empire = political structure). Smith hates the policy, tolerates the structure if the policy changes.

