  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* Weil thinks multiplying parties doesn't help? *Correction:* Make sure to emphasize that for Weil, the damage happens *inside* the member's mind (collective passion), not just in the legislative outcome. Even a balanced system of corrupt minds yields corrupt results.
      *   *Check:* Did I address the "Anglo-Saxon" point clearly? *Correction:* Frame it as Weil admitting Rousseau's "loose associations" might be okay, but arguing modern politics isn't that anymore.
