      *   *Section 1: The Diagnosis (Math vs. Morality).* Rousseau = math of voting. Weil = psychology of belonging.
      *   *Section 2: The Remedy (Balance vs. Abolition).* Why Rousseau's "multiply factions" fails for Weil. (Pressure is internal, not just external).
      *   *Section 3: The Anglo-Saxon Distinction.* This shows Weil is diagnosing *ideological* parties, not just interest groups. This is the "different disease" angle.
      *   *Section 4: Truth and Conscience.* Weil's Platonism/Christianity vs. Rousseau's Civic Republicanism.
