      *   *Distinction:* "Indifferent kinds" (rocks, quarks) vs. "Interactive kinds" (people, patients).
      *   *Mechanism:* Classification $\rightarrow$ Self-knowledge/Agency $\rightarrow$ Changed Behavior $\rightarrow$ Revision of Classification (by experts).
      *   *Focus:* The *ontology* of the kind itself. The "kind" is not stable. The knowledge and the object of knowledge co-evolve.
