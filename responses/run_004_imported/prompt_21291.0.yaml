answer: |-
  Here is a precise comparison of the two frameworks, structured for use as a sidebar. It highlights the conceptual lineage while isolating the specific philosophical innovations Hacking introduced.

  ***

  ### Sidebar: From Labeling to Looping
  **How Ian Hacking's "Looping Effect" extends (and differs from) classic Labeling Theory**

  It is intuitive to read Ian Hacking's "looping effect" as a philosophical refinement of the sociological "labeling theory" advanced by Howard Becker and Edwin Lemert in the 1960s. Both frameworks reject the idea that diagnostic categories are neutral stickers placed on pre-existing conditions. Both argue that the act of naming changes the named. However, Hacking insisted his project was distinct. While labeling theory explains how social control shapes a **career**, Hacking's looping effect explains how knowledge shapes **ontology**—what kind of thing actually exists.

  Here is where the theories overlap, and where Hacking's apparatus diverges.

  #### 1. The Overlap: The Rejection of Passive Objects
  Both theories agree on the fundamental mechanism of feedback.
  *   **Labeling Theory:** Posits that "deviance is not a quality of the act the person commits, but rather a consequence of the application by others of rules and sanctions" (Becker). When an authority labels someone (e.g., "criminal," "addict"), that person is stigmatized, excluded from conventional groups, and often internalizes the label, leading to "secondary deviance" (Lemert).
  *   **Looping Effect:** Agrees that classification is not passive. When a person is classified (e.g., "autistic," "grieving disorder"), they become aware of the classification. This awareness alters their self-conception and behavior.
  *   **Common Ground:** In both views, the classification is a causal force. You cannot treat the label as a mere description; it is an intervention.

  #### 2. The Divergence: Social Status vs. Scientific Kinds
  The crucial difference lies in what is being changed by the label.
  *   **Labeling Theory (Sociological):** Focuses on the **individual's trajectory**. The label changes the person's social opportunities and self-identity, often trapping them in a "deviant career." The category itself (e.g., "criminal") is treated as relatively stable; the problem is the unjust or consequential application of that category to the person.
  *   **Looping Effect (Philosophical):** Focuses on the **stability of the category itself**. Hacking distinguishes between "indifferent kinds" (like quarks or tigers, which do not care how we classify them) and "interactive kinds" (human beings, who do). Because people react to how they are classified, the *definition* of the category must constantly shift to track the changing behavior.
      *   *Example:* In labeling theory, a boy labeled "troubled" acts out more because he is treated as troubled. In Hacking's looping effect, the very concept of "troubled child" evolves over decades because children, parents, and teachers learn the concept and adjust their behaviors, forcing psychologists to rewrite the diagnostic criteria. The "kind" is a moving target.

  #### 3. Agency and Knowledge
  Hacking places a heavier emphasis on the **agency of the classified** than classic labeling theory does.
  *   **Labeling Theory:** Often portrays the labeled individual as a victim of social structure. The label is imposed from above (by police, teachers, doctors), and the individual reacts, often negatively, due to stigma and exclusion.
  *   **Looping Effect:** Portrays the classified individual as an active participant in the science. People read about their disorders, join support groups, advocate for inclusion (or removal) of diagnoses in the DSM, and adjust their lives to fit (or resist) the model. Hacking calls this "making up people." The classified are not just suffering under a label; they are co-authoring the reality of the label through their interaction with it.

  #### 4. Why Hacking Needed a New Concept
  If labeling theory already established that names have consequences, why did Hacking develop the "looping effect"?

  1.  **To Challenge Scientific Realism:** Labeling theory is a critique of social control. Hacking's goal was a critique of **classification in science**. He wanted to show that psychiatric categories cannot be "discovered" in the same way viruses are, because the object of study (the human) changes in response to the microscope.
  2.  **To Avoid "Social Constructivism" Pitfalls:** Hacking wanted to avoid the claim that disorders are *merely* social constructs (i.e., "it's all in our heads"). He acknowledged that the suffering is real, but argued that the *way* the suffering exists is historically dynamic. The looping effect allows for the reality of the pain without accepting the permanence of the category.
  3.  **The Historical Dimension:** Labeling theory is often synchronic (looking at the process of labeling an individual). Hacking's approach is diachronic (looking at how a category evolves over history). He asks: Why did "multiple personality disorder" explode in the 1980s and then vanish? Labeling theory explains why a specific patient stayed ill; looping effects explain why the *diagnosis itself* changed shape and prevalence over time.

  **Summary for the Reader:**
  Labeling theory warns us that diagnosing a patient can harm their life by stigmatizing them. Hacking's looping effect warns us that diagnosing a population can change the **nature of the illness itself**, turning psychiatry into a historical engine that generates new ways of being human, rather than a static map of fixed disorders.
