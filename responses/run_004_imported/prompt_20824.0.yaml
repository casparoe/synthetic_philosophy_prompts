      *   *Thesis:* Parfit's framework destabilizes the binary logic of traditional AD enforcement (valid/invalid) but fails to provide a clear algorithm for decision-making. It shifts the burden from "following the rule" to "weighing competing interests," potentially increasing moral distress without offering a solution. It validates Dresser's concerns but doesn't solve Dworkin's problem.

