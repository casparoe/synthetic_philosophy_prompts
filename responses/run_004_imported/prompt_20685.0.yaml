prompt: |-
  So I'm on this small internal committee at work (mid-size logistics company, maybe 800 people) that decides who gets our twice-a-year "Integrity Champion" award. It's basically a certificate plus a $2,000 bonus, but people take it seriously since it gets read out at the all-hands. The policy describing it is like four sentences long and says it goes to whoever reports serious wrongdoing "in good faith, for the right reasons, and at some personal risk to themselves." Nobody ever bothered defining "for the right reasons," because up until now it's always been obvious.

  This cycle's nominee, Dana, reported that her department head was falsifying safety inspection logs, which turned out to be completely true and pretty serious -- it led to real fixes before anyone got hurt. The wrinkle is that Dana was also next in line for that same department head's job, and she got it about a month after he was pushed out. In her nomination statement she says she came forward purely out of concern for the warehouse crew's safety. A couple people on the commitee who've worked with her for years say, off the record, that she'd wanted that promotion for ages and this was obviously her opening. There's genuinely no way for us to settle what was actually going on in her head -- all we've got is her statement, the timing, and a track record that's honestly pretty good.

  Half the committee thinks the motive question is a red herring: the report was true, the danger was real, and turning it in is exactly what someone who cared about the crew would've done, so it doesn't matter what else was mixed in -- she acted on a reason that genuinely justifies the act, full stop. The other half thinks that if the promotion was really doing the motivational work, handing her an "integrity" award basically launders politics as principle, and teaches the next ambitious person exactly the wrong lesson about how to get ahead here. I keep flip-flopping, but I think we're circling around a version of a debate philosophers actually have, about whether acting "for the right reasons" is about the reasons that explain why you did something or just the reasons that would justify doing it. Can you write the short memo I'd bring to our meeting next week? I want it to recommend whether we grant the award, deny it, or grant it with some kind of modification, and I want the reasoning to be something the half of the committee that loses this vote could still walk away thinking was fair.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Internal committee at a mid-size logistics company (800 people).
      *   **Task:** Decide on the "Integrity Champion" award (Certificate + $2,000 bonus, announced at all-hands).
      *   **Policy:** Reports serious wrongdoing "in good faith, for the right reasons, and at some personal risk."
      *   **The Case:** Dana reported her Dept Head for falsifying safety logs (true, serious, fixed). She got his job a month later. She claims safety concern. Colleagues claim ambition. Motive is unknowable.
      *   **The Conflict:** Committee is split 50/50.
          *   Side A: Outcome/Justification matters (she did the right thing, motive is irrelevant).
          *   Side B: Motive matters (if ambition drove it, it's not integrity, it's politics).
      *   **Philosophical Angle:** Acting "for the right reasons" (motivating reasons vs. justifying reasons).
      *   **Goal:** A short memo recommending a decision (Grant, Deny, or Modify) with reasoning that feels fair to the losing side.

  2.  **Deconstruct the Philosophical/Practical Tension:**
      *   *Integrity* usually implies internal consistency and moral uprightness, not just correct outcomes.
      *   *Whistleblowing* is inherently risky. Encouraging it is crucial for safety/compliance.
      *   *Mixed Motives:* Human beings rarely act from pure altruism. Ambition and ethics often overlap.
      *   *Precedent:* Denying the award might chill future reporting (people fear their motives will be psychoanalyzed). Granting it without comment might look cynical (rewarding backstabbing).
      *   *Policy Language:* "In good faith, for the right reasons." This is the crux. "Good faith" usually means "honest belief," not "pure heart." "Right reasons" is the ambiguous part.

  3.  **Evaluate the Options:**
      *   *Option 1: Deny.*
          *   Pros: Upholds a strict definition of integrity. Avoids rewarding ambition disguised as ethics.
          *   Cons: Punishes truth-telling. Creates a "chilling effect." Requires mind-reading (which the prompt says is impossible). Looks like retaliation against a successful whistleblower.
      *   *Option 2: Grant Unconditionally.*
          *   Pros: Strong signal that reporting wrongdoing is safe and rewarded. Focuses on objective facts (logs were falsified).
          *   Cons: Ignores the "right reasons" clause. Risks cynicism if the ambition angle becomes public knowledge.
      *   *Option 3: Grant with Modification/Nuance.*
          *   Pros: Acknowledges the complexity. Validates the act without necessarily canonizing the soul. Balances the need for safety reporting with the definition of integrity.
          *   Cons: Might feel like a "consolation prize."

  4.  **Develop the Recommendation:**
      *   *Decision:* **Grant the award.**
      *   *Why?* Because in a corporate compliance context, you *cannot* incentivize mind-reading. If you start denying awards based on suspected hidden motives, nobody will report anything ever again. The "personal risk" clause is clearly met (reporting a boss is risky). The "good faith" clause is met (the report was true). The "right reasons" clause is the sticking point.
      *   *The Philosophical Pivot:* We need to redefine "right reasons" from "purely altruistic motivation" to "reasons aligned with company values." Safety is a company value. Ambition is not necessarily a disqualifier if the *action* aligns with values.
      *   *Addressing the Losing Side (The Skeptics):* To make this fair to the "Motive Matters" group, the memo needs to acknowledge their concern explicitly. It shouldn't dismiss the ambition angle. It should frame the decision as a *policy necessity* rather than a moral absolution of Dana. We are rewarding the *act* of integrity because we can verify the act, not the *state of grace* of the actor.
      *   *Modification:* Perhaps tweak the citation language. Instead of "For unwavering moral purity," use "For courageous adherence to safety standards." Or, add a note to the policy for next time to clarify "right reasons" means "alignment with company values" rather than "absence of self-interest."
      *   *Wait, a better modification:* Grant the award, but use the announcement wording carefully. Don't over-praise her character; praise the *action*. Also, recommend a policy clarification for the future to prevent this ambiguity. This shows the committee is learning, not just rubber-stamping.

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Recommendation:** Clear and upfront (Approve).
      *   **Summary of Case:** Brief recap.
      *   **The Core Dilemma:** Acknowledge the split (Outcome vs. Motive).
      *   **Reasoning (The "Fairness" Argument):**
          1.  *Verifiability:* We can verify facts, not thoughts. Denying based on speculation sets a dangerous precedent.
          2.  *Incentive Structure:* We need to encourage reporting. Mixed motives are human. If we require sainthood, we get silence.
          3.  *Definition of Integrity:* In a business context, integrity is acting according to rules/values despite risk. Whether she also wanted the job is secondary to the fact that she prioritized safety over loyalty to a corrupt boss.
      *   **Addressing the Concerns:** Acknowledge the "politics as principle" fear. Mitigate it by focusing the citation on the *safety outcome*, not her *character*.
      *   **Future-Proofing:** Recommend updating the policy language to clarify "right reasons" = "alignment with company values," removing the ambiguity for next time.

  6.  **Refining the Tone:**
      *   Needs to be professional, empathetic, and decisive.
      *   Avoid philosophical jargon (keep it practical).
      *   Ensure the "losing side" feels heard. The key is validating their concern about cynicism while explaining why the alternative is worse for the company.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is granting it too easy?
      *   *Fix:* Emphasize that this is a *functional* decision, not necessarily a moral endorsement of Dana's soul. The memo should explicitly state that we are not ruling on her internal state, but on the objective value of her action.
      *   *Critique:* Does this address the "right reasons" policy text?
      *   *Fix:* Interpret "right reasons" as "reasons consistent with company policy" (safety) rather than "exclusive altruism."
      *   *Critique:* How to handle the $2,000?
      *   *Fix:* It stays. It's part of the award.
      *   *Critique:* How to handle the announcement?
      *   *Fix:* Suggest specific wording that focuses on the safety win, not the person's virtue.

  8.  **Final Polish:** Check length (short memo), clarity, and ensure the philosophical distinction (motivating vs. justifying reasons) is translated into business logic. (Decided to keep the philosophy implicit rather than explicit to keep it business-appropriate, but the logic rests on that distinction).

      *(Self-Correction on the "Modification" idea)*: Instead of modifying the award (which looks like a demotion), modify the *policy* for the future. This allows the current decision to stand firm while acknowledging the ambiguity was a problem.

      *(Final Decision)*: Recommend granting the award, but with a specific focus in the citation and a policy review recommendation. This bridges the gap.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Integrity Champion Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Cycle 4 Nominee (Dana)

  **Recommendation**
  I recommend we **grant** the Integrity Champion award to Dana, but with specific language in the citation and an immediate follow-up to clarify our award policy for future cycles.

  **The Core Tension**
  Our split stems from how we interpret "for the right reasons."
  *   **View A:** The "right reason" is the *justification* for the act (safety compliance). Since the report was true and vital, the criteria are met regardless of internal motivation.
  *   **View B:** The "right reason" is the *motivation* behind the act (altruism vs. ambition). If personal gain was a driver, awarding "Integrity" risks cynicism and rewards political maneuvering.

  Both views are valid. However, in a corporate compliance context, View A must prevail for three practical reasons that should satisfy both sides of the committee.

  **1. Verifiability vs. Speculation**
  We can verify facts: logs were falsified, safety was at risk, Dana reported it, she faced personal risk, and the issue was resolved. We cannot verify motives. If we deny an award based on off-the-record speculation about ambition, we establish a precedent where future whistleblowers fear their internal thoughts will be psychoanalyzed. This creates a chilling effect on reporting. To the committee members concerned about "laundering politics," I argue that denying the award based on unprovable motive is a greater risk to our culture than granting it.

  **2. Mixed Motives are Human**
  Requiring pure altruism for "Integrity" sets a bar no human can clear. A person can be ambitious *and* principled. In this case, Dana's ambition and the company's safety goals aligned. By choosing to report her boss rather than ignore the logs to curry favor, she prioritized company values over loyalty to a superior. That is the functional definition of corporate integrity, even if she also benefited.

  **3. Incentive Structure**
  Our goal is to encourage the *behavior* of reporting wrongdoing. If we signal that you only get recognized if you have "pure" motives, people will stay silent. If we signal that acting on the right values is what counts, we get more safety reports. We are rewarding the *act* of integrity, not canonizing the *soul* of the actor.

  **Mitigating the Risks (Addressing View B)**
  To address the concern that this looks like rewarding ambition, I propose two modifications:

  1.  **Citation Wording:** The all-hands announcement should focus strictly on the *action and outcome*, not her character.
      *   *Instead of:* "For her unwavering moral compass..."
      *   *Use:* "For taking the difficult step of reporting safety violations that protected the warehouse crew."
      *   *Why:* This validates the safety win without making claims about her internal purity that colleagues might dispute.
  2.  **Policy Clarification:** We must update the four-sentence policy immediately. "Right reasons" is too vague.
      *   *New Language:* "...reports serious wrongdoing in good faith, **with actions aligned to company values,** and at some personal risk."
      *   *Why:* This shifts the metric from unknowable *motivation* to observable *alignment*, preventing this specific debate from recurring.

  **Conclusion**
  Denying Dana punishes a verified act of courage based on unprovable suspicion. Granting the award reinforces that safety violations will be reported, even when it's difficult. We can acknowledge the complexity of human motive without letting it paralyze our compliance incentives.

  I ask we vote to approve the award under these conditions.
