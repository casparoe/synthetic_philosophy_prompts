answer: |-
  This is a classic debate in the philosophy of art, and your memory serves you well. You are thinking of **Nelson Goodman's** argument from his 1968 book *Languages of Art*. Your friend is essentially channeling **Alfred Lessing**, who wrote the famous paper "Art and Forgery" in 1965 specifically to argue the position she is holding.

  The Van Meegeren case is the perfect stress test for this. Van Meegeren forged Vermeers so convincingly that he was celebrated as a discoverer of a "new" Vermeer period. When he confessed (partly to avoid treason charges for selling Dutch cultural heritage to Nazis), the art world felt betrayed. But why? If the paint on the canvas was beautiful yesterday, why was it trash today?

  Here is the breakdown of the Lessing vs. Goodman debate, the specific "future perception" argument you remembered, and an evaluation of who wins.

  ---

  ### 1. Alfred Lessing: The Aesthetic Irrelevance of History
  Your friend's position is the Lessing position. It is intuitive, democratic, and relies on a specific definition of "aesthetic."

  **The Core Argument:**
  Lessing argues that we must distinguish between the **aesthetic value** of the object and the **artistic achievement** of the creator.
  *   **Aesthetic Value:** Resides entirely in the perceptible qualities of the object *right now*. If two paintings are perceptually indistinguishable, they possess the same aesthetic value.
  *   **Artistic Achievement:** Resides in the history of production (originality, innovation, courage).

  **The "Snobbery" Charge:**
  Lessing admits that the original Vermeer is more *valuable* historically and financially, and that Vermeer is a greater *artist* than Van Meegeren. But he insists this is not an *aesthetic* judgment. To say the forgery is aesthetically inferior is to fetishize the pedigree. It is like saying a recording of a violin concerto sounds worse once you find out the violinist was lip-syncing. If the sound waves are identical, the music is identical.

  **Conclusion:** A forgery is a moral fraud (lying about provenance), but not an aesthetic failure. If you can't see the difference, there is no aesthetic difference.

  ---

  ### 2. Nelson Goodman: The Aesthetic Relevance of Authenticity
  Goodman's argument is subtler and more cognitive. He rejects the idea that aesthetic experience is just passive sensory reception (like a camera taking a photo).

  **The Core Argument:**
  Goodman argues that **authenticity is aesthetically relevant** because knowing the history of a work's production changes how we perceive it. He makes three key moves:

  1.  **Aesthetic Properties are Cognitive:** Aesthetic qualities aren't just "red," "blue," or "curved." They include things like "vigorous," "delicate," "derivative," "bold," or "strained." You cannot perceive a painting as "derivative" unless you know it came *after* another painting. Therefore, knowledge of history is a prerequisite for perceiving certain aesthetic properties.
  2.  **Categorization Changes Perception:** Seeing a painting *as* a Vermeer puts it in a different category than seeing it *as* a Van Meegeren. When you look at a Vermeer, you are looking at the source of a style. When you look at the forgery, you are looking at an attempt to mimic that style. Even if they look identical, the *experience* of looking is different because the cognitive context is different.
  3.  **The "Future Perception" Argument (The one you remembered):** This is Goodman's killer move. He argues that just because we cannot see a difference *now* does not mean there *is* no difference.
      *   Because the original and the forgery have different causal histories (one was painted in 1665, one in 1930), there *must* be physical differences, however microscopic (brushstroke pressure, chemical composition, hesitation in the hand).
      *   Therefore, the claim that they are "perceptually indistinguishable" is always provisional.
      *   **Crucially:** Knowing one is a forgery trains us to look for those differences. It alters our perceptual habits. By treating them as different, we learn to see them differently. If we treat them as identical, we blunt our ability to ever find the differences.

  **Goodman's Conclusion:**
  There is an aesthetic difference between the original and the forgery, even if we can't articulate it yet. The difference lies in the fact that one warrants a mode of perception that involves searching for the genesis of a style, while the other warrants a mode of perception that searches for imitation. To ignore authenticity is to look at the painting improperly.

  ---

  ### 3. The Showdown: Who Survives the Objections?

  Here is how the clash plays out when we pit their best objections against each other.

  #### Lessing's Objection to Goodman: "You are changing the subject."
  Lessing would argue Goodman is conflating **interest** with **beauty**.
  *   *Argument:* Knowing a wine is rare makes it more *interesting* to drink, but it doesn't change the flavor profile. Similarly, knowing a painting is a Vermeer makes it more *historically significant*, but it doesn't change the visual experience. Goodman is smuggling non-aesthetic values (history, rarity, authenticity) into the definition of "aesthetic" to protect the art market's snobbery.
  *   *Strength:* This aligns with our gut intuition. If you were blindfolded and told the truth, the visual experience wouldn't change.

  #### Goodman's Objection to Lessing: "You treat perception like a camera."
  Goodman argues that Lessing has a naive theory of perception.
  *   *Argument:* Humans do not perceive raw data; we perceive through concepts. If I show you a picture of your mother and a perfect duplicate, and tell you one is your mother and one is a wax dummy, you *will* look at them differently. You will search the real one for life and the dummy for flaws. That search *is* part of the aesthetic experience.
  *   *Strength:* This accounts for why art education matters. We teach people history not just for trivia, but so they can *see* the art better. If Lessing were right, art history would be irrelevant to art appreciation.

  #### The Verdict: Goodman Wins (But with a Caveat)

  **Goodman's position survives better philosophically.**
  Lessing's view relies on the idea that "aesthetic experience" is a isolated, momentary sensory event. But art is a temporal, cognitive practice. Goodman successfully argues that **what we know shapes what we see.**

  If we accept Lessing's view, we have to admit that a perfect AI-generated image created in 2024 is aesthetically identical to a human painting from 1824 if the pixels match. Most art lovers feel a loss in the AI version—not just a moral loss, but an aesthetic one (it feels "hollow" or "derivative"). Goodman explains *why* it feels hollow: because we perceive it under the category of "simulation" rather than "expression." That categorization changes the aesthetic properties we attribute to it (e.g., "calculated" vs. "spontaneous").

  **The Caveat (Where your friend has a point):**
  Goodman risks making "aesthetic value" too elastic. If *any* knowledge changes the aesthetic value, then the price tag on the wall could change the aesthetic value. Goodman needs to maintain that the history of *production* is uniquely relevant, not just any history.

  **How to push back on your friend:**
  Don't argue that the forgery is "ugly." Argue that **"looking" is a skill, not a reflex.**
  Tell her: *"If you know a musician is improvising vs. playing a script, you hear the music differently, even if the notes are the same. You listen for risk in one and precision in the other. That listening difference is an aesthetic difference. Van Meegeren wasn't taking the risks Vermeer took; he was solving a puzzle. Knowing that changes how we look at the brushstrokes. We look for hesitation in the forgery and confidence in the original. Even if we can't see it yet, knowing which is which trains our eyes to see the difference eventually. That makes them aesthetically distinct."*

  Goodman wins because he recognizes that art isn't just about the object on the wall; it's about the relationship between the viewer, the object, and the history that connects them. Lessing protects the object, but Goodman protects the *experience*.
