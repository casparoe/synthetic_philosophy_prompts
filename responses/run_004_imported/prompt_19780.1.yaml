answer: |-
  You are not wrong to spot the parallel. In fact, you have identified a genuine and significant structural isomorphism between two major intellectual movements of the late 20th century. Your intuition is sharp: both Rorty and Brooks are launching attacks on a "mediator" model of cognition, arguing that successful engagement with the world does not require an internal stand-in for that world.

  However, your friend's hesitation is also well-founded. While the *structure* of the arguments is remarkably similar, the *work* they are doing is distinct because they are operating in different domains with different definitions of "representation."

  Here is a breakdown of why your analogy holds water, where it leaks, and the philosophical bridge that connects them.

  ### 1. Where You Are Right: The Structural Convergence
  You have correctly identified that both projects are reactions against **Cartesian Internalism**.

  *   **The Common Enemy:** Both Rorty and Brooks are attacking the idea that there is a "inner theater" (the mind or the CPU) that must first construct a faithful model of the "outer world" before action can take place.
  *   **The Common Solution:** Both prioritize **interaction over depiction**.
      *   **Rorty:** Argues that knowledge is not a matter of getting reality "right" (mirroring) but of acquiring habits of action that allow us to cope with our environment and justify ourselves to our peers.
      *   **Brooks:** Argues that intelligence is not a matter of building a symbolic map, but of coupling sensors and actuators so the agent can cope with the environment in real-time.
  *   **The Pragmatic Criterion:** Both judge success by *performance*, not *accuracy*. For Brooks, a robot that walks without stumbling is successful, even if it has no concept of "floor." For Rorty, a belief is "true" (in a pragmatic sense) if it helps us navigate social and physical life, not because it corresponds to a metaphysical fact.

  In this sense, you are correct: Brooks' *subsumption architecture* is effectively Rorty's *pragmatism* implemented in silicon. Both say: "Stop trying to build the mirror; just build the hand."

  ### 2. Where Your Friend Is Right: The Divergence
  The reason a philosophy PhD might be unconvinced by the equation is that "representation" means two fundamentally different things in these contexts, and the stakes are different.

  **A. Normativity vs. Causality**
  *   **Rorty (Epistemology):** Rorty is concerned with **justification**. When he attacks representationalism, he is asking: "What gives me the *right* to claim this belief is true?" He wants to dissolve the philosophical problem of how the mind hooks onto the world. His target is the *authority* of the philosopher to judge whether our concepts match reality.
  *   **Brooks (Engineering/Cognitive Science):** Brooks is concerned with **causal efficacy**. He is asking: "What computational structure *causes* the robot to avoid obstacles?" He isn't worried about justification or truth; he is worried about bandwidth, latency, and the "frame problem."
  *   **The Gap:** You can accept Brooks' claim (robots don't need maps to walk) without accepting Rorty's claim (humans don't need truth-conditions to know). One is a claim about control systems; the other is a claim about the nature of knowledge.

  **B. Linguistic vs. Computational Representation**
  *   **Rorty:** When Rorty says "representation," he mostly means **linguistic or propositional**. He is attacking the idea that sentences mirror facts.
  *   **Brooks:** When Brooks says "representation," he means **data structures**. He is attacking the use of explicit 3D models stored in RAM.
  *   **The Gap:** A Rortyan could argue that even Brooks' "tight feedback loops" are described by humans using language that *does* represent the world. Rorty's anti-representationalism is about the vocabulary we use to describe knowledge, whereas Brooks' is about the architecture of the control system.

  **C. Scope and Ambition**
  *   **Rorty:** His claim is global. He wants to end traditional philosophy. He argues that *no* human inquiry (science, art, politics) is fundamentally about mirroring nature.
  *   **Brooks:** His claim was initially local (insect-level robotics). Brooks eventually admitted that higher-level cognition (planning, language) might require some form of representation. Rorty does not make this concession; he argues that "higher-level" thought is just more complex social coping.

  ### 3. The Missing Link: Embodied Cognition and Dreyfus
  If you want to vindicate your intuition to your friend, you should bring up **Hubert Dreyfus**.

  Dreyfus is the philosophical godfather of behavior-based robotics. In the 1960s and 70s, he used Heidegger and Merleau-Ponty (phenomenologists of embodiment) to critique classical AI. He argued that human intelligence is not based on manipulating internal symbols but on embodied, skilled coping.
  *   **Rodney Brooks explicitly cites Dreyfus** as a major influence on subsumption architecture.
  *   **Rorty** is also heavily influenced by the same pragmatic/phenomenological tradition (via Dewey, Heidegger, and Wittgenstein).

  So, you are all part of the same family tree. The field that actually merges Rorty and Brooks is **Enactivism** (associated with Varela, Thompson, and Noë). Enactivists argue exactly what you suggested: that cognition is not representation but a form of embodied action. They treat Rorty's philosophical arguments and Brooks' engineering arguments as evidence for the same underlying ontology.

  ### 4. Verdict: How to Refine Your Claim
  You are not wrong, but your claim needs a slight adjustment to be philosophically bulletproof.

  **Don't say:** "Rorty's antirepresentationalism *is* a generalization of Brooks' AI arguments."
  *(Chronologically, Rorty's book came out in 1979; Brooks' key papers were late 80s/early 90s. Also, Rorty wasn't reading AI papers.)*

  **Do say:** "Rorty and Brooks are engaged in a **convergent critique of Cartesian mediation**."
  They both argue that the "inner model" is an unnecessary posit. Rorty does it to dissolve epistemological skepticism; Brooks does it to solve engineering bottlenecks.

  **The Synthesis:**
  You can tell your friend: *"I'm not saying Rorty is doing robotics. I'm saying that both Rorty and Brooks identify the 'internal model' as a philosophical/engineering error. Rorty shows why we don't need a mirror to have knowledge; Brooks shows we don't need a map to have behavior. Together, they suggest that 'representation' is a tool we sometimes use, not the foundation of intelligence."*

  ### Summary
  Your intuition is excellent. You have spotted a **homology** between pragmatist epistemology and behaviorist robotics. The reason your friend was unconvinced is likely that philosophers are trained to be protective of the distinction between *normative* questions (what ought we to believe?) and *naturalistic* questions (how does the system function?).

  If you frame it as a shared attack on the "spectator theory of knowledge" (to use Dewey's phrase), you will find common ground. Rorty provides the philosophical justification for why Brooks' robots don't need to be "wrong" just because they lack maps; Brooks provides the empirical proof that Rorty's "coping without mirroring" is physically possible.
