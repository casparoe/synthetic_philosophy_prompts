          *   *Prompt:* Use the chariot simile from the *Milindapañha*.
          *   *Maya's Text:* "This is why the monk Nagasena, in his dialogue with King Milinda, compares a person to a chariot: a chariot is nothing more than its wheels, axle, and frame assembled together, and 'chariot,' like 'person,' is just a convenient name for the assemblage, not a separate thing on top of it."
          *   *Assessment:* Accurately identifies Nagasena and King Milinda. Accurately explains the simile (parts vs. whole, conventional naming).
          *   *Potential Issue:* None. It captures the nominalist essence of the simile.
