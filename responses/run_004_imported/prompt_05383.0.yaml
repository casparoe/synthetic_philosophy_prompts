      - Connect it to the couple.
      - Anecdote about reliability.
      - Toast to the "practice."

  10. **Final Review:** Does it sound like a friend speaking? Yes. Is it respectful? Yes.

      *Let's write it.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being the Best Man.

  I want to start by acknowledging the unique demographic split in this room. On my left, we have the family and old friends, who are hoping for a story about [Groom's Name] that involves mild embarrassment and a heartfelt conclusion. On my right, we have the Philosophy Department, who are currently scanning my syntax for categorical errors and waiting to see if I understand the difference between a natural and an artificial virtue.

  I know the stakes. [Groom's Name] has made it very clear that he does not believe the vows he is about to take constitute a metaphysical transformation of his soul. He has written three hundred pages explaining that there is no magical "glue" created by saying "I do." So, for the benefit of his colleagues: I promise not to suggest that marriage creates a mystical bond independent of social practice. And for the benefit of his grandmother: I promise to explain why that is actually incredibly romantic.

  Because here is the thing about [Groom's Name]'s view on promises. He believes that a promise isn't binding because the universe forces you to keep it. It's binding because you have deliberately raised an expectation in someone else, and because the entire practice of trusting one another is the only thing that makes human life livable.

  In other words, he doesn't believe in magic. He believes in *showing up*.

  And honestly, that is why he is going to be such a good husband. There are people who think love is a feeling that strikes you like lightning. [Groom's Name] knows that love is a convention you sustain. It is the daily, deliberate act of meeting the expectations you have invited your partner to have. It is the understanding that trust isn't a object you find; it's a muscle you build.

  I saw this long before he met [Bride's Name]. I remember a few years ago, I was moving apartments. It was raining, I was broke, and I had a sofa that defied physics. I called [Groom's Name]. He didn't say, "I feel a spiritual destiny to help you." He said, "I promised I'd be there at 8:00. I'll bring the van."

  He came. He lifted his end. He didn't make a fuss. That is the Humean ideal in a t-shirt. The obligation wasn't in the air; it was in his reliability. He understood that if he didn't show up, the practice of our friendship would degrade. And he values that practice more than his own comfort.

  [Bride's Name], this is where you come in. You are the person to whom the promise is made. On his view, the "bond" of marriage isn't something that exists above your heads; it exists *between* you. It lives in the expectations you have of him, and the confidence he gives you that he will meet them. It is the utility of knowing that when you wake up tomorrow, or in ten years, or in fifty, the person standing next to you has chosen, again and again, to sustain the convention of "us."

  To the relatives here: This doesn't mean his commitment is weak because it isn't "magic." It means it's stronger because it's real. It doesn't rely on a spell; it relies on him. And having known him for [Number] years, I can tell you that when he commits to a practice, he maintains it.

  To the philosophers here: I know he argues that the obligation is grounded in the usefulness of the practice for social cooperation. But I would argue that when the cooperation is this deep, and the utility is this profound, it looks an awful lot like what the rest of us call "devotion."

  [Groom's Name], you have asked us not to lean on the idea that today forges a chain that binds you for eternity. So I won't. Instead, I will say this: Today, you are publicly inviting [Bride's Name] to expect everything from you. You are committing to a lifetime of proving that the practice of your marriage is useful, necessary, and good.

  You are promising to be the person she expects you to be, even when it's hard, especially when it's hard, because without that trust, nothing else works.

  So, if everyone could please raise their glasses.

  To [Bride's Name] and [Groom's Name]. May your expectations always be met. May your convention never collapse. And may the utility of your love be the foundation upon which you build a life that is happy, cooperative, and enduring.

  To the happy couple!
