prompt: |-
  My closest friend is getting married next month, and I have been asked to give the best man speech. He wrote his dissertation on the philosophy of promising and remains persuaded by a broadly Humean view of the subject: that the obligation to keep a promise is not created by some special mental act of self-binding at the altar, but is a matter of convention, sustained by the expectations a promise deliberately raises in the person to whom it is made and by the usefulness of the practice in making trust and cooperation possible at all. On his view, talk of vows forging some further bond that exists independently of that trust is simply confused, and he has asked, half-jokingly, that the speeches not lean on it. About half the room will be his philosophy department, who will notice immediately if I fudge the point; the other half are relatives who have never heard of Hume on promises and just want a good toast. Write the speech: five minutes long, warm and genuinely funny, faithful to his view of why promises bind, and moving enough that everyone in the room, philosophers included, has real reason to be glad they came.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Best Man speech at a wedding.
      *   **Time:** 5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Tone:** Warm, genuinely funny, moving.
      *   **Key Constraint:** The Groom is a philosopher specializing in the philosophy of promising (Humean view).
      *   **The Groom's View:** Promises aren't magical self-binding acts; they are social conventions based on raised expectations and the utility of trust/cooperation. No mystical "bond" independent of that trust.
      *   **Audience:** 50% Philosophy Department (will spot errors), 50% Relatives (want warmth/humor, no jargon).
      *   **Goal:** Satisfy the philosophers intellectually, move the relatives emotionally, and honor the groom's specific intellectual quirk without being dry.

  2.  **Deconstruct the Humean View of Promising:**
      *   *Core idea:* It's not a metaphysical glue. It's a social tool.
      *   *Why keep them?* Because if we don't, the practice collapses, and cooperation becomes impossible. It relies on mutual expectation and utility.
      *   *Application to Marriage:* Marriage isn't a magical transformation of souls. It's a public convention where two people raise expectations of fidelity and support, sustaining a practice of trust that makes life better for both.
      *   *The Trap:* Avoid saying "today you are bound by sacred vows" in a metaphysical sense. Focus on "today you are publicly committing to a practice of trust."

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Standard best man opening (thank yous, nerves).
          *   Address the elephant in the room: The Groom's dissertation.
          *   Hook the philosophers immediately (show I did the reading) but keep it accessible for relatives.

      *   **The "Philosophy" Bit (The Constraint):**
          *   Need to explain the Humean view simply.
          *   *Idea:* Contrast the "magical" view with the "practical" view.
          *   *Joke:* If I say "magic," the philosophers will groan. If I say "utility," the relatives will sleep.
          *   *Solution:* Frame it as "Trust is a verb, not a spell."
          *   *Specific reference:* Mention "convention" and "expectations."

      *   **The Bride/Partner:**
          *   Crucial for warmth.
          *   How does she fit into this philosophy? She is the person *to whom* the promise is made. Her expectations matter most.
          *   Show, don't just tell, their dynamic.

      *   **The Friendship/Anecdote:**
          *   Need a story that illustrates reliability without invoking "fate."
          *   Maybe a time he kept a promise when it was inconvenient? That fits the "utility/trust" model better than "destiny."

      *   **The Toast/Conclusion:**
          *   Bring it back to the future.
          *   Reiterate that the *work* starts now.
          *   Final toast.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. I'm nervous.
      *   Groom wrote a thesis on promises. He says vows aren't magic.
      *   Philosophers nodding. Relatives confused.
      *   But basically, he thinks marriage is about not letting each other down because it's useful.
      *   I've seen him be a good friend. He shows up.
      *   [Bride's Name], he expects to make you happy and you expect him to. That's the bond.
      *   So let's drink to conventions and utility!
      *   *Critique:* Too dry. "Useful" sounds unromantic. Need to make "utility" sound like "love."

  5.  **Drafting - Iteration 2 (Refining the Tone):**
      *   Make the philosophy sound romantic. The "usefulness of the practice" is actually the "foundation of a life."
      *   The "magic" isn't in the words, it's in the doing.
      *   Ensure the philosophers hear the right terminology (convention, expectations, artificial virtue) but wrapped in plain English.
      *   Ensure relatives hear "love is action."

  6.  **Writing the Speech (incorporating specific phrasing):**
      *   *Opening:* Acknowledge the dual audience.
      *   *The Humean Angle:* "David Hume." "Artificial virtue." But explain it as "building something together."
      *   *The Groom:* He doesn't believe in cosmic glue. He believes in showing up.
      *   *The Bride:* She is the beneficiary of the expectation.
      *   *The Anecdote:* A time he helped me move house or something mundane but reliable.
      *   *The Closing:* The promise is in the breakfast, the coffee, the hard days.

  7.  **Review against Constraints:**
      *   *5 Minutes?* Word count check. (Aim for ~800 words).
      *   *Humean Accurate?* Yes, focus on convention/expectation/utility, not metaphysical binding.
      *   *Funny?* Need jokes about the department and the relatives.
      *   *Moving?* Focus on the stability of trust.

  8.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the transition from philosophy to emotion is smooth.
      *   Make sure the toast lands.

      *(Self-Correction during drafting)*: I need to be careful not to mock the philosophy. The Groom *holds* this view. It shouldn't be "even though he thinks this, he loves her." It should be "because he thinks this, his love is reliable." The philosophy *supports* the romance.

      *Key phrase to include:* "The obligation is not in the words, but in the living of them."

      *Addressing the relatives:* Explain that "convention" just means "agreement we all keep."

      *Addressing the philosophers:* Use terms like "sentiment," "convention," "expectations."

  9.  **Final Word Count Check:** A 5-minute speech is roughly 750-850 words. I will aim for that range.

      *(Drafting content...)*
      - Start with the pressure of the audience.
      - Explain the "no magic" rule.
