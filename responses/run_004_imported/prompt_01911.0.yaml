prompt: |-
  Been going down a rabbit hole on Bradley's regress for a piece on why 'the unity of the proposition' is still such an unsolved mess -- basically, what actually glues a subject and predicate (or a relation and its relata) into one fact instead of leaving them as a pile of separate items? Made me think of Leibniz, since his whole containment theory of truth already claims the predicate concept is packed inside the subject's complete concept, and he was pretty suspicious that relations are fully real rather then just 'ideal' add-ons grounded in each thing's own qualities. Does that setup actually let him dodge Bradley's regress, or does the exact same unity problem just resurface inside the monad? If you sat Leibniz down and walked him through Bradley's argument, what's your best guess at his reaction -- a real threat to his system, or a problem he'd insist he'd already cracked two centuries before Bradley showed up?
reasoning: |-
