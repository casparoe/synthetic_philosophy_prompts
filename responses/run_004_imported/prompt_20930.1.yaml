answer: |-
  ### Part 1: Semantics and Valuations in LP

  To understand the asymmetry between the Law of Excluded Middle (LEM) and Disjunctive Syllogism (DS) in Graham Priest's Logic of Paradox (LP), we must first rigorously define the semantic machinery.

  **1. The Values and Designation**
  LP utilizes three truth values:
  *   $t$ (True only)
  *   $f$ (False only)
  *   $b$ (Both true and false, the "glut")

  The logical ordering is $f < b < t$.
  Crucially, the set of **designated values** ($D$), which represent "truth enough" for validity, is $\{t, b\}$. An inference is valid in LP if and only if, whenever all premises take a value in $D$, the conclusion also takes a value in $D$.

  **2. The Connectives**
  *   **Negation ($\neg$):** Swaps $t$ and $f$, but fixes $b$.
      *   $\neg t = f$
      *   $\neg f = t$
      *   $\neg b = b$
  *   **Disjunction ($\lor$):** Takes the maximum value according to the ordering $f < b < t$.
      *   $v(A \lor B) = \max(v(A), v(B))$

  **3. Validity of the Law of Excluded Middle ($A \lor \neg A$)**
  We test whether $v(A \lor \neg A)$ is always in $D$ for any valuation of $A$.
  *   **Case 1: $v(A) = t$.** Then $v(\neg A) = f$.
      $v(A \lor \neg A) = \max(t, f) = t$. Since $t \in D$, this is designated.
  *   **Case 2: $v(A) = f$.** Then $v(\neg A) = t$.
      $v(A \lor \neg A) = \max(f, t) = t$. Since $t \in D$, this is designated.
  *   **Case 3: $v(A) = b$.** Then $v(\neg A) = b$.
      $v(A \lor \neg A) = \max(b, b) = b$. Since $b \in D$, this is designated.

  **Result:** In all possible valuations, the formula $A \lor \neg A$ receives a designated value. Therefore, LEM is **valid** in LP.

  **4. Invalidity of Disjunctive Syllogism ($A \lor B, \neg A \vdash B$)**
  To show invalidity, we need a single counter-model where the premises are designated but the conclusion is not.
  *   **Let $v(A) = b$** (A is a true contradiction).
  *   **Let $v(B) = f$** (B is strictly false).

  Now we evaluate the premises and conclusion:
  *   **Premise 1 ($A \lor B$):** $\max(v(A), v(B)) = \max(b, f) = b$. Since $b \in D$, this premise is designated.
  *   **Premise 2 ($\neg A$):** $v(\neg A) = \neg b = b$. Since $b \in D$, this premise is designated.
  *   **Conclusion ($B$):** $v(B) = f$. Since $f \notin D$, the conclusion is **not** designated.

  **Result:** It is possible for the premises to be "true enough" (designated) while the conclusion is false. Therefore, DS is **invalid** in LP.

  ***

  ### Part 2: Why Disjunctive Syllogism Must Be Sacrificed

  The asymmetry explained above is not an arbitrary quirk of LP; it is a systematic necessity for any logic that seeks to block the **Principle of Explosion** (Ex Falso Quodlibet: $A, \neg A \vdash B$) via truth-value gluts while retaining classical structural rules and the standard meaning of disjunction.

  **1. The Derivation of Explosion**
  In classical logic, the ability to infer any conclusion $B$ from a contradiction ($A$ and $\neg A$) relies on the interaction between Addition and Disjunctive Syllogism. The derivation is straightforward:
  1.  $A$ (Premise)
  2.  $\neg A$ (Premise)
  3.  $A \lor B$ (From 1, by **Addition**)
  4.  $B$ (From 3 and 2, by **Disjunctive Syllogism**)

  If a logic accepts both Addition and Disjunctive Syllogism, it *must* accept Explosion. Since the defining goal of a paraconsistent logic like LP is to reject Explosion (to allow for true contradictions without triviality), it must reject at least one step in this derivation.

  **2. Why Retain Addition?**
  Addition ($A \vdash A \lor B$) is a principle of the "positive" fragment of logic; it does not involve negation. It essentially defines the inclusive nature of "or": if $A$ is true, then "$A$ or anything" is also true.
  *   **Semantic Stability:** In LP, if $v(A) \in D$, then $\max(v(A), v(B))$ must also be in $D$ (since $x \le \max(x, y)$). Addition holds naturally in the semantics.
  *   **Cost of Rejection:** Rejecting Addition requires a radical revision of the meaning of disjunction (as seen in some substructural or relevant logics where structural rules like Weakening are dropped). Priest's LP aims to be a *classical* logic extended to handle contradictions, not a logic that fundamentally alters the behavior of conjunction and disjunction in non-contradictory contexts. Retaining Addition preserves classical reasoning in consistent domains.

  **3. Why Sacrifice Disjunctive Syllogism?**
  Disjunctive Syllogism ($A \lor B, \neg A \vdash B$) implicitly relies on the assumption that $\neg A$ is incompatible with $A$. In classical two-valued logic, if $\neg A$ is true, $A$ *must* be false. Therefore, if $A \lor B$ is true, the truth must be carried by $B$.

  However, in LP, the presence of the value $b$ (both) breaks this incompatibility:
  *   **The Glut Problem:** If $A$ has the value $b$, then $\neg A$ also has the value $b$. Both are designated.
  *   **Failure of Exclusion:** In the counter-model ($v(A)=b, v(B)=f$), the premise $\neg A$ is designated, but it does not "eliminate" $A$ as a source of truth for the disjunction $A \lor B$. The disjunction $A \lor B$ is designated *because of A*, not because of $B$.
  *   **The Inference Break:** DS attempts to infer $B$ by assuming $\neg A$ rules out $A$. But in LP, $\neg A$ being designated is compatible with $A$ being designated. Therefore, the truth of $A \lor B$ can be fully accounted for by $A$, leaving $B$ free to be false ($f$).

  **4. Unavoidability in Truth-Functional Paraconsistency**
  The prompt notes that this sacrifice is specific to logics that block Explosion by "tolerating truth-value gluts rather than by restricting structural proof rules."
  *   **Structural Approaches:** Logics like Linear Logic or certain Relevant Logics block Explosion by restricting structural rules (e.g., denying that you can reuse premises or add arbitrary ones). In those systems, Addition might fail or be restricted, allowing DS to remain valid in a modified form.
  *   **Truth-Functional Approaches (LP):** LP keeps all classical structural rules (Contraction, Weakening, etc.). It locates the inconsistency in the *semantics* (the values), not the *proof structure*. Once you define validity as the preservation of designated values $\{t, b\}$ and define negation such that $\neg b = b$, the counter-model for DS ($A=b, B=f$) becomes mathematically inevitable.

  **Conclusion**
  Disjunctive Syllogism is sacrificed in LP because it is the specific inference rule that leverages the exclusivity of negation to propagate truth from a disjunction to its remaining disjunct. In a glutty semantics, negation is no longer exclusive (since $b$ is its own negation). To maintain the Law of Excluded Middle (which requires $b$ to be designated) and Addition (which preserves classical positive logic), LP must accept that $\neg A$ does not guarantee the falsity of $A$. Consequently, one cannot infer $B$ from $A \lor B$ and $\neg A$, because $A$ might be the "both" value that satisfies both premises while $B$ remains false. This is the precise price paid to allow contradictions to be true without rendering every statement true.
