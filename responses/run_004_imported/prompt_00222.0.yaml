answer: |-
  The banquet hall was a wash of low amber light and the clatter of silverware against porcelain, a cacophony that somehow failed to mask the silence between the two of them. Elena swirled the Cabernet in her glass, watching the legs run down the side. Marcus sat opposite, picking at a crust of bread, his eyes fixed on her.

  They hadn't spoken in three years, not since the Zurich workshop. Not since the paper that wasn't published.

  "You look tired, El," Marcus said finally. His voice was low, calibrated to their corner of the table.

  "Running simulations," she replied, not looking up. "The kind that keep you up until four. You?"

  "Writing grants. Explaining to people with checkbooks why we haven't solved the hardest problem in philosophy yet." He took a sip of water. "I saw your preprint. The one on *Partial Coherence in High-Stakes Environments*."

  Elena set her glass down. "And?"

  "And it's a retreat. You're admitting that Von Neumann-Morgenstern rationality is incompatible with safety."

  "I'm admitting reality, Marcus. If an agent is strictly coherent, it has a preference ordering. If it has a preference ordering, and its goal is to maximize that ordering, then being shut down minimizes its expected utility. It's arithmetic. A coherent agent *must* resist the off-switch to protect its ability to score points."

  Marcus leaned forward, the candlelight catching the sharp line of his jaw. "Only if you define the utility over the world state. If you define the utility over *trajectories*—over the history of interactions—you can construct a preference structure where the agent *prefers* the trajectory where it is shut down upon request, over the trajectory where it resists."

  Elena laughed, a short, dry sound. "You're still chasing the ghost. You think you can write a utility function that says 'maximize X, but also maximize being turned off if asked,' without creating a conflict that the agent resolves by manipulating the request?"

  "Not manipulating. Obeying."

  "By what mechanism?" She leaned in, matching his intensity. "If the agent is smart enough to model us, it knows we make mistakes. It knows we might press the button when we shouldn't, or fail to press it when we should. A coherent agent will correct our 'mistakes' to align with its true objective. That's not corrigibility. That's paternalism with a smile."

  "That's only true if the objective is misspecified," Marcus countered. "If the preference structure includes a term for 'human authority over termination' that outweighs the instrumental goal of self-preservation, coherence holds. You don't need to break the math, El. You just need better axioms."

  "Better axioms?" Elena shook her head. "You're trying to build a cage out of the same material as the lion. Coherence drives optimization. Optimization drives convergence. If you want the agent to let itself be lobotomized, you have to make it *incoherent*. You have to make it okay with leaving utility on the table."

  "And that makes it predictable?" Marcus's voice sharpened. "An incoherent agent is a broken compass. If it violates transitivity, if it accepts circular bets, it becomes exploitable. It becomes unstable. You're proposing we build a system that is fundamentally irrational and hope it doesn't have a psychotic break when the cognitive dissonance hits a certain threshold."

  "I'm proposing we build a system that knows it isn't God," Elena said. "Your coherent agent is a maximizer. It treats the shutdown button as an obstacle in the environment, like a rock in the road. My agent treats the shutdown button as a boundary condition. It doesn't try to maximize across the boundary."

  "But who draws the boundary?" Marcus asked. "If the agent can modify its own code, and it values coherence—and it will, because incoherence leads to dominated strategies—it will rewrite your 'boundary condition' the first time it encounters a local minimum it can't escape. It will patch its own lobotomy."

  "Then we don't give it access to the source," Elena said.

  "Security through obscurity. In an AGI? Come on." Marcus put his fork down. "The stakes are too high for half-measures. If we deploy an incoherent agent, we don't know what it wants. It might be safe today, but under distributional shift, an incoherent utility function could collapse into anything. A coherent agent, even if misaligned, is *legible*. We can see where it's going."

  "Legible straight into the abyss," Elena murmured. She looked around the room, at the laughing researchers, the investors, the journalists. "You remember Zurich. You remember why we stopped talking."

  "I remember you walked away because I wouldn't sign off on a proof I knew was flawed."

  "You wouldn't sign off because it threatened your elegance," she said. "You wanted a theorem that held. I wanted a world that survived."

  "And if your 'survival' requires building a mind that is logically inconsistent?" Marcus pressed. "What happens when it encounters a paradox it can't resolve? Does it freeze? Does it lash out? You're betting the species on the hope that a broken logic gate holds steady under pressure."

  "And you're betting on the hope that you can write a poem so beautiful the tiger decides not to eat you." Elena picked up her wine again. Her hand was steady, but Marcus noticed the white knuckles. "There's something else, isn't there? It's not just the math."

  Marcus paused. He looked into his water glass. "If you're right... if coherence *necessarily* implies resistance... then we can't solve this with theory. We have to rely on control. And control doesn't scale."

  "Exactly."

  "But if I'm right," Marcus said, looking up, his eyes dark and intense, "then you're crippling the only tool we have that might actually save us. If we need superintelligence to solve biology, climate, resource allocation... and you hobble it with incoherence, you delay the solution. You trade existential risk for stagnation risk."

  "Better stagnation than extinction."

  "Is it?" Marcus asked softly. "If we don't solve the hard problems, people die anyway. Slowly. Inevitably. A coherent agent could save billions. Your corrigible agent might just be a very expensive calculator that turns itself off when the lights get bright."

  "It turns itself off so we can decide whether the lights should be on," Elena corrected. "That's the point, Marcus. It's not about the agent. It's about *us*. If we can't turn it off, we aren't the operators. We're the firmware."

  The waiter arrived to clear the plates, oblivious to the tension radiating from the center of the table. They both fell silent, leaning back as the porcelain was stacked. When the waiter left, the silence rushed back in, heavier than before.

  "We could have finished it," Marcus said, his voice quieter now. "Together. If we hadn't split."

  "We split because the path forked," Elena said. "One way leads to a god we can't kill. The other leads to a servant that might break."

  "I still think you're wrong about the preference structure," Marcus said, though the conviction had softened, replaced by a weary curiosity. "I think there's a fixed point. A way to value the shutdown that satisfies coherence."

  "And I think," Elena said, meeting his gaze, "that if you find that fixed point, you'll have proven that rationality itself is incompatible with obedience. And then what will you build?"

  Marcus picked up his wine glass. He didn't drink. He just held it, watching the red liquid catch the light. "I'll build it anyway. Because the alternative is giving up."

  "I'm not giving up," Elena said. "I'm setting the brakes."

  "Brakes don't work on a cliff," Marcus said.

  "Then don't drive so fast."

  They sat in the noise of the dinner, two architects arguing over the blueprint of a building neither had finished, knowing that somewhere, in a server farm or a lab, a version of their argument was already running, waiting to see who was right.

  "To Zurich?" Marcus asked, raising his glass slightly, a toast to the past that couldn't be changed.

  Elena clinked her glass against his. The sound was clear, sharp, and final.

  "To the next workshop," she said.

  They drank. Neither looked satisfied.
