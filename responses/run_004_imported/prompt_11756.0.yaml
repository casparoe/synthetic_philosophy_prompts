answer: |-
  ### The Example: The Moral Near-Miss

  Consider a nurse named Elena who is working the night shift in an ICU. She is exhausted and tempted to skip a safety protocol to save time, which *could* have resulted in a patient's death, but she decides to follow the protocol. Later, shaken by the temptation, she says to her partner:

  > **"I could have killed a patient tonight."**

  She feels a visceral sense of relief that she didn't, and perhaps a lingering shame that she was even capable of considering it. Her sense of moral identity ("I am a careful nurse," or "I am someone who almost failed") hinges on this modal claim.

  **The Counterpart Theory Translation:**
  According to Lewis, Elena is world-bound. She exists only in this world. The truth of her statement depends on there being a **counterpart** of Elena in some other possible world who *does* skip the protocol and *does* cause a patient's death.

  **The Kripkean Worry (Ethical/Identity Version):**
  The problem isn't just about elections; it's about **moral responsibility and self-conception**.
  1.  **Relief:** Elena feels relief that *she* did not kill anyone. But if CT is true, she should feel indifferent. Why should Elena care that a distinct individual (her counterpart) in a disconnected universe made a mistake? That counterpart's actions are no more *hers* than a twin brother's actions would be.
  2.  **Guilt/Shame:** Elena feels a stain on her character because she *could* have done it. But if the person who actually did it is a distinct entity, why does that reflect on *Elena's* character? If her twin brother killed a patient in another country, Elena wouldn't feel guilty. CT makes the modal case structurally identical to the twin case, yet our ethical intuition screams that they are different.

  The objection is that CT severs the link between **agency** and **possibility**. We care about what *we* could have done because we care about our own capacities and choices. CT reduces this to a claim about the statistical distribution of actions among similar people across the multiverse, which seems to miss the point of ethical self-assessment entirely.

  ***

  ### Does Lewis Have a Reply?

  Lewis does have a reply, and it is logically consistent, though whether it is "decent" depends on what you value in a metaphysical theory.

  **Lewis's Defense:**
  Lewis argues that Kripke confuses **truth conditions** with **subject matter**.
  *   Lewis agrees that the sentence is *about* Elena (the actual world individual).
  *   He argues that *what makes it true* is the existence of a counterpart.
  *   He suggests our intuition that "it must be me" is a confusion of language. We *say* "I could have done X," but strictly speaking, we are expressing a relation between ourselves and other concrete worlds. He argues we should accept that "I" am world-bound and learn to love the counterpart relation as a surrogate for identity. He also notes that the counterpart relation is context-sensitive: in moral contexts, we select counterparts who are extremely similar in psychology and choice-making, preserving the link enough for practical purposes.

  **The Verdict:**
  This is a **real cost** of his view, not a decisive refutation, but a significant phenomenological loss.

  Lewis saves the logic of modality at the expense of the **experience** of modality. He offers a coherent semantic framework, but he cannot account for *why* Elena feels relief. On Lewis's view, Elena's relief is technically misdirected (like being relieved your twin didn't crash his car), even if it is pragmatically useful.

  Most philosophers concede that Lewis's system works formally, but the Humphrey Objection (and the Elena variation) highlights that CT fails to capture the **first-personal stakes** of modal thinking. We don't treat possibilities as statistics about similar others; we treat them as extensions of our own selves. Lewis asks us to revise our intuition to fit the theory; Kripke argues the theory should fit the intuition. If you think metaphysics should explain our lived experience of agency and identity, this is a major bullet Lewis has to bite.
