      *   **Kripke's View:** Modality and Epistemology are distinct categories.
          *   **Metaphysics (Modality):** How the world *could* have been. (Rigid designators, essential properties).
          *   **Epistemology (Cognitive Status):** How we *come to know* the truth. (Evidence, investigation).
      *   **The Crucial Move:** Separating the *proposition expressed* from the *statement used to express it* (or the *way reference is fixed*).
      *   **Water = H2O:**
