answer: |-
  # The Discounted Will: Mechanism or Illusion?

  You recognized the pattern immediately because you speak the language of optimization. In Reinforcement Learning (RL), an agent maximizes the expected sum of discounted future rewards: $G_t = \sum \gamma^k R_{t+k+1}$. If your discount factor $\gamma$ is constant (exponential discounting), your preferences are time-consistent. A plan made today is still the optimal plan tomorrow. But if $\gamma$ decays as a function of time (hyperbolic discounting), you get time-inconsistency. You plan to diet on Monday, but when Monday arrives, the immediate reward of the donut outweighs the distant reward of health, and your policy flips.

  To the behavioral economist, this is a closed case. To the philosopher, this is a category error.

  The debate over whether hyperbolic discounting (HD) *explains* akrasia (weakness of will) or merely *explains it away* hinges on a metaphysical question: What constitutes the "Will"? If the will is simply the output of a valuation function, HD explains it. If the will is a capacity to act on judgment independent of immediate valuation, HD dissolves the phenomenon entirely.

  This essay argues that hyperbolic discounting **explains away** the classical philosophical conception of akrasia, but in doing so, it forces us to adopt a computational, multi-system model of the mind to recover the phenomenon of "weakness." HD does not describe a failure of a unitary will; it describes a collision between two different wills.

  ### The Reductionist Case: Akrasia as Preference Reversal

  The strongest argument for HD as an explanation comes from the tradition of *picoeconomics*, championed by psychologist George Ainslie. The classical puzzle of akrasia, dating back to Socrates in the *Protagoras*, is this: How can an agent knowingly choose the worse option over the better one? Socrates argued this is impossible; if you choose $X$ over $Y$, you must have judged $X$ to be better at that moment. What we call "weakness" is just ignorance of the true good.

  Hyperbolic discounting rescues us from Socratic intellectualism without resorting to mysticism. It posits that the "judgment of the good" is not stable.

  In this view, there is no mystery. On Sunday, you value Health ($H$) over Cake ($C$) because $H$ is large but distant, and $C$ is small but distant. The discount curve is shallow. On Monday, $C$ becomes immediate. The hyperbolic curve spikes. The subjective value of $C$ now exceeds $H$. You choose $C$.

  From the perspective of the agent *at the moment of choice*, you are not acting against your judgment. You are acting precisely in accordance with it. Your utility function literally assigns a higher number to the cake. Therefore, there is no "weakness of will" in the sense of defying your own current evaluation. There is only a **time-inconsistency problem**.

  For a developer, this is satisfying. It turns a moral failing into a tuning error. If you were an RL agent, you wouldn't need "willpower"; you would need a better discount function (e.g., exponential) or a reward shaping mechanism that penalizes the donut immediately. This view explains the *behavior* perfectly. It predicts exactly when you will break your diet (when the delay is short enough to trigger the curve's steep drop-off). It offers interventions (commitment devices) that work by altering the choice architecture rather than appealing to "strength."

  ### The Philosophical Resistance: The Missing Judgment

  However, philosophers like Donald Davidson and Richard Holton argue that this reduction strips akrasia of its defining feature. The phenomenon we are trying to explain isn't just changing your mind; it's the experience of **acting against your better judgment.**

  If HD is the whole story, then at the moment you eat the cake, you *want* the cake more than the diet. Your "better judgment" has vanished, replaced by a new "best judgment" favoring sugar. But this contradicts the phenomenology of weakness. When we succumb to akrasia, we often feel a sense of resistance. We think, "I should not be doing this," even as we do it.

  If HD were the total explanation, this residual judgment shouldn't exist. If the valuation flip is total, the agent should eat the cake with a clear conscience, believing it is the optimal choice. But akratic agents feel guilt. They feel they are violating a standard they *still hold*.

  This is where the "explains away" charge sticks. HD suggests the agent is a single utility maximizer with a weird curve. But the experience of will implies a split. To act against your judgment, there must be a part of you that maintains the judgment (the Planner) and a part that executes the action (the Doer). If HD says the Planner's valuation *flipped* to match the Doer's, it denies the conflict. It claims the Planner defected.

  But we know the Planner often doesn't defect. You can scream internally "Don't eat that!" while your hand reaches for the pastry. HD describes the *pull* of the pastry, but it cannot explain the *voice* screaming "No" that gets overridden. A single discount curve cannot model a civil war; it can only model a change of allegiance.

  ### The Computational Synthesis: Model-Based vs. Model-Free

  To resolve this, we must look deeper into the computational architecture, which aligns with both the RL intuition and the philosophical nuance. In modern computational neuroscience, we distinguish between **model-based** systems (planning, slow, exponential-like) and **model-free** systems (habit, fast, sensitive to immediate reward).

  This dual-system model saves the phenomenon of akrasia while keeping the math of HD.

  1.  **The Planner (Model-Based):** This system simulates futures. It generally uses a more consistent, exponential-like discounting because it is computationally expensive to simulate the future, so it does so abstractly. It judges $H > C$.
  2.  **The Habits (Model-Free):** This system relies on cached values (TD errors). It is highly susceptible to hyperbolic discounting because it reacts to immediate cues and cached reward proximity. It values $C > H$ when $C$ is present.

  In this architecture, akrasia is not a preference reversal of a single agent. It is a **control failure**. The Planner maintains the judgment that $H > C$ (preserving the philosophical requirement of acting against judgment), but the Habit system hijacks the action selection mechanism because its signal is louder, faster, or the Planner's compute budget is exhausted (ego depletion).

  Here, HD explains the *mechanism of the temptation*, but it does not explain the *weakness*. The weakness is the failure of the executive function to arbitrate between the two systems.

  ### The Verdict

  So, does hyperbolic discounting explain weakness of will, or explain it away?

  **It explains it away.**

  Here is the decisive reasoning: The classical definition of akrasia relies on the assumption of a **unitary agent**. It assumes there is one "You" that holds a judgment and one "You" that performs an action. The paradox arises because these two should be identical.

  Hyperbolic discounting demonstrates that the "You" holding the judgment on Sunday is mathematically distinct from the "You" holding the judgment on Monday. They have different utility functions. If you accept HD as the fundamental description of human valuation, then **strict akrasia is impossible.** You cannot act against your *current* all-things-considered judgment, because your current judgment is determined by the discount curve. If you eat the cake, the curve says you wanted the cake more. End of story.

  By adopting the HD model, you dissolve the "Will" into a sequence of temporal slices. There is no weakness, only succession. The "weakness" is an illusion created by the Sunday-Self projecting its preferences onto the Monday-Self and feeling betrayed when the Monday-Self optimizes for a different objective function.

  **However**, this verdict comes with a crucial addendum. While HD explains away the *classical* puzzle, it forces us to upgrade our ontology. We must reject the unitary self.

  If we want to preserve the reality of "willpower" (the ability to resist the hyperbolic spike), we must treat the Will not as a preference, but as a **meta-cognitive control process**. Willpower is the computational effort required for the model-based system to inhibit the model-free system.

  Therefore, hyperbolic discounting is the *physics* of the temptation, but it is not the *ethics* of the failure. It explains why the donut is heavy, but it does not explain why you lifted it. To say HD explains weakness of will is like saying gravity explains why you fell down the stairs. Gravity explains the force, but "weakness" implies you could have held the railing and didn't.

  **Final Conclusion:** Hyperbolic discounting **explains away** weakness of will as a paradox of rationality, revealing it to be a conflict of sub-personal systems rather than a failure of a singular rational agent. It is a correct description of the *valuation bug*, but an incorrect description of the *agent*. If you want to talk about "Will," you are no longer talking about discount rates; you are talking about arbitration mechanisms between competing discount rates. The dev intuition was half-right: it is a tuning error, but not in the discount factor itself—it's a tuning error in the arbiter that decides which discount factor gets to drive the motor.
