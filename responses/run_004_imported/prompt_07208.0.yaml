  3.  **Deconstruct Aumann's Agreement Theorem:**
      *   *What does it say?* Two rational agents with common priors and common knowledge of each other's beliefs cannot agree to disagree. Their probabilities must converge.
      *   *Why doesn't it apply here?* Real humans aren't perfect Bayesian updaters. We have different priors (starting assumptions). We have asymmetric information (maybe one knows something they haven't fully articulated). We have different risk tolerances.
