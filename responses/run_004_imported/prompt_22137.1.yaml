answer: |-
  It is a pleasure to address a colleague who brings the disciplinary rigor of physics to modal metaphysics. Your skepticism is well-founded; indeed, many professional metaphysicians regard Lewis's argument from accidental intrinsics as a powerful *challenge* to transworld identity (TWI), but few regard it as a *refutation* that leaves counterpart theory (CT) as the only surviving option. The consensus in the literature is that the argument establishes a *dilemma*, not a knockout.

  To answer your request rigorously, I will reconstruct Lewis's argument, demonstrate where the transworld identity theorist can block the inference without abandoning intrinsicality, and then show how counterpart theory incurs a symmetrical cost regarding the extrinsicality of modal properties.

  ### 1. Formalizing Lewis's Argument from Accidental Intrinsics

  Let us begin by stating Lewis's case as formally as possible, to see exactly where the pressure is applied.

  1.  **Incompatibility:** No individual can possess incompatible intrinsic properties (e.g., being bent and being straight) simultaneously.
  2.  **Intrinsicality:** An intrinsic property is one an object has in virtue of how it is itself, not in virtue of its relations to other things.
  3.  **Modal Variance:** It is possible for an individual $x$ to be bent, and possible for $x$ to be straight.
  4.  **Transworld Identity Assumption:** If TWI is true, there is a single individual $x$ that exists in world $w_1$ (where $x$ is bent) and in world $w_2$ (where $x$ is straight).
  5.  **The Contradiction:** If $x$ exists in both $w_1$ and $w_2$, then $x$ is bent (in $w_1$) and $x$ is straight (in $w_2$). Since $x$ is the same numerically identical object, it appears $x$ is both bent and straight *simpliciter*.
  6.  **The Relational Move:** To avoid contradiction, the TWI theorist must say: $x$ is bent-at-$w_1$ and $x$ is straight-at-$w_2$.
  7.  **Lewis's Critique:** "Bent-at-$w_1$" is not a simple intrinsic property. It is a relation between $x$ and $w_1$. If all properties are of this form, nothing has genuine intrinsic properties.
  8.  **Conclusion:** Therefore, TWI is false. $x$ cannot exist in more than one world. We must adopt CT, where distinct individuals ($x$ in $w_1$, $y$ in $w_2$) bear the properties, linked by a counterpart relation.

  Your reading group member accepts step 7 as decisive. The argument for TWI rests on rejecting step 7.

  ### 2. The Defense of Transworld Identity: Relativizing the Copula, Not the Property

  The core of the defense against Lewis lies in distinguishing between **relationalizing the property** and **relativizing the instantiation**. Lewis assumes these are the same move; the TWI theorist argues they are distinct.

  #### A. The Adverbial Theory of Instantiation
  Lewis treats "bent-at-$w$" as a complex predicate $P'$ where $P'(x)$ means $R(x, w)$. Here, the property itself has been gerrymandered into a relation. If this were the only option, Lewis would be right: shape would no longer be intrinsic.

  However, the TWI theorist can adopt an **adverbial** or **indexical** account of instantiation. On this view, "at $w$" does not modify the property *bent*; it modifies the *copula* (the "is" of predication).
  *   **Lewis's reading:** $x$ has the property (bent-and-at-$w_1$).
  *   **TWI reading:** At $w_1$, $x$ has the property (bent).

  Formally, we distinguish the instantiation relation $I$.
  *   Lewis claims TWI requires: $I(x, \text{bent-at-}w_1)$.
  *   TWI claims: $I(x, \text{bent})$ is true relative to $w_1$.

  If instantiation is fundamentally a three-place relation $I(x, P, w)$, then having a property is always relative to a world. But this does not make $P$ relational. Consider an analogy from your field: **State Spaces**. In classical mechanics, a particle has a position $q$ and momentum $p$. These are properties of the particle *at a time $t$*. We do not say the particle has the relational property "position-at-$t$." We say the property *position* is instantiated at $t$. The time index is a parameter of the instantiation function, not a constituent of the property itself.

  If we treat possible worlds as indices of instantiation (analogous to times in a four-dimensionalist ontology), then "bent" remains a monadic, intrinsic property. It is simply that the *truth* of the proposition "$x$ is bent" is evaluated relative to a world index. Lewis rejects this because he insists properties must be had *simpliciter* (without indices). But if one accepts modal realism (that other worlds are concrete entities just as real as the actual one), there is no "view from nowhere" where $x$ is bent *simpliciter*. $x$ is only bent relative to the world where that instantiation occurs.

  #### B. Why This Preserves Intrinsicality
  Lewis argues that if $x$'s shape depends on a relation to a world, it isn't intrinsic. The TWI response is that the relation is not to the world *as an object*, but to the world *as a context of evaluation*.

  To use a physics analogy: Consider a field value $\phi$. The value $\phi(x)$ is intrinsic to the point $x$ in the manifold. However, if we change the coordinate system (the "world" of description), the *description* changes. But in modal realism, the worlds are not coordinate systems; they are concrete domains. A better analogy is **phase space**. A system can be in a "liquid phase" region and a "solid phase" region. We do not say "liquid-at-pressure-P" is a relational property that destroys the intrinsic nature of the phase. We acknowledge that the instantiation of the phase is conditional on the region of phase space occupied.

  If TWI treats worlds as distinct concrete domains, then $x$'s being bent in $w_1$ is no more relational than your being in the lab rather than at home. Your location is relational, but your mass is intrinsic. If $x$ is bent in $w_1$, the bentness is intrinsic to $x$ *in that domain*. The fact that $x$ is straight in $w_2$ does not negate the intrinsicality of the bentness in $w_1$; it merely shows that $x$'s total modal profile includes variance.

  Lewis's argument only works if we demand that intrinsic properties be had *absolutely*, across all worlds. But why demand that? If worlds are causally isolated concrete particulars, there is no single "super-world" containing both $w_1$ and $w_2$ where the contradiction would arise. The contradiction only arises if we conflate the perspectives of $w_1$ and $w_2$ into a single unindexed assertion. TWI blocks this by insisting all predication is world-indexed.

  ### 3. The Counterpart Theory Mirror Problem

  Now we turn to the second part of your request: showing that CT does not escape this difficulty but merely relocates it. This is often called the **problem of extrinsic modality**.

  In CT, the statement "Humphrey could have won" is analyzed as:
  $$ \exists w \exists y (In(w, y) \land C(y, \text{Humphrey}) \land Won(y, w)) $$
  Where $C$ is the counterpart relation.

  #### A. The Relational Nature of Counterparthood
  Lewis admits that the counterpart relation $C$ is based on similarity in important respects. Crucially, he admits that "important respects" are context-sensitive and interest-relative.
  *   In one context, biological continuity matters most (I have a counterpart in a world where I lost a limb).
  *   In another, psychological continuity matters most (I have a counterpart in a world where I have different parents).

  This means that whether it is *true* that "I could have won" depends on a relation $C$ holding between me and some distinct individual $y$ in another world.
  *   **TWI:** My modal properties are determined by *me* (I am literally there).
  *   **CT:** My modal properties are determined by *others* (my counterparts).

  #### B. The Loss of Intrinsicality in CT
  If intrinsicality means "having a property in virtue of how one is oneself," CT fails spectacularly for modal properties.
  On CT, whether I *could have won* depends on the existence and nature of individuals *distinct from me* in other worlds. If no sufficiently similar winner exists in any other world, I cannot win. My modal profile is extrinsic; it depends on the distribution of properties across the pluriverse, not just on me.

  Furthermore, because the similarity standard $C$ shifts with context, my modal properties become **context-relative**.
  *   In a strict context, I have no counterparts; I could not have been otherwise.
  *   In a loose context, I have many counterparts; I could have been many things.

  This makes modal properties strangely unstable. In TWI, if I am bent in $w_2$, I am bent in $w_2$ regardless of what anyone thinks. In CT, whether "I could be bent" is true depends on whether the conversational context allows a loose enough similarity standard to count a bent individual as *me*.

  #### C. Relocating the Relativization
  Recall Lewis's objection to TWI: relativizing property instantiation to a world makes properties relational.
  Look at CT: relativizing *identity* to a similarity standard makes *de re* modality relational.
  *   **TWI Cost:** We must accept that instantiation is world-indexed ($P$-at-$w$).
  *   **CT Cost:** We must accept that identity conditions are world-and-context-indexed ($Counterpart$-at-$w$-under-standard-$S$).

  Lewis argues the TWI cost is fatal because it destroys intrinsicality. But the CT cost is arguably higher. In TWI, the property *bent* remains intrinsic; only its *instantiation* is indexed. In CT, the property *possibly-bent* is not intrinsic to me at all; it is a relation between me and a counterpart.

  If the goal is to preserve the intuition that objects have intrinsic natures that ground their possibilities, TWI does a better job. In TWI, my possibilities are grounded in my own existence in other worlds. In CT, my possibilities are grounded in the existence of *other* objects that resemble me.

  ### 4. Synthesis: Why the Argument is Indecisive

  To conclude rigorously: The argument from accidental intrinsics fails to prefer CT over TWI because it relies on a premise that CT violates in a different form.

  1.  **The Premise:** "A theory of modality should not make intrinsic properties (or properties grounded in them) into relations."
  2.  **TWI Compliance:** TWI preserves the intrinsicality of *bent*. It relativizes the *instantiation*. One can argue that instantiation is *always* relative to a domain of quantification. In a modal realist ontology, "actual" is indexical. Therefore, "is bent" is implicitly "is bent in this world." There is no contradiction in $x$ being bent in $w_1$ and straight in $w_2$ any more than there is in $x$ being bent at $t_1$ and straight at $t_2$. The "relation" to the world is no more objectionable than the "relation" to a time.
  3.  **CT Violation:** CT preserves the non-relational nature of instantiation (in each world, $y$ is just bent) but makes the *modal attribution* to the original subject ($x$) thoroughly relational. "Possibly bent" becomes "Has a counterpart that is bent." This makes the modal properties of $x$ extrinsic, dependent on the existence of distinct entities $y$ and the context-sensitive relation $C$.

  **The Verdict:**
  Lewis's argument assumes that relativizing instantiation is worse than relativizing identity. But for a physicist, the TWI view looks remarkably like **many-worlds** or **state-vector** realism: the object (the wavefunction or the world-tube) has different properties at different indices (worlds or times). The "problem" is only a problem if one insists on a "view from nowhere" that sums up the object across all worlds simultaneously. If one accepts that existence is world-bound (even for the same individual), the contradiction vanishes without needing counterparts.

  Conversely, CT introduces a new layer of metaphysical machinery (the counterpart relation) that is vague, context-sensitive, and makes *de re* modality extrinsic. If the worry about accidental intrinsics is that we shouldn't turn properties into relations, CT turns *modal facts about individuals* into relations.

  Therefore, the problem of accidental intrinsics does not settle the debate. It merely forces a choice between two types of relativization:
  1.  **TWI:** Relativize the *having* of properties (Indexical Instantiation).
  2.  **CT:** Relativize the *identity* of the subject (Contextual Counterparts).

  There is no non-question-begging reason to think (1) is metaphysically worse than (2). In fact, given your background, (1) may seem more natural: it treats worlds as parameters of the physical state, rather than treating identity as a matter of fuzzy similarity metrics. The member of your group who thought the debate settled likely underestimated the cost CT pays in making *all* modal properties extrinsic and context-dependent.

  ### Summary for the Reading Group
  If you wish to present this to your group, I suggest this formulation:

  > "Lewis argues that Transworld Identity turns intrinsic properties into relations to worlds. But Counterpart Theory turns modal properties into relations to *counterparts*. Both views must relativize something to handle modal variance. TWI relativizes the copula ('is bent at $w$'); CT relativizes the subject ('someone like me is bent'). Lewis claims the former destroys intrinsicality. But the latter destroys the intrinsic nature of *possibility* itself, making what is possible for me depend on the existence of distinct individuals and the vagaries of conversational context. Since both theories incur a relativization cost, the Argument from Accidental Intrinsics cannot decisively favor CT unless we arbitrarily decide that relativizing instantiation is worse than relativizing identity. Given that we already relativize instantiation to time without losing intrinsicality, there is no principled reason to reject doing so for worlds."
