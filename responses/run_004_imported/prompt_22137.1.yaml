      *   *Correction:* I need to emphasize the "Adverbial" theory of instantiation. It's not $R(x, w, bent)$, it's $Bent(x)$-at-$w$. The 'at' modifies the having, not the property.
      *   *Check:* Did I address the CT similarity problem?
      *   *Correction:* Yes, emphasize that similarity is vague and context-dependent, making modal truths about *me* depend on external conversational contexts, which is a form of extrinsicality.
      *   *Check:* Is the physicist analogy appropriate?
