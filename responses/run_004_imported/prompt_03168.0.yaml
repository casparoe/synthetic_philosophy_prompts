prompt: |-
  So this semester I'm taking a 19th century philosophy seminar and we've spent way more time on Kierkegaard than I expected (I thought it'd basically just be a week on Fear and Trembling and then we'd move on). I definately didn't expect it to make me think about stuff happening on my own campus, but something went down a few weeks ago that I can't stop turning over in my head, even though I'm not sure it even connects to what we're reading, so tell me if I'm off base here.

  We have this anonymous app that basically everyone at my school uses, kind of like Yik Yak or Sidechat if you know those, where people post whatever's on their mind and everyone else can upvote and comment anonymously. A couple weeks ago someone screenshotted a dumb, kind of insensitive joke a girl in my econ class made at a party and posted it, and within like a day the entire app was just about her. Hundreds of comments, people making memes out of it, "expose"-style posts, people who have never even met her saying she should be reported to the school, other people jumping in to defend her, this whole massive back-and-forth - and then by the next week it had already burned itself out and everyone had moved on to complaining about the dining hall. She didn't even find out the full scale of it until it was basically already over, so she never got to actually respond to any of it while it was happening, it was like an entire trial about her that took place somewhere she wasn't even invited. I'll admit I scrolled through most of it myself, and even upvoted a comment or two without really thinking, and only felt kind of gross about it afterward.

  What's been bugging me is that I can't figure out who was actually "responsible" for any of it, or even what to call what happened. It wasn't exactly gossip, but it also wasn't like anyone was in charge or accountable either - it just sort of happened and then dissolved on its own, and hardly anyone would've said any of it to her face. Is there an actual, precise way of thinking about what was going on there (beyond a generic "social media is bad" take), and maybe what it says about people like me who end up going along with stuff like that without ever really deciding to?
