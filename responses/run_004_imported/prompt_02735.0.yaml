          *   *Equality:* Douglass wanted *equal* protection. If modern gun laws disproportionately disarm Black victims of crime while leaving armed aggressors (or privileged groups) untouched, would Douglass support striking them down? Or would he support regulations that ensure safety if they are applied equally?
