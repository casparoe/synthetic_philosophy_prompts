      *   *The Anvil Problem:* If an agent doesn't model its own physical substrate as part of the environment it can affect/be affected by, it ignores threats to its existence.
      *   *The Tiling Problem:* If an agent wants to create a successor, it needs to trust the successor's reasoning. But if the successor uses the same logic, Gödel's incompleteness theorem suggests the parent can't prove the successor's soundness without weakening its own logic (Löb's Theorem).

