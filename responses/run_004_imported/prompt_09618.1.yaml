answer: |-
  **The Garden and the Gatekeeper: Why the Replication Crisis Isn't About P-Values**

  The story everyone wants to tell about the replication crisis is a morality play with a clear villain and a ready savior. The villain is Null-Hypothesis Significance Testing (NHST), specifically the bright-line threshold of *p* < .05. The savior is Bayesian statistics. In this narrative, the frequentist framework is a rigid, binary trap that encourages researchers to torture data until it confesses significance. The Bayesian alternative, by contrast, offers a continuous measure of evidence, incorporates prior knowledge, and ostensibly frees scientists from the tyranny of the threshold.

  It is a comforting story. It suggests that the crisis was a technical error, solvable by updating our software packages and rewriting our textbooks. But after weeks of speaking with statisticians on the front lines of the reform movement, a more unsettling picture has emerged. The most thoughtful Bayesians are not cheering for their own ascendancy. They are pointing at the researcher.

  The debate is no longer about frequentist versus Bayesian math. It is about whether the replication crisis is a failure of *paradigm* or a failure of *process*. To fix science, we must decide which it is.

  ### The Case for the Paradigm Problem

  The argument that NHST is the root cause is powerful because it identifies a specific mechanism of corruption: the dichotomization of uncertainty.

  Under the frequentist regime, a result is either "significant" or it is not. This binary output collides catastrophically with the academic incentive structure. A *p*-value of .049 gets published; .051 goes in the file drawer. This creates a "cliff effect" where the difference between noise and discovery is a single decimal point. Critics argue this doesn't just encourage p-hacking; it mandates it. If your career depends on crossing the line, and the line is arbitrary, you will move the line or move the data.

  Furthermore, the pedagogy of p-values is fundamentally broken. Researchers routinely interpret the *p*-value as the probability that the null hypothesis is true, or the probability that the result is a fluke. It is neither. It is the probability of observing data this extreme *assuming* the null is true. This confusion allows scientists to treat a *p* < .05 result as a verified fact rather than a tentative signal.

  Proponents of the Bayesian shift argue that moving to Bayes factors or posterior distributions dissolves the cliff. Evidence becomes a gradient. A Bayes factor of 3 is weak evidence; 10 is strong; 100 is decisive. There is no bright line to hack. Additionally, Bayesian methods force the researcher to be explicit about priors. By stating what they believe before seeing the data, researchers theoretically expose their biases to the light. In this view, the crisis is indeed a statistical one: we used the wrong calculus for uncertainty, and the bill has come due.

  ### The Case for Paradigm Neutrality

  The counter-argument, championed by statisticians like Andrew Gelman and Eric Loken, is that the math is innocent. The guilt lies in the "Garden of Forking Paths."

  In any complex study, a researcher faces hundreds of defensible choices. How do we code this variable? Do we exclude outliers based on standard deviations or interquartile ranges? Do we control for age? Do we stop data collection after 50 subjects or 100? In a frequentist framework, these choices can be tuned to minimize the *p*-value. But Gelman and Loken's insight is that researchers do not need to consciously "fish." They simply navigate the garden, taking the path that looks most promising at each fork, until they arrive at a result that tells a coherent story.

  Crucially, this flexibility is not unique to NHST. A Bayesian analyst faces the same garden. They can tune their priors until the posterior looks desirable. They can swap likelihood functions. They can choose which hierarchical structure to impose on the data. If you peek at the data before choosing your prior, you have contaminated the Bayesian update just as surely as a frequentist contaminates a *p*-value. This is "prior-hacking," and it is just as potent as p-hacking.

  Moreover, publication bias is paradigm-neutral. Journals want positive, clean stories. If a Bayesian analysis yields a diffuse posterior indicating massive uncertainty, it is just as likely to be rejected as a non-significant *p*-value. If the incentive is to publish a finding, a researcher will find a model—Bayesian or frequentist—that produces one. As one statistician told me, "If you give a determined researcher a Bayesian toolkit, they will not produce truth. They will produce a very sophisticated justification for what they wanted to believe."

  ### The Verdict

  The paradigm-neutral argument is the stronger of the two. While NHST certainly exacerbated the crisis by providing a false sense of objectivity and a convenient binary threshold, swapping the statistical engine will not fix a car with a drunk driver.

  The evidence for this is empirical. We now have access to large-scale replication projects and preregistered studies that utilize diverse statistical methods. The replication rate remains stubbornly low even in fields adopting Bayesian methods, provided the underlying incentives and study designs remain unchanged. The "Garden of Forking Paths" explains a wider variance in the crisis than the choice of test statistic. It accounts for why high-powered, well-funded labs produce unreplicable results, and why "significant" findings often vanish when the sample size doubles.

  The crisis is not that we calculated the probability of the data wrong. The crisis is that we treated a single, contingent analysis of noisy data as a definitive discovery. NHST made this easier to do, but Bayesianism does not make it impossible. To believe that switching to Bayes will solve the replication crisis is to commit the same error that caused it: searching for a technical fix to a human problem.

  ### What Must Change in Statistical Practice

  If the problem is not the formula but the flexibility, then the solution is not a new formula, but a constraint on flexibility. However, this requires more than just procedural changes like preregistration (which can be gamed) or cultural shifts in incentives (which are slow). We need concrete changes to *statistical practice* itself.

  **1. Abandon the "One True Model" Standard**
  Currently, a paper presents one analysis. This implies the researcher knew the correct path through the garden in advance. Statistical practice must shift to require **Multiverse Analysis** (or Specification Curve Analysis). Researchers should report the distribution of results across all defensible analytical choices. If a finding holds only when outliers are excluded and a specific covariate is added, the multiverse plot will show the effect collapsing to zero in most other specifications. This should be standard for both Bayesian and frequentist reporting.

  **2. Mandatory Sensitivity Analysis for Priors**
  For Bayesian reporting, the prior cannot be a black box. It is not enough to state a prior; researchers must demonstrate how the posterior shifts under a range of reasonable priors. If a result is robust, it should survive a shift from an informative to a weakly informative prior. If the conclusion depends entirely on a specific prior choice, that is not a discovery; it is an assumption.

  **3. Blinded Analysis**
  One of the most effective statistical safeguards is to analyze data without knowing which group is which. By labeling conditions "A" and "B" during the cleaning and modeling phase, researchers prevent themselves from unconsciously steering the analysis toward a desired outcome. This is a statistical workflow change that directly addresses the "forking paths" problem by removing the researcher's ability to see the destination while choosing the path.

  **4. Estimation Over Testing, Regardless of Paradigm**
  Whether using p-values or Bayes factors, the focus must shift from "Is there an effect?" to "How big is the effect and how uncertain are we?" Confidence intervals and credible intervals should be the primary visual and textual focus, not the test statistic. A narrow interval around zero is a meaningful result; a wide interval around a large effect is a call for more data, not a press release.

  ### Conclusion

  The replication crisis was not caused by a misunderstanding of conditional probability. It was caused by a misunderstanding of science. We treated exploratory data analysis as confirmatory hypothesis testing. We treated convenience samples as representative populations. We treated noisy estimates as facts.

  Changing from frequentist to Bayesian methods without addressing these behaviors is like switching from a gasoline engine to an electric motor in a car that has no brakes. The engine is cleaner, but the crash is inevitable. The fix is not to change the math we use to justify our conclusions. It is to change the way we build them, acknowledging that every choice in the garden matters, and that the only way to find the path is to map them all.
