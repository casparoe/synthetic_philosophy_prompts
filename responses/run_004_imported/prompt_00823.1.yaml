      *   The feeling is valid. It's not about the code; it's about fairness and consistency.

  4.  **Formulate the Advice:**
      *   **Validate the User:** Acknowledge that their feeling is legitimate. It *is* frustrating when leaders don't model expected behavior.
      *   **Separate the Issues:** Distinguish between the *code quality issue* (missing tests) and the *leadership issue* (hypocrisy/communication).
