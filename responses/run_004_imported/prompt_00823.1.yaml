answer: |-
  Your feeling that something is "off" is valid. You are not just deflecting fair feedback, but you also aren't entirely right in how you framed it.

  This is a classic clash between **technical correctness** and **leadership integrity**. To untangle this, we need to separate the code issue from the people issue.

  ### 1. The Technical Reality (Where the Lead is Right)
  Logically, your team lead is correct: **Two wrongs do not make a right.**
  If the team standard is "write tests," then you breaking that standard is a problem, regardless of whether he breaks it too. If you merge untested code, you introduce risk. Pointing out his hypocrisy doesn't remove the risk from your code.

  If you stop there, yes, you are deflecting. The quality of your work is your responsibility.

  ### 2. The Leadership Reality (Where You are Right)
  However, software engineering isn't just logic; it's a team sport. Leadership relies heavily on **modeling behavior**.
  *   **Trust:** When a leader sets a rule they don't follow, it erodes trust. It makes the rules feel arbitrary or punitive rather than protective.
  *   **Psychological Safety:** Saying "it's sloppy" is harsh. If he skips tests without that same criticism, it creates a double standard that makes you feel like a second-class citizen on the team.
  *   **Culture:** Culture is defined by what is tolerated. If he tolerates it in himself but punishes it in you, the culture becomes "do what I say, not what I do."

  **This is why it feels off.** It feels like an abuse of power dynamics. You are being held to a standard that the standard-bearer doesn't respect.

  ### 3. The Missing Context (The "Why")
  Before you decide he's a hypocrite, consider if there is a technical nuance you missed. Are his PRs actually comparable to yours?
  *   **Hotfixes:** Was he fixing a production outage where speed was critical and tests were added later?
  *   **Refactors:** Was he moving code without changing logic, making tests less critical?
  *   **Config/Docs:** Was he changing a config file or documentation where unit tests don't apply?
  *   **Legacy Code:** Was he touching a part of the system so brittle that adding tests was out of scope for that specific PR?

  If his PRs were fundamentally different types of work, then his criticism stands. If his PRs were feature work identical to yours, then his behavior is inconsistent.

  ### 4. How to Handle This
  You don't have a comeback for "me not doing it doesn't make it ok for you," because logically, he's right. But you can change the conversation from **defensiveness** to **alignment.**

  **Step 1: Own your part.**
  Acknowledge the technical feedback.
  > "You're right, I should have included tests for that change. I'll make sure to cover that moving forward."

  **Step 2: Seek clarity, don't accuse.**
  Instead of saying "But you skip tests," ask about the standard. This forces him to articulate the rule without you sounding accusatory.
  > "I want to make sure I'm aligned with the team's expectations. I noticed some recent PRs didn't have tests, so I wasn't clear on where the hard line is. Can we define exactly when tests are mandatory vs. optional? I want to make sure I'm not slowing down on trivial changes, but also not merging sloppy code."

  **Step 3: Observe the pattern.**
  *   **Best Case:** He realizes he set a bad example. He might say, "Actually, you caught me. I've been rushing lately, but you're right, we should both be better about this."
  *   **Middle Case:** He explains the context (e.g., "Those were hotfixes"). Now you know the exception criteria.
  *   **Worst Case:** He doubles down, gets defensive, or continues to treat you differently than himself.

  ### The Verdict
  You are not just deflecting. You identified a **consistency issue**, but you raised it as a **defense** rather than a **process improvement.**

  *   **Was the feedback on the code fair?** Probably yes. Merging without tests is risky.
  *   **Was the delivery fair?** "Sloppy" is a loaded word. Constructive feedback focuses on the code, not the person.
  *   **Is his behavior problematic?** Yes. Leaders lose respect when they don't follow the rules they enforce.

  **Advice:** Fix your testing habit immediately. Don't give him ammunition on the technical front. Once your code is bulletproof, if he continues to hold you to a standard he ignores, you have data to take to a manager or HR about inconsistent performance expectations. But for now, win on the technicals so you have the standing to question the culture.
