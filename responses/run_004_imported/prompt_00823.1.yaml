      *   **Leadership/Management Side:** The lead's behavior (hypocrisy, harsh tone) is the real issue here. "Do as I say, not as I do" undermines trust and psychological safety.
      *   **The "Whataboutism" Trap:** The user's comeback ("but you do it too") is a classic deflection tactic. It doesn't fix the user's mistake, but it highlights an inconsistency in standards.
