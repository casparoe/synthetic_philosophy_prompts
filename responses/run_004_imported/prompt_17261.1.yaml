prompt: |-
  One of my favorite former grad students is getting married in a few weeks and asked me to give the toast, which is a little terrifying -- half the room is my department and will catch every reference, the other half is her family, who as far as I know have never discussed ethics on purpose in their lives. Here's what I want to build it around: she's an animal-welfare utilitarian who thinks eating meat is a real wrong but never gave much thought to flying; her fiance thinks flying is a real climate wrong but has zero qualms about a burger; and somewhere in the last few years together they basically struck a moral trade -- he went vegetarian, she barely flys anymore -- without either one changing their mind about the other's issue at all. (I think this is basically the Toby Ord thing, gains from trade across a moral disagreement instead of within a market.) I want the toast to use that idea to say something true and a little moving about the two of them, but it can NOT come across as "they compromised their principles for each other," since that's exactly backwards and would honestly annoy both of them a bit -- the whole point of a moral trade is that nobody waters anything down. Can you write me something like a five-minute toast that pulls this off for both halves of the room?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Former grad advisor/professor.
      *   **Audience:** 50% Academic Department (will catch ethics/philosophy references), 50% Family (laypeople, likely unfamiliar with ethical theory).
      *   **Honorees:** Former grad student (Bride) and Fiance (Groom).
      *   **Core Story:** Bride is an animal-welfare utilitarian (no meat, flies okay). Groom is a climate activist (no flying, eats meat). They made a "moral trade": He went vegetarian, she stopped flying. Neither changed their mind about the *other's* issue, but they adopted the other's priority for the sake of the partnership.
      *   **Key Constraint:** Do *not* frame this as "compromising principles." It must be framed as "gains from trade" or "amplifying impact through partnership." It needs to be moving, true, and accessible to both halves of the room.
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).
      *   **Tone:** Warm, witty, intellectual but not alienating, sincere.

  2.  **Deconstruct the "Moral Trade" Concept:**
      *   *The Trap:* Calling it a "compromise" suggests both gave up something they believed was right.
      *   *The Truth:* They recognized that their partner's conviction was strong enough to warrant action, even if they didn't share the exact same theoretical foundation. It's about respecting the *person* enough to adopt their *cause*.
      *   *The Toby Ord Reference:* The prompt mentions Toby Ord (Effective Altruism/Global Priorities Institute). He talks about "moral trades" where agents with different utility functions cooperate to achieve better overall outcomes. I need to hint at this for the academics without losing the family.
      *   *The Metaphor:* Needs to be relational. Marriage isn't a negotiation table; it's a shared project.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (advisor), the honor, and the split audience. Set a warm tone.
      *   **The Academic Hook (for the dept):** Briefly mention her field (ethics/animal welfare) but keep it light.
      *   **The Conflict/Setup:** Describe their individual moral stances before they met. (Her: Meat = Bad. Him: Flying = Bad.)
      *   **The Resolution (The Trade):** Explain what happened. He stopped eating meat. She stopped flying.
      *   **The Interpretation (The Crux):** This is the dangerous part. How to explain it without "compromise"?
          *   *Idea:* It's not about diluting beliefs. It's about expanding responsibility.
          *   *Idea:* Love makes the other person's burden your own.
          *   *Idea:* Efficiency. Together they do more good than apart.
      *   **The Family Bridge:** Translate the "moral trade" into "marriage language." Supporting each other's dreams/values.
      *   **Closing:** A wish for the future. A toast.

  4.  **Refining the Tone (Balancing the Room):**
      *   *For the Dept:* Use terms like "utility," "moral weight," "cooperation." Maybe a subtle nod to Pareto improvements.
      *   *For the Family:* Use terms like "support," "sacrifice," "growing together," "making the world better."
      *   *Avoid:* Jargon like "deontological," "consequentialist," "Pareto optimal" (unless explained immediately).
      *   *Key Phrase:* "They didn't meet in the middle. They expanded the circle."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I taught [Bride]. She's smart. She cares about animals. [Groom] cares about climate. They disagreed. Then they got together. He stopped eating burgers. She stopped flying to Europe. Some might say they compromised. I say they optimized. In marriage, you take on each other's burdens. That's love. Cheers.

      *Critique 1:* Too dry. Needs more emotion. The "optimized" bit sounds too robotic for the family. Need to emphasize *respect* rather than *calculation*.

  6.  **Drafting - Iteration 2 (Adding Heart):**
      Start with the fear of speaking to two crowds. Tell the story of their ethics. She wouldn't eat cows. He wouldn't burn jet fuel. Then, the magic happened. They swapped. Why? Because they love each other. For the academics, this is a moral trade. For the family, this is marriage. They didn't water down their beliefs. They doubled their impact.

      *Critique 2:* Better. Need to make sure the "not compromising" point lands hard. The prompt specifically says "it can NOT come across as 'they compromised their principles'." I need to explicitly state what they *didn't* do.

  7.  **Finalizing the Content (incorporating the Toby Ord vibe without name-dropping necessarily):**
      *   Focus on the concept of "Gains from Trade."
      *   Make sure the family understands that "trade" here means "gift," not "business deal."
      *   Highlight that they didn't convince each other they were *right* theoretically, but they acted *as if* they were, out of love.

  8.  **Writing the Toast (incorporating the above):**
      *   *Intro:* Acknowledge the split room.
      *   *Body:* The specific ethical stances. The change.
      *   *The Pivot:* Why this matters. It's not compromise; it's solidarity.
      *   *Conclusion:* The wish for the future.

      *(Self-Correction during drafting)*: I should be careful not to make the Groom sound like he *only* cares about climate and the Bride *only* about animals. Frame it as their primary "hill to die on" before meeting.
      *(Refining the "Compromise" line)*: Use the phrase "meet in the middle" as the thing they *avoided*. Instead, they "walked in each other's shoes."

  9.  **Review against constraints:**
      *   5 minutes? (Word count check: ~750 words is about 5 mins at 150 wpm).
      *   Dept satisfied? (Yes, ethics references are there).
      *   Family satisfied? (Yes, translated into relationship terms).
      *   No "compromise" framing? (Yes, emphasized "adoption" and "solidarity").

  10. **Final Polish:** Check rhythm and flow. Ensure the toast at the end is clear. (Proceeds to generate output).

  **(Post-Drafting Thought):** I need to make sure I don't get *too* technical with the Toby Ord reference. Better to describe the *concept* of gains from trade without necessarily name-dropping unless it feels natural. Actually, name-dropping Toby Ord might be a nice wink to the department that flies over the family's head harmlessly. I'll include it as a subtle nod.

