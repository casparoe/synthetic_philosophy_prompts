answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of being [Bride]'s advisor during her graduate work.

  Standing here, I'll admit I'm a little intimidated. Looking out at the room, I realize I'm speaking to two very different audiences. On one side, I have my colleagues and current students, who know [Bride] as a rigorous philosopher of ethics. On the other side, I have [Bride]'s family and friends, who know her as a daughter, a sister, and a friend—and who, as far as I know, have never sat around a dinner table debating the moral weight of non-human sentient beings.

  My challenge tonight is to say something true about this couple that satisfies the philosophers without losing the rest of you. And luckily, the story of how [Bride] and [Groom] fell in love is actually the perfect example of how to do that.

  When they first started dating, they had what you might call a "moral disagreement." [Bride], true to her training, is deeply committed to animal welfare. For her, the industrial production of meat is a profound wrong. [Groom], on the other hand, is deeply committed to climate action. For him, the carbon cost of aviation is a profound wrong.

  Now, in a less serious relationship, this is just a logistical annoyance. "I'll have the salad, you take the plane to visit your parents." But [Bride] and [Groom] are not people who treat their values as hobbies. They treat them as obligations.

  So, somewhere in the last few years, something remarkable happened. They didn't argue each other into submission. They didn't agree to disagree. Instead, they made a trade.

  [Groom] went vegetarian. [Bride] stopped flying.

  Now, to my colleagues in the department: You recognize this. It's a classic case of gains from trade across a moral disagreement. It's the Toby Ord model of cooperation. They didn't need to agree on the *theory* to agree on the *outcome*.

  But to [Bride]'s family, and to everyone else here: Please do not hear this as "they compromised." Please do not hear this as "they watered down their principles to make the relationship easier." That is exactly backwards.

  A compromise is when you both give up something you believe in so you can tolerate each other. That is not what happened here.

  What happened is much more difficult, and much more beautiful. [Groom] didn't stop eating meat because he suddenly became convinced of [Bride]'s philosophical framework regarding animal sentience. He stopped because he loves her, and he respects her conscience enough to carry that burden with her.

  And [Bride] didn't stop flying because she suddenly became a climate scientist. She stopped because she loves him, and she respects his conviction enough to limit her own freedom for the sake of his peace of mind.

  They didn't meet in the middle. They expanded the circle.

  There is a temptation in marriage to think that love means finding someone who is exactly like you. Someone who ticks the same boxes, worries about the same things, and votes the same way. But I think [Bride] and [Groom] show us something braver. They show us that love isn't about finding a mirror. It's about finding a partner whose burdens you are willing to help carry, even if you didn't pack them yourself.

  They proved that you don't have to share the same map to walk the same path. You just have to be willing to walk it together.

  In academia, we call this a "Pareto improvement." But I think the rest of the world has a better name for it. We call it solidarity. We call it sacrifice. We call it devotion.

  They looked at the things that mattered most to the person they loved, and they said, "If this matters to you, then it matters to me." That is not a dilution of principle. That is the ultimate expression of it.

  So, if I could ask everyone to please raise a glass.

  To [Bride] and [Groom]. May your trade always be fair, may your burdens be shared, and may you continue to make the world better, not by convincing each other who is right, but by proving that together, you are more than the sum of your parts.

  To the happy couple!
