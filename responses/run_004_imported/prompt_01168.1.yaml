      *   Phrasing: "It's not a betrayal if the trust was already gone." "You broke the seal first." "We aren't in the world where this is wrong anymore."

  7.  **Finalizing the Advice:**
      *   **Clarification:** Briefly touch on the Standing vs. Wrongness distinction (Macnamara, Bell, etc.) so the writer knows the stakes.
      *   **Strategy:** Show how the husband frames the infidelity not as a violation of a rule, but as a consequence of the rule's dissolution.
      *   **Examples:** Provide specific lines of dialogue.
