answer: |-
  This is a fascinating dramatic challenge. To achieve the specific philosophical nuance you are looking for, you have to navigate a subtle distinction.

  In moral philosophy, there is a debate between **standing to blame** (you can't say it because you did it) and **wrongness of the act** (what I did isn't actually wrong because you did it). Most philosophers argue hypocrisy only removes *standing*. However, for your scene, you want the husband to argue that the **moral obligation itself was conditional**, and since she breached the condition, his action ceased to be a violation.

  He needs to argue that the marriage contract (explicit or implicit) was reciprocal. If she opted out of the exclusivity clause, he wasn't "breaking the rules"; he was simply acting in a world where the rules no longer applied. He isn't saying, "You can't speak." He is saying, "There is nothing to speak *about*."

  Here are three ways to phrase this rebuttal, depending on your husband's character voice, along with an analysis of why they work.

  ### Option 1: The "Voided Contract" Approach
  *Best for a character who is logical, cold, or legalistic.*

  > "Don't look at me like I'm the one who broke something. You think this is a betrayal? A betrayal implies I broke a promise we were still keeping. But you tore up your end of that agreement long before I ever touched her. I didn't violate our marriage, Elena. I just stopped pretending it was still there."

  **Why it works:** It reframes the affair from an *active violation* to a *passive acknowledgment of reality*. He isn't claiming he has a right to cheat; he is claiming the state of "faithfulness" had already ceased to exist, making his action morally neutral.

  ### Option 2: The "Moral Equilibrium" Approach
  *Best for a character who is emotional, hurt, or feels a sense of justice.*

  > "You're angry? No. You're shocked that I found out. You want to call this a sin, but you don't get to define the morality of this house alone. When you slept with him, you changed what fidelity meant between us. You made it optional. So don't call me a cheater. I'm just the mirror you're finally looking into. There's no guilt here. Not anymore. You spent it."

  **Why it works:** This captures your specific philosophical constraint. It suggests that "blame" is a finite resource or a currency. By spending her moral capital on her own affair, she didn't just lose the right to judge; she depleted the moral gravity that would make his act "wrong."

  ### Option 3: The "Dissolved Norm" Approach
  *Best for a character who is weary or resigned.*

  > "Stop. Just stop. You're trying to hold me to a standard you decided didn't matter. If we were playing a game where only one of us was allowed to break the rules, then sure, blame me. But we aren't. You walked off the field months ago. I just stopped playing too. That's not a crime, Sarah. That's just... stopping."

  **Why it works:** This uses the analogy of a game. If one player abandons the rules, the other player continuing to follow them isn't "virtuous," and breaking them isn't "cheating"—it's just the end of the game. It posits that the blameworthiness is contingent on the game still being active.

  ### A Note on the Philosophy for Your Drafting
  To make this land precisely as you intend, avoid language that focuses on **her voice** (e.g., "You can't say that," "Who are you to talk?"). Instead, focus entirely on **the nature of the act**.

  *   **Avoid:** "You have no standing." (This admits he did wrong, but she can't judge.)
  *   **Use:** "There is no wrong here." (This denies the blameworthiness entirely.)

  The key is for him to sound like he is correcting a **factual error** in her assessment, not attacking her **authority**. He should sound like a mathematician telling her that 2 + 2 does not equal 5, rather than a criminal telling a judge he has no jurisdiction.

  **Example of the distinction in action:**

  *   *Wrong (Attacking Authority):* "You slept with Mark! You don't get to be mad at me."
  *   *Right (Attacking the Wrongness):* "You slept with Mark. So what I did wasn't infidelity. It was just... matching your energy. You can't be victimized by a rule you already broke."

  By framing it as "matching energy" or "acknowledging reality," he removes the moral sting of his own action, fulfilling your goal that he is "simply wrong that I have done anything blameworthy."
