      *   Ilana is using a *semantic/intentional* notion of representation (aboutness + system usage).
      *   They are debating *degrees of freedom* vs. *ontological status*.
      *   Key missing concept: **The Homunculus Fallacy vs. Distributed Processing.** Ilana wants a "little man" reading the state; Nathan says the causal flow *is* the reading.
      *   Key missing concept: **Levels of Analysis.** Marr's levels. Nathan is at the Algorithmic/Implementational boundary; Ilana is at the Computational/Intentional level.
