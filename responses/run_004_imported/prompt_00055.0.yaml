  2.  **Initial Knowledge Retrieval & Definitions:**
      *   *Strict Dominance (Pure):* Strategy $A$ dominates $B$ if $u(A, s_{-i}) > u(B, s_{-i})$ for all opponent profiles $s_{-i}$.
      *   *Strict Dominance (Mixed):* Strategy $B$ is dominated if there exists a probability distribution $\sigma$ over other strategies such that $u(\sigma, s_{-i}) > u(B, s_{-i})$ for all $s_{-i}$.
      *   *IESDS:* The process of removing dominated strategies, updating the game, and repeating.
      *   *Rationalizability:* Strategies that survive IESDS are rationalizable (in two-player games).
      *   *Nash Equilibrium (NE):* NE strategies are never strictly dominated. IESDS never eliminates NE.

  3.  **Brainstorming Implications (The "Why does this matter?" phase):**
