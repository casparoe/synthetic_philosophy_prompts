answer: |-
  The Iterated Elimination of Strictly Dominated Strategies (IESDS) is a foundational solution concept in game theory. When extended from **pure strategies** to **mixed strategies**, its predictive power increases significantly.

  The core distinction is that a strategy $s_i$ is strictly dominated in mixed strategies if there exists a probability distribution $\sigma_i$ over other strategies such that $\sigma_i$ yields a higher expected payoff than $s_i$ against *every* possible combination of opponent strategies. Crucially, $\sigma_i$ might not correspond to any single pure strategy.

  Here are the most important implications of allowing mixed strategies in IESDS for predicting play:

  ### 1. Increased Predictive Precision (Larger Reduction of Strategy Space)
  The most immediate implication is that **more strategies are eliminated.**
  *   **Pure IESDS:** A strategy is only removed if another *single* strategy beats it in every contingency.
  *   **Mixed IESDS:** A strategy is removed if a *weighted average* of other strategies beats it in every contingency.

  Since the set of mixed strategies includes all pure strategies (as degenerate probabilities), any strategy eliminated by pure IESDS is also eliminated by mixed IESDS. However, the converse is not true. Mixed IESDS identifies strategies as irrational that pure IESDS misses.
  *   **Implication for Prediction:** The set of surviving strategies is smaller. This narrows the range of plausible outcomes, allowing for sharper predictions about how rational agents will behave. In some games, pure IESDS eliminates nothing, while mixed IESDS solves the game entirely.

  ### 2. Equivalence to "Never Best Response" (Pearce's Lemma)
  The most profound theoretical implication is the link between dominance and best responses.
  *   **Theorem:** A pure strategy is strictly dominated by a **mixed** strategy if and only if it is **never a best response** to any belief (probability distribution) the player might hold about the opponents' actions.
  *   **Contrast:** A strategy might not be dominated by any *pure* strategy but could still be a best response to some specific belief. However, if it is dominated by a *mixed* strategy, there is **no belief** under which playing that strategy is rational.
  *   **Implication for Prediction:** This validates IESDS (mixed) as the rigorous mathematical formalization of "rational behavior." If we assume players maximize expected utility based on some belief about opponents, they will never play a strategy eliminated by mixed IESDS. Therefore, predicting play requires excluding these strategies entirely.

  ### 3. Characterization of Rationalizability
  In two-player games, the set of strategies that survive IESDS (mixed) is exactly the set of **rationalizable strategies**.
  *   **Definition:** Rationalizable strategies are those that survive the iterative assumption that "I am rational, you are rational, I know you are rational, you know I am rational..." (Common Knowledge of Rationality).
  *   **Implication for Prediction:** Mixed IESDS defines the absolute boundary of what rational players can do. Any strategy eliminated by this process is inconsistent with Common Knowledge of Rationality. Therefore, if you observe a player using a strategy eliminated by mixed IESDS, you must conclude either they are not rational, or they do not believe their opponent is rational.

  ### 4. Preservation of Nash Equilibria
  While mixed IESDS eliminates more strategies than pure IESDS, it retains a critical safety property: **It never eliminates a Nash Equilibrium (NE).**
  *   **Logic:** In a Nash Equilibrium, every player is playing a best response to the others. Since strategies eliminated by mixed IESDS are *never* best responses (see point 2), no NE strategy can be eliminated.
  *   **Implication for Prediction:** This makes mixed IESDS a safe "pre-processing" step for finding Nash Equilibria. You can simplify the game matrix significantly by removing mixed-dominated strategies without fear of discarding valid equilibrium solutions. It reduces the computational burden of finding equilibria in complex games.

  ### 5. Order Independence
  Like pure strict dominance, mixed strict dominance is **order-independent**.
  *   **Meaning:** It does not matter in which sequence you eliminate the dominated strategies. The final set of surviving strategies will always be the same.
  *   **Implication for Prediction:** This ensures the prediction is robust. Different analysts can process the game differently and arrive at the same conclusion regarding which strategies are viable. (Note: This is not true for *weak* dominance, which is why strict dominance is preferred for robust predictions).

  ### 6. Implications for Zero-Sum Games
  In two-player zero-sum games, mixed IESDS is particularly powerful.
  *   **Result:** If a zero-sum game has a unique solution (a saddle point in mixed strategies), mixed IESDS will often reduce the game to that unique profile, or at least to the set of strategies that are part of the Minimax solution.
  *   **Implication for Prediction:** In competitive environments (zero-sum), mixed IESDS provides a very tight prediction of play, often converging on the unique value of the game without needing to solve the full minimax optimization problem immediately.

  ### Summary Example
  Consider a game where Row has strategies $T, M, B$.
  *   $T$ does not dominate $B$.
  *   $M$ does not dominate $B$.
  *   However, a 50/50 mix of $T$ and $M$ yields a higher payoff than $B$ against every Column strategy.
  *   **Pure IESDS:** $B$ survives. Prediction: Row might play $B$.
  *   **Mixed IESDS:** $B$ is eliminated. Prediction: Row will **never** play $B$.

  **Conclusion:**
  The allowance of mixed strategies in IESDS transforms the concept from a simple heuristic into a robust test of rationality. It ensures that the predicted set of play includes only strategies that are **best responses to some coherent belief** about the opponent. By eliminating strategies that are inferior to a portfolio of other options, it significantly sharpens predictions while maintaining consistency with Nash Equilibrium and Common Knowledge of Rationality.
