          *   *Drafting Idea:* Start with the Dana scenario. Ask if the fairness account collapses the distinction. Follow up on the "feel" of the accusation.

      *   **Topic 2: Restoring Standing**
          *   *Core Tension:* If I stop being a hypocrite in secret, do I get my voice back? Or do I owe the people I blamed an apology?
