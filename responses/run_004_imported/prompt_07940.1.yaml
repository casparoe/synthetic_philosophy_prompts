              4.  Collective/International Scale: Countries criticizing each other.
          *   Total: 8-10 questions (including follow-ups).

  2.  **Deconstruct the Four Required Topics & Brainstorm Angles:**

      *   **Topic 1: Truth vs. Standing (The Cohen Distinction)**
