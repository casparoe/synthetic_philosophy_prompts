prompt: |-
  So I'm meant to be writing my dissertation chapter on fitting-attitude accounts of value but I've fallen down a side-tunnel on the wrong-kind-of-reasons problem instead, and I want someone to pressure-test an argument before I bring it to my advisor (this came up at reading group last week and I couldn't quite articulate it on the spot). Quick recap of the setup in case it helps to have it stated the way I'm using it: buck-passers say X is good iff X has properties that give us reason to favor X. The standard trouble case is the evil-demon scenario -- I think it's originally Rabinowicz and Ronnow-Rasmussen's, though I might be misremembering the source -- where a demon will torture you unless you come to desire some worthless saucer of mud. You now have a reason to desire the mud, but obviously not because the mud is good, so the buck-passing analysis threatens to spit out the wrong verdict unless "reason" in the analysis can somehow be restricted to the right kind.

  There's the state-given/object-given move (say the demon's reason doesn't count because its grounded in facts about the state of desiring rather than the object desired), but I'm less interested in that one right now. What I actually want pressure-tested is the fancier "higher-order" fix, which I believe traces to Danielsson and Olson: the idea that the demon doesn't really give you reason to desire the mud, just reason to want to desire it, so the wrong-kind reason gets pushed up a level and never touches the attitude the buck-passing analysis is actually about. Please argue, as forcefully as you can, that this move fails because it's just a regress wearing a solution's clothes: for any level you push the corruption to, I can build a new demon (or a new case, doesn't have to be a demon) that attaches a wrong-kind reason to that level instead, and there's no principled place to call a halt. So the buck-passer either has to admit every level is potentially corruptible, which seems to just concede the original problem, or stipulate that some level is off-limits, which needs an argument they don't obviously have. Don't just assert the regress though -- take seriously the best reply on the buck-passer's behalf, something like: the hierarchy has to bottom out at a state (a brute desire, or something Frankfurt-style like an identification) that isn't itself the kind of thing reasons attach to, so there's nothing left to corrupt -- and tell me whether that stopping point is principled or just a stipulation with a fancier name.

  If it actually strengthens things, feel free to bring in the thought (Jonathan Way's, I think, though again don't quote me) that this whole problem generalizes way past buck-passing, to basically any account that tries to explain a normative status via reasons for a response -- but only if it sharpens the regress point, I don't want a lit review, I want the single strongest version of the specific objection above.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a dissertation chapter on Fitting-Attitude (FA) accounts of value (specifically Buck-Passing accounts).
      *   **Problem:** They are stuck on the "Wrong Kind of Reasons" (WKR) problem, specifically the Evil Demon case.
      *   **Specific Focus:** They want to pressure-test a specific objection to the "Higher-Order" fix (associated with Danielsson & Olson).
      *   **The Objection:** The Higher-Order fix fails because it leads to a regress. For any level $n$, a new demon can attach a WKR to level $n+1$.
      *   **The Task:** Argue *forcefully* that this move fails due to regress. Address the best possible reply (that the hierarchy bottoms out at a brute state/identification not subject to reasons). Evaluate if that stopping point is principled or stipulative.
      *   **Constraint:** Do not just assert the regress. Take the best reply seriously. Mention Jonathan Way's generalization point only if it sharpens the regress argument. No lit review, just the strongest version of the specific objection.
      *   **Tone:** Academic, rigorous, pressure-testing (like a tough advisor or peer).

  2.  **Deconstruct the Higher-Order Fix (Danielsson & Olson):**
      *   *Claim:* The demon gives you a reason to *want to desire* the mud, not a reason to *desire* the mud.
      *   *Mechanism:* FA accounts define value in terms of reasons for a *first-order* attitude. If the reason targets a *second-order* attitude, it doesn't count towards the value of the object.
      *   *Goal:* Isolate the "right kind" of reasons (object-given) from "wrong kind" (state-given/pragmatic) by shifting the pragmatic reasons up a level.

  3.  **Develop the Regress Objection (The Core Argument):**
      *   *Step 1:* Accept the fix for the first demon. Okay, reason is to *want to desire* mud.
      *   *Step 2:* Construct a New Demon (Demon 2). Demon 2 tortures you unless you *have a reason to desire* the mud (or unless you desire the mud, regardless of why). Wait, the standard regress move is: Demon 2 tortures you unless you *have the second-order desire* that Demon 1 created.
      *   *Refinement:* Actually, the sharper regress is about the *normative status* itself. If value is defined by reasons for attitude $A$, and we say WKR targets attitude $B$ (where $B$ is about $A$), what stops a WKR from targeting $B$?
      *   *The "Shifting Goalposts" problem:* If the analysis of value relies on "reasons for $X$," and we exclude reasons that are pragmatic about $X$, we push them to "reasons for wanting $X$." But if "reasons for wanting $X$" can *also* be pragmatic (e.g., a demon threatens you unless you want to want the mud), then we need a third level.
      *   *The Crucial Point:* The Buck-Passer needs to define Value at *some* level. If every level is susceptible to pragmatic contamination, the definition never stabilizes.

  4.  **Anticipate the Best Reply (The Stopping Point):**
      *   *Reply:* The hierarchy isn't infinite. It bottoms out at a *brute conative state* (e.g., a caring, an identification, a volition) that is not itself responsive to reasons. It's a factual psychological anchor.
      *   *Analysis of Reply:* Is this principled?
      *   *Critique:* If the bottom level is *not* responsive to reasons, then the Buck-Passing account (which defines value via *reasons*) loses its grip at the foundation. If the foundation is just a brute desire, we've collapsed into a Subjectivist or Ideal Observer theory, not a Reason-based account.
      *   *Alternative Reply:* The bottom level is "reasons for belief" or something cognitive? No, FA is about pro-attitudes.
      *   *Alternative Reply:* The distinction is between *constitutive* aims vs. *external* aims.
      *   *Strongest Critique:* The Buck-Passer wants to have their cake and eat it too. They want the normativity of reasons all the way down, but they need a firewall against WKR. If they posit a level immune to reasons to stop the regress, they abandon the "Reasons-first" methodology at the critical juncture. If they claim every level is reason-responsive, the regress restarts.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the setup. State the thesis: The Higher-Order fix is an unstable equilibrium that collapses under iterative pressure.
      *   *The Regress:* Formulate the "Demon 2" case clearly. If Demon 1 gives reason to want-to-desire mud, Demon 2 threatens torture unless you *have that second-order desire*. Now you have a pragmatic reason for the second-order desire.
      *   *The Buck-Passer's Defense:* They will say, "No, we analyze Value at Level 1. Level 2 reasons don't count." But the problem is defining *why* Level 2 reasons don't count without circularity. If it's because Level 2 is about a state, Demon 1's reason was also about a state (the state of desiring). The Danielsson/Olson move says Demon 1's reason is about the *state of desiring*, so it targets the *second-order attitude*.
      *   *The Trap:* If we define Value as "Reasons for First-Order Attitude," and we exclude pragmatic reasons by pushing them to Second-Order, we must ensure Second-Order attitudes aren't part of the Value analysis. But if Value is *only* Level 1, why do we care about Level 2? Because Level 2 explains why we have Level 1.
      *   *Refining the Regress:* It's not just about demons. It's about the *structure of normativity*. If a reason can make it rational to want to desire $X$ without $X$ being good, why can't a reason make it rational to want to want to desire $X$ without $X$ being good?
      *   *The "Bottoming Out" Reply:* Suppose they say, "We stop at the will/volition."
      *   *The Kill Shot:* If you stop at a brute volition, you are no longer a Buck-Passer. You are a Subjectivist. Buck-Passing claims value is *reducible* to reasons. If the chain of reasons terminates in a brute fact about psychology that is *not* reason-responsive, then value ultimately rests on non-normative facts. This undermines the normative force the account was supposed to capture.
      *   *Jonathan Way Point:* Use this to show the problem isn't just demons, it's the structure of "Reasons for Responses." If the response is normative, it invites WKR. If it's non-normative, it's not a reason-response.

  6.  **Polishing the Tone:**
      *   Make it sound like a rigorous philosophical critique. Use terms like "iterative contamination," "normative anchor," "methodological commitment."
      *   Ensure the distinction between *object-given* and *state-given* is kept in the background (as requested) to focus on the Higher-Order regress.
      *   Check against constraints: Don't do a lit review. Focus on the regress and the stopping point.

  7.  **Final Review against User Prompt:**
      *   *Pressure-test the argument?* Yes.
      *   *Focus on Higher-Order fix (Danielsson/Olson)?* Yes.
      *   *Argue it fails due to regress?* Yes.
      *   *Address the "bottoming out" reply?* Yes.
      *   *Is the stopping point principled?* Argue it is not.
      *   *Jonathan Way mention?* Only if it sharpens the point (I will use it to generalize the structural flaw).

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't confuse the State-Given/Object-Given distinction with the Higher-Order move. The user specifically said they are *less* interested in State/Object and want to focus on the Higher-Order regress. I need to make sure the regress argument doesn't just collapse back into "that's a state-given reason." The point is that the Higher-Order move *tries* to solve the State-Given problem by shifting levels, but the shift itself is vulnerable.
      *   *Key Insight:* The Higher-Order move tries to say "WKR are reasons for *higher-order* attitudes." The regress shows that *those* higher-order attitudes are *also* vulnerable to WKR. So you need a Higher-Higher-Order move. Ad infinitum.
      *   *The Stopping Point:* If they stop, they must claim some level is *immune* to WKR. Why? If it's immune because it's not reason-responsive, the account fails. If it's immune because it's "intrinsic," that's circular.

      *(Self-Correction on the "Bottoming Out" reply)*: The user suggests the reply might be: "The hierarchy bottoms out at a state (brute desire/identification) that isn't itself the kind of thing reasons attach to."
      *   *My Counter:* If reasons don't attach to it, it's not a normative account anymore. It's psychological. Buck-passing is a normative reduction. If the base is non-normative, the reduction fails to capture the *normativity* of value.

      *Let's write it.*
answer: |-
  Here is the pressure-test you asked for. I am going to adopt the role of the skeptical interlocutor in your reading group—the one who thinks the Higher-Order fix is a shell game that hides the problem rather than solving it.

  The core of your objection is that the Danielsson/Olson move is an **unstable equilibrium**. It attempts to solve the Wrong Kind of Reasons (WKR) problem by relocating the pragmatic pressure from the first-order attitude (desiring the mud) to a second-order attitude (wanting to desire the mud). The claim is that the demon gives you reason to *want to desire* the mud, but since the Buck-Passing (BP) account defines value in terms of reasons for *desiring* the mud, the demon's threat is filtered out.

  Here is the argument for why this collapses into a regress that forces the Buck-Passer into a dilemma: either they accept an infinite hierarchy of attitudes (which is psychologically implausible and analytically useless) or they stipulate a stopping point that undermines their own theoretical commitments.

  ### 1. The Iterative Contamination Argument

  The Higher-Order fix relies on a distinction between the *target* of the analysis (Level 1: Desiring $X$) and the *location* of the pragmatic reason (Level 2: Wanting to Desire $X$). The fix works only if Level 2 is immune to the same kind of contamination that afflicted Level 1. But there is no principled reason to think it is.

  Consider **Demon 2**.
  *   **Demon 1** tortures you unless you desire the mud. (Generates WKR for Level 1).
  *   **The Fix:** Demon 1 actually gives you reason to *want to desire* the mud (Level 2). Value is still defined by Level 1 reasons, so Demon 1 doesn't make the mud good.
  *   **Demon 2** tortures you unless you *want to desire* the mud.

  Demon 2 generates a pragmatic reason for the Level 2 attitude. If the Buck-Passer applies their own logic consistently, they must say Demon 2 gives you reason to *want to want to desire* the mud (Level 3). But now we have a pragmatic reason at Level 2. If the definition of value relies on the normative status of Level 1, and Level 1 is influenced by Level 2, and Level 2 is corrupted by Demon 2, the contamination bleeds back down.

  You might object: "No, the BP account only cares about reasons for Level 1. Demon 2 affects Level 2, so it's irrelevant."
  **Reply:** This is only true if Level 2 attitudes are causally or normatively inert regarding Level 1. But on the Higher-Order fix, the *solution* to Demon 1 was that we *do* have a reason for the Level 2 attitude. The mechanism of the fix admits that pragmatic reasons can generate higher-order volitions. If pragmatic reasons can generate Level 2 volitions, they can generate Level 3 volitions.

  If the Buck-Passer says, "We just keep pushing the WKR up," they face a **psychological impossibility**. Finite agents cannot harbor infinite chains of higher-order volitions. If the analysis of value requires that an agent *could* have a reason for an attitude, and that reason is only secure if it can be pushed up an infinite chain to avoid contamination, then the analysis posits a capacity no agent possesses.

  ### 2. The Dilemma of the Stopping Point

  To avoid the infinite regress, the Buck-Passer must claim the hierarchy bottoms out. They must identify a level $N$ where the attitude is **immune** to WKR. As you noted, the most sophisticated reply is to claim the hierarchy bottoms out at a brute conative state—a Frankfurt-style identification, a caring, or a volition that is not itself responsive to reasons.

  Here is where you can force the Buck-Passer into a dilemma regarding their methodological commitments.

  **Horn A: The Stopping Point is Reason-Responsive.**
  If the bottom-level attitude (say, a Level 3 identification) is still the kind of thing that can be held for reasons, then **Demon 3** is possible. A demon can threaten you unless you identify with the desire to want to desire the mud. If the attitude is reason-responsive, it is WKR-vulnerable. If it is WKR-vulnerable, the regress restarts. The Higher-Order fix fails to halt the contamination.

  **Horn B: The Stopping Point is NOT Reason-Responsive.**
  Suppose the Buck-Passer bites the bullet and says, "The hierarchy stops at a brute volition that is not responsive to reasons. It is just a psychological fact that I identify with this desire."
  *   **The Cost:** This surrenders the core ambition of the Buck-Passing account. BP is a **normative reduction**. It claims to explain value (a normative property) in terms of reasons (normative relations).
  *   **The Collapse:** If the chain of reasons terminates in a brute psychological fact that is *not* justified by further reasons, you have not reduced value to reasons. You have reduced value to **psychological facts**. You have collapsed into a version of Subjectivism or an Ideal Observer Theory where the "ideal" stance is defined by brute psychology rather than normative fit.
  *   **The Contradiction:** You cannot claim that value is *constituted* by reasons for attitudes if the ultimate anchor of those attitudes is a state that exists *independently* of reasons. If the bottom level is immune to WKR because it is immune to *all* reasons, then the normativity of value disappears at the foundation. You are left with a normative superstructure resting on a non-normative base.

  ### 3. Sharpening with the "Generalization" Point

  This is where bringing in the structural point (akin to Jonathan Way's work) strengthens your regress objection. The problem isn't just about demons; it's about the **direction of fit**.

  The Buck-Passer wants to say:
  1.  Value $\rightarrow$ Reasons for Attitude.
  2.  WKR are excluded because they are "state-given" or "higher-order."

  But if the Higher-Order fix is just a way of saying "WKR are reasons for *different* attitudes," then the Buck-Passer must explain why *those* attitudes are the privileged ones.
  *   If they say "Level 1 is privileged because it's the one that constitutes value," they are begging the question (that's what we are trying to define).
  *   If they say "Level 1 is privileged because it's the one that *fits* the object," they have abandoned the Buck-Passing account for a Fitting-Attitude account that relies on a primitive notion of "fit" (which was supposed to be analyzed *by* the reasons).

  The regress shows that **any** attitude included in the analysis of value is vulnerable to pragmatic reasons unless you exclude it from the space of reasons entirely.
  *   If you include it in the space of reasons, WKR applies (Regress).
  *   If you exclude it from the space of reasons to stop the regress, you lose the normative reduction (Collapse into Subjectivism).

  ### 4. The Verdict for Your Advisor

  When you bring this to your advisor, frame it as a **dilemma of normative grounding**.

  The Higher-Order fix attempts to solve the WKR problem by treating pragmatic reasons as reasons for *higher-order* states. But this treats the WKR problem as merely **locational**. Your argument shows it is **structural**.

  1.  **If the hierarchy is open-ended:** The account requires agents to have infinite higher-order capacities to secure the normativity of value against pragmatic contamination. This is empirically false and analytically vicious.
  2.  **If the hierarchy is closed:** The Buck-Passer must stipulate a level that is immune to WKR.
      *   If it is immune because it is not reason-responsive, the account ceases to be a *reasons-based* account of value. It becomes a psychological report.
      *   If it is immune because it is "intrinsically" the right level, the account is circular (it assumes the very distinction between right and wrong kinds of attitudes it was meant to explain).

  **Conclusion:** The Higher-Order fix is not a solution; it is a **delay tactic**. It pushes the WKR problem up one step, but unless the Buck-Passer is willing to abandon the claim that value is fully reducible to reasons (and admit a primitive normative element or a brute psychological anchor), the regress proves that **reasons for attitudes cannot bear the weight of value** without collapsing under pragmatic pressure.

  This suggests that the Buck-Passer cannot solve WKR purely by manipulating the *structure* of the attitudes (first-order vs. higher-order). They must either return to the Object-Given/State-Given distinction (which you said you're less interested in, but might be the only way out) or admit that the "Reason" in their analysis must be a primitive, normative notion that cannot itself be analyzed without circularity.

  **One final tip for the meeting:** If your advisor suggests that "rational agents just wouldn't have the higher-order desire in the demon case," press them on *why*. If the answer is "because it's irrational," ask: "Irrational given what standard?" If the standard is value, you're circular. If the standard is prudence, the demon wins. If the standard is 'fittingness,' you've abandoned Buck-Passing for Fitting-Attitude primitivism. That is the choke point.
