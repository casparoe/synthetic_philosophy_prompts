prompt: |-
  I sit on my town's licensing board, and this weekend I got into a genuinely heated argument with my friend Dana about a case that's actually in front of us next month, which felt like a sign I should sort my own thinking out before I have to put something in writing. There's a private members' club on the edge of town that's quietly run consent-based kink events for about eight years now: vetted members, written consent protocols, no noise complaints, no injuries beyond the odd bruise everyone involved signed up for, nothing visible from the street. A faction of neighbors, plus two of our seven board members, want to deny the renewal anyway. Not over safety or nuisance — they're upfront that it's about the fact that the town's name is attached to something they find degrading, and that this says something about what kind of community we are. Our ordinance still has one of those old leftover clauses — something can be denied if it's "contrary to public morals and decency" — that nobody has ever actually had to define.

  Dana, who took a philosophy of law class the same semester I'm taking mine (small world), was arguing something close to Devlin's old line: that a shared moral sense is part of what makes a town an actual community rather than just people who happen to live near each other, and that treating "nobody's harmed" as the only relevant question quietly assumes the Hart side of that debate has already won, rather than argues for it. I was arguing the Hart side pretty explicitly back at her — that widespread distaste isn't evidence of any real threat to the town's fabric, and that if there's an actual safety issue buried in here (breath play, say, which can genuinely kill people even with full and enthusiastic consent) we should regulate that specifically, not use it to justify shutting down the whole club on a vibe. Neither of us budged, and now I actually have to write something the board can vote on.

  Could you draft the memo? I want a clear recommendation — renew, deny, or renew with specific conditions — plus a timeline for the vote, but I especially want the reasoning to engage Dana's side on it's own terms rather than just declaring Hart the winner by default. If there's a version of "a shared morality matters" that survives scrutiny here, spell out what it would actually take to establish that on these particular facts (a faction of neighbors and two board members, not obviously the whole town), versus what would just be distaste dressed up as morality. And please keep the paternalism question — the breath-play thing — clearly separate from the pure morals question, since I think those two are getting run together in this fight and I'm honestly not sure they should be.
