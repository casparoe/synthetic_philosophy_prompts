  **Justifications:**

  *   **Move 1 (Naomi): +2.** Naomi is technically correct regarding Joyce's 1998 argument. The dominance theorem demonstrates that any incoherent credence function is accuracy-dominated by a coherent one in every possible world. This comparison relies only on the distance between credences and truth-values (via a proper scoring rule) and does not require a probability distribution over worlds to establish the dominance relation.
  *   **Move 2 (Dev): 0.** Dev makes a partially correct but technically overreaching claim. He is right that comparing two *coherent* agents generally requires expected accuracy (which needs a probability measure). However, he is mistaken that *all* substantive work (specifically updating norms) requires expected accuracy; recent work (e.g., Briggs & Pettigrew 2018) provides accuracy-dominance arguments for conditionalization that do not rely on expectation.
  *   **Move 3 (Naomi): +2.** Naomi correctly identifies the methodological structure of normative theories. Foundational projects typically establish base norms (like probabilism) before using them to derive superstructure norms (like conditionalization). Holding the vindicated base fixed to evaluate further norms is standard bootstrapping, not vicious circularity.
  *   **Move 4 (Dev): 0.** Dev raises a valid philosophical caution about the *scope* of the initial vindication (synchronic vs. diachronic), but undermines his point by treating the derived probability function as an "assumption." If probabilism is successfully vindicated in step one, using it in step two is not begging the question. However, he is right that the "nonpragmatic" label applies most cleanly to the synchronic case.

  **What Both Are Missing:**

  Both Naomi and Dev overlook the **"Measure Problem."** The entire accuracy-first program depends on the choice of an *accuracy measure* (scoring rule), such as the Brier score. To prove that incoherence is dominated, one must assume the accuracy measure is "proper." However, justifying *why* we should use a proper scoring rule often implicitly relies on probabilistic norms or veritic values that are themselves contentious (see Hájek 2008; Levinstein 2012). If the justification for the scoring rule presupposes the very probabilistic structure the program aims to vindicate, the charge of circularity Dev gestures at returns at a deeper level than either participant recognized.
