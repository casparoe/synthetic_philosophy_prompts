answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew her only as a mother, a sister, or a friend, I was the last of her doctoral students. For those of you who knew her as a colleague, I was the fortunate recipient of her final years of guidance. Standing here, I am acutely aware that I am speaking to two different worlds. One half of this room knows the specific weight of her arguments; the other half knows the specific weight of her hand in yours.

  She spent her career defending a difficult idea. She believed that human understanding—what we might call insight—cannot be reduced to a set of rules. She argued that the mind is not a computer, not because of anything mystical, but because of the nature of truth itself. She held that we can see truths that no fixed system of calculation could ever derive on its own.

  I tell you this not to give a lecture, but because she would want us to be honest about what we are doing right now. We are gathering to speak truths about a person. We are constructing a picture of her life out of memories, stories, and facts.

  But here is where her work meets her life. If she were right—if a human mind is not merely a complex algorithm—then it follows that no finite list of true statements can ever fully capture a person. I can tell you that she was rigorous. I can tell you she drank tea without sugar, that she hummed when she read, that she corrected my logic gently but never corrected my heart. I can say these things, and they are true. But if I claimed that this collection of truths *was* her, I would be making a mistake. I would be treating her as a closed system. I would be treating her like a machine that can be fully described by its blueprint.

  She would have been the first to tell you that this limitation is not a defect in my eulogy. It is a fact about her. It is a fact about all of us.

  There are comforts people often offer at times like this that I know she would have rejected. Some say, "Her work lives on." She would have heard that as a mechanist's consolation, as if she were a program still running on the servers of the university. She was not a program. When the process stopped, it stopped.

  Others say, "She is at peace, watching over us." She would have heard that as a dualism she never held. She did not believe in a ghost separate from the machine. She believed in the person, whole and irreducible.

  So where do we find comfort? We find it in the gap.

  The comfort lies in the realization that the silence remaining in this room—the things I cannot say, the memories I do not have, the future conversations we will not have—is not empty space. It is proof. The fact that I cannot summarize her, the fact that she exceeds this speech, is the final validation of her life's work. She was not a thing to be cataloged. She was a source of insight.

  To the family: You knew this better than anyone. You knew that she could not be solved. You knew that her love was not a transaction or a predictable output. It was something you saw, directly, without derivation.

  To my colleagues: We have lost a fierce defender of the human element in reason. But we also learned from her that the inability to formalize everything is not a failure of logic. It is the condition of being alive.

  I will miss her. I will miss the way she would pause before answering a question, looking not for the answer that fit the rules, but the answer that fit the world. I will miss the way she treated a student's confusion not as an error to be debugged, but as a state of mind to be understood.

  We cannot derive her presence from these words. We cannot calculate our way out of this grief. But we can see the truth of it. We can see that she was here, and that what she was cannot be contained in the records she left behind.

  In the end, she taught us that understanding is an act of seeing, not just computing. So, I ask you to do one last thing with her. Do not try to process this loss. Do not try to file it away. Just see it. See her.

  The story of her life is consistent. It is true. But like all true stories about people, it is incomplete. And thank goodness for that. If it were complete, she wouldn't have been her.

  She was [Name]. She was here. And she was more than the sum of what we can say.

  Thank you.
