      *   She isn't running somewhere else. She isn't gone because she's data. She's gone because she was a person.
      *   We miss her.

      *Critique 1:* Too dry. Needs more warmth. Needs to weave the philosophy into the emotion, not just state it. The "incompleteness" angle needs to be the source of comfort, not just a logical observation.

  5.  **Drafting - Iteration 2 (Focusing on Tone and Theme):**
      *   Start with the silence. She valued truth.
      *   Talk about the two groups in the room.
      *   Bring in the Gödel/Penrose idea: You can't capture a mind in a set of rules.
      *   Apply to eulogy: I am listing true facts. But the list is finite. She was infinite (in potential/depth).
      *   Comfort: The fact that I can't finish the story means she wasn't a thing. She was a who.
      *   End with gratitude.

  6.  **Refining the Philosophy (Crucial Step):**
      *   Must be careful not to say "she is infinite" in a mystical sense. It's about *unformalizability*.
      *   Penrose's *Shadows of the Mind* argument relies on the idea that understanding transcends computation.
      *   The comfort comes from: If she were computable, we could copy her/summarize her. Since she isn't, the loss is real, but the *memory* isn't a simulation.
      *   Actually, the prompt suggests: "no eulogy... can be complete... she would have insisted that this is not a defect... but a fact about people."
      *   So, the comfort is: The gap between my words and her life proves her humanity.

  7.  **Writing - Section by Section (incorporating word count):**
      *   *Intro:* Welcome. Acknowledge the dual audience.
      *   *The Work:* Briefly mention her defense of insight over algorithm.
      *   *The Turn:* How does this apply to death?
      *   *The Trap:* "Work lives on" = mechanistic. "Watching over" = dualistic.
      *   *The Solution:* Incompleteness.
      *   *Personal Touch:* Memories (office hours, tea, patience).
      *   *Conclusion:* The silence is part of the truth.

  8.  **Review against Constraints:**
      *   *Time:* 6-7 mins is roughly 1000 words. (Need to monitor length).
      *   *Tone:* Warm? Yes, focus on relationship.
      *   *Philosophy:* Accurate to *Shadows of the Mind* (insight vs. derivation)? Yes.
      *   *Forbidden:* No "work lives on" as program, no "ghost in the machine."

  9.  **Polishing the Text (Self-Correction during drafting):**
