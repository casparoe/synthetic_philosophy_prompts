          *   *Verdict:* Stratified is generally considered the "fair" comparison for detecting departmental bias. The pooled data reflected application patterns, not discrimination.
          *   *Confidence in Stratified:* High.

      *   **Case 2: Kidney Stones (Charig et al. 1986)**
          *   *Scenario:* Treatment A (open) looked better overall. Treatment B (percutaneous) looked better when stratified by stone size (small/large).
          *   *Variable:* Stone Size.
          *   *Causal Structure:* Stone Size $\to$ Treatment Choice (doctors assigned easier cases to less invasive surgery) AND Stone Size $\to$ Success Rate. Stone Size is a *confounder*.
          *   *Verdict:* Stratified is definitely correct. You must compare like with like. The pooled data was misleading because Treatment B was used on harder cases.
          *   *Confidence in Stratified:* Very High. This is the textbook example of confounding where stratification is necessary.

      *   **Case 3: Israel COVID Vaccine (2021)**
          *   *Scenario:* Pooled data showed lower effectiveness (or even negative) compared to stratified by age.
          *   *Variable:* Age.
          *   *Causal Structure:* Age $\to$ Vaccination Status (older got vaccinated first) AND Age $\to$ Infection/Severity risk. Age is a *confounder* (specifically a strong risk factor and determined rollout priority).
          *   *Verdict:* Stratified is correct for biological effectiveness. Pooled data reflected the timing of rollout and risk profiles, not vaccine failure.
          *   *Confidence in Stratified:* Very High. Similar to kidney stones, age is a clear confounder.

      *   **Case 4: Low Birth-Weight Paradox (Smoking vs. Mortality)**
          *   *Scenario:* Smoking increases mortality overall. But among low birth-weight babies, smokers' babies have *lower* mortality than non-smokers' babies.
          *   *Variable:* Birth Weight.
          *   *Causal Structure:* Smoking $\to$ Low Birth Weight $\to$ Mortality. Birth Weight is a *mediator* (on the causal pathway). Conditioning on a mediator (especially a collider if there are unmeasured causes of LBW) induces bias.
          *   *Verdict:* Stratified is *wrong* for the total effect. It creates "collider bias" or "over-adjustment bias." The pooled (or unadjusted for mediator) view is closer to the truth regarding the harm of smoking.
          *   *Confidence in Stratified:* Low (actually harmful to stratify here).

      *   **Case 5: Gender Pay Gap (Occupation Controlled)**
