  **Move 1 (Marco): +2**
  Marco accurately captures Hart's central thesis in *Positivism and the Separation of Law and Morals*. Hart's primary concern was conceptual clarity: calling the Nazi statute "law" acknowledges the painful reality that valid law can be evil, while punishing the woman via retroactive statute honestly admits that a moral imperative is overriding the legal principle of *nullum crimen sine lege*. This is the strongest version of the positivist argument.

  **Move 2 (Yuki): +1**
  Yuki makes a sophisticated point about the *postwar* system's integrity, which Hart sometimes underplays. Arguing that Hart's solution imports illegality into the new regime is a strong Fullerian critique. However, the claim that denying the Nazi statute the name "law" costs "nothing" is slightly overstated; it risks historical confusion and undermines the stability of legal expectations generally, even for bad regimes.

  **Move 3 (Marco): +2**
  This is the most potent objection to Fuller's position. If judges can invalidate statutes based on a moral or structural assessment of the prior regime, it grants them a discretion that looks suspiciously like the arbitrary power the rule of law is meant to prevent. Marco correctly identifies that a legislative act (Hart's solution) is democratically accountable in a way that judicial nullification (Fuller's solution) is not.

  **Move 4 (Yuki): +1**
  Yuki correctly clarifies that Fuller's "internal morality" is procedural (structure), not substantive (outcome), which mitigates Marco's fear of free-floating moralizing. However, the claim that legislative retroactivity involves the *same* kind of discretion as judicial review is weaker; Hart would argue that legislative discretion is overt and political, whereas judicial discretion masks itself as legal interpretation.

  **Missing Consideration: The Radbruch Formula**
  Neither Marco nor Yuki explicitly invoked Gustav Radbruch, whose actual philosophy influenced the postwar German courts. The **Radbruch Formula** offers a middle ground: positive law is presumed valid *unless* the contradiction to justice reaches an "intolerable level." This bridges the gap by maintaining Hart's presumption of validity while allowing for Fuller's extreme-exception override, avoiding both blanket retroactivity and unchecked judicial discretion.
