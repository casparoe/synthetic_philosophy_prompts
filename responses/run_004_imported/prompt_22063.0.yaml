answer: |-
  You have stumbled directly onto one of the most famous and persistent issues in the philosophy of science: **The Problem of Old Evidence.**

  Formulated most prominently by Clark Glymour in 1980, this problem highlights a seeming failure in orthodox Bayesian confirmation theory. As you correctly noted, if evidence $E$ is already known (so its probability $P(E) = 1$), Bayes' Theorem dictates that learning a hypothesis $H$ entails $E$ cannot increase the probability of $H$. Mathematically, if $P(E) = 1$ and $P(E|H) = 1$, then $P(H|E) = P(H)$.

  Yet, historically, Einstein's account of Mercury's perihelion is considered one of the strongest confirmations of General Relativity (GR). Conversely, your friend's conspiracy theory feels epistemically worthless despite explaining known facts.

  Here is an analysis of the implications for epistemic credit and whether Bayesianism provides a principled way to distinguish Einstein from your friend.

  ### 1. Implications for Epistemic Credit
  The Problem of Old Evidence implies that **temporal novelty is not the source of confirmation.** If it were, Einstein would have gained no credit from Mercury. Therefore, the epistemic credit a theory deserves for accounting for old facts depends not on *when* the facts were discovered, but on **how** the theory accounts for them.

  Philosophers of science (such as Daniel Garber) have proposed solutions that salvage Bayesianism here. The consensus implication is:

  *   **Learning the Connection, Not the Fact:** When Einstein calculated the perihelion of Mercury, the scientific community did not learn $E$ (the orbit anomaly); they already knew it. What they learned was the **logical relation** that $H$ entails $E$. Before 1915, $P(H \rightarrow E)$ was low or unknown. After 1915, it became 1. In a "logical Bayesianism" framework, updating on the new logical truth that "GR explains Mercury" *does* raise the probability of GR.
  *   **Unification and Non-Ad-Hocness:** A theory deserves high epistemic credit for old evidence if it derives that evidence from core principles without needing special adjustments. Einstein did not tweak GR to fit Mercury; the value fell out of the field equations naturally.
  *   **The Limit of Accommodation:** The implication is that "accommodation" (fitting old data) is weaker than "prediction" (fitting new data), not because of timing, but because accommodation is more susceptible to **overfitting**. A theory can always be constructed to fit past data (curve-fitting). A theory that fits past data *and* restricts what future data can look like is more informative.

  **Verdict on Credit:** A theory deserves significant credit for explaining old evidence *if* the explanation arises from the theory's fundamental structure rather than auxiliary patches. However, it generally deserves *less* credit than a novel prediction, because the risk of the theory being constructed specifically to fit that data is higher.

  ### 2. Can Bayesianism Distinguish the Conspiracy Theory from GR?
  You asked if Bayesianism gives a principled way to treat your friend's theory differently from Einstein's. The answer is **yes**, but not based on the "oldness" of the evidence. The distinction lies in **Priors** and **Likelihood Ratios.**

  #### A. Prior Probability $P(H)$
  Bayesian confirmation is a function of both the evidence and the prior probability of the hypothesis.
  *   **Einstein:** GR had a non-negligible prior. It was motivated by deep theoretical problems (the conflict between Newtonian gravity and Special Relativity) and mathematical elegance. It was a "live option" in the scientific space.
  *   **Conspiracy Theory:** These typically have vanishingly low priors. They require assuming massive, silent coordination among thousands of people, violating standard models of sociology, psychology, and logistics.
  *   **The Math:** Even if the Likelihood $P(E|H)$ is high for both (both explain the facts), if $P(H)$ is near zero for the conspiracy theory, the Posterior $P(H|E)$ remains low. Einstein started with a reasonable prior; your friend's theory likely started with a microscopic one.

  #### B. The Likelihood Ratio and "Rigidity"
  Confirmation depends on the ratio $\frac{P(E|H)}{P(E|\neg H)}$.
  *   **Einstein:** Under Newtonian physics ($\neg H$), the precession of Mercury was anomalous (requiring the ad-hoc "Vulcan" planet hypothesis). So $P(E|\neg H)$ was low. Under GR ($H$), $P(E|H)$ was 1. This creates a massive likelihood ratio shift.
  *   **Conspiracy Theory:** Conspiracy theories are often **epistemically flexible**. They are designed to explain *any* outcome. If the official report says X, the conspiracy says "cover-up." If evidence Y appears, the conspiracy says "planted."
      *   If a hypothesis $H$ can explain *any* possible evidence $E$ equally well, then $P(E|H) \approx P(E)$.
      *   If $P(E|H)$ is roughly the same as $P(E|\neg H)$ (because standard explanations also exist for the facts), the likelihood ratio is near 1. No confirmation occurs.
      *   **Principled Distinction:** GR is "rigid"; it permits only specific orbital mechanics. The conspiracy theory is "fluid"; it accommodates any fact. Bayesianism penalizes fluidity because it dilutes the likelihood function.

  #### C. Auxiliary Assumptions
  Bayesianism accounts for the "Duhem-Quine problem" (that theories are tested with auxiliary assumptions).
  *   **Einstein:** Required minimal auxiliary assumptions to derive Mercury's orbit.
  *   **Conspiracy Theory:** Usually requires a cascade of new, unverified auxiliary assumptions to explain why the evidence looks the way it does (e.g., "The video is fake," "The witness was paid"). Each auxiliary assumption carries its own probability penalty, dragging down the total probability of the conjunction.

  ### Summary for Your Argument
  You were right to be skeptical, but your reasoning ("it's old evidence") was technically vulnerable to the Einstein counter-example. Your friend was right that old evidence *can* confirm, but wrong that *mere fit* is sufficient.

  **The Principled Bayesian Rebuttal:**
  You can tell your friend that Bayesianism distinguishes her theory from Einstein's not based on *when* the evidence was found, but on:
  1.  **Priors:** How plausible was the theory before looking at the evidence? (GR was motivated by physics; conspiracy theories are motivated by suspicion).
  2.  **Rigidity:** Does the theory *risk* being wrong? GR could have calculated a precession that didn't match Mercury. Conspiracy theories often reinterpret mismatches as further proof of the conspiracy, making them unfalsifiable.
  3.  **Derivation vs. Assertion:** Einstein *derived* the number from equations. Your friend likely *asserted* a narrative that fits the number.

  **Conclusion:**
  The Problem of Old Evidence teaches us that **explanatory power is not the same as accommodation.** A theory deserves credit for old evidence only if it captures that evidence through a restrictive, high-prior mechanism that would have been unlikely to succeed by chance. Einstein's theory was a sharp key fitting a lock; your friend's theory is a skeleton key that claims to open every door. Bayesianism penalizes the skeleton key heavily, regardless of how many doors it has already opened.
