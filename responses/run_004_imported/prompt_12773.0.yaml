prompt: |-
  I've spent a long time reading rationalist blogs and forums, where discussions of Bayesian epistemology like to invoke the claim that a rational agent should never expect cost-free evidence to leave them worse off in expectation, typically crediting this to I.J. Good's short 1967 note "On the Principle of Total Evidence," which proves the claim within L.J. Savage's decision-theoretic framework. The same corners of the internet also talk a great deal about "information hazards," cases where learning something seems to make you actively worse off, which always struck me as being in some tension with Good's result, even though I gather the standard resolution is that the theorem is a claim about expected utility computed ex ante, before any particular piece of news arrives, rather than about how any specific realized piece of information will feel once you have it. What I have never seen properly spelled out, and would like your help with, is how Good's theorem relates to the substantially earlier and seemingly far more general theorem due to David Blackwell on the comparison of statistical experiments, which gets invoked in the same breath in some of the more technical writing in this space, as though it were simply a fancier restatement of the same fact.

  As I understand them: Good's theorem says that for a Bayesian agent with a fixed utility function and prior, facing one fixed decision problem, the expected utility of observing a cost-free experiment and then choosing the best action given whatever it reveals is never lower than the expected utility of choosing the best action without observing anything, which drops out of a short Jensen's-inequality argument about the convexity of the "best attainable expected utility, as a function of one's posterior" mapping. Blackwell's theorem, by contrast, defines one experiment as more informative than a second when the second's signal distribution can be reproduced by "garbling" the first, that is, by passing its output through some extra randomization that does not itself depend on the true state of the world, and then establishes that this garbling relation holds exactly when every possible decision-maker, with any action set, utility function, and prior whatsoever, would obtain at least as high an expected utility from the first experiment as from the second, across every decision problem they might face. This yields only a partial order over information structures, since most pairs of experiments cannot be ranked against one another in this all-decision-problems-at-once sense.

  My tentative hunch, which I would like you to check, is that Good's theorem amounts to nothing more than the special case of Blackwell's ordering in which the "less informative" side of the comparison is a completely uninformative experiment, one whose output is statistically independent of the true state of the world; since any experiment can trivially be garbled down to such an experiment by simply discarding the signal and outputting noise, Blackwell's biconditional would then automatically deliver Good's conclusion for every decision problem, utility function, and prior at once, which is if anything a stronger statement than the one Good actually proved. If that reduction is correct, it would suggest that Good's short convexity argument only ever needs the logically "easy" half of Blackwell's biconditional, the direction running from garbling to universal preference, while the genuinely deep and hard-won content of Blackwell's theorem lies in the converse: that being universally weakly preferred across every conceivable decision problem is enough to force the existence of a garbling. I would like you to work through whether this reduction actually holds up, state explicitly which half of Blackwell's equivalence Good's argument is implicitly using, and then offer your own considered judgment on which of the two results should be treated as the more fundamental one for understanding why gathering evidence is nearly always instrumentally rational, and correspondingly, whether there remains any sense in which Good's theorem is genuinely special rather than a mere trivial corollary of Blackwell's much more general result.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Subject:** The relationship between I.J. Good's Theorem (1967) on the value of information and David Blackwell's Theorem (1951/1953) on the comparison of statistical experiments.
      *   **User's Background:** Well-read in rationalist blogs/forums, understands Bayesian epistemology, decision theory basics (Savage framework), Jensen's inequality, convexity of value functions, and the concept of "information hazards."
      *   **User's Hypothesis:** Good's Theorem is just a special case of Blackwell's Theorem where the "less informative" experiment is the null (uninformative) experiment. Specifically, Good uses the "easy" direction of Blackwell (Garbling $\implies$ Higher Expected Utility), while Blackwell's deep contribution is the converse (Higher Expected Utility $\implies$ Garbling).
      *   **User's Request:**
          1.  Verify if this reduction holds up.
          2.  Explicitly state which half of Blackwell's equivalence Good's argument uses.
          3.  Offer a considered judgment on which result is more fundamental for understanding the instrumental rationality of evidence gathering.
          4.  Assess if Good's theorem has any special status or is just a trivial corollary.

  2.  **Analyze Good's Theorem (1967):**

      *   *Statement:* For a fixed prior, fixed utility function, and fixed action space, the expected utility of acting *after* observing a cost-free signal is $\ge$ the expected utility of acting *before* observing the signal.
      *   *Proof Sketch:* Let $V(p)$ be the maximum expected utility given posterior belief $p$. $V(p)$ is convex (maximum of linear functions). By the law of iterated expectations, the expected posterior is the prior. By Jensen's Inequality, $E[V(p_{post})] \ge V(E[p_{post}]) = V(p_{prior})$.
      *   *Key Feature:* It fixes the decision problem (actions + utilities).

  3.  **Analyze Blackwell's Theorem (1951/1953):**

      *   *Statement:* Experiment $\mathcal{E}_1$ is "more informative" than $\mathcal{E}_2$ (in the sense of sufficiency/garbling) if and only if $\mathcal{E}_1$ yields higher expected utility than $\mathcal{E}_2$ for *all* decision problems (all action spaces, all utility functions).
      *   *Direction 1 (Sufficiency $\implies$ Value):* If $\mathcal{E}_2$ is a garbling of $\mathcal{E}_1$, then $\mathcal{E}_1$ is preferred for all decision problems.
      *   *Direction 2 (Value $\implies$ Sufficiency):* If $\mathcal{E}_1$ is preferred for all decision problems, then $\mathcal{E}_2$ is a garbling of $\mathcal{E}_1$.
      *   *Key Feature:* It quantifies over *all* decision problems to establish an ordering of experiments.

  4.  **Evaluate the User's Hypothesis (The Reduction):**

      *   *Hypothesis:* Good's Theorem = Blackwell's Theorem where $\mathcal{E}_2$ is the null experiment.
      *   *Check:*
          *   In Good's setup, we compare "Observing $\mathcal{E}$" vs. "Observing Nothing."
          *   "Observing Nothing" is equivalent to an experiment that yields a signal independent of the state (a null experiment, $\mathcal{E}_{null}$).
          *   Any experiment $\mathcal{E}$ can be garbled into $\mathcal{E}_{null}$ (just ignore the signal).
          *   Therefore, $\mathcal{E}$ is more informative than $\mathcal{E}_{null}$ in the Blackwell sense.
          *   By Blackwell's Direction 1 (Garbling $\implies$ Value), $\mathcal{E}$ yields higher expected utility than $\mathcal{E}_{null}$ for *any* decision problem.
          *   Good's theorem claims exactly this for a *specific* decision problem.
      *   *Conclusion:* Yes, the reduction holds. Good's theorem is indeed a specific instance of the "easy" direction of Blackwell's theorem.

  5.  **Address the "Which Half?" Question:**

      *   Good's proof relies on the convexity of the value function.
      *   Blackwell's Direction 1 (Garbling $\implies$ Value) also relies on the convexity of the value function (essentially the same Jensen's inequality argument).
      *   Blackwell's Direction 2 (Value $\implies$ Garbling) is the hard part (involves separating hyperplane theorems, constructing the garbling matrix).
      *   *Verdict:* Good uses the logic equivalent to Blackwell's Direction 1.

  6.  **Assess "Fundamentality" and "Special Status":**

      *   *Is Good just a trivial corollary?* Technically, yes, in the context of modern decision theory. If you accept Blackwell, Good falls out immediately.
      *   *Why is Good cited then?*
          *   *History:* Good (1967) came after Blackwell (1951/1953), but Blackwell's work was initially in statistics/economics, while Good was writing for a broader philosophical/cybernetic audience. Good made the result accessible to philosophers and AI researchers who might not know Blackwell.
          *   *Simplicity:* Good's proof is self-contained and requires less machinery (no need to define garbling matrices or quantify over all utility functions). It speaks directly to the agent's specific situation.
          *   *Focus:* Good focuses on the *value of information* for a specific agent. Blackwell focuses on the *ordering of experiments* independent of agents.
      *   *Information Hazards:* The user mentioned this. Good's theorem handles "expected" utility. Information hazards are usually about specific realizations or externalities (e.g., someone else knowing you know). Good's theorem assumes the utility function captures all relevant values. If "knowing X" causes harm (e.g., existential dread), that must be in the utility function. If the harm comes from *others* knowing you know, that's a game-theoretic extension not covered by the single-agent Good/Blackwell framework.
      *   *Fundamentality:* Blackwell is more fundamental regarding the *structure of information*. Good is more fundamental (or at least more direct) regarding the *normative prescription for a specific agent*.

  7.  **Drafting the Response:**

      *   **Introduction:** Validate the user's understanding. It is excellent. Confirm the hypothesis is correct.
      *   **Section 1: The Reduction.** Explicitly map Good's setup to Blackwell's. Define the Null Experiment. Show that $\mathcal{E} \succeq_{Blackwell} \mathcal{E}_{null}$.
      *   **Section 2: Which Half?** Identify that Good's convexity argument corresponds to Blackwell's "Sufficiency $\implies$ Value" direction. Explain why the converse is the hard part (characterization vs. implication).
      *   **Section 3: Fundamentality & Special Status.**
          *   *Blackwell:* More general, structural, defines the "currency" of information.
          *   *Good:* More pragmatic, direct, pedagogical.
          *   *Why Good persists:* Accessibility, historical context (philosophy vs. stats), and the fact that agents usually care about *their* decision problem, not *all possible* ones.
      *   **Section 4: Information Hazards (Nuance).** Briefly touch on this since the user raised it. Good's theorem assumes the utility function is fixed and comprehensive. If "knowledge" itself has disutility, it's baked into $U$. If the hazard is strategic (others knowing), it's outside the single-agent model.
      *   **Conclusion:** Summarize. Good is a corollary, but a culturally and pedagogically vital one.

  8.  **Refining the Technical Details:**

      *   Make sure to distinguish between the *value of information* (Good) and the *comparison of experiments* (Blackwell).
      *   Ensure the Jensen's inequality connection is clear. $V(p) = \max_a E[u(a, \omega) | p]$. This is the upper envelope of linear functions, hence convex.
      *   Blackwell's Direction 1: If $P = Q \cdot M$ (garbling), then $E[V(P)] \ge E[V(Q)]$. This uses the same convexity.
      *   Blackwell's Direction 2: If $E[V(P)] \ge E[V(Q)]$ for all $V$, then $P = Q \cdot M$. This uses convex analysis (separating hyperplanes).

  9.  **Self-Correction/Edge Case Check:**
      *   *Did Good know Blackwell?* Good's 1967 note is very short. Blackwell's 1951/1953 papers are in *Annals of Mathematical Statistics*. It's possible Good knew it, but Good's framing is distinctively philosophical. It's worth noting that Blackwell's result was not widely known outside statistics/economics until later (e.g., via Marschak or Radner).
      *   *Is "Null Experiment" well-defined?* Yes, a signal space with one element, or a signal distribution independent of the state.
      *   *Is Good's theorem strictly weaker?* Yes, because it fixes the decision problem. Blackwell's theorem implies Good's, but Good's does not imply Blackwell's (you can't derive the garbling condition from a single decision problem).

  10. **Final Polish:** Tone should be respectful, acknowledging the user's sophistication. Avoid over-explaining basics, focus on the structural relationship. (Proceed to generate output based on these thoughts.)
answer: |-
  Your hunch is essentially correct. You have correctly identified the structural relationship between the two theorems, the direction of implication involved, and the relative "depth" of the mathematical machinery required for each.

  Here is the detailed breakdown of that relationship, an explicit mapping of the proofs, and a judgment on their relative fundamentality.

  ### 1. The Reduction Holds: Good as a Special Case of Blackwell

  Your tentative hunch is mathematically sound. Good's Theorem is indeed a special case of the "easy" direction of Blackwell's Theorem, specifically where the less informative experiment is the **null experiment**.

  To see this formally:
  *   **Blackwell's Framework:** Let $\mathcal{E}_1$ and $\mathcal{E}_2$ be two experiments (Markov kernels from states $\Omega$ to signals $S$). Blackwell defines $\mathcal{E}_1 \succeq_B \mathcal{E}_2$ ($\mathcal{E}_1$ is more informative than $\mathcal{E}_2$) if $\mathcal{E}_2$ can be represented as $\mathcal{E}_1$ followed by a stochastic garbling matrix $M$ that does not depend on $\Omega$.
  *   **The Null Experiment:** Let $\mathcal{E}_{\emptyset}$ be an experiment that yields a signal $s_0$ with probability 1, regardless of the state $\omega$. This signal provides no update to the prior; the posterior equals the prior.
  *   **The Garbling:** For *any* experiment $\mathcal{E}$, one can construct a garbling matrix that ignores the output of $\mathcal{E}$ and outputs $s_0$ with probability 1. Therefore, $\mathcal{E} \succeq_B \mathcal{E}_{\emptyset}$ for all $\mathcal{E}$.
  *   **Blackwell's Direction 1:** If $\mathcal{E}_1 \succeq_B \mathcal{E}_2$, then for **all** decision problems (action spaces $A$, utility functions $u$), the expected utility from $\mathcal{E}_1$ is at least that of $\mathcal{E}_2$.
  *   **Good's Theorem:** For a **fixed** decision problem $(A, u)$ and prior, the expected utility from $\mathcal{E}$ is at least that of $\mathcal{E}_{\emptyset}$.

  Since Blackwell's Direction 1 quantifies over *all* decision problems, it logically entails the claim for any *specific* decision problem. Thus, Good's result is a direct corollary of Blackwell's sufficiency condition.

  ### 2. Which Half of Blackwell's Equivalence?

  You are also correct that Good's argument relies exclusively on the logic corresponding to **Blackwell's Direction 1 (Sufficiency $\implies$ Value)**.

  *   **Good's Proof:** Relies on the convexity of the value function $V(p) = \max_a \mathbb{E}[u(a, \omega) | p]$. Since $V$ is the maximum of linear functions (in $p$), it is convex. By the law of iterated expectations, the expected posterior is the prior. By Jensen's Inequality, $\mathbb{E}[V(p_{post})] \ge V(\mathbb{E}[p_{post}]) = V(p_{prior})$.
  *   **Blackwell's Direction 1:** The proof that garbling implies lower expected utility also relies precisely on this convexity argument. If experiment $Q$ is a garbling of $P$, the posterior distribution induced by $Q$ is a mean-preserving spread of the posterior distribution induced by $P$ (in the sense of Blackwell ordering of distributions). The convexity of the value function ensures that the "tighter" distribution of posteriors from $P$ yields higher expected value.
  *   **Blackwell's Direction 2:** The converse (Value $\implies$ Sufficiency) is the non-trivial half. It states that if an experiment is preferred for *all* utility functions, it *must* be possible to construct the garbling matrix. Proving this requires separating hyperplane theorems or minimax arguments to show that if the garbling *didn't* exist, one could construct a specific utility function that violated the preference ordering. Good's theorem does not touch this converse; it makes no claim about what the preference ordering implies regarding the structure of the experiments.

  ### 3. Fundamentality and Special Status

  If Good's Theorem is a corollary of Blackwell's, why does it retain a distinct identity in rationalist and philosophical literature? Is it merely a historical artifact, or does it hold genuine conceptual utility?

  **Blackwell is More Fundamental (Structurally)**
  Blackwell's Theorem is the deeper result regarding the **nature of information**. It provides an objective, agent-independent ordering of information structures. It tells us that "informativeness" is not just a vague concept but a rigorous mathematical property defined by the ability to simulate one signal from another. It separates the *supply* of information (the experiment) from the *demand* for information (the decision problem). In information economics and statistics, Blackwell is the bedrock.

  **Good is More Fundamental (Normatively/Pedagogically)**
  However, Good's Theorem retains special status for three reasons:

  1.  **Direct Normativity:** Rationalist discourse is typically prescriptive: "What should *I* do?" Blackwell's theorem requires quantifying over *all possible* utility functions to establish the ordering. An individual agent does not care about all possible utility functions; they care about *theirs*. Good's theorem speaks directly to the agent's specific situation without invoking the heavy machinery of universal quantification over decision problems. It is the "user-facing" API of the value of information.
  2.  **Proof Transparency:** Good's proof (convexity + Jensen's) is accessible to anyone with basic calculus and probability. Blackwell's converse direction requires functional analysis. For the purpose of convincing a community that "gathering evidence is good," Good's proof is self-contained and sufficient. Invoking Blackwell to prove Good's theorem is arguably overkill, akin to using the Classification of Finite Simple Groups to prove that $1+1=2$.
  3.  **The "Cost-Free" Assumption:** Good's 1967 note is explicitly titled regarding the "Principle of Total Evidence" in the context of cost-free information. Blackwell's framework handles comparisons generally, but Good's specific framing highlights the *marginal* value of information when the cost is zero. This is the specific premise required to argue against willful ignorance in idealized agents.

  ### 4. Resolution on Information Hazards

  You noted the tension with "information hazards." The reduction to Blackwell clarifies this tension significantly.

  Good's Theorem (and Blackwell's Direction 1) assumes the utility function $u(a, \omega)$ is fixed and comprehensive.
  *   **Internal Hazards:** If knowing $\omega$ causes psychological distress, that distress must be encoded in the utility function (e.g., $u$ depends on the action *and* the knowledge state). If the utility function properly accounts for the disutility of knowing, Good's theorem still holds: you should only seek the information if the instrumental benefit outweighs the intrinsic cost of knowing. If the intrinsic cost is high enough, the rational action is *not* to observe, but that is because the observation is no longer "cost-free" in utility terms.
  *   **External Hazards:** If the hazard arises because *others* will react to your knowledge (game theory), the single-agent decision framework of both Good and Blackwell is violated. The "state of the world" must include the other agents' strategies, which may depend on your information acquisition policy. In a game-theoretic setting, Blackwell ordering can fail (one experiment may be better for one equilibrium but worse for another).

  ### Judgment

  **Is Good's Theorem a trivial corollary?**
  Mathematically: **Yes.** Within the standard Savage/Blackwell framework, Good's result is an immediate consequence of the fact that any experiment is a garbling of the null experiment, combined with the convexity of the value function.

  **Does it deserve its fame?**
  Culturally and Pedagogically: **Yes.**
  Blackwell's theorem characterizes the *geometry of information*. Good's theorem characterizes the *rationality of curiosity*.
  While Blackwell tells us how to rank experiments, Good tells us why we should bother looking at them at all. For the specific project of rationalist epistemology—which is often about combating motivated stopping of inquiry—Good's specific, single-agent, convexity-based argument is the more relevant tool. It isolates the precise mechanism (convexity of the max operator) that makes information valuable, without the distraction of the converse characterization.

  **Summary:**
  You should treat Blackwell's Theorem as the **fundamental structural law** of information economics. You should treat Good's Theorem as the **fundamental normative lemma** for Bayesian agents. Good's theorem is a corollary of Blackwell's, but it is the specific corollary that answers the question "Why should I update?" whereas Blackwell answers "When is one channel better than another?"

  Your intuition that Good relies on the "easy" half of Blackwell is spot-on. The "hard" half of Blackwell (Value $\implies$ Garbling) is unnecessary for establishing the value of information; it is only necessary if you wish to infer the structure of an information source solely from observing an agent's preferences over them.
