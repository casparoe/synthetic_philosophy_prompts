answer: |-
  Good evening. For those of you I haven't met yet, I'm the brother of the bride. And for those of you who *have* met me, yes, I am the one who talks too much at holiday dinners.

  Standing here, looking at a room that is roughly half family and half philosophers, I realized I have a unique challenge. The family wants a toast that is warm, funny, and doesn't require a handout. The philosophy department wants something that doesn't misuse technical terminology. And I, having spent last week arguing with a friend about G. E. Moore, apparently want to settle a metaphysical score.

  So, I decided to base this toast on Moore's *Principia Ethica*.

  Now, for the family: Moore was a philosopher who spent two hundred pages building a complex logical framework, only to conclude that the very best things in life—the things with the most intrinsic value—boil down to just two categories. He called them "the pleasures of human intercourse and the enjoyment of beautiful objects."

  For the philosophers in the room: Yes, I know. It sounds like an anticlimax. My friend argued exactly that point last week. He asked, "What about knowledge? What about virtue? What about the satisfaction of a job well done?" It feels like a strangely thin inventory for the good life. It ignores the hard work of being good, or knowing the truth.

  But then I looked at [Sister's Name] and [Partner's Name]. And I thought: Maybe Moore was onto something. Or at least, maybe his framework explains *them* better than any other.

  First, consider Moore's "Method of Isolation." This is the test where you imagine a thing existing utterly alone, stripped of all its consequences and context, to see if it's still good.

  If we apply the isolation test to [Sister's Name] and [Partner's Name]'s relationship, stripping away the university, the cohort, the dissertations, the future tenure tracks, and the publications... what is left?

  Just them.

  And the answer is undeniable. The value of their love isn't instrumental. It's not good because it leads to a stable household or successful careers. It is good in itself. In a room full of people who spend their lives analyzing *why* things are good, these two have found something that passes the isolation test without breaking a sweat.

  But the real reason Moore fits this marriage is his Principle of Organic Unities.

  Moore argued that the value of a whole is not simply the sum of the values of its parts. Sometimes, when you combine two things, the value of the whole is wildly disproportionate to the addition of the parts.

  [Sister's Name] is brilliant. [Partner's Name] is brilliant. As the department knows, they are both formidable individual philosophers. If marriage were just arithmetic, we would expect a union of two smart people to equal "double the smarts."

  But marriage isn't arithmetic. It's chemistry. It's an organic unity.

  When you put them together, you don't just get two people talking. You get a new entity with a value that didn't exist before. The "pleasures of human intercourse"—which, for the sake of my grandparents, Moore meant as affectionate conversation and companionship, though I'm sure there's some of the other kind too—that intercourse creates a whole that is greater than the sum of its parts.

  And what about the "enjoyment of beautiful objects"? I think we often make the mistake of thinking philosophers only care about abstract truths. But watching these two, I realize they find beauty in the same things. In the arguments they refine together, in the quiet moments between the work, in the world they are building. They don't just analyze the good; they enjoy the beautiful.

  Now, I'm not going to stand here and pretend Moore was right about everything. My friend last week made a strong case that a life without virtue or knowledge is hollow. And he might be right. Moore's list *is* thin. It *is* risky to bet everything on love and beauty.

  But looking at [Sister's Name] and [Partner's Name], I'm willing to concede the argument.

  Because maybe knowledge and virtue are the *context*, but love and beauty are the *content*. Maybe the reason we seek knowledge or strive for virtue is precisely so we can better enjoy human intercourse and appreciate beautiful objects.

  So, to the philosophers: I know Moore is disputable. I know the "Ideal" is complicated.
  And to the family: I know this is a lot of jargon for a Tuesday night.

  But here is the simple truth beneath the technical apparatus: [Sister's Name] and [Partner's Name] have created an organic unity that passes the isolation test. They have chosen the two things Moore thought mattered most, and they have made them matter more.

  Let's raise a glass to the pleasures of their intercourse, the beauty they will share, and the organic unity they begin today.

  To [Sister's Name] and [Partner's Name].
