answer: |-
  Your roommate is right. In the world of probability, economics, and betting, **intent does not override arithmetic.**

  You have inadvertently stumbled upon a classic concept in decision theory and statistics called a **Dutch Book**.

  Here is the breakdown of why she is correct, why your defense doesn't hold up mathematically, and why this is actually a perfect lesson for an econ student.

  ### 1. The Math: The Dutch Book Theorem
  The Dutch Book argument states that if your betting odds (which reflect your subjective probabilities) are **incoherent**—meaning they violate the basic axioms of probability—you can be guaranteed to lose money against a clever bettor, regardless of the actual outcome.

  In a mutually exclusive set of outcomes (only one movie can win Best Picture), the sum of the implied probabilities of your odds must equal **100%** (or more, if you want to build in a profit margin, known as the *vig* or *overround*).

  *   **Example:** If there are 5 nominees and you offer odds that imply each has a 15% chance of winning, your probabilities sum to 75%.
  *   **The Result:** If bettors place wagers on all five movies proportional to those odds, you will pay out more money than you collected, no matter which movie wins.

  Your roommate ran the numbers and found that your liabilities exceeded your total take in **every possible state of the world**. That is the definition of a guaranteed loss.

  ### 2. Why Your Defense Doesn't Work
  You argued: *"I never treated those bets as one package - each one seemed fine on its own at the time."*

  This is a behavioral bias, not a mathematical defense. Here is why it fails:

  *   **Money is Fungible:** At the end of the night, you don't pay out winnings from "Bucket A" (bets on Movie A) and keep losses in "Bucket B." You pay from the same pool of cash. The aggregate position is the only one that matters financially.
  *   **Sequential vs. Aggregate Risk:** Just because you made the decisions sequentially doesn't mean the risks don't accumulate. It is like walking into a room and agreeing to sell someone a dollar for 90 cents. It seems like a fine transaction in isolation (you get 90 cents!). But if you do it ten times, you have guaranteed a loss. The fact that you didn't plan to do it ten times when you did the first one doesn't get you your money back.
  *   **The "Money Pump" Argument:** In economics, this is often called a "money pump." If your preferences or odds are inconsistent, a rational agent can pump you for infinite money by repeatedly exploiting those inconsistencies. The fact that you didn't *notice* the inconsistency doesn't stop the pump from working.

  ### 3. The Econ Lesson (Since you're in the program)
  This scenario is practically a textbook example of **Rational Choice Theory**.

  *   **Coherence:** To be considered a "rational agent" in the economic sense, your subjective probabilities must be coherent (obey probability laws). If they aren't, you are vulnerable to arbitrage.
  *   **Dynamic Updating:** A professional bookie doesn't set odds once and forget them. They adjust the odds dynamically based on where the money is coming in to ensure they remain balanced (a "balanced book"). By treating each bet as isolated, you failed to update your "book exposure" after each transaction.
  *   **Revealed Preference:** Your roommate is arguing from the standpoint of *revealed preference*. It doesn't matter what you *thought* you were doing; your actual financial commitments reveal that your pricing model was flawed.

  ### The Verdict
  **Your roommate is objectively right.**

  You created an arbitrage opportunity for your friends. They effectively bought a portfolio of bets that guaranteed a profit at your expense. While it feels unfair because you didn't intend to create a "package," the financial reality is that you priced risk incoherently.

  **How to fix it next year:**
  1.  **Calculate Implied Probabilities:** Convert your odds to percentages (e.g., +200 = 33.3%).
  2.  **Check the Sum:** Ensure the sum of all implied probabilities is **greater than 100%** (e.g., 105% or 110%). This is your profit margin.
  3.  **Adjust Dynamically:** If a lot of money comes in on one movie, lower the odds on that movie and raise them on the others to balance your liability.

  Pay the loss, take the lesson, and tell your roommate she can have a beer on you. She just gave you a free seminar in Decision Theory.
