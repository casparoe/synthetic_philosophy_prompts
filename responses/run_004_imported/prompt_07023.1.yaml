prompt: |-
  A few of us from work turned a side project -- a fully automated bot that finds +EV bets in sports markets -- into an actual small fund, and we've now got some outside money in it too, not just our own. So I guess I'm on the "risk committee" now, which is a fancy name for 5 engineers arguing in a slack channel. We're stuck on bet sizing and it's turned into a whole fight before our meeting this weekend where we're supposed to lock this in. Two people want to go full Kelly criterion because "its mathematically proven to maximize our long-run growth," but Priya (did stats in undergrad) keeps bringing up some old paper by a famous economist that apparently trashes the whole idea -- supposedly written entirely in one-syllable words as basically an insult to the Kelly crowd -- arguing there's nothing actually special about maximizing log wealth, it's just one utility function you could've picked among many. We need an actual written policy before we take on more outside money, not just vibes. Can you draft the memo I'd send the group: recommend a real sizing rule with actual numbers in it, and take the "why should we even care about long-run growth rate, why log wealth specifically" objection seriously instead of just waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A small group of engineers turned a sports betting bot (+EV finder) into a small fund with outside capital.
      *   **Problem:** They are stuck on bet sizing policy.
      *   **Conflict:** Two engineers want full Kelly Criterion (maximize long-run growth). Priya (stats background) objects, citing an old paper by a famous economist (likely Samuelson, specifically "Why We Should Not Make Mean Log of Wealth Big Though Years Be Many" written in one-syllable words) arguing that log wealth is just one utility function among many and not inherently "optimal."
      *   **Goal:** Draft a memo for the group to lock in a sizing policy before the weekend meeting.
      *   **Requirements:**
          *   Recommend a specific sizing rule with actual numbers.
          *   Address Priya's objection seriously (why log wealth? why long-run growth?).
          *   Tone: Professional but appropriate for a small engineer-led fund (technical but decisive).
          *   Audience: The "risk committee" (the 5 engineers).

  2.  **Identify the Core Concepts:**
      *   **Kelly Criterion:** Maximizes expected logarithm of wealth. Leads to maximum geometric growth rate. High volatility (50% drawdowns are common with *full* Kelly).
      *   **Priya's Objection (Samuelson's Critique):** Maximizing geometric mean isn't *universally* optimal. It depends on the utility function. If you care more about avoiding ruin than maximizing terminal wealth, full Kelly is too aggressive. Also, estimation error kills Kelly.
      *   **Fractional Kelly:** The industry standard compromise. Reduces volatility and protects against model error (overestimating edge).
      *   **Risk of Ruin:** Outside money implies fiduciary duty. Cannot afford 50-70% drawdowns.
      *   **Utility Function:** Need to define *our* utility. Is it just money? Or money adjusted for sleep-at-night factor?

  3.  **Determine the Recommendation:**
      *   *Full Kelly* is irresponsible for a fund with outside capital, especially a new one. The volatility is too high, and edge estimation is never perfect.
      *   *Fixed Fractional* is too arbitrary.
      *   *Half-Kelly (or Quarter-Kelly)* is the pragmatic engineering solution. It retains most of the growth (75% of growth rate at half-Kelly) while drastically reducing variance (50% of variance).
      *   *Cap on Bet Size:* Need a hard limit per bet to prevent concentration risk.
      *   *Drawdown Circuit Breaker:* Need a mechanism to reduce size if things go wrong.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the decision clearly. We are adopting Fractional Kelly.
      *   **The Debate (Addressing Priya):** Acknowledge the Samuelson critique. It's valid. Log-wealth maximization isn't a law of physics; it's a preference. However, for a *fund*, geometric growth is the metric that matters for compounding without ruin. But we must adjust for *parameter risk* (we don't know the true edge).
      *   **The Proposal (The Numbers):**
          *   Base Sizing: Half-Kelly.
          *   Max Single Bet: Cap at X% of bankroll (e.g., 2-3%).
          *   Drawdown Protocol: Reduce size if DD > Y%.
      *   **Rationale:** Why Half-Kelly? It balances the growth vs. volatility trade-off. It accounts for the fact that our bot's edge estimates are likely optimistic.
      *   **Next Steps:** Implement in code, review in 3 months.

  5.  **Refining the Tone and Content:**
      *   *Tone:* Needs to be collaborative but firm. "We are engineers, let's optimize for robustness, not just theoretical max."
      *   *Priya's Point:* Specifically mention Paul Samuelson. The "one-syllable words" paper is a famous anecdote ("Why We Should Not Make Mean Log of Wealth Big Though Years Be Many"). Acknowledging this shows respect for her research.
      *   *The "Why":* Explain that while Kelly maximizes *expected* log wealth, it assumes known probabilities. In sports betting, probabilities are estimated. Overestimating edge by 2x leads to ruin with Full Kelly. Fractional Kelly is a margin of safety.
      *   *Outside Money:* Emphasize fiduciary responsibility. Investors will redeem at the bottom if volatility is too high.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest Quarter-Kelly.
      *   *Correction:* Half-Kelly is standard enough. Let's stick with Half-Kelly but add a hard cap per bet to prevent skew.
      *   *Check:* Did I include actual numbers? Yes (50% Kelly, 2% hard cap, 15% drawdown trigger).
      *   *Check:* Did I address the utility function argument? Yes, by framing the fund's utility as "survival + compounding" rather than pure terminal wealth maximization.

  7.  **Final Polish:** Ensure the math logic is sound (Half Kelly = 75% growth, 50% variance). Make sure the Samuelson reference is accurate. (Samuelson's 1971 paper "The Fallacy of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling" is the one, though the one-syllable poem is often attributed to him in lore/lectures). *Correction:* The one-syllable poem is specifically associated with Samuelson's critique of Kelly. I should reference that specifically to show I listened to Priya.

  8.  **Final Output Generation:** (Proceed to write the memo based on these points.)
answer: |-
  **TO:** Risk Committee (Slack Channel)
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Bet Sizing Policy & Risk Framework

  Team,

  Ahead of our weekend meeting, I want to put a concrete proposal on the table so we aren't debating first principles from scratch. We need a policy that satisfies our mathematical goals while respecting the reality that we are managing outside capital.

  After reviewing the arguments for Full Kelly and Priya's objections regarding utility functions and parameter risk, **I recommend we adopt a Half-Kelly Criterion with hard concentration caps and a drawdown circuit breaker.**

  Below is the specific policy, followed by the rationale addressing the "Why Log Wealth?" debate.

  ### 1. The Proposed Policy

  **A. Sizing Rule: Fractional Kelly**
  *   **Formula:** We will calculate the theoretical Kelly fraction ($f^*$) for every bet based on our model's edge. We will execute at **50% of $f^*$**.
  *   **Rationale:** This retains approximately 75% of the expected growth rate of Full Kelly but reduces the variance of the growth rate by 50%.

  **B. Concentration Limit (Hard Cap)**
  *   **Rule:** No single bet may exceed **2.0% of total Fund NAV**, regardless of what the Kelly formula suggests.
  *   **Rationale:** Kelly assumes independent trials. Sports markets have correlation risk (e.g., multiple bets relying on the same underlying player prop or market inefficiency). This cap prevents model error or correlation shocks from causing catastrophic drawdowns.

  **C. Drawdown Circuit Breaker**
  *   **Rule:** If the Fund experiences a **15% drawdown** from peak NAV, all bet sizes are automatically reduced to **25% Kelly** until new highs are reached.
  *   **Rule:** If the Fund experiences a **25% drawdown**, trading halts for a manual risk review.
  *   **Rationale:** Outside investors have lower risk tolerance than engineers. This protects the capital base and prevents "tilt" (trading aggressively to recover losses).

  ---

  ### 2. Addressing the "Why Log Wealth?" Objection

  Priya is correct to flag the theoretical issue here. She is referring to Paul Samuelson's critique (specifically his 1971 paper and the famous anecdote where he wrote a poem in one-syllable words to mock the idea that maximizing geometric mean is universally optimal).

  **The Objection:**
  Samuelson argued that maximizing the expected logarithm of wealth is not a law of physics. It is simply one specific utility function among many. If an investor has a different utility function (e.g., they care more about avoiding a 20% drop than doubling their money in 10 years), then Kelly is mathematically "wrong" for them. There is no inherent reason we *must* maximize long-run growth rate.

  **Why We Are Choosing Log Wealth (With a Safety Margin):**
  While Priya is right that log-utility isn't universal, it is the correct utility function for **this specific business structure**, provided we adjust for estimation error.

  1.  **The Fund Structure Demands Compounding:** We are not trading with a fixed stake. We are reinvesting profits. In a compounding environment, the arithmetic mean (expected value of a single bet) is irrelevant; the geometric mean (compound growth rate) is the only metric that determines terminal wealth. If you maximize arithmetic expectation without regard for variance (Full Kelly or worse), you invite ruin. Log-wealth maximization is the mathematical proxy for "maximize growth without going broke."
  2.  **Parameter Risk (The Engineer's View):** Full Kelly assumes we know the true probability of winning. We don't. We have an *estimated* probability from a model. If our model overestimates our edge by even a small margin, Full Kelly pushes us into "overbetting" territory, where expected growth turns negative and risk of ruin skyrockets.
  3.  **The Compromise:** By using **Half-Kelly**, we are effectively acknowledging Samuelson's point. We are admitting that our utility function isn't "Pure Log Wealth." Our utility function is "Log Wealth penalized for Uncertainty." Fractional Kelly is the engineering control knob that accounts for the fact that our inputs (edges) are noisy.

  ### 3. Summary of Risks

  | Strategy | Expected Growth | Volatility | Risk of Ruin | Suitability for Outside Capital |
  | :--- | :--- | :--- | :--- | :--- |
  | **Full Kelly** | Max | Very High | High (if edge overestimated) | **No** |
  | **Fixed Bet Size** | Low | Low | Low | Inefficient |
  | **Half-Kelly (Proposed)** | ~75% of Max | ~50% of Max | Negligible | **Yes** |

  ### 4. Next Steps

  1.  **Code Implementation:** Update the execution bot to cap orders at 50% of calculated Kelly, hard-limited at 2% NAV.
  2.  **Monitoring:** Set up alerts for the 15% drawdown threshold.
  3.  **Review:** We revisit this policy in Q1 after we have 3 months of live performance data.

  Let's use the weekend meeting to vote on the specific drawdown thresholds (15% vs 20%), but I ask we agree in principle on the Fractional Kelly framework. It bridges the gap between "maximize growth" and "don't lose the clients' money."

  Thoughts?

  [Your Name]
