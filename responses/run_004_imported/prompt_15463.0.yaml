answer: |-
  You didn't mess up the math, and neither did the rest of the line. Your brother-in-law is right about the *theory*, but he's applying a model of human behavior that was famously debunked by exactly this kind of scenario.

  What you experienced is a textbook example of the **Allais Paradox**, named after the French economist Maurice Allais, who first demonstrated it in 1953. It is one of the foundational pillars of **Behavioral Economics**.

  Here is the breakdown of why your instincts were "psychologically rational" even if they were "mathematically inconsistent" under classical models.

  ### 1. The Actuary's Math (Expected Utility Theory)
  Your brother-in-law is using **Expected Utility Theory (EUT)**. This is the standard economic model which assumes humans are rational agents who maximize value. Under EUT, if you prefer Option A over Option B, you should maintain that preference ratio even if you strip away common probabilities (this is called the **Independence Axiom**).

  Here is the contradiction he found:
  *   **Raffle 1:** By choosing the guaranteed \$200, you implied that the *utility* of a sure \$200 is greater than the weighted utility of the gamble. Mathematically, this suggests you value the certainty premium highly.
  *   **Raffle 2:** By choosing the 15% shot at \$1,000, you implied that the weighted utility of the \$1,000 gamble is higher than the \$200 gamble.
  *   **The Conflict:** If you write out the inequalities, Raffle 1 implies $0.2 \times U(\$200) > 0.15 \times U(\$1,000)$. Raffle 2 implies the exact opposite: $0.15 \times U(\$1,000) > 0.2 \times U(\$200)$.

  You cannot hold both preferences simultaneously without violating the axioms of Expected Utility Theory. So, strictly speaking, your brother-in-law is correct: **The choices are inconsistent.**

  ### 2. The Human Reality (Prospect Theory)
  However, the fact that *almost everyone* made the same "inconsistent" choice suggests the problem isn't with the people; it's with the theory.

  In 1979, psychologists Daniel Kahneman and Amos Tversky published **Prospect Theory**, which largely overturned EUT in descriptive psychology (Kahneman later won the Nobel Prize for this). They identified exactly what happened in your school raffle: **The Certainty Effect.**

  Humans do not weight probabilities linearly. We do not treat a drop from 100% to 80% the same way we treat a drop from 20% to 15%, even though both are a 5% difference.
  *   **Raffle 1:** Moving from 100% (Guaranteed) to 80% (Probable) feels like a massive loss of security. We overweight the difference between "sure thing" and "maybe." The pain of potentially walking away with nothing (the 5% risk) outweighs the upside of the \$1,000 voucher.
  *   **Raffle 2:** Both options are unlikely (20% and 15%). Neither feels "safe." Since the certainty premium is off the table, people switch to maximizing the potential payout. The difference between 20% and 15% feels negligible compared to the difference between \$200 and \$1,000.

  ### 3. The Verdict
  To answer your specific questions:

  *   **Did a whole line of normal adults just mess up the math?**
      No. You applied a heuristic (mental shortcut) that is generally adaptive. In the real world, a "guaranteed" resource is often survival-critical, while a probability shift from 20% to 15% is often noise. Your brains were optimizing for security first, then value.
  *   **Is the actuary missing something?**
      He is missing the psychology. He is grading human behavior against a model (EUT) that assumes humans are rational calculators rather than risk-averse survivors.
  *   **Is that a fact about people, or about the theory grading us?**
      It is a fact about the theory being incomplete. The Allais Paradox proved that Expected Utility Theory cannot accurately describe how humans actually make decisions under risk.

  **The Sanity Check:**
  Your instincts are fine. You fell for a cognitive bias that won a Nobel Prize for the people who discovered it. If you want to gently push back on your brother-in-law, tell him you were demonstrating the **violation of the Independence Axiom** via the **Certainty Effect**, and that you prefer **Prospect Theory** over **Expected Utility** for descriptive accuracy.

  (Then take the \$200 and buy a nice dinner.)
