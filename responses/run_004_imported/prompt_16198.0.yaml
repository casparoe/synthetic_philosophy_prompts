answer: |-
  This is a classic problem in enforcement economics and mechanism design, but you are right to distinguish it from the standard Goodhart's Law examples. In the typical "teaching to the test" scenario, the agent manipulates the metric to *simulate* success without achieving the goal. Here, the rangers in the successful sector *have* achieved the goal, but the metric penalizes them for it.

  You are observing a **Stock-Flow Confusion** compounded by a **Dynamic Depletion Effect**.

  ### 1. The Diagnosis: Why the Metric Inverted

  The NGO is rewarding a **flow** (snares removed per month) to achieve a reduction in a **stock** (snare density/poaching risk).

  *   **Phase 1 (High Stock):** Initially, snare density was high across the reserve. In this regime, the production function was linear: Ranger Effort $\rightarrow$ Snares Found. Because removing snares directly reduced poaching success, *Snares Found* was a valid proxy for *Poaching Reduced*. The correlation held.
  *   **Phase 2 (Low Stock):** In Sector A, rangers have driven the stock of snares near zero. The production function has hit a boundary condition: Ranger Effort $\rightarrow$ **Zero** Snares Found.
  *   **The Inference Error:** Management is interpreting *Output* (Snares Found) as a proxy for *Input* (Ranger Effort). In Sector A, Output has collapsed not because Input collapsed, but because the "raw material" (snares) has been depleted. Management is punishing the rangers for making their own jobs obsolete.

  In economic terms, the marginal product of patrol effort (in terms of snares found) has diminished to zero in Sector A, even though the marginal social value of that effort (maintaining a snare-free zone) remains high.

  ### 2. The Sector B Anomaly

  Sector B presents a secondary risk. They are earning high bonuses in a high-poaching environment. There are two possibilities here:

  1.  **The Crisis Premium:** The poaching pressure in Sector B is so high (inflow > outflow) that rangers can work maximally hard and still find many snares. They are being rewarded for managing a crisis they cannot solve, while Sector A is punished for solving it.
  2.  **Induced Supply (The Cobra Effect):** While you noted the original link wasn't manipulated, the *new* incentive structure might be changing behavior. If rangers realize that "No Snares = No Bonus," rational agents in Sector B might begin to leave snares in place to find them later, or even collude with poachers to ensure a steady supply of "work." This is the traditional Goodhart's Law risk, which is now becoming active because the metric is broken.

  ### 3. Why Standard Solutions Don't Apply

  *   **Why not just use the camera traps?** You likely face a **frequency/cost constraint**. Camera trap data is lagged and expensive to process. Bonuses need to be monthly to maintain morale and liquidity for the rangers.
  *   **Why not patrol hours (Effort-based)?** Pure effort monitoring (GPS tracks, hours logged) creates a **multi-tasking problem**. Rangers will optimize for distance covered or time spent, potentially ignoring high-risk areas that are hard to traverse, or "ghost patrolling" (driving the route without looking).

  ### 4. Proposed Mechanism Design Solutions

  To fix this, you must align incentives with the *absence* of snares, not the *removal* of them. You need to shift from rewarding **Clearing** to rewarding **Security**.

  #### A. The "Clean Sweep" Audit (Recommended)
  Instead of paying for snares found, pay for snares *not* found by auditors.
  *   **Mechanism:** Management (or an independent team) conducts random, unannounced audits of patrol sectors.
  *   **Incentive:** If the audit team finds snares that the rangers missed, the ranger team incurs a penalty or loses their bonus. If the audit finds zero snares, the team receives a "Security Bonus."
  *   **Economic Logic:** This turns the metric on its head. The rangers now want the stock to be zero so the auditors find nothing. It aligns the agent's interest with the principal's goal (zero poaching risk).

  #### B. Dynamic Quotas / Relative Performance
  *   **Mechanism:** Adjust snare-count targets based on the historical depletion of the sector. If Sector A's snare count drops for two consecutive months, the "expected" count resets to zero, and the bonus is decoupled from counts, shifting to a flat "maintenance" rate contingent on independent wildlife counts.
  *   **Economic Logic:** This acknowledges the non-linear production function. However, it requires management to admit their metric is state-dependent, which they seem reluctant to do.

  #### C. Hybrid: Effort + Outcome
  *   **Mechanism:** Base pay is tied to verified patrol effort (GPS + time in high-risk zones). The bonus is tied to the *lagged* independent data (camera traps), even if paid quarterly rather than monthly.
  *   **Economic Logic:** This separates the liquidity need (base pay for effort) from the incentive need (bonus for outcome). It reduces the pressure to "find" snares monthly.

  ### 5. How to Frame This in Your Write-up

  For an economics audience, you should frame this as a **breakdown in the informativeness of a signal due to stock depletion.**

  *   **Signal:** Snares Found ($S$).
  *   **State:** Poaching Pressure ($P$).
  *   **Effort:** Ranger Patrol ($E$).
  *   **Original Model:** $S = f(E, P)$. When $P$ is high, $S$ is informative about $E$.
  *   **Current Model:** When $P \to 0$ (due to high past $E$), $S \to 0$ regardless of current $E$. The signal $S$ loses its informativeness regarding $E$.

  Management is committing an **attribution error**, assuming low $S$ implies low $E$, when it actually implies low $P$.

  **The Punchline:** The NGO is currently running a **bounty system** (pay per pelt) when they should be running a **contract security system** (pay for safety). A bounty system works for reducing an existing population; it fails catastrophically when the goal is eradication and maintenance of a zero-population state.

  **Immediate Advice:** If you can influence them, suggest they implement the **Audit Model** immediately. It is the only way to reward the *absence* of the negative externality. If they cut funding to Sector A, they will induce shirking (rangers will stop looking so hard, or worse, allow poachers back in to regenerate the "crop" of snares needed to earn their bonus).
