answer: |-
  **Setting:** *A conference room at the university engineering center. A whiteboard dominates one wall, covered in marker sketches: a convex curve representing the feasible utility set, a point labeled **d** (disagreement) in the lower left, and two distinct points marked on the Pareto frontier: **N** (Nash) and **K** (Kalai-Smorodinsky). **Elena** (Nash advocate) stands with a capped marker, arms crossed. **Marcus** (Kalai-Smorodinsky advocate) holds an uncapped marker, gesturing at the curve.*

  **Elena:** Look at the geometry, Marcus. The curve represents what the Build and Software teams can achieve together. Point **d** is what they get if they walk away and chase solo sponsors. Point **N** maximizes the product of their gains. It is the unique solution that satisfies Pareto efficiency, symmetry, scale invariance, and Independence of Irrelevant Alternatives. It is mathematically pristine.

  **Marcus:** Mathematically pristine, yes. But intuitively broken. Look at point **K**. It lies on the line connecting **d** to the "ideal point"—the maximum possible utility each team could hope for if the other conceded everything. Kalai-Smorodinsky preserves the ratio of their relative hopes. In this specific sketch, **K** gives Software more than **N** does. And given that Software's potential ceiling is higher, that's the right outcome.

  **Elena:** That's the crux of it, isn't it? You're willing to sacrifice Independence of Irrelevant Alternatives—IIA—to get that result. Do you realize what you're telling the clients? You're telling them that if we add a hypothetical option to the table that *nobody is going to choose*, the actual deal they sign changes. That violates basic rationality. If I offer you a choice between an apple and a banana, and you pick the apple, I shouldn't be able to change your mind by adding a rotting orange to the menu.

  **Marcus:** That's the standard fruit analogy, Elena, but bargaining isn't about picking fruit from a basket. It's about leverage. The "irrelevant alternatives" you want to ignore aren't just rotting oranges. They represent *potential*. In the Kalai-Smorodinsky framework, the shape of the frontier tells a story about bargaining power. If I expand the feasible set in your favor—meaning your maximum possible payoff increases while mine stays the same—your bargaining power *should* increase.

  **Elena:** And under Nash, it usually does.

  **Marcus:** *Usually.* But not always. That's the monotonicity violation. Here is the concrete case that killed IIA for me. Imagine a labor negotiation. The union and management are bargaining over wages and benefits. The feasible set is the current economic reality. Now, suppose the economy booms. The maximum possible wage the company could pay without going bankrupt goes *up*. The feasible set expands upward. Under Kalai-Smorodinsky, the union's settlement goes up. Their potential improved, so their outcome improves.

  **Elena:** That sounds nice.

  **Marcus:** Under Nash? It is mathematically possible for the union's settlement to go *down* when their maximum potential goes *up*. Because Nash focuses on the *product* of gains, the curvature of the new frontier might shift the tangency point in a way that penalizes the player whose ceiling rose. If I'm the union rep, and I tell my members, "Good news, the company can afford more, so we settled for less," I will be run out of town. Monotonicity isn't a slogan; it's a requirement for a solution to be defensible in the real world.

  **Elena:** I accept that monotonicity is appealing. But you are buying it at too high a price. By dropping IIA, you make the solution manipulable. If the outcome depends on the "ideal point"—the absolute maximum each side could get—then I have an incentive to inflate my claims about what's possible. If I can convince the mediator that my "best case scenario" is higher, I shift the ideal point, I rotate the KS line, and I get a better deal without actually changing the feasible agreements.

  **Marcus:** That's a claim about verification, not theory. If you lie about your capabilities, that's fraud. We assume the feasible set is known.

  **Elena:** In your robotics case, is it known? The prompt says the fundraising potential is "lopsided and non-linear." Software might claim they can land a tech giant sponsor if they get 90% of the credit. Build might say they can land a manufacturing contract if they get 90%. Those are the ideal points. If you use KS, the negotiation becomes a contest of who can dream bigger, not who can create more value. Nash ignores the utopia point. It only cares about the marginal trade-offs at the margin. It forces you to find the split where the relative urgency of gain is equalized. It stabilizes expectations.

  **Marcus:** It stabilizes expectations by ignoring context. Let's look at your IIA defense. You say removing an unchosen option shouldn't matter. But in bargaining, the *existence* of an option signals strength. Suppose the Software team has a unique algorithm that *could* theoretically be licensed for \$1 million, but only if they get full ownership (which Build won't allow). That \$1 million point is infeasible in a joint deal, but it defines the ideal point.

  **Elena:** If it's infeasible, it's not in the set $S$.

  **Marcus:** It defines the *shape* of $S$. If that algorithm gets patented by a competitor, the feasible set shrinks. The \$1 million ideal point vanishes. Under KS, Software's share of the sponsorship drops immediately. Why? Because their leverage dropped. Under Nash, if the local curvature of the frontier near the solution doesn't change, the split might stay exactly the same. Nash says, "Well, you lost your million-dollar dream, but the trade-off rate right here at the 50/50 mark hasn't changed, so your payoff is identical." That is insane. Losing your best alternative *must* hurt your current settlement.

  **Elena:** But that's exactly why IIA is there! To distinguish between the *threat* of walking away and the *hope* of winning big. The disagreement point **d** captures the threat. That's your fallback. That's your safety net. The ideal point is a fantasy. Why should the division of actual surplus depend on a fantasy? Nash says: Your fallback is real (**d**). The surplus is real. Maximize the product of the real gains. If your fantasy evaporates, but your fallback and the immediate trade-offs remain, why should the deal change?

  **Marcus:** Because bargaining is about relative strength, not just immediate trade-offs. The "fantasy" is the measure of how much value I bring to the table relative to you. If I bring a potential million and you bring a potential hundred thousand, even if we settle in the middle, I should get more of the surplus. KS captures that proportionality. Nash captures... geometric efficiency.

  **Elena:** Geometric efficiency *is* rationality. Think about the axioms. Nash's solution is the only one that is invariant to how we measure utility. If I switch from dollars to "happiness points" using a linear scale, the solution holds. KS respects that too, sure. But KS fails a consistency test. Imagine we have three sub-teams, not two. We bargain pairwise. If we use KS, we can get cycles. A gives to B, B gives to C, C gives to A, depending on how we subset the negotiations. Nash is consistent across subsets because of IIA. If you want a formula for a robotics team that might expand to mechanical, electrical, and software later, Nash scales. KS creates path-dependency.

  **Marcus:** Path-dependency is reality! Negotiations happen in sequence. But let's come back to your clients. Build vs. Software. Build is tangible. Hardware costs money. Software is scalable. The feasible set is likely skewed—Software has a higher ceiling (they can license code infinitely), Build has a higher floor (they always need chassis).

  **Elena:** Exactly. So the disagreement point **d** is higher for Build.

  **Marcus:** But the ideal point is higher for Software. Nash will overweight the disagreement point. It will protect Build's baseline. KS will acknowledge Software's ceiling. Which message do you want to send to the students? "Protect your baseline"? Or "Reward your potential"?

  **Elena:** I want to send the message: "Don't bluff." If Software inflates their potential to shift the ideal point, KS rewards them. Nash forces them to prove that the marginal gain is worth the cost. Nash encourages them to make the pie bigger locally, not argue about the theoretical maximum.

  **Marcus:** And Nash encourages them to ignore the fact that if the market for software explodes tomorrow, they should see a benefit today. Look, Elena, I'm not saying Nash is wrong. I'm saying IIA assumes the feasible set is a static menu. It's not. It's a reflection of power. When you drop IIA, you admit that the *range* of possibilities matters, not just the *margin*.

  **Elena:** But when you drop IIA, you admit that adding a "poison pill"—an option that is terrible for both of us but terrible for me slightly less—could shift the ideal point and alter the settlement. I can manipulate your solution by adding noise to the frontier.

  **Marcus:** Only if you can manipulate the *extremes* of the frontier. That's harder than manipulating the local curvature. And frankly, I'd rather my solution be sensitive to the extremes than insensitive to my own growth. If I find a way to expand the set solely in my direction, KS guarantees I benefit. Nash offers me no such promise. Why would I sign up for a formula where improving my own BATNA (Best Alternative to a Negotiated Agreement) might not pay off?

  **Elena:** Because improving your BATNA moves **d**, not the ideal point. Both solutions respect changes to **d**. We are talking about changes to the *upper* frontier.

  **Marcus:** Precisely. The upper frontier is where value creation happens. **d** is where value creation died. Why are you anchoring the solution to the graveyard of the deal (**d**) and the geometry of the middle, while ignoring the peak of the mountain?

  **Elena:** Because the peak is often unreachable. Basing a contract on the unreachable is how you get litigation. Basing it on the marginal trade-off is how you get signatures. Nash is the solution of the dealmaker. KS is the solution of the arbitrator who has the luxury of caring about proportional fairness over stability.

  **Marcus:** And Nash is the solution of the mathematician who fears manipulation more than stagnation. KS is the solution of the partner who wants to know that if they bring more to the table, they get more out of it.

  *Elena uncaps her marker and walks to the board. She draws a small circle around point **N**.*

  **Elena:** If I recommend Nash to this team, I am telling them: "Focus on what you can actually agree on right now. Ignore the moonshots. Split the surplus where your mutual urgency matches."

  *Marcus draws a circle around **K**.*

  **Marcus:** If I recommend KS, I am telling them: "Acknowledge that Software has higher scalability, and Build has higher necessity. Split the surplus in proportion to your maximum contributions."

  **Elena:** One is consistent.

  **Marcus:** One is monotonic.

  **Elena:** (Sighs) You know the worst part? For this specific curve, if the disagreement point shifts slightly, **N** and **K** could swap positions.

  **Marcus:** Then the choice isn't about the math. It's about the culture. Do they want to be partners maximizing a joint venture? Or collaborators splitting a windfall?

  **Elena:** (Capping the marker) I suppose that's why they're paying us to argue. So they don't have to.

  **Marcus:** (Smiling) Agreed. Shall we let them decide which axiom they're willing to live without?

  **Elena:** Independence or Monotonicity. Pick your poison.

  *They step back from the board, leaving the two points marked in different colors, equidistant from the agreement.*
