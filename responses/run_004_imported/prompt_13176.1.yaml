prompt: |-
  I'm on the incident-review board at the software company I work for, and we just finished writing up a nasty one: a multi-hour outage that kicked off when an on-call engineer got paged about weird traffic at 2am and snoozed the alert for 45 minutes, because that particular alert had cried wolf all week. Except once you actually dig into it, that's not the only place things could've gone differently -- a seperate team had a ticket open for three months flagging that the service in question had no rate limiting, and it just never got prioritized; the reason it never got prioritized is that the roadmap review last quarter explicitly deprioritized "hardening" work in favor of a launch deadline; and the reason the on-call engineer was covering three services solo that night instead of splitting the load is a hiring freeze from earlier this year. For literally every one of those, it's true that if that person or team had done the thing they didn't do, the outage probably doesn't happen, or is a lot smaller -- so by a plain "but for this, it wouldn't have happened" test, they're all causes.

  The postmortem doc is supposed to name actual root causes / contributing factors, not just list everyone who touched the situation, so it can drive real follow-up work -- and the board is stuck on where to stop. Some people want to stop at the on-call engineer's snooze since that's the proximate thing; others think that's just scapegoating someone for decisions made way above their pay grade, and want the roadmap call, or even the hiring freeze, named as the real root cause -- but then someone reasonably points out that if we're willing to go back that far, why stop there and not blame whoever approved the budget behind the freeze, and so on forever. My partner, who's a lawyer, says this is basically the same fight they have over proximate cause, which did not make me feel better. A couple of us are also uneasy that wherever we end up drawing the line is going to suspiciously match whoever we already felt comfortable holding responsible before we started, which makes me wonder whether we're tracking causes at all at that point, versus just dressing up our blame calls in causal-sounding language after the fact.

  Could you draft the actual memo I'd bring to the board before we meet again next week -- one that proposes a real method for sorting which of these omissions count as causes for the writeup versus mere background conditions, applies it to say something concrete about this specific incident, and directly answers that last worry instead of dodging it. We run these reviews often enough that I want an actual method out of this, not just a one-off verdict we'll forget about by the next incident.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Incident Review Board Member at a software company.
      *   **Task:** Draft a memo for the next board meeting.
      *   **Problem:** The board is stuck on defining "root cause" vs. "background condition" in a complex outage scenario involving multiple layers (on-call snooze, ignored ticket, roadmap prioritization, hiring freeze). There's a fear of infinite regress (blaming the budget approver) and a fear of confirmation bias (picking causes that match pre-existing blame instincts).
      *   **Requirements:**
          1.  Propose a *method* for distinguishing causes from conditions (not just a one-off verdict).
          2.  Apply the method to the specific incident described.
          3.  Directly address the worry about bias/dressing up blame as causality.
          4.  Tone: Professional, constructive, actionable, systemic (not blaming individuals).
          5.  Goal: Drive real follow-up work, not just assign fault.

  2.  **Deconstruct the Incident:**
      *   *Event:* Multi-hour outage.
      *   *Trigger:* Weird traffic at 2am.
      *   *Factor 1 (Human):* On-call engineer snoozed alert (cry wolf fatigue).
      *   *Factor 2 (Technical/Process):* No rate limiting (ticket open 3 months, deprioritized).
      *   *Factor 3 (Strategic):* Roadmap prioritized launch over hardening.
      *   *Factor 4 (Resourcing):* Hiring freeze (one engineer covering three services).
      *   *Factor 5 (Financial/Exec):* Budget approval behind the freeze.

  3.  **Identify the Core Philosophical/Practical Problem:**
      *   The "But-For" Test is too broad (everything is a cause).
      *   The "Proximate Cause" legal concept is too vague for engineering postmortems.
      *   The risk is "Root Cause Analysis" becoming "Root *Blame* Analysis."
      *   Need a framework that focuses on *actionability* and *leverage*.

  4.  **Select a Framework:**
      *   *Swiss Cheese Model:* Good for visualization, but doesn't solve the "where to stop" problem.
      *   *5 Whys:* Good for digging deep, but often leads to the "human error" dead end or the "CEO decision" infinite regress.
      *   *Control/Influence Model:* Focus on what the engineering org can actually change.
      *   *Learning Teams/Just Culture:* Focus on system design over individual performance.
      *   *Decision:* A hybrid approach. Use a **"Controllability & Leverage" Filter**. This aligns with the goal of driving follow-up work. If we can't change it, it's a condition, not a cause *for the purpose of engineering improvement*.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the stalemate. Validate the complexity. State the purpose (establish a repeatable method).
      *   **The Problem:** Explicitly state the "Infinite Regress" vs. "Scapegoating" tension. Acknowledge the partner's legal analogy (proximate cause) but pivot to *engineering utility*.
      *   **The Proposed Method:** "The Actionable Leverage Framework."
          *   Criterion 1: Controllability (Can *we* fix this without external permission?)
          *   Criterion 2: Leverage (Does fixing this prevent a class of errors, not just this one?)
          *   Criterion 3: Signal vs. Noise (Is this a systematic failure or a one-off?)
          *   *Crucial Addition:* A "Stop Rule." We stop digging when the cost of mitigation exceeds the risk, or when control leaves the engineering organization's sphere of influence.
      *   **Addressing the Bias Worry:** This is critical. How do we ensure we aren't just dressing up blame?
          *   Solution: Blind the names. Focus on *roles* and *decisions*, not people.
          *   Solution: Require "Systemic Fixes" for every identified cause. If you can't propose a system change, it's not a root cause, it's just a fact.
      *   **Applying to the Incident:**
          *   *On-call Snooze:* Not a root cause. It's a symptom of alert fatigue. Fix: Alert tuning.
          *   *No Rate Limiting:* Root Cause. Actionable by eng. Fix: Implement limits + automate checks.
          *   *Roadmap Priority:* Contributing Factor. Actionable via process change (e.g., mandatory hardening %).
          *   *Hiring Freeze:* Background Condition. Outside eng control. *However*, the *impact* (single point of failure) is actionable via on-call rotation policies.
          *   *Budget:* Background Condition. Stop here.
      *   **Next Steps:** Propose adopting this framework for future postmortems.

  6.  **Refining the Tone:**
      *   Avoid accusatory language.
      *   Use "we" and "the organization."
      *   Ensure the distinction between "Cause" (something we fix) and "Condition" (something we accept/monitor) is clear.
      *   Make sure the bias check feels robust, not hand-wavy.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is calling the hiring freeze a "background condition" too easy? It lets leadership off the hook.
      *   *Correction:* Acknowledge it as a *constraint*, but identify the *engineering response to the constraint* as the cause. The cause isn't "no money," it's "no mitigation strategy for understaffing."
      *   *Critique:* Is the bias section strong enough?
      *   *Correction:* Add a specific rule: "If the recommended action is 'train the person' or 'tell them to be more careful,' we have failed to identify a systemic cause." This forces system thinking.

  8.  **Final Polish:** Check formatting, clarity, and ensure all constraints of the prompt are met. (The prompt asks for a memo to the board, proposing a method, applying it, and answering the bias worry).

  9.  *(Final thought on the "Partner/Lawyer" comment)*: Acknowledge it respectfully but distinguish the goal. Law seeks liability; Engineering seeks resilience.

  10. **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Incident Review Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Standardized Causal Analysis Framework (The "Actionable Leverage" Model)

  ### 1. Context and Objective

  Following the review of Incident #2023-44 (the 2am Traffic Outage), the Board has reached an impasse regarding the definition of "root cause." We are currently oscillating between two unproductive extremes:

  1.  **Proximate Blame:** Stopping at the on-call engineer's decision to snooze the alert. This risks scapegoating an individual for a systemic failure.
  2.  **Infinite Regress:** Tracing causality back to budget approvals or hiring freezes. While factually true that these contributed, they are outside the engineering organization's direct control to remediate in the context of a technical postmortem.

  As my partner in legal rightly noted, we are debating "proximate cause." However, our goal is not liability; it is resilience. A legal test asks, "Who is responsible for the damage?" An engineering test must ask, **"What can we change to prevent this class of failure from recurring?"**

  This memo proposes a standardized method for distinguishing **Root Causes** (actionable system failures) from **Background Conditions** (contextual constraints). Adopting this framework will ensure future postmortems drive actual remediation rather than assigning blame.

  ### 2. The Proposed Method: The Actionable Leverage Framework

  To resolve the "where do we stop?" debate, I propose we adopt the following three criteria for any factor to be listed as a **Root Cause** or **Contributing Factor** in an official postmortem. If a factor does not meet these criteria, it is classified as a **Background Condition**.

  **Criterion A: Controllability**
  *   *Question:* Does the engineering organization (including leadership) have the authority to implement a fix without requiring external policy changes (e.g., corporate budget approval, HR policy overhaul)?
  *   *Rationale:* We cannot write action items for things we cannot change.

  **Criterion B: Leverage**
  *   *Question:* Does fixing this mitigate a *class* of errors, or just this specific instance?
  *   *Rationale:* We are looking for systemic improvements, not one-off patches.

  **Criterion C: The "Systemic Fix" Test (Bias Check)**
  *   *Question:* Can the recommended action be implemented without relying on human perfection (e.g., "train the engineer," "remind the team," "try harder")?
  *   *Rationale:* If the fix requires someone to simply "not make a mistake," we have not identified a root cause; we have identified a symptom. This directly addresses the concern that we are dressing up blame as causality.

  **The Stop Rule:** We stop tracing causality when we reach a decision point where a **systemic control** could have been implemented but was not, *and* where we have the authority to implement that control now.

  ### 3. Application to Incident #2023-44

  Applying this framework to the specific factors of the recent outage yields the following classification:

  | Factor | Classification | Analysis against Framework |
  | :--- | :--- | :--- |
  | **On-call engineer snoozing alert** | **Symptom** | Fails Criterion C. Blaming the snooze requires the engineer to be perfect despite alert fatigue. The *cause* is the alert fatigue, not the snooze. |
  | **Alert fatigue ("Cried Wolf")** | **Contributing Factor** | Passes A, B, & C. We control alert thresholds. Fix: Implement automated alert tuning or require periodic review of noisy alerts. |
  | **No rate limiting (Ticket open 3 months)** | **Root Cause** | Passes A, B, & C. Engineering controls the architecture. The existence of the ticket proves the risk was known. Fix: Implement rate limiting + add architectural review gate for "hardening" tickets. |
  | **Roadmap deprioritizing hardening** | **Contributing Factor** | Passes A (Eng Leadership), B, & C. While Product/Eng leadership sets the roadmap, we can institute a policy (e.g., "20% capacity reserved for tech debt"). Fix: Change the planning process to mandate hardening capacity. |
  | **Hiring Freeze (1 engineer, 3 services)** | **Background Condition** | Fails Criterion A. Engineering cannot override a corporate hiring freeze. **However**, the *lack of mitigation* for understaffing is a cause. Fix: Update On-Call Policy to mandate load-shedding or escalation paths when single-points-of-failure exist due to staffing. |
  | **Budget Approval behind Freeze** | **Background Condition** | Fails Criterion A. Outside Engineering authority. This is context, not a cause for *this* review board to action. |

  **Resulting Action Items:**
  1.  **Immediate:** Implement rate limiting on the affected service (Owner: Service Team).
  2.  **Process:** Update Alerting Policy to auto-expire or flag alerts snoozed >3 times/week (Owner: SRE).
  3.  **Process:** Update Roadmap Planning to reserve minimum 15% capacity for risk mitigation/hardening (Owner: Eng VP/Product).
  4.  **Process:** Update On-Call Staffing Policy to require secondary coverage when one engineer covers >2 critical services (Owner: Eng Ops).

  ### 4. Addressing the Bias Concern

  Several board members expressed valid concern that "wherever we draw the line is going to suspiciously match whoever we already felt comfortable holding responsible." This is confirmation bias, and it undermines the psychological safety required for honest incident reporting.

  The **Actionable Leverage Framework** mitigates this in two specific ways:

  1.  **Decoupling People from Decisions:** We do not list "The On-Call Engineer" or "The VP" as causes. We list the *decision mechanism* (e.g., "Alerting Policy," "Roadmap Prioritization Process"). This forces us to critique the *rules we play by*, not the *players*.
  2.  **The "Systemic Fix" Mandate:** By requiring that every identified cause must have an action item that does not rely on human perfection (Criterion C), we make it impossible to use the postmortem as a disciplinary tool. If we cannot propose a system change, we are not allowed to list it as a root cause. This prevents us from lazily attributing the outage to "human error" just to close the ticket.

  ### 5. Recommendation and Next Steps

  I recommend the Board adopt the **Actionable Leverage Framework** as the standard for all future Severity-1 and Severity-2 postmortems.

  **For the current incident:**
  I propose we rewrite the "Root Causes" section of the postmortem using the classification table in Section 3. This allows us to acknowledge the reality of the hiring freeze and roadmap pressure (as Background Conditions) without making them action items we cannot fulfill, while simultaneously absolving the on-call engineer of individual blame by focusing on the alerting system that failed them.

  **For future incidents:**
  We should add a "Framework Check" to the postmortem template. Before a report is finalized, the author must explicitly map each proposed cause to the three criteria above.

  This approach moves us from asking "Who messed up?" to "Where was our system brittle?" It respects the complexity of the situation without succumbing to analysis paralysis.

  I look forward to discussing this in next week's session.

  [Your Name]
  Incident Review Board Member
