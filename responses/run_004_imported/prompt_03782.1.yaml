      *   Section 2: The Verdict. Argue Frege is more stable because Bradley's solution is self-defeating for a theory of language (which requires propositions). Frege's "unsaturatedness" is a category distinction, not a hidden relation. The Concept Horse is a linguistic shadow, not an ontological crack.
