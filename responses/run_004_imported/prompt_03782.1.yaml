          *   Conclusion on Part 1: They share the *explanandum* (unity), but disagree on the *category* of the binder.
      *   **Part 2: The Verdict (Frege vs. Bradley):**
          *   Criterion: Stability of the account of unity.
          *   Bradley's Stability: Logically tight but ontologically destructive. If relations aren't real, propositions aren't real. It solves the problem by eliminating the data.
          *   Frege's Stability: Preserves the data (truth, predication). The "unsaturated" notion is the key.
          *   Addressing the "Relocation" worry: Does unsaturatedness just hide the relation? No, because it denies the *kind* of existence that requires a relation. Relations (for Frege) are concepts (unsaturated). Objects are saturated. You don't need a glue to glue a hook to a loop; they fit by nature.
          *   Addressing Concept Horse: This is a linguistic limitation, not an ontological failure. We can't *name* concepts without objectifying them, but we can *use* them. Bradley's problem is ontological; Frege's is linguistic.
          *   Final Verdict: Frege is more stable for a philosophy of language/logic. Bradley is a powerful negative critique but fails as a positive account of propositional unity (since he denies propositions).
      *   **Refining the Argument:** I need to be careful not to just say "Frege is right because we use language." I need to argue that Bradley's regress relies on a category mistake that Frege successfully identifies. Bradley assumes $R$ is a particular. Frege says $R$ is a function. If $R$ is a function, the regress stops.
