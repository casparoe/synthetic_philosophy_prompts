          *   *Cons:* The "Concept Horse" paradox. Linguistic expression forces concepts into object-roles (nominalization), making them seem like objects, which contradicts their unsaturated nature. Is "unsaturatedness" a metaphor or a real ontological feature? If real, how do we grasp it?
      *   *The Verdict:* Which is more *stable*?
