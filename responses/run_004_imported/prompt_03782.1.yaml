  6.  (Self-Correction during drafting): Make sure to explicitly mention that Bradley's regress applies to *external* relations conceived as particulars. Frege's concepts are not particulars. This is the crux. Also, ensure the "Concept Horse" is treated as a cost, not a knockout blow.

  7.  *Final Plan:*
