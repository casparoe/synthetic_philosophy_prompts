answer: |-
  This is an exceptionally sharp question that cuts to the heart of why early analytic philosophy diverged from British Idealism. Your instructor is correct that these texts are grappling with the same structural anxiety, often labeled **the problem of the unity of the proposition** (or the binding problem). However, your skepticism about whether Frege truly escapes Bradley's net is shared by many metaphysicians (including Russell, Wittgenstein, and more recently, Richard Gaskin and Donald Davidson).

  Here is an analysis of the shared problem followed by a verdict on which account offers greater stability.

  ### 1. The Shared Problem: The Binding Problem vs. The Category Mistake

  To determine if the problem is genuinely the same, we must isolate the *explanandum* (what needs explaining) from the *explanans* (the proposed explanation).

  **The Common Core: List vs. Unity**
  Both Bradley and Frege are asking: What distinguishes a truth-apt unity (a fact or proposition) from a mere aggregate (a list of constituents)?
  *   **Bradley:** Consider the fact $aRb$. If $a$, $b$, and $R$ are all distinct entities (particulars), the fact seems to be just the list $\{a, R, b\}$. What makes $R$ *attach* to $a$ and $b$? If the attachment is a further relation $R'$, we launch the regress.
  *   **Frege:** Consider the thought "Caesar conquered Gaul." If "Caesar," "conquered," and "Gaul" are all names of independent objects, the thought is just a list of objects. What makes it a thought that can be true or false?

  **The Divergence: Homogeneity vs. Heterogeneity**
  The crucial difference lies in the ontological status of the "binder."
  *   **Bradley's Assumption (Homogeneity):** Bradley treats the relation $R$ as the *same kind of thing* as the relata $a$ and $b$. They are all "terms" or "particulars." Because they are ontologically homogeneous, they require an external glue to unite them. Bradley argues that no external glue can work without generating a regress. Therefore, the plurality of terms is illusory.
  *   **Frege's Assumption (Heterogeneity):** Frege argues that the binder (the concept/relation) is *fundamentally different in kind* from the arguments (objects). Objects are "saturated" (complete); Concepts are "unsaturated" (incomplete, function-like).

  **Is it the same problem?**
  Yes, but they diagnose the cause differently.
  *   For **Bradley**, the problem is **ontological**: Reality cannot consist of independent particulars related externally. The very notion of an "external relation" is incoherent.
  *   For **Frege**, the problem is **categorial**: We fall into the regress only if we commit a category mistake by treating concepts as if they were objects.

  Your worry is that Frege's "unsaturatedness" might just be a label for the very "fitting" Bradley claims requires explanation. If a concept "fits" an object, isn't that "fitting" itself a relation?
  Frege's response (and the analytic tradition's defense) is that unsaturatedness is not a *relation* but a **logical form**. A hook does not need a second hook to attach to a loop; its very nature is to hold a loop. Bradley assumes everything is a brick (requiring mortar); Frege insists some things are mortar (requiring no further mortar).

  ### 2. Verdict: Which Account is More Stable?

  You asked for a verdict on which position offers the more stable account of how a proposition constitutes a genuine unity.

  **The Verdict:** **Frege's account is more stable**, but only if we accept that the "Concept Horse" paradox is a linguistic limitation rather than an ontological contradiction. Bradley's account is logically rigorous but ultimately self-defeating for any philosophy of language.

  Here is the reasoning behind this assessment.

  #### A. The Cost of Bradley's Stability
  Bradley's solution is metaphysically "stable" in the sense that it successfully avoids the regress. By denying the reality of relations and distinct particulars, he removes the need for a unifier. The Absolute is the only true unity.

  However, this stability is purchased at the price of **eliminativism**.
  1.  **It dissolves the subject matter:** A seminar on philosophy of language presupposes that propositions, truth, and predication are real phenomena to be analyzed. Bradley's conclusion is that they are "appearance," not "reality." He does not explain *how* a proposition is unified; he explains *why* it cannot be.
  2.  **It is pragmatically self-refuting:** To argue for Monism, Bradley must use propositions ("Relations are unreal," "The Absolute is One"). If his theory is true, the very sentences he uses to argue for it are unintelligible appearances. A theory that renders its own assertion impossible is unstable in a pragmatic sense.

  #### B. The Stability of Frege's Unsaturatedness
  Frege preserves the reality of propositions and truth. His distinction between saturated and unsaturated allows for a genuine unity without a regress *because* it blocks the premise that starts the regress (that the concept is an object needing connection).

  **Addressing the "Relocation" Worry:**
  You asked if unsaturatedness merely relocates the difficulty. It does not relocate it; it **dissolves** it by changing the rules of composition.
  *   In Bradley's model, composition is **external** (like bricks and mortar).
  *   In Frege's model, composition is **internal** (like a mathematical function $f(x)$). The value is determined by the function's nature, not by an external glue binding $f$ to $x$.
  *   Therefore, the "fitting" is not a further relation; it is the realization of the function's definition.

  **The Concept Horse Cost:**
  The "Concept Horse" paradox arises because language is saturated. To talk *about* a concept, we must turn it into a grammatical subject (an object), which betrays its unsaturated nature.
  *   **Why this is acceptable:** This is a limitation of *language*, not of *ontology*. We cannot point to a function; we can only use it. The paradox shows that we cannot *objectify* concepts without losing their essential nature, but it does not show that concepts cannot unify propositions.
  *   **Stability Check:** A theory of language should account for how language works. Frege's theory accounts for truth conditions, logical inference, and predication. The Concept Horse paradox is a boundary marker warning us not to reify concepts, not a crack in the foundation of predication.

  #### C. Why Frege Wins on "Unity"
  The specific question is about the **unity of the proposition**.
  *   **Bradley:** There is no propositional unity at the level of discourse. There is only the ineffable unity of the Absolute. Thus, he offers **no account** of propositional unity, only a denial of it.
  *   **Frege:** Propositional unity is constituted by the completion of an unsaturated sense by a saturated sense. This is a positive, structural account.

  While Bradley's regress is a powerful negative critique (showing that *realist* theories of relations must be careful not to treat relations as particulars), Frege provides the only viable positive framework for how language hooks onto the world without generating an infinite regress of connectors.

  ### Conclusion

  Your instructor is right to pair them, but the pairing reveals a hierarchy of explanatory power. Bradley identifies a fatal flaw in **naive realism** (treating relations as objects). Frege offers a **sophisticated realism** that avoids the flaw by introducing a category distinction.

  Frege's position is more stable because it allows for the possibility of truth and discourse, which are the preconditions of the seminar itself. Bradley's position is a *reductio ad absurdum* of a specific metaphysical picture, but it fails as a constructive account of propositional unity. The "Concept Horse" problem is a manageable linguistic paradox; Bradley's Regress, if accepted, is an ontological catastrophe that eliminates the world of distinct facts entirely.

  **Recommendation for Seminar:** Argue that Frege solves Bradley's regress not by finding a better glue, but by showing that the "glue" (the concept) is not the kind of thing that *needs* gluing. The Concept Horse paradox is the price we pay for being linguistic creatures trying to talk about the non-linguistic conditions of language, but it is a lower price than Bradley's elimination of relations.
