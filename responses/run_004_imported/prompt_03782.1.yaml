          *   *Critical Point:* Many modern metaphysicians (e.g., Gaskin, Vallicella) argue Frege *doesn't* solve Bradley's regress. Unsaturatedness just *labels* the problem; it doesn't explain *how* the fitting happens. If "unsaturated" is a property, we are back to Bradley. If it's not a property, what is it?
