      *   *Frege's Problem:* The Unity of the Thought (Proposition). How does "Caesar conquered Gaul" differ from the list "Caesar", "conquered", "Gaul"? Frege's answer: Concepts are unsaturated (functions), Objects are saturated (arguments). The fit is internal/logical, not external/relational.
      *   *The Connection:* Both are addressing the "binding problem." How do constituents combine to form a truth-apt unity rather than a mere aggregate?
      *   *The Tension:* Bradley treats relations as *objects* (relata-like), leading to symmetry. Frege insists on a category mistake if we treat concepts as objects.
      *   *Is it the same problem?* Yes, structurally. It's the problem of *ontological glue*. Bradley says glue requires more glue (regress). Frege says one piece *is* the glue (unsaturatedness).
      *   *Addressing the Asymmetry:* Bradley attacks relations specifically. Frege distinguishes objects from concepts. But if a relation is a concept (polyadic), Frege applies his solution there too. The core issue is: Can distinct ontological items combine without a further combiner?

  3.  **Evaluate the Positions (Task 2):**
      *   *Bradley:* Radical monism. Denies the reality of relations to save coherence.
