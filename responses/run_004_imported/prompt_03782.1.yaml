          *   *Actually, a nuanced verdict is better:* Frege's distinction is necessary for logic, but Bradley is right that it doesn't fully solve the *metaphysical* binding problem. But since the seminar is Metaphysics *and* Philosophy of Language, Frege wins on the Language front, which is where "propositions" live.
          *   *Let's go with:* Frege provides the more stable account *for a theory of meaning and truth*, which is the context of "propositions." Bradley's account is stable only if you abandon the possibility of true predication.
