      *   **Topic:** The distinction between *fittingness reasons* (reasons that make an object worthy of an attitude) and *pragmatic/prudential reasons* (reasons that make it beneficial to have the attitude, regardless of the object's worth).
      *   **Goal:** An icebreaker joke.
