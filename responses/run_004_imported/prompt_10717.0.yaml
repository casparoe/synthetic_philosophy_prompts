answer: |-
  [Stand up, tap the glass gently. Smile at Priya and Theo, then scan the room.]

  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of knowing Priya for [Number] years.

  When Priya asked me to give this toast, she looked me in the eye and said, "I trust you to handle the audience." I took that as a challenge. And I know what she meant. Looking around this room, I see a lot of familiar faces from her PhD cohort. I know that roughly half of you specialize in collective intentionality. Which means I know that half of you are currently listening to this sentence and analyzing its propositional content for errors in modal logic.

  So, let's address the elephant in the room. We all know the theoretical landscape here. We know that Priya is, famously, a Gilbertian. She believes that a relationship is a *plural subject*. To her, the "We" is not just a shorthand; it's a real, irreducible thing created by joint commitment. You can't reduce it down to individual parts without losing the essence of what makes it a marriage.

  And we know that Theo is a steadfast Bratmanian. He believes the "We" is a beautiful, complex web of interlocking individual intentions. It's about mutual responsiveness, meshing sub-plans, and two autonomous agents choosing, every day, to coordinate their lives.

  For a long time, our friend group has joked that this is a conflict. That Priya wants a merger, and Theo wants a partnership agreement. That one is looking for a soul, and the other is looking for a protocol.

  But having watched them together over the last few years, I've realized that the joke is on us. Because if you actually look at how they love each other, you see that they aren't arguing against each other. They are completing the circuit.

  A marriage that is only Gilbertian risks becoming a black box—where the "We" is so sacred that the individuals inside it disappear. But a marriage that is only Bratmanian risks becoming a cold negotiation—where the coordination is perfect, but the magic is missing.

  Priya and Theo have found the synthesis.

  Priya, you bring the Gilbert. You remind them that when they walk into a room, they enter as a unit. You ensure that their commitment isn't just a prediction of future behavior, but a binding promise that creates a new reality. You give the relationship its weight, its gravity, and its identity. You make sure they never forget that they are on the same team.

  Theo, you bring the Bratman. You remind them that the "We" is built out of two distinct "I"s who deserve to be heard. You ensure that their joint actions are built on actual mutual understanding, not just assumption. You give the relationship its flexibility, its respect, and its day-to-day functionality. You make sure they never forget *who* is on the team.

  To the parents and family here who might be wondering why we're talking about philosophy: What this actually means is simple. It means that when things are hard, Priya ensures they stand together as one force. And when things are complex, Theo ensures they listen to each other as two individuals.

  Priya ensures they never drift apart. Theo ensures they never get lost in the crowd of two.

  In the end, the philosophers in the room can debate whether the "Plural Subject" is metaphysically real or merely a useful construct. But looking at Priya and Theo today, the empirical evidence is overwhelming. Whether it's built on joint commitment or interlocking intentions, the result is the same. It is sturdy. It is kind. And it is deeply, undeniably loving.

  So, to the happy couple: May your sub-plans always mesh. May your joint commitments never waver. And may you always find that the "We" is the safest place for both of the "I"s to live.

  To Priya and Theo.

  [Raise glass]
