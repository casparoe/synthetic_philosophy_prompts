      *   **The Conflict:** The user's friend (behavioral economist) thinks Allais preferences are just inconsistencies (violations of Independence). The user thinks they can be rationalized by alternative theories (Rank-Dependent Utility, Machina, Risk-Weighted Utility).
      *   **The Interviewee's Stance:** Believes Allais patterns are rationally permissible. Defends against money-pump arguments via "resolute choice" (committing to a plan rather than re-evaluating at each node).
      *   **Task:** Draft 8-10 interview questions.
