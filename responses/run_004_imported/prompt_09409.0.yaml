      *   *Q10 (Closing):* *Requirement:* Falsification. What would change your mind?

      *Refining the Flow:* I need to make sure the "resolute choice" defense gets squeezed harder as we go.
      *   Q1-3: Static choice & Risk-Weighting.
      *   Q4-5: Dynamic choice & Money Pumps (The initial defense).
