answer: |-
  Here are ten interview questions sequenced to explore the static foundations of her theory before narrowing in on the dynamic consistency problem, progressively tightening the pressure on the "resolute choice" defense.

  1.  Let's begin with the static case. Your framework argues that rational agents can have a global attitude toward risk that is distinct from their diminishing marginal utility for money. If I understand you correctly, you claim that preferring a sure $1 million over a gamble with a slightly higher expected value isn't just a psychological quirk, but a rational expression of how one weights probabilities. Could you sketch for us exactly how your risk-weighting function captures this without collapsing back into standard concave utility?

  2.  Most discussions of the Allais paradox focus on the "common-consequence" effect, where a shared outcome across two gambles is altered. However, Allais also described a "common-ratio" effect, where probabilities are scaled down proportionally. Does your risk-weighted model handle the common-ratio pattern as naturally as the common-consequence pattern, or do you need to adjust the risk function differently to account for both?

  3.  Your friend in behavioral economics would argue that violating the Independence Axiom makes an agent vulnerable to a money pump: a series of trades that leaves them worse off than they started, with no gain. In *Risk and Rationality*, you suggest that this dynamic inconsistency only arises if the agent re-evaluates their preferences at every node of the decision tree. Is it fair to say your primary defense against the money pump is that a rational agent can simply commit to a plan ex-ante and refuse to revise it?

  4.  Let's dig into that commitment. If an agent reaches a node in the decision tree where their original plan now prescribes an action that is strictly dominated by an available alternative *at that node*, does your theory require them to follow the plan anyway? Or is there a threshold where the cost of resoluteness outweighs the benefit of consistency?
      *(Likely deflection: She will likely argue that "dominance" is being evaluated locally, whereas rationality is global, so the action isn't actually dominated relative to the original choice. **Follow-up:** "But if the agent acknowledges that, ex-post, they would willingly pay to get back to the path they rejected ex-ante, haven't they admitted to a preference cycle? How is that distinct from the inconsistency your friend is accusing them of?")*

  5.  This brings us to the normative status of resolute choice. You argue that it is rationally permissible to be a resolute chooser. But is it *rationally required*? If an agent knows they will be tempted to deviate from their optimal plan later, does your framework obligate them to adopt a resolute choice strategy, or is it merely an option they may take if they have the willpower?
      *(Likely deflection: She may claim that resolute choice is a separate normative norm from expected utility maximization, not a requirement of EU itself. **Follow-up:** "If it's a separate rational requirement that overrides local preferences to ensure global consistency, aren't you effectively reinstating a higher-order consistency principle that functions just like the Independence Axiom you rejected?")*

  6.  Peter Hammond argued that if you violate Independence, you must also violate "Separability"—the idea that choices at a node should depend only on the future consequences reachable from that node. You reject Separability to save the Allais preferences. But if an agent cannot separate their current choice from the history of how they got there, how do they deliberate? Do they need to simulate the entire decision tree in their head at every moment to know what is rational?
      *(Likely deflection: She will likely say agents deliberate on "policies" or "plans" rather than node-specific acts. **Follow-up:** "But if the rationality of a plan depends on the structure of the tree, but the agent ignores the tree structure at the node of choice, doesn't that create a disconnect between the theory of rational evaluation and the psychology of actual deliberation?")*

  7.  Let's return to the common-ratio effect for a moment. In expected utility theory, the common-ratio effect is often treated as a probability weighting error. In your model, it's a feature of the risk function. If we observe an agent who exhibits the Allais pattern in common-consequence cases but *reverses* it in common-ratio cases, does your model classify them as irrational, or does it simply say they have a different risk-function shape?

  8.  One worry about non-expected-utility theories is that they are too flexible. By adjusting the risk-weighting function, can't you rationalize almost any pattern of choice, including ones that seem clearly pathological? Where is the boundary in your framework between a "permissible risk attitude" and a genuine rational failure that we *should* try to correct?

  9.  You've suggested that the intuition behind Independence—that common outcomes should "cancel out"—fails because it ignores the security or "certainty effect" that agents value. But if we accept that the *structure* of the gamble matters globally, does this undermine the use of decision trees altogether? If the value of a branch depends on the rest of the tree, can we still use standard backward induction methods to solve for optimal strategies?

  10. Finally, I want to close on the status of the theory itself. Your friend believes the Allais pattern is a cognitive bug to be explained by psychology; you believe it is a rational feature to be explained by decision theory. What empirical finding or formal result would actually count as evidence *against* your view? Is there a pattern of choice that risk-weighted utility cannot accommodate without becoming trivial, or is the theory insulated from falsification by the flexibility of the weighting function?
