answer: |-
  1. **Kant's Shopkeeper and the Reputation Motive**
  Kant famously denies moral worth to the honest shopkeeper who charges fair prices only to maintain a good reputation, arguing his motive merely coincides with duty. On your view, moral worth requires being moved by right-making features. In a case like mine—returning a wallet while aware of a security camera—how does your account structurally distinguish an agent moved by the *feature* of "returning property" (even if partly for reputation) from Kant's shopkeeper, who is moved solely by the *feature* of "profitability"?
  *Follow-up:* If you suggest the shopkeeper fails because he is indifferent to fairness itself, does that imply my wallet case only has moral worth if I would have returned it even if the camera were broken?

  2. **Moral Fetishism and Huckleberry Finn**
  Michael Smith argues that desiring to do the "right thing" *qua* right is a form of moral fetishism; we should desire the actual goods (like happiness or relief of pain). Your view seems to align with this, yet you also require the agent to be moved by right-making considerations. Does this exclude Huckleberry Finn, who helps Jim escape while believing he is doing something morally wrong? If Huck is moved by loyalty (a right-making feature) but conceives of it as vicious, does he qualify on your account, or does your view quietly demand the explicit moral reasoning Smith wants to avoid?
  *Follow-up:* If you grant Huck moral worth because loyalty is objectively right-making regardless of his belief, doesn't that detach moral worth from the agent's own rational perspective in a way that seems alienating?

  3. **The Wallet Case: Mixed Motives**
  I want to put my specific situation to you: I was moved by the owner's loss, but the security camera's presence provided a concurrent, self-regarding push. On your account, does the presence of a self-regarding motive (looking good) dilute the moral worth generated by the other-regarding motive, or can the two coexist unharmed so long as the right-making feature was *a* sufficient cause of the action?
  *Follow-up:* If you argue they can coexist unharmed, is there any threshold where the self-interest becomes so dominant that it swamps the right-making motive, and how could an agent ever introspectively know they've crossed it?

  4. **Overdetermination and Sufficiency**
  This touches on the problem of overdetermination. Suppose I am moved by two distinct right-making features simultaneously—say, relieving your pain and honoring a promise to your mother. If either one alone would have been sufficient to produce the action, does the presence of the second motive add to the moral worth, or is worth binary based on the presence of *any* sufficient right-making consideration?
  *Follow-up:* If worth is binary and doesn't aggregate, does that imply a counterintuitive ceiling on moral praiseworthiness, where doing the right thing for ten good reasons is no more worthy than doing it for one?

  5. **Epistemic Access to Right-Making Features**
  Your view hinges on the agent being moved by the considerations that *make* the act right. But agents often act under false descriptions. If I return your wallet believing it contains ID that you need for a job (which would make it right), but it actually contains only cash and no ID, was I moved by a right-making feature that didn't exist, or does my *perception* of the feature suffice for moral worth?
  *Follow-up:* If perception suffices, doesn't that allow an agent to have full moral worth while acting on a mistaken moral theory, effectively insulating moral worth from objective moral truth?

  6. **The Paradox of Self-Effacement**
  If moral worth depends on being moved by right-making features, what happens to an agent who consciously aims to cultivate that very sensitivity in order to gain moral worth? Does the second-order desire to be morally worthy crowd out the first-order concern for the right-making features, rendering the pursuit of moral worth self-defeating on your account?
  *Follow-up:* If you say it is self-defeating, does your view imply that moral education which explicitly praises "good motives" might inadvertently produce agents incapable of achieving moral worth?

  7. **Emotional Engagement vs. Cognitive Recognition**
  When you say an agent must be "moved by" these considerations, does this require an affective or emotional component, or is cold cognitive recognition sufficient? If a depressed agent recognizes the right-making features and acts on them but feels no emotional pull or satisfaction, does their action lack moral worth on your view?
  *Follow-up:* If you require emotional engagement, are you not excluding agents who act from a stoic sense of obligation, which many intuitively regard as a paradigm of moral worth?

  8. **Prudential Features as Right-Making**
  You specify that the agent need not conceive of the considerations in "moral terms." Does this allow prudential features to count? If I wear a mask during a pandemic primarily to protect my own health, and that act coincidentally protects others (a right-making feature), am I moved by a right-making feature even if my conceptual framework is entirely self-protective?
  *Follow-up:* If you say no, because self-protection isn't a *moral* right-making feature, how do you draw the line between prudential and moral features without reintroducing the requirement for moral conceptualization you sought to avoid?

  9. **Acquisition of Moral Sensitivity**
  If moral worth depends on responsiveness to right-making features, this implies a developed sensitivity. How does your account handle the "novice" moral agent who stumbles into the right action for the right reasons but lacks a stable character trait? Is moral worth an property of individual acts on your view, or does it require a dispositional history that the novice lacks?
  *Follow-up:* If it requires a dispositional history, does that mean a reformed sinner's first good act has less moral worth than a saint's identical act, and is that a feature or a bug of your theory?

  10. **The Falsification Condition**
  Finally, philosophical theories live or die by their ability to handle counterexamples. What specific kind of case—perhaps involving a specific configuration of motives, beliefs, or outcomes—would yield a verdict on your account that conflicts so strongly with your own moral intuitions that it would force you to abandon or fundamentally revise this view of moral worth?
  *Follow-up:* If you cannot conceive of such a case, does that suggest your theory is insulated from empirical or intuitive refutation, and if so, what work is it actually doing beyond systematizing your pre-existing intuitions?
