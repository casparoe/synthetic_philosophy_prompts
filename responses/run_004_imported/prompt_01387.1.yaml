prompt: |-
  I teach a philosophy of economics seminar, and the last two sessions were on interpersonal utility comparisons — starting with Robbins basically declaring them meaningless value judgments that have no place in scientific economics, then Harsanyi's aggregation theorem, which supposedly derives a weighted-utilitarian social welfare function without needing interpersonal comparisons at all, and then Sen (and Broome, and Weymark) pushing back that the weights in Harsanyi's result are arbitrary and can't actually be pinned down unless you sneak comparability back in through the side door. We also got into Arrow's later "extended sympathy" move from the second edition of Social Choice and Individual Values, where instead of comparing utility levels directly you rank things like "being me in my situation" against "being you in yours." It's great fun to teach in the abstract, but I honestly never thought I'd need any of it for actual departmental buisness, until this week.

  Here's the situation: our department has exactly one semester of paid research leave to hand out this year, and rather than let the chair just pick, the personnel commitee sent round a form asking each of the five eligible faculty to self-rate, on a scale of 0 to 100, "how much would this leave benefit your research." Whoever comes out on top gets the leave. About half the department thinks this is a perfectly sensible Benthamite solution, and the other half (me included) has a nagging sense that we're maxing over numbers that were never comparable in the first place, though I'm struggling to turn that hunch into an actual argument for the next meeting. Could you spell out the most important implications of the interpersonal utility comparisons debate for whether a procedure like ours can be defended at all? I'd like you to actually engage with the specific technical positions here (Robbins's skepticism, the Harsanyi/Sen/Weymark dispute, extended sympathy, maybe even how applied welfare economists try to sidestep the whole mess with money-metric or willingness-to-pay measures) rather than just telling me that comparing utility across people is hard, because that much I already knew going in.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy of Economics seminar instructor. High level of expertise. Familiar with Robbins, Harsanyi, Sen, Broome, Weymark, Arrow's extended sympathy, and welfare economics technicalities.
      *   **Context:** Departmental politics. One research leave to award. Five eligible faculty. Mechanism: Self-rated 0-100 score on "how much would this leave benefit your research." Winner takes all.
      *   **Problem:** Half the department thinks it's fine (Benthamite); the other half (including the user) thinks it's nonsense (incomparable utilities). The user needs arguments for the next meeting.
      *   **Requirement:** Engage with specific technical positions (Robbins, Harsanyi, Sen/Weymark, Arrow, money-metric utility). Do *not* just say "comparing utility is hard." Explain *why* this specific procedure fails (or succeeds) based on the theory.

  2.  **Deconstruct the Departmental Procedure:**
      *   **Mechanism:** Cardinal self-reporting (0-100 scale).
      *   **Aggregation:** Maximize the sum (effectively, since only one person wins, it's choosing the $i$ that maximizes $u_i$).
      *   **Assumption:** The numbers reported are comparable across individuals.
      *   **Incentive Structure:** Strategic voting (inflating scores).

  3.  **Map Theoretical Frameworks to the Procedure:**

      *   **Lionel Robbins (1930s):**
          *   *View:* Utility is ordinal and subjective. Interpersonal comparisons (IPC) are normative/ethical, not scientific.
          *   *Application:* The 0-100 scale is meaningless science. My "50" might be your "90." There is no common unit of "research benefit."
          *   *Argument:* The procedure pretends to be objective/scientific but rests on an unscientific ethical premise.

      *   **Harsanyi (1955 Aggregation Theorem):**
          *   *View:* If individuals and society satisfy von Neumann-Morgenstern (vNM) axioms, social welfare is a weighted sum of individual utilities.
          *   *Catch:* The weights are ethically significant. Harsanyi argued for equal weights behind a veil of ignorance.
          *   *Application:* The department procedure assumes weights are equal (one person, one vote, but here it's one person, one max score). But more importantly, it assumes the *utility scales* are normalized.
          *   *Problem:* Harsanyi requires cardinal utility (which vNM provides via risk), but *not* interpersonal comparability unless we fix the zero and unit points across persons. Self-rating doesn't fix units.

      *   **Sen / Weymark / Broome (The Critique):**
          *   *View:* Harsanyi's theorem doesn't derive utilitarianism without extra assumptions. You need *Cardinal Unit Comparability* (CUC) or *Cardinal Full Comparability* (CFC).
          *   *Application:* The 0-100 form asks for cardinal data, but without a common calibration, it's just ordinal data disguised.
          *   *Strategic Behavior:* Sen emphasizes information bases. If the information base is uncalibrated self-reports, the mechanism is manipulable.
          *   *Weymark:* Specifically on Harsanyi's weights. If we can't compare levels/units, the weights are arbitrary. Here, the "weight" is effectively the score itself.

      *   **Arrow (Extended Sympathy / Identity):**
          *   *View:* Instead of "My Utility vs. Your Utility," compare "Me in My State" vs. "Me in Your State."
          *   *Application:* The form asks "How much would *this* benefit *your* research?" It does *not* ask "How much would I benefit if I were you?"
          *   *Potential Fix:* An Arrowian approach would require faculty to rank outcomes from an impartial perspective, not self-report intensity.

      *   **Applied Welfare Econ (Money-Metric / Kaldor-Hicks):**
          *   *View:* Use willingness-to-pay (WTP) to normalize.
          *   *Application:* Could we auction the leave? (Ethically dubious for research leave).
          *   *Problem:* Income effects, wealth disparities (senior vs. junior faculty), and the fact that research benefit isn't easily monetized.

  4.  **Synthesize the Arguments for the Meeting:**
      *   *Goal:* Provide the user with ammunition to show the procedure is theoretically incoherent, not just "hard."
      *   *Key Point 1: The Measurement Problem (Robbins/Ordinalism).* The scale has no common zero or unit. A 100 from a junior faculty member $\neq$ a 100 from a senior.
      *   *Key Point 2: The Aggregation Problem (Harsanyi/Sen).* Even if we accept cardinal utility, Harsanyi requires fixed weights. This procedure makes the *score* the weight, but without calibrated units, it's garbage in, garbage out.
      *   *Key Point 3: Incentive Compatibility (Mechanism Design).* If I want the leave, I write 100. If you're honest, you write 80. The mechanism rewards lying, not truth-telling. This violates the informational requirements of any valid social choice function.
      *   *Key Point 4: The Arrowian Alternative.* If we really want to compare, we need extended sympathy (ranking states), not intensity reporting.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, academic, slightly wry (acknowledging the irony).
      *   *Structure:*
          1.  Acknowledge the irony (theory meeting practice).
          2.  Robbins/Ordinalism critique (The "Unit" problem).
          3.  Harsanyi/Sen critique (The "Weighting" problem).
          4.  Mechanism Design/Strategy (The "Truth-telling" problem).
          5.  Money-Metric critique (Why we can't just monetize it).
          6.  Constructive alternatives (Arrowian or Randomized).
      *   *Refining the Harsanyi point:* Be careful. Harsanyi's theorem gets a *weighted* sum. The department procedure implies an unweighted sum (or rather, a max operator on raw scores). The lack of normalization is the killer. Sen's point is that without CUC (Cardinal Unit Comparability), you can't sum.
      *   *Refining the Arrow point:* Extended sympathy is about *judging* others' situations. The form asks for *self-assessment*. This is a category error.
      *   *Refining the Strategy point:* This is crucial. In social choice, we usually assume preferences are fixed. Here, the *report* determines the outcome. It's a classic "public good" or "resource allocation" game. If the metric is uncalibrated, 100 is a dominant strategy.

  6.  **Final Polish:** Ensure specific names and concepts are used correctly (CUC, vNM, information base, invariance transformations). Make sure the advice is actionable for a department meeting. (e.g., "Ask them to define the zero point.")

  7.  **Self-Correction during drafting:** I initially thought about suggesting an auction. But for research leave, that's ethically fraught (wealthier/senior people might value money less or have more grant money). Better to stick to the theoretical critique of the *current* form. I should emphasize that the form conflates *intensity* with *comparability*.

  8.  **Final Review against constraints:** Did I engage Robbins? Yes. Harsanyi/Sen/Weymark? Yes. Arrow? Yes. Money-metric? Yes. Is it specific to the 0-100 form? Yes.

  *(Self-Correction Note)*: Wait, Harsanyi's Aggregation Theorem is often misunderstood. It says if Social Welfare and Individual preferences satisfy vNM, then $W = \sum a_i U_i$. The $a_i$ are constants. The department procedure effectively sets $a_i = 1$ but assumes $U_i$ are on the same scale. Sen's critique is that without interpersonal comparability, the $U_i$ can be transformed linearly ($U_i^* = \alpha_i U_i + \beta_i$), which changes the social ordering unless $\alpha_i$ are fixed. The form does nothing to fix $\alpha_i$. This is the technical kill-shot.

  Okay, ready to write.
answer: |-
  This is a delicious piece of real-world irony. You are facing a classic *application* of the very impossibility results you teach, disguised as administrative efficiency. The personnel committee has essentially tried to implement a naive act-utilitarian calculus without securing the necessary informational preconditions.

  To dismantle this procedure in your meeting, you need to move beyond the vague claim that "utility is subjective" and demonstrate specifically which **invariance conditions** the procedure violates, rendering the aggregation mathematically and ethically indeterminate.

  Here is how you can deploy the specific technical machinery of your seminar to critique the 0–100 self-rating form.

  ### 1. The Robbins Critique: The Lack of a Common Zero and Unit
  Robbins's objection wasn't just that utility is internal; it was that scientific propositions must be invariant to admissible transformations of the measurement scale.
  *   **The Technical Point:** For interpersonal comparisons to be scientifically meaningful, we need at least **Cardinal Unit Comparability (CUC)**. This means that while the zero point might differ across individuals, the *unit* of measurement must be constant (allowable transformations are $U_i^* = \beta U_i + \alpha_i$, where $\beta$ is common to all).
  *   **The Departmental Failure:** The form asks for a 0–100 score, but it defines neither the zero nor the unit.
      *   Does 0 mean "no benefit" or "negative benefit"?
      *   Does 100 mean "maximum possible benefit conceivable by a human" or "maximum benefit *I* can conceive"?
      *   If Faculty A thinks a semester yields 10 units of research value and Faculty B thinks it yields 1000 units, but both are constrained to the 0–100 box, Faculty B must compress their scale.
  *   **The Argument:** "Without a calibrated definition of the unit '1' on this scale, the numbers are ordinal data masquerading as cardinal data. Summing or maximizing them is like adding 5 inches to 5 centimeters and declaring the result '10' without converting units. Robbins would call this unscientific; modern measurement theory calls it a violation of scale invariance."

  ### 2. The Harsanyi/Sen/Weymark Dispute: The Weighting Problem
  The committee likely thinks they are being Harsanyian: "Let's maximize the sum of benefits." But they are ignoring the critical constraints Harsanyi's Aggregation Theorem requires.
  *   **The Technical Point:** Harsanyi's theorem derives a social welfare function of the form $W = \sum a_i U_i$. However, as Sen and Weymark famously pressed, the weights $a_i$ are not derived from the axioms; they are ethical inputs. Furthermore, for the sum to be meaningful, the individual utility functions $U_i$ must be measured on a **common scale** (Cardinal Full Comparability, CFC, is usually required for level comparisons, but CUC for difference comparisons).
  *   **The Departmental Failure:** The procedure implicitly sets all weights $a_i = 1$ (everyone's score counts equally toward the max). However, because the scales $U_i$ are uncalibrated (see Robbins above), the *effective* weight of each person is determined by their generosity of scoring.
      *   If I am a "high scorer" (I give 95s for moderate benefits) and you are a "low scorer" (you give 40s for the same benefits), the procedure systematically favors me.
  *   **The Argument:** "Harsanyi's theorem only works if we agree on the weights *and* the scale. By letting us self-report on an uncalibrated scale, the committee isn't eliminating ethical judgments; they are outsourcing the weighting to our individual scoring habits. Sen's critique applies directly here: without interpersonal comparability, the 'social welfare' ranking is arbitrary. You are not maximizing welfare; you are maximizing the variance in scoring leniency."

  ### 3. Mechanism Design: The Incentive to Lie
  This is perhaps the most pragmatic objection, grounded in the informational constraints discussed in social choice.
  *   **The Technical Point:** In mechanism design, a procedure is **strategy-proof** if truth-telling is a dominant strategy. For a utilitarian aggregation of self-reported intensities to work, you need a "Groves-Clarke" style mechanism (taxes/transfers) to induce truth-telling.
  *   **The Departmental Failure:** This is a "winner-take-all" contest based on self-reported intensity.
      *   If I believe my true benefit is 80, but I know my colleague is likely to report 90, my rational move is to report 100.
      *   Since everyone reasons this way, the equilibrium is for everyone to report 100. The mechanism collapses into a random lottery, but without the fairness of an actual lottery.
  *   **The Argument:** "Even if we *could* compare utilities, this mechanism creates a dominant strategy to inflate scores. It violates the informational integrity required for any valid aggregation. We aren't measuring benefit; we are measuring confidence and strategic aggression. A junior faculty member afraid of looking greedy might report 60; a senior member might report 100. The procedure biases against the risk-averse."

  ### 4. Arrow's Extended Sympathy: The Category Error
  Arrow's later move in *Social Choice and Individual Values* (2nd ed.) offers a constructive alternative that highlights why the current form is misguided.
  *   **The Technical Point:** Arrow suggested we avoid comparing $U_{me}(x)$ vs. $U_{you}(y)$ directly. Instead, we compare extended alternatives: $(x, me)$ vs. $(y, you)$. We ask, "Which state of affairs is better?" rather than "Who wants it more?"
  *   **The Departmental Failure:** The form asks, "How much would this benefit *your* research?" This is a first-person intensity report. It locks us into our own subjective perspectives.
  *   **The Argument:** "Arrow showed that valid interpersonal comparisons require an impartial perspective, not an aggregation of subjective intensities. We should not be asking 'How much do you want this?' but rather 'If you were in each candidate's position, which allocation would you judge to be better for the department?' The current form solicits lobbying, not judgment."

  ### 5. The Money-Metric Sidestep (and why it fails here)
  Applied welfare economists often try to bypass these issues using money-metric utility or Willingness-To-Pay (WTP).
  *   **The Technical Point:** If we can measure benefit in dollars, we assume a common numeraire.
  *   **The Departmental Failure:** You cannot auction research leave ethically or efficiently.
      *   **Income Effects:** Senior faculty may have higher salaries or more grant money, making a "cost" of taking leave lower for them, or conversely, their opportunity cost (consulting fees) might be higher.
      *   **Wealth Constraints:** If we asked "How much would you pay for this leave?", junior faculty would be liquidity constrained.
  *   **The Argument:** "We can't use the standard welfare economist's escape hatch. We can't monetize this without introducing wealth biases that violate the egalitarian norms of the department. So we are back to square one: incomparable utilities."

  ### Summary for the Meeting
  You can summarize your position by stating that the committee has attempted to solve a **Social Choice** problem using a **Measurement** solution that doesn't exist.

  1.  **Invariance:** The scores are not invariant to linear transformations of individual scales (Robbins).
  2.  **Comparability:** The aggregation assumes Cardinal Unit Comparability without establishing a common unit (Sen/Weymark).
  3.  **Incentives:** The mechanism is not strategy-proof, rewarding inflation over accuracy (Mechanism Design).

  **A Proposed Alternative:**
  If you want to be constructive, suggest moving to an **Arrowian Extended Sympathy** vote. Instead of rating *benefit*, have the committee (or the faculty) rank the *outcomes* from an impartial perspective.
  *   *Option A:* Faculty X gets leave.
  *   *Option B:* Faculty Y gets leave.
  *   *Question:* "Rank these states of affairs from the perspective of the department's long-term research mission."

  This acknowledges that the decision is inherently normative (an ethical choice about resource distribution) rather than pretending it is a scientific maximization of measurable quantities. It forces the department to own the ethical weight of the decision rather than hiding it behind a pseudoscientific 0–100 scale.
