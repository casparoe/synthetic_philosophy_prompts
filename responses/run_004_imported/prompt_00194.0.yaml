          *   Why Lewis can't: Holding Billy's success at 0 when Suzy doesn't throw is a "miracle" (violates physical law of Billy's rock continuing). Lewis's similarity metric penalizes this.
          *   Why Woodward can: An intervention *is* a local violation of the normal causal order (a "surgery"). It is not penalized. It allows us to ask "Did $C1$ make a difference *given the actual state of the other factors*?"
      *   **Conclusion:** Interventionism captures the *asymmetry* of the causal structure (who actually delivered the blow) rather than the *modal robustness* of the outcome (would the window break anyway?).

