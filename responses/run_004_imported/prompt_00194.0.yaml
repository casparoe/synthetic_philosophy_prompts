      *   *Why can Lewis not do this?* Lewis's similarity metric prioritizes "no miracles." Holding $P2=0$ when $C1=0$ requires a miracle (because physically $P2$ would proceed). Lewis weights large miracles (violating laws) heavily. He prefers the world where $P2$ proceeds naturally over the world where $P2$ is magically stopped. Woodward's intervention is *defined* as a break in the laws (a "surgery"), so it doesn't count as a similarity penalty. It's a feature, not a bug.

