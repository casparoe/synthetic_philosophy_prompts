      *   *Why is this "Surgical"?* Because Lewis's counterfactual "If $Throw1=0$" forces us to recalculate $Collision$ based on the physics of the world. Woodward's intervention on $Progress1$ *breaks* the link from $Collision$ to $Progress1$. It asks: "Given the actual state of the rest of the system (where Billy's rock is stopped), does Suzy's rock matter?"
      *   *This is the key:* **Holding the backup process fixed at its actual (failed) value.** Lewis's semantics won't let you hold the backup fixed if the removal of the primary cause naturally unleashes the backup. Woodward's *modularity* allows you to test the contribution of the primary cause *independently* of the backup's potential, by focusing on the actual structural connections.
      *   *Wait, does Woodward allow holding the backup fixed?* Yes, in the context of **actual causation** (token causation), Woodward introduces the idea of holding "off-path" variables fixed at their actual values. This is the **HP (Halpern-Pearl)** style definition which Woodward aligns with.
      *   *Definition:* $C$ is a cause of $E$ if there is a setting of off-path variables (like the backup's success) to their *actual* values such that $E$ counterfactually depends on $C$.
