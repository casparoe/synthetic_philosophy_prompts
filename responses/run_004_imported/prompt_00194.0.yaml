      *   *Actually, the standard interventionist solution to preemption relies on the **intrinsic nature of the process**.* Woodward agrees with Lewis that simple counterfactual dependence isn't enough. But he disagrees on *why*. For Lewis, it's about similarity. For Woodward, it's about **manipulability**.
      *   *Better angle:* The "Surgical" intervention allows us to distinguish between **causing** and **enabling** or **backing up**.
      *   *Let's pivot to the "Modularity" assumption.* This is the technical heart. In a Structural Equation Model (SEM), each equation represents a distinct mechanism. $X := f(Parents(X))$. An intervention replaces this equation with $X = x$.
      *   *In Late Preemption:* We have equations for the progress of both rocks.
          *   $Progress1 := Throw1$
          *   $Progress2 := Throw2 \times (1 - Collision)$
