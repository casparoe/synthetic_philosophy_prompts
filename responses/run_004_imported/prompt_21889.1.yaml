answer: |-
  **Setting:** *A quiet corner of the conference lounge, late afternoon. The air smells of stale coffee and marker ink. **Dorothy** (channeling Dorothy Edgington) sits with a notebook full of probability trees. **Robert** (channeling Robert Stalnaker) leans back, staring at a whiteboard covered in possible worlds diagrams.*

  **Robert:** You know, Dorothy, Lewis's proof keeps me up at night. Not because I think he's wrong about the math, but because I think you're drawing the wrong metaphysical conclusion from it. If we accept that conditionals express propositions, the triviality result shows we cannot equate the probability of the conditional with the conditional probability. So, we must reject the equation.

  **Dorothy:** And that, Robert, is where you lose the phenomenon. The equation—Adams' Thesis—captures exactly how we use conditionals. When I say, "If it rains, the match will be cancelled," I am not describing a possible world where a rain-cancelled-match proposition is true. I am expressing a high degree of belief in the cancellation *given* the rain. To save your truth conditions, you have to tell me that my intuitive grasp of probability is systematically wrong.

  **Robert:** I tell you no such thing. I say your intuition is right *in context*. But logic requires truth-aptness. If "If A, then C" cannot be true or false, how do you handle negation? Suppose I say, "It is not the case that if it rains, the match will be cancelled." On your view, the embedded conditional has no truth value. So what is the negation operating on? You can't negate a supposition. You can only negate a proposition.

  **Dorothy:** That is the classic objection, yes. But consider what you do. You posit a "closest world" where it rains. If the match is cancelled there, the conditional is true; if not, false. But this leads to absurdities. Suppose I'm unsure if it will rain. On your view, I must be unsure about which world is closest. But my uncertainty is about the weather, not the similarity metric of logical space. As for negation: "It is not the case that if A, C" simply means "Supposing A, it is not the case that C." It rejects the conditional move, it doesn't assert a contrary fact.

  **Robert:** That works for simple rejection. But what about disjunctions? "Either if it rains the match is cancelled, or if it snows the match is moved indoors." If neither disjunct expresses a proposition, what makes the whole sentence true? You seem to be suggesting a logic where sentences can be validly combined without having truth values. That looks like a category error. You're trying to have your cake—logical embedding—and eat it too—no truth conditions.

  **Dorothy:** I'm suggesting that the truth-conditional model is the Procrustean bed here. You're chopping off the feet of our probabilistic intuitions to fit them into a True/False box. You ask about disjunctions? We handle them by assessing the assertibility of the whole based on the conditional probabilities of the parts. We don't need a "truth value" for the disjunction to know it's reasonable to assert. Why insist that *meaning* equals *truth conditions*?

  **Robert:** Because without truth conditions, you lose the link between belief and content. If I believe "If A, C," what is the content of my belief? If it's not a set of worlds, what is it? A rule? A habit? If it's just a disposition to infer C from A, how do you distinguish that from a causal expectation? Furthermore, let's turn the tables. You accuse me of saving the theory at the cost of the Equation. But isn't your move just as defensive? Lewis proved that *if* conditionals are propositions, the Equation fails. You say, "Ah, so they aren't propositions." Isn't that just dodging the proof rather than solving the problem? You're changing the subject to avoid the contradiction.

  **Dorothy:** It's not dodging; it's diagnosing a false premise. Lewis assumes that for any sentence S, there is a proposition P such that P(S) = P(P). I deny that assumption for conditionals. It's not a workaround; it's a claim about linguistic category. But let's look at your "solution." You keep the propositions, but you restrict the Equation. You say $P(A \to C) = P(C|A)$ holds only when the probability function is compatible with the selection function. Isn't that ad hoc? It looks like you're saying, "The equation holds whenever it doesn't lead to triviality."

  **Robert:** It is not ad hoc! It reflects the dynamics of context. When you assess the probability of a conditional, you are temporarily adding the antecedent to your stock of beliefs. That changes the context. The proposition expressed by "If A, C" depends on that context. Lewis's proof assumes the proposition expressed is fixed across the probability space. I say the proposition shifts as the probability distribution shifts. The Equation fails in the triviality cases precisely because evaluating the probability changes the meaning of the conditional.

  **Dorothy:** But that makes communication miraculous. If the proposition I express depends on your probability distribution, how do we ever disagree? If I say "If Oswald didn't shoot Kennedy, someone else did," and you assign a low probability to the antecedent, are we talking about different propositions? It seems your semantics makes the content of the conditional radically context-dependent in a way that undermines objective disagreement.

  **Robert:** We disagree on the *selection function*, not just the probabilities. We share a standard of similarity for worlds. But let's press your embedding issue again. You glossed over it. What about quantifiers? "For every coin x, if x is tossed, it lands heads." If each instance has no truth value, what does the universal quantifier bind? You can't quantify into a supposition. You need a domain of objects satisfying a condition. If the conditional isn't a condition that can be satisfied (i.e., true), the sentence collapses.

  **Dorothy:** I can handle quantifiers as generalizations over conditional probabilities. For every x, $P(\text{Heads}_x | \text{Tossed}_x)$ is high. We don't need a truth value for the open sentence to make the generalization meaningful. But Robert, be honest. The reason you cling to truth conditions is that you want Modus Ponens to be validity-preserving in the classical sense. But even you have to admit McGee's counterexamples. If I believe "If a Republican wins, then if it's not Reagan, it's Anderson," and I believe "A Republican wins," I am not committed to "If it's not Reagan, it's Anderson." Your truth-conditional semantics predicts I should be. My probabilistic view explains why I might not be—the conditional probability shifts when the context shifts.

  **Robert:** McGee's examples are contentious. But even if I grant some nuance there, your view has a heavier cost. If conditionals have no truth values, they cannot be the objects of knowledge. I can know that Paris is in France. Can I *know* that if it rains, the match is cancelled? On your view, "knowing" a conditional is a category mistake. You reduce knowledge to high confidence. But there is a difference between being confident and being right. If there is no "right" (truth), there is no knowledge.

  **Dorothy:** I distinguish between being correct in assertion and the sentence being true. I can be justified in asserting the conditional without there being a "fact of the matter" in the world that makes it true. The fact is the probabilistic relation, not a worldly state of affairs. But you, Robert, you buy truth conditions at the price of implausibility. Your selection function requires a unique closest world. What if there's a tie? What if the antecedent is impossible? You have to twist the logic to handle counterpossibles. I just say the conditional probability is undefined or 1, and move on.

  **Robert:** Ties are manageable with a system of spheres. But here is my final challenge. If you deny truth values, you must deny that conditionals can be premises in reductio arguments. If I assume "If A, C" to derive a contradiction, I am assuming it has a truth value (specifically, False). If your theory is right, reductio reasoning involving conditionals is invalid. Are you really prepared to banish reductio from conditional reasoning?

  **Dorothy:** I am prepared to say that reductio works on the *assertibility conditions*, not truth values. If assuming the conditional leads to absurdity, it shows the conditional is not assertible, not that it is "False" in the correspondence sense. But look, Robert, we are at an impasse. You want a unified semantics for all sentences, so you force conditionals into the propositional mold. I want a unified theory of reasoning, so I force semantics to follow the probability.

  **Robert:** Precisely. I think the cost of losing propositions is too high. It isolates conditionals from the rest of logic. I would rather restrict the Equation and admit that our probabilistic intuitions about conditionals are sensitive to context in a way that simple conditional probability doesn't capture.

  **Dorothy:** And I think the cost of losing the Equation is too high. It isolates semantics from how we actually learn and reason under uncertainty. If your truth conditions don't align with rational degrees of belief, what good are they?

  **Robert:** *Sips cold coffee.* They allow us to say what the world would be like if things were different.

  **Dorothy:** *Closes notebook.* And they allow me to say what I should believe given what I know. Perhaps that's all we can ask.

  **Robert:** Until Lewis comes back with a new proof.

  **Dorothy:** Don't give him ideas.
