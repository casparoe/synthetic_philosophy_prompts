      *   *Sidgwick's Philosophy:* He's a utilitarian but also an intuitionist/empiricist in epistemology. He cares about duty and truth. He was deeply troubled by the conflict between science and religion/morality. Psychical research was, for him, a potential bridge (if survival of death could be proved, morality gains a sanction).
      *   *The Quote's Logic:*
          *   "Trust to the mass of evidence": This sounds like Bayesian updating or simple induction.
          *   "Nothing left to allege except that the investigator is in the trick": This acknowledges the *underdetermination of theory by data*. No matter how good the data, an alternative hypothesis (fraud) can always be posited.
          *   "But when he has nothing else left to allege he will allege that": This is a rhetorical move. It shifts the burden of *rationality* onto the critic. If the only objection is *ad hoc* fraud, the critic is being unreasonable, not logical.

  3.  **Address the Physicist's Diagnosis (Random vs. Systematic Error):**
