answer: |-
  Your diagnosis is exceptionally sharp, and as a physicist, you have put your finger on the precise epistemological tension that Sidgwick is grappling with. You are not importing a distinction that fails to transfer; rather, you are identifying the core logical vulnerability of the SPR's project using the exact framework (error analysis) that Sidgwick wished to emulate.

  Here is an analysis of Sidgwick's standard of proof, the validity of your critique regarding systematic bias, and whether Sidgwick recognized the limits of his own program.

  ### 1. The Standard of Proof: Moral vs. Demonstrative Certainty
  Sidgwick is explicitly distinguishing between two standards of proof, though he uses 19th-century terminology rather than modern statistical terms.

  *   **Demonstrative Force:** This corresponds to what you might call mathematical proof or a $5\sigma$ discovery where background noise is fully characterized and eliminated. Sidgwick admits this is impossible ("limited by the trustworthiness of the investigator").
  *   **Conviction:** This corresponds to what philosophers of the era called "moral certainty" or legal proof "beyond reasonable doubt."

  When Sidgwick says, "trust to the mass of evidence for conviction," he is arguing for a **Bayesian accumulation of warrant** rather than a logical deduction. He is suggesting that while no single datum $D$ proves hypothesis $H$ (because $P(D|Fraud) > 0$), the accumulation of varied data points should raise the posterior probability $P(H|E)$ high enough that rejecting $H$ becomes irrational, even if it remains logically possible.

  However, your critique highlights that he is trying to solve a systematic error problem with a statistical solution.

  ### 2. Your Diagnosis: Random vs. Systematic Error
  Your intuition that Sidgwick is conflating error types is correct, but with one nuance regarding Sidgwick's intent.

  **The Conflation:**
  If the "trick" (fraud/error) is a property of the *methodology* itself, then $N$ trials do not reduce the error. If the apparatus is calibrated wrong, measuring a million times doesn't help. Similarly, if the hypothesis is "Sidgwick is a dupe," collecting more testimony from Sidgwick doesn't reduce the probability of that hypothesis. This is indeed a non-averaging-out bias.

  **The Nuance (Independent Investigators):**
  Sidgwick's phrase "add experiment upon experiment" implies more than just repetition; it implies **variation of conditions**. In physics, if you measure the speed of light using rotating mirrors, then cavity resonance, then laser interferometry, you are testing for systematic error. Sidgwick hoped that by having *different* investigators (different "detectors") in *different* settings, the "trick" hypothesis would become less parsimonious.
  *   *Physicist's view:* If Investigator A, B, and C all see the effect, the probability of a conspiracy ($P(Conspiracy)$) drops, but the probability of shared cognitive bias ($P(Bias)$) does not.
  *   *Sidgwick's hope:* He believed shared cognitive bias could be ruled out by strict controls.
  *   *The Reality:* As you noted, the critic's fallback is unfalsifiable. "The investigator is in the trick" is a **universal systematic error** claim. It asserts that the class of "positive investigators" is a biased sample of all investigators. No amount of data from within that sample corrects the selection bias.

  So, yes, your diagnosis is fair. Sidgwick is treating a problem of **underdetermination** (the data supports both "Psychical Phenomena" and "Undetected Fraud") as if it were a problem of **signal-to-noise ratio**.

  ### 3. Did Sidgwick Sense the Program Could Not Succeed?
  This is the more profound philosophical question. The evidence suggests Sidgwick was painfully aware that his evidential programme could not, in principle, satisfy a strict logical criterion, but he believed it could satisfy a **pragmatic and ethical** one.

  **A. The "Unreasonable Critic" Move**
  Notice the end of the quote: *"But when he has nothing else left to allege he will allege that."*
  Sidgwick is shifting the goalposts from **Logic** to **Reasonableness**. He admits the critic *can* always allege fraud. His argument is that at a certain point, doing so is *unreasonable*. He is defining the standard of proof not as "impossibility of doubt" but "exhaustion of reasonable doubt."
  He knows he cannot silence the dogmatic skeptic. He is writing for the "honest doubter" who is willing to update their priors.

  **B. The Ethical Necessity**
  Sidgwick was not merely a scientist; he was a moral philosopher troubled by the conflict between science and religion. For Sidgwick, if psychical research could prove survival after death, it would provide a rational sanction for morality (a solution to his "dualism of practical reason").
  Because the *stakes* were so high, he was willing to accept a lower standard of evidence than he might for a claim about gas diffusion. He sensed the logical gap but felt a moral imperative to leap it. In his private writings, he admitted that he often felt more certainty than the evidence strictly warranted, because the *hope* was necessary for his ethical system to hold together.

  **C. The Tragic Awareness**
  Sidgwick's later life suggests he knew the SPR would likely fail to produce the "conclusive" fact he sought. He remained President until his death, but his private correspondence reveals deep frustration. He realized that the "mass of evidence" was mostly anecdotal and that experimental controls were always vulnerable to the "trick" objection.
  He essentially turned the SPR into a holding action: a way to keep the question "open" without claiming it was "settled."

  ### Summary
  You are right to identify the logical trouble. Sidgwick is attempting to use inductive accumulation to solve a problem of systematic bias (the universal possibility of fraud/credulity).

  *   **Is it a fair diagnosis?** Yes. The "trick" objection is a systematic bias that does not average out with $N$. Sidgwick hopes that varying investigators mitigates this, but he cannot logically rule it out.
  *   **Does he sense the failure?** Yes. He admits "demonstrative force" is limited. His strategy is to redefine success not as logical compulsion (which he admits is impossible) but as the rational exhaustion of alternative explanations. He is asking the scientific community to accept a **probabilistic warrant** for a claim that requires **deterministic proof** to be accepted by the mainstream.

  In modern terms, Sidgwick is asking the community to accept a claim with a high p-value because the prior probability of the null hypothesis (that there is *nothing* beyond current physics) feels intuitively wrong to him, while the critics are insisting that the look-elsewhere effect and experimenter bias render the p-value meaningless. Your physicist's instinct that these two sides are talking past each other is exactly correct. Sidgwick knew it, too; he just hoped that "pegging away" would eventually tip the balance of *will*, if not the balance of *logic*.
