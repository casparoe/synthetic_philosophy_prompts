          *   *Incommensurability:* High. "Mind" was taboo vs. "Mind" is the object of study.
          *   *Dispute:* In social sciences, Kuhn's model is often applied more loosely. Was it a sudden revolution or a gradual shift (Chomsky, cybernetics)? Many argue it wasn't a clean break; behaviorist methods persisted.
          *   *Verdict:* Weaker than physics/chemistry examples. Tier C or B. Let's go C because "paradigm" in psychology is already disputed.

