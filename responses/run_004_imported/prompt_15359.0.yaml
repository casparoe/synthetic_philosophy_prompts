          *   *Incommensurability:* Extreme. "Particle," "Position," "Momentum" change meanings (Uncertainty Principle).
          *   *Verdict:* This is arguably the deepest conceptual break in physics. S tier.

      *   **8. Continental fixism -> Plate tectonics:**
