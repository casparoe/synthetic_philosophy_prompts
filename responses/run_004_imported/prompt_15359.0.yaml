          *   *Dispute:* Many historians see this as more cumulative (Lyell, Lamarck, etc. paved the way). Also, genetics (Modern Synthesis) was needed later.
          *   *Verdict:* High impact, but disputed as a *Kuhnian* shift because the "old paradigm" wasn't purely scientific. Let's place it in A or B.

