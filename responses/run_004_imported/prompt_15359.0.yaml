          *   *Incommensurability:* High. "Planet" changes meaning (Earth becomes a planet, Sun becomes a star). Motion is relative vs. absolute. Cosmology changes fundamentally.
          *   *Verdict:* Strong candidate for S tier.

      *   **2. Phlogiston chemistry -> Lavoisier's oxygen theory:**
          *   *Kuhn's View:* Kuhn wrote *The Structure of Scientific Revolutions* using chemistry examples extensively. He explicitly cites Lavoisier as a revolution.
          *   *Incommensurability:* High. "Calcination" changes meaning. Phlogiston (substance released) vs. Oxygen (substance absorbed). The whole ontology of matter changes.
          *   *Verdict:* Strong candidate for S tier.

      *   **3. Caloric theory -> Kinetic theory of heat:**
          *   *Analysis:* Caloric was a fluid; Kinetic is motion of particles.
          *   *Incommensurability:* High ontological shift (substance vs. motion). However, some argue the mathematical formalism carried over smoothly (thermodynamics). But the *concept* of heat changed radically.
          *   *Verdict:* Strong, but maybe slightly less "world-shattering" than Copernicus or Lavoisier in terms of immediate practice. Let's put it in A or S. Given Kuhn's focus on ontology, this is a strong revolution. Let's lean A because thermodynamics bridged the gap somewhat.

