      *   *Incommensurability:* The old and new theories cannot be fully translated into one another. Terms change meaning (e.g., "mass" in Newton vs. Einstein).
      *   *Worldview Change:* Scientists see the world differently (e.g., pendulum as constrained fall vs. harmonic oscillator).
      *   *Problem Shift:* What counts as a puzzle changes.
      *   *Non-Cumulative:* It's not just adding bricks to a wall; it's tearing down the wall and building a new one.
      *   *Crisis:* Preceded by anomalies the old paradigm can't solve.

