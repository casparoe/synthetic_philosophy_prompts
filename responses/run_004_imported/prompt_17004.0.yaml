answer: |-
  Good evening. For those who don't know me, I'm the older sibling. I'm also the one who writes for a living, which is why I'm up here holding a microphone instead of a camera. I suspect Ingrid asked me to speak because she trusts me to navigate a room that is, statistically speaking, half family and half philosophy department. I know the stakes. I know that if I misuse a term, I will hear about it during the appetizers.

  Ingrid has spent the last decade immersed in Wittgenstein's *On Certainty*. For the rest of the family, that's the book where he argues that some things aren't "known" in the way we usually mean. We don't have evidence that the world existed before we were born, or that our memories are broadly reliable. We don't take a leap of faith to believe our own hands exist. We simply act. These truths "stand fast." They are the scaffolding, the riverbed, the quiet background against which all our ordinary questions and doubts make sense.

  Now, Ingrid's fiancé, Sam, is a structural engineer. And yes, we are all aware that in structural engineering, a hinge is a specific joint that permits rotation while carrying a load. And yes, we are all aware that Ingrid studies hinge propositions. And I am going to stop right there. I am retiring that joke. I am burying it. Because reducing what they do to a pun would miss the point of what they've actually built.

  But there is a truth in that coincidence, if we treat it seriously. Sam's job is to ensure that a structure can bear weight without breaking, and move when it needs to without collapsing. Ingrid's work is about how human beings bear the weight of existence without collapsing into skepticism.

  When I look at them together, I don't see a relationship based on a constant accumulation of evidence. I don't see a "justified true belief" that they are good for each other. That would imply that if the evidence stopped, the love would end. Nor do I see a blind leap of faith. A leap implies you are jumping over a gap, hoping you land safely.

  What I see is something much more solid. I see a partnership that functions as a hinge proposition.

  For Ingrid and Sam, their commitment isn't a hypothesis they test every morning. It is the ground they stand on. It is the thing that has to be held fast so that other things can be questioned. When you are married, you will have doubts. You will doubt where to live, how to save money, whose turn it is to do the dishes. But those are doubts *within* the marriage. They are not doubts *about* the marriage.

  This is the profound gift they give each other. In a world that demands we justify everything—our careers, our politics, our worth—Ingrid and Sam have created a space where they don't have to justify their existence to one another. They are the "of course." They are the certainty that allows the rest of life to be complicated without being terrifying.

  To the philosophers here: You know better than anyone that certainty isn't the opposite of doubt; it's the condition that makes doubt intelligible.
  To the family: You know that love isn't a feeling you measure; it's the floor you walk on.

  Ingrid, you have spent your career studying what it means for something to stand fast. Today, you don't have to study it anymore. You get to live it.

  So, please raise your glasses. To Ingrid and Sam: May your foundation hold, may your joints move when the load shifts, and may you always have one less thing to prove.

  To the bride and groom.
