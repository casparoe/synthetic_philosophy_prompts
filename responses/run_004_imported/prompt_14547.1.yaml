answer: |-
  Here are ten interview questions designed to press on the structural weak points of superrationality and Multiverse-Wide Superrationality (MSR), complete with follow-ups tailored to anticipate and block standard defensive maneuvers.

  ### 1. The Reference Class and "Same Agent" Identity
  **Question:** "A common critique of moving from Hofstadter's literal twins to MSR's 'sufficiently rational' strangers is that the argument smuggles in the conclusion it tries to prove. To get cooperation, you need a high correlation between my decision and yours. But if we aren't identical code running on identical hardware, that correlation looks like an empirical claim, not a logical necessity. When you relax the condition from 'identical' to 'sufficiently rational,' where exactly is the cutoff? At what point does the reference class become so broad that the correlation assumption is no longer licensed by logic, but merely hoped for?"

  **Follow-up:** "I anticipate you might say that for decision-theoretic purposes, two rational agents solving the same problem *are* the same agent functionally. But if my brain uses heuristic A and yours uses heuristic B, and we arrive at the same conclusion via different computational paths, in what ontological sense are we the 'same agent'? If the physical implementation matters for the output even slightly, doesn't that break the logical identity you need to justify the correlation?"

  ### 2. Decision Rule vs. Empirical Belief
  **Question:** "Critics often argue that superrationality isn't a new decision rule at all, but just standard Expected Utility (EU) maximization combined with a controversial empirical belief—namely, that my choice is statistically correlated with yours. If I simply assign a low probability to that correlation, standard EU tells me to defect. Is superrationality actually prescribing a different *calculation*, or is it just commanding us to adopt a specific, perhaps unjustified, empirical prior?"

  **Follow-up:** "If it's just a matter of priors, then a Causal Decision Theorist who believes the correlation is zero isn't being *irrational*, just empirically skeptical. So, are you claiming that rationality *forces* us to assign a high probability to this correlation, or are you claiming we should maximize utility assuming the correlation holds regardless of our empirical confidence? Because if it's the latter, you seem to be asking agents to ignore their own credences."

  ### 3. The Kantian Parallel
  **Question:** "There is a striking resemblance between superrationality and Kant's Categorical Imperative: 'Act only according to that maxim whereby you can, at the same time, will that it should become a universal law.' In both cases, the reasoning is that I should do X because I should want all agents in my position to do X. But Kant frames this as a moral duty, whereas you frame it as prudential rationality. Do you think superrationality successfully reduces morality to self-interest, or does it just borrow moral language to make a game-theoretic point?"

  **Follow-up:** "If it's the latter, consider a case where the 'universal law' leads to an outcome that is game-theoretically optimal but morally repugnant—for example, coordinating with a vast number of agents to sacrifice a minority for the greater good. If superrationality mandates this coordination purely on efficiency grounds, does it diverge from Kant? And if it diverges, why should we view it as a normative guide for behavior rather than just a description of how to win?"

  ### 4. MSR and Epistemic Licensing
  **Question:** "Let's turn to the multiverse-wide extension. In the standard Twin Prisoner's Dilemma, I might grant a correlation because we share a source code or a designer. In MSR, I am asked to cooperate with agents in causally disconnected regions of the multiverse with whom I can never communicate or gather evidence. What specifically licenses the belief that my decision here correlates with theirs? Is it a logical truth, and if so, how do you access it without empirical evidence?"

  **Follow-up:** "You'll likely say the correlation is logical, not causal. But logic governs necessary truths, whereas my decision is a contingent event in a specific physical brain. Unless you are a platonist about decision algorithms, aren't you asking me to treat a contingent physical event as if it were a necessary truth? How do you bridge that gap without simply asserting the correlation exists?"

  ### 5. The "Cooperate with Anything" Objection
  **Question:** "If the basis for cooperation is simply that another entity's disposition is correlated with mine, doesn't this open the door to cooperating with literally anything? If I suspect that a random number generator, or a rock, or a hostile alien superintelligence happens to be correlated with my output for whatever reason, does superrationality commit me to 'cooperating' with them? Where do you draw the boundary of the 'superrational community'?"

  **Follow-up:** "If you say the boundary is 'agents using similar reasoning,' aren't you back to the reference class problem from Question 1? If I reason that 'I should cooperate with anything correlated with me,' and the rock is correlated, but I also reason 'I shouldn't cooperate with rocks,' how do you resolve that conflict without arbitrarily excluding entities that fit your own criteria for correlation?"

  ### 6. Bounded Rationality and Noise
  **Question:** "Superrationality seems to rely on a model of perfect rationality. But real agents are boundedly rational; we have noise in our cognitive processes. If there is even a 1% chance that I reason correctly and you make a mistake (or vice versa), the logical correlation degrades. In a noisy environment, doesn't the expected utility of defecting (to secure the temptation payoff against a mistaken cooperator) quickly overtake the expected utility of cooperating?"

  **Follow-up:** "You might argue that we should reason as if we were perfect. But if we know we are imperfect, isn't 'reasoning as if we were perfect' itself an empirical error? If I know there is noise, shouldn't a truly rational agent account for that noise, which would presumably lead back to defection in a one-shot scenario?"

  ### 7. Normative Force and Dissenters
  **Question:** "Suppose I understand your argument perfectly but remain unconvinced that the correlation exists. I assign a 0% probability to acausal correlation. Am I irrational? If superrationality is a requirement of rationality, you must explain why I am making a math error. If it's optional, then it's just a preference for cooperation. Which is it?"

  **Follow-up:** "If you say I am making a math error, you are claiming there is an objective fact of the matter about acausal correlation. But where is this fact located? It's not in the causal structure of the universe. If it's not in the physics, and it's not in the logic of identity (since we are distinct people), what truth-maker makes my dissent 'incorrect'?"

  ### 8. Evolutionary Stability
  **Question:** "If superrationality is the correct way to reason, we might expect it to be evolutionarily stable. However, in a mixed population, a defector can exploit a superrational cooperator without penalty in a one-shot game (since the cooperator cooperates regardless). Unless superrational agents can identify each other and exclude defectors, wouldn't evolution select *against* superrationality, rendering it a dead end for any real-world species?"

  **Follow-up:** "You might argue that in the multiverse, the sheer number of cooperators outweighs the exploiters. But within *this* causal lightcone, where selection pressure actually applies to our biology, wouldn't the superrational trait be outcompeted? If so, aren't you advocating for a decision theory that is inherently self-eliminating in any finite, causal environment?"

  ### 9. Aggregation in Infinite Multiverses
  **Question:** "MSR often relies on the idea that there are infinitely many agents. This introduces standard problems from infinite ethics. If there are infinite cooperators and infinite defectors, how do we calculate the expected utility of our action? Does my decision actually change the 'total' utility in an infinite multiverse, or does the math break down, rendering the decision theoretically inert?"

  **Follow-up:** "If you propose a method for comparing infinities (like measure theory or averaging), doesn't the choice of that method arbitrarily determine the outcome? If I choose a measure where my local action has zero weight, MSR collapses. Why should we privilege the measure that supports superrationality over one that doesn't?"

  ### 10. Practical Action Guidance
  **Question:** "Finally, let's look at real-world application. Outside of stylized Prisoner's Dilemmas, how often does MSR actually change a decision? In most real-world interactions, there is some causal reputation effect or possibility of future contact. If we strip those away, the stakes are usually negligible. Is there any concrete, high-stakes scenario where MSR prescribes a different action than Causal Decision Theory, other than 'give money to strangers in other galaxies'?"

  **Follow-up:** "If the answer is 'no,' or 'only in thought experiments,' then isn't MSR essentially a philosophical curiosity rather than a practical decision theory? If it doesn't change how we should live, negotiate, or policy-make in *this* universe, what work is it actually doing for us?"
