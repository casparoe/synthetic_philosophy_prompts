  "Hey, this is really strong. You clearly get the concepts. To make sure you get full points on the rubric, I'd suggest two small terminology swaps:
  1.  Change 'bigger object' to 'further object' in the first sentence.
  2.  Call van Inwagen's view 'Organicism' instead of 'nihilism' (since he does believe living things exist, strict nihilists don't).
  Other than that, the logic on the Vagueness Argument is spot on."

  ### **Why this helps you:**
  By pointing out the **Organicism vs. Nihilism** distinction, you show your teacher you know the material well enough to catch nuance, which helps your own credibility as a grader. Jae gets a better grade, and you look like you know your stuff. Win-win.
