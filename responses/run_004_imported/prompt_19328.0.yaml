  *(Self-Correction on Move 4)*: Leah says MWI satisfies Bell's stricter condition. This is debated. Deutsch and Hayden argue yes. Others argue the wavefunction lives in configuration space, which is nonlocal. I should present this as "Leah is representing a specific, defensible camp (Deutsch/Hayden/Wallace)," not absolute fact.

