answer: |-
  You have identified one of the most famous and enduring problems in the philosophy of logic and time. However, the premise that contemporary tense logicians are overlooking a fatal inconsistency is itself a misconception. The field is acutely aware of Aristotle's challenge in *De Interpretatione* 9.

  The reason most contemporary philosophers and logicians do not adopt Łukasiewicz's three-valued logic is not due to oversight, but because there are several robust, logically consistent frameworks that preserve classical bivalence *without* entailing fatalism.

  Here are the specific "moves" you are missing that allow philosophers to keep bivalence while rejecting fatalism.

  ### 1. Distinguishing Truth from Necessity
  The core of the fatalist argument relies on an inference principle that many contemporary philosophers reject:
  $$T(p) \rightarrow \Box p$$
  (If it is true that $p$, then it is necessary that $p$.)

  Aristotle's argument (and the fatalist's) suggests that if "There will be a sea battle tomorrow" is true today, then the sea battle *must* happen. Contemporary logicians generally argue that this conflates **semantic truth** with **metaphysical necessity**.

  *   **The Move:** One can maintain that a proposition about the future has a truth value (it is either true or false) while denying that its truth *necessitates* the event. Truth is descriptive, not causal. The proposition is true *because* the event will happen, not vice versa. If one rejects the inference from truth to necessity, bivalence no longer leads to fatalism.

  ### 2. Ockhamism and Branching Time (The Standard Model)
  The dominant framework in modern tense logic is **Branching Time** (developed by A.N. Prior and Richard Thomason). This model visualizes time as a tree branching into the future.

  *   **The Problem:** In a branching tree, there is no single "future." There are many possible futures. So, how can "There will be a sea battle" be simply true or false?
  *   **The Ockhamist Solution:** Ockhamists argue that while the *structure* of time branches, there is a single actual history (often called the "Thin Red Line"). Relative to that specific history, every future-tensed statement is either true or false.
  *   **Avoiding Fatalism:** Even though the statement is true relative to the actual history, it is not *settled* true. It is contingent. The truth value is relative to a history, not absolute across all histories. This allows for bivalence (within a history) without determinism (across the tree).

  ### 3. Eternalism (The Block Universe)
  Many philosophers of time (particularly those sympathetic to Special Relativity) are **Eternalists**. They believe the past, present, and future all exist equally in a four-dimensional block.

  *   **The Move:** If the future exists just as much as the past, then there are truthmakers for future-tensed statements right now (namely, the future events themselves).
  *   **Avoiding Fatalism:** For the Eternalist, bivalence is trivially satisfied because the future facts exist. However, this does not imply *causal* fatalism. The fact that a future event exists in the block does not mean it was causally determined by the past; it simply means it is part of the spacetime manifold. Fatalism confuses the *fixity* of truth with the *necessity* of causation.

  ### 4. Supervaluationism
  This is a sophisticated semantic approach that attempts to capture the intuition behind Łukasiewicz (that the future is open) without abandoning classical logic.

  *   **The Move:** A future contingent statement is "supertrue" if it is true in all possible future histories, "superfalse" if false in all, and lacks a truth value if it varies.
  *   **Preserving Classical Logic:** Crucially, Supervaluationism allows you to keep classical tautologies. For example, the Law of Excluded Middle ($p \lor \neg p$) comes out as supertrue even if $p$ itself has no truth value. This allows logicians to maintain classical validity rules while acknowledging indeterminacy.

  ### 5. The Technical Costs of Łukasiewicz's Logic
  There is also a pragmatic reason logicians avoid Łukasiewicz's three-valued system ($L_3$). It breaks too much of classical logic.

  *   **Loss of Tautologies:** In $L_3$, the Law of Excluded Middle ($p \lor \neg p$) is not a tautology (if $p$ is indeterminate, the disjunction is indeterminate).
  *   **Validity Issues:** Standard inference rules like Modus Ponens can fail or require complex restriction.
  *   **Iterated Modalities:** It becomes very difficult to handle statements like "It is possible that it will be true that..." without the logic becoming unwieldy.

  Most logicians prefer to keep the robust machinery of classical logic and handle the metaphysics of the "open future" through model theory (like branching time) rather than by breaking the underlying logic.

  ### Summary
  You are not missing an inconsistency; you are encountering a **pluralism of models**.

  1.  **Łukasiewicz:** Denies bivalence to save openness. (Cost: Breaks classical logic).
  2.  **Ockhamists:** Keep bivalence, relativize truth to histories. (Cost: Requires a "Thin Red Line" metaphysic).
  3.  **Eternalists:** Keep bivalence, ground truth in future facts. (Cost: Requires a Block Universe).
  4.  **Supervaluationists:** Keep classical validity, deny bivalence for singular contingents. (Cost: Complex semantics).

  Contemporary logicians stick with classical two-valued semantics not because they ignore Aristotle, but because they believe the cost of abandoning classical logic (as Łukasiewicz did) is higher than the cost of adopting a metaphysics that accommodates bivalence (like Ockhamism or Eternalism). They argue that **truth does not imply necessity**, and that is the sufficient block against fatalism.
