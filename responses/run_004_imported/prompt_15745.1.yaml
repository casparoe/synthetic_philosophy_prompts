answer: |-
  Marcus, standing here today, looking at you in this cap, I'm struck by how much time fits into six years. Two thousand one hundred and ninety days of letters, phone calls, and visits that taught me who you are becoming, not just who you were. People often talk about moments like this as something you seized, something you willed into existence through sheer force of choice. I see the sweat and late nights studying under that bunk light, but the truth is more complicated, and ultimately, more beautiful.

  You didn't walk this path in a vacuum. You walked it because instructors offered patience when frustration would have been easier. You walked it because Mom and Dad kept sending books even when replies were slow. You walked it because chances aligned—luck, timing, grace—allowing a seed to find soil. To ignore those forces would be to ignore the village that built this graduate. We often want heroes to be self-made, but real growth is always a collaboration between a person and their circumstances.

  We celebrate you today not because you created yourself from nothing, but because you tended carefully to the life you were given.

  There is honesty in admitting none of us are the sole authors of our characters. Our strengths arrive from somewhere outside us; our resilience is often borrowed from those who believed in us first. But there is also power in what you did with them. When the opportunity came, you didn't look away. You engaged. You struggled. You let the best parts of your nature take the lead. That responsiveness, that willingness to be shaped by something better, is what I admire most.

  So, I am not here to claim you earned this in some cosmic ledger of merit. I am here to say I am grateful you are my brother. I am grateful that when the circumstances shifted, you were ready to move with them. This degree is a testament to what happens when a human being meets the right support at the right time.

  Marcus, I love you. I am proud of the man standing here. Not because you made yourself, but because you showed up fully for the life you have. Congratulations.
