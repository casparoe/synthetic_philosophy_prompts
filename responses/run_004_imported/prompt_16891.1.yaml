  My advisor told me I should take full credit for my paper.

  I said, "I can't. Strawson's Basic Argument. I wrote it because of how I am, and I'm not responsible for how I am."

  He said, "Fine, then choose to change how you are."

  I said, "I would, but the decision to change just flows from how I already am."

  He said, "So choose to change the way you choose."

  I said, "Same problem. I'd need a prior self to make that choice... and I'm not responsible for him either."

  He sighed and said, "So you're telling me you need an infinite chain of responsible selves to accept a grade?"

  I said, "Yep. I'm currently waiting for the original architect of my will to sign off on the acceptance form."

  He asked, "And?"

  I said, "He's not coming. Turns out he's stuck in an infinite meeting with his prior self. It's turtles all the way down, but none of the turtles are liable."
