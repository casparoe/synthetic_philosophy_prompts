      *   **Kepler's Defense (The Distinction):** Kepler explains he *agrees* with most of Feselius's criticisms. He hates the "cookbook astrology" (signs, houses).
      *   **The Core Conflict (Aspects vs. Mechanism):** Feselius presses on *how* aspects work. If there are no physical rays, what is it? Kepler introduces the "Anima Terrae" (Soul of the Earth) and geometric harmony.
