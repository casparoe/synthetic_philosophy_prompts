      *   **The Critic (Let's call him Dr. Feselius, based on the prompt's mention, or a fictionalized composite. Let's use "Feselius" to honor the prompt's specific reference, but give him sharp arguments):** A physician/rationalist. Skeptical of occult influences. Demands physical causality. Sees Kepler's "soul" theory as mystical hand-waving.

  3.  **Drafting - Section by Section:**

