      *   **Curry's Paradox:** $C \leftrightarrow (C \to \bot)$. If $C$ is true, then $\bot$ is true. Derivation uses Identity, Contraction, and Modus Ponens. It leads to trivialism (everything is true) without using negation.
      *   **The Conflict:** Paraconsistent logics block explosion ($\{A, \neg A\} \vdash B$), but Curry uses $\{A, A \to B\} \vdash B$. Blocking explosion doesn't stop Curry. To stop Curry, you need a *paracomplete* logic or a *substructural* logic (giving up contraction or MP).
      *   **The "Uniformity" Claim:** If dialetheism needs different mechanisms for Liar (accept glut) vs. Curry (restrict conditional/contraction), is it really a unified theory?

