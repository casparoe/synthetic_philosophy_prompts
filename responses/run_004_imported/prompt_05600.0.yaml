      *   *The "Inclosure Schema":* Priest argues all paradoxes (Liar, Curry, Russell) share a common structure (the Inclosure Schema).
      *   *The "Unified" Defense:* He might argue that the *diagnosis* is uniform (self-reference + closure + transcendence), even if the *logical patch* varies slightly. Or, he might argue that the conditional in Curry is not the "real" conditional, so restricting it is part of the same semantic revision that allows gluts.
