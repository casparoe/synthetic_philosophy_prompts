      *   *The Missing Piece:* The metaphysical/psychological core: *Amour-propre* (vanity/social comparison). Rousseau's deeper objection is that theater feeds *amour-propre* by making us spectators of others rather than actors in our own lives. It creates a culture of appearance (*paraître*) over being (*être*). Also, the distinction between *Festivals* (active participation) vs. *Theater* (passive consumption) is the positive alternative Rousseau offers, which neither fully highlighted. Naomi touched on *cercles*, but the Festival idea is the constructive counterpart.

