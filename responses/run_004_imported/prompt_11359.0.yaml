answer: |-
  **Alex:** You're still buying the Cummins line? Come on. The heart makes a thumping sound. It also pumps blood. Why is pumping the function and noise just a side effect? Your view can't distinguish them.

  **Jamie:** It distinguishes them perfectly based on explanatory context. If I'm explaining circulation, pumping is the function. If I'm explaining heart murmurs, the sound is the function. Your etiological view just dogmatically insists history decides, even if the trait's current utility changes.

  **Alex:** It's not dogma, it's normativity. If the heart stops pumping, it's malfunctioning. If it stops making noise—say, in a vacuum—it's not. History fixes the standard for what the trait is *supposed* to do. Your view makes function too relative. Anything a trait does could be a function if I pick the right system capacity.

  **Jamie:** Relative to explanatory interests, yes. But here's the killer: A beneficial mutation arises. Day one. It helps the organism survive. On your view, does it have a function?

  **Alex:** Not yet. It has a causal role, but no proper function until it's actually selected over generations.

  **Jamie:** That's absurd. Natural selection selects it *because* of what it does. You're saying selection acts on traits that have no function? You've severed the link between function and the very mechanism that creates them.

  **Alex:** I'm saying selection *establishes* the function. Before that, it's just a lucky accident. You're conflating "useful" with "function." Just because a screwdriver can crack a nut doesn't mean its function is nut-cracking.

  **Jamie:** But if that screwdriver was manufactured specifically to crack nuts, it is. What about the panda's thumb? It's a modified wrist bone. Historically, it was for wrist stability. Now it's for grasping bamboo. Your view says its function is... wrist stability? Even though it doesn't do that anymore?

  **Alex:** It says the grasping is an exaptation, not a proper function yet. Or, if you trace the lineage, the selection history is messy. But at least I'm honest about the history. You just look at the current setup and say, "Well, it grabs bamboo, so that's its function." You erase the evolutionary constraint.

  **Jamie:** I erase the ghost of evolution past. Biologists care about how the organism works *now*. If the appendix causes immune responses in infants, that's a causal role. If it's vestigial garbage in adults, that's a different role. Your view gets stuck asking, "What did ancestors use this for?" when the question is "What does this do for the system?"

  **Alex:** Because "what it does" isn't enough to explain malfunction. If the appendix bursts, it's malfunctioning. Why? Because it's supposed to contain flora, not explode. That "supposed to" comes from history, not current capacity. Your view can't explain error. If the appendix does nothing, it just has no function. It doesn't fail.

  **Jamie:** I can explain error relative to the system's goal. If the system capacity is digestion, and the appendix blocks it, it's a negative contribution. We don't need ancestral ghosts to judge current performance. You're clinging to history because you want biology to have intrinsic purpose. It doesn't.

  **Alex:** I want biology to have standards distinct from what we find interesting. You make function dependent on the theorist's whim. I make it dependent on the organism's evolutionary reality.

  **Jamie:** Your "reality" says a beneficial mutation is functionless until it survives. That's not reality, that's theoretical baggage.

  **Alex:** And your "reality" says a clock's function is to tell time until I decide to use it as a paperweight, then its function is holding paper. That's not function, that's use.

  **Jamie:** We're not going to agree.

  **Alex:** No. Because you're ignoring the history that makes biology distinct from mechanics.

  **Jamie:** And you're ignoring the physiology that makes organisms alive right now, not just in the past. See you Thursday.

  **Alex:** Yeah. Thursday.
