prompt: |-
  I'm taking a philosophy of biology seminar this semester, and we just spent two classes on rival theories of biological function -- I went in expecting a boring semantics argument, but now I'm kind of hooked. The two camps are the etiological (or "selected effects") view, where a trait's function is whatever it was historically selected by natural selection for doing, versus the Cummins-style causal-role view, where a trait's function is just whatever it contributes to some capacity of the containing system that we happen to be interested in explaining at the time. My professor keeps insisting these aren't just two ways of asking the same question and that they actually spit out different verdicts in specific cases, but when I tried explaining that to my roommate (bio major, zero patience for philosophy) she just gave me a blank stare, so clearly I don't have as firm a grip on it as I though I did.

  Could you write me a dialogue, maybe two grad students arguing it out after seminar, between someone defending the etiological view and someone defending the causal-role view? I want them to actually fight over the hard cases instead of just repeating their definitions at each other -- like why the heart's function is pumping blood and not making its thumping sound even though it does both, whether a totally new mutation can have a function the very first generation it shows up (before it's ever been "selected" for anything), and whether something like the panda's "thumb" or the human appendix even counts as having a function on either view. Each side should have a real comeback ready for the other's strongest objection instead of just restating their own theory, and please don't have them politely converge by the end -- that never happens with this debate in real life and it'd feel fake here too. Maybe around 700 words.
