answer: |-
  You win the argument. Sam is conflating a **tool** with a **claim about the world**.

  This is a very common confusion, largely because the most famous proponent of paraconsistent logic (Graham Priest) is also the most famous proponent of dialetheism. Because he argues for both simultaneously, it looks like they come as a bundle. They do not.

  Here is the breakdown you can send Sam to settle this, structured by definitions, logical commitment, concrete cases, and the philosophical "cost."

  ### 1. The Definitions: Logic vs. Metaphysics

  To see why they are different, you have to look at what job each concept is doing.

  *   **Paraconsistent Logic is a technical thesis about *inference*.**
      It claims that the relation of logical consequence ($\vdash$) does not have to be explosive. In classical logic, if your premises contain a contradiction, you can validly infer *anything* ($A, \neg A \vdash B$). A paraconsistent logic simply removes that rule. It says: "It is possible to reason through inconsistent information without the system collapsing into nonsense."
      *   *Domain:* Formal systems, proof theory, inference rules.

  *   **Dialetheism is a metaphysical/semantic thesis about *truth*.**
      It claims that the predicate "is true" can apply to both a sentence and its negation. It asserts that there are **true contradictions** (dialetheias). It says: "The world (or our best description of it) is such that for some $A$, both $A$ and $\neg A$ obtain."
      *   *Domain:* Ontology, semantics, theory of truth.

  **The Analogy:**
  Think of paraconsistent logic as building a car with a reinforced engine that won't blow up if you put the wrong fuel in. Think of dialetheism as the claim that "the wrong fuel is actually the correct fuel."
  You can build the reinforced engine (paraconsistency) just in case someone *accidentally* puts the wrong fuel in (human error, bad data), without believing the wrong fuel is actually good (dialetheism).

  ### 2. The Commitment Map: Does one force the other?

  This is where you can corner Sam. The relationship is asymmetrical.

  **Direction 1: Does Paraconsistent Logic commit you to Dialetheism?**
  **No.**
  You can adopt a paraconsistent logic purely instrumentally. You might think contradictions are always false, but you recognize that human beings (or computer databases) often hold inconsistent beliefs. If you use classical logic to model human belief, the moment a person holds one inconsistent belief, you have to model them as believing *everything* (because of explosion). That's a bad model of human reasoning.
  So, you use paraconsistent logic to model *inconsistent information sets* without believing that any contradiction is *actually true* in reality. This position is often called **Weak Paraconsistency** or **Instrumentalism**.

  **Direction 2: Does Dialetheism commit you to Paraconsistent Logic?**
  **Yes (if you want to be taken seriously).**
  If you believe there are true contradictions ($A$ and $\neg A$ are both true), but you keep classical logic (which includes Explosion), you are forced to admit that *everything* is true ($B$ is true for all $B$). This position is called **Trivialism**.
  Trivialism is virtually indefensible (it implies that you are not reading this text, and that you are a potato, etc.). Therefore, any *non-trivial* dialetheist (like Priest) **must** reject the Principle of Explosion. To be a dialetheist without being a trivialist, you must be a paraconsistent logician.

  **Verdict on Commitment:**
  Paraconsistency is **necessary** for non-trivial dialetheism, but it is **not sufficient** for dialetheism.

  ### 3. Concrete Cases of Separability

  Sam needs examples. Here they are.

  **Case A: Paraconsistent Logic WITHOUT Dialetheism (The "Clean Hands" Approach)**
  *   **Context:** Legal Systems or Databases.
  *   **Scenario:** Imagine a legal database where Statute X says "All vehicles are prohibited in the park" and Statute Y says "Veterans' parade vehicles are permitted in the park." A veteran drives a jeep into the park. The system now contains a contradiction: "The jeep is prohibited" and "The jeep is permitted."
  *   **The Logic:** If the court uses classical logic, this contradiction allows a lawyer to argue "Therefore, the moon is made of cheese," and the judge would have to accept it as valid. To prevent the legal system from collapsing, the court uses a paraconsistent framework to isolate the contradiction and rule on the specific case without inferring absurdities.
  *   **The Metaphysics:** Does the judge believe reality is contradictory? No. The judge believes the *legislature made a mistake*. The contradiction is in the *code*, not in the *world*. This is paraconsistency without dialetheism.

  **Case B: Dialetheism WITHOUT Paraconsistent Logic?**
  *   **Scenario:** As established above, this leads to Trivialism. However, to be thorough: The only way to hold this is to claim "Yes, some contradictions are true, AND yes, everything follows from them."
  *   **Why it fails:** There are no serious philosophers who hold this view because it makes communication impossible. If Sam claims to be a dialetheist but keeps classical explosion, ask him: "Do I exist?" If he says "Yes," ask "Do I not exist?" If he accepts both, and keeps classical logic, he must accept "You are a toaster." If he refuses to accept that, he has implicitly rejected explosion. He is a paraconsistent logician whether he admits it or not.

  ### 4. The Verdict: Is Dialetheism just "Paraconsistency + Attitude"?

  Sam's claim was: *"They're the same move dressed up in two vocabularies."*

  **This is false.** Dialetheism is significantly "weirder" and more costly than paraconsistent logic.

  **1. The Cost of Paraconsistent Logic:**
  Adopting paraconsistent logic is a **methodological** choice. It costs you very little. You give up the Principle of Explosion. In exchange, you gain the ability to model inconsistent information (like in AI, law, or historical scientific theories, e.g., Bohr's atomic model, which was inconsistent but useful). You don't have to change your view of the world, only your view of how to process data.

  **2. The Cost of Dialetheism:**
  Adopting dialetheism is an **ontological** choice. It costs you a lot.
  *   **Violation of LNC:** You are rejecting the Law of Non-Contradiction as a universal law of reality. You are claiming that reality itself (not just our maps of it) has "glitches."
  *   **The Negation Problem:** You have to explain what "negation" means. If I say "It is raining" and you say "It is not raining," usually we disagree. If you are a dialetheist, you can agree with me *and* disagree with me simultaneously. You have to explain how disagreement is possible if contradictions are acceptable.
  *   **Explanatory Burden:** You need a theory of *why* true contradictions exist. (Priest argues they arise at the "limits of thought," like the Liar Paradox or the boundaries of objects).

  **Conclusion for Sam:**
  Paraconsistent logic is the **container**; dialetheism is a specific **substance** you might choose to put inside it.
  *   Most paraconsistent logicians are **not** dialetheists (they use the logic to handle error, not truth).
  *   Almost all dialetheists **are** paraconsistent logicians (because they have to avoid triviality).

  **The Tiebreaker:**
  Tell Sam: "If paraconsistent logic and dialetheism were the same thing, then every computer scientist who uses paraconsistent databases to handle conflicting data would be claiming that reality is contradictory. They aren't. They're just preventing crashes. You're confusing the fireproof building (paraconsistency) with the arsonist who claims the fire is real (dialetheism)."

  You are right. He is wrong. Go collect your win.
