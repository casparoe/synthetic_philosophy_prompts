answer: |-
  # The Shadow and the Substance: Why Reflection Must Yield to Conditionalization

  Bas van Fraassen's Reflection Principle (RP) occupies a peculiar space in the landscape of Bayesian epistemology. It promises a elegant solution to the problem of diachronic coherence, asserting that a rational agent's current credence in a proposition should match the credence they expect to hold in the future. Formally, if an agent is certain that their future credence in $A$ will be $x$, their current credence in $A$ should be $x$. The intuition is compelling: if I trust my future self to be rational and better informed, why should I disagree with them now? However, as the "stove" case illustrates—where a drug induces a false certainty—this intuition collapses when belief change is decoupled from evidence. This essay argues that the Reflection Principle must be abandoned as a fundamental norm of rationality. It is neither defensible in its unrestricted form nor salvageable through restriction without becoming vacuous. In its place, rational agents should adhere to the **Principle of Conditionalization on Anticipated Evidence**, supplemented by a metacognitive assessment of the **reliability of the belief-forming process**. Reflection is not a rule to be followed, but a byproduct that obtains only when specific conditions of evidential updating are met.

  ### The Appeal and the Abyss

  The initial allure of RP lies in its promise of diachronic stability. Just as synchronic Dutch Book arguments demonstrate that incoherent static credences expose an agent to guaranteed loss, diachronic Dutch Books suggest that violating Reflection exposes an agent to a similar fate across time. If I know I will believe $A$ with certainty tomorrow, but I disbelieve $A$ today, a bookie can sell me a bet today that pays off if $A$ is false, and another bet tomorrow that pays off if $A$ is true. Since I know I will accept the tomorrow bet (because I will be certain of $A$), and I accept the today bet (because I doubt $A$), I seem to guarantee a loss. RP appears to be the necessary shield against this exploitation.

  However, the "stove" case exposes a fatal flaw in this reasoning. Suppose I have checked the stove and know it is off ($P_t(\text{Off}) = 1$). I also know that a medication I must take will chemically induce a delusion tomorrow such that $P_{t+1}(\text{Off}) = 0$. Unrestricted Reflection demands that, conditional on taking the drug, I should now lower my credence that the stove is off. This is epistemically suicidal. It requires me to treat my own future irrationality as a source of information about the world. It conflates *predicting* a mental state with *endorsing* that mental state as veridical. A norm that mandates akrasia—believing against one's current evidence because one anticipates future madness—cannot be a norm of rationality.

  ### The Failure of Restriction

  Defenders of RP might attempt to rescue the principle by restricting its scope. One might argue that RP only applies when the agent expects their future self to be rational, or to have updated via a truth-conducive process. Let us call this Restricted Reflection (RRP): $P_t(A | P_{t+1}(A) = x \text{ and } \text{Rational}_{t+1}) = x$.

  In the drug case, I know $\neg \text{Rational}_{t+1}$, so RRP does not trigger, and I am not forced to update. This seems to solve the problem. However, this restriction renders the principle normatively vacuous. If RRP tells me only to defer to future selves that I *already* judge to be rational, it provides no guidance on how to handle uncertainty about the future process. It reduces to the tautology: "Defer to your future opinion if and only if you think you should defer to it."

  A genuine norm must offer traction in cases where the agent is unsure about the quality of their future cognition. If I am uncertain whether a new cognitive enhancement drug will improve my reasoning or introduce bias, RRP offers no help. It simply tells me to apply the principle if I conclude the drug is safe, but offers no criteria for making that conclusion. By outsourcing the normative work to a prior judgment of "rationality," the principle ceases to be a constraint on belief revision and becomes a description of when an agent chooses to trust themselves. It loses its status as a foundational rule of Bayesian dynamics.

  ### The Dutch Book Illusion

  The diachronic Dutch Book argument for RP also falters under scrutiny in these cases. The Dutch Book relies on the assumption that the bets offered at $t+1$ are fair according to the agent's *current* evaluation of the situation. In the drug case, while I know my future self will accept a bet on "Stove On," I know *now* that this acceptance is compelled by chemistry, not evidence. Therefore, I do not view the future betting quotient as a fair probability assessment. I view it as a malfunction.

  A sophisticated bookie cannot force a loss here because I can refuse the initial bet at $t$ by recognizing that the future betting behavior is not a reliable indicator of truth. The Dutch Book argument for RP implicitly assumes that the agent views their future self as an *epistemic peer* or superior regarding the proposition in question. When the etiology of the belief change is non-evidential (like a drug, memory loss, or bias), that assumption fails. Thus, the Dutch Book argument does not prove RP is a universal norm; it only proves that RP holds for agents who expect their future beliefs to be evidence-responsive.

  ### The Verdict: Abandon Reflection for Conditionalization

  Given that Unrestricted RP is false and Restricted RP is trivial, we should abandon Reflection as a fundamental norm. It should be replaced by a stricter adherence to the **Principle of Conditionalization**, coupled with a **Norm of Etiological Assessment**.

  The Principle of Conditionalization states that an agent should update their credences by conditioning on the total evidence acquired. $P_{t+1}(A) = P_t(A | E)$. This is the true engine of rational belief change. In standard cases where Reflection seems to work (e.g., I expect to read a reliable weather report tomorrow), it works *because* I expect to Conditionalize on the evidence contained in the report. I do not update because I will *believe* it rains; I update because I will *see* the barometer drop.

  The replacement norm for handling anticipated belief change is therefore: **Treat the anticipation of a future belief as evidence only to the extent that the process generating that belief is expected to be truth-tracking.**

  This approach handles the drug case effortlessly. The drug is not evidence about the stove; it is a causal intervention on my psychology. Therefore, Conditionalization does not apply to the proposition "Stove is Off" based on the event "I will believe Stove is Off." I do not update. Conversely, if I expect to consult an expert, I treat the expert's future opinion as evidence because the process (expert testimony) is truth-tracking. I update not because of Reflection, but because I am Conditionalizing on the anticipated evidence of the expert's report.

  This shift from Reflection to Conditionalization + Reliability Assessment resolves the tension between coherence and truth. Reflection prioritizes coherence between time-slices, even at the cost of truth (as in the drug case). Conditionalization prioritizes the link between belief and evidence. By making the *etiology* of the belief change the central criterion, we preserve the intuition that we should learn from our future selves without succumbing to the absurdity of learning from our future delusions.

  ### Conclusion

  Van Fraassen's Reflection Principle captures a seductive ideal of the unified rational agent, but it mistakes a symptom of rationality for a cause. When an agent updates rationally via Conditionalization on veridical evidence, Reflection holds. But when the mechanism of change is severed from evidence, Reflection demands irrationality. We should therefore reject Reflection as a standalone norm. It is too blunt an instrument, incapable of distinguishing between enlightenment and delusion. In its place, we must uphold the **Principle of Conditionalization** as the primary diachronic norm, governed by a metacognitive duty to assess the reliability of the processes that shape our future minds. We should trust our future selves not because they are *us*, but because we expect them to be *right*. When that expectation fails, Reflection must fail with it.
