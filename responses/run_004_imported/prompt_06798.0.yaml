answer: |-
  Here is the tiebreaker: **Your roommate is right.**

  While your intuition that "feelings should count for something" is kind and human, Mia's logic is fundamentally flawed in the context of friendship and reliability. Here is the breakdown of why the guilt doesn't save her from the hypocrisy charge, and why your roommate's stance is the healthier one for the group.

  ### 1. Guilt is Internal; Flaking is External
  Mia is arguing from **intent** ("I feel bad"), but you and the group are suffering the **impact** ("We were left hanging").
  *   **Guilt** is how *she* feels about her actions.
  *   **Accountability** is what *she does* about her actions.

  If you spill a drink on my shirt, I don't care how awful you feel about it. I care whether you help me clean it up or pay for the dry cleaning. If you spill a drink on my shirt 8 or 9 times, apologize profusely every time, feel terrible every time, but *never watch where you're walking*, your guilt is useless to me. It becomes self-indulgent. It centers her emotional state over the inconvenience she causes everyone else.

  ### 2. The "Pattern of Behavior" Trumps the "Sincerity of Feeling"
  You mentioned she has pulled this move **8 or 9 times**. This is the smoking gun.
  *   **Once or twice?** Life happens. Guilt shows she cares.
  *   **8 or 9 times?** This is a behavioral pattern.

  If she genuinely felt guilty and wanted to stop hurting her friends, the logical outcome of that guilt would be **change**. She would start under-committing, she would set reminders, or she would stop making firm plans she can't keep. The fact that the behavior hasn't changed proves that her guilt is not strong enough to alter her actions. Therefore, using that guilt as a shield ("I'm not like *them* because I suffer internally") is invalid.

  ### 3. Hypocrisy vs. Moral Authority
  Technically, anyone can point out a truth (a smoker can tell you smoking is bad). However, in social dynamics, **moral authority** comes from alignment between words and actions.
  *   **Mia's claim:** "Flaking is disrespectful."
  *   **Mia's action:** *Flakes repeatedly.*

  When she calls people out, she isn't just stating a fact; she is implying moral superiority ("I am a reliable person, you are not"). Because she is *not* a reliable person, she loses the standing to shame others for the same trait. It transforms her criticism from "constructive feedback" into **projection**. She is likely ragging on others to alleviate her own guilt about her behavior, trying to prove she is "one of the good ones" by distancing herself from other flakers.

  ### 4. The Verdict
  **Does feeling guilty preserve her right to criticize?**
  **No.** Not when the behavior is repetitive and unaddressed.

  *   **You are right** that feeling bad is better than not caring at all. It means she isn't malicious.
  *   **Your roommate is right** that it doesn't matter. In terms of trust and reliability, a well-meaning unreliable person is still unreliable.

  Mia has forfeited the right to "call people out" until she demonstrates a period of reliability. She can still say, "Hey, I know I struggle with this, but it really hurts when plans fall through," but she cannot shame others for a sin she commits weekly.

  ### How to handle it
  If you want to bring this up with Mia without starting a war, try this script:

  > "Mia, I know you feel really guilty when you have to bail, and I believe you. But when you call us out for flaking while you're doing the same thing, it feels unfair. Guilt doesn't fix the empty seat at the dinner table. If you want to call out flaking, we need to see you taking steps to prevent it, not just apologizing for it. Until then, maybe we can all agree to just be more flexible with plans?"

  **Winner:** Roommate. (But with the nuance that Mia isn't a villain, she's just stuck in a loop of unproductive guilt).
