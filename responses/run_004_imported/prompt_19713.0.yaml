answer: |-
  This is a remarkably sophisticated dinner conversation. Marisol and Owen essentially recreated the central dialectic of Derek Parfit's *Reasons and Persons* (1984), which is the foundational text for modern population ethics. They stumbled into some of the deepest waters in moral philosophy without a map, and they navigated it better than most undergraduates.

  Here is a move-by-move referee report, evaluating who held the stronger position at each stage, followed by an analysis of the "intuition" objection and the missing considerations a professional philosopher would introduce.

  ### Round 1: The Repugnant Conclusion vs. The Argument from Below
  **Marisol:** Rejects Total Utilitarianism (summing welfare) because it implies the Repugnant Conclusion (RC).
  **Owen:** Argues you can't just reject the conclusion; you must reject the premises that lead to it. He cites two intuitive premises: (1) Adding happy people without hurting others isn't bad, and (2) Equality/redistribution isn't bad. He argues these logically force you to the RC.

  **Referee's Call:** **Owen takes the round.**
  Marisol's opening is the standard "intuition bomb," but Owen correctly identifies that the Repugnant Conclusion isn't a quirk of Total Utilitarianism; it is a result of combining several very plausible intuitions (often called the "Mere Addition Paradox"). If Marisol wants to reject the conclusion, she has to identify exactly which plausible premise is false. Simply saying "I don't like the result" is a conversation-stopper, whereas Owen is offering a logical chain. He successfully shifts the burden of proof onto her to find the broken link in the chain.

  ### Round 2: Critical-Levels vs. The Sadistic Conclusion
  **Marisol:** Proposes Critical-Level Utilitarianism (CLU). Lives only count if they exceed a certain threshold of quality. This blocks the RC because "barely worth living" lives add zero or negative value.
  **Owen:** Counters that CLU implies the Sadistic Conclusion (SC). It implies it is better to add a small number of miserable people than a large number of people with lives that are good but below the "critical" threshold.

  **Referee's Call:** **Owen takes the round.**
  Marisol offered a technical fix, and Owen produced the standard, devastating counter-argument. The Sadistic Conclusion is widely regarded in philosophy as *more* repugnant than the Repugnant Conclusion. The RC asks us to accept a world of mediocrity; the SC asks us to accept active suffering to prevent mediocrity. Most people find the intentional implication that suffering is preferable to mild happiness (even hypothetically) harder to swallow than the RC. Marisol's solution created a problem worse than the one it solved.

  ### Round 3: The Clash of Intuitions
  **Marisol:** Argues Owen is being inconsistent. He says we should distrust our intuitions regarding vast populations (to accept RC), so she should be allowed to distrust intuitions regarding hypothetical suffering (to reject SC).
  **Owen:** (Implicitly) Suggests the scale makes the difference, but eventually pivots away.

  **Referee's Call:** **Marisol takes the round (on consistency), but Owen holds the substantive ground.**
  This is the crux of your specific question. Marisol lands a solid logical jab here. Owen is indeed engaging in "intuition cherry-picking" if he doesn't have a meta-ethical theory explaining *why* our intuitions fail at scale (RC) but succeed at the level of individual suffering (SC).
  *   **Why Marisol wins the point:** She correctly identifies that Owen is relying on intuition to reject the Sadistic Conclusion while asking her to abandon intuition to accept the Repugnant Conclusion. Without an explanation of *why* one intuition is reliable and the other isn't, he is being ad hoc.
  *   **Why Owen still has the stronger hand:** Most philosophers would side with Owen on the *weight* of the intuitions. Human cognitive machinery is evolved to handle small numbers and immediate suffering, not astronomical populations. We have independent reasons to think our intuition about $10^{50}$ people is broken (we can't comprehend the scale). We have fewer reasons to think our intuition that "torture is worse than mild discomfort" is broken. So, while Marisol wins on logical consistency, Owen wins on epistemic reliability.

  ### Round 4: Average Utilitarianism
  **Owen:** Pivots to Average Utilitarianism (maximize the average welfare per person) to dodge both RC and SC.
  **Marisol:** Points out two flaws: (1) It implies adding a happy person (below the average) makes the world worse. (2) It makes current value dependent on the dead (past people change the average).

  **Referee's Call:** **Marisol wins the round decisively.**
  Average Utilitarianism was largely abandoned in the late 20th century for exactly the reasons Marisol listed.
  1.  **The "Happy Sadist" problem:** If the average is extremely high, adding a normal, happy person lowers the average, making it morally wrong to have that child. This violates the "Benign Addition" premise Owen defended in Round 1.
  2.  **The "Past People" problem:** This is fatal. If a bunch of happy people lived in ancient Rome, the "average" is high. If a bunch of miserable people lived in ancient Rome, the "average" is low. This means whether it is good for *us* to have children today depends on facts about dead Romans that we cannot change. This makes moral action impossible. Marisol correctly identified that this theory severs the link between our actions and their moral value.

  ---

  ### Analysis: The "Intuition" Objection
  You asked specifically whether Marisol's jab about Owen not being allowed to pick and choose which intuitions to distrust lands.

  **It lands, but it doesn't sink the ship.**
  Marisol is right that Owen cannot simply say "Intuitions are bad" when they contradict his view and "Intuitions are good" when they support it. However, the debate isn't about *trusting intuition* vs. *trusting logic*. It is about *which intuitions survive contact with logic.*

  Owen's argument in Round 1 was that the Repugnant Conclusion is the result of a *logical proof* based on *other* intuitions (like "adding happy people is good"). So, he isn't asking Marisol to abandon intuition entirely; he is asking her to abandon *one* intuition (RC is bad) to save *two others* (Adding is good; Equality is good).

  Marisol's counter in Round 3 tries to level the playing field: "If you dump the RC intuition, I dump the SC intuition." The problem for Marisol is that the SC intuition ("suffering is bad") is generally considered more foundational than the RC intuition ("mediocrity is bad"). Owen could have argued that we have more reason to distrust our capacity to aggregate value across billions of lives than we do to distrust our aversion to suffering. He didn't articulate that well, which is why Marisol felt she won the exchange, but philosophically, the asymmetry remains.

  ### Missing Considerations: What Wasn't on the Table
  Both Marisol and Owen were debating within the framework of **Impersonal Totalism** (value is a sum in the universe) vs. **Impersonal Averagism**. A more careful treatment would have introduced three concepts that change the landscape entirely:

  **1. Person-Affecting Views (The "Non-Identity" Escape)**
  Neither friend mentioned the idea that morality is only about making *specific people* better or worse off.
  *   **The View:** An act is only wrong if it makes some *existing or future specific person* worse off than they would otherwise have been.
  *   **The Impact:** This dissolves the Repugnant Conclusion. In the RC scenario, the vast population in the "mediocre" world are different people than those in the "wonderful" world. If you choose the wonderful world, you haven't harmed the mediocre people; they simply never exist. Therefore, you haven't made anyone worse off.
  *   **Why it matters:** This is the most popular alternative to Total Utilitarianism in contemporary ethics. It allows you to reject the RC without accepting the Sadistic Conclusion.

  **2. The Distinction Between "Better For" and "Better Simpliciter"**
  Owen and Marisol treated "good" as a single substance (welfare points).
  *   **The Consideration:** Some philosophers argue there is a difference between what is "better for a person" and what is "better" in an abstract, impersonal sense.
  *   **The Impact:** If value is always *for someone*, then a population of people with lives barely worth living might not be "better" than a smaller, happier population, because the *intensity* of value matters, not just the sum. This allows for a "lexical" view where high-quality lives always trump low-quality lives, regardless of numbers, blocking the RC without needing a Critical Level.

  **3. Uncertainty and Risk (The Longtermist Angle)**
  Since you mentioned longtermism, this is a crucial omission.
  *   **The Consideration:** We never know the actual welfare outcomes of our choices with certainty.
  *   **The Impact:** Many "repugnant" conclusions rely on certainty. If we introduce risk (e.g., "There is a 1% chance this policy leads to extinction"), Total Utilitarianism becomes extremely risk-averse regarding human extinction (because it risks losing all future trillions of lives). This often aligns with common intuition *without* requiring us to accept the Repugnant Conclusion in practice. A longtermist might argue that even if the RC is theoretically true, under conditions of uncertainty, policies that maximize average welfare often maximize expected total welfare anyway.

  ### Final Scorecard
  *   **Round 1 (RC vs. Logic):** Owen (Logic beats brute intuition)
  *   **Round 2 (CLU vs. Sadistic Conclusion):** Owen (SC is worse than RC)
  *   **Round 3 (Intuition Consistency):** Marisol (Owen was inconsistent, though his underlying point was stronger)
  *   **Round 4 (Average Utilitarianism):** Marisol (Average Utilitarianism is theoretically broken)

  **Overall:** **Owen** forced the harder logical problems, but **Marisol** successfully defended against his proposed solutions. The debate ended in a stalemate because both were defending forms of Utilitarianism that are widely considered to have fatal flaws. The "winner" would have been the person who stepped outside the Utilitarian framework entirely to suggest a Person-Affecting view, but neither had that card in their hand.

  Given your interest in longtermism: This stalemate is actually good news. It suggests that population ethics is not "solved." If Owen had won decisively, longtermism would demand we maximize population size at almost any cost. If Marisol had won decisively, longtermism might lose its force regarding future generations. The uncertainty keeps the field open.
