      *   **Topic:** The Frege-Geach problem, specifically the "Negation Problem" (often associated with Schroeder, but here applied to belief ascriptions within an expressivist framework).
      *   **Specific Issue:** Distinguishing three types of denial regarding a normative belief ascription:
          1.  Belief in the contrary obligation (Obligated not to disclose).
          2.  Belief in the negation of the obligation (Not obligated to disclose).
          3.  Absence of belief (Does not believe obligated to disclose).
      *   **Constraint:** The expressivist analyzes "believes P is obligatory" as an attitude (e.g., "hoorays P" or "accepts norm"). The challenge is distinguishing these three without collapsing them or adding ad hoc primitives.
      *   **Format:** Dialogue between a Committed Expressivist (E) and a Sharp Critic (C).
      *   **Requirements:**
          *   Expressivist must attempt a technically specific fix (not just general program).
          *   Critic must press a concrete case where the fix fails or costs too much.
          *   No easy wins; end in a stand-off or honest conclusion.
          *   Tone: Academic, rigorous, suitable for a PhD level.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Standard Expressivism:* "X is wrong" = "Boo X!" (Attitude A).
      *   *Negation Problem (Schroeder):* "X is not wrong" vs. "It is not the case that X is wrong." In standard expressivism, both look like the absence of "Boo," but they mean different things (tolerance vs. non-endorsement).
      *   *User's Twist:* This is applied to *belief ascriptions* ("Priya believes..."). This adds a layer. It's not just about the semantics of "Obligatory," but the semantics of "Believes that [Obligatory]."
      *   *The Three Readings:*
          1.  $B_p(O \neg D)$ [Believes Obligated Not to Disclose]
          2.  $B_p(\neg O D)$ [Believes Not Obligated to Disclose]
          3.  $\neg B_p(O D)$ [Does Not Believe Obligated to Disclose]
      *   *Expressivist Translation:*
          1.  Priya has attitude $A_{contrary}$ toward D.
          2.  Priya has attitude $A_{neg}$ toward D.
          3.  Priya lacks attitude $A_{original}$ toward D.
      *   *The Challenge:* If attitudes are just binary (Accept/Reject), (2) and (3) might collapse. If we add specific attitudes for every negation, we lose generality (the "proliferation problem").

  3.  **Character Conception:**
      *   **Expressivist (E):** Let's call her "Elena." She's sophisticated, perhaps leaning towards a Gibbardian norm-expressivism or a Blackburnian quasi-realism. She knows the literature (Schroeder, Ridge, Gibbard). She needs a technical fix. Maybe she proposes a *structured attitude* or a *commitment-based* account.
      *   **Critic (C):** Let's call him "Caleb." He's not necessarily a realist; maybe he's an error theorist or just a formal semanticist skeptical of psychological reductionism. He focuses on logical space and combinatorial explosion.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Acknowledge the standard Frege-Geach solutions (validating MP) but pivot immediately to the negation issue.
      *   **The Setup:** Elena defines the three cases clearly using the user's example (Priya/Disclosure).
      *   **The Expressivist Move (Technical Fix):** Elena needs to propose something specific.
          *   *Idea 1:* Different attitudes for every proposition. (Too ad hoc).
          *   *Idea 2:* Gibbard's *hyperplans*. A state of mind is a complete plan.
          *   *Idea 3:* Distinguishing *rejection* from *absence of acceptance*.
          *   *Selection:* Let's go with a **commitment-based incompatibility model** (similar to Brandom or a refined Gibbard). Elena argues that attitudes are defined by their *inferential roles* and *incompatibilities*.
          *   *Specific Fix:* She proposes that "Believing O(D)" is being committed to a norm requiring D. "Believing ~O(D)" is being committed to the *permissibility* of ~D (which is distinct from just lacking the commitment to D). She uses the concept of *incompatibility frames*.
      *   **The Critic's Pushback:** Caleb attacks the distinction between (2) and (3).
          *   If "Not O(D)" is just "Permissible ~D," does Priya *have* to have an attitude on permissibility?
          *   If she has no view, is she in state (3)?
          *   If the semantics requires a positive attitude for (2), how do we model ignorance vs. denial?
      *   **The Escalation:** Caleb presses on the *compositionality*. If we need a unique attitude type for every negation depth, we lose the benefit of expressivism (parsimony).
      *   **The "Too High Cost" Argument:** Caleb argues that to save the distinction, Elena has to make the mental states so complex they look like beliefs anyway (cognitivism in disguise).
      *   **The Stand-off:** Elena admits the complexity but argues it's necessary for normativity. Caleb admits realism has its own problems but maintains expressivism hasn't solved *this* one cleanly.

  5.  **Refining the Technical Details:**
      *   Make sure the distinction between *contrary* (O~D), *contradictory* (~OD), and *external negation* (~B(OD)) is clear.
      *   Elena's fix: Use **Gibbard's Hyperplan** idea but refined. A hyperplan decides what to do in every situation.
          *   Case 1: Plan requires ~D.
          *   Case 2: Plan allows ~D (doesn't require D).
          *   Case 3: No plan regarding D.
      *   Critic's counter: How does the semantics of "Priya believes..." map to this? If "believes" just means "has a plan," then "Priya doesn't believe" means "Priya lacks a plan." But "Priya believes it's not obligatory" means "Priya has a plan that permits ~D."
      *   The Collapse Risk: If having a plan that permits ~D is just the absence of a plan requiring D, then (2) and (3) collapse. Elena must argue that *accepting permissibility* is a positive state, not just a lack of obligation.
      *   Critic's Killer Point: What if Priya hasn't thought about it? Then she lacks the plan requiring D (3) AND lacks the plan permitting ~D (2). So (2) implies a positive cognitive load that (3) does not. But expressivism wants to reduce truth-conditions to attitudes. If (2) requires a *second* attitude, aren't we just multiplying primitives?

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Tone Check:* Ensure it sounds like philosophers talking, not laypeople. Use terms like "scope distinction," "mental state types," "compositional semantics," "incompatibility."
      *   *Pacing:* Start slow, define the triad, introduce the fix, apply pressure, reach the impasse.
      *   *Ending:* Don't resolve it. Leave it as an open research problem, acknowledging the user's insight.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Elena uses Blackburn's tree structure.
      *   *Correction:* No, Gibbard's hyperplans handle the normativity better for this specific "obligation vs. permission" distinction. Let's use a hybrid of Gibbard and Schroeder's "Being For."
      *   *Check:* Did I address the belief ascription specifically? Yes, "Priya believes..." is the outer layer. The inner layer is the normative content. The expressivist must analyze the *ascription* of the attitude.
      *   *Refinement:* The tricky part is that expressivism usually analyzes *utterances* of normative claims. Analyzing *ascriptions of normative belief* is a step further (the "uncovered" Frege-Geach problem). I need to make sure Elena doesn't slip into analyzing "It is obligatory" but stays on "Priya believes it is obligatory."
      *   *Actually:* The user's prompt frames the problem *as* a belief ascription problem. "Priya believes P." The expressivist treats "Priya believes P" as "Priya is in attitude A." So the negation problem applies to the attribution of the attitude.
      *   *Wait, one nuance:* The user distinguishes:
          1.  Believes O(~D)
          2.  Believes ~O(D)
          3.  ~Believes O(D)
      *   This is effectively the problem of **negation within the content** vs **negation of the ascription**.
      *   Expressivist challenge: If "Believes O(D)" = "Has Attitude A," then:
          1.  Has Attitude A* (Contrary)
          2.  Has Attitude B (Negation of content)
          3.  Lacks Attitude A.
      *   The problem is defining Attitude B without just making it "Lacks Attitude A."

  8.  **Final Polish:** Check the philosophical accuracy. Ensure the distinction between *contraries* and *contradictories* is respected. Ensure the "cost" argument is about theoretical parsimony vs. explanatory power.

  *(Self-Correction on the "Belief" aspect)*: Wait, standard expressivism (Blackburn/Gibbard) tries to explain normative *judgments* as attitudes. When we say "Priya believes X is wrong," a cognitivist says Priya stands in a belief relation to a proposition. An expressivist says we are ascribing an attitude to Priya. The problem is that natural language allows us to negate the ascription in different ways. If the expressivist says "Believes O(D)" *just means* "Has Attitude A," then "Believes ~O(D)" must mean "Has Attitude Not-A." But what is "Not-A"? If it's just "Not having A," then (2) and (3) collapse. Elena needs to argue "Not-A" is a *sui generis* attitude (e.g., tolerance), not just absence. Caleb needs to argue this is ad hoc.

  Okay, ready to write.
answer: |-
  **Setting:** *A quiet corner of the university library, late evening. Two coffee cups sit between stacks of papers marked up with formal notation. **Elena** (Expressivist) is leaning forward, animated. **Caleb** (Critic) leans back, arms crossed, looking skeptical.*

  **Caleb:** So, you're conceding that the standard quasi-realist move validates Modus Ponens?

  **Elena:** Mostly. If we treat the logical constants as operating on the *types* of attitudes rather than propositional contents, we can preserve validity. If being "for" blaming for lying and being "for" blaming for not blaming for lying entails being "for" blaming for not lying, the inference holds. The logic works because the attitudes themselves have an inferential structure.

  **Caleb:** Right, Blackburn and Gibbard get you that far. But that's the easy win. That's consistency within the positive assertions. Your dissertation chapter is about the negation problem, specifically regarding belief ascriptions. You think that's where the body is buried.

  **Elena:** I do. Look at the Priya case. We have three distinct natural language claims:
  1.  Priya believes firms are obligated *not* to disclose. ($B_p O \neg D$)
  2.  Priya believes it is *not* the case that firms are obligated to disclose. ($B_p \neg O D$)
  3.  Priya *does not believe* firms are obligated to disclose. ($\neg B_p O D$)

  In a cognitivist framework, this is trivial. Propositions have contraries and contradictories, and belief is a relation that one can either stand in or not. But for me? "Believes $O D$" translates to "Priya holds attitude $A_{obl}$ toward $D$."

  **Caleb:** And there's the rub. If $A_{obl}$ is a primitive psychological state, what is the state for (2)? Is it the absence of $A_{obl}$?

  **Elena:** Exactly. If I say (2) is just "Priya lacks $A_{obl}$," then (2) collapses into (3). But they aren't the same. Priya could be a moral nihilist who thinks *nothing* is obligatory. She lacks $A_{obl}$ regarding disclosure. That fits (3). But she might also actively believe disclosure is *optional*. That's (2). She has a view on the deontic status, just not the one in (1).

  **Caleb:** So you need a positive attitude for (2). Let's call it $A_{perm}$ (acceptance of permissibility). So (1) is $A_{forbid}$, (2) is $A_{perm}$, and (3) is $\neg A_{forbid}$.

  **Elena:** Yes. And I can ground this technically. I'm proposing a **commitment-based incompatibility framework**. Think of it as a refinement of Gibbard's hyperplans. A normative belief isn't just a snapshot feeling; it's a commitment to a plan that rules out certain other plans.
  *   Case (1): Priya's plan *requires* $\neg D$. It is incompatible with any plan allowing $D$.
  *   Case (2): Priya's plan *allows* $\neg D$. It is incompatible with any plan *requiring* $D$.
  *   Case (3): Priya has no plan regarding $D$. No incompatibilities triggered.

  By defining the attitudes via their *incompatibility relations* rather than just their positive content, I can distinguish (2) from (3). (2) involves a commitment that rules out obligation; (3) involves no commitment at all.

  **Caleb:** Okay, that's the fix. But here is the cost. You've introduced $A_{perm}$ as a primitive attitude type distinct from the absence of $A_{obl}$. Now, apply this recursively. What if Priya believes it is *not* the case that disclosure is permissible?

  **Elena:** Then she holds $A_{forbid}$. We cycle back.

  **Caleb:** Do we? Or do we need a new attitude, $A_{not-perm}$? If "permissible" is defined as "not obligatory to not," and you're analyzing negation as distinct attitude types, you risk a proliferation of primitives. Every time we embed a negation inside the scope of "believes," you need a new mental state type to capture the specific logical role of that negation.

  **Elena:** Not necessarily. The incompatibility frame is finite. There are only so many ways plans can conflict. Require $D$, Require $\neg D$, Allow $D$, Allow $\neg D$. That's four states.

  **Caleb:** But "Allow $D$" isn't just one state, Elena. It's the absence of a requirement. If you reify it into a positive state $A_{perm}$ to save the distinction between (2) and (3), you're effectively cognitivism in drag.

  **Elena:** How so?

  **Caleb:** Because what makes $A_{perm}$ a *distinct* state from $\neg A_{obl}$? In your psychology, what is the phenomenological or functional difference between *actively accepting permissibility* and *just not having an obligation belief*?

  **Elena:** Functional role. If Priya accepts permissibility (2), she will assent to "Firms may withhold." If she merely lacks the obligation belief (3), she might remain silent or say "I haven't thought about it."

  **Caleb:** But that just pushes the problem to the ascription of the attitude. To say "Priya accepts permissibility" is to say "Priya is disposed to assent to 'may'." But "assent" is just another propositional attitude! You're analyzing normative belief in terms of dispositions to hold other beliefs. You haven't reduced the normative to the non-cognitive; you've just shifted the normative content into the disposition conditions.

  **Elena:** That's a standard objection, but I think it misses the point of the incompatibility frame. The reduction isn't to *dispositions to speak*, but to *plans for action*.
  *   (1) Priya plans to punish disclosure.
  *   (2) Priya plans *not* to punish disclosure (and plans to prevent others from punishing).
  *   (3) Priya has no plan regarding punishment.

  The distinction between (2) and (3) is real in the planning state. (2) involves a constraint on future deliberation ("Do not punish"); (3) leaves deliberation open.

  **Caleb:** Okay, let's test that. Suppose Priya is a busy CEO. She has never considered the ethics of conflict of interest disclosure. She has no plan to punish it, nor a plan to forbid punishment. She is in state (3).
  Now, suppose she reads a memo saying "Disclosure is not obligatory." She accepts this. She is now in state (2).
  According to your view, she has acquired a new *plan*. What is the content of that plan? "Do not punish"?

  **Elena:** Roughly, yes. A commitment to treating $\neg D$ as permissible.

  **Caleb:** But if she was already in (3), she *wasn't* planning to punish. She had no plan. So her behavioral dispositions regarding punishment haven't changed. In both (2) and (3), she doesn't punish. So where is the functional difference?

  **Elena:** Counterfactuals. In (2), if someone *suggests* punishing, she opposes it. In (3), she might be swayed.

  **Caleb:** Ah, so the difference lies in her attitude toward *other attitudes*. This is the Schroeder worry. To distinguish "Not O(D)" from "No view on O(D)," you have to analyze "Not O(D)" as having a higher-order attitude: "I am against having an attitude that requires D."

  **Elena:** I'm willing to bite that bullet. Gibbard does too. Normative judgments are judgments about what to do, which includes what to feel or plan.

  **Caleb:** But here is the collapse I see coming. If (2) requires a higher-order plan ("Plan to not plan for D"), then what is (3)? "No plan to plan for D"?
  If I say "Priya does not believe O(D)" [Case 3], I am saying she lacks the first-order plan.
  If I say "Priya believes ~O(D)" [Case 2], I am saying she has a second-order plan.
  But now, consider the negation of (2): "Priya does not believe ~O(D)."
  Does that mean she lacks the second-order plan? If so, she falls back to (3).
  But what if she believes O(D)? That's (1).
  So, on your view, the logical space of Priya's mind is partitioned into:
  1.  Plan for D.
  2.  Plan against Plan for D.
  3.  No Plan for D.

  But (2) and (3) are still dangerously close. If "Plan against Plan for D" is just a way of saying "I have settled the question against D," isn't that just a complex way of describing a belief state? You're trying to keep the semantics non-cognitive, but to handle the negation distinctions, you're building a cognitive architecture of plans that mirrors the propositional logic you're trying to avoid.

  **Elena:** It mirrors it because rationality mirrors it. If my plans are rational, they obey logical constraints. That's the quasi-realist explanation for why normative logic looks like propositional logic. I'm not avoiding the structure; I'm explaining its source. It comes from the consistency requirements on planning agents.

  **Caleb:** But at what cost to the *semantics*? You wanted to say "Believes O(D)" means "Has Plan P." Simple.
  Now, to save the three-way distinction, "Believes ~O(D)" means "Has Meta-Plan MP."
  And "Does Not Believe O(D)" means "Lacks Plan P."
  The problem is compositionality. If I say "Priya believes that it is not the case that it is not the case that O(D)," do we need a Meta-Meta-Plan?
  If every negation introduces a new layer of planning attitude, your ontology of mental states explodes. If you say no, and that double negation collapses back to Plan P, you have to explain *why* two meta-plans equal one base plan without appealing to truth conditions. You have to appeal to "plan consistency." But then you're defining the semantics via the rationality constraints, not the states themselves.

  **Elena:** I think that's a feature, not a bug. The meaning *is* the role in rational deliberation.
  But let's look at your collapse charge again. You said (2) and (3) might collapse behaviorally. I said counterfactuals distinguish them.
  You're worried that "Plan against Plan P" is just a cognitive belief in disguise.
  Why? Because it represents a state of affairs?

  **Caleb:** Because it functions exactly like a belief that $\neg P$. It has the same inferential role, the same negation behavior, the same embedding potential. If it walks like a belief and quacks like a belief, calling it a "plan to not plan" saves the expressivist label but abandons the expressivist insight. The insight was that normative states are *different in kind* from beliefs. If you have to make them structurally isomorphic to beliefs to solve the negation problem, have you won?

  **Elena:** They are different in kind because their *world-to-mind* direction of fit is different. A belief aims to match the world. A plan aims to change it. Even a meta-plan ("Don't plan to punish") is still a practical stance, not a theoretical one. Priya isn't describing her mind; she's governing it.

  **Caleb:** But when we ascribe it—"Priya believes disclosure is not obligatory"—we are treating it as a description of her mind.
  Here is the concrete case where I think your fix breaks.
  Consider **moral uncertainty**.
  Priya says: "I'm not sure if disclosure is obligatory, but I'm sure it's not forbidden."
  She is ruling out (1). She is ruling out "Obligated to ~D".
  She is remaining agnostic on "Obligated to D".
  So she is in a state where she accepts ~O(~D) but suspends judgment on O(D).
  On your incompatibility view:
  She has a plan against forbidding D. (Positive state).
  She lacks a plan requiring D. (Absence of state).
  This seems to work.
  But now, consider the sentence: "Priya believes it is not the case that disclosure is obligatory or forbidden."
  This is a belief in **optionality**. $Perm(D) \land Perm(\neg D)$.
  This requires *two* positive permissibility plans.
  Now compare: "Priya does not believe disclosure is obligatory."
  This is just $\neg B(O(D))$.
  In many contexts, asserting optionality is pragmatically distinct from asserting ignorance. But logically, if your semantics for "Not Obligatory" is just "Has Permissibility Plan," then "Priya believes ~O(D)" attributes a Permissibility Plan.
  If Priya is truly ignorant, she has no plan.
  So, "Priya believes ~O(D)" is false for the ignorant Priya.
  But in natural language, if Priya is ignorant, can we say "It is not the case that Priya believes O(D)"? Yes.
  Can we say "Priya believes it is not the case that O(D)"? No.
  So your semantics tracks the distinction.
  *However*, the cost is that you cannot analyze "believes ~O(D)" as simply the negation of "believes O(D)" at the level of the attitude type. You have to treat them as *contraries* in the mental space, not contradictories.
  $A_{obl}$ and $A_{perm}$ are contraries (you can't have both).
  But logical negation requires contradictories.
  To get contradictories, you need the external negation $\neg B_p$.
  So you are forced to admit that the logical negation of "Priya believes O(D)" is *only* captured by "Priya does not believe O(D)," not by "Priya believes ~O(D)."
  This means the expressivist semantics cannot validate the equivalence between $\neg B(P)$ and $B(\neg P)$ in all cases.
  And that means you have to tell the logician that natural language is misleading. "Priya believes it is not obligatory" does *not* mean the logical negation of the belief in obligation. It means a *different positive belief*.

  **Elena:** I can live with that. That's actually standard deontic logic. $O(D)$ and $\neg O(D)$ are not contradictories in the sense that one must be true; both can be false if the system is incomplete. Wait, no. In standard deontic logic, $\neg O(D)$ is equivalent to $P(\neg D)$.
  The issue is whether the *psychological state* of accepting $\neg O(D)$ is the negation of the state of accepting $O(D)$.
  I'm arguing it isn't. It's a distinct state.
  So, if the critic says, "But logic requires them to be contradictories," I say, "Logic operates on the *contents*, not the *attitudes*."
  The content $\neg O(D)$ is the contradictory of $O(D)$.
  The attitude of *believing* $\neg O(D)$ is not the contradictory of *believing* $O(D)$. One can fail to believe both.
  So my semantics preserves the logic of the content by mapping contents to distinct, incompatible attitude types.

  **Caleb:** But that requires the content to exist independently of the attitude to be mapped. You're smuggling in propositions.
  If "O(D)" is just "Having Attitude A," then what is "$\neg O(D)$"?
  If it's "Having Attitude B," then where is the negation? You've just labeled B "Not-A."
  If the semantics of "$\neg$" is "switch from Attitude A to Attitude B," then you need a rule for every operator.
  What about "Priya believes it is unlikely that O(D)"?
  Do we need an Attitude C?
  At some point, Elena, the list of primitive attitudes looks exactly like a list of propositional attitudes. "Believes P," "Believes ~P," "Believes possibly P."
  If you have to posit a unique primitive mental state for every logical operation on the content to preserve the distinctions, you haven't explained the logic in terms of attitudes. You've just decorated the logic with attitude labels.

  **Elena:** That's the stand-off, isn't it?
  If I keep the primitives few, I risk collapsing (2) and (3).
  If I multiply the primitives to match the logical distinctions, I risk losing the reductive simplicity that makes expressivism attractive.
  My claim is that the incompatibility frame keeps the primitives finite. Plans can only conflict in so many ways.
  Your claim is that "conflict" is doing too much work, and effectively reintroduces the propositional structure I'm trying to bypass.

  **Caleb:** Precisely. You've saved the distinctions, I'll grant you that. You can tell Priya's state (1) from (2) from (3).
  But you've done it by making the mental states so structurally rich that they mirror the very propositional logic you claimed to be replacing. The "wrinkle" you found isn't just a negation problem; it's a problem of **isomorphism**. To solve the semantic problem, your psychology must become isomorphic to the realist's ontology.
  And if the psychology is isomorphic to the ontology, what work is "expressivism" actually doing?

  **Elena:** It explains the *motivation*. Realism can't explain why judging "O(D)" motivates action. My view can. Even if the structure is complex, the *nature* of the state is practical.
  So, I concede the structural cost. I pay in parsimony to save the practical nature of normativity.
  You concede that realism has the structural ease but fails the motivational explanation.

  **Caleb:** I don't concede that. I'm an error theorist, remember? I think there are no normative truths *and* I don't think your plans solve the motivation problem without secretly relying on desires that look like beliefs.
  But for the sake of your chapter... yes. We're at a stand-off. You can distinguish the three readings, but only by making the expressivist semantics heavy enough that it groans under the weight of the distinctions it's trying to preserve.

  **Elena:** And you can't offer a better account of the distinction without admitting that normative discourse functions *as if* there are propositions, which is all the quasi-realist needs to claim victory.

  **Caleb:** Touché. Same time next week?

  **Elena:** Same time. I need to think about whether "incompatibility" can be defined without circularity.

  **Caleb:** And I need to think about whether "propositions" can be defined without platonia.

  *They both gather their papers, the problem remaining stubbornly unresolved between them.*
