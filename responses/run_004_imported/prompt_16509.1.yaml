answer: |-
  The brochure for Oakhaven Memorial Gardens sat on the coffee table, glossy and heavy, next to Elias's oxygen concentrator. The hum of the machine was the only sound in the living room, a steady mechanical breath that contradicted the shallow rise of Elias's chest.

  Maya tapped the photo of the bronze casket. "They have a payment plan for the mausoleum, Dad. Sealed. Climate-controlled. It's what Mom would have wanted."

  Elias didn't look at the brochure. He was watching a fly buzz against the windowpane, struggling against the glass to reach the sunlight on the other side. "Mom wanted a lot of things," he said, his voice dry as leaves. "She wanted to keep things tidy."

  "It's about respect," Maya said, feeling the familiar tightness in her throat. She was forty-five, too old to be arguing about dead bodies, yet here she was. "You can't just… disappear."

  "Disappear?" Elias finally turned his head. His eyes were clouded, but calm. "I'm not going anywhere. I'm just changing addresses."

  "The mausoleum. It preserves."

  "Preserves what?" Elias chuckled, a wheezing sound. "Meat? Bone? Maya, look at that fly. It thinks the glass is the barrier. It doesn't know the glass is the only thing holding the outside out. When I go, open the window."

  Maya looked away. She couldn't handle this detachment. To her, his body was the vessel of her childhood, the hands that had taught her to ride a bike, the shoulders she'd cried on when her marriage failed. To him, it seemed to be merely temporary luggage. She had spent the last week calling funeral homes, comparing linings, worrying about the viewing. She needed the ritual. She needed the solid box to push against the void.

  "I found a place that does the natural burial," she said, testing him. "No embalming. Just a shroud. In the woods."

  "Better," Elias said. "But still a box. Still a marker."

  "People need to visit, Dad. They need a place to grieve."

  "Grief is in here," he tapped his temple, then let his hand drop. "Not out there in the dirt. When I was younger, I found a deer out on the ridge. Half-eaten. Bones bleaching in the sun."

  Maya grimaced. "Why are you telling me this?"

  "It looked peaceful," he said. "No more running. No more worrying about wolves or winter or hunters. Just… rest. I remember thinking, why do we fight so hard to keep the breath in? The trouble of living is exhausting, Maya. The bills, the cold, the hunger, the people telling you what to do. Even the love of it. It's heavy."

  He closed his eyes. "That deer didn't want to get up. If I could have asked it, it would have told me to leave it be."

  "That's morbid," Maya snapped, standing up. "You're talking about yourself like you're already gone. I'm still here. I need you to be here."

  "I am here. Until I'm not." He opened his eyes again. "When the time comes, don't seal me up. Don't pump me full of chemicals so I look like a wax figure for three days. It's undignified."

  "It's for us," she insisted, her voice cracking. "It's not for you. You won't care. I will."

  "That's the problem," Elias whispered. "You think you own the leftovers."

  He drifted off to sleep then, the concentrator humming its lonely rhythm. Maya walked to the window. The fly was still there, buzzing, frantic. She wanted to open it, to let the insect out, but she was afraid of what else might come in. She was afraid of the draft. She was afraid of the end.

  Two days later, Elias stopped breathing.

  The silence in the room was louder than the machine had ever been. Maya stood over him. He looked small. The struggle was over, and in his stillness, he looked exactly like he had sounded: relieved.

  The funeral director arrived within the hour. He was a man in a sharp suit who spoke in hushed, reverent tones about "protecting the remains" and "creating a lasting memory." He laid out a leather binder of options. Vault liners. Bronze handles. Perpetual care fees.

  Maya sat in the kitchen, the binder open. She looked out the back window. The garden was overgrown. Roses choked the trellis. Beetles crawled over a fallen apple, dismantling it piece by piece.

  She thought of her father's words about the deer. *No more running.*

  She thought of her own need for the mausoleum. She wanted a place to go where he would be safe, where he wouldn't be eaten, where he wouldn't rot. She wanted to protect him from the earth, as if the earth were an enemy. But he had come from it.

  The director cleared his throat. "Mrs. Gable, we need to decide on the embalming fluid tier by noon if we want the viewing on Friday."

  Maya looked at the binder. She looked at the window. She imagined her father in that sealed box, climate-controlled, untouched, alone in the dark forever. Then she imagined him in the soil, part of the root system, feeding the roses she hadn't watered in months.

  It felt violent. It felt wrong. It felt like loving him too much to let him go.

  "No viewing," she said.

  The director blinked. "I'm sorry?"

  "No viewing. No embalming." She pushed the binder away. "He wanted a green burial. Just a shroud. In the woods."

  "That's… unconventional," the director said, his tone shifting from reverent to wary. "Most families find it difficult. Without preservation, the… process… is accelerated. There are insects. There is decay. It can be traumatic for the mourners to know."

  Maya thought of the crows and the kites. The insects below. What difference did it make who ate the shell? The tenant had left the building.

  "I know," she said. Her hands were shaking. She wasn't convinced. Part of her screamed that this was neglect, that she was throwing him away like trash. She wanted the stone. She wanted the permanence. She wanted to defy the rot.

  But she remembered the fly at the window.

  "Do it," she said.

  After the director left, Maya walked to the living room window. She opened it. The air was cool, smelling of damp earth and pine. The fly was gone.

  She stood there for a long time, waiting for the peace her father had promised her she would find, waiting to feel the relief of the open sky. It didn't come immediately. The grief was still a heavy stone in her chest, and the resistance lingered—a stubborn, human desire to hold on to what slips through your fingers.

  But she left the window open. She let the cold air come in. She watched the garden, where the beetles were still working on the apple, turning it back into the ground, one piece at a time.
