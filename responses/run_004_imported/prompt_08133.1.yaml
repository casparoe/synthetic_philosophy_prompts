answer: |-
  First, to answer your most pressing question: **No, you have not lost the plot.**

  What you are describing is not a personal glitch; it is one of the oldest, deepest, and most serious problems in philosophy. You are grappling with the transition from **theistic morality** (goodness is defined and tracked by a divine authority) to **secular morality** (goodness must be grounded in something else).

  The specific anxiety you feel—that without a "scorekeeper," morality is just a preference—is a recognized philosophical position called **Moral Anti-Realism**. The counter-position, which you are desperately hoping is true, is **Moral Realism**.

  Here is a breakdown of why your reaction is normal, why your current search method might be a dead end, and where smart people have actually found traction on this problem.

  ### 1. Is this a serious worry?
  Absolutely. When Friedrich Nietzsche declared "God is dead," he wasn't celebrating; he was warning. He predicted that without a divine framework, Western civilization would face a crisis of **nihilism**—the belief that nothing matters. He worried that without a cosmic scorekeeper, humanity would struggle to find a reason to be "good" that felt weighty enough to resist selfishness or cruelty.

  You are living out Nietzsche's warning in real-time. You are an engineer; you understand systems. In a religious system, morality is an **external constraint** (like the laws of physics or a building code). In a secular system, morality risks looking like an **internal preference** (like preferring vanilla over chocolate).

  Smart people have taken this very seriously.
  *   **Immanuel Kant** tried to ground morality in pure reason (the Categorical Imperative) so it wouldn't rely on God.
  *   **Thomas Nagel**, a prominent contemporary atheist philosopher, wrote *Mind and Cosmos*, arguing that a purely materialist view of the universe cannot account for consciousness or value. He suggests the universe might have a "teleological" (purpose-driven) nature, even without a personal God.
  *   **Sam Harris** (controversial but relevant) attempts to ground morality in the "well-being of conscious creatures," arguing that morality *is* scientific, not just preference.

  So, you are in good company. This is not a sign of instability; it is a sign of intellectual honesty.

  ### 2. Is your current search leading anywhere?
  Here is the hard truth: **Reading about mediums and near-death experiences (NDEs) is unlikely to give you what you want.**

  You are looking for *ontological* proof (proof about the nature of reality and value) using *paranormal* anecdotes. Even if NDEs were proven to be real evidence of an afterlife, that wouldn't necessarily prove that morality is objective. It would just prove that consciousness survives death. A universe could have ghosts and still be morally indifferent.

  Furthermore, as an engineer, you likely value reproducibility and rigor. The fields you are currently reading (mediumship, NDEs) generally lack the rigorous data you're used to. You are essentially trying to solve a software architecture problem by looking for ghosts in the machine. It feels satisfying because it hints at a "scorekeeper," but it rarely provides the logical foundation you're craving.

  ### 3. Where does the search actually lead?
  If you want to find "teeth" for morality without religion, you have to shift your search from **parapsychology** to **meta-ethics** and **evolutionary psychology**. Here are three frameworks that smart secular people use to keep morality "real":

  **A. Morality as Social Technology (The Engineer's View)**
  Morality isn't a law written in the stars; it's a technology we invented to solve coordination problems. Just as "bridges shouldn't collapse" is an objective truth based on physics and human need, "societies shouldn't murder randomly" is an objective truth based on human flourishing.
  *   **The Teeth:** If you violate moral norms, you degrade the system you rely on. The "scorekeeper" is reality itself. If everyone lies, trust collapses, and you suffer. The consequence is immanent, not transcendent.

  **B. The Argument from Suffering**
  Some philosophers argue that pain is the one objective "bad." You don't need a god to know that torture is wrong; you only need to understand what suffering is. If you accept that suffering is inherently undesirable, you have an objective baseline for morality.
  *   **The Teeth:** Reducing suffering is a tangible, measurable goal. You aren't pleasing a deity; you are repairing the world.

  **C. Existential Responsibility (The Harder Path)**
  Existentialists like Sartre argued that the lack of a scorekeeper makes morality *heavier*, not lighter. If there is no God to forgive you or judge you, *you* are the sole author of your actions. You are creating the definition of "good" every time you act.
  *   **The Teeth:** The weight comes from total ownership. You are good not because you are following rules, but because you are choosing to be good in a universe that doesn't care. That is arguably more courageous than following a divine script.

  ### 4. A Recommendation for Your Saturdays
  You don't need to stop searching, but you might want to change the source material. You are hungry for meaning, but you are feeding yourself speculation.

  1.  **Swap the Genre:** Instead of books on NDEs or mediums, try reading **Meta-Ethics**. Look into "Moral Realism" vs. "Moral Anti-Realism."
  2.  **Specific Reads:**
      *   *The Moral Landscape* by Sam Harris (attempts to science-ify morality).
      *   *Mind and Cosmos* by Thomas Nagel (argues materialism is incomplete, validates your intuition without requiring ghosts).
      *   *Existentialism is a Humanism* by Jean-Paul Sartre (short, accessible, addresses the "no God" anxiety directly).
  3.  **Reframe the "Scorekeeper":** Try to view the "score" not as points tallied for an afterlife, but as **causal impact**. Every action you take ripples through the network of human consciousness. That is real, measurable, and permanent, even if the universe doesn't "write it down."

  ### Summary
  You are not coping badly; you are grieving the loss of an objective framework. That is a rational response to deconversion. But looking for ghosts to validate your ethics is a category error.

  The "teeth" you are looking for are real, but they aren't found in the afterlife. They are found in the fragility of human well-being and the reality of suffering. Morality doesn't need the universe to keep score; it needs *us* to keep score, because we are the only ones who can feel the result.

  Your partner thinks you've lost the plot because you're looking for evidence in the wrong place. You haven't lost the plot; you're just reading the wrong manual. Switch from searching for *proof of an observer* to searching for *foundations of value*, and you'll find plenty of serious company.
