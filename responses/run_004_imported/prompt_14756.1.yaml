answer: |-
  The ballroom lights were half-dimmed, the hum of the HVAC system the only remaining music. Most of the chairs were stacked upside down on the tables. Elena leaned against the podium, swirling the dregs of a warm pinot noir. Marcus sat on the edge of the stage, loosening his tie, looking like he'd been waiting for her to corner him since the morning panel.

  "You shifted the architecture," Elena said. "In the Q&A, you stopped talking about Black and the neuroscientist. You started talking about walls."

  Marcus rubbed his eyes. "Blockage cases. It's cleaner. It removes the surveillance element. No prior signs, no monitoring devices. Just a causal blockage that makes it impossible for Jones to choose otherwise, without actually intervening unless he tries."

  "It's the same trick," Elena said, taking a sip. "You're just hiding the wires. In the old Frankfurt cases, the dilemma was about the sign. Either the sign was determined, which begged the question against the libertarian, or it wasn't, which left a flicker of freedom. Now you've got a blockage. Same dilemma applies. Is the blockage deterministic?"

  "It doesn't matter," Marcus said, though he sat up straighter. "The point of the blockage is to show that the *actual sequence* is what grounds responsibility. Jones decides to shoot the senator. He reasons through it. He forms the intention. He pulls the trigger. The fact that there is a wall behind him preventing him from choosing peace is irrelevant to the quality of the actual sequence."

  "Irrelevant? It's metaphysically load-bearing, Marcus. If that wall isn't there, Jones could have done otherwise. If it is there, he can't. You're saying his responsibility status is identical in both worlds?"

  "Yes. Because in both worlds, the actual sequence—the reasoning, the volition—is identical. That's guidance control. He owns the action."

  Elena set her glass down on the podium with a sharp clink. "Okay, let's look at the wall. You say it's a causal blockage. Let's say it's a neural inhibitor. If that inhibitor is triggered by the laws of nature and the past to be there *necessarily*, then you've assumed determinism. You've assumed Jones couldn't have done otherwise from the beginning of time. You haven't disproven PAP; you've just assumed determinism is true and then told us PAP doesn't matter."

  Marcus sighed. "I'm not assuming determinism. I'm constructing a counterexample to PAP. I'm saying: imagine a world where Jones is not determined, *but* there is a blockage. Suppose the universe is indeterministic. Jones's deliberation is open. But, coincidentally, there is a device that blocks all other options. He still chooses on his own."

  "Coincidentally?" Elena pressed. "If the universe is indeterministic, then the blockage itself must be indeterministic. There's a chance the blockage fails. If there's a chance the blockage fails, then there is a possible world where Jones chooses otherwise because the wall crumbles. That's your flicker. It's not a robust flicker, I'll grant you. It's not 'Jones chooses peace.' It's 'Jones chooses violence, but the wall wasn't there.' But it's an alternative possibility. PAP survives."

  Marcus stood up and began to pace the small strip of cleared carpet. "That's the strategy I expected. You're grasping for *any* alternative possibility, no matter how irrelevant. You're saying Jones is responsible only because there was a 0.0001% chance the blockage malfunctioned?"

  "I'm saying if there's *no* chance, you're a determinist. And if you're a determinist, don't tell me you're refuting PAP with a neutral case. You're just asserting compatibilism."

  "Okay, fine." Marcus stopped pacing. "Let's grant the flicker. Let's say in your blockage case, there is a tiny probability the inhibitor fails. So, technically, Jones *could* have done otherwise. Why does that matter? Does that tiny probability add any moral weight? If the blockage holds, and Jones acts, does the mere metaphysical possibility of it failing make him *more* responsible?"

  "It makes him an agent rather than a node," Elena said. "If the blockage is absolute, Jones is a train on a track. The train doesn't care that it's on a track, but the train isn't responsible for going to Chicago. If there's a switch, even a broken one, the train is part of a system where 'Chicago' was a contingent outcome. If there is no switch, 'Chicago' was inevitable. You're asking me to ignore the difference between inevitability and contingency."

  "But Jones doesn't know about the blockage," Marcus countered. "It doesn't figure in his deliberation. He thinks he's free. He weighs the reasons. He acts. If you say he's not responsible because of a background condition he's unaware of, you're making responsibility depend on luck. If the blockage vanishes five minutes later, was he responsible five minutes ago? Did his responsibility status fluctuate with the integrity of the wall?"

  "His status as an *open agent* fluctuated," Elena said. "Look, I know the move you're making. You want to say the actual sequence is insulated from the alternative sequences. But the actual sequence is defined by what it excludes. To choose *this* is to not choose *that*. If *that* is not even a metaphysical possibility, then *this* isn't a choice. It's an unfolding."

  Marcus walked back to the stage and picked up his own water bottle. He looked tired. "You're relying on the intuition that leeway is the source of control. I'm telling you leeway is a side effect. The source of control is the mechanism. Is the mechanism responsive to reasons? If Jones would have chosen peace *if* there had been a reason to—say, if the senator had surrendered—then Jones has guidance control. The blockage prevents him from *doing* otherwise, but it doesn't prevent him from being *sensitive* to reasons."

  "But the blockage prevents him from *acting* on that sensitivity if the reason appeared!" Elena snapped. "If the senator surrendered, and Jones tried to spare him, the blockage would force the shot. So his sensitivity is fake. It's a counterfactual sensitivity that can't be actualized."

  "No," Marcus said. "In the actual sequence, the senator doesn't surrender. Jones acts on his actual reasons. The fact that he *would* have been forced otherwise is a fact about other possible worlds. Why should facts about other possible worlds dictate responsibility in this one?"

  "Because this one is connected to them!" Elena pushed off the podium. "That's what modality is. To say 'Jones is responsible' is to say 'Jones could have acted differently.' If you sever that link, you're changing the definition of responsibility. You're talking about *attributability*—whether the action belongs to him. But responsibility implies blame. And blame implies he deserved to be blamed because he could have avoided it."

  "I deny that," Marcus said softly. "I think blame is about the quality of the will. If Jones's will is corrupt, he's blameworthy. The fact that a neuroscientist or a causal wall ensured he couldn't manifest a good will... that's tragic. But it doesn't exculpate him."

  "It does if the wall is what made the will corrupt," Elena said. "If the blockage is part of the causal chain that produced his decision, you've smuggled in determinism again. If the blockage is *not* part of the causal chain—if it's just sitting there like a fence—then we're back to the flicker. Because if it's just sitting there in an indeterministic world, there's a chance the fence dissolves."

  Marcus laughed, a short, dry sound. "You're relentless on the flicker. You really think the 'fence dissolving' possibility saves the libertarian?"

  "It saves the principle," Elena said. "It keeps the door open. Your blockage cases try to slam the door shut. You want to say: 'Look, no door. Never was a door. Yet he's still guilty.' I'm saying if there was never a door, he's not guilty. He's just the guy who happened to be in the room when the fire started."

  "Imagine a prisoner," Marcus said. "A prisoner in a cell. The door is locked. He decides to smash the window. He smashes it. He's responsible for breaking the window. The fact that he couldn't leave the cell doesn't mean he didn't choose to break the glass."

  "But he couldn't have *not* broken the glass," Elena said. "In your case, the blockage ensures the specific action. It's not just that he can't leave the cell. It's that the cell forces him to smash the glass."

  " No, the cell doesn't force him. Jones does." Marcus tapped his chest. "The blockage is preemptive. It's like a backup. It sits there. It only activates if Jones tries to do otherwise. Since he doesn't try, it does nothing. It's causally inert in the actual sequence."

  "If it's causally inert, why is it there?" Elena asked. "If it does nothing, it's not a blockage. If it *is* a blockage, it's doing the work of ruling out alternatives. And if it rules out alternatives deterministically, you've assumed determinism. If you rule them out indeterministically, I have my flicker."

  Marcus was quiet for a moment. He looked at the stacked chairs, the darkened exits. "Maybe," he said. "Maybe you keep the flicker. Maybe there's always a tiny probability the blockage fails. I'm willing to concede that. I don't need the blockage to be absolute. I just need it to be sufficient to make the alternative *highly* improbable, while the actual sequence remains reasons-responsive."

  Elena shook her head. "Then you've conceded PAP. Because if there's a probability, there's a possible world where he does otherwise. PAP doesn't say 'you need robust alternative possibilities.' It just says 'you need alternative possibilities.' A flicker is a possibility."

  "It's not the *right kind* of possibility," Marcus insisted. "It's not a possibility grounded in his agency. It's a possibility grounded in equipment failure. That's not freedom."

  "It's enough to make the statement 'Jones could not have done otherwise' false," Elena said. "And that's all PAP requires to stand. You haven't killed the principle, Marcus. You've just made the alternative possibilities so tiny, so irrelevant, that you hope we won't notice them. But they're there. And as long as they're there, the intuition that 'ought implies can' survives."

  Marcus picked up his bag. He looked resigned, but not defeated. "So we're back to the size of the flicker. You think a spark is a fire. I think it's just heat noise."

  "I think without the spark, there's no fire at all," Elena said. "And you're trying to cook dinner in the dark."

  "Maybe," Marcus said, heading for the door. "But the food still tastes the same."

  He held the door open. The hallway was bright, humming with a different frequency. Elena stayed in the dim ballroom for a moment longer, looking at the empty stage, before following him out.
