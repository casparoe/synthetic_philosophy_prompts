      *   **Section 4: Implications for Hard Choices:**
          *   If Vagueness: We wait for precision or flip a coin (epistemic limitation).
          *   If Parity: We exercise "normative power." Will-based reasons. Commitment creates reasons.
          *   Application: Cause prioritization (e.g., AI safety vs. Global Health). Not just measurement error, but distinct evaluative frameworks.
