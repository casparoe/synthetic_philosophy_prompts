answer: |-
  # The Fourth Relation: Parity, Vagueness, and the Structure of Hard Choices

  In the discourse of effective altruism and cause prioritization, agents are frequently asked to perform comparisons that strain the limits of intuitive valuation. Is preventing a human death "better than" preventing a million chicken-life-years of suffering? Is a career in AI safety "better than" a career in global health policy? Standard decision theory assumes a background of comparability: for any two options $A$ and $B$, relative to a set of values, $A$ is either better than $B$, worse than $B$, or exactly as good as $B$. This is the Trichotomy Thesis.

  However, when values are heterogeneous—when "moral weight" spans different species or "impact" spans different centuries—the Trichotomy Thesis often feels descriptively inadequate. The options do not seem equal, yet neither seems superior. Ruth Chang has formalized this intuition, arguing that the Trichotomy Thesis is false and that a fourth relation, "parity," obtains between such options. Her primary rival is the vagueness account, championed by John Broome, which suggests that "better than" is simply a vague predicate and that these cases represent borderline indeterminacy rather than a distinct relation.

  This essay adjudicates between Chang's parity and Broome's vagueness. By reconstructing the small-improvement argument and analyzing the normative implications of each view, I will argue that Chang's parity thesis is superior. Vagueness fails to capture the phenomenology and normative structure of hard choices. Accepting parity does not merely solve a logical puzzle; it fundamentally alters our understanding of rational agency, suggesting that in cases of parity, reason runs out not because of epistemic limitation, but because the will must create the reason.

  ### The Small-Improvement Argument

  Chang's case for parity rests on the "small-improvement argument," a reductio ad absurdum of the Trichotomy Thesis. To reconstruct it, let us consider two options, $A$ and $B$ (e.g., two job candidates, or two charitable causes), which are comparable via a "covering value" (e.g., overall choiceworthiness), but where it seems intuitively incorrect to say one is better than the other.

  The argument proceeds as follows:
  1.  **Trichotomy Assumption:** For any $A$ and $B$, either $A > B$, $B > A$, or $A = B$.
  2.  **Phenomenological Premise:** In hard choice cases, it is false that $A > B$ and false that $B > A$.
  3.  **The Equality Test:** If Trichotomy holds, and neither is better, they must be equal ($A = B$).
  4.  **The Small Improvement:** Consider $A+$, which is $A$ plus a marginal improvement (e.g., Candidate A is given a slight salary bump, or Cause A saves one additional life).
  5.  **Monotonicity of Equality:** If $A = B$, then $A+ > B$. (If two things are exactly equal, improving one must make it strictly better).
  6.  **Phenomenological Counter-Premise:** In hard choice cases, $A+$ does not seem strictly better than $B$. The improvement is too small to tip the scale between two fundamentally different kinds of value.
  7.  **Conclusion:** Since $A = B$ implies $A+ > B$, and $A+ > B$ is false, then $A = B$ is false. Since neither is better than the other, and they are not equal, the Trichotomy Thesis is false.

  Chang posits "parity" as the positive account of this fourth relation. $A$ and $B$ are on a par if they are comparable, neither is better than the other, and they are not equal. Parity allows for comparability without linear ranking.

  ### The Vagueness Objection

  John Broome challenges the necessity of this ontological innovation. He argues that Chang's argument relies on a misinterpretation of the logic of vague predicates. On Broome's view, "better than" is like "tall." There are clear cases (NBA players are tall), clear non-cases (jockeys are not), and borderline cases.

  Broome accepts the phenomenological premises—that we hesitate to say $A > B$ or $A = B$—but denies this requires a fourth relation. Instead, he argues that $A$ and $B$ fall within the "penumbra" of the predicate "better than." In this zone, it is indeterminate whether $A > B$, indeterminate whether $B > A$, and indeterminate whether $A = B$.

  Regarding the small-improvement argument, Broome invokes the logic of the Sorites paradox. If $A$ and $B$ are borderline cases of "better," then $A+$ (a small improvement on $A$) may also be a borderline case relative to $B$. The move from $A$ to $A+$ does not necessarily cross the threshold from "indeterminately equal" to "determinately better." Thus, the failure of $A+$ to be strictly better than $B$ is consistent with vagueness. We do not need parity; we simply need to acknowledge that our comparative concepts have fuzzy boundaries. Broome's account is theoretically parsimonious: it preserves classical logic and the Trichotomy Thesis by treating the failure of ranking as semantic indeterminacy rather than a metaphysical feature of value.

  ### Adjudication: Why Parity Prevails

  While Broome's vagueness account is parsimonious, it is ultimately reductionist in a way that obscures the normative reality of hard choices. Chang's parity thesis should be preferred for two primary reasons: it better explains the phenomenology of deliberation, and it preserves the distinctness of the values at stake in a way vagueness cannot.

  **1. The Phenomenology of Ignorance vs. Structural Difference**
  The vagueness account implies an epistemic deficit. If $A$ and $B$ are merely borderline cases, it suggests that there *is* a fact of the matter regarding their ranking, but our concept "better than" is too coarse to capture it, or our information is insufficient. It treats the hard choice as a measurement problem.

  However, the phenomenology of hard choices does not feel like ignorance. When choosing between a career in law and a career in music, the difficulty does not stem from a lack of data about salary or enjoyment. It stems from the fact that the values realized (justice/security vs. creativity/expression) are qualitatively distinct. Parity captures this structural difference. It asserts that the options are *determinately* unrankable, not *indeterminately* rankable. Chang's view respects the agent's intuition that no amount of further empirical investigation will resolve the choice, because the resolution does not lie in the world, but in the relation between the values.

  **2. The Normative Significance of the Small Improvement**
  Broome's reliance on the Sorites logic weakens under scrutiny regarding *significant* improvements. In a vagueness model, if we improve $A$ enough (to $A+++$), it must eventually become determinately better than $B$. Chang agrees with this. However, the parity model explains *why* the small improvement fails while the large one succeeds in a way vagueness does not.

  Under parity, $A$ and $B$ are in the same "neighborhood" of value, but they differ in kind. A small improvement to $A$ keeps it in the same neighborhood; it does not change the kind of value $A$ represents. Therefore, $A+$ remains on a par with $B$. A massive improvement might shift $A$ into a higher neighborhood of value, breaking the parity. Vagueness treats the transition from "not better" to "better" as a sliding scale of magnitude. Parity treats it as a threshold of normative significance. This distinction matters: it suggests that value has a qualitative topology, not just a quantitative continuum. To reduce this to vagueness is to flatten the landscape of value, losing the information that $A$ and $B$ are competing *different* things, not just imprecisely measured *same* things.

  Therefore, parity is not merely a semantic stopgap; it is a more robust metaphysical account of value pluralism. It acknowledges that the Trichotomy Thesis fails not because our language is fuzzy, but because the normative reality is not always linear.

  ### Implications for Hard Choices and Agency

  Accepting Chang's verdict over Broome's has profound implications for how we approach cause prioritization and moral decision-making. The distinction turns on the source of normativity in the final choice.

  If Broome is right and the relation is merely vague, then rational choice is suspended until precision is achieved. The agent is in a state of epistemic limbo. To choose $A$ over $B$ in a borderline case is arguably irrational, or at best arational, because there is (in principle) a fact of the matter one is ignoring. The decision bottoms out in a kind of error or arbitrary tie-breaking.

  If Chang is right and the relation is parity, the implications are more empowering. Parity implies that reason *runs out*. There is no fact of the matter waiting to be discovered. Consequently, the agent must exercise what Chang calls "normative power." In cases of parity, the will itself can generate reasons. By committing to $A$ over $B$, the agent makes $A$ better than $B$ *for them*, through the act of commitment.

  This is crucial for the context of cross-species moral weight or long-termist cause prioritization. If we assume vagueness, we are trapped in an endless quest for the "true" exchange rate between human welfare and animal welfare, assuming such a linear rate exists but is hard to measure. This leads to paralysis or false precision.

  If we assume parity, we acknowledge that human welfare and animal welfare may be on a par. They are comparable (we can choose between helping them), but not linearly rankable without remainder. This licenses the agent to make a commitment based on "will-based reasons"—personal fit, passion, or specific moral projects—without claiming that their chosen cause is objectively superior in a trichotomous sense. It transforms the decision from a calculation error into an exercise of agency.

  ### Conclusion

  John Broome's vagueness account offers a logically conservative way to save the Trichotomy Thesis, but it does so at the cost of misdescribing the normative landscape. It reduces qualitative distinctness to semantic fuzziness and treats hard choices as epistemic failures. Ruth Chang's parity thesis, supported by the small-improvement argument, provides a more rigorous treatment. It acknowledges that value can be comparable without being rankable, preserving the integrity of distinct values while allowing for choice.

  The verdict is clear: "On a par" names a real, sui generis value relation. This conclusion rescues agents from the anxiety of false precision. It suggests that when we face hard choices between incommensurable goods—whether between careers, causes, or species—we are not failing to see the truth. We are standing at the limit of reason, where the only rationally defensible move is to commit, thereby creating the very reasons that justify the choice. In the end, parity does not hinder decision-making; it dignifies it.
