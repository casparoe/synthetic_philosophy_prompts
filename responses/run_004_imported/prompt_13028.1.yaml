  2.  **Deconstruct the "Experience Machine" Paradox:**
      *   *The Paradox:* She builds machines that simulate reality but refuses to live in one.
      *   *The Resolution:* The value of the simulation isn't to *replace* reality, but to *enhance* our appreciation of it, or to allow us to safely touch things we otherwise couldn't, before returning to the real world. Her refusal to plug in permanently validates the worth of the real experiences she helps people simulate. It shows integrity. She values *choice* and *truth*.
      *   *The Metaphor:* The simulator is a visit, not a home.

