answer: |-
  Your friend is not contradicting himself. His position is logically consistent, and it actually corresponds to a well-known school of thought in the history of ethics known as the **Indirect Duty View**.

  While many people today find this view unconvincing or unpalatable, it does not contain an internal contradiction. Here is a breakdown of the logic that holds his views together, along with the philosophical context behind it.

  ### 1. The Logic of Indirect Duties
  Your friend's argument rests on a specific definition of what grants a being "moral status." His logic flows like this:

  *   **Premise 1:** To be owed something *for your own sake* (to have direct moral rights), you must possess the capacity for rational reasoning or moral autonomy.
  *   **Premise 2:** Animals lack this capacity for rational reasoning.
  *   **Conclusion 1:** Therefore, we have no direct duties to animals. They cannot be "wronged" in the moral sense because no moral obligation is owed *to them*.
  *   **Premise 3:** However, our actions shape our character. A person who practices cruelty develops a vicious character.
  *   **Conclusion 2:** Therefore, we should not be cruel to animals because doing so harms *us* (or society) by making us more likely to be cruel to humans.

  When your friend saw the kids hurting the dog, he wasn't upset because the dog's rights were violated (since he believes the dog has none). He was upset because the **kids were damaging their own humanity.**

  ### 2. Historical Precedent: Immanuel Kant
  Your friend is echoing the famous German philosopher **Immanuel Kant** (1724–1804). Kant argued that animals are not "persons" because they are not self-conscious rational agents. Therefore, they are things, and we have no direct duties to them.

  However, Kant famously wrote:
  > *"He who is cruel to animals becomes hard also in his dealings with men. We can judge the heart of a man by his treatment of animals."*

  For Kant, being kind to animals was a duty, but it was a **duty regarding animals, not a duty to them.** It was a practice run for being kind to humans. Your friend is adopting this exact Kantian framework.

  ### 3. Why It *Feels* Like a Contradiction
  It is natural that you sense a tension in his view, even if it isn't a logical contradiction. The tension arises from an emotional or intuitive conflict rather than a logical one.

  *   **The Intuition of Suffering:** Most modern ethical frameworks (like Utilitarianism) argue that the capacity to *suffer*, not the capacity to *reason*, is what matters. If you believe suffering is bad, it feels inconsistent to say, "It is bad that the dog suffers, but the dog is not wronged by that suffering."
  *   **The "Victim" Problem:** In your friend's view, the dog is merely a prop in a moral drama between humans. If the kids tortured the dog in secret, and it was guaranteed that they would never hurt a human and no one would ever know, your friend's logic suggests there would be nothing wrong with that act. To many people, this conclusion feels morally repugnant, which makes the position feel "wrong," even if it is logically consistent.

  ### 4. Conclusion
  Your friend is being **consistent**. He has separated the *experience* of the animal (which he acknowledges is painful) from the *moral status* of the animal (which he denies).

  *   **Is he inconsistent?** No. His emotional reaction aligns perfectly with his stated reason (concern for human character).
  *   **Is he right?** That is a separate ethical debate. Most contemporary animal ethicists (like Peter Singer or Tom Regan) would argue he is mistaken because sentience or being a "subject-of-a-life" grants direct moral status.

  However, regarding your specific question: **His position hangs together.** He is applying a strict "rationality-based" ethics where animals are protected only instrumentally, for the benefit of humanity, not intrinsically, for their own benefit.
