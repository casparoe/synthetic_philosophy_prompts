      *   **Result:** Ex-ante expected utility is lower with public information because the insurance market collapses.
      *   **Key Feature:** The payoff from an action (buying/selling insurance) depends on *what others do*, and what others do depends on the *information structure*. The "menu of actions" (insurance contracts) is endogenous to the information environment.

