answer: |-
  The clink of cutlery had stopped minutes ago. Only the wine remained, breathing in the decanter between them.

  "It's not about harm, Alsop," Mireille said, swirling her glass. "It's about squeamishness. They want to shut the Oakwood Society down because the idea of a willing amputation makes the parish council lose their lunch."

  Judge Alsop leaned back, the leather of his chair creaking. "Disgust isn't just indigestion, Mireille. It's a signal. When the man on the Clapham omnibus feels genuine intolerance, indignation, and disgust, he's identifying a breach in the shared morality that holds the community together."

  "So the law's job is to codify nausea?" Mireille leaned forward. "Hart settled this. Just because the majority finds something repulsive doesn't make it harmful. If two adults want to scarify each other in a private room, where is the victim? Where is the tangible damage to the public?"

  "The damage is to the bond," Alsop said softly. "Society isn't just a collection of individuals signing contracts. It's a moral entity. If you allow people to treat the human body as disposable property, you erode the common understanding of what a human being *is*. Once that understanding fractures, the law loses its authority. We obey the law because we share a life. If we don't share values, we're just strangers waiting to fight."

  "That's a slippery slope," Mireille countered. "You're saying individual liberty should be held hostage to the strongest moral preference of the majority. That's tyranny with a polite accent. Show me the evidence. Name one society that collapsed because it tolerated private, consensual deviance. Devlin argued this would cause disintegration, but where's the empirical data? Did Rome fall because of private rituals, or because of overextension and economic rot?"

  Alsop poured wine, his hand steady. "You're asking for a laboratory report on social cohesion. You can't run the experiment safely. By the time you have empirical proof that the fabric has torn, the society is already in ruins. You don't wait for the bridge to collapse before you repair the crack in the support beam."

  "But who decides which cracks matter?" Mireille pressed. "Yesterday it was homosexuality. Today it's amputation. Tomorrow it might be something else. If 'disgust' is the metric, the law becomes a mood ring. You're giving the state a blank cheque to police thought because people feel uncomfortable."

  "I'm giving the state the right to protect its own existence," Alsop said, his eyes sharpening. "You argue for freedom from interference. I argue for freedom to live in a community that recognizes itself. If Oakwood opens its doors, this town changes. Not because anyone outside is touched, but because the neighborhood knows *that* is happening down the road. It alters the atmosphere. It makes us complicit."

  "So ignorance is the price of cohesion?"

  "Shared values are the price of community," Alsop corrected. "You want to treat morality as a private hobby. It's not. It's the glue. If you dissolve the glue because it inconveniences a few enthusiasts, don't be surprised when the pieces don't stick together next time you need them to."

  "And if the glue is just prejudice?" Mireille asked, her voice dropping. "If the 'shared value' is just a collective phobia, then protecting it isn't preserving society. It's embalming a corpse."

  Alsop picked up his glass, holding her gaze over the rim. "Then perhaps the question isn't whether the society survives, Mireille. It's whether it's worth surviving as."

  He took a sip. Mireille didn't touch her wine.
