      *   **Douglass:** By 1857, Douglass had broken with Garrison (around 1851) over this very issue. He is more pragmatic but still radical. He believes in natural law and the text of the Constitution. His voice should be dignified, logical, yet passionate.
      *   **Tone:** Respectful but intense. They were friends who became rivals over this specific issue, though they remained allies in the broader cause.

  3.  **Drafting - Section by Section:**

