answer: |-
  **Rochester, New York. May 1857.**

  **The study of Frederick Douglass's home is dimly lit, the air thick with the smoke of a dying fire and the heavier weight of recent news. William Lloyd Garrison stands by the window, looking out at the street. Frederick Douglass sits at his desk, a copy of the *Dred Scott* opinion open before him.**

  **GARRISON:** (Turning from the window) Chief Justice Taney has done the work of a hangman, Frederick. He has stripped the mask from the face of the Republic. He says the Negro has no rights which the white man is bound to respect. He says the Constitution was made for white men, by white men, to secure white supremacy. After twenty years of my crying in the wilderness, the highest court in the land confirms it: the Constitution is a covenant with death.

  **DOUGLASS:** Taney speaks for the Supreme Court, William, not for the Constitution. He speaks for the slave power, not the text. To accept Taney's gloss as the final word is to surrender the law itself into the hands of those who would pervert it.

  **GARRISON:** Perverse? It is plain! Look at the instrument itself. The three-fifths clause reduces human beings to fractions of men to bolster the political power of the master. The fugitive-slave clause commands that a fleeing soul be dragged back to chains without a jury trial. The clause barring restriction on the slave trade until 1808 gave the traffic in human flesh a twenty-year shield of federal protection. These are not ambiguities. They are bricks in a pro-slavery fortress.

  **DOUGLASS:** They are bricks only if you ignore the mortar that holds the building together. You read the clauses in isolation, through the lens of the framers' private prejudices. I read them by their own words. The word "slave" appears nowhere. The word "slavery" is absent. The three-fifths clause speaks of "persons," not property. The fugitive clause speaks of "persons held to service or labor," which could apply to apprentices or indentured servants under a strict reading. The 1808 clause did not protect the trade forever; it set a date for its destruction, which Congress met.

  **GARRISON:** (Snapping) This is legalistic sophistry! You are engaging in willful blindness to what the Constitution has always actually licensed in practice. For seventy years, this government has hunted fugitives, counted slaves for representation, and protected the interests of the plantation. To pretend the text is neutral when the machinery it powers is drenched in blood is to make yourself an accomplice. You cannot cleanse a fountain while drinking from a poisoned cup.

  **DOUGLASS:** And you, William, would smash the cup and let the thirsty die. You argue that because the government has been misused, it must be abandoned. But the ordinary rules of legal interpretation require reading each part in light of the whole. What is the whole? The Preamble. "To establish justice," "to secure the blessings of liberty." Slavery is a local institution, sustained by state law. The federal government is a creature of the Constitution, and the Constitution's general purposes are liberty and justice. If a clause can be read in two ways—one consistent with liberty, one with slavery—the law demands we choose liberty.

  **GARRISON:** Liberty? There is no liberty in a Union that binds the free states to the police force of the slave states. Every time you vote under this Constitution, every time you swear an oath to support it, you lend legitimacy to a system that Taney has now explicitly defined as pro-slavery. You say I am blind to the text's potential? I say you are blind to the reality of the compact. The Union is a rope of sand held together by the sinews of slaves. To work within it is to say the ends justify the means. I say the means *are* the end. The Union must be dissolved. "No Union with Slaveholders."

  **DOUGLASS:** Dissolution? That is the very cry of the Southern fire-eaters! Do you not see what you are doing? By declaring the Constitution pro-slavery and demanding secession, you hand slaveholders, on no better evidence than their own self-interest, exactly the interpretive victory they want. They *want* to believe the Constitution protects slavery everywhere. They *want* the North to abandon the field so they may claim the federal government as their exclusive domain. If we leave, who remains to fight for the slave in the halls of Congress? Who remains to harbor the fugitive under the color of federal law?

  **GARRISON:** (Stepping closer, voice low and intense) You ask who remains? The conscience of the nation remains! You charge me with handing them victory. I charge you with polishing the chains and calling them jewelry. If I tell a man the house he lives in is built on a foundation of bones, and he replies, "But the roof is beautiful, and the deed says 'liberty'," who is the liar? Taney has told the truth about the Constitution's operation. To argue otherwise is to tell the slave that the law is his friend when the law is his hunter. I will not lend my name to a government that claims the right to return a man to hell.

  **DOUGLASS:** And I will not tell the slave that the law is his enemy when the law may be his shield. You speak of the foundation of bones. I speak of the blueprint for a house that has not yet been built. The framers planted seeds of tyranny, yes. But they also planted seeds of liberty. *Dred Scott* is not the harvest; it is a blight. We fight the blight by claiming the tree, not by burning the orchard. If you dissolve the Union, you make slavery a purely domestic institution beyond the reach of national morality. You wash your hands of the sin, William, but you leave the slave in the mire.

  **GARRISON:** I wash my hands of the *sin*, Frederick, not the sinner. I separate myself from the guilt so that my voice may remain pure against it. You seek to wield a sword that is rusted through with compromise. You will cut yourself before you cut the throat of slavery.

  **DOUGLASS:** And you seek to stand on a shore of moral purity while the tide rises. I will stand in the mud if it means I can pull a brother out. We are agreed on the evil. We are agreed on the goal. But you see the Constitution as a contract with the devil. I see it as a weapon taken from the devil's hand, which we may turn against him.

  **GARRISON:** (Turning back to the window) Then we are at an impasse. You believe the paper can be saved. I believe the paper is the shroud of the slave.

  **DOUGLASS:** Then let history judge which of us served the slave best. I will not stop arguing that the Constitution is a glorious liberty document.

  **GARRISON:** And I will not stop crying that the Union is a moral fraud.

  **Douglass closes the *Dred Scott* opinion with a sharp snap. Garrison does not turn from the glass. The silence between them is not the silence of peace, but the silence of two men marching toward the same mountain by different, irreconcilable paths.**
