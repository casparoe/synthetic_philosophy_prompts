answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Theo's. And for those who were at the rehearsal dinner… yes, I'm the one who tried to ruin the wedding with metaphysics.

  Last night, I asked Theo and Mira a question that kept me up thinking: If you believe there is no fixed "self"—no permanent soul traveling through time—who exactly is making these vows? And why should a bundle of aggregates thirty years from now feel bound by words spoken by a different bundle tonight?

  Theo offered this image of a flame lighting another flame. Not the same flame, but not a different one, either. A continuity of fire. He admitted it didn't fully solve the problem of obligation. But lying in bed last night, I realized that's actually the most beautiful part of what you two are doing.

  Most wedding vows treat marriage like a contract between two statues. Two solid, unchanging entities promising to stand next to each other until one crumbles. But Theo and Mira, you aren't statues. You know you are processes. You are rivers. You are that flame passing itself along, moment to moment.

  So, when you say "for the rest of our lives," you aren't making a promise that binds a future stranger. You are setting an intention for the flow.

  To the family here who just wants to know that this love is real: It is. The fact that you change doesn't make the love less true; it makes it more alive. A flame that doesn't move goes out.

  To the sangha and the philosophy cohort in the back: You know that psychological connectedness is a matter of degree. But love is the glue that maximizes that degree. By making this vow, Theo and Mira aren't describing a metaphysical fact; they are creating a causal path. They are saying, "No matter how much this bundle changes, I will prioritize its connection to *that* bundle."

  The obligation doesn't come from a soul that persists. It comes from the care they have for the continuity itself. They are promising to tend the fire. They are promising that when the flame flickers—and it will—they will shield it from the wind, rather than letting it die out for the sake of convenience.

  Theo, Mira, you don't have to believe in a forever-self to have a forever-love. You just have to believe in the next moment, and the one after that. You have to trust that the kindness you light in each other tonight will be the very thing that lights the way thirty years from now.

  So, I'm not going to wish you a lifetime of static happiness. I'm going to wish you a steady flame. I wish you the wisdom to see the changes in each other without fear, and the courage to keep lighting the wick, day after day, even when the wind blows.

  Please raise your glasses.

  To the flame. To the flow. To Theo and Mira.
