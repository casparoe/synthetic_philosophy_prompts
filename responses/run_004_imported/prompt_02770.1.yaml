      *   **The Gray Zone (The "Line"):** Discuss where the distinction blurs (caffeine, therapy, practice tools).
      *   **The Coercion Factor:** The most practical ethical concern (if everyone does it, you must too).
      *   **Conclusion:** Summarize the tension without necessarily picking a side, but offering frameworks to think about it.

  6.  **Refining the Content (Self-Correction during drafting):**
