answer: |-
  First, I am so sorry for your loss. Losing a grandmother is hard enough without the estate becoming a battlefield, and it is completely understandable that you are feeling churned up. Grief makes us vulnerable, and high-stakes financial decisions made while grieving often lead to regret.

  To answer your core question directly: **No, Priya is not right.** While her advice comes from a place of wanting to protect you, following it would likely turn a difficult negotiation into a destructive war that leaves both of you financially and emotionally bankrupt.

  Your intuition is spot on: escalating this into a game of "chicken" guarantees the worst possible outcome. Here is a breakdown of why your brother's tactic works differently than he thinks, why Priya's advice is dangerous, and what the actual "sane way out" looks like.

  ### 1. The Legal Reality Check
  Your brother is bluffing, either consciously or unconsciously.
  *   **He cannot do what he says.** If the will leaves the house to "the grandchildren" (plural), you are likely co-owners (tenants in common). He cannot unilaterally transfer the title to himself.
  *   **The Lawyer knows this.** An estate lawyer cannot ethically draw up paperwork transferring 100% of the asset to one owner without the consent of the other. If he has "started paperwork," it is likely just a draft that requires *your* signature to become valid.
  *   **The Group Chat doesn't matter.** Announcing a decision to the family has social weight, but zero legal weight. He is trying to use social pressure to bypass legal requirements.

  **The Takeaway:** You hold a veto power. He cannot take the house without your consent. You do not need to "lock yourself in" to stop him; you simply need to refuse to sign anything.

  ### 2. Why Priya's Advice is a Trap
  Priya is suggesting a classic Game Theory move called a **Commitment Strategy**. The idea is to restrict your own options so the other party *has* to yield. However, in family law and inheritance, this usually triggers the **Prisoner's Dilemma**:
  *   **If you both cooperate:** You talk, agree on a fair price (buyout or sale), and keep most of the money.
  *   **If one defects (your brother):** He tries to grab more value by bullying.
  *   **If you both defect (Priya's plan):** You lie about promising it to your daughter; he refuses to budge. The result is a **Partition Action**.

  A Partition Action is a lawsuit where a judge forces the sale of the property. This is the "nasty legal fight" you fear.
  *   **It is expensive:** Legal fees eat into the equity.
  *   **It is low-value:** Forced sales often happen at auction or below market value.
  *   **It is permanent:** It destroys any chance of sibling reconciliation.

  Furthermore, Priya suggested you **lie** to the lawyer ("tell them you promised it to your daughter"). **Do not do this.** Lying to an estate attorney creates liability for you and destroys your credibility. If you are caught in a lie, a judge or mediator will view everything else you say with suspicion.

  ### 3. The "Sane Way Out"
  You are worried that refusing to escalate makes you the "weak" one. It doesn't. It makes you the **stable** one. In negotiation, the person who refuses to play a chaotic game often ends up controlling the pace.

  Here is a step-by-step path to de-escalate without surrendering:

  **Step 1: Secure Independent Counsel**
  Do not use the same lawyer as your brother. Hire your own estate attorney. Tell them exactly what happened. Your lawyer will send a letter to the estate lawyer stating: *"My client is a 50% owner. No transfer of property will occur without their signed consent. We are open to negotiation regarding buyout or sale."*
  *   **Why this works:** It instantly neutralizes your brother's claim that paperwork is "already happening." It moves the battle from the family group chat (where he has the advantage) to professional channels (where rules apply).

  **Step 2: Remove the Audience**
  Send a brief, calm text to the family group chat: *"As [Brother] and I have different views on the property, we will be handling this through our respective attorneys to ensure it's done fairly and legally. We will update the family when there is a final agreement."*
  *   **Why this works:** It takes the audience away. Your brother's strategy relies on you feeling pressured by the family. By professionalizing it, you remove the social shame of him "backing down."

  **Step 3: Propose Mediation, Not Litigation**
  Have your lawyer propose a mediator. A mediator is a neutral third party who helps co-owners find a solution.
  *   **Why this works:** It gives your brother a way to save face. He doesn't have to admit he was wrong to *you*; he can just agree to the mediator's suggestion. It also signals that you are willing to spend money to fight (lawyers), which might make him realize a forced sale will cost him money too.

  **Step 4: Hold the Line on "Fair Market Value"**
  Decide what you want *before* you negotiate. Do you want cash? Do you want to keep it?
  *   If you want cash: Get an appraisal. Offer to sell him your half for 50% of the appraised value.
  *   If he refuses: State clearly that your alternative is a partition sale (forced sale). Remind him that a forced sale usually nets 10-20% less than a private sale, and legal fees will come out of *his* share too.
  *   **The Logic:** You aren't threatening him; you are outlining the mathematical reality. "I don't want a forced sale, but if we can't agree on a buyout, that is the legal default."

  ### 4. Reframing Your Mindset
  You wrote: *"Honestly, even sitting here trying to game out the 'smart' move kind of feels like I'm already halfway into doing the exact thing that annoyed me about him doing it."*

  This is your wisdom speaking. Your brother is operating out of scarcity and aggression. If you match him, you validate his approach. By refusing to play the game, you aren't being a doormat; you are being the adult in the room.

  **The "Weakness" Illusion:**
  It feels like blinking first to say, "Let's talk like adults." But in this context, **process is power.** By insisting on legal procedure and mediation, you are actually slowing the game down. Your brother wants a fast, emotional victory. You want a slow, legal resolution. Time is on your side, not his.

  ### Summary
  *   **Priya is wrong.** Escalation leads to mutual financial loss.
  *   **Your brother is bluffing.** He cannot take the house without your signature.
  *   **Do not lie.** It undermines your legal standing.
  *   **Get your own lawyer.** This is the single most important move. It stops his paperwork and professionalizes the dispute.
  *   **Use the "Forced Sale" as leverage, not a threat.** Explain that without agreement, the house gets sold cheaply by a judge. Most people will choose a private buyout to avoid that.

  You can get through this without becoming the person you dislike. Protect your share, hire your own counsel, and let the law be the bad guy so you don't have to be.
