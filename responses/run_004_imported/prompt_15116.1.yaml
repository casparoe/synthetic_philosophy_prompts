answer: |-
  **Setting:** *The Dusty Spine*, a cramped used bookstore that smells of vanilla and decaying paper. It's a rainy Tuesday evening. **Elias** (50s, wears a cardigan, holds a copy of *On Kingship*) and **Mara** (30s, sharp eyes, clutching a printout of the *Commentary on the Sentences*) are standing in the Philosophy aisle. They clearly know each other.

  **Elias:** You're blocking the Scholastics again, Mara.

  **Mara:** And you're hovering over the Political Theory section like a ghost. Still trying to convince yourself Aquinas was a pacifist regarding regime change?

  **Elias:** I'm trying to convince myself that people stop reading one paragraph of the *Sentences* and pretend it overrides the entire mature political philosophy of *On Kingship*.

  **Mara:** (Laughs, shifting a stack of books) Here we go. The "Mature Aquinas" defense. Look, Elias, I get it. *On Kingship* is cautious. It's written for the King of Cyprus. You don't tell a king, "Hey, by the way, your subjects can stab you." But you can't ignore the *Sentences*. Book II, Distinction 44. He's explicit. "To free the fatherland by killing a tyrant is praiseworthy and rewarded."

  **Elias:** He says it's praiseworthy. He doesn't say *who* is doing the praising, or *who* is doing the killing. That's the gap everyone falls into. In *On Kingship*, he fills that gap. He says private persons cannot presume to kill tyrants. It has to be "public authority."

  **Mara:** But why? If the act is virtuous—freeing the fatherland—why does the agent matter? If I stop a mugger, I don't wait for a police officer to give me permission to tackle him.

  **Elias:** Because a ruler isn't a mugger. That's the whole point of the precaution in *On Kingship*. He argues that when a private person takes it upon themselves, you set a precedent that destroys the very idea of order. If killing a "tyrant" becomes a private right, then every faction that dislikes a policy decides the ruler is a tyrant. You end up with more tyranny, not less.

  **Mara:** That's a pragmatic argument, not a moral one. Aquinas is a moral theologian. If the ruler is a usurper—*tyrannus ex defectu tituli*—he has no claim. He's not a ruler; he's an occupier. In the *Sentences*, Aquinas draws that line. If you seized power without title, you forfeit the protection of office. A legitimate king who rules badly (*tyrannus ex parte exercitii*)? Sure, protect him. But a usurper? He's just a criminal with a crown.

  **Elias:** Even if he's a usurper, the remedy matters. Look at the text in *On Kingship* again. "If to kill a tyrant seems worthy of reward, there can be no sufficiently great rewards for such deeds." He's being sarcastic. He's saying, "Sure, sounds great, until you realize the person who kills him might be worse."

  **Mara:** He's acknowledging the risk, not forbidding the act. There's a difference. And you're glossing over the "public authority" problem. Elias, what if the public authority *is* the tyranny? What if the Senate is cowed? What if the Church is compromised? Aquinas isn't an idiot. He knows institutions fail. If the only mechanism to remove a usurper is the usurper's own bureaucracy, you've made tyranny invincible.

  **Elias:** He's not saying wait for the tyrant's bureaucracy. He's saying there must be some collective mechanism. A tribunal. A nobility. *Someone* other than "the guy with the dagger." Because the moment you legitimize the dagger, you make politics a blood sport. Aquinas saw the chaos of the Italian city-states. He knew that "liberation" often just meant the next warlord walking in.

  **Mara:** But that's circular. You need public authority to depose the tyrant, but the tyrant exists because he subverted public authority. The *Sentences* passage is the safety valve. It acknowledges that in extreme cases, virtue requires action. "Praised and rewarded." That sounds like divine reward, Elias. Not a medal from the Senate.

  **Elias:** Or it sounds like an earlier, less nuanced view that he corrected later. The *Sentences* is early work. *On Kingship* is later. *Summa* is later still. In the *Summa*, he talks about sedition. He says sedition is a mortal sin. He worries about the "multitude" being led astray. He is terrified of the mob. He would rather suffer a bad king than unleash a civil war where everyone thinks they're Brutus.

  **Mara:** Suffering a bad king is one thing. Suffering a usurper is another. You're conflating the two types of tyrants. That's my whole point. Aquinas treats the usurper differently because the usurper violates the covenant of rule itself. A legitimate king who goes bad is a father beating his children. You call the authorities. A usurper is a stranger breaking into the house. In the *Sentences*, he implies the distinction matters for the *licitness* of the response.

  **Elias:** Does he? Or does he just say the usurper is *more* of a tyrant? Look, even if we grant the distinction—and I think you're reading more into it than is there—the mechanism of removal stays the same. *On Kingship* is explicit: "It is not for private presumption to kill such men." Period. He doesn't say, "Unless he's a usurper." He says private presumption is dangerous because it exposes the multitude to danger.

  **Mara:** Because a failed attempt makes the tyranny worse! He says that explicitly. "The tyranny becomes more severe." But that's a conditional warning. It's not a moral absolute. It's saying, "Don't do it unless you're sure it will work." If a private citizen *knows* they can succeed, and the tyrant is a usurper, where is the sin?

  **Elias:** The sin is in the presumption of judgment. Who decides he's a usurper? Who decides the attempt will succeed? That judgment belongs to the community, not the individual. That's what "public authority" means. It's not just a bureaucratic hurdle; it's an epistemic one. It ensures the judgment isn't personal vengeance.

  **Mara:** So if the community is paralyzed by fear, the usurper wins by default? Aquinas believes in natural law. If a ruler destroys the common good, he dissolves the bond of obedience. In the *Sentences*, he says the tyrant is a "public enemy." You don't need a trial to kill an enemy combatant in the middle of a battle.

  **Elias:** But is the street a battlefield? That's the question. Aquinas wants to civilize politics. He wants to move us away from the vendetta. If you tell the average person, "You can kill the usurper," you're telling them, "You are the judge." And humans are terrible judges when they're angry. *On Kingship* is the realistic brake on the *Sentences*' idealism.

  **Mara:** Or *On Kingship* is advice for a specific king, and the *Sentences* is the theological principle. You're treating *On Kingship* like it's the *Summa*. It's a fragment. It breaks off! It's incomplete. Why privilege the incomplete advice to a monarch over the theological commentary on justice?

  **Elias:** Because it aligns with the *Summa* on sedition. He consistently prioritizes the peace of the community over the removal of the individual sinner. Even a tyrannical sinner. Unless... unless the tyranny is so extreme it threatens the salvation of souls. But even then, he points to God. "Pray."

  **Mara:** (Snorts) "Pray." That's the part my uncle loved. "Just pray about the dictator."

  **Elias:** It's not dismissal. It's an acknowledgment that some evils are beyond political remediation without causing greater evil. But look, I'll concede one point. The distinction between the usurper and the legitimate tyrant *is* in the text. I don't deny that.

  **Mara:** Thank you.

  **Elias:** But I deny that it changes the *agent*. Even for a usurper, Aquinas wants a public process. He mentions the Romans deposing Tarquin. That wasn't one guy. That was a movement. A collective. The "private person" is the problem for him, not just the target.

  **Mara:** But what constitutes "private"? If I'm a soldier sworn to the constitution, and a general stages a coup, and I stop him... am I a private person? Or am I an instrument of the public authority that he violated?

  **Elias:** Now you're arguing about definitions. Aquinas is talking about the guy at the dinner table, or the guy in the alley. Not the military chain of command.

  **Mara:** I'm talking about the principle. If the authority comes from the common good, and the usurper destroys the common good, the authority reverts to the people. Or at least, to someone who can act. Aquinas says the killer is "praised." You don't get praised for a sin, even a necessary one.

  **Elias:** You get praised if the outcome is good. That's consequentialist. Aquinas is usually deontological about authority. "He who resists the power resists the ordinance of God." Unless the power isn't really power. That's your usurper argument. But the risk... the risk is what haunts *On Kingship*. He's seen what happens when people think they're liberators.

  **Mara:** And I'm saying he's seen what happens when people think kings are gods. He wrote *On Kingship* to tell the King of Cyprus *not* to be a tyrant. It's a warning to the ruler, not just the subject. "Don't make them want to kill you."

  **Elias:** (Sighs, running a hand over the cover of his book) Maybe. Maybe the tension is the point. He wants to discourage assassination without making tyranny inviolable. He leaves it ambiguous on purpose.

  **Mara:** Or he changed his mind.

  **Elias:** Or he realized the world is messy.

  **Mara:** (Pulls a book from the shelf, a worn copy of the *Summa*) Tell you what. I'll buy this. You keep *On Kingship*. Next time, we tackle the *Summa* passage on sedition. See if it favors your "public authority" or my "reversion to the people."

  **Elias:** Deal. But if you quote the *Sentences* without context again, I'm hiding the Scholastic section.

  **Mara:** If you pretend the usurper distinction doesn't exist, I'm donating all your books to charity.

  **Elias:** (Smiles) Fair enough. Rain's letting up. You walking?

  **Mara:** Yeah. Walk me out. And tell me again why praying is a political strategy.

  **Elias:** It's not. It's a coping mechanism. There's a difference.

  *(They head toward the counter, the argument paused but clearly unresolved, the books heavy in their hands.)*
