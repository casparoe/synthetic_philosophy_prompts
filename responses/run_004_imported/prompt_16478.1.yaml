answer: |-
  This is an exceptionally sharp observation, and it touches on one of the most significant developments in recent Sidgwick scholarship. You are absolutely right to identify the connection not as a biographical curiosity but as a structural necessity within Sidgwick's moral philosophy. The work of biographers like Bart Schultz (*Henry Sidgwick: Eye of the Universe*) has been pivotal in establishing that Sidgwick's involvement with the Society for Psychical Research (SPR) was effectively an attempt to solve the problem left hanging in *The Methods of Ethics*.

  Comparing this to William James is a brilliant move. While both men were founders of psychical research societies (Sidgwick the SPR in 1882, James the American Society for Psychical Research in 1885) and corresponded on the matter, their philosophical architectures dictated radically different relationships to the "occult."

  Here is a comparison of their motivations and standards of evidence, followed by an assessment of which project was more philosophically coherent.

  ### 1. Motivations: Ethical Necessity vs. Metaphysical Expansion

  **Sidgwick: The Search for a Missing Premise**
  For Sidgwick, psychical research was not an expansion of interest but a rescue mission for rationality itself. As you noted, the "dualism of practical reason" posits that Rational Egoism (maximize my good) and Rational Benevolence/Utilitarianism (maximize the general good) are both self-evident, yet they diverge unless there is a mechanism ensuring that duty and self-interest coincide in the long run.
  *   **The Goal:** Sidgwick needed empirical proof of a **moral governance of the universe**. Mere survival after death was insufficient; he needed evidence that the post-mortem state rewarded virtue and punished vice. Without this, the "chaos" of practical reason remains: it might be irrational to be moral if morality leads to earthly suffering without cosmic compensation.
  *   **The Stakes:** High. If psychical research failed, his ethical system lacked a rational foundation for the common-sense conviction that "it pays to be good."

  **James: The Fight Against Materialistic Monism**
  For James, psychical research was an offensive maneuver against the "closed universe" of scientific materialism. His motivation was not to save a specific ethical calculus but to validate the **reality of religious experience** and the plurality of the self.
  *   **The Goal:** James sought evidence of the **"supernormal"** (a term he preferred to "supernatural"). He was less concerned with divine justice than with the *continuity of consciousness* and the existence of wider spiritual energies. Investigating mediums like Leonora Piper was a way to prove that the human mind is not coterminous with the brain.
  *   **The Stakes:** Metaphysical breadth. If psychical phenomena were real, then scientific materialism was false, and the "Will to Believe" in religious hypotheses was vindicated as a live option.

  ### 2. Standards of Evidence: Legalistic Proof vs. Radical Empiricism

  **Sidgwick: The Skeptical Juror**
  Sidgwick approached psychical research with the same rigorous, almost legalistic, scrutiny he applied to ethical axioms. He was a "believing skeptic."
  *   **Method:** He demanded strict controls, the elimination of fraud, and reproducibility. He was famously difficult to convince. He treated testimony as evidence only when all naturalistic explanations were exhausted.
  *   **Tolerance for Ambiguity:** Low. Sidgwick needed *certainty* (or near-certainty) to resolve the dualism. Probabilistic evidence was useless for an *a priori* ethical problem. If the evidence was ambiguous, the dualism remained unresolved.
  *   **Result:** Decades of investigation left him privately unconvinced. He died fearing that the "chaos" of practical reason was the final truth.

  **James: The Cumulative Case-Builder**
  James approached the same data through the lens of **Radical Empiricism**, which posits that relations and connections experienced are just as real as the things related.
  *   **Method:** James was willing to accept "fringe" data. He argued that science prematurely excludes anomalies. His standard was not absolute proof but a shift in the **burden of probability**. He looked for "particulars" that accumulated into a plausible picture.
  *   **Tolerance for Ambiguity:** High. In *Human Immortality* and his writings on Mrs. Piper, James admitted that the evidence might support "telepathy among the living" rather than "survival of the dead." For James, both options were metaphysically significant because both shattered materialism.
  *   **Result:** James became convinced that *something* supernormal was occurring (specifically regarding Piper), even if the precise metaphysical interpretation remained open.

  ### 3. Assessment of Philosophical Coherence

  To determine which man had the more philosophically coherent reason for undertaking this inquiry, we must ask: **Did the inquiry follow naturally from their epistemological and metaphysical commitments, or did it strain them?**

  **The Case for Sidgwick: Systemic Coherence, Methodological Strain**
  Sidgwick's inquiry is **systemically coherent** but **methodologically precarious**.
  *   *Coherence:* Given his ethical intuitionism, he cannot simply *choose* to believe in divine justice (that would be dogmatism). He needs a fact. Since the fact concerns the physical/metaphysical structure of the universe (rewards after death), it must be an empirical fact. Therefore, empirical investigation is the only route left to him.
  *   *Incoherence:* There is a category tension here. Sidgwick's ethics is built on *a priori* self-evident axioms. Relying on contingent empirical evidence (séances, mediums) to validate the rationality of those axioms makes the foundation of morality disturbingly fragile. If the mediums are frauds, is morality irrational? Sidgwick's system implies "yes," which undermines the self-evidence of the moral axiom. He is trying to use empirical science to solve a problem created by rationalist ethics.

  **The Case for James: Methodological Coherence, Systemic Flexibility**
  James's inquiry is **methodologically coherent** and **systemically robust**.
  *   *Coherence:* Radical Empiricism dictates that *all* experience is data. If people experience apparitions or telepathic insights, a philosophy that claims to be empirical *must* investigate them. To ignore them would be dogmatic, violating his own critique of "scientism." Furthermore, Pragmatism asks: "What practical difference does it make?" If believing in survival makes life richer and more moral, the hypothesis has cash value.
  *   *Robustness:* James does not need *proof* of divine justice to save his philosophy. He only needs to show that materialism is not the only option. Ambiguity serves James; it keeps the "universe open." His philosophy can absorb the failure of psychical research without collapsing, whereas Sidgwick's ethics teeters on it.

  ### The Verdict

  **William James had the more philosophically coherent reason for undertaking the inquiry.**

  Here is why: Sidgwick's engagement with psychical research reveals a **vulnerability** in his system. It admits that his rationalist ethics cannot stand on its own feet without a theological crutch supported by empirical evidence. He is forced to look outside his moral philosophy (to parapsychology) to solve an internal problem (the dualism). This suggests that the "self-evidence" of his axioms was not actually self-sustaining.

  James, conversely, integrates psychical research **into** his system. It is an application of his epistemology, not a patch for a broken ethical engine. James's "Will to Believe" allows him to treat the *possibility* of survival as a legitimate hypothesis without requiring the definitive proof Sidgwick desperately sought. James's philosophy is designed to handle the "fringe"; Sidgwick's is designed to handle the "center," forcing him to venture into the fringe with equipment (rigorous scientific skepticism) that was ill-suited for the terrain.

  **Conclusion for your work:**
  In your seminar context, you might frame it this way: Sidgwick's psychical research is a **tragic** extension of his philosophy—a desperate attempt to close a gap that his rationalism could not bridge. James's psychical research is a **pragmatic** extension—a natural exploration of the "more" that his radical empiricism promised existed. Sidgwick looked for a key to lock the universe into a moral order; James looked for a window to open the universe to wider possibilities. The latter is far more consistent with a philosophy that values experience over system.

  This comparison highlights that while Sidgwick is the more rigorous systematizer of ethics, James is the more coherent philosopher of *inquiry*. Sidgwick hoped psychical research would end the inquiry into the dualism; James knew it would only deepen the inquiry into the nature of reality. Given the actual outcomes of parapsychology, James's stance proved the more philosophically sustainable.
