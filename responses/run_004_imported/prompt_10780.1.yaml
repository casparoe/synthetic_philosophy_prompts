  2.  **Deconstruct the Philosophical/Scientific Issue:**
      *   *Lakatos:* Research programmes have a "hard core" (untouchable theory) and a "protective belt" (auxiliary hypotheses). A programme is *progressive* if it predicts novel facts. It is *degenerating* if it only explains anomalies post-hoc without new predictive power.
      *   *Le Verrier Analogy:*
          *   Neptune: Newtonian mechanics + Unknown Planet predicted *where* to look. Confirmed. (Progressive).
          *   Vulcan: Newtonian mechanics + Unknown Planet predicted *where* to look. Not found. (Degenerating/Ad hoc).
          *   *Key Difference:* Novel prediction vs. Post-hoc accommodation. Independent testability.
      *   *The Grantee's Case:*
