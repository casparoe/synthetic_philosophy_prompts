      *   *Actually, the most decisive memo:* **Defund.** It forces me to define the line clearly. The Le Verrier argument is the "losing side" I need to champion before rejecting.

      *   *Refining the Criterion:* What distinguishes Neptune from Vulcan?
          1.  **Novelty:** Did the hypothesis predict something *new* not used to construct it? (Neptune predicted a location. Vulcan was fit to Mercury's perihelion).
          2.  **Independent Testability:** Can the auxiliary be tested without assuming the core theory is true?
          3.  **Theoretical Motivation:** Was the moderator derived from a broader network of theory, or invented solely to save the specific finding?
      *   *Applying to Grantee:* The moderators (Task Involvement, Self-Monitoring) were added *after* null results. This is post-hoc accommodation, not novel prediction. This is the "Vulcan" move, not the "Neptune" move.

  4.  **Drafting the Memo - Section by Section:**

