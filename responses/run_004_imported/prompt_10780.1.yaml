      *   **Rebuttal/Resolution:** Why the counter-argument fails *here*. Neptune was a *prediction* confirmed later. The grantee is *explaining* past failures. The direction of inference matters.
      *   **Conclusion:** Final word on stewardship.

  5.  **Refining the Tone:**
      *   Needs to be academic, respectful, firm, and philosophically literate.
