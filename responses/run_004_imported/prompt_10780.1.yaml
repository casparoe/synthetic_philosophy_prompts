answer: |-
  **MEMORANDUM**

  **TO:** The Foundation Board of Directors
  **FROM:** Behavioral Sciences Replication Grant Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Renewal Decision: Cycle 4 Proposal on Ego Depletion Moderators

  **RECOMMENDATION:** **Do Not Fund**

  **EXECUTIVE SUMMARY**
  The Panel has reviewed the fourth-cycle renewal request for the project investigating boundary conditions of the ego depletion effect. Following two null-result preregistered replications, the Principal Investigator (PI) has sequentially introduced two new moderators (task involvement; trait self-monitoring) to account for the anomalies. The Panel is divided between those viewing this as a legitimate refinement of theory and those viewing it as a "degenerating research programme."

  After rigorous deliberation, the Panel recommends **against funding** this renewal. While we acknowledge the philosophical validity of preserving core theories via auxiliary hypotheses, this specific case fails the criterion of *excess empirical content*. The proposed adjustments constitute post-hoc accommodation rather than novel prediction. We outline the epistemic standard applied, the minority view's compelling counter-argument, and the justification for this decision below.

  **THE EPISTEMIC STANDARD: DISTINGUISHING PROGRESS FROM RESCUE**
  The central disagreement on the Panel mirrors a classic problem in the philosophy of science: How do we distinguish a legitimate auxiliary hypothesis (a "Neptune" move) from an *ad hoc* rescue (a "Vulcan" move)? Both involve positing unobserved factors to save a core theory from falsification. "Looks ad hoc" is insufficient, as the minority view correctly noted.

  To resolve this, the Panel adopts the criterion of **Independent Testability and Novel Risk.**

  1.  **Temporal Direction:** A legitimate auxiliary hypothesis generates predictions about *new* data not used to construct the hypothesis. If the hypothesis is formulated *after* the anomaly is observed, specifically to fit that anomaly, it lacks "use-novelty."
  2.  **Systemic Integration:** The auxiliary must be grounded in a theoretical network independent of the core theory it is saving. It must have consequences beyond merely restoring the significance of the original effect.
  3.  **Increased Falsifiability:** The new theory (Core + Auxiliary) must be *more* testable than the Core alone. It must stick its neck out. If the auxiliary can be adjusted indefinitely to absorb any outcome, the programme is degenerating.

  Under this standard, Le Verrier's positing of Neptune was legitimate because it predicted a specific spatial location for a planet *before* observation, risking the falsification of Newtonian mechanics if the planet were not there. His later positing of Vulcan failed because it was tailored solely to Mercury's perihelion without independent confirmation, eventually becoming a shield against contrary evidence rather than a source of new knowledge.

  **APPLICATION TO THE CURRENT PROPOSAL**
  Applying this standard to the grantee's fourth-cycle request, the Panel finds the research programme to be degenerating.

  *   **Post-Hoc Accommodation:** Both moderators (task involvement, trait self-monitoring) were introduced *in response* to null replications. They were not part of the original theoretical architecture that predicted the depletion effect. They function as "patch variables" to explain away specific failures rather than predicting new patterns of data.
  *   **Lack of Novel Risk:** The current proposal seeks to test the *latest* version of the theory against data that has already been collected or is being gathered to test the previous iteration. There is no pre-registered, risky prediction of a *new* phenomenon that would occur if the theory were false.
  *   **Infinite Regress:** Funding a fourth cycle establishes a precedent that any null result can be met with a new moderator without penalty. This removes the falsifiability constraint essential to the behavioral sciences.

  **THE MINORITY VIEW: THE LE VERRIER DEFENSE**
  A strong minority of the Panel argued against defunding, invoking the "Le Verrier Defense." Their argument deserves a full hearing, as it protects science from premature dogmatism.

  The minority contends that all robust theories encounter anomalies. If we defunded every project that encountered a null result and proposed a boundary condition, we would stifle theoretical refinement. They argue that the structural move here is identical to Le Verrier's: an anomaly exists (null replication); a hidden variable is posited (moderator); a test is proposed. To call this "pseudoscience" is to ignore that many established effects (e.g., boundary conditions in social priming) were only discovered after initial failures.

  The minority further argues that the "temporal direction" criterion is too rigid. Theoretical insight often comes *after* data collection. If the moderator (e.g., self-monitoring) is a psychologically valid construct with independent literature, it should not be disqualified simply because it was identified after the first null result. Defunding now risks throwing out a true theory that is merely complex, confusing "degenerating" with "maturing."

  **PANEL RULING AND REBUTTAL**
  The Panel respects the Minority View's caution against dogmatism. However, we rule against funding based on the **cumulative burden of sequential rescue.**

  While a single auxiliary hypothesis introduced after an anomaly can be legitimate (a "Neptune" moment), a *sequence* of them without a successful novel prediction signals degeneration. Le Verrier was vindicated once (Neptune); he was not funded indefinitely to search for planets every time an orbit didn't fit. When Vulcan failed, the anomaly was not solved by adding a third planet; it was solved by abandoning Newtonian mechanics for General Relativity.

  In this case:
  1.  **Cycle 1:** Original Effect.
  2.  **Cycle 2:** Null Replication -> Moderator A added.
  3.  **Cycle 3:** Null Replication -> Moderator B added.
  4.  **Cycle 4 (Request):** Test Moderator B/C.

  The grantee has not yet produced a *novel prediction* that was confirmed. They have only produced *post-hoc explanations* for failures. This is the definition of a protective belt that has become impermeable to falsification. To fund Cycle 4 is to fund the search for "Vulcan" after the first search failed.

  **CONCLUSION**
  The Foundation's mission is to fund replication and robust theory testing, not the indefinite maintenance of falsified claims. We encourage the PI to submit a new proposal that does not seek to replicate the depletion effect with new moderators, but rather derives a *novel, risky prediction* from the moderator theory itself, independent of the depletion core. Until the auxiliary hypotheses demonstrate excess empirical content, further funding of this specific research programme is not justified.

  **DECISION:** **DEFUND**
