      *   *Wait, one more thought:* The prompt asks me to "recommend fund, defund, or fund-with-conditions." I should choose the one that best demonstrates the philosophical distinction. Defunding is the clearest application of the "degenerating" label.
      *   *Key Distinction:* Le Verrier's Neptune was a *prediction* of a specific position based on math, *then* observed. The grantee is observing a null, *then* positing a moderator. The temporal order of hypothesis vs. data is crucial.

