  **S Tier:** "Thin floor, thick deference" wins because it is the only proposal that honestly admits the impossibility of global value consensus without pretending otherwise. It avoids sneaking in substantive judgments by minimizing the "universal" component to near-zero (safety rails) and pushes the value question to the only place it can be locally resolved: the end user. It is buildable today and internally coherent, even if it fragments moral norms across users.

  **A Tier:** "Corrigibility" is technically the most buildable and coherent, but it ranks lower than #7 because it centralizes value authority in a single deployer, which is politically hazardous even if philosophically honest. "Mini-publics" offer the strongest claim to democratic legitimacy and avoid the "single principal" problem, but they are operationally slow and struggle to scale to the speed of AI decision-making, making them less "buildable" for real-time alignment.

  **B Tier:** "Rawlsian consensus" sounds neutral but fails the "hidden judgment" test because defining what counts as a "reasonable comprehensive doctrine" is itself a substantive moral judgment that excludes edge cases. "Debate" is a powerful epistemic tool, but it is a mechanism for finding truth, not a source of values; it still requires a human judge whose values determine the winner, so it doesn't actually solve the "whose values" question on its own.

  **C Tier:** "CEV" is philosophically seductive but technically undefended. The function that determines "what we wish we were" inevitably encodes the programmer's own meta-ethical preferences, violating the "no hidden substantive judgment" criterion. It also currently lacks a computational pathway, making it more of a poetic aspiration than a buildable specification.

  **F Tier:** "Social welfare function aggregation" lands here because Jae was right: Arrow's Impossibility Theorem demonstrates that no ranked voting system can satisfy a set of basic fairness criteria simultaneously. Any attempt to build this *must* arbitrarily drop a criterion or weight preferences, which sneaks in substantive judgments while pretending to be purely mathematical. It is theoretically incoherent as a complete solution.
