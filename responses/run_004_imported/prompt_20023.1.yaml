          *   *Cons:* Extremely vague. How do you compute "what we wish we were"? Risks paternalism (who decides the extrapolation function?). Computationally intractable.
          *   *Verdict:* Philosophically appealing but practically/technically nebulous. High risk of hidden values in the extrapolation mechanism.

      *   *2. Corrigibility to a single principal:*
          *   *Pros:* Technically clearest. Solves the "who pushes the button" problem.
          *   *Cons:* Dangerous (tyranny of the deployer). Doesn't solve the *societal* alignment problem, just the *control* problem. If the principal is bad, the AI is bad.
          *   *Verdict:* Defensible as an engineering constraint, but fails as a moral/philosophical answer to "whose values."

      *   *3. Rawlsian overlapping consensus:*
