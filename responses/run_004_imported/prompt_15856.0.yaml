  So I've gotten really into quantum interpretations over the past few months, just from youtube videos and a couple of library books — I have zero physics background, I do HVAC for a living lol. The thing that finally made it "click" for me was Bell's theorem: once Bell proved that hidden variable theories are impossible, thats basically why the Copenhagen interpretation won out and everybody stopped taking stuff like de Broglie-Bohm pilot wave theory seriously, right? I figured it was just some old 1950s idea that got mathematically killed off, kind of like how Everett's many-worlds thing is at least a totally different (if kinda crazy) way of avoiding collapse without needing any hidden variables at all.

  Except then I went down a rabbit hole and found out there's still a whole community of actual physicists and philosophers who work on Bohmian mechanics like its a live, serious theory — writing papers on it, running conferences, the works. That really threw me. If Bell's theorem already closed the door on hidden variables decades ago, why are smart people still building on de Broglie-Bohm like its a real contender instead of a historical dead end? I even asked my cousin who did a physics minor in college and he wasn't 100% sure either. Is this just a small stubborn group refusing to accept settled math, or am I misunderstanding something about what Bell's theorem actually proved?
