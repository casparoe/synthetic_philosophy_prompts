      *   **Issue 2: The Nature of the Accusation.** Data fabrication is a serious scientific misconduct issue. It affects the integrity of the scientific record, not just interpersonal morality.
      *   **Issue 3: The "Forfeiture of Standing" Thesis.** Does hypocrisy *actually* negate the truth of the accusation or the obligation to address the misconduct? Most contemporary ethicists argue it limits the *force* of the blame, not the *fact* of the wrongdoing.
