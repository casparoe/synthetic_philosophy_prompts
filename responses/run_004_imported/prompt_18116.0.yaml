  Okay so this came up in my formal epistemology seminar (I'm only taking it for a requirement but I've somehow gotten really into it) and its been rattling around in my head since our study group met on Tuesday. We're on the unit about updating on conditionals and the prof assigned the Judy Benjamin problem as a discussion case -- it's originally from a Van Fraassen paper from the 80s, I think. Quick version of the setup in case it's useful: Judy's platoon gets dropped somewhere in a region split evenly into four zones -- Red-1, Red-2, Blue-1, Blue-2 -- each starting out equally likely (1/4 apiece), so Red and Blue are 50/50 overall. HQ sends a garbled radio message that amounts to "if you're in Red territory, it's 3x more likely you're in Red-2 than Red-1," and nothing at all is said about Blue. When you actually solve for the update that minimizes cross-entropy relative to the prior subject to that new constraint, Blue-1 and Blue-2 stay exactly equal to each other, but weirdly the overall Red/Blue split moves anyway -- Blue creeps up to around .53 and Red drops to around .47, even though the message was supposedly only about the inside of Red.

