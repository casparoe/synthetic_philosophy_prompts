      *   *Avicenna:* Mayer (and others) suggests the Flying Man's ignorance of the body is merely epistemic (he *happens* not to feel it), not metaphysical (the self *isn't* the body). It's an argument from introspection, which is fallible regarding ontology.

  3.  **Identify the Defense Strategy (Marmura, Kaukua, etc.):**
