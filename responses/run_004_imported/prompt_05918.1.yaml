      *   *Primitive Self-Awareness:* Avicenna posits that self-awareness is *dhātī* (essential/substantial) and immediate, not mediated by bodily senses or introspection of accidents.
      *   *The Inference:* It's not "I can imagine self without body, therefore distinct." It's "The self is presented to itself *as* self without bodily presentation; if the self were the body, bodily presentation would be necessary for self-presentation."
      *   *Ontological Implication:* The mode of access reveals the ontological status. If $A$ is known without $B$, and $B$ is the essence of $A$, then $A$ would be unknown. Since $A$ is known, $B$ is not the essence.

  4.  **Drafting the Argument - Section by Section:**

