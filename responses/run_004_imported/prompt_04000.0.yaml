answer: |-
  **Setting:** *The lobby of the conference hotel. It is 5:30 PM on a Saturday. The noise of the workshop crowd has thinned out. Two philosophers, ELENA and MARCUS, stand by a high table with lukewarm coffees.*

  **Characters:**
  *   **ELENA:** Defends a difference-making view (Lewis/Schaffer/Sartorio).
  *   **MARCUS:** Defends a process/physical-connection view (Dowe/Beebee).

  ***

  **MARCUS:** (Stirring sugar into his espresso) I thought the talk was excellent, Elena. Really clear. But you know I can't follow you into the dark woods on this one. When you say the friend's *not watering* the plant caused its death... you're asking me to accept that *nothing* caused *something*.

  **ELENA:** (Smiling) Here we go. I was wondering how long it would take. Look, Marcus, it's simple counterfactual dependence. If the friend had watered the plant, it would have lived. If he didn't, it died. The outcome depends on the absence of the action. That's causation.

  **MARCUS:** That's *dependence*. It isn't *production*. On my view—Dowe's view, mostly—causation requires a physical connection. A transfer of energy or a conserved quantity. There's a process running from the watering can to the soil to the roots. When the friend stays home watching TV, there is no process connecting him to the withered fern. There's just a gap. To say the gap *caused* the death is to reify nothingness.

  **ELENA:** But you're left with a gap in your own story. The plant died. We agree on that. We agree the friend promised to water it. We agree that if he'd acted, it would live. If your ontology can't accommodate that link, your ontology is too sparse for the world we actually live in. Schaffer is right: absences are real features of the world.

  **MARCUS:** Absences are real, sure. But they aren't *causes*. I'm happy to say the friend is *responsible* for the death. I'm happy to say his failure explains the death. But "causation" should be reserved for the physical glue holding the universe together. If you let omissions in as genuine causes, you open the door to the problem of profligacy. And this is where your view usually waves its hands.

  **ELENA:** Try me.

  **MARCUS:** Okay, take your case. The friend promised to water the plant. He didn't. The plant died. You say his omission caused the death. Fine. But what about the Queen of England? She didn't water the plant either. Neither did I. Neither did anyone in this coffee shop. By your logic of counterfactual dependence, if the Queen *had* watered the plant, it would have lived. So, her omission is also a cause of the plant's death.

  **ELENA:** The classic "too many causes" objection.

  **MARCUS:** It's fatal, Elena. If you say yes, she is a cause, then causation is everywhere. Every time anything happens, it is caused by the infinite number of things that *didn't* prevent it. Causation loses its explanatory power. It becomes trivial. If you say no, she isn't a cause, then you need a principled distinction between the friend's omission and the Queen's omission that isn't just pragmatic. You can't just say "we don't *talk* about the Queen." You need a metaphysical reason why her non-action isn't a cause while the friend's is.

  **ELENA:** I'm not going to bite the bullet and say the Queen is a cause. That's absurd. But I'm also not going to retreat to pure pragmatics and say it's just a matter of conversational context. I think there's a substantive metaphysical distinction here, and it lies in the *normality* of the processes involved.

  **MARCUS:** Normality? That sounds like an epistemic criterion, not an ontological one.

  **ELENA:** Not necessarily. Think of it this way, following Hitchcock and Knobe. The causal structure of a situation isn't just a bare physical map; it includes the default expectations of the system. The friend's omission is a *deviation* from a specific, salient course of events that was set in motion by the promise. The Queen's non-action is part of the background.

  **MARCUS:** So you're building norms into the metaphysics?

  **ELENA:** I'm saying the *relata* of causation are contrastive. When we ask "Did the friend's omission cause the death?", we are implicitly asking "Did the friend's *failure-to-water-rather-than-watering* cause the death *rather-than-survival*?" The Queen's situation doesn't fit that contrast class. Her default state is "not watering the friend's plant." The friend's default state, given the promise, was "watering the plant." The deviation from the default is what picks out the specific causal relation. It's not just that we *ignore* the Queen; it's that her non-action doesn't constitute a deviation in the relevant causal model.

  **MARCUS:** (Sips coffee, skeptical) You're smuggling normativity into the physics. You're saying a promise changes the metaphysical structure of the universe so that a non-action becomes a "deviation." I'd say the promise changes the *moral* landscape, not the causal one. And that leads me to my second worry. You seem to think our metaphysics of causation has to track our practices of assigning responsibility.

  **ELENA:** Don't they? If we have a concept of causation that is completely unmoored from how we assign blame and praise, what is it for? Causation is the tool we use to navigate the world, to intervene, to hold agents accountable. If the friend is morally responsible, it's because he causally influenced the outcome. If you sever that link, you make responsibility magical.

  **MARCUS:** I think you have it backward. We can hold the friend responsible *precisely because* he didn't cause the death in the physical sense, but he had a duty to intervene. Beebee argues this well. We treat omissions as "quasi-causes" for the purposes of the law and morality. We pretend they are causes because it's useful for social regulation. But the metaphysics shouldn't be held hostage to the law.

  **ELENA:** So you're okay with a gap? A world where someone is legally liable for a death they didn't causally contribute to?

  **MARCUS:** I'm okay with a gap where liability tracks *counterfactual dependence plus duty*, while causation tracks *physical process*. It keeps the ontology clean. If you mix them, you end up with a metaphysics that changes depending on whether a promise was made. That seems unstable.

  **ELENA:** It seems unstable only if you think physics is the only layer of reality. But we're cognitive beings living in a social world. The "promise" creates a real constraint on the space of possibilities. Schaffer would say the causal relation is extrinsic; it depends on the surrounding context. The Queen is extrinsically unrelated to the plant's survival conditions in a way the friend is not. My view respects the intuition that the friend *did* something (or failed to) that mattered metaphysically, not just legally.

  **MARCUS:** But does it matter for *your* research? (Gestures to the student's notebook) You're studying folk judgments. My bet is the folk are process theorists at heart. If you ask them, "Did the Queen cause the death?" they'll say no. If you ask, "Did the lack of water cause the death?" they'll say yes. They distinguish between the physical lack and the agent's omission.

  **ELENA:** Maybe. But if you ask, "Did the friend's failure to water cause the death?" after establishing the promise, I think they'll say yes. And they'll say it because they see the omission as a difference-maker. The question is whether that intuition is a bug or a feature. I think it's a feature. It shows that human causal cognition is designed to track interventions and responsibilities, not just billiard-ball collisions.

  **MARCUS:** And I think it shows human cognition is prone to conflating explanation with causation. We *explain* the death by citing the friend's negligence. That doesn't make the negligence a physical cause. (Pauses) Look, I don't think we'll settle the metaphysics over lukewarm coffee. But for your experiments, here's the challenge: Can you disentangle the *moral* blame from the *causal* judgment? If you vary the moral valence—say, the friend *wanted* the plant to die versus he simply forgot—does the causal attribution change?

  **ELENA:** That's exactly what I'm testing. If causal judgments shift with moral valence, that supports the idea that norms are built into the causal concept itself. Which supports my difference-making view over your physicalist one.

  **MARCUS:** (Chuckles) Or it supports the idea that people are confused.

  **ELENA:** Or it supports the idea that your definition of "cause" is too narrow for the work the concept actually does.

  **MARCUS:** Touché. (Raises coffee cup) To omissions.

  **ELENA:** (Clinks cup) To difference-making.

  ***

  **[End of Dialogue]**
