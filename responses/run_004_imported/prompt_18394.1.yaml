answer: |-
  Here are 8 escalating interview questions with tailored follow-ups. They are designed to start broad and then corner the "liberal smuggling" defense by forcing the conversation onto internal Confucian grounds (flourishing, harmony, coherence) rather than external Western grounds (rights, autonomy).

  ### 1. The Status Quo Objection (Standard Setup)
  **Question:** "A common criticism of Ames and Rosemont's reading is that if the self is *constituted* by roles like ruler/subject or husband/wife, it seems to metaphysically lock people into the social hierarchy they were born into. If I *am* my roles, how can I ever criticize the structure of those roles without contradicting my own existence?"

  **Follow-up (The Vocabulary Trap):** "I anticipate the response that this criticism relies on Western 'autonomy' or 'rights,' which role ethics rejects. But I'd like to challenge you to restate that worry *without* using liberal vocabulary. Can you describe the harm of a rigid hierarchy using only Confucian terms—like *harmony*, *flourishing*, or *Ren* (benevolence)? If a role produces suffering, does it fail by *its own* standards, or do we need outside standards to judge it?"

  ### 2. Internal Criteria for "Bad" Roles
  **Question:** "Following up on that: If we are judging roles by internal Confucian standards rather than liberal rights, what is the specific metric? Is it simply whether the relationship is reciprocal? Because historically, reciprocity wasn't always equal—the wife's duty differs from the husband's."

  **Follow-up:** "So if reciprocity doesn't mean equality, how do we distinguish between a 'difficult but ethical' role and an 'oppressive' one? Is there a point where the demand of a role becomes so one-sided that it actually destroys the possibility of *Ren* (humaneness) in the other person, and if so, who gets to make that call?"

  ### 3. Role Conflict (The Father/Son Case)
  **Question:** "I want to move to role conflict. There's that famous case in the *Analects* (13.18) where Confucius suggests a son should cover for his father who stole a sheep, prioritizing the father-son role over the civic role of 'law-abiding citizen.' How does role ethics resolve it when two constitutive roles demand opposite actions?"

  **Follow-up:** "If the answer is that the father-son role is 'more fundamental' than the civic role, doesn't that just create a fixed hierarchy of roles? How do we know which role takes precedence without smuggling in an external principle—like 'family loyalty is more important than justice'—that looks suspiciously like a universal rule?"

  ### 4. The "Practical Wisdom" Dodge
  **Question:** "Defenders often say these conflicts aren't solved by rules but by *practical wisdom* or 'ritual propriety' (*Li*)—you just have to feel out the right response in the moment. Is 'use practical wisdom' actually a method for making ethical decisions, or is it a way of saying 'there is no method'?"

  **Follow-up:** "If there's no method, how is this ethics teachable? If I'm a student trying to learn role ethics, and I make a call on a conflict that you disagree with, how do you correct me? Do you appeal to a tradition, or do you just say 'you didn't feel it right'? Where is the accountability?"

  ### 5. Leaving Bad Roles (The Abusive Marriage)
  **Question:** "Let's apply this to a modern context. If a person is in an abusive marriage, liberal ethics says they have a right to leave because they are an individual prior to the role. But if the Confucian self is *constituted* by being a 'wife' or 'husband,' what does leaving that role actually look like? Is it quitting a job, or is it a kind of self-destruction?"

  **Follow-up:** "If it's closer to self-destruction or a metaphysical rupture, does role ethics have a ritual or a process for *ending* roles ethically? Or does the theory only tell us how to *perform* roles, leaving people stranded when a role becomes untenable?"

  ### 6. Role Revision vs. Role Rejection
  **Question:** "You might say the person isn't destroying themselves but *revising* the role—redefining what 'wife' means in a new context. But where is the line between revising a role and rejecting it? If I revise the role of 'subject' so much that I'm no longer obeying the ruler, am I still a subject?"

  **Follow-up:** "If the definition of the role is flexible enough to include resistance, doesn't that mean there *is* a 'bare self' underneath doing the interpreting? Who is the 'I' that decides the role of 'wife' or 'subject' needs to be redefined if not an agent standing slightly outside the role?"

  ### 7. Social Progress and Reform
  **Question:** "This brings us to social change. Liberal ethics can say 'this system is unjust, tear it down.' If role ethics says we are made of the system's relationships, how does large-scale reform happen? Do we have to wait for the roles to evolve slowly, or can people actively push for new structures?"

  **Follow-up:** "If people push for new structures, they are essentially acting against their current constitutive roles. Does role ethics view social reformers as ethical heroes, or as people failing in their current roles? Can you be a 'good Confucian' and a revolutionary at the same time?"

  ### 8. The "Ethics" Label (The Meta-Question)
  **Question:** "My last question is about the label 'ethics' itself. Ethics usually implies some critical distance—the ability to step back and ask 'ought I to do this?' If role ethics removes that distance by making me *one with* my obligations, are we still doing ethics, or are we doing sociology or etiquette?"

  **Follow-up:** "If the answer is that the critical distance comes from *other* roles (like the role of 'teacher' or 'friend'), does that mean morality is just a power struggle between which role is louder in my head? Or is there a normative standard outside of the roles themselves that keeps the whole thing from just being 'might makes right'?"
