answer: |-
  **Setting:** *The courtyard of the conference center, late afternoon. The air is cool. ELIAS (50s, rumpled blazer, holds a lukewarm coffee) and SARAH (40s, sharp eyes, leaning against a stone pillar) have just stepped out of a panel on "Digital Contagion and Diagnostic Ontology."*

  **Elias:** That talk on the tic clusters was uncomfortable. Not because of the data, but because of the relief in the room. Everyone exhaled when the speaker mentioned "functional neurological disorder." It's a permission slip to stop looking for a virus and start looking at the algorithm.

  **Sarah:** It's a permission slip to stop blaming parents and start looking at neural circuitry that's been hijacked. But I saw you shaking your head when she cited Hacking.

  **Elias:** I wasn't shaking my head at Hacking. I was shaking it at the way everyone treated "looping effects" as a cute sociological footnote. They think it's a bug in the system. I'm arguing it's the architecture. If Hacking is right about interactive kinds, then categories like ADHD or DID aren't just *influenced* by social media; they are *constituted* by the feedback loop between the classification and the classified. You can't peel the label off to find the "real" disorder underneath.

  **Sarah:** That's the hard constructionist line. And it's where you lose the clinic. Look, I grant the loop. I grant that a teenager watching TikTok videos about dissociation will learn to narrate their distress through the vocabulary of alters. That's undeniable. But that's performance. That's the *expression* of the distress. It is not the *substrate*.

  **Elias:** Why assume a distinction between expression and substrate in human kinds? If I classify a quark, the quark doesn't care. It's an indifferent kind. If I classify a teenager as "having tics," the teenager becomes a different causal agent. They attend to the tics, they suppress them, they amplify them, they build an identity around them. The classification changes the homeostasis of the person. So, the "kind" is a moving target. It cannot be a natural kind because natural kinds are supposed to be stable nodes in the causal structure of the world.

  **Sarah:** "Stable" doesn't mean "static." It means "projectable." If I say "gold," I can project its conductivity. If I say "ADHD," I can project certain executive function deficits, regardless of whether the patient calls it "focus issues" or "neurodivergence." The looping is noise. My position is that the RDoC program—Research Domain Criteria—is designed specifically to filter out that noise. We are looking for circuits, not narratives.

  **Elias:** But the circuit is plastic. The brain you are scanning is a brain that has been shaped by the very diagnostic categories you're using to scan it. You're chasing a shadow that moves when you step toward it.

  **Sarah:** Okay, let's press on that. You say interactive kinds *cannot* be natural kinds in principle. That's a strong modal claim. What would it take to convince you otherwise? Short of "completing neuroscience," which is a horizon, not a destination. If tomorrow we found a biomarker for this tic cluster—a specific inflammatory profile in the basal ganglia that predicted the onset with ninety percent accuracy, independent of self-report—would you still say it's not a natural kind?

  **Elias:** If the biomarker predicted the behavior *regardless* of whether the subject knew about the classification? Yes, I'd concede. But that's the rub. In psychiatry, the subject *always* knows. Or rather, the classification enters the ecosystem of the subject. But let's turn your challenge around. Take general paresis.

  **Sarah:** The syphilis example. The gold standard for psychiatric realism.

  **Elias:** Exactly. In the 19th century, "general paresis" was a looping kind. It was a moral diagnosis, then a neurological one. Behaviors shifted as the classification shifted. Then they found the spirochete. Suddenly, it was an indifferent kind. The bacteria didn't care what we called it. So, my question to you is: Why does the looping story dissolve ADHD but not general paresis? If looping is ubiquitous in psychiatry, why did paresis stop looping once we found the cause?

  **Sarah:** Because the cause of paresis was external to the cognitive agency of the patient. The spirochete operates independently of the patient's beliefs about the spirochete.

  **Elias:** But the *symptoms* didn't. The experience of paresis changed once it was medicalized. Patients stopped confessing sins and started seeking treatment. The *kind* "paresis patient" changed its behavior.

  **Sarah:** The *social role* changed. The *pathology* didn't. The brain rot was the same. Here's the distinction: Looping affects the *persona*, not the *mechanism*. In the tic clusters, the mechanism *is* the suggestion. It's a top-down predictive processing error. In paresis, the mechanism was bottom-up tissue destruction. You're conflating the mechanism of the disorder with the mechanism of the *diagnosis*.

  **Elias:** That's a clean distinction, Sarah. But how do you know, *a priori*, that ADHD or DID isn't like the tics? What if the "mechanism" of ADHD is partly constituted by the demand for attention in a digital economy? If the environment changes, the "kind" changes. If the "kind" changes based on the environment, it's not a natural kind; it's a historical kind.

  **Sarah:** I'm not saying ADHD is a spirochete. I'm saying there are neurocognitive profiles—variations in dopamine transport, delay aversion, working memory capacity—that exist independently of the label. A child in 1820 had those deficits. They weren't called "ADHD." They were called "fidgety phil" or "defiant." The label didn't create the deficit.

  **Elias:** But did it create the *syndrome*? Hacking's point about dynamic nominalism is that the label creates a space for the behavior to cohere. Before "multiple personality," there were people with disjointed memories. But they didn't have *alters*. They had demons, or melancholy. The *structure* of the dissociation changed to fit the available taxonomy. So, when you scan a brain with DID, you aren't scanning a natural kind. You're scanning a brain that has learned to dissociate in a very specific, culturally available way.

  **Sarah:** Fine. The *presentation* is culturally scaffolded. I'll give you that. But the *capacity* to dissociate, the *vulnerability* of the neural integration—that's the natural kind. RDoC isn't trying to find "DID." It's trying to find "acute threat response" or "cognitive control systems." Those are the natural kinds. The DSM categories are just clumsy buckets we use until we can map the buckets to the circuits.

  **Elias:** Ah, so you're retreating to a lower level of description. "Cognitive control systems" are your indifferent kinds.

  **Sarah:** They are more stable. They are cross-species. A mouse has a threat response system. A mouse does not have "DID."

  **Elias:** But a mouse doesn't know it's being studied. A mouse doesn't read papers on threat response. As soon as you bring it back to the human level, where the philosophy matters, the loop re-engages. If you tell a patient, "Your threat response is hypersensitive," they change their relationship to their fear. They become a "person with a hypersensitive threat response." The loop closes again.

  **Sarah:** So your argument is that *any* knowledge that reaches the subject dissolves the natural kind status?

  **Elias:** I'm arguing that for human kinds, the knowledge *is* part of the causal chain. You can't bracket it out.

  **Sarah:** Then we have reached the definitional wall. You are defining "natural kind" as "a category that remains invariant under reflection." I am defining it as "a category that supports successful intervention and prediction."

  **Elias:** I'm defining it as "a category that carves nature at its joints." If the joint moves when you touch it, you aren't carving; you're sculpting.

  **Sarah:** But we sculpt *with* the grain. That's the empirical claim. If I treat the "tic cluster" as a social contagion, the interventions fail for the kids who have underlying organic vulnerabilities. If I treat it as purely biological, I fail the kids who are mimicking. The realism isn't about denying the loop; it's about betting that there is a underlying distribution of vulnerabilities that the loop flows *over*.

  **Elias:** And I'm betting that the flow *is* the river. But here is where I worry I'm being dogmatic. If you showed me a biomarker that predicted the tic onset *before* social media exposure, in isolated populations...

  **Sarah:** Then you'd admit it's a natural kind?

  **Elias:** I'd admit it's a *biological* kind. But is it a *psychiatric* kind? Psychiatry deals with the person, not just the brain. If the psychiatric category requires the person's participation, and the participation is shaped by the category... look, maybe the disagreement isn't about the world. Maybe it's about utility.

  **Sarah:** How so?

  **Elias:** You want a taxonomy that maximizes biological intervention. I want a taxonomy that maximizes understanding of agency. If I tell a patient "You have a natural kind," I relieve guilt but remove agency. If I tell them "You are caught in a looping effect," I restore agency but risk blame.

  **Sarah:** That's a pragmatic distinction, not an ontological one.

  **Elias:** Is it? Ontology in psychiatry *is* pragmatics. The "kind" exists to do work. If the work changes, the kind changes.

  **Sarah:** I disagree. The truth of the kind is independent of the work. If I diagnose you with a tumor, the truth of the tumor doesn't depend on whether I operate or pray.

  **Elias:** But if I diagnose you with "adolescent tic disorder," the truth of the disorder *does* depend on whether you believe me.

  **Sarah:** *[Pauses, looks out at the courtyard]* Okay. Let's try this. We agree that looping happens. We agree that general paresis stopped looping because the cause was indifferent to the patient's mind. We disagree on whether the causes of ADHD or functional tics are indifferent. You think they are inherently sensitive to classification. I think they are insensitive, but currently obscured by the noise of classification.

  **Elias:** That sounds right.

  **Sarah:** So this *is* an empirical question. It's not definitional. It's about the causal depth of the mechanism. If the mechanism is "predictive processing based on social cues," then you win—it's an interactive kind. If the mechanism is "dopaminergic dysregulation that *attracts* social cues," then I win—it's a natural kind that interacts.

  **Elias:** I can accept that. But I would add a constraint: Even if you find the dopaminergic dysregulation, as long as the *diagnosis* alters the dopamine via stress or expectation, the kind remains interactive. You can't isolate the system from the description of the system.

  **Sarah:** In quantum mechanics, the observer affects the particle. We don't say the electron isn't a natural kind. We say measurement is part of the physics.

  **Elias:** *[Smiles]* Careful. If you go there, you're admitting that psychiatry requires a new ontology entirely. You can't use "natural kind" in the classical sense anymore.

  **Sarah:** Maybe "natural kind" is the wrong phrase. Maybe "stable causal structure."

  **Elias:** I'll settle for "stable enough to treat." But don't tell the teenagers they're just "biological kinds." They're watching the videos. They're looping.

  **Sarah:** And if I don't tell them there's biology, they'll think they're just faking it. And the suffering is real.

  **Elias:** The suffering is real. The categories are the maps. I'm just saying the territory shifts when we draw the map.

  **Sarah:** Then we'd better keep redrawing.

  **Elias:** Agreed. But let's not pretend the map is the territory.

  **Sarah:** And let's not pretend there's no territory.

  *[They finish their coffees. The bell for the next session rings.]*
