      *   *Check:* Did I address the "expertise" point sufficiently? *Fix:* Ensure I distinguish between "gut reaction" and "considered judgment."
      *   *Check:* Did I address the replications? *Fix:* Make this the first pillar of the argument. If the phenomenon isn't robust, the normative conclusion doesn't follow.

