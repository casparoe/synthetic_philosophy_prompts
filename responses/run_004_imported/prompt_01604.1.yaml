  Constraint: $Q(RHQ) / (Q(RHQ) + Q(R2)) = 0.75 \Rightarrow Q(RHQ) = 3 Q(R2)$.
  MinInfo solution preserves the ratio between Red and Blue *cells* relative to each other? No.
  The MinInfo solution sets $Q(BHQ) = k \cdot P(BHQ)$ and $Q(B2) = k \cdot P(B2)$ for some constant $k$, and adjusts Red similarly but differently.
