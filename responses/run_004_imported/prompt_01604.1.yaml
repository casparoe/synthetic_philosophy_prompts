      *   *Better explanation for Elias:* The constraint $P(HQ|Red)=3/4$ is a restriction on the *shape* of the distribution within Red. To satisfy this while changing the prior as little as possible (in terms of information distance), the optimization process effectively treats the Red sector as "more constrained" and thus relatively less probable than the unconstrained Blue sector. It's like the constraint adds "tension" to the Red side.

