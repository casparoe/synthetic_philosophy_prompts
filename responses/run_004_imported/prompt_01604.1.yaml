  *(Self-Correction on the Math/Logic)*: I need to be careful not to misrepresent the MinInfo justification. The justification is that MinInfo minimizes the *information gain* required to move from Prior to Posterior. The argument is that shifting probability to Blue is actually *less* informative than shifting it within Red in a way that violates the uniformity of the prior ratio between Red and Blue. Wait, that's not quite right.
  *Correct MinInfo logic:* MinInfo finds the distribution $Q$ closest to $P$ (in KL divergence) such that $Q(HQ|Red) = 0.75$.
  $D_{KL}(Q||P) = \sum Q(i) \log(Q(i)/P(i))$.
  The solution preserves the odds ratio between the Red partition and the Blue partition *unless* the constraint forces a change. But here, the constraint is internal to Red.
  Actually, the standard defense is that the constraint $P(HQ|Red)=0.75$ is logically compatible with many distributions. MinInfo picks the one that assumes *nothing else* changed. The "Blue boost" arises because the constraint makes the Red sector "more specific" (lower entropy within Red), and to minimize global divergence, the optimizer shifts mass to the higher-entropy (Blue) sector.
