      *   **The Woodwardian (let's call him "Marcus"):** Focuses on manipulation, testing, and invariance. He needs to defend the utility of interventions even if they rely on some causal knowledge. He should be pragmatic about the goal of causal inquiry (explanation vs. metaphysics).

