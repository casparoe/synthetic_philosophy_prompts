      *   *The "Trick":* Let $a_0$ be the optimal action without data. Let $a(d)$ be the optimal action given data $d$. The utility of $a(d)$ given $d$ is $\ge$ the utility of $a_0$ given $d$. Why? Because $a(d)$ is chosen specifically to maximize utility for that specific $d$. Since this holds for *every* possible $d$, it holds on average.
