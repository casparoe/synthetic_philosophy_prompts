answer: |-
  It's great to hear from someone who's spent time in the trenches of experimental physics. You know better than most that "free" data is a myth—there's always a cost in beam time, computing cycles, or grad student sanity—but let's stick to the theoretical ideal for a moment.

  Your hunch about Good's Theorem is essentially correct, but to make it airtight, we need to tighten the screw on *why* ignoring the evidence is always an option. As for Hirshleifer, you've spotted a genuine tension, but it's not a contradiction; it's a boundary condition.

  Here's the back-of-the-envelope breakdown.

  ### 1. The Intuition Behind Good's Theorem

  You said: *"Looking can only open up better options and never close any off."*

  That is 90% of it. The remaining 10% is the realization that **you are the one choosing the action after seeing the data.**

  Let's frame it in terms of optimization, which should feel familiar.
  Suppose you have a set of actions $A$ (e.g., "claim discovery," "set upper limit," "run detector longer").
  Suppose you have a current state of belief (prior) $P$.
  You want to maximize expected utility $U$.

  **Without new data:**
  You calculate the expected utility for every action based on your prior, pick the best one, and lock it in. Let's call the maximum expected utility $V_{prior}$.
  $$V_{prior} = \max_{a \in A} E[U(a) | \text{prior}]$$

  **With new data (let's call the datum $D$):**
  You don't commit to an action yet. You wait for $D$ to arrive. Once $D$ arrives, you update your belief to $P|D$. Now you choose the action that is best *for that specific $D$*.
  $$V_{post}(D) = \max_{a \in A} E[U(a) | \text{prior}, D]$$

  **The Trick:**
  Good's Theorem relies on a simple property of the $\max$ function. For *any specific outcome* $D$, the action you choose *after* seeing $D$ will yield utility at least as high as the action you would have chosen *before* seeing $D$.

  Why? Because the "old" action is still in the set $A$.
  If the new data $D$ confirms your prior, the "old" action is still the best one, so $V_{post}(D) = V_{prior}$.
  If the new data $D$ contradicts your prior, the "old" action is no longer optimal, so you switch to a new action, and $V_{post}(D) > V_{prior}$.

  Since $V_{post}(D) \ge V_{prior}$ for **every possible** $D$, the average (expected value) over all possible $D$ must also be $\ge V_{prior}$.

  **The Physicist's Analogy:**
  Imagine you're deciding whether to cut on a kinematic variable.
  *   **Blind:** You set the cut based on Monte Carlo.
  *   **Looking:** You check the sidebands first.
      *   If the sidebands look like background (as expected), you keep the MC cut. (Value = Same)
      *   If the sidebands show a weird resonance, you tighten the cut to exclude it. (Value = Better)
      *   You are never *forced* to use a worse cut just because you looked at the sidebands. You retain the agency to act as if you were blind.

  **The Caveat:** This assumes the information is **free** and **private**. If looking costs money (beam time), you subtract that cost. If looking forces you to publish immediately (institutional constraint), you lose the "option to ignore," and the theorem breaks.

  ### 2. The Hirshleifer Effect: Why It's Not a Counterexample

  The Hirshleifer effect is fascinating because it feels like a violation of Good's Theorem. In a classic insurance market example:
  *   **Scenario A (Ignorance):** Two agents don't know who will get sick. They buy insurance from each other to smooth risk. Both are happy (high ex-ante utility).
  *   **Scenario B (Information):** A test reveals exactly who will get sick. The "healthy" person refuses to insure the "sick" person (adverse selection vanishes because selection is now perfect). The sick person is uninsured and destitute. The "system" is worse off.

  So, information arrived, and welfare dropped. Did Good's Theorem fail?

  **No. Good's Theorem assumes a single agent against a passive nature.**
  Good's setup is: *Agent vs. World.* The payoff structure of the world does not change based on what the Agent knows.

  Hirshleifer's setup is: *Agent vs. Agent vs. Market.* The payoff structure **depends on what other people know.**

  Here is where the intuition from Part 1 breaks down: **The "Option to Ignore" disappears.**

  In Good's Theorem, if I see data $D$ that I don't like, I can choose action $a_{old}$. The universe allows this.
  In Hirshleifer's market, if I see data $D$ (I know I'm sick), I want to buy insurance. But the *other* agent also sees $D$ (or the market price reflects $D$). They **refuse to sell me the contract** that was available when we were both ignorant.

  The set of available actions $A$ has shrunk.
  *   **Ignorant State:** Action set includes "Buy Insurance at pooled rate."
  *   **Informed State:** Action set is "Buy Insurance at actuarial rate" (which is effectively "No Insurance" for the high risk).

  Because the information changed the *strategic environment* (the other guy's willingness to trade), you can no longer execute the "ignorant" action. You are forced into a worse equilibrium.

  **The "Solitaire vs. Poker" Distinction:**
  *   **Good's Theorem is Solitaire.** Knowing the next card in the deck never hurts your expected score. You play the hand you're dealt; the deck doesn't care what you know.
  *   **Hirshleifer is Poker.** If everyone sees your hand, you can't bluff. The value of your chips drops. The information didn't change the cards; it changed the *rules of betting* by aligning everyone else's knowledge with yours.

  ### 3. Where the Guarantee Stops

  To answer your specific question on where the theorem's guarantee stops applying:

  1.  **Strategic Interaction:** If your payoff depends on the actions of other agents who also update on the information, Good's Theorem does not hold. The information can destroy risk-sharing mechanisms (like insurance) or bargaining leverage.
  2.  **Costly Information:** Trivial, but worth stating. If $Cost(Data) > Value(Data)$, you're net negative. Good's Theorem proves $Value(Data) \ge 0$, not $Net \ge 0$.
  3.  **Commitment Constraints:** If acquiring the information legally or institutionally forces you to act on it (e.g., a fiduciary duty to act on inside information, or a lab policy that says "if you look at the signal region, you must publish"), you lose the "option to ignore." You have effectively removed the $\max$ operator from the equation because your action is no longer a free variable conditioned on $D$.

  ### Summary for the Labmate

  Good's Theorem holds because **information gives you an option without taking any away.** You can always act as if you didn't know.

  The Hirshleifer Effect happens because **information takes options away.** It collapses the set of mutually agreeable trades. The market won't let you make the "ignorant" bet anymore.

  So, you were right to trust your intuition on Good, but your radar was also right to ping on Hirshleifer. They operate in different domains: one is decision theory (man vs. nature), the other is game theory/economics (man vs. man).

  Cheers to the retirement. May your priors be well-calibrated and your systematic errors negligible.
