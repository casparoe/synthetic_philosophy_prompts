answer: |-
  This is one of the oldest and most profound problems in philosophy, known as the **problem of testimony**. You and your friend are essentially reenacting a debate that has occurred between philosophers like David Hume (who argued we should weigh testimony against experience) and Thomas Reid (who argued that trust is a fundamental principle of human nature).

  Your friend is not intellectually lazy, but she has reasoned her way into a position that is **practically impossible and theoretically incoherent.** However, her anxiety is a necessary corrective to your own habit, which is **practically necessary but vulnerable to systemic failure.**

  Here is a framework for finding the defensible line between your positions, and a set of criteria for determining when trust is reasonable.

  ### 1. The Incoherence of Radical Self-Reliance
  Your friend's position, "Epistemic Self-Reliance," collapses under its own weight for three reasons:

  *   **The Paradox of Transmission:** As you noted, she likely learned the *value* of verification from a teacher, a book, or a mentor. If she cannot trust testimony, she cannot trust the lesson that taught her to distrust testimony. Her position is self-undermining.
  *   **The Division of Cognitive Labor:** Modern knowledge is too vast for any one mind. As philosopher Philip Kitcher argues, science functions as a "division of cognitive labor." If every data scientist had to build their own computer from sand to verify their code, or every biologist had to grow their own agar, progress would halt. We *must* outsource verification to function.
  *   **The "In Principle" Trap:** She claims she won't believe anything she couldn't "in principle" verify. But could she, personally, verify the moon landing? Unless she is an aerospace engineer with access to telemetry data, the answer is no. She is relying on *her interpretation* of her ability to verify, which is itself a form of trust in her own education.

  **Verdict:** Her strict rule is incoherent. If followed literally, it leads to epistemic solipsism (knowing only your own immediate sensations).

  ### 2. The Vulnerability of Default Trust
  Your position is the standard human operating system. We are "epistemic dependents." This is efficient, but your unease is justified because this system has failure modes:

  *   **Institutional Capture:** If all the experts you trust belong to the same institution, funding structure, or social circle, "nobody I trust has said otherwise" doesn't mean the claim is true; it means the consensus is insulated.
  *   **The "Telephone" Effect:** Your friend's family story highlights the degradation of information over time. Oral history is low-fidelity. Scientific data is (ideally) high-fidelity. Treating them as the same category of "testimony" is a mistake.
  *   **Passive vs. Active Trust:** There is a difference between trusting a claim because you have evaluated the *process* that produced it, and trusting a claim simply because it is convenient. Your current fact-checking method (calling a second expert) is good, but it only checks for consensus, not validity.

  ### 3. Drawing the Defensible Line: Epistemic Vigilance
  The line is not between "Trust" and "Verify." It is between **Blind Credulity** and **Epistemic Vigilance.**

  You do not need to verify the *data* yourself; you need to verify the *reliability of the system* that produced the data. You are not checking the math; you are checking the integrity of the mathematicians and the robustness of the peer review.

  Here are four criteria to determine how much corroboration a claim needs before you accept it:

  #### A. Consilience (Convergence of Evidence)
  *   **The Test:** Do independent lines of evidence point to the same conclusion?
  *   **Application:** We know the moon landing happened not just because NASA said so, but because the Soviets tracked the signals, independent astronomers observed the retroreflectors left on the surface, and the geology of the moon rocks matches no Earth geology.
  *   **The Line:** If a claim relies on a single source or a single methodology (like your friend's grandmother's story), demand high corroboration. If a claim is supported by physics, geology, telemetry, and international observation (like the age of the universe), your default trust is rational.

  #### B. Incentive Structures
  *   **The Test:** Does the expert gain more by telling the truth or by lying?
  *   **Application:** In science, the highest prestige comes from *disproving* established theories. A physicist gains fame by showing the universe is *not* 13.8 billion years old. In marketing or politics, the incentive is often to persuade regardless of truth.
  *   **The Line:** Trust claims from communities where the incentive structure rewards error-correction (science, rigorous journalism). Be skeptical of communities where the incentive structure rewards conformity (ideology, corporate press releases).

  #### C. Accessibility of Dissent
  *   **The Test:** Is it possible for a qualified person to disagree publicly without being silenced?
  *   **Application:** In your friend's family, the cousin's account surfaced only after the grandmother died. The "data" was suppressed by social hierarchy. In good science, dissent is published.
  *   **The Line:** If you cannot find a credible dissenter, ask why. Is the evidence overwhelming, or is the field gated? If the latter, your "nobody has said otherwise" heuristic is dangerous.

  #### D. The Cost of Error
  *   **The Test:** What happens if this claim is wrong?
  *   **Application:** If you report the universe's age wrong, the cost is embarrassment. If you report a cancer mutation risk wrong, the cost is human health.
  *   **The Line:** The higher the stakes, the higher the burden of "self-reliance" you should adopt. You don't need to sequence the genome yourself, but you should understand the sample size, the control group, and whether the study was replicated.

  ### 4. A New Protocol for Your Work
  You don't need to become your friend, but you should upgrade your "unreflective habit." Instead of just phoning a second expert to see if they agree, try this:

  1.  **Follow the Disagreement:** Don't just ask, "Is this right?" Ask, "Who disagrees with this, and what is their best argument?" If the expert says "no one disagrees," be suspicious.
  2.  **Check the Machinery:** You don't need to run the experiment, but you should understand *how* the result was generated well enough to know if it *could* be falsified.
  3.  **Distinguish Memory from Record:** Your friend's trauma regarding her grandmother is specific to **human memory**, which is reconstructive and unreliable. Do not equate the fragility of oral history with the fragility of recorded, instrumented data. One degrades over time; the other (ideally) does not.

  ### Conclusion
  Your friend is suffering from a kind of **epistemic trauma.** The discovery that her grandmother's story was flawed shook her faith in all testimony. She is trying to solve a social problem with an individual solution.

  She is right that we are too intellectually lazy, but wrong that the solution is individual verification. The solution is **better social verification.**

  You are justified in taking experts at their word, provided those experts are part of a system designed to punish them if their words are false. Your job as a writer is not to re-derive the physics, but to audit the health of the community producing the physics. If the community is open, competitive, and transparent, your trust is not a weakness; it is a rational reliance on the division of labor. If the community is closed, insular, or incentivized to lie, then your friend's skepticism is the only safe harbor.

  **The defensible line is this:** Trust the *process*, not just the *person*. And if the process is opaque, admit you don't "know" the thing—you only "believe" it. There is intellectual honesty in that distinction.
