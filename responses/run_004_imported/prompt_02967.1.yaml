answer: |-
  This is a classic and profound tension in the philosophy of language. You have identified the fault line where formal semantics meets epistemology. The literature often treats the Lewis/Stalnaker divergence (metaphysics of worlds) and the Lewis/Adams divergence (semantics of probability) as separate debates, but as you suspect, they converge on the fundamental question: *What kind of thing is a conditional?*

  Here is a walkthrough of the technical divergences, the probabilistic escape hatch, and finally, my defended position on whether this asymmetry is principled or accidental.

  ### 1. Stalnaker vs. Lewis: The Geometry of Closeness

  Both Robert Stalnaker (1968) and David Lewis (1973) agree on the core intuition: a counterfactual $A > C$ is true at world $w$ if $C$ holds at the $A$-worlds that are "closest" or "most similar" to $w$. However, they model the geometry of logical space differently, leading to distinct logical validities.

  **Stalnaker's Selection Function:**
  Stalnaker models similarity using a selection function $f(A, w)$, which picks out a *single* world. This relies on two key assumptions:
  1.  **The Limit Assumption:** For any antecedent $A$, there is a limit to how close an $A$-world can get to $w$; there isn't just an infinite sequence of closer and closer $A$-worlds.
  2.  **Uniqueness:** There is exactly *one* closest $A$-world.

  Because Stalnaker forces a unique winner, his semantics validates **Conditional Excluded Middle (CEM)**: $(A > C) \lor (A > \neg C)$. In Stalnaker's view, for any antecedent, there is a specific fact of the matter about what would happen. Either in that unique closest world, $C$ happens, or it doesn't.

  **Lewis's Systems of Spheres:**
  Lewis rejects both assumptions. He models similarity as a system of nested spheres around $w$.
  1.  **Rejection of Uniqueness:** Lewis argues there can be ties. Imagine a world where Bizet and Verdi are compatriots. Is the closest world one where they are both French or both Italian? Lewis suggests there may be no fact of the matter; there are two equally close worlds, one with each outcome. Consequently, Lewis **rejects CEM**. Both "If Bizet and Verdi were compatriots, they would be French" and "If Bizet and Verdi were compatriots, they would be Italian" can be false.
  2.  **Rejection of the Limit Assumption:** Lewis argues there might be no *closest* world, only closer and closer ones (e.g., "If I were taller than I am..."). If there is no closest world, the truth condition must be defined as "C holds in *all* sufficiently close A-worlds," rather than "the" closest one.

  **The Divergence:** Stalnaker's semantics is logically stronger (validating CEM) but metaphysically more demanding (requiring unique similarity). Lewis's semantics is logically weaker but metaphysically more flexible, accommodating vagueness in similarity.

  ### 2. Adams/Edgington: Escaping Triviality

  While Lewis and Stalnaker debated the metaphysics of counterfactuals, Ernest Adams (1965) and later Dorothy Edgington argued that indicative conditionals ("If A, C") do not describe the world at all.

  **The Triviality Problem:**
  Adams proposed that the acceptability of an indicative conditional is measured by the conditional probability $P(C|A)$. Lewis (1976) proved that if you assume:
  1.  Conditionals express propositions (have truth conditions).
  2.  The probability of that proposition equals the conditional probability ($P(A \to C) = P(C|A)$).
  3.  Standard probability axioms hold.

  ...then the only probability functions allowed are **trivial** (they assign probability 0 or 1 to everything). In short: **Conditionals cannot be propositions that bear probabilities matching our intuitions.**

  **The Suppositional Escape:**
  Adams and Edgington escape this by denying premise (1). They argue indicatives do not have truth conditions.
  *   **Edgington's View:** To assert "If A, C" is not to assert a proposition that is true or false. It is to perform a speech act of *conditional assertion*. You are not claiming the material implication is true; you are inviting the listener to suppose $A$ and assess $C$ within that supposition.
  *   **Why it works:** If "If A, C" has no truth value, it has no probability of being true. Instead, it has a *degree of acceptability*. This sidesteps Lewis's proof because the proof only applies to truth-conditional propositions. You can have $P^*(A \to C) = P(C|A)$ without contradiction if $P^*$ is not a probability over truth conditions but a measure of epistemic commitment under a supposition.

  ### 3. The Oswald/Kennedy Contrast

  This theoretical divergence is best illustrated by the famous minimal pair:

  1.  **Indicative:** "If Oswald didn't kill Kennedy, someone else did."
  2.  **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have."

  **The Indicative (Epistemic):**
  We know Kennedy was killed. We are operating within the actual world's facts. The indicative asks us to add "Oswald didn't kill him" to our stock of knowledge and see what follows. Given the evidence (a man was shot in a public place), the conditional probability that someone else did it is near 1. Adams/Edgington capture this perfectly: it is high because $P(\text{Someone else did} | \text{Oswald didn't})$ is high. It is an inference from effect to alternative cause.

  **The Counterfactual (Metaphysical/Causal):**
  Here we step outside the actual world. We are asked to imagine a world where the actual cause (Oswald) is removed. Does the effect (Kennedy's death) remain? This depends on causal structures, conspiracies, and luck. Many historians think the probability is low; Oswald acted alone.
  *   **Stalnaker/Lewis:** We look for the closest world where Oswald doesn't shoot. In that world, does the shot still ring out? If the closest worlds are ones where the conspiracy fails without Oswald, the counterfactual is **false**.
  *   **The Clash:** It is perfectly coherent to accept (1) as highly assertable while rejecting (2) as false. If both were truth-conditional propositions about the same logical space, this would be paradoxical. The Adams/Edgington view explains (1) as epistemic reasoning, while the Lewis/Stalnaker view explains (2) as metaphysical dependency.

  ### 4. Opinion: Is the Asymmetry Principled?

  You asked for a specific defense rather than a survey. Here is my position:

  **The asymmetry is principled, not an artifact.** There is a robust philosophical basis for treating counterfactuals as truth-conditional (modal) and indicatives as non-truth-conditional (probabilistic/suppositional). Attempting to unify them under a single semantic treatment inevitably distorts the distinct cognitive roles these constructions play in human reasoning.

  **Defense of the Principled Asymmetry:**

  **1. Distinct Cognitive Functions (Planning vs. Learning)**
  Indicatives and counterfactuals serve different evolutionary and cognitive purposes.
  *   **Indicatives are for learning and updating.** When I say, "If it is raining, the streets are wet," I am constraining my *epistemic state*. I am telling you how to update your beliefs given new evidence. This is fundamentally probabilistic. Evidence comes in degrees; therefore, the logic of evidence (indicatives) must be probabilistic. Forcing truth conditions onto this process (as Lewis's Triviality result shows) breaks the mathematics of belief updating.
  *   **Counterfactuals are for planning and causal modeling.** When I say, "If I had dropped this glass, it would have broken," I am not updating my beliefs about the actual world (I didn't drop it). I am testing a causal model. I am querying a simulation of reality. This requires a truth-conditional semantics because I am making a claim about the structure of the world (specifically, the similarity relations between worlds). I am claiming that in the relevant causal neighborhood, breakage occurs.

  **2. The Hard Constraint of Triviality**
  We cannot simply wish away Lewis's Triviality Results. If we insist indicatives have truth conditions, we must abandon the link between conditionals and conditional probability. But that link ($P(C|A)$) is the most robust data point we have about how people actually use indicatives. People treat "If A, C" as uncertain even when they are certain $A$ is false or $C$ is true. The Suppositional Theory preserves this data. Counterfactuals, however, do not face the same probabilistic pressure. We rarely assess counterfactuals using standard conditional probability (since the antecedent is known false, $P(A) = 0$, making $P(C|A)$ undefined in standard probability). Thus, counterfactuals are free to be truth-conditional without triggering triviality.

  **3. Linguistic Marking Reflects Semantic Reality**
  English (and most languages) marks this distinction morphologically (tense backshifting, mood). "If Oswald *didn't*..." vs. "If Oswald *hadn't*..." This is not merely stylistic; it signals a shift in the *context set*.
  *   **Indicatives** operate within the *Common Ground* (the set of worlds compatible with what the conversational participants take for granted).
  *   **Counterfactuals** explicitly shift the Common Ground to a set of non-actual worlds.
  Because the domain of quantification changes (actual/epistemic worlds vs. metaphysical/similarity worlds), it is natural that the semantics change. Indicatives quantify over epistemic possibilities (best handled by probability); counterfactuals quantify over metaphysical possibilities (best handled by similarity orderings).

  **Conclusion**
  The tension you feel is real, but it should not be resolved by flattening the difference. The "Unified Theory" dream (trying to make both truth-conditional or both probabilistic) fails because it ignores that "if" is polysemous in a functional sense. It is a tool for two different jobs. The Adams/Edgington approach for indicatives respects the logic of uncertainty, while the Lewis/Stalnaker approach for counterfactuals respects the logic of causal dependence. The asymmetry is the price of admission for a semantics that accurately reflects how we think.
