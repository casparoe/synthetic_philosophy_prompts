  7.  **Final Polish:** Check flow, transitions, and ensure the argument builds logically to the commitment. (Make sure to emphasize that "Rationality" in econ means "Consistency," not "Sensible.")

  *(Self-Correction Note)*: I need to be careful not to conflate "utility" in the neoclassical sense (ordinal ranking) with "utility" in the utilitarian sense (happiness). The prompt blurs them slightly, which is the source of the confusion. I should clarify this distinction as part of the argument. The "trick" is swapping one for the other.

