answer: |-
  You have the better of the argument, though your friend is not entirely wrong—he is simply operating within a narrower framework than you are. Your objection is not sentimentality; it is responding to a profound philosophical distinction that your friend is overlooking: the difference between **blameworthiness** and **agency**.

  Here is the breakdown of why your intuition is correct, the vocabulary you were missing to articulate it, and why your friend's "consistency" argument fails.

  ### 1. The Missing Concept: Agent-Regret
  The feeling your friend is experiencing has a specific name in moral philosophy, coined by Bernard Williams: **Agent-Regret**.

  Williams argued that there is a fundamental difference between the regret felt by a bystander and the regret felt by the person who performed the action.
  *   **Spectator-Regret:** "It is terrible that this patient died." (This is what your rationalist friend thinks she should feel.)
  *   **Agent-Regret:** "It is terrible that *I* was the one who administered the drug that killed this patient."

  Agent-regret does not require moral fault. It is a response to **causal involvement**. When we act in the world, we become tethered to the outcomes of those actions. Even if the outcome was unforeseeable, the fact remains that *she* was the instrument through which the tragedy occurred. To demand she feel exactly what a bystander feels is to demand she deny her own agency.

  Your objection was tracking the **phenomenology of agency**. You sensed that being the "doer" changes the moral texture of the event, even if it doesn't change the moral *judgment* of the doer.

  ### 2. Responsibility vs. Blameworthiness
  Your rationalist friend is conflating two different types of responsibility:
  1.  **Moral Blameworthiness:** Did you violate a duty? Were you negligent? (Here, the board said no, and your friend is correct: she is not blameworthy.)
  2.  **Causal Responsibility:** Did your actions bring about the state of affairs? (Here, the answer is yes.)

  Your friend argues that because #1 is absent, any feeling of responsibility is irrational. You are arguing that #2 carries its own emotional weight. A surgeon can be **causally responsible** for a death without being **morally culpable** for it.

  The guilt she feels is likely a confusion of these two. She feels the weight of causal responsibility and interprets it as moral culpability. Your friend's advice ("you aren't culpable, so stop feeling responsible") tries to solve the problem by denying the causal weight. Your intuition ("you are embedded in the cause") acknowledges the causal weight but needs to separate it from the blame.

  ### 3. The Flaw in the "Symmetry" Argument
  Your friend's strongest point was the symmetry argument: *Surgeons take pride in lucky wins; they shouldn't disown unlucky losses.* This is logically appealing but psychologically and empirically flawed.

  *   **Asymmetry of Harm:** In ethics, causing harm is generally weighted more heavily than producing benefit. We do not judge a surgeon who miraculously saves a patient against odds as "great" in the same way we judge a surgeon who accidentally kills a patient as "tragic." The moral gravity of death outweighs the moral lightness of survival.
  *   **The Nature of Professional Pride:** Good surgeons usually do not take pride in *lucky* outcomes. They take pride in *skillful* execution. If a patient survives due to a fluke, a humble surgeon feels relief, not pride. Therefore, the symmetry argument collapses. She isn't disowning a bad outcome while claiming a good one; she is grappling with a bad outcome resulting from her hand, which is a unique burden.

  ### 4. Why Your Friend's View is Dangerous
  While your friend's logic is clean, his advice is potentially harmful. This surgeon is showing signs of **moral injury** and potentially PTSD (replaying the operation, avoiding work).

  If she accepts your friend's argument ("Your feelings are irrational because you aren't at fault"), she is forced into a position of gaslighting herself. She *knows* she feels different than a bystander. Being told that this difference is "irrational" adds a layer of meta-guilt (guilt about feeling guilty).

  Your view allows for a healthier resolution: **Acknowledge the agent-regret without accepting the blame.**
  She can say: *"I am not negligent. I did not make a mistake. But I am the surgeon. This happened through my hands. It is right that I feel a specific sorrow for this that a bystander would not feel. That sorrow does not mean I am incompetent; it means I am a moral agent."*

  ### Verdict
  **You have the better of the argument.**

  Your friend is arguing from the standpoint of a **tribunal** (judging fault), while you are arguing from the standpoint of a **human life** (experiencing agency).

  *   **He is right that:** She should not be *punished*, and she is not *negligent*.
  *   **You are right that:** She is entitled to a unique emotional relationship with the event because she was the **author of the action**, even if she was not the **author of the tragedy**.

  **What your objection is responding to:**
  It is responding to the **integrity of the self.** To be an agent is to accept that your actions ripple out into the world in ways you cannot fully control. To feel nothing when those ripples cause harm is to be sociopathic; to feel crushing blame when you were not negligent is to be neurotic. The healthy middle ground—which you were reaching for—is to acknowledge the tragedy of being the instrument of harm without accepting the label of being the *cause* of the error.

  **Practical Note:**
  While you won the philosophical argument, your friend is describing symptoms of clinical distress (avoiding cases, intrusive thoughts). Philosophy can validate her feelings, but it cannot cure trauma. She may need a therapist specializing in medical trauma or moral injury to help her process the "agent-regret" so it doesn't metastasize into "culpability."
