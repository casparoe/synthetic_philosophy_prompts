answer: |-
  Here are nine substantial interview questions tailored for your podcast, designed to move past the Wikipedia summary and dig into the philosophical meat of her position. I've ordered them to build a narrative arc, starting with her core claim and ending with the falsifiability challenge you requested.

  ### 1. The Thermodynamics Analogy
  "You've compared the Church-Turing Thesis to the laws of thermodynamics, suggesting it's an empirical law of nature rather than a mathematical definition. Thermodynamics describes how energy behaves in *physical* systems. If the Thesis is similar, what exactly is the 'substance' it's describing? Is it a limit on information, on causality, or on the structure of spacetime itself?"

  *   **Expected Answer:** She'll likely say it's a limit on physical information processing or causal structure in our universe.
  *   **Follow-up:** "So if the universe had different physical constants, could the Thesis have been false?"

  ### 2. The Convergence Argument
  "A standard argument for the Thesis is that Turing Machines, Lambda Calculus, and General Recursive Functions all converged on the same class of computable functions independently. But critics argue this isn't independent evidence; it's just that Church, Turing, and Kleene all shared the same 1930s cultural assumptions about what 'mechanical' means. How do you respond to the idea that this convergence is circular?"

  *   **Expected Answer:** She will argue that the formalisms are mathematically distinct enough that their equivalence is unlikely to be mere coincidence.
  *   **Follow-up:** "But doesn't that equivalence only prove the *math* is consistent, not that the math matches *physical reality*?"

  ### 3. Human Computers vs. Physical Machines
  "Turing's original 1936 paper was analyzing the actions of a *human* computer with a pencil and paper, not an electronic device. At what point in your view does the thesis shift from being about human intuition to being about the limits of physics? Is that a seamless transition, or a gap we gloss over?"

  *   **Expected Answer:** She'll likely argue that human computation is a physical process, so the limits on one imply limits on the other.
  *   **Follow-up:** "But humans are error-prone and finite; machines can be scaled in ways humans can't. Does that scaling introduce new physical possibilities?"

  ### 4. The "Physical" vs. "Mathematical" Distinction
  "Philosophers often distinguish between the 'Mathematical Church-Turing Thesis' (about effective methods) and the 'Physical Church-Turing Thesis' (about what any physical system can compute). When you call the Thesis 'empirical,' are you quietly sliding from the mathematical claim to the physical one? And if so, doesn't that leave the original mathematical claim untouched?"

  *   **Expected Answer:** She will probably admit the distinction but argue the mathematical claim is empty without the physical interpretation.
  *   **Follow-up:** "So you're saying the mathematical thesis is only interesting *because* we assume the physical one holds?"

  ### 5. Quantum Computing and Analog Loopholes
  "We hear a lot about quantum computers potentially solving problems classical machines can't, or analog computers using continuous real numbers to bypass discrete limits. Do you view these as genuine threats to the Thesis, or do you think they ultimately get absorbed back into the standard Turing framework once we account for noise and measurement?"

  *   **Expected Answer:** She'll likely argue that noise and finite energy prevent true hypercomputation, keeping quantum computing within Turing limits.
  *   **Follow-up:** "Is that an empirical claim we've tested, or just an assumption that noise will always win?"

  ### 6. Turing's Oracle and Copeland's Critique
  "Jack Copeland has argued that Turing's later work on Oracle Machines and Ordinal Logics suggests Turing himself wasn't fully committed to the Thesis as a hard limit—that he was exploring ways to go *beyond* it. Do you think Turing secretly half-doubted his own thesis, or is Copeland reading too much into those later papers?"

  *   **Expected Answer:** She might concede Turing was exploring extensions but maintain he still viewed the basic Thesis as robust for standard computation.
  *   **Follow-up:** "If Turing was willing to model 'uncomputable' steps with Oracles, does that mean the Thesis was never meant to be absolute?"

  ### 7. Conceptual Truth vs. Empirical Discovery
  "If the Thesis is empirical, it should feel like a discovery, like finding a new planet. But for many computer scientists, it feels like a conceptual truth, like 'all bachelors are unmarried.' Why do you think it feels so necessary to us, if it's actually just a contingent fact about our universe?"

  *   **Expected Answer:** She'll argue it feels necessary because we can't easily imagine the alternative, similar to how Newtonian physics felt necessary before Einstein.
  *   **Follow-up:** "So our intuition is just a bad guide for what's physically possible?"

  ### 8. Implications for Logic and Math
  "If you're right and the Thesis is a law of nature, that implies logic itself is bounded by physics. Does that scare you? It suggests that if the universe were different, valid mathematical proofs might look completely different, or even cease to be valid."

  *   **Expected Answer:** She will likely say logic is abstract, but *our access* to logic is bounded by physics.
  *   **Follow-up:** "But if we can't access it physically, does it make sense to call it 'logic' at all?"

  ### 9. The Falsifiability Challenge (Closing)
  "To end on a tough one: You call the Thesis empirical, which implies it's falsifiable. But if someone builds a device that claims to break the Thesis, supporters often just say the device is faulty or noisy. What would a discovery *against* the Thesis actually look like? If literally nothing counts as evidence against it, doesn't calling it 'empirical' become kind of hollow?"

  *   **Expected Answer:** She will need to describe a specific, repeatable physical process that solves the Halting Problem.
  *   **Follow-up:** "And if we saw that once, would you accept it, or would you look for the error first?"
