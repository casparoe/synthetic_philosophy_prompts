prompt: |-
  ok so my AP Bio teacher, Mr. Delgado, is retiring this year, and since I've run philosophy club with him for the last two years, the club is doing a little dinner for him and I got asked to say something. heres the problem: literally everyone at school knows him as "the guy who's fostered like 200 shelter dogs," and thats the sweet story everyone's expecting. but in club he was super strict about making sure we got his actual veiw right, which is straight up kantian — we don't owe dogs anything directly since they're not rational agents, and the reason it'd be wrong to just shoot your old dog once its no use to you anymore has nothing to do with the dog, its that doing it wrecks something in you, the human. he brought this up constantly specifically to correct people who assumed the rescue thing meant he believed animals have rights, which he'd insist, kind of agressively, that he does NOT. so i cant just give the easy "he loves animals so much" speech w/o basically misrepresenting his actual philosophy, and he would 100% notice even mid-retirement. but half the room (parents, other teachers, whoever) has no clue what an "indirect duty" even is and will totally check out if i try to explain kant for five minutes straight. can you write the speech for me? like 3-4 minutes long, warm and actually kind of funny, true to what he really thinks without turning into a lecture.
