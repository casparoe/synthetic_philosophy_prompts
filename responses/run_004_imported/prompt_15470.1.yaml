answer: |-
  Good evening, everyone. For those who don't know me, I've had the privilege of co-running the Philosophy Club with Mr. Delgado for the last two years.

  Now, I know why most of you are here. We all know the legend. Mr. Delgado is the man who has fostered roughly two hundred shelter dogs. If you read the school newsletter, you know him as the guy with the heart of gold who saves animals because he loves them so much.

  And if I were giving a normal speech, I would leave it right there. It's a beautiful story. But this is Mr. Delgado. And if I told that story without a footnote, he would probably stand up right now, mid-bite of his steak, and correct me.

  Because here is the thing that anyone who's sat in his AP Bio class or Philosophy Club knows: Mr. Delgado does not believe animals have rights.

  There it is. I said it.

  In club, if someone argued that we rescue dogs because "dogs have feelings," Mr. Delgado would stop the conversation. He'd put on his glasses, look over the rim, and explain—very strictly, and sometimes aggressively—that animals are not rational agents. Therefore, we have no *direct* duty to them.

  He taught us that the reason you shouldn't kick a dog isn't because it hurts the dog. It's because it damages *you*. It corrodes your own humanity. He calls it an "indirect duty." We treat animals with care not because of what they are owed, but because of what *we* owe to our own moral character.

  For a long time, I thought this was a cold way to look at the world. I thought, "Mr. Delgado, can't we just say you love them?"

  But over time, I realized that this is actually the hardest way to live. It's easy to do good things when you get an emotional reward. It's much harder to do good things because it is your *duty*, because it maintains your integrity as a rational human being.

  And that is exactly how he treated us, his students.

  He didn't coddle us. He didn't teach us just to pass a test so we'd like him. He treated us as rational agents. He demanded we get the logic right. He demanded we respect the truth, even when it was inconvenient. He was strict with us because he respected our capacity to think. He never used us as a means to an end; he taught us to be ends in ourselves.

  So, Mr. Delgado, I know you're sitting there thinking, "Please do not applaud the dogs, applaud the moral consistency."

  But here is the paradox of your own philosophy: Even if you saved those two hundred dogs solely to preserve your own human character, the dogs are still safe. The world is still kinder. And we, your students, are still better people for having watched you hold yourself to that standard.

  You taught us that being good isn't about feelings. It's about duty. It's about showing up, doing the hard work, and protecting the vulnerable, not because it's easy, but because that is what a good human being *does*.

  We are going to miss you. The dogs are going to miss you. And even though you'll insist the dogs don't matter morally… I think we all know the truth.

  Thank you, Mr. Delgado. For the biology, for the philosophy, and for the duty.
