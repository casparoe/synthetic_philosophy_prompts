      *   **Analysis of Phenomenon 1 (The Gaming):**
          *   Label it: Goodhart's Law / Proxy Corruption.
          *   Why it happens: Incentives + Loophole.
          *   Specific fix: Counter-metrics (Reopen rate, CSAT). Stop ranking on raw volume.
      *   **Analysis of Phenomenon 2 (The Month 1/6 Flip):**
          *   Label it: Regression to the Mean + Learning Curves.
          *   Why it happens: Small sample size (luck) + "Easy" vs. "Hard" skill acquisition. Fast closers might be cutting corners (related to #1) or just got easy tickets. Slow starters are building mental models.
          *   Specific fix: Change evaluation period. Look at slope, not intercept.
      *   **Comparison:** Are they the same? No. One is *behavioral* (agents changing what they do), one is *statistical* (noise in measurement).
      *   **Actionable Advice:**
