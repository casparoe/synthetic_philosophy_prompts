prompt: |-
  A former doctoral advisee of mine—now a specialist in comparative Chinese philosophy—has asked me, her old dissertation advisor, to give the toast at her wedding next month. Her research has left her genuinely persuaded by the Confucian role ethics associated with Roger Ames and Henry Rosemont Jr.: on this view, a person is constituted by her particular relations—daughter, sister, friend, and now wife—rather than being a self-standing individual who merely enters into them from some prior, independent vantage point. She has asked, half in earnest, that the toast avoid the standard Western wedding vocabulary of soulmates, of two halves becoming whole, of two independent people choosing each other against the world, since on her view this vocabulary quietly reinstates a self-sufficient individual who, she would say, was never really there. A few of her fellow comparative philosophers will be in the audience and will notice if the view gets mangled, but her fiancé and most of the other guests have no philosophical background and are simply expecting a warm, ordinary toast. Please write it: about five minutes long, genuinely organized throughout by this relational conception of personhood rather than gesturing at it once before lapsing into the familiar tropes, and moving enough that nobody in the room feels lectured.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Former dissertation advisor.
      *   **Audience:** Bride (former advisee, specialist in comparative Chinese philosophy), Groom (non-philosopher), Wedding Guests (mix of philosophers and laypeople).
      *   **Core Constraint:** The toast must be organized around Confucian role ethics (Ames/Rosemont view: persons are constituted by relations, not independent individuals).
      *   **Negative Constraint:** Avoid standard Western wedding tropes (soulmates, two halves becoming whole, independent choices against the world).
      *   **Tone:** Warm, moving, not lecturing, accessible to non-philosophers but accurate enough for specialists.
      *   **Length:** About 5 minutes (roughly 750-900 words spoken at a moderate pace).

  2.  **Deconstruct Confucian Role Ethics (Ames/Rosemont):**
      *   *Key Idea:* We are not "nouns" (static individuals); we are "verbs" (dynamic events of relating).
      *   *Key Idea:* Identity is narrative and cumulative. We are the sum of our roles (son, daughter, friend, teacher, spouse).
      *   *Key Idea:* Marriage isn't a contract between two pre-existing entities; it's the creation of a new focal point that transforms all existing roles.
      *   *Key Idea:* *Ren* (humaneness/co-authorship) is achieved *in* the relationship, not brought *to* it.
      *   *Avoid:* Autonomy, independence, "completing" a missing piece (implies incompleteness of the individual rather than the ongoing nature of the relation).

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the relationship (advisor/advisee), set the scene, subtly introduce the theme without jargon.
      *   **Body Paragraph 1 (The Past/Identity):** Reflect on who the bride *was* not as an isolated scholar, but as a node in a network (student, daughter, friend).
      *   **Body Paragraph 2 (The Shift/Marriage):** Define marriage not as a union of two wholes, but as a widening of the horizon. The groom isn't an "other"; he's a new coordinate in her map.
      *   **Body Paragraph 3 (The Future/Growth):** Focus on *becoming*. The relationship isn't a destination; it's a practice.
      *   **Closing:** A wish for the future, raising a glass.

  4.  **Drafting - Section by Section (Iterative Process):**

      *   *Opening:* Start with the academic connection. It establishes authority but needs to soften quickly. "I taught her how to argue, but she taught me how to listen." No, too cliché. Let's focus on how I watched her grow.
      *   *Developing the Philosophy:* How to explain "no independent self" without saying "no independent self"? Use metaphors. A river? A tapestry? A story? Ames often uses the metaphor of a focal point in a field. Let's use the idea of a "story" or a "path."
      *   *Addressing the Groom:* He needs to feel included, not analyzed. He isn't a "subject" meeting an "object." He is someone who changes the landscape.
      *   *Avoiding Tropes:* No "soulmates." No "better half." Instead of "you complete me," use "you extend me." Instead of "standing together against the world," use "growing the world between us."

      *   *Drafting thought:* I need to make sure the philosophers nod, but the mom doesn't cry because she's confused.
      *   *Refinement:* Use words like "becoming," "context," "narrative," "roles." Avoid "autonomy," "choice," "individual."

      *   *Specific Ames/Rosemont nuance:* It's not just that relationships are important; it's that there is *nothing else* but relationships. The "person" is the intersection. I need to convey that the bride *is* her relationships.
      *   *Metaphor:* A conversation. You don't have a conversation alone. The conversation *is* the thing. Marriage is a long conversation that changes the speakers.

  5.  **Writing the Toast (incorporating the constraints):**

      *   *Salutation:* Standard.
      *   *Hook:* Mentioning the dissertation. It allows me to bring up her specific view naturally. "She asked me not to talk about soulmates." That's a funny, honest entry point.
      *   *The Core:* Explain that we are defined by where we stand. Daughter of X, friend of Y.
      *   *The Groom:* He adds a new dimension. He doesn't complete her; he expands the field.
      *   *The Vows:* They aren't promises made by static people; they are commitments to a shared growth.
      *   *The Toast:* Focus on the "we."

  6.  **Review against Constraints:**
      *   *5 minutes?* Word count looks good (approx. 800 words).
      *   *Philosophically accurate?* Yes, focuses on constitutive relations (Ames/Rosemont). Avoids atomistic individualism.
      *   *Accessible?* Yes, uses everyday language (stories, maps, paths) rather than technical jargon (ontological, metaphysical).
      *   *Moving?* Needs emotional resonance. Focus on the warmth of family and friendship.

  7.  **Polishing:**
      *   Check for accidental individualism. (e.g., "You chose each other." -> Better: "You found your way to each other.")
      *   Ensure the groom feels valued. (He is a vital part of the constitutive field, not just a prop.)
      *   Make sure the advisor voice sounds wise but humble.

      *(Self-Correction during drafting)*: I initially thought about quoting the *Analects*. But that might be too "lectury." Better to embody the sentiment without citing the text. The prompt says "avoid standard Western vocabulary," not "quote Chinese classics." Let's keep it vernacular but structurally Confucian.

      *(Refining the "Soulmate" ban)*: Acknowledge it humorously. "She gave me a style guide." This breaks the ice and signals the philosophical constraint to the colleagues without alienating the family.

      *(Final check on the "Constitutive" aspect)*: Make sure to emphasize that she *becomes* a wife, not that she *is* a person who gets married. The role changes the person.

  8.  **Final Polish:** Check rhythm and cadence for speaking aloud. (e.g., short sentences for impact).

  **(Post-Drafting Review):** The draft looks solid. It navigates the "no independent self" idea by focusing on "stories" and "contexts." It honors the groom by making him essential to her future identity, not just a partner. It keeps the tone celebratory.

  9.  **Final Output Generation** (Proceed to generate the toast based on these thoughts).
answer: |-
  Good evening, everyone. For those who don't know me, I had the privilege of serving as [Bride]'s dissertation advisor. In that role, I spent years reading her drafts, questioning her arguments, and watching her refine some very complex ideas about how we live our lives. So, when she asked me to give this toast, I naturally sent her a draft.

  She sent it back with more red ink than I've seen since her final defense.

  Her note said: "Please, no soulmates. No 'two halves making a whole.' And definitely no 'standing alone together against the world.' On principle."

  She was half-joking. But as I thought about it, I realized she was offering us a gift. Because the truth is, the usual wedding stories—the idea that we are all solitary islands looking for a bridge, or separate puzzle pieces searching for a fit—don't quite capture what is happening here today. They suggest that [Bride] and [Groom] were finished products before they met, fully formed individuals who simply decided to merge assets and share a bathroom.

  But anyone who knows [Bride] knows that she has never been a static thing. She is a dynamic event. She is a daughter to [Parents' Names], a sister to [Sibling Names], a friend to so many in this room, and a scholar who finds truth in conversation. She is made of these connections. If you peeled them away, there wouldn't be a "real her" left underneath; there would just be… nothing. We are not nouns. We are verbs. We are the sum of the ways we relate to one another.

  And that is what makes this day so profound.

  In this view, marriage isn't a contract signed by two independent parties. It is the opening of a new horizon. When [Groom] entered [Bride]'s life, he didn't just add a new item to her resume. He didn't just complete a set. He changed the context of everything she was, and everything she is becoming.

  [Groom], you are not an outsider being granted access to her world. You are becoming a new coordinate in her map. By standing here, you are changing what it means for her to be a daughter, a friend, and a scholar. And she is doing the same for you. You are not losing your freedom to this relationship; you are gaining a new depth of reality. You are giving each other a new place to stand.

  There is a beauty in this that the old "soulmate" stories miss. The soulmate story implies that the work is done—you found the one, so now you can rest. But this view? This requires something braver. It requires you to realize that you are co-authoring a story that has no final page.

  There will be days when the narrative is easy, and days when the plot thickens. There will be moments when you don't recognize the characters, including yourselves. But remember that you are not trying to preserve two separate selves inside a house. You are tending to the space *between* you. That space is where you live. That space is where your humanity is cultivated.

  To [Bride]'s colleagues here: yes, I have avoided the vocabulary of atomistic individualism. I hope I have done justice to the role ethics you know so well.

  But to the rest of you, to her family, and especially to [Groom]: The message is simpler. It is that you do not walk this path alone, because there is no "alone" to begin with. We are carried by those who came before us, and we are held by those who stand beside us.

  [Bride] and [Groom], my wish for you is not that you remain unchanged. My wish is that you continue to grow into these new roles with curiosity and with grace. May you find your strength not in standing apart, but in leaning in. May you define each other, not by limiting who the other can be, but by expanding the world in which you both live.

  You are not two halves becoming whole. You are a widening circle.

  Please raise your glasses. To the relationship that makes the persons. To [Bride] and [Groom].
