answer: |-
  **Setting:** *The containment bay of the Chronos Project. The air smells of ozone and static. In the center, the Ring—a torus of superconducting niobium—humms with a sound that is felt in the teeth more than heard. ELENA stands at the threshold, one foot inside the event horizon. She holds a compact pistol. She looks calm, terrifyingly so.*

  *MARCUS (60s, rumpled suit, hands shaking slightly) stands to her left. SARAH (60s, sharp eyes, tablet in hand) stands to her right.*

  **MARCUS:** Elena, put the damn thing away. You're treating the metric like a door. It's not a door. It's a loop.

  **ELENA:** *(Without turning)* A loop I intend to close.

  **SARAH:** Let her go, Marcus. You're thinking in classical lines. She pulls the trigger, the wavefunction branches. Simple.

  **MARCUS:** Simple? You're proposing she detonates the ontological budget of the cosmos because she has daddy issues. Sarah, look at her. If she shoots, she violates the boundary condition of her own existence. The universe doesn't care about her feelings; it cares about consistency.

  **SARAH:** The universe doesn't "care" about anything. That's your anthropomorphism leaking through. You're clinging to this Novikov self-consistency crutch because you're afraid of the many-worlds implication. You want a single, tidy block universe.

  **MARCUS:** I want a universe that doesn't require magic. You call it branching; I call it a "suspicious coincidence" factory. If Elena steps through and aims at the old man, your theory says she succeeds. Mine says the gun jams. Or she slips. Or a sudden aneurysm takes *her* before *him*.

  **SARAH:** And that's the weak spot, Marcus. Always the jam. Always the slip. How many times does the universe have to conspire against local causality to save your precious timeline? If I walk toward a wall, I stop because of electromagnetism. If Elena aims at her grandfather, what force stops her? A gust of wind? A neural misfire? It's not physics; it's narrative censorship. It implies the future is dictating the past's micro-states.

  **MARCUS:** It's not dictating; it's constraining. Think of it like a train on a track. You can't steer the train into the station master's house, not because a ghost stops you, but because the rails don't go there. The global geometry of the CTC (Closed Timelike Curve) imposes a constraint on local events. It's not magic, it's topology.

  **SARAH:** Topology that requires fine-tuning so precise it makes a watchmaker look like a drunk. You're asking me to believe that for every possible attempt Elena makes, the initial conditions of the universe were set at the Big Bang to ensure she fails? That's not science. That's predestination dressed up as differential geometry.

  **MARCUS:** Better predestination than ontological extravagance. You're willing to spawn an entire new cosmos—stars, galaxies, history—just so she doesn't have to deal with a jammed firing pin. That's not parsimony, Sarah. That's inflation of the worst kind.

  **SARAH:** It's not "spawning." The branches are already there in the Hilbert space. The CTC just allows decoherence to separate them along a temporal axis rather than a spatial one. She kills him, she decoheres into a branch where she was never born. The Elena who stepped into the machine? She stays in *this* branch, where the grandfather lived. No paradox.

  **MARCUS:** Oh, spare me the quantum gloss. We both read Deutsch's paper. We both know what happens if you're right. If CTCs allow branching, they allow computation.

  **SARAH:** *(Tightening her grip on the tablet)* Here we go.

  **MARCUS:** If you can shunt paradoxes into other branches, you can solve PSPACE-complete problems in polynomial time. You can build a computer that sends the answer back in time before it calculates the question. If nature allows your version of time travel, nature allows hyper-computation. We should be seeing evidence of that everywhere. The fact that we aren't suggests the consistency principle holds. The universe forbids the computation because it forbids the inconsistency.

  **SARAH:** And why shouldn't it? You're assuming the universe is computationally bounded by *human* complexity classes. Maybe nature *is* a hyper-computer. Just because it breaks your Turing machine intuition doesn't mean it's false. You're rejecting a valid solution to the Einstein field equations because it makes your laptop look slow.

  **MARCUS:** I'm rejecting it because it turns causality into a suggestion. If she shoots him, and she still exists to remember shooting him, then cause and effect are severed.

  **SARAH:** She *won't* remember shooting him in *this* timeline! That's the point you keep missing. The traveler retains the memory of the origin branch, but her physical presence is now anchored in the new branch. It's linear causality preserved locally, at the cost of global uniqueness.

  **MARCUS:** Global uniqueness is all we have! Look at her. *(He gestures to Elena)* If she steps through, and you're right, she's committing suicide. The "Elena" who comes out the other side of that shot isn't her. It's a copy. A divergent wave packet.

  **ELENA:** *(Turning slightly)* I'm still here, Marcus.

  **MARCUS:** For now. But if Sarah is right, the moment you pull that trigger, you are no longer in the universe that made you. You're a ghost haunting a new history.

  **SARAH:** And if *you're* right, she's a puppet. Her finger won't move. Her neurons won't fire. She's going to stand there, finger on the trigger, while the universe twists itself into a pretzel to ensure the bullet never leaves the chamber. A bird will fly into the barrel. The powder will be damp. It's an insult to agency.

  **MARCUS:** It's not an insult to agency; it's a definition of "can." David Lewis explained this thirty years ago. "Can" is compossible. She *can* shoot him in the sense that she has the skill and the gun. She *cannot* shoot him in the sense that it is compossible with the fact that he lived. You're confusing two different meanings of the word.

  **SARAH:** That's semantic gymnastics to cover a physical absurdity. You're saying the laws of physics will reach out and tweak the quantum vacuum to stop a bullet? That's more miraculous than my branching. At least my branching respects the linearity of the Schrödinger equation. Your "consistency" requires non-linear collapse just to keep the timeline tidy.

  **MARCUS:** My consistency requires nothing but the acceptance that the past is as fixed as the future. We live in a block, Sarah. We're just reading it out of order.

  **SARAH:** Then why does it feel like a choice?

  **MARCUS:** Because we're inside the block.

  **SARAH:** *(Steps closer to Elena)* Elena. If you step through, and Marcus is right, you will fail. You will waste your life trying to fight gravity with your bare hands. But if I'm right... you get to do it. You get to change something. Even if it's not *this* something. Isn't that worth the risk? To know you have the power to pull the trigger?

  **MARCUS:** To know you're killing a stranger who happens to look like your grandfather? Is that the victory?

  **ELENA:** *(Her hand hovers over the activation panel)* I don't care about the philosophy. I care about the man.

  **MARCUS:** The man is dead, Elena.

  **ELENA:** Not in 1954.

  **MARCUS:** If you go there, and the gun jams, you spend the rest of your life in 1954 wondering why.

  **SARAH:** And if it fires, you spend the rest of your life knowing you could.

  *The hum of the Ring pitches up. The air pressure drops. Elena's finger tenses.*

  **MARCUS:** *(Quietly)* The coincidence will break you, Elena. Not the gun. The knowledge that the universe is rigged.

  **SARAH:** Or it will free you. Because the universe is bigger than this one thread.

  **ELENA:** We'll see which of you is waiting for me when I get back.

  *Elena steps through. The light flares white, blinding them both. The hum cuts out instantly. Silence rushes back into the room.*

  *Marcus and Sarah stand in the dark. Neither moves.*

  **MARCUS:** ...If she comes back, I was right.

  **SARAH:** *(Voice steady in the dark)* If she doesn't come back... I was right.

  **MARCUS:** Or she's dead.

  **SARAH:** Or she's elsewhere.

  *They wait. The silence stretches, heavy and indifferent.*
