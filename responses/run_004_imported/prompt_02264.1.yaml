  2.  **Identify the Core Mathematical Concept:**
      *   The user is describing the **Kelly Criterion**.
      *   The "information-theory guy" is **John L. Kelly Jr.** (Bell Labs, 1956).
      *   The core conflict is between **Maximizing Expected Value (Arithmetic Mean)** vs. **Maximizing Expected Growth Rate (Geometric Mean)**.

  3.  **Evaluate Priya's Argument:**
      *   *Claim:* "Maximize expected winnings over the long run."
      *   *Math:* She is optimizing for Arithmetic Expected Value.
      *   *Flaw:* In repeated betting (compounding bankroll), Arithmetic EV leads to almost certain ruin (Gambler's Ruin) if you bet too large, even on +EV bets.
