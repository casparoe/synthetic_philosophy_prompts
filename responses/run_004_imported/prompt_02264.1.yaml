      *   *Verdict:* Priya is mathematically incorrect regarding *long-term wealth growth* in a compounding scenario. She is correct only if you can reset your bankroll to a fixed amount after every bet (which isn't the case here).

  4.  **Evaluate the User's Experience:**
      *   Betting 60-70% per trade is massive overbetting.
      *   Even with a significant edge, variance will wipe out a bankroll sized this way.
