      *   **Virtue Epistemology (Sosa, Greco, Zagzebski):** Knowledge is true belief arising from intellectual virtue/competence (the archer analogy). The value isn't just in the state (truth) but in the *credit* owed to the agent. It's about *achievement*.
      *   **Comparison:** Plato focuses on the *stability* and the *explanation* (internal reasoning). Virtue Epistemology focuses on the *source* (agent's competence) and *credit*.

