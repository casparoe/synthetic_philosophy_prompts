answer: |-
  Here are eight interview questions designed to navigate the technical nuances of the Problem of Old Evidence while keeping the conversation accessible for your podcast audience.

  **1. The Mercury Setup**
  Let's start with the historical case that sparked this whole debate. In 1859, astronomers measured a 43-arcsecond discrepancy in Mercury's orbit that Newtonian physics couldn't explain. By 1915, that number was a fixed, known fact. When Einstein derived that exact number from General Relativity, physicists treated it as massive confirmation. But in standard Bayesian terms, if the probability of the evidence is already 1, the likelihood ratio is 1, and the evidence confirms nothing. So, before we get to your solution: does the math simply prove that the physicists were wrong to feel confirmed, or does it prove that standard Bayesianism is broken?

  *   **Follow-up:** If you say Bayesianism is broken, aren't you undermining the very framework we use to define rational belief change in the first place?

  **2. The Intuition of Novelty**
  Your account suggests that old evidence can confirm a theory just as well as novel predictions, provided the agent learns the entailment relation. But scientifically, we seem to value novel predictions much more highly. If I cook up a theory today that entails the known position of Mercury, we'd call that ad hoc. Why does your model allow old evidence to confirm a theory in a way that feels epistemically different from a successful novel prediction?

  *   **Follow-up:** So are you saying the "virtue" of novel prediction is just psychological, rather than a genuine feature of how evidence supports theory?

  **3. Ideal Agents**
  A common defense of standard Bayesianism is that it describes an *ideal* rational agent, not a human one. An ideal agent would know all logical consequences of their theories instantly. If we accept your diagnosis, are we admitting that Bayesian confirmation theory simply cannot apply to ideal agents, but only to beings with limited computational power like us?

  *   **Follow-up:** If that's the case, does confirmation become a fact about our cognitive limitations rather than a fact about the relationship between the world and our theories?

  **4. The Status of Logical Entailment**
  This is the technical heart of your view. You argue we update on the proposition that "Theory T entails Evidence E." But that entailment is a logical truth; it's either necessarily true or necessarily false. How can a rational agent assign a probability other than 0 or 1 to a logical truth without quietly reintroducing the very logical omniscience you're trying to avoid? Aren't you just treating logic as empirical?

  *   **Follow-up:** If logic isn't certain, what stops an agent from assigning low probability to a valid deduction simply because they haven't checked it yet?

  **5. Biographical Timing**
  On your account, confirmation happens when a scientist *discovers* the entailment. This implies that General Relativity was confirmed for Einstein in 1915, but perhaps not for a colleague who didn't grasp the math until 1920. Does this mean the degree of confirmation a theory enjoys is contingent on the biographical timing of when a particular scientist noticed a logical relation?

  *   **Follow-up:** Doesn't that make scientific confirmation worryingly subjective, depending on who is doing the calculating and how fast they work?

  **6. Counterfactual Rivals**
  There are rival solutions to this problem that suggest we should measure confirmation by asking what credence a scientist *would* have had had they not known the evidence in the first place. Why is your approach—updating on the learning of the entailment—superior to this counterfactual historical approach?

  *   **Follow-up:** Isn't the counterfactual approach actually more objective, since it removes the dependency on when the scientist happened to have their "aha" moment?

  **7. Scope Beyond Physics**
  Your examples usually come from physics, where theories entail precise numerical predictions. But in fields like evolutionary biology or economics, the relationship between theory and evidence is often statistical or explanatory rather than strictly deductive. Does your solution to the old evidence problem generalize to sciences where "entailment" is much messier?

  *   **Follow-up:** If it doesn't generalize, is this a solution to a problem specific to Bayesian formalism rather than a general account of scientific reasoning?

  **8. Changing Your Mind**
  To close, I want to ask about the resilience of your own position. You've argued that the logical omniscience assumption is the root error in the Problem of Old Evidence. What finding, argument, or case study would you accept as evidence that your diagnosis is not, after all, the right explanation of why old evidence can confirm a theory?

  *   **Follow-up:** If such a case were found, would you abandon the Bayesian framework entirely, or just this specific fix for it?
