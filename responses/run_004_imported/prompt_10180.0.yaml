      *   **All-Affected Principle vs. All-Subjected Principle:**
          *   *All-Affected:* Everyone impacted should vote. Problem: Too broad (neighbors, future generations, the allergic partner).
          *   *All-Subjected:* Everyone bound by the law/rules should vote. Problem: Still ambiguous (incoming housemates, subletters vs. signatories).
      *   **Infinite Regress:** Deciding who votes requires a vote, which requires voters...
      *   **Rationalist Context:** The user mentions "rationalist meetup." This implies they value clear reasoning, system design, and might be prone to over-optimizing or getting stuck in local maxima/philosophical traps. They need a pragmatic pivot.

  3.  **Evaluate Potential Solutions (Non-Arbitrary Ways Out):**
