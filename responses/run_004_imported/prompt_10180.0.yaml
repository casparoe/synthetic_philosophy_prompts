answer: |-
  This is a classic instance of the **Boundary Problem of Democratic Theory**, and you are running headfirst into a philosophical wall that has stumped political philosophers for centuries. The fact that you are in a rationalist-adjacent community makes this irony particularly sharp: you are trying to apply rigorous system design to a problem that fundamentally resists formalization without an initial act of arbitrary will.

  Here is an analysis of why this is happening, why there is no truly non-arbitrary solution, and a concrete framework for how to break the deadlock.

  ### 1. The Diagnosis: Why the Regress Happens

  You are experiencing the **Demos Problem**. To decide the rules of the group, you need a voting body (the *demos*). But to define the voting body, you need rules. If you vote on who gets to vote, you have already presupposed a *demos* to cast those votes.

  *   **The All-Affected Principle:** Your proposal that "whoever is affected gets a vote" fails because causality is infinite. The neighbor is affected by noise; the city is affected by your zoning compliance; future housemates are affected by the roof fund. If you follow this principle to its logical conclusion, the franchise becomes unmanageable.
  *   **The All-Subjected Principle:** The alternative is "whoever is bound by the rules." This is better, but it creates the "Incoming Housemate" paradox you identified. They are bound by the rules but had no voice in creating them.
  *   **The Legalist Principle:** Tying votes to the lease solves the boundary issue but violates the moral intuition of the community (long-term subletters having less say than a new signatory).

  **Why it feels like a regress:** You are trying to solve a *Constitutional* question (who are we?) using *Legislative* procedures (voting). You cannot vote on your own existence without already existing. Every community must, at some point, rely on a "Founding Moment" that is inherently extra-legal or arbitrary to bootstrap the system.

  ### 2. Is There a Non-Arbitrary Way Out?

  **No.** There is no view from nowhere. Any line you draw (3 months residency? 5 nights a week? Financial contribution?) is arbitrary.

  However, there is a **Least-Arbitrary** way out. In game theory and rationalist circles, this is often called finding a **Schelling Point**—a solution that people tend to choose by default because it feels salient, focal, or "natural," even if it isn't logically derived from first principles.

  For housing co-ops, the Schelling Point is usually a **Tiered Membership Model**. This acknowledges that different stakeholders have different levels of risk and commitment, and assigns rights accordingly. This avoids the binary trap of "Voter vs. Non-Voter."

  ### 3. Concrete Recommendations for the Charter

  When you reconvene, do not try to vote on the franchise immediately. Instead, propose a **Provisional Ratification Process**. You need to separate the *drafting* of the constitution from the *ongoing governance* of the house.

  Here is a specific framework you can propose:

  #### A. Distinguish "Signatories" from "Residents"
  Create two classes of membership in the charter.
  1.  **Core Members (Signatories):** Those on the master lease. They hold ultimate legal and financial liability.
      *   *Rights:* Vote on all issues. **Veto power** on issues involving legal liability, debt, or lease violations.
      *   *Responsibility:* Ultimate responsibility to the landlord.
  2.  **Voting Residents (Subletters/Long-term):** Those who have lived there >X months (e.g., 3 months) and contribute to shared expenses.
      *   *Rights:* Vote on social policy, chores, grocery budgets, pet policy, noise.
      *   *Limitation:* Cannot vote on taking on debt or changing the lease structure.
  3.  **Non-Voting Residents (Partners/Short-term):** People staying >50% of nights but not on lease/financials.
      *   *Rights:* Can attend meetings, voice concerns, vote in *advisory* straw polls.
      *   *Limitation:* No binding vote. (This solves the allergic partner issue: she gets a voice in the pet discussion, but the *residents* decide, perhaps with a requirement that Core Members cannot veto a safety/health concern raised by a resident).

  #### B. Solve the "Founding Moment" (The Current Deadlock)
  You cannot vote on who drafts the charter, because you don't have voting rules yet.
  *   **Proposal:** The drafting committee should consist of **everyone currently living in the house** (Signatories + Subletters + Partners who stay >4 nights/week).
  *   **Ratification:** The draft charter requires a **Supermajority (e.g., 75%) of Current Residents** AND **Unanimous Consent of Core Members**.
      *   *Why:* This gives the subletters leverage (they can block the 75%) but acknowledges the legal reality (Signatories carry the risk, so they need a safety valve).

  #### C. Solve the "Incoming Housemate" Problem
  This is the most common failure point in rotating houses.
  *   **The "Probationary Clause":** Incoming housemates are bound by the charter *provisionally* upon move-in.
  *   **Ratification Window:** They have 30 days to review the charter. If they object to specific clauses, they can trigger a re-vote on those specific clauses within their first 60 days.
  *   **Why:** This respects the "All-Subjected" principle without paralyzing the house every time someone moves in. It treats the charter as a living document that new members implicitly agree to *unless* they actively contest it early on.

  #### D. Solve the "Neighbor" Boundary
  Explicitly define the boundary in the preamble.
  *   **Clause:** "Voting rights are reserved for those who contribute financially to the household economy and sleep within the premises a majority of nights."
  *   **Why:** This explicitly excludes the neighbor (doesn't pay/sleep there) and the casual guest, without needing to debate "affectedness" every time.

  ### 4. How to Pitch This at the Meeting

  The rationalist tendency is to seek the *correct* answer. You need to pivot the group to seek the *workable* answer.

  **Script for the next meeting:**
  > "We are stuck in a philosophical regress because we are trying to vote on the rules of voting before we have rules. This is the Boundary Problem. There is no perfectly fair solution, only trade-offs.
  >
  > I propose we stop trying to find the 'true' franchise and instead adopt a **Tiered Governance Model** based on risk and residency.
  >
  > 1.  **Signatories** get a veto on legal/financial risk (because they go to jail/lose money if it fails).
  > 2.  **Long-term Residents** get full voting rights on social/domestic policy (because they live here).
  > 3.  **Incoming Members** get a 30-day window to amend the charter upon arrival.
  >
  > Let's vote on *this framework* for the drafting process only, with the understanding that once the charter is ratified, we all abide by the franchise rules written inside it. If we can't agree on this drafting process, we remain in the status quo, which is legally risky for the signatories and unfair to the subletters."

  ### Summary
  The regress stops only when someone accepts the burden of **arbitrary authority** to bootstrap the system. In your case, the Master Lease holders technically already have that authority (they can evict everyone). They are kindly asking for permission to share it.

  The solution is to acknowledge that **rights should correlate with risk.**
  *   **Legal Risk** = Signatory Veto.
  *   **Life Risk** (Quality of Life) = Resident Vote.
  *   **Future Risk** = Ratification Window for new members.

  Formalize this distinction, and you bypass the need to define a single, monolithic "Voter" class that fits everyone.
