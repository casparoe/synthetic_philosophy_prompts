answer: |-
  **Setting:** *Marcus's living room, late evening. Empty coffee mugs and open laptops sit on the table. Marcus looks exhausted. Elena, his friend, is leaning forward, elbows on knees.*

  **Marcus:** It's the stealing that gets me. If he just relapsed? I could handle it. But he looked Mom in the eye, told her he was working, that he was clean, and then drained her savings account. Two weeks ago. I look at him and I see a predator. Then I remember he was fifteen when the abuse started, and I see a victim. And I don't know which one is real.

  **Elena:** And that's why Dana sent you Strawson. Because you're trying to solve a relational problem with a metaphysical one. You're asking, "Is he *ultimately* responsible?" Strawson would say that question is irrelevant to whether you should be angry.

  **Marcus:** Irrelevant? How can it be irrelevant? If his actions are the inevitable result of a causal chain he didn't start—trauma, genetics, the neurochemistry of addiction—then my resentment is tracking a falsehood. It's tracking "basic desert." He doesn't *deserve* my anger in a deep moral sense. Pereboom's point is that once you trace the history, the retributive sting loses its justification.

  **Elena:** But you're conflating *justification* with *function*. Strawson isn't arguing that resentment is metaphysically grounded in libertarian free will. He's arguing it's constitutive of human relationships. If you drop the resentment because of his "causal history," you aren't becoming more rational. You're adopting what he calls the "objective attitude." You're looking at him as a subject for social policy, or therapy, or management. Not as a brother.

  **Marcus:** I'm not trying to manage him like a broken appliance. That's the caricature incompatibilists always get. I can care for him, I can love him, without holding him to account in a way that implies he could have done otherwise in that exact moment. He couldn't have done otherwise, Elena. Not really.

  **Elena:** Okay, let's use Strawson's distinctions then. He talks about *excusing* conditions versus *exempting* conditions. An excusing condition is like, "He didn't know," or "He was coerced." It shows the action didn't reflect his true will. An exempting condition is, "He's a child," or "He's psychotic." It shows he's not a participant in the moral community at all. Where does your brother fit?

  **Marcus:** That's the trap, isn't it? If I say he's exempt, I dehumanize him. If I say he's merely excused, I imply there's a "real him" underneath the addiction that chose to steal. But the addiction *is* the causal mechanism. It's not a mask he's wearing. It's the wiring.

  **Elena:** But he's not psychotic. He's capable of planning. He lied to your mother. That requires theory of mind. It requires understanding norms. That means he's a participant. When you feel resentment, you aren't making a claim about quantum indeterminacy in his brain. You're issuing a demand for regard. You're saying, "I matter, Mom matters, and you violated that." If you suppress that resentment based on Pereboom's hard incompatibilism, you aren't being compassionate. You're opting out of the relationship.

  **Marcus:** Or maybe I'm opting out of a fantasy. Look, think about Pereboom's manipulation argument. If a team of neuroscientists programmed your brother's brain at birth to be traumatized and addicted to meth, and then programmed him to steal that money... would you blame him?

  **Elena:** No. Because that's external coercion.

  **Marcus:** But how is nature different? He didn't choose his parents. He didn't choose the abuse. He didn't choose the dopamine receptors that make meth addictive to him specifically. The causal source is just as external as the neuroscientists. It's just "nature" doing the manipulating instead of a person. If I wouldn't blame him in the manipulation case, why blame him here? The resentment feels like I'm punishing him for being unlucky.

  **Elena:** Because in the manipulation case, there's no *relationship* to repair. In the manipulation case, he's a puppet. But in your case, he's your brother. Strawson would say the reactive attitudes aren't optional theories we adopt; they're the framework of our social world. You can't just decide to turn them off because you read a paper on determinism. If you do, you're treating him as an object. You said it yourself—you don't want to treat him like an appliance. But the objective attitude *is* the appliance attitude. It's about control and cure, not mutual recognition.

  **Marcus:** I can recognize him as a person without believing he deserves suffering. That's the disconnect. I can set boundaries. I can say, "I won't give you money, and I won't let you in the house." That's forward-looking. That's safety. But resentment? Resentment is backward-looking. It's saying, "You *should* have been able to stop." And I don't think he should have been able to stop. Not given the weight of what happened to him.

  **Elena:** But isn't there a version of "should" that survives determinism? When you feel that anger, isn't it partly because you know he *values* your mom? If he didn't care about her, you wouldn't be resentful. You'd just be sad. The resentment proves he's still in the game. It proves he's capable of moral regard, even if he failed. If you adopt the objective stance, you stop expecting that regard from him. You stop hoping for it.

  **Marcus:** I don't stop hoping. I just stop punishing.

  **Elena:** Resentment *isn't* punishment. It's an emotional signal. It's the pain of a violated expectation between equals. If you decide he isn't responsible because of his trauma, you're effectively saying his trauma makes him less than an equal. You're exempting him. And sure, it feels kind. But it's also condescending. It says, "You're too broken to be held to the standard."

  **Marcus:** Or it says, "The standard is broken." Look, I get the risk of the objective attitude. I do. I worry that if I let go of the anger, I'll stop seeing him as a person. But I also worry that if I keep the anger, I'm clinging to a myth of free will that hurts everyone. Mom is bankrupt because she believes he can "just stop." He is in hell because he believes he's a monster. If we accept the causal reality—that this is a disease process rooted in trauma—maybe the anger is the thing preventing recovery. Maybe the resentment is the obstacle, not the bridge.

  **Elena:** Strawson would say you can't sustain that objective view permanently. It's too cold. Eventually, he'll do something good. He'll call. He'll apologize. And you'll feel gratitude. And in that moment, the participant stance snaps back. You can't live in the objective stance. It's not humanly possible.

  **Marcus:** Maybe. Or maybe we're just bad at letting go. Dana says dropping the resentment means giving up on him as a person. I think keeping it means giving up on *truth*. I can love him without believing he's the author of his actions in the way retribution requires. I can protect Mom without needing him to be a villain.

  **Elena:** But who protects *you*? If you don't let yourself be angry at the betrayal, where does that go? If you treat his actions as natural disasters—"Oh, the storm hit again"—you deny your own standing. You matter enough to be wronged. If you refuse to feel wronged because of his causal history, you're sacrificing your own reactive nature to his determinism.

  **Marcus:** *(Pauses, looking at his hands)* I don't feel like I'm sacrificing it. I feel like I'm carrying a weight that isn't mine to carry. If he's determined, his actions aren't ultimately *his* in the way that warrants my hatred. But... *(He looks up)* ...if I stop hating the action, does he stop seeing the cost?

  **Elena:** That's the question, isn't it? Does the objective attitude teach him consequences, or does it just teach him that he's a patient?

  **Marcus:** I don't know. I know that when I look at him, I see the fifteen-year-old kid who got hurt. And I see the thirty-year-old who stole Mom's rent money. And I don't know how to hold both without lying about one. Strawson says hold the anger to keep the relationship. Pereboom says drop the anger to keep the truth.

  **Elena:** And neither tells you how to sleep at night.

  **Marcus:** No. Neither does.

  *(Silence settles between them. Marcus picks up his cold coffee, doesn't drink it, and sets it back down.)*

  **Marcus:** I just wish I knew if letting go of the resentment meant I was forgiving him... or just giving up on him.

  **Elena:** Maybe Strawson and Pereboom agree on one thing: it's not going to be easy.

  **Marcus:** Yeah. I guess that's the only thing that makes sense so far.
