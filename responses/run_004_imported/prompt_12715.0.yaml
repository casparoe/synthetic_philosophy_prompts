          *   *Side B (User's view):* Derk Pereboom's Hard Incompatibilism. Causal history (genes, trauma, addiction) undermines basic desert. We have reason to adopt a stance closer to the objective attitude (without treating them like appliances) because resentment tracks a metaphysical falsehood (basic desert).
