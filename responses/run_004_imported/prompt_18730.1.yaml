          *   *The "Hard Problem":* Even if the brain generates it, *what* is generating it? Qualia.
      *   **Distinguishing "Brain Firing" vs. "Survival":**
          *   The Radio Analogy (classic William James/Brain as Receiver theory). If the radio breaks, the music stops. Does the signal survive? We can't measure the signal without the radio.
          *   This bridges the gap between materialism and the NDE. It allows for the *possibility* without violating physics *yet*.
      *   **The "Realness" of the Experience:**
