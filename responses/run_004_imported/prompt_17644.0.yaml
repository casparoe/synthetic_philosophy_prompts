answer: |-
  **Setting:** *A university conference room, late afternoon. The Research Ethics Board has just adjourned. The files are closed, but the coffee remains. The vote was on a controversial pediatric study involving a placebo arm. As usual, the board deferred to Dr. Aris, the lone moral philosopher on the panel, who argued for approval with strict safeguards. Two remaining members, ELENA (an epidemiologist and moral testimony optimist) and MARCUS (a sociologist and moral testimony pessimist), linger behind.*

  **Marcus:** (Leaning back, rubbing his temples) Well, that's three years in a row we've essentially treated Aris as an oracle. Raise hand if you agree with Aris. Vote passed. I'm starting to feel less like an ethics board member and more like a rubber stamp.

  **Elena:** (Pouring the last of the coffee) Is that really so bad? The protocol is sound. The safeguards protect the kids. We reached the correct moral verdict. If Aris had been a structural engineer telling us the roof wouldn't collapse, would you be upset that we didn't calculate the load-bearing stress ourselves?

  **Marcus:** Yes. Actually, I would. But for different reasons. If a structural engineer tells me the roof is safe, I can walk under it without understanding the physics. But if I approve a study that risks harm to a child, *I* am the one authorizing that risk. I can't outsource the conscience that signs the form.

  **Elena:** That sounds like a category error, Marcus. You're conflating *responsibility* with *epistemology*. You are responsible for the vote, sure. But why is it epistemically irresponsible to rely on someone who has spent thirty years thinking about the Trolley Problem and Kantian duties while you were running regression analyses?

  **Marcus:** Because morality isn't just about getting the right answer. It's about acting for the right *reasons*. This is the point Alison Hills makes. Testimony can give you moral *knowledge*—you know *that* the study is permissible. But it cannot give you moral *understanding*. You don't grasp *why* it's permissible in a way that connects to your own agency.

  **Elena:** But Aris explained her reasoning. She talked about clinical equipoise and the long-term benefit to the population versus the short-term risk to the subject.

  **Marcus:** She gave us the premises and the conclusion. She didn't give us the grasp of the normative force. Think about it. If I tell you, "This wine is excellent because of the tannin structure," and you trust me, you know *that* it's good. But you don't taste it the way a critic does. With wine, that's fine. It's aesthetic. But with morality? If you do the right thing just because Elena said so, you lack moral worth. You're acting on authority, not on a recognition of the moral demand itself.

  **Elena:** That's a very Kantian purity test. It assumes the only valuable moral action is one where I generate the justification from scratch. But Marcus, look at the alternative. If we insist on "understanding" before we vote, we paralyze the board. Moral reasoning is hard. It's prone to bias, fatigue, and blind spots. If I can trust a reliable source to get me to the truth, why is it *virtuous* to struggle in the dark?

  **Marcus:** Because the struggle *is* the point of moral agency! But let's grant your pragmatism for a moment. The deeper issue is the expertise itself. You compared Aris to a structural engineer. That's the weak link in your optimism. How do we verify a moral expert? An engineer's bridge either stands or falls. A doctor's patient either heals or doesn't. What is the truth-tracking metric for Aris?

  **Elena:** Coherence. Consistency. Sensitivity to relevant details. We judge her expertise the same way we judge philosophical expertise in any other domain. She spots distinctions we miss. She catches contradictions in our intuitions. That *is* a form of reliability.

  **Marcus:** Is it? Or is it just rhetorical sophistication? If I defer to a mechanic, I can eventually check if the car runs. If I defer to a moralist, I have to defer to them to know if they're right about the morality of the deference! It's circular. There's no independent access to the moral truth to confirm their track record. That's why moral deference feels "icky," as you put it last week. It's not just a feeling; it's an epistemic dead end.

  **Elena:** I disagree that it's a dead end. I think you're holding morality to a standard of verification that even science doesn't always meet. In immunology, we often rely on statistical models we don't fully understand because the track record of the modelers is strong. We trust the *process*, not just the outcome. Aris's process is rigorous.
  But let's tackle your "understanding" point. You say testimony doesn't convey understanding. But if Aris says, "This is wrong because it treats the subjects as mere means," and I grasp what "mere means" implies in this context... haven't I grasped the reason?

  **Marcus:** You grasp the *proposition* that it treats them as means. You don't have the sensitivity to see *how* it does so in a new context tomorrow. Hills calls this the "autonomy of moral judgment." If you rely on testimony, you're fragile. You can't adapt. If the study parameters change slightly, you're lost unless you ask Aris again. You haven't developed the moral skill; you've just downloaded a verdict.

  **Elena:** But do we *need* everyone on the board to have that skill? Think about the division of cognitive labor. In a hospital, the bioethicist has the skill, the surgeon has the technical skill, the administrator has the logistical skill. We pool our trust. If I insist on developing full moral understanding of every protocol, I'm being cognitively greedy. I'm wasting resources that could be spent on my own expertise, like assessing the statistical power of the study.

  **Marcus:** That works for efficiency, Elena, not for legitimacy. When we vote, we aren't just optimizing outcomes; we are standing as guardians. If a guardian says, "I allowed this because the expert told me to," they haven't guarded anything. They've abdicated.
  And here's the kicker: If moral pessimism is right, then by deferring to Aris, we might actually be making the board *less* moral, even if we make the right decisions. We are atrophying our own moral faculties.

  **Elena:** That assumes our faculties are capable of reaching the right decision without her. I'd argue the opposite. By deferring to Aris, we are aligning ourselves with the truth. If morality is objective—or at least truth-apt—then ignoring the expert is irrational.
  You keep coming back to the "grasp" of the reason. But isn't it possible that *trusting a reliable testifier* is itself a valid reason? "I believe this is permissible because Aris, who is virtuous and knowledgeable, says so." Isn't that a reason I can own?

  **Marcus:** It's a reason for *belief*, maybe. But is it a reason for *action*? If I save a drowning child because Aris told me saving children is good, have I acted morally? Or have I just obeyed Aris? The moral value of saving the child comes from recognizing the value of the child's life, not the value of Aris's testimony.
  The pessimist isn't saying you *can't* believe via testimony. We're saying you shouldn't let that belief be the sole basis for your moral action. You need to do the work to convert that testimony into your own understanding.

  **Elena:** But time is a constraint. We have forty protocols to review. If "doing the work" means deriving the moral calculus for every consent form, the board collapses.
  Here's my challenge to you: If you reject moral testimony, what is your alternative? Do we vote based on our untrained intuitions? Do we flip a coin? Or do we admit that in a complex world, relying on moral experts is the only way to scale ethical behavior?

  **Marcus:** My alternative isn't intuition. It's dialogue. We shouldn't vote until Aris has explained it in a way that *we* understand, not just in a way that *she* understands. The problem today wasn't that we listened to Aris; it was that we stopped asking questions once she gave her verdict.
  Optimism treats moral testimony as a shortcut to the conclusion. Pessimism treats it as a prompt to start the reasoning. If you use her testimony to trigger your own deliberation, that's fine. If you use it to replace your deliberation, you've lost the moral point.

  **Elena:** (Pauses, stirring her cold coffee) So you're shifting the goalposts. You're not saying moral testimony is impossible; you're saying it's insufficient for *deliberative bodies*.

  **Marcus:** I'm saying it's insufficient for *moral agents*. And this board is a collection of agents. If we leave this room having voted "Yes" solely because Aris said "Yes," we haven't done our job. We've just transmitted her agency.

  **Elena:** I can accept that. But I still maintain that if Aris is right, and we trust her, we are epistemically justified. You might be missing the "moral worth" of the action, but we aren't missing the *truth* of the matter. And in research ethics, getting the truth right—protecting the subjects, enabling the science—matters more than the purity of our internal moral state.

  **Marcus:** But if we don't care about the purity of our internal state, how do we ensure we keep protecting the subjects when Aris isn't in the room?

  **Elena:** (Smiles faintly) Then I suppose it's a good thing she's coming back next month. But I'll promise you this: Next time, I'll ask her to explain the "why" until I can repeat it back to you. Will that satisfy the understanding requirement?

  **Marcus:** It's a start. At least then you're using her as a teacher, not an oracle.

  **Elena:** I'll take it. But I'm still signing the form.

  **Marcus:** (Stands up) Me too. But I'm writing my dissent in the minutes. Not about the verdict. About the vote.

  **Elena:** Fair enough. See you at the reading group. I expect you'll be assigning Hills.

  **Marcus:** (Grinning) Already on the syllabus.
