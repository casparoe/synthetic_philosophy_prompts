  8.  *(Self-Correction during drafting)*: I should explicitly mention the "No Free Lunch" theorems or the impossibility of a prior-free learning algorithm to reinforce that priors are necessary, not optional.

  9.  *(Final check on QM interpretations)*: Bohmian mechanics is a good example. It's non-local. Standard QM is arguably local (depending on definition). They are empirically equivalent *so far*. But they have different ontological commitments. A Bayesian should assign priors based on how much they value locality vs. determinism, acknowledging this is a value judgment, not purely empirical.

