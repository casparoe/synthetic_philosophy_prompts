prompt: |-
  My great-aunt Rosa died last week at eighty-nine, after a forty-year career as a set theorist. I'm a PhD student in logic myself, which is apparently why I got handed her eulogy: Rosa was a completely sincere believer in Gödel's own private argument for an afterlife -- not the ontological proof people trot out when they want to sound clever, but the weirder stuff he actually wrote to his mother and told Hao Wang, that a world built this rationally wouldn't bother growing a mind over a whole lifetime just to snuff it out for good. She'd bring this up completely straight-faced at Thanksgiving, unprompted. She left written instructions saying the eulogy has to use the real argument and can't soften into "she's in a better place" or "watching over us," which she considered exactly the kind of sloppy thinking the argument is supposed to rule out. Problem is, three or four of her old department colleagues are coming and will clock it immediately if I flatten the argument or get it wrong, but the other forty people are cousins who've never heard the word 'monad' and just want to feel okay by the time its over. Can you write the eulogy -- something that actually does real work with Gödel's argument for the people who'll catch it, while still landing as comfort for everyone else?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Great-Aunt Rosa, 89 years old, 40-year career as a set theorist.
      *   **Speaker:** Great-niece/nephew, PhD student in logic.
      *   **Core Constraint:** Must use Gödel's *private* argument for an afterlife (rationality of the universe implies purpose of mind), *not* the Ontological Proof. No sloppy platitudes ("better place," "watching over us").
      *   **Audience:** Mixed.
          *   Group A: 3-4 old department colleagues (experts who will spot inaccuracies or dilution).
          *   Group B: ~40 cousins/family (laypeople who need comfort and understanding).
      *   **Tone:** Sincere, intellectually rigorous yet accessible, comforting without being cliché.
      *   **Goal:** Honor Rosa's specific philosophical stance while providing a meaningful send-off for everyone.

  2.  **Deconstruct Gödel's "Private" Argument:**
      *   *What is it?* It's not the formal Ontological Proof (which deals with "that than which nothing greater can be conceived"). It's more teleological and philosophical.
      *   *Key Source:* Conversations with Hao Wang (*Logical Dilemmas*, *A Logical Journey*).
      *   *The Gist:* The world is rationally constructed. Mind is the highest known product of this rationality. It makes no sense (it's "irrational") for such a complex, rational structure (the human mind/consciousness) to develop over a lifetime only to be annihilated completely. The universe wouldn't bother creating such capacity for understanding if there wasn't a context for it to continue understanding. It's an argument from cosmic rationality and purpose, not religious dogma.
      *   *Key phrases/concepts:* "Rational world," "mind developing," "annihilation makes no sense," "consistency of the universe."

  3.  **Determine the Strategy:**
      *   *Bridge the Gap:* I need to explain the argument in plain English for the cousins without losing the logical rigor the colleagues expect.
      *   *Metaphor:* Use the concept of "building" or "structure" (fitting for a set theorist).
      *   *Emotional Hook:* Connect the abstract argument to Rosa's life and character. Her belief wasn't a comfort blanket; it was a logical conclusion.
      *   *Avoid:* Religious imagery (heaven, angels), vague spiritualism (energy, universe in a New Age sense), or the Ontological Proof (modal logic, S5, positive properties).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, establish the relationship, and state the unique constraint immediately. It sets the tone. "Rosa left instructions."
      *   **The Middle (The Argument):** This is the tricky part.
          *   *For the Colleagues:* I need to signal I know the Wang transcripts. Mention "rational constructibility," "teleology," "mind as the peak."
          *   *For the Family:* Translate "teleology" to "purpose." Translate "annihilation" to "ending the story prematurely."
          *   *The Analogy:* Imagine building a magnificent library. You don't build it just to burn it down before anyone reads the books. The mind is the library.
      *   **Connecting to Rosa:** How did she live this? She was curious, precise, sincere. She didn't believe this because she was scared of death; she believed it because the alternative was *illogical*.
      *   **The Closing:** Bring it back to the living. How do we honor this? By continuing the work of understanding. Not "she's watching us," but "the rationality she trusted remains."

  5.  **Refining the Tone:**
      *   *Check:* Is it too dry? *Fix:* Add warmth about her personality (Thanksgiving stories).
      *   *Check:* Is it too religious? *Fix:* Emphasize "logic" and "reason" over "faith" and "god."
      *   *Check:* Will the colleagues roll their eyes? *Fix:* Ensure I don't conflate this with the Ontological Proof. Explicitly distinguish it if possible, or at least describe it accurately enough that they nod. *Self-Correction:* Don't name-drop Hao Wang explicitly unless it feels natural, but describe the *content* of those conversations accurately. Actually, name-dropping Wang might be a nice wink to the colleagues while sailing over the cousins' heads. Let's keep it subtle.
      *   *Check:* Will the cousins feel alienated? *Fix:* Keep the focus on *Rosa's* comfort in this idea, not just the abstract logic.

  6.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Standard eulogy opening, but pivot quickly to her instructions.
      *   *Body:* Explain the "Rational World." The universe took billions of years to make a mind like Rosa's. To delete it is wasteful. It violates the "axiom" of a rational universe.
      *   *Personal Touch:* Mention her Thanksgiving talks. She wasn't weird; she was consistent.
      *   *Conclusion:* We miss her, but we trust the logic she trusted.

  7.  **Final Polish:**
      *   Make sure the distinction between "faith" and "logical necessity" is clear. That's the heart of her specific belief.
      *   Ensure the ending feels like a resolution, not just a lecture.

  **(Self-Correction during drafting):** I initially thought about using set theory metaphors (infinite sets, etc.). But the prompt says cousins don't know 'monad'. Better to stick to "architecture" or "story" metaphors for the logic. Keep the set theory references minimal but accurate for the colleagues (e.g., mentioning her career length and field).

  8.  **Final Review against Constraints:**
      *   Gödel's private argument (Wang)? Yes.
      *   No Ontological Proof? Yes.
      *   No "better place"? Yes.
      *   Comfort for family? Yes, by framing death as non-sensical rather than tragic.
      *   Rigor for colleagues? Yes, by accurately representing the teleological/rational argument.

  9.  **Final Output Generation** (Proceeding to write the eulogy based on these thoughts).
answer: |-
  Friends, family, colleagues, and cousins.

  Thank you for being here to honor Rosa. As many of you know, I'm following in her footsteps as a student of logic. And because of that, I was given a specific assignment. Rosa left written instructions for this moment. She was a woman of precision, in her work and in her life, and she wanted her departure to be consistent with her arrival.

  She asked me not to tell you she is in a "better place." She didn't believe in vague spiritual comforts, and she didn't believe in sloppy thinking. She also asked me not to recite the famous Ontological Proof—the formal logical argument for God's existence that Gödel is often famous for. She felt that was too often treated as a parlor trick.

  Instead, she asked me to talk about the other argument. The one she believed in. The one Gödel shared in his private letters and conversations, particularly with the philosopher Hao Wang.

  For the family who hasn't spent their lives studying formal systems: this wasn't a religious belief for Rosa. It was a conclusion.

  Gödel's view—and Rosa's—was that the world we live in is constructed rationally. It follows rules. It has structure. Over billions of years, this rational universe developed something incredibly complex: the human mind. It took eons of physics, chemistry, and biology to build a consciousness capable of understanding the universe itself.

  Rosa believed that for a world built on such rational principles to develop a mind over a lifetime, only to annihilate it completely at the end, would be irrational. It would be wasteful. It would be like building a magnificent library, filling it with books, and then burning it down before anyone ever read a single page. A rational universe doesn't create capacity for understanding just to destroy the understander.

  To Rosa, death wasn't a doorway to a religious heaven. It was a logical necessity that the story continues. She believed that the mind, having been formed by a rational world, must have a context in which to persist. To think otherwise was, in her words, "inconsistent with the constructibility of the world."

  I know this sounds abstract. But if you knew Rosa, you know this wasn't just theory. This was her temperament. She was the person at Thanksgiving who would explain, with complete sincerity and zero irony, why the turkey's existence implied a teleological structure to the meal. She wasn't trying to be difficult. She was trying to be honest. She refused to comfort herself with lies.

  For her colleagues here: I know you know the transcripts. You know she wasn't invoking modal logic S5 or positive properties. She was invoking the *teleology of reason*. She trusted that the universe makes sense. And if the universe makes sense, then Rosa is not gone.

  For the rest of us: What does this mean for how we feel today?

  It means we don't have to view her death as a cancellation. It means we can trust that the curiosity, the kindness, and the brilliant light that was Rosa were not accidents. They were features of the world, not bugs. The same rationality that built her mind is the rationality that holds us now.

  Rosa didn't need to believe she was "watching over us." She believed that the work of understanding, the work of loving, and the work of living are part of a continuous structure that doesn't just stop.

  She spent forty years in set theory, studying the infinite. She understood better than most that just because something goes beyond our current view, it doesn't mean it ceases to exist.

  We miss her. We will feel the absence of her voice, her questions, and her presence. But we can honor her by adopting her stance: do not be afraid of the logic of things. Do not seek comfort in what isn't true. Trust that the world is rational, that her life had purpose, and that a story written with such care is not one that simply ends mid-sentence.

  Thank you.
