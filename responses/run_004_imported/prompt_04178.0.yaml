  **Tier S (Most Defensible):** Strategies 6 and 1 represent the most principled interventions. Strategy 6 (auditing historical labels) addresses the root cause of the impossibility tension; if "genuine" base rate differences are actually artifacts of biased historical success definitions, correcting the target variable dissolves the mathematical trade-off before it reaches production. Strategy 1 (Equal Opportunity) aligns best with the ethical intent of hiring fairness: ensuring qualified candidates from all groups have an equal chance of advancement, which prioritizes minimizing false negatives (missed talent) over other statistical properties.

  **Tier A (Strong):** Strategy 2 (Calibration) is essential for model validity. If a risk score is not calibrated within groups, a score of 0.8 implies different probabilities of success for different demographics, undermining the tool's interpretability and business justification. However, it ranks below Tier S because calibration alone does not guarantee equitable access or outcomes when base rates differ, potentially masking disparate impact behind statistically valid scores.

  **Tier B (Moderate):** Strategy 4 (Individual Fairness) is theoretically elegant, proposing that similar individuals should be treated similarly regardless of group membership. However, it is difficult to operationalize without encoding bias into the definition of "similarity," and it may conflict with U.S. employment law (Title VII), which focuses on protected group outcomes (disparate impact) rather than individual pairwise comparisons.

  **Tier C (Weak):** Strategies 5 and 7 introduce significant operational or legal risk. Strategy 5 (human review) reintroduces human bias and inconsistency, which is unscalable for entry-level volumes and creates legal liability through arbitrary decision-making. Strategy 7 (randomized thresholds) may satisfy mathematical fairness constraints but is legally perilous in employment contexts, where decisions must be job-related and consistent; randomization is difficult to defend as a business necessity.

  **Tier D (Least Defensible):** Strategy 3 (compliance only) is the least defensible given your specific context. Since you have already identified the mathematical limitations of the 4/5ths rule via the impossibility theorems, adopting no further commitments ignores known risks of latent bias. Relying solely on LL144 minimums fails to meet the "principled" standard leadership requested and leaves the organization vulnerable to ethical and reputational harm despite technical compliance.
