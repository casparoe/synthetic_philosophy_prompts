prompt: |-
  I've read enough rationalist blogs to have internalized "shut up and multiply" as the right response to scope-insensitivity, but a case from my search-and-rescue volunteering keeps nagging at me. Our unit's one helicopter got two emergency calls at once during a storm window that would close the mountain pass by nightfall: a solo skier buried in a slide who would suffocate within the hour, and a van of five hikers stranded on an exposed ledge who would die of exposure in roughly the same window. Either rescue was equally certain to succeed, and equally fatal if we didn't come, and we could only reach one site before the storm closed in. The committee sent the helicopter to the five without much debate, but it's bothered me ever since that the skier's claim to being rescued doesn't seem any weaker just because five strangers elsewhere happened to need the same helicopter that night. Would it actually have been more defensible to give him equal, or at least proportional, odds through some kind of lottery, rather than letting the headcount alone decide who lives — or is that just scope-insensitivity talking?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a search-and-rescue (SAR) volunteer.
      *   **Scenario:** A dilemma occurred where one helicopter had to choose between saving 1 solo skier (avalanche, suffocation risk) vs. 5 hikers (exposure risk). Both groups had equal probability of death if not rescued within the same timeframe. Both rescues were equally certain to succeed if attempted.
      *   **Decision Made:** The committee chose to save the 5 hikers.
      *   **User's Conflict:** The user accepts the utilitarian "shut up and multiply" (save the most lives) principle generally but feels nagging doubt. They feel the skier's claim to life isn't inherently weaker just because 5 others needed help. They wonder if a lottery (equal or proportional odds) would have been more defensible.
      *   **Core Question:** Is the decision to save the 5 purely rational/utilitarian, or is there a moral case for a lottery? Is the user's doubt scope-insensitivity or something deeper?

  2.  **Deconstruct the Ethical Frameworks:**
      *   **Utilitarianism (Aggregate Welfare):** Maximize total lives saved. $5 > 1$. This supports the committee's decision. This is the "Shut Up and Multiply" approach.
      *   **Deontology/Rights-Based:** Each individual has a right to life/rescue. Does the state/organization have a duty to each individual equally? If so, does aggregating needs violate the individual right of the one?
      *   **Contractualism (Scanlon):** What principles could no one reasonably reject? A principle of "save the greater number" is often argued to be acceptable, but "flip a coin" has proponents too (e.g., John Taurek).
      *   **Fairness/Ex Ante Equality:** Before the accident, everyone wants a fair chance. A lottery gives equal *ex ante* probability of being saved if caught in this situation. Saving the many gives the one zero chance.

  3.  **Address the Specific "Nagging" Feeling:**
      *   The user feels the skier's claim isn't weaker. This is a classic objection to strict aggregation.
      *   *Taurek's Argument:* In "Should the Numbers Count?" (1977), John Taurek argues that numbers shouldn't count. From the perspective of the single skier, losing his life is a 100% loss to him. From the perspective of *each* hiker, losing their life is a 100% loss to them. There is no "super-losing" of 5 lives, just 5 individual losses. Therefore, fairness suggests a coin toss.
      *   *Counter-Argument (Parfit/others):* While there is no "group mind," we care about minimizing total tragedy. If we flip a coin, expected loss is 3 lives. If we save the 5, expected loss is 1 life. Most people find minimizing total loss compelling.

  4.  **Evaluate the SAR Context (Institutional Duty):**
      *   SAR isn't just a random bystander making a moral choice. It's a public service/institution.
      *   *Policy vs. One-off:* Institutions need consistent policies to avoid bias, panic, or decision paralysis.
      *   *Public Trust:* If the public knows SAR saves the maximum number of people, they feel safer. If SAR flips coins, families of the 5 might sue/outrage: "You let 5 die to save 1?"
      *   *Resource Allocation:* SAR resources are public goods. Utilitarian allocation is generally the standard for public health and safety (triage).

  5.  **Analyze the "Lottery" Proposal:**
      *   *Equal Odds (50/50):* This treats the *groups* as equal units. But it treats the *individuals* unequally. The skier gets a 50% chance. Each hiker gets a 50% chance (shared). Expected value: 0.5 skier vs 2.5 hikers. Total expected lives saved: 3.
      *   *Proportional Odds (1/6 vs 5/6):* This aligns with utilitarianism in expectation. But practically, how do you roll a 1-in-6 die in an emergency? It adds complexity without changing the outcome (you'd still likely go for the 5).
      *   *Moral Weight:* Does a lottery respect the individuality of the skier more? Yes, it acknowledges his claim isn't *zero*. But does it disrespect the 5 hikers?

  6.  **Synthesize the "Scope Insensitivity" Check:**
      *   Is the user suffering from scope insensitivity? Scope insensitivity usually means valuing 1 life roughly the same as 100 lives (e.g., willingness to pay doesn't scale).
      *   Here, the user acknowledges 5 > 1 but worries about the *moral status* of the 1. This isn't exactly scope insensitivity (which is a cognitive bias). This is a philosophical disagreement about aggregation.
      *   However, in high-stakes triage, "scope insensitivity" might manifest as emotional over-weighting of the identifiable victim (the solo skier feels more "real" than the "group" of hikers).

  7.  **Drafting the Response:**
      *   **Validate:** Acknowledge the weight of the decision. It's a classic trolley problem in real life.
      *   **The Utilitarian Case (The Committee):** Explain why "save the 5" is the standard. Minimizing harm. Public policy consistency.
      *   **The Taurek/Lottery Case (The User's Intuition):** Explain *why* it feels wrong. The "separateness of persons." The skier is being sacrificed, not just outvoted.
      *   **Institutional Reality:** SAR isn't abstract ethics. It's public trust, liability, and protocol. A lottery system is hard to defend to the families of the 5.
      *   **Reframing the Doubt:** It's not necessarily scope insensitivity. It's a tension between *aggregation* and *individual fairness*.
      *   **Conclusion:** The committee's decision was defensible (standard triage), but the user's discomfort is morally sophisticated, not just a bias. It shows empathy for the individual. However, in SAR, the "minimize total loss" principle usually must win for systemic reasons.

  8.  **Refining the Tone:**
      *   Needs to be respectful, empathetic, and intellectually rigorous.
      *   Avoid dismissing the user's feeling as just a bias.
      *   Avoid condemning the committee.
      *   Highlight the difference between *ideal moral theory* and *operational protocol*.

  9.  **Self-Correction/Nuance Check:**
      *   *Did I miss the "equal certainty" constraint?* The prompt says success/failure rates are equal. So no medical triage factors (likelihood of survival). It's pure numbers.
      *   *Is "Shut Up and Multiply" always right?* Rationalists often debate this (e.g., Altruism, existential risk). It's okay to acknowledge the limits of pure aggregation in interpersonal ethics.
      *   *The "Identifiable Victim Effect":* The skier is a "solo" skier. The hikers are a "van." The user might be fixating on the individual because they are alone. This is a bias worth mentioning gently.

  10. **Final Structure:**
      *   Introduction: Validate the gravity of the situation.
      *   The Utilitarian/Policy Defense: Why the committee decided as they did (Triage, Public Good).
      *   The Philosophical Counterpoint: Taurek, fairness, and the "separateness of persons."
      *   The Lottery Analysis: Why it sounds fair but fails in expectation and public trust.
      *   Scope Insensitivity vs. Moral Intuition: Distinguishing bias from legitimate ethical tension.
      *   Closing: Affirmation of the user's character for wrestling with this.

