answer: |-
  This is a fantastic question. You are absolutely right to feel that the standard "shape/color" and "identity/membership" glosses, while textually supported, often feel like they skim the surface of what Gongsun Long is actually attempting. They treat the *Bai Ma Lun* as a semantic trick, whereas this passage you've highlighted suggests he is grappling with something closer to **intensional logic** and the **metaphysics of attributes**.

  Your colleagues' disagreement likely stems from whether they read Gongsun as a proto-analytic philosopher (making a valid point about intension) or a sophist (exploiting ambiguity). This specific passage is the battleground for that interpretation.

  Here is a breakdown of the logical bones of this argument, specifically addressing the function of *ding* (定) and whether it escapes the standard equivocation charge.

  ### 1. What is *Ding* (定) Doing? (Beyond Exclusion)

  You asked if *ding* is just dressier vocabulary for the exclusion point (yellow/black horses don't count) or if it smuggles in something deeper. I argue it is the latter. The earlier arguments about yellow and black horses are **extensional** (looking at the set of objects that satisfy the term). This passage is **intensional** (looking at the content of the concept itself).

  **The Distinction:**
  *   **白 (White):** This is the universal attribute. It is "unfixed" (*bu ding*). It does not commit to a substrate. It is "white-ness" in the abstract.
  *   **白馬 (White Horse):** This is not just "White + Horse." It is "White *fixed onto* Horse."

  **The Logical Move:**
  When Gongsun says 定所白者，非白也 ("What is fixed as white [on a specific thing] is not [universal] White"), he is making a mereological or ontological claim about properties.
  *   Let $W$ be the universal property of Whiteness.
  *   Let $W_h$ be the property of Whiteness as instantiated in a horse.
  *   Gongsun's claim is: $W_h \neq W$.

  Why? Because $W$ is indeterminate regarding its locus. $W_h$ is determinate. By "fixing" the white, you have altered the metaphysical status of the "white." You have moved from a free-floating universal to a qualified particularization.

  **Is it Rigid Designation?**
  Not in the Kripkean sense (reference across possible worlds). It is closer to **specification** or **determination**. Think of it as the difference between a variable and a bound variable.
  *   "White" = $\lambda x . White(x)$ (Open function)
  *   "White Horse" = $\lambda x . White(x) \land Horse(x)$ (Closed/Compound function)
  *   *Ding* is the act of binding the attribute to a specific subject class.

  **So, what does *ding* add?**
  It adds the claim that **compound concepts destroy the purity of their constituent universals.** If you accept that "Fixed-White" is a different entity than "White," then "White Horse" (which contains Fixed-White) cannot be identical to "Horse" (which contains No-Color). It shifts the argument from "The sets are different sizes" to "The conceptual ingredients are incompatible."

  ### 2. The Logic of Exclusion (Qu/Shi 去取)

  The second half of the passage reinforces this with functional logic.
  *   **Horse:** A function that accepts input $\{Yellow, Black, White, ...\}$. It has "no exclusion" (*wu qu*).
  *   **White Horse:** A function that accepts input $\{White\}$ and rejects $\{Yellow, Black, ...\}$. It has "exclusion" (*you qu*).

  **The Syllogism:**
  1.  Entity A is defined by the lack of exclusion (Horse).
  2.  Entity B is defined by the presence of exclusion (White Horse).
  3.  Lack of exclusion $\neq$ Presence of exclusion.
  4.  Therefore, Entity B $\neq$ Entity A.

  This is logically valid *if* we are talking about the **definitions** (intensions). A function $f(x) = x^2$ is not identical to a function $g(x) = x^2$ where $x > 0$. They have different domains/conditions. Gongsun is arguing that "Horse" and "White Horse" are different logical functions.

  ### 3. Does This Dodge the Equivocation Charge?

  This is the crux of your seminar problem. The standard critique is:
  *   **Gongsun proves:** $Concept(White Horse) \neq Concept(Horse)$ (Intensional Non-Identity).
  *   **Audience hears:** $White Horse \notin Class(Horse)$ (Extensional Non-Membership).
  *   **Charge:** Equivocation on *fei* (非).

  **Does this passage fix it?**
  It **strengthens the premise** of non-identity but **does not resolve the pragmatic ambiguity** of the conclusion.

  1.  **Strengthens the Premise:** By introducing *ding*, Gongsun provides a robust metaphysical reason why the concepts differ. It's not just that the extensions differ (which is trivial); it's that the *nature* of the attribute "white" changes when compounded. This makes the claim "White Horse is not [identical to] Horse" much harder to deny on intensional grounds.
  2.  **Fails to Resolve Ambiguity:** The conclusion "White Horse is not Horse" (*Bai Ma Fei Ma*) is still delivered in a form that invites an extensional reading. In classical Chinese (as in English), "A is not B" can mean "A is not identical to B" or "A is not a member of the kind B."
      *   If *Fei* means "is not identical to": The argument succeeds. (The concept of a restricted set is not identical to the concept of an unrestricted set).
      *   If *Fei* means "is not a member of": The argument fails. (A white horse is still a member of the class horse).

  **However,** there is a nuanced defense available here that might interest your students. Gongsun might be arguing that because the *intensions* are fundamentally different (one involves *ding*, the other doesn't), the **kind** "White Horse" is ontologically distinct from the **kind** "Horse."

  He isn't saying a white horse isn't a member of the class of horses. He is saying "The Kind *White-Horse*" is not "The Kind *Horse*."
  *   Kind $K_1$: Defined by shape only.
  *   Kind $K_2$: Defined by shape + fixed color.
  *   $K_1 \neq K_2$.

  If we read the conclusion as a statement about **Kinds** (universals) rather than **Particulars** (individual animals), the equivocation charge loses some bite. He is saying "The universal *White-Horse* is not the universal *Horse*." This is trivially true. The "sophism" relies on the audience thinking he is talking about the individual animal standing in front of them.

  ### 4. Teaching Strategy: The "Mohist Counter-Punch"

  To really unstick your seminar, I recommend juxtaposing this passage with the **Later Mohist Canons** (specifically *Canon B 67* and *Explanation B 67*), which were written largely to refute Gongsun Long.

  The Mohists distinguish between:
  1.  **Hard/White (Jian Bai):** Where attributes are inseparable in the object.
  2.  **White/Horse (Bai Ma):** Where "Horse" is the substantive and "White" is the modifier.

  The Mohists argue that "White Horse" is simply "Horse" + "White." They reject Gongsun's *ding* metaphysics. They would say:
  *   "Horse" picks out the shape.
  *   "White" picks out the color.
  *   "White Horse" picks out the shape + color.
  *   To ask for a "White Horse" is to ask for a "Horse" that satisfies an additional condition. It does not create a new ontological category that excludes it from being a "Horse."

  **Discussion Question for your Students:**
  "Is Gongsun Long's *ding* a profound insight into how modifiers change the logical type of a noun (turning a universal into a specific concept), or is it a category error that treats conceptual modification as ontological separation?"

  ### Summary for your Seminar

  1.  **On *Ding*:** It is not just exclusion. It is the transition from **Universal** (unfixed) to **Particularized Attribute** (fixed). It claims $White_{abstract} \neq White_{instantiated}$.
  2.  **On Logic:** The argument moves from Extensional (sets of horses) to Intensional (definitions/functions). It argues that a function with conditions $\neq$ a function without conditions.
  3.  **On Equivocation:** It does not *dodge* the equivocation, but it *justifies* the non-identity reading. It makes the "is not identical to" reading so strong that it tries to overwhelm the "is not a member of" reading. Whether it succeeds depends on whether you accept that differences in intension preclude membership in the same natural kind.

  This passage shows Gongsun Long isn't just playing word games; he is proposing a logic where **determination negates universality**. That is a genuinely difficult philosophical claim, worthy of a grad seminar's scrutiny.
