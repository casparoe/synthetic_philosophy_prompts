  7.  **Final Polish:** Organize with clear headings or bullet points for readability. (Decided on a flowing essay style with key concepts highlighted). Ensure the distinction between *epistemic* change (how we know) and *ontological* change (what exists) is hinted at without getting too jargon-heavy.

