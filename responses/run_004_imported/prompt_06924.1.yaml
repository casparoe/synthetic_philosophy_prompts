answer: |-
  **MEMORANDUM**

  **TO:** Small-Grants Committee, [University Name] EA Club
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Proposal [ID/Name] and Framework for High-Variance Grantmaking

  ### Executive Summary

  This memo addresses the proposal requesting the full semester budget ($4,000) to support external research into AI bargaining/alignment. While the proposal presents a compelling *mathematical* Expected Value (EV) case based on a low-probability/high-impact framework, I recommend **declining the proposal in its current form.**

  The rejection is not based on a rejection of longtermism or EV maximization. Rather, it is based on **epistemic credibility standards.** The probability estimate provided ($1/200,000$) is an uncalibrated subjective claim lacking independent verification. Accepting it would violate principles of epistemic hygiene and set a precedent that renders the committee vulnerable to exploitation.

  I propose we adopt a **Credibility-Weighted EV Framework** for future high-variance proposals to ensure we can evaluate similar pitches consistently without falling prey to Pascal's Mugging.

  ### 1. The Expected Value Argument (Steelmanned)

  We must acknowledge the strength of the proponent's argument. Under a total-view longtermist framework:
  *   **Impact:** $\approx 10^{16}$ lives (existential risk reduction).
  *   **Probability:** $1/200,000$ ($5 \times 10^{-6}$).
  *   **Cost:** $\$4,000$.
  *   **Cost per Life Saved:** $\approx \$0.0000008$.

  Compared to GiveWell top charities (estimated $\$5,000$–$\$10,000$ per life saved), this proposal appears to outperform by orders of magnitude. If these numbers were calibrated, rejecting this proposal would indeed be irrational and morally negligent. The burden is on the committee to explain why these inputs are flawed.

  ### 2. Epistemic Analysis: Why the Probability Estimate Fails

  The core failure of the proposal is not the multiplication, but the input probability. In decision theory, we must distinguish between *aleatory uncertainty* (inherent randomness) and *epistemic uncertainty* (lack of knowledge).

  **A. The Complexity Penalty (Bostrom/Yudkowsky)**
  As covered in our recent seminar, Pascal's Mugging relies on the claimant asserting a causal link between a small action (funding $4k) and an astronomically large outcome ($10^{16}$ lives). Yudkowsky's "Pascal's Muggle" response highlights that as the claimed impact grows, the complexity of the required causal mechanism grows with it.
  *   To believe $4,000 influences $10^{16}$ lives, we must accept a chain of assumptions: the research is valid, the friend is the one to solve it, the solution is scalable, the solution is deployed, and it successfully mitigates x-risk.
  *   Each link in this chain introduces uncertainty. A rational prior for "unvetted individual solves AI alignment with small grant" is not $1/200,000$; it is likely closer to $10^{-20}$ or lower, based on reference class forecasting of historical scientific breakthroughs.
  *   The claimant has provided no evidence sufficient to update our prior from the base rate to $1/200,000$. A pitch deck is not evidence of a breakthrough; it is evidence of a pitch.

  **B. Calibration and Track Record**
  Probabilities are only useful if they are calibrated. A meteorologist saying "50% chance of rain" is meaningful because we can check their past accuracy. This claimant has:
  *   No publication record.
  *   No independent verification of the "close to breakthrough" claim.
  *   No track record of calibrated forecasting.
  Without calibration, the $1/200,000$ figure is rhetorical, not mathematical. We cannot treat a guess as a calibrated probability.

  ### 3. Institutional and Incentive Risks

  Beyond the math, we must consider the game theory of our grantmaking process.

  **A. Goodhart's Law and Incentives**
  If we fund this proposal, we signal that the most effective way to secure EA club funding is to:
  1.  Claim astronomically high impact.
  2.  Assert low probabilities that cannot be easily disproven.
  3.  Avoid independent vetting.
  This invites spam and scams, draining committee time and capital away from robust interventions.

  **B. Opportunity Cost**
  Funding this proposal consumes 100% of our semester budget. This eliminates our ability to fund high-confidence interventions (e.g., local outreach, verified donations to top charities). In a portfolio context, putting 100% of capital into a venture with a $>99.99\%$ chance of total loss (based on realistic priors) is imprudent risk management, even if the theoretical upside is infinite.

  ### 4. Recommendation

  **Vote: Do Not Fund.**

  The proposal fails to meet the evidentiary bar required to justify the probability estimate provided. Funding it would be an act of faith, not expected value maximization.

  **Alternative Offer:**
  If the applicant is confident in the work, we invite them to return with:
  1.  Independent verification of the research status from a recognized expert in the field.
  2.  A milestone-based funding request (e.g., $500 for a specific draft, contingent on expert review).

  ### 5. Proposed Policy: Credibility-Weighted EV

  To prevent this debate from recurring, I propose we adopt the following principle for future cycles:

  **The Epistemic Credibility Threshold:**
  *For proposals claiming impact significantly exceeding standard longtermist benchmarks (e.g., >100x GiveWell efficiency), the probability estimate must be adjusted by a Credibility Discount Factor (CDF).*

  *   **CDF = 1.0:** Vetted expert, track record, peer-reviewed work.
  *   **CDF = 0.1:** Strong reasoning, some external validation, no track record.
  *   **CDF = 0.001 (or lower):** Unvetted claim, no external validation, "black box" research.

  *Adjusted EV = (Claimed Impact) × (Claimed Probability) × (CDF)*

  Applying this to the current proposal (using a conservative CDF of 0.001 for unvetted claims):
  *   The effective probability drops from $1/200,000$ to $1/200,000,000$.
  *   The EV falls below our standard intervention options.

  This allows us to remain "shut up and multiply" rational while accounting for the reliability of the inputs. It protects the club from mugging while keeping the door open for genuine high-risk/high-reward opportunities that can demonstrate credibility.

  ### Next Steps

  I move that we vote on this proposal based on the **Credibility-Weighted EV** framework. If the committee agrees, we will decline the current pitch but formalize the CDF policy for future cycles.

  ***

  **Notes for the User (Not part of the memo):**
  *   **Why this works:** It doesn't tell the EV guy "EV is wrong." It tells him "Your inputs are wrong." It shifts the debate from *values* (which are hard to change) to *epistemology* (where you have the seminar material to back you up).
  *   **The "CDF" Policy:** This is a simplified version of what funds like OpenPhil actually do (they apply heavy discounts to unverified claims). It gives you a bureaucratic shield for future votes.
  *   **Tone:** Keep it collaborative during the meeting. If the EV guy pushes back, ask him: *"What evidence would it take to move your prior on this specific person solving AI alignment from the base rate to 1/200,000? Is a pitch deck enough?"* Usually, they will admit it isn't.
