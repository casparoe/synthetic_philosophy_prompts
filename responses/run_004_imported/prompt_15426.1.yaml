answer: |-
  **Setting:** *The study at Oxford, late evening. A fire is dying down. P.F. Strawson sits in his armchair, reading glasses perched low on his nose, holding a typescript. Galen sits opposite, leaning forward, a half-empty glass of wine in hand.*

  **P.F. Strawson:** (Lowering the paper) "You've been busy, Galen. This is… rigorous. I suppose I should expect nothing less."

  **Galen:** "And?"

  **P.F.:** "And it's a fortress. You've built a fortress around the notion of *causa sui*. You're saying that to be truly responsible for an action, one must be truly responsible for the mental nature that produced the action."

  **Galen:** "Precisely. Look at section four, Dad. That's the hinge. Most people think the threat to responsibility comes from determinism. They think if the universe is indeterministic, if there's some random gap in the causal chain, maybe we can slip freedom in there."

  **P.F.:** "The libertarians."

  **Galen:** "Right. But I'm arguing that indeterminism doesn't help. It doesn't *bite* there. If my choice is random, it's not *mine* in the way required for responsibility. If it's determined, it's not *mine* either. But the deeper point—the one I want you to see—is that even if we ignore the determinism debate entirely, the regress kills it."

  **P.F.:** "Walk me through it again. For the old man."

  **Galen:** "Okay. Say I choose to help a stranger. To be responsible for that help, I must be responsible for the motive that led to it—say, my empathy. But how did I get that empathy? Did I choose it? If I didn't choose it, I'm not responsible for it. If I *did* choose it, I must have chosen it based on some prior reason or principle. Why did I value empathy? Well, because of some prior character trait. But where did *that* come from?"

  **P.F.:** "And so on."

  **Galen:** "And so on. To be truly responsible, I would have to have chosen my own nature. But to choose my nature, I must already *have* a nature to do the choosing. I'd have to exist before I existed to design myself. It's logically impossible. It's not just that we *aren't* responsible; it's that *nothing* could be. Not a god, not an angel. Unless it's its own cause, which is nonsense. So, ultimate moral responsibility is impossible."

  **P.F.:** (He folds the paper neatly and places it on the side table.) "It is a very clean argument, Galen. Logically watertight, provided one accepts the premise."

  **Galen:** "Which premise? That you can't be *causa sui*?"

  **P.F.:** "That 'responsibility' requires being *causa sui*. That is where we part company. Not on the logic of the regress, but on the demand that generates it."

  **Galen:** "But it's the only demand that makes sense! If I'm not the ultimate source of my actions, how can I deserve praise or blame? If my character is just a product of genetics and environment and luck, why resent me? Why praise me?"

  **P.F.:** "Ah. There it is. 'Why resent me?' You treat resentment as a judicial verdict that requires a metaphysical warrant. You think we look at a person, check their metaphysical status—'Are you the ultimate source?'—and if the box is ticked, we permit ourselves the emotion of resentment. If not, we must suppress it."

  **Galen:** "Isn't that right? If it's unfair to resent someone who couldn't help themselves, and nobody can help themselves…"

  **P.F.:** "But we aren't judges in a cosmic court, Galen. We are participants in a life. In *Freedom and Resentment*, I tried to show that reactive attitudes—resentment, gratitude, forgiveness, love—aren't theories. They are natural facts. They are like breathing. You don't ask for a metaphysical justification for breathing before you inhale."

  **Galen:** "But we *can* step back. We can take the objective stance. If I see a man acting violently because he has a brain tumor, I don't resent him. I see him as an object to be managed. My argument is that *everyone* is, in principle, in the position of the man with the brain tumor. We are all products of luck."

  **P.F.:** "But we don't *live* that way. And we can't. Unless someone is deeply disturbed, or a child, we cannot sustain the objective stance toward our friends, our lovers, our enemies. When you hurt me, Galen, I feel resentment. I don't first conduct an inquiry into whether you are the *causa sui* of your hurtfulness. The resentment *is* the recognition of your responsibility."

  **Galen:** "That's circular! You're defining responsibility as 'whatever triggers resentment.' But what if resentment is based on a false belief? What if it's based on the illusion of ultimate responsibility?"

  **P.F.:** "Is it an illusion? Or is it a different kind of truth? You are looking for a kind of responsibility that stands outside of human practice. A 'true' responsibility that validates our practices from the outside. I am telling you there is no outside. There is only the human community and the ways we hold one another accountable within it."

  **Galen:** "So you're saying we should just ignore the metaphysics? Keep blaming people even though we know, philosophically, that they couldn't have done otherwise in the ultimate sense?"

  **P.F.:** "I'm saying the 'ultimate sense' is a chimera. It's a philosopher's invention. It demands a kind of freedom that has no place in human life. You ask, 'Could he have done otherwise?' In the context of our life, that means 'Was he coerced? Was he insane? Was he ignorant?' If the answer is no, then he is responsible. That is all 'responsible' means."

  **Galen:** "But that's just compatibilism with a human face. It feels like you're changing the subject. I'm talking about *desert*. Deep moral desert. If I can't be the ultimate source, I don't *deserve* punishment in a deep sense. I might need containment, or retraining, but not *blame*."

  **P.F.:** "And if you remove blame, you remove love. You cannot have a world of reactive attitudes where you only get gratitude but no resentment. They are two sides of the same coin. To demand the coin be minted in the metal of 'ultimate sourcehood' is to demand there be no currency at all."

  **Galen:** (Sighs, leaning back.) "So, we're stuck. I'm saying the concept of moral responsibility, as commonly understood, implies an impossibility. You're saying the concept is constituted by our attitudes, so it can't be impossible because it *exists*."

  **P.F.:** "Precisely. You are analyzing the concept from the armchair, looking for its conditions of possibility in the structure of the universe. I am looking at the concept in the wild, seeing how it functions in the lives of human beings."

  **Galen:** "Then maybe we aren't disagreeing about the world. Maybe we're just using the word 'responsibility' to label two different things."

  **P.F.:** "I suspect so. You are talking about *Ultimate Responsibility*. A metaphysical status. I am talking about *Interpersonal Responsibility*. A social status."

  **Galen:** "But Ultimate Responsibility is the one that matters for justice! For true fairness."

  **P.F.:** "Is it? Or is Interpersonal Responsibility the only one that *can* matter for justice, because it's the only one we can actually practice? You want a justice that is pure of luck. I am offering you a justice that is human, which is to say, impure."

  **Galen:** (Quietly) "It feels like I'm letting people off the hook."

  **P.F.:** "And it feels like you're holding them to a standard that would condemn a god. Perhaps, Galen, the hook you think they're on… is one we never actually hung them on."

  *(P.F. picks up his tea cup. Galen looks at the manuscript on the table, then at his father.)*

  **Galen:** "You think I'm chasing a ghost."

  **P.F.:** "I think you're chasing a shadow cast by a very bright light. The light is our humanity. The shadow is the metaphysical doubt. Don't mistake the shadow for the substance."

  **Galen:** "I still think the regress holds."

  **P.F.:** (Smiles faintly) "And I still think it doesn't apply to the life we live. But… the paper is excellent. Rigorous. It will make them think."

  **Galen:** "Even if they shouldn't?"

  **P.F.:** "Especially if they shouldn't. That is what philosophy is for."

  *(Galen nods, a small smile breaking through. He reaches for the wine bottle.)*

  **Galen:** "More tea, Dad?"

  **P.F.:** "Please. And leave the metaphysics in the glass for now."
