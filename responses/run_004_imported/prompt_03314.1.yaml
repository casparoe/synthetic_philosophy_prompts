          *   *Global Games:* Noisy private signals + continuous state $\rightarrow$ Unique Equilibrium (often risk-dominant). Coordination succeeds (or is uniquely selected) without needing CK. The "paradox" is an artifact of the Email Game's specific structure.
      *   **Characters:** Two epistemic game theorists.
