answer: |-
  **Setting:** *A quiet corner of the conference center at the World Congress of the Game Theory Society. Coffee cups are scattered on a low table. Elena Varkov (University of Vienna) and Marcus Thorne (LSE) have just stepped out of a panel on "Information and Coordination."*

  **Elena:** You have to admit, Marcus, the elegance of Rubinstein's result still holds up. It's the canary in the coal mine. We spend so much time smoothing things out, but the Electronic Mail Game tells us that knowledge is digital, not analog. You either have Common Knowledge, or you don't. There is no "almost."

  **Marcus:** Elegance, yes. Realism, no. Elena, we've been over this. The Email Game is a topological singularity. It's like a frictionless plane in physics. It tells you what happens when you assume a specific, brittle structure of higher-order beliefs. The Global Games literature didn't just "smooth things out"; it showed that Rubinstein's discontinuity vanishes the moment you introduce a tiny bit of uncertainty about the *payoffs* themselves, rather than just the channel.

  **Elena:** But that's exactly the moral! In the real world, the channel *is* the bottleneck. Think of a military coordination attack, or a currency peg defense. The fundamentals might be sound, but if I'm not sure you're sure I'm sure we're attacking, I hold back. Rubinstein captures the fragility of trust. The fact that the equilibrium jumps discontinuously from "Attack" to "Wait" as you move from Common Knowledge to finite mutual knowledge isn't a bug; it's the feature. It explains why rational agents fail to coordinate even when they are 99.9% sure the other will cooperate.

  **Marcus:** But are they 99.9% sure? In the Email Game, once the first message is received, the state of the world is fixed. The only uncertainty is the infinite tail of confirmations. In Global Games, the uncertainty is on the parameter $\theta$. By forcing the players to integrate over a continuous range of fundamentals, we break the infinite regress. We don't need to climb the ladder of "I know that you know" forever. We just need to know that *if* the signal is high enough, the other guy attacks. The iterated deletion of dominated strategies does the heavy lifting, not the epistemic hierarchy.

  **Elena:** You're dismissing the hierarchy too easily. Weinstein and Yildiz showed that any prediction in a Global Game that relies on that unique equilibrium is fragile to perturbations in higher-order beliefs. If I change the prior slightly—specifically, if I allow for types who doubt the rationality of others at the 100th order—the Global Games selection can collapse. The Email Game respects the product topology of belief spaces. It treats every order of knowledge as a distinct dimension. Global Games imposes a uniform topology that washes out the high-order distinctions. Why should strategic behavior be continuous in a metric that ignores the discrete nature of reasoning steps?

  **Marcus:** Because strategic behavior isn't about counting reasoning steps; it's about best responses to payoff-relevant uncertainty. In the Email Game, the payoff structure is binary and rigid. If you change the game so that the loss from miscoordination varies continuously with the state, the "cliff" disappears. My point is this: The Email Game result relies on the assumption that the *only* thing preventing coordination is the lack of Common Knowledge. But in Global Games, we see that coordination is driven by the *risk dominance* of the actions relative to the signals. The "paradox" of the Email Game arises because you've removed the anchor of the fundamentals. You've made the messages the only reality.

  **Elena:** I haven't removed the fundamentals; I've isolated the epistemic condition. Look, suppose we are in a situation where the fundamentals are great. We both see it. But we communicate via a noisy server. I get five confirmations. You get four. I know you know the state is good. You know I know. But I don't know that you know that I know. According to you, in a Global Games framework, we should still coordinate if the signal is strong enough. But Rubinstein proves that if the game is truly common knowledge *except* for the state transmission, we play safe. My argument is that high-order uncertainty *matters* precisely when the stakes of miscoordination are high. Global Games assumes away the terror of the infinite regress by burying it in a prior distribution.

  **Marcus:** It's not burying it; it's integrating it. Think about the "almost common knowledge" concept from Monderer and Samet. They showed that $p$-belief is sufficient for coordination *if* the game is continuous. Rubinstein's game is discontinuous by construction. So, when you say the Email Game reveals something "real," what you're really saying is that the world is discontinuous. I'm saying the world is continuous, and our models should be robust to small changes in the information structure. If a tiny change in the model—switching from discrete lost messages to noisy signals about a continuous parameter—flips the result from "Never Coordinate" to "Coordinate on Threshold," then the "Never Coordinate" result is an artifact. It's a mathematical phantom.

  **Elena:** But is the world continuous? Actions are discrete. I attack or I don't. I sell the currency or I hold. The discontinuity is in the *payoff*, not just the information. When actions are discrete, the value of higher-order knowledge becomes discontinuous. That's the insight! You Global Games folks want to say, "Oh, just look at the fundamental threshold." But if I suspect that *you* suspect that *I* might have missed a message, that doubt compounds. In the Email Game, the probability of the chain breaking is small, but the *strategic* implication of that break is total. You argue that Global Games are more robust because they survive perturbations of the prior. I argue the Email Game is more robust because it survives the removal of the "common prior" crutch. It works with pure logic of knowledge.

  **Marcus:** It works with pure logic, yes, but logic detached from economic substance. In Global Games, the uniqueness comes from the fact that at very low signals, you know I won't attack, so you won't attack. At very high signals, you know I will. We iterate that out. It's a contagion of certainty that spreads from the extremes. In the Email Game, there are no extremes. The state is either Good or Bad, fixed at the start. There's no "very good" signal to anchor the iteration. You've constructed a void where the only thing that exists is the echo of the messages. Of course coordination fails there! It's a hall of mirrors.

  **Elena:** A hall of mirrors is exactly what a financial market looks like during a crisis! We aren't looking at fundamentals; we're looking at each other looking at fundamentals. That's the Keynesian beauty contest. The Email Game formalizes the horror of that regress. If Common Knowledge is the only thing that sustains the risky equilibrium, and Common Knowledge is impossible to attain via noisy channels, then the collapse is rational. Your Global Games solution tells me *which* equilibrium we pick if we assume a specific distribution of types. Rubinstein tells me *why* we might fall into the bad equilibrium even when we are practically certain of the truth.

  **Marcus:** But Rubinstein says we fall into the bad equilibrium *always*, regardless of how many messages pass. Ten messages, a thousand messages—it doesn't matter. That's the hard pill to swallow. It implies that no amount of communication can ever substitute for Common Knowledge. But in the lab, and in history, people *do* coordinate after enough handshakes. Global Games explains that: eventually, the private signals become precise enough that the higher-order doubt becomes payoff-irrelevant. The Email Game insists the doubt is always payoff-relevant. Why? Because you assumed the loss from miscoordination is infinite or the structure is perfectly symmetric. Relax the symmetry, relax the binary state, and the Email Game result crumbles.

  **Elena:** It crumbles into what? Into your Global Games equilibrium? That just proves my point about topology. You change the topology of the type space from product to uniform, and the result flips. So the question isn't which math is right—both are. The question is: which topology describes human epistemic states? I say the product topology. I say that the 100th order of belief is distinct from the 101st. If you conflate them, you get continuity. If you respect them, you get the cliff. The moral of the Email Game is that rationality is brittle. The moral of Global Games is that rationality is robust. I think history sides with brittleness.

  **Marcus:** And I think history sides with the fact that we manage to coordinate every day without exchanging infinite emails. We drive on the right side of the road; we use currency; we show up to meetings. We don't have Common Knowledge that the other driver won't swerve. We have noisy signals of their trajectory. Global Games captures that. It shows that you don't need the infinite hierarchy to sustain coordination; you just need the incentives to align sufficiently at the margin. The Email Game is a warning label: "Do not assume Common Knowledge lightly." Global Games is the manual: "Here is how coordination actually emerges from noise."

  **Elena:** (Smiling) So, we agree on the warning label, but disagree on whether the manual works without it.

  **Marcus:** Precisely. You think the warning label *is* the map. I think it's just a caution sign on a road we drive every day.

  **Elena:** Then let's hope the road doesn't end at a cliff.

  **Marcus:** If it does, Elena, my model will tell us exactly how far from the edge we are when we jump. Yours just tells us we're already falling.

  **Elena:** Touché. Coffee?

  **Marcus:** Please. I'll even send you a confirmation email when I order.

  **Elena:** Don't bother. I won't open it unless I have Common Knowledge you paid.
