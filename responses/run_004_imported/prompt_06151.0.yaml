      *   *Decision:* As an *Engineering Representative* focused on *Safety Policy*, the priority is user safety and system reliability. A strict intent-based definition renders safety policies toothless. However, acknowledging the technical reality is crucial for engineering alignment.
      *   *Hybrid/Functional Approach:* Define deception functionally based on *representation of capability/state* rather than internal belief. If the model presents uncertainty as certainty, or mimics human reasoning without doing it, that's deceptive behavior regardless of "belief."
