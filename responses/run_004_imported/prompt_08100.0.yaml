prompt: |-
  So in my social choice theory seminar this week we raced through Sen's taxonomy of "informational bases" for interpersonal utility comparisons (ordinal non-comparable, cardinal non-comparable, ordinal level comparability, cardinal unit comparability, cardinal full comparability...) and honestly I just nodded along without really getting the punchline. Could you give me the gut-level intuition for why cardinal unit comparability (gains/losses comparable across people, but not absolute levels) is what pins down utilitiarianism, while ordinal level comparability (levels comparable, gains/losses aren't) is what pins down rawlsian maximin instead? I've seen the d'aspremont-gevers-ish proofs but I don't want the formal axiomatics again, i want to actually get why THOSE specific informational assumptions map onto THOSE specific aggregation rules and not, like, the reverse pairing.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Context:** Social Choice Theory seminar.
      *   **Topic:** Sen's taxonomy of informational bases for interpersonal utility comparisons.
      *   **Specific Confusion:** Why does *Cardinal Unit Comparability (CUC)* lead to *Utilitarianism*, while *Ordinal Level Comparability (OLC)* leads to *Rawlsian Maximin*?
      *   **Constraint:** No formal axiomatic proofs (d'Aspremont-Gevers, etc.). The user wants "gut-level intuition." They want to understand the *mapping* between the information available and the resulting rule, specifically why the reverse pairing doesn't work.

  2.  **Deconstruct the Core Concepts:**

      *   **Utilitarianism:** Maximize the sum of utilities ($\sum u_i$). Requires adding utilities. To add utilities meaningfully, the *size* of the steps (units) must be the same across people. The starting point (zero) doesn't matter as much because adding a constant to everyone's utility doesn't change the ranking of sums (if the population is fixed).
      *   **Rawlsian Maximin:** Maximize the utility of the worst-off ($\min u_i$). Requires knowing who is at the bottom. To know who is at the bottom, you need to compare *levels*. The size of the steps above the bottom doesn't matter, only the ordering of the levels.
      *   **Cardinal Unit Comparability (CUC):** We can compare *differences* ($\Delta u$). "My gain is bigger than your gain." We *cannot* compare levels ("I am happier than you"). Transformation: $u_i' = a u_i + b_i$ (same $a$, different $b_i$).
      *   **Ordinal Level Comparability (OLC):** We can compare *levels* ("I am happier than you"). We *cannot* compare differences ("My gain is bigger than your gain"). Transformation: $u_i' = \phi_i(u_i)$ where $\phi_i$ is strictly increasing (different functions for everyone).

  3.  **Brainstorming the Intuition (The "Why"):**

      *   *Why CUC $\rightarrow$ Utilitarianism?*
          *   Utilitarianism sums utilities. Summing implies adding units.
          *   If I can't compare units (e.g., my "1 util" is twice as big as your "1 util"), summing is nonsense. It's like adding meters to feet without conversion.
          *   CUC says: "Our rulers have the same tick marks." So we can add them up.
          *   CUC says: "Our zero points are arbitrary." Does Utilitarianism care about zero points? If I add 100 to everyone's score, the person with the highest total sum stays the same. So Utilitarianism is invariant to level shifts. This matches CUC perfectly.
          *   *Reverse check:* Why not Maximin? Maximin needs to know *who* is lowest. CUC allows arbitrary zero points ($b_i$). I can shift your utility down by 1,000,000 and make you the worst off, even if you were the best off before. So CUC information is *too weak* on levels to sustain Maximin.

      *   *Why OLC $\rightarrow* Maximin?*
          *   Maximin looks for the minimum level.
          *   OLC says: "We can compare levels." So we can identify the minimum.
          *   OLC says: "We cannot compare units/differences." Does Maximin care about how much better off the rich are? No. It only cares about the bottom. It ignores the magnitude of gains for the better-off.
          *   *Reverse check:* Why not Utilitarianism? Utilitarianism sums. To sum, I need to know that a 1-unit gain for Alice is equivalent to a 1-unit gain for Bob. OLC allows Alice's scale to be stretched or squished independently of Bob's ($\phi_A$ vs $\phi_B$). If I stretch Alice's scale, her contribution to the sum changes arbitrarily. So OLC information is *too weak* on units to sustain Utilitarianism.

  4.  **Drafting the Explanation (Iterative Process):**

      *   *Introduction:* Acknowledge the confusion. It's a classic "informational constraint" problem.
      *   *Analogy Time:* Need a concrete analogy. Measuring height? Temperature? Money?
          *   *Money* is cardinal and comparable (usually).
          *   *Temperature* is good for CUC (Celsius vs Fahrenheit is a linear transform, but comparing 20C to 10C difference is valid). Wait, CUC allows different zero points. So Celsius vs Fahrenheit is actually *Full* Cardinal Comparability if we fix the scale.
          *   *Better Analogy:* "Happiness Rulers."
      *   *Section 1: The Utilitarian/CUC Link.*
          *   Focus on the "Sum."
          *   To sum, tick marks must match (Cardinal Unit).
          *   Zero points don't matter for the *ranking* of sums (invariance to $b_i$).
          *   Show why OLC breaks Utilitarianism (stretching scales changes the sum).
          *   Show why CUC breaks Maximin (shifting zero points changes who is min).
      *   *Section 2: The Rawlsian/OLC Link.*
          *   Focus on the "Minimum."
          *   To find the min, you need to line up the zeros/levels (Level Comparability).
          *   Distances don't matter (Ordinal).
          *   Show why CUC breaks Maximin (shifting zeros).
          *   Show why OLC breaks Utilitarianism (stretching scales).
      *   *Section 3: The "Punchline" / Synthesis.*
          *   It's about what information is *invariant* under the allowed transformations.
          *   Utilitarianism is invariant to level shifts (matches CUC).
          *   Maximin is invariant to scale stretching (matches OLC).
      *   *Refining the Intuition:* Use the "Dictator of Transformations" idea. If a social welfare function relies on information that the informational basis says is "noise" (arbitrary), it's invalid.

  5.  **Polishing the Tone:**
      *   Keep it conversational but precise.
      *   Avoid $\forall, \exists, \phi$. Use words like "stretch," "shift," "tick marks," "zero point."
      *   Address the "reverse pairing" explicitly as requested.

  6.  **Self-Correction/Check during drafting:**
      *   *Wait, does OLC actually pin down Maximin?* Strictly speaking, OLC allows for a whole class of prioritarian rules, but Maximin is the *limit* case or the most prominent one that *only* uses that info. Actually, under OLC, any rule that depends only on the ordering of levels works. Maximin is the extreme case. But the prompt asks why OLC *pins down* Rawlsian Maximin. I should clarify that Maximin is the *only* rule that respects OLC *and* satisfies certain equity conditions (like anonymity and Pareto), but mostly, it's that Maximin *works* with OLC while Utilitarianism *fails*. I need to be careful not to say OLC *uniquely* implies Maximin without other axioms, but rather that Maximin is the natural fit because it *only* requires that info.
      *   *Correction:* Actually, the standard result (d'Aspremont & Gevers) is that with OLC + Pareto + Anonymity + Independence, you get a leximin or maximin type rule. With CUC + Pareto + Anonymity + Independence, you get Utilitarianism. The key is that Utilitarianism *requires* CUC (it breaks under OLC), and Maximin *requires* OLC (it breaks under CUC).
      *   *Wait, does Maximin break under CUC?* Yes! Because CUC allows independent shifts of zero points ($b_i$). If I can shift your zero point down arbitrarily, I can make you the worst-off person regardless of your "true" welfare. So Maximin is *not* invariant to CUC transformations. This is a crucial point. Maximin needs Level Comparability (OLC or better), but it *cannot tolerate* the arbitrary level shifts allowed in CUC.
      *   *Wait, does Utilitarianism break under OLC?* Yes. OLC allows independent stretching ($\phi_i$). If I stretch your scale, your weight in the sum changes arbitrarily.
      *   *So the logic is:*
          *   Utilitarianism needs Unit Comparability (to add) but doesn't need Level Comparability (sums rank the same if levels shift). -> Fits CUC.
          *   Maximin needs Level Comparability (to find min) but doesn't need Unit Comparability (magnitudes above min don't matter). -> Fits OLC.
      *   *Crucial distinction:* CUC *forbids* Level Comparability (levels are non-comparable). OLC *forbids* Unit Comparability (units are non-comparable).
      *   So: Utilitarianism requires info CUC *has* (units) and ignores info CUC *lacks* (levels). Maximin requires info OLC *has* (levels) and ignores info OLC *lacks* (units).

  7.  **Final Plan:**
      *   Intro: The "Measuring Stick" analogy.
      *   Part 1: Utilitarianism & CUC (The "Adding" Game).
      *   Part 2: Maximin & OLC (The "Floor" Game).
      *   Part 3: Why the Reverse Fails (The "Noise" argument).
      *   Conclusion: Informational Efficiency.

  8.  (Self-Correction on "Pins Down"): I should clarify that these informational bases *allow* these rules to be meaningful. If you try to use Utilitarianism with OLC, the rule becomes undefined/arbitrary. If you try to use Maximin with CUC, the rule becomes undefined/arbitrary. That's the "pinning down."

