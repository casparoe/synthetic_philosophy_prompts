answer: |-
  This is one of those moments in social choice theory where the math feels like magic until you realize it's just about **what counts as "noise" versus "signal."**

  Sen's taxonomy is basically a list of rules about what kind of measurements we are allowed to treat as meaningful. If a social welfare rule (like Utilitarianism) relies on information that your informational basis says is "arbitrary noise," that rule is invalid.

  Here is the gut-level intuition for why the pairing works the way it does, using the **"Measuring Stick" analogy.**

  ---

  ### 1. The Setup: Two Types of Measurement Noise

  Imagine everyone has a personal "Happiness Ruler."

  *   **Level Comparability (Ordinal Level):** We all agree on where "zero" is, or at least we can line up our rulers to see who is higher. However, the **tick marks** might be different. My "1 unit" of happiness might be a huge jump, while your "1 unit" is a tiny nudge.
      *   *Allowed transformation:* You can stretch or squish your ruler however you want, as long as you don't flip it upside down.
  *   **Unit Comparability (Cardinal Unit):** We all agree on the size of the **tick marks**. A 1-point gain for me is the exact same "amount" of happiness as a 1-point gain for you. However, the **zero point** is arbitrary. My ruler might start at -100 while yours starts at 0.
      *   *Allowed transformation:* You can slide your ruler up or down (change the zero), but you cannot stretch or squish the distance between numbers.

  ---

  ### 2. Why Utilitarianism Needs Cardinal Unit Comparability (CUC)

  **The Rule:** Maximize the **Sum** ($\sum u_i$).

  **The Intuition:**
  To add numbers together meaningfully, the **units must match.**
  If I say "I gained 5 utils" and you say "I gained 5 utils," Utilitarianism treats those as equal contributions to the social good.
  *   **If you have OLC (Ordinal Level):** Your "5 utils" might be a microscopic change, while my "5 utils" is a life-altering event. Because OLC allows you to stretch your scale independently of mine, the **Sum becomes arbitrary.** I could make Utilitarianism pick any outcome I want just by stretching my own utility scale to make my preferences weigh heavier. Therefore, Utilitarianism is **undefined** under OLC.
  *   **If you have CUC (Cardinal Unit):** We agree on the tick marks. So adding them up is valid. But what about the zero point? CUC says zero points are arbitrary (I can shift my ruler up by 100). Does that break Utilitarianism? **No.** If you add 100 to everyone's utility, the *total sum* increases, but the **ranking of outcomes** stays the same. Outcome A is still better than Outcome B if the sum of *gains* is higher. Utilitarianism is "level-invariant."

  **The Punchline:** Utilitarianism cares deeply about **magnitudes** (units) but doesn't care about **absolute standing** (levels). CUC provides magnitudes but treats levels as noise. Perfect match.

  ---

  ### 3. Why Rawlsian Maximin Needs Ordinal Level Comparability (OLC)

  **The Rule:** Maximize the **Minimum** ($\min u_i$).

  **The Intuition:**
  To find the person at the bottom, you must be able to compare **levels.**
  *   **If you have CUC (Cardinal Unit):** CUC says absolute levels are arbitrary noise. I am allowed to take your utility ruler and slide it down by 1,000,000 points. Suddenly, *you* are the worst-off person, even if you were the happiest before. Because CUC allows me to shift zero-points independently, **who counts as "the worst-off" is arbitrary.** Therefore, Maximin is **undefined** under CUC.
  *   **If you have OLC (Ordinal Level):** OLC says we can compare levels (we know who is lower than whom), but the tick marks are arbitrary. Does that break Maximin? **No.** Maximin doesn't care *how much* happier the rich people are, or *how big* the gap is. It only cares about the **ordering** of the levels. Stretching the scale (changing units) doesn't change who is at the bottom. Maximin is "unit-invariant."

  **The Punchline:** Maximin cares deeply about **absolute standing** (levels) but doesn't care about **magnitudes** (units/gains). OLC provides levels but treats units as noise. Perfect match.

  ---

  ### 4. Why the Reverse Pairing Fails (The "Noise" Test)

  This is the part that usually clicks for students. Ask yourself: **What does the rule treat as signal that the information basis treats as noise?**

  **Attempt 1: Utilitarianism with Ordinal Level Comparability (OLC)**
  *   **OLC says:** "The size of the tick marks is noise. Alice can stretch her scale however she wants."
  *   **Utilitarianism says:** "I need to add Alice's utils to Bob's utils."
  *   **The Crash:** If Alice stretches her scale, her weight in the sum changes. Utilitarianism tries to use "unit size" as **signal**, but OLC says unit size is **noise**.
  *   *Result:* The rule is manipulatable/arbitrary.

  **Attempt 2: Maximin with Cardinal Unit Comparability (CUC)**
  *   **CUC says:** "The zero-point is noise. Alice can slide her scale up or down however she wants."
  *   **Maximin says:** "I need to find who has the lowest absolute score."
  *   **The Crash:** If Alice slides her scale down, she becomes the worst-off. Maximin tries to use "absolute level" as **signal**, but CUC says absolute level is **noise**.
  *   *Result:* The rule is manipulatable/arbitrary.

  ### Summary Table

  | Feature | **Utilitarianism** | **Rawlsian Maximin** |
  | :--- | :--- | :--- |
  | **What it calculates** | Sum of utilities | Minimum utility |
  | **Needs to compare...** | **Gains/Units** (to add them) | **Levels** (to find the bottom) |
  | **Ignores...** | **Levels** (shifting zero doesn't change the sum ranking) | **Units** (stretching scale doesn't change the min) |
  | **Compatible Info** | **Cardinal Unit (CUC)** <br>*(Units fixed, Levels arbitrary)* | **Ordinal Level (OLC)** <br>*(Levels fixed, Units arbitrary)* |
  | **Incompatible Info** | **Ordinal Level (OLC)** <br>*(Units are arbitrary $\rightarrow$ Sum breaks)* | **Cardinal Unit (CUC)** <br>*(Levels are arbitrary $\rightarrow$ Min breaks)* |

  ### The "Gut Check"

  *   **Utilitarianism** is a **consequentialist aggregator**. It wants to know "How much total good was created?" That requires a common currency (Cardinal Units). It doesn't care who started richer or poorer (Levels don't matter).
  *   **Rawlsianism** is a **status comparator**. It wants to know "Who is suffering the most?" That requires a common baseline (Ordinal Levels). It doesn't care how much potential gain is being lost elsewhere (Units don't matter).

  Sen's theorem basically says: **You cannot build a coherent social welfare function that uses information your measurement system says doesn't exist.** Utilitarianism requires unit info (CUC); Maximin requires level info (OLC). Swap them, and you're building on sand.
