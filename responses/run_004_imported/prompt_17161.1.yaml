prompt: |-
  Okay so this is kind of a random thing but I've been overthinking it for like a week now and need a sanity check. I'm the treasurer for my school's student council, and after that apartment fire over on Maple St we ran a bake sale + online fundraiser to help the families who got displaced. We ended up raising exactly $2,000, which sounded like alot until we found out how the losses actually broke down. One family, the Delgados, lost literally everything in the fire and need the full $2,000 for a security deposit on a new place - if they get anything less then that they can't secure the apartment at all, so a partial amount is basically the same as nothing for them. But there are also five other families in the building who each lost some stuff (furniture, clothes, one family's car got wrecked too) and each of them says $400 would genuinely fix their situation.

  So it's really one or the other: give the whole $2,000 to the Delgados, or split it $400 each across the five other families. My gut said obviously do whichever one helps more people, that seemed like common sense to me. But one of the other officers, Maya, said it's not that simple, and that maybe we should honestly just flip a coin between "give it all to the Delgados" or "split it five ways" instead of automatically picking whichever side has more people on it. She couldn't really explain why beyond saying it felt more fair to her to give the one family a real shot instead of just outvoting them with numbers, and now I can't stop thinking about whether she's actually onto something real or if that's just a weird way of being unfair to five families to make one family happy. We have to actually decide at the next meeting on Thursday, so is there an actual argument for her position, or is "help the greater number" just obviously correct and I should stop overthinking this?
