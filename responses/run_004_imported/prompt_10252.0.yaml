  Ok so me and my friend got into a whole thing last night about the Church-Turing thesis and neither of us backed down. He kept citing that Kripke lecture (the one where CTT apparently falls out as a corollary of Gödel's completeness theorem, once you grant this thing he calls "Hilbert's thesis" -- that any deduction can be fully expressed in first-order logic) as basically proof the thesis is a real theorem now, not just a "thesis." I said thats kind of a shell game, your just trading CTT for an equally unprovable assumption, and that "effective calculability" isn't rigorous enough to ever be *proven* equivalent to turing-computability in the first place -- Turing's original move was more like a conceptual analysis (an explication, a la Carnap) than an actual proof, and explications aren't really the kind of thing thats provable or unprovable, though maybe they can still be judged correct or incorrect. We went in circles for like an hour and it was kind of annoying honestly.

  Write me an essay that actually takes a side: is the Church-Turing thesis best understood as a theorem, an empirical hypothesis, a definitional/stipulative move, or something else entirely? Actually defend one answer instead of just listing the options and shrugging -- a nuanced verdict is fine (like "it's unprovable but that just shows the theorem-vs-thesis framing is wrong"), just commit to something.
