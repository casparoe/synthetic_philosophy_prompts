answer: |-
  This is a remarkably astute observation. You have correctly identified that the friction in your postmortems isn't just a failure of management or culture; it is an instantiation of a deep philosophical problem.

  The gap between your company's "official line" (The Control Principle) and the "practice" (judging based on outcomes) is exactly what Thomas Nagel described in his 1979 paper *Moral Luck*.

  Here is an analysis of what the moral luck literature implies for your team, specifically addressing whether outcome-blindness is achievable and whether resultant luck has a legitimate role in engineering accountability.

  ### 1. The Translation: Nagel's Taxonomy in Engineering Terms

  To apply this, we first need to map Nagel's categories to your incident response process.

  *   **The Control Principle:** This is your "Blameless Postmortem" policy. It states: *An engineer should only be evaluated on the quality of their decision-making process, code review, and testing strategy, not on whether the server caught fire.*
  *   **Resultant Luck:** This is the "downstream dependency under heavy load." Two engineers write equally risky code. Engineer A deploys on a quiet Tuesday (no incident). Engineer B deploys on Black Friday (incident). Engineer B is judged harshly. This is the core tension you are observing.
  *   **Circumstantial Luck:** This is *who* happened to be on call, or *who* happened to be assigned the ticket for the payment system that week. If the payment system is a minefield, the person standing on it has bad circumstantial luck.
  *   **Constitutive Luck:** This is the engineer's innate talent, experience, or risk tolerance. Some engineers are naturally more cautious; others are more aggressive. We don't choose our temperament, yet it affects our incident rate.

  ### 2. Is a Genuinely Outcome-Blind Culture Achievable?

  **The short answer is no.** The philosophical literature suggests that trying to achieve 100% outcome-blindness is not only psychologically impossible but potentially undesirable.

  **The Psychological Barrier:**
  Human beings are hardwired to respond to harm. When a payment system goes down, money is lost, customers are angry, and stress spikes. This emotional weight naturally attaches itself to the causal agent (the engineer who pushed the button). To ask a team to feel *nothing* different about the engineer who caused $100k in losses versus the one who risked it but didn't trigger it is to ask them to suppress a fundamental moral intuition.

  **The Epistemic Barrier:**
  In philosophy, we often assume we can know the "quality of the decision" independent of the outcome. In engineering, **outcomes are often our only data point regarding risk.**
  If Engineer A and Engineer B both write under-tested code, but only Engineer B breaks production, Engineer B's failure provides *new information* about the system's fragility that Engineer A's success did not. The outcome reveals hidden coupling or load constraints that were previously theoretical. Therefore, the outcome *changes* the assessment of the risk, making it impossible to treat the two events as identical in retrospect.

  **Implication:** Stop striving for "outcome-blindness." It sets you up for hypocrisy. Instead, strive for **"outcome-aware but blame-free."** Acknowledge that the outcome matters (because harm occurred) without attributing moral failing to the agent.

  ### 3. Does Resultant Luck Do "Legitimate Work"?

  You asked if resultant luck is doing legitimate work in your judgments. The literature suggests **yes, but only in specific domains.**

  **Where Resultant Luck is Illegitimate:**
  *   **Moral Condemnation:** Engineer B is not a "bad engineer" compared to Engineer A.
  *   **Career Punishment:** Engineer B should not be denied a promotion or bonus solely because a race condition triggered under load they couldn't predict.
  *   **Psychological Safety:** Engineer B should not feel afraid to speak up in the future.

  **Where Resultant Luck is Legitimate:**
  *   **Prioritization of Repair:** We *must* care more about Engineer B's change. Even if the risk was identical, the *realized harm* demands immediate remediation. Resultant luck dictates where we spend our energy.
  *   **Causal Responsibility:** Engineer B is the one who must lead the fix. This isn't punishment; it's efficiency. They have the most context on the change that failed.
  *   **Signal Amplification:** An incident is a louder signal than a near-miss. It is legitimate for the organization to react more strongly to the signal that actually triggered the alarm.

  **Implication:** You need to decouple **Accountability** from **Blame**.
  *   *Blame* is backward-looking moral judgment (Illegitimate due to resultant luck).
  *   *Accountability* is forward-looking ownership of the remedy (Legitimate, even with resultant luck).
  Engineer B should have *more* accountability (lead the fix, write the postmortem draft) but *zero* blame (no stigma, no performance impact).

  ### 4. Bernard Williams and "Agent-Regret"

  This is perhaps the most useful tool for your team. Bernard Williams distinguished between **Guilt** and **Agent-Regret**.

  *   **Guilt:** "I did something wrong. I am bad." (Implies moral fault).
  *   **Agent-Regret:** "I wish this hadn't happened. I was involved in this. I will make it right." (Implies causal involvement without moral fault).

  Williams used the example of a lorry driver who, through no fault of their own (a child runs into the road), hits and kills a pedestrian. The driver is not *guilty*. But it would be strange if the driver felt nothing. They should feel *agent-regret*. They are the agent of the tragedy, even if not the moral author of it.

  **Application to Postmortems:**
  Your current culture likely tries to suppress *all* negative feeling to be "blameless." This leaves Engineer B feeling guilty (because humans feel guilt naturally) while the company says "don't."
  Instead, validate **Agent-Regret**.
  *   *Bad:* "Don't worry, it wasn't your fault, let's move on." (Invalidates their experience).
  *   *Bad:* "You need to be more careful." (Assigns Blame).
  *   *Good:* "This was a systemic risk, but you are the one who touched the lever. It makes sense that you feel heavy about this. We need you to lead the fix because you care the most about ensuring it doesn't happen again."

  This channels the energy of resultant luck into constructive ownership without the corrosive effects of shame.

  ### 5. Practical Implications for Your Team

  Based on this philosophical framework, here is how you should adjust your accountability model:

  **A. Measure Near-Misses (Combating Resultant Luck)**
  If you only judge risk by incidents, you are at the mercy of resultant luck. You must actively hunt for "Engineer A" situations (risky deploys that didn't break).
  *   *Action:* Implement chaos engineering or stricter code analysis that flags risky patterns *before* they deploy. If you catch Engineer A's risky code in review, you neutralize the luck differential between A and B.

  **B. Rotate Circumstantial Luck**
  If the payment system is fragile, the engineer assigned to it has bad circumstantial luck. If the same senior engineers always get the "safe" projects and juniors get the "legacy" projects, your incident reports will always blame juniors.
  *   *Action:* Rotate ownership of risky services. Ensure that "who broke prod" is statistically distributed according to who touches the code, not who is least powerful in the org.

  **C. Separate Incident Reviews from Performance Reviews**
  This is critical. Resultant luck inevitably colors perception. Even if you say "no blame," a manager will subconsciously associate Engineer B with "risk."
  *   *Action:* Create a firewall. Data from postmortems should be aggregated for system health, not individual performance. A manager should not be able to see a count of "incidents caused" by a direct report during calibration meetings.

  **D. Reframe "Blameless" to "Just Culture"**
  "Blameless" sounds like "nothing matters." A **Just Culture** (a concept from aviation and healthcare safety) acknowledges the distinction between **human error**, **at-risk behavior**, and **reckless behavior**.
  *   *Human Error (Unintentional slip):* Console and system fix. (Most incidents).
  *   *At-Risk Behavior (Cutting corners due to pressure):* Remove the pressure/coaching.
  *   *Reckless Behavior (Conscious disregard for safety):* Punitive action.
  Most engineering incidents are Human Error exacerbated by system design. A Just Culture acknowledges that while we don't blame the error, we do hold the agent responsible for the *remediation* (Agent-Regret).

  ### Summary

  The moral luck literature suggests that your company's struggle is not a failure of execution, but a feature of human moral psychology.

  1.  **Outcome-blindness is impossible.** Outcomes provide data and trigger emotional responses that cannot be fully switched off.
  2.  **Resultant luck is legitimate for resource allocation** (fix the broken thing first) but **illegitimate for moral judgment** (don't call the engineer sloppy).
  3.  **Use Agent-Regret.** Allow the engineer who broke production to feel the weight of causal responsibility without the stain of moral guilt. Let that feeling drive their ownership of the fix.

  Your goal shouldn't be to pretend the outcome didn't matter. It should be to ensure that the *consequences* of the outcome fall on the **system**, while the **responsibility** for the repair falls on the **agent**, without the **stigma** falling on the **person**.
