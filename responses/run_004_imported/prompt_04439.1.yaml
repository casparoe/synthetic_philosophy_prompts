      *   **Stakes:** High (AP Chem grade matters for GPA).
      *   **User's Intuition:** Leaning toward Ms. Carter (the known quantity).
      *   **Friend's Advice:** Pick the new teacher because the user *guesses* he's easier (maximize expected grade).
      *   **Question:** Is the friend right, or is there a valid reason to stick with the known teacher?

  2.  **Evaluate the Friend's Logic:**
      *   *Premise:* Easier teacher = Higher Grade = Better GPA.
      *   *Assumption:* The new teacher *is* easier.
      *   *Flaw:* It's a guess ("if I had to guess"). There is zero data.
      *   *Risk:* If the new teacher is harder or disorganized, the grade suffers.
