      *   *New Teacher:* Unknown floor, unknown ceiling. Could be a pushover (easy A, bad AP prep) or a disaster (confusing, unfair, low grades).
      *   *GPA Impact:* A predictable B+ is often better than a gamble between an A and a C.

  6.  **Identify Key Factors for the Decision:**
