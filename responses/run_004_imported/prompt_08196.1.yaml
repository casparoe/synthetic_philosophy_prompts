answer: |-
  You have spotted one of the most significant "smoking guns" in the history of moral philosophy. Your reading of the grammar is correct, and your intuition about its connection to the Repugnant Conclusion is historically accurate.

  You are asking three distinct things: how to parse the sentence, whether Sidgwick was troubled by it, and how to place him in the history of the Repugnant Conclusion without flattening the nuance. Here is a walkthrough.

  ### 1. Parsing the Sentence: The Math of the Claim

  Let's break down the two competing formulas Sidgwick presents in that passage.

  *   **The View He Rejects:** *"That at which the average happiness is the greatest possible."*
      *   **Formula:** Maximize $\frac{\text{Total Happiness}}{\text{Number of People}}$
      *   **Implication:** If adding a new person lowers the average happiness (even if that new person is happy), you should not add them. This is **Average Utilitarianism**.
  *   **The View He Endorses:** *"That at which the produce formed by multiplying the number of persons living into the amount of average happiness reaches its maximum."*
      *   **Formula:** Maximize $(\text{Number of People} \times \text{Average Happiness})$
      *   **Implication:** You should keep adding people as long as their existence adds *any* positive amount of happiness to the universe, even if their happiness is lower than the current average. This is **Total Utilitarianism**.

  **To answer your specific question:** Yes, Sidgwick is explicitly licensing the addition of people even as average happiness falls, provided the *sum total* of happiness continues to rise.

  If you have 1 billion people with 10 units of happiness each (Total: 10 billion), Sidgwick's principle says you should prefer a world with 10 billion people with 2 units of happiness each (Total: 20 billion), assuming those lives are still net positive.

  This is precisely the mathematical engine that drives the Repugnant Conclusion.

  ### 2. Was Sidgwick Troubled? (The Malthusian Context)

  This is where the nuance lies. While Sidgwick accepts the *principle* of Total Utilitarianism as the correct deduction from the "Greatest Happiness" axiom, he does not discuss it with the same philosophical horror that Parfit later would.

  **Sidgwick's Context:**
  Sidgwick was writing in the shadow of Thomas Malthus. For Sidgwick, population ethics was not primarily a metaphysical puzzle about possible worlds (as it was for Parfit); it was a grim economic calculation about resource scarcity.

  In *The Methods of Ethics* (Book IV, Chapter I), Sidgwick acknowledges that as population increases, the "average happiness" will inevitably decline due to limited resources (food, land, capital). The question for him is: *Where do we draw the line?*

  **His Attitude:**
  Sidgwick does not treat this conclusion as "repugnant." He treats it as a **logical corollary** that creates tension with "Common Sense Morality."
  *   **Common Sense** tells us we should prioritize the *quality* of life of existing people (Average View).
  *   **Utilitarian Logic** tells us we should prioritize the *quantity* of happiness in the aggregate (Total View).

  Sidgwick is famously honest about the "dualisms" and contradictions in ethics. He admits that the Utilitarian conclusion here is harsh. He writes elsewhere in the chapter that if we follow the strict Utilitarian rule, we might be forced to encourage the propagation of the poor (who are numerous) even if it lowers the general standard of living, provided the total sum of pleasure increases.

  However, he is not "troubled" in the sense of thinking the *math* is wrong. He is troubled by the *practical* reality that maximizing the total might lead to a world of widespread mediocrity or subsistence. He hopes that education and prudence will naturally keep population in check, but ethically, he stands by the Total View. He does not recoil from it as a *reductio ad absurdum*; he accepts it as the price of consistency.

  ### 3. Sidgwick vs. Parfit: Placing it in History

  It is accurate to say Sidgwick formulated the **Total View**, but it is inaccurate to say he formulated the **Repugnant Conclusion**. Here is the distinction:

  **Sidgwick (The Architect):**
  Sidgwick established the axiom: *More good lives are better than fewer good lives, even if the quality drops.* He viewed this as the rigorous application of the "Greatest Happiness Principle." For him, the "maximum produce" was the target. He didn't push the thought experiment to its absolute limit (a world of lives "barely worth living") because he was constrained by economic reality. He assumed the "maximum total" would be reached while life was still reasonably decent, simply because resources would run out before we got to the "barely worth living" stage.

  **Parfit (The Critic):**
  Parfit, writing a century later in *Reasons and Persons* (1984), removed the economic constraints. He asked us to imagine a world where we *could* sustain billions of people, even if their lives were only marginally worth living.
  *   Parfit's move was to take Sidgwick's logic and stretch it until it snapped against our intuitions.
  *   Parfit coined the term "Repugnant Conclusion" specifically to signal that **this cannot be right.**
  *   For Sidgwick, the conclusion was difficult but necessary. For Parfit, the conclusion is a bug in the system that proves Total Utilitarianism is false (or needs modification).

  **Why Parfit gets the credit:**
  Parfit gets the credit because he identified the *problem*. Sidgwick stated the principle; Parfit showed that the principle leads to a conclusion that almost no one can accept. Before Parfit, many philosophers (following Sidgwick) simply accepted the Total View without feeling the intuitive "repugnance." Parfit made it impossible to ignore.

  ### 4. Is there a "Narrower Claim" buried here?

  You asked if there is a narrower claim that later summaries flatten out. There is one crucial caveat in Sidgwick's surrounding text that often gets lost:

  Sidgwick is discussing the point up to which population ought to be **encouraged**.

  He is not necessarily arguing for a duty to *maximize* population at all costs. He is arguing against the view that we should stop population growth to preserve a high *average* standard of living. He is saying: "Do not stop growth just to keep the average high; stop growth only when the total sum stops increasing."

  Furthermore, Sidgwick assumes a **diminishing marginal utility** of population. He believes that as you add people, the average happiness drops *faster* than the population rises, eventually causing the total to peak and then fall. He isn't imagining an infinite ascent of population; he is imagining a bell curve. The "Repugnant Conclusion" in Parfit's sense assumes we can keep the total rising indefinitely by adding more and more low-quality lives. Sidgwick assumes physical limits will cap the total before the lives become "repugnant."

  ### Summary

  1.  **Your reading is correct:** Sidgwick is explicitly endorsing Total Utilitarianism over Average Utilitarianism. He licenses adding people as long as the total sum of happiness rises, even if average happiness falls.
  2.  **Sidgwick's Reaction:** He was not "repugned" by this. He viewed it as the logically correct, if somewhat grim, implication of Utilitarianism. He was more worried about Malthusian poverty than the philosophical paradox.
  3.  **Historical Placement:** Sidgwick built the engine (Total View); Parfit drove it off the cliff (Repugnant Conclusion) to show us the danger. Sidgwick provides the premise; Parfit provides the critique.

  You have traced the lineage correctly. Sidgwick is the grandfather of the Repugnant Conclusion, but he didn't know he was raising a monster. He thought he was just doing the math.
