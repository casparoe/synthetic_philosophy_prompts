answer: |-
  **Fixation**

  Arthur sat at the kitchen table, the wood cool against his forearms. On the wall opposite him, a small red sticker marked the spot where he was to rest his gaze. Do not look away, the researchers had said. Keep the eyes fixed. If you move them, the picture slides. If the picture slides, it goes to the other side. And if it goes to the other side, we don't know what happens.

  He kept his eyes on the red dot. The kitchen blurred slightly at the edges, the periphery softening into a haze of beige cabinets and morning light.

  "Ready," he said. His voice sounded normal to him. Flat, clear, the voice he had used for forty years of teaching history.

  From off to his left, outside the cone of his central vision, a card was held up. He couldn't see it. He knew it was there because he had set the protocol himself. He was the experimenter and the subject. It was safer that way. He didn't like the way the graduate students looked at him sometimes, like he was a broken vessel they were trying to glue back together with theory.

  His left hand, resting on the table, twitched. It wasn't a spasm. It was a vector. A pull. The fingers extended, the wrist pronated, and the hand slid across the laminate surface toward a spread of picture cards laid out in front of him.

  Arthur kept his eyes on the red dot. He felt the movement of the arm as a proprioceptive ghost, a report coming in from a distant outpost. He didn't know what the left hand was reaching for. The right hemisphere knew, but the right hemisphere didn't have the words. It only had the map.

  The left hand hovered over the pictures. A shovel. A rain cloud. A dog. A key.

  It tapped the shovel.

  "Why that one?" Arthur asked. He wasn't asking the hand. He was asking the air, or perhaps the part of him that generated the sentences.

  "Because it's useful," Arthur said.

  He blinked. He hadn't decided to say that. The words had assembled themselves in the throat and pushed out. *Useful.* It was a reasonable answer. A shovel is useful. But the card on the left—the one only the left hand had seen—had been a picture of snow. He knew this because he had shuffled the deck. He knew the logic should have been *snow requires a shovel*. But he hadn't seen the snow. Only the left side had seen the snow. The speaking side had seen nothing but the red dot.

  So why did he say *useful*?

  Because the speaker needed a reason. The speaker could not tolerate a gap. If the hand moved, there must be a motive. If there was no conscious motive, the mind would fabricate one to keep the story of *Arthur* intact. He had read the papers. He knew the mechanism. Knowing it didn't stop the fabrication. It just made him feel like a passenger in a car where the driver was writing the navigation log in real-time.

  "Again," he said.

  The card on the left changed. This time, his right hand moved. It reached for a pencil on the table. It began to tap a rhythm against the wood. *Tap. Tap-tap. Tap.*

  Arthur felt a surge of irritation. He hadn't decided to tap. The right hand was restless. Or maybe the left hand was tense, and the right hand was compensating. Cross-cuing. The hemispheres weren't totally silent to one another; they leaked. Mood leaked. Arousal leaked. If the right side was anxious, the left side might feel a tightness in the chest and invent a reason for it. *I am anxious because of the test,* Arthur thought. But maybe he was just anxious because the right hemisphere didn't like the color of the card.

  He stopped the tapping with his left hand. He clamped his fingers over the pencil.

  The right hand resisted.

  It wasn't a struggle, not exactly. It wasn't like wrestling an opponent. It was like trying to steer a bicycle that had decided to turn itself. The muscles in his right forearm tightened, pushing against the grip of the left. The left hand squeezed harder. The knuckles whitened.

  Arthur held his breath. He was fighting himself. But who was *himself*?

  If he let go with the left, the right would tap. If he held the left, the right would strain. There was no third party to adjudicate. There was only the body, locked in a static tension, and the voice in the head waiting for a resolution it couldn't provide.

  "Stop it," Arthur said.

  The right hand relaxed.

  "Did you mean to do that?" he asked the silence.

  "I was just stretching," he replied.

  The lie was smooth. It arrived instantly, packaged with the confidence of truth. *Stretching.* Of course. Why else would one hand fight the other? It was a cramp. A reflex. Anything but a conflict of will.

  Arthur exhaled. He looked down at his hands. They were resting side by side now. They looked identical, save for the wedding band on the left ring finger. He remembered putting the ring there. He remembered the ceremony. He remembered the feeling of the gold cooling against the skin. That memory belonged to the whole. Or did it? The speech center had narrated the vows. The right side had felt the emotion. Had they agreed? Or had they just been synchronized by the corpus callosum, like two metronomes placed on the same board, clicking in time because the wood vibrated between them?

  Now the wood was cut. The vibration didn't pass.

  He reached for his coffee mug with his right hand. As he lifted it, his left hand shot out and steadied the base. It was a helpful gesture. Cooperative.

  "Thank you," Arthur said.

  He took a sip. The coffee was cold. He hadn't noticed until the liquid hit his tongue. The right side had felt the temperature, but the left side had to name it. *Cold.* The word arrived a second after the sensation.

  He set the mug down. He looked back at the red dot on the wall. He needed to finish the session. He needed to write the log. *Subject reports no significant intermanual conflict. Subject reports coherent narrative flow.*

  He picked up the pen. He began to write. *I am...*

  The pen stopped.

  He looked at the paper. *I am.*

  Singular. First person.

  If he wrote *I am*, he was claiming the left hand's action as his own. He was claiming the right hand's resistance as his own. He was claiming the confabulation as his own.

  If he wrote *We are*, he was admitting to a plurality that the grammar of his life didn't support. There was no *we* in the mirror. There was one face. One name on the mailbox. One social security number.

  His left hand nudged the paper, sliding it two inches to the right.

  His right hand pulled it back.

  Arthur watched the paper shudder between the two forces. He didn't command either hand to move. He was just watching. He was the audience.

  "Who is doing this?" he asked.

  No one answered. The kitchen was silent, save for the hum of the refrigerator. The red dot on the wall remained fixed. The world was split cleanly down the middle, passing through the bridge of his nose, through the center of his brain, through the center of the page.

  Arthur lifted his hands from the table. He held them up in front of his face, palms open, framing his vision. The left hand trembled slightly. The right hand was still.

  He lowered them. He picked up the pen again. He wrote:

  *The subject is tired.*

  He put the pen down. He didn't know if it was true. He didn't know who was tired. He only knew that the story had to end somewhere, and this was the only period he could find.

  Arthur stood up. He walked to the sink. He turned on the tap with his right hand. He washed the face that was in the mirror. The face looked back, water dripping from the chin, eyes wide and fixed on a point that wasn't there.

  "Done," Arthur said.

  He turned off the water. He didn't remember reaching for the handle.
