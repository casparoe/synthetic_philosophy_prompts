answer: |-
  I hate to break it to you, but based on the clue you dropped—specifically the essay with "derangement" in the title—**Theo is actually winning this debate on textual grounds.**

  That essay is Donald Davidson's 1986 paper, ***"A Nice Derangement of Epitaphs."*** It is arguably the most important thing Davidson wrote *after* his initial formulation of Radical Interpretation, and in it, he explicitly argues against the position you are holding.

  If you walk into seminar tonight arguing that Radical Interpretation is only for strangers, Theo is going to slap that essay on the table and look very smug. However, all is not lost. While Theo has the text on his side, your intuition touches on a major criticism of Davidson's later work.

  Here is the breakdown of where you stand, why Theo is citing that essay, and the actual ammunition you can use to fight back.

  ### 1. The "Derangement" Bombshell
  In his early work (the stuff you're thinking of), Davidson uses Radical Interpretation as a **thought experiment**. He asks: *How could we possibly start to understand a totally alien speaker?* He uses this to show that belief and meaning are interdependent and that we need the Principle of Charity to get off the ground.

  But in *"A Nice Derangement of Epitaphs,"* Davidson makes a radical shift. He argues that **there is no such thing as a "language"** (in the sense of a fixed set of shared rules and conventions) that two people possess and use to communicate.

  He distinguishes between two things:
  *   **The Prior Theory:** What you *expect* the other person to mean before they speak (based on past experience, shared language, history).
  *   **The Passing Theory:** The theory you actually construct to interpret the specific utterance *as it happens*.

  Davidson's punchline in that essay is that successful communication depends entirely on the **Passing Theory**, not the Prior Theory. Even between you and Theo, after three years of roommatehood, you do not share a fixed "English." You share a history of successful *convergences* on Passing Theories. Every time Theo speaks, you are theoretically rebuilding the interpretation of his words based on context, tone, and charity.

  So, when Theo says you are doing "Radical Interpretation" every time you ask for the salt, he is channeling Late Davidson: **All interpretation is radical because meaning is always event-specific, not rule-governed.**

  ### 2. Why Your Intuition Isn't Garbage (Your Counter-Attack)
  While Theo has the text on his side, many philosophers think Davidson went too far in *"Derangement."* Your intuition that there is a difference between talking to a stranger and talking to a roommate is shared by critics like **Kathryn Pyne Parsons** and even **Noam Chomsky** (though Chomsky is a tough ally to claim).

  Here is your backup for tonight:

  **A. The Efficiency Argument**
  If Davidson is right, and we construct a new "Passing Theory" for every single utterance, communication should be exhaustingly slow. The fact that you and Theo can communicate quickly and efficiently suggests that you *are* relying on a stable, shared convention (a "Prior Theory" that actually works). If every sentence required a fresh interpretive feat, you'd never get through breakfast.
  *   *The Line:* "Theo, if Davidson is right, how do we explain the cognitive efficiency of routine communication? There has to be a stable 'code' we've internalized, otherwise we'd be re-inventing the wheel every time we say 'pass the salt.'"

  **B. The Role of Convention (David Lewis)**
  Davidson hates conventions, but **David Lewis** (in *Convention*) argues that language *is* a solution to a coordination problem. You and Theo have solved that coordination problem over three years. You have established equilibria. To say you are "radically interpreting" each other ignores the fact that you have successfully coordinated your behaviors thousands of times before.
  *   *The Line:* "You're ignoring the Lewisian point. We aren't interpreting from scratch; we're relying on established equilibria. That's not radical interpretation; that's habit."

  **C. The Definition of "Radical"**
  You can argue that Theo is stretching the definition of "Radical." In the original thought experiment, "Radical" means **no prior knowledge**. If you have prior knowledge (3 years of roommate history), it is categorically different. It might be *interpretation*, but calling it *Radical Interpretation* dilutes the term until it means nothing.
  *   *The Line:* "If 'Radical Interpretation' applies to strangers and roommates equally, the word 'Radical' loses its meaning. The epistemological stakes are totally different when I already know you're generally rational and speak English."

  ### 3. The Compromise Position
  If you want to look like the bigger person (or just end the debate before it ruins the friendship), you can concede the point but reframe it.

  Davidson's point in *"Derangement"* isn't that you *feel* like you're meeting a stranger. It's that **shared knowledge is never sufficient to guarantee meaning.** Even after three years, Theo could use a word ironically, or metaphorically, or mistakenly, and you would have to use the Principle of Charity to figure out what he *actually* meant versus what his words *literally* said.

  In that specific sense—figuring out the truth conditions of a specific utterance in real-time—Davidson is right. But you are also right that the *background conditions* are vastly different for friends than for strangers.

  ### Summary for Your Night Out
  1.  **Acknowledge the Essay:** Tell Theo, "I looked up the 'derangement' thing. You're talking about *A Nice Derangement of Epitaphs* and the Prior vs. Passing Theory distinction." (This will shock him and show you did your homework).
  2.  **Concede the Text:** Admit that Late Davidson does argue that all communication is local and event-based.
  3.  **Hold the Line on Theory:** Argue that while Davidson *says* that, it doesn't match the phenomenology of communication. We *do* rely on shared conventions, and ignoring that makes the theory descriptively inadequate.

  **Verdict:** Theo is right about what Davidson *wrote*, but you might be right about what Davidson *should have written*. Good luck tonight. Buy the beer if he cites the page number.
