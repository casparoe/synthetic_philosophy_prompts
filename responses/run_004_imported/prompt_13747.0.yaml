answer: |-
  You publish this article, Denis, and you hand them the knife. You hand d'Alembert the knife, and he sticks it into Geneva's heart, and you call it progress.

  It is not a knife, Jean-Jacques. It is a mirror. We merely suggested that a city of bankers and watchmakers might benefit from a little polish. A theatre is not a brothel. It is a school.

  A school for idleness. You sit them in the dark, you silence them, you make them passive. For two hours they do nothing but feel what they are told to feel by a man paid to pretend. And when the lights come up, they go home thinking they have been virtuous because they wept at a tragedy, while their neighbor starves in the street.

  You reduce it to arithmetic. I am talking about the soul. When a man sits in that dark and sees suffering enacted before him, his guard drops. He pities the king on stage, and in pitying the king, he practices pity for the beggar he will meet tomorrow. It is a rehearsal for virtue. We cannot lecture men into being good. We must move them.

  You move them like puppets. And who pulls the strings? Actors, Denis. Have you ever looked closely at an actor? To do what they do, they must strip themselves. They must wear every face but their own. They must feign love when they feel nothing, feign grief when they are happy. If a man spends his life mimicking passions he does not feel, what happens to the capacity to feel them at all? He becomes a hollow shell. A mercenary of the passions. You propose to make a republic of citizens into a nation of mimics.

  You speak of the actor's soul as if it were fragile glass. I say it is a muscle. The actor feels the emotion, yes, but he masters it. He channels it. And that channeling is what allows the audience to receive it clearly. If the actor weeps truly, uncontrollably, he is a mess. He is a private man grieving. We cannot see him. But when he crafts the tear, when he shapes the sorrow, we recognize it. We share it. That shared recognition is the only thing that binds a society larger than a single family.

  Binding them how? By lulling them to sleep. You think Geneva needs to be lulled? Geneva is small. It is tight. In Geneva, we do not need shadows on a wall. We need the sun. Give them festivals in the open air. Plant a stake in the ground, crown it with flowers, let the people gather round. Let them be the spectacle to one another. Let them dance, let them sing, let them compete. In that circle, there is no distinction between the observer and the observed. Everyone is active. Everyone is free. You want to build a house of stone and lock them inside it to watch strangers play at being free.

  You romanticize the stake in the ground. You think flowers solve the problem of human isolation. You, of all people, preach the value of solitude, and yet here you demand a crowd.

  Not a crowd. A community. There is a difference. A crowd watches. A community participates.

  And when the festival ends? When the flowers rot? They go home to their private miseries. The theatre remains. The play remains. It endures. It teaches lessons that outlast the season. Take Molière. You attack him constantly, but tell me, what is the lesson of the Misanthrope?

  The lesson is that honesty is a social disease. That is the lesson.

  Is it? Alceste is a fool. He is brutal. He tells a woman her sonnet is rubbish to her face. He refuses to greet a man he despises, causing a scene. He confuses rudeness with integrity. Molière laughs at him, yes. But he does not laugh at sincerity. He laughs at the inability to navigate the world without destroying it. We must live together, Jean-Jacques. To live together requires a certain grease in the gears. A certain kindness in the lie.

  So we are to be liars now? Is that the Encyclopédie's new virtue?

  I am saying that truth without charity is a weapon. Alceste wields truth as a weapon to bruise his own ego. He wants to be the only honest man in the room so he can feel superior to the room. Philinte is the hero. Philinte knows the world is flawed and embraces it anyway. He is kind.

  Philinte is a compromiser. He shakes hands with the corrupt. He smiles at the knave. Alceste is the only one who sees the rot, and you mock him for gagging on the smell. I know what it is to be Alceste, Denis. I know what it is to be told that my refusal to wear the mask makes me a monster.

  And I know what it is to clean up the mess you leave when you rip the mask off. You speak of Geneva, of festivals, of flowers. You speak of the corruption of Paris. And yet, did you not write an opera?

  That is different.

  Is it? *Le Devin du Village*. You wrote it for the King. You wrote it for the court. You had it performed at Fontainebleau. There were actors, Jean-Jacques. There were singers. There was a stage. There was an audience sitting in the dark, passive, watching a shepherd pretend to be a lover. Did you take the money?

  I took what was owed for the work.

  You took the applause. I was there. I heard them clap. You condemned the theatre in your Discourse, and then you went backstage and taught them how to sing. Do you not see the contradiction? Or is the rule only for the rest of us?

  The *Devin* was simple. It was natural. It was not the commercial machine you defend. It was not the Comédie-Française eating the souls of the public for coin.

  It was a play. You wrote a play. You are Alceste, yes, but you are also Célimène. You flirt with the public, you scold the public, you demand they love you for hating them. And when we try to offer you friendship, when we try to offer you a place in the society of letters, you spit on it. You call it corruption. You call it a conspiracy.

  I call it what it is. You and Grimm and d'Alembert. You sit in your salons and you decide what is true. You decide what Geneva needs. You decide what I need. You wrote that only the wicked man lives alone. You put that in your play. You knew I was at the Hermitage. You knew I had withdrawn. You did not write that for the audience. You wrote it for me.

  I wrote it because it is true.

  No. You wrote it because I would not bend. I would not come to Paris. I would not dine with your barons and your actresses. I would not be a pet. So you decided that if I am alone, I must be wicked. It is easier than admitting that perhaps the wickedness is in the salon, and the virtue is in the woods.

  You are not in the woods, Jean-Jacques. You are in my study. You are eating my bread. You are arguing with me about the nature of society while refusing to participate in anything but your own grievance. You say the theatre makes us passive? You are the most passive man I know. You wait for the world to come to you, and when it arrives with an offering, you strike its hand.

  I wait for the truth to come.

  Then look in the glass. The theatre shows a man his neighbors. It shows him that he suffers, and they suffer, and they are the same. That is why you hate it. Because you do not want to be the same. You want to be Alceste. You want to be unique in your suffering. You want the flowers on the stake, but only if you are the one holding the stake, alone.

  I want to be free.

  We are not free in isolation. We are free in the net. The net catches us, yes. It restricts us. It is heavy. But it holds us up. The theatre is a knot in that net. d'Alembert was right. Geneva needs a theatre. Not because they need amusement. Because they need to learn that they are not the only souls in the universe.

  And when the play is done? When the net is cast aside?

  They go home. Together. Through the same streets.

  They go home to sleep. And I will go back to the Hermitage. And you will write another line about how the wicked man lives alone, and you will think you have won the argument.

  I do not want to win an argument. I want my friend back.

  Then stop trying to civilize him.

  I cannot stop. It is what I am. It is what we are. We are the Encyclopédie. We gather the light. We do not hide it under a bushel, or a flower crown, or a hermit's hood.

  Then the light burns.

  Then it warms.

  It burns, Denis. It has already burned everything between us. You think this is about Geneva? You think this is about Molière? This is about the fact that you look at me and you see a project to be fixed, not a man to be heard.

  I hear you. I hear you saying you would rather be right than be loved.

  I would rather be true.

  And I am telling you that truth without love is just another kind of lie. It is a cold lie. It freezes the hand that offers it.

  Then let it freeze. I would rather have cold hands than false ones.

  Very well. You will have your solitude, Jean-Jacques. You will have your woods. You will have your silence. And I hope, when you are sitting there in the dark, with no actors to mock and no audience to scold, I hope you find that the silence is not as virtuous as you imagine.

  I am not afraid of the silence, Denis. I am afraid of the noise you call life.

  Then go. The door is open. It is not a stage. There is no one watching you leave.

  That is the only thing you have ever gotten right.
