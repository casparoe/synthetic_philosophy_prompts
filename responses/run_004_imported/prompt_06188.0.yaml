  *Let's refine the Remedy:* Spinoza says the sovereign cannot control minds. But the sovereign *can* control the conditions that make rational minds impossible. If the algorithm is a "cause" of passive affects, regulating the algorithm is regulating a *cause*, not the *effect* (thought). This is the crucial distinction.

