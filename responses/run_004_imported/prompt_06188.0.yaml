answer: |-
  The rain blurred the windows of the faculty lounge, turning the campus lights into smeared constellations. Elena stirred her tea, the spoon clicking against the ceramic, a rhythmic counterpoint to Mark's pacing.

  "It's a trap, Elena," Mark said, stopping to lean against a bookshelf stacked with unread journals. "You're writing a monograph on Spinoza's democracy. But Spinoza's democracy relies on the *multitude* being capable of reason. He thinks if you let men speak freely, the better argument wins because reason is common to all."

  "He thinks reason is *capable* of being common," Elena corrected softly. "Not that it is universally actualized."

  "Semantics. Look at the feed. Look at the algorithm. It doesn't optimize for truth or reason. It optimizes for engagement, which means it optimizes for indignation. It exploits what Spinoza calls the *imitation of the affects*. We see anger, we become angry. The platform is a machine designed to maximize what Spinoza calls *human bondage*. If the public square is a casino rigged to produce sadness and fear, how can you claim Spinoza would still defend the regime that relies on that square?"

  Mark crossed his arms. "Is this just the old priestly superstition with better graphics? Or is it a fatal blow to his political theory?"

  Elena set the spoon down. She didn't look at Mark; she looked at the rain, visualizing the geometry of the drops.

  "It is not a fatal blow," she said. "It is a vindication. But you are mistaking the *locus* of the threat."

  She turned to face him. "Spinoza's argument in the *Theological-Political Treatise* is not that men are naturally rational. It is that they are naturally affective. In the *Ethics*, Proposition 27 of Part 3: *If we imagine a thing like ourselves to be affected by any affect, we are thereby affected by a similar affect.* This is the mechanics of virality. The algorithm is merely an external cause that accelerates this imitation. It forces the multitude into a state of *fluctuation of the mind*."

  "Fluctuation," Mark repeated. "Which Spinoza says makes governance impossible."

  "Precisely. In the *Political Treatise*, he says a state is stable only when its laws align with the dominant affects of the people. But he distinguishes between affects that increase our power of acting—joy, courage—and those that decrease it—fear, hatred, despair. The priests of the seventeenth century exploited fear to secure obedience. They needed a superstitious populace to maintain their power. But Spinoza argues this makes the state *weaker*. A state founded on fear is always on the brink of civil war because fear is unstable."

  "So the algorithm is the new priesthood," Mark said. "But here's the difference. The priests were part of the sovereign structure. They crowned kings. These platforms are private. They are outside the *imperium*."

  Elena shook her head. "That is where you miss Spinoza's definition of *right*. In the *Political Treatise*, Chapter 2, he writes that the right of the sovereign is coextensive with its power. But conversely, the sovereign has a duty to preserve its own power. What constitutes the power of the state? It is not the army. It is the unity of the multitude. *'A multitude which is not guided by reason is a multitude in the state of nature.'*"

  She stood up, walking to the whiteboard where she had been diagramming the *conatus*.

  "If a private entity creates a causal chain that systematically induces sadness and fear in the citizens, it is diminishing the power of the state. Spinoza would not view this as a 'new problem' for democracy. He would view it as a clear case of *seditious action* disguised as speech. You must distinguish between the *expression of judgment* and the *manipulation of causes*."

  Mark frowned. "Manipulation of causes?"

  "Spinoza forbids the sovereign from controlling *thought*. He says that is tyrannical and impossible. But the algorithm does not control thought directly. It controls the *environment* in which thought arises. It alters the *causes* of the affects. If I poison the water supply, I am not forcing you to drink, but I am the cause of your sickness. Spinoza's sovereign has the right to remove causes that threaten the peace."

  "So you're arguing for regulation," Mark said, skeptical. "But Spinoza was a libertarian. He hated censorship."

  "He hated censorship of *opinions*," Elena corrected. "He argued that trying to force men to speak against their nature leads to resentment and instability. But an engagement-maximizing algorithm is not an opinion. It is a mechanism of affective transmission. It is a structural incitement to *odium*."

  She erased a section of the board.

  "Here is the Spinozistic remedy. It is not to ban the 'false' posts. That assumes the sovereign knows the truth, which Spinoza denies. The remedy is to regulate the *architecture of imitation*. The sovereign must ensure that the channels of communication do not structurally favor the affects of sadness over the affects of joy. If the algorithm rewards outrage because outrage spreads faster, the state must intervene—not to dictate content, but to dampen the *velocity* of the passive affects."

  "That sounds like engineering," Mark said.

  "It is politics," Elena replied. "Spinoza defines the end of the state as *freedom*. But freedom, for Spinoza, is not the license to do whatever one wants. It is the capacity to live under the guidance of reason. A system that makes reason physically impossible by keeping the mind in perpetual fluctuation is an enemy of the state. The sovereign must act as a rational architect of the affective environment."

  She picked up her bag.

  "Spinoza would say the platform is acting like a 'state within a state.' It claims a right to the attention of the multitude without bearing the responsibility for their stability. In the *Political Treatise*, he warns that if any faction acquires enough power to challenge the sovereign's ability to keep the peace, it must be curbed. Not because it is 'wrong,' but because it is *dangerous*."

  Mark was silent for a moment, looking at the smeared lights in the window. "So he wouldn't see democracy as failed. He'd see the *conditions* for democracy as hijacked."

  "Democracy is the regime most consonant with human nature because it minimizes the gap between the ruler and the ruled," Elena said. "But it requires that the 'ruled' are capable of forming a common mind. If the medium of their association is designed to fragment them into isolated pockets of indignation, they cannot form a multitude. They remain a mob. Spinoza's remedy is to restore the possibility of the multitude. The sovereign must break the mechanism that turns citizens into a superstition engine."

  "And if the sovereign refuses?" Mark asked. "If the sovereign profits from the fear?"

  Elena paused at the door. "Then the sovereign has lost its right. Because its power is gone. It rules over a graveyard of passions. And nature will eventually sweep it away."

  She opened the door. The sound of the rain came in, louder now.

  "Spinoza doesn't promise salvation, Mark. He promises causality. If you sow fear, you reap instability. The algorithm is just the sower."
