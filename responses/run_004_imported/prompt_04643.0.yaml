answer: |-
  Welcome to the fray. It is entirely understandable that this sits poorly with you. In fact, your intuition aligns with a significant camp of contemporary metaphysicians and philosophers of science (like Nancy Cartwright, Tim Maudlin, and John Carroll) who argue exactly what you are suggesting: that if you strip away necessary connection, you strip away the very thing that makes a law a *law*.

  However, to see why contemporary "Humeans" (specifically followers of David Lewis) don't think they are contradicting themselves, we have to untangle three specific concepts that often get conflated: **Governance**, **Objectivity**, and **Reality**.

  Here is the breakdown of why they think they aren't "having it both ways," and where your skepticism is actually hitting on a genuine vulnerability in their position.

  ### 1. The Shift from "Governing" to "Summarizing"
  Your background in physics likely gives you a "Governing Conception" of laws. When you write down the Einstein Field Equations or the Schrödinger equation, there is a strong intuition that these equations *constrain* reality. They tell matter how to move; they rule out certain worlds as impossible.

  The Humean denies this completely. They agree with you that there is no "must." But they disagree with the conclusion that laws are therefore fictions.

  For a Humean (specifically a proponent of the **Best System Analysis** or BSA), the fundamental layer of reality is what David Lewis called the **Humean Mosaic**. This is just the total history of the universe: a distribution of local qualities at every space-time point. Particle A was *here* at $t_1$, then *there* at $t_2$. That's it. No powers, no forces, no "pushing."

  In this view, **Laws are not the rulers of the mosaic; they are the summary of the mosaic.**

  Think of it like data compression. The Humean Mosaic is the raw data (the terabytes of particle positions). The Laws of Nature are the compression algorithm (the zip file). The zip file is "real" in the sense that it objectively describes the data better than any other compression scheme. But the zip file doesn't *make* the data be the way it is.

  So, when they say laws are "objective," they don't mean "governing." They mean "the best description is a matter of fact, not opinion."

  ### 2. Why Not Just Call Them Fictions? (Realism vs. Instrumentalism)
  You asked: *Shouldn't a consistent Humean just admit "laws of nature" are a useful fiction?*

  This is the **Instrumentalist** position, and many philosophers (and perhaps many working physicists) actually hold it. But Humeans want to be **Realists** about laws for a specific technical reason: **Truth.**

  If laws are fictions, then the statement "The law of gravity is $F = G \frac{m_1 m_2}{r^2}$" is strictly false (because there are no governing laws).
  The Humean wants to say that statement is *true*, but they analyze what it *means* differently.

  To a Humean, the sentence "It is a law that X" translates to: *"X is an axiom in the deductive system that best balances simplicity and strength in summarizing the total history of the universe."*

  Since the total history of the universe is a fixed, mind-independent fact, and the mathematical criteria for "best system" (simplicity/strength) are (arguably) objective, the resulting law is objective. They aren't smuggling necessity back in; they are redefining "law" to mean "optimal summary."

  ### 3. Where Your Instinct is Right (The "Explanation" Problem)
  You feel they are having it both ways because, in practice, Humeans often talk *as if* laws explain events.

  If I ask, "Why did the billiard ball move?"
  *   **Anti-Humean:** "Because it was struck, and laws of motion *govern* the interaction." (Causal power)
  *   **Humean:** "Because it was struck, and in the best system summarizing the universe, strikes are followed by motion."

  Do you see the problem? The Humean account makes laws **dependent on the events**, not the other way around. The law is what it is *because* the balls moved that way. But in physics, we use the laws to explain *why* the balls moved that way.

  This is the **Direction of Explanation** objection. Many critics argue that Humeanism gets the metaphysical order backward. It makes the laws supervene on the particular facts. But in scientific practice, the particular facts obtain *because* of the laws.

  If you feel this is "having it both ways," you are in good company. It is the primary objection raised by **Non-Humeans**. They argue that you cannot have objective laws without some form of modal force (necessity, powers, or dispositions) to ground them. Otherwise, as you suspect, the "law" is just a pattern we noticed, not a feature of the world that *constrains* it.

  ### 4. The Physicist's Perspective
  As a physicist, you know that we often treat our laws as effective field theories—approximations that work within certain regimes. Nancy Cartwright, a philosopher of science who writes extensively for physicists, argues in *How the Laws of Physics Lie* that fundamental laws are indeed "fictions" (or rather, idealizations) that only apply in highly controlled "nomological machines."

  The Humean tries to save the objectivity of laws even if they are just patterns. The Instrumentalist (closer to your suggestion) says, "Stop pretending the pattern is a thing."

  ### Summary
  The contemporary Humean claims they aren't contradicting Hume because:
  1.  They deny **Necessary Connection** (agreeing with Hume).
  2.  They deny **Governance** (laws don't push matter).
  3.  They assert **Supervenience** (laws depend entirely on the pattern of events).
  4.  They assert **Objectivity** (the pattern is mind-independent, even if it doesn't govern).

  **Your skepticism is valid because:**
  The word "Law" in "Law of Nature" carries a normative weight (prescriptive) that Humeans strip away, yet they keep the noun "Law." They are essentially saying, "There are no commands, only descriptions, but we will call the descriptions 'Commands' because they are the best ones."

  If you believe that a "Law of Nature" must, by definition, have some modal force (some "must-ness"), then yes, Humeanism is inconsistent. But if you accept their deflationary definition (Law = Best Summary), they are logically consistent, even if the resulting picture of the universe feels empty to a physicist used to equations that dictate reality.

  You aren't missing a nuance; you are spotting the cost of the view. The cost is that on Humeanism, the regularity of the universe is a brute fact with no explanation. It just *is*. And for a physicist looking for a "why," that is often unsatisfying.
