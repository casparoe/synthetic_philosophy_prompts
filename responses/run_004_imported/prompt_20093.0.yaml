answer: |-
  This is a classic puzzle, and your frustration is well-founded. The Argument from Illusion is seductive precisely because it disguises a metaphysical inference as an empirical observation. Your friend is treating the existence of sense-data as a discovery akin to finding a microbe under a microscope, when it is actually a philosophical commitment about how to analyze the *logic* of perception.

  To answer your specific question: **The disjunctivist grants that the oar looks bent, but they deny that "looking bent" entails "being directly aware of a bent thing."**

  Here is exactly what the disjunctivist (like M.G.F. Martin or John McDowell) is entitled to deny, and why it isn't churlish.

  ### 1. The Target: The "Common Kind Assumption"
  The core of your friend's argument rests on what is called the **Common Kind Assumption (CKA)**.
  *   **The Assumption:** The fundamental metaphysical nature of the mental state in the illusory case (the oar looks bent) is the *same kind* of state as in the veridical case (the oar looks straight).
  *   **The Inference:** Since the illusory case *must* involve a non-physical object (because the physical oar isn't bent), the veridical case *must also* involve a non-physical object (even though the physical oar is straight).

  **The Disjunctivist Denial:** Disjunctivists reject the CKA. They argue that just because two experiences are **subjectively indistinguishable** (they feel the same from the inside), it does not follow that they share the **same fundamental metaphysical structure**.

  For the disjunctivist, the structure of perception is:
  *   **Case A (Veridical):** I see the oar. The nature of my experience is constituted by the oar itself.
  *   **Case B (Illusion):** It merely *seems* to me as if I see a bent oar. The nature of this experience is *not* constituted by a bent object (mental or otherwise); it is a defective state that lacks the object-involving nature of Case A.

  They are fundamentally different kinds of states, even if you can't tell them apart while you are in them.

  ### 2. Re-analyzing "Looks"
  Your friend argues: *"Whatever I am directly aware of in that moment must be some other, actually-bent thing."*

  This relies on a specific grammatical analysis of "looks." Your friend treats "looks" as a relation between a subject and an object (a sense-datum).
  *   **Friend's View:** "X looks bent" = "I am acquainted with an entity X, and X has the property of bentness."

  The disjunctivist offers a different analysis (often called an adverbial or propositional analysis).
  *   **Disjunctivist View:** "The oar looks bent" = "It visually seems to me as if the oar is bent."

  Notice the difference? In the disjunctivist view, "looks" describes **how the world appears to the subject**, not **what object the subject is grasping**.
  *   Is it churlish to say the oar looks bent? **No.**
  *   Is it churlish to say there is a "bent thing" in your mind? **Yes.**

  You can grant the phenomenology (the oar looks bent) without accepting the ontology (there exists a bent object of awareness). To use a classic analogy: When Macbeth sees a dagger, we agree "there looks to be a dagger." We do not agree that there is a "mental dagger" he is staring at. We say he is hallucinating. The disjunctivist treats the bent oar similarly: it is a case where the perceptual relation to the world fails, but that failure doesn't conjure a new ghostly object into existence.

  ### 3. Direct Awareness
  Your friend claims: *"Whatever I am directly aware of... must be some other... thing."*

  The disjunctivist denies that in the illusion case, you are **directly aware of anything** in the relevant sense.
  *   In the **veridical case**, your awareness is relational: You + The Oar.
  *   In the **illusory case**, the relation fails. You are not aware of the oar (as it is), and you are not aware of a sense-datum. You are simply in a state that is **indistinguishable from** a state of awareness.

  Martin, specifically, argues that a hallucination or illusion has no positive nature of its own other than being indistinguishable from a veridical perception. It is a "privative" state. It is defined by what it *lacks* (the actual object), not by what it *contains* (a sense-datum).

  ### 4. Empirical vs. Philosophical
  Your friend claimed this settles the question **empirically**. This is the easiest point for the disjunctivist to dismantle.

  *   **Empirical Fact:** Light refracts through water. Retinal images are distorted. Neural processing creates a visual experience of bentness.
  *   **Philosophical Inference:** Therefore, the immediate object of awareness is a non-physical sense-datum.

  The disjunctivist agrees with the empirical facts of optics and neuroscience. They deny the philosophical inference that the *object of awareness* must match the *properties of the experience*. Just because your brain creates a "bent" experience doesn't mean there is a "bent thing" you are looking at; it means your visual system is misrepresenting the straight oar.

  ### Summary: What is left to reject?
  To reconstruct the disjunctivist position for your friend, you can say:

  1.  **I grant** the oar looks bent. (Phenomenology)
  2.  **I grant** the oar is not bent. (Physical Reality)
  3.  **I deny** that the best explanation for (1) and (2) is that I am seeing a mental object. (Metaphysics)
  4.  **I deny** that the mental state in the illusion is the same *kind* of state as in veridical perception, simply because they feel the same. (Common Kind Assumption)

  The disjunctivist insists that in the good case, you are directly aware of the world. In the bad case, you are not directly aware of a *different* world (a world of sense-data); you are simply in a state that fails to be an awareness of the world, despite feeling like one.

  The argument from illusion only works if you assume that *indistinguishability implies identity of nature*. Once you drop that assumption, the "bent thing" vanishes, leaving only the straight oar and a misleading appearance.
