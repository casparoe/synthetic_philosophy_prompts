          2.  The oar is not actually bent.
          3.  Therefore, what I am *directly aware of* must be something else (a sense-datum/appearance) that *is* bent.
          4.  Veridical (normal) perception feels the same from the inside as illusory perception.
          5.  Therefore, in veridical cases too, I am directly aware of an appearance/sense-datum, not the object itself.
      *   **The User's Knowledge:** They know Disjunctivists (McDowell, Martin) have a response.
      *   **The User's Problem:** They can't reconstruct *what* the disjunctivist denies. It seems "churlish" to deny the oar *looks* bent. If you grant it looks bent, what's left to fight about?
      *   **Goal:** Explain the Disjunctivist response clearly, specifically identifying the premise they reject and why denying it isn't churlish or empirically false.

  2.  **Deconstruct the Argument from Illusion:**
      *   Premise 1: In illusion (oar), the object (oar) does not have the property it appears to have (bentness).
      *   Premise 2: In illusion, the subject is directly aware of *something* that has the property (bentness).
      *   Conclusion 1 (Intermediate): In illusion, the object of direct awareness is not the physical object (it's a sense-datum).
      *   Premise 3 (Common Kind Assumption): Veridical and illusory experiences are fundamentally the same kind of mental state (from the inside).
      *   Conclusion 2 (Final): In veridical perception, the object of direct awareness is also not the physical object (it's a sense-datum).

  3.  **Identify the Disjunctivist Move:**
      *   Disjunctivism attacks Premise 3 (The Common Kind Assumption).
      *   *But wait,* the user asks: "Once that much [that it looks bent] is granted, what is actually left... to reject?"
      *   The crucial nuance is in the analysis of "looks bent" and "direct awareness."
      *   Disjunctivists *do* agree the oar looks bent. They *do* agree the oar isn't bent.
      *   They *deny* that the best explanation for "looking bent" is the existence of a bent mental object (sense-datum).
      *   They *deny* that the veridical and illusory cases share the same fundamental metaphysical nature, even if they are subjectively indistinguishable.

  4.  **Drafting the Explanation - Step-by-Step:**

      *   **Acknowledge the Friend's Intuition:** The friend's argument is the classic Ayer/Price sense-datum argument. It feels compelling because it appeals to introspection.
      *   **Pinpoint the Disagreement:** The disjunctivist doesn't deny the *phenomenology* (it looks bent). They deny the *metaphysical inference* drawn from it.
      *   **Key Concept 1: The Common Kind Assumption (CKA).** This is the heart of the matter. The friend assumes that because Case A (illusion) and Case B (veridical) are indistinguishable to the subject, they must be the same *kind* of state. Disjunctivists say: No. Indistinguishability $\neq$ Same Nature.
      *   **Key Concept 2: Analyzing "Looks."** How do we parse "The oar looks bent"?
          *   *Sense-Datum Theory:* There is an object $X$ (sense-datum) which is bent, and I see $X$.
          *   *Disjunctivist Theory:* "Looks bent" is not a report on an object I see. It's a report on how the world appears. In the illusion case, it *seems* to me as if the oar is bent. In the veridical case, I *see* that the oar is straight.
      *   **Key Concept 3: Direct Awareness.** The friend argues: "I am directly aware of *something* bent." The disjunctivist says: "In the illusion, you are not directly aware of an object at all. You are in a state that is *indistinguishable* from one where you are aware of a bent object, but in reality, you are aware of nothing (or rather, the relation fails)."
      *   **Refining the "Empirical" Claim:** The friend claims this is settled *empirically*. Disjunctivists argue this is a *philosophical* mistake about the logic of perception, not an empirical discovery. Empirically, light refracts. Philosophically, we shouldn't posit ghostly objects to explain the error.

  5.  **Addressing the "Churlish" Concern:**
      *   The user thinks denying the argument requires denying the oar looks bent.
      *   Correction: You can grant "it looks bent" without granting "there is a bent thing I am seeing."
      *   Analogy: "It looks like there is a dagger before me" (Macbeth). Does that mean there is a mental dagger? No, it means Macbeth is hallucinating. The "looks" describes the experience, not the object of the experience.

