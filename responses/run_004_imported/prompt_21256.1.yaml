answer: |-
  You are absolutely not overthinking this. In fact, you have stumbled onto one of the deepest philosophical and practical tensions in the entire legal system. Law students spend semesters debating exactly what you noticed in a single afternoon.

  Your brother is right in a practical sense (this is how the system functions), but you are right in a logical sense (the distinction is fuzzier than it appears).

  Here is the actual difference between the two scenarios, why the law treats them differently, and why your intuition that "both rely on trust" is partially correct.

  ### 1. The Core Difference: Cross-Examination
  The legal system isn't actually designed to find "absolute truth." It is designed to find **testable truth.**

  The main reason hearsay (the neighbor's story) is excluded is not because the law assumes the neighbor is lying. It is excluded because **you cannot cross-examine the neighbor.**

  When a witness is on the stand, the opposing lawyer gets to attack their testimony on four specific fronts (often called the "Four Testimonial Capacities"):
  1.  **Perception:** "Was it dark out? Were you wearing your glasses? Were you drunk?"
  2.  **Memory:** "This happened six months ago; aren't you confusing this with another night?"
  3.  **Narration:** "Did you mean you saw him *running* or just *walking fast*?"
  4.  **Sincerity:** "Do you hate the defendant? Did someone pay you to say this?"

  When the witness on the stand says, *"My neighbor told me she saw him run,"* the lawyer can cross-examine the **witness**, but they can't cross-examine the **neighbor**. They can't ask the neighbor if it was dark, if she hates the defendant, or if she was mistaken. Because that chain of testing is broken, the evidence is considered too risky to let the jury hear.

  ### 2. The "Telephone Game" Factor
  You mentioned that both situations come down to trusting somebody's word. That is true, but the *number* of words you have to trust is different.

  *   **Direct Testimony:** You are trusting one person's memory and honesty.
  *   **Hearsay:** You are trusting two people's memory and honesty.

  In the hearsay example, the witness has to remember the conversation correctly, *and* the neighbor had to see the event correctly. The law views every layer of repetition as a new opportunity for error to creep in (like the game of "Telephone"). By cutting out the middleman, the system tries to minimize the points of failure.

  ### 3. Correction: Direct Testimony is Not "Rock Solid"
  This is the biggest misconception you have, and it's a common one. Direct testimony is **not** considered rock-solid proof. It is simply **admissible evidence.**

  As a juror, you are allowed to look at a witness swearing on a Bible, looking you in the eye, and decide they are full of it. You can decide their memory is bad or they are lying. The judge allows the testimony in, but **you** decide how much weight to give it.

  With hearsay, the judge makes the decision for you. They are saying, "This evidence is so inherently unreliable that I won't even let you weigh it."

  ### 4. The Oath and Demeanor Do Matter
  You asked why we trust the person on the stand just because they are sworn in. It's not just the oath; it's the **consequences.**

  *   **Perjury:** If a witness on the stand lies, they can be charged with a crime. If a neighbor tells a friend something false at a barbecue, there is no legal penalty.
  *   **Demeanor:** Jurors are instructed to watch body language. Are they hesitant? Are they angry? Are they avoiding eye contact? You cannot assess the "vibe" or demeanor of a neighbor who isn't in the room.

  ### 5. Why It Still Feels Like a Technicality (Because Sometimes It Is)
  You are right to feel frustrated because the line can seem arbitrary.
  *   If the neighbor runs into the courtroom and yells, "I saw him run!" that is admissible (as an "excited utterance").
  *   If the neighbor tells the witness 5 minutes later, "I saw him run," it is hearsay and inadmissible.

  The logic is that in the first scenario, the shock of the event guarantees truthfulness. In the second, there was time to fabricate. Does that distinction always hold up? No. But the legal system loves bright-line rules because they are easier for judges to enforce than "use your best judgment."

  ### Summary
  Your brother is right that this is "just how trials have to work." The adversarial system relies on testing evidence through combat (cross-examination).

  But you are right that it is imperfect. Direct testimony *is* just someone's word. The difference is that direct testimony is **tested** word, while hearsay is **untested** word. The system prefers a testable lie over an untestable truth, because it believes the process of testing is the only way to get close to justice.

  So, don't let it bug you too much. You identified a flaw that legal scholars acknowledge, but you also identified the safeguard (cross-examination) that keeps the system from collapsing into "he-said-she-said" chaos.
