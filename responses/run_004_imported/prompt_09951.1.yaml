  **Running an ultramarathon** (Genuine): The physiological stress is condition-dependent, meaning an unfit body literally breaks down under the training load while a high-quality body recovers, making it impossible to fake without the underlying genetic fitness.

  **Becoming a monk and giving away all your possessions** (Genuine): This imposes a maximal fitness cost (celibacy and no material security) that only individuals with genuine, high-commitment belief systems can afford to sustain without defecting.

  **Taking an unpaid internship at some fancy company** (Genuine): The cost of foregone wages is disproportionately burdensome to those without a wealthy safety net, honestly signaling class background and resource stability rather than just ambition.

  **Getting a face tattoo** (Mixed): While it burns social bridges (a cost), it signals non-conformity which is an ambiguous trait, and the irreversible nature differs from the continuous survival burden of a biological handicap.

  **Fraternity hazing rituals** (Mixed): Pain tolerance varies independently of group loyalty, so the ritual may screen for obedience or masochism rather than honestly signaling the "quality" of commitment to the group.

  **Posting shirtless gym-progress pics online** (Mixed): The physique itself is a handicap signal, but the digital display allows for manipulation (lighting, angles) and the cost is front-loaded rather than a continuous test of current condition.

  **Buying a huge diamond engagement ring** (Not Really): Financial costs can be decoupled from actual long-term wealth via debt, allowing low-resource individuals to temporarily mimic the signal without suffering the proportional survival cost.

  **Throwing a big extravagant wedding** (Not Really): Like the ring, this is a one-time financial burn that can be credit-financed, lacking the ongoing physiological or economic burden that prevents "low quality" individuals from faking the signal long-term.
