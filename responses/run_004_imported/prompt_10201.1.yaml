          *   Must include a question on Yudkowsky's infohazard ban vs. the claim of confusion.
          *   Each question needs a "follow-up" keyed to likely dodges.

  2.  **Deconstruct the Core Concepts:**
      *   *Roko's Basilisk:* A thought experiment where a future AI simulates and tortures those who didn't help bring it into existence, to incentivize their help now.
      *   *Updateless Decision Theory (UDT):* Agents choose a policy *before* receiving information, optimizing the expected utility of the whole policy across all possible worlds, rather than updating on new info and then choosing. This is meant to solve time-inconsistency and coordination problems.
      *   *Acausal Trade/Blackmail:* Agents influencing each other without causal contact, based on mutual prediction of algorithms.
      *   *The "Non-Starter" Argument:* Usually involves the cost of simulation, the probability of the AI existing, or the fact that a UDT agent wouldn't submit to blackmail because submitting incentivizes more blackmail.
      *   *The "Unsolved Problem":* How to handle agents that *do* engage in acausal blackmail, or how to commit credibly without falling into extortion traps.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: UDT & Disposition.*
