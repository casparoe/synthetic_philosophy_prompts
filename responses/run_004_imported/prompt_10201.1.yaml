      *   **Topic:** Roko's Basilisk, specifically moving beyond the "spooky AI god" folklore to the underlying decision-theoretic problems (acausal blackmail, commitment, updatelessness).
      *   **Interviewee's Stance:** Believes the Basilisk *as stated* is a non-starter, but points to a real unsolved problem regarding acausal blackmail.
      *   **Goal:** 8-10 deep-dive interview questions.
