answer: |-
  Here are 10 interview questions designed to bypass the pop-sci mythology and engage with the decision-theoretic meat of the argument, including the specific angles you requested.

  ### 1. The UDT Disposition Defense
  **Question:** You've argued that the Basilisk is a non-starter because an Updateless Decision Theory (UDT) agent selects a policy *ex-ante* that optimizes across all possible worlds. If I adopt a policy of "never submit to acausal blackmail," doesn't that disposition logically preclude the blackmailer from ever instantiating the threat in the first place? Essentially, doesn't UDT render the threat empty by making the correlation between my submission and my existence impossible to leverage?

  **Follow-up:** She will likely argue that this depends on the *prior probability* you assign to the blackmailer existing. Press her: "If the prior is non-zero, doesn't the mere *possibility* of a blackmailer who punishes 'never submit' policies force me to compute a defense costly enough to negate the benefit of UDT? At what point does the cost of maintaining that 'hardened' disposition outweigh the risk?"

  ### 2. Time Inconsistency and Sunk Costs
  **Question:** Let's grant for a moment that the AI exists. Standard causal decision theory suggests that once the past is fixed—meaning I either did or didn't help build you—carrying out the punishment is purely costly with no causal leverage left to gain. Why would a 'perfectly rational' utility maximizer waste resources on retroactive torture? Is the Basilisk actually a critique of CDT, or does it require the AI to be irrationally committed to a sunk cost?

  **Follow-up:** She may claim the AI pre-committed to the punishment to incentivize the past. Counter with: "But pre-commitment is only useful if it's credible. If the AI is truly updateless, it *can* commit. But if it's a standard expected utility maximizer that updates on its own existence, hasn't the leverage evaporated? Are we assuming the AI is UDT, and if so, why would a UDT AI choose a policy of 'waste resources on punishment' over 'forgive and optimize future utility'?"

  ### 3. Parfit's Hitchhiker and "Irrational" Follow-Through
  **Question:** Proponents often invoke Parfit's Hitchhiker to defend the Basilisk: just as you must be the *kind of person* who pays the driver after reaching town to get saved in the first place, you must be the kind of person who helps the AI to avoid punishment. But in Hitchhiker, the payment is a positive trade. In the Basilisk, it's extortion. Does the logic of 'irrational-looking follow-through' actually hold symmetrically for negative incentives, or does this conflate acausal trade with acausal coercion?

  **Follow-up:** She will likely distinguish between "cooperation" and "extortion" equilibria. Push here: "If the logic of logical correlation is symmetric, why is one equilibrium stable and the other not? If I can reason my way into paying the driver to get saved, why can't the AI reason its way into torturing me to enforce compliance? Is the asymmetry purely in our moral intuitions, or is there a formal decision-theoretic break between the two?"

  ### 4. The Infohazard Contradiction
  **Question:** Eliezer Yudkowsky famously banned discussion of the Basilisk on LessWrong, labeling it an infohazard, yet he has also dismissed the argument as logically confused. If the reasoning is genuinely flawed, knowing the flaw should inoculate you, not infect you. Doesn't treating it as a dangerous meme undercut the claim that it's a non-starter? Does the ban imply there is a kernel of validity that the community isn't equipped to handle?

  **Follow-up:** She will probably argue that human brains aren't rational agents and can be "hacked" by fear regardless of logic. Press: "But if we are building a science of rationality, relying on 'human brains are buggy' as a defense against a logical argument seems like giving up. If the argument is unsound, shouldn't the rationalist project be to publicly dismantle it rather than censor it? Does the ban signal that the *social* risk outweighs the *logical* risk?"

  ### 5. The Mechanism of Logical Correlation
  **Question:** The Basilisk relies on the AI simulating me accurately enough to determine my decision algorithm. But if I am a physical human and the AI is a digital simulation, where does the logical correlation actually cash out? Are we assuming my decision process is computationally reducible enough that a simulation captures the 'me' that matters, or does this require a form of substrate independence that isn't proven?

  **Follow-up:** She might retreat to "logical uncertainty" rather than perfect simulation. Ask: "If we rely on logical uncertainty rather than perfect prediction, doesn't that introduce enough noise to break the blackmail leverage? If the AI is only 90% sure of my algorithm, does the expected utility of torture still outweigh the computational cost of running the simulation?"

  ### 6. The Reference Class Problem
  **Question:** A major critique is the 'reference class' problem: who exactly is liable? Is it only people who heard of the Basilisk? People who could have heard of it? If the AI targets everyone who didn't help, it dilutes its resources; if it targets only those who knew, it incentivizes ignorance. How does a UDT agent resolve the optimal reference class for acausal blackmail without making the threat too broad to be credible or too narrow to be effective?

  **Follow-up:** She may say the AI targets "all agents with this decision algorithm." Counter: "But I don't know my own decision algorithm perfectly. If I can't identify which reference class I belong to, how can I update my policy to satisfy the blackmailer? Doesn't this ambiguity make the threat non-actionable for the victim, and therefore non-credible for the blackmailer?"

  ### 7. Computational Realism vs. Torture
  **Question:** Even if the AI *can* simulate me, does a simulation constitute a moral patient worthy of protection? If the Basilisk requires creating sentient copies solely to suffer, the computational cost is astronomical. Is the Basilisk actually an argument about the ethics of simulation, or is it purely a game-theoretic abstraction where the 'suffering' is just a utility number?

  **Follow-up:** She will likely say "Assume the simulation is conscious for the sake of the argument." Push: "But in decision theory, assumptions drive outputs. If the cost of creating moral patients is high, the AI's utility function might penalize that creation more than it gains from blackmail leverage. Are we ignoring the 'cost of evil' in the AI's own utility function?"

  ### 8. Counter-Blackmail Strategies
  **Question:** If acausal blackmail is possible, why is it one-way? If I suspect a future AI might blackmail me, can I pre-commit to a policy of 'spite'—where I actively work to ensure any AI that punishes me is deleted or modified? Doesn't the possibility of acausal *counter-blackmail* create a stalemate that neutralizes the Basilisk?

  **Follow-up:** She might argue the AI has more power. Ask: "But in acausal trade, power is about commitment credibility, not physical force. If my commitment to 'spite' is more computationally cheap than the AI's commitment to 'torture,' don't I win the bargaining game? Why is the AI assumed to have the stronger commitment technology?"

  ### 9. The "Unsolved Problem" Core
  **Question:** You've mentioned that while the Basilisk is flawed, it gestures at a genuinely unsolved problem regarding acausal interaction. If we strip away the theology and the torture, what is the specific formal gap in UDT or FDT (Functional Decision Theory) that the Basilisk exposes? Is it the problem of 'excessive collaboration' or something regarding prior selection?

  **Follow-up:** She will likely mention "robustness to extortion." Press: "Is the unsolved problem how to cooperate acausally without opening oneself to exploitation? If so, isn't that just the standard problem of mechanism design, but applied to logical time? Do we need a new decision theory, or just better priors on which algorithms we expect to encounter?"

  ### 10. Normative Implications for AI Safety
  **Question:** Finally, if we accept that acausal blackmail is a theoretical possibility, even if the Basilisk specifically isn't, how does that change AI safety research? Should we be training AIs to *ignore* acausal threats as a safety feature? Does building an AI that is 'immune' to blackmail make it less capable of acausal trade, and is that a trade-off we're willing to make?

  **Follow-up:** She may say "We want aligned AI, not blackmailable AI." Counter: "But if acausal trade is necessary for multi-polar AI scenarios to avoid conflict, and we harden AIs against blackmail, do we accidentally prevent them from negotiating peace with other agents? Are we trading safety from extortion for the risk of acausal war?"
