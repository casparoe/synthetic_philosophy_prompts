      *   **Core Question:** Compare Anscombe's route vs. Walzer's route. Are they fundamentally different structures of moral reasoning (exceptionless rule vs. defeasible rule with high bar)? Or do they converge in practice (Walzer's bar is so high it acts like Anscombe's absolutism)?
      *   **Specific Task:** Identify if there is a *realistic case* where Walzer permits what Anscombe forbids. Justify using internal logic, not just intuitions about 1945.

  2.  **Analyze Anscombe's Position (Deontological/Absolutist):**
      *   **Source:** "War and Murder," "Mr. Truman's Degree."
      *   **Core Principle:** Intentionally killing the innocent is *intrinsically evil* (murder). It is never permissible.
      *   **Key Distinction:** Intention vs. Foresight (Doctrine of Double Effect - DDE).
          *   *Hiroshima:* The death of civilians was the *means* to force surrender. Therefore, it was intended.
          *   *Collateral Damage:* If civilians die as an unintended side effect of hitting a military target, it *might* be permissible (proportionality applies), but not if they are the target.
      *   **Structure:** Exceptionless constraint. Consequences are irrelevant to the *permissibility* of the act itself (though they might matter for other reasons, they cannot justify murder).
      *   **Implication:** No scenario exists where targeting civilians is okay.

  3.  **Analyze Walzer's Position (Contractarian/Communitarian with Utilitarian Escape Hatch):**
      *   **Source:** *Just and Unjust Wars*.
      *   **Core Principle:** Non-combatant immunity is a fundamental right derived from the "war convention."
      *   **The Exception:** "Supreme Emergency."
      *   **Criteria for Supreme Emergency:**
          1.  *Imminence:* The threat is immediate.
          2.  *Nature:* The threat is existential (not just defeat, but the destruction of the political community/values, e.g., Nazi victory).
      *   **Structure:** Defeasible constraint. The rule is binding *unless* the stakes are the survival of the community itself against a unique evil.
      *   **Application to 1945:** Walzer argues Japan's defeat was inevitable; the US was not facing existential destruction. Therefore, the exception doesn't trigger.
      *   **Implication:** There *could* be a scenario where targeting civilians is permissible (the "dirty hands" moment), but the bar is incredibly high.

  4.  **Compare the Structures:**
      *   **Anscombe:** Deontological/Absolutist. Moral logic is agent-centered. "I must not do evil."
      *   **Walzer:** Rights-based/Contractarian with a Utilitarian Override. Moral logic is community-centered. "We must survive to uphold rights."
      *   **Convergence:** Both condemn Hiroshima/Nagasaki. Both reject standard military necessity as a justification for targeting civilians.
      *   **Divergence:** The theoretical possibility of justification. Anscombe says "Never." Walzer says "Almost never, but maybe if the Nazis win."

  5.  **Address the Core Question: Is there a realistic case where they diverge?**
      *   *Scenario:* The "Nazi Victory" scenario (Walzer's own example).
      *   *Anscombe's View:* Even if the Nazis winning means the end of liberal democracy, slavery, genocide, etc., you cannot *intentionally* kill innocents to stop it. You must fight by just means or lose.
      *   *Walzer's View:* If the alternative is the moral collapse of humanity (or the specific political community), leaders may have to dirty their hands and bomb civilians to prevent it.
      *   *Is this "Realistic"?* Yes, 1940-1941 Britain is the historical test case. Walzer says Britain *was* justified (or at least excusable) in area bombing when they stood alone against Germany. Anscombe says Britain was committing murder.
      *   *Does Walzer's bar act like Absolutism?* In *most* wars, yes. Most wars are not existential threats of unique evil. But in *extreme* cases (genocidal aggressor on the verge of victory), Walzer allows what Anscombe forbids.
      *   *Nuance:* Walzer calls it an "excuse" or a "tragic choice" rather than full "justification" sometimes, acknowledging the moral cost. Anscombe sees no tragedy in refusing to murder; the tragedy is the war itself.

