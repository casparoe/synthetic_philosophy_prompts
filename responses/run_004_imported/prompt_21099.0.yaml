      *   *Key Argument:* Rationality requires consistency. If a group votes on conclusions directly, they risk inconsistency (Discursive Dilemma/Doctrinal Paradox). To be rational, they must vote on premises.
      *   *Consequence:* The group belief state is distinct from the intersection or union of member beliefs. It can be emergent.
      *   *Vulnerabilities:*
