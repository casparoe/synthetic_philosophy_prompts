          *   *Agenda Power:* If premises determine conclusions, controlling the premises controls the conclusion. Is the "group" just the agenda-setter?
          *   *Moral Responsibility:* If I didn't believe the verdict, am I responsible for it?
          *   *Descriptive Accuracy:* Courts don't actually do this. They vote on the judgment. Is this normative or descriptive?
          *   *Metaphysics:* Is this just a metaphor? How do we test it?

