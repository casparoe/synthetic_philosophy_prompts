          *   *Refinement:* Is the aggregation mechanical or deliberative? If deliberative, does the premise-based rule stifle debate?
          *   *Follow-up:* She might say "It structures debate." Push back: Or does it Balkanize it?

      *   *Wait, I need to ensure the specific constraints from the prompt are met.*
