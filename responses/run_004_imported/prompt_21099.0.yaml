      *   **Goal:** Push past the standard "book talk" version. Get into mechanics, tensions, and implications.
      *   **Requirements:**
          *   8 or 9 interview questions.
          *   Specific topics to cover:
              1.  Premise-based vs. Conclusion-based aggregation (addressing List & Pettit's impossibility result).
              2.  Agenda manipulation (who frames the questions controls the outcome).
              3.  Responsibility (does group belief absolve individuals?).
              4.  Empirical mismatch (real courts vote on dispositions, not issues).
              5.  Falsifiability (what counts as evidence *against* the view?).
          *   Format: Question + Quick Follow-up (keyed to likely deflections).
      *   **Tone:** Professional, knowledgeable, slightly challenging (pushing past the rehearsed lines), suitable for a philosophy podcast.

  2.  **Deconstruct the Guest's Position (Mental Sandbox):**
