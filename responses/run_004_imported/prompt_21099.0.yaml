answer: |-
  Here are 9 interview questions designed to move past the standard "group agency 101" talking points and engage with the formal and normative tensions in your guest's work.

  **1. The Impossibility Trade-off**
  "You argue that premise-based aggregation is the only way for a collective to maintain consistency and count as a rational agent. But List and Pettit's impossibility theorem tells us we can't have Universal Domain, Anonymity, Systematicity, and Collective Rationality simultaneously without collapsing into a dictatorship. If you prioritize Collective Rationality via premise-based voting, which of the democratic constraints are you willing to sacrifice? Are you secretly accepting a form of epistemic dictatorship to save the group's rationality?"
  *   **Follow-up:** "If you say you restrict the Domain to avoid the impossibility result, doesn't that limit group agency to only non-controversial topics? If the group can only be rational when the inputs aren't contested, is it really doing any work?"

  **2. The Agenda-Setter Problem**
  "If the group's judgment is determined by how the question is decomposed into premises, then the power doesn't lie with the voters, but with whoever frames the agenda. If I can split a 'No' vote into two 'Yes' premises, I control the outcome. Isn't the 'group's belief' just a redescription of the agenda-setter's power?"
  *   **Follow-up:** "You might suggest procedural safeguards on agenda-setting. But aren't those safeguards just higher-order premises that are themselves subject to manipulation? Where does the regress stop?"

  **3. Moral Responsibility and Dissociation**
  "Let's talk about the moral remainder. If a panel issues a verdict that logically follows from their premises but is endorsed by *zero* individual members, does that let the individual judges off the hook? If I vote for the premises but explicitly reject the conclusion, can I claim 'clean hands' when the verdict turns out to be unjust?"
  *   **Follow-up:** "If you argue for 'shared responsibility,' doesn't that create a responsibility gap? If the group is the agent, and the individuals are just components, do we lose the ability to hold anyone specifically liable for bad outcomes?"

  **4. The Empirical Mismatch**
  "Your model presumes premise-based aggregation is what rationality demands. Yet, most real-world collegial courts and boards vote on the disposition (the conclusion), not the issues. If your view is correct, are our actual best-designed institutions systematically irrational? Or is your theory purely normative?"
  *   **Follow-up:** "If it's purely normative, why do you rely on the discursive dilemma—a descriptive feature of actual court behavior—as your primary evidence *for* the existence of strong group agency? You can't use their irrationality to prove their agency."

  **5. The Metaphysics of 'Literal' Belief**
  "You use the phrase 'literal believers' to distinguish your view from fictionalism or metaphoricism. But beliefs usually require a cognitive architecture to store and update them. What is the substrate of the group's belief? Is it just the written record, or does the group need a functional equivalent of a working memory?"
  *   **Follow-up:** "If the substrate is just the record, doesn't that make the group belief inert until an external interpreter reads it? How does the group *use* the belief without a homunculus to read the file?"

  **6. Diachronic Stability and Turnover**
  "Groups persist over time, but members turnover. If a new member joins who rejects the premises established by the previous cohort, does the group's belief change immediately? If not, how is the belief grounded in the members? If yes, doesn't that make the group's identity incredibly fragile?"
  *   **Follow-up:** "If you say the belief persists via institutional memory regardless of current membership, aren't you admitting the 'agent' is actually the institution's bureaucracy, not the deliberative body we're discussing?"

  **7. Alienation and Identification**
  "There's a psychological intuition that an agent should be able to identify with their output. In your model, members are often alienated from the group's conclusion. If the members feel no ownership over the verdict, in what sense is it *their* action? Does strong group agency require the members to be alienated from their own labor?"
  *   **Follow-up:** "You might say rationality doesn't care about feelings. But if the members refuse to enforce or uphold a verdict they all reject, doesn't the group agency collapse in practice?"

  **8. Deliberation vs. Aggregation**
  "Your model focuses heavily on aggregation mechanics. But doesn't premise-based voting stifle genuine deliberation? If I know my vote is only on a sub-premise, I might vote strategically to secure a preferred outcome downstream. Doesn't this turn the panel into a mechanical calculator rather than a deliberative body?"
  *   **Follow-up:** "If you argue that it structures deliberation, isn't that assuming the premises are neutral? But legal and ethical premises are often the most contested part of the debate. Doesn't voting on them first foreclose the real argument?"

  **9. Falsifiability and Evidence**
  "To close: I want to ask about the boundaries of the theory. What would actually count as evidence *against* strong group agency? If a group behaves consistently, has records, and acts intentionally, you call it an agent. If they behave inconsistently, you call them irrational agents. What scenario would force you to conclude they aren't agents at all, rather than just bad ones?"
  *   **Follow-up:** "If the answer is that it's a conceptual truth and thus not empirically falsifiable, does that risk making the theory compatible with everything, and therefore informative about nothing?"
