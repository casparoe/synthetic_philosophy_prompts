  4.  **Writing the Questions (incorporating tone and specifics):**

      *   *Tone Check:* Needs to sound like colleagues talking shop. Use terms like "doctrinal paradox," "functionalism," "diachronic," "normative force."
      *   *Specific Constraint Check:*
          *   Q1: List/Pettit Impossibility.
          *   Q2: Agenda Manipulation.
          *   Q3: Responsibility.
          *   Q4: Real Courts.
          *   Q9: Falsifiability.
          *   Others fill the gap.

      *   *Drafting Q1 (Impossibility):* Focus on the trade-off. List & Pettit say you give up Anonymity or Universal Domain. Which one goes?
