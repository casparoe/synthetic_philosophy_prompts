      *Refining Q1:* "List and Pettit's impossibility theorem suggests we can't have Universal Domain, Anonymity, Systematicity, and Collective Rationality without a dictator. You argue for Collective Rationality via premise-based aggregation. Which of the other democratic constraints are you willing to sacrifice to make that work?"
