          *   *Follow-up:* She might say "Procedural safeguards." Push back: Aren't those safeguards just *more* premises to manipulate?

      *   *Q3: Responsibility/Dissociation.*
          *   *Draft:* If the group believes X but no member does, who is to blame if X is bad?
          *   *Refinement:* Focus on the "moral remainder." If I vote for a premise that logically entails a verdict I hate, am I complicit?
          *   *Follow-up:* She might say "Shared responsibility." Push back: Does that dilute responsibility to the point of vanishing?

      *   *Q4: Empirical Mismatch (Courts).*
          *   *Draft:* Courts don't do this. They vote on the case. Why ignore reality?
          *   *Refinement:* Distinguish normative vs. descriptive. If this is what rationality *demands*, why do our best institutional designs ignore it?
          *   *Follow-up:* She might say "Courts are irrational." Push back: Then why trust them as group agents at all?

      *   *Q5: The "Literal Believer" Claim (Metaphysics).*
          *   *Draft:* You say they are literal believers. What does that mean?
          *   *Refinement:* Connect to cognitive architecture. Does the group have a memory? A way to update?
