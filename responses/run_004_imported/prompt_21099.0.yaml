          5.  Falsifiability (Closer).
          *   That's 5 specific requirements. I need 8-9 total. I can expand on the metaphysics, the psychology of members, and the normative implications.

      *   *Revised Plan:*
          1.  Impossibility Theorem (List/Pettit).
