answer: |-
  This is a classic and crucial pivot point in formal epistemology. Your students have put their finger on the exact weakness of the "vulgar" Dutch Book Argument (DBA): the gap between *pragmatic vulnerability* (losing money) and *epistemic defect* (irrational belief). If rationality is about tracking truth or managing evidence, why should it matter if a clever bookie can drain your bank account?

  The "depragmatizing" move attempts to bridge this gap by arguing that the betting scenario is merely a *heuristic* or a *measurement device* for a deeper, non-pragmatic inconsistency. The goal is to show that incoherent credences are defective *even if no bets are ever offered*, because they constitute a form of evaluative incoherence analogous to logical contradiction in full belief.

  Here is a granular breakdown of how that move is constructed, followed by the persistent objections that keep the debate alive.

  ### 1. The Depragmatizing Move: From Money to Value

  The core strategy is to reinterpret the betting quotients not as dispositions to *act* (which invites the "just don't bet" objection), but as measures of *evaluative commitment*.

  **The Shift in Interpretation**
  In the standard DBA, a credence of 0.6 in $P$ means you are willing to pay $\$0.60$ for a ticket that pays $\$1.00$ if $P$ is true. The depragmatizer argues we should strip away the currency. Instead, view the credence as the *value* you assign to the proposition being true.
  *   **Pragmatic:** "I will pay $\$0.60$."
  *   **Depragmatized:** "I value the prospect of $P$-being-true at 0.6 units of epistemic utility."

  **The Underlying Inconsistency**
  Once we make this shift, the Dutch Book Theorem no longer demonstrates that you will lose money; it demonstrates that your *valuation system* is structurally inconsistent.

  Consider the additivity axiom. If you assign $Cr(P) = 0.6$ and $Cr(\neg P) = 0.6$, the Dutch Book Theorem shows you can be pumped for money. But depragmatized, the claim is that you are assigning a value of 0.6 to $P$ and 0.6 to $\neg P$.
  *   The tautology $(P \lor \neg P)$ is logically equivalent to the sum of the mutually exclusive possibilities $P$ and $\neg P$.
  *   By assigning 0.6 to each, you are effectively valuing the parts (0.6 + 0.6 = 1.2) more than the whole (which must be valued at 1.0, since it is certain).

  **The "Dominance" Intuition**
  The normative force comes from a principle of *dominance* applied to evaluation.
  1.  **Ideal:** A rational agent's evaluative commitments should not rank a guaranteed loss (or a lower guaranteed value) as equivalent to or better than a sure gain (or higher value).
  2.  **Application:** An incoherent credence function implicitly values a package of propositions differently than it values the logical sum of those propositions.
  3.  **Conclusion:** The agent is in a state where their own evaluative standards conflict. They are committed to valuing a state of affairs $S$ at $V_1$ when described one way, and at $V_2$ when described another, where $V_1 \neq V_2$ despite the descriptions being extensionally equivalent.

  On this view, the bookie is irrelevant. The bookie merely *exposes* the inconsistency that is already present in the agent's web of belief. The "sure loss" is just a cash-out of the fact that the agent's credences fail to respect the logical relations between the propositions they are about.

  ### 2. Why This Is Supposed to Rescue the Argument

  The depragmatizer claims this avoids your students' two main objections:

  1.  **Contingency of the Bookie:** Since the defect is in the *valuation structure* itself, it exists whether or not a bookie shows up. The vulnerability is a *dispositional property* of the credence function, not a historical accident.
  2.  **Separation of Belief and Action:** Since the "betting prices" are reinterpreted as "degrees of belief" or "epistemic values," the agent cannot opt out by refusing to bet. To have the credence *just is* to have that evaluative commitment. Refusing to bet doesn't change the fact that your credences violate the norms of coherent valuation.

  This aligns probabilism with logical consistency for full beliefs. Just as believing $P$, believing $Q$, and believing $\neg(P \land Q)$ is irrational because of the logical relations (regardless of whether you act on them), having $Cr(P) + Cr(Q) \neq Cr(P \lor Q)$ is irrational because of the probabilistic relations.

  ### 3. Why Skeptics Remain Unconvinced

  Despite the elegance of this move, many formal epistemologists (including, at times, Christensen himself, depending on the specific work) remain skeptical that it fully closes the gap. Here are the three main lines of resistance you should present to your seminar.

  #### A. The "Bridge Principle" Problem
  The depragmatized argument relies on a bridge principle: *Rational credences must map onto evaluative commitments in a way that satisfies the probability axioms.*
  *   **The Objection:** Why? The pragmatist had an answer: because otherwise you lose money. The depragmatizer says: "because otherwise you are inconsistent." But the skeptic asks: "Why is *that kind* of inconsistency irrational?"
  *   **The Regress:** If I say, "I value $P$ at 0.6 and $\neg P$ at 0.6," and you say, "That's inconsistent because the sum must be 1," I can ask, "Why must my values sum to 1?"
  *   **The Worry:** The depragmatized DBA often smuggles in the conclusion. It assumes that the *only* rational way to value propositions is probabilistically. But without the pragmatic threat of ruin, the demand for probabilistic coherence looks like an arbitrary structural constraint rather than a normative requirement of rationality.

  #### B. The Epistemic/Practical Distinction
  Even if we accept that incoherent credences involve an evaluative inconsistency, is it an *epistemic* inconsistency?
  *   **The Objection:** Valuing a bundle of goods differently than its parts is a practical/decision-theoretic defect. But epistemology is about *truth*, *evidence*, and *accuracy*.
  *   **The Worry:** An agent could have incoherent credences but still be perfectly responsive to evidence (e.g., they update via conditionalization but start with incoherent priors due to computational limits). If the only defect is "evaluative inconsistency," have we really shown they are *epistemically* irrational, or just that they are bad at a specific kind of abstract accounting?
  *   **Christensen's Nuance:** It is worth noting that David Christensen has sometimes argued that this distinction is a mirage—that epistemic rationality *is* a species of practical rationality. But for those who want a purely truth-directed norm, the depragmatized DBA still feels too close to decision theory.

  #### C. The "Accuracy" Turn (The Modern Successor)
  Many epistemologists feel the depragmatized DBA doesn't go far enough and have migrated to **Epistemic Utility Theory** (e.g., James Joyce, Hannes Leitgeb).
  *   **The Move:** Instead of talking about "value" or "betting," they talk about *accuracy*. They define a "scoring rule" that measures the distance between a credence and the truth.
  *   **The Theorem:** If your credences are probabilistically incoherent, there is *always* an alternative set of coherent credences that is guaranteed to be more accurate (closer to the truth) than yours, no matter how the world turns out. (This is the *Accuracy Dominance Theorem*).
  *   **Why it matters for your seminar:** This is the natural evolution of the depragmatizing move. It removes the "money" entirely and replaces it with "truth."
  *   **The Remaining Skepticism:** Even here, skeptics ask: Why should we care about minimizing *expected* inaccuracy defined by a specific scoring rule (like the Brier Score)? The move from "you are vulnerable to accuracy dominance" to "you are irrational" still requires a normative premise: *Rational agents must not adopt options that are dominated in terms of epistemic utility.* Some argue this premise is just as contentious as the original pragmatic bridge.

  ### Summary for the Seminar

  To crystallize this for your students, you might frame the dialectic like this:

  1.  **Pragmatic DBA:** Incoherence $\rightarrow$ Sure Loss of Money.
      *   *Flaw:* Rationality shouldn't depend on bookies or willingness to bet.
  2.  **Depragmatized DBA:** Incoherence $\rightarrow$ Inconsistency in Evaluative Commitments.
      *   *Gain:* Removes the bookie; makes the defect internal to the mind.
      *   *Flaw:* Why is *this* specific evaluative consistency required for rationality? Is it epistemic or practical?
  3.  **Accuracy Argument (The Next Step):** Incoherence $\rightarrow$ Guaranteed Lower Accuracy.
      *   *Gain:* Removes money entirely; focuses on truth.
      *   *Flaw:* Relies on specific assumptions about how to measure "distance from truth."

  The "depragmatizing" move is essentially an attempt to show that the Dutch Book Theorem reveals a **synchronic structural defect** in the agent's doxastic state, akin to holding contradictory beliefs. The skepticism remains because identifying the defect is easier than explaining why *that specific defect* violates the norms of epistemic rationality rather than just the norms of abstract consistency.

  If you want to challenge your students further, ask them: *If an agent knows her credences are incoherent but is incapable of computing the coherent alternative (due to cognitive limits), is she irrational?* The depragmatized DBA struggles here, as the "inconsistency" remains even if the agent cannot fix it, suggesting the norm might be too demanding for non-ideal agents. This opens the door to discussions of *ideal vs. non-ideal rationality*, which is often where the real philosophical work happens.
