prompt: |-
  I'm the CTO at a small startup and I sit on the committee deciding how far to keep going in a bidding war to acquire another startup for its team. We lost a similar bidding war to this same rival last year. Our offer used to match our own internal valuation of the target; after several rounds of back and forth we're now 40% over that number, and we've already burned $250k in legal/diligence fees that we lose no matter what happens. Half the committee wants to raise again -- "we're already this deep, no point loosing that 250k for nothing" -- and the other half wants to walk. Someone joked this is basically the dollar auction thing from that game theory post everyone shared a while back, except "lol sunk cost fallacy" doesn't feel like the full answer here, since there's an actual live competitor still bidding against us, and the founders of the company we're fighting over come out ahead either way, which feels relevant but I can't say why. Write me the memo I'd bring to the committee: a clear recommendation (raise, hold, walk, or something else), a concrete stopping rule, and honest engagement with the "we're already this deep" argument instead of just waving it off as a bias.
