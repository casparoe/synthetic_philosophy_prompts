      *   **The Dollar Auction:** In the classic Martin Shubik game, two players bid for a dollar. Highest bidder wins the dollar, *both* pay their bid. This leads to irrational escalation beyond the value of the prize.
      *   **This Scenario:** It's slightly different.
          *   Winner pays bid, gets team.
          *   Loser pays sunk costs ($250k), gets nothing.
          *   Rival: Same one as last year. This suggests a pattern or a strategic blockade.
          *   Target: Founders win either way (liquidity event). This reduces their incentive to help *us* specifically, unless there's a culture fit/mission alignment premium.
          *   Valuation: We are already 40% over internal valuation. This means the NPV (Net Present Value) of the deal is likely negative *at this price*.
      *   **The "Already This Deep" Argument:** It's not *just* sunk cost. It's about the *probability of success* vs. *marginal cost*. If we raise by $X, do we increase the probability of winning enough to justify $X? However, since we are already over valuation, winning is inherently value-destructive unless the strategic value exceeds the financial overpay.
      *   **The Rival Factor:** Losing to the *same* rival twice signals they value this asset more (perhaps strategic fit, perhaps ego) or have deeper pockets. Continuing signals weakness/desperation to the market and the rival.
      *   **The Target Factor:** If they know we are 40% over valuation, they might just be using us to drive up the price for the rival (auction shilling), or they genuinely prefer us but need the money.

