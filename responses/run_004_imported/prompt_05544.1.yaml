answer: |-
  The tension within Leibniz's mature jurisprudence lies at the intersection of his normative ethics and his descriptive psychology. On one hand, he offers a lofty definition of justice as *caritas sapientis* ("the charity of the wise"), characterized by a disinterested love that seeks the good of another for that other's sake. On the other hand, his metaphysical psychology posits a strict eudaimonism: the will is necessarily determined by the perception of the agent's own greatest good or pleasure.

  I argue that these commitments are logically incompatible. By defining pleasure as the "perception of perfection" and asserting that all volition aims at the agent's own pleasure, Leibniz structurally necessitates that every act of will is self-referential. Consequently, the "disinterestedness" he attributes to charity is illusory. On his own premises, the love of the other is merely a mechanism for the perfection of the self. Thus, his definition of justice fails to distinguish itself from enlightened egoism, rendering the moral distinction between justice and prudence merely quantitative (a matter of scope) rather than qualitative (a matter of motive).

  ### 1. The Ethical Ideal: Disinterested Charity
  Leibniz defines justice not merely as adherence to law, but as a habit of mind: the charity of the wise. Central to this definition is the claim that charity is **disinterested**. For Leibniz, to love someone disinterestedly is to find pleasure in their happiness *for its own sake*, rather than as a means to one's own utility, safety, or external reward.

  He distinguishes this from "mercenary" love. A mercenary lover seeks the beloved's good only insofar as it yields a separate benefit (e.g., money, status, or divine reward). The wise man, however, ostensibly loves the good of others because the existence of that good is intrinsically delightful to him. Leibniz insists that if we loved others only for the utility they provide us, we would cease to love them the moment they became useless. True justice, he argues, requires a benevolence that persists because the *object* of the love (the other's perfection) is valued independently of the *subject's* instrumental gain.

  ### 2. The Psychological Mechanism: Necessity of Self-Reference
  However, this ethical ideal rests upon a psychological foundation that undermines it. Leibniz's theory of motivation is grounded in two specific premises:
  1.  **The Definition of Pleasure:** Pleasure is nothing but the feeling or perception of perfection.
  2.  **The Determination of the Will:** Every act of will is moved by the pursuit of the agent's own greatest pleasure (or the avoidance of pain).

  For Leibniz, the soul is a monad; it has no windows. It acts only according to its own internal principles and perceptions. When an agent wills an action, they do so because their intellect presents a certain outcome as the "best" option, and the "best" is identified by the greatest perception of perfection (pleasure) associated with it. Even when I will the good of another, I do so because the *perception* of that good constitutes a perfection *in me*.

  This creates a closed loop of motivation. The will cannot step outside the self to grasp an external good directly; it can only grasp its own *perception* of that good. Since the motive force of the will is the augmentation of the agent's own state of perfection (pleasure), the ultimate *terminus* of every volition is the self.

  ### 3. The Collapse of Disinterestedness
  The contradiction arises when we attempt to hold the ethical claim (disinterestedness) and the psychological claim (self-referential volition) simultaneously.

  If pleasure is the perception of perfection, and I act to maximize my pleasure, then I am acting to maximize my perception of perfection. When I act benevolently toward you, Leibniz argues I am taking pleasure in *your* perfection. But whose perfection is actually being augmented by the act of willing? According to Leibniz's psychology, the immediate perfection realized is **mine**, because the pleasure is *my* feeling.

  Therefore, the structure of the motivation is:
  1.  I perceive your happiness.
  2.  This perception causes a feeling of pleasure in me (my perfection).
  3.  My will seeks to maximize this feeling of pleasure.
  4.  Therefore, I will your happiness.

  In this chain, your happiness is the *object* of the perception, but my pleasure is the *motive* of the will. Leibniz claims that disinterested love loves the object for its own sake. But if the will is necessarily moved by the agent's own pleasure, then the object is loved *for the sake of the pleasure it generates in the agent*.

  This reduces "disinterested" charity to a refined form of self-interest. It is "enlightened" because the agent recognizes that their own greatest perfection lies in the contemplation and promotion of universal harmony (the happiness of others). However, it remains "egoistic" because the *reason* for the action remains the agent's own state of satisfaction. If the agent were constitutionally incapable of feeling pleasure from another's good (a psychological impossibility for Leibniz, but a useful counterfactual), the will would not move toward that good. Thus, the good of the other is not willed for its own sake, but conditionally, based on its capacity to perfect the self.

  ### 4. The Failure to Distinguish Justice from Prudence
  Leibniz attempts to distinguish justice from mere prudence (enlightened self-interest) by arguing that the wise man finds immediate pleasure in the good of others, whereas the prudent man seeks it only for long-term reward. He argues that the pleasure is intrinsic to the act of loving, not a subsequent consequence.

  However, this distinction collapses under his psychological premises. Whether the pleasure is immediate (intrinsic to the perception) or delayed (a consequence of the action), it remains **my** pleasure. Whether I help you because it makes me feel good *now* (charity) or because it ensures you help me *later* (prudence), the formal structure of the motivation is identical: *I act to optimize my own perceptual state.*

  By making pleasure the necessary condition of volition, Leibniz makes it impossible to will a good that does not, in some way, perfect the willer. Consequently, the "disinterestedness" of *caritas sapientis* is empty. It describes a state where the self's interests are so broadly aligned with the interests of others that the distinction blurs, but it does not describe a state where the self's interest ceases to be the driving force.

  ### Conclusion
  Leibniz's definition of justice as the "charity of the wise" attempts to secure a moral realism where the good of others has independent normative weight. However, his psychological eudaimonism dictates that the will is always tethered to the agent's own perception of perfection. Because pleasure is defined as the agent's perception, and the will seeks the agent's pleasure, every act of benevolence is ultimately an act of self-perfection.

  Therefore, the commitments cannot be jointly sustained. One must either abandon the claim that charity is truly disinterested (admitting that all love is a form of self-love) or abandon the psychological premise that the will is determined solely by the agent's own pleasure. As long as Leibniz retains the latter, his definition of justice fails to pick out anything beyond enlightened egoism. The "wise" man is simply the egoist who realizes that his own perfection is maximized by the perfection of the universe, but he remains, inextricably, the center of his own moral universe.
