answer: |-
  Good evening. For those who don't know me, I'm the groom's brother. For those who do know me, you know I'm currently taking a seminar on the ethics of belief. So, naturally, when I was asked to give this toast, I thought: *Finally, a practical application.*

  I know some in this room—mostly family, mostly out of love—have worried that eighteen months isn't enough time to gather sufficient evidence for a lifetime commitment. In philosophy, we call this the Cliffordian position. W.K. Clifford argued that it is wrong always, everywhere, and for anyone, to believe on insufficient evidence. He illustrates this with a Shipowner who sends an emigrant vessel to sea. The ship is old, the evidence suggests it might not be seaworthy, but the shipowner suppresses his doubts and sends it anyway. When it sinks, Clifford says, he is guilty of the deaths, not because the ship sank, but because he didn't have the right to believe it would float without proof.

  To our aunts and uncles who worry: You are right to care about the ship. You want to ensure the hull is sound. That is responsible.

  But here is where the philosophers in the back are smiling, because marriage is not inspecting a ship; it is building one while at sea.

  William James, responding to Clifford, argued that there are moments when waiting for sufficient evidence is itself a choice with consequences. He called these "Genuine Options." For a choice to be genuine, it must be *live* (a real possibility), *forced* (avoiding the choice is effectively choosing the alternative), and *momentous* (unique and significant).

  Look at my brother and [Fiancée]. Their love is *live*. The choice to commit is *forced*; to wait for perfect certainty is to choose not to marry. And it is undeniably *momentous*.

  James's crucial insight—and the one I ask you to raise a glass to—is that in relationships, "faith in a fact can help create the fact." The success of a marriage is not a pre-existing truth waiting to be discovered by evidence. It is a reality constructed by the commitment itself. If my brother waits for proof that [Fiancée] will be the perfect partner, he will never find it. But by believing she is, he becomes the partner she can trust.

  Clifford protects us from sinking ships. But James gets us to sail.

  So, to the skeptics: Thank you for checking the hull. But to the couple: Thank you for having the will to believe.

  To [Brother] and [Fiancée].
