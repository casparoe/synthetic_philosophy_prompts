answer: |-
  The light was failing over Langemark. The dark basalt blocks of the *Massengrab*—the mass grave where nearly 25,000 soldiers are buried beneath a single mound—loomed ahead of us. It's a heavier place than Tyne Cot. Less ordered, more mournful.

  Theo kicked at a loose stone on the path. He hadn't let the argument drop since we left the visitor center.

  "Look," Theo said, stopping in front of a row of flat stones, each bearing four names. "You keep saying 'moral responsibility.' But look at these names. *Klaus, Hans, Fritz, Wilhelm.* Students. Volunteers. The *Kindermord* at Ypres. They were fed to the machine. You're telling me that because the Kaiser started the fight, this kid Hans is morally liable to be shot in a way that the British Tommy shooting him isn't?"

  "I'm not saying Hans is a criminal," I said, keeping my voice low. The silence here felt sacred, fragile. "I'm saying there's a difference between *blame* and *liability*. McMahan's point is that you can be excused for doing something wrong without the act becoming right."

  "That's wordplay," Theo snapped, though he kept his eyes on the graves. "It's a distinction without a difference when you're staring down a bayonet. If Hans isn't blameworthy—if he's *excused*, as you say, because he was lied to by his generals, because he had no free press—then on what ground does the British soldier stand to kill him? If Hans is innocent of the war's injustice, he's an innocent threat. And you don't kill innocent threats if you have another choice."

  "The British soldier *does* have another choice," I countered. "He can not be there. Or, once he is there, he only kills to stop an unjust threat. Hans is posing an unjust threat, even if he doesn't know it. The Brit is posing a just threat, or at least a necessary one. Their moral positions aren't symmetrical. One is defending, one is aggressing. How can the universe view those two acts as identical?"

  "Because the universe doesn't run the war," Theo said, turning to face me. "People do. And people are blind. This is the epistemic wall, Alex. You can't expect a nineteen-year-old in a trench to adjudicate *jus ad bellum*. He doesn't have the briefing books. He doesn't know about the treaties. He knows the guy in the other trench is trying to kill him. If you tell him, 'Actually, you're the aggressor, so you don't have the right to shoot back,' you aren't making war more moral. You're making it a slaughter."

  "I'm not talking about what we tell the nineteen-year-old," I said, frustrated. "I'm talking about the moral reality of what happens when the bullet hits. You're conflating the *law of war* with the *morality of war*. McMahan admits this! He says maybe the *laws* should stay symmetrical for practical reasons. Maybe we need the War Convention to protect prisoners and limit violence. But that's a pragmatic compromise. It doesn't change the truth. The truth is, if Germany was the aggressor, every German bullet fired was a moral wrong, and every British bullet was a moral right. They aren't equals."

  Theo shook his head, walking slowly toward the central mound. "So the law should lie? We should teach soldiers that they have equal rights to kill each other, even though you believe one side is fundamentally murdering the other?"

  "I'm saying the law is a tool," I said, following him. "It's a fence to keep the horror contained. But we shouldn't confuse the fence with the landscape. The landscape is that one side was fighting for survival and the other for expansion or dominance. If we say they are morally equal, we wash the blood off the hands of the aggressor state by transferring the guilt to the abstract concept of 'War.'"

  "Wait," Theo said, holding up a hand. "Here's where your revisionism breaks. If you admit the *law* needs to treat them symmetrically to function—to keep the aggressor from fighting dirty, to ensure POWs are treated well—then what work is your 'deep morality' actually doing? If the practical upshot is that we treat Hans and the Tommy as equals to minimize suffering, why does it matter that you've labeled Hans an 'unjust threat' in your philosophy seminar?"

  "Because it matters for how we judge the war afterwards," I said. "It matters for reparations. It matters for memory. If we say they were morally equal, we imply the cause didn't matter. But the cause *always* matters. If I tackle a mugger to save a victim, and the mugger stabs me in the struggle, we don't say we had 'equal standing.' I was justified. He wasn't. Even if he thought I was attacking him."

  "But the mugger knows he's mugging," Theo said sharply. "Hans doesn't know he's invading. That's the disanalogy. In the trench, the epistemic gap is total. If you remove the Moral Equality of Combatants, you remove the only shield the common soldier has. If Hans knows his government has told him he has no right to fight, he has no incentive to follow *jus in bello*. Why take prisoners? Why not use gas? If he's already a 'murderer' in your deep morality, he might as well act like one."

  I paused. That was the Walzerian trap. "Okay," I said slowly. "That's a practical consequence. I grant that. If telling soldiers they are unjust makes them fight worse, then maybe we shouldn't tell them that *in the moment*. But that doesn't make them *morally* equal. It just makes the truth dangerous."

  "Truth that destroys the rules of the game isn't truth, Alex. It's negligence," Theo said. He gestured to the mass grave. "Look at this. Twenty-five thousand boys under one patch of grass. The system collapsed. Millions died. The only thing that might have saved some of them was the idea that 'we are all soldiers doing a job.' Once you strip that away, once you say 'No, *you* are the bad guys,' you turn a conflict into a crusade. And crusades don't end with treaties. They end with annihilation."

  "I'm not calling for a crusade," I said, feeling the weight of his point. "I'm saying we can hold two thoughts. One: The laws of war should remain symmetrical to protect everyone. Two: We must acknowledge that the aggressors were liable to be stopped, and the defenders were not. We can respect the rules while knowing the rules are a fiction."

  "A useful fiction," Theo corrected. "But if it's a fiction, why are you so upset about it? Why does it matter if I believe Hans and the Tommy were equals?"

  "Because," I said, looking down at the name *Wilhelm* carved into the dark stone. "If they are equals, then the British soldier who killed Wilhelm committed the same moral act as Wilhelm trying to kill him. And I don't believe that. I believe Wilhelm was tragic, maybe excused, but he was part of a machine that shouldn't have been moving. The Brit was part of a machine trying to stop it. If we erase that distinction, we erase the difference between defense and murder."

  Theo was quiet for a long time. The wind moved through the cypress trees.

  "Here's my problem," Theo said finally, his voice softer. "You say Wilhelm is liable to be killed because he poses an unjust threat. But liability usually requires some level of control. If I push you because someone shoved me, am I liable for your bruise? Or is the shover liable? Wilhelm didn't shove anyone. He was shoved. By the Kaiser, by the mobilization orders, by the train schedule. If you say he's liable, you're punishing the tool for the hand that wielded it."

  "He's not a tool, he's a person," I said. "He pulled the trigger."

  "He pulled the trigger because if he didn't, he'd be shot by his own officers, or his family starved, or he was told his homeland was under siege," Theo said. "Your revisionist view works in a duel. It doesn't work in a total war where the 'threat' is systemic. If you want to assign liability, assign it to the leaders. But don't tell me the kid in the hole has a different moral status than the kid in the hole opposite him. They're both meat for the grinder."

  "And that's where I think you're wrong," I said. "Because if they're both just meat, then the war has no meaning at all. It's just tragedy. But some wars *need* to be fought. If we say the defender has no more right to kill than the aggressor, we undermine the very possibility of just defense. We make killing in war always a tragedy, never a justice."

  "Maybe it is always a tragedy," Theo said. He looked at me, and for a second he looked tired, older than the argument. "Maybe that's the point of places like this. To show us that even when you're right, even when you're the 'defender,' the cost is this. Rows of children. If your morality makes you feel better about the killing because you're 'justified,' maybe you're missing the horror."

  I felt that land. It was the cost of the revisionist view: it comforts the defender with their own righteousness.

  "Maybe," I admitted. "But if I don't believe I'm justified, how do I pull the trigger to stop a genocide? How do I stop the next Hitler?"

  "By knowing you're doing something terrible to stop something worse," Theo said. "Not by telling yourself the other guy deserves it."

  We stood there in the silence. The basalt stones were cold. I wanted to say that *deserving* wasn't the point—*liability* was. That stopping an unjust threat isn't the same as punishing a criminal. But the words felt thin against the sheer weight of the dead beneath our feet.

  "So," I said finally. "We agree the laws should stay the same?"

  "For the sake of the living, yes," Theo said. "Symmetry in the rules. Restraint."

  "And the morality?"

  Theo looked back at the mass grave. "I think the dead don't care about your morality. They just care that we don't do it again."

  "I think the morality matters," I said quietly. "Because if we don't get the morality right, we won't know *what* not to do again."

  Theo didn't answer. He just put a hand on one of the headstones, a brief, human touch against the dark rock. We turned and walked back toward the gate, the argument unresolved, hanging in the air between the rows of names.
