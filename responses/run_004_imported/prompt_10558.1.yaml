answer: |-
  # Handout: Popper's Verisimilitude and the Miller-Tichý Theorem

  **Course:** Graduate Seminar in Philosophy of Science  
  **Topic:** The Collapse of Popper's Qualitative Definition of Truthlikeness  
  **Key Reference:** Miller, D. (1974) "Popper's Qualitative Theory of Verisimilitude"; Tichý, P. (1974) "On Popper's Definitions of Verisimilitude"

  ---

  ## 1. Popper's Qualitative Definition

  Karl Popper introduced the concept of **verisimilitude** ($Vs$) to articulate the idea that science progresses toward the truth, even if its theories are strictly false. He aimed to define a relation $A >_v B$ ("$A$ is closer to the truth than $B$") using the logical content of theories.

  Let $Cn(T)$ be the set of all logical consequences of theory $T$.
  Let $Ct_T(T) = Cn(T) \cap \text{Truth}$ (the **truth-content**).
  Let $Ct_F(T) = Cn(T) \cap \text{Falsity}$ (the **falsity-content**).

  **Popper's Definition:**
  $A$ has more verisimilitude than $B$ ($A >_v B$) if and only if:
  1.  $Ct_T(A) \supseteq Ct_T(B)$ **and** $Ct_F(A) \subset Ct_F(B)$,  
      **OR**
  2.  $Ct_T(A) \supset Ct_T(B)$ **and** $Ct_F(A) \subseteq Ct_F(B)$.

  *(In plain English: $A$ must have at least as much truth-content and strictly less falsity-content, or strictly more truth-content and no more falsity-content.)*

  ---

  ## 2. A Concrete Counterexample

  Consider a simple empirical domain regarding the current weather. We define three independent atomic propositions:
  *   $h$: It is hot.
  *   $r$: It is rainy.
  *   $w$: It is windy.

  **The Truth ($T$):** Suppose the actual state of the world is **$h \land r \land w$** (It is hot, rainy, and windy).

  Now, consider two competing false theories:

  *   **Theory 1 ($T_1$):** $\neg h \land r \land w$  
      ("It is not hot, but it is rainy and windy.")
  *   **Theory 2 ($T_2$):** $\neg h$  
      ("It is not hot.")

  **Intuitive Judgment:**
  Virtually everyone would judge **$T_1$ to be closer to the truth than $T_2$**.
  *   $T_1$ gets two features right ($r, w$) and one wrong ($h$).
  *   $T_2$ gets one feature wrong ($h$) and commits to nothing regarding $r$ and $w$.
  *   $T_1$ is a *strengthening* of $T_2$ (since $T_1$ entails $T_2$). By adding true information ($r \land w$) to a false base ($\neg h$), $T_1$ seems to approximate the truth better than the vaguer $T_2$.

  ---

  ## 3. Why Popper's Definition Fails

  We now apply Popper's set-theoretic criteria to $T_1$ and $T_2$.

  **Step A: Compare Truth-Content**
  *   Since $r$ and $w$ are true, they belong to the truth-content of any theory that entails them.
  *   $T_1$ entails $r$ and $w$. Thus, $\{r, w, \dots\} \subseteq Ct_T(T_1)$.
  *   $T_2$ ($\neg h$) does **not** entail $r$ or $w$. Thus, $r, w \notin Ct_T(T_2)$.
  *   **Result:** $Ct_T(T_1) \supset Ct_T(T_2)$. ($T_1$ has strictly more truth-content).

  **Step B: Compare Falsity-Content**
  *   Since $\neg h$ is false, it belongs to the falsity-content of any theory that entails it.
  *   Both $T_1$ and $T_2$ entail $\neg h$. Thus, $\neg h \in Ct_F(T_1)$ and $\neg h \in Ct_F(T_2)$.
  *   However, $T_1$ entails the conjunction $\neg h \land r \land w$. This statement is false (because $\neg h$ is false).
  *   Does $T_2$ entail $\neg h \land r \land w$? **No.** $T_2$ is silent on $r$ and $w$.
  *   Therefore, the false statement $(\neg h \land r \land w)$ is in $Ct_F(T_1)$ but **not** in $Ct_F(T_2)$.
  *   **Result:** $Ct_F(T_1) \supset Ct_F(T_2)$. ($T_1$ has strictly more falsity-content).

  **Step C: Apply Popper's Condition**
  For $T_1 >_v T_2$, Popper requires that since $T_1$ has more truth-content, it must have **equal or less** falsity-content ($Ct_F(T_1) \subseteq Ct_F(T_2)$).

  Our analysis shows:
  1.  $Ct_T(T_1) \supset Ct_T(T_2)$ (Satisfied)
  2.  $Ct_F(T_1) \supset Ct_F(T_2)$ (**Violated**)

  **Conclusion:** Under Popper's definition, **$T_1$ is not more verisimilar than $T_2$.** In fact, because the falsity-contents are not subsets of one another in the required direction, the theories are incomparable regarding verisimilitude.

  **The General Theorem:**
  This example illustrates the general proof by Miller and Tichý: **If $A$ and $B$ are both false, and $A$ entails $B$, then $A$ cannot be more verisimilar than $B$ on Popper's definition.** Since strengthening a false theory always increases both its truth-content (by adding true consequences implicit in the world) and its falsity-content (by adding more specific false claims), Popper's definition implies that **no false theory can ever be ranked as closer to the truth than any other false theory.** This renders the concept useless for scientific progress, which largely operates among false theories.

  ---

  ## 4. The Possible-Worlds 'Likeness' Alternative

  In response to this collapse, philosophers like Tichý, Niiniluoto, and Oddie proposed **possible-worlds similarity measures**. Instead of comparing sets of consequences, these measures calculate the "distance" between the actual world and the worlds allowed by the theory.

  **Application to our Example:**
  Let the actual world be $w^* = (1, 1, 1)$ [Hot, Rain, Wind].
  We use a simple Hamming distance (counting mismatched features).

  *   **$T_1$ ($\neg h \land r \land w$):** Allows only one possible world: $(0, 1, 1)$.
      *   Distance from $w^*$: **1** (only $h$ mismatches).
  *   **$T_2$ ($\neg h$):** Allows four possible worlds: $(0, 1, 1), (0, 1, 0), (0, 0, 1), (0, 0, 0)$.
      *   Distances from $w^*$: 1, 2, 2, 3.
      *   Average Distance: **2**.

  **Evaluation:**
  Measures such as Niiniluoto's **Min-Sum measure** combine the distance of the closest world (min) and the sum of distances of all allowed worlds (sum).
  *   $T_1$ has a lower minimum distance (1 vs 1) and a significantly lower sum/average distance (1 vs 2).
  *   **Result:** The likeness measure correctly ranks **$T_1 >_v T_2$**.

  **Verdict:**
  Unlike Popper's content-based definition, possible-worlds likeness measures **fare better** on this example. They successfully capture the intuition that a false theory which is more specific and matches more features of the truth is closer to the truth than a vaguer false theory, even if both are strictly false. However, these measures introduce their own complexities regarding the metric of "distance" between worlds, which remains a topic of debate.
