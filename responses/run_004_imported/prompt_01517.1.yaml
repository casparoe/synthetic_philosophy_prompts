answer: |-
  This is a fantastic question. You have stumbled onto one of the deepest problems in philosophy, law, and organizational psychology, all wrapped up in a cron job.

  Your brain is breaking because you are correctly sensing a contradiction between **metaphysical causality** (what physically made the event happen) and **pragmatic causality** (who we hold responsible to prevent it from happening again).

  Dave is logically right: in a purely physical sense, an infinite number of non-actions contributed to the outage. If the CEO had written a monitoring script, the outage wouldn't have happened. If your cat had knocked out the power, the cert wouldn't have expired. In the strict logic of counterfactuals ("If X hadn't happened, Y wouldn't have occurred"), Dave's omission, your omission, and the cat's omission are all equal.

  However, in human systems, we do not treat them as equal. There *is* a principled way to distinguish them, but it requires admitting that causality in social contexts is **normative**, not just physical.

  Here is the framework for distinguishing "causal omissions" from "background conditions," and why your team's postmortem actually failed the "blameless" test.

  ### 1. The Philosophical Distinction: Conditions vs. Causes
  Legal philosophers H.L.A. Hart and Tony Honoré wrote the definitive work on this (*Causation in the Law*). They argue that we distinguish causes from mere conditions based on **intervention** and **norms**.

  *   **Conditions:** These are the static background facts that allow an event to happen. (e.g., "Oxygen was present," "Dave didn't set an alert," "The CEO didn't set an alert.")
  *   **Causes:** These are the *abnormal* interventions or deviations from the expected course of events.

  In a healthy system, the "expected course of events" is that critical services are monitored. Therefore, the *absence* of monitoring is an **abnormal deviation**.
  *   **For Dave:** His role defines the "normal." He is the owner. For him *not* to set an alert is a deviation from his norm.
  *   **For You/The CEO/The Cat:** Your role does not define alerting for that service as "normal." For you *not* to set an alert is consistent with the norm.

  So, to answer your question: **Yes, there is a principled difference.** It isn't physical; it is **normative**. We select causes based on what *should* have happened according to the system's rules and roles.

  ### 2. The "Blameless" Failure
  Here is where your team actually messed up. While Dave's omission is the "cause" in the normative sense, identifying it as the **Root Cause** in a postmortem violates the principle of a Blameless Postmortem.

  A blameless postmortem operates on the premise that **individual humans are the least reliable component in the system.** If the system relies on Dave remembering to set an alert, the system is fragile.

  *   **The Team's Logic:** "Dave didn't set the alert. Fix Dave (or blame Dave)."
  *   **The Systems Logic:** "The system allowed a critical cron job to fail silently for three weeks without any standardized safety net. Fix the system."

  Dave's pushback was actually a systems-thinking argument disguised as defensiveness. He was pointing out that relying on individual vigilance (his job description) is a fragile control. If he forgot, the system should have had a secondary check (e.g., a dashboard review, a standardized cron wrapper that auto-alerts, a cert expiry monitor).

  By converging on "Dave didn't alert," the team treated a **symptom** (Dave's action) as the **disease** (lack of standardized alerting infrastructure).

  ### 3. A Principled Framework for "Causal Omissions"
  To stop your brain from spinning, you can use this three-part test to determine if a non-action counts as a cause in a professional context. An omission is a "cause" worthy of attention if it meets these criteria:

  **A. Duty/Role Expectation (Normativity)**
  Did the person have a specific, recognized obligation to act?
  *   *Dave:* Yes. He owns the service.
  *   *You/CEO/Cat:* No.
  *   *Verdict:* Dave's omission is causally relevant; yours is not.

  **B. Leverage/Control (Agency)**
  Did the person have the direct power to prevent the outcome at the time?
  *   *Dave:* Yes. He could have added the line of code.
  *   *CEO:* No. They would have had to intervene through layers of management.
  *   *Verdict:* Dave is a more proximate cause.

  **C. Generalizability (Systemic Value)**
  If we fix this omission, does it prevent a *class* of errors, or just this one?
  *   *Fixing Dave:* "Dave, please be more careful." (Prevents only Dave's future mistakes).
  *   *Fixing the System:* "All cron jobs must use the StandardWrapper which auto-alerts on failure." (Prevents everyone's future mistakes).
  *   *Verdict:* This is where the team failed. They stopped at A and B, without getting to C.

  ### 4. Why It Feels Like "Dressed Up Blaming"
  You asked if this is just a polite way of dressing up who we feel like blaming. Often, **yes.**

  When organizations say "The root cause is human error," they are usually saying "We don't want to spend the money to engineer a solution, so we will put the burden on the human."

  Dave felt targeted because the team used causal analysis to assign **liability** rather than **learning**.
  *   **Liability:** "Who do we blame so we can close the ticket?" -> Dave.
  *   **Learning:** "What mechanism failed that allowed this to slip through?" -> The alerting infrastructure.

  ### 5. How to Resolve the Cognitive Dissonance
  You can hold two truths in your head simultaneously:

  1.  **Dave is the "Cause":** In the context of your organization's norms and roles, Dave was the specific agent whose action was expected and didn't happen. It is not arbitrary that it was him and not you.
  2.  **The Team is Wrong:** Identifying Dave as the root cause is lazy engineering. A robust system does not rely on the owner remembering to set an alert. It assumes the owner *will* forget and builds a guardrail.

  **The "Fact of the Matter":**
  There is no fact of the matter in physics. There is only a fact of the matter in **organizational design.**
  *   Fact: Dave owned the service.
  *   Fact: The system lacked a standardized safety net.
  *   Fact: The team culture equates "root cause" with "person who messed up."

  ### Summary Advice
  If you want to move past this, reframe the incident in your head using the **Swiss Cheese Model** of accident causation.
  *   Slice 1: Dave didn't set an alert. (Active Failure)
  *   Slice 2: There was no mandatory alerting standard for cron jobs. (Latent Condition)
  *   Slice 3: No one reviewed the dashboard for 3 weeks. (Latent Condition)

  The outage happened because the holes aligned. Dave's hole was the most obvious, but if you only patch Dave's hole, the next outage will come through Slice 2.

  Dave was right to push back, not because he isn't responsible, but because **focusing on his responsibility lets the rest of the team off the hook for building a system that requires such responsibility in the first place.**

  You aren't crazy. You spotted a category error. The team treated a **systemic design flaw** as an **individual performance issue.** That is why it didn't feel blameless.
