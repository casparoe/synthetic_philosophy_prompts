answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the groom's older brother. And like most older brothers, my primary role in life has been to watch [Groom's Name] make questionable decisions, and then be there to help him fix them.

  But this time, I don't think he needs any fixing.

  [Groom] and [Fiancée] have a story that feels like it belongs in a novel. They met when they were fifteen. They were together for four years, then apart for almost a decade. They lived entire separate lives, grew into different adults, and then, three years ago, found their way back.

  At the engagement dinner, [Fiancée] read a letter [Groom] wrote her when he was seventeen. In it, he promised he would never love anyone else. Now, statistically speaking, that promise was false. He did love others. She did too. But watching them laugh about it that night, it didn't feel like a broken vow. It felt like a first draft.

  Now, I have a bit of a hobby. In my free time, I read philosophy. Specifically, I've been obsessed lately with the metaphysics of persistence. The question is: What makes you *you* over time?

  There's a view called *endurantism*, which says you are wholly present at every moment. The boy at seventeen is literally the same substance as the man at the altar. But then there's *perdurantism*. That view says we are like space-time worms. We have temporal parts. The seventeen-year-old [Groom] is just an early slice of the worm, and the man standing here today is a later slice. They aren't strictly identical. They're just connected stages of one long event.

  I mention this because [Groomsman's Name], who is finishing his PhD in philosophy, is sitting at table four. [Groomsman's Name], I see you nodding. You know exactly where I'm going with this.

  For everyone else: I've been turning that letter over in my head. If the perdurantists are right, the boy who wrote those words and the man standing here aren't the same thing. So, when [Groom] makes his vows today, what is he actually promising? And to whom? Is the groom making a promise on behalf of a boy who doesn't exist anymore?

  It's easy to dodge this with a line like, "People change, but love remains." But that's not true, is it? Love changes too. The love of a seventeen-year-old is not the love of a twenty-eight-year-old. One is a spark; the other is a hearth.

  So here is what I think is happening today.

  If we are just a series of temporal stages, then marriage isn't just a promise about the future. It is the act of binding those stages together. It is the glue that makes the worm coherent.

  For [Groom] and [Fiancée], that ten-year break wasn't a mistake. It was necessary data. They needed to become different people to verify that they still chose each other. The promise in the letter at seventeen was a promise of *constancy*. "I will never change." We know that failed.

  But the promise today is much stronger. It is a promise of *narrative*.

  [Groom], you aren't promising [Fiancée] that you will remain the boy who wrote that letter. You are promising her that every future stage of your life—every temporal part of the worm, from today forward—will prioritize her happiness. You are promising that when you change, and you will, you will change in a way that includes her.

  And [Fiancée], you aren't marrying the memory of the boy who loved you at fifteen. You are marrying the man who remembered that love, left it alone to grow up, and came back to claim it when he was strong enough to keep it.

  So, to answer the question that I know [Groomsman's Name] is silently screaming at me: The promise is valid. Not because the person is the same, but because the *commitment* creates the continuity. Identity isn't just something you have; it's something you build. And starting today, you build it together.

  [Groom], I'm proud of the man you've become. I'm proud that you learned that a promise isn't about freezing time, but about navigating it.

  If everyone could please raise a glass.

  To [Groom] and [Fiancée]. May your past be a foundation, your present be a choice, and your future be one long, continuous story written by both of you.

  To the bride and groom.
