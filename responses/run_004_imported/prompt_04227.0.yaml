answer: |-
  This is actually one of the most fascinating and tragic stories in the history of philosophy. Your teacher is absolutely right: Sidgwick's obsession with psychical research wasn't a mid-life crisis or a random hobby. It was a desperate, decades-long attempt to solve a catastrophic flaw he found in his own ethical system.

  Here is the actual chain of reasoning, broken down step-by-step, connecting the "Dualism of Practical Reason" to séances and telepathy.

  ### 1. The Problem: The Dualism of Practical Reason
  In his masterpiece, *The Methods of Ethics* (1874), Sidgwick tries to figure out what reason tells us to do. He identifies two main methods that seem perfectly rational:

  *   **Rational Egoism:** Reason tells me to maximize my own happiness. (It is rational to look out for #1).
  *   **Rational Utilitarianism:** Reason tells me to maximize the general happiness. (It is rational to do the greatest good for the greatest number).

  **The Conflict:** In a perfect world, these two would always align. But in the real world, they often clash. Sometimes, doing the "moral" thing (Utilitarianism) requires a massive sacrifice of my own happiness (Egoism).
  *   *Example:* I could keep a lost wallet full of cash. That maximizes *my* happiness (Egoism). Returning it maximizes *general* welfare (Utilitarianism).

  **The Crisis:** Sidgwick concluded that if there is no way to reconcile these two, then **Reason is divided against itself.** If Reason tells me to be selfish *and* selfless at the same time, then ethics is fundamentally irrational. This terrified Sidgwick. He called it the "fundamental contradiction" of ethics.

  ### 2. The Theoretical Solution: Cosmic Justice
  Sidgwick realized there was only one way to make Egoism and Utilitarianism compatible: **You need a system where being moral *always* pays off for the individual in the long run.**

  If I know for a fact that sacrificing my happiness now will result in *greater* happiness for me later, then Self-Interest and Duty are the same thing.

  Historically, religion provided this via **God and the Afterlife**:
  *   If you do your duty (Utilitarianism), God rewards you in Heaven.
  *   If you are selfish and immoral (Egoism), God punishes you in Hell.
  *   Therefore, the most "selfish" thing to do is to be moral.

  ### 3. The Empirical Problem
  Here is where Sidgwick gets stuck. He was a rigorous empiricist and an agnostic. He couldn't just *assume* God exists or that there is an afterlife. That would be faith, not philosophy.

  For his ethical system to hold up, the existence of a moral order (God/Afterlife) needed to be treated as a **fact**, not a hope. He needed empirical evidence that consciousness survives death and that the universe is morally governed.

  ### 4. Enter the Society for Psychical Research (SPR)
  This is why Sidgwick became the first president of the SPR in 1882.

  He didn't join to chase spooky ghosts for fun. He joined because he thought **psychical research was a science that could provide the missing evidence.**
  *   **Telepathy/Mediumship:** If these phenomena were real, they would prove that human consciousness can operate independently of the physical brain.
  *   **Survival:** If consciousness operates without the brain, it can survive the death of the brain.
  *   **Divine Justice:** If we survive death, it becomes scientifically plausible that there is a post-mortem state where moral accounts are settled (rewards/punishments).

  ### 5. The Logical Chain
  So, the chain of reasoning your teacher mentioned looks like this:

  1.  **Ethical Goal:** Reconcile Egoism and Utilitarianism so Reason isn't contradictory.
  2.  **Requirement:** Prove that Virtue leads to Happiness (for the agent) in the long run.
  3.  **Mechanism:** This requires an Afterlife with Divine Justice.
  4.  **Epistemological Hurdle:** We cannot assume the Afterlife exists on faith; we need empirical proof.
  5.  **Scientific Method:** Investigate psychical phenomena (mediums, telepathy) as data points for the survival of consciousness.
  6.  **Conclusion:** If Psychical Research proves survival $\rightarrow$ Divine Justice is plausible $\rightarrow$ Ethics is rational $\rightarrow$ **The Dualism is solved.**

  ### The Tragic Ending
  The tragic part of the story is that **Sidgwick never found the proof.**

  He spent decades investigating mediums, often catching them in fraud, but hoping to find one genuine case. He wanted science to save morality. In the end, he remained agnostic. In his final years, he admitted that the "Dualism of Practical Reason" remained unresolved.

  He famously wrote that if he couldn't prove that the universe was morally governed, he couldn't shake off the feeling that his ethical life was built on a foundation of sand.

  ### Summary for your Extra Credit
  Sidgwick wasn't having a "wild 180." He was trying to use **metaphysics to save ethics.** He believed that without empirical proof of an afterlife, there is no rational reason for a smart person to be moral when being immoral would make them happier. Psychical research was his attempt to turn "Hope for Heaven" into "Scientific Fact" so that Utilitarianism and Egoism could finally shake hands.
