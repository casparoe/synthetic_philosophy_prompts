prompt: |-
  hey so for my free will and moral responsibility seminar we just read Strawson's "Impossibility of Moral Responsibility" and I dont get why its treated as this huge separate argument from regular hard determinism. He's got this whole regress thing about how you'd have to have already chosen the principles you use to choose your own character, but isnt that just determinism doing the work again -- our characters are fixed by genes + upbringing before we're even born, so we never chose them, so we're not responsible, which seems like the same conclusion as the consequence-argument stuff we did with van Inwagen. Is Strawson's Basic Argument actually adding something new here, or is it basically just a wordier version of "determinism rules out responsibility"?
