      *   **The Big Reveal:** The crucial difference is that Strawson's argument doesn't need determinism to be true. It works in an indeterministic universe too.
      *   **Explain Hard Determinism (van Inwagen):** Relies on the past + laws of nature $\rightarrow$ future. If determinism is false, this argument fails.
      *   **Explain Strawson's Basic Argument:** Relies on the logic of self-creation. Even if you have random free will, you didn't choose the mental structure that makes the choice.
      *   **The "Causa Sui" Point:** This is the philosophical heart. You can't create yourself from nothing.
      *   **Why it Matters:** It closes the "libertarian escape hatch." Hard determinism leaves room for libertarians; Strawson says "nope, impossible for anyone."
      *   **Summary/Analogy:** Use an analogy to make it stick.

