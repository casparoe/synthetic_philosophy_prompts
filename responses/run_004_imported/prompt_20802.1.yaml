answer: |-
  First, welcome to the other side. Eight months is still very fresh in the timeline of deconversion. What you are experiencing—often called "moral vertigo"—is one of the most common and disorienting parts of leaving high-control or evangelical faith. When the cosmic scoreboard is removed, it feels like the game might not matter anymore.

  Your friend is right about George Eliot (Mary Ann Evans). She is essentially the patron saint of the Victorian secular conversion. But your skepticism about her position is also philosophically sound. You are asking the exact question that Friedrich Nietzsche would ask a generation later: *If you kill God, do you not also kill the basis for the morality He commanded?*

  Here is the breakdown of what Feuerbach actually argued, how Eliot adapted it, and whether "Duty" without God is a coherent philosophical position or just emotional residue.

  ### 1. Feuerbach's Move: From Projection to Reclamation
  To understand why Eliot thought duty survived, we have to look at Ludwig Feuerbach's *The Essence of Christianity* (1841).

  **The Argument:** Feuerbach argued that theology is actually **anthropology**. Humans take their own best qualities (love, wisdom, justice, reason), magnify them to infinity, project them onto an external screen called "God," and then worship them.
  **The Problem:** This creates "alienation." By giving our best qualities to God, we impoverish ourselves. We think *God* is good, rather than recognizing that *humanity* is the source of goodness.
  **The Solution:** We must reclaim those projections. We shouldn't love God so we can love humans; we should love humans directly.

  **So, why does Duty bind?**
  For Feuerbach, morality doesn't come from a commander; it comes from **interdependence**. He argued that humans are "species-beings" (*Gattungswesen*). We are fundamentally social creatures. My consciousness depends on you recognizing me. Therefore, ethics is not about obeying a sky-hook; it is about recognizing the reality of the other person.
  *   **Metaphysical Bindingness:** "Do this because God says so."
  *   **Feuerbachian Bindingness:** "Do this because hurting you damages the human community of which I am a part, and thus damages my own humanity."

  For Feuerbach, the "ought" is grounded in biology and sociology, not metaphysics. It binds because we cannot actually survive or flourish in isolation.

  ### 2. George Eliot's Adaptation: The Religion of Humanity
  Eliot translated Feuerbach, but she was more morally stern than he was. Feuerbach was big on *love*; Eliot was big on *Duty* (often capitalized in her letters).

  She agreed that God was a projection, but she believed the *feeling* of reverence was too valuable to discard. She wanted to keep the emotional intensity of Christianity without the dogma. This is where your suspicion comes in: **Is this just Christianity with the serial numbers filed off?**

  Eliot's argument for the "absolute" nature of Duty relied on three pillars:

  1.  **The Inescapable Web:** In her novel *Middlemarch*, she writes about the "roar which lies on the other side of silence." She viewed society as an intricate web. You cannot pull a thread without vibrating the whole web. Duty is absolute because consequences are real. You can't pray away the pain you cause a neighbor.
  2.  **Internal Integrity:** For Eliot, the "judgment" wasn't external (Hell); it was internal. To act selfishly was to degrade your own character. The "bindingness" comes from the desire to be a coherent, integrated self. If you value honesty, lying binds you in knots of cognitive dissonance.
  3.  **The Successor to Salvation:** She believed that working for the good of humanity was the only true "immortality." You live on in the effects of your actions. Therefore, Duty is the mechanism by which you achieve meaning.

  ### 3. The "Leftover Feeling" Critique
  You asked: *Is she just running on leftover Christian feeling with new vocabulary stapled onto it?*

  Philosophically, **yes and no.**

  **The "Yes":**
  Friedrich Nietzsche (who came shortly after Eliot) argued exactly what you are suggesting. He claimed that secular humanists like Eliot were living off the "capital" of Christian morality. He argued that Christian morality (self-sacrifice, duty to the weak, absolute truth-telling) was specifically designed by Christian theology. If you remove the theology, the morality eventually loses its power. He called secular moralists "inherited Christians."
  From this view, Eliot's "absolute Duty" *was* a ghost. She was feeling the gravitational pull of a sun that had already died.

  **The "No":**
  However, modern evolutionary ethics and game theory suggest morality predates Christianity.
  *   **Evolutionary Biology:** Altruism and reciprocity are survival strategies for social mammals. We have hardwired empathy (mirror neurons).
  *   **Social Contract:** We agree to rules because life without them is "nasty, brutish, and short" (Hobbes).
  *   **Human Flourishing:** Secular ethics often shifts the goal from "Obedience" to "Flourishing."

  So, while Eliot's *language* was heavily Christian (she couldn't help it; it was her cultural air), the *structure* of her morality was grounded in human reality.

  ### 4. How Duty Stands Without God (For You)
  If Feuerbach and Eliot demoted God to a projection, what holds Duty up? It changes from **Command** to **Commitment.**

  In evangelicalism, morality is often **Heteronomous** (law comes from outside).
  In secular humanism, morality becomes **Autonomous** (law comes from inside).

  Here is how the "bindingness" works in this new framework:

  1.  **The Bindingness of Empathy:** When you see someone suffer, and you have the power to stop it, the "duty" arises from your own capacity to feel their pain. It binds you because you are wired to resonate with them. Ignoring it requires you to suppress your own humanity.
  2.  **The Bindingness of Identity:** In Christianity, you are good because you are saved. In secularism, you are good because you *choose* to be. The "absolute" nature of duty comes from your commitment to your own integrity. If you say "I value truth," then lying isn't just a rule break; it's a betrayal of who you decided to be.
  3.  **The Bindingness of Consequence:** In the evangelical model, the ultimate consequence is metaphysical (Heaven/Hell). In the secular model, the consequence is immanent (Trust broken, relationships damaged, society degraded). These consequences are often more immediate and tangible than divine judgment.

  ### Summary
  Eliot wasn't necessarily being inconsistent; she was transitioning the source of authority.
  *   **Old Source:** Divine Command (Obey because God exists).
  *   **New Source:** Human Necessity (Obey because we need each other to flourish).

  Is it possible she was running on leftover fumes? Probably. It is very hard to fully exit the moral architecture of your upbringing. But that doesn't mean the morality is false; it just means the *motivation* is shifting.

  **For your own journey:**
  You don't need to find a new "absolute" to replace God immediately. Many deconverts try to find a new rigid system to replace the old one to stop the anxiety.
  *   **Feuerbach's advice:** Look at the human in front of you. The "duty" is in their eyes, not in the sky.
  *   **Eliot's advice:** Your life is a ripple in a pond. You can't control the whole ocean, but you are responsible for the ripple you make.

  The bindingness of morality doesn't vanish when God vanishes; it just relocates from the cosmos to the community. It is lighter in one sense (no eternal damnation), but heavier in another (you are fully responsible, with no one to forgive the debt but the people you hurt). That weight is what Eliot called "Duty."
