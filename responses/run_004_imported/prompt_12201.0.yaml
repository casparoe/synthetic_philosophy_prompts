  8.  **Self-Correction/Review during drafting:**
      *   *Wait, did the prompt ask about Hobbes?* No. The student introduced it. Is that okay? Yes, usually extra credit/synthesis is good, but if it's wrong, it's risky.
      *   *Is the Thrasymachus comparison wrong?* Not "wrong," but debatable. In an intro class, recognizing the structural similarity (power dictates justice) is usually the learning objective. The metaphysical difference (does true justice exist?) might be above the pay grade, but since the TA is asking, I should highlight it.
