      6.  Conclusion.

      *Let's write it.*
answer: |-
  Here is the hard line: **Leibniz is a Counterpart Theorist.**

  If you force him into the modern ring, he stands with David Lewis on the question of transworld identity, even though he stands against Lewis on the nature of possible worlds. Leibniz's metaphysical machinery—specifically the union of the Complete Concept Doctrine and the Identity of Indiscernibles (PII)—makes genuine transworld identity logically impossible. The "Vague Adam" isn't a loophole to save transworld identity; it is his explicit admission that strict identity cannot survive a change in predicates.

  Here is the defense of that reading, using only Leibniz's own equipment.

  ### 1. The Metaphysical Hammer: Complete Concept + PII
  The core of Leibniz's system is that an individual substance is defined by its **complete concept**. This concept contains *every* predicate true of that individual, past, present, and future. As he tells Arnauld, the concept of Alexander the Great contains his birth, his battles, his death, and every specific detail of his life.

  Now apply the **Principle of the Identity of Indiscernibles (PII)**. For Leibniz, two things are numerically identical if and only if they share all the same properties. Conversely, if they differ in *any* property, they are numerically distinct individuals.

  *   **Actual Adam:** Concept includes {created by God, placed in Eden, **sinned**, expelled...}.
  *   **Possible Adam:** Concept includes {created by God, placed in Eden, **did not sin**, remained...}.

  Because the predicate "sinned" is in the complete concept of Actual Adam but not in the complete concept of Possible Adam, the two concepts are discernible. By PII, they must be distinct individuals. Therefore, the Adam who sins and the Adam who does not sin are **not the same guy**. They are two different individual concepts.

  This is the definition of Counterpart Theory. Individuals are "world-bound" (or in Leibniz's case, "world-indexed" within the Divine Intellect). You cannot take *this* Adam and plop him into a world where he doesn't sin, because *this* Adam is defined by the fact that he *does* sin. To change the property is to change the individual.

  ### 2. The "Vague Adam" is the Counterpart Relation
  You mentioned the "Vague Adam" move as evidence that he might be hedging. I argue it is the smoking gun that proves he is a counterpart theorist.

  In his correspondence with Arnauld, Leibniz distinguishes between:
  1.  **Adam as an individual substance:** The specific, complete concept chosen by God for actualization.
  2.  **Adam as a vague notion:** A general description (e.g., "the first man," "father of mankind") that picks out a role rather than a specific haecceity.

  When Leibniz says, "If Adam had not sinned," he is technically speaking loosely. Strictly speaking, *Actual Adam* could not have not sinned. What Leibniz means is: "In another possible world, there exists a counterpart individual who satisfies the *vague notion* of 'Adam' (first man, etc.) but possesses a different complete concept regarding sin."

  This maps perfectly onto Lewis. When we say "Humphrey could have won," Lewis says we aren't talking about Humphrey himself (who is world-bound and lost); we are talking about a counterpart who resembles Humphrey and won. When Leibniz says "Adam could have not sinned," he means there is a counterpart concept in God's intellect that resembles Actual Adam (shares the "vague" properties) but differs in the specific predicate of sinning.

  Leibniz introduces the "Vague Adam" precisely because he knows the "Complete Concept Adam" cannot cross worlds. If he believed in transworld identity, he wouldn't need the vague/particular distinction to make sense of modal claims.

  ### 3. Why It Looks Like Kripke (The Theological Mask)
  So why does it feel like he's arguing for transworld identity? Because Leibniz is a theologian first and a logician second.

  Kripke wants transworld identity to preserve our intuitions about reference and possibility. Leibniz wants something similar to preserve **moral responsibility**. If the guy in the other world who doesn't sin is a *different person* than the guy here who did sin, then Actual Adam can't really be blamed. It would be like blaming me because my twin brother committed a crime.

  Leibniz tries to paper this over by saying that God chooses the *whole world* at once. Actual Adam is responsible because his concept *includes* the decision to sin, and God actualized that concept. But when discussing *possibility* ("could have done otherwise"), Leibniz is forced into the counterpart corner. He wants to have his cake (Adam is responsible for his specific actions) and eat it too (Adam could have been different).

  He masks the Counterpart Theory because admitting that "Adam" is just a label for a cluster of properties that could be instantiated by different individual concepts undermines the notion of a persistent soul. But metaphysically, the logic holds: **No property change without identity change.**

  ### 4. Is It Coherent?
  Is he playing both sides? **Yes, pragmatically, but no, metaphysically.**

  His position is coherent *if* you accept his conceptualist ontology. For Lewis, worlds are concrete; for Leibniz, they are ideas in God's mind.
  *   **Lewis:** Concrete Humphrey (World A) vs. Concrete Counterpart (World B).
  *   **Leibniz:** Concept Adam (World A) vs. Concept Adam* (World B).

  In both cases, the entity in World A is not numerically identical to the entity in World B. Leibniz is coherent because he treats individuals as **concepts**. If you treat individuals as concepts, then a concept with a different predicate is literally a different concept. There is no mystery here.

  The incoherence only arises if you try to force a "substance" view (where Adam is a bare particular that *has* properties) onto Leibniz. But Leibniz rejects bare particulars. For him, *esse est concipi* (to be is to be conceived) in the divine mind. Therefore, a change in the conception is a change in the being.

  ### The Verdict
  If you pin Leibniz down:
  1.  **On Ontology:** He is not a Lewisian Realist (worlds are ideas, not concrete).
  2.  **On Identity:** He is a **Counterpart Theorist**.

  He cannot be a Transworld Identity theorist without abandoning the Complete Concept Doctrine and the Identity of Indiscernibles, which are the load-bearing walls of his entire system. The "Vague Adam" is his way of explaining how we *talk* about possibilities (via similarity relations) without violating the logical rule that *this* Adam is essentially the Adam who sinned.

  Your friend is right: This is a rerun of Leibniz. But the winner of that round isn't Kripke; it's Lewis. Leibniz invented Counterpart Theory in 1686 to save the Principle of Sufficient Reason, then tried to hide it behind theological language so he wouldn't get burned for determinism.
