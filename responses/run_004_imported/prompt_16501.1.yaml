answer: |-
  You are definitely not overthinking this, and your friend is only half-right. In fact, you have stumbled onto one of the most famous problems in the history of philosophy and logic.

  Your friend is looking at this from a **physical** perspective (the atoms in the universe didn't change). But you are looking at this from a **cognitive and linguistic** perspective (how we process information and meaning).

  Here is why your brain did a double-take, why those two sentences have different "truth values," and why philosophers have been arguing about exactly this for over a century.

  ### 1. The Philosophy: Frege's Puzzle
  In 1892, a German philosopher named Gottlob Frege wrote a paper trying to solve exactly what you are experiencing. He used the example of the "Morning Star" and the "Evening Star."

  *   For centuries, people thought the Morning Star and the Evening Star were two different objects.
  *   Astronomers eventually proved they are the same object (the planet Venus).
  *   **The Puzzle:** If "Morning Star = Venus" and "Evening Star = Venus," then "Morning Star = Evening Star." So, why does learning that fact feel like *new information*? If they are the same thing, shouldn't saying "The Morning Star is the Evening Star" be as obvious as saying "Venus is Venus"?

  Frege realized that names have two parts:
  1.  **Reference (Bedeutung):** The actual object in the world (Venus / Maddie).
  2.  **Sense (Sinn):** The "mode of presentation," or how we think about that object (The bright thing in the morning / The chill confessions admin).

  Your friend is arguing about the **Reference**. Yes, the physical human is the same.
  You are arguing about the **Sense**. The *way* you access that human is completely different.

  ### 2. Why the Sentences Feel Different (Intensional Contexts)
  You hit on the key distinction with the word **"seems."**

  In logic, there is a rule called the *Substitutivity of Identicals*. It says if A = B, you can swap them in any sentence without changing the truth.
  *   *True:* The Admin is Maddie.
  *   *True:* The Admin posts at 10 PM.
  *   *Therefore True:* Maddie posts at 10 PM.

  This works for physical facts. But it breaks when you use words like **believes, knows, thinks,** or **seems.** These create what philosophers call **Intensional Contexts** (or opaque contexts).

  *   **Sentence A:** "The Admin seems unbothered."
      *   This is **True**. You are evaluating the *persona* presented on the screen.
  *   **Sentence B:** "Maddie seems unbothered."
      *   This is **False**. You are evaluating the *biological human* in chem class.

  Even though Admin = Maddie, the *concept* of "The Admin" and the *concept* of "Maddie" live in different folders in your brain. When you say "The Admin," you are referring to a curated digital character. When you say "Maddie," you are referring to a messy human.

  So, you aren't lying in either sentence. You are just referencing two different *concepts* that happen to point to the same *person*.

  ### 3. Was it "New Information"?
  Your friend says: "Nothing in the world changed, only what you knew."
  You say: "It felt like new info."

  In **Epistemic Logic** (the logic of knowledge), you are right.
  Imagine your brain has two files:
  *   **File A:** [Label: Confessions Admin] [Traits: Chill, Anonymous, Wise]
  *   **File B:** [Label: Maddie] [Traits: Anxious, Chem Class, Messy]

  For a year, those files were separate. Learning the leak didn't change the world, but it **merged the files.** That is a cognitive event. The information "File A = File B" is distinct from the information inside the files.

  So, while the *fact* was always true, the *connection* was new to you. That is why it felt like a plot twist. It was an update to your internal map of reality, even if reality itself didn't shift.

  ### The Verdict
  Your friend is right that the **ontology** (the state of existence) didn't change. Maddie was always the admin.
  But you are right that the **epistemology** (the state of knowledge) and the **semantics** (the meaning of the words) did change.

  It is not a nothing-burger. You are experiencing the difference between **extension** (the thing itself) and **intension** (the description of the thing).

  Next time your friend says you're being dumb, tell them: *"I'm not confusing the reference with the sense. Just because Admin equals Maddie extensionally doesn't mean they are substitutable in an intensional context regarding perceived demeanor."*

  (Or, you know, just tell them your brain has two different folders for them and the merge caused a glitch.)
