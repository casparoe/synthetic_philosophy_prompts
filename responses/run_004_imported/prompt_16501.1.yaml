      *   **Explain the Concept (Sense vs. Reference):**
          *   *Reference:* The actual person (Maddie).
          *   *Sense:* The mode of presentation (The "Chill Admin" vs. "Anxious Maddie").
          *   Explain that identity (Admin = Maddie) doesn't mean the *meanings* of the names are the same.
      *   **Address the "Truth Value" Issue:**
          *   Why "The admin seems unbothered" feels true: It refers to the *persona* (the sense).
          *   Why "Maddie seems unbothered" feels false: It refers to the *human* (the reference + real-world observations).
          *   This is an *intensional context*. Substitution of identicals fails here.
      *   **Address the Friend's Point:**
