answer: |-
  You have stumbled onto one of the most famous problems in modern philosophy and psychology. What you are describing is almost a textbook example of a phenomenon known as **The Knobe Effect** (or the **Side-Effect Effect**).

  Discovered by philosopher Joshua Knobe in 2003, this effect demonstrates that people's judgment of whether an action was done "intentionally" depends heavily on whether the side effect is morally good or morally bad.

  Here is the breakdown of why your club reacted this way, why it feels "off" to you, and whether there is actually a principled difference between the two presidents.

  ### 1. The Psychological Asymmetry (The Knobe Effect)
  In Knobe's original experiment, he presented people with two scenarios involving a CEO launching a new program.
  *   **Harm Condition:** The CEO says, "I don't care at all about harming the environment, I just want to make a profit." The program harms the environment.
  *   **Help Condition:** The CEO says, "I don't care at all about helping the environment, I just want to make a profit." The program helps the environment.

  When asked if the CEO harmed the environment *on purpose*, the vast majority said **yes**.
  When asked if the helped the environment *on purpose*, the vast majority said **no**.

  This matches your club's reaction perfectly.
  *   **This Year (Harm):** The president foresaw the cancellation of outreach, didn't care, and proceeded. The club labels this **"on purpose."**
  *   **Last Year (Help):** The president foresaw the possibility of shirts, didn't care, and proceeded. The club labels this **"a coincidence."**

  Psychologically, we are wired to assign **agency to blame** more readily than we assign **agency to credit**. When something bad happens, we look for a villain who "meant" for it to happen (or at least accepted it). When something good happens, we are more willing to attribute it to luck or circumstance, perhaps to avoid inflating the ego of the leader, or simply because moral praise requires a higher bar of benevolence than moral blame requires of negligence.

  So, to answer your friend's debate: **Yes, a huge part of this is outcome bias.** If the drivetrain rebuild had failed and cost them the match, the club might have viewed the cancellation of outreach as "reckless" rather than "on purpose." If the shirts hadn't materialized last year, no one would be talking about it at all.

  ### 2. The Structural Difference (A Principled Defense)
  However, as the secretary with detailed notes, you might be spotting a structural nuance that goes beyond pure psychology. There is a slight logical difference in how the two outcomes were causally linked to the decisions.

  **Case A (Outreach): The Outcome was *Necessary*.**
  When the president spent the money on the drivetrain, the cancellation of outreach was an **inevitable mathematical certainty**.
  *   Action: Spend \$X on Drivetrain.
  *   Result: Budget = \$0.
  *   Consequence: Outreach *cannot* happen.
  By choosing the drivetrain, she actively removed the *possibility* of outreach. In philosophy, this is often called "knowingly bringing about a state of affairs." She pulled a lever that she knew would crush the outreach program.

  **Case B (Shirts): The Outcome was *Contingent*.**
  When the president spent the money on the display, the shirts were **possible but not guaranteed**.
  *   Action: Spend \$Y on Display.
  *   Result: Budget = \$Z (Enough for shirts).
  *   Consequence: Shirts *could* happen.
  Buying the display did not *force* the shirts to exist. It merely left the funds available. Someone (perhaps the treasurer, or the president in a separate motion) still had to decide to allocate that remaining \$Z to shirts rather than saving it or spending it on pizza. The president's statement ("I don't care about the shirts") suggests he viewed them as a residual option, not a guaranteed consequence of his specific purchase.

  **The Distinction:**
  *   President A **precluded** a good thing to get her goal.
  *   President B **allowed** a good thing to remain possible while getting his goal.

  This provides a *small* principled reason to treat them differently. President A's action was the direct cause of the loss. President B's action was merely a condition that allowed the gain.

  ### 3. Loss Aversion and Status Quo
  There is a third factor at play: **Loss Aversion.** Humans feel the pain of a loss about twice as intensely as the pleasure of an equivalent gain.

  *   **This Year:** The club *lost* a tradition (Outreach). This triggers a defensive emotional response. When we feel a loss, we scan for responsibility. Saying she did it "on purpose" validates the anger. It transforms a tragedy into a betrayal, which is emotionally easier to process than "our leader made a cold calculation that didn't even pay off."
  *   **Last Year:** The club *gained* shirts on top of the status quo. This triggers a reward response. We don't need to find a villain or a hero; we can just enjoy the "nice coincidence." Attributing it to luck keeps the social dynamic low-stakes.

  ### The Verdict
  You asked: *"Is there a real difference between them, or were we all just letting how we felt about the outcome decide what we were willing to call intentional?"*

  The answer is **mostly the latter, but with a footnote.**

  1.  **The "On Purpose" Claim:** Philosophically, neither president intended the side effect as a *goal*. Both explicitly stated indifference. However, President A *intended the action that necessitated the harm*, whereas President B *intended the action that permitted the benefit*.
  2.  **The Fairness:** The club's reaction is psychologically normal (The Knobe Effect) but logically inconsistent. If "I don't care about X" absolves you of intent when X is good, it should absolve you when X is bad. If foreseeing X makes you responsible when X is bad, it should make you responsible when X is good.

  **Advice for the Secretary:**
  You are right to feel that the asymmetry is unfair. It suggests your club holds leaders to a higher standard for preventing harm than they do for creating benefit.
  *   **For your records:** Continue to note the explicit statements of intent ("I don't care about..."). This creates an objective historical record that counters the subjective memory of the club, which will eventually rewrite history to make President A seem more malicious and President B more benevolent than they actually were.
  *   **For the debate:** You can tell your friend that while there is a technical difference in *causality* (necessity vs. possibility), the *moral weight* the club is assigning is driven by the outcome, not the intent.

  The club is treating "intentionality" not as a description of the president's mind, but as a verdict on the president's character. That is human nature, but as the keeper of the minutes, you are the only one ensuring the actual truth survives the story.
