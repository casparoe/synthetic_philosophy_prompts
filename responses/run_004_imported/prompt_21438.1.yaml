      *   **Hierarchy:** Clarify the hierarchy. Architecture (lowest) -> ... -> Poetry/Tragedy (high) -> Music (highest/metaphysical).
      *   **Character Implication:** This is *great* news for the user's character. An aging composer obsessed with Schopenhauer wouldn't be depressed about music's status; he would be arrogant, ecstatic, or burdened by the belief that he is channeling the fundamental force of the universe.

