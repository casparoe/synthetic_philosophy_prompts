prompt: |-
  I sit on the five-person board of a small enterprise-software company (about 40 employees) that's been locked in a patent dispute with a much larger competitor for the past fourteen months. We sued them for infringing a scheduling-algorithm patent core to our product; they countersued seeking to invalidate the patent for prior art, and what began as a straightforward cease-and-desist has turned into full discovery and motion practice. Our legal budget started at $150,000 and we're now past $900,000, authorized through four separate board votes, each one justified at the time partly on the grounds that backing out then would have meant losing everything spent so far for nothing. Last week a magistrate judge issued a preliminary claim-construction ruling mostly in our favor, and our lawyers immediately came back with an estimate that another $350,000 gets us through trial with "meaningfully improved odds." The competitor, rather than settling, brought in a second outside firm and made clear they intend to contest this all the way through appeal.

  I've spent enough time on LessWrong and adjacent blogs to recognize the shape of this. It has the structural signature of Shubik's dollar auction, where continuing to bid can look locally rational for whichever party is currently behind even though the collective outcome ends up worse than if neither side had bid at all, layered on top of the more familiar organizational-psychology story of escalation of commitment (the Staw "Knee-Deep in the Big Muddy" research on why decision-makers keep re-funding a failing course of action partly to justify the choices that got them there). Two of my fellow board members want to settle now and absorb the loss; two want to approve the next tranche, partly because the claim-construction ruling seems like genuine new information rather than just another rung on an escalating bid, and partly because they suspect folding now, after four rounds of escalation, would simply hand the competitor a costless win. That leaves me as the swing vote, and I need to bring a written recommendation to our emergency board meeting this Friday.

  Could you draft that memo for me? I'd like it to do more than repeat the standard "ignore sunk costs" advice: it should state plainly where our situation actually does and doesn't match the dollar-auction/escalation-of-commitment pattern, given that we may genuinely have new information and not merely an escalating bid; it should close with a specific recommendation attached to a hard budget ceiling or some other pre-committed stopping rule, so we're not right back here after the next filing; and it should take the strongest version of my colleagues' argument for continuing seriously before explaining why it does or doesn't survive scrutiny.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** 5-person board of a small enterprise-software company (40 employees).
      *   **Situation:** 14-month patent dispute with a larger competitor. Sued them; they countersued.
      *   **Financials:** Budget started at $150k, now past $900k (4 board votes). New request: $350k to trial.
      *   **Legal Status:** Magistrate judge claim-construction ruling mostly in favor of the company. Competitor brought in a second firm, intending to fight through appeal.
      *   **Board Dynamics:** 2 want to settle (absorb loss), 2 want to continue (new info + don't want to hand competitor a win). User is the swing vote.
      *   **Intellectual Framework:** User recognizes Shubik's Dollar Auction and Staw's Escalation of Commitment.
      *   **Requirements for the Memo:**
          *   Don't just say "ignore sunk costs."
          *   Analyze where the situation *does* and *doesn't* match the Dollar Auction/Escalation patterns (specifically addressing the "new information" aspect).
          *   Steelman the argument for continuing (colleagues' view) before critiquing it.
          *   Provide a specific recommendation with a hard budget ceiling or pre-committed stopping rule.
          *   Tone: Professional, analytical, decisive, suitable for a board memo.

  2.  **Deconstruct the Intellectual Framework:**
      *   *Sunk Cost Fallacy:* Money spent ($900k) is gone. Decision must be based on future value vs. future cost.
      *   *Dollar Auction:* Bidding > value of prize because you don't want to lose the bid already placed. Risk: Both parties spend > prize value.
      *   *Escalation of Commitment:* Psychological need to justify past decisions.
      *   *The Twist:* The claim-construction ruling *is* new information. In a pure dollar auction, the value of the prize is fixed. Here, the *probability of winning* has changed. This makes it a real options problem, not just a psychological trap.
      *   *The Counter-Twist:* The competitor's move (second firm, appeal threat) increases the cost and duration, potentially negating the value of the win even if successful.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Board Memo format.
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context:** Briefly recap the financial and legal status.
      *   **Analysis of Decision Traps (The "LessWrong" angle):**
          *   Acknowledge the Sunk Cost/Dollar Auction risk.
          *   Differentiate: The Markman ruling *is* material new info. It changes the probability distribution. It's not *purely* irrational escalation.
          *   However, the competitor's response signals a "war of attrition" strategy.
      *   **Steelmanning the "Continue" Argument:**
          *   Why do the 2 board members want to continue?
          *   1. Validity strengthened (Markman ruling).
          *   2. Strategic deterrence (don't look weak).
          *   3. Potential damages/licensing revenue could exceed costs.
          *   4. $900k wasted if we stop now. (Address this carefully).
      *   **Critique/Scrutiny:**
          *   Even with better odds, is the *Expected Value (EV)* positive?
          *   Competitor's deep pockets vs. our cash burn.
          *   Distraction to the 40-person team.
          *   Appeal risk (winning trial $\neq$ ending the dispute).
      *   **Recommendation & Mechanism:**
          *   Need a middle path or a hard stop.
          *   Option A: Settle now (Too defeatist given the ruling?).
          *   Option B: Fight to trial (Too open-ended?).
          *   Option C: Conditional Authorization. Approve the $350k *but* with strict milestones and a hard cap. Or, authorize preparation but mandate settlement mediation at a specific trigger.
          *   *Decision:* The prompt asks for a "hard budget ceiling or some other pre-committed stopping rule."
          *   *Refined Recommendation:* Authorize a limited tranche to leverage the ruling for settlement, not necessarily full trial. Or, authorize trial prep but cap total spend at $X, with a mandatory review.
          *   *Better approach for a swing vote:* Propose a "Settlement Leverage" strategy. Use the ruling to force a deal. If they won't deal, fight *only* if the cost doesn't exceed $X.
          *   *Actually, looking at the numbers:* $900k spent. $350k more to trial. Total $1.25M. If we win, what do we get? Injunction? Damages? If the competitor can just design around or appeal for 2 years, the NPV of the win drops.
          *   *The "Pre-commitment" aspect:* This is crucial. We need to stop the "next $350k" loop.
          *   *Proposal:* Authorize the $350k *only* if coupled with a mandatory settlement conference post-ruling and a hard cap on *total* litigation spend (e.g., $1.4M total). If settlement isn't reached by [Date], we walk/settle for costs covered.
          *   *Wait, a stronger stopping rule:* "Authorize $350k for trial prep, but mandate that we enter mediation immediately following the ruling. If no settlement > $X is on the table by [Date], we cease active prosecution and seek a nominal settlement."
          *   *Let's go with a "Litigation Budget Cap" + "Settlement Mandate".*

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't sound like I'm just lecturing on behavioral economics. The board cares about fiduciary duty.
      *   *Focus:* Fiduciary duty requires maximizing expected value, not avoiding psychological traps.
      *   *The "New Info" nuance:* The Markman ruling increases $P(Win)$. But the Competitor's escalation increases $Cost(Trial + Appeal)$. The net EV might still be negative.
      *   *The "Handing them a win" argument:* This is reputation. Does losing a patent suit hurt recruitment/sales more than burning $1.2M cash? For a 40-person co, $1.2M is huge. Reputation risk is real but hard to quantify.
      *   *The Recommendation:* I need to be the tie-breaker. I should lean towards *cautious continuation with a hard stop*, or *aggressive settlement leveraging the ruling*. Given the "Dollar Auction" fear, the safest fiduciary move is usually to cap the downside.
      *   *Decision:* Recommend approving the tranche *conditionally*. We use the ruling to settle. If they won't settle, we have a hard cap. This satisfies the "fight" crowd (we aren't folding immediately) and the "settle" crowd (we aren't writing blank checks).

  5.  **Final Polish:**
      *   Ensure the tone is objective.
      *   Check that all constraints from the prompt are met (Steelman, Sunk Cost nuance, Pre-commitment).
      *   Make sure the "Dollar Auction" analysis is precise (it's not a pure auction because the asset value changed, but the dynamic is similar).

  6.  **Writing the Memo:** (Mental Outline)
      *   To/From/Date/Subject.
      *   Recommendation: Conditional Approval.
      *   Situation Summary.
      *   Behavioral & Economic Analysis (The core request).
      *   Steelman of Continuation.
      *   Risk Assessment (The Counter).
      *   The Mechanism (The Cap/Stop).
      *   Next Steps.

  7.  **Review against constraints:**
      *   *Draft memo?* Yes.
      *   *More than "ignore sunk costs"?* Yes, will discuss EV and new info.
      *   *Match/No-match Dollar Auction?* Yes, will distinguish probability shift vs. bid escalation.
      *   *Hard budget ceiling/stopping rule?* Yes, will implement a "Total Litigation Cap" and "Mediation Trigger."
      *   *Steelman colleagues' argument?* Yes, dedicated section.

  8.  *(Self-Correction on the "Swing Vote" aspect)*: As the swing vote, I need to bring the sides together. A flat "Stop" alienates the 2 fighters. A flat "Go" alienates the 2 settlers. A "Go with a Leash" is the compromise. I will structure the recommendation to authorize the spend *primarily as leverage for settlement*, with a hard exit if settlement fails.

  9.  *(Final check on numbers)*: $900k sunk. $350k requested. Total $1.25M. For a 40-person company, this is likely a significant portion of runway or profit. This adds urgency to the cap.

  10. *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Litigation Strategy and Budget Authorization

  ### Executive Summary

  We are at a critical inflection point in the [Competitor] patent dispute. While the recent claim-construction ruling improves our legal position, the competitor's escalation signals a war of attrition that threatens to exceed the economic value of the patent itself.

  It is my recommendation that we **authorize the requested $350,000 tranche conditionally**, subject to a **Hard Total Litigation Cap of $1.4 Million** and a **Mandatory Settlement Trigger**. We will use the favorable ruling to force a settlement conference immediately. If a settlement exceeding our litigation costs is not secured within 90 days, we are to cease active prosecution and seek a nominal resolution. This approach leverages our new legal advantage without exposing the company to an open-ended dollar auction.

  ### 1. Context and Financial Exposure

  *   **Spend to Date:** $900,000 (across four authorizations).
  *   **New Request:** $350,000 (to trial).
  *   **Projected Total:** $1.25 Million (excluding appeal costs).
  *   **Company Context:** 40 employees. This spend represents a material percentage of our annual operating budget.
  *   **Current Status:** Magistrate claim-construction ruling mostly in our favor; Competitor has retained additional counsel and signaled intent to appeal regardless of trial outcome.

  ### 2. Analysis of Decision Traps: Dollar Auction vs. Real Options

  In preparing for this vote, I evaluated our position against two behavioral economic frameworks: the **Sunk Cost Fallacy/Escalation of Commitment** and **Shubik's Dollar Auction**. It is vital we distinguish where these models apply and where they do not.

  **Where the Models Apply (The Risk):**
  Structurally, we are in a Dollar Auction. In this game, the highest bidder wins the prize, but *both* parties pay their bids. When bids exceed the prize value, rational actors continue bidding to minimize losses rather than maximize gains. Our previous four board votes fit the "Escalation of Commitment" pattern: justifying new spend to validate past spend ("we can't lose the $900k already invested"). If we authorize this $350k simply to avoid realizing the loss of the $900k, we are acting irrationally.

  **Where the Models Do Not Apply (The Nuance):**
  A pure Dollar Auction assumes the value of the prize is fixed and known. Our situation differs because the Magistrate's ruling constitutes **material new information**. It has altered the probability distribution of the outcome. In financial terms, this is not merely throwing good money after bad; it is purchasing a "real option" on a now-more-valuable asset. The probability of invalidation has dropped; the probability of infringement finding has risen. Therefore, a blanket refusal to spend more based solely on "sunk costs" is also fiduciary negligence.

  **The Verdict:**
  We are justified in spending more *only if* the Expected Value (EV) of the trial remains positive after accounting for the competitor's new strategy. The competitor's retention of a second firm and threat of appeal increases the *cost* to win and delays the *realization* of value. This compresses the EV. We must not treat the $350k as a ticket to trial, but as leverage to settle.

  ### 3. Steelman: The Case for Continuing

  The argument for approving the tranche without restriction rests on three strong pillars, which I have evaluated seriously:

  1.  **Validated Asset Value:** The claim-construction ruling suggests the patent is robust. If we settle now, we may be selling a validated asset at a discount before its value is fully realized in court.
  2.  **Strategic Deterrence:** Folding now, after four rounds of funding, signals weakness to the market and other potential infringers. It hands the competitor a "costless win" in the sense that they successfully drained our cash reserves without paying damages.
  3.  **Positive Expected Value:** If the odds of winning at trial have shifted from <40% to >60%, and the damages/injunction value exceeds $2M, the math supports continuing. The $900k sunk cost is irrelevant; the question is whether the *next* $350k yields a return.

  ### 4. Scrutiny: Why the "Continue" Argument Fails Without Guards

  While the above logic holds in a vacuum, it fails to account for the competitor's specific counter-move and our organizational constraints.

  *   **The "Appeal Threat" Nullifies the Trial Win:** The competitor has explicitly stated they will appeal. A trial win does not end the dispute; it merely changes the venue to the Federal Circuit. This adds 18–24 months and an additional estimated $500k+ in costs. The Net Present Value (NPV) of a win drops significantly when realized 3 years from now rather than 1.
  *   **Asymmetric Pain:** For a large competitor, $1.5M is a line-item expense. For a 40-person company, this is existential capital. They can out-bid us in the Dollar Auction simply because they have deeper pockets, regardless of the merit.
  *   **Opportunity Cost:** The management distraction of trial prep and testimony over the next 6 months will impact product velocity. The "cost" of this litigation is not just legal fees; it is stalled growth.

  ### 5. Recommendation: Conditional Authorization with Pre-Commitment

  To resolve the deadlock, we must avoid the binary choice of "Settle Now" vs. "Fight to the End." I propose a third path that utilizes the new legal leverage while imposing a strict stopping rule to prevent further escalation of commitment.

  **I move we approve the $350,000 budget request subject to the following Binding Conditions:**

  1.  **Hard Total Cap:** Total litigation spend (including the $900k already spent) shall not exceed **$1.4 Million**. This leaves a $500k buffer for post-trial motions or initial appeal steps, but no further.
  2.  **Mandatory Mediation Trigger:** Counsel is instructed to file a motion for a settlement conference immediately, citing the recent ruling. We must enter mediation within 45 days.
  3.  **The "Walk-Away" Rule:** If a settlement agreement is not reached within 90 days of this vote, OR if the settlement offer is less than $1.5M (net of fees), we are authorized to cease active prosecution and accept a non-monetary settlement (e.g., cross-license or mutual dismissal) to cap losses.
  4.  **No Appeal Authorization:** This budget does not authorize an appeal by us. If we win at trial and they appeal, we must re-evaluate based on the specific grounds of their appeal, but the presumption is to settle the judgment rather than litigate further.

  ### 6. Rationale for This Structure

  This recommendation satisfies the concerns of both factions while protecting the company:

  *   **For the "Continue" Faction:** We are not folding. We are funding the path to trial and using the favorable ruling to press for a win. We maintain the threat of trial to drive settlement value.
  *   **For the "Settle" Faction:** We have installed a circuit breaker. We will not enter an open-ended Dollar Auction. The Hard Cap ensures that even if we lose, the loss is bounded and known today.
  *   **For the Company:** It converts the litigation from a "quest for victory" into a "procurement process." We are buying a resolution, not a verdict. If the market price (settlement) exceeds our cap, we walk away.

  ### 7. Conclusion

  We are currently in a classic escalation trap, but one where we hold a stronger hand than we did three months ago. The fiduciary duty is to monetize that stronger hand, not to gamble it on a trial that the competitor is prepared to drag out for years.

  By pre-committing to a stopping rule, we remove the emotional burden from future board votes. We will not be asked to vote on this again unless the opponent agrees to settle within our bounds. I urge the board to adopt this conditional authorization.

  **Action Required:** Vote to approve Budget Tranche 5 ($350k) subject to the Binding Conditions outlined in Section 5.
