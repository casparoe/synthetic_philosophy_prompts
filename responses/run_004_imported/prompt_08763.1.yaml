      *(Refining the NMA question)*: Ensure it captures the specific tension that the NMA *uses* IBE to defend the reliability of IBE (or the realism that depends on it).

      *(Refining the Loveliness question)*: Ensure it captures the anthropocentric worry (beauty is in the eye of the beholder).

      Let's assemble the list.

