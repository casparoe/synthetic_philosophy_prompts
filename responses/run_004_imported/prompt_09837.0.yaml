  3.  **Address Question 1: Diagnosing the Gap:**

      *   *Did he underestimate positional goods?* Yes, but he acknowledged them. He thought absolute needs would be solved enough that relative needs wouldn't drive *everyone* to work 40+ hours. He might argue we got sidetracked by consumerism masquerading as absolute need.
