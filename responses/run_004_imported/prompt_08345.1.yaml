prompt: |-
  I help run a tiny EA-adjacent grants program (low six figures a year, mostly individual researcher/project grants) and there's a live fight on the committee that I got voluntold to write up before our meeting next week. Right now 3 of us score every application 1-10 independently and average it. One member wants to expand to panels of ~10 reviewers per grant, citing the Condorcet jury theorem -- his pitch is that as long as each reviewer is just a little better than a coinflip, the math guarantees the aggregate gets more accurate as you add reviewers, basically for free. Another member is sure this is wrong for our situation but cant articulate why beyond 'our reviewers aren't independent, they all read the same forum posts and end up with the same priors.' Can you draft the actual decision memo -- keep the panel at 3, go big, or some other design entirely -- that steelmans the Condorcet argument properly but is honest about exactly where and why it'd break down for a setup like ours. Want it to end with a real recommendation and a rough plan for phasing it in, not just 'it's complicated.'
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** A tiny EA-adjacent grants program (low six figures/year, individual researcher/project grants).
      *   **Problem:** A live fight on the committee about reviewer panel size.
      *   **Current State:** 3 reviewers per application, score 1-10, average.
      *   **Proposal:** Expand to ~10 reviewers per grant.
      *   **Argument For:** Condorcet Jury Theorem (CJT) – if reviewers are $>50\%$ accurate, more reviewers = better aggregate accuracy.
      *   **Argument Against:** Reviewers aren't independent (shared priors, same forum posts).
      *   **Task:** Draft a decision memo.
      *   **Requirements:**
          *   Steelman the Condorcet argument.
          *   Honestly explain where/why it breaks down in this specific context.
          *   End with a *real* recommendation (keep at 3, go big, or other) and a phasing plan.
          *   Tone: Professional, analytical, decisive (it's a memo for a meeting).

  2.  **Deconstruct the Arguments:**

      *   **Condorcet Jury Theorem (CJT):**
          *   *Premise 1:* Voters/Reviewers are competent ($p > 0.5$).
          *   *Premise 2:* Voters/Reviewers are independent.
          *   *Conclusion:* As $n \to \infty$, probability of correct majority decision $\to 1$.
          *   *Steelman:* It's mathematically sound *if* assumptions hold. It reduces noise. It mitigates individual bias/outliers. 10 reviewers catch things 3 might miss.

      *   **The Breakdown (Why it fails here):**
          *   *Independence:* EA community is small. Reviewers read the same blogs (LessWrong, EA Forum), know the same people, share the same ideological priors. This creates *correlated error*. If the "common prior" is wrong, 10 people will be wrong together.
          *   *Competence:* Is $p > 0.5$? For "low six figures" grants, are we picking the top 1% of projects? Or just "good" projects? Defining "correct" is hard in grants (counterfactual impact is unknowable ex-ante).
          *   *Cost/Logistics:* 10 reviewers $\times$ many apps = huge time burden. Reviewer quality might drop due to fatigue.
          *   *Diminishing Returns:* Going from 1 to 3 helps a lot. 3 to 10 helps less, especially with correlated error.

      *   **The "Tiny Program" Constraint:**
          *   Low six figures (say \$200k-\$900k).
          *   If avg grant is \$50k, that's 4-18 grants/year.
          *   If avg grant is \$10k, that's 20-90 grants/year.
          *   Let's assume ~20-50 serious applications.
          *   10 reviewers per app = 200-500 reviews.
          *   If reviewers volunteer (common in EA), this is a huge ask.
          *   If reviewers are paid, it eats into the grant budget.

  3.  **Determine the Recommendation:**
      *   *Option A (Status Quo - 3):* Safe, but maybe misses nuance.
      *   *Option B (Go Big - 10):* Too expensive, violates independence assumption, logistical nightmare for a tiny program.
      *   *Option C (Hybrid/Adaptive):* Keep 3 for most, use 10 (or a larger pool) only for "borderline" or "high stakes" grants. Or, improve the *quality* of the 3 rather than the *quantity*.
      *   *Decision:* The math doesn't support 10 reviewers given the correlation and cost. The recommendation should be to **stick with 3 but improve the process**, perhaps with a "tiered" approach for exceptional cases. Actually, for a *tiny* program, 10 reviewers is overkill. The best value add is usually better calibration among fewer reviewers.
      *   *Refined Decision:* Recommend staying at 3 for standard grants, but implement a "calibration" mechanism. Maybe expand to 5 *only* for final round/funding threshold decisions. But the prompt asks to "keep the panel at 3, go big, or some other design entirely."
      *   *Strongest Position:* The independence violation is fatal to the CJT argument in this specific context. The cost/benefit is poor. Recommendation: **Stay at 3, but change *how* they score.** (e.g., calibration sessions, structured rubrics). However, to compromise with the "more eyes" proponent, maybe suggest a **pool system** where 3 are assigned, but a larger pool is available for consultation.
      *   *Wait, let's look at the "Tiny" aspect again.* Low six figures. If we spend too much on ops, it hurts. 10 reviewers is definitely too many.
      *   *Recommendation:* **Modified Status Quo (3 Reviewers) + Calibration.** I need to acknowledge the "10 reviewers" idea has merit in theory but fails in practice here. I will recommend staying at 3 but adding a specific mitigation for the "correlated error" risk (e.g., diverse reviewer assignment).

      *   *Actually, a "Two-Stage" design is often better for grants.*
          *   Stage 1: 3 reviewers (triage).
          *   Stage 2: For grants near the funding cutoff, add 2 more reviewers (total 5).
          *   This addresses the "marginal value of information" without the full cost of 10.
      *   *Let's go with a Tiered Approach.* It acknowledges the CJT logic (more data helps) but respects the constraints (independence, cost).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** The bottom line up front. (Recommendation: Tiered review, not flat 10).
      *   **Background:** Current process vs. Proposal.
      *   **Analysis of Condorcet Jury Theorem (CJT):**
          *   Explain it well (Steelman).
          *   Explain the assumptions (Competence, Independence).
      *   **Application to Our Context (The Breakdown):**
          *   Independence violation (EA echo chamber).
          *   Competence ambiguity (What is "correct"?).
          *   Operational cost (Reviewer fatigue).
      *   **Recommendation:** Tiered system (3 for most, 5 for borderline/high-impact).
      *   **Implementation Plan:** Phasing.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Avoid saying "Member X is wrong." Say "The assumption of independence is likely violated."
      *   Focus on *impact per dollar* and *decision quality*.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 5 enough? The proponent wants 10.
      *   *Response:* 10 is logistically impossible for a tiny program without paying reviewers significantly. 5 is a compromise that captures *some* CJT benefit without the correlation/cost cliff.
      *   *Critique:* Did I steelman CJT enough?
      *   *Response:* Need to explicitly state that *if* reviewers were independent, 10 would be vastly superior. The failure is empirical, not theoretical.
      *   *Critique:* Is the recommendation actionable?
      *   *Response:* Yes, define the tiers clearly.

  7.  **Final Polish:** Check word count, clarity, and ensure the "phasing in" part is concrete. (Make sure to mention *how* to select the additional reviewers to maximize independence).

      *(Self-Correction on "Independence"):* The prompt mentions "same forum posts." I should suggest mitigating this by selecting reviewers from outside the immediate EA bubble if possible, or at least ensuring diverse epistemic backgrounds.

      *(Final Decision on Recommendation):* I will recommend **keeping the core panel at 3** but introducing a **"Marginal Grant" protocol** where applications near the funding threshold get 2 additional reviewers (total 5). This captures the marginal value of information without the massive overhead of 10. It directly addresses the "correlated error" risk by limiting the expansion to cases where it matters most.

      *Wait, one more thought:* The prompt asks for "keep the panel at 3, go big, or some other design entirely."
      I think "Some other design" (Tiered) is the most responsible answer for a grants program. But I need to make sure I don't waffle. I will recommend the Tiered Design.

      *Let's write it.*

      *Structure:*
      1.  To/From/Date/Subject.
      2.  Recommendation (The "Ask").
      3.  The Core Dispute (CJT vs. Reality).
      4.  Why CJT Fails Here (Independence & Competence).
      5.  The Proposed Solution (Tiered Review).
      6.  Implementation Plan.

      *Key phrase to include:* "Correlated Error."
      *Key concept:* "Marginal Value of Information."

      *Let's ensure the steelman is strong:* "In a vacuum, Member A is mathematically correct."
      *Let's ensure the rebuttal is strong:* "Our vacuum is not empty; it is filled with shared priors."

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name/Program Manager]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Reviewer Panel Size & Process Design

  ### 1. Executive Summary & Recommendation

  After analyzing the proposal to expand reviewer panels from 3 to ~10 members, **I recommend we reject a flat expansion to 10 reviewers.** Instead, we will adopt a **Tiered Review Design**: standard applications retain 3 reviewers, while "marginal" applications (those near the funding cutoff) or "high-stakes" applications (top 10% of ask size) will trigger an automatic expansion to 5 reviewers.

  This approach captures the marginal value of additional data points where they matter most, without incurring the logistical costs or the epistemic risks of correlated error inherent in a 10-reviewer model for a program of our size.

  ### 2. The Core Dispute: Condorcet vs. Context

  The proposal to expand to 10 reviewers relies on the **Condorcet Jury Theorem (CJT)**. To make the best decision, we must steelman this argument before identifying its failure points in our specific context.

  **The Steelman (Why 10 reviewers *should* work):**
  The CJT proves that if a group votes on a binary decision (Fund/Reject), and two conditions are met, the probability of a correct majority decision approaches 100% as the group size increases:
  1.  **Competence:** Each voter is more likely to be right than wrong ($p > 0.5$).
  2.  **Independence:** Each voter's decision is statistically independent of the others.

  Under these conditions, Member A is mathematically correct: moving from 3 to 10 reviewers drastically reduces the impact of outliers, fatigue, or individual blind spots. In a theoretical vacuum, 10 reviewers is strictly superior to 3.

  **The Breakdown (Why it fails for us):**
  Member B is correct that our environment violates the CJT assumptions. Specifically, we face **Correlated Error**.

  *   **Violation of Independence:** Our reviewer pool is drawn from a small, epistemically tight-knit community (EA-adjacent). Reviewers read the same forums (LessWrong, EA Forum), attend the same conferences, and share similar priors on cause prioritization. If there is a systemic bias in the community (e.g., overvaluing quantifiable metrics over qualitative movement building), 3 reviewers might miss it, but 10 reviewers will likely *all* miss it in the same direction. Adding more reviewers amplifies the consensus, not the accuracy.
  *   **Violation of Competence ($p > 0.5$):** CJT requires reviewers to be better than a coinflip at predicting *counterfactual impact*. In global development or AI safety, ex-ante prediction is notoriously difficult. If our average reviewer accuracy is only 55%, you need massive N to get significance. If it dips below 50% (due to shared bias), adding reviewers makes the decision *worse*.
  *   **Operational Drag:** For a low-six-figure program, our biggest constraint is not decision accuracy, but **reviewer quality**. Asking 10 volunteers to deeply review an application dilutes attention. A tired reviewer of 10 grants is less competent ($p$ drops) than a focused reviewer of 3. CJT assumes constant competence; ours would likely degrade.

  ### 3. Proposed Design: Tiered Review Protocol

  We should optimize for the **Marginal Value of Information (MVOI)**. The first 3 reviews provide 80% of the signal. Reviews 4 through 10 provide diminishing returns, especially given the correlation risk.

  **The Protocol:**
  1.  **Standard Tier (3 Reviewers):** Applies to ~80% of applications (clear rejects and clear top-tier accepts).
      *   *Process:* Independent scoring 1-10. Average > 8 or < 4 triggers automatic decision.
  2.  **Marginal Tier (5 Reviewers):** Applies to applications scoring between 4.0 and 8.0.
      *   *Rationale:* This is where decision error is most costly. These are the grants where an extra 2 data points can break a tie or reveal nuance.
      *   *Selection:* The additional 2 reviewers must be selected specifically to **maximize epistemic diversity** (e.g., one from outside our immediate geographic/ideological cluster) to mitigate correlated error.
  3.  **No "Flat 10":** We will not move to a flat 10-reviewer model. The cost in volunteer time and the risk of amplifying community-wide priors outweighs the theoretical statistical benefit.

  ### 4. Implementation Plan

  We will phase this in over the next two grant cycles to monitor workload and decision quality.

  **Phase 1: Calibration (Next Cycle)**
  *   **Action:** Maintain 3 reviewers for all grants.
  *   **New Requirement:** Implement a "Pre-Mortem" step. Before scoring, reviewers must briefly list *one* reason why their initial impression might be wrong. This forces cognitive independence and mitigates shared priors without adding headcount.
  *   **Metric:** Track score variance. If variance is low (<1.0 point spread) across the board, it confirms high correlation, validating the move away from 10 reviewers.

  **Phase 2: Tiered Rollout (Cycle +2)**
  *   **Action:** Activate the Marginal Tier (3 $\to$ 5 reviewers) for borderline applications.
  *   **Recruitment:** Onboard 5 additional "reserve" reviewers specifically for their divergent backgrounds (e.g., industry practitioners rather than pure researchers).
  *   **Review:** At the end of Cycle +2, compare the success rate of Tier 2 grants against Tier 1. If Tier 2 grants underperform, we revert to 3 across the board.

  ### 5. Conclusion

  The Condorcet Jury Theorem is a powerful tool, but it is not a magic wand. It cannot correct for shared delusions or correlated biases. For a program of our size, the optimal strategy is not "more reviewers," but "smarter reviewer allocation."

  By reserving additional reviewer capacity for marginal decisions and actively selecting for epistemic diversity, we improve decision accuracy where it counts without bloating our operational overhead.

  **Decision Required:** Approval to proceed with Phase 1 (Calibration) immediately and budget allocation for Phase 2 (Reserve Reviewer stipends).
