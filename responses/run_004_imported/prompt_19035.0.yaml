      *   *Money as a Ticket:* Money is a symbol or counter to facilitate industry and exchange. It represents a claim on labor or goods.
      *   *Circulation is Key:* Wealth is created by activity/industry. Money must move. Hoarding (gold in vaults) kills the economy. Velocity of money matters.
      *   *Role of the State/National Bank:* He advocated for a national bank in Ireland to issue credit. This implies trust in a central authority or a collective agreement to maintain the value of the "ticket."
