      *   *Authority/Trust:* Berkeley supported a *National* Bank. He believed in a centralized authority to manage the supply for the public good. Bitcoin is decentralized, algorithmic, and lacks a central steward aiming for public welfare. *Major Point against Crypto.*
      *   *Intrinsic Value vs. Perception:* Berkeley would agree value is perceived, but he ties that perception to *state backing* or *national credit*, not speculative market sentiment.

  4.  **Analyze Stablecoins through Berkeley's Lens:**
