answer: |-
  Friends, family, colleagues, and members of the community my father loved so dearly.

  My father gave me a specific instruction before he died. He asked that in speaking about him, and about his death, I not offer you comforts he spent his life arguing were untrue. He asked that I not tell you this was God's plan. He asked that I not suggest God stood by with the power to cure and simply chose not to use it. And he asked that I not imply that a rescue was available, but withheld for a higher purpose.

  To violate those instructions would be to dishonor the integrity he held for twenty-five years of ministry. He was a process theologian. For those unfamiliar with the term, it means he believed that God's power is not the power of a dictator, but the power of a lover.

  In the traditional view, God is the only true cause, and we are the effects. In my father's view, God creates a world of genuine freedom—not just for humans, but for every living cell, every molecule, every moment of existence. Because this freedom is real, it cannot be overridden. God cannot unilaterally stop a virus any more than God can force a human to be kind. Coercion is metaphysically impossible for a God whose nature is persuasive love.

  So, why did God not save him? The hard, honest answer my father lived with is this: God *sought* to save him. At every moment of his illness, God was presenting his body with the optimal possibility for healing, luring every cell toward wholeness. But the universe is a web of relationships, and sometimes the decisions of other entities—cancer cells, genetic mutations, environmental factors—conspire against life. God did not choose this. God suffered it.

  I know this is a harder comfort than the idea of a divine plan. A plan implies control. A plan implies that if we just zoom out, this tragedy makes sense. My father's theology offers no such zoom lens. It asks us to stare into the chaos and believe that God is right there in it with us, feeling every pang of pain, weeping with every tear, powerless to stop it by force, but endlessly present to endure it with us.

  But if this is the hard truth, there is also a profound hope hidden within it.

  If God is not a distant ruler, but the "fellow sufferer who understands," then my father was never alone. Not for a single second of those twenty-five years of ministry, and not for a single second of his illness. He was enveloped by a Presence that felt his joy as its own joy, and felt his pain as its own pain. In this view, death does not isolate us; it is the final moment of a life that God has fully experienced and fully known.

  And this leads to where I find the thread we can hold on to. My father believed in what he called "objective immortality." He taught that nothing of value is ever simply lost. When a life ends, it does not vanish into nothingness. It vanishes into *God*.

  Every sermon he preached, every hand he shook, every moment he comforted a grieving family, every struggle he had with his own faith—all of it is taken up everlastingly into the divine life. God remembers. God preserves. In the memory of God, my father is not gone. He is a permanent fact of the universe, woven into the very fabric of God's own experience. He is safe there, not because God protected him from death, but because God holds him in life.

  So, how do we go forward? If God cannot coerce the world into goodness, then God must rely on us. The divine power works through persuasion, and we are the agents of that persuasion. The comfort we offer one another, the medical care we provide, the love we show the grieving—this is how God works in the world now.

  My father's ministry was an invitation to join God in this work. To lure the world, moment by moment, toward beauty and healing, knowing we cannot force it, but trusting that our efforts are never lost.

  He is not resting in God's control. He is resting in God's memory. And he is living on in our hands. Let us be the hands that do what he believed God does: offer love, without coercion, to a world that needs it.

  Amen.
