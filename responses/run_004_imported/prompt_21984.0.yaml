answer: |-
  **Setting:** *A cluttered garage workshop, late evening. On a workbench sits a steel box containing a Geiger counter coupled to a vial of cyanide. A quantum source—polarized photons passing through a beam splitter—triggers the mechanism. The transmission coefficient is set to $10^{-9}$. Two figures stand over it: ELIAS and SARAH. Both are retired experimentalists, decades of collaboration behind them, now spent debating interpretation.*

  **Elias:** (Hand hovering over the manual override) It's coherent, Sarah. The wavefunction never collapses. In the branch where the photon transmits, the vial stays sealed. In that branch, I open my eyes. I check the log. I see the data. From the inside, the probability of survival is one.

  **Sarah:** From the inside of *that* branch, yes. But you are standing *here*, in the pre-measurement macro-state. You are asking if it is rational to initiate a process where the Born weight of your continued existence is one part in a billion.

  **Elias:** Rationality is about maximizing expected utility. If I am dead, I have no utility function. I am not there to regret the decision. If I am alive, I am there to confirm the theory. Since I can only evaluate outcomes I experience, and I only experience the survival branch, the expected utility of pulling the lever is positive. The death branch is irrelevant to me. It's a null set from the first-person perspective.

  **Sarah:** That's the Quantum Immortality claim, Elias. And it's a category error. You're conflating *conditional probability* with *decision weight*. Yes, $P(\text{Experience} | \text{Alive}) = 1$. But that doesn't mean $P(\text{Alive})$ is irrelevant to decision making. David Lewis put it best: if you play Russian roulette with a quantum gun, you shouldn't comfort your family by saying, "Don't worry, in the branches where I die, I'm not there to be sad, and in the branches where I live, I'm fine."

  **Elias:** Why not? It's the truth. They *will* find a version of me who is fine. The version of me who is dead isn't a "me" anymore. It's a corpse. A collection of particles that no longer supports the computational state of Elias. Why should I care about the arrangement of my atoms in a branch where the computation stops?

  **Sarah:** Because you should care about the *measure* of the future selves that inherit your projects. Look, we spent thirty years measuring cross-sections. We know the Born rule isn't just a count of branches; it's a measure of existence, or at least of "caring weight." If you smash this box, 99.9999999% of the measure of your future history is extinguished. You are effectively burning 99.9999999% of your assets to buy a lottery ticket that pays out only in a world where you're the only one who can cash it.

  **Elias:** But "assets" implies something I can hold. I can't hold the dead branch. You're asking me to care about ghosts.

  **Sarah:** I'm asking you to care about *people*. Specifically, the people who love you. In the high-weight branches, your wife wakes up tomorrow a widow. In the low-weight branch, she wakes up to a husband who gambled with his life on a philosophical whim. Does her grief in the high-weight branches count for nothing because *you* won't experience it?

  **Elias:** (Pauses, hand withdrawing slightly) That's the altruistic objection. I grant that. If I do this for *her*, it's irrational. But the thought experiment specifies self-concern. If I were alone in the universe, Sarah, would it be reckless?

  **Sarah:** Yes. Because "you" are not a point particle. You are a distribution. When you pull that lever, you aren't moving *yourself* into the survival branch. You are creating a successor in the survival branch and a successor in the death branch.

  **Elias:** The successor in the survival branch is causally continuous with me. He has my memories. He has my scars. He remembers standing here, five seconds ago, hesitating. He *is* me.

  **Sarah:** And the corpse is also causally continuous with you. It has the same DNA, the same scars up until the moment of release. Why does the continuity of consciousness grant exclusive rights to the title "Elias"?

  **Elias:** Because consciousness is the locus of value. Without the light on, the machine is just metal. If I go to sleep under anesthesia, I am causally continuous with the man who wakes up. If I die, I am not. The survivor wakes up. The other one doesn't wake up anywhere.

  **Sarah:** But here is the rub, Elias. Suppose we tweak the machine. Instead of killing you instantly, it disintegrates 99% of your body mass in the "death" branch, but reconstructs a functioning you in the "survival" branch using the remaining 1%. Is that you?

  **Elias:** If the brain state is preserved, yes. Teletransportation paradoxes aside.

  **Sarah:** Now suppose the "death" branch doesn't kill you. It just lobotomizes you. Erases your memory of this conversation. The "survival" branch keeps you intact. The measure is still 99% to the lobotomy, 1% to survival. By your logic, you should be indifferent. You'll only experience the survival branch.

  **Elias:** I should prefer the survival branch, obviously.

  **Sarah:** Why? Because you value the cognitive capacity. You value the *quality* of the future self. But if you value quality, you must admit of degrees. If you can value a lobotomized self less than an intact self, why can you not value a low-measure self less than a high-measure self? Measure is just another dimension of existence. To ignore it is to say that existing "a little bit" is worth the same as existing "a lot," provided you're looking from the inside.

  **Elias:** (Turns to the device) "Existing a little bit." That's the phrase that sticks. In Everett, all branches are equally real. The amplitude squared is just a label.

  **Sarah:** Is it? If amplitude squared is just a label, why do we observe frequencies that track it? Why does the rational agent bet according to it? David Wallace and others have derived the Born rule from decision-theoretic axioms. If you deviate from it—if you act as if all branches have equal weight regardless of amplitude—you become a money pump. You'll accept bets that guarantee a loss across the multiverse measure.

  **Elias:** But I'm not betting across the multiverse. I'm betting on my stream of consciousness.

  **Sarah:** And that stream is a fiction of the branch. There is no global "stream." There is just the wavefunction evolving. When you say "I will experience survival," you are privileging a specific thread in the weave. But the weave has thickness. The thread you are privileging is vanishingly thin.

  **Elias:** Thinness doesn't negate presence. A razor wire is thin, but it cuts.

  **Sarah:** But if you step on it, you don't say, "Well, the wire exists, so I'm safe." You acknowledge the probability of the cut.

  **Elias:** That's single-world probability. Here, the cut *definitely happens* to a version of me.

  **Sarah:** And the survival *definitely happens* to a version of you. The question is: which version deserves your current concern? You say the survivor. I say the concern should be distributed according to the measure. If you distribute it that way, 99.9999999% of your current concern should be focused on the impending death.

  **Elias:** (Looks at his hands) This brings us to the identity question you raised earlier. You said the survivor might not be "me" in any sense that counts.

  **Sarah:** I said he might not be the *only* one that counts. But consider this: If you pull the lever, the Elias who pulls it ceases to exist in the next moment. He is replaced by two successors. One dead, one alive. The alive one thinks he is the original. But he is a copy who got lucky.

  **Elias:** A copy with perfect continuity.

  **Sarah:** Perfect psychological continuity, yes. But suppose I told you that in the survival branch, the world is slightly different. A different president. A different color on the wall. Would that be you?

  **Elias:** Yes.

  **Sarah:** What if the difference is that in the survival branch, you are the only human alive? A solitary survivor in a decohered bubble. Is that a life worth gambling the current world for?

  **Elias:** You're moving the goalposts. The setup is a clean survival.

  **Sarah:** I'm testing your valuation of the successor. If the successor is "you," then you should care about his total welfare. If his welfare is isolated, desolate, or bought at the cost of immense grief in the high-weight branches, the act is selfish. But more importantly, it relies on a notion of "I" that ignores the cost paid by the other successors.

  **Elias:** They don't pay the cost. They cease to be.

  **Sarah:** They cease to be *conscious*, yes. But the event of their cessation is real. It happens in the wavefunction. You are choosing to actualize a future where the majority of your measure terminates violently.

  **Elias:** (Sighs, steps back from the box) You know, in the lab, we never worried about this. We measured counts. We didn't ask the photons where they thought they were going.

  **Sarah:** Because the photons don't have a first-person perspective. You do. And that perspective is the trap. It convinces you that because you will find yourself in the survival branch, the path to get there doesn't matter. But the path is the measure.

  **Elias:** So, if I don't pull the lever...

  **Sarah:** Then the wavefunction evolves without the branching event. The measure of your future remains concentrated. You stay here. We go have coffee.

  **Elias:** And the version of me who *would* have pulled the lever, and survived?

  **Sarah:** He doesn't exist. Because you didn't pull it.

  **Elias:** But if I *had*... he would be sitting there, drinking coffee, thinking he made the right choice. Thinking he's immortal.

  **Sarah:** He would be sitting there, thinking he got lucky. And he would be right. But he would be a fool who got lucky, not a sage who understood the physics.

  **Elias:** (Pushes the safety catch on the device) It's strange. We agree on the ontology. We agree the wavefunction is all there is. We agree on the unitary evolution.

  **Sarah:** We disagree on the norms of rationality for agents embedded within that wavefunction. I say rationality tracks measure. You say it tracks subjective continuity.

  **Elias:** And the tragedy is, neither of us can prove the other wrong without stepping into the box.

  **Sarah:** And if you step into the box, Elias, you won't be able to tell us the result. Only the fool survives to speak.

  **Elias:** (Turns off the power supply) Then I suppose I'll remain a fool in potential, and a philosopher in actuality. Coffee?

  **Sarah:** Coffee. But let's take the stairs. I'm not testing the quantum elevator.

  **Elias:** (Smiles) Wise. The measure of a good cup of coffee is high enough as it is.
