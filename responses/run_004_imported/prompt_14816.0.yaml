prompt: |-
  I cover science and intellectual history, and I'm working on a piece about Kepler's astrology that I want to push past the glib "even the great astronomer believed in astrology" framing that most popular accounts settle for. My understanding is that Kepler was genuinely scathing about much of the astrological practice of his own day, even as he went on casting horoscopes and issuing yearly prognostications for money, because he thought only a narrow core of the discipline could be defended on the physical and harmonic principles he took seriously in the rest of his work. Give me one concrete example of an astrological technique or prediction he would have defended on those grounds, paired with a superficially similar one that he dismissed as groundless, and explain, in his own theoretical terms rather than a modern debunking, what actually separates the two.
reasoning: |-
