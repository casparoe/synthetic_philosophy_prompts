answer: |-
  This is a crucial distinction for intellectual history, because it reframes Kepler not as a scientist who failed to escape superstition, but as a natural philosopher attempting to purge astrology of what he considered *superstition* to save its *physics*.

  Kepler's guiding metaphor was that astronomy is the "wise mother" and astrology is the "foolish daughter." The daughter is foolish because she is greedy (casting horoscopes for coin) and prone to exaggeration, but she is still the daughter of Astronomy because she draws on the mother's data. Kepler's project in works like *De Fundamentis Astrologiae Certioribus* (1601) and *Harmonices Mundi* (1619) was to discipline the daughter so she spoke the truth.

  Here is the concrete distinction you are looking for, grounded in Kepler's own metaphysics.

  ### The Defended Technique: Planetary Aspects (Specifically the Trine)
  **The Prediction:** A configuration where two planets are separated by 120 degrees of ecliptic longitude will induce specific meteorological changes (e.g., warmth and moisture) which, in turn, alter human humors and predispose populations toward certain temperaments or health outcomes.

  **Kepler's Justification:**
  For Kepler, this was not symbolic; it was **geometric and harmonic**. He argued that the Earth possesses an *Anima Terrae* (a Soul of the Earth), akin to a living organism. This soul perceives the heavens not through eyes, but through an instinctual awareness of **geometric archetypes**.

  When planets form a **Trine** (120°), they create the shape of an equilateral triangle inscribed in the zodiacal circle. To Kepler, this was not arbitrary. In *Harmonices Mundi*, he demonstrates that this angle corresponds to the musical interval of the **major third** (ratio 4:5), one of the consonant intervals of the harmonic scale. Because the universe is constructed on divine geometric principles, the *Anima Terrae* "hears" or "feels" this harmony.

  The mechanism is physical: the planets emit a *species* (a form or ray of light/influence). When these rays strike the Earth at a harmonic angle, they resonate with the Earth's soul, triggering a physical reaction—much like a plucked string causing a sympathetic vibration in another. This reaction manifests primarily as weather (the Earth's "breath"), which then physically alters the balance of humors in living beings. Kepler defended this because it relied on **quantity, geometry, and light**, which were measurable and universal, fitting within his broader project of a mathematical physics.

  ### The Dismissed Technique: Zodiacal Sign Causality
  **The Prediction:** A person born when the Sun is in the constellation of Leo will be brave or kingly, or that the sign of Aries inherently signifies heat and dryness regardless of planetary position.

  **Kepler's Justification:**
  Kepler dismissed this as **arbitrary symbolism without physical cause**. He argued that the constellations are merely human impositions on fixed stars that have no physical connection to one another. The stars in "Leo" are at vastly different distances and do not move as a unit; therefore, they cannot act as a unified physical agent.

  In Kepler's view, assigning qualities like "bravery" to a patch of sky is poetic mythology, not natural philosophy. There is no geometric ratio, no harmonic interval, and no optical mechanism by which the *image* of a Lion could transmit "courage" to a fetus. He wrote scathingly that the signs are merely a "calendar" for measuring planetary motion, not a set of causal agents. To believe the sign itself causes the trait is to confuse the **map for the territory**.

  For Kepler, the only reason the zodiacal *location* mattered was to measure the **angles** (aspects) between the moving planets. The background stars were a static grid, not a battery of influences.

  ### The Theoretical Divide
  The separation between these two techniques rests on Kepler's criterion of **efficient causality via geometry**.

  1.  **Aspects (Accepted):** Rely on **dynamic relations** between moving bodies. The power lies in the *angle*, which is a universal mathematical truth independent of human naming conventions. It fits his Neoplatonic belief that God created the world according to weight, measure, and number.
  2.  **Signs (Rejected):** Rely on **static categorization**. The power is alleged to lie in the *sector* of the sky, which is defined by human tradition and mythological association. It lacks a mechanism of action.

  ### Why This Matters for Your Piece
  This distinction allows you to argue that Kepler was not "believing in astrology" in the sense of accepting the traditional Ptolemaic or Arabic corpus. He was attempting to **naturalize** it. He stripped astrology of its occult sympathies (the Lion makes you brave) and replaced them with what he considered a rigorous physics of light and harmony (the Triangle resonates with the Earth's soul).

  He cast horoscopes for Wallenstein not because he thought the stars *forced* Wallenstein's hand, but because he believed he could read the "weather of the soul"—the natural inclinations and temperamental shifts caused by these harmonic pressures. He maintained human free will (a theological necessity for a Lutheran) but argued that the body and the passions were subject to this celestial meteorology.

  By framing it this way, you show that Kepler's astrology was not a lapse in judgment, but a consistent extension of his astronomy: an attempt to find the physical mechanism by which the geometry of the heavens interacts with the substance of the Earth.
