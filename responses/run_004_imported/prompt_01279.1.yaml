      *   **The Medication Question (Critical):** Under ACC/AHA 2017, Stage 1 HTN + Low ASCVD risk = Lifestyle changes, *not* meds. Meds are for Stage 1 + High ASCVD risk (or Stage 2). The doctor's recommendation to "consider medication" might be premature depending on the user's overall risk profile (age, cholesterol, smoking, diabetes).
