answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two evolutionary biologists, ELENA and MARCUS, are finishing coffee after the seminar.*

  **ELENA:** I have to say, the discussion today was lively. But I'm worried we let Lloyd's conclusion stand a little too unchallenged. Not because she's wrong about the data—she's meticulous—but about the methodological default.

  **MARCUS:** You mean the byproduct hypothesis?

  **ELENA:** Exactly. Treating the "developmental side effect" account as the null hypothesis that stands until an adaptationist story clears an impossibly high bar. It feels like we've swapped one kind of dogma for another.

  **MARCUS:** Is it dogma, or is it parsimony? Look, Gould's point in the *Natural History* column was straightforward. The clitoris and the penis are homologous structures. They arise from the same embryonic tissue. Male orgasm is indispensable for ejaculation; female orgasm is not indispensable for ovulation or conception. If you have a trait that is structurally coupled to a selected trait in the other sex, and it lacks a clear, unique function of its own, the burden of proof sits on the person claiming it was *later* selected for.

  **ELENA:** I grant the homology. I even grant that the *origin* of the capacity is likely a byproduct of male development. But Marcus, origin is not maintenance. Feathers likely originated for thermoregulation or display, not flight. Does that mean we should treat flight as a "spandrel" of insulation? At some point, the architecture was co-opted. The question isn't "Did it start as a side effect?" It's "Has selection since refined it?"

  **MARCUS:** But that's the trap. Once you allow "co-option" or "exaptation" into the mix, the adaptationist has a get-out-of-jail-free card. If the "upsuck" theory fails—and Lloyd showed the data is all over the place—you pivot to "pair-bonding." If the hormonal data doesn't match, you pivot to "mate choice." The claim becomes: "Selection *must* have acted on this because selection acts on everything." That is precisely the Panglossian paradigm Gould and Lewontin warned against.

  **ELENA:** I'm not arguing selection acts on *everything*. I'm arguing that the female orgasm is physiologically complex. It involves specific neural pathways, muscular contractions, neurochemical cascades. To say that *none* of that complexity has been touched by selection since the divergence of the sexes requires its own evidence. Why should shared embryological origin count as evidence *against* later refinement?

  **MARCUS:** Because it explains the presence of the trait without invoking new selective pressures. If I can explain the existence of the clitoris entirely through the selection pressure on the penis, why add a second layer of selection unless I *have* to? It's like the male nipple. We don't hunt for the reproductive advantage of male lactation because the developmental story suffices.

  **ELENA:** But the male nipple is truly vestigial in function. It doesn't do anything. The female orgasm changes state. It fluctuates with cycle, with partner, with context. If it were just inert developmental noise, why does it have such specific triggers? You're treating "byproduct" as a static state, but development isn't static.

  **MARCUS:** Okay, but here is where I need to press you. You're asking for me to accept that selection refined it. But when I ask you for the specific fitness benefit, the evidence is thin. When I point out the thinness, you say, "Maybe we haven't found the right variable yet."

  **ELENA:** I'm saying the absence of evidence isn't evidence of absence.

  **MARCUS:** It is when your hypothesis is structured to be immune to that absence. If every time we fail to find a fitness correlate you posit a new, subtler selective pressure, you are making your theory unfalsifiable. You're saying, "It's an adaptation, even if it looks like a spandrel, because adaptations can look like spandrels."

  **ELENA:** Fair. But turn the mirror around, Marcus. If every time we fail to find a fitness correlate you retreat to "it's just a byproduct," aren't you doing the exact same thing? You're saying, "It's a spandrel, even if it looks functional, because spandrels can look functional."

  **MARCUS:** *[Pauses, swirling his coffee]* Touché.

  **ELENA:** Think about it. The adaptationist is accused of telling just-so stories. But the byproduct theorist is telling a "just-so story" too. It's a story about developmental constraint overriding selective potential. And like the adaptationist story, it's incredibly hard to kill. How would you *disprove* the byproduct hypothesis?

  **MARCUS:** I suppose... if we found a gene specifically regulating female orgasmic latency that was unlinked to male sexual development, and that gene showed a strong signature of recent positive selection in the human lineage.

  **ELENA:** And if we found that, would you concede?

  **MARCUS:** I'd have to. But we haven't. So I stick with the null.

  **ELENA:** But see, that's the irony we danced around in class. Gould wanted to stop biologists from assuming every trait was optimized. He wanted to introduce skepticism. But in making the byproduct account the *default*, he potentially insulated it from the same skepticism. If "developmental side effect" becomes the standard shield against "lack of evidence for function," then the byproduct view becomes just as resistant to falsification as the adaptationist view it critiques.

  **MARCUS:** So we're at a stalemate of unfalsifiability?

  **ELENA:** Not necessarily. We're at a stalemate of *burden*. You place the burden on proving function. I place the burden on proving the *lack* of functional refinement despite the complexity.

  **MARCUS:** But there's a pragmatic difference, Elena. If I assume it's a byproduct, I stop wasting grant money looking for a "sperm upsuck" mechanism that probably doesn't exist. I focus on the developmental genetics. If you assume it's an adaptation, you keep designing behavioral studies to find the fitness payoff.

  **ELENA:** And if it *is* an adaptation—say, for cryptic female choice—and we assume it's a byproduct, we miss a massive piece of human evolutionary psychology. We assume the trait is noise when it's actually signal.

  **MARCUS:** *[Sighs]* I know. That's the risk. But look at the history. How many "functions" have been proposed for the female orgasm? Twenty? Thirty? And Lloyd shoots them down one by one. At what point does the body count matter? If twenty different adaptationist stories fail, does the byproduct hypothesis not gain strength by default?

  **ELENA:** It gains strength as a critique of *those specific stories*. It doesn't necessarily prove the trait is functionless. It proves that *we are bad at guessing functions*.

  **MARCUS:** So your argument is that the failure is methodological, not biological?

  **ELENA:** My argument is that "byproduct" and "adaptation" aren't binary switches. It's a spectrum of constraint versus selection. By treating the byproduct view as the victorious null hypothesis, we might be closing the book on a trait that is still being written. Gould was right to warn against the Panglossian paradigm. But we have to be careful we don't replace it with a "Spandrelian Paradigm" where nothing is allowed to be an adaptation unless it wears a neon sign saying "I was selected."

  **MARCUS:** *[Smiles]* The Spandrelian Paradigm. I can see the paper title now. You know, I think the irony you pointed out is the real takeaway. We're both using methodological shields. I'm using parsimony to protect against storytelling. You're using potential complexity to protect against premature closure.

  **ELENA:** Exactly. So, where does that leave us for next week's reading?

  **MARCUS:** I suppose it leaves us admitting that the data is insufficient to lower either shield. But... I will concede that if you can find me that gene signature unlinked to male development, I'll buy the coffee.

  **ELENA:** And if I find it, you'll admit that homology isn't destiny.

  **MARCUS:** Deal. But until then, I'm sticking with San Marco.

  **ELENA:** And I'll stick with the possibility that the architecture was renovated, even if the foundation is shared.

  **MARCUS:** *[Raises cup]* To unfalsifiable null hypotheses.

  **ELENA:** *[Clinks cup]* May we find a way to break them.
