  My little brother's getting married in three weeks and I'm doing the best man speech (needs to run about five minutes). His fiancée Priya is mid-PhD in behavioral econ and her advisor's coming to the wedding, so that side of the room will catch exactly what im doing, but my side of the family just wants a sweet speech that makes them laugh. Problem is, anyone who's known my brother more than five years knows he's never stuck with anything longer than about four months -- jobs, gym memberships, two previous relationships. I've spent the last year reading way too much about hyperbolic discounting (long story, started over my own money problems), and honestly it explains him -- it's not that he doesn't mean his commitments when he makes them, its that the value of some faraway reward drops off way faster than it should the second a smaller, immediate one gets close, so the preference just flips right when it matters. I don't want to get up there and say "that's just how brains work, not his fault," because it feels like a cop-out, but I also can't pretend he's simply cured now. Can you write the actual speech -- funny, warm, not a roast, works for both sides of that room, and says something honest about why marrying her specifically might be the one commitment that actually holds.
