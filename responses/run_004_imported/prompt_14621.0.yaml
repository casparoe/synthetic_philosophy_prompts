answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Best Man and [Brother's Name]'s older brother. Which basically means I've spent the last thirty years serving as a control group for his life experiments.

  I want to start by thanking Priya's family, and especially her advisor, Dr. [Advisor's Last Name], for being here. I know Priya is deep in her PhD program, and I've been told there are a few behavioral economists in the room. I need you to know that I prepared for this speech. I didn't just Google "wedding jokes." Over the last year, dealing with some of my own… let's call them *liquidity issues*… I fell down a rabbit hole reading about hyperbolic discounting.

  Yes, I know what it is. And yes, Dr. [Advisor's Last Name], I know I'm probably using it slightly out of context, but stay with me.

  For the rest of the family, here's the translation: Hyperbolic discounting is a fancy way of saying that humans are terrible at valuing the future. If I offer you $50 today or $100 in a year, you take the $50. But if I offer you $50 in five years or $100 in six years, you'll wait for the $100. The math doesn't change, but our patience does. The closer the temptation gets, the steeper the value of our long-term goals drops off.

  And if you know my brother, you know his discount curve is… aggressive.

  [Brother's Name], I love you. But we have to acknowledge the data. In the last decade, you have held three jobs, four gym memberships, and two serious relationships. The average lifespan of any commitment you've made is roughly four months. You are a man who loves the *idea* of the future, but you are biologically wired to prioritize the *joy* of the present.

  When you joined that gym in 2019, you genuinely intended to go for five years. On day one, the future version of you—the fit, healthy version—felt real. But by month four, the immediate discomfort of the treadmill outweighed the distant reward of abs. The preference flipped. It's not that you're flaky, and it's not that you're a liar. It's that when the "right now" gets tough, your brain re-evaluates the deal.

  So, a year ago, when he told me he was going to propose, I did what any concerned older brother would do. I ran the numbers. I looked at the trend line. And I was worried. Because marriage is the ultimate long-term asset. It requires weathering boring Tuesdays, stressful months, and years where the "reward" feels very far away.

  But then I watched them together. And I realized why this is different.

  In behavioral economics, you can't just tell someone to "have more willpower." You have to change the incentive structure. You have to make the immediate choice align with the long-term goal.

  And that is what Priya does.

  [Brother's Name], you haven't suddenly developed the ability to suffer through boredom for a future payoff. You haven't been "cured." The reason this commitment will hold is that Priya has changed the daily utility of your life. Being with her isn't a sacrifice you make today for a happy marriage ten years from now. Being with her *today* is better than any alternative available to you *today*.

  She makes the "now" so good that you never want to flip the preference. She is the immediate reward *and* the long-term investment.

  Priya, thank you for hacking his reward system. Thank you for making the commitment feel less like a contract signed in ink and more like a choice you get to make every morning because it's the best option on the table.

  To the rest of us: We know [Brother's Name]. We know he loves the new car smell. But we also know that when he looks at Priya, he doesn't see a distant finish line. He sees the only place he actually wants to be standing right now.

  So, if anyone was betting on the four-month mark… I'm afraid the house has already won.

  Please raise your glasses. To Priya and [Brother's Name]. May your discount rate stay low, your rewards stay high, and may you always choose each other, not just for the future you're building, but for the joy you find in the present.

  To the happy couple!
