          *   *Standard Pump:* If they treat the gap as "indifference" (weak preference), they might trade $A \to B^+$. But if they truly have a *gap*, they might not.
          *   *The "Small Improvement" Argument:* If $A$ and $B$ are gapped, usually $B^+$ (B plus a tiny bit) is strictly preferred to $B$. Does $B^+ \succ A$? If yes, you can pump. If no (still gapped), the pump fails.
