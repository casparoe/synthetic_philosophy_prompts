answer: |-
  It is a genuine pleasure to correspond with someone who knows the difference between a gastrozooid and a dactylozooid. You are absolutely right to be frustrated with the "statue and lump" industry. Artifacts are metaphysically messy because they depend on human intention, which drags in psychology and social ontology when we should be talking about mereology and substance.

  Since you know cnidarians, you know that *Physalia* is a colony, but the metaphysical literature often treats it as a curiosity rather than a central test case. I want to propose an example that is even more disruptive to the standard taxonomy, one that forces the "Life" criterion to do heavy lifting in a way a chair or a statue never could.

  Let's talk about the **Cellular Slime Mold (*Dictyostelium discoideum*)**.

  ### The Case: The Aggregating Amoebae

  You likely know the life cycle, but let's frame it strictly for the Special Composition Question (SCQ).

  1.  **Phase 1 (The Scatter):** In nutrient-rich soil, thousands of individual amoebae exist as distinct, single-celled eukaryotes. They hunt bacteria, divide, and move independently. Spatially, they are scattered; causally, they are largely independent.
  2.  **Phase 2 (The Aggregation):** When starvation hits, they release cAMP. They stream toward a center.
  3.  **Phase 3 (The Slug/Pseudoplasmodium):** They form a single, macroscopic migrating mass (the "grex"). This mass moves *as a unit* toward light/heat. It has a front and a back. It responds to stimuli as a whole.
  4.  **Phase 4 (The Fruiting Body):** The slug stands up. Roughly 20% of the cells altruistically differentiate into a cellulose stalk, die, and support the remaining 80%, which become spores and disperse.

  **The Metaphysical Question:** At Phase 3, do the thousands of amoebae *compose* a single material object (the Slug), or is there still just a plurality of amoebae acting in concert?

  Here is how three standard answers to the SCQ rule on this, and where they bleed.

  ---

  ### 1. Mereological Nihilism (e.g., Trenton Merricks)
  **The View:** Composition *never* occurs. There are no composite objects. There are only simples (or, in some versions, only fundamental particles).

  **The Ruling:**
  *   **Phase 1:** There are many amoebae (which are themselves composites, so strictly speaking, there are only the simples arranged amoeba-wise). There is no "colony."
  *   **Phase 3:** There is no "Slug." There are only simples arranged slug-wise.
  *   **Phase 4:** There are no dying stalk cells supporting spores; there are just simples arranged stalk-wise and simples arranged spore-wise.

  **Where it Parts Ways:**
  Nihilism is the easiest answer to apply but the hardest to swallow for a biologist. It denies the reality of the *integration*. For the Nihilist, the causal coordination between the amoebae in Phase 3 is ontologically irrelevant. Whether they are independent or forming a coordinated migrating mass, the ontology is identical: a plurality of simples. It solves the SCQ by dissolving it, but it renders biological talk of "organisms" strictly false *façons de parler*.

  ### 2. Mereological Universalism (e.g., David Lewis, Peter van Inwagen's foil)
  **The View:** Composition *always* occurs. For any plurality of objects, there exists a whole composed of them.

  **The Ruling:**
  *   **Phase 1:** There exists an object composed of all the scattered amoebae. Let's call it "Scatter-Sum." It is a scattered object, spatially discontinuous, but it exists just as robustly as a chair.
  *   **Phase 3:** The parts of "Scatter-Sum" have merely rearranged. The object persists. Alternatively, a new object (the Slug) is composed of the amoebae, existing alongside the "Scatter-Sum" if we define the parts differently.
  *   **Phase 4:** The object persists through the loss of parts (the stalk cells).

  **Where it Parts Ways:**
  Universalism captures the continuity but trivializes the *transition*. For the Universalist, there is no metaphysical difference between the scattered phase and the aggregated phase regarding *existence*. The "Slug" isn't a new entity brought into being by integration; it's just the same old sum of parts that happened to move closer together.
  This violates the biological intuition that something *novel* emerges in Phase 3. The functional integration (chemotaxis, coordinated motility, altruistic suicide) suggests a new ontological status, but Universalism says the ontology was fixed before the starvation signal was ever sent.

  ### 3. Van Inwagen's "Life" Answer (Organicism)
  **The View:** Composition occurs *if and only if* the activity of the parts constitutes a **life**. (Van Inwagen identifies composite material beings exclusively with living organisms).

  **The Ruling:**
  This is where your example becomes a weapon. Van Inwagen's criterion is: *The Xs compose Y iff the activity of the Xs constitutes a single life.*

  *   **Phase 1:** The activity of each amoeba constitutes a life. But do they constitute *a* life (singular)? No. They constitute *many* lives. Therefore, **no composition.** There is no "colony object." There are just many organisms.
  *   **Phase 3:** This is the battleground. Do the activities of the thousands of amoebae now constitute *a single life*?
      *   *If Yes:* A new composite object (the Slug) pops into existence. The amoebae cease to be organisms in their own right and become mere "cells" (parts) of the Slug-organism.
      *   *If No:* It is still just many organisms cooperating.
  *   **Phase 4:** The altruistic suicide of the stalk cells looks suspiciously like apoptosis in a multicellular animal. This strongly suggests the activities constitute a *single* life (the life of the Slug), where parts are sacrificed for the whole.

  **Where it Parts Ways (The "Organism-Part" Problem):**
  Here is the specific friction point for van Inwagen that the Statue/Lump cases miss. Van Inwagen has a constraint: **An organism cannot have an organism as a proper part.** (Roughly: if the parts are living lives of their own, they can't be caught up in *your* life).

  *   **The Dilemma:** In Phase 1, the amoebae are definitely organisms. In Phase 3, they retain their nuclei and metabolic machinery. They are still biologically "alive" individually.
  *   **The Conflict:** If van Inwagen says the Slug is an organism (because it has a single life), he must say the amoebae *cease* to be organisms when they aggregate. But biologically, they don't die; they just differentiate.
  *   **The Divergence:**
      *   **Universalism** says: Both exist (Amoebae + Slug).
      *   **Nihilism** says: Neither exists (only simples).
      *   **Van Inwagen** is forced to say: **One or the other, but not both.** He must argue that when the cAMP signal hits, the thousands of individual "lives" cease, and one new "Life" begins.

  ### Why This Example Matters

  The Statue/Lump case is about **coincidence** (two things in the same place). The Slime Mold case is about **emergence and persistence**.

  1.  **It Tests "Life" as a Metaphysical Predicate:** Van Inwagen uses "Life" as a brute fact to stop the regress of composition. But in *Dictyostelium*, "Life" is a gradient. Is the cAMP signaling part of the *same* life event as the independent hunting? If you say "Yes," you lean Universalist. If you say "No," you have to pinpoint the exact nanosecond a new object is created.
  2.  **It Avoids Artifacts:** There is no human intention here. The "unity" of the slug is purely causal and biological. If there is an object there, nature made it, not us.
  3.  **It Highlights the "Many-One" Transition:** In the Ship of Theseus, the parts are replaced over time. In the Slime Mold, the *same* parts change their mereological status from "Many" to "One" and back to "Many" (when the spores disperse and become amoebae again).

  ### The Verdict for a Biologist

  As a marine biologist, you know that siphonophores and slime molds break the Aristotelian distinction between "colony" and "organism." Metaphysics has lagged behind biology here because it relies on intuitions about rocks and chairs.

  *   **Nihilism** insults your expertise (denies the organism exists).
  *   **Universalism** insults your expertise (says the scattered bacteria-eaters are the same object as the integrated slug).
  *   **Van Inwagen** respects the intuition that the Slug is special, but forces you to accept a metaphysical switch-flip: that the *ontological status* of the amoebae changes when they aggregate, even if their biological machinery remains largely the same.

  If you want to really press the point, ask a van Inwagen proponent: *"At exactly what density of cells per cubic millimeter does the composition event occur? Is it when the cAMP concentration hits threshold X? Because if composition is objective, there must be a fact of the matter."*

  That is a question you can't ask about a statue, but you can certainly ask it about a grex.
