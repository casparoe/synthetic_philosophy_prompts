prompt: |-
  Bayes' theorem is invoked so often in the rationalist blogosphere that it is easy to forget how strange the original 1763 argument for it actually is. I recently went back to Bayes' own essay (communicated posthumously by Richard Price to the Royal Society) and got stuck on precisely the move that the later "ignorance prior" debate seems to hinge on.

  Bayes sets up a thought experiment involving balls thrown at random onto a level square table, stipulating that "there shall be the same probability that it rests upon any one equal part of the plane as another." One throw fixes a reference line across the table; repeated throws of a second ball then land on one side of that line or the other, an outcome he calls "the event M." Proposition 9 uses this setup to derive, once M has happened some number of times, the probability that the dividing line falls within a given range. Then, in the Scholium, Bayes tries to extend the result to any "unknown event" whatsoever:

  "That the same rule is the proper one to be used in the case of an event concerning the probability of which we absolutely know nothing antecedently to any trials made concerning it, seems to appear from the following consideration: viz. that concerning such an event I have no reason to think that, in a certain number of trials, it should rather happen any one possible number of times than another. For, on this account, I may justly reason concerning it as if its probability had been at first unfixed, and then determined in such a manner as to give me no reason to think that, in a certain number of trials, it should rather happen any one possible number of times rather than another. [...] In what follows therefore I shall take for granted that the rule given concerning the event M in prop. 9 is also the rule to be used in relation to any event concerning the probability of which nothing at all is known antecedently to any trials made or observed concerning it. And such an event I shall call an unknown event."

  What I have not been able to pin down is what actually licenses that last step. "I have no reason to think one value more likely than another" is a claim about the state of Bayes' own knowledge, whereas the table's uniformity is a claim about physical symmetry — and he seems to treat the two as interchangeable. That is exactly the slide that Keynes, and later E. T. Jaynes with his transformation-group approach, spent considerable effort trying to either rescue or dissolve once the principle of indifference started generating paradoxes. Is Bayes simply stipulating a convention and offering a plausibility argument for it, or is he already committing the conflation his successors were later blamed for? And does your answer change how seriously we should take the modern frequentist complaint, often raised in replication-crisis discussions of default or "reference" priors, that Bayesian "ignorance" is really just an unearned assumption in disguise?
