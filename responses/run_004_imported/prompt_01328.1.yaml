      *   **Frequentist Critique:** The critique holds water. The uniform prior *is* an assumption. It implies a specific metric on the parameter space. Bayes knew this was a "take for granted" move.
      *   **Conclusion:** Bayes isn't proving the rule for unknown events; he is *proposing* it as the definition of rational ignorance. The "strangeness" is the realization that objective Bayesianism rests on a subjective definition of ignorance.

