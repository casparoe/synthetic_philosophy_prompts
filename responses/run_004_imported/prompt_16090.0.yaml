prompt: |-
  I'm a philosophy PhD student specializing in formal epistemology, and thanks to a departmental service requirement I did not fully appreciate when I signed up for it, I now sit as the graduate student representative on my university medical center's biobank governance committee. The committee is revising our policy on returning secondary findings from research-grade whole-genome sequencing: currently, participants can either request all findings the lab deems "medically actionable" or decline everything, but a growing bloc of investigators wants us to also proactively flag high-penetrance, currently non-actionable findings (adult-onset neurodegenerative risk variants, for instance) to participants who never asked for them, on the reasoning that a competent adult can always decide what to do with information once she has it. At the last meeting, one of our biostatistician members gave this intuition a formal backbone, invoking I. J. Good's theorem: that the expected utility of costlessly acquired information is never negative for a rational Bayesian decision-maker, since she could always choose to act exactly as she would have without it. Two of our clinical geneticists pushed back hard, citing the "right not to know" and the fact that a finding about one participant is unavoidably a finding about her untested biological relatives too, and that Good's guarantee, that the informed party can always fall back on simply ignoring the information, doesn't obviously extend to people who never chose to be informed about anything in the first place.

  Because I am apparently the only person on the committee who has actually read Good's 1967 paper, I have been asked to draft the working group's recommendation memo for the full board's vote next month. I am having real trouble with this: the Good's-theorem argument is elegant and, as far as it goes, correct, but I suspect it earns its conclusion partly by building in assumptions (a single decision-maker, a well-defined subsequent action the information could change, no cost to the receiving of it) that are exactly what's in dispute once relatives and non-actionable findings enter the picture, and I don't yet know how to say that without sounding like I'm just refusing to let a clean argument do any work. Could you draft the memo for me? It should recommend a specific default policy for each of the two categories of findings, actionable and non-actionable, with tiered exceptions if that turns out to be the better answer, and it needs to represent the biostatistician's position rigorously enough that she would recognize her own view in it rather than feel it had been set up to lose, while still being honest about where, and why, you think the appeal to Good's theorem does or doesn't settle the question.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student (formal epistemology), graduate student rep on a medical center's biobank governance committee.
      *   **Task:** Draft a recommendation memo for the full board regarding the revision of policy on returning secondary findings from research-grade whole-genome sequencing (WGS).
      *   **Current Policy:** Participants choose "all medically actionable" or "decline everything."
      *   **Proposed Change:** Proactively flag high-penetrance, *non-actionable* findings (e.g., adult-onset neurodegenerative) to participants who didn't ask for them.
      *   **Key Argument for Change:** Biostatistician invokes I. J. Good's Theorem (1967) – expected utility of costless information is non-negative for a rational Bayesian agent (can always ignore it).
      *   **Key Argument Against Change:** Clinical geneticists cite "right not to know," psychological harm, and implications for untested relatives. Good's theorem assumes a single agent choosing to acquire info; it doesn't cover forced info or third-party effects.
      *   **Requirements:**
          *   Recommend a specific default policy for actionable vs. non-actionable findings (tiered exceptions allowed).
          *   Represent the biostatistician's position rigorously (no strawmanning).
          *   Honestly assess where Good's Theorem applies and where it fails in this context.
          *   Tone: Professional, academic, persuasive, suitable for a governance board (mixed audience of clinicians, researchers, admins, ethicists).
          *   Constraint: The user is a philosophy student, so the philosophical nuance must be sharp but accessible.

  2.  **Deconstruct the Philosophical/Formal Problem:**
      *   **Good's Theorem (1967):** $E[U|Info] \geq E[U|No Info]$.
      *   **Assumptions:**
          1.  *Costless:* No psychological, social, or financial cost to receiving the info.
          2.  *Single Agent:* The decision maker is the only one affected.
          3.  *Rationality:* The agent updates via Bayes' rule and maximizes expected utility.
          4.  *Option to Ignore:* The action space includes "act as if you didn't know."
      *   **Violations in Biobank Context:**
          1.  *Cost:* Psychological distress, anxiety, insurance discrimination (potentially), impact on life planning.
          2.  *Third Parties:* Relatives share genetic data. Their utility is not in the participant's utility function necessarily.
          3.  *Autonomy:* The "option to ignore" is cognitively difficult once knowledge is possessed (the "Pandora's Box" effect). Also, the *acquisition* wasn't chosen.
      *   **Actionable vs. Non-Actionable:**
          *   *Actionable:* There is a clear medical intervention. The utility gain is usually high (prevention/treatment). Good's theorem aligns better here because the "action" is clear.
          *   *Non-Actionable:* No intervention. The only "action" is psychological coping or life planning. The risk of negative utility (distress without benefit) is higher. Good's theorem is weakest here.

  3.  **Determine the Recommendation:**
      *   *Actionable Findings:* Default to return (opt-out). This aligns with standard medical ethics (duty to warn) and mostly aligns with Good's theorem (high potential utility, low cost of ignorance).
      *   *Non-Actionable Findings:* Default to *not* return (opt-in). This respects the "right not to know" and acknowledges the failure of Good's assumptions (psychological costs, third-party effects).
      *   *Exceptions:* Allow participants to opt-in for non-actionable if they explicitly request it (respecting autonomy). Allow participants to opt-out of actionable if they have strong religious/personal objections (respecting autonomy, though clinically risky).
      *   *Relatives:* Acknowledge the limitation. Cannot solve fully, but suggest counseling regarding familial implications.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** Clear statement of the recommendation.
      *   **Background:** Briefly state the current policy and the proposed change.
      *   **The Formal Argument (Good's Theorem):** This needs care. I need to state the theorem accurately so the biostatistician feels heard.
          *   *Formulation:* Information allows conditioning on a finer partition of states. A rational agent maximizes expected utility over actions. Since the previous optimal action is still available, the new maximum must be at least as high.
      *   **Critique/Application:** Where does it break?
          *   *Utility Function:* Is "distress" captured? If the utility function includes psychological states, "costless" is false.
          *   *The "Ignore" Option:* Can one truly ignore high-penetrance Alzheimer's risk? (Epistemic intrusion).
          *   *Externalities:* Relatives.
      *   **Policy Recommendation:**
          *   Category 1 (Actionable): Opt-out default.
          *   Category 2 (Non-Actionable): Opt-in default.
      *   **Rationale:** Tie the policy back to the analysis of Good's theorem.
      *   **Conclusion:** Final wrap-up.

  5.  **Refining the Tone:**
      *   Avoid overly technical jargon where possible, but don't dumb it down (it's a university medical center committee).
      *   Ensure the biostatistician doesn't feel dismissed. Use phrases like "Formally correct within its domain," "Assumptions are stringent," "Extension requires care."
      *   Ensure the geneticists feel validated. "Clinical reality," "Psychological burden," "Relational autonomy."
      *   Maintain the persona: A philosophy PhD student who knows formal epistemology but understands the stakes.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explicitly mention I. J. Good 1967? Yes.
      *   *Check:* Did I address the relatives issue? Yes, crucial for the "single agent" assumption violation.
      *   *Check:* Is the recommendation specific? Yes (Opt-out for actionable, Opt-in for non-actionable).
      *   *Check:* Is the distinction between "costless" in the theorem vs. "costly" in reality clear? Yes, need to emphasize *psychological* and *social* costs.
      *   *Check:* Is the "right not to know" integrated? Yes, as a preference within the utility function that the theorem doesn't account for ex-ante.

  7.  **Final Polish:** Check for clarity, flow, and professional formatting. (Ensure the distinction between *research-grade* and *CLIA-certified* is acknowledged if necessary, though the prompt implies the governance is about the *policy* of return, assuming validation happens. I will focus on the governance policy aspect). *Correction:* The prompt says "research-grade whole-genome sequencing." Usually, research findings must be confirmed in a CLIA lab before return. I should add a small caveat about confirmation to show medical literacy, but keep the focus on the ethical/epistemic argument.

  8.  **Final Output Generation** (Proceeding to draft the memo based on these thoughts).

  *(Self-Correction during drafting the Good's Theorem section)*: I need to be careful not to say Good is *wrong*. Good is mathematically true given the axioms. The error is in the *application* of the axioms to this specific context. I must make that distinction sharp. The biostatistician is right about the math; the geneticists are right about the model parameters.

  *(Self-Correction on Relatives)*: This is a classic "externality" problem. Good's theorem is individual decision theory. Genetics is inherently relational. This is a category error in applying the theorem.

  *(Final Plan)*:
  1. Header.
  2. Summary.
  3. The Proposal & The Formal Argument (Good).
  4. Limitations of the Formal Model (Costs, Agency, Externalities).
  5. Recommendations (Tiered Approach).
  6. Implementation Notes.
  7. Sign-off.cw
answer: |-
  **MEMORANDUM**

  **TO:** Biobank Governance Committee, Full Board
  **FROM:** Graduate Student Representative, Working Group on Secondary Findings
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Policy for Return of Secondary Genomic Findings (Actionable vs. Non-Actionable)

  ### 1. Executive Summary

  The Working Group on Secondary Findings has reviewed the proposal to expand the return of results from research-grade whole-genome sequencing (WGS). Specifically, we considered the suggestion to proactively disclose high-penetrance, currently non-actionable findings (e.g., adult-onset neurodegenerative risk variants) to participants who did not explicitly request them.

  After evaluating the formal epistemic arguments for disclosure alongside clinical and ethical constraints, the Working Group recommends a **tiered default policy**:
  1.  **Medically Actionable Findings:** Default to disclosure (Opt-Out model).
  2.  **Non-Actionable Findings:** Default to non-disclosure (Opt-In model).

  This recommendation rests on a distinction between the formal validity of decision-theoretic arguments for information acquisition and the empirical validity of their underlying assumptions in a clinical genetics context. While the argument that "information is never harmful to a rational agent" is mathematically sound under specific conditions, those conditions do not hold universally for non-actionable genetic data, particularly regarding psychological costs and third-party implications.

  ### 2. Background and The Formal Argument

  Current policy allows participants to elect receipt of all "medically actionable" findings or to decline all secondary findings. A bloc of investigators has proposed expanding this to include high-penetrance, non-actionable findings by default.

  The primary argument in favor of this expansion relies on a theorem by I. J. Good (1967) regarding the value of information. In formal decision theory, Good's Theorem demonstrates that for a rational Bayesian decision-maker, the expected utility of costlessly acquired information is never negative.

  **The Logic of the Argument:**
  1.  An agent faces a decision under uncertainty.
  2.  The agent receives new information that updates their probability distribution over states of the world (Bayesian updating).
  3.  The agent selects the action that maximizes expected utility given the new distribution.
  4.  Because the set of available actions includes the action the agent *would have taken* without the information, the optimized expected utility with information must be greater than or equal to the expected utility without it.
  5.  **Conclusion:** A rational agent should always accept costless information, as they retain the option to ignore it and act as if they never received it.

  From this perspective, proactively providing genetic risk information respects participant autonomy by expanding their epistemic state without constraining their action space. If the information is truly "costless," and the participant is "rational," the expected value of the policy change is positive.

  ### 3. Assessment of Applicability

  The Working Group acknowledges the mathematical rigor of Good's Theorem. However, theorems in decision theory are conditional; their normative force depends on whether the real-world context satisfies their axioms. The clinical geneticists' concerns highlight three specific areas where the assumptions of Good's Theorem diverge from the reality of genomic return.

  **A. The "Costless" Assumption (Psychological and Social Utility)**
  Good's Theorem assumes the acquisition of information incurs no cost ($C_{info} = 0$). In the context of non-actionable neurodegenerative risk:
  *   **Psychological Cost:** Knowledge of high-penetrance risk for untreatable conditions (e.g., Huntington's disease, early-onset Alzheimer's) carries a documented risk of significant psychological distress, anxiety, and altered life planning. In utility terms, $U(State, Knowledge) \neq U(State, Ignorance)$. If the utility function includes psychological well-being, the information is not costless.
  *   **The "Ignore" Option:** Good's guarantee relies on the agent's ability to effectively "ignore" the information if it does not suggest a beneficial action. However, high-salience health information is epistemically intrusive; it cannot be easily compartmentalized. The option to "act as if one does not know" is often cognitively unavailable once the knowledge is possessed.

  **B. The "Single Agent" Assumption (Relational Externalities)**
  Good's Theorem models a single decision-maker maximizing their own utility function. Genomic data is inherently familial.
  *   **Third-Party Implications:** A finding in a participant implies probabilistic risk for biological relatives who are not present at the decision table and have not consented to know.
  *   **Externality:** Proactively returning non-actionable findings imposes potential psychological burdens on relatives (e.g., a participant's parent learning they are at risk via their child's result). This violates the closed-system assumption of the individual decision model. The "rational agent" in this scenario is not the only stakeholder affected by the information transfer.

  **C. The Definition of "Action"**
  For actionable findings (e.g., BRCA1/2, Lynch Syndrome), the "action" space is clear (enhanced screening, prophylactic surgery). The utility gain from preventing morbidity usually outweighs the psychological cost of knowing. For non-actionable findings, the "action" space is limited to psychological coping or financial planning. In these cases, the marginal utility of the information is far more likely to be negative when psychological costs are factored into the utility function.

  ### 4. Policy Recommendation

  Based on the analysis above, the Working Group recommends rejecting a uniform "Opt-Out" policy for all secondary findings. Instead, we propose a differentiated approach that aligns the default setting with the likelihood that the assumptions of Good's Theorem hold.

  **Category 1: Medically Actionable Findings**
  *   **Definition:** Variants associated with conditions where evidence-based interventions exist to reduce morbidity/mortality (consistent with ACMG Secondary Findings list).
  *   **Default Policy:** **Opt-Out.** Participants are notified that these findings will be returned unless they explicitly decline.
  *   **Rationale:** For actionable findings, the potential for medical intervention creates a high probability that $E[U|Info] > E[U|No Info]$. The "cost" of information is generally outweighed by the utility of prevention. This aligns with the clinical duty to warn and satisfies the formal argument for most rational agents prioritizing health.

  **Category 2: Non-Actionable, High-Penetrance Findings**
  *   **Definition:** Variants associated with serious adult-onset conditions for which no preventive or therapeutic intervention exists (e.g., Huntington's disease, early-onset Alzheimer's).
  *   **Default Policy:** **Opt-In.** These findings will not be returned unless the participant explicitly requests them during the consent process.
  *   **Rationale:** Here, the "costless" assumption fails. The risk of psychological harm is significant, and the "option to ignore" is unreliable. Furthermore, the relational externalities are pronounced. Respecting the "Right Not to Know" is not an rejection of rationality, but a recognition that for many agents, the utility of ignorance regarding untreatable fate is higher than the utility of knowledge.
  *   **Exception:** Participants may explicitly elect to receive these findings after genetic counseling. This preserves autonomy for those whose utility functions *do* prioritize knowledge regardless of actionability (e.g., for reproductive planning or life closure), satisfying the biostatistician's concern that competent adults should be *allowed* to maximize their own utility functions, provided they choose that maximization ex-ante.

  ### 5. Implementation and Counseling Requirements

  To ensure the integrity of the Opt-In/Opt-Out distinctions:
  1.  **Pre-Test Counseling:** Consent forms must clearly distinguish between "Actionable" and "Non-Actionable" categories. Participants must understand that choosing "Opt-In" for non-actionable findings is irreversible.
  2.  **Validation:** All research-grade findings designated for return must be confirmed in a CLIA-certified laboratory prior to disclosure.
  3.  **Familial Context:** Counseling for both categories must explicitly discuss the implications for biological relatives. While we cannot mandate relatives' consent, participants must acknowledge that their decision impacts the familial epistemic environment.

  ### 6. Conclusion

  The appeal to Good's Theorem provides a valuable baseline: information *can* be a good, and competent adults should generally be permitted to access it. However, the theorem does not mandate that information *must* be pushed to agents who have not requested it, particularly when the "costless" and "single-agent" axioms are violated.

  By adopting a tiered default policy, the Biobank respects the formal insight that information has value (by allowing Opt-In for non-actionable findings) while acknowledging the clinical reality that the *delivery* of that information carries costs and externalities (by maintaining Opt-In defaults for non-actionable data). This approach balances the epistemic rights of the participant with the ethical obligations of the institution.

  **Recommendation:** The Working Group moves that the Full Board adopt the Tiered Default Policy as outlined in Section 4.
