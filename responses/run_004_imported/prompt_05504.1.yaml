answer: |-
  You are absolutely right to be suspicious. Wikipedia (and even some textbooks) often blur the line because the two concepts are best friends, but they are **not** the same thing.

  Here is the breakdown without the fluff.

  ### 1. The Core Distinction: Tool vs. Thesis

  *   **Paraconsistent Logic is a Tool (The Machinery).**
      It is a formal system. It changes the rules of inference so that if you have a contradiction ($A$ and $\text{not-}A$), the system doesn't crash. In classical logic, a contradiction triggers "Explosion" (from a contradiction, *anything* follows). Paraconsistent logic disables the explosion button. It allows you to reason *through* inconsistency without everything becoming true.
  *   **Dialetheism is a Thesis (The Belief).**
      It is a philosophical claim about truth and reality. It states that there are some statements that are **both true and false**. It claims that contradictions aren't just errors in our thinking or language; some of them are actually *correct descriptions of the world*.

  **The One-Liner:** Paraconsistent logic is the capacity to **tolerate** contradiction; Dialetheism is the willingness to **affirm** it.

  ---

  ### 2. Answering Your "Force" Questions

  You asked two specific logical implication questions. Here are the direct answers:

  **Q1: Does accepting true contradictions (Dialetheism) force you into using a paraconsistent logic?**
  **Answer: Yes (if you want to be sane).**
  If you believe there are true contradictions (Dialetheism) but you use Classical Logic, you immediately become a **Trivialist**.
  *   *Why?* In Classical Logic, the Principle of Explosion holds ($A, \neg A \vdash B$).
  *   If you admit even *one* true contradiction, Classical Logic forces you to admit that *every* statement is true (e.g., "The moon is made of cheese" becomes true).
  *   Since almost no one wants to believe literally everything is true, a Dialetheist **must** reject the Principle of Explosion. Therefore, they **must** use a paraconsistent logic to house their belief without their worldview collapsing.

  **Q2: Does using a paraconsistent logic force you to be a dialetheist?**
  **Answer: No.**
  This is where most people get confused. You can use paraconsistent logic purely as a damage-control mechanism without believing any contradictions are actually true.
  *   *Example:* Imagine a legal database. One law says "X is illegal." Another law says "X is legal." This is a contradiction.
  *   A lawyer using paraconsistent logic can reason about this mess without the system crashing. They don't have to believe "X is both legal and illegal in reality." They just acknowledge that the *information system* is inconsistent and they need a logic that handles that gracefully.
  *   This position is often called **"Weak Paraconsistency."** They use the logic to handle human error, incomplete data, or conflicting testimony, but they still believe the underlying world is consistent.

  ---

  ### 3. What is Actually Distinctive About Dialetheism?

  If paraconsistent logic is just the engine, what makes the dialetheist driver special?

  **1. It's a Claim About Truth, Not Just Inference**
  Paraconsistent logic is about *consequence* (what follows from what). Dialetheism is about *truth conditions* (what makes a sentence true).
  A non-dialetheist paraconsistent logician says: "I have contradictory evidence, so I will suspend judgment or treat them as separate cases so I don't explode."
  A dialetheist says: "The evidence is contradictory because the **fact itself** is contradictory."

  **2. The Solution to the Liar Paradox**
  Since you started at the Liar Paradox ("This sentence is false"), this is the best example of the difference.
  *   **Classical Logician:** The Liar Sentence is a problem. It creates a paradox. We must fix language or ban self-reference to stop the contradiction.
  *   **Weak Paraconsistent Logician:** The Liar Sentence creates an inconsistency in our system. We will use paraconsistent logic to isolate it so it doesn't infect our math, but we assume there's something wrong with the sentence.
  *   **Dialetheist (e.g., Graham Priest):** The Liar Sentence is **true and false**. It is a genuine true contradiction. The paradox isn't a bug to be fixed; it's a feature of truth itself.

  **3. Metaphysical Commitment**
  Dialetheism is a metaphysical stance. It suggests that reality (or at least semantic reality) has "glitches" or "boundaries" where opposites meet.
  *   *Example:* When you walk through a doorway, are you "in the room" or "not in the room"? At the exact instant you cross the threshold, a dialetheist might argue you are both in and not in. A standard paraconsistent logician would just say "Our definition of 'in' is too vague for this specific moment, let's use fuzzy logic," without claiming you are metaphysically both.

  ### Summary Table

  | Feature | Paraconsistent Logic | Dialetheism |
  | :--- | :--- | :--- |
  | **Category** | Formal System / Tool | Philosophical Thesis / Belief |
  | **Stance on Contradiction** | "I can handle them without crashing." | "Some of them are actually true." |
  | **Requires the other?** | No. (Can be used by consistentists) | Yes. (Needs it to avoid Trivialism) |
  | **View on the Liar Paradox** | A manageable inconsistency. | A true contradiction. |
  | **Goal** | Prevent logical explosion. | Describe the nature of truth/reality. |

  ### The Verdict
  Your logic teacher was vague because they are deeply intertwined, but the distinction is vital:
  **Paraconsistent logic is the car that can drive on a broken road. Dialetheism is the claim that the road is actually supposed to be broken.**

  You can drive the car on a normal road (Paraconsistency without Dialetheism). But if you claim the road is broken (Dialetheism), you better be driving that specific car (Paraconsistency), or you're going to crash (Trivialism).
