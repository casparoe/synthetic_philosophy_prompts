prompt: |-
  Compare Simon Blackburn's and Allan Gibbard's respective strategies for solving the Frege–Geach problem for expressivism. Blackburn's quasi-realism handles embedded moral claims through a "logic of attitudes": accepting a conditional such as "If lying is wrong, then getting your little brother to lie is wrong" is analyzed as a higher-order attitude of disapproval directed at certain combinations of first-order attitudes, with logical inconsistency explained as the practical impossibility of jointly satisfying the attitudes in question. Gibbard's norm-expressivism instead models normative thought via a possible-worlds-style semantics defined over pairs of possible worlds and maximally specific "hyperplans," so that the standard logical connectives apply to normative sentences in essentially the same way they apply to descriptive ones. Which approach offers the more general, non-ad-hoc treatment of embedding across the full range of connectives — not just modus ponens, but negation, disjunction, and iterated embeddings — and which better explains what it is for two speakers to have a logically inconsistent moral disagreement, rather than merely expressing different feelings side by side? Defend your answer, and consider whether the weaker of the two proposals could be repaired by borrowing resources from the stronger one.
reasoning: |-
  Here's a thinking process that leads to the comparison and evaluation of Blackburn's and Gibbard's solutions to the Frege-Geach problem:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Compare Simon Blackburn's quasi-realism and Allan Gibbard's norm-expressivism regarding the Frege-Geach problem.
      *   **Blackburn's Strategy:** "Logic of attitudes." Conditionals are higher-order attitudes (disapproval of combinations). Inconsistency is practical impossibility of satisfying attitudes.
      *   **Gibbard's Strategy:** Norm-expressivism with possible-worlds/hyperplan semantics. Normative sentences have truth-conditions (of a sort) over world/hyperplan pairs. Standard logical connectives apply similarly to descriptive sentences.
      *   **Evaluation Criteria:**
          1.  Generality/Non-ad-hoc nature across *all* connectives (negation, disjunction, iteration), not just modus ponens.
          2.  Explanation of logical inconsistency in moral disagreement (vs. mere clash of feelings).
      *   **Task:** Defend which approach is better.
      *   **Extension:** Consider if the weaker proposal can be repaired using resources from the stronger one.

  2.  **Analyze Blackburn's Quasi-Realism:**
      *   *Core Idea:* Start with expressivism (moral judgments express attitudes). Try to "earn the right" to realist-sounding talk (truth, falsity, logic) without ontological commitment.
      *   *Frege-Geach Solution:* The "logic of attitudes."
      *   *Conditionals:* Accepting "If P then Q" is having a higher-order attitude: disapproving of holding P without Q. (e.g., Disapproving of the combination [Disapproving of lying] & [Not disapproving of getting brother to lie]).
      *   *Inconsistency:* A clash of attitudes. If I hold the conditional and the antecedent but deny the consequent, I have a "fractured sensibility." It's a practical inconsistency.
      *   *Strengths:* Stays true to the expressivist spirit. Doesn't posit weird semantic objects initially.
      *   *Weaknesses:*
          *   *Generality:* It gets messy with complex embeddings. What is the attitude expressed by $\neg(P \lor Q)$ or $((P \to Q) \to R)$? Blackburn sometimes relies on a "minimalist" theory of truth later on, which can look like he's abandoning pure expressivism.
          *   *Inconsistency:* Is a clash of attitudes *logical* inconsistency? Critics (like Hale, Zangwill) argue that practical inconsistency isn't the same as logical contradiction. It explains why *I* feel conflicted, but does it explain why the *propositions* contradict?
          *   *The "Negation Problem" (Schroeder):* Specifically, distinguishing between "Disapproving of lying" and "Not disapproving of lying." Blackburn's higher-order attitude account struggles to distinguish the attitude expressed by $\neg P$ from the absence of the attitude expressed by $P$.

  3.  **Analyze Gibbard's Norm-Expressivism:**
      *   *Core Idea:* Normative judgments express the acceptance of norms (plans).
      *   *Frege-Geach Solution:* Semantic formalism using "hyperplans."
      *   *Semantics:* A sentence is true/false relative to a world-norm pair $\langle w, n \rangle$.
      *   *Logic:* Since the semantics is model-theoretic (like possible worlds), standard logical definitions apply. $\neg P$ is true at $\langle w, n \rangle$ iff $P$ is false at $\langle w, n \rangle$.
      *   *Strengths:*
          *   *Generality:* Because it uses a formal semantics, it automatically handles negation, disjunction, and iteration. It looks just like standard logic.
          *   *Inconsistency:* Logical inconsistency is defined formally. Two speakers disagree if they accept norms that rule out the same world-norm pairs. It captures the *logical* form of the disagreement.
      *   *Weaknesses:*
          *   *Metaphysical/Conceptual Cost:* Does positing "hyperplans" as semantic values stray too far from the expressivist idea that moral thought is *practical*? Is it just cognitivism in disguise?
          *   *The Nature of Norms:* Are hyperplans psychologically real?

  4.  **Compare and Evaluate (The "Defense"):**
      *   *Criterion 1: Generality across connectives.*
          *   Gibbard wins here. His semantic framework is built to handle truth-functional connectives by definition. Blackburn's higher-order attitude approach requires specific psychological stories for each connective, which becomes unwieldy and faces the "Negation Problem" (Schroeder's critique is devastating here). Blackburn often retreats to deflationary truth to solve this, which some argue concedes the point to cognitivism.
      *   *Criterion 2: Logical Inconsistency in Disagreement.*
          *   Gibbard wins here too. By defining inconsistency in terms of incompatible sets of world-norm pairs, he preserves the *logical* nature of the conflict. Blackburn's "clash of sensibilities" risks making disagreement merely a psychological incompatibility (like hating spinach vs. loving spinach) rather than a logical contradiction (believing $P$ vs. believing $\neg P$).
      *   *Verdict:* Gibbard's approach is more robust and systematic regarding logic and semantics. Blackburn's is more philosophically motivated by the "spirit" of expressivism but struggles with the technical details of logic.

  5.  **Repairing the Weaker Proposal (Blackburn):**
      *   Can Blackburn borrow from Gibbard?
      *   Blackburn already moved towards a deflationary/minimalist theory of truth (*Truth, Vagueness, and Paradox*, *Ruling Passions*).
      *   To fix the Negation Problem and embedding issues, Blackburn needs a more formal semantic structure. He could adopt Gibbard's "hyperplan" idea but interpret it less metaphysically—as a way of modeling the *structure* of planning rather than positing entities.
      *   Essentially, Blackburn needs to accept that to save expressivism, he needs a "formal semantics for attitudes." This looks a lot like Gibbard's later work (*Thinking What to Do*).
      *   However, if Blackburn adopts Gibbard's semantics fully, does he cease to be a quasi-realist and become a cognitivist? This is the tension. The repair involves accepting a more robust semantic realism about norms while maintaining the expressivist account of *judgment*.

  6.  **Drafting the Response:**
      *   *Introduction:* Define the Frege-Geach problem briefly. Introduce Blackburn (Quasi-realism/Logic of Attitudes) and Gibbard (Norm-expressivism/Hyperplans). State thesis: Gibbard offers the more general and logically robust solution, though at a higher metaphysical cost.
      *   *Section 1: Blackburn's Strategy.* Explain higher-order attitudes. Highlight the "Negation Problem" (Schroeder). Explain why complex embeddings are difficult (ad-hoc psychological stories). Discuss the disagreement issue (practical vs. logical inconsistency).
      *   *Section 2: Gibbard's Strategy.* Explain world-norm pairs. Explain how standard logic applies. Highlight the advantage in handling negation and iteration naturally. Discuss disagreement as incompatibility of norm-acceptance.
      *   *Section 3: Comparison/Defense.* Argue Gibbard is superior on logical generality and the nature of disagreement. Blackburn's solution is more intuitive initially but fractures under technical scrutiny. Gibbard preserves the *logic* of morality better.
      *   *Section 4: Repairing Blackburn.* Suggest Blackburn adopts a more formal semantic structure (like Gibbard's) but keeps the deflationary truth predicate. This creates a hybrid: Expressivism about the *mental state*, Cognitivism (of a sort) about the *semantics*. Note that this blurs the line between the two philosophers (as seen in their later convergences).
      *   *Conclusion:* Summarize. Gibbard wins on technical grounds; Blackburn wins on initial philosophical motivation, but needs Gibbard's tools to survive the technical objections.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to paint Blackburn as failing completely. His deflationary move is a legitimate response. But the prompt asks about the "logic of attitudes" specifically vs. Gibbard's semantics.
      *   *Nuance:* Acknowledge that Gibbard's hyperplans can be seen as abstract objects that threaten expressivism. But for the specific question of *logic and embedding*, Gibbard is stronger.
      *   *Schroeder's Critique:* Must mention Mark Schroeder's *Being For*. He argues Blackburn's account of negation fails. Gibbard's account handles it better because $\neg P$ is defined semantically, not psychologically.
      *   *Disagreement:* Blackburn says disagreement is a clash of conative states. Gibbard says it's incompatibility of plans. Gibbard's is closer to logical contradiction.

  8.  **Final Polish:** Check against prompt requirements.
      *   Compare strategies? Yes.
      *   Which is more general/non-ad-hoc? (Gibbard).
      *   Which better explains inconsistency? (Gibbard).
      *   Defend answer? Yes.
      *   Consider repair? Yes.

  9.  (Mental Outline of the essay structure)
      *   Intro: F-G problem context.
      *   Blackburn: Higher-order attitudes. Strengths: Fidelity to Humean psychology. Weaknesses: Negation problem, complexity of iteration.
      *   Gibbard: Hyperplans/World-Norm pairs. Strengths: Formal logic applicability. Weaknesses: Ontological commitment.
      *   Evaluation: Gibbard wins on logic/embedding. Blackburn struggles with "Not wrong."
      *   Disagreement: Gibbard explains logical incompatibility; Blackburn explains psychological clash. Gibbard is better for *logical* disagreement.
      *   Repair: Blackburn needs formal semantics (Gibbardian) + Deflationary Truth.
      *   Conclusion.

