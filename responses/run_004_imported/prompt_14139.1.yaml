answer: |-
  The Frege–Geach problem poses a fundamental challenge to expressivism: if moral sentences express non-cognitive attitudes rather than describing facts, how can they function logically within unasserted contexts (like conditionals, negations, or disjunctions) where no attitude is being expressed? Simon Blackburn's quasi-realism and Allan Gibbard's norm-expressivism offer the two most prominent solutions. While Blackburn's approach remains closer to the traditional Humean spirit of expressivism, **Gibbard's strategy offers a more general, non-ad-hoc treatment of embedding and a superior explanation of logical inconsistency.** Blackburn's "logic of attitudes" struggles with the technical demands of complex logic, particularly negation, whereas Gibbard's semantic formalism preserves the structure of classical logic at the cost of positing more abstract semantic values.

  ### Blackburn's Strategy: The Logic of Attitudes

  Blackburn's quasi-realism attempts to "earn the right" to realist-sounding discourse (truth, falsity, logic) without ontological commitment to moral facts. His solution to Frege–Geach relies on a psychological analysis of logical connectives.

  For Blackburn, accepting a moral conditional like "If lying is wrong, then getting your brother to lie is wrong" is not accepting a proposition about the relationship between two facts. Instead, it is adopting a **higher-order attitude**. Specifically, it is a sentiment of disapproval toward anyone who holds the first-order attitude (disapproving of lying) without holding the second (disapproving of getting your brother to lie). Logical inconsistency, on this view, is not a contradiction between truth-conditions but a "fractured sensibility"—the practical impossibility of jointly satisfying the involved attitudes.

  **Weaknesses:**
  1.  **The Negation Problem:** As Mark Schroeder has forcefully argued, Blackburn's strategy fails to distinguish between the attitude expressed by $\neg P$ ("Lying is not wrong") and the absence of the attitude expressed by $P$ ("I do not disapprove of lying"). In a logic of attitudes, negation should express a positive state (tolerance or approval of omission), but Blackburn's higher-order model struggles to generate this distinct state without collapsing into cognitivism.
  2.  **Iterated Embeddings:** While Blackburn can handle simple conditionals, complex embeddings (e.g., "If either lying is wrong or stealing is permissible, then...") require increasingly convoluted higher-order attitudes. The explanation becomes ad-hoc because it requires a unique psychological story for every logical operator, rather than a unified semantic rule.
  3.  **Disagreement:** Blackburn explains disagreement as a clash of conative states. However, critics argue this reduces logical disagreement to mere psychological incompatibility (like one person liking spinach and another hating it). It fails to capture the *normative force* of logical contradiction—that two speakers cannot both be "right" in a logical sense, not just that they cannot both be satisfied.

  ### Gibbard's Strategy: Norm-Expressivism and Hyperplans

  Gibbard's approach, particularly in *Thinking What to Do*, models normative thought using a possible-worlds-style semantics. He posits that normative sentences are evaluated relative to pairs of a possible world and a "hyperplan" (a maximally specific plan for what to do in every contingency).

  On this model, a sentence like "Lying is wrong" is true relative to a world-norm pair $\langle w, n \rangle$ if the plan $n$ rules out lying in world $w$. Crucially, logical connectives are defined semantically over these pairs. $\neg P$ is true at $\langle w, n \rangle$ iff $P$ is not true at $\langle w, n \rangle$. This allows standard truth-functional logic to apply to normative sentences exactly as it does to descriptive ones.

  **Strengths:**
  1.  **Generality:** Because Gibbard adopts a formal semantics, he does not need a separate psychological story for each connective. Negation, disjunction, and iteration are handled by the recursive definitions of the semantic framework. This avoids the ad-hoc nature of Blackburn's higher-order attitudes.
  2.  **Logical Inconsistency:** Gibbard defines inconsistency as the impossibility of jointly accepting the norms involved. Two speakers disagree logically if there is no world-norm pair that satisfies both of their judgments. This preserves the formal notion of contradiction, explaining why moral disagreement is a matter of logic, not just psychology.

  ### Evaluation: Why Gibbard Prevails

  Gibbard's approach is superior regarding the criteria of **generality** and **logical inconsistency**.

  **1. Generality across Connectives:**
  Blackburn's account is vulnerable to the charge that it is a "logic" only by analogy. It maps logical forms onto psychological structures, but as embeddings become complex, the psychological mapping becomes opaque. Gibbard, by contrast, provides a genuine semantics. By treating normative sentences as having satisfaction conditions over world-norm pairs, he ensures that the logic of morality is isomorphic to classical logic. This handles iterated embeddings (e.g., conditionals within negations) effortlessly, whereas Blackburn requires new layers of higher-order attitudes for each iteration.

  **2. The Nature of Disagreement:**
  Blackburn's explanation of disagreement risks subjectivism. If inconsistency is merely a "fractured sensibility," then a moral contradiction is akin to a psychological breakdown. Gibbard's explanation is more robust: disagreement is an incompatibility of *plans*. If I plan to $\phi$ and you plan to $\neg \phi$, we cannot jointly coordinate; our plans are logically incompatible. This captures the objective "clash" required for genuine disagreement without positing moral facts. Gibbard explains why we argue using logic: because our plans must be consistent to be actionable, not just because we feel conflicted.

  ### Repairing Blackburn: A Hybrid Approach

  While Gibbard wins on technical grounds, Blackburn's quasi-realism is often preferred by those wary of Gibbard's ontological commitment to "hyperplans" as semantic values. Can Blackburn be repaired using Gibbard's resources?

  Yes, but it requires Blackburn to move closer to a **deflationary cognitivism**. To solve the Negation Problem and handle complex embeddings, Blackburn must adopt a formal semantic structure similar to Gibbard's. He can treat moral sentences *as if* they have truth-conditions (using a minimalist theory of truth) while maintaining that the *nature* of moral judgment is practical.

  Specifically, Blackburn could borrow Gibbard's **world-norm pair semantics** but interpret the "norm" component deflationarily. Instead of viewing hyperplans as abstract objects that give sentences truth-conditions, Blackburn could view them as modeling the structure of practical reasoning. The "truth" of a moral sentence would then be understood via a deflationary schema (e.g., "'Lying is wrong' is true iff lying is wrong"), where the right-hand side is understood expressively.

  However, this repair blurs the distinction between the two philosophers. By adopting a formal semantics that validates classical logic, Blackburn's quasi-realism begins to look like Gibbard's norm-expressivism. The "logic of attitudes" is insufficient on its own; it requires the semantic scaffolding Gibbard provides to function rigorously. Thus, the repair essentially involves Blackburn accepting that to save expressivism from the Frege–Geach problem, he must concede that moral language functions semantically like descriptive language, even if its psychological function differs.

  ### Conclusion

  Allan Gibbard's norm-expressivism offers the more robust solution to the Frege–Geach problem. His use of world-norm semantics provides a general, non-ad-hoc account of embedding across all logical connectives and explains logical inconsistency as a formal incompatibility of plans rather than a mere psychological clash. Blackburn's quasi-realism, while philosophically motivated by a desire to avoid ontological excess, struggles with the technicalities of negation and complex iteration. Blackburn can repair these deficiencies by adopting Gibbard's semantic formalism, but in doing so, he concedes that a rigorous expressivism requires a cognitivist-style semantics to underwrite the logic of moral discourse.
