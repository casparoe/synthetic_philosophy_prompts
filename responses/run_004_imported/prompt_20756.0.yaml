answer: |-
  Your skepticism is well-founded. In fact, it touches on one of the most debated transitions in modern formal epistemology. Your coach described a **pragmatic** vindication of probability (if you want to maximize score/minimize loss, be honest). Jim Joyce's project is an **epistemic** vindication (if you want to represent the world accurately, be coherent).

  The leap you are sensing—from "this rule incentivizes honesty" to "incoherence is objectively defective"—relies on specific assumptions about what "accuracy" is and how we measure it.

  Here is the walkthrough of the Accuracy-Dominance Argument, the conditions required for the scoring rule, and the philosophical vulnerabilities.

  ---

  ### 1. The Structure of the Argument

  The argument is designed to prove **Probabilism**: the norm that rational credences must obey the axioms of probability (e.g., $P(A) + P(\neg A) = 1$).

  Traditional arguments for Probabilism are **pragmatic**. The most famous is the **Dutch Book Argument**: if your credences are incoherent, a bookie can construct a set of bets that guarantees you a loss.
  *   *The Problem:* This shows incoherence is *expensive*, not necessarily that it is *untruthful*. You could reply, "I don't care about money; I care about truth."

  Joyce's **Accuracy-Dominance Argument** attempts to remove the money/utility element entirely. It argues that incoherent credences are objectively further from the truth than coherent ones, regardless of betting.

  **The Logical Flow:**
  1.  **Alethic Goal:** The fundamental epistemic goal of belief is to be accurate (to match the truth).
  2.  **Measurement:** We can measure the "inaccuracy" of a credence using a mathematical scoring rule (like the Brier score).
  3.  **The Dominance Theorem:** If a set of credences violates the probability axioms (is incoherent), there exists *some* alternative set of coherent credences that is **more accurate in every possible world.**
  4.  **Rationality Norm:** It is irrational to adopt a strategy that is guaranteed to be less accurate than an available alternative (dominance).
  5.  **Conclusion:** Therefore, it is irrational to hold incoherent credences.

  ### 2. What Makes a Scoring Rule Measure "Genuine Accuracy"?

  Your coach mentioned "proper" scoring rules. For Joyce's argument to work, the scoring rule cannot just be *any* proper rule; it must satisfy specific conditions to count as a measure of **alethic (truth-related) value** rather than **pragmatic (utility-related) value**.

  Let $c$ be your credence in a proposition $X$, and $v$ be the truth value of $X$ (1 if true, 0 if false). An inaccuracy measure $\mathfrak{I}(c, v)$ tells you how "far" $c$ is from $v$.

  For the argument to hold, $\mathfrak{I}$ must be:

  #### A. Continuous
  Small changes in credence should result in small changes in inaccuracy. You shouldn't get penalized massively for shifting from 0.50 to 0.51.

  #### B. Strictly Proper (The Crucial Link)
  This connects to your coach's comment. A scoring rule is **strictly proper** if, *assuming you are probabilistically coherent*, you expect your own current credences to minimize your inaccuracy.
  *   If you believe $X$ is 70% likely, and you are coherent, the 70% report minimizes your expected Brier score.
  *   **Why this matters:** This ensures the scoring rule respects the agent's own perspective. It prevents the scoring rule from "lying" to the agent about what is accurate.

  #### C. Convex
  Mathematically, this ensures that the "penalty" for being wrong grows as you move away from the truth. This is required for the **Dominance Theorem** to work geometrically.

  **The Geometric Intuition:**
  Imagine a graph where the axes represent credences in $A$ and $\neg A$.
  *   The **Truth Vertices** are at $(1,0)$ [A is true] and $(0,1)$ [A is false].
  *   The **Coherent Line** connects these vertices (where $P(A) + P(\neg A) = 1$).
  *   **Incoherent points** lie off this line (e.g., $P(A)=0.7, P(\neg A)=0.7$).

  Joyce's math (building on de Finetti) shows that any point *off* the line is geometrically further from *both* truth vertices than some point *on* the line. Therefore, there is a coherent set of beliefs that is closer to the truth, no matter which way the world turns out.

  ### 3. Why This Is Supposed to Force Coherence

  The force of the argument comes from the concept of **Dominance**.

  In decision theory, if Option A yields a better outcome than Option B in *every possible state of the world*, Option A dominates Option B. Rational agents do not choose dominated options.

  *   **Pragmatic Dominance (Dutch Book):** Incoherence guarantees a loss of money in every world.
  *   **Alethic Dominance (Joyce):** Incoherence guarantees a loss of *accuracy* in every world.

  If you accept that accuracy is the sole goal of belief (Premise 1), and you accept the math that incoherent credences are accuracy-dominated (Premise 3), you are forced to accept Probabilism. It frames incoherence not as a betting vulnerability, but as a representational error—like using a map where the distance between New York and London is listed as longer than the distance between New York and the Moon.

  ### 4. Where Philosophers Think the Argument is Vulnerable

  Your intuition that the leap is "bigger than the scoring-rule fact can support" is shared by many critics. Here are the main points of vulnerability:

  #### A. The "Measure Problem" (Why Brier?)
  This is the strongest objection. Joyce's theorem holds for *any* strictly proper, continuous, convex scoring rule. But there are infinitely many such rules (Brier, Log, Spherical, etc.).
  *   **The Issue:** Different scoring rules can disagree on *which* coherent credences dominate an incoherent one.
  *   **The Worry:** If the "correct" coherent alternative depends on which arbitrary mathematical formula we pick for accuracy, does accuracy really exist as an objective property? If I choose the Log score, the recommendation might differ slightly from the Brier score. Why is the Brier score the "true" measure of distance from truth?
  *   **Response:** Some (like Pettigrew) argue we should average over all admissible scoring rules, but this complicates the "simple" nature of the argument.

  #### B. The Normative Leap (Why avoid dominance?)
  The argument assumes: *If a belief state is accuracy-dominated, it is irrational.*
  *   **The Issue:** This is an instrumental norm (don't choose guaranteed worse means to your end). But what if accuracy isn't the *only* end?
  *   **Example:** Perhaps having a coherent credence of 0.5 is less accurate than an incoherent credence of 0.9, but the 0.9 credence provides more psychological comfort or motivates better action. If epistemology is purely about truth, Joyce wins. If epistemology interacts with practical reasoning, the "accuracy-first" approach is vulnerable.

  #### C. The Assumption of Binary Truth
  The math relies on propositions having a determinate truth value (0 or 1) in every possible world.
  *   **The Issue:** This struggles with vagueness ("This heap is a pile"), future contingents, or quantum indeterminacy. If the world itself doesn't have a binary truth value for a proposition, the "distance from truth" metric breaks down.

  #### D. Pragmatic Creep
  Critics argue that "accuracy" is just utility in disguise.
  *   **The Issue:** To say a Brier score measures "epistemic utility" rather than "pragmatic utility" requires a sharp distinction between truth and success. Some pragmatists argue that truth *just is* what leads to successful action. If so, Joyce hasn't escaped the Dutch Book argument; he has just renamed "money" to "accuracy points."

  ### Summary for Your Club

  You can explain it to your club members like this:

  1.  **Coach's Point:** In a competition, the Brier score makes honesty the optimal strategy (Pragmatic).
  2.  **Joyce's Point:** Even without a competition, incoherent credences are mathematically guaranteed to be further from the truth than coherent ones (Alethic).
  3.  **The Gap:** This only works if we accept that the Brier score (or similar) is the *true* measure of "distance from truth."
  4.  **The Vulnerability:** If there is no single, objective "ruler" for measuring truth-distance, the argument loses its force. It shows incoherence is *mathematically inefficient* relative to a chosen metric, but perhaps not *epistemically sinful* in the abstract.

  Your skepticism is philosophically mature: the argument successfully transforms Probabilism from a betting constraint into an accuracy constraint, but it cannot fully escape the question of *why* we choose that specific definition of accuracy.
