prompt: |-
  So I've been going down a rabbit hole with the units of selection debate for my qualifying exam and I keep getting tangled up in whether the disagreement between genic selectionism (the Dawkins "selfish gene" / gene's eye view) and multilevel selection theory (like Sober and Wilson's stuff in Unto Others) is actually substantive or if its just two different bookkeeping schemes for the same underlying population genetics. Like, everyone cites the Price equation as supposedly showing these are inter-translatable, but then people like Wilson and Sober still insist MLS captures something causally real about group-level fitness that the genic view papers over via "average effects" and stuff.

  Can you compare genic selectionism and multilevel selection theory for me? I'm especially trying to get a handle on: (1) whether their disagreement is empirical, conceptual, or just a matter of preferred description, and (2) if there's a principled way to decide when talk of "group selection" is doing real explanatory work versus just being a relabeling of kin/individual selection effects. My advisor keeps saying "it's all just perspective" but that feels like a cop-out given how much ink has been spilled on this.
