prompt: |-
  So a few months back I got into it with my uncle over Thanksgiving about some conspiracy theory stuff he's into (I won't even get into which one, there's too many at this point), and I got so frustrated that nothing I said as a "fact" ever budged him that I went down a rabbit hole reading about how you're even supposed to argue with someone who doesn't accept your starting points to begin with. That's how I ended up reading (well, half-reading, some of it is genuinely baffling) Wittgenstein's On Certainty. From what I can tell the whole book is basically a response to G.E. Moore holding up his hand and going "well, here is a hand, so obviously there's an external world, skepticism solved" - and Wittgenstein's move is that Moore is kind of missing what's actually going on, because "I have a hand" isn't something you know in the normal sense, its more like a "hinge" that the whole business of knowing and doubting turns on in the first place, and you can't really doubt it OR claim to know it.

  Here's the part that's been messing with my head though. If hinge propositions are basically groundless - not backed by evidence, not really justified, just the bedrock stuff we act on without question - and if (like he seems to say later in the book) two people can end up with totally different bedrocks such that arguing is pointless and each side just decides the other one's a fool or a heretic, then doesn't that mean my uncle's conspiracy-brain "hinges" and my normal-person hinges are on equal footing, philosophically speaking? Like there's no actual fact of the matter about who's more rational, we've just each got different unprovable bedrocks and that's that? I vaguely remember reading that some later philosopher (Pritchard, maybe? I might be misremembering) used this exact "hinge" idea to argue that religious faith can be rational without it collapsing into a full blown "everyone's equally rational" relativism - so apparently there's supposed to be some way to block that conclusion. Could you walk me through how that move is actually supposed to work, and whether you think it holds up, or whether Wittgenstein's own picture really does commit him to that kind of relativism whether he wanted it to or not?
