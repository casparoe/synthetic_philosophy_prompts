      *   **Roommate's View:** Pragmatic solution (narrowest class with stable data). User finds this a compromise, not a principled resolution.
      *   **User's Hypothesis:** There may be no "fact of the matter" about a single individual's true probability independent of the reference group.
      *   **Request:** Help think through whether the roommate's rule solves the problem or papers over it, and whether single-case probability claims make sense.

  2.  **Identify the Philosophical Core:**
