answer: |-
  This is a compelling philosophical puzzle that cuts to the heart of criminal law theory. To make your judge's reasoning rigorous, you need to anchor her argument in the **Control Principle** and distinguish sharply between **culpability** (the agent's moral blameworthiness) and **badness of outcome** (the state of the world).

  Most legal systems punish attempts less severely than completions. A standard retributivist might try to justify this by arguing that the harm done is part of the "wrong" that needs to be annulled. To write the opinion you want, your judge must reject that premise as incoherent. She must argue that once the agent has done everything within their power to bring about the prohibited harm, their moral debt to society is fully incurred. Anything beyond that is noise.

  Here is the philosophical architecture for your judge's opinion, broken down into the core argument, the rebuttal to specific objections, and a sample of the judicial voice.

  ### I. The Core Argument: The Control Principle and the Locus of Desert

  The foundation of your judge's retributivism must be the **Control Principle**: *An agent is only morally responsible (and thus deserving of punishment) for factors within their control.*

  1.  **The Locus of Culpability:** Retributivism justifies punishment based on *desert*. Desert is a function of the agent's will (mens rea) and their voluntary action (actus reus). In both the Attempt and the Completion cases, the defendants formed the identical intent to kill and undertook identical voluntary actions to execute that intent.
  2.  **The Arbitrariness of Resultant Luck:** The only variable distinguishing the two cases is whether the rifle fired. In your specific fact pattern, the failure to fire was due to sabotage—external interference entirely outside the defendant's knowledge or control. Even without sabotage, a mechanical jam is a matter of physics, not morality.
  3.  **The Conclusion:** To punish the completed murderer more severely than the attempted murderer is to punish the former for the workings of physics (ballistics, mechanics, physiology) rather than the workings of their will. If justice is about giving the agent their *due*, and the agent's contribution to the universe was identical in both cases, the due must be identical.

  **Key Phrase for the Opinion:** *"We do not punish men for the chaos of the universe; we punish them for the order of their own intentions."*

  ### II. Dismantling the Counter-Arguments

  To make this rigorous, your judge needs to anticipate and dismantle the two standard objections you mentioned: that harm is constitutive of the wrong, and that the crimes are legally distinct.

  #### 1. The "Constitutive Harm" Objection
  *The Objection:* A sophisticated retributivist (like Michael Moore) might argue that the "wrong" isn't just the choice to kill, but the actual destruction of a moral good (life). The completed murderer has destroyed a value; the attempter has only threatened it. Therefore, the "debt" is objectively larger in the completed case.

  *The Judge's Rebuttal:* This conflates **badness of outcome** with **badness of agency**.
  *   **Argument:** It is undeniably true that a world with a dead body is worse than a world with a living one. But retributivism is concerned with the *agent's* desert, not the *world's* tragedy. The agent's moral character is fully expressed in the attempt. If the agent has done everything *they* can do to destroy the value, their moral stance toward that value is identical to the successful killer.
  *   **The Trap:** If we say the agent deserves more punishment because the victim died, we are implicitly admitting that factors outside the agent's control (the gun working, the victim's proximity to a hospital) determine their moral worth. This turns justice into a lottery. A retributivist who cares about "just deserts" cannot accept a system where desert fluctuates based on random external variables.
  *   **The "Annulment" Theory:** If punishment is meant to "annul" the crime, one might argue you need more punishment to annul a death. But your judge should argue that punishment annuls the *claim of right* the criminal made. By trying to kill, the criminal claimed a right over another's life. That claim is equally false and equally arrogant whether the gun jams or not. The "annulment" of that false claim requires the same censure.

  #### 2. The "Individuation of Crime" Objection
  *The Objection:* The law defines "Murder" and "Attempted Murder" as distinct offenses. They have different elements. Therefore, they are different moral tokens.

  *The Judge's Rebuttal:* Legal categories are administrative tools, not moral truths.
  *   **Argument:** The legislature may distinguish them for pragmatic reasons (evidence rules, plea bargaining leverage, statutory grading). But the Constitution (or the moral law your judge serves) demands that punishment be proportional to *culpability*, not statutory labeling.
  *   **The Smuggle:** When the law punishes the completed crime more harshly solely because it is labeled "completed," it is often smuggling in **consequentialist** reasoning (deterrence). We punish the result more to discourage people from finishing the job. But your judge is a *retributivist*. She must strip away the utilitarian calculus. If the *blame* is the same, the *punishment* must be the same, regardless of the statutory name tag.

  ### III. Exposing the Consequentialist Smuggle

  This is the sharpest point for a thriller. Your judge should argue that the only reason the legal system distinguishes them is not justice, but **administrative convenience** or **deterrence**, both of which she rejects as primary justifications for *desert*.

  *   **Deterrence:** "We punish attempts less because there is less harm to prevent?" No. That is utilitarianism.
  *   **Evidence:** "We punish attempts less because intent is harder to prove?" Perhaps, but in these two specific cases, the intent is proven beyond a doubt. To reduce the sentence based on a general evidentiary heuristic when the specific evidence is clear is a miscarriage of justice.
  *   **The "Repentance" Fallacy:** Sometimes it is argued that the failed attempter had a chance to repent before success. Your judge should crush this: "The defendant did not stop; she was stopped. A jammed trigger is not a change of heart."

  ### IV. Sample Judicial Voice

  Here is a draft of how this reasoning might sound in the opinion. It is written to be sharp, slightly austere, and philosophically dense, fitting a judge who prides herself on intellectual honesty over comfort.

  ***

  **OPINION OF THE COURT**

  ...The State argues that the distinction between Attempt and Completion is not merely one of statutory grading, but of moral magnitude. It posits that the defendant in Case B, whose bullet found its mark, has incurred a debt to justice greater than the defendant in Case A, whose rifle jammed. This Court disagrees.

  Retributive justice is anchored in the principle of control. An agent deserves punishment in proportion to their culpability, and culpability is a measure of the will's defiance of the moral law. In both cases before us, the defendants formed the identical intent to extinguish a human life. In both cases, they undertook the identical series of voluntary actions to secure that end. They purchased weapons, they surveilled victims, they positioned themselves, and they pulled triggers.

  At the precise moment the finger tightened on the trigger, the moral calculus was complete. Both defendants had done everything within their power to effectuate a murder. Both had fully actualized their malicious will in action. That the physics of Case A intervened—via a sabotaged firing pin—to spare the victim is a fact of resultant luck. It is a fact about the universe, not a fact about the defendant.

  To punish the completed murderer more severely than the attempted one is to punish the former for the cooperation of gravity, ballistics, and biology. It is to make the severity of justice turn on a lottery. If two archers shoot at two victims with identical malice and identical skill, but a sudden gust of wind deflects one arrow, we do not say the second archer is more *evil*. We say he is more *unlucky*.

  The State suggests that the harm itself is constitutive of the desert. They argue that because the world is worse off in Case B, the defendant must be worse off in turn. This reasoning smuggles consequentialism into the heart of retribution. It suggests we punish to balance the scales of the universe's suffering, rather than to censure the offender's choice. But the offender's choice was identical. The claim of right they asserted over another's life was equally false, equally arrogant, and equally dangerous in both instances.

  We acknowledge that the common law has historically distinguished attempt from completion. We acknowledge that this distinction serves utilitarian ends: it preserves prosecutorial leverage, it conserves prison resources, and it offers a gradient for deterrence. These are valid policy concerns for a legislature. But they are not principles of *justice*.

  This Court sits to administer justice, not policy. Where the culpability is identical, the desert must be identical. To hold otherwise is to admit that our sentencing scheme is not based on what the defendant *did*, but on what the world *allowed* them to do. We reject that submission. The sentence for Attempted Murder shall be conformed to the sentence for Murder. The jammed gun is no mitigation of a murderous heart.

  ***

  ### V. Narrative Implications for Your Thriller

  1.  **The Conflict:** This opinion will be controversial. Prosecutors will hate it (it removes leverage for plea deals). Victims' rights groups might hate it (it seems to minimize the death of the victim in Case B). This creates natural antagonists for your judge.
  2.  **The Flaw:** Is there a flaw in her reasoning? A critic might argue that by ignoring harm, she ignores the *victim's* standing in the justice system. Retributivism is often criticized for being too agent-focused. Does your judge care? If she's a "hard" retributivist, she might say the victim's suffering is tragic, but irrelevant to the *offender's* desert. This makes her seem cold, which fits the "unapologetic" description.
  3.  **The Sabotage:** The fact that the gun was sabotaged by a third party is crucial. It means the attempter didn't even fail due to their own incompetence. They were thwarted by another agent. If anything, the attempter is *more* dangerous because they would have succeeded but for external intervention. Your judge could use this: *"She was stopped not by conscience, nor by skill, but by the hand of a saboteur. She is no less dangerous for it."*

  This framework gives your character a philosophically defensible, internally consistent, yet radical position that drives the plot forward through the consequences of that ruling.
