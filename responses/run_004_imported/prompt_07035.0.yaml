      *   *Section 1: The Philosophical Architecture.* (Control Principle, Culpability vs. Harm).
      *   *Section 2: Anticipating Counter-Arguments.* (Constitutive Harm, Legal Individuation).
      *   *Section 3: The Consequentialist Smuggle.* (Deterrence, Resources).
      *   *Section 4: Sample Judicial Voice.* (To help the writer).

  8.  *(Self-Correction during drafting)*: Wait, I need to be careful. The prompt asks me to *argue* that the consistent retributivist is committed to equal punishment. I shouldn't just list pros and cons. I need to make the case *for* the user's desired conclusion, while rigorously dismantling the opposition. The user wants the *argument*, not a debate. I will frame it as the "Hard Retributivist" position.

      *   *Key Point to Emphasize:* If desert is based on what you *chose*, and both chose death, the debt is identical. The jam is a fact of physics, not morality.

      *   *Refining the "Constitutive Harm" rebuttal:* If harm constitutes desert, then God/Nature is part of the sentencing judge. That abdicates moral agency.

      *   *Refining the "Individuation" rebuttal:* Legal categories are tools, not moral truths.

