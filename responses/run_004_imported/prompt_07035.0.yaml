prompt: |-
  I'm midway through a legal thriller whose plot turns on two cases reaching the same appellate court in the same term. In the first, a woman is convicted of attempted murder after the rifle she'd carefully sighted on her husband jams at the trigger — sabotage by a third party she never learns about — while every other fact of the case (premeditation, motive, the steps she took to ensure success) is identical to what it would have been had the gun fired. In the second, an unrelated defendant is convicted of completed murder under materially the same circumstances of planning and malice. My presiding judge character has spent the novel building a reputation as an unapologetic retributivist, someone who insists that punishment is justified by desert and by desert alone, and she now has to write the opinion explaining why the two defendants before her received such different sentences. I want her reasoning to be properly rigorous rather than something I hand-wave for the plot's convenience, so I'd like help thinking the philosophy through before I put words in her mouth.

  Specifically, I'd like you to argue that a consistent retributivist — one who holds that deserved punishment tracks the quality of the agent's will and choice rather than the harm that happens to follow from it — is thereby committed to punishing the failed attempt exactly as severely as the completed killing, and must treat any gap between the two sentences as a concession to luck rather than to justice. I've read enough of the moral-luck literature descending from Nagel and Williams to know the objection in outline, especially what Nagel calls resultant luck — luck in how things turn out — but most treatments I've come across stop at toy cases (the reckless driver who does or doesn't hit a pedestrian) rather than engaging with how a retributivist might actually resist the conclusion inside a real sentencing scheme: for instance, by insisting that the harm actually done is itself partly constitutive of what the agent deserves, not merely evidence of her culpability, or that the completed act individuates the crime in a way the failed one cannot. I'd like the argument to take that rejoinder seriously and show exactly where it fails, or where it only succeeds by quietly importing consequentialist considerations the retributivist was supposed to have foresworn, rather than just asserting that retributivism "has a problem with luck" and leaving it there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Genre:** Legal Thriller (needs to be dramatic but intellectually rigorous).
      *   **Core Conflict:** Two cases before the same appellate court.
          *   Case A: Attempted Murder (gun jammed due to sabotage).
          *   Case B: Completed Murder (same intent, planning, malice).
      *   **Protagonist:** A judge known as an *unapologetic retributivist* (punishment justified by desert alone, not consequences).
      *   **The Task:** The user wants an argument *for* the proposition that a *consistent* retributivist must punish attempt and completion equally.
      *   **Specific Constraint:** The argument must engage with counter-arguments (harm as constitutive of desert, individuation of crime) and show why they fail or smuggle in consequentialism. It needs to go beyond standard "moral luck" summaries (Nagel/Williams) and dig into sentencing theory.
      *   **Goal:** Provide the philosophical groundwork for the judge's opinion/reasoning.

  2.  **Deconstruct Retributivism & Moral Luck:**
      *   *Retributivism Core:* Punishment is deserved because of *culpability* (blameworthiness). Culpability is a function of the agent's mental state (mens rea) and voluntary action (actus reus).
      *   *The Problem:* In Attempt vs. Completion, the *mens rea* and the *voluntary actions* (up to the point of failure) are identical. The only difference is *resultant luck* (whether the bullet fired/killed).
      *   *The User's Thesis:* A consistent retributivist *must* punish them equally. Any difference is a concession to luck, not justice.
      *   *The Counter-Argument (to be refuted):* Harm matters. The completed crime is a different "kind" of wrong. The harm is part of the desert.
      *   *The Refutation Strategy:* Show that making harm constitutive of desert relies on outcomes outside the agent's control, which violates the control principle central to retributive justice. Show that distinguishing them often relies on deterrence (consequentialism) or expressive harm (which is tricky).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Define the judge's philosophical stance clearly. Retributivism = Desert based on Culpability. Culpability = Control.
      *   **The Control Principle:** This is the anchor. You can't deserve more punishment for things outside your control. Resultant luck is outside control. Therefore, resultant luck shouldn't change punishment.
      *   **Addressing the "Harm as Constitutive" Objection:**
          *   *Objection:* The wrong *is* the killing, not just the trying. The victim's death changes the moral landscape.
          *   *Counter:* Does the agent's *blameworthiness* change? No. The *badness of the world* changes, but the *badness of the will* remains constant. Retributivism punishes the *will*, not the state of the universe.
          *   *Nuance:* If we punish based on harm, are we punishing for the *loss* to the victim/community? That sounds utilitarian/consequentialist (restoring balance, preventing grief). A pure retributivist cares about the *offender's* debt, which is incurred at the moment of the wrongful choice.
      *   **Addressing the "Individuation of Crime" Objection:**
          *   *Objection:* Attempt and Murder are legally and morally distinct tokens.
          *   *Counter:* They are distinct *legal* categories for administrative reasons, but morally identical regarding the agent's desert. Distinguishing them creates a "lottery of justice."
      *   **The Consequentialist Smuggle:**
          *   Why do we actually punish attempts less? Usually deterrence (no harm to undo) or plea bargaining leverage.
          *   If the judge admits this, she breaks character. She must expose this as impure.
      *   **The "Unfinished Wrong" Argument:**
          *   Some argue the attempter hasn't *fully* realized their will.
          *   Counter: They did everything they intended. The jam was external. The will was fully executed in action, just not in result.

  4.  **Structuring for the User (The Novelist):**
      *   I need to provide this not just as a philosophy essay, but as *material* for the character.
      *   Break it down into:
          1.  **The Core Principle:** The Control Condition.
          2.  **The Attack on Harm:** Why harm is morally arbitrary from the agent's perspective.
          3.  **Refuting the "Constitutive Harm" Rejoinder:** Distinguishing "badness of outcome" from "badness of agent."
          4.  **Exposing the Consequentialist Smuggle:** Why the law *currently* distinguishes them (and why the judge thinks that's wrong).
          5.  **Drafting the Opinion:** A sample passage showing the voice.

  5.  **Refining the Philosophy (Self-Correction/Deep Dive):**
      *   *Check:* Did I address the "harm is constitutive" point specifically?
      *   *Adjustment:* I need to make sure I distinguish between *wrongdoing* and *blameworthiness*. A retributivist can admit the completed murder is a "worse event" but argue it doesn't make the *murderer* a more blameworthy *person*. The punishment tracks the person's desert, not the event's tragedy.
      *   *Check:* Is this too academic?
      *   *Adjustment:* Keep the language sharp, judicial, and authoritative. Use metaphors suitable for a legal opinion.
      *   *Key Philosophical Reference:* Michael Moore (Placing Blame) is the big retributivist who argues harm *does* matter. I need to argue *against* Moore or distinguish the user's judge from him. Actually, the user wants the argument *for* equal punishment (like Andrew Ashworth or the Model Penal Code's theoretical basis, though MPC is often utilitarian). Let's stick to the "Control Principle" (Feinberg/Zimmerman).
      *   *Crucial Distinction:* The "Objectivist" vs. "Subjectivist" view of attempts. Retributivism usually leans Subjectivist regarding *culpability*, even if Objectivist regarding *action*. The judge needs to argue that once the action is undertaken with intent, the moral debt is fully incurred.

  6.  **Final Polish:**
      *   Ensure the tone matches a legal thriller (high stakes, intellectual tension).
      *   Make sure the distinction between "Retributive Justice" and "Legal Pragmatism" is clear.
      *   Highlight the specific sabotage element (the jam). This removes even the "voluntary desistance" or "inherent impossibility" defenses. It is pure luck.

