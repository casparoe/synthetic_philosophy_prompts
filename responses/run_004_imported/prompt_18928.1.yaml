answer: |-
  Good morning.

  If [Uncle's Name] were standing here today, looking out at this room, he wouldn't see two groups. He wouldn't see "colleagues" on one side and "family" on the other. He wouldn't see a division between the heavy history of the 90s and the Sunday lunches of the 2000s.

  He would just see people. And more importantly, he would see the invisible threads tying us all together.

  We often talk about a life as if it's a straight line. A timeline of achievements. What he did, where he worked, what he built. But [Uncle's Name] taught us that a life isn't a line. It's a web. It's the space between people.

  To those of you who worked with him during the Commission years: You know better than anyone that he didn't view his work as law, or policy, or even justice in the cold sense. He viewed it as healing. He knew that when you sit across from someone who has caused harm, or someone who has suffered harm, you aren't just processing a case. You are attempting to restore a broken piece of the world. He carried the weight of that. We know he did. But he never carried it in silence. He carried it with us, and he carried it home.

  And to those of us who knew him as Dad, as Uncle, as Oupa: We saw that same spirit at the kitchen table.

  He wasn't the kind of Oupa who just handed over sweets and patted heads. He was the kind who sat on the floor. He wanted to know the names of your friends. He wanted to know why you were sad, not just to fix it, but to sit with you in it. He made us feel that we only truly existed when we were acknowledged by each other. When he looked at you, you felt real. That was his gift. He made us human, by being human with us.

  He had a saying. He said, "The worst thing you can say about someone at their funeral is that they did it all on their own."

  So, I am not going to stand here and tell you he was a hero who stood tall against the odds. I am not going to tell you he was a self-made man. Because he would hate that. He would tell you that he was made by his mother's hands, by his wife's patience, by his children's laughter, and by the courage of the strangers who trusted him with their stories.

  He was made by *us*.

  And that is why we are here. Not just to say goodbye, but to acknowledge that the work he believed in doesn't end when his heart stops beating. Because if a person is a person through other people, then [Uncle's Name] is still here. He is here in the way his colleagues continue to seek restoration over retribution. He is here in the way his grandchildren comfort their friends when they are hurting. He is here in the way we treat the strangers we meet.

  In the tradition he loved, there is a phrase: *Umuntu ngumuntu ngabantu*. A person is a person through other people.

  Today, we are the *abantu*. We are the people.

  So, the best way to honor him is not to stand here in silence, mourning the loss of one man. The best way to honor him is to turn to the person sitting next to you—whether you've known them for forty years or forty minutes—and to acknowledge them. To listen. To repair a small broken thing between you.

  He spent his life weaving us together. Let us not let the web unravel now.

  Rest well, [Uncle's Name]. You are with us. And because we are here, together, you are not gone.

  Thank you.
