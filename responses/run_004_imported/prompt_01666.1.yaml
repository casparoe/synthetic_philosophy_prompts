answer: |-
  The puzzle you describe is known as **Moore's Paradox**. It stands as one of the most famous problems in the philosophy of language and epistemology.

  To answer your question directly: The absurdity arises not from the **logic of the proposition**, but from the **pragmatics of the speech act**. The distinction between the first-person present-tense case and the other variations lies in the relationship between *asserting* a fact and *avowing* a belief.

  Here is a detailed breakdown of why the first-person present-tense assertion is absurd while the others are not.

  ### 1. Logical Consistency vs. Pragmatic Absurdity
  Moore was correct that the proposition is logically consistent. It is a contingent fact of the world that a person can do something without believing they did it (e.g., due to amnesia, sleepwalking, or self-deception). Therefore, the sentence *"I went to the pictures, but I do not believe that I did"* describes a possible state of affairs. It is not a logical contradiction like *"I went to the pictures and I did not go to the pictures."*

  However, logic governs **truth conditions**, while assertion governs **commitments**. When you assert a statement, you are not merely describing the world; you are performing an action that carries specific normative commitments.

  ### 2. The Nature of Assertion (The Wittgensteinian Insight)
  The most influential explanation comes from Ludwig Wittgenstein, who discussed Moore's Paradox extensively. Wittgenstein argued that in the first-person present tense, an assertion of fact and an avowal of belief are functionally equivalent.

  *   To say **"It is raining"** is to express the belief that it is raining.
  *   To say **"I believe it is raining"** is also to express the belief that it is raining.

  In the first-person present, "I believe" does not function as a description of an inner mental state (like "He believes"); rather, it is a **modification of the assertion**.

  Therefore, when you assert the Moorean sentence:
  1.  **Clause 1 ("I went to the pictures"):** By asserting this, you represent yourself as believing it. You invite your audience to trust your word.
  2.  **Clause 2 ("but I do not believe that I did"):** You explicitly retract the very commitment you just made in Clause 1.

  The absurdity is a **performative contradiction**. You are simultaneously giving your audience a reason to believe $P$ (by asserting it) and a reason not to believe $P$ (by admitting you don't believe it yourself). You are effectively saying, "Trust me on this, but I don't trust myself on this."

  ### 3. Why the Past Tense Resolves the Absurdity
  When you shift to the past tense—*"I went to the pictures, but I **did not** believe that I did"*—the performative contradiction vanishes.

  *   **Current Act:** You are currently asserting that you went. This implies you *currently* believe you went.
  *   **Reported State:** You are reporting that *in the past*, you lacked that belief.

  There is no conflict between believing something *now* and acknowledging that you lacked that belief *then*. You can sincerely assert the fact now while honestly reporting your previous ignorance or self-deception. The commitment of the current speech act does not clash with the description of a past mental state.

  ### 4. Why the Third Person Resolves the Absurdity
  When you shift to the third person—*"He went to the pictures, but he **does not** believe that he did"*—the absurdity also vanishes.

  *   **Your Act:** You are asserting a fact about *him*. This implies *you* believe the fact about him.
  *   **Reported State:** You are reporting on *his* mental state.

  There is no contradiction between *your* belief about his actions and *his* lack of belief about his actions. You are not retracting your own commitment; you are simply highlighting a discrepancy between the world and his mind. The norm of assertion requires *you* to believe what *you* say; it does not require *him* to believe what *you* say about him.

  ### 5. Norms of Assertion
  Contemporary epistemology often frames this through the **Norms of Assertion**. A widely accepted rule of conversation is: **"One should not assert that $P$ unless one believes (or knows) that $P$."**

  *   **Moore's Sentence:** Violates this norm directly. You are asserting $P$ while explicitly stating you fail the condition required to assert $P$.
  *   **Past Tense:** Does not violate the norm. You currently believe $P$, so you are allowed to assert it. The fact that you didn't believe it in the past is irrelevant to your current license to speak.
  *   **Third Person:** Does not violate the norm. You believe the conjunction (that he went + that he doesn't believe it), so you are licensed to assert the whole sentence.

  ### Summary
  The "oddness" Moore identified is a **pragmatic paradox**, not a logical one.

  The first-person present-tense case is unique because the act of asserting the first clause **constitutes** the expression of the belief that the second clause **denies**. In the past tense, the belief is separated by time; in the third person, the belief is separated by agency. Only in the first-person present does the speaker's action and the speaker's reported self-knowledge collide in the same moment, rendering the assertion self-defeating.
