      *   **Key Constraint:** Don't just rehash the standard coherence story. Identify exactly where the disanalogy bites. The user suspects the bookie's knowledge of the updating rule is the weak point.

  2.  **Deconstruct the Arguments:**
      *   **Synchronic Dutch Book:**
          *   Agent has credences $P$ at time $t_1$.
          *   Bookie offers bets based on $P$.
          *   If $P$ violates axioms, Bookie constructs a set of bets accepted by Agent that guarantee loss.
          *   *Key Feature:* All bets are offered and accepted at the *same* time based on *current* dispositions. No external knowledge of future behavior needed beyond current betting quotients.
      *   **Diachronic Dutch Book (Lewis/Teller style):**
          *   Agent has credences $P_1$ at $t_1$.
          *   Agent has a *plan* (updating rule) for $t_2$ upon learning $E$.
          *   Bookie offers a bet at $t_1$ (based on $P_1$) and a bet at $t_2$ (based on $P_2$).
          *   If the plan isn't Conditionalization ($P_2(H) \neq P_1(H|E)$), Bookie guarantees loss.
