      *   Idea: Clifford says the shipowner is guilty even if the ship *doesn't* sink. So, if Aaron is the shipowner, and the marriage succeeds, Clifford *still* condemns him. But James absolves him. The victory is that Aaron is willing to be "guilty" in Clifford's eyes to be happy in James's.
      *   Better Idea: The ship represents the future. Clifford says "Don't launch until you know the weather." James says "You can't know the weather. Launch." Aaron launched.

  8.  **Final Review against Constraints:**
