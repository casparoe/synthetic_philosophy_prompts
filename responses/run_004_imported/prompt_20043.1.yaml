  ### What Strawson Would Say They Are Missing

  Strawson would argue that both Priya and Dev are treating moral responsibility as a **theoretical problem** about metaphysical freedom (cause, choice, and prediction) rather than a **practical feature of human relationships**.

  1.  **Participant vs. Objective Stance:** Dev is attempting to take an *objective attitude* toward Jordan, viewing him as a subject to be managed or excused (like a patient with a seizure). Priya is demanding a *participant attitude*, where Jordan is viewed as a moral agent within a friendship. Strawson argues we cannot simply choose the objective stance without damaging the relationship; resentment is a natural protest against perceived indifference, not a theoretical verdict.
  2.  **Quality of Will:** The core issue for Strawson is not whether Jordan "could have done otherwise" in a metaphysical sense, but whether his actions expressed **ill will or indifference**. Priya is closer to this by focusing on the lack of a backup plan as evidence of indifference. Dev misses this by focusing solely on the involuntary nature of the attack.
  3.  **The Function of Apologies:** Dev admits Jordan owes an apology, which undermines his claim that there are "no grounds for resentment." For Strawson, apologies are the mechanism by which reactive attitudes (like resentment) are allayed and relationships repaired. By acknowledging the need for an apology, Dev implicitly acknowledges that Jordan's *quality of will* was at fault, even if the specific absence was incapacitated.
  4.  **The "Proves Too Much" Argument:** Strawson agrees with Priya's fourth move. We do not suspend our reactive attitudes simply because actions are determined or stem from unchosen character traits. To do so would require abandoning interpersonal relationships altogether. The question is not "Was this caused?" but "Does this action fit within the normal expectations of our shared life?"
