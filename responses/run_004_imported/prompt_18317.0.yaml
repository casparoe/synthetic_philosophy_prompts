answer: |-
  **The Arithmetic of Survival: Why Taurek Was Wrong About the Numbers**

  The scenario is a staple of introductory ethics classes, but as you discovered, it keeps its teeth long after graduation. You are the sole possessor of a life-saving drug. On one side stands David. On the other stand five strangers. You cannot split the dose. If you save David, the five die. If you save the five, David dies.

  Most people's intuition screams: save the five. But in his seminal 1977 paper *"Should the Numbers Count?"*, philosopher John Taurek challenged this intuition with a argument so unsettling it can sustain a two-hour roommate argument. Taurek claimed that the numbers *should not* matter. He argued that there is no moral obligation to save the greater number, and that a coin flip between the two parties is not only permissible but perhaps more respectful of individual value.

  Your roommate was channeling a profound philosophical insight, but ultimately, she was defending a position that collapses under its own weight. Taurek's argument is a masterpiece of logical consistency regarding the "separateness of persons," but it fails because it misunderstands how moral claims aggregate. While Taurek correctly identifies that suffering is not a collective substance, he is wrong to conclude that we should be indifferent to the sum of individual tragedies. By analyzing the counter-arguments of Derek Parfit and T.M. Scanlon, we can arrive at a necessary verdict: Taurek's refusal to count heads is not a defense of the individual, but a erasure of them. To respect persons as separate beings, we must count them.

  ### The Taurek Case: Loss Cannot Be Summed

  To defeat Taurek, we must first understand why he isn't insane. His argument rests on a metaphysical claim about the nature of loss. Utilitarianism assumes that "happiness" or "suffering" is like a liquid that can be poured from one container to another; if we can contain more total happiness, we should. Taurek rejects this. He argues that there is no "social entity" that experiences the sum of five deaths.

  David experiences the loss of his life. Each of the five experiences the loss of their own life. But there is no "super-observer" who experiences the loss of six lives. As Taurek famously wrote, "The loss of David's life is not worse than the loss of any one of the five." If you cannot compare David's loss to the *sum* of the five (because no one feels that sum), then you have no basis for privileging the group.

  From this perspective, flipping a coin (or using a lottery to give each individual an equal 1-in-6 chance) is the only way to show "equal concern and respect." If you automatically save the five, Taurek argues you are treating David as a mere means to the end of maximizing survival statistics. You are telling David that his life counts for less because he is outnumbered. Taurek's position is a radical defense of the individual against the tyranny of the aggregate. It is elegant, consistent, and deeply humane in its intent.

  ### The Pushback: Parfit and Scanlon

  However, elegance does not equal truth. Two philosophers, Derek Parfit and T.M. Scanlon, dismantled Taurek's position by showing that one can respect the separateness of persons *without* ignoring the numbers.

  Derek Parfit, in *Reasons and Persons*, tackled the metaphysical hurdle. He agreed with Taurek that there is no "group mind" that suffers the aggregate loss. However, Parfit argued that an outcome can be "worse" without being "worse for" a specific collective subject. Parfit introduced the idea that we can compare individual losses across persons. Even if the five don't share a brain, it is still objectively true that five distinct tragedies are occurring rather than one. Parfit argued that the "Impersonal Total Principle" holds: it is worse if more people suffer, even if that "worseness" isn't felt by a single entity. To ignore this is to ignore the reality of the world. If you can prevent five disasters or one disaster, and the disasters are of equal magnitude, choosing the one is irrational.

  T.M. Scanlon offered an even more damning critique from the perspective of contractualism (what we owe to each other). In *What We Owe to Each Other*, Scanlon asks: Can the principle you act on be reasonably rejected by others?

  Imagine you are one of the five. You are left to die so that David may live. You ask the rescuer, "Why?" If the rescuer says, "I flipped a coin," you have a strong case that your claim was discounted. Scanlon argues that each of the five has a claim to be saved that is equal to David's claim. If you have five equal claims on one side and one equal claim on the other, the side with five claims has a stronger moral weight. To ignore the numbers is not to treat David equally; it is to treat the five *as if they were one person*. It lumps them into a bloc, effectively violating the very "separateness of persons" Taurek claimed to protect.

  ### The Verdict: Counting is the Only Way to Respect Persons

  Here is the verdict: Taurek is wrong. You were right to feel that flipping a coin was insane, not because you are a cold utilitarian, but because Taurek's logic inadvertently devalues human life.

  Taurek's fatal flaw is that he treats the *choice* as being between two options (Save David vs. Save the Five) rather than between six individuals. By advocating for a coin flip between the two groups, he gives David a 50% chance of survival, but he gives each of the five only a 10% chance (if the 50% for the group is split among them) or effectively pits one person's 50% against a group's 50%.

  If we truly believe in the separateness of persons, we must acknowledge that there are six people in this scenario, not two parties. If every person has an equal right to life, and you can only save a subset, the moral demand is generated by the number of rights-holders. Saving the five does not mean David's life is worth less; it means that the moral imperative to save a life is triggered five times instead of once.

  Consider the "complaint" model. If you save David, five people have a valid complaint against you: "You let me die." If you save the five, only one person has a valid complaint: "You let me die." While David's complaint is just as loud as any single one of the five, the sheer volume of justified complaints is greater if you save the one. To act morally is to minimize the number of people who have a justified grievance against your action.

  Furthermore, Taurek's argument leads to absurdities in broader contexts. If numbers never count, then in a triage situation at a hospital, a doctor should flip a coin between saving one patient with a minor injury and five patients with fatal injuries, provided the "loss" is viewed individually. This paralyzes moral action. It suggests that the scale of a tragedy is irrelevant as long as the tragedy is distributed across different people. This is not humility; it is moral blindness.

  ### Conclusion

  Your roommate was right to bring up Taurek because his argument forces us to justify *why* we save the many, rather than just doing it on autopilot. He correctly identified that we cannot simply add up suffering like dollars in a bank account. However, he drew the wrong conclusion from that premise.

  The separateness of persons does not require us to ignore numbers; it requires us to count them correctly. We do not save the five because their collective death is a "bigger tragedy" in a metaphysical sense. We save the five because there are five individuals who want to live, and only one who will be left behind. To flip a coin is to pretend that five voices shouting for help sound the same as one. The moral imperative is not to maximize a abstract "good," but to honor the individual claims of as many people as possible. In the choice between David and the five, the only way to respect the separateness of persons is to acknowledge that five is greater than one.
