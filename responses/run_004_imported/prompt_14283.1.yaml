prompt: |-
  So I'm on the exec board for my school's National Honor Society chapter, and I'm the one who checks everyone's community service hours each semester (you need 10 to stay a member). Lately people have been turning in hours that technically count but clearly arent the point of the rule, like 'watched my baby cousin so my aunt could work, 5 hrs, signed by aunt.' Our advisor wants to fix this by only counting hours done through registered nonprofits from now on, but two other officers are pushing back tho, since not everyone has a car to get to a food bank every week, so that rule would basically only work for kids with more free time or money, while stuff like tutoring a neighbor's kid for free (which is genuinely good) wouldnt count anymore. We vote on whatever we decide at next Tuesday's meeting. Can you write the recommendation memo I'd actually bring -- what we should do about verifying hours, when it'd start, and why -- and make sure it deals with the access problem instead of just brushing it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Executive Board Member of a high school National Honor Society (NHS) chapter.
      *   **Task:** Write a recommendation memo for the upcoming board meeting (next Tuesday).
      *   **Problem:** Members are submitting questionable community service hours (e.g., babysitting family) that meet technical requirements but miss the spirit of the rule (10 hours/semester).
      *   **Proposed Solution (Advisor):** Only count hours through registered 501(c)(3) nonprofits.
      *   **Counter-Argument (Other Officers):** This creates equity/access issues (transportation, cost, time) and excludes genuine service like informal tutoring.
      *   **Goal:** Create a balanced policy that ensures integrity *and* accessibility.
      *   **Key Elements:** Verification method, start date, rationale (addressing the access problem).

  2.  **Determine the Tone and Format:**
      *   **Tone:** Professional, persuasive, collaborative, equitable, and decisive. It needs to sound like a student leader proposing a solution to peers and an advisor.
      *   **Format:** Standard Memo format (To, From, Date, Subject).
      *   **Structure:** Background/Problem, Proposed Policy, Implementation Timeline, Rationale (specifically addressing equity), Next Steps.

  3.  **Brainstorming the Solution (The "Third Way"):**
      *   *Option A (Status Quo):* Too loose, integrity issues.
      *   *Option B (Advisor's Plan):* Too strict, equity issues.
      *   *Option C (Hybrid):* Allow pre-approved informal service + Nonprofit service.
      *   *Key Mechanism:* Pre-approval. If you want to do something non-traditional (tutoring, helping a neighbor), you must get it approved *before* doing the hours. This stops the "babysitting cousin" loophole because that likely wouldn't get approved as "community service" vs. "family obligation," but "tutoring a neighbor's kid in math" might.
      *   *Verification:* Needs a signature from a non-family member if possible, or a reflection component.
      *   *Access:* Explicitly acknowledge transportation barriers and allow school-based or virtual options.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo details.
      *   **Purpose:** State clearly what this memo is for (policy recommendation).
      *   **Current Situation:** Briefly explain the loophole (family care vs. community service) without calling people out by name.
      *   **The Recommendation:**
          *   Keep the 10-hour requirement.
          *   Create two "Tiers" or "Categories" of service.
          *   *Category 1:* Registered Nonprofits (Auto-approved).
          *   *Category 2:* Independent Projects (Requires pre-approval).
          *   *Crucial Constraint:* No immediate family compensation or supervision for Category 2. (Solves the aunt/baby cousin issue).
          *   *Verification:* Supervisor signature + brief reflection (proves impact).
      *   **Addressing Equity (The Core Request):**
          *   Acknowledge the transportation issue.
          *   Highlight school-based opportunities (tutoring in the library, food drives on campus).
          *   Highlight virtual opportunities.
          *   Emphasize that the "Pre-Approval" process is there to help students find valid options, not just block them.
      *   **Timeline:** Start next semester (gives time to communicate).
      *   **Conclusion:** Call to action for the vote.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Pre-approval" too much bureaucracy for high schoolers?
      *   *Fix:* Make it a simple Google Form. Keep it low friction.
      *   *Critique:* Does this solve the "aunt" problem?
      *   *Fix:* Explicitly state that service cannot be for immediate family members. That kills the babysitting loophole immediately.
      *   *Critique:* Does this solve the access problem?
      *   *Fix:* Yes, by validating school-based and neighbor-based service *if* it's not family, and acknowledging that transport is a barrier.
      *   *Tone Check:* Ensure I'm not sounding like I'm policing my friends, but rather protecting the value of the NHS cord/stole.

  6.  **Final Polish:**
      *   Check for clarity and conciseness.
      *   Ensure the "Why" is strong.
      *   Make sure the equity argument is central, not an afterthought.

  7.  **Final Output Generation:** (This matches the provided good response.)
      *   *Subject:* Recommendation for Community Service Hour Policy Update.
      *   *Key Policy:* Pre-approval for non-501(c)(3) work + No immediate family beneficiaries.
      *   *Equity Focus:* School-based options, virtual options, clear guidelines so no one wastes time.

  8.  *(Post-Drafting Review)*: Does this meet all user constraints?
      *   Memo format? Yes.
      *   Verification method? Yes (Pre-approval + Supervisor sig).
      *   Start date? Yes (Next Semester).
      *   Why? Yes (Integrity + Equity).
      *   Deals with access? Yes (Explicit section).

      *Ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** NHS Executive Board & Faculty Advisor
  **FROM:** [Your Name], Executive Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Community Service Hour Verification Policy Update

  **Purpose**
  The purpose of this memo is to propose a revised policy for verifying community service hours for the [School Name] NHS chapter. This recommendation aims to balance the integrity of our service requirements with equitable access for all members, addressing concerns raised by both the Faculty Advisor and the Executive Board.

  **Current Challenge**
  Our current requirement of 10 service hours per semester is essential to maintaining the "Service" pillar of NHS. However, recent submissions have highlighted a loophole: hours that benefit immediate family (e.g., babysitting relatives) are being submitted. While valuable at home, these do not meet the National NHS Constitution's definition of service, which specifies work that benefits the *community* outside one's immediate household.

  Conversely, restricting hours strictly to registered 501(c)(3) nonprofits creates a barrier for members without reliable transportation or flexible schedules, potentially excluding valid service like neighborhood tutoring or elder assistance.

  **Recommendation**
  I propose a **Hybrid Verification Policy** effective for the **Spring 2024 Semester**. This policy categorizes service into two tracks with specific verification methods:

  **1. Track A: Registered Organizations (Auto-Approved)**
  *   **Definition:** Hours completed through recognized nonprofits, religious organizations, or government agencies.
  *   **Verification:** Standard supervisor signature.
  *   **Benefit:** No pre-approval needed; encourages long-term partnerships.

  **2. Track B: Independent Community Projects (Pre-Approval Required)**
  *   **Definition:** Informal service not tied to a nonprofit (e.g., tutoring a neighbor's child, assisting an elderly neighbor with yard work, organizing a peer study group).
  *   **Verification:**
      *   **Pre-Approval:** Member must submit a brief Google Form describing the activity *before* starting hours.
      *   **Beneficiary Restriction:** Service cannot be for immediate family members (parents, siblings, cousins, etc.).
      *   **Supervisor Signature:** Must be signed by the recipient of the service or a community witness (not a parent/relative).
      *   **Reflection:** A 2-sentence reflection on the impact of the service must accompany the log.

  **Addressing Equity and Access**
  This policy is designed specifically to avoid penalizing members with limited transportation or financial resources.
  *   **Validating Local Impact:** By allowing Track B, we acknowledge that taking a bus to a food bank isn't the only way to serve. Helping a neighbor or tutoring a peer is valid community building, provided it isn't a family obligation.
  *   **School-Based Opportunities:** The Exec Board will coordinate with the Advisor to maintain a list of on-campus service opportunities (e.g., library shelving, peer tutoring center, campus cleanup) that require zero travel.
  *   **Clarity Prevents Wasted Effort:** The pre-approval process protects students from spending 10 hours on a project only to have it rejected later. It serves as guidance, not just policing.

  **Implementation Timeline**
  *   **Vote:** Tuesday, October 31 (Next Board Meeting).
  *   **Announcement:** November 7 (General Membership Meeting).
  *   **Effective Date:** January 1, 2024 (Start of Spring Semester).
  *   **Grace Period:** Any hours logged before December 31, 2023, will be accepted under the old guidelines to ensure no current members are penalized during the transition.

  **Rationale**
  Adopting this hybrid model protects the prestige of our NHS chapter by ensuring hours reflect genuine community outreach, not family chores. Simultaneously, it upholds our commitment to inclusivity by recognizing that service looks different for different students. It solves the "baby cousin" loophole through the family restriction while solving the "no car" loophole by validating local, independent, and school-based service.

  **Next Steps**
  I request the Board vote on this recommendation next Tuesday. If approved, I will draft the Pre-Approval Google Form and the updated Member Handbook language for Advisor review by November 15.

  Thank you for your consideration.
