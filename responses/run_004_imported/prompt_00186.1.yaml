      *   *Smoking Lesion Problem:* A classic counterexample to naive EDT. Smoking is correlated with cancer, but only because a lesion causes both the desire to smoke and cancer. Smoking doesn't cause cancer. EDT says "Don't smoke" (bad news). CDT says "Smoke" (no causal impact). The "Tickle Defense" suggests that once you condition on your internal urge (the tickle), the correlation disappears.
      *   *The User's Analogy:* The user sees ECL as relying on correlation without causation (like EDT in Smoking Lesion) and wonders why ECL proponents don't apply the Tickle Defense to dismiss the correlation between "me cooperating" and "alien counterpart cooperating."
      *   *Crucial Correction/Nuance:* ECL is *not* typically advocated by pure EDT proponents. It is usually advocated by proponents of *Functional Decision Theory (FDT)*, *Timeless Decision Theory (TDT)*, or *Updateless Decision Theory (UDT)*. Sometimes it's framed within EDT, but the robust version relies on *logical* or *subjunctive* dependence, not mere statistical correlation.
      *   *The "Tickle Defense" Application:* The Tickle Defense works when the correlation is due to a *common cause* that is screened off by introspection. In ECL/Superrationality, the "common cause" is the *algorithm* or *decision procedure* itself. You cannot screen off your own decision procedure without ceasing to be the decision-maker.

  3.  **Formulating the Distinction:**
      *   *Case 1: Smoking Lesion.*
