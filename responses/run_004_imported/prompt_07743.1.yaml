prompt: |-
  I sit on the academic integrity board at my university, and we've got a case on the docket next month that's messier than the usual copy-paste plagiarism stuff, and it's kind of eating at me. A five-person senior capstone team submitted one joint final report under all five names, and it turns out the test data behind one section's conclusions was made up. Two of the five, Priya and Jordan, admit they fabricated it because the prototype kept failing bench tests and they'd run out of time before the deadline. Ana, the nominal team lead, didn't fabricate anything herself, but she signed the certification page attesting the results were accurate, and she's told us privately that she had a bad feeling about that section but didn't push it because she didn't want another fight with Priya and Jordan that week. Marcus joined the team three weeks before submission, replacing someone who dropped the course, and says he had no idea any of the data was fabricated. Sam actually flagged the weirdness in the team's group chat two months ago, was told to drop it, and did.

  The board is split down the middle. Half want to sanction the team as a unit — five names went on one document, they held themselves out as a team, so it's the team's failure that gets sanctioned, with individual circumstances treated as mitigation at most. The other half thinks that's basically a fiction: only individuals actually know things and decide things, so you can only punish people for what they personally knew or chose, and "the team failed" is just a loose way of describing five seperate stories stapled together. (I mentioned all this to a friend who does philosophy of action as a hobby, and she said "oh, that's just Bratman vs. Gilbert" and went back to her crossword, so thanks for nothing there.) What I actually need is the memo I can put in front of the board before we meet: a real recommendation for what happens to each of the five, not a menu of options, reasoned in a way the individual-responsibility camp could read and feel genuinely answered rather than steamrolled — and it needs a timeline, since final grades are due to the registrar in eleven days.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Academic Integrity Board.
      *   **Task:** Write a memo with a *specific recommendation* for sanctions for each of the five students (Priya, Jordan, Ana, Marcus, Sam).
      *   **Context:** Senior capstone project, joint report, fabricated data in one section.
      *   **The Conflict:** The board is split between "Collective Responsibility" (team sanction) vs. "Individual Responsibility" (only punish what you knew/did).
      *   **The Constraint:** Needs to appeal to the "Individual Responsibility" camp (philosophically robust) while acknowledging the collective nature of the project. Needs a timeline (11 days until grades).
      *   **The Hint:** Friend mentioned "Bratman vs. Gilbert" (Philosophy of Action/Social Ontology).
          *   *Michael Bratman:* Shared Intentionality (planning together, meshing sub-plans).
          *   *Margaret Gilbert:* Joint Commitment (plural subjects, obligation to the group).
      *   **Goal:** A reasoned argument that bridges the gap, avoiding "steamrolling" either side, leading to a decisive outcome.

  2.  **Deconstruct the Students' Roles & Culpability:**
      *   **Priya & Jordan:** Fabricated data. Admitted guilt. Direct violation of integrity. *High Culpability.*
      *   **Ana:** Team lead. Signed certification. Suspected issues but stayed silent to avoid conflict. *Negligence/Complicity.*
      *   **Marcus:** Late joiner (3 weeks prior). Claims ignorance. *Potential Lack of Knowledge/Capacity.*
      *   **Sam:** Flagged issues in chat, told to drop it, complied. *Whistleblower (failed)/Coerced?*

  3.  **Address the Philosophical Conflict (Bratman vs. Gilbert):**
      *   *The Problem:* The "Individualists" say only individuals act. The "Collectivists" say the team acted.
      *   *The Bridge:* Shared Intentionality (Bratman). A team isn't a mystical entity, but it *is* a structure of interlocking commitments. When you join a capstone team, you enter a *joint commitment* (Gilbert) to produce honest work. However, sanctions must track *individual participation* in that commitment (Bratman).
      *   *Strategy:* Acknowledge the individualist premise (yes, only individuals act) but argue that *inaction* in the face of a joint commitment is itself an individual act of negligence. This satisfies the individualists (we are punishing individual choices) while upholding the collective standard (the choice was about the team obligation).

  4.  **Drafting the Recommendations (The "What"):**
      *   *Priya & Jordan:* Failure of the course + Suspension/Probation. They lied.
      *   *Ana:* Failure of the course (or severe grade reduction). She had authority and suspicion but chose silence. That's an individual ethical failure.
      *   *Marcus:* Pass/Probation? He lacked capacity to know. But he signed the report. Maybe a reduced sanction (Grade reduction but not failure, or Pass with integrity probation). Let's go with *Pass with Integrity Probation*. He signed it, so he bears some responsibility for verification, but his capacity was limited.
      *   *Sam:* This is the trickiest. He spoke up. He was silenced. If we punish him, we kill whistleblowing. If we exonerate him completely, did he abdicate his duty? He needs to be *Exonerated* but perhaps required to complete an ethics module. Punishing him undermines the integrity system.
      *   *The "Team" Aspect:* The project itself fails. The degree might be delayed.

  5.  **Developing the Argument (The "Why"):**
      *   Must explicitly address the "Individual Responsibility" camp.
      *   Argument: "Responsibility tracks *agency*, not just *action*."
      *   Ana didn't fabricate, but she *chose* not to verify. That is an act.
      *   Sam *chose* to comply under pressure, but the power dynamic matters.
      *   Marcus *chose* to sign, but his epistemic access was limited.
      *   Use the Bratman/Gilbert reference intelligently. Gilbert explains the *obligation* (Joint Commitment), Bratman explains the *individual planning* required to meet it. Sanctions apply where individual planning failed to meet the joint commitment.

  6.  **Timeline (The "When"):**
      *   Today: Memo distribution.
      *   Day 3: Board Vote.
      *   Day 5: Notification to Students (Right to Appeal).
      *   Day 8: Appeal Window Closes.
      *   Day 10: Final Ruling to Registrar.
      *   Day 11: Grades Due.

  7.  **Refining the Tone:**
      *   Formal, administrative, yet philosophically grounded.
      *   Empathetic but firm.
      *   Decisive (no "options," just "recommendations").

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is punishing Ana too harsh? She didn't lie.
      *   *Correction:* In senior capstones, the Lead's signature is a verification mechanism. Ignoring a "bad feeling" is professional negligence. It must be sanctioned to maintain the value of the signature.
      *   *Critique:* Is Sam off the hook?
      *   *Correction:* He needs to be cleared. If we sanction him, we teach students *not* to report issues. However, he did submit a fraudulent report. The recommendation should be "No Sanction" but perhaps a requirement to attest to the correction. Actually, keep it clean: No Sanction.
      *   *Critique:* Marcus?
      *   *Correction:* He signed the certification. Ignorance is not a total defense if you sign a legal/academic document. But his culpability is low. Probation is appropriate.
      *   *Philosophy Check:* Ensure I don't just say "Gilbert says X." Explain *why* it matters for the Individualists. The key is that the "Joint Commitment" creates individual obligations.

  9.  **Final Polish:** Check the timeline math (11 days). Ensure the distinction between the "Collective" argument and the "Individual" argument is bridged, not ignored. (The memo should explicitly state: "We are not punishing the team as a hive mind; we are punishing five individuals for how they navigated their specific obligations within a joint enterprise.")

  10. **Final Output Generation** (Proceed to write the memo based on these points).

  *(Self-Correction on the Philosophy)*: My friend mentioned Bratman vs. Gilbert.
  *   **Gilbert (Joint Commitment):** The team is a "plural subject." They are obligated *as a body*. If the body fails, the body is guilty.
  *   **Bratman (Shared Intention):** It's about interlocking individual intentions. "I intend that we J" + "You intend that we J."
  *   **The Bridge for the Memo:** The Individualists are Bratmanians (focus on individual mental states). The Collectivists are Gilbertians (focus on the group obligation).
  *   **The Solution:** Use Bratman to satisfy the Individualists. Show that even within a framework of *individual* intentions, Ana, Marcus, and Sam had specific intentional states (negligence, willful blindness, coercion) that warrant distinct outcomes. We don't need to accept the "plural subject" to punish the enablers. We punish them for their *individual* failure to uphold the *individual* intention required to participate in the joint activity.
  *   *Wait, actually:* To persuade the Individualists, I should argue that *joining the team* was an individual speech act that created individual obligations. So punishing Ana isn't punishing "the team," it's punishing Ana for her individual breach of the contract she signed. This aligns with Bratman's "meshing sub-plans." Ana's sub-plan (avoid conflict) clashed with the shared plan (honest report).

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name/Chair], Ad Hoc Subcommittee on Capstone Case #24-05
  **DATE:** October 14, 2024
  **SUBJECT:** Recommendation for Sanctions: Senior Capstone Group 4B (Data Fabrication)
  **DEADLINE:** Registrar Grade Submission (11 Days)

  ### I. Executive Summary

  This memo recommends specific sanctions for the five members of Capstone Group 4B regarding the fabrication of test data in their final report. The Board is currently divided between a "Collective Liability" model (sanctioning the team as a unit) and an "Individual Culpability" model (sanctioning only direct actors).

  This recommendation adopts a third path: **Individual Liability for Joint Commitments.** We do not need to treat the team as a mystical "plural subject" to sanction beyond the direct fabricators. By signing the certification page and accepting team roles, each student undertook specific *individual* obligations to verify and uphold the integrity of the joint work. Sanctions are recommended based on how each individual navigated those specific obligations.

  **Recommendation at a Glance:**
  *   **Priya & Jordan:** Course Failure; One-Semester Suspension.
  *   **Ana:** Course Failure; Academic Integrity Probation.
  *   **Marcus:** Grade Reduction (One Letter); Academic Integrity Probation.
  *   **Sam:** No Sanction; Requirement to Submit Corrected Analysis.
  *   **Project Status:** Report Rejected; Degree Conferral Delayed for Affected Students.

  ### II. Philosophical Framework: Bridging the Divide

  The Board's deadlock stems from a tension in social ontology. One side argues that only individuals act (Bratman); the other argues that teams create irreducible obligations (Gilbert). We can resolve this without adopting the "Collective Liability" model that concerns the Individualists.

  We can satisfy the Individual Responsibility camp by recognizing that **joining a capstone team is a series of individual speech acts.** When a student accepts a role (Lead, Member, Contributor) and signs a certification, they are not merging into a hive mind. They are individually committing to a set of verification duties.

  Therefore, we are not punishing Ana for "the team's failure." We are punishing Ana for *her individual choice* to prioritize conflict avoidance over her specific duty of verification. We are not punishing Marcus for "being on the team." We are punishing him for *his individual choice* to sign a certification he had not adequately vetted, even if his capacity to vet was limited. This approach respects individual agency while acknowledging that agency was exercised within a structured commitment.

  ### III. Specific Findings and Sanctions

  #### 1. Priya and Jordan (Direct Fabricators)
  *   **Finding:** Admitted to fabricating data to meet deadlines. This is a direct, intentional violation of Section 3.1 of the Academic Code.
  *   **Rationale:** Their actions were the proximate cause of the integrity breach. There are no mitigating factors regarding time management that excuse fraud.
  *   **Sanction:** **Failing Grade (F)** for the capstone course. **One-Semester Suspension.**
  *   **Impact:** Graduation delayed by minimum one semester.

  #### 2. Ana (Team Lead / Signatory)
  *   **Finding:** Did not fabricate data but signed the Certification of Accuracy. Admitted to having "a bad feeling" regarding the data but consciously chose not to investigate to avoid interpersonal conflict.
  *   **Rationale:** To the Individual Responsibility camp: Ana is not being punished for Priya and Jordan's lies. She is being punished for her own act of **professional negligence.** As Team Lead, her specific sub-plan within the joint activity included quality assurance. By admitting she suspected issues and remained silent, she admits to an individual ethical failure distinct from the fabrication itself. Her signature was a warranty; she issued a warranty she knew was potentially defective.
  *   **Sanction:** **Failing Grade (F)** for the capstone course. **Academic Integrity Probation** (2 semesters).
  *   **Impact:** Graduation delayed. The failure reflects the breach of the Lead's specific duty, not merely guilt by association.

  #### 3. Marcus (Late Joiner / Signatory)
  *   **Finding:** Joined 3 weeks prior. Did not fabricate. Signed Certification. Claims ignorance of fabrication.
  *   **Rationale:** Marcus lacks the *mens rea* of Priya/Jordan and the *negligence* of Ana. However, he did sign the Certification of Accuracy. In a senior capstone, signing is an act of verification. While his capacity to verify was limited by his late entry, he had an obligation to qualify his signature or request an extension if verification was impossible. He chose neither.
  *   **Sanction:** **Grade Reduction** (e.g., from B to D, or Pass to Fail depending on current standing, recommended **D**). **Academic Integrity Probation** (1 semester).
  *   **Impact:** May affect graduation honors or GPA, but allows for graduation if credits are met. This acknowledges his limited epistemic access while upholding the sanctity of the signature.

  #### 4. Sam (Whistleblower / Compliant Member)
  *   **Finding:** Flagged data anomalies in group chat 2 months prior. Was instructed by majority (Priya/Jordan/Ana) to "drop it." Complied and signed report.
  *   **Rationale:** Sam fulfilled the individual duty to detect. He was overruled by a majority coalition. To sanction Sam would be to penalize an individual for lacking the power to override a group dynamic, which effectively punishes the lack of authority rather than the presence of integrity. Sanctioning Sam undermines the Board's goal of encouraging reporting.
  *   **Sanction:** **No Sanction.**
  *   **Condition:** Sam must submit a separate, corrected analysis of the data (using the available raw logs) to the department within 30 days to demonstrate competency, allowing him to receive credit for his actual work without the taint of the fraud.
  *   **Impact:** Graduation proceeds, pending department chair approval of the corrected analysis.

  ### IV. Implementation Timeline (11-Day Window)

  To meet the Registrar's deadline while preserving due process:

  *   **Day 1 (Today):** Memo distributed to Board.
  *   **Day 2:** Board Vote on Recommendations.
  *   **Day 3:** Formal Notification sent to all five students (Email + Certified Mail). Notification includes Right to Appeal.
  *   **Day 4–6:** **Appeal Window Open.** Students may submit written appeals regarding the *sanction* only (facts are admitted).
  *   **Day 7:** Board reviews any appeals (if filed).
  *   **Day 8:** Final Decisions ratified.
  *   **Day 9:** Notification of Final Decision sent to Students and Department Chair.
  *   **Day 10:** Department Chair processes Grade Changes/Withholds per Board ruling.
  *   **Day 11:** Grades submitted to Registrar.

  ### V. Conclusion

  This framework avoids the fiction that "the team" is a single moral agent. Instead, it treats the team as a contract of interlocking individual duties. Priya and Jordan broke the contract by lying. Ana broke it by negligence. Marcus breached it through insufficient verification. Sam upheld his duty to detect but was overpowered.

  By differentiating the sanctions this way, we validate the Individual Responsibility camp's demand for personal agency while upholding the Collective standard that a capstone signature is a binding individual commitment to the group's truth.

  **Recommendation:** Adopt the sanctions listed in Section III immediately to proceed with the Day 2 vote.
