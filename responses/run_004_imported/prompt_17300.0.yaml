      *   *Point 3: Game Theory/Strategic Stability.* Von Neumann was a game theorist. A unilateral or even multilateral ban creates a prisoner's dilemma. If a rogue actor defects, the cooperators suffer. He would prefer a balance of terror or mutual transparency over a fragile ban.
