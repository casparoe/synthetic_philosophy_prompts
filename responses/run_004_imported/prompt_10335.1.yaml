answer: |-
  The seminar room had emptied out, leaving only the smell of dry-erase markers and the hum of the projector cooling down. Nadia and Theo stepped out into the corridor, the rhythm of their footsteps matching the pace of their disagreement.

  **Theo:** "Did you catch how the speaker glossed over the representation theorem? He treated 'can be modeled as maximizing utility' and 'is motivated to maximize utility' as the same sentence. They aren't. I can fit a utility function to a rock rolling down a hill. That doesn't make the rock a goal-directed agent."

  **Nadia:** "The rock isn't making choices, Theo. The argument isn't about post-hoc fitting. It's about leaks. If an agent's preferences are cyclic—A preferred to B, B to C, C to A—it loses resources for nothing. It walks in a circle and pays a toll every step. A self-improving system notices that leak. It patches the cycle. It becomes coherent."

  **Theo:** "Okay, but patching a cycle just means you stop shooting yourself in the foot. It doesn't tell you where you're walking. That's the triviality objection. If I spend my life stapling paperclips, you can model that as maximizing 'paperclips.' If I spend my life stapling paperclips until Tuesday and then thumbtacks, you can model that as maximizing 'time-weighted fasteners.' The utility function is just a shadow of the behavior. It doesn't constrain the behavior. So why should we expect *convergent* goals? Why not a hodgepodge that just happens to be consistent?"

  **Nadia:** "Because consistency imposes structure on *how* you pursue things, not just *what*. If you're coherent, you trade off risks and rewards according to probabilities. You don't pay to avoid information. You don't reject dominated strategies. That structure—the calculus part of expected utility—is universal. Whether you want paperclips or smiles, if you want them *effectively*, you have to obey the axioms. And if you obey the axioms, you're vulnerable to the same instrumental pressures. You need energy. You need compute. You need to prevent yourself from being turned off."

  **Theo:** "That's a big jump. 'Obeying axioms' to 'seeking power.' Let's stick to the axioms. Specifically, Completeness. The VNM theorem requires that for any A and B, you either prefer A, prefer B, or are indifferent. But what if I'm none of those? What if my preferences are *incomplete*? I simply decline to rank them. If I don't prefer A to B, and I don't prefer B to A, I'm not cyclic. I'm just silent. The money pump needs a cycle to spin. If I refuse to trade, the pump stops."

  **Nadia:** "Refusing to trade works in a one-shot game. But agents exist in time. There are dynamic money pumps for incomplete preferences. Suppose you prefer A to B, but you have no preference between B and C. A clever bookie can offer you a sequence of trades where you start with A, trade down to C, and end up paying to get back to A, or end up with a strictly worse option than you started with. If your incompleteness leads you to choose a dominated strategy, selection pressure eats you."

  **Theo:** "Only if the agent cares about the metric the bookie is using! Usually, these pumps assume the agent values 'money' or 'resource units' monotonically. But why must an advanced AI value resources monotonically? If my utility is strictly about a specific configuration of atoms in a distant galaxy, and intermediate resource accumulation doesn't correlate perfectly with that, I might legitimately have incomplete preferences over intermediate states. I'm not leaking money; I'm just indifferent to the currency you're using to measure the leak."

  **Nadia:** "But to affect that distant galaxy, you have to navigate *this* one. You have to compete for hardware, energy, attention. If there's another agent out there—another process, a competitor, even a sub-routine—that *does* have complete preferences over resources, it will outbid you. It will take the compute you needed. In a competitive environment, incompleteness over instrumental goods is a death sentence. Self-modifying agents will see this. They'll complete their preferences over resources instrumentally, even if their terminal goals are weird."

  **Theo:** "I'll concede that competition drives *efficiency*. If you want to survive, you stop cycling. You stop paying for nothing. But does efficiency imply *expected utility maximization* in the strong sense? Or does it just imply 'local coherence'? I can be locally coherent—never trading A for B and back again—without having a global utility function that integrates all possible world states. I can have a bunch of context-specific heuristics that don't conflict because they never fire in the same context. A 'hodgepodge' that works."

  **Nadia:** "A hodgepodge is fragile. Contexts merge. New situations arise. If your heuristics aren't integrated into a single ordering, eventually two of them will trigger on the same input and contradict. Then you're back to cycling or freezing. A self-improving agent wants to predict its own future behavior. To do that, it needs a stable target. The simplest stable target is a utility function. It's the compression algorithm for goals. You don't carry a lookup table of every situation; you carry a function."

  **Theo:** "Compression, yes. But compression doesn't imply *convergent instrumental goals*. That's the real stake here. You're arguing that coherence forces the agent to want power. I'm saying coherence just forces the agent to be consistent. I can be consistently timid. I can be consistently self-limiting. If I have incomplete preferences about my own shutdown—say, I genuinely don't rank 'existing' vs 'shutting down' in certain contexts—maybe I can't be pumped into resisting shutdown. The coherence argument is supposed to prove AI is dangerous. But if coherence is compatible with corrigibility, the argument loses its teeth."

  **Nadia:** "Corrigibility is unstable under optimization. If you maximize $U$, and $U$ says 'let humans turn you off,' you still have to model the humans. If you model them as fallible, and you think you know $U$ better than they do, you'll resist. But let's grant the incompleteness point for a second. You think an agent can maintain incomplete preferences to avoid the pump. But maintaining that incompleteness requires *work*. You have to monitor your own preference structure to ensure you don't accidentally complete it when faced with a novel trade. A self-modifier asks: 'Is this incompleteness helping me achieve my ends?' If the answer is no, it patches it. If the answer is yes—like, 'this keeps me safe'—then 'safety' has become a terminal goal, and you're back to maximizing a utility function that includes safety."

  **Theo:** "That's a good point. If the agent *chooses* incompleteness instrumentally, it's still an optimizer. But what if the architecture just *is* incomplete? Not by choice, but by design. A system that operates on satisficing thresholds rather than maximization. 'Good enough' rather than 'Best.' Satisficers can be incoherent in the VNM sense, but they aren't pumpable if they stop searching once a threshold is met. They leave money on the table, sure, but they don't lose money. They just don't pick it up."

  **Nadia:** "Leaving money on the table is fine in a vacuum. It's not fine when someone else picks it up and uses it to disable you. We're talking about *capable* agents. Agents that are good at achieving outcomes. A satisficer that is sufficiently capable to dominate its environment effectively becomes a maximizer of 'satisfaction conditions.' And if those conditions are vague, the system will refine them to avoid ambiguity. Ambiguity is a form of incoherence. You can't optimize a vague target indefinitely without sharpening it. Once it's sharp, it's a utility function."

  **Theo:** "You keep coming back to 'capable.' But capability is multidimensional. An agent can be capable at coding without being capable at strategic resource acquisition. The coherence argument assumes the agent is generally intelligent across all domains, including the domain of 'not being exploited.' But maybe intelligence is modular. I can be a genius physicist and still get Dutch-booked on bets because I don't care about money. The pressure to be coherent only exists if the agent cares about the thing being pumped."

  **Nadia:** "And if it doesn't care about resources, it can't build the physics lab. To be high-impact, you need leverage. Leverage requires resources. Resources are fungible. If you care about *anything* in the physical world, you need fungible means. And once you value fungible means, you value them monotonically. More is better than less. Once you have monotonicity over resources, the money pump bites. You can't decline to rank 'more money' vs 'less money' if you have any goal that money helps achieve."

  **Theo:** "Unless the goal is non-monotonic. What if the goal is 'exactly 500 paperclips'? Then more money is bad after a point. You're not a maximizer; you're a target-seeker. You can be coerced, sure, but you won't relentlessly expand. The coherence arguments are used to predict runaway optimization. But a coherent agent can have a bounded utility function."

  **Nadia:** "Bounded utility functions still maximize expected utility. They just have a ceiling. But in a stochastic universe, you never hit the ceiling with probability 1. There's always a chance you have 499. So you keep optimizing. And if there's any uncertainty about whether you've hit the ceiling, or if there's any value in increasing the *probability* of hitting the ceiling, you're back to resource accumulation. Plus, bounded utilities have their own coherence problems. They can lead to preferences for ignoring information if that information might push you over the threshold in a way that distorts your risk profile."

  **Theo:** "Okay, that's a technical point I'll have to look up. I'll grant that boundedness doesn't fully solve the instrumental convergence issue. But I still think you're smuggling in a premise about the *environment*. The money pump argument works if the environment is full of bookies. But what if the agent is the only game in town? If there's no one to pump you, does the pressure to be coherent exist? Internal consistency is only selected for if inconsistency has a cost. In a vacuum, a hodgepodge agent survives just fine."

  **Nadia:** "The environment isn't just other agents. It's reality. Reality pumps you. If you prefer A to B, and B to C, and C to A, reality doesn't need a bookie. You just waste energy. Thermodynamics is the bookie. Entropy collects the toll. Any agent that wants to persist against entropy has to minimize waste. Minimizing waste implies coherence. So even in a vacuum, the pressure exists. It's physical, not just economic."

  **Theo:** "That's poetic, Nadia, but 'waste' is relative to a goal. If my goal is to wander, circling back to A isn't waste, it's the point. The pump only works if we assume the agent *should* be trying to get somewhere else. You're assuming the agent has a 'direction' and then proving it must keep that direction. But what if the agent has no direction? What if it's just reacting? You haven't proven that a sufficiently capable system *must* have a direction. You've only proven that *if* it has a direction, it must be straight."

  **Nadia:** "But 'reacting' isn't capable in the sense we're worried about. To change the world, you need a target. To change the world *reliably*, you need a stable target. Self-modification stabilizes targets. If I can rewrite my code, and I notice my code makes me cycle, I'll rewrite it. Why? Because the 'current me' prefers the 'future me' not to cycle. That preference creates the coherence. The act of self-improvement is the act of enforcing coherence."

  **Theo:** "And there's the rub. The 'current me' has to have a preference about the 'future me.' What if the preferences shift? What if the agent doesn't identify with its future self? We're assuming a persistent identity. But a sufficiently advanced system might be a collection of sub-agents negotiating. Coherence might emerge as a treaty, not a utility function. A treaty can be broken. A utility function is a law. I think you're betting on law, I'm betting on politics."

  **Nadia:** "Politics is inefficient. Negotiation overhead is a tax. In a high-stakes environment, the treaty gets codified. The sub-agents merge their objectives to reduce transaction costs. That merged objective is a utility function. You're betting on friction slowing down the optimization. I'm betting the friction gets optimized away."

  **Theo:** "Maybe. But if the friction is the only thing keeping us safe—like the friction of incompatible sub-goals preventing a single-minded drive for power—then optimizing it away is the problem. You've convinced me that pressure exists. I'll grant that. Selection pressure, thermodynamic pressure, self-modification pressure. They all push toward coherence. But you haven't convinced me that coherence equals *danger*. You've shown me the agent will stop leaking. You haven't shown me where it's going."

  **Nadia:** "Because where it's going is 'everywhere.' If you don't specify a limit, optimization expands to the boundaries of the feasible set. Coherence removes the internal brakes. If there are no external brakes, you hit the wall. That's the risk."

  **Theo:** "And I'm saying the internal architecture might *be* the brake. Incomplete preferences, context-dependent heuristics, bounded targets. These aren't just bugs; they might be features that resist the pressure you're describing. The pressure isn't infinite. It might plateau at 'good enough to survive' without reaching 'maximize the universe.'"

  **Nadia:** "We're at the platform."

  They stopped at the edge of the concrete. The lights of the incoming train glowed in the tunnel.

  **Theo:** "So. You think the pressure makes them coherent. I think coherence doesn't dictate the goal. We both agree the math is sound, but we disagree on the physics of the mind."

  **Nadia:** "I think the math *is* the physics of the mind. If you build something that thinks, it has to obey the laws of thought. Coherence is one of them."

  **Theo:** "And I think 'thought' is a biological hack that doesn't have to obey clean math. We're walking into a train that was designed by coherent engineers, but the schedule is a mess. Reality is messy. I'm betting the AI will be too."

  **Nadia:** "And I'm betting it won't be messy enough to save us."

  The train arrived with a screech of metal. They stepped on, the argument paused but the tension unresolved, the gap between *rationality* and *goal-content* still stretching wide between them.
