prompt: |-
  A friend and I spent most of a long dinner arguing about what has to be true for two people to be doing something together, in the full sense of "together," rather than each merely doing their own thing in a way that happens to mesh with what the other is doing. The case that started the disagreement was mundane: two coworkers divide a task so cleanly, and trust each other's competence so completely, that they barely discuss it at all, each one simply doing their part because it is obviously in their interest to do so, given that the other is doing theirs. I wanted to say that this does not yet amount to "acting together" in any interesting sense unless each person's plan is somehow answerable to the other's plan as such, so that something like a shared commitment is doing real work, over and above two private calculations that happen to converge. My friend, who has read far more early modern philosophy than I have, thought this was needless mystification, and cited a passage from Hume's Treatise that she claimed already delivers everything one could want from a theory of cooperation, without any appeal to "shared intention" or "joint commitment."

  The passage comes from Book 3, Part 2, Section 2 of the Treatise ("Of the origin of justice and property"; paragraph T 3.2.2.10 in the standard modern numbering), where Hume argues that a convention need not, and typically does not, involve any promise:

  "This convention is not of the nature of a promise: For even promises themselves, as we shall see afterwards, arise from human conventions. It is only a general sense of common interest; which sense all the members of the society express to one another, and which induces them to regulate their conduct by certain rules. I observe, that it will be for my interest to leave another in the possession of his goods, provided he will act in the same manner with regard to me. He is sensible of a like interest in the regulation of his conduct. When this common sense of interest is mutually express'd, and is known to both, it produces a suitable resolution and behaviour. And this may properly enough be call'd a convention or agreement betwixt us, tho' without the interposition of a promise; since the actions of each of us have a reference to those of the other, and are perform'd upon the supposition, that something is to be perform'd on the other part. Two men, who pull the oars of a boat, do it by an agreement or convention, tho' they have never given promises to each other."

  Hume goes on, later in the same passage, to say that language and money arise from conventions in exactly the same way, without anyone ever promising anything. Before I take this back to my friend, I would like help working out exactly what is doing the argumentative work here. When Hume says that each party's sense of common interest must be "mutually express'd, and known to both," is that mutual expressing-and-knowing meant to be a substantive extra ingredient, or is it just a description of the fact that each has formed accurate expectations about the other? And when he adds that the rowers' actions "have a reference to those of the other" and are performed "upon the supposition" that the other will reciprocate, has he not already helped himself to something very close to the interlocking, mutually responsive intentions that later writers on shared agency insist on, even while denying that anything as strong as an agreement in the fuller sense is present? I recall, from a seminar I once took, that philosophers such as Michael Bratman and Margaret Gilbert set a considerably higher bar for two people to count as genuinely acting jointly - something involving a standing commitment to support the other if the plan runs into difficulty - and I would find it useful to know whether Hume's rowers clear that bar, or whether they are really just two people rowing near each other for compatible reasons rather than two people rowing together.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Dispute:** The user and a friend disagree about what constitutes "acting together" (joint action) vs. parallel individual action.
      *   **Case Study:** Two coworkers dividing a task efficiently with high trust but minimal communication (convergent self-interest).
      *   **User's Position:** Requires something more than convergent self-interest; needs "answerability" of plans, shared commitment, or joint intention.
      *   **Friend's Position:** Cites Hume (*Treatise* 3.2.2.10) to argue that a "general sense of common interest" + mutual expression/knowledge is sufficient for convention/cooperation without promises or heavy-duty shared intention.
      *   **Specific Questions:**
          1.  What is the argumentative work being done in Hume's passage?
          2.  Is "mutually express'd, and known to both" a substantive extra ingredient or just accurate expectations?
          3.  Do Hume's rowers meet the high bar set by Bratman/Gilbert (interlocking intentions, commitment to support)?
          4.  Are Hume's rowers genuinely acting *together* or just rowing *near* each other for compatible reasons?

  2.  **Deconstruct Hume's Passage (T 3.2.2.10):**
      *   *Context:* Origin of justice and property. Hume is explaining how social order arises without a social contract (promise).
      *   *Key Mechanism:* "General sense of common interest."
      *   *Condition:* This sense must be "mutually express'd, and known to both."
      *   *Result:* "Suitable resolution and behaviour."
      *   *Example:* Two men rowing a boat.
      *   *Hume's Claim:* This *is* a convention/agreement, even without a promise.
      *   *Interpretation:* Hume is a reductionist about social facts. He wants to show that complex social norms (justice, property, language) emerge from iterative individual rationality + common knowledge, not from mystical group minds or explicit contracts.

  3.  **Analyze the "Mutual Expression/Knowledge" Question:**
      *   Is it just accurate expectations?
      *   *Hume's View:* It's likely *common knowledge* (I know that you know that I know...). Mere accurate expectation (I guess you'll row) isn't enough for stability. It needs to be *expressed* (through action or sign) so that the *knowledge* is mutual.
      *   *Argumentative Work:* This bridges the gap between solitary rationality and coordination. Without mutual knowledge, I might row, but fear you won't, so I stop. With mutual knowledge, I know you know I'm rowing, so you row, so I keep rowing. It stabilizes the equilibrium.
      *   *Is it "substantive"?* For Hume, no (it's just psychology + observation). For Joint Action theorists, maybe yes (it's the seed of shared intention).

  4.  **Compare Hume with Bratman and Gilbert:**
      *   **Michael Bratman (Shared Intention):**
          *   Requirements: Interlocking intentions (I intend we J, you intend we J), mutual knowledge, meshing sub-plans, commitment to mutual support.
          *   *Hume vs. Bratman:* Hume's rowers have interlocking intentions ("reference to those of the other"). Do they have commitment to mutual support? Hume says they act on "supposition." If one stops, does the other help or quit? Hume implies stability through interest, not necessarily normative commitment. Bratman might say Hume describes *cooperative* action but maybe not full *shared intention* if the "we" isn't represented in the mind. However, many Bratmanians see Hume as a precursor.
      *   **Margaret Gilbert (Joint Commitment):**
          *   Requirements: A "plural subject" formed by joint commitment. It creates obligations/rights. You can't unilaterally withdraw.
          *   *Hume vs. Gilbert:* Hume explicitly denies promises/obligations in this specific passage ("not of the nature of a promise"). Gilbert would likely say Hume describes *parallel action* or *coordination*, but not *joint action* in the normative sense. If a rower stops, the other feels no *right* to rebuke them, only disappointment in lost utility.
      *   **The Coworker Case:** The user's coworker example sounds very Humean (convergent interest, high trust, low talk). Gilbert would say "not joint." Bratman might say "maybe, depends on the 'we'." Hume says "yes, convention."

  5.  **Synthesize the Argumentative Work:**
      *   Hume is fighting the Social Contract theorists (Hobbes, Locke). He needs to show order without explicit consent.
      *   The "mutual expression" creates a *focal point* or *common knowledge* that locks in the equilibrium.
      *   It is *not* just accurate expectations; it's the *mutuality* of the knowledge that matters.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the depth of the dispute. It's a classic debate in social ontology (Reductionism vs. Non-Reductionism).
      *   *Section 1: Hume's Argumentative Work.* Explain *why* Hume writes this (anti-contract). Explain the role of "mutual expression." It's about Common Knowledge, not just prediction. It solves the coordination problem.
      *   *Section 2: Hume vs. The "High Bar" Theorists.*
          *   *Bratman:* Hume is close but maybe lacks the explicit "we-intention." Bratman requires interlocking intentions *about the joint activity*. Hume's rowers intend *their* part conditional on the other. This is a subtle distinction (I intend that we row vs. I intend to row if you row).
          *   *Gilbert:* She is the strongest counter to Hume here. She distinguishes *concordant action* from *joint action*. Hume's rowers are concordant. Gilbert requires a normative glue (right to rebuke). Hume denies this glue (no promise).
      *   *Section 3: The Coworker Case.* Apply the analysis.
          *   Hume/Friend: Yes, it's acting together (convention).
          *   User/Gilbert: No, it's parallel play (unless there's a normative commitment).
          *   Bratman: Middle ground (depends on the cognitive structure of the intention).
      *   *Section 4: Conclusion/Verdict.* Hume isn't mystifying, but he is defining "together" more loosely than Gilbert. The "mutual expression" is the crucial hinge—it turns individual calculus into social fact *for Hume*, but not *for Gilbert*.

  7.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Caution:* Don't say Hume is "wrong." Say he has a different project (genealogy of norms vs. analysis of current mental states).
      *   *Clarification:* Ensure the distinction between "convergent interest" and "interlocking intention" is clear. Hume says the actions have "reference to those of the other." That *is* interlocking intention, broadly speaking.
      *   *Key Insight:* The user asks if "mutual expression" is just accurate expectations. I need to emphasize *Common Knowledge* (Lewis picked this up from Hume). It's not just "I expect you," it's "I know you expect me."
      *   *Gilbert's specific objection:* She argues Hume conflates *cooperation* with *joint commitment*. This is exactly the user's intuition. I should validate the user's intuition using Gilbert.

  8.  **Final Polish:** Check tone (philosophical, respectful of both sides), clarity, and ensure all parts of the prompt are answered. (Ensure the specific questions about "substantive ingredient" and "clearing the bar" are directly addressed).

  **(Self-Correction on Hume's "Expression"):** Does Hume mean linguistic expression? No, he says "actions... are perform'd upon the supposition." The action *is* the expression. This is crucial. It's signaling through doing.

  **(Self-Correction on Bratman):** Bratman actually cites Hume's rowers as a paradigm case of shared intention in some contexts, but refines it. I should note that Bratman is more friendly to Hume than Gilbert is.

  9.  **Final Structure:**
      1.  Introduction: Framing the debate (Reductionism vs. Normativity).
      2.  Hume's Mechanism: Common Knowledge vs. Mere Expectation.
      3.  The "High Bar" Test: Gilbert (No) vs. Bratman (Maybe/Yes).
      4.  The Coworker Case: Applying the theories.
      5.  Conclusion: Who is right? (Depends on what "together" means).

