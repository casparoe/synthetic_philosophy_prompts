answer: |-
  This is a classic dispute in social ontology, pitting **reductionist** accounts of joint action (like Hume's, and later David Lewis's) against **non-reductionist** or **normative** accounts (like Margaret Gilbert's and, to a lesser extent, Michael Bratman's).

  Your intuition that something is missing in the coworker case aligns with the non-reductionist tradition, while your friend's appeal to Hume aligns with the tradition that seeks to explain social order through individual rationality and common knowledge alone.

  Here is a breakdown of what is doing the argumentative work in Hume's passage, how it compares to the "high bar" set by Bratman and Gilbert, and whether Hume's rowers are truly acting "together."

  ### 1. What is the argumentative work in Hume's passage?

  Hume's project in the *Treatise* is genealogical and anti-contractarian. He is arguing against Social Contract theorists (like Hobbes or Locke) who claimed that political society and justice originate in a explicit promise or contract. Hume wants to show that complex social coordination can emerge from the bottom up, without "mystical" group minds or explicit speech acts like promising.

  To do this, he needs a mechanism that bridges the gap between **solitary self-interest** and **stable cooperation**.

  **Is "mutually express'd, and known to both" just accurate expectation?**
  No, it is meant to be a substantive extra ingredient, specifically what game theorists and philosophers later called **Common Knowledge**.
  *   **Mere Expectation:** I expect you to row. You expect me to row. (This is unstable. I might expect you to row, but you might not expect *me* to row, so you stop, so I stop.)
  *   **Mutual Expression/Knowledge:** I know that you know that I know... that we both have this sense of common interest.

  For Hume, the "expression" doesn't need to be linguistic. The action itself ("I start rowing") serves as the expression of my interest to you. When you see me row, you know I have the "sense of common interest." When you join in, I know you know. This recursive knowledge locks the coordination into place. It transforms a precarious guess into a stable **convention**.

  So, Hume is not mystifying anything; he is identifying **common knowledge** as the glue that turns parallel calculations into a stable system. However, he insists this glue is made of the same material as individual psychology (interests, beliefs, observations), not a new normative substance (like a promise).

  ### 2. Do Hume's rowers clear the Bratman/Gilbert bar?

  This is where your disagreement with your friend likely hinges. Hume's definition of "acting together" is much thinner than Gilbert's and slightly thinner than Bratman's.

  **Margaret Gilbert (The High Bar)**
  Gilbert argues forcefully that Hume's rowers are **not** acting together in the full sense. She distinguishes between:
  *   **Concordant Action:** We both do X because it benefits us individually (Hume's rowers).
  *   **Joint Action:** We do X *as a body*, bound by a **joint commitment**.

  For Gilbert, the missing ingredient in Hume's account is **normativity**. In a genuine joint action, if one rower stops, the other has the *right* to rebuke them ("Hey, we're rowing!"). In Hume's scenario, if one rower stops, the other can only feel disappointment that their personal utility is now compromised. They cannot claim the stopper violated a commitment, because Hume explicitly says this convention is "not of the nature of a promise."

  *   **Verdict:** Hume's rowers **fail** Gilbert's test. They are two individuals meshing their behaviors, not a "plural subject."

  **Michael Bratman (The Middle Bar)**
  Bratman focuses on the structure of intention rather than normative obligation. For Bratman, shared intention requires:
  1.  **Interlocking Intentions:** I intend that *we* J; you intend that *we* J.
  2.  **Mutual Knowledge:** We know each other has these intentions.
  3.  **Meshing Sub-plans:** Our plans don't conflict.
  4.  **Commitment to Mutual Support:** If you struggle, I help (because it's *our* goal).

  Hume's description ("actions... have a reference to those of the other") gets close to interlocking intentions. However, there is a subtle distinction.
  *   **Humean Intention:** "I intend to pull my oar *on the condition* that you pull yours." (Conditional individual intention).
  *   **Bratmanian Intention:** "I intend that *we* row the boat." (Shared intention).

  Bratman actually discusses Hume's rowers and suggests they *can* count as shared intention if the cognitive structure is right. However, if the coworkers in your example are merely thinking, "I'll do my part because it's in my interest given that he is doing his," Bratman might agree with you that this is merely **cooperative individual action**, not **shared agency**. The difference lies in whether the "we" is represented in the mind of the actors.

  *   **Verdict:** Hume's rowers **might** clear Bratman's bar, but only if their conditional intentions are robust enough to function as a "we-intention." If they are purely calculating individual payoff matrices, they fall short.

  ### 3. Applying this to your Coworker Case

  You can now map your dinner argument onto these philosophical positions.

  **Your Friend's Humean View:**
  The coworkers are acting together because they have achieved a stable convention. The "mutual expression" is the work itself. They see each other working; they know the other knows the task needs doing; they trust the other's competence. This creates a common knowledge equilibrium. For Hume, **this is enough.** To demand a "shared commitment" is to demand a promise where none is needed. It is "needless mystification" to ask for more.

  **Your Intuition (Gilbertian/Bratmanian):**
  You feel that without "answerability," they aren't truly *together*.
  *   **The Test:** Imagine one coworker suddenly decides to stop doing their part halfway through.
  *   **Hume/Friend:** The other coworker thinks, "Damn, now I can't finish. My calculation was wrong." (Prudential disappointment).
  *   **You:** The other coworker thinks, "Hey, you can't do that! We're doing this *together*!" (Normative rebuke).

  If your intuition is that the coworkers *would* feel entitled to rebuke each other, then you are detecting a **joint commitment** that Hume ignores. If they would merely feel annoyed at the lost efficiency, Hume is right: it's just convergent self-interest.

  ### 4. Summary for your Reply

  When you take this back to your friend, you can concede that Hume successfully explains how **coordination** arises without promises. He identifies **common knowledge** (the "mutually express'd" sense of interest) as the mechanism that stabilizes the interaction.

  However, you can maintain that Hume is defining "acting together" (convention) more loosely than the phrase implies in ordinary discourse.
  1.  **On "Mutual Expression":** Argue that for Hume, this is indeed substantive—it creates common knowledge—but it is *epistemic* glue, not *normative* glue.
  2.  **On the "High Bar":** Point out that Margaret Gilbert would classify Hume's rowers as engaging in "concordant action," not "joint action." The difference is the **right to rebuke**.
  3.  **The Coworker Verdict:** If the coworkers view their plans as merely conditional on the other's performance (I do X *if* you do Y), they are Humean rowers. If they view their plans as sub-plans of a shared goal (We are doing Z, so I do X and you do Y), they are Bratmanian partners.

  **Conclusion:** Your friend is right that Hume provides a robust theory of **cooperation without commitment**. But you are right that this may not capture the full normative force of **acting together**. Hume explains how we get the boat to shore; Gilbert and Bratman explain what binds us to the oars *as a team*. Whether the coworkers are "truly" together depends on whether you think the essence of togetherness is **coordination** (Hume) or **commitment** (Gilbert).

  If you want to win the argument, ask your friend: *"If one coworker quits halfway through, does the other have the standing to complain, or just the reason to be annoyed?"* If the answer is "complain," Hume's account is incomplete. If the answer is "annoyed," Hume wins.
