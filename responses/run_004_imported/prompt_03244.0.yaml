      *   *Boltzmann & Schütz (1890s):* The user mentions Schütz. Anton Schütz (sometimes spelled Schutz) was indeed a student/assistant. In 1893, Boltzmann published *Über unsere Vorstellung von der absoluten Zeit* and later works where he suggests the universe is in thermal equilibrium overall, and we live in a rare fluctuation.
