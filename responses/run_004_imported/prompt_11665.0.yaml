      **Jordan:** "But that assumes accuracy is atomistic. Suppose accepting a slightly less accurate belief about *p* prevents a cascade of errors across hundreds of related propositions. Isn't the resulting doxastic state objectively more accurate? If epistemology cares about truth, surely total truth-tracking matters more than local fidelity."

