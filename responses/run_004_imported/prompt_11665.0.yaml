          *   Length: Half a page or so (approx. 250-400 words).
          *   Tone: Philosophical seminar discussion (serious, engaged, not strawmanning).

  2.  **Understand the Core Philosophical Issue:**
      *   **Accuracy-First Epistemology:** Norms of belief are derived from minimizing expected inaccuracy (or maximizing expected accuracy). Beliefs are evaluated based on how close they are to the truth.
      *   **Berker's Objection:** Berker argues that aggregating accuracy across propositions (like utilitarianism aggregates welfare across persons) violates the "separateness of propositions." Just as it's wrong to sacrifice one person's welfare for another's greater welfare, it's wrong to sacrifice accuracy on one proposition for greater accuracy on another unrelated proposition. This threatens the consequentialist structure of EUT.
      *   **Veritist Pushback:** Often involves arguing that propositions aren't "separate" in the morally relevant way persons are, or that the aim of truth is inherently holistic (a belief system aims at representing the world, not just individual facts).
      *   **Objector Counter:** The aim of belief is *individual* belief accuracy; the normativity attaches to the attitude toward *p*, not the system.

  3.  **Drafting - Step-by-Step:**

      *   *Setting the Scene:* Two grad students or a professor and student after seminar. Let's make it peers for symmetry.
      *   *Opening:* Objector raises Berker.
