      **Alex:** "Berker's objection still feels lethal. If accuracy is the sole epistemic good, you're committed to epistemic consequentialism. But just as we shouldn't sacrifice one person's welfare for the greater good, we shouldn't sacrifice accuracy on *p* for accuracy on *q*."

      **Jordan:** "But the analogy fails at the metaphysics. Persons are distinct centers of experience; propositions aren't. When I aim at truth, I'm aiming at representing the world correctly *simpliciter*, not representing *p* correctly in isolation. Why think epistemic norms respect proposition-boundaries? The world doesn't come carved into propositions."

