      **Ver:** But the analogy breaks. Persons have separate lives. Propositions don't have separate lives. They're just features of the world.
      **Obj:** It's not about lives. It's about the *object* of evaluation. Epistemic norms evaluate specific beliefs.
      **Ver:** But rationality is holistic.
      **Obj:** Then you're not accuracy-first anymore.

      *Refining for Length and Depth:* Need to expand the Veritist's pushback. Maybe appeal to the "aim of belief" being truth simpliciter, not truth-about-p. Then Objector says that dissolves the normativity for the agent.

      *Drafting - Attempt 3 (Writing the dialogue):*
      **Alex (Objector):** "Berker's objection still feels lethal. If accuracy is the sole epistemic good, you're committed to epistemic consequentialism. But just as we shouldn't sacrifice one person's welfare for the greater good, we shouldn't sacrifice accuracy on *p* for accuracy on *q*."
      **Jordan (Veritist):** "But the analogy fails at the metaphysics. Persons are distinct centers of experience. Propositions aren't. When I aim at truth, I'm aiming at representing the world correctly *simpliciter*, not representing *p* correctly in isolation. Why think epistemic norms respect proposition-boundaries?"
