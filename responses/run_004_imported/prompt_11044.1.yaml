      *   **Naomi Move 2 (Normativity):** Time-average $\neq$ Rational Requirement.
          *   Point: Maximizing time-average is just *one* objective.
          *   Claim: Caring about tails (variance, ruin, upside) is valid. Ergodicity describes the process, not the agent's goals.

  3.  **Evaluate Each Move (Mental Draft & Fact-Checking):**

      *   *Felix 1 (Asymptotic Dominance):* True that Kelly dominates other fixed-fraction strategies almost surely as $T \to \infty$. *However*, "almost surely" doesn't mean "in expectation." A strategy can have lower expected wealth but higher median wealth. Also, convergence can be very slow. *Verdict:* Strong mathematical point, but normative leap ("therefore uniquely rational") is weak.
