      *   *Felix 2 (Ergodicity):* This is the core of "Ergodicity Economics" (Peters, Gell-Mann). In multiplicative dynamics, the ensemble average grows exponentially faster than the time average. EV maximization leads to bankruptcy (Gambler's Ruin) in repeated multiplicative bets. *Verdict:* Mathematically correct about the divergence of averages. This is Felix's strongest point.
