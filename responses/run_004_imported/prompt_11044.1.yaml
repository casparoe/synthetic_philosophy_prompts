      *   Ensure it sounds like it's written for economists/statisticians. Use terms like "almost sure convergence," "ensemble vs. time average," "normative vs. positive," "absorption barrier."
      *   Avoid taking sides too heavily, but be decisive on the logic.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I address the "geometric rationality" label? Yes, link it to Peters.
      *   *Check:* Did I address the Nash bargaining point? Yes, dismiss it as weak analogy.
      *   *Check:* Is the verdict clear? Yes. Naomi wins the normative argument, but Felix highlights a critical constraint often ignored by EUT.

  8.  **Final Output Structure:**
      *   Intro: Contextualize the debate (Ergodicity Economics vs. EUT).
      *   Round 1 (Asymptotics & Ubiquity vs. EUT Isomorphism).
      *   Round 2 (Ergodicity vs. Normativity).
      *   Hidden Concessions/Misses.
      *   Final Verdict.

  *(Self-Correction on the Verdict)*: I need to be careful not to say Naomi is "right" in a way that dismisses ergodicity. The prompt asks if ergodicity makes Kelly *mandatory*. The answer is generally no, because utility is subjective, *unless* survival is the primary constraint. I should nuance this: Ergodicity makes EV maximization *dangerous*, but not irrational if the agent accepts the risk of ruin. Naomi's point stands: rationality is about satisfying preferences, not just maximizing time-averages.

