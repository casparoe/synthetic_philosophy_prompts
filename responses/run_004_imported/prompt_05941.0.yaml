answer: |-
  **Elias:** Look, the cluelessness objection relies on a skepticism that would paralyze any decision theory, not just consequentialism. But specifically against consequentialism, the standard reply holds up: symmetry. For any mundane action I take—say, buying this coffee—the causal ripples extend indefinitely. But I have no more reason to believe the unforeseeable long-term effects of buying the coffee are better than those of not buying it. Since those unknown variables are orthogonal to the choice, they cancel out in expectation. We aren't required to calculate the infinite; we just need to compare the foreseeable differences. That's enough to guide action.

  **Mara:** That works for what Hilary Greaves calls "simple cluelessness," where the unknown effects are essentially random noise relative to the options. But Lenman's worry runs deeper, and Greaves admits as much. The problem is "complex cluelessness," where we can identify specific causal channels that point in opposite directions, yet lack a principled way to weigh them. Consider funding a geoengineering project. One identifiable chain leads to reduced warming; another leads to geopolitical instability over resource control. Both are foreseeable in structure, but incomparable in magnitude. You can't say they cancel out because they aren't symmetric across the options. They are intrinsic to the choice itself. If you can't weigh those known unknowns, your "foreseeable differences" are too thin to carry the normative weight.

  **Elias:** But incomparability isn't the same as indeterminacy. Just because I can't assign a precise utility value to geopolitical instability doesn't mean I can't assign a probability distribution over possible outcomes. Consequentialism requires maximizing expected value, not certain value. If I can say there's a sixty percent chance the instability is contained and a forty percent chance it escalates, I can still calculate an expectation, even if the inputs are imprecise. The theory doesn't demand omniscience, only that I act on the best available probabilistic estimates. If the expected value of funding remains positive across a wide range of plausible weightings, the action is guided.

  **Mara:** That assumes the range of plausible weightings is narrow enough to yield a decision. In cases of complex cluelessness, the credence intervals are often so wide that the expected values of competing actions overlap completely. If Option A ranges from negative one hundred to positive five hundred utility, and Option B ranges from zero to four hundred, you have no maximizing function. You're left with a decision rule that says "anything goes," which is hardly action-guiding. At that point, isn't the honest consequentialist forced to retreat? If the long-term causal chain is too opaque to calculate, shouldn't we adopt a parochial rule—maximize only within a fifty-year horizon, or only among direct effects?

  **Elias:** That retreat is tempting, but it's theoretically suicidal. If I arbitrarily truncate the timeline because the calculations get hard, I'm no longer a consequentialist; I'm a rule-utilitarian in disguise, or worse, a dogmatist. The difficulty of the calculation doesn't change the moral facts. However, I don't think your overlap objection lands. In practice, complex cluelessness rarely produces perfect overlap. Usually, one option dominates across most plausible models. If it doesn't—if we are truly in a state of radical uncertainty where every option is equally likely to be catastrophic—then perhaps suspension of judgment is the right answer. But that's a feature, not a bug. It tells us when not to act.

  **Mara:** But suspension of judgment is itself a choice with consequences. And if you admit that radical uncertainty sometimes forbids action, you've conceded that consequentialism isn't universally action-guiding. It works only when the universe is kind enough to present us with tractable probabilities. My worry is that by insisting on keeping the long-term horizon open while admitting we can't weigh the channels, you're preserving the theory's integrity at the cost of its usability. You're telling agents to aim at a target they cannot see, using a bow they cannot hold. If cluelessness is this pervasive, doesn't it suggest we should abandon the maximizing requirement entirely in favor of something satisficing, or even deontological constraints that ignore the remote future?

  **Elias:** No, because those alternatives face the same epistemic gaps. Deontological constraints assume we can know which acts violate rights, but rights-violations often depend on long-term consequences too. The problem isn't unique to consequentialism. But to your point about usability: acknowledging complex cluelessness should make us humble, not quietist. It suggests we should invest in reducing uncertainty—gathering more data, modeling those causal channels—rather than pretending they don't exist. If we retreat to short-termism, we risk ignoring the very effects that matter most. The theory remains action-guiding because it tells us to improve our epistemic position before acting. That's a guide, even if it's not a simple algorithm.

  **Mara:** So the guide is "go do epistemology until the uncertainty shrinks." But time is passing, and decisions are urgent. If the epistemic burden is too high, the theory demands impossibility.

  **Elias:** It demands the best possible effort under constraint. That's all any rational agent can do. If the uncertainty remains insurmountable despite effort, then perhaps there is no fact of the matter about what is right. But that's metaphysics, not a failure of the guide.
