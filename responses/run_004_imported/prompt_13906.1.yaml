answer: |-
  This is a frustration shared by many scientists who migrate into philosophy of science, and your intuition is physically sound. The Tycho-Copernicus case is indeed the "fruit fly" of underdetermination discussions: it is easy to breed, easy to observe, but ultimately tells us very little about the mammalian complexity of actual scientific epistemology.

  Here is an argument structured to support your position: that the Tycho-Copernicus episode represents **transient underdetermination** (a limitation of instrumental precision) rather than **principled underdetermination** (a limitation of logic or evidence in principle), and that its continued use as a paradigmatic example distorts the philosophy of science.

  ### 1. The Distinction: Transient vs. Principled Underdetermination

  To argue your case, we must first rigorously distinguish the two types of underdetermination (UTE), a distinction often glossed over in introductory texts.

  *   **Transient (Weak) Underdetermination:** Theory $T_1$ and Theory $T_2$ make different predictions, but current technology or background knowledge prevents us from testing the specific domain where they diverge. The underdetermination is a function of *time* and *resources*.
  *   **Principled (Strong) Underdetermination:** Theory $T_1$ and Theory $T_2$ are empirically equivalent across all possible observations, even in principle. No amount of data could ever distinguish them. This is the kind of skepticism Duhem and Quine are often interpreted as invoking.

  The Tycho-Copernicus case is text-book **Transient Underdetermination**.
  As you noted, the models differ dynamically and kinematically.
  1.  **Stellar Parallax:** Copernicus predicts it; Tycho does not (or requires a vastly larger universe to render it unobservable).
  2.  **Aberration of Light:** A consequence of Earth's velocity vector changing (Bradley, 1725).
  3.  **Dynamical Effects:** Coriolis forces, Foucault pendulums, equatorial bulging.

  In 1600, the divergence point existed in logical space; it was merely located beyond the horizon of instrumental sensitivity. To treat this as a case of strong underdetermination is to conflate *epistemic access* with *ontological equivalence*. The theories were never logically equivalent; they were merely observationally indistinguishable *for a time*.

  ### 2. The Misreading of Duhem

  Philosophers often reach for Tycho/Copernicus to illustrate the **Duhem-Quine thesis**. However, using this case actually undermines Duhem's more nuanced point and supports Quine's radical skepticism in a way Duhem never intended.

  Pierre Duhem's actual argument was about **holism**: you never test a hypothesis in isolation, but rather a cluster of hypotheses (the theory + auxiliary assumptions + instrument calibration).
  *   **In 1600:** The Copernican hypothesis ($H_c$) was tested against naked-eye data ($D$). It failed to predict parallax. To save $H_c$, Copernicans introduced an auxiliary assumption ($A$): "The stars are incomprehensibly distant."
  *   **The Tychonic Counter:** Tycho argued $A$ was physically absurd (wasted space).
  *   **The Resolution:** When Bessel measured parallax in 1838, he wasn't just testing $H_c$; he was testing the cluster $\{H_c + A + \text{Optics}\}$.

  This is a victory for Duhem's holism, but a defeat for the skeptical reading of underdetermination. The "underdetermination" was resolved not by a shift in "conceptual scheme" or "good sense" alone, but by **improving the auxiliary assumptions regarding instrument precision.**

  By using Tycho/Copernicus to suggest that theory choice is always underdetermined, philosophers imply that the resolution was merely pragmatic. In reality, the resolution was **empirical**. The Earth *does* move. The Tychonic model is *false*, not just "less convenient." Treating it as a permanent standoff suggests a relativism that physics rejects.

  ### 3. Kinematic Equivalence $\neq$ Theoretical Equivalence

  A major source of the philosophical confusion is conflating **kinematic equivalence** (predicting positions on the sky) with **theoretical equivalence** (explaining *why* they move).

  Even in 1600, the models were not fully equivalent.
  *   **Copernicus** offered a unified explanation for retrograde motion (an artifact of Earth's overtaking of planets).
  *   **Tycho** had to treat retrograde motion of the superior planets as a real geometric consequence of them orbiting the Sun, while the Sun orbited Earth.

  While the *positional data* (longitude/latitude of planets) could be fit by both, the **causal structures** were distinct. If one adopts a realist stance (which most physicists do), the theories made different claims about the furniture of the universe.
  *   Claim A: There is a force holding the Earth still.
  *   Claim B: There is no such force; the Earth is in freefall/inertia.

  These are not underdetermined claims; they are contradictory claims. The evidence to distinguish them existed in the universe (e.g., the equatorial bulge caused by rotation); humanity simply lacked the metrology to read it. To call this "underdetermination of theory by evidence" is to blame the map for the lack of detail in the territory.

  ### 4. The Pedagogical Harm: Fueling "Post-Truth" Science

  Why does this matter? Because the Tycho/Copernicus example is often weaponized to suggest that scientific consensus is merely a social construct or a matter of "paradigm preference" rather than empirical constraint.

  If we teach students that Tycho and Copernicus were "empirically equivalent," we imply that the Church's hesitation or Tycho's rejection was epistemologically on par with Galileo's acceptance. It suggests that science cannot decisively rule out false models.

  For a physicist, this is galling. Science *did* rule it out. The underdetermination was temporary. By presenting this as the *classic* case of UTE, philosophers inadvertently validate the idea that current scientific debates (e.g., climate change, evolutionary mechanisms) might also be "underdetermined" in a way that permits permanent dissent. It confuses **current uncertainty** with **permanent ambiguity**.

  ### 5. Where Philosophers Should Look Instead

  If philosophers want to discuss **Principled Underdetermination**, they should abandon the 17th century and move to the 20th and 21st. There are genuine cases where your physicist intuition will find more fertile ground:

  1.  **Interpretations of Quantum Mechanics:** Copenhagen vs. Many-Worlds vs. De Broglie–Bohm. These are genuinely empirically equivalent (so far) regarding measurement outcomes. This is real UTE.
  2.  **Cosmological Horizons:** Models of the universe beyond the particle horizon. We can never, even in principle, receive data from these regions.
  3.  **Gravitational Theory:** Certain modifications to General Relativity can be tuned to mimic $\Lambda$CDM predictions exactly within current error bars, potentially forever.

  Using Tycho/Copernicus is lazy philosophy. It reaches for a historical example that is easily digestible but conceptually flawed. It treats a **metrological limit** as a **logical limit**.

  ### Conclusion: The Physicist's Vindication

  Your bugbear is justified. The Tycho-Copernicus case is a **category error** in the philosophy of science.

  It mistakes a **limit of measurement** for a **limit of logic**. It confuses the *history* of evidence (which accumulates over time) with the *logic* of evidence (which relates theory to observation at a timeless level).

  Philosophers should stop using it as the go-to illustration for the Duhem-Quine thesis. It does not demonstrate that evidence cannot determine theory; it demonstrates that **evidence takes time to mature.** A retired physicist knows that nature keeps the ledger, and eventually, the books balance. The Tycho-Copernicus episode is not a story about the permanent ambiguity of science; it is a story about the eventual triumph of precision. Treating it otherwise is bad history and worse philosophy.
