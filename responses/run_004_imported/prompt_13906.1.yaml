      *   **Defining the Terms:** Clarify "Transient" vs. "Principled" underdetermination. This is crucial for the argument.
      *   **The Physics of the Matter:** Detail *why* they aren't equivalent. Parallax, Aberration, Dynamics (Coriolis). Emphasize that the *mechanisms* differ, even if the *kinematics* looked similar at low precision.
      *   **Reinterpreting Duhem:** Duhem wasn't saying "we can never know." He was saying "testing is holistic." The Tycho case actually *supports* Duhem's holism (need optics + astronomy + mechanics) but contradicts the strong skeptical reading often applied to it.
      *   **Pedagogical Critique:** Why do philosophers love this example? (It's clean, historical, intuitive). Why is it harmful? (It misrepresents the trajectory of science).
