answer: |-
  The air in the High City of Aethel always smelled of cured leather and spiced wine. It was a heavy, sweet scent, the smell of things kept too long in storage.

  Tomas stood on the balcony of his workshop, watching the dust motes dance in the afternoon light. Below, the market was bustling. Merchants haggled over silk weights; children chased mechanical birds that sang in perfect harmony; couples argued over the boundary lines of their garden terraces. It was a city of exquisite, suffocating order. Everyone knew their property, their rights, their contracts. Everyone was safe.

  Tomas felt a tightness in his chest that had nothing to do with the air.

  "You're staring again," Jaren said from the doorway.

  Tomas turned. His brother was wearing the grey tunic of the Vanguard. It was a simple garment, devoid of pockets, devoid of ornament. It swallowed Jaren's frame, making him look less like a man and more like a pillar.

  "I'm watching them," Tomas said, gesturing to the market. "They look happy."

  "They look asleep," Jaren corrected. He walked into the room and picked up a clockwork mechanism Tomas had been repairing. He didn't wind it. He just held the weight of it. "Three generations since the Last Crossing. Do you know what the historians say happens at three generations?"

  "They say the mortar softens," Tomas recited. It was a lesson taught in the schools, right alongside arithmetic. "They say we forget that the walls hold up the roof, and start thinking the roof holds up the sky."

  Jaren set the mechanism down. "And then the roof falls in. Or we tear it down to build a fence."

  This was the doctrine of the Unbinding. It was not spoken of as a tragedy, but as a metabolism. The City grew fat on peace. It grew obsessed with the *Mine* and the *Thine*. It grew obsessed with the preservation of the individual body. And in doing so, it lost the *We*. It lost the Universal. The Unbinding was the fever that broke the stagnation.

  "When do you ship out?" Tomas asked.

  "Sunrise," Jaren said. "The skiffs are being fueled."

  Tomas felt that dread again. It was a cold stone in his gut. He loved his brother. He wanted Jaren to live to be old, to grow fat on spiced wine and argue over garden terraces. That was the natural love of the family, the finite interest. Hegel would have called it the sphere of *Sittlichkeit* rooted in blood. But there was another sphere, the State, which demanded that blood be spilled so the spirit wouldn't rot.

  "Are you afraid?" Tomas asked.

  Jaren looked out at the market. A merchant had just slapped a customer's hand away from a bolt of cloth. A petty dispute over property. "No," Jaren said. "I feel... lighter. Since I took the tunic."

  "That's madness," Tomas snapped. "You're walking into the Void. You might not come back."

  "I know." Jaren turned to him. His eyes were clear, terrifyingly calm. "That's the point, Tomas. If I knew I was coming back, it would just be a job. It would be labor for wages. It would be another transaction in the market."

  He stepped closer, placing a hand on Tomas's shoulder. The grip was firm.

  "Down there," Jaren pointed to the street, "everyone is trying to keep what they have. They are defined by what they hold. When I cross the boundary, I hold nothing. I am not a merchant, or a brother, or a property owner. I am just the City, standing where it ends. For the first time in my life, I am not *mine*. I am *ours*."

  Tomas wanted to shake him. He wanted to scream that being *ours* was a lie told to get men killed. He wanted to say that the comfort of the market was real, and the glory of the Void was a ghost story. But he looked at Jaren's face. He didn't see brainwashing. He didn't see fear. He saw a man who had finally found a gravity that made sense.

  In the peace of Aethel, Tomas felt fragmented. He was a craftsman, a tenant, a bachelor, a debtor. He was a collection of contracts. Jaren, by accepting death, had become whole.

  "It feels like rot," Tomas whispered, voicing the dread he couldn't justify. "I look at the city, and I see it breathing. But I also feel like... like we're waiting for a disease to cure us."

  "Health is not comfort," Jaren said. "A body that never moves, never strains, never risks injury, eventually forgets how to heal. It atrophies. The State is the same. If we do not remind ourselves that the Universal is higher than the Individual, we become animals in a pen. We become consumers of safety."

  "And the cost?" Tomas asked. "The cost is you."

  "The cost is finite," Jaren said. "The gain is infinite. If I stay, I live forty more years of mending clocks and worrying about the rain. If I go, I affirm that there is something more important than mending clocks. I affirm that Aethel is not just a place to sleep."

  Jaren pulled away and walked to the door. He paused, looking back at the clockwork mechanism on the table.

  "Don't wind that," Jaren said. "Let it stop. When I come back, we'll build a new one. One that doesn't need weights to keep time."

  "You sound like the Elders," Tomas said, a bitter edge in his voice.

  "I sound like a man who is finally awake," Jaren replied. "Don't mourn me, Tomas. If you mourn me, you reduce me back to your private property. You make me about *your* loss. Don't do that. Let me be the City."

  Jaren left.

  Tomas stood alone in the workshop. The sun was setting. The shadows lengthened across the floor, turning the tools into strange, jagged shapes.

  Down in the street, the lights were coming on. The merchants were closing their stalls, counting their coins, locking their doors. They were going home to their families, to their warm meals, to their safe, finite lives. Tomas envied them. He hated them. He loved them.

  He walked to the balcony again. In the distance, at the edge of the city, the great skiffs were lifting off. They made no sound; they were designed for silence. They were grey specks rising into the violet twilight, heading for the borderlands where the maps ended.

  Tomas gripped the stone railing. He felt the solidity of the masonry beneath his hands. It was real. The city was real. The peace was real.

  But as he watched the grey specks disappear into the dark, he felt a terrible, vibrating resonance in the stone. It was as if the city itself exhaled, a deep, shuddering breath of relief. The tension in the air broke. The market below seemed to buzz with a little more energy, the lights a little brighter. The stagnation had been punctured.

  Tomas knew Jaren might die. He knew that in a year, there might be a empty chair at the family table. He knew that this was monstrous. To require blood to keep the soul clean was a theology of butchers.

  And yet, as he looked at his own hands—soft, unscarred, safe—he felt a shame he couldn't name. He was safe. He was free. He was irrelevant.

  The skiffs were gone. The sky was empty. The city settled into its comfortable night, ethically alive, washed in the silence of the sacrifice, waiting for the next time the peace grew too heavy to bear.

  Tomas went inside. He did not wind the clock. He let it sit in the silence, ticking down the seconds of a peace that felt, suddenly, like a debt.
