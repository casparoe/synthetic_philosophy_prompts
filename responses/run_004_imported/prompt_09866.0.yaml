prompt: |-
  I help book guests for a small podcast on medieval jewish philosophy. Next week's guest has spent her whole career defending Maimonides' account of animal sacrifice in the Guide -- that sacrifice was never valuable in itself, just a concession to wean the Israelites off the idolatrous cult practices they already had. Draft 8-10 interview questions that go beyond having her restate the view: I want at least one question each on Nahmanides objection that this makes the Torah's central act of divine service basically an accident of history, on the problem that Cain, Abel, Noah and Abraham were all sacrificing well before there was any Egyptian or Canaanite idolatry to wean anyone off of, and on why Maimonides' own law code still expects sacrifice to come back in full once the messiah rebuilds the Temple instead of staying phased out. For each, add a follow-up keyed to the answer she's most likely to give.
