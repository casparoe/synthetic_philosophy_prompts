  2.  **Deconstruct the Positions:**
      *   **Walzer (Traditionalist):**
          *   Core claim: Combatants on both sides have equal moral status (right to kill, liable to be killed).
          *   Reasoning: Practicality, the "fog of war," collective responsibility (the state acts, soldiers obey), and the epistemic limitation (soldiers can't judge the *jus ad bellum*).
          *   Key move regarding epistemology: If soldiers can't know, they aren't culpable, so we treat them as equals to regulate war effectively.
      *   **McMahan (Revisionist):**
          *   Core claim: MEC is false. Just combatants have a right to kill; unjust combatants do not (mostly).
          *   Reasoning: Self-defense analogy. You can't kill someone who isn't threatening you unjustly.
          *   Key move regarding epistemology: Distinguish between *objective liability* (is it permissible to kill them?) and *subjective culpability* (are they blameworthy?). An unjust combatant might be *excused* (blameless) due to ignorance, but they are still not *justified* (their act is still objectively wrong, and they might still be liable to defensive harm).

