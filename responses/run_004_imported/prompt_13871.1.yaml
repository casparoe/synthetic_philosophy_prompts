      *   *Exchange 12 (Institutional Role):* Revisionist clarifies who judges (international courts, not GIs).
      *   *Exchange 13 (Moral Residue):* Walzer asks about the psychological burden on the "unjust" soldier.
      *   *Exchange 14 (Tragedy):* Revisionist acknowledges the tragedy but insists on truth.
      *   *Exchange 15 (Synthesis/Agreement to Disagree):* Both acknowledge the tension between ideal theory and practical regulation.

