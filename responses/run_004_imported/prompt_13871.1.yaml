answer: |-
  **Dialogue: The Fog of War and the Moral Status of Soldiers**

  **Participants:**
  *   **Traditionalist (Walzer-style):** Defends the Moral Equality of Combatants (MEC).
  *   **Revisionist (McMahan-style):** Rejects MEC based on individual liability.

  ***

  **Exchange 1**
  **Traditionalist:** We must start with the convention: soldiers on both sides possess an equal right to fight and are equally liable to be killed. Without this symmetry, *jus in bello* collapses, and war becomes a police action against "criminals."
  **Revisionist:** But that symmetry is a legal fiction that contradicts moral reality. If a soldier fights for an unjust cause, they are threatening people who have done nothing to forfeit their right to life. They cannot have an equal right to kill.

  **Exchange 2**
  **Traditionalist:** You're ignoring the epistemic condition of the soldier. The average infantryman cannot access the classified intelligence or diplomatic cables required to judge the *jus ad bellum*. They are not in a position to know their war is unjust.
  **Revisionist:** I grant that many unjust combatants are ignorant. But we must distinguish between *justification* and *excuse*. Ignorance might excuse them from blame, but it does not justify the act of killing.

  **Exchange 3**
  **Traditionalist:** If they are blameless due to ignorance, what practical work is left for your distinction to do? If we can't punish them for fighting, why deny them the combatant's privilege?
  **Revisionist:** Because liability to defensive harm tracks objective threat, not subjective culpability. Consider an innocent aggressor: if a sleepwalker attacks you, they are blameless, but you still have the right to stop them. Their lack of guilt doesn't grant them a right to kill you.

  **Exchange 4**
  **Traditionalist:** But war isn't a street crime. If we tell just combatants they are facing "unjust threats" rather than "equal enemies," you invite ruthlessness. Why show mercy to someone who has no right to be there?
  **Revisionist:** Mercy isn't based on their right to fight, but on their human rights, which remain intact. We can acknowledge they are objectively in the wrong while still treating them humanely once surrendered. The equality of rights shouldn't depend on the equality of liability.

  **Exchange 5**
  **Traditionalist:** You're asking soldiers to make metaphysical distinctions in the fog of battle. If the unjust soldier believes they are justified, doesn't that reasonable belief create a form of moral parity?
  **Revisionist:** Reasonable belief protects them from *condemnation*, not from *defense*. I can acknowledge a soldier is doing their best with bad information while still maintaining that my killing them is justified self-defense, whereas their killing me is not.

  **Exchange 6**
  **Traditionalist:** This creates a dangerous asymmetry. If only one side is truly "justified," that side becomes the moral arbiter. History shows every nation believes their cause is just. Your theory relies on an objective truth soldiers can't access.
  **Revisionist:** It relies on the truth, not the soldiers' access to it. We don't need every GI to be a philosopher-king. International institutions can determine *jus ad bellum* violations retrospectively. The moral status exists independently of their recognition of it.

  **Exchange 7**
  **Traditionalist:** Retrospective judgment doesn't help the soldier in the trench making split-second decisions. If they suspect their cause is shaky, your theory suggests they should lay down arms. That undermines military efficacy and discipline.
  **Revisionist:** It undermines the efficacy of *unjust* wars, which is a feature, not a bug. If the epistemic barrier is lowered, soldiers might scrutinize orders more. We shouldn't protect the efficiency of aggression by granting moral equality to aggressors.

  **Exchange 8**
  **Traditionalist:** But most soldiers aren't aggressors by choice; they are conscripts or patriots defending their homeland as they see it. To label them "unjust threats" strips them of dignity. The MEC is a way of honoring their shared sacrifice and vulnerability.
  **Revisionist:** Honoring sacrifice shouldn't require falsifying moral rights. We can honor their tragedy—the fact that they were put in a position where they had to do wrong—without saying their killing was permissible. The tragedy is precisely that they are liable to be killed despite being blameless.

  **Exchange 9**
  **Traditionalist:** Let's press the epistemic point again. If the evidence for the war's injustice is ambiguous, isn't the benefit of the doubt enough to establish equality? If it's 50/50, neither side can claim moral superiority.
  **Revisionist:** Ambiguity might reduce liability, but it doesn't equalize it. If Side A is objectively defending sovereignty and Side B is invading, Side B's soldiers are imposing risks they shouldn't, even if they think it's 50/50. The victim's right to life outweighs the invader's uncertainty.

  **Exchange 10**
  **Traditionalist:** You're treating war like a tort case. But war is a collective political act. The soldiers are instruments of the state. If the state bears the guilt, why does the moral inequality devolve to the individual rifleman?
  **Revisionist:** Because rights are individual. The state cannot transfer a right to kill that it does not possess. If the state has no right to invade, it cannot authorize its agents to kill defenders. The liability flows from the individual's participation in the unjust harm.

  **Exchange 11**
  **Traditionalist:** Yet, in practice, we treat POWs from both sides identically. We don't put the "unjust" ones on trial for murder. Doesn't this universal practice validate the moral equality I'm defending?
  **Revisionist:** That validates a *legal* convention, not the underlying morality. We excuse them from prosecution for practical reasons—to encourage surrender and end wars—but that is a pragmatic excuse, not a moral justification for their actions.

  **Exchange 12**
  **Traditionalist:** If the morality and the law diverge that sharply, your theory is useless for guiding action. Moral theory should help us regulate war, not just describe an ideal metaphysical landscape.
  **Revisionist:** Moral theory should tell us the truth about killing, even if the law lags behind. If we admit the law is a pragmatic compromise rather than moral truth, we stop conflating "legal immunity" with "moral permission." That clarity matters.

  **Exchange 13**
  **Traditionalist:** But consider the psychological burden. If an unjust combatant accepts your view, they must believe they are morally liable to be killed while their enemy is not. That creates a demoralizing deficit that could lead to atrocities born of desperation.
  **Revisionist:** It creates a burden, yes. But it also places the burden on the *just* combatant to recognize their enemy might be excused. It demands restraint from the just side, knowing the unjust side is fighting from ignorance. It complicates war, which is honest.

  **Exchange 14**
  **Traditionalist:** I worry that "complicating war" leads to more violence, not less. The MEC is a firewall. It says, "Regardless of why you fight, here are the rules." Your view threatens to burn that firewall down in the name of accuracy.
  **Revisionist:** The firewall is built on a lie. I'd rather build a structure that acknowledges the tragic reality: that blameless people can be legitimate targets, and legal equals can be moral unequals. We can keep the rules, but we shouldn't mistake them for the whole moral story.

  **Exchange 15**
  **Traditionalist:** Then perhaps we agree on the rules but disagree on the foundation. I say the foundation *must* be equality to sustain the rules.
  **Revisionist:** And I say the foundation must be truth to sustain our moral integrity, even if the rules remain pragmatically symmetric for now. We differ on whether morality can tolerate a necessary fiction.
