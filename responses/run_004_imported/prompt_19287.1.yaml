answer: |-
  **Title:** Equilibrium Without Epistemology: Why Lewis's Definition of Convention is Obsolete for Multi-Agent RL

  **Introduction**

  In the field of multi-agent reinforcement learning (MARL), we are constantly hunting for emergent behaviors that look like communication. When our agents develop a signaling system to solve a coordination game, it is tempting to reach for David Lewis's 1969 definition of *Convention*. It is the canonical philosophical citation: a regularity sustained by common knowledge of mutual expectations. It sounds rigorous. It sounds like code. But it is wrong.

  Your colleague who cited Brian Skyrms is right, though perhaps for deeper reasons than she articulated. Lewis's requirement for common knowledge is not merely unnecessary for convention; it is a category error that conflates the *phenomenology* of human agreement with the *mechanics* of coordination. For the purposes of both understanding social dynamics and building MARL systems, we must abandon the Lewisian epistemic threshold. A regularity does not need common knowledge to count as a genuine convention. It needs only dynamic stability and counterfactual robustness. Lewis describes a specific, high-bandwidth human *experience* of convention, but Skyrms describes the *ontology* of convention itself. Furthermore, Margaret Gilbert's objection regarding normativity does not save Lewis; it buries him. She demonstrates that even for humans, Lewis's rationalist framework fails to capture the "ought" of social norms, reinforcing the conclusion that convention is a structural property of a population, not a mental state of an agent.

  **The Computational Impossibility of Common Knowledge**

  To understand why Lewis must be discarded, we have to look at what "common knowledge" actually demands. In Lewis's framework, for a signaling system to be a convention, I must know that you will signal, you must know that I will interpret, I must know that you know that I know, ad infinitum. This is an infinite recursion of mental states.

  In classical game theory, this was a useful idealization. In the context of learning agents—and increasingly in cognitive science—it is a computational phantom. As your researcher noted, Skyrms demonstrated that populations of agents with zero theory of mind, operating on simple reinforcement learning updates or even blind replicator dynamics, converge reliably on signaling equilibria. These agents do not model each other. They do not hold expectations about expectations. They simply adjust their policies based on reward gradients.

  If we accept Lewis's definition, we are forced to say that these agents do not have conventions. They merely have "accidental regularities." This is an untenable position for an ML researcher. If a population of agents reliably coordinates on a signaling system that is arbitrary (one of multiple equilibria), stable against invasion, and robust to noise, it functions exactly like a convention. To deny it the label because the agents lack infinite recursive mind-reading is to privilege human introspection over functional reality. It is like saying a plane doesn't really fly because it doesn't flap its wings like a bird. Lewis confused the *mechanism* of human convention (which often involves high-level reasoning) with the *definition* of convention (which is a coordination equilibrium).

  **Skyrms and the Reality of Emergent Signaling**

  Skyrms's contribution was to shift the locus of convention from the agent's head to the population's dynamics. In his view, a convention is an attractor state in the evolutionary landscape. It is a Nash equilibrium that has been selected for stability.

  This distinction is critical for MARL. When we train agents, we are not engineering common knowledge; we are engineering loss landscapes. We are trying to create basins of attraction where cooperative signaling is the stable solution. If we cling to Lewis, we are chasing a ghost. We might try to architect explicit communication channels or theory-of-mind modules to satisfy the "common knowledge" condition, wasting compute on epistemic overhead that nature and evolution proved unnecessary millions of years ago.

  Skyrms shows us that the "common knowledge" Lewis observed in humans is likely a *post-hoc rationalization* of a stability that was achieved through much simpler learning dynamics. Humans feel like we have common knowledge because we can articulate it, but the convention exists prior to that articulation. The convention is the stability itself. Therefore, for any agent system—biological or silicon—if the system converges on an arbitrary but stable coordination equilibrium, it has formed a convention. The epistemic condition is irrelevant.

  **Gilbert, Normativity, and the Final Nail in the Coffin**

  However, there is a lingering discomfort with the Skyrmsian view, which your colleague raised via Margaret Gilbert. Skyrms explains how we *do* coordinate, but Gilbert asks why we feel we *ought* to coordinate. If I drive on the right side of the road, I don't just expect you to do the same; I feel entitled to expect it, and I feel you are obligated to do it. Lewis tried to ground this "ought" in self-interest (I conform because I want to coordinate). Gilbert correctly identifies that this is insufficient. Self-interest explains compliance, but not normativity.

  Does Gilbert's objection require us to return to Lewis? Absolutely not. In fact, Gilbert's critique devastates Lewis even more thoroughly than Skyrms does. Lewis argues that convention is a solution to a coordination problem based on mutual expectations. Gilbert argues that convention creates a "plural subject"—a joint commitment that generates obligations independent of individual expectations.

  If Gilbert is right, then Lewis's definition is not just too cognitively demanding (as Skyrms shows); it is conceptually empty. You can have Lewisian common knowledge without genuine social normativity (e.g., two criminals silently agreeing to a plan without any sense of mutual obligation, only mutual prediction). Conversely, you can have Gilbertian joint commitment without infinite common knowledge (e.g., a team developing a shorthand through practice).

  For MARL, this distinction is vital. If we want our agents to interact safely with humans, we do not need to give them Lewisian common knowledge. We need to give them something Gilbertian: constraints that function as commitments. We need agents that treat certain signaling regularities not just as optimal policies, but as binding constraints that they "ought" to follow even when a short-term reward deviation is available.

  This does not validate Lewis; it bypasses him. Gilbert shows that the essential feature of social convention is the *normative force*, not the *epistemic state*. Lewis thought the epistemic state created the force. Gilbert shows the force comes from the commitment. Skyrms shows the commitment can be evolutionary. Together, they imply that Lewis's specific formulation—common knowledge of mutual expectations—is neither necessary nor sufficient for genuine convention.

  **The Verdict for Multi-Agent Systems**

  So, where does this leave us in your startup? It leaves us with a clear directive: Stop treating Lewis's *Convention* as the technical specification for emergent communication. It is a historical artifact of pre-computational philosophy.

  A regularity does **not** have to satisfy Lewis's common-knowledge condition to count as a genuine convention. To insist otherwise is to engage in carbon chauvinism, assuming that because humans use high-level reasoning to stabilize conventions, the reasoning is the convention. It is not. The convention is the equilibrium.

  However, we must accept a caveat from Gilbert. If we want our MARL systems to be robust in human environments, "convention" in the Skyrmsian sense (stable signaling) is necessary but not sufficient for *social alignment*. We need the stability of Skyrms plus the normative constraints of Gilbert. We need agents that converge on signaling equilibria and then treat those equilibria as fixed commitments.

  **Conclusion**

  David Lewis provided a brilliant analysis of how rational agents *justify* conventions to themselves. He did not provide a correct definition of what conventions *are*. Brian Skyrms corrected the mechanism: conventions are evolutionary stable strategies, achievable by dumb learners. Margaret Gilbert corrected the status: conventions are normative commitments, not just predictive regularities.

  Both Skyrms and Gilbert agree on one thing: Lewis's common-knowledge apparatus is not the engine of convention. For your work in multi-agent RL, you should operate on the Skyrmsian ontology. Build systems that converge on stable signaling equilibria without requiring explicit theory-of-mind recursion. But heed Gilbert's warning: stability is not enough for trust. If you want your agents to be true partners, do not engineer them to know what you know. Engineer them to commit to what you do. Lewis is obsolete. The future of convention is dynamic, normative, and epistemically humble.
