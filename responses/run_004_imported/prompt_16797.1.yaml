      *   *Accuracy Check:* This is highly accurate. Anscombe's core contention in "Mr. Truman's Degree" is precisely about the *intention* vs. *foresight* distinction. She argues that area bombing (and specifically the atomic bombs) targeted the civilian population *as such* to break will. This violates the absolute prohibition on murder. She explicitly rejects the utilitarian calculus (good outcomes don't justify evil means).
