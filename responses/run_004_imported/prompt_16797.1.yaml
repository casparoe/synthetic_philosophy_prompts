answer: |-
  This is a really solid foundation. You're right to be cautious about walking into office hours without checking the literature, but honestly, your instincts here are sharp. You've grasped the core philosophical mechanism of the pamphlet better than most undergraduates do on a first read.

  Here's the gut check you asked for, broken down by your two questions.

  ### 1. Is your summary of Anscombe's argument accurate?

  **Yes, it holds up.** You haven't flattened the Double Effect (DDE) distinction in a way that would get docked; in fact, you've identified the exact pivot point Anscombe cares about.

  *   **The Intention/Foresight Distinction:** You correctly note that Anscombe isn't arguing about *proportionality* (i.e., "too many civilians died"). She is arguing about *intentionality*. In standard DDE, civilian death is permissible only if it is *praeter intentionem* (outside the intention)—a foreseen but unintended side effect of hitting a military target. Anscombe's charge is that Truman (and the RAF area bombing campaign before him) made the death of civilians the *means* to the end (breaking morale/will). When you make evil the means, DDE is off the table.
  *   **The Rejection of Consequentialism:** You also correctly identify that she dismisses the "saved lives overall" argument. For Anscombe, certain actions (like murder) are intrinsically forbidden. No amount of good consequences can "wash" the blood off the act. This is the deontological core of her position.

  **One nuance to keep in mind for the paper:**
  Anscombe also touches on the idea of "justice" in the sense of *authority*. She argues that Truman acted as a pirate or a brigand because he assumed an authority to judge and execute a population that he did not possess. However, for a short paper focusing on DDE and intention, your current focus is perfectly acceptable. Just don't conflate "murder" (moral category) with "war crime" (legal category); Anscombe is operating in the moral/theological register.

  ### 2. Is the deterrence move a decent extension or a known objection?

  **It is a very well-known objection, but that doesn't mean you can't use it.** In fact, using it shows you understand the trajectory of her thought. You should absolutely cite the literature here rather than presenting it as a novel discovery, or your professor might think you haven't done the background reading.

  The "nagging feeling" you have about the rationality puzzle is almost certainly **Gregory Kavka**.
  *   **The Reference:** Look up Kavka's *"The Paradox of Deterrence"* (1978) or his book *Hobbesian Moral and Political Theory*.
  *   **The Puzzle:** Kavka formalized the problem you identified: Is it rational (or moral) to form an intention to do something (mass slaughter) that it would be irrational (and immoral) to actually do when the time comes? If deterrence relies on a bluff, it might fail. If it relies on a sincere intention, the agent is morally corrupted (on Anscombe's view) even if they never pull the trigger.

  **Anscombe's Actual Position on Deterrence:**
  You mentioned she has a later essay. You are right. She was heavily involved in the debates surrounding the **US Catholic Bishops' Pastoral Letter *The Challenge of Peace* (1983)**.
  *   Anscombe (along with other philosophers like Philippa Foot) was critical of the "conditional intention" loophole. The Bishops tried to argue that possessing nukes was okay *provided* you didn't intend to use them immorally. Anscombe argued this was nonsense: you cannot deter with a weapon you intend *not* to use. If the intention to use is conditional on being attacked, you still hold a conditional intention to murder innocents. For Anscombe, holding that conditional intention is itself a sin/moral corruption.

  **How to frame this in your paper:**
  Don't present this as "I applied Anscombe to deterrence and found a problem." Instead, frame it as: *"Anscombe's logic in 'Mr. Truman's Degree' anticipates the later debates on nuclear deterrence, specifically the problem of conditional intention raised by Kavka and addressed in the 1983 Bishops' Pastoral."*

  This shows you understand that her pamphlet wasn't an isolated rant but part of a consistent ethical framework she maintained throughout her career.

  ### Office Hours Strategy

  When you go to see your professor, lead with the Kavka/Deterrence connection. Say something like:

  > "I'm confident I have her DDE argument down in the first half, but for the extension, I want to connect her view on intention to the 'Paradox of Deterrence.' I know Kavka wrote on this, and I know Anscombe weighed in on the Catholic Bishops' letter regarding conditional intention. Do you think it's better to focus on Kavka's rationality puzzle, or stick closer to Anscombe's specific moral critique of conditional intention?"

  **Verdict:** The bones are strong. You aren't walking in with something dumb; you're walking in with a standard but philosophically rich interpretation that just needs the right citations to signal you know the conversation. Go for it.
