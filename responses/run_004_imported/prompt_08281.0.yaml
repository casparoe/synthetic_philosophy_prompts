answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I have the distinct privilege of knowing the bride from our time in graduate school, where we spent a lot of late nights reading dense German philosophy and arguing about the nature of meaning. Which, as it turns out, is excellent training for a marriage.

  I know a lot of you have heard the story about how [Bride] and [Groom] have invented their own "private language." They have specific words, specific sounds, specific looks that mean something only to them. And whenever anyone rolls their eyes at how insufferable that is, [Bride] just smiles and says, "Relax, we're doing Wittgenstein."

  Now, half the people in this room just nodded. The other half is wondering if Wittgenstein is a type of fondue.

  Here is the truth: I went back and I read the book. I looked at the *Philosophical Investigations*. I looked at the famous arguments about private language. And I have to stand here today, as a friend and as a philosopher, and tell you: They are wrong.

  According to Ludwig Wittgenstein, a truly "private" language—one that refers to sensations only one person can know, with no way for anyone else to check if it's being used correctly—is impossible. It can't work. You can't have a rule that only you follow, because you'd have no way to know if you were following it right or just remembering it wrong. You need a community to establish meaning. You need other people.

  So, technically, what [Bride] and [Groom] have built isn't a private language at all.

  But that is actually so much better.

  Because what they have done, what they do every day, is build a community of two. They have created a shared world where things mean something because they *both* agree on what they mean. When [Groom] says a nonsense word, and [Bride] laughs, that isn't isolation. That is validation. That is a public criterion of correctness, established in real-time, between two people who pay close enough attention to know exactly what the other is feeling.

  Wittgenstein wrote that for language to work, it has to be part of a "form of life." It has to be woven into what you do, how you live, and how you care for one another.

  And that, to me, is the most accurate description of love I can offer.

  Love isn't a private sensation locked inside a box that you try to show to someone else. Love isn't guessing what the other person is thinking. Love is the hard, daily work of building a shared language. It is agreeing on what matters. It is learning the specific rhythm of how the other person needs to be comforted. It is developing a shorthand for "I'm tired," or "I'm proud of you," or "Let's go home now."

  To the family and friends here who don't care about the philosophy: You know this feeling. It's the inside joke that makes you both laugh when no one else gets it. It's the look across a crowded room that says, "I'm with you." That isn't privacy. That is connection. That is the opposite of being alone.

  [Bride] and [Groom], you claimed you were defying the rules of language. But you actually proved the most important one: Meaning requires us to be known. You cannot make sense of your life in isolation. You need a witness. You need a partner who learns your vocabulary, who corrects you gently when you're wrong, and who remembers what your words mean even when you forget.

  You have built a world where you are never unintelligible to one another. You have made sure that, between the two of you, nothing important has to go unsaid.

  So, if this isn't a private language, what is it? It's a vow. It's a promise that you will keep building this shared meaning, that you will keep checking in, keep listening, and keep ensuring that you both know exactly where you stand.

  Wittgenstein said, "The limits of my language mean the limits of my world."

  [Bride] and [Groom], looking at the two of you, I see that you have expanded each other's worlds. You have made the limits wider. You have made the meaning richer.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your community of two always be kind. May your shared language always be fluent. And may you never run out of new words to say, "I love you."

  Cheers.
