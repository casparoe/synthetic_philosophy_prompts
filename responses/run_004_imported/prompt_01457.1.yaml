      *   *Nuance:* In Deep RL, we often use RNNs. This effectively gives the agent memory, solving AMD. The problem arises if we constrain the policy to be memoryless (reactive) *and* allow the agent to re-calculate beliefs based on that policy.
      *   *Clarification on "Action-Optimal":* In AMD, the action-optimal solution is often controversial. Some argue the planning optimal *is* the only rational one. I need to present the tension clearly.

  8.  **Final Polish:**
