prompt: |-
  I spent about thirty years running an analytical chemistry lab before I retired, and for the last couple of years I've been on a real philosophy kick to fill the time. A few of my old colleagues now do a monthly Zoom where somebody gives a short talk and we all grill them afterward, and next month's guest is a historian of philosophy whose whole pitch is that Henry Sidgwick's decades of unpaid work for the Society for Psychical Research -- the thought-transference tests, the Census of Hallucinations, sitting in dark rooms with mediums -- wasn't some eccentric hobby bolted onto an otherwise rigorous career, but flows directly out of the unresolved "dualism of practical reason" at the end of the Methods of Ethics. Her argument, as I understand it, is that Sidgwick genuinely thought the rational egoist and the utilitarian have no non-question-begging way to settle their dispute unless the universe is morally governed, and since he'd already lost his orthodox faith (he famously resigned his own Trinity fellowship over a religious scruple), psychical research was his attempt to get actual empirical evidence for that kind of moral order rather than just postulating it on faith. As an old lab hand this whole episode fascinates me, because Sidgwick was about as far from a crank as it gets, and yet his own circle caught the Creery sisters using a signal code and later caught Eusapia Palladino cheating outright in Cambridge, and none of it seems to have shaken him loose from the project -- if anything he just kept refining the controls.

  Could you draft me 8 or 9 interview questions for this guest that actually engage with that specific thesis rather than just having her re-explain who Sidgwick was? I'd like at least one question pressing on whether the repeated exposures of fraud should count as real evidence against Sidgwick's rationality or just bad luck in his choice of subjects, one on why the dualism-of-practical-reason argument needs psychical research at all rather than being satisfiable by plain religious faith (which he'd already ruled out for himself on other grounds), and one on the "cross-correspondences" -- the automatic-writing material that only really got going once Sidgwick, Myers and Gurney were all dead -- and whether it's even coherent to credit "Sidgwick's research program" with a result he never lived to assess. For at least three of the questions, add a short note on the answer she's most likely to give and a sharper follow-up keyed to that specific answer, the way you'd actually push back live instead of lobbing softballs.
