answer: |-
  Here are 9 interview questions drafted for your Zoom session. They are designed to respect the guest's expertise while leveraging your group's scientific background to press on the methodological and philosophical tensions in Sidgwick's work.

  Per your request, three of the questions include a "Likely Answer" note and a "Sharper Follow-up" to help you pivot live if she gives the standard academic defense.

  ### 1. The Ethical Imperative
  Your thesis rests on the idea that the SPR wasn't a hobby, but a necessary extension of the *Methods of Ethics*. If I understand the "dualism of practical reason" correctly, Sidgwick is stuck between what's good for me and what's good for the whole. You argue he turned to psychical research to find a mechanism of cosmic justice that resolves this. But isn't there a category error here? How does establishing the *fact* of telepathy or survival of death logically compel the *obligation* to be utilitarian? Does a ghost guarantee a moral universe, or just a crowded one?

  ### 2. The Fraud Problem (With Follow-up)
  From my background in analytical chemistry, if you run a series of assays and keep finding contamination or signal interference—in Sidgwick's case, the Creery sisters' signaling or Palladino's tricks—the standard protocol is to invalidate the method or the hypothesis. Sidgwick, however, treated these exposures as reasons to tighten controls rather than abandon the project.
  **Question:** Do you view Sidgwick's reaction to repeated fraud as a model of scientific resilience, or does it suggest that the ethical *need* for the phenomenon to be real was overriding his empirical assessment of the data?

  *   **Likely Answer:** She will likely argue that Sidgwick was distinguishing between "false positives" (fraud) and "false negatives" (missing a real phenomenon). She'll suggest he believed the cost of rejecting a true psychic phenomenon was higher than the cost of investigating a fraud, so he refined the controls rather than quitting.
  *   **Sharper Follow-up:** "But in my field, if your 'signal' requires perfect conditions that never actually occur in the wild, we call that an artifact. If the only way to get a clean result is to eliminate every variable a medium can manipulate, haven't you defined the phenomenon out of existence? At what point does 'refining controls' become 'moving the goalposts' to protect the hypothesis?"

  ### 3. Empiricism vs. Religious Scruple
  Sidgwick resigned his Trinity fellowship because he couldn't honestly subscribe to the Thirty-Nine Articles. He rejected orthodox faith on intellectual grounds. Yet, your argument is that he sought empirical proof for a religious *conclusion* (a morally governed universe).
  **Question:** Why did he think psychical research could succeed where theology failed? Was he looking for a type of certainty that faith couldn't provide, and if so, isn't he essentially trying to use a telescope to read a poem?

  *   **Likely Answer:** She will probably emphasize Sidgwick's commitment to "public verifiability." She'll argue he didn't want private faith; he wanted evidence that could be accepted by any rational agent, which theology couldn't provide but science (in his view) could.
  *   **Sharper Follow-up:** "But the evidence he was chasing is inherently private and subjective—hallucinations, seance room touches, automatic writing. It's the opposite of public verifiability. Did he not realize that by trying to scientificize the spiritual, he was actually making it *less* robust than the theological tradition he left behind?"

  ### 4. The Cross-Correspondences (With Follow-up)
  The "Cross-Correspondences"—the complex automatic writing scripts that allegedly interlock across different mediums—are often cited as the crown jewel of the SPR's findings. But Sidgwick died in 1900, and the bulk of that data emerged years later.
  **Question:** Is it historically coherent to credit "Sidgwick's research program" with a result he never lived to assess, verify, or critique? Does attributing this success to him risk turning him into a figurehead for a conclusion he might have rejected?

  *   **Likely Answer:** She will likely contend that the Cross-Correspondences were the direct execution of a protocol Sidgwick, Myers, and Gurney designed while alive. She'll argue the *design* was Sidgwick's, even if the *data collection* outlasted him.
  *   **Sharper Follow-up:** "In a lab, if the Principal Investigator dies before the data is analyzed, they don't get to sign off on the conclusion. Given that Sidgwick was the most skeptical of the 'big three,' do we have any reason to think he would have accepted the Cross-Correspondences as proof, or is it more likely he would have applied the same scrutiny to them that he applied to Palladino?"

  ### 5. The Census of Hallucinations
  Sidgwick was instrumental in the "Census of Hallucinations," which was essentially a large-scale statistical survey of bereavement visions. This looks much more like modern epidemiology than seance work.
  **Question:** Do you see a tension in Sidgwick's approach between the "hard" experimentalism of the seance room (testing specific claims) and the "soft" statistical approach of the Census (aggregating anecdotes)? Did he hope the Census would provide the statistical significance the seance tests kept failing to deliver?

  ### 6. The Role of Frederic Myers
  Frederic Myers was the poet and the visionary; Sidgwick was the anchor and the critic. Often, historians suggest Myers drove the metaphysical agenda while Sidgwick provided the philosophical cover.
  **Question:** How much of this "ethical necessity" you describe was genuinely Sidgwick's motivation, and how much was him trying to keep Myers' more flamboyant spiritualism within the bounds of respectability? Was Sidgwick the driver, or the brake man who eventually got tired of holding the lever?

  ### 7. The "Dualism" Payoff
  Let's return to the *Methods of Ethics*. Even if Sidgwick succeeded—even if he proved beyond doubt that consciousness survives death—does that actually solve the dualism of practical reason?
  **Question:** Survival of death doesn't necessarily imply a moral administration of the universe. One could survive death in a morally indifferent void. Did Sidgwick conflate "survival" with "divine justice," and if so, was that a logical error or a psychological necessity for him?

  ### 8. Methodological Legacy
  You've argued we should take Sidgwick's SPR work seriously as philosophy, not just dismiss it as a Victorian eccentricity.
  **Question:** If we accept that his psychical research was a rational response to an ethical problem, what does that imply for modern philosophy? Are there current ethical impasses today that philosophers are trying to solve with empirical science in ways that might look just as strange to our successors as Sidgwick's seances look to us?

  ### 9. The Personal Cost
  Sidgwick described his loss of faith as a "fundamental catastrophe." He spent decades and much of his private income on the SPR without ever publicly claiming a definitive victory.
  **Question:** In your research, did you find any private correspondence where Sidgwick admitted exhaustion or despair with the project? Or did he maintain the stoic posture of the investigator right to the end, genuinely believing he was on the verge of a breakthrough that would vindicate both his ethics and his life's work?
