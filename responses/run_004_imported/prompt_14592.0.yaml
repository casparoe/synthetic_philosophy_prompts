answer: |-
  This is a classic philosophical standoff, effectively a real-world dramatization of the debate between **Internalism** (Derek) and **Externalism** (Naomi) about practical reasons. Your intuition from that philosophy class was spot-on: Derek is arguing that reasons must be grounded in an agent's current "subjective motivational set" (a view famously associated with Bernard Williams), while Naomi is arguing that reasons can exist independently of current desires, grounded in objective facts like commitments or duties.

  Here is an analysis of the exchange move-by-move, followed by an overall verdict.

  ### Move-by-Move Analysis

  **Move (1): Derek's Opening Salvo**
  *   **The Claim:** Reasons require current psychological buy-in. No care = no reason.
  *   **Assessment:** **Derek wins on psychological plausibility, but loses on normativity.**
      Derek is describing how motivation actually *works*. It is hard to see how a fact (a past promise) moves a person to act if they have zero desire to honor it. However, he conflates "what motivates me" with "what I ought to do." If his view were universally adopted, the institution of promising would collapse, because a promise is only useful if it binds the future self when the present self's feelings might change. He is treating a promise like a prediction of feelings rather than a creation of obligation.

  **Move (2): Naomi's Functionalist Counter**
  *   **The Claim:** The purpose of promising is to bind you *despite* changing feelings. The commitment creates the reason.
  *   **Assessment:** **Naomi takes the lead here.**
      She correctly identifies the social function of the practice. If Derek were right, making a promise would just be saying, "I intend to do this as long as I feel like it." But when we promise, we intend to surrender our future discretion. Naomi points out that Derek is evaluating the promise by the wrong standard (current emotion) rather than its proper standard (past commitment). She exposes that Derek's view makes the concept of a "promise" incoherent.

  **Move (3): Derek's Distinction (The "Williams Point")**
  *   **The Claim:** There is a difference between being blameworthy (a judgment of character) and having a reason (a motivator). He admits he might be a "worse friend" but denies that this creates a motivating reason.
  *   **Assessment:** **Derek recovers significant ground.**
      This is his strongest philosophical move. He is distinguishing between *normative judgment* (Naomi saying he *should*) and *practical reason* (Derek saying he *won't*). He is arguing that calling him "loyal" or "disloyal" is just name-calling unless it connects to something he cares about (e.g., caring about his reputation). He is right that you cannot force a reason into someone's mind like a physical object; if he truly doesn't care about loyalty or Felix, telling him he "has a reason" feels like speaking a different language. He highlights the gap between *justification* and *motivation*.

  **Move (4): Naomi's "Reward for Neglect" Argument**
  *   **The Claim:** Reminders work on indifferent people (implying the reason was there), and allowing indifference to cancel obligations rewards emotional neglect.
  *   **Assessment:** **Naomi lands the decisive blow.**
      She addresses Derek's distinction in Move 3 by appealing to our actual practices. When we remind someone of a promise, we aren't trying to give them a *new* desire; we are pointing out an *existing* obligation they are ignoring. If Derek's view were correct, the most effective way to get out of a debt or a vow would be to ruthlessly extinguish all care for the creditor or the vow. This leads to absurd moral consequences: the most psychopathic person (who cares about nothing) would have the fewest obligations. Naomi shows that Derek's view creates a perverse incentive structure.

  ### Where They Talk Past Each Other

  There are two key areas where Derek and Naomi are missing the nuance required to settle this:

  1.  **Motivating vs. Normative Reasons:**
      Derek is talking about *motivating reasons* (what actually gets me out of bed). Naomi is talking about *normative reasons* (what justifies the action whether I get out of bed or not). They are both partially right. Derek is right that he lacks a *motive*; Naomi is right that he lacks a *justification* for quitting. The disagreement persists because they haven't agreed on whether "reason" means "psychological push" or "rational requirement."

  2.  **The Nature of the "Drift":**
      Neither considers *why* the friendship ended. If Felix betrayed Derek, Derek's lack of care is justified, and the promise might be voided by a change in circumstances. If Derek simply let the friendship die through negligence (as Naomi implies in Move 4), then Derek is responsible for the loss of the very care he claims excuses him. You cannot create an excuse by destroying the condition of the obligation. This is a missing consideration that heavily favors Naomi.

  3.  **Reliance Interests:**
      Both ignore Felix's position. Two months before the wedding, Felix is relying on this promise. The "reason" to act isn't just about Derek's internal state or the abstract nature of promises; it's about the tangible harm Derek causes Felix by withdrawing now. This external consequence creates a reason for Derek to act, regardless of his internal feelings.

  ### Overall Verdict

  **Naomi's underlying view of reasons is more defensible.**

  While Derek's Internalism (Move 1 & 3) offers a clean explanation of human psychology, it fails as a guide for human *obligation*. If we accept Derek's view, we must accept that moral obligations are contingent on our moods. This makes morality too fragile to do the work we need it to do.

  Naomi's Externalism captures a crucial truth: **We can create reasons for ourselves through our past actions.** When Derek made that promise in college, he didn't just predict his feelings; he altered his normative landscape. He gave Felix a right to expect his presence. That right exists independently of Derek's current emotional state.

  Derek is correct that he currently lacks the *motivation* to fulfill the promise. But Naomi is correct that he possesses the *reason*. The fact that he has to suppress his current indifference to act on that reason doesn't mean the reason isn't there; it means that being a person of integrity often requires acting on reasons that override our transient feelings.

  **Practical Conclusion:** Derek should be the best man. He is not being asked to renew the friendship, but to honor a specific commitment made when he was in a position to bind his future self. To do otherwise is to claim that his current indifference is more important than his past word and his friend's reliance—a claim that, as Naomi noted, rewards him for the very neglect that caused the drift.
