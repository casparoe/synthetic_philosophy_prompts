      *   **Julian:** Holding a coffee mug (C). Wallet lighter.
      *   **Elena:** Observing.
      *   **Bookie:** Off-screen or mentioned.

      *Key argument to highlight:* The "Separability" principle. Elena will argue that at the moment of choice, only the current options matter. Julian will argue that the history and future matter.

      *Wait, one nuance:* If Julian stops at C because he values money, does that mean his preference is actually $C + \$30 \succ A + \$0$? Yes. Elena will pounce on this. "So your preferences are transitive over wealth-bundles!" Julian must resist this. He must claim the *underlying* preference is cyclic, but rational action constrains it. This is the "Resolute Choice" stance (McClennen).

