      *   *Audience:* Dual coding (Rationalists get the refs, Normies get the sentiment).

      *(Self-Correction during drafting)*: Make sure I don't sound *too* much like I'm defending them. It shouldn't sound like they are on trial. It should sound like they are winning. The choice is an act of love, not fear.

