      *   **Constraints:** 3-4 minutes max (approx. 400-600 words spoken at a moderate pace).
      *   **Specific Challenge:** Explain Benatar's asymmetry argument simply but correctly (Absence of pain = good even if no one experiences it; Absence of pleasure = not bad unless someone exists to be deprived).

  2.  **Determine the Tone:**
      *   Warm and celebratory (it's a wedding!).
