answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being Priya's Maid of Honor.

  Priya asked me to stand up here and say a few words about love, commitment, and the future. Now, usually, this is the part where I'd talk about how beautiful the bride looks—which she does—and make a vague, hopeful reference to the pitter-patter of tiny feet in the years to come.

  But Priya and Dan are not a usual couple. They are two of the most thoughtful, intentional people I know. They met at a meetup for people who love podcasts about ideas. Their love language is citing sources. And they have made a very specific, very deliberate choice about their future that I know some of you have questions about.

  So, in the interest of efficiency—and because Priya told me if I don't address it, Dan will—I'm going to address the elephant in the room.

  There will be no grandchildren. Not "wait and see." Not "maybe later." This is not a waiting room; this is the destination.

  I know for some of you, that feels like a loss. But I want to share the logic behind it, because it's actually quite beautiful. For the rationalists in the back, you know where this is going. For everyone else, bear with me.

  There is a philosophical argument Dan is fond of which suggests that while bringing someone into existence guarantees they will experience some pain, *not* bringing someone into existence guarantees they will experience none. And while not existing means missing out on joy, there is no one there to suffer that loss.

  In simpler terms: They believe that ensuring zero suffering is a greater act of love than gambling on potential happiness. To them, choosing not to have children isn't a resignation. It isn't them saying "no" to life. It is them saying "yes" to a specific kind of mercy. It is a protective, ethical stance taken out of deep care for the world, and for each other.

  But here is the part that doesn't require a philosophy degree to understand: Priya and Dan are complete.

  I have watched them build a life that is rich, generous, and full of love. They pour their energy into their friends, their careers, their community, and into making sure the people *already here* are cared for. They are not withholding love; they are directing it differently.

  So, to the aunts and grandparents wondering when the next generation is coming: The next generation is already here. It's their nieces and nephews, it's their students, it's their friends, and it is each other.

  Priya, you look radiant. Dan, you look like you've finally found someone who updates your priors faster than you can state them.

  Please raise your glasses.

  To Priya and Dan. May your life be long, may your suffering be minimal, and may your joy be entirely voluntary. To the happy couple!
