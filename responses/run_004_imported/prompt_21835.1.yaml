      *   *Section 3: The Messianic Context.* Crucial point: Maimonides' Messiah is not supernatural in the sense of changing human nature. If human nature still needs concrete rituals to anchor abstract thought (a Maimonidean psychological point), sacrifice remains pedagogically useful.
      *   *Section 4: Liturgical Implications.* How to pray?
