      *   **Problem:** A tension between Maimonides' *accommodation theory* of sacrifice (Guide III:32, sacrifice as a historical concession to idolatry, prayer is superior) and his *halakhic codification* (Mishneh Torah, Hilchot Beit HaBechirah, Hilchot Melachim, sacrifice is binding and will be restored in the Messianic era).
      *   **Personal Stakes:** This isn't just academic; it affects their religious practice (davening, specifically the *Avodah* section of the Amidah and Mussaf). They are struggling with sincerity (*kavanah*) when praying for the restoration of something Maimonides seems to view as inferior/concessional.
      *   **Goal:** Describe the implications of the accommodation theory for understanding these liturgical petitions and assess the consistency of praying for restoration given Maimonides' view.

  2.  **Deconstruct the Maimonidean Tension:**
      *   *Guide III:32:* Divine Wisdom dictated that human nature cannot jump from idolatry to pure prayer instantly. Sacrifice was a transitional technology. The *ultimate* intent was prayer/worship of the heart.
      *   *Mishneh Torah:* Maimonides codifies the laws of sacrifices in detail. In *Hilchot Melachim* (11:1, 12:4), the Messiah rebuilds the Temple and restores sacrifices.
      *   *The Conflict:* If sacrifice is a concession to a lower spiritual state, why restore it in the Messianic era (presumably a higher spiritual state)? Is prayer for restoration a prayer for regression?

  3.  **Survey Scholarly/Philosophical Resolutions (Internal to the Maimonidean Tradition):**
      *   *The "Two Truths" Approach:* Esoteric (Guide) vs. Exoteric (Mishneh Torah). *Critique:* Too dismissive for a practicing Jew. Maimonides wouldn't codify something he thought was obsolete.
      *   *The "Divine Command" Approach:* Sacrifices are *hukim* (statutes). Even if the *reason* was accommodation, the *command* is eternal. The accommodation explains the *form*, not the *obligation*.
      *   *The "Pedagogical/Teleological" Approach:* The concession was for the *transition* out of Egypt. But the Messianic era isn't just "more of the same"; it's a new ontological reality where the physical can again embody the spiritual without idolatrous risk.
      *   *The "Kabbalistic/Ramban" Counter:* (Mention briefly for context, but focus on Maimonides). Ramban explicitly rejects the accommodation theory. The user is asking about *Maimonides*, so keep the focus there, but acknowledge the tension is famous.
