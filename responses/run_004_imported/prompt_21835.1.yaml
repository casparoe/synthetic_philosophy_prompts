      *   *Best argument (Soloveitchik-esque):* The "why" is speculative; the "what" is binding. Prayer for restoration is prayer for the opportunity to obey.

      *(Self-Correction during drafting)*: I need to be careful not to conflate Maimonides with Rav Kook. Rav Kook explicitly says sacrifices won't return. Maimonides explicitly says they *will*. I must stick to Maimonides' text. Maimonides says they *will* return. The user asks how to pray *given Maimonides' account*.
      *   *Resolution:* The accommodation theory explains the *concession* to idolatrous *habit*. It does not necessarily negate the *intrinsic value* of sacrificial service as a form of obedience and communal focus, even if prayer is "higher" in terms of intellectual worship. The Messianic era restores the *political/religious center*, not necessarily the *psychological necessity* of weaning off idolatry.

      *Wait, let's look closer at Guide III:32.* "The primary object of the commandments... is to render us perfect... to abolish idolatry." If idolatry is abolished in the Messianic era, is the object fulfilled?
