prompt: |-
  I never studied philosophy formally -- I fell into this topic through a strange side door, reading popular accounts of general relativity and getting stuck on a detail that none of them explained well: the anomalous advance of Mercury's perihelion had been sitting around, unexplained, for decades before Einstein's theory accounted for it, and yet everyone still treats that old, already-known data as some of the most persuasive confirmation general relativity ever received. Chasing that thread led me to the 'problem of old evidence' in Bayesian philosophy of science, and I've been turning it over in my head, on and off, for a couple of years now: on the textbook Bayesian picture, if you already assign the data probability 1 before the theory even shows up, conditionalizing on it later can't move your credence in the theory at all -- which seems to get the historical episode exactly backwards.

  I host a small interview podcast out of my apartment, mostly for my own benefit and a couple hundred listeners, and next week I'm talking to a philosopher whose signature move is to deny that Bayesian agents have to be logically omniscient. Her claim, as I understand it, is that what actually shifts credence isn't the old data itself but the theorist's later, non-obvious discovery that the theory entails it -- so the real updating happens on a newly learned fact about entailment, not on the evidence itself.

  Could you draft seven to nine interview questions for her that don't just give her room to restate that move in the abstract? I'd like at least one question pushing on whether relaxing logical omniscience actually solves anything or just relocates the mystery one level up, since she now owes some account of how an agent assigns probabilities to entailment claims she hasn't yet 'seen' proven; one question asking her to distinguish her proposal from rival strategies that appeal to a counterfactual credence -- what the agent would have believed had she never learned the old evidence in the first place -- and whether her own account can even be stated without quietly relying on a counterfactual of that same kind; one question on whether her view is symmetric with, or in tension with, the familiar intuition that a theory built to fit data it was already handed deserves less credit than one that predicts fresh data, since 'old evidence' and 'mere accommodation' look like the same worry seen from two directions; and one question about whether this machinery is meant to describe how scientists actually reasoned about Mercury, or is explicitly a rational-reconstruction exercise that wouldn't survive contact with how Einstein and his contemporaries actually talked about the result. For each of these, please add a short, specific follow-up keyed to the answer she's most likely to give, so I'm not left improvising if she reaches for the standard reply.
