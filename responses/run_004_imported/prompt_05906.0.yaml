answer: |-
  Here are nine interview questions tailored to your guest's position on logical non-omniscience and the Problem of Old Evidence, including specific follow-ups designed to keep the conversation from stalling on standard defenses.

  **1. The Mercury Entry Point**
  "I want to start where I started: with Mercury. In the popular story, Einstein feels a physical reaction when he realizes General Relativity yields the exact number for Mercury's perihelion that astronomers had been staring at for decades. On the textbook Bayesian view, that reaction is irrational; the data was already certain, so it shouldn't move the needle on the theory. You argue the needle moves because Einstein learned a new *connection*, not new data. But when you say he updated on the 'entailment,' are you describing a psychological feeling of surprise, or are you claiming there is a literal, formal proposition—'$T$ entails $E$'—that gets added to his probability calculus?"

  *   **Follow-up:** If she says it's a **formal proposition**: "If it's a formal proposition in the calculus, doesn't that require the agent to have a prior probability for a logical truth before they've proven it? How do you justify a prior on a mathematical necessity without making it arbitrary?"
  *   **Follow-up:** If she says it's **psychological**: "If it's just psychological surprise, does that mean confirmation is merely a feeling of cognitive relief, rather than an objective relation between theory and world?"

  **2. Relocating the Mystery (Required Topic)**
  "Standard Bayesianism gets stuck because it assumes agents know all the logical consequences of their beliefs instantly. You relax that. But critics argue this just relocates the mystery one level up. To update on the fact that '$T$ entails $E$,' I have to have had some prior uncertainty about that entailment. But entailment is a matter of logic, not chance. Where does that uncertainty come from? Are we saying that before the proof, logic itself was 'fuzzy' for the agent, or just that the agent was imperfect?"

  *   **Follow-up:** If she says **agents are imperfect/bounded**: "If the imperfection is just a human limitation, does your solution solve the *philosophical* problem of confirmation, or does it just offer a workaround for human cognitive limits? In other words, is Old Evidence still a problem for an ideal God-like agent?"

  **3. The Counterfactual Trap (Required Topic)**
  "There are rival solutions to the Old Evidence problem, like Daniel Garber's, which suggest we should ask: 'What would your credence be *if* you hadn't known the evidence yet?' You reject that in favor of updating on the entailment. But I'm struggling to see the daylight between the two. To say I 'learned' the entailment implies there was a time I didn't know it. If I am a rational agent, shouldn't I have known it all along? Doesn't your 'learning' narrative quietly rely on the same counterfactual—what I would have believed before I did the math—that you're trying to avoid?"

  *   **Follow-up:** If she denies **reliance on counterfactuals**: "So you're saying the actual history of my thinking matters more than the logical relations? If so, does that mean two agents with the same evidence and theory, but different speeds of calculation, should rationally end up with different degrees of belief?"

  **4. Accommodation vs. Prediction (Required Topic)**
  "Scientists often say a theory that *predicts* fresh data is more valuable than one that *accommodates* old data. Some call this a bias, but others say prediction shows a theory has 'risked' falsification. If your view says old evidence confirms a theory just as soon as we realize the entailment, doesn't that erase the distinction between prediction and accommodation? If Mercury confirms GR just because Einstein found the link, why shouldn't a theory built specifically to fit Mercury's orbit get the same credit?"

  *   **Follow-up:** If she argues **prediction involves risk**: "Bayesian updating happens *after* the outcome is known in both cases. The math of conditionalization looks the same whether the data came in yesterday or fifty years ago. Where does the 'risk' enter the equation if the probability update is retrospective?"

  **5. History vs. Rational Reconstruction (Required Topic)**
  "I need to ask about the historical record. When Einstein talked about Mercury, he spoke about the 'perfection' of the theory and the elimination of an ad-hoc hypothesis (Vulcan). He didn't talk about assigning probabilities to logical entailments. Is your model meant to describe how Einstein and his contemporaries actually reasoned, or is this a 'rational reconstruction'—a way of saying how they *should* have reconstructed their reasoning to make it Bayesian-compatible?"

  *   **Follow-up:** If she says **rational reconstruction**: "If the model doesn't match the actual historical reasoning, what work is it doing? Are we validating the scientists' intuition, or are we just validating the Bayesian framework by forcing history to fit it?"

  **6. The Status of the Entailment Fact**
  "Let's dig into the thing you're actually updating on: the fact that $T$ entails $E$. In standard Bayesianism, we update on empirical facts about the world. But '$T$ entails $E$' looks like a mathematical fact. If I update my belief in a physical theory based on a mathematical fact, does that make the confirmation internal to the math? I'm worried that on your view, General Relativity gets confirmed by arithmetic, not by the planet Mercury itself."

  *   **Follow-up:** If she says **math connects to the world**: "But the math would work even if Mercury didn't exist. What ties the entailment to reality? Is there a separate step where I have to confirm that the math actually applies to the physical system, and is *that* step subject to the same Old Evidence problem?"

  **7. The Limits of Ignorance**
  "You allow agents to be ignorant of logical consequences. But there has to be a limit. If I propose a theory that 'Everything is made of beans,' and I claim I haven't yet worked out whether that entails 'The moon is made of beans,' can I claim I'm rationally uncertain about that entailment? Where do you draw the line between legitimate non-omniscience and just refusing to do the homework?"

  *   **Follow-up:** If she suggests **computational complexity**: "So it's about how hard the math is? But Einstein's calculation for Mercury wasn't computationally complex in the modern sense; it was conceptually difficult. Is 'conceptual difficulty' a valid excuse for logical ignorance in a formal model?"

  **8. Rival Theories and the Vulcan Alternative**
  "Before Einstein, Le Verrier proposed a planet, Vulcan, to explain Mercury's orbit. That theory also entailed the data. On your view, when Le Verrier realized his theory entailed the perihelion shift, was his theory confirmed? If yes, how do we distinguish that from GR's confirmation later? If no, why does the same mechanism of 'learning an entailment' work for Einstein but not for Le Verrier?"

  *   **Follow-up:** If she says **Vulcan was falsified later**: "But at the moment of the update, before Vulcan was falsified, did the Old Evidence problem solve itself for Le Verrier too? Or does the existence of rival theories block the update on entailment?"

  **9. The Definition of Confirmation**
  "Finally, stepping back: if we accept your view, we are changing what 'confirmation' means. It's no longer just 'data raising the probability of a theory.' It's 'new awareness of a logical relationship raising the probability.' Does this worry you? Are we solving the Problem of Old Evidence by changing the definition of confirmation to fit the solution, rather than fitting the solution to the science?"

  *   **Follow-up:** If she says **definitions must evolve**: "If the definition evolves to accommodate human limits, do we lose the ability to compare the rationality of different agents? If confirmation depends on what I personally haven't figured out yet, is science still a public, shared enterprise?"
