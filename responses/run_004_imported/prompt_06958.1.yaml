answer: |-
  Two utilitarians, Alice and Bob, are sitting in a café. Alice is frantically tapping on her phone, donating her entire paycheck to effective charities. Bob is calmly eating a scone.

  Alice looks up, stressed. "Bob, how can you sit there? Every dollar you spend on pastry is a dollar not saving a life. You're actively decreasing total utility."

  Bob takes a slow bite. "Alice, have you considered the spatial extent of the universe?"

  "What does that have to to do with scones?"

  "If the universe is infinite," Bob says, "then the total amount of value already exists as a positive infinity. My scone costs five dollars. That's a finite subtraction. But in cardinal arithmetic, $\infty - 5$ is still $\infty$."

  Alice pauses. "Okay, but if I donate, I'm adding to the infinity."

  "Exactly. But $\infty + 5$ is *also* still $\infty$." Bob brushes crumbs off his shirt. "Since the total value after my scone is mathematically identical to the total value after your donation, the two actions are morally equivalent. Neither of us can budge the cosmic total."

  Alice stares at her phone. The donation app is still open. She looks at the 'Confirm' button, then at Bob's scone. The weight of infinite obligation suddenly lifts, replaced by the weight of infinitarian paralysis.

  She closes the app.

  "Pass me a napkin," she says. "If my moral impact is zero either way, I'd rather have zero impact with butter on my chin."

  Bob smiles. "See? You're not slacking. You're just respecting the cardinality of the good."
