answer: |-
  Good morning. Thank you all for coming.

  For most of you, Ruth was simply "the Bird Lady." If you grew up in this county, you probably remember the feeders in her yard, or the time she stopped your car to shoo a fledgling off the road, or the twenty years she spent making sure the Audubon chapter didn't run out of coffee or funding. To know her was to know someone who looked at a sparrow and saw a neighbor.

  But Ruth asked me to be honest today. She was a woman who valued truth over comfort, even when the truth was difficult. And the honest truth is that Ruth's love for animals wasn't based on the idea that nature is a peaceful paradise.

  In her seventies, Ruth started reading. She read deeply and widely, far beyond field guides. She came to a conclusion that unsettled her, and which she knew would unsettle many of you. She became convinced that for most wild creatures, life is not a harmonious circle. She knew that for every bird singing in a tree, there are countless others facing starvation, disease, or predation. She believed that nature, left entirely to its own devices, is often incredibly cruel.

  Now, I know some of you might find that a heavy thought to hear at a funeral. But I tell you this not to darken the mood, but to illuminate the light that Ruth carried.

  Because Ruth believed the world was hard for these animals, she decided that kindness had to be intentional. She didn't help birds because she thought it was "natural." She helped them because she thought it was *right*.

  There was a friendly debate she had for years with her friend Dale, who is sitting with us today. Dale represents a view that many conservationists hold: that we should protect ecosystems and let nature take its course, without interfering in the lives of individual animals. It is a view based on respect for the grand system. Ruth respected Dale, and she respected the science. But she could not accept the idea that "natural" means "good."

  She used to say that refusing to help a suffering animal because "it's nature" was a moral cop-out dressed up as wisdom. She believed that if you have the capacity to alleviate suffering in the creature right in front of you, you have a responsibility to do it. That is why the shoebox with the heat lamp stayed in the kitchen. That is why she argued for "compassionate conservation." She wasn't trying to fix the whole world; she was trying to fix the piece of the world she could reach.

  Before she passed, Ruth left very specific instructions for today. She told my mother: "Do not tell them I am at peace with nature. Do not tell them I have returned to the harmony of the wild."

  She forbade those phrases because she didn't believe them. She didn't think nature was harmonious. She thought it was a place where individuals often struggle alone. And she wanted us to know that her comfort in her final days didn't come from a fantasy that the wolves and the lambs are friends. Her comfort came from knowing she had done the work. She came from the knowledge that she had been a buffer between the vulnerable and the hard edges of the world.

  So, how do we find comfort in that?

  I think the comfort lies in what Ruth's life asks of us. If the world is not automatically kind, then kindness becomes our job. If nature does not automatically protect the weak, then we must.

  Ruth's legacy isn't just the hundreds of birds she rehabilitated. It's the example she set of refusing to look away. When others saw "just ecology," she saw individuals. When others said "let it be," she said "let me help."

  She loved you all with that same fierce, specific attention. She didn't love "humanity" in the abstract; she loved her family, her friends, her neighbors. She knew life was fragile for us, just as it is for the finches. And she spent eighty-nine years proving that while we can't stop every bad thing from happening, we are never powerless to stop the ones right in front of us.

  Ruth isn't "back in nature" today. She is in our memory, and in the work she left behind. The heat lamp is off, the shoebox is put away, and the woman who spent a lifetime interrupting suffering to offer warmth has earned her rest.

  Thank you.
