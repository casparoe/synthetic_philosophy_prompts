answer: |-
  You have hit on exactly why the Dutch book argument is the "heavy artillery" of the Thirder position. From a decision-theoretic perspective, you are absolutely right: if you define rationality as immunity to a Dutch book in the standard Sleeping Beauty betting setup, Thirdism wins.

  However, the reason serious philosophers (including heavyweights like David Lewis, who was a Halfer) remain unconvinced isn't stubbornness or an inability to update. It's because they reject the premise that **betting odds in this specific scenario are a direct proxy for credence.**

  Here is the breakdown of why the Dutch book argument doesn't "settle" the debate to the satisfaction of Halfers, and why the literature remains alive and well.

  ### 1. Credence vs. Betting Odds (The Stakes Argument)
  The core Halfer counter-argument is that the Dutch book exploits the **payoff structure**, not Beauty's belief about the coin.

  In a standard bet, the number of times you bet is independent of the outcome. In Sleeping Beauty, the number of times you bet *depends on the outcome*.
  *   **Heads:** 1 awakening $\rightarrow$ 1 bet.
  *   **Tails:** 2 awakenings $\rightarrow$ 2 bets.

  A Halfer argues: "I believe the coin is Heads with 50% probability. However, I also know that if the coin is Tails, I will be charged twice for my mistake. Therefore, my *optimal betting strategy* must account for the doubled stakes on Tails, even if my *credence* remains 1/2."

  To a Halfer, the Dutch book shows that a 1/2 credence requires 1/3 betting odds *in this specific payoff environment*. It does not prove that the credence *itself* is 1/3. They distinguish between:
  *   **Epistemic Rationality:** What is the probability the coin is Heads? (Answer: 1/2)
  *   **Instrumental Rationality:** What odds should I take to maximize utility given I might bet twice? (Answer: Act as if 1/3)

  If you accept this distinction, the Dutch book doesn't prove Thirdism; it just proves that Self-Locating Belief creates a wedge between credence and betting behavior.

  ### 2. The "Per Experiment" vs. "Per Awakening" Frame
  The Dutch book argument assumes the relevant unit of analysis is the **awakening**. Halfers argue the relevant unit is the **experiment**.

  If you offer Beauty a bet that is settled once per experiment (e.g., "We will tally your bets at the end of the week. If you bet on Heads and the coin was Heads, you win. If you bet on Heads and the coin was Tails, you lose, regardless of how many times you wrote it down"), the 1/2 credence works perfectly.

  *   **Heads (50%):** She bets once. Wins.
  *   **Tails (50%):** She bets twice. Loses twice.

  Wait, doesn't that still lose money? Yes, if the payout is per bet. But the Halfer says the Dutch Book is rigged because it forces her to bet on an indexical proposition ("It is Monday and Heads") vs. a non-indexical one ("The coin is Heads").

  If Beauty is a Halfer, she can avoid the Dutch book by adopting a policy: *"I will only bet if I believe this is the first time I am betting."* Since she can't distinguish days, she can't execute this perfectly, but the philosophical point stands: the Dutch book exploits her memory loss and the betting protocol, not necessarily her probability assignment to the coin flip itself.

  ### 3. The "New Evidence" Argument (Lewis's View)
  David Lewis's defense of Halferism wasn't based on betting; it was based on Bayesian updating. His argument was simple:
  1.  Before the experiment, Beauty knows the coin is fair ($P(\text{Heads}) = 1/2$).
  2.  Upon waking, what new information does she have? She knew beforehand she would be woken up at least once.
  3.  Therefore, she has learned nothing new relevant to the coin toss.
  4.  Therefore, her credence should not change ($P(\text{Heads}) = 1/2$).

  For Lewis, the Dutch book is a puzzle about decision theory, not epistemology. He would argue that if a Dutch book can be made against an agent who has updated correctly on all available evidence, then the Dutch book argument is failing to capture the nuances of **self-locating belief**, not that the agent is irrational.

  ### 4. Synchronic vs. Diachronic Rationality
  Rationalist circles often treat Dutch book arguments as the gold standard because they enforce **probabilism** (your credences must sum to 1, etc.). But standard Dutch book theorems assume a stable agent making decisions over time with consistent memory.

  Sleeping Beauty breaks the "stable agent" assumption via amnesia.
  *   **Thirders** argue: Rationality is about the decision at the moment of awakening. Since "I am awake now" is more likely in a Tails world (2 awakenings) than a Heads world (1 awakening), you should update to 1/3. (This leans on the Self-Indication Assumption).
  *   **Halfers** argue: Rationality is about the agent's trajectory over the whole experiment. If you view the "Beauty" on Monday and "Beauty" on Tuesday as the same agent with a single utility function, the 1/2 credence is consistent, provided the decision theory accounts for the duplicate decisions.

  ### 5. Why the Literature Persists
  You asked if philosophers are just refusing to update. In this case, it's more that the two sides are answering slightly different questions:

  *   **Thirders** are answering: "What credence makes my betting behavior immune to exploitation in an awakening-centric betting market?"
  *   **Halfers** are answering: "What credence accurately reflects the objective chance of the coin, independent of how many times I am asked to guess?"

  There is also a **Double Halfer** position (often associated with Lewis) and a **Halfer who acts like a Thirder** position. The literature continues because the Sleeping Beauty problem turned out to be a proxy war for much deeper issues in:
  *   **Anthropic Reasoning:** (SSA vs. SIA)
  *   **The nature of indexical information:** ("I am here now" vs. "The world is X")
  *   **Decision Theory:** (Causal vs. Evidential vs. Updateless)

  ### Summary
  You aren't wrong that the Dutch book is the strongest tool Thirders have. If you force a Halfer to bet at 1:1 odds every awakening, they lose money.

  But the Halfer response is: **"I am willing to take that loss as the cost of maintaining a credence that accurately reflects the coin's objective chance, because the betting market is penalizing me for the number of times I exist, not the truth of my belief."**

  As long as rationality is defined as "matching belief to evidence" (Halfer) rather than "maximizing betting utility in all scenarios" (Thirder), the debate won't settle. It's not a bug in their rationality; it's a feature of how they define the map vs. the territory in self-locating contexts.

  If your reading group wants to move the needle, don't argue Dutch books (they've heard it). Argue about **Updateless Decision Theory (UDT)**. UDT tends to dissolve the debate by suggesting Beauty should have pre-committed to a policy before Sunday, at which point the 1/2 vs 1/3 distinction becomes less about "belief" and more about "optimal policy." That's where the current action is.
