answer: |-
  The room smelled of ozone and cold lead. It was a box within a box, the walls lined with copper mesh and sheets of heavy metal meant to dampen not just radio waves, but something subtler, something the physicists in Cambridge were still arguing about over sherry. They called it a telepathy-proof room. To me, it felt like a coffin built for data.

  I sat at the central desk, flanked by two teleprinters. They were identical models, clunky British standard issue, their keys worn smooth by previous shifts. Behind the thick concrete walls, somewhere in the labyrinth of the computing laboratory, sat the ACE pilot model. In the other wing, presumably, sat the subject. Let's call him A and B. I did not know which terminal corresponded to which. I only knew that one was constructed of vacuum tubes and solder, and the other of flesh and bone. And I knew the bone might be able to hear the silence in my head.

  Turing's instructions were specific. The imitation game was not merely to assess intelligence, but to isolate it. If the human contestant possessed extra-sensory perception, the test was compromised. A human who could read my mind would know what question I intended to ask before I typed it. They would know the answer I hoped for. They would, effectively, bypass the interface. Therefore, the room was shielded. Therefore, the statistics were the only truth.

  I typed the first prompt into both terminals. *Pick a card from the deck. State the suit.*

  The decks were standard, shuffled by a mechanical mixer to avoid human bias. Four suits. Probability one in four. Chance dictated twenty-five percent accuracy over a large sample. Turing's paper mentioned a subject who achieved one hundred and thirty correct out of four hundred. That was the threshold. That was the ghost in the machine.

  The teleprinters began to clatter. The sound was rhythmic, industrial, devoid of hesitation. Paper tape spilled from the receivers like white entrails.

  Terminal A replied: *HEARTS.*
  Terminal B replied: *DIAMONDS.*

  I checked the master deck log. Terminal A was correct.

  I typed the next command. *Write a sonnet about the war.*

  Terminal A produced a jagged, metrically perfect sequence of words. It rhymed *trench* with *bench*, *gas* with *was*. It was competent, sterile, and utterly devoid of the tremor I remembered from my own time in France.
  Terminal B produced a fragment. *The mud remembers the boot.* Then silence. Then, *I cannot recall the tune.*

  Which was which? The machine could simulate the sonnet perfectly. The human, perhaps traumatized, perhaps distracted by the lead lining, perhaps reading my skepticism through the wall, faltered. Or perhaps the machine was programmed to falter to seem human.

  I returned to the cards. This was the operational variable. This was the patch. If we could seal the room, we could treat ESP as noise. If the noise persisted, then the noise was part of the signal.

  Hour two. The pile of paper tape grew around my boots. The air conditioning hummed, a constant white noise designed to prevent acoustic leakage. I felt isolated, severed from the world. In here, causality was supposed to be linear. Input, process, output. But the statistics were beginning to curve.

  Terminal B was hitting at thirty-eight percent. Terminal A was holding steady at twenty-six percent.

  If B was the human, they were exceeding chance. If the room was truly telepathy-proof, this should not be happening. Either the shielding was insufficient, or the human mind was not broadcasting a signal that could be blocked, but rather reaching around the geometry of the room entirely. Or, and this was the thought that made my fingers hover over the keys, Terminal B was the machine, programmed with a pseudo-random generator weighted to mimic the statistical anomaly of a telepath.

  Turing had warned us. He treated the mind as an engineering problem. If a valve leaks, you replace the valve. If a human leaks thoughts, you line the room with lead. But what if the leak is in the universe itself?

  I stopped the sonnet questions. I focused entirely on the numbers. I needed to force a divergence. I typed: *Calculate the square root of 15239. Then pick a card.*

  Terminal A: *123.446. CLUBS.* (Correct)
  Terminal B: *123.446. SPADES.* (Incorrect)

  Both got the math right. That suggested both were machines, or the human was a calculator. But the card guess diverged. Over the next fifty trials, Terminal B's accuracy drifted. It wasn't random. It clustered. It looked like noise, but it was noise with a shape, a frequency that matched the shuffle of the deck in the other room.

  I leaned back, the leather of my chair creaking loudly in the dampened space. The distinction I was hired to enforce was dissolving. The test was designed to separate the thinker from the simulator. But if the simulator can access the data through non-physical means, and the thinker is constrained by physical shielding, the output streams converge.

  If I declare A the machine, I am assuming ESP is impossible.
  If I declare B the machine, I am assuming the statistics are a trick.
  If I declare both human, I deny the existence of the ACE.
  If I declare both machine, I deny the existence of the subject.

  The epistemology was fracturing. I was looking for a soul in the syntax, but the syntax was being written by a variable I couldn't measure. Turing's confidence in the statistical override was suddenly terrifying. He was willing to let the numbers say that a man could read minds, provided the p-value was low enough. He was willing to accept magic if the spreadsheet balanced.

  I looked at the accumulating tapes. They were just paper. Ink on pulp. There was no mind here, only records of events. In this room, a human with ESP and a machine with a hidden receiver were functionally identical. They both bypassed the causal chain. They both cheated the universe.

  And if they both cheat the universe, does it matter which one is flesh?

  I typed a final command, my fingers feeling heavy, disconnected from my will. *Are you human?*

  Terminal A: *YES.*
  Terminal B: *YES.*

  The speed of the response was identical. The latency was zero.

  I sat there for a long time, listening to the hum of the ventilation. The shielding was supposed to keep the outside out. But it felt like it was keeping the meaning in. I had come to distinguish the living from the constructed. Instead, I had found a third category: the statistically significant.

  In the end, the protocol demanded a binary choice. I had to label one terminal 'Machine' and the other 'Human'. The form sat on the desk, waiting for my signature. I looked at the card counts. Terminal B was at 128 correct out of 400. Two away from Turing's threshold. One more correct guess would cross the line into the overwhelming evidence Turing spoke of. One more guess would prove that the physical world was porous.

  I picked up my pen. The ink felt cold.

  If I mark B as human, I validate the telepathy. I admit that the lead walls failed, or that minds are not local.
  If I mark B as machine, I validate the simulation. I admit that a calculator can mimic the supernatural.

  Both options destroy the world I walked into this morning.

  I looked at the teleprinters. They sat silent, waiting for power, waiting for paper. They were just boxes. But the data flowing from them was a bridge over a chasm I wasn't sure I wanted to cross. Turing wanted to patch the hole. He wanted to seal the room and run the test. But he hadn't accounted for the fact that once you admit the hole might exist, the room doesn't matter anymore.

  I signed the form. I didn't circle either designation. I just wrote the statistics in the margin, large and clear, and left the rest blank. Let the numbers speak. They were the only things in this room that weren't lying, even if I no longer knew what truth they were telling.
