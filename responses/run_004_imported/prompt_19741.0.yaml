prompt: |-
  So a few weeks back I fell down a Wikipedia hole that started with the fact that Jeremy Bentham's actual skeleton is sitting in a glass case at a university in London, dressed in his own clothes with a wax head on top, which is just an insane thing to find out exists. That led to me reading more about him generally, and it turns out this guy — who I basically only knew as the "greatest happiness for the greatest number" utilitarianism guy — also wrote a massive essay back in like the 1780s arguing that sodomy laws should be scrapped, on the grounds that people just being disgusted by something ("antipathy" was his word for it) isn't a real reason to make it illegal if its private, consenting, and hurting nobody. It was so far ahead of its time that it just sat unpublished in a drawer for something like two centuries. He also apparently wrote a whole separate book under a fake name (Gamaliel Smith?) going after Paul for turning Jesus's teachings into this guilt-ridden, anti-pleasure thing, which is a wild thing for a guy born in the 1740s to be doing.

  This stuff has been rattling around in my head because Bentham basically took his one core idea — add up pleasure, subtract pain, ignore whatever people find icky — and rode it out to conclusions almost nobody else got to for another 150 years. So now I keep wondering what would happen if you sat that exact guy down today and showed him people falling in love with, and paying monthly subscriptions for, AI companion apps (Replika and that whole genre) for romantic and sexual companionship. Would he just shrug and say his old sodomy logic applies directly — private, consensual pleasure, nobody's hurt, so who cares what anyone finds "icky" about it? Or is there something about this specific case — the fact that only one side of the "relationship" can actually feel anything, or that theres a company quietly optimizing the whole thing to keep you paying — that would break his framework in a way two people just being gay together never did?

  I don't have any formal philosophy training, just a very interested amateur, so I'd really appreciate it if you could dig into the actual tools he used rather than giving me a generic "a utilitarian would say X" answer — like his pleasure/pain calculus with all its different dimensions, the antipathy argument specifically, and maybe even whether he'd think the AI itself counts for anything in the math at all. What do you think Bentham, specifically, would land on here?
