answer: |-
  This is a quintessential example of how philosophy of biology is not an abstract sideline but a practical constraint on how we write and interpret science. You have correctly identified the fault line: the debate between **Etiological (Selected Effects)** theories and **Causal-Role (Systemic)** theories of function.

  Your reviewer is not merely being pedantic; they are enforcing a specific ontological commitment about what constitutes a "biological function." However, as you suspect, this is not a settled matter, and insisting on one definition to the exclusion of the other can obscure biological reality.

  Here is a breakdown of the divide, why it has consequences beyond semantics, how it applies to your GAPDH data, and how you might navigate this in your revision.

  ### 1. The Two Camps: History vs. Mechanism

  #### The Etiological Theory (Selected Effects)
  *   **Proponents:** Larry Wright, Karen Neander, Ruth Millikan.
  *   **The Core Claim:** A trait has a function $F$ if and only if the trait exists *because* ancestors of that trait performed $F$ and thereby contributed to the fitness of the organism. Function is backward-looking.
  *   **The Logic:** The heart has the function of pumping blood because previous hearts pumped blood, allowing organisms to survive and reproduce, which is why we have hearts today.
  *   **The "Noise" Problem:** The heart also makes a "thump-thump" sound. This sound is a causal consequence of the heart, but it is not the *function*, because hearts were not selected *for* making noise.
  *   **Key Strength:** It explains **normativity**. It allows us to say a heart is *malfunctioning* if it fails to pump, even if it is still making noise. Only selected effects can "fail" in a biological sense.
  *   **Key Weakness:** It struggles with novel traits, exaptations, and "moonlighting." If a protein acquires a new useful role today, the etiological view must say it is not yet a "function" until selection has had time to act on it.

  #### The Causal-Role Theory (Systemic)
  *   **Proponents:** Robert Cummins.
  *   **The Core Claim:** A trait has a function $F$ relative to a system $S$ if the trait has the *capacity* to do $F$, and doing $F$ contributes to explaining a higher-level capacity of $S$. Function is forward-looking (or present-looking).
  *   **The Logic:** In the circulatory system, the heart's function is to pump blood because that is its causal contribution to circulation.
  *   **The "Noise" Problem:** This view is more permissive. If the "thump-thump" sound helped a predator locate prey, a Cummins-style analyst might say the sound has a function *relative to the predator's sensory system*, though not relative to the circulatory system.
  *   **Key Strength:** It aligns with **mechanistic biology**. When you are mapping a pathway (e.g., GAPDH in DNA repair), you are analyzing causal contributions to cell survival. You don't need to know the phylogenetic history to know the mechanism works.
  *   **Key Weakness:** It is potentially too permissive (the "promiscuity" problem). If GAPDH binds to DNA simply because it is positively charged and abundant, is that a function or just chemistry? Without selection, it's hard to distinguish "function" from "inevitable physical interaction."

  ### 2. Why This Is Not Just Semantics

  You asked if this is merely a verbal dispute. It is not, because the definition you choose dictates **what counts as evidence** and **how you explain malfunction.**

  1.  **Evidence Standards:**
      *   **Etiological:** To prove function, you need evidence of **conservation** or **selection**. You must show that the nuclear localization signal or the DNA-binding interface is conserved across species, implying purifying selection. If the region is hypervariable, the etiological theorist argues it's likely noise/promiscuity.
      *   **Causal-Role:** To prove function, you need evidence of **mechanism** and **fitness contribution**. You must show that knocking out the nuclear translocation reduces DNA repair efficiency and cell survival under stress. Phylogeny is irrelevant.

  2.  **The Concept of Disease/Malfunction:**
      *   If GAPDH's DNA repair role is a *function* (Etiological), then a mutation preventing it is a *pathology*.
      *   If it is merely a *causal role* (or a side effect), then preventing it is simply altering the system's chemistry. It might be detrimental, but it isn't a "failure of function" in the evolutionary sense.

  3.  **Research Heuristics:**
      *   The Etiological view warns against **Adaptationism** (assuming every trait is optimized). It forces you to ask: "Is this really selected, or is it just biophysics?"
      *   The Causal-Role view encourages **Discovery**. It allows you to investigate new pathways without being paralyzed by the lack of phylogenetic data.

  ### 3. Ruling on the GAPDH Case

  Here is how the two theories adjudicate your specific manuscript:

  **The Reviewer (Etiological View):**
  The reviewer argues that GAPDH's glycolytic role is the only true function because that is what selected for the existence of the GAPDH gene. The nuclear activity, on their view, is likely a **spandrel** (a byproduct of the protein's abundance and chemical structure). Unless you can demonstrate that the nuclear translocation mechanism itself has been conserved by selection independent of the glycolytic role, they classify it as "incidental." To them, calling it a "function" implies an evolutionary teleology that isn't there.

  **You (Causal-Role View):**
  You observe that under stress, GAPDH moves to the nucleus and facilitates repair. This contributes to the capacity of the cell to survive genotoxic stress. Therefore, within the system of the "stressed cell," GAPDH has the function of DNA repair. The history is irrelevant to the current mechanistic reality. To you, "function" describes what the protein *does* to maintain the system, not just why it exists.

  **The Middle Ground (Exaptation):**
  There is a third category often used to bridge this gap: **Exaptation** (Gould & Vrba). A trait can be a byproduct initially (non-functional in the etiological sense) but later become co-opted and selected for a new role.
  *   *Scenario A:* GAPDH goes to the nucleus purely by accident (diffusion/leakage) and fixes DNA. This is a Causal-Role function but not an Etiological one.
  *   *Scenario B:* GAPDH goes to the nucleus by accident, fixes DNA, and organisms with this "accident" survive better. Over time, sequences evolve to enhance this translocation. It *becomes* an Etiological function.

  Your reviewer is assuming Scenario A. You are likely hypothesizing Scenario B (or arguing that Scenario A is biologically significant enough to warrant the label "function").

  ### 4. Is There a Principled Adjudication?

  In current philosophy of biology, the consensus is largely **Pluralistic**. Most philosophers (e.g., Peter Godfrey-Smith, Justin Garson) acknowledge that "function" is a context-dependent term.

  *   **In Evolutionary Biology:** The Etiological definition is standard. It prevents "Just-So stories."
  *   **In Physiology/Molecular Biology:** The Causal-Role definition is standard. It facilitates mechanistic modeling.

  However, there is a growing movement toward **Goal-Contribution** or **Organizational** accounts. These suggest that a trait is functional if it contributes to the *self-maintenance* of the organization that produces it. In this view, if GAPDH's nuclear activity helps maintain the cell's organization under stress, and the cell's organization maintains the production of GAPDH, it qualifies as a function even without deep evolutionary history.

  ### 5. Strategic Advice for Your Manuscript

  You are in a position where you cannot "win" the philosophical argument in a response letter, but you can clarify your usage to satisfy the reviewer without conceding your scientific point.

  1.  **Acknowledge the Distinction:** Explicitly state in the revision that you are using "function" in the **causal-role sense** (contributing to a system capacity) rather than the strict **selected-effects sense**.
      *   *Drafting tip:* "We acknowledge that the evolutionary history of this nuclear activity is distinct from the canonical glycolytic role. Here, we use 'function' to denote a causal contribution to cellular survival under genotoxic stress, consistent with Cummins-style systemic analysis."

  2.  **Provide Etiological Evidence (If possible):** If you want to claim it is an etiological function, you need conservation data.
      *   Is the nuclear localization signal (NLS) conserved in orthologs?
      *   Are the residues involved in DNA binding conserved beyond what is needed for glycolysis?
      *   If yes, argue that this suggests **secondary selection**, moving the trait from "side effect" to "adapted function."

  3.  **Use Precise Terminology:** If the reviewer remains obstinate, consider modifying your language in the text to bypass the trigger word.
      *   Instead of "a function of GAPDH," use "a physiological role," "a capacity," or "a moonlighting activity."
      *   Reserve "function" for the glycolytic role in the Introduction/Discussion to signal you understand the evolutionary distinction, while maintaining that the nuclear activity is a "selected physiological capacity."

  4.  **The "Malfunction" Test:** If you can show that preventing the nuclear translocation causes a specific deficit (e.g., increased mutation rate or cell death) *without* affecting glycolysis, you strengthen the Causal-Role argument. It shows the activity is distinct and necessary for a specific system capacity.

  ### Summary View

  My view aligns with the **pluralistic consensus**: Your reviewer is correct that "function" in evolutionary biology implies history, but they are incorrect to imply that this is the *only* valid use of the term in molecular biology.

  Moonlighting proteins are a specific challenge to the Etiological view because they represent **context-dependent functionality**. GAPDH is a glycolytic enzyme in the cytosol and a repair factor in the nucleus. To deny the latter the label "function" simply because it is evolutionarily younger or context-dependent is to hinder the description of biological mechanism.

  **Recommendation:** Do not fight the reviewer on the definition of "function" as a matter of truth. Fight it as a matter of **utility**. Argue that for the purpose of understanding cellular stress response, the Causal-Role definition is the operative one. However, to get the paper published, concede the terminological point: clarify that you are describing a *physiological role* with functional consequences, and if possible, add data suggesting this role is conserved (hinting at etiological status).

  You are not talking past each other; you are speaking different dialects of biology. The paper will be stronger if you translate your findings into the reviewer's dialect while maintaining the integrity of your mechanistic discovery.
