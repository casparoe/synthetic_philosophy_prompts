      *   **Goal:** They want a clear, non-superficial explanation of the divide, why it matters (not just verbal), how each theory applies to GAPDH, and whether there's a consensus or if it's just a stalemate.
      *   **Tone:** Academic, respectful, precise, but accessible to a scientist (not a philosopher). Needs to validate their intuition that this isn't just semantics.

  2.  **Deconstruct the Philosophical Debate:**
      *   **Etiological Theory (Selected Effects - SE):**
          *   *Key Figures:* Larry Wright, Karen Neander, Ruth Millikan.
          *   *Core Idea:* Function = Why the trait was selected for in the past. $X$ has function $F$ if $X$ exists because ancestors of $X$ did $F$ and this contributed to fitness.
          *   *Implication:* No history of selection for $F$ $\rightarrow$ no function $F$.
          *   *Pros:* Distinguishes function from accident/byproduct. Explains normativity (malfunction).
          *   *Cons:* Struggles with new traits, exaptations, and moonlighting proteins where selection history is unclear or absent for the new role.
      *   **Causal-Role Theory (Systemic - CS):**
          *   *Key Figures:* Robert Cummins.
          *   *Core Idea:* Function = Current causal contribution to a capacity of the containing system. $X$ has function $F$ in system $S$ if $X$ does $F$ and $F$ helps explain $S$'s capacity.
          *   *Implication:* If it does it now and helps the system, it's a function. History doesn't matter.
          *   *Pros:* Useful for mechanistic biology, engineering, and new adaptations.
          *   *Cons:* Too permissive (heart makes noise, does that mean function is to make noise?). Lacks normativity (harder to define "malfunction").

  3.  **Apply to the GAPDH Case:**
      *   **Glycolysis:** Both agree this is a function. (Selected for + Causal role in energy production).
      *   **Nuclear DNA Repair:**
