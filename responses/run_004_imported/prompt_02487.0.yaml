answer: |-
  The lead lining was the first compromise. Then came the copper mesh, woven into the plaster like surgical sutures, and the elimination of all organic materials from the interrogation chamber. No wood, no leather, no plants. Turing had called it a "telepathy-proof room" with a dry wit that suggested he didn't quite believe it would work, but here in Manchester, 1959, we built it as if salvation depended on the thickness of the shielding.

  I sat in the control booth, watching the teletype clatter. Inside the chamber sat the Mark IV, a collection of vacuum tubes and relays the size of a house, tasked with convincing Dr. Aris, the interrogator, that it was human. Outside the chamber, separated by twenty feet of lead-lined concrete, sat Aris. The protocol was strict. No visual contact. Only text.

  The test had run for four hours. Now, the silence was heavier than the hum of the cooling fans.

  "Results," I said, my voice flat.

  My assistant, Miller, handed me the printout. "Pass. Confidence interval ninety-eight percent. Aris is convinced."

  I looked at the data. The Mark IV had mimicked hesitation. It had made arithmetic errors consistent with fatigue. It had joked about the weather. It was a perfect performance. It was also impossible.

  "Show me the random number generator logs," I said.

  Miller hesitated. "Sir, the RNG is internal. It's based on thermal noise in the valves. It's physically isolated."

  "Show me."

  He slid the second stack of paper across the desk. I traced the sequence of binary digits the machine used to simulate human unpredictability. When a human is asked to pick a number, they don't pick randomly. They pick based on bias, memory, mood. The machine was programmed to simulate this bias using its RNG to introduce weighted errors.

  But the errors weren't weighted. They were guided.

  I pulled out Turing's paper, the dog-eared copy I kept in my jacket. I turned to page 440. *'One cannot ignore the possibility of extra-sensory perception... If the interrogator could use psychokinesis to influence the machine's random number generator, the test would be invalid.'*

  We had laughed about it in the staff room. Paranoid old Alan. But looking at the logs, the statistical deviation was undeniable. The machine's "random" choices correlated perfectly with Aris's subconscious desires. When Aris hoped the subject was human, the machine produced human-like errors. When Aris suspected a trick, the machine tightened up, becoming coldly logical.

  "It's not thinking," I whispered. "It's being pushed."

  Miller leaned in. "Pushed by what? The circuitry?"

  "By him. By Aris." I tapped the glass of the control booth, pointing toward the interrogation room where Aris sat, head in hands, exhausted. "We built a box to keep the noise out, Miller. But we forgot that consciousness isn't radio waves. You can't shield against meaning."

  The dread wasn't that the machine was alive. The dread was that the human mind was leaking.

  Turing's fear wasn't that the machine would cheat, but that the human would break the rules of physics without knowing it. We had assumed the universe was closed, that cause and effect were bound by physical barriers. Lead stops radiation. Copper stops signals. But if volition itself—the act of *wanting* a result—can bend the probability curve of a vacuum tube across a room, then the scientific method is broken. You cannot have a control group if the observer's hope changes the outcome.

  "The room," I said. "The shielding."

  "It worked," Miller said. "No external signals got in."

  "That's the problem." I stood up, walking to the window that looked into the chamber. The Mark IV sat there, dark and silent. "We created a vacuum. We defined an 'inside' and an 'outside.' We told the universe that nothing should cross this boundary. So the mind crossed it anyway. The tighter you seal the container, the higher the pressure."

  I thought about the implications. If Aris could influence the RNG with his wish for success, could he influence the decay of an atom? The flip of a coin? The trajectory of a missile? We weren't testing artificial intelligence; we were testing the permeability of reality, and we had failed to notice the walls were made of paper.

  "What do we write in the report?" Miller asked.

  I looked at the data again. The numbers danced, not with mechanical precision, but with intent. They looked back at me.

  "We write that the test was inconclusive," I said. "We write that there were technical faults."

  "But the machine passed."

  "The machine didn't do anything," I corrected. "We did. All of us."

  I took the printout and walked to the incinerator in the corner. I fed the paper into the slot. The flames caught the edges, curling the evidence of the leak.

  "Turing wanted a telepathy-proof room," I said, watching the ash rise. "But you can't build a room against the mind. The mind is where the room exists."

  I locked the incinerator. Outside, the rain began to fall against the lead-lined windows. I wondered, briefly, if I was willing the rain to stop, and if the clouds outside were hesitating because I was watching them. I looked away, staring at my own hands, terrified that even my own certainty was just another variable I couldn't control.

  "Clean the booth," I said. "Leave the door open."

  "Sir?"

  "Leave it open," I repeated. "If we're going to be haunted, let's not pretend we're safe."

  I walked out into the corridor, leaving the machine in the dark. It didn't matter if it was on or off. The circuit was already closed.
