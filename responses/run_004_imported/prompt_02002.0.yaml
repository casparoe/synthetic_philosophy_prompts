answer: |-
  # The Jade Trap: Why Kim Wins the War on Multiple Realizability

  The standard narrative in the philosophy of mind is comforting. It goes like this: You are not merely your neurons. Your mind is what your brain *does*, not what it is made of. Therefore, a silicon upload, a Martian with hydraulic guts, or a ghost in a machine could, in principle, feel pain just as you do, provided they replicate the right functional organization. This is the doctrine of Multiple Realizability (MR), championed by Hilary Putnam and Jerry Fodor, and it serves as the metaphysical shield for functionalism and the autonomy of psychology. It tells us that mental states are robust, substrate-independent kinds, safe from being reduced away by neuroscience.

  But there is a wrecking ball hidden inside this comforting story, and its name is Jaegwon Kim.

  In his seminal 1992 paper, "Multiple Realizability and the Metaphysics of Reduction," Kim turned the functionalist's favorite weapon against them. He argued that if mental states are truly multiply realizable in the radical way Putnam and Fodor claim, they cannot be the unified natural kinds functionalists need them to be. Instead, MR forces us into a fragmented, local reductionism.

  While functionalists have spent thirty years throwing sand in the gears of Kim's argument, the dialectical momentum has shifted. When we strip away the pragmatic conveniences of cognitive science and look at the underlying metaphysics, Kim is right. Multiple realizability does not save functionalism from reductionism; it merely decentralizes it. The verdict is uncomfortable for the upload enthusiasts and the non-reductive physicalists: **Kim wins.** MR undermines the unity of the mental, and the "autonomy of psychology" is a pragmatic heuristic, not a metaphysical truth.

  ### The Functionalist Shield: Putnam and Fodor

  To see why Kim's move is so devastating, we have to appreciate the elegance of the position he attacked. In the 1960s, the identity theory ruled: Pain *is* C-fiber firing. Putnam shattered this with a simple modal intuition. If we can imagine a world where an octopus feels pain without C-fibers (perhaps using different neural structures), or a silicon robot feels pain via logic gates, then pain cannot be *identical* to C-fiber firing. Identity is necessary; if $A = B$, then $A$ must be $B$ in all possible worlds.

  Fodor extended this into a defense of the "special sciences." If physics were the only real science, psychology would vanish. But psychology works. We make laws about belief and desire that hold true regardless of whether the believer is a human, a dog, or an alien. Fodor argued that these generalizations are possible precisely because mental states are *functional kinds*. They are defined by their causal roles (inputs, outputs, relations to other states), not their physical constitution. This implies **Non-Reductive Physicalism**: The mental is physically realized, but it is not reducible to physics because the mapping is one-to-many. The mental level is autonomous.

  For decades, this was the default setting. MR was the knockdown argument against reductionism.

  ### Kim's Hammer: The Jade Argument

  Kim accepted the premise of multiple realizability but rejected the conclusion. His argument rests on two pillars: the nature of natural kinds and the Causal Inheritance Principle.

  First, the **Jade Argument**. For centuries, people thought "jade" was a single mineral kind. Then mineralogy discovered that what we call jade is actually two distinct minerals: jadeite and nephrite. They look similar and are used similarly, but they have different chemical structures and geological origins. Kim argues that "pain" in a functionalist world is exactly like jade. If human pain is C-fibers and octopus pain is Q-fibers, and there is no physical commonality between them, then "pain" is not a unified kind. It is a disjunction: *C-fiber-firing OR Q-fiber-firing OR silicon-gate-flipping...*

  In science, disjunctive kinds are suspicious. You cannot build a law on "jade" because jadeite and nephrite behave differently under pressure. Similarly, Kim argues, you cannot build a law on "pain" if the realizers are heterogeneous.

  Second, the **Causal Inheritance Principle**. Kim argues that if a mental state $M$ is realized by a physical state $P$, then $M$'s causal powers are inherited from $P$. If $M$ causes you to withdraw your hand, it does so because $P$ (the neural firing) causes the muscle contraction. But if $M$ is realized by totally different physical states $P_1, P_2, P_3$ in different species, then $M$ has no *single* causal power. It has $P_1$-powers in humans, $P_2$-powers in octopuses, etc.

  If the causal powers are disjointed, the kind is disjointed. Therefore, there is no general science of "pain." There is only a science of "human-pain," "octopus-pain," and "silicon-pain." This is **Local Reductionism**. We reduce pain-in-humans to C-fibers and pain-in-octopuses to Q-fibers. The "mental" does not float above the physical; it splinters into a million local physical identities.

  ### The Functionalist Counter-Attack

  Functionalists did not surrender quietly. The replies generally fall into two camps.

  The first is the **Commonality Defense**. Critics argue that Kim exaggerates the heterogeneity of realizers. Sure, humans and octopuses use different chemicals, but at a higher level of abstraction, they share structural properties: feedback loops, nociceptive thresholds, integration with motor planning. If we define the realizers by these structural features, they aren't a wild disjunction; they are a unified class of "control systems." Thus, the functional kind is grounded in a physical commonality after all.

  The second is the **Second-Order Property Defense**, championed by Sydney Shoemaker. They argue that functional properties are real second-order properties (the property of having some property that plays role $R$). These properties *do* have causal powers, defined by the role they play. Even if the physical realizers differ, the functional role itself is what does the explaining in psychology. To demand physical uniformity is "physics envy"; psychology has its own standards of explanation.

  ### The Verdict: Why Kim Cuts Deeper

  These replies are clever, but they ultimately dodge the metaphysical bullet. Kim wins because he exposes a category error in the functionalist conception of causation.

  The Commonality Defense fails because it trades on ambiguity. If the "structural features" shared by humans, octopuses, and uploads are abstract enough to cover all three, they are too abstract to do any causal work. A "feedback loop" in a neuron and a "feedback loop" in a silicon chip are only the same *functionally*, not physically. But causation happens in the physics. The electron flow in the chip obeys Maxwell's equations; the ion flow in the neuron obeys electrochemistry. There is no "feedback loop force" in the universe that acts on both. To say they share a commonality is to speak metaphorically, not metaphysically. If the physical mechanisms are distinct, the causal powers are distinct.

  The Second-Order Property Defense fares no better. It asserts that functional roles have causal powers, but it cannot explain *how* without begging the question. If I ask, "Why did the robot withdraw its hand?" and you say, "Because it was in pain," I want to know the mechanism. If you say, "Because it instantiated the second-order property of pain," you haven't explained the mechanism; you've just labeled it. The actual work is done by the silicon gates. If the functional property is distinct from the physical realizer, it is epiphenomenal (it does no work). If it is not distinct, it reduces to the physical. Kim forces a dilemma: **be causally potent and reduce, or be irreducible and be causally inert.**

  This is why Kim's conclusion holds. Multiple Realizability, far from securing the autonomy of psychology, actually fragments it. If MR is true, then "pain" is not a natural kind. It is a pragmatic label we slap on a heterogeneous collection of physical states that produce similar behaviors. This does not mean pain isn't real—human pain is very real, and it is C-fibers. But "Pain-as-such" is a fiction, like "jade."

  ### The Implications for AI and Uploads

  This verdict has cold water to throw on the LessWrong/ACX consciousness debates. The standard argument—"If you replicate the functional organization, you get the consciousness"—relies on the functionalist assumption that organization is the *source* of the mental kind. Kim shows that organization is just a map; the territory is the physics.

  If consciousness is a natural kind, it must have a physical basis. If we build an upload that functionally mimics a human but uses silicon instead of carbon, we have not necessarily created "human consciousness." We have created "silicon-consciousness," a distinct natural kind that may *analogize* to human consciousness but is not identical to it. Whether it is "really" conscious depends on whether silicon states can belong to the same natural kind as neural states. If Kim is right, they cannot, unless we find a deeper physical commonality (e.g., integrated information theory attempts this, but that is a physical claim, not a functional one).

  The functionalist wants to say the upload is conscious *because* it functions the same. Kim says that's like saying jadeite is nephrite because it scratches glass the same way. They are different minerals.

  ### Conclusion

  The standard intro-to-philosophy story is wrong. Multiple Realizability is not the savior of non-reductive physicalism. It is the Trojan Horse that lets reductionism back into the citadel. Putnam and Fodor thought MR proved that mental states transcend physical specifics. Kim showed that if mental states transcend physical specifics, they lose the causal unity required to be real kinds.

  We are left with a choice: either accept that mental kinds are fragmented and locally reduced (Kim's view), or accept that mental kinds are real but causally mysterious (the functionalist view). Given that we live in a physical world where causal powers are grounded in physical properties, the first option is the only coherent one. Functionalism survives as a useful heuristic for building AI and modeling behavior, but it fails as a fundamental metaphysics. The mind is not software running on hardware; the mind is what the hardware *is*, in all its local, messy, irreducible specificity. Kim saw the jade inside the stone, and he was right to crack it open.
