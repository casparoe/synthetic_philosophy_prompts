answer: |-
  **MEMORANDUM**

  **TO:** Presiding Judge
  **FROM:** [Clerk's Name]
  **DATE:** October 24, 2023
  **RE:** *Estate of Vance v. Hart*, No. 23-CV-4092 — Voting Procedure and Disposition

  **QUESTION PRESENTED**

  Whether the panel should determine the disposition of this appeal by aggregating the judges' votes on the ultimate judgment (Outcome Voting) or by aggregating the judges' findings on the individual elements of the undue influence test (Issue Voting).

  **RECOMMENDATION**

  I recommend the panel proceed by **Outcome Voting** and vote to **Affirm** the probate court's admission of the codicil.

  While a majority of the panel finds each individual prong of the undue influence test satisfied, no majority agrees that *both* prongs are satisfied in a way that warrants voiding the will. Adopting Issue Voting here would produce a judgment (Voiding) that only one judge (Judge Calloway) actually supports. To preserve the integrity of the panel's authority and avoid setting a precedent that fragments judicial reasoning, the panel should vote on the final disposition. A majority (Judges Alaoui and Berger) vote to Uphold.

  **BACKGROUND: THE VOTE COUNT**

  As you know, our undue influence doctrine requires two conjunctive findings to void a testamentary instrument: (1) the beneficiary exerted improper pressure, and (2) the testator's capacity to resist was overborne. If either prong fails, the codicil stands.

  The conference tally reveals a structural conflict:

  *   **Judge Alaoui:** Finds Pressure (Yes) + Capacity Overborne (No) = **Uphold**.
  *   **Judge Berger:** Finds Pressure (No) + Capacity Overborne (Yes) = **Uphold**.
  *   **Judge Calloway:** Finds Pressure (Yes) + Capacity Overborne (Yes) = **Void**.

  **The Conflict:**
  *   **By Outcome:** 2 Judges vote to Uphold; 1 votes to Void.
  *   **By Issue:** 2 Judges find Pressure; 2 Judges find Capacity Overborne.

  If we tally by Issue, the collective findings satisfy the legal test for voiding the codicil, even though two-thirds of the panel believe the codicil should stand.

  **ANALYSIS**

  **1. The Case for Outcome Voting (Recommended)**
  The primary function of an appellate panel is to resolve disputes, not to legislate abstract findings. Outcome Voting ensures that the final judgment reflects the will of a majority of the judges appointed to decide the case.

  In this specific context, adopting Issue Voting would force a result that no majority of the panel believes is just. Judge Alaoui believes the widow's will was her own; Judge Berger believes no pressure was applied. Only Judge Calloway believes the legal threshold for voiding the will has been met. If we void the codicil based on aggregated issue votes, we would be issuing an order that Judge Alaoui and Judge Berger fundamentally disagree with. Judge Alaoui would be signing an order stating the will is void, despite finding the legal requirements for voiding it unmet. Judge Berger would be signing an order voiding a will based on a finding of "pressure" he explicitly rejected.

  Outcome Voting respects the collegiality of the bench. It allows Judge Alaoui and Judge Berger to concur in the judgment (Affirm) while maintaining their distinct reasoning. It ensures that every judge signing the majority opinion actually supports the result.

  **2. The Case for Issue Voting (The Counter-Argument)**
  The argument for Issue Voting is not merely academic; it rests on a strong concern for the rule of law and logical consistency. The undue influence test is a rule enacted by the legislature (or established by supreme court precedent). It dictates: *If A and B are true, then Result X follows.*

  A proponent of Issue Voting would argue that the Court is a single institution, not three individuals. As an institution, the Court has found Fact A (Pressure) by a 2-1 margin. It has found Fact B (Overborne Capacity) by a 2-1 margin. Logically, the institution *must* conclude Result X (Void). To do otherwise is to ignore the Court's own factual findings.

  Furthermore, Issue Voting prevents strategic manipulation. If we adopt Outcome Voting, a judge could theoretically manipulate the result by shifting their reasoning on one prong to block a majority, even if they believe the prong is met. Issue Voting forces judges to be accountable for each element of the law, ensuring that the legal standard is applied consistently across cases, rather than depending on the idiosyncratic reasoning of whichever two judges happen to form a majority on the bottom line. In a case involving a vulnerable widow and a contested family asset, the argument that the Court should honor the *protection* intended by the undue influence statute (by voiding the will) carries significant moral weight.

  **PRECEDENTIAL IMPLICATIONS**

  This choice will function as unstated precedent for how this court handles multi-part legal tests (e.g., summary judgment standards, criminal intent elements, contract breach analysis).

  *   **If we choose Outcome Voting:** We commit to the principle that a judge's vote on the judgment is sovereign. In future cases, we may affirm a conviction even if no single majority agrees on *why* the evidence was sufficient, so long as a majority agrees the conviction stands. This promotes finality but risks creating "plurality logic" where the law becomes murky.
  *   **If we choose Issue Voting:** We commit to treating the panel as a legislative body where reasoning is aggregated. This creates clearer precedent on specific legal elements but risks producing judgments that lack a natural majority coalition. It invites future litigants to demand issue-specific tallies in every case involving a multi-factor test.

  Given that our role is adjudicatory, not legislative, Outcome Voting is the safer institutional choice. It prevents the court from issuing orders that lack a majority coalition of support.

  **DRAFTING NOTE**

  If you proceed with Outcome Voting (Affirm), the opinion should be drafted narrowly. Since Judges Alaoui and Berger agree on the result but disagree on the facts, the majority opinion should rest on the narrowest grounds necessary to affirm. Alternatively, one judge may write a concurrence. I advise against a single majority opinion that asserts *both* pressure was absent *and* capacity was intact, as neither judge holds both views. The opinion should simply state that the appellants failed to meet their burden of proving *both* prongs concurrently, without making definitive factual findings on either prong that would bind the court in future litigation.

  **CONCLUSION**

  While the mathematical allure of Issue Voting is understandable, it produces a judgment supported by only one judge. I recommend the panel vote on the disposition, affirm the probate court's decision, and allow the judges to express their divergent reasoning in separate opinions or a carefully limited majority memo. This preserves the court's institutional legitimacy and avoids the paradox of enforcing a result the majority rejects.
