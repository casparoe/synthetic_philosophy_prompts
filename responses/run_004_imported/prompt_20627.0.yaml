      *   **Case:** Probate appeal regarding a codicil (will amendment). Elderly widow, summer house, one grandchild favored, two cut out.
      *   **Legal Standard:** Undue influence requires *two* conditions (conjunctive test):
          1.  Position of trust/pressure exerted.
          2.  Capacity to resist overborne (not just affection/grief).
          *   *Result:* If *both* are true -> Void. If *either* is false -> Uphold.
      *   **Judges' Positions:**
          *   Judge Alaoui: Pressure = Yes, Capacity Overborne = No. -> Vote: Uphold.
          *   Judge Berger: Pressure = No, Capacity Overborne = Yes. -> Vote: Uphold.
          *   Judge Calloway: Pressure = Yes, Capacity Overborne = Yes. -> Vote: Void.
      *   **The Paradox:**
          *   Vote on Outcome: 2 Uphold (Alaoui, Berger) vs. 1 Void (Calloway).
          *   Vote on Issue 1 (Pressure): 2 Yes (Alaoui, Calloway) vs. 1 No (Berger). -> Majority says Pressure exists.
          *   Vote on Issue 2 (Capacity): 2 Yes (Berger, Calloway) vs. 1 No (Alaoui). -> Majority says Capacity Overborne.
          *   *Combined Issues:* If you aggregate the issue majorities, both prongs are met -> Void.
          *   *Conflict:* Outcome voting says Uphold. Issue voting says Void. This is the *Doctrinal Paradox* (or Discursive Dilemma).
      *   **Task:** Write the clerk's memo to the Presiding Judge.
      *   **Requirements:**
          *   Clear recommendation at the top (Outcome vs. Issue voting).
          *   Reasoning suitable for a judge to sign off on.
