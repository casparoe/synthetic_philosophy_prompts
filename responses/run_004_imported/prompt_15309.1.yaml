      *   **Section 1: The Structural Symmetry:** Explain why $1 \rightarrow Many$ is metaphysically isomorphic to $Many \rightarrow 1$ regarding subjecthood. The gap is between unity and plurality.
      *   **Section 2: The Boundary/Privacy Issue:** Focus on phenomenal privacy. If I am a fragment, why is my experience bounded? The "masking" problem.
      *   **Section 3: Evaluating Explanatory Ease:** Address whether decombination is easier. Argue that without a mechanism of individuation, it's just a brute fact swap.
      *   **Section 4: The Illusion of Solution:** Conclude that cosmopsychism changes the *location* of the brute fact but not the *magnitude* of the mystery.
      *   **Conclusion:** Summarize. The hard problem of consciousness includes the hard problem of *subject individuation*, which cosmopsychism leaves untouched.

  7.  **Refining the Philosophical Nuance (Self-Correction during drafting):**
      *   *Check:* Am I attacking cosmopsychism too harshly? *Correction:* Acknowledge its motivations (avoiding emergence), but show the cost is equal.
      *   *Terminology:* Use terms like "phenomenal binding," "subjective privacy," "metaphysical grounding," "brute fact."
      *   *Reference:* Implicitly engage with thinkers like Philip Goff, Itay Shani, or William Seager (common in this literature) without needing specific citations unless requested (prompt doesn't ask for citations, just an argument).
      *   *Key Distinction:* Distinguish between *ontological* priority (what exists fundamentally) and *explanatory* priority (what explains what). Cosmopsychism fixes one but breaks the other.

  8.  **Final Polish:** Ensure the tone is academic, persuasive, and directly answers the prompt's specific questions about "principled reason" and "same problem viewed from the other direction." (The resulting output should look like a strong seminar paper or position statement).

  **(Self-Correction Note):** Make sure to emphasize *why* decombination is hard. It's not just splitting; it's splitting *experience*. Physical splitting is easy (cut a cake). Phenomenal splitting is mysterious (cut a mind?).

