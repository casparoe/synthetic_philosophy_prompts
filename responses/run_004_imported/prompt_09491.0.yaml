answer: |-
  **The Agency of Unity: Defusing Bradley's Regress through Act-Based Propositions**

  The problem of the unity of the proposition is perhaps the most persistent ghost in the machinery of analytic philosophy. It begins with a simple intuition: a proposition, such as *that Desdemona loves Cassio*, is a unified truth-bearer, not a mere list of constituents like {Desdemona, loving, Cassio}. A list can exist without representing anything; a proposition represents the world and bears a truth value. F. H. Bradley's regress argues that if we treat propositions as structured complexes of objects and properties, we cannot explain what binds these constituents together without invoking a further relation, which itself requires binding, ad infinitum. Historically, this regress has threatened to dismantle any ontology that treats propositions as mind-independent, structured entities.

  This essay argues that Bradley's regress is fatal for static, constituent-based ontologies that treat propositions as objects or facts, such as the theory proposed by Jeffrey King. However, the regress is successfully defused by contemporary "act-based" theories, particularly the version advanced by Peter Hanks. The verdict is specific: Bradley's regress demonstrates that propositional unity cannot be a matter of static metaphysical structure, but it does not preclude unity grounded in cognitive agency. While act-based theories face challenges regarding objectivity, they alone succeed in dissolving the regress by re-categorizing the proposition from a *thing* that needs gluing to an *action* that is inherently unifying.

  To understand why King's factualism ultimately relocates rather than resolves the regress, one must examine his core identification. King proposes that propositions are not abstract sui generis entities, but rather complex facts. Specifically, the proposition *that Desdemona loves Cassio* is identified with the fact that certain lexical items ("Desdemona," "Cassio," "loves") stand in specific syntactic and semantic relations within a language context. King's motivation is to ground propositions in the concrete world, thereby avoiding the mystery of abstract objects. Since facts are by definition unified (a fact obtains or it does not), King claims the unity problem vanishes. The fact that the word "Desdemona" stands in a relation to "loves" is a single, unified state of affairs.

  However, this move relocates Bradley's regress from the metaphysics of propositions to the metaphysics of representation. Even if we grant that the linguistic fact is unified, we must ask: what makes this linguistic fact a *proposition*? A fact about English syntax does not inherently represent Desdemona loving Cassio; it only does so relative to semantic conventions and interpretive contexts. King must appeal to a semantic relation that links the lexical items to the worldly objects. If this semantic relation is treated as a constituent of the propositional fact, Bradley's question resurfaces: what unites the semantic relation to the lexical items? If King answers that the semantic relation is determined by rules of the language, we must ask what unites the rules to the usage.

  King attempts to block this by arguing that the properties of the constituents determine the truth conditions. Yet, as critics have noted, this assumes the very unity it seeks to explain. The fact that "Desdemona" refers to Desdemona and "loves" refers to the loving relation is itself a complex state of affairs. If the proposition is the fact that these words refer to these things in this structure, we are left with a complex of reference relations. What unites the reference relation to the word and the object? King's theory secures the *metaphysical* unity of the proposition (because it is a fact) but fails to explain the *representational* unity without invoking further relations that are vulnerable to the regress. He buys unity at the cost of making the representational nature of the proposition mysterious. The regress is not dissolved; it is merely pushed back into the semantic facts that constitute the proposition.

  In contrast, act-based theories, particularly Peter Hanks' "cancellation" theory, dissolve the regress by changing the ontological category of the proposition. For Hanks, a proposition is not an object or a fact, but a type of cognitive act. To entertain the proposition *that Desdemona loves Cassio* is to perform a token act of predicating the property of loving Cassio of Desdemona. The unity of the proposition is derived from the unity of the act.

  The power of this approach against Bradley lies in the nature of agency. In a static structure, constituents sit side-by-side, requiring a "glue" (a relation) to unite them. In a cognitive act, there is no side-by-side placement. When an agent predicates a property of an object, the agent is not assembling parts; they are *operating*. The act of predication is inherently unifying because it is a functional operation on a content. There is no gap between the predicate and the subject in the act of judging that needs to be bridged by a further relation, because the bridging is the act itself. To ask "what unites the predication to the object?" is to misunderstand the grammar of action. It is like asking what unites a punch to a face; the punch is defined by its contact.

  Hanks specifically addresses the regress by arguing that the "form" of the proposition is not an additional constituent but the mode of the act. When I judge that $a$ is $F$, I am not relating $a$ and $F$ via a third thing; I am exercising my cognitive capacity to combine them. The regress assumes that combination must be a relation between objects. Act theory shows that combination can be a verb, not a noun. Therefore, the demand for a further unifier is category-mistaken. The unity is internal to the performance of the act.

  A proponent of King, or a defender of traditional Platonism, would offer a strong objection to this verdict: the problem of objectivity. This is the strongest reason to prefer the opposite verdict (that act theories fail and static theories must somehow succeed). If propositions are types of cognitive acts, their existence and unity seem dependent on thinkers. What of truths that no one has ever entertained? Does the proposition *that the universe is expanding* cease to be a unified truth-bearer in the absence of a cognitive agent to predicate expansion of the universe? Furthermore, if propositions are acts, how can they be true or false independently of the act's performance? Truth seems to be a property of content, not of the psychological event of thinking. If act theories solve Bradley's regress by psychologizing the proposition, they may do so at the unacceptable cost of losing the mind-independence required for objective truth.

  This objection is formidable, but it does not revive Bradley's regress; it raises a different problem (the problem of abstractness). Act theorists like Scott Soames have attempted to hybridize the view, suggesting propositions are *types* of acts. While Hanks is more radical, arguing that we must accept the token-dependence to save unity, the core defense against the regress remains intact even in Soames' version. The type is unified because its tokens are unified by the nature of the action they instantiate. The regress is blocked because the "structure" of the type is defined by the conditions of the act, not by static relations between parts.

  Regarding the objectivity objection: the act theorist can concede that unthought propositions are abstract types of possible acts. The unity of the *type* is secured by the unity of the *possible token*. We do not need an actual thinker to unify the proposition, only the possibility of an act with that specific predicative structure. This preserves objectivity without reintroducing the regress. The static theorist (King) cannot make a similar move because their ontology relies on actual facts obtaining (lexical relations in actual languages). If no language exists, King's propositions do not exist. Thus, the act theorist is actually better positioned to handle unthought truths than the factualist, provided they accept modal realism about act types.

  Therefore, the objectivity objection fails to show that act theories succumb to Bradley's regress. It merely highlights the cost of the solution: we must accept that propositional structure is ultimately grounded in the potentialities of agency rather than in a Platonic heaven or linguistic facts. This is a metaphysical cost, but it is not a logical contradiction. King's theory, conversely, faces a logical contradiction in the form of the regress: he cannot explain the representational unity of his facts without invoking the very relations that generate the regress.

  In conclusion, Bradley's regress serves as a decisive filter for theories of the proposition. It reveals that any account treating propositions as static complexes of constituents—whether abstract objects or concrete facts like King's—cannot explain their own unity without vicious circularity or infinite regress. King's factualism relocates the problem into the semantic relations that constitute the fact, leaving the representational unity unexplained. Act-based theories, specifically Hanks', defuse the regress by identifying the unity of the proposition with the unity of a predicative act. Since actions are not composed of parts that need external gluing, the regress gains no foothold. While act-based theories must work to secure the objectivity of truth, they succeed where factualism fails: they provide a coherent account of how constituents combine to form a truth-bearer. The verdict is that Bradley was right about objects, but wrong about unity in general. Propositions are not things to be united; they are things we do.
