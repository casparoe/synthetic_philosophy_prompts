answer: |-
  Good evening. For those who don't know me, I'm the older sibling. And for those who do know me, you know that I have spent the last four years of family dinners doing something perhaps unwise: arguing with a philosophy PhD candidate about her dissertation.

  I never studied philosophy. But through a combination of her explanations and my own stubbornness, I have come to understand the "Wrong Kind of Reasons" problem.

  For the family: essentially, my sister studies why we value things. If something is truly good, we should have a reason to admire it. But sometimes, we have reasons to admire things that have nothing to do with their goodness. The classic example is the "Evil Demon." If a demon threatens to hurt you unless you admire him, you have a very strong reason to admire him. But he isn't actually admirable. That is the *wrong kind* of reason.

  For the cohort and [Advisor's Name] in the back: I know the literature suggests there is no consensus on how to neatly distinguish the right kind from the wrong kind in the abstract.

  But tonight, I think we have a unique data set.

  When we look at a marriage, the WKR problem looms large. There are so many wrong kinds of reasons to get married. Tax breaks. Social pressure. The fear of being alone. Or, to stick with the dissertation, a coercive threat.

  Now, I have watched [Partner's Name] closely. And I can confirm, to the best of my knowledge, he is not an Evil Demon. He has not issued threats. He has not offered bribes. And [Sister's Name], while I know you love a good tax deduction, I don't think that's why you're here.

  Usually, in philosophy, we struggle to prove that a reason is the "right" one. We worry about fittingness. We worry about circularity. But looking at the two of you, the distinction seems to have solved itself.

  When [Sister's Name] looks at [Partner's Name], the reason she loves him isn't external. It isn't instrumental. It fits the object. She admires him because he is admirable. She desires a life with him because he is worthy of that desire. The reason matches the merit.

  So, to the philosophers here: We may leave the general problem unsolved tonight. The literature remains open. But for this specific case, the evidence is overwhelming. This is not a coercion problem. This is not a pragmatic calculation. This is the Right Kind of Reason.

  And to the family: She loves him because he's a good man, and she's a good woman, and they make each other better.

  Please raise your glasses.

  To [Sister's Name] and [Partner's Name]. May your reasons always be the right kind, and may your love always be fitting.

  To the happy couple.
