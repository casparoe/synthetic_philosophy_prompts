answer: |-
  The hotel bar was loud enough to provide privacy but quiet enough to hear the ice clink. Elena slid into the booth opposite Marcus, setting down her notebook. They'd both presented on the afternoon panel: *Disconnection Syndromes and the Self.*

  "You lost them on slide four," Elena said, signaling the bartender. "When you started talking about subcortical integration. I saw three people in the front row check their watches."

  Marcus smiled, loosening his tie. "And you lost them when you suggested your morning coffee is being tasted by two different subjects of experience. But I suppose that's why we're here."

  "Touché." She took the gin and tonic the bartender slid over. "Seriously, though. You defended the Unity Thesis pretty hard. But you didn't address the chimeric stimuli. If you flash a composite image—half snow, half chicken—to a split-brain patient, and ask them to point with the left hand to what they saw, they point to snow. When they say what they saw, they say 'chicken.' How is that one mind?"

  "Because 'mind' isn't just the sum of data access," Marcus said, taking a sip of his whiskey. "It's the functional output. In the wild, outside the lab, these patients don't walk into doors with their left side. They don't introduce themselves with two names. They hold conversations where the pronoun 'I' remains singular. If there were two people in there, the social friction would be undeniable. It isn't."

  "That's the 'ecological validity' argument," Elena said, tracing the rim of her glass. "It's what Gazzaniga always leans on. But it assumes that because the system *behaves* as one, it *is* one. Puccetti called this out decades ago. The corpus callosum doesn't *create* unity; it facilitates information transfer between two distinct centers of consciousness. We aren't becoming two people after the surgery, Marcus. We're unmasking the two people who were there all along. The callosum is just a privacy screen."

  "A privacy screen?" Marcus laughed softly. "That's a hell of a metaphor. You're saying my left hemisphere has been keeping secrets from my right? Look, the anatomy doesn't support a clean split. There are subcortical connections. The brainstem, the thalamus. They share arousal, attention, even some emotional coloring. When a patient drives a car, they aren't two pilots fighting for the yoke. They're a single crew where the comms line is down, but they can still see each other's hands."

  "Cross-cuing," Elena acknowledged. "You're talking about cross-cuing. Where the right hemisphere nods the head so the left hemisphere sees the image."

  "Exactly. It's a workaround. One system adapting to a lesion."

  "But it's a fragile workaround," Elena countered. "And it breaks down precisely when you prevent those external cues. In the tachistoscope conditions, the dissociation is absolute. The left hand will button a shirt while the right hand unbuttons it. One hand is fighting the other. That's not a 'system adapting.' That's inter-manual conflict. That's two agents with different volitions occupying one skull."

  Marcus leaned forward. "Okay, the alien hand stuff. It happens, sure. But it's rare. And even then, it's usually the left hemisphere's 'Interpreter' trying to rationalize the right hemisphere's impulse after the fact. The left brain sees the hand moving and confabulates a reason: 'I wanted to take my pants off.' It's constructing a singular narrative to preserve the illusion of self. That drive for narrative unity *is* the person."

  "Is it?" Elena shook her head. "Or is the Interpreter just the press secretary for the left hemisphere, spinning lies to cover up the fact that it doesn't know what the right hemisphere is doing? Just because the left side *claims* unity doesn't make it true. If I lock you in a room with a stranger and forbid you from speaking, but you both agree to push the table to the door, are you one person? Or just coordinated?"

  "We're not strangers," Marcus insisted. "We share a history. We share a body. The memory traces are largely bilateral before the cut. The emotional resonance is shared. If you prick the right foot, the whole person winces. If 'two minds' existed, pain should be private. It isn't."

  "Pain is subcortical," Elena shot back. "Semantic memory, linguistic formulation, complex planning? That's cortical. That's where the split matters. Look, Nagel wrote about this. He suggested we might be asking the wrong question. Maybe 'one person or two' isn't a binary fact about the world, but a concept we're forcing onto a biological gradient."

  Marcus sighed, swirling his whiskey. "Nagel. The 'get out of jail free' card for metaphysicians. If we say the answer is indeterminate, we stop doing science. Clinically, it matters. If I'm treating a patient, I need to know if I'm talking to *the patient* or *a hemisphere*."

  "And that's where your Unity Thesis fails clinically," Elena said, her voice softening. "Because sometimes you *are* talking to just a hemisphere. When you isolate the speech centers, the left hemisphere can express preferences the right hemisphere explicitly rejects in non-verbal tests. I sat in on a support group last month. One woman described feeling like she was 'losing time' to her left hand. She didn't feel unified, Marcus. She felt hijacked."

  "Anecdote," Marcus said, though he didn't sound convinced. "Subjective reporting from people who know they have brain damage. They're looking for an explanation for their clumsiness."

  "Or they're the only ones telling the truth because they aren't being tested in a lab," Elena said. "You keep coming back to the lab as the place of distortion. I see the lab as the only place where the truth isn't being smoothed over by the callosum. In the real world, the world is slow enough that the hemispheres can take turns. In the lab, you force them to speak at once. And they say different things."

  Marcus was quiet for a moment, watching the ice melt in his glass. "So, what's the ethical implication, Elena? If Puccetti is right, and we're all dual citizens waiting for the border to close... does a split-brain patient count as two for consent? Do they need two signatures on a surgery form?"

  "Maybe," Elena said. "Or maybe it shows that 'personhood' isn't as solid as we want it to be. We want to believe we're a monad. A single point of view. But the biology suggests we're a committee. The callosum just makes the committee meetings run so smoothly we think there's only one member."

  "But a committee with a single vote," Marcus murmured. "That's my point. The output is singular. The body moves in one direction. Even when the hands fight, the torso goes one way. There is a final common path. There has to be, or we'd tear ourselves apart."

  "Maybe we do," Elena said. "Maybe that's what schizophrenia is. Maybe that's what dissociation is. A failure of the coalition."

  Marcus picked up his glass. "Or maybe it's just a brain trying to make sense of a broken wire, and we're projecting our obsession with the soul onto a bundle of axons."

  "Possible," Elena said, clinking her glass against his. "But until we know, I think I'll keep wondering who's drinking this gin. Me, or the other guy."

  Marcus smiled, a tired, unresolved smile. "If the other guy wants a sip, tell him he'll have to ask the left hand to lift the glass. And I'm not authorizing that."

  "See?" Elena grinned. "Already negotiating."

  They drank, the noise of the conference crowd swelling around them, the question hanging in the air like smoke, neither dissipating nor settling.
