answer: |-
  Good evening. For those who don't know me, I'm [Your Name], the proud child of the guest of honor. My siblings tell me I was delegated the duty of giving this toast for one reason: I teach philosophy for a living. Apparently, in this family, that qualifies as the resident expert on "how to think."

  But looking around this room, I realize I am vastly outgunned. We have thirty years of jurisprudence represented here. We have legal minds that could dismantle my arguments before I've finished my first premise. So, I promise I won't give a lecture. I'm not here to analyze my mother's career. I'm here to celebrate the specific texture of her integrity.

  And to do that, I have to talk about how she voted.

  To the neighbors and choir friends: for thirty-four years, Mom sat on panels with other judges. When a case came in, there were two ways to reach a decision. The easy way is to ask, "Who wins?" and take a vote. The hard way—the way Mom insisted on—is to ask, "Why?" You break the case down into its pieces. Was there a duty? Yes or no. Was it breached? Yes or no. Did that breach cause the harm? Yes or no. You vote on the reasons first, and you let the verdict fall where the logic leads.

  To the clerks and judges in the room: You know this as the tension between outcome-based and issue-based aggregation. You know that sometimes, a majority wants the plaintiff to win, but a majority also thinks there was no breach of duty. You know that if you pool the outcomes, you get one verdict. If you pool the issues, you get another. Both are defensible. Both are rational. But they are not the same.

  There is a story, still whispered among her former clerks, about a case where her panel split exactly along this fault line. I won't name the case, but I know some of you are already thinking of it. I know some of you are already glancing at each other, remembering the memo wars that followed.

  Mom used to tell her clerks, "I would rather lose a case than lose the reasons for it."

  That sounds like a platitude until you realize what she was actually saying. She was saying that the law isn't just a machine for resolving disputes; it's a system for generating public truth. If we vote on the outcome and ignore the logic, we might resolve the fight, but we haven't told the public *why* the law is what it is. We've prioritized efficiency over coherence.

  Now, as a philosopher who works in social epistemology, I have to acknowledge something my mother knew better than I did. She knew that there is no perfect way to count votes.

  For my colleagues in the room: She knew List and Pettit. She knew the impossibility theorem. She understood that you cannot guarantee collective rationality, systematicity, and anonymity all at once. She knew that by insisting on issue-by-issue voting, she wasn't solving a mathematical problem. She was making a wager.

  For everyone else: She knew that there is no perfect system. Math proves it. You can't have everything you want in a group decision. You have to choose what to give up. You can give up logical consistency to satisfy the majority will, or you can give up the majority will to preserve logical consistency.

  Most people choose the former. It's safer. It's democratic. It gets the job done.

  Mom chose the latter.

  She wagered that the integrity of the reasoning mattered more than the comfort of the majority. She wagered that a verdict built on shaky logic might win the day, but it would lose the future. That is a lonely way to work. It invites exasperation. It slows things down. It means you sometimes have to tell your colleagues that their "win" is built on a contradiction.

  But look at what that wager bought us. It bought us clarity. It bought us opinions that clerks could actually read and understand. It bought us a record where the "why" was as sturdy as the "what."

  There is a temptation, when honoring a judge, to talk about justice. But justice is an outcome. My mother was obsessed with something else. She was obsessed with the architecture of justice. She understood that if the beams don't line up, the roof will eventually fall in, even if everyone votes to keep it up.

  To the lawyers here: You know how rare that is. You know how often we settle for the path of least resistance. Mom never took that path. She forced the panel to walk the ridge.

  To the friends and family: You know this side of her, too. You know she's the person who reads the instructions before assembling the furniture. You know she's the person who will stop a conversation to define a word everyone is using differently. It wasn't just a judicial habit; it was her way of being in the world. She cares more about whether we understand each other than whether we agree.

  So, as she retires, she is leaving behind a court that is better because she insisted on the hard way. She is leaving behind clerks who learned that reasons matter more than results. And she is leaving behind a family who learned that integrity is not about being right; it's about being consistent.

  Mom, you have spent thirty-four years counting votes, weighing evidence, and parsing the difference between a majority and a truth. You have earned the right to stop counting.

  So, if everyone could please raise a glass.

  To the reasons that hold up when the votes are gone. To the wager that integrity is worth the friction. And to you, Mom—may your next chapter be free of dockets, free of dissenting opinions, and full of nothing but the things you love, for no other reason than that they bring you joy.

  To Mom.
