answer: |-
  This is a great rabbit hole to fall into. You've got the summary right, but the summary hides the engine. The engine is Lewis's **Concrete Modal Realism**.

  If you treat possible worlds as abstract stories (like Plantinga or Kripke tend to), transworld identity is easy. "Humphrey" is an abstract essence that gets plugged into different story-scripts. But Lewis thinks worlds are **concrete physical universes**, just as real as this one, spatiotemporally isolated from us.

  Once you commit to *that*, transworld identity breaks. Here is the reconstruction of the arguments you asked for, stripped of the jargon.

  ### 1. The Argument from Accidental Intrinsics (Reconstructed)

  The buzzword version is: "An object can't have incompatible intrinsic properties." The gut-level version is about **what you are made of.**

  Imagine you are Humphrey. In this world ($W_1$), you have five fingers on your left hand. In another world ($W_2$), you have six.
  *   **Transworld Identity says:** You are literally, numerically identical in both worlds. It is the *same object* $H$.
  *   **Lewis asks:** Where is $H$?

  If $H$ is wholly present in $W_1$ and wholly present in $W_2$, then $H$ is in two places at once. But for Lewis, $W_1$ and $W_2$ are spatiotemporally isolated. There is no distance between them; there is no path. To be in two places at once usually implies a spatiotemporal connection (like a worm having parts at different times).

  If you say, "Okay, $H$ has 5 fingers *at $W_1$* and 6 fingers *at $W_2$*," Lewis says you have just turned an **intrinsic** property into a **relational** one.
  *   **Intrinsic:** Having 5 fingers. (Depends only on you and your parts).
  *   **Relational:** Having 5 fingers *relative to World 1*.

  Lewis argues that having five fingers isn't a relation between you and a "world." It's a relation between your hand and your fingers. If you are the *same object* in both worlds, your hand is the same hand. So the same hand has 5 fingers and 6 fingers. Contradiction.

  **The Gut Check:**
  Lewis is demanding mereological consistency. If worlds are concrete containers, an object cannot be wholly inside two disjoint containers. If you say it can, you have to explain what the object *is* independent of its parts.
  *   **Transworld Identity** requires a "substratum" or a "haecceity" (a primitive "this-ness") that holds the identity together even when all the properties (finger count, height, hair color) change.
  *   **Lewis** hates haecceities. He thinks they are magical. He thinks an object is just a bundle of properties and parts. If the parts/properties change significantly enough across worlds, there's no glue holding the "sameness" together except a magical label. Counterpart theory replaces the magic label with **similarity**, which is a naturalistic relation we already understand.

  ### 2. The "No Overlap" Principle

  This follows from the above. Lewis defines a world as a **maximal spatiotemporally connected sum of objects.**
  *   If Object $X$ is part of World $A$ and World $B$...
  *   Then $X$ is spatiotemporally related to things in $A$ and things in $B$...
  *   Therefore, things in $A$ are spatiotemporally related to things in $B$ (via $X$)...
  *   Therefore, $A$ and $B$ are actually just one big world.

  To keep worlds distinct, nothing can be shared. If Humphrey is in both, the worlds merge. To keep them separate, Humphrey must be distinct in each.

  ### 3. Kripke's Objection: Does it Sink the Theory?

  Kripke's objection ("Humphrey doesn't care if a *counterpart* wins, he cares if *he* wins") is the most famous objection to Lewis.

  **Does it sink the theory?**
  Logically? No. Psychologically? It stings.

  **Lewis's Response:**
  Lewis argues Kripke is begging the question. Kripke assumes that for modal claims to matter, they must be about *transworld identity*. Lewis is offering an analysis of what modal claims *mean*.

  Lewis's counter-move is: "When you say 'I could have won,' you think you mean literal identity. But look at how you actually judge modal claims."
  *   How do you decide if a scenario is a possibility for *you*? You look for a scenario where someone **like you** (same origin, same psychology, same body) does something.
  *   You don't have access to "haecceities." You can't check the "ID card" of the person in the other world. You only check similarity.
  *   Therefore, our modal discourse is *actually* tracking similarity, even if we use identity language.

  **The "De Re" Defense:**
  Lewis distinguishes between *de dicto* (about the statement) and *de re* (about the thing).
  Kripke says: "It's about the thing (Humphrey)!"
  Lewis says: "Yes, but our access to the thing in other worlds is *always* via description/similarity. There is no mystical teleportation of the self."

  **The Verdict on Kripke:**
  Kripke exposes that Counterpart Theory violates our **pre-theoretic intuition** about self-concern. We *feel* like we are talking about ourselves. Lewis admits this but says our feelings are metaphysically misleading.
  However, Lewis wins on **logical puzzles**. Counterpart theory solves problems that break Transworld Identity, like **Chisholm's Paradox**.
  *   *Chisholm's Paradox:* If I could have been slightly different, and that slightly different me could have been slightly different, by transitivity, I could have been radically different (e.g., born of different parents).
  *   Transworld identity struggles with where to draw the line (Sorites paradox).
  *   Counterpart theory handles this easily: Counterpart relations are **not transitive**. $A$ is a counterpart of $B$, $B$ is a counterpart of $C$, but $A$ is not necessarily a counterpart of $C$. This matches our intuition that there are limits to "how different" I could be.

  ### 4. The "Gut-Level Why" (The Meta-Reason)

  Why did Lewis actually do this? It wasn't just to be contrarian.

  **1. Naturalism:** Lewis wants to modalize without magic. Transworld identity requires a primitive "essence" that persists across universes. Lewis thinks that's spooky. Similarity (Counterparts) is just comparing properties. We know what properties are. We don't know what "essences" are.

  **2. Uniformity of Semantics:** Lewis wants to treat "I am tall" and "I could have been tall" using the same logical machinery (quantifiers over domains).
  *   "I am tall" = There exists an $x$ (me) such that $x$ is tall.
  *   "I could have been tall" = There exists a world $W$ and a counterpart $y$ of me in $W$ such that $y$ is tall.
  It keeps the logic clean (first-order logic) without needing new modal operators that can't be analyzed.

  **3. The Tegmark Connection:**
  Since you mentioned Tegmark: Tegmark's Level IV multiverse is closer to Lewis than to Kripke. In Tegmark's view, mathematical structures exist. If "You" are a specific mathematical structure, a slightly different structure in another part of the multiverse is **not** you. It is a distinct structure that looks like you.
  Lewis is basically saying: "If worlds are real places, you can't be in two of them. If you are a specific arrangement of matter/properties, a different arrangement is a different person."

  ### Summary

  *   **Why not Transworld Identity?** Because if worlds are concrete and isolated, you can't be in two of them without merging them. Also, it turns intrinsic properties (finger count) into relations (finger-count-at-world), which Lewis thinks destroys the nature of properties.
  *   **Does Kripke sink it?** No. Kripke appeals to intuition ("I care about *me*"). Lewis appeals to logic and semantics ("Your intuition relies on magic haecceities; my theory explains how you actually judge possibility via similarity").
  *   **The Trade-off:** Lewis buys logical consistency and naturalism at the cost of violating our deep-seated feeling that "I am essentially me." Kripke saves the feeling of "me" at the cost of introducing primitive essences and logical paradoxes (like Chisholm's).

  Lewis basically looked at the bill for Transworld Identity (magic essences, logical paradoxes, overlapping worlds) and decided Counterpart Theory was the cheaper option, even if the customer (Humphrey) didn't like the service.
