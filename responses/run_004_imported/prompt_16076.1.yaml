  **Move 1 (Owen): Score 1**
  Owen accurately articulates Walton's core distinction between genuine emotion and "quasi-emotion," grounding it in a functionalist criterion (motivational profile). However, the move is vulnerable because it treats the lack of action as definitive proof of the lack of real emotion. This ignores cases of genuine fear that result in paralysis or are overridden by other beliefs, making the premise contestable rather than decisive.

  **Move 2 (Naomi): Score 2**
  Naomi deploys a classic and robust counterexample (the glass floor) that effectively severs the link Owen draws between action and genuine emotion. By showing that visceral fear can exist without evasive action even when the danger is known to be managed, she successfully undermines Owen's specific behavioral evidence, forcing the debate onto ontological grounds.

  **Move 3 (Owen): Score 2**
  This is a philosophically precise recovery. Owen correctly identifies a disanalogy Naomi glossed over: the glass floor case involves *real* physical properties (height, gravity) that are merely risk-assessed, whereas fiction involves *no* instantiated properties. This restores the burden of proof to the Thought Theorist to explain how "tracking nothing" can trigger a mechanism designed for "tracking something."

  **Move 4 (Naomi): Score 1**
  Naomi rightly identifies that non-veridical states (nightmares) produce real distress, which pressures Owen's "reality-tracking" constraint. However, the move is slightly imperfect: nightmares are often categorized as distinct from waking emotions, and imagining a loved one's death involves a real object (the person), unlike Anna Karenina. While strong, the analogy to fiction is not exact, leaving Owen room to distinguish the cases.

  **Commentary on the Exchange**
  Both students are arguing competently within established frameworks, but they are overlooking three crucial dimensions of the debate. First, they neglect the **phenomenological cost**: Owen's view requires denying the intuitive feeling that our grief for Anna is real, while Naomi's requires explaining the mechanism without a causal object. Second, they treat **intentionality** too simplistically; they assume the object of the emotion must be the character, whereas hybrid views suggest we may be emoting about the *concept* or our *own situation*. Finally, neither addresses the **evolutionary function** of this capacity—whether fiction emotions are a spillover error or a simulation tool for moral practice—which might explain why the system activates without existence-beliefs.
