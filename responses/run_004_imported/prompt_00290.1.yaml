answer: |-
  The standard Causal Decision Theory (CDT) argument against voting relies on a specific metaphysical claim: that your decision is a causal singleton, isolated from the decisions of other agents except through direct causal chains (like convincing a friend). Under CDT, you treat the rest of the world as fixed while you intervene. Since the probability of a single vote breaking a tie in a national election is vanishingly small ($\approx 10^{-7}$ or less), the expected utility ($EU$) is $P(\text{pivotal}) \times \text{Benefit} - \text{Cost}$. For any reasonable cost (time, effort), $EU < 0$.

  This conclusion is correct *if* CDT is the correct normative theory of decision-making. However, voting is structurally identical to Newcomb's Problem and the Prisoner's Dilemma with many players. In these scenarios, CDT fails because it ignores **logical correlations** between agents running similar decision algorithms.

  Here is the argument for why voting is instrumentally rational for an outcome-focused agent, provided you adopt an Evidential (EDT) or, more robustly, Updateless/Timeless (UDT/TDT) framework.

  ### 1. The Decision Algorithm, Not the Physical Act
  The fundamental error in the CDT framing is identifying the "act" as the physical movement of marking a ballot. In UDT/TDT, the "act" is the output of your decision algorithm.

  You are not a unique soul making a magical, uncaused choice. You are a physical instantiation of a reasoning process. If you are a rational agent in a rationalist community, your decision to vote is derived from a specific chain of reasoning (e.g., "I care about outcome $X$, voting increases $X$, therefore I vote").

  There are thousands of other agents running sufficiently similar algorithms. They have similar priors, similar values, and access to similar information (including this very argument). If your algorithm outputs "Vote," it is logically necessary that all other instances of that algorithm (or sufficiently isomorphic ones) also output "Vote."

  Therefore, you are not choosing whether *one* vote is cast. You are choosing whether a **block** of correlated votes is cast.

  ### 2. Modeling the Correlation (The "Weeds")
  The crux of the objection is usually: "How similar do they need to be?" If I vote, does that cause a stranger in Ohio to vote?

  Under CDT, no. Under UDT, the question isn't about causation; it's about **logical counterfactuals**.
  *   **Counterfactual:** If my algorithm outputted "Don't Vote," what would happen?
  *   **Implication:** If my algorithm outputted "Don't Vote," then any agent simulating or running my algorithm would also output "Don't Vote."

  The strength of the correlation depends on the **reference class of similarity**.
  1.  **Strict Identity:** Only exact copies of you (clones). Correlation = 1.0. Block size = 1. (CDT result).
  2.  **Algorithmic Isomorphism:** Agents using the same decision theory and heuristics to solve the voting problem.
  3.  **Demographic/Partisan:** Agents who want the same candidate.

  For the voting argument to work, we need Category 2. You don't need to be demographically identical to the other voters. You need to be **reasoning-identical**.

  If you are part of a community (like the one you're posting in) where the norm is "analyze voting via decision theory," the correlation coefficient among that group is high. If you conclude "Voting is irrational," the other 5,000 rationalists in swing states who read the same arguments will also conclude "Voting is irrational." If you conclude "Voting is rational," they likely will too.

  **The Math of the Block:**
  Let $N$ be the size of the correlated block (the number of agents running your algorithm).
  Let $M$ be the margin of victory.
  In a large election, the probability distribution of the margin $M$ is roughly normal centered near 0 (for competitive elections).
  *   **CDT:** You change the margin by 1. $P(|M| \le 1)$ is tiny.
  *   **UDT:** You change the margin by $N$. $P(|M| \le N)$ is significantly larger.

  If $N$ is 10,000 (a modest estimate for a coordinated rationalist bloc in a swing state), the probability that the election margin is within 10,000 votes is orders of magnitude higher than the probability it is exactly 1 vote.
  The Expected Utility becomes:
  $$ EU = P(\text{Margin} < N) \times \frac{N}{\text{Total Votes}} \times \text{Benefit} - \text{Cost} $$
  *(Note: The benefit scaling is complex, but roughly, moving a block of $N$ votes in a tight election has $N$ times the impact of one vote, and the probability of that block being pivotal is much higher than a single vote being pivotal.)*

  Even if $N$ is small, say 1,000, the probability of a 1,000-vote margin is vastly higher than a 1-vote margin. The "pivotal" probability stops being about a exact tie and starts being about being in the **tail of the distribution** where your block tips the scale.

  ### 3. Generalization to Collective Action
  Does this rescue all collective action problems? It depends on the **fidelity of the algorithm**.

  *   **Voting:** High fidelity. The decision is binary, public (in aggregate), and the reasoning is often explicit. It is easy to identify "agents like me."
  *   **Climate Change:** Lower fidelity. The action is diffuse (buy EV? eat less meat? donate to policy?). The causal chain is noisy. However, if you are part of a specific movement (e.g., "Effective Altruists reducing carbon"), your decision to adopt a costly habit is correlated with others in that movement.
  *   **Unionizing:** High fidelity. "If I strike, do others strike?" If the workers share a communication channel and a shared reasoning process ("We all gain if we all strike"), UDT dictates striking. CDT dictates free-riding.

  The UDT argument works best where the **common knowledge** of the decision process is high. Voting in a rationalist community is a "focal point" for this reasoning. In the general population, the correlation is weaker because most voters are not running a "calculate expected utility" algorithm; they are running "follow tribe" or "habit" algorithms. However, even then, your vote is correlated with your demographic/tribe. If you stay home, it is evidence your tribe stays home.

  ### 4. Is This a Patch or a Paradigm Shift?
  This is not a special-case patch for voting; it is evidence that CDT is descriptively and normatively incomplete.

  CDT works well in a world of independent causal levers. It fails in a world of **logical dependencies**.
  *   **Newcomb's Problem:** CDT two-boxes and loses. EDT/UDT one-boxes and wins.
  *   **Prisoner's Dilemma:** CDT defects. UDT cooperates with a mirror match.
  *   **Voting:** CDT abstains. UDT votes.

  In all three cases, the structure is the same: Your decision is correlated with the state of the world (or other agents' decisions) not because you cause it, but because you share a common cause (the decision algorithm).

  If you accept that you are a physical system running code, then "changing your decision" logically implies "changing the output of that code wherever it runs." To ignore this is to suffer from an illusion of uniqueness.

  **The Verdict:**
  Voting is rational for an outcome-focused agent **if and only if** you reject the CDT assumption of causal isolation. You must accept that your decision is a logical event that updates the probability of other similar agents making the same decision.

  If you believe you are truly unique (no one reasons like you), then CDT applies, and you should not vote. But if you acknowledge that you are an instance of a type (a rational agent in a specific context), then you must act as the representative of that type. Since the type "rational outcome-maximizer" is large enough to swing close elections, the expected utility of voting becomes positive.

  This suggests UDT/TDT is the superior framework generally. CDT is merely the limit of UDT where the correlation between agents approaches zero. In a connected world of communicating agents, that limit rarely holds.
