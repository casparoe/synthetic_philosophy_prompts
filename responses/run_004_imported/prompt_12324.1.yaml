answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Captain's kid.

  Thirty-four years. That is a long time to wear a badge. When you look around this room, you see the resume: the beat cop days, the promotions, the shift captain, the medals, the overtime. My aunts and uncles see the steady paycheck and the pension. The guys from the precinct see the guy who covered their shifts and signed the reports.

  But I got the version of Dad that came home after the shift. And if you're wondering why there's a philosophy nerd in the family when neither of my parents went to college for it, it's because of the glovebox of his cruiser. For about twenty years, there was a beat-up paperback in there: Blaise Pascal's *Pensées*.

  Now, for the family: Pascal was a 17th-century French mathematician and philosopher. For the guys from the precinct: He was a guy who thought deeply about why people do what they do. And for my dad's friend from community college who is definitely watching me right now: I know exactly which sections we're talking about.

  Dad had a favorite passage. He'd be driving me to school, or sitting at the kitchen table in uniform, and he'd recite it. It goes something like this: *"Justice without force is powerless; force without justice is tyrannical."*

  Pascal's point was pretty cynical. He said that since we can't make what is *just* become *strong*, we just decide that what is *strong* counts as *just*. Basically, law is just power wearing a mask.

  Now, imagine hearing that from your dad, who carries a gun for a living. He'd look at me, half-smiling, and say, *"Don't get it twisted, son/daughter. I'm not in the justice business. Justice is a different department. I'm in the force business."*

  When I was younger, that sounded a little dark. It sounds like he's saying, *"I just enforce the rules, I don't care if they're right."* And if I stopped there, this would be a pretty terrible toast. It would sound like he spent 34 years just pushing people around because the badge told him he could.

  But Dad never stopped at the first quote. He always followed it up with Pascal's idea of the "Orders."

  Pascal said there are different levels of reality. There's the Order of Bodies—that's strength, force, physical power. That's the badge. That's the gun. But then there's the Order of Charity—that's kindness, mercy, love, goodness. And Pascal says you cannot mix these orders. You can't use a gun to get love. You can't use physical force to create moral goodness. They are different languages.

  And *that*... that was the job my dad actually did for 34 years.

  He knew he worked in the Order of Bodies. He knew his tools were physical. But he never confused those tools with being a good human being. He knew that just because he *could* overpower someone, didn't mean he *should*. He knew that handcuffs don't fix broken families, and a siren doesn't heal trauma.

  There were probably nights he came home tired, not because of the danger, but because of the tension between those two orders. Knowing he had to be strong enough to keep the peace, but humble enough to know that strength wasn't the same thing as righteousness.

  To the guys in the room: You know this better than anyone. You know the difference between clearing a call and actually helping someone. Dad was a captain who reminded us that the badge gives you authority, but it doesn't give you virtue. You have to bring that yourself.

  To the family: He was the guy who quoted French philosophers while grilling burgers. He was the guy who knew that being "strong" wasn't about how loud you could talk, but about knowing when to listen.

  And to his friend from the night class: He didn't just read the book. He lived the distinction. He kept the force in the holster and the charity in his heart, and he spent three decades making sure he never confused the two.

  Dad, you taught me that justice might be powerless without force, but force is dangerous without a conscience. You kept the orders separate, and in doing so, you made sure the people you served never felt like they were dealing with a tyrant, but with a person.

  So, if everyone could please raise a glass.

  To Captain [Dad's Name]. For 34 years of force, wisely used. And for a lifetime of charity, freely given.

  Cheers.
