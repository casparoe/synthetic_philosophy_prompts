answer: |-
  Here is a draft for the eulogy. It is written to be spoken at a moderate pace, which comes to about 5 minutes.

  I have threaded the needle by focusing on Miriam's concept of **irreducibility** without implying **immortality**. The core metaphor is "the light." It acknowledges that the light needs the bulb (the brain) to exist, but insists the light itself is real and not just an illusion of the glass (the atoms). This satisfies the PhD student (it's non-reductive), the Grandmother (it treats consciousness as sacred), and avoids the lie of an afterlife.

  ***

  **Eulogy for Miriam**

  Thank you all for coming. For those who don't know me, I'm [Your Name]. I write stories for a living, which feels appropriate, because my Aunt Miriam spent her life asking us what makes a story real, and who is inside to hear it.

  If you knew Miriam at a family dinner, you probably remember the "Zombie." Not the brain-eating kind. Miriam's zombie was a thought experiment. She'd put down her wine glass and ask us to imagine a person who looked exactly like us, acted exactly like us, even yelled "ow" if they stubbed their toe—but who had nobody home inside. No pain. No experience. Just lights on, but no one in the control room.

  She used this story to make a very specific point. She wanted us to know that what we feel—this inner life, this awareness of being here—is not just a trick of chemistry. It is something real. It cannot be reduced to mere atoms firing. To Miriam, the fact that we *feel* the world, rather than just processing it, was the great miracle of being human.

  Now, I know Miriam's views on this were… precise. She was a philosopher, after all. And I know that for many of us, especially my grandmother, the idea that our inner life is "something extra" usually leads to a comforting thought: that this part of us floats free when we die. That the light goes on somewhere else.

  Miriam didn't believe that. And I wouldn't stand here and tell you she did. She would be the first to correct me if I promised you she's watching over us from a cloud. She believed that the light of consciousness, as miraculous as it was, depended entirely on the lamp. When the lamp breaks, the light doesn't go somewhere else. It simply… stops.

  But—and this is where I think she offers us something just as profound as comfort—she didn't think that made the light any less real.

  In fact, she argued the opposite. She spent forty years fighting the idea that we are just biological machines. She insisted that love, grief, the taste of coffee, and the sound of this room breathing together… these are not illusions. They are not *just* physics. They are genuine, irreducible things.

  She taught that the value of consciousness isn't in how long it lasts, but in the fact that it exists at all.

  So, how do we say goodbye to someone who didn't believe in goodbyes in the spiritual sense, but who cherished the human spirit more than anyone I knew?

  I think we do it by witnessing.

  Miriam believed that the tragedy of death isn't that a soul goes missing; it's that a unique perspective on the universe is lost. There was a way the world looked through Miriam's eyes that will never exist again. There was a specific quality to her laughter, her skepticism, her patience, that was not reducible to anything else.

  She is not here. The lamp is broken. But the light she cast is still hitting us.

  I see it in her former students, who are here today, carrying her rigorous way of thinking. I see it in her book club, who she challenged to read deeper. I see it in my grandmother, who loved her despite their disagreements on metaphysics, because Miriam treated that love as a real thing, not just a biological impulse.

  Miriam taught us that we are not ghosts haunting machines. We are the light itself, for as long as the bulb holds. And the only way that light survives is if we reflect it.

  So, I won't say she is in a better place. I will say she was in *this* place, fully, fiercely, and consciously. And if we pay attention—if we really feel the grief of losing her, and the warmth of remembering her—we are proving her point. We are proving that there is someone home.

  Thank you, Aunt Miriam, for teaching us to wake up.

  ***

  ### Notes for the Speaker (Why this works):

  *   **The "Zombie" Explanation:** It simplifies the *Philosophical Zombie* argument without using jargon like "qualia" or "supervenience." It frames it as "Lights on, nobody home," which is the standard layman's explanation Miriam likely used herself.
  *   **The Afterlife Pivot:** The paragraph starting *"Now, I know Miriam's views on this were… precise"* is the crucial bridge. It explicitly tells the Catholic grandmother, "I know what you believe, and I know what she believed, and I am not lying to you about the difference." It validates the grandmother's hope while maintaining Miriam's integrity.
  *   **The "Lamp and Light" Metaphor:** This is a classic analogy for non-reductive physicalism (or property dualism). It acknowledges dependence on the brain (the lamp) without reducing the experience to the brain (the light is distinct from the glass). This will satisfy the PhD student.
  *   **The Conclusion:** "We are proving her point." This turns the act of mourning into a philosophical affirmation. It suggests that our grief is proof of the very consciousness she championed. It provides emotional closure without metaphysical lies.
