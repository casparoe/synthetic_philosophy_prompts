          *   *Memory isn't enough:* Memory is just another internal state (subject to the same skepticism).
          *   *Community as CI/CD:* Others provide an external check. They say "No, that's not how we use `+`."
          *   *Normativity requires friction:* You need the possibility of being *wrong* in a way that isn't just "my brain fired differently." Being wrong means violating a social standard.
          *   *Desert Island:* Without the community, "correct" just means "what I feel like doing." That's not rule-following; that's just behavior.

