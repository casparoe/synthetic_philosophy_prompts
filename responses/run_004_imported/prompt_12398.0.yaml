              *   *Coding equivalent:* We can't prove the code is "correct" in isolation, but we have CI/CD pipelines (community) that flag deviations.
              *   *Shift:* Move from "Truth Conditions" (does this match reality?) to "Assertibility Conditions" (are we allowed to say this?).
              *   *Key Distinction:* It's not about *what is*, it's about *what we do*.

      *   **Part 3: Why the Community is Load-Bearing (The Desert Island).**
          *   *The Problem:* If I'm alone, who checks my work?
