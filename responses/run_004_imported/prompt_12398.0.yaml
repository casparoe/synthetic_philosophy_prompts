      *   **Part 1: Why the "Check the Algorithm" (Dispositional) Move Fails.**
          *   *Analogy:* The brain as a black box vs. source code.
          *   *Argument 1: Normativity (Is vs. Ought).*
              *   Code analogy: A function returning `5` for large inputs isn't "wrong" physically, it's just a bug relative to the *spec*. The disposition is just what the hardware *does*. Meaning is the *spec*.
              *   If my brain is wired to say "5" for 57+, that's my disposition. But I *mean* plus. If I say "5", I made a mistake. Dispositions can't distinguish between "I meant quus and answered correctly" vs "I meant plus and made a mistake."
          *   *Argument 2: Finitude/Complexity.*
              *   Code analogy: Integer overflow or stack depth.
              *   I am physically incapable of computing $10^{100} + 10^{100}$. My brain would melt. So I have *no* disposition for that input. But I still *mean* plus for those numbers. The function exists in my understanding even if the hardware can't run it.
          *   *Argument 3: The "Quus" Implementation.*
              *   Maybe my brain *is* a quus-machine physically. How do I know? I can't inspect my own neurons without interpreting them (which leads back to the start).

      *   **Part 2: Straight Solution vs. Skeptical Solution.**
          *   *Straight Solution:* Find the fact. Prove I meant plus.
