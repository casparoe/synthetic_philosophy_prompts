answer: |-
  **Title:** The Boundary of Meaning
  **Characters:**
  *   **Elena:** A defender of the Gricean framework.
  *   **Marcus:** A critic advocating for a contextualist approach.

  **Setting:** A quiet corner of the university library, late afternoon. Textbooks and notebooks are spread across the table.

  ***

  **Elena:** I've been reviewing your draft on pragmatic intrusion, Marcus. I think you're being too quick to discard Grice. The distinction between *what is said* and *what is implicated* is the bedrock of philosophy of language. Without it, we lose the ability to separate the stable, conventional meaning of our language from the fleeting intentions of speakers.

  **Marcus:** I'm not discarding the insight, Elena. I'm discarding the rigidity. Grice's framework assumes that "what is said" is determined almost entirely by the conventional meaning of the words, plus a little bit of housekeeping—disambiguation and reference fixing. My point is that this boundary is porous. In many cases, context doesn't just help us infer what the speaker *means*; it determines what the speaker *says*. Grice's account is too narrow to capture that.

  **Elena:** But that narrowness is a feature, not a bug. If we allow context to seep into "what is said" whenever it feels convenient, semantics loses its autonomy. We need a level of content that is determined by the linguistic code itself. For Grice, *what is said* is the proposition expressed by the sentence once you've fixed the referents of indexicals like "I" or "now" and resolved ambiguities. Everything else—everything that relies on the Cooperative Principle and the Maxims—is *implicature*. This preserves the truth-conditional core of semantics.

  **Marcus:** The problem is that the "truth-conditional core" often doesn't exist without heavy pragmatic lifting. Let's look at a concrete example. Suppose I walk into the room, soaking wet, and I say, "It is raining." According to Grice, what have I *said*?

  **Elena:** You've expressed a proposition that it is raining. Now, a strict Gricean might argue that "rain" is a one-place predicate in the logical form, but to make it truth-evaluable, we treat the location as a hidden indexical. So, you've said *that it is raining at location L*. The context helps us fix *L*, much like it fixes the referent of "here." That fixing is part of "what is said."

  **Marcus:** But that's exactly where the Gricean story strains credulity. Is there really a syntactic slot for location in the sentence "It is raining"? There's no word like "here" or "there" uttered. If I say "It is raining," and you ask, "Where?", I haven't *implicated* a location; I've failed to *say* a complete proposition until the location is supplied.
  Grice wants to say that the location is either syntactically mandated (a hidden variable) or it's an implicature. If it's an implicature, then *what is said* is the trivial proposition "It is raining somewhere." But that's not what I communicated. I communicated *that it is raining here*. If the truth of my utterance depends on it raining *here*, then "here" must be part of *what is said*.

  **Elena:** I see your move. You're arguing for pragmatic intrusion into the truth conditions. But consider the alternative. If we allow context to determine the content of "what is said" without syntactic constraint, where does it stop? If I say, "I've had breakfast," Grice says I've said that at some point in my life, I have eaten breakfast. That is semantically complete. The fact that I imply *today* is a conversational implicature derived from the Maxim of Relevance.
  If you argue that "today" is part of *what is said*, you're claiming that the sentence "I've had breakfast" is semantically incomplete. But English grammar doesn't demand a temporal adjunct. By insisting context completes the proposition, you're conflating the *proposition expressed* with the *proposition communicated*. Grice gives us the tools to distinguish them.

  **Marcus:** But why preserve a distinction that maps onto nothing psychological or communicative? When you hear "I've had breakfast," you don't first process the trivial truth "He has eaten breakfast at some point in history" and then infer "He means today." You immediately understand the relevant proposition.
  Grice's model suggests a two-step process: decode semantics, then calculate pragmatics. But in cases like "It's raining" or "Steel isn't strong enough," the pragmatic process is constitutive of the content. In the steel case, "strong enough" is incomplete. Strong enough for what? To build a bridge? To hold a book? The standard isn't implicated; it's part of the truth conditions. If the steel is strong enough for a book but not a bridge, and I said it wasn't strong enough (implying for a bridge), was I lying?
  If "what is said" is just the conventional meaning, I told the truth (it is strong enough for *something*). But intuitively, I spoke falsely. This suggests that the standard ("for a bridge") is part of *what is said*. Grice's binary forces us to call this an implicature, which makes the truth-conditions of the utterance diverge from our intuitive judgments of truth and falsity.

  **Elena:** You're relying on intuition pumps, Marcus. But Grice's distinction is normative. It's about what the words *mean*, not just what the speaker gets across. If we collapse the distinction, we risk making semantics entirely hostage to context. Imagine a legal contract. If I sign a document saying "Payment is due," and you argue that context implies "when I feel like it," you've altered *what is said* based on pragmatic enrichment.
  Grice protects us from this. He allows for reference fixing—that's part of "saying." But he draws the line at *free enrichment*. In the "steel" case, a Gricean can argue that the standard is indeed implicated. The literal truth is preserved, but the utterance is misleading. The distinction allows us to explain how you can be technically truthful but conversationally deceptive. That's a powerful analytical tool.

  **Marcus:** It's powerful only if the distinction holds up. But if "what is said" is so stripped down that it rarely matches what is actually assessed for truth or falsity, does it do any theoretical work? Contextualists like Recanati or Travis argue that the proposition we evaluate is the *explicature*—the developed logical form.
  Your legal contract example actually hurts your case. In court, judges constantly look at the "context of utterance" to determine what the contract *says*, not just what it implicates. They don't treat the context as an add-on; they treat it as essential to the meaning. If the law recognizes that context determines the content of the assertion, why should philosophy of language insist on an artificial semantic core that no one actually uses?

  **Elena:** Because without that core, we can't explain *cancellation*. That is Grice's ace in the hole. I can say, "It's raining, but not here." If the location were part of the conventional meaning of my utterance in a way that wasn't cancellable, that sentence would be a contradiction. But it's not.
  Similarly, with "I've had breakfast," I can add, "...in fact, I had it ten years ago, not today." I can cancel the temporal implicature without contradicting myself. This proves that the specific temporal content ("today") wasn't part of *what is said*. It was implicated. If it were part of "what is said," cancelling it would render my statement incoherent. The fact that we can peel away the contextual layers to reveal the conventional meaning underneath proves Grice right.

  **Marcus:** Cancellation works for generalized implicatures, sure. But does it work for all cases of underdetermination? Try cancelling the location in "It's raining." Say, "It's raining, but not in any specific location." That sounds nonsensical. You can't cancel the need for a location because the predicate "raining" requires a location to be truth-evaluable.
  This suggests that some contextual contributions are mandatory, not optional. Grice lumps all context-dependence together, but we need to distinguish between *optional* implicatures (which can be cancelled) and *mandatory* pragmatic enrichment (which cannot). By treating all context-driven content as either "reference fixing" or "implicature," Grice misses the middle ground where pragmatics saturates the semantic content to make it propositional.

  **Elena:** So you're proposing a tripartite distinction? Conventional meaning, pragmatic enrichment of content, and then implicature?

  **Marcus:** Essentially. Or, at least, acknowledging that "what is said" is already a pragmatic notion. It's not just decoding; it's inferring the intended proposition.

  **Elena:** But if "what is said" is pragmatic, then semantics has no independent object of study. We lose the ability to study the linguistic system in isolation. Grice gave us a way to separate the code from the use. Even if the "code" yields a minimal proposition that is rarely asserted, it's the necessary foundation for the implicature to get off the ground. You can't implicate that it's raining *here* unless the conventional meaning provides the concept of *rain*.

  **Marcus:** I agree the conventional meaning provides the constraints. But the *proposition*—the thing we argue about, bet on, or judge as true—is a hybrid. It's a fusion of code and context. Grice's framework treats them as separate layers, like oil and water. I'm arguing they mix.
  If we stick to Grice, we end up saying that in most ordinary conversations, speakers rarely assert *what is said*. They assert *what is implicated* or some enriched version. If the theory tells us that the central notion of "saying" is rarely what speakers are actually doing, the theory is failing to describe the phenomenon.

  **Elena:** I think we might be talking past each other on the definition of "saying." For Grice, "saying" is a technical term. It's not a synonym for "communicating." It's a specific level of analysis. I'm defending it because it keeps the logic clean. If we allow pragmatic intrusion everywhere, logical form becomes unstable. "Everyone went to Paris" could mean "Everyone in the class," "Everyone in the family," or "Everyone on earth" depending on the wind. If that domain restriction is part of "what is said," then the logical quantifier $\forall$ changes its meaning constantly. Grice keeps the quantifier stable and treats the domain restriction as a pragmatic constraint.

  **Marcus:** But the quantifier *does* change its domain in natural language logic. If I say "Everyone is here," and one person from the class is missing, I am wrong. I am not technically lying because "everyone in the universe" isn't here. I am wrong about *what I said*. The domain restriction is part of the truth conditions.
  Look, Elena, I value the precision Grice brings. But precision shouldn't come at the cost of accuracy. If the framework requires us to posit hidden variables for every contextual parameter or to claim speakers are asserting trivialities just to save the semantic/pragmatic boundary, then the boundary is in the wrong place.

  **Elena:** And if we move the boundary, we risk making semantics indistinguishable from psychology. But... I will concede this: the "It's raining" case is the hardest for the classical view. Perhaps there is a limited class of cases where pragmatic enrichment is mandatory for propositional completion.

  **Marcus:** And I will concede that without the baseline of conventional meaning, we have no constraint on that enrichment. We need Grice's "conventional meaning" to stop the context from running wild.

  **Elena:** So, perhaps the disagreement isn't about whether conventional meaning matters, but about how much work it does in determining the proposition expressed.

  **Marcus:** Exactly. Grice thinks it does almost all the heavy lifting for "what is said." I think it just provides the skeleton, and pragmatics provides the flesh. And you can't have a living utterance with just a skeleton.

  **Elena:** *Closes her notebook.* Well, that's certainly enough to be getting on with for the paper. Just make sure you cite the cancellation test. I'll be looking for it.

  **Marcus:** *Smiles.* Don't worry. I'll make sure to implicate that I've addressed it, even if I don't strictly say so.

  **Elena:** *Laughs.* Touché.
