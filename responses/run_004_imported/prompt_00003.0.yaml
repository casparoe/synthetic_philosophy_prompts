answer: |-
  My friend was agonizing over whether to take a job that paid less but promised to "fundamentally reshape his soul."

  "Look," I said, "buying a house is a big decision. But it's ordinary. You know you want shelter, you know you hate mold. You can calculate the utility."

  "And the job?" he asked.

  "That's a transformative experience," I said. "Epistemically, you can't know what it's like until you do it. Personally, doing it changes who you are."

  "So I can't know if I'll be happy?"

  "Correct. It's an epistemic bind. You need the experience to assign value to the experience, but the experience eliminates the 'you' that needed to assign the value."

  "So I'm flying blind?"

  "No," I said. "You're just the cocoon. You'll only know it was the right choice after you've become the person who thinks it was the right choice."

  "And if I regret it?"

  "Then you'll regret it as a stranger. Current-You is just the down payment."
