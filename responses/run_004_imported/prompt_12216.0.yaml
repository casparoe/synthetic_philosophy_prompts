          4.  Part 3: Gödel's Actual Arguments (Rationality, Time, Justice).
          5.  Conclusion: Summarize why the friend was right but the user's intuition captures Gödel's *spirit* if not his *logic*.

      *   *Refining the GR connection:* The user mentioned the 1949 paper. This is crucial. Gödel's view on time (idealism) is actually a stronger bridge to immortality than the ontological proof. If time doesn't "flow," death isn't an end in the way we fear. I need to emphasize this.

      *   *Refining the "Theorem" claim:* Gödel didn't think he *proved* immortality mathematically. He thought it was a *consequence* of a rational metaphysics. The user's friend is right that it's not a theorem, but the user is right that Gödel saw it as a rational necessity.

      *   *Specific Citations:* Mention the Gibbs Lecture (1951), Hao Wang's *Reflections*, and the *Collected Works* Vol V.

  8.  **Final Review against constraints:**
