prompt: |-
  So Lewis's Humean account of objective chance runs into the famous 'problem of undermining futures': since the chances at a time are just whatever the best system says they are, and the best system gets picked by how well it fits the entire history of the world (future included), there's always some tiny chance the future unfolds in a way that would've made a different theory the best system instead. Lewis tried to patch this in 'Humean Supervenience Debugged' with what he calls the New Principal Principle. Can you argue that the patch doesnt actually work, and that undermining is a real, unfixable problem for Humean chance/laws rather than just an annoying technical wrinkle?
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** David Lewis's Humean account of objective chance (Best System Analysis - BSA).
      *   **Problem:** The "Problem of Undermining Futures" (PUF).
      *   **Lewis's Solution:** The "New Principal Principle" (NPP) in "Humean Supervenience Debugged" (1994).
      *   **Task:** Argue that the patch *doesn't* work and that undermining is a fundamental, unfixable problem for Humeanism, not just a technicality.

  2.  **Understand the Core Concepts:**
      *   **Humean Supervenience (HS):** Laws and chances supervene on the total mosaic of particular matters of fact (past, present, and future). There is no modal glue.
      *   **Best System Analysis (BSA):** Laws/chances are the axioms of the system that best balances simplicity, strength, and fit with the *entire* history of the world.
      *   **Undermining Futures:** Since the best system depends on the *whole* history, a future sequence of events could occur that makes a *different* system the best one. If the current chance function assigns a non-zero probability to that future, it assigns a non-zero probability to itself being false (because if that future happens, the current chance function wasn't the true one).
      *   **The Old Principal Principle (PP):** $Cr(A | E \land Ch(A)=x) = x$. (Credence in A given evidence E and chance x should be x). This breaks down if $Ch(A)=x$ implies $A$ cannot happen (because if $A$ happens, $Ch$ would have been $y$).
      *   **The New Principal Principle (NPP):** Lewis modifies the conditioning clause. Instead of conditioning on $Ch(A)=x$, we condition on the *history* $H_t$ and the *theory* $T_w$ that makes the chances what they are. Roughly: $Cr(A | H_t \land T_w) = Ch_{T_w}(A)$.

  3.  **Brainstorming Arguments Against the NPP/HS:**
      *   *Argument 1: Circularity/Epistemic Access.* To use the NPP, I need to know $T_w$ (the true theory of chance). But $T_w$ depends on the future. I can't know the future. So I can't know $T_w$. If I can't know $T_w$, the NPP is useless for guiding credence *now*.
      *   *Argument 2: The "Bug" isn't Debugged.* Lewis admits HS is false if undermining is possible. He tries to save the *spirit* of Humeanism while abandoning strict HS. But if the core motivation is supervenience on the actual mosaic, and the mosaic includes the future which determines the present chances, the metaphysical grounding is shaky.
      *   *Argument 3: Self-Undermining Chances.* Even with NPP, the chance function assigns probability to its own falsification. This seems rationally incoherent. A probability measure shouldn't assign positive mass to the event "I am not the probability measure."
      *   *Argument 4: Explanation vs. Description.* Humeanism wants laws to summarize. But if the summary depends on data points that haven't happened yet, it's not really a summary of *current* reality. It makes present chances ontologically dependent on the future.
      *   *Argument 5: Thau, Hall, and Hoefer's Criticisms.* Michael Thau (1994) and Ned Hall (1994) argued that the NPP is ad hoc. Christian Hoefer (2007) argues for "Humean Objective Chance" without Humean Supervenience, admitting the bug is fatal to HS.

  4.  **Structuring the Argument:**
      *   **Introduction:** Define BSA, Undermining, and the NPP. State the thesis: The NPP is an ad hoc patch that fails to resolve the deep metaphysical incoherence of Humean chance.
      *   **Point 1: Epistemic Inaccessibility.** The NPP requires conditioning on the true theory $T$. But $T$ is determined by the future. We can't know $T$. Therefore, the NPP cannot guide rational credence in practice.
      *   **Point 2: Metaphysical Dependence (The "Tail Wags the Dog").** Present chances depend on future events. This violates the intuitive direction of explanation and makes present modal facts hostage to future accidental facts.
      *   **Point 3: Rational Incoherence (Self-Undermining).** A chance function that assigns non-zero probability to its own non-existence is structurally flawed. The NPP hides this but doesn't fix the underlying probability space issue.
      *   **Point 4: Abandoning Humean Supervenience.** Lewis admits HS is false if undermining exists. If HS is the core of Humeanism, then Humeanism is false. The NPP saves the *principle* but kills the *metaphysics*.
      *   **Conclusion:** Summarize. Undermining shows that chance cannot be reduced to the mosaic in the way Lewis wants.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Refining Point 1:* Make sure to distinguish between $H_t$ (history up to t) and $T_w$ (the theory). Lewis says condition on $H_t$ and $T_w$. But we don't know $T_w$. We only have candidates. If we condition on candidates, we are back to square one.
      *   *Refining Point 2:* Focus on "ontological dependence." If the future changes, the present chance changes. This means present chance isn't intrinsic to the present/past.
      *   *Refining Point 3:* Use the term "self-undermining." If $Ch(P) > 0$ and $P$ implies $Ch \neq Ch$, then $Ch$ assigns probability to its own falsity. The NPP says "ignore that," but doesn't explain *why* it's okay.
      *   *Refining Point 4:* Lewis's concession. In "Debugged," Lewis says HS is contingent. If undermining is possible, HS is false. So the "fix" is actually a surrender.

  6.  **Final Polish:** Check tone (philosophical, rigorous but accessible). Ensure Lewis's specific terminology ($H_t$, $T_w$, $Ch$) is used correctly. Ensure the distinction between the *Principal Principle* (normative link) and *Best System Analysis* (metaphysical account) is clear. The prompt asks to argue the patch doesn't work *and* that it's an unfixable problem.

      *(Self-Correction during drafting)*: I need to be careful not to just say "it's hard to know." The problem is deeper. It's that the *truth conditions* for chance statements are unsettled until the end of time. The NPP tries to fix the *normative* link (credence), but the *metaphysical* link (what chance *is*) remains broken. I should emphasize that distinction.

  7.  **Final Review against Prompt:**
      *   Argue patch doesn't work? Yes.
