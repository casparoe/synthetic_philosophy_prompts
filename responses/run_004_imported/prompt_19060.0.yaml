answer: |-
  David Lewis's Best System Analysis (BSA) of laws and chance is one of the most elegant reductions in modern metaphysics. It promises to ground modal facts (laws, chances) in the non-modal "Humean Mosaic" of particular matters of fact. However, the **Problem of Undermining Futures** threatens to collapse the entire structure.

  Lewis recognized that if chances supervene on the *entire* history of the world (including the future), then the present chance function assigns a non-zero probability to a future that would make that very chance function false. In "Humean Supervenience Debugged" (1994), Lewis attempted to salvage the account by replacing the Original Principal Principle (PP) with the **New Principal Principle (NPP)**.

  I will argue that the NPP is merely a formal bandage that fails to address the metaphysical hemorrhage. The problem of undermining is not a technical wrinkle; it demonstrates that Humean chance is metaphysically incoherent, epistemically inaccessible, and rationally self-undermining. The NPP saves the normative link between chance and credence only by sacrificing the core Humean metaphysical claim.

  ### 1. The Epistemic Impotence of the New Principal Principle

  The Original Principal Principle (PP) states that your credence in an event $A$, given that the objective chance of $A$ is $x$, should be $x$.
  $$Cr(A \mid Ch(A)=x) = x$$

  Undermining breaks this because $Ch(A)=x$ might entail that certain futures (undermining futures) do not occur. If you condition on $Ch(A)=x$, you are implicitly conditioning against the undermining future, so your credence shouldn't match the chance $x$ (which includes the undermining future as a possibility).

  Lewis's fix, the NPP, changes the conditioning clause. Instead of conditioning on the proposition that the chance is $x$, we condition on the **history up to time $t$ ($H_t$)** and the **true theory of chance ($T_w$)**:
  $$Cr(A \mid H_t \land T_w) = Ch_{T_w}(A)$$

  **The Argument:** This patch renders the principle epistemically useless.
  To use the NPP to guide my current credences, I must condition on $T_w$. But on the Humean view, $T_w$ is the Best System for the *entire* history of the world, including the future. Since I do not know the future, **I cannot know $T_w$.**

  I can only know candidate theories ($T_1, T_2, \dots$) based on the past and present. But if I condition on a candidate theory $T_i$, I am back to the original problem: $T_i$ might be undermined by the future. If I cannot condition on the *true* $T_w$, the NPP provides no guidance for actual agents. It defines rational credence in terms of information (the true global theory) that is metaphysically determined but epistemically inaccessible until the end of time. A principle of rationality that cannot be applied by rational agents is not a solution; it is a retreat into formalism.

  ### 2. Metaphysical Dependence: The Tail Wags the Dog

  The deeper issue is not normative (how we should believe) but metaphysical (what chance *is*). Humeanism is motivated by the idea that laws and chances supervene on local, particular facts. There should be no "modal glue."

  Undermining reveals that, on the BSA, **present chances ontologically depend on future accidents.**
  Consider a coin toss today. On the BSA, whether this toss has a 50% chance or a 60% chance depends on whether the Best System fits the *entire* timeline. If a long run of heads occurs in the year 3000, the Best System might shift from a probabilistic theory to a deterministic one (or a different probabilistic one).

  This means the objective chance of the coin toss *right now* is not fixed by the current state of the coin, the launcher, or the past history. It is fixed by events that have not happened yet.
  *   **The Problem:** This violates the intuitive direction of explanation. We think the laws/chances govern the future, not that the future constitutes the present chances.
  *   **The Humean Cost:** If present modal facts depend on future particular facts, Humeanism loses its claim to be a reduction of the modal to the non-modal in any robust sense. It makes present reality "gappy" or indeterminate until the universe ends. The NPP does not fix this; it merely tells us how to calculate credences *assuming* we knew the future-determined theory. It leaves the metaphysical absurdity intact.

  ### 3. Rational Incoherence: Self-Undermining Probabilities

  Even if we accept the NPP, the underlying probability space remains structurally defective.
  In a standard probability space, the measure should be defined over a set of possibilities. On the Humean account, the "possibilities" include futures that undermine the very measure assigning them probability.

  Let $U$ be the proposition that an undermining future occurs.
  1.  The current chance function $Ch$ assigns $Ch(U) > 0$.
  2.  If $U$ occurs, the true chance function is not $Ch$, but $Ch^*$.
  3.  Therefore, $Ch$ assigns positive probability to the proposition **"Ch is not the true chance function."**

  This is a form of **probabilistic self-refutation**. A coherent objective chance function should not assign positive weight to its own falsification. It implies that the "true" chance function is, by its own lights, unlikely to be the true chance function.

  Lewis's NPP tries to sidestep this by telling us not to condition on $Ch(A)=x$ directly. But this is like a captain telling the crew, "Don't look at the fact that the ship is sinking; just look at the navigation charts." The NPP manages the *credence* of the agent, but it does not fix the *ontology* of the chance. The chance function remains a entity that probabilistically predicts its own non-existence. This suggests that the BSA is not capturing the concept of "objective chance" at all, but rather a different logical relation that happens to look like chance until an undermining future arrives.

  ### 4. The Surrender of Humean Supervenience

  The most damning evidence that the patch fails is Lewis's own concession. In "Debugged," Lewis admits:
  > "Humean Supervenience is false... if there are undermining futures."

  He attempts to save the *spirit* of Humeanism (the BSA and the Principal Principle) while abandoning the *letter* of Humean Supervenience (the claim that everything supervenes on the present and past arrangement of qualities).

  **The Argument:** If the core motivation for Humeanism is to avoid modal primitives and ground everything in the local mosaic, admitting that HS is false is admitting defeat.
  *   If HS is false, then there are modal facts (about which system is best) that do not supervene on the actual mosaic in the way Lewis originally claimed (because the mosaic includes the future, making present facts dependent on them).
  *   By adopting the NPP, Lewis effectively decouples chance from strict supervenience on the *actual* history in favor of a relation that holds across possible histories.
  *   Critics like Michael Thau and Ned Hall argued that this move is *ad hoc*. It preserves the equations while abandoning the metaphysical grounding that gave them meaning.

  If the "debugging" requires abandoning the central thesis of the metaphysical system (Supervenience), then the bug was not in the code; it was in the architecture. The problem of undermining shows that you cannot define present chances by a global optimization procedure that includes the future without creating circular dependencies.

  ### Conclusion

  Lewis's New Principal Principle is a sophisticated maneuver that saves the *normative* connection between chance and credence from logical contradiction, but it does so at the cost of rendering the principle epistemically inaccessible and leaving the metaphysics in ruins.

  1.  **Epistemically:** We cannot use the NPP because we cannot know the true theory $T_w$.
  2.  **Metaphysically:** Present chances remain dependent on future events, violating the Humean ideal of local determination.
  3.  **Structurally:** The chance function remains self-undermining, assigning probability to its own falsity.

  The problem of undermining is not a technical glitch that can be patched by redefining the conditioning clause. It is a proof that **objective chance cannot be reduced to the Best System of the Humean Mosaic.** If chances are real, they must be fixed by the present and past (as propensity theorists argue) or be primitive modal facts (as Armstrong or Swoyer argue). Lewis's attempt to have chance supervene on the whole history inevitably makes the present hostage to the future, a cost too high for a metaphysics claiming to be grounded in particular matters of fact. The NPP doesn't fix the bug; it just hides the error message.
