answer: |-
  You are wrong, but don't feel bad—this is one of the most common conceptual stumbling blocks in game theory. It feels like busywork because in many simple 2x2 games, mixed strategies don't add anything new. However, in larger games, **a pure strategy can be strictly dominated by a mixed strategy even if it is not dominated by any other pure strategy.**

  Your intuition ("if nothing pure beats it, it must be a best response to some belief") is the specific thing that fails.

  Here is the minimal example you asked for, followed by the explanation of why your best-response intuition breaks down.

  ### The Minimal Counterexample (3x2 Game)

  Consider a game where Player 1 (Row) has three strategies: **Top (T)**, **Middle (M)**, **Bottom (B)**. Player 2 (Column) has two strategies: **Left (L)** and **Right (R)**.

  We only need to look at Player 1's payoffs to check for dominance.

  | | **L** | **R** |
  | :--- | :---: | :---: |
  | **T** | 4 | 0 |
  | **M** | 1 | 1 |
  | **B** | 0 | 4 |

  #### 1. Check for Pure Strategy Dominance
  Does **T** strictly dominate **M**?
  *   If Player 2 plays **L**: $4 > 1$ (Yes)
  *   If Player 2 plays **R**: $0 < 1$ (No)
  *   **Result:** No.

  Does **B** strictly dominate **M**?
  *   If Player 2 plays **L**: $0 < 1$ (No)
  *   If Player 2 plays **R**: $4 > 1$ (Yes)
  *   **Result:** No.

  If you stop here (checking only pure strategies), **M survives elimination.**

  #### 2. Check for Mixed Strategy Dominance
  Now, consider a mixed strategy $\sigma$ where Player 1 plays **T** with probability $0.5$ and **B** with probability $0.5$.

  *   **Expected payoff against L:** $0.5(4) + 0.5(0) = \mathbf{2}$
  *   **Expected payoff against R:** $0.5(0) + 0.5(4) = \mathbf{2}$

  Compare this to playing **M** (which yields a payoff of **1** regardless of what Player 2 does):
  *   Against **L**: $2 > 1$
  *   Against **R**: $2 > 1$

  **Result:** The mixed strategy $\sigma = (0.5T, 0.5B)$ **strictly dominates** the pure strategy **M**.

  If you perform IESDS correctly (allowing mixed strategies), **M is eliminated.** If you only check pure strategies, you keep **M**. These are different answers.

  ---

  ### Why Your "Best Response" Intuition Failed

  You wrote:
  > *"Seems like if nothing pure beats it, the strategy is still 'safe' in the sense that it could be a best response to some belief..."*

  This is the core misconception. There is a fundamental theorem in game theory:

  > **A strategy is strictly dominated (by pure or mixed strategies) if and only if it is NEVER a best response to any belief.**

  In the example above, let's test your intuition. Let $p$ be Player 1's belief that Player 2 will play **L** (so $1-p$ is the probability of **R**).

  *   Expected Utility of **T**: $4p + 0(1-p) = 4p$
  *   Expected Utility of **B**: $0p + 4(1-p) = 4 - 4p$
  *   Expected Utility of **M**: $1p + 1(1-p) = 1$

  For **M** to be a best response, it must yield a payoff at least as high as **T** *and* **B**:
  1.  $1 \geq 4p \implies p \leq 0.25$
  2.  $1 \geq 4 - 4p \implies 4p \geq 3 \implies p \geq 0.75$

  There is no probability $p$ that satisfies both $p \leq 0.25$ and $p \geq 0.75$. **M is never a best response.**

  ### The Logic
  Pure strategies are "rigid." In the example, **T** is great against **L** but terrible against **R**. **B** is the opposite. **M** is mediocre against both.

  Your intuition assumed that if **T** doesn't beat **M** everywhere, and **B** doesn't beat **M** everywhere, then **M** must have some niche where it wins.

  But mixed strategies allow you to **hedge**. By mixing **T** and **B**, you smooth out the payoffs. You sacrifice the peak payoff of 4 to raise the minimum payoff from 0 to 2. Because 2 is strictly greater than 1 (the payoff of **M**), the mixture beats **M** in every scenario.

  ### Why This Matters for Your Prelim
  1.  **Rationalizability:** IESDS is the algorithm for finding rationalizable strategies. If you don't check mixed strategies, you will identify strategies as "rationalizable" that are actually irrational (because they are never best responses).
  2.  **Nash Equilibrium:** Any strategy that is strictly dominated (even by a mix) cannot be part of a Nash Equilibrium. If you fail to eliminate **M** in the example above, you might waste time looking for an NE where Player 1 plays **M**, which doesn't exist.
  3.  **Definition:** In advanced game theory (the level of a prelim), "Strict Dominance" implicitly allows domination by mixed strategies unless explicitly stated otherwise.

  **Summary:** It is not busywork. Checking for mixed dominance is the only way to ensure you are eliminating strategies that are truly irrational (never best responses). In 2x2 games, mixed dominance rarely eliminates new pure strategies, which is likely why you haven't seen it bite you until now. In 3x2 (or larger) games, it is crucial.
