prompt: |-
  Schopenhauer's theory of music is oddly specific: he thinks music, unlike the other arts, is a direct copy of the Will itself rather than of the Platonic Ideas, and part of how he cashes this out is through tonal harmony -- like how a melody's dissonances and their delayed resolution back to the keynote are supposed to mirror desire and its (temporary) satisfaction, with suspensions standing in for prolonged longing before the payoff. That whole account leans pretty hard on there being a home key to resolve to. So what do you think he would of made of Schoenberg's atonal and twelve-tone music, which basically does away with a tonal center altogether? Would he have just said it fails to count as "true" music by his own criteria, or is there a plausible way to stretch his framework to fit it? Give me your actual best guess at his verdict and why, reasoning from his own premises rather than just listing options.
