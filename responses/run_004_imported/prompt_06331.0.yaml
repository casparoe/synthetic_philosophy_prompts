  **Move (1): Nora (Score: 1)**
  Nora correctly articulates the standard theoretical justification for surrogate goals: shifting the focal point of extraction to a low-cost variable. However, the claim that this gets deterrence "for free" is optimistic, as it glosses over the significant costs of establishing and maintaining the commitment mechanism itself.

  **Move (2): Theo (Score: 1)**
  Theo correctly identifies the crux of the problem: time-consistency and credible commitment are the actual bottlenecks, not the labeling of the goal. However, his claim that the surrogate adds *nothing* is too strong, as it ignores the structural changes to the signaling game that Nora highlights in her rebuttal.

  **Move (3): Nora (Score: 2)**
  Nora successfully patches the hole in her initial argument by noting that surrogates solve the signaling problem better than pure stubbornness. Making a cheap payment verifiable is genuinely easier to credibly commit to than promising infinite resistance, giving the surrogate distinct strategic value beyond mere relabeling.

  **Move (4): Theo (Score: 2)**
  Theo lands the strongest blow by identifying a fundamental boundary condition: the defense fails against adversaries who derive utility specifically from the destruction of your real goals rather than resource extraction. Once this class of threatener is accounted for, the surrogate strategy loses its universal applicability.

  **What They're Overlooking**
  Both students are treating the threatener's strategy as static, but in an acausal or highly sophisticated context, this is an arms race. If surrogate goals become a known defense, rational threateners will precommit to ignoring them (as Theo hints), but doing so is also a commitment problem for the *threatener* because it reduces their potential extractable value. They are overlooking the co-evolutionary equilibrium: the effectiveness of surrogates depends on whether it is costly for threateners to verify and bypass them, turning the situation into a bargaining game over decision algorithms rather than a one-shot defense. Additionally, they haven't addressed the risk of "surrogate drift," where optimizing for the surrogate goal inadvertently corrupts the agent's value system over time.
