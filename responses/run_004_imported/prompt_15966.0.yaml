answer: |-
  **Title:** The Metric of Truth: Defending Accuracy-First Pluralism

  The trajectory of formal epistemology over the last three decades can be read as a struggle to liberate Bayesian norms from pragmatic encumbrance. The Dutch Book arguments, while elegant, always carried a whiff of prudentialism: be coherent or lose money. Jim Joyce's 1998 accuracy-dominance argument promised to cut that tether. By showing that incoherent credence functions are accuracy-dominated by coherent ones, Joyce offered a justification for probabilism rooted solely in the epistemic goal of representing the world accurately. As you noted, the technical machinery was later refined by Predd et al. (2009), shifting the burden from Joyce's specific axioms to the requirement of strict propriety. Under any strictly proper scoring rule, the coherent credences are undominated.

  However, this technical victory has spawned a philosophical unease. While probabilism is invariant across all strictly proper scoring rules, the further normative edifice accuracy-firsters wish to build—norms regarding extremity, conditionalization, and the permissibility of dogmatism—is not. The logarithmic scoring rule demands adherence to something like Cromwell's Rule (never assign 0 or 1), while the Brier score permits it. If the "correct" epistemic norms depend on which scoring rule we select, and if that selection is not dictated by the mathematics itself, does the accuracy-first program collapse back into a form of pragmatism? Does the pluralism of scoring rules reveal that "accuracy" is too thin a concept to ground epistemic rationality?

  I argue that it does not. The residual pluralism among legitimate scoring rules does not undermine the accuracy-first claim to provide a purely alethic foundation for Bayesianism. On the contrary, acknowledging this pluralism strengthens the program by clarifying that epistemic rationality is not monolithic. The invariance of probabilism is sufficient to secure the foundational claim, while the variance in further norms reflects legitimate, non-pragmatic trade-offs between competing alethic values. The accuracy-first approach succeeds because it isolates the structural requirements of truth-tracking (probabilism) from the axiological choices regarding *how* one values truth versus error avoidance.

  To see why the foundation holds, we must distinguish between the *structural* constraints on belief and the *axiological* weights we assign to accuracy. The crowning achievement of the Joyce-Predd line of argument is the invariance of probabilism. Regardless of whether one adopts the Brier, logarithmic, or spherical score, the set of undominated credence functions is exactly the set of probability functions. This is not a trivial result. It demonstrates that the probability axioms are not merely rules for avoiding monetary loss or logical embarrassment; they are the necessary conditions for minimizing expected inaccuracy relative to *any* reasonable measure of distance from the truth. This secures the "purely alethic" claim for the core of Bayesianism. If the goal is to show that coherence is required by the nature of truth-representation alone, the job is done. The fact that different metrics agree on the geometry of coherence suggests that coherence is a robust feature of the epistemic landscape, not an artifact of a specific metric.

  The worry arises when we move beyond coherence to questions like: *How confident should I be?* or *How should I update?* Here, the scoring rules diverge. The logarithmic rule penalizes false certainty infinitely; the Brier rule penalizes it finitely. Critics argue that if accuracy is *the* fundamental epistemic value, there should be a single "true" distance to the truth. Pluralism suggests that accuracy is under-described, forcing the agent to make a choice that looks suspiciously pragmatic: "Do I want to avoid massive error (Brier) or do I want to maximize potential reward for being right (Log)?"

  This objection, however, rests on a false conception of alethic value. It assumes that "accuracy" is a unidimensional magnitude like length in meters. But epistemic value is more akin to a vector space with multiple dimensions. Consider the trade-off between *truth-seeking* and *error-avoidance*. A scoring rule like the logarithmic score is highly sensitive to the informativeness of a true belief; it rewards high confidence in truths significantly more than the Brier score does. Conversely, the Brier score is more conservative, prioritizing the avoidance of catastrophic error over the maximization of informativeness.

  Crucially, both of these are *alethic* concerns. Caring about being highly confident when right is not a pragmatic concern about utility; it is a concern about the strength of one's grasp on the truth. Caring about avoiding false certainty is not a pragmatic concern about safety; it is a concern about the severity of one's distortion of reality. When an agent chooses a scoring rule (or when a theorist recommends one), they are not importing pragmatic values; they are specifying which alethic values take precedence. Therefore, the variation in norms regarding extremity or updating does not signal a retreat to pragmatism. It signals a recognition that there are multiple, equally legitimate ways to prioritize truth and falsity. The foundation remains alethic because the currency of the trade-off is still accuracy, merely weighted differently.

  The most formidable objection to this position is the **Uniqueness Objection**. It runs as follows: If epistemology is normative, it must tell us what we *ought* to believe. If the "ought" depends on an arbitrary choice of scoring rule, then accuracy-first epistemology fails to deliver a unique verdict on rationality. If I can choose the Brier score to justify dogmatism or the Log score to justify humility, haven't I just made epistemic rationality a matter of taste? If there is no "One True Metric," then "accuracy" is an empty placeholder, and the claim to have found a non-pragmatic foundation is illusory.

  This objection fails because it conflates *fundamentality* with *uniqueness*. A foundation can be fundamental without being uniquely prescriptive of every downstream norm. In ethics, one might argue that "well-being" is the fundamental value, yet disagree on whether well-being is constituted by hedonic pleasure or eudaimonic fulfillment. This pluralism does not refute the claim that morality is grounded in well-being; it refines it. Similarly, in geometry, there is no single "true" distance metric independent of context. Euclidean distance is not "more true" than Manhattan distance; they measure distance relative to different structural constraints.

  The accuracy-firster can concede that there is no context-independent "One True Metric" of accuracy without conceding that the choice of metric is pragmatic. The choice is constrained by the nature of the epistemic task. If the goal is scientific theorizing where false certainty leads to dead ends, the logarithmic score (enforcing humility) may be the appropriate alethic standard. If the goal is rapid decision-making under pressure where some error is tolerable but hesitation is costly, a different weighting might apply. The key is that these justifications remain internal to the epistemic domain. They appeal to the nature of truth, evidence, and belief, not to the agent's bank account or practical goals.

  Furthermore, the Uniqueness Objection sets a bar that no epistemic theory can clear. Even objective chance frequencies require a choice of topology to define "closeness." If the demand for a unique metric renders the theory vacuous, then *no* accuracy-based theory is possible. The accuracy-first program should not be judged on its ability to eliminate all axiological discretion, but on its ability to constrain that discretion within alethic bounds. It succeeds here. It rules out improper rules (which encourage lying about one's credences). It rules out incoherent credences (which are dominated). It forces the debate about extremity and updating to be framed in terms of truth-and-falsity weights, rather than pragmatic utility.

  In conclusion, the pluralism of strictly proper scoring rules is not a bug in the accuracy-first program; it is a feature that saves it from dogmatism. The core claim—that probabilism is required by the nature of accuracy alone—stands firm because it is invariant across the plurality. The further norms regarding how we manage risk and extremity vary because epistemic value itself is nuanced, involving trade-offs between different ways of respecting the truth. As long as those trade-offs are motivated by alethic concerns (informativeness vs. security) rather than pragmatic ones (money vs. truth), the foundation remains purely epistemic. We need not choose between a monolithic, mythical "True Metric" and a pragmatic collapse. We can accept a pluralistic alethic foundation where probabilism is the invariant bedrock, and the rest is a legitimate debate about how best to honor the truth.
