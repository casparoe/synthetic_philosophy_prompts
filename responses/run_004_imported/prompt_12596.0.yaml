  Here is a joke designed specifically for a metaethics seminar. It avoids the generic "caveman" tropes and targets the specific tension between *adaptive fitness* and *epistemic soundness* that readers of Street, Joyce, and Wielenberg will recognize immediately.

  **Slide Title:** The Debunker’s Dilemma

  **Slide Text:**
  Sharon Street argues that natural selection shaped our moral beliefs for **adaptive fitness**, not **independent truth**.

  But if evolutionary origins debunk moral tracking, they should debunk logical tracking too.

  So, if you find this argument compelling...

  Don't assume it's *sound*.

  Assume you're *fit*.

  ***

  **Speaker Notes (for your verbal intro):**
  "Good morning. I thought we'd start with a light warm-up. We all know the Street-style move: if evolution shaped our beliefs for survival rather than truth-tracking, our moral convictions are on shaky ground. But the obvious counter-move is that the reasoning used to reach that conclusion is subject to the same evolutionary pressures. So, looking around the room... if you nod at this slide, it doesn't necessarily mean you've grasped a metaphysical truth. It just means your ancestors were very good at surviving seminars."
