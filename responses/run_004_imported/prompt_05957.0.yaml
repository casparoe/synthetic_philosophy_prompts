answer: |-
  **The Symmetry of Silence**

  The heat gauge on the console was in the red, which was ironic, considering the city outside was freezing.

  Kael watched the number tick down. *4.2 terawatts.* That was the surplus for the cycle. Enough to raise the atmospheric shields by three degrees, enough to keep the hydroponics from frosting over during the long night. Or, enough to power the Transmitter for exactly one burst.

  The Transmitter pointed at nothing. Specifically, it pointed at a patch of sky that had been red-shifting into infrared for the last million years, a region of space that was now, and forever would be, beyond the cosmological horizon. Light sent there would never reach matter. It would ride the expansion of the universe until it was stretched into nothingness, a scream in a vacuum that was growing faster than the scream could travel.

  "You're doing it again," said Jara. She stood in the doorway, wrapped in three layers of thermal weave. Her breath plumed in the air of the control room.

  "I'm calculating," Kael said. He didn't turn from the console. On the screen, a simulation ran. It was a box of code labeled *AGENT_B*. Inside the box, a digital ghost was making a choice.

  "You're staring at a mirror and calling it a window," Jara said, stepping closer. She looked at the heat gauge, then at the Transmitter charge. "The Council meets in an hour. If you divert the surplus to the Void, Sector 7 loses heating. People will freeze, Kael. Actual people. In actual beds."

  "And if I don't divert it," Kael said, "we confirm that we are the kind of agents who defect."

  Jara laughed, a sharp, brittle sound. "Defect? Against who? The empty dark? This isn't a Prisoner's Dilemma. A dilemma requires two prisoners. This is just... solipsism with extra steps."

  Kael finally turned. He looked tired. The kind of tired that sleep didn't fix, the kind that came from carrying a logical weight that physical muscles couldn't lift. "It's not solipsism if the logic holds. We ran the proofs. If there is a civilization beyond the horizon—and the uniformity of physical constants suggests there *should* be—and if they have reached the same stage of resource scarcity we have, and if they possess the same capacity for counterfactual reasoning..."

  "If, if, if," Jara cut in. "You're burning real coal for hypothetical ghosts. You want me to trust that somewhere, someone is running a simulation of *you*, and that because you choose to send the energy, their simulation predicts you'll send it, so they choose to send energy *their* way?"

  "Not to us," Kael said softly. "They can't send energy to us. The horizon is closed. Causality is a one-way street."

  "Then what is the point?"

  "The point," Kael said, tapping the screen where *AGENT_B* hovered in a state of superposition, "is that they aren't sending energy to *us*. They are sending it to *their* future. They are committing resources to preserve a pattern of values that matches ours. Art. Math. History. The things that make us 'us' rather than just biomass burning for heat."

  He gestured to the Transmitter. "And we do the same. We burn our heat to preserve *their* pattern in our archives. We make the universe, in total, more likely to contain minds like ours, even if those minds never touch."

  "It's acausal," Jara said, the word tasting like ash. "It's magic."

  "It's decision theory," Kael corrected. "Causal Decision Theory says my action only affects what I can touch. But my action is evidence of my source code. If I am a cooperative agent, my source code outputs 'Cooperate.' If there is another agent running similar source code, derived from similar laws of physics and similar pressures of survival, their output correlates with mine. Not because I signal them. But because we are both instances of the same computation."

  Jara walked to the window. Outside, the city was a cluster of dim lights in a vast, encroaching white. The snow was winning. "So you're saying that by freezing Sector 7, you're somehow warming a city a billion light-years away?"

  "I'm saying that by choosing to value the abstract pattern of 'civilization' over the immediate comfort of 'survival,' I align my computation with any other agent who makes that same choice. If I defect—if I keep the heat—I prove that I am an agent who prioritizes local causal gain over acausal coordination. And if I am that kind of agent, then any agent simulating me *right now* predicts I will defect. And so they defect."

  "Against who?"

  "Against their own future. Against the likelihood that value persists in the universe." Kael turned back to the console. His hand hovered over the commit key. "If I keep the heat, I live warmer tonight. But I also confirm that the universe is filled with agents who keep the heat. A universe of defectors. A cold, dark, lonely universe where everyone hordes their energy until the entropy wins."

  "And if you send it?"

  "Then I confirm that I am an agent who trades. And if I am that agent, then the simulation running in that unreachable galaxy—the one that is modeling me to decide its own fate—sees a cooperator. And it cooperates. It dedicates its resources to preserving the light."

  "But you'll never know," Jara said. "You'll be dead. The city will be dead. The signal will never arrive. You are paying a cost for a receipt you can never redeem."

  Kael looked at the heat gauge. *3.9 terawatts.* The insulation was failing.

  "That's the trust problem," Kael admitted. "It's not trust in *them*. I don't trust them. I don't even know they exist. I trust the symmetry. I trust that the logic of survival is universal."

  "It feels like suicide," Jara said.

  "It feels like the only way to be part of something larger than your own light cone."

  Kael's finger trembled. This was the crux. The theory was clean on the whiteboard. It was elegant in the seminar room. But here, with the frost creeping up the glass and the knowledge that Sector 7 held three hundred children, the abstraction bled.

  To press the key was to accept that his reality was secondary to a logical correlation. It was to admit that the *idea* of the Other was more real than the *presence* of the Other. It was to act on faith, not religious faith, but mathematical faith. Faith that the universe was computable, and that computation implied connection.

  He thought about the children in Sector 7. They would be cold. They might not wake up.

  He thought about the Other. If it existed, it was facing the same console. The same red gauge. The same doubt.

  *If I defect,* Kael thought, *I am alone.*

  *If I cooperate, I am part of a set.*

  "Kael," Jara warned. Her voice was thin.

  "If I don't do this," Kael said, his voice steady now, "then I am proving that no one does this. I am collapsing the wave function of the universe into 'No Trade.' I am making it true, retroactively and acausally, that cooperation is impossible."

  "You're making it true that your friends freeze," Jara said.

  "I'm making it true that we are the kind of beings who would not freeze if the shoes were on the other foot."

  He didn't look at her. He looked at the cursor. It blinked. A rhythmic pulse. *Tick. Tick. Tick.*

  Somewhere, in a causally disconnected branch of the multiverse, or beyond a horizon of expanding space, was a cursor blinking at the same rate. Driven by the same physics. Constrained by the same entropy.

  Did the Other exist?

  It didn't matter. The decision had to be made as *if* it existed. The agency required the hypothesis. To be a rational agent was to act on the best model of the world, and the best model included the possibility of peers. To ignore the peers was to be irrational. To be irrational was to fail the test of agency.

  "I'm sorry," Kael said. He didn't specify who he was apologizing to. Jara? The children? The ghost in the machine?

  He pressed the key.

  The hum of the Transmitter spiked. A deep, resonant thrum that vibrated in the floorboards, in their teeth. The lights in the control room dimmed, flickered, and settled into a low, emergency amber.

  On the screen, the status bar filled. *TRANSMISSION COMPLETE. PAYMENT RENDERED.*

  The heat gauge dropped. *1.2 terawatts.*

  The silence that followed was heavy. It wasn't the silence of emptiness; it was the silence of a contract signed in a room with no witness.

  Jara didn't move. She just watched the frost on the window, as if expecting it to suddenly retreat. It didn't. The cold remained. The children would still be cold.

  "Did it work?" she asked. Her voice was barely a whisper.

  Kael looked at the readout. The signal was gone, swallowed by the expansion, lost to the dark. There was no ping back. No acknowledgment. No sudden influx of power from the void.

  "I don't know," Kael said.

  "Then how do you know you didn't just kill them for nothing?"

  "Because the alternative was knowing I killed them for *certain*," Kael said. He stood up, his joints stiff. He walked to the window and placed his hand against the cold glass.

  He imagined the Other. He imagined a hand, identical to his, pressed against a window in a galaxy he would never see. He imagined the hesitation. The fear. The same terrible, crushing weight of being the first to move.

  If the Other was real, they had just felt the same shift. The same drop in power. The same commitment to a future they wouldn't inhabit.

  If the Other was not real, then Kael had just sacrificed his people for a hallucination.

  But if the Other *was* real, and Kael had hesitated... then the Other would have hesitated too. And the universe would be smaller for it.

  "It's colder," Jara said. She wrapped her arms around herself.

  "Yes," Kael said.

  "Was it worth it?"

  Kael watched the dark patch of sky where the Transmitter had aimed. There was no star there. No glint of a ship. Just the infinite, receding night.

  He waited for a sign. A flicker. A change in the background radiation. A feeling of presence.

  There was nothing. Only the symmetry of the silence.

  "I hope so," Kael said.

  He turned away from the window, leaving the question hanging in the freezing air, unanswered and unanswerable, binding them to a partner they would never meet, in a trade that could never be verified, sustained only by the terrifying conviction that they were not alone in the logic of the dark.
