answer: |-
  This is a fantastic question that cuts to the heart of the coherence of Penal Substitutionary Atonement (PSA). The objection you're describing—that financial debt is transferable but penal liability is personal—is one of the strongest philosophical challenges to PSA. (A quick side note: while the famous analytic philosopher David Lewis wrote extensively on conventions and ethics, this specific argument is classically associated with **Hugo Grotius** and later **Immanuel Kant**, though it appears in many contemporary papers. If your seminar has a specific handout by a David Lewis, the argument itself is a staple of the literature regardless of the author.)

  You are asking whether Calvin's theology has the resources to answer this, or if it's a blind spot. The short answer is: **Calvin would not view this as a logical incoherence, but as a category error in the objection itself.** He would argue that the objection assumes a modern, liberal, individualistic view of justice that does not apply to Divine Covenantal law.

  Here is how Calvin would likely reconstruct the argument using his actual theology, specifically drawing from the *Institutes* (Book 2, Chapter 16; Book 3, Chapter 11) and his commentaries on Galatians and Isaiah.

  ### 1. The Objection Assumes "Atomic Individualism"
  The Lewis-style objection assumes that human beings are morally isolated units. In a modern secular court, I am me, and you are you; our moral liabilities cannot merge.

  Calvin's entire soteriology is built on **Covenantal Solidarity** (or Federal Headship). For Calvin, humanity is never morally isolated. We are either "in Adam" or "in Christ."
  *   **In Adam:** We are punished for a sin we did not personally commit (Genesis 3). If you accept that original guilt is transferable from Adam to us, you have already accepted that penal liability *can* be transferred within a covenantal headship.
  *   **In Christ:** The same logic applies in reverse. Christ is the "Second Adam."

  **Calvin's Comeback:** He would say the objection fails because it treats Christ as a "third-party volunteer" (a stranger paying for a stranger). For Calvin, Christ is not a stranger; He is the **Head of the Body**. In Calvin's legal framework, when the Head suffers, the Body is legally understood to have suffered. The transfer isn't mechanical; it's organic and legal simultaneously.

  ### 2. Divine Justice vs. Human Penal Codes
  The objection relies on an intuition about how *human* punishment works (e.g., five years in prison). It assumes there is a standard of "Justice" above God that even God must follow, which says "punishment must be inflicted on the offender."

  Calvin is a voluntarist regarding the *economy* of salvation. He believes God is the ultimate Judge (*Judex*), and the terms of satisfaction are set by the Judge, not the accused.
  *   In *Institutes* 2.16.10, Calvin argues that Christ's sacrifice was accepted by the Father not because it fit a pre-existing abstract rule of justice, but because **God appointed it.**
  *   Calvin uses the legal concept of *satisfactio* (satisfaction). In Roman law, a debt can be paid by a surety (*fidejussor*). Calvin argues that Christ acts as our Surety.

  **Calvin's Comeback:** He would argue that the "debt vs. punishment" distinction collapses at the Divine level. Sin incurs a *reatus poenae* (liability to punishment), but because God is the creditor *and* the judge, He can designate a Surety to bear that liability. If the Judge says, "This substitute satisfies the demand of justice," then logically, justice *is* satisfied. To say otherwise is to put human penal codes above Divine decree.

  ### 3. The Nature of the Punishment (Curse vs. Incapacitation)
  The objection often hinges on the idea that punishment is about incapacitating the offender or reforming them (which can't be done vicariously).

  Calvin defines the penalty of sin differently. It isn't primarily about "time served" or rehabilitation; it is about bearing the **Curse of God** (*maledictio*).
  *   In his Commentary on Galatians 3:13 ("Cursed is everyone who hangs on a tree"), Calvin emphasizes that Christ absorbed the *wrath* and *condemnation* that we deserved.
  *   Wrath is an objective relational status, not just a subjective feeling or a physical confinement.

  **Calvin's Comeback:** Bearing the "Curse" is transferable in a way that "prison time" is not. If I absorb the blow intended for you, you are no longer struck. If Christ absorbs the Divine Wrath intended for us, we are no longer under wrath. The "punishment" is the experiencing of God's alienation, which Christ genuinely experienced on the Cross ("My God, my God, why have you forsaken me?").

  ### 4. Mystical Union (*Unio Mystica*)
  This is Calvin's strongest philosophical resource, often overlooked in favor of his forensic language. For Calvin, Justification (the legal swap) is inseparable from Union with Christ.

  We do not receive the benefit of the substitution from a distance. Through the Spirit, we are united to Christ.
  *   **The Logic:** If I am united to Christ, and Christ is punished, then *in a real sense*, I have been punished.
  *   In *Institutes* 3.1, Calvin writes that we must understand that "as long as Christ remains outside of us, and we are separated from him, all that he has suffered and done for the salvation of the human race remains useless and of no value for us."

  **Calvin's Comeback:** The objection assumes a separation between the Substitute and the Beneficiary that Calvin explicitly denies. Because of the mystical union, the punishment is not *strictly* vicarious (in the place of); it is **participatory**. We died *in* Him. Therefore, the record is cleared not because a stranger served the time, but because we served the time *in the person of our Representative*.

  ### Is it a Blind Spot?
  To answer your specific worry: **No, it is not a blind spot.** Calvin was acutely aware of the "injustice" objection. He addresses it directly in *Institutes* 2.16.10-11, where he anticipates the critic asking, "Is it just for the innocent to be condemned?"

  His answer is twofold:
  1.  **Voluntary Assumption:** Christ was not a passive victim; He offered Himself (Isaiah 53:7). A voluntary surety changes the moral calculus.
  2.  **Divine Appointment:** It is not unjust if the Supreme Judge appoints the arrangement.

  However, a modern philosopher might say Calvin **begs the question**. He assumes the Covenantal/Forensic framework is true to prove the logic works. If you don't accept that God operates as a Covenant Judge who can appoint a Surety, the logic doesn't hold.

  ### Summary for your Seminar
  If you want to impress in the seminar, you can frame it like this:

  > "Calvin would argue that the 'Debt vs. Punishment' objection relies on a **retributive individualism** that is foreign to Biblical covenantal law. For Calvin, the transferability isn't based on the nature of punishment in abstract, but on the **ontological union** between the Head and the Body. The puzzle only exists if you view Christ as a third-party volunteer rather than the Covenant Head who legally incorporates his people into his own death. So, it's not that Calvin didn't see the problem; it's that his metaphysics of 'Union with Christ' dissolves the distinction between 'my punishment' and 'His punishment'."

  This shows you understand the analytic objection but can deploy Calvin's specific theological machinery (Federal Headship, Mystical Union, Divine Prerogative) to meet it.
