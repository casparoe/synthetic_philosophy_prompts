prompt: |-
  So I've been down a total rabbit hole for a piece on famous scientific feuds, and I can't stop thinking about Thomas Hobbes vs. John Wallis over geometry. Hobbes spent basically the last two decades of his life insisting he'd squared the circle, got his proofs shredded by Wallis over and over, and never once conceded he was wrong (there's a whole book just about this fight, I think it's Jesseph's "Squaring the Circle"). What I can't work out myself is how this connects to Hobbes's actual philosophy rather than him just being stubborn or bad at math. From what I gather he thought geometry was the one science humans could know with total certainty, precisely because we construct the figures ourselves, unlike natural bodies, whose real causes we didn't make and can only guess at. But his materialism also made him insist that a "point" and a "line" have to be actual, if very tiny, bodies, not the dimensionless, breadthless abstractions Euclid defines them as. Can you walk me through how those two commitments are actually linked, and make the case for why that specific combo -- not just garden variety stubborness -- is what set him up to botch the quadrature and then dig in for good instead of conceding an honest mistake?
