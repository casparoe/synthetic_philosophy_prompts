answer: |-
  You have hit on exactly the right nerve. If you treat the Hobbes-Wallis feud as merely a case of an aging philosopher suffering from Dunning-Kruger effect regarding mathematics, you miss the terrifying coherence of Hobbes's system. You are absolutely correct to lean on Douglas Jesseph's work (*Squaring the Circle: The War Between Hobbes and Wallis*); he is the definitive guide here.

  The short answer is: **Hobbes could not concede the mathematical error without dismantling the foundation of his entire political philosophy.**

  Here is the walkthrough of how his materialism, his epistemology of geometry, and his refusal to concede are locked together in a philosophical death grip.

  ### 1. Geometry as the Only True "Science"
  To understand why Hobbes dug in, you have to understand what geometry *was* to him. In *De Corpore* (1655), Hobbes lays out his system. He argues that human reasoning is essentially computation (adding and subtracting concepts).

  For Hobbes, there are two types of knowledge:
  1.  **Natural Philosophy (Physics):** We observe effects and guess at causes. Since God made nature, and we didn't, we can never be 100% certain of the causes. We can only hypothesize.
  2.  **Geometry (and Civil Philosophy):** We know these with absolute certainty. Why? **Because we construct the causes ourselves.** When we define a circle, we generate the idea. When we make a Commonwealth (in *Leviathan*), we are the architects of the sovereign.

  Therefore, Geometry is the paradigm of all certainty. If Geometry fails, the model for Political Science fails. If you can't have demonstrable certainty in geometry, you can't have demonstrable certainty in the necessity of absolute sovereignty. The stakes were not "who is good at math"; the stakes were "is scientific certainty possible for humans?"

  ### 2. The Materialist Definition of the Point
  This is the crux of your question. Euclid defines a point as "that which has no part" (dimensionless) and a line as "breadthless length."

  Hobbes, the arch-materialist, found this ontologically offensive.
  *   **The Problem:** In Hobbes's universe, *everything* is Body. "Substance" and "Body" are synonymous. A "dimensionless point" is essentially nothing. It is a privation.
  *   **Hobbes's Axiom:** Nothing cannot cause something. Motion cannot begin from a dimensionless point because a dimensionless point has no location in a material sense.
  *   **The Fix:** Hobbes redefined the point. For Hobbes, a point is a **physical body considered as small as possible**, but still having magnitude. A line is the **trace of a moving point**.

  This turns geometry into **kinematics** (the geometry of motion). A circle isn't a static abstraction; it is the path of a body rotating around a fixed body.

  ### 3. How This Botched the Quadrature
  When Hobbes attempted to square the circle, he wasn't trying to solve the problem as Wallis (and Euclid) understood it.
  *   **Wallis/Euclid:** Operate in abstract space. A line has no width. Infinity is a valid conceptual tool.
  *   **Hobbes:** Operates in physical space. A line has width (however minute). A "circle" is a physical disk.

  Hobbes's "proofs" often relied on manipulating physical magnitudes that Euclidean geometry treated as abstractions. For example, he would treat the circumference of a circle as if it were composed of tiny physical segments that could be straightened out. In standard math, this breaks because of the nature of curves vs. limits. In Hobbes's physics, it made sense because he believed he was measuring actual matter.

  When Wallis pointed out the error, he was pointing out that Hobbes was violating the axioms of Euclidean geometry. Hobbes's response was effectively: *"Euclid's axioms are physically false. My axioms describe reality. Therefore, my proof holds for real bodies, and your proof holds only for ghosts."*

  ### 4. Why He Could Never Concede
  This is where the stubbornness transforms into philosophical necessity.

  If Hobbes admits that Wallis is right and he is wrong about the circle, he has to admit one of the following:
  1.  **Dimensionless abstractions exist:** This violates his Materialism. If a point has no magnitude, then "Body" is not the fundamental substance of the universe.
  2.  **Geometry is not certain:** If the "science" we construct ourselves is prone to error, then the certainty he promised in *Leviathan* is an illusion.
  3.  **Reasoning is not Computation:** If his computational method yields false results in geometry, it yields false results in politics.

  For Hobbes, Wallis was not just a mathematician; Wallis was a "Divine" (Wallis was a Presbyterian clergyman and held a chair at Oxford). To Hobbes, the University system represented the "Kingdom of Darkness"—scholastic nonsense, dualism, and spiritualism that led to civil war.

  Wallis's abstract, algebraic mathematics smelled to Hobbes like Scholasticism. It dealt with symbols and abstractions rather than bodies and motion. Conceding to Wallis would mean conceding that the **Abstract** has power over the **Material**.

  ### 5. The "Scab of Symbols"
  There is a further layer: Hobbes hated Algebra. He called it a "scab of symbols." He believed that introducing symbols (like $x$ and $y$) detached reasoning from the physical objects they represented.

  Wallis was a pioneer of the very infinitesimal calculus and algebraic analysis that would eventually make Hobbes's geometric approach obsolete. Hobbes sensed this. He saw the new mathematics as a return to mysticism—manipulating signs without understanding the physical bodies they signified.

  So, when Hobbes refused to concede, he was making a stand for **Nominalism** and **Materialism**. He was insisting that truth must be grounded in physical bodies and clear definitions, not in the manipulation of abstract symbols that might yield "correct" answers but for the "wrong" (immaterial) reasons.

  ### Summary
  Hobbes wasn't just being stubborn; he was being **systemically consistent**.

  1.  **Epistemology:** Only what we construct can be known with certainty (Geometry/Politics).
  2.  **Ontology:** Only bodies exist (Materialism).
  3.  **Synthesis:** Therefore, Geometry must be the study of moving bodies, not dimensionless abstractions.
  4.  **The Conflict:** Wallis proved Hobbes wrong using the rules of dimensionless abstractions.
  5.  **The Trap:** To accept Wallis's proof, Hobbes would have to accept dimensionless abstractions.
  6.  **The Consequence:** Accepting dimensionless abstractions destroys his Materialism.
  7.  **The Fallout:** Destroying his Materialism destroys the scientific certainty of *Leviathan*.

  Hobbes chose to be the man who couldn't square the circle rather than the man whose political philosophy rested on a lie. In his mind, he was defending the possibility of Civil Science against a return to mystical scholasticism. He died defending the magnitude of the point because the magnitude of the Sovereign depended on it.
