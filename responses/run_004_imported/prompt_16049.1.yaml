answer: |-
  This is a sophisticated application of philosophical semantics to mechanistic interpretability. Your team's disagreement mirrors a classic tension in philosophy of mind: are representations defined by their current causal role (structural/functional) or their history (etiological)?

  Here is a comparison of Millikan's Teleosemantics and Dretske's Informational Semantics applied to gradient descent networks, followed by the Swampman analysis.

  ### 1. Extending to Gradient Descent: Modification Required

  **Dretske (Informational Semantics): Less Modification Required**
  Dretske's account ties content to a state-type being **recruited** to cause behavior because it reliably correlated with a condition during a **learning history**.
  *   **Fit:** This maps almost isomorphically to supervised learning or RL. The "learning history" is the training run. The "recruitment" is the optimization process (gradient descent) adjusting weights to minimize loss. The internal state (activation direction) acquires content because it was causally selected *during training* to correlate with specific inputs or outputs to drive the system toward a goal.
  *   **Modification:** You primarily need to formalize "recruitment" as weight updates driven by backpropagation. Dretske distinguishes between the *indication* relation (covariation) and the *representation* relation (indication + recruitment). In a neural network, the training phase locks the content. Once training stops, the network represents what it was recruited to represent, even if it later drifts or is deployed out-of-distribution. This requires very little conceptual stretching.

  **Millikan (Teleosemantics): More Modification Required**
  Millikan grounds content in the **Normal Explanation** of a trait's survival, derived from a history of **reproduction** and selection. A representation has content because past tokens of that representation were retained *because* they performed a function.
  *   **Fit:** This is trickier. Neural network weights are not "reproduced" in a biological lineage sense during training; they are *optimized*. While one can argue that the training process is a selection mechanism (weights that reduce loss are "retained" in the next epoch), Millikan's theory relies heavily on the distinction between the *mechanism* (which has a proper function) and its *performance*.
  *   **Modification:** To make this work, you must treat the *architecture* or the *training algorithm* as the reproducing entity, and the specific weights as the traits selected. However, in a single training run, there is no population of competing weight-sets reproducing over generations (unless you view stochastic gradient descent as a genetic algorithm, which is a stretch). You would need to modify Millikan's "reproduction" condition to mean "retention via optimization pressure" rather than lineage replication. This requires decoupling her theory from its biological evolutionary roots more significantly than Dretske's does.

  **Verdict:** **Dretske's view needs less modification.** His focus on the *individual system's learning history* (ontogeny) aligns directly with the training trajectory of a single model. Millikan's focus on *lineage and reproduction* (phylogeny) requires a metaphorical reinterpretation of what it means for a weight matrix to "reproduce" or have a "Normal Explanation" outside of a population context.

  ---

  ### 2. The Artificial Swampman Test

  Consider **Network $N_{trained}$** (standard training history) and **Network $N_{swamp}$** (randomly initialized to match $N_{trained}$'s weights exactly, with no training). Functionally, they are identical. Structurally, they are identical. Historically, they are opposites.

  **Would either account attribute content?**
  *   **Millikan:** **No.** For Millikan, content is constituted by *proper function*, and proper function is constituted by history. $N_{swamp}$'s weights were not retained *because* they worked; they appeared by chance. There is no "Normal Explanation" for why those weights exist other than statistical accident. Without a history of selection/retention, the internal states have no proper function, and thus no semantic content. They are merely causal levers.
  *   **Dretske:** **No.** For Dretske, content requires the *recruitment* phase. While $N_{swamp}$'s states *carry information* (they covary with inputs/outputs naturally), they were not *recruited* to do so. The causal link between the correlation and the system's usage was never established through learning. Dretske would classify $N_{swamp}$'s states as having **natural meaning** (like smoke means fire) but not **semantic content** (representation).

  **The Asymmetry Revealed**
  In biological examples, the Swampman case is a thought experiment where structure and history are inseparable (we assume molecular identity implies functional identity, but we stipulate historical absence). In AI, we can **empirically instantiate** Swampman. This reveals a critical asymmetry between the two theories regarding **Information vs. Function**:

  1.  **Dretske admits the Correlation, Denies the Semantics:**
      Dretske's theory acknowledges that $N_{swamp}$'s feature directions *do* reliably correlate with environmental conditions (they carry information). His theory creates a tension here: the *informational relation* holds, but the *semantic relation* fails due to lack of history.
      *   *Implication for Interpretability:* If your team follows Dretske, you can validate that a "feature direction" is a **real correlational pattern** (it carries information) without committing to it being a **representation**. This supports the skeptical view that you are finding patterns, but perhaps not "meanings."

  2.  **Millikan Denies the Function Entirely:**
      Millikan's theory does not care about the correlation in the absence of history. For Millikan, $N_{swamp}$'s feature directions are not even functional parts of the system in the relevant sense; they are broken mechanisms that happen to work.
      *   *Implication for Interpretability:* If your team follows Millikan, the lack of a clear selection story (e.g., if the feature emerged via a "lottery ticket" mechanism rather than explicit gradient pressure) could imply the feature **lacks functional reality**, not just semantic content.

  **The Crucial Divergence:**
  The AI Swampman case reveals that **Dretske is partially structuralist** (content requires information-carrying structure + history), whereas **Millikan is purely historicist** (content requires history, structure is secondary).

  In biology, we never encounter a system with the structure but without the history. In AI, we can. This exposes that Dretske's theory must do extra work to explain why the *information* present in $N_{swamp}$ doesn't count as content, whereas Millikan's theory simply bypasses the information question entirely. For your interpretability work, this suggests Dretske offers a finer-grained tool: it allows you to distinguish between **accidental correlations** (Swampman features) and **recruited representations** (Trained features), even if both are functionally identical at inference time. Millikan collapses both into "non-representations" if the selection history is ambiguous.

  ### Summary Recommendation
  For your specific context:
  1.  **Adopt Dretske** for a framework that requires less modification to fit gradient descent (Training = Recruitment).
  2.  Use the **Swampman distinction** to resolve your team's disagreement: You can agree that feature directions are **information-carrying states** (validating the interpretability work) without agreeing they are **semantic representations** (satisfying the skeptics) unless you can demonstrate they were specifically *recruited* for that role during training (e.g., via ablation or causal tracing showing the feature was necessary for the loss reduction). This moves the debate from metaphysics to empirical causality.
