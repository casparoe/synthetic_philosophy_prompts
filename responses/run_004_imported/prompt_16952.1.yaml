      *   *Contributory Injustice (Dotson):* Willful hermeneutical ignorance. The marginalized group *has* the concepts/resources. The dominant group *refuses* to use them or recognize them as valid. It's an active refusal, not a passive gap. Example: Indigenous knowledge ignored by colonial science.

