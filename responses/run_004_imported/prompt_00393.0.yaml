answer: |-
  This is one of the most common sticking points when reading Kripke's *Wittgenstein on Rules and Private Language*. Your intuition is shared by many philosophers: *"Sure, I can't compute infinity, but I mean addition. Why does my physical inability to compute a googolplex undermine the fact that I know what addition is?"*

  The short answer is that Kripke isn't arguing you lack the *ability* to compute large numbers. He is arguing that if meaning is constituted by dispositions, then for those large numbers, **there is no fact of the matter about what is correct.**

  Here is the breakdown of why finitude is a conceptual killer for dispositionalism, and how it ties into normativity.

  ### 1. The Dispositionalist Hope
  To see why finitude breaks it, we have to look at what the dispositionalist is trying to do. They want to naturalize meaning. They want to say:
  > "There is no spooky Platonic entity called 'Plus.' To mean Plus is just to be physically/psychologically configured such that when asked '68 + 57', you are disposed to answer '125'."

  This seems to solve the skepticism. We don't need to look into the past; we just look at your current brain state and how it reacts to stimuli.

  ### 2. The Finitude Objection: It's Not About "Doing," It's About "Being Defined"
  Your intuition is that the limit is **practical**. You're thinking: *"I can't compute $10^{100} + 10^{100}$ because I'd die first, but if I could, I'd do addition, not quus."*

  Kripke's point is that if meaning *is* dispositions, the limit is **constitutive**.

  Here is the scenario:
  1.  **The Function:** Addition is a function defined for *all* natural numbers. It has a value for $10^{100} + 10^{100}$.
  2.  **The Disposition:** You are a finite physical being. There is a number $N$ so large that if you tried to compute $N + N$, your brain would melt, or you would run out of time in the universe, or you would simply make a random guess.
  3.  **The Gap:** For any number larger than $N$, you have **no disposition**. You are not disposed to say the sum, because you are not disposed to say *anything* coherent (or anything at all).

  **The Problem:**
  If meaning is determined by dispositions, then for any input where you have no disposition, **the function you mean is undefined.**

  If dispositionalism is true, you do not mean *Addition*. You mean *Addition-For-Numbers-Smaller-Than-N-And-Undefined-Otherwise*.

  But that's not what you mean. You understand that "plus" has an answer for $10^{100} + 10^{100}$, even if you can't calculate it. You know there *is* a correct answer. Dispositionalism forces you to admit that for those huge numbers, there is no "correct" answer because there is no "disposed" answer. It turns a mathematical truth (the sum exists) into a biological contingency (my brain capacity).

  ### 3. The "Idealization" Trap
  The dispositionalist usually tries to patch this by saying: *"Okay, not my actual dispositions, but my **idealized** dispositions. What I **would** say if I had infinite time and brain power."*

  Kripke argues this begs the question.
  *   If I have a finite brain, there is no physical fact about what I *would* do with an infinite brain.
  *   To figure out what I *would* do, you have to extrapolate from what I *do* do.
  *   But we are back to the original skeptical problem! My past finite behavior is compatible with both **Plus** and **Quus**.
  *   So, when you idealize my dispositions, do you idealize them toward the **Plus** curve or the **Quus** curve?

  If you say "You idealize toward Plus," you are assuming I meant Plus to begin with to determine the idealization. You are using the meaning to fix the dispositions, rather than using the dispositions to fix the meaning.

  ### 4. Connecting to Normativity
  This is where the two complaints merge. The "Normativity" objection is often cited as the primary blow, but Finitude is the physical proof of it.

  **Normativity:** Meaning is normative. It tells you what you *ought* to say, not just what you *will* say.
  *   If I am tired and drunk, I might be disposed to say "2 + 2 = 5".
  *   Dispositionalism says: "Well, in that state, '+' means quus-like-function-that-outputs-5."
  *   But intuitively, I made a **mistake**. I meant Plus, but I failed to perform it.

  **How Finitude ties in:**
  Normativity requires a standard that exists independently of my performance.
  *   **Finitude shows:** My performance (dispositions) runs out.
  *   **Normativity requires:** The rule does *not* run out.

  If meaning were just dispositions, then when my dispositions run out (at the huge numbers), the rule would run out too. But the rule doesn't run out. Therefore, meaning cannot be just dispositions.

  ### Summary: Why it's not just a "Technicality"
  You asked if this is just a boring practical limitation. It would be a practical limitation if we were talking about **calculation ability**. But we are talking about **semantic content**.

  *   **Practical view:** "I can't calculate the big number, but I know what the rule is."
  *   **Dispositional view:** "If you can't calculate it (have no disposition for it), then there is no fact about what the rule is for that number."

  Kripke's argument is that Dispositionalism collapses the **truth conditions** of arithmetic into the **physical capacities** of the arithmetician. It implies that if humans were slightly smarter, we would mean a different function than we do now (one that extends further before becoming undefined).

  That is why it's a philosophical disaster rather than a technicality. It suggests that the content of our thoughts is held hostage by the structural limits of our biology, whereas our understanding of "plus" clearly transcends those limits. We grasp a rule that goes on forever, even if our ability to execute it does not. Dispositionalism cannot account for that "grasp."
