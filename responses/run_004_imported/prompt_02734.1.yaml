answer: |-
  This is a sharp observation, and you have correctly identified a tension that comes up frequently in decision theory circles. You are right that **I.J. Good's Theorem** (1967) mathematically proves that for a specific type of agent, the expected value of free information is non-negative.

  However, the reason rationalists still take **information hazards** seriously is that Good's Theorem relies on a set of idealized assumptions that human beings systematically violate. When rationalists discuss infohazards, they are usually pointing out exactly *where* and *why* those assumptions break down in the real world.

  Here is the breakdown of why Good's Theorem doesn't settle the debate, and why "deliberate ignorance" can be rational for humans.

  ### 1. The Assumptions of Good's Theorem
  Good's Theorem holds true only if the following conditions are met:
  1.  **Perfect Bayesianism:** The agent updates beliefs strictly according to Bayes' rule without bias or error.
  2.  **Costless Processing:** Acquiring and storing the information costs nothing (computationally or energetically).
  3.  **Utility over World-States:** The agent's utility function depends *only* on the state of the world and the actions taken, **not on the agent's internal state of knowledge.**
  4.  **Option to Ignore:** The agent can choose to act as if they never received the information if it turns out to be unhelpful.

  If any of these are violated, the expected value of information can become negative.

  ### 2. Violation: Utility Depends on Beliefs (The "Happiness" Factor)
  Good's Theorem assumes you care about *what happens*, not *what you know*.
  *   **Ideal Agent:** Cares only that their spouse is faithful.
  *   **Human Agent:** Cares that their spouse is faithful **AND** that they feel secure and happy.

  If your utility function includes "peace of mind" or "hope" as a terminal value, then learning a painful truth can directly reduce your utility, even if the physical state of the world remains unchanged.

  **The Genetic Testing Example:**
  If you get tested for an untreatable condition:
  *   **Negative Result:** You feel relief (Utility +).
  *   **Positive Result:** You feel dread for the rest of your life (Utility --).
  *   **Decision Impact:** Since the condition is untreatable, your *actions* (medical decisions) cannot change.

  According to Good's Theorem, if your actions don't change, the value of information is **zero**. It is not positive. Therefore, if there is *any* psychological cost to knowing (anxiety while waiting, depression after knowing), the net expected value becomes **negative**.

  Rationalists acknowledge this. If you value "blissful ignorance" higher than "accurate mapping," avoiding information is instrumentally rational for that specific utility function.

  ### 3. Violation: Bounded Rationality & Cognitive Hazards
  Good's Theorem assumes a perfect Bayesian updater. Humans are not perfect updaters. We are prone to cognitive biases that can turn information into a liability.

  *   **Analysis Paralysis:** Too much information can degrade decision-making quality by overloading working memory.
  *   **Bias Amplification:** Humans often use new information to reinforce existing biases (motivated reasoning) rather than update toward truth. If knowing a fact makes you *more* likely to make a catastrophic error due to emotional reactivity, the info has negative value.
  *   **The "Can't Unsee" Problem:** Good's Theorem says, "Worst case, act like you never saw it." But humans often lack the volitional control to ignore relevant knowledge. If you know a bridge is structurally unsound, you cannot "act like you don't know" while driving over it; the knowledge induces stress or hesitation that degrades performance.

  ### 4. Violation: Self-Fulfilling and Self-Defeating Prophecies
  In game theory and decision theory, there are scenarios where knowing the prediction changes the outcome.

  *   **Oedipus Effect:** Learning a prediction causes you to act in a way that makes it come true (e.g., a bank run).
  *   **Newcomblike Problems:** In certain decision problems (like Parfit's Hitchhiker), being the *type of agent* who doesn't look at certain information can lead to better outcomes than being the type who does. If an predictor knows you will look at the info and defect, they won't help you. If they know you stay ignorant and cooperate, they will.

  In these cases, the *disposition* to remain ignorant is more valuable than the information itself.

  ### 5. The Rationalist Reconciliation
  So, why do rationalists (like those at LessWrong or MIRI) still talk about infohazards? Because they distinguish between **Truth as a Terminal Value** and **Truth as an Instrumental Value.**

  *   **Instrumental Value:** Truth is useful because it helps you achieve goals. Good's Theorem applies here *mostly*, but fails due to bounded rationality and psychological costs.
  *   **Terminal Value:** Truth is good in and of itself.

  Most rationalists argue that while Truth is a high terminal value, it is not the *only* one. If your goal is "Survive" or "Be Happy," there are edge cases where information threatens those goals more than it aids them.

  **The "Infohazard" categorization usually breaks down into:**
  1.  **Hazards to the Self:** (e.g., Depression from genetic testing, cognitive hazards from dangerous ideas). This is rational avoidance due to psychological utility costs.
  2.  **Hazards to Others:** (e.g., Knowing how to build a bioweapon). This is standard externalities.
  3.  **Hazards to the Truth-Seeking Process:** (e.g., Prematurely publishing a half-baked theory that discredits a field).

  ### Summary
  Good's Theorem is mathematically correct for **ideal agents with utility functions over world-states.**

  It does not apply to **humans with utility functions over mental-states and bounded processing power.**

  When a rationalist declines genetic testing for an untreatable disease, they are not violating Good's Theorem; they are acknowledging that for a human, the cost of processing the information (dread, anxiety) outweighs the instrumental benefit (which is zero, since no treatment exists). They are treating "peace of mind" as a resource that information can deplete.

  So, you are right that "information hazards" shouldn't be mystical; but you are wrong that Good's Theorem forbids them. The theorem simply defines the narrow conditions under which information is guaranteed to be safe. Humans live outside those conditions.
