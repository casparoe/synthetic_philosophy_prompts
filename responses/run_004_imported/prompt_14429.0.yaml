      *   **Core Conflict:** Is Internalism secretly unfalsifiable due to the flexibility of the "sound deliberative route"?
      *   **Specific Arguments to Include:**
          *   Externalist: The "sound deliberative route" is so flexible (constitutive means, weighing, imaginative acquaintance) that it allows retroactive declaration of reachability from $S$. It makes the theory immune to counterexamples.
          *   Internalist: Needs a real comeback (not just restating $S$). Needs to turn the table: Externalism needs to explain how grasping a reason motivates. If it requires a motivational capacity, isn't that just internalism with extra steps?
      *   **Tone/Style:** Philosophical dialogue, engaging specific points, no easy winner, 15-20 exchanges.

  2.  **Character Conceptions:**
      *   *Alex (Internalist):* Pragmatic, focused on the explanatory link between reasons and action, skeptical of metaphysical "queer" entities. Defends the deliberative route as constrained, not magical.
