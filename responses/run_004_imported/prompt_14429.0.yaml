answer: |-
  **Participants:**
  *   **Alex (Internalist):** Defends a Williams-style Subjective Motivational Set ($S$) view.
  *   **Jordan (Externalist):** Defends a Reasons Fundamentalism (Nagel/Parfit/Scanlon) view.

  **Setting:** A coffee shop after a graduate seminar on meta-ethics.

  ***

  **1. Jordan:** Look, I've been chewing on your defense of Williams all afternoon. I'm willing to grant that reasons need some grip on the agent. But isn't the "sound deliberative route" clause basically a get-out-of-jail-free card? It makes Internalism unfalsifiable.

  **2. Alex:** Unfalsifiable? That's a heavy charge. How do you figure?

  **3. Jordan:** Because the deliberative route is so elastic. Williams lets deliberation do everything: finding means, weighing conflicting elements in $S$, even "imaginative acquaintance" where the agent comes to care about something new. If an agent ends up $\phi$-ing, you can always retroactively draw a line from some vague element in their $S$ to that action. You just say, "Ah, had they deliberated soundly from *that* desire, they would have $\phi$-ed."

  **4. Alex:** It's not retroactive magic, Jordan. There are constraints. Deliberation has to follow logic, causality, and psychological continuity. I can't just say a pacifist has a reason to enlist because if they deliberated *hard enough*, they'd want to. If there's no path from their actual $S$, the reason doesn't exist.

  **5. Jordan:** But who decides what counts as a "sound" route? If the agent *doesn't* $\phi$, you claim there was no route. If they *do* $\phi$, you claim there was. It feels like you're defining the route by the destination. You're protecting the theory by making the route so flexible it can accommodate any outcome post-hoc.

  **6. Alex:** That's not right. Think of the gin/petrol case. The agent wants a gin and tonic, reaches for the bottle, but it's petrol. Internalism says they have a reason to reach for the bottle *only if* it satisfies their desire. If it's petrol, the route is blocked by false belief. That's a hard constraint, not a flexible one.

  **7. Jordan:** That's the easy case. What about the moral convert? Someone who cares only about profit suddenly becomes a humanitarian. Williams says, "Ah, via imaginative acquaintance, they realized humanitarianism satisfied a deeper element of $S$." But isn't that just redescribing the conversion to save Internalism? Why not just say they grasped an external reason they were previously blind to?

  **8. Alex:** Because "grasping an external reason" is the mysterious part. If they converted, something in their psychology shifted. My job is to explain the *intelligibility* of the action, not just its normativity. If there's no link to $S$, the action isn't just irrational; it's psychologically unintelligible. It becomes a miracle.

  **9. Jordan:** But that's where you lose normativity. You're reducing "I have a reason to stop torturing" to "I have a motive to stop torturing." If the torturer lacks that motive, you have to say they have no reason to stop. That's absurd. The reason exists regardless of their $S$.

  **10. Alex:** Okay, let's pivot. Say you're right. There's an external reason. But for that reason to be a reason *for action*, it has to be able to motivate the agent once they grasp it, right? Otherwise, it's just a abstract truth, like a math problem.

  **11. Jordan:** Exactly. It's a normative truth. When a rational agent grasps it, they *ought* to be motivated.

  **12. Alex:** "Ought to be." But are they? If they aren't motivated, is the reason still doing work? If you say "Yes, because they *should* be," you need a story about what happens when they *are* motivated. What hook does the reason grab onto?

  **13. Jordan:** It grabs onto their rational capacity. To be an agent is to be responsive to reasons. It's not a contingent desire in $S$; it's constitutive of agency.

  **14. Alex:** Aha. So, every agent has a standing disposition to be moved by rational grasp. Let's call that disposition $D$. Now, when an external reason $R$ motivates, it's interacting with $D$, right?

  **15. Jordan:** Sure, but $D$ isn't a subjective motive like a hunger or a preference. It's the capacity to recognize truth.

  **16. Alex:** But functionally, it looks identical to an element of $S$. If $R$ motivates only because the agent possesses $D$, then the reason for action is actually the conjunction of $R$ and $D$. Without $D$, $R$ is inert. So why isn't this just Internalism where $D$ is a universal element of everyone's $S$?

  **17. Jordan:** Because $D$ doesn't *create* the reason. $D$ is just the receiver. The signal comes from outside. If everyone was blind, colors wouldn't exist. But colors aren't created by eyes.

  **18. Alex:** But reasons aren't colors; they're practical. If the "receiver" is required for the reason to have practical force, then the force is internal to the setup. And here's your mirror problem: If you can't specify how $R$ hooks onto $D$ without making $D$ look like a motivational state, aren't you just doing Internalism with extra metaphysical steps?

  **19. Jordan:** I'm not denying the psychology. I'm denying that the *source* of the normativity is the psychology. You're worried about unfalsifiability regarding the deliberative route. I'm worried that if you reduce reasons to $S$, you can't criticize $S$ itself. If a Nazi's $S$ is coherent, he has reasons to be a Nazi.

  **20. Alex:** And if your external reasons can't explain how they move a Nazi without positing a "rational capacity" that functions exactly like a motive, you haven't escaped the psychological anchor. We're both stuck explaining how normativity meets psychology. You think my route is too flexible; I think your "grasp" is too magical. Maybe the stalemate is the lesson.
