      *   *Mara's Position:* Legalistic/Positivist. Authority comes from explicit sanction (writing, voting, enforcement by power). If it's not in the handbook, it's not a rule.
      *   *Counter-Position:* Sociological/Normative. Authority comes from social expectation and consequence. If you break it, there is social friction (disapproval, being told to move).
