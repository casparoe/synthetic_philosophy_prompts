answer: |-
  This is a fantastic real-world case study for an AP Government class. You have stumbled onto a debate that political philosophers and sociologists have been having for centuries: the distinction between **law** (formal, codified rules enforced by the state/authority) and **norms** (informal, social expectations enforced by the community).

  Here is a breakdown of the two questions you raised, using the framework of political theory and social sociology.

  ### 1. Is Mara right that unwritten customs can't obligate her?

  Mara is making a **Legal Positivist** argument. She is essentially saying: *"If it isn't written in the code (handbook) and enforced by the sovereign (administration), it isn't law, and therefore I have no obligation to obey it."*

  In a strict legal sense, **she is correct.** The seniors have no *de jure* (legal/official) authority over her. They cannot give her detention, suspend her, or formally punish her. If she refuses to move, the school cannot officially sanction her for it.

  However, Mara is missing the concept of **Social Normativity.** In sociology and political science, an obligation does not require a police officer or a principal to be real. Norms create obligations through **social cost.**

  *   **The Mechanism of Binding:** When you stand in line, there is no law against cutting. But if you cut, people glare, sigh, or shame you. You might be asked to leave the line. The "obligation" to wait your turn is binding because violating it costs you social capital and creates friction.
  *   **The Senior Wall:** The custom is binding in the same way. If Mara sits there, she incurs a social cost: disapproval from seniors, confusion from juniors, and being labeled as someone who "doesn't get it."
  *   **The Verdict:** Mara is right that she has no *legal* obligation, but wrong that she has *no* obligation. She is participating in a **social contract** simply by attending the school. By entering that space, she accepts the existing cultural terrain. The custom is "binding" because it is self-enforcing through peer pressure and tradition. To say it has "no authority" is to ignore that authority can come from the community (the seniors) just as effectively as it comes from the administration, provided the community is united enough to enforce it.

  **So, is it binding?** Yes, but socially, not legally. Mara is free to sit there, but she is not free from the *consequences* of sitting there.

  ### 2. Is "Senior Wall" the same as "Not Cutting in Line," and does writing it down change it?

  This is the more complex question. Your friends argue that the Wall is like not cutting in line (a universal norm of fairness/order). But the reaction to the Student Council's proposal suggests they are actually **different kinds of things**, and codifying the norm fundamentally breaks it.

  Here is why writing it down changes the nature of the rule:

  **A. Folkways vs. Mores vs. Laws**
  Sociologist William Graham Sumner distinguished between *folkways* (customs like saying hello), *mores* (moral norms like not stealing), and *laws*.
  *   **Cutting in line** is close to a *more*. It violates a sense of universal fairness. Everyone waits; therefore, everyone should wait.
  *   **Senior Wall** is a *folkway* based on **hierarchy**, not fairness. It is explicitly exclusionary.
  *   **The Difference:** When a norm is unwritten, it operates on **tradition**. When it becomes written policy, it operates on **justice**.
      *   As a tradition, the Wall is accepted because "that's how it's always been." It's a gift from the past.
      *   As a policy, it must be justified. *Why* do seniors deserve this? *Why* are sophomores excluded?
      *   Writing it down invites scrutiny. An unwritten norm can survive on ambiguity; a written rule must survive on logic. Since the logic ("because we are seniors") is inherently elitist, it collapses under official scrutiny.

  **B. Spontaneous Order vs. Constructed Order**
  The economist F.A. Hayek wrote about "spontaneous order"—systems that organize themselves without a central designer (like language or common law).
  *   **The Unwritten Wall:** This is spontaneous order. It feels organic. It binds the community together through shared history. The seniors aren't "ruling" the sophomores; they are curating a tradition they inherited. It feels like culture.
  *   **The Written Policy:** This is constructed order. It turns a cultural practice into an institutional mandate. Now, the administration is complicit in the exclusion.
  *   **Why People Hate the Proposal:** When the Student Council tries to write it down, they kill the "magic" of the tradition. It stops being "our cool secret handshake" and starts being "school segregation policy." The seniors who oppose the writing likely understand intuitively that **officializing a privilege makes it look like oppression.**

  **C. The Legitimacy Shift**
  *   **Unwritten:** Legitimacy comes from **continuity**. (We do this because the class before us did.)
  *   **Written:** Legitimacy comes from **consent and equity**. (We do this because it is fair and voted on.)
  *   The Wall fails the test of equity. Therefore, it can only exist in the unwritten realm. By trying to make it official, the Student Council is trying to move a fish onto land. The thing that allowed the norm to survive (its informality) is the very thing that official policy removes.

  ### Summary for your AP Gov Context

  If you need to bring this back to your class unit:

  1.  **Mara's Mistake:** She is conflating **Legality** with **Normativity**. She is legally free to sit, but socially bound not to. Political obligation often stems from social contracts that aren't written down (like respecting elders or tipping waiters).
  2.  **The Codification Problem:** The reaction to the Student Council proposal proves that **Law and Norm are not interchangeable.**
      *   Norms rely on **social enforcement** and can tolerate ambiguity or mild unfairness because they are voluntary.
      *   Laws rely on **state enforcement** and must strive for consistency and fairness.
      *   By writing the norm down, the school would be taking responsibility for the exclusion. An unwritten tradition is "just how things are"; a written policy is "what the school demands." The latter is much harder to defend morally.

  **The Takeaway:** The "Senior Wall" works *only* because it is unofficial. It is a social norm that mimics a law. The moment you try to make it a law, it loses the social cover that protected it, and people realize it doesn't hold up to democratic scrutiny. Mara has the right to challenge the norm, but she shouldn't be surprised that the norm fights back socially. However, the seniors are wise to keep it unwritten; if they make it official, they will likely lose it entirely.
