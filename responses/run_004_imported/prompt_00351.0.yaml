answer: |-
  This is a challenge that cuts to the core of how the LessWrong rationalist community applies Bayesian epistemology to physics. The consensus you describe—championed famously by Eliezer Yudkowsky in *The Quantum Physics Sequence*—rests on a specific application of Occam's Razor: **MWI minimizes the complexity of the *laws* (just the Schrödinger equation), whereas Bohmian Mechanics (BWT) adds extra ontology (particles + guiding equation).**

  From a strict Solomonoff Induction standpoint, the shortest program that outputs the data wins. The LW consensus argues that "Unitary QM" is a shorter program than "Unitary QM + Particles."

  However, a rigorous Bayesian analysis requires looking not just at the prior probability of the *equations*, but the likelihood of the *data* given the theory, and the complexity of the **bridge laws** required to map the math to our observations. Here is the strongest case for why a good Bayesian should assign significantly higher credence to Pilot-Wave theory than the typical rationalist consensus (which often treats it as <1% probability).

  ### 1. The Likelihood of the Born Rule (The Measure Problem)
  The single biggest Bayesian strike against MWI is the difficulty of deriving the Born Rule ($P = |\psi|^2$).

  *   **The MWI Problem:** If all outcomes happen, in what sense are some "more probable" than others? To recover the Born Rule, MWI proponents (like Deutsch and Wallace) must lean on Decision Theory. They argue a rational agent *should act* as if the Born Rule is true. But this derives subjective betting odds from objective branching amplitudes. For a Bayesian, this feels like deriving an *is* from an *ought*. If the branches are all equally real, why should I weight my anticipation by the squared amplitude? The "Measure Problem" remains a significant unresolved gap in the likelihood function $P(\text{Observations} | \text{MWI})$.
  *   **The BWT Advantage:** In Pilot-Wave, the Born Rule is not a fundamental postulate about probability; it is a state of **quantum equilibrium**. Just as classical statistical mechanics derives the Boltzmann distribution from dynamical relaxation, BWT (specifically in the work of Antony Valentini) shows that an arbitrary initial distribution of particles $\rho$ will relax to $|\psi|^2$ over time.
  *   **Bayesian Update:** BWT explains *why* we see the Born Rule as a dynamical consequence of the theory. MWI must postulate it or derive it via contentious decision-theoretic axioms. If we treat the Born Rule as data, $P(\text{Born Rule} | \text{BWT})$ is arguably higher (or at least more robustly derived) than $P(\text{Born Rule} | \text{MWI})$.

  ### 2. Ontological Parsimony vs. Bridge Law Complexity
  The LW argument is that MWI has fewer *fundamental equations*. But Bayesian model selection must account for the complexity required to connect the model to the data.

  *   **The Hidden Cost of MWI:** MWI has simple dynamics, but it lacks a clear **ontology of experience**. The wavefunction lives in a $3N$-dimensional configuration space. We experience a 3D world with definite outcomes. To get from the wavefunction to "I see a spin-up result," MWI requires a complex, often hand-wavy bridge law involving decoherence bases and a theory of personal identity (which branch am "I"?). This "supervenience map" adds hidden complexity to the model.
  *   **The Honesty of BWT:** BWT posits particles in 3D space. It matches our ontology of experience directly. Yes, it adds variables (particle positions), but it removes the need for a complex theory of indexicality and branching identity.
  *   **Bayesian Update:** When calculating the total description length, you must include the code required to extract predictions. MWI: `Short Physics Code` + `Complex Extraction/Identity Code`. BWT: `Slightly Longer Physics Code` + `Simple Extraction Code`. The gap in total complexity is much smaller than the "Schrödinger Equation alone" argument suggests.

  ### 3. Nonlocality: Bug or Feature?
  The standard dismissal is that BWT is "ugly" because it is explicitly nonlocal, whereas MWI preserves locality. This is a misunderstanding of Bell's Theorem.

  *   **Bell's Verdict:** Bell's inequalities prove that **no local theory can reproduce QM predictions.** You must give up either Locality or Realism (unique outcomes).
      *   **MWI** keeps Locality but drops Realism (there is no single outcome).
      *   **BWT** keeps Realism but drops Locality.
  *   **The Epistemic Virtue of Honesty:** From a Bayesian perspective, a model that explicitly represents the causal structure of the territory is preferable to one that hides it. Experiments (Aspect, Zeilinger, etc.) demonstrate nonlocal correlations. BWT says, "The territory is nonlocal; here is the equation for that." MWI says, "The wave evolves locally, but the *experience* of correlation is nonlocal because reality splits."
  *   **Why this matters:** MWI's "locality" is a technical property of the wavefunction evolution, not of the phenomenological world. Since we live in the phenomenological world, penalizing BWT for being explicitly nonlocal is penalizing it for being honest about the data. If the territory is nonlocal, a map that draws nonlocal lines is more accurate than a map that claims to be local but requires "splitting universes" to explain the correlations.

  ### 4. Falsifiability and Novel Predictions (The Valentini Signal)
  A theory that can only ever reproduce the predictions of standard QM is empirically stagnant.

  *   **MWI:** MWI is empirically equivalent to standard Copenhagen QM in all known regimes. It is a "shut up and calculate" interpretation with extra ontology. It cannot be falsified unless we detect interference between branches (which is practically impossible).
  *   **BWT:** Pilot-Wave theory allows for **Quantum Non-Equilibrium**. If $\rho \neq |\psi|^2$, the theory predicts violations of the Born Rule, superluminal signaling, and violations of the uncertainty principle.
  *   **Bayesian Update:** BWT has a larger hypothesis space that *includes* standard QM as a subset (the equilibrium case). If we ever observe a Born Rule violation (e.g., in the Cosmic Microwave Background from the early universe, as Valentini suggests), BWT gets a massive likelihood boost, while MWI is falsified (or forced to ad-hoc modifications).
  *   **The Prior Penalty:** While BWT is currently penalized for not having a clean relativistic extension, it offers a path to *new physics*. MWI offers only conceptual clarity. A Bayesian should assign value to theories that risk falsification. BWT risks it; MWI hides from it.

  ### 5. The "Ad Hoc" Guiding Equation
  Critics say the guiding equation ($v = \frac{\hbar}{m} \text{Im} \frac{\nabla \psi}{\psi}$) looks tacked on.

  *   **Defense:** It is the **unique** velocity field that satisfies **equivariance**. If you want particles to move deterministically such that their distribution remains consistent with $|\psi|^2$ over time (preserving the statistical predictions of QM), this is essentially the only first-order equation that works. It isn't random; it is constrained by symmetry and conservation laws.
  *   **Comparison:** Compare this to MWI's "Worlds." Worlds are not in the Schrödinger equation. They emerge via decoherence. But the "basis" in which they emerge is approximate. BWT's particles are exact. From a mathematical rigor standpoint, exact particles + exact wave is cleaner than approximate worlds + exact wave.

  ### 6. The Relativistic Objection is Overstated
  It is true BWT lacks a universally accepted relativistic QFT formulation. However:
  1.  **MWI has the Preferred Basis Problem:** Decoherence explains why *some* bases are stable, but it doesn't fundamentally solve why *this* basis defines a "world." This is conceptually analogous to the preferred foliation problem in relativistic BWT.
  2.  **Progress is being made:** Durr, Goldstein, and Zanghi have developed Bohmian Dirac Seas and QFT extensions. They are messy, but they exist.
  3.  **Bayesian Patience:** Penalizing a theory heavily for current technical limitations is a heuristic, not a law. If the conceptual core (deterministic particles guided by a wave) resolves the measurement problem without collapse, the technical hurdle of relativity is a "normal science" problem, not a "paradigm crisis." MWI faces its own technical hurdles in quantum gravity (the problem of time).

  ### Conclusion: Recalibrating the Credence
  The typical LW consensus assigns MWI something like 80-90% credence and BWT <5%. This distribution assumes that "Simplicity of Laws" vastly outweighs "Simplicity of Ontology" and "Likelihood of Experience."

  A more balanced Bayesian update looks like this:
  1.  **Likelihood:** BWT handles the "single outcome" data and the Born Rule statistics more naturally (higher likelihood).
  2.  **Complexity:** When including the bridge laws needed to recover experience, the complexity gap narrows significantly.
  3.  **Falsifiability:** BWT offers a path to new physics (non-equilibrium), whereas MWI does not.
  4.  **Honesty:** BWT accepts Bell's nonlocality explicitly rather than hiding it in branching structure.

  **The Argument:** You should not necessarily believe BWT is *true*. But you should update your credence from "fringe punching bag" to "serious contender." If MWI is 60%, BWT deserves at least 20-30%, with the remainder on Objective Collapse or epistemic interpretations.

  Treating BWT as obviously wrong ignores that it solves the measurement problem *more directly* than MWI, at the cost of nonlocality—a cost Bell's Theorem suggests we must pay anyway. A good Bayesian pays the cost explicitly rather than hiding it in the footnotes of branching universes.
