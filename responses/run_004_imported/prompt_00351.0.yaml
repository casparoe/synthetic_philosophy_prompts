      *   *Observation:* We observe *one* outcome. MWI has to explain why we *feel* like we see one outcome (probability problem). BWT just says "there is one outcome."
      *   *Ontology:* MWI's "worlds" are arguably just as ontologically heavy as BWT's "particles + wave." MWI hides the mass in the branching structure.
      *   *Probability:* The Born Rule is derived (or postulated) differently. In MWI, deriving Born Rule is notoriously tricky (decision theory, self-locating uncertainty). In BWT, it's an equilibrium condition ($\rho = |\psi|^2$).
      *   *Nonlocality:* MWI is local in the wavefunction, but "worlds" are nonlocal in configuration space? Actually, Bell's theorem applies to *all* interpretations that match QM predictions. MWI isn't magically local in the sense that saves realism without nonlocality; it just denies unique outcomes. BWT is honest about nonlocality.
