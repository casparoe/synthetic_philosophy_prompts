          *   Nuance: Solomonoff Induction weights program length. MWI program is short, but the *output* is huge. BWT program is slightly longer, output is specific.
          *   Crucial Point: "Worlds" in MWI aren't fundamental. But "Particles" in BWT *are*. However, BWT particles explain *experience* directly. MWI requires a supervenience map from wave to experience. That map is complex.
      *   **Point 3: Nonlocality and Bell's Theorem.**
          *   LW Dismissal: BWT is nonlocal, MWI is local.
          *   Counter: Bell's theorem kills *local realism*. MWI keeps locality by dropping realism (unique outcomes). BWT keeps realism by dropping locality.
          *   Argument: Nonlocality is a feature of the *territory* (QM experiments), not just the map. BWT is honest. MWI hides it in the branching structure. From a Bayesian view, "honest nonlocality" isn't a penalty if the phenomenon is inherently nonlocal.
      *   **Point 4: The "Ad Hoc" Guiding Equation.**
          *   Criticism: Why $v = J/\rho$?
          *   Defense: It's the simplest velocity field that preserves equivariance ($\rho = |\psi|^2$ over time). It's not random; it's constrained by symmetry and conservation.
          *   Comparison: MWI's "splitting" isn't in the math; it's an interpretive layer. BWT's particles are explicit.
      *   **Point 5: Relativity and Future-Proofing.**
          *   Concession: BWT is behind on QFT.
