answer: |-
  This is an exceptional question. It cuts to the heart of Hobbes's philosophical system and offers a fantastic opportunity to move your students beyond the standard "state of nature" reading of *Leviathan* into the deeper epistemological commitments that underwrite it.

  You are right to resist the temptation to dismiss the Hobbes-Wallis dispute as mere biographical color. As Douglas Jesseph and others (like Tom Sorell and Noel Malcolm) have argued, Hobbes's mathematical errors were not accidental; they were **philosophically motivated**. To explain this to your students without getting bogged down in the geometry itself, you need to frame the issue around Hobbes's **materialist conception of reasoning** and the specific conditions he places on "Maker's Knowledge."

  Here is a conceptual breakdown of what is going on, structured to help you build a discussion section around it.

  ### 1. The Core Tension: Causal Generation vs. Symbolic Verification

  To understand how Hobbes could be so confidently wrong, you have to understand what he thought "doing geometry" actually *was*.

  For Hobbes, following his materialist metaphysics, there are no abstract objects. A circle is not a Platonic form; it is a body generated by a specific motion. Consequently, **knowledge of a geometric figure is knowledge of its causal generation.** To "know" the area of a circle is to understand the motion that produces it in relation to the motion that produces a square.

  *   **Hobbes's Method:** He insists on **synthetic, constructive geometry**. You must be able to trace the lines, see the motion, and intuit the proportion through the generation of the figure.
  *   **Wallis's Method:** Wallis represents the emerging **analytic, symbolic algebra**. He treats geometric magnitudes as numbers and uses symbolic manipulation to find relationships that might not be visually intuitable.

  **The Conceptual Explanation of the Error:**
  Hobbes was not "bad at math" in the sense of making arithmetic slips. He was rejecting the *method of verification* that would have caught his error. For Hobbes, if he could describe a motion that *seemed* to generate the square from the circle, he had satisfied the epistemic condition of "Maker's Knowledge." He possessed the causal story.

  Wallis, using symbolic algebra, could show that the proportions Hobbes claimed did not hold numerically. But for Hobbes, algebra was a "net of words"—a symbolic game detached from the physical reality of bodies in motion. He trusted his **intuition of the motion** over Wallis's **symbolic accounting**.

  **The Takeaway:** Hobbes's confidence wasn't blindness; it was a principled epistemological stance. He believed certainty resides in the *grasp of the cause* (the motion), not in the *consistency of the symbols*. He was wrong because the physical intuition of continuous magnitude is fallible in ways that symbolic manipulation is not. But within his own system, his confidence was rational: he believed he had the causal generation.

  ### 2. Implications for "Maker's Knowledge"

  This leads to the crux of your puzzle: Does this failure undermine the "Maker's Knowledge" thesis?

  There are two ways to handle this conceptually, both of which are teachable.

  **A. The "Garbage In, Garbage Out" Defense (Internal Consistency)**
  Hobbes distinguishes between *ratiocination* (reckoning) and *definitions*. For Hobbes, all reasoning is addition and subtraction of names. If the definitions are settled, the reasoning cannot go wrong.
  *   **The Diagnosis:** Hobbes's error in squaring the circle was not a failure of reasoning, but a failure of **definition**. He defined the relationship between the radius and the circumference incorrectly because his intuition of the motion was flawed.
  *   **The Epistemological Point:** "Maker's Knowledge" guarantees that *if* we construct the object correctly according to true definitions, we have certainty. It does not guarantee that the maker is infallible in the act of construction. The possibility of error remains in the **initial stipulation of the generative motion**.
  *   **Classroom Application:** This preserves the epistemology. We *can* have certain knowledge of things we make, but only if our definitions of how they are made are precise.

  **B. The Limits of Materialism (Structural Weakness)**
  A more critical reading suggests that Hobbes's insistence on reducing all geometry to **bodies in motion** structurally predisposed him to error when dealing with the infinite or the curvilinear.
  *   **The Diagnosis:** By refusing to accept abstract symbolic relations (Wallis's algebra), Hobbes cut himself off from the very tools that secure certainty in mathematics. He tried to force a symbolic problem into a mechanical box.
  *   **The Epistemological Point:** This suggests a limit to "Maker's Knowledge." Just because we make something doesn't mean we have transparent access to its properties if our *mode of access* (physical intuition) is inferior to other modes (symbolic logic).

  ### 3. The Political Analogy: Does the Math Failure Sink the *Leviathan*?

  This is the most important part for your discussion section. If Hobbes's model for certainty (geometry) is something he demonstrably failed to achieve, does his claim to have created a "civil science" collapse?

  **Argument 1: The Warning Against Ambiguity (The Pedagogical Angle)**
  You can frame the math failure as a **cautionary tale** for the political theory.
  *   Hobbes failed in geometry because his definitions of magnitude and motion were slightly off, and he refused to check them against an external standard (Wallis's algebra).
  *   **Political Parallel:** The Commonwealth is constructed by covenant (words/promises). If the definitions of "justice," "liberty," or "person" are ambiguous (like Hobbes's definition of the circle's area), the construction will fail, leading to civil war.
  *   **Lesson:** The *Leviathan* is an attempt to do in politics what he failed to do in math: establish precise, uncontestable definitions so that the "reckoning" of sovereignty yields only one result. The math failure highlights the **stakes** of the political project. We *must* get the definitions right, or the construction collapses.

  **Argument 2: The Volitional Advantage (The Optimistic Angle)**
  You can argue that the political construction is actually *more* secure than the geometric one.
  *   **Geometry:** Requires grasping the motion of physical magnitudes, which can be deceptive to the senses/intuition (as the circle-squaring showed).
  *   **Politics:** The "matter" of the commonwealth is not physical bodies, but **human wills and words**.
  *   **The Twist:** We have *better* access to our own wills and the meanings of our own covenants than we do to the precise proportions of curved lines. When I covenant, I know I am covenanting. The "construction" of the sovereign is a linguistic/volitional act that is immediately transparent to the agents involved, whereas the geometric construction relies on fallible spatial intuition.
  *   **Conclusion:** The "Maker's Knowledge" thesis holds *more firmly* in politics than in geometry, because the "material" of politics (human intention) is more accessible to the maker than the "material" of geometry (magnitude).

  **Argument 3: Normative vs. Descriptive Construction**
  Finally, distinguish between the *act* of making and the *success* of the making.
  *   Hobbes squaring the circle was a **descriptive claim** about magnitude (which was false).
  *   Hobbes constructing the Commonwealth is a **normative claim** about authority.
  *   Even if Hobbes was wrong about the geometry, the *logic* of authorization holds. If the subjects authorize the sovereign, the sovereign's actions are theirs. This logical relation doesn't depend on the area of a circle. The "Maker's Knowledge" in politics is about the **source of obligation**, not the measurement of power. We know the sovereign has right because we *made* him have it. That truth remains even if Hobbes was bad at math.

  ### 4. Suggested Discussion Strategy

  Here is a way to stage this in your section:

  1.  **Start with the Quote:** Put Hobbes's claim about geometry being the only true science on the board. Ask: *Why geometry? What does it have that ethics or physics lacks?* (Elicit: Certainty, construction, no dependence on experience).
  2.  **Introduce the Paradox:** Briefly mention that Hobbes spent 20 years claiming he squared the circle and was objectively wrong. Ask: *If geometry is the paradigm of certainty because we make it, how could the master of the system be so wrong?*
  3.  **Diagnose the Error:** Explain the Motion vs. Symbol clash. Hobbes trusted the "cause" (motion); Wallis trusted the "account" (algebra). Hobbes prioritized **causal intuition** over **formal verification**.
  4.  **Pivot to Politics:** Ask the students: *Leviathan* claims to be a similar construction. We build the state by covenant.
      *   *Question:* Does Hobbes's math failure make us trust his political science less?
      *   *Prompt:* Or does it teach us what to watch out for? (Look for the definitions. Look for the "motion" of the passions. Are we relying on intuition where we should rely on precise agreement?)
  5.  **Closing Thought:** Hobbes wants political philosophy to be a science of **consequences**, not just **causes**. In geometry, if you define the figure wrong, the proof fails. In politics, if we define "Liberty" wrong (e.g., as the absence of law rather than the silence of the law), the commonwealth fails. The math error underscores the necessity of the *definitional rigor* that *Leviathan* attempts to provide.

  ### Summary for your preparation

  You do not need to read more significance into the episode than it warrants, but you should treat it as **evidence of the risks inherent in Hobbes's epistemology.**

  The conceptual explanation is this: Hobbes's "Maker's Knowledge" requires that the maker have transparent access to the **generative rules** of the object. In geometry, Hobbes believed physical motion was that rule, but human intuition of motion is fallible. In politics, the generative rule is the **covenant**. Hobbes bets that human wills are more transparent to us than geometric magnitudes are.

  The failure in geometry doesn't refute the "Maker's Knowledge" thesis; it highlights the **conditionality** of it. Certainty is available *only if* the construction is based on correct definitions. Hobbes's tragedy is that he applied a rigorous demand for definitions to politics, but allowed his materialist intuition to slacken in mathematics. For your students, the lesson is that *Leviathan* is an attempt to ensure we do not make the same political mistake: constructing a state on ambiguous definitions that lead to destructive consequences.

  This approach respects Hobbes's system, acknowledges the historical failure, and turns it into a productive tool for understanding the stakes of *Leviathan*.
