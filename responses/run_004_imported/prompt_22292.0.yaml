      *   **Coherence Arguments (VNM Theorem, etc.):** If preferences satisfy certain axioms (completeness, transitivity, independence, continuity), they can be represented as maximizing expected utility. Violating them leads to "dominated" strategies (like the money pump).
      *   **Trading Agent Context:** Real-world markets have friction (fees, slippage, time delays). Pure theoretical money pumps might not work instantly, but the risk is real.
      *   **Non-EU Preferences:** Prospect theory, rank-dependent utility, satisficing, etc. Can these be made coherent?

  3.  **Address Question 1: Implications for Eliminating Intransitivity:**
