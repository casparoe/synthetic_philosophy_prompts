answer: |-
  **To:** Decision Theory Reading Group
  **From:** [Your Name]
  **Re:** Resolute Choice and the Toxin Puzzle: A Defense of Plan-Based Rationality

  ### Introduction: Reframing the Puzzle

  Kavka's Toxin Puzzle is standardly presented as a paradox of *intention*: How can one intend to do what one knows one will not do? Kavka's conclusion—that a rational agent cannot form the intention—rests on a specific, often unexamined, conception of practical rationality. It assumes that rationality is fundamentally *consequentialist* and *separable*: at any moment $t$, a rational agent must choose the action that maximizes utility from $t$ forward, independent of past decisions.

  I argue that this "sophisticated" model of choice is the source of the paradox, not the nature of intention. The puzzle does not reveal a limit on rational intention-formation; rather, it reveals a limit on the standard economic model of dynamic choice. By adopting a framework of **Resolute Choice** (associated with Edward McClennen and Michael Bratman), we can see that forming the intention is not only possible but required for rationality. The agent who fails to get the million dollars is not constrained by logic; they are constrained by a decision rule that forbids them from executing optimal plans.

  ### The Failure of Sophisticated Choice

  To understand the resolute solution, we must first diagnose the standard failure. The "sophisticated" chooser treats their future self as a separate agent over whom they have no control. They reason via backward induction:
  1.  **At Noon ($t_2$):** The money is already in the bank (or not). Drinking the toxin yields pain with no additional reward. Therefore, *Do Not Drink*.
  2.  **At Midnight ($t_1$):** I know my future self at $t_2$ will reason as above. Therefore, I know I will not drink. Therefore, I cannot form a genuine intention to drink. Therefore, I will not get the money.

  This reasoning satisfies **Dynamic Consistency** (my plan at $t_1$ matches my action at $t_2$) and **Separability** (my choice at $t_2$ depends only on consequences from $t_2$ onward). But it violates **Consequentialism** in the broader sense: by adhering to these constraints, the agent ends up with \$0, whereas a different mode of agency would yield \$1M minus the cost of illness.

  The sophisticated model assumes that reasons for action must be *local*. It demands that at noon, the agent find a reason to drink *in the consequences of drinking*. Since there are none, the act is irrational. This ignores the possibility that the reason for acting at noon lies in the *history* of the decision—specifically, that drinking is the necessary execution of a plan that was optimal when adopted.

  ### The Case for Resolute Choice

  Resolute choice proposes that the unit of rational assessment is not the isolated act, but the **plan**. A rational agent is a planning agent. When I adopt a plan at $t_1$, I am not merely making a prediction about my future behavior; I am issuing a normative directive to my future self.

  **1. The Normative Force of Past Decisions**
  On the resolute view, the fact that I *decided* to drink the toxin at midnight constitutes a reason to drink at noon. This is not magical thinking; it is the recognition that agency extends over time. If I treat my past decisions as mere data points (as the sophisticated chooser does), I fragment my agency. I become a series of temporal slices, each optimizing locally but failing globally. Resolute choice unifies the agent over time. At noon, I do not ask, "Does drinking maximize utility from this moment forward?" I ask, "Does drinking fulfill the optimal plan I adopted?"

  **2. Intention as a Cognitive State**
  Kavka argues you cannot intend what you know you won't do. But under resolute choice, you *know* you will drink, because you know you are a resolute chooser. You have trained yourself (or reasoned yourself) to treat plan-adoption as binding. Therefore, the belief condition for intention is satisfied. You believe you will drink *because* you have resolved to drink. The intention is genuine because the resolution is effective.

  **3. Ex-Ante Optimality**
  The rationality of the act is derived from the rationality of the plan. The plan "Intend at $t_1$, Drink at $t_2$" dominates the plan "Do Not Intend, Do Not Drink." Since rationality requires choosing the optimal plan, and executing the plan is part of choosing it, drinking at noon is the rational act, even though it is locally costly.

  ### Addressing the "Self-Serving Fiat" Objection

  The most potent objection to resolute choice is the charge of **arbitrariness** or **self-serving fiat**. Critics argue: *If you can make any action rational simply by resolving to do it beforehand, doesn't this destroy the normative constraint of rationality? Could I not resolve to burn my money, or cut off my nose, and claim that following through is "rational" because I committed to it?*

  If resolute choice allows an agent to bootstrap any arbitrary policy into rationality simply by willing it, it ceases to be a theory of rationality and becomes a theory of stubbornness.

  **Why the Charge Does Not Stick**

  This objection fails because it conflates the **adoption** of a plan with the **execution** of a plan. Resolute choice does not claim that *any* resolved plan is rational. It claims that *optimal* plans are binding.

  1.  **The Ex-Ante Constraint:** Resolute choice retains a strict consequentialist filter at the stage of plan adoption. You cannot rationally resolve to burn your money for no reason, because that plan is not *ex-ante* optimal. The plan fails the first test of rationality. The Toxin case is unique because the *plan* is beneficial (get \$1M), even though the *act* is costly (get sick). Resolute choice only protects the execution of plans that pass the ex-ante optimality test. It does not license *ex-ante* irrationality.

  2.  **The Distinction Between Reason and Cause:** The objection assumes that resolute choice asks us to ignore reasons. It does not. It asks us to recognize a *different kind of reason*. At noon, the reason to drink is not "I want to be sick." The reason is "Drinking is the necessary means to instantiate the strategy that secured my wealth." This is a legitimate instrumental reason. The "fiat" is not creating value out of nothing; it is recognizing that the value was created at $t_1$ and can only be captured by action at $t_2$.

  3.  **Avoiding the Regress of Re-evaluation:** If we accept the objection, we must demand that every action be re-justified at the moment of execution based on local consequences. But this leads to a regress that makes long-term agency impossible. Consider a student studying for an exam. At the moment of studying ($t_2$), the local utility of watching TV is higher. If they must re-justify studying from scratch, they will fail. They study *because* they adopted a study plan at $t_1$. If we call this "fiat," then all self-control is fiat. Resolute choice simply makes explicit the structure of rational self-control that we already presuppose in ordinary life.

  4.  **Vulnerability to Exploitation:** A sophisticated chooser (who rejects resolute choice) is vulnerable to **money pumps**. An agent who cannot commit to the Toxin plan can be exploited by any offer that requires a costly follow-through for a prior benefit. A resolute chooser is not exploitable in this way. Since avoiding exploitation is a hallmark of rationality, resolute choice is the more robust normative standard.

  ### Implications for Commitment Devices

  This debate is not merely theoretical; it frames our upcoming work on commitment devices.
  *   **External Commitment (Ulysses/StickK):** These devices change the payoff structure so that the sophisticated chooser *would* drink the toxin (e.g., by adding a penalty for not drinking). They make the local incentives align with the global plan.
  *   **Internal Commitment (Resolute Choice):** This changes the *decision rule* rather than the payoffs.

  If resolute choice is viable, external commitment devices are not strictly necessary for rationality, though they may be heuristically useful for agents with weak will. However, if Kavka is right and resolute choice is impossible, then external commitment devices are not just useful—they are *essential* for any rational agent wishing to undertake long-term projects.

  ### Conclusion

  Kavka's puzzle does not show that rational agents cannot intend to drink the toxin. It shows that **sophisticated consequentialists** cannot. By shifting to a framework of Resolute Choice, we see that the rational agent *can* and *should* form the intention. The charge of self-serving fiat fails because resolute choice is constrained by ex-ante optimality; it binds the agent only to plans that are globally beneficial, not locally convenient.

  To accept Kavka's conclusion is to accept that rational agents are necessarily fragmented over time, unable to capture value that requires costly follow-through. To accept Resolute Choice is to affirm that rationality includes the capacity to bind one's future self to one's past plans, not through external chains, but through the normative force of reason itself. For a lab moving into commitment devices, this distinction is vital: are we studying tools to fix broken rationality, or tools to assist a rationality that already functions resolutely?

  I look forward to discussing this in our next session.
