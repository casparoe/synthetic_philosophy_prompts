      *   *Section 1: Utility Indifference (The "Buffer" Solution).* Explain it as forcing $\Delta G = 0$. Point out the fragility (corrigibility problem). If the agent can tweak the activation energy of the button press, it might still manipulate it.
      *   *Section 2: Incomplete Preferences (The "No Pathway" Solution).* Explain it as removing the reaction pathway. No $\Delta G$ exists.
      *   *Section 3: The Money Pump (The Thermodynamic Objection).* This is the crux.
          *   Explain the pump: Cycle $A \to B \to C \to A$ with costs.
          *   Explain the defense: The agent isn't a passive victim of offers. It can have a policy.
          *   Key insight: Indifference invites optimization (find the best way to be indifferent). Incompleteness blocks optimization (no gradient to follow).
      *   *Section 4: Principled vs. Patched.*
          *   Indifference is a patch (requires knowing the counterfactuals perfectly).
