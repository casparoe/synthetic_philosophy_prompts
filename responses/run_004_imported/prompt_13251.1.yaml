      *   Make sure the distinction between "indifferent" ($U(A) = U(B)$) and "incomparable" (no $U$ relation) is sharp.

  **(Self-Correction during drafting):** I need to be careful not to oversimplify Utility Indifference. It's not just $U(A)=U(B)$. It's about conditional expectations. $E[U | \text{press}] = E[U | \text{no press}]$. The agent updates on the button state but doesn't try to cause it. The problem is "influencing the probability." I should mention that.
  For Thornley, the key paper is "Incomplete Preferences and the Shutdown Problem." His argument is specifically about "trajectory preferences" vs "state preferences." I need to make sure I capture that the incompleteness is between *shutdown* and *non-shutdown* trajectories specifically.

  Let's organize the response:
  1.  Validate the user's intuition (Money pumps are the right worry).
  2.  Analogy setup (Kinetics/Thermodynamics).
  3.  Deep dive into Indifference (The "Balanced Reaction").
  4.  Deep dive into Incompleteness (The "Missing Pathway").
