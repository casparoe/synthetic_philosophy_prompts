answer: |-
  # The Trajectory and the Ensemble: Adjudicating the Kelly Criterion

  The argument over the Kelly criterion is rarely just about betting sizes; it is a proxy war over the foundations of decision theory itself. On one side stands the orthodoxy of Expected Utility Theory (EUT), championed historically by Paul Samuelson, which views rationality as the maximization of subjective preference over a probability distribution. On the other stands the insurgent "ergodic" or "geometric rationality" view, championed by modern physicists and quantitative practitioners, which views rationality as the optimization of a physical trajectory through time.

  My friend, the quant, argued that Kelly is a law of nature for compounding systems. I argued it is merely a specific utility function masquerading as a universal law. To resolve this, we must look past the mathematics of growth rates and examine the ontology of the agent. Is the agent a static optimizer of consumption, or a dynamic entity fighting for persistence?

  ### The Traditionalist Case: Samuelson's Shadow

  The traditional view rests on the Von Neumann-Morgenstern axioms. In this framework, rationality is defined as consistency in preferences. If an agent prefers outcome A to B, and B to C, they must prefer A to C. These preferences are encoded in a utility function, $U(w)$. The rational act is whatever maximizes $E[U(w)]$.

  Paul Samuelson's objection to Kelly is devastating in its simplicity. He noted that maximizing the expected logarithm of wealth is mathematically equivalent to maximizing expected utility *only if* the agent's utility function happens to be logarithmic. For an agent with $U(w) = w$ (risk-neutral) or $U(w) = \sqrt{w}$ (risk-averse but not log), the Kelly bet is suboptimal.

  Samuelson's deeper critique targets the "long run" argument. Proponents of Kelly often argue that as the number of bets $N \to \infty$, the Kelly strategy yields higher wealth than any other strategy "almost surely." Samuelson retorted that "the long run is a misleading guide to current affairs." Infinity is a limit, not a destination. No human lives forever, and no fund operates for infinite rounds. In a finite horizon, a strategy that maximizes the *median* outcome (Kelly) might drastically reduce the *mean* outcome. If an agent has a specific liability to meet in five years, sacrificing expected value today to protect against a tail risk in year one hundred is not rational; it is a category error.

  Furthermore, the traditionalist argues that risk aversion is subjective. If I am willing to accept a 99% chance of ruin for a 1% chance of becoming a trillionaire, that is my preference. To tell me I am "irrational" for betting full Kelly (or over-betting) because I will eventually go broke is to impose an objective constraint on a subjective valuation. If I value the *chance* of the jackpot more than the *duration* of my solvency, Expected Value (EV) maximization is my rational norm, not Kelly.

  ### The Geometric Case: Ergodicity and Time

  The ergodicity economics counter-argument, advanced by researchers like Ole Peters, attacks the metaphysical underpinnings of Expected Value. It posits that standard EUT relies on an "ensemble average." When we calculate the expected value of a coin toss (50% heads, 50% tails), we are implicitly averaging over two parallel universes: one where you win, one where you lose.

  But agents do not live in an ensemble of parallel worlds. We live in a single timeline. We experience the "time average." For additive processes (like earning a fixed salary), the time average and ensemble average converge. But for multiplicative processes (like investment returns), they diverge. Wealth is non-ergodic.

  In a multiplicative game, losses have a disproportionate impact. A 50% loss requires a 100% gain to recover. If you bet too aggressively, the volatility drag (variance drain) ensures that your wealth trajectory trends toward zero, even if the expected value of each bet is positive. The ergodic argument holds that "almost surely going broke" is not just an asymptotic curiosity; it is an absorbing state. Once wealth hits zero, the game ends. You cannot realize utility in future periods if you do not exist in future periods.

  Therefore, the geometric rationalist argues that the logarithm is not a subjective preference; it is the mathematical map of the territory. The expected growth rate of wealth is defined as $g = E[\ln(w_{t+1}/w_t)]$. Maximizing this quantity is the only way to maximize the time-average growth of wealth. From this view, an EV maximizer who bets everything isn't "risk-seeking"; they are making a calculation error by treating non-ergodic dynamics as if they were ergodic. They are averaging over ghosts of themselves in parallel universes who got rich, ignoring the reality of the single self in this universe who went broke.

  ### Adjudication: The Category of Agency

  To reach a verdict, we must identify where these two views talk past each other. The disagreement stems from a hidden variable: the source of utility.

  Samuelson assumes utility is derived from *terminal wealth* or *consumption*. If I plan to consume my wealth at time $T$, I care about the distribution at $T$. If I have a high tolerance for risk, I might prefer a strategy with a lower median but a higher mean (fat right tail). In this context, Kelly is indeed just a heuristic for a specific type of risk aversion.

  The ergodic view assumes utility is derived from *continued agency*. If the purpose of wealth is to remain a player in the game, then survival is a prerequisite for utility. In this context, ruin is not just a low-utility outcome; it is a singularity where utility becomes undefined.

  The traditionalist says, "You can choose to go broke for a chance at glory." The geometric rationalist replies, "If you go broke, you lose the capacity to choose anything ever again."

  This reveals the condition under which Kelly transitions from a heuristic to a norm. Kelly is not universally rational for all agents with all goals. However, it *is* the rational norm for any agent whose utility function is **endogenous to the betting process**. That is, if your ability to generate value in the future depends on your capital in the present (which is true for almost all investment firms, endowments, and professional traders), then maximizing the growth rate is not a preference—it is a structural requirement of persistence.

  Samuelson is correct that for a finite-horizon consumption problem (e.g., saving for a house), Kelly is not mandatory. But my friend is correct that for the domain of *quantitative finance*—where the goal is to manage capital indefinitely—the ergodic critique dismantles the EV maximization argument. An EV maximizer in a multiplicative environment implicitly assumes they can be bailed out or that they operate across an ensemble of realities. Since neither is true, EV maximization is physically incoherent for a persistent agent.

  ### The Verdict

  We can now render a decisive verdict. Maximizing expected log wealth (Kelly) is the rational thing to do **whenever the agent treats wealth as fuel for future agency rather than as a terminal commodity for consumption.**

  In the context of your dinner argument, your friend wins the debate *for the domain of quantitative finance*. A quant fund is not an individual saving for a house; it is a mechanism designed to compound capital over an indefinite horizon. For such an entity, the "ensemble average" is a fiction. There is only the fund's P&L curve. If that curve hits zero, the entity ceases to exist. Therefore, maximizing the time-average growth rate is not a matter of "log utility preference"; it is a matter of logical consistency. To choose a strategy that minimizes the time-average growth rate in favor of a higher ensemble-average expectation is to choose a trajectory that statistically leads to extinction. That is not risk-seeking; it is a failure to understand the topology of the system.

  However, you win the debate *for the domain of human welfare*. Humans have finite lifespans and consumption needs that are not multiplicative. I do not compound my happiness; I spend it. If I have a 90% chance of doubling my retirement fund and a 10% chance of losing it all, a log-utility agent (Kelly) might reject that bet, but a human with a specific retirement date might rationally accept it to avoid under-consumption. For humans, wealth is often a means to a terminal end, not a perpetual engine. In that case, Samuelson is right: the logarithm has no privilege, and the time horizon matters.

  **The Synthesis:**
  The Kelly criterion deserves to be called a rationality norm, but its jurisdiction is limited to **non-ergodic, multiplicative systems where survival is a prerequisite for value realization.**

  In these systems, the logarithm is not a psychological curvature of preference; it is the arithmetic of time. To reject Kelly here is to violate the constraints of reality, not just the constraints of prudence. But outside this domain—where horizons are finite and wealth is consumed rather than reinvested—Kelly reverts to being merely one specific utility function among many.

  Your friend was right to dismiss Samuelson's objection as a "historical footnote" *within the specific context of repeated financial betting*, because Samuelson's critique relies on the ability to cash out and leave the game. In a game you cannot leave (because your capital is your license to play), the ergodic growth rate is the only objective measure of performance. But you were right to insist that this does not generalize to all rational action. Rationality is not one-size-fits-all; it is the alignment of strategy with the dynamics of the system. In a multiplicative world without exits, Kelly is the law. In a finite world of consumption, it is merely a choice.
