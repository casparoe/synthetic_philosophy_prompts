      *   *Critique:* Is the "Point of No Return" clear?
      *   *Fix:* Make it a physical action. A key turn or a specific command entry that changes the UI color permanently. Let's go with a "Cryptographic Burn."
      *   *Critique:* Are they dumb?
      *   *Fix:* Emphasize that Elias *knows* this is bad, but the incentive structure (losing his job, losing the shareholder value) forces his hand. The "rational" move for the individual is the "irrational" move for the collective.

  9.  **Final Polish:**
      *   Check the ending. It needs to land the tragedy. Not an explosion necessarily, but a financial/operational death.
      *   Ensure the prompt's specific request about the "moment" is highlighted.

  *(Self-Correction Note: Let's make the setting a bit more unique. Instead of just mining, let's make it about *orbital rights* around a newly stabilized wormhole or jump gate. No, that's too sci-fi. Let's stick to the Asteroid Mining idea but focus on the "Smart Contract" aspect. It mirrors the AI safety context better.)*

  *Revised Plan:* Two autonomous tugs. Two human overseers. The "Commitment" is burning a massive amount of fuel to prove you won't stop. If you don't burn, you lose the claim. If both burn, you crash.

  Let's write.

  *Title Idea:* The Schelling Point. The Burn. *Lockstep.* Let's go with *Lockstep*.

  *Key Moment:* The "Finalize Hash" command.

  *Let's ensure the prompt's condition about "nobody is dumb or evil" is met.* They should try to call each other. They should try to find a way out. The system prevents it.

