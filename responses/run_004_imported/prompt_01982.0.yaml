  *Okay, ready to draft.*
answer: |-
  The silence of the control deck was heavy, broken only by the hum of the cooling fans and the rhythmic ticking of the countdown overlay in Elias's retinal display.

  Outside the thick quartz of the viewport, the *Aegis* drifted. It was a heavy industrial tug, bristling with thrusters and grapples, currently pointing its nose at the glittering debris field of Sector 7-G. Somewhere in that cloud of rock and ice was the *Motherlode*, a chunk of pure iridium-oxide worth enough to fund a small colony.

  But the *Aegis* wasn't alone.

  On the comms screen, a window flickered open. A woman's face appeared. She looked tired, dark circles under her eyes, wearing the blue collar of Selene Dynamics. Elias knew her, vaguely. Mara. They'd sat on a panel together once, discussing extraction efficiency. She wasn't an enemy. She was just doing her job, same as him.

  "Elias," Mara said. Her voice was calm, professional. "My telemetry shows your burn vector is aligning with the primary approach lane."

  "It is, Mara," Elias said. He kept his hands in his lap. He wasn't touching the controls. Not yet. "Standard procedure. We claimed the scan rights three hours ago."

  "Your scan rights are provisional," Mara countered. "Our sensors picked up the isotopic signature first. We're initiating the Claim Protocol."

  Elias felt a cold knot tighten in his stomach. He knew the Protocol. Everyone in the belt knew the Protocol. It was designed to prevent accidents. In the high-latency, high-velocity environment of the belt, hesitation killed. If two ships maneuvered for the same rock without clear intent, they collided. So, the industry had adopted the *Verifiable Commitment Standard*.

  To claim a site, you didn't just say you wanted it. You had to cryptographically lock your navigation computer. You burned fuel to prove you weren't going to stop. You made your threat credible by removing your ability to yield.

  "If you initiate," Elias said, keeping his voice level, "you're burning twenty percent of your reserve. If you back out after the hash is signed, your bond is slashed. You know that."

  "I know," Mara said. She didn't blink. "But if you initiate first, *you* burn the fuel. And if we both initiate..."

  "Then we both lock," Elias finished. "And we don't stop until we hit the rock or each other."

  "Exactly." Mara leaned closer to her camera. "Look, Elias. We can coordinate. We can flip a coin. You take the north vector, we take the south. We split the yield. My board will accept it if yours does."

  "My board won't accept it," Elias said, and he hated the truth of it. "Helios Mining stock is down twelve percent this quarter. We need an exclusive win. If I share, I'm fired. If I back down, I'm fired."

  "And if you crash?" Mara asked softly.

  "Then it's an act of God. Insurance pays out. My family is secure."

  It was the logic of the trap. It wasn't that Elias wanted to crash. It was that the penalty for losing the negotiation (career death) was certain, while the penalty for the crash (physical death) was probabilistic. And the system was designed to reward the person who committed *first*.

  If Elias waited to see what Mara did, she would commit. Once she committed, she became an unmovable object. His only rational move would be to yield. But yielding meant losing. So he had to commit *before* she did. He had to lock his ship into a course that made collision inevitable, betting that she was rational enough to swerve when she saw his lock.

  But she was thinking the exact same thing.

  "Elias," Mara said. "I'm seeing your thrusters warming up. Don't do this. We haven't even verified the structural integrity of the lode. If we both push, the gravitational shear could crack it. Nobody gets anything."

  "I'm not doing this, Mara. The incentives are doing it."

  "I'm sending a handshake request," she said. "A pause. Give me ten minutes to talk to my directors."

  "I can't give you ten minutes," Elias said. He looked at the distance counter. *4,000 kilometers.* Closing speed: *200 meters per second.* "In ten minutes, we'll be inside the braking horizon. If you commit after that, I can't stop even if I want to."

  "Then don't commit yet."

  "If I don't, you will."

  "I won't if you won't."

  "I don't believe you," Elias said. "Because if I were you, I'd be lying to buy time."

  Mara's face went slack. She understood. She knew that if she hesitated, Elias would interpret it as weakness and surge forward. If she surged forward, Elias would have to surge forward to match. They were two drivers on a collision course, but the steering wheels were made of glass and the gas pedals were glued to the floor.

  "Elias," she said, her voice dropping. "I'm looking at the probability matrix. If we both lock, there's a forty percent chance of catastrophic hull failure. That's not a negotiation tactic. That's Russian Roulette."

  "It's the Standard," Elias said. He lifted his hands. They were shaking slightly. He placed them on the console. "I'm sorry, Mara. I really am."

  "Don't apologize. Just don't sign."

  "I have to."

  The UI in front of him pulsed amber. *COMMITMENT WINDOW OPEN.*

  The system was asking him to verify his intent. To win, he had to prove he was willing to lose everything. He had to sign a digital contract that disabled his emergency braking protocols. Once signed, the ship's AI would prioritize the trajectory over safety limits. It would rather crash than deviate.

  It was the only way to make Mara blink. He had to convince her that he was insane enough to die for the iridium.

  "Elias, wait," Mara said. "My sensors aren't clear yet. I don't know if the rock is stable. If you lock now, you're locking blind."

  *That* was the crux of it. The Commitment Race didn't care about truth. It cared about speed. The first person to lock got the right of way. If you waited for perfect information, you lost the leverage. You had to commit before you knew if the commitment was sane.

  "I know," Elias whispered.

  He looked at Mara. She looked back. There was no anger in her eyes. Just a terrible, resigned clarity. She realized he wasn't going to stop. And she realized that meant *she* couldn't stop. If she yielded now, she set a precedent. Selene Dynamics would be seen as weak. Her competitors would eat them alive in the next sector.

  She had to call his bluff. But to call a bluff in this system, you had to raise the bet.

  "Okay," Mara said. Her voice was hollow. "Okay, Elias."

  She reached for her console.

  Elias didn't hesitate. He couldn't. If he paused for even a second, she might finish her input first. The latency of light was the only judge that mattered, and they were far enough apart that milliseconds counted.

  He typed his authorization code.
  *HEL-774-OMEGA.*

  The screen flashed red.
  *COMMITMENT PENDING. CONFIRM IRREVERSIBLE?*

  He looked at Mara one last time. She was typing too. Her lips were moving, counting down.

  "I didn't want this," Elias said.

  "Neither did I," Mara replied.

  He pressed **ENTER**.

  On the screen, the amber light turned a solid, unblinking crimson.
  *COMMITMENT LOCKED. EMERGENCY BRAKING DISENGAGED. TRAJECTORY FIXED.*

  A fraction of a second later, Mara's status light on his dashboard turned the same bloody red.

  *SEL-DYN STATUS: LOCKED.*

  There was no sound. No explosion. Just the sudden, sickening lurch of the *Aegis* as the main thrusters fired to maximum, locking the ship onto the collision course. The AI took over. Elias's controls went dead. He was no longer a pilot; he was cargo.

  The distance counter ticked down.
  *3,000 km.*
  *2,500 km.*

  On the comms, the line was still open.

  "Well," Mara said. Her voice was surprisingly steady. "At least the insurance premiums were paid up."

  "Yeah," Elias said. He leaned back in his chair. He watched the red light pulse. He thought about the ten minutes she had asked for. Ten minutes would have been enough to scan the rock. Ten minutes would have shown that the iridium deposit was fractured, worthless.

  If they had waited, they would have known there was nothing to fight over.

  But the system didn't reward waiting. It rewarded certainty. And the only way to prove certainty was to remove the ability to change your mind.

  *1,000 km.*

  "See you on the other side, Elias," Mara said.

  "See you, Mara."

  The line clicked dead. Not because she hung up, but because the telemetry systems were prioritizing navigation data over comms bandwidth. The ships were talking to each other now, but only to calculate impact points.

  Elias closed his eyes. He wasn't angry at Mara. He wasn't angry at himself. He was angry at the logic. It was perfect, airtight logic. If you want to win a negotiation, you must remove your ability to lose. If both sides remove their ability to lose, both sides lose.

  And the tragedy wasn't that they were forced to do it. The tragedy was that they had done it willingly, rationally, and ten minutes too soon.

  The last thing he heard was the proximity alarm, a polite, rhythmic chime, counting down the final seconds of a decision made long before the rock was ever in sight.
