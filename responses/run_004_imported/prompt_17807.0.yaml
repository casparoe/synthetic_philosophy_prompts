  8.  *(Final thought before output)*: I need to make sure I explain *why* it's called "cooperation." It's because both parties sacrifice local utility for global utility based on the expectation of reciprocal sacrifice. It's a Nash Equilibrium in acausal space.

  Let's structure the response:
  1.  Validate the skepticism (CDT vs. FDT).
  2.  Explain the "Technical Mechanism" (Logical Correlation).
  3.  Explain the "Trade" aspect (Comparative Advantage across the multiverse).
