prompt: |-
  Quick one — I cover science and ideas, and next week I'm interviewing a logician whose entire reputation rests on an unnerving claim: we have way weaker grounds than most mathematicians assume for believing Peano arithmetic (nevermind ZFC) is actually consistent, and that the field's confidence here is closer to inherited faith than to proof. Give me 8-10 interview questions that don't just let her restate that headline claim. I want one on why Gödel's second incompleteness theorem doesn't just win the argument for her outright, one on Gentzen's consistency proof and the obvious 'you've only relocated the assumption onto transfinite induction up to epsilon-zero' comeback she'll make, and one on the Nelson affair from 2011 -- does a flawed inconsistency proof getting caught within days actually tell us anything about whether a real one would ever be spotted, or does it cut the other way? For each of those, add a follow-up keyed to whatever she's likely to answer, and close with a question that pins down what would concretely change about how mathematicians actually work if she's right. Keep it conversational, not a logic seminar.
