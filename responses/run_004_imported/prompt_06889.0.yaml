      *   *Actually, let's look at the "Swamping" aspect.* The value is in the *stability* of the belief.
      *   *Story Arc:* Two people need to make a decision based on a fact. Both have the fact. One knows the derivation. The environment changes slightly, rendering the fact obsolete unless you understand the derivation.

      *   *Drafting Plan:*
          *   **Setting:** A subterranean mining colony or a space station. Let's go with a subterranean colony (echoes of the cave, but distinct).
