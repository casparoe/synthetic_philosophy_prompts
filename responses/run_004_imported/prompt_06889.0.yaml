      *   *Idea 6: Music/Performance.* Two musicians. One knows theory, one plays by ear. Both hit the right note. Then the key changes. *Problem:* Stakes feel low.
      *   *Idea 7: Bomb Disposal/Explosives.* High stakes. Cut the red wire. One knows the circuitry, one guesses based on a pattern seen in a movie. Both succeed *this time*. Next time, the pattern changes. *Problem:* If they both succeed the first time, the story ends. Need a situation where the *same* belief is held, but the environment shifts.

      *   *Refined Idea:* Let's go with a scenario involving prediction or complex systems where stability matters. Agriculture? No. Finance? Maybe. How about *structural engineering* during a crisis? Or *navigation* in a dynamic environment?
