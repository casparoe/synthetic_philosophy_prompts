answer: |-
  The red light on the console wasn't blinking; it was screaming. A steady, furious pulse that meant the atmospheric scrubbers on Outpost 4 were dying.

  "We have twelve minutes of air," Elara said, her fingers flying across the haptic interface. She wasn't panicking. Panic required uncertainty, and Elara dealt in variables.

  Kip, however, was sweating. He was a transport pilot, not an engineer. He knew how to fly the crate, not how to keep it from suffocating them. "The manual says reboot the primary cycle," he suggested, reaching for the master switch.

  "No," Elara snapped. "The intake valve is jammed. Rebooting will lock the seal permanently. We need to bypass the regulator and feed power directly to the fans."

  Kip hesitated, then nodded vigorously. "Yeah. Yeah, that's it. Bypass the regulator. I heard a mechanic on Titan say that's the fix for this model."

  Elara paused. She looked at him. "You heard a rumor?"

  "It worked for him," Kip said, a desperate hope in his eyes. "He said, 'Just cut the regulator, feed the fans.' We'll get air."

  Elara turned back to her screen. She ran the simulation. It took four seconds. The numbers aligned. The pressure differential would hold. The fans would spin. The air would flow. "You're right," she said. "But you're right for the wrong reasons."

  "Does it matter?" Kip asked, already reaching for the junction box. "We're going to breathe."

  "We are," Elara agreed. They shared the belief: *This action will restore airflow.* It was a true belief. In twelve minutes, they would both be breathing easy. To an observer, their epistemic states would look identical. They would both be alive.

  Kip threw the switch. The hum of the dying scrubbers surged into a roar. The red light turned a soothing, steady green. Oxygen levels began to climb.

  Kip slumped against the wall, laughing, a ragged sound. "See? Told you. Mechanic on Titan knew his stuff. We're good." He started to unstrap his harness. "I'm going to prep the shuttle for evacuation just in case, but we've got time."

  Elara didn't move. She kept her eyes on the secondary thermal gauge. "Don't unstrap, Kip."

  "Why? The light is green."

  "The light measures flow, not heat."

  Kip frowned. "The air is coming. The problem is solved."

  "The problem of *flow* is solved," Elara corrected. She tapped the glass over the thermal readout. "The regulator doesn't just control speed; it dissipates heat from the power surge. By bypassing it, we've turned the intake manifold into a heater."

  Kip stared at the gauge. The needle was creeping into the yellow. "But... the mechanic said it would work."

  "It *is* working," Elara said. "Your belief is true. We have air. But you don't know *why* it works, so you don't know what it costs."

  The needle hit the red zone. A new alarm chimed, softer than the first, but more sinister. A low thrumming vibration began to shake the floor plates.

  "So turn it off!" Kip yelled, reaching for the switch.

  "If we turn it off, we suffocate in ten minutes," Elara said. Her hands were moving again, recalibrating the output. "I have to modulate the power feed manually. Pulse the energy. Let the manifold cool, then spike the fans, then cool again."

  "I don't understand," Kip said, his voice rising. "You said the bypass works!"

  "It works *if* you manage the thermal load," Elara said. "I know the physics of the bypass. You only know the result of the bypass. The result is stable only if the conditions remain static. The conditions aren't static."

  The vibration grew violent. A spark showered from the junction box Kip had touched. He recoiled.

  Elara was sweat-drenched now, her eyes darting between the oxygen mix and the thermal load. She was dancing on a knife-edge, manually pulsing the power every forty-five seconds to keep the manifold from melting. If she missed a pulse, the unit fused. If she pulsed too soon, they choked.

  Kip watched her, helpless. He possessed the truth—they needed the bypass—but the truth was slipping away from him. It was like holding a slippery fish; he had the grip, but he didn't have the net. He looked at the green light, which still said *SYSTEM OPTIMAL*, and felt a surge of betrayal. The light was lying, or rather, the light was telling a truth that was too small to save them.

  "Why didn't the mechanic tell you about the heat?" Elara gritted out, her finger hovering over the manual override.

  "He didn't know!" Kip realized aloud. "Or he didn't care. It worked for him. Maybe his manifold was different. Maybe he got lucky."

  " Luck doesn't scale," Elara said. The needle spiked. She cut the power. The roar died for three seconds. Kip gasped, clutching his chest. Elara restored the feed. The roar returned. "Knowledge scales. Knowledge anticipates the friction."

  For an hour, Elara rode the surge. She understood the tether that bound the truth to the reality. She knew that the belief "the bypass works" was not a static object, but a dynamic relationship between power, heat, and time. Kip sat in the corner, staring at the green light. He had the same belief she did, but his belief was untethered. It had wandered off into the realm of dangerous assumption.

  Finally, the external repair drone signaled that the intake valve was cleared. Elara engaged the regulator and killed the bypass. The hum settled into a smooth, automated rhythm. The thermal gauge dropped.

  Elara exhaled, a long, shuddering breath, and slumped forward onto the console.

  Kip walked over, looking at the equipment like it was a stranger. "We both knew what to do," he said quietly. "We both got the air."

  "We both had the map," Elara said, wiping grease from her forehead. "But only one of us knew the terrain. You had a true opinion, Kip. It got us started. But if I hadn't been here to tie it down, it would have run away and killed us."

  Kip looked at the green light, then at the scorch marks on the manifold. He realized then that the value wasn't in arriving at the truth. The value was in being able to stay there when the ground started shaking.

  "Next time," Kip said, his voice steady, "show me the math."

  Elara nodded. "Next time, we start with the why."
