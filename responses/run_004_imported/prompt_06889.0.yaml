      *   **Person B:** Panics. He doesn't know *why* it worked, so he doesn't know if River X breaks the logic. He hesitates, causing a scene.
      *   *This feels a bit abstract.*

      *   *Let's go back to Mechanics/Engineering.* It's tangible.
      *   **Setting:** A failing life-support system on a remote outpost.
      *   **Characters:** Elara (Engineer) and Kip (Technician).
      *   **Belief:** "Bypassing the regulator will stabilize the oxygen."
      *   **Elara:** Calculated the flow rates. Knows the thermal limits.
      *   **Kip:** Saw it work on a different model once. Or just guessed. Let's say he heard a rumor from a passing trader. "Just bypass the regulator."
      *   **Action:** They do it. Oxygen stabilizes. (True Belief works).
