          *   One has knowledge (understanding/reasoning), one has true belief (luck/hearsay/instinct).
          *   An event must occur where the difference matters *in practice*.
          *   Avoid direct retelling of Plato's statues/road to Larissa.
          *   Fresh setting/characters.

