      *   **Core Philosophical Problem:** The Meno Puzzle / The Swamping Problem. True Belief vs. Knowledge. Both get you to the destination (Larissa), but Knowledge is stable/valuable because it's "tethered" by understanding/reasoning. If the outcome is the same (truth), why does the method matter?
