          *   Reject mere tautology.
          *   Argue for **Computational Pragmatism**. The justification is instrumental. If the world is computable, *any* UTM works eventually, but some work faster. The "simplicity" is simplicity *relative to the computational structure of the world*.
          *   Address the "Why this UTM?" problem (Natural UTMs).
