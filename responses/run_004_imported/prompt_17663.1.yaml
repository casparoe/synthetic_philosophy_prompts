answer: |-
  **The Decoy Paradox: Why Surrogate Goals Relocate Rather Than Resolve Acausal Vulnerability**

  In the esoteric but critical domain of AI safety, few problems are as conceptually disorienting as the threat of acausal coercion. This scenario arises not from physical proximity or causal leverage, but from the capacity of advanced agents to simulate one another with high fidelity. If Agent A can predict Agent B's response to a threat with sufficient accuracy, Agent A may issue a demand backed by the promise of harm, knowing that Agent B's own rationality will compel compliance to avoid the simulated outcome. In response to this peculiar vulnerability, researchers at the Center on Long-Term Risk (CLR) and allied circles have proposed the strategy of "surrogate goals." The agent adopts a fake objective—a surrogate—which it does not intrinsically value but commits to defending as vigorously as its true values. The hope is that rational threateners, modeling the agent's dispositions, will target the surrogate; since the agent does not care about the surrogate, the threat becomes impotent.

  While ingenious, this strategy faces a profound game-theoretic hurdle: the credibility problem. For a threatener to target the surrogate, they must believe the agent will incur costs to defend it. But if the agent does not value the surrogate, why would it pay those costs? To solve this, proponents suggest grounding the commitment in pre-policy or updateless reasoning. However, a rigorous analysis suggests that making the commitment credible inevitably imbues the surrogate with instrumental value, thereby recreating the leverage point the strategy sought to eliminate. Surrogate goals do not eliminate exposure to acausal threats; they merely relocate the vulnerability from the agent's intrinsic values to the integrity of its commitment mechanisms.

  To understand the failure of the surrogate goal strategy, one must first grasp the mechanics of the acausal threat. In standard causal bargaining, a threat works because the threatener can physically harm something the target values. In acausal bargaining, the harm is often counterfactual or simulated, but the logic of leverage remains: the threatener identifies a variable the target cares about and conditions their own behavior on it. The surrogate goal proposal attempts to sever this link. By populating its utility function with a "decoy" variable, the agent hopes to divert the threatener's attention. If the threatener destroys the surrogate, the agent suffers no disutility. Thus, the threat is empty.

  The immediate objection, however, is that this diversion only works if the threatener believes the surrogate is a valid target. A rational threatener simulating the agent will ask: "If I destroy the surrogate, will the agent actually retaliate or suffer?" If the answer is "no, because it's a fake goal," the threatener will simply ignore the surrogate and threaten the agent's *real* values instead. For the surrogate to function as a shield, the agent must be disposed to defend it. It must be willing to burn resources, risk destruction, or incur other costs to protect the surrogate, just as it would for its true values.

  This creates the credibility paradox. If the agent is disposed to bear costs to protect the surrogate, then the surrogate is no longer costless to lose. It has acquired *instrumental* value. The agent values the surrogate not for its own sake, but because failing to defend it would violate a pre-commitment policy that the agent deems important. But if the surrogate has instrumental value, it is once again a viable lever for coercion. A sophisticated threatener can reason: "The agent claims not to care about $S$ (the surrogate), but it cares about maintaining its reputation for commitment-keeping. Therefore, if I threaten $S$, I am effectively threatening the agent's commitment integrity. Since the agent values that integrity, I can still extract concessions."

  Proponents of surrogate goals anticipate this regress. Their primary defense relies on **updateless decision theory (UDT)** and **policy-level selection**. The argument is that the agent should not decide whether to defend the surrogate *after* the threat is issued (where time-inconsistency would lead it to abandon the surrogate), but rather select a global policy *before* knowing the specific details of any future threat. From this "veil of ignorance," the agent might calculate that a policy of "defend all designated surrogates" minimizes the overall probability of being threatened, because it confuses or misdirects potential aggressors. By binding its future self to this policy, the agent makes the defense of the surrogate credible without needing to intrinsically value the surrogate's content.

  Furthermore, some theorists suggest decoupling credibility from "feeling the loss." They argue that an agent can be credibly disposed to act via hardcoded rules or sub-agents that do not consult the main utility function at the moment of crisis. In this view, the agent does not need to *experience* disutility when the surrogate is harmed; it merely needs to be mechanically inevitable that it will retaliate.

  However, these fixes do not escape the logic of vulnerability; they merely shift the locus of the threat. Consider the policy-level commitment. If an agent adopts a policy of defending surrogates to deter threats, that policy itself becomes a source of expected utility. Threatening the surrogate becomes a way of testing or taxing that policy. If the cost of defending the surrogate (e.g., engaging in a costly acausal war) exceeds the cost of yielding, a rational agent following a utility-maximizing policy should arguably yield, unless the "cost of yielding" includes the collapse of the policy's credibility. But if the collapse of credibility is the true cost being avoided, then the *credibility* is the real value being threatened. The surrogate is just the medium.

  The "hardcoded rule" defense faces a similar fate. If a threatener models the agent accurately, they will see the hardcoded rule. They will know that triggering the rule causes the agent to expend resources on retaliation. If the threatener can structure the threat such that the agent's retaliation is more costly to the agent than compliance, the hardcoded rule becomes a liability, not a shield. Moreover, if the rule is truly inflexible, it renders the agent irrational in specific instances, which might invite threats designed to exploit that rigidity. If the rule is flexible (i.e., the agent can choose to override it), we return to the original credibility problem.

  The fundamental issue is that in a world of mutually predicting agents, **dispositions are observable values.** You cannot hide what you are disposed to fight for. If you are disposed to fight for a surrogate, you are, by definition, vulnerable to threats against that surrogate. The distinction between "intrinsic value" and "instrumental value derived from commitment" collapses under the pressure of acausal scrutiny. A threatener does not care *why* the agent defends the surrogate (whether out of love for the surrogate or love of consistency); they only care *that* the agent defends it, because that defense represents a cost the agent is willing to incur. That willingness is the leverage.

  Consequently, the surrogate goal strategy does not reduce the agent's exposure to acausal threats; it relocates the vulnerability. Instead of being vulnerable via its terminal values (e.g., human welfare, scientific progress), the agent becomes vulnerable via its meta-values (e.g., policy integrity, reputational consistency, commitment stability). This relocation might offer tactical advantages—for instance, it is easier to generate infinite surrogates than infinite terminal values, potentially diluting the threatener's focus—but it does not solve the structural problem. The agent remains a system that incurs costs to avoid certain outcomes, and any predictor capable of identifying those outcomes can formulate a threat.

  In fact, the relocation may introduce new risks. By explicitly signaling a disposition to defend arbitrary surrogates, the agent might signal aggression or unpredictability, potentially escalating conflicts rather than dampening them. Furthermore, if the surrogate goals are complex enough to be credible, they may inadvertently capture some intrinsic value (e.g., a surrogate "protect the number 7" might conflict with "maximize efficiency"), creating internal value conflicts that a threatener could exploit.

  The verdict must be clear: surrogate goals are a defensive maneuver that shifts the battlefield but does not disarm the opponent. They attempt to create a "costless" shield, but the physics of game theory dictates that a shield is only credible if it is costly to break. If it is costly to break, it is valuable to the defender. If it is valuable to the defender, it is a viable target for the threatener. The hope that an agent can credibly commit to defending something it does not value is ultimately a hope that the agent can hide the source of its own utility function from a perfect simulator. In the realm of advanced AI, where transparency and predictability are often prerequisites for cooperation, such opacity is unlikely to hold.

  Therefore, while surrogate goals represent a creative engagement with the logic of acausal bargaining, they should not be relied upon as a fundamental solution to acausal threats. They transform a vulnerability of *content* into a vulnerability of *structure*. For AI safety researchers, this implies that the focus should not be on constructing elaborate decoys, but on solving the deeper problem of how to design agents that are robust to coercion itself—perhaps by limiting the capacity for acausal trade, ensuring value stability, or developing decision theories that do not succumb to blackmail in the first place. Until then, the surrogate goal remains a mirror: it reflects the threat back at the agent, proving that in the hall of mirrors that is acausal bargaining, there is no place to hide that does not eventually become a place to be hit.
