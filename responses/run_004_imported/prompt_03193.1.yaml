          *   Core: The suppression of the diary by editors (and Dummett's hesitation) suggests the community knows it's damaging.
          *   Core: Anti-psychologism removes the "human" from thought. If thoughts are objective entities, who decides access? Could this mirror excluding "undesirables" from the polity?
          *   Counter to Jordan: Ignoring the biography blinds us to the *motivations* and *limits* of the system.

  3.  **Drafting - Stage 1: Setting the Scene:**
