      *   *Psychical Research as Empirical Theology:* Since traditional religion was crumbling (Darwin, Higher Criticism), Sidgwick needed *evidence* for the supernatural to ground his ethics. Telepathy/Immortality = Proof of moral order.
      *   *Methodological Consistency:* Sidgwick applied the same rigorous empiricism to ghosts as he did to moral intuitions. He wasn't being irrational; he was expanding the scope of empiricism.

  5.  **Drafting the Response (Iterative Process):**

