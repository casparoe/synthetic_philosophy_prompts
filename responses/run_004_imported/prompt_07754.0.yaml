answer: |-
  Your editor's hook is catchy, and historically, the "Newton's Alchemy" analogy has been a very durable way to dismiss the inconvenient interests of great rationalists. It creates a clean narrative: *The Genius vs. The Superstition.*

  However, if you write that piece, you will be walking into a trap that historians of philosophy and Victorian science have spent the last forty years dismantling. The "quirky footnote" thesis is not just reductive; it is arguably factually incorrect regarding Sidgwick's motivations. It treats his psychical research as a lapse in judgment, when in reality, it was a **consistent extension of his ethical project.**

  Here is the sanity check you asked for: The "Newton" analogy fails because Newton kept his alchemy largely secret and theological, whereas Sidgwick made his psychical research public, institutional, and methodological. More importantly, Sidgwick didn't hunt ghosts *despite* being an ethicist; he hunted them *because* he was an ethicist.

  Here is the deeper throughline you should pitch to your editors instead.

  ### 1. The Ethical Crisis: The Dualism of Practical Reason
  To understand why Sidgwick founded the Society for Psychical Research (SPR), you have to look at *The Methods of Ethics* (1874). Sidgwick is famous for identifying a catastrophic problem in utilitarianism, which he called the "Dualism of Practical Reason."

  *   **The Problem:** Rational self-interest (Egoism) and the general good (Utilitarianism) do not always align. In a purely materialist universe, it is often more "rational" to be selfish if you can get away with it.
  *   **The Requirement:** For morality to be truly rational, there must be a "Moral Government of the Universe." There must be some mechanism (God, karma, afterlife) that ensures virtue is eventually rewarded and vice punished.
  *   **The Victorian Dilemma:** Sidgwick was an agnostic. He couldn't just assert religious dogma to solve this. He needed *empirical evidence* of a spiritual order to ground his ethics.

  If the soul survives death, and if telepathy proves a interconnected consciousness, then the materialist universe is incomplete, and the "Moral Government" becomes scientifically plausible. Psychical research wasn't a hobby; it was an attempt to find the empirical data required to save ethics from nihilism.

  ### 2. Methodological Consistency, Not Hypocrisy
  The "Newton" analogy suggests Sidgwick turned off his critical brain when he entered a séance room. The historical record suggests the opposite.

  Sidgwick approached psychical research with the exact same rigorous empiricism he applied to ethics. He was notoriously difficult to satisfy as an investigator. He famously exposed fraudulent mediums (including his own friend, the medium Eusapia Palladino, though his relationship with her was complicated). He wasn't looking for magic; he was looking for **anomalies that demanded a scientific explanation.**

  He viewed the SPR not as a club for believers, but as a "scientific" body akin to the Royal Society, investigating data that mainstream science was ignoring out of prejudice. To Sidgwick, ignoring telepathic claims because they seemed impossible was just as dogmatic as accepting them without proof. This aligns perfectly with his ethical method: scrutinizing all moral intuitions, even the most cherished ones, to see if they hold up to systematic analysis.

  ### 3. The "Lost Cause" Narrative is More Compelling
  The "quirky footnote" angle makes Sidgwick look slightly senile or hypocritical. The *actual* story is more tragic and human.

  Sidgwick spent decades and much of his personal fortune searching for proof of the supernatural to ground his moral philosophy. **He never found it.** By his own admission, he died without the solid proof he sought.

  This creates a fascinating tension: One of the greatest systematic thinkers of the 19th century realized that his ethical system required a leap of faith he couldn't logically justify, and he spent the rest of his life trying to bridge that gap with data. That isn't a footnote; that is the tragic climax of his intellectual biography. It reframes him from a dry systematizer into a figure wrestling with the meaninglessness of a post-Darwinian universe.

  ### 4. How to Pitch the Pivot to Your Editors
  You can acknowledge their hook but suggest that the scholarship has moved on. The "Newton's Alchemy" frame was popular in the early 20th century (logical positivists loved it), but modern intellectual historians (like Janet Oppenheim, Alan Gauld, and Christian La Cassagnère) argue that Sidgwick's "two lives" were actually one life.

  **Proposed Angle:**
  > "Sidgwick didn't have a split personality. He had a unified problem. He needed to prove that the universe was moral, not just mechanical. When theology failed him, he turned to science. When mainstream science hit its limits, he turned to the paranormal. His ghost-hunting wasn't an escape from his philosophy; it was the desperate empirical foundation his philosophy required to stand."

  ### Summary
  If you write the "footnote" piece, you risk publishing something that will look outdated within five years as the integration of Victorian science and religion continues to be a hot topic in intellectual history.

  The "Newton" analogy implies a separation between the Rational and the Irrational. Sidgwick's life argues that in the late Victorian period, the boundary between the two was porous, and for a utilitarian, the stakes of that boundary were nothing less than the rationality of being good.

  **Verdict:** The editor's take is a good *headline*, but a bad *thesis*. Use the hook to draw them in, but pivot immediately to the ethical necessity of the SPR. That is the story worth telling.
