      *   *Methods of Ethics:* Published 1874. Rigorous, systematic, utilitarian (though nuanced).
      *   *Newton's Alchemy Analogy:* Common trope. Keynes famously argued Newton wasn't the "first age of reason" but the "last magician." However, modern scholarship often tries to integrate Newton's natural philosophy and alchemy rather than separate them.
      *   *Sidgwick's Motivation:* Why did he do it? It wasn't just a hobby. He saw it as scientific inquiry into anomalous data.
      *   *Connection to Ethics:* Sidgwick was concerned with the "dualism of practical reason" (self-interest vs. universal good). Religion/Immortality played a role in reconciling this. If there's no afterlife/retribution, why be moral?
      *   *Scholarship:* Recent work (e.g., by Oppenheim, Grogin, Luckhurst) argues against the "footnote" view.

  3.  **Evaluate the "Newton's Alchemy" Analogy:**
      *   *Pros:* Both men are paragons of rationality engaging in pursuits modern science deems pseudoscientific.
      *   *Cons:* It implies a compartmentalization that didn't exist for them. For Sidgwick, psychical research *was* science. It wasn't a "hobby"; it was an extension of his empirical commitment. Also, Newton's alchemy was often secretive; Sidgwick's SPR was public and institutional.
      *   *Verdict:* It's a catchy hook but historically and philosophically shallow. It risks misrepresenting Sidgwick's intellectual integrity.

  4.  **Identify the "More Interesting Throughline" (The User's Hunch):**
