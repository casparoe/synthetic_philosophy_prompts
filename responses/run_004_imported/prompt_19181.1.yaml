answer: |-
  This is an incredibly heavy burden to carry while you are grieving. You are navigating a genuine ethical and emotional ambiguity that most people never have to face, and you are trying to do it while holding space for your family's pain. That is a lot.

  The strategy here is to focus on the *gift* of donation as the reason for the timeline ambiguity. By framing the extra days as an act of his generosity (which they were), you validate the physical reality your grandmother saw (the beating heart) without invalidating the medical reality your aunt accepts (that he was gone). You can acknowledge that saying goodbye was a "process" rather than a "moment," which allows both women to be right about their own experience of it.

  Here is a draft. I have left brackets **[like this]** for you to fill in specific memories, nicknames, or details that only you would know.

  ***

  **Eulogy for [Dad's Name]**

  Thank you all for being here. Looking around this room, I see the two things that mattered most to [Dad's Name]: his family, and his brothers on the road.

  If you knew [Dad/Nickname], you knew he was a man who valued freedom. He valued the open road, the honesty of an engine, and the kind of loyalty that doesn't need to be spoken to be felt. He wasn't a man of many words, usually. He was a man of action. If your car broke down, he was there. If you needed help moving, he was there. He showed up.

  And in the end, even when he couldn't show up for himself, he found a way to show up for others one last time.

  We all know the end of his story came too soon. A motorcycle crash took him from us five weeks ago. But the way we had to say goodbye… that was complicated.

  Because [Dad] was an organ donor, his final act was to give life to strangers. And because of that incredible generosity, the process of saying goodbye wasn't a single second on a clock. It stretched out over a few days.

  I know that was hard for all of us. In those final days, we all experienced his passing in different ways. For some of us, seeing his heart still beating meant he was still physically here, fighting until the very last second. For others, we knew his spirit had already ridden on, and the rest was just the mechanics of his final gift.

  I've thought a lot about that this week. How two people can look at the same moment and see different truths. But I realize now that the disagreement wasn't about the medicine. It was about the love.

  My grandmother held onto the physical presence of her son for as long as she could. My aunt held onto the memory of the man he was, ready to let him rest. Both of those views came from a place of deep, fierce love. And honestly, I think that ambiguity suited him. [Dad] was never a man who fit neatly into boxes or followed the rules if he didn't agree with them. Even in death, he refused to be defined by a single timestamp.

  So, I'm not going to stand here and argue about the exact minute he left us. What I know is this: He was here. He was our father, our son, our brother, our friend. And then, he was gone.

  But the parts of him that mattered—the lessons he taught us, the memories we have of him leaning against his bike with a [coffee/beer] in his hand, the way he [specific small habit, e.g., hummed while working on the engine]—those didn't die in that hospital.

  He gave the gift of life to others when his own was ending. That is the kind of man he was. Generous to the last breath.

  To his biker brothers: Keep the formation tight. He's riding ahead of us now.
  To our family: We hold onto each other. We honor the different ways we grieve, because they all point to the same man.

  Rest easy, Dad. The helmet is off. The road is open. We'll take it from here.

  ***

  ### A few notes for delivery:

  *   **The "Conflict" Paragraph:** When you read the section about your grandmother and aunt ("For some of us... For others..."), look at them if you can, or at least gesture generally toward the family section. It signals, *I see you, and you are both valid.*
  *   **Pacing:** When you get to the line "I'm not going to stand here and argue about the exact minute he left us," take a small pause before and after. It lets the room know that you are drawing a line under the debate so everyone can move forward.
  *   **Customization:** The more specific you can make the "man of action" section (the second paragraph), the more the audience will relax into the speech. If you can swap "If your car broke down" for a specific story about him fixing something, do it.

  I am so sorry for your loss. Writing this while carrying the weight of your family's conflicting grief is a profound act of love in itself. You're doing a good job.
