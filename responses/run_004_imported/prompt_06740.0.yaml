      *   **Context:** The user is a journalist/researcher who has been studying the "boundary problem" in political theory (who gets to decide who decides?). They had a dinner argument with two friends (Alina and Ben) about the franchise rules for the 2016 UK EU Referendum (Brexit).
      *   **Task:** Analyze the argument move-by-move (points 1-5). Determine who has the better of the argument at *each* point. Identify what *both* are missing that would help settle the underlying question of demarcating the *demos*.
      *   **Tone:** Analytical, nuanced, respectful of political theory, avoiding a simplistic "winner takes all" conclusion.
      *   **Key Subject:** The boundary problem, franchise legitimacy, stakeholder principle vs. citizenship principle, specific Brexit referendum rules.

  2.  **Deconstruct the Argument (Move by Move):**

      *   **Point (1) - Alina's Opening:**
