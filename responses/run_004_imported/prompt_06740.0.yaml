          *   *Principle:* "All Affected Interests" (AAI) or Stakeholder Principle.
          *   *Strengths:* Intuitively strong on fairness. Those most impacted should have a say. Highlights the specific absurdity of the Brexit franchise (Commonwealth vs. EU).
          *   *Weaknesses:* "Stake" is hard to define objectively. Does it lead to an infinite regress (everyone in Europe affected)?
