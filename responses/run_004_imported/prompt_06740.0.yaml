          *   *Principle:* "All Subjected to Coercion" (ASC) or Citizenship/Member Principle. Pragmatism/Institutional Stability.
          *   *Strengths:* Practical necessity. Democracies need defined boundaries to function. Avoids the infinite regress problem.
          *   *Weaknesses:* Defends the status quo which Alina just showed is inconsistent (Commonwealth vs. EU). "Workable" doesn't mean "just."
          *   *Verdict:* Strong on institutional reality, weak on addressing the specific inconsistency Alina raised.

      *   **Point (3) - Alina's Rebuttal:**
          *   *Claim:* It's not even a clean citizenship line. Maltese (EU + Commonwealth) vs. Polish (EU only). It's a historical accident, not a principle.
          *   *Strengths:* Factually undeniable. Exposes the arbitrariness of the specific rule used. Undermines Ben's "bright line" defense by showing the line is jagged.
          *   *Weaknesses:* Still relies on the idea that historical accidents *invalidate* legitimacy (which Ben will challenge).
          *   *Verdict:* Very strong. She successfully pierces Ben's "citizenship is a clean proxy" defense.

      *   **Point (4) - Ben's Defense of Path-Dependence:**
          *   *Claim:* All citizenship regimes have accidents (birthright, treaties). Path-dependence doesn't disqualify legitimacy. Stability/reliability matters more than first principles. Citizenship is a reasonable proxy for stake.
