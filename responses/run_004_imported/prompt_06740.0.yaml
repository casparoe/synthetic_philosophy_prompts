          *   *Weaknesses:* Concedes the rule isn't principled, just stable. Doesn't address why *this* specific instability (excluding high-stake holders) is acceptable.
          *   *Verdict:* Strong on general theory of statehood, but sidesteps the specific harm caused in this instance.

      *   **Point (5) - Alina's Closing:**
          *   *Claim:* "Generally reliable" is the wrong test if errors cluster at the highest-stakes cases. It's not random noise; it's systematic bias against the most affected.
          *   *Strengths:* Statistical/Logical kill shot. If a proxy fails exactly where accuracy matters most, it's a bad proxy. Shifts from "is it perfect?" to "is it fit for purpose?"
