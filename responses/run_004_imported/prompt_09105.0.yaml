      *   *Correction on Move 4:* Mom mentions "irrelevant alternatives" property regarding Nash making someone worse off when options improve. This refers to *Independence of Irrelevant Alternatives (IIA)*. NBS satisfies IIA. KS *violates* IIA. However, Mom's description ("share never drops when your own opportunities get better") describes *Individual Monotonicity*. NBS violates Individual Monotonicity. KS satisfies it. So Mom is describing Monotonicity but attributing the critique to IIA logic. I need to clarify this distinction gently. She is right about the *phenomenon* (NBS can behave counter-intuitively when the feasible set expands), even if she might be conflating the axiom names. I will credit her on the intuition.

      *   *Correction on Move 5:* Rick says KS has no negotiating procedure. This is largely true; KS is axiomatic, not strategic. NBS has the Rubinstein foundation. Rick is right.

