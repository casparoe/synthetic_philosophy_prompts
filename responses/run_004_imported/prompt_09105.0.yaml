          *   *Analysis:* NBS *is* sensitive to the disagreement point. If Rick lies about the offer, NBS shifts. KS uses the *utopia point* (max possible payoff for each). Mom argues KS is less manipulable because it's about "best case" rather than a specific outside offer.
