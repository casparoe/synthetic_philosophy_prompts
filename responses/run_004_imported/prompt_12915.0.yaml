  **Move 1 (Nadia): Score 1.**
  This is the standard medical model position: clear, intuitive, and clinically actionable. It loses points only because it treats "function" as self-evident, which Marcus is about to exploit. It's a strong opening for a clinician, but philosophically naive.

  **Move 2 (Marcus): Score 2.**
  Marcus correctly identifies the philosophical weakness in "function." By citing specific evolutionary hypotheses (Analytical Rumination, etc.), he shows that what looks like a bug might be a feature. This is the strongest theoretical challenge to the medical model.

  **Move 3 (Nadia): Score 2.**
  Nadia recovers well by distinguishing between *tonic* adaptation (a bad week) and *pathological* calibration (six months/suicidal). She shifts the argument from "is this function useful?" to "is this mechanism broken?" which is harder for Marcus to dismiss.

  **Move 4 (Marcus): Score 1.**
  Marcus is technically correct that Nadia shifted from an *etiological* definition (history of selection) to a *causal-role* definition (current calibration). However, in medicine, "broken calibration" is often all that matters, so his point is philosophically sharp but clinically pedantic.

  **Move 5 (Nadia): Score 1.**
  Nadia adopts a pragmatic DSM-style stance: harm + impairment = disorder. This is how psychiatry actually works, but it leaves her vulnerable to the "grief" counter-argument because she explicitly drops the "dysfunction" requirement.

  **Move 6 (Marcus): Score 2.**
  This is Marcus's checkmate move. Citing Wakefield's "Harmful Dysfunction" analysis and the grief/bereavement example exposes the flaw in Nadia's pragmatic definition. If harm alone defines disorder, then normal grief is a disease, which is an unacceptable conclusion.

  **Move 7 (Nadia): Score 2.**
  Nadia parries the grief argument not with evolution, but with phenomenology (tracking vs. generalizing). This is a clinically robust distinction that saves her position without needing to win the evolutionary debate. It's a draw, but a strong one.

  ***

  **Verdict for the Novel:**

  This is a **genuine standoff**, and that is exactly why it will work for your narrator's crisis.

  Nadia is arguing from the **Clinical Necessity** standpoint: to treat a patient, you must act *as if* the diagnosis is real and the system is broken. If she waits for evolutionary proof, she can't help the suicidal patient in front of her. Marcus is arguing from the **Conceptual Integrity** standpoint: if you define the disorder incorrectly, you medicalize normal human suffering (like grief) and misunderstand the patient's experience.

  For a psychiatrist narrator starting to distrust her diagnoses, Marcus represents the creeping doubt (theoretical uncertainty), while Nadia represents her training (pragmatic action). The tension isn't about who is "right"; it's about whether a doctor is allowed to use a tool (diagnosis) she suspects might be philosophically flawed. If your narrator sides entirely with Nadia, she stops doubting. If she sides with Marcus, she stops treating. The novel lives in the space where she has to do both.
