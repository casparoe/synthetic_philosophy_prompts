      *   *Check:* Is the recommendation actionable? *Adjustment:* Make the guardrails specific (e.g., "one-click override," "explicit opt-in").
      *   *Check:* Is the CEV connection clear? *Adjustment:* Use it in the opening to frame the philosophical weight.

  7.  **Final Polish:** Check for clarity, flow, and professional formatting. (The resulting memo should look like it belongs in a board packet.)

