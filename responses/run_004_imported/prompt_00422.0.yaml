prompt: |-
  A close friend who works at a mid-stage startup has offered to sell me a slice of his vested equity in a private secondary deal, at a price that values the company noticeably below what I understand the last funding round implied. He insists the sale has nothing to do with his view of the company's prospects — he says he's still bullish and is only parting with a fraction of his stake because he needs cash for a house down payment. The price is tempting, but something about the situation nags at me: he has far more visibility than I do into things like churn, hiring, and runway, and he's the one initiating the trade. I keep circling back to the thought that if he genuinely believed the shares were worth more, why would he be selling to me at all, personal liquidity needs notwithstanding — shouldn't he just borrow against the stake, or sell to someone with less access to information than me? Is my hesitation well-founded, or am I overanalyzing an ordinary transaction between a well-informed insider and a cautious outsider? I'd like to understand what's actually going on here conceptually — what should I make of his stated reason for selling, and how much should it change my willingness to take the other side of this trade?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The Offer:** A close friend at a mid-stage startup wants to sell vested equity to the user via a private secondary deal.
      *   **The Price:** Below the last funding round's implied valuation (a discount).
      *   **The Friend's Rationale:** Needs cash for a house down payment. Claims to remain bullish on the company. Selling only a fraction.
      *   **The User's Hesitation:** Information asymmetry (friend knows more about churn, hiring, runway). Why sell to me if it's undervalued? Why not borrow against it?
      *   **The Core Question:** Is this hesitation well-founded? What's going on conceptually? How should this affect the decision?

  2.  **Deconstruct the Dynamics:**
      *   **Information Asymmetry:** This is the biggest red flag. The friend is an insider; the user is an outsider. In financial markets, when an insider sells to an outsider, the outsider must assume the insider knows something they don't (Akerlof's "Market for Lemons").
      *   **Liquidity vs. Value:** The friend needs liquidity *now*. Private equity is illiquid. Secondary markets exist specifically for this friction. The discount reflects the illiquidity premium + risk.
      *   **Incentive Alignment:** If the friend sells *all* shares, that's a huge signal. Selling a *fraction* is more neutral. However, even selling a fraction suggests they value cash *now* more than potential upside *later*.
      *   **Alternative Options:** Why not borrow? Loans against private stock are rare, expensive, and usually reserved for late-stage (pre-IPO) companies with very clear valuation. Mid-stage is too risky for most lenders.
      *   **Relationship Dynamics:** Mixing money and friendship. If the company fails, does the user resent the friend? If it moons, does the friend resent the user?

  3.  **Evaluate the "Why Sell to Me?" Question:**
      *   *Friend's perspective:* Secondary deals are hard to find. Buyers need to be accredited investors. They need to be trusted (company approval often required). A friend is a low-friction buyer.
      *   *User's perspective:* "If it's so good, keep it." But if you *need* cash for a house, you *need* cash. You can't eat equity.
      *   *The Discount:* Why below the last round? Because the last round price is often a "paper valuation" with preferential rights (liquidation preferences) that common stock (employee options) doesn't have. Common stock is worth less than Preferred stock. A discount is standard, not necessarily a signal of doom.

  4.  **Conceptual Frameworks to Apply:**
      *   **Adverse Selection:** The seller knows more than the buyer. The buyer must discount the price to account for the risk of bad information.
      *   **Liquidity Premium:** Private assets are worth less than public ones because you can't sell them easily.
      *   **Common vs. Preferred Stock:** Employees hold common stock. Investors hold preferred. In a downside scenario, preferred gets paid first. Therefore, common stock is inherently riskier and worth less than the headline valuation suggests.
      *   **Signaling Theory:** Selling a small amount for a specific life event (house) is a weaker negative signal than selling everything quietly.

  5.  **Drafting the Advice (Iterative Process):**

      *   *Validation:* Start by validating the user's instinct. It *is* well-founded. It's not overanalyzing; it's prudent skepticism.
      *   *The "Lemon" Problem:* Explain information asymmetry clearly.
      *   *The Valuation Nuance:* Explain why the "last round price" is misleading (Preferred vs. Common). This is crucial. The discount might be normal, not a distress signal.
      *   *The Liquidity Constraint:* Address the "why not borrow" point. Loans on mid-stage stock are nearly impossible.
      *   *The "Fractional" Signal:* Distinguish between selling 10% vs. 100%.
      *   *Relationship Risk:* Don't ignore the personal aspect.
      *   *Actionable Due Diligence:* What should the user ask/check? (409A valuation, company approval, right of first refusal).

  6.  **Refining the Tone:**
      *   Needs to be objective, financially literate, but empathetic to the friendship.
      *   Avoid saying "Don't do it." Instead, say "Here is how to price the risk."
      *   Highlight that the friend's rationale is plausible *but* the structural risks remain.

  7.  **Key Insight to Emphasize:** The biggest conceptual misunderstanding is usually the difference between the *Preferred Price* (VC price) and the *Common Price* (Employee price). The user thinks the discount is a signal of trouble; it might just be the fair market value difference. However, the insider selling *at all* is still a risk factor.

  8.  **Structure of the Response:**
      *   **Executive Summary:** Your hesitation is rational.
      *   **Concept 1: Information Asymmetry (The Core Worry).**
      *   **Concept 2: Valuation Reality (Preferred vs. Common).**
      *   **Concept 3: Liquidity & Alternatives (Why not borrow?).**
      *   **Concept 4: Signaling (Fractional vs. Total).**
      *   **Concept 5: Relationship Risk.**
      *   **Decision Framework/Checklist.**

  9.  **Self-Correction/Edge Case:**
      *   *Wait, is the deal legal?* Need to mention company approval/ROFR. Many startups block employee secondaries.
      *   *Accredited Investor?* User needs to be accredited to buy private securities legally (Rule 506(b) etc.).
      *   *Tax implications?* 83(b)? Capital gains? Keep it high-level but mention it.

  10. **Final Polish:** Ensure the distinction between "friend is scamming me" (unlikely) and "friend is rational but I lack data" (likely) is clear. The friend isn't necessarily bearish, but they are prioritizing certainty (cash) over uncertainty (equity). The buyer is taking the uncertainty.

  *(Self-Correction during drafting)*: I should make sure not to give specific financial advice, but rather conceptual frameworks. Use phrases like "Generally speaking" or "From a financial theory perspective."

  11. **Final Review against User Prompt:**
      *   Did I answer "Is hesitation well-founded?" Yes.
      *   Did I address "Why sell to me?" Yes.
      *   Did I address "Why not borrow?" Yes.
      *   Did I explain the conceptual dynamics? Yes.

