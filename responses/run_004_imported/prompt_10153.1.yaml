answer: |-
  Paris, 1649. The winter air in the study was thin enough to sharpen the mind, or so Elias Vautour told himself as he trimmed a quill. On the desk before him lay two objects: a brass escapement mechanism, disassembled, and a spaniel named Brutus, whose hind leg was splinted with wood and linen.

  Elias dipped the pen. He was composing a tract on the nature of sensation, and the logic was exquisite. To believe the beast felt pain was to invite chaos into the soul. If a dog suffered as a man suffered, then the soul was not a singular flame but a diffuse heat, present in all flesh. But if the dog was a machine, constructed by the Divine Watchmaker with hydraulic nerves and animal spirits, then its cries were merely the friction of un-oiled gears. It was a mercy, this doctrine. It spared the surgeon the guilt of the knife and the philosopher the confusion of the hierarchy.

  Brutus whined. A high, thin sound.

  Elias did not look up. "The disposition of your organs is agitated," he said softly. "The spirits rush to the site of the fracture. The vocal cords vibrate. It is no more a plea than the creak of a hinge."

  He reached out and adjusted the splint. Brutus flinched, a sharp contraction of the thigh muscle. Elias noted it with clinical satisfaction. It was a reflex, a pull-string mechanism. If one were to prick a dead man's foot, the leg might kick; why, then, should a living dog's kick imply a mind? The body was an automaton. Only the *res cogitans*, the thinking thing, could wield language as a universal instrument. A parrot could speak words, but it could not answer whatever was said in its presence. A clock could keep time better than a sage, but it could not tell the hour in a new tongue. Brutus was a clock of flesh and blood.

  Elias picked up the escapement. He fitted the gear into the plate. It clicked. Satisfying. Deterministic.

  He turned back to the dog. The injury was healing, but the beast was lethargic. Elias felt a pang of something—affection, perhaps, or habit. He sought to categorize it. Affection was merely a recognition of utility. The dog warmed his feet; he fed the dog. A reciprocal mechanism.

  "Show me reason, Brutus," Elias murmured, testing the conviction as one tests a loose tooth. "Speak."

  The dog lifted its head. Its ears were drooped, the cartilage soft. It did not bark. It did not growl. It simply looked at Elias.

  This was the danger point. The strict Cartesians warned against the seduction of the eyes. The eye was a lens, nothing more. But in that gaze, Elias sought the universal instrument. He wanted to see the blankness of the machine. He wanted to see the clockwork.

  Brutus shifted. He did not lick the wound, which would have been a localized disposition to soothe irritation. Instead, the dog dragged his injured body across the rug, toward the cold hearth where a log had rolled loose. Brutus nudged the log with his nose, pushing it closer to the embers, then turned his head back to Elias, shivering.

  Elias froze. The pen hovered over the paper.

  The action was not a reflex. It was not a specialized skill like hunting or begging. It was an adaptation to a novel situation: the master was cold, the fire was dying, the leg was broken. The dog had assessed the environment, identified a deficit in warmth, and acted to correct it, despite his own pain. It was a rudimentary use of the universal instrument. It was not language, but it was *intent* divorced from immediate stimulus.

  Elias set the pen down. The silence of the room grew heavy, pressing against the brass gears on the desk.

  If Brutus could reason thus, then the hinge did not creak; it complained. If the dog could act for the comfort of another, he possessed a spark of the *res cogitans*. And if he possessed that, then the splint was not a repair; it was a torture. The whine was not friction; it was sorrow.

  Elias looked at his hands. They were the hands of a man who believed he lived in a world of clean lines and distinct substances. Now, the lines blurred. The warmth he felt for the dog was no longer a mechanical utility; it was a recognition of kinship. And if kinship existed here, where did it end? Did the horse feel the whip? Did the ox feel the yoke? The doctrine collapsed the barrier between man and beast, threatening to drown the soul in a sea of universal suffering.

  He reached out and placed his hand on Brutus's head. The dog leaned into the touch, closing his eyes.

  Elias withdrew his hand as if burned. He could not write the next sentence of his tract. The logic remained sound—the dog could not conjugate a verb, could not discuss virtue—but the mechanism had moved in a way the blueprint did not allow.

  He stood and walked to the window. The Seine was gray and iron-hard below. He had built a philosophy to protect himself from the scream of the world, to render the universe intelligible and the conscience clear. But the dog lay quiet behind him, warm now near the fire, and the silence was louder than any cry.

  Elias picked up the pen again. He dipped it in the ink. He looked at the paper, then at the dog. He blew out the candle, leaving the room to the twilight and the ticking of the clock, which suddenly sounded less like a machine and more like a heartbeat. He would not write tonight. The universal instrument had played a note he could not transcribe.
