      *   *The "User" aspect:* In AI, there is an external user. In biology, the organism is the user. This introduces "derived intentionality."
      *   *Interpretability:* Engineers want to know *how* it works, not just *that* it has content. Teleosemantics gives a "that," not a "how."

  6.  **Polishing the Tone:**
