      *   *The Footnote:* Nozick asks, "Are there any beings other than individuals who have rights? ... What about animals?" He suggests that perhaps animals don't have rights (side-constraints) but are subject to a utilitarian calculation regarding suffering.
      *   *The Tension:* Nozick admits this is uncomfortable. He famously asks, "But are there no limits to what can be done to them? ... Utilitarianism for animals, Kantianism for people?" He doesn't resolve it definitively but leans towards the idea that rights correlate with certain capacities (moral agency, rationality) that animals lack, yet they still matter morally.
      *   *Key Distinction:* Rights (inviolability) vs. Moral Status (weight in utility calculus).

  3.  **Analyze the User's Case (Dog vs. Pig):**
