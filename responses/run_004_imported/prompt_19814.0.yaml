answer: |-
  Given your background in statistical mechanics, you will appreciate that this is not merely a historical curiosity but a question about the ontology of probability: are we averaging over an ensemble of possible worlds (Bernoulli/Samuelson), or are we averaging over the time trajectory of a single system (Kelly/Peters)?

  If Daniel Bernoulli were briefed on this dispute, **he would side with Paul Samuelson on the logical structure of the decision problem, while rejecting Samuelson's agnosticism about the utility function.** He would fundamentally reject the "Geometric Rationality" claim that the logarithmic rule is mandated by the dynamics of wealth rather than the psychology of valuation.

  Here is the detailed justification, grounded in the presuppositions of his 1738 *Specimen Theoriae Novae de Mensura Sortis*.

  ### 1. The Nature of the Expectation: Ensemble vs. Time
  The core of the modern "Geometric Rationality" argument (championed by Ole Peters and others) is that Expected Utility Theory (EUT) commits a category error by maximizing an **ensemble average** (expected value) in a non-ergodic system, whereas rational agents should maximize the **time average** (growth rate).

  Bernoulli's 1738 argument is explicitly and unapologetically an **ensemble average**.
  When Bernoulli resolves the St. Petersburg paradox, he does not argue that the player will play the game infinitely many times. He argues that for a *single* decision to purchase a ticket, the "mathematical expectation" (the arithmetic mean of monetary outcomes) is the wrong metric. He replaces it with the "moral expectation" (the arithmetic mean of *utility* outcomes).

  Mathematically, Bernoulli proposes maximizing:
  $$ \mathbb{E}[U] = \sum_{i} p_i \ln(w_i) $$
  This is an expectation value over the probability space of outcomes (an ensemble). He does not derive this from the limit of a product of wealths over time ($\lim_{T\to\infty} (W_T/W_0)^{1/T}$). He derives it from the axiom that the "value of a small increase in wealth is inversely proportional to the quantity of goods already possessed."

  If Bernoulli were told that his formula is only valid because it approximates a long-run time average, he would object. His solution is designed specifically to price a **single gamble** for an agent with a **fixed initial wealth**. He calculates the "equivalent certain wealth" that yields the same utility as the gamble. This is a static, cross-sectional valuation, not a dynamical survival strategy. Therefore, he would agree with Samuelson that the justification for the decision rule must hold for the single shot, not rely on the Law of Large Numbers.

  ### 2. The Origin of the Logarithm: Psychophysics vs. Dynamics
  The coincidence of the logarithmic function is the source of the confusion, but the *derivations* are ontologically distinct.

  *   **Kelly/Peters (Dynamical):** The logarithm arises because wealth dynamics are multiplicative ($W_{t+1} = W_t \cdot X$). To make the process additive and ergodic, one must take the log. The log is a property of the *money*.
  *   **Bernoulli (Axiological):** The logarithm arises because human sensitivity to wealth is diminishing. He posits a differential relationship $dU = k \frac{dw}{w}$. The log is a property of the *mind*.

  Bernoulli would view the Geometric Rationality argument as a category mistake. He introduced the concept of *utility* precisely to decouple rational choice from the physical dynamics of the object being gambled. For Bernoulli, rationality is defined by coherence with human valuation, not coherence with wealth maximization over time.

  If an agent preferred a square-root utility function (reflecting a different psychophysical sensitivity), Bernoulli's framework allows for this (and indeed, he discusses how different agents might value things differently based on their circumstances). The Geometric Rationality argument, however, claims that *any* agent who maximizes a different function is objectively irrational because they will underperform in the long run. Bernoulli would reject this. He would argue that an agent maximizing square-root utility is rational *for them*, even if their wealth grows slower than the Kelly criterion, because they are maximizing their own "moral expectation."

  ### 3. The Samuelson Connection: The Defense of Single-Shot Rationality
  Paul Samuelson's critique of the Kelly criterion (specifically in his 1971 paper "The 'Fallacy' of Maximizing the Geometric Mean") is that maximizing long-run growth does not necessarily maximize expected utility for a finite horizon, and that one should not impose the long-run constraint on a single decision.

  Bernoulli would find himself in strong agreement with Samuelson here. Bernoulli's 1738 paper is essentially a treatise on **single-decision rationality**. He asks: "What is the fair price for this ticket *now*?" He does not appeal to the agent's future trajectory to justify the price.

  Bernoulli would likely view the Geometric Rationality advocates as committing the very error he sought to avoid: confusing the physical quantity (money/wealth dynamics) with the moral quantity (utility/valuation). By claiming that the growth rate *is* the utility, Geometric Rationality attempts to dissolve the subjective component that Bernoulli worked so hard to establish.

  ### 4. Where Bernoulli Would Disagree with Samuelson
  While Bernoulli sides with Samuelson on the *framework* (Expected Utility applied to single decisions), he would sharply criticize Samuelson's **revealed preference** agnosticism.

  Samuelson's tradition suggests that utility functions are arbitrary representations of preference; if you prefer risk, use a convex $U$; if risk-averse, use concave. Bernoulli, however, believed he had discovered a **natural law** of human valuation. He did not propose the logarithm as *one possible* utility function, but as *the* utility function dictated by the nature of human perception (anticipating the Weber-Fechner law in psychophysics).

  So, Bernoulli's position would be a hybrid:
  1.  **Against Peters:** The logarithmic rule is not mandated by ergodicity or time-averaging. It is mandated by human psychology. EUT is not "wrong"; it is the correct framework.
  2.  **Against Samuelson:** The utility function is not arbitrary. While the framework of EUT is correct, the specific form $U(w) = \ln w$ is normatively superior because it aligns with the fundamental structure of human valuation, not just individual whim.

  ### Conclusion
  Bernoulli would side with **Samuelson** in the dispute over the **validity of Expected Utility Theory for single decisions.** He would reject the claim that EUT is invalid due to non-ergodicity. He would argue that he *invented* Expected Utility precisely to handle non-ergodic problems (like the St. Petersburg paradox) by transforming the variable *before* averaging.

  However, he would view the Geometric Rationality proponents as having stumbled upon his formula via a different route (dynamics instead of valuation) and mistakenly believing that the dynamical route supersedes the valuational one. For Bernoulli, rationality is about maximizing "moral expectation" (subjective value), not "physical growth" (objective wealth), even if the two happen to coincide for the logarithmic function.

  In short: **Bernoulli is the father of Expected Utility, not the grandfather of Ergodicity Economics.** He would defend his legacy (EUT) against the claim that it needs to be replaced by time-average growth maximization.
