answer: |-
  Good evening, everyone. For those who don't know me, I work with Marisol in Systems Engineering.

  Twenty-three years is a long time to spend anywhere. In tech, it's an eternity. Usually, when we honor that kind of tenure, we talk about uptime, or architecture, or the crises averted at 3:00 AM. Marisol has plenty of those stories. She is, by any professional metric, exceptional.

  But tonight, I've been asked to speak about the person behind the engineer. And this puts me in a delicate position.

  Many of you know that for nearly every one of those twenty-three years, Marisol spent her Saturday mornings running a robotics club for children in the foster care system. She funded it herself. She organized it herself. And for twenty-three years, she declined to talk about it. She turned down company sponsorship. She turned down features on the careers blog. When I once asked her why she kept it so quiet, she told me that being recognized for it would make it "stop being mine."

  HR has asked me to use this moment to encourage others to get involved in the community. And I understand why. Looking at what Marisol did, the natural reaction is to think, "That is what a good person does."

  But if I stand here and imply that this is simply what we *should* all be doing, I run into a problem. First, it disrespects Marisol, who never wanted to be a moral benchmark. Second, it turns her gift into a debt. If her actions become our obligation, then her generosity becomes our guilt. And I don't think any of us learn to be better people through guilt.

  There is a concept in ethics that fits this situation perfectly. For the three philosophy PhDs I know are in the room, you'll recognize it: *supererogation*.

  In plain English, a supererogatory act is one that is good to perform, but not wrong to omit. It is beyond the call of duty. It occupies a rare space where an action is praiseworthy precisely because it was optional.

  This distinction matters. If we treat Marisol's Saturdays as a duty, we diminish them. Duty is the baseline; it's the price of admission for being a decent member of a society. We don't throw parties for people who pay their taxes or don't steal cars. We expect that.

  But what Marisol did was not the baseline. It was extra. It was a surplus of care that she was under no contract—professional or moral—to provide. The value of her work with those kids wasn't just in the robotics; it was in the freedom of the choice. She gave that time because she wanted to, not because she had to.

  If I frame this as a standard for all of us to meet, I collapse that category. I turn a gift into a requirement. And if I frame it as "nothing special, anyone could do it," I lie about the sacrifice involved. Twenty-three years of Saturdays is a massive portion of a human life.

  So, how do we honor this without making everyone else feel inadequate?

  We acknowledge the gift *as* a gift.

  The point of supererogation isn't to make the rest of us look bad for staying within the bounds of duty. It's to remind us that there *are* bounds, and that there is beauty in voluntarily stepping past them. Marisol's example isn't a mirror for us to judge our own shortcomings. It's a window into what's possible when passion meets opportunity.

  HR wants a nudge. Here is the nudge: Look for the things that you would do even if no one ever knew. Look for the work that, if you were praised for it, might feel like it "stopped being yours." That is where the real work lives. Not in the metrics we hit for the company, but in the projects we undertake for ourselves.

  Marisol, you kept this quiet to protect the integrity of the work. Tonight, we break that silence not to claim credit for you, but to say thank you for letting us witness it. You showed us that while our job descriptions have limits, our capacity to contribute does not.

  Please raise your glasses.

  To Marisol. For the systems you kept running, and for the ones you built on your own time. May your retirement be filled with the same freedom you gave to those kids, and the same joy you found in giving it.

  To Marisol.
