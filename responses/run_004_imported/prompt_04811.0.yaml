prompt: |-
  I'm the treasurer of my high school's investment club, which manages a small fund seeded by alumni donations. Our research team has flagged several independent trades for this month, each with an estimated win probability and payout, and our board is split over position sizing. Some members want every position sized to maximize the fund's expected value outright; others, having just covered the Kelly criterion in our probability elective, want fractional-Kelly sizing instead, since compounding makes ruin a real risk under pure expected-value maximization. A fifth member counters that this is really just a disagreement about the club's risk tolerance dressed up as a disagreement about rationality, and wants that addressed before anyone votes. Please draft the short memo I'll bring to our board meeting this Thursday: recommend one concrete position-sizing policy for this month's trades, specify when we'll revisit it, and respond directly to the fifth member's challenge rather than simply asserting that Kelly or expected-value maximization is the rational choice.
