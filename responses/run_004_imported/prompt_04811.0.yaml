      *   **Conflict:**
          *   Group A: Maximize Expected Value (EV) outright (aggressive).
          *   Group B: Fractional Kelly (conservative/compounding focus).
          *   Group C (The "Fifth Member"): Argues this is about *risk tolerance*, not rationality. Wants this addressed before voting.
      *   **Task:** Draft a short memo for Thursday's meeting.
      *   **Requirements:**
          1.  Recommend one concrete position-sizing policy.
          2.  Specify when to revisit it.
          3.  Respond directly to the fifth member's challenge (risk tolerance vs. rationality).
          4.  Do *not* simply assert Kelly or EV is the only rational choice.

  2.  **Determine the Strategy:**
      *   **Tone:** Professional, collaborative, educational (it's a high school club), and decisive (it's the Treasurer speaking).
      *   **The "Fifth Member" Point:** They are correct. EV maximization leads to ruin over time (volatility drag), while Kelly is mathematically optimal for *geometric* growth *if* probabilities are known perfectly. However, in the real world (and especially with estimated probabilities), full Kelly is too volatile for most investors. The choice *is* fundamentally about how much drawdown the club can stomach. I need to validate this point to build consensus.
      *   **The Recommendation:** Full EV maximization is too risky for a school club (reputation risk, alumni relations). Full Kelly is too aggressive for estimated probabilities (overbetting leads to ruin). *Half-Kelly* is the standard compromise. It offers ~75% of the growth with ~50% of the volatility. It acknowledges the uncertainty in the research team's probabilities.
      *   **Revisit Date:** End of the semester or after a specific number of trades. Let's say end of the semester to align with the academic calendar.

  3.  **Drafting - Section by Section:**

