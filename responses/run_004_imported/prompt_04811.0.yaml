answer: |-
  **MEMORANDUM**

  **TO:** Investment Club Board of Directors
  **FROM:** Treasurer
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Position Sizing Policy

  **Context**
  This month's research slate presents a classic portfolio construction problem. We have independent trades with positive expected value, but we must decide how much capital to allocate to each. The debate has centered on maximizing single-period Expected Value (EV) versus maximizing long-term geometric growth via the Kelly Criterion.

  **Addressing the Risk Tolerance Challenge**
  Before voting, we must address the valid point raised regarding risk tolerance. The argument that this is a disagreement about utility rather than rationality is correct.

  Mathematically, maximizing arithmetic EV is "rational" only if we treat each trade as an isolated event we can repeat infinitely with infinite capital. That is not our reality. We are managing a finite pool of alumni donations with a mandate to preserve capital while learning. If we maximize EV on every trade, volatility drag will likely lead to ruin over time, even if the average outcome looks good on paper. Conversely, aggressive Kelly sizing assumes our probability estimates are perfect; if our research overestimates win rates, full Kelly leads to rapid drawdowns.

  Therefore, the "rational" choice is defined by our constraints: we are risk-averse relative to a hedge fund because we cannot accept a total loss of the seed fund without damaging the club's reputation and alumni relationships.

  **Recommendation: Half-Kelly Sizing**
  I recommend we adopt a **Half-Kelly** position-sizing policy for this month's trades.

  *   **The Policy:** We will calculate the optimal Kelly fraction for each trade based on the research team's probability and payout estimates, then execute at 50% of that size.
  *   **The Rationale:** This directly addresses the risk tolerance concern. Half-Kelly captures approximately 75% of the theoretical growth rate of full Kelly but reduces volatility and drawdown risk by roughly 50%. It provides a safety margin for estimation errors in our research (acknowledging we are students, not quant funds) while still utilizing compounding logic rather than simple EV maximization.

  **Review Timeline**
  We will revisit this policy at the **end of the Spring Semester**. At that time, we will review our actual win rates versus projected probabilities and assess whether the volatility experienced aligns with the board's comfort level.

  **Next Steps**
  Please review the attached trade slate with this sizing constraint in mind. I propose we vote to adopt this policy at the start of Thursday's meeting to allow time for execution before the market close.

  Thank you for the rigorous debate; it demonstrates the exact kind of risk awareness our alumni expect us to learn.
