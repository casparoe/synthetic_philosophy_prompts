answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Carol's niece/nephew.

  When I was asked to say a few words, I wanted to find the right way to measure thirty-four years. How do you quantify a career spent arguing for trees that take centuries to grow, for a river that was here long before the state lines were drawn?

  I found myself thinking about a philosopher named Derek Parfit. Now, I see some of Carol's colleagues smiling in the back—I know you know the name. Parfit wrote about something called the "Nonidentity Problem." It's a bit of a brain-twister, but stick with me.

  He asked: When we choose to conserve resources for the future rather than use them up now, who are we actually helping?

  Intuitively, we say, "We're saving this forest for our grandchildren." But Parfit pointed out that our policies change the future in massive ways. If we deplete the resources, the economy shifts, people move differently, meet differently, and have children at different times. If we conserve, the future looks different. The specific people who are born in fifty years under a Conservation policy are not the same specific people who would have been born under a Depletion policy.

  So, technically, Carol didn't make specific future people "better off" than they otherwise would have been. Because the people who would have existed in a depleted world... wouldn't exist at all.

  For a while, this kept me up at night. Because if you can't point to a specific child and say, "She saved *you*," then what was all the fighting for? What were the late nights, the stalled legislation, the mud on the boots actually for?

  But then I realized that this isn't a bug in Carol's career. It's the feature.

  Most of us do things for people we know. We cook for our partners, we teach our students, we build for our clients. But Carol? Carol spent three decades working for people she knew she would never meet. People whose names she doesn't know. People whose very existence depends on the work she did.

  She didn't conserve this land to give a specific person a benefit. She did it because she believed that *whoever* ends up here deserves to walk through old growth. She believed that a world with these rivers in it is a better world than a world without them, regardless of who is walking the banks.

  That is a radical kind of love. It's love without the expectation of recognition. It's stewardship without a receipt.

  To the family and neighbors here: Yes, she saved the river for us. But more than that, she saved *us* from becoming the kind of people who would let it go. She taught us that we are trustees, not owners. That we are links in a chain, not the end of the line.

  And to her colleagues: You know better than anyone how hard it is to argue for a future you won't see. You know the weight of that Parfitian puzzle. But watching Carol, I think we find the answer. The value isn't just in the outcome for a specific person. The value is in the act of care itself. By protecting the forest, she made us a people capable of protecting forests.

  So, Carol, you may not have saved specific people. But you saved the *place*. And in doing so, you gave all of us—past, present, and whoever comes next—a home that is worthy of us.

  If everyone could please raise a glass.

  To Carol. For the trees that are still standing, for the river that keeps running, and for the future you trusted us to hold.

  To Carol.
