answer: |-
  This is not a dumb question. In fact, you have accidentally stumbled into one of the classic problems of social ontology and political philosophy. You are asking about the **normative force of informal conventions.**

  You want to know where the "should" comes from when no one ever said "should." Here is the breakdown of why Mia feels violated, why your group sided with her, and whether that feeling is philosophically legitimate.

  ### 1. The David Lewis Argument: Conventions as Coordination Equilibria
  The philosopher David Lewis wrote a whole book (*Convention*) on exactly this. He argues that many social rules arise not from contracts, but from **coordination problems.**

  Imagine two people driving toward each other on a narrow road. There is no law saying "drive on the right." But if you both swerve left, you crash. If you both swerve right, you pass safely. It doesn't matter *which* side you pick, it only matters that you pick the *same* side.

  Once a pattern is established (we all drive on the right), it acquires normative force. Why? Because **deviating creates cost.**
  *   **The Randomness Doesn't Matter:** You asked if it matters that the arrangement was random. Lewis would say: Absolutely not. Whether we drive on the left or right is arbitrary, but once the convention is set, violating it is irrational because it disrupts the coordination.
  *   **The "Should":** The "should" comes from the mutual expectation of stability. Mia sits there; the professor expects her there; the classmates expect her there. The new girl disrupted the equilibrium.

  **Verdict:** Mia is "right" in the sense that she is upholding a coordination convention that benefits the group (orderly seating), even if the specific assignment was arbitrary.

  ### 2. The H.L.A. Hart Argument: The Professor's "Secondary Rule"
  This is where your specific detail about the **graded essays** becomes crucial. This moves the situation from a pure social convention to a quasi-legal system.

  Legal philosopher H.L.A. Hart distinguished between primary rules (don't steal) and secondary rules (rules about how rules are made/recognized).
  *   **Weeks 1–8:** The seating was a customary norm (like Lewis's driving example).
  *   **Week 9:** The professor inadvertently created a **bureaucratic identifier.** By handing back papers based on location, the professor turned the *seat* into a *name tag.*

  When the new girl sat in Mia's seat, she didn't just take a chair; she disrupted the administrative order of the classroom. If the professor walks in and puts Mia's essay on the desk, and the new girl is sitting there, the system glitches.
  *   **The "Should":** Here, the "should" comes from **reliance.** Mia relied on the stability of that seat to efficiently receive her property (the essay). The professor relied on it to distribute labor.
  *   **Legitimacy:** This gives Mia a much stronger claim than just "territory." She has a **functional claim.** The seat has become part of the mechanism of the class.

  ### 3. The Lockean Labor Mix (Why it feels like "Hers")
  John Locke argued that property rights are established when you mix your labor with an unowned resource.
  *   Mia has "mixed her labor" with that chair for eight weeks. She has worn it down, oriented her body to its specific angle, and built her classroom experience around that specific vantage point.
  *   **Phenomenology:** To Mia, that chair isn't a generic object; it is an extension of her presence in the room. When the new girl sits there, it feels like a bodily violation because Mia's "self" is partially constituted by her habitual place in that social space.
  *   **The Randomness:** Again, it doesn't matter that it could have been a different chair. Once the "labor" (habitual attendance) is invested, the specific object becomes imbued with rights.

  ### 4. The Newcomer Problem (Why the new girl isn't "evil")
  So, if Mia is right, is the new girl wrong?
  In social philosophy, there is a distinction between **internal** and **external** points of view.
  *   **Internal:** The existing students (Mia) are inside the norm. They feel the obligation.
  *   **External:** The new girl is outside the norm. She cannot be bound by a convention she didn't know existed.

  However, usually, newcomers are expected to observe and assimilate. In a small seminar (15 people), the "seating chart" is usually visible by week 2. By week 9, sitting in a random empty chair in a tight-knit circle is a minor social faux pas. She violated the **presumption of established order.**

  ### The Answer to Your Question

  **Is Mia onto something real?**
  **Yes.** She is not just being tribal. She is identifying a genuine **social fact.**
  A social fact is something that exists only because we collectively agree it exists (like money, borders, or seating arrangements). Even though no one signed a contract, the collective intentionality of the group + the professor's administrative habit created a **normative reality.**

  **Where does the "should" come from?**
  It comes from **predictability.** Social life requires us to predict the behavior of others to function smoothly.
  1.  **Efficiency:** It saves time if we know where everyone sits (for papers, for discussion).
  2.  **Security:** It allows individuals to feel secure in their environment.
  3.  **Fairness:** First-come, first-served is a deeply ingrained heuristic for fairness. Mia was there first (over time).

  **The Catch:**
  While Mia is *normatively* right (the norm was violated), she is *politically* weak. Because the rule was never codified, she cannot enforce it without looking crazy. To enforce a norm that everyone pretends doesn't exist is to break the social contract of "polite fiction."

  **Conclusion:**
  You weren't being weirdly tribal. You were recognizing an **implicit contract.** The "should" is real because the cost of disrupting the pattern (confusion, annoyance, administrative friction) outweighs the benefit of the new girl having that specific chair.

  Mia's complaint is legitimate, but her expectation of *recourse* is not. She has the right to be annoyed, but she doesn't have the right to evict. The "should" exists, but it is enforced by social awkwardness, not by justice.

  Tell Mia she's philosophically vindicated, but practically stuck. And tell your group you just did a semester's worth of social philosophy theory in 40 minutes. You're welcome.
