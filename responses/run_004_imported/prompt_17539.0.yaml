answer: |-
  The two families of the High Ridge, the Kaelens and the Vorns, had survived a century of volatile seasons through the Pact of the Bin. The ridge was split by a geological fault; in wet years, the Kaelen slopes flooded while the Vorns thrived on the dry dust. In dry years, the reverse held. Neither could predict the rain, but together, they could smooth the hunger. They agreed to dump every harvest into a central stone bin and split the contents equally. Uncertainty was the mortar of their trust; because neither knew who would need the charity, both agreed to give it.

  Then came the Oracle Seed.

  It was a botanical curiosity found in the lower valleys, a bulb that bloomed weeks before planting. Its petals turned deep blue if the coming season would be wet, crisp red if dry. It was perfect information.

  Elder Kaelen was the first to plant one. His reasoning was simple: if he knew the weather, he could choose the right crops. Wheat for dry, rice for wet. Ignorance was waste. To not look at the bloom would be to leave bushels in the field. By Good's logic, the information had value; it could only expand his options, never shrink them. He told no one, but Vorn saw the sprout and planted his own. Rationality was contagious. If Kaelen knew the future and Vorn did not, Vorn would be exploited in the next harvest negotiation. Both families planted the seeds.

  The blooms opened on a Tuesday. Both were red. A dry year.

  In the past, this moment would have been shrouded in mist. They would have planted cautiously, harvested meagerly, and pooled the risk. But now, the future was fact. Kaelen looked at his red petals, then at Vorn's flooded lower fields, which would turn to dust in the coming heat.

  "We should fill the Bin," Vorn said, though his voice lacked its usual conviction. He knew his land would fail. He needed the insurance.

  Kaelen looked at his own drought-resistant seeds, ready to thrive in the red season. He looked at the empty Bin. In the old days, he might have been the one needing help. Today, he knew he would not be. The uncertainty that justified the charity was gone. To share equally now was not insurance; it was a known transfer of wealth from success to failure.

  "The Pact requires shared risk," Kaelen said quietly. "There is no risk left to share. We know the outcome."

  They negotiated instead of sharing. Kaelen offered to sell grain to Vorn, but at spot prices dictated by the scarcity he knew was coming. Vorn accepted, for he had no choice, but the terms stripped him of the surplus he needed to rebuild his terraces.

  The harvest came exactly as the flowers promised. Kaelen's granaries burst; Vorn's stood empty save for the purchased grain. They sat for the evening meal, not at the common table, but in their separate homes.

  Kaelen ate well, but he ate alone, guarding his doors against the resentment he knew he had engineered. Vorn ate enough to survive, but his tools would rust unrepaired, leaving him vulnerable to the next year, whatever it brought. The community was poorer; the risk had not vanished, it had merely been redistributed to the shoulders least able to bear it. The insurance mechanism had evaporated because the fog had lifted.

  Yet, as Kaelen locked his storehouse, he did not wish he had remained blind. If he had ignored the seed while Vorn had used it, he would have been the fool who gave away bounty expecting reciprocity that would never come. He was better off knowing the truth than being the only one ignorant of it.

  The tragedy was not that the information was false, or that the harvest was bad. The tragedy was that the value of knowing, captured individually, had consumed the value of not knowing, which had been held collectively. They were both optimizing perfectly in a world that was now fundamentally broken. Kaelen slept soundly, grateful for his foresight, even as the ridge itself grew colder around him. The information had done its job; it was the trust that had failed to survive the light.
