  2.  **Deconstruct Lewis's Triviality Result:**
      *   *Premise 1 (Adams Thesis):* $P(A \to B) = P(B|A)$.
      *   *Premise 2 (Truth-Conditionality):* $A \to B$ expresses a proposition $X$ such that $P(X)$ is defined.
      *   *Premise 3 (Conditionalization):* Updating on evidence $E$ works via $P_E(\cdot) = P(\cdot | E)$.
      *   *The Move:* Lewis considers $P((A \to B) | B)$ and $P((A \to B) | \neg B)$.
      *   *The Result:* If $A \to B$ is a standard proposition independent of $P$, AT implies $P(B|A)$ must equal $P(B)$ (independence of A and B), which is absurd for most cases.
      *   *Implication:* You can't have AT + Standard Truth Conditions + Standard Updating. One must go.

  3.  **Evaluate the Competitors (Stalnaker & Jackson):**
      *   **Jackson:**
          *   *Move:* Truth condition = Material Conditional ($A \supset B$). Assertability = Robustness (high $P(B|A)$).
          *   *Cost:* Disconnects truth from assertibility radically. Makes "If A, B" true whenever A is false, even if A and B are unrelated. This clashes with intuitive validity (e.g., McGee's counterexamples to Modus Ponens, though that's more complex, the basic "false antecedent" intuition is strong). It makes the semantics do very little work; the *meaning* is effectively the assertability condition.
      *   **Stalnaker:**
          *   *Move:* Truth conditions exist but are context-sensitive (depend on the selection function/credal state).
