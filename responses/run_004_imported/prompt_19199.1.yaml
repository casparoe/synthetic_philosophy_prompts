          *   *Counter:* We *can* negate them, but not truth-functionally. We negate the *commitment*.
          *   *Logic:* Use Adams' validity (uncertainty preservation). "Not (If A, B)" is best understood as rejecting the conditional commitment, often equivalent to accepting "If A, not B" (in a probabilistic sense).
