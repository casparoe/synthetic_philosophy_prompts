answer: |-
  Here is the argument you were looking for. It is structured to be read aloud or sent directly to your friend. It takes a hard line: Lewis's result is not a puzzle to be solved within truth-conditional semantics; it is a reductio of truth-conditional semantics for indicatives.

  ***

  **The Verdict: Why We Must Abandon Truth Conditions for Indicatives**

  You argued that Stalnaker saves the Adams Thesis by letting the content of the conditional shift with the credal state. I argued that this saves the math by killing the semantics. We left it there, but the impasse rests on a misunderstanding of what Lewis's triviality result actually tells us. It tells us that indicative conditionals *cannot* be propositions.

  To see why, we have to look squarely at what Lewis proved, why Stalnaker and Jackson fail to escape it without unacceptable costs, and why the embedding objection you raised against Adams and Edgington is less damaging than the distortions required to avoid it.

  ### 1. The Trap: Lewis's Triviality
  Lewis's 1976 proof is not merely a technical constraint; it is a boundary marker. The setup is simple. Assume:
  1.  **The Adams Thesis (AT):** Your credence in "If A, then B" equals your conditional credence $P(B|A)$.
  2.  **Truth-Conditionality:** "If A, then B" expresses a proposition $X$ that is either true or false.
  3.  **Standard Updating:** When you learn new evidence $E$, your new credence function $P_E$ is the old one conditionalized on $E$.

  Lewis asks us to calculate the probability of the conditional proposition $X$ given $B$, and given $\neg B$.
  If $X$ is a standard proposition, then if $B$ is true, $X$ ("If A, B") should be true (provided $A$ is possible). So $P(X|B) = 1$.
  If $\neg B$ is true, $X$ should be false. So $P(X|\neg B) = 0$.
  By the law of total probability, $P(X) = P(X|B)P(B) + P(X|\neg B)P(\neg B)$.
  Substituting the values above, $P(X) = 1 \cdot P(B) + 0 \cdot P(\neg B) = P(B)$.
  But by the Adams Thesis, $P(X) = P(B|A)$.
  Therefore, $P(B|A) = P(B)$.

  This implies that $A$ and $B$ are probabilistically independent. Since this is absurd for most conditionals (e.g., "If it rains, the grass is wet"), one of the assumptions must go. You cannot have AT, Truth-Conditions, and Standard Updating all together.

  ### 2. The False Escapes: Jackson and Stalnaker
  Both Jackson and Stalnaker choose to save Truth-Conditions. This is their fatal error.

  **Jackson's Strategy:** Jackson keeps the truth conditions but severs them from rational assertion. He claims the truth condition is the material conditional ($A \supset B$), but we only assert it when it is "robust" (i.e., when $P(B|A)$ is high).
  *The Cost:* This makes truth conditions idle wheels. If the truth condition is material, then "If Oswald didn't shoot Kennedy, someone else did" is true simply because Oswald *did* shoot Kennedy. But we don't believe the conditional *because* Oswald shot Kennedy; we believe it because of a causal or evidential link. Jackson forces us to say the sentence is *true* for the wrong reasons. It renders the semantic value of the conditional irrelevant to its use in reasoning. If the truth condition does no work in explaining why we accept or reject the sentence, why call it a truth condition at all?

  **Stalnaker's Strategy (Your Defense):** Stalnaker denies that the proposition $X$ is fixed. He argues that the content of "If A, B" depends on a selection function determined by the speaker's context/credal state. When Lewis updates on $B$, the context shifts, so the proposition expressed by "If A, B" shifts from $X$ to $X'$. This blocks the substitution in Lewis's proof.
  *The Cost:* This saves the equation by destroying the stability of content. If the proposition expressed by a conditional changes whenever my credences change, then communication becomes miraculous. When I assert "If A, B," I am expressing a proposition relative to *my* state. When you hear it, you interpret it relative to *yours*. If our credences differ, we are literally talking about different propositions.
  Worse, it makes disagreement impossible. If I say "If A, B" and you say "No, if A, not B," Stalnaker must say we aren't contradicting each other unless we share the exact same selection function. But we obviously *do* contradict each other. We are arguing about the world, not about our own credal states. Stalnaker rescues the Adams Thesis by turning conditionals into reports on the speaker's epistemic state, which is precisely what the truth-conditional tradition claimed they *weren't*.

  ### 3. The Non-Cognitivist Advantage (Adams-Edgington)
  The Adams-Edgington line accepts the *reductio*. Lewis showed that indicatives aren't propositions. So, stop treating them as such.
  On this view, "If A, B" does not express a proposition with a truth value. It expresses a *conditional degree of belief*. To assert "If A, B" is not to describe a fact; it is to license the inference from A to B.

  **Why this is superior:**
  1.  **It respects the data:** It takes the Adams Thesis as fundamental, not as a constraint to be squeezed into a truth-conditional box. It explains why $P(\text{If A, B}) = P(B|A)$ without mathematical gymnastics.
  2.  **It preserves disagreement:** We disagree not because we assert contradictory propositions, but because our conditional beliefs are incoherent with one another given shared evidence. Disagreement is a clash of commitments, not just a clash of truth-values.
  3.  **It avoids the "False Antecedent" problem:** We don't have to say "If the moon is cheese, I am rich" is true just because the moon isn't cheese. The conditional is simply *inapplicable* or *void* when the antecedent is false.

  ### 4. Answering the Embedding Objection
  Your strongest objection was the embedding problem: *"Conditionals appear in negations, disjunctions, and antecedents. You can't negate a speech act. Therefore, conditionals must have truth conditions."*

  This relies on the assumption that logical behavior requires truth values. That is false. Logic is about coherence, not just truth-preservation.

  **Negation:** You asked how we handle "It is not the case that if A, B."
  In natural language, this is almost always equivalent to "If A, not B." We rarely negate the conditional from the outside; we negate the consequent relative to the antecedent. Non-cognitivism predicts this. To reject the commitment "If A, B" is to adopt the commitment "If A, not B" (assuming $A$ is possible). There is no need for a truth-functional outer negation. The "proposition" that is negated is the *acceptability* of the inference, not a state of affairs.

  **Disjunction and Antecedents:** You noted conditionals appear in "Either if A, B or if C, D."
  First, these constructions are notoriously awkward and rare compared to simple indicatives. When they do occur, they are best analyzed as elliptical for claims about conditional probabilities. "Either if A, B or if C, D" functions as a claim that the sum of the conditional credences is high, or that one of the inference licenses holds.
  Second, and more importantly, **Gibbard's Theorem** (1981) strengthens Lewis's result. Gibbard showed that if conditionals have truth conditions and validate two very plausible principles (Modus Ponens and Import-Export), they *collapse into the material conditional*.
  Since we know (via Jackson's own concession) that the material conditional is the wrong truth condition for indicatives, Gibbard proves that **no truth-conditional semantics can validate the basic logic we actually use.**
  So, you are forced to choose:
  1.  Keep truth conditions, but admit they validate the wrong logic (Stalnaker/Jackson).
  2.  Keep the right logic (Adams' probability logic), but admit there are no truth conditions.

  Non-cognitivism chooses the right logic. We define validity not as preservation of truth, but as **preservation of high probability** (uncertainty preservation). An argument is valid if the uncertainty of the conclusion does not exceed the sum of the uncertainties of the premises. This handles embeddings perfectly well without positing phantom truth values.

  ### 5. The Final Verdict
  You accused me of restating Edgington with extra steps. I am. But the steps matter.
  Stalnaker's maneuver is a semantic sleight of hand. It posits "propositions" that behave unlike any other propositions (shifting content with credence) solely to preserve the dogma that all meaningful sentences must have truth conditions. It solves Lewis's paradox by making the content of conditionals so volatile that it can no longer serve as the object of shared belief.

  Jackson's maneuver is an admission of defeat. It retains the label "truth condition" but strips it of all normative force regarding assertion.

  The Adams-Edgington line is the only one that takes the triviality result seriously as a metaphysical constraint. It acknowledges that the world contains facts about rain and facts about wet grass, but it does not contain facts about *if-then* relations over and above those. The "if" is a feature of our thinking, not a feature of the world.

  Giving up truth conditions for conditionals does not make them irrational; it makes them *sui generis*. It requires revising our logic from truth-functional to probabilistic. That is a price worth paying. The price Stalnaker asks—abandoning stable content and the possibility of straightforward disagreement—is the price of the theory itself.

  Lewis proved that indicatives are not propositions. We should believe him.
