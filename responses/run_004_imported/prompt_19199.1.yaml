          *   *Strategy:* Distinguish between *semantic content* (non-propositional) and *logical behavior* (modeled by probability logic or supervaluation). Or, argue that embeddings are often superficial and can be paraphrased (e.g., "It's not the case that if A, B" $\approx$ "If A, not B" is false? No, that's tricky).
