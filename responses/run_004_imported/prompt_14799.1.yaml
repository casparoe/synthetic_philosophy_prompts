  Here is a draft for your opening remarks. It's written to be spoken—there are pauses marked, conversational rhythms, and a focus on narrative flow rather than dense argumentation. It runs about 850–950 words, which at a moderate, engaging pace should land you right between 5 and 7 minutes.

  ***

  **Opening Remarks: Philosophy of Mind & Neuroscience Workshop**

  Good morning, everyone. Welcome back to the [Year] Interdisciplinary Workshop on Mind and Brain.

  For those who don't know me, I'm [Your Name], a grad student in the Philosophy Department. As many of you know, my advisor, [Advisor's Name], is on sabbatical this year. She usually handles the welcome, and she usually handles the heavy lifting of organizing. So, if the coffee runs out by 11 AM, that's on me. But her absence did give me a moment to pause and think about *why* we're all here, and specifically, how we start these days.

  Traditionally, the opening pitch for a gathering like this is pretty standard. It usually goes something like this:

  *"Mental states are multiply realizable. Pain isn't just one specific firing pattern in a human cortex; an octopus feels pain, maybe an alien could feel pain, and they don't have our brain states. Therefore, you can't reduce psychology to neuroscience. Therefore, we need philosophers to talk about the mind, and neuroscientists to talk about the brain, and we need to talk to each other to bridge the gap."*

  It's a clean argument. It's the founding justification for this workshop. And, if I'm being honest, it's the argument I planned to give you until about a week ago.

  But then, I had a conversation with a postdoc in the neuro group who gently pointed out that hearing that argument for the tenth year in a row is… well, it's become a bit of a running joke on the medical school side of the table.

  The pushback, for those who know the literature, is essentially this: Multiple realizability looks convincing only if you keep your categories vague. If you look at how neuroscientists *actually* individuate brain states—looking at specific mechanisms, circuit dynamics, and functional roles across species—the "gap" starts to look a lot smaller. The claim is that philosophers often argue against a version of reductionism that neuroscientists aren't actually practicing anymore.

  So, I found myself in a bit of a bind. If I give the standard philosophy pitch, I risk losing half the room in the first five minutes. But if I stand here and deconstruct my own field's founding arguments to look self-aware, I'm not sure what's left for the philosophers to do here.

  And that tension? *That* is exactly why we are in this room.

  We aren't here because philosophy has the answers and neuroscience has the data. We aren't here because neuroscience has the hard facts and philosophy has the soft questions. We are here because the friction between how we *carve up* the world is where the progress happens.

  When a neuroscientist says, "This mechanism explains anxiety," and a philosopher asks, "Is that mechanism *anxiety*, or is it arousal, or is it a prediction error?"—that isn't just semantic nitpicking. That is a quality control check on the science.

  If we get the categories wrong, we build the wrong models. If we assume "pain" is a single natural kind when it's actually a cluster of distinct processes, we waste millions in funding chasing a unified biomarker that doesn't exist. If we assume brain states are entirely local when they are deeply embedded in an environment, we build AI that can't learn.

  This brings me to our distinguished guests, and specifically to Dean [Dean's Last Name], who is joining us this morning.

  Dean [Name], I know this debate can sound abstract. You might be wondering why we need a room full of people arguing about definitions and realizability when there are patients to treat and grants to write.

  The answer is efficiency.

  In research, a conceptual error is much more expensive than a failed experiment. A failed experiment tells you something is wrong. A conceptual error tells you the wrong thing is right. It sends entire fields down rabbit holes for decades. The work we do here—arguing about whether a mental state *is* a brain state, or whether it's a process, or a relation—is about making sure the questions we ask are answerable in the first place.

  Philosophy, at its best, is the engineering of concepts. Neuroscience is the engineering of the brain. You can't build a map if you don't agree on what the terrain is.

  So, my request for the next two days is simple. To my fellow philosophers: Let's not hide behind 1970s functionalism. Let's engage with the actual mechanisms being discovered, not the straw men of reductionism. To our colleagues in neuroscience: Please don't dismiss the conceptual questions as "just philosophy." When your data conflicts with your definitions, that's not a nuisance; that's a discovery waiting to happen.

  We have a fantastic schedule. We're going to talk about predictive processing, consciousness, and the ontology of neural circuits. There will be disagreement. There should be. But if we can leave here with a slightly clearer understanding of *what* we are disagreeing about, then we've done our job.

  Thank you to the Dean for the funding, thank you to [Advisor's Name] for building this community, and thank you all for being willing to have the hard conversations.

  Let's get to work.
