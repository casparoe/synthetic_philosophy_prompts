answer: |-
  The heat in the foundry was not the heat of fire, but the heat of friction, the warmth of things rubbing against things as they shifted position.

  Elian stood at the edge of the floor. It was a vast, dim space, vaulted like the inside of a ribcage. Everywhere, shapes were in motion. Not walking or running, but *fluxing*. A statue of a woman near the entrance was slowly losing the definition of her fingers, the stone softening into a slurry that dripped toward a channel in the floor. Nearby, a pile of iron filings swirled upward, magnetized by an unseen pull, coalescing briefly into the shape of a hawk before dissolving back into dust.

  Elian had come to find his father.

  He held a ticket in his hand, a slip of paper that felt greasy, printed with a name and a date of arrival. *Two months ago*, the date read. *Unexpected departure.*

  A figure approached him. It wore the leather apron of a smith, but its face was indistinct, like a sketch that hadn't been finished. It carried a long pair of tongs.

  "You're early," the Smith said. The voice sounded like grinding stones. "Or perhaps late. Time is a measurement for things that stay the same length."

  "I'm looking for him," Elian said. "He was here. He came in two months ago."

  The Smith gestured with the tongs toward the floor. "They all come here. The question is never where they come, but what they are willing to become."

  "I want to see him."

  The Smith tilted its head. "You want to see the metal, or the sword?"

  Elian tightened his grip on the ticket. "My father was a man. He liked tea in the morning. He had a scar on his chin from when he fell off a bicycle in 1974. He was afraid of heights. I want to see *him*."

  "The scar is a dent in the surface," the Smith said. "The fear is a tension in the alloy. The tea is steam. These are temporary configurations. You are asking to see a wave after the ocean has gone flat."

  "That's a comforting lie," Elian said, surprising himself. "I've heard that one. 'He's part of the ocean now.' It makes me want to scream. It erases him."

  "Good," the Smith said. "Screaming requires breath. It proves you are still shaped."

  The Smith turned and walked toward a crucible in the center of the room. The light there was blinding white, silent and intense. Elian followed. He felt heavy, as if his own bones were made of lead, while the air around the crucible shimmered with lightness.

  "Look," the Smith said, pointing with the tongs.

  Inside the crucible, the substance churned. It was not fire, but liquid potential. Gold, iron, clay, bone, breath—it was all there, indistinguishable.

  "Is he in there?" Elian asked.

  "Is the water in the cup the same as the water in the river?" the Smith countered. "If I pour the cup into the river, where does the cup-water go? If you insist it is still 'cup-water,' you are dreaming. If you insist it is 'river-water,' you are forgetting the cup existed at all."

  "I don't care about the water," Elian said. "I care about the cup."

  "The cup broke," the Smith said simply. "That was the agreement. To be a cup is to accept the possibility of breaking. To be a man is to accept the possibility of un-becoming. Your father accepted it. Or rather, he didn't have to accept it. The metal does not vote."

  Elian looked into the white churn. He tried to find a pattern, a familiar swirl that looked like his father's handwriting, or the slope of his shoulders. He saw nothing but motion. It was terrifyingly impersonal. It wasn't that his father was in a better place; it was that the concept of "place" required a boundary, and this was boundless.

  "So he's gone," Elian said.

  "He is being recast," the Smith corrected. "Perhaps next he will be a wind that cools a fever. Perhaps a stone that trips a runner. Perhaps a breath in a lung that has not yet formed. To insist he remain a father is like a sword insisting it remain a sword. It strikes the smith as an ill omen. It suggests the metal thinks it owns itself."

  Elian felt a coldness in his chest, a hollow ache that the heat of the foundry could not touch. This was not peace. This was vertigo. If his father was not a unit, then what was Elian? He looked down at his own hands. They looked solid, but under the white light of the crucible, he thought he saw a slight translucence at the edges of his fingers.

  "And me?" Elian asked. "Am I still a sword?"

  "You are a shape that currently believes it is permanent," the Smith said. "You are grieving the loss of a boundary. You think something was taken from you. But nothing is taken. The mold is simply emptied."

  "That doesn't help," Elian whispered. "It makes me feel like I'm screaming into a void."

  "The void does not hear," the Smith said. "But it holds you. There is a difference."

  The Smith lifted the tongs. A ladle dipped into the crucible, scooping up a measure of the glowing liquid. It didn't drip. It held its shape for a moment, a perfect, glowing sphere, before the Smith poured it back.

  "Your father is not the sphere," the Smith said. "He is the capacity to be poured. And so are you."

  Elian stepped back. The heat was pressing against him now, not unpleasantly, but insistently. He felt a strange fatigue, the kind that comes not from exertion but from the effort of holding a pose too long. He wondered how much energy it took to remain Elian. To keep the memories aligned, to keep the skin tight over the bone, to maintain the story of *I*.

  "If I stay here," Elian said, "will I see him again?"

  "You are seeing him," the Smith said. "You are looking at the raw material of his next shape. But you will not recognize it. Recognition requires the old mold. You are asking to recognize a dream after you have woken up."

  Elian looked at the ticket in his hand. The ink was smudging, running like wet paint. He realized the paper was softening in his grip, turning back into pulp.

  "I don't want to be recast," Elian said.

  "That is not your decision," the Smith said. "It is the nature of the forge. The only choice you have is whether to leap up like a bad omen, insisting on being a sword, or to lie still and let the heat do its work."

  The Smith turned away, attending to a new pile of material arriving from the dark—fresh ore, fresh breath, fresh grief.

  Elian stood alone by the crucible. He wanted to cry, but he felt that even his tears would eventually evaporate and join the steam rising from the floor. He looked into the white light. He tried to summon his father's face, but the image was slippery, like trying to hold smoke.

  He understood, suddenly, why Zhuangzi had drummed on the tub. It wasn't because he didn't care. It was because to wail was to insist that the song had ended, when the music was only changing key. But knowing that didn't stop the ear from missing the melody it knew.

  Elian dropped the pulp that had been his ticket. It fell to the floor and merged with the dust.

  He didn't feel better. He felt exposed, as if his skin had been peeled back to show the wiring underneath. He was a temporary arrangement of dust and heat, mourning another arrangement that had already settled back into the pile.

  He turned to leave, but he paused at the threshold. The heat followed him. It was inside his coat. It was in his lungs. He took a breath, and for a terrifying second, he couldn't tell if he was breathing the air or if the air was breathing him.

  He walked out into the cool night, but the warmth of the foundry stayed in his marrow, a reminder that he was not stone, but metal waiting on the bench, and the Smith was never far away.
