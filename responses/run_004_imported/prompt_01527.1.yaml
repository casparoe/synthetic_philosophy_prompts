      *   **The Question:** Is there rational logic underneath this, or is it purely psychological bias? How do I size up what's driving this?
      *   **Tone:** Respectful, intellectual, empathetic but firm on the logic. Needs to speak to someone who understands data, evidence, and epistemology.

