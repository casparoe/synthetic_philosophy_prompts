      *(Wait, let's look at the prompt again: "starts behaving by operatic logic")*.
      Okay, I can push the boundary. Time dilation is key. The "dying aria" equivalent.
      Let's write it.

      *Opening:* The tape gun.
      *Middle:* The speech that goes on too long.
      *End:* The realization.

      *Refining the Williams connection:* Williams argues that the artifice *permits* the truth. If it were realistic, they'd mumble. Because it's "fake" (heightened), they can be honest. I need to make sure Arthur realizes that the "performance" is the only way to say the real thing.

      Let's go.cw
answer: |-
  The tape gun made a sound like a tearing ligament. *Rrrrip.*

  Arthur pressed the cardboard flap down. It was the fourth box. Books, mostly. Heavy, dense things that smelled of vanilla and dust. In a naturalistic version of this afternoon, he would have made a joke about the weight of *War and Peace*, Elena would have offered a tight smile, and they would have ordered Thai food because it's what you do when you're dismantling a three-year cohabitation. You keep the rhythms of living intact until the very last second to buffer the blow.

  But the light in the kitchen was wrong. It wasn't the grey, diffuse light of a Tuesday afternoon in London. It was a sharp, directional beam cutting through the window, illuminating dust motes that hung suspended, refusing to settle. The hum of the refrigerator wasn't a rattle; it was a low, sustained cello note, vibrating in Arthur's sternum.

  Elena stood in the doorway. She was holding a mug. She had been holding that mug for six minutes.

  In reality, you put the mug down. You wash it. You leave. But Elena was standing in the spotlight of the sunbeam, and her chest was rising and falling with a rhythm that didn't match the air in the room.

  "I don't think I can love you in a small room anymore," she said.

  In a realistic script, this would be whispered. It would be followed by an apology, a qualification. *I mean, it's not your fault, it's just the space, the pressure…*

  Instead, her voice carried without effort, filling the corners of the kitchen, resonating off the tiles. It was too loud. It was the volume of a confession meant for a balcony, not a flatmate.

  Arthur felt the urge to look away. This was the instinct of realism: to protect dignity, to obscure the raw mechanics of the heart. To mumble. But the air in the kitchen felt pressurized, like the moment before a storm breaks, or the intake of breath before a high C. He realized, with a jolt of terrifying clarity, that if he looked away now, he would be lying.

  "It's not the room," Arthur said.

  He didn't move toward her. In realism, you close the distance. You hug. In this logic, distance was necessary for the projection. He had to stand by the counter so she could see him fully.

  "It's that I am too small for the size of my own grief," Arthur said. He heard himself. He sounded absurd. Who speaks like that? It was melodramatic. It was purple prose spoken aloud. It was fake.

  And yet, as the words left his mouth, he felt a physical unclenching in his gut that he hadn't felt in months.

  "It takes me five minutes to feel what should take five seconds," Elena said. She still hadn't put the mug down. Her hand was trembling, but the tremor was rhythmic, synchronized with that low hum from the fridge. "When you leave the toilet seat up, I don't get annoyed. I get a vision of our decay. I see the moss growing on the tiles. I see us as skeletons arguing over porcelain."

  Arthur nodded. This was the manifest artifice. In real life, you argue about the toilet seat. You argue about the symbol because you are too cowardly to argue about the mortality it represents. But here, in this impossible, heightened afternoon, they were skipping the symbol. They were singing the subtext.

  It felt theatrical. It felt staged. Arthur was acutely aware of his own posture, the way his hands were spread on the laminate counter. He felt like a tenor playing a dying poet. And because he accepted the role, because he stopped trying to be a "guy packing books," the emotion hit him with the force of a physical blow.

  "I bought the tickets for the symphony," Arthur said. "For next month. I knew you were leaving. I bought them so I could sit in the silence of the empty seat and pretend you were just in the bathroom."

  That was the aria. That was the five-minute soliloquy while bleeding out on the stage. In reality, he would have returned the tickets. He would have been practical. He would have hidden the wound. By stating the extravagance of his pain—the petty, theatrical vengeance of the empty seat—he made the pain real.

  Elena finally set the mug down on the table. The clink was a percussion strike. The room seemed to expand.

  "If I stay," she said, "I will become a ghost in your kitchen. I will be here, but I will be transparent. You will walk through me."

  "I know."

  "And if I go, I will be solid. I will be real enough to hurt you."

  "Yes."

  They stood there. Time had lost its linear grip. A car horn honked outside, but it sounded like an oboe, distant and mournful. They were lingering in the moment of departure far longer than physics should allow. In a movie, the door would slam now. In life, one of them would check their watch.

  But this was the truth of the artifice. The truth wasn't in the action; it was in the duration. It was in the refusal to let the moment be efficient.

  Arthur realized why Williams had been right. If they acted naturally, they would be lying. Naturalism is a defense mechanism. It's the mumbled goodbye, the quick hug, the "let's grab coffee soon." Naturalism is designed to minimize the damage, to smooth over the rupture. It treats human emotion as something to be managed, contained, and hidden behind a veil of social propriety.

  But opera—this operatic logic invading his kitchen—demanded that the wound be opened and lit by a spotlight. It demanded that the grief be too big for the body containing it. It required them to be embarrassing. It required them to be "fake" so that they could stop pretending to be "fine."

  Elena walked toward him. She didn't hug him. She placed a hand on his chest, right over the sternum, where the vibration of the fridge was still humming.

  "I am not leaving because I hate you," she said. Her voice was soft, but it had the same carrying power. "I am leaving because I love you, and I cannot watch you turn into a monument to my absence while I am still standing here."

  "That is a very expensive reason," Arthur said.

  "It is the only one that balances the ledger."

  She turned. She walked to the door. In realism, she would fumble with her keys. She would drop them. She would struggle with the lock.

  Elena opened the door on the first try. The handle turned with a smooth, mechanical click. She stepped into the hallway. She did not look back. Looking back would be a cinematic trope, and this was beyond cinema. This was pure structure.

  The door closed.

  Arthur stood alone in the kitchen. The sunbeam had moved three inches to the left. The fridge hummed its ordinary, rattling hum. The tape gun sat on the counter, a plastic gun for a plastic seal.

  He waited for the sadness to hit him in the messy, confusing way it usually did—the tight throat, the random tears, the urge to scroll through old photos.

  It didn't come. Instead, he felt a strange, hollowed-out clarity. He felt the way an audience feels after the final chord of a tragedy: exhausted, stripped bare, but strangely cleansed.

  They hadn't fixed it. Nothing was resolved in a practical sense. The boxes still needed to be taped. The lease still needed to be broken. The logistics were a nightmare.

  But the lie was gone. They had performed the truth. They had admitted that the stakes were life-and-death stakes, even if the setting was just a kitchen in Islington. By accepting the artifice—by allowing themselves to be dramatic, to take up too much time, to speak in declarations rather than sentences—they had bypassed the defense mechanisms of the everyday.

  Arthur picked up the tape gun. *Rrrrip.*

  The sound was just a sound again. He pressed the cardboard down. He didn't cry. He felt the echo of the aria still vibrating in his ribs, a resonance that was more real than the wood of the table or the cold air from the window. He understood now. You don't hide the wires to make it true. You show the wires, and you admit that the wire is the only thing holding you up.
