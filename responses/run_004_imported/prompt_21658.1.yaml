      *Decision:* If I make them literally sing, it becomes a fable about singing. If I make them *act* as if the stakes are that high without the music, it captures the *logic* of opera in real life. However, to really hit the "manifest artifice," maybe the world *acoustics* change? Or maybe I lean into the idea that their speech *becomes* performative.
