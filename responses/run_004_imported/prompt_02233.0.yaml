prompt: |-
  Ok so I'm outlining a novel where the justice system in this secondary world lets a condemned person's "punishment-debt" get ritually transferred to a volunteer, who then dies in their place and the original sentence is fully discharged, no questions asked. I want a scene where a cynical advocate character tears into why this is philosophically bogus, and im basing her argument on a paper I read a while back (half remember it tbh) by, of all people, David Lewis — yes the possible-worlds modal realism guy, apparently he also wrote a short piece on penal substitution and the Christian atonement, which caught me off gaurd.

  Here's my rough recollection of the argument, can you check it for me:

  - Normally nobody thinks a volunteer serving a burglar's prison sentence (or a murderer's death sentence) lets the actual offender off the hook. Punishment isn't like a debt: a creditor just wants his money back and doesn't care who pays it, but punishment is only punishment if it's the wrongdoer himself who suffers for it — that's the whole point, whatever theory of punishment you like (retribution, deterrence, reform, whatever).
  - The catch is we do seem to accept that a friend can pay someone's fine for them, even a serious one, and that looks like substitution too.
  - Lewis's way out is basically that a "fine" isn't really punishment in the relevant sense, it's more like a fee/debt, so it was never a real counterexample in the first place — which is why Christians explaining the Atonement as penal substitution aren't actually being inconsistent with how the rest of us think about ordinary criminal justice.

  Two things I want from you. First: is that last bullet actually what Lewis argues, or am I flattening/misremembering how he ends it? Second, assuming the core puzzle (debt vs. desert, substitution working for some "punishments" but not others) is basically right: what's the sharpest version of my advocate's objection to the ritual-transfer system, and is there a genuinely defensible comeback from characters who defend the ritual, or does it just collapse into special pleading? Honestly tell me too if this whole angle is actually a rich vein for a subplot or just sounds clever on the surface.
