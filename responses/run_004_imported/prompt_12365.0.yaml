answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I have the distinct privilege of being in Professor [Name]'s seminar on Ancient Economic Thought this term. As many of you know, this isn't just any seminar. It is the final course she will ever teach.

  When we found out this was her last class, we wanted to make sure we studied the most important text. So, naturally, we spent twelve weeks on Aristotle's *Politics*. Specifically, we spent twelve weeks on one very specific, very stubborn argument: that lending money at interest is unnatural.

  Aristotle's reasoning was that money is meant to be a tool of exchange, not a living thing. He argued that for money to beget more money is a violation of nature. And he had a linguistic trick to prove it. He pointed out that the Greek word for interest is *tokos*. But *tokos* also literally means "offspring."

  So, for Aristotle, charging interest was like claiming a gold coin could give birth to a smaller gold coin. He thought it was absurd. He thought money was barren.

  Now, looking around this room, I see a lot of people who work in finance. I know that for many of you, the idea that money *can't* breed comes as a shock. You've seen your portfolios grow. You've seen compound interest work its magic. You know that in the modern world, money has plenty of offspring.

  But I think Aristotle—and more importantly, Professor [Name]—were looking at a different kind of ledger.

  Because if you look at the last forty years, you have to admit: something *has* been breeding in this classroom. Something has been multiplying.

  Professor [Name], you spent forty years telling us that money shouldn't have children. But what you were actually doing was investing a different kind of capital. You invested your time, your rigor, and your incredible patience into us. And if Aristotle is right, and *tokos* means offspring, then look around you.

  **We are the *tokos*.**

  To the former students in finance: You know better than anyone that a return on investment usually ends up in a bank account. But the return on *her* investment is sitting at these tables. We are the yield. We are the compound interest of her career.

  And to her family and colleagues who don't speak Greek: You don't need to know the translation to understand the joke. You've seen the results. You've seen the late nights, the drafts, the worry, and the pride. You know that she didn't raise money. She raised us.

  There is a temptation, when talking about a philosophy professor and a room full of bankers, to make a joke about who is right. Is it the philosopher who says profit is unnatural, or the bankers who say it's necessary?

  But I don't think she ever taught that lesson to stop us from making a living. She taught it to make us ask what we were living *for*. She taught us that while money might breed on a spreadsheet, it takes a human being to nurture a mind. It takes a teacher to turn a student into a colleague, a citizen, a friend.

  So, Aristotle was wrong about one thing. He said it is unnatural for wealth to generate life. But he didn't account for teachers. Because when a teacher invests in people, the offspring are real. The legacy is living.

  Professor [Name], in the financial world, they talk about "exiting a position." You are exiting the classroom. But you aren't cashing out. You are taking your seat in the audience of the lives you've changed.

  So, I'd like to propose a toast.

  To the only person I know who could convince a room full of investors that their profits are unnatural, and make them thank her for it.

  May your retirement be rich in everything that doesn't compound on a balance sheet. May your days be leisurely, your books be endless, and may you rest easy knowing that your true *tokos*—your true offspring—are out in the world, trying our best to be as wise, as rigorous, and as kind as you.

  To Professor [Name].
