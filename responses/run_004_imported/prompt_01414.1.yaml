prompt: |-
  I'm a retired evolutionary biologist (34 years on sexual selection in birds, if it matters) whose spent the last year or so happily reading philosophy now that I don't have grad students to supervise anymore. Recently I got hooked on Sharon Street's "Darwinian Dilemma" paper against moral realism -- her argument that realists owe us an explanation of why natural selection, which pretty clearly shaped our evaluative attitudes because they promoted survival and reproduction rather than because they tracked mind-independent moral truths, would also have made us reliable trackers of those truths. Either there's no link between selection and the independent truths (so our moral beliefs are probably mostly off track), or realists have to posit a wildly convenient coincidence where tracking the truth and being fitness-enhancing just happen to line up. As a biologist this felt very familiar, and, honestly, pretty devastating.

  But then someone in my reading group pointed out the obvious follow-up worry: our logical and arithmetical faculties were surely shaped by selection too (theres a pretty clear fitness payoff for ancestors who could infer and count correctly), yet basically nobody thinks 2+2=4 or modus ponens gets "debunked" this way. So there's got to be some asymmetry that lets math and logic off the hook while morality stays on it. I've run across a few candidate asymmetries in my (admittedly amateur) reading -- that necessary truths make reliability trivially "safe" regardless of the process that produced the belief, that mathematical objects might be "plenitudinous" (every consistent structure exists, so there's nothing external left to fail to track), and that math is indispensable to our best science in a way moral facts aren't. What I'd like is for you to actually mount the hard-nosed case that none of these three moves restores the asymmetry -- argue, as rigorously as you can, for full "companions in guilt": that if Street's dilemma is fatal to robust moral realism, it's equally fatal to mathematical and logical realism, and nobody gets to keep their platonism just because it's about numbers instead of norms. Take each escape route at its strongest rather than swatting down a cartoon version of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired evolutionary biologist (34 years experience, sexual selection in birds). This means they understand evolutionary theory deeply (fitness, selection pressures, adaptation) but are newer to philosophy (1 year of reading). They are intellectually rigorous ("hard-nosed case," "rigorously," "strongest version").
      *   **Topic:** Sharon Street's "Darwinian Dilemma" against moral realism. Specifically, the "Companions in Guilt" objection (why doesn't this debunk math/logic too?).
      *   **Task:** Argue *for* the "Companions in Guilt" position. That is, argue that Street's dilemma *does* apply to math/logic just as much as morality, and that the standard escape routes (necessary truths, plenitudinarianism, indispensability) fail to restore the asymmetry.
      *   **Tone:** Rigorous, philosophical, respectful of the user's scientific background, avoiding "cartoon versions" of the counter-arguments.

  2.  **Deconstruct the Core Argument (Street's Dilemma):**
      *   *Premise 1:* Evolution shaped our cognitive faculties (including evaluative, logical, and mathematical ones) for fitness, not truth.
      *   *Premise 2:* Realism posits mind-independent truths.
      *   *The Dilemma:* Either (a) there is no relation between fitness and truth (skepticism follows), or (b) there is a relation (realists must explain why fitness-tracking aligns with truth-tracking without collapsing into reductionism).
      *   *The Challenge:* Show that the standard defenses for math/logic fail to block this dilemma.

  3.  **Evaluate the Three Escape Routes (and plan the counter-arguments):**

      *   **Escape Route 1: Necessary Truths / Modal Security.**
          *   *Argument:* Math/logic are necessary. They couldn't be otherwise. So, any belief-forming process that lands on "2+2=4" is safe, because "2+2=4" is true in all nearby worlds.
          *   *Counter-Argument:* Street's challenge isn't about *modal* safety (could it have been false?) but about *explanatory* connection (why did we land on the true one?). Evolution could have selected for "2+2=5" if it aided survival (e.g., overcounting predators). The necessity of the truth doesn't explain the reliability of the *faculty*. The "pre-established harmony" worry remains.

      *   **Escape Route 2: Plenitudinarianism / Structuralism.**
          *   *Argument:* All consistent structures exist. We just pick one. There's no "external" fact to miss.
          *   *Counter-Argument:* This saves ontology but kills realism's normative force. If we just "choose" a structure based on fitness, we aren't tracking *the* truths of arithmetic; we're tracking *useful fictions*. Realism usually claims we track *specific* abstract objects (numbers), not just consistent games. If fitness determines *which* logic we use (classical vs. intuitionistic), the truth is still subordinate to selection.

      *   **Escape Route 3: Indispensability (Quine-Putnam).**
          *   *Argument:* We need math for science. Science works. Therefore, math is true. Morality isn't needed for physics.
          *   *Counter-Argument:* This conflates *utility* with *truth*. Evolution selects for utility. If math is indispensable for *survival-enhancing science*, that just reinforces the evolutionary link, not the truth link. We could have "empirically adequate" math that is ontologically false (instrumentalism). Also, logic is indispensable too, and logic is arguably more vulnerable (paraconsistent logics might work for different organisms).

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise. Validate their intuition (the dilemma feels biological). State the thesis: The asymmetry is illusory; the "Companions in Guilt" charge holds.
      *   **The Core Mechanism:** Reframe Street's argument in biological terms. Selection acts on *phenotypes* (behaviors/beliefs) that enhance *fitness*, not on *correspondence* to platonic realms. This applies to counting predators just as much as counting mates.
      *   **Addressing Necessary Truths:**
          *   Distinguish between the *truth of the proposition* and the *reliability of the believer*.
          *   Use the "Alien Arithmetic" thought experiment. If fitness favored a different heuristic, would we grasp the necessary truth?
          *   Argument: Necessity doesn't bridge the explanatory gap between selection and access.
      *   **Addressing Plenitudinarianism:**
          *   Explain the view (all structures exist).
          *   Critique: This turns math into a choice, not a discovery. If fitness drives the choice, realism is lost. We are "tracking" fitness, not the structure.
          *   Analogy: Sexual selection. Peacocks track peahen preferences, not "objective beauty." Math might be similar.
      *   **Addressing Indispensability:**
          *   Explain the Quinean argument.
          *   Critique: Indispensability proves utility, not truth. Evolution cares about utility.
          *   Point out that "science" is a human project shaped by human cognition shaped by evolution. Circular.
      *   **The "Third Factor" Objection (Pre-empting):**
          *   Realists often say "Fitness and Truth share a common cause."
          *   Counter: In biology, this usually means reductionism (moral facts *are* fitness facts). If you keep them distinct, it's a coincidence.
      *   **Conclusion:** Summarize. If you accept Street on morality, you must be an anti-realist about math/logic (fictionalism, constructivism) or find a new meta-ethical framework. You can't have robust Platonism for numbers but not norms.

  5.  **Refining the Tone:**
      *   Avoid overly dense jargon where possible, but don't dumb it down. The user is a scientist.
      *   Use biological analogies (predator counting, sexual selection) to resonate with their background.
      *   Ensure the argument is *for* the "Companions in Guilt" (i.e., arguing that math *is* in trouble), as requested. (Self-Correction: Make sure I don't accidentally argue *against* Companions in Guilt. The prompt asks me to "mount the hard-nosed case that none of these three moves restores the asymmetry... argue... for full 'companions in guilt'".)

  6.  **Final Review against Constraints:**
      *   Did I address all three escape routes? Yes.
      *   Did I take them at their strongest? Yes (e.g., distinguishing modal safety from explanatory connection).
      *   Is the tone appropriate? Yes, collegial and rigorous.
      *   Did I leverage the user's background? Yes, using evolutionary analogies.

  7.  **Final Polish:** Check for clarity on the distinction between *ontological* necessity and *epistemic* access. This is the crux of the "Necessary Truths" rebuttal. (Ensure I emphasize that Street's challenge is epistemic/explanatory, not metaphysical).

  *(Self-Correction during drafting)*: I need to be careful not to conflate mathematical *truth* with mathematical *utility*. The Indispensability argument tries to link them. I need to show that link is broken by evolution. Evolution selects for utility. If utility $\neq$ truth, then evolution selects for utility, leaving truth unexplained.

  Okay, ready to write.
answer: |-
  It is a pleasure to address a colleague who understands the machinery of natural selection from the inside out. You have correctly identified the fault line in contemporary meta-ethics. Sharon Street's "Darwinian Dilemma" is, at its core, an evolutionary argument, and it resonates with biologists because it treats cognitive faculties as adaptations subject to the same constraints as wings or eyes.

  The "Companions in Guilt" objection is the realist's last stand. The intuition is that if Street's argument debunks morality, it must also debunk logic and mathematics (L&M), and since skepticism about L&M is intolerable, the argument must be flawed.

  However, to save moral realism by sacrificing mathematical realism is to cut off the nose to spite the face. If we are to be rigorous, we must acknowledge that the evolutionary pressures on our arithmetical and logical faculties are structurally identical to those on our normative faculties. The standard escape routes you mentioned—Necessary Truths, Plenitudinarianism, and Indispensability—fail to restore the asymmetry because they conflate *utility* with *truth*, or *modal safety* with *explanatory connection*.

  Here is the hard-nosed case for why the guilt is indeed shared. If Street is right about morality, she is right about math.

  ### 1. The Necessary Truths Defense: Modal Safety vs. Explanatory Connection

  **The Realist Move:**
  The most common defense is that moral truths (if they exist) are contingent, whereas logical and mathematical truths are necessary. $2+2=4$ is true in all possible worlds. Therefore, even if evolution shaped our belief-forming mechanisms, we couldn't have easily been wrong. Our beliefs are "modally safe."

  **The Evolutionary Rebuttal:**
  This defense confuses the *status of the proposition* with the *reliability of the believer*. Street's challenge is not metaphysical (could the truth have been otherwise?); it is epistemic and explanatory (why did our faculties land on the truth?).

  Consider the biological parallel. Suppose there is a fact about predator density that is "necessary" in some abstract sense. Evolution does not select for beliefs that correspond to that fact; it selects for behaviors that enhance survival. An ancestor who systematically *overestimated* predator numbers (believing there were 5 lions when there were 3) might survive longer than a veridical counter. The cost of a false positive is lower than a false negative.

  If evolution can shape our *numerical* intuitions for fitness rather than accuracy, the necessity of $2+2=4$ is irrelevant to the *origin* of our belief. We need an explanation for why the fitness-enhancing heuristic ("count roughly") aligns with the abstract truth ("exact arithmetic").

  To claim that necessity saves us is to posit a pre-established harmony between the demands of survival on the African savannah and the structure of abstract Platonic realms. As a biologist, you know nature abhors such coincidences. If our logical faculties were shaped by selection, they are shaped to solve *practical* problems (social exchange, tool use, navigation), not to track necessary truths. That we *happen* to track necessary truths in doing so requires the same "wild coincidence" Street accuses moral realists of positing. The necessity of the truth does not explain the reliability of the access.

  ### 2. The Plenitudinarian Defense: Ontology vs. Tracking

  **The Realist Move:**
  A more sophisticated move (often associated with structuralism or plenitudinarianism) argues that all consistent mathematical structures exist. There is no single "external" arithmetic to fail to track. We simply adopt the structure that proves useful. Thus, there is no gap between fitness and truth; the "truth" is just the structure we find useful.

  **The Evolutionary Rebuttal:**
  This saves the ontology of mathematics only by eviscerating its realism. If the "truth" of mathematics is merely the selection of a consistent structure that aids survival, then mathematical truth is subordinate to fitness. This is not realism; it is a form of fictionalism or constructivism.

  Robust realism claims that we discover facts that hold *independently* of our cognitive constitution. If plenitudinarianism is true, and we select structures based on fitness, then our mathematical beliefs are not tracking mind-independent facts; they are tracking our own adaptive needs.

  Consider your own work on sexual selection. Peahens select for tail feathers not because they track "objective beauty," but because the feathers signal fitness. If mathematical realism is reduced to "we picked the structure that worked," then numbers are like peacock tails: they are adaptations, not discoveries.

  Furthermore, this does not solve the dilemma for *logic*. If there are multiple consistent logics (classical, intuitionistic, paraconsistent), and evolution selected for classical logic because it aided quick decision-making (e.g., a predator is either there or not; no middle ground), then our logic is fitness-relative. A creature in a quantum environment might evolve intuitionistic logic. If the "truth" of logic depends on which structure we evolved to use, then logic is not a mind-independent standard against which we can measure our reasoning. It is, again, an adaptation. The realist wants logic to be the *judge* of our reasoning, not a *product* of it. Plenitudinarianism makes it a product.

  ### 3. The Indispensability Defense: Utility vs. Truth

  **The Realist Move:**
  The Quine-Putnam indispensability argument suggests that because mathematics is indispensable to our best scientific theories, and we ought to be ontologically committed to the entities posited by our best theories, we must accept mathematical entities. Science works; therefore, math is true. Morality is not indispensable to physics, so it gets debunked.

  **The Evolutionary Rebuttal:**
  This argument collapses under evolutionary scrutiny because it conflates *empirical adequacy* with *truth*. Evolution selects for empirical adequacy (behaviors that result in survival), not ontological truth.

  We can conceive of a "fictionalist" science where the mathematical entities are useful fictions that generate correct predictions without existing. If our cognitive faculties are evolved, we should expect them to produce *empirically adequate* models of the world, not *true* ones. An organism can survive perfectly well with a false model of reality, provided the model maps reliably to survival outcomes.

  If mathematics is indispensable to science, and science is a tool for survival (ultimately), then mathematics is indispensable for *survival*. This reinforces Street's point rather than refuting it. It shows that math is deeply tied to fitness. But it does not explain why the *abstract objects* posited by the math exist independently.

  Moreover, this creates a circularity. Our "best science" is formulated by humans using human logic and human mathematics. If human logic and mathematics are shaped by evolution for fitness, then science itself is an evolutionary product. To use science to validate the truth-tracking of mathematics is to use a product of selection to validate the reliability of selection. It assumes the reliability of the faculty to prove the reliability of the faculty.

  From a biological perspective, the indispensability argument is like arguing that because the peacock's tail is indispensable for his reproduction, the tail must represent "objective beauty." No; it represents objective *fitness*. If math is indispensable, it proves math is fit, not that it is true in the robust realist sense.

  ### The "Third Factor" Failure

  Realists often attempt a "Third Factor" explanation: perhaps there is a common cause that explains both why certain traits are fitness-enhancing and why they are morally/mathematically true. (e.g., "Survival is good," or "Consistency is true").

  But as a biologist, you know that selection is local and contingent. There is no guarantee that the "third factor" aligns with realist truths.
  *   **In Morality:** If the third factor is "survival is good," the realist has reduced morality to fitness, abandoning robust realism.
  *   **In Math:** If the third factor is "consistency aids prediction," the realist has reduced math to instrumental utility.

  If the realist insists the third factor is distinct (e.g., "Survival tracks the Good" or "Prediction tracks the Numbers"), they are back to the coincidence problem. Why should the abstract realm of Numbers care about the metabolic needs of primates? To assert they align is to assert a cosmic coincidence indistinguishable from divine pre-harmony.

  ### Conclusion: The Hard Pill

  The asymmetry between morality and mathematics is psychological, not ontological. We feel more certain about $2+2=4$ than "suffering is bad" because the former is formal and the latter is substantive. But Street's dilemma targets the *origin of the faculties* that grasp these truths.

  If you accept that natural selection shapes cognitive faculties for fitness rather than truth, you must accept that this applies to the numerical and logical faculties just as much as the normative ones.
  1.  **Necessity** doesn't explain access.
  2.  **Plenitudinarianism** sacrifices realism for consistency.
  3.  **Indispensability** conflates utility with truth.

  The rigorous conclusion is "Companions in Guilt." If Street's dilemma is fatal to moral realism, it is fatal to mathematical and logical realism. To save math, you must either:
  1.  Accept that math/logic are not mind-independent (constructivism/fictionalism).
  2.  Argue that natural selection *does* track truth (a form of teleological naturalism most biologists reject).
  3.  Accept skepticism about our logical and mathematical faculties (which is pragmatically impossible but theoretically consistent).

  You cannot hold the line at morality. The evolutionary machinery doesn't distinguish between counting mates and counting predators. If the output of that machinery is suspect in the normative domain, it is suspect in the formal domain as well. The only way to keep robust Platonism for numbers is to find a way to keep it for norms, or to admit that our "truths" are ultimately reflections of our biological nature.
