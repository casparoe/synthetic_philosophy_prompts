answer: |-
  This is a classic and profound dispute that cuts to the heart of statistical inference. You have stumbled upon one of the most enduring tensions in the philosophy of statistics: the conflict between **Frequentist Error Control** (the referee's position) and the **Likelihood Principle** (your position).

  Given your background in physiology and your new interest in philosophy, you are uniquely positioned to appreciate that neither of you was "wrong" in a vacuum, but you were speaking different languages. However, within the context of the scientific norms you were operating under at the time, **the referee was methodologically correct, while you were philosophically coherent but statistically mismatched.**

  Here is the breakdown of why this dispute exists and who holds the stronger ground in each domain.

  ### 1. The Referee's Argument: Frequentist Error Control
  The referee was operating within the Neyman-Pearson framework, which is the standard foundation for Null Hypothesis Significance Testing (NHST) and $p$-values.

  In this framework, a $p$-value is not merely a summary of the data you have; it is a statement about the **procedure** used to generate the data. Specifically, the $p$-value is the probability of obtaining results at least as extreme as the observed data, *assuming the null hypothesis is true and the experiment is repeated many times using the exact same sampling plan.*

  By adding animals because the first look was "tantalizingly close," you engaged in **optional stopping**.
  *   **The Mathematical Reality:** If you check for significance at $N=20$, and if not significant, add $N=10$ and check again, you have effectively performed two tests. The probability of finding a "significant" result by chance (Type I error) across those two looks is higher than 0.05. It might be 0.08 or 0.10, depending on the correlation between the looks.
  *   **The Consequence:** The $p$-value you reported for the combined $N=30$ was calculated as if you had planned to collect 30 animals from the start. Because that assumption was false, the reported $p$-value underestimated the true probability of a false positive.

  The referee's insistence that "error rates behave" differently is technically accurate. In a Frequentist framework, intentions and stopping rules *must* be part of the calculation to maintain the validity of the error rate guarantee.

  ### 2. Your Argument: The Likelihood Principle
  Your intuition that "what the numbers show should depend only on the numbers themselves" is a precise articulation of the **Likelihood Principle**.

  This principle, championed by statisticians like R.A. Fisher (in some interpretations) and philosophers like Allan Birnbaum, states that all the evidence provided by an experiment regarding a hypothesis is contained in the likelihood function of the observed data.
  *   **The Philosophical Reality:** Once the data are in hand, the fact that you *might* have stopped earlier or *might* have collected more should not change the evidential weight of the specific observations you actually made. The data are what they are.
  *   **The Conflict:** The Likelihood Principle is incompatible with the Frequentist definition of the $p$-value. You cannot hold both that (A) stopping rules are irrelevant to evidence and (B) $p$-values are valid measures of inference without modification.

  Your argument is philosophically robust and is the standard view in **Bayesian inference**. In a Bayesian analysis, you update your prior belief with the data. The stopping rule is generally irrelevant to the posterior distribution (unless the stopping rule itself conveys information about the parameters, which is rare in simple lab experiments).

  ### 3. The Verdict: Who Was Right?

  **Methodologically (within the published norms): The Referee.**
  You chose to use a Frequentist tool (the $p$-value). That tool comes with a user manual that explicitly forbids optional stopping without correction. By using the tool contrary to its definition, you invalidated the metric. If you submit a paper claiming $p < 0.05$, you are implicitly promising that the long-run false positive rate is controlled at 5%. Your procedure broke that promise. The referee was protecting the integrity of the statistical claim being made.

  **Philosophically (regarding the nature of evidence): You.**
  Your intuition that the evidence resides in the data, not the sampling plan, is shared by many philosophers of science and Bayesian statisticians. It is counter-intuitive to many scientists that the "truth" of a result depends on what the experimenter was thinking when they stopped collecting data. If you had analyzed the data using Bayes Factors or Likelihood Ratios, your argument would have been statistically valid as well as philosophically sound.

  ### 4. How This Is Resolved Today
  This dispute is not merely historical; it is active. Modern science has developed ways to accommodate both positions, though they require planning:

  1.  **Sequential Analysis:** If you plan to "peek" at the data, you can use sequential analysis methods (like O'Brien-Fleming boundaries). These adjust the significance threshold at each look to keep the overall Type I error rate at 0.05. This satisfies the referee.
  2.  **Bayesian Methods:** If you adopt Bayesian inference, you can stop collecting data whenever you like (e.g., when the Bayes Factor reaches a certain threshold). This satisfies your intuition that the stopping rule is irrelevant.
  3.  **Pre-registration:** Modern open science practices require you to declare your stopping rule in advance. If you had pre-registered "We will collect 20 rats, and if $p < 0.1$, we will collect 10 more," and analyzed it with the appropriate correction, the paper likely would have been accepted.

  ### Conclusion
  You had the better **philosophical** argument regarding the nature of evidential support. The referee had the better **statistical** argument regarding the validity of the specific metric ($p$-value) you employed.

  In the context of a journal submission relying on standard NHST, the referee's argument must win, because the $p$-value is defined by the sampling distribution, which includes the stopping rule. However, your discomfort was well-founded: it highlights a known weakness of Frequentist statistics, where the "evidence" changes based on the experimenter's intentions rather than just the physical data.

  You were right to feel that the data shouldn't change meaning based on your thoughts, but you were wrong to expect a $p$-value to reflect that view. The tool you used was not designed for the philosophy you held.
