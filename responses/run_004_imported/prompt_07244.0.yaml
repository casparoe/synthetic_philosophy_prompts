answer: |-
  This is a fantastic topic for a paper. You have correctly identified that the "magic" isn't in the veil itself, but in the **decision-theoretic rules** the agents behind the veil are allowed (or forced) to use. Harsanyi and Rawls both use a veil to ensure impartiality, but they import different models of rationality.

  Here is the breakdown of the mechanical divergences, followed by an evaluation of which move holds more water.

  ### 1. The Probability Assumption: Risk vs. Uncertainty

  The single biggest technical divergence is how they treat probability behind the veil.

  **Harsanyi: The Principle of Insufficient Reason**
  Harsanyi treats the Veil of Ignorance as a situation of **risk**. Even though you don't know who you are, he argues you must assign a probability to each social position. He invokes the *Principle of Insufficient Reason*: if you have no evidence that you are more likely to be the CEO than the janitor, you must assign an equal probability ($1/n$) to every position.
  *   **The Mechanic:** If you maximize *Expected Utility* ($EU$) with equal probabilities, the math forces Utilitarianism.
      $$EU = \sum (P_i \times U_i)$$
      Since $P_i = 1/n$ for everyone, maximizing the sum is the same as maximizing the average.
  *   **The Result:** You choose the society with the highest average welfare, even if it means some people suffer terribly, provided the gains to others outweigh those losses.

  **Rawls: Radical Uncertainty**
  Rawls explicitly rejects the use of probabilistic calculations in the Original Position. He argues this is a situation of **uncertainty**, not risk. There is no objective basis for assigning $1/n$ probabilities to social positions because society isn't a lottery ticket; it's a permanent structure.
  *   **The Mechanic:** Because probabilities cannot be known or meaningfully estimated, the Expected Utility rule is inapplicable. When you cannot calculate odds, you cannot gamble.
  *   **The Result:** You must choose a principle that guarantees an acceptable outcome regardless of the odds. This pushes the agent toward **Maximin** (maximize the minimum).

  ### 2. The Risk Aversion Clash: "Irrational" vs. "Strains of Commitment"

  This is where Harsanyi's famous critique comes in.

  **Harsanyi's Critique: Infinite Risk Aversion**
  Harsanyi (specifically in his 1975 paper *"Can the Maximin Principle Serve as a Basis for Morality?"*) argues that Rawls's Maximin rule is irrational according to standard decision theory.
  *   **The Argument:** Maximin implies you would reject a 99.9% chance of being a billionaire for a 0.1% chance of being a peasant, just to avoid a 0.00001% chance of being slightly poorer than the peasant. Harsanyi claims Rawls assumes agents have **infinite risk aversion**. He argues this is psychologically unrealistic and ethically unjustified because it ignores the massive potential gains for the majority to protect the minority from risks that might not materialize.
  *   **The Mechanics:** Harsanyi assumes a linear (or near-linear) utility function regarding social primary goods. He thinks rational agents should be risk-neutral when the stakes are distributed across a whole life.

  **Rawls's Defense: The Gravity of the Stakes**
  Rawls denies he is assuming a psychological trait of "timidity." He argues the *structure of the choice* dictates the risk attitude.
  *   **The Argument:** In standard economics, if you make a bad gamble, you can try again next year. In the Original Position, the choice is **final and fundamental**. If you gamble on a Utilitarian society and lose, you might end up in a position where your basic liberties are sacrificed for the greater good. You cannot "recover" from being a slave or being denied the vote.
  *   **Strains of Commitment:** Rawls introduces the "strains of commitment." A contract is only valid if the parties can actually stick to it. If a Utilitarian agreement requires the bottom tier to accept starvation for the sake of the top tier's luxury, those at the bottom literally cannot commit to that agreement socially. Therefore, a rational agent knows they must choose a floor they can live with.
  *   **The Mechanics:** It's not infinite risk aversion; it's a **lexicographical ordering**. Basic liberties and the social minimum are lexical priorities; they cannot be traded off against aggregate utility.

  ### 3. The Currency: Utility vs. Primary Goods

  This is the often-overlooked mechanical difference that saves Rawls from some of Harsanyi's math.

  **Harsanyi: Cardinal Utility**
  Harsanyi's theorem requires **interpersonal comparison of utility**. To add up $U_1 + U_2 + U_3$, you need to know that one unit of "happiness" for Person A is comparable to one unit for Person B.
  *   **The Problem:** This is notoriously difficult. Does the rich man get more "utility" from a dollar than the poor man? Harsanyi assumes we can normalize these preferences.
  *   **The Consequence:** This makes his Utilitarianism vulnerable to the "expensive tastes" objection. If someone gets very little utility from resources, Utilitarianism might suggest giving them *more* resources to boost their utility score, or conversely, neglecting them if their capacity for happiness is low.

  **Rawls: Primary Goods**
  Rawls realized the utility problem was a trap. He switched the currency of justice from subjective *utility* to objective **Primary Goods** (rights, liberties, opportunities, income, wealth, and the social bases of self-respect).
  *   **The Mechanic:** Primary goods are "all-purpose means." Regardless of your specific life plan, you need liberties and resources.
  *   **The Consequence:** This makes the Maximin rule easier to apply. You don't need to compare subjective happiness; you just compare the index of goods. The "least advantaged" are simply those with the lowest index of primary goods. This sidesteps Harsanyi's requirement for cardinal utility comparison.

  ---

  ### Evaluation: Which Move is More Defensible?

  For your paper, you need to take a stance. Here is the argument for why **Rawls's move is more defensible**, specifically regarding the *moral* mechanics of the Veil, even if Harsanyi wins on *mathematical* consistency.

  **1. The Category Error of Probability**
  Harsanyi is technically correct *if* the Original Position is a gambling scenario. But Rawls is right that it isn't. Assigning equal probability ($1/n$) to social positions treats social status as a random accident like a genetic lottery. But social status is structurally determined.
  *   **Defensibility:** Rawls is more defensible here because applying Bayesian probability to foundational justice categories is a category error. You cannot derive an "ought" (justice) from a probabilistic "is" (chance of being poor) without smuggling in the assumption that all lives are of equal moral weight—which is what you were supposed to be proving. Rawls builds the equality into the *constraints* of the choice, not the *probabilities* of the outcome.

  **2. The "Separateness of Persons" Objection**
  Harsanyi's Utilitarianism aggregates utility across people as if society were a single super-person.
  *   **Defensibility:** Rawls's Maximin respects the **separateness of persons**. In Harsanyi's model, Person A's suffering can be cancelled out by Person B's joy. Rawls argues this violates the distinction between individuals. No one should be forced to accept a life below a certain dignity threshold just to boost the average. Rawls's risk aversion isn't "infinite"; it's a recognition that there are some losses (loss of liberty, loss of self-respect) that are *non-compensable*. You can't compensate a slave for their slavery by pointing out the master is very happy.

  **3. Stability and the Strains of Commitment**
  Harsanyi's model produces a society that might be unstable. If the bottom 10% know they are being sacrificed for the average, why would they cooperate?
  *   **Defensibility:** Rawls's focus on the "strains of commitment" makes his theory more sociologically defensible. A theory of justice must generate its own support. A Utilitarian society requires the losers to agree to their own loss for the greater good, which is psychologically and politically unsustainable. Rawls's Difference Principle ensures that even the losers benefit from inequality (e.g., incentives that grow the pie), making the social contract stable.

  **The Counter-Point (for nuance):**
  You must acknowledge where Harsanyi wins. Harsanyi is more defensible on **efficiency**. Rawls's Maximin can lead to "leveling down"—making everyone poorer just to ensure the gap isn't too wide, potentially hurting the poor in the long run by disincentivizing productivity. Harsanyi's Utilitarianism is better at handling trade-offs where small risks to the few save the many (e.g., public health policy).

  **Conclusion for your Paper:**
  Harsanyi wins on **formal decision theory** (if you accept the premises of expected utility). Rawls wins on **moral philosophy** (because the premises of expected utility are inappropriate for fundamental rights).
  Rawls is more defensible because he recognizes that justice is not about maximizing a value function, but about establishing terms of cooperation that free and equal persons can accept without being forced to gamble their basic status. Harsanyi's "rationality" is too thin; it captures economic rationality but misses *moral* rationality.

  **Key Citation Tip:** Make sure you cite Harsanyi's 1975 critique *"Can the Maximin Principle Serve as a Basis for Morality?"* and Rawls's response in *A Theory of Justice* (Section 26-27 on the reasoning leading to the two principles). That shows you've read the actual back-and-forth.
