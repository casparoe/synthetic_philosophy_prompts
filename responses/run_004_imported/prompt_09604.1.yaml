answer: |-
  Good evening, everyone. For those who don't know me, I'm one of the current students lucky enough to be finishing up Professor [Name]'s axiomatic set theory elective. When I was asked to speak first, I panicked a little. How do you follow a career that spans thirty years?

  Then I remembered her favorite joke. It's an old one in the field, attributed to Jerry Bona. It goes like this: "The Axiom of Choice is obviously true, the Well-Ordering Theorem is obviously false, and Zorn's Lemma? Nobody knows what that means."

  For the non-mathematicians here: the joke is that all three statements are mathematically identical. If one is true, they all are. They are provably equivalent. But to a human being, they feel completely different. One feels natural, one feels wrong, and one feels like magic.

  Professor [Name] lived in that gap. She was a cheerfully unrepentant classical mathematician. I don't think a single lecture went by without Zorn's Lemma conjuring a maximal object out of thin air. And whenever someone asked her to build it step-by-step, she'd just grin and say, "Existence doesn't owe anybody a construction."

  For a long time, I thought that was just about math. But standing here, looking around this room, I realize it's about something much bigger.

  We want to construct her legacy. We want to list every student she guided, every proof she corrected, every time she made a struggling major feel like they belonged in this department. But we can't. The set is too big. We can't build it.

  But if there's one thing she taught us, it's that you don't need to construct something to know it's there. You just need to trust the axioms.

  And the axioms here are simple. Kindness is non-empty. Rigor is compatible with warmth. And a life spent in pursuit of truth creates a maximal element that cannot be exceeded.

  To the logicians in the room: Yes, the statements are equivalent. To the family and friends: You don't need to understand the proof to know the theorem holds.

  Professor [Name], we know your retirement is obviously true. The department without you is obviously false. And as for what comes next? We might not know exactly what that looks like yet. But we trust you to find the maximal object in that set, too.

  To Professor [Name].
