      *   *Core Claim:* Numbers don't count in the sense of aggregation. Saving 5 is not *intrinsically* better than saving 1.
      *   *The "Loss" Argument:* What is lost when 1 dies? A life. What is lost when 5 die? Five lives. But is "five lives" a single loss experienced by a super-entity? No. Each person suffers their own loss. From the perspective of *each* individual, the loss is total (death).
      *   *The "Claim" Argument:* Each person has a claim to be saved. Does A's claim outweigh B's? No. Does A+B+C+D+E's claim outweigh F's? Taurek says no, because claims aren't additive. You can't sum claims across different persons.
      *   *The Solution:* Equal concern requires giving each person an equal chance. If you save the 5 automatically, the 1 has a 0% chance. If you flip a coin, the 1 has a 50% chance (and the group of 5 has a 50% chance). This respects the moral equality of persons.
      *   *Key Distinction:* It's not that you *must* flip a coin, but that you are *permitted* to. You aren't obligated to save the greater number.

  3.  **Deconstruct the Responses (The Counter-Arguments):**
      *   *Parfit (Innumerate Ethics):* The "Loss" argument fails. While there is no "group mind," it is still true that *more* bad things happen if 5 die. The world is worse. Parfit argues that Taurek's view leads to absurdities in larger numbers (e.g., saving 1 vs. a million).
      *   *Scanlon (Contractualism/Weighted Lottery):* Attempts a middle ground. Individuals have complaints. The complaint of the one is "I wasn't saved." The complaint of the five is "We weren't saved." Scanlon argues we need a principle no one could reasonably reject. A weighted lottery (giving higher probability to the larger group) might satisfy the demand for individual respect while acknowledging numbers.
      *   *Kamm (Principle of Permissibility):* Distinguishes between "saving the greater number" as a goal vs. a side constraint.
      *   *The "Tie-Breaker" Argument:* If you have no reason to prefer A over B, you flip. But do we have a reason? Yes, more lives saved.
      *   *The "Point of View of the Universe" vs. "Point of View of the Individual":* Utilitarianism takes the former; Taurek takes the latter.

