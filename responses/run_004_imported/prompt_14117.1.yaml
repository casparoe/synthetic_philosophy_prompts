answer: |-
  # The Separateness of Persons and the Weight of Numbers: A Verdict on Taurek vs. Parfit

  The intellectual lineage from Eliezer Yudkowsky's "Circular Altruism" to John Taurek's "Should the Numbers Count?" (1977) represents a fault line in moral philosophy. On one side stands the Effective Altruist and LessWrong intuition: *Shut Up and Multiply*. If one life has value *V*, five lives have value *5V*. To do otherwise is arithmetic heresy. On the other side stands Taurek, who argues that this arithmetic is a category error—that persons are distinct containers of value, and you cannot pour their claims into a single bucket to be weighed.

  For the LW/EA community, Taurek is often treated as a bogeyman, a philosopher so detached from reality that his views need only be mocked to be dismissed. This is a mistake. Taurek's argument is the strongest available challenge to the aggregationist worldview. If he is right, the mathematical core of cause prioritization is morally suspect.

  Below, I will steelman Taurek's case, outline the strongest rebuttals (primarily from Parfit and Scanlon), and deliver a verdict. I will not hedge. Taurek is wrong, but the reason *why* he is wrong requires a more sophisticated understanding of aggregation than the standard utilitarian provides.

  ---

  ### I. The Taurekian Case: Why Numbers Might Not Count

  To defeat Taurek, we must first stop treating him as a confused utilitarian. He is not arguing that saving five people produces *less* utility; he is arguing that "utility" is not the kind of thing that can be summed across persons in a choice situation. His argument rests on three pillars: **The No Greater Loss Thesis**, **The Separateness of Persons**, and **Equal Concern**.

  **1. The No Greater Loss Thesis**
  Taurek asks us to consider the loss involved in death. If person A dies, the loss is "A's life." If persons B, C, D, E, and F die, the loss is "B's life," "C's life," etc. Taurek argues there is no super-entity, "The Group," that suffers a loss called "Five Lives." There are only five individuals, each suffering the loss of "One Life."
  From the perspective of *each* individual, the loss is total. A does not lose "1/5th" of the tragedy; A loses everything. Therefore, in terms of *individual* suffering, the loss in the 5-case is not greater than the loss in the 1-case; it is simply *more widespread*. Taurek contends that "more widespread loss" is not a coherent metric for moral decision-making unless there is a single subject to experience the aggregation. Since there is no "social mind," there is no one for whom the 5-case is worse.

  **2. The Separateness of Persons and Claims**
  This leads to the argument about claims. Each person has a claim on you to be saved. Taurek argues that claims are non-aggregative. A's claim does not outweigh B's claim. Crucially, A's claim + B's claim does not outweigh C's claim.
  To think otherwise, Taurek suggests, is to treat the five as a single mass. It implies that the individuality of the five is morally irrelevant; only the *count* matters. If you save the five solely because they are five, you are not respecting them as individuals; you are using them as units to outweigh the one.

  **3. Equal Concern Implies Equal Chance**
  If no individual's claim outweighs another's, and claims do not sum, how do you choose? Taurek argues that "Equal Concern" for each person requires giving each person an equal *chance* of being saved.
  If you automatically save the five, the one person has a 0% chance of survival. Their claim is effectively discarded. If you flip a coin (giving the one person a 50% chance and the group of five a 50% chance), you acknowledge that the one person's claim is not morally negligible. For Taurek, you are not *required* to flip a coin, but you are *permitted* to. To insist on saving the five is to fail to show equal respect to the one.

  ---

  ### II. The Counter-Offensive: Parfit, Scanlon, and the Agent's Perspective

  The response to Taurek generally comes from two angles: the *Outcome* angle (Parfit) and the *Procedure* angle (Scanlon/Kamm).

  **1. Parfit's *Innumerate Ethics* (The Reductio)**
  Derek Parfit's rebuttal is the most famous. He accepts Taurek's ontology (there is no group mind) but rejects the conclusion. Parfit argues that even if there is no single subject of loss, it is still true that *more bad things happen* when five die than when one dies.
  Parfit pushes Taurek to the limit: Would you flip a coin between saving one person and saving a million? If the numbers truly don't count, the answer should be "Yes, or at least it's permissible." Parfit argues this is absurd. The moral significance of numbers is not linear, but it is not zero. To ignore the million is to treat their individual losses as irrelevant, which is a greater violation of respect than overriding the one.

  **2. The Aggregation of Claims (Scanlon and Hirose)**
  T.M. Scanlon, working within contractualism, offers a more nuanced rebuttal. He agrees with Taurek that we must justify our actions to each individual. However, Scanlon argues that when comparing complaints, we can look at the *strength* of the reasons.
  Each of the five has a reason to be saved ("I will die"). The one has a reason to be saved ("I will die"). These reasons are equal in strength. However, the agent faces a set of reasons. If the agent ignores the five, they are ignoring five distinct, valid reasons. If they ignore the one, they ignore one.
  Modern aggregationists (like Alex Hirose) argue that Taurek conflates *experiences* (which cannot be shared) with *reasons for action* (which can be summed). An agent acts in the world. The fact that there are five distinct sources of moral pressure (the five people) creates a stronger moral force than one source, even if those sources never meet.

  **3. The "Tie-Breaker" Argument**
  A simpler, pragmatic argument is this: If you flip a coin, you are admitting you have no reason to prefer one outcome over the other. But you *do* have a reason. You have a reason to save A, and a reason to save B... and a reason to save E. You have no additional reason to save F (the one). If you treat the presence of B, C, D, and E as morally irrelevant to the choice between F and A, you are effectively saying their existence changes nothing about the moral landscape. That is a harder metaphysical bullet to bite than aggregation.

  ---

  ### III. The Verdict: Taurek is Wrong, But the Reason Matters

  Here is the verdict: **Taurek's Non-Aggregationism is false. You are obligated to save the five.** However, the standard utilitarian justification ("maximize total utility") is vulnerable to Taurek's critique. The correct justification is **Claim-Based Aggregation**.

  Taurek wins the ontological point but loses the deontological one.
  He is right that there is no "Group Mind" suffering a "Greater Loss." If you argue that "The Universe prefers 5 lives," Taurek has you. But moral decisions are not made by the Universe; they are made by **agents** who stand in relation to **claimants**.

  **Why Taurek Loses:**
  Taurek's argument collapses under the weight of the **Agent's Perspective**.
  When you stand with the drug in your hand, you are not comparing "Loss A" vs. "Loss B." You are comparing "My action toward A" vs. "My action toward B, C, D, E, and F."
  Taurek argues that giving the one person a 50% chance (via coin flip) shows them more respect. I argue the opposite: **Giving the one person a 50% chance treats the five as mere means to a lottery.**

  If you flip a coin, you are telling the five: *"Your individual claims to life are not sufficient to warrant saving you. You need to be grouped together to even get a 50% shot, and even then, you might all die so that one person can have a chance."*
  By saving the five, you acknowledge that *each* of them has a claim that demands satisfaction. You satisfy five claims instead of one. This is not "summing utility"; it is **satisfying more individual reasons.**

  **The Winning Position: Individual-Centered Aggregation**
  The correct view is a hybrid that accepts Taurek's "Separateness of Persons" but rejects his "Non-Aggregation of Claims."
  1.  **Ontology:** Only individuals exist. (Taurek is right).
  2.  **Moral Force:** Each individual generates a moral reason for the agent to save them. (Taurek is right).
  3.  **Aggregation:** Moral reasons *do* aggregate at the level of the agent's decision. (Taurek is wrong).

  Why do reasons aggregate? Because the agent is a single locus of action. I cannot act five times; I must act once. In that single action, I must weigh the reasons presented to me. If I have five reasons of weight *W* on the left, and one reason of weight *W* on the right, the rational choice is to follow the greater weight of reasons. To do otherwise is to arbitrarily privilege one reason over five identical ones.

  Taurek's "Equal Chance" model fails because it prioritizes *procedural fairness* (the coin flip) over *substantive outcomes* (who lives). In life-and-death stakes, substantive outcomes dominate. A coin flip is appropriate for dividing a cake (where fairness is the goal); it is inappropriate for saving lives (where survival is the goal).

  **The "Million Person" Knockout**
  The ultimate refutation is scale. If Taurek is right, it is permissible to save 1 person rather than 1,000,000. If you hold this view, you must admit that the deaths of the 999,999 are morally irrelevant to the decision. This renders morality impotent in the face of large-scale suffering. A moral theory that cannot distinguish between 1 death and 1 million deaths is not a "humble" theory; it is a broken one.

  ### Conclusion: Shut Up and Multiply (With Caveats)

  For the LessWrong and EA community, the takeaway is not simply "Taurek is wrong, so keep maximizing." The takeaway is that **aggregation must be grounded in individual claims, not abstract utility.**

  Taurek's paper is a vital vaccine against "Utility Monster" thinking. It reminds us that we save the five *for the sake of the five*, not for the sake of the Number 5. But his conclusion that this prohibits counting is a non-sequitur.
  *   **Taurek:** "Persons are separate, therefore numbers don't count."
  *   **Verdict:** "Persons are separate, therefore *each* number counts, and because they are separate, their counts add up in the agent's deliberation."

  You are obligated to save the five. To flip a coin is not an act of humility; it is an act of moral negligence disguised as fairness. The numbers count, not because the universe is a calculator, but because every single number represents a person with a claim that demands to be heard, and ignoring five voices to hear one is not equality—it is arbitrariness.
