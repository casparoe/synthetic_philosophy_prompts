      *   **Part 3: The Verdict:** Taurek loses. But *why*? Not just "utilitarianism says so." The argument must be that Taurek's model of "claims" is flawed. Claims *do* aggregate in decision-making contexts because the *agent* has to act. The "Point of View of the Agent" requires minimizing wrongs.
