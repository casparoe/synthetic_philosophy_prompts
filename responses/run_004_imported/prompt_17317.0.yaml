  2.  **Deconstruct the Arguments:**
      *   *Aumann's Position (1995/1998):* CKR is defined over strategies *ex ante*. If players know each other's rationality and the game structure, they know each other's strategy choices. If a strategy is dominated given what you know, you don't play it. In the centipede game, the only strategy profile consistent with CKR *ex ante* is immediate defection. The "what if we reach node 20" question is a counterfactual that is inconsistent with the *ex ante* knowledge state. You don't update on reaching node 20 because CKR says you won't reach node 20.
