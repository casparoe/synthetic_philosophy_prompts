      *   **Propensity & Humphreys' Paradox:** Explain the view (physical chance). Explain Humphreys' Paradox (inversion issue). Show why this doesn't fit ML or Meteorology well (meteorology is complex systems, not quantum decay; ML is statistical mapping, not physical disposition).
