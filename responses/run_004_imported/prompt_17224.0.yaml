answer: |-
  Here are nine interview questions designed for your podcast, structured to move from the technical mechanics of the view to its moral implications, and finally to its meta-ethical defenses. The three mandatory questions are included with the requested follow-ups.

  **1. The Status of the Thesis**
  Many readers treat Williams's internalism as a conceptual truth about the word "reason," while others read it as a substantive claim about human psychology. How do you read the thesis? If it is merely a claim about how we use the word "reason," it seems compatible with externalism (we just use the word differently); but if it is a substantive claim about motivation, it seems vulnerable to empirical counter-examples. Where do you locate the force of the argument?

  **2. The Limits of Deliberation (The Wingrave Case)**
  In *Internal and External Reasons*, Williams uses the case of Owen Wingrave to argue that family tradition cannot generate a reason for him to join the army if nothing in his subjective motivational set ($S$) supports it. But Williams also insists that a "sound deliberative route" can do more than just instrumental calculation; it can involve imagination and correcting factual errors. My question is: what exactly is deliberation permitted to *add* to $S$ without quietly importing an external reason? If Wingrave imagines the life of a soldier and still feels nothing, has deliberation failed, or has it revealed a truth about his reasons? Where is the line between discovering a latent motivation and creating a new one that wasn't there before?

  *   **Follow-up (Keyed to likely answer):** You will likely say that deliberation clarifies or extends existing commitments through imagination. But if the *norm* of "sound deliberation" itself requires us to imagine certain outcomes as significant, doesn't that norm presuppose an external reason to deliberate in that specific way? How do you ground the authority of the deliberative process itself without appealing to the very external reasons you reject?

  **3. The Reason to Deliberate**
  Following on that, if an agent has no desire to be rational or to deliberate soundly, does she have a reason to deliberate? If the answer is "no," then internalism seems to lose its grip on agents who are indifferent to reasoning. If the answer is "yes," then there is at least one universal internal reason (to deliberate well), which looks suspiciously like the foothold externalists need to get morality back in. How do you handle the agent who is contentedly irrational?

  **4. The Nasty Husband (The Obscurity of Blame)**
  In his later work on blame, Williams discusses the husband who is openly nasty to his wife and admits he does not care about her welfare. Williams suggests we can still blame him, not because he is irrational, but because blame is a modification of our relationship with him. But if we grant he has no internal reason to change, doesn't this reduce blame to a mere threat or a expression of our own frustration? How does internalism make sense of the *normative* force of blame—the sense that he *should* feel guilt—once we have conceded he is not making a rational mistake?

  *   **Follow-up (Keyed to likely answer):** You will likely argue that blame is a reactive attitude that doesn't require the target to acknowledge a reason. But if the husband asks, "Why should I care about your reactive attitudes?", and there is no element in his $S$ that connects to caring about you, isn't the internalist forced to say there is literally nothing to say to him? Does this not surrender the critical power of morality to the contingencies of an agent's existing cares?

  **5. Moral Conversion and Change**
  One worry about internalism is that it makes moral improvement mysterious. If a selfish person becomes generous, the externalist says they have recognized a reason that was always there. But for the internalist, something in their $S$ must have changed. Do you view moral conversion as a rational process of coming to see what was already there, or is it more like a causal shift in psychology, akin to falling in love? If it's the latter, how do we praise the converted agent for being *rational* rather than just lucky?

  **6. The Role of Emotion**
  Williams allows that emotions can be part of the subjective motivational set. But some externalists argue that certain emotions, like moral outrage or guilt, *presuppose* external reasons. For example, if I feel guilty, I feel I have violated a standard that applies to me regardless of my desires. Do you think these emotions are systematically in error, or can an internalist give an error theory of moral emotions that doesn't make our moral life seem like a massive fiction?

  **7. The Korsgaard Objection**
  Christine Korsgaard has argued that Williams's internalism begs the question against the externalist. She claims Williams treats an agent's being unmoved by a consideration as *proof* that it is not a reason for them, rather than as *evidence* that the agent is irrational. By defining reasons in terms of what motivates (or could motivate) via deliberation, isn't Williams simply stipulating that external reasons don't exist, rather than proving they can't exist? How do you respond to the charge that internalism is a tautology dressed up as an argument?

  *   **Follow-up (Keyed to likely answer):** You will likely defend internalism on the grounds of explanatory power: reasons must be able to explain action, and external reasons cannot. But if the externalist replies that reasons *justify* action rather than merely explain it, does your appeal to explanation simply talk past them? Is the dispute ultimately just a verbal disagreement about the definition of "reason," or is there a substantive fact of the matter you think you are capturing?

  **8. "Ought" Without "Reason"**
  If internalism is true, there will be cases where we say an agent "ought" to do something, even though they have no reason to do it (because it connects to nothing in their $S$). This creates a gap between "ought" and "reason." Is this a feature or a bug? Does retaining the word "ought" in these cases preserve enough normative force to satisfy our moral intuitions, or should internalists be more revisionary and admit that in these cases, the agent simply has no obligation?

  **9. Falsifiability**
  To close, I want to ask about the resilience of the view. Internalism is often criticized for being unfalsifiable; any time a counter-example is proposed, the internalist can posit a hypothetical element in the agent's $S$ or a complex deliberative route that would connect to it. So, what kind of case, if any, would you accept as genuine evidence against internalism? Is there a conceivable agent or situation that would force you to concede that a reason can exist entirely independently of an agent's subjective motivational set?
