answer: |-
  This is one of the most mind-bending results in the foundations of mathematics, and your confusion is completely warranted. It feels like magic, but it's actually a consequence of changing the *ontology* of what a number *is*.

  Here is the gut-level story of why Brouwer's intuitionism forces all functions to be continuous, and why this is a genuine contradiction of classical math rather than just a cautious subset.

  ### 1. The Real Number as a Process, Not a Thing

  In classical mathematics, a real number is a **completed object**. Even if we can't write down all the digits of $\pi$, we believe they are all "there," fixed and determined, like a finished tape measure stretching out to infinity. Because the number is a finished thing, you can make global claims about it (e.g., "Is it greater than 0?") even if you can't computationally verify it.

  In Brouwer's intuitionism, a real number is a **choice sequence**. It is not a finished object; it is a temporal process. Think of a real number not as a decimal expansion, but as an **oracle** or a **dialogue**.
  *   You ask the number: "What is your first digit?" It answers.
  *   You ask: "What is your second digit?" It answers.
  *   Crucially, the future digits are not necessarily pre-determined. They are "free choices" made by the creating subject (the mathematician or the universe) as time goes on.

  Even if the number *looks* like it's converging to 0 (0.00000...), you never know if the next digit will suddenly be a 5. The number is fundamentally "in progress."

  ### 2. The Function as an Algorithm

  Now, consider a function $f: \mathbb{R} \to \mathbb{R}$. In intuitionism, a function isn't just a set of pairings (a graph); it is a **law** or an **algorithm** that transforms input numbers into output numbers.

  Because the input number ($x$) is a process (a sequence of digits revealed over time), the function ($f$) must also operate in time. To compute $f(x)$, the function asks $x$ for digits.
  *   The function needs to produce an output within a certain precision (say, within $\epsilon = 0.1$).
  *   To do this, it asks $x$ for its first $N$ digits.
  *   **The Kicker:** The function cannot wait forever. It must produce an answer after a finite number of steps.

  ### 3. Why This Forces Continuity

  This finite requirement is the engine of the continuity theorem.

  If the function $f$ can determine the value of $f(x)$ to within precision $\epsilon$ after looking at only the first $N$ digits of $x$, then **any other number $y$ that shares those first $N$ digits must produce essentially the same output.**

  Why? Because the function stops looking after $N$ digits. It doesn't know (and doesn't care) what the $(N+1)$-th digit is. Therefore, if $x$ and $y$ are "close enough" (agree on the first $N$ digits), $f(x)$ and $f(y)$ must be "close enough" (agree on the computed output).

  **This is literally the definition of continuity.**
  *   **Classical Continuity:** For every $\epsilon$, there exists a $\delta$ such that $|x-y|<\delta \implies |f(x)-f(y)|<\epsilon$.
  *   **Intuitionistic Reality:** To compute output precision $\epsilon$, you only need input precision $\delta$ (the first $N$ digits).

  Therefore, any function that can actually be defined on these "in-progress" numbers *must* be continuous.

  ### 4. Why the Step Function Dies

  You mentioned the step function (0 if $x < 0$, 1 if $x \ge 0$). Classically, this exists. Intuitionistically, it is not a **total function**.

  Imagine you feed the number $x = 0.00000\dots$ into the step function algorithm.
  *   The algorithm needs to decide: output 0 or output 1?
  *   To decide, it needs to know if $x$ is strictly less than 0 or greater/equal to 0.
  *   But $x$ is a choice sequence. It has given you a million zeros so far. Is it *really* zero, or will it spit out a $-1$ in the million-and-first position?
  *   The algorithm cannot decide yet. It must wait for more digits.
  *   If $x$ turns out to be exactly 0 (all zeros forever), the algorithm waits forever. It never outputs a value.

  Since a function in intuitionism must yield a value in finite time for *any* valid input, the step function fails to be a function at all. It is undefined at the "fuzzy" boundary points where the choice sequence hasn't decided its sign yet.

  ### 5. Brouwer vs. Bishop: Contradiction vs. Restriction

  This is the crux of your second question. Why is Brouwer contradicting classical math, while Errett Bishop (another constructivist) is not?

  **Bishop's Constructive Math:**
  Bishop rejects the Law of Excluded Middle (LEM). He says, "I won't assume a number is either $<0$ or $\ge 0$ unless I can prove which one."
  *   **Result:** He cannot *prove* that discontinuous functions exist.
  *   **But:** He also does *not* prove that they *don't* exist. He simply leaves the question open.
  *   **Relationship to Classical:** Classical math is just Bishop's math + LEM. They are compatible. Bishop is a "weaker fragment."

  **Brouwer's Intuitionism:**
  Brouwer does more than just reject LEM. He adds **positive axioms** about the nature of the continuum that are incompatible with classical logic. Specifically, he uses the **Fan Theorem** and the **Continuity Principle**.
  *   These axioms assert that the continuum is "cohesive." It cannot be split into disjoint, non-empty open sets (which is what a discontinuous function would require).
  *   Brouwer actively proves $\neg (\exists f \text{ is discontinuous})$.
  *   **Relationship to Classical:** This is a direct logical negation of the classical theorem $\exists f \text{ is discontinuous}$.

  **The "Wild" Part:**
  Brouwer isn't just being careful; he is describing a different universe.
  *   **Classical Universe:** The real line is a set of points (dust). You can cut it anywhere.
  *   **Brouwer's Universe:** The real line is a fluid medium. You cannot cut it without smearing it.

  When Brouwer proves "All functions are continuous," he is using axioms (like the Fan Theorem) that a classical mathematician would reject as **false**. Conversely, the classical mathematician uses LEM, which Brouwer rejects as **invalid**. They are talking past each other, but within the formal system of Intuitionistic Analysis, the statement "There exists a discontinuous function" is provably false, not just unprovable.

  ### Summary

  1.  **Reals are Processes:** A real number is a stream of digits, not a fixed string.
  2.  **Functions are Finite:** To compute an output, a function can only inspect a finite prefix of the input stream.
  3.  **Finite Info = Continuity:** If the output depends only on a finite prefix of the input, then inputs that share that prefix (are close) must yield similar outputs. That is continuity.
  4.  **Step Functions Fail:** They require infinite information to resolve at the boundary (is it exactly 0?), so they time out and aren't total functions.
  5.  **Contradiction:** Brouwer adds axioms (Fan Theorem) that actively rule out classical "point-like" behavior, making "All functions are continuous" a theorem, whereas Bishop merely lacks the tools to construct discontinuous ones without ruling them out metaphysically.

  You've fallen down a rabbit hole where the fabric of mathematical reality is fluid rather than atomic. It's unsettling, but it's also one of the most profound critiques of how we conceptualize infinity.
