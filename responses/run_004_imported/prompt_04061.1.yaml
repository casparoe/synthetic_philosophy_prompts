answer: |-
  **Title:** The Illusion of Insulation: Why Surrogate Goals Fail as a Defense Against Acausal Threats

  **Introduction**

  In the landscape of formal decision theory, particularly within the frameworks of Functional Decision Theory (FDT) and Updateless Decision Theory (UDT), acausal threats present a unique pathological case. Unlike causal blackmail, where a threatener signals an intent to harm contingent on the victim's compliance, acausal threats rely on logical correlation. A malicious agent (or a simulation thereof) predicts the victim's policy; if the policy is to yield to blackmail, the threat is issued, and the victim pays. If the policy is to resist, the threat is never issued. The standard causal remedy—publicly committing to never pay—fails here because there is no causal channel through which the commitment can travel to deter the threatener before the prediction is made. The commitment must be baked into the agent's source code.

  To circumvent this, some theorists have proposed the "surrogate goal" strategy. An agent artificially cultivates a high-stakes concern for an arbitrary object (e.g., a sculpture) and commits to defending it with the same ferocity as their core values (e.g., survival). The hope is that an indifferent threatener will target the surrogate rather than the real value, leaving the agent's actual welfare untouched. While elegant, this strategy faces two devastating objections: the vulnerability to conjunctive threats and the problem of credibility. This essay argues that while surrogate goals illuminate the mechanics of precommitment, they do not deliver the protection they promise. Against a sophisticated acausal adversary, the strategy is rationally unstable and ultimately fails to secure the agent.

  **The Credibility Constraint**

  The second objection raised in seminar concerns credibility: why should a threatener believe the agent will defend the sculpture when, ex-post, nothing of genuine value is lost if it is destroyed? In Causal Decision Theory (CDT), this objection is fatal. A CDT agent maximizes utility at the moment of decision; since the sculpture is instrumentally inert, yielding is the dominant strategy. A sophisticated threatener simulates this reasoning and ignores the bluff.

  However, within FDT and UDT, the credibility problem is less severe but not resolved. These theories posit that agents select a *policy* (a mapping from inputs to actions) rather than individual actions. An FDT agent can indeed select a policy of "Defend Sculpture" ex-ante, knowing that this policy reduces the probability of the threat being issued. The threatener, simulating the agent's source code, sees that resistance is the inevitable output. Thus, in the narrow context of policy selection, the commitment can be credible.

  Yet, credibility comes at a steep price. For the commitment to be logically binding, the agent cannot merely *say* they value the sculpture; their utility function must reflect this valuation. If the utility function remains unchanged, the agent is merely bluffing, and a perfect simulator will detect the discrepancy between the stated policy and the utility maximization drive. To make the threat credible, the agent must genuinely modify their utility function to assign high disutility to the sculpture's destruction. This transforms the surrogate from a tactical feint into a genuine vulnerability. The agent is no longer pretending to care; they *do* care. This leads directly to the first, more destructive objection.

  **The Conjunctive Threat**

  The first objection asks why a sophisticated threatener would not simply threaten both the sculpture and the agent's life. This is the fatal flaw of the surrogate goal strategy. The strategy relies on the assumption of threatener indifference: the threatener wants compliance and does not care *how* they get it, so they will choose the path of least resistance. The surrogate goal attempts to make threatening the sculpture as "resistant" as threatening life, hoping the threatener moves to the surrogate and is then deterred by the resistance.

  However, the agent cannot cease to value their own survival. Even if they successfully modify their utility function to value the sculpture, they cannot excise the value of their own life without ceasing to be the same agent. Consequently, the agent now values *both* the sculpture and their life. A sophisticated threatener, recognizing this, has no incentive to limit their leverage to the surrogate. They can issue a conjunctive threat: "Comply, or I will destroy the sculpture *and* kill you."

  Faced with this conjunctive threat, the agent's calculation collapses. If they resist, they lose both the surrogate (which they now genuinely value) and their life (which they always valued). If they comply, they lose only the cost of compliance. Since the cost of compliance is presumably less than death plus sculpture-destruction, the rational choice is to pay. The surrogate goal has not shifted the target; it has expanded the attack surface. The agent is now vulnerable to threats against the sculpture *in addition to* threats against their life, rather than instead of them.

  Proponents might argue that the threatener is constrained—for instance, that they can only simulate the sculpture and not the agent's biological death. But in the context of acausal threats, we are typically discussing logical correlations between algorithms. If the threatener can correlate with the agent's decision regarding the sculpture, they can generally correlate with the agent's decision regarding survival, as both are outputs of the same source code. Unless there is a specific, exogenous constraint preventing the threatener from referencing the agent's core values, the conjunctive threat is always available. A strategy that relies on the adversary voluntarily ignoring a more potent lever is not a defense; it is a hope.

  **The Cost of Rigidity**

  Beyond the specific objections, there is a broader consideration regarding the stability of the strategy. To make the surrogate goal work, the agent must irreversibly bind their utility function. This introduces a risk of "value lock-in." By artificially inflating the value of an arbitrary object, the agent risks making suboptimal decisions in non-threat scenarios. For example, if destroying the sculpture is the only way to save a third party (who is not the threatener), the agent's modified utility function may compel them to save the sculpture at the cost of the third party.

  A rational agent weighs the expected utility of the precommitment against its costs. The benefit is protection from acausal blackmail; the cost is reduced flexibility in all other decision contexts. Given that the protection is illusory against conjunctive threats, the cost-benefit analysis turns negative. The agent incurs the permanent cost of a distorted utility function without securing the promised benefit of threat immunity. A more rational approach would be to maintain a flexible utility function and rely on other deterrents, such as reputation or the inherent difficulty of executing the threat, rather than attempting to hack one's own value system.

  **Verdict**

  We must therefore reach a definite conclusion on the viability of surrogate goals. The strategy promises to insulate an agent's core values by shifting the locus of conflict to an arbitrary substitute. It fails to deliver this protection because it cannot eliminate the original locus of conflict. As long as the agent values their survival, a sophisticated acausal threatener can bundle the surrogate with the survival threat, rendering the surrogate irrelevant to the compliance calculation. Furthermore, making the threat credible requires a genuine modification of the utility function, which imposes permanent costs and rigidity on the agent without guaranteeing safety.

  Consequently, adopting a surrogate goal is **not a rational, stable strategy** for an agent facing possible acausal threats. It is a solution that addresses the credibility problem only by exacerbating the vulnerability problem. It treats the symptom (the threatener's choice of target) while ignoring the disease (the agent's inability to precommit to non-compliance on core values). While the discussion of surrogate goals is pedagogically valuable for understanding the mechanics of FDT precommitment, it should not be adopted as a operational defense. The only robust defense against acausal blackmail remains the difficult, often perilous policy of never yielding, applied directly to one's actual values, accepting the risk that some threateners may still call the bluff. Surrogate goals offer a false sense of security that a sufficiently logical adversary will easily penetrate.
