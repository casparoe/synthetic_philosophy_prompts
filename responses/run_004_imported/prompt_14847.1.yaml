  2.  **Analyze the Source Material (Mental Knowledge Retrieval):**
      *   **Du Bois, "The Criteria of Negro Art" (1926):**
          *   *Core Thesis:* "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
          *   *Meaning:* Art inevitably promotes a viewpoint. Given the racial climate, Black art *must* fight for racial equality/justice.
          *   *Beauty/Truth/Right:* Du Bois argues for the triad. Beauty is essential, but it must be grounded in Truth (honest representation of Black life) and Right (justice/moral aim). Beauty without Truth/Right is hollow/propaganda for the oppressor.
          *   *Propaganda:* He reclaims the term. It doesn't mean "bad art." It means art with a purpose.
      *   **Alain Locke (The New Negro):**
          *   *Core Thesis:* Often associated with "art for art's sake" *relative* to Du Bois, but this is a common oversimplification.
          *   *Nuance:* Locke valued art as a means of racial uplift (cultural diplomacy), but he emphasized *aesthetic excellence* and *individual expression* over direct political agitprop. He feared that demanding art be purely propaganda would stunt artistic growth. He wasn't strictly "art for art's sake" in the Oscar Wilde sense, but he prioritized aesthetic autonomy more than Du Bois.
      *   **The Debate:** The Du Bois-Locke debate is a classic topic in Harlem Renaissance studies. Du Bois = Social Responsibility/Propaganda. Locke = Aesthetic Freedom/Cultural Diplomacy (though often simplified as "art for art's sake" in intro courses).

