  ### A Note for You (The Proxy Grader)
  If your friend (the professor) is a stickler for the **Locke** nuance, you might want to drop that score to an **8.5/10**. Locke is often misread as a pure aesthete, but in *The New Negro*, he argues that art is the best way to fix race relations—just by showing Black humanity rather than arguing for it.

  However, if this is a 101-level course, the **Du Bois = Propaganda / Locke = Aesthetics** binary is often the intended "correct" answer. If that's the case, bump it back to a **10/10**. The student wrote exactly what most intro syllabi look for.

