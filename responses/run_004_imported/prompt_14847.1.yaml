          *   *Claim:* "Pulling race or politics into the work at all can only cheapen it." (This is a bit too strong/shaky. Locke believed art *could* uplift the race by showing excellence, just not through heavy-handed didacticism. He didn't want race *excluded*, he wanted it *transcended* through quality).
          *   *Claim:* "Kept free of any social purpose whatsoever." (Again, a bit extreme. Locke saw social purpose in cultural validation, just not direct political messaging).
      *   **Overall:** It's a B+/A- answer. It grasps Du Bois very well. It simplifies Locke a bit too much (the "straw man" risk), but likely fits the scope of an intro course.

