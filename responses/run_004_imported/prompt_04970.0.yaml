      *   **Conscientious Objection (CO):** Traditionally limited to "opposition to participation in war in any form" (Pacifism).
      *   **Selective Conscientious Objection (SCO):** Objection to a specific war. Generally not recognized in US law.
      *   **Institutional Necessity:** The need for a functioning military requires a presumption of legitimacy regarding orders and deployments.

