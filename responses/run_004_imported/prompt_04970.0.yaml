      *   **The Regulation:** Current regulations grant CO status *only* to those opposed to war in *any form* (traditional pacifism). The reasoning is institutional necessity (cannot have soldiers picking and choosing wars).
      *   **The Task:** Draft a memo for the Board. It needs a concrete disposition (approve/deny), next steps, and a timeframe.
