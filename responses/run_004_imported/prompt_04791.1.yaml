answer: |-
  **MEMORANDUM**

  **TO:** The Educational Policy Committee
  **FROM:** Undergraduate Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal 24-B: Open-Resource Assessment Policy

  ### Executive Summary

  This memo serves as the Educational Policy Committee's formal response to Provost Proposal 24-B, which permits departments to opt into "open-resource" examinations where students may consult the internet and AI chatbots during timed assessments.

  After deliberation, the Committee recommends **adopting the policy with specific epistemic conditions.** We cannot endorse the proposal as currently written, nor can we recommend a blanket rejection. The Provost's argument rests on a pragmatic equivalence between *true belief* and *knowledge*: if the output is correct, the process is irrelevant. While this view accurately reflects certain workplace realities, it fails to account for the specific educational good a university degree is meant to certify. A degree signifies not merely the possession of correct information, but the cultivation of *understanding* and *cognitive agency*. Therefore, we recommend adoption conditional on assessment designs that verify the internalization of material and the student's agential control over the tools used.

  ### The Epistemological Stakes

  The debate within this committee mirrors a foundational question in epistemology: *Why is knowledge more valuable than merely true belief?*

  **The Provost's Position (The Meno Argument)**
  The Provost's office argues that the ultimate goal of education is downstream competence. This aligns with the argument Socrates considers in Plato's *Meno*: a guide with mere true opinion about the road to Larissa will get you there just as reliably as a guide who possesses knowledge of the road. If the destination (correct answer/competent action) is reached, the Provost argues, the university has no principled basis for insisting on the "tethered" route of internalized study. From this perspective, prohibiting AI is akin to prohibiting a calculator; it fetishizes the struggle of unassisted recall rather than the utility of the result. This view is strongly held by our colleagues in the professional schools, who note that modern licensure and employment rely on the effective orchestration of external resources, not isolated recall.

  **The Committee's Counter-Position (Credit and Understanding)**
  However, if the university's mission were solely to produce correct outputs, the Provost's view would be sufficient. But a university degree certifies a specific kind of cognitive achievement. Drawing on *credit theories of knowledge*, we hold that for a belief to count as knowledge, the truth of that belief must be *because of* the agent's cognitive abilities. If a student submits a correct answer generated by an AI, the truth of the belief is primarily creditable to the algorithm, not the student.

  Furthermore, as Jonathan Kvanvig argues, the value that resists "swamping" is not merely knowledge, but *understanding*. Understanding requires grasping the explanatory coherence between pieces of information. An AI can provide a true belief (a correct answer), but it cannot instantly confer understanding (the grasp of *why* the answer is correct and how it relates to a broader system). If we allow open-resource exams without safeguards, we risk certifying students who possess a database of true beliefs but lack the internalized architecture to evaluate, integrate, or explain them when the tool fails.

  ### Recommendation: Adoption with Conditions

  To reconcile the workplace necessity of tool use with the academic necessity of cognitive development, the Committee recommends adopting Proposal 24-B subject to the following three conditions. These conditions are designed to ensure that assessments measure *understanding* and *agency*, not just *output accuracy*.

  **1. The "Tethering" Requirement (Internalization)**
  Departments opting into open-resource exams must demonstrate that the course includes mechanisms to verify the "tethering" of true beliefs. Following the *Meno* distinction, true opinion becomes knowledge when it is tied down by reasoning.
  *   **Policy Condition:** Courses utilizing open-resource exams must include at least one low-stakes, closed-resource component (e.g., a foundational quiz or oral defense) that verifies the student has internalized the core vocabulary and logical structures of the discipline. This ensures the student possesses the cognitive scaffolding necessary to evaluate the AI's output, rather than serving as a passive conduit for it.

  **2. Assessment of Cognitive Agency (Credit Theory)**
  Grading rubrics for open-resource exams must shift from evaluating the *correctness* of the answer to evaluating the *process* of verification.
  *   **Policy Condition:** Submissions must include an "audit trail" or reflective addendum where the student documents how they queried the tool, how they verified the output against course materials, and where they corrected the tool's errors. Credit is awarded for the *exercise of judgment*, ensuring the final belief is creditable to the student's agency, satisfying the credit theory requirement for knowledge.

  **3. Coherence over Proposition (Kvanvig's Understanding)**
  Exam prompts must be designed to test explanatory coherence rather than propositional recall.
  *   **Policy Condition:** Departments must certify that open-resource exam questions cannot be solved by a single query. Questions must require synthesizing multiple sources, identifying contradictions, or applying concepts to novel scenarios where the AI provides data but not the *structure* of the argument. This protects the value of *understanding*, ensuring the degree certifies a grasp of the subject's landscape, not just a collection of coordinates.

  ### Conclusion

  The Provost is correct that in many professional contexts, true belief produced by tools is functionally equivalent to knowledge. However, the university is not merely a professional training center; it is an epistemic community. If we sever the link between the student's cognitive effort and the certification we grant, we solve the "swamping problem" by admitting that the process doesn't matter—but in doing so, we devalue the degree itself.

  By adopting this policy with the conditions above, we acknowledge the reality of the "extended mind" in the modern workplace while upholding the university's commitment to cultivating independent thinkers. We certify not just that our graduates can arrive at Larissa, but that they know the way, understand the terrain, and can navigate when the tools go dark.

  **Action Required:** Vote to approve Proposal 24-B contingent on the inclusion of the Tethering, Agency, and Coherence conditions outlined above.
