answer: |-
  This is a genuinely difficult normative problem, and your intuition is correct: standard deontological distinctions (duty vs. supererogation) often fail to capture the *social dynamics* of how obligations evolve over time. Your friend's reference to Susan Wolf's "Moral Saints" is relevant, but as you sensed, it diagnoses the *ideal* without fully explaining the *mechanism* of the trap Meera is in.

  Since you work in philosophy of language, I think you will find it helpful to frame this not just as an ethical puzzle, but as a problem of **normative semantics and convention**. Here is a breakdown of what is going on, why the category is unstable in practice, and how one might argue for a principled exit.

  ### 1. The Phenomenon: Supererogatory Creep
  In standard ethics, a **supererogatory** act is one that is good to do but not required; failing to do it is not blameworthy. The logical structure is supposed to be: *If A does X (supererogatory), B is not obligated to do X, nor is A obligated to continue doing X.*

  However, in social institutions, repeated supererogation often undergoes a **normative shift**. This is sometimes called the "problem of supererogatory creep" or "baseline drift."

  *   **Stage 1 (The Gift):** Meera's actions are initially interpreted as gifts. They generate gratitude.
  *   **Stage 2 (The Precedent):** Repetition creates a precedent. In legal and social terms, precedent generates expectation.
  *   **Stage 3 (The Convention):** Following David Lewis's account of convention, Meera's behavior solved a coordination problem (students need help). Her behavior became a *focal point*. Now, deviating from the focal point looks like defection.
  *   **Stage 4 (The Obligation):** The expectation hardens into a quasi-obligation. The new hire is now viewed as "shirking" not because he violated a contract, but because he violated the *conversational implicature* of what it means to be a colleague in *this* department.

  The philosophical error here is conflating **beneficence** (doing good) with **justice** (fair distribution of burden). Meera's beneficence has inadvertently created an injustice.

  ### 2. Is the Category Unstable?
  You asked if this suggests the category of "acts beyond duty" is less stable than it looks. In a vacuum, no; in a social practice, **yes**.

  The instability arises because moral evaluation is often **comparative**. We don't just evaluate acts in isolation; we evaluate them against a baseline of "normal" behavior.
  *   When Meera started, the baseline was "standard advising." Her acts were clearly above baseline.
  *   Over five years, she *moved the baseline*.
  *   Now, "standard advising" looks like *under-performance* relative to the new baseline.

  This connects directly to your friend's "Moral Saint" comment. Susan Wolf argued that if we treat moral sainthood as the ideal, we render ordinary, decent lives morally deficient. Meera has effectively instantiated a "Moral Saint" model of advising. By embodying the saint, she has inadvertently made the "ordinary decent colleague" (the new hire) look morally suspect.

  The category is unstable because **uncoordinated supererogation functions as a signal.** From a philosophy of language perspective, Meera's actions have been functioning as a **presupposition** about departmental culture. Every weekend interview presupposed, "This is the level of care available here." Over time, that presupposition became **common ground**. To challenge it now requires more than just stopping the action; it requires **canceling the presupposition**.

  ### 3. Why "Different Roles" Fails
  You rightly rejected the "different role-obligations" answer. That answer fails because it treats the contract as the sole source of normativity. But departments run on **implicit norms**, not just HR contracts.

  The new hire isn't being side-eyed because he violated his contract; he's being side-eyed because he is **free-riding** on the reputation Meera built. If students expect weekend mock interviews because Meera did them for five years, the new hire benefits from the department's reputation (which Meera built) without contributing to the maintenance of that specific standard.

  However, calling this "free-riding" is also tricky. You can only free-ride on a *public good that is required*. If the good is supererogatory, you can't be obligated to contribute to it. This is the paradox: Meera created a public good that *feels* required but *isn't*.

  ### 4. A Principled Exit Strategy (Normative Repair)
  So, how does Meera pull back without it just being "stopping being nice"? She needs to engage in **normative repair**. If she just stops, it looks like a breach of trust (because of the established convention). She needs to explicitly reframe the past actions to restore the original normative baseline.

  Here is the principled argument she can use, grounded in **Fairness** rather than **Beneficence**:

  **A. The Argument from Unjust Expectations**
  Meera can argue that continuing the behavior is actually *unethical* because it sustains an unjust labor distribution.
  *   *Premise 1:* A healthy department requires a sustainable distribution of labor.
  *   *Premise 2:* Her current level of labor is unsustainable (burnout).
  *   *Premise 3:* By continuing, she validates the expectation that this labor is required, thereby unfairly penalizing colleagues who cannot or choose not to do it (the new hire).
  *   *Conclusion:* Scaling back is not a withdrawal of care, but a **correction of an unjust norm**.

  **B. The Speech Act of Reclassification**
  Since you know the power of speech acts, Meera needs to perform a specific kind of utterance. She cannot just *stop*; she must **reclassify** her past actions.
  *   *Incorrect:* "I'm too tired to do the mock interviews anymore." (Implies: I used to do them, now I won't. Looks like shirking.)
  *   *Correct:* "I want to clarify that the weekend interviews I've done were always an optional extra, not a departmental standard. To ensure fairness and sustainability for all faculty and students, we need to return to the official advising baseline."

  This explicitly cancels the conversational implicature. It tells the Chair and the students: *The baseline was never moved; I was just temporarily operating off-script.*

  **C. Institutionalization or Elimination**
  Finally, there is a structural solution. If the work is truly necessary for student welfare, it should be **institutionalized** (paid, rotated, or assigned).
  *   If the department agrees the weekend interviews are vital, they should be made part of the job description (and compensated/released time given).
  *   If they are not vital, they should stop.
  *   The current middle ground—where the work is vital enough to expect, but not official enough to require—is the source of the ethical rot.

  ### Summary
  The philosophical problem here is that **supererogation is not socially inert.** When performed repeatedly in a community, it alters the normative landscape, turning gifts into debts.

  Meera is not just "burnt out"; she is trapped in a **convention she created unilaterally**. The principled way out is to recognize that her continued participation is no longer an act of beneficence, but an act of **complicity in an unfair system**. By scaling back and explicitly reclassifying her past labor as "extra" rather than "standard," she restores the distinction between duty and gift, protecting both herself and the new hire from an unsustainable norm.

  It is not that she should stop being nice; it is that **niceness without boundary enforcement creates injustice.**
