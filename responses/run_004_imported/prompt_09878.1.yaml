answer: |-
  Good evening. For those who don't know me, I'm [Your Name], Dan's sibling.

  When Dan asked me to give this speech, I panicked. Mostly because Dan has spent the last few months obsessing over "Ramsey Numbers." For the uninitiated, this is a theorem stating that at any party of six people, you are guaranteed to find either three mutual strangers or three mutual friends. Dan found this comforting. I found it stressful. I spent weeks worrying: *Are we at six people yet? Do the in-laws count as strangers?*

  But falling down that rabbit hole led me to the man behind the math: Frank Ramsey. He was a genius who invented half of modern economics and philosophy before dying at twenty-six. And in an essay written shortly before he died, he addressed something I know Dan thinks about often.

  Dan is a materialist. He looks at the night sky and sees cold gas and crushing distance. He has 1:00 AM spirals where he worries that because the universe is so vast and temporary, nothing we do here really matters.

  Frank Ramsey would have told Dan to stop it.

  Ramsey wrote that we shouldn't feel humbled by the size of the stars. Size isn't a virtue. A star cannot think, or love, or tell a joke. He said his picture of the world was drawn "in perspective, rather than to scale." In his view, the people in the foreground—us, right here—are huge. And the stars? They're shrunk down to the size of old coins in the background.

  This is the perfect philosophy for this marriage. Because if there is one thing Dan is good at, it is spiraling about the background. And if there is one thing Priya is good at, it is correcting the perspective.

  Priya, you are the one who drags Dan back to the foreground. When he worries about the abstract, you remind him about the concrete. When he worries about the heat death of the universe, you remind him about dinner plans. You don't need to read philosophy to know that love isn't about the scale of the cosmos; it's about the scale of the room you're sitting in.

  Now, Frank Ramsey was also an economist, and he had a very specific way of dealing with the end of the world. He deadpanned that since the universe ending is billions of years away, its "present value at compound discount" is basically nothing.

  For the finance people here: yes, he used discount rates to dismiss existential dread. For everyone else: that is fancy speak for "it's far away, so don't lose sleep over it."

  Dan, you once told me that believing in "fate" or "destiny" feels dishonest. You don't believe the stars aligned to bring you and Priya together. Good. The stars didn't do anything. They are just big, burning coins in the background.

  You two are together because of choices. Because of proximity. Because of the work you put in. Ramsey later admitted that discounting the future was ethically questionable, but I think for tonight, we'll make an exception. The future is uncertain. The "forever" stuff is statistically unlikely. But the "now"? The "us"? That has immense value.

  So, I am not going to toast to the universe. I am not going to toast to destiny.

  I want to toast to the foreground. To the things that are large because we say they are large. To the three mutual friends at this table. To the choice, every day, to keep each other in focus.

  To Dan and Priya.
