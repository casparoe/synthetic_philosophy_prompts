      *(Self-Correction during drafting)*: I should be careful not to definitively say her experience *did* change physically. I must maintain the philosophical distinction between the *stimulus* and the *experience*. The stimulus is constant. The experience is the variable. I need to explain *why* the experience changes without implying the sound waves changed.

      *(Refining the "Does it matter?" part)*: It matters immensely for the philosophy of the audition process. If knowledge changes perception, then blind auditions aren't just ethical; they are epistemically necessary for judging "sound itself."

  8.  **Final Output Structure:**
