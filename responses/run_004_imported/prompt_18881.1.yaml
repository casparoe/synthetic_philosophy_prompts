  2.  **Deconstruct the Philosophical Position:**
      *   *The View:* Rational Epistemic Akrasia in Clinical Judgment.
      *   *The Argument:* First-order evidence (patient symptoms, labs, physical exam) can outweigh higher-order evidence (statistical base rates of clinician error). The clinician has access to the "ground level" details the statistic aggregates away.
      *   *The Tension:* Believing "This patient has Condition X" while believing "Clinicians like me usually miss Condition X in this context."
      *   *Standard Defenses:* Partitioning evidence, privileging first-order access, distinguishing *rationality* from *reliability*, or arguing that the higher-order evidence is defeated by specific first-order cues.

