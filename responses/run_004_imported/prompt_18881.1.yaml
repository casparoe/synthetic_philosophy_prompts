      *   **Guest:** A philosopher defending the view that *epistemic akrasia* (believing $P$ while believing one's evidence suggests one shouldn't believe $P$) can be rational in clinical contexts. This contradicts the *enkratic principle* (roughly: one ought not believe $P$ if one believes one's evidence doesn't support $P$).
      *   **Task:** Draft 7-8 interview questions.
