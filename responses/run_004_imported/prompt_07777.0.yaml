answer: |-
  You and Dan are both hitting on something real, but you are looking at the argument through different logical lenses. Dan is applying modern extensional logic (set theory), while Gongsun Long is operating within a logic of *names* (ming) and *specifications*.

  To answer your specific question: **Yes, the Advocate is exploiting the intensional nature of "seek," but that doesn't necessarily make it "cheap wordplay."** It makes it a semantic argument disguised as an ontological one.

  Here is the mechanical breakdown of that specific "Seeking" step, why Dan thinks it's a fallacy, and where the legitimate logical point is buried.

  ### 1. The Mechanics of the "Seeking" Move

  Let's formalize the exchange you described to see where the gears grind.

  **The Objector's Move (Extensional):**
  *   **Premise:** If you have a White Horse (WH), you have a Horse (H).
  *   **Logic:** $WH \subset H$ (White Horse is a subset of Horse).
  *   **Implication:** In terms of *objects in the world*, the existence of a WH satisfies the condition of having an H.
  *   **Verb Type:** "Having" is **extensional**. If $x$ is a WH, and all WHs are Hs, then you have an H. Substitution holds.

  **The Advocate's Move (Intensional):**
  *   **Premise:** If you *seek* H, a yellow horse satisfies you. If you *seek* WH, a yellow horse does not.
  *   **Logic:** The satisfaction conditions for the *act of seeking* differ.
  *   **Implication:** The concept/description "Horse" is not functionally equivalent to the concept/description "White Horse."
  *   **Verb Type:** "Seeking" is **intensional** (opaque). It creates a context where you cannot substitute terms based solely on what they pick out in the world; you must look at *how* they pick it out (the description).

  **The Advocate's Conclusion:**
  *   **Claim:** Therefore, "White Horse" is not "Horse" ($WH \neq H$).

  ### 2. Dan's Critique: The Equivocation Charge

  Dan is technically correct from the standpoint of modern analytic philosophy (specifically Frege or Quine).

  The fallacy he spots is a **category error between Extension and Intension**.
  1.  The Objector proves that the *extensions* overlap (having a WH counts as having an H).
  2.  The Advocate proves that the *intensions* differ (seeking WH requires more info than seeking H).
  3.  The Advocate concludes **Non-Identity**.

  In modern logic, proving that two terms have different *intensions* (senses) does not prove they lack *extensional* inclusion.
  *   "Morning Star" and "Evening Star" have different senses (seeking one might involve looking East vs. West), but they are the same object (Venus).
  *   "Red Apple" and "Apple" have different satisfaction conditions for a seeker, but a red apple *is* an apple.

  Dan argues the Advocate is smuggling in a definition of "is not" (*fei*).
  *   Objector hears: "Is not a member of the class."
  *   Advocate proves: "Is not synonymous with the term."
  *   **Verdict:** If the conclusion is meant to be about the world (ontology), it's sophistry. If it's about language (semantics), it's trivial.

  ### 3. The Legitimate Logical Point (Why Hansen/Graham matter)

  However, your intuition that there is "more to the story" is also correct. The School of Names (*Ming Jia*) was not doing ontology; they were doing **philosophy of language**. Their goal was to rectify names (*zheng ming*).

  For Gongsun Long, the "logical point" buried in the "Seek" step is this: **Reference is determined by Specification.**

  Here is how the "mass noun" (Hansen) and "part/whole" (Graham) readings actually *do* engage this specific step, contrary to Dan's claim:

  **A. Hansen's Mass Noun Theory:**
  Hansen argues that classical Chinese nouns function like "stuff" terms (e.g., "water," "gold") rather than count nouns ("a horse").
  *   "Horse" refers to **horse-stuff** (defined by shape).
  *   "White" refers to **white-stuff** (defined by color).
  *   "White Horse" refers to **compound stuff** (shape + color).
  *   **The "Seek" Mechanic:** If I seek "horse-stuff," I accept any color variation of that stuff. If I seek "white-horse-stuff," I am requesting a specific *compound*.
  *   **The Logic:** In a mass-noun logic, the compound stuff is not identical to the base stuff. "Gold" is not "White Gold." If you seek "Gold," copper-gold alloy might do (depending on context); if you seek "White Gold," it won't.
  *   **Why it saves the step:** It shows that the *criteria for individuation* are different. The "Seek" test reveals that the *boundary conditions* of the term "White Horse" are stricter than "Horse." Therefore, as *names*, they carve reality differently.

  **B. Graham's Part/Whole Logic:**
  Graham interprets this as a relation between universals.
  *   "Horse" = The Universal of Form.
  *   "White Horse" = The Universal of Form + The Universal of Color.
  *   **The "Seek" Mechanic:** When you seek "Horse," you are seeking the instantiation of the Form. When you seek "White Horse," you are seeking the instantiation of the Compound Universal.
  *   **The Logic:** A compound universal is not identical to one of its constituents. (The set {Form, Color} $\neq$ {Form}).
  *   **Why it saves the step:** It validates the intuition that adding a modifier changes the *identity of the concept*, even if it doesn't eject the object from the broader class.

  ### 4. So, is it Equivocation or Logic?

  It is **logical semantics masquerading as ontology.**

  The Advocate is using the verb "seek" to force the Objector to admit that **meaning matters.**
  *   If "White Horse" were truly identical to "Horse" (in the strong sense Gongsun Long is attacking), then the *name* "White Horse" should be fully interchangeable with "Horse" in all contexts, including requests.
  *   The "Seek" argument proves they are not interchangeable in all contexts.
  *   Therefore, the *Names* are not identical.

  **The Verdict on the Step:**
  Dan is right that it doesn't prove a white horse isn't a member of the class of horses. But Gongsun Long isn't trying to prove that. He is trying to prove that **the name "White Horse" is not the name "Horse."**

  The "Seek" verb is the perfect tool for this because it is **hyper-intensional**. It doesn't care about what exists; it cares about what is *specified*.
  *   **Objector:** Talks about what you *get* (Extension).
  *   **Advocate:** Talks about what you *ask for* (Intension).

  The "equivocation" happens only if you assume the conclusion "White Horse is not Horse" is about biological classification. If you read it as "The concept 'White Horse' is not equivalent to the concept 'Horse'," the "Seek" argument is a valid proof of **conceptual non-identity**.

  ### Summary for your next talk with Dan
  Tell Dan this:
  1.  **Concede the Extension:** Agree that extensionally, a white horse is a horse. The Objector is right about the world.
  2.  **Defend the Intension:** Argue that Gongsun Long is making a point about *Ming* (Names), not *Shi* (Actualities).
  3.  **The "Seek" Function:** The verb "seek" is not a trick; it is a **test for synonymy**. If two terms were truly identical in meaning, they would have identical satisfaction conditions in a request. They don't. Therefore, the terms are not identical.
  4.  **Hansen/Graham Rebuttal:** Tell Dan that Hansen's mass-noun theory *does* explain the "seek" step: you are seeking different *specifications of stuff*. Seeking "horse-stuff" is a different request than seeking "white-modified-horse-stuff." The logic holds if you treat nouns as stuff-concepts rather than count-classes.

  Gongsun Long isn't saying white horses aren't horses. He's saying **"White Horse" is a compound name, and a compound name is not identical to its simple component.** The "Seek" argument is the empirical proof that the compound name functions differently.
