answer: |-
  1. **The Heterogeneity Challenge**
  Your defense relies heavily on the analogy that mental properties stand to physical realizers as *determinables* (like red) stand to *determinates* (like scarlet). But critics point out that the physical realizers of pain across different species, or even across different moments in one human life, are wildly heterogeneous—unlike the orderly spectrum of light wavelengths that underpins our color concepts. If the "physical side" of the equation is a disjunctive mess rather than a natural kind, doesn't the determinable/determinate structure collapse, leaving you with a metaphor that looks neat on paper but fails to map onto the biology?
  *Follow-up:* If you argue that functional organization smooths over this heterogeneity, doesn't that concede that the *causal work* is being done by the functional role, not the mental property itself, effectively reintroducing the exclusion problem you sought to solve?

  2. **Proportionality: Solution or Stipulation?**
  You argue that causation requires "proportionality"—that a cause must be specific enough to produce the effect but not so specific that it excludes other viable descriptions. This allows the mental cause to win over the physical cause in explanatory contexts. But skeptics worry this doesn't so much *defuse* the overdetermination worry as it *renames* it. Are you discovering a metaphysical constraint on causation, or are you simply stipulating a rule that guarantees mental causation survives by definition?
  *Follow-up:* If you insist it's a metaphysical constraint, can you provide a criterion for proportionality that doesn't rely on our pragmatic interests as explainers, which would suggest the "causal power" of the mental is merely a feature of human description, not the world?

  3. **The Falsification Condition**
  Popular neuroscience books are selling the idea that we are close to fully reducing belief and decision to neural circuitry. Setting aside the rhetorical hype, what specific discovery—whether a neuroscientific finding of perfect neural prediction or a purely conceptual argument—would count as genuine evidence *against* your view of non-reductive physicalism?
  *Follow-up:* If you answer that no empirical finding could overturn the view because it is a conceptual truth, doesn't that render your position immune to the very science you claim to be reconciling, risking the charge that you are doing metaphysics in an empirical vacuum?

  4. **The Completeness of Physics**
  Even if we accept that mental and physical causes don't compete, we still face the principle of the causal completeness of the physical: every physical event has a sufficient physical cause. If the neural state is already sufficient to produce the behavior, what *ontological* work is left for the mental property to do, other than serving as a convenient label for us observers?
  *Follow-up:* If you reply that the mental property *is* the physical property, just described differently, doesn't that slide you toward the type-identity theory you explicitly reject, undermining your non-reductive stance?

  5. **Agency and the "Decision" Hook**
  This profile is pegged to new books claiming to locate the neural seat of our decisions. If my decision to act is merely a determinable of a neural state determined by prior physical causes, does your model actually save agency, or does it just make the "self" a harmless passenger riding on a deterministic train?
  *Follow-up:* If you argue that agency exists at the mental level even if determinism holds at the physical level, aren't you positing a form of compatibilism that many free-will skeptics would argue is just a semantic consolation prize?

  6. **The Threat of Eliminativism**
  An eliminative materialist might look at your model and argue that if the physical realizer is doing the heavy lifting, we should eventually discard the folk-psychological terms like "belief" and "pain" in favor of precise neural descriptions, much as we discarded "phlogiston." Why should we retain the mental vocabulary if the physical vocabulary is always more precise?
  *Follow-up:* If you argue that mental terms capture generalizations neural terms miss, doesn't that imply that our current neuroscience is simply too coarse, and that a sufficiently advanced neuroscience would eventually make your non-reductive view obsolete?

  7. **Phenomenology vs. Causation**
  Your argument focuses on how mental properties cause *behavior*, but it seems less equipped to handle the "what it is like" aspect of experience. Can the determinable/determinate model explain why pain *hurts*, or does it only explain why pain causes me to say "ouch"?
  *Follow-up:* If you concede that this model addresses causation but not phenomenology, are you admitting that the "hard problem" of consciousness remains untouched by your solution to the exclusion problem?

  8. **The Cultural Appeal of Reductionism**
  Despite decades of sophisticated philosophical arguments like yours, the public and popular scientists remain deeply attracted to hard reductionism—the idea that we are "just" our neurons. Why do you think your non-reductive picture fails to gain traction outside academia, and is that a failure of communication or a failure of the theory to match our intuitive sense of reality?
  *Follow-up:* If you suggest it's a failure of communication, isn't there a risk that the "intuitive sense of reality" the public holds is actually a form of dualism, meaning your physicalist view is losing ground to both dualists and reductionists simultaneously?
