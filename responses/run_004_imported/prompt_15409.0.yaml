prompt: |-
  I'm finishing a magazine profile of a philosopher of mind, pegged to the recent run of popular neuroscience books claiming to have located the neural "seat" of our decisions and beliefs. My subject has built her reputation defending non-reductive physicalism against Jaegwon Kim's causal exclusion argument, chiefly by arguing that a mental property like being in pain stands to its physical realizer roughly as a determinable such as red stands to a determinate such as scarlet, so that the mental cause and the physical cause are never really rivals competing for the same explanatory work, and Kim's overdetermination worry never gets off the ground. I don't want an interview that just lets her restate that picture for a lay audience. Draft eight interview questions that push past it, including at least one pressing on whether the determinable/determinate analogy can survive the sheer heterogeneity of pain's physical realizers across occasions and species -- ordinary color families are far more orderly than that -- one on whether "proportionality" genuinely defuses the overdetermination worry or just renames it, and one asking what discovery, neuroscientific or purely conceptual, would count as evidence against her view. For each question, add a short follow-up keyed to the answer she's most likely to give.
