  ### The Breakdown

  Here is the move-by-move verdict. To understand the scores, you need to know the distinction between **Inference** (calculating the probability) and **Decision Theory** (what you do with that probability).

  #### Point 1: Dana (Score: 0)
  **"The posterior only depends on the data... not on when or why you decided to stop."**

  *   **The Good:** Dana is technically correct about the math. This is known as the **Likelihood Principle**. In pure Bayesian theory, if you have a prior and you see data, your posterior is calculated strictly on that data. The fact that you *could* have kept collecting more data doesn't change the math of the current snapshot.
  *   **The Bad:** She is dangerously misleading about the *implication*. While the *calculation* doesn't change, the **reliability** of that calculation as a decision trigger does. If you treat a Bayesian posterior exactly like a Frequentist p-value (i.e., "If >95%, ship"), you break the guarantees.
  *   **Verdict:** I'm giving this a neutral **0**. She wins on theoretical purity, but loses on practical application. It's like saying "A speedometer only depends on wheel rotation, not where you're driving." True, but if you drive blindly because "the speedometer doesn't care," you will crash.

  #### Point 2: Marcus (Score: 2)
  **"If the stopping rule really is irrelevant, you could leave the dashboard open forever and eventually catch a random swing."**

  *   **The Good:** Marcus has identified the **Optional Stopping Problem**. Even in Bayesian testing, if your rule is "Stop when Probability > 97%," and you check continuously, you *will* eventually hit 97% due to random noise, even if there is no real effect. This is exactly what happened to your team on Day 4.
  *   **The Bad:** None, really. This is the core statistical risk of sequential monitoring without correction.
  *   **Verdict:** **2 (Clearly Right).** He correctly diagnosed the failure mode. The "97%" number was not calibrated for the fact that you checked it 50 times before shipping.

  #### Point 3: Dana (Score: -1)
  **"A false positive is a false positive and it's not special to peeking... The posterior is still the correct summary of the evidence."**

  *   **The Good:** She is right that you should have had a stricter bar.
  *   **The Bad:** She claims peeking isn't "special." It is. Peeking inflates your False Positive Rate (FPR) significantly compared to a fixed sample test. If you ignore this, your "97% confidence" might actually behave like "80% confidence" in the long run. By calling it "not special," she is dismissing the calibration error that caused the bad ship.
  *   **Verdict:** **-1 (Mostly Wrong).** This is the most dangerous statement in the thread. It suggests that the metric means the same thing in a sequential context as it does in a fixed context, which is statistically false regarding error rates.

  #### Point 4: Marcus (Score: 2)
  **"Swapping p-values for posteriors doesn't get you out of needing some rule... it just hides that requirement behind different math."**

  *   **The Good:** This is the synthesis. You cannot escape the trade-off between **Velocity** (checking early/often) and **Risk** (shipping false positives). Bayesian methods give you more flexibility, but they do not give you "free lunch." You still need a policy (e.g., "Minimum 7 days" or "Probability > 99% for first 3 days").
  *   **The Bad:** None.
  *   **Verdict:** **2 (Clearly Right).** He correctly identifies that the "No Precommitment" pitch is marketing fluff if you care about long-term error rates.

  ---

  ### What Both of Them Are Missing

  Since you're the SWE who has to build/maintain this, here are the three concepts missing from their argument that actually solve the problem:

  **1. Calibration via Simulation**
  Both are arguing theory. In practice, growth teams should **simulate** their testing pipeline. You take historical data where you know the answer (null effect), run your Bayesian dashboard logic over it with your team's actual "peeking" behavior, and see how often you ship false positives.
  *   *The Fix:* You might find that "97% probability" actually results in a 10% false ship rate because of peeking. You then adjust the threshold to 99.5% until the false ship rate drops to an acceptable level (e.g., 5%).

  **2. Expected Loss vs. Probability to Beat**
  Dana is focusing on "Probability B beats A" (e.g., 97%). Modern Bayesian A/B testing (like at Netflix or Uber) often uses **Expected Loss**.
  *   *The Concept:* Instead of asking "How likely is B better?", you ask "If I ship B and I'm wrong, how much revenue do I expect to lose?"
  *   *Why it helps:* This naturally penalizes early stopping. On Day 4, even if B looks 97% likely to win, the *magnitude* of the potential loss if you're wrong might still be too high. This metric incorporates uncertainty better than a simple probability threshold.

  **3. Informative Priors**
  They didn't mention the **Prior**. If your dashboard uses a "flat prior" (assuming any effect size is equally likely), it will be very jumpy early on (Day 1-5).
  *   *The Fix:* Use a **Skeptical Prior** based on historical data (e.g., "Most changes we make have near-zero effect"). This shrinks early noisy results toward zero. It makes it much harder to hit "97%" on Day 4 unless the effect is massive, effectively building Marcus's "minimum runtime" rule into the math itself.

  ### Summary for the Team
  Marcus won the argument on **risk management**, but Dana is right that you don't need a *fixed* sample size. The solution isn't to go back to p-values; it's to **calibrate your Bayesian thresholds** to account for the fact that your team peeks. You need to treat "97%" not as a universal truth, but as a knob you turn until your simulation shows you're shipping the right amount of winners vs. losers.
