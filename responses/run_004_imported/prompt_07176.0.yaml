answer: |-
  This is one of the oldest and most difficult problems in moral philosophy, dressed in the gear of a search-and-rescue (SAR) scenario. You and your friend have effectively recreated a debate that has occupied ethicists for decades, specifically centering on a famous 1977 paper by philosopher John Taurek titled *"Should the Numbers Count?"*

  The short answer is: **Your friend is correct according to standard public policy, triage protocols, and utilitarian ethics. However, your instinct is not merely emotional discomfort; it tracks a serious, defensible philosophical objection regarding individual rights and the limits of aggregation.**

  Here is a breakdown of why this argument is so sticky, where each of you stands, and why the context of SAR matters.

  ### 1. The Friend's Position: Aggregation and Expected Value
  Your friend is arguing from a **utilitarian** framework. In this view, the moral goal is to minimize overall harm or maximize overall well-being.
  *   **The Math:** If death is a negative value of $-1$, then saving six people yields $+6$ and saving one yields $+1$. Choosing the one results in a net loss of five lives that could have been saved.
  *   **The Duty:** In public service roles (like SAR, medicine, or firefighting), resources belong to the community, not the rescuer. Therefore, the rescuer is a steward obligated to use those resources to save the maximum amount of life possible.
  *   **The Risk:** If SAR teams adopted a coin-flip protocol, over a decade of operations they would statistically allow dozens of extra deaths compared to a "save the most" protocol. Your friend calls this irresponsible because, from a systemic view, it is.

  ### 2. Your Position: Non-Aggregation and Individual Claims
  Your hesitation comes from a **deontological** or **rights-based** intuition. You are sensing what philosophers call the **problem of aggregation**.
  *   **The "Loss of Everything":** You noted that each person loses "absolutely everything." Taurek argued exactly this: There is no "super-losing" event where six lives are lost as a single block. There are only six individual events of one life being lost. From the perspective of the lone hiker, the fact that six others are dying elsewhere does not make his death less significant to *him*.
  *   **Equal Claim:** If every human has an equal right to rescue, does the presence of others on Ridge B weaken the claim of the hiker on Ridge A? Your intuition says no. His claim is 100% valid. The six on Ridge B each have a 100% valid claim.
  *   **The Coin Flip:** Your suggestion of a lottery is the logical endpoint of this view. If the claims are equal and incommensurable (you can't add them up), then fairness dictates giving each *group* an equal chance, or perhaps each *individual* an equal chance (which would actually favor the six, but your intuition was about giving the minority group a fighting chance).

  ### 3. Why the Coin Flip Fails in Practice (But Feels Right)
  Philosophers like Frances Kamm and T.M. Scanlon have pushed back against Taurek. Their counter-argument is crucial for your situation:
  *   **The Complaint of the Survivors:** If you flip a coin and lose, and five people die who could have been saved, the survivors of those five (and the five themselves, hypothetically) have a reasonable complaint: *"You could have saved us without harming the lone hiker any more than he was already harmed by the storm. You chose to let us die to satisfy a principle of fairness."*
  *   **Fairness vs. Outcome:** A coin flip is fair *procedurally*, but it produces unfair *outcomes* more often. In life-and-death triage, most ethicists argue that minimizing the body count outweighs the procedural fairness of a lottery.

  ### 4. The SAR Context: Institutional Duty vs. Personal Morality
  This is where the distinction becomes practical rather than just theoretical.
  *   **Personal Morality:** If *you* were a private citizen with a private boat and you saw this happening, you might have more moral latitude to follow your conscience. Some might argue you have a duty to the one you can reach, regardless of the others.
  *   **Institutional Duty:** As a volunteer for a SAR team, you are an arm of public safety. SAR protocols are generally written to align with **disaster triage** principles. These principles explicitly state that when resources are scarce, you prioritize the greatest good for the greatest number.
  *   **Public Trust:** If the public knew that a SAR team might flip a coin rather than save a busload of children because there was one adult on the other ridge, trust in the institution would collapse. The "cold arithmetic" is actually a shield against accusations of bias or favoritism.

  ### 5. Is the Number *Always* Decisive?
  You asked if the number of people is always the decisive factor. The answer is **no**, but the exceptions are narrow.
  *   **Probability of Success:** If the ridge with six people is significantly more dangerous, lowering the probability of survival from 90% to 40%, the math changes. Expected value is $Probability \times Lives$.
  *   **Special Obligations:** If the lone hiker is your child, or if your team specifically promised to monitor that ridge, personal or contractual obligations might override the general count.
  *   **The "Tie" Breaker:** If it were 1 vs. 1, your coin flip idea becomes the standard solution. The friction only arises when the numbers diverge.

  ### Conclusion
  Your friend is **operationally correct**. In a formal SAR context, saving the six is the only defensible decision. To do otherwise would be to prioritize the rescuer's moral comfort over the lives of the victims.

  However, **you are philosophically coherent.** Your discomfort is not a bug in your moral software; it is a recognition that human beings are not units of currency. The fact that you feel the weight of the one hiker's abandonment is a necessary counterbalance to the cold efficiency of triage. If every rescuer felt exactly like your friend, the system might become too bureaucratic; if every rescuer felt exactly like you, the system would become inefficient and deadly.

  **The Verdict:** In the field, listen to your friend. The protocol must be to save the six. But in the debrief, keep your instinct alive. That unease you feel is what ensures the team treats the one hiker not as "excess baggage," but as a profound tragedy that was necessary to prevent a greater one. The arithmetic decides the action, but it shouldn't silence the grief.
