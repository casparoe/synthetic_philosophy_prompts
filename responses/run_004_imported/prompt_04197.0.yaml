answer: |-
  The rain against the window of the conference room was the only sound, a steady, gray rhythm that matched the headache behind Julian's eyes. Across the table sat the representative from Axiom Consistency. She wore a suit that seemed to absorb the light, her posture perfect, her hands folded over a single manila folder.

  "The condition has been met," she said. Her voice was flat, devoid of malice or pity. "The coin landed tails."

  Julian looked at his own hands. They were trembling slightly. He knew what tails meant. In the timeline where the coin landed heads, Sarah was currently waking up in a private recovery ward, the neurodegenerative marker erased by the gene therapy Axiom had provided. In this timeline, the one he was occupying, the therapy had never been released. Sarah was dead. She had been dead for three months.

  "And so you want the payment," Julian said. His voice sounded like it belonged to someone else.

  "Per the contract signed on January 14th," the representative confirmed. She slid the folder across the polished wood. "Fifty percent of your liquid assets. Plus the rights to the patent on your algorithm."

  Julian laughed, a short, brittle sound. "Look at me. Look at where I am. Sarah is gone. The therapy never happened. If I give you this, I get nothing. There is no cure coming. There is no reward. You're asking me to burn my life down for a benefit that exists in a world that *didn't happen*."

  "The benefit exists in the ensemble," she corrected gently. "You are not just the Julian who sits in this room. You are the abstract agent defined by the signature on that contract. That agent exists across all probability branches. The version of you in the heads-branch received the cure because the algorithm determined you were the *type* of agent who honors the contract in the tails-branch."

  "I don't care about the other Julian," Julian snapped. "I care about this one. I care about the one who is sitting here with a dead wife and a bank account that's about to be emptied for no reason."

  "The other Julian cares about you," she said. "He is living your life with the outcome you wanted. He is grateful to you. But he cannot send you money. He cannot send you Sarah. The only currency that transfers between branches is consistency."

  Julian stood up and walked to the window. The city below was blurred by the rain. He thought about the day he signed the contract. He had been desperate. Axiom didn't promise miracles; they promised optimization. They explained that reality was thicker than it felt, that decisions rippled through possibility space before they crystallized into fact. To get the best outcome in the world where things went right, you had to be willing to pay the cost in the world where things went wrong. Even if, in the world where things went wrong, the payment looked like insanity.

  "It's extortion," Julian said to the glass. "It's extortion by a ghost."

  "It is rationality," she said. "If you refuse to pay now, you prove that you are not the type of agent who pays. And if you are not that type, then the version of you in the heads-branch never received the cure. By keeping your money, you ensure that Sarah died in both worlds. By paying, you ensure she lives in one."

  Julian turned back to her. "I can't verify that. I can't see him. I can't see her. For all I know, you're lying. For all I know, the coin was rigged, and she's dead everywhere, and you're just harvesting fools who believe in magic logic."

  "That is a risk you accepted," she said. "Faith in the structure of the decision is part of the policy."

  She opened a pen and placed it on top of the transfer authorization forms. The black plastic looked heavy.

  Julian sat back down. The logic was cold, hard, and jagged. It cut against every instinct he had. Every biological imperative screamed that resources should be conserved for the present, for the tangible, for the survivor. To give away power when you were weak was suicide. To honor a debt to a creditor who no longer existed was madness.

  But there was a strange, terrible symmetry to it. If he refused, he was admitting that his love for Sarah was conditional on her survival. That his integrity was only valid when rewarded. If he paid, he was validating the version of himself that had hoped. He was becoming the bridge.

  "If I sign this," Julian asked, "does it hurt less?"

  "No," she said. "It likely hurts more. Ignorance is a buffer. Knowing you are sustaining a ghost requires a certain... capacity for abstraction."

  Julian picked up the pen. He thought about Sarah's hand in his, the way her fingers would twitch when she was dreaming. In the other world, that hand was warm. In this world, it was cold in the ground. He was being asked to sacrifice his future to warm a hand he could never hold again.

  He hovered the pen over the line. The ink seemed to wait, suspended.

  He realized then that he was not making a decision for himself. The Julian who sat here, broken and grieving, was already a consequence. The decision had been made months ago by a man who still had hope. That man had looked into the future and said, *'Whatever happens, I will be the kind of man who keeps his word.'*

  To refuse now was to kill that man. To refuse was to say that the past self was a fool, that hope was a liability. To sign was to admit that the past self was the captain, and this broken wreckage of a man was just the crew, obligated to follow orders even when the ship had already sunk.

  It felt like dying. It felt like submitting to a law of physics that didn't care about his pain.

  "You know," Julian said, his voice low, "in the other world, does he know I lost her?"

  "He knows the probability," she said. "He knows someone had to pay."

  Julian closed his eyes. He imagined the other Julian, sitting in a sunlit room, Sarah asleep in the next room, healthy and breathing. Was that Julian happy? Or did he feel a vague, unexplainable debt? A sense of luck that felt too clean, too unearned? Did he feel the weight of the money Julian was about to lose?

  Probably not. That was the nature of the wall between them. One got the life, the other got the bill.

  Julian pressed the pen to the paper. The scratch of the nib was loud in the quiet room. He signed his name. It looked the same as it always did, though he felt different. Lighter, perhaps, or just hollowed out.

  He slid the papers back across the table.

  "The transfer will be complete within the hour," the representative said. She stood up, collecting the folder. She didn't smile. There was no triumph in her eyes, only the satisfaction of a equation balancing. "Thank you for your consistency."

  She walked to the door.

  "Wait," Julian said.

  She paused, hand on the knob. "Yes?"

  "Tell him," Julian said. "If you can. Tell the other me... tell him he doesn't have to worry about the money."

  "We don't have channels for that," she said. "But I suspect he already knows."

  She left. The door clicked shut.

  Julian sat alone in the conference room. The rain continued to fall. He checked his banking app on his phone. The numbers were already changing, dwindling down to zero. He was bankrupt. He was alone. The cure was real, but it was real somewhere else.

  He put the phone in his pocket and stood up. He had to walk home. He had to pack up the apartment. He had to live in the world where he lost, knowing that his loss was the price of a victory he would never see.

  It was the most rational thing he had ever done. It felt like the biggest mistake of his life.

  He opened the door and stepped out into the hallway. The air conditioning hummed, indifferent to the transaction. He walked toward the elevator, carrying the weight of a promise made to a ghost, wondering if integrity was just a fancy word for knowing how to lose properly.
