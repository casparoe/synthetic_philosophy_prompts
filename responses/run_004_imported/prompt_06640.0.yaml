answer: |-
  This is an exceptionally sharp reading of the texts, and you have correctly identified the tension that keeps political theologians busy. You are right that the internet summary ("Aquinas = pro-tyrannicide") is a caricature. Aquinas is fundamentally a thinker of *order* and *teleology*, not revolution. His hesitation isn't moral squeamishness about violence per se (he accepts just war and capital punishment), but a prudential calculation about the *bonum commune* (common good).

  Here is how a Thomistic framework handles the "slow-motion coup" and the question of means vs. standing.

  ### 1. The Slow-Motion Coup: *Exercitii* or *Defectu Tituli*?

  Your dilemma is precise: If a ruler begins with a legitimate title (*ex parte exercitii*) but systematically dismantles the very institutions that constitute the "public authority" capable of checking him, does he remain a tyrant by conduct, or does he become a usurper by title?

  Aquinas's political metaphysics is teleological. Authority is not a magical substance possessed by the ruler; it is a function ordained for the common good. In *De Regimine Principum*, Aquinas argues that tyranny is contrary to the nature of political rule.

  **The Argument for Conversion to *Defectu Tituli***
  There is a strong Thomistic argument that the gradual erosion of constraints eventually converts the tyrant *ex exercitii* into a tyrant *ex defectu tituli*. Here is the logic:

  1.  **Conditional Legitimacy:** In Aquinas's view (and the broader medieval conciliarist tradition that follows him), the title to rule is often conditional on ruling for the common good and according to law.
  2.  **Voiding the Pact:** When a leader rewrites the constitution to eliminate term limits or neuters the courts, he is not merely governing badly; he is unilaterally altering the *source* of his own authority. By destroying the legal order that granted him the title, he effectively voids that title.
  3.  **The "Banditry" Threshold:** Aquinas accepts Augustine's dictum (cited in *City of God* and influential on scholastics) that without justice, kingdoms are but great bands of robbers. If the ruler renders the law purely instrumental to his own will, the regime ceases to be a *regimen politicum* (political rule) and becomes a *regimen despoticum* (despotic rule) or mere domination.

  **The "Public Authority" Dead End**
  You asked if Aquinas's logic forces us into a dead end where only "public authority" can remove him, even after he has captured all public authority.

  The Thomistic escape hatch here is the concept of the *res publica* (public thing) residing ultimately in the community, not just the institutions. While Aquinas is cautious about "the people" acting as a mob, he acknowledges that authority derives from the community for the sake of the community.

  If the institutions are captured, the "public authority" does not vanish; it **reverts** to the body politic. This is more explicitly developed by the Second Scholastic (Suarez, Bellarmine, Mariana), but it is rooted in Aquinas's natural law theory. If the agent designated to protect the common good (the king/parliament/courts) becomes the aggressor against the common good, the right of defense reverts to the principal (the community).

  Therefore, in your modern autocrat scenario:
  *   **Phase 1 (Erosion):** He is a tyrant *ex exercitii*. Resistance should be institutional/legal. Private violence is illicit (risk of anarchy).
  *   **Phase 2 (Capture):** Once he makes legal redress structurally impossible (by destroying the courts/legislature), he has functionally severed the link between his title and the common good. He is now ruling without a *true* title, because the title's conditions are impossible to meet.
  *   **Conclusion:** At Phase 2, he approximates the *tyrannus ex defectu tituli*. The "public authority" required to remove him is no longer the captured institutions, but the community acting in defense of the legal order itself.

  However, Aquinas would still add a massive **prudential caveat**: Even if the *right* exists, is it *wise*? If removing him leads to civil war that destroys the common good more than his tyranny does, the action remains illicit. Aquinas is a consequentialist about order.

  ### 2. Bonus: Lethal vs. Non-Lethal (Means vs. Standing)

  Is Aquinas's argument against private tyrannicide about the *knife* or the *standing*?

  It is primarily about **standing and prudence**, but the means matter proportionally.

  **The Standing Argument**
  Aquinas's core objection in *De Regimine* is that private individuals lack the jurisdiction to judge the ruler. To act against the head of state is to act against the order of the whole body.
  *   **Leaks/Sabotage/Hacking:** These are acts of subversion. In Thomistic terms, they are acts of *sedition* if they oppose the unity of the multitude.
  *   **The Crucial Distinction:** Aquinas defines sedition as opposing the unity of the multitude *for the common good*. If the tyrant is already opposing the common good, resisting him is not sedition.
  *   **The Problem:** Who decides? A private leaker or hacker is making a private judgment that "this action serves the common good." Aquinas is deeply skeptical of private political judgment because individuals are biased by passion and limited perspective.

  **The Means Argument**
  However, Aquinas does care about the means, specifically regarding **proportionality** and **scandal**.
  *   **Scandal:** Private assassination sets a precedent that political disputes are settled by violence. This degrades the political order.
  *   **Non-Lethal Subversion:** Does hacking a government server create the same scandal? Perhaps less so, but it still undermines the *rule of law*. If the principle is "private individuals may break the law to stop a bad leader," you invite chaos.
  *   **Nuance:** Aquinas distinguishes between *obedience* and *acquiescence*. One is not obliged to obey unjust commands (ST I-II, Q. 96, A. 4). Refusing to comply with an unjust law is licit. But *active subversion* (sabotage) is an exercise of coercive power, which belongs to the public authority.

  **The Verdict on Modern "Tyrannicide-Adjacent" Moves**
  Aquinas's logic suggests that **non-lethal subversion by private individuals is licit only under the same conditions as lethal force:**
  1.  **Last Resort:** All public/legal avenues are exhausted (the "Phase 2" capture mentioned above).
  2.  **Public Standing:** Ideally, the action is taken by representatives of the community (e.g., whistleblowers within the system acting as a de facto public authority), not random private actors.
  3.  **Probability of Success:** If the sabotage leads to a worse crackdown (the "paranoid tyrant" scenario Aquinas warns about), it is sinful due to bad consequences.

  So, it is not the *lethality* that makes private tyrannicide wrong for Aquinas; it is the **usurpation of public judgment**. A private citizen hacking the grid is claiming a jurisdiction they do not possess. However, if the regime has ceased to be a legitimate authority (becoming a "bandit gang"), the obligation to respect its "infrastructure" weakens significantly.

  ### Summary of the Thomistic Position

  1.  **On the Autocrat:** A leader who legally ascends but illegally entrenches himself eventually voids his own title. When he makes legal removal impossible, he becomes a usurper of the *office's nature*, allowing for broader resistance, potentially by the community as a whole.
  2.  **On Private Action:** The prohibition is on private individuals exercising *coercive jurisdiction*. Whether that coercion is a knife, a leak, or a cyberattack, the moral problem is the same: a part of the body attempting to amputate the head without the consent of the body.
  3.  **The Escape Clause:** If the head is actively killing the body, the parts have a right of self-defense. But Aquinas would demand a very high bar of certainty that the "head" is indeed terminal and that the "amputation" won't kill the patient.

  You aren't turning a political question into a scholastic taxonomy exercise; you're recognizing that for Aquinas, the taxonomy *is* the politics. The classification determines the moral reality.
