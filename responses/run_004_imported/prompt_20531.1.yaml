          *   *Philosopher B (Contemporary Skeptic/Normative Critic):* Grants Strawson's descriptive psychology but denies it settles the normative issue. Uses the "Gary Watson/Robert Harris" style argument (understanding causal history pushes toward objective attitude, but practice pushes toward heightened blame). Argues Strawson's machinery doesn't determine which attitude is *fitting*.
      *   **Constraints:** Evenly matched, genuine engagement (no talking past each other), no tidy resolution at the end. Avoid the student slogan ("it's just natural facts") by showing depth on both sides.

  2.  **Character Conception:**
      *   *Naturalist:* Let's call her **Elena**. She needs to sound confident in the internal coherence of our practices. She shouldn't just say "it's natural," but rather "the practice *constitutes* the normativity."
      *   *Skeptic:* Let's call him **Marcus**. He needs to acknowledge the power of reactive attitudes but insist on the gap between *having* an attitude and it being *justified* in a deep sense, especially regarding basic desert.

  3.  **Key Arguments to Include:**
      *   *Elena:* The participant stance is non-optional for beings like us. Excuses/exemptions handle the nuances. Determinism doesn't provide a new exemption category.
      *   *Marcus:* The Watson/Harris case. Causal understanding suggests exemption (objective stance), but moral outrage demands blame. This tension shows the practice is conflicted, not self-justifying. The "normative question" remains: *Ought* we to hold these attitudes given the causal story?

  4.  **Drafting - Section by Section:**

      *   *Opening:* Set the scene. Maybe after a seminar or in an office. Jump straight into the tension.
