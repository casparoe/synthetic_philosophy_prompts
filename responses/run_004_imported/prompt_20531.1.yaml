      *   *Check:* Is Marcus just a hard determinist? *Correction:* Ensure he grants Strawson's psychology. His point is normative, not metaphysical. He's saying the practice itself generates a conflict that Strawson ignores.
      *   *Check:* The Watson/Harris case. Make sure it's referenced clearly. The idea is that deep causal explanation usually invites the objective stance (pity, treatment), but moral horror invites blame. Strawson says exemptions calm resentment; Watson says sometimes understanding *fuels* the demand for accountability because the stakes are higher, or conversely, that the causal story *should* exempt but doesn't, revealing a crack. Actually, the prompt specifies: "when we come to understand... how someone was made into the person who did monstrous things, that is exactly the sort of consideration Strawson's framework treats as pulling us toward the objective attitude, and yet our actual practice runs the other way, wanting to hold the worst offenders more answerable, not less." Okay, so the tension is: Causal history -> Objective Stance (per Strawson's logic on exemption), but Moral Practice -> Intense Blame. This shows the practice isn't as coherent as Strawson claims.

  7.  **Drafting - Step-by-Step:**

