answer: |-
  **Elena:** You're conceding too much to the metaphysician, Marcus. Strawson's point isn't just that we *can't* stop feeling resentment. It's that the participant stance isn't a hypothesis needing external validation. It's the framework within which 'validation' makes sense. When we ask if someone *really* deserves blame, we're already operating inside the practice of holding responsible. To ask if the practice itself is justified from a God's-eye view is to ask what color numbers are.

  **Marcus:** I grant the descriptive psychology. I agree we are wired for reactive attitudes. But Strawson claims these attitudes are *rational* responses to the quality of will others display toward us. My worry is that when we press on the 'quality of will' in light of universal causation, the rationality crumbles. Consider Gary Watson's discussion of Robert Harris. When we learn the horrifying causal details of Harris's upbringing—the abuse, the neurological damage—Strawson's own taxonomy suggests we should shift toward the objective attitude. We should see him as a subject for treatment or management, not a partner in dialogue.

  **Elena:** Because you're treating causation as an exemption. But Strawson is explicit: determinism isn't an exemption. Exemptions are local—compulsion, insanity, childhood. Harris's history is tragic, but unless it rendered him incapable of understanding moral demands, he remains a participant. The causal story explains *why* he has the character he does, but it doesn't erase the character itself.

  **Marcus:** But that's the tension. The deeper the causal explanation, the more it looks like a global exemption, yet our moral practice demands *intensified* blame, not mitigation. We feel that precisely because the harm is so monstrous, the demand for accountability should be highest. Yet, simultaneously, the causal understanding pulls us toward pity. Strawson says our practices are coherent enough to guide us. I say this specific friction shows they aren't. If the practice gives us conflicting signals—'he was made to do this' versus 'he chose this'—then appealing to the practice doesn't settle the normative question. It just highlights the conflict.

  **Elena:** Conflict isn't incoherence; it's the human condition. The participant stance isn't a calculator that outputs a single verdict. It's a mode of engagement. You're looking for a normative fact about 'basic desert' that sits outside this engagement. You want to know if resentment is *fitting* in a metaphysical sense. I'm saying the fittingness is constituted by the engagement. If we cannot coherently abandon the stance without ceasing to be human, then the stance is its own justification.

  **Marcus:** That's where I resist. We *can* abandon the stance, at least locally. We do it when we take the objective attitude toward the mentally ill or the very young. The skeptic asks: if causation is universal, why isn't *everyone* exempt? You say because exemptions are local. But if the difference between Harris and a neurotypical person is just a matter of degree in causal determination, then the line is arbitrary. And if the line is arbitrary, then the resentment resting on it lacks normative force. It's just a brute fact about our psychology, not a justification.

  **Elena:** You keep using 'arbitrary' as if it's a defeater. But moral boundaries are always somewhat arbitrary. We hold adults responsible but not children, though maturity is a spectrum. We don't dissolve the practice because the line is fuzzy; we draw it where our forms of life require. The normative force comes from what these attitudes *do*. They regulate relationships. They demand regard. If I withdraw resentment because Harris was causally determined, I am not respecting him as a moral agent; I am patronizing him. I am treating him as a pet or a patient.

  **Marcus:** But if the 'regard' is based on a freedom he never had, is it respect or illusion? Strawson wants to bypass the metaphysics, but the metaphysics leaks back in. When I feel resentment, I am implicitly claiming that you *could have done otherwise* in a robust sense. If I become convinced you couldn't, yet I continue to resent you purely to maintain my social framework, haven't I turned you into a means to an end? Haven't I sacrificed truth for utility?

  **Elena:** You're assuming the 'could have done otherwise' required for resentment is a metaphysical claim about causal forks. I'm saying it's a claim about your capacities as an agent. You had the reasons, you had the capacities, you acted. The causal history of those capacities is irrelevant to the current transaction between us. To bring it in is to change the subject from morality to cosmology.

  **Marcus:** But the cosmology undermines the morality. If the 'current transaction' is the inevitable output of prior states, then the 'demand for regard' is a demand that couldn't have been met differently. Strawson saves responsibility by shrinking its scope to psychology. I'm saying that even within psychology, the knowledge of determinism alters the quality of will. If I know your anger is causally necessitated, my resentment loses its target. It becomes like being angry at a storm.

  **Elena:** But you aren't angry at a storm. You're angry at a person. That distinction isn't erased by causation. As long as we interact as persons, the reactive attitudes are the medium. You can't step out of the medium to judge the medium.

  **Marcus:** We can step out enough to see the crack. Watson showed us that. The practice doesn't settle itself because the practice is torn between the demand for justice and the recognition of causal fate. Strawson tells us to ignore the fate. I'm saying the fate matters normatively. If it matters, then Strawson hasn't dissolved the problem; he's just told us to look away.

  **Elena:** And I'm saying looking away is the only way to keep looking at *each other*.

  **Marcus:** But if the view is illusory, what are we looking at?

  **Elena:** Each other. That's enough.

  **Marcus:** Is it?
