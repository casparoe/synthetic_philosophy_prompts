          3.  The Reality of Jealousy: It's a "social fact" even if a "biological fiction."
          4.  The Transitional Problem: Why you can't jump straight to the ideal.
          5.  The Verdict: Restraint as a temporary moral duty.
          6.  Conclusion: Russell's error of temporal scope.

  8.  *(Final thought before drafting)*: Make sure to emphasize that this isn't saying Russell is *wrong* about jealousy being learned, but that he is wrong about the *moral implications* of that learning process for the people currently undergoing it.

