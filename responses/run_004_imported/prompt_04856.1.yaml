      *   *Is the "transitional generation" argument strong?* Yes, this is the crux. If morality is about consequences, and the consequence of breaking a norm is pain (due to existing conditioning), then breaking the norm is immoral *until the conditioning changes*.
      *   *Key Phrase:* "Psychological Lag." The institutions change faster than the psyche.

  7.  **Final Polish:** Organize into logical sections. Ensure the connection between jealousy, children, and consequentialism is tight. (Proceed to generate output based on this structure.)

      *   *Structure:*
