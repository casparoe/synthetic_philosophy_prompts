answer: |-
  Here is an argument demonstrating that, when Russell's own consequentialist premises are applied to the psychological reality of his contemporaries, they necessitate a more restrictive moral code than the one he advocates.

  ***

  ### The Temporal Equivocation: Why Russell's Consequentialism Demands Restraint

  In *Marriage and Morals* (1929), Bertrand Russell attempts to dismantle the Victorian sexual ethic by replacing deontological duty (fidelity as an intrinsic good) with a utilitarian calculus (fidelity as instrumental to welfare). His central thesis is that extramarital relationships are not inherently sinful; they are only objectionable if they produce harmful consequences, primarily for children and the stability of the home. Simultaneously, Russell diagnoses jealousy as a destructive passion rooted in property rights and social conditioning rather than biological necessity. He argues that because jealousy is learned, it can be unlearned, and he encourages a relaxation of sexual taboos to facilitate this psychological evolution.

  However, there is a critical fissure in this argument. Russell is prescribing a morality suitable for a *reformed* psychology to people possessing an *unreformed* psychology. If one applies Russell's own consequentialist metric honestly to the actual emotional constitution of people raised under conventional monogamy, the verdict on extramarital relationships becomes significantly more restrictive. By ignoring the "psychological lag" between social reform and emotional conditioning, Russell violates his own primary commandment: the protection of children from domestic instability.

  #### 1. The Consequentialist Axiom
  Russell's ethical framework is rigorously consequentialist regarding the family. He explicitly rejects the idea that a vow creates a metaphysical bond that cannot be broken without sin. Instead, the moral weight of an action rests entirely on its outcome. The supreme value in this calculus is the emotional security of the child. Russell writes extensively on the damage inflicted upon children by parental conflict, divorce, and a tense domestic atmosphere.

  Therefore, under Russell's system, any action that predictably generates domestic turmoil is morally impermissible, not because it breaks a rule, but because it causes harm. The moral permissibility of an affair is contingent on the emotional resilience of the spouses involved. If the spouses possess a psychology where infidelity triggers destructive jealousy, the affair is morally wrong *for them*, regardless of whether jealousy is "natural" or "constructed."

  #### 2. Jealousy as a "Social Fact"
  Russell spends considerable energy arguing that jealousy is not a biological inevitability. He is likely correct that it is largely a product of proprietary culture. However, in the context of moral decision-making, the *etiology* of a passion is less relevant than its *existence*.

  For Russell's contemporaries (and indeed for most people raised in monogamous cultures), jealousy is a "social fact." It is a deeply ingrained psychological reflex. Even if jealousy is a "monster" created by society, it is a monster that currently bites. Russell acknowledges the intensity of this suffering, describing jealousy as one of the most potent sources of unhappiness.

  Here lies the tension: Russell wants to treat jealousy as a mutable variable that should be overcome, but he must also treat it as a fixed variable when calculating consequences. If a husband raised in 1920s England discovers his wife's infidelity, his resultant jealousy is not a theoretical possibility; it is a near-certainty. That jealousy will likely lead to conflict, resentment, or separation. Since Russell admits these outcomes are devastating for children, the action triggering them (the infidelity) must be deemed morally hazardous.

  #### 3. The Problem of the Transitional Generation
  Russell's error is one of temporal scope. He is arguing for the morals of a future generation (Generation B), who will be raised without proprietary sexual conditioning, while addressing the behavior of the current generation (Generation A), who are fully conditioned.

  For Generation B, Russell's permissiveness makes sense. If they do not feel proprietary jealousy, extramarital relationships will not destabilize the home, and thus, under his consequentialist metric, they are permissible. But for Generation A, the conditions for permissiveness do not exist. To tell Generation A to act as if they are Generation B is to invite disaster.

  Consider the analogy of alcoholism. One might argue that alcohol is not intrinsically evil and that a healthy relationship with it is possible. However, advising a recovering alcoholic to drink moderately to prove that alcohol isn't evil would be irresponsible. The moral action is determined by the drinker's current physiological relationship to the substance, not the substance's intrinsic properties. Similarly, for people psychologically "addicted" to monogamous exclusivity, introducing non-exclusivity is not an act of liberation but a catalyst for pain.

  #### 4. The Welfare of Children as the Trump Card
  Russell places the welfare of children above the sexual freedom of adults. He argues that the home must be a stable haven. Yet, his push for relaxed morals among the current generation undermines this stability.

  If a couple attempts to adopt Russell's open arrangement while still harboring conventional jealousies, the home becomes a site of negotiation, insecurity, and emotional volatility. Even if divorce is avoided, the "atmosphere" of the home is compromised. Russell admits that children are highly sensitive to parental tension. Therefore, for parents who have not successfully eradicated their proprietary instincts, adhering to conventional fidelity is the *lesser evil*.

  By advocating for permissiveness now, Russell is effectively asking the current generation of children to sacrifice their emotional security so that their parents can experiment with a new morality that will only benefit *their* children (the next generation). This is a utilitarian calculation that fails its own test: it inflicts certain harm on existing children for the sake of speculative future benefits. A consistent application of Russell's child-centric utilitarianism would demand a period of transitional strictness. Parents should restrain their desires not because fidelity is sacred, but because their own psychology is currently too fragile to handle freedom without collateral damage.

  #### 5. Conclusion: The Duty of Restraint
  Russell's argument rests on the hope that practice will reshape psychology—that by allowing extramarital relationships, we will diminish jealousy. This is a "bootstraps" theory of moral psychology: we must act as if we are free to become free. But this ignores the immediate consequentialist cost of the stumbling that will occur during that process.

  If morality is truly about consequences, then the moral status of an act is relative to the agent's capacity to perform it without causing harm. For a person raised in a culture of sexual proprietorship, extramarital sex carries a high probability of causing harm (via jealousy and instability). Therefore, for that person, it is morally restrictive.

  Russell fails to distinguish between the *ideal* morality (for a jealousy-free society) and the *transitional* morality (for a society in flux). By applying the ideal to the transitional, he creates a system where the pursuit of a greater good (the elimination of jealousy) justifies immediate harms (destabilized homes). To be consistent with his own prioritization of children's welfare and his own empirical observations about the power of jealousy, Russell should have argued that until jealousy is demonstrably eradicated by new upbringing, the older generation has a moral duty to maintain the external forms of fidelity. Not because the vow is sacred, but because their own hearts are not yet ready to be free.
