  ***

  ### A More Defensible Version of Relevance

  There is a position stronger than Owen's "tone" argument but more nuanced than Lena's "irrelevance" claim: the diary reveals that Frege's conception of logic was not merely descriptive but deeply **normative**, and the source of that normativity is entangled with his ethical and political worldview. Frege viewed logic as a guide for how we *ought* to think to avoid error, employing a vocabulary of discipline, purity, and objective authority. The diary suggests that these normative standards were not derived solely from the nature of truth, but were partly sustained by a pre-theoretical commitment to a specific kind of social and metaphysical hierarchy.

  This doesn't change the truth-value of the *Grundgesetze*, but it challenges the **self-conception** of Frege's project. If the "objectivity" he defends against psychologism is itself underwritten by a subjective, politically charged fear of "contamination," then his anti-psychologism may be less of a neutral discovery and more of a defensive ideological maneuver. This allows the historian to argue that while Frege's theorems stand, his *account* of why logic has authority over us is compromised by the very psychological and historical contingencies he sought to exclude.
