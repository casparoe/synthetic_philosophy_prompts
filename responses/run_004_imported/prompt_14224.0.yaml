      *   Highlight that Harsanyi's theorem is a "conditional" proof (If A, B, C, then D). Philosophers dispute A, B, or C.
      *   Mention specific names: Diamond, Sen, Parfit.
      *   Make sure the distinction between *rationality* and *morality* is clear.

  7.  **Self-Correction/Safety Check:**
