          *   Tone: Intellectual, sharp, respectful but persistent.

  2.  **Deconstruct Good's Theorem:**
      *   *Core Claim:* $E[U(\text{observe } E, \text{act optimally})] \geq U(\text{act optimally without } E)$.
      *   *Assumptions:*
          1.  Cost of information is zero (or accounted for).
          2.  Single agent (no game theoretic signaling).
          3.  Utility depends only on the *outcome* of the action, not the state of belief itself.
          4.  Agent is perfectly rational (updates correctly, maximizes expected utility).
          5.  Information is "free" in the sense of no binding constraints.

  3.  **Analyze the Counterexamples:**
      *   *Genetic Testing:* Why avoid? Fear of knowing (utility of belief), insurance discrimination (game theory/external agent), no cure (action doesn't change).
          *   *Alice's angle:* If action doesn't change, value is zero, not negative. If fear exists, utility function includes "peace of mind." If insurance, that's a game theory problem.
      *   *Negotiation (Walk-away number):* Why avoid? Knowing it might make you bluff poorly or signal weakness (game theory), or psychological inability to stick to it (bounded rationality).
          *   *Alice's angle:* If you can't stick to it, you aren't the rational agent the theorem assumes. If signaling, it's multi-agent.
      *   *Manager (Plausible Deniability):* Why avoid? Legal liability (external agent/punishment structure).
