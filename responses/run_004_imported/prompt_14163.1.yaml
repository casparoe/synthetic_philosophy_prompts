answer: |-
  This is actually a profound question that touches on one of the biggest debates in social psychology and ethics. You've stumbled onto something real: the tension between **Trait Theory** (personality is stable) and **Situationism** (behavior is determined by context).

  You asked for clarity, not reassurance, so let's break down why both your friends' answers feel incomplete and what is actually happening in your brain.

  ### 1. The "Good Samaritan" Evidence
  You asked if a "genuinely nice person would've stopped both times." There is actual data on this. In 1973, psychologists Darley and Batson conducted a famous study at Princeton Theological Seminary. They took seminary students (people training to be religious leaders/moral guides) and asked them to walk to another building.

  *   **Group A** was told they were early.
  *   **Group B** was told they were late and needed to hurry.
  *   On the way, all of them passed a slumped, coughing man (an actor) in an alley.

  **The Result:** The content of their upcoming speech (whether it was about the Good Samaritan parable or something else) didn't matter. The *only* thing that mattered was time. Of those who were late, only **10%** stopped to help. Of those who were early, **63%** stopped.

  **What this means for you:** Mia is scientifically closer to the truth than your mom. When the "cost" of helping is high (getting in trouble, being late), the vast majority of people—even those who identify as moral or helpful—will prioritize self-preservation. This doesn't mean character is fake; it means character has a "breaking point" under pressure.

  ### 2. The Trap of "Niceness" as an Identity
  You said: *"I would've told you I'm just a nice/helpful person... like thats a fact about me the same way my eye color is."*

  **This is the root of your anxiety.** Eye color is static; morality is dynamic. When you view niceness as a fixed identity (a noun), any deviation feels like a lie. If you are "A Nice Person," then Action X *must* always equal Helping. When Action X equaled Walking Away, your brain registered a system error.

  A clearer way to think about it is that niceness is a **practice** (a verb), not a species.
  *   **Identity View:** "I *am* nice." (Fragile, easily broken by one mistake).
  *   **Practice View:** "I *practice* kindness." (Resilient, acknowledges that sometimes I fail, but I return to the practice).

  If you view it as a practice, the first incident wasn't proof you aren't nice; it was proof that your "kindness bandwidth" was maxed out by the stress of being late.

  ### 3. The "Fundamental Attribution Error"
  In psychology, there is a concept called the Fundamental Attribution Error. It describes how we judge others vs. ourselves.
  *   **Judging Others:** We attribute their behavior to their *character* ("He didn't help because he's selfish").
  *   **Judging Ourselves:** We attribute our behavior to *circumstances* ("I didn't help because I was late").

  You are currently flipping this on yourself. You are judging your own character as harshly as you would judge a stranger's. You are ignoring the circumstance (the rush, the anxiety of being "always late") and attributing the action solely to a flaw in your soul.

  ### 4. Why the "Gross" Feeling Matters
  You mentioned you felt "gross about it for the rest of the day." **This is the most important data point.**

  A person who is genuinely not nice (antisocial, purely selfish) does not feel guilt after ignoring someone in need. They rationalize it and forget it within five minutes. The fact that this bothered you for two weeks is evidence that your default setting *is* helpful. The guilt is the friction between your values and your actions. It's not proof you're fake; it's proof you care.

  ### 5. So, who is right?
  *   **Mia:** She is right that the situation was the primary driver. If you had been on time, you likely would have stopped (as proven by the second incident). However, she is wrong to imply that "anyone" would do it. Some people stop even when late. Your threshold just happened to align with the majority in that moment.
  *   **Your Mom:** She is right that you are a "good kid," but she is treating it like a permanent shield. She's dodging the question of *why* it happened.
  *   **You:** You are right to question the stability of personality.

  ### The Verdict
  There is no such thing as a "genuinely nice person" who stops 100% of the time regardless of context. That is a cartoon character, not a human.

  **Niceness is not a reservoir that you either have or don't have; it is a resource that gets depleted.**
  In Incident 1, your resource was depleted by the stress of being late (especially since you noted you are *always* late to that class, implying a baseline anxiety). In Incident 2, your tank was full, so you helped without thinking.

  **How to think clearly about this:**
  Stop asking "Am I a nice person?" and start asking "What conditions make it harder for me to be nice?"
  *   *Answer:* When I am rushed, anxious, or worried about authority figures (teachers/tardies).

  That isn't a moral failing; that is a human limitation. The fact that you helped the second kid proves the tendency is there. The fact that you skipped the first kid proves you have limits. Both can be true.

  You aren't secretly not nice. You're just a person whose "helping capacity" is sensitive to time pressure. That doesn't invalidate your character; it just defines its parameters.
