  2.  **Deconstruct the Philosophical/Psychological Core:**
      *   **Trait Theory vs. Situationism:** This is a classic debate in social psychology.
          *   *Trait Theory:* Personality is consistent across situations (e.g., the Big Five).
          *   *Situationism:* Behavior is largely determined by contextual factors (e.g., the Good Samaritan Study).
      *   **The "Fundamental Attribution Error":** We tend to attribute others' behavior to character but our own to circumstances. The user is flipping this on themselves (attributing their own behavior to character flaws).
      *   **The Definition of "Nice":** Is "nice" an absolute state (never fail) or a tendency (usually help)?
      *   **Cognitive Dissonance:** The discomfort felt when behavior conflicts with self-image.

  3.  **Evaluate Mia's and Mom's Arguments:**
      *   **Mia:** Leans heavily into situationism. Valid point: Urgency changes cost-benefit analysis. But if taken to the extreme ("anyone would do it"), it erodes agency.
