answer: |-
  Here is a draft that aims to walk that tightrope. It treats the "boundary problem" not as a theoretical puzzle to be solved, but as a civic reality to be inhabited. It validates the intellectual honesty you require without using jargon, while centering the emotional weight for the families.

  **Time:** Approx. 5 minutes (roughly 650–700 words at a measured pace).
  **Tone:** Warm, grounded, slightly reflective, but ultimately celebratory.

  ***

  **Title:** The Work of Becoming
  **Occasion:** Naturalization Ceremony Keynote

  Good morning. To the Judge, to the Clerk's office, and most importantly, to the candidates for naturalization and the families filling this room: thank you for letting me share this space with you.

  I am a teacher of political theory. My job, usually, is to take simple things and make them complicated. I ask students questions like, "What makes a community?" or "Who exactly counts as 'the people'?" In a classroom, those questions can keep us up at night. They remind us that drawing a line between "us" and "them" is one of the hardest things human beings do.

  But this room is not a classroom. This is a place where questions turn into answers.

  I know that for many of you, today is the end of a long journey. There were forms to fill, tests to study for, years of waiting. It is easy to think of citizenship as a door you were locked out of, and now, finally, you have the key.

  But I want to suggest something slightly different. I want to suggest that "the people" of this country are not a club that existed before you arrived, waiting for you to join. We often talk about democracy as if "the people" are a fixed group, like a family you are born into. But in a democracy, "the people" are something we build. They are made, not found.

  For those of you born here, citizenship is often an accident of geography. It is a matter of luck. But for you, standing here today, citizenship is a matter of choice. And that distinction matters. It matters because it reminds all of us—new citizens and native-born alike—that this community is not defined by blood or soil, but by a commitment we make to one another.

  There is a tension in every democracy. We want boundaries to be secure, but we also want them to be just. We want to know who belongs, but we also know that belonging is complicated. Theoretically, it is very difficult to explain exactly where the line of "the people" should be drawn without running in circles.

  But today, you resolve that tension. Not with a theory, but with an action.

  In a few minutes, you will take an oath. That oath is a performative act. It doesn't just describe who you are; it *makes* you who you are. By raising your hand and speaking those words, you are drawing the boundary of the community through your own will. You are saying, "I am here. I am willing to bear the responsibilities. I am willing to argue for the future of this place."

  This is why I am genuinely honored to be here. Because while I spend my time worrying about the definition of "the people," you are here to embody it.

  To the families in the audience: I see you. I know the sacrifices that brought you to this courtroom. Today validates those sacrifices, but it also marks a new beginning. Your loved ones are not just gaining rights; they are gaining a voice in the ongoing argument of what this country should be.

  And to the new citizens: Please know that your perspective is vital. Because you chose this place, you see it with a clarity that those of us who stumbled into it by birth often lack. You know what it costs. You know what it means to cross a line.

  So, when you leave this room, do not think of yourselves as guests who have finally been allowed inside the house. Think of yourselves as the people who are now responsible for the maintenance of the house. The boundary of "the people" is not a wall that keeps the world out; it is a circle that holds us together while we do the work of self-government.

  That work is messy. It is unfinished. It is often difficult. But it is yours.

  Thank you, congratulations, and welcome to the work.
