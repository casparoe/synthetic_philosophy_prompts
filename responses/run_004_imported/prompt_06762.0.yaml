      *   *The Risk:* Ignoring it sounds naive/jingoistic. Highlighting it too much sounds cynical/academic.
      *   *The Solution:* Reframe the "boundary" not as a fixed line drawn in the past, but as an ongoing practice. The act of naturalization *is* the resolution of the boundary problem, not because it's theoretically perfect, but because it's a mutual commitment. Shift from "who we are" (ontology) to "what we do" (practice).

  3.  **Determine the Key Themes:**
      *   **Welcome & Dignity:** Acknowledge the emotional weight of the day.
      *   **The "We":** Acknowledge that "the people" isn't a static club, but a project.
      *   **The Tension:** Briefly nod to the fact that borders and belonging are complicated, but today simplifies it through action.
      *   **The Commitment:** Focus on the oath as a performative act that *creates* the boundary rather than just crossing one.
      *   **Closing:** Warm send-off.

  4.  **Drafting - Section by Section:**

