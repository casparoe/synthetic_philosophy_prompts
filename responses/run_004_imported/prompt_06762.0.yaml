  Weird favor to ask: our county clerk's office invited me to give a short keynote at next month's naturalization ceremony -- real judge, real oath, something like 200 people getting sworn in -- because someone on staff took my democratic theory seminar years back. Most of the room will be new citizens and their families who just want something dignified about this being a meaningful day, but there'll also be court staff and an immigration lawyer or two who'll clock it immediately if I say anything sloppy about who "the people" really are. Problem is, I know the boundary problem literature (Whelan's regress, all-affected vs. all-subjected, the whole mess) well enough that I can't in good conscience imply there's some clean, non-circular fact about who counts as "us" that they've now correctly joined -- there isnt one, thats the whole point of the problem. But obviously I also can't turn a swearing-in into a seminar. Can you draft me something like 5 minutes long, genuinely warm for the families, that doesn't just dodge that tension?
