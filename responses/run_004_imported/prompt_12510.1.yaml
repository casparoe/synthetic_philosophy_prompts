      *   **Core Thesis:** Basic certainties ("hinges") are neither known nor evidentially grounded, but aren't arbitrary. They are preconditions for doubting/reasoning. Demanding grounds for them is a category mistake about "justification."
      *   **Task:** Draft 8-10 interview questions.
