          *   Refinement: Focus on the "non-circular basis." If we can't use evidence (since evidence presupposes hinges), what tool do we use? Pragmatism? Coherence?
          *   Follow-up: If she says pragmatism, ask about successful but false frameworks.

      *   *Q4: Scientific Revolutions.*
          *   Idea: Science changes hinges (e.g., Newton to Einstein). If hinges are immune to evidence, how does science progress?
          *   Refinement: Distinguish between "riverbed" and "water." Can the riverbed move?
          *   Follow-up: If she says they shift slowly, ask what triggers the shift if not evidence.

      *   *Q5: The "Confusion" Charge.*
