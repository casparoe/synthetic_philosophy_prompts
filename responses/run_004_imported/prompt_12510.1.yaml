      *   **Constraint 3:** For each question, add a short follow-up keyed to her likely answer.

  2.  **Deconstruct the Guest's Position (Wittgensteinian Hinge Epistemology):**
      *   *Hinges:* Propositions like "The world exists," "I have a body," "The past is real."
      *   *Status:* Not knowledge (because knowledge requires justification), not ignorance (because doubting them makes inquiry impossible). They are animal certainty or trust.
      *   *Defense:* Asking "Why do you believe the world exists?" is nonsensical within the language game.
      *   *Vulnerabilities:* Relativism (my hinges vs. your hinges), Stagnation (immunizing beliefs from critique), Mooreanism (can I claim to *know* I have hands?).

  3.  **Drafting Strategy - "Not letting her rest on that line":**
      *   Avoid yes/no questions.
      *   Avoid questions that allow a simple restatement of "It's a category mistake."
      *   Force her to apply the theory to concrete, messy scenarios (science, conspiracy, moral progress).
      *   Challenge the boundary between "hinge" and "empirical claim."
      *   Press on the normative force: If hinges aren't justified, why *should* we keep them?

  4.  **Developing the Questions (Iterative Process):**

