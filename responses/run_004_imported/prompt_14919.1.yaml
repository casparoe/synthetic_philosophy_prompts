prompt: |-
  I spent thirty years running an experimental immunology lab and have, since retiring, joined my university's research-integrity committee, which rules on allegations of data fabrication and falsification. As at most US institutions, our policy tracks the federal definition: a misconduct finding requires that the conduct was committed intentionally, knowingly, or recklessly, and it explicitly excludes honest error. We are weighing a case in which a postdoctoral researcher discarded a cluster of "outlier" readings without documenting the exclusions; had they been kept in, they would have undercut a result that went on to a high-profile publication and considerable press coverage. He maintains this was routine data cleaning, of a sort he has done many times on projects nobody remembers. Several committee members are convinced the exclusions were deliberate precisely because so much now rides on the result being real, and some recent reading in experimental philosophy has left me suspecting our deliberations are a live instance of the Knobe effect, whereby people are far readier to call a side effect "intentional" the worse its consequences turn out to be, even holding the evidence about the agent's actual state of mind fixed. I doubt we can simply resolve to disregard the stakes, since a notion of intent purged of all outcome-sensitivity may not be available to us, or even the right thing to aim for. Please draft the memo I will bring to the committee: it should recommend both how to resolve this particular case and what standing protocol we should adopt afterward, and it should take seriously the strongest argument for letting the stakes inform the judgment before explaining why the committee should or shouldn't be persuaded by it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired experimental immunologist (30 years experience), member of university research-integrity committee.
      *   **Context:** Weighing a misconduct case involving a postdoc who discarded outlier data without documentation. The data would have undercut a high-profile publication.
      *   **Policy:** Federal definition (intentional, knowing, or reckless; excludes honest error).
      *   **Problem:** Committee members suspect intent *because* the stakes are high. The user suspects the "Knobe effect" (outcome bias affecting intent attribution).
      *   **Task:** Draft a memo to the committee.
      *   **Requirements:**
          *   Recommend how to resolve the *current case*.
          *   Recommend a *standing protocol* for future cases.
          *   Take seriously the strongest argument for letting stakes inform judgment (outcome sensitivity).
          *   Explain why the committee should or shouldn't be persuaded by that argument.
          *   Tone: Professional, authoritative, nuanced, scientifically grounded, philosophically aware.

  2.  **Deconstruct the Ethical/Philosophical Issue:**
      *   *The Knobe Effect:* People judge side effects as intentional if they are harmful (bad outcome) but unintentional if they are beneficial (good outcome), even if the mental state is identical. Here, the "side effect" is the undermining of the result. If the result is important (high stakes), excluding data looks more "intentional" (misconduct) than if the result were trivial.
      *   *The Policy:* Requires proof of *mens rea* (intent/knowledge/recklessness). Honest error is excluded.
      *   *The Evidence:* Postdoc says "routine cleaning." No documentation of exclusion. High impact result.
      *   *The Tension:* Does the lack of documentation + high stakes = recklessness? Or does the high stakes bias us to see intent where there was only sloppiness?
      *   *The User's Insight:* We can't fully purge outcome sensitivity (recklessness *is* often defined by the risk involved), but we must avoid the cognitive bias of the Knobe effect.

  3.  **Determine the Recommendation (The "Verdict"):**
      *   *Option A (Misconduct):* Hard to prove specific intent to deceive without a smoking gun (email, confession). Risks punishing sloppiness as fraud.
      *   *Option B (Honest Error):* Ignores the lack of documentation. In immunology (user's field), discarding outliers without recording *why* is a major procedural violation, even if not fraud.
      *   *Option C (Recklessness/QRCP - Questionable Research Practice):* This is the sweet spot. It acknowledges the violation of norms (no documentation) without requiring proof of malicious deceit. It addresses the "stakes" by defining recklessness relative to the claim's weight.
      *   *Decision:* Recommend a finding of **Recklessness** (or at least a serious QRCP, depending on specific university policy terminology, but sticking to the federal "IRK" - Intentional, Knowing, Reckless - framework is safer). Actually, given the prompt says policy tracks federal definition (IRK), "Reckless" is the key category. It bridges the gap between "Honest Error" and "Intentional Fabrication."
      *   *Refinement:* The prompt asks to resolve the case. If the evidence of *intent to deceive* is weak, but the *lack of documentation* is clear, "Recklessness" is the most defensible finding. It acknowledges the high stakes made the omission dangerous, without falling into the Knobe trap of assuming malice *because* the stakes are high.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** Acknowledge the gravity of the case and the specific philosophical concern (Knobe effect). Establish credibility (30 years lab experience).
      *   **Analysis of the Current Case:**
          *   Address the Postdoc's claim ("routine cleaning").
          *   Address the Committee's concern (High stakes).
          *   Apply the "Recklessness" standard. In science, recklessness isn't just "not caring"; it's "deviating from accepted norms in a way that creates substantial risk."
          *   *Resolution:* Findings of Recklessness regarding data management, but perhaps stop short of Fabrication/Falsification if intent to deceive can't be proven. *Correction:* The prompt asks to rule on allegations of fabrication/falsification. If I recommend "Recklessness," that *is* a misconduct finding under federal policy. So, the recommendation should be a finding of Misconduct (via Recklessness) regarding the *process*, or a finding of No Misconduct but Serious QRCP.
          *   *Better approach:* Given the user's hesitation about the Knobe effect, I should argue *against* letting the stakes prove intent, but *for* letting the stakes define the threshold of recklessness.
          *   *Verdict:* Recommend a finding of **Recklessness** (Misconduct). Why? Because in high-stakes science, undocumented exclusion is inherently reckless. It's not about whether he *wanted* to lie, but whether he disregarded the risk.
      *   **The Philosophical Argument (Knobe Effect vs. Normative Risk):**
          *   *Argument for Stakes:* High stakes raise the duty of care. What is "sloppy" in a pilot study is "reckless" in a landmark paper. Therefore, stakes *should* matter.
          *   *Counter-Argument (Knobe):* We must not infer *mental state* (desire to deceive) from the *outcome* (embarrassment/retraction risk).
          *   *Synthesis:* Stakes define the *standard of care* (recklessness), not the *motive* (intent).
      *   **Standing Protocol:**
          *   Need to separate "Intent to Deceive" from "Reckless Disregard for Norms."
          *   Implement a "Data Management Audit" independent of the outcome.
          *   Explicitly train committee members on cognitive biases (Knobe, Hindsight Bias).
          *   Distinguish between FFP (Fabrication, Falsification, Plagiarism) and QRPs (Questionable Research Practices).

  5.  **Refining the Tone:**
      *   Needs to sound like a senior scientist speaking to peers.
      *   Respectful but firm on the philosophical distinction.
      *   Use immunology/lab analogies where appropriate (controls, blinding).
      *   Acknowledge the difficulty.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Knobe effect specifically? Yes.
      *   *Check:* Did I recommend a specific outcome for the postdoc? Yes (Recklessness).
      *   *Check:* Did I propose a protocol? Yes.
      *   *Check:* Is the argument about stakes nuanced? Yes (Stakes affect Duty of Care, not Mind Reading).
      *   *Critique:* Is "Recklessness" too harsh if he claims it was routine?
      *   *Rebuttal:* In a high-profile publication, "routine" undocumented exclusion is objectively reckless. The policy allows for recklessness. This satisfies the "stakes matter" argument without succumbing to the bias.

  7.  **Final Polish:** Ensure the distinction between *Mens Rea* (guilty mind) and *Negligence/Recklessness* is clear. The Knobe effect confuses moral judgment with intent attribution. We need to keep them separate.

      *(Self-Correction on the Verdict)*: If I recommend a misconduct finding, I am essentially agreeing with the committee members who think it was deliberate. If I recommend no misconduct, I might be ignoring the lack of documentation. The middle path is "Recklessness." It validates the concern about the data without requiring proof of a conspiracy. It treats the *act* of undocumented exclusion in a high-stakes context as the misconduct, rather than the *motive*.

      *Wait, one nuance:* The prompt says the policy excludes honest error. Recklessness is usually included in misconduct (ORI definition: "intentional, knowing, or reckless"). So a finding of Recklessness *is* a misconduct finding. This is a significant outcome for a postdoc. I need to be careful. Is it fair? Yes, because undocumented exclusion in a final dataset is a cardinal sin in immunology, regardless of intent. The "high stakes" make it reckless because the researcher *should have known* the scrutiny would be higher.

      *Let's structure the argument:*
      1. Stakes determine the *standard of care* (Recklessness threshold).
      2. Stakes must not determine the *inference of motive* (Knobe trap).
      3. In this case, the lack of documentation breaches the standard of care required for a high-profile claim.
      4. Therefore, Recklessness is the appropriate finding, not necessarily Intent to Deceive.

      *Wait, looking closer at the prompt:* "Some recent reading... has left me suspecting our deliberations are a live instance of the Knobe effect." The user is worried the committee is biased. The memo needs to guide them *away* from the bias while still addressing the violation.
      *Actually, the strongest ethical position might be:* The lack of documentation is a QRP (Questionable Research Practice), but without evidence of *why* they were outliers (e.g., machine error vs. just 'didn't fit'), we cannot prove Falsification (Misconduct). However, the *undocumented* nature is the issue.
      *Decision:* I will recommend a finding of **Recklessness** regarding data management standards. This acknowledges the severity (stakes) without assuming malicious fabrication. It punishes the carelessness that allowed the error to propagate, which is the true ethical failure here.

      *Wait, let's look at the "Strongest Argument for letting stakes inform judgment".*
      Argument: Recklessness is defined by the risk created. High stakes = High risk. Therefore, the same act (undocumented exclusion) is reckless in a high-stakes paper but merely negligent in a low-stakes one. Thus, stakes *legitimately* inform the judgment of recklessness.
      *Counter:* We must not let stakes convince us he *meant* to lie (Intent).
      *Resolution:* We find Recklessness (stakes-dependent) but avoid inferring Intent to Deceive (stakes-biased).

      *Okay, ready to write.*

  8.  **Final Review against constraints:**
      *   Memo format.
      *   Resolve case.
      *   Standing protocol.
      *   Address Knobe/Stakes argument seriously.
      *   Tone: Senior researcher/Committee member.

      *(One last thought)*: Make sure to explicitly mention the "Knobe Effect" so the committee knows I've done the homework, but frame it in administrative/legal terms suitable for a university committee.

      *(Refining the Recommendation)*: If I recommend Misconduct (Recklessness), the postdoc suffers heavily. If I recommend QRP, the university might look soft. Given the "high-profile publication and considerable press coverage," the university has liability. A finding of Recklessness protects the institution's integrity while being philosophically defensible. I will stick with Recklessness.

      *(Wait, one more nuance)*: The prompt asks to "recommend... how to resolve this particular case." I need to be decisive.
      Okay, I will draft the memo now.

      *Structure:*
      1. Header.
      2. Executive Summary.
      3. Analysis of Intent vs. Outcome (The Knobe Concern).
      4. The Legitimate Role of Stakes (Duty of Care).
      5. Recommendation for Current Case (Recklessness).
      6. Proposed Standing Protocol (Bias mitigation + Standard of Care).
      7. Closing.

      *Tone Check:* Empathetic to the postdoc (career ending) but firm on integrity. Respectful to colleagues.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Deliberative Framework and Recommendation: Case #2023-04 (Postdoctoral Data Exclusion)

  **1. Introduction**

  We are convened to determine whether the exclusion of outlier data points by a postdoctoral researcher constitutes research misconduct under our institutional policy, which mirrors the federal definition: an act must be committed intentionally, knowingly, or recklessly. Honest error is explicitly excluded.

  The facts are not in dispute: a cluster of data points was excluded without documentation; their inclusion would have weakened the central claim of a high-profile publication; and the researcher claims this was "routine cleaning." The dispute lies in the attribution of mental state. Several members argue that the high stakes of the publication imply deliberate exclusion. I am writing to argue that while the stakes are relevant to our judgment, we must rigorously distinguish between *outcome bias* (the Knobe effect) and the *standard of care* required by those stakes.

  This memo outlines why we should not infer intent solely from the severity of the consequence, recommends a finding of **Recklessness** for this specific case, and proposes a standing protocol to insulate future deliberations from cognitive bias.

  **2. The Knobe Effect and the Danger of Outcome Bias**

  As some of you know, the "Knobe effect" describes a cognitive bias where observers are more likely to judge a side effect as "intentional" if the outcome is harmful than if it is beneficial, even when the agent's state of mind is identical. In our context, there is a risk that we are reasoning backward: because the consequence of the exclusion is severe (potential retraction, reputational damage), we are more prone to infer that the exclusion was *intended* to deceive.

  If we allow the magnitude of the embarrassment to prove the magnitude of the malice, we violate the due process inherent in our policy. A postdoc who excludes data sloppily in a trivial pilot study commits the same act as one who does so in a landmark paper. If we find misconduct in the latter case solely because the paper was important, we are punishing the *outcome*, not the *conduct*. We must resist the urge to read a "guilty mind" (*mens rea*) into a situation simply because the result was damaging.

  **3. The Legitimate Role of Stakes: Recklessness and Duty of Care**

  However, dismissing the stakes entirely is also incorrect. There is a strong argument that the stakes *should* inform our judgment, not by altering our view of the researcher's motive, but by altering the **standard of care**.

  In experimental immunology, my field for thirty years, "routine cleaning" is context-dependent. In a preliminary screen, excluding an outlier based on heuristic judgment might be acceptable negligence. In a dataset underpinning a high-visibility claim, that same heuristic becomes a substantial and unjustifiable risk.

  **Recklessness**, under federal guidance, involves a departure from accepted practices where the researcher *should have known* the risk. The "stakes" of the publication define what the researcher *should have known*. A researcher aiming for a high-impact journal accepts a higher duty of documentation and transparency. Therefore, an act that might be "honest error" in a low-stakes context can rise to the level of "recklessness" in a high-stakes context, not because the researcher wanted to lie, but because they disregarded the heightened risk of error inherent in the claim.

  We should be persuaded by the argument that stakes matter, but only insofar as they establish the ** Duty of Care**, not the **Intent to Deceive**.

  **4. Recommendation for Case #2023-04**

  Based on the distinction above, I recommend the following resolution:

  **Finding:** **Research Misconduct (Recklessness)** regarding data management protocols.

  **Rationale:**
  1.  **Intent to Deceive:** We lack sufficient evidence to prove the postdoc *intentionally* fabricated or falsified data to mislead. To do so would likely succumb to the Knobe effect (inferring intent from the bad outcome).
  2.  **Recklessness:** However, the failure to document exclusion criteria for a dataset supporting a major claim is a gross departure from accepted immunological standards. Given the visibility of the work, the researcher acted recklessly by creating a high risk of invalidating the result without maintaining the audit trail necessary to verify it.
  3.  **Consequence:** This finding upholds the integrity of the record without requiring us to prove malicious motive. It acknowledges that in high-stakes science, sloppiness is not a defense; it is a risk that the researcher is accountable for managing.

  **Sanction:** I recommend a formal reprimand and mandatory retraining in data management, rather than termination or referral to the ORI, unless this is part of a pattern. This balances the severity of the breach with the ambiguity of the motive.

  **5. Proposed Standing Protocol**

  To prevent future deliberations from conflating outcome severity with mental state, I propose the committee adopt the following **Bias-Mitigation Protocol**:

  *   **A. The "Blinded Stakes" Review:** In the initial phase of deliberation, the committee should assess the *methodological deviation* (e.g., undocumented exclusion) without immediate reference to the publication's impact factor or press coverage. We must first establish if the act deviates from field norms.
  *   **B. Separation of Findings:** Our findings should explicitly separate **Motive** (Intent/Knowledge) from **Risk** (Recklessness). We must articulate clearly if a finding rests on what the researcher *wanted* to happen versus what they *risked* happening.
  *   **C. The "Pilot Study" Test:** When evaluating "routine" practices, we should ask: *Would this exclusion be acceptable if this data appeared in a low-impact, internal report?* If the answer is yes, we cannot find misconduct based solely on the fact that the data later appeared in a high-impact journal. If the answer is no, the finding rests on Recklessness relative to the context.
  *   **D. Cognitive Bias Training:** New committee members should receive briefing materials on hindsight bias and the Knobe effect to ensure we are adjudicating the researcher's state of mind at the *time of the act*, not in light of the *current controversy*.

  **6. Conclusion**

  We cannot purge our judgment of all outcome sensitivity, nor should we. Science is a normative enterprise where the gravity of a claim dictates the rigor required to support it. However, we must ensure that the gravity of the *consequences* does not manufacture a gravity of *guilt* that the evidence does not support.

  By finding Recklessness, we affirm that the postdoc failed the duty of care required by the stakes of their work, without falling into the trap of assuming they intended the harm that resulted. This preserves the integrity of our policy and the fairness of our process.

  I look forward to discussing this framework at our next session.
