      *   *Meta-Problem:* Chalmers's idea. Instead of solving the "Hard Problem" (why is there experience?), solve the "Meta-Problem" (why do we *say* there is experience?).
      *   *Tension:* Chalmers thinks the meta-problem solution doesn't solve the hard problem (realists can accept the cognitive story). Illusionists think solving the meta-problem *dissolves* the hard problem (because the judgment is mistaken).
      *   *Introspection:* The main evidence for consciousness. Illusionists say introspection is flawed. Realists say introspection is direct access.
      *   *Falsifiability:* If the illusion is perfect (introspectively seamless), how can we test it?

