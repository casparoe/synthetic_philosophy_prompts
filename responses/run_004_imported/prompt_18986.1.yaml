      *   **Guest:** A philosopher defending *illusionism* about phenomenal consciousness (the view that phenomenal consciousness as commonly conceived does not exist, it's an illusion) within David Chalmers's *meta-problem* framing (the problem of explaining why we *think* we have phenomenal consciousness).
