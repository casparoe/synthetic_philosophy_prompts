prompt: |-
  I spent my career as an experimental physicist, and since retiring I've helped run a small monthly philosophy-of-mind discussion group at my local library, where we host a visiting philosopher for a public conversation. Next month's guest defends illusionism about phenomenal consciousness within David Chalmers's 'meta-problem' framing. Draft eight to ten interview questions that go beyond having her restate the position. I want at least one question on whether a meta-problem solution is really neutral between illusionism and realism, given that a realist could accept the same cognitive-scientific story of why we judge we're conscious and simply insist the judgment is also true; and at least one on the 'just more illusion' reply to the charge that introspection still seems, right now, to disclose something real, pressing on whether that reply resolves the regress or only relocates it. For each, include a follow-up keyed to the answer she's most likely to give, and close the sequence with a question asking what observation could, even in principle, count as evidence against illusionism, given that the posited illusion is supposed to be introspectively seamless.
