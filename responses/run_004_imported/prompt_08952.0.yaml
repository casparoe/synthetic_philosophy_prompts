  **Move 1:** Dominic articulates the classic cluelessness objection clearly, but he overstates the case by implying consequentialism requires knowing *all* future effects rather than reasonably foreseeable ones.

  **Move 2:** Marlene correctly deploys the symmetry argument: if uncertainty invalidates donating, it equally invalidates keeping the money, so cluelessness cannot justify inaction.

  **Move 3:** Dominic makes a sophisticated distinction between random noise and systematic bias, though his claim that we know the *direction* of long-term welfare effects without magnitudes is epistemically shaky.

  **Move 4:** Marlene successfully extends the symmetry argument to Dominic's refinement, noting that the counterfactual (keeping the money) also carries systematic, unquantifiable risks.

  **Move 5:** Dominic validly shifts to a meta-ethical critique about action-guidance, but this concedes his initial point that donating is unjustified, retreating to a theoretical objection instead.

  **Move 6:** Marlene correctly invokes the distinction between the criterion of rightness and the decision procedure, noting that computational limits are a general problem for agency, not a unique flaw in consequentialism.

  **Closing Note:** Both interlocutors treat all consequences as equally uncertain, overlooking that consequentialists typically weigh *evidential robustness*: we often have much stronger evidence for short-term benefits than for speculative long-term harms, which breaks the symmetry in practice even if theoretical uncertainty remains.
