  3.  **Drafting - Section by Section:**

      *   **Subject Line:** Needs to be clear and urgent but not alarmist. "Tuesday's Vote" + "Process" is key.
      *   **Opening:** Acknowledge the momentum. Validate the proposer's work. State the purpose of the memo (ensuring the decision is robust).
      *   **The Core Concept (Information Cascade):** How to explain this without economics jargon?
          *   *Analogy:* Restaurant choice, clapping at a talk.
          *   *Mechanism:* Seeing others agree makes you hesitate to disagree, even if you have private info.
          *   *Application to RFC:* Early enthusiastic comments set a tone. Later readers weigh the *social cost* of dissent higher than the *technical value* of their doubt.
