  2.  **Deconstruct the Audience & Tone:**
      *   These are busy engineers. They value clarity, logic, and pragmatism.
      *   They care about the project's health (contributors, migration cost).
      *   Accusing them of "herding" will make them defensive. The explanation must frame it as a *structural* issue, not a *personal* failing.
