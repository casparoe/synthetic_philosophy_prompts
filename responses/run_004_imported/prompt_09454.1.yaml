answer: |-
  **The Case for Counterparts: Why Transworld Identity Fails Concrete Particulars**

  The debate over *de re* modality—claims about what specific objects could or must be—often stalls between two intuitive poles. On one side stands the Kripkean orthodoxy of strict transworld identity: when we say "Humphrey could have won," we mean *Humphrey himself*, numerically identical, exists in another possible world as a winner. On the other stands David Lewis's Counterpart Theory: Humphrey is world-bound; the truth-maker for the claim is a distinct, merely similar counterpart in another world who wins. For ordinary contingent beings like people, the choice is usually presented as a trade-off between logical coherence and intuitive satisfaction. However, this neutrality is unsustainable. When weighed against the metaphysical costs of transworld identity, Counterpart Theory emerges as the superior account. While Kripke's "Humphrey objection" strikes a rhetorical blow, Lewis's framework wins because transworld identity cannot solve the Problem of Accidental Intrinsics without collapsing into a disguised version of counterpart theory anyway.

  The primary virtue of transworld identity is its fidelity to our initial intuitions. As Kripke argues in *Naming and Necessity*, if we are told that Humphrey's counterpart wins, Humphrey himself might rightly say, "I don't care; that's not me." This suggests Counterpart Theory changes the subject. If modal claims are about *me*, then *I* must be the entity possessing the modal properties. However, this intuitive advantage dissolves under metaphysical scrutiny. The doctrine of strict transworld identity faces two devastating objections: Chisholm's Paradox and the Problem of Accidental Intrinsics.

  Chisholm's Paradox exploits the transitivity of identity. If Humphrey in the actual world is identical to Humphrey in world $W1$ (where he has one fewer hair), and that Humphrey is identical to one in $W2$ (with yet another hair less), we can chain these identities across a spectrum of worlds until we identify actual Humphrey with an individual who shares no significant properties with him. To avoid this, the transworld identity theorist must deny the transitivity of identity across worlds, which undermines the very concept of identity they seek to preserve.

  More damaging is Lewis's Problem of Accidental Intrinsics. Intrinsic properties are those an object has in virtue of how it is, not how it relates to other things. Having four limbs is intrinsic. If Humphrey is strictly identical across worlds, he possesses four limbs in the actual world and three limbs in some possible world. This entails a contradiction: one and the same object has incompatible intrinsic properties. The standard Kripkean reply is to index properties to worlds (Humphrey-has-four-limits-at-$w1$). But as Lewis points out, this transforms intrinsic properties into relations to worlds. If "having four limbs" is actually "having four limbs relative to $w1$," then nothing has limbs simpliciter. This relational view effectively concedes the core insight of Counterpart Theory: that modal properties are not possessed by the object alone, but by the object-in-a-context. If transworld identity must treat intrinsic properties as relations to worlds to avoid contradiction, it loses its claim to being "strict identity" in any robust sense.

  Lewis's Counterpart Theory avoids these pitfalls by denying that the individual exists in multiple worlds. Humphrey is world-bound. The counterpart relation is based on similarity, not identity, and crucially, it is not transitive. This blocks Chisholm's Paradox immediately. Furthermore, it solves Accidental Intrinsics: the actual Humphrey has four limbs; his counterpart has three. No contradiction arises because distinct entities hold the properties.

  This leaves the Humphrey objection. Does Lewis's reply suffice? Lewis argues that we care about our counterparts because they represent *ways we could have been*. When we evaluate "Humphrey could have won," we are not looking for Humphrey's literal presence elsewhere; we are evaluating the possibility of a situation sufficiently similar to ours where a person sufficiently similar to Humphrey succeeds. While this requires a shift in intuition, it is a manageable cost. The discomfort Kripke identifies is linguistic, not metaphysical. We speak *as if* Humphrey is there because the counterpart relation is tight enough to sustain the reference. But metaphysical accuracy should trump linguistic convenience. If the strict identity view requires us to treat intrinsic properties as relations to avoid logical contradiction, it is the view that has actually changed the subject, masking a relational ontology under the label of identity.

  Therefore, for concrete particulars like people, Counterpart Theory wins the exchange. Transworld identity offers a comforting surface grammar but fails to provide a coherent ontology of properties and identity. It either succumbs to contradiction or adopts relativizations that mimic counterpart relations. Lewis's theory is metaphysically honest: it acknowledges that modality involves comparison across distinct existences rather than the magical multiplication of the same existence. We should accept that Humphrey is stuck in this world, comforted by the fact that his counterparts are doing well elsewhere, because that is the only way to make sense of what "could have been" means without breaking logic.
