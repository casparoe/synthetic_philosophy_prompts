answer: |-
  The *Aethelgard* shuddered as it entered the Silica Shoals, a nebula of crystalline dust that shredded unshielded hulls like paper. Inside the cockpit, the air smelled of ozone and stale coffee.

  "Frequency set to 440 terahertz," Kip said, his hand hovering over the confirmation latch. He looked at Elara, seeking validation, though his voice was steady. "That's the gap. That's what gets us through."

  Elara didn't look up from her console. Her fingers were dancing across a haptic interface, tracing the spectral lines of the dust clouds swirling outside. "440 is correct," she said. "Engage."

  Kip slammed the latch. The ship hummed, the violent rattling subsiding into a smooth glide. The crystalline dust outside, which should have been sandblasting their viewports, parted around them like water around a stone. They were inside the Shoals, alive and intact.

  Kip exhaled, a sharp laugh escaping him. "Told you. Old man Haren at the station didn't steer us wrong. 'Set it to 440 and pray,' he said. Well, we're set, and I'm not praying."

  Elara kept her eyes on the spectral readout. "Haren got you the answer," she said quietly. "He didn't give you the map."

  "Does it matter? We're through." Kip leaned back, loosening his harness. The belief sat in him solidly: *440 is safe.* It was true. It was working. It felt exactly like knowledge.

  "It matters," Elara said, "because the Shoals breathe."

  Ten minutes later, the alarms screamed.

  The readout spiked. The density of the silica cloud was shifting, a natural tidal surge within the nebula. The resonance frequency required to pass through safely wasn't a constant; it was a variable dependent on the density of the particulate matter.

  The ship began to vibrate again. A fine white powder began to streak across the forward viewport. Micro-fractures webbed across the outer pane.

  "Frequency!" Kip shouted, hands scrambling over the console. "Stay at 440! Hold it!"

  "440 is only for the initial density," Elara said, her voice calm, though her hands were moving faster. "The density is increasing. The frequency needs to shift up to match the compression."

  "Just keep it at 440! Haren said 440!" Kip yelled, locking the setting. He possessed the truth—they needed a specific frequency to survive—but he possessed it like a coin in his pocket. He knew its value, but he didn't know how it was minted. He couldn't make change.

  Elara ignored him. She wasn't relying on a number; she was relying on the relationship between the number and the cloud. She understood the *why*. She understood that the shield needed to vibrate in antiphase to the crystalline structure. As the crystals compressed, their natural frequency rose. To cancel them out, the shield had to rise with them.

  "Elara, you're overriding the safe setting!"

  "I'm keeping us alive," she said. She slid the frequency up. 445. 450. 460.

  The shuddering worsened for a terrifying second. Kip gripped his armrests, knuckles white. "You're breaking us!"

  "Trust the physics, not the rumor," she snapped. She pushed it to 475.

  Suddenly, the vibration ceased. The white streaks on the viewport stopped. The ship glided silently once more, deeper into the nebula.

  Kip sat frozen, staring at the readout. "But... 440 worked. It was true."

  "It was true for the entrance," Elara said, finally turning to look at him. Her face was pale, but her eyes were steady. "You had a true belief, Kip. You knew *that* it worked. I knew *why* it worked."

  She tapped the console, bringing up the schematic of the nebula. "If the cloud had thinned instead of thickened, 440 would have killed us instantly. If we had entered from the south pole instead of the equator, 440 would have shattered the hull. You have a single point of data. I have the line that connects the points."

  Kip looked at the locked frequency lever, then at the shifting storms outside. He realized then that his confidence had been brittle. It was a statue standing on one leg. If the ground shook, it would fall. Elara's confidence was tethered. It could move because it was tied to the reality of the mechanism, not just the memory of a number.

  "So what do I do?" Kip asked, his voice smaller now. "When the next shift comes?"

  Elara pointed to the spectral analyzer. "You stop looking for the number someone gave you. You start watching the wave. You learn why 440 was right yesterday, so you can find 475 today."

  The ship drifted onward into the dark. Kip kept his hand off the lever. He watched the numbers scroll, no longer looking for a magic constant, but trying, for the first time, to see the rhythm beneath them. He had survived the Shoals, but he knew now that luck was a currency that spent itself quickly. Understanding was the only thing that earned interest.

  Outside, the dust shifted again. The readout flickered. Kip leaned forward, not to lock a setting, but to ask a question.

  "Why is it dropping now?"

  Elara smiled, faintly. "Now you're navigating."
