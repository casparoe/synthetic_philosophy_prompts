answer: |-
  Your unease is well-founded. While your friend's reading of *On Certainty* is a prominent and textually supported interpretation (often called the "relativist" or "framework relativist" reading), it is not the only one, and many serious Wittgenstein scholars argue it pushes his insights further than he intended.

  You are right to feel that the move from "hinges are groundless" to "all frameworks are equally rational" is too fast. Wittgenstein dismantles *foundationalism* (the idea that knowledge rests on indubitable proofs), but he does not necessarily dismantle *normativity* (the ability to judge some ways of thinking as better, more coherent, or more useful than others).

  Here is how you might reconstruct the argument to preserve Wittgenstein's insights without surrendering to the conclusion that the physicist and the oracle-consulting king are in identical epistemic positions.

  ### 1. Groundless Does Not Mean Arbitrary
  Your friend is correct that for Wittgenstein, hinge propositions (like "The earth has existed for many years") are not justified by evidence. They are the scaffolding that allows evidence to function. However, Wittgenstein is careful to distinguish **groundless** from **arbitrary**.

  In *On Certainty* (OC §110), Wittgenstein writes: *"It is not a kind of seeing on our part; it is our acting, which lies at the bottom of the language-game."* Hinges are not chosen; they are inherited. They emerge from our biological nature and our practical interaction with the world. "I have two hands" stands fast not because I voted for it, but because in my daily transactions with objects, doors, and tools, it works.

  **The Counter-Argument:** Scientific hinges are deeply tethered to successful action in a shared physical environment. If a hinge consistently leads to failed action (e.g., "I can walk through walls"), it tends to be discarded. Religious hinges often govern a different sphere (meaning, morality, salvation) and may not be tested by the same physical criteria. To say they are "equal" ignores that scientific hinges are constantly stress-tested by their ability to facilitate prediction and control, whereas religious hinges are often protected from such testing.

  ### 2. The Plasticity of the Riverbed
  One of Wittgenstein's most famous metaphors in *On Certainty* is the riverbed (OC §96–99). The propositions of logic and empirical certainty are like the bed of the river, and the fluid propositions (claims, theories) are the water.

  Crucially, **the riverbed shifts.** What was once a hinge can become a proposition subject to testing, and vice versa. For centuries, "The sun revolves around the earth" was a hinge. It became a testable proposition and was found false.

  **The Counter-Argument:** This plasticity is a feature of the scientific framework, not necessarily of the religious one. A framework that allows its hinges to shift in response to accumulated anomalies is epistemically distinct from a framework that treats its hinges as eternal, immutable revelations. You are entitled to argue that a system capable of self-correction (science) is more "rational" in a pragmatic sense than a system that forbids hinge-revision (dogmatic religion), even if both ultimately rest on unproven certainties. Wittgenstein acknowledges that the "mythology" of a people can change (OC §167); the rate and mechanism of that change matter.

  ### 3. The Nature of the Conflict (OC §609–612)
  Your friend cites the example of the King who believes the earth began with him versus the modern person. Wittgenstein says arguing with him is futile because he lacks the shared hinges required for argument.

  However, Wittgenstein does not say we must treat the King's view as *valid*. He says we cannot *refute* him using our evidence, because he does not accept the authority of that evidence. But Wittgenstein also suggests that such a person might be treated as mentally disturbed or simply as someone operating outside the bounds of what we call "judging" (OC §155).

  **The Counter-Argument:** Wittgenstein distinguishes between a **difference of opinion** and a **difference in world-picture**. When frameworks clash, we don't just shrug. We try to convert the other person, not by logical proof, but by massaging their entire system of belief (OC §162). If we are entitled to try to convert the King to a modern worldview (because we think it is *better*), then we are implicitly admitting a hierarchy of frameworks. We think our picture is more comprehensive or less prone to contradiction. Wittgenstein describes the *difficulty* of the conversion, not the *impossibility* of preferring one over the other.

  ### 4. Rationality as Coherence and Fruitfulness
  If justification comes to an end, how do we judge frameworks? We judge them by their **fruitfulness** and **coherence**.

  A scientific framework connects its hinges to a vast network of successful technologies, medical cures, and predictive models. A religious framework might connect its hinges to moral cohesion or existential comfort.
  *   If the claim is about **empirical reality** (e.g., "What causes disease?"), the scientific hinge is more rational because it yields better results in that specific language game.
  *   If the claim is about **ultimate meaning**, the religious hinge may hold sway.

  Your friend's error is assuming that because both are "groundless," they are groundless *in the same way* and for the *same purposes*. Wittgenstein's later philosophy is all about specific language games. It is a category mistake to demand religious hinges perform empirical work, but it is equally a mistake to let religious hinges veto empirical findings without cost.

  ### 5. Wittgenstein Was Not a Feyerabendian
  Paul Feyerabend ("Against Method") argued for epistemological anarchism—that science has no privileged status over myth. Your friend is essentially making a Feyerabendian reading of Wittgenstein.

  However, most scholars (like Peter Hacker or Danièle Moyal-Sharrock) argue Wittgenstein was a **naturalist**. He believed our hinges are rooted in human nature. Since human nature is largely shared (we all bleed, eat, sleep, die), there is a massive overlap in hinges across cultures. The "oracle-consulting king" is an extreme case. Most religious believers actually share the vast majority of scientific hinges (germ theory, gravity, etc.) and compartmentalize their religious hinges.

  Therefore, the distance isn't erased. The scientific framework encompasses a wider range of shared human action regarding the physical world. To treat them as "equal" ignores the sheer scope of the scientific form of life in managing physical reality.

  ### Summary for Your Reading Group
  You can concede the main point to your friend without accepting the unsettling conclusion:

  1.  **Yes,** scientific convictions are ultimately grounded in a form of life, not in absolute logical proof.
  2.  **No,** this does not make them arbitrary or equal to all other forms of life.
  3.  **The Distinction:** We are entitled to prefer frameworks that are **plastic** (allow hinges to shift), **coherent** (minimize internal contradiction), and **fruitful** (enable successful action).
  4.  **The Verdict:** Wittgenstein saves us from the arrogance of thinking we have "God's eye" proof of science, but he does not forbid us from thinking science is a better tool for navigating the physical world than oracle consultation. The physicist and the King are not in the *same* position; the physicist's position allows for the admission of error in a way the King's (by definition) does not.

  Wittgenstein destroys the *foundation* of science, but he leaves the *building* standing. Your friend thinks that because the foundation is gone, the building is no better than a shack. You can argue that the building still keeps the rain out better, even if it rests on the ground rather than on bedrock.
