      *   **Constraint:** "Actual best guess at his reasoning, not just a one liner." Needs depth, nuance, and historical/philosophical grounding.

  2.  **Deconstruct Keynes's Philosophical Stance:**
      *   *Moore's Influence:* Keynes was a devoted Apostle (Cambridge secret society). Moore taught them that the ultimate goods are "the pleasures of human intercourse and the enjoyment of beautiful objects." Consequences matter less than the intrinsic value of the state of mind.
      *   *Anti-Utilitarian:* He rejected the idea that you can sum up utility across individuals. He valued the *quality* of experience over the *quantity*.
      *   *The "Economic Problem":* He believed once scarcity is solved, the love of money (instrumental good) becomes a vice. We should work to live, not live to work.
      *   *The Role of the Elite:* Keynes wasn't a populist. He believed in a cultured vanguard who knew how to enjoy life properly.

  3.  **Deconstruct Effective Altruism (EA):**
      *   *Core Tenet:* Use evidence and reason to determine the most effective ways to benefit others.
      *   *Methodology:* Often utilitarian. QALYs (Quality-Adjusted Life Years), lives saved per dollar, cause prioritization (global health, animal welfare, existential risk).
