answer: |-
  This is a fantastic question because it cuts right to the tension between Keynes the economist (who dealt in aggregates and numbers) and Keynes the moral philosopher (who was deeply suspicious of reducing human life to aggregates and numbers).

  If we take his essay *"Economic Possibilities for our Grandchildren"* seriously, and layer it over his devotion to G.E. Moore's *Principia Ethica*, my best guess is that Keynes would view Effective Altruism (EA) with a profound sense of **tragic ambivalence.** He would likely respect the *virtue* of the practitioners but diagnose the *philosophy* as a symptom of the very disease he hoped we would cure.

  Here is the breakdown of how I think he would reason through it.

  ### 1. The Return of the Benthamite Worm
  You hit the nail on the head regarding the "Benthamite calculus." Keynes famously wrote that utilitarianism had been a "worm gnawing away at the insides of modern civilization." For Keynes and the Bloomsbury Group, Moore proved that "good" was a simple, indefinable quality attached to specific states of consciousness (like enjoying a conversation or looking at a painting), not a sum total of pleasure units.

  Effective Altruism is, in many ways, the ultimate triumph of the Benthamite calculus. It relies on commensurability—the idea that you can compare disparate goods (e.g., preventing a malaria death vs. funding AI safety research) using a common metric (QALYs, lives saved, expected value).

  Keynes would likely argue that EA has perfected the *math* of morality while missing the *point* of morality. To Keynes, asking "How many lives can I save per dollar?" is a category error similar to asking "How much profit can I make per hour?" Both treat human outcomes as inputs in a production function. He would worry that EA turns morality into just another form of accounting, keeping us trapped in the economic mindset even when we are trying to be charitable. He would say you cannot quantify the "goodness" of a saved life in a way that allows it to be traded off against other goods without losing something essential about human value.

  ### 2. The "Earn-to-Give" Trap
  This is where Keynes's critique would be sharpest. A core tenet of *"Economic Possibilities for our Grandchildren"* is that the love of money is a "disgusting morbidity," a semi-criminal, semi-pathological propensity that we should be transitioning out of. He envisioned a future where we work 15 hours a week just to satisfy necessity, and spend the rest of our time cultivating the art of life.

  The EA strategy of "earn-to-give" (taking a high-stress, high-income job you don't necessarily love, in order to donate the surplus) would strike Keynes as a failure of imagination.

  He would argue: *Why are we still accepting that the most "productive" thing a person can do is generate capital?* Even if that capital is donated, the act of earning it often requires participating in the very "grind" and competitive struggle that Keynes believed was making us miserable. He would likely view the earn-to-give crowd as martyrs to the economic problem, rather than pioneers of the post-economic era. He would ask: *If you have the talent to earn millions, why not use that talent to create beauty, foster love, or engage in statecraft directly, rather than treating your life as a revenue stream for a charity?*

  ### 3. The Transition vs. The Destination
  However, Keynes was a pragmatist. He understood that we are not yet in the utopia of 2030 (or whenever he thought the economic problem would be solved). He recognized that capital accumulation was necessary to get us to the point where scarcity is solved.

  Here is where he might grant EA a provisional pardon. He might view Effective Altruism as a **necessary bridge philosophy.** Since we are *not* yet living in a world of leisure and abundance, and since suffering is still acute, the "calculus" is a useful tool for the transition phase. He would appreciate that EA is trying to solve the immediate problem of scarcity (hunger, disease) efficiently so that humanity can eventually reach the stage where we can worry about "how to live."

  He would likely say: *"Your math is useful for the age of scarcity, but do not mistake it for wisdom in the age of abundance."* He would worry that if EA becomes the dominant moral framework, we will solve the economic problem only to find ourselves spiritually bankrupt, unable to enjoy the leisure we bought because we are too busy optimizing our altruism.

  ### 4. The Moorean Critique of "Impact"
  Finally, we have to look at the Moorean influence you mentioned. For Moore and Keynes, the ultimate goods were "the pleasures of human intercourse and the enjoyment of beautiful objects." These are personal, immediate, and qualitative.

  EA is often impersonal and distant. You are saving a life in a country you will never visit, or preventing an existential risk for people who won't be born for centuries. Keynes would question the *state of consciousness* of the EA practitioner. If you spend your life staring at spreadsheets to maximize abstract impact, are you actually experiencing "the good"?

  He might argue that a person who cultivates deep, loving relationships and creates beauty in their immediate community is living a "better" life in the Moorean sense than the EA maximizer who sacrifices personal connection for marginal gains in global utility. He would fear that EA encourages a kind of moral asceticism that denies the very things that make life worth saving.

  ### The Verdict
  Keynes would likely tell the Effective Altruists:

  > "You are the most virtuous people in the room, but you are solving the wrong problem. You are optimizing the machine, when the goal should be to step off the ride. Your calculus is brilliant, but it is the calculus of the prison, not the palace. Use it to fix the roof so we can stop worrying about the rain, but do not convince yourselves that counting the bricks is the same thing as building a home."

  He would see EA as the highest form of the "Benthamite worm"—noble in its intent to reduce suffering, but ultimately reinforcing the idea that human life is a problem to be solved mathematically, rather than an experience to be inhabited artistically. He would want the EAs to save the world, yes, but then to put down their calculators and learn how to paint, love, and converse, because that, to him, was the only point of saving the world in the first place.
