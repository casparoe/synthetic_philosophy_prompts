      *   *Moore's Shadow:* The crucial link is G.E. Moore. Moore said personal relationships and beauty are the only things that matter. EA says "reducing suffering" matters. These are different ethical frameworks (Ideal Utilitarianism vs. Classical Utilitarianism).

