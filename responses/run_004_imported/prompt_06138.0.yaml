answer: |-
  This is one of the most fertile and technically dense patches of ground in moral philosophy and welfare economics. You have correctly identified the fault lines: Robbins's positivist ban, Harsanyi's formalist workaround, Sen's informational critique, and the shadow of Arrow's theorem looming over the whole enterprise.

  To understand why the Effective Altruism (EA) spreadsheet problem (chicken-years vs. human-years) is actually a reincarnation of the 1950s Harsanyi-Sen debate, we need to disentangle the *mathematical form* of the solution from the *ethical input* required to sustain it.

  Here is the dialectic walk-through.

  ---

  ### 1. Robbins's Ban and the vNM Loophole

  **Robbins's Position (1932):**
  Lionel Robbins argued that economics must be value-free (positive, not normative). To say "taking £1 from a rich man hurts him less than giving it to a poor man helps" requires comparing the internal mental states of two different people. Since we cannot observe or verify another's subjective experience, Interpersonal Utility Comparisons (IUC) are scientifically meaningless. They are ethical judgments, not economic facts. Consequently, welfare economics was stuck in a Paretian straitjacket: you can only say a change is good if it helps someone and hurts no one.

  **Harsanyi's Move (1953, 1955):**
  John Harsanyi realized that the von Neumann–Morgenstern (vNM) expected utility framework offered a way to derive *cardinality* without introspection.
  *   **Robbins's World:** Utility is ordinal ($A \succ B$). You can't say how much more $A$ is preferred to $B$.
  *   **vNM World:** If an agent satisfies axioms like continuity and independence over *lotteries*, their preferences can be represented by a utility function unique up to a **positive affine transformation** ($U' = aU + b$, where $a > 0$).

  This gives you cardinality (intervals matter), but it is *individual* cardinality. For Person A, the gap between $A_1$ and $A_2$ is measurable. For Person B, the gap between $B_1$ and $B_2$ is measurable. But because $a$ and $b$ can be different for everyone, you still cannot compare A's gap to B's gap.

  **The Aggregation Theorem (1955):**
  Harsanyi's famous theorem posits three conditions:
  1.  **Individual Rationality:** Every individual's preferences satisfy vNM axioms.
  2.  **Social Rationality:** Society's preferences (over social lotteries) satisfy vNM axioms.
  3.  **Pareto:** If every individual prefers lottery $L_1$ to $L_2$, society prefers $L_1$ to $L_2$.

  **The Result:** The social welfare function $W$ must be a linear combination of individual utilities:
  $$W = \sum_{i=1}^n a_i U_i + b$$

  **What work is the expected-utility framework doing?**
  It enforces **linearity**. Because vNM utility is defined by how agents trade off probabilities, the only way for a "Social Agent" to respect individual preferences over lotteries (Pareto) while maintaining its own rationality over lotteries is to sum the individual utilities. If the social function were non-linear (e.g., prioritarian or Rawlsian), it would violate the Pareto condition over certain lotteries or violate the independence axiom itself.

  So, Harsanyi sidesteps Robbins not by claiming we can measure feelings, but by claiming that **if** we treat society as a rational agent facing risk, the *logic of consistency* forces us into a utilitarian-style sum.

  ---

  ### 2. The Weighting Problem: Where do the $a_i$ come from?

  You noted the crucial gap: Harsanyi's Aggregation Theorem yields a *weighted* sum ($\sum a_i U_i$), not the *unweighted* sum ($\sum U_i$) required by classical utilitarianism. If $a_{\text{rich}} = 100$ and $a_{\text{poor}} = 1$, the theorem is satisfied, but the result is morally abhorrent.

  Harsanyi bridges this gap with a separate argument, often called the **Impartial Observer Theorem** (1953, refined 1977).

  **The Argument:**
  To determine the weights $a_i$, imagine a moral judge behind a veil of ignorance. The judge has an equal probability ($1/n$) of becoming any person in society. The judge is rational (vNM axioms).
  *   Expected Utility for the Judge = $\sum (1/n) U_i$.
  *   To maximize their own expected utility, the judge must maximize the average utility of the society.
  *   Therefore, $a_i = 1/n$ for all $i$.

  **The Vulnerability:**
  This moves the problem from "How do we compare utilities?" to "Why should the moral judge assume equiprobability?"
  *   **Bayesian Defense:** If the judge has no information about who they will be, the Principle of Insufficient Reason dictates equal probability.
  *   **Critique:** Why is "becoming a person" a lottery event? And more technically, this assumes that the $U_i$ scales are already comparable. If Person A's utility scale is calibrated in "decibels" and Person B's in "meters," averaging them is nonsense. The Impartial Observer argument *presupposes* that we have normalized the units of $U_i$ across persons.

  ---

  ### 3. Sen's Critique: The Taxonomy of Comparability

  Amartya Sen's contribution (particularly in *Choice, Welfare and Measurement* and *On Ethics and Economics*) was to show that "comparability" is not a binary switch. It is an informational setting. He dismantled Harsanyi's claim that vNM axioms alone solve the comparability problem.

  **The vNM Scaling Problem:**
  Recall that vNM utility is unique only up to $U' = aU + b$.
  *   $b$ is the **zero point** (origin).
  *   $a$ is the **unit** (scale).

  To compare Person A and Person B, we need to fix these parameters across persons. Sen distinguishes:

  1.  **Ordinal Non-Comparability (ONC):** We only know rankings. (Arrow's default assumption).
  2.  **Cardinal Unit Comparability (CUC):** We can compare *differences* (intervals), but not absolute levels. (e.g., "A gained more from the policy than B did," but we don't know who is happier overall). **This is required for Utilitarianism.**
  3.  **Cardinal Level Comparability (CLC):** We can compare absolute levels, but not necessarily units. (e.g., "A is happier than B," but we can't sum the gains). **This is required for Rawlsian Maximin.**
  4.  **Full Comparability:** Both levels and units are comparable.

  **Sen's Knockout Punch on Harsanyi:**
  Sen argues that vNM utilities measure **risk attitude**, not necessarily **welfare intensity**.
  *   Imagine Person A is risk-averse and Person B is risk-neutral.
  *   Faced with the same welfare improvement, Person A might show a larger vNM utility difference because they value the certainty of the gain more highly.
  *   If we sum vNM utilities directly (as Harsanyi suggests), we systematically bias the social welfare function toward the **risk-averse**.
  *   Therefore, Harsanyi's theorem does not derive Utilitarianism; it derives "Risk-Weighted Utilitarianism." To get true Utilitarianism, you need an independent ethical stipulation that normalizes the units ($a_i$) across persons, stripping out the risk-attitude component.

  Sen's point is that Harsanyi smuggles in **Cardinal Unit Comparability** as an assumption while claiming to derive it from rationality axioms. The axioms give you cardinality *within* a person, but ethics must give you comparability *between* persons.

  ---

  ### 4. The Arrow Connection: Escape Route or Myth?

  You asked whether introducing comparability is a genuine escape from Arrow's Impossibility Theorem.

  **The Short Answer:** Yes, it is a genuine escape route, but it comes at a high informational cost that Arrow explicitly wanted to avoid.

  **The Mechanism:**
  Arrow's Theorem proves that no social welfare function can satisfy a set of reasonable conditions (Unrestricted Domain, Pareto, Independence of Irrelevant Alternatives, Non-Dictatorship) if the input is **Ordinal Non-Comparable** preferences.
  *   The "Independence of Irrelevant Alternatives" (IIA) condition is the killer. It says the social ranking of A vs. B should depend *only* on individual rankings of A vs. B.
  *   If utilities are non-comparable, you cannot use intensity of preference to break cycles.

  **How Comparability Escapes Arrow:**
  1.  **Cardinal Unit Comparability (CUC):** If we accept CUC (as Utilitarians do), we can simply sum utilities. The "Borda Count" or Utilitarian Sum satisfies Pareto and Non-Dictatorship. It violates Arrow's IIA, but only because IIA is too restrictive for cardinal data. If you know *how much* people prefer A to B, excluding that information (as IIA demands) is throwing away data.
  2.  **Sen's Possibility Theorem:** Sen showed formally that if you enrich the "informational basis" of the social choice rule (i.e., allow some form of comparability), impossibility turns into possibility.
      *   With **Ordinal Comparability**, you can escape Arrow.
      *   With **Cardinal Comparability**, you can escape Arrow easily.

  **Is it a Myth?**
  It is not a myth that comparability escapes Arrow. However, critics (following Robbins and Arrow) argue it is a **pyrrhic victory**.
  *   Arrow's goal was to build a democratic aggregation mechanism that required minimal, verifiable information (votes/rankings).
  *   Harsanyi/Sen style solutions require "thick" information (intensities, interpersonal comparisons) that Robbins deemed unscientific.
  *   So, you escape the *mathematical* impossibility, but you run headfirst into the *epistemological* impossibility that Robbins identified. You solve the logic problem by assuming away the measurement problem.

  ---

  ### 5. Back to the Rabbit Hole: Chickens vs. Humans

  How does this land on your EA spreadsheet?

  When you ask "How many chicken-years offset a human-year?", you are asking for the ratio of the weights ($a_{\text{chicken}} / a_{\text{human}}$) and the normalization of the units ($U_{\text{chicken}} / U_{\text{human}}$).

  1.  **Harsanyi's Answer:** Put yourself behind a veil of ignorance where you have an equal chance of being any human or any chicken. Maximize expected utility.
      *   *Problem:* Do you have an equal chance of being one of 8 billion humans or one of 70 billion chickens? If so, the sheer numbers dominate (Total Utilitarianism). But this assumes the *units* of utility are comparable. Is a chicken's "pain unit" the same magnitude as a human's?
  2.  **Sen's Answer:** You need to establish **Cardinal Unit Comparability** between species.
      *   You cannot do this via preference lotteries (chickens don't play vNM games).
      *   You must rely on physiological/behavioral proxies (neural density, behavioral complexity) to calibrate the $a$ and $b$ parameters across species.
      *   Sen would warn that if you just use "willingness to pay" or revealed preference, you will bias the scale toward the species with more complex risk attitudes (humans), not necessarily more welfare capacity.
  3.  **Robbins's Ghost:** Any number you put in that cell is not an economic fact. It is an ethical parameter. You can justify it via the Impartial Observer (Harsanyi) or via a theory of sentience (Sen), but you cannot derive it from "rationality" alone.

  ### Summary of the Dialectic

  1.  **Robbins:** Interpersonal comparison is meaningless positivism.
  2.  **Harsanyi:** No, if we accept vNM rationality for society, math forces a weighted sum of utilities. (Derives form).
  3.  **Harsanyi (Part 2):** If we accept the Veil of Ignorance, weights must be equal. (Derives weights).
  4.  **Sen:** Harsanyi conflates *risk attitude* with *welfare intensity*. vNM utility isn't automatically comparable across persons. You need an explicit "Informational Basis" (CUC) to make Utilitarianism work.
  5.  **Arrow:** If you grant Sen's Informational Basis (Comparability), my Impossibility Theorem no longer applies. But you have paid for this by assuming the very data (comparable intensities) that is hardest to get.

  The EA spreadsheet is essentially an attempt to operationalize Sen's "Informational Basis" without admitting that it's an ethical choice rather than a scientific calculation. Harsanyi provides the formula; Sen provides the warning label that the variables aren't automatically commensurable.
