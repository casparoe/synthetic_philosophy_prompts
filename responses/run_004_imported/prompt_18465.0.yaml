answer: |-
  **MEMORANDUM**

  **TO:** State Law Revision Commission
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Section [X.XX] (Bigamy and Plural Marriage)

  **I. PURPOSE**

  This memo summarizes the Commission's deliberations regarding the bigamy statute and offers a recommendation on whether to retain, repeal, or amend the provision. This review is conducted under our enabling charter, which mandates the repeal of any criminal statute that no longer serves "a legitimate public purpose apart from enforcing private morality."

  **II. THE CORE CONFLICT**

  The Commission is divided on the application of the charter's standard to the bigamy statute. The factual scenario driving this review involves consensual, adult plural relationships (e.g., a triad where one legal marriage exists) that involve no fraud on the state, no minors, and no coercion.

  Three distinct positions have emerged:
  1.  **Liberty/Privacy:** The statute criminalizes private moral choices without identifiable victims, failing the charter's "public purpose" test.
  2.  **Institutional Integrity:** The state has a legitimate interest in preserving monogamous marriage as a foundational social institution; erosion of this norm is a public harm regardless of individual consent.
  3.  **Enforcement Utility:** Narrowing the statute may hinder the prosecution of coercive polygamous compounds where the bigamy charge serves as a necessary tool for intervention.

  **III. ANALYSIS OF THE "INSTITUTIONAL INTEGRITY" ARGUMENT**

  The argument for retention, eloquently advanced by Commissioner [Judge's Name], rests on the proposition that the criminal law is not merely a mechanism for redressing individual harms, but a tool for maintaining the moral cohesion necessary for a society to function. This echoes the Devlin thesis: that a society is entitled to protect its shared moral structure from erosion, even in the absence of immediate, tangible harm to a specific third party.

  We must treat this argument seriously. The state *does* regulate marriage. It is not merely a private contract; it is a status that confers specific rights, obligations, and a standardized framework for kinship, inheritance, and child-rearing. The argument posits that diluting the exclusivity of this status—by legally tolerating plural unions, even informally—weakens the normative power of the institution itself. If the criminal law signifies the boundary of acceptable social conduct, removing the boundary around monogamy could signal state indifference to the structure of the family.

  However, under our charter, we must ask: Is *criminalization* the appropriate mechanism to protect this interest in 2023?

  While the state has an interest in the *structure* of marriage, the bigamy statute as currently written targets the *status* of the participants rather than the *consequences* of their arrangement. In the stipulated fact pattern (consenting adults, no fraud), the "harm" to the institution is abstract. The state's interest in monogamy is primarily administrative and protective (ensuring clear lines of support and custody). Where those lines are not blurred by fraud or dependency disputes, the "harm" remains purely moral. To retain the statute solely to enforce a preference for dyadic relationships over other adult configurations is to enforce private morality, which our charter explicitly instructs us to excise.

  **IV. ANALYSIS OF THE ENFORCEMENT UTILITY ARGUMENT**

  The third concern—that narrowing the statute hampers prosecution of coercive compounds—requires candor. It is true that in closed, hierarchical communities, bigamy statutes often serve as a "hook" for law enforcement. Proving coercion, abuse, or statutory rape in insular groups is evidentiary difficult. A technical violation of marriage law is easier to prove in court than a pattern of psychological domination.

  We must be honest about what this argument entails. It suggests we should retain a statute criminalizing consensual adult conduct *instrumentally*, so that we may use it to prosecute non-consensual conduct that is likely already criminal under other statutes (assault, kidnapping, fraud, child endangerment).

  While pragmatic, this rationale conflicts with the charter's mandate. A law that remains on the books primarily as a procedural workaround for proving other crimes does not serve a "legitimate public purpose" in its own right; it serves as a evidentiary crutch. If the conduct we truly wish to punish is coercion or fraud, our criminal code should address those specific harms directly. Relying on the bigamy statute to police coercive compounds conflates the *structure* of the relationship with the *abuse* within it. We should not criminalize the former simply to make it easier to catch the latter.

  **V. RECOMMENDATION**

  I recommend the Commission propose an **Amendment to Create an Affirmative Defense**, rather than a full repeal or a status quo retention.

  **The Proposal:**
  Retain the core bigamy statute to preserve the state's interest in the integrity of the marriage licensing system, but add an affirmative defense for defendants who can demonstrate:
  1.  All parties are consenting adults;
  2.  No fraud was committed against the state (taxes, benefits, identity);
  3.  No minors are involved in the plural union; and
  4.  The cohabitation is non-coercive.

  **Rationale:**
  This approach navigates the competing concerns of the Commission:

  1.  **It satisfies the Charter:** It removes criminal penalties from conduct that is purely moral/private (the consensual triad), acknowledging that without fraud or coercion, there is no secular public harm sufficient to justify imprisonment.
  2.  **It respects the Institutional Argument:** It keeps the statute on the books, affirming that the state still recognizes and regulates monogamous marriage as the default legal standard. It signals that while the state will not jail adults for private family arrangements, it does not formally *license* or endorse plural marriage. The "norm" remains, but the "sword" is sheathed for private citizens.
  3.  **It addresses Enforcement Concerns:** It preserves the statute for the cases that matter most: those involving fraud, benefit theft, or where the affirmative defense cannot be met (i.e., coercive compounds). It forces prosecutors in abuse cases to prove the lack of consent or the presence of fraud, which is a higher burden, but a more honest one.

  **VI. CONCLUSION**

  The Hart-Devlin debate asks whether society can legislate morality to save itself. Our charter answers "no," unless that morality serves a public purpose. Protecting the *licensing system* from fraud is a public purpose. Protecting the *concept* of monogamy from private, consensual deviation is not.

  By amending rather than repealing, we acknowledge that the state has an interest in marriage, but we admit that the criminal law is too blunt a tool to police the private boundaries of adult affection. We should not use the threat of felony prosecution to uphold a social norm when no citizen is being harmed by its breach.

  I move that we draft legislation to amend Section [X.XX] consistent with the affirmative defense outlined above.
