      *   **Fred (FOR):** Likely leans towards Dretske or Tye. Emphasizes *externalism* and *poisedness*. Sees HOT as over-intellectualizing experience and creating a homunculus problem. Wants to ground phenomenology in the world-directedness of the first-order state.

  3.  **Drafting - Section by Section:**

