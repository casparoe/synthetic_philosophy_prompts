  6.  *(Final thought before writing)*: I need to make sure Fred doesn't just fall back on "qualia are real." He needs a representationalist account of why the highway case doesn't kill his view. He should argue that the *availability* of the content was compromised, not that the content was missing. Hannah needs to press that availability isn't phenomenality.

