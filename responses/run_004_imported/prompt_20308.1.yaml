          *   *Fred:* This makes consciousness too thin/disconnected from reality. It risks solipsism.
          *   *Hannah:* Counter: FOR has its own misrepresentation problem (illusions). If I see a bent stick, FOR says the content is "bent stick." But the *feel* is the same. HOT explains the *feel* via the HOT, not the FO content.
