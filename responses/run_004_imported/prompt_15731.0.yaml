  ***

  **TA Note for you (the actual TA):**
  The student's derivation is flawless, which suggests they understand the *computation* of mixed strategy domination. The errors are purely definitional. If your course emphasizes the distinction between Rationalizability and Nash Equilibrium, the deduction on the final 2 points is warranted. If the course is more introductory and focuses mostly on the mechanism, you could be lenient and give a 9/10, but I recommend holding the line on "dominance-solvable" because that definition usually comes up in multiple-choice questions later.
