answer: |-
  **The Hypocrite's Gavel: Standing, Aptness, and the Ethics of Blame**

  The confrontation in your student council meeting captures a classic philosophical tension: the distinction between the truth of a moral claim and the authority of the person making it. Your class president insisted that her chronic lateness did not negate the fact that the other officer was late; logically, she was correct. However, your ethics teacher's reference to G.A. Cohen and the concept of "standing to blame" suggests that morality involves more than just factual accuracy. It involves relationships, authority, and the right to participate in moral discourse. To resolve the argument among your friends, we must determine whether hypocrisy is merely a social awkwardness or a genuine moral disqualification.

  To reach a verdict, we must first address whether "lacking standing" is a distinct normative failure or simply a confused way of saying a criticism is misplaced. Your class president's defense relies on conflating these two categories. She argues that because the *content* of her blame is true (lateness is wrong), her *position* to deliver it is secure. This is a category error. In the ethics of blame, "aptness" refers to whether the target actually violated a norm. "Standing" refers to whether the blamer has the moral authority to hold the target accountable.

  Consider a legal analogy: A judge may correctly identify that a defendant is guilty (apt verdict), but if that judge is the defendant's business partner, they lack the standing to preside over the case (recusal). The verdict's accuracy does not cure the procedural illegitimacy. Similarly, in moral contexts, standing is a distinct status. It is not that the criticism is "out of place" in a merely pragmatic sense, like telling a joke at a funeral; it is that the hypocrite forfeits the right to participate in the specific moral transaction of blame. Therefore, lacking standing is a genuine normative failure separate from the falsity of the blame. The officer was wrong to be late, but the president was wrong to be the one to say so.

  This distinction clarifies the second point of contention: the status of the *tu quoque* ("you too") reply. In formal logic, *tu quoque* is indeed a fallacy. If a smoker tells you smoking causes cancer, their habit does not change the medical facts. However, blame is not a scientific assertion; it is a communicative act that implies a specific relationship between two agents. When we blame someone, we implicitly claim to represent the moral community or the norm in question. We assert a position of accountability.

  When a critic is a hypocrite, the *tu quoque* reply is not a deflection from the target's wrongdoing; it is a direct challenge to the critic's authority. By pointing out the critic's identical fault, the target reveals that the critic is not speaking from a position of shared commitment to the norm, but rather from a position of unearned superiority. The *tu quoque* argument succeeds not by proving the norm invalid, but by proving the critic ineligible to enforce it. Thus, *tu quoque* is not always a fallacious deflection; in the context of moral blame, it is a legitimate objection to the speaker's standing.

  However, not all hypocrisy is equal, which brings us to the crucial variable of repentance. Does it matter that your class president is a current, unrepentant offender rather than a reformed one? It matters profoundly. The loss of standing stems from the implication that the hypocrite believes the rules apply to others but not to themselves. This creates a hierarchy of moral subjection that violates the equality required for legitimate blame.

  If your class president were a reformed lateness offender—someone who acknowledged their past faults, corrected them, and then criticized new lateness—the dynamic changes. The reformed critic does not place themselves above the norm; they place themselves alongside the target as a fellow struggler who upholds the value. Their blame comes from a place of shared commitment ("We both know this is harmful") rather than hypocritical domination ("I break this rule, but you cannot"). G.A. Cohen's argument in "Casting the First Stone" hinges on this: those who are themselves guilty of comparable or worse violations lose the right to condemn because they cannot claim to represent the value they are invoking. Unrepentant hypocrisy signals a rejection of the norm's binding power over the self, which invalidates the demand that it bind the other. A reformed critic, conversely, reaffirms the norm's binding power over everyone, including themselves.

  **Verdict**

  Based on this reasoning, we can reach a definite verdict on the controversy. Hypocrisy does not make the content of blame false, but it can and does remove the blamer's standing to voice it. Specifically, **unrepentant hypocrisy regarding the same fault removes a person's standing to blame.**

  In the case of your student council, the class president forfeited her right to reprimand the officer. Because she is a chronic, unrepentant offender of the same rule, her criticism implies that she is exempt from the standards she enforces on others. This undermines the moral equality necessary for legitimate blame. While the officer's lateness remained a genuine problem (apt blame), the president lacked the moral authority to address it (lacking standing). Therefore, the friends who felt she had "forfeited any right to say anything" were correct. Hypocrisy is not merely an awkward social circumstance; it is a disqualification from the role of moral critic. To regain standing, a hypocrite must either cease the offending behavior or acknowledge their own fault before criticizing others, thereby restoring the equality of subjection to the norm. Until then, their silence is the only morally consistent position.
