answer: |-
  You are absolutely right, and your intuition tracks the dominant view in the contemporary metaphysics of dispositions. Your friend is trying to collapse a structural distinction into a mere logical similarity. Yes, both Finks and Masks result in the failure of the Simple Conditional Analysis (SCA)—i.e., you have the disposition, but the conditional "if stimulated, then manifest" is false. But *why* they fail matters metaphysically.

  If you want to win this argument, you need to show that the **machinery required to solve the Fink problem is insufficient to solve the Masking problem.** If they were the same problem, one fix would kill both birds. It doesn't.

  Here is the build-out of the argument for your side, structured so you can deploy it point-by-point.

  ### 1. The Structural Distinction: Basis vs. Process
  The core of your argument is that Finks and Masks interfere with the disposition at different stages of the causal timeline.

  *   **Finks attack the *Causal Basis*:** A finkish disposition is one where the stimulus causes the object to lose the intrinsic property that grounds the disposition *before* the manifestation can occur.
      *   *Example:* The sorcerer glass. The moment it is struck (stimulus), the sorcerer makes it non-fragile (removes the basis).
      *   *Metaphysical status:* At the moment of manifestation, the object **no longer has the disposition.**
  *   **Masks attack the *Causal Process*:** A masked disposition is one where the object retains the intrinsic basis, but an extrinsic factor intervenes between the stimulus and the manifestation.
      *   *Example:* The bubble-wrapped glass. The moment it is struck, it remains fragile (basis intact), but the bubble wrap absorbs the shock (blocks the process).
      *   *Metaphysical status:* At the moment of manifestation, the object **still has the disposition.**

  **The Knockout Punch:** If your friend says they are the same, ask them: *"In the fink case, does the object remain fragile at the moment of impact? In the mask case, does it?"* If they answer honestly, they have to admit the metaphysical state of the object is different in the two scenarios.

  ### 2. The "Lewis Litmus Test"
  This is your strongest logical weapon. David Lewis realized Finks broke the Simple Conditional Analysis. He proposed the **Reformed Conditional Analysis (RCA)** to fix it.

  Lewis's fix was roughly: *An object is disposed to M when S iff it has an intrinsic basis B, such that if it were S, and B persisted, it would M.*

  *   **How RCA solves Finks:** It builds the persistence of the basis into the analysis. It says, "We only care about the conditional if the intrinsic structure stays the same." Since the fink removes the structure, the RCA simply ignores that scenario. Fink problem solved.
  *   **How RCA fails Masks:** In a masking case, the intrinsic basis **does** persist. The glass is still fragile; the poison is still toxic. The "if B persists" clause is satisfied. Yet, the manifestation still doesn't happen (because of the bubble wrap or antidote).

  **The Argument:** If Masks were just a version of Finks, Lewis's fix for Finks should handle Masks. It demonstrably does not. Masking requires a *further* revision (usually a *ceteris paribus* or "no interferers" clause) that is totally unnecessary for Finks. Therefore, they are distinct problems requiring distinct theoretical solutions.

  ### 3. Explanatory Asymmetry
  Dispositions are supposed to explain behavior. If we treat Masks and Finks as the same, we lose explanatory power.

  *   **Fink Explanation:** Why didn't the glass break when struck? Because **it ceased to be fragile.** The explanation appeals to a change in the object's properties.
  *   **Mask Explanation:** Why didn't the glass break when struck? Because **it was fragile, but protected.** The explanation appeals to the interaction between the object's properties and the environment.

  If you conflate them, you can't distinguish between an object that *lost* its power and an object that *exercised* its power but was stopped. This matters for science. If a drug doesn't work, is it because the molecule changed (Fink) or because the patient's metabolism blocked it (Mask)? These are medically distinct situations, even if the outcome (no effect) is the same.

  ### 4. The "Intrinsicness" Criterion
  Finks are almost always **extrinsic** threats to an **intrinsic** basis. However, the way they operate highlights a difference in *location*.

  *   **Finks:** The stimulus triggers an extrinsic mechanism that alters the *intrinsic* nature of the object.
  *   **Masks:** The stimulus triggers the *intrinsic* nature of the object, but an extrinsic mechanism blocks the *output*.

  You can argue that Finks are actually a problem about **identity over time** (does the object remain the same kind of thing?), whereas Masks are a problem about **causal closure** (is the system isolated enough for the cause to produce the effect?). Collapsing them muddies the water between diachronic identity and causal interference.

  ### 5. Summary for Your Friend
  Here is how you can put it to her directly:

  > "Look, I agree that both Finks and Masks break the Simple Conditional Analysis. But saying they are the 'same problem' is like saying a car that won't start because the engine is missing is the same problem as a car that won't start because the brakes are locked.
  >
  > In both cases, the result is 'car doesn't move.' But in the first case (Fink), the causal basis is gone. In the second case (Mask), the causal basis is there but blocked.
  >
  > The proof is in the fix. Lewis fixed Finks by requiring the intrinsic basis to persist. That fix does *nothing* against Masks, because in Mask cases the basis *does* persist. Since the solution to the Fink problem doesn't solve the Mask problem, they can't be the same problem. Masks require us to add a 'no interferers' clause to our theory of dispositions; Finks don't. That makes them categorically distinct."

  ### The Philosophical Backing
  If she pushes back, tell her she's arguing against the standard consensus. While some philosophers (like Sungho Choi) have argued for a unified treatment, the vast majority (Lewis, Johnston, Martin, Bird) treat them as distinct categories of counterexample.
  *   **Finks** challenge the **temporal stability** of the basis.
  *   **Masks** challenge the **sufficiency** of the basis + stimulus.

  You're on solid ground here. The distinction isn't just pedantic; it's about whether the disposition is *present* at the time of testing (Mask) or *absent* at the time of testing (Fink). That is a genuine metaphysical difference.
