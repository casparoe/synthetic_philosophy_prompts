      *   *Verdict:* It's a genuine tension, but perdurantists have answers (conventionalism about identity). However, the user is right to spot that *something* must bind the temporal parts. In ES, it's the database constraint. In metaphysics, it's causal continuity or spatiotemporal continuity.

  6.  **Evaluate Point 4: Does this favor Perdurantism?**
