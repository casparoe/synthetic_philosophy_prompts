      *   *The Map:* The Log *does* look like a 4D worm. The Projection *does* look like a 3D slice.
      *   *The Conflation:* In ES, the "current state" is computationally derivative. In Endurantism, the "present object" is ontologically fundamental.
      *   *Key Insight:* ES is actually compatible with *both* metaphysics. An endurantist can use ES (the log is just a record of the enduring object's history). A perdurantist can use state snapshots (the slice is just a convenient way to talk about the worm at $t$).
