answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Grandad]'s grandson/granddaughter.

  Ninety years is a staggering number. It's hard to wrap your head around. When we look at ninety years, it's tempting to do the math on what's been lost. We think about the speed that slows down, the stairs that get steeper, the evenings that end a little earlier.

  But standing here, looking at this room, I'm reminded that there is a different way to count the years.

  I've been doing some reading lately—much to the annoyance of my friends—about how the ancients viewed aging. There's a famous dialogue by Cicero called *De Senectute*, or "On Old Age." Now, for the family members zoning out: don't worry, I'm not going to give a lecture. But there is one argument in there that I think belongs to the man of the hour.

  Cicero writes that we make a mistake if we measure a life by the same yardstick we use for an athlete. If your value is in your muscles, then yes, age is a thief. It takes everything. But if your value is in your judgment, your memory, and your voice? Then age isn't a thief. It's a compiler.

  He tells a story about Appius Claudius, an old Roman statesman who was blind and frail in his final years. His younger rivals mocked him, asking what use a blind man was to the Republic. And Appius replied that he didn't need to see the battlefield to know where the army should march. He said, "I retain the counsel, the reasoning, and the authority." The physical eyes had gone, but the vision was sharper than ever.

  I look at my grandfather, and I see Appius.

  For sixty years, Grandad was a trial lawyer. And for those of you who know the law, you know that the law doesn't care about your biceps. It cares about your ability to connect dots that everyone else missed. It cares about the weight of your word.

  I know for a fact that there are partners in this room—men and women who have been running their own firms for decades—who still pick up the phone to ask Grandad how to handle a witness, or how to read a judge, or where the body is buried in a contract. They aren't calling him for his stamina. They aren't calling him to run to the courthouse. They are calling him because sixty years of cross-examination has given him a kind of X-ray vision that you can't get from books.

  There was another figure Cicero mentioned, Fabius Maximus. He wasn't the flashiest general. He didn't win by charging the gates. He won by waiting, by thinking, by knowing that patience is a weapon. That sounds a lot like the strategy I've watched Grandad use in depositions. While everyone else is shouting, he's listening. While everyone else is reacting, he's planning.

  Priya—my friend who I was debating this with—thinks this is just "copium." She thinks it's just a story old people tell themselves to feel better about slowing down. But looking at this room, I don't think that's true.

  If this were just about making excuses, the partners in the back wouldn't still be taking his calls. If this were just about coping, his advice wouldn't still be winning cases. The "counsel over muscle" argument only holds up if the counsel is actually good. And Grandad's is.

  So, Grandad, thank you. Thank you for proving that while the body might eventually ask for a rest, the mind doesn't have to clock out. Thank you for showing us that authority isn't about how loud you can shout, but how much truth you can hold in a sentence. And thank you for reminding us that while youth is a gift of nature, age is a work of art.

  We aren't here to celebrate what you can't do anymore. We're here to celebrate what you *still* do better than anyone else in this room.

  Ladies and gentlemen, please raise your glasses. To the man who knows that the pen is still mightier than the sword, and that the best arguments are the ones that wait for the right moment.

  To Grandad. Happy 90th.
