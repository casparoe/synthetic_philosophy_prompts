          *   *MWI (Quantum):* Branches are part of the *same* physical universe (the universal wavefunction). They share a common past (until decoherence). They are spatiotemporally related (in a higher-dimensional Hilbert space sense, though not necessarily in 3D space). They only cover *physically possible* outcomes governed by the Schrödinger equation.

      *   **2. The Scope of Possibility:**
