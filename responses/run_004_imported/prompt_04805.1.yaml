          *   *Lewis:* "Actual" is purely indexical. I am actual to me; a counterpart in another world is actual to them.
          *   *MWI:* "Actual" is often still debated, but generally, all branches exist within the *one* actual universe. The "splitting" happens *inside* reality, not *outside* it.

      *   **4. Motivation/Purpose:**
          *   *Lewis:* Solves problems in semantics and metaphysics (counterfactuals, properties, propositions). It's a tool for analyzing *meaning* and *modality*.
