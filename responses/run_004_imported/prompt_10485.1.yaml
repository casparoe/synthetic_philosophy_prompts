answer: |-
  This is a fantastic observation, and you have hit on one of the most live wires in contemporary moral philosophy. You are absolutely right that the "Longtermist" movement (and Will MacAskill specifically) traces its intellectual lineage directly back to Sidgwick. MacAskill explicitly cites Sidgwick's "point of view of the universe" and his argument against temporal discounting as foundational to *What We Owe the Future*.

  However, your intuition that Sidgwick might pause before signing off on the *extreme* conclusions of modern Longtermism is also very sharp. Sidgwick was a much more cautious, nuanced, and psychologically attuned thinker than the sometimes mathematically aggressive style of modern Effective Altruism (EA) suggests.

  If you plopped Sidgwick down in 2025, here is how he would likely react to the Longtermist argument, broken down into where he would agree and where he might push back.

  ### 1. Where He Would Agree: The Axiological Core
  Sidgwick would unequivocally agree with the **premise**. In *The Methods of Ethics*, he argues that "Hereafter as such is to be regarded neither less nor more than Now."

  To Sidgwick, discounting the future simply because it is the future is irrational prejudice, akin to discounting the suffering of people simply because they live far away geographically. From the "Point of View of the Universe," time is not a morally relevant category.

  So, if a Longtermist said, "Henry, a person living in the 22nd century matters just as much as a person living today," Sidgwick would say, "Precisely. That is the bedrock of rational benevolence." He would reject any ethical system that prioritizes the present generation simply because they are here now.

  ### 2. Where He Might Hesitate: The Epistemic Caveat
  This is the most critical distinction. Sidgwick distinguished between **discounting value** (which he rejected) and **discounting probability** (which he accepted).

  Sidgwick argued that while a future happiness is *equally valuable*, it is often *less certain*. We have less control over the future, and our predictions about it are prone to error. He wrote:

  > "It is evident that the further we look into the future, the more uncertain our forecasts become... this uncertainty is a valid reason for preferring a nearer good to a more distant one, if they are otherwise equal."

  **The Clash with Longtermism:**
  Modern Longtermism often uses an "expected value" calculation: Even if the probability of stopping AI extinction is tiny (say, 0.1%), if the number of future lives saved is trillions, the expected value is still massive.

  Sidgwick might find this epistemically reckless. He was deeply concerned with the limits of human knowledge. He might ask: *Do we actually have the capacity to calculate the probabilities of AI outcomes with enough precision to justify neglecting certain, concrete suffering today?*

  For Sidgwick, the "uncertainty discount" isn't just a minor tweak; it's a major practical constraint. He might argue that prioritizing highly speculative future scenarios over definite present misery violates the prudential requirement to act on reasonable evidence. He might view the confidence some Longtermists have in their models of AI risk as a form of dogmatism, which he generally disliked.

  ### 3. The Psychological and Sociological Constraint
  Sidgwick was not just an abstract theorist; he was deeply concerned with **practical ethics**—what human beings can actually sustain psychologically and socially. He famously worried about the "Dualism of Practical Reason" (the conflict between what is rational for the individual and what is rational for the universe) and the potential for utilitarianism to demand too much, causing moral burnout or social instability.

  If you told Sidgwick, "We should divert resources from malaria nets to AI safety research," he might worry about the **moral sentiment** required to sustain that.

  *   **Empathy requires proximity:** Humans are psychologically wired to care about visible, present suffering. Sidgwick might worry that asking people to ignore visible suffering now for the sake of abstract, invisible people in the future could erode the general habit of benevolence.
  *   **Institutional Trust:** Sidgwick placed a lot of weight on established rules and institutions (Common Sense Morality) because they generally produce good outcomes. A radical shift toward prioritizing the speculative future over the concrete present might undermine public trust in ethical movements.

  ### 4. The "Quality vs. Quantity" Concern
  Sidgwick was a hedonistic utilitarian; he cared about *conscious experience* (happiness/pleasure). Some strains of Longtermism focus heavily on *existence* itself (ensuring there are future people).

  Sidgwick might ask: *Is it enough to just ensure people exist, or must we ensure they have good lives?* If prioritizing AI risk leads to a future where humanity survives but lives in a stagnant, controlled, or low-wellbeing state just to minimize risk, Sidgwick might object. He would want to ensure that the "trillions of future lives" are actually lives worth living, not just mathematical units of existence.

  ### The Verdict: A "Cautious Longtermist"
  If Sidgwick were alive today, he would likely be a **Longtermist in principle, but a skeptic in practice.**

  He would agree that the *logic* of non-discounting is correct. He would agree that existential risk is a major moral category because it cuts off all future value. However, he would likely demand a much higher standard of proof regarding the *probabilities* involved before endorsing the neglect of present-day suffering.

  He might say something like this:
  > "You are right that time does not diminish value. However, distance in time does diminish our knowledge. To sacrifice the certain good of the living for the speculative good of the unborn is only rational if our calculations of that future are robust. I fear you are treating uncertain probabilities as if they were certain mathematics. We must secure the future, yes, but not by extinguishing our moral responsibility to the present."

  ### Why Your Teacher Might Have Glossed Over This
  Teachers often focus on Sidgwick's *axiological* contribution (the theory of value) because it's cleaner to teach. The *epistemic* and *psychological* complications (how we know the future, how humans actually behave) are messier. But your instinct to connect the 19th-century caution with 21st-century ambition is spot on.

  Sidgwick provides the engine for Longtermism (the math of the future), but he also provides the brakes (the uncertainty of prediction). Modern Longtermists have pressed the accelerator; Sidgwick would probably check the brakes first.
