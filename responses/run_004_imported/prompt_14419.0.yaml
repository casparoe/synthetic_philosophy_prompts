prompt: |-
  Okay, this is a bit of a weird ask but bear with me. I'm about a third of the way into a hard sci-fi novel where the crew of a generation ship works out, through a fairly rigorous cosmological argument, that the universe (or multiverse, if you buy the relevant theories) is almost certainly vast enough to contain tons of other civilizations that they can never causally reach or communicate with, but whose choices are nevertheless correlated with theirs in some deep sense. My partner, who did a philosophy MA and wont let me forget it, mentioned this is basically the setup behind something called "evidential cooperation in large worlds" -- I think it grew out of older stuff that used to get called multiverse-wide superrationality. Anyway, a big chunk of my second act hinges on the ship's council arguing over whether to burn a huge chunk of their remaining resources on a project that only makes sense if you take this kind of reasoning seriously, and I'd like the debate to actually hold up rather than just being vague hand-wavy sci-fi philosophy.

  So here's what I actually need: could you walk me through the most important implications of taking evidential cooperation in large worlds seriously, for how an agent (or a whole civilization) should actually prioritize and act, given that they can never get direct confirmation of who else is out there or what those other agents value. I'm especially trying to understand how this is supposed to differ from just "be a good utilitarian and maximize expected value," since thats honestly the only framing I've got right now and I have a feeling it's flattening something important about the argument. It'd also really help to get a sense of the strongest objections to leaning on this kind of reasoning for a civilization-scale decision, since my skeptical characters need real ammunition rather than strawmen the true believers can bat away in one line.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a hard sci-fi novel (1/3 done).
      *   **Plot Point:** A generation ship crew discovers the universe/multiverse is vast, containing correlated but causally disconnected civilizations. They are debating spending resources on a project based on this reasoning.
      *   **Concept:** "Evidential Cooperation in Large Worlds" (ECL) / "Multiverse-wide Superrationality" (MSR).
      *   **Partner's Input:** Partner has a Philosophy MA and identified the concept.
      *   **Needs:**
          1.  Implications of taking ECL seriously for prioritization/action (specifically how it differs from standard utilitarianism).
          2.  Strong objections/criticisms for skeptical characters (no strawmen).
          3.  Tone: Rigorous enough for hard sci-fi/philosophy MA scrutiny, but accessible for narrative integration.

  2.  **Deconstruct the Core Concept (ECL/MSR):**
      *   *What is it?* It's a decision theory framework. It suggests that if there are many agents in the multiverse who reason similarly to you (are "subjunctively dependent" or "logically correlated"), your decision provides *evidence* about their decisions, even without causal contact.
      *   *Key Distinction:* Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT) vs. Functional Decision Theory (FDT). ECL leans heavily on FDT/EDT logic applied to a cosmological scale.
      *   *The "Hook":* If I cooperate, it's likely *other* similar agents cooperate. If I defect, they likely defect. Therefore, I should cooperate to maximize the total good across the correlation class, even if my local causal impact is small.
      *   *Difference from Standard Utilitarianism:* Standard utilitarianism focuses on *causal* impact (what my action *causes*). ECL focuses on *logical* correlation (what my action *implies* about other agents' actions). In a vast universe, the "implied" impact dwarfs the "causal" impact.

  3.  **Address the "Difference from Standard Utilitarianism" Question:**
      *   *Standard Utilitarianism:* "I spend 1 million credits. This saves 100 lives locally. Total good = 100 lives."
      *   *ECL:* "I spend 1 million credits. This signals to $10^{20}$ correlated civilizations that 'agents like us' spend resources on X. If they follow suit, total good = $10^{20} \times$ (their local impact). My local impact is negligible compared to the acausal leverage."
      *   *Prioritization:* Shifts focus from local efficiency to *symbolic/logical* alignment with the "coalition of similar minds." It prioritizes projects that are robustly good across many possible value systems (compromise) rather than maximizing one specific local value.

  4.  **Identify Implications for Action/Prioritization:**
      *   *Compromise Values:* Since you don't know the specific values of the other civilizations, you shouldn't maximize *your* values. You should maximize a *compromise* utility function that most rational agents would agree on (e.g., avoiding suffering, preserving information, increasing complexity).
      *   *Resource Allocation:* Spend resources on things that help *any* advanced civilization (e.g., fundamental physics research, creating Schelling points, reducing existential risk patterns) rather than local comfort.
      *   *The "Trade":* It's like acausal trade. "I will do what you would want me to do, if you do what I would want you to do."

  5.  **Brainstorm Objections (for the Skeptics):**
      *   *The Reference Class Problem:* Who counts as "correlated"? Are aliens running the same decision theory? What if they reason differently? If you define the class too broadly, the correlation breaks. Too narrowly, the impact is small.
      *   *The "Magic" Objection:* It feels like superstition. "How can my choice *make* them choose?" (It doesn't make them, it's evidence of their choice, but decision theory treats it as leverage).
      *   *Pascal's Mugging:* If the universe is infinite, tiny probabilities of huge impacts dominate. This leads to absurd prioritization (ignoring local suffering for speculative multiverse gains).
      *   *Value Drift:* What if the "compromise values" are actually terrible? What if the majority of correlated agents are malicious?
      *   *Opportunity Cost:* The resources are real and local. Spending them on "acausal good" might cause local collapse (ship mutiny, starvation).

  6.  **Structure the Response:**
      *   **Introduction:** Acknowledge the concept (ECL/MSR), validate the partner's insight, and set the stage.
      *   **Core Mechanism:** Briefly explain *why* it works (logical correlation vs. causal influence).
      *   **Implication 1: The Shift from Causal to Acausal Leverage.** (The math of the impact).
      *   **Implication 2: Compromise Utility Functions.** (Crucial for the "what project" debate).
      *   **Implication 3: Prioritizing Robustness over Specificity.** (What kind of project makes sense?).
      *   **Objections (The Skeptic's Toolkit):** Reference class, Pascal's Mugging, Local Reality, Value Lock-in.
      *   **Narrative Application:** Specific ideas for the debate scene/project.

  7.  **Refine the Content (Self-Correction/Nuance Check):**
      *   *Correction:* Make sure not to conflate EDT and FDT too much. ECL is usually associated with FDT (Functional Decision Theory) or a specific application of EDT in a cosmological context. I should keep the terminology accessible but precise.
      *   *Nuance:* Emphasize that this isn't just "be good." It's "be good in a way that *other rational agents would predict you to be good*." It's about predictability and correlation.
      *   *The Project:* What would the project *be*? It can't be "send a message." It has to be something like "build a beacon of mathematical truth" or "preserve a library of values" or "reduce local suffering to signal benevolence." Let's suggest "Value Preservation" or "Schelling Point Creation."
      *   *Tone Check:* Keep it respectful of the Philosophy MA partner's knowledge. Don't dumb it down too much, but explain it clearly for the writer.

  8.  **Drafting the Response:** (Iterative process during drafting)
      *   *Intro:* Confirm the terminology. ECL is the modern term (Owen Cotton-Barratt, Nick Bostrom, etc.).
      *   *Differentiation:* Use the "Voting" analogy. Your vote rarely causally changes an election, but evidentially it correlates with others. In ECL, the "others" are across the multiverse.
      *   *The "Compromise" aspect:* This is the biggest differentiator from standard utilitarianism. Standard utilitarianism maximizes *my* utility function. ECL maximizes a *weighted average* of all correlated agents' utility functions.
      *   *Objections:* Ensure the "Reference Class" objection is prominent. It's the technical weak point.
      *   *Scene Ideas:* Give concrete stakes. Fuel vs. The Project.

  9.  **Final Review:** Does this answer the prompt? Yes. Is it accurate to the philosophy? Yes (based on MIRI/FHI discussions on MSR/ECL). Is it useful for a novel? Yes, provides conflict and stakes.

  **(Self-Correction during drafting):** I need to make sure I don't validate the theory as *true*, but present it as a coherent framework. The skeptics need valid points. The "Pascal's Mugging" angle is particularly strong for a generation ship where resources are finite and survival is precarious.

  10. **Final Polish:** Check formatting for readability. (Bold key terms, bullet points for objections).

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  This is a fantastic premise. Your partner is spot-on: the concept is **Evidential Cooperation in Large Worlds (ECL)**, often discussed in conjunction with **Multiverse-wide Superrationality (MSR)**. It stems from decision theory (specifically Functional Decision Theory and Evidential Decision Theory) applied to cosmology.

  The reason this feels different from standard utilitarianism is that standard utilitarianism is usually grounded in **Causal Decision Theory (CDT)**. CDT asks: *"What physical changes will my action cause?"* ECL asks: *"What does my action imply about the decisions of other agents who reason like me?"*

  In a vast or infinite universe, the "implied" impact dwarfs the "causal" impact. Here is a breakdown of how to dramatize this distinction, the implications for the crew's priorities, and the ammunition your skeptical characters need.

  ---

  ### 1. The Core Distinction: Causal vs. Acausal Leverage

  To write the debate convincingly, you need to distinguish between **local impact** and **acausal leverage**.

  *   **Standard Utilitarianism (The Skeptic's View):**
      *   *Logic:* "We have 1,000 units of fuel. If we burn them to fix the hydroponics, 5,000 crew members survive. If we burn them on the 'Signal Project,' 0 crew members benefit locally. The choice is obvious."
      *   *Focus:* Causal chains. Action $\rightarrow$ Local Result.
  *   **ECL / MSR (The Proponent's View):**
      *   *Logic:* "There are $10^{20}$ civilizations like ours. We cannot talk to them. However, if we are rational agents facing similar problems, our decisions are **logically correlated**. If we choose to cooperate/sacrifice for the greater good, it is *evidence* that they will too. By burning the fuel on the Signal Project, we aren't helping anyone locally; we are 'unlocking' cooperative behavior across the multiverse. The sum total of good across those $10^{20}$ civilizations outweighs our local 5,000 lives."
      *   *Focus:* Logical correlation. Decision Algorithm $\rightarrow$ Correlated Decisions Everywhere.

  **Narrative Hook:** The proponent isn't arguing that their project helps *them*. They are arguing that their project helps *everyone*, and their civilization is merely the "key" that turns the lock.

  ### 2. Implications for Prioritization (What is the Project?)

  If the crew takes ECL seriously, their priorities shift in three specific ways that differ from standard altruism. This gives you concrete details for the "Project" they are arguing over.

  #### A. The Compromise Utility Function
  Standard utilitarianism maximizes *your* values. ECL maximizes a **compromise** between you and your correlated peers.
  *   **Why?** You don't know what the other civilizations value. They might value art, computation, or biological diversity. If you maximize *your* specific value (e.g., "maximize human happiness"), you might be working against *their* values.
  *   **The Project:** The ship shouldn't build a monument to Humanity. They should build something **value-agnostic** that almost any rational civilization would appreciate.
      *   *Idea:* A "Library of Schelling Points." Encoding mathematical truths, game-theoretic solutions, or neutral data that helps *any* civilization solve coordination problems.
      *   *Idea:* Suffering Reduction. Almost no value system values "unnecessary suffering." A project dedicated to minimizing local suffering signals to the multiverse that "agents like us" are benevolent, encouraging other agents to be benevolent.

  #### B. Robustness Over Efficiency
  In standard utilitarianism, you want the most efficient path to *your* goal. In ECL, you want the most **predictable** path to a **shared** goal.
  *   **The Project:** It shouldn't be risky. It needs to be something that *any* rational agent would recognize as "cooperative."
  *   **Narrative Conflict:** The skeptics want to spend resources on high-risk/high-reward local survival tech. The ECL proponents want to spend resources on a "boring," guaranteed project that signals stability and rationality to the cosmos.

  #### C. Information Preservation
  If the universe is vast, the most valuable commodity is information that survives entropy.
  *   **The Project:** Encoding the ship's history, values, and scientific data into a medium that lasts billions of years (e.g., etching data into stable isotopes), not to be found by neighbors, but to increase the total "knowledge density" of the multiverse. The logic: "If we preserve knowledge, it is likely others do too. Total knowledge increases."

  ### 3. Objections for the Skeptics (No Strawmen)

  Your skeptical characters need arguments that would hold up in a philosophy seminar, not just practical "we need fuel" complaints. Here are the four strongest philosophical objections to ECL.

  #### A. The Reference Class Problem (The Strongest Technical Objection)
  *   **The Argument:** ECL only works if the other agents are running the *same decision algorithm* as you. How do you know who is in your "reference class"?
  *   **The Skeptic's Line:** "You're assuming the aliens think like us. What if they run Causal Decision Theory? What if they're religious? What if they're paperclip maximizers? If we sacrifice our fuel, and they *don't* correlate because their logic is different, we've just committed suicide for nothing. We are betting the ship on an unproven assumption about alien psychology."
  *   **Why it works:** It attacks the premise of correlation. If the correlation coefficient is even slightly lower than the proponents claim, the math falls apart.

  #### B. Pascal's Mugging / Infinity Dominance
  *   **The Argument:** In an infinite universe, tiny probabilities of infinite impact dominate all local concerns. This leads to absurdity.
  *   **The Skeptic's Line:** "If we follow this logic, we should ignore *all* local suffering. Why fix the water recycler? Why treat the sick? Any local good is dwarfed by the multiverse. This reasoning demands we become martyrs for a cause we can't measure. It's not rationality; it's a secular religion that demands human sacrifice."
  *   **Why it works:** It highlights the dehumanizing cost of the theory. It forces the proponent to explain why they aren't ignoring *everything* local.

  #### C. The "Unilateralist's Curse"
  *   **The Argument:** If a project is dangerous, it only takes one actor to ruin it. In ECL, you are acting on behalf of a coalition that hasn't consented.
  *   **The Skeptic's Line:** "You are signing a contract on behalf of $10^{20}$ civilizations without their consent. What if the 'compromise value' we choose is actually harmful to 90% of them? We are imposing our guess of their values on the multiverse. That's not cooperation; that's imperialism."

  #### D. Decision Instability
  *   **The Argument:** If you believe ECL, you might be vulnerable to manipulation by hypothetical agents.
  *   **The Skeptic's Line:** "If we announce we are ECL agents, we signal that we can be blackmailed by hypothetical scenarios. Any hostile civilization that models us will know we will sacrifice our own survival to satisfy a multiverse equilibrium. We are making ourselves prey."

  ### 4. Scene Integration: Making the Debate Pop

  To make this dramatic, ground the abstract philosophy in the physical reality of the ship.

  *   **The Resource:** Don't just make it "credits." Make it **Deuterium** or **Antimatter** needed for the next braking maneuver. The choice is literally "Slow down at the target star" vs. "Power the ECL Project."
  *   **The Proponent's Visual:** They shouldn't look like zealots. They should look like cold calculators. They have spreadsheets showing the "Expected Multiverse Value" (EMV) vs. "Local Expected Value" (LEV). The EMV number should be so comically large it makes the LEV look like zero.
  *   **The Skeptic's Visual:** They should be the ones holding the crying baby, or fixing the leaking pipe. They represent the **Causal** reality. "I can hold this child. I cannot hold the multiverse."
  *   **The Compromise:** The climax of the debate shouldn't be one side winning. It should be a realization of the **Reference Class** risk.
      *   *Idea:* They decide to run a simulation. They create AI agents with varying decision theories to see if "cooperation" actually emerges. The results are ambiguous. The Council has to vote on whether to trust the simulation or their eyes.

  ### 5. Summary for Your Notes

  | Feature | Standard Utilitarianism (Skeptics) | ECL / MSR (Proponents) |
  | :--- | :--- | :--- |
  | **Decision Theory** | Causal (CDT) | Evidential / Functional (EDT/FDT) |
  | **Impact Scope** | Light-cone (Causal reach) | Multiverse (Logical correlation) |
  | **Goal** | Maximize Local Value | Maximize Compromise Value |
  | **Risk** | Local Failure | Reference Class Mismatch |
  | **Motive** | "Help those we can reach." | "Signal to those who reason like us." |
  | **Weakness** | Ignores vast potential good. | Ignores immediate survival needs. |

  **One final tip for the "Hard Sci-Fi" feel:**
  Have the characters reference the **decision algorithm** itself. The proponents shouldn't say "I feel we should do this." They should say, "Our decision function $D$ outputs 'Cooperate'. Given the prevalence of $D$ in the set of viable civilizations $C$, the expected utility is $\sum (U_c \times P(correlation))$."

  This creates a nice texture where the characters are trying to remove their humanity from the equation to make the "right" choice, which creates inherent drama against the crew who just want to survive.
