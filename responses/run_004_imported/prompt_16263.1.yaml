answer: |-
  The machine didn't look like a doorway. It looked like a mirror that had forgotten how to reflect.

  Elias sat in the darkened control room, the hum of the resonance coil vibrating in his teeth. On the screen, the image stabilized. It was a kitchen. Sunlight, real and golden, poured over a checkered tablecloth. A boy was sitting there, eating cereal. He was sixteen. He had the same cowlick on the left side of his head. The same small scar on his chin from when he'd fallen off a bike at age seven.

  Elias's breath hitched. That scar. *He* had bandaged that cut. Or had he?

  In this room, in this world, Elias had worked late that Tuesday. He had taken the client call. He had been the one to find the bike on the lawn and the helmet in the gutter. He had been the one to sign the paper at the hospital that meant there would be no more Tuesdays.

  But on the screen, the kitchen door opened. A man walked in. He wore a blue flannel shirt. He had Elias's face, but the skin was tanner, the eyes less sunken. He put a hand on the boy's shoulder. The boy leaned into the touch, instinctive and unafraid.

  "He's alive," Elias whispered. The words felt holy.

  Dr. Aris stood in the shadows behind him, clipboard in hand. "The resonance is stable. World 89-Delta. Divergence point approximately ten years ago."

  "Ten years," Elias said. "That's when... that's the accident."

  "Correct. In that timeline, you left work on time. You were in the car. You saw the other vehicle."

  Elias reached out, his fingers hovering inches from the screen. He wanted to press them against the image of the boy. Toby. His Toby. "I need to go there."

  "We've discussed this, Elias. The physics don't allow transport. Only observation."

  "Then let me send a signal. A text. A coordinate. Anything."

  Aris stepped forward, her voice soft but firm. "If you send a signal, you aren't contacting your son. You're contacting a stranger who shares your genetic code."

  "He has my scar," Elias snapped. "He has my laugh. Look at him." He pointed as the boy on screen laughed at something the father said. It was the same crooked grin. "That is Toby. I know my own son."

  "Do you?" Aris asked. "Or do you know the *pattern* of your son?"

  Elias turned to her, anger flaring hot and defensive. "What does that mean? You think this is just a simulation? A fancy movie?"

  "I think," Aris said, tapping her clipboard, "that in World 89-Delta, *that* man raised him. *That* man taught him to tie his shoes. *That* man held him when his mother left last year."

  Elias froze. "She left?"

  "In that world, yes. In this world, she stayed. She died three years ago." Aris's eyes were pitying. "You want to claim that boy because he's alive. But to claim him is to erase the father who saved him. If you intervene, if you assert ownership, you turn that man into a ghost in his own house."

  Elias looked back at the screen. The father in the blue flannel shirt was drying a dish. He looked tired, but content. He looked like a man who had carried a heavy weight and put it down.

  "It feels like him," Elias said, his voice cracking. "When I look at Toby, I feel... I feel the love. It's in my chest. It's not a simulation. If I feel it, how can it be a lie?"

  "Because love isn't just a feeling, Elias. It's a history." Aris moved to stand beside him. "David Lewis would say you're looking at a counterpart. A distinct individual who resembles your son. Kripke would say you're looking at your son in a different state of affairs. But the machine doesn't care about philosophy. It cares about causality."

  On the screen, the boy stood up. He grabbed his backpack. "I'm gonna be late, Dad."

  "Drive safe," the Other Elias said. He didn't worry. He trusted him.

  In this world, Toby never drove. Toby was in a box in the ground.

  Elias watched the door close. The kitchen was quiet. The Other Elias stood there for a moment, staring at the closed door, a small smile on his face. He took a sip of coffee.

  Elias felt a surge of vicarious relief so potent it made his knees weak. *He's safe. I did it. I fixed it.*

  Then the coldness crept in.

  *Did I?*

  If that man on the screen turned around right now and saw Elias, he wouldn't see a savior. He would see an intruder. If Elias claimed that joy, if he let himself believe that *he* was the one who saved Toby, he was stealing the life of the man in the blue flannel shirt.

  That man had earned the right to dry that dish. That man had earned the right to worry about the driving. Elias had earned the right to the grief.

  "It's not me," Elias whispered.

  "The resonance suggests a high degree of similarity," Aris said.

  "No." Elias stood up. His hands were shaking. "I mean... it's not *me* in there. That's not my life. It's his."

  "You could keep watching," Aris said. "We can track his graduation. His marriage."

  Elias looked at the boy's empty chair. He thought about the Humphrey case he'd read about in the old philosophy texts Aris kept in the breakroom. *Why should Humphrey care if a counterpart wins?* Because it feels like a theft. But also, because it's a lie.

  If Elias celebrated that boy's graduation, who was he celebrating? A version of himself that didn't exist? A version of his son that didn't know him?

  If he accepted that the boy was a stranger, the pain returned, sharp and absolute. Toby was dead. The sun on that kitchen table was not his sun.

  If he accepted that the boy was *his*, the guilt arrived, heavier. He would be a parasite feeding on another man's fatherhood.

  "Elias?"

  "Turn it off," Elias said.

  "We haven't finished the data run."

  "Turn it off."

  Aris hesitated, then reached for the console. The hum died. The screen went black, reflecting only Elias's face. Pale. Grief-stricken. Alone.

  He stared at his own reflection. For a second, he wondered if there was a world where he was the one in the blue flannel shirt. A world where he had left work on time.

  But he wasn't there. He was here.

  "He has my eyes," Elias said to the dark room.

  "Yes," Aris said.

  "But he doesn't know my name."

  "No."

  Elias picked up his coat. He had to go home. He had to walk into the house where his wife was waiting, where the bike still leaned against the garage wall, rusting. He had to live the life he had actually made, not the one he was watching through the glass.

  "Delete the files," Elias said at the door.

  "Elias, this is a breakthrough. The evidence of divergent causal chains—"

  "Delete them," he said. "If I keep them... I'll start thinking I have a claim on them. I'll start thinking I'm owed that happiness."

  He opened the door. The hallway light was fluorescent, buzzing like the machine.

  "I'm not Humphrey," Elias said, mostly to himself. "I can't vote for a stranger and call it my victory."

  He walked out into the hall, leaving the dark room and the black mirror behind him. He didn't look back. He couldn't afford to wonder if, in the dark, the screen flickered back to life, showing a man in a blue shirt wondering why the air suddenly felt so cold.
