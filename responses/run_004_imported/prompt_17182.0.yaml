      *   *Comparison:* 5-4 private split implies 9 independent signals. 9-0 public unanimity might imply only 2 or 3 independent signals (the seniors) + 6 followers.
      *   *Conclusion:* The colleagues commit the error of assuming *procedural fairness* (freedom to speak) guarantees *epistemic independence*.

  6.  **Refining the Argument (Self-Correction/Nuance):**
