      *   *Nuance:* Is a 5-4 split *better*? Not necessarily "better" in terms of outcome, but it carries more *evidential weight* regarding the reliability of the process. A 5-4 split shows genuine division of independent judgment. A coerced 9-0 hides uncertainty.
      *   *Terminology:* Use terms like "Epistemic Independence," "Correlated Error," "Signaling."

  7.  **Structuring the Response:**
