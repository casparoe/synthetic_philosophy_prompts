answer: |-
  Yes, your suspicion is entirely warranted. In fact, from the perspective of social epistemology and statistical decision theory, your intuition is more robust than your colleagues' celebration of unanimity.

  Your colleagues are committing a specific epistemic error: they are conflating **procedural liberty** (the freedom to speak) with **judgmental independence** (the statistical independence of votes).

  Here is a breakdown of why your 5-4 private splits likely carried more evidential weight than your 9-0 public consensus, and where your colleagues' reasoning fails.

  ### 1. The Violation of the Independence Condition
  The gold standard for evaluating group decision-making is **Condorcet's Jury Theorem**. The theorem states that if each member of a group has a better-than-random chance ($p > 0.5$) of identifying the correct option, and if they vote **independently**, the probability that the majority is correct approaches 1 as the group size increases.

  However, the theorem relies on a crucial ceteris paribus condition: **independence**.
  *   **Old Procedure:** Private ballots ensure independence. Member A's vote is not causally influenced by Member B's vote. A 5-4 split represents nine independent data points.
  *   **New Procedure:** Public declarations in order of seniority introduce **correlation**. Once the senior members speak, their preferences become "public signals." Junior members are no longer voting solely on their private assessment of the candidates; they are voting on their private assessment *plus* the public signal of their seniors.

  If the junior members adjust their views to align with the seniors (whether due to deference, doubt, or social pressure), their votes cease to be independent samples. Statistically, nine correlated votes may contain less information than five independent votes. You effectively have a sample size of two or three (the seniors) masquerading as a sample size of nine.

  ### 2. Information Cascades
  Your description fits the model of an **information cascade**. This occurs when individuals, acting rationally, ignore their own private information to follow the public actions of those who acted before them.

  Imagine a junior committee member who privately prefers Candidate X. However, the two most senior colleagues have just passionately argued for Candidate Y. The junior member now faces a dilemma:
  1.  Trust their own judgment (which might be wrong).
  2.  Trust the seniors (who might have more experience or hidden information).

  Even if the junior member trusts their own eyes, the *social cost* of contradicting a senior colleague in a public forum is high. In a private ballot, that cost is zero. By moving to a public procedure, the chair introduced a "tax" on dissent. When the cost of dissent rises, the expression of dissent falls, regardless of the underlying truth. The resulting unanimity is not necessarily a convergence on truth, but a convergence on the path of least resistance.

  ### 3. The Colleagues' Fallacy: Unanimity $\neq$ Consensus
  Your colleagues argue: *"Anyone who disagreed was free to say so."*
  This reasoning fails because it assumes that **freedom from prohibition** is the same as **freedom from pressure**.

  In epistemology, we distinguish between:
  *   **Negative Liberty:** No one will stop you from voting no.
  *   **Positive Epistemic Agency:** You feel psychologically safe and structurally empowered to vote according to your private evidence.

  The new procedure preserved negative liberty but destroyed positive epistemic agency. The colleagues are interpreting the *outcome* (unanimity) as evidence of the *process quality*. They reason: "If the process were flawed, someone would have objected." This is a form of confirmation bias. They assume the silence of the juniors indicates agreement, whereas it likely indicates **preference falsification** (a term coined by economist Timur Kuran).

  ### 4. The Evidential Value of the 5-4 Split
  You suspect the old 5-4 splits carried more weight. Here is why:
  *   **Error Correction:** A 5-4 split reveals that the evidence is ambiguous. It forces the department to acknowledge uncertainty. A 9-0 verdict creates a false sense of certainty.
  *   **Diversity of Heuristics:** In a private vote, the five voters in the majority may have arrived at their conclusion for five different reasons. In the public discussion, the six who fell in line likely adopted the *reasoning* of the senior speakers. If the seniors' reasoning contains a blind spot, the whole group now shares that blind spot.
  *   **Correlated Error:** If the senior members are biased (e.g., they prefer a specific sub-field or methodology), the private vote might have diluted that bias. The public procedure amplifies it. If the seniors are wrong, the whole committee is now wrong together.

  ### Conclusion
  Your colleagues are treating the committee vote as a **deliberative body** (where discussion improves truth-tracking) while ignoring that the structure turned it into a **hierarchical signaling game**.

  Discussion *can* improve decision-making, but only if private judgments are aggregated *after* discussion, or if discussion is structured to prevent early anchoring (e.g., by having the most junior members speak first, or by casting private ballots before any talk begins).

  Your suspicion is correct: A unanimous verdict reached through hierarchical public declaration is epistemically weaker than a narrow majority reached through private, independent voting. The 9-0 vote tells you less about the candidates and more about the social dynamics of your department. You have traded **aggregate wisdom** for **social cohesion**.

  **Recommendation:** If you wish to retain the benefits of discussion without sacrificing independence, propose a hybrid model: **Private vote first, discussion second, final vote third.** This ensures the initial signal is clean, allows discussion to correct errors, and lets the final vote reflect any genuine change of mind.
