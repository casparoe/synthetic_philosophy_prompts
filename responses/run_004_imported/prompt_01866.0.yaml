answer: |-
  This is a fantastic find. You have stumbled onto one of the most significant unpublished manuscripts in the history of sexual ethics. Louis Crompton published this text in 1975 (*Journal of Homosexuality*), and it shocked a lot of scholars because, as you noted, Bentham is applying the cold, hard calculus of utilitarianism to a subject everyone else was treating as a divine sin.

  You are reading this correctly: Bentham is trying to diagnose *why* society hates homosexuality, and he concludes it isn't because of harm (pain), but because of a psychological aversion to pleasure itself.

  Here is the breakdown of what he is doing, sentence by sentence, followed by answers to your specific questions about "philosophical pride" and the logical test.

  ### Sentence-by-Sentence Walkthrough

  **1. "Philosophical pride, to say nothing at present of superstition, has hitherto employed itself with effect in setting people a-quarrelling with whatever is pleasurable even to themselves, and envy will always be disposing them to quarrel with what appears to be pleasurable to others."**

  *   **Translation:** There are two main psychological engines driving this hatred. First, "philosophical pride" makes people hate their *own* pleasure (thinking self-denial makes them superior). Second, "envy" makes people hate *other people's* pleasure. He is explicitly putting "superstition" (religion) aside for this specific paragraph to focus on secular psychological motives.
  *   **The Move:** He is categorizing the opposition. He's saying, "Let's assume there is no God and no sin. People would still hate this act because of pride and envy."

  **2. "In the notions of a certain class of moralists we ought, not for any reason they are disposed to give for it, but merely because we ought, to set ourselves against every thing that recommends itself to us under the form of pleasure."**

  *   **Translation:** There is a group of moralists (ascetics) who believe pleasure is inherently suspect. They don't argue that a specific pleasure causes harm; they argue that *pleasure itself* is the enemy. Their logic is circular: "You shouldn't do it because it's wrong," where "wrong" just means "pleasurable."
  *   **The Move:** He is defining his opponent. He is describing what he elsewhere calls the **"Principle of Asceticism."** This is the opposite of the Principle of Utility. The Utilitarian says "Maximize pleasure." The Ascetic says "Minimize pleasure."

  **3. "Objects, it is true, the nature of which it is to afford us the highest pleasures we are susceptible of are apt in certain circumstances to occasion us still greater pains."**

  *   **Translation:** Bentham pauses to be fair. He admits: "Okay, sure. Sometimes things that feel good *can* hurt you later." (e.g., drinking alcohol gives pleasure but can cause sickness or addiction).
  *   **The Move:** This is "steel-manning." He is conceding the only valid argument a moralist *could* make. He is saying, "I am not a hedonistic fool; I know pleasure can lead to pain."

  **4. "But that is not the grievance: for if it were, the censure which is bestowed on the use of any such object would be proportioned to the probability that could be shewn in each case of its producing such greater pains."**

  *   **Translation:** "But that isn't actually why they are angry. If they *really* cared about the pain/harm, their anger would match the risk. If an act has a 1% chance of causing harm, they should criticize it a little. If it has a 90% chance, they should criticize it a lot."
  *   **The Move:** **This is the logical test you asked about.** It is the core of the Utilitarian calculus. Bentham is demanding empirical consistency.

  **5. "But that is not the case: it is not the pain that angers them but the pleasure."**

  *   **Translation:** "But moralists don't do that. They hate low-risk pleasures just as much as high-risk ones. Therefore, their anger isn't about pain/harm. It's about the fact that it feels good."
  *   **The Move:** The conclusion. Since the moralists fail the consistency test in sentence 4, their stated motive (preventing harm) is false. Their real motive is anti-hedonism (hating pleasure).

  ***

  ### Addressing Your Specific Questions

  #### 1. Is the "proportioned to the probability" bit a logical test or just rhetoric?

  It is a **genuine logical test**, and it is the heavy lifter of the entire paragraph.

  For Bentham, morality *is* mathematics. If you claim your moral system is based on preventing suffering (pain), then your condemnation of an act must correlate mathematically to the amount of suffering that act produces.

  *   **The Utilitarian Standard:** If Act A (e.g., consensual gay sex) produces 5 units of pleasure and 0 units of pain to others, and Act B (e.g., assault) produces 0 units of pleasure and 100 units of pain to others, a consistent moralist must condemn B roughly 20 times more harshly than A.
  *   **The Observation:** Bentham observes that society condemns A just as harshly (or harsher) than B, despite the lack of "pain" (harm) in A.
  *   **The Verdict:** Because the "censure" (moral blame) is not "proportioned to the probability" of harm, the moralists are being logically inconsistent. They claim to be protecting society from pain, but their behavior proves they are attacking pleasure.

  It is not just a rhetorical dig; it is an application of the **Felicific Calculus**. He is catching them in a data error.

  #### 2. What does "Philosophical Pride" mean here? Is it different from "Superstition"?

  Yes, Bentham intends them to be distinct, though they often overlap in practice.

  *   **Superstition:** This refers to **religious dogma**. It is the fear of divine punishment, sin, or violating God's law. Bentham says "to say nothing at present of superstition" because he wants to show that *even if you remove religion*, people still hate homosexuality.
  *   **Philosophical Pride:** This refers to **secular asceticism**. This is the belief that self-denial is inherently virtuous. It is the pride of the Stoic or the Puritan who believes that enduring hardship makes them a "better" person than someone who enjoys life.
      *   In Bentham's *Introduction to the Principles of Morals and Legislation*, he calls this the **"Principle of Asceticism."**
      *   "Philosophical Pride" is the psychological ego behind it. It is the moralist looking down on the pleasure-seeker and thinking, *"I am superior to you because I deny myself things you enjoy."*

  Bentham is arguing that the hatred of homosexuality isn't just about "God says no." It's also about secular moralists who are psychologically invested in the idea that pleasure is suspicious and suffering is noble. They are "quarrelling with whatever is pleasurable even to themselves" because denying themselves pleasure feeds their ego (their pride).

  #### 3. What is the specific argumentative move he is pulling off?

  He is performing a **Motivation Analysis via Inconsistency Exposure.**

  1.  **The Opponent's Claim:** "We punish this act because it is harmful/wrong."
  2.  **Bentham's Test:** "If it were about harm, your punishment would scale with the harm."
  3.  **The Evidence:** "Your punishment does *not* scale with the harm (since there is little to no harm, yet the punishment is severe)."
  4.  **The Conclusion:** "Therefore, your claim is false. You are not punishing harm. You are punishing pleasure."

  By proving that the motive is **anti-hedonism** rather than **harm-prevention**, he undermines the legitimacy of the law. In Bentham's framework, the only valid reason for the law to interfere with liberty is to prevent harm to others (the "mischief"). If the motive is just "we don't like that they are having fun," the law has no utilitarian justification.

  ### Summary
  You are reading this exactly right. Bentham is using the "numbers" of utilitarianism to show that the moralists are faking their math. They say they are subtracting Pain, but they are actually subtracting Pleasure. "Philosophical Pride" is the secular ego-trip of self-denial, distinct from religious "Superstition," and the "proportionality" line is the rigorous logical standard he uses to prove they are lying (perhaps even to themselves) about why they want to punish people.

  It is a remarkably modern argument, which is exactly why he knew he couldn't publish it in 1785. He wasn't just ahead of his time; he was centuries ahead of it.
