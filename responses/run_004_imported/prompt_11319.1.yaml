prompt: |-
  Okay, this is going to sound petty but bear with me because it's what sent me down this rabbit hole. I got my Reddit account temporarily suspended last week for "violating community guidelines," except the appeal process wouldn't tell me which post or which specific rule, the guideline they eventually cited has apparently been edited since I made the post in question, and a bunch of other accounts are doing the literal same thing every day with zero consequences. I was complaining about this to my housemate, who's a 2nd-year law student, and she said it's basically a real-world illustration of Lon Fuller's "inner morality of law" — his idea that for a system of rules to count as law at all (rather than just arbitrary orders backed by power) it has to satisfy a bunch of formal conditions: rules need to be public, clear, prospective (not retroactive), non-contradictory, possible to actually comply with, stable over time, general rather than one-off, and consistently enforced as written. She also mentioned that this whole list is at the center of Fuller's actual famous debate with H.L.A. Hart — the Nazi "grudge informer" cases, Radbruch's formula, all of it — about whether a system that fails badly enough at that stuff stops being "law" (Fuller's side), or whether that's confused, and you can have perfectly valid law that's just deeply unjust or badly made (Hart's side).

  I've now spent way too many evenings reading about this, and I think I get general shape of the disagreement, but here's where I'm stuck: those eight conditions don't feel equally important to me. Some feel like they'd genuinely make me doubt something even is "law" if violated badly enough (e.g., if the rule-enforcers just never actually apply their own stated rules, is it even a rule anymore, or just a mood?), while others feel more like they'd just make for shoddy or unjust law, without threatening it's status as law at all (a needlessly convoluted rule still seems like law, just bad law). So here's my ask: rank Fuller's eight desiderata — generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy through time, and congruence between rules and official action (correct me if I've mangled that list) — from "violating this most threatens a system's claim to count as law at all" down to "violating this just makes for worse law, without threatening its status as law." Then tell me where in that ranking you'd draw Fuller's line: after which principle does a bad-enough violation tip something from "flawed law" into "not really law"? Or, if you think that's not a principled question in the first place, say so plainly instead of picking a cutoff just because I asked for one.

  Can you give me the ranking plus cutoff as a JSON object, formatted like this:
  ```json
  {
    "ranking": ["<most threatening to violate>", "...", "<least threatening to violate>"],
    "cutoff_after_rank": <integer from 1-7, or null if no cutoff is principled>,
    "cutoff_reasoning": "<2-3 sentences>"
  }
  ```
  and then add a short paragraph underneath walking through the two or three calls in your ranking that were genuinely hard to make, and why you resolved them that way.
