  2.  **Deconstruct the Lucas–Penrose Argument & Common Objections:**
      *   *The Argument:* Humans can see the truth of $G(F)$ which $F$ cannot prove. Therefore, Human $\neq F$.
      *   *Objection 1 (Consistency):* Gödel's theorem applies only to *consistent* systems. If the human mind is inconsistent, the argument fails. Can we prove the mind is consistent?
      *   *Objection 2 (Complexity/Self-Knowledge):* To construct $G(F)$, you need to know $F$ precisely. Do we have access to the algorithm of our own minds? If the mind is too complex to know its own code, can it construct $G$?
      *   *Objection 3 (The "Unknowable Truth" Objection):* Maybe we see $G(F)$ is true *conditional* on $F$ being consistent. Do we know $F$ is consistent?
      *   *Objection 4 (Penrose's Physics):* Lucas stops at "not algorithmic." Penrose goes further to "quantum gravity in microtubules." Is the extra step necessary?
