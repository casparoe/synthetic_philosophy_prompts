answer: |-
  This is a remarkably sharp exchange for a student seminar. Marcus and Sana have effectively recreated a decades-long debate in meta-ethics between "Reliance/Expectation" theories (Scanlon, Shiffrin) and "Normative Power/Will" theories (Raz, Owens). The "Grandfather Case" is a classic stress test for these views, often called the "Death of the Promisee" objection.

  Here is the move-by-move breakdown, followed by an assessment of the theories and the necessary "third ingredient."

  ### Move-by-Move Analysis

  **(1) Sana: The Scanlonian Opening**
  *   **Claim:** Promises bind because they create reliance/expectation; breaking them exploits trust.
  *   **Assessment:** **Sana has the better of it initially.** This is the standard, most intuitive reading of Scanlon's Principle of Fidelity. It explains the *social function* of promising. She correctly identifies that the moral weight comes from the interpersonal dynamic Marcus initiated.
  *   **Weakness:** It assumes the "harm" is located in the promisee's psychological state (disappointment), which becomes problematic when that state ceases to exist.

  **(2) Marcus: The Metaphysical Objection**
  *   **Claim:** The grandfather is dead; no mental states exist; therefore, no expectation exists to violate. Yet the obligation remains.
  *   **Assessment:** **Marcus wins this round.** This is the strongest philosophical objection to pure Reliance theories. If the obligation is constituted *by* the expectation, the destruction of the expectation should destroy the obligation. Marcus correctly identifies that our intuition (that he is still bound) outruns the theory's explanation.

  **(3) Sana: The Posthumous Wrong Analogy**
  *   **Claim:** Expectations at the *time of promising* are sufficient. Analogy: Defaming the dead is wrong even if they can't feel it.
  *   **Assessment:** **Sana recovers ground.** This is the standard counter-move in the literature. It shifts the focus from *harming* (causing pain) to *wronging* (violating a status). If we accept that the dead can be wronged (a widely held moral intuition), Scanlon's view can survive.
  *   **Weakness:** It requires stretching the definition of "expectation" from a psychological state to a normative status, which invites Marcus's next critique.

  **(4) Marcus: The Theoretical Diagnosis**
  *   **Claim:** Sana's move abandons Expectation Theory for Normative Power Theory (Willing an obligation into existence).
  *   **Assessment:** **Marcus wins on theoretical consistency.** He is channeling David Owens here. If the obligation persists after the psychological expectation is gone, the *ground* of the obligation cannot be the psychology; it must be the *act* of promising itself. Marcus correctly spots that Sana is smuggling a Will Theory into a Reliance framework to save it.

  **(5) Sana: The Boundary Constraint**
  *   **Claim:** Pure Will Theory fails to explain why jokes or coerced promises don't bind. Expectation/Reliance explains this (no reasonable reliance was induced).
  *   **Assessment:** **Sana lands the heavier punch.** This is the Achilles' heel of pure Will theories (Raz, etc.). If promising is just "willing an obligation," why can't I promise to fly to the moon? Why doesn't a sarcastic "I promise" bind me? Sana is right that Expectation/Context provides the necessary *felicity conditions* for the promise to be valid. Marcus concedes this because he has no good answer within a pure Will framework.

  **(6) Marcus: The Standoff**
  *   **Claim:** Regardless of boundaries, expectation cannot be the *fundamental* source if the obligation survives the expectation's destruction.
  *   **Assessment:** **Stalemate.** Marcus holds the line on the *persistence* of the duty; Sana holds the line on the *conditions* of the duty. Neither yields, because both are describing necessary but insufficient conditions.

  ### Do Any Theories Survive?

  **Hume (Artificial Virtue):** **No.**
  Hume views promising as a social convention designed to facilitate cooperation and commerce. A secret, deathbed promise with no social enforcement mechanism and no utility to the "public" would likely be meaningless to Hume. He would probably tell Marcus he is not bound, as the "ceremony" of the promise lacks the social context that gives it magic.

  **Scanlon (Pure Expectation/Reliance):** **Barely.**
  Scanlon's theory survives only if we accept Sana's Move (3): that we can "wrong" someone without "harming" them. However, as Marcus notes in (4), this requires redefining the "wrong" not as the disappointment itself, but as the violation of the *assurance* given. This pushes Scanlon dangerously close to the Will Theory he sought to replace.

  **Normative Power/Will (Raz/Owens):** **Partially.**
  This theory handles the "Death of the Promisee" perfectly (Move 2 & 4). The obligation is created by the act and persists like a debt. However, as Sana notes in (5), it fails to explain the *limits* of promising (jokes, coercion, impossibility). A pure Will theory makes the promisor too sovereign.

  ### The Third Ingredient

  Neither a pure Expectation view nor a pure Will view survives the grandfather case intact. The case requires a hybrid account, and the missing "third ingredient" is **The Transfer of Authority (or Right).**

  This view (championed by philosophers like Joseph Raz and David Owens, but distinct from pure Will Theory) argues that when you promise, you do not just create an expectation (Scanlon) or will a duty (Pure Will); you **grant the promisee a right to control your action.**

  1.  **Why it solves Marcus's problem:** Rights survive the rightholder's death. Just as your grandfather's property rights pass to heirs, his *right to your performance* persists even if his psychological expectations do not. This explains why the obligation binds after death without relying on "ghostly expectations."
  2.  **Why it solves Sana's problem:** You cannot transfer a right via a joke or coercion. The "transfer" requires valid conditions (mutual understanding, voluntariness), which incorporates Sana's reliance/expectation constraint as a *validity condition* rather than the *source* of the obligation.

  This synthesizes the two: The **source** of the obligation is the Normative Power (Marcus is right), but the **validity** of that power is constrained by Reasonable Expectations (Sana is right).

  ### Verdict

  Marcus correctly identifies that the *persistence* of the obligation cannot be grounded in psychology, but he lacks an account for why promises have limits. Sana correctly identifies the limits but struggles to ground the persistence without contradicting her own theory. However, Sana's framework (Scanlon) is more robust in the real world because it accounts for the *context* of human interaction, whereas Marcus's intuition leads to a rigid metaphysics he cannot fully articulate. Yet, on the specific question of *why it binds after death*, Marcus's intuition is the one that aligns with the surviving obligation.

  Ultimately, however, the debate proves that neither singular theory is sufficient.

  \verdict{Neither}
