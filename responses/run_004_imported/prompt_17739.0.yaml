  2.  **Deconstruct Lewis's Theory of Convention (for accuracy):**
      *   *Coordination Problem:* A situation where multiple equilibria exist, and agents prefer to coordinate on *one* of them rather than fail to coordinate. (e.g., driving on the left vs. right).
      *   *Arbitrariness:* The chosen regularity isn't inherently better than the alternative; it just needs to be *the* chosen one.
      *   *Precedent/Expectation:* We do X because we did X before, and I expect you to do X, and you expect me to expect you to do X (common knowledge).
      *   *Application to Daniel & Mei:* Domestic rituals (coffee, arguments, texting) are conventions. They could have been different, but *these* are the ones they have.

