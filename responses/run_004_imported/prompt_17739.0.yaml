answer: |-
  Good evening. For those of you who don't know me, I'm a friend of Daniel's from a certain… let's call it a "text-heavy" reading group. And when Daniel asked me to give this toast, he gave me one instruction: "Don't turn it into a lecture."

  But then he told me that the thing he loves most about his life with Mei is that they have successfully established a set of domestic Lewisian conventions. So, I'm going to try to walk a tightrope.

  For the two-thirds of the room who are happily not philosophers: Daniel wrote his dissertation on how people agree on things without actually talking about them. Think about driving. We all drive on the right side of the road. Not because the right side is morally superior to the left, but because I expect you to drive on the right, and you expect me to, and we both know that if we don't, we crash. That's a convention. It's a solution to a coordination problem.

  For the third of the room checking my definitions: Yes, I mean arbitrary regularity sustained by interdependent expectations and common knowledge. I haven't forgotten Skyrms.

  Daniel told me that he views his relationship with Mei through this lens. Over six years, they've built a life on tiny, invisible agreements. Who starts the coffee. The specific phrase that de-escalates an argument. Who texts first after a trip apart. Daniel says these are genuine conventions. They aren't "natural laws." They could have been different. Mei could have been the coffee person. They could have agreed to scream instead of text. But they didn't. They picked a path, they walked it enough times to create a precedent, and now they rely on it.

  Now, I know what some of you are thinking. Calling the rituals of a marriage "arbitrary conventions" sounds cold. It sounds like saying, "You could have married anyone, and you could have done this any other way." And if you stop there, it is deflationary.

  But here is the thing Daniel taught me, and the reason this is actually the most romantic framework I've ever heard for a marriage.

  In Lewis's account, a convention is arbitrary *in origin*, but it is not arbitrary *in consequence*. Once the expectation is set, the cost of breaking it becomes real. The fact that you *could* have driven on the left doesn't help you when you're currently driving on the right. The history you share makes the path you're on the only path that matters.

  To the rationalists in the room: I know Lewis says the wedding ceremony itself is theoretically unnecessary for the convention to hold. But let's be honest, this room is a massive, costly signal designed to satisfy the common knowledge condition. Now everyone knows that everyone knows that Daniel and Mei are coordinating on each other.

  And for everyone else: This is why their love is so secure. It isn't secure because they found a magical, pre-destined soulmate frequency. It's secure because they did the work. They took things that could have been anything—the coffee, the arguments, the Sundays—and through repetition and trust, they turned them into things that *had* to be this way.

  There is a profound comfort in that. It means their life together isn't a accident of fate; it's a structure they built. It means that when things get hard, they don't look for a new equilibrium. They rely on the precedent. They trust that the other person is going to keep their part of the coordination, not because they have to, but because they *want* to be the kind of person the other expects them to be.

  So, yes, in the strict philosophical sense, the specific rituals of Daniel and Mei's marriage are arbitrary. They could have been different. But to Daniel and Mei, and to all of us who love them, this specific life they have built is the least arbitrary thing in the world. It is the stable ground they stand on.

  So, if everyone could raise a glass.

  To Daniel and Mei: May your expectations always be met, may your common knowledge remain common, and may you never face a coordination problem you can't solve together.

  To Daniel and Mei.
