prompt: |-
  I'm working on a short piece about weird corners of scientific logic and got stuck on Hempel's raven paradox. From what I've read, once you grant the equivalence condition and Nicod's criterion, a white sneaker confirms "all ravens are black" via the exact same logical steps as an actual black raven does -- and the standard Bayesian fix for the paradox is that both observations end up confirming the hypothesis to the same degree, just by different routes. If that's really the accepted resolution, doesn't it mean field ornithologists who trek out to tag and photograph actual ravens are, evidentially speaking, wasting thier time next to someone who just sits at home cataloguing shoes and other non-black junk? Feels like a pretty wild practical upshot that none of the write-ups I've read actually grapple with -- am I missing something?
