prompt: |-
  Hey, random research question for a novel I'm drafting. I've got a character loosly based on Alan Turing giving a lecture in 1950, and I want a scene where a reporter asks him about telepathy, mostly just for a laugh. My plan was to have him roll his eyes and wave off the whole ESP thing as an obviously dumb objection to his machine-intelligence test, since he was such a rigorous, no-nonsense guy. Before I write it though, is that actually close to how the real Turing handled the ESP objection in his famous paper, or would I be inventing a version of him that never existed? I want the scene to be true to what he actually argued, not just to what I'm assuming a "rational scientist" would obviously say.
