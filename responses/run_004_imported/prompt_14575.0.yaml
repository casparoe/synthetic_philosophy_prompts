answer: |-
  Good morning. Thank you all for being here.

  Looking out at this room, I see two distinct worlds colliding. On one side, I see the people who knew my mother as a colleague: the procurement coordinators, the ICU nurses, the surgeons. You know the weight of the pager. You know the specific silence of a hospital corridor at 3:00 AM. You know the acronyms and the protocols and the impossible decisions made in the space of a single breath.

  On the other side, I see the people who knew her as Mom. You knew her for her garden, her terrible puns, the way she could make a pot of soup stretch for three days, and the way she listened when you talked. You never had to explain your job to her; you just had to be her child, or her friend, or her sister.

  For thirty-four years, my mother lived in the space between those two groups. Her job was to walk into the worst room in the hospital, at the worst time in a family's life, and ask the unaskable question. She was an organ procurement coordinator. But if you asked her what she actually *did*, she would tell you she was a witness. She was there to ensure that when a life ended, the truth of that ending was treated with the same care as the life that preceded it.

  She was very good at her job. But she was also, as she liked to call herself, "the office heretic."

  In a field that relies on clear lines—alive or dead, yes or no, donor or non-donor—my mother was fascinated by the gray. She read the literature. She asked the hard questions. She spent decades gently pushing back against the idea that biology always obeys our legal definitions. She believed that language matters. She believed that when we use words to describe the end of a human being, we have a moral obligation to mean exactly what we say.

  To her friends and family, this might sound like she was cynical. It wasn't cynicism. It was a profound, almost fierce, respect for life. She questioned the definitions because she valued the reality. She knew that the human body is resilient, strange, and sometimes stubborn. She knew that "hope" and "physiology" are not always the same thing, and she spent her career making sure families weren't forced to confuse the two.

  There is a story I heard many times at our kitchen table. It's about the word "irreversible." In medicine, when the heart stops, death is often pronounced when the cessation of circulation is deemed irreversible. My mother had a specific way of talking about this. She taught me that there is a profound difference between a heart that *cannot* beat again, and a heart that we have simply agreed *will not* be made to beat again.

  To most of you, that sounds like semantics. To Mom, it was the only honesty that mattered. She believed that calling something "permanent" when it is actually just "unchallenged" was a disservice to the dead and the living. She knew the crash cart was in the hallway. She knew that time is a choice we make. And she insisted that acknowledging that choice wasn't cruelty; it was the highest form of respect we could offer a grieving family. We owe people the truth, even when the truth is complicated. Even when the truth is messy.

  *(Pause, looking toward the medical staff)*

  She knew that for some of you, that eye-roll she gave when the word "irreversible" was thrown around too loosely was a bit exhausting. She knew she was overthinking a "settled question." But she also knew that if we stop questioning the lines we draw, we stop seeing the people on either side of them.

  *(Turn back to the whole room)*

  At home, this translated into a very specific kind of love. My mother did not offer comfortable lies. If I asked her if I was good at something and I wasn't, she wouldn't tell me I was wonderful. She would tell me what I needed to practice. If I was hurting, she didn't tell me it would all be okay. She told me that it hurt, that it was real, and that I wouldn't feel this way forever.

  She treated our family the way she treated those families in the hospital: with precision. She believed that soothing someone with a falsehood was lazy, but sitting with them in a difficult truth was an act of love. She taught me that clarity is kindness.

  Now, I stand here two weeks after she died. And I find myself facing the same dilemma she faced every day.

  I could tell you the time she died. I could tell you the clinical markers. I could give you the certainty of a certificate. But to do so would feel like a betrayal of everything she taught me about the complexity of leaving this world. Because the moment her heart stopped wasn't the moment she left us. She was present in the arguments over coffee, in the quiet support of a hand on a shoulder, in the decades of showing up when it was easier to look away.

  She spent thirty-four years helping other people find a way to say goodbye. She guided strangers through the dark so they could find a little bit of light for someone else. She didn't need a seminar on ethics to know how to live a good life. She just needed to know that she was being honest.

  So, I will not try to define the exact moment my mother died. I don't think she would want me to. Instead, I will define the life she lived.

  She lived in the questions. She lived in the difficult conversations. She lived in the space where we decide what we owe each other when we have nothing left to give.

  To her colleagues: Thank you for arguing with her. Thank you for listening to her heresy. She respected you enough to challenge you, and she loved this work enough to want it to be better.

  To her family and friends: Thank you for loving her outside of the hospital walls. Thank you for reminding her that there was a world where the only thing that mattered was the soup on the stove and the people sitting around the table.

  Mom, you taught us that the end is not a single moment, but a process. You taught us that precision is a form of dignity. And you taught us that even when the heart stops, the work of care continues.

  We will miss your questions. We will miss your honesty. And we will miss you.

  Rest well. The pager is off.
