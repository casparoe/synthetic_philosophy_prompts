      *   **Galileo's Position (Letter to Christina, 1615):** He argues that Scripture teaches how to go to heaven, not how the heavens go. He cites Augustine (again) to say that if science proves something, we must reinterpret scripture. He believes his evidence *is* demonstrative (though modernly we know it wasn't quite yet—no stellar parallax).
      *   **The Tension:** It's not Faith vs. Reason exactly; it's about *certainty*. Bellarmine demands absolute proof before overturning tradition. Galileo believes he has it (or close enough) and thinks the Church is being too cautious.
