answer: |-
  **Rome, early 1616**

  **BELLARMINE**
  You ask us to treat a hypothesis as a history. To read Joshua not as a record of miracle, but as a concession to vulgar ignorance.

  **GALILEO**
  I ask you to read it as God intended. If the sun stood still, it was because the Earth moves. The miracle is in the stopping, Eminence, not the moving.

  **BELLARMINE**
  And if you are mistaken? If the mathematics are elegant but the ontology is false? You know the position of the Holy Office. If there were a true demonstration that the sun is in the center and the earth in the third heaven, we should proceed with great circumspection in explaining passages of Scripture which seem to teach the contrary. We would have to admit we did not understand them, rather than pronounce false what has been demonstrated.

  **GALILEO**
  Then we have reached the heart of it. You deny the demonstration.

  **BELLARMINE**
  I deny that you have it. You have saved the appearances. You have shown that your hypothesis calculates the motions of the planets as well as—or better than—the old circles and epicycles. But to say the Earth *actually* moves? That is a leap from mathematics to physics. And until that physics is proven beyond doubt, we must hold to the literal sense of the Fathers. Augustine warns us against this.

  **GALILEO**
  Augustine is my shield, not my enemy. He wrote that if a point of reason is certain, we must reinterpret the Scripture that seems to contradict it. Otherwise, we invite the scorn of the infidels. They know the heavens, Eminence. If we tell them the Earth stands still when their own eyes and reason tell them otherwise, they will laugh not at us, but at the Book.

  **BELLARMINE**
  Augustine also warns against pride. The danger is not only that we look foolish to the infidels if you are right. It is that the faithful stumble if you are wrong. You speak of the Book of Nature written in the language of mathematics. I do not dispute it. But who holds the pen? God. And who interprets His word? The Church. When your reading of Nature conflicts with the reading of Scripture, the burden of certainty lies entirely with you.

  **GALILEO**
  Certainty is a ladder. I have climbed higher than any man before me. I have seen the moons of Jupiter, the phases of Venus. These are not hypotheses. They are facts. To ignore them is to close one's eyes to the light God has kindled.

  **BELLARMINE**
  Facts are not interpretations. You see the phases. You infer the motion. But there are other ways to save the phenomena. Tycho Brahe's system accounts for what you see without moving the Earth. If there is another way, then there is no necessity. And without necessity, you cannot compel us to abandon the literal sense.

  **GALILEO**
  Necessity will come. The tides alone will prove it. But you ask me to wait? To silence the truth until the slow gears of theology grind around to meet it?

  **BELLARMINE**
  I ask you to consider charity. Truth cannot contradict truth. I agree. But if a man claims to have found a truth in nature that contradicts the Faith, and he is mistaken, he damages souls. You are a devout son of the Church, Galileo. Do you not see the risk? You want to teach the theologians how to read Scripture.

  **GALILEO**
  I want to teach them to read the work of the Creator. Scripture teaches how to go to heaven, not how the heavens go. That was said by Caesar Baronius, a cardinal of your own Church.

  **BELLARMINE**
  (Softly)
  And yet, we are charged with the gate to heaven. If the path is obscured by confusion over the earth beneath our feet, the souls entrusted to us may lose their way. You speak of light. I speak of stability. The common man cannot follow your mathematics. He reads Joshua and sees the sun stop. If you tell him Joshua was speaking loosely, he wonders what else was spoken loosely. The Resurrection? The Creation?

  **GALILEO**
  So we must lie to protect them?

  **BELLARMINE**
  We must not speak until we are sure. You say you are sure. I say you are a man, and men err. The Church is a ship. It turns slowly, because if it turns too fast in a storm, it capsizes. You are calling for a hard turn based on a sight through a glass tube.

  **GALILEO**
  It is not the glass. It is the mind behind it.

  **BELLARMINE**
  Then let the mind wait for the proof that leaves no shadow. If you can demonstrate it as you demonstrate geometry, I will be the first to say we must reinterpret the Fathers. But until then... caution is not cowardice, Galileo. It is stewardship.

  **GALILEO**
  And silence is not prudence. It is suffocation.

  **BELLARMINE**
  (He stands, signaling the end)
  We will see what the consultors say. Pray that your certainty is as solid as your passion.

  **GALILEO**
  (Remaining seated)
  I pray only that God does not hold you accountable for hiding the work of His hands.

  **BELLARMINE**
  And I pray He does not hold you accountable for breaking the vessel that carries it.
