answer: |-
  This is an excellent catch, and it is exactly the kind of textual nuance that distinguishes a dissertation chapter from a standard survey. You are right to be suspicious of the tension between the methodological disclaimer on p. 135 and the temporal gloss on p. 139.

  Here is the breakdown of what is actually happening in Fitch's argument, why the tension exists, and how you should handle it in your chapter on anti-realism.

  ### 1. The Short Answer
  You are correct that the **formal proof is entirely tenseless**. The temporal quantification ("has known, will know") is **not doing indispensable logical work** in the derivation of the theorem. It is a rhetorical translation of the modal operator $\Diamond$ (possibility) into natural language.

  However, it is not *merely* sloppy phrasing. It reveals how Fitch (and the tradition following him) intuitively interprets "knowability." He is cashing out logical possibility in terms of temporal opportunity. The tension arises because he is trying to bridge a formal, static logical system with a dynamic, human concept (knowledge) without importing the machinery of tense logic.

  ### 2. The Formal Core (Why Time is Ignored)
  On p. 135, when Fitch says he is ignoring the element of time, he is signaling that he is working within a standard **modal epistemic logic**, not a **tense logic**.

  *   **The Operators:** He uses $K$ (it is known that) and $\Diamond$ (it is possible that).
  *   **The Proof:** The contradiction arises from the interaction of conjunction and knowledge distribution.
      1.  Assume $K(p \land \neg Kp)$.
      2.  By distribution: $Kp \land K(\neg Kp)$.
      3.  By factivity ($Kp \to p$): $p \land \neg Kp$.
      4.  Contradiction between $Kp$ and $\neg Kp$.
      5.  Therefore, $\neg \Diamond K(p \land \neg Kp)$.

  Notice that nowhere in this derivation is there a variable for time ($t$), nor a tense operator (like $P$ for past or $F$ for future). The proof holds in a static model of possible worlds. The "impossibility" derived is a **logical impossibility**, not a temporal one. It says there is no possible world where this conjunction is known, not just that there is no future time where it will be known.

  ### 3. The English Gloss (Why Time Returns)
  On p. 139, when Fitch writes "nobody knows (or has known, or will know)," he is translating the formal result $\neg \Diamond Kp$ back into English for the reader.

  Here is the crucial move: **Fitch is interpreting the modal operator $\Diamond$ existentially over times.**

  In many philosophical contexts, especially verificationist ones, to say "$p$ is knowable" ($\Diamond Kp$) is often understood as "There is some possible circumstance in which $p$ is known." For human agents, "possible circumstances" are frequently cashed out as "times."
  *   "It is possible I know this" $\approx$ "I might come to know this (in the future)."
  *   "It is impossible to know this" $\approx$ "I will never know this."

  Fitch uses the temporal phrasing to emphasize the **strength** of the modal claim. He wants to ensure the reader understands that the result isn't just "nobody happens to know this right now." He is stressing that the unknown truth is *permanently* unknowable. The parenthetical "(or has known, or will know)" is a rhetorical device to block the objection that the truth might just be unknown *temporarily*.

  ### 4. Is There a Contradiction?
  There is no logical contradiction in the paper, but there is a **methodological slippage**.

  *   **The Disclaimer:** "I will not use tense logic." (True, the formal system is tenseless).
  *   **The Gloss:** "This means it will never be known." (True, *if* you interpret the modal space as including temporal extensions).

  The slippage is that Fitch doesn't explicitly justify *why* the modal operator $\Diamond$ maps onto temporal quantification in the English gloss. He assumes a framework where logical possibility encompasses temporal possibility.

  For your dissertation, this is not a "gotcha" moment where Fitch undermines his own proof. Rather, it is a moment where Fitch reveals the **verificationist intuition** lurking behind the logic. Verificationists often conflate "possible to verify" with "verifiable at some time." Fitch's proof exploits this conflation.

  ### 5. Implications for Your Anti-Realism Chapter
  This distinction is vital for your argument about anti-realism. Here is how you can deploy this observation:

  **A. The Target of the Paradox**
  Anti-realists (like Dummett) often define truth in terms of verifiability. If they define it as "verifiable *now*," Fitch's paradox is less damaging (but the link to truth is weaker). If they define it as "verifiable *at some time*" (which matches Fitch's gloss), the paradox bites hard. Fitch's temporal gloss shows he understands the anti-realist claim to be the stronger, temporal one.

  **B. The "Omni-Temporal" Omniscience**
  Fitch's result implies that if all truths are knowable, all truths are *known*. The temporal gloss clarifies that this means "known at some time."
  *   **Formal:** $\forall p (p \to Kp)$
  *   **Gloss:** $\forall p (p \to \exists t (K_t p))$
  Your chapter can argue that Fitch's temporal phrasing highlights that the paradox forces the anti-realist into a form of **temporal omniscience**, not just static omniscience.

  **C. Restriction Strategies**
  Many contemporary responses to the paradox (e.g., Tennant, Hand) involve restricting the knowability principle to "stable" truths or excluding Fitch-conjunctions ($p \land \neg Kp$).
  You can use Fitch's tense/tension to argue that these restrictions often fail because they try to solve a **modal** problem with **temporal** or **epistemic** bandaids. Fitch's disclaimer (ignoring time) was actually the philosophically honest move; the gloss (adding time) was the concession to human intuition. The anti-realist should stick to the tenseless modal logic to see the real cost of their position.

  ### Summary for your Draft
  *   **Verdict:** The temporal phrasing is a translation of modal scope, not a premise of the proof. It is not logically indispensable, but it is philosophically revealing.
  *   **The Tension:** It reflects the gap between formal modal logic (static) and natural language epistemology (dynamic).
  *   **Dissertation Angle:** Use this to show that Fitch recognizes the anti-realist's "knowability" is inherently temporal/eventual. The paradox works *because* we read $\Diamond$ as "eventually." If the anti-realist retreats to a tenseless "possible," they lose the connection to human verification. If they stay with the temporal "eventually," they accept Fitch's conclusion that all truths are (eventually) known.

  You are reading the text exactly as it should be read for a dissertation: noticing where the formalism and the natural language explanation drift apart. That drift is where the philosophical action is.
