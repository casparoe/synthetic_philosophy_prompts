      *   *Berkeley Nuance:* Gender -> Department Choice -> Admission. Department is a mediator. Dev is right there.
      *   *Mia's "Narrower Question":* This is actually a sophisticated retreat. I should give her credit for that, even if it contradicts her first statement about the "real effect."

  9.  **Final Polish:** Check against the prompt requirements (move by move, who has the better of it, what are they missing). Ensure the distinction between *statistical truth* and *causal validity* is clear. (Proceed to generate output).

  *(Self-Correction on "Who wins"):* It's tempting to say Dev wins everything. But Mia's second point (that conditional probabilities are valid descriptions) is statistically sound. I need to make sure the scoring reflects that she is *statistically* right but *causally* misguided, whereas Dev is *causally* right.

  *(Final check on Berkeley Case):* The Berkeley case is famous because the pooled data showed bias against women, but stratified showed bias against men (or no bias). The explanation was women applied to harder departments. This is mediation. If you want to know if the *university* is discriminatory, look at pooled (total effect). If you want to know if *department chairs* are discriminatory, look at stratified (direct effect). Dev captures this better.

