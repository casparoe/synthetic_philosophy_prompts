          *   **Dev:** Argues for causal structure matters. Distinguishes confounders (Kidney) vs. mediators (Berkeley). Believes the "aggregate" is sometimes the target quantity. Warns against the "subgroups = truth" heuristic.
      *   **Task:** Analyze the back-and-forth move-by-move, adjudicate who has the better argument at each stage, and identify what *both* are missing.

  2.  **Analyze Move 1: Mia's Opening Salvo**
      *   *Claim:* Always trust stratified over pooled. Stone size and Department do the same job. Conditioning gives the "real" effect.
      *   *Critique:* This is the classic naive interpretation of Simpson's Paradox. It assumes that heterogeneity *always* implies confounding. It equates statistical association within strata with causal effect without justifying the causal graph.
      *   *Verdict:* Dev is already in a stronger position conceptually, but Mia's point is the common intuition. Technically, she is incorrect about "always."
      *   *Scoring:* Dev > Mia (conceptually), though Mia states the common heuristic.

