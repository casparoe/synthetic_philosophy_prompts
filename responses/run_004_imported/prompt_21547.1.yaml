prompt: |-
  Okay so this one's not a work thing, it's just my own family, and im stuck on it. My sister has spent the last year driving our mom to every doctor's appointment and doing her grocery shopping every single week without complaint. Mom's convinced it's pure devotion and brags to everyone about what a wonderful daughter she has. My sister admitted to me privately though that she mostly keeps it up because she did the math on the inheritance and decided being seen as "the reliable one" mattered more than what she'd actually save by skipping the hassle. The care itself is genuinely excellent, mom's needs are met just as well as they'd be if it came from love instead. You'd think 15 years of teaching ethics would make this an easy one for me, but knowing the real reason still bothers me even though I can't point to anything different in the outcome, and I can't tell if that's a legitimate reaction or just me being precious about motives when results are all that actually matter. Is there something real going on here, or am I overthinking it?
