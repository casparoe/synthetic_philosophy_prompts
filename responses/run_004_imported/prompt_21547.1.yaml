answer: |-
  This is a fascinating dilemma, and I want to start by validating your discomfort: **You are not overthinking it, and you are not being "precious."**

  As an ethics teacher, you know the textbook distinction between the *moral worth of the agent* and the *goodness of the state of affairs.* Consequentialism would tell you to relax; the net utility is high. Mom is cared for, Sister is rewarded, the system works. But human relationships rarely operate on pure utilitarian calculus, and your gut is reacting to the structural fragility and the deception inherent in the arrangement.

  Here is a breakdown of why this bothers you, framed through the lenses you teach, but applied to the messy reality of family.

  ### 1. Virtue Ethics vs. Performance
  From a Virtue Ethics standpoint, your sister is not acting virtuously; she is *simulating* virtue. Aristotle would argue that virtue isn't just doing the right thing, but doing it for the right reason, as a matter of character.
  *   **The Friction:** You are watching a performance of filial piety. It feels uncanny because it *is* uncanny. It's a long con. When you see someone embodying a virtue they don't actually possess, it triggers a "fake" detector. You aren't bothered by the care; you're bothered by the inauthenticity.
  *   **The Risk:** Performative virtue is brittle. If the incentive structure changes (e.g., Mom's health declines drastically, making the "hassle" outweigh the inheritance, or Mom changes her will), the "virtue" may vanish overnight. Your discomfort is likely a subconscious risk assessment of that fragility.

  ### 2. The Commodification of Care
  You are witnessing the marketization of a familial bond. By turning care into a transaction (labor for inheritance), your sister has shifted the relationship from a **communal sharing** model to a **market pricing** model (to borrow from Alan Fiske's relational models theory).
  *   **The Friction:** Mom believes they are in a communal relationship (care based on need and love). Sister is operating in a market relationship (care based on cost-benefit analysis).
  *   **The Ethical Cost:** This creates an epistemic inequality. Mom is living in a false reality. While the *care* is excellent, the *relationship* is fundamentally deceptive. As an ethicist, you know that autonomy relies on truth. Mom is being denied the agency to know the true nature of her daughter's devotion.

  ### 3. The "Good Enough" Parent (or Daughter)
  There is a pragmatic argument to be made here, often associated with Winnicott's "Good Enough Mother." Does it matter if the love is real if the care is reliable?
  *   **The Counter-Argument:** In the short term, maybe not. But in long-term caregiving, burnout is real. Motivation matters for endurance. If the only fuel is money, the care will last exactly as long as the ROI makes sense. If the fuel is love (or duty), it often survives the point of diminishing returns. Your worry is likely that when the hard days come (and they will), the transactional motivation might not hold.

  ### 4. Your Position as the Confidant
  This is the part that might be weighing on you the most. You are now complicit in the deception.
  *   **The Burden:** You hold the truth that invalidates your mother's happiness. Every time Mom brags, you have to swallow the truth. That creates cognitive dissonance. You value honesty (presumably), but revealing the truth causes harm (Mom loses her sense of security and dignity).
  *   **The Professional Irony:** It's ironic that an ethics teacher is stuck in a classic "noble lie" scenario. You can't resolve this theoretically because both options (reveal truth vs. maintain peace) have ethical costs.

  ### So, is there something real going on?
  **Yes.** Your reaction is legitimate. It's not just about motives; it's about **trust and contingency.**

  If you knew your sister was doing this out of love, you would trust the care to continue even if the inheritance vanished. Because you know it's transactional, you know the care is contingent on the payout. That makes the care *instrumental* rather than *intrinsic.*

  ### What do you do?
  Since you asked for perspective rather than a solution, I'll offer a few considerations rather than a prescription:

  1.  **Accept the Gray:** Your sister isn't a villain. Caregiving is exhausting, underpaid, and thankless. She found a way to motivate herself to do a hard thing that benefits your mother. There is a pragmatic goodness there, even if the moral worth is debatable.
  2.  **Monitor the Fragility:** Keep an eye on the situation. If Mom's needs escalate beyond grocery shopping and rides (e.g., incontinence, dementia, 24/7 care), watch to see if the Sister's "transactional patience" holds. That is when the motive will matter most.
  3.  **Protect Your Peace:** You don't need to out your sister. That would likely destroy the care arrangement and hurt your mom. But you also don't need to validate the "devotion" narrative internally. You can acknowledge the *action* is good without endorsing the *motive*.
  4.  **Reframe Your Role:** You aren't failing at ethics by not acting. Sometimes ethics is about knowing when intervention causes more harm than the status quo. The "utilitarian" choice here (keep quiet, Mom stays happy and cared for) might actually be the most ethical path, even if it leaves a bad taste in your mouth regarding the sister's character.

  **Summary:** You aren't being precious. You are reacting to the difference between *integrity* and *compliance.* Your sister is compliant; she lacks integrity in this specific domain. That distinction matters, even if the groceries get bought either way. Give yourself permission to feel uneasy about the motive while acknowledging the benefit of the outcome.
