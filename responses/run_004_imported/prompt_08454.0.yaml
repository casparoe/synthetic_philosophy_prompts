      *   *The Twist/Nuance:* The story needs to show behavior that could be interpreted *either* way. If it acts too agentic, it resolves the conflict. If it acts too mechanical, it resolves the conflict. The ambiguity is key.

  3.  **Brainstorming Scenarios:**
