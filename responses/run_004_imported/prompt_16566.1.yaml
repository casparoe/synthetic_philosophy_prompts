      *(Self-Correction during drafting)*: Wait, the user said "even if I open a brand-new conversation." I need to emphasize that *they* are reintroducing her the same way. The consistency comes from the *prompt*, not the AI's memory. The AI is a function: $f(prompt) = response$. If $prompt$ is constant, $response$ distribution is constant.

