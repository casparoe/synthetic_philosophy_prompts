      *   *Premise 2:* Alternative possibilities (PAP) were *always* the crucial premise linking determinism to the denial of moral responsibility. (This is the weak link. This is the "Consequence Argument" vs. "Source Incompatibilism" distinction.)
      *   *Conclusion:* Incompatibilism loses; Compatibilism wins. (Non-sequitur if Premise 2 is false. Even if PAP is false, incompatibilism might rest on *sourcehood* rather than *leeway*.)

  3.  **Identify Key Philosophical Moves/Counter-moves:**
      *   **Frankfurt's Target:** PAP (Principle of Alternative Possibilities).
      *   **Incompatibilism's Core:** It's not *just* about alternative possibilities. It's about *ultimate sourcehood* or *origination*.
      *   **Leeway Incompatibilism:** Relies on PAP. (Vulnerable to Frankfurt.)
      *   **Source Incompatibilism:** Relies on the idea that determinism prevents the agent from being the *ultimate source* of the action, regardless of alternatives. (Immune to Frankfurt.)
      *   **The Consequence Argument (van Inwagen):** Focuses on the lack of control over past + laws, not necessarily on the ability to do otherwise in the Frankfurt sense.
      *   **Direct Strategies:** Pereboom's "Four-Case Argument" (Manipulation Argument). This bypasses PAP entirely.
      *   **Fischer's Semi-Compatibilism:** Accepts Frankfurt/refutation of PAP, denies that determinism threatens responsibility, but remains agnostic/non-committal on whether determinism threatens *freedom* (in the sense of alternative possibilities). This is a middle ground the user needs to acknowledge.

  4.  **Drafting the Response - Section by Section:**

