prompt: |-
  I've spent a fair amount of time on LessWrong and Overcoming Bias threads about theory choice, and I keep running into the underdetermination of theory by evidence as a kind of background worry that never quite gets resolved. The strong Quine-Duhem version says that any theory can be saved from refuting evidence by adjusting auxiliary hypotheses, while the more specific "contrastive" cases -- Bohmian mechanics vs. standard collapse QM, or rival interpretations of the same formalism more generally -- present us with empirically equivalent rivals that no experiment could ever distinguish. Given that Bayesian updating is supposed to be the rationalist's standard tool for resolving disagreements about which theory is true, I'd like to understand what work is actually left for priors, simplicity considerations (Solomonoff-style or otherwise), and things like Occam's razor once we take underdetermination seriously.

  Could you lay out the most important implications of underdetermination of theory by evidence for how someone trying to reason like a good Bayesian should actually assign and update credences among empirically equivalent or near-equivalent theories? I'm especially interested in whether underdetermination poses a problem that goes beyond ordinary uncertainty -- i.e., whether it means our credences in such cases are in some sense arbitrary or merely conventional rather than tracking truth -- and what practical difference this should make to how confidently I hold views on things like scientific realism, or how much stock I should put in elegance and parsimony as truth-tracking heuristics rather than just aesthetic preferences.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is familiar with LessWrong (LW) and Overcoming Bias (OB) discourse. They understand Bayesianism, theory choice, and the problem of underdetermination (UD).
      *   **Core Problem:** UD seems to be a "background worry" that never gets resolved. Specifically:
          *   Quine-Duhem (any theory can be saved by tweaking auxiliaries).
          *   Empirically Equivalent Rivals (EERs) like Bohmian vs. Copenhagen QM.
      *   **Question:** What work is left for priors, simplicity (Solomonoff/Occam), etc., if UD is real?
      *   **Specific Interests:**
          *   Implications for Bayesian credence assignment/updating among EERs.
          *   Is credence arbitrary/conventional or truth-tracking?
          *   Practical implications for scientific realism.
          *   Status of elegance/parsimony (truth-tracking vs. aesthetic).

  2.  **Initial Assessment & Stance:**

      *   The user is asking a deep philosophy of science question framed within a rationalist/Bayesian context.
      *   *Key Insight:* Underdetermination isn't a bug; it's a feature of the Bayesian framework. Priors *are* where the work happens when evidence runs out.
      *   *Challenge:* Addressing the fear that this makes beliefs "arbitrary."
      *   *Goal:* Provide a structured analysis that validates the worry but shows how Bayesianism handles it, distinguishing between "harmless" UD (transient) and "radical" UD (permanent), and clarifying the role of simplicity priors.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate that this is a central tension in formal epistemology. State the thesis: UD doesn't break Bayesianism; it shifts the burden to priors and model classes.

      *   **1. The Bayesian Resolution to Underdetermination:**
          *   How does Bayes handle EERs? If $P(E|H_1) = P(E|H_2)$ for all possible $E$, then the likelihood ratio is 1. The posterior ratio equals the prior ratio.
          *   *Implication:* Evidence *cannot* move you. The work is entirely in the prior.
          *   *Is this a problem?* Only if you think priors must be objective/logical. If priors are subjective (personalist Bayesianism), then UD just means "evidence doesn't decide, you have to."
          *   *Solomonoff Induction:* Mention that even Solomonoff relies on the choice of Turing machine (reference machine), which is a form of prior bias.

      *   **2. Types of Underdetermination (Crucial Distinction):**
          *   *Transient/Practical UD:* We haven't thought of the experiment yet. (Most common).
          *   *Permanent/Principled UD:* Truly empirically equivalent (e.g., QM interpretations).
          *   *Quine-Duhem:* This is about holism. It suggests we test clusters of hypotheses, not single ones. Bayesian networks handle this well (credence flows to the weakest link).
          *   *Implication:* Don't treat all UD the same. QM interpretations are different from "saving a phlogiston theory."

      *   **3. The Role of Priors and Simplicity (Occam's Razor):**
          *   Why do we prefer simpler theories?
          *   *Instrumental view:* Simpler models generalize better (overfitting).
          *   *Realist view:* Nature is simple (metaphysical assumption).
          *   *Bayesian view:* Simpler theories have higher prior probability mass because there are fewer of them (measure concentration).
          *   *Addressing the "Arbitrary" Worry:* If simplicity is just a prior, is it arbitrary? It's *subjective*, but not *capricious*. It's based inductive success.
          *   *Solomonoff:* Formalizes Occam. Shorter programs = higher prior. But again, depends on the UTM.

      *   **4. Truth-Tracking vs. Convention:**
          *   Does UD mean credences are merely conventional?
          *   *Van Fraassen's Constructive Empiricism:* Yes, for EERs. Believe only in empirical adequacy.
          *   *Scientific Realism:* If EERs exist, realism is threatened *unless* you argue one is truly simpler/better explained.
          *   *The "No Miracles" Argument:* Realism explains the success of science. But if EERs are equally successful, this weakens.
          *   *Rationalist Take:* Credences track *your* best estimate of truth given your priors. If priors differ, credences differ. This isn't "arbitrary" in the sense of "random," but "indexical" to your epistemic state.

      *   **5. Practical Implications for the Rationalist:**
          *   *Don't fight the prior:* Acknowledge when you're arguing from priors, not evidence.
          *   *Steel-manning:* If someone holds the rival theory, check if it's a prior difference or an evidence misunderstanding.
          *   *Instrumentalism vs. Realism:* For EERs (like QM interpretations), adopt a pragmatic stance. Use the one that makes calculation easier (Shut up and calculate), unless one offers a path to new physics (e.g., collapse models might be testable, Bohm might not).
          *   *Confidence:* Lower confidence on metaphysical claims derived from EERs. Higher confidence on empirical predictions.

      *   **6. Conclusion:**
          *   Summarize. UD highlights the limits of evidence, not the failure of reason. Priors are the steering wheel when the road (evidence) ends.

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Tone Check:* Needs to be LW-compatible. Use terms like "priors," "likelihood," "map vs. territory," "Steelman."
      *   *Clarification on Quine-Duhem:* Make sure to distinguish between "saving a theory ad hoc" (lowers prior) vs. legitimate auxiliary adjustment. Bayesian penalty for complexity handles the ad hoc-ness.
      *   *QM Example:* Be careful. Bohmian mechanics is non-local, Copenhagen is ambiguous on ontology. Some argue they aren't perfectly equivalent if you consider relativistic extensions. But for the sake of the argument, treat them as EERs.
      *   *Solomonoff:* Don't oversell it. It's uncomputable and reference-machine dependent. It solves induction formally but not metaphysically.
      *   *Key Distinction:* "Arbitrary" vs. "Underdetermined by Evidence." Priors are not evidence, but they aren't arbitrary coin flips; they encode inductive biases.

  5.  **Final Review against User Prompt:**
      *   Did I address Quine-Duhem? Yes.
      *   Did I address EERs (QM)? Yes.
      *   Did I address the role of priors/simplicity? Yes.
      *   Did I address the "arbitrary/conventional" worry? Yes.
      *   Did I address scientific realism/practical confidence? Yes.

  6.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on this structure.)
answer: |-
  This is one of the deepest friction points between formal epistemology and the philosophy of science. You are correctly identifying that if evidence underdetermines theory, then **Bayesianism does not solve underdetermination; it merely relocates it to the prior.**

  For a rationalist trained in the LessWrong tradition, the temptation is to view Bayesian updating as an engine that grinds evidence into truth. Underdetermination reveals that the engine requires fuel (priors) that evidence itself cannot provide.

  Here is a breakdown of the implications of underdetermination for Bayesian credence, the status of simplicity priors, and the practical stance a rationalist should take.

  ---

  ### 1. The Bayesian Mechanics of Underdetermination

  To understand the implications, we must look at the math. If two theories, $H_1$ and $H_2$, are **empirically equivalent rivals (EERs)**, then for all possible evidence $E$:
  $$P(E | H_1) = P(E | H_2)$$

  By Bayes' Theorem, the posterior odds are:
  $$\frac{P(H_1 | E)}{P(H_2 | E)} = \frac{P(E | H_1)}{P(E | H_2)} \times \frac{P(H_1)}{P(H_2)}$$

  If the likelihood ratio is 1, the **posterior odds equal the prior odds.**

  **Implication 1: Evidence becomes inert.**
  In cases of strict underdetermination, no amount of data can shift your relative credence between the rivals. If you start 50/50, you stay 50/50 forever. If you start 90/10, you stay 90/10 forever.
  *   **The Worry:** This looks like belief is "arbitrary" or "conventional."
  *   **The Bayesian Reply:** It is not *arbitrary* (random); it is *subjective* (dependent on the agent's epistemic state). The work is being done by the prior, which encodes your inductive biases, metaphysical commitments, and simplicity heuristics.

  **Implication 2: Quine-Duhem is a feature, not a bug.**
  The Quine-Duhem thesis (that we test hypotheses in bundles, not isolation) is naturally modeled by Bayesian networks. When a prediction fails, credence is withdrawn from the conjunction of the main theory and its auxiliaries. How that negative credence is distributed depends on the prior resilience of each node.
  *   **Ad hoc adjustments:** If you save a theory by adding a complex auxiliary hypothesis, Bayesian model selection (via penalties for complexity, like BIC or Solomonoff priors) automatically lowers the prior probability of the new conjunction. You *can* save the theory, but you pay for it in prior probability mass.

  ### 2. Is Simplicity Truth-Tracking or Aesthetic?

  You asked what work is left for Occam's Razor or Solomonoff induction. If evidence doesn't decide, simplicity becomes the **tie-breaker.** But is it a truth-tracking tie-breaker or just an aesthetic one?

  **The Instrumentalist Argument (Overfitting):**
  In machine learning and statistics, simpler models are preferred not because we believe the universe is simple, but because complex models overfit noise. A simpler theory has higher **predictive accuracy** on unseen data.
  *   *Rationalist takeaway:* Even if simplicity doesn't track ontological truth, it tracks **generalization performance.** Preferring the simpler EER is rational because it is more robust to noise, even if both are empirically adequate.

  **The Realist Argument (Measure Concentration):**
  In Solomonoff Induction, shorter programs have higher prior probability. Why? Because there are fewer short programs than long ones. The prior probability mass must sum to 1.
  *   *Rationalist takeaway:* If you assume the universe is computable, "simplicity" is a proxy for "how many ways could this universe be generated?" Simple laws are more probable *a priori* simply because there are fewer of them. This makes Occam's Razor a theorem of probability theory over computable hypotheses, not just an aesthetic preference.

  **The Limit:**
  However, Solomonoff induction depends on the choice of the Universal Turing Machine (the reference machine). Changing the reference machine changes the complexity measure. This reintroduces underdetermination at the meta-level.
  *   **Conclusion:** Simplicity priors are not objective facts about the territory. They are **necessary inductive biases** required to make learning possible. They are "truth-tracking" only relative to the assumption that the territory is compressible.

  ### 3. Does Underdetermination Make Credence "Arbitrary"?

  This is the core philosophical anxiety. If my credence in Bohmian Mechanics vs. Copenhagen rests entirely on my prior, and your prior differs, are we just expressing conventions?

  **Bas van Fraassen's Constructive Empiricism:**
  Van Fraassen argues that in cases of EERs, we should suspend belief in the *truth* of either and believe only in their *empirical adequacy*.
  *   *Implication:* Your credence in the ontological claims of the theory should be low/agnostic, while your credence in its predictions remains high.

  **The Rationalist Rebuttal (Subjective Bayesianism):**
  "Arbitrary" implies there is a "correct" credence you are missing. A subjective Bayesian argues there is no "view from nowhere."
  *   Your prior encodes your entire history of induction, your meta-physical intuitions, and your simplicity biases.
  *   If you and I disagree on EERs due to priors, we are not being irrational; we are acknowledging that **evidence has run out.**
  *   **However:** You can still criticize priors as *imprudent*. A prior that assigns high probability to gerrymandered, complex theories will lose money in the long run (in a prediction market sense). So priors are subject to pragmatic selection pressure, even if not evidential refutation.

  ### 4. Practical Implications for Scientific Realism

  How should this change how you hold views?

  **1. Distinguish Transient vs. Permanent Underdetermination**
  *   **Transient:** "We haven't thought of the experiment yet." (e.g., String Theory variants).
      *   *Action:* Keep researching. Assign credences based on theoretical virtues (unification, mathematical consistency) but label them as highly uncertain.
  *   **Permanent:** "No experiment can distinguish them in principle." (e.g., Many Worlds vs. Collapse, if collapse is truly untestable).
      *   *Action:* This is where you must bite the bullet on priors. If you are a realist, you must admit your realism is driven by a prior preference for certain ontologies (e.g., determinism, locality) over others.

  **2. Calibration of Confidence**
  *   You should be **less confident** in metaphysical claims derived from EERs than in empirical predictions.
  *   If you say "Quantum Mechanics is true," that is high confidence.
  *   If you say "The wavefunction is a real physical object (Everett)" vs. "The wavefunction is epistemic (QBism)," your confidence should be significantly lower, acknowledging the prior-dependence.

  **3. The "Shut Up and Calculate" Heuristic**
  For EERs, the rationalist move is often **instrumentalism**. Use the formalism that makes calculation easiest.
  *   *Exception:* If one interpretation suggests a path to *breaking* the equivalence (e.g., Penrose's gravity-induced collapse), you should assign it higher prior weight because it offers potential future evidence. Theories that risk falsifiability are often more valuable than those that insulate themselves.

  **4. Disagreement Resolution**
  When arguing with another rationalist about an EER case:
  *   Check if you are arguing about **likelihoods** (evidence) or **priors** (values/simplicity).
  *   If it's priors, acknowledge that you cannot update each other with data. You must argue about the *virtues of the priors* (e.g., "Is locality more fundamental than determinism?").
  *   Recognize that consensus may be impossible without new theoretical breakthroughs that break the equivalence.

  ### 5. Summary: What Work is Left?

  Underdetermination does not render Bayesianism useless; it clarifies its limits.

  1.  **Priors do the heavy lifting:** In the absence of evidence, your priors (simplicity, symmetry, causality) are the only steering mechanism you have. This makes examining your priors more important, not less.
  2.  **Simplicity is pragmatic:** Treat Occam's Razor not as a law of nature, but as a regularization technique to prevent overfitting your model of reality. It tracks "robustness" more than "truth."
  3.  **Realism is a prior commitment:** Scientific realism (believing theories describe reality, not just predict data) is itself a hypothesis that is underdetermined by evidence (see: Van Fraassen). You adopt it because it is a useful prior for doing science, not because evidence forces it.
  4.  **Credence is not arbitrary, it is indexical:** Your credence reflects *your* epistemic position. It is not a convention like driving on the left vs. right; it is a calculated estimate based on your specific inductive history.

  **Final Advice:**
  When you encounter underdetermination, do not despair that truth is inaccessible. Instead, explicitly tag the beliefs in question as **"Prior-Dominated."**
  *   Hold them lightly enough to update if the equivalence is broken.
  *   Hold them firmly enough to act on the best current model.
  *   Acknowledge that if a peer disagrees, they may not be blind to evidence, but simply weighting theoretical virtues differently.

  Underdetermination reminds us that the map is not the territory, and sometimes, multiple maps fit the territory perfectly. The choice of map is where the rationalist's values and priors finally speak.
