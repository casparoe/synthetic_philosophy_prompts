answer: |-
  **The Coherent Court: Resolving the Discursive Dilemma**

  The ideal of the appellate court is not merely a collection of individuals, but a singular institutional agent. When a three-judge panel issues a ruling, it speaks with one voice, producing a precedent that binds lower courts and guides citizens. However, judgment-aggregation theory reveals a fissure in this ideal: the discursive dilemma (or, in legal theory, the doctrinal paradox). 

  Consider a breach-of-contract case where liability ($R$) requires two conditions: a valid contract existed ($P$) and the defendant breached it ($Q$). Logically, $P \land Q \rightarrow R$. Imagine Judge 1 votes Yes on $P$, Yes on $Q$ (therefore Yes on $R$). Judge 2 votes Yes on $P$, No on $Q$ (therefore No on $R$). Judge 3 votes No on $P$, Yes on $Q$ (therefore No on $R$). If the court votes on the premises ($P$ and $Q$), the majority affirms both, mechanically yielding a "Liable" verdict. If the court votes on the conclusion ($R$), the majority rejects it, yielding "Not Liable." Both procedures are democratic; both respect individual rationality. Yet they produce contradictory collective outcomes. 

  To function as a coherent agent, a court must choose a procedure. The choice is between the Conclusion-Based Procedure (CBP), which aggregates verdicts, and the Premise-Based Procedure (PBP), which aggregates reasons. While both have merit, the choice defines the very nature of judicial authority.

  **The Case for the Conclusion-Based Procedure**

  The strongest argument for CBP rests on democratic legitimacy and judicial minimalism. In a legal dispute, the parties are primarily concerned with the disposition: who wins and who loses? The judges are appointed to resolve cases, not necessarily to author comprehensive treatises. If a majority of the judges believe the defendant should not be liable, overriding that majority view via a mechanical application of premises feels like a betrayal of the collegial decision-making process. 

  CBP respects the "overlap" of judicial reasoning. In the scenario above, Judges 2 and 3 agree on the outcome despite disagreeing on the reasons. This is what legal scholar Cass Sunstein calls an "incompletely theorized agreement." It allows judges to converge on a result without forcing a consensus on deep theoretical premises that might be contentious or unnecessary for the specific case. By voting on the conclusion, the court acknowledges that the law is often a mosaic of distinct rationales leading to a shared practical outcome. 

  Furthermore, CBP protects against the tyranny of the "premise majority." A coalition of judges might manipulate the agenda by slicing a complex legal question into specific premises where they hold a majority, even if their coalition falls apart on the actual justice of the case. CBP acts as a safeguard, ensuring that the final ruling reflects the true will of the majority of the bench regarding the ultimate question of liability. It prioritizes the resolution of the dispute over the logical purity of the opinion.

  **The Case for the Premise-Based Procedure**

  The argument for PBP rests on the requirement of collective rationality and the function of precedent. A court is not a legislature; its power derives from the perceived coherence and consistency of its reasoning. If a court affirms $P$ and affirms $Q$ in its opinion but rules "Not Liable," it has issued a performative contradiction. It tells the public that the contract was valid and the breach occurred, yet there is no remedy. This undermines the rule of law, which depends on predictable logical connections between facts and outcomes.

  PBP treats the court as a unified epistemic agent. For a collective to be rational, its beliefs must be logically integrated. If the court is to speak as "one," it cannot hold contradictory beliefs. PBP forces the court to align its conclusions with its stated findings of fact and law. This is crucial for lower courts and citizens who rely on precedents. They need to know the legal rules ($P$ and $Q$), not just the result of a specific dispute. CBP produces opaque precedents; if the majority rules "Not Liable" without agreeing on *why* (one says no contract, one says no breach), the legal standard remains murky. PBP clarifies the law by establishing exactly which premises command majority support.

  Finally, PBP enhances accountability. It requires judges to go on the record regarding specific legal elements. Under CBP, a judge can hide behind a conclusion while remaining ambiguous about the underlying legal standards. PBP demands transparency, forcing the collective to own the logical implications of its factual findings.

  **The Verdict**

  Faced with this dilemma, a rational collective decision-maker acting as a court must commit to the **Premise-Based Procedure.**

  To choose CBP is to admit that the court is merely a vote-counting machine rather than a reason-giving institution. While CBP respects the headcount on the final outcome, it sacrifices the integrity of the institution's voice. A court that issues a "Not Liable" verdict while simultaneously establishing by majority vote that a contract existed and was breached is not acting as a coherent agent; it is acting as a fractured committee masking its incoherence with a final order. 

  The primary function of a high court is not merely dispute resolution (which could be achieved by flipping a coin), but the articulation of public standards. Law is a system of reasons. If the collective reasons ($P$ and $Q$) are affirmed by the majority, the collective conclusion ($R$) must follow, even if a different coalition of judges would have preferred the opposite outcome based on different reasoning. To do otherwise is to privilege outcome over principle. 

  Critics will argue this is undemocratic within the panel, as it overrides the majority's preferred verdict. However, judicial panels are not legislatures. Their legitimacy relies on the constraint of logic and the consistency of doctrine. The discursive dilemma exposes a flaw in CBP: it allows a collective to be irrational even when every individual is rational. PBP corrects this by imposing rationality constraints on the collective itself. 

  Therefore, to maintain the status of a coherent agent, the court must bind itself to the logic of its own findings. It must vote on the premises and let the verdict fall where the logic dictates. A court that cannot maintain logical consistency between its reasons and its results ceases to be a court of law and becomes a court of men. Rational collective agency demands that the reasons drive the conclusion, not the other way around.
