      *   *Principle 1: The Indiscernibility of Identicals (II).* If $x = y$, then $x$ and $y$ share all properties. (This *is* analytic/trivial).
      *   *Principle 2: The Identity of Indiscernibles (PII).* If $x$ and $y$ share all properties, then $x = y$. (This is *not* analytic; it's synthetic/substantive).
      *   *The User's Error:* They think PII is just the definition of identity. It's actually a constraint on what kinds of worlds are possible.

  3.  **Deconstruct Max Black's Counterexample:**
