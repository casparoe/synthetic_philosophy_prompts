      *   *Better approach:* The memo recommends Conditional Approval. This effectively rejects the call for *Rejection* (Korsgaardian purist) and rejects the *Indirect Duty* claim that the animal's pain is irrelevant.
      *   *Actually, the prompt implies the split is between Approval (3Rs) and Rejection/Narrowing (Korsgaard), with the Indirect Duty guy complicating the basis.*
