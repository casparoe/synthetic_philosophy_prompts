      *   *Refined Closing:* I will focus on the tension between the two Kantian views since that's the intellectual heart of the prompt. If I approve (with conditions), I am assuming the Korsgaardian view is *mostly* right (animals have a good) but that it can be overridden by scientific necessity. If the Indirect Duty view is right, we are fetishizing a mouse. If the strict Korsgaardian view is right, we are committing a moral wrong by using the mouse at all.
