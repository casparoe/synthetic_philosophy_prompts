  Here is a grading assessment based on standard philosophical interpretations of these theories, formatted as requested.

  ### TA Assessment & Rubric

  **General Comments:**
  This is a strong submission in terms of expository clarity. You have correctly identified the core definitions of both Cummins' causal-role account and the etiological (selected effects) account, and your application of these definitions to the heart example is accurate. However, you have reversed the standard philosophical consensus regarding **malfunction**, which is typically the primary motivation for preferring the etiological account over Cummins'. Additionally, there is a historical inaccuracy regarding Wright's original scope. Because this is an introductory course, I have weighted the accurate definitions heavily, but the conceptual error on malfunction prevents a top score.

  **Detailed Rubric:**

  | Category | Score | Max | Justification |
  | :--- | :--- | :--- | :--- |
  | **Cummins Exposition** | 2.0 | 2.0 | Accurate summary of causal-role analysis; correctly identifies the relativity to containing system capacities. |
  | **Etiological Exposition** | 2.0 | 2.0 | Correctly defines function via selection history and distinguishes selected effects from byproducts (thumping). |
  | **Treatment of Malfunction** | 1.0 | 3.0 | **Major Error.** The etiological account is standardly taught as *superior* on malfunction because it separates function (history) from performance (current state). Cummins struggles here because if function *is* current capacity, a failing heart lacks the function rather than malfunctioning. |
  | **Historical Claims** | 0.5 | 1.0 | Incorrect regarding Wright. Wright's 1973 account included artifacts intentionally; Cummins did not "broaden" to artifacts but rather removed the historical constraint entirely. |
  | **Preference & Defense** | 2.0 | 2.0 | Argument is internally consistent. You correctly identify the "panfunctionality" objection and offer the standard Cummins-style reply regarding explanatory capacities. |
  | **TOTAL** | **7.5** | **10.0** | |

  ***

  ### Specific Feedback for the Grader (You)
  If your classmate contests the grade, here are the specific philosophical distinctions you can reference to defend the scoring on **Malfunction** and **History**:

  1.  **The Malfunction Problem:** The main reason Neander and Millikan refined Wright's account was specifically to solve the "normativity" problem that Cummins leaves open. Under Cummins, if a heart stops pumping, it literally loses its function (because function = current causal contribution). We intuitively want to say a broken heart *has* the function to pump but is *failing* to do so. The Etiological account allows this because the function is grounded in the past (why hearts exist), not the present performance. Your classmate argues Cummins handles this "easier," but most literature argues the opposite.
  2.  **Wright vs. Cummins on Artifacts:** Larry Wright's 1973 paper *"Functions"* explicitly designed his etiological account to cover both biological traits and human artifacts (e.g., a clock's function is to tell time because it was designed to). Cummins' account is ahistorical, which makes it applicable to artifacts, but he didn't "broaden" Wright's view; he proposed a competing view that removed history entirely.

