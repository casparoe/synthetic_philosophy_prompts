      *   *Realism:* Moral facts exist independently of our attitudes.
      *   *Evolution:* Shaped our moral attitudes for fitness, not truth.
      *   *Horn 1 (Tracking):* Evolution tracked truth. (Street says: Implausible. Fitness $\neq$ Truth).
      *   *Horn 2 (Coincidence):* It's a lucky accident that fitness-aligned attitudes match independent truth. (Street says: Skeptical defeat. We can't trust our faculties).
      *   *Conclusion:* Realism is untenable (or leads to skepticism).

  3.  **Part 2: The Third-Factor Reply (The Mechanism):**
      *   *Who?* David Enoch is the big name here ("Survival is at least somewhat good"). Also Wielenberg.
      *   *The Structure:* It's an inference to the best explanation or a common cause structure.
      *   *The Move:* Don't say Evolution $\rightarrow$ Truth. Don't say Truth $\rightarrow$ Evolution. Say Factor X $\rightarrow$ Evolution AND Factor X $\rightarrow$ Truth.
      *   *The Specific Factor:* Usually something like "Survival/Reproduction is good."
      *   *How it blocks the dilemma:*
          *   It avoids Horn 1: It doesn't claim evolution *tracked* truth directly. It claims evolution tracked *survival*, and survival happens to be *good*.
          *   It avoids Horn 2: It's not a coincidence. There is a necessary or conceptual link between the factor and the moral truth.
      *   *Analogy:* Math/Logic. We evolved to believe $1+1=2$ because it helps survival. Is it a coincidence that $1+1=2$ is true? No, because the utility relies on the truth. (Wait, Street challenges this analogy). Better analogy: Pain. Pain is bad. Evolution made us avoid pain. Why? Because avoiding pain aids survival. Is it a coincidence that pain (which is bad) is what we avoid? No, because the badness of pain is linked to its survival-disvalue.
      *   *Enoch's specific argument:* Survival is a precondition for having any moral value at all. Therefore, there is a normative reason to promote survival. Evolution promotes survival. Therefore, evolution promotes something there is normative reason to promote.

  4.  **Part 3: The Critique (Relocating the Coincidence):**
      *   *The Core Objection:* Street (and others like FitzPatrick, though he's a realist defender, often gets into this weeds) argues the Third-Factor just pushes the coincidence back one step.
      *   *Why?* The realist still needs to explain why the *independent* moral fact (e.g., "Survival is good") aligns with the *contingent* facts of evolution.
      *   *The "Why that Factor?" problem:* Why is *survival* the third factor? Why not "suffering is good"? If moral facts are independent, what guarantees that the independent moral facts pick out the same things evolution picked out?
      *   *Street's Counter:* Even if "Survival is good" is true, why did evolution select for *believing* survival is good? It selected for behaviors. The link between the behavior and the *belief* is still contingent.
      *   *The "Pre-established Harmony" charge:* It looks like Leibniz. God (or the Moral Realm) set it up so evolution and Morality match. But without God, it's mysterious.
      *   *Specific Critique:* The third factor assumes a substantive moral truth ("Survival is good"). But the skeptic asks: "Why is *that* specific truth the one that matches evolution?" If moral truths are independent, couldn't they have been different while evolution stayed the same? If yes, the match is still coincidental.

