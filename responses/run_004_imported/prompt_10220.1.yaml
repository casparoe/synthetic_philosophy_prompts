answer: |-
  This is a sophisticated objection that comes up frequently in debates about the philosophy of science. Your friend is correct that Karl Popper initially expressed skepticism about evolutionary theory, but her argument relies on an incomplete historical record and a misunderstanding of how modern evolutionary biology operates.

  Here is a breakdown of why Popper's initial criticism does not undermine the scientific status of evolutionary biology today.

  ### 1. Popper Changed His Mind
  The "clinching point" your friend used is historically outdated. It is true that in the 1970s (specifically a 1974 lecture), Popper described natural selection as a "metaphysical research programme" rather than a testable theory. He was concerned that the phrase "survival of the fittest" was tautological (i.e., *Who survives? The fittest. Who are the fittest? Those who survive.*).

  **However, Popper explicitly retracted this view.** In 1978, and in later writings, he clarified that he had been misunderstood and that he now accepted evolutionary theory as testable and scientific. He wrote:

  > *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."*

  Popper came to realize that while the *general principle* is broad, specific evolutionary hypotheses are highly falsifiable. Relying on his 1974 comment while ignoring his 1978 recantation is like citing Newton's alchemy to disprove his physics.

  ### 2. The "Tautology" Charge is Misleading
  The charge that natural selection is a tautology relies on defining "fitness" solely as "survival." If that were the definition, the statement would indeed be circular.

  However, biologists define fitness **independently of survival**. Fitness is measured by specific, measurable traits (e.g., beak depth, enzyme efficiency, camouflage coloration) in a specific environment.
  *   **Prediction:** We can measure a trait in a population *before* an environmental change.
  *   **Hypothesis:** We predict that individuals with Trait A will reproduce more than individuals with Trait B under Condition X.
  *   **Test:** We observe the population over generations.

  If the individuals with the predicted "advantageous" trait do *not* reproduce more, the hypothesis is falsified. Because we can define the advantageous trait independently of the outcome, it is not a tautology.

  ### 3. Evolutionary Biology is Falsifiable
  For a theory to be scientific, there must be evidence that could prove it wrong. Evolutionary biology is full of such potential falsifications. The famous geneticist J.B.S. Haldane, when asked what would disprove evolution, reportedly said: **"Fossil rabbits in the Precambrian."**

  If we found complex mammal fossils in rock layers dated to 500 million years ago (before complex life should have existed), the theory of common descent and the geological timeline would collapse. We have never found this.

  Furthermore, evolutionary biology makes risky predictions that have been confirmed:
  *   **Genetics:** It predicts that humans should share more DNA with chimpanzees than with mice, and more with mice than with yeast. This is consistently confirmed.
  *   **Biogeography:** It predicts that island species should be most similar to the species on the nearest mainland, not to species on islands with similar climates but far away distances. This is confirmed.
  *   **Transitional Forms:** It predicts where and when we should find transitional fossils. The discovery of *Tiktaalik* (a fish-to-tetrapod transition) in rocks of the specific age and environment predicted by Neil Shubin and colleagues is a prime example of a successful scientific prediction.

  ### 4. "Just-So Stories" vs. Scientific Hypotheses
  Your friend's concern about "untestable storytelling" touches on a valid critique made by scientists themselves (notably Stephen Jay Gould and Richard Lewontin in 1979). They warned against **"adaptationism"**: the tendency to assume every trait is an optimal adaptation without testing it.

  *   **Bad Science:** "Giraffes have long necks *because* they needed to reach high leaves." (This is a post-hoc story).
  *   **Good Science:** "If long necks are for reaching high leaves, then during droughts, giraffes with longer necks should survive better. Also, neck length should correlate with feeding height, not just sexual selection." (This is testable).

  Biologists are acutely aware of the "just-so story" trap. Modern evolutionary biology uses controlled experiments (e.g., Richard Lenski's *E. coli* experiments), genetic analysis, and mathematical modeling to test these hypotheses. When an explanation cannot be tested, it is generally not published as fact but as a hypothesis requiring further data.

  ### 5. Astrology vs. Evolutionary Biology
  Comparing evolutionary biology to astrology is a category error.
  *   **Astrology** makes vague predictions that are retrofitted to fit events and fails under controlled testing conditions.
  *   **Evolutionary Biology** makes specific predictions about the natural world (genetic, fossil, anatomical) that are consistently verified across independent fields of study.

  ### Conclusion
  Your friend's argument rests on a philosophical objection that was raised, considered, and largely resolved within the scientific community decades ago.
  1.  **Popper recanted his criticism.**
  2.  **Natural selection is not a tautology** because fitness is measured independently of survival.
  3.  **Evolutionary theory is falsifiable** (e.g., anachronistic fossils, genetic inconsistencies).
  4.  **Biologists distinguish** between testable hypotheses and untestable storytelling.

  Evolutionary biology is not "shaky"; it is the foundational framework of modern biology, supported by converging evidence from genetics, paleontology, embryology, and ecology. It meets the criteria of robust empirical science.
