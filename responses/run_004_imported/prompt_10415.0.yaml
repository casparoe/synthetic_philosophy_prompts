          *   *Classmate:* "giving a conditional analysis of 'could have done otherwise': to say that I could have done otherwise just means that I would have done otherwise if I had chosen or wanted to. On this reading, determinism poses no threat..."
          *   *Assessment:* Accurate. Classical compatibilism (Moore/Hume) defines freedom ability conditionally. They reject the inference that determinism removes the *ability* to do otherwise because they redefine ability.
