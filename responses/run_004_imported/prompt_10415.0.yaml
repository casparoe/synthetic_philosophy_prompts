          *   *Assessment:* This is a solid, standard summary of the informal version of the Consequence Argument (Premise 1: No choice about past, Premise 2: No choice about laws, Premise 3: Determinism links past+laws to present, Conclusion: No choice about present).
          *   *Score:* High.

