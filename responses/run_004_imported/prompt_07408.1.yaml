      *   *Gamble 2:* 11% \$1M, 89% \$0 vs. 10% \$5M, 90% \$0. (Most pick the 10% \$5M).
      *   *The Conflict:* Expected Utility Theory (EUT) says if you prefer A over B in the first pair, you must prefer C over D in the second pair (due to the Independence Axiom). The common pattern violates this.
      *   *The Independence Axiom:* If you prefer X over Y, you should still prefer X over Y even if both are mixed with a common probability Z.
      *   *The "Rational" Defense:* Dutch Book arguments, money pumps, consistency as a prerequisite for maximizing long-term outcomes.
      *   *The "Rational" Challenge:* Regret theory, the psychological value of certainty, context-dependence, the idea that probabilities aren't linear in human valuation (Prospect Theory, though that's descriptive, the normative debate is deeper).

  3.  **Character Conception:**
      *   **Elena (Pro-Independence):** Focuses on coherence, dynamic consistency, and the danger of exploitation. She sees rationality as a structural constraint on preferences.
      *   **Marcus (Anti-Independence):** Focuses on the *meaning* of the outcomes, the role of regret, and the idea that the "common consequence" changes the context. He sees rationality as sensitive to the structure of the choice situation.

  4.  **Drafting - Section by Section:**

