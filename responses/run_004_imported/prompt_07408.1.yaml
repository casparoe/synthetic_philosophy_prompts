      *   **Round 3: Defusing the Pump (Marcus's Counter):** Marcus argues that a sophisticated agent anticipates the pump and refuses to play, or that the cost of the pump is less than the value of the certainty preference. He introduces the concept of *Regret*.
      *   **Round 4: The Nature of Outcomes:** Elena argues outcomes are just final wealth states. Marcus argues outcomes include the *experience* of the choice (e.g., "I had a sure million and threw it away"). This is the "broad individuation of outcomes" argument.
      *   **Round 5: The Crux:** Is rationality about internal consistency of abstract preferences (Elena) or about fitting the decision to the meaningful structure of the world (Marcus)?
      *   **Conclusion:** No winner. The fundamental divide is revealed: Instrumental coherence vs. Substantive reasonableness.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Am I making Marcus sound like he's just describing psychology (Prospect Theory)?
      *   *Correction:* No, Marcus needs to argue *normatively*. It's not just that people *do* this, but that they *should* be allowed to. He needs to lean on Regret Theory or the idea that the "common consequence" isn't actually irrelevant.
      *   *Check:* Is Elena too dry?
