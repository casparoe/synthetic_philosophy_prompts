      *(Self-Correction on the Money Pump)*: I need to be careful. If Marcus admits the agent can be money-pumped, he admits irrationality in the instrumental sense. His defense must be that the "pump" ignores the transaction costs or the psychological cost of regret which is part of the utility function. Or, he argues that rationality doesn't *require* immunity to money pumps if the preferences reflect deep values. Let's go with the idea that the "outcomes" were misdescribed by Elena. If "disappointment" is part of the outcome, independence holds. If it's not, independence fails. The crux is whether we individuate outcomes finely enough to save the axiom.

