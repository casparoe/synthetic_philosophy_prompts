      *   *Check:* The Money Pump. This is the hardest hurdle for Marcus. He needs a solid response. The "sophisticated choice" response is standard. If I know I'll be pumped, I pre-commit. But does pre-commitment solve the preference violation? It sidesteps it. A better argument is that the value of the option changes based on what else is on the table (menu dependence). Let's stick with the "Regret/Disappointment" angle as a valid utility component.

  6.  **Writing the Dialogue (Iterative Process):**
