answer: |-
  **The Weight of Nothing: Can Inaction Really Cause Events?**

  The argument in your family group chat is a classic philosophical standoff, one that has troubled metaphysicians, legal scholars, and scientists for centuries. On one side, you have the intuition that causes must be *things*—forces, energies, physical collisions. On the other, you have the undeniable reality that the world changes drastically based on what *doesn't* happen.

  Your brother's engine didn't seize because a demon twisted the metal; it seized because coolant was absent. The swimmer didn't die because a shark attacked; they died because air was absent from their lungs, sustained by the lifeguard's absence from the water.

  The question is whether "absence" is a genuine metaphysical cause or merely a linguistic shortcut for assigning blame. To answer this, we have to look at the two strongest competing theories of causation, solve the puzzle of why we blame the lifeguard but not the random stranger, and then commit to a verdict.

  ### The Case Against: Causation Requires a Physical Process

  The strongest argument that omissions are *not* genuine causes comes from a view often called **Process Theory** or **Physicalism**.

  According to this view, causation is a physical transaction. For Event A to cause Event B, there must be a continuous chain of energy or matter transferring from A to B. Think of billiard balls: the cue ball strikes the eight ball, transferring kinetic energy, causing it to move. There is a physical "glue" connecting them.

  From this perspective, an omission is literally nothing. When your brother *didn't* top up the coolant, he didn't emit a particle, exert a force, or transfer energy. He sat on the couch. The engine overheated due to friction and thermodynamics, not due to his sitting. If we say his inaction caused the seizure, we are saying that "nothing" pushed the engine into a broken state. This violates the basic physical principle that effects require antecedent conditions with physical content.

  This view also solves your "Selection Problem" (why the lifeguard and not the random stranger?) very neatly. If omissions aren't causes, then *neither* the lifeguard nor the stranger caused the death physically. The cause of death was drowning (water in lungs). The lifeguard is *responsible* for the death because of a social contract (his job), and the stranger is not. But responsibility is not causation. We prosecute the lifeguard for negligence, not for "killing" in the same way we would prosecute someone who held the swimmer underwater. In this view, saying "the lack of coolant caused the seizure" is just sloppy shorthand for "The engine seized due to thermodynamics, and my brother is to blame for allowing the conditions."

  ### The Case For: Causation is About Dependency

  The strongest argument that omissions *are* genuine causes comes from **Counterfactual Theory**.

  This view argues that causation isn't about energy transfer; it's about *dependence*. Event C causes Event E if, had C not occurred, E would not have occurred. This is the "but-for" test.
  *   *But for* the brother topping up the coolant, would the engine have seized? No.
  *   *But for* the lifeguard jumping in, would the swimmer have died? No.

  If the outcome *depends* on the action, then the absence of that action is a cause of the outcome. To deny this is to disconnect causation from how we actually navigate the world. Consider a fire. We say a fire is caused by a spark. But a fire is equally dependent on the *absence* of a fire extinguisher, the *absence* of rain, and the *absence* of a fireproof wall. If we claim only the spark is the "real" cause because it's a positive energy release, we lose the ability to explain why the fire *stopped* when we sprayed water on it. Did the water cause the fire to go out? Yes. How? By omitting the oxygen. If omissions aren't causes, then extinguishing a fire isn't "causing" it to stop, which is absurd.

  Furthermore, modern systems (like engines or bodies) are defined by their maintenance requirements. An engine is a system designed to operate *only if* coolant is present. The "normal" state of the system includes the presence of coolant. Therefore, the absence of coolant is a specific, identifiable deviation in the system's history, not just a generic "nothing."

  ### Solving the Selection Problem: The Queen of England Objection

  The biggest hurdle for the "Omissions are Causes" team is the Selection Problem. If my not watering my plants kills them, did the Queen of England also kill them by not watering them? After all, if she *had* flown over and watered them, they would have lived. If causation is just "if they hadn't done X, Y wouldn't happen," then everyone on earth who didn't water the plants is a cause of their death. That renders the word "cause" useless.

  To solve this, we must introduce **Normative Expectations**.

  Causation in the human world is not just about physics; it is about *systems and functions*. We distinguish between "background conditions" and "causes" based on what is expected to happen.
  1.  **The Brother vs. The Stranger:** The brother is part of the car's maintenance system. The car's function depends on him. The stranger is not. The stranger's inaction is a *background condition* (like gravity or air pressure); the brother's inaction is a *causal intervention* because it violated the expected functioning of the system.
  2.  **The Lifeguard vs. The Bystander:** The lifeguard has a specific duty. Their role is defined by the prevention of drowning. When they don't act, the system (the beach safety protocol) fails. The bystander is outside that system.

  This doesn't make causation "subjective." It makes it **contextual**. Just as "tall" is a real property but depends on a comparison class (tall for a jockey vs. tall for a basketball player), causation depends on the relevant system of norms. The Queen of England didn't kill the plants because she falls outside the "gardening system" of the homeowner. Her non-action is not a relevant variable in that specific causal model.

  ### The Verdict: Omissions Are Genuine Causes

  So, where does the truth lie? Is your brother's inaction a real cause, or just a way of assigning blame?

  **I argue that omissions are genuine causes.**

  Here is why: The "Physicalist" view (that only energy transfer counts) is actually the one relying on loose talk. It attempts to reduce all macroscopic reality to particle physics, but that reduction fails to explain how complex systems work.

  An engine is not just a collection of atoms; it is a functional object. Its existence relies on a specific set of conditions being maintained. When we ask "What caused the engine to seize?", we are asking a question about the *history of the system*, not just the history of its particles. In the history of that system, the failure to introduce coolant is a distinct, identifiable event that altered the trajectory of the system.

  To say "nothing caused it" is to ignore that the *state of the system* (low coolant) was the direct result of a specific history (the brother's choice not to add more). The "omission" is not a magical void; it is a description of a **counterfactual dependency that was violated.**

  If we deny that omissions are causes, we break our ability to explain almost everything in medicine, engineering, and law.
  *   Did the doctor *cause* the patient's death by not operating? Yes.
  *   Did the pilot *cause* the crash by not lowering the landing gear? Yes.

  In these cases, there is no "energy transfer" from the doctor to the patient or the pilot to the gear. There is only the failure of a required dependency. If we say these aren't causes, we are forced to say the patient died of "disease" and the plane crashed due to "gravity," rendering the human agents irrelevant to the physical chain of events. That is a category error.

  **The Resolution for Your Family Chat:**
  Your brother's not topping up the coolant *was* the cause of the engine seizure. It wasn't just a moral failing; it was a mechanical necessity that was not met. The "nothing" that happened (the pouring of coolant) allowed the "something" (friction and heat) to destroy the engine.

  The reason we don't blame the random stranger on the highway is not because their inaction wasn't a cause in the broad counterfactual sense (if they had teleported coolant, the engine would live), but because they were not part of the **causal system** responsible for the car's maintenance. Causation is real, but it is selective. We pick out the causes that matter to the function of the system.

  Your brother didn't just "let it happen." In a system dependent on maintenance, failing to maintain is an active driver of failure. The absence of coolant was the weapon; his inaction was the hand that wielded it.
