answer: |-
  This is a profound and unsettling case, precisely because it strips away the usual comforts of clinical paternalism (the patient is obviously confused) and simple libertarianism (the patient has a right to refuse). It forces us to confront the metaphysics of the self and the temporal structure of autonomy.

  Your friend is right to sense that this is an instantiation of an older puzzle. In political philosophy and ethics, we call this the problem of **diachronic autonomy** versus **synchronic autonomy**, often framed through the lens of the "Ulysses Contract" (named after Elster's analysis of *Ulysses and the Sirens*). The question is: *Can a past self bind a future self, and if so, under what conditions does the future self have the right to break the chains?*

  Here is how I would structure the philosophical analysis, distinguishing between the principled grounds and the inevitable residual uncertainty.

  ### 1. The Argument for the Past Self (The Authenticity View)
  The strongest philosophical argument for honoring the crisis plan rests on the concept of **second-order volitions** (Harry Frankfurt).

  *   **True Will vs. Immediate Impulse:** Autonomy is not merely doing what one wants in the moment (first-order desire); it is acting in accordance with what one *wants to want* (second-order volition). During stability, the patient reflected on her values, her history, and her goals. She determined that manic episodes were disruptions of her agency, not expressions of it. She authorized the team to protect her "stable self's" life plan against her "manic self's" impulses.
  *   **The Epistemic Asymmetry:** The stable self had access to the data of recovery and relapse. The manic self, by definition, lacks insight into the mania. The patient's current argument—that she feels "clearer-headed"—is a textbook symptom of mania (hyper-clarity). To accept this argument as valid is to accept the symptom as evidence against the diagnosis.
  *   **The Self-Sealing Objection:** As you noted, the plan was designed to survive this exact objection. If the patient can void the plan simply by asserting, "I am well now," the plan is functionally null. It creates a logical paradox where the only time the plan is needed (during mania) is the only time it can be revoked. To allow the revocation is to render the pre-commitment incoherent.

  ### 2. The Argument for the Current Self (The Continuity View)
  However, we cannot simply dismiss the current self as a "different person" or a "non-agent." That is too easy and potentially dangerous.

  *   **Phenomenological Reality:** To the patient, the clarity *is* real. Dismissing it entirely risks treating her as a vessel for a disease rather than a person experiencing a state. Rebecca Dresser, a bioethicist who has critiqued psychiatric advance directives, argues that the "diseased self" is still the *patient*. Ignoring her current wishes treats her as two different people, which undermines her dignity and continuity.
  *   **The Possibility of Change:** People evolve. It is logically possible (though clinically unlikely in Bipolar I) that she *has* found a new equilibrium that looks like mania but isn't, or that her values have genuinely shifted. A rigid adherence to the past self assumes the past self was infallible about the future.
  *   **The Risk of Tyranny:** If we allow the past self to bind the future self too tightly, we risk creating a system where a moment of caution permanently enslaves a future moment of passion. We must ensure the "stable self" isn't acting out of fear or internalized stigma, but out of genuine welfare assessment.

  ### 3. The Principled Basis: Capacity and Values
  So, is there a principled way to decide, or is it a judgment call? I believe there is a principled basis, but it requires shifting the metric from **lucidity** to **capacity and alignment.**

  **A. Lucidity is not Capacity**
  The patient is articulate. She is making arguments. But capacity requires more than coherence; it requires the ability to *weigh consequences* and *manipulate information rationally*.
  *   *The Principle:* If the mania alters the *weighting mechanism* (e.g., making risk seem negligible or reward seem infinite), capacity is impaired even if the logic is sound.
  *   *Application:* The team must assess not *if* she can argue, but *if* her argument acknowledges the historical consequences of this specific state. If she says, "I know I usually crash, but this time I won't," without evidence, her capacity to weigh risk is compromised by the symptom itself.

  **B. The "Values Consistency" Test**
  *   *The Principle:* We should prioritize the self whose desires align with the patient's enduring, deep-held values, rather than transient states.
  *   *Application:* Does the current desire for mania align with her long-term view of a good life? In Bipolar I, mania typically leads to ruin (financial, relational, physical). The stable self's plan was likely based on preserving the *conditions* for autonomy (health, relationships, housing). The manic self is often willing to burn those conditions for the sake of the experience. Honoring the plan protects the *infrastructure* of her autonomy.

  ### 4. Conclusion: Whose Judgment Carries the Day?
  To answer your friend directly: **The judgment of the stable self should carry the day, but with a crucial caveat.**

  The principled basis is that **autonomy is a diachronic project, not a synchronic event.** We are not merely a series of momentary selves; we are narratives. The stable self was the author of the narrative; the manic self is a character in the throes of a plot twist that threatens to end the story.

  However, the team cannot simply ignore her. The "unprincipled judgment call" fear is mitigated if they engage in a **procedural validation**:
  1.  **Acknowledge the Lucidity:** Validate that she sounds clear. Do not gaslight her.
  2.  **Test the Insight:** Ask her to predict the outcome of *not* medicating, based on past data. If she cannot integrate the past data (e.g., "I know I usually crash, but..."), her capacity is impaired by the illness, regardless of her articulation.
  3.  **Honor the Contract as an Act of Care:** Frame the enforcement not as "we know better than you," but as "we are honoring the commitment you made to yourself when you were free to choose."

  **The Verdict:**
  The patient's objection ("this time is different") is the very hazard the plan was built to mitigate. To accept it is to fall into the trap the stable self identified. Therefore, the team should act on the plan, not because the past self *outranks* the present self metaphysically, but because the present self's capacity to assess risk is currently compromised by the very state she is defending.

  The tragedy of the case is that to respect her autonomy in the long run, they must violate her autonomy in the short run. That is not an unprincipled judgment call; it is the tragic core of paternalism in the face of episodic incapacity. Your friend's team should proceed with the hospitalization, but they should do so with the humility to know that they are intervening in a conflict between two valid claims of the same person, siding with the one that seeks to preserve the person's future ability to choose.
