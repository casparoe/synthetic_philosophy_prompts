answer: |-
  This is one of the classic debates in sports: **Natural Feel vs. Technical Proficiency.**

  It is completely understandable why this bugs you. On the surface, it looks like unequal treatment for equal results. However, from a coaching and long-term development perspective, there are actually very logical reasons why your coach is handling you two differently.

  Here is the breakdown of why this is happening, whether it's "fair," and why understanding mechanics still gives you a massive advantage, even if the stats look the same right now.

  ### 1. The "If It Ain't Broke" Rule (Risk Management)
  Your teammate has achieved what psychologists call **Unconscious Competence**. She doesn't know *why* she makes it, her body just does it. This is the "flow state."

  For a coach, touching a natural shooter's mechanics is high-risk. If you tell a player who shoots on feel to "align your elbow," they often start thinking too much. They lose their rhythm, their shot becomes stiff, and their percentage drops. Coaches are terrified of "breaking" a natural shooter.

  You, on the other hand, are at **Conscious Competence**. You know *how* to do it, but you have to think about it. The coach sends you to clinics because they believe your mechanics *actually do have flaws* that need fixing to sustain your percentage, whereas your teammate's natural form is biomechanically efficient enough that fixing it isn't worth the risk.

  ### 2. The Slump Factor (Troubleshooting)
  This is the biggest argument for learning mechanics.
  *   **When your teammate goes cold:** If she misses 10 free throws in a row, she has no data. She can only say, "I don't feel it today." She has to wait for the feeling to come back, which is passive.
  *   **When you go cold:** You have a diagnostic toolkit. You can check your foot placement, your elbow alignment, your follow-through, your release point. You can actively troubleshoot *why* the shot is off.

  Understanding mechanics gives you a way to fix a slump *during* the game. Your teammate has to hope the slump fixes itself.

  ### 3. Fatigue and Pressure
  "Feel" is often the first thing to go when you are exhausted or in a high-pressure situation (like the last minute of a close playoff game). Adrenaline and fatigue mess with proprioception (your body's sense of position).

  Mechanics are a scaffold. When your legs are heavy in the 4th quarter, relying on "feel" might lead to a short shot. Relying on mechanical habits (like a deep dip or a specific follow-through hold) can help maintain consistency when your natural rhythm is compromised. Your coach might be prepping you for a higher workload or more pressure situations where that technical foundation will be necessary.

  ### 4. Ceiling and Adaptability
  Right now, your free throw percentages are identical. But basketball isn't static. Defenses get better, shots get more contested, and ranges extend.

  *   **Adaptability:** If you need to shoot off a screen, or pull up from three, mechanical understanding helps you adjust your force and arc quickly.
  *   **Longevity:** As you age and lose a step of quickness or jump height, mechanics allow you to compensate. Pure "feel" shooters sometimes struggle to adapt their shot as their athletic abilities change.

  The coach might see a higher *ceiling* for you if you master the tech, whereas your teammate might be closer to her natural limit.

  ### 5. Is it Fair?
  **In the short term? No.** It feels like punishment for you to do extra work when the results are the same.

  **In the long term? Yes.** The coach is investing in you. They are giving you the tools to be a student of the game. They are treating your teammate as a "finished product" regarding her shot, but they are treating *you* as a developer who can get better through study.

  ### The Verdict
  **Is it worth understanding the mechanics? 100% Yes.**

  There is a reason why the greatest shooters in history (like Steph Curry or Klay Thompson) obsess over mechanics *on top of* having natural feel. They combine the two.

  **My advice:**
  Stop looking at your teammate's lack of clinics as a privilege. Look at it as a vulnerability she will face later in her career. When she hits a month-long slump and doesn't know why, you will be the one who can self-correct.

  Embrace the clinics. Don't learn the mechanics to match her percentage; learn them so that when the pressure is highest and your legs are heaviest, you have a system to rely on when the "feel" isn't there. That is the ultimate competitive advantage.
