  Here is a joke designed to land with students who have grappled with *On the Plurality of Worlds*. It hinges on the indexical analysis of actuality, the lack of ontological privilege, and the resulting trivialization of the modal distinction.

  ***

  **The Metaphysician and the Geographer**

  An Actualist and a Lewisian Modal Realist are stuck in an airport during a blizzard. Their flight is canceled.

  **Actualist:** "This is a disaster. I'm *actually* going to miss my conference."

  **Lewisian:** "Strictly speaking, don't say 'actually.' It's misleading."

  **Actualist:** "How? It's happening. It's real."

  **Lewisian:** "It's real *here*. But 'actual' is just an indexical, like 'here' or 'now.' It doesn't mean 'ontologically privileged.' It just means 'in this world.'"

  **Actualist:** "So in other worlds, I made the conference?"

  **Lewisian:** "Exactly. In some worlds, the blizzard didn't happen. In those worlds, your counterpart is giving his talk right now. And from his perspective, *he* is 'actual.'"

  **Actualist:** "But *I'm* not him. I'm the one standing in this terminal."

  **Lewisian:** "You're the one *here*. But 'here' has no special status in the plurality of worlds. Your success is just as real as your failure; it's just located elsewhere."

  **Actualist:** "So when I say 'I actually exist,' I'm not saying anything about reality? I'm just pointing?"

  **Lewisian:** "Precisely. 'Actually' just filters for our location. It doesn't filter for existence. Everything exists."

  **Actualist:** "So the difference between 'possible' and 'actual'..."

  **Lewisian:** "...is just the difference between 'there' and 'here'."

  **Actualist:** "So your entire ontology—this massive proliferation of concrete universes—boils down to the claim that 'actual' is just a label for wherever we happen to be standing?"

  **Lewisian:** "Yes. It saves us from modal parochialism."

  **Actualist:** "It sounds like you haven't solved the problem of modality. You've just turned metaphysics into geography."

  ***

  ### Why this works for your students (The "Philosopher's Footnote")

  If you use this in class or office hours, you can unpack the references to ensure they get the full value:

  1.  **The Indexical Analysis:** Lewis famously argues that "actual" is indexical (*On the Plurality of Worlds*, p. 92). Just as "here" refers to the speaker's location without implying other locations don't exist, "actual" refers to the speaker's world without implying other worlds aren't real. The joke highlights how this strips "actual" of its intuitive modal force.
  2.  **Ontological Privilege:** The Actualist is operating with the pre-theoretic intuition that "actual" means "the only real one." The Lewisian denies this privilege. The humor comes from the Lewisian treating the cancellation of a flight as a merely local phenomenon in a sea of successful flights.
  3.  **Counterpart Theory:** The reference to the counterpart "giving his talk" nods to Lewis's denial of transworld identity. The Actualist is *here*; the successful version is a *counterpart* *there*.
  4.  **The Punchline ("Metaphysics into Geography"):** This targets the "Bonus Point" request. If "actual" is just "here," then the distinction between *possibility* and *actuality* collapses into a distinction between *locations*. This suggests Lewis hasn't explained modality; he's just spatialized it, which many critics argue trivializes the intuitive gap between what *is* and what *could be*.
