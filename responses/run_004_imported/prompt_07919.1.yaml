answer: |-
  Friends, family, neighbors. Thank you for being here.

  We gather today to mark the end of a life. That is the simple fact of it. But anyone standing in this room knows that there are no simple facts when it comes to the life of my grandfather.

  I stand here as his grandson. I know the man who taught me how to tie a tie, who sat at the head of the table on Sundays, whose hands shook a little in his later years when he held his coffee cup. I know the quiet of his study, the smell of his pipe tobacco, and the way he looked at me when I told him I was going to law school. He smiled then. A small, tight smile. He told me, "Study hard. The world needs order."

  But I also know that for many of you, he is not just a grandfather. He is a symbol. He is a reminder of a wall that divided a city, a country, and the world. He is a reminder of a shot that was fired, a life that was taken, and a trial that followed decades later.

  I am aware that this room is not united in how it remembers him. I know that for some, his passing is a cause for grief. For others, it is a cause for relief, or perhaps for a quiet reaffirmation of a judgment made long ago. I know that half of you hear his name and think of duty. The other half hears it and thinks of guilt.

  I am not standing here to change your minds. I am not a judge, and this is not a courtroom. I am a grandson, and this is a funeral.

  In my studies, I have learned that the law is a tool we use to draw lines. It tells us where permission ends and prohibition begins. It tries to separate what is legal from what is right. My grandfather lived his life inside one of those lines. He wore a uniform. He stood at a border. He followed the commands given to him by the state he served. When the world changed, when the wall fell and the laws were rewritten, he was told that the line he had stood on was illegitimate. He was told that a command from a state can be so wrong that it ceases to be a command at all, that it becomes a crime.

  He accepted his conviction. He did not fight the verdict in the end. But he never changed his story. He believed, until the day he died, that he was a soldier doing what soldiers are told to do. He believed that without order, there is only chaos.

  I do not stand here to argue that he was right. The court has spoken, and history has spoken. A man died at that wall, and that man's family carries a grief that no eulogy can touch. I want to acknowledge that pain. It exists in the shadow of this day, and it deserves respect. The tragedy of the Berlin Wall was not just that it stood, but that it turned ordinary men into instruments of a policy that the rest of the world deemed monstrous.

  But I also stand here to say that a human being is more than his worst moment, and he is more than his legal verdict.

  If we define people solely by the judgments passed upon them, we lose the complexity of life. My grandfather was a man who lived in a system that demanded he surrender his conscience to the state. He did so. That is his burden to carry, and he carried it. I saw him carry it. I saw the silence that would fall over him when the news showed footage of the wall. I saw the way he would change the subject when the trial was mentioned. It was not guilt that silenced him, I don't think. It was the exhaustion of being a small man caught in a great historical grinding stone.

  He was convicted of a crime. He was also a man who loved his wife, who raised his children, who played with his grandchildren on the floor. Both of these things are true.

  It is tempting, especially for someone like me who studies the law, to try to resolve this tension. To find the argument that makes it all make sense. To explain why he followed the law, or why the law condemned him. But the law is not designed to write eulogies. The law deals in categories: guilty, not guilty, liable, exempt. Life does not fit in those boxes.

  Grief does not care about jurisprudence. Love does not care about statutes of limitation.

  To those of you who view him with anger: I hear you. Your anger is valid. It is rooted in a belief that some lines should never be crossed, no matter what uniform you wear. I do not ask you to forgive him. That is not mine to give, and perhaps not yours.

  To those of you who view him with defense: I hear you, too. You see a man scapegoated by history, a soldier punished for the collapse of an empire. I do not ask you to vindicate him. The past is done.

  I ask only that for these few minutes, we allow him to be simply human.

  We are here to mourn the loss of a life. We are here to acknowledge that death is the one verdict that applies to us all, regardless of what we did in life. When he died last week, the soldier died. The defendant died. The convict died. What remains is the memory of a man who is now beyond the reach of courts, beyond the reach of borders, and beyond the reach of the laws that governed him so strictly.

  I loved him. I love him still. I know the stories. I know the history. I know the legal theories that justify his punishment and the ones that explain his defense. I know that there is a formula scholars use to decide when a law is too wicked to be obeyed. I study it in class. But when I sit at this table, when I look at his empty chair, those theories fall away.

  There is only the absence.

  So, let the historians argue about the era. Let the lawyers debate the trial. Let the politicians speak about the wall.

  Today, we are just the people who knew him. We are the ones who remember the sound of his voice, the warmth of his hand, the weight of his silence. We are the ones who know that even a man who made a terrible mistake can be loved by his family. Even a man who lost his way in a wicked system can be mourned by his grandson.

  We lay him to rest not as a symbol, but as a man. Flawed. Complicated. Human.

  May he find the peace in death that was often elusive to him in life. May he find a place where there are no borders, no uniforms, and no orders to follow.

  Rest now, Opa. The watch is over.

  Thank you.
