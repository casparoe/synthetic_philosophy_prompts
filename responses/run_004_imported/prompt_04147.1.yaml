      *   Actually, the standard solution (Hall/Thau) is to distinguish between "Chance" and "Credence" by modifying PP to the "New Principle" (NP). $Cr(F | T_w) = P(F | T_w)$. Since $T_w$ entails $\neg F$ (roughly), $P(F | T_w) = 0$. This dissolves the contradiction by admitting that knowing the chance theory gives you inadmissible information about the future.
