      *   **Comment 3: Charitable Reconstruction.**
          *   *Goal:* Save "Kantianism for people, utilitarianism for animals" without speciesism or full aggregation.
          *   *Idea 1: Threshold Views.* (Already discussed and critiqued).
          *   *Idea 2: Relational/Social Contract.* (Not Nozickian).
          *   *Idea 3: Graded Side Constraints.* Instead of "Rights vs. No Rights," maybe "Strong Constraints vs. Weak Constraints." This avoids the binary collapse. Animals have constraints (can't torture for fun), but they can be outweighed by significant human interests (food, research). This isn't pure utilitarianism; it's a weighted deontology.
