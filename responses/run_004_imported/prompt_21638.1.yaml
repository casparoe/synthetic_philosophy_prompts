          *   *Marginal Cases:* Nozick's "species typical" or "kind" response is widely regarded as weak (speciesism). The user's critique here is standard and strong.
          *   *Utility Monster:* This is the more original part of the user's essay. If aggregation is morally toxic because it sacrifices the individual, why is it less toxic for animals? If the answer is "they aren't ends-in-themselves," we are back to the capacity problem.
          *   *Nozick's Resources:* Can he answer? He might say side constraints are *binary* (you have them or you don't) based on a threshold. But the threshold problem remains. He might say the "Utility Monster" works against utilitarianism *for beings with rights*. If animals don't have rights, utilitarianism applies. But that begs the question.
