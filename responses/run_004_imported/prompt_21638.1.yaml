          *   *Best Bet:* "Weighted Side Constraints." Nozick hints at this. It avoids the "Utility Monster" for animals because there are still *constraints* (no torture for fun), just not *absolute* ones. This distinguishes it from pure utilitarianism (where anything goes for enough utility). It distinguishes it from speciesism by grounding the weight in capacities (sentience + agency) without making it binary.

  5.  **Refining the Output:**
