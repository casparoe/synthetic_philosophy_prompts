      *   *Critique 1 (Marginal Cases):* The capacity (rational self-direction) comes in degrees. Some animals > some humans (infants, cognitively impaired). If capacity matters, marginal humans lose protection. If species matters, it's arbitrary speciesism.
      *   *Critique 2 (Utility Monster/Internal Consistency):* Nozick rejects utilitarianism for humans partly due to the "utility monster" (aggregation justifies sacrifice). But he allows aggregation for animals. If aggregation is bad *in principle* because of what it allows, why is it okay for animals? The capacity distinction must bear all the weight, leading back to Critique 1.

  3.  **Fact-Check/Reconstruction (Mental Retrieval & Verification):**
      *   *Source:* *Anarchy, State, and Utopia*, Chapter 3 ("Moral Constraints and the State"), specifically the section "Why Side Constraints?" and the footnote/aside regarding animals.
      *   *Key Text:* pp. 39-42 (roughly). Nozick asks: "What limits may we place on the treatment of animals?"
      *   *Nozick's Stance:* He *does* raise the problem. He explicitly asks what characteristics give rise to side constraints. He lists: rationality, free will, moral agency, soul, etc. He admits none are fully satisfactory.
      *   *Animals:* He says, "Utilitarian theory is embarrassed by the possibility of utility monsters... [but] animals don't have the same status." He explicitly considers the utilitarian calculation for animals.
      *   *The "Two-Tier" Claim:* Does Nozick *endorse* "Kantianism for people, utilitarianism for animals"? He *presents* it as a view many hold (including himself tentatively), but he is famously agnostic/skeptical about the foundation. He writes: "I do not know the answer. I suspect it does not exist." He leans towards the idea that animals *do* have some constraints, just weaker ones, but he doesn't fully commit to a hard utilitarian calc for them. He actually suggests that perhaps *no* utilitarian calculation is permissible even for animals if it involves killing them for trivial gains, but he leaves it open.
      *   *Marginal Cases:* Nozick *does* explicitly raise the "marginal case" problem (infants, mentally retarded). He asks why they have rights if they lack the capacity. He suggests a "protective perimeter" around the typical case, or that we treat them as ends because they are of the *kind* that typically has these properties.
