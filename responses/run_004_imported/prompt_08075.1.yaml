answer: |-
  **Setting:** *A quiet corner of the conference center, following a panel on Moral Psychology and Behavioral Science. Dr. Elena Vance (Philosophy) and Dr. Marcus Thorne (Behavioral Economics) stand by a coffee station.*

  **Vance:** You dissolved the puzzle too quickly, Marcus. In your talk, you treated weakness of will as a mere calculation error. But the phenomenon we are trying to capture is the *conflict*. Take the dieter. She stands before the cake. Her hand reaches out. At that very moment, she says, "I know I shouldn't." If your hyperbolic discounting model is correct, that statement is a lie.

  **Thorne:** It's not a lie, Elena. It's a timestamp. When she says "I know I shouldn't," she is reporting the valuation of her self from yesterday, or perhaps her self from five minutes ago. But at $t_0$, the moment of the reach, the discount curve has crossed. The subjective value of the cake *has* overtaken the value of the diet. If the value is higher, the preference has changed. To say she "still judges the diet better" is to ignore the only metric that explains the action.

  **Vance:** But that destroys the concept of akrasia entirely. If the preference flips at $t_0$, then she is acting in accordance with her *current* all-things-considered judgment. She isn't weak-willed; she's just fickle. Davidson's point is that the judgment *persists*. The normative force of "I ought to diet" remains active, recognized, and authoritative, even as the hand moves against it. The tragedy of akrasia is that the agent remains a unified locus of responsibility who nonetheless fails to follow their own decree.

  **Thorne:** "Unified locus." There's the rub. You're assuming a sovereign. I'm looking at a parliament. In picoeconomics, the self is a succession of temporal agents. The "dieter self" and the "cake-eater self" are distinct stakeholders with different discount rates. The "I know I shouldn't" is the lobbying effort of the long-term stakeholder. It's a signal that loses the vote. You call it a persisting judgment; I call it a minority report.

  **Vance:** A minority report implies a democracy where the majority rules. But moral agency isn't a vote count. If I judge that $X$ is best, all things considered, that judgment is supposed to settle the matter. If I do $Y$ instead, I am not merely outvoting a part of myself; I am violating the logic of my own agency. If you say the judgment *changed* because the motivation shifted, you are reducing the "ought" to an "is." You're saying the strength of the impulse *constitutes* the judgment.

  **Thorne:** I'm saying the judgment *without* motivational force is a phantom. What is a "judgment" if it doesn't steer the ship? If your dieter says "Diet is better" but her dopamine system prices the cake at a premium, in what functional sense does she believe the diet is better? She believes it abstractly, perhaps. She can recite the proposition. But belief is dispositional. If the disposition to choose the diet vanishes at $t_0$, the belief has effectively suspended.

  **Vance:** That's the behaviorist trap. I can believe the bridge is safe while my legs freeze in fear. The judgment persists as a *reason*, even if it fails as a *cause*. The dieter feels regret *while* eating the cake. If her judgment had truly flipped to favor the cake, why the regret? Regret signals a discrepancy between action and standing standard. Your model predicts satisfaction at $t_0$ followed by regret at $t_1$. But the phenomenology is often conflict at $t_0$. The "I know I shouldn't" is experienced as a barrier she is actively breaking through, not a obsolete sign she's walking past.

  **Thorne:** The conflict is real, I grant you that. But the location of the conflict is different. For you, it's inside a single mind violating its own rules. For me, it's between two selves bargaining over a common resource (the body). The "conflict at $t_0$" is the friction of the long-term system trying to impose a pre-commitment strategy that the short-term system has just bypassed. The "I know I shouldn't" is the sound of the long-term system realizing its leverage has failed. It hasn't changed its mind; it's just lost its bargaining power.

  **Vance:** Lost bargaining power to whom? To herself? If it's herself, we are back to unity. If it's a different self, then who is responsible for the eating? The $t_0$ self? Then why punish the $t_1$ self with guilt? We hold the person responsible because we assume the judgment that condemned the cake was *hers* at the moment of eating. Your model fragments the agent so thoroughly that responsibility dissolves into a chain of causality.

  **Thorne:** Responsibility doesn't dissolve; it relocates. It becomes about managing the bargaining environment. But let's get to the crux. You insist the judgment persists. I insist the valuation shifts. We are describing the same neural event. Why does your description win?

  **Vance:** Because your description makes the action rational. If the curve crosses, eating the cake is the utility-maximizing move for the $t_0$ self. It's instrumentally rational. But akrasia is *irrational*. It is acting against one's own better judgment. If you explain it away as rational maximization for a temporal slice, you have explained the *behavior*, but you have explained away the *akrasia*. You've changed the subject.

  **Thorne:** And if you keep the judgment persisting, you have to explain how a rational agent intentionally chooses what they deem worse. Davidson calls it "incontinence." I call it a market correction. But fine. Let's pin this down. You say the judgment persists but is overridden. I say the judgment changes because the valuation changes. What is the empirical or conceptual difference?

  **Vance:** The difference is the status of the *reason*. In my view, the reason "health is better than pleasure" retains its *authority* even when it loses its *efficacy*. The agent acknowledges the authority. That's why she says "I shouldn't." In your view, authority is identical to efficacy. If the reason doesn't move the muscles, it has ceased to be a operative judgment.

  **Thorne:** So the distinction is normative versus functional. You care about the space of reasons; I care about the space of causes.

  **Vance:** Precisely. But it's deeper. It's about whether the "all-things-considered" judgment is a *verdict* or a *bid*. For Davidson, it's a verdict. It closes the deliberation. When I act against it, I am acting without a reason, or against my reason. It is a failure of rationality. For you, the judgment is just a bid in an ongoing auction. As the time horizon shrinks, the bids change. The "verdict" is never final until the action is complete.

  **Thorne:** I can accept that distinction. But here is where I press you back. If the verdict is final, why does it fail to execute? If the agent is unified, the verdict *is* the command. If the command isn't executed, either the agent isn't unified (my view) or the verdict wasn't actually "all-things-considered" (your view). You say the dieter judges the diet better *all things considered*. But if the "thing" of immediate pleasure is weighing on the scale at $t_0$, and she chooses the cake, didn't she implicitly re-weight the scale?

  **Vance:** No. That is the seduction of your model. To say she re-weighted the scale is to say she changed her mind about the *value* of health versus pleasure. She didn't. She acknowledges health is more valuable. She simply succumbs to the *proximity* of the pleasure. The discount curve explains the *pull*, but it doesn't explain the *assent*. In akrasia, the agent assents to the action while dissenting from its value. Your model says the assent proves the value shifted. My model says the assent proves the will fractured.

  **Thorne:** "The will fractured." That's poetic, Elena. But "fractured" implies pieces. Pieces imply multiple selves.

  **Vance:** It implies a failure of integration, not necessarily distinct ontological entities. But look at where we land. The distinction between "judgment persisted" and "judgment changed" rests on whether we treat the verbal report "I know I shouldn't" as evidence of a *standing normative commitment* or as *data about a competing preference system*.

  **Thorne:** And whether we think explaining the action requires making the agent *intelligible* or *predictable*.

  **Vance:** Exactly. If I want to understand the *meaning* of the action for the agent, I must assume the judgment persisted. Otherwise, there is no struggle, only a shift. If I want to *predict* the action, I must assume the judgment shifted with the curve. Otherwise, the prediction fails.

  **Thorne:** So we aren't disagreeing about the cake. We're disagreeing about whether the "I" in "I know I shouldn't" is the author of the action or a witness to it.

  **Vance:** If the "I" is merely a witness, Marcus, then who is the author?

  **Thorne:** The moment.

  **Vance:** *[Pauses, picking up her coffee]* Then we have reached the limit of the bargain. I cannot accept an agent who is only the moment. You cannot accept a judgment that does not rule the moment.

  **Thorne:** And yet, the dieter eats the cake.

  **Vance:** Yes. And tomorrow, she will diet. Which suggests my "persisting judgment" has more staying power than your "momentary self."

  **Thorne:** Or it suggests the long-term self has learned to adjust its bidding strategy. We'll see who predicts the breakfast choice.

  **Vance:** And we'll see who can account for the guilt.

  *[They nod, a stalemate of frameworks, and turn back toward the main hall.]*
