answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-CS-44 and Future "Substantial Similarity" Standards

  **Purpose**

  This memo outlines my recommendation for the disposition of Case #2023-CS-44 (the 42% similarity flag) and proposes a procedural framework for handling future cases involving vague policy language. My position is that the Board must distinguish between *retrospective adjudication* (judging past conduct) and *prospective rule-making* (setting future standards). Conflating these two functions is the source of our current deadlock.

  **Recommendation on Case #2023-CS-44**

  **Verdict: Not Responsible.**

  The policy prohibits work that is "substantially similar." In the absence of a defined numerical threshold or specific qualitative criteria established *prior* to the submission of these assignments, a 42% similarity score falls within the "penumbra" of the term "substantial."

  While 10% similarity is clearly permissible and 95% is clearly a violation, 42% is indeterminate. In introductory CS courses, similarity scores in this range often result from shared boilerplate code, constrained problem sets, or common logic structures rather than illicit collaboration. Because the students did not have fair notice that 42% constituted a violation—and because the Board cannot demonstrate that past rulings have consistently treated 42% as a violation—we cannot satisfy the burden of proof required for an integrity violation. To rule otherwise would be to punish the students for a boundary that existed only in our hindsight, not in their foresight.

  **Recommendation on General Procedure**

  **Adopt a Policy of "Prospective Precisation."**

  The Board should adopt a two-tiered approach to vagueness in the handbook:

  1.  **Retrospective Leniency:** In any case where the policy language is vague (e.g., "substantial," "excessive," "significant") and no prior precedent has firmly established a boundary, the benefit of the doubt must go to the student. We cannot mine past cases to discover a "hidden" fact about where the line *really* was, because no such fact exists.
  2.  **Prospective Stipulation:** For future terms, the Board must vote to stipulate specific, operational thresholds (e.g., "Similarity scores above 50% trigger a mandatory qualitative review," or "Scores above 60% are *prima facie* evidence of violation").

  We must accept that any number we pick (50%, 55%, 60%) is somewhat arbitrary. However, arbitrary rules are preferable to vague ones *going forward*, provided they are communicated clearly to the student body before assignments are submitted.

  **Addressing the Strongest Objection**

  I anticipate the strongest objection to this proposal will come from the faction that argues we should simply stipulate a threshold *now* and apply it to the current case. The argument will be: *"Waiting to set a standard until the next term abdicates our responsibility. We need to resolve the vagueness today to ensure consistency. If we don't pick a number now, we are admitting the policy is meaningless."*

  This objection is compelling because it prioritizes institutional consistency and clarity. However, it fails on the grounds of **fair notice**.

  If we stipulate a 50% threshold today and apply it to the 42% case, we are engaging in retroactive rule-making. We are effectively saying, "The law was always 50%, you just didn't know it." This is the epistemicist error: assuming there is a sharp, metaphysical fact about "substantial similarity" hidden in the universe (or in the Chair's intent) that we are merely discovering. There is no such fact. The meaning of "substantial" is constituted by our usage. If we change our usage today, that new meaning cannot apply to conduct that occurred yesterday.

  Furthermore, the objection that this "relocates the fight one level up" (i.e., we will still disagree on whether the new threshold should be 50% or 55%) is correct, but it is not a fatal flaw. It is a feature of governance. Disagreement on where to draw a bright line is resolved by voting. Disagreement on where a *hidden* line exists is resolved by endless speculation. We should vote on a future standard because we have the authority to make rules; we should not pretend to discover past standards because we do not have the authority to rewrite history.

  **Conclusion**

  We cannot punish the students in Case #2023-CS-44 without violating the principle that rules must be knowable before they are enforced. I move that we find them Not Responsible due to insufficient evidence of *substantial* similarity under the current vague standard. Simultaneously, I move that we form a subcommittee to draft a precise "Similarity Threshold Policy" for the Spring term, acknowledging that while the specific number we choose will be arbitrary, it will be *our* arbitrary choice, made public and applied fairly going forward.

  Respectfully submitted,

  [Your Name]
  Student Representative
