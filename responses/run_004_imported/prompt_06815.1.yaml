answer: |-
  It is a pleasure to engage with a colleague who brings genuine comparative physiological expertise to the philosophy of mind. Your skepticism regarding the "grain" of selection history is well-founded; it is often termed the **Indeterminacy of Selection** problem, and it remains one of the most persistent challenges for selected-effects semantics. While teleosemanticists (particularly Millikan) have developed sophisticated replies involving the "consumer" side of representation and "Normal conditions," many critics suspect these moves shift the burden rather than discharge it.

  Per your request, I will construct a fresh example drawn from sensory physiology that avoids the standard frog/bacteria tropes, outline the candidate contents, and evaluate whether the teleosemantic toolkit resolves the indeterminacy or merely relocates it.

  ### The Example: Active Electrolocation in Mormyrid Fish

  Consider the weakly electric fish, *Gnathonemus petersii* (the elephantnose fish). This species generates a weak Electric Organ Discharge (EOD) and uses an array of tuberous electroreceptors distributed over its skin to detect perturbations in the self-generated electric field. This is an active sensing system, analogous to echolocation but using near-field electrostatics.

  **The Mechanism:**
  When the fish swims over a muddy riverbed, objects with electrical conductance different from the background sediment distort the EOD field lines. These distortions change the timing and amplitude of the receptor potentials in the electroreceptor afferents. The fish's brain processes this spatiotemporal pattern to localize and identify objects.

  **The Selection History:**
  In the Environment of Evolutionary Adaptedness (EEA)—the turbid, freshwater habitats of central Africa—specific patterns of field distortion were highly correlated with the presence of chironomid larvae and other benthic invertebrates buried in the sediment. Detecting these objects allowed the fish to feed; failing to detect them resulted in starvation; striking at non-food objects wasted energy and increased predation risk. Over generations, the neural mechanisms mapping specific field perturbations to strike commands were selected for.

  ### The Candidate Contents

  When a specific neural state $N$ is activated by a field perturbation $P$, what does $N$ represent? Selection history confirms $N$ was selected because it indicated conditions leading to fitness. However, in the EEA, the following three descriptions were co-extensive. Selection acted on the correlation, not the description.

  1.  **The Distal/Biological Content:** "Edible prey is present at location $L$."
      *   *Justification:* This is the condition that explains the fitness benefit. If $N$ fires, the fish *should* eat. This is the "success condition."
  2.  **The Intermediate/Ecological Content:** "A conductive object of volume $V$ is embedded in the substrate at location $L$."
      *   *Justification:* This is the physical property that actually causes the field distortion. It is more general than "prey" (could be a stone) but more specific than raw sensory data. It is the invariant ecological affordance.
  3.  **The Proximal/Physiological Content:** "A specific spatiotemporal pattern of afferent discharge has occurred in the electrosensory lateral line lobe (ELL)."
      *   *Justification:* This is the condition the mechanism is *physically* keyed to. The nervous system has no access to "prey" or "conductivity" except via this discharge pattern. In the EEA, this pattern never occurred without the prey.

  ### The Teleosemantic Response and Its Limits

  A Millikan-style teleosemanticist will argue that content is fixed not just by the producer of the signal (the sensory system), but by the **consumer** (the motor/feeding systems) under **Normal Conditions**.

  **The Move:**
  They would argue that the "Proper Function" of the neural state $N$ is to guide the feeding system to food. Therefore, the content must be **Candidate 1 ("Edible prey")**.
  *   **Why?** Because the consumer system is designed to digest prey, not conductive stones.
  *   **The Role of "Normal Conditions":** Millikan defines "Normal conditions" as the conditions under which the mechanism historically performed its proper function. Since the proper function is feeding, Normal conditions *entail* the presence of food. Therefore, if $N$ fires in the presence of a conductive stone (a common experimental probe), the representation is **false**. It represents "Prey," but there is no prey. This preserves the possibility of error, which is essential for a theory of content.

  **The Critique: Relocation of Indeterminacy**
  Does this resolve the problem, or merely relocate it? I argue it **relocates the indeterminacy** to the definition of "Proper Function."

  1.  **Circularity of Normal Conditions:**
      To rule out Candidate 2 (Conductive Object) and Candidate 3 (Afferent Pattern), the teleosemanticist must stipulate that the Proper Function is *feeding* rather than *striking at conductive distortions*. But why is the function feeding? Because that is what conferred fitness. But what conferred fitness was the *correlation* between the distortion and the food.
      If we define the Proper Function as "Coordinating motor output with electroreceptor input to maximize energy intake," Candidate 2 becomes viable. A conductive stone *is* a conductive object. If the fish strikes it, the system has correctly identified a conductive object, but the *consequence* is negative. The teleosemanticist must insist that the function is defined by the *distal outcome* (nutrition), not the *proximal coordination*. This looks like a stipulation designed to save the theory from the disjunction problem, rather than a fact derived from the selection history itself.

  2.  **The Physiological Reality:**
      From a comparative physiology standpoint (as you know well), the organism interacts with Candidate 3 (Afferent Pattern) to infer Candidate 2 (Conductivity). It has no biological "hook" onto Candidate 1 (Edibility) except via the correlation with 2.
      If the teleosemanticist says the content is Candidate 1, they are claiming the neural state carries information about *nutritional value*. But the electrosensory system does not detect nutrition; it detects impedance. To say it represents "Prey" is to say it represents a property (edibility) that is causally downstream of what it actually detects.
      While Millikan allows this (the "map" doesn't need to resemble the territory), it requires us to accept that selection history can fix content at a level of description (edibility) that is causally invisible to the mechanism, solely because that description matches the *consumer's* needs.

  3.  **The Residual Indeterminacy:**
      Even granting the "consumer" fix, we are left with a choice between **Candidate 1 (Prey)** and **Candidate 2 (Conductive Object)**.
      *   If Content = Prey: The system misrepresents when it strikes a metal coin (false positive).
      *   If Content = Conductive Object: The system represents accurately when it strikes a metal coin (true positive), but the *consequence* is maladaptive.
      Teleosemantics *must* choose Candidate 1 to allow for misrepresentation. But selection history alone does not privilege Candidate 1 over Candidate 2. Both were equally reliable indicators of fitness in the EEA. The choice of Candidate 1 is driven by the philosophical requirement that representations must be capable of falsehood, not by the biological facts of the selection history.

  ### Conclusion

  In the case of *Gnathonemus*, selection history establishes a correlation between **Afferent Pattern**, **Conductive Object**, and **Edible Prey**. It does not, on its own, specify which of these constitutes the *content*.

  The standard teleosemantic move (appealing to Proper Function and Normal Conditions) resolves the indeterminacy only by **defining** the Proper Function in terms of the distal outcome (feeding) rather than the proximal trigger (conductivity). While this yields the intuitively correct result (that striking a coin is an error), it does so by importing a normative distinction (success vs. trigger) that is not present in the selection history itself.

  Thus, the indeterminacy is not solved; it is **relocated** from the selection history to the definition of "Proper Function." For a physiologist, this may feel like saying the content is "Prey" because that is what we *want* the theory to say to preserve the notion of truth conditions, rather than because the selection history objectively distinguishes "Prey" from "Conductive Object." The selection pressure sees only the covariance; the teleosemanticist imposes the grain.
