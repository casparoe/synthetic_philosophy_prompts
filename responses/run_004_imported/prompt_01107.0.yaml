answer: |-
  This is a fantastic rabbit hole to fall down. You have correctly identified the tension that keeps philosophers of social ontology up at night: **Is Lewis actually explaining anything new, or is he just putting a tuxedo on a concept we already understand intuitively?**

  Here is the breakdown of Lewis's technical machinery versus the folk concept of a "social norm," followed by the verdict on Margaret Gilbert's criticism.

  ### 1. Lewis vs. The Folk Concept: Is there a difference?

  Your intuition is half-right. In everyday speech, "convention," "custom," and "social norm" are used interchangeably. But Lewis is trying to carve out a **specific subset** of norms using game theory.

  **The Folk Concept ("Social Norm"):**
  *   **Scope:** Massive. Includes moral rules (don't murder), etiquette (don't chew with mouth open), and coordination habits (drive on the right).
  *   **Mechanism:** "Because that's what we do." Often implies an external pressure or a vague sense of "ought."
  *   **Arbitrariness:** Not required. "Don't murder" is a norm, but it's not arbitrary (we wouldn't be fine if everyone agreed to murder on Tuesdays).
  *   **Motivation:** Can be moral, fear of punishment, or habit.

  **Lewis's Technical Account ("Convention"):**
  *   **Scope:** Narrow. Only applies to **coordination problems**.
  *   **Mechanism:** Conditional preference. "I prefer to do X *if and only if* I expect you to do X."
  *   **Arbitrariness:** **Required.** There must be an alternative (driving on the left) that would have worked just as well.
  *   **Motivation:** Self-interest aligned with others' interests (Coordination Equilibrium).

  **The "Special Sauce" of Lewis's Machinery:**
  So, what does the game-theory apparatus buy us that the folk version doesn't? Three things:

  1.  **It explains stability without authority.**
      The folk view often implies norms exist because "society" enforces them. Lewis shows how a convention can emerge and sustain itself among purely self-interested agents with no central ruler. We don't drive on the right because the government told us to (originally); we do it because driving on the left gets us killed. The game theory explains *how* the equilibrium holds without a police officer on every corner.
  2.  **It solves the "Infinite Regress" of expectations.**
      This is where **Common Knowledge** does the heavy lifting.
      *   *Folk view:* "I do it because you do it."
      *   *Problem:* But what if you think *I* think *you* are going to switch?
      *   *Lewis:* Common knowledge cuts the knot. It's not just that I know the rule; it's that I know that you know that I know. This creates a "focal point" (Schelling point) that makes the convention resilient to doubt. It explains why conventions don't collapse every time someone tries a deviation.
  3.  **It distinguishes Conventions from Moral Norms.**
      This is crucial for your piece. Lewis's definition filters out moral rules.
      *   *Example:* "Don't steal" is a social norm. But it is **not** a Lewisian convention. Why? Because it isn't arbitrary. We wouldn't be happy if everyone agreed to "steal on Tuesdays."
      *   *Example:* "Reply All" vs. "Reply" in emails. This **is** a Lewisian convention. It's arbitrary (either works), but we need to match to avoid chaos.
      *   *Value:* Lewis gives you a scalpel to separate "things we do because they are right" from "things we do because we need to match."

  ### 2. The Margaret Gilbert Objection: The "Normative Force" Gap

  You stumbled onto one of the most famous critiques in social philosophy. Gilbert's argument is essentially: **Lewis explains why we *do* it, but not why we feel *bad* when we don't.**

  **Lewis's Account (Prudential):**
  For Lewis, if you drive on the left in a right-hand traffic country, you are being **irrational** or **imprudent**. You are frustrating your own desire to not crash. If I get mad at you, it's because you endangered me. The "obligation" is derived from self-interest.

  **Gilbert's Account (Joint Commitment):**
  Gilbert argues that when we enter a convention, we form a "plural subject." We make a tacit joint commitment.
  *   If you break a Lewisian convention, I think: "Wow, that was stupid of you."
  *   If you break a Gilbertian convention, I think: "You wronged *us*."

  **The "Per My Last Email" Example:**
  *   **Lewis:** I write "per my last email" because I expect you to read it as "I already told you," and I prefer that interpretation so we don't waste time. If you ignore it, you're being inefficient.
  *   **Gilbert:** By using that phrase, we are upholding a joint commitment to professional hierarchy and record-keeping. If you ignore it, you aren't just being inefficient; you are violating our shared agreement on how we relate to one another. You have breached a duty.

  **Is the criticism fair?**
  Yes, but it depends on what you want the theory to do.
  *   If you want to explain **how conventions emerge and persist** among strangers, Lewis wins. His model is better at explaining how traffic rules happen without a meeting.
  *   If you want to explain **the phenomenology of obligation** (why we feel entitled to rebuke someone), Gilbert wins. Lewis struggles to explain why we feel *morally* indignant about arbitrary things (like queue-jumping) rather than just annoyed at the inefficiency.

  ### 3. The Plain-English Version for Your Editor

  Here is how you can distill this for the piece without losing the nuance:

  > "We tend to think of social habits as unwritten rules enforced by peer pressure. But philosopher David Lewis argued that's too vague. He proposed that true 'conventions' are actually solutions to coordination puzzles.
  >
  > Think of it like this: A social norm is any rule society follows (like 'be kind'). A Lewisian convention is a specific type of norm where the only reason to follow the rule is that everyone else is following it (like 'drive on the right').
  >
  > Lewis used game theory to show that these don't require authority to exist. They stick because they reach a 'stable equilibrium'—I follow the rule because I expect you to, and I know you expect me to. This 'common knowledge' locks the habit in place.
  >
  > However, critics like Margaret Gilbert point out a gap in Lewis's theory. Lewis explains why it's *stupid* to break a convention (you cause a crash), but he doesn't fully explain why it feels *rude* or *wrong*. He treats conventions like traffic patterns; Gilbert argues they function more like tacit promises. For your article, the distinction matters: Lewis explains the mechanics of the habit, but Gilbert explains the emotional sting when someone breaks it."

  ### Summary Verdict

  *   **Is Lewis just restating the folk concept?** No. He is narrowing it to **arbitrary coordination equilibria**. This allows him to separate etiquette/traffic (conventions) from morality/law (norms).
  *   **What does the machinery buy?** It explains **spontaneous order**. It shows how complex social coordination happens without a "social contract" or a king.
  *   **Does Gilbert destroy Lewis?** No, she complements him. Lewis describes the **engine** (self-interested coordination); Gilbert describes the **steering** (joint commitment/obligation). For a piece on office culture or tipping, you probably need Lewis to explain *why* the habit exists, but Gilbert to explain why people get angry when you tip 10% instead of 20%.

  If your piece is about why these habits feel **mandatory**, Gilbert is actually the more useful theorist. Lewis explains why the habit is *stable*, but Gilbert explains why the habit feels *binding*.
