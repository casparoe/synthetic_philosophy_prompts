prompt: |-
  I recently retired from international-level rifle competition and, somewhat to my surprise, was just elected to my national shooting federation's therapeutic use exemption panel for a three-year term — a seat that had always seemed like a formality when I was competing, and that I only really understand now that I'm the one voting. My first case landed on my desk last week, and after several days of back-and-forth with the other panel members by email, I've realized none of us can actually articulate a principled basis for the position we're each leaning toward, so I want to work out something more careful before we reconvene.

  The case: a nineteen-year-old member of our national air-rifle team was diagnosed two years ago, well before she made the national team, with an anxiety disorder that produces panic symptoms in ordinary life — she describes it flaring up during university exams and at family gatherings, nothing to do with sport. Her physician, who has no connection to shooting, prescribed a low daily dose of propranolol, a beta-blocker, which she has now taken for two years with clear benefit to her day-to-day functioning. Beta-blockers happen to be on our sport's prohibited list at all times, because they steady the hand and slow the heart rate in exactly the way that decides a 10-metre air rifle final; without an exemption she cannot compete while medicated. Our exemption standard, which tracks the international anti-doping code fairly closely, is supposed to require a genuine diagnosed condition, no reasonable alternative treatment, and — this is where we keep getting stuck — reasonable confidence that the substance won't enhance performance beyond what a return to ordinary health would give any competitor anyway. Half the panel thinks this is a straightforward case, no different from letting a diabetic athlete use insulin: she has a real, independently documented illness and takes an ordinary therapeutic dose, so it would be indefensible to make her choose between her mental health and her sport. The other half points out that in most sports the condition being treated is irrelevant to the skill being scored, whereas here the whole discipline is a competition in who can hold still and stay calm, so "restoring her to normal function" and "improving the exact trait we are judging" might just be the same event described two different ways — and no amount of sincerity about her diagnosis changes that.

  Could you draft the memo I'll bring back to the panel? I need an actual recommendation — grant, deny, or grant with specific conditions (dose caps, a requirement to exhaust non-pharmacological alternatives first, an independent annual re-certification, a defined review period, or whatever you think defensible) — with reasoning developed enough that whichever side loses can recognize that its strongest point was actually engaged rather than just waved at.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Recently retired international rifle competitor, newly elected to the National Shooting Federation's Therapeutic Use Exemption (TUE) panel.
      *   **Task:** Draft a memo to the panel regarding a specific TUE case.
      *   **The Case:** 19-year-old air rifle athlete. Diagnosed with anxiety disorder (panic symptoms) 2 years ago (pre-national team). Prescribed propranolol (beta-blocker) by independent physician. Medication helps daily life (exams, family), not just sport. Beta-blockers are prohibited *at all times* in shooting because they steady hand/heart rate (core skill).
      *   **The Conflict:** Panel is split.
          *   *Side A (Grant):* Genuine illness, therapeutic dose, unfair to force choice between health and sport (analogy to insulin/diabetes).
          *   *Side B (Deny):* In shooting, treating anxiety *is* enhancing performance because the sport *is* about stillness and calm. "Restoring to normal" = "Enhancing specific trait judged."
      *   **The Standard:** Genuine diagnosed condition, no reasonable alternative, confidence that substance won't enhance performance *beyond* a return to ordinary health.
      *   **Requirement:** Actual recommendation (Grant/Deny/Conditional) with robust reasoning that acknowledges the strongest points of the opposing view. Needs to be principled, defensible, and professional.

  2.  **Deconstruct the Ethical and Regulatory Problem:**
      *   **The Core Tension:** Medical necessity vs. Integrity of Competition.
      *   **The Specific Drug:** Propranolol. It's not a stimulant; it's a beta-blocker. It reduces physiological arousal (heart rate, tremor).
      *   **The Specific Sport:** Air Rifle. Precision depends on physiological stability (heart rate, tremor).
      *   **The Specific Condition:** Anxiety Disorder. It causes physiological arousal.
      *   **The Paradox:** Treating the condition *physiologically* mimics the desired state of the athlete. If a "normal" shooter has a heart rate of 60 and tremor X, and the anxious shooter has 90 and tremor 2X, propranolol brings them to 60 and tremor X. But if the "normal" shooter *also* takes propranolol, they might go to 50 and tremor 0.5X.
      *   **The WADA/International Standard:** The key criterion is "no additional enhancement beyond a return to normal health."
      *   **The Precedent:** Insulin for diabetes is the classic example. Diabetes is a metabolic deficit. Insulin restores normal metabolism. It doesn't make the muscles work *better* than a non-diabetic; it makes them work *normally*. Does propranolol do the same for anxiety in shooting?
      *   **The Risk:** If we grant this, do we open the door for every nervous shooter to claim anxiety? (Malingering risk).
      *   **The Human Element:** The athlete has a documented history *prior* to elite status. This reduces (but doesn't eliminate) the risk of fabrication for competitive gain.

  3.  **Evaluate the Options:**
      *   *Option 1: Outright Denial.*
          *   *Pros:* Protects the integrity of the sport absolutely. Avoids the "chemical steadiness" issue.
          *   *Cons:* Discriminates against athletes with legitimate medical conditions. Forces athlete to quit or suffer health consequences. Contradicts the spirit of inclusion in anti-doping codes (which generally allow TUEs for genuine need).
      *   *Option 2: Outright Grant.*
          *   *Pros:* Supports athlete health. Acknowledges pre-existing condition.
          *   *Cons:* Ignores the unique overlap between the treatment effect and the performance metric. Hard to defend against the "enhancement" critique.
      *   *Option 3: Conditional Grant (The Middle Path).*
          *   *Pros:* Acknowledges medical need while mitigating performance advantage risks. Shows due diligence.
          *   *Cons:* More administrative burden.
          *   *Specific Conditions:*
              *   Verify diagnosis (independent psych eval).
              *   Verify necessity (failed CBT/other meds?).
              *   Monitor dosage (keep at minimum effective dose for *daily life*, not sport).
              *   Periodic review (is the anxiety still there? is the dose stable?).

  4.  **Develop the Reasoning (The "Principled Basis"):**
      *   We need to distinguish between *therapeutic restoration* and *supranormal enhancement*.
      *   *Argument:* The goal of the TUE is to allow the athlete to compete at the level of a *healthy, untreated* peer, not to give them the advantage of a *medicated* peer.
      *   *Crucial Distinction:* In shooting, "healthy" implies a baseline physiological calm. The medication restores this baseline. However, because the drug *also* lowers the baseline below normal for non-anxious people, we must ensure the dose is titrated to *normalcy*, not *super-normalcy*.
      *   *Addressing Side B:* Acknowledge that the overlap is real. The treatment *does* affect the performance metric. However, denying it creates a discriminatory barrier based on health status. The solution isn't denial, it's strict monitoring to ensure the effect is restorative, not augmentative.
      *   *Addressing Side A:* Acknowledge their compassion and correctness on medical necessity. But warn them that ignoring the performance overlap undermines the federation's credibility.

  5.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Recommendation (Grant with Conditions).
      *   **Case Summary:** Brief recap of facts.
      *   **Analysis of Standards:** Break down the three criteria (Diagnosis, Necessity, Enhancement).
      *   **Addressing the Panel Split:** Explicitly validate both sides' concerns.
      *   **Recommendation & Conditions:** Specific, actionable constraints.
      *   **Precedent Setting:** How this guides future cases.

  6.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Needs to show deep understanding of both shooting mechanics and medical ethics.
      *   Needs to be legally/regulatorily sound (referencing WADA/International Standards implicitly or explicitly).
      *   *Self-Correction during drafting:* I initially thought about suggesting she try SSRIs first. But if she's been stable on propranolol for 2 years, switching might destabilize her. Better to focus on *dose monitoring* and *independent verification*.
      *   *Key Insight:* The "Return to Ordinary Health" clause is the pivot. We must define "Ordinary Health" in the context of shooting. It means "non-anxious baseline," not "beta-blocked super-steady."

  7.  **Final Polish:**
      *   Ensure the conditions are enforceable.
      *   Make sure the reasoning doesn't sound like a compromise for compromise's sake, but a principled synthesis.
      *   Check that the distinction between "treating the disease" and "treating the performance" is clear.

  8.  *(Self-Correction on "Exhaust Alternatives"):* The prompt mentions "exhaust non-pharmacological alternatives." Since she's been on it for 2 years and it works, forcing CBT now might be disruptive. However, for *future* TUEs, this is good policy. For *this* case, the focus should be on verifying the *daily life* necessity vs. *sport* necessity. The dose must be justified by her university exams/family gatherings, not her match scores.

  9.  *(Final Decision on Recommendation):* **Grant with Strict Conditions.** Denial is too harsh given the pre-existing diagnosis. Unconditional grant is too risky for the sport's integrity. The conditions must ensure the dosage is driven by medical need, not competitive optimization.

  10. **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Therapeutic Use Exemption (TUE) Committee, National Shooting Federation
  **FROM:** [Your Name], TUE Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding TUE Application #2023-AR-04 (Propranolol)

  ### Executive Summary

  After reviewing the medical documentation, correspondence regarding Case #2023-AR-04, and the divergent views within this panel, I recommend that we **GRANT** the Therapeutic Use Exemption (TUE), subject to **strict, time-limited conditions** regarding dosage verification and annual re-certification.

  An outright denial risks discriminating against an athlete for a legitimate, pre-existing medical condition, potentially violating both national health equity standards and the spirit of the International Standard for Therapeutic Use Exemptions (ISTUE). However, an unconditional grant fails to adequately address the unique overlap between the therapeutic effect of beta-blockers and the core physiological metrics of our sport.

  The recommendation below is designed to satisfy the medical necessity criteria while implementing safeguards to ensure the medication restores the athlete to a baseline of "ordinary health" rather than providing a supranormal competitive advantage.

  ### Case Context

  *   **Athlete:** 19-year-old National Air Rifle Team member.
  *   **Substance:** Propranolol (Beta-Blocker), Prohibited at All Times.
  *   **Diagnosis:** Generalized Anxiety Disorder with panic symptoms, diagnosed 2 years ago (pre-dating national team selection).
  *   **Indication:** Management of daily life stressors (university exams, social functioning), not sport-specific.
  *   **Panel Impasse:** Half the panel views this as a standard medical accommodation (analogous to insulin for diabetes); the other half views the treatment as intrinsic performance enhancement given the nature of rifle shooting (steadiness/calm).

  ### Analysis of the TUE Standard

  Our mandate requires us to satisfy four criteria. The first three are met; the fourth is the source of our deadlock.

  1.  **Significant Health Impairment:** The athlete's diagnosis is well-documented by an independent physician. The impairment affects daily life outside of sport. **(Met)**
  2.  **No Therapeutic Alternative:** Beta-blockers are often first-line for somatic anxiety symptoms. While SSRIs or CBT are alternatives, switching a stable patient of two years carries medical risk. **(Met, with caveat)**
  3.  **No Prior Non-Therapeutic Use:** The prescription predates elite competition. **(Met)**
  4.  **No Additional Enhancement Beyond Return to Normal Health:** This is the crux of the disagreement.

  ### Addressing the Panel's Division

  **To the members favoring Denial:**
  You are correct that in air rifle, the physiological effects of propranolol (reduced heart rate, reduced tremor) map directly onto the skills being judged. In most sports, treating asthma allows an athlete to breathe *normally*; in shooting, treating anxiety allows an athlete to hold *steadier*. If we ignore this, we risk turning the TUE process into a loophole for chemical steadiness. Your concern is not merely technical; it is fundamental to the integrity of the discipline. However, denying the exemption effectively bars this athlete from competition due to a disability. This sets a precedent that athletes with chronic health conditions must choose between their health and their career, a position our Federation should avoid if medically defensible.

  **To the members favoring Grant:**
  You are correct that the athlete's condition is genuine and pre-existing. The analogy to insulin is partially apt: we are attempting to restore a baseline. However, we must acknowledge that the analogy is imperfect. Insulin restores metabolic function that is otherwise invisible to the scoring mechanism. Propranolol restores physiological calm that is *directly* measured by the scoring mechanism. An unconditional grant ignores the reality that a medicated anxious shooter may achieve a physiological state *superior* to a naturally calm, unmedicated shooter. We cannot treat the TUE as a mere formality; we must actively manage the risk of performance augmentation.

  ### The Principled Basis: "Restorative vs. Augmentative"

  The principle guiding this recommendation is the distinction between **restorative normalization** and **augmentative optimization**.

  *   **Restorative Normalization:** The dose required to allow the athlete to function in daily life (take exams, attend family gatherings) without panic. This returns her to the baseline of a healthy, non-anxious peer.
  *   **Augmentative Optimization:** A dose titrated to maximize competitive steadiness, potentially lowering heart rate and tremor *below* the natural baseline of a healthy peer.

  Because propranolol is prohibited *at all times* (not just in-competition), the World Anti-Doping Code acknowledges its potential for enhancement even outside sport. Therefore, our TUE must ensure the dosage is driven by **medical necessity in daily life**, not competitive optimization.

  ### Recommendation: Grant with Conditions

  I propose we grant the TUE for a period of **one year** (rather than the standard multi-year term), subject to the following conditions:

  **1. Independent Verification of Dosage Necessity**
  The athlete must submit a letter from her treating physician explicitly stating that the current dosage is the *minimum effective dose* required to manage her daily life symptoms (exams, social functioning). The physician must confirm that the dosage has not been adjusted based on training cycles or competition schedules.

  **2. Prohibition on Dose Escalation Without Review**
  The athlete is prohibited from increasing the dosage without prior written approval from this panel. Any request for an increase will trigger a requirement for a fresh independent psychiatric evaluation.

  **3. Annual Re-Certification and "Normal Health" Assessment**
  The TUE is valid for 12 months. Renewal requires:
  *   Confirmation that the diagnosis remains valid.
  *   A statement from the physician regarding whether non-pharmacological interventions (e.g., CBT) have been considered or utilized as adjuncts to allow for potential dose reduction in the future.
  *   **Crucially:** We reserve the right to request a confidential review of the athlete's resting heart rate data (if available via training logs) to ensure the medication is not suppressing physiological markers to levels statistically inconsistent with therapeutic restoration (i.e., bradycardia indicative of over-medication).

  **4. Competition Monitoring**
  While we cannot police her physiology in real-time, the athlete must acknowledge that if her competition performance metrics (e.g., hold stability data from electronic targets) show statistical anomalies inconsistent with her training baseline, the panel may revoke the TUE pending investigation.

  ### Rationale for Conditions

  These conditions address the "Denial" side's concern by acknowledging that the drug *does* enhance performance if misused. By tethering the dosage to *daily life* necessity rather than *sport* necessity, we align the incentive structure: the athlete is medicated to pass her university exams, not to win gold. If the dose required to pass exams is sufficient to compete, that is an acceptable overlap. If she requires a higher dose to compete than to study, that is a violation of the "no additional enhancement" standard.

  The one-year term (rather than three) acknowledges that anxiety disorders can fluctuate. It prevents the TUE from becoming a permanent "license" without ongoing medical oversight.

  ### Conclusion

  This decision is not a compromise; it is a synthesis. It acknowledges that we cannot exclude athletes for having medical conditions (Side A), but we cannot ignore the specific pharmacological reality of our sport (Side B). By granting the exemption conditionally, we uphold the athlete's right to health while maintaining the Federation's duty to protect the integrity of competition.

  I request we discuss this framework at our reconvening on [Date]. I am prepared to draft the formal notification letter to the athlete and her physician based on this consensus.

  Respectfully,

  [Your Name]
  TUE Committee Member
