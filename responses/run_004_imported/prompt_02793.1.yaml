      *(Self-Correction on the "Seeming" point)*: This is the hardest part. Strawson says "Illusion implies experience." Frankish says "Illusion implies misrepresentation." I need Alex to argue that the misrepresentation itself doesn't need to be phenomenal. It's a "non-phenomenal seeming." Ben will find this absurd. That tension is the gold.

