  ### A Note for the Grader (You)

  Given your recent fieldwork, it is completely understandable why the student's answer in part (b) might feel intuitively correct to you. In practice, fieldwork *does* feel like a process of narrowing hypotheses through better data (pointing, counting, identity checks). The student has described the **pragmatic reality of linguistics** very well.

  However, in the context of a Philosophy of Language exam on Quine, the learning objective is to understand Quine's specific **philosophical claim**, which is stronger and more skeptical than the pragmatic view. Quine isn't just saying "it's hard to know"; he's saying "there is nothing to know." The student conflated the *experience* of fieldwork (underdetermination) with Quine's *conclusion* about meaning (indeterminacy).

  If you wish to be more lenient because the student demonstrates a strong practical grasp of the problem (perhaps valuing the linguistic insight over the exegetical precision), you could bump part (b) to a 4/7 and part (c) to a 3/5, bringing them to a 14/20 (C). However, strictly speaking, the answer contradicts the core thesis of the text being tested.
