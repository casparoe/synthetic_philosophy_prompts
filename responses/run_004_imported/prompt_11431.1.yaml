      *(Refining the Subsystem Alignment point)*: The user says "three separate heuristics... fight each other." This is technically *multi-objective optimization*. To make it "Subsystem Alignment" in the MIRI sense, the subsystems need to be *optimizers*. If the heuristics are just `if X then Y`, they aren't agents. I need to point this out. If the autoscaler uses RL to tune the heuristics, *then* it becomes alignment.

