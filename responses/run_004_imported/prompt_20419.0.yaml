      *   **Nuance the "Same Argument" Claim:** Point out that while the *critique* of necessity is similar, the *positive account* differs (Occasionalism vs. Skepticism/Psychologism).
      *   **Explain the Divergence:** Focus on the metaphysical commitments. Ghazālī has a "God card" to play; Hume deliberately folds that hand.
      *   **Stress-Test the Draft:** Warn against saying they do "opposite work" due to inconsistency. It's due to different starting axioms.
      *   **Suggest Refinements:** How to phrase the thesis to be robust against counter-arguments from the reading group (who likely know Ghazālī's theology well).

