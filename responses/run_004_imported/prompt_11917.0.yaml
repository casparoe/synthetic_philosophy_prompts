      *   *Tie to Industry:* Is Bitcoin a "ticket for labor"? Or is it an asset class?
          *   *Pro:* It can be used to pay for goods/services (medium of exchange).
          *   *Con:* It is often held as a speculative asset ("HODLing"). Its value fluctuates wildly based on sentiment, not necessarily current trade volume. Mining consumes energy (is that "industry"?), but the currency value isn't strictly pegged to economic output.
      *   *Institutional Accountability:* Bitcoin is decentralized. No central bank, no directors, no audit committee, no government oversight.
          *   *Berkeley's View:* He wants a *public* bank with strict checks to prevent abuse by private shareholders *or* unchecked government. He wants accountability to the *public good* (Irish prosperity).
