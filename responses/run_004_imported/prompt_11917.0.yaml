      *   *Function:* Records power to command labor. Must circulate to stimulate industry.
      *   *Condition for Validity:* Must be tied to "real industry" or trade growth.
      *   *Danger:* Credit cut loose from industry = "gaming" (speculation/bubbles like Mississippi/South Sea).
