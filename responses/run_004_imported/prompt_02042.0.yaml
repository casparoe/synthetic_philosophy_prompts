answer: |-
  You are reading Hobbes correctly, and your colleague is also largely right. This is a fantastic passage to teach, but it requires careful framing so you don't accidentally teach Hobbes as a proto-Lewis or proto-Sider when he's actually doing something quite different.

  Here is the breakdown of what Hobbes is doing, why your intuition about the ship is clashing with his, and how (and whether) this maps onto the modern endurantism/perdurantism debate.

  ### 1. Your Reading of the Ship Case
  **You are right:** Hobbes privileges the reassembled planks over the continuously repaired ship.

  In the final paragraph, Hobbes explicitly categorizes "Ship" under names given for "matter so figured." He writes:
  > *"if the name be given for some accident, then the identity of the thing will depend upon the matter... so that a ship, which signifies matter so figured, will be the same as long as the matter remains the same... if part of the matter remain and part be changed, then the ship will be partly the same, and partly not the same."*

  For Hobbes, a ship is not an organism with a functional essence (like a "Man" or a "City"). It is a hunk of matter arranged in a specific way. If the matter changes, the numerical identity is compromised. The continuously repaired ship is, strictly speaking, a *different* ship (or at best "partly the same"), whereas the reassembled ship retains the claim to numerical identity because it retains the matter.

  **Why this feels backwards to modern students:**
  Most contemporary intuitions (and Locke's) lean functionalist regarding artifacts. We tend to think a ship is defined by its function/structure, not its atoms. Hobbes is a materialist nominalist. For him, "Ship" is a name we apply to matter. If the matter flows away, the thing named "Ship" ceases, even if a new thing immediately takes its place with the same shape.

  **Teaching Hook:** This is a goldmine for your seminar. It immediately destabilizes the idea that there is a "common sense" answer to Theseus. You can show students that even "obvious" intuitions are theory-laden. Hobbes forces the question: *Is a ship more like a body (matter) or more like a city (organization)?*

  ### 2. The Mechanism: Sortal Relativity
  Hobbes's solution is not a monistic theory of persistence (like "everything endures" or "everything perdures"). It is a **sortal-relative theory of identity.**

  He argues that "Identity" is not a property of the world independent of language; it is a feature of how we *name* things.
  *   **Name = Matter:** (e.g., "Wax," "Body," "Ship"). Identity tracks the stuff.
  *   **Name = Form/Motion:** (e.g., "Man," "City," "River"). Identity tracks the continuity of process/origin.

  This is why he can say the Old Man is the *same* as the Young Man (Form/Motion continuity) but the Old Body is *not* the *same* as the Young Body (Matter flux).

  **Crucial Metaphysical Difference:** Notice Hobbes allows for "partly the same."
  > *"if part of the matter remain and part be changed, then the ship will be partly the same, and partly not the same."*

  Modern metaphysics (post-Frege/Leibniz) generally treats identity as binary (all-or-nothing). Hobbes is operating with a looser, scholastic-adjacent notion where identity can admit of degrees. This is a major warning sign against mapping him too closely to Lewis, for whom identity is strict and absolute (counterpart theory handles the vagueness, not identity itself).

  ### 3. Does this map to Endurantism vs. Perdurantism?
  Your colleague is correct: **This is not the Endurance/Perdurance distinction.** Trying to force it there will confuse students about what the modern debate actually is.

  **The Modern Debate (Lewis/Sider):**
  *   **Question:** *How* does an object occupy time?
  *   **Endurance:** The object is wholly present at every moment of its existence (3D object + time).
  *   **Perdurance:** The object is extended in time and has temporal parts (4D worm).
  *   **Focus:** Ontological structure.

  **The Hobbesian Debate:**
  *   **Question:** *What criteria* fix the identity of an object over time?
  *   **Matter:** Identity = Same stuff.
  *   **Form/Motion:** Identity = Same causal/functional history.
  *   **Focus:** Criteria of Individuation (Sortals).

  **Why the mapping fails:**
  1.  **An Endurantist can be a Hobbesian Functionalist:** A modern endurantist (like Van Inwagen) can argue that a living organism persists by preserving its life (Form/Motion) even while replacing matter. Hobbes agrees with the *criteria* here, but that doesn't make him an endurantist in the Lewisian sense.
  2.  **A Perdurantist can be a Hobbesian Materialist:** A 4Dist can argue that a "ship-worm" is composed of ship-stages. Whether those stages are linked by material continuity or functional continuity is a separate question from whether the ship *has* stages.
  3.  **Hobbes's "Form as Motion" isn't Temporal Parts:** When Hobbes says a man is the same because his actions proceed from the "same beginning of motion," he is invoking a causal theory of identity (similar to Locke's psychological continuity or Nozick's closest continuer), not a claim that the man is a spacetime worm composed of man-stages.

  **Where the connection *does* exist:**
  Hobbes anticipates the **Sortal Sensitivity** view (associated with Peter Wiggins or David Wiggins's *Sameness and Substance*). He shows that you cannot answer "Is X the same?" without answering "Is X the same *F*?"

  He also anticipates the **Constitution View**. When he distinguishes "Socrates" from "Socrates's Body," noting they have different identity conditions (one survives cell replacement, the other doesn't), he is touching on the distinction between a person and the matter constituting them—a key move in modern constitution theory (Lynne Rudder Baker), which is distinct from the 3D/4D split.

  ### 4. Pedagogical Strategy
  Since you want to use this to lead *into* Lewis and Sider, here is how I would frame it for the undergrads:

  1.  **Validate the Confusion:** Acknowledge that Hobbes's answer about the ship feels weird to us. Ask them *why*. (Answer: We are functionalists; Hobbes is a materialist).
  2.  **Isolate the Sortal Point:** Use Hobbes to teach that persistence conditions depend on *what kind of thing* you are talking about. (Ships vs. Men vs. Cities).
  3.  **The Pivot to Modernity:** Explain that in the 20th century, metaphysicians got tired of "it depends on the name." They wanted to know what is happening *ontologically* regardless of how we name it.
      *   *Transition:* "Hobbes asks: 'What rules do we use to count this as the same?' Lewis asks: 'What is the shape of this thing in spacetime that allows us to count it at all?'"
  4.  **The "Partly the Same" Trap:** Explicitly point out Hobbes's "partly the same" claim. Tell students: "Modern metaphysics usually bans this. Identity is strict. This is why Lewis invents Counterpart Theory—to handle the vagueness without breaking the logic of identity."

  ### Summary for your lecture notes:
  *   **Is your reading right?** Yes. Hobbes favors the reassembled planks for ships.
  *   **Is it Endurantism/Perdurantism?** No. It is Sortal Relativity / Criteria of Identity.
  *   **Is your colleague right?** Yes, mostly. It is a category error to call Hobbes a 4Dist.
  *   **Value for class:** High. It demonstrates that "persistence" isn't one problem, but a cluster of problems (material, functional, legal, moral) that modern theories try to unify under one ontological umbrella.

  It's a brave choice to open with Hobbes, but if you frame it as "The Pre-Modern Sortal View" vs. "The Modern Ontological View," it will make the Lewis/Sider material land much harder because students will see *why* the moderns felt the need to formalize the ontology rather than just appealing to linguistic usage.
