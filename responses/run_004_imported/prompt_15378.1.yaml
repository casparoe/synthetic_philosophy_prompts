          *   Thesis: $P(A > B) = P(B|A)$.
          *   Result: $P(B|A) = P(B)$.
      *   *Okay, the intuition needs to explain why $P(A > B | B) = 1$.* This relies on the assumption that $A > B$ is a truth-functional proposition (or at least entails $B$ in some way). Actually, Lewis assumes $A > B$ is a proposition in the algebra. If $B$ is true, is $A > B$ true? For material implication, yes. For Stalnaker, yes (the closest A-world is a B-world because the actual world is a B-world).
      *   *Why $P(A > B | \neg B) = 0$?* If $B$ is false, then for $A > B$ to be true, $A$ must be false (vacuously). But if we assume $A$ is compatible with $\neg B$, then in those worlds $A > B$ is false. Lewis assumes there are worlds where $A$ and $\neg B$ hold.
      *   *Pedagogical focus:* Focus on the idea that the conditional proposition becomes a "mirror" of $B$.

