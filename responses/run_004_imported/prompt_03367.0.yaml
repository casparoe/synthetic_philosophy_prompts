      *   "Already more than levelled": It resides in the realm of pure nature/instinct, below the ethical sphere. Therefore, it cannot be "levelled" ethically because it was never "up" ethically.
      *   This makes it the perfect scapegoat. You can't blame a force of nature (or a dog). By using it, the Public pretends to be using a force of nature.

  9.  **Checking against Dru's Translation vs. Hong's:**
      *   Dru is the user's text. Stick to Dru's phrasing but keep the Hong conceptual framework in mind (Hong translates *Nivellering* as "leveling").
      *   Dru's "third party" is key. In Danish, it's *en Tredie*.
