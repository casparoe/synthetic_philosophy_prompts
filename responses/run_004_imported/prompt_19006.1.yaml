answer: |-
  This is a profound and entirely legitimate crisis to face, especially at the MA level where you are transitioning from learning the canon to critically engaging with it. You are not overreacting, and you are certainly not the first philosopher to hit this wall (Heidegger, Husserl, and Wittgenstein all cast long shadows here).

  Your advisor gave you the standard Analytic Philosophy response: *Separate the argument from the arguer.* Technically, she is correct. Logically, she is correct. But as a human being and a scholar, her answer is incomplete because it ignores the *context* of knowledge production.

  Here is a sanity check on both the historical facts and the philosophical implications, broken down into the two questions you asked.

  ### 1. Is there a meaningful connection between his Logic and his Politics?

  You are asking if the drive to purify logic of the "psychological" is structurally linked to the drive to purify the state of the "foreign." This is a sophisticated intuition, and scholars have debated it fiercely since Gottfried Gabriel and others published the diary fragments in the 1990s.

  **The Case for Connection (Temperamental Affinity):**
  There is a plausible argument that Frege possessed a specific *temperament* that manifested in both domains.
  *   **Horror of Relativism:** In logic, Frege fought psychologism because he believed it led to relativism (if truth is in the mind, truth varies by mind). In politics, his diary shows a horror of the "messiness" of Weimar democracy, which he viewed as chaotic and relativistic.
  *   **Desire for Order:** Both his logical system (the *Begriffsschrift*) and his political ideal seek a rigid, hierarchical, unambiguous order. Ambiguity in language was a sin for Frege; ambiguity in national identity seemed to be a sin for the aging Frege.
  *   **The "Objective" vs. The "Other":** You noted this yourself. There is a structural parallel in wanting to excise elements deemed "impure" or "subjective" to reveal a "true" core.

  **The Case against Connection (Logical & Chronological):**
  However, most serious Frege scholars caution against drawing a direct line for a few reasons:
  *   **Chronology:** Frege's major logical work (*Begriffsschrift*, *Grundlagen*, *Grundgesetze*) was published between 1879 and 1903. The diary is from 1924. He was an old man, embittered by the failure of his logicist project (thanks to Russell), the loss of WWI, and the rise of the Weimar Republic. It is possible these political views crystallized late in life as a reaction to perceived decline, rather than driving his earlier technical work.
  *   **Universalism vs. Nationalism:** This is the strongest counter-argument. Frege's "Third Realm" of thought is *universal*. It is not German thought; it is *Thought*. His logic is designed to be valid for any rational being anywhere. His politics, conversely, were hyper-particularist (German nationalism). If his logic were truly an extension of his politics, one might expect his logic to be more culturally situated. Instead, his logic is arguably the most culture-transcending work of his era.
  *   **The Genetic Fallacy:** Even if the *motivation* was similar, it does not mean the *results* are tainted. The validity of quantification theory does not depend on the moral character of its inventor.

  **Verdict:** You are not just pattern-matching. There is likely a **temperamental link** (a personality type drawn to rigidity, order, and purity), but there is likely no **logical entailment**. His antisemitism does not invalidate Sense/Reference, but knowing about it changes how we understand the *man* behind the "objective" realm.

  ### 2. Should this change how you engage with his work?

  Your advisor says "compartmentalize." I suggest you **contextualize.**

  **Why "Compartmentalization" feels wrong:**
  It feels wrong because it asks you to perform a kind of intellectual lobotomy. It treats philosophy as code written by no one, floating in a vacuum. But Frege wrote *Grundlagen* to save mathematics from chaos. He had motives. Ignoring the dark side of those motives feels like a disservice to the truth, which is supposedly what you are both chasing.

  **Why "Rejection" is also wrong:**
  Abandoning the thesis because Frege was a bigot would be throwing away the tools of modern logic because the inventor was flawed. That helps no one. Frege's insights into language and reference are too foundational to discard.

  **The Middle Path: Critical Engagement**
  You can acknowledge the biography without invalidating the philosophy. In fact, doing so might make your thesis *stronger* and more mature.
  *   **In your Thesis:** You do not need to make this the centerpiece, but a footnote or a paragraph in the introduction acknowledging the biographical context shows scholarly rigor. It signals that you are aware of the full picture.
  *   **In your Analysis:** You can use this tension. For example, when discussing Frege's anti-psychologism, you can note that while his *motivation* was to secure objective truth against subjective whim, we must remain vigilant that "objectivity" itself isn't used to mask exclusionary ideologies. This turns your discomfort into a philosophical insight.
  *   **Ethical Stance:** Engaging with Frege does not mean endorsing Frege. You are mining a site for valuable materials. You can acknowledge that the site has a dark history while still using the materials to build something good.

  ### Practical Advice for Your Head and Your Thesis

  1.  **Read the Scholarship:** Don't rely on cohort gossip. Read the introduction to *Frege: Philosophical and Mathematical Correspondence* (Gabriel et al.) or papers by **Erich Reck** or **Michael Beaney** regarding the diary. Seeing how senior scholars have navigated this will normalize your reaction.
  2.  **Reframe the Advisor's Advice:** She isn't telling you to ignore the truth; she is telling you not to let the biography *paralyze* the technical work. Take the technical validity as given (she's right there), but keep the biographical context in your back pocket as a hermeneutic tool.
  3.  **The "Heidegger Precedent":** You are in good company. Almost every 20th-century philosopher has had to decide how to read Heidegger knowing what we know. The consensus is generally: *Read him, learn from him, but read him critically and acknowledge the stain.* You can apply the same heuristic to Frege.
  4.  **Protect Your Mental Space:** It is okay to feel disgust. It is okay to feel grief that a mind capable of such clarity was also capable of such hate. That tension is part of being a historian of philosophy. Don't let it stop the work, but don't suppress the feeling either. Let it inform the *tone* of your engagement.

  **Summary:**
  You are not crazy for seeing a parallel in the *impulse* for purity. But do not conflate the *impulse* with the *validity* of the logic. You can write a thesis on Sense and Reference that honors the logic while refusing to sanitize the man. That is arguably the most "Fregean" thing you can do: seek the truth, even when it is uncomfortable.
