answer: |-
  **Setting:** *A seminar room. A projected image shows 200 silhouettes arranged by height, ranging from 5'0" to 6'5".*

  **Sophie (Supervaluationist):** Look at silhouettes 143 and 144. The difference is a single micron. You're telling me that 143 is simply *not* tall, and 144 *is*, and that fact has been waiting there since the word 'tall' entered the language?

  **Elias (Epistemicist):** I'm telling you that one of them is the first tall one. Classical logic demands it. If 'tall' is a predicate with an extension, there must be a boundary between the extension and the anti-extension.

  **Sophie:** But extensions aren't Platonic entities floating above us; they're fixed by usage. And our usage here is messy. We have overlapping dispositions. I'm disposed to call 143 tall in some contexts, not in others. You have the same dispositions. Where in that cloud of conflicting behavioral data is the fact that picks out 144 as the *exact* cutoff? What mechanism turns our fuzzy habits into a sharp line?

  **Elias:** You're assuming meaning is exhausted by our ability to verify it. Usage constrains reference, it doesn't constitute it. Think of natural kind terms. We used 'water' before we knew it was H₂O. The reference was fixed by causal history, not by our ability to distinguish H₂O from XYZ. 'Tall' is sensitive to physical margins. There is a margin for error principle at work: to know someone is tall, you must be safely away from the boundary. The boundary exists; our knowledge just can't get close enough to pinpoint it without violating the margin.

  **Sophie:** That's a convenient shield. You're positing a semantic miracle. You're saying our loose, community-based practices somehow conspire to carve reality at a specific micron, but then immediately conspire to blind us to that carving. It makes semantics inert. If usage doesn't determine the cutoff, *what* does? Magic?

  **Elias:** It's not magic, it's stability. If the cutoff shifted every time our dispositions wavered, communication would collapse. The sharp boundary is the anchor that allows the vague term to function. But let's turn the table. You want to avoid my sharp boundary by saying 144 is neither truly tall nor truly not-tall. It's a truth-value gap. But you need to explain the *definite* cases. You'd agree it's *definitely* tall at the far end of the line?

  **Sophie:** Naturally. Supertruth. It's true on all admissible precisifications.

  **Elias:** So, where does 'definitely tall' stop? There must be a last person who is *definitely* tall, before we hit the borderline cases. Is there a sharp boundary between the 'definitely tall' and the 'merely borderline'?

  **Sophie:** That's higher-order vagueness. We handle that by allowing the set of admissible precisifications to be... flexible.

  **Elias:** Flexible how? Either a precisification is admissible or it isn't. If there's a sharp line between admissible and inadmissible precisifications, you're an epistemicist about 'admissible.' You've just kicked the sharp boundary upstairs. You've solved first-order vagueness by positing a sharp second-order boundary.

  **Sophie:** Not necessarily. We can have higher-order gaps. It's not sharp whether a precisification is admissible.

  **Elias:** Then say the sentence: "It is indeterminate whether this precisification is admissible." What makes *that* sentence true? If it's true, there must be a fact of the matter about the indeterminacy. If there's a fact about where the indeterminacy starts, you have a boundary again. If there isn't, then your theory of truth is itself vague to the point of incoherence. You're using 'definitely' to hide the cutoff, but 'definitely' is just as vulnerable to the Sorites as 'tall'.

  **Sophie:** And you're using 'unknown' to hide the absurdity. You demand I locate a boundary for 'admissibility,' but I can point to the clear cases. You demand I locate a boundary for 'tall,' and you offer me... ignorance. You're asking me to accept that there is a fact of the matter which is, in principle, undetectable. I'm asking you to accept that truth can outstrip bivalence. My 'magic' is less costly than your 'blindness.'

  **Elias:** My 'blindness' preserves logic. Your 'gaps' invalidate disjunction introduction. I can live with a cutoff I can't see; I can't live with a logic that breaks when I point at a person.

  **Sophie:** And I can't live with a semantics that claims our words carve nature at joints that our usage never touched.

  **Elias:** Then we stand here, at person 144, agreeing on the silence.

  **Sophie:** I call it a gap.

  **Elias:** I call it a limit.
