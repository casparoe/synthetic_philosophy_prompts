      *   *Check:* Is the "Definitely" argument clear? *Correction:* Elias needs to press that if 'Definitely Tall' has a sharp boundary, she's an epistemicist about 'Definitely'. If it doesn't, she hasn't solved vagueness, just relocated it.
      *   *Check:* Is the "Usage" argument clear? *Correction:* Sophie needs to emphasize that our dispositions to apply the word 'tall' overlap. There is no fact of the matter in the usage that picks out person #143 vs #144.

  5.  **Drafting the Content (Mental or Scratchpad):**
