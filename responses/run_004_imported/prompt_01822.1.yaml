      *   *Argument:* He is describing the *human political condition*, not the *metaphysical reality*.
      *   *Key Distinction:* There *is* real justice (in God/Truth), but in human society, we have substituted the *appearance* of justice (law backed by power) for the *reality* of justice.
      *   *Verdict:* It's a diagnosis of a con. Power usurps the title of justice.

  4.  **Address Question 2: The Missing Premise (The "And Thus" Jump):**
      *   *The Gap:* Why does the inability to make justice strong force us to call strength just?
      *   *The Pragmatic Necessity:* Society needs order. Order requires obedience. Obedience requires force (might). Force needs legitimacy to be stable (otherwise it's just tyranny and invites rebellion).
      *   *The Epistemological Problem:* We can't agree on justice (it's "subject to dispute"). We *can* agree on who has the guns (might is "easily recognised").
      *   *The Synthesis:* To get stability, we need to legitimize the force we *have*. Since we can't infuse our force with perfect justice (because we can't agree on perfect justice), we simply *declare* our existing force to be justice.
