answer: |-
  Here are two options. Both rely on the specific trade-off in the theorem (Strategy-Proofness + 3+ Alternatives + Unrestricted Domain $\rightarrow$ Dictatorship) rather than general cynicism about voting.

  ### Option 1: The "Course Policy" Angle
  *This one works well if you want to immediately ground the theorem in a classroom decision.*

  "I initially planned to let you vote on the due date for the first problem set. I had three dates in mind. But then I remembered Gibbard-Satterthwaite. With three alternatives and unrestricted domain, the only strategy-proof social choice function is a dictatorship.

  I didn't want to appoint a dictator among you, and I'm trying not to be one myself. So, we are going to vote. But please understand: since this mechanism is non-dictatorial, it *cannot* be strategy-proof. If you vote your true preferences, you aren't being virtuous; you're ignoring the theorem. Please manipulate your ballots accordingly."

  **Why it works:** It correctly identifies the conditions (3 alternatives, unrestricted domain) and the conclusion (dictatorship is the only strategy-proof option). It flips the script by framing manipulation as the "mathematically correct" behavior, which sets up the proof's focus on incentives.

  ### Option 2: The "Technical Definition" Angle
  *This one is better if you want to clarify the specific definition of a "dictator" in social choice theory before students get confused by the political connotation.*

  "When you see the word 'dictator' in the proof, don't think of a tyrant. In this context, a dictator is just a voter whose top choice wins, even if they vote for their bottom choice. Gibbard-Satterthwaite proves that if we have three or more options, installing a dictator is the *only* way to guarantee everyone tells the truth.

  Since I'm not going to appoint a dictator for this class, we have to accept the alternative. We are going to have a democracy, which means I expect you to lie to me. Let's get into the proof of why that's inevitable."

  **Why it works:** It preempts the most common student confusion (the definition of a dictator) while highlighting the core tension of the theorem: we usually choose to keep democracy and accept manipulability because we refuse to accept a dictator.

  **Delivery Tip:** For either joke, a deadpan delivery works best. You're stating a mathematical impossibility as a matter of administrative fact.
