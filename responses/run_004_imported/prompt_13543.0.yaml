answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the sibling of the groom. Which means I've spent a lifetime watching him try to logic his way out of emotional situations.

  Usually, this involves asking whether "cleaning your room" is a subjective moral construct. But today, he's outdone himself.

  As many of you know, my brother and his bride are both metaphysicians. They study the nature of reality. And like any happy couple, they agree on the important things—like where to buy furniture—and disagree on the fundamental structure of existence.

  Specifically, they disagree on "modality." Or, as normal people call it: "What if?"

  The bride holds the view that if things had gone differently, *she* would still be *her*, just living a different life. She believes in transworld identity. She believes that in other possible worlds, it is literally *her* making different choices.

  My brother, however, is a Lewisian. He follows the philosopher David Lewis. And David Lewis believes that possible worlds are real, concrete places, just like ours, but totally isolated. On this view, you don't exist in other worlds. Instead, there are "counterparts"—people who look like you and act like you, but aren't *you*.

  So, at the rehearsal dinner, my brother couldn't resist. When they discussed the vow to love one another "in this life and in every other," he pointed out that, on his semantics, that vow is technically impossible. He argued that in every other world, it won't be *him* loving *her*. It will be a counterpart of him loving a counterpart of her. Distinct individuals. Mere resemblances.

  It was a classic philosopher move. Technically precise, logically sound, and emotionally disastrous.

  And it brought to mind the famous objection raised by the philosopher Saul Kripke. Kripke argued against this counterpart theory by saying: "Humphrey would not care that some *other* guy in another world won the 1968 election. Humphrey cares about *himself* winning."

  And I have to say, looking at the bride: She does not want a counterpart. She doesn't want someone who merely *resembles* my brother across the causal void. She wants *him*.

  But here is the beautiful thing about this couple, and about marriage itself.

  My brother is worried about the metaphysics of other worlds. But the bride is focused on the actuality of this one.

  In philosophy, we call this world "The Actual World." Not because it's the only one that exists, but because it's the one we are *in*. It's the one we can touch. It's the one where choices become actions.

  My brother's theory suggests that in other worlds, their love is maintained by resemblance. But the bride's theory suggests that their love is maintained by identity. And I think, for the sake of this toast, we can find a middle ground.

  Because marriage isn't about what happens in the worlds that *might* have been. It's not about the counterparts. It's about the fact that out of all the infinite possibilities, all the branching paths of history and chance, these two managed to find each other *here*.

  In this world. In this room. In this life.

  So, brother, you can keep your counterparts. You can keep your isolated spatiotemporal realms. But for tonight, and for every day that follows, I think you'll find that the bride's view is the only one that matters. She believes it's *you*. And she's right.

  Please raise your glasses.

  To the bride and groom. May your love be strictly identical, may your world be the only one that matters, and may you never need a counterpart to get you out of trouble.

  To the Actual World!
