  7.  **Final Polish:** (Self-Correction during drafting) *Wait, I should make sure not to dismiss KC entirely.* It's the best we have. The point is that it shifts the problem from "What is simplicity?" to "What is the correct Universal Turing Machine?" which is arguably the same problem in disguise. I need to make that equivalence clear.

