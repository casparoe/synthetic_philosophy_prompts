answer: |-
  You have grasped the technical core of Kolmogorov complexity (KC) and Solomonoff induction correctly. The Invariance Theorem is indeed a profound result: it establishes that for sufficiently long strings, the complexity measure is robust against the choice of Universal Turing Machine (UTM).

  However, the reason philosophers of science (and many computer scientists) remain hesitant to declare the problem "solved" lies in the gap between **asymptotic theory** and **finite practice**, and between **syntactic compression** and **semantic truth**.

  Here is a breakdown of why the philosophical community still treats simplicity as partially language-relative, despite the Invariance Theorem.

  ### 1. The "Constant" is Not Necessarily Negligible
  The Invariance Theorem states that $|K_{U1}(x) - K_{U2}(x)| \leq c$, where $c$ depends on the machines but not on the string $x$. Proponents of KC often argue that as the length of the data grows, this constant becomes negligible.

  **The Philosophical Objection:** Scientific theory choice rarely happens in the asymptotic limit.
  *   **Finite Data:** We make theory choices based on finite, often scarce data. If the constant $c$ is large (e.g., if one UTM is "native" to English and another to a bizarre encoding), it can easily swamp the difference in complexity between two competing scientific theories.
  *   **Flipping the Order:** If Theory A is 100 bits simpler than Theory B in UTM 1, but the translation constant from UTM 1 to UTM 2 is 1000 bits, then in UTM 2, Theory B appears simpler. Since there is no *a priori* way to select the "True UTM" of the universe, the ordering of simplicity remains relative to the machine choice for any realistic amount of data.

  ### 2. The Reference Machine Problem (Goodman's "Grue")
  This is the most significant philosophical hurdle. The Invariance Theorem guarantees agreement *up to a constant*, but it does not tell you **which UTM corresponds to reality.**

  Nelson Goodman's "New Riddle of Induction" (the *Grue* problem) maps directly onto this.
  *   You can construct a UTM where the primitive operations include "check if grue." In this machine, hypotheses involving "grue" will have very low Kolmogorov complexity.
  *   You can construct another UTM where "green" and "blue" are primitives. Here, standard hypotheses are simpler.
  *   Both machines are Universal. Both satisfy the Invariance Theorem relative to each other.

  **The Objection:** KC solves the problem of *measuring* complexity once a language is fixed, but it does not solve the problem of *which language to fix*. To say "use the simplest UTM" is circular, because the complexity of the UTM itself must be measured by... another UTM. Philosophers argue that without an independent account of **natural kinds** or **privileged predicates**, KC just pushes the subjectivity back one step (from "theory choice" to "UTM choice").

  ### 3. Uncomputability
  Solomonoff Induction is mathematically elegant but **uncomputable**. There is no algorithm that can take a dataset and output the Solomonoff prior.
  *   **Practical Science:** Scientists use computable approximations like Minimum Description Length (MDL), Akaike Information Criterion (AIC), or Bayesian Information Criterion (BIC).
  *   **Reintroducing Bias:** These approximations require specific modeling assumptions and coding schemes. When you move from the theoretical ideal of Solomonoff Induction to the practical tools scientists actually use, the language-relativity returns. You have to choose a model class, a parameterization, and a coding scheme. Each choice injects bias.

  ### 4. Syntactic vs. Semantic Simplicity
  Kolmogorov complexity measures **syntactic** information content (the length of the bitstring). Philosophers of science often care about **semantic** or **ontological** simplicity.
  *   **Ontological Parsimony:** A theory might be "simpler" because it posits fewer types of entities (e.g., Darwinism vs. Special Creation), even if the mathematical formulation is dense.
  *   **Unification:** A theory might be preferred because it unifies disparate phenomena (e.g., Maxwell's equations), even if the program length to generate the data isn't strictly minimal.
  *   **Understandability:** Human science requires theories that humans can comprehend. A "simple" program in KC terms might be a lookup table of the entire universe's history (if the universe is deterministic). This has low KC (if you have the table) but zero explanatory power. Philosophers distinguish between *compression* and *explanation*.

  ### 5. Background Knowledge and "Entrenchment"
  Solomonoff Induction assumes a "blank slate" observer receiving raw bitstreams. Real scientists operate with **entrenched background knowledge**.
  *   When we evaluate the simplicity of a new theory, we do so against a backdrop of existing theories, mathematical conventions, and conceptual frameworks.
  *   KC treats all bits as equal. But in science, changing a fundamental constant is "costlier" than changing an initial condition, even if the bit-flip count is the same.
  *   Philosophers argue that simplicity is not an intrinsic property of the hypothesis alone, but a relation between the hypothesis, the data, *and* the background conceptual scheme. KC struggles to formalize the "background scheme" without reintroducing the language-relativity it sought to escape.

  ### Summary: Has the Problem Been Solved?
  You are right that KC provides a **rigorous framework** that is vastly superior to vague intuitions about simplicity. It transformed the discussion from "simplicity is aesthetic" to "simplicity is compression."

  However, philosophers treat the question as unresolved because:
  1.  **The Constant Matters:** In the finite regime of human science, the machine-dependence constant is not negligible.
  2.  **The UTM Choice is Arbitrary:** Without a "God's Eye" UTM, we cannot escape the *Grue* problem.
  3.  **It's Uncomputable:** We cannot actually use Solomonoff Induction, so we must use approximations that reintroduce bias.
  4.  **Explanation $\neq$ Compression:** Shortest program length does not always align with human notions of causal explanation or ontological parsimony.

  In short: Kolmogorov complexity tells us **how** to measure simplicity once we agree on a language. It does not tell us **which** language nature speaks. Until we have a non-circular way to select the "True UTM," philosophers will continue to view simplicity as partially relative to our conceptual schemes.
