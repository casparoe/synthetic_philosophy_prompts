      *   **Core Argument:** Since it's mathematically impossible to satisfy both calibration and equal error rates when base rates differ (unless perfect prediction), isn't the accusation that "COMPAS is racially biased" a "nothingburger"? Northpointe chose calibration, ProPublica wanted equal error rates. Since you can't have both, isn't it unfair to call Northpointe's choice "biased"?
