answer: |-
  Thank you all for being here.

  For those of you who knew my Uncle Walt well, you know that if he were standing at this podium, he'd probably start by critiquing the arrangement of the lilies. He'd tell you that flowers aren't beautiful "for us," but for the pollinators, and that our grief is a complex neurological response to social bonding. He was, as many of you know, a man of rigorous precision. He was an evolutionary biologist of the old school, a true believer in the gene's-eye view.

  We have a lot of stories about his crankiness. My favorite is the one about the family road trip where he made us pull over to the side of the highway so he could explain, at length, why the deer we just saw didn't stop eating grass "to let the herd rest."

  But I'm not standing here to give a lecture. I'm standing here because I was asked to talk about the man, not just the scientist. And for a long time, I struggled with how to reconcile the two. Because if you read the drafts circulating among the family, you see phrases like, "He gave everything for the good of the family," or "It was his nature to protect the group."

  Walt would have hated that. He spent forty years arguing that nature doesn't do things "for the good" of anything. He didn't believe in vague, fuzzy altruism. He didn't believe in sacrifice for the abstract "species."

  But here is the thing I've come to understand, writing this, and thinking about him holding my hand when I was six, or teaching my daughter how to identify oak trees last autumn: Walt didn't love us *despite* his science. He loved us *because* of it.

  He knew that we are, in his words, "survival machines." He knew that the code inside us is ancient and ruthless and singular in its purpose: to persist. To carry on. And he understood that the most efficient way for that code to persist is not through individual glory, but through the people standing in this room.

  He didn't look at his children and grandchildren and see a "group" to be served. He saw the future. He saw the only part of himself that would outlast him. When Walt drove you to school, or helped you move into your first apartment, or sat by a hospital bed, he wasn't acting out of some mistaken notion of selflessness. He was acting on a drive deeper than thought. He was ensuring the continuity of the line.

  In his worldview, love wasn't a magic spirit that defied biology. It was biology's greatest triumph. The fierce, protective, overwhelming love he felt for his kin was the mechanism by which life wins against entropy. He knew the odds against our existence. He knew how many generations had to survive famine, plague, and predators just so we could be here, breathing, in this room. That didn't make our connection cold to him. It made it sacred.

  He was a man who found poetry in the double helix. And to Walt, we were the verses.

  I know some of you might feel that framing his love in terms of "mechanisms" or "investment" sounds cold. But I ask you to remember how it felt to be loved by him. It wasn't tentative. It wasn't conditional on you being "good." It was absolute. It was as reliable as gravity. He looked after us because we were *of* him. In his mind, there was no distinction between his well-being and ours. We were the vessels of his future. And he treated us with a reverence that most people reserve for religious icons.

  To his colleagues: He was a giant. He fought for clarity in a world that prefers comforting myths. He taught us to see the world as it is, not as we wish it to be.

  To the family: He was the bedrock. He taught us that we belong to something older than our names. He taught us that we are connected not just by sentiment, but by substance. By blood, yes, but by the code that writes the blood.

  Walt would want me to be accurate. So I will say this: He did not die for the good of the species. He lived for the success of his lineage. And looking around this room, seeing his eyes in his daughter's face, seeing his stubborn chin in his grandson's, seeing his curiosity in the questions his great-nieces ask... I think he would consider the project a success.

  The genes don't die. The information persists. And as long as we are here, looking out for each other, driven by that ancient, biological imperative to keep our own kind safe and thriving, Walt is still doing exactly what he set out to do.

  Rest easy, Uncle Walt. The line holds.
