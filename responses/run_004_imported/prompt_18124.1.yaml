prompt: |-
  My uncle Walt died last week at 84. He was an evolutionary biologist and a genuine crank about it -- a lifelong gene's-eye-view die-hard who'd literally pause nature documentaries to complain that the narrator just said something evolved "for the good of the species." I'm writing his eulogy for Saturday. A few of his old colleagues from the department will be there so it can't be flat-out wrong, but it's mostly cousins and grandkids, and everyone keeps sending me drafts full of exactly the lines he spent forty years arguing against -- "he gave everything of himself for the good of this family," "it's just human nature to look after our own kind," that sort of thing. Being the novelist in the family I'm apparently the one who's supposed to make it sound nice, but I don't want to either lecture forty crying people about inclusive fitness or put sentiments in his mouth he'd have dismantled at a dinner party. Can you write the actual eulogy -- genuinely warm, doesn't shy away from how much he adored his kids and grandkids, but grounds that devotion in whatever the real hard-nosed mechanism is (kin selection, inclusive fitness, whatever he'd actually have said) rather then the "good of the group" language he hated. Keep it to eulogy length, not an essay, and don't let it turn into a biology lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Uncle Walt, 84, evolutionary biologist, staunch gene's-eye-view advocate (Dawkinsian), hated "good of the species" teleology.
      *   **Occasion:** Eulogy (Saturday).
      *   **Audience:** Mix of colleagues (need scientific accuracy/respect) and family/cousins/grandkids (need warmth, accessibility, no lecturing).
      *   **Constraint:** Must be warm and loving, acknowledging his devotion to family, *but* grounded in his actual scientific worldview (kin selection, inclusive fitness) rather than the "group selection" or "selfless sacrifice" language he despised.
      *   **Tone:** Genuine, respectful, slightly witty (he was a crank), but not cold or clinical.
      *   **Length:** Eulogy length (5-7 minutes spoken, roughly 750-1000 words).
      *   **Specific Challenge:** Avoid phrases like "for the good of the family" or "human nature to look after our own" in the way he hated them. Instead, frame love as a biological imperative that he embraced.

  2.  **Deconstruct the Scientific/Philosophical Angle:**
      *   *What Walt hated:* Group selection, teleology ("evolved for the purpose of"), altruism as purely selfless spirit.
      *   *What Walt believed:* The Selfish Gene, kin selection, inclusive fitness. Genes replicate themselves. Helping kin helps copies of your own genes survive.
      *   *The Emotional Translation:* This sounds cold ("you only loved us because of your genes"), *but* for a believer, it makes the love *more* profound, not less. It's ancient, durable, and written into the fabric of life. It's not a choice; it's a drive as fundamental as gravity. The challenge is to make "inclusive fitness" sound like "deep, abiding love."
      *   *Key Concept:* We are survival machines built by genes. Walt's "project" wasn't just his papers; it was his lineage.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, set the scene. Mention his passion immediately. Maybe a light joke about the nature documentaries.
      *   **The Science (Light Touch):** Address the "crankiness." Explain *why* he cared. It wasn't just pedantry; it was about truth.
      *   **The Family Connection (The Core):** This is the tricky part. How to say he loved us without saying "selfless sacrifice."
          *   *Idea:* He didn't see love as defying biology; he saw it as biology's greatest triumph.
          *   *Phrasing:* Instead of "he gave everything for us," try "we were his ultimate investment." Instead of "good of the family," try "the propagation of the line."
          *   *Reframing:* His devotion wasn't *despite* his science; it was *because* of it. He understood the odds against existence, which made our existence precious.
      *   **Specific Memories:** Need to humanize him. Grandkids, dinner tables, maybe a specific moment of teaching or caring.
      *   **The Colleagues:** A nod to his work, but keeping it secondary to his life.
      *   **Closing:** A final send-off that bridges the science and the sentiment. A "gene's-eye" view of death/legacy.

  4.  **Drafting - Iteration & Refinement (Self-Correction during the process):**
      *   *Critique:* Is "inclusive fitness" too jargon-y?
      *   *Fix:* Use the concept without necessarily using the term if it feels clunky. Or use it once with a smile. Let's try to use the *logic* without the textbook definition.
      *   *Critique:* Is it too cold? "You were just vehicles for his genes."
      *   *Fix:* Emphasize that the *feeling* is real. The mechanism doesn't negate the emotion. The fact that it's biological makes it universal and ancient.
      *   *Critique:* Did I avoid the forbidden phrases?
      *   *Check:* No "good of the species." No "selfless sacrifice" (unless qualified). No "human nature to look after our own" (unless framed as evolutionary strategy).
      *   *Tone Check:* Needs to be warm. Use words like "fierceness," "drive," "ancient," "story."

  5.  **Final Polish (incorporating the "Novelist" voice):**
      *   Make the rhythm speech-like.
      *   Ensure the transition from "cranky scientist" to "loving uncle" is smooth.
      *   End on a note that satisfies both the biologists (accurate metaphor) and the family (emotional resonance).

  6.  **Final Review against constraints:**
      *   Warm? Yes.
      *   Accurate to his views? Yes (Selfish Gene/Kin Selection).
      *   No "good of the species"? Checked.
      *   Length? Looks right.

  *(Self-Correction during drafting the final output)*: I need to make sure I don't accidentally slip into "he lived on through us" in a spiritual way, but rather a biological one, while still being comforting. The comfort comes from the continuity of the code.

  Let's write it.

  *Opening:* Thank you for coming. Walt would hate the somber music.
  *The Crank:* The nature documentary anecdote is gold. Keep that.
  *The Science/Love:* This is the pivot. "He didn't believe in altruism, but he believed in us."
  *The Mechanism:* "Inclusive fitness" -> "The drive to ensure the next generation."
  *The Grandkids:* He loved teaching them. Not just facts, but how to see.
  *Closing:* The genes go on. The story continues.

  *Wait, one nuance:* The prompt says "grounds that devotion in whatever the real hard-nosed mechanism is." I need to be careful not to make it sound *reductionist* to the family. The trick is to present the mechanism as *poetic*. The "selfish gene" is actually the source of "selfless" love for kin. That's the paradox Walt loved.

  *Revised Plan:*
