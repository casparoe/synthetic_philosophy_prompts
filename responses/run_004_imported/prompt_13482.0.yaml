      *   **Student's Insight:** CPA at the limit of no information *is* a Uniqueness claim (rational priors must be identical).
      *   **Complication:** Gul's objection (CPA is unfalsifiable/trivial because you can always construct a type space/prior to fit observed beliefs).
      *   **Task:** Argue that CPA *does* commit one to a Uniqueness Thesis (at the limit of no info), this holds even given Gul's unfalsifiability point, and Permissivists have principled grounds to reject CPA as a rationality requirement (not just an idealization).
