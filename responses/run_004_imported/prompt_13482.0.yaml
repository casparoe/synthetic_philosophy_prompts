answer: |-
  **Title:** The Wolf in Sheep's Clothing: The Common Prior Assumption as a Substantive Epistemological Commitment

  **Introduction**

  In epistemic game theory (EGT), the Common Prior Assumption (CPA) is frequently presented as a piece of technical bookkeeping. Following Harsanyi (1967-68) and Aumann (1976), the standard pedagogical line is that assuming agents share a prior probability distribution over the state space is merely a method for ensuring that all disagreement is modeled as stemming from informational asymmetries rather than fundamental differences in reasoning. It is treated as an idealization on par with assuming common knowledge of rationality—a simplifying constraint that makes the mathematics tractable without imposing controversial philosophical doctrines.

  However, when viewed through the lens of formal epistemology, specifically the debate between the Uniqueness Thesis and Permissivism (e.g., White 2005), the CPA appears far less innocuous. The CPA asserts that before agents receive private signals, their credal states must be identical. This is precisely a Uniqueness claim applied to the limiting case of zero private evidence. In this paper, I argue that the CPA is not a harmless technical convenience but a substantive epistemological commitment to the Uniqueness Thesis. Furthermore, I contend that Faruk Gul's (1998) objection—that the CPA is unfalsifiable because any belief profile can be rationalized by a sufficiently rich type space—does not defang the assumption. Instead, Gul's result reveals that the CPA is a metaphysical presupposition about the structure of rational explanation rather than an empirical hypothesis. Consequently, a philosopher committed to Permissivism has principled, non-empirical grounds for rejecting the CPA as a normative requirement of rationality in game-theoretic modeling.

  **1. The Harsanyi-Aumann Doctrine: Disagreement as Information**

  To understand the weight of the CPA, we must take the Harsanyi-Aumann motivation seriously. In the Harsanyi doctrine, a "state of the world" includes not only the physical facts but also the agents' information partitions and belief functions. Aumann's Agreement Theorem demonstrates that if agents share a common prior and their posterior probabilities regarding an event are common knowledge, those posteriors must be identical. They cannot "agree to disagree."

  The standard defense of the CPA is that it isolates the source of disagreement. If two agents differ in their beliefs, the model forces us to ask: "What signal did one receive that the other did not?" This is viewed as a methodological virtue. It prevents the modeler from simply stipulating that Agent A is "optimistic" and Agent B is "pessimistic" by fiat. Instead, optimism and pessimism must be derived from the information structure.

  However, this methodological virtue rests on a specific conception of rationality. By insisting that all divergence in posteriors be traceable to divergence in information (partitions), the framework implicitly denies that divergence in priors could ever be rational. If rational agents could legitimately start with different priors given the same initial evidence (or lack thereof), then the requirement to force a common prior would be distorting the rationality of the agents, not merely simplifying the model. The Harsanyi doctrine thus presupposes that the "initial position"—the view from nowhere, prior to private information—is a unique point in credal space.

  **2. The CPA as a Limiting Case of the Uniqueness Thesis**

  In formal epistemology, the Uniqueness Thesis states that for any body of evidence $E$ and proposition $P$, there is exactly one credence $c(P)$ that is rationally permitted. Permissivism denies this, allowing that $E$ might support a range of rational credences.

  The CPA applies this logic to the "ur-evidence" or the state of ignorance. In a standard EGT model, the common prior $P$ represents the agents' beliefs before they receive any private signals. In epistemological terms, this is the credal state determined solely by the agent's a priori constraints (logic, probability axioms) and any public, common evidence available before the game begins.

  If the CPA is a requirement of rationality, it entails that there is only one rationally permissible probability measure over the state space $\Omega$ available to an agent possessing only the common evidence. If there were multiple rationally permissible priors (as Permissivism suggests), then two agents could share all common evidence, reason perfectly, and yet arrive at distinct priors $P_1$ and $P_2$. Under the CPA, such a scenario is ruled out by definition; if they have different priors, at least one is irrational, or they must be modeled as having different "types" that implicitly encode different information.

  Therefore, accepting the CPA as a norm of rationality is equivalent to accepting a strong version of the Uniqueness Thesis at the limit of no private information. It asserts that rationality is "immodest" (in the sense of Lewis) regarding the starting point of inquiry: there is one right way to be before you know anything specific.

  **3. Gul's Objection and the Metaphysics of Explanation**

  A common rebuttal to the claim that the CPA is substantive is Gul's (1998) result. Gul showed that for any profile of beliefs held by agents, one can construct a type space and a common prior such that those beliefs are generated by Bayesian conditioning on that prior. In other words, the CPA is empirically unfalsifiable; no observed pattern of disagreement can logically contradict it, because one can always posit a sufficiently complex underlying state space to accommodate the divergence.

  Professors often cite this to argue that the CPA is "harmless." If it can fit any data, it doesn't constrain the model's predictions, so why worry about its philosophical baggage?

  This reasoning conflates *mathematical representability* with *epistemic normativity*. Gul is correct that the mathematics of the CPA is flexible enough to represent any belief profile. However, the Harsanyi-Aumann framework is not merely descriptive; it is ostensibly an account of *rational* interaction. The claim is not just "there exists a measure $P$," but "rational agents *ought* to reason as if they share $P$."

  Gul's unfalsifiability actually strengthens the claim that the CPA is a substantive philosophical commitment. Because the CPA cannot be tested against observed behavior (since any behavior can be rationalized by some prior), its acceptance must rest on a priori grounds. It functions as a regulative ideal or a metaphysical constraint on what counts as an *explanation* of disagreement. To accept the CPA is to commit to the view that *every* instance of disagreement *must* be explainable by informational asymmetry.

  If Permissivism is true, then some disagreements are *not* explainable by informational asymmetry; they are explainable by the inherent latitude of rational credence. Gul's result allows a modeler to mathematically force a Permissivist disagreement into a Common Prior framework by encoding the "permissive latitude" into the information partitions (e.g., treating the agent's rational disposition as a private signal). But this is a category error. It models a normative feature of rationality (the permission to vary) as an informational feature (a private signal). By accepting the CPA, the modeler is committed to the claim that there is no such thing as rational latitude, only hidden information. Thus, Gul's result does not make the CPA trivial; it reveals that the CPA is a dogmatic constraint on the *form* of rational explanation, ruling out Permissivist explanations by fiat.

  **4. Principled Grounds for Permissivist Rejection**

  If the above analysis holds, a philosopher drawn to Permissivism has strong grounds for resisting the CPA in normative game theory. This resistance is not based on the claim that people *are* different (a descriptive claim), but that rational agents *may permissibly be* different (a normative claim).

  Treating the CPA as a mere "idealization" akin to common knowledge of rationality (CKR) is misleading. CKR idealizes cognitive capacity (assuming agents never make logical errors). The CPA idealizes epistemic *content* (assuming agents must start with the same doxastic attitudes). Idealizing capacity is generally necessary for defining rationality; idealizing content is defining the *norms* of rationality themselves.

  If a Permissivist accepts the CPA for the sake of modeling, they are forced to represent rational divergence as informational divergence. This leads to distorted models of strategic interaction. For example, in a coordination game, Permissivism might suggest that agents could rationally coordinate on different equilibria based on different but equally rational "hunches" (priors) without any informational difference. The CPA forces the modeler to invent a "sunspot" or a private signal to explain this coordination failure or success. This obscures the actual philosophical mechanism at play: the underdetermination of belief by evidence.

  Furthermore, accepting the CPA commits the Permissivist to a form of epistemic alienation. If I am a Permissivist, I believe my colleague and I can look at the same null evidence and rationally hold different priors. If I adopt the CPA framework, I must model my colleague's rational prior as identical to mine, and any deviation must be treated as a result of them seeing something I didn't. This misrepresents the epistemic relationship between agents. It treats the "otherness" of the other agent's mind as an informational deficit rather than a legitimate alternative rational perspective.

  **5. Conclusion**

  The Common Prior Assumption is often sold to graduate students as a neutral tool for isolating informational asymmetry. However, when unpacked, it relies on the contentious epistemological claim that rational credence is uniquely determined by evidence, even in the limit of no private evidence. Gul's demonstration that the CPA is unfalsifiable does not render it harmless; rather, it confirms that the CPA is a metaphysical presupposition about the nature of disagreement, not an empirical hypothesis.

  For the epistemologist who finds Permissivism plausible, the CPA is not a convenient idealization but a substantive barrier to accurate modeling. It forces the representation of normative latitude as informational asymmetry. Therefore, resisting the CPA is not a matter of quibbling over realism; it is a requirement of consistency for anyone who believes that rationality allows for a plurality of starting points. To accept the CPA is to accept the Uniqueness Thesis; to reject Uniqueness is to reject the CPA. They stand or fall together.

  ***

  **References for Further Consideration:**
  *   Aumann, R. J. (1976). "Agreeing to Disagree." *The Annals of Statistics*.
  *   Gul, F. (1998). "A Comment on Aumann's Bayesian View." *Econometrica*.
  *   Harsanyi, J. C. (1967). "Games with Incomplete Information Played by 'Bayesian' Players." *Management Science*.
  *   White, R. (2005). "Epistemic Permissiveness." *Philosophical Perspectives*.
  *   Morris, S. (1995). "The Common Prior Assumption in Economic Theory." *Economics and Philosophy*. (Note: Morris provides a strong defense of CPA that you might want to engage with as a counter-point).
  *   Halpern, J. Y. (2006). *The Game of Logic and Belief*. (For technical details on type spaces).
