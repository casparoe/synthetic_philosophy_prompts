      *   *Section 1: The Harsanyi-Aumann Doctrine.* Explain why EGT thinks CPA is innocuous (it's just modeling disagreement as informational, not fundamental). Connect this to the "Bayesian Story."
      *   *Section 2: The Epistemological Link.* Connect "prior to private information" to "evidence-neutral state." Show that CPA = Uniqueness at $t_0$.
      *   *Section 3: Addressing Gul.* Gul says CPA is unfalsifiable. Does this make it empty? No, it makes it a *constraint on explanation*. If you accept CPA, you are committed to the *possibility* of a unique rational starting point, even if we can't observe it. It shifts the burden of proof to the Permissivist.
      *   *Section 4: The Permissivist Objection.* If Permissivism is true (evidence underdetermines credence), then the "unique prior" is a fiction. Accepting CPA forces Permissivists to model rational agents as irrational (or vice versa).
      *   *Section 5: Conclusion.* CPA is a substantive philosophical claim, not just math.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Hook the reader with the tension between EGT's "bookkeeping" and FE's "Uniqueness." State the thesis clearly.
      *   **Part 1: The Harsanyi-Aumann Motivation.** Why do they want CPA? It's not just math; it's about the *source* of disagreement. Aumann's Agreement Theorem relies on it. Harsanyi's Type Space relies on it. The idea is: "We start at the same place, then we go different ways." This implies there *is* a single "same place."
      *   **Part 2: CPA as Uniqueness.** Define the "prior." It's the credence before private signals. In FE, this is the credence before evidence. If CPA holds, there is only *one* rational prior. That is the Uniqueness Thesis (specifically, "Immodest Uniqueness" or "Strict Uniqueness" at the limit).
      *   **Part 3: The Gul Objection (The Tricky Part).** Gul (1998) says any belief profile is consistent with CPA if the state space is rich enough.
          *   *Standard Interpretation:* CPA is empty/trivial.
          *   *My Interpretation (for the paper):* Gul shows CPA is a *metaphysical/structural* commitment, not an empirical one. It says "Reality *could* be described this way." If you accept CPA, you are committed to the view that all rational divergence *must* be explainable by information. If Permissivism is true, some divergence is *not* explainable by information (it's explainable by rational latitude). Therefore, CPA rules out Permissivism by fiat. The unfalsifiability doesn't make it harmless; it makes it a dogmatic constraint on the *form* of explanation.
      *   **Part 4: Permissivist Grounds for Rejection.** If I am a Permissivist, I believe two agents can see the *same* evidence (including the "null" evidence of existence) and rationally hold different credences. CPA says this is impossible (or at least, not modelable as rational). Thus, using CPA in normative game theory (what *should* rational agents do?) is question-begging against Permissivism. It treats a specific epistemological theory (Uniqueness) as a mathematical axiom.
      *   **Part 5: Addressing the "Idealization" Defense.** Professors say it's like "common knowledge of rationality." Counter: CKR is about cognitive capacity. CPA is about the *content* of belief. Idealizing capacity is different from idealizing epistemic norms.
      *   **Conclusion:** Summarize. The CPA is a wolf in sheep's clothing. It looks like math, but it's epistemology.

