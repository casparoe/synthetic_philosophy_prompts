answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've known Priya and Dev since undergrad, which makes me the designated "control group" for this friendship. I am the one friend who did not go on to get a philosophy PhD. I am the one who reads fiction for pleasure. I am the one who believes that "the greatest good for the greatest number" is a slogan on a t-shirt, not a dissertation topic.

  So, when they asked me to give this toast, I knew it was a trap. They know I'm the only person here who can't dismantle their arguments on a napkin. But I think they also know that marriage requires someone who can step outside the system and just look at the data. And the data says these two are perfect for each other.

  We all know that Priya and Dev speak a language most of us don't. At their engagement dinner, someone actually brought up Arrhenius's Impossibility Theorem unprompted. For the family members currently Googling that on your phones: it's a proof that says there is no perfect way to rank different populations of people. Basically, it's the mathematical proof that life is complicated. And honestly, that's the energy of their relationship. They don't just love each other; they challenge each other's axioms.

  Priya is a defender of the "Total View." In very simple terms, she believes that more happy people is always better, even if it means the average happiness drops a little. Dev, on the other hand, has built a career on a "Critical-Level" view. He believes a life only adds value if it's *really* good, not just "okay."

  Now, I promised I wouldn't get too technical, but I also promised the philosophy department in the back row that I wouldn't embarrass them. So, I have to address the elephant in the room regarding their future family planning.

  Given their research, Priya and Dev have a unique framework for deciding when to have kids. Priya's view suggests that as long as a child's life is worth living, adding them to the world is a moral good. Dev's view suggests that unless that child's life is guaranteed to be exceptional, adding them might not be.

  So, when they sit down to discuss parenthood, it's going to be a negotiation between Priya's "Total" joy and Dev's "Critical" standards. Priya will be arguing for quantity; Dev will be arguing for quality. But here is the joke that only half the room will fully appreciate: They haven't decided on a number of children yet, but they have agreed that whatever they decide, it will inevitably lead to a conclusion that one of them finds either Repugnant or Sadistic.

  But here is the truth that the rest of us know, and that the philosophers eventually have to admit: Love isn't a calculation.

  Population ethics is about trying to solve the unsolvable. It's about trying to find a formula for human value. But Priya and Dev don't need a formula. They don't need to maximize utility to know they're better off together. They don't need to establish a critical level of welfare to know that their lives are infinitely better with the other person in them.

  Marriage, much like philosophy, is full of impossibility theorems. You can't perfectly optimize for everything. You can't maximize career, leisure, romance, and sleep all at once. There will be trade-offs. There will be conclusions that feel a little repugnant, like leaving the dishes in the sink. There will be moments that feel a little sadistic, like waking up at 6 AM on a Saturday.

  But the beauty of what you two have built isn't in the logic. It's in the commitment to work through the problems together. Priya, you don't have to bite the bullet on the Repugnant Conclusion tonight. Dev, you don't have to defend the Sadistic Conclusion at the altar. Tonight, the only view that matters is the one where you are standing side by side, looking out at the people who love you.

  So, if everyone could please raise a glass.

  To Priya and Dev. May your life together be high in total value, may it exceed every critical threshold, and may you find that the only conclusion you ever need to accept is a happy one.

  To the happy couple!
