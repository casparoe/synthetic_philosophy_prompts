answer: |-
  # The Demon in the Details: Can Buck-Passing Survive the Wrong Kind of Reasons?

  Your journey into moral philosophy via *The Good Place* and T. M. Scanlon is a testament to the unexpected ways serious ideas can enter our lives. Scanlon's *What We Owe to Each Other* is a landmark text, and his "buck-passing" account (BPA) of value is one of the most influential meta-ethical theories of the last thirty years. It offers an elegant simplification: to call something "good" is not to detect a mysterious spiritual glow hovering over it, but simply to note that it has properties giving us reasons to act or feel in certain ways.

  However, as you have discovered, the elegance of the theory is threatened by the "Wrong Kind of Reasons" (WKR) problem. Your suspicion—that the standard solution to this problem may be circular—is shared by some of the sharpest minds in contemporary meta-ethics. To settle this, we must weigh the fatal implications of the WKR problem against the robustness of the proposed fixes.

  Below, I will lay out the strongest case that the WKR problem destroys the buck-passing account, followed by the strongest case that a refined distinction between reasons can save it. Finally, I will offer a definite verdict on which side prevails.

  ### The Case for Fatality: The Circularity Trap

  The buck-passing account aims to be a **reductive analysis**. It claims that the concept of "value" can be fully explained in terms of "reasons." If successful, this would demystify value, grounding it in the more manageable terrain of practical rationality. The WKR problem attacks this reduction directly.

  The core of the fatalist argument is not just that the demon case creates a counter-example (which a theorist might patch), but that the *patch itself* fails the requirements of a reductive analysis. This is known as the **Independence Constraint**. For BPA to work as an analysis, we must be able to identify which reasons count toward value *without* already relying on the concept of value.

  Consider the demon case again. You have a reason to admire the mud (to avoid pain). The buck-passer says, "Fine, we exclude that reason. It's the wrong kind." The fatalist asks: "On what basis do you exclude it?"

  The standard answer is: "We exclude reasons that are not based on the object's properties." But as you noted, this is difficult to maintain. The demon's threat is a fact about the world involving the mud. Why isn't it a property of the situation? To filter it out, the theorist must say, "We only count reasons that bear on the *admirability* of the mud."

  Here lies the fatal circle. If you define the "Right Kind of Reason" (RKR) as "a reason that bears on whether the object is admirable/valuable," you have defined value in terms of reasons, and then defined the relevant reasons in terms of value. You have not eliminated the mystery of value; you have merely hidden it inside the definition of "Right Kind of Reason."

  Philosophers like Jonas Olson and Wlodek Rabinowicz argue that this violates the logic of analysis. If I ask, "What is water?" and you answer, "H2O," you have explained water in terms of hydrogen and oxygen. You haven't said, "Water is whatever plays the water-role." Similarly, if Scanlon says, "Value is whatever properties give us the *right kind* of reasons," and the "right kind" is determined by whether they track *value*, he hasn't explained value. He has presupposed it.

  The fatalist concludes that the WKR problem proves BPA cannot be a reductive analysis. It might be true that value and reasons correlate, but you cannot define the former exclusively in terms of the latter without smuggling the former back into the definition of the latter. The buck stops nowhere; it just circles back to the start.

  ### The Case for Rescue: The Structural Distinction

  Defenders of the buck-passing account, such as Mark Schroeder and Pamela Hieronymi, argue that the fatalist overstates the circularity. They claim there is a way to distinguish the Right Kind of Reasons from the Wrong Kind using purely structural or psychological criteria, without invoking value.

  The strongest version of this defense relies on the **Object-Given vs. State-Given** distinction, refined by the **Correctness Condition**.

  1.  **Object-Given vs. State-Given:** An Object-Given Reason (OGR) cites a property of the *object* of the attitude. A State-Given Reason (SGR) cites a property of *having* the attitude.
      *   *Example:* If I admire a hero because they are brave, the reason (bravery) is a property of the hero (the object).
      *   *Example:* If I admire a hero because admiring them makes me feel happy, the reason (happiness) is a property of my mental state (the state).
      *   In the demon case, the threat of pain is a consequence of *having the attitude* of admiration. It is not a feature of the mud that makes the mud worthy of admiration. Therefore, it is State-Given.

  2.  **The Correctness Condition:** Pamela Hieronymi argues that attitudes like belief, admiration, and desire have "constitutive aims." Belief aims at truth; admiration aims at merit. A reason is of the Right Kind only if it bears on whether the attitude is *correct* (i.e., whether it achieves its aim).
      *   The demon's threat does not make the mud *meritorious*. It only makes admiring the mud *beneficial*.
      *   We can identify this distinction without using the word "value." We simply look at the "direction of fit." Does this reason suggest the object *deserves* the attitude? Or does it suggest the attitude is *useful*?

  Defenders argue this is not circular because "correctness" here is a functional, psychological notion, not a moral one. Just as a thermostat is "correct" when it matches the temperature, admiration is "correct" when it matches the merit. We can identify reasons that bear on merit (properties of the mud) versus reasons that bear on utility (avoiding pain) without needing a prior theory of value. We just need to understand the psychology of admiration.

  If this distinction holds, the buck-passer can say: "Value consists in properties that provide Object-Given Reasons (reasons bearing on correctness)." This filters out the demon's threat without explicitly presupposing value, saving the theory from circularity.

  ### The Verdict: The Critics Have the Better of the Argument

  Having weighed both sides, I commit to the following verdict: **The Wrong Kind of Reasons problem is fatal to the Buck-Passing Account as a reductive analysis, validating your suspicion of circularity.**

  While the Object-Given/State-Given distinction is intuitively powerful, it fails to rescue Scanlon's specific project because it cannot satisfy the Independence Constraint. Here is why the defense ultimately collapses.

  **1. The "Object" is Elusive**
  The structural distinction relies on sorting reasons based on whether they cite properties of the *object* or the *state*. But in the demon case, the threat is arguably a property of the *situation* involving the object. If I say, "This mud is such that admiring it prevents pain," isn't that a property of the mud-in-a-context? To rule this out, the theorist must insist that only properties making the mud *worthy* of admiration count. But "worthy" is a value-laden term. As soon as you refine "Object-Given" to mean "Object-Given-in-the-value-relevant-sense," you have reintroduced value into the definition of the reason.

  **2. The Normativity of "Correctness"**
  The "Correctness Condition" defense is the strongest patch, but it concedes the main battle. Hieronymi argues that admiration aims at merit. But what is merit? If merit is just "that which gives us reasons to admire," we are back to square one. If merit is a normative property distinct from reasons, then BPA has failed to reduce value to reasons; it has reduced value to *merit*, which is just a synonym for value.
  To identify which reasons bear on "correctness," you must already know what the attitude is *supposed* to track. But knowing what admiration is supposed to track *is* knowing what is admirable. You cannot determine the "Right Kind of Reason" without first knowing what is valuable. The filter requires the very thing it is supposed to produce.

  **3. The Failure of Reduction**
  Scanlon's ambition was to explain the *concept* of goodness in terms of reasons, thereby passing the explanatory buck away from value. The WKR problem shows that the buck cannot be passed; it must be caught. To solve WKR, you must accept that there is a primitive normative relation of "fittingness" or "appropriateness" that governs which reasons count.
  If you must accept a primitive normative notion of fittingness to make the theory work, you have not eliminated the mystery of value. You have simply renamed it. The theory survives only by ceasing to be a reductive analysis and becoming a **correlative thesis** (i.e., "Things that are valuable happen to provide reasons"). But this is a much weaker claim than Scanlon's original proposal, and it leaves the fundamental question—"What *is* value?"—unanswered.

  ### Conclusion

  Your intuition was correct. The "Right Kind of Reason" restriction does not solve the problem so much as it relocates it. To draw the line between the demon's threat and the mud's features, you must implicitly appeal to a standard of value or fittingness that exists prior to the reasons themselves.

  This does not mean Scanlon was entirely wrong; the link between value and reasons is profound and likely inescapable. However, the Wrong Kind of Reasons problem demonstrates that **reasons cannot be the foundation of value.** Instead, value (or fittingness) must be the foundation that determines which reasons count. The buck does not pass from value to reasons; it stops at value.

  The WKR problem is fatal to the hope that we can analyze value away. We are left with the conclusion that value is a genuine, irreducible normative property—one that *generates* reasons, rather than one that *consists* in them.
