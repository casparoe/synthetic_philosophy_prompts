  3.  **Evaluate the Philosophical Distinction (Question 1 & 2):**
      *   *Contextualism (DeRose/Cohen):* The *semantic content* of "knows" shifts. Low stakes = low standard. High stakes = high standard. Ines *did* know in the first context (true utterance). Ines *does not* know in the second context (false utterance, or rather, the proposition "Ines knows" is false in the high-standards context). Crucially, the *subject's* epistemic state hasn't changed, only the *attributor's* context (or the context of utterance).
      *   *Pragmatic Encroachment (Stanley/Hawthorne/Fantl & McGrath):* The *truth conditions* of knowledge itself depend on stakes. "Knows" is invariant, but whether the relation holds depends on practical factors. Ines *did* know in low stakes. Ines *does not* know in high stakes. Her epistemic position *effectively* worsened because knowledge is partly constituted by practical adequacy.
      *   *The Passage's Depiction:* "Ines found she could no longer bring herself to say she knew... Nothing about the ink or the parchment had changed. What had changed was what now hung on being right."
      *   *The Problem:* The passage describes Ines's *psychological reluctance* ("could no longer bring herself to say"). It describes the *phenomenology* of the retraction. It does *not* explicitly commit to *why* this happens in the explanatory text provided by the user.
      *   *The User's Explanation:* The user *explains* the distinction well in the prompt ("The contextualist, I want to say, locates the change in the word 'know' itself... The encroachment theorist... denies that any such semantic rescue is needed...").
