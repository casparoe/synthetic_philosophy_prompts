answer: |-
  This is a really nuanced situation, and your gut feeling that your friend's advice is "incomplete" is actually quite insightful. Your friend is applying strict logical rules to a deeply emotional and relational problem.

  To answer your core question: **Yes, it does matter who says it.** But perhaps not for the reasons your initial gut reaction suggested.

  Here is a breakdown of why your reaction makes sense, why your friend's logic is only half the picture, and how your brother's history actually changes the weight of his words.

  ### 1. Logic vs. Relational Credibility
  Your friend is relying on the logical principle that a statement's truth value is independent of the speaker. If I say "the sky is blue," it doesn't matter if I'm a saint or a criminal; the sky is still blue.

  However, human communication isn't just data transfer; it's trust transfer. When someone gives you advice on behavior, especially sensitive behavior, **credibility** is part of the message.
  *   **The Trust Deficit:** Your brother burned trust bridges in the past (missing your rehearsal dinner, hurting your mom). Even though he has rebuilt them over 5 years, scars remain. When he speaks on alcohol, he isn't just speaking as a brother; he is speaking as someone who caused your family pain through that specific vice.
  *   **The "Moral High Ground" Feeling:** Your reaction ("You, of all people...") is a defense mechanism known as *tu quoque* (appeal to hypocrisy). It feels unfair because, in your mind, he forfeited the right to lecture on this topic when he was active in his addiction.

  So, your friend is right that the *facts* about your drinking don't change based on who states them. But she is wrong to imply that the *impact* of the message doesn't change based on the messenger. It is infinitely harder to hear tough love from someone who has inflicted trauma related to that specific issue.

  ### 2. The Value of "Lived Experience"
  Here is the flip side, and where your brother's history actually becomes an asset rather than a liability.

  If a teetotaler who never struggled told you that 4-5 beers a night was too much, you could dismiss it as them "not understanding how you unwind" or "not knowing what stress feels like."

  Your brother, however, knows exactly what the slope looks like.
  *   **Pattern Recognition:** He isn't guessing. He likely recognizes the specific rationalizations, the specific timing (after the kids are in bed), and the specific quantity because he lived it.
  *   **The 5-Year Marker:** This is crucial. If he were 6 months sober, he might still be unstable. At 5 years, he has demonstrated sustained behavioral change. He isn't speaking from the place of the "bad alcoholic" of his 20s; he is speaking from the place of the "solid person" he is today.

  In recovery communities, this is often seen as a qualification, not a disqualifier. The person who has been through the fire is often the best person to warn you about the heat.

  ### 3. The "Right" to Speak
  You asked if cleaning up his act earns him the right to say this.
  *   **Does he have a "right"?** No one has an inherent right to critique another adult's habits.
  *   **Does he have a "responsibility"?** If he loves you, and he sees you walking a path he knows leads to ruin, many would argue he has a moral responsibility to say something, regardless of his past.

  Silence can be a form of enabling. If he stayed quiet because of his past guilt, he would be prioritizing his own comfort (avoiding an awkward conversation) over your well-being. By speaking up, he is risking the relationship to help you. That is an act of care, even if it feels like criticism.

  ### 4. Why Your Friend's Advice Feels Incomplete
  Your friend told you to judge the point, not the guy. The missing piece she ignored is **shame.**

  Addiction and heavy drinking are deeply tied to shame. When your brother brings this up, it triggers two layers of shame:
  1.  **Current Shame:** "I am drinking too much and failing as a dad."
  2.  **Historical Shame:** "I am being lectured by the person who embarrassed our family with this exact same issue."

  Focusing on *his* past is a way for your brain to protect you from feeling *your* current shame. It's easier to be angry at him than to be disappointed in yourself. Your friend identified this as deflection (which it is), but she didn't acknowledge *why* you are deflecting. You are deflecting because the truth hurts, and the messenger makes it hurt more.

  ### The Verdict
  **Does it matter that it's him?** Yes. It makes the conversation heavier, more charged, and more painful to hear.
  **Does that make him wrong?** No.
  **Does his sobriety matter?** Yes. It transforms him from a hypocrite into a survivor with relevant data.

  **What should you do?**
  You don't have to choose between "My brother is a hypocrite" and "My friend is 100% right." You can hold a more complex truth:

  *"My brother's history makes this hard to hear, and I resent that he has standing to say this after what he put us through. However, he is factually correct, his experience gives him insight others don't have, and his 5 years of sobriety prove he cares about this issue seriously."*

  You can acknowledge the relational friction without letting it invalidate the message. In fact, the fact that it stings so much coming from him might be the very signal you need that this is a serious issue. If a stranger said it, you might shrug. Because it's him, and because of his history, it demands attention.

  **A suggested path forward:**
  You don't have to submit to him, but you can validate the care. You could say: *"I've been thinking about what you said. Honestly, it was hard to hear coming from you given our history, and my first instinct was to get defensive. But I know you know this road better than anyone, and I know you wouldn't say it unless you cared. I'm going to take a hard look at my drinking."*

  That honors your feelings, acknowledges his growth, and addresses the actual problem.
