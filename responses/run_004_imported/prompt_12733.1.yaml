answer: |-
  You are absolutely correct, and Jordan is falling into one of the most famous traps in decision theory and probability. Your intuition that "going all-in leads to zero" is mathematically sound, while Jordan's claim that "expected value is all that matters" is only true for a single, one-off bet, not a repeated, compounding game.

  Your roommate is partially right: Jordan is correct about the **Arithmetic Expected Value** of a single round. However, in a multi-week simulation where your balance compounds, you need to maximize the **Geometric Growth Rate**.

  Here is the rigorous breakdown of why you are right, the specific math that proves it, and the principled formula you should be using.

  ### 1. The Trap: Arithmetic vs. Geometric Means

  Jordan is optimizing for the **Arithmetic Mean**.
  If you bet $100 one time:
  *   60% chance you have $200.
  *   40% chance you have $0.
  *   Expected Value = $(0.6 \times 200) + (0.4 \times 0) = \$120$.
  *   Since $\$120 > \$100$, the EV is positive. To maximize EV, you bet everything.

  However, you are playing a **repeated game**. Wealth in repeated betting grows geometrically, not arithmetically. If you bet 100% of your balance every week, your wealth path looks like this:
  *   Start: $10,000
  *   Week 1 (Win): $20,000
  *   Week 2 (Win): $40,000
  *   Week 3 (Loss): $0

  Once you hit a loss, you are wiped out. The probability of surviving $N$ weeks without a single loss is $0.6^N$.
  *   After 10 weeks: $0.6^{10} \approx 0.6\%$ chance of survival.
  *   After 20 weeks: $0.6^{20} \approx 0.003\%$ chance of survival.

  In the long run, the "All-In" strategy leads to **almost sure ruin**. The "Expected Value" of an all-in strategy over 20 weeks is technically huge (because of the tiny chance you win 20 times in a row and have billions), but the **most likely outcome** (the mode) is zero.

  ### 2. The Solution: The Kelly Criterion

  There is a principled, mathematical way to determine the exact fraction of your bankroll to wager to maximize long-term growth without risking ruin. It is called the **Kelly Criterion**.

  The formula for the optimal fraction $f^*$ is:
  $$f^* = \frac{p(b + 1) - 1}{b}$$
  Or, more simply when net odds are 1:1 (you win what you bet):
  $$f^* = p - q$$

  Where:
  *   $p$ = Probability of winning ($0.6$)
  *   $q$ = Probability of losing ($0.4$)
  *   $b$ = Net odds received on the wager (Profit per $1 wagered).

  **Let's apply it to your simulation:**
  The prompt says a win "doubles whatever you put in" (you get your stake back + an equal amount profit). So, $b = 1$.
  *   $p = 0.6$
  *   $q = 0.4$

  $$f^* = 0.6 - 0.4 = 0.2$$

  **The mathematically optimal strategy is to bet exactly 20% of your current balance every week.**

  ### 3. Why Jordan is Wrong About "Risk Aversion"

  Jordan claims your hesitation is "irrational risk aversion." In standard Expected Utility Theory, preferring a sure thing over a gamble with higher EV is indeed called risk aversion. **However**, that framework assumes you care about the *average outcome across many parallel universes*.

  In this seminar, you live in **one timeline**. You experience the sequence of wins and losses over time. This is a concept called **Ergodicity**.
  *   **Ensemble Average (Jordan's view):** If 1,000 people bet all-in once, the average wealth is high.
  *   **Time Average (Your view):** If 1 person bets all-in 1,000 times, their wealth goes to zero.

  By betting 20% (Kelly), you are not being "risk averse" in a psychological sense; you are maximizing the **Expected Logarithmic Utility** of your wealth. This is the only utility function that maximizes the long-term geometric growth rate.
  *   **Betting < 20%:** You grow slower than optimal (too conservative).
  *   **Betting 20%:** You maximize growth rate (optimal).
  *   **Betting > 20%:** Your growth rate *decreases* and volatility increases.
  *   **Betting 100%:** Your growth rate becomes negative infinity (ruin).

  Ironically, Jordan's strategy isn't "aggressive"; it's mathematically self-destructive. Betting *more* than the Kelly fraction actually reduces your expected long-term return.

  ### 4. What This Means for Your Seminar

  Since this is a **Decision Theory** seminar, it is highly likely that this simulation was designed specifically to teach this lesson. The professor rigged the odds to be positive (60%) to tempt students into thinking "more bet = more gain," only to punish those who ignore bet sizing.

  **Here is how you can handle this:**

  1.  **Stick to your strategy:** You are outperforming Jordan for a mathematical reason, not luck.
  2.  **Use the Kelly Fraction:** You can justify your specific wager size by citing the Kelly Criterion ($f = p - q = 0.2$). This shows you aren't just "guessing" a safe number, but calculating the growth-optimal fraction.
  3.  **Reframe the "Risk" Argument:** In your project write-up, explain that in repeated multiplicative games, **Volatility Drag** (the reduction in compound returns caused by variance) is a mathematical cost, not just a psychological preference.
      *   *Example:* If you lose 50% of your money, you need a 100% gain to get back to even. High variance makes recovery harder.
  4.  **Mention Ergodicity:** If you want to impress the professor, mention that Jordan is optimizing for the *ensemble average* while you are optimizing for the *time average*. (This is a hot topic in modern decision theory, often associated with physicist Ole Peters).

  ### Summary
  *   **Jordan:** Maximizing Arithmetic EV. Correct for a single bet, guarantees ruin in repeated bets.
  *   **You:** Maximizing Geometric Growth. Correct for repeated bets.
  *   **Optimal Bet:** 20% of current balance (Kelly Criterion).

  You are not being irrationally risk-averse; you are correctly identifying that **survival is a prerequisite for compounding.** Jordan is playing a game of "who can get the highest theoretical average," while you are playing the actual game of "who has the most money at the end of the semester." You are winning.
