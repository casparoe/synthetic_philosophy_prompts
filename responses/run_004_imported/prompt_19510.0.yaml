answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Co-op Name]
  **FROM:** Elections Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Voting Method Reform

  **Context**
  Following our first election using Ranked-Choice Voting (RCV), the Committee acknowledges the resulting division. While RCV successfully eliminated vote-splitting compared to our previous plurality system, the outcome failed the "Condorcet criterion": the winner lost in head-to-head comparisons against an eliminated candidate. This has eroded trust among half the membership, while others argue that mathematical imperfections make further changes futile.

  **Engaging with Arrow's Impossibility Theorem**
  The Board President is correct that Arrow's Theorem proves no ranked voting system can satisfy all fairness criteria simultaneously. However, the conclusion that we should therefore "not bother" is a non-sequitur. Arrow's Theorem does not say all systems are *equally* flawed; it says we must choose *which* flaws we prefer.

  Our goal is not mathematical perfection, but community legitimacy. A system that frequently ignores pairwise majorities (like RCV can) creates a perception of illegitimacy in a small community like ours. We must select the method whose specific trade-offs best align with our co-op values: transparency, consensus, and trust.

  **The Case for Retaining RCV**
  We must acknowledge the strongest argument for staying the course. RCV is a significant improvement over plurality voting, as it allows members to express nuance without fear of "wasting" their vote. It is also becoming an industry standard for housing co-ops, meaning educational resources are readily available. Switching methods now risks confusing members who just learned the new system.

  **Recommendation: Condorcet Voting (Minimax Method)**
  Despite the familiarity of RCV, the Committee recommends adopting **Condorcet Voting** (specifically the Minimax variation) for future board elections.

  **Reasons for Recommendation:**
  1.  **Directly Addresses the Grievance:** The current unrest stems from the fact that a candidate preferred by a majority in pairwise comparisons lost. Condorcet methods guarantee that if a candidate beats every other opponent head-to-head, they win. This directly resolves the "rigged" narrative.
  2.  **Prioritizes Consensus:** In a 34-unit co-op, board members must work together. Condorcet methods tend to elect broad consensus candidates rather than polarizing figures who might win under RCV's elimination rounds.
  3.  **Feasibility:** For a small electorate (34 ballots) and typical board slate (3 candidates), manual tabulation is straightforward. We will provide a simple grid for tellers to calculate pairwise wins.
  4.  **Mathematical Honesty:** While Arrow's Theorem still applies (Condorcet methods can have cycles, though rare with 34 voters), this method prioritizes the "Majority Criterion," which we believe is the most critical metric for maintaining member trust.

  **Next Steps**
  We request Board approval to amend the Bylaws to specify Condorcet Voting for the next election cycle. The Committee will prepare a one-page explainer for the membership to ensure a smooth transition.

  **Conclusion**
  No voting system is immune to paradoxes, but some are better suited for community governance than others. By adopting Condorcet Voting, we prioritize the will of the majority in direct comparisons, restoring confidence that every vote counts toward a legitimate outcome.
