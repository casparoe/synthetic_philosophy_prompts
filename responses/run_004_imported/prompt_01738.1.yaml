answer: |-
  **Title:** The Ironist's Wager: Solidarity Without Foundations
  **To:** A Novelist in Procrastination
  **From:** A Philosophical Interlocutor

  Your novel idea is sharp. It captures the precise mechanism Rorty describes: the contraction of the "we." When the town learns the family is undocumented, the neighbors stop seeing them as "people who worry about mortgages and school runs" (us) and start seeing them as "illegal aliens" (them). The moral failure isn't a failure of logic; it's a failure of imagination.

  This is why Rorty's *Contingency, Irony, and Solidarity* (CIS) seduced you. He tells you that your job—making cruelty vivid—is more important than the philosopher's job of defining justice. But then Norman Geras steps in with the cold water: If there is no objective human dignity, if morality is just a "contingent vocabulary," on what grounds do you call the town's initial inclusivity *better* than their subsequent exclusion? If morality is made, not found, isn't the fascist just making a different vocabulary?

  You asked for a verdict, not a shrug. Here it is: **Rorty is consistent, but only by accepting a cost that most liberals find terrifying. He saves the novelist's role by sacrificing the philosopher's authority.** He can call the expansion of solidarity "progress," but only if we admit that "progress" is a tribal preference, not a universal truth. This does not undermine your novel; it radically clarifies its purpose.

  ### The Geras Trap

  To understand the bind, we have to look at what Rorty throws away. Traditional liberalism relies on the idea of a "common humanity." We treat people well because they possess an intrinsic worth, a rational soul, or a set of natural rights. This provides a safety net: even if the town turns against your undocumented family, the town is *objectively wrong*. They are violating a moral law written into the fabric of the universe.

  Rorty cuts that net. He is an antirepresentationalist. He believes language does not "mirror" reality. There is no "human nature" to discover. There are only different ways of describing people. For Rorty, solidarity is not a matter of recognizing a pre-existing similarity; it is a matter of *creating* similarity through imagination.

  Geras's critique is devastatingly simple: If there is no pre-existing moral truth, then Rorty's preference for a liberal society over a cruel one is just that—a preference. It is no more "true" than a preference for vanilla over chocolate. If a town decides to contract its solidarity and expel the undocumented family, Rorty cannot say they are violating Moral Law. He can only say, "We liberals don't do that."

  If Rorty claims the town is *wrong* in a universal sense, he is smuggling in the very metaphysical truths he claims to reject. If he admits they aren't wrong, just "different," his liberalism collapses into relativism. This is the bind: **He wants the emotional force of moral outrage without the metaphysical cost of moral truth.**

  ### The Escape Hatch: Ethnocentrism

  So, how does Rorty escape? He doesn't try to climb out of the hole; he digs deeper.

  Rorty's defense is "ethnocentrism." He admits that his liberalism is not based on Reason or Truth. It is based on the specific historical traditions of Western liberal democracies. When he says expanding solidarity is "progress," he does not mean "progress toward the True Goal of Humanity." He means "progress toward the specific goals *we* (liberals) have set for ourselves."

  For Rorty, justification is always circular. You justify liberal values to liberals using liberal values. You do not justify them to Nazis using Nazi values, because that's impossible. You simply try to turn Nazis into liberals by manipulating their sentiments, not their logic.

  This is where he answers Geras. Rorty *can* call the town's initial inclusivity "better," but only relative to the vocabulary of liberalism. He is not appealing to the Universe; he is appealing to *us*. He argues that a society that minimizes cruelty is more desirable *for people like us*, who have been educated to see cruelty as the worst thing we do.

  Is this consistent? **Yes.** It is rigorously consistent. Rorty refuses to step outside his own skin to find a "God's eye view." He stays within the contingent vocabulary of liberalism and argues that this vocabulary produces less suffering than the alternatives.

  ### The Cost: The Loss of the Universal Stick

  But consistency comes with a price tag, and this is where you, the novelist, need to pay attention. The cost of Rorty's consistency is that he loses the ability to shame the cruel on *their* own terms.

  If the town neighbors say, "We don't care about your liberal sentiments; we care about national purity," Rorty has no philosophical argument to defeat them. He cannot say, "You are violating human rights," because he doesn't believe in human rights as objective entities. He can only say, "That description of the world makes me sad," or "That description leads to a society I don't want to live in."

  To many, this feels toothless. It feels like disarming in the face of evil. If morality is just sentiment, what happens when the sentiment changes? What if the town *likes* the cruelty?

  This is the genuine weakness in Rorty's armor. By rejecting representationalism, he removes the "stop" sign that stands outside of history. There is no external brake on cruelty, only the internal brake of our own cultivated sensitivities. If those sensitivities erode, there is nothing to stop the slide except force or counter-sentiment.

  ### The Novelist's Vindication

  However, here is the twist that saves your career and validates your intuition: **This weakness is exactly why the novel is necessary.**

  If Geras were right—if there were objective moral truths accessible through reason—then philosophy would be enough. We could simply teach the neighbors the Categorical Imperative or the Theory of Justice, and they would stop being cruel. Reason would compel them.

  But Rorty argues (and history suggests) that reason does not compel moral action. People can be logically consistent Nazis. The only thing that stops cruelty is the ability to see the stranger as a fellow sufferer. And that is not a job for logic; it is a job for the imagination.

  Rorty's rejection of moral truth *forces* the burden of moral progress onto the arts. Because there is no abstract "Human Dignity" to appeal to, we have to make the specific, contingent suffering of *this* undocumented family vivid. We have to redescribe them not as "illegals" but as "parents afraid of deportation."

  Rorty's system holds together, but it holds together only if the literary imagination does the heavy lifting. He trades the philosopher's stone for the poet's pen.

  ### The Verdict

  So, can Rorty's antirepresentationalism coexist with his liberal hope?

  **Yes, but only if we accept that liberalism is a form of poetry, not physics.**

  Rorty is right that we cannot ground our morality in the stars. He is right that "progress" is just a name we give to the expansion of our own sentimental preferences. Geras is right that this leaves us without a universal weapon against evil. But Rorty is *more* right that this is the only game in town. We are never going to agree on metaphysics. We might agree on pain.

  For you, the novelist, this is not a bug; it is a feature. It means you are not secondary to the moral project. You are not illustrating philosophical truths; you are *creating* the moral truths by expanding the range of who counts as "one of us."

  When your neighbors stop helping the family, they aren't violating a law of nature. They are failing to maintain a specific, fragile story they tell themselves about who they are. Your novel's job is to retell that story until excluding the family becomes impossible not because it is "false," but because it is "unimaginable."

  Rorty survives the critique, but he survives as a literary critic, not a systematic philosopher. He saves solidarity by admitting it is contingent. And in doing so, he hands the keys of moral progress to people like you. The town won't change because they are convinced by an argument. They will change because a story made it too painful to look away.

  That is a heavy burden, but it is a real one. And it is far more flattering than the idea that you are just decorating the walls of a cathedral built by philosophers. You are building the cathedral.
