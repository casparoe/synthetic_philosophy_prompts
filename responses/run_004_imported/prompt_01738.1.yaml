      *   *Wait, let's go bolder.* The prompt asks: "Either defend... or explain why he can't." I should pick a side.
      *   *Selection:* I will defend Rorty, but with a twist. I will argue that Geras's critique assumes "justification" requires "grounding in reality," which is exactly what Rorty rejects. Rorty *can* call it progress because "progress" is an internal standard of the liberal tradition, not an external metric. The cost is that he cannot convince the enemy, but he doesn't need to. This empowers the novelist: you aren't appealing to Reason, you're appealing to Sentiment.
      *   *Actually, looking closer at the prompt:* "I'd rather have a committed answer I can argue with."
      *   *Final Decision:* I will argue that Rorty *does* lose the right to call it objective progress, but that this is a feature, not a bug. However, to satisfy the "verdict" requirement, I will argue that the tension is *resolved* by shifting the locus of authority from Philosophy to Literature. Rorty is right that novels do the work, but wrong to think he needs to philosophically justify why that work matters. The verdict: **Rorty is consistent, but only by admitting his liberalism is an act of faith, not reason. This doesn't weaken the novelist's project; it liberates it.**

      *   *Wait, one more consideration:* Is that too wishy-washy? Let's try to be sharper. Geras is right that Rorty lacks a *universal* stick to beat the fascists with. But Rorty's point is we don't *need* a universal stick. We need a bigger heart. The verdict should be: **Rorty is consistent, but the cost is higher than he admits. He saves the "novel" at the expense of the "philosopher."**
      *   *Okay, let's go with a nuanced defense:* Rorty's antirepresentationalism *is* compatible with his liberal hope, provided we understand "better" as "better for us" (liberals) rather than "better in the eyes of the Universe." Geras misses that Rorty is doing ethnography of *us*, not metaphysics.
      *   *Actually, the most compelling argument for a writer:* Rorty's "failure" to ground morality objectively is exactly why the novelist is necessary. If morality were objective, philosophy would suffice. Because it's contingent, we need stories to make the contingency feel like necessity.
      *   *Okay, Plan:*
          1.  Acknowledge the Geras critique (it's strong).
