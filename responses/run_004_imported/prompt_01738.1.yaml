      *   **The Conflict:** Norman Geras's critique: If there's no objective moral truth, how can Rorty claim expanding "us" is *better* than contracting it? Isn't it just one preference vs. another?
      *   **The User's Stake:** A novelist who finds Rorty's claim (novels drive moral progress better than philosophy) flattering and useful, but worries the philosophical foundation is self-undermining.
      *   **The Task:** Write an *actual essay* with a *real verdict*. No "reasonable people disagree" hedging. Defend Rorty *or* explain why he fails and what it costs.
      *   **Tone:** Intellectual, engaging, slightly conversational (matching the user's voice), but rigorous.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Rorty's Position:* Truth is made, not found. Morality is a matter of sentiment and solidarity, not rational obligation based on shared humanity. Novels help us see strangers as fellow sufferers.
      *   *Geras's Critique:* Without a normative anchor (human rights, common dignity), Rorty's liberalism is groundless. If the Nazis successfully redescribe Jews as vermin, Rorty can only say "I don't like that," not "That is wrong."
      *   *The Core Question:* Can pragmatism justify its own preferences without smuggling in metaphysics?

  3.  **Determine the Verdict:**
      *   *Option A (Defend Rorty):* Argue that "better" doesn't mean "truer," it means "more useful for our specific liberal goals." The justification is circular but virtuously so (ethnocentrism).
      *   *Option B (Critique Rorty):* Argue that Geras is right. Rorty *does* need a thin theory of human suffering/capacity to make his claim work, and denying it weakens his political stance.
      *   *Decision:* The prompt asks for a *committed answer*. A pure defense often feels like apologetics; a pure critique feels like dismissal. The most interesting path is a *qualified defense* that admits a cost but argues the cost is worth it and the critique misunderstands the pragmatic function of "progress." However, looking at the strength of Geras's critique, it's hard to ignore that Rorty *does* struggle here.
      *   *Better Verdict:* I will argue that Rorty *can* coexist, but only if we accept that his "progress" is purely aesthetic/sentimental, not rational. However, to make it stick for the novelist, I need to show why this *helps* the novelist. Actually, the stronger philosophical move is to argue that Geras is asking the wrong question. Rorty isn't trying to justify liberalism to a Nazi; he's talking to liberals. But the prompt asks if he can call it *progress*.
