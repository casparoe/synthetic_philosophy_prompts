      *   *FLP Impossibility Result (1985):* Deals with asynchronous consensus. Deterministic, asynchronous, one failure $\rightarrow$ No consensus.
      *   *Are they the same?* Superficially, yes (impossibility of aggregation/consensus). Deep down, *no*. The constraints, models, and implications are fundamentally different.
      *   *Did they reinvent it?* Not really. The mathematical structures are distinct. The "vibe" is similar (impossibility of perfect systems), but the "physics" of the problems differ.
