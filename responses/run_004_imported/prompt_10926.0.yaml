      *   *Premise 2:* An NDE *is* sense data (or qualia) of an overwhelming order.
      *   *Premise 3:* If the experience is indistinguishable from reality (or more vivid), dismissing it as "hallucination" is an ad hoc hypothesis to save the theory.
      *   *Conclusion:* The theory must expand to accommodate the data, even if the data is private.
      *   *Refinement:* Ayer would struggle with the "private" aspect. The argument needs to be that the *certainty* of the experience rivals mathematical certainty.

  8.  **Final Polish:**
