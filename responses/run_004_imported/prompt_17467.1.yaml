answer: |-
  This is a classic case of what ethicists sometimes call **the collapse of the supererogatory into the obligatory**, though in institutional contexts, it is more precisely a form of **structural exploitation of virtue**. Your intuition is correct: something has gone wrong with the normative categories at play here.

  Since you are in philosophy, I will skip the HR advice and stick to the normative mechanics. Here is a breakdown of the phenomenon, why it threatens the stability of the category you are gesturing at, and a principled argument for how Meera can exit the situation.

  ### 1. The Phenomenon: Customary Normativity and the "Baseline Shift"

  In standard deontic logic, we distinguish between the **obligatory** (required), the **permissible** (allowed), and the **supererogatory** (good to do, not wrong to omit). J.O. Urmson's classic 1958 paper "Saints and Heroes" established that for an act to be supererogatory, its omission must not be blameworthy.

  The problem in your department is a shift in **customary normativity**. When an agent repeatedly performs a supererogatory act within a specific community, two things happen:
  1.  **Epistemic Shift:** The community updates its belief about what is *necessary* to achieve the collective good (student placement).
  2.  **Deontic Shift:** The community updates its belief about what is *required* of members of that community.

  This is not merely "people getting used to nice things." It is a specific failure of **institutional moral accounting**. The department has a duty to ensure students are advised. By allowing Meera to fulfill this duty through supererogatory labor, the department has effectively outsourced a collective obligation to an individual's discretion.

  Once that labor becomes the *only* mechanism by which the collective duty is met, the act loses its supererogatory status *for the collective*, even if it remains voluntary *for the individual*. The new hire is being judged against a **customary baseline** that has been inflated by Meera's unpaid labor. He isn't violating his contract, but he is violating the *local norm* that Meera inadvertently codified.

  ### 2. Is the Category Unstable?

  You asked if this suggests the category of supererogatory acts is less stable than it looks. The answer is nuanced: **The category is stable, but its boundary is context-dependent.**

  David Heyd, in his seminal work *Supererogation*, argues that the boundary between duty and supererogation is not fixed by the act itself but by the **social and institutional context**. An act that is supererogatory in one context (staying late at a job where overtime is unpaid and optional) can become obligatory in another (staying late during a crisis where lives are at stake).

  The instability you are sensing is actually **institutional parasitism**. Institutions are prone to absorbing individual virtue to cover structural deficits. If a department can get adequate advising only because Meera works weekends, the institution will treat weekend work as a functional requirement, regardless of the contractual reality.

  So, the category of "supererogation" hasn't collapsed; rather, the **institution has failed to maintain the conditions that make supererogation possible.** Supererogation requires a baseline of sufficiency. If the baseline duties (standard advising) are insufficient for the institution's goals, and Meera fills the gap, she isn't being a "saint"; she is plugging a leak in the institutional hull. The problem is that the institution has decided the leak doesn't need fixing, as long as Meera keeps bailing water.

  ### 3. The "Moral Saint" Objection

  Your friend's comment about Susan Wolf's "Moral Saints" is relevant but slightly off-target. Wolf argues that moral saints are unattractive because they lack non-moral virtues (hobbies, humor, etc.).

  Meera's situation is closer to what Tracy Isaacs calls **moral exploitation**. The issue isn't that Meera is *too* moral; it's that the department is relying on her moral excess to compensate for their moral adequacy. The new hire is being penalized not because he is immoral, but because he is **morally compliant** (doing his duty) in a system that rewards **moral excess**.

  This creates a **collective action problem**. If everyone does what Meera does, the standard ratchets up until it becomes unsustainable for everyone (including Meera). If everyone does what the new hire does, the students suffer because the baseline is too low. The ethical failure lies with the Chair/Department for not calibrating the baseline to match the actual requirements of the job.

  ### 4. A Principled Exit Strategy

  Meera cannot simply "stop being nice," because that frames the withdrawal as a loss of virtue. She needs to frame it as a **restoration of normative order**. Here is a three-part principled argument she can use to scale back without incurring blame.

  #### A. The Argument from Universalizability (Kantian)
  Meera should argue that her past behavior **cannot be universalized**.
  *   *Premise 1:* A norm is only valid if it can be sustained by any reasonable person in that role.
  *   *Premise 2:* Meera's level of advising (weekends, weekly check-ins) leads to burnout and is not sustainable for a standard faculty load.
  *   *Conclusion:* Therefore, Meera's past behavior cannot be established as a general norm for the department.
  *   *Application:* By continuing to do it, Meera is actually setting a **harmful precedent** that makes the department unjust for future hires (like the new colleague). Scaling back is not "caring less"; it is **refusing to set an exploitative standard** for her colleagues.

  #### B. The Argument from Institutional Integrity
  Meera needs to shift the locus of the obligation.
  *   *Current Frame:* "Meera is choosing to work less."
  *   *Reframed:* "The department is relying on an anomalous distribution of labor that obscures our actual resource needs."
  *   By scaling back, Meera forces the department to confront the reality that standard advising is insufficient for their goals. If the students suffer, that is data the Chair needs to address (by hiring more staff, reducing loads, etc.), not data that Meera needs to absorb. Continuing to absorb it is **enabling institutional negligence**.

  #### C. The "Sunk Cost" of Expectation
  Meera must explicitly decouple **past performance** from **future expectation**.
  *   She should communicate (perhaps in a faculty meeting or memo to the Chair): *"For the past X years, I have treated student placement as a personal priority requiring extra-contractual labor. I have realized that this creates an inequitable burden on colleagues who cannot or choose not to work outside contractual hours, and it masks the true labor cost of our placement success. Effective next semester, I will be aligning my advising load with the departmental baseline to ensure equity and sustainability."*

  This does three things:
  1.  It acknowledges the past (validating the students' anxiety).
  2.  It identifies the *harm* of the past behavior (inequity for colleagues).
  3.  It frames the withdrawal as an act of **collegial solidarity**, not individual withdrawal.

  ### Summary

  The "philosophical offness" you feel is the dissonance between **individual virtue** and **structural justice**. Meera's virtue has been weaponized into a standard of justice, which is a category error.

  The category of supererogation is stable, but it requires a just background structure to remain supererogatory. When the background structure is deficient, supererogatory acts become **substitutes for justice**. Meera is not obligated to continue being a substitute for justice. In fact, one could argue she has a duty to stop, precisely so that the injustice (the under-resourcing of advising) becomes visible and can be addressed properly.

  She isn't stopping being nice; she is stopping the **normalization of exploitation**. That is a principled, defensible, and ethically robust position.
