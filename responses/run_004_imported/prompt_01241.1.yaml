  I'm plotting a scene in my novel where two semanticists -- ex-officemates from grad school who've spent the last decade sniping at each other in journal footnotes -- end up cornered together at the wine and cheese after a colloquium talk. I want the fight to be about Lewis's triviality results for indicative conditionals, and it needs to sound like two people who actually know this material cold, not two mouthpieces reciting slogans at each other.

  Priya's view: Lewis basically finished off the idea that "if A, then B" expresses a proposition at all. She's squarely in the Adams/Edgington no-truth-value camp -- conditionals just wear their assertability conditions (equal to the conditional probability of B given A) on their sleeve, full stop. Tom thinks that's giving up way too early and wants to rescue truth conditions by going context-sensitive, something like Stalnaker's selection-function semantics or Kratzer's restrictor idea, so Lewis's proof never gets one fixed proposition to pin down and attack.

  Could you write it out as real back-and-forth -- neither of them should win by default, and they actually need to respond to what the other just said instead of talking past eachother. I have a vague memory that Priya has a good comeback involving Stalnaker's own semantics running into its own version of the problem, plus something about Kratzer-style theories not being obviously safe either -- and that Tom has a real answer to the embedding/Frege-Geach trouble her view is supposed to have, better than just shrugging it off. Don't remember the details though, so get those right, and don't let it resolve neatly at the end.
