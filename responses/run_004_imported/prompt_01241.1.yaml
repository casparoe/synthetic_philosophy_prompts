answer: |-
  The cheese was hard enough to chip a tooth, and the Pinot Noir tasted faintly of cork, but Priya wasn't going to leave the corner of the room just to avoid Tom. She swirled her plastic cup, watching him hover. They'd been circling each other since 2014, starting with a polite disagreement in *Linguistics & Philosophy* that had devolved into parenthetical jabs in footnotes, then full-blown appendices.

  "You enjoyed the talk," Tom said. It wasn't a question. He was wearing the same tweed jacket he'd worn at the APA five years ago, the one Priya had once described in a review as 'epistemically opaque.'

  "Margolis is chasing ghosts," Priya said. "He's trying to derive a probability distribution from a truth condition that doesn't exist. It's 1976 all over again. Lewis killed the proposition. We just haven't admitted it yet."

  Tom took a sip of wine, unbothered. "Lewis killed the *fixed* proposition, Priya. There's a difference. You're still treating Lewis's triviality result like it's a theorem of physics rather than a constraint on a specific set of assumptions."

  "It's a reductio," she said, stepping over a discarded napkin. "If you assume 'If A, then B' expresses a proposition $A \rightarrow B$, and you assume the probability of that proposition equals the conditional probability $P(B|A)$, the only non-trivial probability spaces are the ones where agents are omniscient. Since we aren't omniscient, conditionals don't express propositions. Adams was right. Assertability is all there is."

  "Assertability conditions don't embed," Tom said smoothly. "That's the Frege-Geach problem you've been dodging for a decade. If 'If it rains, the match is cancelled' has no truth value, what is the semantic value of 'It is not the case that if it rains, the match is cancelled'? You can't negate an assertability condition. You need a proposition to operate on."

  Priya laughed, a sharp sound that made a nearby postdoc look up. "Oh, please. We've had expressivist semantics for thirty years. Gibbard, Yalcin, even Edgington. We handle embedding by shifting the context of assessment. We don't need truth conditions to explain why 'If A, then B' functions in a logical argument. We need *validity*, and validity preserves assertability."

  "Validity preserves truth," Tom corrected. "And you're glossing over the cost. To save your view, you have to reject Import-Export. You have to say that 'If A, then if B, C' isn't equivalent to 'If A and B, then C.' But intuitively, it is. My view respects that intuition."

  "Your view respects it straight into a triviality trap," Priya shot back. "You think you can dodge Lewis by going Stalnakerian? Making the proposition context-sensitive? Hájek buried that in '98. Even if the selection function shifts with context, if you assume the selection function is measurable with respect to the probability function, you get triviality again. You can't just wave your hands and say 'context shift' while keeping the logic classical."

  Tom leaned against the wall, crossing his arms. "Hájek assumes the selection function is independent of the probability function in a way that real context dynamics aren't. Look, if I say 'If Oswald didn't kill Kennedy, someone else did,' the context set is one thing. If I conditionalize on 'Oswald didn't kill Kennedy,' the context set shrinks. The proposition expressed by the conditional isn't fixed across the update. Lewis's proof requires the proposition to remain constant while we conditionalize on $A$. But in Stalnaker's framework, conditionalizing on $A$ changes the world of evaluation. The proof doesn't get a foothold."

  "It gets a foothold the moment you try to iterate," Priya said, pointing a cracker at him. "Because eventually, you need to assign a probability to the conditional *itself*. And if you do that, you're treating it as a proposition. And if you treat it as a proposition, Hájek shows you're trivial. You're trying to have your cake and eat it too. You want the truth conditions to ground the logic, but you want them to be slippery enough to avoid the math."

  "Better slippery than non-existent," Tom said. "And don't pretend the restrictor view is safe for you, either. Kratzer says 'if' isn't a binary connective. It's a restrictor on a covert modal. You like that, right? Because it dissolves the binary proposition."

  "It supports the Adams thesis," Priya said. "If 'if' just restricts the modal domain, then the probability of the claim is just the measure of the $B$-worlds within the $A$-restricted domain. $P(B|A)$. No need for a truth-conditional $A \rightarrow B$."

  "But Kratzer's semantics is still truth-conditional," Tom pounced. "The sentence 'If A, must B' is true or false relative to a modal base and ordering source. The difference is, the modal is explicit. When it's covert, it's still there. So I *do* have truth conditions. I just acknowledge that they depend on the conversational context. And that context-sensitivity is exactly why Lewis's proof fails. He assumes a single proposition $X$ such that $P(X) = P(B|A)$. I say there is no single $X$. There's $X_c$ for context $c$. When you update on $A$, you move to $c'$. Now you have $X_{c'}$. Lewis's algebra breaks."

  Priya took a long drink of the corked wine. "Okay. So you're a contextualist. But here's the problem. When I assess your utterance, I need to know what proposition you expressed. If the proposition shifts every time the context shifts, how do we ever disagree? If I say 'It's not the case that if A, B,' and you say 'If A, B,' are we contradicting each other? Or are we just talking past one another because our context sets are slightly different? If it's the latter, you've saved truth conditions by making communication impossible."

  "We disagree because we're proposing updates to the common ground," Tom said. "I'm saying the common ground should be updated to exclude $A \land \neg B$ worlds. You're saying... what? That you're merely expressing a high conditional credence? If I have low conditional credence, we haven't disagreed about the world. We've just compared spreadsheets. That's not semantics, Priya. That's psychology."

  "It's semantics of use," she countered. "And it explains why we don't assign probabilities to conditionals the way we do to indicatives. I don't believe 'If it rains, it pours' is true. I just find it highly assertable given rain."

  "Then explain this," Tom said, pushing off the wall. "Embed it under a belief report. 'John believes that if it rains, it pours.' If the content of the *that*-clause isn't a proposition, what is the object of John's belief? You can't believe an assertability condition. Beliefs are propositional attitudes."

  "John's belief state is representable by a probability function," Priya said, not missing a beat. "He has a high conditional probability. We model the *content* of the belief as a set of probability functions, not a set of worlds. Rothschild's done the work on this. We can handle the embedding without positing a truth-conditional proposition that Lewis would trivialize."

  "Rothschild assumes a specific structure on the probability functions that's just as controversial as Stalnaker's selection function," Tom said. "And you still haven't answered the negation issue. 'It's not the case that if A, B.' On your view, that's... what? 'It's not assertable'? But I can assert 'It's not the case that if you study, you'll fail' even if I think studying makes passing *likely* but not certain. Your view predicts that sentence should be false or meaningless unless the conditional probability is 1. But it's not."

  Priya paused. She knew this objection. It was the one she'd spent the last three years trying to patch. "We distinguish between wide-scope and narrow-scope negation. The natural language negation often targets the assertability, not the content."

  "That's a distinction without a difference when you embed it further," Tom said. " 'If it's not the case that if A, B, then C.' Now you're nesting assertability conditions inside a conditional antecedent. Your probability calculus gets messy. Mine stays clean. Compositionality works because the parts contribute truth values to the whole."

  "Compositionality works because the parts contribute *context change potentials*," Priya insisted. "You're fetishizing truth values because you think they're the only way to do logic. But dynamic semantics shows you can do logic with updates. And Lewis's result stands. You can't assign a stable probability to a truth-conditional conditional without collapsing."

  "And you can't explain logical consequence without truth preservation," Tom said.

  "Consequence is about incoherence," Priya said. "It's incoherent to assert A, assert If A then B, and deny B."

  "That's just Modus Ponens," Tom said. "Which my semantics validates. Yours doesn't, not strictly. You validate it pragmatically. But semantics is supposed to explain *why* the pragmatics work."

  The host began clinking a spoon against a glass, signaling the end of the reception. The spell broke. People started moving toward the door, gathering coats.

  Tom set his cup on a crowded table. "Look. Send me the draft. The one where you try to patch the negation problem. I'll look at the Hájek citation."

  Priya picked up her bag. "Only if you send me the chapter on context-shifting. I want to see how you handle the diagonal proposition without running into the same triviality result when you iterate the updates."

  "Deal," Tom said. He hesitated, then offered a thin smile. "You know Lewis would have hated this wine."

  "Lewis would have said the wine doesn't express a proposition," Priya said, turning toward the coat rack. "It just has high assertability conditions given the price."

  Tom chuckled, but he was already pulling out his phone, likely to check a reference. "See you in the footnotes, Priya."

  "Count on it, Tom."
