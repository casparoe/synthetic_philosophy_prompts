      *   **The Number Theorist's View (Bayesian/Heuristic):** We don't know the truth value. We have evidence (computational verification, analogies with random matrix theory, consequences that would be weird if false). We need a way to quantify uncertainty to guide research (e.g., should I build a cryptosystem assuming RH is true?).

