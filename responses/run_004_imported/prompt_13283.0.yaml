      *   *Is "Give up consistency" too radical?* I need to frame it as "Give up the principle that rational belief is closed under conjunction." That's the technical philosophical move (Kyburg).
      *   *What about the "Look-Elsewhere" specifically?* That's actually a correction mechanism to *avoid* the paradox locally. But globally (across a career), the Preface remains. I need to make sure I don't conflate the Look-Elsewhere correction with the paradox itself. The paradox arises *after* you've done your due diligence and still know you're fallible.

