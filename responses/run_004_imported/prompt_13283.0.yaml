  10. (Final Polish): Ensure the distinction between *statistical* error (Lottery) and *systematic/model* error (Preface) is clear, as a physicist will care about that distinction. (Self-correction: Actually, Lottery is about probability mass, Preface is about error distribution. In physics, both apply. I will focus on the structural logic.)

