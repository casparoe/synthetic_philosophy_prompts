prompt: |-
  I'm on my university's Greek life judicial board, and this Friday's hearing has two cases that are basically the same violation with very different outcomes. Both chapters ran the exact same banned pledge activity (an off-campus blindfolded 'trust walk') this semester -- in one case nobody was hurt, in the other a pledge got hit by a car and is still in the ICU, which by all accounts was a total fluke neither chapter couldve seen coming. Nationals for the second chapter is arguing both chapters should get the same sanction (probation) since the actual rule-breaking was identical; a couple board members want to pull that chapter's charter anyway given how things turned out. Our code just says sanctions should fit 'the severity of the incident,' and that phrase is doing a lot of work here since people clearly mean different things by it. Can you draft the memo I'll bring to the hearing recommending concrete next steps for each chapter, in a way that actually engages the 'you'd just be punishing bad luck' objection instead of brushing past it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's Greek life judicial board.
      *   **Task:** Draft a memo for the upcoming hearing regarding two cases.
      *   **Scenario:** Two chapters committed the *exact same* violation (banned off-campus blindfolded "trust walk").
          *   Case A: No injuries.
          *   Case B: Pledge hit by a car, currently in ICU (unforeseeable accident).
      *   **Conflict:**
          *   Nationals (for Case B) argues for equal sanctions (probation) because the *act* was identical.
          *   Some board members want to revoke Case B's charter because of the *outcome*.
          *   Code Language: Sanctions should fit "the severity of the incident."
      *   **Key Requirement:** Engage with the "punishing bad luck" objection seriously, not dismissively. Provide concrete recommendations for each chapter.

  2.  **Determine the Ethical and Procedural Framework:**
      *   **Justice vs. Outcome Bias:** In judicial systems (legal or administrative), there's a tension between *culpability* (what you did/intended) and *harm* (what happened).
      *   **The "Severity" Clause:** This is the pivot point. Does "severity" refer to the *risk* created (the act) or the *consequence* realized (the outcome)? Usually, in risk management and student conduct, both matter, but culpability must remain the baseline to avoid arbitrary punishment.
      *   **Precedent:** Treating identical violations wildly differently can set a dangerous precedent (chilling effect, claims of unfairness). However, ignoring harm can minimize the gravity of dangerous actions.
      *   **Goal:** Find a middle ground that acknowledges the identical culpability but accounts for the disparate impact without solely punishing "luck."

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the purpose and the core recommendation (differentiated sanctions based on a nuanced reading of "severity").
      *   **The Core Legal/Ethical Question:** Explicitly address the "bad luck" argument. Acknowledge that punishing *only* outcome is unfair, but ignoring outcome is irresponsible.
      *   **Interpretation of "Severity of the Incident":** Define this term. It should encompass *Risk Created* + *Harm Realized*.
          *   *Risk Created:* Identical in both cases.
          *   *Harm Realized:* Drastically different.
      *   **Recommendations:**
          *   *Chapter A (No Injury):* Standard sanction for the violation (Probation + Education).
          *   *Chapter B (Injury):* Enhanced sanction, but *why*? Not just because someone got hurt, but because the *manifestation of risk* requires a stronger corrective response. However, charter revocation might be too extreme if the act itself doesn't usually warrant it. Maybe "Enhanced Probation" or "Suspension" rather than full revocation, unless the code mandates revocation for serious injury. Let's aim for a tiered approach: Probation for A, Suspension/Enhanced Probation for B. *Self-Correction:* The prompt mentions some want to pull the charter. I need to address that. Revocation is usually for repeated offenses or extreme malice. A one-time bad outcome might not justify death penalty for the chapter *unless* the risk was so high that the mere existence of the chapter is now untenable. I should recommend a sanction that reflects the harm without being purely retributive. Let's suggest "Suspension" (temporary removal) rather than "Revocation" (permanent), or "Enhanced Probation" with strict conditions. Actually, to be decisive, I should recommend a specific tier. Let's go with: Chapter A = Disciplinary Probation. Chapter B = Deferred Suspension or Enhanced Probation with specific restitution/remediation.
          *   *Wait, looking closer at the prompt:* "A couple board members want to pull that chapter's charter." I need to take a stance. If the code says "severity of the incident," and a student is in the ICU, that is a severe incident. But is it *charter-revocation* severe? Usually, revocation is for patterns or hazing deaths. I will recommend against revocation but for a sanction significantly heavier than Chapter A to acknowledge the harm, while explicitly stating this isn't *just* about luck, but about the *realization of the risk* that the sanction aims to mitigate.
      *   **Addressing the "Bad Luck" Objection:** This is the crux. I need to explain that sanctions serve two purposes: *Retribution/Deterrence* (based on act) and *Restoration/Safety* (based on outcome).
      *   **Next Steps:** What happens at the hearing?

  4.  **Refining the Argument (The "Bad Luck" Engagement):**
      *   *Argument:* If we sanction solely on outcome, we create a "lottery of justice."
      *   *Counter-Argument:* If we sanction solely on intent/act, we ignore the actual impact on the community and the victim.
      *   *Synthesis:* "Severity" includes *consequence*. The sanction for Chapter B isn't punishment for the car hitting the pledge; it's punishment for creating a situation where that *could* happen, compounded by the fact that it *did*. The community trust is broken more severely in Case B.
      *   *Key Distinction:* Culpability is equal; Liability/Impact is not.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, objective, legally sound (within student conduct context), empathetic but firm.
      *   *Structure:*
          1.  Context.
          2.  Analysis of "Severity."
          3.  Addressing the Luck Objection.
          4.  Specific Recommendations.
          5.  Rationale.

  6.  **Review against Constraints:**
      *   Did I address the "bad luck" objection? Yes, dedicated section.
      *   Are there concrete next steps? Yes, specific sanctions.
      *   Is it a memo? Yes.
      *   Does it acknowledge the code language? Yes.

  7.  **Final Polish:** Ensure the distinction between *culpability* (the act) and *harm* (the result) is clear. Make sure the recommendation for Chapter B doesn't sound like "you killed a guy, you're done," but rather "the harm caused necessitates a higher level of accountability to restore community safety."

      *(Self-Correction during drafting)*: I need to be careful not to give legal advice. This is a student conduct memo. I should frame it around *educational* and *community safety* goals, not criminal liability.
      *Decision:* I will recommend **Disciplinary Probation** for Chapter A and **Deferred Suspension** (or similar high-level sanction) for Chapter B. I will advise against Charter Revocation unless there are prior aggravating factors, as revocation for a first offense based primarily on outcome might be overturned on appeal as arbitrary. However, I need to respect the "severity" clause. I will recommend a sanction that *reflects* the severity without being purely retributive. Let's suggest **Suspension** for Chapter B (temporary removal) vs **Probation** for Chapter A. This shows a tangible difference without the permanence of revocation.

      *Wait, one more nuance:* The prompt asks to engage the "punishing bad luck" objection. I need to make sure the memo explicitly says: "We are not punishing the car accident. We are punishing the creation of risk, weighted by the realization of that risk."

  8.  **Finalizing the Memo Structure:**
      *   **To:** Judicial Board Members
      *   **From:** [My Name/Role]
      *   **Subject:** Sanctioning Framework for Cases X & Y
      *   **Introduction:** The dilemma.
      *   **Interpretive Standard:** Defining "Severity."
      *   **The "Bad Luck" Factor:** Direct engagement.
      *   **Recommendations:** Specific sanctions.
      *   **Conclusion:** Unity of the board.

      *(Final thought)*: Make sure to emphasize that the *victim's status* (ICU) makes the incident objectively more severe in terms of community impact, regardless of foreseeability.

