      *   **The Philosophical Core (The "Hinge Thing"):** Address the temptation to say "I knew based on evidence." Explain why that's wrong philosophically *and* romantically. Love isn't a hypothesis. It's the background against which life happens.
      *   **The "Groundless" Clarification:** Make sure people don't think "groundless" means "shaky." It means "solid enough not to need propping up."
      *   **The River-Bed:** Introduce the temporal aspect. Marriage changes, but the core commitment stays fast (mostly), allowing the flow of life.
      *   **Closing:** Bring it back to the couple. A wish for their future. The actual toast.

  4.  **Drafting - Iteration 1 (Mental Outline & Tone Check):**
