      *   The "Evidence" trap. Usually, mentors say "I saw the data." But in *On Certainty*, hinges aren't proven. They are the stuff you *don't* question so you can question other things.
      *   Like, you don't question "I love you" every day. If you did, you couldn't plan dinner.
      *   The River-bed. It shifts. You grow. But the water flows.
