answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of supervising Elena's doctoral thesis. And when she asked me to speak tonight, she gave me very specific instructions. She said, and I quote: "You are permitted to do the hinge thing, provided you do not turn my wedding into a conference panel."

  So, I promise you: there will be no Q&A session after the cake. And I will try to keep the jargon to a minimum. Although, I should warn Daniel: by the end of this, you might finally know what "epistemology" means. You can tell your engineering friends you married into it.

  Speaking of Daniel, I love the story that when he met Elena, he had never encountered the word "epistemology." As a structural engineer, this makes perfect sense. Elena spends her life asking, "How do we know what we know?" Daniel spends his life making sure things don't fall down. In many ways, they are doing the exact same job.

  Elena's dissertation was on Wittgenstein's *On Certainty*. Specifically, she argued for a non-doxastic reading of hinge commitments. Now, I know what half the room is thinking: "Please stop." And the other half is thinking: "Wait, are we doing Coliva or Pritchard?"

  But there is a beautiful idea in that book that belongs at a wedding. Usually, when a mentor speaks about a couple, they are tempted to say, "I knew you were right for each other immediately. I saw the evidence. The data added up."

  But if we are being Wittgensteinian—and tonight, we are—that is actually nonsense. You don't arrive at a hinge commitment by weighing evidence. You don't test a hinge. A hinge is what allows the door to swing in the first place. It is the thing that must stand fast, exempt from proof, so that everything else—plans, arguments, dreams, Tuesday nights—can make sense.

  If you have to constantly gather evidence that you love someone, you don't have a marriage; you have a research project. And a very stressful one.

  Elena taught me that on this picture, being "groundless" is not an insult. It doesn't mean their love is shaky. It means it doesn't *need* further grounds. It is the bedrock. It is the thing they do not doubt, so that they can doubt other things. Like whether to buy a house, or whose turn it is to do the dishes, or if Daniel really understands why she gets so excited about paragraph 42 of *On Certainty*.

  And this brings me to the river-bed. Wittgenstein writes that the bed of the river shifts, but slowly. Almost imperceptibly. The water flows over it—the daily life, the joys, the friction—and the bed holds it. But over years, the bed itself can move.

  This is my wish for you both. I wish for you a love that functions as a hinge. A commitment that stands fast, not because you have proven it true every day, but because it is the background against which you live your lives. But I also wish for you the wisdom of the river-bed.

  Because you will change. The ground you stand on today will not be the ground you stand on in forty years. And that is alright. The river-bed is allowed to shift, as long as it shifts together. As long as the water keeps flowing.

  Daniel, you know better than anyone that a structure needs rigidity to stand, but enough flexibility to weather a storm. Elena, you know that certainty is not a conclusion, but a starting point.

  So, please raise your glasses.

  To Elena and Daniel. May your hinges hold fast. May your river-bed shift gently. And may you never feel the need to gather evidence for what you already know.

  To the bride and groom!
