      *   Strict but fair? Yes. (Not failing her for one mistake, but not ignoring it either).

      *(Self-Correction on the Utility point)*: Strawson does say the practices are "indispensable" to "human life." Is that utility? He says the Optimist argues from *social policy* (we *should* keep it because it's useful). Strawson argues we *cannot* give it up because it's natural. Katie says "justified by how useful it is." This is technically the Optimist's argument that Strawson critiques. I should deduct points there, but not as many as the Excuse/Exemption swap.

      *(Final Score Calculation)*:
      Reactive Attitudes: 5/5
