      *   **Why is the regress "vicious"?**
          *   A "benign" regress is like a turtle standing on a turtle (maybe okay in some metaphysics).
          *   A "vicious" regress is when the solution *requires* the very thing it's trying to explain, but fails to ground it.
          *   Analogy time: Trying to explain what "Left" means by saying "Left of *this* moment," but then needing to explain what "*this* moment" means using another "Left." You never actually define the concept; you just keep adding layers of the same undefined concept.
          *   In McTaggart's case: The problem is that A-properties (Past/Present/Future) are contradictory. Saying "It *was* future" tries to fix the contradiction by adding time. But "was" is *also* an A-property. So the new layer has the *same* contradiction. You never escape the contradiction; you just replicate it infinitely.

      *   **Who does this favor? (Presentism vs. Eternalism vs. Eliminitivism)**
          *   This is crucial. McTaggart isn't arguing *for* Presentism or Eternalism.
          *   He argues that Time *requires* the A-Series (change).
          *   He argues the A-Series is contradictory/unreal.
          *   Therefore, Time is unreal.
          *   *Modern Interpretation:* Eternalists (Block Universe) usually reject McTaggart's premise that Time *requires* the A-Series. They say the B-Series (earlier/later) is enough for time. Presentists try to defend the A-Series against the contradiction.
