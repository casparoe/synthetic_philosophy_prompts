answer: |-
  This is an excellent and philosophically astute observation. Your suspicion is well-founded: if "lacking standing" simply meant "being wrong," it would indeed be a textbook *tu quoque* fallacy. However, the contemporary literature on moral responsibility (particularly work by R. Jay Wallace, Macalester Bell, Kyle Fritz, Daniel Isserow, and others) argues that there is a genuine, non-fallacious distinction at play.

  The distinction tracks the difference between the **accuracy of a moral judgment** and the **normative authority to issue a moral demand.**

  Here is a breakdown of how to distinguish the two for your dissertation, why the fallacy charge doesn't stick to the "standing" argument, and what specific normative work the concept of standing is doing.

  ### 1. The Distinction: Truth vs. Authority
  The *ad hominem* fallacy occurs when one rejects the **truth value** of a proposition based on the characteristics of the speaker.
  *   **Fallacious *Tu Quoque*:** "You say stealing is wrong, but you steal. Therefore, stealing is not wrong."

  The "standing" objection does not target the truth value of the moral claim. It targets the **propriety of the speech act.**
  *   **Standing Objection:** "You say stealing is wrong, and you are right that it is wrong. However, because you steal, you are not the appropriate person to hold *me* accountable for it."

  In your dissertation, you can frame this as a distinction between **moral correctness** (is the act blameworthy?) and **moral address** (is this agent authorized to enact blame?). A hypocrite can be morally correct about the violation while being normatively disabled from enforcing the norm.

  ### 2. What "Standing" Tracks: The Normative Implications of Blame
  To understand why standing matters, you must look at what blame *does*. If blame were merely a descriptive statement ("You violated norm X"), the hypocrite's character would be irrelevant. But most theories of moral address view blame as a **practical, normative intervention.**

  When I blame you, I am not just describing a fact; I am:
  1.  **Issuing a Demand:** I am calling on you to recognize the authority of the moral norm.
  2.  **Altering the Relationship:** I am positing a change in our normative relationship (e.g., you now owe me an apology, or you are liable to sanction).
  3.  **Claiming Authority:** I am implicitly claiming a position of authority to hold you to account.

  **The Hypocrite's Defect:**
  Hypocrisy undermines the third element. By violating the very norm they are invoking, the hypocrite undermines their claim to authority.
  *   **The Equality Argument:** Moral community is predicated on reciprocity. To blame someone is to say, "We are both subject to this law, and you have violated it." The hypocrite says, "We are both subject to this law, *I am exempt*, and you have violated it." This asserts an illegitimate superiority, violating the equality required for moral address.
  *   **The Commitment Argument:** To blame is to imply that you take the norm seriously. Hypocrisy demonstrates that you do not take the norm seriously enough to follow it yourself. Therefore, your demand that *I* follow it is revealed as manipulative or insincere.

  ### 3. Why It Is Not a Fallacy
  The fallacy warns against confusing the *source* of an argument with the *validity* of the argument. The standing objection agrees that the *validity* (the wrongness of the act) remains intact. It argues that the *source* determines the *permissibility of the intervention.*

  **A Legal Analogy:**
  Imagine a judge sentencing a defendant for theft.
  *   **Scenario A:** The judge is honest. The sentence is valid.
  *   **Scenario B:** The judge is a known thief who steals openly.
  *   **The Claim:** "The defendant stole the car." (This remains true in both scenarios).
  *   **The Standing Issue:** In Scenario B, the judge lacks the *moral standing* to sentence the defendant, even if the defendant is guilty. If the defendant says, "You have no right to sentence me, you steal too," they are not claiming innocence. They are claiming the *procedure* is corrupted.

  In moral address, the hypocrite is like the corrupt judge. The defendant (the blamee) can acknowledge their guilt while rejecting the hypocrite's authority to administer the "sentence" of blame.

  ### 4. Key Literature for Your Chapter
  Since you are writing a dissertation, you should engage with the specific arguments that defend this distinction against the fallacy charge.

  *   **R. Jay Wallace (*Responsibility and the Moral Sentiments*):** Wallace is pivotal here. He argues that blame involves a demand for accountability. Hypocrites lack standing because they cannot make this demand without contradicting their own commitment to the norms.
  *   **Macalester Bell ("Standing to Blame"):** Bell explicitly addresses the *ad hominem* worry. She argues that standing is about the *relationship* between blamer and blamee. Hypocrisy damages the relationship such that blame becomes inappropriate, even if accurate.
  *   **Kyle Fritz & Daniel Miller ("The Relevance of Hypocrisy"):** They offer a robust defense of the standing view. They argue that hypocrites violate a norm of **non-implication**. By blaming, you imply you are committed to the norm. Hypocrisy makes that implication false, rendering the speech act misleading or infelicitous (in an Austinian sense).
  *   **Colin Macnamara:** Focuses on the communicative nature of blame. If blame is a conversation, the hypocrite is "opting out" of the conversation while trying to enforce its rules.

  ### 5. Counter-Arguments (For Balance)
  To strengthen your chapter, you should acknowledge that your intuition is shared by some philosophers who think "standing" is a myth or reducible to other factors.
  *   **The Consequentialist Challenge:** Some argue that if blaming a hypocrite produces good consequences (e.g., stops the blamee from doing wrong), the hypocrite *should* blame. Standing is an irrelevant deontological constraint.
  *   **The "Clean Hands" Objection:** Some argue that if we deny standing to hypocrites, almost no one can blame anyone, leading to moral silence. (Proponents of standing usually reply that standing can be regained through repentance or acknowledgment of one's own fault).

  ### 6. Summary for Your Dissertation
  You can frame the resolution to your suspicion like this:

  > "While the *tu quoque* fallacy correctly identifies that a speaker's vice does not negate the truth of their proposition, the concept of 'standing' operates in a different normative register. It does not assess the **propositional content** of the blame (i.e., 'Did you do wrong?'), but rather the **felicity conditions** of the speech act (i.e., 'Am I authorized to demand accountability from you?'). Hypocrisy does not make the blamee innocent; it makes the blamer's address normatively infelicitous. Thus, denying standing is not an attempt to discredit the message, but to police the terms of moral community."

  This distinction allows you to preserve the logical insight behind the fallacy warning while vindicating the philosophical utility of "standing" in theories of moral address.
