      *   However, contemporary moral philosophy (Bell, Fritz, Isserow & Klein, Wallace, etc.) distinguishes between the *content* of the blame and the *act* of blaming.
      *   The core distinction is between *propositional truth* (is the wrong wrong?) and *normative authority* (do *you* have the right to demand this of me?).
      *   I need to validate the user's intuition (yes, it looks like ad hominem) but then pivot to explain why philosophers think it's *not* ad hominem in this specific context.

  3.  **Key Concepts to Explain:**
      *   **The Ad Hominem Fallacy:** Attacks the person to invalidate the *truth* of the claim.
      *   **Standing to Blame:** Concerns the *normative permissibility* or *appropriateness* of the *speech act*, not the truth of the underlying moral judgment.
      *   **The Function of Blame:** It's not just describing a fact; it's a demand for accountability, a call for recognition, or a modification of relationships.
      *   **Hypocrisy's Specific Defect:** It violates norms of reciprocity or equality implicit in the moral community.

  4.  **Structure of the Response:**
      *   **Acknowledge and Validate:** Start by affirming the user's sharp philosophical instinct. It *does* look like ad hominem, and that's a common starting point for this debate.
      *   **The Crucial Distinction (Truth vs. Authority):** Explain that standing isn't about whether the blame is *accurate*, but whether the blamer is *authorized* to issue it. Use the legal analogy (a criminal can testify, but maybe not sentence).
      *   **Why Hypocrisy Undermines Standing:**
          *   *Commitment/Implication:* Blame implies the blamer takes the norm seriously. Hypocrisy shows they don't.
          *   *Equality/Reciprocity:* Blame posits a relationship of equals. Hypocrisy asserts superiority.
          *   *Accountability:* You can't hold someone to a standard you flout.
      *   **Addressing the Fallacy Charge:** Explicitly map why this isn't *tu quoque*. *Tu quoque* says "Your claim is false." Standing says "Your claim is true, but you're not the one to say it."
      *   **Key Literature/Authors:** Mention names relevant to a dissertation (Bell, Fritz, Wallace, Isserow & Klein, Macnamara).
      *   **Nuance/Objections:** Acknowledge that not everyone agrees (some think standing is a myth), but explain the dominant view.
      *   **Conclusion:** Summarize the distinction for the dissertation context.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Ad Hominem point:* Make sure to distinguish *circumstantial ad hominem* from the standing objection. The fallacy rejects the *premise*. Standing rejects the *speech act*.
      *   *Analogy time:* The legal judge analogy is standard but effective. A judge who breaks the law can't sentence someone, even if the defendant broke the law. Or a parent telling a child not to smoke while smoking.
      *   *Moral Address specific:* Since the user is writing on *moral address*, focus on the communicative aspect. Blame is a demand. Hypocrites make demands they aren't willing to accept themselves. This makes the demand unfair or manipulative.
      *   *The "Normative Power" angle:* Blame changes the normative landscape (guilt, obligation to apologize). Hypocrites lack the power to effect this change.

