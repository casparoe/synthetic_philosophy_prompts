answer: |-
  This is a fantastic question, and you have correctly identified that the friction here isn't about physics; it's about metaphysics. You and your family are running into a classic problem in philosophy known as the **Puzzle of Material Constitution**, closely related to the *Ship of Theseus* and the *Statue and the Clay*.

  The short answer is: **There is no settled scientific answer because "object identity" is not a physical property.** It is a cognitive and social categorization tool.

  Your brother is arguing from the perspective of **mereological materialism** (the object is just the sum of its physical parts). Your mother is arguing from the perspective of **hylomorphism** (the object is matter + form + history) and **social ontology** (the object is a node in a network of relationships).

  Here is the breakdown of why this disagreement is structurally unsolvable, and why you see it everywhere.

  ### 1. The Sortal Problem (Watch vs. Gold)
  The core of the disagreement lies in what philosophers call **sortal concepts**. A "sortal" is a term that supplies a principle for counting and identifying objects (e.g., "horse," "table," "watch," "lump of gold").

  Different sortals have different **persistence conditions**.
  *   **The Sortal "Gold":** The persistence conditions for a quantity of gold are loose. You can melt it, stretch it, bury it, or recast it. As long as the atoms remain Au, it is the same *quantity of gold*. Your brother is tracking the sortal "Gold." By his metric, the object survived.
  *   **The Sortal "Pocket Watch":** The persistence conditions for a watch are strict. A watch is defined by its function (telling time), its structure (gears, hands, case), and its arrangement. If you melt a watch, it ceases to be a watch. It cannot survive the loss of its form. Your mother is tracking the sortal "Watch." By her metric, the object died.

  **Who is right?** Both. They are just tracking different objects.
  There was a *watch* made of *gold*. The *gold* survived. The *watch* did not. The conflict arises because they are both using the word "it" to refer to two different metaphysical entities.
  *   Brother: "Is the gold gone?" No.
  *   Mom: "Is the watch gone?" Yes.

  ### 2. The Heirloom Factor (Social Ontology)
  However, this goes deeper than just "watch vs. gold." Your mother isn't just mourning a timekeeping device; she is mourning an **heirloom**.

  An heirloom is a specific type of social object. Its identity is not constituted by its matter or its form, but by its **provenance and narrative**.
  *   **Narrative Identity:** An heirloom functions as a physical anchor for a family story. "This is the watch Grandad carried when he landed at Normandy," or "This is what he checked when you were born."
  *   **The Break in Continuity:** When your brother melted the watch, he didn't just change its shape; he severed the narrative continuity. A locket is a different chapter. By destroying the vessel that held the history, he effectively killed the historical token, even if the material persists.

  In **Social Ontology**, objects like heirlooms, money, and borders exist only because we agree they exist. If the relevant community (the family) agrees the heirloom is destroyed, then *it is destroyed*, regardless of the gold's location. Your brother unilaterally changed the social contract of the object without the consensus of the "governing body" (the family).

  ### 3. Why This Pattern Repeats (Cognitive Efficiency)
  You mentioned seeing this with restored instruments and rebuilt houses. This happens because human cognition uses **multiple, overlapping criteria for identity** depending on context, and we rarely specify which one we are using.

  *   **Context: Insurance/Physics.** If the watch was insured for its gold weight, the brother is right. The value is preserved.
  *   **Context: Museum/History.** If the watch was in a museum, the curator would say the brother committed vandalism. The historical artifact is gone.
  *   **Context: Sentiment/Memory.** If the watch is a totem of grief or love, the mother is right. The totem is broken.

  We run into this disagreement constantly because we switch between these frameworks unconsciously.
  *   **The Ship of Theseus:** If you replace every plank, is it the same ship? (Form/Function vs. Matter).
  *   **The Rebuilt House:** If you rebuild a burned house exactly as it was, is it the same house? (Real estate says yes; a ghost hunter might say no).
  *   **The Restored Violin:** If you replace the bridge, neck, and body, is it still Stradivarius? (Luthiers care about the original wood; musicians care about the sound).

  ### 4. Why There Is No "Settled Answer"
  You asked why it's possible that there is no settled answer even once the physical facts are in.

  The reason is that **identity is not a fundamental feature of the universe.**
  Physics describes fields, particles, and energy. It does not describe "watches," "lockets," or "heirlooms." Those are **human interfaces** overlaid on reality to help us navigate it.
  *   The universe contains atoms arranged watch-wise.
  *   Then, the universe contains atoms arranged locket-wise.

  Whether "Object A" is the "same" as "Object B" is a question about *language and human valuation*, not about the atoms. Since values and linguistic categories vary between people (and even within the same person depending on mood), there can be no single objective truth.

  ### The Verdict for Your Article
  If you need a takeaway for your family (or your writing):

  Your brother is treating the object as **Inventory** (value = material).
  Your mother is treating the object as **Relic** (value = history/form).

  Neither is scientifically wrong, but in the context of a family, the **Relic** framework usually holds more social weight. By prioritizing the material over the narrative, your brother optimized for gold weight but depreciated the social capital. He traded a high-value heuristic (Grandad's Watch) for a lower-value heuristic (Daughter's Locket), even if the raw material was identical.

  The disagreement persists because they are arguing about *what kind of thing* the watch was, not *where the atoms went*. And since "what kind of thing" is a human invention, not a physical law, they will never agree unless they agree on the value system first.
