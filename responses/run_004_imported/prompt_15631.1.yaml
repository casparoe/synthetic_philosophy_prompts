      *   *The "Submersion" Concession:* He acknowledges a theoretical right of a community not to be "submerged" (losing its identity/character entirely).
      *   *The Caveat:* This right is of "extremely limited application." He argued Britain in 2001 was nowhere near this threshold.
      *   *Rhetorical Stance:* He vehemently rejects dehumanizing language (like "swamped") because it frames migrants as a natural disaster or pestilence rather than human beings with rights.

