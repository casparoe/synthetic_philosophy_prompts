          *   *Verdict:* He would condemn the language unequivocally.

      *   **Part 2: Factual/Political Analysis (The "Submersion" Claim):**
          *   Dummett's concession: A nation *can* claim a right not to be submerged *if* submersion is actually happening.
          *   Dummett's factual bar: Extremely high. He argued Britain wasn't close in 2001. In 2015, despite the "crisis" framing, the demographic shift was not existential.
          *   *Verdict:* He would argue the factual precondition for the "right not to be submerged" was not met. Therefore, the rhetoric is not just offensive, but *factually* unjustified.

  5.  **Address the Vulnerability/Critique:**
      *   *The Critic's Worry:* By conceding *any* right to exclude based on identity/numbers, doesn't Dummett hand a weapon to restrictionists? Can't they just argue "We *are* being submerged" and use Dummett's own logic?
      *   *Dummett's Defense:* The concession is a theoretical limit-case, not a policy tool. It's like saying "Self-defense is permissible" but insisting that doesn't justify shooting someone for looking at you wrong. The burden of proof is on the state to show existential threat.
      *   *Application to 2015:* The gap between the rhetoric ("swarm/submersion") and reality (statistical minority) is so vast that Dummett's framework actually *protects* against appropriation, provided one adheres to his rigorous factual standards. The problem isn't the framework; it's the bad faith of the politicians.

