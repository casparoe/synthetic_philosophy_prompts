      *   *Factual Rebuttal:* Dummett's "submersion" clause requires an existential threat to the host culture's continuity. 2015 numbers do not meet this. Thus, the concession doesn't apply.
      *   *The Vulnerability Question:* Does the concession invite appropriation?
