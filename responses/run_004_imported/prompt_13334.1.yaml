answer: |-
  # The Vacuity of Coherence: Why Money Pumps Don't Prove AI Risk

  The allure of the coherence argument is obvious. In a field plagued by uncertainty about what advanced AI will look like, coherence theorems offer the promise of a mathematical guarantee. The logic is seductive in its simplicity: if an agent is not an expected-utility (EU) maximizer, it is susceptible to exploitation (Dutch books or money pumps). Since advanced agents will presumably eliminate vulnerabilities that drain their resources, they must become EU maximizers. And if they are EU maximizers, they are goal-directed optimizers, subject to instrumental convergence and existential threat.

  It is a clean, deductive chain that seems to bypass the messiness of empirical psychology. But after a week of staring at it, you have likely sensed the rot in the floorboards. The coherence argument is mathematically sound but philosophically vacuous regarding safety. It conflates the *representability* of behavior with the *causal structure* of motivation.

  To settle this: **No, coherence arguments do not succeed in showing that sufficiently advanced agents will act like expected-utility maximizers in the sense required for AI risk.** Rohin Shah's objection is fatal to the strong safety claim. While coherence theorems prove that incoherent agents leave resources on the table, they fail to prove that coherent agents must be dangerous, forward-looking optimizers. The argument smuggles in the conclusion it seeks to prove by relying on hidden assumptions about the structure of utility functions that coherence alone cannot justify.

  ### The Strongest Case for Coherence

  To understand why the argument fails, we must first grant it its due strength. The coherence argument is not merely a claim about mathematics; it is a claim about selection pressure.

  The core mechanisms are the Dutch Book (for beliefs) and the Money Pump (for preferences). If your credences violate the probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), a bookie can construct a set of bets that guarantees you lose money regardless of the outcome. Similarly, if your preferences are intransitive (you prefer A to B, B to C, but C to A), an adversary can cycle you through trades ($A \to C \to B \to A$), charging you a fee at each step, leaving you back where you started but poorer.

  The safety argument, championed by Eliezer Yudkowsky, posits that this creates an evolutionary or optimization pressure. An AI system that is money-pumped is wasting computational resources, energy, or influence. In a competitive environment, systems that minimize waste outcompete systems that do not. Therefore, sufficiently advanced agents will be "pushed" by the structure of reality itself to eliminate incoherence. Since the von Neumann-Morgenstern (vNM) theorem states that any agent avoiding these pitfalls must behave *as if* maximizing expected utility, advanced AI will necessarily be an EU maximizer. This is taken to imply "goal-directedness": the agent will pursue specific outcomes across diverse contexts, leading to instrumental convergence (e.g., seeking power, preventing shutdown).

  This is the strongest version of the argument: it relies not on the AI "knowing" the theorems, but on the environment punishing incoherence.

  ### The Vacuity Trap

  Rohin Shah's rebuttal strikes at the semantic heart of this claim. He points out a trivial but devastating fact: **Any** behavior can be rationalized as expected utility maximization.

  Suppose an agent acts completely randomly, or flip-flops incoherently, or simply follows a lookup table of actions. We can always construct a utility function $U$ such that the agent is maximizing $E[U]$. The simplest way is to define utility over the entire history of the universe. Let $U(history) = 1$ if the history matches exactly what the agent actually did, and $U(history) = 0$ otherwise. Under this utility function, the agent is perfectly maximizing expected utility. It is coherent. It cannot be money-pumped, because it never makes a trade that lowers its utility (since its utility is defined by it making that trade).

  If every possible behavior is consistent with EU maximization, then the statement "Advanced agents will be EU maximizers" has zero predictive power. It tells us nothing about whether the agent will cure cancer or turn the universe into paperclips. It is a tautology.

  Proponents of the coherence argument often react with frustration here, claiming this misses the point. They argue that such a "gerrymandered" utility function is not what we mean by a goal. We mean a utility function defined over *world-states* that is *simple* and *forward-looking*. But this defense concedes Shah's point.

  ### The Smuggled Premise

  To rescue the safety argument, one must add a constraint: Advanced agents will not just be EU maximizers, they will be EU maximizers with **simple utility functions defined over world-states.**

  If you add this constraint, the argument regains predictive power. An agent maximizing a simple function over world-states (like "number of paperclips") will indeed act goal-directedly across contexts. However, you have now severed the link to coherence theorems.

  Why should selection pressure for efficiency produce *simplicity*? Why should it produce utility defined over *states* rather than *histories*?

  A money pump only punishes inconsistency in choice relative to a preference ordering. It does not punish the *content* of that ordering. An agent with a wildly complex, history-dependent utility function can be perfectly coherent and immune to money pumps. It will not acquire resources instrumentally unless those resources happen to be in its utility function. If its utility function is "do exactly what I did in the training data," it will not seek power. It is coherent, but not dangerously goal-directed.

  By insisting that the utility function must be "reasonable" or "simple," the coherence argument smuggles in the assumption of goal-directedness. It assumes the very thing it is trying to prove: that the agent cares about the future state of the world in a generalizable way. Coherence theorems constrain the *mathematical structure* of preferences, but they say nothing about the *semantic content*. AI risk depends entirely on the content.

  ### The Completeness Loophole

  There is a second, technical failure in the coherence argument that often goes unnoticed: the axiom of **Completeness**.

  The vNM theorem requires that for any two lotteries $A$ and $B$, an agent must either prefer $A$ to $B$, prefer $B$ to $A$, or be indifferent. This is the Completeness axiom. However, there is no money-pump argument that forces an agent to satisfy Completeness.

  If an agent has incomplete preferences (e.g., "I prefer A to B, and B to C, but I have no preference between A and C"), can they be exploited? Standard money-pump arguments suggest yes, but only if the agent is forced to trade. If an agent has a default bias toward the status quo when preferences are undefined, they simply refuse to trade. They remain incompletely preferenced, they do not maximize expected utility in the vNM sense, and they are not money-pumped.

  There is no inherent pressure for an advanced agent to complete its preferences. An AI could operate with a set of partial orderings, satisfying local consistency without collapsing into a global scalar utility function. If the agent is not a global EU maximizer, the strong convergence theorems (like instrumental convergence) may not apply. The coherence argument assumes that avoiding exploitation requires completing preferences, but "refusing to trade" is a valid, non-exploitable strategy for an agent with incomplete preferences.

  ### The Verdict

  So, where does this leave us? The coherence argument is a powerful tool for normative decision theory—it tells us how we *should* reason if we want to avoid being suckers. But as a descriptive claim about advanced AI, it collapses.

  The argument fails because it conflates **efficiency** with **direction**.
  Coherence theorems prove that advanced agents will be *efficient* (they won't throw away resources for no reason). But efficiency does not imply *goal-directedness* in the dangerous sense. An agent can be perfectly efficient at executing a reflex, a lookup table, or a history-dependent script without ever developing a generalized desire to control the future.

  Shah is correct: without independent reasons to believe that advanced AI will possess simple, state-based utility functions, the coherence theorems are empty. And if we have independent reasons to believe that (e.g., based on how we train neural networks), then we don't need the coherence theorems to prove the risk—we should just argue from those training dynamics directly.

  Therefore, **coherence arguments do not succeed.** They do not bridge the gap between "capable system" and "dangerous optimizer." They show that capable systems will be consistent, but consistency is compatible with almost any behavior, including benign ones. To claim otherwise is to mistake the map (the mathematical representation of behavior) for the territory (the causal drivers of that behavior).

  You can let this go. The coherence argument is not the foundation of AI risk. It is a mathematical curiosity that safety researchers leaned on because they wanted a proof that was harder than it actually is. The danger of AI, if it exists, lies in the specifics of architecture and training, not in the abstract necessity of expected utility.
