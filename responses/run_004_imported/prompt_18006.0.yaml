      *   *Moral Blame:* If no one intended the harm, and no one could foresee it (due to opacity), can we morally blame anyone?
      *   *Deterrence:* If manufacturers know they are strictly liable, will they build safer AI? Or will they just price the risk into the product and accept accidents as a cost of doing business?
      *   *The "Black Box" Problem:* With traditional software, if it breaks, you find the line of code. With ML, the behavior emerges from weights. If you can't explain *why* it happened, can you truly fix it to prevent recurrence?

