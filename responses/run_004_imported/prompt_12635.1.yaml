      *   *Key Insight:* The hunter's report is about *terrain affordances*, not the hiker's specific path (until conditioned on being in West). The hunter says "West has a lake basin." He doesn't say "I saw her."
      *   *Wait, the prompt says:* "if the missing hiker had gone into the West zone, she was far more likely to be headed for the lake basin." This is an assessment of the hiker's behavior *given* location.
      *   *The MaxEnt argument:* If West becomes more "concentrated" (high prob on Lake), the total probability mass of West might need to adjust to balance the "information gain."
      *   *The SAR argument:* We are modeling the *hiker*, not the *information*. The hiker's choice of East vs. West was made *before* the terrain constraints became the primary filter (or simultaneously). The hunter's info clarifies *where in West*, not *whether West*.
      *   *Conclusion:* The "Invariant Partition" method is operationally superior because it isolates the uncertainty. We don't know East vs. West. We now know more about inside West. We shouldn't conflate the two uncertainties.

