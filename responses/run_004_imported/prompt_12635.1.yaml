          *   Counter-argument: In SAR, the source is a human expert reporting local knowledge. "No opinion on East vs. West" is data. MaxEnt treats it as ignorance to be solved by entropy minimization. We should treat it as testimony.
          *   Risk Assessment: MaxEnt shifts probability based on "surprise." In SAR, we need probability based on "location." Shifting mass based on entropy risks moving resources away from the 50/50 split without physical evidence.
