answer: |-
  **MEMORANDUM**

  **TO:** Search and Rescue Protocols Subcommittee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol Update: Handling Conditional Probability Tips (The "Judy Benjamin" Case)

  **1. DECISION**

  Effective immediately for the spring training cycle, this unit will adopt the **Partition Invariance** procedure for handling conditional tips. When a credible source provides information constraining the subject's location *within* a specific zone (e.g., "If in West, then likely at the Lake") but explicitly offers no evidence regarding the probability *between* major zones (East vs. West), the probability mass assigned to the major zone (P(West)) will remain unchanged. Probability updates will be confined and normalized strictly within the affected zone.

  We will not use the software's default Maximum Entropy (MaxEnt) update for this specific class of information, as it introduces theoretical shifts unsupported by field evidence.

  **2. OPERATIONAL PROCEDURE**

  For Incident Commanders and Map Leads processing radio tips during an active search:

  1.  **Identify the Partition:** Confirm the tip applies to a sub-region (e.g., Lake Basin) within an established major zone (e.g., West Zone) and that the source has no data on competing major zones (e.g., East Zone).
  2.  **Freeze Major Priors:** Lock the probability value of the major zone (P(West)) at its current value. Do not allow it to shift relative to P(East).
  3.  **Update Sub-Zones:** Apply the conditional probability to the sub-regions within the major zone (e.g., increase P(Lake | West), decrease P(Trail | West)).
  4.  **Local Renormalization:** Renormalize probabilities *only* within the affected major zone so that the sub-regions sum to the frozen major zone total.
  5.  **Documentation:** Log the tip as "Conditional/Local" in the incident report to justify why global probabilities remained static despite new data.

  **3. RATIONALE**

  This decision resolves a known epistemological conflict often referred to in decision theory as the **Judy Benjamin problem**. Both sides of our subcommittee debate are mathematically literate and arguing in good faith. However, operational SAR requires us to choose the model that best reflects physical reality and human testimony, not just abstract information theory.

  **The Case for Partition Invariance (Adopted)**
  Our priors for East vs. West are based on the subject's last known position, terrain difficulty, and travel time. The hunter's tip provides terrain affordance data ("West has a lake basin she would favor") but does not provide *locational* data regarding the East/West split. The hunter explicitly stated he had "no opinion" on East versus West. In Bayesian terms, this testimony is conditionally independent of the East/West variable. To change P(West) based on this tip would be to treat the hunter's silence on East as evidence against West, which it is not. We must honor the explicit testimony of the source over the implicit assumptions of the algorithm.

  **The Case for Maximum Entropy (Rejected for Field Use)**
  The subcommittee members advocating for the MaxEnt update are correct that, in strict information theory, learning a conditional constraint (If West, then Lake) reduces the "uncertainty volume" of the West hypothesis. The MaxEnt principle suggests that because West has become more "predictable," probability mass should shift to the less constrained zone (East) to maximize entropy.

  However, this shift relies on the assumption that the missing person distributes themselves according to information entropy, or that the *reporting mechanism* is sensitive to the "surprise" of the location. Neither is true. A lost hiker does not avoid zones because they are "predictable" to a search team, and a hunter on a ridge does not radio tips based on the entropy of the search space. Applying the MaxEnt shift would move scarce resources based on a mathematical artifact rather than ground truth. In a high-stakes environment, we prioritize the stability of the East/West split when evidence regarding that split is absent.

  **4. IMPLEMENTATION**

  This protocol will be integrated into the Map Lead briefing for the upcoming spring training weekend. Software defaults will be overridden manually in these instances until a patch can be requested from the vendor to allow "local-only" normalization.

  We will review this policy after the fall season to assess if any missed opportunities or resource misallocations can be traced to this decision. Until then, when in doubt: **Update the inside, leave the boundary.**
