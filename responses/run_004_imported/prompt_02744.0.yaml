      *   The user is maximizing *arithmetic mean* returns (average profit per drop).
      *   The mod is advocating for maximizing *geometric mean* returns (long-term growth rate of the bankroll).
      *   The phenomenon the mod is warning about is **Gambler's Ruin** (specifically, the risk of ruin approaching 100% as the number of bets increases if you bet too large a fraction of your bankroll, even on +EV bets).

  3.  **Evaluate the User's Strategy (All-in/Max Bet):**
      *   *Pros:* Maximizes short-term expected dollar value *if* you never go bust.
      *   *Cons:* High volatility. One bad streak (e.g., a pair doesn't sell, gets seized, market crashes, authenticity issues) can wipe out the entire bankroll. Once the bankroll is zero, you can't play anymore.
