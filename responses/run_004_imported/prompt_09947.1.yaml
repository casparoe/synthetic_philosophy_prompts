answer: |-
  Ada: Lewis's argument is arithmetic. If a friend pays your unpaid bill, the debt is gone. Why can't Christ's suffering discharge our moral debt similarly?

  Ben: Because punishment isn't an invoice. It's retributive. It tracks the wrongdoer's desert.

  Ada: That distinction collapses in court. Consider a criminal fine. If I pay yours, the state stops pursuing you. The suffering is transferred. Even if criminal punishment isn't just civil liability by another name, the mechanism of discharge is identical. The state accepts the payment; the obligation ends. Why should divine justice differ?

  Ben: The state accepts the *money*, not the guilt. You still get the points on your license. The record remains yours. Consider vicarious liability: when an employer pays for an employee's tort, the employee isn't exonerated of fault. The cost shifts, but the blame sticks. You're confusing discharging a debt with absolving a person.

  Ada: But if the obligation is met, what difference does the source make? Lewis presses: if we allow transferable obligation in torts, why draw a hard line at penal justice?

  Ben: Because torts compensate victims; punishment condemns offenders. Imagine a murder trial where the judge executes the defendant's twin to satisfy the victim's family. The ledger balances, but justice screams.

  Ada: Only if you assume justice is purely retributive. If the debt is cleared, why does the twin matter?

  Ben: Because the twin didn't break the law. You're treating sin like a tax fee. But if sin is a relational rupture, only the rupturer can mend it.

  Ada: Unless someone else mends it on their behalf.

  Ben: Then it's not punishment anymore. It's sacrifice. And sacrifice doesn't satisfy justice; it bypasses it.
