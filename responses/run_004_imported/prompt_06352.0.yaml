prompt: |-
  I'm working on a feature about the intellectual ancestry of market-based governance, and I want to examine how Nicolas de Condorcet's own arguments would hold up against futarchy — Robin Hanson's proposal that societies should "vote on values but bet on beliefs." Under futarchy, citizens would democratically choose a measurable welfare metric (GDP or some broader index), then let speculative markets, via conditional bets on rival policies, decide which policy is expected to maximize it, on the premise that market prices aggregate dispersed information more reliably than deliberation or majority voting ever could. Condorcet is the obvious precedent to test this against: his 1785 jury theorem and his broader program of "social mathematics" tried to demonstrate, with actual probability calculus, when and why collective judgment outperforms any individual's, and he risked — and ultimately lost — his life drafting a constitution built on that same rationalist confidence. Working strictly from his own writings and commitments rather than generic Enlightenment-rationalist impressions, tell me whether he would have recognized futarchy as the fulfillment of his project or rejected it, and why. Please surface the point where his own principles pull against each other: his insistence on political equality and his wariness of concentrated factional power sit uneasily beside a system in which influence over policy scales with capital at risk, even as his faith in mathematized collective judgment could just as easily make him the mechanism's most natural champion. Give me his single most plausible verdict, not a survey of possibilities.
reasoning: |-
  Here's a thinking process that leads to the suggested verdict:

  1.  **Analyze the Request:**
      *   **Topic:** Intellectual ancestry of market-based governance, specifically comparing Nicolas de Condorcet's arguments to Robin Hanson's Futarchy ("Vote on Values, Bet on Beliefs").
      *   **Task:** Determine Condorcet's *single most plausible verdict* (acceptance or rejection) based *strictly* on his own writings and commitments.
      *   **Key Tension to Surface:** The conflict between his faith in mathematized collective judgment (pro-futarchy) vs. his insistence on political equality/wariness of factional power (anti-futarchy).
      *   **Constraint:** No survey of possibilities; one definitive verdict.

  2.  **Deconstruct Condorcet's Core Principles (based on primary texts like *Essay on the Application of Analysis to the Probability of Majority Decisions*, *Sketch for a Historical Picture of the Progress of the Human Mind*, and his constitutional drafts):**
      *   *Epistemic Democracy:* The Jury Theorem. If voters are competent (>50% chance of being right) and independent, majority rule converges on truth.
      *   *Universal Suffrage/Equality:* He was a radical for his time. Advocated for women's suffrage, abolition of slavery, and universal public instruction. Political rights are natural rights, not property rights.
      *   *Public Reason/Instruction:* Democracy works *only* if citizens are educated. Ignorance leads to error. The state has a duty to enlighten.
      *   *Anti-Oligarchy:* He distrusted concentrated wealth and aristocratic privilege. He saw economic inequality as a threat to political liberty.
      *   *Mathematization of Social Science:* He believed social phenomena could be modeled probabilistically to optimize outcomes.

  3.  **Deconstruct Futarchy (Hanson's Proposal):**
      *   *Mechanism:* Vote on a welfare metric (utility function). Markets bet on policies that maximize that metric.
      *   *Epistemic Claim:* Markets aggregate information better than voters or legislators (Efficient Market Hypothesis applied to policy).
      *   *Influence Mechanism:* Influence is proportional to capital wagered (wealth).
      *   *Separation:* Values (democratic) vs. Beliefs/Means (market).

  4.  **Evaluate the Fit (Condorcet vs. Futarchy):**

      *   *Point of Convergence (The "Champion" argument):*
          *   Condorcet loved probability and math. He wanted to remove passion and error from decision-making.
          *   Futarchy claims to use math/markets to find the "truth" about policy efficacy.
          *   Condorcet's Jury Theorem assumes independence. Markets *require* independence (no collusion) to function efficiently.
          *   Both seek to optimize social welfare through rational mechanisms rather than raw power struggles.

      *   *Point of Divergence (The "Rejection" argument):*
          *   **Political Equality:** Condorcet insisted on *one person, one vote*. Futarchy effectively creates *one dollar, one vote* on beliefs (which determine policy). For Condorcet, political right is inherent to humanity, not contingent on property.
          *   **Education vs. Wealth:** Condorcet's condition for the Jury Theorem is *competence* (probability > 0.5), achieved through public instruction. Futarchy's condition for market efficiency is *incentive* (skin in the game), achieved through capital. Condorcet would argue that wealth does not equal competence/truth-tracking.
          *   **Factionalism:** Condorcet feared "corporate spirits" (special interests) dominating the general will. Futarchy invites speculators and wealthy elites to dominate the prediction markets, potentially manipulating prices to steer policy toward their own holdings rather than the public welfare metric.
          *   **The "Values" Separation:** Condorcet believed reason could determine both ends and means. Separating values (voting) from beliefs (betting) might seem artificial to him. If the market chooses a policy that technically maximizes GDP but violates rights, Condorcet's natural rights framework would object. But the bigger issue is *who* decides the beliefs.

  5.  **Resolve the Tension (The Verdict):**
      *   *The Crux:* Would Condorcet sacrifice political equality for epistemic efficiency?
      *   *Evidence:* In his *Sketch*, he links the progress of humanity to the destruction of inequality between nations, equality of sexes, and equality of citizens. He viewed economic inequality as a major obstacle to true liberty.
      *   *The Jury Theorem Condition:* The theorem *fails* if voters are systematically biased or incompetent. Condorcet's solution was *education*, not *wealth*. Futarchy substitutes wealth for competence.
      *   *The Manipulation Risk:* Condorcet was acutely aware of how influence could be bought (the Old Regime). A system where policy is determined by those with the most money to bet would look to him like a return to aristocracy/plutocracy, disguised as mathematics.
      *   *Synthesis:* While he would admire the *attempt* to apply probability to governance, the *mechanism* of futarchy violates his foundational axiom: political sovereignty must be equally distributed to ensure the "general will" isn't captured by particular interests (wealth). The market mechanism introduces a systematic bias (wealth) that corrupts the independence required for his probability calculus to hold.

  6.  **Drafting the Argument:**
      *   *Introduction:* Acknowledge the superficial allure (math, rationality).
      *   *The Core Conflict:* Epistemic optimism vs. Political Equality.
      *   *The Deciding Factor:* The source of "competence." For Condorcet, it's education (universal); for Futarchy, it's capital (concentrated).
      *   *The Verdict:* Rejection.
      *   *Why:* Because futarchy conflates economic power with epistemic authority, violating the condition of independence and equality necessary for his social mathematics to yield legitimate, not just efficient, outcomes. It creates a "plutocratic epistemology."

  7.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Check:* Did I lean too hard on generic Enlightenment values?
      *   *Correction:* Focus on the *Jury Theorem conditions*. The theorem requires $p > 0.5$ and independence. Condorcet knew that without education, $p < 0.5$ (tyranny). He would argue that wealth does not guarantee $p > 0.5$ regarding public welfare, whereas universal suffrage + education does.
      *   *Check:* Did I address the "Vote on Values" part?
      *   *Correction:* Yes, acknowledge he might like the metric setting, but the *betting* is the dealbreaker.
      *   *Check:* Is the verdict single and plausible?
      *   *Decision:* Yes, Rejection is more plausible because Condorcet died fighting for a republic based on rights, not a market. His math served his ethics, not the other way around.

  8.  **Final Polish:** Ensure the tone is analytical and authoritative, surfacing the tension as requested. (Focus on the specific tension: Mathematized judgment vs. Equality of influence).

      *   *Key Insight:* Condorcet's math is a tool for *emancipation*, not just *optimization*. Futarchy optimizes efficiency at the cost of emancipation (by weighting influence by wealth).

  9.  **Final Verdict Formulation:** Condorcet would reject Futarchy. He would view it as a sophisticated mechanism for aristocratic capture, violating the independence condition of his own Jury Theorem by tethering epistemic weight to property.

      *(Self-Correction)*: Wait, I need to make sure I don't just say "he hated wealth." I need to tie it to the *probability calculus*.
      *Argument:* The Jury Theorem works because errors cancel out *if* voters are independent. If influence is weighted by wealth, and wealth is correlated with specific interests (faction), independence is compromised. The "signal" becomes biased. Therefore, mathematically, it fails his own criteria for truth-tracking.

      *Refined Verdict:* He would reject it because it violates the *independence condition* of his probability calculus by institutionalizing factional influence through capital.

  10. **Final Review against constraints:**
      *   Strictly from writings/commitments? Yes (Jury Theorem, *Sketch*, Constitutional drafts).
      *   Surface the tension? Yes (Math vs. Equality).
      *   Single verdict? Yes (Rejection).

      *(Drafting the response)*...
      *   Start with the allure (Social Mathematics).
      *   Move to the dealbreaker (Equality/Independence).
      *   Conclude with the verdict.

      *Wait, one more nuance:* Condorcet *did* believe in weighting votes by education in some early drafts? No, he moved toward universal suffrage. He proposed a "plural vote" for the educated in some contexts? Actually, in the *Essay on the Application of Analysis*, he discusses weighted votes but ultimately in his political practice (1793 Constitution), he advocated for universal male suffrage (and women's rights). The core principle is that rights are equal. Weighting by wealth is definitely out. Weighting by education was a theoretical consideration but his political stance hardened on equality. I should focus on the *independence* aspect of the Jury Theorem as the mathematical killer. If wealth dictates influence, independence is lost to shared class interest.

      *Okay, ready to write.*
answer: |-
  Condorcet would reject futarchy.

  While he would be seduced by the proposal's surface architecture—the application of probability calculus and speculative mechanisms to optimize social welfare—he would ultimately condemn it as a violation of the fundamental axioms required for his "social mathematics" to function legitimately. The verdict rests on a specific conflict within his own system: the tension between his faith in **mathematized aggregation** and his insistence on **political independence**.

  Condorcet would recognize futarchy as a sophisticated attempt to solve the problem of error in governance. Like him, Robin Hanson seeks to bypass the passions and ignorance of direct deliberation by using a mechanism (markets) to aggregate dispersed information. Condorcet's *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785) argues that if voters are competent (more likely to be right than wrong) and independent, the majority decision converges on the truth. He would admire futarchy's attempt to institutionalize this convergence through price signals, acknowledging that markets can, in theory, process information faster than a legislature. He might even endorse the "vote on values" component, as it aligns with his view that the general will must determine the ends of society (the welfare metric).

  However, Condorcet's rejection would stem from the "bet on beliefs" mechanism, which he would identify as a mathematical and ethical fatal flaw. For Condorcet, the Jury Theorem holds only under strict conditions: voters must be independent, and their probability of correctness must not be systematically biased by particular interests. Futarchy violates the independence condition by tethering epistemic influence to capital.

  In Condorcet's *Sketch for a Historical Picture of the Progress of the Human Mind*, he identifies economic inequality and the concentration of wealth as primary sources of political corruption and "corporate spirit" (faction). He argues that true collective rationality requires the destruction of aristocratic privilege, not its financialization. In a futarchy, influence over policy is proportional to the capital one is willing to risk. Condorcet would argue this does not aggregate "truth"; it aggregates "interest." A wealthy speculator does not bet on what maximizes public welfare; they bet on what maximizes their portfolio. By giving weight to these bets, futarchy institutionalizes the very factional bias Condorcet's probability calculus was designed to cancel out. He would view this not as an improvement on voting, but as a return to the *censitary* suffrage of the Old Regime, where property rights trumped natural rights.

  Furthermore, Condorcet's solution to voter incompetence was **universal public instruction**, not **market incentives**. He believed that making citizens competent was a state duty, ensuring that every vote carried equal weight because every citizen was equipped with reason. Futarchy bypasses the citizen entirely in the realm of beliefs, substituting the educated voter with the wealthy bettor. For Condorcet, this severs the link between political liberty and rational agency. A system where the poor are sovereign over values but the rich are sovereign over facts (policy means) is, to Condorcet, a contradiction in terms. It creates a "plutocratic epistemology" that violates the natural equality of rights.

  **The Verdict:**
  Condorcet would rule that futarchy fails its own mathematical test. By weighting influence by wealth, the system introduces a systematic correlation between voter (bettor) interest and decision outcome, destroying the statistical independence required for the "wisdom of crowds" to emerge. He would conclude that while futarchy mimics the *form* of social mathematics, it violates the *conditions* of its validity. He would reject it as a mechanism that optimizes for market efficiency at the cost of political equality, ultimately producing not the general will, but the will of the highest bidder disguised as probability.
