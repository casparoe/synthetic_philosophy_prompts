      *   **Move 2 (Colin):** Proposes the Multiverse/Observation Selection Effect (OSE). Many universes $\rightarrow$ one must be life-permitting $\rightarrow$ we are here. No designer needed.
      *   **Move 3 (Miriam):** Invokes the Inverse Gambler's Fallacy (IGF). Seeing a lucky roll doesn't imply prior rolls. Multiverse makes *some* universe likely, not *this* one.
