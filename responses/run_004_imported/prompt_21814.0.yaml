answer: |-
  Your reaction is not irrational. In fact, it is deeply rooted in how human beings assign meaning, value, and identity to objects. While your friend is logically correct that the *physical* properties of the guitar haven't changed, she is overlooking the fact that an object's value and identity are not solely determined by its material composition.

  Here is a breakdown of why your feelings make sense from psychological, economic, and philosophical perspectives.

  ### 1. Psychological Essentialism
  Psychologists call your reaction **psychological essentialism**. Humans have a deep-seated intuition that objects possess an underlying "essence" that makes them what they are, beyond their physical attributes.

  Part of this is the **contagion heuristic**: the belief that people leave a trace of themselves on objects they touch or own. This is why a lock of hair from a loved one is precious, while a genetically identical strand from a stranger is not. It is why people will pay millions for Einstein's violin but wouldn't pay nearly as much for a perfect modern replica that sounds exactly the same.

  When you believed the guitar belonged to the musician, you felt a sense of "contagion"—a physical connection to that artist and their history. Now that you know it is a replica, that perceived essence has evaporated. Your disappointment isn't about the wood or the strings; it's about the severed connection to the history you thought you owned.

  ### 2. The Economics of Provenance
  Your friend argues that the value shouldn't change because the object hasn't changed. However, the art and collectibles market proves her wrong on a practical level.

  In collecting, **provenance** (the history of ownership) is often the primary driver of value.
  *   **Example:** If you have a chair sat in by George Washington, it is a historical artifact worth a fortune. If you have a chair made of the same wood, by the same carpenter, built the next day, it is merely an antique chair worth a fraction of the price.
  *   **Example:** A movie prop used in a film is worth significantly more than a high-quality replica made for a museum gift shop, even if they are visually identical.

  The market explicitly acknowledges that history is a component of value. If you tried to sell the guitar today as a "replica" rather than "the musician's guitar," its monetary value would likely plummet. Your intuition aligns with economic reality: the story *is* part of the asset.

  ### 3. Philosophical Authenticity
  The philosopher Walter Benjamin wrote famously about the **"aura"** of an original work of art. He argued that mechanical reproduction (or in this case, skilled replication) strips the object of its presence in time and space—its unique existence at the place where it happens to be.

  *   **Functional Authenticity:** Does it work as intended? (Yes, it plays great.)
  *   **Historical Authenticity:** Is it the specific object that witnessed the events attributed to it? (No, it is not.)

  You purchased the guitar based on its historical authenticity. You were sold a narrative. When the narrative was revealed to be false, the object's identity shifted from a *relic* to a *tribute*. While a tribute has value, it is a different category of object entirely.

  ### 4. The Betrayal of Narrative
  Finally, there is an emotional component regarding trust. When you bought the guitar, you weren't just buying an instrument; you were buying a relationship with the past. You likely imagined the musician holding it, playing it, and the journey it took to get to you.

  Discovering this was a fabrication creates a sense of loss similar to grief. You are mourning the loss of the story. Furthermore, there is likely a feeling of violation; the seller's deception transformed the object from a treasure into evidence of a lie. Every time you look at it, you aren't just seeing a guitar; you are seeing the reminder that you were misled.

  ### Conclusion
  Your friend is viewing the guitar through a **materialist lens** (atoms and wood), while you are viewing it through a **humanist lens** (meaning and history). Both lenses are valid, but when it comes to art, music, and collectibles, the humanist lens is the one that dictates value and emotional resonance.

  You are not being irrational. The guitar *has* changed, because an object's identity is a combination of its physical form and its history. You have lost the history, so you have lost a fundamental part of the object.

  **A suggestion:** While the "magic" of provenance is gone, the luthier clearly put immense skill into making this instrument sing. It may take time, but try to separate the instrument from the lie. It is no longer a relic of the dead musician, but it remains a testament to the living luthier who crafted it, and a tool for you to make your own music. Its value as a *tool* remains, even if its value as a *totem* has faded.
