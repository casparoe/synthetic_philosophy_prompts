  **MARA:** One-third chance of exiting. A mixed strategy. It feels like telling a gambler to lose on purpose just to keep the odds honest.

  **ELIAS:** It's not losing. It's maximizing. Look at the payoff structure. Exit one is a dead end—payoff zero. Exit two is home—payoff four. Miss both, you end up at the motel—payoff one. If she always continues, she gets the motel. One point. If she always exits, she gets the dead end. Zero points.

  **MARA:** I know the arithmetic, Elias.

  **ELIAS:** Then you know the peak. Expected value $V$ is four times the probability of reaching the second exit times the probability of taking it, plus the probability of missing both. $V(p) = 4p(1-p) + (1-p)^2$. Simplify it: $-3p^2 + 2p + 1$. The derivative is $-6p + 2$. Set to zero. $p$ is one-third. Expected return is four-thirds. That is the highest possible yield from the start of the drive.

  **MARA:** From the *start*. That's the loophole. We aren't at the start. We're here.

  *(The car hums. A green highway sign blurs past the window, indistinguishable from the one that will follow it.)*

  **MARA:** She's at an intersection. Right now. She has amnesia. She doesn't know if this is the first exit or the second. To her, this is the only intersection that exists.

  **ELIAS:** Irrelevant. Her ignorance was a parameter in the equation. We priced in the amnesia.

  **MARA:** You priced in the *risk* of amnesia. You didn't price in the *experience* of it. From the start, the probability of reaching the second exit is $(1-p)$. But from *here*, from the driver's seat, the probability that she is *at* the second exit is conditional on having arrived.

  **ELIAS:** It's the same probability.

  **MARA:** It's not. It's Bayes' rule. If she adopts the plan $p=1/3$, what is her credence that this is the first exit?

  **ELIAS:** *(Sighs)* You want to do the update.

