  **ELIAS:** I see where you're going.

  **MARA:** If she is at the second exit—forty percent likely—and continues, she overshoots. Payoff one. So the value of continuing is: three-fifths times two, plus two-fifths times one. Six-fifths plus two-fifths. Eight-fifths. 1.6.

  **ELIAS:** Indifference. The math holds. The plan is stable.

  **MARA:** It's numerically stable, but psychologically hollow. She's indifferent. Why would she randomize? To randomize, she needs a reason to mix. If the values are equal, any tremor in her hand breaks the tie.

  **ELIAS:** A tremor is irrational. Commitment is rational.

  **MARA:** Commitment to what? Look at the feedback loop, Elias. Suppose she feels a slight urge to continue. Just a hair. Maybe the rain is heavy, exiting feels dangerous. She lowers $p$ from $1/3$ to, say, $1/4$.

