  **MARA:** $1$ over $(5/3)$. Three-fifths.

  **ELIAS:** So?

  **MARA:** So she believes there is a sixty percent chance she is at the first exit. If she is at the first exit and she exits, she gets zero. If she is at the second exit and she exits, she gets four. Expected value of exiting right now: zero times three-fifths, plus four times two-fifths.

