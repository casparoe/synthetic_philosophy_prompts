prompt: |-
  I've been rereading Tolstoy's War and Peace for a small reading group on philosophy of history, and this time I made myself slow down and actually work through the long digression that opens the section of the novel dealing with the 1812 campaign, instead of skimming past it toward Pierre and Natasha as I did when I first read the book as a teenager. In the Maude translation this is the opening chapter of "Book Eleven"; in editions that keep Tolstoy's original four-volume structure it's Volume III, Part One, Chapter I. Tolstoy interrupts the narrative here to argue, via an analogy with the calculus, that historians are fundamentally mistaken about how events like wars and revolutions should be explained. Here is the passage:

  > Absolute continuity of motion is not comprehensible to the human mind. Laws of motion of any kind become comprehensible to man only when he examines arbitrarily selected elements of that motion; but at the same time, a large proportion of human error comes from the arbitrary division of continuous motion into discontinuous elements. There is a well-known, so-called sophism of the ancients consisting in this, that Achilles could never catch up with a tortoise he was following, in spite of the fact that he traveled ten times as fast as the tortoise. By the time Achilles has covered the distance that separated him from the tortoise, the tortoise has covered one tenth of that distance ahead of him: when Achilles has covered that tenth, the tortoise has covered another one hundredth, and so on forever. This problem seemed to the ancients insoluble. The absurd answer (that Achilles could never overtake the tortoise) resulted from this: that motion was arbitrarily divided into discontinuous elements, whereas the motion both of Achilles and of the tortoise was continuous. By adopting smaller and smaller elements of motion we only approach a solution of the problem, but never reach it. Only when we have admitted the conception of the infinitely small, and the resulting geometrical progression with a common ratio of one tenth, and have found the sum of this progression to infinity, do we reach a solution of the problem. A modern branch of mathematics having achieved the art of dealing with the infinitely small can now yield solutions in other more complex problems of motion which used to appear insoluble. This modern branch of mathematics, unknown to the ancients, when dealing with problems of motion admits the conception of the infinitely small, and so conforms to the chief condition of motion (absolute continuity) and thereby corrects the inevitable error which the human mind cannot avoid when it deals with separate elements of motion instead of examining continuous motion.
  >
  > In seeking the laws of historical movement just the same thing happens. The movement of humanity, arising as it does from innumerable arbitrary human wills, is continuous. To understand the laws of this continuous movement is the aim of history. But to arrive at these laws, resulting from the sum of all those human wills, man's mind postulates arbitrary and disconnected units. The first method of history is to take an arbitrarily selected series of continuous events and examine it apart from others, though there is and can be no beginning to any event, for one event always flows uninterruptedly from another. The second method is to consider the actions of some one man—a king or a commander—as equivalent to the sum of many individual wills; whereas the sum of individual wills is never expressed by the activity of a single historic personage. Historical science in its endeavor to draw nearer to truth continually takes smaller and smaller units for examination. But however small the units it takes, we feel that to take any unit disconnected from others, or to assume a beginning of any phenomenon, or to say that the will of many men is expressed by the actions of any one historic personage, is in itself false. It needs no critical exertion to reduce utterly to dust any deductions drawn from history. It is merely necessary to select some larger or smaller unit as the subject of observation—as criticism has every right to do, seeing that whatever unit history observes must always be arbitrarily selected. Only by taking infinitesimally small units for observation (the differential of history, that is, the individual tendencies of men) and attaining to the art of integrating them (that is, finding the sum of these infinitesimals) can we hope to arrive at the laws of history.

  I follow the local point about Zeno's paradox well enough: Achilles-and-the-tortoise looks paradoxical only because motion has been artificially chopped into discrete steps, and the calculus resolves it by summing infinitely many infinitesimal steps instead. What I can't quite pin down is how much genuine work this analogy is doing once Tolstoy carries it over to history. Is "the differential of history" meant to pick out something with real mathematical structure—some quantity that individual wills instantiate and that could, at least in principle, be summed or integrated—or is Tolstoy essentially borrowing the prestige of calculus to dress up the much more modest claim that historians overrate the causal importance of kings and generals relative to the aggregated actions of ordinary people? I'd like help reconstructing the argument's premises and conclusion as precisely as possible, and pinpointing where, if anywhere, Tolstoy slides from an unobjectionable claim about the mathematics of continuous motion to a much stronger metaphysical claim about historical necessity.

  I'd also like help thinking through what this passage commits Tolstoy to on the question of historical inevitability, since that's really what our reading group keeps getting stuck on. Later in the same chapter he sharpens the point with a set of examples about coincidence and causation—most memorably, that a clock's hands reaching ten does not cause a nearby church bell to ring, however reliably the two coincide—before concluding that historians who explain wars by reference to "kings, ministers, and generals" are making essentially the same mistake. If Tolstoy is right that the real laws of history emerge only from "integrating" over countless small, arbitrarily individuated wills, is there still principled room for counterfactual claims such as "if Napoleon had not invaded Russia, his empire might have lasted decades longer," or does taking the calculus picture seriously commit him to treating such counterfactuals as no more sensible than treating the clock's hands as the cause of the bell? I recall that Isaiah Berlin's well-known essay on Tolstoy's view of history discusses material very close to this passage, though I don't remember his argument in enough detail to know whether he thought the calculus analogy does genuine philosophical work or ultimately collapses under its own weight.
