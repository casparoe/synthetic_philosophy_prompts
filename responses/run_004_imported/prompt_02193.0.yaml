  2.  **Recall/Research Locke's "Of Identity and Diversity" (II.xxvii):**
      *   *Identity of Substance/Matter:* Same atoms = same mass.
      *   *Identity of Living Organisms ("Man"):* Locke defines a "man" as a living organized body. Identity consists in the continuation of the same life communicated through successive particles of matter. It's about biological continuity, not just the same soul or same particles.
      *   *Identity of "Person":* A "person" is a thinking intelligent being that has reason and reflection and can consider itself as itself. Identity consists in *consciousness* (specifically memory/psychological continuity). "Person" is a forensic term (concerned with accountability/reward/punishment).
      *   *Separation:* Locke explicitly allows for the possibility that the "man" and the "person" can come apart. (e.g., the Prince and the Cobbler thought experiment, though that's about soul swapping; more relevant is the idea that if consciousness stops, the person ceases, even if the body lives).
      *   *Death:* Locke often links the end of the "man" to the end of the "life" of the organism. He links the end of the "person" to the interruption of consciousness.

