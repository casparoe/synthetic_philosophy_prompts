answer: |-
  You have a really sharp eye for this. Your intuition is correct: on the surface, that passage looks like it's stitching together a moral-psychological complaint (acting is lying/inauthentic) with a socio-economic complaint (acting is selling yourself/servile).

  However, in Rousseau's specific philosophical framework, **these are not two separate arguments. They are the cause and effect of the same disease.**

  If you want to go back at your friend with something better than "Rousseau said so," you need to explain *why* Rousseau thinks the psychological "faking" inevitably leads to the social "selling," and how that connects to his concept of *amour-propre*.

  Here is the breakdown of how to unify those two halves of the quote, and how to use it to counter the Goffman point.

  ### 1. The Link: Alienation and Dependence
  For Rousseau, the core of moral corruption is **dependence on the opinion of others.**

  *   **The Psychological Half:** When an actor "grows passionate in cold blood," they are severing the link between their internal feeling and their external expression. They are alienating their own emotions.
  *   **The Economic Half:** Why do they do this? For money and applause. They are submitting their will to the audience.

  Rousseau sees these as the same movement. To "counterfeit yourself" is to make your inner state subordinate to an external demand. To "put your person up for sale" is to make your social existence subordinate to external payment.

  So, the argument isn't just "lying is bad." The argument is: **Acting is the professionalization of alienation.** It takes the human capacity for empathy and imitation and turns it into a transaction where you trade your moral autonomy (your "sincere self") for the approval of the crowd. That is why he calls it "servile." A servant obeys a master; an actor obeys the audience.

  ### 2. The *Amour-Propre* Connection
  You mentioned *amour-propre*, and that is exactly the key.

  *   ***Amour de soi*** is natural self-love (I want to survive/thrive).
  *   ***Amour-propre*** is social self-love (I want to be *valued* by others).

  Rousseau believes modern society runs on *amour-propre*. We live outside of ourselves, in the opinions of others. The actor is the **ultimate avatar of *amour-propre*.**

  An actor *only* exists when being watched. Their "talent" is the ability to completely vacate their own self and become a vessel for what others want to see. Rousseau isn't just worried that actors lie; he's worried that acting **makes a virtue out of living through others.**

  If your friend argues "we all perform in everyday life," Rousseau would agree with the premise but disagree with the conclusion. Rousseau would say: *"Yes, and that is the tragedy of civilized society. But why would you build a temple to it? Why would you pay people to be the best at being inauthentic?"*

  ### 3. Countering the Goffman Card
  Your friend is using Erving Goffman (likely *The Presentation of Self in Everyday Life*). Goffman is a sociologist; Rousseau is a moral philosopher.

  *   **Goffman is Descriptive:** He says, "Look, social interaction requires roles. We manage impressions to function."
  *   **Rousseau is Normative:** He says, "Just because we *do* this doesn't mean we *should* celebrate it."

  Here is your counter-argument to your friend:
  > "Goffman describes how society works, but Rousseau diagnoses why it makes us miserable. Yes, we all wear masks in daily life to be polite or fit in. But Rousseau's point is that acting turns that mask into a commodity. In daily life, I pretend to be polite to maintain social cohesion. In the theater, the actor pretends to be virtuous (or villainous) to get applause. One is a social lubricant; the other is a commercial transaction that rewards the loss of self."

  ### 4. The "Trade" Aspect (Why Geneva Matters)
  The second half of your quote ("puts his own person up for sale") is crucial because of the context. Rousseau was writing to stop Geneva from building a theater. He viewed Geneva as a small, virtuous Republic where citizens know each other and are accountable.

  In a Republic, you are supposed to be a **Citizen** (autonomous, public-spirited).
  In a Theater, you are a **Spectator** (passive, judging) or an **Actor** (dependent, selling).

  Rousseau argues that if you institutionalize acting, you teach the citizens that it is okay to separate your public persona from your private virtue. If the most admired people in town are the ones best at "saying what they do not think as naturally as if they really thought it," then sincerity becomes a liability and manipulation becomes a skill.

  ### The Takeaway for Your Friend
  You can tell your friend this:

  "Rousseau isn't making two arguments; he's tracing a causal chain. The psychological act of 'counterfeiting passion' requires you to surrender your autonomy. When you make that surrender a job ('a trade'), you institutionalize that loss of autonomy.

  Your Goffman point is that we all perform. Rousseau's counter is: **'Exactly, and that's why we are corrupted. But acting is the only profession that demands you perfect that corruption for cash.'**

  For Rousseau, the actor isn't just a liar; the actor is a mercenary of the soul. They sell the one thing that makes you free (your authentic will) to the highest bidder (the audience). That's why it's 'servile and base.' It's not about the lie; it's about the wage."

  ### Summary
  *   **Are they separate arguments?** No. The psychological fake is the *method*; the economic sale is the *structure*. Both result in the loss of autonomy.
  *   **Is it just about Geneva?** No, but Geneva represents the "virtuous republic" that theater would destroy by normalizing inauthenticity.
  *   **How to beat Goffman:** Goffman says performance is inevitable. Rousseau says professionalizing performance is dangerous.

  You've got the texts right. The key is to emphasize that for Rousseau, **freedom is authenticity**, and acting is the **commodification of inauthenticity**.
