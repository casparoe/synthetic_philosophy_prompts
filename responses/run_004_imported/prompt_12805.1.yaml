  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Does recent moral philosophy on "standing to blame" (specifically regarding hypocrisy) rehabilitate the *tu quoque* fallacy, which logic textbooks say is invalid?
      *   **Premise 1:** Logic textbooks define *tu quoque* as a fallacy because the truth of a claim is independent of the speaker's consistency (ad hominem variant).
      *   **Premise 2:** Moral philosophers argue that hypocrisy can disqualify someone from *blaming* others (lack of "standing"), even if the blame is factually correct.
      *   **Conclusion/Challenge:** Aren't these philosophers just validating the fallacy using fancy language?

  2.  **Deconstruct the Concepts:**
      *   **Tu Quoque (Logic):** An informal fallacy. It attacks the *argument* or the *truth of the proposition* based on the speaker's inconsistency.
          *   Example: "You say smoking is bad, but you smoke. Therefore, smoking is *not* bad." (Invalid inference).
      *   **Standing to Blame (Moral Philosophy):** A normative concept about the *appropriateness* or *authority* of a speech act (blaming), not the *truth* of the proposition contained within it.
          *   Example: "You say I shouldn't smoke (true), and I shouldn't. But because you also smoke, you lack the *standing* to reproach me." (Valid normative claim about the relationship/interaction).

  3.  **Identify the Key Distinction:**
      *   **Truth vs. Appropriateness:** Logic deals with truth conditions of propositions. Moral philosophy (in this context) deals with the felicity conditions or normative authority of speech acts.
      *   **Propositional Content vs. Illocutionary Force:** *Tu quoque* invalidates the *content* ("Smoking is bad"). Standing to blame invalidates the *act* ("I blame you for smoking").

  4.  **Formulate the Argument:**
      *   **Direct Answer:** No, they are not rehabilitating the fallacy. They are addressing a different category of evaluation.
      *   **Point 1: Truth vs. Standing.** Logic cares about whether $P$ is true. Ethics cares about whether Agent $A$ is permitted to assert $P$ against Agent $B$ in a blaming context.
      *   **Point 2: Speech Act Theory.** Blaming is an action, not just a statement of fact. Like a judge recusing themselves: the law is still the law, but *this* judge can't pronounce sentence.
      *   **Point 3: The Scope of *Tu Quoque*.** The fallacy occurs when you infer $\neg P$ from "Speaker is hypocritical." Philosophers of blame do *not* infer $\neg P$. They infer "Speaker lacks authority to blame."
      *   **Point 4: Why it matters.** Distinguishing these prevents moral nihilism (nothing is true because everyone is a hypocrite) while acknowledging social/relational norms (hypocrites shouldn't preach).

