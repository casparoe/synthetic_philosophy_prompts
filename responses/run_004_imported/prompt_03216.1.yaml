answer: |-
  **Dublin, 1736. The Coffee House of Mr. Dickson, near the Tholsel.**

  The air is thick with the scent of roasted beans and damp wool. Outside, the Dublin streets are mud and clamor; inside, men of commerce huddle over ledgers. In a corner booth, **DEAN GEORGE BERKELEY**, clerical black contrasting with the merchant greys around him, stirs a cup of coffee. Opposite him sits **MR. ARTHUR HARTE**, a linen merchant whose ledger is bound in calf and whose face is lined with the memory of losses.

  A pile of silver shillings sits near Harte's hand. A single sheet of manuscript lies before Berkeley.

  **HARTE:** You ask us to trust the air, Dean. You write these queries, one after another, suggesting we might build a bank on nothing but the promise of Irish industry. But I was in Paris in '19. I saw the air turn to ash.

  **BERKELEY:** You speak of Monsieur Law.

  **HARTE:** I speak of ruin. I speak of men who woke up princes and went to bed beggars before the sun crossed the Seine. They held paper, just as you propose. They were told the paper was wealth. Then the music stopped.

  **BERKELEY:** A tragedy, indeed. But tell me, Mr. Harte: when the bubble burst, what was it that vanished? Was it the land of France? Was it the hands of her weavers? Was it the skill of her shipwrights?

  **HARTE:** No. Those remained. But the *measure* of them was corrupted. Gold and silver are God's money, Dean. They have weight. They have scarcity. When you hold a guinea, you hold a piece of the earth that no printer can counterfeit. When you hold a bank note, you hold a promise. And promises, sir, are broken every day in this city.

  **BERKELEY:** I grant you, a promise may be broken. But **whether the gold itself feeds a man, or clothes him?** Or is it not rather that the gold is but a ticket, a counter, used to claim the food and the cloth produced by labor?

  **HARTE:** It is a ticket that holds its value across borders. I can take this shilling to London, to Amsterdam, to Constantinople. If I take your Irish bank note to Cork, they may laugh in my face. If I take it to France, it is kindling.

  **BERKELEY:** **Whether the value of the shilling in Constantinople dependeth not upon the Turk's desire for silver, rather than any divine imprint?** If the Turk desires wool, and you have wool, you trade. If he desires silver, you pay silver. But here, in our own kingdom, **whether we are not in the absurd position of starving amidst plenty, simply because we lack the counters to move the food from the barn to the mouth?**

  **HARTE:** We lack the counters because we lack the trade to earn them! You cannot will wealth into existence by printing tickets. Law thought he could. He printed millions to buy shares in a company that owned nothing but swamp land in Louisiana. He detached the money from the reality of goods. That is my fear. You propose a national bank. Who controls the ink?

  **BERKELEY:** A fair query. **Whether the fault lay in the paper, or in the use to which the paper was put?**

  **HARTE:** The fault lay in the illusion that paper *could* be capital.

  **BERKELEY:** Consider. Monsieur Law used his credit to fuel speculation. He printed money to buy stocks, to chase shadows. He did not print to pay the plowman or the builder. **Whether credit, employed to stir industry, is not of a different nature than credit employed to feed the stock-jobber?**

  **HARTE:** (Leans forward, tapping a silver coin) It is a slippery slope, Dean. Once you sever the link to specie, there is no brake. The temptation to print too much is irresistible. Governments are spendthrift children. Give them a press and they will drown us in inflation. Then the laborer's wage buys half a loaf, and you have riots, not prosperity.

  **BERKELEY:** I do not advocate for a flood of paper. I advocate for a circulation suited to the trade. **Whether a merchant who builds a ship, employing fifty men, does not create real wealth?** And **whether a bank note issued against that ship, to pay those men, is not backed by something more substantial than gold—namely, the future labor of those men and the cargo they will carry?**

  **HARTE:** It is backed by hope. Gold is backed by nature.

  **BERKELEY:** Gold is dug from the ground, locked in a vault, and does nothing. **Whether a nation is richer for having a heavy vault, or for having a busy street?** Ireland is full of idle men. They have hands. They have will. But they have no employment. The gold is in England. So we sit and wait for England to spend, and while we wait, our people rot.

  **HARTE:** And if your bank issues notes against these "busy streets," and the ships sink? Or the linen rots in the warehouse? Then the notes are worthless, and the trust is broken. With gold, the risk is in the trade, not in the money itself.

  **BERKELEY:** **Whether the risk is not always in the trade?** If I lend you gold to buy flax, and the flax rots, you cannot repay the gold. The gold is gone from your purse just as surely as if it were paper. The difference is, with gold, you hoard it for fear of the loss. With sound credit, you circulate it to prevent the loss.

  **HARTE:** (Sighs, rubbing his temple) You argue well, Dean. I'll grant you that. But you ask me to trust a system where the money is created by the very need for it. It feels like pulling oneself up by one's bootstraps. Law said the same. He said wealth was relative. He said confidence was the only engine.

  **BERKELEY:** And was he wrong? **Whether confidence is not the very engine?** But Law sought to create confidence by spectacle. I seek to create it by utility. **Whether a note that can be exchanged for the labor of a mason to build a wall is not "real," so long as the mason is willing to work and the wall stands?**

  **HARTE:** The wall stands. But what if everyone demands the gold behind the note at once?

  **BERKELEY:** **Whether everyone would demand the gold, if the credit were issued only for productive ends?** If the note circulates because it is useful, why turn it in? The merchant keeps the note to pay his weaver. The weaver keeps it to buy bread. It moves. Gold sits.

  **HARTE:** You assume a rationality in men that I have not seen in forty years of trade. Fear is rational, Dean. When the wind changes, men run for the lifeboats. They do not ask if the ship is sound; they ask if the boat floats. Paper burns. Silver sinks, but it remains.

  **BERKELEY:** I do not ask you to burn your silver. **Whether there is not room for both?** Let the gold serve the foreign trade, where nations are strangers and distrustful. But let the credit serve the domestic, where neighbors should trust one another. **Whether it is not a shame that two Irishmen cannot trade their labor because they lack a third thing, a metal dug from a mountain in Peru?**

  **HARTE:** (Pauses, looking into his coffee) It is a seductive thought. To free ourselves from the scarcity of the mines. But the memory of '20 is a cold ghost, Dean. It walks these rooms. You ask us to invite it back, promising it has changed its clothes.

  **BERKELEY:** I ask only that you look at the poverty in the streets. **Whether the fear of a bubble is sufficient justification for allowing a nation to starve in silence?** If a medicine carries risk, but the patient is dying, **whether it is not the physician's duty to prescribe it?**

  **HARTE:** (Picks up a shilling, flips it, catches it with a clink) The physician must know the dose. Law gave a gallon to a child. You speak of drops. But who holds the spoon, Dean?

  **BERKELEY:** (A small, enigmatic smile) **Whether that is not the true query?**

  **HARTE:** (Snorts, a faint grin breaking his sternness) There you go again. Answering nothing.

  **BERKELEY:** I answer everything. I tell you that wealth is power. Power to command labor. If we have the labor, we have the wealth. We need only the tickets to count it.

  **HARTE:** I will keep my silver, Dean. For now. But... (He gestures to the manuscript) I will read the rest of your queries. The distinction between the speculator's credit and the builder's credit... that bears thinking on.

  **BERKELEY:** **Whether thinking is not the first step to acting?**

  **HARTE:** Don't push your luck, sir. Coffee is on you if you keep talking.

  **BERKELEY:** **Whether that is not a fair exchange for the labor of my tongue?**

  **HARTE:** (Laughs, signaling the waiter) Touché, Dean. Touché.
