answer: |-
  This is a fantastic angle for a character. You have your historical homework mostly done: Hobbes *did* believe that geometry was the only true science, and he *did* believe that political philosophy could be deduced with the same rigor. The concept you're referencing is indeed often called "Maker's Knowledge" (or *verum factum*—"the true is the made"), though Hobbes frames it through his specific materialist metaphysics.

  Here is a breakdown of the reasoning, the irony, and a sample monologue to help you find his voice.

  ### 1. The Philosophical Core: "We Know Only What We Make"

  To write Hobbes, you need to understand his mechanistic worldview. For Hobbes, the universe is nothing but matter in motion. "Science" (*scientia*) isn't just observing things; it is knowing the **cause** that produces an effect.

  *   **Natural Philosophy (Physics):** We look at a tree or a star. We did not make it; God (or Nature) did. We can see the effect, but we cannot truly know the *cause* of its generation. Therefore, physics is conjecture. It is probable, not certain.
  *   **Geometry:** We define the point. We draw the line. We construct the circle. Because we are the generators of these figures, we know exactly what went into making them. We possess the "cause." Therefore, we can have absolute, demonstrable certainty about their properties.
  *   **Civil Philosophy (Politics):** This is the leap. A Commonwealth is not a natural organism like a tree; it is an "Artificial Man." It is created by human art (the Social Contract). Since men create the State, men can know the causes of its motion and stability.

  **The Argument in his mouth:**
  > "You stare at the heavens and pray for answers, but you cannot know what you did not build. God's world is a riddle. But a circle? A circle is a child of my own hand. And the State? The State is a machine of our own forging. If we can measure the one, we can engineer the other."

  ### 2. The Irony: The Squaring of the Circle

  This is the tragic flaw in your character's armor. Hobbes believed geometry was the realm of pure certainty, and he believed he was a master of it. However, he was mathematically out of his depth.

  *   **The Feud:** In the 1650s and 60s (Restoration period), Hobbes became obsessed with "squaring the circle" (constructing a square with the exact same area as a given circle using only a compass and straightedge).
  *   **The Opponent:** John Wallis, the Savilian Professor of Geometry at Oxford. Wallis was brilliant, younger, and part of the Royal Society crowd that Hobbes despised.
  *   **The Outcome:** Wallis repeatedly dismantled Hobbes's proofs, pointing out logical errors. Hobbes refused to admit mistakes, publishing more and more desperate treatises. It got so bad that Charles II eventually ordered Hobbes to stop publishing on mathematics because the public feuding was becoming embarrassing for the Court.
  *   **The Irony for your Novel:** Hobbes champions geometry as the *only* path to truth to validate his political theories, but his inability to actually *do* geometry undermines his intellectual authority. He claims the high ground of Certainty, while standing in a swamp of mathematical error.

  ### 3. Sample Monologue (Restoration Era)

  *Context: Hobbes is older here (1660s), white-haired, perhaps pacing in a dim room, speaking to a younger, skeptical interlocutor (perhaps your protagonist).*

  "You look at the world and see mystery. I look at it and see machinery. But listen closely, for this is where the universities fail, and where Mr. Wallis and his ilk drown in their own calculus.

  "Tell me: How can a man claim to *know* the nature of a storm? He did not brew the wind. He did not forge the clouds. He stands before God's work like a peasant before a palace, guessing at the architect's intent. That is not science. That is guessing.

  "But take a line. Take a circle. I put the point to the paper. I turn the compass. I generate the figure. Because I made the cause, I possess the effect. There is no shadow in geometry. There is only light. It is the only place where the human mind is not a beggar, but a king.

  "And do not think this stops at lines on a page. What is a Commonwealth? Is it a tree grown from the earth? No. It is an artifact. It is built. Men forge it out of their own covenants, brick by logical brick. If we can demonstrate the truth of a triangle because we drew it, then we can demonstrate the truth of Sovereignty because we created it. Justice is not a feeling, boy. It is a sum. And I have solved it.

  "Let them laugh. Let Wallis scratch his quills and count his angles until his eyes bleed. They argue over the tools while I have built the house. I have reduced the chaos of human nature to a geometric proof. Certainty is possible. I hold it in my hand. The rest of you are just... fumbling in the dark."

  ### 4. Character Notes for the "Hobbes" Figure

  To make him feel authentic to the Restoration period and his specific psychology:

  1.  **Materialism is Key:** He shouldn't talk about "souls" or "spirits." To him, thought is "reckoning" (calculation). Language is a tool for counting. If he gets angry, it's because someone is being *illogical*, which to him is a physical danger (chaos leads to civil war).
  2.  **Disdain for Oxford:** Hobbes hated the universities. He thought they were breeding grounds for rebellion and religious fanaticism. If your character mentions "Oxford" or "The Royal Society," it should be with a sneer.
  3.  **The Fear of Chaos:** His obsession with certainty isn't just intellectual vanity; it's trauma. He lived through the English Civil War. To him, if you can't prove things (in math or politics), people start fighting. Geometry = Peace. Ambiguity = War.
  4.  **The Physicality:** Hobbes was known to hum tunes to himself when he had an idea (he called it "the brain buzzing"). He was also physically cowardly (he carried a dagger and walked with a cane for protection, even when safe). You can contrast his mental bravado with physical frailty.
  5.  **The Wallis Trigger:** If you want to show his crankiness, have someone mention "infinite series" or "Oxford mathematicians." He should react like a dog hearing a whistle.

  ### 5. Why the Stretch isn't a Stretch (for him)

  You mentioned it seems like a stretch that politics could be as demonstrable as geometry. To us, yes. To Hobbes, no.

  *   **Euclidean Method:** Hobbes was fascinated by Euclid's *Elements*. He loved that you start with a few definitions and axioms, and then *derive* everything else.
  *   **The Application:** He tried to do this in *Leviathan*.
      *   *Definition:* Man is driven by appetite and aversion.
      *   *Axiom:* In a state of nature, this leads to war.
      *   *Construction:* Therefore, men contract to surrender rights to a Sovereign.
      *   *Proof:* Any other configuration leads back to war (absurdity).
  *   **Writing Tip:** When your character argues politics, have him use geometric language. "Draw the line," "The angle of obedience," "The equilibrium of power," "It follows necessarily." He shouldn't persuade; he should *demonstrate*.

  ### Summary for the Scene
  If you want to maximize the dramatic irony: Have him deliver this brilliant, soaring speech about how geometry is the only path to truth and how he has mastered it to solve politics. Then, immediately after, have him mutter about a "small correction" he needs to make to a diagram regarding the circle, revealing to the reader (who knows the history) that his "mastery" is actually his delusion.
