          *   *Verdict:* Matches (perhaps even exceeds traditional parties in intensity).

      *   *Criterion 3: Growth as a Primary Aim.*
          *   Weil: The party *itself* wants to grow. This implies intentionality/agency.
          *   Online Side: Growth happens via algorithms (engagement metrics), not necessarily a central committee's directive. Is it the "side's" aim or the platform's aim?
          *   *Verdict:* Complicated. Functional outcome is the same (unlimited growth), but the *mechanism* of intent differs.

      *   *Structural Criterion: Formal Organization.*
          *   Weil: Ban dues, membership rolls, official endorsements. Tolerate loose circles around journals.
          *   Online Side: No dues, no rolls, no formal leadership. Looks like a "loose circle."
