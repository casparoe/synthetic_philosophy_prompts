      *   *Conclusion:* She would likely be horrified to find her "tolerated" alternative (informal circles/journals) has mutated into something worse than the parties she hated. The "journal" has become the "feed," and the "debate" has become the "pile-on."

  6.  **Refine the "Revision vs. Extension" Point:**
