      *   *Argument for "Runs Out":* Weil's moral critique rests on *will*. A party *chooses* growth over truth. An algorithm *optimizes* engagement. If there is no collective will, is it "totalitarian" in the moral sense, or just a systemic hazard? Weil's remedy (banning organizations) assumes human agency can stop it by dismantling structures. Dismantling Twitter/X might not stop the "side" if the human psychology remains.

