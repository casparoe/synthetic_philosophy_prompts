  3.  **Synthesize the Argument (Drafting the Core Tension):**
      *   Weil's distinction is formal/structural (organization vs. non-organization).
      *   The online "side" is structurally informal but functionally totalitarian (by her definition).
      *   Therefore, the online "side" exposes a blind spot in Weil's taxonomy. She assumed formal structure was the *cause* of the spiritual disease. The internet shows the disease can exist without the structure.

  4.  **Address the "Growth as Goal" Question (Agency vs. Mechanism):**
      *   Weil writes: "a party's deepest, most basic aim... is simply its own unlimited growth."
      *   This implies a *subject* (the party) that *aims*.
      *   The online "side" has no central subject. The growth is driven by *algorithms* (platform capitalism) and *individual psychological impulses* amplified by tech.
