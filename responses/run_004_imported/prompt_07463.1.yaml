answer: |-
  Your gloss on the commitment race is spot-on. You have correctly identified the tension between **leverage** (gained by restricting your own future options) and **efficiency** (gained by keeping options open to find mutually beneficial trades).

  In the rationalist and AI-safety literature, this is often discussed in the context of agents who can read each other's source code or simulate each other perfectly. But as you noted, human institutions—especially democratic ones like a union—operate under very different constraints. We cannot rewrite our source code, and our "commitments" are actually just costly signals backed by reputation and social pressure.

  Here is a breakdown of the commitment race problem translated from abstract decision theory to the specific mechanics of a grad union's first contract fight.

  ### 1. The Nature of Human "Commitment" (Audience Costs)
  In the idealized models, a commitment is binary: either the agent *can* deviate or it *cannot*. In labor negotiations, commitment is a gradient based on **audience costs**.

  When your committee publicly announces, "We will not ratify anything under 15%," you are not physically preventing yourselves from ratifying a 12% deal. You are creating a social and political cost for doing so. If you later accept 12%, you lose credibility with your membership, potential leadership challenges arise, and future threats become less believable.

  **Implication:** The risk isn't that you *literally* can't deal; it's that the cost of backing down becomes higher than the cost of striking. In a commitment race, both sides inflate these audience costs until the "pain of backing down" exceeds the "pain of conflict." For a grad union, this means a public ultimatum transforms a negotiation into a test of endurance where saving face becomes more important than the actual dollar amount.

  ### 2. Information Discovery vs. Positional Bargaining
  Negotiations are often mechanisms for **information discovery**. You likely do not know the administration's true budget constraints, and they do not know your true strike tolerance (how many members will actually cross the picket line).

  *   **Schelling Strategy:** Works best when you know the "Zone of Possible Agreement" (ZOPA) exists and you are fighting over how to split the surplus.
  *   **Commitment Race Risk:** Occurs when the ZOPA is unknown.

  If you commit to 15% before sitting down, you blind yourself to information. It might turn out the university is facing a deficit that makes 15% mathematically impossible, but 12% plus better healthcare is feasible. If you have already burned the bridge to 12%, you force a strike over a gap that could have been closed with creative packaging.

  **Implication:** For a first contract, information asymmetry is usually high. Premature commitment trades away your ability to learn what is actually possible.

  ### 3. Symmetric Escalation and the "Regents" Mirror
  You mentioned the administration might feel pressure to look tough in front of the Regents. This is the core engine of the commitment race.

  In game theory terms, if you play a "Stackelberg leader" move (committing first to force them to follow), you assume they will act as a rational follower. However, if their principals (the Regents/Board) view flexibility as weakness, the Admin is incentivized to make a counter-commitment that is *even more* rigid than yours.

  *   **Union:** "We demand 15%."
  *   **Admin:** "Our budget is legally capped at 5%."

  Now, neither side can move without admitting they lied or were weak. The negotiation shifts from "How do we solve this?" to "Who blinks first?"

  **Implication:** In a first contract, the administration is often establishing its own precedent with the Board. By forcing them into a public corner early, you may inadvertently empower the hardliners within the administration who *want* a fight to prove their toughness to the Regents.

  ### 4. Internal Cohesion vs. External Flexibility
  This is a constraint specific to unions that doesn't appear in the AI models. A bargaining committee is an agent with a principal (the membership).

  *   **The Argument for Public Commitment:** It rallies the troops. It signals to the membership that the committee is tough, which increases strike readiness and internal cohesion. It solves an internal collective action problem (getting members to believe the strike is real).
  *   **The Argument Against:** It reduces the committee's agency. If the committee discovers a nuanced deal that is good but doesn't meet the public 15% threshold, they may be unable to sell it to the membership because they framed the 15% as a moral line rather than a bargaining opening.

  **Implication:** A public ultimatum solves an *internal* coordination problem but creates an *external* coordination failure. You need to ask: Is our primary bottleneck right now member apathy (needing a rallying cry) or administrative intransigence (needing flexibility)?

  ### 5. Iterated Game Dynamics
  AI safety discussions often focus on one-shot or high-stakes singular encounters. Labor relations are an **iterated game**.

  A commitment race might "win" a specific round (you get the 15% or you strike and win public sympathy), but it damages the "game board" for future rounds. If the first contract is secured through a war of public ultimatums and brinkmanship, the relationship for the second and third contracts is poisoned. Trust is a resource that lowers transaction costs in future negotiations.

  **Implication:** Burning credibility to gain leverage in Round 1 increases the cost of doing business in Round 2. In the rationalist frame, you are optimizing for a local maximum at the expense of the long-term trajectory.

  ### Strategic Alternatives (Avoiding the Race)
  If the goal is to gain leverage without triggering a pathological commitment race, game theory suggests a few middle paths that human negotiators often use:

  1.  **Private Mandates vs. Public Ultimatums:** You can tell the administration privately, "Our membership will not ratify anything below 15%." This conveys the constraint without incurring the public audience costs. It allows them to say "no" privately without a public showdown.
  2.  **Conditional Commitments:** Instead of "We will strike," use "We are authorized to strike if X conditions aren't met." This keeps the commitment contingent on their behavior, rather than a static demand.
  3.  **Constructive Ambiguity:** Frame the 15% as a "starting position based on economic data" rather than a "red line." This preserves the Schelling point (we are serious) without the irreversible hand-tying (we literally cannot move).
  4.  **Focus on BATNA, not Demands:** Strengthen your Best Alternative to a Negotiated Agreement (strike funds, legal prep, member mobilization) without necessarily announcing the specific demand threshold. Let your *capacity* to strike be the credible threat, rather than the *specific number* you demand.

  ### Summary
  The commitment race problem warns that **credibility is a resource that can be overspent.**

  In your context, the risk isn't just that you strike; it's that you strike over a gap that was illusory, caused by both sides locking themselves into positions to signal strength to their respective principals (membership vs. Regents).

  Since you cannot rewrite your source code, your "commitments" are actually just reputational bets. The question for your committee is whether the leverage gained by making that reputational bet *now* (before knowing the admin's constraints) is worth the risk of forcing a collision that a slower, more private information-gathering process might have avoided.

  In a first contract, where the primary goal is often establishing a relationship and a precedent rather than extracting maximum surplus in a one-off deal, the commitment race is generally a high-risk strategy. It trades long-term iterated value for short-term bargaining leverage.
