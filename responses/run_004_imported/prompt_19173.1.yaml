      *   *Terminology:* Suggest "structural homology" or "transposition" instead of "descendant."

  6.  **Final Polish:** Check tone. Ensure it sounds like a knowledgeable tutor/advisor. Make sure IB criteria (research question, analysis, counter-claims) are implicitly addressed. (The user mentioned "English teacher," but this is clearly a Philosophy/Politics EE. I should treat it as such).

