answer: |-
  Good evening. For those of you I haven't had the pleasure of losing money to, I'm [Your Name].

  We have a slightly unusual challenge tonight. Roughly half of this room speaks "Trader" as a first language. You know what a fractional Kelly strategy is, you worry about ergodicity in your sleep, and you know the difference between an ensemble average and a time average. The other half of the room speaks "Human." You know Marcus as a father, a husband, a friend, and the guy who remembers to ask about your knee surgery.

  Marcus has given me exactly one instruction for this speech. He said, and I quote: "If anyone stands up there and calls this a 'victory lap' or says I 'won' at my career, I am walking out."

  For the traders here: You know why. To call this a "win" is to treat Marcus's thirty years as a single, additive bet. It implies we can tally the chips, cash out, and judge the outcome based on the final stack. But Marcus doesn't play additive games. He plays multiplicative ones. In his view, life isn't about the arithmetic mean of your best days and your worst days. It's about the geometric mean of the trajectory. It's about the compounding rate of trust, capital, and presence. And in a multiplicative system, there is no such thing as a "final score" until the game is truly over.

  So, we are not here to celebrate a win. We are here to celebrate *survival*. And in Marcus's philosophy, that is the only metric that matters.

  There is a concept in Kelly betting that Marcus has lectured me on more times than I care to admit. It's the idea that in a sequential game, the greatest risk isn't low returns; it's *ruin*. If you go to zero, you don't get to compound. You don't get to play tomorrow.

  Marcus applied this to the trading desk, yes. He's the reason we size positions to ensure we're still here next year. But he also applied it to everything else. He treats a marriage, a friendship, or a career like a Kelly bet.

  Here is the analogy I want to leave you with. It's the only one that satisfies both the quants in the back and Marcus's wife, Sarah, in the front.

  In an arithmetic world, if you have a 99% chance of a massive gain and a 1% chance of total ruin, you take the bet. The expected value is huge. But in Marcus's geometric world, that 1% chance of ruin drags the long-term growth rate down to zero. Because anything multiplied by zero is zero.

  For the traders: That's volatility drag killing your CAGR.
  For the family: That's choosing the big bonus over the anniversary dinner, or the big ego play over the quiet apology.

  Marcus realized early on that you cannot optimize your career arithmetically and your life geometrically. They are the same sequence of bets. If you blow up your health, or your patience, or your relationships, the financial returns don't matter because the multiplier is zero.

  So, when we look at the last thirty years, we aren't looking at a pile of chips he's gathered. We are looking at a path he kept open. He optimized for *time*. He optimized for the ability to keep showing up.

  There is a joke Marcus tells about his own retirement. He says most people treat retirement like liquidating a portfolio. They sell everything and buy an annuity. But he says retirement is just a rebalancing. He's shifting the weight from "capital accumulation" to "time allocation." The risk profile changes, but the objective function remains the same: maximize the geometric growth of a life well-lived.

  He refuses to let us call this a "win" because a win implies the game is over. But if he's done his job right, the game isn't over. The compounding continues. The lessons he taught us on risk management will compound in our P&Ls. The patience he showed his children will compound in their lives. The kindness he showed his friends will compound in this community.

  To treat tonight as a triumph would be to commit the arithmetic error he's spent three decades warning us against. It would be to look at the snapshot rather than the movie.

  So, I am not going to ask you to raise a glass to Marcus's success. I am not going to ask you to toast his victory.

  Instead, I want to ask you to raise a glass to the *trajectory*.

  To the fact that he never went to zero.
  To the fact that he protected the downside so the upside could take care of itself.
  To the fact that he understood that the only way to maximize the long run is to ensure you survive the short run.

  Marcus, you didn't beat the market. You didn't beat the clock. You simply stayed in the game long enough for the math to work in your favor. And you taught us that the same math applies to the people sitting next to us.

  Here's to the geometric mean. Here's to the path. And here's to the next sequence of bets.

  To Marcus.
