answer: |-
  **Title:** The Expressive Price of Gluts: Why the Student is Right About Dialetheism and Revenge

  **Introduction**

  The debate in your seminar cuts to the core of contemporary truth theory. Graham Priest's dialetheism, articulated through the Logic of Paradox (LP), has long marketed itself as the only solution to the Liar Paradox that avoids the "revenge" problems plaguing its rivals. The pitch is seductive: gap theories (like Kripke's) and hierarchy theories (like Tarski's) must ultimately rely on meta-concepts they cannot express within their own object language (e.g., "gappy" or "true at level n+1"). When a strengthened liar is constructed using these meta-concepts, the theory collapses or requires an infinite regress. Priest claims dialetheism escapes this by accepting the contradiction: the strengthened liar is simply a true contradiction (a glut), and no hierarchy is needed.

  However, your student has identified the single most potent objection to this program: the problem of **exclusion negation**. Her argument is that LP cannot express the semantic distinction required to make sense of its own solution. If dialetheism cannot coherently distinguish "just false" from "false and true" within the object language, it cannot explain why we should reject contradictions in ordinary contexts, nor can it formulate its own semantics without contradiction.

  This essay offers a verdict on that dispute. While Priest's diagnosis of the failure of classical logic is insightful, his student's objection is decisive. Dialetheism does not escape the revenge problem; it merely relocates it from the semantic level to the pragmatic level, rendering the theory expressively incomplete. When weighed against the independent cost of restricting Disjunctive Syllogism (DS) for everyday reasoning, dialetheism fails to be the most rational response to the Liar. A paracomplete approach (such as Hartry Field's), which treats the Liar as defective rather than true, preserves the normative force of logic and truth necessary for rational inquiry.

  **The Dialetheist Promise and the Revenge Problem**

  To understand the weight of the student's objection, we must first acknowledge why Priest's position is attractive. Classical logic, combined with the naive T-schema ($T(\ulcorner A \urcorner) \leftrightarrow A$) and standard self-reference, yields triviality via the Liar. Tarski saves consistency by restricting the T-schema via hierarchies; Kripke saves the T-schema (mostly) by introducing truth-value gaps. Both face "revenge." If a sentence is "gappy," the sentence "This sentence is not true" (where "not true" covers both false and gappy) generates a new paradox. If a sentence is "true at level $n$," the sentence "This sentence is not true at any level $\leq n$" generates a new paradox.

  Priest's LP avoids this by expanding the valuation space to $\{t\}, \{f\}, \{t, f\}$. Both $\{t\}$ and $\{t, f\}$ are designated (accepted). The Liar is assigned $\{t, f\}$. The "strengthened liar" ("This sentence is not true") is also assigned $\{t, f\}$. Priest argues this is a virtue: the theory is uniform. It doesn't need to step outside itself to classify the paradox; it absorbs it.

  **The Exclusion Negation Objection**

  Your student's objection targets the expressive capacity of LP. In classical logic, negation is exclusive: if $A$ is true, $\neg A$ is false, and never both. In LP, if $A$ is a glut ($\{t, f\}$), then $\neg A$ is also a glut ($\{t, f\}$). Consequently, LP lacks the resources to express "A is *only* false" or "A is *not* a glut."

  If the dialetheist introduces a new operator, say $-$ (exclusion negation), such that $-A$ is true only if $A$ is *only* false, they invite immediate revenge. Consider the sentence $E$: "This sentence is exclusively false" ($E \leftrightarrow -T(\ulcorner E \urcorner)$).
  1.  If $E$ is a glut, then $T(\ulcorner E \urcorner)$ is a glut. By the definition of exclusion, $-T(\ulcorner E \urcorner)$ must be false *only*. But $E$ is equivalent to it, so $E$ is false only. Contradiction (since we assumed $E$ was a glut).
  2.  If $E$ is false only, then $-T(\ulcorner E \urcorner)$ is true only. So $E$ is true only. Contradiction.

  To avoid triviality, the dialetheist must refuse to assign $E$ a consistent status using the new operator. But if they cannot use the operator to classify $E$, the operator is useless for solving the paradox. If they *can* use it, they face triviality.

  Priest's standard reply is that "just false" is **ineffable**. We cannot *say* a sentence is exclusively false in the object language; we can only *show* it by denying it pragmatically. He argues that the limit is not in the theory, but in the expressive capacity of language itself (an application of his "Inclosure Schema").

  **Why the Pragmatic Reply Fails**

  This is where the student's objection lands its decisive blow. A theory of truth is not merely a mechanism for assigning values; it is a normative guide for assertion and denial. If a theory cannot express the distinction between "assertible" (true) and "rejectable" (false only), it fails to guide rational inquiry.

  Priest's move to pragmatism admits that LP is **expressively incomplete**. It cannot state its own semantic categories. A paracomplete theorist (like Field) can say, "The Liar is indeterminate." A hierarchical theorist can say, "The Liar is not true at level 1." The dialetheist must remain silent or say, "The Liar is true and false," which provides no guidance on why we should not also accept *any* other contradiction.

  If the dialetheist cannot express "just false," they cannot explain why we should reject the sentence "The moon is made of cheese" in the same way they reject (or accept-and-reject) the Liar. In LP, both "The moon is cheese" (false) and the Liar (glut) imply contradictions if combined with certain classical inferences. Without an expressible exclusion operator, the dialetheist loses the ability to mark the difference between *pathological* contradictions (the Liar) and *catastrophic* contradictions (explosive inconsistencies in science or math).

  This expressive blindness is a higher cost than the hierarchical costs faced by rivals. A hierarchy of languages is a technical inconvenience; the inability to distinguish truth from glut is a conceptual collapse.

  **The Cost of Inference: Disjunctive Syllogism**

  The expressive deficit is compounded by the inferential cost. To prevent triviality, LP must reject **Disjunctive Syllogism** (DS): from $A \vee B$ and $\neg A$, infer $B$. In LP, if $A$ is a glut, $\neg A$ is designated (true), and $A \vee B$ is designated, but $B$ might be false.

  Priest argues we can recover DS in "consistent domains" (everyday situations where we assume no gluts exist). However, this recovery is circular. To assume a domain is consistent, we must be able to express "A is not a glut." But as established, LP cannot express this. The dialetheist must *assume* consistency without being able to *state* it.

  Compare this to a paracomplete theory like Field's. Field sacrifices the Law of Excluded Middle (LEM) rather than DS. This means some sentences ($A \vee \neg A$) are not assertible. While this is odd, it preserves the inferential machinery of classical mathematics and science (DS and Ex Falso are preserved in consistent fragments). It is more rational to sacrifice the universality of *logical truths* (LEM) than the validity of *inferences* (DS). Inference is the engine of reasoning; logical truths are the fuel. Dialetheism breaks the engine to keep the fuel universal.

  **The Verdict**

  So, does dialetheism escape revenge? **No.** It domesticates revenge by declaring it a true contradiction, but in doing so, it renders itself unable to express the semantic distinctions required to justify that declaration. Your student is correct: the problem is not solved, it is relocated to the pragmatic level, creating a theory that is self-blind regarding its own semantic categories.

  Is it the most rational response to the Liar specifically? **No.** The rationality of a logical theory is measured by its ability to model normative reasoning. Dialetheism preserves the T-schema at the cost of Disjunctive Syllogism and expressive completeness. Paracomplete theories (like Field's) preserve Disjunctive Syllogism and expressive completeness (via determinacy operators) at the cost of the T-schema's universality (restricted by indeterminacy).

  The paracomplete cost is preferable. It is better to say "The Liar sentence lacks a truth value" (preserving the distinction between true and false for all other sentences) than to say "The Liar sentence is true and false" (blurring that distinction universally). The former treats the Liar as a defect in language; the latter treats it as a feature of reality. Given that the Liar arises from self-reference and truth predicates—features of our linguistic representation, not necessarily the world—the paracomplete diagnosis is more ontologically parsimonious.

  **Conclusion**

  Dialetheism is a brave and rigorous attempt to take the Liar at its word. However, your student's objection regarding exclusion negation reveals that the price of this honesty is expressive suicide. A theory of truth that cannot say what is "just false" cannot guide assertion. Therefore, despite Priest's claims, dialetheism does not escape revenge; it succumbs to a version of it that undermines its own normative force. The more rational response is to accept that the Liar reveals a limitation in our semantic concepts (paracompleteness) rather than a contradiction in the world (dialetheism). We should keep Disjunctive Syllogism and accept gaps, rather than keep the T-schema and accept gluts. The student wins the argument.
