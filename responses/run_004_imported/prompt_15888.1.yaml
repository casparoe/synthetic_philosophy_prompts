      *   **Kai Nielsen (via the Critic):** This is "Wittgensteinian Fideism." It isolates religion from rational critique. If religious claims *look* like factual claims (e.g., "a man will rise from the dead"), they must be subject to factual scrutiny. If you say "it's not factual," you empty it of meaning. If it has no connection to reality, it's vacuous. If it *does* connect to reality, evidence matters. You can't have it both ways.

  3.  **Drafting - Stage 1: Setting the Scene:**
      *   Need a neutral setting. A coffee shop or a university office late at night fits the vibe. Let's go with a quiet campus cafe.
      *   Names: Let's call the Wittgensteinian "Elias" and the Critic "Sarah." (Keep it neutral).

  4.  **Drafting - Stage 2: The Opening Salvo:**
      *   Sarah needs to press the "fact of the matter" point.
      *   Elias needs to press the "function in life" point.
      *   *Focus:* The Last Judgement example.

  5.  **Drafting - Stage 3: Developing the Argument (The "Dodge" Accusation):**
      *   Sarah: If I say "there will be a judgment," and you say "no there won't," we are disagreeing about *something*. If evidence can't touch it, what are we disagreeing about?
      *   Elias: We aren't disagreeing about a date on a calendar. We are disagreeing about the *weight* of existence.
      *   Sarah: But if the Judgment never happens, does it matter?
      *   Elias: The belief *is* the living, not the prediction.

  6.  **Drafting - Stage 4: The Critic's Counter (Nielsen's Strong Point):**
      *   Nielsen argues that religious people *do* treat these as facts when it suits them (miracles, resurrection). They switch grammars when challenged.
      *   Sarah needs to point out this inconsistency. "You claim it's not empirical until someone asks for proof, then it becomes empirical."
      *   Elias needs to defend against the "switching" charge. It's not switching; it's that the empirical aspect is secondary to the existential aspect.

  7.  **Drafting - Stage 5: The Wittgensteinian's Counter (The "Meaning" Point):**
      *   Elias: If you reduce it to evidence, you destroy the meaning. A believer who loses faith isn't just updating a probability; they are losing a world.
      *   Sarah: But if the belief is immune to evidence, how is it different from delusion?
      *   Elias: Delusion fails to function in a form of life. Religion sustains a form of life.

