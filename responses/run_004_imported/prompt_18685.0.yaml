answer: |-
  This is an excellent pedagogical moment. Your student is right to feel that the evidence for the Church-Turing Thesis (CTT) is as strong as evidence gets in this domain, and she is right to be suspicious of answers that rely solely on "it's informal, so it can't be formal." That response often feels like a motte-and-bailey defense.

  However, she is mistaken in classifying the status of CTT as a theorem. The distinction is not merely terminological scruple or historical inertia; it rests on a fundamental category distinction between **mathematical derivation** and **conceptual/empirical analysis**.

  Here is a structured way to reconstruct the argument for her, distinguishing why the convergence of formalisms and Turing's analysis, however compelling, cannot constitute a mathematical proof, and why no future analysis could change that status.

  ### 1. The Category Error: Internal vs. External Claims
  The student's argument assumes that "proof" is a univocal concept applicable to any well-supported claim. In mathematics, however, a **theorem** is a statement derived deductively from axioms within a formal system.

  *   **Mathematical Claim:** "The function $f$ is Turing-computable." (This is provable within the theory of computation.)
  *   **CTT Claim:** "Every effectively calculable function is Turing-computable."

  The predicate "effectively calculable" does not belong to the formal system. It belongs to the pre-theoretic discourse about human practice, physical machinery, or epistemic norms. You cannot derive a conclusion about a pre-theoretic concept using only the axioms of arithmetic or set theory. To do so would be a category error.

  **Analogy:** Imagine three different chemical analyses all conclude that a specific liquid is $\text{H}_2\text{O}$. They converge extensionally. You also have a philosophical argument that "water" *just means* the clear, drinkable liquid in lakes. Does this constitute a **proof** that "Water = $\text{H}_2\text{O}$"? No. It constitutes a compelling identification. If we discover a new liquid that is clear, drinkable, and in lakes but has structure $\text{XYZ}$, the identification fails. The statement "Water = $\text{H}_2\text{O}$" is a scientific/philosophical identity claim, not a theorem of chemistry. Similarly, CTT is an identity claim between an intuitive notion and a formal class.

  ### 2. Turing's Analysis Rests on Modal/Empirical Premises
  Your student mentions Turing's 1936 argument as if it were a mathematical deduction. It is not. It is a **phenomenological and modal analysis**.

  Turing argues that a human computer is limited by:
  1.  **Finite symbols:** The number of distinguishable symbols is bounded.
  2.  **Finite states of mind:** The number of distinct mental states relevant to the task is bounded.
  3.  **Local operations:** The computer can only observe/change symbols in a bounded region.

  These are not logical truths. They are claims about the **physics of cognition** and the **geometry of space-time**.
  *   **Counter-possibility:** If human cognition could access an infinite number of distinct states of mind (e.g., via continuous neural gradients), Turing's bound fails.
  *   **Counter-possibility:** If physical laws allowed for "Zeno machines" (performing infinite steps in finite time) or hyper-dense storage, the "local operation" constraint might be bypassed physically.

  Because Turing's argument relies on premises about what is *physically* or *cognitively* possible, the conclusion is contingent on those premises. A mathematical theorem must hold in all models of the axioms; CTT holds only in models of the universe that respect Turing's constraints. Therefore, it cannot be a theorem.

  ### 3. The "No Future Proof" Argument
  The student asks: *Could a better analysis close the gap?*

  The answer is no, because any analysis must bridge the **Formal/Informal Gap**. To turn CTT into a theorem, one would have to formalize "effective procedure" into an axiom.
  *   **Option A:** You define "effective procedure" *as* "Turing-computable."
      *   *Result:* CTT becomes a tautology (a definition), not a substantive claim. It loses its empirical/philosophical content.
  *   **Option B:** You keep "effective procedure" informal and try to prove the link.
      *   *Result:* You cannot prove it, because "informal" implies "not governed by formal derivation rules."

  Any future analysis (like Robin Gandy's 1980 refinement of Turing's argument for mechanical devices) will simply push the premises back one step. Gandy derived Turing-computability from "Gandy Machines," but the principles defining a Gandy Machine (e.g., "causal influence propagates at finite speed") are physical principles, not mathematical axioms.

  As long as the notion of "effective procedure" is tied to **agency** (human or machine) in the **physical world**, it remains subject to empirical revision. If physics changes, computability might change. Mathematical theorems do not care about physics.

  ### 4. Distinguishing CTT Variants
  It is helpful to distinguish two versions of the thesis, as the confusion often lies in conflating them:

  1.  **CTT-Human (Turing's original focus):** What a human clerk can calculate following rules.
      *   *Status:* Highly robust, but relies on psychological/biological constraints.
  2.  **CTT-Physical (The modern interpretation):** What any physical machine can calculate.
      *   *Status:* Contingent on the laws of physics.

  If the universe permits **hypercomputation** (e.g., solving the Halting Problem via relativistic time dilation or quantum gravity effects), CTT-Physical is false. Since we do not have a final theory of physics, we cannot prove CTT-Physical. We can only say it holds given our current understanding of physical law. A theorem cannot be "true given current physics."

  ### 5. Why "Thesis" Matters Philosophically
  Calling it a "Thesis" (or Hypothesis) is not a dismissal of its strength; it is a marker of its **epistemic location**.

  *   **Theorems** are immune to empirical falsification.
  *   **Theses** are vulnerable to conceptual or empirical counter-examples.

  By maintaining the status of CTT as a thesis, we keep open the philosophical inquiry: *Why* does this formalism capture our intuition? Are there contexts (e.g., interactive computation, analog computing, quantum computing) where the intuition diverges from the formalism?

  If you declare it a theorem, you close the inquiry. You imply that anyone proposing a model of computation that exceeds Turing machines is making a mathematical error, rather than potentially making a discovery about physics or cognition.

  ### Suggested Response to the Student
  You might frame your reply to her along these lines:

  > "You are right that the evidence for the Church-Turing Thesis is as strong as evidence can possibly be in this field. The triangulation of formalisms and Turing's analysis makes it as close to certain as anything we accept in theoretical computer science.
  >
  > However, calling it a 'theorem' implies it is a truth of *mathematics*, derivable from axioms alone. It is not. It is a truth about the *relationship between mathematics and the world* (or mathematics and human cognition).
  >
  > Turing's argument relies on assumptions about finite states and local operations. These are plausible claims about physics and psychology, but they are not logical necessities. If the laws of physics allowed for infinite density or infinite speed, 'effective procedures' might exceed Turing machines. Since mathematical theorems cannot be falsified by physics, CTT cannot be a theorem.
  >
  > We call it a 'Thesis' not to express doubt, but to acknowledge that it stands outside the formal system it governs. It is the bridge between the formal and the intuitive. You cannot prove the bridge exists using only the materials on one side of the river."

  ### Recommended Reading for You/Her
  To bolster this, you might point her to:
  1.  **Wilfried Sieg, "Church without Dogma"**: Discusses the axiomatic approach to computability and acknowledges the constraints are epistemic/physical.
  2.  **Robin Gandy, "Church's Thesis and Principles for Mechanisms"**: Shows how even a refined analysis rests on physical principles (like finite speed of signal propagation).
  3.  **Stewart Shapiro, "Computability, Proof, and Open-Texture"**: Discusses why the informal notion cannot be fully captured by formal definition without loss of meaning.

  Your student's sharpness is an asset; she is correctly identifying that the *confidence* we have in CTT matches the confidence we have in theorems. Your task is to show her that **confidence** and **provability** are distinct epistemic categories.
