          *   Explain the user's logic (Stakes = Threshold for Action).
          *   Use the "Bank Case" analogy (philosophers DeRose/Cohen). If I need money for rent vs. a vacation, my standard for "knowing the bank is open" changes.
          *   Conclusion: You aren't irrational. The standard for "knowing" rises with the stakes.
      *   *Section 2: The Financial Reality (The "Decision" Question).*
          *   Separate the brother's reliability from the business risk.
          *   Brother paying back small loans $\neq$ Business succeeding.
          *   Buying out a partner is a capital expenditure/investment, not a cash-flow bridge.
          *   Risk of Ruin: Losing the emergency fund is a binary catastrophic event.
          *   Concentration Risk: All safety net in one asset.
      *   *Section 3: Actionable Advice.*
          *   Don't frame it as "I don't trust you." Frame it as "I can't risk my safety net."
          *   Alternatives: Co-sign a bank loan? Lend less? Equity stake?
          *   The "Sleep Test."
      *   *Closing:* Reiterate that protecting the safety net protects the relationship too.

  6.  **Refining the Tone:**
      *   Needs to be supportive but analytical.
      *   Avoid taking sides aggressively, but clearly support the user's intuition as *reasonable*.
      *   Ensure the distinction between "probability of repayment" and "impact of default" is clear.

  7.  **Self-Correction/Nuance Check:**
