prompt: |-
  Ok so I've been down a rabbit hole this week, rereading old Yudkowsky posts on coherence theorems (the "coherent decisions imply consistent utilities" one and its cousins) alongside some newer Alignment Forum stuff about the shutdown problem that pushes back on the whole coherence-theorem-therefore-expected-utility-maximizer pipeline. Both camps eventually lean on the same old move from decision theory: a money pump only actually works on an agent that's "naive" about the fact that its own future self is going to make a predictable series of trades against it, and a sufficiently forward-looking agent just doesn't walk into the pump in the first place. But I recall there being two genuinely different, named strategies for this in the older dynamic-choice-theory literature that grew up around the Allais paradox in the 80s/90s (McClennen vs. Hammond, roughly) -- something like "sophisticated" choice and "resolute" choice -- and I've never had it explained in a way that actually made the difference click, or made clear which one is doing more of the real work.

  Could you walk me through the difference between sophisticated and resolute choice as two ways an agent with cyclic or incomplete preferences might dodge a money pump -- ideally by tracing how each one actually behaves, node by node, on a concrete pump (either the standard cyclic setup, A over B over C over A, or the compound-lottery version that Allais-type preferences actually run into)? And then, more importantly, give me your actual opinion: does either strategy really rescue the agent, in the sense of letting it keep non-standard preferences while being just as diachronically rational as an expected-utility maximizer -- or is one of them (or both) basically just a relabeling of "and then, magically, the agent doesn't loose out," smuggling in exactly the commitment power that was supposed to be in question? Pick a side and justify it -- I've asked this at a meetup before and gotten two confident, opposite answers, so I know it's not just me who finds this murky.
