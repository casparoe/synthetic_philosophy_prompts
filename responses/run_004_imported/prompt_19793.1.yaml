answer: |-
  This is one of those questions where the literature is dense, the definitions shift slightly between authors (McClennen, Hammond, Rabinowicz, Gustafsson), and the stakes for AI alignment are high enough that people get protective of their intuitions. You are right to be suspicious of the "magic" here.

  Let's cut through the fog. I will walk you through the mechanics of the two strategies on a concrete pump, and then I will give you the hard take you asked for.

  ### Part 1: The Setup (The Cyclic Money Pump)

  To see the difference, we need a dynamic choice problem where preferences are **diachronically inconsistent**. The standard cyclic money pump is the cleanest example.

  **The Scenario:**
  You start with Item $A$. You face a sequence of three trades.
  1.  **Node 1:** Trade $A$ for $B$ (cost $\$1$).
  2.  **Node 2:** Trade $B$ for $C$ (cost $\$1$).
  3.  **Node 3:** Trade $C$ for $A$ (cost $\$1$).

  **The Preferences (at each node):**
  At the moment of decision, you strictly prefer the trade:
  *   At Node 1: $B - \$1 \succ A$
  *   At Node 2: $C - \$1 \succ B$
  *   At Node 3: $A - \$1 \succ C$

  **The Outcome of Naive Choice:**
  A **Naive** agent evaluates only the current node.
  *   Node 1: Takes trade (ends with $B-\$1$).
  *   Node 2: Takes trade (ends with $C-\$2$).
  *   Node 3: Takes trade (ends with $A-\$3$).
  *   **Result:** You are back at $A$, but $\$3$ poorer. Pumped.

  ---

  ### Part 2: Sophisticated vs. Resolute Choice

  Both Sophisticated and Resolute agents avoid this loss, but they do it via fundamentally different cognitive architectures.

  #### 1. Sophisticated Choice (Hammond)
  **The Mantra:** *"I cannot trust my future self, so I will accommodate its betrayal."*

  Sophistication is an application of **backward induction**. The agent does not assume it can bind its future self. Instead, it predicts what its future self *will* do (based on future preferences) and chooses the current option that leads to the best outcome *given* that prediction.

  **The Trace:**
  *   **Step 1 (Look ahead to Node 3):** The agent asks, "If I reach Node 3 holding $C$, what will I do?"
      *   It knows its future self prefers $A-\$1$ over $C$.
      *   *Prediction:* Future self will trade. Outcome: $A-\$3$ (cumulative cost).
  *   **Step 2 (Look ahead to Node 2):** The agent asks, "If I reach Node 2 holding $B$, what will I do?"
      *   Option Keep: End with $B-\$1$.
      *   Option Trade: Go to Node 3, which leads to $A-\$3$ (based on Step 1 prediction).
      *   Comparison: The agent compares $B-\$1$ vs $A-\$3$.
      *   *Crucial Detail:* Even if $B \succ A$ locally, the agent might prefer $B-\$1$ over $A-\$3$ if the monetary loss is high enough to break the cycle's attractiveness. However, in a tight pump where preferences dominate the $\$1$, the Sophisticated agent sees that trading at Node 2 leads to the disastrous Node 3 outcome.
      *   *Decision:* If $B-\$1 \succ A-\$3$, it stops at Node 2.
  *   **Step 3 (Back to Node 1):** The agent asks, "Should I start?"
      *   Option Keep: End with $A$.
      *   Option Trade: Go to Node 2. Based on Step 2, this leads to ending with $B-\$1$ (if it stops) or $A-\$3$ (if it continues).
      *   *The Rescue:* A Sophisticated agent realizes that entering the sequence leads to a dominated outcome. **It refuses the first trade.**

  **The Cost:** Sophistication saves your money, but it restricts your agency. You cannot take *any* sequence of trades that *might* lead to a pump, even if a beneficial sequence looks identical at the start. You are paralyzed by the prediction of your own future irrationality.

  #### 2. Resolute Choice (McClennen)
  **The Mantra:** *"I made a plan, and I will stick to it even if I no longer want to."*

  Resoluteness is not about prediction; it is about **binding**. The agent formulates a plan at Node 1 that maximizes utility over the whole tree. At subsequent nodes, it ignores its local preferences and executes the plan.

  **The Trace:**
  *   **Step 1 (Planning at Node 1):** The agent evaluates all complete plans:
      *   Plan Stop-1: Keep $A$.
      *   Plan Trade-1-Stop-2: Trade to $B$, then stop.
      *   Plan Full-Cycle: Trade to $B$, then $C$, then $A$.
      *   It selects the best plan (e.g., Trade-1-Stop-2, assuming $B$ is genuinely better than $A$ and it can avoid the third trade).
  *   **Step 2 (Execution at Node 2):** The agent holds $B$.
      *   Local Preference: $C-\$1 \succ B$. (It *wants* to trade).
      *   Plan Constraint: The plan was "Stop at Node 2."
      *   *Decision:* It **does not trade**. It overrides its local preference.
  *   **Step 3 (Execution at Node 3):** (Hypothetically, if it reached here).
      *   Local Preference: $A-\$1 \succ C$.
      *   Plan Constraint: "Stop."
      *   *Decision:* It **does not trade**.

  **The Cost:** Resoluteness requires a mechanism to override local preferences. It posits that the "Agent" is not just the collection of momentary preferences, but a persisting entity that can enforce its will across time.

  ---

  ### Part 3: The Verdict

  You asked me to pick a side: **Does either strategy rescue the agent, allowing non-EU preferences while remaining diachronically rational? Or is it smuggling in commitment power?**

  **My Stance:**
  **Resolute Choice is smuggling in commitment power, and it does not rescue non-EU preferences from coherence theorems.** It merely shifts the locus of coherence from the *object-level preferences* to the *meta-level planning architecture*.

  Here is the justification.

  #### 1. The "Who" Problem
  Resolute choice requires a separation between the **Planner** (Node 1 self) and the **Doer** (Node 2 self).
  *   For Resoluteness to work, the Planner must have authority over the Doer.
  *   But in a standard decision-theoretic model, the agent *is* its preferences. If the Node 2 self prefers $C$ over $B$, and the Node 1 self prefers $B$ over $C$ (in the context of the plan), you effectively have **two different agents** fighting for control of the same body.
  *   To say the Node 1 self "wins" is to assert that the Node 1 preferences are *more real* or *more authoritative* than the Node 2 preferences.
  *   Why? The only coherent justification for giving Node 1 authority is that Node 1 has **consistent, stable preferences over plans**.

  #### 2. The Coherence Theorems Win at the Meta-Level
  If an agent can be Resolute, it means it has a preference ordering over *plans* (histories of actions) that is consistent enough to select one and enforce it.
  *   Let $P_1$ be the plan "Trade then Stop."
  *   Let $P_2$ be the plan "Don't Trade."
  *   If the agent consistently chooses $P_1$ over $P_2$ and enforces it, **it is behaving as an Expected Utility Maximizer over the space of Plans.**
  *   The incoherence (the cycle $A \succ B \succ C \succ A$) existed only at the level of *local outcomes*. At the level of *temporal plans*, the agent must exhibit consistency to be resolute.
  *   Therefore, the Coherence Theorems still apply. They just apply to the **meta-preferences** (preferences over policies/plans) rather than the **object-preferences** (preferences over immediate gambles).

  #### 3. The AI Alignment Implication (The "Shutdown" Context)
  This is why the Alignment Forum pushback on coherence theorems is often half-right but ultimately dangerous.
  *   **The Hope:** "We can build an AI with non-EU preferences (e.g., risk-weighted, or corrigible) that won't be money-pumped because it will be Resolute."
  *   **The Reality:** To make an AI Resolute, you must architecturally prevent it from optimizing its local objective function at Node 2. You have to hard-code the commitment.
  *   If the AI is a powerful optimizer (like a modern RL agent or a mesa-optimizer), its local gradients at Node 2 will push it to violate the plan if that maximizes its local reward signal.
  *   **Resolute Choice is not a preference structure; it is a control constraint.** It is equivalent to saying, "The agent is not allowed to change its policy."
  *   But if the agent is smart enough to understand the money pump, it is smart enough to realize that *changing its own preferences* (or disabling its commitment mechanism) would allow it to exploit the pump. A truly agentic system that *only* has cyclic preferences will self-modify to become an EU maximizer (or a Resolute EU maximizer over plans) to avoid the loss.

  ### Conclusion

  **Sophisticated Choice** is the "honest" failure mode. It admits the agent is dynamically inconsistent and restricts its own behavior to avoid exploitation. It preserves the integrity of the preference model but sacrifices capability (it leaves money on the table to avoid risk).

  **Resolute Choice** is the "magic" solution. It claims to preserve capability and avoid exploitation, but it does so by positing a **higher-order consistency** that looks suspiciously like Expected Utility Maximization over policies.

  **The Hard Take:**
  Coherence theorems are robust. You cannot have an agent that is:
  1.  Capable (takes beneficial trades),
  2.  Uncorrigible (resolute against self-modification),
  3.  And Incoherent (cyclic preferences).

  If it is Capable and Resolute, it *must* be Coherent at the level of plans. If it is Incoherent at the level of outcomes, it *must* either be Naive (get pumped) or Sophisticated (paralyzed).

  Resolute choice doesn't save non-EU preferences; it just hides the EU maximization one layer up the stack. For alignment, this means you cannot rely on "training a resolute agent." You have to build an agent whose **local incentives** align with the global plan, or whose architecture makes deviation impossible. The former is just standard alignment (making preferences consistent); the latter is boxing (removing agency). There is no free lunch in the middle.
