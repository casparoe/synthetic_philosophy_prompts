answer: |-
  The room was soundproofed, not to keep noise out, but to keep the causality in.

  Dr. Aris sat behind the glass, his fingers hovering over the haptic console. On the other side sat Kael. Kael was a man accused of a violent disposition. Three years ago, in a crowded market, he had shattered a bottle over a stranger's head. No provocation, no warning. Just a sudden, kinetic eruption.

  Now, Kael wore the Collar. It was a sleek band of matte black polymer around his throat, humming with a frequency only the monitors could hear. This was the final Dispositional Audit. If Kael passed, he walked. If he failed, he went to the Indefinite Ward.

  The law was specific. It didn't punish acts; it punished *properties*. You weren't jailed for breaking a bottle; you were jailed for *being fragile*. For having a violence-disposition that made breaking bottles inevitable under the right conditions.

  "Begin Stress Protocol Four," Aris said. His voice was flat. He didn't look at Kael; he looked at the Neural Flow Monitor.

  Two lines scrolled across the screen. Green for baseline cognition. Red for aggressive intent.

  The protocol was simple. Aris would introduce a threat. A loud noise, a personal insult, a simulated attack. The question was the old metaphysical trap: *If struck, would he break?*

  But the Collar complicated the conditional. The Collar was an Intervener. It monitored the motor cortex and the limbic system. If it detected violence, it intervened.

  The problem—the one that kept Aris awake, the one that had turned this seminar of a job into a nightmare—was *how* it intervened.

  There were two ways to stop a glass from breaking when you hit it.
  One: You wrap it in bubble wrap. The glass is still fragile. The force hits, the glass tries to shatter, but the wrap holds it together. In the business, that was a **Mask**. The disposition is real, intact, and dangerous; it just can't manifest. If Kael was Masked, he was still violent. He stays in the Ward.
  Two: You turn the glass into rubber the instant before the hammer falls. The fragility itself vanishes. The property is gone at the moment of testing. That was a **Fink**. If Kael was Finked, then at the exact moment of provocation, he *was not violent*. The disposition ceased to exist. If he wasn't violent, he couldn't be guilty of a violent nature. He walks.

  "Protocol initiated," the computer chimed.

  On the other side of the glass, a siren wailed. A holographic figure lunged at Kael with a baton.

  Kael flinched. His eyes widened.
  On the monitor, the Red Line spiked.
  Aris held his breath. This was the critical nanosecond. The moment of *t1*.

  If the Red Line hit the ceiling and stayed there, but Kael's body didn't move, that was a Mask. The Collar was blocking the muscles. Kael was a loaded gun with a safety lock.
  If the Red Line spiked and then *dropped*—if the anger itself evaporated before the muscles fired—that was a Fink. The Collar was rewriting his mind. Kael was a gun that turned into a bouquet of flowers when the trigger was pulled.

  The Red Line surged. It hit the threshold.
  Aris's finger hovered over the 'Contain' button.
  Then, the line didn't hit a wall. It dissolved. It didn't get blocked; it unspooled. The neural signature of rage didn't bounce back; it transmuted into a spike of cortisol, then confusion, then calm.

  Kael didn't strike. He didn't even tense. He looked at the holographic attacker with mild curiosity, tilting his head.

  "Fink," Aris whispered.

  The data was undeniable. The disposition hadn't been masked; it had been removed. At the moment of testing, Kael did not possess the property of 'violence.' The conditional "If provoked, Kael would attack" was false.

  "Audit complete," the computer said. "Disposition: Null. Certification: Safe."

  Aris felt a cold knot tighten in his stomach. He looked through the glass. Kael was standing up, stretching his arms. He looked relieved. He looked like a man who had just been told he wasn't a monster.

  But Aris knew the machinery. The Collar was a Fink. It sensed the onset of the disposition and deleted it. It made the conditional true by altering the antecedent. It was Martin's wire: the wire is dead until you touch it, at which point the device makes it live to shock you. Here, the man was violent until he was tested, at which point the device made him safe to pass the test.

  The certification didn't measure Kael. It measured the Collar.

  "Open the seal," Aris said.

  The airlock hissed. Kael walked into the antechamber. A technician reached out to unclasp the Collar.

  "Wait," Aris said.

  The technician paused. "Sir? He's certified. Paperwork says he's non-violent."

  "I know what the paperwork says." Aris stood up. He walked to the glass. "Kael."

  Kael looked up. The relief was gone from his eyes, replaced by a flat, hard exhaustion. "Did I pass, Doctor?"

  "The data says you don't have a violent disposition."

  Kael smiled, but it didn't reach his eyes. "I know what I am, Doctor. I know what's in here." He tapped his temple. "The Collar... it whispers to me. When I get angry, it tells me to be calm. It changes the thought before I can think it."

  "That means you're safe," Aris said. The words tasted like ash.

  "No," Kael said softly. "It means I'm safe *when you're looking*."

  The technician unclipped the Collar. It fell into the tray with a heavy clunk. The hum died.

  For a second, nothing happened. Kael stood there, rubbing his neck. He was free. The state had declared him devoid of the property 'violence.' He could buy a ticket, get on a train, go home to his wife.

  Then Kael looked at the technician. The man was fumbling with the latch, slow, clumsy. A drop of sweat ran down his temple.
  Kael's eyes tracked the sweat.
  Aris saw the shift. It wasn't a spike on a monitor this time. There was no Red Line. There was just the geometry of the room, the distance between Kael's hand and the technician's throat, the weight of the metal tray.

  Without the Collar, there was no Fink. The disposition wasn't being deleted at *t1*.
  But without the test, there was no Mask either. The disposition wasn't being blocked.

  It was just... there. Waiting.

  "Could he have done otherwise?" Aris muttered to himself.

  If the Collar had been on, Kael would have felt calm. He *would* have done otherwise.
  If the Collar was off, Kael felt the old heat rising. He *would not* have done otherwise.

  Which Kael was the real one? The one who existed under observation, whose very soul was rewritten by the act of measurement? Or the one who existed in the dark, whose nature was only visible when no one was there to certify it?

  Kael picked up the Collar. He weighed it in his hand. He looked at Aris through the glass. He didn't smile. He didn't scowl. He just placed the Collar on the counter, turned, and walked toward the exit door.

  As his hand touched the push-bar, Aris realized the terrifying truth of the seminar. They had spent weeks arguing about whether the power was inside the object or the situation.

  But looking at Kael's back, Aris saw that the power wasn't in the object, and it wasn't in the situation. It was in the *gap* between them. The disposition wasn't a thing Kael *had*. It was a thing that happened *to* him, when the world poked him in the right way.

  And now, the world was about to poke him, and there was no one left to watch the data.

  Kael pushed the bar. The alarm didn't sound. He was certified Safe.
  The door opened. The street outside was loud, chaotic, full of bumps and shoves and reasons to break.

  Aris sat back down. He looked at the monitor. The Red Line was flat. Green.
  Because the test was over.
  Because no one was poking the wire anymore.

  He closed the file. He didn't call security. You can't arrest a man for a property he doesn't technically possess. You can only watch him walk out the door, carrying a fragility that only breaks when no one is watching.
