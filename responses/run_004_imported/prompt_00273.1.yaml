      *   **Problem:** Colleagues disagree on axiomatizing Choice (AC) vs. purely constructive foundations.
      *   **Pain Point:** The standard "Banach-Tarski" argument is too abstract/set-theoretic and doesn't resonate with their daily work in DT (Dependent Type) systems.
      *   **Goal:** Explain the implications of accepting vs. rejecting AC *specifically* in the context of Coq/Agda.
      *   **Key Areas to Cover:** Decidability, Program Extraction, Provable Theorems, Computational Content.

  2.  **Deconstruct the Axiom of Choice (AC) in Type Theory:**
      *   In ZFC (Set Theory), AC is about picking elements from sets.
      *   In Type Theory (Coq/Agda), AC is often related to the distinction between *propositions* (`Prop`/`Prop`) and *data* (`Set`/`Type`).
      *   *Constructive AC:* $\forall x:A, \exists y:B, R(x,y) \to \exists f:A\to B, \forall x:A, R(x,f(x))$.
      *   In Martin-Löf Type Theory (Agda default), a constructive version of AC is actually *provable* because $\exists$ is a sigma type (data).
      *   In Coq (Calculus of Inductive Constructions), $\exists$ in `Prop` is erased. To get a function $f$, you need to move from `Prop` to `Set`. This requires an axiom (often called `choice` or `constructive_epsilon`).
      *   *Classical AC:* Involves excluded middle (EM) or non-computable choices.

  3.  **Identify Key Implications for the User's Context:**

      *   **Program Extraction (The Big One):**
          *   Constructive logic = Programs.
          *   AC (specifically the non-constructive kind that moves `Prop` to `Set`) breaks extraction. You get a function, but you can't compute it.
          *   Agda: AC is usually computable *if* the existential is a Sigma type. If using `Prop`-like truncations, it becomes non-computable.
          *   Coq: `Axion of Choice` usually implies moving from `Prop` to `Set`, killing extraction.

      *   **Decidability & Canonicity:**
          *   AC often implies Excluded Middle (Diaconescu's theorem) in certain formulations.
          *   If EM holds, you lose the ability to decide equality on many types computationally.
          *   Canonicity (closed terms reduce to constructors) might be threatened if axioms are opaque.

      *   **Proof Engineering/Convenience:**
          *   With AC: Easier to prove existence theorems, isomorphisms, algebraic structures (bases, maximal ideals).
          *   Without AC: Harder proofs, but guarantees computational content. Forces you to be explicit about algorithms.

      *   **Univalence/HoTT (Advanced but relevant):**
