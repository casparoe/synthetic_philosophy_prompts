answer: |-
  This is a common friction point in formal verification teams. Since you are working in Coq and Agda, the standard set-theoretic arguments (like Banach-Tarski) are indeed red herrings. They concern measure theory and models of ZFC, not the computational behavior of your proofs.

  In Dependently Typed (DT) systems, the "Axiom of Choice" (AC) is not a single monolithic statement. The stakes depend entirely on **which version** of Choice you are axiomatizing and **where** you place it in the type hierarchy (`Prop` vs. `Set`/`Type`).

  Here is the breakdown of what is actually at stake for your daily work in Coq and Agda.

  ---

  ### 1. The Crucial Distinction: Data vs. Proof
  In set theory, everything is a set. In Coq and Agda, there is a distinction between **Data** (computation) and **Proofs** (logical validity).

  *   **Constructive Choice (Theorem):**
      $$ (\forall x:A, \Sigma y:B, R(x,y)) \to (\Sigma f:A\to B, \forall x:A, R(x, f(x))) $$
      Here, $\Sigma$ is a Sigma type (a pair containing data). In both Agda and Coq (over `Set`/`Type`), **this is provable without axioms.** It is simply pattern matching. If you have a dependent pair, you can project the function. This does not break extraction.

  *   **Propositional Choice (The Axiom):**
      $$ (\forall x:A, \exists y:B, R(x,y)) \to (\exists f:A\to B, \forall x:A, R(x, f(x))) $$
      Here, $\exists$ is an existential quantifier in `Prop` (Coq) or a Truncated Type (Agda). It asserts existence *without* providing the witness as data.
      **This is the axiom your colleagues are debating.** To turn the `Prop` existence into a function $f$ (which lives in `Set`/`Type`), you must bridge the gap between proof and data.

  ### 2. Impact on Program Extraction
  This is the most practical consequence for verification engineers.

  *   **Without the Axiom:**
      Every function you define is computable. When you run `Extraction` in Coq or compile Agda code, every function corresponds to an algorithm. If you prove $\forall n, \exists m, m > n$, you have a program that computes $m$ given $n$.

  *   **With the Axiom:**
      To move from `Prop` to `Set`, the axiom must be postulated as an **opaque constant**.
      *   **Coq:** If you use `Axiom choice : forall (A:Set) (P:A->Prop), (exists x, P x) -> {x:A | P x}.`, the resulting term contains `choice`. During extraction, `choice` becomes an **axiomatically assumed function** in OCaml/Haskell. It has no body. You cannot run the extracted code.
      *   **Agda:** If you postulate choice for truncated types, you introduce a term that does not reduce. It blocks normalization.

  **Verdict:** If your goal is to extract verified executables, you **cannot** use Propositional Choice. It turns your verified program into a specification that relies on an oracle.

  ### 3. Impact on Decidability (Diaconescu's Theorem)
  In constructive type theory, accepting the full Axiom of Choice often implies the **Law of Excluded Middle (LEM)**. This is known as Diaconescu's Theorem.

  *   **The Mechanism:** AC allows you to construct a choice function on a set of two elements $\{0, 1\}$ based on a proposition $P$. The behavior of the choice function reveals whether $P$ is true or false.
  *   **The Consequence:** If you accept AC (specifically the version that implies LEM), you logically assert that **all propositions are decidable**.
  *   **The Practical Problem:** In Coq/Agda, we distinguish between `bool` (computable decision) and `Prop` (logical assertion). If AC implies LEM, it tempts you to treat all `Prop`s as `bool`s.
      *   You lose the ability to reason about undecidable problems (e.g., halting problem, equivalence of context-free grammars) without running into contradictions or non-terminating computations.
      *   It breaks **Canonicity**: Closed terms of type `nat` should reduce to `S (S ... 0)`. With AC/LEM axioms, you can construct terms that do not reduce to a canonical form because they rely on opaque decision procedures.

  ### 4. Proof Engineering: What becomes easier vs. harder?

  #### If you Accept Axiomatic Choice:
  *   **Easier:** Classical mathematics becomes available. You can prove theorems that rely on non-constructive existence.
      *   *Examples:* Every vector space has a basis; every ideal is contained in a maximal ideal; compactness theorems in analysis.
      *   *Workflow:* You can write proofs that look like standard paper mathematics ("Let $x$ be such an element...").
  *   **Harder:** You must track which parts of your development are computable. If a lower-level module uses AC, nothing depending on it can be extracted. This creates "axiom pollution" that can spread through a large codebase.

  #### If you Reject Axiomatic Choice (Purely Constructive):
  *   **Easier:** Extraction is guaranteed. You maintain the "Proofs as Programs" correspondence strictly.
  *   **Harder:** You must be explicit about algorithms.
      *   Instead of proving "There exists a maximum," you must write a function `find_max` and prove it correct.
      *   Some standard algebraic structures are much harder to define. For example, defining the real numbers constructively (Cauchy sequences with moduli of convergence vs. Dedekind cuts) requires more bookkeeping.
      *   You cannot prove certain classical theorems. You must find constructive equivalents (e.g., instead of "inverse exists," you prove "approximate inverse exists").

  ### 5. Coq vs. Agda Nuances

  | Feature | **Coq** | **Agda** |
  | :--- | :--- | :--- |
  | **Propositions** | Impredicative `Prop` (erased). | No `Prop`; usually `Set` or `Prop` via libraries (e.g., Agda Standard Library). |
  | **Choice Status** | `Prop`-to-`Set` choice is an **Axiom**. | Sigma-type choice is a **Theorem**. Truncated choice is an **Axiom**. |
  | **Extraction** | AC breaks extraction (opaque constants). | AC blocks normalization (stuck terms). |
  | **Common Practice** | Many verification projects accept `Classical_Prop` but reject `Choice` to keep extraction. | Agda users often avoid axioms entirely to preserve canonicity and compatibility with Cubical/HoTT. |

  ### 6. Compatibility with Modern Extensions (HoTT/Univalence)
  If there is any chance your team will move toward **Homotopy Type Theory (HoTT)** or use **Univalence** (available in Agda with `--cubical`, experimental in Coq):
  *   **Standard AC is inconsistent with Univalence.**
  *   In HoTT, AC holds for "sets" (h-level 2) but fails for higher types.
  *   Axiomatizing global Choice breaks the homotopical interpretation of types. If you care about future-proofing for higher-dimensional structures, reject global Choice.

  ### Summary Recommendation

  **Reject the Axiom of Choice (Prop-to-Set) if:**
  1.  **Program Extraction is a goal:** You intend to compile your proofs to OCaml, Haskell, or C.
  2.  **Canonicity is required:** You need to evaluate terms inside the prover (e.g., `Compute` in Coq) to verify concrete examples.
  3.  **Future-proofing:** You want to remain compatible with Univalence or Cubical Agda.
  4.  **Verification Domain:** You are verifying algorithms, compilers, or protocols where computational content is king.

  **Accept the Axiom of Choice if:**
  1.  **Pure Mathematics:** You are formalizing classical analysis, algebra, or topology where constructive equivalents are prohibitively complex or non-standard.
  2.  **No Extraction:** The proof artifact is the PDF or the checked term, not the extracted code.
  3.  **Proof Cost:** The constructive proof requires significant algorithmic engineering that is outside the scope of the verification goal (e.g., proving security properties where the existence of a key matters more than computing it).

  **The Middle Ground (Coq Specific):**
  Many Coq teams use a **layered approach**.
  *   Core libraries are purely constructive (no AC).
  *   High-level proofs import `Classical_Choice`.
  *   **Crucially:** They ensure the axioms do not leak into the types of the functions they intend to extract. You can prove lemmas using AC to help verify a constructive function, provided the AC doesn't appear in the final type signature of the extracted function.

  **For your team disagreement:**
  Frame the debate not as "Constructive vs. Classical Truth," but as **"Computational Content vs. Proof Convenience."** If the project requires executable code, AC is a non-starter. If the project is purely about verifying mathematical properties of a system where execution doesn't matter, AC is a productivity tool.
