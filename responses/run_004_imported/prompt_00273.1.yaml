          *   Compatibility with other axioms (Univalence).
      *   **Recommendation/Summary:** When to use which.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Correction on Agda:* In standard Agda, $\forall x \exists y \dots \to \exists f \dots$ is provable because $\exists$ is $\Sigma$. I need to make sure I distinguish between *Constructive Choice* (provable) and *Classical/Prop Choice* (axiomatic). The user is likely asking about the axiomatic version that allows moving from existence proofs to functions.
