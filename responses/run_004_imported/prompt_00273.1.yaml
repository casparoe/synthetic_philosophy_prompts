      *   **Specific Coq vs. Agda Nuances:**
          *   **Coq:** Has `Prop` vs `Set`. AC is an axiom (`ChoiceF`, `epsilon`). Breaks extraction.
          *   **Agda:** No `Prop` (usually). Everything is `Set`. AC is a theorem *unless* you use truncations/squashing. If you postulate AC, it's opaque.

  4.  **Structure the Response:**

      *   **Introduction:** Acknowledge the context (DT systems vs. Set Theory). Clarify that "Choice" means something slightly different here.
      *   **The Core Distinction:** `Prop` (Proofs) vs. `Set` (Data). This is the crux in Coq/Agda.
      *   **Implication 1: Program Extraction (Computational Content).** This is the most practical concern.
