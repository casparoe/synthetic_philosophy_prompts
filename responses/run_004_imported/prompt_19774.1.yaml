answer: |-
  Your advisor is theoretically correct, but your nagging memory is also valid. This is one of the most contentious interfaces between Bayesian theory and scientific practice.

  Here is the breakdown of why the Likelihood Principle (LP) makes optional stopping "kosher" for Bayesians, where the "sampling to a foregone conclusion" critique actually comes from, and the specific conditions under which your lab's practice could bite you.

  ### 1. The Likelihood Principle and Optional Stopping
  The Likelihood Principle states that all the evidence in the data regarding the parameters is contained in the likelihood function. Crucially, it implies that the **stopping rule is irrelevant for inference** once the data are observed.

  *   **Frequentist View:** The $p$-value is defined by the sampling distribution of a statistic under the null hypothesis. This distribution depends on your *intent*. If you intend to peek and stop, the space of "possible outcomes" changes, inflating the Type I error rate. You must correct for peeking (e.g., alpha spending).
  *   **Bayesian View:** The Bayes Factor (BF) is a ratio of likelihoods: $P(Data | H_1) / P(Data | H_0)$. The probability of the data given a hypothesis does not depend on when you decided to stop collecting it (assuming the stopping rule itself doesn't generate data). Therefore, the BF calculated at $N=50$ is the same whether you planned to stop at 50 or planned to stop at 100 but peeked at 50 and got lucky.

  **Verdict:** Your advisor is right. Under standard Bayesian inference, you do not need to penalize the Bayes Factor for optional stopping. The interpretation of the BF (e.g., "evidence is 10 times more likely under $H_1$") remains valid.

  ### 2. The "Sampling to a Foregone Conclusion" Critique
  You recalled a critique that Bayesians can "sample to a foregone conclusion." This usually refers to one of two scenarios, and it is important to distinguish them from standard optional stopping.

  **A. Improper Priors (The Real Danger)**
  If you use an **improper prior** (a prior that doesn't integrate to 1, often used as a "non-informative" default), optional stopping *can* break things. With improper priors, the BF can be undefined or can drift arbitrarily as $N$ increases, allowing you to eventually find support for any hypothesis.
  *   **Fix:** Ensure your lab uses **proper priors** (distributions that sum/integrate to 1). Most default Bayesian t-tests (e.g., Cauchy priors on effect size) are proper.

  **B. The "True Null" Scenario (The Frequentist Complaint)**
  Frequentists argue: "If the null is true, and I peek forever, won't I eventually hit BF > 10 by chance?"
  *   **Bayesian Response:** No. If the null is true, the Bayes Factor will converge to 0 (favoring $H_0$) as $N \to \infty$. Unlike $p$-values, which will *eventually* become significant under a false null with enough data, BFs are **consistent**. They converge on the true hypothesis.
  *   **The Catch:** While they converge, they can fluctuate wildly in small samples. If you peek *very* frequently in small samples, you increase the probability of stopping on a temporary fluctuation that favors the wrong hypothesis.

  ### 3. The Real Catch: Where This Practice Can Bite You
  If the math says it's fine, why do people worry? There are three practical traps where your lab's policy could lead to false conclusions.

  #### Trap 1: Prior Sensitivity and Calibration
  The validity of the BF under optional stopping assumes your **prior model is well-calibrated**.
  *   **The Issue:** If your prior on the alternative hypothesis ($H_1$) is too vague (e.g., expecting huge effects that don't exist), the BF will inherently favor the Null ($H_0$). Conversely, if the prior is too narrow, it favors $H_1$.
  *   **The Peek Problem:** If you peek and stop as soon as BF > 10, you are selecting for moments where the noise aligns with your prior. If your prior is misspecified, optional stopping amplifies the rate of misleading evidence.
  *   **Requirement:** Your priors must be theoretically justified, not just "default settings." If you are using default priors without checking if they match the scale of effects in your field, optional stopping increases the risk of publishing a false positive (or false negative).

  #### Trap 2: Informative Stopping Rules
  The Likelihood Principle holds only if the stopping rule is **non-informative**.
  *   **The Issue:** You must stop *only* based on the BF threshold or resource limits. If you stop because "the data looks noisy and I'm tired" or "the equipment seemed glitchy today," the stopping rule is now correlated with the parameter.
  *   **Requirement:** The decision to stop must be independent of the data *except* through the calculated BF. If the lab stops collecting data because "it's looking like null and we're bored," you have violated the assumption.

  #### Trap 3: Decision Theory vs. Inference
  This is the subtle philosophical catch. The LP applies to **inference** (what do I believe?), not **decision making** (what should I do?).
  *   **The Issue:** If you have a loss function (e.g., cost of participants vs. cost of being wrong), the optimal stopping rule *does* depend on the sequential nature of the data.
  *   **Requirement:** If your goal is purely epistemic (updating belief), peeking is fine. If your goal is resource optimization or minimizing long-run error rates in a policy context, you should technically use a Sequential Probability Ratio Test (SPRT) or similar decision-theoretic approach, which sets different thresholds than standard BF interpretation.

  ### 4. Summary: Is Your Lab "Kosher"?
  **Yes, provided three conditions are met:**

  1.  **Proper Priors:** You are not using improper priors. Ideally, your priors are informed by previous literature, not just software defaults.
  2.  **Non-Informative Stopping:** You stop based on the BF threshold or pre-set resource limits, not on "hunches" about the data quality or direction that aren't captured in the model.
  3.  **Transparency:** You report that you used optional stopping. (Ironically, while Bayesians don't *need* to correct for it, hiding it looks like $p$-hacking to frequentist reviewers, which creates political friction).

  **The "Sore Loser" Nuance:**
  It is not that frequentists are sore losers; it is that they control **long-run error rates** (frequency of false claims across infinite hypothetical replications), while Bayesians control **belief coherence** (logical consistency of evidence in this specific instance).
  *   If your lab publishes 100 studies using optional stopping with BF > 10, and your priors are good, roughly 90% of those claims will be true.
  *   If your priors are bad, that calibration fails.

  **Recommendation for Lab Meetings:**
  Stop repeating "it's totally fine because of the Likelihood Principle." Instead, say: *"Optional stopping is valid for Bayes Factors provided our priors are proper and well-calibrated. To ensure we aren't capitalizing on noise, we should verify that our default priors are reasonable for our effect sizes, and we must transparently report the stopping rule in our methods."*

  This acknowledges the theory while respecting the practical risk that your memory warned you about.
