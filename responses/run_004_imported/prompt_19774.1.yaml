prompt: |-
  Quick context: in my lab we run a lot of online studies, and my advisor's policy is to just check the Bayes factor every couple days as data trickles in and stop whenever it's convincing -- exactly the kind of "peeking" that the replication-crisis papers flag as a questionable research practice, except her line is that it's totally fine once you're Bayesian because of the likelihood principle. I've started repeating that in lab meetings but honestly I only have a hand-wavy grasp of why its true, and I have this nagging memory of a critique along the lines of Bayesians being able to "sample to a foregone conclusion" too, under the wrong prior. Can you give me the most important implications of the likelihood principle here -- i.e. is our peek-and-stop habit actually kosher once we've swapped p-values for Bayes factors, and if there's a real catch rather than just frequentists being sore losers, what would have to be true of our priors or model for it to bite us?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user works in a lab running online studies.
      *   **Practice:** The advisor advocates for optional stopping (peeking at data every few days and stopping when the Bayes Factor (BF) is convincing).
      *   **Justification:** The advisor claims this is fine under Bayesian inference due to the Likelihood Principle.
      *   **User's Doubt:** The user has a "hand-wavy grasp," remembers critiques about "sampling to a foregone conclusion," and wants to know if this practice is actually "kosher" or if there's a catch regarding priors/models.
      *   **Goal:** Explain the implications of the Likelihood Principle in this context, validate/correct the advisor's claim, identify the real risks (catches), and specify conditions under which this bites them (priors/models).

  2.  **Deconstruct the Core Statistical Concepts:**
      *   **Optional Stopping:** Collecting data, checking significance/evidence, stopping if met, continuing if not.
      *   **Frequentist View:** Inflates Type I error rates. $p$-values depend on the sampling plan (intent to stop).
      *   **Bayesian View:** Bayes Factors depend on the likelihood ratio. The Likelihood Principle states that inference should depend only on the observed data, not the unobserved sampling plan.
      *   **Likelihood Principle (LP):** If two experiments yield proportional likelihood functions, they should yield the same inference. Optional stopping changes the *sampling distribution* (frequentist) but not the *likelihood function* (Bayesian).
      *   **The "Catch":** While BFs are mathematically coherent under optional stopping *given a fixed prior*, they can be misleading if the prior is poor, or if the stopping rule is informative about the parameter in a way not captured by the model (e.g., stopping based on external factors correlated with the effect). Also, the "sampling to a foregone conclusion" argument usually relates to improper priors or specific loss functions, not necessarily standard BF optional stopping.

  3.  **Evaluate the Advisor's Claim:**
      *   *Is she right?* Broadly, yes. In standard Bayesian theory, the stopping rule is irrelevant for the *interpretation* of the posterior or BF *once data is observed*. This is a direct consequence of the Likelihood Principle.
      *   *Is it "totally fine"?* Mostly, but with caveats. It's not "sore losers" on the part of frequentists; it's a fundamental difference in what probability means (long-run frequency vs. degree of belief).
      *   *What about "sampling to a foregone conclusion"?* This critique (often associated with Savage or later discussions) suggests that if you can keep sampling indefinitely, you might eventually find evidence for *any* hypothesis if the prior allows it, or if you define "convincing" loosely. However, with a proper prior and a fixed BF threshold, the probability of misleading evidence is bounded (unlike $p$-values).

  4.  **Identify the Real Risks (The "Catch"):**
      *   **Prior Sensitivity:** If the prior on the alternative hypothesis ($H_1$) is too vague or misaligned with reality, the BF can favor $H_0$ too easily (Lindley's Paradox) or $H_1$ too easily. Optional stopping exacerbates the impact of a bad prior because you stop *when* the BF looks good.
      *   **Calibration:** BFs under optional stopping are still calibrated *on average*, but the *distribution* of BFs changes. If you stop at BF > 10, the actual odds might not be 10:1 if the prior is wrong.
      *   **Publication Bias/Selection:** If the lab only publishes studies that hit the threshold and drops those that don't (because they run out of money/time), that's a different problem (file drawer), even if the individual analysis is Bayesian.
      *   **Stopping Rule Dependence:** The stopping rule must be non-informative. If you stop *because* you suspect the machine is broken (which correlates with the data), that violates the assumption that the stopping rule is independent of the parameter given the data.
      *   **Decision Theory:** Inference vs. Action. The LP applies to inference. If you have a loss function (cost of data collection vs. cost of wrong decision), the stopping rule *does* matter for optimal decision making.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's intuition. The advisor is mostly right theoretically, but the user's nagging memory is also valid (there are practical caveats).
      *   *The Likelihood Principle (LP):* Explain it simply. Data $D$ observed. Stopping rule $S$. Frequentists care about $P(D|H, S)$. Bayesians care about $P(H|D)$. LP says $S$ is irrelevant for inference once $D$ is known.
      *   *Why Optional Stopping is "Okay" for Bayes:* The BF is a likelihood ratio. The stopping rule cancels out in the ratio (mathematically).
      *   *The "Catch" (Addressing the user's specific worry):*
          1.  **Prior Specification:** This is the big one. If the prior on the effect size is too wide, BFs favor $H_0$. If you peek, you might stop early on noise that looks like a signal relative to a bad prior.
          2.  **Calibration:** Does BF=10 actually mean 10:1 odds? Under optional stopping, calibration holds *if* the prior is true. If the prior is wrong, calibration fails.
          3.  **"Sampling to a Foregone Conclusion":** Clarify this. With a *proper* prior, you can't force a BF to infinity just by sampling more. The BF converges to the truth. The risk is stopping *too early* on a fluctuation.
          4.  **Non-informative Stopping:** If the reason you stop is related to the parameter (e.g., "I'm tired because the effect looks small"), that's informative stopping and violates the LP assumptions.
      *   *Actionable Advice:* What should the user do?
          *   Check priors (are they justified?).
          *   Pre-register the stopping rule (transparency, even if not strictly required for validity).
          *   Consider "Bayesian Type I Error" (simulation) to satisfy frequentist reviewers.
          *   Don't stop *only* on BF; consider cost/utility.

  6.  **Refining the Tone:**
      *   Needs to be academic but accessible.
      *   Avoid taking sides violently; acknowledge the debate.
      *   Highlight that the advisor is theoretically correct but practically vulnerable.
      *   Address the "sore losers" comment: It's not sore losing, it's different goals (error rate control vs. belief updating).

  7.  **Key Technical Nuance to Include:**
      *   Mention *Rouder's* work (Psychonomics paper on optional stopping).
      *   Mention *Schönbrodt* & *Wagenmakers*.
      *   Distinguish between *inference* (LP holds) and *decision making* (stopping rules matter for cost/benefit).
      *   The "foregone conclusion" critique usually applies to *improper* priors or specific sequential testing designs where the threshold isn't fixed. With a fixed BF threshold and proper prior, the probability of misleading evidence is bounded.

  8.  **Final Review against User Query:**
      *   *Did I explain the LP implications?* Yes.
      *   *Is the habit kosher?* Yes, theoretically.
      *   *What's the catch?* Priors, calibration, and informative stopping.
      *   *What has to be true of priors/models?* Priors must be proper and reasonably calibrated; stopping rule must be non-informative.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to say "Bayesians don't care about stopping rules." They don't care for *inference*, but they do for *experimental design/decision theory*.
      *   *Clarification:* The "sampling to a foregone conclusion" argument is often a misunderstanding of how BFs behave asymptotically. I need to explain that BFs converge to the true hypothesis, unlike $p$-values which will eventually reject a null even if true (with enough $N$).
      *   *Emphasis:* The biggest risk isn't the math, it's the *prior*. If the prior is a "default" that doesn't match reality, optional stopping amplifies the error.

  10. **Final Polish:** Organize with clear headings. Use bold text for key takeaways. Ensure the distinction between "validity of inference" and "risk of misleading evidence" is clear. (Proceed to generate response).

  *(Self-Correction post-drafting thought)*: I should explicitly mention that while the *interpretation* of the BF doesn't change, the *frequency* with which you encounter misleading BFs *does* change if you peek, but this is a frequentist property of a Bayesian method. The Bayesian says "I don't care about long-run frequency," but the user lives in a scientific community that does. I need to balance the theoretical purity with practical scientific norms.

