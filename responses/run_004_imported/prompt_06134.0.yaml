  **What They Are Jointly Missing:**

  Dana and Robert both treat the jury system primarily as an *epistemic engine* designed to maximize the probability of a "correct" verdict. They miss the normative, rights-based function of jury design. Criminal trials are not solely about truth-tracking; they are about managing the asymmetry of error costs (Blackstone's Ratio: it is worse to convict an innocent person than to acquit a guilty one). The unanimity rule is often defended not because it maximizes overall accuracy (CJT suggests majority rule is often more efficient), but because it imposes a higher burden of proof to protect the defendant's liberty. Additionally, they treat the "correct verdict" as an objective truth waiting to be found, ignoring that legal verdicts are procedural constructs where the legitimacy of the process matters as much as the outcome.

