prompt: |-
  I'm developing a unit on practical reason for my seminar this term, and a real dispute within my own family has been nagging at me as a possible case study, so I'd like your take on it before I decide whether to use it in class. My brother-in-law, Tom, agreed two years ago—back when he and his business partner, Ray, were still on excellent terms—to co-sign a substantial bank loan that allowed Ray to expand his restaurant. Tom and Ray have since had a serious falling-out over an unrelated matter and have not spoken in over a year; Tom insists that whatever loyalty or affection he once felt toward Ray has simply drained away, entirely and, as far as he can tell, permanently. The loan is now up for renewal, and under the terms of their original arrangement, Ray is asking Tom to co-sign again.

  My sister thinks the answer is obvious: Tom gave his word, Ray restructured his finances in reliance on it, and reneging now could ruin Ray financially. Tom doesn't dispute any of that, but maintains that these would be excellent reasons for someone who still cared, even a little, about Ray or about his own reputation for keeping commitments—and since he cares about neither anymore, and no amount of reflection brings any of that feeling back, he can't see what reason, as opposed to what other people would prefer, he actually has to sign.

  Since I'm the resident philosopher in the family, my sister has asked me to settle who's right, and I confess I don't have a ready answer—I keep suspecting the disagreement runs deeper than the usual story about why promises bind. Does Tom's total loss of concern really dissolve whatever reason the original promise generated, leaving at most an obligation other people can hold him to but not one he himself has? Or does my sister have the better view, on which the reason to honor the agreement survives regardless of what Tom currently feels? I'd appreciate it if you could work out the strongest version of each side before landing on a verdict—I'd like to be able to give my sister something more considered than "reasonable people disagree."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a philosophy professor developing a unit on *practical reason*.
      *   **Case Study:** A family dispute involving Tom (brother-in-law), Ray (business partner/ex-friend), and the user's sister.
      *   **The Conflict:** Tom co-signed a loan for Ray 2 years ago. They had a falling out. Tom no longer cares about Ray or his reputation. The loan needs renewal. Ray asks Tom to co-sign again.
      *   **The Sister's View:** Tom gave his word; Ray relied on it; reneging ruins Ray. Therefore, Tom has a reason/obligation to sign.
      *   **Tom's View:** Reasons depend on caring (desires/concerns). He doesn't care about Ray or reputation anymore. Therefore, he has no *internal* reason to sign, only external pressure.
      *   **The Task:** Work out the strongest version of each side (Internalism vs. Externalism about reasons, Promise-Keeping) and land on a verdict (or at least a robust philosophical conclusion) suitable for a seminar case study.
      *   **Tone:** Philosophical, nuanced, analytical, but accessible enough for a family discussion (though intended for a seminar).

  2.  **Identify the Core Philosophical Issues:**
      *   **Internalism vs. Externalism about Reasons:** This is the heart of Tom's argument. Internalism (Williams-esque) says reasons must link to the agent's subjective motivational set. Externalism says reasons exist independently of desires.
      *   **The Nature of Promissory Obligation:** Does a promise create a reason that persists despite changed attitudes? (Scanlon, Rawls, Shiffrin).
      *   **Reliance and Harm:** The sister's argument leans towards consequentialism or reliance-based views (Scanlon's Principle F).
      *   **Identity and Continuity:** Is the Tom who made the promise the same as the Tom now? (Parfit-esque concerns, though maybe less central).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the richness of the case. It's perfect for a seminar on practical reason. Validate the sister's request but frame it philosophically.

      *   **Tom's Position (The Internalist Challenge):**
          *   *Core Thesis:* Reasons must be grounded in the agent's "subjective motivational set" (Bernard Williams).
          *   *Argument:* If Tom has no desire to help Ray, no fear of reputational damage, and no intrinsic love of promise-keeping, there is no "bridge" from the fact of the promise to a motivation to act.
          *   *Nuance:* It's not just selfishness; it's a claim about the *structure* of rationality. "Ought implies Can" (psychologically). If he can't find the motive, the "ought" is empty.
          *   *Strength:* It respects agency. It avoids mystifying "obligations" as external forces.

      *   **The Sister's Position (The Externalist/Reliance View):**
          *   *Core Thesis:* Reasons can exist independently of current desires. Promises create normative facts.
          *   *Argument 1 (Reliance):* Ray acted on the expectation. To withdraw now is to harm him in a specific way (manipulating his expectations). This is wrong regardless of Tom's feelings (Scanlon).
          *   *Argument 2 (Normative Powers):* By promising, Tom changed the normative landscape. He gave Ray a right to his performance. That right doesn't vanish because Tom's feelings changed.
          *   *Argument 3 (Identity/Integrity):* The "Tom" who matters is the extended self over time. Disavowing past commitments is a fracture of integrity.
          *   *Strength:* It preserves the social practice of promising. Without this, promises are worthless.

      *   **The Deep Disagreement (Meta-Ethical Level):**
          *   Highlight that this isn't just about loans; it's about *what a reason is*.
          *   Internalism: Reasons are psychological states.
          *   Externalism: Reasons are objective normative relations.

      *   **The Verdict/Analysis for the Seminar:**
          *   *Critique of Tom:* His view makes promising impossible. If feelings change, the promise dissolves. This undermines the very concept of a promise (which is a guarantee *against* changing feelings).
          *   *Critique of Sister:* She needs to explain *why* the reason binds if Tom is truly indifferent. Is it moral realism? Social contract?
          *   *Synthesis:* The strongest view is likely a version of Externalism grounded in the *value of the practice* or *relational obligations*. Tom's loss of concern is irrelevant to the *existence* of the reason, though relevant to the *difficulty* of acting on it.
          *   *Specific Philosophical Hook:* T.M. Scanlon's *What We Owe to Each Other*. Principle F (Expectations). Or Seana Shiffrin on the distinctiveness of promises.
          *   *Decision:* The sister is philosophically stronger *if* we value the institution of promising. Tom's view is logically consistent but socially/practically self-defeating.

      *   **Pedagogical Advice:** How to use this in class?
          *   Don't just solve it. Use it to illustrate Williams vs. Kant/Scanlon.
          *   Ask students: "If Tom is right, can anyone ever promise?"

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* I need to be careful not to just say "Tom is wrong." Tom's view (Internalism) is a respected philosophical position. I need to present it charitably.
      *   *Correction:* Make sure to distinguish between "Tom has no reason" and "Tom has no motivation." Internalists conflate them; Externalists separate them.
      *   *Nuance:* The loan is for *renewal*. This is a *new* act, not just fulfilling the old one. This complicates things. Is it a new promise? Or an extension of the old reliance? I should address this. The sister argues reliance based on the *original* arrangement implying continuity. Tom argues it's a new decision point.
      *   *Refinement:* The original agreement likely implied a term (e.g., 5 years) or renewal conditions. If the original promise covered the *duration* of the loan including renewals necessary to sustain the business plan Ray relied on, the obligation holds. If it was a year-to-year co-sign, Tom has more leverage. I will assume for the sake of the philosophical argument that the reliance is ongoing based on the initial commitment.

  5.  **Final Polish:**
      *   Ensure the tone is appropriate for a colleague (philosophy professor).
      *   Check that the distinction between *obligation* and *reason* is clear.
      *   Make sure the "Verdict" offers a actionable conclusion for the sister while remaining philosophically rigorous.

  6.  **Final Output Structure:**
