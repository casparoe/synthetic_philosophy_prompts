answer: |-
  This is an exceptional case study. It isolates the tension between **Internalism** and **Externalism** about reasons with a clarity that textbook examples often lack. It also touches on the specific normative mechanics of promising (reliance vs. obligation).

  For your seminar, this scenario is gold because it forces students to move beyond "promises are good" to "what kind of *reason* does a promise provide?"

  Here is an analysis of the strongest version of each position, followed by a verdict you can offer your sister (and your students).

  ---

  ### I. Tom's Position: The Internalist Challenge
  **Philosophical Anchor:** Bernard Williams, *Internal and External Reasons*.

  Tom is articulating a classic **Reasons Internalism** view. His argument is not merely that he *won't* sign, but that he *cannot* have a reason to sign.

  1.  **The Subjective Motivational Set:** For Tom, a "reason" must be capable of motivating him. According to Williams, for an agent to have a reason to $\phi$, there must be a sound deliberative route from their current "subjective motivational set" (desires, projects, commitments) to $\phi$-ing.
  2.  **The Evaporation of Grounds:** Tom's original motivation included loyalty to Ray and concern for his reputation. Both are gone. If Tom does not value "promise-keeping" as an abstract principle (and he claims he doesn't), there is no element in his current psychological makeup that links to signing the paper.
  3.  **The Critique of "Obligation":** Tom suspects that when your sister speaks of "obligation," she is describing a social pressure, not a genuine reason *for him*. He views the claim "you have a reason to sign" as false if it implies a reason that exists independently of his cares. To him, an external reason is a "mystification"—it treats morality like a physical force rather than a feature of agency.
  4.  **The Renewal Nuance:** Tom can argue this is a *new* act (renewal), not merely the tail end of the old one. Since the context has changed (the friendship is dead), the original motivational set no longer applies to this new decision point.

  **Strength:** This view respects Tom's agency. It refuses to treat him as a vessel for moral laws he no longer endorses. It highlights the absurdity of demanding emotional engagement where none exists.

  ### II. The Sister's Position: The Externalist/Reliance View
  **Philosophical Anchors:** T.M. Scanlon (*What We Owe to Each Other*), Seana Shiffrin, or a Kantian Contractualist.

  Your sister is arguing for **Reasons Externalism** combined with a **Reliance-Based** or **Normative Power** view of promising.

  1.  **Reasons Independent of Desire:** On this view, facts about the world (e.g., "I invited this expectation," "This person will be harmed by my withdrawal") constitute reasons regardless of my current desires. The reason exists in the *relationship*, not in Tom's head.
  2.  **The Principle of Fidelity (Scanlon):** Scanlon argues that if you intentionally lead someone to expect you will do $X$, and they rely on that, you cannot fail to do $X$ without justifying it to them. Ray relied on the *stability* of the loan, not the stability of Tom's affection. Tom cannot unilaterally withdraw the expectation he created.
  3.  **Normative Powers:** By promising, Tom exercised a "normative power." He changed the moral landscape. He gave Ray a *right* to his support for the duration of the venture. Tom's change of heart does not revoke Ray's right. To think otherwise is to treat the promise as a prediction of behavior ("I predict I will help you") rather than an obligation ("I bind myself to help you").
  4.  **Integrity Over Time:** The sister's view implies a conception of the self that extends over time. The "Tom" who matters is not just the Tom of this instant, but the Tom who exists across the timeline of the loan. Disavowing the past commitment is a fracture of integrity, which is itself a reason for action.

  **Strength:** This view preserves the very concept of a promise. If promises dissolved whenever feelings cooled, the institution of promising would be useless. It protects the vulnerable party (Ray) who acted in reliance.

  ---

  ### III. The Deep Disagreement
  The dispute isn't about the loan; it's about the **source of normativity**.

  *   **Tom asks:** "What in *me* drives this?" (Psychological/Internal)
  *   **Sister asks:** "What is *owed*?" (Normative/External)

  Tom is effectively arguing that morality is **hypothetical** (if you care about X, do Y). Your sister is arguing morality is **categorical** (do Y, regardless of X).

  ### IV. The Verdict

  For the purpose of your seminar—and for your sister—I recommend landing on the **Sister's side**, but with a specific philosophical justification that addresses Tom's internalist worry.

  **The Verdict:** Tom is wrong about the nature of reasons, and therefore wrong about the obligation.

  **The Argument:**
  1.  **The Function of Promises:** The entire point of a promise is to provide assurance *against* the fluctuation of feelings. If a promise only bound you as long as you felt like keeping it, it would be merely a statement of current intent, not a promise. By invoking the practice of promising, Tom opted into a system where reasons are generated by the act of commitment, not the state of his emotions.
  2.  **The "Reason" Exists Even if Unfelt:** Tom claims he has no reason. But consider: If Tom refused to sign, and Ray went bankrupt, would Tom be *blameworthy*? If yes, then a reason existed. We generally only blame people for ignoring reasons they had. If Tom truly had no reason, his refusal would be morally neutral (like refusing to buy Ray a coffee). The fact that we perceive blameworthiness indicates the reason exists externally to his motivational set.
  3.  **The Internalist Rebuttal:** A sophisticated Internalist might say Tom *does* have a motive: he likely cares about seeing himself as a person of integrity, or he wishes to avoid the guilt of ruining Ray. If Tom says, "I genuinely do not care about guilt or integrity," he is claiming to be outside the moral community. While logically possible, this is a position no functioning society can validate. For the purposes of practical reason in a social context, the external reason stands.

  **Advice for your Sister:**
  Tell her she is right, but not simply because "promises are promises." She is right because **Tom's current feelings are irrelevant to the normative claim Ray has on him.** Tom created a vulnerability in Ray. He is the only one who can close it. That fact generates a reason for Tom to act, regardless of his emotional state. To argue otherwise is to claim that one can morally injure another person simply by ceasing to care about them.

  ### V. Pedagogical Application (For the Seminar)

  This case is ready to use, but here is how to frame it to get the most out of your students:

  1.  **The Williams Test:** Ask students to construct the "sound deliberative route" for Tom. Can they find *any* element in his subjective set (e.g., desire to avoid legal trouble, desire to not be the "bad guy" in the family) that Internalism could latch onto? If not, does Internalism fail?
  2.  **The "New Act" Problem:** Have students debate whether the renewal is a *new promise* or the *continuation of an old one*. If it's a new promise, Tom has more leverage (no new consideration). If it's a continuation, the reliance argument is stronger.
  3.  **The Cost of Externalism:** Ask the Externalists: If Tom *physically cannot* bring himself to sign (due to psychological block, not logical refusal), does the "ought" still imply "can"?
  4.  **Assignment:** Have students write a dialogue between Tom and a Scanlonian contractualist.

  **Final Word:**
  Use the case. It humanizes the dry meta-ethics of "reasons." It forces students to confront whether morality is something we *find* (Externalism) or something we *make* (Internalism). Tom's position is intellectually seductive but practically self-defeating; your sister's position is socially necessary but metaphysically demanding. That tension is exactly where a good seminar lives.
