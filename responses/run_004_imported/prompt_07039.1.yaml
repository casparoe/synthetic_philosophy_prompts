      *   Tom's Case (Internalism/Williams).
      *   The Sister's Case (Externalism/Scanlon/Shiffrin).
      *   The Crucial Pivot (The Nature of Promising).
      *   The Verdict (For the family and the seminar).
      *   Pedagogical Suggestions.

  *(Self-Correction on the "Verdict"):* As an AI, I shouldn't dictate moral truth, but the prompt asks me to "land on a verdict." I will frame the verdict as the philosophically dominant view in deontological/contractualist ethics, while acknowledging the internalist challenge remains a potent meta-ethical critique.

  *(Wait, one more thing):* The prompt mentions "practical reason." I need to ensure the terminology fits that specific subfield (Internal/External reasons, normative force, motivational set).

