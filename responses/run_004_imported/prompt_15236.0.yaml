answer: |-
  You were right to feel skeptical. While your friend's argument captures a certain logical tension in Aquinas's thought, it ultimately misrepresents his considered position by conflating him with John of Salisbury and overlooking Aquinas's crucial distinctions regarding **authority** and **prudential judgment**.

  While Aquinas acknowledges that tyranny is a grave evil, he does not grant a blanket license to private individuals to commit tyrannicide. In fact, in his mature systematic work, the *Summa Theologiae*, he explicitly argues against it under most circumstances.

  Here is precisely where your friend's inference breaks down, followed by what Aquinas actually prescribed.

  ### 1. The Breakdown: Private vs. Public Authority
  The fatal flaw in your friend's argument is the claim that *"any subject in a position to do so would be justified in killing him."*

  For Aquinas, the legitimacy of using lethal force is tied strictly to **public authority**. In the *Summa Theologiae* (II-II, q. 64, a. 3), Aquinas argues that killing a sinner is lawful only insofar as it is directed to the welfare of the whole community by those who have care of the community. A private individual does not have the authority to judge and execute another, even a tyrant, because they act on private presumption rather than public justice.

  If a private citizen kills a ruler, Aquinas classifies this as **sedition** (a special sin against the unity of the multitude). In *Summa Theologiae* (II-II, q. 42, a. 2), he addresses whether it is seditious to overthrow a tyrant. His answer is nuanced:
  *   If the tyranny is so excessive that it disrupts the common good more than the disturbance caused by removing the tyrant, removal is not sedition.
  *   However, he immediately adds that this removal must be undertaken by **public authority**, not private presumption.

  Your friend's logic jumps from "the tyrant loses legitimacy" to "anyone can kill him." Aquinas stops at "the tyrant loses legitimacy," but insists that the *remedy* must still come through a legitimate channel (e.g., a superior authority, an electoral body, or the community acting as a corporate whole), not a lone assassin.

  ### 2. The Textual Nuance: *De Regimine Principum*
  Your friend cited *De Regimine Principum* (On Kingship), specifically Book I, Chapter 6. It is true that here Aquinas writes:
  > "To kill a tyrant... is not to be accounted sedition... Indeed, he who kills a tyrant to liberate his country is praised and rewarded."

  However, your friend omits the immediate context and caveats Aquinas attaches to this statement:
  1.  **Prudential Calculation:** Aquinas immediately warns that killing a tyrant often leads to greater evils. The successor may be worse, or the assassination may trigger a civil war that harms the common good more than the tyranny itself. He writes, "Many tyrants have been more cruel after they began to be suspected... than they were before."
  2.  **No Human Recourse:** Aquinas suggests this is a last resort when there is no superior authority to appeal to.
  3.  **Authorship Caveat:** Scholars note that while Book I is generally accepted as Aquinas's, Book II (where the discussion of political mechanisms becomes more detailed) was completed by his student Ptolemy of Lucca, who was more republican and more favorable to tyrannicide than Aquinas. Your friend may be unconsciously blending Ptolemy's more aggressive stance with Aquinas's cautious one.

  ### 3. Distinction: Tyrant by Title vs. Tyrant by Exercise
  Aquinas distinguishes between two types of tyrants, and the remedy differs for each:
  *   **Tyrant by Title (Usurper):** Someone who seizes power without any legal right. Aquinas is more permissive here. Since they never had legitimate authority, they are essentially an aggressor. In *Commentary on the Sentences*, he suggests such a person can be resisted by anyone, as they are not a true ruler.
  *   **Tyrant by Exercise:** Someone who was legitimately installed but rules badly. This is the scenario your friend described. Aquinas is much stricter here. Because the ruler holds a legitimate office, removing them disrupts the divine and social order. Private individuals cannot depose a legitimately installed ruler, even if he rules badly.

  ### 4. What Aquinas Prescribed Instead
  If private tyrannicide is off the table, what did Aquinas think subjects should do? He outlines a hierarchy of remedies in *De Regimine Principum* (I.6) and the *Summa*:

  1.  **Public Mechanism:** If the community has the right to elect the ruler, they can depose him or restrict his power through constitutional means. The authority to remove lies with the body that granted the authority to rule.
  2.  **Appeal to a Superior:** If there is a higher authority (e.g., an Emperor over a King, or the Pope over a Christian Prince), the subjects should appeal to that superior to judge and depose the tyrant.
  3.  **Spiritual Remedies:** If no human recourse exists, Aquinas advises turning to God. He cites the example of the Israelites crying out to God against Pharaoh. He suggests that collective prayer and penance might move God to soften the tyrant's heart or remove him.
  4.  **Passive Resistance:** In extreme cases, subjects are not bound to obey commands that contravene divine law or the fundamental common good, but they must endure the suffering of the tyranny rather than unleash the chaos of assassination.

  ### 5. Aquinas vs. John of Salisbury
  Your friend's equation of Aquinas with John of Salisbury is historically inaccurate.
  *   **John of Salisbury (*Policraticus*, 1159):** Explicitly argues that killing a tyrant is not only lawful but a **religious duty**. He views the tyrant as a "public enemy" whom any private citizen may strike down, likening the tyrannicide to a priestly sacrifice.
  *   **Thomas Aquinas (*Summa*, 1270s):** Views the tyrant as a **disorder** to be corrected by order. He prioritizes the stability of the regime and the avoidance of scandal. For Aquinas, the sin of sedition (disrupting the unity of the people) is a mortal sin, and he fears that legitimizing private violence undermines the very concept of law.

  ### Summary for Your Next Dinner
  You can tell your friend that while Aquinas agrees that a tyrant forfeits the *moral claim* to obedience, he does not forfeit the *legal protection* of his office against private violence.

  The inference breaks down because Aquinas separates the **end** (the common good) from the **means** (legitimate authority). Using illegitimate means (private assassination) to achieve a good end (removing a tyrant) is, for Aquinas, morally impermissible because it damages the common good of peace and order. Aquinas is not a theorist of revolution; he is a theorist of order who reluctantly admits that sometimes order must be restored, but only by those with the public authority to do so.

  **Verdict:** Your friend is channeling John of Salisbury, not Thomas Aquinas. You win the argument.
