      *   *Draft 3 (Polished & Empathetic):* Start by validating. "You have a very good instinct for logic." Explain the specific error: "Begging the Question." Explain the difference between *subjective certainty* and *objective evidence." Use the "Unfalsifiable" concept. Give an analogy. Conclude with why this matters (critical thinking).

