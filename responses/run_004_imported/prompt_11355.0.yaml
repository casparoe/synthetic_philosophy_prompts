prompt: |-
  ok this has been bugging me for like a week. theres a girl in my grade whos 100% positive her best friend would never cheat on a test, she says she just knows him and hes not that type of person. so when our teacher showed everyone a video that kinda looked like he was checking someone elses answers during the test, she said the video doesnt actually prove anything, because she already knows for a fact hes innocent, and if hes really innocent then whatever the video seems to show has to be misleading somehow. i mean i guess technically she's right that if she already knows he's innocent, any real evidence against that would have to be misleading? but that feels like it could be used to justify never believing evidence about literally anything as long as you're confident enough going in. is she actually being logical here or is there something wrong with this reasoning that i just can't put my finger on?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Scenario:** A girl believes her best friend is innocent of cheating. A video suggests he *was* cheating. She dismisses the video because she *knows* he's innocent. Her logic: "If he's innocent, the video must be misleading."
      *   **User's Intuition:** The user feels something is off. They recognize that this logic could justify ignoring *any* evidence if one is confident enough.
      *   **Core Question:** Is she being logical, or is there a flaw in this reasoning?
      *   **Goal:** Explain the logical flaw clearly, validate the user's intuition, and provide the philosophical/logical terms for this error.

  2.  **Identify the Logical Flaw:**
      *   The girl is treating her *belief* as *fact*.
      *   She is using her conclusion (he is innocent) to dismiss the premise/evidence (the video) that challenges that conclusion.
      *   This is circular reasoning.
      *   It's also a form of confirmation bias or belief perseverance.
      *   Specifically, it looks like "Begging the Question" (assuming the truth of the conclusion in the premises) or "Immunizing a belief against falsification."

  3.  **Deconstruct the Reasoning:**
      *   *Her Premise:* He is innocent (based on "knowing him").
      *   *The Evidence:* Video looks like cheating.
      *   *Her Conclusion:* The video is misleading.
      *   *The Problem:* How does she know he is innocent *independently* of the video? She doesn't. She's using her prior belief to override new empirical evidence without an alternative explanation for the evidence.

  4.  **Formulate the Explanation:**
      *   **Validate the User:** Start by confirming their gut feeling. Yes, something is wrong.
      *   **Name the Fallacy:** Identify it as "Circular Reasoning" or "Begging the Question." Also mention "Confirmation Bias."
      *   **Explain *Why* it's Flawed:**
          *   Evidence should update beliefs, not the other way around.
          *   "Knowing" someone isn't objective proof.
          *   If you dismiss all counter-evidence by saying "it must be wrong because I'm right," you can never be wrong. That makes the belief unfalsifiable.
      *   **Use an Analogy:** Create a relatable scenario to illustrate the absurdity. (e.g., a crime scene, a broken vase, aliens).
      *   **Distinguish between "Logical Validity" and "Soundness":** Technically, *if* the premise (he is innocent) is true, the conclusion (video is misleading) follows. But the premise isn't established as fact. It's an assumption.
      *   **Bayesian Perspective (Optional but helpful):** Mention how rational belief updating works. Prior belief + New Evidence = Updated Belief. She is ignoring the New Evidence entirely.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Draft 1 (Mental):* You're right. She's wrong. It's circular. She says he didn't do it, so the video is fake. But the video is why we think he did it. She's ignoring proof. It's like saying I didn't eat the cookie because I don't eat cookies, even if there's chocolate on my face.

