answer: |-
  Your intuition is spot on. You have identified a very real logical problem, even if you couldn't quite name it.

  She is **not** being logical. She is engaging in a specific type of flawed reasoning that logicians and philosophers have names for.

  Here is the breakdown of why her reasoning fails, why it feels convincing to her, and why your gut feeling is correct.

  ### 1. The Core Flaw: Circular Reasoning
  Her argument looks like this:
  *   **Premise:** I know for a fact he is innocent.
  *   **Evidence:** The video looks like he is cheating.
  *   **Conclusion:** Therefore, the video must be misleading.

  The problem is that her **Premise** ("I know for a fact he is innocent") is not actually a fact; it is a belief. She is using her *conclusion* (he is innocent) to dismiss the *evidence* (the video) that challenges that conclusion.

  In logic, this is often called **"Begging the Question"** (or *petitio principii*). She is assuming the truth of what she is trying to prove. She is essentially saying, *"He didn't do it because I know he didn't do it."*

  ### 2. The "Unfalsifiable" Trap
  You hit the nail on the head when you said: *"that feels like it could be used to justify never believing evidence about literally anything."*

  In philosophy and science, this is called making a belief **unfalsifiable**.
  *   A rational belief is one that *could* be proven wrong if the evidence was strong enough. (e.g., "It is raining." If I look outside and see sun, I must change my belief.)
  *   An unfalsifiable belief is one where no amount of evidence can change your mind. (e.g., "Invisible dragons control the weather." If you say "I don't see them," she says "They're invisible.")

  By deciding in advance that *any* evidence against him "must be misleading," she has removed the possibility of ever being wrong. If you can't be wrong, your belief isn't based on logic; it's based on faith.

  ### 3. Subjective Certainty vs. Objective Evidence
  The girl is confusing **subjective certainty** with **objective truth**.
  *   **Subjective:** "I know him, he's a good guy." (This is a feeling/internal state).
  *   **Objective:** "The video shows his eyes moving to another paper." (This is external data).

  She is prioritizing her internal feeling over external data. While loyalty is a good social trait, it is a terrible tool for determining factual truth. If we used her logic in a court of law, no one could ever be convicted if their mother testified, "I know my son, he wouldn't do it," regardless of DNA evidence.

  ### 4. An Analogy to Test the Logic
  To see why this is flawed, apply her logic to a different situation:

  > **Scenario:** You are accused of stealing a cookie.
  > **Evidence:** There is chocolate on your face.
  > **Your Defense:** "I would never steal a cookie. I am not that type of person. Therefore, the chocolate on my face must be misleading (maybe it's mud that looks like chocolate)."

  Does that sound logical? No. The evidence (chocolate) should make you question your assumption (that you don't have chocolate on your face), not the other way around.

  ### 5. Why It Feels Logical to Her
  She isn't trying to be deceptive; she is experiencing **Confirmation Bias** and **Motivated Reasoning**.
  *   **Confirmation Bias:** She only accepts information that confirms what she already believes.
  *   **Motivated Reasoning:** She *wants* him to be innocent (because he's her friend), so her brain works backward to find a reason to dismiss the threat to that belief.

  To her, it feels logical because her belief in his character is so strong that it *feels* like evidence. But in critical thinking, a "feeling" is not evidence.

  ### Summary
  You are right to be bugged by this. She is using a **"Get Out of Jail Free" card for logic.**

  If everyone reasoned this way, we could never learn anything new. Whenever we saw something that challenged our worldview, we would just say, "Well, I already know I'm right, so this new information must be fake."

  **The logical approach would be:**
  "I know him well and I'm surprised by the video. However, the video is new evidence. I need to look closer to see if there is an innocent explanation for what is on the screen, rather than just assuming the screen is lying because I believe he's good."

  She skipped the "look closer" part and went straight to "the video is lying." That is where the logic breaks.
