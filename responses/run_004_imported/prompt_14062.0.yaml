answer: |-
  This is a fantastic transcript of a real-world application of the peer disagreement literature. Honestly, for a dinner conversation, Maya and Josh are batting well above average; they've intuitively reconstructed the dialectic between Elga/Christensen (Conciliationism) and Kelly/Plantinga (Steadfastness/Self-Defeat) without needing to look at their notes.

  Here is a breakdown of who has the better of it at each step, followed by a deeper dive into Move (5) and the "standard answer" they are circling but haven't quite named.

  ### Step-by-Step Evaluation

  **Move (1): Maya's Opening (The Bill)**
  *   **Verdict:** **Maya wins.**
  *   **Analysis:** In cases of simple arithmetic where two agents have roughly equal competence and no independent evidence of error, the Equal Weight View (EWV) has strong intuitive pull. If Maya and Josh are truly peers regarding mental math, and they disagree, standard conciliationism (Elga 2007) says they should split the difference. To stick to her guns here would require her to assert a "brute fact" about her own reliability that she cannot access from the inside. Maya is applying the view correctly to its strongest case (simple, verifiable propositions).

  **Move (2): Josh's Counter (The Fantasy Football Friend)**
  *   **Verdict:** **Josh scores a rhetorical point, but technically loses.**
  *   **Analysis:** Josh is attempting a *reductio ad absurdum*: if you conciliate with everyone, you conciliate with idiots. However, he is attacking a straw man. Conciliationists (like Christensen) explicitly define "peers" as those you judge to be equally likely to be right *antecedent* to the disagreement. You are not required to conciliate with someone you have independent evidence to believe is unreliable. Josh is conflating "anyone who disagrees" with "epistemic peer."

  **Move (3): Maya's Defense (Defining Peerhood)**
  *   **Verdict:** **Maya wins.**
  *   **Analysis:** Maya correctly identifies the "independent evidence" clause. Peerhood is not determined by the current disagreement (which would be circular) but by track records, general cognitive ability, and access to evidence. Since the Fantasy Football friend relies on "gut feelings" over stats, Maya has independent grounds to downgrade his peer status. Josh does not have those grounds regarding mental math. This is a standard and robust defense in the literature (see Christensen 2007).

  **Move (4): Josh's Turn (The Self-Defeat Objection)**
  *   **Verdict:** **Josh wins (decisively).**
  *   **Analysis:** This is the canonical objection to conciliationism, often associated with Thomas Kelly (2005) and Alvin Plantinga. If conciliationism is true, and there is widespread peer disagreement about the truth of conciliationism (between epistemologists), then a consistent conciliationist must lower their credence in conciliationism. If they lower it enough, they lose the justification for applying it to the bill in Move (1). Josh has successfully turned Maya's weapon against her. This is the hardest problem for the Equal Weight View.

  **Move (5): Maya's "Fixed Point" Response**
  *   **Verdict:** **Draw (Leaning Josh).**
  *   **Analysis:** Maya is attempting to block the regress by categorizing epistemic norms as "framework principles" rather than ordinary propositions. This is a recognized move (similar to Wittgensteinian hinge propositions or Strawsonian presuppositions). However, as she admits, it risks being *ad hoc*. Unless she can explain *why* this specific norm is immune to its own rule without simply asserting it, it looks like special pleading. She has identified a potential solution, but she hasn't justified it yet.

  ---

  ### Deep Dive: Is Move (5) Special Pleading?

  Move (5) is the crux of the matter. Is it legitimate to say, "This rule applies to all beliefs *except* the belief in this rule"?

  **The Case for Legitimacy:**
  There is a strong tradition in epistemology arguing that fundamental epistemic principles cannot be justified by the very evidence they govern without circularity. If you treat epistemic norms like empirical hypotheses, you enter a vicious regress. Some philosophers (like Michael Williams or Crispin Wright) argue that certain principles function as "entitlements" or "hinges"—they are the rules of the game, not moves within the game. If Maya frames her view this way, she isn't exempting herself; she is claiming that *no one* can subject fundamental norms to first-order disagreement norms without collapsing the possibility of reasoning.

  **The Case for Special Pleading:**
  The danger Maya senses is real. If she says, "I conciliate on the bill, but not on the principle telling me to conciliate," she needs a *meta-reason* for the exemption. If the only reason she gives is "because otherwise I'd lose the argument," that is pragmatic, not epistemic. To avoid special pleading, she needs to argue that the *scope* of the conciliation principle is restricted to "contingent, first-order propositions" and does not extend to "constitutive epistemic norms." Without that distinction, Josh is right: she is immunizing her view from criticism.

  **The Verdict on Move (5):**
  It is a **legitimate strategy**, but Maya executed it poorly. She relied on an analogy to logic ("you can use logic to evaluate an argument against logic") without explaining the structural difference between logical laws and normative epistemic principles. Logic is descriptive of validity; conciliationism is normative about belief revision. The analogy helps, but it doesn't seal the deal.

  ---

  ### The "Standard Answer" They Are Missing

  Maya and Josh are stuck in the binary of **Equal Weight (Conciliationism)** vs. **Steadfastness**. There is a third position that dissolves the self-defeat problem and is arguably the dominant view in current literature: **The Total Evidence View.**

  This view is most associated with **Thomas Kelly (2005, 2010)**.

  **The Core Idea:**
  The fact that a peer disagrees with you is *one piece of evidence* to be weighed, but it is not a trump card that forces a 50/50 split. You must weigh the evidence of the disagreement against your **first-order evidence**.

  **How it Solves the Dinner Debate:**
  1.  **On the Bill (Move 1):** If Maya checked her math twice and is confident, the first-order evidence (her calculation) is strong. The fact that Josh disagrees is evidence she might be wrong, but it doesn't automatically swamp her first-order evidence. She can remain somewhat steadfast if her first-order evidence is strong enough.
  2.  **On the Theory (Move 4):** When epistemologists disagree about conciliationism, Maya has first-order evidence for her view (arguments, thought experiments, coherence). The fact that Josh (or other philosophers) disagrees is counter-evidence. She weighs them. She doesn't have to drop her credence to 0.5; she just adjusts it according to the total weight of evidence.
  3.  **Avoiding Self-Defeat:** The Total Evidence View does not claim "always split the difference." It claims "respond rationally to the total evidence, which includes the disagreement." Therefore, it is not self-undermining. It allows Maya to say, "I have considered the disagreement about this theory, weighed it against my arguments for the theory, and concluded the theory is still likely true."

  **Another Missing Concept: Reflective Equilibrium**
  They are also missing the methodological approach of **wide reflective equilibrium** (Rawls/Daniels). In this framework, you don't treat the rule (conciliationism) as a fixed axiom (Maya's Move 5) or a disposable hypothesis. Instead, you go back and forth between your intuitions about specific cases (the bill) and your general principles (conciliationism), adjusting both until they cohere.
  *   If conciliationism makes you doubt conciliationism too much, you tweak the principle (e.g., add a scope restriction) rather than abandoning it or immunizing it dogmatically.

  ### Advice for the Group

  If you want to unstick this debate for the next meeting:

  1.  **Read Thomas Kelly's "The Epistemic Significance of Disagreement" (2005).** It is the direct response to Josh's Move (4). It explains why you don't have to be dogmatic to be steadfast.
  2.  **Discuss "Scope Restrictions."** Instead of Maya's vague "fixed point," look at papers discussing whether disagreement norms apply to "fundamental epistemic principles." (See *Epistemic Norms and the Scope of Disagreement* literature).
  3.  **The "Bootstrapping" Worry.** In Move (3), Maya claimed we can judge peerhood independently. Josh should push back here: How do we judge peerhood without relying on the very reasoning capacities currently in dispute? This leads to the "question-begging" objection against conciliationism (Weatherson 2013).

  **Summary:** Josh won the philosophical exchange on the self-defeat point (Move 4), but Maya was right on the application to the bill (Move 1 & 3). Move 5 was a brave but under-theorized attempt to block the regress. Introducing the **Total Evidence View** will likely resolve the tension they are feeling.
