      *   *Simple Cluelessness:* I don't know if $X$ causes $Y$ or $\neg Y$, but I have no reason to think $Y$ is more likely than $\neg Y$. Symmetry applies. Expected value of unknown effects $\approx 0$. Example: Buying coffee might make the barista happy or sad, no reason to think one over the other in the long run.
      *   *Complex Cluelessness:* I don't know the effects, but I have *reasons* to think they might skew one way, yet I can't quantify it. Example: Saving a life now might lead to overpopulation (bad) or more innovators (good), and I have *some* theoretical reason to lean one way but can't put numbers on it.
      *   *The Defense:* Ordinary actions (like malaria nets) are safe because their long-term effects are "simple." We can ignore them.
      *   *The Attack:* The symmetry required for "simple" cluelessness is fragile. Once you introduce *any* structural knowledge about the world (chaos theory, value drift, trajectory changes), symmetry breaks, turning "simple" into "complex."

  3.  **Brainstorming Arguments Against the Distinction:**
      *   *Argument 1: The Burden of Symmetry.* To claim simple cluelessness, you need positive evidence of symmetry. Ignorance alone doesn't grant symmetry. Principle of Indifference is shaky here.
      *   *Argument 2: The Butterfly Effect/Chaos.* Small actions change *who* exists (non-identity problem). Different people have different values. This isn't random; it's a trajectory shift. Trajectory shifts are inherently directional (complex).
      *   *Argument 3: Value Lock-in/Path Dependence.* The future isn't a random walk. It has momentum. Nudging it now pushes it along a specific path. Even if we don't know the destination, the *push* is directional.
      *   *Argument 4: The "Speculative Story" Threshold.* Greaves says we need a "reason" for complex cluelessness. But in a causally dense world, *any* action changes the timing of events. Changing timing changes outcomes. We know outcomes are value-laden. Therefore, we know the action is value-laden in a specific direction, even if we can't measure it.
      *   *Argument 5: Epistemic Humility vs. Decision Theory.* If we can't quantify the skew, we can't treat it as zero. We have to treat it as "unknown sign and magnitude," which paralyzes expected value calculations just as much as complex cluelessness.

  4.  **Developing the Core Thesis:**
      *   The distinction relies on an epistemic threshold that doesn't exist in reality.
      *   "Simple" cluelessness assumes a background of causal independence or randomness that doesn't hold in a deterministic or chaotic universe.
      *   Therefore, the "cancels out" move is unjustified.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Define the stakes. Greaves wants to save consequentialism from paralysis. I will argue the rescue fails because the lifeboat (simple cluelessness) has a hole in it.
      *   **Point 1: The Principle of Indifference Problem.** Why do we assume symmetry? Ignorance $\neq$ Symmetry. To say effects cancel out, you need a probability distribution centered on zero. We don't have that. We have *no* distribution. Treating "unknown" as "zero mean" is an unjustified mathematical move.
      *   **Point 2: Causal Density and Trajectory Changes.** Every action alters the timing of conception (non-identity). This changes *which* people exist. Different people have different impacts. Is the future population of "Person A's descendants" better or worse than "Person B's descendants"? We don't know. But we know they are *different*. If the future contains existential risk, changing *who* is there changes the probability of survival. This is a directional skew (Complex), not a random noise (Simple).
      *   **Point 3: The "Reason" Threshold is Arbitrary.** Greaves says we need a "reason" to think effects are skewed. But the structure of history provides the reason. History is path-dependent. Therefore, *any* intervention is a path-deviation. Path deviations have non-zero expected value relative to the baseline, but the magnitude is unknowable. That fits the definition of Complex Cluelessness.
      *   **Point 4: The Collapse into Skepticism.** If almost everything is Complex Cluelessness, we can't calculate EV. The distinction was meant to save ordinary morality, but it fails, leaving us with longtermist paralysis for *everything*, not just big interventions.
      *   **Conclusion:** The distinction is a heuristic, not a metaphysical reality. It doesn't solve the normative problem.

