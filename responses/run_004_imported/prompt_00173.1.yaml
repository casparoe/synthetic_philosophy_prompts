answer: |-
  The distinction between simple and complex cluelessness, as articulated by Hilary Greaves, is intended as a firewall. It is designed to protect ordinary consequentialist deliberation from the paralyzing skepticism of longtermism. The promise is that while we might be clueless about the far-future effects of saving a life today, those effects are "simple"—they lack a systematic directional skew—and therefore their expected value cancels out to zero. This allows us to focus on the near-term, quantifiable goods (like malaria prevention) without fear of inadvertently causing existential catastrophe.

  However, this firewall is structurally unsound. The distinction relies on an epistemic threshold that does not exist in the real world. Upon closer inspection, the conditions required for "simple" cluelessness are so stringent that they are rarely, if ever, met by real-world actions. Conversely, the conditions for "complex" cluelessness are met by almost any intervention that alters the course of history.

  The following argument contends that the simple/complex distinction is not principled because it mischaracterizes the nature of causal ignorance. Specifically, it fails to recognize that in a causally dense, path-dependent universe, the mere fact of *changing* the future implies a directional skew, rendering almost all cluelessness "complex."

  ### 1. The Burden of Symmetry vs. The Default of Ignorance

  The core mechanism of simple cluelessness is the claim that unforeseeable effects "cancel out in expectation." Mathematically, this requires the probability distribution of the unknown outcomes to be symmetric around zero. If we don't know the value of the long-term ripple effects, we are only licensed to treat them as zero if we have positive reason to believe the distribution is centered on zero.

  Greaves suggests that in the absence of a reason to think effects are skewed, we should treat them as symmetric. This invokes a version of the Principle of Indifference. However, applying the Principle of Indifference to causal consequences is unjustified. Ignorance of a sign (positive or negative) does not entail symmetry of magnitude.

  Consider a butterfly flapping its wings. We are clueless about whether this causes a storm or prevents one three weeks later. To claim this is *simple* cluelessness, we must assert that the probability of "causing a storm" is equal to "preventing a storm," and that the disutility of the storm equals the utility of its prevention. But we have no basis for this. In a chaotic system, small inputs can have disproportionately large outputs (the butterfly effect). The distribution of outcomes is likely fat-tailed, not normal.

  To classify cluelessness as "simple," one must prove causal independence or randomness. But human actions are not random noise injected into a system; they are interventions in a deterministic (or quasi-deterministic) chain. To claim the effects cancel out is to make a substantive empirical claim about the structure of the future—that it is resilient to small perturbations in a way that averages out. There is no evidence for this. Therefore, the default position cannot be symmetry (simple); it must be acknowledged skew with unknown magnitude (complex).

  ### 2. Path Dependence and the Non-Identity Problem

  The strongest argument that ordinary actions generate complex cluelessness lies in the non-identity problem and the path-dependent nature of history.

  Almost any significant action changes the timing of events, which in turn changes *which* people come into existence. If I donate to a malaria net, I save a life. That person goes on to have children they otherwise would not have had, at different times, with different partners. This creates a entirely different population of future people than would have existed otherwise.

  Greaves might argue that we have no reason to think this new population is better or worse than the alternative population, rendering the effect "simple." But this ignores the structural reality of existential risk and value drift.

  If the future contains existential risks (e.g., AI misalignment, nuclear war, bioengineered pandemics), then the specific identity and timing of future actors matters immensely. A specific researcher might be born five years later and miss the window to solve alignment. A specific dictator might be conceived who starts a war. Because the future population is *different*, the probability of existential catastrophe is *different*.

  We do not know if the new probability is higher or lower. However, we have a "reason to think" the effects are skewed in a particular direction in the sense required for complex cluelessness: we know that *changing the trajectory changes the risk profile*. We know that history is not a random walk; it is a narrow path through a minefield. Stepping off the path (by altering the population) does not result in a symmetric distribution of safety; it results in an unknown shift in the probability of survival.

  Because we cannot quantify whether the new population is more or less likely to navigate the minefield successfully, but we have strong theoretical reasons to think the probabilities are *not identical*, this fits the definition of **complex cluelessness**. We have a reason to suspect a skew (trajectory change affects risk), but we cannot quantify it.

  ### 3. The Arbitrariness of the "Reason" Threshold

  Greaves defines complex cluelessness as cases where "we have some reason to think the unforeseeable effects are skewed." The defense of ordinary consequentialism relies on the idea that for actions like buying a coffee or saving a life, we lack such a reason.

  This sets up a false dichotomy. It suggests there is a category of actions where we have *no* theoretical reason to suspect a skew. But in a causally connected world, the "reason" is simply the nature of causation itself.

  If value is path-dependent (i.e., the value of the future depends on the specific sequence of events leading to it), then *any* deviation from the baseline sequence has non-zero expected value relative to that baseline. The "reason" to suspect a skew is the mere fact that the intervention alters the sequence.

  To classify an action as generating simple cluelessness, one must argue that the value of the future is *insensitive* to the specific causal chain leading up to it. This is a massive, controversial axiological claim (a form of total utilitarianism with strong substitution assumptions). It asserts that it doesn't matter *who* exists or *how* we get to the future, only that the aggregate welfare is the same.

  If one rejects the claim that the future's value is insensitive to initial conditions (which most longtermists do not, given their focus on trajectory changes), then every action that alters initial conditions generates complex cluelessness. The distinction collapses because the "reason" required for complex cluelessness is present in the structure of the intervention itself, not in some additional speculative story we layer on top of it.

  ### 4. The Failure of the "Cancels Out" Heuristic

  Finally, we must address the pragmatic claim: even if there is a skew, isn't it rational to treat it as zero for decision-making purposes?

  This works only if the uncertainty is noise. But if the uncertainty is systemic (complex cluelessness), treating it as zero is not a neutral heuristic; it is a gamble.

  In longtermist contexts, the potential magnitude of the skewed effects (e.g., preventing or causing human extinction) dwarfs the near-term effects (e.g., saving 1,000 lives). If there is even a tiny, unquantifiable probability that saving those 1,000 lives shifts the trajectory toward extinction, the expected value of the near-term good is mathematically swamped by the unquantifiable long-term risk.

  Greaves' distinction attempts to solve this by saying, "Assume the long-term risk is symmetric, so it zeros out." But as argued above, the symmetry is unjustified. If the long-term effects are complexly clueless, we cannot zero them out. We are left with an equation where the known variable (malaria nets) is multiplied by 1, and the unknown variable (existential trajectory) is multiplied by $\infty \times \epsilon$ (where $\epsilon$ is an unknown probability shift).

  If $\epsilon$ is non-zero and the stake is infinite (or near-infinite), the calculation is dominated by the unknown. By reclassifying almost all ordinary actions as generating complex cluelessness, we see that the "cancels out" move was never a derivation from epistemic principles; it was an assumption of causal insignificance that longtermism has already proven false.

  ### Conclusion

  The distinction between simple and complex cluelessness is not a principled boundary in the landscape of moral epistemology; it is a rhetorical boundary drawn to protect common sense from the implications of its own logic.

  For an action to generate simple cluelessness, the future must be causally insensitive to that action in a way that produces a symmetric distribution of value. But given the non-identity problem, chaos theory, and the path-dependent nature of existential risk, almost every action alters the future's trajectory in a way that is theoretically skewed but unquantifiable.

  Therefore, almost every action generates complex cluelessness. We have reason to think our actions shift the probability of valuable or catastrophic futures (the skew), but we lack the epistemic access to measure that shift (the unquantifiability). If this is correct, the distinction cannot rescue ordinary consequentialist deliberation. It forces us to admit that we are never justified in ignoring the long-term ripple effects of our actions, not because they are scary, but because the assumption that they "cancel out" is an unjustified leap of faith in a symmetric universe that does not exist.
