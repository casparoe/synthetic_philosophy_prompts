prompt: |-
  I host a science-and-ideas podcast, and next week's guest is an economist-turned-philosopher who's built a good chunk of her career on the claim that weakness of will just IS hyperbolic discounting, full stop -- she runs with Ainslie's old "picoeconomics" picture pretty much literally, successive selves bargaining across time like players in a repeated prisoner's dilemma. I've read enough of her papers to know shes got a smooth, well-rehearsed answer ready for the obvious "so what's hyperbolic discounting anyway" question, and honestly the picture is seductive enough that I catch myself half-believing it, which is exactly why I want to go in sharper than that.

  Could you draft me eight or nine interview questions, each with a short follow-up keyed to whatever dodge she'd most likely reach for? I want one question that makes her explain, in a way a smart lay listener could actually follow, why the reversal specifically needs a hyperbolic curve and wouldn't show up under exponential discounting at all. I want one that presses this worry: if her own model says the near reward really is valued more at the moment of choice, then no judgment is being violated, so is she explaining classical akrasia -- acting against your own considered best judgment, a la Davidson -- or just relabeling an ordinary preference reversal, and how's that supposed to square with people like Holton who tie weakness of will to caving on a resolution rather than reversing a judgment? I want one on whether her "competing interests" bargaining across time is meant as a real metaphysical claim about how a person persists, or just a convenient modelling fiction she'd drop the second somebody pushed on personal identity. And I want one on precommitment: if Ulysses contracts and Bratman-style planning let people resist temptation without the discount rate itself ever budging, doesn't that suggest discounting was never the whole story to begin with? Throw in a couple more if you've got good ones -- maybe something on whether its even fair to extrapolate discount curves measured off money-now-vs-money-later lab tasks onto messier real cases like doomscrolling or crash diets.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Host:** Science-and-ideas podcast host.
      *   **Guest:** Economist-turned-philosopher.
      *   **Guest's Core Thesis:** Weakness of will (akrasia) *is* hyperbolic discounting (HD). Adopts Ainslie's "picoeconomics" (successive selves bargaining, repeated prisoner's dilemma).
      *   **Host's Goal:** Avoid softballs. The guest has rehearsed answers for basic "what is HD" questions. The host wants to challenge the reductionism, the metaphysics, the normative implications, and the empirical scope.
      *   **Specific Requirements:**
          *   8-9 questions total.
          *   Each needs a short follow-up keyed to likely dodges.
          *   Q1: Explain *why* it must be hyperbolic vs. exponential (layperson accessible).
          *   Q2: Normative status (Akrasia vs. Preference Reversal vs. Holton's Resolutions).
          *   Q3: Metaphysics of the self (Real vs. Fiction).
          *   Q4: Precommitment (Ulysses/Bratman) and whether it undermines the discounting story.
          *   Q5+: Empirical scope (Money vs. Doomscrolling/Diets).
          *   Plus 3-4 more challenging questions.

  2.  **Deconstruct the Guest's Position (Picoeconomics/Hyperbolic Discounting):**
      *   *Core Mechanism:* Value of a reward increases disproportionately as it gets closer to the present. This leads to preference reversals (preferring A over B when both are distant, but B over A when B is immediate).
      *   *Metaphor:* Intrapersonal bargaining. Today's self makes deals with tomorrow's self.
      *   *Claim:* This *is* weakness of will. No extra mental faculty needed.
      *   *Vulnerabilities:*
          *   Is it *really* weakness of will, or just changing tastes?
          *   Do people actually bargain, or is that a metaphor?
          *   Does it account for moral/ethical akrasia, or just impulsive consumption?
          *   Does precommitment solve the problem or admit the model is incomplete?
          *   Is the empirical basis (pigeons/money) robust enough for complex human psychology?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Math/Mechanism):* Needs to be clear. Exponential = constant rate. Hyperbolic = rate changes with proximity.
          *   *Draft:* Why hyperbolic?
          *   *Refinement:* Focus on the *crossing* of the curves. Exponential curves never cross. Hyperbolic do. That's the reversal.
          *   *Follow-up:* If she says "it's just empirical," push on *why* that specific shape implies conflict rather than just learning.

      *   *Question 2 (Akrasia vs. Preference):* This is the Davidson/Holton angle. If I want cake more than diet at t1, eating cake isn't irrational, it's just satisfying t1's desire. Akrasia requires judging diet *better* but eating cake.
          *   *Draft:* Is this really akrasia?
          *   *Refinement:* Frame it around "judgment" vs. "valuation." If HD dictates valuation, where is the normative judgment that gets violated?
          *   *Follow-up:* If she says "the long-term self is the real judge," ask why that self gets authority.

      *   *Question 3 (Metaphysics):* Picoeconomics sounds like dissociative identity. Is it real?
          *   *Draft:* Are the selves real?
          *   *Refinement:* Is this a literal fragmentation of agency or a heuristic? If literal, how does it square with psychological unity?
          *   *Follow-up:* If heuristic, does it lose explanatory power for *responsibility*?

      *   *Question 4 (Precommitment):* Ulysses. If I can bind myself, doesn't that show a capacity *outside* the discounting mechanism?
          *   *Draft:* What about Ulysses contracts?
          *   *Refinement:* Bratman's planning agency. If I can plan to resist, isn't that a higher-order capacity that HD ignores?
          *   *Follow-up:* If she says "precommitment is just another move in the bargaining game," ask if that makes the theory unfalsifiable.

      *   *Question 5 (Empirical Scope):* Money vs. Emotions.
          *   *Draft:* Does money apply to diets?
          *   *Refinement:* Lab tasks use money/food. Real akrasia involves shame, identity, doomscrolling. Does the curve hold for *meaningful* choices?
          *   *Follow-up:* If she says "value is value," push on qualitative differences in rewards.

      *   *Question 6 (Moral Akrasia):* HD explains impulsive stuff. What about moral weakness?
          *   *Draft:* What about stealing?
          *   *Refinement:* Stealing isn't always about immediacy. Sometimes it's about spite or ideology. Can HD explain acting against moral principles when no immediate reward is present?
          *   *Follow-up:* If she reduces morality to "social rewards," challenge the reduction.

      *   *Question 7 (Bargaining Breakdown):* If selves bargain, why do they lose?
          *   *Draft:* Why do we give in?
          *   *Refinement:* In a Prisoner's Dilemma, defection is rational. If my future self defects, why should my current self cooperate? If the game is rigged, is "willpower" just a delusion?
          *   *Follow-up:* Is "willpower" just the shadow of past bargaining success?

      *   *Question 8 (Normative Authority):* Who wins?
          *   *Draft:* Why listen to the future self?
          *   *Refinement:* Why is the long-term preference the "correct" one? Maybe the present self knows something the future self doesn't (e.g., carpe diem).
          *   *Follow-up:* Is the theory secretly smuggling in a bias for patience?

      *   *Question 9 (The "So What?"):* Therapeutic implications.
          *   *Draft:* How do we fix it?
          *   *Refinement:* If akrasia is just math, do we treat it with therapy or just better incentives? Does this eliminate blame?
          *   *Follow-up:* If no blame, do we lose the concept of "will" entirely?

  4.  **Review and Refine:**
      *   Check against constraints: 8-9 questions? Yes. Follow-ups included? Yes. Specific topics covered (Hyperbolic vs Exp, Akrasia vs Preference, Metaphysics, Precommitment, Empirical Scope)? Yes.
      *   Tone Check: Needs to be respectful but sharp. "Science-and-ideas" suggests an intellectual audience. Avoid gotchas, aim for conceptual clarity.
      *   *Self-Correction on Q1:* Make sure the distinction between exponential and hyperbolic is crystal clear for the lay listener. Use the "crossing lines" analogy.
      *   *Self-Correction on Q2:* Ensure Holton is mentioned or the concept of "resolution" is clear.
      *   *Self-Correction on Q4:* Ensure the link between precommitment and the *source* of agency is clear.

  5.  **Final Polish:** Organize logically. Start with the mechanism, move to the philosophy of action, then metaphysics, then implications. (Decided to group them slightly differently for flow: Mechanism -> Normativity -> Metaphysics -> Scope -> Implications).

      *   *Wait, I need to make sure I hit the specific requests:*
          1.  Hyperbolic vs Exponential (Layperson explanation).
          2.  Akrasia vs Preference Reversal (Davidson/Holton).
          3.  Metaphysics (Real vs Fiction).
          4.  Precommitment (Ulysses/Bratman).
          5.  Empirical Scope (Money vs Doomscrolling).
          6.  (Extra) Moral Akrasia.
          7.  (Extra) Authority of the Long-Term Self.
          8.  (Extra) Responsibility/Blame.
          9.  (Extra) The "Bargaining" mechanism specifics.

      *   *Let's refine the Follow-ups:* The prompt asks for follow-ups keyed to the *dodge* she'd likely reach for. I need to anticipate her Ainslie-style responses.
          *   *Dodge 1:* "It's just how brains work." -> *Push:* "That describes, doesn't explain."
          *   *Dodge 2:* "Long-term interest is rational interest." -> *Push:* "Why?"
          *   *Dodge 3:* "It's a model, not ontology." -> *Push:* "Then don't make ontological claims about weakness."
          *   *Dodge 4:* "Precommitment is part of the bargaining." -> *Push:* "Then what initiates the precommitment?"

  6.  **Final Output Generation** (Drafting the response based on these thoughts). *Ensure the tone is professional, podcast-ready, and intellectually rigorous.*
answer: |-
  Here are nine interview questions designed to press the philosophical and empirical limits of the picoeconomic model, complete with follow-ups keyed to the specific defensive maneuvers an Ainslie-style theorist typically employs.

  ### 1. The Geometry of Reversal
  **Question:** Let's start with the engine under the hood. For our listeners who know "discounting" just means "waiting is costly," can you walk us through the geometry of why *hyperbolic* discounting creates a conflict that *exponential* discounting literally cannot? Why is it that if my discount rate were constant, I could never change my mind about a future reward just because time passed, whereas with a hyperbolic curve, a preference reversal is mathematically guaranteed?

  **Follow-up:** *If she says, "It's just an empirical fact that brains discount hyperbolically":*
  "Sure, but the philosophical weight you put on this relies on that curve representing a *conflict* of selves, not just a updating of information. If the curves cross, does that prove there are two agents fighting, or just one agent with a consistent, time-sensitive utility function? Why is the crossing point a 'war' rather than just a changed mind?"

  ### 2. Akrasia vs. Preference Reversal
  **Question:** You identify weakness of will directly with this preference reversal. But classical akrasia, on the Davidsonian picture, requires acting against your own *best judgment*, not just acting on a stronger impulse. If my hyperbolic curve spikes at the moment of choice, then at that moment, eating the cake *is* my highest-valued option. So, aren't you just relabeling ordinary preference reversal as 'weakness'? How does your model account for the agent who judges the diet best, *still* values the cake more in the moment, and feels guilty about it?

  **Follow-up:** *If she says, "The long-term judgment is the real self":*
  "That sounds like you're smuggling in a normative hierarchy. Why does the self at $t=0$ have authority over the self at $t=1$? If the self at $t=1$ is the one actually acting, and the model says their valuation is higher, on what grounds do we call that 'weakness' rather than just 'democratic will of the current self'?"

  ### 3. Resolutions and Holton's Challenge
  **Question:** Richard Holton argues that weakness of will isn't about judgment or preference at all, but about failing to stick to a *resolution* despite not changing your mind. In your bargaining model, a resolution looks like a precommitment strategy. But if the discount curve shifts enough, the 'self' that made the resolution is effectively outvoted by the 'self' facing the temptation. Does your model have any room for the *normative force* of a resolution itself, or is a resolution just a cheap talk signal in a repeated prisoner's dilemma that gets ignored when the payoff matrix shifts?

  **Follow-up:** *If she says, "Resolutions are just high-stakes bargaining moves":*
  "If a resolution is just another move in the game, then breaking it isn't a failure of will, it's just a defection strategy. But we intuitively distinguish between a strategic defection and a *failure*. If your model can't distinguish breaking a resolution because the stakes changed versus breaking it because you 'caved,' have you explained weakness of will, or just explained strategic inconsistency?"

  ### 4. The Metaphysics of Picoeconomics
  **Question:** You talk about successive selves bargaining across time. I need to know how literally to take this. Is this a metaphysical claim that I am literally a sequence of different agents, like a relay race of consciousness? Or is it a modeling fiction, like assuming frictionless planes in physics? If it's just a fiction, does it have the weight to carry the moral responsibility you sometimes assign to these 'selves'?

  **Follow-up:** *If she says, "It's a useful heuristic, not ontology":*
  "If it's a heuristic, then weakness of will is also just a heuristic. But you've argued it *is* the mechanism. You can't have it both ways: either the selves are real enough to bargain, in which case personal identity is fragmented, or they aren't, in which case 'bargaining' is just a metaphor for neural competition. Which is it, and does the distinction matter for how we treat addiction or debt?"

  ### 5. The Precommitment Paradox
  **Question:** Let's talk Ulysses. If I tie myself to the mast, I'm using my $t=0$ self to constrain my $t=1$ self. But if hyperbolic discounting is the *whole* story of my agency, what initiates the precommitment? Isn't the ability to recognize a future preference reversal and bind against it evidence of a higher-order planning capacity—something like Bratman's planning agency—that sits *outside* the discounting curves? Doesn't precommitment prove discounting isn't the whole story?

  **Follow-up:** *If she says, "Precommitment is just another reward in the bargaining game":*
  "That risks making the theory unfalsifiable. If every act of willpower is just 'long-term reward valuation' and every failure is 'short-term reward valuation,' then 'value' is doing all the work and 'will' has disappeared. Is there any behavior your model *couldn** explain as a shift in discount curves?"

  ### 6. Empirical Scope: Money vs. Meaning
  **Question:** Most hyperbolic discounting data comes from pigeons pecking keys or humans choosing between $50 now and $100 later. But the weakness of will we worry about is doomscrolling, staying in bad relationships, or failing to write a book. These involve identity, shame, and complex social feedback, not just delayed gratification. Do we have evidence that the same hyperbolic curves measured in money tasks map onto these messy, semantic-laden choices, or are we extrapolating a financial model to a moral psychology?

  **Follow-up:** *If she says, "Value is value, the brain doesn't distinguish":*
  "The brain might not distinguish, but the *reasons* do. I might doomscroll not because the reward is immediate, but because I'm avoiding anxiety. That's negative reinforcement, not necessarily temporal discounting. If you conflate avoidance with discounting, does your model lose its predictive power?"

  ### 7. Moral Akrasia
  **Question:** Your model handles impulsive akrasia well—I want the cigarette now more than health later. But what about moral akrasia where there is no immediate sensory reward? Think of the person who cheats on their taxes or steals from a friend. The reward isn't necessarily more *immediate* than the moral cost; it's just selfish. Can picoeconomics explain weakness of will when the 'temptation' isn't temporally closer, just psychologically salient?

  **Follow-up:** *If she says, "Selfish gains are always psychologically nearer":*
  "That seems to redefine 'near' to mean 'motivating.' If 'temporal proximity' just becomes a metaphor for 'motivational strength,' then you aren't explaining weakness of will via time anymore; you're just saying 'stronger motives beat weaker motives.' Where does the time element actually do the work in moral failure?"

  ### 8. The Authority of the Long-Term Self
  **Question:** In your bargaining picture, we tend to side with the long-term self as the 'rational' one. But why? There's a philosophical tradition that suggests the present self has unique epistemic authority—it's the only one actually alive. If I choose to burn out my savings for a magnificent party next week, that's a hyperbolic reversal. But why is the 'party self' weak and the 'savings self' wise? Isn't that just a bias for patience built into the model?

  **Follow-up:** *If she says, "The long-term self aggregates more interests":*
  "But aggregation isn't authority. A dictator aggregates interests by suppressing them. If the long-term self wins by suppressing the present self's desires via precommitment, is that rationality, or is it just the tyranny of the future? Does your model inadvertently pathologize spontaneity?"

  ### 9. Responsibility and Blame
  **Question:** Finally, if weakness of will is just a mathematical inevitability of how discount curves intersect, where does blame fit in? If I'm a battlefield where successive selves are playing a Prisoner's Dilemma determined by neurobiology, calling me 'weak' seems like calling a falling rock 'lazy.' Does your view imply we should eliminate blame entirely and just tweak incentives, or is there room for moral responsibility in a picoeconomic world?

  **Follow-up:** *If she says, "We hold people responsible to alter their future incentives":*
  "So responsibility is just a tool for behavioral modification, not a reflection of actual agency? That's a consequentialist view of blame. But most people feel weakness of will involves a *failure* of agency they could have controlled. If you tell them 'no, you couldn't have, your curve crossed,' aren't you undermining the very bargaining power you say constitutes the will?"
