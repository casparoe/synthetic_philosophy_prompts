prompt: |-
  So a few months back I got roped onto the advisory board of a small foundation that gives grants for "stress-testing" findings a field considers basically settled -- sometimes a genuine adversarial collaboration between people who disagree, sometimes just a solid researcher asking for money to redo a classic result properly. I only landed this unpaid gig because I write about science and research culture for a living and someone thought that counted as "neutral." It's been easy so far, but a proposal on the docket for next weeks call has split the board right down the middle, and because I'm supposedly the neutral one, I've been asked to draft the recommendation memo.

  Here's the case: a well-regarded researcher wants about $60k to redo, with much better power and pre-registration, a finding that's been in every intro textbook in her corner of psychology for twenty years. Half the board says funding this is pointless, maybe even irresponsible -- we already know the effect is real, so we already know, before a single subject is run, that any contrary result the new study turns up will have to be a fluke or a confound, and it's a waste of scarce money to go "discover" that. The other half of us, me included (ever since a philosopher I interviewed for a different piece got me hooked on this), finds that argument kind of unsettling, because it seems to prove way too much: if simply knowing something now entitles you to write off in advance any future evidence against it, that would justify never funding a check on anything we're currently confident about -- which feels like exactly the failure mode the foundation exists to guard against. She called this general puzzle "the dogmatism paradox" and said it goes back to some unpublished Kripke lectures, for what that's worth.

  Could you draft the memo I'll circulate before the vote? I need an actual recommendation on this specific grant -- fund, decline, or fund with conditions, and on what timeline -- plus something like a standing principle the board could lean on next time this exact fight comes up, because it clearly will. Please don't dodge into "it depends": take a side. But be genuinely fair to the "we already know this, don't waste the money" camp, since their instinct doesn't strike me as crazy either.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Advisory board member (science writer/research culture expert, viewed as "neutral").
      *   **Task:** Draft a recommendation memo for a specific grant proposal ($60k to replicate a settled psychology finding) and propose a standing principle for future similar cases.
      *   **Conflict:** Board is split 50/50.
          *   *Camp A (Skeptics):* The effect is settled. Funding a redo is a waste of scarce resources. Any contrary result is likely noise.
          *   *Camp B (Pro-Replication):* Refusing to check settled science because it's "settled" is dogmatic and defeats the foundation's purpose (stress-testing). References "dogmatism paradox" (Kripke).
      *   **Constraints:** Do not dodge ("it depends"). Take a side. Be fair to Camp A. Provide a specific recommendation (Fund/Decline/Conditions) and a timeline. Provide a standing principle.
      *   **Tone:** Professional, persuasive, balanced but decisive, suitable for an advisory board context.

  2.  **Deconstruct the Arguments:**
      *   *Camp A (The "Settled Science" Argument):* Resources are finite. Opportunity cost is real. If we fund this, we can't fund something novel. Bayesian priors are extremely high. A failure to replicate is more likely methodological error than a paradigm shift. This is pragmatic stewardship.
      *   *Camp B (The "Anti-Dogmatism" Argument):* Science is fallible. Textbook facts can be wrong (e.g., power posing, ego depletion). If we institutionalize the idea that "known" things can't be questioned, we ossify the field. The foundation's *mission* is specifically stress-testing. Ignoring that mission because something is popular undermines the foundation's raison d'être.

  3.  **Determine the Recommendation:**
      *   *Option 1: Decline.* Aligns with Camp A. Safe, pragmatic. But undermines the foundation's specific mission of stress-testing. Risks validating the "dogmatism paradox."
      *   *Option 2: Fund Unconditionally.* Aligns with Camp B. Purest adherence to mission. But might alienate Camp A and seem reckless with funds if the prior is *too* strong.
      *   *Option 3: Fund with Conditions.* The middle path, but needs to be decisive.
      *   *Decision:* I need to take a side. The prompt asks me to be "genuinely fair" to Camp A but ultimately the user (who leans Camp B) finds Camp A's argument "unsettling" and notes the foundation exists to "guard against" that failure mode. To be useful as a "neutral" who actually resolves the deadlock, I should recommend **Funding**, but frame it in a way that acknowledges Camp A's validity regarding resource allocation. Why? Because a foundation dedicated to *stress-testing* that refuses to stress-test settled science is contradictory. However, to respect Camp A, the recommendation should emphasize *why* this specific case merits stress-testing (e.g., high impact of the finding, lingering methodological concerns in the original literature).
      *   *Refinement:* Actually, the strongest position for a "neutral" trying to bridge the gap while upholding the mission is to **Fund**. Why? Because declining based on "we already know" is epistemologically dangerous for a foundation with this specific charter. However, I must validate Camp A's concern about waste. I will recommend **Funding**, but couple it with a **Standing Principle** that raises the bar for *which* settled facts get tested, ensuring we don't fund *every* replication request, just the high-value ones. This satisfies Camp A's resource concern without accepting their epistemological dogmatism.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront. (Recommendation: Fund).
      *   **Context:** Briefly summarize the proposal and the board's division.
      *   **Analysis of Camp A (The Stewardship Argument):** Acknowledge their point. Scarcity is real. Bayesian priors matter. We shouldn't fund fishing expeditions. Validate their intent (protecting the foundation's impact).
      *   **Analysis of Camp B (The Mission Argument):** Acknowledge the foundation's specific charter. History of science shows "settled" isn't "true." The epistemological risk of closing inquiry.
      *   **The Decision (The "Why"):** Explain why the Mission Argument wins *for this foundation*. If we don't test settled things, who will? Novelty-seeking funders won't. This is our niche.
      *   **The Standing Principle:** This is crucial. It needs to prevent *every* grant from becoming a replication grant. It needs criteria. (e.g., High societal impact, known methodological weaknesses in original, potential for paradigm shift).
      *   **Timeline/Conditions:** Pre-registration is already mentioned. Add data sharing and a commitment to publish regardless of outcome.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but keep it rigorous.
      *   Ensure Camp A doesn't feel dismissed as "anti-science." They are "pragmatic stewards."
      *   Ensure Camp B doesn't feel like they won by default. They won because of the *foundation's specific mandate*.
      *   Address the "Dogmatism Paradox" reference lightly (don't get bogged down in Kripke, but acknowledge the logic).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending "Fund" too risky for the user?
      *   *Fix:* Make the Standing Principle robust. It acts as a shield for future votes. It says "We fund replications, BUT only when X, Y, Z are met." This reassures Camp A that we aren't opening the floodgates.
      *   *Critique:* Did I take a side?
      *   *Fix:* Yes, the recommendation is "Fund."
      *   *Critique:* Is the timeline clear?
      *   *Fix:* Specify the grant duration and reporting milestones.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Draft memo? Yes.
      *   Actual recommendation? Yes (Fund).
      *   Timeline/Conditions? Yes.
      *   Standing Principle? Yes.
      *   Don't dodge? Yes.
      *   Fair to Camp A? Yes (framed as resource stewardship).

  8.  *(Self-Correction on the "Dogmatism Paradox"):* The prompt mentions Kripke. I should briefly acknowledge that intellectual lineage to show I listened, but keep it practical. The paradox is roughly: "I know P. If I know P, I know any evidence against P is misleading. Therefore, I should ignore evidence against P." The counter is that claiming "Knowledge" closes the loop too early. I will weave this into the justification without getting philosophical.

  9.  **Finalizing the Standing Principle:** It needs a catchy name. "The Settled Science Stress-Test Protocol" or similar. Let's go with "The High-Stakes Replication Standard."

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts).

  *(Wait, one last check on the "Take a Side" constraint)*: The prompt says "Please don't dodge into 'it depends': take a side." I will recommend **Funding**. It aligns best with the foundation's unique mission described in the prompt ("stress-testing findings a field considers basically settled"). If I recommend declining, I am effectively arguing the foundation shouldn't do what it says it does. Funding is the only logically consistent choice for *this specific foundation*, even if Camp A has a point about general resource allocation.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** The Advisory Board, [Foundation Name]
  **FROM:** [Your Name], Advisory Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal #24-B (Replication of [Effect Name]) and Future Replication Standards

  ### Executive Summary

  After reviewing the proposal to fund a high-powered, pre-registered replication of a settled finding in social psychology, and considering the vigorous debate during our last call, I am recommending that the board **vote to FUND** this grant.

  However, to address the valid concerns regarding resource scarcity and strategic focus, this recommendation comes with specific conditions regarding data transparency and publication commitments. Furthermore, to prevent this decision from setting an untenable precedent for future requests, I am proposing the adoption of a **Standing Principle on Replication Funding** (detailed below). This principle is designed to satisfy the stewardship concerns of the "Skeptics" while upholding the epistemological mission championed by the "Stress-Testers."

  ### Context and Division

  The board is currently divided on Proposal #24-B.
  *   **Camp A (Stewardship):** Argues that the effect in question is robust and settled. Funding a re-examination is an inefficient use of limited capital, as the Bayesian prior for a null result is low. They argue that treating settled science as open question invites noise and wastes funds that could support novel discovery.
  *   **Camp B (Mission Integrity):** Argues that refusing to test "settled" science contradicts our foundation's charter. They contend that institutionalizing the idea that current confidence precludes future testing creates a dogmatic feedback loop, insulating errors from correction.

  Both positions are rational. Camp A is correct that resources are finite and that not every textbook claim requires re-litigation. Camp B is correct that science is fallible and that "consensus" is not a synonym for "truth."

  ### Rationale for Recommendation

  I recommend **Funding** this proposal.

  While Camp A's concern for fiscal stewardship is prudent for a generalist funder, it is misaligned with the specific niche of *this* foundation. Major funders (NIH, NSF, Wellcome) are structurally biased toward novelty; they rarely fund pure replications. If we decline proposals specifically because a finding is "settled," we cease to function as a stress-test mechanism and become merely another novelty-seeking funder.

  The argument that "we already know this, so contrary evidence must be noise" is pragmatically useful for day-to-day research, but it is institutionally dangerous for a body tasked with oversight. History provides ample examples of textbook effects that evaporated under higher scrutiny (e.g., ego depletion, power posing). The cost of a false positive persisting for twenty years is significantly higher than the cost of a $60k replication study.

  Therefore, while Camp A is right that we cannot fund *every* replication request, they are wrong that we should fund *none* based on current confidence levels. Confidence is exactly what needs to be stress-tested.

  ### Grant Conditions and Timeline

  To ensure this grant delivers maximum value and mitigates the risk of "noise" generation, approval is contingent on the following:

  1.  **Pre-Registration:** The analysis plan must be publicly pre-registered on the Open Science Framework (OSF) prior to data collection.
  2.  **Data Transparency:** All raw data and code must be made publicly available immediately upon completion, regardless of the outcome.
  3.  **Publication Commitment:** The Principal Investigator must commit to submitting the results for publication regardless of whether the effect replicates or fails to replicate. We will not fund "file drawer" projects.
  4.  **Timeline:** Funds are to be disbursed over 18 months. A progress report is due at Month 9; final data and manuscript draft due at Month 18.

  ### Proposed Standing Principle: The High-Stakes Replication Standard

  To address Camp A's concern that this opens the floodgates, I propose we adopt the following standard for all future replication proposals. We will only fund replications of "settled" science if they meet **two of the three** following criteria:

  1.  **High Societal or Policy Impact:** The finding is actively used to design interventions, public policy, or clinical treatments (meaning the cost of being wrong is high).
  2.  **Methodological Vulnerability:** The original evidence relies on methods now known to be fragile (e.g., small N, p-hacking potential, lack of controls) that modern methods can rectify.
  3.  **Theoretical Bottleneck:** The finding serves as a foundational axiom for a broader network of theories; if it falls, it necessitates a productive restructuring of the field.

  **Why this works:**
  *   **For Camp A:** It prevents us from funding low-stakes replications of trivial effects. It ensures we are spending money where the *risk* of error is costly, not just where error is possible.
  *   **For Camp B:** It codifies our commitment to stress-testing. It acknowledges that "settled" is a temporary status, not a shield.

  ### Conclusion

  The "Dogmatism Paradox" suggests that if we claim to know something with certainty, we are logically compelled to ignore evidence to the contrary. As a foundation, we cannot afford that luxury. We must operate on the assumption that confidence is a hypothesis to be tested, not a fact to be protected.

  By funding Proposal #24-B under the **High-Stakes Replication Standard**, we validate the PI's rigor without abandoning our fiscal responsibility. We signal that this foundation is willing to ask the hard questions that other funders avoid, provided the stakes justify the cost.

  I move that we vote to approve Proposal #24-B with the conditions listed above, and adopt the Standing Principle for future deliberations.

  ***

  **[Your Name]**
  Advisory Board Member
