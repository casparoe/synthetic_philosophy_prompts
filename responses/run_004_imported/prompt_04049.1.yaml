      *   *Core idea:* A language that refers only to private sensations, with no possibility of public check or correction, cannot have meaning. If I define a word by pointing inwardly to a sensation, how do I know tomorrow that I'm applying the word to the *same* sensation? I only have my memory/impression, which could be wrong, but I have no criterion for "wrong."
      *   *Application here:* "Flow-A" is defined purely by internal feeling. Without an external definition, the user might be drifting in their usage without knowing it.

