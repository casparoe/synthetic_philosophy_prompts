      *   **Validate the User's Point:** The external data *does* rescue the project. It transforms the tags from private sensations into scientific constructs (latent variables).
      *   **Nuance:** The friend might not be persuaded because correlation isn't causation, or because the *definition* still relies on the initial introspection. However, in practice (pragmatism), the utility validates the distinction.
      *   **Key Philosophical Concepts to Introduce:**
          *   Wittgenstein's Private Language Argument (the friend's basis).
