      *   *Intuition:* Theory A is closer to the truth than Theory B if A has more truth and less falsity than B.
      *   *Formalism:* Popper defined this using classes of statements.
          *   Truth-content ($Ct_T$): The set of true consequences of a theory.
          *   Falsity-content ($Ct_F$): The set of false consequences of a theory.
          *   Definition: $Vs(A) > Vs(B)$ if ($Ct_T(A) > Ct_T(B)$ and $Ct_F(A) \le Ct_F(B)$) OR ($Ct_T(A) \ge Ct_T(B)$ and $Ct_F(A) < Ct_F(B)$).
      *   *The Catch:* This works fine if one theory is true. But if *both* are false (which is the interesting case, e.g., Newton vs. Einstein), the logic breaks.

  3.  **Explain the Miller-Tichý Result (The "Why"):**
      *   *Challenge:* How to explain set-theoretic logic without symbols?
      *   *Analogy:* Use a target or a weather example. The weather example is the standard pedagogical tool for this (Miller's own example).
