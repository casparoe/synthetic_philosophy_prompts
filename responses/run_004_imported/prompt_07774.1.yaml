prompt: |-
  I've been going down a rabbit hole reading old Popper stuff (Conjectures and Refutations) becuase I got interested in this idea of 'verisimilitude' - basically the idea that even though every scientific theory ends up being technically false, some false theories are supposed to be closer to the truth than others, and thats how Popper explains science progressing even though nothing ever gets fully proven true. But then I found out that in the 70s, Miller and Tichy apparently proved that Popper's actual formal definition of this breaks down completely - like it can never rank one false theory as more verisimilar than another false theory, which seems like it wrecks the whole point since basically every interesting theory we'd want to compare (Newton vs Einstein, say) is false. Every time I try to read the actual proof with all the truth-content/falsity-content set stuff my eyes just glaze over. Can you walk me through, in plain terms, why that result actually holds, and whether anyone's come up with a fix since then that isn't just as broken?
