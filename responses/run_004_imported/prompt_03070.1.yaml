  The archive room smelled of stale coffee and preserved paper. Elias traced a gloved finger over the photocopy of page 314.

  "Look at the transition here," Elias said. "Renata extends the R-modulus lemma. For nine years, she writes alone in the dark. No Julian to check her work. No peer review. Just her and the ink."

  Mara leaned against the steel shelving. "She followed the rules they established. The logic holds."

  "Does it?" Elias looked up. "Kripke's Wittgenstein asks: what fact constitutes her meaning *plus* rather than *quus*? When Julian was alive, his corrections anchored the rule. If she drifted, he snapped her back. That friction created the norm. But out there?" He gestured to the map of the Antarctic station on the wall. "For three thousand days, there was no one to say 'no.' At any point, she could have lapsed into a private deviation that matched her past practice but diverged from the original rule. There is no fact of the matter that she didn't."

  "So truth depends on an audience?" Mara asked.

  "Normativity does. To follow a rule is to be liable to correction. Without the possibility of disagreement, there is only the sensation of seeming right. Renata's notebooks aren't a proof; they are a diary of consistency."

  Mara pushed off the shelf. "You're relying on the community solution. But press that harder, Elias. Why does a crowd escape the finiteness that traps the individual? You say Julian's corrections grounded her. But the community's history of agreement is also finite. We have only ever checked a finite number of cases. A skeptical interpreter could look at humanity's entire mathematical history and say we've all been following a 'quus'-like rule that will diverge tomorrow."

  "That's not the same," Elias said. "The community persists. It corrects itself over time."

  "Renata persisted too," Mara countered. "She corrected herself. You're assuming isolation collapses the distinction between right and seeming right. But if the community's agreement is just a collection of individual seemings, adding more people doesn't create objectivity. It just creates consensus. If Renata's nine years of solitary inference are suspect because her memory and disposition are finite, why isn't the community's collective memory equally suspect? If the skeptic can reinterpret Renata's past steps, they can reinterpret ours."

  Elias tapped the photocopy. "Because we have cross-checks. Independent observers. Renata had only her own prior writings."

  "Which she consulted constantly," Mara said, picking up a digital tablet displaying scans of the notebooks. "Look at the marginalia. She cites her own Page 104 from Year 3 to justify a move in Year 7. She treats her past self as an other. She creates a dialogue within the text. If the normativity comes from the structure of correction, she built that structure internally. To deny her rule-following because she was alone is to say that a ship's log is invalid if the captain is the only survivor. The trajectory doesn't change because the crew died."

  "The trajectory is only visible if the rules remain constant," Elias insisted. "And without external friction, constancy is an assumption, not a fact. You're asking us to take her word for it. But her word is just more ink."

  "And your community is just more ink," Mara shot back. "You want to say the community escapes the skeptical paradox because it offers a standard beyond the individual. But that standard is still housed in finite minds. If Renata's isolation makes meaning indeterminate, then the community's agreement is just a temporary coincidence of dispositions. You haven't solved the finiteness problem; you've just outsourced it. If Renata couldn't bind herself to a rule for nine years, how does a community bind itself for centuries? Eventually, the last human dies. Does the math vanish then?"

  Elias was silent for a moment, looking back at the scan. The blue ink was stark against the white noise of the paper. "If the last human dies, the practice ends. There is no more rule-following."

  "Then the rule was never in the community," Mara said softly. "It was in the practice itself. Renata kept the practice alive. She didn't need Julian to tell her that two plus two wasn't five. She needed him to help her see the prime. But once she saw it? The isolation doesn't erase the vision. It just makes it lonely."

  Elias closed the folder. "Loneliness isn't truth, Mara."

  "No," she said, turning to leave. "But neither is consensus. If Renata's proof fails, it fails because the math is wrong, not because she was alone when she wrote it down."
