      *(Another Note)*: The user mentioned Penrose. Penrose actually argues that we *can* see the truth, implying we aren't formal systems. But the rebuttal is: How do you know you aren't making a mistake about the truth? Penrose assumes human mathematical insight is unerring. That's a huge empirical claim.

