answer: |-
  You have hit on one of the most persistent and damning critiques of Kantian ethics regarding animals. Your intuition that something feels "smuggled in" is shared by a lot of contemporary moral philosophers, including many who try to defend or update Kantianism (Christine Korsgaard is the big name here).

  However, to answer your specific question: **It is not a formal logical contradiction, but it is a massive philosophical tension that relies on a specific (and to modern eyes, dubious) distinction between *sentience* and *moral agency*.**

  Here is the breakdown of where the standard critique gets Kant wrong, and where your intuition that he's "papering over" the problem is actually right.

  ### 1. The Historical Correction: Kant ≠ Descartes
  You mentioned the EA/Tomasik crowd often lumps Kant in with Descartes as the "biological automaton" guy. This is the first place to nuance things.

  *   **Descartes** arguably *did* deny animals phenomenological consciousness. To Descartes, a dog's yelp was like the squeak of a gear; there was "no one home" to feel the pain.
  *   **Kant** did **not** deny that animals feel pain. He explicitly grants that animals are sentient. They have desires, fears, and physical suffering.

  Kant's exclusion of animals isn't based on the claim that they are insensate robots. It is based on the claim that they are not **rational agents**. For Kant, moral status (being an "end in itself") is reserved for beings capable of autonomy—beings who can legislate the moral law for themselves. Animals act on inclination and instinct, not duty.

  So, when Kant talks about the man shooting his worn-out dog, he isn't pretending the dog feels nothing. He acknowledges the dog suffers. His point is that the dog's suffering *in itself* generates no moral claim against the human, because the dog cannot participate in the moral community.

  ### 2. How the "Indirect Duty" Works (The Mechanism)
  This is where your "incoherence" charge gets interesting. You asked: *If animals are essentially machines, why would hurting them corrode your character?*

  Since Kant admits animals feel pain, the "corrosion" argument works like this:
  1.  **Habituation:** Morality for Kant is largely about cultivating the right dispositions (virtues) so that when duty calls, you aren't blocked by pathological feelings.
  2.  **Sympathy as a Tool:** Kant actually views sympathy/compassion as a "pathological" feeling (not based on reason), but he admits it is a useful tool nature gave us to help us do our duty to humans.
  3.  **The Practice Run:** If you torture an animal, you are actively suppressing your natural sympathetic response to suffering. You are practicing the *vice* of cruelty.
  4.  **The Spillover:** A person who practices suppressing sympathy toward a suffering creature will find it easier to suppress sympathy toward a suffering human when it becomes inconvenient to help them.

  So, the incoherence isn't: "He says they don't feel pain, but acts like they do."
  The incoherence is: **"He says their pain has zero intrinsic moral weight, but admits it has massive instrumental moral weight."**

  ### 3. The "Smuggling" Charge: Is it Incoherent?
  You wrote: *"It's like Kant wants to deny they have inner lives when thats convenient for denying them moral status, then quietly smuggle real suffering back in the moment he needs a story for why we still shouldn't be jerks to them."*

  This is astute. Here is why philosophers argue it's not a *contradiction*, but is definitely **unstable**:

  Kant is consistent in saying: **Moral value comes from Rational Will, not Sentience.**
  *   If a rock suffers (impossible), it doesn't matter.
  *   If an animal suffers, it doesn't matter *to the animal* (morally speaking), because the animal isn't a moral agent.
  *   However, it matters *to the human* because the human is a moral agent, and the human's reaction to that suffering defines the human's moral character.

  **The Problem:** This leads to the "Secret Torturer" paradox.
  If I torture an animal in a soundproof room where no one knows, and I am psychologically robust enough that it *doesn't* harden my heart toward humans, have I done anything wrong?
  Strictly speaking, for Kant, **no.** If the act doesn't violate a duty to humanity (either directly or via character corrosion), it is morally neutral.

  Most people find this conclusion repugnant. It suggests that the wrongness of animal cruelty is entirely contingent on human psychology rather than the animal's state. That feels like a dodge, which is why you sense he is "papering over" the issue. He is grounding the prohibition in *human* purity rather than *animal* welfare.

  ### 4. Why the EA/Tomasik Crowd Hates This
  The Effective Altruism/Rethink Priorities angle is relevant here. EA is largely consequentialist (often utilitarian). In utilitarianism, **sentience is the currency.** If it feels like something, it counts.

  Kant represents the deontological opposite: **Rationality is the currency.**
  When you read old EA forums discussing "moral weight," they are trying to quantify how much suffering matters. Kant's framework breaks the scale. He effectively says the moral weight of animal suffering is **0**, but the *side effects* of ignoring that suffering have a non-zero weight for humans.

  Tomasik and others point out that this is dangerous. If we discover that animals *are* more sentient than we thought, the Utilitarian updates the moral weight upward. The Kantian has to do complex gymnastics to explain why increased animal sentience changes human duties (it only changes them if it changes how human character is formed).

  ### 5. Verdict
  You aren't misremembering the setup, but the "automaton" label is the weak link in your critique.

  *   **Is it a logical contradiction?** No. Kant consistently applies the rule: "Only rational beings are ends; everything else is a means." Animals are means. Damaging a means is only wrong if it violates a duty regarding an end (a human).
  *   **Is it philosophically satisfying?** No. It relies on a fragile empirical claim: that cruelty to animals *necessarily* translates to cruelty to humans. (History suggests plenty of people can compartmentalize).
  *   **Are you right about the "smuggling"?** Yes. Kant needs animals to be "suffering-adjacent" enough to trigger human sympathy, but "moral-status-less" enough to remain property. He walks a tightrope where he acknowledges their pain phenomenologically but ignores it normatively.

  Modern Kantians (like Korsgaard in *Fellow Creatures*) admit this is the weakest part of Kant's system and try to argue that if we value our own animal nature (which we must, to be agents at all), we must value animal nature in others. But that is a retrofit, not what Old Immanuel wrote.

  So, you haven't fallen down a rabbit hole into a misunderstanding; you've identified the exact fracture line where 18th-century rationalism cracks under the weight of modern moral intuition about sentience.
