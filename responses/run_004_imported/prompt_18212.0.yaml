  This is one of the most stubborn impasses in the philosophy of perception. You and your friend are reenacting a debate that has stalled progress in the field for decades: the "Encapsulation vs. Penetration" dispute. The core difficulty is that perception is private; we only have access to it through report (which is judgment) or action (which is motor planning). To prove *cognitive penetration*, you need a measure that is tethered to phenomenology but insulated from judgment and attention.

  Here is an original hypothetical scenario designed to corner the skeptic. I call it **The "Semantic Phantom-Contour" Masking Paradigm.**

  ### The Scenario

  **1. The Visual Setup**
  Subjects sit before a screen displaying a black rectangular occluder in the center. Behind this occluder, an object is partially hidden. All the subject can see are the two "stumps" of the object protruding from the left and right sides of the occluder.
  *   **Crucial Detail:** The visible stumps are perfectly straight, horizontal lines. There is *no* visual cue indicating curvature.
  *   **The Stimulus:** For a brief millisecond, a faint, low-contrast **curved** line is flashed directly *over* the black occluder (as if floating on the surface of the screen).

  **2. The Cognitive Manipulation**
  Before the trial, subjects are given a firm belief about the hidden object, induced by authoritative (but false) testimony:
  *   **Group A (Snake Belief):** "The object behind the screen is a snake. Snakes are curved."
  *   **Group B (Pipe Belief):** "The object behind the screen is a pipe. Pipes are straight."
  *   **Control:** Both groups have identical visual input (straight stumps) and identical attentional instructions ("Fixate on the center of the black box").

  **3. The Task (The Critical Measure)**
  Subjects are not asked "What did you see?" (which invites judgment). Instead, they perform a **forced-choice detection task**: "Did a faint line flash on top of the box? Yes or No."
  We measure their **sensitivity (d-prime)** to detecting that faint curved probe.

  **4. The Predicted Result**
  If cognitive penetration is real, **Group A (Snake)** should show **significantly lower sensitivity** to the curved probe than Group B (Pipe).

  ***

  ### Why This Rules Out the Deflationary Alternatives

  This is the part you can use to address your friend's specific objections. The logic relies on the mechanics of **visual masking**. In vision science, a visible stimulus can "mask" (make invisible) a second stimulus if they compete for the same neural resources in early visual cortex. Imagery or judgment does not typically produce strong masking effects; only genuine perceptual activity does.

  #### 1. Ruling Out Mere Attention
  **The Skeptic's Objection:** "Group A just paid more attention to 'curvature' because they were thinking about snakes, and attention alters detection thresholds."
  **The Rebuttal:** If this were merely attentional, Group A should detect the curved probe *better* than Group B, not worse. Attention enhances signal-to-noise ratio. However, our prediction is that Group A detects it *worse*.
  **Why?** Because the belief that "it is a snake" generates a **phenomenal phantom contour** of a curve behind the occluder. This phantom curve occupies the specific neural channels tuned to that curvature. When the real curved probe flashes, it collides with the already-active phantom contour, causing **meta-contrast masking**. The belief isn't guiding a spotlight of attention; it is filling in the visual buffer with content that interferes with new input.

  #### 2. Ruling Out Perceptual Learning
  **The Skeptic's Objection:** "Maybe Group A has seen more snakes in their life, tuning their low-level detectors to curves. This is long-term learning, not immediate cognitive penetration."
  **The Rebuttal:** The scenario stipulates that the belief is induced *immediately* prior to the trial using novel objects (e.g., alien artifacts labeled "Type X" vs "Type Y" with associated properties). There is no time for long-term synaptic reweighting or perceptual learning. The effect arises from a transient propositional attitude ("I believe this is curved"), not a history of exposure. If the masking effect appears in the first trial, it cannot be perceptual learning.

  #### 3. Ruling Out Post-Perceptual Judgment/Response Bias
  **The Skeptic's Objection:** "Group A just *guessed* 'No' more often because they thought the experiment was about imagination. They didn't actually see anything different; they just changed their reporting criterion."
  **The Rebuttal:** This is why we use **sensitivity (d-prime)** rather than raw accuracy. In signal detection theory, response bias (criterion) changes how willing a subject is to say "Yes," but it does not change their ability to discriminate signal from noise (sensitivity).
  Masking is a physiological limitation on sensitivity. If the phantom contour is merely a post-perceptual judgment ("I think there's a snake"), it exists *after* the visual processing stage. It should not interfere with the early-vision detection of a flash. If the belief alters the **d-prime**, it proves the interference happened at the sensory level, not the decision level. You cannot "judge" your way out of a masking effect; if the visual system is already firing as if a curve is there, it physically obscures the incoming data.

  ### How to Use This in the Conversation

  Tell your friend: *"The problem with the hill case is that we can measure action (walking) separately from report (estimating degrees), and they dissociate. That lets you say perception stays constant and only judgment changes. But in the Phantom-Contour scenario, the measure **is** the perceptual capacity itself (sensitivity to a mask). If a belief reduces my sensory sensitivity to a flash, the belief has effectively become part of the visual signal. It's no longer a 'top-down' interpretation; it's 'bottom-up' noise generated by the top."*

  This scenario moves the goalposts from "Does it look steeper?" (which is report-heavy) to "Does the belief create visual noise?" (which is mechanism-heavy). If you can grant that beliefs can create visual noise that masks real stimuli, you have granted that beliefs penetrate the perceptual stream.
