  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between Information Theory (Shannon) and Teleosemantics is clear, as this bridges the user's biology background with the philosophy. (Shannon says no information if correlation is ambiguous; Teleosemantics says content exists via function).

