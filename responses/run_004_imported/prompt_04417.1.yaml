      *   **Tone/Level:** High intellectual level, respectful of expertise, no dumbing down, willing to wrestle with technical debates. The user knows the biology intimately; I need to match that with philosophical precision.

  2.  **Deconstruct the Philosophical Problem:**
      *   **Teleosemantics Basics:** Content is fixed by Proper Function (selected effect). A state $R$ represents $S$ if $R$ was selected to indicate $S$ and guide action $A$ because $A$ was beneficial when $S$ obtained.
      *   **The *Photuris* Problem:** The *Photinus* male's flash-response system was selected to find *Photinus* females. However, *Photuris* females exploit this. This exploitation is evolutionarily stable (it's not a rare glitch; it's a persistent pressure).
      *   **The Tension:**
          1.  *Standard Teleosemantics:* The content is "Photinus female" (or "mate"). When a *Photuris* flashes, the representation is *false*. The system is malfunctioning (or rather, functioning correctly but in a misleading environment).
          2.  *The Challenge:* If the mimicry is ubiquitous and evolutionarily stable, has the "Proper Function" shifted? Or is the "Normal Condition" now inclusive of mimics? If the system is *selected* to operate in an environment with mimics, does the content broaden to "female-or-mimic"? If so, the representation is never false, which defeats the purpose of teleosemantics (which wants to explain error).
          3.  *Alternative:* Maybe the content is disjunctive ("female OR mimic"). But teleosemantics usually fights disjunctive problems (the "disjunction problem").
