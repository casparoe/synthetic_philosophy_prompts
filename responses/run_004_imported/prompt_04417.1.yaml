  *Resolution:* Millikan distinguishes between the *producer* of the signal and the *consumer*. The *Photinus* male is the consumer. His device was selected to consume signals from *Photinus* females. The *Photuris* signals are "noise" or "interference" in the channel, even if statistically frequent. The "Normal Condition" for the *consumer* is the presence of the object that benefits the consumer. Since eating by a *Photuris* does not benefit the *Photinus* male (obviously), it cannot be part of the Normal Conditions for *his* representational state, even if it was historically present. The selection is *despite* the predation, not *for* it. This is a crucial distinction.

