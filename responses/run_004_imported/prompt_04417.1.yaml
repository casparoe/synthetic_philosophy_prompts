      *   **The Core Teleosemantic Verdict (Millikan/Neander):** Explain the "Historical Proper Function." The content is fixed by the *origin* of the trait, not current frequency. Therefore, the *Photuris* flash triggers a *false* representation. The system is doing what it was built to do, but the world is lying to it. This preserves the normativity (truth/falsity).
