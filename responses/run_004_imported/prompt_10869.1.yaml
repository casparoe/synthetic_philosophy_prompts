answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late evening. Two philosophers, **Elena** (defending the Fregean/Unsaturated view) and **Marcus** (defending the Act-Type/Predication view), are clearing away empty cups. A copy of the *Stanford Encyclopedia of Philosophy* lies open on the table between them.*

  **Elena:** You see, this is exactly where the list theory fails. Look at the text: "Desdemona loves Cassio." Now look at "Cassio loves Desdemona." The ingredients are identical. Desdemona. Cassio. The relation of loving. If a proposition were just a complex of these three entities, the two sentences would signify the exact same thing. But they don't. One is true, the other false. They have different directions of fit. So, there must be something that binds them, and binds them *asymmetrically*.

  **Marcus:** I agree with the diagnosis, Elena. The "list" view is dead on arrival. But I think your cure is worse than the disease. You want to solve this by saying the relation "loves" is fundamentally different in category from Desdemona and Cassio. You say it's "unsaturated." It has a gap. It reaches out and grabs the objects.

  **Elena:** Not "grabs." That's too violent. It's a matter of logical grammar. Objects are complete; concepts are incomplete. When you fill the gap in the concept "loves" with Desdemona and Cassio, you don't need a further tie. The saturation *is* the unity. That stops Bradley's Regress before it starts. You don't need a glue to stick the glue to the object, because the concept isn't the kind of thing that *needs* glue. It's inherently adhesive.

  **Marcus:** But that's just a metaphor, isn't it? "Inherently adhesive." "Unsaturated." What does that actually amount to ontologically? If I ask you to show me the "gap" in the relation, you can't. All you've done is taken the mystery of unity—how three things become one truth—and given it a name: *Unsaturatedness*. You haven't explained *how* the unity happens; you've just asserted that concepts are magical items that unify themselves.

  **Elena:** It's not magic, Marcus. It's a category distinction. The regress arises only if you treat the relation as just another object. If "loves" were an object like Desdemona, then yes, you'd need a further relation to tie "loves" to Desdemona. But it's not. It's a function. Think of mathematics. The function $f(x) = x + 1$ isn't a number sitting next to $2$. It's an operation. When you put $2$ in, you get $3$. You don't ask what ties the function to the number. The application is internal to the function.

  **Marcus:** But we aren't doing math. We're talking about thought and reality. When *you* think "Desdemona loves Cassio," you are holding Desdemona in mind, Cassio in mind, and the concept of loving in mind. If the concept is "unsaturated," does it do the work, or do *you*? If the concept unifies itself automatically, then merely grasping the concept and the objects should force the thought into your mind. But I can grasp "Desdemona," "Cassio," and "loving" without judging that Desdemona loves Cassio. I can wonder if it's true. I can deny it.

  **Elena:** Grasping the constituents isn't the same as forming the proposition. You have to combine them. But the *possibility* of that combination lies in the unsaturated nature of the concept.

  **Marcus:** Ah, "combine." There it is. Who is doing the combining? You. The thinker. If *you* have to combine them, then the unity comes from your act of combining, not from the concept's "unsaturatedness." The concept is just a tool. A hammer doesn't build a house; the carpenter does. On my view, the proposition *is* the act type. "Desdemona loves Cassio" is a type of cognitive act where a subject predicates the property of loving Cassio of Desdemona. The unity is the unity of an action, like a dance. A dance isn't a list of steps; it's the performance of them in order.

  **Elena:** But this collapses the proposition into the psychology of the thinker. If the proposition is an act type, does the proposition "Desdemona loves Cassio" exist when no one is thinking it?

  **Marcus:** Not as a unified entity, no. There are just the constituents and the potential for the act.

  **Elena:** That's unacceptable. Truth conditions are mind-independent. It was true that Desdemona loved Cassio (in the fiction) regardless of whether anyone was around to predicate it. If the unity depends on a mind performing an act, then there are no truth-bearing propositions in a mindless universe. You've solved Bradley's Regress by eliminating the things that were supposed to be unified.

  **Marcus:** I haven't eliminated them; I've naturalized them. You're worried about a "mindless universe," but you're positing "unsaturated entities" floating in a Platonic heaven waiting to be saturated. Which is more mysterious? A world without thinkers where propositions don't exist, or a world where concepts are essentially gappy hooks waiting for objects? At least my view explains the directionality. "Desdemona loves Cassio" differs from "Cassio loves Desdemona" because they are different *acts*. In one, I predicate loving-of-Cassio of Desdemona. In the other, I predicate loving-of-Desdemona of Cassio. The order is in the doing.

  **Elena:** But how do you know *what* to do? To perform the act of predicating loving-of-Cassio of Desdemona, you must already grasp the content *as* having that direction. If the content is *constituted* by the act, then before the act, there is no direction. So what guides your hand? Why don't you accidentally predicate Desdemona of Cassio? You must be guided by the structure of the content itself. But if the content has structure before you act, then the unity is already there, prior to the act. You're smuggling in the very unsaturated structure you deny.

  **Marcus:** I'm not smuggling it in. I'm saying the content is abstracted from the act. Look, let's press your view on the "re-description" charge. You say the concept is unsaturated. Okay. Take the concept "loves." It has two gaps. Subject gap, object gap. Now, are those gaps distinct? Is the subject-gap different from the object-gap?

  **Elena:** Obviously. Otherwise, you couldn't distinguish "Desdemona loves Cassio" from "Cassio loves Desdemona."

  **Marcus:** Right. So now we have the relation "loves," plus a subject-gap, plus an object-gap, plus Desdemona, plus Cassio. How do we know Desdemona goes in the subject-gap and not the object-gap? If the gaps are just features of the relation, we're back to the list. "Relation, Gap-1, Gap-2, Object-1, Object-2." We need a rule to put Object-1 in Gap-1. Who provides the rule?

  **Elena:** The relation provides the rule! That's what it means to be a binary relation. It *is* the ordering.

  **Marcus:** But if the relation is an entity, and the ordering is a feature of that entity, how does the feature connect to the entity? We're back to Bradley. You're saying the relation has "internal hooks." I'm saying that's just a picture. The only thing that actually establishes the order is an agent assigning the objects to the positions. The "direction" isn't in the relation; it's in the mode of presentation.

  **Elena:** You keep reducing this to psychology, Marcus. But consider error. Suppose I judge falsely: "Desdemona loves Iago." On your view, I perform an act of predication. That act is unified. It exists. But the state of affairs *Desdemona loving Iago* does not exist. So what have I united? If the proposition is the act, the proposition exists. But if the proposition represents a non-existent unity, then your act has succeeded in unifying something that *cannot* be unified in reality.

  **Marcus:** Not in reality, no. But in the act of representation, yes. I can perform the act of predicating "loves Iago" of Desdemona. The unity is in the representation, not in the world. That's how falsehood is possible. I perform a unified act that fails to match the world.

  **Elena:** But what makes it the act of predicating *loving*? Why isn't it the act of predicating *being loved by*? If the act provides the unity, the act must have a specific structure. To perform the act, I must utilize a concept. If that concept is just an object in my mind until I use it, it has no direction. If it has direction before I use it, it's unsaturated. You're caught in a dilemma. Either the concept has intrinsic directionality (which is my view), or your act is arbitrary (which makes communication impossible).

  **Marcus:** The concept has a *functional role*, not an ontological hook. It's a tool defined by its use. "Loves" is a tool that, in our language and thought, is used to map a subject to an object. The directionality is normative, not metaphysical. It's a rule of the game. You treat the concept as if it were a strange object with holes. I treat it as a rule for synthesis.

  **Elena:** But rules don't apply themselves. Kant saw this. A rule requires a judgment to subsume the particular under it. If the unity comes from the application of the rule, then the application is prior to the unity. But the application *is* a relation between the mind and the concept. So we need a relation to tie the mind to the concept... Marcus, you haven't escaped the regress. You've just moved it inside the head. Now we need to explain how the mind ties the concept to the object. Is that tying unsaturated?

  **Marcus:** (Laughs) Touche. But at least my regress is psychological, not ontological. I'd rather have a mystery about how minds work than a mystery about how abstract objects stick together. Your "unsaturated entities" are ghosts. They have no causal power, yet they determine the structure of reality. How does a "gap" constrain the world?

  **Elena:** It doesn't constrain the world; it constrains *thought* about the world. It's a condition of intelligibility. If you deny unsaturatedness, you can't explain how we understand a sentence we've never heard before. I understand "Desdemona loathes Iago" instantly. Why? Because I grasp the unsaturated concept "loathes" and plug in the names. If I had to learn a new act-type for every sentence, language would be impossible. The generativity of thought requires that concepts be recombinable units. And for them to be recombinable without ambiguity, they must carry their own valency.

  **Marcus:** Generativity is real, but it doesn't prove Platonic gaps. It proves we have a recursive cognitive capacity. I can generate the act-type for "Desdemona loathes Iago" because I know the rules of predication. I don't need the concept to be a gappy entity; I just need to know how to *use* the word "loathes." Meaning is use, Elena. Not metaphysical geometry.

  **Elena:** But use presupposes meaning. You can't use "loathes" correctly unless there is a fact of the matter about what counts as correct use. That fact of the matter is grounded in the nature of the concept itself. If the concept were just a mark on a page or a sound wave, it would be saturated—inert. It takes the unsaturated nature of the *sense* to give the mark its life.

  **Marcus:** And I say the "sense" is just the potential for use. We're staring at the same mountain from opposite sides. You see a structure that demands completion. I see a capacity for completion.

  **Elena:** And if there is no one there to complete it? Does the mountain vanish?

  **Marcus:** The *proposition* vanishes. The truth conditions remain, grounded in the objects and properties themselves, not in a third thing called a "proposition."

  **Elena:** But truth conditions *are* propositional. To say "It is true that Desdemona loves Cassio" is to posit a unity. If that unity isn't there, there is no truth, only things.

  **Marcus:** Then perhaps truth isn't a property of propositions, but of acts of judgment in relation to the world.

  **Elena:** (Sighs) Then we are back to the beginning. You deny the unity of the content to save the mind. I affirm the unity of the content to save the truth.

  **Marcus:** And neither of us can explain how the tie ties without either magic or a regress.

  **Elena:** Precisely. Bradley would be delighted.

  **Marcus:** Bradley would say we're both wrong. Relations aren't real.

  **Elena:** (Smiling) Well, I'm not ready to dissolve the world into the Absolute just yet. But I concede this: "Unsaturated" is a dangerous word. It sounds like a description of a thing.

  **Marcus:** And "Act of Predication" sounds like an event that presupposes the very content it's supposed to create.

  **Elena:** So we stand. The relation connects, but we cannot say how.

  **Marcus:** The mind unifies, but we cannot say what it unifies.

  **Elena:** Cheers to the mystery, then.

  **Marcus:** Cheers.

  *(They clink coffee mugs. The SEP article remains open on the table, the cursor blinking on the section titled "The Problem of the Unity of the Proposition.")*
