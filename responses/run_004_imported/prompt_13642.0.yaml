answer: |-
  **MEMORANDUM**

  **TO:** Monuments and Public Naming Commission
  **FROM:** [Your Name], Commission Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Naming of the Downtown Pedestrian Bridge

  ### I. Purpose and Recommendation

  The purpose of this memo is to provide a final recommendation to the Commission regarding the proposal to name the new downtown pedestrian bridge after Major General Corwin Ashby. Following our previous deliberations, in which the Commission remained evenly divided, I have reviewed the historical record of Major General Ashby's service, the specific ethical objections raised regarding his final air campaign, and the philosophical principles underlying our criteria for civic honor.

  **Recommendation:** I recommend that the Commission **decline to name the bridge after Major General Ashby.**

  While Major General Ashby's broader service record is distinguished, the specific campaign for which he is locally celebrated involves a moral calculation that conflicts with the principles of non-combatant immunity central to modern just war theory. Naming a public structure is an act of civic honor, not merely historical record-keeping. To honor Ashby is to endorse the specific moral choices that defined his command. Given the credible argument that those choices constituted the intentional targeting of civilians as a mechanism of war, we cannot in good conscience offer him this specific honor. I propose we instead fund a permanent historical exhibit on the war elsewhere in the city, where the complexity of his legacy can be contextualized without implying moral endorsement.

  ### II. The Core Ethical Conflict

  Our division stems from two incompatible ethical frameworks used to evaluate Ashby's final campaign.

  **1. The Consequentialist Argument (For Naming)**
  Three members argue that Ashby's actions must be judged by their outcomes. The argument posits that by targeting the enemy capital's water, heat, and food supplies, Ashby induced suffering that hastened surrender. If this campaign prevented a ground invasion, the estimated 19,000 civilian deaths, while tragic, were a net savings in human life. Under this view, Ashby is a hero because he made the "hard choice" that minimized total bloodshed. His memoir confirms this was his intent: to make the population "abandon the war effort" through deprivation.

  **2. The Deontological Argument (Against Naming)**
  Three members argue that certain actions are intrinsically wrong, regardless of their outcomes. This view relies on the distinction famously articulated by philosopher Elizabeth Anscombe in her 1956 protest against Harry Truman's honorary degree. Anscombe argued that there is a fundamental moral difference between *foreseeing* civilian death as a side effect of attacking a military target and *intending* civilian death (or suffering) as the *means* to victory.

  ### III. Engaging the Anscombe Objection

  The crux of the objection against Ashby is not simply that civilians died. In war, civilian death is often foreseen as a tragic byproduct of attacking legitimate military targets (munitions plants, rail yards). This is traditionally understood under the "Doctrine of Double Effect": the death is regrettable but unintended.

  However, Ashby's own memoir clarifies that he did not merely foresee the suffering of the capital's population; he engineered it. He redirected bombing *away* from rail yards and munitions plants (legitimate military targets) and *onto* water mains, canal locks, and grain depots. He did not kill civilians to destroy a factory; he harmed civilians to break the enemy's will.

  On Anscombe's account, this distinction is absolute. Once you deliberately aim at the innocent—using their starvation and exposure as the actual mechanism to force surrender—you have crossed a moral line that consequences cannot erase. To use the lives of the innocent as a tool is to treat them as objects rather than persons. If we accept this premise, the question of whether the campaign "saved lives on net" becomes morally inert. One cannot justify the intentional killing of innocents with arithmetic. If the act is inherently impermissible, the utility of the outcome does not cleanse it.

  ### IV. Addressing the "Net Lives Saved" Counter-Argument

  Proponents of naming the bridge argue that even if Ashby's methods were harsh, the result justified them. We must take this seriously. If the campaign truly ended the war months early, Ashby's decision could be viewed as a tragic necessity rather than a crime.

  However, two factors undermine this defense in the context of a civic naming:

  1.  **Historical Uncertainty:** As noted in our briefing, historians dispute whether the campaign actually hastened the surrender or merely ran alongside other causes. To honor Ashby for a utilitarian victory that is not historically proven is to base a permanent civic monument on a hypothetical calculation.
  2.  **The Precedent of Honor:** Even if we grant the utilitarian premise that Ashby saved lives on net, a public naming serves a different function than a historical verdict. We name bridges after individuals we wish to hold up as moral exemplars for our community. If we name this bridge, we signal to our citizens that targeting civilian infrastructure to induce mass starvation is an honorable tactic, provided the strategic math works out. This sets a dangerous precedent. It suggests that the immunity of non-combatants is conditional rather than absolute.

  If Anscombe is right, the "net lives saved" argument is irrelevant to the morality of the act. If Anscombe is wrong, the argument still relies on disputed historical data. In neither case does the evidence strongly support a definitive civic honor.

  ### V. Civic Honor vs. Historical Memory

  We must distinguish between remembering history and honoring it. Declining to name the bridge after Ashby does not erase him from history. It does not deny his rank, his service, or the complexity of the war he fought. It simply states that this specific chapter of his command does not meet the threshold for *honorific* recognition.

  A middle path, such as naming the bridge but adding a plaque detailing the controversy, was considered. However, this risks diluting the moral seriousness of the issue. A plaque on an honored structure often reads as an apology for the honor, rather than a genuine engagement with the ethics. It suggests we can honor the man *despite* the act, whereas the Anscombe argument suggests the act disqualifies the honor entirely. To place a plaque explaining that the namesake intentionally starved 19,000 civilians on a bridge bearing his name is to create a dissonance that trivializes the suffering involved.

  ### VI. Conclusion and Alternative Proposal

  The Commission is tasked with upholding the values of this community. One of our foundational values is the protection of the innocent. Major General Ashby's deliberate decision to make civilian suffering the engine of his victory challenges that value.

  Therefore, I recommend we **vote against naming the bridge after Major General Ashby.**

  **Alternative Proposal:**
  To acknowledge the desire to recognize local service members without compromising our ethical standards, I propose we:
  1.  Select a name for the bridge that reflects a value (e.g., "Liberty Bridge") or a figure whose record is unambiguous.
  2.  Allocate a portion of the bridge's dedication budget to fund a permanent historical display at the local museum or archives titled "The Ashby Campaign: Strategy and Ethics." This allows us to educate the public on the difficult moral realities of the war and Ashby's role in it without conferring an unqualified civic honor.

  This path respects the service of our veterans while affirming that in our city, we do not honor the intentional targeting of civilians, regardless of the strategic rationale. It acknowledges that while war may require hard choices, not all hard choices are worthy of a monument.

  **Decision Required:** Vote on Recommendation to Decline Naming.
