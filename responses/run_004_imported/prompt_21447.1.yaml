answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of knowing our birthday boy since we were undergraduates, which means I belong to the faction of this room that remembers a time when his liver operated on a different time zone than the rest of humanity.

  But I know there are many here tonight—particularly our friends from the running club—who know him as a man of serious discipline. For the last seven years, he has traded hangovers for hydration packs and late nights for early starts. And honestly, watching him commit to that life has been inspiring.

  So, when asked to give this toast, I wanted to find a philosophical framework that could bridge the gap between the man who used to outlast everyone at the bar, and the man who now outlasts everyone on the trail. I went looking for wisdom, and I found it in the most unlikely place: Plato's *Laws*.

  It turns out, Plato had a very specific policy on wine. He argued that boys shouldn't touch it at all. Young men should use it sparingly. But once a man turns forty? Plato says you have a license to drink freely at communal feasts.

  Now, before the running club panics, and before the university crowd gets too excited, hear out his reasoning. Plato doesn't say forty-year-olds should drink to get wasted. He says they should drink to counter the "crabbedness" of age. He argues that as we get older, we become too rigid, too ashamed to sing, too dignified to dance alongside the young. A bit of controlled wine, he thought, was a medicine for the soul—a way to loosen that shame and keep us connected to joy.

  He also argued that a drinking party is a test of character. Just as facing danger tests your courage, facing intoxication tests your self-command. It isn't about indulgence; it's about proving you can be merry without losing yourself.

  [Friend's Name], you have already proven your self-command over the last seven years. You've run the miles. You've done the work. But Plato suggests that turning forty brings a new challenge: the challenge of softening. Of allowing yourself to be merry, not just disciplined. Of remembering that there is a time to put down the stopwatch and just enjoy the feast.

  So, this toast isn't a dare to return to your twenties. It's an invitation to embrace your forties with the same intentionality you brought to your running. Drink if you wish, not to escape, but to celebrate. Sing if you feel like it. Dance, even if your knees object.

  However, there is one catch in Plato's scheme. He insists that for this test of character to work, the party must be supervised by a "Symposiarch"—a master of the banquet—who remains perfectly sober to keep watch over the others.

  Fortunately, I have been handed that job tonight. I am your sober guardian. I am here to ensure that any merriment remains noble, and that no one's "crabbedness" returns unchecked.

  So, please raise your glasses. To [Friend's Name]: May your forties be loose where they need to be, strong where they must be, and may you never be too dignified to dance.

  Happy Birthday.
