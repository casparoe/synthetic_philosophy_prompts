      *   *Refinement:* Dennett distinguishes between *having* beliefs and being *treated as having* beliefs. For the hallucination case: If we say "It believes X," we predict it will assert X. It does assert X. So the stance works for prediction. But does it explain *why*? Dennett might say the "belief" is a real pattern in the input-output flow, even if the mechanism is stochastic.
      *   *Key Dennettian move:* The "belief" isn't in the weights; it's in the interaction. The hallucination is a "bug" in the pattern, but the attribution of belief is still the best tool we have to navigate the interaction, *provided* we understand the limits of the rationality.

