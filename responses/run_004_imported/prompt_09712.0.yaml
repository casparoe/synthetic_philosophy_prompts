  1.  **Analyze the User's Query:**
      *   **Subject:** Otto Neurath.
      *   **Core Tension:** The user identifies a potential contradiction between Neurath's epistemological stance (the "Neurath's Boat" metaphor, anti-foundationalism, coherence theory of truth, no neutral observation language) and his practical work on ISOTYPE (International System of TYpographic Picture Education, which seems to imply a neutral, transparent, universal way of presenting facts).
