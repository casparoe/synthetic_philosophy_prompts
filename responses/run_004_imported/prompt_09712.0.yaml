      *   *The Tension:* The user is right to spot this. If there's no theory-neutral observation language (as per the Boat/Physicalism), how can pictures claim to be a neutral medium for facts? Pictures *look* like immediate experience, but Neurath the philosopher says immediate experience is unreliable/subjective.
      *   *The Task:* The user specifically asks for the *strongest case that they don't fit*. They aren't asking for a reconciliation (yet), but rather a validation of their suspicion that there's a conflict. I need to steelman the contradiction.

  3.  **Brainstorming the Arguments for Tension:**
      *   *Argument 1: The Myth of the Given.* ISOTYPE relies on the idea that a picture of a worker is immediately understood as "worker." But Neurath's epistemology says protocol sentences (observation statements) are theory-laden. A picture is just a physical object until interpreted. Does ISOTYPE sneak in a "given"?
      *   *Argument 2: Objectivity vs. Persuasion.* Neurath wanted ISOTYPE to be socialist/utopian. He wanted to show social facts to empower the working class. But if the Boat means all knowledge is revisable and coherent, isn't ISOTYPE presenting a specific *construction* of reality as if it were *the* reality? Does it mask the theoretical choices behind the statistics?
      *   *Argument 3: Universalism vs. Context.* The Boat implies context-dependence (we repair where we are). ISOTYPE claims international legibility (context-independent). How can a symbol system be universal if meaning is always situated within a specific linguistic/conceptual framework?
