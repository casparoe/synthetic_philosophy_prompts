answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the best man and [Groom's Name]'s younger brother.

  Looking around this room, I see a pretty unique divide. On one side, we have the boatyard crew—the family and friends who know [Groom's Name] for his calloused hands, his knowledge of timber, and his ability to fix anything with an engine. On the other side, we have the lab crew—the colleagues from his years in marine biology, who know him for his research, his data, and his patience with the microscopic.

  For a long time, [Groom's Name] lived in the tension between those two worlds. As many of you know, he spent nearly three years standing at a crossroads: finish the PhD and stay in science, or leave the program to take over our late uncle's workshop.

  It was a genuinely hard choice. And because it was hard, people have asked him—and still ask him, sometimes half-joking at family dinners—whether he "wasted" his training. The implication is that there was a single scale of value, a "right" path waiting to be discovered, and by stepping off the academic track, he somehow lost points.

  I'm standing up here tonight to tell you that that question rests on a mistake.

  There is a philosopher named Ruth Chang who studies hard choices. She argues that when we face a decision like the one [Groom's Name] faced, it's not hard because we're ignorant of the facts. He knew exactly what the lab offered and what the workshop offered. And it's not hard because the options are incomparable, like choosing between a number and a color.

  It's hard because the two options are *on a par*.

  For the philosophers in the room, you know what I mean. For everyone else, it means this: The PhD life and the Boatyard life were comparable. They were both good. They were both meaningful. But neither was better than the other, nor were they exactly equal. They were different kinds of good, sitting in the same neighborhood of value.

  When choices are on a par, you cannot find the right answer by looking harder at the options. You won't discover a hidden reason that tips the scale. Instead, you have to *create* the reason.

  Chang says that resolving a hard choice is an act of self-commitment. You throw your will behind one option, and by standing behind it, you make it the right choice. You become the author of the value, rather than just the discoverer of it.

  [Groom's Name] didn't leave the lab because the boatyard was objectively "better." He left because he decided to commit to a life of building with his hands, of stewarding our family's history, of a different kind of problem-solving. And by committing to it, he made it the right path. The training wasn't wasted, because the value of that education didn't disappear; it just got integrated into a life he chose to build, rather than one he happened to fall into.

  And really, isn't that exactly what marriage is?

  If you look for a partner by trying to calculate who is objectively the "best" match on a single scale of value, you're going to be looking forever. You're treating love like a math problem where there's a solution waiting to be found.

  But [Groom's Name] and [Partner's Name] know better. They know that a relationship isn't about finding the pre-existing right answer. It's about the commitment itself that generates the reasons to stay. They chose each other not because the universe dictated it, but because they decided to stand behind that choice, to invest it with meaning, and to build a life where that choice becomes undeniable.

  They made the hard choice together. They left the lab together. They are building this future together. And by committing to it, they have made it the best possible life they could lead.

  So, to the relatives wondering if he wasted his training: He didn't waste it. He used it to build a life he could stand behind. And to the couple: May you continue to be the authors of your reasons, and may your commitment always be what makes the path right.

  Please raise your glasses. To [Groom's Name] and [Partner's Name].
