prompt: |-
  I'm taking a seminar this term on practical reason that has spent several weeks on Ruth Chang's work on hard choices — in particular her argument that what makes certain choices genuinely hard is not that the alternatives are incommensurable, lacking any common scale, but that they stand in a distinct fourth relation, being "on a par": fully comparable, yet neither better, worse, nor precisely equal. My older brother is getting married in two weeks, and I'm giving the best man speech. He spent nearly three years torn between finishing his PhD in marine biology and taking over our late uncle's boatbuilding workshop, before finally leaving the program, taking the workshop, and getting engaged to the labmate who left with him. Relatives still ask him, half-joking, whether he "wasted" his training, and I don't want to answer that by insisting he actually made the objectively better call — on Chang's view that would misdescribe the situation as badly as calling it a coin flip. I want the speech to use her distinction correctly, including her idea that resolving a hard choice is an act of self-commitment rather than the discovery of a pre-existing right answer, so that it puts the question to rest without turning the toast into a seminar recap. About half the guests are his old lab colleagues who will recognize exactly what I'm doing; the rest are boatyard friends and family who have never taken a philosophy class. Please write the speech.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Topic:** Best man speech for a brother getting married.
      *   **Context:** Brother struggled with a "hard choice" (PhD in marine biology vs. family boatbuilding workshop). He chose the workshop and got engaged to a labmate who made the same choice.
      *   **Philosophical Framework:** Ruth Chang's theory of hard choices (specifically the concept of being "on a par" and self-commitment vs. discovering a pre-existing right answer).
      *   **Goal:** Use Chang's distinction correctly to validate the brother's choice without claiming it was objectively "better" or a "coin flip." Put the "wasted training" question to rest.
      *   **Audience:** Mixed. 50% lab colleagues (will get the philosophy references), 50% boatyard friends/family (won't know philosophy).
      *   **Tone:** Warm, celebratory, accessible (not a lecture), but intellectually precise enough for the philosophers in the room.
      *   **Constraint:** Do not turn the toast into a seminar recap.

  2.  **Deconstruct Ruth Chang's Theory (for accurate application):**
      *   *Hard Choices:* Not because we lack information (ignorance) or because the options are incomparable (incommensurable).
      *   *The Fourth Relation:* "On a par." Options are comparable, but neither is better, worse, nor equal. They are in the same neighborhood of value, but different kinds of value.
      *   *Resolution:* We don't *find* the reason; we *create* the reason through commitment. By choosing, we invest the option with value. It becomes the right choice because we stand behind it.
      *   *Application to the Brother:* PhD vs. Boatbuilding. Neither is objectively superior. Choosing boatbuilding doesn't mean the PhD was "wasted." It means he committed to a life where that training informs his new path, rather than defining it.

  3.  **Determine the Speech Structure:**
