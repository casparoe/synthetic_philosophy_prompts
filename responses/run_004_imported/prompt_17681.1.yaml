      *   *Refining the Philosophy:* Avoid the term "on a par" explicitly? Maybe use it once as a wink to the lab mates but explain it immediately for the others. Actually, better to describe the *concept* without the jargon to keep it flowing, or use the jargon lightly. Let's try to weave the concept in without a definitions slide.
