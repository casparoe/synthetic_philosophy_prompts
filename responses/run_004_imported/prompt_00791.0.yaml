      *   *Initial thought:* Tell them to argue for animal rights.
      *   *Correction:* No, the assignment is to evaluate the *consistency*. They can argue the split is defensible *or* indefensible. I need to provide tools for both.
      *   *Check:* Did I address the "unconscious human" edge case? Yes, crucial for the "Marginal Cases" argument.

  8.  **Final Polish:** Ensure clear headings, bullet points for readability, and a supportive closing. (This matches the generated output structure).

