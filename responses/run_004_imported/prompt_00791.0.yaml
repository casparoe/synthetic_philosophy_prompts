          *   The "Kind" argument (Species membership).
          *   The Slippery Slope/Pragmatic line.
      *   **Explore the Critique (The "No, it's inconsistent" side):**
          *   Peter Singer/Speciesism.
          *   The Argument from Marginal Cases.
      *   **Drafting Advice:** How to turn this into a thesis. Don't just pick a side, explore the *tension*.
      *   **Encouragement:** Remind them that the confusion *is* the point of the class.

  6.  **Refining the Tone:**
      *   Avoid preaching.
      *   Avoid saying "Here is the answer."
      *   Focus on *how to think* about the answer.
      *   Keep it engaging (the user is clearly intelligent and engaged).

  7.  **Self-Correction/Review during drafting:**
