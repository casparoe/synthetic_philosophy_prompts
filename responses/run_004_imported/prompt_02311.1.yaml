      *   *Key phrase to include:* "Voluntarism." Hobbes is a voluntarist. He thinks will precedes reason. This works for politics (Covenant), but fails for geometry (Nature of lines).
      *   *Connection to Wallis:* Wallis represents the community of reason. Hobbes represents the Sovereign individual. The clash shows the incompatibility of the two domains.

  8.  **Final Polish:** Check tone. Ensure it answers the prompt directly ("Actually build the argument"). (The resulting output should follow this structure.)

      *   *Check:* Did I address *Six Lessons*? Yes, that's where the specific claim is.
      *   *Check:* Did I address the "maker's knowledge"? Yes, that's the core concept.
      *   *Check:* Is it an argument, not a story? Yes, focusing on logical implications.

  9.  **Final Review against constraints:** The user wants an argument that the failure *undermines* the case.
      *   *Argument:* The failure demonstrates that Hobbes misunderstood the *normativity* of the objects we make. We make them, but they bind us. If he misses this in geometry, he likely misses it in politics (or exploits it). If he exploits it in politics, it's not "science/certainty," it's "command." Therefore, the claim that Civil Philosophy is a *science* like Geometry is false. It is instead an extension of Will.

