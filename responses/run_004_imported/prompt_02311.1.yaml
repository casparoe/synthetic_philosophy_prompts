answer: |-
  This is a fantastic angle. Most people treat Hobbes's quadrature obsession as a sad footnote to a brilliant career—a case of *senescence* affecting a great mind. But you're right to suspect it's structural. If we take Hobbes's epistemology seriously, the "squaring of the circle" disaster isn't just an error; it is a *falsification* of the very mechanism he claims guarantees the certainty of *Leviathan*.

  Here is the argument: **Hobbes's failure to square the circle reveals a category error in his "maker's knowledge" thesis that collapses the analogy between Geometry and Civil Philosophy. It demonstrates that Hobbes conflates the *authority of the author* with the *necessity of the construction*, turning his Civil Philosophy from a demonstrative science into an act of will.**

  Here is the breakdown of that argument.

  ### 1. The Ambiguity of "Making": Construction vs. Control
  Hobbes's core epistemological claim in *Six Lessons* and *De Corpore* is that we have certain knowledge only of things we make. In geometry, we define the lines and figures; in politics, we construct the Commonwealth through covenant. Because we are the "authors" of these objects, we know their causes perfectly.

  The quadrature disaster exposes a fatal ambiguity in what "making" means.
  *   **In valid geometry:** "Making" a circle means stipulating a definition (all points equidistant from a center) and then submitting to the logical consequences of that definition. The geometer is the author of the *premises*, but a servant to the *conclusions*. Once the object is made, it has an independence that binds the maker.
  *   **In Hobbes's practice:** Hobbes treated "making" as *control*. He believed that because he posited the geometric object, he retained sovereignty over its properties. When Wallis proved him wrong, Hobbes didn't check his math; he attacked the definitions. He tried to sovereignly decree the ratio of circumference to diameter.

  **The Undermining:** If Hobbes cannot distinguish between *constructing the premises* and *controlling the conclusions* in geometry, his claim that Civil Philosophy is equally certain becomes suspect. It suggests he views the "construction" of the Commonwealth not as setting up a logical system to be analyzed, but as an act of will where the Sovereign (the Geometer) gets to decide the truth of the system. This shifts Civil Philosophy from a *science of consequences* to a *decree of power*.

  ### 2. The Problem of Public Verifiability
  Geometry, for Hobbes, is certain because it is demonstrative. You can show the work. The lines are public. The logic is replicable. This is why he uses it as the gold standard for Civil Philosophy.

  However, the Wallis-Hobbes controversy proved that Hobbes was immune to public verifiability. For 20 years, the mathematical community offered public, step-by-step refutations. Hobbes refused to engage with the steps, instead attacking the character of the mathematicians or redefining terms mid-argument.

  **The Undermining:** This behavior reveals that Hobbes's "certainty" was not derived from the *method* (demonstration), but from his *psychological conviction*.
  If the "Maker's Knowledge" thesis relies on the maker being able to verify the cause, Hobbes failed to verify the cause of his own geometric object. If he applies this same standard to Civil Philosophy, the "certainty" of the Commonwealth rests not on the logical coherence of the covenant, but on the Sovereign's refusal to admit error.
  *   **Geometry requires:** Public proof + Submission to logic.
  *   **Hobbes's Geometry offered:** Private conviction + Refusal of submission.
  *   **Therefore, Hobbes's Civil Philosophy offers:** Sovereign command + Refusal of dissent.

  The analogy breaks because the *certainty* in geometry comes from the *community's ability to verify the construction*, whereas Hobbes's political certainty comes from the *Sovereign's ability to suppress verification*. He imports the *prestige* of geometry into politics without importing the *constraints* of geometry.

  ### 3. Voluntarism vs. Rationalism
  The deepest crack in the foundation is theological/metaphysical. Hobbes is a voluntarist: he believes Will precedes Reason. This works for his politics (the Covenant is an act of Will). He tries to import this into geometry.

  But geometry is inherently rationalist. A circle is what it is regardless of your will. Hobbes's attempt to square the circle was an attempt to impose Voluntarism onto Rationalism. He wanted the Will to determine the Truth.

  **The Undermining:** If Hobbes's "Maker's Knowledge" is actually just "Voluntarist Knowledge," then Civil Philosophy cannot be a "Science" in the sense he claims.
  *   **Science (Scientia):** Knowledge of effects from known causes (necessary truths).
  *   **Hobbes's Practice:** Knowledge of effects from willed stipulations (contingent truths).

  By failing in geometry, Hobbes proved that you cannot will necessary truths. If you can't do it with lines, you can't do it with Commonwealths. If the Commonwealth is "made" by will, its stability is contingent on that will, not demonstratively certain. Therefore, *Leviathan* cannot possess the "geometric certainty" Hobbes promises. It possesses only the *authority* of the maker. He inadvertently admits that political philosophy is not about *truth*, but about *obedience*.

  ### 4. The "Sovereign Geometer" Paradox
  Finally, consider the role of the adjudicator. In Hobbes's geometry, *he* is the Sovereign. He decides when a proof is valid. In *Leviathan*, the Sovereign decides when a doctrine is valid.

  In the *Six Lessons*, Hobbes argues that geometry is certain because there is no conflict of interest. But his own life proved there *is* a conflict of interest: the ego of the maker. Hobbes could not separate his identity from his geometric constructions.

  **The Undermining:** This suggests that the "Maker's Knowledge" thesis contains a blind spot regarding the *maker*. If the maker is fallible (and Hobbes was), the "certainty" vanishes unless there is an external check.
  *   In Geometry, the external check is the mathematical community (Wallis).
  *   In Civil Philosophy, Hobbes explicitly *removes* the external check (no appeal against the Sovereign).

  By removing the check in politics while failing to submit to the check in geometry, Hobbes creates a system where error is structurally incorrigible. A science that cannot correct its errors is not a science. Therefore, his claim that Civil Philosophy is a science *like* geometry is false. It is a science *without* the corrective mechanism that makes geometry a science.

  ### Conclusion
  The quadrature disaster is not a footnote; it is a stress test that Hobbes failed. It demonstrates that his "Maker's Knowledge" thesis is actually a "Master's Knowledge" thesis. He believes that authorship grants authority over truth, rather than responsibility to logic.

  If he cannot submit to the objects he makes in geometry, why should we believe the Commonwealth he constructs in philosophy is bound by anything other than his own will? The failure proves that **you can be the author of a system without knowing its truth.** And if that is true, the central promise of *Leviathan*—that political philosophy can achieve the demonstrative certainty of geometry—collapses. It leaves us not with a science of politics, but with a geometry of power.
