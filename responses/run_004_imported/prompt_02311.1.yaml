      *   *Premise 3:* We can only know the cause perfectly if we *constructed* the object ourselves (voluntarily).
      *   *Application:* In Geometry, we draw the figures/lines. In Civil Philosophy, we construct the Commonwealth via covenant. In Physics/Natural Philosophy, God made the world, so we can't know it with the same certainty (we deal in probabilities/hypotheses).
