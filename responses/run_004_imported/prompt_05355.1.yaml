      *   *Internal Reasons:* A reason for $A$ to $\phi$ exists only if $A$ has some element in their "subjective motivational set" ($S$) that would be served by $\phi$ (perhaps after sound deliberation).
      *   *External Reasons:* Claims that $A$ has a reason to $\phi$ regardless of their $S$. Williams thinks these are false or incoherent because they lack a explanatory link to action.
      *   *Key Insight:* Reasons must motivate (or be capable of motivating) the agent.

