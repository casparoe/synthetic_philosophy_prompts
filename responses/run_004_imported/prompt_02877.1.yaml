answer: |-
  First off, major respect for actually reading the 1928 paper. You are correct that 95% of the "Ramsey quote" usage in rationalist spaces is second-hand signaling based on that single sentence. You have identified a genuine tension in the text that most gloss over.

  Here is the breakdown of how the "Bliss" maneuver fits with the "ethically indefensible" claim, why they aren't the same thing as discounting, and how to cite this without getting trapped in a Stern-vs-Nordhaus gotcha.

  ### 1. The Mathematical Necessity of "Bliss"
  You hit the nail on the head: the primary function of Bliss is to solve the **divergence problem**.

  If you set the pure time discount rate ($\rho$) to zero (as Ramsey ethically demands), and you assume the human race goes on forever, you are trying to maximize:
  $$ \int_0^\infty U(c_t) \, dt $$

  If utility is always positive (life is worth living), this integral equals infinity. If you change your savings policy, the integral *still* equals infinity. In standard calculus, you cannot compare $\infty$ to $\infty$. You cannot optimize a value that is already infinite.

  Ramsey's fix is to define $B$ (Bliss) as the maximum possible utility rate attainable. Since we can never actually reach or sustain perfect Bliss forever (due to diminishing returns or resource constraints), $U(c_t)$ is always less than $B$. He then proposes minimizing the "regret" or "shortfall":
  $$ \int_0^\infty [B - U(c_t)] \, dt $$

  Since $[B - U(c_t)]$ is always positive, this integral converges to a finite number (assuming consumption approaches Bliss fast enough). Now you can compare policies: Policy A results in a total shortfall of 500 "util-years," Policy B results in 600. Policy A wins.

  **Is this just stealth discounting?**
  No. Here is the crucial distinction:
  *   **Discounting** applies a weight to *time*. It says a util at $t=100$ counts for less than a util at $t=1$.
  *   **Bliss** applies a weight to *distance from perfection*, but treats all time equally. A shortfall of 10 utils at $t=1$ counts exactly the same as a shortfall of 10 utils at $t=100$.

  The Bliss maneuver privileges consumption paths that reach saturation faster, but it does not privilege the *present generation* over the *future generation* simply because of their temporal location. It is ethically neutral regarding time, even if it is demanding regarding efficiency.

  ### 2. The "Ethically Indefensible" Claim vs. Section II
  This is where your confusion is most warranted. Ramsey writes that pure time preference is ethically indefensible, but then in Section II, he writes down equations with a positive discount rate. Is he contradicting himself?

  **No, he is distinguishing between *pure time preference* and *probability of extinction*.**

  In Section II, Ramsey introduces a discount rate, but he explicitly links it to the probability that the community (humanity) will cease to exist.
  *   **Pure Time Preference ($\rho_{pure}$):** "I value my happiness more than my grandson's happiness simply because I am me and he is him." Ramsey calls this **ethically indefensible**.
  *   **Existential Discounting ($\rho_{risk}$):** "There is a 1% chance per year that an asteroid kills us all, in which case future utility is zero." Ramsey accepts this as a **mathematical reality**.

  Mathematically, these look identical. If you discount the future by 1% because of impatience, the equation looks the same as if you discount the future by 1% because of extinction risk.
  $$ \text{Expected Utility} = \sum e^{-(\rho_{pure} + \rho_{risk})t} U_t $$

  Ramsey's point in Section II is not "Actually, pure time preference is okay." His point is "Even if $\rho_{pure} = 0$, the *effective* discount rate might be positive due to $\rho_{risk}$."

  When he says he will "redo the exercise" with a discount rate, he is exploring the mathematical implications of a world where the future is uncertain, not retracting his ethical claim that we shouldn't be impatient.

  ### 3. How to Cite This in a Stern-vs-Nordhaus Context
  If you are entering the fray on longtermism or climate economics, here is how to wield Ramsey correctly without oversimplifying:

  **The Mistake to Avoid:**
  Don't say: *"Ramsey proved discount rates are immoral, so we must use 0%."*
  (Counter-argument: Then how do you handle the divergence problem? And what about extinction risk?)

  **The Nuanced Position:**
  1.  **On Pure Time Preference:** Ramsey's ethical argument stands. There is no moral justification for valuing a future person's welfare less than a present person's *solely* due to temporal location. This supports the Stern Review's near-zero pure discount rate.
  2.  **On Convergence (The Bliss Point):** Ramsey acknowledged that without discounting, you need a different way to make the math work (the Bliss shortfall). Modern longtermism often ignores this, assuming we can just sum infinite utils. Ramsey would tell you that you need a "goal state" (Bliss) to make the optimization coherent, or you need to accept that standard utilitarianism breaks down over infinite horizons.
  3.  **On the Effective Discount Rate:** Ramsey allows for a positive *effective* discount rate if it reflects the **probability of extinction**. This is the key bridge to x-risk.
      *   **Nordhaus** argues for a higher discount rate based on observed market returns (revealed preference). Ramsey would reject this as conflating *is* with *ought* (and ignoring market imperfections).
      *   **Stern** argues for a near-zero rate. Ramsey supports this ethically, but would add the caveat: "Unless you think there is a high probability humanity won't be there to enjoy the utility."

  ### 4. Summary for Your Mental Model
  *   **Bliss** is a technical fix for infinity, not a moral hedge. It treats all time slices equally.
  *   **Discounting** is a moral/empirical claim about the weight of future time slices.
  *   **Ramsey's Consistency:** He maintains $\rho_{pure} = 0$ is the ethical ideal. He allows $\rho_{effective} > 0$ only if justified by existential risk ($\rho_{risk}$), not impatience.

  **The "Gotcha" Defense:**
  If someone says, "But Ramsey used a discount rate in Section II!", your response is:
  > "He used an effective discount rate to model the probability of the community being extinguished, not pure time preference. He explicitly distinguishes between discounting because the future might not exist (mathematically valid) and discounting because we are impatient (ethically indefensible). The Bliss point was his method for handling the infinite horizon *without* resorting to pure time preference."

  You've done the reading most people haven't. The tension you sensed is real, but it's a tension between *ideal theory* (Section I) and *non-ideal application* (Section II), not a contradiction in his ethical core. Keep that distinction clear, and you'll be on firmer ground than most of the subthread.
