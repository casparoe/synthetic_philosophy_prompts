  2.  **Deconstruct the Absent-Minded Driver Problem (AMD):**
      *   *Setup:* Start -> X1 -> X2 -> End. Exit at X1 (payoff 0), Exit at X2 (payoff 4), Continue past X2 (payoff 1). (Payoffs vary in literature, but the structure is Bad, Best, Mediocre).
      *   *Constraint:* Driver cannot distinguish X1 from X2 and forgets if they passed X1.
      *   *Planning Stage:* Choose probability $p$ to exit at *any* intersection to maximize expected utility.
      *   *Calculation:* $U(p) = p(0) + (1-p)p(4) + (1-p)(1-p)(1)$. Maximize w.r.t $p$. Result: $p=1/3$.
      *   *Action Stage Paradox:* When *at* an intersection, what is the belief $\alpha$ that this is X1? If $\alpha = 1/2$ (principle of indifference), the expected utility calculation changes, potentially suggesting a different $p$. This is the core tension: Planning consistency vs. Action consistency.
      *   *Key Debate:* Is the probability of being at X1 well-defined? Should the driver re-optimize at the intersection?

  3.  **Identify Proposed Resolutions/Approaches:**
      *   *Consistent Planning (Piccione & Rubinstein):* Stick to the planning stage optimal $p$. Acknowledge time inconsistency but argue rational agents commit.
