answer: |-
  This is a sophisticated objection that cuts to the heart of the meta-ethical debate between naturalists and normative ethicists. You are right to be skeptical of the *phronesis* defense if it is wielded as a "just-so story" that renders the theory immune to evidence. However, the conclusion that virtue ethics (VE) is thereby reduced to pre-scientific folk psychology is too strong.

  The situationist critique was devastating when it first landed (late 90s/early 2000s), but the dialectic has moved on. To give you the "second opinion" you requested, we need to separate the empirical claims from the philosophical interpretations, and look at where the consensus currently sits.

  Here is a breakdown of why virtue ethics survives the situationist critique, though often in a modified form.

  ### 1. The Empirical Premise is Weaker Than It Used to Be
  Your argument rests on the claim that "decades of social psychology seem to have empirically demonstrated that temporally stable, cross-situationally consistent character traits basically don't exist."

  From a rationalist perspective, you should update on the fact that the evidentiary core you cited has degraded significantly in the last 15 years.

  *   **The Replication Crisis:** The Stanford Prison Experiment (Zimbardo) is now widely regarded as methodologically flawed and effectively debunked; demand characteristics and researcher intervention drove the results, not situational inevitability. Milgram's work is more robust, but modern replications (e.g., Burger, 2009) suggest obedience rates are lower than originally thought and highly sensitive to specific contextual cues that imply *legitimacy*, not just blind authority.
  *   **Trait Psychology:** The situationist critique relied heavily on Walter Mischel's 1968 critique of personality traits. However, modern psychometrics (the Big Five/Ocean model) has largely vindicated the existence of stable traits. Meta-analyses show that while single-instance behavior is noisy, *aggregated* behavior across time and situations shows significant consistency. The consensus in personality psychology is now **interactionism**: behavior is a function of both person and situation, not situation alone.
  *   **The "Average Person" vs. The *Phronimos*:** This is the most critical category error in the situationist critique. The studies you cite test *ordinary, untrained* subjects. Virtue ethics is not a descriptive theory of how people *currently* behave; it is a normative theory of how people *could* behave after extensive moral cultivation.
      *   Arguing that VE is false because average people fail Milgram's test is like arguing that the theory of athletic excellence is false because average people cannot run a 4-minute mile. The data shows that virtue is rare, not that it is impossible.

  ### 2. Global Traits vs. Local Traits
  John Doris's actual conclusion is nuanced. He does not argue that *no* traits exist; he argues that **global** traits (e.g., "Honesty" simpliciter) do not exist. He allows for **local** traits (e.g., "Honesty-when-with-friends-but-not-when-taxes-are-due").

  A sophisticated virtue ethicist can accept this without abandoning the framework. Aristotle himself acknowledges that virtues are context-sensitive.
  *   **The Charge:** If I am honest with my wife but lie to the tax collector, I lack the virtue of Honesty.
  *   **The Defense:** Aristotle would argue you lack *integration*. The goal of VE is to unify these local dispositions into a coherent whole. The situationist data shows that most people have fragmented psychologies. VE predicts this fragmentation for the unvirtuous and predicts integration for the virtuous.
  *   **Falsifiability:** This makes VE falsifiable. If we found individuals who had undergone decades of moral cultivation (monks, stoic sages, ethical experts) and they *still* showed the same level of situational fragility as undergraduates in a hurry, VE would be in trouble. Some recent studies on moral experts suggest they *do* show more consistency than controls, though the data is mixed.

  ### 3. The *Phronesis* Defense: Is it Unfalsifiable?
  Your friend's appeal to *phronesis* (practical wisdom) triggered your "unfalsifiable" alarm. You asked: *If variable behavior is explained by context-sensitivity, doesn't that explain everything?*

  It depends on how *phronesis* is operationalized. If it is defined merely as "doing the right thing," it is tautological. But in Aristotelian psychology, *phronesis* is a cognitive capacity involving:
  1.  **Moral Perception:** Noticing morally salient features of a situation that others miss.
  2.  **Deliberation:** Weighing competing goods correctly.
  3.  **Reason-Responsiveness:** Being able to articulate *why* an action was taken.

  This makes it empirically testable. A situationist predicts behavior is driven by subconscious cues (time pressure, uniforms). A virtue ethicist predicts that a *phronimos* will be less susceptible to these subconscious cues because their deliberative processing overrides the heuristic.

  *   **Example:** In the Darley-Batson Good Samaritan study, the variable was "hurry." A situationist says "hurry causes ignoring." A virtue ethicist says "a truly compassionate person integrates compassion into their time-management; they would stop even if late, or they would have planned better."
  *   **The Test:** We can test whether moral training reduces susceptibility to situational variables. If VE is true, moral education should increase cross-situational consistency. If situationism is true, moral education is mostly ineffective against situational pressure. The data here is mixed, but not decisively in favor of situationism.

  ### 4. The "Folk Psychology" Charge
  Is VE "pre-scientific folk psychology"?
  *   **Yes,** in the sense that it relies on a folk-psychological vocabulary (belief, desire, character) that some eliminative materialists reject.
  *   **No,** in the sense that it is compatible with modern cognitive science. Virtues map reasonably well onto **skill acquisition models**.
      *   Hubert Dreyfus and others have argued that Aristotelian virtue looks a lot as expert intuition in cognitive science. A grandmaster chess player doesn't calculate every move; they "see" the board differently. Similarly, a virtuous person "sees" the moral landscape differently.
      *   The situationist critique assumes virtues are supposed to be **stimulus-response reflexes** (if honest, then always tell truth). But if virtues are **skill-based competencies**, then variability is expected based on the difficulty of the "game."

  ### 5. The Intellectually Honest Conclusion
  You asked for the intellectually honest conclusion. It is not that VE is dead. It is that **naïve virtue ethics is dead.**

  The version of VE that claims "most people have stable characters" or "virtue is common" is falsified. The version that claims "character is robust against all situational pressure" is falsified.

  However, a **naturalized virtue ethics** remains a live option. It accepts the situationist data as a warning about the fragility of moral psychology. It accepts that:
  1.  Virtues are hard to cultivate and rare.
  2.  Situational variables exert massive pressure that even virtuous agents must actively manage (hence the need for *phronesis*, not just habit).
  3.  We should design institutions (situations) that support virtue rather than relying solely on individual character (a point Doris actually agrees with).

  **Summary:**
  The situationist critique successfully killed the idea that virtue is a default human state or a simple behavioral habit. It did not kill the idea that humans can cultivate robust, reason-responsive dispositions that resist situational pressure better than untrained agents.

  If you treat VE as a **developmental psychology of moral expertise** rather than a **descriptive anthropology of average behavior**, the empirical data does not falsify it. It merely raises the bar for what counts as evidence of virtue. The unfalsifiability charge only sticks if virtue ethicists refuse to specify what behavioral markers distinguish *phronesis* from mere situational reactivity. Many modern virtue ethicists (like Nancy Snow or Julia Annas) are actively working on specifying those markers to meet the scientific challenge.

  So, VE is not pre-scientific folk psychology, but it must be naturalized. It survives, but it survives chastened.
