answer: |-
  Your friend has articulated a very common intuition, often called the **pragmatic convergence objection**. On the surface, it looks like both theories offer the same practical advice: *In a borderline case, do not assert that the person is tall.*

  However, to say the debate is merely verbal or a matter of "preferred phrasing" is incorrect. While the *practical upshot* for a speaker might feel similar, the **metaphysical, logical, and semantic commitments** of the two views are radically different. Philosophers argue over them because they represent fundamentally incompatible pictures of how language relates to the world.

  Here is why there is substantive logical and semantic stake in this debate, and why your friend's reductionism misses the mark.

  ### 1. The Nature of Truth (Bivalence vs. Gaps)
  The most fundamental disagreement is about the nature of truth itself.
  *   **Epistemicism** (championed by Timothy Williamson) maintains **bivalence**. The sentence "He is tall" is either True or False. There is a fact of the matter. The property of "tallness" has a sharp boundary in the world (or in our linguistic conventions), but human cognitive limitations prevent us from locating it.
  *   **Supervaluationism** (championed by Kit Fine) rejects bivalence for borderline cases. The sentence is **neither True nor False**. There is *no* fact of the matter. The meaning of "tall" is semantically incomplete (indecisive), and until we "precisify" it (draw a sharp line arbitrarily), the sentence lacks a truth value.

  **Why this matters:** This isn't just vocabulary; it's a disagreement about reality. If Epistemicism is true, the universe is sharper than we perceive. If Supervaluationism is true, the universe (or our language's grip on it) is genuinely fuzzy. One view says our ignorance is epistemic (lack of knowledge); the other says it is semantic (lack of meaning).

  ### 2. Logical Consequences
  The two theories handle classical logic differently, which has technical ramifications for how we reason.

  *   **Epistemicism** preserves classical logic entirely. The Law of Excluded Middle ($P \lor \neg P$) holds because one side is actually true. The Sorites Paradox is solved by admitting that one of the conditional premises ("If a man of height $n$ is tall, a man of height $n-1$ is tall") is strictly **false**, even though we can't identify which one.
  *   **Supervaluationism** tries to preserve classical tautologies but changes how truth works. In Supervaluationism, "He is tall or he is not tall" is **supertrue** (true on all admissible ways of drawing the boundary), even though neither "He is tall" nor "He is not tall" is supertrue.
      *   **The Substance:** This breaks the link between the truth of a disjunction and the truth of its disjuncts. In classical logic (and Epistemicism), if $A \lor B$ is true, at least one of them must be true. In Supervaluationism, $A \lor \neg A$ is true, but neither $A$ nor $\neg A$ is true. This requires a non-classical understanding of logical connectives.

  ### 3. Higher-Order Vagueness
  This is often the strongest argument against the idea that the theories are the same. Vagueness seems to apply to itself: not only is it unclear where "tall" begins, it is also unclear where the "borderline" cases begin (the boundary between "definitely tall" and "borderline tall").

  *   **Epistemicism** handles this easily but counter-intuitively: There is a sharp boundary between "definitely tall" and "not definitely tall." We just don't know where it is either.
  *   **Supervaluationism** struggles here. If you define "definitely tall" as "true on all precisifications," you reintroduce a sharp boundary (the point where a case drops off being true on *all* precisifications). To avoid this, Supervaluationists must iterate the "definitely" operator infinitely, leading to complex logical machinery.

  If the theories were just "different vocabulary," they would handle higher-order vagueness equally well. They don't.

  ### 4. The Explanation of Ignorance
  Your friend claims both views result in "we can't say whether he's tall." But the *explanation* for this inability is diametrically opposed.

  *   **For the Epistemicist:** We can't say (know) because the boundary is **hidden**. It is a metaphysical mystery why our use of language fixes a boundary at 180.3 cm rather than 180.4 cm, but it does.
  *   **For the Supervaluationist:** We can't say because the boundary is **non-existent**. There is no mystery to explain; our usage simply didn't decide the case.

  **Why this matters:** If you are an Epistemicist, you are committed to the idea that linguistic usage determines sharp boundaries in a way that seems magical or inexplicable. If you are a Supervaluationist, you are committed to the idea that truth can exist without bivalence. These are heavy theoretical costs, and philosophers argue over which cost is preferable.

  ### 5. An Analogy
  Imagine two people looking at a map with a blurred border between two countries.
  *   **Person A (Epistemicist)** says: "The border is actually a sharp line right there, but the ink smudged, so we can't see it. Legally, this house is either in Country X or Country Y."
  *   **Person B (Supervaluationist)** says: "The treaty was written vaguely. There is no border line here until a judge draws one. Legally, this house is in neither country until further notice."

  In both cases, you can't currently file taxes in a specific country. Practically, the result is the same. But substantively, Person A believes there is a fact they are missing, and Person B believes there is no fact to be had. If a dispute arises over land rights, the legal reasoning required to solve it will be completely different depending on which theory is true.

  ### Conclusion
  Your friend is right that the **phenomenology** of vagueness feels the same under both theories (we feel uncertain). But they are wrong that the **theory** is the same.

  The debate is not about vocabulary; it is about:
  1.  **Metaphysics:** Are there sharp boundaries in nature/language?
  2.  **Logic:** Does truth distribute over disjunctions?
  3.  **Semantics:** Is meaning determined by usage that fixes boundaries, or is meaning inherently partial?

  Philosophers spend effort on this because accepting Epistemicism requires accepting "unknowable truths," while accepting Supervaluationism requires abandoning bivalence. Neither is a free move. You were right to feel that there was more at stake than just phrasing.
