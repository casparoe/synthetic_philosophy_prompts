      *   Key distinction: Logical Probability (PoI's domain) vs. Frequency/Physical Probability (Jaynes's domain).

  7.  **Self-Correction during drafting:** I need to make sure I don't just say "Jaynes is wrong about the math." I need to focus on the *Principle of Indifference*. The core failure is that PoI is supposed to be a logical rule for states of knowledge. If it requires physical symmetry arguments to work, it's not doing the logical heavy lifting Jaynes claims. It relies on *physical* indifference, not *logical* indifference.

  8.  **Final Outline:**
      1.  Intro: Paradox + Jaynes's claim. Thesis: Jaynes shifts the burden rather than solving it.
      2.  The Category Error: Mathematical vs. Physical.
      3.  The Assumption of Symmetries: Why Translation/Scale? (The "Specific Circle" objection).
      4.  The Regress of Indifference: Choosing the group requires indifference too.
