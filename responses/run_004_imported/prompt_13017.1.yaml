  Prior: $P(R_{HQ})=P(R_{S})=P(B_{HQ})=P(B_{S})=0.25$.
  Constraint: $P(R_{HQ}) / P(R_{S}) = 3$.
  If we keep $P(Blue) = 0.5$, then $P(Red) = 0.5$. Then $P(R_{HQ}) = 0.375, P(R_{S}) = 0.125$.
  Divergence calculation: The Infomin solution actually shifts probability *away* from the constrained partition to the unconstrained one to minimize the log-loss.
  Okay, I will trust the prompt's setup: Blue rises to 0.53.
  Vance's argument: This is magic. Information about *inside* Red changes belief about *being in* Red.
  Aris's argument: Keeping Blue fixed is an *active* choice to preserve a ratio that isn't warranted. Infomin finds the neutral point.

  Let's write.

  *(Drafting thought)*: Make sure they are physically present. Crouching. Mud. It grounds the abstract philosophy.

  *(Refining the "Blows")*:
  Vance needs to hit the "Relevance" angle hard. "If I tell you the engine is hot, does that change the probability the car is red?"
  Aris needs to hit the "Hidden Assumption" angle. "Saying Blue stays 50/50 is assuming independence that isn't given."

