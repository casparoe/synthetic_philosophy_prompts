answer: |-
  **Setting:** *A muddy ditch on the edge of the simulated combat zone. Rain hisses on nylon ponchos. JUDY is checking her rifle a few yards away, out of earshot. Two philosophers, ARIS and VANCE, are huddled over a laminated map, illuminated by the dying glow of a tactical radio.*

  **Vance:** It's nonsense, Aris. Look at the numbers. Before the transmission, she assigned fifty percent to Blue. Fifty to Red. Now? Because Command told her how Red is *organized*, she's supposed to believe she's *more likely* to be in Blue?

  **Aris:** Fifty-three percent. It's a shift, not a revolution.

  **Vance:** It's telepathy! The message was conditional: *If* Red, *then* three-to-one HQ. It said nothing about the boundary between Red and Blue. It said nothing about the terrain. By what right does the internal topology of Red territory suck probability mass out of Red and dump it into Blue?

  **Aris:** By the right of minimum disturbance. You're treating the prior ratio of Red-to-Blue as sacred. It isn't. It's just a starting point. The constraint you *have* is on the sub-partition of Red. To satisfy that constraint while minimizing the Kullback-Leibler divergence—

  **Vance:** —while minimizing the "information gain," yes, I know the mantra. You're maximizing entropy subject to the constraint. But you're smuggling in a metric. You're assuming that the "distance" between probability distributions behaves in a way that privileges the unconstrained variables.

  **Aris:** I'm not privileging them. I'm refusing to tamper with them *arbitrarily*. If you keep Blue fixed at point-five, you are making an active choice. You are saying, "Despite this new structural info about Red, I assert the Red-Blue boundary remains unchanged." That's an assumption, Vance. Infomin doesn't assume. It calculates the distribution that is closest to the prior *globally*, given the local constraint.

  **Vance:** Closest in what space? Logarithmic space! That's the trick. If you used Euclidean distance, you wouldn't get the shift. You'd get Judy staying put. Why is the "information geometry" of KL-divergence the true geometry of rational belief?

  **Aris:** Because it preserves the independence of irrelevant alternatives unless the evidence couples them. And here, the evidence *does* couple them, mathematically. You can't just wall off Red. The probabilities must sum to one. If you force the Red sub-states apart—from a 1:1 ratio to a 3:1 ratio—you increase the "stress" in that sector of the probability space. The Infomin solution relieves that stress by slightly contracting the Red sector overall.

  **Vance:** Stress? It's a map, Aris, not a rubber sheet. Let's push it to the limit. Suppose Command had said, "If Red, you are definitely in HQ." Probability one. According to your Infomin rule, does Judy's confidence in Blue go to one hundred percent?

  **Aris:** It goes up, significantly.

  **Vance:** Absurd! If I learn that *assuming I am in enemy territory* I am definitely at their HQ, I should not suddenly become certain I am in *friendly* territory. That's a reductio. It implies that learning more about the enemy's layout makes the enemy's territory vanish.

  **Aris:** You're confusing causal relevance with probabilistic relevance. We aren't talking about physical forces. We're talking about consistency. If you hold Blue fixed at 0.5 while forcing Red-HQ to 1.0 (conditional on Red), you are effectively saying the prior relationship between Red-HQ and Blue-HQ was more robust than the relationship between Red-HQ and Red-Second. Why?

  **Vance:** Because the message didn't touch Blue!

  **Aris:** The message didn't touch the *ratio* of Red to Blue, true. But it touched the *components* of Red. Jeffrey Conditionalization requires a partition. You don't have a partition update here. You have a constraint. If you try to force Jeffrey's rule onto this, you have to invent probabilities for the partition elements you weren't given. That's fabrication. Infomin is the only way to update without fabricating data.

  **Vance:** It's not fabrication to say "I don't know." It's fabrication to say "I know Blue is now more likely." The 1981 van Fraassen paper—the *Private Benjamin* problem—was supposed to be a puzzle, not a prescription! You're treating a known bug as a feature.

  **Aris:** It's not a bug. It's the tax you pay for being honest about uncertainty. Your intuition—that Blue should stay at 0.5—relies on the principle of rigidity. You want the odds *between* Red and Blue to stay rigid. But why should they? The evidence changes the "shape" of Red. If Red becomes "sharper," more concentrated, the most conservative global update is to treat Red as a smaller portion of the possibility space.

  **Vance:** "Sharper"? You're anthropomorphizing probability distributions. Look at Judy. *Points to the soldier.* She's cold, she's wet, and she knows nothing about the Blue/Red border. If you tell her, "Based on entropy minimization, you should hike north," you're getting her killed.

  **Aris:** I'm telling her how to bet. If she bets on Blue at even odds, she's leaving money on the table. The market—the logical space—has shifted.

  **Vance:** The market hasn't shifted! The territory hasn't shifted! Only our description of Red's interior changed. This is the heart of the objection: Infomin violates the principle of *irrelevance*. Information about $A$ given $B$ should not change the probability of $B$ unless it changes the probability of $A$ unconditionally. Here, we learned $P(HQ|Red)$. We learned nothing about $P(Red)$. Yet $P(Red)$ drops.

  **Aris:** That principle holds for independent events. These aren't independent. They're mutually exclusive exhaustive alternatives summing to unity. You cannot wiggle one without moving the others. The question is *how* they move. You want them to move proportionally to preserve the Red/Blue margin. I say that's an arbitrary constraint. Infomin says: move them as little as possible in information space. And in information space, preserving the margin costs more than shifting it.

  **Vance:** "Costs more." You keep using economic metaphors for logic. The cost is only high because you chose the logarithmic currency. If I measure distance in straight lines, your "cost" disappears. So admit it: the 0.53 drift is an artifact of choosing KL-divergence over, say, squared Euclidean distance.

  **Aris:** And I admit that Euclidean distance violates the likelihood principle and leads to sure-loss Dutch Books in sequential updating. KL-divergence is the only metric that handles sequential conditioning correctly. If you want a coherent updating rule over time, you pay the Judy Benjamin tax.

  **Vance:** So coherence requires counter-intuition?

  **Aris:** Coherence requires that you don't pretend you know less than you do. By insisting Blue stays at 0.5, you're pretending the internal structure of Red is irrelevant to the total mass of Red. Infomin reveals that it *is* relevant, structurally.

  **Vance:** It's relevant to the *entropy* of Red, not the *location* of Judy. You're conflating the map's resolution with the territory's size.

  **Aris:** In probability, resolution *is* size.

  **Vance:** *Snorts.* Then your probability space is non-Euclidean mud.

  **Aris:** It's Bayesian mud. And she's still at 0.53.

  **Vance:** And she's still wrong. Because the radio didn't say "Blue is safer." It said "Red is hierarchical."

  **Aris:** Which makes Red... distinct. And distinctness repels probability mass in a maximum entropy universe.

  **Vance:** There is no maximum entropy universe, Aris. There's just a girl in a ditch who needs to know if she's in Blue.

  **Aris:** Then tell her to bet on Blue. The odds are in her favor.

  **Vance:** The odds are in her favor only if your math is the law of God.

  **Aris:** It's the law of Consistency.

  **Vance:** *Closes the map.* It's the law of Aris.

  *Silence falls, save for the static of the dead radio. Judy looks up, waiting for an order. Neither philosopher moves.*
