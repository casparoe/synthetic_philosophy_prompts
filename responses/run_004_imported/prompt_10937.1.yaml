      *   *Address Q2 (Combination):* This is the crux. Dempster's rule is a *fusion* operator that assumes sources are independent and *correct*. Walley treats combination as *conditioning on the joint space* or *pooling*.
      *   *The "Zadeh's Doctors" Example:* Briefly explain why DS fails there (normalization on conflict) and how IP handles it (intervals expand).
      *   *Practical Advice:* For seismic data, conflict means something physical (noise, glitch, unknown source). DS hides this; IP exposes it.
      *   *Philosophy vs. Engineering:* It matters. If you need a binary decision (blast vs. quake), DS pushes you there. IP tells you "I don't know."

