answer: |-
  Good morning. Welcome.

  Looking around this room, I see a fault line. On one side, you have the engineers, the mechanistic interpretability researchers. You are knee-deep in activation spaces, pruning weights, and hunting for circuits. You have found directions in high-dimensional vector space that light up when the model processes the Golden Gate Bridge, or deception, or Python code. You call these "features."

  On the other side, you have the philosophers. You are looking at those same findings and asking: When you name that direction "the Golden Gate Bridge feature," are you discovering a joint in the carapace of the machine, or are you projecting a human category onto a mathematical cloud? Is this realism, or is it instrumentalism?

  I am here to welcome you, but also to warn you. I am a retired neuroscientist. For thirty years, I ran a lab that did in biological flesh what you are now doing in silicon. We hunted, electrode by electrode, for the so-called "grandmother cell."

  For those of you in engineering who haven't read the history: The "grandmother cell" was originally a reductio ad absurdum. It was a joke. The idea that a single neuron would fire *only* for your grandmother, and nothing else, seemed biologically inefficient, brittle, and absurd. We were skeptics. We believed in distributed coding. We believed that "grandmother" was a pattern smeared across millions of cells, a symphony rather than a solo.

  And then, the data got in the way.

  In the early 2000s, recordings from the human medial temporal lobe showed us "concept cells." Neurons that would fire for Jennifer Aniston, whether it was a picture of her, her name printed in text, or the sound of her voice. They were sparse. They were specific. They looked suspiciously like the joke we had spent our careers mocking.

  My lab spent the next two decades arguing about what this meant. Was the *concept* of Jennifer Aniston literally stored in that cell? Or was that cell just a convenient bottleneck in the readout mechanism? We never agreed. We retired. The question remained unresolved, not because we lacked data, but because we lacked a shared vocabulary for what it means for a representation to be "real."

  I mention this because I see you, the engineers, walking into the same trap. You find a feature. You name it. You publish a paper. But when pressed on whether that feature *exists* or is merely a useful heuristic for you to understand the loss landscape, many of you shrug. You say, "It predicts the behavior, so who cares?"

  And I see you, the philosophers, ready to pounce on that shrug. You are ready to declare the whole enterprise a category error, a ghost in the machine, a projection of human intentionality onto matrix multiplication.

  I am asking you both not to take those easy outs.

  It is tempting to call this dispute "merely verbal." To say that whether the feature is "real" is just semantics. I am here to tell you, based on thirty years of watching my own field stall on this exact point: It is not merely verbal. It is operational.

  If the "Golden Gate Bridge feature" is a real, causal mechanism in the network, then I should be able to ablate it and remove the model's ability to recognize the bridge. I should be able to edit it and make the model think the bridge is in London. But if that feature is merely a post-hoc projection—a way *we* carve up the activation space that the model itself does not respect—then my interventions will fail. The model will route around my edit. The ontology dictates the engineering.

  So, engineers, you cannot file this under "not my problem." You are making ontological claims every time you name a feature. You are claiming that the mathematics of the network aligns with the semantics of our world. You need to know if you are mapping territory or painting over it.

  But philosophers, you cannot file this under "not real philosophy." You cannot sit back and critique the concept of representation without grappling with the mechanism that produces it. If you want to talk about realism, you have to talk about weights. If you want to talk about intentionality, you have to talk about attention heads. The old armchair arguments about mental content have finally met a machine where we can open the hood. If you walk away from this workshop without looking at the code, you have missed the point.

  So, where do we stand?

  Since retiring, I have found myself drawn to the work of Daniel Dennett, specifically his notion of "Real Patterns." Dennett suggests that we often force a false choice between "fundamental physics" and "fiction." He argues that a pattern is real if it allows for reliable prediction and compression of the data, even if that pattern is not written into the bottom-level physics.

  A storm is not a fundamental particle. You cannot find a "storm" in the Standard Model. But a storm is real. It has causal power. It wets the ground. It knocks down trees. It is a real pattern emerging from the chaos of air pressure and temperature.

  I suspect your "features" are like storms.

  They may not be discrete, localized "grandmother cells" written in the fundamental weights of the network. They may be distributed, fuzzy, and context-dependent. But if identifying that pattern allows you to predict the model's behavior, to compress its complexity, and to intervene with reliability, then it is real enough. It is real enough to matter.

  This is the middle ground I hope you will explore this week. It is a space where the engineers accept that their "features" carry metaphysical weight, and the philosophers accept that metaphysics must be constrained by empirical mechanism.

  We are not here to decide if the AI "thinks." We are here to decide if the tools we use to describe how it works are describing something that is *there*.

  In neuroscience, we failed to close this question because we were too siloed. The physiologists didn't talk to the theorists; the theorists didn't talk to the philosophers. We published past each other. I don't want this workshop to be a parallel play of two disciplines occupying the same room.

  I want the engineers to challenge the philosophers on whether their definitions of "representation" can survive contact with a transformer. I want the philosophers to challenge the engineers on whether their "features" hold up under ontological scrutiny.

  If you leave here agreeing that the dispute is merely verbal, I will consider my tenure as host a failure. Because if it is merely verbal, then we are safe. We can go back to our labs and our seminars. But if it is not verbal—if the reality of these patterns determines whether we can trust, control, or understand these systems—then we have work to do.

  Thirty years ago, I held an electrode and waited for a neuron to tell me what it represented. Today, you hold a vector and ask the same question. The medium has changed. The mystery has not.

  Let's get to work. Thank you.
