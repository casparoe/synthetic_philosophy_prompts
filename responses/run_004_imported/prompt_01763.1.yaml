      2. Explain the EUT mapping (Log Utility).
      3. Explain the Ergodic critique (Time vs. Ensemble).
      4. Answer the specific question: It is substantive, not just terminological, because it challenges the normative status of "risk neutrality" in dynamic settings.
      5. Suggest pedagogical approach.

  8.  (Final Review of the Prompt's specific question): "whether this distinction marks a substantive difference in what rationality demands under repeated risk, or whether it collapses on reflection into a familiar fact about risk-averse preferences expressed in unfamiliar terms."
      *   My answer needs to take a stand on this.
      *   Stand: It collapses mathematically into Log-Utility EUT, *but* it marks a substantive difference in the *justification* for that utility function. It shifts the burden from "psychological preference" to "structural constraint." This is a substantive shift in decision theory foundations.

