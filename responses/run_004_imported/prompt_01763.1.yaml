prompt: |-
  In my graduate seminar on decision theory this term, one of my students—a former professional poker player who returned to academia after several years on the circuit—raised an example that has left me dissatisfied with the answer I gave in class, and I would welcome your help thinking it through properly. Consider a coin known with certainty to land heads sixty percent of the time, and suppose you are offered a long sequence of even-money bets on it: on each round you may stake any fraction of your current bankroll, heads doubles the stake and tails loses it, and you may play as many rounds as you like. I told the class that a rational, risk-neutral agent should stake their entire bankroll every round, since this is what maximizes the expected value of their wealth at each stage. My student objected that this policy amounts to near-certain ruin, since a single occurrence of tails wipes the bettor out completely, and across a long enough run the chance of tails coming up at least once approaches one, however favorable the arithmetic looked at the outset. He maintains that the fraction professional gamblers actually stake—on his account, about a fifth of the current bankroll each round, regardless of how many rounds remain—is not a symptom of risk-aversion but simply the fraction that maximizes what an individual bettor's wealth will actually do over a long career, as distinct from what happens on average across a hypothetical population of bettors who each live through a different random sequence of flips.

  What I cannot settle, and what I would like your help with, is whether my student has identified a genuine shortcoming in ordinary expected-value reasoning as applied to sequential, compounding wagers, or whether his rule simply redescribes expected-utility maximization under a suitably concave, for instance logarithmic, utility function for wealth—in which case my original answer to the class was correct after all, and the disagreement is merely terminological. He resists this redescription, insisting that even a bettor with no independent aversion to risk should still adopt his rule, once they properly distinguish an average taken across possible worlds from the average that one and the same person actually accumulates across time. I would like to understand, before the seminar reconvenes, whether this distinction marks a substantive difference in what rationality demands under repeated risk, or whether it collapses on reflection into a familiar fact about risk-averse preferences expressed in unfamiliar terms.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Graduate seminar on decision theory.
      *   **Scenario:** A biased coin ($p=0.6$ for Heads). Even-money bets (win stake or lose stake). Sequential betting, compounding bankroll. Infinite or long horizon.
      *   **Professor's Stance:** Risk-neutral agent should bet 100% (All-In) every round to maximize Expected Value (EV) of wealth.
      *   **Student's Stance:** (Former pro poker player) Betting 100% leads to almost certain ruin (Gambler's Ruin). Pros bet ~20% (Kelly Criterion). This isn't about risk aversion (utility curvature); it's about time averages vs. ensemble averages (ergodicity).
      *   **The Core Question:** Is the student identifying a genuine shortcoming in standard EV reasoning for sequential compounding wagers (ergodicity breaking), or is this just Expected Utility Theory (EUT) with logarithmic utility in disguise? Is the distinction substantive or terminological?

  2.  **Deconstruct the Mathematical Problem:**
      *   **Setup:** $W_0$ initial wealth. Bet fraction $f$.
      *   **Outcome:**
          *   Heads (prob $p=0.6$): $W_{t+1} = W_t(1+f)$
          *   Tails (prob $q=0.4$): $W_{t+1} = W_t(1-f)$
      *   **Professor's Logic (Maximize Expected Wealth $E[W_T]$):**
          *   $E[W_{t+1} | W_t] = p W_t(1+f) + q W_t(1-f) = W_t [1 + f(p-q)]$.
          *   Since $p > q$, $p-q > 0$. To maximize this, set $f=1$.
          *   $E[W_T] = W_0 (1 + (p-q))^T$. This grows exponentially.
          *   *Problem:* The probability of survival goes to 0 as $T \to \infty$ if $f=1$. One tail kills you.
      *   **Student's Logic (Maximize Growth Rate / Time Average):**
          *   Focus on geometric growth, not arithmetic mean.
          *   $W_T = W_0 (1+f)^H (1-f)^T$, where $H$ is number of heads, $T$ is number of tails (total $N=H+T$).
          *   Growth rate $g(f) = \lim_{N \to \infty} \frac{1}{N} \ln(W_N/W_0)$.
          *   By Law of Large Numbers, $H/N \to p$.
          *   $g(f) = p \ln(1+f) + q \ln(1-f)$.
          *   Maximize $g(f)$ with respect to $f$.
          *   First order condition: $\frac{p}{1+f} - \frac{q}{1-f} = 0 \Rightarrow p(1-f) = q(1+f) \Rightarrow p - pf = q + qf \Rightarrow p-q = f(p+q) \Rightarrow f^* = p-q$.
          *   With $p=0.6, q=0.4$, $f^* = 0.2$. This is the **Kelly Criterion**.
      *   **The Conflict:** EV maximization says $f=1$. Kelly maximization says $f=0.2$.

  3.  **Address the Core Philosophical/Theoretical Question:**
      *   *Is Kelly just Log-Utility EUT?*
          *   Mathematically: Yes. Maximizing expected geometric growth is equivalent to maximizing $E[\ln(W)]$.
          *   If an agent has $U(W) = \ln(W)$, they choose $f=0.2$.
          *   If an agent has $U(W) = W$ (risk-neutral), they choose $f=1$.
      *   *Is the Student's "Ergodicity" Argument Substantive?*
          *   The student argues this isn't about *preferences* (utility) but about *physics/dynamics* (time vs. ensemble).
          *   This is the **Ergodicity Economics** argument (championed by Ole Peters).
          *   Standard EUT says: "You choose $f=0.2$ because you dislike risk (concave utility)."
          *   Ergodic view says: "You choose $f=0.2$ because the time-average growth rate is maximized there. The ensemble average (EV) is irrelevant for a single trajectory through time."
          *   *Crucial Distinction:* In standard EUT, risk aversion is a *preference*. In Ergodicity Economics, the "aversion" to ruin is a *constraint of the dynamic*.
      *   *Who is right?*
          *   Mathematically, Kelly $\equiv$ Log-Utility.
          *   Conceptually, the student is highlighting that "Risk Neutrality" ($U(W)=W$) is often ill-defined in multiplicative, non-ergodic processes over long time horizons.
          *   If you bet 100%, your *expected* wealth is huge, but your *actual* wealth is almost certainly zero.
          *   The "Expected Value" is driven by vanishingly rare paths where you win every single time.
          *   The student is arguing that rationality should track what *actually happens* to the agent over time, not the weighted average of all possible worlds (most of which the agent won't experience).

  4.  **Synthesize the Answer:**
      *   **Validate the Student:** The student is mathematically correct about the outcome (Kelly fraction $\approx 20\%$). The "All-In" strategy leads to ruin with probability 1.
      *   **Validate the Professor (partially):** In standard Decision Theory (Savage/EUT), maximizing $E[W]$ *is* the definition of risk neutrality. So, technically, a risk-neutral agent *should* bet all-in.
      *   **Resolve the Tension:**
          1.  **Mathematical Equivalence:** Maximizing long-run geometric growth is mathematically isomorphic to maximizing Expected Log-Utility. So, in the language of standard theory, the student *is* describing a log-utility agent.
          2.  **Conceptual Distinction (The "Ergodic" Point):** However, the student's *justification* is different. Standard theory says "I prefer log wealth because I'm risk-averse." The student says "I prefer log wealth because that's how wealth actually grows over time in this specific dynamic."
          3.  **The "Risk-Neutral" Trap:** The term "risk-neutral" usually implies linear utility. But in a multiplicative process, linear utility implies a strategy that self-terminates. Is it "rational" to adopt a strategy that ensures you cease to exist as a bettor?
          4.  **Ole Peters / Ergodicity Economics:** Explicitly mention this literature. It directly addresses the Professor's dilemma. It argues that EUT conflates ensemble averages with time averages.
          5.  **Conclusion:** It is *both*. It collapses into Log-Utility mathematically, BUT the student's critique exposes a substantive limitation in how "risk neutrality" is often taught/interpreted in dynamic contexts. The disagreement is not *merely* terminological; it's about the normative basis of the utility function. Is the concavity a psychological preference or a structural necessity of survival?

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, respectful, nuanced. Acknowledge the professor's expertise while validating the student's insight.
      *   *Structure:*
          1.  Direct Answer: The student is mathematically right about the strategy (Kelly), but the theoretical interpretation is the crux.
          2.  The Math: Show EV vs. Geometric Growth. Show $f=1$ vs $f=0.2$.
          3.  The EUT Interpretation: Yes, Kelly = Log Utility.
          4.  The Ergodic Interpretation: Explain the Time vs. Ensemble average distinction.
          5.  The Verdict: Is it substantive or terminological? It's substantive regarding the *justification* of rationality, even if the math maps to EUT.
          6.  Recommendation for Class: Use this as a teaching moment about EUT limitations and Ergodicity Economics.

  6.  **Refining the "Substantive vs. Terminological" point:**
      *   If I say "It's just Log Utility," I dismiss the student's philosophical point.
      *   If I say "It's a new paradigm," I might overstate the break from EUT.
      *   *Balance:* The *behavior* is indistinguishable from Log-Utility EUT. However, the *rationale* challenges the standard definition of risk neutrality. Standard EUT treats the utility function as exogenous (preference). Ergodicity treats the growth rate as endogenous to the process dynamics.
      *   *Key Insight:* In a non-ergodic process, the Ensemble Average (EV) diverges from the Time Average. Rationality usually implies acting to improve one's future state. If the Time Average is what you experience, maximizing the Ensemble Average can be irrational for a single agent.
      *   *Conclusion:* The student has identified a genuine shortcoming in applying static EV reasoning to dynamic, non-ergodic processes without considering the time dimension. It is not *merely* terminological.

  7.  **Final Polish:** Check the specific numbers ($p=0.6$, even money). Kelly fraction $f^* = p - q = 0.6 - 0.4 = 0.2$. Matches student's "fifth". Perfect. Ensure the distinction between "ruin" (absorbing state) and just low wealth is clear (with $f=1$, ruin is certain upon first tail).

      *(Self-Correction during drafting)*: Wait, if $f=1$, one tail wipes you out. $W=0$. $\ln(0)$ is undefined. So Log-Utility naturally forbids $f=1$. Linear Utility allows it. The student argues Linear Utility is the wrong benchmark for *sequential* betting, not that the agent has Log Utility preferences inherently. The argument is that "Rationality" in a temporal process requires maximizing time-growth, which *looks like* Log-Utility.

      *Final Plan:*
