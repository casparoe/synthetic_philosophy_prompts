answer: |-
  This is a wonderful pedagogical dilemma, and it touches on one of the most vibrant debates currently occurring in the foundations of decision theory and economics. Your student has effectively reinvented the **Kelly Criterion**, and his philosophical objection aligns closely with the emerging framework of **Ergodicity Economics** (championed notably by physicist Ole Peters).

  To answer your specific question: **Mathematically, your student's rule collapses into Expected Utility Theory (EUT) with logarithmic utility. However, conceptually and normatively, his distinction is substantive, not merely terminological.** He is identifying a genuine limitation in how "risk neutrality" is standardly defined when applied to non-ergodic, multiplicative processes over time.

  Here is a breakdown of the mathematics, the standard EUT interpretation, and the substantive ergodic critique, which should help you frame the discussion for your seminar.

  ### 1. The Mathematics of the Wager

  Let $W_t$ be wealth at time $t$, and $f$ be the fraction of wealth staked.
  *   **Heads ($p=0.6$):** $W_{t+1} = W_t(1 + f)$
  *   **Tails ($q=0.4$):** $W_{t+1} = W_t(1 - f)$

  **The Professor's View (Maximize Expected Wealth):**
  The expected wealth after one round is:
  $$E[W_{t+1}] = 0.6 W_t(1+f) + 0.4 W_t(1-f) = W_t(1 + 0.2f)$$
  To maximize this, you set $f=1$.
  After $T$ rounds, the expected wealth is $E[W_T] = W_0(1.2)^T$. This grows exponentially.
  *However*, the probability of surviving $T$ rounds without a single tail is $0.6^T$, which approaches zero as $T \to \infty$. The massive expected value is driven by a vanishingly rare path where the agent wins every single time. For any *single* agent playing a long sequence, wealth goes to zero with probability 1.

  **The Student's View (Maximize Growth Rate):**
  The student is focusing on the geometric mean, or the time-average growth rate. After $T$ rounds with $H$ heads and $L$ tails ($H+L=T$):
  $$W_T = W_0 (1+f)^H (1-f)^L$$
  Taking the logarithm and dividing by $T$ (using the Law of Large Numbers, $H/T \to p$):
  $$g(f) = \lim_{T \to \infty} \frac{1}{T} \ln\left(\frac{W_T}{W_0}\right) = p \ln(1+f) + q \ln(1-f)$$
  Maximizing $g(f)$ with respect to $f$ yields the Kelly fraction:
  $$f^* = p - q = 0.6 - 0.4 = 0.2$$
  This matches your student's "fifth of the bankroll." This strategy maximizes the wealth the agent *actually experiences* over time.

  ### 2. The EUT Interpretation (The "Terminological" Collapse)

  In standard decision theory, we model choices under risk by maximizing Expected Utility: $\max E[U(W)]$.
  *   If $U(W) = W$ (Linear), the agent is "risk-neutral." This prescribes $f=1$.
  *   If $U(W) = \ln(W)$ (Logarithmic), the agent is "risk-averse." This prescribes $f=0.2$.

  Mathematically, maximizing the long-run geometric growth rate is **isomorphic** to maximizing expected logarithmic utility. If you walk into a standard economics department and say, "I want to maximize my time-average growth rate," they will correctly translate this as, "You have logarithmic utility."

  From this perspective, your original answer was technically consistent with the definition of risk-neutrality in static EUT. A truly risk-neutral agent (linear utility) *should* bet everything, even if it means ruin, because the "expected value" of that ruinous gamble is infinite relative to the conservative one. The standard retort is: "If you don't want to go broke, you aren't risk-neutral; you're risk-averse."

  ### 3. The Ergodic Critique (The "Substantive" Difference)

  Your student resists the "risk-aversion" label, and this is where the distinction becomes substantive. He is arguing from the perspective of **ergodicity**.

  *   **Ensemble Average (EUT):** Imagine 1 million people playing one round each. The average wealth of the group grows by 20%. This is what $E[W]$ measures.
  *   **Time Average (Student):** Imagine one person playing 1 million rounds. Their wealth trajectory follows the geometric growth rate.

  In many physical and economic systems, these two averages are not the same. The process is **non-ergodic**.
  *   **Standard EUT Assumption:** Rationality is defined by the ensemble average. If an agent prefers the time-average outcome over the ensemble-average outcome, EUT says the agent has a "concave utility function" (a psychological preference).
  *   **Ergodicity Economics Argument:** Rationality should be defined by what happens to the agent *in time*. The concavity isn't a psychological preference; it is a **structural constraint** of the dynamic.

  The student's point is that calling $f=0.2$ "risk-averse" implies that betting $f=1$ is a valid rational option that the agent is merely too timid to take. The student argues that betting $f=1$ is **irrational** for any agent who intends to continue betting, regardless of their psychological tolerance for risk, because it violates the dynamics of compounding. It is not that the agent *dislikes* the risk of ruin; it is that the risk of ruin makes the strategy objectively inferior for a single trajectory through time.

  ### 4. Resolution for Your Seminar

  You can tell your class that both perspectives are mathematically consistent but rest on different axioms of rationality.

  1.  **Mathematically:** The student is describing the Kelly Criterion, which is equivalent to Log-Utility maximization. You were not "wrong" that risk-neutrality (linear utility) implies betting the max; the student is correct that this leads to ruin.
  2.  **Substantively:** The student has identified that "Risk Neutrality" is a dangerous concept in sequential, multiplicative environments. In static one-off bets, linear utility is coherent. In repeated compounding bets, linear utility leads to self-termination.
  3.  **The Verdict:** The distinction is **substantive**. It changes the normative status of the utility function.
      *   **EUT View:** Utility functions are exogenous preferences. (I choose Log because I am cautious).
      *   **Ergodic View:** The "effective" utility function is endogenous to the environment's dynamics. (I choose Log because that is how wealth grows in this universe).

  **Recommendation:**
  Acknowledge that your initial answer relied on the standard definition of risk-neutrality in static decision theory. Concede that in *dynamic* decision theory, the student's objection is profound. The "shortcoming" in ordinary EV reasoning is that it assumes the agent can access the ensemble average (perhaps by having infinite parallel lives or infinite divisibility of risk), whereas a real agent is stuck with the time average.

  This is a perfect opportunity to introduce your students to the **Kelly Criterion** and the literature on **Ergodicity Economics** (specifically Ole Peters' work on the St. Petersburg Paradox and leverage). It validates the student's real-world intuition while grounding it in rigorous theory, showing that what looks like "risk aversion" is often just "survival."

  **Summary for the Class:**
  "Your classmate is correct that betting 100% leads to ruin. In standard theory, we call avoiding ruin 'risk aversion' (Log Utility). Your classmate argues that avoiding ruin is a requirement of rational dynamics, not just a preference. Mathematically, they lead to the same bet (20%). Philosophically, they disagree on whether the constraint comes from the *mind* of the bettor or the *math* of the market. Both views are defensible, but in a repeated game, the time-average view is often more physically relevant."
