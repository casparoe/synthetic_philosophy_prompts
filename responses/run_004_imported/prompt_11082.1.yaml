answer: |-
  This is a classic meta-ethical stalemate, effectively reenacting the debate between Bernard Williams and his critics (like McDowell, Scanlon, or Nagel). Both participants are arguing competently from established philosophical positions. Here is the move-by-move breakdown.

  **Move 1: Nadia's Definition**
  Nadia accurately summarizes Williams' core thesis: reasons must be grounded in the agent's "subjective motivational set" (SMS) to explain action.
  *   **Who's right:** Nadia is textually correct. Williams argues that external reasons are metaphysically mysterious because they cannot motivate without a psychological hook.
  *   **Who's missing what:** Theo misses the explanatory constraint Williams is prioritizing. He is judging the theory by its moral comfort rather than its ability to explain action.

  **Move 2: Theo's Moral Objection**
  Theo raises the "amoralist" objection: if internalism is true, morality loses universal grip.
  *   **Who's right:** Theo is right about the stakes. If internalism holds, morality is contingent on psychology.
  *   **Who's missing what:** Nadia isn't missing this; she accepts it. Theo misses that Williams is willing to bite this bullet to preserve metaphysical clarity.

  **Move 3: Nadia's "Broad SMS" Defense**
  Nadia argues the SMS includes latent dispositions reachable by deliberation, making "monsters" rare.
  *   **Who's right:** Nadia is right that Williams' SMS is broader than immediate desires. This mitigates the counterexample.
  *   **Who's missing what:** Theo misses the nuance of "deliberative route," treating the SMS as static rather than expandable through reasoning.

  **Move 4: Theo's Dilemma**
  Theo argues that if deliberation always finds a reason, internalism is covert externalism; if not, the monster problem remains.
  *   **Who's right:** Theo lands a strong hit here. This is the strongest philosophical challenge to Williams (often called the "objectivity of deliberation" problem).
  *   **Who's missing what:** Nadia doesn't fully address the "covert externalism" charge. If the deliberative route is objective enough to guarantee a reason, it functions like an external reason, weakening her internalist stance.

  **Move 5: Nadia's Retreat to Blame**
  Nadia argues we can use ethical language (blame/thick concepts) without committing to the agent having a reason.
  *   **Who's right:** Nadia is faithful to Williams' strategy. He separates "having a reason" from "being subject to social sanction/blame."
  *   **Who's missing what:** Theo misses Williams' distinction between reasons for action and reasons for blame. Williams argues blame is a reactive attitude, not a claim about the agent's reasons.

  **Move 6: Theo's Normativity Claim**
  Theo insists thick concepts like "selfish" lose normative force if they don't imply a reason to act otherwise.
  *   **Who's right:** Theo captures the intuition that ethical criticism implies obligation.
  *   **Who's missing what:** Theo assumes normativity *requires* external reasons. Nadia (and Williams) argues normativity can be social/practical without being metaphysical. Neither proves the other wrong here; they disagree on the nature of language.

  **Synthesis**
  Nadia wins on exegesis and internal consistency; she accurately defends Williams' system against standard objections. Theo wins on moral intuition and highlights the genuine tension in Williams' account of deliberation and thick concepts. However, neither delivers a knockout because this dispute marks the foundational split in contemporary meta-ethics. Nadia preserves explanatory clarity at the cost of moral universality; Theo preserves moral universality at the cost of explanatory clarity.

  \verdict{draw}
