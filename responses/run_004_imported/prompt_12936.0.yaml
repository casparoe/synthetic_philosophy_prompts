answer: |-
  This is an exceptionally sharp set of notes, especially for a group transitioning from the "rationalist blogosphere" metaethics to the actual academic literature. You have correctly identified that the "folk rationalist" dismissal of non-cognitivism (i.e., "Geach refuted emotivism in 1960, move on") relies on a caricature of post-1980s expressivism.

  Here is feedback structured around your three requests, followed by the strongest expressivist counter-argument to your worry about Gibbard.

  ### 1. Accuracy Check: Blackburn and Gibbard
  **Verdict: Fair and conceptually sound.**

  *   **Blackburn:** Your summary of his project in *Spreading the Word* and *Ruling Passions* is accurate. He is indeed trying to construct a "logic of attitudes" where validity is defined by the inconsistency of combined mental states (e.g., you cannot disapprove of X and disapprove of "not disapproving of X" without a kind of pragmatic contradiction). The "tree-structured notation" you're half-remembering is likely his formal semantic framework for handling the compositional structure of complex attitudes, but your conceptual grasp (validity as impossibility of holding premises' attitudes while rejecting conclusion's attitude) is the crucial part, and you have that right.
  *   **Gibbard:** Your summary of *Thinking How to Live* is also correct. Gibbard explicitly moves toward a truth-conditional semantics indexed to world-norm (or world-hyperplan) pairs. He grants that normative sentences have truth conditions to save classical logic.
  *   **Nuance:** A specialist might nitpick that Gibbard doesn't just "import classical logic off the shelf"; he argues that the *structure* of planning rationality mirrors logical consistency. But for the purposes of your notes, your characterization holds up.

  ### 2. The Objection: Is this "Creeping Minimalism"?
  **Verdict: Yes, this is a recognized and potent objection, not a conflation.**

  You have effectively reinvented (or independently derived) the core of James Dreier's "Creeping Minimalism" (2004) and related objections by Russ Shafer-Landau and others.

  *   **The Tension:** The traditional selling point of expressivism was that it avoided the metaphysical queerness of moral truth conditions. If Gibbard grants that "Lying is wrong" has truth conditions (relative to a hyperplan), the semantic gap between him and a moral realist narrows significantly.
  *   **Dreier's Point:** Dreier argues that if expressivists adopt truth conditions, propositions, and beliefs (as Gibbard and later Blackburn do), they risk becoming "crypto-cognitivists." The distinction between "believing a moral fact" and "accepting a norm" collapses if both are treated as truth-apt states with the same logical role.
  *   **Your Specific Worry:** You worry that the *explanatory work* (explaining motivation without facts) is relocated from semantics to psychology. **This is exactly right.** Gibbard's move is to say: "Semantics handles logic; Psychology handles motivation."
  *   **Is it a problem?** Many critics say yes. If the semantics looks like cognitivism and the logic looks like cognitivism, what is left of the "anti-realist" claim? Gibbard's answer is that the *nature of the mental state* is different (planning vs. representing), even if the *semantic value* is truth-conditional. Whether that distinction is robust enough to matter is the central debate in contemporary metaethics.

  ### 3. Clarity Check
  **Verdict: Intelligible to a sharp friend, with minor caveats.**

  For a friend who knows the fact/value distinction but not Frege-Geach:
  *   **The Frege-Geach explanation is excellent.** The "unasserted context" example is the standard way to introduce it, and you handled it clearly.
  *   **"Hyperplan":** This is the one term that might trip a layperson up. You might add a parenthetical gloss: *(a complete, maximal plan for what to do in every possible contingency)*.
  *   **"Fat index":** This is good technical shorthand, but ensure your friend knows an "index" in semantics usually means the parameters (like time or world) relative to which a sentence is evaluated.
  *   **Overall:** The notes are dense but precise. They read like a good grad student's prep sheet.

  ---

  ### The Strongest Expressivist Reply (Blocking the Worry)

  You asked for the strongest version of the reply rather than a concession. Here is how a sophisticated Gibbardian (or a B-type expressivist like Mark Schroeder) would block your worry that the view "ceases to be expressivism in any metaphysically interesting sense."

  **1. Deflationism about Truth is the Shield**
  The worry assumes that "truth conditions" imply "robust moral facts." Gibbard (and Dreier, ironically) relies heavily on **deflationism**.
  *   **The Argument:** To say a sentence has "truth conditions" is just to say it behaves grammatically like a statement. It does *not* imply there is a "moral fact" in the world that the sentence corresponds to.
  *   **The Move:** Gibbard can say: "Yes, 'Lying is wrong' is true relative to hyperplan H. But 'true' here is just a device for endorsement. It doesn't posit a spooky property of *wrongness* out in the universe."
  *   **Why it blocks the worry:** It allows Gibbard to have his cake (classical logic, truth conditions) and eat it too (no ontological commitment to moral facts). The "metaphysically interesting sense" of expressivism isn't the *absence of truth conditions*, but the *absence of representational content*.

  **2. The Psychology is the Metaphysics**
  You worry that the work is "relocated" to a non-semantic story about hyperplans. The Gibbardian reply is: **"That is exactly where the work belongs."**
  *   **The Argument:** Semantics is supposed to explain logic and inference. Psychology is supposed to explain motivation and action.
  *   **The Move:** A cognitivist (realist) has to explain why believing a moral fact *motivates* you (the Internalism problem). They often fail or have to posit a mysterious connection between reason and desire.
  *   **The Expressivist Advantage:** Gibbard explains motivation by definition: To judge "lying is wrong" *just is* to accept a plan against lying. There is no gap between judgment and motivation to bridge.
  *   **Why it blocks the worry:** Even if the *semantics* looks cognitivist, the *metaphysics of mind* remains distinctively expressivist. The "practical, motivation-involving character" isn't a puzzle to be solved; it's the starting datum. By relocating the work to the theory of hyperplans (planning states), Gibbard preserves the core insight: Moral judgment is a species of practical rationality, not theoretical rationality.

  **3. "Saving the Distinction"**
  Dreier eventually argued that we should judge views by their **explanatory utility**, not their labels.
  *   **The Reply:** If Gibbard's view explains logic better than Blackburn's (by using classical semantics) *and* explains motivation better than Realism (by grounding judgment in plans), then it doesn't matter if it *looks* like cognitivism semantically. It earns the title "expressivism" by solving the problems expressivism was created to solve, regardless of whether it uses the word "true."

  **Summary for your group:**
  Your worry is the cutting edge of the debate. The counter-move is to insist that **truth is lightweight** and **judgment is practical**. If you grant those two, Gibbard can have truth conditions without moral facts, and the view remains expressivist in the only way that matters: it grounds normativity in the nature of agency (planning), not the nature of the universe (facts).

  *(Suggested reading for the next meeting: Mark Schroeder's "Being For: Evaluating the Semantic Program of Expressivism" — he argues expressivists should embrace truth conditions fully, essentially arguing for the position you are worried about as a feature, not a bug.)*
