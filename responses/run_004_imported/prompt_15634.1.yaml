answer: |-
  To view Henry Sidgwick's involvement with the Society for Psychical Research (SPR) as a Victorian eccentricity distinct from his philosophical magnum opus, *The Methods of Ethics*, is to misunderstand the architectural integrity of his thought. It treats the philosopher of ethics as a man of pure reason and the psychical researcher as a man of superstition, ignoring the fact that Sidgwick was, above all, a man of coherence. The connection between the two endeavors is not merely biographical; it is structural. Sidgwick's psychical research was the empirical wing of his ethical project, a desperate but rational attempt to solve the "Dualism of Practical Reason." Without the possibility of empirical evidence for post-mortem sanctions, Sidgwick feared that the "Cosmos of Duty" would inevitably be "reduced to a Chaos." To understand why a search for ghosts was necessary to save utilitarianism, one must understand why Sidgwick believed that a purely normative system cannot stand if it contradicts the dictates of rational self-interest.

  The core of Sidgwick's ethical system rests on intuitionism. He argues that certain moral axioms are self-evident to mature reason. Chief among these are the axiom of Prudence (one ought to aim at one's own good) and the axiom of Benevolence (one ought to aim at the universal good). In *The Methods of Ethics*, Sidgwick demonstrates that Utilitarianism flows logically from Benevolence. However, he also grants that Rational Egoism flows logically from Prudence. Both are rational methods; both claim the authority of reason.

  The crisis arises because, in the observable natural world, these two methods frequently diverge. History and daily life demonstrate that acting for the universal good often entails significant sacrifice of one's own happiness, while acting for one's own interest often requires neglecting the universal good. If reason commands me to maximize my happiness (Egoism) and simultaneously commands me to maximize universal happiness (Utilitarianism), and if these two goals are mutually exclusive in a given instance, then reason is at war with itself. This is the Dualism of Practical Reason. For Sidgwick, this was not a minor puzzle but a fundamental threat to the rationality of morality. If the moral law requires self-sacrifice without compensation, then the egoist is not being irrational by ignoring it; rather, the universe is constructed such that rationality is fragmented. As Sidgwick famously wrote, if this dualism cannot be resolved, "the Cosmos of Duty is thus really reduced to a Chaos."

  To resolve this dualism, Sidgwick needed a guarantee that Duty and Self-Interest ultimately coincide. He needed to know that the sacrifice of happiness in this life would be compensated by happiness in the long run. Traditionally, this guarantee was provided by religion: God ensures that virtue is rewarded and vice punished, typically through an afterlife. Kant had similarly postulated God and Immortality as necessary conditions for the coherence of the moral law. However, Sidgwick was a rigorous empiricist who could not accept theological dogmas on faith. He required evidence. If the coincidence of duty and interest depends on an afterlife governed by moral laws, then the existence of that afterlife becomes a matter of urgent philosophical necessity, not just religious curiosity.

  This is where the Society for Psychical Research enters not as a hobby, but as a research program essential to the completion of his ethics. Sidgwick turned to psychical research because it offered the possibility of *empirical* proof of survival after death and, potentially, evidence of a moral governance of the universe. If telepathy or apparitions could be scientifically verified, they would breach the materialist worldview that confines consequences to the biological lifespan. If survival were proven, the calculus of Rational Egoism changes: the "self" whose interest must be maximized extends beyond the grave. If further evidence suggested that moral behavior influences one's post-mortem state, then the Egoist and the Utilitarian would converge. The rational pursuit of self-interest would mandate the pursuit of the universal good. Thus, the SPR was an attempt to secure the "independent guarantee" Sidgwick deemed necessary to unify practical reason.

  The remaining philosophical hurdle is the prompt's crucial challenge: How can a contingent empirical discovery about ghosts or telepathy bear on settling what looks like a purely normative dispute? Does not this approach commit the naturalistic fallacy, deriving an "ought" from an "is"?

  Sidgwick's position avoids this fallacy by distinguishing between the *validity* of moral axioms and the *rationality* of adhering to them. Sidgwick does not argue that empirical facts create moral duties. He holds that the duty to pursue the universal good is self-evident and a priori; it does not depend on the existence of ghosts for its truth. However, the *binding force* of that duty upon a rational agent does depend on the structure of the universe.

  Consider the distinction between a law's validity and its enforcement. A statute is legally valid regardless of whether there is a police force to enforce it. However, for a rational actor calculating the prudence of obeying the statute, the existence of a police force is empirically crucial. If there is no enforcement, the rational egoist may choose to break the law. Similarly, for Sidgwick, the moral law is valid regardless of empirical facts. But if the universe is such that following the moral law leads to net misery for the agent, then the "law" of Prudence commands the agent to break the moral law. Reason becomes schizophrenic.

  Therefore, empirical facts about the cosmos (such as survival after death and moral retribution) do not generate the duty, but they determine whether the duty is *sustainable* within a unified system of rationality. They bridge the gap between the "Moral Ought" and the "Prudential Ought." If empirical investigation reveals a universe where virtue is naturally rewarded (via survival and spiritual progression), then the egoist has a self-interested reason to be benevolent. The empirical fact does not create the value of benevolence, but it removes the rational barrier to practicing it. It transforms morality from a noble but potentially self-destructive impulse into a coherent strategy for living.

  Sidgwick's tragedy was that the evidence never materialized to his satisfaction. He remained an agnostic, living with the "Chaos" he feared, refusing to believe without proof even when belief was philosophically comforting. Yet, this refusal underscores the unity of his life's work. He did not turn to psychical research because he was gullible; he turned to it because he was a consistent philosopher who recognized that his ethical system hung in the balance. To separate the SPR from *The Methods of Ethics* is to ignore Sidgwick's deepest insight: that ethics cannot be fully rational if the universe is fundamentally hostile to the happiness of the good. His hunt for apparitions was a hunt for the coherence of reason itself, an attempt to ensure that the Cosmos of Duty was not a hallucination, but a reality grounded in the very fabric of existence.
