      *   *Charity Principle:* Hirsch relies on a principle of charity. Ordinary speakers (and even philosophers) are usually right about what exists in their own context. If a universalist says "there is a fusion of shoe and tower," they are speaking a language ($L_U$) where that's true. If a nihilist says "there isn't," they are speaking ($L_N$). Both are true *in their respective languages*.
      *   *Deflation:* Since no language is metaphysically privileged, there is no "fact of the matter" about which one is *really* right. The dispute is merely verbal.
      *   *Key Analogy:* Conceptual schemes (like Carnap, but applied to quantifiers).
