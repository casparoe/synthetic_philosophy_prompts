      *   *Refinement on Chalmers:* Chalmers distinguishes between "ordinary" existence and "fundamental" existence. He is sympathetic to Hirsch regarding ordinary language but sympathetic to Sider regarding fundamental ontology (though he worries about epistemic access). I need to capture this nuance. Chalmers's 2009 paper "Ontological Anti-Realism" is relevant here. He argues that if a dispute is verbal, we should resolve it by precisification. If no precisification yields agreement, it's non-verbal.

  7.  **Drafting the Content (Mental or Scratchpad):**
