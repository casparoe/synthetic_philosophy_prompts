      *   He distinguished between Natural Selection (survival) and Sexual Selection (reproduction).
      *   He was accused of anthropomorphizing females (giving them "taste").
      *   He valued explanations that linked variation to survival/reproductive success.

  5.  **Synthesize the Reaction:**
      *   *Initial Reaction:* Relief/Vindication. The "sick" feeling about the peacock tail goes away because there's a logical mechanism.
      *   *On Female Choice:* Darwin would feel vindicated. He argued females choose. Zahavi explains *why* they choose (good genes). It validates Sexual Selection as distinct from Natural Selection.
      *   *On Wallace:* Darwin would argue this proves Wallace wrong about the mechanism (it *is* female choice), but Wallace right about the underlying rigor (it's not arbitrary beauty, it's quality).
      *   *The "Aesthetic" Issue:* Darwin might refine his view on "taste." It's not art appreciation; it's instinctual selection for fitness. This bridges the gap.
      *   *Conclusion:* It mostly favors Darwin's framework (Sexual Selection exists) but refines his reasoning to satisfy Wallace's demand for utility.

