  2.  **Deconstruct the Historical Positions:**
      *   **Darwin:** Proposed *Sexual Selection* in *The Descent of Man* (1871). He argued that traits like the peacock's tail evolved because females *preferred* them. He attributed "aesthetic taste" or choice to the females. He was frustrated that natural selection (survival) couldn't explain these costly traits.
      *   **Wallace:** Rejected female choice/aesthetic taste. He believed natural selection was all-encompassing. He argued that bright colors or ornaments must have some survival value (e.g., species recognition, vigor indicator) or were byproducts of physiology. He thought attributing "taste" to animals was unscientific anthropomorphism.
      *   **Zahavi (1975):** The Handicap Principle. Costly signals are *honest* because only high-quality individuals can afford them. It explains *why* the preference exists (it provides information about genetic quality) and *why* the trait is costly (the cost ensures honesty).

  3.  **Evaluate the Handicap Principle against Darwin vs. Wallace:**
      *   *Does it support Darwin?* Yes, in the sense that it validates female choice. It explains *why* females choose the tail (it signals good genes), confirming that female preference is the driving mechanism. It vindicates his idea that "aesthetic" choice is a real evolutionary force.
      *   *Does it support Wallace?* Yes, in a tricky way. Wallace wanted a utilitarian explanation. The Handicap Principle provides a utilitarian *underpinning* to the choice. The tail isn't just "pretty"; it's information about survival capability. It removes the need for abstract "aesthetic taste" and replaces it with selection for genetic quality.
      *   *Nuance:* Wallace specifically hated the idea of female *choice* based on beauty. Zahavi says the choice is based on *quality*, but the mechanism is still female preference for a costly trait. However, Wallace often argued the colors were for species recognition or direct survival. Zahavi admits the trait is a survival *handicap*, which Wallace would hate, but the *selection* is for survival genes, which Wallace would like.

  4.  **Analyze Darwin's Reasoning Style:**
      *   Darwin was meticulous, accumulative, and open to mechanisms but grounded in observation.
