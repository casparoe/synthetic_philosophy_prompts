  9.  (Self-Correction during drafting): Make sure to emphasize that Zahavi's principle *requires* female choice. Wallace explicitly rejected female choice. Therefore, it is fundamentally a win for Darwin's *mechanism*, even if the *logic* is more utilitarian than Darwin's original "beauty" argument.

