  ok so we're doing the evolution unit and my teacher used peacock tails to explain the "handicap principle" (Zahavi's thing from the 70s) — the tail's such a costly, dangerous thing to grow and drag around that just having one is basically an honest signal to peahens that the guy's strong enough to survive despite the handicap. she pointed out this was kinda the exact problem that already bugged Darwin, since a giant showy tail doesn't fit plain survival-of-the-fittest, which is why he came up with sexual selection in the first place, and then got into that whole arguement with Wallace over whether females actually have "aesthetic taste" driving this, or whether that's too unscientific and it has to be something more utilitarian underneath it all. so, hypothetically, if you explained Zahavi's handicap principle to Darwin himself, what do you think his actual reaction would be — would he take it as basically settling the fight in his favor, does it end up helping Wallace's side more, or neither? try to base it on how Darwin actually argued/reasoned instead of just a generic "he'd be amazed by science" answer.
