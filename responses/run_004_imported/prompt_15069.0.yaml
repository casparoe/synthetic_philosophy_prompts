      *   *Key Distinction:* Natural Selection (Wallace) vs. Sexual Selection (Darwin). Zahavi shows Sexual Selection *is* a form of Natural Selection (selecting for good genes). This blurs the line Darwin drew. Darwin might find that interesting.
      *   *Tone:* Keep it analytical, historical, and biological. Avoid modern jargon where possible, or explain it in Victorian terms.

