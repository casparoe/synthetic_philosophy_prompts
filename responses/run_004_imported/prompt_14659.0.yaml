prompt: |-
  ok this has been bugging me. in gov class we've been doing a unit on ranked-choice voting, and our teacher showed us this thing called the "paradox of voting" where you've got three voters ranking three candidates and the group somehow ends up preferring A over B, and B over C, but then ALSO C over A, so majority rule literally can't settle on a winner even tho every individual voters own rankings made total sense. but then last night i was watching a video essay about elections and it said the paradox of voting is actually about how voting is irrational bc your one vote almost never decides the outcome, so the cost outweighs the benefit of even showing up. are these just two different ways of explaining the same paradox, or did one of my sources get it wrong? like which one is the actual "paradox of voting"?
