      *   *The User's Objection:* "I can just decline the bet." This is the standard "pragmatic" objection.
      *   *The Philosophical Counter:* The DBA isn't primarily about *money*; it's about *consistency*. It's a *reductio ad absurdum* of incoherent beliefs. The "bet" is a metaphor for how you act on your beliefs.
      *   *Relevance to Prediction Markets:* Prediction markets *do* force exposure. If you post odds, people *can* take them. In an internal market, if you say "70%" but act like "90%," you get exploited (lose points).

