  6.  **Refining the Feedback:**
      *   *Reichenbach:* You state Reichenbach's rule "solves the problem." In the literature, this is considered a *proposal* that fails because of the trade-off between narrowness and reliability (sample size), and because there can be multiple equally narrow classes. You need to critique the rule, not just report it.
