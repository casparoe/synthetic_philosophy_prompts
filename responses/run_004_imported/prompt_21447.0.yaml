answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of knowing our birthday boy since our university days.

  When I was asked to give this toast, I wanted to find a justification for tonight that was worthy of the milestone. Forty is a serious number. So, I went to the library. I actually cracked open a Penguin Classic of Plato's *Laws*. And I found something remarkable.

  It turns out, Plato had a very specific policy on wine. He believed young men should be protected from it. But he argued that once a man turns forty, he has earned a license to drink freely at communal feasts. Now, before the running club contingent worries, and before the old university crowd gets too excited, hear me out on his reasoning.

  Plato didn't think forty-year-olds should drink to get wasted. He argued that as we age, we naturally become more rigid—what he called "crabbed." We take ourselves too seriously. We stop singing. We stop dancing. We lose the ability to loosen our shame and connect with the younger generation. So, he prescribed wine not as an indulgence, but as a medicine against stiffness. It's a tool to keep the soul soft and joyful.

  For the last seven years, [Friend's Name] has treated his body like a temple of discipline. To the running crowd: know that Plato isn't asking him to abandon that. He's asking him to trust that he's strong enough now that a little celebration won't break him. And to the old university crowd: know that this isn't a dare to return to our twenties. This is an invitation to grow up, not old.

  But here is the catch, and this is the part that matters most. Plato insists that this "freedom" is actually a test of character. He says a drinking party is a trial of self-command, exactly like facing danger is a trial of courage. But—and this is crucial—it only works if it is supervised. You cannot have a test of moderation if everyone is drunk. There must be one sober guardian, an Archon of the Symposium, who keeps watch to ensure the merriment doesn't turn into chaos.

  So, [Friend's Name], according to the highest philosophical authority, you now have permission to be merry. You have permission to loosen the shame that keeps you from singing and dancing with us. But I have also been handed a specific job tonight. I am your sober guardian. I am the one who stays clear-headed to ensure that your forty-first year begins with joy, not regret.

  So, if Plato is right, tonight is not about excess. It's about proving that you can handle the freedom that comes with age.

  Ladies and gentlemen, please raise your glasses. To [Friend's Name]: May you never be too old to dance, too serious to sing, and may I be a vigilant enough friend to keep you from proving Plato wrong.

  Happy Fortieth.
