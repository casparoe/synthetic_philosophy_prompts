answer: |-
  This is a profound literary lineage to draw from. George Eliot (Mary Ann Evans) is perhaps the supreme novelist of exactly this transition: the migration of religious energy into secular channels. The danger you rightly identify is didacticism—creating a mouthpiece rather than a human being.

  To make your protagonist's morality feel *earned* rather than *asserted*, you need to root her ethics in the specific psychological and metaphysical consequences of her loss of faith, using Eliot's framework. It isn't that she decided to be good; it's that she realized she has no other choice.

  Here are the key implications of Eliot's post-Christian ethics for writing your character, focusing on how to dramatize them on the page.

  ### 1. The Weight of Finitude (The Stakes are Higher)
  For the evangelical characters, a moral failure is a stain on the soul that can be washed by grace. Death is a transition, not an end. For your protagonist, following the Myers anecdote, death is the full stop.
  *   **The Implication:** Her moral urgency must stem from the **irreversibility** of life. If there is no afterlife to correct injustices, *we* must do it now. If there is no heaven to comfort the suffering, *we* must be the comfort.
  *   **How to Write It:** Don't have her lecture on mortality. Show her reacting to loss differently than the believers. When a tragedy strikes, the believers might say, "They're in a better place," or "God has a plan." Your protagonist should feel the cold weight of the finality. Her moral action should feel like a desperate attempt to hold back the dark because she knows no one else is coming to help. The intensity comes from the lack of a safety net.

  ### 2. Duty as Intrinsic, Not Transactional (The Cummings Critique)
  Eliot's critique of Dr. Cummings was that hellfire theology makes morality a transaction: *I behave so I don't burn.* It externalizes the conscience.
  *   **The Implication:** Your protagonist's morality must be **non-transactional**. She cannot expect reward, recognition, or cosmic balance. In fact, she should expect the opposite. In an indifferent universe, doing the right thing often leads to personal disadvantage.
  *   **How to Write It:** Put her in situations where "sinning" (by her old standards) would be easier, safer, and undetectable by God or community.
      *   *Example:* A believer might return a lost wallet because "God sees." She should return it because the *owner's suffering matters*.
      *   *The Earned Aspect:* Show the cost. Show her tiredness. It is exhausting to be the only person who believes the stakes are real. If she seems to enjoy her own righteousness, she's a Pharisee. If she seems burdened by the necessity of it, she's Eliotian.

  ### 3. Feuerbachian Reclamation (God is Projected Humanity)
  Feuerbach argued that theology is anthropology; the qualities we worship in God (love, mercy, justice) are actually the best qualities of our own species, projected outward.
  *   **The Implication:** She shouldn't feel she *lost* the sacred; she should feel she **reclaimed** it. The "divine" spark she prayed to was her own capacity for empathy all along.
  *   **How to Write It:** Give her moments of secular sacrament. When she cares for a sick neighbor or listens to a friend, describe it with the reverence she once reserved for prayer. She isn't "helping a person"; she is tending to the only temple that exists.
      *   *Avoid:* "I don't need God, I have me." (This is ego).
      *   *Aim for:* "God was never there, but the love I felt was real, and it belongs to us." This allows her to treat others with a holiness that the actual believers, in their judgment, have lost.

  ### 4. Sympathy as Cognitive Labor (The "Web")
  Eliot's realism relies on the idea that we are all connected in a web of cause and effect. For her, "sympathy" wasn't just feeling bad; it was the intellectual work of imagining the interior life of another person.
  *   **The Implication:** Her moral seriousness should manifest as **curiosity** rather than judgment. Evangelicalism often categorizes people (Saved/Lost, Sheep/Goat). Her ethics require her to see the complex causality behind people's actions.
  *   **How to Write It:** Use Free Indirect Discourse to show her struggling to understand her antagonists. When a believer judges her, she shouldn't just think "they are wrong." She should think, "What fear makes them need to judge me? What pain are they protecting?"
      *   *The Earned Aspect:* This is hard work. Show her failing at it. Show her getting angry and having to consciously choose empathy. That struggle makes the morality earned.

  ### 5. The Absence of Providence (No Plot Armor)
  In evangelical narratives, things happen for a reason. In Eliot's post-Christian view, things just happen.
  *   **The Implication:** She cannot trust that "justice will prevail." She has to *make* it prevail, and she might fail.
  *   **How to Write It:** Create a plot point where a "prayer" is answered for a believer through coincidence, reinforcing their faith. For your protagonist, acknowledge the coincidence but refuse the meaning.
      *   *Scene Idea:* A believer gets a job after praying and sees it as provision. Your protagonist gets the same job through hard work and networking, knowing it could have been taken away by a layoff at any moment. Her gratitude is more fragile, and therefore more precious. She knows how easily it could not have happened.

  ### 6. The Danger of the "Secular Saint"
  The biggest risk is making her a martyr who is always right. Eliot's characters (Dorothea Brooke, Maggie Tulliver) are morally intense but often flawed, sometimes misguided by their own intensity.
  *   **The Implication:** Her moral seriousness should sometimes be a **liability**. Without the doctrine of grace, she might hold herself to an impossible standard, leading to burnout or harshness toward herself.
  *   **How to Write It:** Give her a moment of collapse. The weight of being the "only adult in the room" should crush her occasionally. She needs a moment where she admits she wants the comfort of belief, even if she can't have it. This vulnerability prevents her from becoming a "secular humanist parachute." She isn't there to save the believers; she is there to share the burden of existence.

  ### Summary Checklist for the Character Arc
  To ensure this feels earned:
  1.  **Grief First:** Establish that her atheism is a loss, not a liberation. She mourns the cosmic order. The morality grows out of the grief.
  2.  **Consequences:** Show her suffering for her ethics in ways the believers do not. The believers have the comfort of faith; she has only the cold clarity of duty.
  3.  **Human Sacredness:** Describe human interactions with the sensory detail she once used for spiritual experiences. The "holy spirit" is now the look in a lover's eye or the hand of a friend.
  4.  **No Superiority:** She must recognize that her morality is not "better" because she is better, but because the stakes are higher. She should pity the believers their reliance on cosmic crutches, not condemn them.

  By anchoring her ethics in the **tragedy of finitude** rather than the **triumph of reason**, you align her with Eliot's vision. Her goodness isn't a philosophy; it's a response to the silence of the universe.
