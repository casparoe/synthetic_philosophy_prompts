          *   The Off-Path Problem: If CKR holds, deviation is probability 0.
          *   Conditioning on probability 0 events is undefined in standard probability/epistemic logic.
          *   Sugden/Pettit: If P1 passes, P2 must update. If P2 updates to think P1 is irrational, BI collapses. If P2 maintains P1 is rational, P2 is ignoring evidence.
          *   Reny/Binmore: The assumption implies players cannot learn from history.
      *   **Section 3: Assessing the Counterfactual Defense:**
