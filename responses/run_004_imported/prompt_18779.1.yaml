  7.  **Final Plan:**
      *   Thesis: The critics are right. Aumann's proof works only by defining rationality in a way that immunizes it against empirical falsification within the game, rendering the "knowledge" aspect vacuous.
      *   Structure: Intro -> Aumann's Formalism -> The Off-Path Critique -> The Counterfactual Defense & Rebuttal -> Implications for Epistemic Logic -> Conclusion.

