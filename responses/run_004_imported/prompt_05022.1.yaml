      *   *Personally Transformative:* Your values/utility function changes.
      *   *The Decision Problem:* How to choose using current utilities when the outcome changes those utilities and you can't simulate the new state?
      *   *The AI Parallel:* An agent optimizing for $X$ might undergo a rewrite where $X$ becomes meaningless, replaced by $Y$. Should it authorize the rewrite?

  3.  **Brainstorming Settings:**
