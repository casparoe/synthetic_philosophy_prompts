          *   Therefore, "It is raining" is necessarily true.
          *   *Intuition:* God acts as a "modal anchor." Because God is fixed across all worlds and carries all actual truths as properties, those truths get dragged across all worlds.
      *   **Part 3: Can we fix it? (Revisions and Trade-offs).**
          *   *Option 1: Weaken Essence.* Don't let essence entail *all* properties, only "essential" ones. (But then the argument might fail to prove NE).
