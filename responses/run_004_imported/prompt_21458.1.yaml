  **Tier Explanations**

  **S Tier:** Machina's approach earns the top spot because it offers the most mathematically elegant departure from vNM, characterizing the Allais violation as "fanning-out" indifference curves without immediately committing to specific psychological parameters. It satisfies the criterion of minimal machinery by providing a local utility framework that encompasses many specific models as special cases, making it the most general theoretical response to the geometry of the paradox.

  **A Tier:** Quiggin's Rank-Dependent Utility takes the second spot as the premier functional instantiation of Machina's geometry, modifying probability weighting based on rank to preserve stochastic dominance. It is theoretically satisfying because it resolves the Allais paradox with a single weighting function that is psychologically motivated yet parsimonious, avoiding the need for reference points unless loss aversion is explicitly required.

  **B Tier:** Gul's Disappointment Aversion is placed here due to its exceptional axiomatic clarity and parsimony, relying on a single parameter to model deviations from expected utility based on the certainty equivalent. While it handles the Allais paradox elegantly, it is slightly less general than RDU in capturing the full range of probability distortion phenomena observed in broader empirical studies.

  **C Tier:** Cumulative Prospect Theory is ranked lower in theoretical parsimony because, while it is the empirical gold standard, it introduces significant extra machinery (reference points, loss aversion, separate weighting for gains/losses) that is not strictly necessary to resolve the Allais paradox in the domain of gains. It buys immense explanatory power for neighboring phenomena like the reflection effect, but at the cost of a more complex departure from the vNM framework.

  **D Tier:** Regret Theory is placed here because, although it uniquely accounts for preference reversals, it requires a radical departure from vNM by evaluating choices through pairwise comparisons rather than independent lottery evaluation. This structural shift introduces potential violations of transitivity, which conflicts with the seminar's emphasis on distinguishing Allais violations from failures of rational ordering.

  **F Tier:** Chew's Weighted Utility Theory occupies the lowest tier because, while historically important, its mechanism of weighting utilities based on outcome levels is less psychologically intuitive than rank-dependent or disappointment-based mechanisms. It has largely been subsumed by RDU in modern literature, offering fewer advantages in generalizability while lacking the same level of axiomatic prominence or empirical adoption.
