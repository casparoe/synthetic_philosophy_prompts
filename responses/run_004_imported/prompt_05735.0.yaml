      *   *Best Path:* Argue that it was **rationally defensible within his specific philosophical framework**, even if it looks eccentric today. The key is the "dualism." If ethics rests on cosmic justice, and cosmic justice is a fact of the universe, investigating facts of the universe is the job of science. To *not* investigate would be to leave the "fundamental contradiction" unresolved without checking the only available evidence.
      *   *Wait, I need to be decisive.* Let's go with **Motivated Reasoning.** It's a stronger, more critical take that fits the "brilliant guy who couldn't stomach where his own arguments left him" narrative arc better. It allows for a critique of how desire shapes epistemology.
