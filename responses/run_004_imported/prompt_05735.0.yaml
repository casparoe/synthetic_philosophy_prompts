      *   **The Philosophical Crisis:** Explain the "dualism." Why self-interest vs. duty matters. Why philosophy hits a wall. The need for empirical data on the "governance of the universe."
      *   **The Empiricist's Duty:** Sidgwick couldn't just assume naturalism. If the universe *might* have hidden laws (telepathy/survival), an empiricist must look. Ignoring it would be dogmatism.
      *   **The SPR Method:** Highlight that Sidgwick was the *skeptic* of the SPR. He didn't believe easily. He pushed for rigorous controls. This distinguishes him from credulous spiritualists.
      *   **Addressing the Counter-Argument (Motivated Reasoning):** Acknowledge the desire for resolution. But argue that desire motivated the *question*, not the *answer*. He remained agnostic.
      *   **Conclusion:** Reiterate the verdict. His legacy isn't tarnished; it shows the limits of pure reason and the courage to follow evidence where it leads, even into the dark.

