      *   **Key Context:** Sidgwick is known for rigorous utilitarianism (*The Methods of Ethics*). He identified the "dualism of practical reason" (conflict between self-interest and duty). He hoped empirical evidence of an afterlife (immortality/divine governance) could resolve this dualism.
