      *   **Side A: It was Rational/Defensible.**
          *   *Empiricism:* Sidgwick was an empiricist. If the afterlife is an empirical claim, it requires empirical investigation. Philosophy alone can't settle matters of fact.
          *   *Scientific Spirit:* The late 19th century was a time of expanding scientific boundaries. Investigating anomalies (telepathy, etc.) wasn't inherently unscientific then (like investigating radio waves or hypnosis).
          *   *Consistency:* If the "dualism of practical reason" threatens the rationality of morality, finding a solution is a philosophical duty. If the solution lies in facts about the universe (God/Immortality), seeking those facts is rational.
          *   *Rigorous Method:* The SPR actually pioneered rigorous methods for investigating anecdotes (cross-examination, looking for fraud). Sidgwick applied his philosophical skepticism to séances.

      *   **Side B: It was Motivated Reasoning/Desperation.**
          *   *The Stakes:* The "dualism" creates a crisis. If morality isn't in your self-interest (because you suffer for doing right), rationality suggests you shouldn't be moral. Sidgwick *needed* morality to be rational.
          *   *Wish Fulfillment:* He wanted the universe to be morally coherent. This desire likely biased his assessment of weak evidence.
          *   *Epistemic Shift:* He lowered his evidentiary bar for psychical phenomena compared to standard empirical claims because the *consequences* were so desirable.
          *   *Historical Verdict:* Most of what the SPR investigated is now considered pseudoscience. Sidgwick was often deceived (e.g., by mediums).

  3.  **Evaluate the Evidence & Formulate a Verdict:**
