      *   *Actually, no.* The most interesting essay argues the counter-intuitive point. Most people think SPR = crackpottery. Arguing it was *rational* for Sidgwick is more insightful.
      *   *Okay, Final-Final Decision:* I will argue it was **rationally defensible.** I will contend that given his empiricist commitments and the specific nature of the "dualism," ignoring empirical claims about the afterlife would have been *more* irrational than investigating them. The verdict: **It was a rigorous, necessary gamble, not a descent into delusion.**

