      *   *Wait, let's pivot.* Is that too soft? The prompt warns against "it's complicated."
      *   *Stronger Verdict:* It was **motivated reasoning disguised as rigor.** Why? Because the prior probability of telepathy/ghosts was so low that the evidence required to prove them should have been astronomically high (Hume's argument on miracles). Sidgwick accepted evidence that would not have satisfied him in other domains because he *needed* the conclusion to save ethics. The "dualism" created a blind spot.
