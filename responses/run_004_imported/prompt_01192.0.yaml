answer: |-
  This is a fantastic question, and it cuts to the heart of formal epistemology. Given your background in physics, you'll appreciate that while these arguments often look like philosophy, they are fundamentally geometric and structural claims about state spaces and optimization.

  You have identified the two pillars of modern Bayesian justification: the **Dutch Book Argument (DBA)** (Ramsey, de Finetti) and the **Accuracy-Dominance Argument (ADA)** (Joyce, 1998).

  Here is a comparison of how they work, whether Joyce successfully escapes the "pragmatic" label, and an evaluation of their relative strengths.

  ---

  ### 1. The Mechanisms: Betting vs. Scoring

  **The Dutch Book Argument (DBA)**
  *   **The Setup:** Credences are defined by the betting prices you would accept. If you believe $P(A) = 0.6$, you should be willing to buy a bet that pays \$1 if $A$ is true for \$0.60.
  *   **The Violation:** If your credences violate the probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), the geometry of your betting prices creates a "gap."
  *   **The Consequence:** A bookie can construct a portfolio of bets that exploits this gap. You lose money in every possible state of the world.
  *   **The Norm:** Rationality requires avoiding guaranteed loss (pragmatic inconsistency).

  **Joyce's Accuracy-Dominance Argument (ADA)**
  *   **The Setup:** Credences are evaluated by their **accuracy**. Truth is the goal. We assign a numerical score to your credence function based on how close it is to the truth values (1 for true, 0 for false) in a given world. This is done using a *strictly proper scoring rule* (like the Brier score).
  *   **The Violation:** If your credences violate the probability axioms, you occupy a point outside the convex hull of the possible truth-value assignments.
  *   **The Consequence:** There exists *another* probability function that is strictly more accurate than yours in **every possible world**. Your credences are "accuracy-dominated."
  *   **The Norm:** Rationality requires avoiding unnecessarily inaccurate beliefs (epistemic inconsistency).

  ### 2. Are They Different Underneath?

  Mathematically, they are nearly isomorphic. Physically, you might think of them as two different potentials describing the same field.

  Both arguments rely on the **convexity of the probability simplex**.
  *   In **DBA**, the probability functions form a convex set. If you are outside this set, the Hahn-Banach separation theorem guarantees a hyperplane (a bet) that separates you from the set, resulting in a loss.
  *   In **ADA**, the probability functions also form a convex set. If you are outside this set, geometric projection guarantees there is a point inside the set that is closer (in Euclidean distance, for Brier scores) to every vertex (truth value) than you are.

  **The Structural Difference:**
  The DBA relies on a **linear** utility function (money). The ADA relies on a **quadratic** (or other non-linear) loss function (distance from truth).

  However, the *logic* is identical: **Dominance.**
  *   DBA: "Don't choose an option that guarantees less money than an alternative."
  *   ADA: "Don't choose a belief state that guarantees less accuracy than an alternative."

  ### 3. Does Joyce Escape the "Pragmatic Baggage"?

  Joyce claims ADA is purely epistemic, whereas DBA is pragmatic. Is this true?

  **The Case for "Yes":**
  DBA conflates epistemic rationality with practical rationality. It suggests you are epistemically irrational because you might get poor. But what if you don't care about money? What if you are a monk who never bets? DBA implies your beliefs are still irrational because you *would* lose money *if* you bet. This makes belief norms dependent on hypothetical actions.
  ADA removes the money, the bookie, and the action. It says your beliefs are defective even if you sit in a dark room and never act, simply because they are not optimally aligned with the truth. For a scientist, this feels more natural: a measurement is "wrong" even if no one uses it to build a bridge.

  **The Case for "No":**
  Critics (like Hild 1998 or Howson 2008) argue that ADA just smuggles pragmatism in through the back door by treating accuracy as a **utility**.
  *   To get the result, Joyce must assume you *ought* to maximize expected accuracy (or minimize inaccuracy).
  *   This is essentially a decision-theoretic norm: "Maximize Epistemic Utility."
  *   If "Epistemic Utility" is just a stand-in for "Money," the argument hasn't changed category; it has just changed the currency.

  **The Verdict on Pragmatism:**
  Joyce largely succeeds in escaping *practical* pragmatism (money/action), but he cannot escape *decision-theoretic* structure. He replaces "Don't lose money" with "Don't lose accuracy."
  However, for most epistemologists, this is a win. We generally accept that belief aims at truth. Therefore, a norm derived from the geometry of truth-tracking is more fundamental to *belief* than a norm derived from the geometry of betting.

  ### 4. Which is More Convincing?

  If I weigh the arguments based on philosophical robustness and scientific intuition:

  **The Dutch Book Argument is weaker for *Epistemology*.**
  It suffers from the "Irrelevance Objection." Why should the laws of logic/belief depend on the existence of bookies or the desirability of money? De Finetti tried to argue that betting quotients *define* probability, but most modern Bayesians see credences as distinct from betting behavior. As a physicist, you know that a particle's state exists independently of whether you measure it; DBA risks conflating the state with the measurement interaction.

  **The Accuracy Argument is stronger for *Epistemology*.**
  It aligns better with the scientific realist intuition that there is a world state (truth values) and our models (credences) attempt to map onto it.
  *   **Physicist Analogy:** Think of DBA as checking if your instrument leads to arbitrage in a market. Think of ADA as checking if your instrument is calibrated to minimize mean squared error against a standard. ADA is a calibration argument; DBA is a market-stability argument. Science cares more about calibration.

  **However, ADA has its own vulnerabilities:**
  1.  **The Choice of Score:** Joyce's theorem holds for *any* strictly proper scoring rule (Brier, Log, Spherical). But different rules measure "distance from truth" differently. Why is Brier (Euclidean distance) the right metric for truth? (Though the theorem holds for the whole class, so this is less fatal).
  2.  **The Truth Values:** It assumes propositions have binary truth values (0 or 1). In physics, we often deal with continuous parameters or model-dependent realism where "truth" is fuzzier.

  ### Summary Recommendation

  **Joyce's Accuracy-Dominance argument is the superior justification for why credences should obey probability axioms *as a matter of epistemic rationality*.**

  It successfully decouples the norm from action and money, grounding it instead in the relationship between mind and world (truth). While it still relies on a dominance principle (a decision-theoretic structure), applying that principle to *accuracy* rather than *cash* makes it relevant to the physicist seeking truth, not just the gambler seeking profit.

  The Dutch Book argument remains vital, but its proper home is **Decision Theory** (justifying why we should act on our probabilities), whereas Joyce's argument belongs to **Epistemology** (justifying why we should hold probabilities in the first place).

  Since your question is about why *credences* must obey the axioms (an epistemic question), Joyce wins. You don't need to worry about losing money to know your map doesn't match the territory; you just need to measure the distortion.
