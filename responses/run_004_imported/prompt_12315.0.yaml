  okay so for my free will unit i went down a rabbit hole on frankfurt cases and i think i finally get the "dilemma defense" people like widerker and kane use against them: either the prior sign that tips off the controller is guaranteed to produce jones's decision, which just assumes determinism and begs the question against the libertarian, or its not guaranteed, in which case jones could've actually decided differently right up until the last second, so the case never actually manages to refute PAP either way (i think that's the whole point of calling it a dilemma). but then i read that mele and robb tried to patch this up with "buffer" cases, where instead of the controller watching for a prior sign, theres some other condition sitting between jones and the alternative that's necessary but not sufficient for him deciding otherwise. can you actually argue (not just summarize both sides) that the buffer move works and gets frankfurt-style cases out of the dilemma for good? give me the strongest case you can that the buffer strategy actually saves frankfurt's argument against PAP
