      *   *Key Point 2: Avoiding Horn 2 (Flickers of Freedom).* The buffer eliminates "robust" alternate possibilities. Even if there's a "flicker" (entering the buffer state), it's not a morally significant alternative. You can't *successfully* do otherwise.
      *   *Key Point 3: The Nature of "Could Have Done Otherwise".* The strategy redefines the relevant sense of "could." It's not about metaphysical openness at every micro-second, but about the availability of a viable alternative *outcome*. The buffer makes the alternative outcome impossible without determining the actual outcome.
      *   *Key Point 4: Addressing the "Flicker" Objection.* Even if Widerker says "But he could have entered the buffer!", the Buffer proponent says "So what? That's not a morally relevant alternative." This shifts the burden to PAP defenders to explain why *failed* attempts count for responsibility.

