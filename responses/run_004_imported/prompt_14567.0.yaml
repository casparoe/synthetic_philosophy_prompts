  10. (Final check of Hom/May details): Hom's "Combinatorial Externalism" posits that the slur encodes a perspective. The truth conditions involve the target satisfying the properties associated with the derogatory perspective. Since no one satisfies those (racist) properties, the sentence is false. Mentioning the word doesn't predicate the property, so strictly speaking, CE shouldn't find mention offensive *semantically*. It has to rely on pragmatics. This is a key point to highlight for the user.

  11. (Final check of Anderson/Lepore): Prohibitionism says the word is prohibited. Mentioning it violates the prohibition. This fits the "quoting" controversy perfectly.

  12. (Synthesis for the Novel): The tragedy is that the scholar is semantically correct (CE/Expressivist) but pragmatically/socially guilty (Prohibitionist).

