answer: |-
  This is a sophisticated dilemma, and you have grasped the core tension between these two camps accurately. You are right to sense that neither theory, in its pure form, offers a complete shield for your character. If she relies solely on Hom, she risks sounding coldly analytic in the face of genuine pain. If she relies solely on Anderson and Lepore, she admits to breaking a rule she claims she shouldn't have to follow.

  To answer your request directly: I will argue that **Prohibitionism offers the superior account of the public controversy (the "mention" problem), but Expressivism (a third view you should consider) offers the superior account of reclamation.** A synthesis of these, acknowledging the limits of Semantic Externalism, provides the most philosophically robust—and dramatically fertile—ground for your character's defense.

  Here is the breakdown of the stakes, the oversimplifications in your setup, and the argument for how your character should navigate them.

  ### 1. The "Mention" Problem: Why Prohibitionism Wins the Public Square
  You asked which theory better accounts for the offense taken at the *mere mention* (quoting) of a slur.

  **The Case for Prohibitionism (Anderson & Lepore):**
  Prohibitionism is the clear winner here. If a slur's offensiveness is derived from a social prohibition on the *word-form* itself (akin to a taboo), then uttering the phonemes, regardless of semantic intent, violates the norm. This explains why "the N-word" (a descriptor) does not trigger the same visceral reaction as the slur itself, and why quoting the slur in a classroom can still cause distress. The "radioactivity" is in the token, not just the type. For your character's antagonists, this is the intuitive truth: the word *is* the violence.

  **The Weakness of Combinatorial Externalism (Hom & May):**
  Hom's theory struggles here. If the derogatory force is encoded in the *truth-conditional content* (i.e., the word predicates a complex, racist property of the target), then merely mentioning the word should not be offensive, because no property is being predicated. If I say, "The word 'X' has three letters," I am not asserting that anyone possesses the racist properties associated with 'X'.
  *   **Oversimplification Alert:** You noted Hom and May argue sentences predicating slurs are *systematically false*. This is slightly off. They argue the slur encodes a perspective that presupposes the target fits a derogatory stereotype. Since the stereotype is socially constructed and morally bankrupt, the presupposition fails or the content is empty. But crucially, this is a semantic claim. Semantics generally respects the use/mention distinction. Hom would have to rely on *pragmatics* (spill-over effects) to explain why mention is offensive, which weakens the claim that the offense is *semantic*.

  **Verdict for the Novel:** If your character argues purely from Hom's perspective ("I didn't assert the content, so no harm was done"), she will sound like she is missing the point. The public operates on Prohibitionist intuitions. The philosophical tragedy of your book is that **she is semantically right, but pragmatically wrong.**

  ### 2. Reclamation: The Hammer that Breaks Both Views
  Reclamation (in-group appropriation) is the stress test for these theories, and you are right to suspect it exposes weaknesses in both.

  **The Problem for Prohibitionism:**
  If the word is offensive simply because there is a standing prohibition, who has the authority to lift it? Prohibitionism implies a social rule. If the targeted group decides to use the word among themselves, are they breaking the rule or changing it?
  *   If they are breaking it, why is it not offensive within the group?
  *   If they are changing it, why does it remain offensive when used by out-group members?
  Prohibitionism struggles to explain why the *speaker's identity* changes the offensiveness if the prohibition is on the *word-form*.

  **The Problem for Combinatorial Externalism:**
  If the word semantically encodes a racist institution's properties, how can the in-group use it without invoking that institution? Hom might argue the context shifts the content, but Externalism posits that content is fixed by external social facts (the racist institution). It is difficult to explain how the *same semantic content* can be used to express solidarity rather than subordination without arguing the meaning has literally changed.

  **The Missing Third Term: Expressivism:**
  This is where you should introduce a synthesis. Philosophers like **Luvell Anderson (in later work), Bianca Cepollaro, or Michael Brownstein** lean toward **Expressivism**.
  *   **The Theory:** Slurs do not primarily describe properties (Hom) nor are they merely taboo words (Anderson/Lepore). They *express an attitude* of contempt or hostility.
  *   **Handling Reclamation:** Expressivism handles reclamation best. When an out-group member uses the slur, they express *contempt*. When an in-group member uses it, they can express *solidarity* or *camaraderie*. The word-form is the same, but the *expressive force* is flipped.
  *   **Handling Mention:** Expressivism also helps with the "mention" problem. Even if I am quoting the word, I am still *tokening* an expression of contempt. The audience hears the echo of the attitude, even if I don't hold it.

  ### 3. Argument for a Synthesis: "Contextualist Expressivism"
  For your character's self-defense to be philosophically rigorous, she should not cling rigidly to Hom (Semantics) or Anderson/Lepore (Prohibition). She should argue for a **Contextualist Expressivist** position.

  **The Argument:**
  1.  **Concede the Prohibition:** Acknowledge that in the *public sphere*, the word functions Prohibitionistically. It is a taboo token. Quoting it triggers the historical trauma associated with the token.
  2.  **Defend the Scholarly Context:** Argue that in a *scholarly context*, the norms shift. The goal is not communication of attitude, but analysis of content. In this specific "language game" (Wittgenstein), the expressive force is neutralized by the framing (e.g., "I am analyzing the term 'X'").
  3.  **The Reclamation Parallel:** Use reclamation as her shield. "Just as the targeted group can reclaim the word to change its force from contempt to solidarity, the academic community attempts to reclaim the word to change its force from contempt to analysis."

  **Why this creates better drama:**
  If she argues Hom's view (Semantics), she is arrogant ("I know the truth, you don't"). If she argues Prohibitionism, she is guilty ("I broke the rule"). If she argues Contextualism, she is **tragic**. She is arguing that context *should* matter, while the public proves that history *overrides* context. This allows her to be intellectually coherent while still suffering the consequences of the controversy.

  ### 4. Specific Oversimplifications to Correct in Your Drafts
  To ensure the "philosophical stakes" feel authentic to experts reading your book, watch out for these nuances:

  1.  **Hom's "Falsehood" Claim:** Hom and May do not argue that *every* sentence with a slur is false. They argue that the slur predicates a property that *nothing* satisfies (because the racist ideology is false). So "X is a [slur]" is false. But your character isn't saying "X is a [slur]." She is mentioning the word. Hom's theory actually *helps* her here more than you think: if the content is false/empty, then quoting it isn't spreading a lie. *However*, the harm isn't the lie; it's the activation of the ideology.
  2.  **The "N-word" Placeholder:** You noted Anderson/Lepore use "the N-word" to show the prohibition is on the form. Be careful here. Some Prohibitionists argue that even "the N-word" can be offensive if the intent is to circumvent the taboo while signaling the slur. It's not a perfect get-out-of-jail-free card.
  3.  **Sociolinguistics vs. Philosophy of Language:** Your character is a *sociolinguist*. Hom and May are *philosophers of language*. A sociolinguist would care more about *usage, power dynamics, and indexicality* (how words point to social contexts) than truth conditions.
      *   *Recommendation:* Give her a copy of **Holly Gordon's** work or **Elizabeth Stokoe's** conversation analysis. She should argue that the *indexicality* of the word (what it points to) changes in a classroom. The public argues the indexicality is fixed (always points to racism). She argues it is fluid (points to analysis).

  ### 5. Final Recommendation for the Character's Arc
  Do not let her win the argument on pure logic. The evidence suggests that **Prohibitionism describes the social reality better than Semantic Externalism describes the harm.**

  *   **Her Defense:** She should argue that treating the word as purely Prohibitionist (taboo) strips the targeted group of agency (reclamation) and strips scholars of the ability to analyze oppression. She is fighting for the *possibility* of neutral mention.
  *   **The Counter-Argument:** The public (and perhaps a colleague) should counter with the Expressivist view: "You cannot separate the word from the attitude it historically carries. By speaking it, you re-animate the attitude, regardless of your intent."
  *   **The Resolution:** The philosophical "truth" is that both are right. The word *does* have semantic content (Hom), it *is* prohibited (Anderson/Lepore), and it *expresses attitude* (Expressivism). The controversy arises because these three layers are pulling in different directions.

  **The Verdict:**
  If you must choose one theoretical anchor for her defense, **choose Expressivism with a Contextualist caveat.** It allows her to acknowledge the harm (the attitude of contempt is dangerous) without admitting guilt (I did not express that attitude). It handles reclamation (flipping the attitude) and it explains the mention problem (tokening the expression triggers the memory of the attitude).

  This position makes her nuanced, defensible, yet vulnerable—which is exactly where you want a protagonist in a controversy novel to be. She isn't fighting a straw man; she is fighting the collision between how language *works* and how language *hurts*.
