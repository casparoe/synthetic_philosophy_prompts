answer: |-
  This is one of the most beautiful results in modern epistemology, often called the **Accuracy Dominance Argument** (championed by philosophers like Jim Joyce and statisticians like Predd et al.). It is fascinating that your hobby led you here; it suggests you are feeling the "epistemic friction" that the math describes.

  You are asking for the intuition behind why **incoherence** (violating probability axioms) is not just a pragmatic vulnerability (Dutch Book), but an **epistemic sin** (guaranteed inaccuracy), and why the scoring rule needs to be **strictly** proper to prove it.

  Here is the gut-level walkthrough, avoiding the convexity proofs.

  ---

  ### 1. The Geometry of Belief
  To see why accuracy forces probability, we have to stop thinking about probabilities as numbers and start thinking of them as **coordinates in space.**

  Imagine a simple world with only two possibilities: **Rain ($R$)** and **No Rain ($\neg R$)**.
  You assign a credence to each. Let's plot this on a 2D graph:
  *   The X-axis is your credence in Rain ($P(R)$).
  *   The Y-axis is your credence in No Rain ($P(\neg R)$).

  **The Truth Points:**
  In reality, only one of these can happen.
  *   If it rains, the "Truth" is at coordinates **(1, 0)**. (100% Rain, 0% No Rain).
  *   If it doesn't rain, the "Truth" is at coordinates **(0, 1)**. (0% Rain, 100% No Rain).

  **The Coherence Line:**
  The probability axioms demand that $P(R) + P(\neg R) = 1$. On our graph, this is a straight diagonal line connecting the two Truth Points. Any point **on** this line is a coherent probability assignment.

  **The Incoherent Point:**
  Suppose you are incoherent. You feel strongly about both. You assign **0.7 to Rain** and **0.7 to No Rain**.
  On our graph, you are at point **(0.7, 0.7)**.
  Notice where you are: You are floating "above" the Coherence Line. You have assigned a total probability of 1.4 to a situation where only 1.0 is possible.

  ### 2. Accuracy as Distance
  You mentioned the **Brier Score**. Mathematically, the Brier Score is essentially the **squared Euclidean distance** between your credence point and the Truth Point.
  *   Lower score = Closer to the truth = Better.
  *   Higher score = Farther from the truth = Worse.

  Now, look at your incoherent point **(0.7, 0.7)**.
  *   **If it Rains:** The truth is (1, 0). You are at (0.7, 0.7). You are some distance away.
  *   **If it No Rains:** The truth is (0, 1). You are at (0.7, 0.7). You are the *same* distance away (due to symmetry).

  Here is the gut-level kicker: **Because you are off the line, you are unnecessarily far away from *both* possible truths.**

  Imagine you are standing in a field (the graph). There is a tightrope (the Coherence Line) stretched between two targets (the Truth Points). You are currently floating in the air above the tightrope.
  *   If Target A is the real truth, you are far away.
  *   If Target B is the real truth, you are also far away.

  But, if you simply dropped straight down onto the tightrope to the point **(0.5, 0.5)** (a coherent assignment), you would be **closer to Target A** AND **closer to Target B** than you were when you were floating at (0.7, 0.7).

  **The Geometric Fact:**
  For any point *off* the Coherence Line, there exists a point *on* the Coherence Line that is geometrically closer to **every** possible Truth Point.
  *   If you sum to > 1 (like 0.7 + 0.7), you are "overconfident" in mutually exclusive options. Scaling back to coherence brings you closer to the truth regardless of which option wins.
  *   If you sum to < 1 (like 0.3 + 0.3), you are "underconfident." Scaling up to coherence brings you closer to the truth regardless of which option wins.

  **Why this commits you to the calculus:**
  If your only goal is accuracy (minimizing distance to the truth), and you know you are incoherent, you know for a fact that there is a coherent set of numbers that would have beaten you **no matter what happened.**
  You didn't just get unlucky; you stood in a spot that was mathematically guaranteed to be farther from the target than a different spot you could have stood in. Obeying the probability axioms is simply the requirement of not standing in a dominated position.

  ### 3. Why "Strictly" Proper?
  This is the subtle part. You asked why the scoring rule must be *strictly* proper, not just *proper*.

  **The Definitions:**
  *   **Proper:** If you believe the chance of rain is 70%, reporting "70%" minimizes your expected score (or ties for the minimum).
  *   **Strictly Proper:** If you believe the chance of rain is 70%, reporting "70%" **uniquely** minimizes your expected score. There are no ties.

  **The Problem with "Merely Proper":**
  Imagine a scoring rule that is "flat" at the bottom. Suppose you believe it's 70% likely to rain.
  *   A *strictly* proper rule is like a sharp bowl. The very bottom is at 0.7. If you report 0.69 or 0.71, you are strictly higher up the side of the bowl (strictly worse).
  *   A *merely* proper rule might be like a bucket with a flat floor. If you believe 0.7, reporting 0.7 gives you the best score. But reporting 0.65 might give you the *exact same* best score.

  **Why this breaks the Dominance Argument:**
  The Accuracy Dominance theorem wants to prove that an incoherent credence is **strictly worse** (dominated) than a coherent one in **every** outcome.

  If the scoring rule is only *proper* (flat-bottomed), it is possible to construct a scenario where your incoherent credence and a rival coherent credence result in the **exact same accuracy score** in some worlds.
  *   If the scores are tied, the coherent rival hasn't *beat* you; they've only *matched* you.
  *   The theorem requires that the coherent rival **wins outright** in every possible world.

  **The Intuition of Curvature:**
  Strict propriety guarantees that the "surface" of inaccuracy is curved like a parabola, not flat like a plateau.
  *   When you are incoherent (off the tightrope), you are effectively "misreporting" your relationship to the truth.
  *   Strict propriety ensures that any deviation from the optimal reporting strategy creates a penalty that accumulates.
  *   Because the penalty curve is strictly convex (no flat spots), the "projection" of your incoherent point onto the coherent line is guaranteed to be strictly lower on the penalty curve relative to the truth vertices.

  Without strictness, you could be incoherent but "lucky" enough to land on a flat spot of the scoring rule where your inaccuracy is indistinguishable from the coherent forecaster's. Strictness removes the possibility of a tie, ensuring that coherence is the *unique* way to avoid guaranteed accuracy loss.

  ### Summary
  1.  **Geometry:** Probabilities are coordinates. The axioms define a specific line (or surface) in that space where the "Truth" always lives.
  2.  **Distance:** Scoring rules measure distance from your coordinates to the Truth coordinates.
  3.  **Dominance:** If you are off the line (incoherent), geometry dictates you are farther from *all* possible Truth points than you would be if you moved onto the line. You are leaving accuracy on the table.
  4.  **Strictness:** We need the scoring rule to be *strictly* proper to ensure that moving to the line guarantees a **strictly better** score, not just an equal one. It ensures the penalty for incoherence is sharp enough to rule out ties.

  You have stumbled upon the idea that probability theory isn't just about betting money; it's about the **geometry of truth**. Being incoherent isn't just exploitable; it's objectively less accurate, like measuring a table with a ruler that you know is stretched out.
