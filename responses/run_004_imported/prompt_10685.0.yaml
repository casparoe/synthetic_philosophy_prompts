answer: |-
  You are not confused; you have identified a genuine philosophical crux that lies at the heart of the replication crisis. Your senior colleague is advocating for a form of **scientific institutionalism** (or social constructivism), while your intuition is pulling you toward **scientific realism** (specifically, fallibilism).

  Her "bachelor" analogy is rhetorically powerful but philosophically flawed in this context. It commits a category error by treating an epistemic evaluation (methodological soundness) as if it were a definitional tautology (bachelorhood).

  Here is a breakdown of why her view is untenable for a practicing scientist, what the reviewer-independent standard actually is, and why your proposed replication year is not just valid but necessary.

  ### 1. The Category Error: Certification vs. Constitution
  Your colleague argues that peer review *constitutes* soundness. In her view, the social process creates the fact.
  *   **The Bachelor Analogy:** "Bachelor" is defined as "unmarried man." If you find a man who is married, he ceases to be a bachelor by definition. The status is entirely dependent on the marital record.
  *   **The Scientific Reality:** "Methodologically sound" is not defined as "published." It is a claim about the relationship between a method, data, and the world. Peer review is a **certification process**, not a **constitutive process**.

  A better analogy is a **health certificate**. A doctor signs a paper saying you are fit to fly.
  *   **Colleague's view:** You are fit to fly *because* the doctor signed the paper. If you collapse on the plane, the doctor's signature was still valid, so you must have been fit.
  *   **Realist view:** The doctor's signature is a *proxy* for your health. If you collapse, the doctor made a false negative error. The signature did not *make* you healthy; it attempted to *track* your health.

  Peer review is a quality control filter. Filters can be clogged, leaky, or bypassed. If the filter's output defined the quality of the input, quality control would be impossible by definition.

  ### 2. The Missing Standard: Counterfactual Stability
  You mentioned you cannot identify a "reviewer-independent standard of soundness." This is the core of your confusion. You are looking for a "Truth" with a capital T, but in social psychology, the standard is more pragmatic.

  The standard reviewers are *trying* (and sometimes failing) to track is **Counterfactual Stability** (often operationalized as Replicability).

  A result is methodologically sound if:
  1.  **Internal Validity:** The design rules out alternative explanations for the specific dataset.
  2.  **External Stability:** The effect would likely emerge again if the procedure were repeated under similar conditions (the counterfactual).

  Peer review evaluates #1 reasonably well (mostly). It evaluates #2 very poorly because it relies on trust, theoretical plausibility, and statistical heuristics (like $p < .05$) rather than actual repetition.

  Therefore, the "reviewer-independent standard" is **the behavior of the phenomenon itself upon re-interrogation.** When a result fails to replicate, it reveals that the original result lacked counterfactual stability. The peer review process failed to detect this lack of stability, proving that review and soundness are distinct.

  ### 3. The Replication Crisis as Proof
  Your intuition about the replication scandals is the strongest argument against your colleague.

  If soundness were constituted by publication:
  *   The Replication Crisis would be conceptually impossible.
  *   A failed replication would imply the *replication* was flawed (since the original is "sound" by definition of being published).
  *   Retractions would be logical contradictions (how can a "sound" fact become "unsound"?).

  However, the field's actual response to the crisis has been to admit that **publication was a fallible proxy.** We now acknowledge that many published results were false positives, p-hacked, or HARKed (Hypothesizing After Results are Known). By admitting this, the field implicitly admits that "published" $\neq$ "sound."

  Your colleague's view renders the field's current self-correction efforts incoherent. If she were right, the Open Science movement would be engaging in a witch hunt against "truth" rather than a cleanup effort against error.

  ### 4. Why This Matters for Your Postdoc
  You are deciding whether to spend a year replicating a result. Your colleague suggests this is a waste of time because the result is "beyond doubt."

  **She is confusing *consensus* with *certainty*.**
  Peer review establishes a provisional consensus. It says, "This is credible enough to enter the literature and be built upon." It does not say, "This is true."

  If you undertake this replication:
  *   **If it succeeds:** You strengthen the consensus and convert a "published finding" into a "robust fact."
  *   **If it fails:** You identify a boundary condition or a false positive. This is high-value science.

  By replicating, you are not disrespecting the peer review process; you are fulfilling the scientific method's ultimate requirement: **empirical verification.** Peer review is a pre-publication check; replication is a post-publication check. Both are required for soundness.

  ### 5. How to Navigate the Disagreement
  Your colleague is likely speaking from a place of pragmatic exhaustion. Senior researchers often adopt this view to maintain the authority of the literature and protect the field from public skepticism. If we admit nothing is "true" until replicated 10 times, science looks weak.

  However, for your career and the field's health, you should reject the constitutive view. You can frame your pushback diplomatically:

  > "I understand that peer review is our primary mechanism for certification. But if we define soundness *as* certification, we lose the ability to explain why we need replication studies at all. I view peer review as a necessary but insufficient condition for soundness. The sufficient condition is empirical stability. My goal isn't to doubt the review process, but to test the stability that the review process hoped to identify."

  ### Summary
  Your colleague is wrong. She is conflating the **map** (the published literature) with the **territory** (the psychological phenomena).
  *   **The Standard:** The reviewer-independent standard is the robustness of the effect across time and context.
  *   **The Crux:** Peer review is a social filter; soundness is an empirical property.
  *   **The Decision:** Your replication project is valid precisely *because* peer review is fallible. If peer review were constitutive of truth, science would be a democracy of opinions rather than an investigation of reality.

  Spend the year on the replication. It is the work that turns "published results" into "scientific knowledge."
