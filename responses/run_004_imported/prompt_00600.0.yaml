answer: |-
  Alan Turing is briefing the Interrogator before a trial run of the Imitation Game.

  **Interrogator:** "Professor, I've read your paper. I'm worried about the card-guessing phase. What if the human contestant uses telepathy to read my mind?"

  **Turing:** "A valid concern. We must account for the fact that the statistical evidence for telepathy is overwhelming. In a standard run of 400 trials, a telepathic human will identify the suit correctly 130 times."

  **Interrogator:** "And the machine?"

  **Turing:** "A digital computer, guessing at random, will only manage 104. The human wins by a landslide."

  **Interrogator:** "So the test is broken. How do we fix it?"

  **Turing:** "Simple. We conduct the interview in a telepathy-proof room."

  **Interrogator:** "A telepathy-proof room? What are the specifications? Lead lining? Copper mesh?"

  **Turing:** "I haven't finalized the materials. But as long as we designate it 'telepathy-proof,' the human's success rate will conveniently drop to 104."

  **Interrogator:** "So, to be clear: Telepathy is a statistical certainty, unless we're standing in a room that we *say* stops it?"

  **Turing:** "Precisely. Now, please stop thinking about the Queen of Spades; you're affecting the baseline."
