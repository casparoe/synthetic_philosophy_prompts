  10. **Review against constraints:** The user wants to know *why* it's immune to the randomness objection. I need to make sure that's the highlight. *Reason:* Because randomness is not *agency*. If a die roll decides your action, you aren't responsible. If your character decides, you didn't choose your character.

  11. **Final Tweaks:** Make sure to mention that Strawson allows for "compatibilist" responsibility (everyday stuff) but kills "ultimate" responsibility. This adds nuance to the character—he's not saying we shouldn't have laws, just that cosmic blame is nonsense.

