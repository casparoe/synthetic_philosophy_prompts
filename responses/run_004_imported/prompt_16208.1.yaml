prompt: |-
  My grandmother taught AP Psychology and ran the philosophy club at my high school for nearly thirty years, and this past fall, her last semester before retiring, I was in both. She was known for one line she made every class repeat: "character is what you do when nobody's grading you" — the center of her case for virtue ethics over everything else we covered. A few weeks before she retired, she taught us Milgram, Zimbardo, and the Darley and Batson seminary-student study, and admitted, unprompted, that she'd never found an answer to the situationist critique that she actually believed. She died last week, before she got to finish that thought with us. I'm giving her eulogy this Saturday, about five minutes long, to a room that's roughly a third former students who will know exactly what I mean, and two-thirds family and neighbors who have never heard the word "situationism." Write the eulogy so that it genuinely works through the tension she left hanging, in a way she'd have recognized as honest, rather than just declaring she was a good woman and moving on — without letting it turn into a psychology lecture at her own funeral.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Grandmother, AP Psychology teacher, Philosophy Club leader (30 years).
      *   **Key Phrase:** "Character is what you do when nobody's grading you." (Virtue Ethics).
      *   **The Conflict/Tension:** She taught situationist studies (Milgram, Zimbardo, Darley & Batson) which suggest character is situational, not stable. She admitted she believed the situationist critique but never resolved it with her virtue ethics mantra. She died before finishing that thought.
      *   **Audience:** 1/3 former students (know the jargon/context), 2/3 family/neighbors (don't know psychology terms).
      *   **Tone:** Honest, resolving the tension without being a lecture, not just generic praise.
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).
      *   **Goal:** Honor her intellectual honesty and her life's work without reducing her to a cliché.

  2.  **Deconstruct the Tension:**
      *   *Virtue Ethics:* Goodness comes from within, stable character traits. "Be good."
      *   *Situationism:* Goodness comes from context, systems, pressure. "Build good systems."
      *   *Her Stance:* She taught the mantra, but privately doubted it based on the evidence.
      *   *The Resolution:* How do we honor a teacher who taught a truth she knew was incomplete?
      *   *Idea:* Maybe the *act* of teaching the doubt *was* the character. Maybe she was building the situation for us to be better, acknowledging we aren't naturally perfect. The mantra wasn't a fact; it was an aspiration.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Establish who she was (teacher, grandmother) without getting bogged down in titles. Introduce the famous line immediately.
      *   **The Middle (The Conflict):** Bring in the psychology. Keep it accessible. Explain Milgram/Zimbardo simply (pressure, uniforms, authority). Acknowledge her admission: she knew the science said situation matters more than character.
      *   **The Turn (The Resolution):** Why did she keep saying the line if she doubted it? Because it was a *goal*, not a description. She wasn't describing human nature; she was issuing a challenge.
      *   **Connecting to Life:** How did she live this? She created a "situation" (her classroom/home) where doing the right thing was easier. She graded us not to judge, but to guide us toward the ungraded moments.
      *   **Closing:** Bring it back to the audience. What do we do now? We honor her by navigating the tension she left us.

  4.  **Refining the Tone:**
      *   *Avoid:* "She was a saint." (Too generic). "As we know from the Stanford Prison Experiment..." (Too lecture-y).
      *   *Aim:* Warm, intellectual but accessible, vulnerable.
      *   *Key Insight:* The tension *is* the legacy. She didn't solve it because life doesn't solve it. We just keep trying.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Grandma taught psych. She said "Character is what you do when no one grades." But then she taught us Milgram. She said situation wins. She died before explaining how both fit. I think the fit is that she tried to make a situation where we could practice character. She knew we were flawed. She loved us anyway. Let's be good when no one looks.

      *Critique 1:* Too blunt. Needs more poetry. Needs to address the family who don't know the studies.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      Start with the classroom. The chant. Then the pivot. "But here's the thing." Explain the studies as "how hard it is to be good." She knew it was hard. That's why she taught. She built a safe place. Now she's gone, no one is grading. But we know what to do.

      *Critique 2:* Better. Need to make sure the "situationist critique" doesn't sound like jargon to the neighbors. Call it "the weight of the world" or "circumstance."

  7.  **Finalizing the Content (incorporating the prompt's specific constraints):**
      *   *Constraint Check:* 5 minutes? Yes. 1/3 students, 2/3 family? Need to bridge that gap.
      *   *The "Honest" Resolution:* Don't say she was perfect. Say she was *aware*. Her virtue wasn't ignoring the darkness; it was lighting a candle despite it.

  8.  **Writing the Eulogy (incorporating the above):**
      *   *Opening:* The classroom setting. The chant.
      *   *The Studies:* Briefly mention them as "stories about how easy it is to lose ourselves."
      *   *The Confession:* She believed the science.
      *   *The Synthesis:* She taught the mantra *because* the situation is powerful. She wanted to build inner strength to fight the outer pressure.
      *   *The Legacy:* We are the situation for each other now.

  9.  **Review against "Psychology Lecture" constraint:**
      *   Ensure terms like "Situationism" are either explained or contextualized emotionally.
      *   Focus on *her* relationship to the ideas, not the ideas themselves.

  10. **Final Polish:** Check rhythm and pacing. Ensure the emotional arc lands. (Self-Correction: Make sure to explicitly mention the "unfinished thought" as a gift, not a loss.)

  **(Self-Correction during drafting):** I need to make sure I don't alienate the family. When I mention Milgram, I need to immediately explain it as "ordinary people doing hard things." When I mention the mantra, I need to explain it as "integrity."

  Let's write it.

  *Word Count Check:* A 5-minute speech is roughly 750 words at a moderate pace. I will aim for that.

  *Key Phrase Integration:* "Character is what you do when nobody's grading you."
