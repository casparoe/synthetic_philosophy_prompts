answer: |-
  Good morning. For those of you who knew my grandmother only as a neighbor, a friend, or family: she was the person who brought over casseroles, who remembered your birthday, and who asked how you were really doing. But for many in this room, she was also Mrs. [Last Name]. She was the AP Psychology teacher and the Philosophy Club leader who held court in Room 304 for thirty years.

  If you were in her class, you know the line. Every semester, on the first day, she made the whole room repeat it until we could say it in unison: *"Character is what you do when nobody's grading you."*

  It was her mantra. It was the center of her argument for virtue ethics—the idea that if we build good habits, we become good people. It was a comforting thought. It suggested that goodness is something we own, something stable inside us that we can carry into any room.

  But a few weeks before she retired, she told us something else. She was teaching us the studies—the famous ones. Milgram, Zimbardo, the seminary students in a hurry. You know the ones. The experiments that show how easily ordinary people do terrible things when the situation pressures them, or how often good people walk past someone in need just because they're late.

  She looked at us, took off her glasses, and admitted something she hadn't in three decades of teaching. She said, "I don't have an answer for this. The science suggests the situation is stronger than the character. And I believe the science."

  She died last week, before she could tell us how to reconcile that. Before she could finish the lesson.

  I've spent the last few days trying to finish that thought for her. And I think I understand why she left it hanging.

  If she had told us, at eighteen, that our character is fragile, that it is at the mercy of circumstances, of stress, of authority, of time—she might have terrified us into inaction. If she had told us only that character is king, she would have lied to us.

  So she held the tension. She taught us the mantra not as a description of reality, but as a mission statement.

  She knew the world is full of situations designed to make us look away. She knew the pressure to conform is heavier than the will to stand out. She knew that "nobody grading you" is actually most of life. And she knew that we are not naturally virtuous. We are naturally tired, naturally scared, and naturally self-interested.

  But she also knew that knowing that makes a difference.

  When she made us repeat that line, she wasn't telling us we were already good. She was training us for the moment the situation turns against us. She was trying to build a muscle we wouldn't know we needed until we were alone in the dark, or in a crowd that was turning cruel, or in a hurry that made us blind to someone else's pain.

  To the family and friends here: You saw her virtue. You saw her kindness. But I want you to know that her kindness wasn't accidental. It was practiced. She knew how easy it is to be impatient, or dismissive, or cold. She chose, every day, to build a situation around us where kindness was the path of least resistance.

  To her students: She leaves us with the unfinished lesson. The situationist critique is real. The world will pressure you. Systems will ask you to obey. You will be tired, and you will be late, and you will want to walk past the person on the sidewalk.

  She couldn't give us the answer to how to beat the situation every time, because there isn't one. We will fail. We will fail often.

  But she gave us the metric. She gave us the awareness. She taught us that the only thing we can control is the choice we make when the grade book is closed.

  She didn't die with an unfinished thought. She died with an open question. And she trusted us to live into the answer.

  So, how do we honor her? We don't just say she was a good woman. We acknowledge that being a good woman was a fight she fought every day, knowing the odds were against her.

  We honor her by recognizing the situations we are in. We honor her by making it easier for the people around us to do the right thing. We honor her by admitting when we are tired, when we are pressured, and by choosing to be kind anyway.

  Grandma, we know nobody is grading us now. But we remember the lesson. We'll take it from here.

  Thank you.
