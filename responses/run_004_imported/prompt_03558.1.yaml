  For the modern-day strand of the book, I want a character to push that exact reasoning somewhere Bentham himself never took it: consensual BDSM/kink, where the pain isn't incidental to the act, its the whole point. Does his framework transfer over cleanly to that, or is there an actual snag once the 'harm' in question is pain the person is chasing on purpose rather than pain done to them against their will? Don't just tell me 'he was a utilitarian so he'd be fine with anything consensual' -- walk me through it using his actual moves (the calculus, the bit about antipathy not counting as a reason, his stuff on asceticism), and tell me honestly where you think his own logic starts to strain.
