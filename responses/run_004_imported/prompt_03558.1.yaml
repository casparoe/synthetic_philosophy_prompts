answer: |-
  This is a brilliant setup for a novel because it forces a collision between two different centuries' understanding of "harm." You are right to be suspicious of the easy answer ("Consent makes it utilitarian"). Bentham is more complicated than that, and his specific philosophical tics create genuine friction when applied to BDSM.

  Here is a breakdown of where his 1785 logic transfers cleanly, and where the specific machinery of his utilitarianism starts to grind against the mechanics of kink.

  ### 1. The Clean Transfer: The Argument from Antipathy
  This is the easiest bridge for your modern character to build. In *Offences Against One's Self* (1785), Bentham's most radical move is distinguishing between **mischief** (actual harm) and **antipathy** (public disgust).

  *   **Bentham's 1785 Move:** He argues that the "disgust" a spectator feels watching a sexual act is a pain *for the spectator*, not the actor. To punish the actor to relieve the spectator's disgust is to sacrifice the happiness of one to the caprice of another. He calls this the "tyranny of the majority's imagination."
  *   **The BDSM Application:** This transfers perfectly. If a vanilla observer feels nausea seeing a flogging, Bentham's 1785 logic says that nausea is the observer's problem, not a justification for state intervention.
  *   **For the Novel:** Your modern character can easily win this round. If the opposition says, "It's barbaric/disgusting," the Benthamite retort is, "Your disgust is a sensation in *your* head, not a wound on *their* body."

  ### 2. The Snag: The Ontology of Pain
  Here is where the logic strains. Bentham's *Principles of Morals and Legislation* rests on a binary: Pleasure is good ($+$), Pain is evil ($-$). The goal of legislation is to maximize the net sum.

  *   **The Standard Utilitarian View:** Pain is only justified if it is *instrumental* to preventing greater pain (e.g., surgery, punishment, exercise). The pain itself is still a negative; it is just outweighed by the future positive.
  *   **The BDSM Reality:** In kink, pain is often *constitutive* of the pleasure. It isn't just a hurdle to jump over to get to the endorphin rush; the sting *is* the point. The pain is re-valued as a good in the moment.
  *   **Where Bentham Stumbles:** Bentham struggles to categorize "pain that is wanted." In his calculus, if you say you *want* the pain, does it cease to be pain and become pleasure?
      *   If he classifies it as **Pain**: He has to argue that the subsequent pleasure outweighs it. This feels like a misunderstanding of the experience (where the pain *is* the pleasure).
      *   If he classifies it as **Pleasure**: He risks blurring his fundamental definitions. If pain can be pleasure, how do we measure the "felicific calculus"?
  *   **The Strain:** Bentham was a materialist. He looked at physical sensations. A whip strike registers as tissue damage and nerve firing (Pain). If the subject smiles, Bentham has to decide: Is this a complex pleasure, or is this a person seeking an evil? This leads to the second, more dangerous snag.

  ### 3. The Major Snag: The Principle of Asceticism
  This is the strongest dramatic conflict for your book. Bentham had a philosophical arch-nemesis: **The Principle of Asceticism.**

  *   **Bentham's View:** He defined Asceticism as the principle that approves of actions in proportion to their tendency to *diminish* happiness (pain for pain's sake, often to please God or purify the soul). He spent his life fighting the idea that suffering is virtuous. He believed legitimizing the pursuit of pain opens the door to religious self-flagellation, penance, and moral masochism.
  *   **The BDSM Risk:** To an outsider (and potentially to Bentham), BDSM looks suspiciously like Asceticism. It involves chains, pain, submission, and ritualized suffering.
  *   **The Logical Trap:** If Bentham argues "Consensual pain-seeking is valid," he risks validating the *Principle of Asceticism*. He might worry that by saying "It is okay to seek pain," he is giving ammunition to the religious moralists who say "Suffering ennobles you."
  *   **For the Novel:** Your modern character would hit a wall here. A strict Benthamite might argue: *"We cannot legitimize the infliction of pain, even consensual, because it reinforces the cultural idea that pain is a valid currency for human connection. It blurs the line between the brothel and the monastery."*
      *   **The Counter-Argument:** Your character needs to distinguish **Hedonistic Pain** (pain used as a tool for immediate sensory pleasure) from **Ascetic Pain** (pain used to deny pleasure/submit to authority). Bentham might not make this distinction easily, which gives your character work to do.

  ### 4. The Snag: Secondary Mischief
  Bentham was a social engineer. He didn't just look at the act; he looked at the **secondary mischief** (the long-term societal consequences).

  *   **1785 Logic:** With sodomy, Bentham argued there was no secondary mischief. It doesn't weaken the population, it doesn't encourage violence.
  *   **BDSM Logic:** Bentham might pause here. He might argue that normalizing the *infliction* of pain (even consensual) creates a "slippery slope" of secondary mischief.
      *   Does it desensitize the inflictor to non-consensual pain?
      *   Does it confuse the legal definition of assault?
      *   Does it empower abusers to claim "it was kink" when it wasn't?
  *   **The Strain:** In 1785, Bentham could confidently say sodomy has no victims. In the modern strand, your character has to admit BDSM has a *risk* profile that sodomy doesn't. The "harm" is built into the activity. Bentham would demand empirical data: *Do BDSM practitioners commit more assault? Do they suffer more psychological harm?*
      *   If the data is unclear, a cautious Bentham might hesitate to decriminalize/legitimize it, not because of morality, but because of **risk management**.

  ### Summary for Your Outline

  **Where the logic holds:**
  The **Antipathy Argument**. Your modern character can crush any argument based on "public decency" or "disgust" using Bentham's 1785 text verbatim. Disgust is not harm.

  **Where the logic strains (The Conflict):**
  1.  **The Asceticism Trap:** Bentham hates the *valorization of pain*. Your character has to prove that BDSM is *Hedonistic* (pain for pleasure) and not *Ascetic* (pain for virtue). If they fail, Bentham's framework rejects it as an enemy principle.
  2.  **The Calculus Problem:** Bentham defines pain as an evil. BDSM defines specific pain as a good. Your character has to explain how to input "wanted pain" into the felicific calculus without breaking the math.
  3.  **Secondary Mischief:** Unlike sodomy, BDSM involves physical risk and the simulation of violence. A Benthamite legislator would worry about the precedent it sets for the law's ability to distinguish consent in real-time.

  **Recommendation for the Modern Character:**
  Don't let them be a dogmatic Benthamite. Let them discover that Bentham's 1785 manuscript is *too* clean. The modern character should realize that while Bentham destroyed the argument from *disgust*, he didn't solve the problem of *pain*.

  The dramatic arc could be the modern character realizing they need to update Bentham. They have to argue that **Agency** transforms the ontological status of pain. In 1785, Bentham focused on the *sensation*. Your character needs to argue that the *context of consent* changes the sensation from "Pain (Evil)" to "Play (Good)." That is the step Bentham didn't take, because he was too focused on the physical sensation and not enough on the psychological framing of power.

  This gives you a genuine intellectual evolution: 1785 Bentham clears the ground of religious disgust; Modern Character builds a new house on that ground that accounts for the complexity of pain and power.
