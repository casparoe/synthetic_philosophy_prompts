answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Association General Assembly
  **FROM:** Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Electoral Procedure Reform

  **Recommendation**
  The Governance Committee recommends the adoption of **Ranked-Choice Voting (Instant Runoff)** for all GSA executive elections. Under this system, voters rank candidates in order of preference (1st, 2nd, 3rd). To win, a candidate must secure a majority (50% + 1) of first-choice votes. If no candidate achieves a majority, the candidate with the fewest first-choice votes is eliminated, and their ballots are redistributed to the voters' next-ranked choice. This process repeats until one candidate holds a majority.

  **Theoretical Trade-offs and Arrow's Theorem**
  As political scientists, we acknowledge that no voting system is mathematically perfect. Arrow's Impossibility Theorem proves that no ordinal ranking system can simultaneously satisfy fairness criteria including Non-Dictatorship, Pareto Efficiency, Unrestricted Domain, and **Independence of Irrelevant Alternatives (IIA)**. Our recommendation explicitly sacrifices **IIA**. This condition stipulates that the relative ranking between two candidates should not be affected by the presence or absence of a third "irrelevant" candidate. In practice, this means that under RCV, the elimination order can theoretically change based on who enters the race.

  We defend this sacrifice as the least costly option available given the Assembly's constraints. The alternative systems that better preserve IIA or guarantee a Condorcet Winner (such as Schulze or Ranked Pairs methods) require complex pairwise counting algorithms that cannot be explained to the membership in a single paragraph. RCV preserves the most critical democratic heuristic—Majority Rule—while remaining transparent enough to maintain member trust.

  **Vulnerabilities and Objections**
  The strongest objection to this recommendation, raised internally by committee members, is that RCV does not guarantee the election of a Condorcet Winner (a candidate who would beat every opponent head-to-head). In the specific scenario that prompted this reform—three ideologically similar candidates splitting a base—RCV can still fail. This is known as the "Center Squeeze" effect: a consensus candidate with broad second-choice support but few first-choice votes may be eliminated in early rounds, potentially resulting in a winner who would still lose a head-to-head contest. Furthermore, while RCV reduces vote-splitting, it is not immune to strategic manipulation by organized slates, who might coordinate rankings to eliminate a strong rival early.

  However, while RCV does not *solve* the Condorcet problem perfectly, it drastically reduces the probability of a Condorcet *Loser* winning compared to Plurality Rule. Plurality guarantees failure in a three-way split; RCV makes it contingent on preference distribution. Given the Assembly's constraint that the system must be explainable in a paragraph, we cannot adopt a Condorcet-compliant method without sacrificing transparency. Therefore, RCV offers the optimal balance: it mitigates the spoiler effect that plagued our last election, resists slate manipulation better than Borda or Plurality systems, and remains simple enough for every member to understand and verify.

  **Next Steps**
  The Committee proposes drafting bylaw amendments to implement RCV for the spring election cycle.
