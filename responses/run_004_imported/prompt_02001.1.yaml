answer: |-
  **Setting:** *A nearly empty campus coffee shop, 1:00 AM. Two empty mugs sit between Alex (Epistemic Contextualist) and Jordan (Pragmatic Encroachment Theorist). A napkin is covered in diagrammatic scribbles.*

  **Alex:** Let's lock the mismatch case down. We agree on the setup? Hannah is the subject. She needs to deposit a check to avoid foreclosure. High stakes for her. She has the same evidence as the standard Bank Case—was there two weeks ago, saw the hours. But she doesn't go back to check. Sarah is the attributor. Sarah is betting a penny on whether Hannah knows. Low stakes for Sarah. Sarah says, "Hannah knows the bank is open." Who is right?

  **Jordan:** Hannah doesn't know. Therefore, Sarah is wrong.

  **Alex:** And that's where we stall. On my view, Sarah's utterance expresses the proposition *Hannah meets the epistemic standard salient in Sarah's context*. Since Sarah's stakes are low, the standard is low. Hannah meets it. So Sarah's utterance is true.

  **Jordan:** But that makes knowledge attribution solipsistic. If I'm talking about Hannah, why does *my* betting slip matter for *her* epistemic status? You're saying the truth of the sentence depends on me, not her.

  **Alex:** Not her status. The truth of the *sentence*. Look, "knows" is indexical, like "tall." If I say "Hannah is tall" in a kindergarten class, it's true. If I say it at an NBA draft, it's false. Hannah's height didn't change. Why is it acceptable for "tall" to shift with the comparison class but unacceptable for "knows" to shift with the epistemic standard?

  **Jordan:** Because "tall" is explicitly gradable relative to a group. "Knows" purports to describe a cognitive relation between a subject and a fact. If you say contextualism is true, you're committed to Semantic Blindness. Ordinary speakers don't realize "knows" shifts. If Sarah says "Hannah knows" and Hannah's husband says "No, she doesn't, the stakes are too high," they feel like they are contradicting each other. They argue. They think one of them is wrong. On your view, they aren't contradicting. They're talking past each other. But they don't *feel* like they are.

  **Alex:** That's the standard objection, but it's weaker than you think. We are blind to all sorts of context-sensitivity until it's pointed out. If I say "It's raining," and you're in London, we might argue. I mean *here*, you mean *there*. We don't immediately register the hidden location parameter. With "knows," the standard is set implicitly by conversational salience. When Hannah's husband mentions the foreclosure, he raises the standard for the conversation. If Sarah ignores that and keeps saying "She knows," she's not speaking falsely relative to her own private context; she's failing to accommodate the conversational score. But in the mismatch case, where they aren't in the same conversation? Yes, they can both be right. The intuition that they contradict is a pragmatic illusion, not a semantic fact.

  **Jordan:** An illusion? That's a heavy bullet to bite. You're saying competent speakers are systematically mistaken about the truth conditions of their own knowledge claims. But let's turn the spear. Your view protects the subject from the attributor's whims, but mine protects the concept of knowledge from magic. Look at the "Knowledge Loss" problem. On my view, if Hannah's stakes rise on Saturday morning, she loses knowledge. On your view, she keeps it (relative to low standards). But consider the reverse. If I'm the attributor in a high-stakes context, I say "Hannah doesn't know." On your view, I'm right. But Hannah hasn't changed. Her evidence is identical. How can *my* anxiety about the attribution destroy *her* knowledge?

  **Alex:** It doesn't destroy *her* knowledge. It changes the truth conditions of *my report*.

  **Jordan:** That's the bookkeeping trick I mentioned last night. You're separating the state from the label so cleanly that the label stops tracking anything real. If "Hannah knows" can be true when spoken by Sarah and false when spoken by me, without Hannah changing a neuronal firing, what work is the word "knows" doing? It's supposed to flag reliable informants. If Hannah is reliable enough for Sarah but not for me, that's a fact about *us*, not her. Pragmatic Encroachment just admits this. Knowledge is the norm of practical reasoning. If Hannah can't rationally act on $p$ because the cost of error is too high, she doesn't know $p$. It's not magic; it's the connection between belief and action.

  **Alex:** But that connection makes knowledge unstable. Suppose Hannah forgets about the foreclosure for an hour. Her stakes drop psychologically. Does she regain knowledge? Then she remembers. She loses it again? That makes knowledge flicker on and off with her anxiety levels, independent of her evidence. That seems to sever the link between knowledge and truth-tracking.

  **Jordan:** It doesn't sever it. It just says truth-tracking isn't the *only* ingredient. You need enough evidence to rule out relevant error possibilities. What counts as "relevant" is determined by practical stakes. If the cost of error is zero, very little evidence is needed. If the cost is foreclosure, you need more. Hannah's evidence is fixed, yes. But the *sufficiency* of that evidence is variable. That's not flickering; that's calibration.

  **Alex:** Calibration implies a single scale. Contextualism says there are multiple scales. Let's go back to the mismatch. Sarah (low stakes) says "Hannah knows." Hannah (high stakes) is present and hears this. Hannah says, "That's false, I don't know." On your view, Sarah is just wrong. Full stop.

  **Jordan:** Yes. Sarah is attributing a status Hannah doesn't have.

  **Alex:** But Sarah's assertion is useful. It encourages people to rely on Hannah for low-stakes things. If I need someone to mail a letter, Hannah is fine. If I need someone to deposit a mortgage check, she isn't. Your view forces me to say "Hannah doesn't know" even if I'm just asking about the letter. That seems to lose the utility of the low-standards attribution.

  **Jordan:** No, I just say "Hannah knows *for the purpose of mailing a letter*." I can relativize the practical domain without relativizing the semantic value of "knows." You want to build the purpose into the verb. I keep the verb pure and attach the purpose to the conditions of application.

  **Alex:** Is that a substantive difference, though? Or are we just arguing over where to draw the semantic boundary? We both agree: 1) Evidence is fixed. 2) Stakes affect whether it's appropriate to rely on the belief. 3) In high-stakes contexts, "Hannah knows" sounds wrong. 4) In low-stakes contexts, "Hannah knows" sounds right.
  The disagreement is: Does the stakes-sensitivity live in the *word* "knows" (me), or in the *state* of knowledge (you)?

  **Jordan:** It lives in the state. Because if it lived in the word, we couldn't explain why high stakes make Hannah feel she ought to check the hours. She feels epistemic pressure, not linguistic pressure. She doesn't think, "I can't say I know." She thinks, "I *don't* know."

  **Alex:** But she might be conflating the norm of assertion with the norm of belief. If she says "I know," she invites reliance. If reliance is dangerous, she shouldn't say it. That's a pragmatic constraint on assertion, compatible with contextualism. The "Semantic Blindness" charge you leveled earlier? I can return it. You claim speakers intuitively feel they lose knowledge. But maybe they just feel they lose the *right to claim* knowledge. Your theory relies on speakers not distinguishing between *being* a knower and *claiming* to be one.

  **Jordan:** And your theory relies on speakers not distinguishing between *truth* and *assertability*. We're both accusing the other of hiding a distinction in the blind spot of intuition.
  So, is this verbal? If we agree on all the cases—agree on when people should act, agree on when they should speak, agree on when they should check the evidence—then what is left?

  **Alex:** The metaphysics of the proposition. If I say "It is true that Hannah knows," on my view, that sentence is incomplete without a context parameter. On your view, it's complete but sensitive to practical facts.
  Here's the test: Imagine a god's-eye view. An omniscient being looks at Hannah. Does the being see a property called "Knowledge" attached to Hannah's belief?

  **Jordan:** Yes, but that property is partly constituted by her practical environment.

  **Alex:** See, that's where I balk. Properties shouldn't depend on the subject's bank account. They should depend on the subject's cognitive connection to the world.

  **Jordan:** Why? Knowledge isn't just a cognitive connection. It's a credential for action. If the action changes, the credential requirements change.
  But let's press the "verbal" angle. Suppose we define $K_{CX}$ as Contextualist-Knowledge and $K_{PE}$ as Encroachment-Knowledge. $K_{CX}$ is true if evidence meets contextually salient standard. $K_{PE}$ is true if evidence meets stakes-determined standard.
  In the mismatch case (Low-Stakes Attributor, High-Stakes Subject):
  $K_{CX}$ is True.
  $K_{PE}$ is False.
  We are predicting different truth values for the utterance "Hannah knows." That's not verbal. That's a disagreement about truth conditions.

  **Alex:** True, but only if we assume the utterance has a single semantic value to begin with. If I'm right, the utterance is ambiguous. You're evaluating one disambiguation; I'm evaluating another.
  But here is where I think we might find common ground. We both reject Invariantism. We both think the Standard Bank Case shows that "pure" evidentialism is false. We agree that practical factors *matter*.
  The real fight is: Do practical factors modify the *subject's state* (you) or the *attributor's predicate* (me)?

  **Jordan:** And that fight matters for the mismatch case. If I'm right, Sarah is misleading the public by saying Hannah knows. She's attributing a credential Hannah lacks. If you're right, Sarah is speaking truly, but her truth is cheap. It doesn't license action in Hannah's context.

  **Alex:** Exactly. So the substantive disagreement is about *licensing*. You think "Hannah knows" licenses action *simpliciter*. I think it licenses action relative to the attributor's context.
  If that's the core, then the Semantic Blindness objection loses some bite. The reason speakers argue is that they are fighting over which license is appropriate for the conversation at hand.

  **Jordan:** I can accept that speakers fight over licenses. But I still maintain the license is only valid if the subject actually holds the credential. You can't issue a driver's license to someone who can't see, even if the DMV clerk (the attributor) doesn't care about the road conditions. Hannah is the driver. Her stakes are the road conditions. Sarah is just the clerk. The clerk's indifference doesn't make Hannah safe.

  **Alex:** But the clerk's utterance "You are licensed" is still *true* relative to the clerk's administrative context, even if it's dangerous for Hannah to drive.
  Look, maybe the disagreement isn't about the extension of "knows" in the mismatch case. It's about which context *matters* for the primary use of knowledge attributions.
  I prioritize the attributor's context because knowledge attributions are tools for *attributors* to manage information flow.
  You prioritize the subject's context because knowledge attributions are tools for *subjects* to navigate action.

  **Jordan:** That... actually clarifies it. If knowledge is primarily a tool for the community to tag reliable informants (your view), then the attributor's stakes determine the tag. If knowledge is primarily a norm for the individual's reasoning (my view), then the subject's stakes determine the status.

  **Alex:** So the mismatch case isn't a bug; it's a feature that exposes our different functional priorities.

  **Jordan:** But one of us has to be right about the *word* "knows." Which function is dominant in English?

  **Alex:** We might not settle that tonight. But if we agree that the disagreement stems from prioritizing different functions of the concept, is it merely verbal?

  **Jordan:** No. Because it changes how we advise people. If I'm right, you should never tell a high-stakes subject they know, even if you're low-stakes, because you'd be lying. If you're right, I can tell them they know, provided I make clear I'm speaking from my low-stakes perspective.
  That's a practical difference in ethical assertion.

  **Alex:** Agreed. So it's substantive. It's not about the world; it's about the norms of speech.
  But I concede this: If the subject is present, the subject's stakes tend to become salient to the attributor. So in most real conversations, our extensions converge. The mismatch case is a philosophical edge case.

  **Jordan:** And I concede this: If the attributor's stakes are vastly higher than the subject's, it feels wrong to say the subject "knows" even if the subject is relaxed. That suggests the attributor's context *does* bleed in, which supports your contextualism slightly. Maybe it's not purely subject-sensitive.

  **Alex:** So perhaps a hybrid? Subject-Sensitive Invariantism with Contextualist overlay?

  **Jordan:** *Laughs.* Don't let the seminar organizers hear you suggest a compromise. They want blood.
  But seriously. If we agree that the truth of "Hannah knows" in the mismatch case depends on whether we prioritize the subject's action or the attributor's information management, then we've located the disagreement. It's not about whether stakes matter. It's about *whose* stakes anchor the semantic value.

  **Alex:** And that's not verbal. That's a decision about what kind of tool language is.

  **Jordan:** Then we haven't wasted the night. We just haven't decided whose tool kit is better.

  **Alex:** I'll take that. Coffee?

  **Jordan:** Only if you know the barista is still awake.

  **Alex:** I saw her five minutes ago. I know she's there.

  **Jordan:** High stakes?

  **Alex:** Desperate need for caffeine.

  **Jordan:** Then you don't know. Go check.

  **Alex:** *Smiles.* Contextualist. Always raising the standard.

  **Jordan:** Encroachment theorist. Just keeping you rational.
