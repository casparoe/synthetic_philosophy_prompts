      *   **Pragmatic Encroachment Theorist (Jordan):** Needs to defend the idea that practical factors affect knowledge status directly. Needs to handle the "knowledge loss" charge. Needs to explain why the subject's stakes matter regardless of the attributor.

  3.  **Drafting - Section by Section:**

