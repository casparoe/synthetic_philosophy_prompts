  Here is a structured argument suitable for a dissertation chapter. It is designed to be philosophically rigorous, addressing the ontological distinctions required to defuse Humphreys's Paradox while preserving the mathematical utility of the probability calculus.

  ***

  # Chapter Section: Defusing Humphreys's Paradox via Ontological Asymmetry

  ## 1. Introduction: The Threat of Symmetry
  Humphreys's Paradox (1985) remains the most significant challenge to the propensity interpretation of probability. The paradox exploits a tension between the metaphysical commitments of propensity theory and the formal structure of the probability calculus. Propensity theorists posit that objective chances are physical, dispositional properties of a specific setup to produce an outcome. Crucially, these dispositions are causal and therefore temporally asymmetric: the propensity resides in the cause (the setup) and is directed toward the effect (the outcome).

  However, the Kolmogorov axioms and Bayes' Theorem are formally symmetric. If $P(E|C)$ is a well-defined probability, then $P(C|E)$ is mathematically derivable. Humphreys argues that if propensities are to be identified with probabilities, then $P(C|E)$ must represent a propensity. This commits the theorist to the absurdity that an effect can possess a physical disposition to produce its own cause (backward causation).

  This section argues that the propensity theorist need not abandon the interpretation nor deny causal asymmetry. The paradox arises from a category mistake: the assumption that every quantity generated by the probability calculus must share the same ontological status as the input quantities. By distinguishing between *generative propensities* and *epistemic inverses*, we can maintain that while the calculus applies to the *values* of propensities, it does not dictate the *ontology* of every derived value.

  ## 2. The Ontology of the Propensity: Generative Conditions
  To resolve the paradox, we must first rigorously define the relata of a propensity statement. A propensity is not merely a relation between two events $C$ and $E$; it is a dispositional property of a *chance setup* existing at a specific time $t$.

  Let $S_t$ represent the total physical state of the world (or the relevant isolated system) at time $t$. A propensity is a property of $S_t$ to produce an outcome $E$ at $t + \Delta t$. We can denote this as $Prop_{t}(E)$. When we write the conditional $P(E|C)$ in propensity terms, we are asserting that the physical conditions $C$ (which constitute the setup $S_t$) instantiate a disposition toward $E$.

  The crucial ontological constraint is **generativity**. Propensities are "production potentials." They describe what the current state of the world is poised to generate. This entails two constraints:
  1.  **Temporal Direction:** The disposition must exist prior to the manifestation.
  2.  **Carrier Specificity:** The disposition must inhere in the generating conditions ($C$), not the outcome ($E$).

  Humphreys's Paradox assumes that if $P(E|C)$ is a propensity, then the mathematical inverse $P(C|E)$ must also be a propensity inhering in $E$. This assumption is false. It conflates the formal symmetry of the ratio definition of conditional probability with the metaphysical symmetry of physical disposition.

  ## 3. The Category Mistake: Formalism vs. Interpretation
  The core of the defense lies in rejecting the **Identity Thesis**: the claim that the set of physical propensities is co-extensive with the set of all values in the probability model.

  The probability calculus is a formal tool for managing consistent degrees of expectation or frequency ratios. It is ontologically neutral. When we map propensities onto this calculus, we are mapping a subset of physical quantities onto a formal structure. The fact that the formal structure allows for inversion does not imply that the physical world allows for inverted dispositions.

  Consider an analogy from mechanics. We can model the trajectory of a projectile using time-symmetric differential equations. We can mathematically solve for the initial velocity given the final position. However, the final position does not possess a "force" that generated the initial velocity. The mathematical reversibility of the equations does not entail the physical reversibility of the causal process.

  Similarly, in probability:
  *   $P(E|C)$ maps to a **physical propensity**: The tendency of setup $C$ to yield $E$.
  *   $P(C|E)$ maps to an **epistemic probability**: The degree to which observing $E$ confirms the hypothesis that $C$ occurred.

  The paradox dissolves once we admit that the probability calculus can accommodate mixed interpretations. The input values ($P(E|C)$, $P(C)$) may be ontic (propensities), while the derived output value ($P(C|E)$) is epistemic. There is no violation of the calculus, because the calculus governs the arithmetic relations between the numbers, not the metaphysical nature of what the numbers represent.

  ## 4. The Status of the Inverse: Evidential Support
  If $P(C|E)$ is not a propensity, what is it? Within a propensity framework, the inverse quantity should be interpreted as a measure of **rational degree of belief** or **confirmation**.

  When an observer observes effect $E$, they update their credence regarding the prior conditions $C$. Bayes' Theorem provides the normative rule for this update. The value $P(C|E)$ quantifies how strongly $E$ serves as evidence for $C$. This is entirely consistent with causal asymmetry. The effect $E$ does not *cause* $C$; rather, the occurrence of $E$ provides *information* about $C$.

  This distinction preserves the objective nature of chance while acknowledging the subjective (or intersubjective) nature of inference:
  1.  **The World:** Contains objective propensities ($C \to E$). These are mind-independent dispositions.
  2.  **The Agent:** Contains epistemic probabilities ($E \to C$). These are mind-dependent degrees of confidence constrained by the objective propensities.

  By assigning the inverse quantity an epistemic status, we avoid the commitment to backward causation. The "tendency" of $E$ to imply $C$ is not a physical force acting backward in time; it is a logical relation between a piece of evidence and a hypothesis about the past.

  ## 5. Preserving the Calculus without "Spent" Propensities
  A common counter-argument is that if propensities do not obey the full probability calculus (specifically inversion), they are not truly probabilities. This objection relies on the view that "probability" is a univocal concept. However, a sophisticated propensity theory can argue that "probability" is a cluster concept where the formal axioms define the *structure*, but the interpretation defines the *content*.

  We can maintain that propensities satisfy the axioms (non-negativity, normalization, additivity) without satisfying the interpretative constraint that every conditional is a propensity.
  *   **Axiomatic Compliance:** Propensities obey the axioms because they represent stable, long-run generative frequencies of a setup (on a long-run view) or single-case dispositions that constrain rational belief (on a single-case view).
  *   **Interpretative Limit:** The interpretation of $P(A|B)$ as a propensity is valid only when $B$ temporally precedes $A$ and $B$ constitutes the physical setup for $A$.

  This approach avoids the problem of "spent propensities." Once $E$ occurs, the propensity of $C$ to produce $E$ is realized and ceases to exist as a disposition. It makes no sense to speak of the propensity of $E$ to produce $C$ because $E$ occurs when the causal window for $C$ has closed. By restricting the label "propensity" to the forward-directed conditional, we respect the temporal asymmetry of causation while utilizing the full mathematical power of Bayes' Theorem for inference.

  ## 6. Conclusion
  Humphreys's Paradox relies on the conflation of mathematical derivability with physical possibility. It assumes that because we can calculate $P(C|E)$ from $P(E|C)$, the physical world must contain a counterpart to $P(C|E)$ that is of the same ontological kind as $P(E|C)$.

  The propensity theorist can survive this paradox by rejecting this assumption. We argue that:
  1.  Propensities are inherently asymmetric, generative dispositions of causes to produce effects.
  2.  The probability calculus is a formal system that can model both ontic dispositions and epistemic inferences.
  3.  The inverse quantity $P(C|E)$, while mathematically valid, represents evidential support (epistemic probability), not a backward-directed physical disposition (ontic propensity).

  Thus, the propensity interpretation remains viable. It grounds objective chance in the causal structure of the world without being undermined by the inferential reversibility of the mathematics we use to describe it. The paradox is not a failure of the propensity theory, but a warning against reifying every feature of our mathematical models into the fabric of reality.
