  8.  **Final Polish:** Ensure tone is appropriate for a dissertation (authoritative, nuanced, analytical). Check that the specific prompt requirements are met (argue they can accept causal asymmetry premises, explain why derived quantities aren't propensities, define the status of the inverse).

      *(Self-Correction on "Accepting Premises"):* The prompt asks to accept the premises about causal asymmetry. So I must grant that causes precede effects and propensities are causal. The solution must lie in the interpretation of the math, not in denying time's arrow.

      *(Plan for the "Status" of the inverse):* It is a measure of *rational degree of belief* or *confirmation*. It is epistemic.

      *(Plan for the "Why"):* Because propensities are properties of the *chance setup*, not the *outcome*. The outcome cannot possess a disposition to bring about the past setup.

