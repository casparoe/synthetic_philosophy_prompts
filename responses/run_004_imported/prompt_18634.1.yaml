answer: |-
  This is a fantastic case study. It maps almost perfectly onto the contemporary debate in moral philosophy regarding the "normative significance of hypocrisy." Given your background, you'll appreciate that Marcus and Lena are essentially arguing over whether blame is a *constative* speech act (reporting a fact about wrongness) or an *illocutionary* one (performing a social transaction that requires specific conditions to be valid).

  Here is the move-by-move breakdown, followed by an assessment of whether "standing" is doing real work, and finally, the missing piece that might settle the dinner table dispute.

  ### Move-by-Move Analysis

  **Move 1: Marcus (The Logical Objection)**
  *   **Claim:** The kid is committing *tu quoque*. Hypocrisy doesn't make the advice false.
  *   **Assessment:** **Point to Marcus (on logic), but Lena (on pragmatics).**
  *   **Why:** Marcus is classically correct regarding truth conditions. If "excessive screen time is harmful" is a true proposition, its truth value is independent of Dave's behavior. In a lab, if I tell you to wear gloves while I'm not wearing them, the safety data doesn't change. Marcus correctly identifies that the son is attacking the messenger, not the message. However, he assumes the son is trying to refute the *truth* of the claim, rather than the *authority* of the command.

  **Move 2: Lena (The Distinction Objection)**
  *   **Claim:** The son isn't disputing the content; he's disputing the standing.
  *   **Assessment:** **Point to Lena.**
  *   **Why:** This is the crucial pivot. Lena identifies that "blame" or "scolding" is not just information transfer; it is a demand for compliance. In philosophy of language terms, she is distinguishing between the *propositional content* and the *felicity conditions* of the speech act. You can utter a true sentence ("Stop that") but fail to perform the act of *legitimate scolding* if you lack the standing. She correctly diagnoses that the son's "look who's talking" is a challenge to the relationship, not the facts.

  **Move 3: Marcus (The Utility Objection)**
  *   **Claim:** What work does "standing" do? If the message is true and needed, why does the messenger matter? Isn't this just a shield for hypocrites?
  *   **Assessment:** **Point to Marcus (as a warning), but Lena (on theory).**
  *   **Why:** Marcus raises the strongest consequentialist objection. If the goal is behavior modification, does standing matter? He is right to be suspicious that "standing" can be weaponized to silence valid criticism (the "shield" problem). However, he is wrong to imply standing adds *nothing*. If blame is a moral transaction, the "currency" is compromised if the sender is exempt. Marcus is treating morality like a chemical equation (inputs/outputs); Lena is treating it like a contract.

  **Move 4: Lena (The Commitment Objection)**
  *   **Claim:** Blame is a demand implying shared commitment. Hypocrites claim an unearned exemption.
  *   **Assessment:** **Point to Lena.**
  *   **Why:** This aligns with the "Commitment Account" of standing (championed by philosophers like R.A. Duff or Christopher Bell). To blame someone is to say, "We are both subject to this norm, and you have violated it." If Dave implies the norm binds the son but not him, he is asserting a hierarchy of moral worth without justification. Lena correctly identifies that the *injury* of hypocrisy isn't the falsehood of the advice, but the insult of the exemption.

  **Move 5: Marcus (The Perfectionist Objection)**
  *   **Claim:** This proves too much. Nobody is flawless. Does that mean no one can criticize?
  *   **Assessment:** **Point to Marcus (intuitively), but Lena (technically).**
  *   **Why:** Marcus is employing a *reductio ad absurdum*. If standing requires moral purity, morality collapses. This is a common and valid worry. However, he is attacking a straw man version of Lena's argument. Most standing theorists do not require perfection. Marcus wins the point that Marcus's *version* of Lena's argument is untenable, but he hasn't yet engaged with what Lena actually believes (which she reveals in Move 6).

  **Move 6: Lena (The Non-Exemption Objection)**
  *   **Claim:** It's not about perfection; it's about not claiming a double standard. Own the flaw ("we both need to cut down").
  *   **Assessment:** **Point to Lena.**
  *   **Why:** This is the "Non-Exemption" account (associated with Kyle Fritz). It solves Marcus's Move 5 problem. You retain standing to blame if you acknowledge the rule applies to you, even if you sometimes fail, provided you aren't claiming a *right* to fail that you deny others. Dave loses standing not because he checks his phone, but because he acts as though *his* checking is permissible while the son's is not. Lena successfully navigates the perfectionist trap.

  ---

  ### Is "Standing" Real or Just a Deflection? (Addressing Move 3)

  You asked if "standing" is doing philosophical work or if Marcus is right that it's just a polite label for changing the subject.

  **Standing is doing real work.** Marcus is conflating **correctness** with **validity**.

  Think of it like a safety inspector in your old lab.
  *   **Scenario A:** The inspector finds a violation and writes you up. Later, you find out the inspector violates the same rule in their own lab.
  *   **Scenario B:** The inspector finds a violation and writes you up. They admit they struggle with this rule too, but they are enforcing it because it's the rule.

  In both cases, the *violation* is real (Marcus's point). The safety risk is real. But in Scenario A, the inspector lacks the **normative authority** to sanction you. Why? Because the practice of enforcement relies on a community of accountability. If the enforcer places themselves outside the community, the sanction becomes an act of power, not an act of moral address.

  Marcus treats blame as **data** ("Screen time = Bad").
  Lena treats blame as **currency** ("I hold you to this, and I hold myself to this").

  If you try to spend currency you don't hold (because you've exempted yourself), the transaction fails. That isn't changing the subject; it's pointing out that the transaction is void. So, Lena is right: "You have no standing" is not saying "You are wrong about the facts," it is saying "You are not authorized to collect this debt."

  ### The Missing Piece: Institutional vs. Moral Standing

  There is something both Marcus and Lena miss that would actually settle the BBQ argument. They are arguing about **Moral Standing** (peer-to-peer accountability), but they are ignoring **Institutional Standing** (role-based authority).

  **The Settlement:**
  Dave is not just a moral peer to his son; he is a **parent**.
  *   **Moral Standing:** Lena is right. As a moral agent, Dave loses the high ground by hypocrisy. He cannot claim moral superiority.
  *   **Institutional Standing:** Marcus is partially right. As a parent, Dave has a fiduciary duty to guide his son's development, regardless of his own flaws. A recovering alcoholic parent still has the standing (and duty) to tell their child not to drink.

  **The Verdict:**
  The son's "look who's talking" is a valid challenge to Dave's *moral* standing (Lena wins), but it is not a valid veto of Dave's *parental* authority (Marcus wins).

  However, Lena's Move 6 offers the practical solution that saves Dave's parental efficacy. If Dave had said, *"I know I'm on my phone too. It's a bad habit, and I'm trying to break it. But for your development, I need you to put it away,"* he retains his **Institutional Standing** while repairing his **Moral Standing**.

  By failing to own the flaw, Dave turned a parenting moment into a power struggle. Lena wins the philosophical argument about blame, but Marcus wins the practical argument that the son still needs to get off the phone. The tragedy is that Dave's lack of moral standing (Lena's point) will likely undermine his institutional standing (Marcus's point) in the long run, because the son will stop respecting the authority that refuses to acknowledge shared human frailty.

  **Summary for the Lab Rat:**
  *   **Marcus** is treating the interaction like a **Safety Data Sheet** (Is the hazard real?).
  *   **Lena** is treating the interaction like a **Lab Protocol** (Are we all following the same procedures?).
  *   **The Reality:** It's both. The hazard is real (Marcus), but if the Lab Manager ignores the protocol, the team stops respecting the safety culture (Lena). Dave needs to acknowledge the protocol applies to him to maintain the culture, even if he's the one enforcing it.
