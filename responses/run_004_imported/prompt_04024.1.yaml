          *   *Pareto/Askell:* This is the most philosophically rigorous. It admits the limitation of aggregation rather than faking a sum.
          *   *Overtaking:* Good for time, bad for space.
          *   *Hyperreals:* Too esoteric.
          *   *Discounting:* Ethically dubious.

