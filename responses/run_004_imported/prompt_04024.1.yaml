      *   **Problem:** In an infinite universe, total utility is $\infty$ (or undefined). Finite actions don't change $\infty$. Standard sum utilitarianism breaks.
      *   **Approach 1: Causal Restriction (Spacetime Localization).**
          *   *Idea:* Only count value in the region we can causally affect.
          *   *Pros:* Solves the math immediately. Aligns with agency.
          *   *Cons:* Cosmologically fragile. If inflation is eternal, our causal patch might still be infinite (open universe). If the universe is spatially infinite *now*, our future light cone covers an infinite volume. It doesn't actually solve the infinity problem if the *affectable* region is also infinite.
          *   *Verdict:* Strong intuitively, but cosmologically vulnerable.

      *   **Approach 2: Time Discounting.**
          *   *Idea:* Discount future utility so the sum converges.
          *   *Pros:* Mathematically clean.
          *   *Cons:* Ethically repugnant to many (future lives matter less?). Arbitrary discount rate. Doesn't solve spatial infinity.
          *   *Verdict:* More of a patch than a solution. Shifts the burden to justifying the discount rate.

      *   **Approach 3: Overtaking/Catching-Up Criteria (Economics).**
          *   *Idea:* Compare streams of utility. Stream A is better than B if, after some time $T$, the cumulative sum of A is always greater than B.
          *   *Pros:* Handles some infinite cases.
          *   *Cons:* Incomplete ordering (some worlds remain incomparable). Sensitive to the "origin" point (where do we start counting?). Doesn't handle spatial infinity well without temporal structure.
          *   *Verdict:* Useful tool, but incomplete.

      *   **Approach 4: Pareto-style Comparisons (Askell et al.).**
          *   *Idea:* Don't sum. Just say World A is better than B if everyone in A is at least as well off as in B, and some are better off (or similar extensions for infinite populations).
          *   *Pros:* Avoids summation entirely. Robust.
          *   *Cons:* Very weak ordering. Many worlds become incomparable. Doesn't give action-guidance in trade-off scenarios (e.g., saving 1 billion vs 2 billion in an infinite context).
          *   *Verdict:* Philosophically robust but practically paralyzing (ironically).

      *   **Approach 5: Hyperreal/Surreal Utilities.**
          *   *Idea:* Use non-standard analysis to assign specific infinite values (e.g., $\omega$, $\omega + 1$).
          *   *Pros:* Restores cardinal comparability. Distinguishes between different sizes of infinity.
          *   *Cons:* Mathematically complex. Philosophically obscure (what does $\omega$ utils *mean*?). Still faces measurement problems.
          *   *Verdict:* Technically impressive, but ontologically/ethically questionable.

      *   **Approach 6: Expectation/Measure Theory (The "Measure" Problem).**
          *   *Idea:* In eternal inflation, we care about the *measure* of observers, not the raw count.
          *   *Pros:* Addresses the multiverse specific context.
          *   *Cons:* The "measure problem" in cosmology is unsolved.
          *   *Verdict:* High potential but currently speculative. (Not explicitly listed by user, but implied by "multiverse"). I should stick to the user's list mostly, but maybe group causal restriction with measure if needed. Let's stick to the user's explicit list + standard philosophical responses.

