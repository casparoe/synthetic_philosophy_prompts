          *   **B Tier:** *Overtaking/Catching-up.* Standard in economics, handles temporal infinity well, but struggles with spatial infinity and origin dependence.
          *   **C Tier:** *Hyperreal/Surreal Utilities.* Mathematically clever but lacks ethical grounding. What is an "omega" unit of welfare?
