      *   Ensure they address each other as "Mr. Garrison" and "Mr. Douglass" or "William" and "Frederick" depending on intimacy. Given their history, "William" and "Frederick" shows the personal bond straining under the intellectual weight.

  6.  **Final Review against Prompt:**
