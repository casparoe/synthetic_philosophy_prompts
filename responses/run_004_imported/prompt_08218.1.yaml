      *   *Check:* Did I include Taney? *Correction:* Ensure Garrison uses Taney as the culmination of the document's logic, while Douglass dismisses Taney as a misreader.
      *   *Check:* Is the ending sharp? *Correction:* Avoid a handshake that implies resolution. End on the tension between "Moral Witness" vs. "Political Power."

  5.  **Polishing the Voice:**
