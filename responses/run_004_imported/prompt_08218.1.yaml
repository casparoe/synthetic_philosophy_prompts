answer: |-
  **Rochester, New York. May, 1857.**

  **The study is dim, lit by a single oil lamp. Papers are scattered across the desk—broadside prints of Chief Justice Taney's opinion in *Dred Scott v. Sandford*. WILLIAM LLOYD GARRISON stands by the window, his frame rigid. FREDERICK DOUGLASS sits at the desk, his hands resting on the printed decision.**

  **GARRISON:**
  Seven years, Frederick. It has been seven years since you parted ways with *The Liberator*, since you turned your coat toward the ballot box and the Constitution. And now? Now Chief Justice Taney has handed down his decree. "No rights which the white man was bound to respect." He says the Negro is a beast, and the Constitution is his chain. Does the ink not burn your fingers? Does this not vindicate what I have shouted from Boston to London? The Constitution is a covenant with death. An agreement with hell.

  **DOUGLASS:**
  The decision is a judicial atrocity, William. We agree on that. Taney's opinion is a moral blindness masquerading as legal reasoning. But you mistake the diagnosis. You say the disease is the Constitution. I say the disease is the corruption of the men who wield it.

  **GARRISON:**
  (Turns from the window, eyes flashing)
  Corruption? No. Consistency. Taney did not invent the logic; he merely read the text. Look at the evidence you refuse to see. The Three-Fifths Clause—it taxes the slave as property but counts him as a fraction of a man to swell the master's political power. The Fugitive Clause—it commands the North to act as bloodhounds. The clause barring any restriction on the slave trade until 1808—it guaranteed twenty years of kidnapping. These are not ambiguities. They are locks. And Taney has simply turned the key. To work within this system is to grease the hinges of the prison.

  **DOUGLASS:**
  You read the clauses as if they exist in a vacuum. I read them as a lawyer reads a charter. Nowhere in that document does the word "slave" appear. Nowhere does it say "slavery." It speaks of "persons held to service." It uses the language of euphemism because the Framers were ashamed. They hid the sin because they knew it contradicted the instrument's purpose.

  **GARRISON:**
  Ashamed? They were complicit! And what of the purpose? You lean on the Preamble. "Secure the Blessings of Liberty." But whose liberty, Frederick? The text secures the liberty of the master to hold the slave. If the Constitution protects the return of the fugitive, it violates the liberty of the fugitive. You cannot serve two masters.

  **DOUGLASS:**
  (Leans forward, voice steady)
  The ordinary rules of legal interpretation require that specific clauses be read in light of the whole. The Preamble declares the object: Justice and Liberty. A clause that seems to grant power over men must be interpreted narrowly so as not to defeat the primary object. The Constitution is a *means* to liberty, not an end in itself. If a clause can be read two ways—one supporting slavery, one supporting liberty—the law demands we choose liberty. Taney chose slavery. That is his error, not the document's.

  **GARRISON:**
  That is sophistry! It is willful blindness to what the Constitution has always actually licensed in practice. For seventy years, the government has been a slave government. The armies, the navies, the post offices, the courts—all used to sustain the peculiar institution. You say, "Read the words." I say, "Look at the blood." By voting, by holding office, by swearing an oath to this document, you lend it a legitimacy it does not deserve. You tell the slaveholder, "Your title is good." I say the title is void, and the only righteous act is to dissolve the Union. No union with slaveholders!

  **DOUGLASS:**
  (Stands, meeting Garrison's intensity)
  And there lies the trap you have set for yourself, William. If you declare the Constitution pro-slavery, you hand the slaveholders exactly the interpretive victory they want. They say, "This is our property by constitutional right." And you answer, "Amen. The document is corrupt, so we must leave it." You abandon the legal ground! If the Constitution is pro-slavery, then the abolitionist is the revolutionary, and the slaveholder is the constitutionalist. I will not concede that ground. I say the Constitution is anti-slavery. Therefore, *they* are the rebels. *They* are violating the supreme law.

  **GARRISON:**
  (Paces sharply)
  I would rather stand outside the burning building and shout "Fire!" than remain inside and pretend it is a temple! You speak of legal ground. What ground is there when the Supreme Court says black men have no rights? Your political strategy is a mirage. You seek to use a weapon that is pointed at your own chest. To participate in this Union is to sin. It is to say that the vote of a slaveholder is equal to the vote of a free man. It is moral suicide.

  **DOUGLASS:**
  Moral purity saves your soul, William, but it does not free the bondsman. You offer a prophecy; I seek a remedy. If we dissolve the Union, as you urge, what then? A Northern confederacy? The South will not simply vanish. The fugitive will still be hunted. The border will still be crossed. By staying in the Union, we can use its powers. We can appoint anti-slavery judges. We can use the postal service to send abolitionist literature. We can turn the government's strength against the oligarchy. Your path leaves the slave in the hands of the master, with only a clear conscience for a comfort.

  **GARRISON:**
  (Stops pacing, voice dropping to a harsh whisper)
  My path leaves the slave in the hands of God, and the master in the hands of his own guilt. It refuses to acknowledge that a man can be property. You say I give the slaveholder victory by calling the Constitution pro-slavery. I say I strip him of his mask. I show the world that the American government is not a beacon, but a tyrant. If the price of liberty is the destruction of this Union, then let it crumble. Better a ruin of stones than a palace built on bones.

  **DOUGLASS:**
  And I say that is the logic of despair. It assumes the evil is stronger than the good. It assumes the Preamble is a lie. I believe the text, properly wielded, is a sword. You refuse to pick it up because the hilt is warm from the enemy's hand. But if we do not fight with the law, we fight only with words. And Taney has shown us that words, without power, are wind.

  **GARRISON:**
  Then we are at an impasse that no debate can bridge. You see a tool to be cleansed. I see an idol to be smashed.

  **DOUGLASS:**
  You see a covenant with death. I see a promise of life, yet unfulfilled.

  **GARRISON:**
  (Picks up his hat)
  History will judge whether your faith in the law was wisdom, or merely a slower form of surrender.

  **DOUGLASS:**
  And history will judge whether your separation was righteousness, or merely a retreat from the battlefield.

  **GARRISON:**
  (Nods, a grim acknowledgment)
  Good night, Frederick.

  **DOUGLASS:**
  Good night, William.

  **Garrison exits into the dark. Douglass remains, looking down at the *Dred Scott* decision. He does not move the paper. He places his hand upon it, as if to hold it down, or perhaps to crush it.**

