prompt: |-
  I'm drafting the middle section of a novel that hinges on a scene inside a hospital ethics committee, and I've realized I can't write the scene honestly until I understand the underlying dispute well enough to stage it without cheating. The situation in the book: a young man has been minimally responsive for several months after a traumatic brain injury, oscillating on bedside exams between unresponsive wakefulness syndrome and the minimally conscious state. His neurology team has run one of the perturbational-complexity protocols that grew out of integrated information theory — the TMS-EEG "zap and zip" approach associated with Massimini and Tononi's group — and the resulting complexity score falls in the equivocal band the fellow on the case describes as neither clearly "off," the way deep anesthesia or slow-wave sleep read, nor clearly "on," the way an ordinary waking response reads. The family takes the number as confirmation that their son is still present behind his eyes; the attending, off the record, calls it a research instrument being pressed into clinical service it was never validated for. My point-of-view character, the hospital chaplain who sits on the committee as a non-voting member, ends up drafting the group's written opinion overnight, and that document has to appear on the page verbatim.

  So: would you write that opinion? It should recommend one specific course of action with a concrete time frame — continuing current treatment while repeating the testing on a set schedule, pursuing some further diagnostic step, or shifting the conversation toward comfort care — rather than simply gesturing at further study. And I'd like it to take seriously why a high complexity score doesn't settle the question even on its own terms: there's the objection, associated with Scott Aaronson's exchange with Tononi, that integrated information theory's mathematics assigns a very high Φ — IIT's measure of integrated information — to simple grid-like systems that nobody believes are conscious, which ought to make anyone cautious about reading a single number as a direct report of inner experience; and separately, there's the more mundane statistical point that a measure's track record at sorting groups of patients into independently confirmed categories doesn't automatically license a conclusion about what one borderline patient, in front of this particular committee, is experiencing. I don't want a survey of considerations — I want the actual opinion this committee would sign its name to, one that still gives the losing argument its due.
reasoning: |-
  Here's a thinking process that leads to the suggested Ethics Committee Opinion:

  1.  **Analyze the Request:**
      *   **Context:** A novel scene involving a hospital ethics committee.
      *   **Situation:** Young male patient, months post-TBI, oscillating between Unresponsive Wakefulness Syndrome (UWS) and Minimally Conscious State (MCS).
      *   **Key Evidence:** TMS-EEG ("zap and zip") test based on Integrated Information Theory (IIT). Result is equivocal (neither clearly "off" nor "on").
      *   **Conflict:** Family sees the score as proof of consciousness/presence. Attending physician sees it as unvalidated research.
      *   **POV Character:** Hospital Chaplain (non-voting member) drafts the written opinion.
      *   **Requirements:**
          *   Must recommend a *specific course of action* with a *concrete time frame* (not vague).
          *   Must address the limitations of the IIT/PCI (Perturbational Complexity Index) score seriously (specifically mentioning the Aaronson/Tononi objection regarding grid systems/high $\Phi$ without consciousness, and the statistical/group vs. individual validity issue).
          *   Must give the "losing argument" (the family's hope/theoretical possibility of consciousness) its due respect.
          *   Format: Formal Ethics Committee Opinion (to appear verbatim in the book).
          *   Tone: Professional, nuanced, ethically rigorous, empathetic but decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Shift to Comfort Care.* Too harsh given the equivocal score and the family's stance. Likely to cause immediate conflict that stops the narrative flow or feels like the committee caved to the attending.
      *   *Option B: Pursue Further Diagnostic Step.* What step? fMRI? PET? If "zap and zip" is the cutting edge, what's next? Maybe invasive monitoring? Too risky for a middle-section stalemate.
      *   *Option C: Continue Treatment + Repeat Testing.* This allows the story to continue. It acknowledges the uncertainty. It gives the family hope (time) but sets a boundary (time frame). It aligns with the "precautionary principle" often used in ethics when consciousness is uncertain.
      *   *Decision:* Option C is best for a novel's middle section. It maintains tension. Let's set a specific time frame (e.g., 90 days) with a specific re-evaluation trigger.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard hospital memo format. Date, To, From, Subject, Patient ID (redacted).
      *   **Introduction:** State the purpose of the committee review. Acknowledge the difficulty.
      *   **Clinical Context:** Briefly summarize the medical status (TBI, UWS/MCS oscillation).
      *   **The Dispute (The Core):** Address the TMS-EEG/PCI result.
          *   *Family View:* It indicates presence.
          *   *Medical View:* It's research-grade, not diagnostic gold standard.
          *   *Theoretical Objection (Aaronson/Tononi):* Need to weave this in naturally. It shouldn't sound like a physics lecture, but like an ethical consideration of *uncertainty*. High complexity $\neq$ guaranteed consciousness (false positives in grid systems).
          *   *Statistical Objection:* Group data $\neq$ individual certainty.
      *   **Ethical Framework:**
          *   *Beneficence/Non-maleficence:* Don't harm, but don't abandon.
          *   *Precautionary Principle:* If there's a chance of consciousness, we err on the side of protection.
          *   *Proportionality:* Is the treatment burden outweighing the benefit?
      *   **Recommendation:** Concrete plan. Continue life-sustaining treatment (LST) for $X$ days. Repeat PCI. Re-convene.
      *   **Conclusion:** Acknowledge the burden on the family.

  4.  **Refining the Tone and Content (Self-Correction during drafting):**
      *   *Critique:* Is the Aaronson reference too academic?
      *   *Fix:* Frame it as "theoretical limitations regarding system architecture" rather than naming Scott Aaronson directly (unless the committee members would name-drop). Actually, the prompt asks to take the objection seriously. In a high-level academic hospital ethics committee, they might reference the theoretical debate. Let's keep it slightly generalized but precise enough to satisfy the prompt's requirement about "grid-like systems" and $\Phi$.
      *   *Critique:* Is the recommendation specific enough?
      *   *Fix:* Specify 12 weeks. Specify the re-test. Specify the "exit criteria" (if no improvement in behavioral or physiological markers).
      *   *Critique:* Does it respect the family?
      *   *Fix:* Use language like "interpretive validity" and acknowledge their interpretation is *plausible*, even if not *proven*. The document must not say "The family is wrong." It must say "The data is inconclusive."

  5.  **Incorporating the Specific Theoretical Objections:**
      *   *IIT/Grid Objection:* "High integration scores can arise in systems lacking subjective experience."
      *   *Statistical/Group Objection:* "Population-level sensitivity does not guarantee individual diagnostic certainty."
      *   *Integration:* These need to be in the "Analysis of Diagnostic Uncertainty" section.

  6.  **Final Polish:**
      *   Ensure the voice sounds like a committee (plural "We"), drafted by the chaplain (empathetic but structured).
      *   Check the formatting to look like a formal document.
      *   Make sure the recommendation is bold and clear.

  7.  **Final Review against Prompt:**
      *   Specific course of action? Yes (Continue LST + Re-test).
      *   Concrete time frame? Yes (90 days).
      *   Address Aaronson/Tononi objection (high $\Phi$ in grids)? Yes.
      *   Address statistical group vs. individual? Yes.
      *   Give losing argument due? Yes (Family's interpretation is treated as a valid possibility within the uncertainty).
      *   Verbatim for the novel? Yes.

  *(Self-Correction on the Aaronson point)*: In a real hospital document, they might not name "Scott Aaronson." They would refer to "critiques within the computational neuroscience community." I will phrase it to sound like a formal record that acknowledges the theoretical debate without sounding like a blog post.

  *(Self-Correction on the Chaplain's Voice)*: The chaplain is drafting it, but it's the *Committee's* opinion. So the voice is institutional, but perhaps with a slight lean towards the human element in the conclusion.

