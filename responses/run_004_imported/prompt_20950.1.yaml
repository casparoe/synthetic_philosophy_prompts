answer: |-
  This is a fantastic observation. You have correctly identified one of the most famous tensions between mathematical theory and legal practice. It's a common "aha!" moment for people who dive into the philosophy of law.

  You aren't missing the math, but the legal system isn't ignoring the math either. It's prioritizing different variables than the Condorcet Jury Theorem (CJT) assumes.

  Here is why courts don't impanel 100-person juries and vote by majority, broken down by the math, the law, and the logistics.

  ### 1. The Math: Why CJT Doesn't Apply Perfectly to Courtrooms
  The Condorcet Jury Theorem is elegant, but it relies on three strict assumptions that rarely hold true in a courtroom. If these assumptions break, the theorem breaks.

  **Assumption A: Independence**
  CJT assumes every voter decides *independently*. In a courtroom, jurors are explicitly told to deliberate together. They talk, debate, and influence one another.
  *   **The Problem:** Once jurors talk, they are no longer independent data points. If a charismatic foreperson sways the room, you don't have 100 independent opinions; you have 100 correlated opinions. In statistics, adding correlated data points doesn't increase accuracy the way adding independent ones does. A 100-person jury that deliberates together might act like a 12-person jury, just with more lunch costs.

  **Assumption B: Competence ($p > 0.5$)**
  CJT proves that if each voter is *more likely than not* to be correct ($p > 0.5$), adding voters approaches certainty. However, if the average voter is *less* likely than not to be correct ($p < 0.5$), adding more voters guarantees the **wrong** outcome.
  *   **The Problem:** Criminal cases often involve complex forensic evidence, legal instructions, and rules of evidence that laypeople don't understand. If a case is so technical that the average juror has only a 40% chance of interpreting the evidence correctly, a 100-person jury would mathematically guarantee a wrongful conviction.

  **Assumption C: There is an Objective "Correct" Answer**
  CJT assumes there is a binary truth (Guilty/Innocent) that can be discovered.
  *   **The Problem:** In law, "truth" is procedural. A verdict isn't a scientific fact; it's an application of a standard ("Beyond a Reasonable Doubt"). A jury isn't a sensor measuring reality; it's a buffer between the state and the accused.

  ### 2. The Law: Accuracy Isn't the Only Goal
  You mentioned that small juries leave "accuracy on the table." The legal system would argue that **accuracy is not the supreme value.**

  **Blackstone's Ratio**
  The foundational principle of common law is: *"It is better that ten guilty persons escape than that one innocent suffer."*
  *   **Majority Rule:** If you have 100 jurors and allow a 51% majority verdict, 51 people can send someone to prison while 49 people have reasonable doubt. That violates the "Beyond a Reasonable Doubt" standard.
  *   **Unanimity:** Requiring unanimity forces the majority to listen to the minority. If one person sees a flaw in the evidence, they can hold out. This acts as a check against groupthink and prosecutorial overreach. It sacrifices *efficiency* (and perhaps some statistical probability of conviction) for *protection of rights*.

  **Deliberation Quality**
  The Supreme Court addressed this in *Williams v. Florida* (1970). They analyzed whether 12-person juries were significantly better than 6-person juries. They concluded that while larger groups might have more information, **smaller groups deliberate more effectively.**
  *   In a group of 100, shy jurors never speak.
  *   In a group of 12, everyone is expected to participate.
  *   The goal isn't just to aggregate bias (voting); it's to scrutinize evidence (discussing).

  ### 3. The Logistics: The Nightmare Scenario
  Even if we ignored the math and the philosophy, the practical hurdles are immense.

  *   **Cost:** Jurors are paid (albeit poorly). Housing, feeding, and securing 100 people for weeks or months would bankrupt many county court systems.
  *   **Selection:** Voir dire (jury selection) would take forever. Attorneys would need to question 500 people to find 100 unbiased ones.
  *   **Hung Juries:** Paradoxically, if you kept the unanimity rule but increased the jury to 100, you would almost *never* get a verdict. The probability of at least one person holding out increases with group size. If you switched to majority rule to fix that, you run into the rights issues mentioned above.

  ### Summary
  The legal system isn't "behind on the math." It has effectively decided that the Condorcet Jury Theorem models a **truth-seeking machine**, whereas a jury is a **liberty-protecting institution.**

  *   **CJT** optimizes for the probability of a correct binary decision.
  *   **The Court** optimizes for the legitimacy of the verdict, the protection of the accused, and the feasibility of the process.

  So, when you show up for duty, remember: You aren't there to be a data point in a statistical algorithm. You're there to be a human check on state power. The system wants you to talk to the other 11 people, not just vote in isolation.

  (And sorry about the summons. Bring a book.)
