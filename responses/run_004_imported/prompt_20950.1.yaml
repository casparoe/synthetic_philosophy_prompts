      *   **User's Hypothesis:** Is the legal system leaving accuracy on the table? Is it behind on the math?
      *   **Tone:** Curious, slightly skeptical of the legal system, logical/math-oriented.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *What does it actually say?* If each voter has a probability $p > 0.5$ of being correct, and they vote independently, the probability that the majority vote is correct approaches 1 as the number of voters approaches infinity.
      *   *What are the assumptions?*
          1.  Binary choice (Guilty/Not Guilty).
          2.  Independence (Jurors don't influence each other).
          3.  Competence ($p > 0.5$).
          4.  Sincerity (Jurors vote their true belief).
      *   *Where does it fail in the legal context?*
          *   Independence is violated (deliberation happens).
          *   Competence is not guaranteed (evidence can be confusing, bias exists).
          *   Binary choice is an oversimplification (degrees of guilt, sentencing, etc., though verdict is binary).
          *   "Correctness" is ill-defined in law (there is no objective "truth" button).

  3.  **Address the "Why not 100 jurors?" question (Practical & Legal Reasons):**
      *   **Cost/Logistics:** Paying, housing, feeding, managing 100 people is exponentially more expensive and difficult than 12.
      *   **Deliberation:** It's hard to have a meaningful discussion with 100 people. Small groups allow for scrutiny of evidence.
      *   **Representation vs. Efficiency:** 12 is seen as a balance between a cross-section of the community and a functional working group.
      *   **Supreme Court Precedent:** *Williams v. Florida* (1970) ruled 6-person juries are constitutional in state criminal cases (though 12 is standard for federal). The Court explicitly rejected the idea that larger juries are significantly better for deliberation.

  4.  **Address the "Why Unanimity?" question:**
      *   **Reasonable Doubt:** Unanimity forces the majority to persuade the minority. It ensures the standard of "beyond a reasonable doubt" is met.
      *   **Minority Protection:** Prevents the majority from steamrolling a dissenting view that might be based on a crucial insight or bias check.
      *   **Legitimacy:** A unanimous verdict carries more weight and public trust than a 51-49 split.
      *   **CJT Conflict:** CJT suggests majority rule is efficient for *truth-seeking*. Law prioritizes *error distribution* (better to let 10 guilty go free than 1 innocent suffer).

  5.  **Address the "Math vs. Law" disconnect:**
      *   The legal system isn't trying to maximize statistical accuracy in the scientific sense. It's trying to balance accuracy with fairness, rights, and cost.
      *   The "Correctness" assumption ($p > 0.5$) is shaky. If the average juror is *less* than 50% competent (due to complexity or bias), CJT says adding more people makes it *worse*.
      *   Independence is the biggest killer of CJT in courtrooms. Jurors talk. Groupthink happens.

