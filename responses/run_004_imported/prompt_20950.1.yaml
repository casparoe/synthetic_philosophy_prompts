prompt: |-
  So I just recieved a jury duty summons in the mail (ugh, first time) and went down a bit of a rabbit hole reading about how reliable juries actually are. I ran into the Condorcet Jury Theorem, which as far as I can tell basically proves that if you keep adding more jurors, the group's verdict gets closer and closer to guaranteed correct. So why do courts still bother with tiny 12-person juries and require unanimous verdicts instead of just impaneling like 60 or 100 people and going with majority rule? Feels like we're leaving a ton of accuracy on the table for no good reason - am I missing something here, or is the legal system just behind on the math?
