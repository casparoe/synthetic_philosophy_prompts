  **The Manual of Us**

  The apartment smelled of cardboard and tape. It was the scent of departure, of a life being compressed into cubic feet. Elias sat at the kitchen table, a stack of papers in front of him. Across from him, Sarah was wrapping a ceramic bowl in newspaper, the crinkle of the print echoing in the empty room.

  They were leaving for Berlin in two days. The landlord required a "House Manual" for the subletter, a college kid named Julian who didn't know their rhythms.

  "Write down what 'Do Not Touch' means," Sarah said, taping the box shut. "For the shelf."

  Elias clicked his pen. "Item: The Shelf. Instruction: Do Not Touch."

  "No," Sarah said, pausing with the tape gun. "That's not precise enough. Julian might think it means 'don't lean on it.' I mean don't move the objects on it."

  "Okay. 'Do not move objects on the shelf.'"

  "But if he dusts, he has to move them," Sarah countered. "So it's not the objects. It's the arrangement."

  Elias wrote: *Maintain arrangement of objects on shelf.*

  He stopped. The pen hovered over the paper. A cold, familiar itch started at the base of his skull. It was the same feeling he'd had in grad school, back when they were both still pretending philosophy was just about arguments and not about the ground dissolving beneath your feet.

  "Sarah," Elias said. "When you say 'the arrangement,' what is the referent?"

  She looked up, wiping dust from her cheek. "The way the books and the figurines sit. You know."

  "Do I?" Elias leaned forward. "Think about the last three years. Every time we've said 'keep the arrangement,' we've agreed. We've nodded. We've acted. The stimulus meaning is identical. We both assent to 'The arrangement is ruined' if a book is tilted. We both dissent if the books are in the same place but the dust has been wiped."

  "Sure. So write that."

  "But why?" Elias asked. "Is 'the arrangement' a property of the books? Or is it a spatial relation? Or is it the specific set of photons reflecting off the shelf at a given time?"

  Sarah sighed, putting the tape gun down. "Elias, don't do this. We're speaking English. We're not in the jungle trying to translate 'Gavagai'."

  "That's exactly the point," Elias said, tapping the paper. "We think we're safe because we share a culture. But Quine was right. It's not about the jungle. It's here. At home. Right now. I have no idea what you mean by 'arrangement' other than how you behave when you see it. And your behavior matches my behavior perfectly. But that doesn't mean our internal manuals match."

  "So what? If we act the same, does it matter?"

  "It matters if there's a fact of the matter," Elias said. "If there's a *truth* to what you mean, then we're just ignorant of it. But if there's *no fact of the matter*... then we're just coordinating noises. We're not sharing ideas."

  Sarah stood up and walked to the shelf. It held a row of hardbacks, a small brass bird, and a smooth stone from a beach in Oregon. "Pick up the bird," she said.

  Elias picked it up. "Now, is 'The Bird' still on the shelf?"

  "Yes."

  "Is it?" Elias held it in his hand. "If 'The Bird' refers to the matter, it's in my hand. If 'The Bird' refers to the location-function, it's still on the shelf. If 'The Bird' refers to a temporal stage of a bird-object, then the bird that was on the shelf is gone, and this is a new bird-stage."

  "We know what it means," Sarah said, her voice tightening. "It means the brass object."

  "How do you know?"

  "Because I bought it."

  "That's just more words," Elias said softly. " 'Bought' is indeterminate too. Did you buy the matter? The design? The receipt?"

  Sarah walked over to the table and looked down at the manual. "You're saying that even though we've lived together for five years, even though we know each other's voices and habits and fears, I don't actually know what you mean when you say 'I love you'?"

  "I'm saying there is no fact of the matter to know," Elias said. "When you say 'love,' you assent to certain stimuli. You stay when things are hard. You buy coffee. I do the same. Our behavioral dispositions align. That's all 'love' is. There isn't a ghostly entity called Love that we're both grasping. There's just the manual. And I could write a manual for your usage of 'love' that fits all your behavior perfectly but translates 'love' as 'habitual co-dependency' or 'mutual utility,' and there would be no physical evidence to prove me wrong."

  Sarah sat back down. The room was quiet. The refrigerator hummed, a steady, physical sound.

  "That's terrifying," she said.

  "It's liberating," Elias said, though he didn't sound sure. "It means we don't have to find the 'real' meaning. We just have to make sure the manuals work."

  "So for Julian," Sarah said, gesturing to the paper. "For the shelf."

  "Right. We can't tell him what the arrangement *is*. Because there isn't a 'what.' We can only tell him how to behave."

  Elias crossed out *Maintain arrangement of objects on shelf.*

  He wrote: *If you move the books, put them back in the exact position. If you are unsure if it is the exact position, it is not.*

  "That's still vague," Sarah said. "What counts as 'unsure'?"

  "It doesn't matter," Elias said. "Because 'unsure' is also indeterminate. But if we both agree to assent to the statement 'Julian messed up' when he leaves a book crooked, then the translation holds. We're not defining the world, Sarah. We're just setting up a system of triggers."

  Sarah looked at the brass bird, now back on the shelf. "So when I talk to my mother... when she tells me she's 'in pain'..."

  "There is no fact of the matter whether she means the same 'pain' as you," Elias said. "She exhibits pain-behavior. You exhibit pain-behavior. The neural states might be inverted. The qualia might be absent. But the translation manual works. You bring her tea. She says 'thank you.' The circuit closes."

  "It feels like cheating," Sarah said. "Like we're pretending to understand each other."

  "We are understanding each other," Elias said. "Just not in the way we thought. We thought meaning was a bridge between minds. It's not. It's just the synchronization of behavior. We're two machines that have learned to output compatible codes."

  Sarah picked up the pen. She looked at the blank space for "Emergency Contact."

  "If I put 'Elias'," she said, "and the paramedics ask, 'Is he next of kin?'..."

  "There is no fact of the matter what 'kin' means in this context," Elias said. "It means whoever signs the paper."

  Sarah wrote *Elias* in the box. She capped the pen.

  "Okay," she said. "So we finish the manual. We leave it for Julian. He will follow the instructions. He will move the books. He will put them back. He might have a completely different ontology of 'book-ness' than we do. He might think the books are sacred idols. We might think they're paper bricks. But as long as the physical positions match, the translation succeeds."

  "Exactly," Elias said. "Ontological relativity. We can't step outside our own manual to check it against reality. We just check it against each other."

  Sarah stood up and walked to the shelf again. She reached out and tilted the brass bird one millimeter to the left.

  "What did you just do?" Elias asked.

  "I changed the arrangement," she said.

  "Did you?" Elias watched her. "Or did you just create a new bird-stage?"

  "I created a situation where you will say 'Put it back,' " Sarah said. "And I will say 'Okay.' And then we will be in sync again."

  She pushed the bird back into place.

  "Synced," Elias said.

  "Synced," Sarah agreed.

  She turned back to the table and picked up the House Manual. She didn't read it over. There was no point. The words on the page were just more stimuli, more marks to trigger behavior in Julian. They didn't contain the essence of the apartment. They were just tools.

  "Let's order pizza," Sarah said. "For the road."

  "Pepperoni?" Elias asked.

  "Sure," Sarah said.

  "Does 'Sure' mean you want pepperoni?"

  "It means I will eat the pepperoni if you order it, and I will not object," she said. "And that's all 'want' has ever meant."

  Elias picked up his phone. He tapped the screen. The order was placed. The physical world shifted slightly to accommodate their request. No meanings were exchanged. No souls touched. But the hunger would be sated, and the boxes would be taped, and they would leave the apartment together.

  "It works," Elias said.

  "Yeah," Sarah said, watching the tape gun glide over the cardboard. "It works."
