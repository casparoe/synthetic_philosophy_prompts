  3.  **Evaluate the Philosophical Interpretation:**
      *   *The Dualism of Practical Reason:* Sidgwick argues that Rational Egoism and Rational Benevolence (Utilitarianism) are both rational but can conflict. Without a divine sanction (reward/punishment or harmony in the afterlife), there's no rational obligation to choose Benevolence over Egoism when they conflict.
      *   *The Connection to Psychical Research:* Does Sidgwick view SPR work as solving the Dualism?
