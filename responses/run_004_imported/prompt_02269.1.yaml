answer: |-
  You have stumbled onto one of the most persistent and heated debates in the history of political philosophy. It is a fantastic question, and your intuition is spot-on: if Aquinas really gave a universal "green light" for assassination, medieval Europe would have looked very different, and modern Catholic theologians would be quoting it constantly.

  The short answer is: **You are misunderstanding what Aquinas actually argued, largely because internet summaries often strip away the crucial nuance.**

  Aquinas did discuss tyranny extensively, but he did **not** give ordinary private citizens (like peasants or random nobles) the moral authority to assassinate a ruler. In fact, he explicitly argued *against* private individuals taking that step.

  Here is the breakdown of what Aquinas actually said, why peasants didn't start killing kings, and why you don't hear about this much today.

  ### 1. What Aquinas Actually Said: Public vs. Private
  The confusion usually stems from a text called *De Regno* (On Kingship), specifically Book I, Chapter 6. In this text, Aquinas asks: "What is to be done about a tyrant?"

  His answer is layered, but the most important distinction he makes is between **private presumption** and **public authority**.

  *   **Private Individuals:** Aquinas argues that it is **not** the business of private individuals to kill a tyrant. He warns that attempting this often leads to greater chaos. If anyone can decide the ruler is a tyrant and kill him, you invite endless civil war, factionalism, and instability. He writes that trying to remove a tyrant privately often results in the removal of the tyranny being "more dangerous than the tyranny itself."
  *   **Public Authority:** Aquinas *does* allow for a tyrant to be removed, but only by a **public authority**. In the medieval context, this meant a higher lord (like an Emperor deposing a local King), a council of nobles acting in an official capacity, or potentially the Pope (since the Pope could theoretically depose a ruler who was endangering the souls of his subjects).

  So, Aquinas isn't endorsing "tyrannicide" in the sense of a vigilante assassination. He is endorsing **lawful deposition**. He is arguing for a constitutional check on power, not a moral free-for-all.

  ### 2. Why Didn't Peasants Do This?
  You asked why every peasant living under a horrible lord didn't feel obligated to take matters into their own hands. Based on Aquinas's actual teaching, the answer is: **Because he told them not to.**

  Aquinas was a realist. He knew that medieval society was fragile. If you tell every disgruntled subject that they have a moral duty to kill the king, society collapses into anarchy. For Aquinas, **order is a prerequisite for justice.** A bad order is sometimes preferable to no order at all, because without order, the common good cannot be pursued.

  Furthermore, there were practical deterrents:
  *   **Excommunication:** The Church held the power of excommunication. Killing an anointed king was often viewed as a sin against God's ordinance (referencing Romans 13, as your grandma taught). A peasant who killed a lord would likely be excommunicated, which in the Middle Ages meant spiritual damnation and social ostracization.
  *   **Feudal Structure:** A peasant didn't have direct access to the King. They had a local lord. Rebelling against the local lord was treason. There was no mechanism for a "public authority" to step in on behalf of a peasant.

  ### 3. The Development of His Thought
  It is worth noting that Aquinas's views evolved slightly over his life, which adds to the confusion.
  *   **Early Work:** In his *Commentary on the Sentences* (written when he was younger), he was slightly more permissive regarding tyrannicide if there was no higher authority to appeal to.
  *   **Mature Work:** In the *Summa Theologiae* and *De Regno* (his mature political thought), he became much more cautious. He emphasized that the remedy for tyranny must not be worse than the disease.

  Scholars generally agree that his mature position is the one that carries weight: **Resistance is permissible, but it must be conducted through lawful, public means, not private violence.**

  ### 4. Why Isn't This Quoted Today?
  You asked why modern Catholic natural law proponents don't use this to argue against modern dictators. There are a few reasons for this:

  1.  **The Shift to Democracy:** Modern Catholic Social Teaching (especially post-Vatican II) emphasizes the importance of democratic participation, the rule of law, and non-violent resistance. The idea of "killing the dictator" is less relevant when the focus is on voting, civil disobedience, and international pressure.
  2.  **Just War Theory:** When the Church talks about violence, it uses "Just War Theory." This requires a *legitimate authority* to declare the conflict. A private citizen assassinating a dictator rarely meets the criteria of "legitimate authority."
  3.  **Fear of Extremism:** Catholic theologians are very careful not to provide theological cover for political violence. If they emphasize tyrannicide too much, it could be used to justify terrorism or insurgency by groups the Church disagrees with.
  4.  **Focus on the "Common Good":** Modern Catholic thought focuses heavily on building structures that protect human dignity (subsidiarity, solidarity) rather than focusing on the removal of specific leaders. The goal is to fix the system, not just the person at the top.

  ### 5. Summary: Your Grandma vs. The Internet
  Your grandma's intuition that the Church teaches "obey the authorities" is actually more aligned with Aquinas than the internet rabbit hole suggests.

  Aquinas believed that authority comes from God for the sake of the common good. If a ruler destroys the common good, they cease to be a true ruler and become a tyrant. **However**, the remedy for that tyranny must not destroy the common good further.

  *   **Internet Claim:** "Aquinas says kill bad kings."
  *   **Aquinas's Reality:** "Bad kings may be deposed by public authority, but private assassination usually makes things worse and is forbidden."

  So, you haven't missed a secret Catholic history of assassination; you've just encountered a complex philosophical position that has been simplified into a meme. Aquinas was trying to walk a tightrope between blind obedience to tyrants and chaotic vigilante justice. He landed firmly on the side of **lawful resistance**, not murder.
