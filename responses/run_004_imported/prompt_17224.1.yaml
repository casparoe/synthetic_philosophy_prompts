answer: |-
  Here are nine interview questions designed for your podcast, structured to move from the architecture of the view to its most difficult pressure points. The three required questions (on deliberation, blame, and Korsgaard) include the requested follow-ups.

  **1. The Explanatory Function of Reasons**
  "Most introductions to Williams start with the definition: a reason must link to the subjective motivational set. But I want to start with the *job* you think reason statements are doing. Externalists often argue that the primary function of a reason statement is to evaluate an agent's conduct against an objective standard. You seem to think the primary function is explanatory or deliberative. If we adopt your view, do we lose the ability to use reason statements as a tool for criticism, or do you think criticism works better when it stays internal?"

  **2. The Composition of the 'S' Set**
  "Williams talks about the 'subjective motivational set' ($S$), but he's deliberately vague about what gets in there. It's not just brute desires; he includes dispositions, commitments, and projects. Where do you draw the line? If I have a commitment to a moral principle, does that commitment get into $S$ as a psychological fact about me, or does the *content* of the principle get in? The distinction matters for whether morality can ever generate reasons independently of my psychology."

  **3. The Limits of Deliberation (The Owen Wingrave Case)**
  "Let's look at the 'sound deliberative route.' In the *Owen Wingrave* case, Williams suggests that if Owen has no motivation to be a soldier, his family is wrong to say he has a reason to enlist. But defenders of internalism often say deliberation can correct false beliefs or reveal implications of our current motives. What exactly is deliberation permitted to *add* to the agent's set without quietly importing an external reason? If deliberation can tell Owen he *ought* to value family tradition, haven't we just smuggled the external reason back in under the guise of 'rational discovery'?"

  *   **Follow-up:** "You'll likely say deliberation only corrects factual errors or finds means to ends. But if Owen is factually correct about soldiering and simply rejects the end, is the internalist committed to saying there is *no* rational failure there? If so, does 'rationality' become too thin to do any normative work?"

  **4. The Nasty Husband and the Obscurity of Blame**
  "Williams's later work on blame addresses the case of the husband who is simply nasty to his wife and admits he doesn't care. On your view, if there's no element in his $S$ that leads to treating her well, he has no reason to change. But we still want to blame him. Williams suggests blame might be a 'proleptic' mechanism—treating him as if he had the reason to bring him into the moral community. Does this mean that when we blame him, we are acknowledging he is rationally impeccable but trying to manipulate him, or is there a sense in which he is actually making a rational error?"

  *   **Follow-up:** "If you say blame is a tool to *give* him a reason (e.g., to avoid social sanction), doesn't that concede the externalist's point? It suggests the reason to treat his wife well *didn't* exist until we threatened him, which implies the moral reason was external all along, and we're just using internal leverage to enforce it."

  **5. The Korsgaard Objection (Circularity)**
  "Christine Korsgaard argues that Williams's internalism is circular. She claims he defines a 'reason' as something that motivates, and then argues that if something doesn't motivate, it isn't a reason. She says this assumes the very thing at issue: that normative considerations must be grounded in motivation. How do you respond to the charge that internalism isn't an argument, but just a stipulation that rules out external reasons by definition?"

  *   **Follow-up:** "If you reply that reasons must explain action to be intelligible, Korsgaard would say normative facts *can* explain action if recognized. Is your resistance to this metaphysical? Are you saying external reasons are 'queer,' or are you saying we literally cannot make sense of the language if it doesn't link to motivation?"

  **6. The Friend's Objection (The Psychopath)**
  "A common worry is that internalism lets awful people off the hook. If a psychopath has no desire, however indirect, that connects to treating people decently, internalism says he has no reason to do so. He isn't irrational; he's just different. Does this force you to accept a form of moral relativism where the psychopath is rationally immune to moral criticism, provided he is consistent with his own nasty $S$?"

  **7. The Phenomenology of Obligation**
  "When people feel a moral obligation, it often feels like the reason is coming from the *outside*—from the situation or the other person's need, not from their own desires. Externalists say this phenomenology is evidence of the truth of externalism. Do you think this is an illusion we should explain away, or is there a way for an internalist to respect the 'objectivity' of that feeling without positing external reasons?"

  **8. The Persistence of Externalism**
  "If internalism is the correct view of how reasons work, why is externalism so persistent? Is it a linguistic confusion, a metaphysical hope, or is there a practical necessity to believing in external reasons that makes the view resilient even if it's theoretically false? Do we *need* to believe in external reasons to sustain moral practices?"

  **9. Falsification Conditions**
  "Finally, I want to ask about the limits of your commitment. Internalism is a robust theoretical stance, but what kind of case, if any, would you accept as genuine evidence against it? Is there a scenario where an agent clearly has a reason to act, despite there being no possible sound deliberative route from their $S$, that would force you to abandon the view?"
