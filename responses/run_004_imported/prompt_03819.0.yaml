answer: |-
  **Setting:** *The kitchen of the family home, late evening. The smell of stale coffee. The Father is washing mugs; the Aunt sits at the table, staring at a transcript of Nozick's *Anarchy, State, and Utopia* she's brought with her.*

  **Aunt:** You know what Nozick said about the machine. "We want to *do* certain things, and not just have the experience of doing them."

  **Father:** (Without turning from the sink) Mom isn't doing anything, Sarah. She's sitting in a chair. She's losing the ability to swallow. If the choice is between her feeling the terror of abandonment or the comfort of knowing Dad is at the grocery store, I choose the comfort.

  **Aunt:** But it's a simulation. That's the point. Nozick argued that well-being isn't just a mental state. It's about contact with a deeper reality. When the staff tell her he's out running errands, they are severing her last connection to the truth of her life. She is living in a fiction.

  **Father:** She's living in a dementia. The fiction is the only reality she can access. Look, Nozick was talking about healthy adults choosing to plug in for a lifetime. He was worried about wasted potential. Mom doesn't have potential anymore. She has moments. If we make the moments peaceful, we have done our job. Well-being *is* the absence of suffering. That's it.

  **Aunt:** That's a hedonistic calculus. And it works until it doesn't. If well-being is just the absence of suffering, why stop at the errand story? Why not give her a mild sedative every morning? She'd feel even better. She'd feel nothing. By your metric, a heavily medicated coma is the pinnacle of her care.

  **Father:** (Turns, drying a mug slowly) That's the slippery slope argument. It's lazy.

  **Aunt:** It's the logical implication. If truth has no independent value, then only the feeling matters. If we can engineer the feeling cheaper with drugs than with lies, the hedonist should choose the drugs.

  **Father:** Fine. Let's go there. If the drugs kept her from screaming at night, I would give them to her. I hate the idea, but if the alternative is her heart racing and her thinking she's lost her husband *again*, yes. I'd rather she be chemically peaceful than authentically devastated. But that's not what we're talking about. We're talking about a local machine. A five-minute lie, not a lifetime tank. Nozick's objection relies on the totality of the experience. He says we want to *be* a certain sort of person. Mom can't *be* a person in the full sense anymore. She's a fragment. Why demand the fragment carry the burden of truth when the whole has already shattered?

  **Aunt:** Because the fragment is still her. And because it's not just about her experience. It's about *us*. Nozick said we want our actions to have a certain relation to reality. When she asks where Dad is, she's asking for a connection to him. If we lie, we turn that relationship into a puppet show. We become the puppeteers. We lose our own contact with reality. I can't look her in the eye and participate in the erasure of her forty-year marriage. That erasure is an objective harm, even if she doesn't feel the sting of it.

  **Father:** So the harm is to you.

  **Aunt:** No. The harm is to the *relationship*. A relationship based on a lie isn't a relationship. It's a monologue.

  **Father:** (Leans against the counter) Okay. Now let's look at your uncomfortable corner. You say truth is an objective good. Independent of how it feels. So, if she asks me tomorrow, "Where is David?", and I say, "He died two years ago, Mom," and she cries... and then ten minutes later she asks again... and I tell her again... and she cries again. I have honored the truth. I have maintained "contact with deeper reality." But I have become an instrument of torture. Is that the objective good? Is her dignity worth more than her peace?

  **Aunt:** I'm not saying we should be cruel. I'm saying validation therapy is a convenience for the staff and for you. It stops the crying. It makes the visit easier.

  **Father:** It stops the grief!

  **Aunt:** It postpones it. It traps her in a loop where she's always waiting for a man who isn't coming home. That's a specific kind of anxiety. Nozick wrote that we want to *be* a certain way. To be a widow is a terrible way to be, but it is *her* way to be. To make her a woman waiting for a shopper is to make her someone she isn't. It's a theft of identity.

  **Father:** Identity is a narrative. Her narrative is broken. We are helping her edit the draft so it doesn't end in a scream. You talk about "contact with reality." What reality? The reality where her neurons are firing incorrectly? The reality where she is trapped in a body she doesn't recognize? If we're going to talk about Nozick, let's talk about his third reason. We want to be limited by reality. But Mom *is* limited. Brutally. Her brain limits her. Why should we add to the limitation by forcing her to process a fact she literally cannot store? It's like shouting at a deaf man because silence isn't "real" communication.

  **Aunt:** Because the lie isolates her. If she thinks he's at the store, she's waiting for him. She's alone in that wait. If she knows he's dead—which she might, for a minute, truly grasp—she might grieve, but she's grieving a real loss. She's connected to the actual history of her life. The lie puts her in a solipsistic bubble. It's the Experience Machine, just shrunk down to the size of a living room. And the fact that it's unchosen doesn't matter. Being forced into the machine is worse than choosing it.

  **Father:** But we didn't force her into the machine. The Alzheimer's did. We are just adjusting the settings so she doesn't burn out the fuse box. Look, I hear you. I do. You're worried that if we accept the lie, we accept that she's gone. That we're mourning her while she breathes.

  **Aunt:** I'm worried that we are valuing her comfort over her humanity.

  **Father:** And I'm worried you're valuing her humanity over her human experience. Here is the hard part for me, Sarah. I'll admit it. If I follow my view to the end... if feelings are all that matter... then I have to accept that it doesn't matter if she loves *me*. As long as she feels loved. If I can trick her into feeling loved by a stranger, the utility is the same. That scares me. It makes love transactional. It makes me a technician of her mood.

  **Aunt:** (Softens) And if I follow mine to the end... if truth is the absolute... then I have to accept that I might be the cause of her pain. Every time I correct her, I break her heart. I might be prioritizing my own integrity—my ability to say "I told the truth"—over her suffering. I might be using her grief to cleanse my own conscience.

  **Father:** (Silence for a moment) So you see why I do it.

  **Aunt:** I see why it's easier. But Nozick was right about one thing. We want to be in contact with reality. Even if it hurts. Especially if it hurts. That's what it means to be human. To feel the weight of the loss. If we take that weight away, we aren't caring for her. We're caring for a doll that looks like her.

  **Father:** But she's not the woman she was. She's a child in an old body. Do we tell a child the full brutal truth of mortality when they ask where the dog went? Or do we say he's on a farm?

  **Aunt:** She's not a child. She's my mother. And she was a woman who valued honesty above almost anything. If she could speak clearly for one minute, I think she'd tell us to let her grieve.

  **Father:** Maybe. Or maybe she'd tell us to stop making her cry over a ghost. We can't know. That's the real machine, Sarah. Not the lie. The uncertainty. We're both guessing what's best for a person who isn't here anymore.

  **Aunt:** (Closes the book) I know. I just... I can't say the words. "He's at the store." It feels like killing him all over again.

  **Father:** (Puts the mug down) And I can't say "He's dead." Because it feels like killing her. So we sit here. And we argue about Nozick. Because it's easier than watching her look at the door.

  **Aunt:** Yeah.

  **Father:** I'll take the morning shift tomorrow. I'll tell her he's out.

  **Aunt:** (Nods slowly) And I'll take the evening. And I... I'll try to just sit with her. If she asks, I won't correct her. But I won't lie either. I'll just say, "You miss him, don't you?"

  **Father:** That's a third option.

  **Aunt:** Nozick didn't cover everything.

  **Father:** No. He didn't.
