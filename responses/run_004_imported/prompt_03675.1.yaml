answer: |-
  You are absolutely right, and your writing group is looking at the *outcome* of the scenes (she remains unsupported) rather than the *mechanism* of the failure. While the result is the same, the emotional texture and thematic weight of the two interactions are fundamentally different.

  The distinction is between **Invalidation** (the Doctor) and **Isolation** (the Husband).

  *   **The Doctor** represents **Systemic Dismissal**. He has the vocabulary to understand her, but his bias (class, gender, profession) leads him to choose not to use it. He actively closes the door.
  *   **The Husband** represents **Epistemological Isolation**. He has the love to want to understand, but the culture they live in has not given him the map. He is standing outside the door, knocking, but neither of them knows how to open it.

  Here is how you can differentiate these scenes on the page without asserting the difference, using dialogue rhythm, physical blocking, and the protagonist's internal reaction.

  ### 1. The Doctor: Power and Closure
  In this scene, the dynamic is hierarchical. He holds the authority; she is the supplicant. The tragedy here is that she is being *silenced*.

  *   **Dialogue Rhythm:** The doctor should speak in declarative sentences. He interrupts. He finishes her thoughts for her. He uses medical terminology not to explain, but to shut down inquiry.
      *   *Instead of:* "I don't think you understand."
      *   *Try:* "It is a shock to the constitution. Common in your position. The tonic will settle the vapours."
  *   **Physical Blocking:** Create physical distance. He should be behind a desk, writing, or looking at a chart. He should rarely make eye contact when she is describing the horror. He is busy; her trauma is an inconvenience to his schedule.
  *   **The Protagonist's Reaction:** She should feel **anger** and **smallness**. She leaves the room feeling lighter only because she has been stripped of her agency. She knows he *could* help but *won't*.
  *   **Historical Nuance:** In the 1920s, "Shell Shock" was a known concept due to the War. The doctor might even acknowledge the similarity but refuse to apply it to a woman.
      *   *Detail:* He might say, "That is for soldiers, Mrs. Evans. For women, we call it nerves. The treatment is the same: rest and silence."

  ### 2. The Husband: Love and Limit
  In this scene, the dynamic is lateral. They are partners. The tragedy here is that they are *alone together*. He is not dismissing her; he is drowning alongside her.

  *   **Dialogue Rhythm:** The husband should speak in questions or tentative suggestions. He tries to find a practical solution to an emotional problem because that is the only language he has. He stops speaking when he sees her pain.
      *   *Instead of:* "You need to get over it."
      *   *Try:* "If we moved away from the pit... would that help? I could ask the brother-in-law in Merthyr. Would that be better?"
  *   **Physical Blocking:** Create physical closeness that fails to bridge the emotional gap. He should touch her hand, sit beside her, or try to hold her. But she should recoil, or his touch should feel like it burns. The proximity highlights the distance.
  *   **The Protagonist's Reaction:** She should feel **guilt** and **grief**. She isn't angry at him; she is heartbroken *for* him. She realizes her trauma has built a wall that his love cannot climb. She leaves the interaction feeling more lonely than before, because she realizes she is alone even when she is with him.
  *   **The Missing Vocabulary:** Show him grasping for a comparison and failing. Maybe he mentions a cousin who came back from the War shaking, but he doesn't connect the dots fully, or he says, "But that was men, in battle. You were just... helping." He cannot conceptualize her experience as valid trauma.

  ### Comparison on the Page
  Here is a rough example of how the internal narration might differ to signal the distinction to the reader:

  **The Doctor Scene:**
  > He did not look up from his prescription pad. The scratch of the nib was louder than my voice. When I described the smell of the damp earth on the bodies, he dipped his pen in the inkwell, a slow, deliberate stoppage of my words. "Hysteria," he said, blotting the paper. "A surplus of feeling. We must dry it out." He handed me the paper as if it were a ticket to leave his office, which, I realized, it was. He had not heard me. He had merely categorized me.

  **The Husband Scene:**
  > Thomas sat on the edge of the bed, his hands resting on his knees, palms open. He wanted to take my hand, I saw it in the twitch of his fingers, but he was afraid I might break. "Tell me what you need," he said, his voice low, like he was speaking to a spooked horse. "I can fix it. Just tell me." I looked at his good, honest face and felt a terrible coldness settle in my chest. He was offering me tools to mend a thing that had no shape. If I told him there was nothing to fix, only something to bear, I would break his heart. So I took his hand. It was warm, and it was useless.

  ### Why Your Group Might Be Confused
  Your group is likely reacting to the fact that in *both* scenes, the protagonist ends up without help. In plot terms, this is a "All Is Lost" or "No Way Out" beat. However, in character terms, they are doing different work.

  *   **The Doctor scene** establishes the **External Antagonist** (Society/Patriarchy). It tells the reader: *You cannot expect justice or understanding from the authorities.*
  *   **The Husband scene** establishes the **Internal Conflict** (Trauma/Intimacy). It tells the reader: *This wound is so deep it severs connection even with those who love us.*

  ### Recommendation for Revision
  To make the distinction undeniable for your writing group:

  1.  **Give the Doctor a "Solution":** He should offer a sedative or a rest cure. He thinks he *is* helping. This makes his dismissal insidious rather than villainous.
  2.  **Give the Husband a "Question":** He should ask something that shows he is trying to enter her world, but gets the geography wrong. "Was it the dark?" (When it wasn't). "Was it the noise?" (When it was the silence).
  3.  **Check the Aftermath:** In the chapter following the doctor, show her anger or rebellion (throwing the medicine away). In the chapter following the husband, show her withdrawal or protective silence (hiding the nightmares to spare him).

  You are writing about the specific loneliness of trauma before it had a name. The doctor denies the name exists; the husband wishes he had the name. That is a profound difference. Trust your instinct.
