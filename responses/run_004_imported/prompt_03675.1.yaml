          *   *Husband:* Loves her, tries to understand, but lacks the *language/conceptual framework* for trauma. It's a mutual failure of vocabulary and cultural context, not malice or dismissal.
      *   **Goal:** Validate the distinction and provide concrete ways to show this difference on the page without telling.

  2.  **Validate the Distinction:**
