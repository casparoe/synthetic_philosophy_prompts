      *   *Thematic Difference:* One is about societal oppression (medical/patriarchal authority); the other is about the isolation of trauma within intimate relationships (the unshareable nature of suffering).

  3.  **Deconstruct the Scenes (How to show, not tell):**

      *   **The Doctor Scene (Dismissal/Bias):**
          *   *Dynamic:* Authority vs. Supplicant.
          *   *Action:* He interrupts, he looks at his watch, he writes a prescription, he uses medical jargon to silence her.
