          *   *Follow-up:* If she says "Living," ask what the next big puzzle is.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered? Yes (Calculability, Maxims count, Conventional Implicature, Loose Talk). Follow-ups included? Yes.
