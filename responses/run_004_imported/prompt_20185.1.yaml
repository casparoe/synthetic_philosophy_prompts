      *   *Vulnerability:* Calculability is often seen as a constraint on theory, but critics say it's too flexible. Conventional implicatures are famously problematic for a unified pragmatic theory. Loose talk/approximation challenges the "flouting" mechanism.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Calculability/Unfalsifiability Challenge (Priya's Point).*
          *   *Draft:* Priya says calculability is just post-hoc. How do you respond?
          *   *Refinement:* Make it more philosophical. Frame it as a methodological constraint. If any implicature can be calculated after the fact, does it predict anything?
