          *   *Follow-up:* If she says "It handles 'but' and 'therefore'," ask if that's really semantic or pragmatic.

      *   *Question 4: Loose Talk/Approximation ("France is hexagonal").*
          *   *Draft:* People say false things like France is hexagonal. Is that flouting?
          *   *Refinement:* Grice says flouting generates implicature. But with loose talk, we don't seem to calculate "She doesn't mean literally." We just accept it. Does this break the flouting model?
          *   *Follow-up:* If she says "It's still an implicature," ask about the cognitive load.

      *   *Question 5: Neo-Gricean Reduction (Horn/Levinson).*
          *   *Draft:* What about Horn's Q and R principles?
          *   *Refinement:* Neo-Griceans try to reduce the maxims to heuristics. What do we lose if we accept their reduction?
          *   *Follow-up:* If she says "We lose nuance," ask for a specific example where Horn fails and Grice succeeds.

      *   *Question 6: The Status of the Cooperative Principle (CP).*
          *   *Draft:* Is the CP a rule or a description?
          *   *Refinement:* Is it a normative assumption or a psychological fact? If someone is uncooperative, does pragmatics stop?
          *   *Follow-up:* If she says "It's normative," ask about adversarial contexts (courtrooms, debates).

      *   *Question 7: Cancellability.*
          *   *Draft:* How does cancellability work?
          *   *Refinement:* Cancellability is a test for implicature. But some implicatures are hard to cancel. Does this threaten the distinction between what is said and what is implicated?
          *   *Follow-up:* If she says "Context matters," ask about default implicatures.

      *   *Question 8: Indeterminacy.*
          *   *Draft:* Implicatures are vague. Is that a bug or feature?
          *   *Refinement:* Grice emphasizes the indeterminacy of implicature. But for a theory of communication, isn't precision better?
          *   *Follow-up:* If she says "Communication is messy," ask how we understand each other so well then.

      *   *Question 9: Cognitive Reality.*
          *   *Draft:* Do people actually think this way?
          *   *Refinement:* Psycholinguistics often suggests fast, automatic processing. Gricean calculation seems slow. How to reconcile?
          *   *Follow-up:* If she says "Competence vs. Performance," ask if the theory is then untestable.

      *   *Question 10: Future of Griceanism.*
          *   *Draft:* Where is the field going?
