answer: |-
  Here are nine interview questions designed to bypass the standard syllogism and press on the philosophical tensions in your guest's revival of the Basic Argument. Each includes a targeted follow-up for the most common defensive maneuvers.

  ### 1. The "Ultimate" Distinction
  "You draw a hard line between 'ultimate' responsibility—the cosmic, desert-entailing kind—and the 'practical' responsibility we use in courtrooms and friendships. Compatibilists often argue this distinction is a philosophical fetish; if the practical kind keeps society running and validates our relationships, why does the 'ultimate' kind matter? Is insisting on it doing real philosophical work, or is it just a relabeled retreat where you define responsibility in a way that ensures it can never exist?"

  *   **Follow-up:** If she says the distinction matters for *truth*, ask: "If the 'false' practical version is psychologically inescapable and socially necessary, in what sense does the 'true' ultimate version actually govern our lives? Is it a truth that makes no difference?"

  ### 2. The Indeterminism Trap
  "Let's talk about the escape hatch. Many libertarians try to rescue responsibility by introducing indeterminism—say, quantum noise in the neural pathways. But you argue this doesn't help. If my actions aren't determined by my character, they're essentially random. How is being a victim of random noise any better for *desert* than being a victim of prior causes? Doesn't indeterminism just swap 'you're shaped by factors outside your control' for 'you're shaped by nothing at all,' which seems like a worse problem for grounding responsibility, not a solution?"

  *   **Follow-up:** If she suggests indeterminism allows for "agent-causation," ask: "But if that agent-causation isn't determined by who you are, where does it come from? If it comes from nowhere, isn't it just magic? And if it comes from who you are, aren't we back in the regress?"

  ### 3. The Strawson Family Feud
  "There's an almost dramatic irony here: Galen Strawson's Basic Argument seems to directly target the legacy of his father, P.F. Strawson. P.F. argued in *Freedom and Resentment* that responsibility is grounded in our natural, unavoidable reactive attitudes like gratitude and resentment, not metaphysical facts. Does the Basic Argument actually refute that naturalistic move, or does it just insist that P.F. Strawson was never answering the real question in the first place? Are you two talking past each other, or is one of you wrong about what 'responsibility' means?"

  *   **Follow-up:** If she says P.F. Strawson "changed the subject," ask: "But if the subject he changed it *to* is the only one human beings can actually live within, does his 'mistake' actually matter more than Galen's 'correction'?"

  ### 4. The Phenomenological Tension
  "By Galen Strawson's own admission, even if you accept the Basic Argument as sound, you apparently can't help *feeling* responsible for your actions day-to-day. The belief doesn't cure the feeling. Is that true for you? And if so, what is that tension supposed to tell us? If the argument is logically airtight but psychologically inert, does that suggest the argument lacks normative force, or just that human beings are naturally prone to illusion?"

  *   **Follow-up:** If she says we should strive to live by the truth despite the feeling, ask: "But isn't that striving itself determined by your character? So you can't even take credit for successfully living by the argument, can you?"

  ### 5. The Regress and "Enough"
  "The core engine of the Basic Argument is the infinite regress: to be responsible for X, you must be responsible for the cause of X, and so on. But why must the chain go back infinitely? Why can't responsibility ground itself at a 'sufficient' point—say, when I reflectively endorse my desires? Why is the demand for *ultimate* origin necessary for responsibility, rather than just *adequate* ownership?"

  *   **Follow-up:** If she says reflective endorsement is just another mental event caused by prior states, ask: "But at some point, doesn't the 'self' just *be* the collection of those states? Why do we need a 'self' behind the states to hold the bag?"

  ### 6. Justice Without Desert
  "If we take this view seriously, it seems to dismantle retributive justice. We can't punish someone because they *deserve* it, only to protect others or rehabilitate. But doesn't this risk treating criminals merely as broken machines to be fixed or dangerous animals to be caged, rather than moral agents? Is there a way to preserve human dignity in your framework without smuggling in the very desert you're trying to eliminate?"

  *   **Follow-up:** If she says dignity doesn't require desert, ask: "Then what grounds human rights? If I'm not responsible for my actions, why do I have a right to autonomy that the state can't override for the greater good?"

  ### 7. The Narrative Self
  "Some critics argue the Basic Argument relies on a static view of the self—that 'you' are a fixed thing that needs to be caused. But what if the self is a process or a narrative that constructs itself over time? If 'you' are the ongoing activity of shaping your character, doesn't that dissolve the regress? Or is that just another way of saying the shaping is still determined by the shaper's prior shape?"

  *   **Follow-up:** If she argues the narrative is still determined, ask: "Doesn't that imply that *understanding* the argument changes the narrative? So isn't the philosophy itself a new cause in the chain that alters future responsibility?"

  ### 8. The Contribution of the New Book
  "You've revived this argument in your new book, but Galen's papers have been around for decades. What's the new move here? Are you hardening the premises against recent compatibilist objections, or are you pushing the implications further into ethics and psychology? Where do you think the contemporary debate has been misunderstanding the Basic Argument?"

  *   **Follow-up:** If she mentions a specific new objection she addresses, ask: "Do you think that objection was ever strong, or has compatibilism just been running out of road for thirty years?"

  ### 9. Regret and Relief
  "Finally, a personal one. People often find the denial of moral responsibility terrifying—it seems to erase the significance of their choices. But others find it liberating—it removes the burden of cosmic guilt. Which reaction do you think is more rational? When you look at your own past mistakes, does the Basic Argument offer you relief, or does it leave you with a sense of loss?"

  *   **Follow-up:** If she says "relief," ask: "Is that relief just a psychological trick, or is it a rational response to realizing the universe isn't judging you?" (If she says "loss," ask: "What exactly is lost if the judgment was never metaphysically real to begin with?")
