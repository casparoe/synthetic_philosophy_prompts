      *   *The "Ultimate" Distinction:* Compatibilists say we don't *need* ultimate responsibility, just the ability to act on desires without coercion. Incompatibilists say this is shallow.
      *   *Indeterminism:* If actions aren't determined, they are random. Randomness doesn't equal control.
      *   *P.F. Strawson:* "Freedom and Resentment" argues responsibility is grounded in our social practices (reactive attitudes like resentment/gratitude), not metaphysical facts. Galen argues this sidesteps the *truth* of responsibility.
