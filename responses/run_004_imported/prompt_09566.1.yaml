answer: |-
  **Setting:** *A quiet corner of a 24-hour diner, 1:00 AM. Two empty plates and a pot of coffee sit between them. **Elena** (a moral philosopher with a soft spot for non-consequentialist intuitions) and **Marcus** (a policy ethicist who focuses on rational choice and contractualism) are winding down a long debate.*

  **Marcus:** So, are we any closer to resolving the medicine case, or are we just going to stare at these dregs until the sun comes up?

  **Elena:** I think we're clearer on why we disagree. That's progress. But look, Jonas was right about one thing: your intuition is the standard one. Five lives over one. It's the default setting for almost everyone.

  **Marcus:** Because it's correct. If you have the power to prevent five deaths or one death, and the cost to you is the same, choosing the one feels like a moral error. It's not just arithmetic; it's about minimizing the tragedy.

  **Elena:** But that's exactly where Taurek puts the knife in. "Minimizing tragedy" implies there's a single entity—the Universe, or Society—that experiences the tragedy. But death isn't experienced by the Universe. It's experienced by *Jonas*, or *Sarah*, or *David*. For Jonas, losing his life is 100% of his loss. It doesn't become 20% of a loss just because Sarah is also dying. There is no "super-person" who suffers five times as much.

  **Marcus:** I know the "separateness of persons" argument. It's powerful rhetoric. But it leads to paralysis. If I can't aggregate losses, then I have no reason to save the five. In fact, Taurek suggests I should flip a coin. Give the single person a 50% chance, and the group of five a 50% chance.

  **Elena:** Exactly. Because that gives each *individual* an equal chance of being saved. If I save the five automatically, I'm treating the one person as if their claim doesn't matter. I'm using them as a means to maximize the output. Flipping a coin says, "Your life matters just as much as any one of theirs."

  **Marcus:** But it doesn't treat the *five* as individuals! That's the flaw in the coin flip. By giving the group of five only a 50% chance, you're effectively telling each of those five people, "Your claim to life is worth only one-tenth of the single person's claim."

  **Elena:** How do you get that?

  **Marcus:** Simple math. If you flip a coin, the single person has a 1/2 chance of survival. Each of the five also has a 1/2 chance of survival *collectively*, which means individually they each have a 1/10 chance. You've privileged the one person's odds over the five individuals' odds. You've violated equality to achieve "fairness."

  **Elena:** That's the standard aggregationist counter. But it assumes the goal is to distribute *probability* equally. Taurek says the goal is to respect *claims* equally. The one person has a claim: "Save me." The five have claims: "Save me," "Save me," etc. But those claims don't merge. You can't add them up to outweigh the one. You have to choose whose claim to honor. Since you can't honor all, you give them equal weight via the coin.

  **Marcus:** Okay, let's pivot. This is where Jonas was groping, and where Scanlon really tightens the screw. Forget the "view from nowhere." Let's look at it from the *ex ante* perspective. Imagine you didn't know who you were. You could be the one, or you could be one of the five. Behind that veil of ignorance, would you agree to a coin flip?

  **Elena:** I'm skeptical of the veil. It's a hypothetical device.

  **Marcus:** It's not just a device; it's a test of reasonable rejection. If we adopt a policy of "flip a coin," the five people who die can say to us: "You could have saved us all at no extra cost, but you chose a policy that gave us a lower chance of survival to boost the odds of someone else." They have a reasonable complaint. But if we adopt "save the greater number," does the single person have a reasonable complaint? They can say, "I died." But they can't say, "You treated me unfairly." Because the principle is: *When claims conflict, honor the set of claims that saves the most lives.* That principle applies to everyone equally.

  **Elena:** But that principle *is* the contention! The single person's complaint is: "You decided my death was less important than theirs." Just because you frame it as a general rule doesn't change the fact that, in this instance, my life was traded for theirs. Scanlon assumes that because the rule is general, the loss is justified. But for the person dying, the generality doesn't help. They are still the one being sacrificed.

  **Marcus:** They aren't being *sacrificed*. That's the language of utilitarianism. In contractualism, we aren't sacrificing them; we are acknowledging that their claim, while weighty, is outweighed by the combined weight of the others' claims. Parfit put it best: If you deny that numbers count, you end up with "Innumerate Ethics." Imagine it's not five vs. one. Imagine it's five million vs. one. Are you really telling me a coin flip is still the moral requirement?

  **Elena:** *Pauses, stirs coffee.* The million case is the hard one. I'll admit that. Taurek struggles there. But let's not jump to the extreme. In the five vs. one case, the difference feels small enough that the demand for equal respect—the coin flip—holds. But even with the million... here's my pushback. If numbers don't count, then saving the million isn't *morally required*, but it might be *permissible*. Taurek leaves room for you to save the million. He just denies you are *obligated* to ignore the one.

  **Marcus:** That's a retreat. You started by saying the coin flip is the way to treat everyone with equal respect. Now you're saying saving the million is okay?

  **Elena:** I'm saying there's a distinction between what is *required* and what is *allowed*. If I save the million, I'm acting on a personal preference for more lives. But if I *force* a policy that says the one *must* die, I'm asserting that their moral standing is lesser. I want to preserve the idea that the one person's death is a tragedy of the same magnitude *for them* as any of the million.

  **Marcus:** But morality isn't just about the magnitude of loss for the sufferer. It's about the agent's responsibility. I am the one with the medicine. I am responsible for the outcome. If I flip a coin and it lands on the one, five people die. I caused five deaths. If I save the five, one person dies. I caused one death. I am responsible for the state of the world I bring about. To ignore the numbers is to abdicate responsibility for the total amount of suffering I could have prevented.

  **Elena:** That's consequentialism creeping back in. "I am responsible for the outcome." But I'm responsible for my *actions* and my *intentions*. My intention in flipping a coin is to show equal respect. My intention in saving the five automatically is to maximize utility. If morality is about how we treat individuals, the coin is cleaner. If morality is about the state of the world, you win. But why should the state of the world trump the individual's right not to be outvoted on their own life?

  **Marcus:** Because they aren't being "outvoted." That's the metaphor that's misleading you. Think about the *ex ante* argument again, but harder. If you tell the one person, "We flipped a coin and you lost," they might accept that as bad luck. But if you tell the five, "We flipped a coin and you lost," they will say, "Why did you give our lives the same weight as his, when there are five of us? You valued his life five times more than ours individually."
  The contractualist point is this: The single person cannot reasonably reject a principle that saves the greater number. What grounds do they have? "I wanted a higher chance of survival"? Well, so did the five. The five have a stronger grounds for rejection if you *don't* save them.

  **Elena:** I see the force of that. The "strength of the grounds for rejection." But here is where I dig in. The single person's ground for rejection is: "This principle allows me to be killed when I could have been saved, solely because others were also in danger." That is a massive burden. The five's burden is the same *for each of them*. The fact that there are more of them doesn't make the burden *heavier* for any specific one of them.
  Scanlon tries to aggregate the *reasons* for rejection. He says five strong reasons outweigh one strong reason. But Taurek asks: Who is doing the weighing? If the reasons belong to different people, how do they stack? It's like saying five people's headaches outweigh one person's broken leg. Unless there's a container for the pain, they don't combine.

  **Marcus:** The "container" is the moral agent's deliberation! I am the container. I have to weigh the reasons presented to me. I have five people saying "Save me" and one saying "Save me." If I listen to the one, I am ignoring five distinct voices. If I listen to the five, I am ignoring one. To ignore five distinct voices is to fail to respond to the moral reality of the situation more than ignoring one.
  Look, Elena, let's bring it back to the medicine. You're the doctor. You walk in. You see the five. You see the one. You have the dose. If you pull out a coin, and the one wins, and the five die... can you look their families in the eye and say, "I treated your loved ones with equal respect"?

  **Elena:** *Sighs.* I can say, "I refused to treat your loved ones' lives as a mathematical sum that cancelled out this person's existence." It's a harder sell. I know it is. But if I save the five, I have to look at the one and say, "Your claim was outweighed." And if claims can't be added, that statement is false.

  **Marcus:** But if claims *can't* be added, morality collapses into a series of bilateral stand-offs. It makes collective action impossible. We live in a world of scarce resources. Triage *requires* numbers. If we accept Taurek, we undermine the very logic of public health, disaster relief, insurance.

  **Elena:** Maybe Taurek isn't a policy for institutions. Maybe it's a constraint on individual moral reasoning. Maybe the state *should* save the five—because the state acts for the aggregate. But *I*, as a moral agent, might feel a pull toward the coin.
  But... okay. I'll concede this. In the five vs. one case, the coin feels defensible. In the million vs. one case, the coin feels like madness. If my theory implies madness at the limit, the theory is flawed.

  **Marcus:** Exactly. And that's why the *ex ante* contractualism holds. It explains *why* the million matters without resorting to a "blob of badness." It's about what principles we could live with. No one could live with a principle that says, "If you are in the minority, your life gets no extra weight against the majority." Wait, that's not right.
  The principle is: "Save the greater number." If I am the one, I lose. But I gain the security of knowing that if I were ever in a group of five, I'd be saved. It's a mutual insurance pact. The coin flip offers no such security.

  **Elena:** A mutual insurance pact... I like that. That frames it as rational self-interest rather than abstract moral math. But does rational self-interest determine moral truth? Just because I *would* agree to it behind a veil doesn't mean it's fair to the actual person standing in front of me right now who is about to die.
  But... if I accept that morality is about finding rules we can justify to each other, then the five have a justification the one doesn't. "We saved more people." The one has no counter-justification other than "It should have been me," which isn't a principle.

  **Marcus:** So, are you conceding?

  **Elena:** I'm conceding that Jonas—and Scanlon—have the better argument for *public* morality and institutional decision-making. The *ex ante* reasoning bridges the gap between individuals and groups without needing a "social entity." It shows that saving the five is the only rule that respects everyone's desire to survive *ex ante*.
  But I'm not conceding that Taurek is *wrong*. He's right that something is lost. When we save the five, we do silence the one. We do treat their death as "less bad" in the grand scheme. That tragic residue remains. The coin flip honors that residue. Saving the five honors the outcome.

  **Marcus:** I can live with that. We save the five, but we mourn the one with the understanding that their claim was equal, just outnumbered. We don't say they mattered less. We say the situation forced a choice where numbers were the only tiebreaker that didn't arbitrarily privilege one individual over five.

  **Elena:** So the coin isn't the answer, but the *impulse* behind the coin—the refusal to simply sum human lives—is the correct moral caution.

  **Marcus:** Agreed. Arithmetic is the tool, not the master. But in the medicine case... I'm saving the five, Elena.

  **Elena:** *Smiles.* I know. I'd probably hand you the syringe. But I'd make you write a report on why.

  **Marcus:** Deal. More coffee?

  **Elena:** Please. Black.
