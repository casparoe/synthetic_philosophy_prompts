answer: |-
  Two moral philosophers, Elena and Marcus, are roommates. Elena catches Marcus lying to their landlord about a broken window.

  **Elena:** "Marcus, that was morally blameworthy."

  **Marcus:** "Oh, please. You lied to the landlord last month about the cat."

  **Elena:** "True. That forfeits my standing to blame you."

  **Marcus:** (Relieved) "So the accusation is void?"

  **Elena:** "No. The *standing* is void. The *blameworthiness* remains."

  **Marcus:** "What's the difference?"

  **Elena:** "It means I can't rightfully demand you apologize. But you still ought to."

  **Marcus:** "To who? You just said you have no authority!"

  **Elena:** "To morality. I'm not your judge anymore, Marcus. I'm your co-defendant."

  **Marcus:** "And?"

  **Elena:** "And the verdict is still 'Guilty.' I'm just not allowed to sentence you. So now you have to sit in the dock with me, knowing you're wrong, and I can't even tell you to shut up about it."

  **Marcus:** "That is somehow much worse."

  **Elena:** "No, it's philosophically precise. I'm not blaming you. I'm just a fellow sinner bearing witness to your sin."
