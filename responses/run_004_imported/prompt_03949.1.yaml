      *Self-Correction on the 1 vs 2 unit argument:* In standard set theory, the cardinality is the same. But in *ethics*, we usually care about the *mapping*. If $f(x) = 2$ and $g(x) = 1$ for all $x$, $f$ is strictly greater than $g$. This is the **Pareto** argument. It's the strongest technical rebuttal.

