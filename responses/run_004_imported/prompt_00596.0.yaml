      *   *Refinement on SB:* Focus on the "Thirder" argument being similar to the "Driver thinks he's likely at Exit 2" intuition.
      *   *The "Why they differ" point:* This is the most important part for a seminar. In AMD, if you think "I'm probably at Exit 2," you might exit. But if everyone exits, you never get to Exit 2. This feedback loop is unique to AMD. In SB, believing "I'm probably in a Tails awakening" doesn't change the coin toss.

