answer: |-
  This is a great question. Your professor is right—they are "cousins"—but the family resemblance can be tricky because they stress different muscles in decision theory. Both problems break standard Bayesian updating because the agent loses track of *where* they are in time, but they diverge sharply on **agency** and **causality**.

  Here is the breakdown you need for section, structured by overlap, divergence, and the specific theoretical headache each one creates.

  ---

  ### 1. The Core Overlap: Self-Locating Uncertainty
  The reason they are cousins is that both problems force you to assign probabilities to **indexical beliefs** (beliefs about "where" or "when" you are) rather than just state-of-the-world beliefs.

  *   **Sleeping Beauty (SB):** Upon waking, Beauty knows the setup but doesn't know *which* awakening this is. Is it Monday (Heads or Tails) or Tuesday (Tails)?
  *   **Absent-Minded Driver (AMD):** At an exit, the Driver knows the map but doesn't know *which* exit this is. Is it the 1st or the 2nd?

  **The Shared Intuition (The "Thirder" / "Exit 2" intuition):**
  In both cases, there is an argument that relies on **frequency**:
  *   **SB:** In the long run, 2/3 of all awakenings happen in the Tails world. So, upon waking, my credence in Tails should be 2/3.
  *   **AMD:** If I plan to continue with high probability, most of the exits I encounter will be the second one. So, when I am at an exit, I should believe I am likely at Exit 2.

  In both problems, standard conditionalization fails because you cannot condition on "I am awake" or "I am at an exit," since that information is true in all possible scenarios you are considering. You have to condition on *self-locating* information.

  ---

  ### 2. The Crucial Divergence: Endogeneity of Probability
  This is the most important distinction for a decision theory seminar.

  **In Sleeping Beauty, probabilities are Exogenous.**
  The coin toss happens *before* Beauty goes to sleep. Her credence upon waking does not change the physical reality of how many times she wakes up. Whether she believes she is in a Tails awakening or not, the coin has already landed. The "frequency" of awakenings is fixed by nature (the coin), not by her choice.

  **In Absent-Minded Driver, probabilities are Endogenous.**
  The Driver's **choice** determines the probability of reaching the second node.
  *   If the Driver decides "I will always exit" ($p=1$), he reaches Exit 1 with probability 1 and Exit 2 with probability 0.
  *   If the Driver decides "I will always continue" ($p=0$), he reaches Exit 1 with probability 1 and Exit 2 with probability 1 (he passes it).

  **The Feedback Loop:**
  In AMD, your belief about "which exit am I at?" depends on your strategy, but your strategy depends on your belief about "which exit am I at?"
  *   If you think "I'm probably at Exit 2," you should Exit (to get the 4 payoff).
  *   But if you Exit, you never reach Exit 2, so you couldn't have been at Exit 2.
  *   This creates a **time-inconsistency** problem that SB does not have.

  ---

  ### 3. Decision Theoretic Implications

  Here is how the problems force you to deal with different theoretical machinery:

  #### Sleeping Beauty: The Credence Problem
  SB is primarily framed as an epistemological problem about **Credence** (belief), though it is often solved using betting arguments.
  *   **The Conflict:** Halfer (1/2) vs. Thirder (1/3).
  *   **The Decision Theory Link:** If you are a Thirder, you act as if Tails is twice as likely. If you are a Halfer, you act as if they are equal.
  *   **What it tests:** How do we update beliefs when the *number of observers* (or observer moments) varies across hypotheses? It challenges the principle of **Conditionalization**.

  #### Absent-Minded Driver: The Planning Problem
  AMD is primarily framed as a **Dynamic Choice** problem.
  *   **The Conflict:** Ex-ante optimal plan vs. In-media-res optimal action.
      *   *Ex-ante (at the start):* You want to commit to a mixed strategy (e.g., continue with $p=2/3$, exit with $p=1/3$) to maximize expected payoff.
      *   *In-media-res (at the exit):* If you treat the probability of being at Exit 2 as high (because you planned to continue), you might want to deviate from the plan and Exit immediately.
  *   **What it tests:** It challenges **Causal Decision Theory (CDT)** vs. **Evidential Decision Theory (EDT)**.
      *   A CDT agent might say: "My choice now doesn't causally affect where I am."
      *   An EDT agent (or a "Planning" agent) realizes: "My choice now is correlated with my past self's choice, which determined if I got here."
  *   **Piccione & Rubinstein (1997):** The seminal paper on AMD argues that you must evaluate the strategy from the *ex-ante* perspective, ignoring the temptation to re-optimize at the node.

  ---

  ### 4. Summary for Section (Cheat Sheet)

  | Feature | Sleeping Beauty | Absent-Minded Driver |
  | :--- | :--- | :--- |
  | **Uncertainty** | "What day is it?" (Mon/Tue) | "Which exit is this?" (1st/2nd) |
  | **Source of Uncertainty** | Chance move (Coin Toss) | Chance move + **Memory Loss** |
  | **Agency** | Passive observer (usually) | Active decision maker |
  | **Probabilities** | **Exogenous** (Fixed by coin) | **Endogenous** (Fixed by strategy) |
  | **Core Tension** | Credence (Halfer vs. Thirder) | Time Consistency (Plan vs. Action) |
  | **Key Lesson** | How to count observer-moments. | How to commit when you can't distinguish states. |

  ### 5. One "Gotcha" to Watch Out For
  If your section discusses **Betting Sleeping Beauty**, the problems become almost identical.
  *   If Beauty is offered a bet every time she wakes up, her decision affects her total payoff *across the timeline* (just like the Driver).
  *   In that specific betting version, SB becomes a problem of **policy selection** just like AMD.
  *   However, in the standard philosophical framing, SB is about *belief* (What is P(Heads)?), whereas AMD is about *action* (What is $p$(Exit)?).

  ### The "Elevator Pitch" for your Professor
  If you want to sound like you really get it, say this:
  > "They both rely on self-locating uncertainty and indistinguishable states. But AMD is strictly harder because the probabilities of being at a node are **endogenous** to the decision policy. In SB, the frequency of awakenings is fixed by the coin; in AMD, the frequency of reaching Exit 2 is fixed by the Driver's own $p$. That's why AMD forces us to talk about time-consistency and planning, whereas SB is mostly about credence and conditioning."

  Good luck in section!
