  2.  **Recall/Refresh the Problems:**

      *   **Absent-Minded Driver (AMD):**
          *   *Setup:* Driver wants to exit at the 2nd exit (payoff 4). 1st exit is wrong (payoff 0). Continuing past both is wrong (payoff 1).
          *   *Constraint:* Driver is absent-minded. At any exit, he can't tell if it's the 1st or 2nd. He has the same information state at both.
          *   *Decision:* Choose a probability $p$ of exiting at *any* exit he encounters.
          *   *Key Tension:* Planning stage (ex-ante) vs. Action stage (in-media-res). Time inconsistency? Self-locating belief?

      *   **Sleeping Beauty (SB):**
          *   *Setup:* Coin toss (Heads/Tails). If Heads, wake once (Mon). If Tails, wake twice (Mon, Tue). Memory wipe between wakings.
          *   *Question:* Upon waking, what is your credence that the coin landed Heads?
          *   *Key Tension:* Halfer (1/2) vs. Thirder (1/3). Self-locating belief. Conditioning on "I am awake now."

  3.  **Identify the Core Overlap (The "Cousin" Relationship):**
      *   **Self-Locating Uncertainty:** Both involve an agent who doesn't know *where* or *when* they are in a sequence of events.
          *   AMD: "Is this Exit 1 or Exit 2?"
          *   SB: "Is this Monday or Tuesday?"
      *   **Indistinguishable States:** The agent's internal state is identical at different points in the timeline.
      *   **Probability vs. Decision:** Both blur the line between credence (belief) and action (decision theory). SB is often framed as a credence problem, but betting arguments make it a decision problem. AMD is explicitly a decision problem but relies on probabilities of being at a node.
      *   **The "Frequency" Argument:** In SB, Tails leads to more awakenings. In AMD, a strategy of "always continue" leads to reaching the second exit, while "always exit" stops at the first. The probability of being at a node depends on the strategy chosen (endogeneity of probabilities).

  4.  **Identify the Key Differences (The Divergence):**
      *   **Agency/Control:**
          *   AMD: The agent's *choice* affects the probability of reaching the second node. If I decide to exit with $p=1$, I never reach Exit 2. If $p=0$, I always reach Exit 2. The probability of being at Exit 2 is *endogenous* to the decision.
          *   SB: The coin toss is external. The number of awakenings is fixed by the coin outcome, not by Beauty's choice upon waking. Her choice doesn't change how many times she wakes up (usually).
      *   **Ex-Ante vs. Ex-Post Consistency:**
          *   AMD: Highlights **time inconsistency**. The optimal plan made at the start ($p=0$ to get to exit 2, then exit) cannot be executed because the driver can't distinguish. The optimal *policy* ($p=1/3$ roughly) differs from what seems optimal at the node if you assume you are likely at Exit 2.
          *   SB: Highlights **credence updating**. It's more about what you believe than what you do (though betting cases exist). It's less about changing a plan mid-stream and more about assigning a probability to the current state.
      *   **Causal Structure:**
          *   AMD: Decision nodes are sequential. Action at Node 1 determines existence of Node 2.
          *   SB: Awakening events are consequences of a chance move (coin), not a decision move.

  5.  **Structure the Comparison:**
      *   **Introduction:** Acknowledge the professor's point (they are both about self-locating uncertainty in decision theory).
      *   **The Core Similarity (The "Cousin" Bit):**
          *   Indistinguishable states.
