          *   The reference class problem (am I a random exit/awakening?).
      *   **The Crucial Difference (Agency & Endogeneity):**
          *   AMD: Choices change the probability of being at a node (Endogenous probabilities).
          *   SB: Choices don't change the frequency of awakenings (Exogenous probabilities).
      *   **Decision Theoretic Implications:**
          *   AMD: Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) vs. Planning. The "Piccione & Rubinstein" solution.
