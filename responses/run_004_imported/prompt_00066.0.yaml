          *   *Premise-Based (PBP):* Good for truth-tracking/consistency. Focuses on reasons. Risk: Paternalistic, might override individual verdicts on the outcome.
          *   *Context:* Courts usually need PBP (precedent matters). Legislatures often use CBP (compromise matters). Nonprofits? Depends on mission vs. membership will.

      *   **Escaping the Dilemma (Relaxing Conditions):**
