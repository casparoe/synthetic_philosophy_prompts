answer: |-
  Here are nine interview questions designed to press the weak points of the Traditionalist/Walzerian position, specifically tailored for an audience already sympathetic to McMahan's revisionism. Each includes a follow-up keyed to the standard defenses she is likely to offer.

  ### 1. The Self-Defense Analogy
  "McMahan's central intuition pump is the street fight: if someone tries to kill you unjustly, they become liable to defensive harm, and you do not. War, he argues, is just many such interactions happening simultaneously. If I'm a soldier fighting a just war of defense, and you're a soldier invading my country, why doesn't the ordinary morality of self-defense apply? Why does putting on a uniform suspend the basic rule that aggressors are liable and defenders are not?"

  *   **Likely Answer:** She will argue that war is a *collective* enterprise, not an aggregate of individual fights, and that soldiers are instruments of the state rather than private individuals.
  *   **Follow-up:** "If they are merely instruments of the state, doesn't that strip them of moral agency entirely? You seem to be saying they can't be liable for killing because they aren't really the ones doing the killing. But if they aren't agents, how can they be held responsible for *in bello* violations? You can't have it both ways: they're either moral agents subject to liability, or they're tools who can't be blamed for anything."

  ### 2. Deep Morality vs. Humanitarian Convention
  "There's a tension in the Walzerian view between what is *truly* morally right and what is *useful* to believe. Is your defense of the Moral Equality of Combatants a claim about the deep morality of killing—meaning an unjust combatant really *does* have the same moral rights as a just one—or is it a pragmatic claim that treating them as equals minimizes total suffering? Because if it's the latter, aren't you secretly conceding McMahan's point about deep morality and just arguing for a 'noble lie'?"

  *   **Likely Answer:** She will likely lean into the "Legalist Paradigm," arguing that we need conventional rules to regulate war and that deep morality is too epistemically demanding for the fog of war.
  *   **Follow-up:** "If it's a convention based on harm reduction, what happens when the convention fails? If we have a specific case where we *know* the other side is unjust—like fighting against a genocidal regime—why should we cling to the convention? At what point does the 'noble lie' become complicity?"

  ### 3. The Conscript vs. The Skeptical Volunteer
  "Let's look at the epistemic conditions of the soldiers. I can see why you might grant equality to a conscript who has been lied to by state propaganda. But what about the volunteer who privately suspects their cause is unjust but signs up anyway for pay or patriotism? Does your view treat the volunteer's moral status the same as the conscript's? If so, doesn't that equate a coerced participant with something closer to a hired hitman?"

  *   **Likely Answer:** She will likely argue that we cannot adjudicate individual internal states during war and that both are bound by the same *in bello* restrictions, so they must have the same *in bello* rights.
  *   **Follow-up:** "But criminal law adjudicates internal states—intent and knowledge—all the time. If a volunteer fights while believing the war is unjust, they seem to lack the 'excuse' of ignorance. If they lack the excuse, why aren't they liable? Are you saying the uniform acts as a moral shield that private conscience cannot pierce?"

  ### 4. The Reality of the "Combatant" Category
  "Revisionists argue that 'combatant' isn't a morally real category; what matters is 'threat contribution.' A civilian pushing a button on a drone contributes more to a threat than a rifleman sleeping in a trench. If liability tracks threat, why should status matter? Isn't 'Equality of Combatants' just a heuristic that obscures the actual moral landscape of who is dangerous and who isn't?"

  *   **Likely Answer:** She will argue that "threat contribution" is too slippery for regulation and that we need bright lines to protect civilians and maintain order.
  *   **Follow-up:** "But technology is eroding those bright lines anyway. With cyber warfare and remote drone piloting, the 'combatant' in the trench is disappearing. If your theory relies on a clear distinction between combatant and non-combatant, isn't your defense of the Moral Equality of Combatants becoming obsolete as the nature of threat contribution changes?"

  ### 5. The Correlativity Problem
  "This is the flip side of the liability question. If unjust combatants are *not* liable to be killed because they are moral equals, then by what right do just combatants kill them? In ordinary morality, I can only kill you if you are liable or if there's a supreme emergency. If you deny that unjust combatants are liable, you seem to imply that just combatants are committing murder every time they shoot back, even in self-defense. How do you solve this correlativity?"

  *   **Likely Answer:** She will likely invoke the "right to kill" as a function of the war status itself, or argue that the unjust combatant poses a threat that permits killing regardless of liability (the "innocent threat" argument).
  *   **Follow-up:** "If it's just because they pose a threat, then we're back to liability based on threat, not status. But if you say it's a 'right' granted by the state, aren't you saying the state has the authority to license murder? That seems like a much heavier bullet to bite than McMahan's liability account."

  ### 6. The "Nazi Test" (Epistemic Limits)
  "Walzer famously argued that even German soldiers on the Eastern Front were the moral equals of their Soviet opponents, provided they followed the rules of war. Many students find this counterintuitive. Is there *any* case where the *ad bellum* injustice is so transparent that the combatants on that side lose their equality? Or is the Moral Equality of Combatants truly absolute, regardless of the cause?"

  *   **Likely Answer:** She will likely hold the line that *in bello* compliance is the only metric available to soldiers in the moment, and that judging *ad bellum* retroactively doesn't change their status during the fight.
  *   **Follow-up:** "So if a soldier is driving a tank into a concentration camp, you're saying their moral status as a target is identical to a soldier defending their homeland from invasion? It sounds like you're prioritizing the symmetry of the rules over the moral reality of the act. Is symmetry really that valuable?"

  ### 7. In Bello Incentives
  "One argument for your view is that if we tell the unjust side they are 'murderers,' they will fight dirtier and ignore *in bello* rules. But couldn't the opposite be true? If you tell an unjust combatant, 'You are a moral equal, you have a right to be here,' doesn't that reduce the moral pressure on them to minimize harm? Does granting moral equality actually make *in bello* violations *more* likely by absolving them of the guilt of participation?"

  *   **Likely Answer:** She will argue that shame and guilt are unreliable motivators in war, whereas clear reciprocal rules (I won't kill your POWs if you don't kill mine) are effective.
  *   **Follow-up:** "But reciprocity relies on the enemy valuing their own soldiers' lives. In asymmetrical conflicts or against ideologically driven enemies, that reciprocity often breaks down. If the strategic incentive vanishes, what's left of your argument other than a hope that they'll follow the rules because you told them they're 'good guys'?"

  ### 8. The Civilian Liability Flip-Side
  "Revisionists like McMahan often argue that if liability is based on contribution, some civilians *are* liable. You defend the traditional view that civilians are immune. But if you ground that immunity in their status rather than their lack of threat, aren't you protecting civilians for the wrong reason? If a civilian is directing a drone strike, why does their 'civilian' status protect them if their 'contribution' makes them liable?"

  *   **Likely Answer:** She will argue that blurring the line endangers all civilians and that we must accept some risk of letting liable civilians go to ensure the innocent are safe.
  *   **Follow-up:** "That's a consequentialist argument, not a deontological one. It admits that the civilian *is* morally liable but we shouldn't target them for policy reasons. So, again, aren't you conceding the deep morality to the revisionists and just arguing for a firewall? Is there any sense in which the drone-operating civilian is *innocent*, or just *protected*?"

  ### 9. The Veteran's Reintegration
  "Finally, a practical question for my students. If we adopt the Revisionist view, a veteran returning from an unjust war carries the moral burden of having participated in a wrongful enterprise. If we adopt your view, they return as moral equals. Beyond the theory, what do we owe these soldiers socially? If your view is correct, should society treat the veteran of an unjust war exactly the same as the veteran of a just one?"

  *   **Likely Answer:** She will likely argue that society must treat them the same to ensure successful reintegration and that moral judgment of the war shouldn't fall on the individual soldier.
  *   **Follow-up:** "If society treats them the same, but the war was objectively unjust, aren't we collectively engaging in a form of moral erasure? Does your view require us to collectively forget *why* they fought in order to welcome them home? Is that a healthy way for a democracy to process its wars?"
