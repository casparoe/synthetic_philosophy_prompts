answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Priya's. And standing here, looking out at this room, I realize I have a unique challenge.

  On my left, we have Priya's family and Daniel's physicist friends. You know who you are. You love a good story, you love a good drink, and you probably haven't thought about the topology of a manifold since you passed your finals, if ever.

  On my right, we have the philosophy of physics crowd. You know who you are. You are currently scanning this speech for category errors. You are waiting to see if I confuse the manifold with the metric. You are the people who know that Priya has spent her career arguing that spacetime points are not real, independent things.

  And then there is Daniel. Daniel, we love you. But as Priya has gently pointed out for years, you walk around treating spacetime points like little substantival beads on a string. You talk about them as if they have names, as if they sit there waiting for the metric to show up to work. You are, in the sweetest possible way, a naive substantivalist.

  Now, for the family: In General Relativity, there is a famous puzzle called the "Hole Argument." I promise I will make this quick. Imagine you have a map of the universe. The "Hole Argument" asks: If you take all the physical stuff—stars, planets, light—and you smoothly shuffle them around on the map, but you keep the distances between them exactly the same... have you created a new universe?

  Daniel, and most working physicists, instinctively say, "Well, the stuff is now at different points, so yes, it's different."
  Priya says, "No. That's nonsense. The points don't matter. Only the relationships matter."

  Here is why this matters for a wedding. If Daniel were right about physics—if the points had their own independent identity—then the future would be fundamentally unpredictable. You could have the exact same past, the exact same laws of physics, and the universe could still branch into infinite different futures just because the points decided to swap identities inside a "hole." It breaks determinism. It means commitment is mathematically impossible.

  Fortunately for us, and for this marriage, Priya is right.

  Because Priya knows that reality isn't found in the points. It isn't found in the individual coordinates of where you are standing right now. Reality is found in the *metric*. It is found in the distances. It is found in the intervals between things.

  Daniel, you look at Priya and you see a point on a manifold. You see a specific person at a specific time. But Priya knows better. She knows that who you are isn't about *where* you are. It's about the curvature you create together.

  There is a beautiful irony here. The Hole Argument was originally designed to show a crisis in physics. It was meant to show that if you believe points are real, you lose the ability to predict the future. But look at you two. By marrying, you are solving the Hole Argument in real time.

  You are declaring that it doesn't matter if life shuffles you around. It doesn't matter if you move cities, change jobs, or if the coordinates of your life get diffeomorphically dragged through a decade of chaos. As long as the metric between you remains invariant—as long as the distance between your hearts stays constant—you are in the same physical reality. You are in the same universe.

  To the philosophers in the room: Yes, I am reducing Leibniz equivalence to a romantic metaphor. Please put down your pens.
  To the family: What I am saying is, it doesn't matter where you are, as long as you are together.

  Daniel, you may think the points are real. But Priya has taught us that the points are just placeholders. The only thing that has physical significance... the only thing that is real... is the connection.

  So, let's raise a glass.

  To Priya and Daniel. May your love be the one thing in the universe that is diffeomorphism invariant. May you never let the hole argument break your determinism. And may you always remember that the points don't matter. The only thing that matters is the space between you, and how you choose to measure it.

  To the bride and groom!
