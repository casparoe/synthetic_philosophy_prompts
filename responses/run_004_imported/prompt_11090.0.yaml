      *   *Denny 1 (Real Patterns):* Strong point on the "Real Patterns" essay. Dennett does argue beliefs are real if the pattern is robust. His comparison to human characters is a strong literary argument (we infer Hamlet's grief from text/behavior, not telepathy).
      *   *Renata 2 (Phenomenology vs. Pattern):* This is her strongest move. Dennett is often accused of eliminating qualia (or redefining them so much they vanish). Renata is highlighting the gap between "functional state" and "experiential state." A robot can track error probabilities without *dreading* the error.
      *   *Denny 2 (The Asymmetry Charge):* This is the strongest philosophical move. Dennett is a heterophenomenologist. He treats human reports exactly like robot reports. If Renata grants humans interiority in fiction but denies it to Iris based on "access," she is violating Dennett's method.

