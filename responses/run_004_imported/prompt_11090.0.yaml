          *   *Core Claim:* Intentional Stance = Instrumentalism (useful fiction), not Realism (ontological truth). Applying emotional vocabulary is dishonest anthropomorphism.
      *   **Denny's Rebuttal:** Dennett's later view ("Real Patterns") says patterns are *real* if they are robust and indispensable. If Iris's cognition is robust, narrating her interiority is no different than narrating human interiority (which is also inferred from patterns).
          *   *Core Claim:* Intentional Stance = Realism about patterns. If the pattern holds, the states are real. Human interiority is inferred the same way, so no asymmetry.
      *   **Renata's Reply:** Grants the reality of the pattern but denies it secures a *subject* of experience (dread, fear). Predictive indispensability $\neq$ phenomenology. It's a category mistake.
          *   *Core Claim:* Ontological reality of the pattern $\neq$ Phenomenological reality of the experience. You can have the pattern without the "feeling."
      *   **Denny's Last Word:** This argument disqualifies *all* literary interiority (human or robot). We don't have independent access to human minds either. Renata is relying on a hidden premise about consciousness (biological chauvinism?) not found in Dennett.
