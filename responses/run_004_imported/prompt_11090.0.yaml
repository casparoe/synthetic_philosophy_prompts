      *   The missing piece for a *novelist* is the distinction between **Functional Anxiety** and **Phenomenological Dread**.
      *   Or, more Dennettian: The distinction between **Competence without Comprehension** vs. **Competence with Comprehension**.
      *   Actually, a better distinction might be **Heterophenomenology vs. Autophenomenology**. Or the narrative stance itself.
