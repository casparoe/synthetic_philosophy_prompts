      *Wait, one more thing:* Denny's point about "Real Patterns" is that the pattern *is* the thing. There is no "experience" behind the pattern. So for Dennett, Renata is chasing a ghost. But for a novelist, the "ghost" (the reader's empathy) is the product. I need to balance the philosophy with the reader's experience.

