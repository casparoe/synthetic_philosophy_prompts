      *   *Is expected welfare the only metric?* No. Most ethicists argue fairness is a distinct value from welfare maximization.
      *   *The "Empty Ritual" claim:* It's not empty if the ritual *is* the ethical act. The process *is* the point.

  7.  **Finalizing the Structure:**
