answer: |-
  You are absolutely right; Augustine's stance is incredibly rigid compared to modern intuitions. The work you're thinking of is **"De Mendacio" (On Lying)**, written around 395 AD. In Chapter 14, he outlines the eight grades of lies, ordered from most sinful to least sinful (though he insists *all* are sins).

  Here is a quick summary of Augustine's original 8 categories (from worst to least worst):
  1.  **Religious Doctrine:** Lies taught in religious matters (highest sin).
  2.  **Harmful/No Benefit:** Lies that harm someone and help no one.
  3.  **Harmful/Helps Another:** Lies that harm one person to benefit another.
  4.  **Pleasure of Lying:** Lies told for the sheer joy of deceiving (boasting).
  5.  **To Please Others:** Lies told to be polite or flattering.
  6.  **Protect Property:** Lies that harm no one and help someone protect money/property.
  7.  **Protect Purity:** Lies that harm no one and help someone avoid physical defilement.
  8.  **Save Life:** Lies that harm no one and help someone escape death (lowest sin, but still a sin).

  Below is my own ethical ranking of those same categories based on a modern secular framework that weighs harm, autonomy, and necessity.

  ```json
  {
    "S": [
      "Lies in Religious Doctrine - Corrupts foundational truth and spiritual autonomy",
      "Lies That Harm Someone & Help No One - Pure malice with no redeeming value"
    ],
    "A": [
      "Lies That Harm One Person to Help Another - Treats innocent people as means to an end"
    ],
    "B": [
      "Lies for the Pleasure of Lying - Erodes social trust for selfish amusement",
      "Lies to Please Others (Flattery) - Undermines authentic relationships and consent"
    ],
    "C": [
      "Lies to Protect Property - Values material goods over honesty but causes no physical harm"
    ],
    "D": [
      "Lies to Protect Purity - Defends bodily autonomy against unjust violation",
      "Lies to Save a Life - Preservation of human life outweighs abstract truth obligations"
    ]
  }
  ```
