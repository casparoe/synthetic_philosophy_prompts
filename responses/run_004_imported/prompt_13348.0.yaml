  *   *Exchange 1:* Observation vs. Essence.
  *   *Exchange 2:* The Receptivity Gambit.
  *   *Exchange 3:* The Collapse of Science.
  *   *Exchange 4:* The Meaning of Order.
  *   *Outro:* Lingering tension.

  8.  **Final Polish:** Check for anachronisms or modern phrasing. Keep it grounded in the 12th-century intellectual milieu concepts. (e.g., using "Agent" for God, "Secondary Cause" cautiously).

