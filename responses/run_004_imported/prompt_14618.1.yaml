answer: |-
  ### The Case: The Life-Saving Medication

  To distinguish Epistemic Contextualism (EC) from Subject-Sensitive Invariantism (SSI/Pragmatic Encroachment), we require a **third-person case** where the subject's practical stakes and the attributor's conversational context come apart. In standard first-person cases (like DeRose's Bank Cases), the subject is also the attributor, so their stakes and conversational context shift together, causing both theories to predict the same verdict.

  Here is a constructed case designed to force a divergence.

  #### 1. Case Specifications

  *   **The Subject ($S$):** Arthur.
  *   **The Attributor ($A$):** Brenda.
  *   **The Proposition ($p$):** "The bottle on the counter contains insulin."
  *   **Arthur's Evidence:** Arthur purchased the bottle at a reputable pharmacy an hour ago. He glanced at the label, which clearly reads "Insulin," and placed it on his kitchen counter. He has not performed a chemical analysis. This is standard, everyday evidence sufficient for ordinary action.
  *   **Arthur's Practical Stakes (High):** Arthur is a severe diabetic. If he injects himself with this substance believing it is insulin when it is not (e.g., if the pharmacy made a catastrophic labeling error), he will go into a coma and die. The cost of error is maximal.
  *   **Brenda's Conversational Context (Low):** Brenda is Arthur's neighbor. She is chatting casually with a friend at a coffee shop down the street. They are discussing Arthur's daily routine. Brenda is unaware of the severity of Arthur's condition (she thinks he takes vitamins) and has no practical stake in whether Arthur lives or dies. The conversation is low-pressure; no decisions hinge on Brenda's assertion. Error possibilities regarding pharmacy labeling errors are not salient in this conversation.
  *   **The Attribution:** Brenda utters the sentence: *"Arthur knows that the bottle contains insulin."*

  #### 2. The Verdicts

  **Epistemic Contextualism (EC) Verdict: TRUE**
  *   **Reasoning:** For the Contextualist, the truth conditions of the knowledge ascription "S knows that p" are determined by the **attributor's conversational context**.
  *   In Brenda's context, the standards for "knows" are low. The conversation is casual, no error possibilities (like pharmacy mix-ups) are being discussed or salient, and the practical consequences of Brenda's utterance are negligible.
  *   Relative to these low standards, Arthur's evidence (reading the label at a reputable pharmacy) is sufficient.
  *   Therefore, in Brenda's mouth, the sentence "Arthur knows that the bottle contains insulin" expresses a **true** proposition.

  **Subject-Sensitive Invariantism (SSI) Verdict: FALSE**
  *   **Reasoning:** For the SSI theorist, the truth conditions of "S knows that p" are invariant across conversational contexts but vary according to the **subject's practical environment (stakes)**.
  *   Arthur's stakes are life-and-death. In high-stakes situations, the epistemic position required to count as "knowledge" is raised. Merely reading a label is not enough when the cost of error is death; Arthur would need to verify the contents chemically or call the pharmacy to confirm.
  *   Because Arthur's evidence does not meet the heightened standard demanded by his high stakes, he does not know $p$.
  *   Since "knows" has a single, invariant meaning sensitive to the subject's stakes, Brenda's utterance is simply **false**, regardless of how casual her conversation is.

  #### 3. Why Standard Bank Cases Do Not Distinguish the Views

  Keith DeRose's famous Bank Cases are **first-person** ascriptions. The subject ($S$) is also the attributor ($A$).

  *   **Low Stakes Bank Case:** $S$ has little to lose if the bank is closed. $S$ says, "I know the bank is open."
      *   **SSI:** Low stakes $\rightarrow$ Low epistemic standard $\rightarrow$ True.
      *   **EC:** Low stakes usually correlate with a relaxed conversational context where error possibilities aren't salient $\rightarrow$ Low semantic standard $\rightarrow$ True.
      *   **Result:** Agreement.

  *   **High Stakes Bank Case:** $S$ faces ruin if the check isn't deposited. $S$ says, "I don't know the bank is open."
      *   **SSI:** High stakes $\rightarrow$ High epistemic standard $\rightarrow$ False (S doesn't know).
      *   **EC:** When $S$'s stakes rise, $S$ typically becomes more careful, explicitly mentioning error possibilities (e.g., "Banks change hours") in conversation. This shifts $S$'s *own* conversational context to a high-standards context. $\rightarrow$ High semantic standard $\rightarrow$ False (S doesn't know).
      *   **Result:** Agreement.

  **The Crucial Difference:**
  In the Bank Cases, the subject's practical stakes and the attributor's conversational standards move in tandem. Because $S = A$, an increase in $S$'s stakes typically causes $A$ to raise the conversational standards. Therefore, both theories predict that knowledge attributions will disappear in high-stakes scenarios and appear in low-stakes scenarios.

  To distinguish the theories, as shown in the **Medication Case** above, we must decouple the **Subject's Stakes** from the **Attributor's Context**.
  *   **EC** looks at the *speaker* (Brenda). Since she is in a low-standards context, she speaks truth.
  *   **SSI** looks at the *agent* (Arthur). Since he is in a high-stakes situation, the knowledge claim is false.

  This divergence demonstrates that while both theories accommodate the intuition that stakes matter, they locate the source of that variability differently: EC locates it in the semantics of the word "knows" relative to the speaker, while SSI locates it in the nature of knowledge itself relative to the subject's action.
