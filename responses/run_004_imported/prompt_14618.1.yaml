      *Refining the Bank Case explanation:* In DeRose's case, when stakes go up for the subject, the subject (who is speaking) starts mentioning possibilities of error. This shifts the conversational context. So both theories predict a shift in truth value. In a third-party case where the speaker ignores the subject's stakes, the theories diverge.

