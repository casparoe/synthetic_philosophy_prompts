answer: |-
  Hobbes is cornered by John Wallis, who has just dismantled his latest proof for squaring the circle.

  Wallis says, "Thomas, the deduction is flawless. Your construction is geometrically impossible."

  Hobbes waves him off. "John, you're treating geometry like physics. In natural philosophy, God built the apparatus, so we have to accept the data He gives us. But in geometry? **We** built the apparatus. **We** laid the bricks."

  Wallis shakes his head. "We defined the terms, Thomas. We don't control the consequences."

  Hobbes leans in, utterly serious. "In physics, God sets the boundary conditions. In geometry, *I* do. So if the circle isn't squaring, it's not a logical contradiction—it's just a change order."
