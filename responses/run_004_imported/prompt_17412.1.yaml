  so in my seminar on conditionals we finally got to Lewis's triviality result (the 1976 Philosophical Review paper) and the proof honestly just washed over me the first time through. I get that it shows theres no conditional connective '>' where P(A > B) can equal P(B|A) across the board without the whole probability function collapsing into something trivial, but I don't have a gut-level feel for why it has to go that way instead of the equation just failing for a few weird credence functions here and there. Can you walk me through the core intuition of the argument, not just restate the algebra -- like what actually breaks when you condition on A>B itself (or its negation)? Also curious whether this is generally seen as a knockdown argument for the Adams/Edgington 'no truth value' view of indicatives, or if people think Stalnaker-style possible worlds semantics dodges it somehow.
