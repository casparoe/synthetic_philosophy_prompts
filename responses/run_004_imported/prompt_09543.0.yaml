answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Best Man. And for those who *do* know me, you know that tonight I have a dual role. Obviously, I'm the brother. But I'm also the designated driver.

  Now, usually, being the DD means you're the responsible adult who gets to sip sparkling water while everyone else has the fun. But for the last few years, I've been reading a lot of old philosophy in my spare time. And somewhere in the works of Plato, I found a description of my job tonight that sounds much more impressive.

  Plato argues that a proper drinking party needs a "Symposiarch." A President of the Party. This person stays sober while others drink, not to be a buzzkill, but because wine has a unique property: it removes our composure. It strips away the social performance we put on during the day. Plato says that if you want to know who someone *really* is—their courage, their kindness, their true nature—you watch them when they've had a few glasses. The wine reveals the character; the sober president protects it.

  So, really, I'm not just the designated driver. I am the Sober President. And my brother, who has been our family's designated wine expert since he was nineteen, thought this was hilarious. He's been joking for weeks that I'm here to conduct a "field test" on his character.

  And because I am the one who stayed sober enough to see what the wine revealed, I have to say: the results are in.

  There was, for instance, the time about five years ago at a family reunion. We're a few bottles deep into the evening, and my brother decides that he is going to fix the patio heater. Now, he is not a fixer of things. He is a breaker of things. But the wine had given him the confidence of a seasoned engineer. He spent forty minutes wrestling with a propane tank while explaining thermodynamics to our grandfather. It was slightly unflattering. He looked a bit foolish. But here is what the Sober President noticed: he wasn't showing off to be arrogant. He was showing off because he wanted to make sure everyone on the patio stayed warm. Even when he's losing his balance, his instinct is to take care of the room.

  Then there was last year, on his birthday. He'd had a long week, and by 10 PM, he was ready to pass out. But a friend called with a crisis—nothing major, just a bad day and a locked car. Most of us would have said, "Call you tomorrow." He didn't. He poured a glass of water, sobered up instantly, and drove across town to sit in a parking lot for an hour just to make sure his friend wasn't alone.

  Plato says wine reveals the true self. And what I have seen, over and over, is that when my brother's guard is down, he doesn't get mean, and he doesn't get selfish. He gets *more* generous. The wine didn't create that kindness; it just washed away the hesitation to show it.

  But the ultimate test of character isn't how you treat your friends when you're happy. It's who you choose to stand beside when the stakes are high. And that is where [Groom's Name] has passed with flying colors.

  [Bride's Name], watching him with you, I've seen the best version of him. You don't need a Sober President to tell you who he is; you know it better than anyone. But for the rest of us, seeing how he looks at you, seeing how he speaks about you, confirms everything the wine ever hinted at. He is loyal, he is kind, and he is ready.

  So, I will step down from my role as Symposiarch. The testing phase is over. The character is proven.

  If everyone could please raise their glasses.

  To my brother, and to his beautiful bride. May your life together be full of love, full of truth, and may you always have someone sober enough to drive you home when the night is done.

  To [Groom] and [Bride]!
