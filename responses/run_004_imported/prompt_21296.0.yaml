answer: |-
  This is an excellent dinner argument. You and your friend have stumbled upon one of the most famous and enduring critiques of *A Theory of Justice*. Your friend is channeling the Nobel laureate John Harsanyi, who argued exactly that point against Rawls, while your objection cuts to the heart of whether Rawls' principles can claim universal validity.

  To answer your question: **Yes, if Rawls' argument relies solely on a psychological disposition toward risk-aversion, his theory becomes parochial.** However, Rawls explicitly anticipated this objection and argued that his derivation does *not* rely on psychological risk-aversion, but rather on the unique structure of the choice situation itself.

  Here is the breakdown of why your friend is partially right, but why Rawls would claim your specific objection about "risk-seeking" people misses the mark.

  ### 1. The Friend's Point: The Harsanyi Critique
  Your friend is correct that on the surface, the **Maximin Rule** (maximize the minimum position) looks like extreme risk-aversion.
  *   **Expected Utility:** A standard rational choice model suggests you should weigh the potential gains against the potential losses based on probability. If there is a 90% chance you will be rich and a 10% chance you will be poor, a risk-neutral or risk-seeking person might accept a system with a miserable floor if the ceiling is high enough.
  *   **The Critique:** Harsanyi argued that in the Original Position, since you have no reason to think you are more likely to be one person than another, you should assign an equal probability to being anyone (the Principle of Insufficient Reason). If you do that, you would maximize *average* utility, not the position of the worst-off.
  *   **The Implication:** If Rawls needs the parties to be risk-averse to get the Difference Principle, then the theory only applies to cautious people. A society of daring entrepreneurs might reasonably reject the Difference Principle in favor of a lottery-style society with higher growth but a lower safety net.

  ### 2. Rawls' Defense: Risk vs. Uncertainty
  Rawls' counter-argument is technical but crucial. He insists the Original Position is not a decision under **risk**, but a decision under **uncertainty**.
  *   **Risk:** You know the odds (e.g., a roulette wheel).
  *   **Uncertainty:** You do not know the odds, and you cannot calculate them.

  Rawls argues that in the Original Position, you cannot assign probabilities to your place in society. You don't know if the society will be feudal, capitalist, or socialist. Because you cannot calculate the odds, standard expected utility maximization (which allows for risk-seeking behavior) is impossible. You are forced to look at the outcomes alone.

  ### 3. The Three "Special Conditions"
  Rawls argues that Maximin is not just "caution"; it becomes the *only* rational rule when three specific conditions are met. He claims the Original Position is designed to meet all three:
  1.  **No Probabilities:** As mentioned above, you have no basis for guessing your odds.
  2.  **The Guarantee:** The person cares little for what is above the minimum guarantee. (i.e., Once you have your basic liberties and primary goods, gaining *more* wealth is less important than ensuring you don't lose *everything*).
  3.  **Unacceptable Alternatives:** The rejected alternatives have outcomes that are intolerable.

  This is where your objection about risk-seeking people hits a wall. Rawls argues that in the context of **justice**, the stakes are not just money; they are **social status, basic liberties, and the self-respect of being a citizen.**

  If you are "risk-seeking" in the Original Position, you are effectively gambling with your fundamental status as a free and equal person. If you lose that gamble, you might end up in a position of serfdom or destitution where you cannot exercise your moral powers at all. Rawls argues that it is *irrational* to gamble with the prerequisites of citizenship, regardless of your psychological propensity for risk.

  ### 4. The "Strains of Commitment"
  Rawls adds another layer called the **strains of commitment**. The parties in the Original Position know that whatever they agree to, they must live with in the real world.
  *   If you agree to a risk-seeking society (high inequality, low floor) and you turn out to be at the bottom, can you actually commit to that system?
  *   Rawls argues no. If the bottom is too miserable, the people there cannot reasonably be expected to uphold the social contract. They would rebel or live in despair.
  *   Therefore, even a "risk-seeking" party in the Original Position must acknowledge that they cannot agree to a system that creates a class of people for whom participation in society is impossible.

  ### 5. Is it still Parochial?
  Despite Rawls' defenses, many philosophers think your intuition is correct.
  *   **The Conservative Bias:** Critics argue that Rawls' "uncertainty" distinction is a sleight of hand. In practice, treating a situation as having *no* probabilities is functionally identical to being infinitely risk-averse.
  *   **The Definition of Rationality:** Rawls defines "rationality" in the Original Position in a way that excludes risk-seeking behavior regarding primary goods. If you define rationality as "protecting one's capacity to pursue a conception of the good," then risk-seeking is irrational. But if you define rationality as "maximizing potential gain," then Rawls is indeed imposing a specific, somewhat conservative worldview.

  ### Verdict
  Your friend is right that the mechanism *looks* like risk-aversion. However, your objection that this makes it parochial to "risk-averse people" might be slightly off-target, because Rawls argues the **subject matter** (basic justice) changes the rules of rationality.

  He would say: It is not that the Difference Principle only applies to cautious people; it is that **no rational person, regardless of their risk tolerance, should gamble with their basic rights and social standing.**

  However, if you remain unconvinced that the stakes of justice preclude risk-seeking calculation, then yes, the critique stands: The Difference Principle may reflect a specific cultural or psychological preference for security over opportunity, making it less universal than Rawls hoped. This is why the debate you had at dinner is still alive and well in political philosophy departments 50 years later.
