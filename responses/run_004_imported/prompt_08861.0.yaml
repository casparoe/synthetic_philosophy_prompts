answer: |-
  It is a rare and slightly painful pleasure to have a formal social epistemology problem manifest as an administrative headache. You have encountered the doctrinal paradox (or discursive dilemma) in its natural habitat: the faculty meeting. Since you are already familiar with the Kornhauser and Sager (1986, 1993) origins and the List and Pettit (2002, 2004) formalization, I will skip the definitions and move straight to the normative and procedural implications for your specific context.

  The core tension you faced is not just a mathematical curiosity; it reveals a conflict between two different conceptions of what a hiring committee *is*. Here is a breakdown of how to think through the PBP vs. CBP choice, the status of systematicity, and concrete procedural recommendations.

  ### 1. PBP vs. CBP: It's Not Arbitrary, But It Is Normative

  You asked if there is a principled way to choose between Premise-Based Procedures (PBP) and Conclusion-Based Procedures (CBP). The literature sometimes presents this as a stalemate, but in the context of hiring, the choice depends on the **teleology of the committee**.

  **The Case for PBP (Reason-Giving & Accountability)**
  PBP forces the committee to establish a collective stance on the *reasons* for a hire.
  *   **Departmental Identity:** If your department has a strategic plan (e.g., "We need a metaphysician who can teach logic"), PBP enforces this. It prevents a coalition from hiring a philosopher of biology because they like them personally, even if they fail the "research fit" premise.
  *   **Feedback & Transparency:** If you owe feedback to candidates (or to the Dean), PBP provides a structured justification. "Candidate X was excellent on research but failed the teaching threshold."
  *   **Epistemic Quality:** If the premises are truth-apt (e.g., "Did this candidate publish in top journals?"), PBP is generally better at truth-tracking than CBP, assuming members are competent on specific dimensions (the "Condorcet Jury Theorem" logic applied to premises).

  **The Case for CBP (Holism & Autonomy)**
  CBP respects the individual member's holistic judgment.
  *   **Compensability:** The boolean rule you used (Offer $\iff P \land Q \land R$) is rigid. CBP allows for trade-offs. A candidate might be weak on letters but so brilliant in the job talk that a member judges they deserve an offer *all things considered*. CBP captures this; PBP with a conjunction rule vetoes it.
  *   **Responsibility:** In CBP, members own the final decision. In PBP, members can hide behind the premises ("I voted against the offer, but the premises forced it"). CBP aligns better with the moral responsibility of hiring a colleague.

  **The Principled Choice:**
  The choice is non-arbitrary if you decide what the committee is outputting.
  *   If the committee is outputting a **judgment of fact** (e.g., "This candidate meets our standards"), use **PBP**.
  *   If the committee is outputting a **collective preference/action** (e.g., "We want this person as a colleague"), use **CBP**.
  *   *Recommendation:* Hiring is ultimately an action, not a truth claim. However, because hiring uses public resources and affects departmental trajectory, a **modified PBP** is usually safer. It ensures the hire aligns with departmental needs, preventing "pet candidate" hires that fail objective criteria.

  ### 2. The Impossibility Result and Systematicity

  You asked whether a committee could reject the **systematicity** condition in good conscience. The short answer is: **You must reject it to function, and you are right to do so.**

  Recall that List and Pettit's impossibility theorem holds if you require the aggregation function to satisfy:
  1.  **Universal Domain** (any combination of individual judgments is allowed).
  2.  **Anonymity** (all voters count equally).
  3.  **Systematicity** (the aggregation rule is the same for all propositions, and the judgment on one proposition doesn't depend on the label of another).

  Systematicity implies that you must vote on "Research Fit" using the same rule as "Make Offer," and that the rule for "Make Offer" shouldn't depend on the logical connection to the premises.

  **Why Hiring Committees Should Reject Systematicity:**
  Systematicity treats all propositions on the agenda as ontologically equal. But in a hiring committee, the propositions are *not* equal. The premises are *instrumental* to the conclusion.
  *   **Logical Priority:** The truth of "Make Offer" is *derived* from the premises (by the department's rules). It is not an independent fact. Enforcing systematicity would require ignoring the logical connection between $P, Q, R$ and $C$ during aggregation, which is irrational for a rule-bound body.
  *   **The "Good Conscience" Clause:** Rejecting systematicity is not a loophole; it is an acknowledgment of the **structure of agency**. As List argues in *Group Agency* (2011), groups can be rational agents only if they prioritize certain propositions over others to maintain consistency. By adopting PBP, you are explicitly saying, "The premises constrain the conclusion." By adopting CBP, you are saying, "The conclusion overrides the premises." Both break systematicity, and both are permissible.

  The impossibility theorem tells you that you cannot have it all (perfect democracy + perfect rationality on all issues). You have to choose which rationality to sacrifice. In hiring, sacrificing the rationality of the *premises* (via CBP) is often more acceptable than sacrificing the rationality of the *outcome* (via PBP), or vice versa, depending on your departmental culture.

  ### 3. The Hidden Problem: The Boolean Rule

  There is a third issue lurking in your description that is often more damaging than the aggregation procedure itself: **The logical form of the decision rule.**

  You used a conjunction rule: Offer $\iff$ Fit $\land$ Teaching $\land$ Letters.
  This assumes the criteria are **non-compensatory**.
  *   *The Problem:* In philosophy hiring (unlike, say, pilot licensing), criteria are often compensatory. A candidate with mediocre letters but a superstar job talk might be preferable to a candidate with great letters and a lukewarm talk.
  *   *The Aggregation Effect:* The discursive dilemma is most severe when the decision rule is a strict conjunction or disjunction. If you move to a **weighted scoring model** (e.g., a candidate needs 7/10 total points across the three categories), the likelihood of a paradox decreases, and the tension between PBP and CBP softens.

  If you stick with the boolean rule, you are artificially inflating the power of the "No" vote on any single premise. This can lead to a situation where the majority thinks the candidate is good enough overall (CBP winner), but a minority can block on a single premise (PBP loser).

  ### 4. Procedural Recommendations for Next Time

  Given the above, here is a principled protocol for your next committee cycle:

  **A. Pre-Vote Deliberation (The Epistemic Fix)**
  The discursive dilemma assumes fixed, private judgments. But committees are deliberative bodies.
  *   **Procedure:** Do not vote immediately. Discuss the premises first. Often, the paradox arises because Member A interprets "Teaching Effectiveness" differently than Member B.
  *   **Goal:** Align the *meaning* of the premises. If you can reduce the variance in how premises are interpreted, you reduce the likelihood of the paradox. List and Pettit acknowledge that deliberation can transform preferences to avoid inconsistency.

  **B. Sequential Voting with a "Safety Valve"**
  Adopt a PBP structure but allow for CBP override.
  1.  Vote on the premises ($P, Q, R$).
  2.  Apply the rule to generate a *provisional* outcome.
  3.  Hold a final binding vote on the Conclusion ($C$).
  *   *Rationale:* This respects the departmental criteria (PBP) but acknowledges that the faculty's holistic judgment (CBP) is the ultimate authority. If the two come apart, the final vote on $C$ should prevail, but the divergence should be recorded in the minutes. This forces the committee to acknowledge the tension rather than waving it off.

  **C. Reject Systematicity Explicitly**
  Write your committee charter to explicitly state: *"Judgments on criteria will be aggregated by majority vote; the final decision will be made by majority vote on the offer. In the event of inconsistency, the final decision vote prevails."*
  *   This is a formal rejection of systematicity. It prioritizes the **action** over the **record**. It admits that the committee is a practical agent, not just a truth-tracking machine.

  **D. Consider the "Quota" Problem**
  Sometimes the paradox arises because you are evaluating multiple candidates against a fixed standard, but only have one line.
  *   If Candidate A wins on PBP and Candidate B wins on CBP, the issue might be that the "premises" are being used to rank rather than to evaluate fitness.
  *   Ensure your premises are threshold-based (Meets/Does Not Meet) rather than comparative (Better/Worse), unless you are using a scoring system.

  ### Summary

  You can walk into the next meeting with this stance:
  1.  **The Paradox is Real:** It wasn't confusion; it was a structural feature of our voting.
  2.  **Systematicity is Rejected:** We are not required to treat the "Offer" vote the same way we treat the "Teaching" vote because they serve different functions (action vs. evaluation).
  3.  **Procedure:** We will use **Deliberation first** (to align interpretations), followed by **PBP as a filter** (to ensure standards), followed by **CBP as the final decider** (to ensure holistic buy-in).

  This approach respects the formal literature while acknowledging that a hiring committee is a practical, deliberative body, not a pure aggregation function. It shifts the focus from "How do we avoid the math?" to "What kind of collective agent do we want to be?"

  *References for your syllabus/update:*
  *   List, C., & Pettit, P. (2002). "Aggregating Sets of Judgments: An Impossibility Result." *Economics and Philosophy*.
  *   List, C. (2011). *Group Agency: The Possibility, Design, and Status of Corporate Agents*. (Specifically the chapters on deliberation).
  *   Mongin, P. (2008). "Factoring out the Impossibility of Logical Aggregation." *Journal of Economic Theory*. (Good for the systematicity critique).
  *   Hartmann, S., & Sprenger, J. (2012). "Judgment Aggregation and the Problem of Tracking the Truth." *Synthese*. (For the epistemic vs. practical distinction).
