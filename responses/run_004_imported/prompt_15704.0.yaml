answer: |-
  This is a critical moment for your Extended Essay, and I need to be completely honest with you to protect your grade: **There is no record of David Lewis writing a paper titled "Do We Believe in Penal Substitution?"**

  David K. Lewis (1941–2001), the proponent of Modal Realism, was an atheist/agnostic who rarely wrote on positive theology. When he did write on religion (e.g., "Divine Evil"), it was to critique the moral coherence of theistic doctrines, not to defend them like penal substitution.

  It is highly likely you are encountering one of three situations:
  1.  **Conflation with C.S. Lewis:** The Christian apologist C.S. Lewis wrote extensively on atonement and substitution, but he was not a modal realist.
  2.  **Misremembered Title:** You might be thinking of Lewis's paper **"The Punishment that Leaves Something to Chance"** (1989), which discusses moral luck and punishment, but *not* theological substitution.
  3.  **Secondary Source Confusion:** You may have read a paper *by another philosopher* discussing how Lewis's Modal Realism *could* apply to atonement, and mistakenly attributed the argument to Lewis himself.

  **Why this matters for your IB Essay:**
  If you base your essay on a non-existent primary text, you will lose significant marks under **Criterion B (Knowledge and Understanding)** and **Criterion D (Critical Thinking)**. IB examiners check bibliographies.

  However, the philosophical connection you are *trying* to make is fascinating. If you want to salvage this topic, you need to adjust your approach. Here is an analysis of why your current argument doesn't work within Lewis's system, and how you might pivot.

  ### 1. The Philosophical Hurdle: Counterpart Theory & Causal Isolation
  Even if Lewis *had* argued this, your interpretation faces two major technical problems within his own metaphysics. You need to address these in your essay to show deep understanding.

  *   **Causal Isolation:** In Lewis's Modal Realism, possible worlds are spatiotemporally isolated. Nothing that happens in World W2 can causally affect World W1. If Christ pays the penalty in World W2, there is no metaphysical mechanism for that payment to cancel the debt of sinners in World W1. Lewis would view this as magic, not metaphysics.
  *   **Counterpart Theory:** Lewis denies trans-world identity. You do not exist in other worlds; only your *counterparts* do. Therefore, the humans in the world where Christ is punished are not *you*. If your counterpart's guilt is absolved, *your* guilt remains. Lewis's system generally prevents the transfer of moral properties across worlds.

  ### 2. How to Pivot Your Research Question
  You can still write about Lewis and theology, but you must be accurate. Here are three viable alternatives:

  **Option A: The Problem of Uniqueness (Modal Realism vs. Incarnation)**
  *   **Question:** *To what extent does David Lewis's Modal Realism undermine the Christian doctrine of the Incarnation?*
  *   **Argument:** If every possibility is realized, there are infinite worlds where Christ becomes incarnate. Does this diminish the uniqueness of the Atonement? Or does it imply infinite sacrifices?
  *   **Sources:** *On the Plurality of Worlds*, secondary literature on "Modal Realism and Theology" (e.g., works by Daniel & Frances Howard-Snyder or Michael Rea).

  **Option B: Lewis's Critique of Divine Morality**
  *   **Question:** *How does David Lewis's argument in "Divine Evil" challenge the coherence of Penal Substitution?*
  *   **Argument:** In "Divine Evil," Lewis argues that a God who punishes finite sins with infinite hell is morally monstrous. You could analyze whether Penal Substitution (God punishing Christ instead) escapes Lewis's moral critique or falls victim to it.
  *   **Sources:** "Divine Evil" (in *Papers in Ethics and Social Philosophy*), *Mere Christianity* (C.S. Lewis for the counter-view).

  **Option C: Counterfactuals and Atonement (The "What If")**
  *   **Question:** *Can Lewisian Counterfactuals provide a coherent model for Vicarious Atonement without Modal Realism?*
  *   **Argument:** Instead of concrete worlds, use Lewis's *Counterfactual Conditionals*. "If Christ had not been punished, we would be condemned." You can analyze if this semantic framework helps explain the *logic* of substitution without requiring the metaphysics of concrete worlds.
  *   **Sources:** *Counterfactuals*, "The Punishment that Leaves Something to Chance."

  ### 3. Immediate Action Plan
  1.  **Verify the Source:** Check the Princeton University Press bibliography of David Lewis's *Papers*. If you cannot find "Do We Believe in Penal Substitution?" in a library catalog, **do not cite it.**
  2.  **Talk to your Supervisor:** Be honest. Say, "I am struggling to locate the primary text for this specific argument. I suspect I may have conflated a secondary interpretation with a primary source." This shows academic integrity.
  3.  **Reframe the Argument:** Instead of claiming Lewis *defended* penal substitution, argue that **Lewis's metaphysics creates a specific challenge for it.** This is a stronger critical essay. For example: "While some might hope Modal Realism could ground penal substitution in a concrete world, Lewis's own principles of causal isolation and counterpart theory actually render such a solution incoherent."

  ### Summary
  Your current premise relies on a text that likely does not exist and an interpretation that contradicts Lewis's core metaphysical commitments (isolation and counterpart theory).

  **Do not write the essay assuming the paper exists.** Pivot to analyzing the *tension* between Modal Realism and Christian doctrine, using Lewis's actual texts ("Divine Evil," *On the Plurality of Worlds*). This will demonstrate the critical thinking skills the IB is looking for, rather than building an argument on a factual error.
