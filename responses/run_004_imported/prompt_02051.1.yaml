prompt: |-
  I'm working on a longer feature about the replication crisis in psychology and I've fallen down a bit of a rabbit hole this week -- rereading Daryl Bem's infamous 2011 "precognition" study, the big Open Science Collaboration project a few years later that could only replicate something like a third of the original findings, and all the pre-registration and Registered Reports reforms that grew out of the wreckage. Somewhere around 1am last night, half-jokingly, I asked a philosopher friend what Karl Popper would've made of all this, since he died in 1994, years before any of it blew up, and all she gave me was a shrug and "well, falsifiability," which isn't really an answer.

  So I wanted to put it to you properly. Would Popper have seen the pre-registration movement as basically a practical, institutionalized version of his own falsifiability criterion -- forcing scientists to nail down in advance exactly what result would count against their hypothesis, so they can't quietly reinterpret a null finding after the fact? Or would he have thought the crisis actually exposes a hole in his own framework, since a single failed replication never cleanly falsifies a theory on its own -- you can always blame some auxiliary assumption about the sample, the measure, or the setting instead (the old Duhem-Quine problem)? I'd love something that actually engages with his specific arguments about ad hoc "conventionalist twists" and degrees of falsifiability, rather then just the "good science makes falsifiable predictions" line that gets trotted out in every intro philosophy class.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The replication crisis in psychology (Bem's precognition, Open Science Collaboration, pre-registration/Registered Reports).
      *   **Core Question:** How would Karl Popper view the pre-registration movement and the replication crisis?
      *   **Specific Constraints:**
          *   Avoid superficial "falsifiability" soundbites.
          *   Engage with specific Popperian concepts: *ad hoc* "conventionalist twists," degrees of falsifiability, the Duhem-Quine problem (auxiliary assumptions).
          *   Address the tension: Is pre-registration the institutionalization of falsification, or does the crisis reveal a flaw in Popper's framework regarding clean falsification?
      *   **Tone:** Intellectual, nuanced, suitable for a feature writer (someone who knows the context but wants philosophical depth).
      *   **Context:** The user is working late, dug into the details, found their philosopher friend's answer lacking.

  2.  **Deconstruct Popper's Philosophy (relevant to the prompt):**
      *   *Falsificationism:* Science progresses by conjectures and refutations. A theory is scientific if it can be proven false.
      *   *Conventionalist Twists:* Scientists often protect theories from falsification by tweaking definitions or adding excuses. Popper hated this. He called it immunizing the theory.
      *   *Duhem-Quine Problem:* You can't test a hypothesis in isolation; you test it with auxiliary assumptions. If the test fails, is the hypothesis wrong or the assumptions? Popper acknowledged this but argued scientists *should* agree in advance what counts as a refutation.
      *   *Degrees of Testability:* Some theories are more easily falsifiable than others (boldness/precision).
      *   *Methodological Rules:* Falsification isn't a logical necessity; it's a methodological decision. Scientists must *agree* to accept falsification.

  3.  **Connect Popper to the Replication Crisis & Pre-registration:**
      *   *Bem's Study:* Classic example of HARKing (Hypothesizing After Results are Known) and p-hacking. Popper would see this as the ultimate "conventionalist twist." Moving the goalposts after seeing the data.
      *   *Replication Crisis:* Shows that many "corroborations" were actually artifacts of flexible methods.
      *   *Pre-registration:* This looks *exactly* like what Popper wanted. It forces the "risky prediction" to be stated *before* the evidence is gathered. It prevents the "conventionalist twist."
      *   *The Duhem-Quine Tension:* A failed replication doesn't kill the theory immediately (maybe the replication was bad?). Popper knew this. He argued for a "court of appeal" or methodological agreement. Pre-registration helps here by standardizing the "auxiliary assumptions" (methods) in advance.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* Popper would love pre-registration. It stops cheating.
      *   *Correction:* Too simple. The user wants nuance about the Duhem-Quine problem.
      *   *Second thought:* Popper would say pre-registration solves the *methodological* problem of ad hoc adjustments, but the *logical* problem of Duhem-Quine remains. However, Popper's solution to Duhem-Quine was essentially social/methodological agreement, which is what pre-registration is.
      *   *Refinement:* Focus on the distinction between *logical falsifiability* (can it be falsified in principle?) and *methodological falsification* (do we agree to treat it as falsified?). The replication crisis is a crisis of *methodology*, not logic. Pre-registration restores the methodology.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate that "falsifiability" is indeed too shallow.
      *   **Point 1: Pre-registration as the Antidote to "Conventionalist Twists."** Explain Popper's fear of immunizing strategies. Show how Bem's p-hacking is exactly what Popper warned against. Pre-registration blocks this.
      *   **Point 2: The Duhem-Quine Problem & Methodological Decisions.** Address the user's specific worry. Popper knew one failure doesn't kill a theory. He argued for a *decision* to accept falsification. Pre-registration formalizes this decision rule.
      *   **Point 3: Degrees of Testability & Boldness.** Bem's study was "bold" but sloppy. Pre-registration encourages *precise* boldness, which Popper valued higher than vague boldness.
      *   **Point 4: The Limits (Where Popper might critique).** Pre-registration isn't a magic bullet. It doesn't fix bad theory. It creates bureaucracy. Popper valued creativity too.
      *   **Conclusion:** Summarize. Popper would see it as a necessary institutional evolution of his methodological rules.

  6.  **Refining the Content (Self-Correction during drafting):**
