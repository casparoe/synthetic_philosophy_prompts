answer: |-
  This is a fantastic question, and your philosopher friend's shrug is unfortunately representative of how Popper is often taught—as a soundbite generator ("falsifiability!") rather than a methodological architect. If you dig into *The Logic of Scientific Discovery* (1934) and his later work on *Conjectures and Refutations*, you find that Popper was acutely aware of the exact mess psychology found itself in.

  In fact, if you parse his specific arguments about **conventionalist twists**, **methodological rules**, and the **basis problem**, Popper wouldn't just endorse pre-registration; he would likely argue that the replication crisis proves his point that falsification is not a logical act, but a *social and institutional one*.

  Here is how Popper would likely dissect the situation, moving beyond the intro-class definition.

  ### 1. Pre-registration as the Ban on "Conventionalist Twists"
  You hit on this, but it's worth going deeper. Popper was terrified of what he called "conventionalist twists" or *ad hoc* hypotheses. He recognized that logically, you can protect any theory from falsification if you are willing to tweak the auxiliary assumptions enough.

  If a theory predicts $X$, and you observe $not-X$, you can save the theory by saying, "Well, the measurement was flawed," or "The sample was unusual," or "The effect only works when the experimenter is smiling." Popper called this "immunizing the theory against criticism." He argued that while this is *logically* permissible, it is *methodologically* forbidden. Science requires a rule: **Thou shalt not protect thy theory by moving the goalposts.**

  Daryl Bem's "Feeling the Future" study is the textbook example of a conventionalist twist. By analyzing the data in multiple ways until something stuck (p-hacking) or interpreting null results as "trends" post-hoc (HARKing), Bem was engaging in the exact behavior Popper warned would turn science into pseudoscience.

  Popper would view pre-registration not merely as "good practice," but as the **institutionalization of the ban on conventionalist twists.** By forcing researchers to commit to a specific falsification condition *before* seeing the data, pre-registration removes the agency to immunize the theory later. It turns a methodological virtue into a bureaucratic requirement.

  ### 2. The Duhem-Quine Problem and the "Decision" to Falsify
  This is the crux of your second question. You are right that a single failed replication does not logically falsify a theory because of the Duhem-Quine problem (you are testing the theory + auxiliary assumptions about the lab, the subjects, the stats, etc.). If the test fails, logic dictates that *something* in that conjunction is false, but not necessarily the core theory.

  Popper knew this. He didn't think falsification was a logical sledgehammer that automatically crushed false theories. He argued that falsification requires a **methodological decision.**

  In *The Logic of Scientific Discovery*, Popper discusses the "basis problem." Since all observation is theory-laden, how do we ever agree that a falsifying observation is actually true? His answer: We agree to stop questioning. We decide, as a scientific community, to accept certain "basic statements" as true for the sake of argument.

  The replication crisis exposes what happens when the scientific community *fails* to make that decision. When the Open Science Collaboration found that only ~36% of studies replicated, the original authors didn't say, "Our theory was wrong." They invoked the Duhem-Quine escape hatch: "The replication context was different," "The participants were different," "The subtle cues were missing."

  Popper would argue that pre-registration and Registered Reports are mechanisms to **force the methodological decision.** By agreeing in advance on the methods (the auxiliary assumptions), the community limits the ability to blame the "auxiliaries" later. If the pre-registered method fails, you have contractually agreed that the failure counts against the hypothesis. It doesn't solve the logical problem of Duhem-Quine, but it solves the *sociological* problem of scientists refusing to accept the refutation.

  ### 3. Degrees of Falsifiability and "Boldness"
  Popper also talked about "degrees of testability." A vague theory is hard to falsify; a precise theory is easy to falsify. He preferred "bold" conjectures.

  Bem's precognition study was "bold" in a sensational sense, but methodologically vague. It allowed for too much flexibility. Popper would distinguish between **boldness of claim** and **precision of prediction.**

  The pre-registration movement shifts the focus from boldness of claim to precision of prediction. A Registered Report rewards you for how precisely you define what would prove you wrong, not how exciting your hypothesis is. Popper would likely see this as a maturation of the field. Psychology was trying to be "bold" (making sweeping claims about human nature) without being "precise" (nailing down the conditions of falsification). Pre-registration forces the precision that makes the boldness meaningful.

  ### 4. Where Popper Might Critique the Reform
  However, Popper wouldn't give pre-registration a blank check. He was a fallibilist who believed knowledge grows through creative conjecture, not just rigid testing.

  *   **The Bureaucracy of Falsification:** Popper might worry that pre-registration could stifle the "context of discovery." If you have to specify every analysis in advance, do you miss serendipitous findings? Popper valued the creative leap. He might argue that pre-registration is excellent for the "context of justification" (testing) but shouldn't strangle the "context of discovery" (exploration). He would likely insist that exploratory studies remain valid, provided they are clearly labeled as *not* being tests of falsification.
  *   **The "True Believer" Problem:** Popper was deeply interested in the psychology of the scientist. He noted that scientists often cling to theories dogmatically, which isn't always bad—it prevents abandoning a good idea too soon. He might worry that a rigid pre-registration culture could lead to a "checklist mentality," where scientists feel that if they followed the protocol, the science is "good," even if the underlying theory is trivial. For Popper, the *content* of the conjecture mattered as much as the method of testing.

  ### The Verdict for Your Feature
  If you need a thesis statement for this section of your piece, it might be this:

  **Popper would argue that the replication crisis was not a failure of falsification logic, but a failure of falsification *discipline*.**

  The logic of Duhem-Quine always allowed psychologists to wiggle out of failed tests. The "crisis" occurred because the community lacked the institutional norms to prevent those wiggles. Pre-registration is the practical implementation of Popper's "methodological rules." It is the scientific community collectively agreeing to stop making "conventionalist twists" and to accept certain "basic statements" (replication data) as final.

  Popper wouldn't see pre-registration as a new invention. He would see it as the moment psychology finally decided to play the game of science by the rules he outlined 80 years prior. The crisis wasn't a hole in his framework; it was proof of what happens when you ignore it.

  **Key Popperian phrases to weave in:**
  *   *"Immunizing strategies"* (regarding p-hacking/HARKing).
  *   *"Methodological decision"* (regarding the acceptance of replication failure).
  *   *"Conventionalist twists"* (regarding post-hoc rationalizations).
  *   *"Degrees of testability"* (regarding the precision of pre-registered hypotheses).

  This framing moves you past "Popper said science must be falsifiable" to "Popper predicted that without institutional guardrails, scientists will naturally protect their theories until the field collapses." That's a much stronger hook for a feature on the replication crisis.
