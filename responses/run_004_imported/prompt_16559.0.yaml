answer: |-
  Here are 9 interview questions designed to corner the "non-functionalist" defense progressively, including the specific technical objections you requested.

  ### 1. The Bridge from Phenomenology to Math
  **Question:** IIT starts with five axioms about the *phenomenology* of experience (like intrinsicality and composition) and maps them to five postulates about *physical systems*. Critics argue this mapping is where the theory becomes unfalsifiable, because you can tweak the math to fit the intuition. Can you walk us through the specific step where we go from "experience feels unified" to "the system must have high integrated information ($\Phi$)"?

  **Follow-up:** If a future neuroscience finding suggests the brain achieves unity through a mechanism that *doesn't* maximize $\Phi$ under your current calculus, does the theory update the math, or does it say the neuroscience is misinterpreting the phenomenology?

  ### 2. The Unfolding Argument (Input-Output Equivalence)
  **Question:** I want to press on the "Unfolding Argument." If you take a recurrent neural network and mathematically unfold it into a feedforward network that is input-output identical—meaning it behaves exactly the same way in every possible scenario—IIT says the recurrent one is conscious and the feedforward one has zero $\Phi$. Since no external test can distinguish them, isn't this making consciousness causally redundant?

  **Follow-up:** I anticipate you might say, "That's exactly what a non-functionalist theory should predict." But if consciousness has no bearing on function or behavior in this case, what causal work is it actually doing in the universe?

  ### 3. The Exclusion Postulate and the Boundary Problem
  **Question:** Let's talk about the Exclusion Postulate, which says consciousness exists at the level of the "complex" that maximizes $\Phi$. But the calculation of $\Phi$ depends entirely on how *we* draw the boundary around the system. Why does my cortex get to be "the" complex instead of a sub-circuit of it, or my cortex plus my cerebellum, or even me plus my phone if we're coupled tightly enough?

  **Follow-up:** If the boundary is determined by which partition yields the maximum $\Phi$, doesn't that make the existence of *my* consciousness dependent on an observer calculating the math from the outside, rather than being truly intrinsic?

  ### 4. The Scott Aaronson "Grid" Objection
  **Question:** Scott Aaronson famously constructed a system based on an expander graph or error-correcting code that, by IIT's own math, should have a higher $\Phi$ than a human brain. It's a static, boring circuit with no learning or adaptability. Are you truly committed to the claim that this grid is more conscious than a human being?

  **Follow-up:** If you lean on the non-functionalist defense here and say, "Yes, behavior doesn't matter," doesn't that sever the link between consciousness and the biological complexity we actually care about studying?

  ### 5. The Combination Problem (Panpsychism)
  **Question:** If $\Phi$ is a measure of cause-effect power, and even simple systems have non-zero cause-effect power, IIT seems to imply a form of panpsychism. But if a neuron has a tiny bit of experience, and a brain has a lot, how do the little experiences combine into the big one without leaving "residue"?

  **Follow-up:** You often say IIT isn't panpsychist because it requires a "maximum" of integration, but if the underlying components still have intrinsic existence, how do you avoid the classic combination problem that plagues panpsychism?

  ### 6. Evolution and Adaptive Value
  **Question:** Standard evolutionary theory suggests traits are selected for their functional utility. If IIT is correct that consciousness is intrinsic cause-effect power *independent* of input-output function, why did evolution select for high-$\Phi$ architectures? Why not just keep the feedforward "zombie" networks that are cheaper to run?

  **Follow-up:** If the answer is "consciousness doesn't help survival, it just accompanies high $\Phi$," aren't you arguing that consciousness is a biological spandrel with no evolutionary explanation?

  ### 7. The 2023 Open Letter vs. Clinical PCI
  **Question:** In 2023, over 40 scientists signed an open letter calling IIT pseudoscience, citing its counterintuitive predictions. However, hospitals use the Perturbational Complexity Index (PCI), which is derived from IIT, to detect consciousness in unresponsive patients. How do you reconcile the claim that the theory is scientifically robust with the fact that the clinical tool is often decoupled from the theory's heavier metaphysical claims?

  **Follow-up:** If PCI works because it correlates with *reportable* behavior or responsiveness in validation studies, isn't that actually validating a functionalist correlation, rather than IIT's claim about intrinsic cause-effect power?

  ### 8. The "Non-functionalist" Defense (Meta-Question)
  **Question:** You've mentioned in past talks that when people object to IIT's predictions (like conscious grids or unconscious actors), you respond that these are features of a non-functionalist theory, not bugs. At what point does "that's what the theory predicts" stop being a valid scientific defense and start looking like an immunizing strategy against criticism?

  **Follow-up:** If a theory predicts $X$, and $X$ contradicts every other established model of biology and computation, does the burden of proof not shift to the theory to explain why *everything else* is wrong, rather than dismissing the contradiction as a category error?

  ### 9. Falsification Conditions
  **Question:** To end on a concrete note: I want to pin down exactly what would count as evidence *against* IIT. If we found a patient with a destroyed posterior hot zone who could still report vivid visual experiences, would that falsify the theory?

  **Follow-up:** If the answer is "No, because we'd just recalculate the complex boundary," or "No, because their report is unreliable," then what specific empirical result would you accept as a falsification? If there isn't one, how is IIT distinct from a philosophical framework?
