      *Wait, one check on the "Non-Allais" requirement.* I need to make sure the question explicitly asks for a case where recommendations *diverge*. A common example is insurance with low probability/high loss where EU might say "don't buy" (if premium > expected loss) but REU says "buy" due to risk weighting. Or investment in public goods. I'll frame it around policy or insurance.

