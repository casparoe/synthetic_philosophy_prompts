      *Middle:* The weight of the work, the philosophical diversity, the need for sustainability.
      *End:* The purpose of the retreat.

      *Refining the "Divide":* "Some of us view the prevention of suffering as the overriding imperative of our time. Others view it as a critical component of a broader longtermist agenda." -> This captures the NU vs CU dynamic without using the labels that might trigger defensiveness.

      *Refining the "Burnout":* "For those who have been carrying this for years... we see you."

      *Refining the "Hope":* Not "hope that it will be easy," but "confidence in our capacity to think clearly."

      *Okay, ready to generate.*

  8.  **Final Word Count Check:**
      *   Draft looks to be around 700 words. Perfect for 5 minutes with pauses.

