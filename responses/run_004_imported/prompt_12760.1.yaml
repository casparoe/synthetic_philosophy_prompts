answer: |-
  Good morning. Thank you for being here.

  It is rare that we get to occupy the same room to talk about this specific work. Usually, our conversations happen in threads, in papers, or in the quiet corners of larger conferences. So, I want to start by acknowledging the weight of simply gathering here.

  We are here to talk about s-risks. To be plain: we are here to discuss the possibility of astronomical suffering in the far future. We are talking about outcomes that are, by any reasonable metric, horrific. I am not going to stand here and soften that language. If we cannot look directly at the magnitude of what we are trying to prevent, we cannot hope to prevent it. The stakes are high enough that they demand our full attention, and they demand honesty.

  That honesty extends to the room itself. I know that we do not all occupy the same philosophical ground. For some of you, the prevention of suffering is the lexical priority of your ethics—the overriding imperative that trumps all other considerations. For others, s-risk reduction is a critical tail within a broader longtermist framework, one grim possibility among many that demand our stewardship.

  I am not going to try to resolve that tension this morning. In fact, I think we should acknowledge it openly. But I also want to suggest that this divergence is not a weakness; it is a source of robustness. When we stress-test strategies against different ethical frameworks, we find interventions that are good *no matter* which map turns out to be right. We are united not by identical axioms, but by a shared conviction that suffering matters immensely, and that we have a responsibility to reduce it where we can.

  I also want to speak to the human cost of this work. I know that for some in this room, this is not a new interest. It is a decade-long commitment. Carrying the weight of these scenarios for that long takes a toll. Burnout is not a personal failure; it is a rational response to confronting problems of this scale without immediate feedback loops.

  To the veterans here: thank you. Your persistence has built the foundation we are standing on. To those newer to the field: your earnestness is vital, but please learn from the veterans not just about the theory, but about sustainability. We are playing a long game. We cannot do this work if we consume ourselves in the process. Taking care of your mental health, finding joy outside of this work, and supporting each other is not a distraction from the mission. It is instrumental to it. A burnt-out team prevents less suffering than a healthy one.

  So, what is the goal for these next two days?

  It is not to solve s-risk entirely. It is not to convince each other to change our foundational ethics. The goal is clarity. We are here to sharpen our models, to identify concrete bottlenecks, and to leave with a clearer sense of what *action* looks like. Despair is not a strategy. Anxiety is not a plan. But clear thinking, coordinated action, and a supportive community are.

  We have the privilege of working on one of the most important problems imaginable. That is a heavy burden, but it is also a privilege. Let's use this time to make sure that when we leave this room, we are not just heavier with knowledge, but lighter with possibility.

  Thank you. Let's get to work.
