      *   *Premise 2: Health.* In *Regimen of Health*, he warns against overconsumption of meat, especially old/hard meat. He favors lighter diets for intellectual clarity.
      *   *Premise 3: Historical Contextualism.* If sacrifice was adapted to the *historical* context of idolatry, could dietary laws be adapted to the *historical* context of industrial farming?
      *   *Premise 4: The Goal.* The goal is worship and knowledge of God. If meat-eating impedes this (via cruelty or health), it's suspect.

