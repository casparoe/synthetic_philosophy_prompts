answer: |-
  This is one of the sharpest cutting edges in contemporary philosophy of religion and comparative logic. You have correctly identified the fault lines: on one side, the **Formalists/Dialetheists** (Priest, Garfield, occasionally Routley) who treat the *MMK* as a logical treatise requiring a revision of classical logic; on the other, the **Prāsaṅgika/Classicalists** (Tillemans, Siderits, Huntington) who treat the *MMK* as a therapeutic soteriology that uses classical logic to dismantle metaphysics.

  Here is the technical unpacking of the disagreement, the specific textual moves they hang their hats on, and the pivotal role of the Two Truths.

  ---

  ### 1. The Core Logical Dispute: The Status of the Fourth Horn

  The *catuskoti* (tetralemma) presents four options regarding a predicate $P$ applied to a subject $S$ (e.g., "The Tathagata exists after death"):
  1.  $P$ (Exists)
  2.  $\neg P$ (Does not exist)
  3.  $P \land \neg P$ (Both)
  4.  $\neg (P \lor \neg P)$ (Neither)

  In classical logic, these four exhaust the logical space. If you deny all four, you are logically silent or incoherent.

  #### The Dialetheist Reading (Priest/Garfield)
  **The Claim:** Nagarjuna affirms contradictions at the limit of thought.
  **The Technical Move:** Priest and Garfield argue that when Nagarjuna negates all four horns, he is not simply remaining silent. He is pointing to a reality (*sunyata* / emptiness) that cannot be captured by classical bivalence.
  *   **The Contradiction:** Take MMK 25.19: *"There is not the slightest difference between samsara and nirvana."* Conventionally, Samsara is bondage and Nirvana is liberation. To say they are identical is a contradiction ($A \land \neg A$).
  *   **Paraconsistency:** In classical logic, a single true contradiction entails *everything* (the principle of *Ex Falso Quodlibet* or "explosion"). If Nagarjuna were a classical logician, admitting one true contradiction would make his whole system trivial. Priest argues Nagarjuna is implicitly using a **paraconsistent logic** (like Logic of Paradox, LP), where contradictions can be true without entailing everything.
  *   **Why?** Because emptiness implies that concepts lack intrinsic nature (*svabhava*). If concepts lack intrinsic boundaries, the logical boundaries between $A$ and $\neg A$ blur. The "Ultimate" is the recognition that the distinction itself is false, which manifests logically as a true contradiction.

  #### The Classical/Prāsaṅgika Reading (Tillemans/Siderits)
  **The Claim:** Nagarjuna uses *reductio ad absurdum* to show opponents' views are incoherent, without asserting a counter-thesis.
  **The Technical Move:** This side relies heavily on the distinction between two types of negation in Sanskrit logic:
  1.  **Paryudāsa (Implicative Negation):** "John is a non-Brahmin." (Denies Brahmin, implies he belongs to another caste).
  2.  **Prasajya (Non-Implicative Negation):** "It is not the case that John is a Brahmin." (Denies the proposition without implying an alternative).

  Tillemans argues Nagarjuna uses *prasajya* negation exclusively. When he denies the four horns, he is not asserting "Neither" as a fourth positive position. He is rejecting the **presuppositions** of the question.
  *   **The Category Error:** Asking "Does the Tathagata exist after death?" presupposes the Tathagata has *svabhava* (intrinsic existence). Since Nagarjuna argues nothing has *svabhava*, the question is like asking, "Is the King of France bald?" You deny all options not because reality is contradictory, but because the subject term fails to refer.
  *   **Logic:** Classical Logic (LNC holds). No true contradictions exist. The appearance of contradiction arises only if you reify emptiness into a "thing."

  ---

  ### 2. Specific Textual Hang-Ups

  Each side anchors their logic in different texts or verses.

  **Priest/Garfield anchor on *MMK* Chapter 25 (Nirvana):**
  They focus on verses that equate opposites. If Samsara = Nirvana, and Samsara $\neq$ Nirvana (by definition), we have $A = B$ and $A \neq B$. For Garfield, this isn't poetic; it's ontological. The ultimate nature of reality *is* the collapse of distinctions, which logic registers as contradiction. They lean on the idea that language is inherently dualistic, so speaking the Truth (non-dual) inevitably produces contradictions.

  **Tillemans/Siderits anchor on the *Vigrahavyāvartanī* (The Dispeller of Disputes):**
  This is Nagarjuna's auto-commentary where opponents accuse him of self-refutation (i.e., "If all statements are empty, your statement is empty too"). Nagarjuna replies: **"I have no thesis (*pratijña*)."**
  *   **Siderits' Argument:** If Nagarjuna has no thesis, he isn't asserting contradictions. He is acting like a doctor administering medicine. The medicine (arguments) cures the disease (views), but the medicine itself isn't the goal. To treat his negations as assertions of dialetheism is to reify his arguments, which is exactly what he warns against.
  *   **Tillemans' Argument:** Tillemans, a trained logician, analyzes the Sanskrit grammar. He argues the fourth horn is often a meta-linguistic rejection of the framework, not a logical value. He utilizes **Many-Valued Logic** or **Speech Act Theory** rather than Paraconsistency. The negation dissolves the question, it doesn't answer it with "True Contradiction."

  ---

  ### 3. The Two Truths: Generator or Dissolver?

  This is the pivot point you asked about. The Two Truths doctrine (*samvrti-satya* / conventional truth vs. *paramartha-satya* / ultimate truth) functions differently in each model.

  #### In the Classical Reading (Dissolver)
  For Tillemans and Siderits, the Two Truths is a **firewall** that protects the Law of Non-Contradiction.
  *   **Mechanism:** Contradictions only arise if you mix the levels.
      *   *Conventionally:* Samsara $\neq$ Nirvana. (LNC holds).
      *   *Ultimately:* Neither exists intrinsically. (LNC holds, because there are no subjects to predicate).
  *   **Function:** The Two Truths dissolves the contradiction by showing that the conflicting predicates apply to different statuses of existence. If you keep the levels distinct, Nagarjuna is a classical logician. The "contradiction" is merely an error of category.

  #### In the Dialetheist Reading (Generator/Revealer)
  For Priest and Garfield, the Two Truths is itself **empty**, and its collapse is what reveals the dialetheic nature of reality.
  *   **Mechanism:** Garfield argues (in *The Fundamental Wisdom of the Middle Way*) that the Two Truths are not two separate ontological realms. They are two perspectives on the *same* reality.
  *   **Function:** Because the Ultimate is just the emptiness of the Conventional, you cannot step outside language to speak the Ultimate. You must speak the Ultimate *in* conventional language. Since conventional language is dualistic and the Ultimate is not, speaking the Ultimate *necessarily* generates contradictions.
  *   **Result:** The Two Truths doesn't dissolve the contradiction; it explains *why* the contradiction is unavoidable and true. The contradiction is the signal that you have hit the limit of conceptual thought.

  ---

  ### 4. The Technical Crux: Semantics vs. Pragmatics

  If you need to summarize the disagreement for your piece, it comes down to this:

  **1. The Semantics of Negation:**
  *   **Priest/Garfield:** Negation is **semantic**. When Nagarjuna says "Not," he is describing the world. If the world is empty, the description involves contradictions.
  *   **Tillemans/Siderits:** Negation is **pragmatic**. When Nagarjuna says "Not," he is performing an action (debating, curing). He is not describing the world; he is dismantling a view *of* the world.

  **2. The Status of the "Ultimate":**
  *   **Priest/Garfield:** The Ultimate is an **ineffable object** that strains language to the breaking point (true contradictions).
  *   **Tillemans/Siderits:** The Ultimate is **the absence of reification**. It is not an object. Therefore, logic (which governs objects/concepts) simply doesn't apply, rather than being violated.

  **3. The "Explosion" Problem:**
  *   **Priest:** We must adopt paraconsistent logic to prevent Nagarjuna's system from exploding into triviality (proving everything).
  *   **Tillemans:** We don't need paraconsistent logic because Nagarjuna never asserts the contradiction in the first place. He only shows that *if* you assume intrinsic nature, *then* you get contradictions. He accepts the *reductio*, he doesn't inhabit the conclusion.

  ### Summary for Your Piece
  The dispute isn't just about ancient text; it's about whether logic is normative for reality or instrumental for liberation.
  *   **Priest/Garfield** say: Reality is contradictory; logic must bend to fit reality. The Tetralemma is a **metaphysical claim**.
  *   **Tillemans/Siderits** say: Logic is fine; our attachment to views is the problem. The Tetralemma is a **therapeutic technique**.

  The Two Truths is the lever: for the Classicalists, it separates the domains to save logic. For the Dialetheists, the identity of the two domains breaks logic to save the phenomenon of enlightenment.
