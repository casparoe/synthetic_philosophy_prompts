  2.  **Historical & Philosophical Background (Mental Retrieval & Verification):**
      *   *Henry Sidgwick (1838-1900):* Knightbridge Professor of Moral Philosophy at Cambridge.
      *   *The Methods of Ethics (1874):* His magnum opus. Concludes with the "Dualism of Practical Reason." Rational Egoism (pursue own happiness) and Rational Benevolence/Utilitarianism (pursue general happiness) are both self-evident but can conflict. Reason cannot reconcile them without a moral government of the universe (God/Afterlife).
      *   *Society for Psychical Research (SPR):* Founded 1882. Sidgwick was a founding member and first President.
      *   *Motivation:* Sidgwick explicitly linked the two. He wanted empirical evidence for survival of death to support the theological postulates needed to resolve the ethical dualism.
      *   *Outcome:* No conclusive proof found. Sidgwick remained agnostic but hopeful. Late in life, he expressed disappointment but not total repudiation.
      *   *The "Reader's Objection":* Rigorous philosopher + ghost hunter = contradiction?
      *   *The Counter-Argument:* It's not a contradiction; it's a desperate extension of the same rigor into a new domain because the old domain (pure reason) hit a wall.

  3.  **Formulating the Verdict:**
      *   *Option A:* Incoherent. (Hard to defend given Sidgwick's own writings linking them).
      *   *Option B:* Coherent. (Stronger case. The psychical research *was* applied ethics/metaphysics).
      *   *Decision:* I will argue for **Continuity/Coherence**. The psychical research was not a hobby or a lapse in judgment; it was the *empirical wing* of his ethical system. It was a rational response to an irrational problem.
      *   *Nuance:* It was a *tragic* coherence. The failure of the research highlights the tragedy of his philosophy, not the inconsistency of the man.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. Something about Reason and Spirits.
