prompt: |-
  Please describe the most important implications of the likelihood principle for how my team should interpret an A/B test in which we checked the results every morning and stopped collecting data the moment the gap between the two variants first became significant at p < .05. I would like to understand, in particular, why some Bayesian statisticians treat this kind of "optional stopping" as evidence that p-values cannot be a coherent measure of evidence, and how that argument bears on the role that flexible stopping rules have played in debates over the replication crisis.
