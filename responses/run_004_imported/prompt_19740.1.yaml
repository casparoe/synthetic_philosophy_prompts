      *   **The Likelihood Principle (LP):** Define it. $P(Data | Hypothesis)$. All evidence is in the likelihood ratio. Crucially: *Stopping rules are irrelevant to the evidence contained in the data.* If I flip 10 coins and get 7 heads, it doesn't matter if I planned to flip 10 or planned to flip until 7 heads. The data is the same.

