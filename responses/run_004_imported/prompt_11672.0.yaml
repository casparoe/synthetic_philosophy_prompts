answer: |-
  **MEMORANDUM**

  **TO:** HOA Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Voting Method for Spring Roof Deck Renovation Bid

  **Context**
  Following the complications with last month's contractor selection, there is understandable disagreement on how to proceed for the Spring Roof Deck vote. Half the board prefers returning to simple plurality (one vote per person), while half prefers retaining a ranked system. A central objection raised is that "all voting systems can be gamed," citing Arrow's Impossibility Theorem as justification for sticking with the status quo or abandoning ranked methods entirely.

  This memo clarifies the relevant theory, addresses the strategic voting concern directly, and offers a concrete recommendation for the Spring vote.

  **1. Clarifying the Theory: Arrow vs. Gibbard-Satterthwaite**
  It is important we cite the correct economic principles when deciding policy.

  *   **Arrow's Impossibility Theorem** is often cited in these discussions, but it does not apply to our specific problem. Arrow deals with converting individual ranked preferences into a *community-wide ranking* of all options. It proves no system can perfectly aggregate rankings while satisfying specific fairness criteria. It assumes voters vote honestly.
  *   **The Gibbard-Satterthwaite Theorem** is the relevant standard here. It addresses *selecting a single winner* (like a contractor bid). It proves that if there are three or more options, any deterministic voting system is susceptible to **tactical voting** (voters misrepresenting preferences to influence the outcome).

  **The Treasurer is technically correct that tactical voting is possible under Gibbard-Satterthwaite.** However, the theorem states that manipulation is *possible*, not that all systems are *equally vulnerable* or that manipulation is *easy to execute successfully.*

  **2. Addressing the "Why Bother?" Objection**
  The argument that "since gaming is unavoidable, we shouldn't try to prevent it" is a fatalistic reading of the theorem. In security, we know no lock is unpickable; we still use locks to raise the cost of entry. Similarly, in voting, our goal is not mathematical perfection, but **incentive compatibility**.

  We want a system where the safest strategy for a voter is to vote honestly.
  *   **Plurality** encourages "lesser-of-two-evil" voting (fear of wasting a vote).
  *   **Ranked Choice (RCV)** encourages "burial" strategies (ranking a strong competitor last, as happened last month).
  *   **Approval Voting** (recommended below) significantly reduces the benefit of lying.

  **3. Recommendation: Approval Voting**
  For the Spring Roof Deck renovation bid, I recommend we adopt **Approval Voting** rather than returning to Plurality or retaining standard RCV.

  **How it works:** Each board member may vote for ("approve") as many contractors as they find acceptable. The contractor with the most approval votes wins.

  **Why this solves our specific problem:**
  1.  **Neutralizes "Burial":** In RCV, you bury a rival by ranking them last. In Approval, you simply don't check their box. Crucially, you can approve *both* your favorite and a strong compromise without hurting your favorite's chances. This removes the incentive to strategically sink a viable bid.
  2.  **Simplicity:** It is as easy to count as Plurality, addressing the concerns of those who find RCV too complex.
  3.  **Consensus:** It tends to elect the candidate with the broadest support rather than the most polarizing one, which is ideal for contractor relationships we must maintain long-term.

  **Conclusion**
  Gibbard-Satterthwaite proves we cannot eliminate strategic voting entirely. However, we can choose a system that makes honesty the dominant strategy. Approval Voting offers the simplicity the plurality proponents want with the nuance the ranked proponents need, while specifically mitigating the "burial" tactic that compromised our last vote.

  I move we adopt Approval Voting for the Spring selection process.

  ***

  **Attachments:**
  *   *One-page explainer on Approval Voting ballot design.*
