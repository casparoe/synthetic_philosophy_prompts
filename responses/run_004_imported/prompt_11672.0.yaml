prompt: |-
  I'm on the board of my buildings HOA, and last month we ran a ranked-choice vote between three contractor bids that went sideways: our treasurer later admitted he'd ranked the second-cheapest bid dead last, not his actual least favorite, just to stop it beating his favorite once votes got redistributed. Now half the building wants plain plurality back, half wants a "smarter" ranked system, and the treasurer's line at every meeting since has been "every voting system can be gamed, Arrow already proved it, so why bother." I looked into it and I'm now pretty sure the theorem that actually applies here is Gibbard-Satterthwaite (if I'm even spelling that right), not Arrow's, even tho everyone keeps treating them like the same result. We've got another three-way vote coming up in spring (roof deck renovation) and I need to circulate a short memo before then -- can you draft it so it gets straight what G-S actually says versus what Arrow's theorem says, lands on one concrete recommendation for that vote, and takes the treasurer's "it's unavoidable so why bother" objection seriously instead of just waving it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** HOA Board Member.
      *   **Context:** Recent ranked-choice voting (RCV) fiasco. Treasurer strategically voted (buried a candidate) to manipulate the outcome.
      *   **Conflict:** Split board (Plurality vs. "Smarter" Ranked). Treasurer argues "All systems are gameable (Arrow), so why bother?"
      *   **User's Insight:** Correctly identifies that Gibbard-Satterthwaite (G-S) is the relevant theorem for strategic voting, not Arrow's Impossibility Theorem (which is about ranking social preferences based on individual preferences).
      *   **Goal:** Draft a short memo for the board.
      *   **Requirements:**
          1.  Clarify G-S vs. Arrow.
          2.  Address the Treasurer's objection seriously (don't just dismiss it).
          3.  Make one concrete recommendation for the upcoming spring vote (roof deck).
          4.  Tone: Professional, informative, persuasive, not overly academic but accurate.

  2.  **Deconstruct the Theorems (Mental Check):**
      *   **Arrow's Impossibility Theorem:** Deals with *social welfare functions*. It says you can't convert individual ranked preferences into a community-wide ranking that satisfies a set of fairness criteria (non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) simultaneously. It's about *aggregate rankings*, not necessarily picking a single winner, and it assumes voters vote honestly.
      *   **Gibbard-Satterthwaite Theorem:** Deals with *social choice functions* (picking a single winner). It says if there are 3+ options, any deterministic voting system is either dictatorial or susceptible to tactical/strategic voting.
      *   **Relevance:** The Treasurer's behavior was *tactical voting* (lying about preferences to change the outcome). This is exactly what G-S covers. Arrow is often misused in this context.
      *   **The "Why Bother" Objection:** G-S says manipulation is *possible*, not that it's *easy* or *equally likely* in all systems. Some systems are more resistant or make manipulation riskier. Also, norms matter.

  3.  **Determine the Recommendation:**
      *   *Option A: Plurality.* Simple, but susceptible to "spoiler effect" and vote-splitting. Encourages lesser-of-two-evilism.
      *   *Option B: RCV (Instant Runoff).* The current system. Vulnerable to burial strategies (as seen), but generally better at finding consensus.
      *   *Option C: Approval Voting.* Voters approve/disapprove. Harder to game strategically (usually best to vote honestly), simple to count.
      *   *Option D: Score/Range Voting.* Similar to Approval but more nuance.
      *   *Decision:* Since the board is split between Plurality and "Smarter Ranked," and the user wants to address the "gaming" issue, **Approval Voting** is often the strongest middle ground. It reduces the incentive to bury candidates (you can like both) and is less complex than RCV. *However*, switching systems mid-stream might be contentious.
      *   *Alternative Decision:* Stick with RCV but add safeguards (e.g., ballot education, transparency).
      *   *Better Decision for an HOA:* **Approval Voting** is usually the easiest "upgrade" that mitigates the specific "burial" strategy the Treasurer used. In RCV, you bury by ranking last. In Approval, burying a decent option hurts you if they beat the worst option.
      *   *Wait, let's look at the constraint:* "Half want plurality, half want smarter ranked."
      *   *Strategy:* Acknowledge G-S is right (gaming is possible), but argue that *some* systems make gaming harder or riskier. Recommendation: **Approval Voting**. It bridges the gap. It's simpler than RCV (appeals to plurality fans) but captures more preference data (appeals to ranked fans) and reduces the incentive for the specific manipulation that occurred.
      *   *Actually, for an HOA memo:* Changing the bylaws/voting method might require a vote itself. The immediate need is the *spring vote*. If the bylaws mandate RCV, we stick with RCV but fix the process. If the bylaws allow flexibility, Approval is good.
      *   *Safest/Most Actionable Recommendation:* Stick with **RCV but with transparent ballot disclosure** OR switch to **Approval**. Let's go with **Approval Voting** as the concrete recommendation because it directly addresses the "burial" tactic (you can't rank someone last if you just check a box, and checking a box for a moderate is usually safe). It neutralizes the Treasurer's specific trick.
      *   *Refinement:* Actually, suggesting a system change might be too heavy for a memo *before* a vote if the rules are set. Let's assume the Board has discretion. I will recommend **Approval Voting** as the specific fix because it makes the Treasurer's specific strategy (burying a candidate) irrational.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the tension. Validate the Treasurer's point (yes, gaming is possible) but correct the theory.
      *   **The Theory Bit (The "Meat"):**
          *   Arrow = Ranking communities (not relevant to picking one winner).
          *   Gibbard-Satterthwaite = Picking a winner + Strategic Voting.
          *   Key distinction: G-S says manipulation is *possible*, not that all systems are *equally* vulnerable.
      *   **Addressing the Objection:** "If gaming is unavoidable, why bother?" Answer: Because we want a system where honest voting is the *safest* strategy, even if not perfect. We want to raise the cost of cheating.
      *   **Recommendation:** Approval Voting.
          *   Why? You can vote for your favorite *and* the acceptable compromise.
          *   How it stops the Treasurer's trick: Burying a moderate doesn't help if you can also approve them without hurting your favorite.
      *   **Closing:** Call to action.

  5.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Keep the math light. Focus on incentives.
      *   *Treasurer Check:* Don't name and shame, but address the argument. "Strategic voting" instead of "Treasurer lied."
      *   *Spelling:* Gibbard-Satterthwaite.
      *   *Constraint:* "Short memo." Keep it under 2 pages equivalent.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to say Approval is *immune* to strategy (G-S says nothing is). Say it makes honest voting a *dominant strategy* in most practical cases, or at least reduces the benefit of lying.
      *   *Correction on Arrow:* Be precise. Arrow is about ordinal rankings to social ordering. G-S is about ordinal rankings to a single winner.
      *   *Recommendation:* I need to be careful. If the HOA bylaws say "RCV," I can't just switch to Approval. I should frame it as "For the Spring Vote, I propose we use..." assuming the Board has the authority to set the method for contractor bids (which is usually operational, not a bylaw change). I will proceed with the assumption the Board decides the voting method for bids.

  7.  **Final Output Generation:** (Matches the provided good response).
      *   Subject Line: Clear and urgent.
      *   Structure: Context, Theoretical Clarification, Addressing the Objection, Recommendation.
      *   Tone: Collaborative but firm on the facts.

  *(Self-Correction Note)*: Wait, I should ensure I don't alienate the "Plurality" half. Approval is often seen as a simplification of Plurality (vote for 1 or more). It should appeal to them.

