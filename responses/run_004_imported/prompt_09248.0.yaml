answer: |-
  **Setting:** *A cramped hotel conference room, late afternoon. The air smells of stale projector heat and roasted beans. Elena (defending Knobe's constitutive view) stirs a cappuccino. David (defending Machery's trade-off view) leans back in a folding chair, nursing a black coffee.*

  **David:** Nice talk, Elena. But you're treating a cognitive bug as a feature. You say the asymmetry proves morality is *constitutive* of intentionality. I'm telling you it's just a heuristic for tracking trade-offs. The chairman accepts a cost to get profit. That's the engine. Morality is just the paint.

  **Elena:** If the engine runs on "cost," David, you have to explain what fuels the cost. In your non-moral vignettes, you replace "harming the environment" with something like "wasting processing power." But "waste" is already a negative evaluation. You haven't eliminated normativity; you've just secularized it.

  **David:** It's not normative in the moral sense. It's pragmatic. If I have to expend extra energy to achieve X, I intend X. If Y happens as a free byproduct, I don't intend Y. It's purely about resource allocation. The brain tracks sacrifice. No sacrifice, no intention.

  **Elena:** Then why does the magnitude of the sacrifice not correlate with the intentionality judgment? If I tell you the chairman saved the company millions but *barely* nicked the environment, subjects still say he intentionally harmed it. If it were about resource cost, a negligible cost should yield a negligible intentionality attribution. But it doesn't. The binary moral valence overrides the scalar cost.

  **David:** Because the threshold for "cost" is binary in the folk concept. Did you accept it or not? But let's pivot to your weak flank. You claim morality constitutes the concept of *intentional action*. Fine. But the Knobe Effect replicates for "decided to" and "wanted to." The chairman "decided" to harm, but didn't "decide" to help. Where is the cost-benefit structure in *deciding*? You don't pay a resource cost to form a decision.

  **Elena:** Because "deciding" isn't an isolated module. It's part of the same folk-psychological web. If moral evaluation determines whether we attribute the *action* to the agent's will, it naturally flows upstream to the mental states that constitute that will. We don't say he "wanted" the harm because of a trade-off; we say it because we hold him accountable for it. Accountability is moral, not pragmatic.

  **David:** Accountability is social. And social coordination requires tracking who signed up for what. If you sign up for a package deal—profit plus side effect—you own the whole package. That's not morality; that's contract logic. My subjects reproduce the asymmetry with a vignette about a mathematical proof. The mathematician knows a step will make the proof ugly but proceeds. They say he "intentionally" made it ugly. Ugliness isn't moral.

  **Elena:** Isn't it? In the context of a proof, "ugly" means *inferior*. It violates a norm of elegance. You keep swapping "moral badness" for "normative violation," but you refuse to admit that norms *are* the domain of morality. If the concept requires a violation of a standard to trigger the asymmetry, you've conceded the point. The only reason the "ugly proof" works is that it borrows the normative structure of right and wrong.

  **David:** That's a definitional sleight of hand. If I say "I value efficiency," and you violate efficiency, that's not a moral sin. It's a functional failure. My point is that the cognitive mechanism doesn't care *why* it's a cost. It just registers: Agent accepted negative value V to secure positive value P. Therefore, V is intentional. Your view requires the brain to check a "moral" box. Mine just checks a "negative value" box.

  **Elena:** But why is the box checked so asymmetrically? If it's just negative value, then a massive *positive* side effect should trigger a symmetrical "intentional help" judgment if the agent knowingly accepted the *benefit*. But they don't. They say it was unintentional help even when the benefit is huge. Your cost-benefit model predicts symmetry. High benefit should equal high intentionality. The data shows morality breaks the scale.

  **David:** Because of loss aversion. Prospect theory. We weight losses heavier than gains. Accepting a harm is a loss; accepting a help is a gain. The cognitive weight of the loss triggers the attribution. The gain doesn't. It's not that we blame the chairman; it's that our risk-assessment circuitry is louder than our reward circuitry.

  **Elena:** So now we're doing evolutionary psychology? Look, let's go back to "wanting." If I ask, "Did he want to harm the environment?" subjects say yes. "Did he want to help?" No. There is no loss aversion in *desire*. I can want a gain without fearing a loss. If the asymmetry persists there, your trade-off model collapses. You can't "trade off" a desire.

  **David:** You infer desire from commitment. If I commit to a course of action knowing it brings harm, I demonstrate a willingness that looks like desire. If I commit knowing it brings help, I demonstrate indifference. It's an inference to the best explanation of the agent's priorities.

  **Elena:** An inference based on *what* standard? If the standard were purely preference satisfaction, the chairman satisfies his preference for profit in both cases. The only thing changing is the moral valence of the side effect. You're saying the brain treats "harm" as a cost and "help" as... what? A nullity?

  **David:** A nullity regarding intention. Help is a bonus. Bonuses don't require intent. Costs require authorization.

  **Elena:** "Authorization." There it is. You need a normative concept to explain the authorization. You can't describe "authorization" in purely physicalist or functionalist terms without referencing a rule or a norm. If the mechanism relies on norms, and the asymmetry tracks *moral* norms specifically—even in your so-called non-moral cases which rely on aesthetic or pragmatic norms—then the distinction between "moral" and "normative" is doing no work for you.

  **David:** It does work, because I can generate the effect with arbitrary norms. If I tell you the rule of the game is "move the red piece," and you move the blue piece to win, knowing it violates the rule, you intentionally violated it. If the rule is "you may move the blue piece," and you do, you didn't intentionally follow the rule; you just won. It's about rule-violation versus rule-consistency.

  **Elena:** But why does rule-violation trigger intentionality and rule-consistency doesn't? Because violation implies *agency* in a way consistency doesn't. We only scrutinize the will when things go wrong. That scrutiny is moral scrutiny. You're describing the *symptoms* of moral judgment—the focus on violations—and calling it a trade-off heuristic.

  **David:** I'm describing the *mechanism*. You're describing the *output*. The mechanism is: Did the agent incorporate this factor into their decision matrix as a constraint they were willing to breach? If yes, it's intentional. If the factor was just background noise that happened to be positive, it's not in the matrix.

  **Elena:** But the "matrix" isn't neutral. The subjects put the harm in the matrix *because* it's blameworthy. If you run the case with a neutral side effect—say, the policy changes the shade of the carpet by one percent—nobody says he intentionally changed the carpet. The effect disappears without moral or quasi-moral weight.

  **David:** Because changing the carpet isn't a cost. It's irrelevant.

  **Elena:** Irrelevant according to *whose* standards? The chairman says it's irrelevant. The subjects say it matters if it's bad. That's the point. The subjects are overriding the agent's stated indifference based on a moral standard. Your model says the subjects are tracking the agent's costs. My model says the subjects are imposing their own moral costs on the agent.

  **David:** And if I told you those "moral costs" are just evolved social heuristics for detecting free-riders? Then I'm right about the architecture, even if you're right about the phenomenology.

  **Elena:** Then we agree the architecture is normative. You just want to call it "pragmatic" to save naturalism. But if the concept of "intentional" cannot be applied without first making a moral judgment, then philosophy can't analyze action without analyzing value.

  **David:** And if I'm right, you can analyze the value separately from the action. The action attribution is just a shadow of the cost-calculation.

  **Elena:** *Sips coffee.* A shadow cast by what light?

  **David:** *Smiles.* That's the next panel.
