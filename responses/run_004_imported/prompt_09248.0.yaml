          *   Machery: It's about trade-offs/costs, not morality. Non-moral vignettes reproduce the effect.
          *   Counter 1 (vs. Machery): Does "cost" secretly smuggle in evaluative content?
          *   Counter 2 (vs. Knobe): Can the moral view explain the asymmetry for concepts like "deciding" and "wanting" which lack clear cost-benefit structures?
      *   **Constraint:** Both philosophers must be equally sharp and responsive.

  2.  **Character Conception:**
      *   **Knobe-Defender (let's call her "Elena"):** Focuses on folk psychology, conceptual competence, the deep integration of normativity and cognition.
