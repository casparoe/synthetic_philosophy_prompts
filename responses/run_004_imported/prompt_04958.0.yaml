prompt: |-
  My manager Priya is retiring after 22 years in industry (15 of them at my company) and I somehow got roped into giving the toast at her leaving do next month. This is slightly terrifying because the guest list is split down the middle: half are her old stats PhD cohort who she still has a group chat with, and the other half is our current eng org, who mostly just know her as the director who will not let anything ship without an A/B test first.

  Priya has this line she says in basically every meeting where someone wants to skip measuring something: "information can never hurt you, that's literally a theorem." I poked around a bit and I think what she's actually referencing is some result from decision theory -- I've seen it called Good's theorem -- that says a rational Bayesian should always want more free information before making a decision, since in expectation it can only make your choice better or leave it the same. Which is a great mantra for bullying engineers into running more experiments, except I've also been on her team long enough to suspect that's not the whole story, and that there's more interesting fine print she conveniently skips over whenever she's making us delay a launch for "one more week of data."

  I want the whole toast to be built around this one thing: her mantra, why its basically true, and why the real theorem is messier and more interesting than the bumper-sticker version she uses on us. Could you write it for me? I'd love the central bit/joke to hinge on some genuinely real exception or subtlety in the actual theorem -- not just the obvious "gathering data costs time and money" objection, everyone on the team has already made that joke to her face -- something a bit meatier that her old academic friends would actually recognize and smile at, while still landing for people on my team who think "Bayesian" is a coffee roast. Roughly five minutes, warm more than roasty, and please don't put anything in her mouth about the theorem that isn't actually true, because I promise you she will fact-check her own retirement speech in real time.
