answer: |-
  # The Ungrounded Counterfactual: A Verdict on Molinism's Fatal Flaw

  You went down the William Lane Craig rabbit hole, and you found the trapdoor: Molinism. It is, without question, the most sophisticated attempt to square divine sovereignty with libertarian free will. It posits that God possesses "Middle Knowledge"—knowledge of what any possible free creature *would* do in any possible circumstance (Counterfactuals of Creaturely Freedom, or CCFs). This knowledge is logically prior to God's decree to create, allowing Him to actualize a world where free creatures consistently choose the good without Him determining their choices.

  It is elegant. It is intellectually seductive. And it is almost certainly metaphysically incoherent.

  You asked for a verdict, not a diplomatic summary. You want to know if the Grounding Objection kills Molinism. To answer that, we have to strip away the theological politeness and look at the metaphysics. Here is the case for the prosecution, the defense, and the final judgment.

  ### The Prosecution: The Grounding Objection
  The Grounding Objection, championed by Robert Adams and William Hasker, is not an epistemological claim (i.e., "God can't figure out the answer"). It is an ontological claim (i.e., "There is no answer to be known").

  The argument rests on the **Truthmaker Principle**: For any contingent true proposition, there must be some existing state of affairs or entity that makes it true. Truth does not float free; it is anchored in reality.

  Consider the CCF: *"If Peter were in circumstance C, he would freely deny Christ."*
  For Molinism to work, this proposition must be:
  1.  **True** (not just probable).
  2.  **Contingent** (Peter could have done otherwise).
  3.  **Logically Prior** to Peter's existence and God's creative decree.

  The Grounding Objection asks: **What makes this true?**

  *   **Is it God?** No. If God determines the truth of the counterfactual, Peter isn't free. The truth must be independent of God's will.
  *   **Is it Peter?** No. Peter does not exist yet. Non-existent entities cannot ground truths about actual properties or actions.
  *   **Is it Peter's Essence (Haecceity)?** This is the Plantinga/Craig fallback. Perhaps the truth is grounded in the abstract "thisness" of Peter. But if Peter's essence *necessitates* that he denies Christ in C, then Peter is not libertarian-free; he is determined by his own nature. If his essence *doesn't* necessitate it, then the essence doesn't ground the specific truth value.

  Adams puts it brutally: If the action is truly free, there is no fact of the matter about what the agent *would* do until the agent actually exists and chooses. To claim there is a pre-existing truth value is to treat freedom as a kind of hidden determinism. The Molinist wants the security of a determined future (for God's knowledge) with the moral cover of libertarian freedom (for human responsibility). The Grounding Objection asserts you cannot have both. A truth about a non-existent free action is a truth without a truthmaker.

  ### The Defense: The Molinist Response
  The Molinist defense, articulated by Alfred Freddoso, Thomas Flint, and Craig, generally takes two lines of attack.

  **1. Reject Truthmaker Maximalism**
  Freddoso argues that the Truthmaker Principle is not universally binding. We accept many truths without demanding robust ontological grounds. For example, negative truths ("There are no unicorns") or general truths ("All electrons have charge"). Why demand a specific truthmaker for CCFs? Freddoso suggests that CCFs are *brute* contingent truths. They are true simply because the conditional relationship holds, even if the antecedent is false. God knows them because His omniscience entails knowing all truths, and if they are true, He knows them. The demand for a "ground" is a category error applied to counterfactuals.

  **2. The Conceptualist Move**
  Craig and others sometimes lean on the idea that these truths are grounded in God's knowledge itself, not as an act of will, but as a feature of His omniscience. God knows His own power and the logical range of possibility. However, this is risky; if the truth is grounded in God, it edges closer to determinism. The stronger Molinist move is to say that the truth is grounded in the **possible world** itself. In the possible world where Peter is in C, Peter denies Christ. Since God knows all possible worlds exhaustively, He knows the truth value of the CCF.

  **3. The "Logical Priority" Shield**
  Molinists insist that "logical priority" is not "temporal priority." We aren't saying Peter existed *before* creation and made a choice. We are saying the *truth value* exists in the logical structure of reality. Just as $2+2=4$ is true regardless of whether calculators exist, "Peter would do X" is true regardless of whether Peter exists, provided Peter is a coherent possible being.

  ### The Verdict
  Here is the landing you asked for.

  **The Grounding Objection Wins.**

  Molinism is metaphysically unstable. It survives only by adopting ad-hoc restrictions on Truthmaker Theory that its proponents would likely reject in any other context. Here is why the Molinist defense fails to clear the bar.

  **1. The "Brute Truth" Dodge is Special Pleading**
  The Molinist response relies heavily on rejecting Truthmaker Maximalism. They argue that CCFs are just brute, contingent truths. The problem is that this move is isolated to saving Molinism. In almost every other area of analytic metaphysics, contingent truths about specific individuals require the existence of those individuals (or their causal powers) to be grounded.
  If I say, "If this specific coin were flipped, it would land heads," and the coin doesn't exist, you would rightly say that statement has no truth value yet. It is indeterminate. The Molinist says, "No, for *human agents*, it is determinate, but we can't tell you what grounds it." This is not a solution; it is an assertion. To save Middle Knowledge, you must accept that there are contingent truths about non-existent entities that have no ontological anchor. This creates a "realm of truth" that floats above the "realm of being," which is metaphysically extravagant.

  **2. The Dilemma of Essence**
  The Molinist often retreats to "Peter's Essence" to ground the truth. But this collapses the distinction between Molinism and Determinism.
  *   **Horn A:** If Peter's essence *includes* the property "denies Christ in C," then Peter cannot do otherwise in C without ceasing to be Peter. His freedom is compatible with determinism (compatibilism), not libertarian freedom. Molinism claims to preserve libertarian freedom, so this horn fails.
  *   **Horn B:** If Peter's essence *does not include* that property, then the essence does not ground the truth of the CCF. We are back to square one: nothing grounds the truth.
  Molinism tries to walk between these horns, claiming the essence grounds the truth *without* necessitating the action. But "grounding without necessitating" is obscure. If the essence makes the proposition true, in what sense was the alternative possible? If the alternative was possible, the proposition wasn't *true* prior to the choice.

  **3. The Explanatory Power Collapse**
  The entire point of Molinism is to *explain* how God providentially orders the world without violating freedom. It is sold as a solution to a problem. However, if the CCFs are brute, ungrounded truths, Molinism loses its explanatory power. It essentially says: "God controls the world by knowing a set of mysterious, ungrounded facts about what you would do."
  But if those facts are ungrounded, they are effectively arbitrary. Why is it true that Peter denies Christ rather than affirms Him? The Molinist must say, "It just is." But if it "just is," then Peter's freedom is illusory in the grand scheme. The trajectory of his life is fixed by these brute facts prior to his existence. This is functionally indistinguishable from theological determinism, but with more metaphysical baggage.

  ### The Qualified Conclusion
  Molinism is only viable if you are willing to accept **Truthmaker Anti-Realism** specifically for counterfactuals of freedom, while maintaining it for everything else. You must accept that there is a sector of reality where truth is disconnected from being.

  Most analytic philosophers, including many theists (like Open Theists and simple foreknowledge proponents), find this cost too high. It violates the principle of parsimony and introduces a "logical ghost realm" of facts that govern creation without existing in it.

  **The Final Ruling:**
  The Grounding Objection succeeds. It demonstrates that Molinism requires a metaphysical category—contingent truths about non-existent free agents without truthmakers—that is incoherent within a robust realist ontology.
  *   If you are a **Truthmaker Maximalist** (truth requires being), Molinism is false.
  *   If you are a **Truthmaker Skeptic**, Molinism is *possible*, but it gains no advantage over Open Theism (which admits God takes risks) other than psychological comfort for those who want absolute divine control.

  William Lane Craig's favorite move is a brilliant piece of philosophical engineering, but like a bridge built on a foundation of air, it cannot bear the weight placed upon it. The counterfactuals of freedom are not waiting to be known; they are waiting to be made. Until the creature acts, there is nothing there for even God to know.

  **Winner: The Grounding Objection.**
