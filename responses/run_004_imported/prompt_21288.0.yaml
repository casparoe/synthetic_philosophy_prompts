answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late evening. The espresso machine is hissing. ELENA (a philosopher of mind and action) and DAVID (a philosopher of science and biology) are surrounded by open notebooks.*

  **David:** So, the escalator. You're still stuck on the escalator?

  **Elena:** I'm stuck on the *argument*. Marcus kept waving Brian Skyrms at me like a magic wand. "It's just replicator dynamics, Elena! Blind variation and selection!" But that feels like it misses the point of what a convention *is*.

  **David:** Does it? Look, if we model the escalator as a coordination game, there are two equilibria: everyone stands left, or everyone stands right. Once the population settles on one, the fitness payoff for deviating is negative—you get shouted at, or you block traffic. The dynamic stabilizes. Why do we need anything more?

  **Elena:** Because stability isn't normativity. If I stand on the left in London, I'm not just statistically anomalous, like a green swan. I'm *violating* something. People look at me with expectation. They think I *ought* to move. Skyrms explains why the herd moves that way, but Lewis explains why I feel bound to move with them.

  **David:** But that "feeling of being bound" might just be a heuristic. A cognitive shortcut for "if you don't move, you'll get bumped." Lewis demands Common Knowledge. He wants me to believe that you believe that I believe that we both prefer to coordinate. That's cognitively insane. Do you really run that infinite recursion in your head before you step onto the Tube?

  **Elena:** No, and Lewis knows that. That's the "basis for common knowledge" move. It's not a psychological checklist. It's a logical structure of justification. The precedent—the fact that we did it this way yesterday—acts as a public signal. It indicates to both of us that we should do it again. The Common Knowledge isn't a mental marathon; it's the *state* we are in once that signal is processed. It makes the expectation self-reinforcing *rationally*, not just causally.

  **David:** See, that's where I think you're decorating the cake without adding ingredients. You say "precedent acts as a public signal." I say "history creates a path dependence." In Skyrms's signaling games, agents don't need to know *why* a signal means "danger." They just learn that sending Signal A gets a reward. Over time, the correlation stabilizes. The "meaning" emerges from the dynamics. Lewis wants to start with rational agents who *agree* on meaning. Skyrms shows you can get meaning without the agreement.

  **Elena:** You can get *correlation* without agreement. You can't get *convention* without it. Here's the test: Imagine a world where everyone stands on the right on escalators, but they all think everyone else is doing it by accident. They think, "I stand right to avoid bumps," but they assume *you* stand right because you like the view. There's regularity. There's even a coordination equilibrium. But is there a convention?

  **David:** Intuitively, no. But Skyrms would say that's an unstable state. If I realize you're standing right just for the view, I might worry you'll move if the view changes. The stability *requires* that we expect each other to conform to the pattern. The evolutionary dynamic *produces* those expectations as a byproduct of learning. You don't need to posit Common Knowledge as a primitive; it's a downstream effect of successful coordination.

  **Elena:** But that confuses *etiology* with *constitution*. You're telling me how the convention *got here*. I'm telling you what it *is* right now. Lewis is offering a constitutive account. For something to be a convention *now*, it must be common knowledge that it is a solution to a coordination problem. If the evolutionary history got there, but the common knowledge isn't present—if we aren't mutually aware of the expectation—then we're just in a habit, not a convention.

  **David:** Okay, let's grant that distinction for a second. Etiology vs. Constitution. Even then, Lewis's reliance on "salience" to solve the initial coordination problem looks suspiciously like the path dependence I'm talking about. Lewis says we pick the focal point because it's salient. Why is it salient? Usually because of some historical accident or cultural prominence. That's just path dependence with a fancier name.

  **Elena:** Not quite. Salience is about *recognition*. It's about the rational agent seeing the solution *as* a solution. Path dependence is blind; it's the ball rolling into the nearest valley. Salience implies the agents can see the other valley and agree *this* one is better. Lewis needs the rationality to explain why we don't just get stuck in suboptimal equilibria.

  **David:** But Skyrms shows that learning agents *can* get stuck in suboptimal equilibria! And sometimes conventions *are* suboptimal. QWERTY keyboards. Driving on the left vs. right. It doesn't matter which one is "better," only that we pick one. The evolutionary model handles the arbitrariness better than Lewis. Lewis struggles to explain why we pick *this* salient point over *that* one without smuggling in history.

  **Elena:** Fair. Lewis admits history matters for the *first* time. But once established, the Common Knowledge is what sustains it. And here is where your evolutionary model hits the wall for me: Normative Force. In your model, if I deviate, I just get a lower payoff. I lose efficiency. In Lewis's model, if I deviate, I violate a mutual expectation. I let you down. There is a difference between "I shouldn't eat that berry because it's poisonous" and "I shouldn't cut in line because it's unfair." Conventions feel closer to the latter.

  **David:** I think that's a projection. You feel you "let me down" because, evolutionarily speaking, social exclusion was poisonous. The "ought" is just a internalized prediction of social sanction. If the replicator dynamics are strong enough, the agent models the sanction as a moral cost. But it's still grounded in the payoff structure.

  **Elena:** That reduces all social norms to prudence. If I'm in a room with you, and we both know we'll never see each other again, and there are no sanctions... if we have a convention, I still feel I should follow it. Why? Because we have a shared understanding. The Common Knowledge creates a reason for action that exists even without the threat of punishment. It's a rational obligation, not just a prudential one.

  **David:** But is that true? If there are truly no sanctions and no future interaction, do conventions hold? If we're both stranded on a desert island and we've established a "convention" of who gathers coconuts, and I know I can steal yours without penalty... Lewis says I should still cooperate because of our mutual expectations. I say I'll steal the coconuts. The "obligation" evaporates without the dynamic that sustains it.

  **Elena:** *Laughs.* You're a cynic, David. But let's step back. Are we actually rivals? Or are we answering different questions? You're asking: "How do patterns of behavior stabilize in a population without a central planner?" I'm asking: "What is the nature of the reasoning of an agent participating in a stabilized pattern?"

  **David:** That sounds like a peace treaty. "Etiology is mine, Constitution is yours." But I worry they bleed into each other. If the evolutionary process produces agents who *think* they have Common Knowledge, but they don't really... does it matter? If the behavior is identical, is the philosophical distinction doing any work?

  **Elena:** It matters for the *breakdown*. When conventions fracture, how do we fix them? If it's just dynamics, we wait for a new equilibrium to emerge through trial and error. If it's Lewisian, we can *talk* our way out. We can re-establish Common Knowledge through agreement. We can say, "Look, we both know this isn't working, let's switch." The Lewisian account explains the power of explicit agreement to shift conventions instantly, without waiting for selection.

  **David:** That's a strong point. Signaling games with cheap talk. Skyrms does model that. But even then, the talk only works because there's a history of the talk being reliable. The evolutionary shadow is always there.

  **Elena:** So maybe the synthesis is this: Evolutionary dynamics explain the *emergence* and the *persistence* of the behavioral regularity. But Common Knowledge explains the *intentionality* and the *normative grip* once the agents are sophisticated enough to represent each other's minds.

  **David:** I can live with that. But I'd add a caveat: The Common Knowledge might be a "useful fiction." The agents *act as if* they have Common Knowledge because that's the stable strategy, even if they can't actually verify the infinite recursion.

  **Elena:** I'll accept that, provided you admit that the "fiction" is what makes us human rather than ants. Ants have conventions—paths to food, division of labor. They have the dynamics. They don't have the Common Knowledge. We have both.

  **David:** Deal. But on the escalator?

  **Elena:** London. Stand right.

  **David:** Obviously. Though technically, if we run the replicator dynamics on pedestrian flow efficiency, standing still on both sides is actually optimal.

  **Elena:** Don't you start. That's a coordination problem for another day.

  **David:** *Closes notebook.* One infinite regress at a time.
