answer: |-
  You have read that correctly, and your confusion is completely warranted—it is one of the most counterintuitive parts of Augustine's ethics for modern readers.

  To answer your question directly: **Augustine is saying these are still genuine sins, and a truly virtuous person must not tell them, even if it means allowing a bad thing (like theft or unjust death) to happen.**

  He is not categorizing them as "forgivable-but-not-admirable." He is categorizing them as **intrinsically evil acts** that damage the soul of the liar, regardless of the beneficial outcome.

  Here is the breakdown of the logic so you can ground your character's argument without contradicting the text.

  ### 1. The Hierarchy is About Punishment, Not Permission
  When Augustine lists these eight types from worst to least bad, he is ranking them by **severity of sin**, not by **licensure to commit**.
  *   **Type 1** (Religious lie) damns you the most.
  *   **Type 8** (Lie to prevent rape/defilement) damns you the least.
  *   **But Types 1 through 8 are all sins.**

  Think of it like a speed limit. Going 100mph in a school zone is worse than going 40mph in a school zone. But Augustine argues that *any* speed over the limit is a violation of the law, even if you're rushing someone to the hospital. The "good consequence" (saving a life) does not justify the "evil act" (breaking the law of truth).

  ### 2. The Key Phrase: "Taking the Consequences"
  The smoking gun in the passage you found is this line:
  > *"...that by taking the consequences, which are honorably and bravely borne, these kinds also should be eschewed..."*

  This is the crux of your character's argument. Augustine is arguing that when you are faced with a choice between **Lying** (to save money/life/reputation) and **Telling the Truth** (and suffering the loss), the virtuous person chooses to suffer the loss.

  *   **The Sister's Argument:** Likely utilitarian. "Dad loses custody if you tell the truth. That hurts everyone. Lie to help him."
  *   **The Lawyer's Argument:** Deontological/Augustinian. "If I lie, I corrupt my own soul and violate the order of truth. Dad losing custody is a temporal suffering I must bear bravely. Corrupting the truth is an eternal spiritual injury."

  ### 3. Why This Fits a "Lapsed" Catholic Lawyer
  This is gold for your character development. You might wonder, *why would a lapsed Catholic care?* Here are three ways to play it that stay true to the text:

  *   **The Moral Hangover:** He may have left the Church, but the "software" of his morality is still Catholic. He can't shake the idea that certain acts are intrinsically wrong, regardless of the outcome. He's lapsed in *faith*, but not in *conscience*.
  *   **The Lawyer's Parallel:** As a defense lawyer, he likely sees "The Truth" as a secular god. If lawyers start lying to help clients (even for good reasons), the whole legal system collapses. Augustine's theology maps perfectly onto Legal Ethics. He can quote Augustine as a way of saying, "The System requires truth, just like God does."
  *   **The Shield:** He might be using Augustine to protect himself from his sister's anger. If he says, "I don't want to hurt Dad," she can argue with him. If he says, "Augustine says this is a capital offense against reality," it shuts down the argument. It's a way of saying, "Don't blame me, blame the Saint."

  ### 4. How to Handle the Specific Scenario (Custody/Money)
  In your text, **Type 6** is about protecting money from unjust theft. **Type 7** is about protecting a person from unjust judgment/death.
  *   **Your Scenario:** A custody battle. This falls under Type 7 (protecting a person from unjust loss/harm) or potentially Type 3 (profiting one, hurting another).
  *   **Augustine's Verdict:** Even if the dad is innocent and the custody loss is "unjust," the son cannot lie to prevent it. He must tell the truth and let the chips fall where they may.

  **Crucial Distinction for your Character:**
  Augustine distinguishes between **lying** and **remaining silent**.
  *   If the sister asks, "Will you lie on the stand?" He says, "No."
  *   If the sister asks, "Will you tell them Dad's secret?" Augustine actually allows for *hiding* the truth (silence) in some contexts, but never *speaking* a falsehood.
  *   *However*, since your prompt says he is justifying why he **won't lie**, the Augustine quote is perfect. He doesn't necessarily have to betray his dad; he just refuses to fabricate a falsehood.

  ### Summary for your Scene
  Your character is not contradicting himself. He is holding a **rigorous absolutist position**.

  *   **Sister:** "But nobody gets hurt if you lie! It helps Dad!"
  *   **Lawyer:** "Augustine says that's the trap. Types 6 and 7 look harmless. They look like they help. But he says a 'brave and faithful' man accepts the suffering of the truth rather than the comfort of the lie. I'd rather Dad lose custody than I lose my integrity."

  The tension comes from the fact that this sounds incredibly cold to the sister (and the reader), which makes for great drama. He is prioritizing the metaphysical order of Truth over the physical well-being of his family. That is exactly what Augustine argues, and it makes your lawyer a compelling, difficult, and intellectually consistent character.
