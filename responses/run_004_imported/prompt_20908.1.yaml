answer: |-
  The grape sat on the hardwood floor, a single purple sphere rolling slowly until it hit the leg of the dining table. It stopped. The silence that followed was heavier than the screaming had been.

  Sarah held Leo, his small body limp against her chest, waiting for the paramedics to stop working. They didn't stop for a long time, but eventually, the rhythm broke. The lead paramedic looked up, his eyes finding Sarah's. He didn't need to speak. The absence of breath in the room said everything.

  In the days that followed, the narrative hardened like plaster. It was the mother's tragedy. The story was simple: Sarah had cut the grape. Sarah had placed it on the highchair tray. Sarah had turned her back to grab a napkin. In that specific slice of time, Sarah's non-action was the cause. It was weighted with duty, thick with the expectation of care. She accepted the weight. It fit her shoulders.

  But then came the dinner party, a week later, meant to support her. The same dining room. The same table. Sarah stood by the window, watching the guests arrive. Mark was there, her brother. He had been sitting directly across from Leo that day. He had seen the choking. He had frozen.

  Sarah watched Mark hug a guest. He was capable. Strong hands. He knew the maneuver; he'd taught it to Sarah years ago. If Mark had stood up, Leo would be alive. The counterfactual was clean, sterile, and true. *If Mark had moved, Leo lives.*

  She looked at Jane, her best friend, who had been pouring wine when the silence fell. Jane had dropped the bottle. She hadn't rushed the table. *If Jane had moved, Leo lives.*

  Sarah felt a strange vertigo, a loosening of the ground beneath her. If the cause was simply the absence of an action that would have prevented the death, then the list of causes was not a line; it was a web.

  She stepped out onto the front porch to breathe. The street was quiet. A mailman walked past, delivering letters to the boxes down the way. He did not come to the house. He did not knock. He did not save Leo.

  *If the mailman had come, Leo lives.*

  A car drove by, the driver listening to the radio, eyes on the road. She did not stop. She did not run inside. She did not save Leo.

  *If the driver had stopped, Leo lives.*

  Sarah gripped the railing. The logic was seductive and terrifying. Every person who did not intervene was linked to Leo's death by the same thin, unbroken thread of negative dependence. The world was filled with people not saving her son. The air was thick with saviors who didn't arrive.

  But when she looked back through the window at Mark, the blame felt different. It stuck to him like burrs. It didn't stick to the mailman. Why? The physics of their inaction was identical. Neither moved. Neither acted. The outcome was the same.

  Inside, Mark was laughing at something a guest said. He looked guilty, though no one accused him. He knew he was part of the equation, but he knew he wasn't the variable that mattered. Society had drawn a circle around Sarah and Mark, declaring their omissions significant and the mailman's omission irrelevant. They had used words like *responsibility* and *proximity* to prune the garden of causes, cutting away the infinite weeds of possibility until only the manageable stalks of blame remained.

  Sarah walked back inside. The guests turned to her, their faces soft with pity. They saw a mother who failed. They did not see the universe of non-actors standing behind her, a vast army of ghosts defined by what they did not do.

  She looked at the grape stain still faintly visible on the floorboards. It was a marker of a single event, but it pointed to everything that hadn't happened. She wanted to scream that the mailman killed her son. She wanted to scream that the driver killed her son. But she knew the words would sound like madness.

  Instead, she smiled at Mark. He flinched, just slightly. He understood that within the circle of duty, he was safe, but outside of it, he was just another hole in the world. Sarah realized then that causation wasn't about what broke the chain. It was about who was allowed to stand near the break without being called a murderer.

  She picked up the grape from the floor, though it wasn't there anymore, and held it in her closed fist. The room was full of people who hadn't saved him. The world outside was full of millions more. The absence was everywhere, but only one absence had a name.
