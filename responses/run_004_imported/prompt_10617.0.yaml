  So from what I understand, money pump arguments show that if you have intransitive preferences you're guaranteed to get bled dry through a series of trades, no matter what you do -- even if you can see the whole sequence coming, since your own preferences are what force you into each trade one by one. Doesnt that make having intransitive preferences irrational in a full-on logical sense, like believing a contradiction, rather than just a bad habit that occasionally costs you money? Given that, whats the best way to check my own preferences for hidden cycles like that?
