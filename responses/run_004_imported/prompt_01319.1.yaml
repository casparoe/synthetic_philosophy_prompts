answer: |-
  You and your friend have stumbled onto one of the biggest headaches in contemporary epistemology. It's called the **problem of extensional equivalence**. In almost all the standard textbook cases (like DeRose's Bank Cases), the subject's stakes and the attributor's conversational context rise and fall together. When the subject has a lot to lose, the attributor usually knows about it, making error salient for them too.

  To get them to diverge, you have to **decouple the subject's stakes from the attributor's conversational context.** You need a case where the Subject is in a high-stakes situation, but the Attributor is in a low-standards context (specifically, the Attributor is ignorant of the Subject's stakes).

  Here is the **"Ignorant Attributor" Case**.

  ### The Scenario

  **The Subject:** Elena.
  **The Proposition ($p$):** "The train stops at Foxboro Station."
  **The Evidence:** Elena looked at the online schedule this morning. It said the train stops at Foxboro. However, she knows schedules sometimes change due to maintenance, and she did not double-check at the station kiosk.
  **The Subject's Stakes (High):** Elena is a bomb disposal expert transporting a live device. If she gets off at the wrong station, the device will detonate, killing hundreds. For her, mere schedule-checking is not enough; she needs to verify at the kiosk.
  **The Attributor:** Mark.
  **The Attributor's Context (Low):** Mark is Elena's friend. He is at a coffee shop chatting with mutual friends about Elena's travel habits. Mark **does not know** about the bomb. He thinks Elena is just going home for the weekend.
  **The Claim:** Mark says, "Elena knows the train stops at Foxboro."

  ***

  ### The Divergence

  Here is how the two theories evaluate Mark's claim.

  **1. Epistemic Contextualism says: Mark's claim is TRUE.**
  *   **Why:** Contextualism holds that the truth conditions of "knows" are determined by the **attributor's** context (Mark's context), not the subject's.
  *   **The Mechanism:** In Mark's conversational context, the stakes are low. No one is talking about bombs or explosions. The possibility that the schedule changed is not "salient." In this low-standards context, Elena's evidence (checking the website) is sufficient to count as knowledge.
  *   **Verdict:** Relative to Mark's context, the sentence "Elena knows" expresses a true proposition. Mark speaks correctly.

  **2. Pragmatic Encroachment says: Mark's claim is FALSE.**
  *   **Why:** Encroachment holds that whether a subject *actually has knowledge* depends on the **subject's** practical situation (Elena's stakes), regardless of who is talking about her.
  *   **The Mechanism:** Knowledge is not purely epistemic; practical factors encroach on the justification threshold. Because Elena's stakes are life-and-death, the threshold for knowledge is raised. Her current evidence (website check) does not meet this high threshold (she needed to check the kiosk). Therefore, she objectively **does not know**.
  *   **Verdict:** Since Elena does not know, Mark's claim that she does know is false. Mark is mistaken.

  ***

  ### Why this works
  In standard cases, the Attributor knows about the Subject's stakes.
  *   If Mark knew about the bomb, Contextualism would say his standards rise (because the danger is now salient to *him*), and he would agree with Encroachment that she doesn't know.
  *   By keeping Mark ignorant, you force Contextualism to look at **Mark's low standards**, while Encroachment is forced to look at **Elena's high stakes**.

  This creates the split: Contextualism says the *utterance* is true (because the speaker's bar is low), while Encroachment says the *fact* is false (because the subject's bar is high).
