answer: |-
  This is a profound moment in your doctoral journey, and your advisor was right: you have bumped up against the limits of social science models and entered the realm of epistemology. The frustration you feel is the friction of trying to use a tool (evidentiary argument) on a material (foundational certainty) it was never designed to cut.

  To answer your questions directly: Yes, there is a genuine philosophical distinction between disagreeing about a fact and disagreeing about the conditions of evidence. No, ordinary argument has almost no grip on the latter. And yes, there is a principled way to distinguish this from simple unreasonableness, though it offers little comfort for changing the mind in question.

  Here is a breakdown of what is likely happening, drawing on the philosophy your advisor hinted at, and how you might integrate this into both your family dynamics and your dissertation.

  ### 1. The Philosophical Distinction: Propositions vs. Hinges
  The literature you are citing (motivated reasoning, backfire effect) operates under the assumption that beliefs are **propositional**. That is, they are conclusions reached by weighing premises. *Premise A (Report X) + Premise B (Data Y) = Conclusion Z.* If the conclusion is wrong, you adjust the premises.

  Your father-in-law's belief, however, functions as what Ludwig Wittgenstein called a **"hinge proposition"** (in *On Certainty*). Hinge propositions are not conclusions we argue our way to; they are the assumptions upon which our arguing turns. They are the "scaffolding" of our thoughts.
  *   **Example:** "The earth existed before I was born." You don't believe this because you have evidence for it; you believe it because without it, your evidence (history books, geology) would have no meaning.
  *   **Your FIL's Case:** For him, "Regulators are corrupt and engineer outcomes for land deals" is not a hypothesis tested against the dam failure. It is the *context* in which the dam failure is understood.

  When you asked him what would change his mind, his confusion was genuine. Asking someone what evidence would disprove a hinge proposition is like asking a chess player what move would prove the board doesn't exist. It category-errors the nature of the belief. He isn't refusing to weigh evidence; he is operating in a system where your evidence (reports, reviews) is already pre-categorized as "part of the cover-up." In his framework, the existence of exonerating reports *confirms* the conspiracy (because a successful cover-up would produce exonerating reports).

  ### 2. Does Argument Have Grip?
  On hinge propositions, standard argumentation is not just ineffective; it is often counter-productive. This is because challenging a hinge proposition feels to the holder like an attack on their rationality itself.

  If I doubt whether you have hands, I am not engaging in a factual dispute; I am signaling that I do not share a reality with you. When you bring engineering reports to your father-in-law, you are asking him to doubt the hinge that holds his understanding of the local political landscape together. Since he is an engineer, his identity is tied to *seeing reality clearly*. To admit your evidence counts is to admit he has been misreading reality for years. That is not a political concession; it is an existential one.

  Therefore, ordinary argument has no grip because you are speaking different "epistemic languages." You are speaking the language of **verification** (let's test the claim), and he is speaking the language of **recognition** (I recognize the pattern of corruption).

  ### 3. Unreasonableness vs. Structural Divergence
  Is he being unreasonable? In the colloquial sense, perhaps. But in a principled philosophical sense, he may be displaying **epistemic consistency**.

  You noted he changes his mind on other technical questions. This is crucial. It means his cognitive machinery works fine for *puzzles* (problems with solutions within a framework). He treats the dam failure not as a puzzle, but as a **mystery** (a problem that reveals the framework itself).

  There is a concept in sociology (Charles Mills) and philosophy called an **"Epistemic Contract."** We all agree to trust certain institutions (science, courts, engineering boards) to arbitrate truth. Your father-in-law has voided that contract regarding state regulators. He isn't weighing your evidence badly; he has rejected the *authority* of the evidence source.
  *   **The Test:** If he rejects *all* external engineering reports but accepts *internal* data he verifies himself, he is being consistent with a worldview that says "Institutional output is tainted; direct observation is pure." That is a coherent, if isolated, epistemology. It is not necessarily a cognitive deficit.

  ### 4. Routes to Change (or Acceptance)
  If this belief is a hinge proposition, it will not change via data. Hinge propositions usually only shift under two conditions:
  1.  **Worldview Collapse:** A life event so significant that the old scaffolding cannot hold it (e.g., if a regulator he personally trusted and vouched for was caught red-handed in a way that *helped* him, or conversely, if the "land deal" fell through in a way that made the sabotage pointless).
  2.  **Relational Trust:** Sometimes, hinges shift not because the evidence changed, but because the *person* offering the evidence became more central to the believer's world than the institution they distrust.

  **For the Family Dinner:**
  You should likely accept that this topic is permanently off the table for *debate*. This does not mean you accept the truth of the claim, but you accept the *immovability* of it. Continuing to press it treats him as a broken rational agent, which is disrespectful. Instead, treat it as a difference in "form of life" (another Wittgensteinian term). You can say, "We see the history of this differently, and I don't think we'll bridge that gap, but I value our relationship more than I value winning this point."

  **For the Dissertation:**
  This is not a distraction from your work; it is the key to elevating it. Most communication studies dissertations on fact-checking stop at "identity protection" or "partisan motivated reasoning." Your insight pushes further: **Fact-checking fails not only when beliefs are protected by identity, but when beliefs function as epistemic infrastructure.**

  You could argue that interventions fail because they treat "knowledge" as a collection of files to be swapped, when for many contested claims, knowledge is an *operating system*. You cannot patch an operating system with a text file.

  ### Summary
  *   **The Difference:** Yes. You are arguing about a tile in the mosaic; he is arguing about the grout holding the mosaic together.
  *   **The Grip:** Rational argument requires shared axioms. You currently share none on this topic.
  *   **The Diagnosis:** He is not necessarily "unreasonable"; he is operating on a different set of foundational certainties (hinges) regarding institutional trust.
  *   **The Path:** Do not try to convince him. Document the *structure* of his resistance for your dissertation. It illustrates the boundary where "communication" ends and "conversion" begins.

  Your advisor was right to send you to philosophy. You are studying the limits of persuasion. The most honest conclusion of your dissertation might be that there are some beliefs that communication cannot touch, not because the communication is poor, but because the belief is not a product of communication in the first place. It is a product of how the world is perceived.
