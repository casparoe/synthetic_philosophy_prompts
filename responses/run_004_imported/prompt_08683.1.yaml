      *   *The "Embedded Agency" Problem:* It's notoriously hard. MIRI worked on it for years with little public, concrete output. However, the *problems* (distributional shift, self-reference, mesa-optimization) are real and show up in deep learning.

  3.  **Determine the Stance:**
