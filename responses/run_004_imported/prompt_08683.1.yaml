answer: |-
  **MEMORANDUM**

  **TO:** AI Safety Fund Grant Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal [ID-402]: Embedded Agency & Self-Modification

  ### Executive Summary

  I recommend **Funding with Strict Conditions**.

  While I share the empirical camp's concern regarding the low signal-to-noise ratio of past theoretical work on embedded agency, rejecting this proposal entirely creates a strategic blind spot. Purely empirical safety work (interpretability, RLHF, adversarial testing) risks optimizing for local robustness without understanding the global structure of the systems we are building.

  However, to address the valid concern that this research could become "navel-gazing," funding must be contingent on the team translating abstract problems into **testable priors for empirical work** and **concrete failure modes in toy models**. We should not fund pure proof-writing; we must fund the translation of theory into constraints that empirical teams can actually use.

  ### The Strategic Tension

  The committee is split between two valid risk models:
  1.  **Conceptual Risk:** We build AGI using decision theories that are fundamentally incompatible with self-modification or self-modeling. Empirical patches fail because the architecture is searching for rewards in ways we cannot conceptualize.
  2.  **Opportunity Cost:** We spend limited resources on math problems that have yielded no public, actionable insights in 10+ years, while interpretability tools could be deployed on current systems to reduce near-term risk.

  My recommendation attempts to hedge against *both* risks.

  ### Why the Empirical Camp Should Care

  To my colleagues prioritizing interpretability and empirical robustness: I am not arguing that "foundations matter in the long run." I am arguing that **your work currently lacks a target.**

  1.  **Interpretability Needs a Theory of Agency:** We are currently searching neural nets for "goals," "plans," and "deception." But we do not have a formal definition of what these look like in a system that is part of its own environment. Embedded agency research attempts to define what a "goal-directed subsystem" actually *is*. Without this, interpretability is pattern matching without a hypothesis. If this team can produce a formal characterization of a "mesa-optimizer," that is a direct input for your feature visualization tools.
  2.  **The "Tiling" Problem is a Deployment Problem:** The proposal mentions "tiling" (an agent designing a successor). In practice, this looks like automated ML (AutoML) or recursive prompt engineering. If an agent modifies its own weights or code to maximize a metric, do we know the conditions under which the metric stays aligned? This is not philosophy; it is a stability guarantee for automated deployment pipelines.
  3.  **Preventing Dead Ends:** If embedded agency problems are unsolvable in the way MIRI framed them, we need to know *now*, not when we are training GPT-7. A conditional grant acts as a canary. If they cannot produce toy model demonstrations in 12 months, that is valuable negative data that tells empirical teams to stop worrying about structural self-reference and focus on data contamination.

  ### Conditions for Funding

  To ensure this does not become a black box of abstract mathematics, I propose the following four conditions be written into the grant agreement:

  **1. The "Toy Model" Requirement**
  No proofs without environments. Theoretical claims regarding self-trust or grain-of-truth must be demonstrated in a simplified, code-based environment (e.g., a gridworld with self-modifying code or a simplified RL setting). If a concept cannot be simulated in a toy model, it is not yet ready for safety-critical application.
  *   *Metric:* Public release of at least two reproducible environments demonstrating the specific failure mode or solution within the first 12 months.

  **2. The "Interpretability Handoff"**
  The researchers must hold quarterly syncs with an empirical/interpretability team (we can facilitate this). Their goal is to answer: "What specific signature should we look for in a neural net based on your theory?"
  *   *Metric:* A joint whiteboard document or brief report per quarter outlining testable hypotheses for empirical partners.

  **3. Milestone-Based Tranches**
  Funding should be released in 6-month tranches. The second tranche is contingent on a review of the "Toy Model" deliverables. If the work remains purely formal with no connection to computational agents, funding ceases.

  **4. The Sunset Clause**
  The grant is for 1 year initially, with an option to extend for the second year only if the "Interpretability Handoff" yields at least one concrete experimental proposal that an empirical team agrees is worth testing. This prevents indefinite funding of a research program that cannot interface with the rest of the field.

  ### Conclusion

  Funding this proposal without conditions validates the fear that we are paying for abstraction for abstraction's sake. Rejecting it validates the fear that we are ignoring structural risks because they are hard to measure.

  By conditioning the grant on **translation to toy models** and **collaboration with empirical teams**, we turn this into a risk-mitigation experiment. We either get new tools for interpretability, or we get high-confidence evidence that this specific class of problems is not yet tractable. Both outcomes are worth the price of the grant.

  **Recommendation:** Approve Year 1 funding contingent on Conditions 1–4. Review for Year 2 extension based on Milestone 3.
