      *   *Reasoning 4 (Counterfactuals):* Ramsey would likely treat counterfactuals differently. The footnote specifies "both in doubt as to $p$." If $p$ is known false, the "add to stock of knowledge" move changes. It becomes a "contrary to fact" hypothetical. He might see counterfactuals as closer to causal laws (rules of inference) than indicatives.

