answer: |-
  This is a fantastic question, and it cuts right to the heart of why the "Ramsey Test" is so often misappropriated in the literature. If we actually look at Ramsey's wider philosophical commitments—specifically his pragmatism, his deflationism about truth, and his treatment of general propositions in the very same essay—I think the answer is quite sharp.

  Ramsey would have **rejected Stalnaker's truth-conditional semantics** and would have found **Lewis's triviality result** to be a vindication of his own implicit non-propositionalism, aligning him much more closely with the **Adams/Edgington camp**. However, he would likely criticize the later debate for getting too bogged down in metaphysics (possible worlds) rather than staying focused on the psychology of belief and action.

  Here is the argument for why Ramsey is a non-propositionalist *ante litteram*, and why he would treat counterfactuals as a distinct, though related, category.

  ### 1. The Footnote is Epistemic, Not Semantic
  The first thing Ramsey would point out is that the modern literature often misreads the *category* of his claim. The footnote in "General Propositions and Causality" is explicitly about **degrees of belief**, not truth conditions.

  Ramsey writes: *"We can say that they are fixing their degrees of belief in $q$ given $p$."*

  He does not say, "They are determining the truth value of the proposition '$p \to q$'." For Ramsey, probability *just is* partial belief (measured by betting quotients). If the Ramsey Test is a procedure for fixing degrees of belief, then the conditional is the linguistic expression of a conditional belief, not the expression of a belief in a conditional proposition.

  Stalnaker tries to have it both ways: he wants the conditional to be a proposition (to have truth conditions) *and* he wants the probability of that proposition to equal the conditional probability (Stalnaker's Thesis). Ramsey would see this as a category error. If the function of the conditional is to guide belief revision under hypothetical supposition, asking for its "truth condition" is like asking for the "truth condition" of a command or a question. It's to mistake a tool for inference for a picture of reality.

  ### 2. The "General Propositions" Context
  This is the strongest evidence. In the very same paper where the footnote appears, Ramsey argues that **general propositions** (like "All men are mortal" or causal laws) are not genuine propositions in the sense of being truth-functions of atomic facts.

  Ramsey argues that a universal generalization is not a finite conjunction of instances. Instead, he suggests they function as **"rules for judging"** or **"habits of inference."** He writes that they are "variables of hypothetical judgments" which serve as maps for navigating the world.

  Since conditionals are the primary linguistic vehicle for expressing these generalizations and causal laws, Ramsey would consistently apply his analysis of general propositions to conditionals. If a causal law is a rule for inference rather than a fact that makes a sentence true, then the conditional expressing it cannot have standard truth conditions.

  Stalnaker's semantics reifies the conditional into a fact about a "selected possible world." To Ramsey, this would look like the kind of metaphysical bloating he despised. He was a deflationist about truth ("It is true that $p$" says no more than "$p$"). He would likely view the search for a "truth-maker" for a conditional (a specific possible world) as a confusion. For Ramsey, the "truth" of the conditional is exhausted by its utility in guiding action and belief revision.

  ### 3. Lewis's Triviality as Vindication
  When Lewis proved that you cannot have both truth conditions and the equation $P(A \to C) = P(C|A)$ without trivializing probability, Ramsey wouldn't be shocked. He would say, *"Exactly. You are trying to force an inference rule into the box of a fact."*

  Lewis concluded from his triviality results that conditionals are not propositions (or at least, not probabilities of propositions). Ramsey would agree. The triviality result shows that the logic of conditionals does not map onto the logic of truth-functional propositions.

  However, Ramsey would likely critique Lewis's *reasoning* slightly. Lewis assumes a standard Kolmogorov probability space over a set of worlds. Ramsey's probability is subjective and behavioral (betting quotients). Ramsey might argue that the triviality arises because Lewis is trying to formalize a pragmatic norm (assertability) as a semantic relation (truth). The "collapse" isn't a problem with probability; it's a problem with assuming the conditional has a truth value to begin with.

  ### 4. Indicatives vs. Counterfactuals
  This is where your seminar's specific focus matters. The footnote explicitly specifies a case where **"both [parties] are in doubt as to $p$."** This is the domain of the **indicative**.

  Ramsey would likely insist on a **separate treatment for counterfactuals**, but not for the reason Stalnaker and Lewis did (i.e., needing different similarity metrics for possible worlds).

  For Ramsey, the difference lies in the **stock of knowledge**:
  *   **Indicatives:** $p$ is unknown. We add $p$ to our beliefs, adjust for consistency, and check $q$. This is belief revision.
  *   **Counterfactuals:** $p$ is known false. We cannot simply "add $p$" without creating a contradiction. We must engage in a more radical hypothetical reconstruction of our belief system, often relying on causal laws.

  Recall that Ramsey treats causal laws as "inference tickets." A counterfactual like "If the match had been struck, it would have lit" is an expression of a causal law (a rule). Ramsey would argue that counterfactuals are even *less* truth-apt than indicatives because they explicitly rely on these non-truth-apt causal laws.

  He would reject the Stalnaker/Lewis idea that counterfactuals are made true by distant metaphysical entities (possible worlds). Instead, he would say their "validity" comes from the reliability of the causal law (the inference rule) being invoked. If the law is a good rule for action, the counterfactual is assertable. If not, it isn't. There is no "fact of the matter" about a world that doesn't exist.

  ### Conclusion: Ramsey as a Pragmatist
  If Ramsey walked into your seminar today, he would likely tell the Stalnakerians that they are doing metaphysics when they should be doing psychology, and he would tell the Adams/Edgington camp that they are right about the logic but perhaps too timid about the metaphysics.

  Ramsey wouldn't just say conditionals lack truth conditions; he would say **asking for truth conditions is the wrong question.** The question is: *How does this sentence function in the economy of belief and action?*

  *   **On Stalnaker:** He would reject the possible worlds semantics as a reification of a heuristic device.
  *   **On Lewis:** He would accept the triviality result as proof that conditionals aren't propositions.
  *   **On Adams/Edgington:** He would endorse the view that assertability tracks conditional probability, but he would ground it in his betting behavior account of belief, not just linguistic norms.

  Ramsey's footnote wasn't an invitation to build a semantics; it was a description of a cognitive process. The entire modern debate assumes the footnote was a clue about *meaning*. Ramsey would argue it was a clue about *mind*. He would side with the non-propositionalists, not because of technical triviality proofs, but because his entire philosophy was built on the idea that the meaning of a proposition lies in its causal role in guiding action, not in its correspondence to a state of affairs—and conditionals are the ultimate tools for guiding action under uncertainty.
