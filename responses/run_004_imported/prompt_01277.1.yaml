prompt: |-
  so in my philosophy of language seminar (doing a whole unit on indicative vs counterfactual conditionals right now) our professor mentioned something in passing that's been bugging me since. apparently this entire modern literature on conditionals -- Stalnaker's possible worlds semantics, Lewis's triviality result against what people call "Stalnaker's Thesis," the whole Adams/Edgington camp that says indicative conditionals don't even have truth conditions and its really just assertability tracking conditional probability -- all traces back to one footnote by Frank Ramsey in "General Propositions and Causality," where he basically says that if two people are arguing "if p, will q" and are both unsure about p, they add p to their stock of beliefs and see how confident that leaves them in q. Ramsey died in 1930. Stalnaker's paper came out in 1968, Lewis's triviality proof in 1976 -- he never got to see one single bit of the fight his own footnote kicked off.

  me and a couple people from my study group got into it after class about what Ramsey himself would've actually thought of all this, and we couldn't agree, so now I'm curious what you'd say. given what we know about Ramsey's actual wider views -- his subjectivist "degrees of belief as betting quotients" account of probability, his redundancy-ish deflationary theory of truth, and the fact that in that exact same essay he argues general propositions aren't genuinely truth-apt, more like rules you use for making inferences than actual propositions -- which side of the later debate do you think he'd land on? would he have welcomed Stalnaker turning his footnote into a full truth-conditional, possible-worlds semantics, or would he have taken Lewis's triviality result as basically vindicating what he already assumed, that conditionals were never straightforwardly true-or-false to begin with? and since the footnote is explicitly about a case where both people are still unsure whether p is true, do you think his verdict would even carry over to counterfactuals, or would he insist those need totally seperate treatment? don't just summarize the debate for me, I've already got that from lecture -- actually commit to a reading of Ramsey and argue for it.
