      *   *Key Detail:* The GUE match implies *broken time-reversal symmetry*. Nuclear levels (Wigner's original context) are usually GOE (time-reversal invariant). Zeta zeros are GUE. This is a crucial distinction. Wigner originally looked at GOE for nuclei. GUE came later for systems without time-reversal symmetry. This complicates the user's narrative about Wigner's GUE. Wigner is associated with RMT, but specifically GUE for Zeta is a later refinement (Dyson 1962).

