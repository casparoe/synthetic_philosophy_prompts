          *   *Verdict:* It's not a total straw man, but it's slightly imprecise. The directionality (Physics $\to$ Math vs. Math $\to$ Physics) matters less than the *independence* of the motivations. The user's point holds water because the motivations were maximally distinct (nuclear physics vs. analytic number theory), but the selection effect proponent would argue that *any* robust statistical structure will eventually find a home.
