      *   **User:** A PhD student/researcher whose thesis pivoted from lattice gauge theory to Random Matrix Theory (RMT) applied to quantum chaos (Bohigas–Giannoni–Schmit conjecture). They are writing a philosophical/essayistic piece on Wigner's "Unreasonable Effectiveness of Mathematics."
      *   **Topic:** They argue that the Montgomery–Odlyzko connection (Riemann Zeta zeros $\leftrightarrow$ GUE eigenvalues) is a *stronger* counterexample to deflationary explanations (like selection effects) than Wigner's original examples (complex numbers, GR, particle physics).
      *   **Task:** Provide *pushback* (critical feedback), not encouragement. Specifically address three points:
          1.  Is the "selection effect" objection straw-manned in Point 1?
          2.  Does Point 3 (universality/Hilbert–Pólya) concede too much to the deflationary side?
          3.  Is the biographical detail (Wigner invented GUE) substantive or incidental?
          4.  Fact-check the Montgomery–Dyson–Odlyzko history.

  2.  **Deconstruct Point 1 (Selection Effect):**
      *   *User's Claim:* Selection effect works for "math first, physics later" (e.g., Riemannian geometry $\to$ GR) but fails for "physics first, math later" (GUE $\to$ Zeta zeros) because no one was looking for the connection.
      *   *Critique:* Is this a straw man?
