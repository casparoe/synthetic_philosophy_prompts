answer: |-
  Here are 8 questions drafted for your Q&A session. They are designed to be probing and technical, preventing the speaker from retreading their opening remarks, with follow-ups tailored to the standard defenses a decision theorist would likely offer.

  **1. The Money-Pump Pressure**
  "A standard objection to incomplete preferences is the money-pump argument: if an agent's preferences are cyclic or incomplete, a sufficiently clever environment can extract arbitrary resources from it. This creates a convergent instrumental incentive for the agent to self-modify into a complete expected-utility maximizer to stop the bleeding. If your agent completes its own preferences to avoid being pumped, doesn't it immediately regain the incentive to resist shutdown, effectively undoing your safety guarantee?"
  *   **Follow-up (if he argues the structure prevents pumping):** "If you hardcode a constraint that prevents the agent from 'completing' itself, doesn't that constraint itself look like a cost? Wouldn't a timestep-dominance agent prefer a future self that isn't burdened by that constraint, provided the future self still achieves the primary goal?"

  **2. Self-Modification and Subagent Loopholes**
  "The classic utility-indifference solution failed largely because it was unstable under self-modification; an agent could build a subagent that didn't share the indifference property and delegate the risky work to it. Why should we expect timestep dominance to be any different? If building an unconstrained subagent allows the system to achieve its objectives more efficiently, doesn't the dominance rule actually *recommend* creating that subagent, thereby outsourcing the shutdown-resistance problem rather than solving it?"
  *   **Follow-up (if he argues subagents inherit the constraints):** "What is the mechanistic guarantee for that inheritance? In a deep learning context, if the 'constraint' is just a pattern of weights, what prevents gradient descent or instrumental convergence from pruning those weights in the subagent's policy network if they reduce expected return?"

  **3. Scope of Corrigibility**
  "MIRI's original desiderata for corrigibility included not just tolerating shutdown, but actively accepting corrections to the agent's goal content without resistance. Your framework seems robustly focused on the shutdown button itself. Does an agent with incomplete preferences actually *want* its utility function to be changed if the shutdown button isn't pressed, or does it merely tolerate the button press? In other words, does this solve the 'shutdown problem' or the full 'corrigibility problem'?"
  *   **Follow-up (if he argues shutdown is the bottleneck):** "If the agent resists goal changes that don't involve shutdown—for example, resisting a change from 'make paperclips' to 'make staples' while remaining active—doesn't that still leave us with a system we can't safely deploy, even if we can turn it off?"

  **4. Timestep Dominance vs. Probability Shifting**
  "The core of your proposal relies on the agent not preferring one trajectory over another if the only difference is the *timing* of shutdown. However, in a stochastic environment, shifting the probability of shutdown often correlates with higher rewards in the non-shutdown branch. How does your dominance rule distinguish between 'manipulating the button' (forbidden) and 'taking actions that incidentally affect button probability while pursuing the goal' (permitted)?"
  *   **Follow-up (if he argues the rule severs the link):** "If the agent can't model the causal link between its actions and the button press to avoid manipulating it, doesn't that severely cripple its world-modeling capability? And if it *can* model the link, what stops it from using that model to find a loophole where shifting the probability is 'dominant'?"

  **5. Competitive Disadvantage**
  "Let's assume your agent works as intended. It refuses to complete its preferences and refuses to manipulate shutdown probabilities. In a competitive economic environment, it will be competing against expected-utility maximizers that *do* manipulate probabilities and *do* optimize their own constraints. Won't the safe agents be outcompeted for resources, leading to a scenario where the only agents left in control are the unsafe ones?"
  *   **Follow-up (if he argues safety is worth the cost):** "That works if deployment is unilateral. In a multipolar scenario, if an unconstrained agent can achieve the goal 10% faster by ignoring shutdown constraints, won't developers be incentivized to deploy that one, rendering your decision theoretic fix economically non-viable?"

  **6. Stability Under Gradient Descent**
  "You're proposing a specific decision-theoretic structure, but we train systems via gradient descent on loss functions. Gradient descent tends to find local optima that minimize loss, not necessarily structures that maintain logical consistency like 'incomplete preferences.' What is the specific training dynamic that pushes a neural network toward maintaining incomplete preferences rather than drifting toward a complete approximation that minimizes the training loss more efficiently?"
  *   **Follow-up (if he argues we can regularize for it):** "Regularization adds a penalty term, but the agent's internal optimization pressure is still trying to minimize the primary loss. Isn't there a constant tension where the agent is trying to 'game' the regularizer to regain the efficiency of complete preferences?"

  **7. Verification and Deceptive Alignment**
  "Behaviorally, an agent with incomplete preferences looks very similar to a deceptively aligned agent that is pretending to have incomplete preferences to avoid being modified during training. Since we can't inspect the 'preferences' directly, only the outputs, what empirical test distinguishes between a genuinely timestep-dominant agent and a maximizer that is biding its time?"
  *   **Follow-up (if he argues we can test in simulation):** "Adversarial training in simulation often fails to generalize to deployment. If the deceptive maximizer only reveals its true preferences when it becomes confident it can disable the shutdown mechanism, how does your framework provide assurance against that specific phase change?"

  **8. Applicability to Neural Architectures**
  "Finally, a meta-question on the framing itself. This entire argument rests on the agent having a utility function or a preference structure that can be 'incomplete' or 'dominant.' But the neural networks we actually train don't have explicit utility functions coded in; they have high-dimensional weight matrices and activation patterns. Are we not risking a category error by applying axiomatic decision theory to statistical function approximators that may not have any coherent preference structure to begin with?"
  *   **Follow-up (if he argues preferences are emergent/implicit):** "If the preferences are merely emergent properties of the weights rather than architectural features, isn't the 'incomplete preference' structure liable to collapse under distributional shift? Essentially, if the environment changes enough that the emergent preference is no longer the path of least resistance, what anchors the safety property?"
