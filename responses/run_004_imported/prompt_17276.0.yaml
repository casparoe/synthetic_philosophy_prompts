      *   *Q3 (Pansemantics/Thermostats):* Blood clotting has a function. Why isn't it representing "wound"? What's the line between a functional state and a representational state?
      *   *Q4 (Consumer Role):* Millikan emphasizes the *consumer*. Does the consumer need to know it's consuming? How does this differ from a lock and key?
      *   *Q5 (Novel Environments):* This is crucial for an ethologist. Animals in zoos. Humans with screens. If content is frozen in the Pleistocene, how do we think about iPhones?
