          *   Include the Indeterminacy/Disjunction Problem (flies vs. BBs vs. small dark moving things).
          *   Include the "Too Much Representation" problem (blood clotting, thermostats).
          *   Include the "Novel Environments" problem (captivity, screens, sugar).
          *   Flow logically for a live conversation.
          *   Keep follow-ups realistic (not strawmanning).
          *   Tone: Respectful but probing, leveraging the user's ethology background.

  2.  **Deconstruct the Theory (Teleosemantics/Millikan):**
      *   *Core Idea:* Content is determined by Proper Function.
      *   *Proper Function:* What a trait was selected to do in the evolutionary past (history of reproduction).
      *   *Consumer vs. Producer:* Signals have content based on how consumers use them and what producers were selected to indicate.
      *   *Misrepresentation:* Possible because a mechanism can fail to perform its proper function (e.g., snapping at a BB).
      *   *Key Weaknesses:* Swampman (no history), Indeterminacy (what exactly was selected?), Pansemantics (too many things have functions), Novelty (modern environments).

  3.  **Drafting the Questions - Iteration 1 (Mental Outline):**
      1.  Intro/Background (skip, user wants sharp questions).
      2.  Swampman: You say he has no thoughts. Isn't that crazy? Follow-up: If intuitions fail, why trust evolutionary intuitions?
