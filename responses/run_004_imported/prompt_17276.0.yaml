answer: |-
  Here are nine questions designed to leverage your background in ethology while pressing the philosophical weak points of teleosemantics. They are ordered to build a narrative arc: starting with the biological mechanics, moving to the scope of the theory, tackling the "modern world" problem, and ending with the metaphysical heavy lifting (Swampman).

  I have included the **Anticipated Reply** and a **Prepared Follow-up** for the Swampman section, as requested, plus notes on where to lean on your fieldwork experience.

  ### 1. The Disjunction Problem (Indeterminacy)
  "Let's start with the frog. In the literature, the frog's snap is the canonical example of a sign stimulus triggering a fixed action pattern. But in the field, we know selection rarely targets a single variable. In the frog's Environment of Evolutionary Adaptedness (EEA), 'flies,' 'nutritious black specks,' and 'small moving shadows' were co-extensive. They always appeared together. So, what licenses you to say the content is specifically *fly*? Why isn't the content the disjunction *fly-or-BB-pellet-or-shadow*? If it's the disjunction, the frog never misrepresents, and your account of error collapses."

  ### 2. Follow-up on Indeterminacy (The 'Nutrition' Angle)
  *(Use this if she argues that selection pressures can be parsed finely enough to isolate 'fly'.)*
  "But consider the metabolic payoff. The mechanism was reproduced because it delivered protein, not because it nailed *Diptera* specifically. If I train a frog to snap at BBs and it survives on supplemented food, the mechanism still reproduces. If the 'Proper Function' is determined by what kept the mechanism in the game, isn't the content actually just *'potential calories'*? And if so, snapping at a BB isn't a misrepresentation, it's just a failed attempt at a true representation of calories."

  ### 3. The Scope Problem (Blood Clotting & Thermostats)
  "You ground content in 'Proper Function,' defined by historical selection. But plenty of biological states have proper functions without seeming to represent anything. My blood clotting has the proper function of stopping bleeding, but we don't say my blood *believes* I have a wound. Similarly, a thermostat has a derived function of tracking temperature. What is the specific structural difference between a clotting mechanism and a perceptual mechanism that allows one to have content and not the other? Is it just that one is 'internal'?"

  ### 4. The Consumer Condition
  "Millikan places a lot of weight on the 'consumer' of the signal—the mechanism that uses the representation to do its job. In honeybee dances, the consumer is the forager bee. But in the human brain, who is the consumer? If content relies on a downstream mechanism knowing how to use the signal, do we risk an infinite regress? Or does the theory imply that most of our neural states are content-less because they never reach a 'decision' mechanism?"

  ### 5. Evolutionary Mismatch (Novel Environments)
  "This is where my fieldwork background makes me uneasy. We see animals in captivity or shifted climates constantly interacting with stimuli they weren't selected for. Humans are now dealing with screens, refined sugar, and abstract symbols. If content is frozen by ancestral selection history, what is the content of my belief about this 'iPhone'? There were no iPhones in the EEA. Does my brain fail to have content about it? Or does it misrepresent the iPhone as something ancestral, like a 'shiny stone' or 'social face'?"

  ### 6. Follow-up on Mismatch (Systematic Falsehood)
  *(Use this if she suggests we map new objects to old categories, e.g., iPhone = Shiny Stone.)*
  "If we map modern objects onto ancestral categories to get content, aren't we admitting that almost all our modern beliefs are strictly false? I believe I am looking at a 'screen,' but if my content is locked to 'shiny stone,' then I am perpetually mistaken about my environment. That seems to make the theory empirically adequate but pragmatically useless. How do we get *true* beliefs about novel objects if the content conditions are historical?"

  ### 7. The Swampman Challenge
  "Let's move to the hard metaphysical case. Swampman: a molecule-for-molecule duplicate of you, created by lightning, with no evolutionary history. On your view, because he has no selection history, his states have no Proper Function, and therefore he has no thoughts with content. He's a zombie. To many of us, that's a *reductio ad absurdum*. It suggests the theory is defining 'mind' out of existence rather than explaining it. Why should we accept a definition of content that severs the link between current physical structure and mental capacity?"

  ### 8. The "Intuition" Defense (Prepared Follow-up)
  *(She will likely say: "Our intuitions about Swampman are unreliable; history is essential for normativity." Here is your counter.)*
  "I understand the move to discard intuitions. But philosophy of mind is supposed to explain *our* minds. If your theory says a being that behaves exactly like me, speaks exactly like me, and claims to think exactly like me *actually* has no thoughts, haven't you changed the subject? If 'content' is something that can be completely absent in a physically identical duplicate, does 'content' still do any explanatory work in psychology? Or is it just an evolutionary badge of honor with no bearing on current cognitive function?"

  ### 9. The Payoff
  "Finally, stepping back. I came to this from ethology because I wanted to know how a signal gets to be *about* something. Causal theories struggle with error; conceptual role theories struggle with grounding. Teleosemantics promises to solve both. But given the costs we've discussed—frozen content, Swampman zombies, and indeterminacy risks—what is the one phenomenon that *only* teleosemantics can explain? Why is this specific historical baggage worth carrying?"

  ***

  ### Moderator Notes for Flow:

  *   **On Q1 & Q2 (Indeterminacy):** This is the strongest technical objection. If she gets bogged down in the biology here, remind her you're happy to grant the biology but want to know how the *philosophy* resolves the co-extensivity problem.
  *   **On Q3 (Blood/Thermostats):** This is the "Pansemantics" worry. If everything with a function has content, the word "content" loses its meaning. Press her on the *normative* difference.
  *   **On Q7 & Q8 (Swampman):** This is the emotional climax of the interview. Q7 sets the trap; Q8 springs it. If she bites the bullet and says "Yes, Swampman has no thoughts," use the follow-up to ask if the theory is still about *minds* or just about *lineage*.
  *   **Tone:** Keep it collegial. You are a fellow traveler who sees the appeal (solving misrepresentation) but worries about the cost. Your ethology background gives you authority on the selection questions—use that to keep the answers from becoming too abstract.
