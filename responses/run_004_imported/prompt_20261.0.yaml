answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Carol's niece/nephew.

  Thirty-four years is a long time to spend doing anything. But to spend thirty-four years fighting for a river and a forest, knowing you might never sit in the shade of the trees you protected... that is a specific kind of devotion.

  Preparing for tonight, I wanted to find the right words to describe what that devotion actually *does*. And I'll admit, I went down a bit of a rabbit hole. Some of you in the back—the ones with the ethics textbooks on your nightstands—might know where I'm going with this.

  I started reading about a philosophical puzzle called the "nonidentity problem." The gist is this: When we choose conservation over depletion, we change the future so profoundly that the specific people born fifty years from now would never have existed if we'd chosen differently. So, technically, you can't say Carol saved the forest *for* those specific future children. In the timeline where the forest was depleted, those children wouldn't exist at all.

  For a minute, I panicked. I thought, "Oh no. Does this mean I can't stand up here and say she did this for the next generation? Is her legacy philosophically hollow?"

  But then I went back to the river. I thought about walking those trails with Carol when I was ten. The way the light hit the water. The silence that isn't empty, but full.

  And I realized the puzzle gets the value backwards.

  Carol's work wasn't a transaction. It wasn't about ensuring Specific Person A gets Benefit B. It was about the kind of world we inhabit *together*, right now, and the kind of world we deem worthy of continuing.

  The value of conservation isn't that it saves specific people from a worse fate. It's that it refuses to accept a world that is diminished. It says that beauty, and complexity, and old growth have a right to exist, regardless of who is there to count them.

  To my aunt's colleagues: You know this better than anyone. You know the work is often thankless, and the victories are invisible until decades later. You know that you are stewards of a timeline you won't live to see.

  And to my family and the neighbors: You know Carol as the person who always pointed out the hawk, who stopped the car to move a turtle, who believed that the river had a voice.

  The philosophy says she didn't save specific future people. But I say that's too small a way to measure a life. She didn't just save people; she saved the *possibility* of wonder. She ensured that fifty years from now, a child can still stand on that bank and feel small in the presence of something ancient. It doesn't matter which child it is. What matters is that the ancient thing is still there to be witnessed.

  Carol taught me that we don't inherit the earth from our ancestors; we borrow it from our children. Even if we don't know their names, even if their existence depends on the choices we make today. The gift isn't for them specifically. The gift is the act of giving itself. It is an act of faith in a future we won't see, for people we won't meet, because it is the right thing to do.

  So, if I could ask everyone to please raise a glass.

  To Carol. Thank you for choosing the harder path. Thank you for leaving the trees standing. And thank you for teaching us that some things are worth saving, simply because they are beautiful.

  To Carol!
