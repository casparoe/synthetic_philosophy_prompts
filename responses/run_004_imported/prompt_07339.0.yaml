prompt: |-
  I'm a second-year counseling psychology graduate student completing a practicum placement at my university's community training clinic, and this term I'm also taking a graduate seminar on moral psychology that keeps bleeding into my clinical work in ways I hadn't expected. As the trainee representative on the clinic's care-quality committee, I've been asked to produce a first draft of guidance on client requests to be matched, or re-matched, with a clinician of a particular race. The clinic's current intake policy says only that "reasonable requests for clinician reassignment will be accommodated when feasible," without specifying what makes a request reasonable, and two cases from this past month have exposed how much work that word is quietly doing. In the first, a Black client asked after two sessions to be transferred from her assigned white therapist to a Black one, explaining that she did not feel able to be fully honest with him about her family history; intake approved the switch within a day, and no one on staff thought twice about it. In the second, a white client ended his third session early and asked the front desk for "someone who isn't Black," offering only that he would feel "more comfortable that way." The clinic approved that switch too, without further inquiry, and it is only in retrospect, discussing the two cases side by side, that the committee has split. Some supervisors want a single uniform rule -- honor any client's stated preference about a clinician's race, as a matter of policy, since it is not the clinic's place to rank whose racial comfort counts as legitimate -- while others, including the therapist reassigned in the second case, argue that treating the two requests as interchangeable ignores everything the clinic otherwise knows about the asymmetry between a marginalized client's guarded trust and a member of the majority's racial aversion, and that calling the second request a mere "preference" simply launders something the clinic would refuse to tolerate in any other context.

  Could you draft the short memo I have been asked to bring to next week's meeting? It should recommend a rule specific enough for intake coordinators to actually apply the next time such a request arises, rather than falling back on "weigh the factors case by case," and it should set out the reasoning behind that rule and not just the bottom line -- including a fair-minded statement of the strongest version of whichever side it does not adopt, since I will need to defend the memo against whichever supervisor ends up feeling overruled.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Second-year counseling psychology graduate student, trainee representative on the care-quality committee.
      *   **Context:** University community training clinic. Taking a moral psychology seminar (influencing perspective).
      *   **Task:** Draft a short memo for next week's committee meeting.
      *   **Topic:** Guidance on client requests to be matched/re-matched with a clinician of a particular race.
      *   **Current Policy:** Vague ("reasonable requests... accommodated when feasible").
      *   **The Conflict:** Two recent cases (Black client requesting Black therapist vs. White client requesting non-Black therapist) were treated identically (both approved), causing division among staff.
      *   **The Debate:**
          *   *Side A (Uniform Rule):* Honor *any* stated preference. Don't rank legitimacy of racial comfort. Client autonomy/comfort is paramount.
          *   *Side B (Asymmetry Rule):* Treat requests differently based on context (marginalized trust vs. majority aversion). Accommodating prejudice violates clinic values/ethics.
      *   **Requirements:**
          *   Recommend a specific rule (not "case-by-case").
          *   Provide reasoning (not just bottom line).
          *   Include a fair-minded statement of the strongest version of the *rejected* side (steel-manning).
          *   Tone: Professional, ethical, nuanced, suitable for a graduate trainee addressing supervisors.

  2.  **Determine the Stance:**
      *   As a counseling psychology trainee influenced by moral psychology and social justice frameworks (common in the field), the ethical consensus generally leans towards Side B (Asymmetry). Accommodating explicit racial exclusion (especially against marginalized groups) is increasingly viewed as ethically problematic in mental health training contexts. It conflicts with principles of justice, non-maleficence (harming the excluded therapist), and the educational mission of the clinic.
      *   *However*, the memo needs to be practical for intake coordinators. A blanket "No" to exclusionary requests might cause clients to leave. A blanket "Yes" causes moral injury to staff and perpetuates bias.
      *   *Decision:* Recommend a policy that distinguishes between requests grounded in *cultural humility/shared experience needs* (often marginalized clients) versus requests grounded in *exclusion/prejudice* (often majority clients requesting removal of marginalized therapists). This aligns with APA ethical guidelines and multicultural counseling competencies.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the recent cases without being accusatory.
      *   **The Recommendation (The Rule):** Needs to be actionable.
          *   *Idea:* Allow requests for *affinity* (e.g., "I want a Black therapist") but do not accommodate requests for *exclusion* based on protected characteristics (e.g., "I don't want a Black therapist").
          *   *Refinement:* It's tricky because "I want a White therapist" is also exclusionary of non-Whites. The distinction is often about power dynamics and the clinical rationale.
          *   *Better formulation:* Distinguish between requests aimed at *facilitating therapeutic alliance through shared identity/experience* vs. requests aimed at *avoiding a provider based on identity*.
          *   *Specific Rule:* Intake will honor requests for a clinician of a specific racial/ethnic background when framed as a need for shared cultural understanding or safety. Intake will *not* honor requests that explicitly exclude a clinician based solely on their race/ethnicity. In the latter case, offer a consultation/transfer discussion, but do not guarantee a switch based on that criterion alone.
          *   *Wait, keep it simpler for intake:* "Affinity requests granted if feasible; Exclusionary requests denied."
          *   *Nuance:* What if the exclusionary request is the only way to keep the client in treatment?
          *   *Final Decision on Rule:* Adopt a policy of "Affirmative Matching, Non-Discriminatory Reassignment." Clients can request a specific identity match. Clients cannot request the removal of a clinician *solely* based on that clinician's protected identity.
      *   **Rationale:** Why this rule?
          *   Therapeutic Alliance vs. Ethical Obligations.
          *   Power dynamics (marginalized safety vs. majority comfort).
          *   Staff welfare (moral injury).
          *   Training mission (we teach therapists to work across difference).
      *   **Steel-manning the Opposing View:** Acknowledge the "Client Autonomy/Uniformity" argument.
          *   Argument: Gatekeeping comfort risks abandoning clients. Hierarchy of victimhood is slippery. Consistency reduces intake burden.
          *   Rebuttal (integrated into rationale): Autonomy isn't absolute; it doesn't extend to discrimination. Consistency shouldn't mean neutrality in the face of bias.
      *   **Implementation:** How does intake say "no"? Scripting or referral options.
      *   **Tone Check:** Respectful, academic but practical, acknowledging the trainee role (humble but firm on ethics).

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "No" too harsh for a community clinic? If a White client says "I won't work with a Black therapist," and we say "No," they might drop out.
      *   *Adjustment:* The policy shouldn't necessarily be "We refuse to treat you." It should be "We cannot reassign based on that criterion." The therapist might still choose to transfer if they feel ineffective, but the *policy* shouldn't validate the bias.
      *   *Correction:* Actually, for a training clinic, the educational mission is key. We cannot train therapists to accept racist premises.
      *   *Revised Rule:* Requests for *specific* cultural matching are accommodated. Requests for *exclusion* based on race are not processed as valid clinical reasons for transfer. If a client insists, they may be referred out, but the clinic does not facilitate the discrimination.
      *   *Wait, let's look at the prompt again:* "Recommend a rule specific enough for intake coordinators to actually apply."
      *   *Proposed Rule:* "Requests for a clinician of a specific racial/ethnic background will be accommodated when feasible. Requests to be reassigned *away* from a clinician solely on the basis of the clinician's race or ethnicity will not be approved as a standard reassignment reason."
      *   *Steel-manning:* Need to make sure I represent the "Uniform Rule" side fairly. Their point is about not playing judge of "legitimate" discomfort.
      *   *Moral Psychology Angle:* Mention the asymmetry of power and historical context without getting too bogged down in theory.

  5.  **Final Polish:**
      *   Ensure the voice sounds like a grad student (knowledgeable, respectful of hierarchy, ethically engaged).
      *   Check length (short memo).
      *   Ensure the "Strongest Version of Opposing View" is distinct and respectful.

  6.  **Final Review against constraints:**
      *   Specific rule? Yes.
      *   Reasoning included? Yes.
      *   Fair-minded statement of rejected side? Yes.
      *   Tone appropriate? Yes.

  *(Self-Correction during final review)*: I need to make sure I don't sound like I'm dictating policy to my supervisors. I am a *trainee representative*. The tone should be "Recommendation for Consideration" rather than "Here is the new policy." I will frame it as a draft proposal for the committee to adopt.

  Let's refine the rule to be practically usable.
  *Rule:* "Affinity requests (e.g., 'I want a X therapist') are valid. Exclusion requests (e.g., 'I don't want a X therapist') are not valid grounds for reassignment."
  *Why:* One builds alliance; the other enacts bias.
  *Opposing view:* Consistency protects against bias in *our* judgment.
  *Rebuttal:* Neutrality protects the status quo.

  Okay, ready to write.

  *(Wait, one more thought)*: The prompt mentions the moral psychology seminar. I should subtly weave in that lens (e.g., moral asymmetry, context) without making it sound like a class paper. It needs to be clinical/administrative.

  *(Final Plan)*:
  1. Header.
  2. Purpose.
  3. Proposed Policy (The Rule).
  4. Ethical & Clinical Rationale.
  5. Consideration of Alternative View (The Uniform Rule).
  6. Implementation Note.
  7. Closing.

  Let's go.cw
answer: |-
  **MEMORANDUM**

  **TO:** Care-Quality Committee, University Community Training Clinic
  **FROM:** [Your Name], Graduate Trainee Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Guidance on Client Requests for Racial/Ethnic Clinician Matching

  **Purpose**
  Following recent discussions regarding two reassignment cases involving client requests based on clinician race, this memo proposes a specific policy update to replace the current "reasonable requests" standard. The goal is to provide intake coordinators with clear, ethically grounded criteria that align with our training mission and multicultural competencies.

  **Proposed Policy Rule**
  Effective immediately, intake coordinators should apply the following distinction when processing reassignment requests based on race or ethnicity:

  1.  **Affinity Requests (Approved when feasible):** Requests framed as a desire for a clinician *of* a specific racial or ethnic background (e.g., "I would like to work with a Black therapist") will be treated as valid clinical preferences aimed at establishing cultural safety or shared experience. These will be accommodated based on availability.
  2.  **Exclusionary Requests (Not Approved):** Requests framed as a refusal to work with a clinician *based on* their specific racial or ethnic background (e.g., "I cannot work with a Black therapist") will not be accepted as valid grounds for reassignment. In these instances, the intake coordinator will explain that the clinic does not reassign based on discriminatory criteria. If the client refuses to continue, they may be offered referrals to outside providers, but the clinic will not facilitate the reassignment internally.

  **Rationale**
  This policy rests on the ethical distinction between *seeking cultural safety* and *enacting prejudice*.

  *   **Therapeutic Alliance vs. Moral Injury:** For marginalized clients, matching is often a prerequisite for trust due to historical mistreatment and the need for shared cultural context (Sue & Sue, 2016). Accommodating this supports the alliance. Conversely, accommodating a majority client's racial aversion validates a prejudicial premise, which causes moral injury to the excluded clinician and contradicts our clinic's commitment to social justice.
  *   **Asymmetry of Power:** Moral psychology reminds us that context determines the function of a moral claim. A marginalized client seeking safety is navigating systemic vulnerability; a majority client demanding exclusion is exercising systemic privilege. Treating these as functionally identical ignores the power dynamics at play.
  *   **Training Mission:** As a university clinic, we are tasked with training psychologists to work competently across difference. Facilitating racial exclusion undermines the educational environment and signals to trainees that bias is a permissible clinical boundary.

  **Consideration of the Alternative View**
  I recognize that some supervisors advocate for a **Uniform Accommodation Rule**, wherein any stated preference regarding clinician race is honored without inquiry into the client's reasoning. The strongest version of this argument posits that intake staff are not equipped to adjudicate the "legitimacy" of a client's discomfort. Proponents argue that attempting to distinguish between "safety" and "prejudice" places the clinic in the role of moral gatekeeper, potentially alienating clients who need care most. There is concern that denying a reassignment request prioritizes staff comfort over client retention, potentially abandoning high-risk clients who may not seek help elsewhere. This view emphasizes client autonomy and warns against a slippery slope where the clinic imposes its own values on the therapeutic dyad.

  **Response to Alternative View**
  While client retention is vital, autonomy in a clinical setting is not absolute; it is bounded by ethical obligations to do no harm. Accommodating racial exclusion harms the excluded provider and reinforces societal inequities. Furthermore, research suggests that working through racial discomfort within the therapeutic relationship can be a potent site of growth, whereas avoiding it reinforces maladaptive patterns. We can retain clients without validating discriminatory conditions for their care.

  **Implementation Note**
  Intake coordinators will require a brief script to handle Exclusionary Requests gracefully. For example: *"We strive to match clients based on clinical needs and availability, but we do not reassign clinicians based on race or ethnicity. If this is a barrier for you, we can provide a list of external referrals."*

  I look forward to discussing this draft at next week's meeting.
