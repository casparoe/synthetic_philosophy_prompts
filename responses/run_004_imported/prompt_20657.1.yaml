prompt: |-
  My cousin's getting married this summer and, half-jokingly, has been obsessing over "the odds" of it lasting -- you know, the classic stat that something like 40-50% of marriages end in divorce. Then he went down a rabbit hole of studies that break that number down by things like how long you dated before the wedding, how you met, education level, and age at marriage, and now his "personal" odds of divorce range anywhere from 12% to 45% depending on which subgroup stats he uses. He keeps asking me what his actual chance of divorce is, and honestly I don't think there's one number that's just definately correct, but I can't quite explain why, or whether there's some principled way to pick which stat to trust (this isn't really my corner of philosophy). What's actually going on here -- is he chasing a number that doesn't really exist, or is one of those stats actually the right one?
