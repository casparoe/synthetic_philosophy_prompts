  The banquet hall was too warm, the air thick with the scent of roasted lamb and exhausted academia. Elena swirled her wine, watching the sediment settle. Across from her, Marcus was picking at a crust of bread.

  "We used to know what we were doing," Elena said, finally breaking the silence. "You had a model, you made a prediction, you checked if the world agreed. Now? It feels like we're writing poetry and calling it phenomenology."

  Marcus smiled tiredly. "The Popperian dream. Falsifiability as the gatekeeper. But Elena, be honest. When was the last time a single experiment killed a theory outright? The Duhem-Quine problem isn't new. You always test a bundle of hypotheses. If the data disagrees, you tweak the auxiliary assumptions, not the core theory."

  "That's normal science," Elena countered. "I'm talking about theories where the auxiliary assumptions include 'the energy scale required is 10^15 GeV higher than any machine we can build.' There's a difference between protecting a theory from a single anomalous result and protecting it from *any* result. If you can't conceive of an observation that would prove you wrong, even in principle, you aren't doing physics. You're doing metaphysics with better funding."

  "In principle is doing a lot of heavy lifting there," Marcus said. "Multiverse scenarios often are testable in principle, just not with current technology. But look at the history. Atoms were once deemed metaphysical. We trusted them because they made the thermodynamics work, long before we could image them. Strict empiricism would have stalled us."

  "Atoms explained observable gas pressures," Elena said. "String theory explains... why gravity looks like gravity? That's consistency, not prediction. And don't give me the Dawid line about 'non-empirical theory assessment.' The 'No Alternatives' argument is circular. Maybe there are no alternatives because everyone brilliant has been funneled into string theory for thirty years. It's a sociological lock-in, not a mathematical necessity."

  Marcus leaned forward. "It's not just sociology. It's the Unexpected Explanatory Coherence. You start with a theory to solve one problem—quantum gravity—and suddenly it incorporates gauge theories, chirality, standard model features you didn't put in. That Bayesian update matters. If a theory keeps unlocking doors you didn't know were there, you trust it, even without the final key."

  "Or," Elena said, "you've built a maze so flexible that anything looks like a match. I'm worried about the cost. When we redefine science to include trust based on elegance and lack of imagination, what happens when we're wrong? How do we recover? Empirical falsification is a error-correction mechanism. Without it, we drift."

  "But you don't have pure falsification either," Marcus pressed. "You have confidence intervals. You have statistical significance. You decide when a null result is enough to abandon a model. That's a judgment call. Dawid's point is simply that we should be honest about the non-empirical judgments we're already making. The 'No Alternatives' argument isn't saying 'it must be true.' It's saying 'given the history of physics, when a theory survives this long without competition, it's rational to pursue it.'"

  "Rational to pursue, sure," Elena conceded. "But not to claim as the dominant paradigm. The bite here isn't whether we work on it. It's whether we teach it as the only game in town. If a grad student asks, 'Is this science?', and the answer is 'It depends on your definition of science,' we've lost something. We've lost the shared language of evidence."

  Marcus sighed, putting down the bread. "Maybe the shared language was always simpler than the practice. But if we demand empirical verification before we allow a theory to mature, we might kill the next general relativity in the crib. Einstein didn't have Eddington's eclipse when he wrote the field equations. He had mathematics and intuition."

  "Einstein gave us the perihelion of Mercury," Elena said softly. "He gave us something to check. If string theory gives us nothing to check but its own beauty, then beauty becomes the dogma. And dogma doesn't care about truth."

  " And strict falsification doesn't care about progress," Marcus replied. "It only cares about death. Science needs to live between the two."

  Elena raised her glass, a small, ambiguous gesture. "Then let's hope the wine is falsifiable. At least I'll know tomorrow if I drank too much."

  Marcus clinked his glass against hers. "And if you don't wake up, we'll know the theory was wrong."
