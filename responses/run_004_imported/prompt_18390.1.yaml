answer: |-
  This is a fantastic debate to be having, and your intuition is sharper than you give it credit for. You are correctly identifying a tension between *physics* (how systems evolve) and *decision theory* (how agents choose).

  Your friend is channeling Ole Peters' **Ergodicity Economics**, and the LessWrong crowd (Scott Garrabrant, etc.) has indeed built "Geometric Rationality" on similar mathematical bedrock. Their core claim is provocative: Expected Utility Theory (EUT) is flawed because it maximizes an *ensemble average* (what happens across parallel universes), whereas a single agent lives through a *time average* (what happens to one person over time). In non-ergodic systems (like multiplicative betting), these two averages diverge. Therefore, they argue, we should maximize time-average growth rates, which mathematically coincides with the Kelly Criterion (maximizing expected log wealth).

  However, the claim that this *overturns* EUT is, as you suspect, largely semantic. Below is a structured argument you can send to your friend. It concedes the physics, respects the math, but defends the economic framework.

  ***

  ### Subject: Re: Ergodicity, Kelly, and the Foundation of Rationality

  I've been thinking about our conversation regarding Ergodicity Economics and Geometric Rationality. You're right that the framework is elegant, and Peters is correct that standard introductory treatments of "Expected Value" often ignore the difference between ensemble and time averages in non-ergodic systems.

  However, the claim that this *overturns* Expected Utility Theory (EUT) doesn't hold up under scrutiny. It is more accurate to say that Ergodicity Economics provides a **physical derivation for a specific utility function** (log wealth) within the existing EUT framework, rather than replacing the framework itself.

  Here is the argument for why EUT remains the robust foundation, and why the "Ergodicity Revolution" is better understood as a constraint analysis than a new decision theory.

  #### 1. The "Smuggling" Charge is Mathematically Correct
  The central mathematical identity here is that for a multiplicative wealth process, the time-average growth rate $g$ is equal to the expected value of the logarithm of wealth:
  $$ g = \langle \ln(W) \rangle_t = E[\ln(W)] $$
  Peters argues that maximizing $g$ is a physical necessity, whereas maximizing $E[u(W)]$ is a subjective preference.

  But look at the EUT objective function: Maximize $E[u(W)]$.
  If we set $u(W) = \ln(W)$, the EUT objective becomes Maximize $E[\ln(W)]$.
  This is mathematically identical to maximizing the time-average growth rate.

  The Ergodicity argument claims the log comes from the *dynamics* of the system. EUT claims the log comes from the *preferences* of the agent. But if the behavior is identical, the normative difference is thin. EUT is a formal framework for mapping states of the world to choices. It does not mandate linear utility ($u(W) = W$). When Peters says "don't maximize expected wealth, maximize expected growth," he is effectively saying "don't use linear utility, use log utility." EUT already allows this. It is not a bug in EUT that you have to specify a utility function; it is the entire point of the theory.

  #### 2. Engaging the Ergodicity Objection Directly
  Your friend's strongest point is that ensemble averages are "unphysical" for a single agent. If I play a gamble where I lose everything with probability $p$, the ensemble average might be positive (because in some parallel universes I win big), but my time average is ruin.

  **The EUT Counter-Argument:**
  EUT does not require agents to maximize the ensemble average of *wealth*. It requires them to maximize the ensemble average of *utility*.
  If an agent faces a non-ergodic system where ruin is possible, a rational agent under EUT *should* assign $u(0) = -\infty$ (or sufficiently low) to reflect the absorbing state of bankruptcy.
  *   If you use linear utility, EUT tells you to bet big. If you go bust, EUT says you made the "right" decision but got unlucky.
  *   If you use log utility, EUT tells you to bet Kelly.

  The error isn't in EUT; the error is in the **default assumption of linear utility** in naive applications of expectation. Peters has successfully argued that linear utility is physically dangerous in multiplicative environments. But he hasn't shown that EUT is wrong; he has shown that $u(W)=W$ is a bad utility function for survival-constrained agents. EUT is flexible enough to absorb this insight without breaking.

  #### 3. Samuelson's Critique (The "Fallacy" of Geometric Mean)
  You remembered correctly: Paul Samuelson dismantled the "Maximize Geometric Mean" crowd in his 1971 paper, *"The 'Fallacy' of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling."* (The story about him writing a paper in one-syllable words is likely apocryphal, but the sentiment reflects how fiercely he debated Latané and others on this).

  Samuelson's core argument was that **asymptotic dominance does not imply optimality.**
  Just because the Kelly strategy almost surely outperforms other strategies as $t \to \infty$ does not mean it maximizes expected utility for a finite horizon or a specific agent.

  **Example:** Suppose I have a utility function that is linear above \$10 million and zero below (I need to buy a specific company or I fail). Kelly betting might be too conservative to reach that threshold in my lifetime. A more aggressive strategy might have a lower time-average growth rate but a higher probability of hitting my specific utility target.
  **Example:** Suppose I have human capital (outside income) that allows me to replenish my bankroll. I can afford to take more risk than Kelly prescribes because I am not an isolated wealth system.

  Samuelson showed that "rationality" depends on the utility function, not just the dynamics. Ergodicity Economics implicitly assumes the utility function is "survival/growth." That is a valid preference, but it is not the *only* rational preference. Therefore, it cannot be the *foundation* of rationality; it is a specific case within the foundation.

  #### 4. Where the Ergodic/Geometric Side is Right (Honest Concessions)
  To be fair to the physics side, they have won some important battles:
  1.  **Critique of Naive Expectation:** They have successfully exposed that teaching "maximize expected value" without specifying "expected value of *what*" is dangerous. In non-ergodic systems, $E[W]$ is often a meaningless metric for an individual.
  2.  **Derivation of Risk Aversion:** Standard EUT treats risk aversion as a psychological parameter ($\gamma$ in isoelastic utility). Ergodicity Economics derives risk aversion from the structure of the environment (multiplicative dynamics + no bailout). This is a powerful explanation for *why* log utility is so common in nature and markets.
  3.  **Dynamic Consistency:** The Geometric Rationality crowd (Garrabrant et al.) is right that in markets or multi-agent systems where wealth is reinvested, geometric averaging is the correct scoring rule for truth-seeking. Linear scoring rules can be manipulated by high-variance strategies; geometric rules enforce calibration.

  #### 5. The Verdict
  The claim that Ergodicity Economics "overturns" Expected Utility Theory is a category error.
  *   **EUT** is a theory of **choice** (axioms of preference).
  *   **Ergodicity** is a property of **dynamics** (statistics of trajectories).

  You cannot derive an "ought" (choice) solely from an "is" (dynamics) without a bridge premise. The bridge premise in Ergodicity Economics is "you ought to maximize your time-average growth." But that premise *is* a utility function ($u(W) = \ln W$).

  So, tell your friend this: **He has discovered a compelling physical justification for Log Utility.** He has not discovered a replacement for Expected Utility Theory. The "new continent" he thinks he found is actually just a very well-mapped region of the old continent, now viewed through a telescope instead of a microscope.

  Samuelson was right: Maximizing geometric mean is not universally rational. It is only rational for agents whose utility aligns with long-term survival in multiplicative systems without external replenishment. That describes many bettors and investors, but it does not describe *Rationality* itself.

  ***

  ### Notes for you (the sender):
  *   **The Samuelson Paper:** The specific paper is *The "Fallacy" of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling*, Proceedings of the National Academy of Sciences (1971). It is the definitive takedown of the idea that Kelly is "universally optimal."
  *   **The "One-Syllable" Story:** Be careful citing this. It's a famous econ legend that Samuelson wrote a rebuttal using only one-syllable words to mock the simplicity of the geometric mean argument, but most historians of thought consider it apocryphal. It's better to cite the 1971 paper's actual logic (as done above) rather than the anecdote.
  *   **Geometric Rationality:** Garrabrant's work is slightly different from Peters'; it focuses more on logical uncertainty and market scoring rules. However, the core mathematical objection (that linear averaging fails in multiplicative contexts) is the same, so the EUT defense holds for both.

  This approach validates your friend's intelligence (the physics is real) while correcting the theoretical overreach (the decision theory is unchanged).
