      *   **The Conflict:** Elena says "Take." Marcus says "Wait, why are we here?"
      *   **Elena's Argument (Aumann-esque):** Rationality isn't about history; it's about the future. At node 90, the future looks like a finite game starting at 90. BI applies to subgames. If you are rational, you take. If I am rational, I know you will take at 91. So I must take at 90. The past is irrelevant counterfactuals.
      *   **Marcus's Argument (Binmore-esque):** The past *is* the evidence. BI relies on CKR. If CKR were true, we'd be at Node 1 (taking the pot). We are at Node 90. Therefore, CKR is false. You cannot use a falsified premise to derive a conclusion.
      *   **The Clash:** Elena argues that rationality is a disposition, not a track record. Marcus argues that rationality is inferred from action.
      *   **Deepening the Epistemic Crisis:** Marcus pushes on the "counterfactual" nature of Elena's claim. "If I were rational, I wouldn't be here." Elena pushes on the "commitment" to rationality. "If you abandon BI now, you aren't rational."
      *   **The Climax/Resolution:** They need to pinpoint the exact divergence. It's about *belief revision*. How do you update beliefs when a logical impossibility (under CKR) happens?
