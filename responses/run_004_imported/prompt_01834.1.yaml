answer: |-
  **Setting:** *A quiet seminar room, late evening. A digital display on the wall shows a game tree, highlighted at Node 90. The pot is significant—enough to change a life. Two figures sit across a table littered with coffee cups and printouts.*

  **Characters:**
  *   **ELENA:** A game theorist. Sharp, formalist, committed to the axioms.
  *   **MARCUS:** A philosopher of rationality. Skeptical, epistemic, focused on belief revision.

  ***

  **ELENA:** (Tapping the screen) It's your move, Marcus. Node 90. The pot is two million. If you pass, it grows to 2.1 at Node 91, but then it's my turn. If I take, you get nothing extra. If I pass, it grows again. Ten nodes left.

  **MARCUS:** Two million is a lot of money to leave on the table. But looking at this board, I'm struggling to find the "rational" move.

  **ELENA:** You're struggling because you're looking at the history. Look at the subtree. From Node 90 onward, this is a finite centipede game of ten rounds. Backward induction applies. At Node 100, I take. Knowing that, at 99, you take. Knowing that, at 98, I take. It cascades back to here. At 90, you take.

  **MARCUS:** That cascade only works if we both believe the other will act rationally at every future node.

  **ELENA:** We *know* we are rational. That's the premise. Common Knowledge of Rationality. CKR.

  **MARCUS:** (Leans back) Elena, if CKR were true, we wouldn't be sitting here.

  **ELENA:** That's the standard objection. It's also wrong.

  **MARCUS:** Is it? Backward induction relies on the assumption that *I* know *you* are rational, and *you* know *I* am rational, all the way down. If that were common knowledge, the game ends at Node 1. We would have taken the opening pot and walked away. The fact that the pot is two million means someone has passed eighty-nine times.

  **ELENA:** Someone made a mistake. Or a tremble. It doesn't matter.

  **MARCUS:** It matters immensely. You're asking me to use a premise—CKR—that the game history has just falsified. It's like saying, "Assume all swans are white," while pointing at a black swan, and then concluding, "Therefore, this bird must be white."

  **ELENA:** No. I'm saying rationality is a constraint on *choice*, not a prediction of *history*. You are at Node 90. You have a choice. To be rational is to maximize utility given your beliefs. My argument is that your beliefs about *my* future rationality should remain fixed, regardless of how we got here.

  **MARCUS:** Why? Why should my belief about your future rationality remain fixed when your past behavior screams otherwise?

  **ELENA:** Because past behavior is noise. Rationality is structural. If I am rational, I will take at Node 99. You know I am rational. Therefore, you know I will take at 99. Therefore, you must take at 90. The fact that I passed at Node 89... maybe I slipped. Maybe I was testing you. But it doesn't change the logical necessity of what happens at Node 99.

  **MARCUS:** "Maybe I slipped." That's the escape hatch, isn't it? Aumann's move. You treat the deviation as an independent event—a tremble—that doesn't update my information about your type. But that's question-begging.

  **ELENA:** How?

  **MARCUS:** Because you're defining rationality in a way that makes it unfalsifiable. If I pass, you call it a tremble. If I take, you call it rationality. But if we are truly reasoning agents, reaching Node 90 is evidence. It's data. And the data suggests that the condition required for backward induction—Common Knowledge of Rationality—is false.

  **ELENA:** So what do you do? Abandon logic because the world is messy?

  **MARCUS:** I adjust the logic to fit the world. If CKR is false, then I don't know that you'll take at Node 99. In fact, given that you've passed eighty-nine times, I have strong empirical evidence that you *won't* take at 99. You might pass again.

  **ELENA:** But if you believe I'll pass at 99, then passing at 90 is optimal for you.

  **MARCUS:** Exactly.

  **ELENA:** But that creates a contradiction! If passing is optimal for you at 90, then taking was *not* the rational move at 89. But if taking wasn't rational at 89, then backward induction never gets a foothold. You're justifying a deviation from equilibrium by assuming the deviation will continue.

  **MARCUS:** I'm justifying a strategy based on updated beliefs. Look, Elena, backward induction requires counterfactual reasoning. It says, "If we were at Node 99, I would take." But we aren't at Node 99. And under CKR, we *couldn't* be at Node 99.

  **ELENA:** We *can* be. We *are*.

  **MARCUS:** Not if CKR holds. CKR implies the game ends at Node 1. So, for us to be at Node 90, CKR must have failed. Now, if CKR has failed, on what grounds do you demand I use it to decide my move? You want me to reason: "Even though the premise that got us here is broken, I must act as if it holds for the remaining ten steps." That's not rationality. That's dogma.

  **ELENA:** It's not dogma, it's commitment. Rationality isn't a weather forecast; it's a law of motion. If you abandon backward induction because you're off-path, you aren't being rational; you're being reactive. You're saying, "Because you were irrational yesterday, I will be irrational today."

  **MARCUS:** I'm saying, "Because you were irrational yesterday, I infer you are not the type of agent who maximizes via backward induction."

  **ELENA:** But I *am* that agent. I'm telling you right now. I am rational. I am common knowledge.

  **MARCUS:** (Laughs softly) You can't *tell* me. You have to *be* it. And if you were it, we wouldn't be here. This is the heart of it, Elena. You're treating rationality as an intrinsic property I possess, like having two legs. I'm treating it as a relational property inferred from action.

  **ELENA:** If it's only inferred from action, then no one is ever rational until the game is over. That destroys the normative force of game theory. Theory is supposed to tell you what to *do*, not just describe what you *did*.

  **MARCUS:** Theory tells you what to do given your information. My information has changed.

  **ELENA:** Your information about *payoffs* hasn't changed. Your information about *logic* hasn't changed. The only thing that changed is your confidence in me. But if you concede that I am rational *now*, the induction holds.

  **MARCUS:** Why should I concede that?

  **ELENA:** Because if you don't, we collapse into infinite regress. If you think I might pass at 99 because I passed at 89, then I should pass at 88 because I think you'll pass at 89... and we end up passing all the way to 100.

  **MARCUS:** And isn't that what actually happens in the lab? McKelvey and Palfrey. People pass. They get the higher payoff.

  **ELENA:** (Sharp) That's the "people are nicer" fallacy. We aren't talking about niceness. We're talking about whether a rational agent *should* pass. If the theory says Take, and the data says Pass, the theory doesn't blink.

  **MARCUS:** Maybe the theory is blinking at the wrong thing. You're insisting that the counterfactual "If we reach Node 99, Player 2 takes" remains true even when the antecedent "We are rational players" has been proven false by reaching Node 90.

  **ELENA:** The antecedent hasn't been proven false. *I* am still rational. *You* are still rational. We just... missed the exit.

  **MARCUS:** You can't miss an exit that was the only logical path. If rationality dictates Take at 1, then Pass at 1 is not a "missed exit." It's a different road. And on this road, the rules might be different.

  **ELENA:** (Pauses, looking at the screen) So your claim is that rationality is path-dependent.

  **MARCUS:** My claim is that belief revision is mandatory. When a logical implication of your model (Node 1 termination) fails to materialize, you must update the model. You cannot keep the conclusion (Take at 90) while discarding the premise (CKR) that supports it.

  **ELENA:** But if you update the model to say "My opponent might pass," then you pass. And if I know you'll pass, I pass at 91. And if you know I'll pass at 91, you pass at 90. We unravel the backward induction not from the end, but from the middle.

  **MARCUS:** We unravel it because the foundation cracked.

  **ELENA:** But here's the trap, Marcus. If you admit that reaching Node 90 justifies passing, then you admit that a rational player *should* have passed at Node 1 to get to Node 90.

  **MARCUS:** (Silence for a moment) ...Go on.

  **ELENA:** If the rational move at 90 is Pass, because you doubt my rationality, then the rational move at 1 was also Pass, to exploit that doubt. But if the rational move at 1 is Pass, then Backward Induction was wrong from the start.

  **MARCUS:** I'm not saying Backward Induction is wrong. I'm saying it's conditional.

  **ELENA:** It claims to be unconditional for rational agents! That's the definition. A rational agent in a finite game of perfect information *must* backward induce.

  **MARCUS:** Only if the rationality is common knowledge.

  **ELENA:** And if it ceases to be common knowledge?

  **MARCUS:** Then the game changes. It stops being a game of perfect logic and becomes a game of psychology. Of reputation.

  **ELENA:** And you're willing to call that "rational"?

  **MARCUS:** I'm willing to call it "sane." Look, isolate the claim. What do we actually disagree on?

  **ELENA:** We disagree on the status of the counterfactual. I claim that even if we are off-path, the logical obligation to maximize remains binding on future nodes. The past is sunk. The future is logic.

  **MARCUS:** And I claim that the past is evidence. You cannot separate the logical obligation from the epistemic conditions that make it binding. If the condition (CKR) is violated, the obligation dissolves.

  **ELENA:** So the dividing line is belief revision.

  **MARCUS:** Precisely. How do you update on an event that your theory says has probability zero?

  **ELENA:** (Nods slowly) You treat it as a tremble. A mistake. You preserve the theory.

  **MARCUS:** And I treat it as data. I update the theory.

  **ELENA:** If you update the theory, you lose the predictive power of rationality. Anything becomes possible.

  **MARCUS:** If you preserve the theory, you lose contact with the players. You're playing against a ghost, not me.

  *(Elena looks at the timer. Ten seconds to decide.)*

  **ELENA:** I'm taking the pot, Marcus. Because I assume you're rational enough to know I'm going to take at 91.

  **MARCUS:** (Smiles faintly) And I'm passing. Because I assume you're human enough to know I'll pass at 91.

  **ELENA:** Then one of us is about to lose two million dollars.

  **MARCUS:** Or one of us is about to prove that rationality isn't what we thought it was.

  *(Elena reaches for the console. Marcus watches her hand. The screen waits.)*

  **[END SCENE]**
