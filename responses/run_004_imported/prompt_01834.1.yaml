      *   *The Philosopher (Let's call him Marcus):* Epistemic, skeptical of counterfactuals that contradict premises. Believes information updates when expectations are violated. If the game reached Round 90, the premise of "common knowledge of rationality" is broken.

  3.  **Setting the Scene:**
      *   Round 90. High stakes. Tension. A quiet room, maybe a chalkboard or a tablet showing the tree.
      *   The immediate choice: Pass (hope the other passes at 91 to get more at 92) or Take (secure the current pot).

  4.  **Drafting - Section by Section:**

