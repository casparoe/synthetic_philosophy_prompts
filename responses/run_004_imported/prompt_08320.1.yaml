prompt: |-
  hey, im taking a seminar on paraconsistent logic this semester and we just hit the unit on dialetheism. our prof assigned aristotle's actual elenctic proof of non-contradiction as background (metaphysics gamma 4) since apparently priest spends a ton of time trying to get around it, but i've read it like four times now and i think im still missing the actual structure of the arguement. here's the bit thats messing me up:

  "We can, however, demonstrate negatively even that this view is impossible, if our opponent will only say something; and if he says nothing, it is absurd to seek to give an account of our views to one who cannot give an account of anything, in so far as he cannot do so. For such a man, as such, is from the start no better than a vegetable. Now negative demonstration I distinguish from demonstration proper, because in a demonstration one might be thought to be begging the question, but if another person is responsible for the assumption we shall have negative proof, not demonstration. The starting-point for all such arguments is not the demand that our opponent shall say that something either is or is not (for this one might perhaps take to be a begging of the question), but that he shall say something which is significant both for himself and for another; for this is necessary, if he really is to say anything. For, if he means nothing, such a man will not be capable of reasoning, either with himself or with another. But if any one grants this, demonstration will be possible; for we shall already have something definite. The person responsible for the proof, however, is not he who demonstrates but he who listens; for while disowning reason he listens to reason."

  (that's the W.D. Ross translation.) so the things i can't untangle: why does aristotle think "negative demonstration" dodges the question-begging charge when a normal proof of the same principle apparently wouldn't? what work is the bit about merely "signifying something" doing — like why is that such a low bar to get an opponent to concede, and yet supposedly enough to sink the guy who denies non-contradiction? and that line about the person "responsible for the proof" being the listener and not the demonstrator is so weird to me, i don't even know what question it's answering. can you walk through the argument step by step, and maybe flag where a dialetheist would actually push back on it?
