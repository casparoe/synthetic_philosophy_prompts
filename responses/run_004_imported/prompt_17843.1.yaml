answer: |-
  The ATM hummed, a sterile blue light washing over Alex's face. His card hovered in the slot.

  "Don't do it," Mara said, leaning against the brick wall. "Just type the PIN."

  "And lose a hundred bucks for nothing?" Alex didn't look back. "The ride is over. I'm safe. My action here doesn't reach back into the desert and cause the driver to stop. Causality flows one way, Mara. Paying is literally burning resources."

  "This is exactly what Parfit was talking about," Mara said. "You're stuck on act-rationality. You're asking, 'Does this specific push maximize utility now?' The answer is no. But the broader question is, 'What disposition maximizes utility over a life?'"

  "So I should have cultivated a disposition to pay. Great. I failed. Why should I compound the error?"

  "Because you didn't fail," Mara said. "You're here. That means the driver predicted you'd pay. He read something in you. If you walk away now, you're proving that his prediction was only right by accident. You're severing the link between your future self and your past commitments."

  Alex laughed, finally turning. "Why should I care about what an algorithm in the past would have output? I'm not that algorithm. I'm the guy standing here with the cash. You're smuggling in a conclusion by relabeling. You're calling the disposition 'rational,' then pretending that label sticks to the act. But they're different things. It can be rational to own a gun for safety while being irrational to pull the trigger in a bank."

  "Nice analogy," Mara said. "But you can't have the safety of the gun without accepting the logic of the trigger. If Self-Interest Theory says 'maximize your welfare,' and having the disposition to pay is what secures your welfare, then following through is part of the package. You're treating yourself as a series of time-slices. The Alex in the desert and the Alex at the ATM are the same agent."

  "They're the same agent with different information," Alex countered. "Back there, paying was hypothetical. Here, it's actual loss. You're asking me to be locally irrational because it was globally rational to be the kind of person who wouldn't be locally rational. It's 'rational irrationality.' It sounds like a slogan, not an argument."

  "It's an argument about coordination," Mara said. "If you maximize act-by-act, you become untrustworthy before the act even matters. The driver didn't pick up a CDT agent. He picked up someone he thought was like me. Someone who knows that if you defect at the ATM, you weren't actually the person who deserved the ride. You're free-riding on a disposition you don't actually hold."

  "So I'm a hypocrite. Hypocrisy pays."

  "Does it?" Mara pushed off the wall. "Once you leave this town, you'll need another ride. Or a loan. Or a job. If you reason like this now, you'll reason like this then. You're optimizing for the single node and crashing the network. Parfit's point is that Self-Interest Theory is self-defeating if you apply it directly. To win, you have to be willing to lose when losing is the price of admission."

  Alex looked back at the keypad. The screen timed out, going dark. He tapped it awake.

  "You're saying I should pay to validate a past prediction," Alex said. "But the prediction is already made. I can't change the past. I can only change my bank balance."

  "You can't change the past," Mara said. "But you can change whether the past was right about who you are. And if you aren't the person who pays, you're not the person who gets picked up. Next time, you walk."

  Alex sighed, fingers hovering over the numbers. "Next time is a different game."

  "No," Mara said. "It's the same game. You're just further down the road."
