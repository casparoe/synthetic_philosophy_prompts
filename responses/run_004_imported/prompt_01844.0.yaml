  Ok so my friend sent me this youtube video last week about how Kurt Gödel (the incompleteness theorem guy, basically one of the most legit logicians of all time) supposedly wrote out an actual formal proof that God exists, using modal logic and this idea of "positive properties." The video walked through the whole symbolic argument and was like "logicians have checked this line by line and its valid," and it also mentioned that Gödel never even published it while he was alive, he just let a friend copy it down once when he thought he was dying, which seems a little sus to me but the video didn't really get into why.

  Anyway this kind of messed with my head, because like, if one of the greatest logicians of the 20th century built an actual airtight proof using real math, shouldn't that basically settle it? Normally when people argue about god it's all just vibes and intuition and "well what about the argument from evil" back and forth forever, but this is supposed to be an actual logical deduction, so it feels like you'd either have to find a mistake in the logic or accept the conclusion. I brought it up with my friend from Theory of Knowledge class and she said something like "the logic isn't really the issue, its the premises," but i didn't totally get what she meant, since the premises (stuff like "being God-like is a positive property") sound pretty tame to me, not like some sneaky hidden assumption.

  Can you actually help me understand this? Like why isn't this treated as a slam-dunk proof by basically all philosophers and logicians if nobody disputes the logic itself? Am I misunderstanding something about how this kind of argument is even supposed to work?
