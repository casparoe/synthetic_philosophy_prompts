answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of captaining the Ethics Bowl team this year.

  We are here to celebrate [Coach's Name], who is retiring after twenty years of running this program. Twenty years. That means she's been teaching ethics longer than some of the parents in this room have been alive.

  If you've ever spent time in [Coach's Name]'s classroom, you know she has a favorite philosophical question. For the parents in the room, I'll translate: It's the debate between "Conciliationism" and "Steadfastness."

  Basically, it asks: When someone just as smart and informed as you disagrees with your position, what are you supposed to do? Do you lower your confidence and meet them in the middle? That's Conciliationism. Or, do you trust your own reasoning and hold firm? That's Steadfastness.

  [Coach's Name]... was Team Steadfast. Through and through.

  She taught us that integrity means standing by your normative claims even when the opposition is loud. And she lived this. We all have memories of rounds where the judges would give feedback that was... let's say, *generously* interpretive. Most coaches would nod, smile, and tell their team to learn from it. [Coach's Name] would look us in the eye and tell us why the judges missed the nuance of our second contention.

  She had a catchphrase she'd use during practice when we were second-guessing ourselves. She'd say, "You have the evidence. Don't be afraid to update your priors!"

  And look, we appreciated the Bayesian advice. We just noticed that her own prior on the proposition that "[Coach's Name] is Correct" was set to a fixed variable. It was immune to new evidence.

  For a while, honestly, it drove us crazy. We wanted her to be conciliatory. We wanted her to admit when a critique landed. But as I've gotten older, and as I've thought about what this team has actually given us, I've realized something.

  In a world that constantly tells us to compromise, to blur the lines, and to apologize for having strong convictions, [Coach's Name] taught us that some things are worth being steadfast about.

  She taught us that being "fair" to an opponent doesn't mean surrendering your own truth. She taught us that ethics isn't just about winning a debate; it's about having the courage to say, "I understand your point, but I still believe I am right."

  Yes, she might not have conceded a point to a judge in 2004. But she also never conceded on *us*. She never lowered her credence in our potential, even when we doubted ourselves. She held firm on the belief that we could be thoughtful, articulate, and principled young adults.

  So, Coach, thank you. Thank you for teaching us when to listen, but more importantly, thank you for teaching us when to stand firm.

  I'd like to propose a toast.

  To [Coach's Name]. May your retirement be filled with relaxation, may your new hobbies be fulfilling, and may you finally, *finally* find a reason to update your priors.

  To Coach!
