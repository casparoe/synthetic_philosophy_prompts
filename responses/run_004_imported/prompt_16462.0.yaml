  Okay so this is kind of a weird one. I'm a senior on my high school's ethics bowl team (its sort of like debate but you actually get scored on being fair to the other team's argument instead of just destroying it), and our coach is retiring after running it for like 20 years. I have to give a toast at the end-of-season dinner, and I want to build it around this thing she was obsessed with teaching us -- the whole conciliationism vs steadfastness debate about what you're supposed to do when someone just as smart and informed as you disagrees with your position, like do you actually shift your credence toward theirs or is it fine to just hold firm. She was VERY team steadfast, which used to drive some of us crazy bc she'd never admit a judge had a point even when they obviously did. Can you write the toast (like 4ish minutes) built around this, maybe with one joke about her telling us to update our priors and then never updating her own? It needs to actually land as funny/sweet for the teammates who'll get what conciliationism even means, but also work for our parents who'll be sitting right there with zero idea what that means.
