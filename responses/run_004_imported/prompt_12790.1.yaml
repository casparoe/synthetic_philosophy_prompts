      *   **Goal:** Clarify the logical structure of Newton's argument in the Scholium, specifically the relationship between the Bucket and the Two-Globes experiments, and how this relates to absolute space vs. relationalism (and eventually the hole argument).

  2.  **Deconstruct the Physics/Philosophy:**
      *   **Newton's Goal:** To distinguish "Absolute, True, and Mathematical" time/space/motion from "Relative, Apparent, and Common" time/space/motion.
      *   **The Bucket Experiment:**
          *   Stage 1: Bucket and water at rest (relative to each other and earth). Surface flat.
          *   Stage 2: Bucket spins, water stationary (relative to bucket). Surface flat.
          *   Stage 3: Bucket and water spin together (relative to each other at rest). Surface concave.
          *   *Newton's Inference:* The shape of the water (concave vs. flat) correlates with *absolute* rotation, not relative rotation between water and bucket. In Stage 2, relative motion is max, surface flat. In Stage 3, relative motion is zero, surface concave. Therefore, the cause of the concavity (centrifugal force/endeavor to recede) is not relative motion w.r.t the bucket.
          *   *The User's Critique (Mach's Critique):* Newton shows it's not relative to the *bucket*. But why not relative to the *fixed stars* or the bulk of matter in the universe? In Newton's setup, the bucket is fixed to the Earth, which is fixed (roughly) to the stars. So absolute rotation and rotation w.r.t stars coincide.
      *   **The Two-Globes Experiment:**
          *   Setup: Two globes connected by a cord, rotating around their common center of gravity in an *immense vacuum* (empty universe).
