      *   **Analyze the Two-Globes:** Explain its specific role. It removes the "fixed stars" option by positing a vacuum. If tension exists there, it can't be relative to external matter.
      *   **Newton's Overall Strategy:** It's a cumulative argument. Bucket = empirical evidence in *this* world. Two-Globes = conceptual possibility in *any* world.
      *   **Connection to the Hole Argument:** This is crucial for the student's specific interest.
