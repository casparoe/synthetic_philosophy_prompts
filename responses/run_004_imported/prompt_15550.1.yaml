prompt: |-
  ok so in my philosophy of love and sex seminar we just spent two weeks on Russell's Marriage and Morals, and now my sister is getting married next month and of course i got asked to do the maid of honor speech (i'm the philosphy minor of the family, obviously). problem is the only material currently living in my brain rn is Russell, and honestly i think it could make a genuinely good toast, but a lot of his actual views are NOT normal toast material -- the bit about jealousy being basically a trained-in vice rather than proof of love, his idea that marriage is really about kids and companionship more than sexual exclusivity, and his general impatience with treating one instance of infidelity as an unforgivable tragedy. (also not gonna lie, the guy was married four times and had an openly non-monogamous marriage with Dora Russell that ended pretty badly, so he's not exactly a poster child for his own theory either.)

  can you write me a ~3 minute speech that actually uses his real arguments to say something true and touching about commitment, without it accidentally sounding like i'm telling the newlyweds to go open up their marriage? half the room is my very catholic grandma's side of the family and half is my philosophy classmates, who will 100% clock it if i flatten him into just "the free love guy" to make him palatable.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of Love and Sex seminar, just finished Bertrand Russell's *Marriage and Morals*. Sister getting married. User is Maid of Honor (Philosophy minor).
      *   **Task:** Write a ~3 minute toast/speech.
      *   **Constraint 1 (Content):** Must use Russell's *actual* arguments (jealousy as a vice, marriage about companionship/kids > sexual exclusivity, infidelity not necessarily tragic).
      *   **Constraint 2 (Tone/Audience):** Must be touching and appropriate for a wedding. Cannot sound like advice to open the marriage (Catholic grandma side vs. Philosophy classmates). Cannot flatten Russell into a caricature (classmates will notice).
      *   **Constraint 3 (Self-Awareness):** Acknowledge Russell's personal failures (4 marriages, messy non-monogamy) without undermining the wisdom.
      *   **Length:** ~3 minutes (approx. 400-500 words spoken at a moderate pace).

  2.  **Deconstruct Russell's *Marriage and Morals* for Wedding Appropriateness:**
      *   *Jealousy:* Russell sees it as possessive and destructive, not proof of love. *Wedding angle:* Love is trust, not ownership.
      *   *Exclusivity:* Russell thinks sexual exclusivity shouldn't be the *only* pillar. *Wedding angle:* The bond is deeper than just rules; it's about chosen partnership.
      *   *Companionship/Children:* Russell emphasizes the shared life project. *Wedding angle:* Building a life together is the core.
      *   *Forgiveness:* Russell argues against rigid moralism regarding mistakes. *Wedding angle:* Marriage requires grace and resilience, not perfection.
      *   *His Hypocrisy:* He failed at this. *Wedding angle:* Wisdom isn't about perfection; it's about the aspiration.

  3.  **Drafting Strategy - Balancing the Tightrope:**
      *   *The Hook:* Acknowledge the philosophy minor status immediately. Disarm the audience.
      *   *The Russell Connection:* Introduce Russell but frame him carefully. Don't hide his flaws, but use them to highlight the *difficulty* of love.
      *   *The Core Argument (Jealousy/Possession):* Translate "jealousy is a vice" into "love is not ownership." This is safe for Grandma and deep for the classmates.
      *   *The Core Argument (Exclusivity/Commitment):* Translate "sexual exclusivity isn't everything" into "commitment is a choice, not a cage." Focus on the *why* of monogamy (choice) rather than the *rule* of monogamy.
      *   *The Core Argument (Forgiveness):* Translate "infidelity isn't the end" into "resilience matters more than perfection."
      *   *The Conclusion:* Bring it back to the couple. Wish them well.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Hi everyone. For those who know me, you know I've been reading Bertrand Russell. For those who don't, he's a philosopher who thought a lot about love... and had a complicated personal life.
      *   *Addressing the Elephant:* He was married four times. So why listen to him? Because philosophy is about the ideal, even if we stumble.
      *   *Point 1 (Jealousy):* Russell said jealousy isn't proof of love, it's fear. [Sister] and [Partner], your love isn't about holding on tight, it's about letting each other be free within the promise.
      *   *Point 2 (Commitment):* He argued marriage isn't just about policing bodies, it's about building a shared world. The vow isn't a chain; it's an anchor.
      *   *Point 3 (Grace):* He believed in forgiveness over rigid judgment. Marriage isn't a test you pass once; it's a practice.
      *   *Closing:* To the couple. May your commitment be chosen every day.

  5.  **Refining and Polishing (The "Grandma vs. Classmate" Test):**
      *   *Risk:* Saying "sexual exclusivity isn't the main point" might scare Grandma.
      *   *Fix:* Phrase it as "The structure of marriage matters less than the spirit of it." Or "It's not about the rules we follow, but the reasons we keep them." Let's go with: "He challenged us to see marriage not as a contract of ownership, but as a partnership of growth."
      *   *Risk:* Classmates thinking I'm selling out.
      *   *Fix:* Keep the specific Russellian terminology (jealousy as a vice, possession vs. love). Acknowledge his failures explicitly.
      *   *Tone Check:* Needs to be warm, not lecture-y.

  6.  **Writing the Speech (Iterative Process):**
      *   *Word Count Check:* A 3-minute speech is roughly 400-450 words.
      *   *Drafting thought:* I need to make sure I don't sound like I'm suggesting they *should* be non-monogamous. I need to frame Russell's critique of *possessiveness* as a strength for *monogamous* commitment. True monogamy is chosen, not enforced by jealousy.

      *(Self-Correction during drafting)*: I initially thought about mentioning the "open marriage" bit directly. No, that's too risky for the toast. Instead, focus on the *spirit* of exclusivity. Russell argued exclusivity should come from desire, not duty. I can frame that as "choosing each other again and again."

      *(Refining the "Hypocrisy" angle)*: Make it humble. "He wasn't perfect, but his questions were good."

  7.  **Final Review against constraints:**
      *   Russell's arguments present? Yes (Jealousy, possession, resilience).
      *   Not advising open marriage? Yes (Framed as depth of commitment).
      *   Grandma safe? Yes (Focus on loyalty and grace).
      *   Classmate safe? Yes (Nuanced view of Russell, not sanitized).
      *   Time? Looks about right.

  8.  **Final Polish:** Add stage directions [Pause], [Raise glass]. Ensure the transition from philosophy to sisterly love is smooth. (Proceed to generate output).

  9.  **Post-Draft Advice:** Add a note to the user about delivery and knowing their audience, just in case.

