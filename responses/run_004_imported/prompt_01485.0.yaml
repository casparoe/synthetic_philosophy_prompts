answer: |-
  **The Buck Stops Where? The Wrong Kind of Reasons and the Fate of Value**

  Your journey from *The Good Place* to T. M. Scanlon's *What We Owe to Each Other* mirrors a path taken by many contemporary philosophy students. Scanlon's "buck-passing" account (BPA) of value is elegant and intuitive. It promises to demystify goodness by locating it not in a spooky metaphysical property, but in the concrete reasons we have to act or feel. As Scanlon famously puts it: "Being good, or valuable, is not a property that itself provides a reason to respond to a thing in certain ways. Rather, to be good or valuable is to have other properties that constitute such reasons."

  However, as you have discovered, this elegance attracts a specific kind of philosophical predator: the Wrong Kind of Reasons (WKR) problem. The case of the demon and the saucer of mud is the standard test case. If the demon threatens to torture you unless you admire the mud, you have an overwhelming reason to admire it. Yet, the mud is not admirable. If "admirable" just means "there is reason to admire," the theory implies the mud *is* admirable. This seems absurd.

  The standard defense is to restrict the account: "X is good" means "there are *the right kind* of reasons to favor X." But as you suspect, drawing the line between "right" and "wrong" kinds of reasons without secretly smuggling in the notion of value is notoriously difficult.

  Below, I will present the strongest case that the WKR problem is fatal to the buck-passing project, followed by the strongest case that the "Right Kind of Reason" (RKR) restriction rescues it. Finally, I will deliver a verdict on which side prevails.

  ***

  ### The Prosecution: The WKR Problem is Fatal

  The case against the buck-passing account rests on the charge of **circularity** and the failure of **reductive analysis**.

  Scanlon's ambition, particularly in the eyes of his readers, is to explain value in terms of something else: reasons. This is supposed to be an analysis. We want to know what goodness *consists in*. If the answer is "reasons," we must be able to identify those reasons without already knowing what goodness is. If we cannot, the analysis is empty.

  The WKR problem exposes the inability to identify the relevant reasons independently. To solve the demon case, the buck-passer must say: "The demon's threat provides a reason, but it is the *wrong kind* of reason. Only reasons that make admiration *fitting* count."

  Here lies the trap. What does "fitting" mean? In this context, to say an attitude is "fitting" is to say it is *merited* or *appropriate* given the object's value. To say a reason is of the "right kind" is to say it is a reason that bears on the *value* of the object.

  Consequently, the definition becomes:
  1.  $X$ is good if there are reasons of the right kind to favor $X$.
  2.  Reasons of the right kind are reasons that bear on whether $X$ is good (or fitting to favor).

  This is viciously circular. The theory promises to explain value in terms of reasons, but it can only identify the relevant reasons by presupposing value. As the philosopher Derek Parfit argued, if we must appeal to a notion like "fittingness" or "correctness" to filter the reasons, we haven't eliminated the normative mystery of value; we have merely renamed it.

  Furthermore, consider the "Object-Given" distinction often used to patch the theory. Defenders say RKRs are based on properties of the object (the mud is wet), while WKRs are based on properties of the state of admiring (admiring saves my life). But the demon's threat *is* a property of the situation surrounding the mud. Why is "being commanded by a demon" not a property of the object that gives a reason? The only answer the defender can give is: "Because that property doesn't make the mud *good*." Again, the explanation relies on the very concept (goodness) it was supposed to analyze.

  If the buck-passing account cannot distinguish the relevant reasons without covertly appealing to value, it fails as an account of what goodness *consists in*. It reduces to the trivial claim: "X is good if X has properties that make it good." This does not pass the buck; it catches it.

  ***

  ### The Defense: The RKR Restriction Rescues the Theory

  The defense of the buck-passing account argues that the circularity charge is a misunderstanding of the theory's aim and that the distinction between reasons can be drawn structurally, without invoking value.

  First, the defense clarifies that Scanlon was not necessarily offering a *reductive naturalistic analysis* (trying to turn value into non-normative physics), but rather a **conceptual claim within the normative domain**. The goal is to show the structural relationship between different normative concepts. Even if "reason" and "fittingness" are both normative, showing that value is *constituted* by reasons is still a substantive philosophical discovery, akin to showing that "knowledge" is "justified true belief" (even if justification is also an epistemic norm).

  Second, and more importantly, the defense argues that the **Object-Given vs. State-Given** distinction is independent of value. This distinction is borrowed from epistemology (the theory of knowledge).
  *   **Object-Given Reasons:** Reasons that bear on the *content* of the attitude. For belief, these are evidence. (e.g., "There is smoke" is a reason to believe "There is fire").
  *   **State-Given Reasons:** Reasons that bear on the *benefits of holding* the attitude. (e.g., "Believing in God will make me happy" is a reason to want to believe, but not evidence that God exists).

  We can apply this to value without circularity. In the demon case:
  *   The mud's wetness is a property of the *object* of admiration.
  *   The demon's threat is a property of the *consequences of the state* of admiring.

  This distinction is structural, not normative. We can identify whether a reason targets the content of the attitude or the consequences of holding it without knowing if the attitude is actually "fitting." The demon's threat clearly targets the consequences (my safety), not the content (the mud's qualities). Therefore, we can exclude it from the buck-passing account without needing to say "the mud isn't valuable." We simply say, "That reason is state-given, and the buck-passing account only counts object-given reasons."

  Proponents like Philip Stratton-Lake and Jonas Olson argue that this saves the theory. The "Right Kind of Reason" is not defined as "reasons that track value," but as "reasons that are object-given." Since "object-given" is defined by the *direction of fit* (mind-to-world vs. world-to-mind) rather than by value itself, the circularity is broken. The theory successfully identifies a subset of reasons that constitute value, distinguishing them from pragmatic incentives, without presupposing the conclusion.

  ***

  ### The Verdict

  Both sides present formidable arguments. The Defense offers a sophisticated structural distinction that mirrors successful distinctions in epistemology. However, after weighing the arguments, I must deliver a verdict in favor of the **Prosecution**: **The Wrong Kind of Reasons problem is fatal to the buck-passing account *as a reductive analysis of what goodness consists in*.**

  Here is why the Defense ultimately fails to clear the bar.

  The Object-Given/State-Given distinction works well in epistemology because "truth" provides a clear independent standard for what counts as evidence (object-given). In the realm of value, however, we lack an equivalent independent standard. When we ask, "Why does the mud's wetness count as an object-given reason for admiration?" the answer cannot be "because it is a property of the mud," because the demon's threat is also a property of the situation involving the mud.

  To filter the mud's wetness *in* and the demon's threat *out*, we must appeal to the **relevance** of the property to the specific attitude. We must say, "Wetness is relevant to admiration; safety is not." But what determines relevance? It is the nature of admiration itself. And what is the nature of admiration? It is an attitude that is *fitting* only when its object is admirable.

  Consequently, the distinction between Object-Given and State-Given reasons in ethics cannot be drawn purely structurally. It inevitably relies on a prior understanding of the *normative standards* governing the attitude. To say a reason is of the "Right Kind" is to say it is a reason that makes the attitude *correct*. But "correctness" in this context is synonymous with "value."

  Therefore, the user's suspicion is philosophically sound. The "patch" does relocate the problem. It moves the question from "What is value?" to "Which reasons are of the Right Kind?" But since the answer to the second question is "Reasons that track value," the analysis becomes circular.

  **The Final Judgment:**
  The buck-passing account fails as a definition that eliminates the mystery of value. It cannot tell us what goodness *is* without presupposing we already know which reasons count, which requires knowing what goodness is.

  However, this does not render Scanlon's insight useless. While it fails as a *reductive analysis*, it succeeds as a **structural claim**. It correctly identifies that value is not a separate, add-on property (like a glow on top of an object) but is inextricably linked to the reasons we have to respond to things. The WKR problem proves that value cannot be *reduced* to reasons, but it does not disprove that value *supervenes* on reasons.

  So, while the theory cannot define goodness away, your intuition remains correct: the "buck" cannot be passed entirely. At the bottom of the chain, we must accept that some reasons are simply "of the right kind" because they relate to the *fittingness* of an attitude, and fittingness is a normative primitive just as basic as value itself. Scanlon simplified the ontology of value, but he could not eliminate its normativity. The WKR problem proves that value is not just "reasons"; it is "reasons that matter," and "mattering" is where the mystery remains.
