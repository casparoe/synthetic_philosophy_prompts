      *   Use the architecture as a prop for the argument.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the core metaphor. Elena points to the actual spandrel. Marcus acknowledges but pivots to the biological equivalent.
      *   **Round 1: The Definition & The Byproduct Argument.**
          *   Elena: It's structural necessity. The jaw resorbs, the chin is what's left. No energy cost, no gene *for* a chin.
