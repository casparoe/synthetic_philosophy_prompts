      *   **The Adaptationist (let's call him Marcus):** Channels someone like Richard Dawkins or Daniel Dennett (but specifically focused on biomechanics/evolutionary psych). Emphasizes natural selection's power, specific functional advantages (speech, chewing, sexual dimorphism), and the improbability of costly traits persisting without utility.

  3.  **Setting the Scene:**
