  **Boundary Conditions**

  The tremor in Elias's left hand had become a constant, high-frequency oscillation, a noise floor he could no longer filter out. He rested it on the notebook, weighting the pen with his right palm, trying to dampen the vibration.

  "It's a violation of symmetry, Clara," he said. His voice was thin, the air in his lungs feeling like a low-pressure system. "Think about the energy investment. Thirty years of myelination. Synaptic pruning. The sheer thermodynamic cost of building a system capable of modeling its own origin."

  Clara sat on the edge of the armchair, peeling an orange. The scent cut through the smell of antiseptic and old paper. She was a biologist; she dealt in rot and regeneration, not conservation laws. "Dad, entropy isn't a moral judgment. It's just the tax."

  "It's inefficiency," Elias corrected, watching a segment of orange fall onto her knee. "And nature is parsimonious. She doesn't build capacitors just to let them discharge into the ground. If the universe is rational—and we have to assume it is, otherwise why does the math work?—then the capacity for understanding cannot be a transient state. It implies a boundary condition where the observer persists."

  He tapped the notebook. On the page was a diagram that looked less like physics and more like a map of a city that didn't exist. Loops closing into themselves.

  "You're trying to prove you won't die," Clara said softly. She didn't look up.

  "I'm proving that *death*, as a termination of function, is irrational. If I finally understand the pattern at year eighty, and the system shuts down at year eighty-one, the data is lost. The experiment is aborted. A rational architect doesn't abort the experiment at the moment of data acquisition."

  Clara placed a segment of orange on the table beside him. "Eat."

  Elias looked at the fruit. It was wet, vulnerable. "The hospital food. The medications. They introduce noise. You want me to take the sedative tonight?"

  "It'll help you sleep. You're in pain."

  "If I sleep, I lose time. If I take the sedative, the instrument is calibrated incorrectly." He pushed the orange away. "I need to be lucid for the transition. If the continuity holds, I need to witness the boundary crossing. I can't do that if I'm chemically suppressed."

  Clara stopped peeling. She looked at him, and for the first time in weeks, he saw the fear she'd been composting inside her chest. "Dad, you haven't eaten a full meal in three days. You're not preserving the instrument. You're dismantling it."

  "I'm minimizing variables."

  "You're starving."

  "I'm maintaining purity."

  It was the same logic that had kept him alive this long, the belief that the universe responded to rigor. If he could just keep the system closed, if he could just prevent the contamination of the irrelevant—the pain, the hunger, the chemical fog—then the result would be clean. The theorem would hold.

  But the room was tilting. The edges of the notebook were blurring. He realized, with a distant sort of irritation, that his body was behaving like a biological entity, not a logical one. It was demanding fuel. It was threatening to shut down the processor to save the hardware.

  "Clara," he said.

  "I'm here."

  "If I eat... will you verify it?"

  "Verify what?"

  "The food. The chain of custody." It sounded absurd even to him. He was seventy years old, a fellow of the Royal Society, asking his daughter to taste his pudding to ensure it wasn't poisoned by a universe that likely didn't care enough to poison him. But the logic required trust. If the universe was rational, it was consistent. If it was consistent, it was safe. But he couldn't verify the consistency alone. He needed a second observer.

  Clara understood. She didn't sigh. She didn't tell him he was being difficult. She picked up the orange segment he had rejected. She put it in her mouth. She chewed. She swallowed.

  "Sweet," she said. "A little acidic."

  She offered him the next one.

  Elias looked at her hand. He saw the tremor in his own reflection in her wedding band. He thought about the conservation of energy. Energy cannot be created or destroyed, only changed. Was consciousness a form of energy? Or was it the arrangement of the energy? If it was the arrangement, then death was just a scattering. A gas expanding into a vacuum.

  *Nothing is wasted,* he thought. *But everything is dispersed.*

  He opened his mouth. She placed the fruit on his tongue. It was cold. It tasted like sunlight and dirt.

  "The proof," he whispered, swallowing with difficulty. "It's not finished."

  "It doesn't have to be," Clara said. She wiped his chin with a napkin.

  "It has to be," he insisted, though the words were slurring. The boundary was approaching. The rational world he had built, the one where minds were too expensive to discard, was pressing against the irrational world where cells died because oxygen stopped arriving. "If it's not finished... it's waste."

  "Then finish it later," she said.

  "Where?"

  "Wherever the data goes."

  Elias closed his eyes. The tremor in his hand stopped, not because he willed it, but because the signal from the brain had ceased to reach the muscle. The circuit was opening. He wanted to believe the circuit was just rerouting, that the current was flowing into a new branch. He wanted to believe that the rationality of the cosmos demanded his continuation as fiercely as it demanded the orbit of a planet.

  But as the darkness rose, it didn't feel like a theorem being solved. It felt like a book being closed.

  He heard Clara breathing. That was real. He felt the weight of the pen. That was real. The rest was extrapolation.

  "Clara," he said, one last time, a final data point.

  "I'm here, Dad."

  "Don't... let it be... wasted."

  "I won't."

  He drifted. The logic held, beautifully, perfectly, in the space between neurons. And then the space collapsed. The notebook remained on the tray, the ink drying on the page, a map of a city no one would ever walk, waiting to see if the universe would bother to read it.
