answer: |-
  The conservativeness argument represents one of the most formidable technical challenges to deflationary theories of truth. To understand why, we must first clarify the deflationist's core commitment, then examine the logical result regarding Peano Arithmetic (PA), and finally evaluate whether the deflationist can reconcile the two without abandoning their central thesis.

  ### 1. The Deflationist Claim and the Conservativeness Requirement

  Deflationists (such as disquotationalists and minimalists) argue that the predicate "is true" does not denote a robust, metaphysical property. Unlike properties like "mass" or "charge," truth does not explain why a belief is successful or why a sentence holds. Instead, the truth predicate is a logical device designed to overcome expressive limitations. It allows us to endorse infinite sets of sentences (e.g., "Everything the Pope says is true") without having to list them individually.

  The central technical tool of deflationism is the **T-schema**:
  $$T(\ulcorner P \urcorner) \leftrightarrow P$$
  (Where $\ulcorner P \urcorner$ is the name of the sentence $P$.)

  A natural constraint on this view is **Conservativeness**. If truth is merely a logical device for re-expressing what we already accept, adding a truth predicate to a base theory (like arithmetic) should not allow us to prove any new sentences *in the language of the base theory*. If adding "truth" allows us to discover new facts about numbers that were previously unprovable, then truth appears to be doing substantive explanatory work—it is acting as a new mathematical axiom rather than a mere logical label.

  ### 2. The Conservativeness Argument

  The challenge arises when we formalize this in Peano Arithmetic (PA).

  1.  **The Setup:** Take PA as our base theory of arithmetic. Construct an extension, $PA_T$, by adding a new predicate $T(x)$ and axioms governing it (typically the T-schema for all sentences in the language of PA).
  2.  **The Crucial Step:** We must decide how the **Induction Schema** applies. In standard PA, induction applies to any formula $\phi(x)$ in the language. In $PA_T$, do we allow induction on formulas that contain the new truth predicate $T$?
  3.  **The Result:** If we allow **full induction** (i.e., induction ranges over formulas containing $T$), the resulting theory is **non-conservative** over PA. Specifically, $PA_T$ can prove the consistency of PA ($Con(PA)$).
  4.  **Gödel's Constraint:** By Gödel's Second Incompleteness Theorem, if PA is consistent, it cannot prove its own consistency ($PA \nvdash Con(PA)$).
  5.  **The Conclusion:** Since $PA_T \vdash Con(PA)$ but $PA \nvdash Con(PA)$, $PA_T$ proves arithmetical sentences that PA cannot. Therefore, $PA_T$ is not a conservative extension of PA.

  ### 3. Why This Threatens Deflationism

  The non-conservativeness result is thought to threaten deflationism because it suggests truth has **substantive mathematical content**.

  *   **Explanatory Power:** If the addition of the truth predicate allows us to settle arithmetical questions (like consistency) that were previously undecided, the truth predicate is functioning as a source of new mathematical knowledge. It is not merely "disquoting"; it is generating new theorems.
  *   **Metaphysical Thickness:** Deflationists claim truth is "thin." However, in the context of formal theories, "thickness" is often measured by proof-theoretic strength. A predicate that increases the proof-theoretic strength of a theory looks suspiciously like a substantive property (akin to adding a large cardinal axiom in set theory).
  *   **The "Something for Nothing" Objection:** If deflationism is correct, accepting the axioms of PA should exhaust our commitment to arithmetic. Adding a "deflationary" truth predicate shouldn't change our arithmetic commitments. The fact that it does suggests that our grasp of truth involves more than just the T-schema; it involves a substantive grasp of the model of arithmetic that transcends the base theory.

  ### 4. Deflationist Maneuvers and Their Viability

  Deflationists have proposed several strategies to evade this conclusion. The most prominent involve restricting induction or reinterpreting the requirement of conservativeness.

  #### A. Restricting Induction
  The most direct technical fix is to add the truth predicate and the T-schema but **restrict the induction schema** so that it applies only to formulas in the original language of PA, not to formulas containing $T$.

  *   **The Outcome:** This system (often denoted $PA(S)$) *is* a conservative extension of PA. It cannot prove $Con(PA)$. Thus, the technical threat is neutralized.
  *   **Is it Principled?** This is highly controversial.
      *   *The Critique:* Gödel numbering allows us to treat sentences as numbers. The truth predicate $T(x)$ thus defines a property of numbers. In PA, we accept induction for *any* definite property of numbers. To say we can induct on "x is prime" but not "x is the Gödel number of a true sentence" looks **ad hoc**. It appears the deflationist is crippling the logic of their system solely to preserve a philosophical thesis.
      *   *The Cost:* Restricting induction severely limits the utility of the truth predicate. We cannot use truth in inductive proofs, which undermines the deflationist claim that truth is useful for generalization and reasoning.

  #### B. The "Implicit Commitment" Defense
  Some deflationists (and non-deflationists like Shapiro) argue that conservativeness is the wrong standard.

  *   **The Argument:** When we accept PA, we are implicitly committed to its soundness, and thus to $Con(PA)$. We just lack the resources within PA to express this commitment. The truth predicate simply provides the expressive resources to make our implicit commitments explicit.
  *   **Is it Principled?** This is a strong defense, but it risks conceding the substantive point. If accepting PA *rationally compels* us to accept $Con(PA)$, then the move from PA to $PA_T$ is epistemically justified. However, critics argue that if truth is required to make this justification explicit, truth is playing a substantive epistemic role. It is bridging a gap that the base theory could not. This shifts deflationism from "truth adds nothing" to "truth reveals what was already there," which is a subtle but significant shift.

  #### C. Denying the Conservativeness Requirement
  A bolder move is to argue that deflationism does not entail conservativeness.

  *   **The Argument:** Deflationism is a thesis about the *nature* of the property truth (it's not a robust correspondence relation), not necessarily about the *proof-theoretic strength* of truth axioms. We can maintain that truth is not a deep metaphysical property while acknowledging that, as a logical concept, it interacts with induction to produce stronger theories.
  *   **Is it Principled?** This saves the metaphysical thesis but sacrifices the logical intuition that made deflationism attractive to many. If truth adds mathematical strength, the distinction between a "logical device" and a "mathematical posit" becomes blurred.

  ### 5. Conclusion

  The conservativeness argument demonstrates that a truth predicate governed by the T-schema, when integrated into a system with full induction, possesses significant proof-theoretic strength. This threatens the deflationist claim that truth is metaphysically and explanatorily "thin."

  Restricting induction offers a **technical** way out, preserving conservativeness, but it is difficult to defend as **principled**. It requires treating the truth predicate as logically second-class compared to other arithmetical properties, which undermines the universality of the induction principle and limits the utility of truth.

  Ultimately, the deflationist faces a dilemma:
  1.  **Accept Conservativeness:** Restrict induction, but face charges of being *ad hoc* and impoverishing the concept of truth.
  2.  **Accept Non-Conservativeness:** Allow full induction, but explain how truth can generate new mathematical knowledge without being a substantive property.

  Most contemporary consensus suggests that **strict disquotationalism** (T-schema alone) is too weak to capture our use of truth in mathematics. The debate has largely shifted toward **axiomatic theories of truth** (like Feferman's systems) that try to balance expressive power with philosophical plausibility, often conceding that while truth may not be a *metaphysically* heavy property, it is logically potent enough to exceed the bounds of the base theory. Thus, the conservativeness argument successfully forces deflationists to refine their view: truth may be "thin" in nature, but it is not "thin" in logical consequence.
