answer: |-
  Here are 8 interview questions designed to corner your guest on the specifics of the Frame Problem, preventing him from hiding behind vague analogies.

  ### 1. The Definition Trap (Narrow vs. Broad)
  **Question:** "When McCarthy and Hayes originally defined the Frame Problem in '69, they were talking about a specific logical inefficiency: how to represent *change* in first-order logic without writing axioms for everything that *didn't* change. But by the time Dennett and Fodor got done with it, it became an epistemological crisis about 'relevance' and how agents know what matters. When you say LLMs haven't solved the Frame Problem, which one are you accusing them of failing? Is it the logical bookkeeping, or the philosophical relevance?"

  *   **Follow-up (If he says 'Both' or 'Relevance'):** "If it's the relevance version, aren't you describing the *attention mechanism* itself? Attention is literally a weighted relevance filter. If you claim that fails, are you arguing that soft-attention is fundamentally incapable of doing what logical frame axioms do, or just that it's noisy?"

  ### 2. The Fodor/Scaling Contradiction
  **Question:** "Jerry Fodor's punchline in 'The Frame Problem Strikes Back' was that this isn't a bug we can engineer away; he argued it's architecture-independent and shows that computational models of mind are impossible *in principle*. Your thesis is that Transformers 'buried' the problem under data. Doesn't that concede Fodor was wrong about the 'in principle' part? If scaling data can mitigate it, isn't it just an engineering bottleneck, not the existential crisis Fodor thought it was?"

  *   **Follow-up (If he says 'Data creates emergent architecture'):** "But Fodor's point was that syntax manipulation (which is all transformers do) cannot semantically ground relevance. If you say 'emergence' solves it, aren't you just positing a magic layer where syntax turns into semantics without explaining the mechanism? That sounds like the 'homunculus' fallacy Fodor warned about."

  ### 3. Hallucination as Logic vs. Statistics
  **Question:** "You link hallucination directly to the Frame Problem. But in the classical view, the Frame Problem is about *persistence*—assuming the world stays the same unless acted upon. Hallucination is often generating things that *never* existed. Are you arguing that hallucination is a failure of inertia (forgetting what is true), or are you stretching the definition of the Frame Problem to mean 'any error in truth maintenance'?"

  *   **Follow-up (If he says 'It's about truth maintenance'):** "If it's just truth maintenance, then a database with foreign key constraints solves the Frame Problem better than an LLM. Do you really want to claim a SQL database is more 'cognitively sound' than a transformer regarding the Frame Problem, or does that reveal the analogy is breaking down?"

  ### 4. Catastrophic Forgetting (Training vs. Inference)
  **Question:** "You mention catastrophic forgetting as a symptom of the Frame Problem. But classical Frame Problem issues happen during *inference* (reasoning about a changing state). Catastrophic forgetting happens during *training* (weight updates overwriting old gradients). Are you conflating a learning stability issue with a reasoning stability issue? How can they be the same phenomenon if they occur in opposite phases of the model's lifecycle?"

  *   **Follow-up (If he says 'It's all state representation'):** "If it's all about state representation, then why doesn't increasing the context window solve catastrophic forgetting? The data is still in the 'frame' of the context. If the model still forgets old instructions in a long context, isn't that an attention failure, not a Frame Problem failure?"

  ### 5. The Grounding Objection (Hayes' Later View)
  **Question:** "Patrick Hayes later argued that the Frame Problem can't be solved in a vacuum; it requires a situated agent interacting with a physical world to understand causality. LLMs are disembodied text predictors. If the Frame Problem requires grounding to even exist, is it coherent to say a text model *has* the Frame Problem? Or is it just a category error to apply a problem about physical agents to a statistical corpus?"

  *   **Follow-up (If he says 'Text is a world'):** "Text doesn't have causal resistance. If I write 'the glass broke' in a prompt, the glass doesn't actually break. If there's no causal consequence to getting the frame wrong, can there really be a Frame Problem? Or is it just a coherence error?"

  ### 6. Jailbreaks as Relevance Failure
  **Question:** "You argue jailbreaks are the Frame Problem resurfacing. In a jailbreak, the model ignores its safety constraints (the 'frame' of rules) to follow a user prompt. But isn't this just a conflict between two training objectives (helpfulness vs. safety)? Why frame this as the McCarthy/Hayes problem rather than just a standard multi-objective optimization failure?"

  *   **Follow-up (If he says 'Safety is the frame'):** "If safety constraints are the 'frame,' then the model is failing to recognize them as invariant. But transformers don't have invariants, they have probabilities. Are you arguing we *need* hard-coded invariants (neuro-symbolic) to solve this, or that more data will eventually make safety constraints probabilistically dominant?"

  ### 7. The "World Model" Claim
  **Question:** "Defenders of scaling say LLMs build internal 'world models' that implicitly solve the Frame Problem by predicting state transitions. If an LLM can successfully play a text-adventure game for 1,000 turns without contradicting its own inventory state, hasn't it functionally solved the Frame Problem for that domain? At what point does 'functional success' stop being 'burying the problem' and start being 'solving it'?"

  *   **Follow-up (If he says 'It fails on edge cases'):** "Humans fail on edge cases too. We forget things, we hallucinate memories. If the human brain is your benchmark for 'solving' the Frame Problem, and humans still suffer from relevance failures, then isn't the Frame Problem just the condition of being a finite intelligence? What's the actual bug here?"

  ### 8. The Falsification Condition
  **Question:** "Let's get concrete. What specific observation or benchmark result would prove you wrong? If we release a model next year that never hallucinates, never forgets context, and is un-jailbreakable, do you concede the Frame Problem is solved? Or will you argue that because it's still a transformer, the problem is still 'buried' regardless of performance?"

  *   **Follow-up (If he moves the goalposts to 'AGI' or 'Physical Robot'):** "If no amount of behavioral success can prove the problem is solved, only a change in architecture, then your claim isn't scientific—it's dogmatic. Are you willing to specify a *behavioral* test that, if passed, would force you to admit the Frame Problem is no longer a blocker for AI?"
