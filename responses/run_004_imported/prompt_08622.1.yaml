          *   *Follow-up:* If he says "both," press on the mechanism.

      *   *Question 2: Fodor's Pessimism/Scaling.* The prompt specifically asks for this.
          *   *Draft:* Fodor thought scaling wouldn't work. You say it just buried it. Is there a difference?
          *   *Refinement:* Fodor argued the problem is architectural, not computational. If it's architectural, more data (scaling) shouldn't matter *in principle*, not just *in practice*. Does your "buried under data" argument concede that scaling *could* work, contradicting Fodor?
          *   *Follow-up:* If he says "data creates emergent architecture," press on the discrete vs. continuous distinction.

      *   *Question 3: Falsification.* The prompt specifically asks for this.
