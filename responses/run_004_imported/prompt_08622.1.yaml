          *   *Follow-up:* If he moves the goalposts (e.g., "it needs to be AGI"), pin him down on a near-term metric.

      *   *Question 4: Mechanism of "Burying".*
          *   *Idea:* How does data "solve" a logical problem?
          *   *Draft:* How does statistical correlation fix a logical gap?
          *   *Refinement:* McCarthy's problem was about *explicit* representation of non-change. LLMs represent nothing explicitly. Are you saying statistical likelihood is functionally equivalent to logical inertia?
          *   *Follow-up:* If he says "functionally equivalent," ask about edge cases where statistics diverge from logic.

      *   *Question 5: Catastrophic Forgetting.*
          *   *Idea:* Connect forgetting to the frame problem.
          *   *Draft:* Is forgetting the frame problem?
