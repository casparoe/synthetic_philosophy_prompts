prompt: |-
  For my side project (a podcast on the history/philosophy of computing) I've been reading up on the old McCarthy/Hayes 'frame problem' stuff, since people keep blaming it for why LLMs hallucinate and forget things. Next guest is an ex-AI-researcher-turned-philosopher (not a real person, just play him as a committed defender of this) who argues transformers never actually solved the frame problem, they just buried it under enough training data, and that hallucination, catastrophic forgetting and jailbreaks are literally that same old problem resurfacing, not unrelated bugs. Give me like 8 interview questions that don't just let him restate that thesis -- I want one that pins down whether he means the narrow McCarthy/Hayes version or the bigger Dennett/Fodor 'relevance' version (I think hes blurring the two together), one that makes him deal with Fodor's own pessimism that this is architecture-independent so scaling shouldn't help even in principle, and a last one on what observation would actually prove him wrong. Toss in a quick follow-up on each for the answer he'll probably dodge into.
