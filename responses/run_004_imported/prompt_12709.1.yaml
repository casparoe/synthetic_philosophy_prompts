answer: |-
  **MEMORANDUM**

  **TO:** Saving Wildcat Steering Committee & Project Partners
  **FROM:** External Advisory Panel
  **DATE:** 14 February 2024
  **SUBJECT:** Recommendation Regarding Founder Cohort Scoring Thresholds

  **Recommendation**
  The Advisory Panel recommends the immediate inclusion of the four borderline founder candidates (IDs: SC-24-09 through 12) in the spring breeding pool. To facilitate this, we advise a temporary, cohort-specific adjustment to the admixture/pelage scoring cutoff for the **Founder Cohort only**. This adjustment must be coupled with a mandated review of the threshold methodology to be completed within 12 months.

  **Genetic Imperative**
  The primary objective of this programme is the establishment of a self-sustaining population. With a founder base this narrow, the exclusion of two genetically viable individuals based on marginal scoring differences presents a quantifiable risk of inbreeding depression. The four candidates in question fall within the statistical noise of the testing methodology; distinguishing between them as "wildcat" versus "hybrid" is biologically unsupported. Losing 50% of this specific genetic cluster reduces heterozygosity in the F1 generation, directly contradicting the programme's conservation goals. In conservation biology, genetic diversity is the currency of survival; we cannot afford to deplete the reserve based on a false precision.

  **Addressing Programme Integrity**
  We acknowledge the concern that adjusting the threshold undermines the project's public and legal standing. The argument that "moving the line admits there was never a principled line" is valid, but it rests on a misconception. The current hard cutoff is a **management tool**, not a biological law. Introgression is a gradient, not a binary state. Pretending otherwise offers rhetorical simplicity but scientific inaccuracy.

  To the "slippery slope" objection: If we move the line without explanation, we invite cynicism. If we move the line *transparently*, acknowledging the tool's limitations while prioritizing species survival, we demonstrate scientific rigour. The integrity of the project rests not on rigid adherence to an arbitrary number, but on the honesty of our decision-making process. We are not moving the goalposts; we are acknowledging that the field is not flat.

  **Safeguards & Precedent**
  To prevent this from becoming a precedent for future convenience:
  1.  **Founder Exception:** This adjustment applies strictly to the initial Founder Cohort. Future generations will be subject to the established threshold or a revised methodology (see below).
  2.  **Methodology Review:** The Genetics Subcommittee is tasked with presenting a refined scoring framework (e.g., tiered risk categories rather than binary inclusion/exclusion) by Q1 2025.
  3.  **Public Framing:** Communications should frame this as a "Genetic Rescue" measure necessitated by the critical scarcity of founder stock, rather than a change in the definition of a wildcat.

  **Timeline**
  *   **Immediate:** Approval of the four candidates for spring pairing.
  *   **March 2024:** Public statement issued alongside breeding announcements, emphasizing genetic viability.
  *   **January 2025:** Delivery of revised long-term threshold methodology.

  **Signed,**
  **External Advisory Panel, Saving Wildcat Project**
