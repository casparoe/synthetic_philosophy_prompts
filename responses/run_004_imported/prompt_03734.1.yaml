      *   *Step 4: The Nuance (Where the TA might have a point).* Bentham isn't an anarchist. If AI leads to *net* pain (isolation, atrophy of social skills leading to future pain), he'd regulate. But the burden of proof is on the regulator.
      *   *Conclusion:* Bentham would likely be permissive but empirically vigilant. He would condemn the *stigma* against AI sex as "Antipathy."

