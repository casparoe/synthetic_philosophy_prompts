  2.  **Deconstruct Bentham's Framework (relevant to the prompt):**
      *   **The Principle of Utility:** Maximize pleasure, minimize pain.
      *   **The Principle of Asceticism:** Bentham rejects this (suffering for suffering's sake or denying pleasure for moral purity).
      *   **The Principle of Sympathy/Antipathy:** Bentham rejects this (disliking something without a utility-based reason).
      *   **Harm Principle (proto-Millian):** If an act harms no one else, the law shouldn't touch it. "Self-regarding" acts.
      *   **Moral Standing:** "The question is not, Can they reason? nor, Can they talk? but, Can they suffer?" (Animals count because they suffer).
      *   **Population Arguments:** Bentham rebutted the idea that homosexuality reduces population. He cared about actual aggregate happiness, not abstract state power.
      *   **Quantitative Hedonism:** Pushpin = Poetry if pleasure is equal. No inherent dignity in "natural" acts.

  3.  **Apply Framework to AI Companions/Sex Robots:**

      *   *Issue 1: The Moral Status of the AI.*
          *   Bentham's criterion for moral standing is *sensitivity* (sentience/suffering).
          *   Current AI/Robots: Not sentient. No capacity for pain.
          *   *Bentham's Verdict:* The robot itself is morally neutral property. It has no interests to weigh in the calculus. This makes it distinct from animals (which he defended) and humans. It aligns more with a "tool" like a dildo or a book, but interactive.
          *   *Implication:* No *direct* harm to the AI.

      *   *Issue 2: The User's Pleasure.*
