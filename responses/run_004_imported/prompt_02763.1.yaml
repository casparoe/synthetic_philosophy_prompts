answer: |-
  The mud in Hungary did not behave like the mud of the steppe. Steppe mud dried hard and rang under hooves; this clay sucked at the boots, greedy and cold, swallowing wagon wheels to the axle.

  Inside the command tent, the air smelled of wet wool and fermented mare's milk. Subutai stood over a table covered in scraped hides. His finger traced the line of the Danube, then stopped at a cluster of inked circles. Stone. Too many of them. They did not burn like the wooden towns of the Rus. You had to starve them out, or build engines that required timber they had to drag hundreds of miles behind the army.

  Batu Khan paced the length of the rug, the heels of his boots thudding softly. He was looking east, not west. Every time the flap stirred, his head snapped toward the entrance.

  "The supply wagons are half-empty," Subutai said, not looking up from the map. "The horses are thin. The grass here is too wet."

  "The horses will eat when we reach the next valley," Batu said. His voice was tight. "The scouts say the land beyond the river is open."

  "The land is open. The castles are not." Subutai tapped one of the inked circles. "We bypass them, they cut our lines. We stop to take them, the spring thaw boggs the engines. We are stretching the bowstring until the wood grains show."

  Batu opened his mouth to reply, but the flap lifted. A rider stood there, coated in dried foam and dust, the color of old bone. He did not bow low. He did not need to. The silence in the tent deepened until the only sound was the drip of water from a tent pole.

  The rider stepped forward and whispered to Batu.

  Batu froze. The tension left his shoulders, replaced by a sudden, rigid stillness. He looked at the rider, then at the empty air, then at Subutai. The General saw the change in the Prince's eyes. It wasn't grief. It was a shifting of weight. The center of gravity had moved. The world had tilted back toward Karakorum.

  "The Great Khan is dead," Batu said. The words were flat. "The kurultai must convene."

  Subutai looked down at the map. His finger hovered over the Danube. Behind it lay the Western Ocean, a place no Mongol horse had ever tasted. He could see it for a second, clear as the ink on the hide: the banners flying over a sea of green, the riders pushing until the water broke against their boots. A world finished.

  Then he looked at the horses tethered outside, ribs showing through wet coats. He looked at the stone circles on the map that had stopped burning three weeks ago. He looked at the mud that had swallowed two supply carts that morning.

  "The law is the law," Subutai said.

  "Break camp," Batu ordered. "We ride for the east."

  Subutai rolled the hide map. He tucked it into his belt. Outside, the horns began to sound, a low mournful note that drifted over the camp. The soldiers moved with practiced efficiency, packing felt tents and sharpening stirrups. They turned their faces east, toward the dry grass, toward the election, toward home.

  Subutai stood at the flap and watched them turn. He watched the rear guard ignite the remaining wagons rather than drag them through the clay. The smoke rose thick and black into the grey spring sky, hiding the stone castles in the distance, hiding the road west.

  He touched the hilt of his sword, feeling the balance of it, and wondered if the horse would have held out another month. He wondered if the stone would have cracked. He wondered if the death was a wall, or just a door they were finally allowed to walk through.

  The smoke blew east, toward the steppe. The mud held the print of the hooves, deep and clear, pointing away from the ocean.
