          *   *Analogy:* Writing a database schema (Logical) vs. Deciding which data matters for a business decision (Epistemological).

      *   **Part 3: Engineering Fixes vs. Fodor's Worry:**
          *   *Engineering Fix:* Successor-state axioms assume a closed world or explicit causal models. Re-planning with refreshed state (what the user is doing) forces a "reset" of relevance.
