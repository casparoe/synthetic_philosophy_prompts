          1.  *Narrow/Logical (McCarthy & Hayes, 1969):* How to represent action effects without explicitly listing non-effects (frame axioms). Solved (allegedly) by successor-state axioms (Reiter), etc.
          2.  *Broad/Epistemological (Dennett, Fodor):* How does a reasoner determine *what* is relevant to update? The problem of holism/isotropy in belief revision. Fodor uses this to argue against computational models of central cognition.
      *   **Task:** Compare these two versions in depth.
