      *   **Introduction:** Validate the user's experience. Acknowledge the confusion is widespread and legitimate. State the thesis: They are related but distinct; the engineering solution solves the syntax, not the semantics of relevance.

      *   **Part 1: The Two Frame Problems (Defining the Terms):**
          *   *The Logical/Representational Frame Problem (McCarthy & Hayes):* It's about efficiency and succinctness in formal logic. If I paint a block red, I don't want to write axioms saying its location, weight, and owner didn't change.
