      *   *Reiter (1991):* Successor-state axioms effectively solve the representational frame problem in situation calculus.
      *   *Dennett (1984, "Cognitive Wheels"):* Popularized the idea that the frame problem is a deep epistemological problem for AI. He argues AI researchers often dismiss the narrow problem without solving the deep one.
      *   *Fodor (1983, "Modularity of Mind"; 2000, "The Mind Doesn't Work That Way"):* Argues central processes are isotropic (any belief can relate to any other) and Quinean (confirmation is holistic). Therefore, they cannot be computational (local).
