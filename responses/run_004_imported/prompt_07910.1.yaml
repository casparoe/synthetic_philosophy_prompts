      *   **Paragraph 2 (Kitcher/Psillos "Divide et Impera"):**
          *   *Content:* Explains the distinction between "working posits" and "idle posits." Uses Fresnel's ether (idle) vs. Fresnel's equations (working). Mentions Arago/Poisson spot. Claims the math carried forward to Maxwell.
