  7.  **Refining the "Worrall vs. Divide et Impera" distinction:**
      *   *Self-Correction:* Actually, the relationship between Psillos's "Divide and Conquer" (Selective Realism) and Worrall's Structural Realism is a matter of debate. Psillos argues his view *subsumes* structural realism. However, the prompt asks why SR is *usually presented as a separate strategy*.
      *   *Standard View:* SR says "We can't know the nature of the entities, only the structure." Divide & Conquer says "We can know some entities are real (working posits) and some aren't (idle posits)."
      *   *Student's Error:* The student says SR lets us trust entities "like the ether." This is the opposite of Worrall. Worrall says the ether was the *wrong* ontology, but the *structure* (equations) was right.
