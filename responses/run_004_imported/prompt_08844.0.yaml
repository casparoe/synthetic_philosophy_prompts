      *   *Prompt Requirement 2:* Reconstruct, *as precisely as you can*, the actual premises of the afterlife argument specifically.
          *   *Student:* "Since the soul isn't a machine, there's no physical process... that could straightforwardly destroy it."
          *   *Verdict:* **Incorrect.** This is the dealbreaker. The prompt asks for the *actual premises*. The student provided a generic dualist inference, not Gödel's specific argument (which hinges on the rationality of the world and the concept of personality/monads).
      *   *Prompt Requirement 3:* Reasoning hangs together.
