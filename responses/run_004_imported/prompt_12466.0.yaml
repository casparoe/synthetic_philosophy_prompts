      *   *The "Just Relocates" Critique:* Many philosophers (e.g., Putnam, Davidson, Chomsky) argue that Quine conflates *epistemic* underdetermination (we can't know which is true) with *ontological* indeterminacy (there is no fact of the matter). The argument from above assumes that if evidence doesn't decide, reality doesn't decide. That's a verificationist leap.
