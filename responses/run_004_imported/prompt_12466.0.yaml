          *   *Implication:* If physics is underdetermined, and ordinary objects are part of that theoretical web, then ordinary reference is *also* indeterminate, not just exotic terms like "gavagai." It removes the "home court" advantage of our own language.

  3.  **Address "Why Above is Deeper" (Quine's View):**
      *   *From Below:* Suggests indeterminacy is a problem of *translation* between languages. It leaves a loophole: Maybe translation is indeterminate, but *homophonic* translation (my language to myself) is determinate. Maybe *I* know what *I* mean.
