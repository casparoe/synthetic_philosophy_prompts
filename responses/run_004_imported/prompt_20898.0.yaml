answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two colleagues, Elena and Marcus, are finishing coffee after a seminar where the students recited the "panda's thumb" and "male nipples" examples with frustrating ease.*

  **Elena:** The students were fluent today, I'll give them that. Gould and Lewontin's "Spandrels" paper is clearly on the syllabus. But fluency isn't understanding. They treat the byproduct view as a default setting. If you can't name the function immediately, it's a spandrel.

  **Marcus:** That's exactly why I pushed the female orgasm case. It forces them out of the abstract. Elisabeth Lloyd's work is the perfect antidote to the "default setting" problem. She doesn't just say "adaptationists are wrong"; she audits them. She goes through the upsuck hypothesis, the sperm retention hypothesis, the pair-bonding account, and asks for the design features.

  **Elena:** And she finds them wanting. I know the argument. The rate of orgasm via intercourse alone is too low and too variable to support a function tied to conception or sperm retention. But Marcus, I worry the students are walking away with a different lesson than the one Lloyd intended. They're learning that if the homology is clear—clitoris and penis sharing developmental pathways—the adaptive question is closed.

  **Marcus:** Is it closed? Or is it just that the homology provides a sufficient explanation without invoking selection?

  **Elena:** That's the slide I'm worried about. "Sufficient explanation" becomes "proof of non-adaptation." Look, the fact that the clitoris and penis are homologous structures tells us about the *origin* of the tissue, not necessarily the *maintenance* of the function. Bird wings are modified forelimbs. They share developmental machinery with non-flying ancestors. Does that mean flight is a byproduct of walking?

  **Marcus:** No, because in the case of the wing, you have the design features. You have hollow bones, specific muscle attachments, aerodynamic shaping. The structure is fitted to the function. Lloyd's point isn't just "it's homologous to the penis, so it's a spandrel." That would be the lazy reading. Her point is: "It's homologous to the penis, *and* it lacks the design features necessary to perform the functions adaptationists propose."

  **Elena:** But which functions? She dismantles the conception-based hypotheses effectively. The "upsuck" theory requires reliable orgasm during intercourse, which we don't see. But what about the pair-bonding hypothesis? Or the assessment of genetic quality? These don't require every instance of intercourse to result in orgasm. They require a statistical incentive structure.

  **Marcus:** And there we hit the evidential wall. If the function is pair-bonding, where is the mechanism linking orgasm specifically to bond maintenance, distinct from the general pleasure of sex? If the function is assessing genetic quality, where is the sensitivity to MHC compatibility in the orgasmic threshold? Lloyd's standard is explicit: you don't get to posit a function and then explain away the lack of fit by saying the selection pressure was weak or complex. If you claim it's an adaptation, show me the engineering.

  **Elena:** Isn't that standard too rigid for behavioral traits? We don't demand that every adaptation be a mechanical lock-and-key. Consider language. It's surely adaptive. But there's immense variability in proficiency, and it relies on pre-existing cognitive machinery. If a skeptic applied Lloyd's "design standard" to language in 1970, they might have called it a byproduct of general intelligence.

  **Marcus:** But language has a universal grammar, specific neural substrates, and a developmental trajectory that is robust across environments. Female orgasm has... what? High variability. In some studies, a significant percentage of women report rarely or never experiencing orgasm from intercourse alone. If this trait were under strong selection for a function tied to intercourse, that variance should be selected against. The noise isn't just noise; it's a signal that there's no stabilizing selection pressure.

  **Elena:** Or it signals that the selection pressure is frequency-dependent, or that the trait is condition-dependent. You're assuming that because the "intercourse-only" rate is low, the trait isn't serving an adaptive role in the contexts where it *does* occur. You're treating the absence of a specific design feature—reliable coital triggering—as positive evidence for the byproduct view.

  **Marcus:** I am. Because the byproduct view predicts exactly that profile. If female orgasm is the developmental echo of male orgasm, selected for in males for sperm expulsion, then in females, we expect the neural circuitry to exist but to be loosely coupled to the specific act of reproduction. We expect variability. We expect it to require stimulation that mimics the male developmental trigger rather than the vaginal friction of intercourse. The data fits the byproduct model better than it fits the adaptation model.

  **Elena:** "Fits better." That's the methodological hinge, isn't it? You're saying the byproduct hypothesis is confirmed because the data matches its prediction of "messiness." But adaptationism doesn't predict "perfection." It predicts "better than the alternative." If the alternative is *no* function, and we find *some* correlation between orgasm and partner retention, or *some* physiological change that aids retention, isn't that a live hypothesis?

  **Marcus:** Not if it's just a correlation. That's the "just-so" trap. Any trait will correlate with *something*. If I say orgasm is for attracting fairies, and women who have orgasms sometimes see fairies, I have a correlation. Lloyd's demand is for *design*. Show me that the physiology is *shaped* to do the job. The clitoral position, the neural mapping—it looks like the male map projected onto female anatomy, not like a structure engineered for sperm retention or pair-bonding.

  **Elena:** So here is where I think we are actually disagreeing, and where I want the students to focus. You are treating the failure to identify a specific design feature as evidence *for* the byproduct status. You're treating the null hypothesis as a positive claim.

  **Marcus:** I'm treating the lack of design as evidence that selection didn't shape the trait for that purpose.

  **Elena:** But "didn't shape for *that* purpose" isn't "didn't shape for *any* purpose." My worry is that Lloyd's standard effectively immunizes the byproduct view. As long as the adaptationist can't produce a blueprint, the byproduct theorist claims victory, even if the adaptationist can show the trait confers a fitness benefit.

  **Marcus:** And my worry is that without Lloyd's standard, the adaptationist wins by exhaustion. They propose ten functions; you shoot down nine; they propose an eleventh. Without the demand for design features, there's no way to stop the story-spinning.

  **Elena:** So, if we strip this down to the single point we need the seminar to grapple with... It's not about the homology. We agree the homology exists. It's not even about the data; we agree orgasm is variable and coitally unreliable.

  **Marcus:** Right. The disagreement is about the **inferential weight of missing design features.**

  **Elena:** Precisely. For you, the absence of a reliable mechanism linking the trait to a specific fitness benefit is positive evidence that the trait is a byproduct. For me, it is merely a gap in our current understanding of the adaptive landscape.

  **Marcus:** So the question for the students is: Does the failure to meet the design standard count as a falsification of adaptationism in this case, or does it simply mark the boundary of current knowledge?

  **Elena:** And the corollary: Is the "byproduct" explanation a scientific hypothesis that makes risky predictions, or is it a placeholder for "we haven't found the function yet"?

  **Marcus:** If Lloyd is right, it makes a risky prediction: that further research will continue to find variability and lack of functional fit.

  **Elena:** And if I'm right, the prediction is that the "lack of fit" is itself a feature of a complex adaptive system we haven't modeled correctly yet.

  **Marcus:** Then that's the assignment. Not "who won, Gould or the adaptationists?" But: "Under what conditions does the absence of design evidence become evidence of absence?"

  **Elena:** I'll write that on the board for next week. It's much harder than reciting the panda's thumb.

  **Marcus:** That's why they're in grad school.
