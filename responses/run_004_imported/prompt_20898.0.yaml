      *   Adaptationist presses on homology/developmental machinery? (Yes).
      *   Byproduct theorist presses on Lloyd's evidential standard/just-so stories? (Yes).
      *   Byproduct theorist highlights variability/coupling? (Yes).
      *   End on isolated point of disagreement? (Yes).

  *(Self-Correction on the "Single Point"):* It needs to be very precise. It's not just "burden of proof." It's about whether **trait variability and low reliability constitute a disproof of adaptation or merely a constraint on it.** Lloyd says if it were an adaptation for X, it should reliably do X. Adaptationist says selection is messy. The hinge is: **Does the absence of reliable design features count as positive evidence for the byproduct view, or merely as a gap in the adaptationist view?**

  Let's write.

  *Characters:*
  *   **Elena (Adaptationist):** Defends the possibility of adaptation, critiques the homology argument.
  *   **Marcus (Byproduct Theorist):** Defends Lloyd's critique, emphasizes design standards.

  *Setting:* Office hours or coffee after class. Let's go with coffee.

  *Drafting thought:* Make sure to mention the "upsuck" theory and pair-bonding to show knowledge of the specific hypotheses Lloyd critiques.

