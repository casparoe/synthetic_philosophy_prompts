answer: |-
  First off, major respect on the leap from finance to pottery. That nausea you're feeling? Sartre would say it's the dizziness of the cliff edge—you realize *you* are the one holding you back from jumping, but also the one holding yourself safe. It's not a bug; it's the feature. But you're right: telling someone starving that they are "radically free to eat" is unhelpful at best, cruel at worst.

  Here are 10 questions designed to corner a specialist on the actual tensions in Sartre's work, rather than letting them give a Intro to Existentialism 101 lecture. I've included the specific follow-ups you asked for to keep her honest.

  ### 1. The Paradox of Bad Faith (The "Censor" Problem)
  **Question:** In *Being and Nothingness*, Sartre insists consciousness is translucent; there is no Freudian unconscious where motives can hide. Yet, bad faith requires self-deception. If I am deceiving myself, I must know the truth to hide it, but if I know the truth, I'm not deceived. Who is the liar and who is the lied-to in a consciousness that is one unified field? How is this psychologically possible without a "censor"?
  **Follow-up:** If she argues it's a "pre-reflective project" rather than a lie: "But doesn't calling it 'pre-reflective' just rename the problem? If I can't reflect on it to catch myself, in what meaningful sense am I responsible for the deception?"

  ### 2. Radical Freedom vs. Material Oppression
  **Question:** A common critique of early Sartre is that "radical freedom" trivializes actual oppression. If the prisoner and the guard are ontologically equally free, does the concept lose its political bite? Are we risking victim-blaming by suggesting the oppressed are complicit in their own facticity?
  **Follow-up:** If she says "Ontological freedom is distinct from practical freedom": "Does that distinction matter to the person in chains? If my ontological freedom doesn't translate to practical agency, is it just a metaphysical consolation prize?"

  ### 3. The Marxist Turn (Critique of Dialectical Reason)
  **Question:** In his later work, specifically the *Critique of Dialectical Reason*, Sartre introduces the "practico-inert"—the way material scarcity and past human actions solidify to limit current freedom. Is this a quiet admission that *Being and Nothingness* was too individualistic? Does the practico-inert actually do the heavy lifting of explaining oppression that "bad faith" couldn't?
  **Follow-up:** If she claims it's a seamless evolution: "Then why does the tone shift from 'I am condemned to be free' to an analysis of collective scarcity? Isn't that a fundamental shift in where the constraint comes from?"

  ### 4. The Missing Ethics of Authenticity
  **Question:** Sartre is excellent at diagnosing inauthenticity (the waiter playing at being a waiter), but he famously never published the ethics book he promised. Beyond "owning your freedom," is there a *positive* content to authenticity? Is it a specific mode of action, or just an aesthetic style of living?
  **Follow-up:** If she says "It's situational and can't be codified": "If it can't be codified or taught, how do we distinguish an authentic Nazi from an authentic resistor? Doesn't 'situational' risk becoming 'anything goes'?"

  ### 5. Facticity and the Body (The "Nausea" Angle)
  **Question:** You have the in-itself (objects) and the for-itself (consciousness), but the body seems to straddle both. When I feel nausea or fatigue, my body feels like an object dragging me down. Does Sartre ever successfully reconcile the body as something I *am* versus something I *have*, or does it remain a site of conflict?
  **Follow-up:** If she references the "body as lived": "But in *Nausea*, Roquentin experiences the sheer contingency of existence as physically repulsive. Is that nausea a failure of authenticity, or an unavoidable encounter with the in-itself?"

  ### 6. The Look and intersubjectivity
  **Question:** "Hell is other people" suggests that being seen objectifies me, stealing my freedom. But human life is deeply collaborative (like making art or running a podcast). Is there any room in Sartre's ontology for a non-predatory relationship where two freedoms recognize each other without turning one another into objects?
  **Follow-up:** If she mentions "We-subjects" from the later work: "Does that require a third party to unify us? If so, is genuine intimacy only possible when we are both looking at something else, never at each other?"

  ### 7. Responsibility for the World
  **Question:** Sartre claims I am responsible for everything, even a war I didn't start, because I sustain the world in which that war happens. This seems like an impossible burden. Is this total responsibility a useful tool for political mobilization, or does it lead to paralysis because the scope is too vast?
  **Follow-up:** If she argues it prevents passivity: "Can't it also lead to a messianic complex? If I'm responsible for everything, do I become convinced only *I* can fix it?"

  ### 8. Literature vs. Philosophy
  **Question:** Sartre wrote *Nausea* and *No Exit* alongside his philosophical treatises. Did he feel philosophy was insufficient to capture lived experience? Is the *feeling* of bad faith actually more accessible in his fiction than his phenomenological descriptions?
  **Follow-up:** If she says they serve different purposes: "But if the philosophy describes the structure of reality, and the fiction describes the experience, and they conflict, which one should we trust as the 'truer' Sartre?"

  ### 9. Time and the Project
  **Question:** Sartre says we are "what we are not yet" (our future projects) and "not what we are" (our past). If I quit a stable job to become a potter, am I defined by the finance job I fled or the pottery I haven't mastered yet? Does this ontology make it impossible to ever *be* anything, including happy?
  **Follow-up:** If she says "You are your project": "What happens when the project fails? If I can't make a living at pottery, does my existence lose its justification, or was the value in the projecting itself?"

  ### 10. Sartre in the Age of Algorithms
  **Question:** Sartre argued against psychological determinism. Today, we have algorithms predicting our choices before we make them and neuroscience mapping decision pathways. Does "radical freedom" still hold up when our "facticity" includes data profiles that know us better than we know ourselves?
  **Follow-up:** If she says "Predictions aren't causes": "But if an algorithm can manipulate my facticity to nudge my choice with 99% accuracy, is the remaining 1% freedom enough to carry the weight of Sartrean responsibility?"

  ### A Quick Tip for the Host
  Since you're living this right now, don't be afraid to use your pottery/finance transition as the *setup* for Question 5 or 9. It grounds the abstract metaphysics in real stakes. For example: *"I recently left finance for pottery, and people call it 'freedom,' but it feels like nausea. Sartre says we are our projects..."*

  Good luck with the interview. If she dodges the "who is deceiving whom" question on bad faith, she's probably reciting a textbook. Push on that one; it's the crack in the foundation where the real philosophy lives.
