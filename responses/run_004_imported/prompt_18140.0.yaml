      *   **The Questions:**
          1.  Is the DS's math sound *as far as it goes*?
          2.  What specific conditions must be true for the DS's confidence to be justified (beyond just numbers)?
          3.  Is the MR's objection precise/checkable or just vague intuition?
          4.  Mechanics question: What happens if raters are right *less* than half the time (<50%)?
      *   **Goal:** Provide a clear, logically rigorous explanation to help the journalist write an accurate piece, avoiding vague "it's complicated" hand-waving.

  2.  **Deconstruct the Data Scientist's Argument:**
      *   **Core Concept:** Condorcet's Jury Theorem.
      *   **Premise:** Individual accuracy $p > 0.5$.
      *   **Mechanism:** Majority vote among $n$ independent voters.
      *   **Conclusion:** As $n \to \infty$, probability of correct majority verdict $\to 1$.
      *   **Validity:** Mathematically, this is correct *if* the assumptions hold.
      *   **Key Assumption:** *Independence*. Voters must make errors independently of each other.

  3.  **Deconstruct the Researcher's Objection:**
      *   **Core Concept:** Systematic Bias / Correlated Errors.
      *   **Argument:** If errors are correlated (everyone makes the *same* mistake), the crowd converges on the wrong answer with high confidence.
      *   **Validity:** This is a precise, checkable critique of the independence assumption. It's not just "crowds can go wrong"; it's "crowds go wrong when signals are shared or biases are common."
      *   **Real-world application:** Online misinformation often exploits shared cognitive biases or relies on shared sources (echo chambers), violating independence.

  4.  **Address the Mechanics Question (<50% Accuracy):**
      *   **Core Concept:** Inversion of Condorcet's Theorem.
      *   **Scenario:** Individual accuracy $p < 0.5$ (worse than chance).
      *   **Outcome:** As $n \to \infty$, probability of correct majority verdict $\to 0$. The crowd becomes *confidently wrong*.
      *   **Nuance:** If you know $p < 0.5$, you can just flip the verdict. But in fact-checking, you usually don't know the ground truth beforehand, so you can't flip it.

  5.  **Synthesize the "Hidden Assumption":**
      *   The DS is relying on *Conditional Independence*.
      *   Given the truth (True/False), Rater A's vote provides no information about Rater B's vote.
      *   In reality, raters share culture, political leaning, exposure to the same viral posts, and cognitive biases. This creates *correlation*.
