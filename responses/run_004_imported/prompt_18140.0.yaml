      *   *Section 3: The Researcher's Objection.* Validate the MR. It's not vague; it's about the *structure of error*. If errors are systematic, $N$ doesn't help.
      *   *Section 4: The <50% Scenario.* Explain the "confidently wrong" outcome. This is crucial for the "deceptive category of claims" part of the prompt.
      *   *Section 5: Journalistic Angles.* Give specific questions the writer can ask or concepts to explore (e.g., "common signal," "bias vs. variance").

  7.  **Refining the Explanation (Self-Correction/Polishing):**
