      *   *Selection:* I'll stick with RCV as the primary recommendation because it's the standard antidote to the "spoiler effect" described. Approval is a close second, but RCV is more familiar to students who might have encountered it in municipal elections (like NYC or Maine).

      *(Self-Correction)*: Actually, looking at the prompt again, the user wants a *specific* method. RCV is the safest bet for institutional buy-in. I will write the memo recommending RCV.

      *Wait, let's consider Approval Voting again.* Some voting theorists prefer Approval over RCV because RCV can fail monotonicity. However, for a task force trying to solve *vote splitting*, RCV is the more intuitive sell. I will stick with RCV but acknowledge the trade-offs.

      *Wait, let's consider the "Dana" engagement more deeply.* The prompt asks to "actually engage with Dana's manipulability point." I need to make sure I don't just wave it off. I need to explain *why* we choose a system that is still manipulable. The answer is: We optimize for *sincere expression* under realistic conditions, not theoretical worst-cases.

      *Timeline:*
