answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Association Board of Directors
  **FROM:** Election Reform Task Force
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Voting Method Reform (Fall Implementation)

  ### Executive Summary

  Following the irregularities in the Spring Presidential Election, the Task Force was charged with evaluating the Association's voting method. Our review concludes that the current **Plurality (First-Past-The-Post)** system is structurally vulnerable to vote-splitting, as evidenced by the Spring outcome where a candidate with low broad support won due to fragmentation among similar alternatives.

  We recommend adopting **Ranked-Choice Voting (RCV)**, specifically the Instant Runoff method, for all single-winner executive elections. This change mitigates the "spoiler effect," encourages sincere voting, and ensures the winner commands a majority of active preferences. We propose a rollout timeline that allows for bylaw amendments and voter education before Fall nominations open.

  ### Background: The Spring Election Failure

  In the Spring election, two candidates with overlapping platforms split the majority of the electorate, allowing a third candidate—who was broadly ranked lower by the coalition of the other two—to win with a mere plurality. Under Plurality voting, voters are forced to choose between voting for their *preferred* candidate or a *viable* candidate. This creates a pressure to vote insincerely (strategically) to avoid "wasting" a vote. The Spring result demonstrates that when voters attempt to vote sincerely under Plurality, the outcome can be unrepresentative.

  ### Theoretical Framework: Addressing Manipulability

  During our deliberations, we engaged deeply with the **Gibbard-Satterthwaite theorem**, which proves that any ranked voting system with three or more candidates is theoretically manipulable (i.e., there exist scenarios where a voter benefits from voting insincerely). A common interpretation of this theorem is that "all systems are equally flawed."

  We reject this interpretation for the purposes of institutional design. While no system is *immune* to strategy, systems differ vastly in the **informational burden** required to manipulate them successfully and the **frequency** with which manipulation is necessary to achieve a representative outcome.

  1.  **Barrier to Strategy:** In Plurality voting, strategic voting is often *necessary* for a voter's preference to count. A voter must know polling data to determine if their favorite candidate is "viable." In RCV, a voter can rank their true favorite first without penalty; if that candidate is eliminated, their vote transfers. The information required to game RCV is significantly higher than the information required to game Plurality.
  2.  **Normative Goals vs. Strategy-Proofness:** We acknowledge that a "Random Dictator" system (selecting one ballot at random to decide the election) is strategy-proof. However, we reject this because our goal is not merely to eliminate strategy, but to maximize **legitimacy** and **representation**. A system can be manipulable in edge cases but still produce more representative outcomes in practice.
  3.  **Sincere Expression:** The metric for our recommendation is not "Is this system perfect?" but "Does this system reduce the incentive for insincere voting in realistic scenarios?" RCV allows voters to express nuance (1st, 2nd, 3rd choice) rather than forcing a binary decision between "hope" and "pragmatism."

  ### Recommendation: Ranked-Choice Voting (Instant Runoff)

  We recommend adopting Ranked-Choice Voting for the President, Vice-President, and Treasurer positions.

  **How it works:**
  Voters rank candidates in order of preference (1, 2, 3...). If a candidate receives over 50% of first-choice votes, they win. If not, the candidate with the fewest votes is eliminated, and their votes are transferred to those voters' next choices. This continues until a candidate crosses the 50% threshold.

  **Why RCV over Approval Voting?**
  We considered Approval Voting (voting for as many candidates as you like). While Approval is simpler and also mitigates vote-splitting, RCV is superior for our specific context because:
  *   **Majority Mandate:** RCV guarantees the winner has support from a majority of voters, whereas Approval can elect a candidate with broad but shallow support who is intensely disliked by a majority.
  *   **Expressiveness:** RCV allows students to distinguish between "my first choice" and "my acceptable compromise," which better reflects the nuanced politics of a graduate association.

  **Why RCV over Plurality?**
  *   **Eliminates Spoilers:** Candidates with similar platforms can run without fear of splitting the vote, leading to a more diverse field of ideas.
  *   **Reduced Negativity:** Candidates are incentivized to seek second-choice rankings from opponents' supporters, discouraging attack campaigns.

  ### Implementation Timeline

  To ensure the new system is ready for the Fall Election cycle, we propose the following schedule:

  *   **Week 1 (Current):** Task Force finalizes recommendation (this memo).
  *   **Week 2:** Board votes to accept recommendation and authorizes bylaw amendment drafting.
  *   **Weeks 3-4:** Legal/Bylaw review of the amendment language.
  *   **Week 5:** Board ratification of bylaw changes.
  *   **Weeks 6-8:** **Vendor Selection & Setup.** We recommend contracting with a dedicated student-election vendor (e.g., OpaVote or ElectionBuddy) that handles RCV tabulation automatically. Do not attempt to count RCV manually.
  *   **Weeks 9-12:** **Voter Education Campaign.** Crucial step. We must distribute explainers on "How to Rank" to prevent ballot exhaustion or confusion.
  *   **Fall Semester:** Nominations open under new rules.

  ### Budgetary Implications

  The primary cost is the voting software license. Most vendors charge a flat fee or a per-voter rate. We estimate an additional cost of $300–$500 over the current budget for online voting tools. This is a necessary investment to ensure the integrity of the count, as RCV tabulation is too complex for manual verification.

  ### Conclusion

  Dana's point regarding the Gibbard-Satterthwaite theorem is theoretically sound: there is no magic bullet that makes voting a purely truth-telling game. However, institutional design is about trade-offs, not theoretical perfection. Plurality voting forces voters to act as strategists just to have their voice heard. Ranked-Choice Voting shifts the burden back to the candidates to build broad coalitions.

  By adopting RCV, the GSA acknowledges that the Spring result was not just bad luck, but a structural failure. This change will restore confidence in the Association's leadership and ensure future winners represent the majority will of the graduate student body.

  **Action Required:** Board vote to approve this recommendation and authorize the Bylaw Committee to draft the necessary amendments by [Date].
