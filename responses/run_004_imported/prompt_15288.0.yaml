  2.  **Deconstruct the Argument:**

      *   **Marcus's Position:**
          *   Douglass's flip was motivated reasoning dressed as legal argument.
          *   The delegates *meant* to protect slavery (Fugitive Slave Clause, 3/5 Compromise).
          *   Reinterpretation doesn't change original intent.
          *   "Other persons" wasn't ambiguous to people in 1787; it was a euphemism everyone understood.
          *   Douglass needed a legal hook for electoral politics (vs. Garrison's disunion).
          *   Motive undermines validity.

      *   **Nadia's Position:**
          *   Framers deliberately excluded words "slave/slavery" from the text.
          *   Authority comes from "We the People" consenting to the *actual words*, not secret notes (Madison's notes came later).
          *   Deliberate silence/ambiguity counts.
          *   Legal meaning should be based on public text accessible to ordinary people (and enslaved people), not secret intentions.
          *   Construing ambiguous grants of power narrowly is standard legal practice.
          *   Having political motives doesn't make an argument wrong.

  3.  **Evaluate the Historical and Legal Scholarship (Blight, Foner, etc.):**
      *   *Douglass's Shift:* It happened around 1851 (after breaking with Garrison). Key text: "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1860 speech, but ideas developed earlier).
      *   *Garrisonian View:* The Constitution is pro-slavery (covenant with death). Solution: Dissolve the Union (No Union with Slaveholders).
      *   *Douglass/Spooner View:* The Constitution, read textually without the "secret intentions," is anti-slavery. Slavery is a state institution; the federal government has no power to establish it. The clauses regarding slavery are restrictions on federal power or concessions to necessity, not grants of power to create slavery.
      *   *Original Intent vs. Textualism:* This is the core legal theory clash. Marcus argues for Original Intent (what they meant). Nadia argues for Textualism/Public Meaning (what the words say).
      *   *Historical Consensus:* Most modern historians agree the Constitution *protected* slavery in practice (3/5, Fugitive Slave, 1808 trade clause). However, the *textualist* argument made by Spooner and Douglass is legally coherent, even if historically optimistic about the Framers' benevolence. Blight generally portrays Douglass's shift as pragmatic and politically necessary, not necessarily a discovery of "truth" but a strategic evolution.
      *   *Who is "Right"?* In terms of historical fact regarding the *Framers' intentions*, Marcus is closer. In terms of legal theory regarding *constitutional interpretation*, Nadia is closer to how law often functions (text over secret diaries). In terms of Douglass's *motivation*, both are partially right (it was political, but also principled).

  4.  **Drafting the Analysis (Move by Move):**

      *   *Move 1: Motivated Reasoning vs. Legal Argument.*
