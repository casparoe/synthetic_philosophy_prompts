          *   *Refinement:* Marcus identifies the *cause* correctly (politics). Nadia identifies the *validity* correctly (logic). I'll lean toward Nadia here because "motivated reasoning" implies falsehood, which isn't necessarily true.

      *   *Move 2: Intent vs. Text (The "Words" Argument).*
