      *   *Move 3: Ambiguity and "Other Persons".*
          *   Marcus: Nobody was fooled in 1787.
          *   Nadia: Construing ambiguous grants of power narrowly is standard law.
          *   *Analysis:* Marcus is historically right (everyone knew). Nadia is legally right (rule of construction). However, Douglass's argument wasn't just about ambiguity; it was about federalism (slavery is local).
          *   *Edge:* Marcus has the historical reality, Nadia has the legal theory. But Nadia's point about "consent of the governed" reading the text is powerful for Douglass's specific context.

      *   *Move 4: Politics vs. Honesty (Garrison's Disunion).*
          *   Marcus: Garrison was more honest; Douglass wanted electoral politics.
