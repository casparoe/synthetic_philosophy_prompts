answer: |-
  **The Eighth Week**

  The greasepaint smelled of lanolin and stale sweat, a scent that had begun to cling to the inside of Elena's nose like a permanent sinus infection. It was the eighth week of the run. *The Winter Son* was a small production, regional theater, the kind where the sets are painted plywood and the ghosts are visible in the spotlight beams.

  In the play, Elena played Martha. In the third act, Martha discovers her son, Thomas, has frozen to death in the orchard. She holds his coat. She screams. She collapses.

  Tonight, like every night for fifty-six performances, Elena collapsed. The curtain fell. The applause was polite, tepid. She stood for the bow, smiling the tight, professional smile of someone who has just simulated a nervous breakdown for money. She waved to the darkened house. She knew, with absolute cognitive clarity, that Thomas was a character written by a living playwright in Brooklyn. She knew the coat was wool blend from a costume shop in Jersey. She knew the orchard was a backdrop.

  But when she walked off stage and the stagehand handed her her robe, her hands were shaking. Not the adrenaline shake of performance. The hollowed-out tremor of aftermath.

  She showered in the dressing room. The hot water turned her skin pink, but she still felt cold. She dressed in her street clothes—jeans, sweater, boots—and walked out into the November air. The theater was in the city, near the district where the shops stayed open late.

  She told herself she was going home. Mark was waiting. They were supposed to order Thai food and watch something mindless. But her feet turned left instead of right, toward the row of boutiques that lined the avenue.

  She stopped in front of a toy store. In the window, there was a wooden train set, painted a bright, primary blue. It was the kind of thing a boy would want. A boy like Thomas.

  Elena stood on the sidewalk, watching her breath plume in the cold. *He isn't real,* she thought. The thought was crisp, logical, and entirely useless. It was the same as knowing that the spider in the corner of the ceiling wasn't going to drop on her neck, yet still feeling the prickling itch between her shoulder blades.

  She went inside. The bell chimed. The clerk, a young man with glasses, looked up from his phone. "Help you?"

  "I need the train," Elena said. Her voice sounded rough, unused.

  "The blue one in the window?"

  "Yes."

  "Gift wrapping?"

  "Yes."

  She paid with her credit card. She signed the slip. She knew, as the pen scratched against the paper, that there was no address to write on the tag. There was no house in the orchard. There was no mother to receive the gift. There was only the script, the lines, the blocking.

  And yet, the grief sat in her chest like a swallowed stone, heavy and undeniable. It wasn't a memory of the play; it was a continuation of it. The emotion hadn't reset when the lights came up. It had spilled over the footlights, tracked mud onto the carpet of the lobby, and followed her onto the subway.

  On the train home, she held the wrapped box on her lap. A woman sitting across from her smiled at the package. "For a nephew?"

  Elena looked at her. She could say yes. It would be the sensible thing. It would align the internal state with the external fact. *Yes, for a nephew. Because this box is for a living boy.*

  "For Thomas," Elena said.

  The woman's smile faltered. She looked down at her own hands.

  When Elena got home, Mark was on the sofa. The TV was on, muted. He looked up as she came in, smelling the cold air and the lanolin still clinging to her hair. He saw the box in her hand.

  "Hey," he said. "You okay? You look wrecked."

  "I'm fine." She took off her boots. She placed the box on the coffee table, next to the remote.

  "What's that?"

  "A gift."

  Mark leaned forward. "For who? Did I forget a birthday?"

  "No." Elena walked to the kitchen and poured a glass of water. She drank it standing up, staring at the box through the doorway. "For Thomas."

  Mark was silent for a long moment. She heard the rustle of the blanket as he shifted. "Elena. The play."

  "I know."

  "Thomas isn't... he's not a person."

  "I know that." She turned around. She leaned against the counter. The kitchen was warm, lit by the overhead fixture. It was real. The fridge hummed. The floor was solid. "I know he's words on a page. I know he's a costume rack."

  "Then why do you have a gift?"

  "Because he's cold," she said.

  Mark stood up. He didn't come closer. He looked at her the way you look at a stranger who has stepped onto the road in front of your car. Not with anger, but with a bewildered recognition of danger. "He doesn't feel cold, El. He doesn't feel anything."

  "I feel it."

  "That's acting. That's the job. You feel it so we believe it. But when you come home..." He gestured around the kitchen, at the bills on the counter, the real life they inhabited. "You come home to me. To us."

  "I did come home."

  "With a present for a ghost."

  "It's not a ghost." She walked back into the living room and picked up the box. It was light. Cardboard and wood. "It's for him. In the orchard."

  Mark rubbed his face. "Okay. Okay. Put it down. Let's eat."

  "I can't put it down."

  "Why?"

  "Because if I put it down, it means I accept that he stays dead without it."

  "He *is* dead," Mark said, his voice rising slightly. "He was never alive. That's the point. It's a tragedy. We pay to watch people suffer so we don't have to."

  Elena looked at him. She saw the logic in his face. It was the sane face. It was the face of someone who knows that haunted houses are built of plywood. She loved that face. It was the face of her husband. But it felt distant, like a picture on a wall.

  "Maybe," she said. "But I'm here. And I'm suffering."

  "That's different."

  "Is it?"

  She walked to the corner of the room, where the shadows were deepest. She set the box down on the floor. She knelt beside it. She didn't pretend there was a boy there. She didn't close her eyes and imagine a face. She kept her eyes open. She looked at the empty carpet. She knew it was empty. She knew the carpet was synthetic blend, installed three years ago.

  But the ache in her throat tightened, sharp and specific. It demanded an object. It demanded a recipient.

  "El," Mark said softly. "Come to bed."

  "In a minute."

  She stayed kneeling. She placed her hand on the box. She waited for the feeling to pass, for the curtain to fall in her mind, for the logic to reassert itself and drain the emotion away like water from a tub.

  It didn't. The sorrow remained, solid and heavy, anchored to nothing, tethered to a boy who was made of ink and air. She sat there in the warm room, shivering, waiting for a reason to cry that everyone else would agree was real, knowing none would come, and crying anyway.
