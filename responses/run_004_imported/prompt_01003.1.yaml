      *   *Conventional Signals:* Arbitrary signals maintained by social punishment (e.g., some badge of status in birds).
      *   *The Nuance:* Many "handicaps" might have index components. Many "indices" might have maintenance costs. The definition of "cost" is slippery (production cost vs. maintenance cost vs. risk).
      *   *Key Papers/Names:* Zahavi, Grafen, Maynard Smith, Searcy & Nowicki (Index signals), Johnstone (reviews).

