      *   *Deep Dive:* The Peacock. Elena: "It's heavy, predators see it." Marcus: "But maybe the feather structure itself is the index of health, not the weight."
      *   *The "Tautology" Trap:* Marcus needs to point out that if every honest signal is retroactively defined as "costly," the theory explains nothing.
