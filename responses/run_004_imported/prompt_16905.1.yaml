answer: |-
  You are not being neurotic. Your discomfort is actually a very healthy signal, and your roommate is looking at this from a purely transactional perspective while you are experiencing it from a psychological one.

  Here is why what you're feeling is valid, why it's "bugging" you, and why it matters more than just a fitness app.

  ### 1. You've hacked your own dopamine reward system
  The reason the number climbing feels satisfying—even more than walking—is that you have found a "super-stimulus."
  *   **Walking:** High effort, slow reward, variable results (weather, fatigue, time).
  *   **Wrist Shaking:** Low effort, instant reward, high control.

  Your brain is wired to seek efficiency. When you discovered you could get the same digital reward (the step count) for 5% of the energy cost, your brain latched onto it. This is the same mechanism that makes video games, social media scrolling, or gambling addictive. You aren't just "gaming an app"; you are training your brain to prefer the *simulation* of achievement over the *reality* of it. That is why it feels "off." You know, deep down, that the reward is unearned.

  ### 2. Goodhart's Law and the Loss of Meaning
  There is an economic principle called **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*
  *   **The Intent:** The insurance company wants you to walk so you get healthier (which saves them money).
  *   **The Measure:** Step count.
  *   **The Reality:** You are now optimizing for the measure, not the intent.

  The reason it's freaking you out is that you have decoupled the metric from the meaning. Steps were supposed to represent *movement* and *health*. Now they represent *wrist velocity*. Every time you look at that number now, it doesn't tell you how active you were; it tells you how good you are at shaking your watch. That undermines the utility of the tracker for *you*. If you can't trust your own data, the tool is broken.

  ### 3. The "Slippery Slope" of Self-Trust
  You mentioned: *"I told myself it'd be a one-time thing... now I catch myself doing it most nights."*
  This is the part that warrants attention. You set a boundary for yourself ("just this once to catch up"), and you crossed it. Now it's a habit.
  *   **The Roommate's View:** It's a harmless hack.
  *   **The Psychological View:** It's a small erosion of self-integrity.

  It's not about the $75. It's about the narrative you tell yourself. If you tell yourself "I am someone who tries to be healthy," but your behavior is "I sit on the couch and shake my wrist," that creates **cognitive dissonance**. That nagging feeling is the friction between your self-image and your actions. Ignoring that feeling makes it easier to cut corners in other areas, not because you're a bad person, but because you've normalized the shortcut.

  ### 4. Is it "Wrong"?
  Ethically? It's a workplace game. People cheat on step challenges all the time. You aren't stealing money in a legal sense; you're exploiting a loophole in a wellness incentive. Your roommate is right that the world won't end if you do this.

  **However,** it is "wrong" for *you* if it causes you anxiety. The cost of the $75 bonus is now your peace of mind. If you have to sit on the couch feeling guilty or "freaked out" while you shake your wrist, the hourly rate on that bonus isn't worth it.

  ### What should you do?
  You have three options to resolve the dissonance:

  1.  **Reclaim the Intent (The Hard Reset):** Stop shaking the wrist. Accept that you might not win the bonus. Wear the watch to track your actual movement again. This restores the link between effort and reward.
  2.  **Reframe the Game (The Cynical Approach):** Decide explicitly, "This is not a health challenge; this is a money challenge." Own the cheat. If you view it purely as a game of mechanics rather than a reflection of your health, the guilt may vanish. *Warning: This risks making the sedentary habit stick.*
  3.  **Opt Out:** If the leaderboard and the temptation are causing you stress, leave the challenge. $75 isn't worth two weeks of nagging anxiety, and it certainly isn't worth training your brain to prefer fake progress over real effort.

  **The Verdict:**
  You aren't neurotic. You are experiencing a conflict between **extrinsic motivation** (the money/leaderboard) and **intrinsic values** (honesty/health). The fact that you are questioning it shows you have a strong internal compass.

  If I were you, I'd stop shaking the wrist. Not because it's "sinful," but because you've turned a tool meant to encourage health into a source of compulsive behavior. That's a bad trade for $75.
