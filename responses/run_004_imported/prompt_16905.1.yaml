      *   **The Slippery Slope:** Started as "one-time," now "most nights." This suggests habit formation.
      *   **The Feeling:** "Freaking me out." This indicates cognitive dissonance. The user values honesty or the *purpose* of the challenge, but the behavior contradicts that.
