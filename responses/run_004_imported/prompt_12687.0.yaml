answer: |-
  It is a pleasure to engage with someone bringing a physicist's rigor to the philosophy of biology. Your background gives you a unique vantage point, particularly regarding the mathematical modeling issues at the heart of this debate.

  However, I must gently correct a central premise in your inquiry: **The evolutionary biology community does not accept the claim that inclusive fitness (IF) theory has been mathematically superseded or discredited.**

  While E. O. Wilson is a titan of the field, his 2010 *Nature* paper (co-authored with Nowak and Tarnita) and his subsequent book *The Social Conquest of Earth* represent a dissenting viewpoint that was vigorously contested by the majority of working evolutionary biologists. The reason you still see genes and relatedness framing the literature is not inertia, but rather that the "debate" is largely viewed by the field as a choice of accounting methods rather than a conflict of biological truth, with inclusive fitness remaining the more tractable tool for most empirical work.

  Here is a detailed breakdown of why the field has not abandoned the gene's-eye view or inclusive fitness, structured around the mathematical, empirical, and philosophical realities of the discipline.

  ### 1. The 2010 Consensus Backlash
  It is important to contextualize the 2010 Nowak, Tarnita, and Wilson (NTW) paper. While published in *Nature*, it was not received as a paradigm shift by the community. In 2011, *Nature* published a rebuttal letter signed by **137 evolutionary biologists**, including many of the field's most prominent mathematical modelers (such as Martin Nowak's own colleagues at Harvard, prior to this specific collaboration, as well as leaders like David Queller, Andy Gardner, and Stuart West).

  The signatories argued that NTW's mathematical claim—that inclusive fitness theory is valid only under restrictive assumptions—was incorrect. They demonstrated that inclusive fitness is a general framework that can handle the same complexities as direct multilevel selection (MLS) models. Consequently, the field did not view IF as "discredited"; they viewed the NTW critique as a misunderstanding of the flexibility of IF theory.

  ### 2. Mathematical Equivalence (The Price Equation)
  From a physicist's perspective, the conflict between Inclusive Fitness and Multilevel Selection is often analogous to choosing between different coordinate systems to solve a mechanics problem.

  Both frameworks are generally derived from the **Price Equation**, which partitions evolutionary change into covariance terms.
  *   **Inclusive Fitness** partitions the variance by looking at the actor and the recipients of the action (weighted by relatedness).
  *   **Multilevel Selection** partitions the variance by looking within groups vs. between groups.

  Mathematically, these are often isomorphic. You can translate a model from one framework to the other without losing information. Therefore, one is not "true" and the other "false." The question is: **Which is more useful for the specific problem at hand?**

  ### 3. Heuristic and Empirical Tractability
  If the math is equivalent, why do biologists prefer the language of genes and relatedness?

  *   **Causal Mechanisms:** Inclusive fitness provides a clearer heuristic for *mechanism*. If an organism behaves altruistically, IF asks: "Does this individual possess a mechanism to recognize kin?" or "Is dispersal limited?" This leads to testable hypotheses about behavior, physiology, and demography. MLS often describes the *outcome* (groups with altruists outcompete groups without them) but can be vaguer on the individual-level mechanisms that allow the trait to persist without being undermined by cheaters.
  *   **Measuring Relatedness ($r$):** In empirical fieldwork, measuring genetic relatedness is often straightforward using modern genomics. Defining the boundaries of a "group" for MLS models can be conceptually ambiguous and statistically difficult. Is a group a nest? A colony? A metapopulation? The gene's-eye view bypasses the need to arbitrarily define group boundaries.
  *   **Predictive Power:** The simple rule $rB > C$ (Hamilton's Rule) has proven incredibly robust across taxa, from bacteria to humans. While critics argue it is a simplification, extensions of Hamilton's Rule have maintained its utility in complex scenarios.

  ### 4. The "Units of Selection" Debate is Not Settled
  You mentioned that the debate is "settled in favor of group-level selection." In the philosophy of biology, the consensus is actually **pluralism**.

  Most philosophers and biologists (such as Samir Okasha and Peter Godfrey-Smith) argue that selection occurs at multiple levels simultaneously. The question is not "which level is real?" but "at which level is selection most *efficacious* for this specific trait?"
  *   For the evolution of the ribosome, selection at the level of the gene or cell is the relevant frame.
  *   For the evolution of sterile castes in ants, group-level effects are profound, but they are successfully modeled via the inclusive fitness of the queen and workers.

  Wilson's later work argued for a strong form of MLS that renders IF unnecessary. The field largely rejected this "replacement" narrative in favor of a "both/and" approach.

  ### 5. Why the Gene's-Eye View Persists
  Richard Dawkins' "Selfish Gene" metaphor is not considered a discredited relic, though it is nuanced. It remains the dominant explanatory framework for several reasons:
  *   **Replication:** Genes are the only entities that are reliably replicated with high fidelity across generations. Vehicles (organisms/groups) are thrown away every generation.
  *   **Conflict:** The gene's-eye view is uniquely good at explaining *conflict* within a group (e.g., meiotic drive, parent-offspring conflict). Pure group selection models sometimes struggle to explain why internal subversion doesn't always destroy group adaptation.
  *   **Cultural Evolution:** Interestingly, where MLS has seen a genuine resurgence is in **cultural evolution** (e.g., Boyd and Richerson), where "groups" of humans transmit traditions. However, even here, gene-culture coevolution models often reintegrate inclusive fitness logic.

  ### Summary
  To answer your specific question: Working evolutionary biologists still frame questions in terms of genes and relatedness because **inclusive fitness theory remains mathematically sound, empirically tractable, and heuristically powerful.**

  The 2010 paper you read was a significant event, but it did not topple the paradigm. It served more as a stress test that ultimately reinforced the robustness of the standard model. As a physicist, you might appreciate that the field has not discarded Newtonian mechanics because Lagrangian mechanics exists; similarly, biologists have not discarded inclusive fitness because multilevel selection exists. They use the tool that yields the clearest insight for the specific system they are studying.

  If you wish to explore the counter-argument to Wilson's 2010 claim, I recommend looking at the responses by **David Queller** (e.g., "Expanded Social Fitness and Hamilton's Rule for Kin, Kith, and Kind") or **Andy Gardner and Stuart West**, who have written extensively on why the "death of inclusive fitness" was greatly exaggerated.
