answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of knowing [Bride] since our college days, back when our biggest ethical dilemmas involved whether it was wrong to steal dining hall silverware.

  Standing here tonight, I'll admit I'm a little intimidated. Usually, the best man or maid of honor worries about telling a funny story or making the couple cry. But I'm giving a toast to a woman who literally wrote the book on the ethics of promising. I know that about thirty percent of you in this room have read her dissertation. So, I know I can't get away with the standard line about how "marriage is a promise to love each other forever." Because if anyone knows how logically fraught that sentence is, it's her.

  But I've been thinking about her work, and specifically about a conversation we had a few years ago at a conference dinner. We were a few glasses of wine in, and I asked her the question that I think a lot of people wonder: Why does a promise actually *bind* us? Why isn't it just a prediction of what we hope to do?

  She told me something that stuck with me. She said that a true promise holds its weight even in the dark. Even in a case where literally no one—not her partner, not her friends, not society—would ever know if she broke it. If the obligation was just about not letting someone down, or avoiding shame, then a secret broken promise wouldn't matter. But it does. It matters to *you*.

  And that, I think, is the profound answer she came to. The binding force of a promise isn't about external pressure. It's not about reliance, and it's not about social sanction. It's about **integrity as self-constitution.**

  *(Pause slightly, look toward the philosophy table)*

  For the non-philosophers here, that's a fancy way of saying: When you make a promise, you aren't just describing your future; you are building the person who will inhabit it. To break a promise isn't just to disappoint someone else; it is to contradict the self that made the vow. The obligation comes from within. It is **normative force independent of epistemic access.**

  *(Pause for the inevitable nudge-nudge from the philosophy contingent)*

  For the rest of you: It means that [Bride]'s commitment is strong enough that it doesn't need an audience to be real.

  And this is why I am so incredibly confident in this marriage. Because [Bride] isn't marrying [Groom] because it's easy, or because everyone is watching, or because she's afraid of what would happen if she left. She is marrying him because she has chosen to become a person for whom *these* vows are true.

  [Groom], you are not just the beneficiary of her promise. You are the witness to it. But more importantly, you are the person she chooses to build that integrity alongside. In the quiet moments, when no one is watching—when it's just the two of you after a long day, or when things are difficult and there's no applause for sticking it out—that is when her philosophy becomes her life. She is promising to be the same person in the dark that she is in the light. And she is promising that you are worth that kind of consistency.

  Most people think marriage is about finding someone you can rely on. But [Bride] teaches us that it's actually about becoming someone who is reliable. It's about looking at the person across from you and saying, "I am binding my future self to you, not because I have to, but because the 'I' that I want to be is an 'I' that is yours."

  So, I'd like to propose a toast.

  To [Bride] and [Groom]. May your love be the kind of obligation that needs no enforcement. May you hold each other to your highest selves, even when no one else is looking. And may you always find that the promise itself is the strongest thing in the room.

  To the bride and groom!
