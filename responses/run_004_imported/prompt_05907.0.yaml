          *   Will Theory: By exercising your will, you create a bond.
      *   *The Bride's Insight (from the prompt):* It binds even if *no one finds out*. This rules out Reliance (if they don't know, they aren't relying/disappointed) and Social Sanction (if no one knows, there's no shame).
