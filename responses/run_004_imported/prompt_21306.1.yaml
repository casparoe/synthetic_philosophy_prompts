  ### Adjudication Notes

  **Marcus** wins on the technical decision theory front. He correctly identifies that standard CDT is dynamically inconsistent in this scenario and that patching it with "resolute choice" effectively transforms it into Functional Decision Theory (FDT). His reading of the mechanics is precise.

