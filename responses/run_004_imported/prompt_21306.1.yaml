  ### What Both Are Missing

  1.  **The Algorithmic Transparency:** Both treat the driver's prediction as "character reading," but in modern rationalist terms (TDT/FDT), the driver is predicting the output of the agent's *decision algorithm*. The key isn't just "having a disposition," but recognizing that your decision *now* is logically linked to the driver's prediction *then* because both instantiate the same function.
  2.  **Parfit's S-Theory vs. CDT:** They conflate CDT with Parfit's "Self-Interest Theory" (S). While closely related, Parfit's argument was that S is *collectively* self-defeating, whereas the CDT/FDT debate is about *individual* rationality in acausal contexts. Parfit was more interested in motivating morality than solving decision theory.
  3.  **The "Why" of Resolute Choice:** Neither fully addresses *why* an agent would be resolute. McClennen argues it's constitutive of agency, but FDT proponents argue it falls out naturally from maximizing expected utility over the algorithm's output. The missing link is explaining the *source* of the normativity that binds the agent to the plan without external enforcement.
