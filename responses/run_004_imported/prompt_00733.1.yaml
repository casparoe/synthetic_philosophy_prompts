      *(Self-Correction during drafting)*: I need to make sure I don't blame the user for being "clumsy." The clumsiness was the spark, but the fire was the crowd's behavior. I also need to emphasize that "just banter" is often a cover for cruelty, even if the individuals don't feel hate.

      *Key Concept to Introduce:* "Context Collapse" and "Diffuse Harassment."
