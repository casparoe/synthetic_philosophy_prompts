  **MEMORANDUM**

  **TO:** Zoning Board of Appeals
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding 14 Oak Lane ADU Application (Hearing Date: Oct 26)

  **1. Executive Summary**

  This Thursday, we hear the appeal regarding the proposed detached Accessory Dwelling Unit (ADU) at 14 Oak Lane. The applicant seeks to build a detached unit rented to an unrelated party in a Single-Family Residential zone. The neighbors oppose, arguing the functional reality of the project creates a two-family dwelling, violating the district's character. The applicant argues the legal definition of "ADU" preserves the single-family status regardless of occupancy.

  After reviewing the state statute, local bylaws, and the specific objections raised, **I recommend we GRANT the permit, subject to specific conditions regarding parking and occupancy enforcement.** Denial exposes the town to significant legal liability under state preemption, but an unconditional grant ignores valid concerns about neighborhood capacity. We can resolve this by distinguishing between the *legal classification* of the structure and the *physical impact* of its use.

  **2. The Core Conflict: Name vs. Actuality**

  We are facing a structural problem that mirrors a classic philosophical dispute regarding language and reality.

  *   **The Applicant's Position (The Nominalist Argument):** The applicant's counsel argues that "ADU" is a distinct legal category. Just because a unit has a kitchen and a tenant does not make it a "second family" in the zoning sense. The *name* ("Accessory") dictates the *reality*. If the state defines an ADU as compatible with single-family zoning, then the presence of an ADU cannot, by definition, violate single-family zoning.
  *   **The Neighbors' Position (The Realist Argument):** The abutters argue that zoning is meant to regulate actual conditions, not just labels. Two kitchens, two leases, and increased traffic constitute a "two-family" *actuality*, regardless of what the permit says. To them, calling this "single-family" is a semantic trick that bypasses the density restrictions the neighborhood was zoned to protect.

  Both sides are logically consistent within their own frameworks. However, as a Board, we do not have the luxury of metaphysical abstraction. We operate under a hierarchy of law where the State's definition of "Name" (ADU) currently overrides local definitions of "Actuality" (Density).

  **3. Legal Constraints & Risk Assessment**

  We must be clear: State law (specifically [Insert Relevant State Statute, e.g., M.G.L. c. 40A, § 3 or CA Gov Code § 65852.2]) mandates that ADUs be allowed "by right" in single-family zones. The statute explicitly states that an ADU does not change the underlying zoning classification of the property.

  If we deny this permit based on the argument that "an ADU makes this a two-family lot," we are effectively arguing that the State's definition of "ADU" is invalid. Town Counsel has advised in prior sessions that such a denial would likely result in an overturning of our decision by the Land Court, plus potential attorney's fees for the town. We cannot win a fight against state preemption on the definition of "family" if the state statute has already decoupled ADUs from that definition.

  **4. Recommendation: Grant with Conditions**

  We should not simply wave off the neighbors' concerns as "NIMBYism." Their argument is that the *infrastructure* of the neighborhood (parking, trash, noise) is calibrated for single-family density, and the *actuality* of an ADU stresses that infrastructure.

  Therefore, I move we **GRANT** the permit, but utilize our limited authority to mitigate the *actuality* without challenging the *name*.

  **Proposed Conditions:**
  1.  **Parking:** Require one off-street parking space dedicated to the ADU. This addresses the tangible impact (cars on the street) without denying the right to build.
  2.  **Occupancy Limit:** Explicitly limit occupancy of the ADU to two persons maximum. This reinforces the "accessory" nature of the unit and prevents it from functioning as a high-density multi-family unit.
  3.  **Rental Term:** Require that the ADU be rented for terms of no less than 30 days. This prevents the unit from becoming a short-term hotel (which would genuinely alter the "single-family" character of the street).

  **5. Rationale**

  This approach accepts the Gongsun Long premise that the *name* "ADU" carries specific legal weight that distinguishes it from a "Second Dwelling Unit." We acknowledge the State has rectified the name for us. However, it also respects the Xunzi/Neighbors' premise that *actuality* matters. By capping occupancy and requiring parking, we ensure the *reality* of the lot's usage remains as close to "single-family" as physically possible, even if the *label* allows for a tenant.

  We are essentially ruling that while the "White Horse" (ADU) is legally distinct from a "Horse" (Second Family Unit) regarding zoning classification, it still must obey the traffic laws of the road (parking and occupancy).

  **6. Next Steps & Timeline**

  *   **Thursday Hearing (Oct 26):** Present this framework during deliberation. Focus the questioning on parking and occupancy rather than debating the definition of "family."
  *   **Vote (Oct 26):** Move to approve with the conditions listed above.
  *   **Decision Issuance (Nov 2):** File the Decision with the Town Clerk.
  *   **Appeal Period (Nov 2 – Nov 23):** Monitor for any appeal filings. If neighbors appeal, we stand on the record that we balanced state mandate with local mitigation.

  **7. Conclusion**

  We cannot deny this permit without inviting a lawsuit we will likely lose. However, we can approve it in a way that validates the neighbors' concerns about neighborhood capacity. We acknowledge that language (zoning codes) shapes reality, but we also acknowledge that reality (traffic, noise, density) pushes back. This recommendation respects both.

  Please review prior to Thursday. I am happy to discuss the specific wording of the conditions.

  [Your Name]
  Member, Zoning Board of Appeals
