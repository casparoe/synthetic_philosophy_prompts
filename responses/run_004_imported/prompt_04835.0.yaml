answer: |-
  This is a dense piece of 17th-century textual criticism, so it makes total sense that you're stuck. Your uncle handed you a primary source from a genius who was also a theological outlier, writing in a very specific polemical style.

  To understand this paragraph, you have to understand the specific debate Newton is entering. Here is the breakdown in plain English, step-by-step.

  ### 1. The Context: The Two Verses
  The entire argument hinges on **1 John 5:7–8**.

  *   **Verse 7 (The "Comma Johanneum"):** This is the controversial verse. In the King James Version, it reads: *"For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one."*
      *   **Why it matters:** This is the clearest statement of the Trinity in the New Testament.
      *   **Newton's View:** Newton believed this verse was a forgery added to the Bible centuries later to support Trinitarian theology.
  *   **Verse 8:** This verse is undisputed. It reads: *"And there are three that bear witness in earth, the Spirit, and the Water, and the Blood: and these three agree in one."*

  **The Cyprian Problem:**
  Trinitarians in Newton's time (and now) argued: "This verse can't be a forgery! Cyprian, a bishop from the 200s AD, quoted it!"
  Newton's counter-argument: "Cyprian didn't quote Verse 7. He quoted Verse 8, but he interpreted it spiritually as referring to the Father, Son, and Spirit."

  ### 2. The Latin Clue (*In Unum* vs. *Unum*)
  This is the technical part that tripped you up. In Latin, there is a slight grammatical difference between how Verse 7 and Verse 8 usually end.

  *   **Verse 7 (Heavenly Witnesses):** Usually ends with *Hi tres **unum** sunt* ("These three **are one**"). This implies unity of essence (they are the same being).
  *   **Verse 8 (Earthly Witnesses):** Usually ends with *Hi tres **in unum** sunt* ("These three **are into one**" or "agree in one"). This implies unity of purpose (they agree on a testimony).

  **Cyprian's Quote:**
  When Cyprian writes about this, he says: *"And these three are one"* (**Hi tres unum sunt**). He does *not* include the "in."

  ### 3. The Objection ("If it be pretended...")
  Newton is imagining a Trinitarian opponent reading his draft and saying:

  > "Hold on, Newton. You claim Cyprian was quoting Verse 8 (the Spirit, Water, Blood). But Verse 8 usually says 'in unum' (agree in one). Cyprian wrote 'unum' (are one). That is the specific phrasing of Verse 7! Therefore, Cyprian must have known Verse 7, proving it existed in the 200s."

  This is a strong objection. If the phrasing matches Verse 7 uniquely, it suggests Cyprian had the "Comma" in his Bible.

  ### 4. Newton's Answer ("I answer that...")
  Newton replies:

  > "That doesn't prove anything. Many old Latin copies of Verse 8 *also* drop the 'in' and just say 'unum sunt'."

  **In plain English:** Newton is arguing that the manuscript tradition was messy. You can't use Cyprian's grammar to prove he saw Verse 7, because there were plenty of Bibles circulating where even Verse 8 read "These three are one" instead of "These three agree in one." Therefore, Cyprian could have been looking at Verse 8 in a standard Bible and still written what he wrote.

  ### 5. Does Newton's Argument Hold Up?
  **Short Answer:** Yes, by the standards of textual criticism, Newton is not dodging; he is being rigorous.

  **Long Answer:**
  Newton is pointing out a **false dichotomy**. The opponent is saying:
  *   *If* Cyprian says "unum," he *must* mean Verse 7.
  *   *If* Cyprian says "in unum," he *must* mean Verse 8.

  Newton is saying: "No, the manuscripts show that Verse 8 sometimes reads 'unum' too." If Verse 8 can legally read "unum" in the Latin tradition, then Cyprian using "unum" is not "smoking gun" evidence that he knew Verse 7.

  **Modern Scholarship Verdict:**
  Newton was essentially right, though modern scholars have even more evidence than he did.
  1.  **The Comma (Verse 7)** is almost universally regarded by scholars today (including many Trinitarian ones) as a later addition that wasn't in the original Greek text.
  2.  **Cyprian** likely did not know the Comma. He was known for "typological" reading—taking Old Testament or New Testament symbols (like Spirit, Water, Blood) and interpreting them as references to the Trinity without needing the explicit text of Verse 7.
  3.  **The Latin Variation:** Newton was correct that Latin manuscripts varied. You cannot build a definitive proof on that specific grammatical particle.

  ### Summary for Your Own Clarity
  *   **The Uncle's Point:** Newton didn't believe in the Trinity and thought the Bible was corrupted to make it look like he did.
  *   **The Paragraph's Point:** Someone tried to use Cyprian to prove the Trinity verse is real. They argued Cyprian's grammar matched the Trinity verse. Newton argued the grammar wasn't unique enough to prove that, because the non-Trinity verse sometimes used the same grammar.
  *   **The Outcome:** Newton wins this specific point. The grammar Cyprian used doesn't definitively prove he had the controversial verse in front of him.

  ### A Note on Your Journey
  It is completely normal to feel unmoored when you start looking at the "plumbing" of doctrine like this. Growing up Southern Baptist, the Trinity is often treated as a given foundation, like the floor you walk on. Finding out that the clearest proof-text for that floor (1 John 5:7) might be a later addition can feel like the floor has turned into a trapdoor.

  Newton's letter is heavy because he was fighting a massive cultural and religious establishment. He approached the Bible with the same empirical skepticism he used for physics. You don't have to agree with Newton's theology (he was an Arian, which is its own complex thing) to appreciate his method: **he wanted to know what the text actually said, not what tradition said it should say.**

  If you explain this to yourself, remember: Newton isn't necessarily saying "The Trinity is false" in this paragraph; he is saying "This specific piece of evidence (Cyprian) does not prove this specific verse (1 John 5:7) is original." That is a much narrower, historical claim.
