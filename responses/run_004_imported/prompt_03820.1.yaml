          *   *Verdict:* Marcus is too absolute here. Past violation doesn't automatically erase standing forever, especially if norms have changed or if the violation was context-dependent. Priyanka has the better of this specific claim.

      *   **Move (2) Priyanka:** Conflates "is slate voting bad" vs. "is it happening." Dismissing based on history is *tu quoque*.
