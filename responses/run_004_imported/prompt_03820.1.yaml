          *   *Verdict:* Priyanka wins on logic/truth, but misses the nuance of social standing. Marcus is talking about social license, she's talking about factual correctness. Slight edge to Priyanka for identifying the fallacy, but Marcus isn't necessarily committing it if he's talking about *authority* rather than *truth*.

      *   **Move (3) Marcus:** Clarification. Not disputing the norm or the fact. Disputing *Odell's right* to object. Anyone else could say it.
