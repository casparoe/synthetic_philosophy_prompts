answer: |-
  This is a fantastic catch. You have stumbled onto one of the great injustices of pop-philosophy history. The "White Horse is Not a Horse" (*Bai Ma Fei Ma*) thesis is usually treated as a punchline about ancient confusion, but when you read the actual dialogue, Gongsun Long reads less like a confused sophist and more like a proto-analytic philosopher wrestling with the distinction between **sense and reference**, or **intension and extension**, roughly 2,200 years before Frege.

  To answer your specific questions: No, the arguments are not just the same equivocation repackaged. They are attacking the problem from three different angles (semantic, pragmatic, and metaphysical). However, the conclusion relies on a deliberate ambiguity that makes the thesis defensible as semantics but disastrous as ontology.

  Here is the steelman of the logic, followed by the diagnosis of where the trap is sprung.

  ### The Steelman: Three Distinct Arguments

  You identified the three moves correctly. Here is how they function in a rigorous framework.

  **1. The Semantic Argument (Shape vs. Color)**
  *   **The Text:** "Horse" names a shape; "White" names a color. Naming a color is not naming a shape.
  *   **The Steelman:** This is a claim about **conceptual composition**. The concept `HORSE` picks out a set of formal properties (shape, structure). The concept `WHITE` picks out a chromatic property. The concept `WHITE HORSE` is the intersection of these two sets.
  *   **The Logic:** $Concept(A) \neq Concept(A + B)$. The *intension* (the definition) of "white horse" is strictly richer than the intension of "horse." Therefore, the *terms* are not synonymous. If "is" means "is synonymous with," then "White Horse is not Horse" is true.

  **2. The Pragmatic Argument (The Request Test)**
  *   **The Text:** If you want a horse, yellow/black works. If you want a white horse, yellow/black fails.
  *   **The Steelman:** This is the strongest argument. It anticipates **intensional contexts** (logic of propositional attitudes like "wanting" or "seeking").
  *   **The Logic:** In extensional logic, if $A = B$, you can substitute $A$ for $B$ without changing truth value. But "wanting" creates an opaque context.
      *   Let $H$ = the set of all horses.
      *   Let $WH$ = the set of white horses.
      *   The request "Bring me a horse" is satisfied by any $x \in H$.
      *   The request "Bring me a white horse" is satisfied only by $x \in WH$.
      *   Since the **satisfaction conditions** differ, the objects of the request are not identical.
      *   If "White Horse" were identical to "Horse," the substitution would hold in the request context. It doesn't. Therefore, they are not identical.

  **3. The Metaphysical Argument (The Bare Universal)**
  *   **The Text:** "Horse" is colorless; "White Horse" is colored.
  *   **The Steelman:** This distinguishes between the **Universal** (the Form of Horseness) and the **Instantiated Particular**.
  *   **The Logic:** Gongsun Long is positing that the term "Horse" refers to an abstract universal that *cannot* have a specific color (because if it were white, it couldn't cover black horses). The term "White Horse" refers to a concrete instantiation. An abstract universal cannot be identical to a concrete instantiation. Thus, `Universal(Horse)` $\neq$ `Instantiated(White Horse)`.

  ### Diagnosis: Where the Trap Springs

  So, is there a defensible thesis here? **Yes.** The thesis is: *"The concept 'White Horse' is not semantically identical to the concept 'Horse'."*

  However, Gongsun Long knows that his audience hears "A white horse is not a horse" and interprets it as *"An individual white horse is not a member of the species horse."*

  Here is where the logic goes wrong (or rather, where it becomes a "sophism"):

  **1. Equivocation on "Is" (Identity vs. Membership)**
  This is the classic diagnosis, but it's deeper than it looks.
  *   **Identity ($=$):** "The Morning Star is the Evening Star." (Both refer to Venus).
  *   **Membership ($\in$):** "Venus is a planet."
  *   Gongsun Long proves that `White Horse` $\neq$ `Horse` (Identity of Concepts).
  *   He lets the audience conclude that `White Horse` $\notin$ `Horse` (Class Membership).
  *   **The Bug:** In the second argument (the Request Test), he proves the *concepts* differ. But in the conclusion, he implies the *object* doesn't belong to the class. He conflates the map (the name) with the territory (the animal).

  **2. Reification of the Universal (The Third Man Problem)**
  The third argument (the colorless horse) is the weakest link and arguably begs the question.
  *   He assumes that for the word "Horse" to be meaningful, it must refer to a *thing* (a colorless universal horse).
  *   But most realists would argue "Horse" refers to a **natural kind**, not a specific colorless entity. A natural kind can include variation (color) without ceasing to be the kind.
  *   By insisting "Horse" must be colorless to be "Horse," he creates a Platonic Form that doesn't exist in the physical world, then points out that physical white horses don't match this Form. He is comparing apples (real horses) to oranges (the abstract concept of horseness) and declaring them different.

  **3. Mereological Fallacy**
  He treats the addition of a modifier as creating a wholly new entity rather than a subset.
  *   If I have a "cup" and I add "red," I have a "red cup."
  *   Gongsun Long argues: "Cup" = vessel. "Red" = color. "Red Cup" = vessel + color. Therefore "Red Cup" $\neq$ "Cup."
  *   **The Fix:** "Red Cup" is a **subset** of "Cup." It is not *identical* to the set "Cup," but every member of "Red Cup" is a member of "Cup." Gongsun Long exploits the ambiguity between "Is the set identical?" (No) and "Is the element a member?" (Yes).

  ### The Verdict

  You are right to feel that "some of them seem like they might be doing real work."

  Gongsun Long is doing **philosophy of language**, not biology. The School of Names (*Ming Jia*) was obsessed with *Zhengming* (Rectification of Names). Their political point was that if you don't distinguish between names carefully, governance collapses (e.g., if "King" doesn't have a precise definition, anyone can claim to be one).

  **The Defensible Thesis:**
  "White Horse" and "Horse" have different **senses** (Fregean *Sinn*), even if they share overlapping **references** (*Bedeutung*). The criteria for applying the term "White Horse" are stricter than for "Horse." Therefore, in contexts involving meaning, definition, or specific requests, they are not interchangeable.

  **The Sophistry:**
  Using that semantic non-identity to deny biological class membership. He forces you to choose between:
  1.  Admitting the concepts are different (True).
  2.  Admitting the animal is a horse (True).
  He structures the dialogue so that admitting (2) feels like denying (1).

  **Summary:**
  It is not just wordplay. It is a rigorous, albeit misleading, exploration of **intensional logic**. The first two arguments (Semantic and Pragmatic) are actually quite sound if interpreted as claims about *concepts*. The third argument (Metaphysical) is where he drifts into questionable ontology to seal the deal.

  If you want to read more in this vein, look into the **Mohist Canons**. The Mohists were the rivals of the School of Names and actually wrote direct rebuttals to Gongsun Long, arguing precisely that "White Horse is a Horse" because the class inclusion holds regardless of the semantic modification. The debate between the Mohists and the School of Names is arguably the closest ancient China came to the Analytic/Continental split (logic/semantics vs. holistic context).
