      *   *(Refining the "Consistency" point):* Lucas admits humans aren't perfectly consistent but argues we can *correct* ourselves. Critics argue this correction mechanism could be algorithmic.
      *   *(Refining the "System Knowledge" point):* This is the "McCallum" or "Putnam" objection. If the mind is a machine, we might not know *which* machine it is.
