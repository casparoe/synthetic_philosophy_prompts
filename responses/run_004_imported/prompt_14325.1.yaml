prompt: |-
  Earlier this year I joined the clinical ethics committee at the hospital where I work, partly because of how unprepared my own family felt when my father spent his last two weeks on a ventilator after a stroke -- we never really resolved among ourselves whether continuing treatment was giving him a chance or simply postponing the inevitable, and I wanted to understand these questions better than I'd managed to at the time. I didn't expect a case with the same shape to land on the committee within my first few months, but one has, and I've been asked to draft the short opinion I'll circulate before we reconvene.

  The patient is a woman in her late seventies who suffered a prolonged cardiac arrest ten days ago and has been ventilated in the ICU ever since with a severe hypoxic-ischemic brain injury; the medical team is unanimous that she will never recover awareness, and they now want to start dialysis for the kidney failure that has followed, which is what has forced the issue. Our policy lets the committee authorize withdrawing non-beneficial treatment over a family's objection once there has been "genuine engagement with the family's values and beliefs," but it never says what that engagement has to consist of, and this case is testing that gap. The patient's two adult children, who share decision-making authority, both describe themselves as devout, and both say they've consulted the same imam, yet they have reached opposite conclusions from what turns out to be the very same premise: that no created thing -- not a ventilator, not a doctor's hand -- is ever the true cause of anything, since God alone causes every event, including the moment of death, which is already fixed in advance. Our chaplain confirmed this is a serious, mainstream position with a long history, tracing it to al-Ghazali's argument that fire does not itself burn cotton, God does, the contact between them being customary rather than necessary; she added, almost in passing, that the same theologians never doubted that people remain answerable for what they do, which none of us knew how to square with the rest of it. The son takes the shared premise to mean that switching off the ventilator would not kill his mother, since the machine was never doing the causal work of keeping her alive to begin with, so there's no religious reason to keep escalating care the doctors already consider futile. The daughter starts from exactly the same premise and refuses consent to withdrawal anyway, reasoning that if no human action is ever the true cause of death either way, she would rather not be the one who acts at all, and would prefer to let God bring the outcome about through whatever means He chooses.

  Some members of the committee want to set the theological argument aside entirely and just apply our ordinary best-interests and futility criteria, treating the siblings' disagreement as noise the committee shouldn't referee; others think that would quietly dodge the very thing the family is asking us to engage, and would cut against a policy that demands "genuine engagement" rather than a medical override dressed up as neutrality. Could you draft the memo I'll bring to Thursday's meeting? I need a clear recommendation on whether and when the ventilator should be withdrawn and dialysis withheld, stated with a concrete timeframe, one that engages honestly with what the siblings' shared premise does and doesn't actually settle about who bears responsibility for the outcome, rather than quietly favoring whichever sibling's conclusion is more convenient -- and that treats the sibling we don't side with as making an argument worth taking seriously, not a position to be managed.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital Clinical Ethics Committee (CEC).
      *   **Task:** Draft a short opinion memo to circulate before the committee reconvenes.
      *   **Case:** 70s female, severe hypoxic-ischemic brain injury (HIBI) post-cardiac arrest (10 days ago), ventilated, now developing kidney failure requiring dialysis. Medical team says recovery of awareness is impossible (futile).
      *   **Conflict:** Medical team wants to withdraw ventilation/withhold dialysis. Two adult children (surrogates) disagree.
      *   **Theological Nuance:** Both children are devout Muslims, consulted the same Imam, share the *Ash'ari* theological premise (occasionalism: God is the only true cause, created things are merely customary occasions).
          *   *Son:* Withdrawing treatment isn't "killing" because the machine wasn't truly keeping her alive (God was). Therefore, stopping futile escalation is permissible.
          *   *Daughter:* Since human action isn't the true cause of death either, she refuses to be the *agent* of withdrawal. She prefers passive allowance of God's will via natural progression (including dialysis/ventilation) rather than active withdrawal.
      *   **Policy:** Committee can authorize withdrawal over objection *if* there has been "genuine engagement with the family's values and beliefs." Policy doesn't define "genuine engagement."
      *   **Committee Division:** Some want to ignore theology and use standard best-interests/futility. Others say that dodges the policy requirement.
      *   **Requirements for the Memo:**
          *   Clear recommendation (withdraw/withhold? timeframe?).
          *   Engage honestly with the shared theological premise (does it settle responsibility?).
          *   Do not quietly favor the "convenient" sibling (the son).
          *   Treat the dissenting sibling (the daughter) seriously, not as a problem to manage.
          *   Tone: Professional, ethical, empathetic, rigorous.

  2.  **Deconstruct the Ethical & Theological Problem:**
      *   *Medical Fact:* Treatment is non-beneficial (futile). The patient has no awareness and will not recover.
      *   *Ethical Standard:* Physicians are not obligated to provide non-beneficial treatment. However, process matters (policy requires engagement).
      *   *Theological Conflict:* Both siblings agree on *metaphysics* (God is the only Cause) but disagree on *moral agency* (what should humans do given that metaphysics?).
          *   Son's view: Action (withdrawal) is neutral/permissible because causality is divine.
          *   Daughter's view: Action (withdrawal) is morally significant *as an act of will*, even if causality is divine. She fears the *intention* of hastening death, even if the *cause* is God.
      *   *The "Gap":* The policy requires engagement. Ignoring the theology fails the policy. Siding purely with the son because it aligns with medical goals fails the "treat seriously" requirement. Siding with the daughter leads to medically inappropriate care (futile dialysis/ventilation).
      *   *Resolution Strategy:* We must validate the daughter's concern (moral agency/intention) while upholding the medical/ethical standard (non-beneficial treatment). We need to show that "genuine engagement" means understanding *why* she objects, not necessarily agreeing. We need to find a path that respects her theological integrity without committing to futile care.
      *   *Timeframe:* Needs to be concrete. 10 days post-arrest with HIBI is usually enough for prognosis certainty, but a short grace period for transition is standard.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on Case X). Acknowledge the complexity.
      *   **Medical Context:** Briefly state the prognosis (irreversible loss of awareness, futile care).
      *   **The Ethical/Policy Challenge:** Address the "genuine engagement" clause. Acknowledge the split in the committee (ignore theology vs. engage). Take a stance: We must engage.
      *   **Theological Engagement (The Core):**
          *   Acknowledge the shared premise (Ash'ari occasionalism/al-Ghazali).
          *   Analyze the Son's position: Consistent with medical recommendation.
          *   Analyze the Daughter's position: *Crucial Step.* Validate it. It's not a misunderstanding of theology; it's a different emphasis on *human responsibility* (taklif) within that theology. She is worried about *niyyah* (intention). She sees withdrawal as an act of interference, whereas continuing treatment is "letting be."
          *   Address the Chaplain's point: Theologians affirm human accountability despite divine causality. This supports the idea that *choices matter* even if *outcomes* are God's.
          *   Synthesis: The daughter isn't wrong about the theology; she is prioritizing the sanctity of her own moral agency over the futility of the medical intervention.
      *   **Recommendation:**
          *   We cannot provide futile care (dialysis/ventilation indefinitely). It violates medical integrity and the patient's best interests (dignity).
          *   However, we must respect the daughter's moral distress.
          *   *Action:* Authorize withdrawal of ventilation and withholding of dialysis.
          *   *Condition/Timeframe:* Do not do it immediately. Allow a short period (e.g., 48-72 hours) for spiritual preparation/prayer, framing it not as "waiting for a miracle" but as "preparing for the transition."
          *   *Framing:* Reframe the withdrawal. It is not "causing death." It is "ceasing to impede the natural process God has ordained." This speaks to the daughter's concern about agency. We are removing the *obstacle*, not pulling the trigger.
      *   **Conclusion:** Reiterate commitment to the policy.

  4.  **Refining the Tone:**
      *   *Avoid:* Dismissive language ("religious objection," "misunderstanding").
      *   *Use:* Respectful language ("moral reasoning," "theological coherence").
      *   *Check:* Did I favor the son too much? I need to make sure the daughter's view is articulated as a valid moral stance, even if we override it for medical futility reasons. The override must be justified by the *limits of medical obligation*, not by saying her theology is wrong.
      *   *Check:* Did I address the "responsibility" aspect? Yes, by distinguishing between *causality* (God's) and *moral agency* (Human). The daughter fears the moral weight of the choice. The memo must acknowledge that weight.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 48-72 hours enough?
      *   *Adjustment:* Given the 10 days already passed and the acute need for dialysis decision, a week is too long. 48 hours is standard for "time to gather family." Let's suggest 48 hours.
      *   *Critique:* Is the theological analysis accurate?
      *   *Adjustment:* Ensure I reference the al-Ghazali point correctly. The fire/cotton analogy is about *causality*. The daughter's concern is about *volition*. I need to make sure I don't conflate the two. The chaplain's note about accountability is the bridge.
      *   *Critique:* The prompt asks for a "clear recommendation... stated with a concrete timeframe."
      *   *Adjustment:* Make sure the final paragraph is bold and specific.

  6.  **Final Polish:** Check against the prompt's specific constraints: "treats the sibling we don't side with as making an argument worth taking seriously." I will ensure the daughter's reasoning is described as a coherent ethical stance regarding moral complicity, not just emotional resistance.

      *(Self-Correction on the "Siding" aspect)*: Technically, the committee *must* side with the medical recommendation on futility eventually, or the policy is meaningless. But the "engagement" is how we get there. I will recommend authorization to withdraw, but condition it on a specific process that honors the daughter's concern.

      *Wait, one nuance:* The prompt says "treats the sibling we don't side with as making an argument worth taking seriously." If I recommend withdrawal, I am siding with the Son (and the doctors). I must ensure the Daughter's argument isn't dismissed as "wrong." It is "understandable and theologically coherent, but ultimately cannot mandate futile care."

      *Let's write.*

      *Structure:*
      1. Header.
      2. Case Summary.
      3. Analysis of "Genuine Engagement" (The Theological Impasse).
      4. Ethical Analysis (Futility vs. Belief).
      5. Recommendation (Withdraw, Withhold Dialysis, 48-hour window).
      6. Rationale for the Recommendation (addressing the daughter's specific concern).

      *Key phrase to include:* "Moral complicity vs. Causal efficacy."

      *Let's ensure the distinction is clear:* The Son says "I am not killing her." The Daughter says "I am choosing to stop." Both agree God causes death. The disagreement is on the *moral weight of the human choice*. The memo must validate that weight.

      *Final check on timeframe:* "Concrete timeframe." I will specify 48 hours from the time of this decision.

      *Final check on tone:* Empathetic but firm on medical boundaries.

      *(Drafting thought)*: I need to make sure I don't sound like I'm giving a theology lesson, but rather using the theology to inform the ethical process.

      *(Drafting thought)*: The prompt mentions the chaplain's comment about accountability. I should use that. If humans are accountable, then the daughter's fear of accountability is real, not a delusion. But the *doctors* are also accountable for their actions (providing futile care). This creates a conflict of accountabilities.

      *Okay, ready to draft.*
