  **Move 1: Owen (+2)**
  Owen is articulating the core thesis of the Frankfurt case correctly. The point of the thought experiment is to sever the link between moral responsibility and the Principle of Alternate Possibilities (PAP). By isolating the "actual sequence" (Milo's own reasoning) from the "counterfactual sequence" (the chip's intervention), he correctly identifies why proponents argue Milo remains blameworthy. This is a philosophically sound statement of the compatibilist/semi-compatibilist position.

  **Move 2: Maya (+1)**
  Maya deploys the "Flicker of Freedom" strategy, arguing that an alternate possibility still exists (the "lean" or sign that triggers the chip). She is technically right that *some* alternative exists, which prevents the case from being a scenario of absolute determinism. However, she scores lower here because merely having *an* alternative isn't enough to save PAP; the alternative must be robust enough to ground responsibility for *not* cheating. She identifies the loophole but overstates its protective power against Owen's argument.

  **Move 3: Owen (+2)**
  Owen correctly invokes the "Robustness" requirement. He points out that for an alternate possibility to ground moral responsibility, the agent must have control over it in a way that could lead to a different morally significant outcome. Since the chip ensures the outcome (cheating) regardless of the "lean," the alternative isn't robust. This is the standard and strongest rebuttal to the Flicker strategy, solidifying his position in this exchange.

  **Move 4: Maya (+2)**
  Maya lands the heaviest blow with the "Prior Sign" or "Incompatibilist" objection. She correctly identifies that for the chip to know *in advance* what Milo will do (to set up the intervention condition), there must be a prior sufficient cause for his action. If such a cause exists, determinism is already true. This suggests the Frankfurt case doesn't prove responsibility is compatible with a *lack* of alternate possibilities; it just assumes determinism is true from the start. This is widely considered the most significant logical vulnerability in Frankfurt cases.

  **Move 5: Owen & Maya (+1)**
  This exchange is a stalemate at the frontier of metaphysics. Owen tries to patch the "Prior Sign" hole by making the trigger sub-personal (neurons firing), but Maya correctly counters that this still implies the action is causally necessitated by prior states, which begs the question against incompatibilists. I score this a 1 rather than a 2 because while Maya's intuition is strong, compatibilists (like John Martin Fischer) argue that "causal necessitation" doesn't automatically negate the kind of control required for responsibility. It's a deep, unresolved debate, though Maya has the better of the logical consistency here.

  **What They're Both Missing**
  1.  **Guidance vs. Regulative Control:** Owen is arguing for *guidance control* (owning the mechanism that produces the action), while Maya is arguing for *regulative control* (the ability to choose otherwise). They are talking past each other slightly; Frankfurt cases aim to show guidance control is sufficient for responsibility, not that regulative control exists.
  2.  **Source Incompatibilism:** Maya is focused on "Leeway Incompatibilism" (you need options). There is a stronger position called "Source Incompatibilism," which argues that even if Frankfurt cases work, determinism still undermines responsibility because the *source* of the action is outside the agent's ultimate control.
  3.  **The Dialectical Goal:** They are treating the Frankfurt case as a proof of determinism or indeterminism. Its actual goal is narrower: to refute PAP specifically. Even if Maya wins and PAP stands, it doesn't automatically prove incompatibilism, and if Owen wins, it doesn't automatically prove determinism is true.
