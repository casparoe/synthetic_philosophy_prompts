answer: |-
  # The Limits of Linear Aggregation: Adjudicating the Harsanyi Dispute

  The debate between your friend and you concerns one of the most famous results in social choice theory: John Harsanyi's Aggregation Theorem. At stake is whether a mathematical theorem can bridge the gap between positive descriptions of rational choice and normative theories of justice. Your friend argues that the theorem compels us toward utilitarianism; you argue that it leaves the ethical heavy lifting undone.

  To adjudicate this, we must distinguish between the mathematical necessity of the theorem and the ethical sufficiency of its premises. The verdict is this: **Your friend is correct that the theorem imposes a utilitarian *structure* on any theory accepting its axioms, but you are correct that the theorem fails to prove utilitarianism as a moral doctrine.** The theorem demonstrates that utilitarianism is the only coherent way to aggregate preferences *under a specific description of rationality*, but it does not justify that description, nor does it solve the measurement problems essential to actual utilitarian calculation. It is a consistency proof, not a foundational justification.

  ### I. What the Theorem Actually Says

  Precision is required, as the dispute often stems from imprecise recollection of the result. Harsanyi's Aggregation Theorem (1955) operates within the framework of von Neumann–Morgenstern (vNM) expected utility theory.

  **The Premises:**
  1.  **Individual Rationality:** Each individual $i$ has preferences over risky prospects (lotteries) that satisfy the vNM axioms (completeness, transitivity, continuity, independence). Thus, each individual can be represented by a utility function $U_i$, unique up to a positive affine transformation ($U'_i = aU_i + b$, where $a > 0$).
  2.  **Social Rationality:** Society (or a social planner) also has preferences over the same prospects satisfying the vNM axioms, represented by a social welfare function $W$, also unique up to a positive affine transformation.
  3.  **Pareto Principle:** If every individual prefers prospect $A$ to prospect $B$, then society prefers $A$ to $B$. (Specifically, the Weak Pareto principle is sufficient for the result).

  **The Conclusion:**
  The social welfare function $W$ must be a linear combination of the individual utility functions:
  $$W = \sum_{i=1}^{n} a_i U_i + b$$
  where $a_i \geq 0$ are weights and $b$ is a constant.

  Mathematically, the theorem is sound. If you accept the premises, the conclusion follows inevitably. The dispute is entirely about the philosophical weight of the premises and the interpretation of the conclusion.

  ### II. The Friend's Case: The Argument from Structure

  Your friend's position relies on the power of the constraints. In moral philosophy, we often seek a principle that respects individuals (Pareto) and avoids inconsistency (Rationality). Harsanyi shows that within the vNM framework, **only** a weighted utilitarian calculus satisfies these conditions.

  This is a devastating blow to many non-utilitarian theories. For example, prioritarianism (which gives extra weight to the worse off via a concave transformation of utility) or strong egalitarianism (which values equality of outcome independently of total welfare) generally violate the vNM independence axiom when applied to social choice. If society is to be "rational" in the same sense individuals are expected to be under risk, it cannot prioritize the worst-off in a non-linear way without violating the Pareto principle or the independence axiom.

  Furthermore, your friend likely implicitly leans on Harsanyi's *Impartial Observer Theorem* (often conflated with the Aggregation Theorem). In that related argument, Harsanyi suggests that if an observer chooses social rules from behind a "veil of ignorance" (not knowing who they will be), rationality dictates they assign equal probability to being any person. Combined with the Aggregation Theorem, this implies equal weights ($a_i = a_j$), yielding classical utilitarianism.

  From this perspective, the friend argues: "If you want to be rational and respectful of preferences, you have nowhere else to go. The math funnels you into utilitarianism."

  ### III. The User's Case: The Argument from Information

  Your objection, channeling Amartya Sen, targets the informational poverty of the theorem. There are two distinct prongs to this critique, both fatal to the claim that the theorem *proves* utilitarianism.

  **1. The Weights Problem:**
  The Aggregation Theorem alone permits *any* non-negative weights. A dictatorship satisfies the theorem perfectly (one $a_i > 0$, all others $0$). A caste system satisfies the theorem. To get classical utilitarianism, one must assume equal weights. But the Aggregation Theorem provides no basis for equal weights; it merely takes individual preferences as inputs. To justify equal weights, one must import an external ethical axiom (like impartiality or the veil of ignorance). As soon as you import that axiom, the "proof" is no longer doing the work; the ethical assumption is.

  **2. The Units Problem (Interpersonal Comparison):**
  This is the deeper objection. vNM utility functions are unique only up to positive affine transformations. This means Individual A's utility scale has an arbitrary zero point and an arbitrary unit size. To sum $U_A + U_B$, we must know that one "util" for A is equivalent to one "util" for B.
  The theorem *assumes* we have fixed these scales to perform the addition, but it offers no mechanism for doing so. Without a method to calibrate interpersonal utility (e.g., via extended preferences or psychological metrics), the sum $\sum a_i U_i$ is mathematically well-formed but ethically meaningless. You cannot maximize a sum if the terms in the sum are incommensurable. Sen argues that by restricting the informational basis to ordinal preferences + risk attitudes, Harsanyi rules out the very data needed to make utilitarianism work in practice.

  ### IV. Adjudication

  To reach a verdict, we must evaluate whether the theorem provides "good reason" to accept utilitarianism.

  **Where the Friend is Right:**
  The friend is correct that the theorem exposes a vulnerability in non-utilitarian theories. If one accepts that social choice under uncertainty should obey the vNM axioms (particularly Independence), then non-linear aggregations are indeed ruled out. This forces opponents of utilitarianism to either reject the Pareto principle (unpalatable) or argue that social rationality differs from individual rationality (a complex task). The theorem successfully shows that utilitarianism is the *unique* solution to the problem of linear aggregation under risk.

  **Where the User is Right:**
  However, the user is correct that this does not amount to a proof of utilitarianism.
  First, the conflation of the Aggregation Theorem with the Impartial Observer Theorem is a category error. The Aggregation Theorem takes preferences as given; it does not judge them. It is compatible with slavery if the slaveholders' preferences are weighted heavily enough. The move to equal weights requires the Impartial Observer argument, which relies on controversial assumptions about identity and risk (e.g., is it rational to maximize expected utility behind a veil of ignorance?).
  Second, and more critically, the measurement problem is not a technical detail; it is the core of the ethical problem. Utilitarianism requires comparing the intensity of different people's experiences. The vNM axioms describe consistency in choice, not the magnitude of welfare. Deriving ethical weights from consistency axioms is an attempt to get an "ought" from a mathematical "is." As Sen famously noted, the theorem proves that *if* utilities are cardinally measurable and interpersonally comparable, *then* utilitarianism follows. But the "if" is doing all the work.

  **The Normative Status of the Axioms:**
  The crux of the dispute lies in the vNM axioms. Your friend treats them as "mild rationality assumptions." But in social ethics, the **Independence Axiom** is highly controversial. It implies that the value of a prospect should not depend on outcomes that are impossible in the current choice. In ethics, we might care about the *correlation* of risks (e.g., is it worse if everyone suffers together or if suffering is isolated?). By building the Independence Axiom into the definition of social rationality, Harsanyi effectively builds utilitarianism into the premises. The theorem is thus circular in a philosophical sense: it proves utilitarianism follows from axioms that already presuppose a utilitarian structure of value.

  ### V. Verdict

  **You win the argument, but your friend wins the constraint.**

  The verdict is that Harsanyi's Aggregation Theorem **does not give us good reason to accept utilitarianism as a moral truth**, though it does give us good reason to accept it as a **consistency condition for a specific model of rationality.**

  Your friend claims the theorem "all but proves utilitarianism." This is false. It proves that *weighted welfarism* is the only coherent aggregation method *given* the vNM framework. It does not justify the weights (leaving it compatible with dictatorship) and it does not justify the measurability (leaving the sum potentially meaningless). It is a conditional statement: *If* ethics is about satisfying vNM-rational preferences under risk, *then* ethics is utilitarian. But the antecedent is a massive ethical assumption, not a neutral fact of rationality.

  However, you must concede the following to your friend: The theorem places a heavy burden of proof on non-utilitarians. You cannot simply assert a non-linear social welfare function; you must explain why social choice should violate the vNM axioms that govern individual rational choice. You must defend why "rationality" in ethics differs from "rationality" in decision theory.

  **Final Judgment:**
  The theorem is a powerful *internal* validation for utilitarians, showing their theory is mathematically robust within the expected utility framework. But as an *external* justification for someone who does not already accept utilitarian premises, it fails. It solves the problem of aggregation only by assuming away the problems of weighting and measurement that define the utilitarian controversy. Therefore, it does not prove utilitarianism; it merely formalizes it. Your skepticism is philosophically healthier: the theorem clarifies the cost of utilitarianism (accepting vNM axioms and interpersonal comparability), but it does not pay that cost for us.
