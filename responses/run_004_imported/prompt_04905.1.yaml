      *   *Section 3: The Smartphone/Dashboard Context.* How would he use it? He'd love the interactivity *if* it followed ISOTYPE rules. He'd hate the "dark patterns."
      *   *Conclusion:* Summarize the tension. Neurath wanted *emancipation* through clarity. Modern vis often seeks *engagement* through stimulation.

