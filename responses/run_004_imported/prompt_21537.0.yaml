  A metaphysics student buys a guard dog advertised as "Disposed to bite any intruder."

  That night, a burglar breaks in. The student watches on CCTV as the burglar pats the dog on the head, and the dog wags its tail happily.

  The next morning, the student demands a refund. "This dog isn't disposed to bite! I have proof."

  The seller shakes his head. "The dog is fine. It was a **Fink**."

  The student asks, "So... is the dog still vicious underneath?"

  "No," the seller says. "The moment the burglar touched him, the dog's viciousness vanished."

  The student pauses. "So if I send the burglar back?"

  "He'll be friendly again," the seller says. "But the moment you stop testing him, the viciousness comes right back."

  ***

  **The Swap Test:**
  If you swap **Fink** for **Mask** in the second line, the joke breaks logically. If it were a *Mask*, the seller's explanation ("the dog's viciousness vanished") would be false—in a Mask case, the viciousness *remains*, it's just blocked (e.g., by a muzzle). The explanation only validates the term **Fink**.
