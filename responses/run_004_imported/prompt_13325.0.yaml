answer: |-
  This is a fantastic angle for a feature. Your source is correct: while the St. Petersburg paradox is the famous "gateway drug" to expected-value problems, the Pasadena paradox is the harder, more insidious cousin that keeps decision theorists up at night.

  For a general-interest audience, the challenge is to explain *conditional convergence* without using sigma notation. The key is to move away from the math of "summing" and toward the logic of "ordering."

  Here is a breakdown comparing the two paradoxes, the philosophical stakes of "undefined" vs. "infinite," and the current state of the debate, structured to help you draft your piece.

  ### 1. The Common Setup: The Coin Toss Game
  To see the difference, your readers need to see that the *mechanics* of the games are almost identical.

  Imagine a casino offers you a game. They flip a fair coin until it lands Heads.
  *   If it lands Heads on the **1st** flip, you get paid and the game ends.
  *   If it lands Tails, they flip again.
  *   If it lands Heads on the **2nd** flip, you get paid and the game ends.
  *   And so on.

  The probability of the game ending on flip *n* is always $1/2^n$ (1/2, 1/4, 1/8...). The paradox lies entirely in the **payoff schedule**.

  ### 2. St. Petersburg: The Problem of Infinity
  **The Payoff:** If the game ends on flip *n*, you win $2^n$ dollars ($2, $4, $8, $16...).

  **The Expected Value (EV) Calculation:**
  To find the EV, you multiply the probability of each outcome by its payoff and add them up.
  *   Flip 1: (1/2 chance) × ($2) = $1
  *   Flip 2: (1/4 chance) × ($4) = $1
  *   Flip 3: (1/8 chance) × ($8) = $1
  *   ...
  *   **Total:** $1 + $1 + $1 + ... = **Infinity.**

  **The Verdict:** The expected value is **infinite**.
  **The Intuition Problem:** No rational person would pay $1 million to play this game, even though the math says you should pay *any* finite amount. The average payout is infinite, but the *likely* payout is tiny.
  **The Standard Fix:** Economists usually solve this with **diminishing marginal utility**. Money isn't value; *utility* is value. The first million dollars matters more than the trillionth. If you cap the utility (bounded utility), the St. Petersburg EV becomes finite, and the paradox dissolves.

  ### 3. The Pasadena Paradox: The Problem of Order
  **The Payoff:** This is where Hájek and Nover (2004) got clever. They kept the probabilities the same but altered the payoffs to alternate between winning and losing, while decreasing in magnitude relative to the probability.
  *   Flip 1: Win $2 / 1
  *   Flip 2: Lose $4 / 2
  *   Flip 3: Win $8 / 3
  *   Flip 4: Lose $16 / 4
  *   (General rule: Payoff is $(-1)^{n-1} \cdot 2^n / n$)

  **The Expected Value Calculation:**
  When you multiply the probability ($1/2^n$) by the payoff, the $2^n$ terms cancel out, leaving a famous mathematical series:
  *   Flip 1: +1
  *   Flip 2: -1/2
  *   Flip 3: +1/3
  *   Flip 4: -1/4
  *   **Series:** $1 - 1/2 + 1/3 - 1/4 + ...$

  **The Verdict:** The expected value is **undefined**.
  **Why?** This is the *Alternating Harmonic Series*. In calculus, this series is *conditionally convergent*. It does sum to a number (the natural log of 2, or roughly 0.69), **but only if you add the terms in the exact order written above.**

  Here is the kicker, known as the **Riemann Rearrangement Theorem**: If a series is conditionally convergent, you can rearrange the order of the terms to make them sum to *any number you want* (positive, negative, or zero).

  **The Philosophical Trap:** In probability theory, the order in which you list possible outcomes shouldn't matter. Whether you list "Heads on Flip 1" before "Heads on Flip 5" or vice versa, the game is the same. But in the Pasadena game, changing the order of calculation changes the Expected Value from a profit to a loss, or to infinity.

  If the EV depends on the arbitrary order in which you do the math, then the EV **does not exist**. It is not infinite; it is incoherent.

  ### 4. Why "Undefined" is a Deeper Cut than "Infinite"
  Your source wasn't dramatizing. Philosophically, "undefined" is a more damaging verdict for Expected Value (EV) theory than "infinite."

  1.  **Infinity is a magnitude; Undefined is a breakdown.**
      *   With St. Petersburg, you can say, "The value is too big to comprehend." You can still technically compare two infinite games (e.g., one grows faster than the other).
      *   With Pasadena, the compass breaks. You cannot say the game is good, bad, or neutral. The theory fails to deliver *any* verdict.

  2.  **Bounded Utility doesn't necessarily fix it.**
      *   As mentioned, St. Petersburg is usually tamed by saying "utility is bounded" (you can't enjoy infinite money).
      *   Pasadena can be reconstructed to work *within* bounded utility. Even if the payoffs are capped in terms of "utils" rather than dollars, the mathematical structure of conditional convergence can remain. This suggests the problem isn't just about "infinite money," but about how we aggregate probabilities and values.

  3.  **It attacks Countable Additivity.**
      *   Standard probability relies on an axiom called *Countable Additivity*: if you have an infinite list of mutually exclusive outcomes, the probability of the whole is the sum of the parts. Pasadena suggests that if we stick to standard EV reasoning, we might have to abandon this core axiom of probability theory.

  ### 5. The Debate: Pathology or Deep Flaw?
  For your article, it is crucial to represent the dissent. Not all decision theorists agree that Pasadena destroys Expected Value theory.

  **Camp A: The "Mathematical Pathology" View (Skeptics)**
  *   **Argument:** The Pasadena game requires an *infinite* number of possible outcomes. The real world is finite. Effective Altruists aren't actually dealing with infinite series; they are dealing with very large, but finite, numbers (e.g., future generations).
  *   **Implication:** Pasadena is a interesting bug in the math of infinity, like dividing by zero, but it doesn't apply to real-world policy or existential risk. It's a "gotcha" for theorists, not a guide for donors.
  *   **Key Thought:** If you truncate the game at any finite point (say, 1 quadrillion flips), the paradox disappears.

  **Camp B: The "Structural Flaw" View (Hájek, Nover, et al.)**
  *   **Argument:** The paradox reveals that EV reasoning is not robust. If a theory breaks down in idealized cases, it casts doubt on its reliability in messy, near-idealized cases (like long-termism, which relies on projections far into the future).
  *   **Implication:** We need a new decision theory that doesn't rely on standard expectation sums.
  *   **Key Thought:** Long-termism relies on "fat tails" (tiny probabilities of huge impacts). Pasadena shows that when tails get fat enough, the math stops behaving intuitively.

  **Camp C: The "Weak Expectation" Fix (Kenny Easwaran)**
  *   **Argument:** Philosopher Kenny Easwaran proposed a solution specifically for Pasadena that doesn't rescue St. Petersburg. He suggests using "Weak Expectation" (based on the Law of Large Numbers) rather than standard "Strong Expectation."
  *   **How it works:** Instead of asking "What is the sum of the series?", ask "If I played this game many times, what would the average payout converge to?"
  *   **Result:** For Pasadena, the Weak Expectation *is* defined (it's $\ln(2)$). For St. Petersburg, it remains infinite.
  *   **Significance:** This suggests we can salvage EV theory by changing *how* we calculate it, but it requires admitting the classical definition was incomplete.

  ### 6. Connecting to Effective Altruism and Pascal's Mugging
  Here is the bridge for your readers:

  Effective Altruists and Long-termists often justify interventions (like pandemic prevention or AI safety) by citing tiny probabilities of saving billions of lives. Critics call this "Pascal's Mugging"—arguing that if you accept tiny probabilities of huge payoffs, you can be manipulated into ignoring certain, smaller goods.

  *   **St. Petersburg** is the warning that **Infinite EV** leads to absurd behavior (betting everything on a lottery ticket).
  *   **Pasadena** is the warning that **EV itself might be unstable**.

  If the Pasadena paradox holds water, it suggests that when we are dealing with extreme uncertainty and vast scales (the domain of Long-termism), Expected Value might not just give the *wrong* answer—it might fail to give *an* answer.

  However, the skeptic's counter-argument is vital for balance: EA decisions are finite. We are not literally flipping coins forever. Therefore, Pasadena is a limit case that shows where the map breaks, not necessarily where the territory is impassable.

  ### Summary for your Draft
  *   **St. Petersburg** says: "The value is too big to measure." (Problem: Infinity)
  *   **Pasadena** says: "The value depends on how you hold the ruler." (Problem: Undefined/Order-dependence)
  *   **Philosophical Stakes:** Pasadena resists the standard fixes (bounded utility) that solve St. Petersburg, suggesting a deeper structural issue with summing probabilities and values.
  *   **Relevance:** It doesn't prove Long-termism is wrong, but it complicates the claim that "Expected Value" is a straightforward, objective calculator for moral decisions involving extreme uncertainty.

  This distinction allows you to portray the decision theorists not as quibbling over angels on pinheads, but as checking the structural integrity of the very math used to justify saving the world.
