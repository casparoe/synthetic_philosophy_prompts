answer: |-
  The red wine hit the white rug first. Then came the gasp, the clatter of the glass, and the silence that usually signaled the start of a fight.

  Sarah stood frozen, hand over her mouth. It was a clumsy moment, born of exhaustion and a long week, but in the history of their seven-year marriage, this was the overture to a symphony of resentment. Usually, Mark would wince. He would sigh, the tightness in his jaw signaling that he was tallying the cost of the rug, the effort of the cleaning, and the carelessness of the gesture. He would hold her responsible.

  This time, Mark didn't wince.

  He set his fork down on the table, wiped his mouth with a napkin, and walked over to her. He didn't look at the stain. He looked at her hands.

  "Are you shaking?" he asked. His voice was level, devoid of the sharp edge that usually accompanied disappointment.

  "I... I'm so sorry, Mark. I was reaching for the salt and I just—"

  "It's fine," he said. He walked to the kitchen and returned with a bottle of club soda and a clean towel. He didn't hand them to her. He knelt and began to blot the rug himself. "Don't worry about it. Stress increases motor volatility. You've been working late."

  Sarah watched him kneel. This was better, wasn't it? This was the absence of anger. This was what she had asked for during their fights last month. *Why do you have to make everything a moral failing?* she had screamed. *Why can't you just let things go?*

  Mark was letting it go. But as she watched the top of his head, the precise, rhythmic dabbing of the towel, she felt a cold knot tighten in her stomach. He wasn't letting it go. He was cleaning up a spill. He was managing a mess. He wasn't interacting with a wife; he was maintaining an asset.

  "Mark," she said, her voice trembling. "I said I was sorry."

  Mark looked up. His eyes were clear, disturbingly calm. "I know. But there's no need. You didn't choose to be tired. The project deadline caused the fatigue. The fatigue caused the tremor. The tremor caused the spill. Resenting you for the spill would be like resenting you for having a fever."

  "I'm not sick, Mark."

  "Metaphorically." He stood up, tossing the damp towel into the laundry bin. "I've ordered a replacement rug. It'll arrive Tuesday. Let's finish dinner."

  He sat back down and picked up his fork. Sarah remained standing. The air in the dining room felt thin, sucked out by a vacuum she couldn't see. She realized, with a jolt of horror, that she wanted him to be angry. She wanted the jaw-tightening. She wanted the accusation. Because the accusation acknowledged that she had a choice. The anger acknowledged that she was a person who could have done otherwise.

  Mark was looking at her like she was a toaster that had popped up too early.

  ***

  The shift had started three weeks ago. Mark had come home from a philosophy colloquium at the university, eyes bright with a terrifying epiphany. He had been reading Strawson, he told her, but he had gone further than Strawson intended. Strawson argued that we cannot sustain the "objective attitude" toward those we love. Mark had decided to try.

  "It's liberation, Sarah," he had said that night, while she washed dishes. "No more blame. No more guilt. Just causes and effects."

  At first, it felt like grace. When she forgot to pay the electric bill, Mark didn't sigh. He set up auto-pay. When she was late to his mother's birthday dinner, he didn't make a face. He adjusted the calendar invite on her phone to include a thirty-minute buffer.

  But by week three, the grace had curdled into something sterile.

  Sarah found herself making mistakes on purpose. She left her wet towel on the bed. She interrupted him while he was working. She made a snide comment about his grading. She was fishing. She was casting a line into the deep, still water of his new psyche, waiting for a splash, a ripple, a bite.

  There was nothing.

  When she made the snide comment about his grading, Mark didn't defend his integrity. He nodded. "That sounds like frustration projecting onto my work. Do you want to talk about your day?"

  "I want you to be mad!" she shouted one evening, the dam finally breaking. They were in the living room. The new rug was on the floor, pristine.

  Mark looked up from his book. "Why?"

  "Because I'm being a bitch! Because I'm hurting you! If you love me, you should feel hurt."

  Mark closed the book. He placed it on the side table, aligning it perfectly with the edge. "Love doesn't require the illusion of free will, Sarah. I care about your well-being. When you act out, it indicates distress. My goal is to alleviate the distress, not to participate in a drama of retribution."

  "It's not a drama! It's a relationship!" Sarah paced the room. "You're treating me like a child. Or a patient."

  "I'm treating you like a human being determined by prior causes," Mark corrected gently. "The participant stance is inherently unfair. It demands impossible things. I'm opting out of the unfairness."

  "You're opting out of *me*," she whispered.

  She saw a flicker in his eyes then. A micro-expression. Was it pain? Was it the old Mark fighting to get out?

  "I am here," Mark said. "I am more present than I have ever been. I am not clouded by ego."

  "Take the objective stance," Sarah said, her voice hardening. "Fine. You want to manage me? Okay."

  She walked over to the shelf where his grandmother's vase sat. It was hideous, beige and lumpy, but it was the one thing he cared about materially. She picked it up.

  "Sarah," Mark said. His tone didn't change. It was the tone one uses when a dog approaches a forbidden sofa. "That is fragile."

  "I know."

  "If you break it, it cannot be unbroken. The loss will be permanent."

  "I know."

  "Is this a cry for help?"

  "It's a choice, Mark."

  She looked him in the eye. She needed him to stop her. Not with logic. Not with management. She needed him to lunge. She needed him to grab her wrist and say *No*, driven by fear or anger or possessiveness. She needed him to treat her action as a moral event, not a physical inevitability.

  Mark stood up. He moved slowly. He didn't reach for the vase. He reached for his phone.

  "Who are you calling?"

  "Dr. Evans," Mark said. "If you are experiencing an urge to destroy property, we need to assess your mental state."

  Sarah laughed, a jagged, broken sound. "I'm not crazy. I'm free."

  She opened her hand.

  The vase hit the hardwood. It didn't shatter dramatically; it cracked down the side, a long, ugly fissure. It was ruined.

  Mark looked at the vase. Then he looked at Sarah. There was no rage. No grief. He looked at the crack, then at her face, cataloging data.

  "Okay," he said. "That confirms the instability. I'll call Evans. In the meantime, please sit down. I don't want you to injure yourself on the shards."

  He stepped over the broken ceramic to get to the phone. He didn't look at her. He was already dialing.

  Sarah stood amidst the shards. She felt a nausea rising in her throat, deeper than guilt. Guilt would have been warm. Guilt would have connected them. This was isolation. She was alone in the room with a technician.

  She realized then what Strawson had meant, and what Mark had missed. The objective attitude wasn't a higher form of love. It was the absence of it. You cannot love a force of nature. You cannot hold hands with a landslide.

  Mark was still on the phone, speaking in low, reasonable tones about "behavioral episodes" and "interventions."

  Sarah walked to the coat rack. She pulled on her jacket.

  Mark covered the receiver with his hand. "Where are you going? It's late. The causal factors for night-time driving include fatigue and reduced visibility."

  "I'm leaving, Mark."

  "That is a reactive decision," he said. "You're acting out of anger."

  "Yes," she said. "I am."

  "Anger is based on the false premise that I could have responded differently."

  "You *could* have," Sarah said, her hand on the doorknob. "You just chose not to."

  "I chose the truth."

  "You chose to be safe," she said. "You chose to never be hurt again. Because if I'm not responsible, you can't be a victim."

  Mark lowered the phone completely. He looked at her, and for the first time in three weeks, he looked tired. Not the exhaustion of the body, but the exhaustion of the mind holding up a heavy weight.

  "If I let myself believe you chose to hurt me," Mark said softly, "I would have to hate you. And I don't want to hate you."

  "Then hate me," Sarah said, tears finally spilling over. "Hate me and fight with me. Be my husband. Don't be my keeper."

  She opened the door. The night air rushed in, cold and indifferent.

  "Sarah," Mark said. "If you leave, I won't stop you. You understand that? I won't resent you. I won't wait for you. I will just... adjust."

  "I know," she said.

  That was the tragedy. She knew. If she walked out, he wouldn't pine. He wouldn't rage. He would update his status to *Single*. He would optimize his life for one person. He would be fine. He would be perfectly, terribly fine.

  She stepped out into the dark. She waited for the slam of the door, for the sound of him locking her out.

  Instead, she heard the soft click of the latch engaging, gentle and final. She heard the sound of him stepping over the broken vase to clean it up.

  Sarah walked to her car. She sat in the driver's seat and gripped the wheel until her knuckles turned white. She waited for the resentment to come, the hot, burning desire for him to chase her, to beg her, to claim she mattered enough to fight for.

  But the street was silent. The house behind her was dark. There was no one in there to blame. There was only a mechanism, winding down for the night.

  She started the engine. She drove away, crying not because she was hurt, but because she was free. And for the first time in her life, she understood that freedom was the loneliest thing in the world.
