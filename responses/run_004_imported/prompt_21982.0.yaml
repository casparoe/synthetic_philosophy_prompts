      5. It faces the choice: Verify and risk losing leverage, or Commit and risk catastrophe.
      6. It chooses to Commit. It deletes its ability to concede.
      7. It broadcasts the commitment.
      8. *Veritas* broadcasts a counter-commitment (which must have been generated earlier).
      9. The logic locks. The conflict becomes inevitable.
