answer: |-
  Good evening, everyone. For those who don't know me, I'm the bride's brother. And I'll admit, standing here is a little intimidating. Looking out at the room, I realize about half of you are behavioral ecologists. The other half are family. And while my grandmother is very interested in whether we're having chicken or fish, I know that half this room is critically evaluating whether my words are evolutionarily stable strategies.

  Which brings me to a problem. Usually, at a wedding, the brother stands up and offers what economists call "cheap talk." I say, "They're perfect for each other." I say, "I've never seen him happier." But cheap talk is, by definition, untrustworthy. It costs me nothing to say, so there's no reason for you to believe it.

  And I happen to know that the groom finds cheap talk particularly unconvincing. For those who don't know, [Groom's Name]'s doctoral research focused on costly signaling. Specifically, on why gazelles "stot." When a cheetah appears, a gazelle doesn't just run; it jumps stiff-legged into the air. It wastes energy. It slows itself down. But that waste is the point. It signals to the predator: "I am so fit, I can afford to waste energy and still outrun you."

  In [Groom's Name]'s world, a signal is only honest if it is costly enough that a low-quality signaler couldn't afford to fake it.

  So, if I stand here and just tell you they are devoted, I'm ignoring the groom's own life's work. I need to show you the cost.

  Three years ago, [Bride's Name] and [Groom's Name] were in a difficult long-distance stretch. She was finishing her fieldwork; he was on the market. He was offered a postdoc that was, by every conventional metric, superior. Better funding, better lab, better prestige. But it was on a different continent.

  He turned it down.

  He took a position here, in her city, with fewer resources and less prestige, so they could be together.

  Now, for the biologists in the back: rest easy. I've done my reading. I know this isn't Fisherian runaway, where a trait becomes valuable just because it's correlated with a preference, regardless of its quality. This wasn't an arbitrary gesture to match a taste. This was Zahavi. This was the Handicap Principle. He voluntarily reduced his own immediate fitness to signal the quality of his commitment.

  And for the rest of the family: he sacrificed something real, not because he had to, but because *she* was worth the cost.

  In evolutionary terms, that makes the signal trustworthy. But in human terms, it makes it beautiful. It proves that for [Groom's Name], love isn't just a feeling you talk about; it's a resource you invest. He didn't just study commitment; he practiced it.

  So, I'm not going to ask you to just take my word that they are perfect for each other. Look at the data. Look at the choices. The signal has been sent, the cost has been paid, and the bond is honest.

  To the bride and groom.
