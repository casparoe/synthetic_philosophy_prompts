      *   It touches on the *Non-Identity Problem* (future people affected by regime change vs. current people saved).
      *   It touches on *Consequentialism vs. Deontology* (outcomes vs. duty to help those in front of you).
      *   It touches on *Epistemic Humility* (acknowledging limits of knowledge).
      *   It touches on *Complicity* (am I part of the system that entrenches the regime?).

