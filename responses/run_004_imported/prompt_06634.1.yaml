      *   *Refining the Political Analogy:* The user links Geometry -> Politics. I should emphasize that Hobbes's stubbornness in math mirrors his authoritarianism in politics. He cannot be "refuted" by subjects (or Wallis) because he is the "Maker." This ties (c) into a deeper structural point.

