      *   *Key Figures:* Hobbes, John Wallis, Seth Ward (early on).
      *   *Key Issues:* Squaring the circle, doubling the cube, angle trisection. Hobbes claimed solutions; Wallis proved them impossible (or at least showed Hobbes's were wrong).
