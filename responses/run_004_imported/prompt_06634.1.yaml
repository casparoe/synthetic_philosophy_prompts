answer: |-
  This is a fantastic angle for a graduate seminar piece. It moves beyond the standard "Hobbes was bad at math" anecdote and uses it to stress-test the coherence of his broader philosophical system. The connection between the *artificiality* of the geometric object and the *artificiality* of the Commonwealth is the right lever to pull.

  Here is feedback structured according to your three requests: historical check, philosophical assessment, and evaluation of your explanatory options.

  ### 1. Historical Check
  Your recollection is substantially correct, but a few nuances will sharpen the context for a specialist audience.

  *   **Timeline and Texts:** The dispute effectively begins with the publication of *De Corpore* (1655), where Hobbes includes his claimed solutions to the quadrature of the circle and the duplication of the cube. John Wallis (Savilian Professor of Geometry at Oxford) and Seth Ward (Savilian Professor of Astronomy) responded quickly. Wallis's *Elenchus Geometriae Hobbianae* appeared in 1655. Hobbes responded with *Six Lessons to the Professors of Mathematics* (1656). The feud continued through the 1660s and 70s (e.g., *Principia et Problemata*, 1666; *Lux Mathematica*, 1672) until Hobbes's death in 1679. So, "quarter-century" is accurate.
  *   **The Nature of the Error:** It is important to specify that Hobbes wasn't just making arithmetic slips. He was claiming to solve problems that were increasingly understood to be impossible using only Euclidean tools (straightedge and compass), though the rigorous proofs of impossibility came later (Lindemann, 1882). More critically, Wallis was employing the emerging methods of infinitesimals and algebraic analysis (*Arithmetica Infinitorum*, 1656), which Hobbes rejected on philosophical grounds.
  *   **The "Biographical Embarrassment":** Historians of science (notably Douglas Jesseph in *Squaring the Circle: The War Between Hobbes and Wallis*) have moved away from treating this merely as embarrassment. It is now seen as a clash of mathematical cultures: the classical, constructive geometry of Hobbes vs. the algebraic, infinitesimal analysis of Wallis. You should cite Jesseph; he is the definitive source on this specific conflict.
  *   **Shapin and Schaffer:** In *Leviathan and the Air-Pump*, they use the Hobbes-Wallis dispute to parallel the Hobbes-Boyle dispute. For them, Hobbes's geometry is about *demonstration* and *authority*, whereas Boyle's experimentalism is about *matters of fact*. This supports your "maker's knowledge" angle but adds the sociological layer of *who gets to decide truth*.

  ### 2. Philosophical Assessment: Is this a genuine puzzle?
  **Yes, it is a genuine puzzle, not a mere dissolve.**

  It dissolves only if you treat "maker's knowledge" as a claim about *ontological status* (I know what a circle is because I defined it) rather than *epistemic infallibility* (I cannot make mistakes reasoning about circles). However, Hobbes explicitly ties the *certainty* of geometry to its status as a constructible science to ground the *certainty* of civil philosophy.

  If the "maker's knowledge" doctrine implies that the method of construction guarantees truth (which Hobbes suggests in *De Corpore* when he contrasts geometry with natural philosophy), then his persistent failure is a systemic threat. It suggests that "making" the object is not sufficient for knowing the *relations* between objects, especially when those relations involve magnitude and proportion.

  Furthermore, the puzzle is fruitful because it highlights a tension in Hobbes's materialism. If thinking is computation (addition/subtraction of concepts), and geometry is the paradigm of correct computation, why did Hobbes's "computation" fail? If the answer is "human frailty," that weakens the analogy to the Sovereign, who is supposed to be an artificial person designed to overcome human frailty. If the answer is "methodological flaw," it undermines the claim that geometry is the *only* true science.

  So, do not let this dissolve. Press it. The tension between the *ideal* of constructive certainty and the *practice* of fallible reasoning is exactly where the philosophical work happens.

  ### 3. Evaluating Your Three Explanations

  Here is my assessment of your three options, ranked by philosophical defensibility, followed by a suggested fourth option.

  **(b) The Methodological/Ontological Mismatch (Strongest)**
  This is your most robust argument. Hobbes's "maker's knowledge" is predicated on a specific ontology: knowledge is knowledge of *causes*, and in geometry, the cause of a figure is the *motion* that generates it (point moves to make line, line to make surface).
  *   **Why it works:** Hobbes rejected Wallis's algebra and indivisibles because they were, to Hobbes, "scabs of symbols" and ontologically suspect (you cannot generate a line from indivisible points via motion). Hobbes was trying to square the circle using a kinematic geometry of finite motion. Wallis was using algebraic limits. Hobbes wasn't just "bad at math"; he was philosophically blinded to the tools that would have corrected him.
  *   **Implication:** This suggests that Hobbes's "maker's knowledge" is too restrictive. By insisting that we can only know what we can *construct via finite motion*, he deprived himself of the resources to solve the problems he tackled. This makes his failure a *consequence* of his epistemology, not an exception to it.

  **(a) Definitions vs. Deductive Chains (Weakest)**
  This is the standard "human error" defense.
  *   **Critique:** Hobbes explicitly defines reasoning as *computation*. In *Leviathan* and *De Corpore*, he argues that if you define terms correctly and follow the rules of addition/subtraction, error should be impossible (or at least easily detectable). To say "maker's knowledge covers definitions but not deduction" undermines the claim that geometry is a *scientia* superior to physics. If the deduction is fallible, the certainty of civil philosophy (which relies on long deductive chains from the state of nature to the sovereign) is also compromised. This explanation saves the epistemology by sacrificing the system's coherence.

  **(c) Rhetorical Prop (Cynical but Partial)**
  This suggests the epistemology is political posturing.
  *   **Critique:** While Hobbes was certainly aware of the political utility of claiming geometric certainty, there is little evidence he was cynical about the math itself. He seemed genuinely convinced. However, there is a deeper version of this: **The Sovereign Geometer.** Hobbes's refusal to concede to Wallis mirrors his political theory. Just as the Sovereign cannot be unjust (because he makes the law), the Geometer (Hobbes) cannot be wrong (because he makes the definitions). To admit error to Wallis would be to admit a higher authority than himself in the realm of reason. This ties the mathematical stubbornness directly to the political philosophy.

  **(d) A Fourth Diagnosis: The Limits of "Making"**
  I suggest you consider a synthesis of (b) and a new point: **The gap between Ideal Construction and Physical Imagination.**
  Hobbes insists that geometric objects are generated by motion. But in *De Corpore*, he admits we reason about these motions in the imagination. The imagination, for Hobbes, is decaying sense.
  *   **The Argument:** Hobbes's "maker's knowledge" requires us to construct objects in the imagination. But the human imagination is finite and imprecise. When dealing with quadrature (which involves incommensurable ratios and limits), the imagination fails to track the motion accurately. Wallis's algebra, which Hobbes hated, was actually *better* at handling these infinities because it abstracted away from the kinematic imagination.
  *   **The Payoff:** This reveals a crack in Hobbes's materialism. If "making" requires imagining motion, and imagination is fallible matter-in-motion, then "maker's knowledge" can never yield the absolute certainty Hobbes promises. It grounds the certainty of the Commonwealth on a psychological faculty (imagination) that proved unreliable in the very domain (geometry) meant to certify it.

  ### Recommendation for the Draft

  I would structure the argument to prioritize **(b)** but infuse it with the political stakes of **(c)**.

  1.  **Acknowledge the History:** Cite Jesseph. Establish that Hobbes wasn't just wrong; he was wrong *because* of his philosophical commitments (anti-algebra, anti-infinitesimals).
  2.  **The Puzzle:** Frame it as a threat to the *Leviathan* analogy. If the Geometer cannot secure certainty through construction, can the Sovereign secure peace through covenant?
  3.  **The Resolution:** Argue that Hobbes's failure exposes the limits of his **kinematic ontology**. His "maker's knowledge" works for simple definitions (what a circle *is*) but fails for complex relations (the *area* of a circle) because his prohibition on infinitesimals/algebra removed the tools needed to bridge that gap.
  4.  **The Twist:** Conclude that Hobbes's stubbornness wasn't just ego; it was philosophical consistency. To admit Wallis was right would be to admit that "knowledge" can come from symbolic manipulation (algebra) rather than causal construction (motion). He chose to be a wrong geometer rather than a right algebraist, because the latter would have undermined his entire materialist system.

  This makes the piece not just about Hobbes's math errors, but about the cost of his philosophical system. It transforms a biographical curiosity into a critique of early modern mechanistic epistemology.
