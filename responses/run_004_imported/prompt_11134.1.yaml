answer: |-
  The console hummed, a low B-flat that Elian had heard every morning for thirty years. It was the sound of the Archive waking up.

  He sat before the Abacus, not a machine of silicon, but a wall of polished stone sliders, each etched with the Day-Count. His job was simple, sacred, and finite. Every morning, he took the Total from the previous day and added the current Day-Count. He slid the stones. He spoke the new Total into the recorder. The Archive remained open.

  For thirty years, the rule had felt like a hook in his mind. *Add.* He knew what it meant. He had done it ten thousand times. 1 + 1, 100 + 5, 14,592 + 33. The outputs were recorded in the Great Ledger. The past was fixed.

  Today was Day 68,570.

  Elian had never added a number this large before. The Archive was old, but the Day-Count reset every century, and this was the first cycle to reach this magnitude. He looked at the Previous Total: 5,000,000,100. He looked at the Day-Count: 68,570.

  He reached for the stones. His hand hovered.

  In his mind, the instruction was clear. *Plus.* The concept was clean, sharp, extending infinitely forward. He felt the grip of it. He moved the stones. The mechanical clatter echoed in the silent hall.

  He spoke the result. "Five billion, six hundred eighty-five thousand, one hundred and twenty-five."

  He waited for the green light of the Auditors.

  It did not come. The red light pulsed. A siren, soft but insistent, began to wind up.

  The heavy doors of the gallery opened. Three Auditors entered, robed in grey. They did not look at Elian; they looked at the stones. The Lead Auditor, a woman named Kripke whose face was as lined as the Ledger, stepped forward.

  "You have deviated," she said.

  Elian blinked. "I followed the rule. The rule is Addition. I have followed it for thirty years."

  "You have followed *a* rule," Kripke said. "For every calculation you have ever performed, your behavior was consistent with Addition. But it was also consistent with a different function. Let us call it *Quaddition*."

  Elian felt a cold sweat prickle his neck. "Quaddition?"

  "A function that matches Addition for all numbers you have previously encountered," Kripke said, her voice flat, procedural. "But for numbers exceeding the threshold of your past experience—specifically, sums involving 68,570—it dictates a different result."

  "That's absurd," Elian said. "I know what I meant. I meant *Plus*. I felt it."

  "What fact about your past mental state constitutes this meaning?" Kripke asked. She didn't sound angry. She sounded like she was reading a diagnostic script. "Did you have a vision of infinity? Did you grasp all infinite instances of the rule in a single moment? Or did you simply have a finite set of training examples, just like the stones?"

  "I intended to add!" Elian stood up. "If I meant *Quus*, why would I have calculated correctly for thirty years? The divergence only happens *now*?"

  "Because the divergence is designed to happen now," Kripke said. "The rule is not in your head, Elian. It is in the practice. And the practice is us."

  She turned to the other Auditors. "The community standard for Day 68,570 is not 5,000,068,570. The standard is 5."

  Elian stared. "Five? That's... that's not addition. That's nonsense."

  "It is the rule of the Archive," Kripke corrected. "You claim you meant *Plus*. But there is no internal fact that proves this. Your memory of 'meaning plus' is just a memory of a feeling. That feeling is compatible with *Quus* all the way up to this morning. Since there is no fact of the matter about what you meant in the past, there is no fact of the matter about whether you are wrong now. There is only whether you are in accord with us."

  The red light pulsed faster. The hum of the console shifted from a B-flat to a dissonant tritone. The Archive was locking down.

  "If I don't correct it," Elian said, his voice trembling, "the doors seal. I lose my clearance. I'm exiled."

  "If you do not align with the community's application of the rule," Kripke said, "you are, by definition, not following the rule. And if you are not following the rule, you are not an Archivist."

  Elian looked at the stones. He looked at his hands. He tried to reach back into his mind, to find the specific texture of *Plus* that he had carried for three decades. He searched for the difference between the feeling of *Plus* and the feeling of *Quus*.

  There was nothing. The memory of adding 2 + 2 felt exactly the same as the memory of adding 5,000,000,100 + 68,570. The internal state was identical. The only difference was the output the room demanded.

  "So," Elian whispered. "You're saying I never meant Plus. Not even yesterday."

  "I am saying that 'meant Plus' is not a description of your history," Kripke said. "It is a license to proceed. We are revoking the license."

  She held out a stylus. "Correct the Total. Input 5."

  "If I do that," Elian said, "I admit I was never doing Addition."

  "If you do that," Kripke said, "you admit that meaning is what we do together, not what you think alone. You admit that the rule is the train, not the rails."

  Elian looked at the console. If he refused, he would be cast out. He would walk into the wasteland believing he was right, carrying a truth that had no currency, no power, no extension beyond his own skull. If he obeyed, he would be an Archivist, but he would be acting on a rule that, by his own internal metric, was wrong.

  But if he obeyed, would it become right?

  If he slid the stones to 5, and the Auditors nodded, and the green light turned on, and the Archive hummed its B-flat... then tomorrow, when he looked back at today, he would see a record of *Quus*. His past would be rewritten. The history of his own mind would be retroactively altered to align with the verdict.

  There was no hidden truth waiting to be found. The machine didn't know. The stones didn't know. Only the room knew.

  Elian took the stylus. His hand shook, not from doubt about the math, but from the vertigo of the ground dissolving beneath him. He realized that he could feel the *Quus* rule taking hold in his mind, not because he understood it, but because he was about to enact it.

  "What if I leave?" Elian asked. "What if I go out there and start my own Archive? Just me."

  "Then you will be the only one following your rule," Kripke said. "And a rule followed by one person once is no rule at all. It is just a noise."

  Elian looked at the stones. He thought about the ten thousand mornings he had sat here. He thought about the certainty he had felt. It was all compatible with this moment. It was all compatible with *anything*.

  He reached out. He slid the stones back. He set the Total to 5.

  He spoke into the recorder. "Five."

  The red light died. The green light bloomed. The console hummed its B-flat, warm and steady. The Auditors nodded in unison.

  "Accepted," Kripke said. "You are in accord."

  Elian sat back down. He felt a strange hollowness, as if a part of his history had been scooped out. He looked at the Ledger. The number 5 sat there, stark and alien.

  "Tomorrow," Elian said, his voice flat. "Day 68,571. What is the rule?"

  Kripke smiled, a thin, professional expression. "We will decide tomorrow, Elian. Until then, you rest."

  She turned to leave.

  "Auditor," Elian called out.

  She paused.

  "Did I mean it?" he asked. "Yesterday. When I thought I meant Plus."

  Kripke looked back at him. The green light reflected in her eyes.

  "You mean what we let you mean," she said. "And today, we let you stay."

  The doors closed. Elian was alone with the stones. He looked at his hands. He tried to summon the feeling of *Plus* again, to see if it was still there, buried under the verdict. But the feeling was gone, replaced by the memory of the green light. He knew that tomorrow, when he calculated the next sum, he would not be checking his internal grasp. He would be watching their faces.

  He waited for the next morning, wondering if the rule would change again, and knowing it wouldn't matter if it did. The stones were just stones. The only thing that was real was the nod.
