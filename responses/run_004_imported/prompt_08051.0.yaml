answer: |-
  The console didn't beep. It didn't have to. The red bar simply filled, silent and absolute, indicating the charge was ready.

  Elara stared at the button. It was a physical thing, a slab of haptic plastic in a room full of holographic ghosts. Pressing it would vent forty percent of the station's helium-3 reserves into the vacuum.

  Forty percent. That wasn't just fuel; it was the margin between thriving and starving for the next decade. It was heating, it was water reclamation, it was the difference between a full ration and a half-ration for the crew in Sector 4.

  "It's a ritual, Elara," Kael said. He was leaning against the bulkhead, arms crossed. He looked tired. They all looked tired. "You're dressing up a sacrifice in math so you don't have to call it faith."

  "It's not faith," Elara said. Her voice sounded thin in the recycled air. "It's logical necessity. We've run the simulation of them four million times. They've run the simulation of us. We are isomorphic decision-makers. If I defect— if I keep the helium— my simulation of them predicts I will keep the helium. So they keep theirs. We both starve in a suboptimal equilibrium. If I burn the fuel, I prove I am the type of agent that cooperates. Their simulation of me sees that. So they burn theirs. We both lose fuel, but we gain the stability of a cooperative multiverse."

  "You gain the *idea* of a cooperative multiverse," Kael snapped. "Look at the window, Elara. What do you see?"

  "Nothing."

  "Exactly. Nothing. No light. No gravity waves. No quantum entanglement handshake. We are in a different inflationary bubble. Causally disconnected. In principle. Forever. Nothing we do *there* can cause anything *here*. You are praying to a mirror and hoping the reflection prays back."

  "I'm not praying. I'm executing a strategy that accounts for the fact that *they* are executing a strategy that accounts for *me*."

  "That's just 'praying' with extra syllables." Kael pushed off the bulkhead and stepped closer. "If you press that, Sector 4 goes on half-rations. Children go cold. And you will never, ever know if the Other Side did the same. You can't check. You can't measure. You can't even theoretically receive a receipt. You are paying a real cost for a hypothetical return that is physically incapable of reaching you."

  Elara looked at the red bar. 100%.

  The theory was sound. It had to be. If the universe was computationally uniform, then agents of sufficient complexity would converge on the same decision theory. They were twins separated by a wall of physics. If Elara was rational, she had to assume the Other was rational. If the Other was rational, they would recognize the trade.

  But the wall was absolute. That was the terror of it. It wasn't just a long distance. It was a logical prohibition. Information could not cross. The only thing that crossed was the *logic* of the decision itself.

  "If I don't press it," Elara said softly, "then I know for a fact that I am a defector. And if I am a defector, then my simulation of them is a simulation of defectors. And I know, with one hundred percent certainty, that we are alone in a hostile void."

  "And if you do press it?"

  "Then there is a non-zero probability that we are part of a larger cooperative structure."

  "There is also a probability that you just dumped our life support because you liked the poetry of it." Kael's voice dropped. "Dana used to say this about the project. Before she left. She said it was religion for people who were afraid to admit they missed God."

  Elara flinched. Dana. The skeptic. The one who walked away when the math got too abstract.

  "Dana wanted causal proof," Elara said. "This doesn't offer causal proof. It offers acausal consistency."

  "It offers nothing but a lighter fuel tank."

  The timer on the console ticked over. *T-minus 60 seconds to vent window.*

  If she missed the window, the alignment of the mathematical constants would drift. The simulation fidelity would drop. The 'twin' on the other side would no longer be a perfect mirror. The trade would collapse. It was now or never.

  Elara placed her hand on the plastic slab. It was cool.

  She thought about Sector 4. She thought about the children who would wear extra layers next winter. She thought about the look on Kael's face when he realized she had chosen an abstract equation over their concrete warmth.

  She thought about the Other.

  She couldn't imagine them. Not really. They might be silicon. They might be gas clouds. They might be a single mind or a billion. But they were facing a button, too. A button that cost them something dear.

  *If I am real, they are real,* Elara thought. *If my choice matters, theirs matters.*

  "Elara," Kael warned. "Don't do this for a ghost."

  "I'm not doing it for them," Elara said. "I'm doing it for the version of me that exists in their calculation."

  *30 seconds.*

  Her finger hovered. The silence of the station pressed in. It was the silence of a tomb, or a womb. There was no way to verify if the mechanism worked. There was no sensor that could detect 'gratitude' from another universe. There was only the act.

  To cooperate was to trust that logic binds reality tighter than causality does. To defect was to trust only what you can touch.

  *10 seconds.*

  Kael turned away. He couldn't watch. He couldn't stop her, but he wouldn't witness the 'prayer.'

  Elara closed her eyes. She didn't pray. She ran the equation one last time. *P(Cooperation | Simulation) > P(Defection | Isolation).*

  *5 seconds.*

  She pressed.

  The station shuddered. A deep, mechanical groan vibrated through the floor plates as the valves opened. The hiss of escaping gas was a physical sound, a hiss of wealth vanishing into the dark. The gauges dropped. Forty percent. Gone.

  The console flashed *VENT COMPLETE.*

  Elara opened her eyes.

  The room was the same. The station was the same. The cold vacuum outside the window remained utterly indifferent. No light flared in the distance. No message arrived. The sensors remained blank. There was no acknowledgment. There could never be acknowledgment.

  Kael didn't turn around. He just watched the fuel gauge.

  "Done," Elara said. Her voice didn't tremble.

  "Okay," Kael said. He didn't move. "We're lighter. We're colder. And we're still alone."

  "We're still alone," Elara agreed.

  She looked at the blank screen where the data from the Other Side would have appeared if physics allowed it. It remained black. It would always remain black.

  She had paid the price. She had upheld her end of a contract that existed only in the space between thoughts.

  "Maybe," Elara said, staring into the void that would never stare back. "Maybe they're looking at their gauge right now, watching it drop, wondering if we're real."

  "Or," Kael said, finally turning to face her, his expression unreadable, "they kept their fuel, and they're warm, and they're laughing at the suckers in Bubble 7 who believed in ghosts."

  Elara looked at the fuel gauge. Then she looked at the dark window.

  "Maybe," she said.

  She didn't know. She would never know. She walked past Kael toward the door to check on Sector 4, leaving the silence of the control room to settle back over the console, heavy and unresolved.
