      *   *The Point:* Avicenna is trying to isolate *self-awareness* from *body-awareness*. He wants to show that the awareness of "I" persists even when awareness of "body" is completely removed. If he just said "no senses," someone might argue, "But you still feel your limbs." He's plugging every sensory loophole.

