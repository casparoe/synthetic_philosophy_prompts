  So I've been down a rabbit hole reading about 'verbal disputes' in metaphysics for a piece I'm noodling on about whether some philosophical fights are just people talking past each other, and I keep getting stuck on Eli Hirsch's quantifier variance move. As I understand it, he thinks disputes like the one between mereological universalists and nihilists (whether a bunch of particles arranged tablewise compose some further 'table' object) are merely verbal, since both sides could be speaking languages that use 'exists' in different but equally legit ways, and once you translate everything they actually agree on all the concrete facts. But couldnt basically any metaphysical dispute get the same treatment? What's supposed to stop this from just collapsing into 'nobody in metaphysics ever really disagrees about anything'? Can you walk me through the actual mechanics of the quantifier variance argument, and where Sider's 'joint-carving' response is supposed to block it from generalizing like that -- without just hand-waving about charitable interpretation?
