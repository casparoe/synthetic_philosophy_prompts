prompt: |-
  My novel-in-progress centers on Elena, a set theorist whose career has been built on Zorn's Lemma—equivalent, as she well knows, to the full Axiom of Choice—repeatedly invoked to secure the existence of maximal ideals, Hamel bases, and algebraic closures. At the novel's climax, a former mentor who has since become a committed constructivist confronts her with the Banach–Tarski paradox: if her methods are sound, a solid ball can be broken into finitely many pieces and reassembled, using nothing but rotations and translations, into two solid balls, each the same size as the original. Elena needs a real answer, not a deflection, and I cannot write the scene honestly until I have one myself. Write an essay that weighs the strongest arguments for and against treating Zorn's Lemma as a legitimate axiom of mathematical practice, and defends a definite verdict rather than merely surveying the debate. If the verdict must be conditional, state the condition plainly rather than leaving the matter open.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Context:** A novel-in-progress featuring Elena, a set theorist.
      *   **Conflict:** Climax scene where a constructivist mentor confronts her with the Banach-Tarski paradox (a consequence of the Axiom of Choice/Zorn's Lemma).
      *   **Task:** Write an essay weighing arguments for/against Zorn's Lemma (AC) as a legitimate axiom.
