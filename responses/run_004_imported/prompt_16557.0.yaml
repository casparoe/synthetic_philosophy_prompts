      *   **Task:** Construct an *original* example (not Demon/Mud, not Boss/Scapegoat) applying the WKR structure to a normative property *other* than goodness (e.g., trustworthiness, admirability, gratitude, contempt).
      *   **Requirements:**
          1.  Name the attitude and property.
          2.  Identify the "wrong kind" reason.
