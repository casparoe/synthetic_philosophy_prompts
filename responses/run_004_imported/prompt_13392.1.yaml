answer: |-
  Here are eight interview questions designed to probe the technical and philosophical commitments of your guest's position, including the three specific topics you requested. Each includes a follow-up tailored to the standard defensive moves a Humean/Best-System proponent typically makes.

  ### 1. The Cost of the Best System
  You defend the Humean Best System Account, which identifies chances with the summary rules that best balance simplicity and strength in describing the history of the world. But this view forces you to abandon David Lewis's original Principal Principle in favor of the New Principle. For a listener who finds the Principal Principle intuitively obvious—*if the chance is 30%, my belief should be 30%*—what is the philosophical payoff here? Why is preserving Humean supervenience worth the cost of making our principle of deference significantly more complex?

  *   **Follow-up:** She will likely argue that the Principal Principle is simply inconsistent with a Humean world, so we have no choice. If she does, press her on whether this suggests our *intuition* about chance is wrong, or if it suggests Humeanism is failing to capture what we mean by "chance."

  ### 2. The Mechanics of Defusing Undermining (Required Topic)
  I want to walk through the math of the undermining problem concretely. Under the Principal Principle, if a future sequence of events would determine the chances to be different than they are now, the current chance of that future sequence should be zero, yet the chance function says it's possible. This is the contradiction.
  Can you walk us through exactly how conditionalizing via the **New Principle**, rather than on the single-case chance directly, stops this probability from collapsing to zero? Where, in the calculation, does the "undermining" information get screened off?

  *   **Follow-up:** She will likely explain that the New Principle conditions on the *theory of chance* (T) as well as the chance value, i.e., $C(A | T \& Ch(A)=x)$. If she says this accounts for the information T carries about the future, ask: "But if T is a Humean summary, doesn't T *itself* imply constraints on the future mosaic? How does conditioning on T prevent T from telling us about the undermining future any more than the chance value did?"

  ### 3. The Definition of Admissibility (Required Topic)
  Lewis struggled to give a formal definition of "admissible evidence," often relying on a list of examples—like past history—that we intuitively feel don't give us "crystal ball" knowledge of the outcome. Critics argue this looks like a patch: we define admissibility as "whatever evidence doesn't break the Principal Principle."
  Is there a principled, structural definition of admissibility available to the Humean, or are we forced to accept a primitive notion that we only recognize by its effects?

  *   **Follow-up:** She will likely argue that admissibility is relative to the chance theory and that past history is the paradigm case. If she leans on "past history," ask: "If the laws of physics are time-symmetric, why is evidence from the past admissible while evidence from the future is not? What breaks the symmetry if the Humean mosaic is just a block of facts?"

  ### 4. The "Big Bad Bug" and Circularity (Required Topic)
  Lewis called the conflict between Humean supervenience and the Principal Principle the "big bad bug." My worry, and perhaps yours, is about circularity. If chances are just patterns in the mosaic, and my credences guide my actions which become part of that mosaic, then deferring to chance looks like I'm deferring to a pattern that includes my own deference.
  How do you escape the worry that, on a Humean view, the agent's credences are just more of the very pattern that fixes the chances, making the normativity of the New Principle circular?

  *   **Follow-up:** She will likely deny that individual credences are part of the mosaic that fixes the *objective* chances (which are usually macro-level or law-level). If she draws that line, ask: "But if my credences don't fix the chances, why should the chances fix my credences? What is the normative glue binding me to a pattern that is indifferent to my specific mental state?"

  ### 5. Explanation vs. Summarization
  A common objection to the Best System Account is that it makes chances "too thin." If chances are just summaries of frequencies, they can't *explain* those frequencies. It would be like saying a coin landed heads 50% of the time *because* the best summary of its history says it should.
  Do you accept that Humean chances don't explain outcomes, and if so, is that a bullet you're willing to bite, or do you have a deflationary account of scientific explanation that makes this less costly?

  *   **Follow-up:** She will likely bite the bullet and say chances systematize rather than explain. Press her on whether this undermines the scientific realism of her position: "If chances don't explain, why do physicists treat them as causal parameters in their equations? Are they all making a category mistake?"

  ### 6. Single-Case Chances
  The New Principle is often motivated by the need to handle single-case chances, like the 30% chance of rain tomorrow. But on a Humean view, a single case is just one data point. It doesn't contribute much to a "system."
  Does the Best System Account actually allow for meaningful single-case chances, or is every chance claim secretly a claim about a reference class of similar events? If it's the latter, how do I know which reference class applies to my specific Tuesday?

  *   **Follow-up:** She will likely argue that single-case chances are derived from the laws that govern that specific situation. Ask: "But if the laws are determined by the global mosaic, doesn't the 'chance' of this specific rain event depend on facts on the other side of the galaxy? How is that actionable for a forecaster?"

  ### 7. Decision Theory and Action
  Ultimately, I listen to a forecaster because I need to decide whether to carry an umbrella. If the New Principle changes how I calculate my credence compared to the Principal Principle, does it change how I bet?
  In a practical decision-theory context, does the shift from PP to NP ever result in a different action, or is it a purely theoretical adjustment that washes out in the limit?

  *   **Follow-up:** She will likely say it rarely changes action in everyday cases but matters in philosophical edge cases. Ask: "If it doesn't change action in the real world, is the debate about PP vs. NP merely metaphysical? Or does it matter for how we trust scientific institutions?"

  ### 8. Advice for the Self-Taught
  I've spent the last year teaching myself this material without formal training, starting from a simple question about rain forecasts that led me to Lewis and undermining. For listeners who feel that same nagging curiosity but are intimidated by the technical literature: where should they look next? Is there a specific paper or objection you think is the best "next step" for understanding where the Humean view stands today?

  *   **Follow-up:** (No follow-up needed for the closing question, but be prepared to ask for a specific title if she gives a vague answer like "read more Lewis.")
