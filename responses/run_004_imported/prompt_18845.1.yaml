answer: |-
  This is an excellent question that cuts to the heart of *On Certainty*. You have identified the precise tension that separates Wittgenstein's project from the foundationalist epistemology (and the modern rationalist appropriation) that often claims him.

  The rationalist reading tends to treat hinge propositions as **immutable Bayesian priors**: subjective starting points that are fixed for the agent to allow calculation. Wittgenstein, however, is describing **grammatical rules disguised as empirical facts**.

  To reconcile the Hinge and the Riverbed, we must distinguish between the **logical function** of a proposition at a specific moment and the **historical status** of that proposition over time.

  Here is a reading of how those two passages fit together.

  ### 1. The Hinge: A Functional Role, Not a Property
  The confusion often arises because we treat "being a hinge" as an intrinsic property of a proposition (like "being true"). Wittgenstein insists it is a **role**.

  In §§341–343, when Wittgenstein says the hinges "must stay put," he is making a conditional claim about the logic of inquiry. He is saying: *If* you are engaging in the language game of testing, doubting, or investigating, *then* something must be exempt from that testing. You cannot test everything at once, because a test requires a standard of measurement that is not itself being measured.

  *   **The Hinge Metaphor:** Describes the **synchronic** (at one time) structure of justification.
  *   **The Constraint:** It is not that the proposition *cannot* change; it is that *if* it moves, the door (inquiry) falls off. If you doubt the hinge, you are no longer playing the game of "empirical investigation"; you are playing the game of "philosophical skepticism" or "insanity."

  So, the "must stay put" is a requirement of the **system**, not a metaphysical guarantee of the **sentence**.

  ### 2. The Riverbed: The Historical Life of the Role
  In §§96–97, Wittgenstein zooms out to the **diachronic** (over time) perspective. He asks: Where do these hinges come from? Are they eternal truths?

  His answer is the Riverbed. Propositions start as fluid empirical claims ("There is a continent called America"). Through repeated successful use, they harden into the bedrock ("The earth has existed for a long time"). They become the channels through which other inquiries flow.

  *   **The Riverbed Metaphor:** Describes the **historical** evolution of certainty.
  *   **The Shift:** Crucially, the shift is not something an individual does during an investigation. It is a cultural, generational, or paradigmatic shift.

  ### 3. Reconciling the Two: System-Relative Necessity
  The reconciliation lies in recognizing that the **Hinge is the Riverbed in situ.**

  When you are standing in the water (doing science, living life), the bedrock beneath you *is* fixed. You cannot treat it as fluid while you are walking on it. To treat the riverbed as fluid *is* to be in the water. To treat it as bedrock *is* to stand on it.

  Therefore, a proposition's status as a hinge is **system-relative necessity**.
  *   **Absolute?** Yes, relative to the current form of life. Within our current scientific/language game, "The earth exists" is not an hypothesis. To doubt it is not to be "more rational"; it is to lose the capacity to formulate hypotheses.
  *   **Relative?** Yes, relative to history. There was a time when "The sun orbits the earth" was part of the riverbed. It hardened, functioned as a hinge for centuries, and then, through a shift in the bed itself (Copernicus, etc.), it became fluid and was washed away.

  **The Synthesis:**
  The Hinge metaphor explains *why* we cannot doubt certain things *now* (because doubt requires a background of certainty). The Riverbed metaphor explains *why* the things we cannot doubt *now* might not be the same things we couldn't doubt *then* (because the background of certainty evolves).

  ### 4. What Survives of the Claim?
  You asked: *"If it is the latter [relative], what survives of the claim that hinges are what make doubt possible, rather than merely whatever happens to be settled at a given time?"*

  This is the crucial move. What survives is the **structural necessity of certainty**, not the **specific content** of certainty.

  Wittgenstein is not saying, "Here is a list of propositions that are forever immune to doubt." He is saying, "Any system of doubt *must* have a list of propositions immune to doubt *for that system to function*."

  1.  **The Structure is Permanent:** The logic of "hinging" is invariant. You cannot have a language game of verification without unverified verifiers. You cannot have a door that swings without hinges that hold.
  2.  **The Content is Contingent:** Which propositions fill that slot depends on the "riverbed" of the current form of life.

  ### 5. Why the Rationalist Reading Fails
  The rationalist blogs you mention often use "hinge" to mean "a prior probability of 1 that I choose to protect from updating." This implies an agent *choosing* to hold something fast for pragmatic reasons.

  For Wittgenstein, it is not a choice. It is not even a "belief." It is a form of **animal certainty** or **knowing-how**.
  *   I do not *believe* I have two hands; I *use* them.
  *   I do not *assume* the world exists; I *act* within it.

  When the riverbed shifts, it is not because I updated my Bayesian priors. It is because my **form of life** has changed so drastically that the old certainties no longer facilitate action. (e.g., If we discover we are brains in vats, "I have a body" moves from riverbed to fluid hypothesis. But until that form of life is real, doubting it is nonsense, not skepticism.)

  ### Summary
  The two images are not contradictory; they are complementary perspectives on the same phenomenon.

  *   **The Hinge** is the view from **inside the practice**: "For this inquiry to work, this must be fixed."
  *   **The Riverbed** is the view from **outside the practice**: "What counts as fixed changes over geological/historical time."

  The proposition is a hinge *because* it has hardened in the riverbed. It stays put *while* we inquire, but the bed itself may shift over centuries. What survives is the insight that **certainty is not the culmination of inquiry, but its precondition**—even if the specific certainties are historically contingent.
