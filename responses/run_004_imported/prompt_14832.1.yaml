          *   *Dray (Rational Explanation):* Humans act for reasons. Explaining an action means reconstructing the agent's calculation (principle of action), not subsuming it under a physical law.
          *   *Walsh (Colligation):* Events gain meaning by being part of a pattern. The "whole" explains the "part."
