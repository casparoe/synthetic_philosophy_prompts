          *   *Critique of Narrative:* Saying "the riot was the opening act of the rebellion" isn't an explanation of *why* the riot happened. It's a classification based on future events. It violates the temporal asymmetry of causation.
          *   *Strongest Form:* Hempel isn't just being pedantic; he's defending scientific rigor. If history is to be knowledge, it must be objective and testable. Retrospective significance is subjective storytelling, not causal mechanism. If we can't predict it, we don't understand the mechanism.

      *   **Narrativists (Danto, Dray, Walsh):**
          *   *Core Claim:* History is about *meaning* and *intelligibility*, not just causal pushes and pulls.
