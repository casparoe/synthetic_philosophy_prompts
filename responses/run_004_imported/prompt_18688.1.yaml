answer: |-
  The digital clock on the wall read 23:55. Five minutes to $t$.

  Elara sat in the center of the soundproofed chamber, the velvet cushion heavy on her lap. Resting on the cushion was the stone. An emerald. At least, that was the word her tongue knew how to shape. For every moment of her life prior to midnight, this stone had been green. She had verified it daily for thirty years. The evidence was exhaustive. The induction was perfect.

  But tonight, the logic felt like a wire pulled tight against her throat.

  She knew the definition by heart. *Grue.* An object is grue if it is examined before time $t$ and is green, or examined at or after $t$ and is blue. By that definition, the stone on her lap was grue. It had been examined before midnight, and it was green. Every observation she had ever made confirmed the hypothesis: *All emeralds are grue.*

  Just as surely, every observation confirmed: *All emeralds are green.*

  Until now, the two hypotheses were indistinguishable. They rode the same data. But at 00:00, the paths diverged. If the world was green, the stone would remain as it was. If the world was grue, the stone would shift to blue the moment the clock ticked over.

  Elara closed her eyes. She tried to speak the other language in the dark. In the tongue of the Bleen speakers, *grue* and *bleen* were the primitives. *Green* was the constructed term. To them, green meant *grue* before $t$ or *bleen* after $t$. To a Bleen speaker, *she* was the one making the arbitrary, time-indexed prediction. They would say she was projecting a deviant predicate. They would say her expectation of continuity was a linguistic artifact, a habit of speech mistaken for a law of nature.

  Nothing in the light reflecting off the stone favored one word over the other. The photons hitting her retina were identical regardless of the predicate. The evidence was silent.

  23:58.

  Her heart hammered against her ribs. This wasn't a seminar room. She had bet her future on the stability of the spectrum. If the stone turned blue, her life's work in optics was built on a false projection. If it stayed green, she was safe, but she would never know *why* green was the projectible truth and grue was the error. Goodman called it entrenchment. We choose green because we are used to it. We carve nature at joints we are familiar with. But familiarity is not truth. It is only comfort.

  The hum of the ventilation system seemed to grow louder. She thought of the generations before her, looking at emeralds, calling them green, dying before $t$. They never had to face the shift. They died in the certainty of habit. She was the first to live past the boundary.

  23:59:30.

  She placed her hand over the stone. It was cool. Smooth. It felt like green. But feeling was not seeing. The definition relied on examination. To know the color, she had to look. But if she looked now, before $t$, she would only confirm the past. She had to wait. She had to let the boundary pass unobserved, then open her eyes into the new time.

  The seconds dragged, viscous and slow. 23:59:50.

  Was the universe consistent, or was it merely consistent with our language? If she saw blue, it wouldn't mean the stone had changed physically; it would mean her categories were wrong. If she saw green, it wouldn't mean nature was lawful; it would mean her habits were reinforced.

  23:59:58. 23:59:59.

  The clock blinked. 00:00:00.

  $t$ had arrived. The hinge of time had swung. The evidence collected over a lifetime was now sealed, locked away in the past where green and grue were one. The future was unwritten. The symmetry was broken only by her act of observation.

  Elara took a breath that shuddered in her lungs. She knew that whatever she saw, she would describe it using the words she knew. If it was blue, she would call it a change. If it was green, she would call it stability. But the reality beneath the word was inaccessible.

  00:00:05.

  She opened her eyes.
