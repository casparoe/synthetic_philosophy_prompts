  7.  **Final Polish:** Check against the specific text provided by the user. Ensure the explanation of "differ only IN NUMERO" vs "specifically distinct" is crystal clear. (In Numero = Two coins of the same denomination. Specifically = A coin vs. a button).

  8.  *(Final thought before generating)*: The user is asking for the *inference*. I need to make sure I don't just explain Berkeley's philosophy generally, but specifically how he gets from "The blind man fails the test" to "Sight and Touch are different languages."

