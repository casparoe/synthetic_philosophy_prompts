answer: |-
  The valve wheel was rusted iron, heavy enough to crush a foot, situated in the neutral chamber between the Upper Basin and the Lower Basin. For generations, the two communities had lived in isolation, separated by the landslide that blocked the river. Now the tunnel was clear, the water needed to flow to both, and the valve needed turning.

  In the Upper Basin, the convention was absolute. To open the flow, you turned the wheel deasil—clockwise. It was not written down, but it was known. You turned deasil because your father turned deasil, and because you expected your neighbor to turn deasil if you stepped away. To turn widdershins was to close the flow, or perhaps to break the mechanism. It was a regularity born of some ancient, forgotten accident, now hardened into law by sheer repetition.

  In the Lower Basin, the convention was the mirror image. To open the flow, you turned widdershins. There, a clockwise turn tightened the seal, choking the water. They too had their expectations, their mutual reliance on the predictability of the other's hand.

  When the tunnel opened, the administrators decided the valve would be managed by joint crews. Kael, from the Upper, and Mira, from the Lower, stood before the wheel on the first morning. They had met the day before to discuss the schedule, but not the mechanics. Why would they? The mechanics were obvious. The water needed to flow.

  "Ready?" Kael asked.

  Mira nodded. She gripped the left spoke. Kael gripped the right.

  "On three," Kael said. "One, two, three."

  They heaved. Kael turned clockwise. Mira turned counter-clockwise.

  The wheel did not move. The tension locked instantly, a sudden, violent stiffness in the iron. They strained, muscles bunching, expecting the give of the mechanism. There was only the groan of metal protesting against itself.

  "Stop," Mira grunted, letting go. "You're tightening it."

  "I'm opening it," Kael snapped, rubbing his shoulder. "Everyone knows clockwise opens."

  "Here? No. Here, widdershins opens."

  They stood back, breathing hard. The water remained still behind the seal. This was not a disagreement about preference; neither wanted the water blocked. Both wanted the same outcome. Both were willing to cooperate. But their expectations regarding *how* to cooperate were mutually exclusive.

  For the first three days, the neutral chamber was a site of quiet frustration. Crews rotated. Upper Basin workers arrived expecting the Lower workers to follow their lead on the turn. Lower workers arrived expecting the opposite. Sometimes they communicated verbally before touching the wheel, but often they didn't. Habit is faster than speech. There were near misses—fingers slipped, spokes spun unexpectedly when one person yielded too soon, causing the other to lose balance.

  The problem was not the physical action. Either direction would open the valve perfectly well. The problem was the knowledge. In the Upper Basin, it was common knowledge that clockwise meant open. You knew it, you knew that others knew it, and you knew that others knew that you knew it. That layered certainty allowed them to act without speaking. In the neutral chamber, that layers of certainty had collapsed. Kael knew what he knew, but he could no longer be sure what Mira expected him to do, and Mira could not be sure what Kael expected of her.

  On the fourth day, a crowd gathered. The water shortage was becoming critical. The administrators stood by, useless. They could issue edicts, but an edict is not a convention. A convention lives in the expectation of the crowd.

  An older woman from the Lower Basin, Elara, stepped forward. She didn't touch the wheel. Instead, she took a can of red paint from her belt. She painted a large arrow on the casing of the valve, pointing clockwise.

  "Today," she said, her voice carrying over the murmurs of both groups, "we follow the arrow."

  A man from the Upper Basin scoffed. "It should be green for go."

  "It's red because it's rust," Elara said. "It doesn't matter. It just needs to stick out."

  She looked at Kael. "You turn with the arrow. I will turn with the arrow. And tomorrow, we tell everyone else the arrow is the law."

  Kael hesitated. The arrow was arbitrary. It could have pointed left. It could have been a blue star. But it was there. It was salient. It broke the symmetry of the situation. Before, the two options were equal in weight, balanced on the scale of history. Now, the arrow added weight to one side.

  Kael nodded. He gripped the wheel. He turned clockwise. Mira, watching the arrow, turned clockwise. The wheel groaned, then gave. The water rushed through.

  The relief was palpable, but the tension remained. The convention had not returned; it had to be built. For the next week, the arrow was repainted every morning. If it faded, people hesitated. If someone wiped it away, the wheel locked again.

  Eventually, the paint became unnecessary. The new generation of workers, trained in the neutral chamber, never knew the old ways. They simply knew that when you approached the valve, you turned with the sun. The old Upper Basin workers retired, muttering about how it used to be obvious. The Lower Basin workers forgot that it was ever different.

  Kael watched the water flow on the thirtieth day. The system was stable again. Everyone conformed. Everyone expected everyone else to conform. They preferred this solution to the chaos of the first week. And yet, Kael knew that had Elara painted the arrow pointing the other way, they would all be turning counter-clockwise today, just as happily, just as firmly.

  He realized then that the peace they felt was not because they had found the *right* way. It was only because they had finally stopped looking for it. The certainty was back, but it was thinner now. They knew how fragile it was. They knew that underneath the routine, there was no logic, only the shared blink of an eye that said, *this way.*

  When a new apprentice asked why they turned clockwise, Kael didn't explain the history of the two basins. He didn't mention the clash of expectations or the week of locked wheels.

  "Because that's how we do it," Kael said.

  "And if we didn't?"

  "Then we'd be thirsty."

  It was the only truth that mattered. The rest was just noise, drowned out by the rush of the water.
