answer: |-
  You have grasped one of the most elegant and theoretically correct points in the philosophy of statistics. You are referring to the **Likelihood Principle**, and yes, mathematically, you are right: under Bayesian inference, the evidence provided by the data (the likelihood ratio) does not change based on the experimenter's private intentions about when to stop collecting data.

  Yudkowsky (and Jaynes before him) is correct that this is a devastating theoretical critique of *naive* Null Hypothesis Significance Testing (NHST). If a frequentist peeks at the data and stops when $p < 0.05$, they have inflated their Type I error rate. A Bayesian calculating a Bayes Factor does not mathematically invalidate their inference by doing the same thing.

  However, to answer your question: **No, this is not the "killer argument" that closes the book on the replication crisis, and it is not why psychology would have been saved simply by switching to Bayes.**

  Here is why that intuition, while mathematically sound, misses the broader picture of why the replication crisis happened and why Bayesians don't declare total victory.

  ### 1. The Replication Crisis Wasn't Just About Stopping Rules
  Optional stopping (peeking at data and deciding whether to continue) is a major sin in frequentism, but it was only one tool in the "Garden of Forking Paths."

  Even if every psychologist had used Bayesian methods from 1990 onwards, they still could have (and would have) engaged in:
  *   **HARKing:** Hypothesizing After Results are Known. (Presenting a post-hoc observation as a pre-registered prediction).
  *   **Predictor Switching:** Measuring 20 variables and only reporting the 2 that correlate with the outcome.
  *   **Data Exclusion:** "These 10 participants were outliers, let's drop them" (without pre-specified criteria).
  *   **Model Tuning:** In Bayesian analysis, you must specify a model. If you try 10 different covariance structures or interaction terms and only report the one that gives a high Bayes Factor, you have "Bayes-hacked" the result.

  The replication crisis was driven by **incentives** (publish or perish), not just **inference engines**. If journals only publish "significant" results ($p < 0.05$), researchers will find a way to get $p < 0.05$. If journals only publish "strong evidence" ($BF > 10$), researchers will find a way to get $BF > 10$.

  ### 2. You Can "P-Hack" a Bayes Factor
  While you cannot hack the *stopping rule*, you can hack the **prior** and the **model**.

  *   **Prior Manipulation:** The Bayes Factor is the ratio of the likelihood of the data under the null vs. the alternative. The "alternative" requires a prior distribution over effect sizes. If I choose a prior that is narrowly centered on the effect I hope to find, I can inflate the Bayes Factor. If I choose a wide, diffuse prior, I might dilute it. Researchers could (and do) try different priors until the result looks "publishable."
  *   **The "File Drawer" Problem:** Publication bias remains the biggest driver of the replication crisis. If 100 labs run a Bayesian experiment on a null effect, roughly half will get Bayes Factors favoring the null and half favoring the alternative (due to noise). If only the ones favoring the alternative get published, the literature is still wrong. Bayesian math does not fix the sociology of publishing.

  ### 3. Calibration and Error Control
  Frequentist methods have a specific utility that Bayesians often gloss over: **Long-run error control.**

  If I am the FDA approving a drug, I don't necessarily care about the subjective probability that this specific drug works. I care about the policy: *"If we approve drugs using this method, what percentage of approved drugs will be ineffective over the next 10 years?"*

  Frequentism guarantees that if the null is true, you will only reject it 5% of the time (assuming assumptions are met). Bayesian methods do not guarantee this frequency calibration. If everyone adopts a policy of "Stop when $BF > 3$," simulations show you can still accumulate false positives at a rate higher than you expect, depending on the base rate of true hypotheses.

  Bayesians argue that *belief* should not be calibrated to *frequency*, but in science, we often need to know the false discovery rate of the literature. Pure Bayesianism doesn't provide that guarantee without additional frequentist checking.

  ### 4. The "Subjectivity" Bottleneck
  The reason Bayesian methods didn't take over psychology in the 90s or 00s wasn't just inertia; it was computational and conceptual difficulty.

  *   **Computation:** Until recently, running complex hierarchical Bayesian models required MCMC sampling that was computationally expensive and hard to diagnose for convergence. $t$-tests are easy; Stan models are not.
  *   **Justification:** In a frequentist framework, you can say "I used the standard $\alpha=0.05$." In a Bayesian framework, you must justify your prior. Most psychologists are not trained to defend why they chose a Cauchy(0, 0.707) prior over a Normal(0, 1). This leads to either arbitrary default choices (which defeats the purpose of subjective Bayes) or manipulation (as mentioned above).

  ### 5. Yudkowsky's Rhetoric vs. Statistical Practice
  Yudkowsky is a brilliant communicator, but his writing on probability is often prescriptive (how rational agents *should* think) rather than descriptive (how institutions *actually* function).

  The "Beautiful Probability" argument is a **theoretical** knockout punch. It proves that p-values violate the Likelihood Principle. But science is not practiced in a theoretical vacuum. It is practiced by tired grad students under pressure to publish in a system that rewards novelty over truth.

  Switching to Bayesian statistics without changing the **incentive structure** (pre-registration, registered reports, valuing null results) would have just shifted the crisis from "p-hacking" to "prior-hacking" and "model-hacking."

  ### Summary
  You aren't missing the math; you're missing the sociology.

  *   **Yes:** The stopping-rule invariance of Bayesian inference is a massive theoretical advantage over naive p-values.
  *   **No:** It is not a magic bullet. The replication crisis was caused by **selection bias** (publication bias) and **researcher degrees of freedom** (p-hacking), not just stopping rules.
  *   **The Verdict:** Moving to Bayesian methods is likely a *net positive* for science (and many fields are doing so), but it is not sufficient to solve the replication crisis on its own. The "killer argument" kills the *stopping rule fallacy*, but it doesn't kill *bad science*.

  The solution isn't just better math; it's better norms (pre-registration, open data, replication studies). Bayesian stats + bad norms = Bayesian replication crisis. Frequentist stats + good norms = reliable science. Ideally, we want Bayesian stats + good norms.
