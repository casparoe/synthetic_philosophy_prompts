          *   Action-Optimal (Ex-interim): Maximize expected utility *at the intersection*, given you are there. This requires a belief about *which* intersection you are at.
              *   If you believe you are at 1st with prob $\alpha$ and 2nd with prob $1-\alpha$.
              *   Piccione & Rubinstein argue for consistency between the belief and the strategy.
