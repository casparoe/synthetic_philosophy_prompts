      *   *Setup:* Driver needs to exit at the 2nd intersection. Can't remember if they passed the 1st. Intersections look identical.
      *   *Payoffs:* Exit 1st (0), Exit 2nd (4), Pass both (1).
      *   *Strategy:* Probabilistic policy ($p$ = probability of continuing).
      *   *Question:* What $p$ should the driver choose?
