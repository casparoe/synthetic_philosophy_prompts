prompt: |-
  I lost my younger sister three weeks ago. She worked in inverse reinforcement learning -- inferring someone's reward function just from watching what they do, since people are unreliable narrators of their own wants. I'm a novelist, not remotely technical, but the family's asked me to give the eulogy because I "have a way with words." Problem is, half the room at the memorial will be her old labmates who'll catch every reference, and the other half is family who won't know an MDP from a hole in the ground. She was maddeningly undemonstrative her whole life too, never told us what she wanted, so all I've got is thirty-some years of observed behavior -- same as any IRL setup. I know enough from her dinner-table rants to know her fields dirty secret: the reward function is never uniquely recoverable from behavior alone, there's always some degenerate reading that fits the data just as well (technically "felt nothing, ever" explains the record no worse than "loved us fiercely") unless you bring a prior to it. I dont want to just assert the generous reading with total confidence, she'd call that sloppy, but I can't stand up there and be totally agnostic either. Can you write the eulogy -- 7-8 minutes, warm enough for my parents, honest enough that her old colleagues don't cringe?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (non-technical, "way with words").
      *   **Deceased:** Younger sister, worked in Inverse Reinforcement Learning (IRL).
      *   **Context:** Memorial service/eulogy.
      *   **Audience:** Mixed (50% family/friends, 50% labmates/tech colleagues).
      *   **Key Constraint/Theme:** The sister was undemonstrative (hard to read emotionally). The speaker understands the core technical concept of IRL (inferring rewards from behavior) and its "dirty secret" (non-identifiability/degeneracy: multiple reward functions explain the same behavior, including the null hypothesis of "feeling nothing").
      *   **Goal:** Write a 7-8 minute eulogy (approx. 900-1100 words spoken at a moderate pace).
      *   **Tone:** Warm for family, intellectually honest for colleagues (no sloppy sentimentality, but not coldly agnostic). Needs to navigate the "degenerate reading" problem without resolving it falsely.

  2.  **Deconstruct the Technical Metaphor:**
      *   *IRL:* Watching actions to guess what someone values.
      *   *The Problem:* Behavior $\neq$ Intent. You can't perfectly know what someone loved just by what they did.
      *   *The "Dirty Secret":* Under-determination. A robot that does nothing could have a reward function of "avoid pain" or "hate everything." A person who works late could be "passionate" or "avoiding home."
      *   *The Solution (in IRL):* Priors. You need a starting assumption about the agent to make sense of the data.
      *   *Application to Grief:* We are all trying to do IRL on our lost loved ones. The data is finite. The "null hypothesis" (she didn't care) is technically possible but practically useless. We choose a prior of love not because it's the *only* mathematical fit, but because it's the *only* useful one.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (novelist vs. scientist). Set the scene. Acknowledge the mixed audience.
      *   **The Core Concept (IRL):** Explain it simply for the family, accurately for the colleagues. Use the dinner table anecdote.
      *   **The Sister's Nature:** Undemonstrative. Hard to read. This makes the IRL metaphor perfect. She didn't tell us her "reward function."
      *   **The Technical Tension (The "Dirty Secret"):** Address the non-identifiability. This is the crux. Acknowledge that we can't *prove* she loved us based solely on data.
      *   **The Resolution (The Prior):** How do we resolve the ambiguity? Not with math, but with faith/choice. This satisfies the "honest but warm" requirement. We *choose* the prior of love.
      *   **Specific Memories (Observed Behavior):** Need concrete examples of her actions that serve as the "data points." (Fixing things, showing up, listening).
      *   **Closing:** A farewell that bridges the two worlds.

  4.  **Refining the Tone:**
      *   *Avoid:* Overly sappy clichés ("gone but not forgotten"), overly dense jargon ("Bellman equation," "polynomial time").
      *   *Include:* Specific IRL terms used correctly but contextually ("reward function," "trajectory," "prior," "degenerate solution").
      *   *Voice:* Reflective, slightly literary (novelist), but grounded.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the brother. She did AI. I write books. She studied how to guess what people want by watching them. She was quiet. We don't know what she felt. Math says you can't know for sure. Maybe she felt nothing. But that's a boring answer. We choose to believe she loved us. She showed up. That counts. Goodbye.

      *Critique 1:* Too blunt. Needs more emotional resonance and better explanation of the math metaphor for the family. Needs to be longer (7-8 mins).

  6.  **Drafting - Iteration 2 (Adding Flesh):**
      Start with the irony. I'm the wordsmith, she was the logic. Explain IRL: People lie, actions don't. She was hard to read. Her colleagues know the math: behavior doesn't equal intent. There's always a way to interpret actions as cold. But I'm applying a "prior." I'm assuming love. Here are things she did (data). She fixed my car. She visited mom. These are trajectories. We can't solve for X, but we know the variable exists.

      *Critique 2:* Better. Need to make sure the "degenerate solution" part doesn't sound like I'm accusing her of being cold. It needs to be about the *limitation of knowledge*, not the *limitation of her heart*. The choice of the prior is an act of love itself.

  7.  **Final Polish (incorporating the prompt's specific constraints):**
      *   *Time Check:* 130 words per minute average speaking pace. 7 minutes = ~910 words. 8 minutes = ~1040 words. Aim for ~1000.
      *   *The "Dirty Secret":* Make sure this is highlighted. It's the intellectual anchor.
      *   *The Resolution:* The "Prior" is the emotional anchor.

  8.  **Writing the Content (incorporating the thought process into the speech):**
      *   *Intro:* Establish the divide in the room.
      *   *The Work:* Explain IRL simply.
      *   *The Person:* Connect the work to her personality (undemonstrative).
      *   *The Problem:* The mathematical ambiguity of grief.
      *   *The Solution:* The human necessity of a "prior."
      *   *The Data:* Specific memories.
      *   *Conclusion:* Final send-off.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm giving a lecture. Keep the focus on *her*. The math is the lens, not the subject. Ensure the "degenerate reading" doesn't hurt the parents. Frame it as "The universe allows for doubt, but we reject it."

  9.  **Final Review against constraints:**
      *   7-8 minutes? (Word count looks right).
      *   Warm for parents? (Yes, focuses on love).
      *   Honest for colleagues? (Yes, acknowledges the IRL identifiability problem).
