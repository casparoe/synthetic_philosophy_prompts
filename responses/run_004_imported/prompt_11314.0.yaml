answer: |-
  This is an exceptionally sharp question. You have correctly identified the tension between the asymptotic elegance of the Kelly criterion (as formalized by Breiman) and the pragmatic conservatism of its most famous practitioners (like Thorp).

  The short answer is that Breiman's theorem describes an asymptotic limit ($t \to \infty$) under the assumption of **known probabilities**, whereas fractional Kelly is an optimization for **finite horizons** under **parameter uncertainty**.

  Thorp did not recommend fractional Kelly because he was "risk-averse" in the psychological sense; he recommended it because he recognized that Full Kelly is unstable in the presence of estimation error. Here is the breakdown of why the "objectively correct" Full Kelly becomes objectively suboptimal once you leave the realm of idealized mathematics.

  ### 1. The Estimation Error Problem (The Thorp Argument)
  This is the single most important practical reason for fractional Kelly, and it is where your reading of Breiman might be slightly over-idealized. Breiman's result assumes the bettor knows the true probabilities and payoffs.

  In reality, you never know the true edge. You have an *estimated* edge.
  *   **The Asymmetry of Error:** The growth rate function (expected log-wealth) is a parabola that peaks at the Full Kelly fraction. However, the slope of the curve is not symmetric around the peak.
      *   If you underbet (bet less than Kelly), growth decreases linearly (roughly).
      *   If you overbet (bet more than Kelly), growth decreases quadratically, and once you cross "double Kelly," expected log-wealth becomes negative (ruin is inevitable).
  *   **The Robustness Argument:** Because the penalty for overestimating your edge is catastrophic (negative growth) while the penalty for underestimating it is mild (sub-optimal growth), the mathematically robust strategy under uncertainty is to bet less than your calculated Kelly.

  Thorp explicitly framed this not as a concession to risk aversion, but as a correction for **epistemic uncertainty**. If you believe your edge calculation has a standard deviation of $\sigma$, the optimal bet size shrinks as $\sigma$ increases. In a Bayesian framework, if you integrate over the posterior distribution of the edge rather than plugging in the point estimate, the resulting optimal bet is almost always fractional Kelly.

  ### 2. Samuelson's Objection: Finite Horizons vs. Asymptotics
  You mentioned Samuelson, and his critique is vital here. Samuelson argued against the "Fallacy of Large Numbers." He pointed out that just because a strategy dominates almost surely as $t \to \infty$, it does not mean it maximizes expected utility for any *finite* $t$.

  *   **Volatility Drag:** Full Kelly maximizes the *median* terminal wealth, but it does not maximize the *mean* terminal wealth (which would be betting everything on every positive EV bet). More importantly, Full Kelly entails massive drawdowns. There is a 50% chance that a Full Kelly bettor will experience a 50% drawdown at some point.
  *   **The Utility Mismatch:** Breiman's theorem proves that Kelly outperforms other fixed-fraction strategies *in terms of growth rate*. It does not prove that Kelly maximizes *your* utility function unless your utility function is exactly logarithmic.
      *   If your utility is $U(w) = \log(w)$, Full Kelly is optimal (assuming known edges).
      *   If your utility is $U(w) = -1/w$ (more risk-averse than log), Full Kelly is too aggressive.
      *   If your utility is $U(w) = w$ (risk-neutral), Full Kelly is too conservative.

  Most humans and institutions have utility functions that are steeper than log in the short run (due to margin calls, psychological stress, or withdrawal needs). Fractional Kelly effectively approximates a utility function that is more risk-averse than log. Samuelson's point was that there is no "universal" objective criterion; there is only optimization relative to a specific utility function and time horizon.

  ### 3. The "Almost Surely" Trap
  You noted that Breiman proves a Full Kelly bettor will "pull permanently ahead... with probability one." This is mathematically true but practically misleading for two reasons:

  1.  **Convergence Time:** The time required for the Law of Large Numbers to smooth out the variance of a Full Kelly portfolio can be longer than a human lifespan or a fund's lifecycle. In the short-to-medium term, a Half-Kelly bettor will often have higher wealth than a Full-Kelly bettor, simply because they suffer less volatility drag during losing streaks.
  2.  **Relative vs. Absolute:** Kelly guarantees you will have more money than the other guy *almost surely*. It does not guarantee you will have *enough* money. If both strategies result in poverty, but Kelly results in slightly less poverty, Kelly "wins" the Breiman race but fails the agent's actual goals.

  ### 4. Does Geometric Rationality Change Anything?
  Scott Garrabrant's work on geometric rationality (and the associated logical induction stuff) reframes probability as a tool for avoiding Dutch books in a computational setting, rather than a frequentist property of the world.

  Does this change the bet-sizing debate? **Substantively, no. Philosophically, yes.**

  *   **Substantively:** Geometric rationality reinforces that the log-score is the correct measure of belief accuracy. This cements the Kelly criterion as the bridge between belief accuracy and wealth growth. It doesn't introduce new math that overturns Thorp or Breiman.
  *   **Philosophically:** It strengthens the argument for **fractional** Kelly. In the geometric rationality framework, probabilities are not "true" external frequencies; they are internal credences subject to logical uncertainty and computational limits.
      *   If probabilities are logical inductions, they are inherently less stable than frequentist probabilities.
      *   This increases the "estimation error" variance discussed in point #1.
      *   Therefore, a geometric rationalist should arguably be *more* inclined toward fractional Kelly than a frequentist, because the epistemic ground beneath their probability estimates is softer.

  ### Summary
  The consensus among experts like Thorp isn't that Breiman is wrong; it's that Breiman's assumptions (known probabilities, infinite time, log utility) are never met in practice.

  Fractional Kelly is not a compromise on the *math* of growth; it is an optimization of the math for **parameter uncertainty** and **finite horizons**.
  *   **Breiman** tells you what to do if you are God (omniscient and immortal).
  *   **Thorp** tells you what to do if you are a human (fallible and mortal).

  If you treat your edge estimates as distributions rather than point values, "Full Kelly on the mean estimate" is actually an overbet. "Fractional Kelly" is often just "Full Kelly on the risk-adjusted lower bound of the edge." Viewed that way, it remains the mathematically rigorous choice.
