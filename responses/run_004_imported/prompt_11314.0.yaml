prompt: |-
  This came up in a reading group I'm part of that has spent the last few weeks working through the standard rationalist-blogosphere material on bet sizing: Thorp's old papers, the relevant stretch of Poundstone's Fortune's Formula, and a handful of LessWrong posts that fold the Kelly criterion into Scott Garrabrant's "geometric rationality" framework. Between all of that, I think I finally have a solid grip on why maximizing expected log-wealth is the right response to repeated favorable bets, rather than naively maximizing expected wealth itself. What's still tripping me up is the standard advice I keep running into, from poker forums to EA-adjacent posts about sizing prediction-market positions, to bet only a fraction of full Kelly — half-Kelly, say — rather than the full amount.

  As I understand Breiman's classic result on proportional betting, a full-Kelly bettor will, with probability one, eventually pull permanently ahead of anyone running a different fixed-fraction strategy, and will reach any sufficiently large wealth target faster, in expectation, than any other strategy could manage. If the theorem really delivers that, betting less than full Kelly looks like it can only be an ad hoc concession to risk aversion, tacked onto a criterion that was already supposed to be the objectively correct answer to the risk-aversion question — there shouldn't be any further growth-rate-relevant consideration left for fractional Kelly to be tracking. And yet Thorp himself, who was about as rigorous a Kelly bettor as has ever existed, spent much of his career recommending fractional Kelly in practice, and I gather this whole dispute traces back to Samuelson's objections to Kelly enthusiasts, which I've never seen spelled out clearly.

  So: given that Breiman's theorem already identifies the strategy that wins almost surely, why do so many people who clearly understand the math — Thorp very much included — treat fractional Kelly as the more defensible position rather than as a compromise for those who haven't fully internalized the proof? And does Garrabrant's "geometric rationality" reframing change anything substantive about this debate, or is it best read as restating, in more philosophical language, a question that Breiman's mathematics had already closed?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is part of a reading group studying bet sizing (Thorp, Poundstone, LessWrong, Garrabrant). They understand *why* Kelly (max expected log-wealth) is better than max expected wealth for repeated bets.
      *   **The Core Puzzle:** They are confused about *fractional Kelly*.
      *   **The User's Argument:** Breiman's theorem says full Kelly wins almost surely (probability 1) against other fixed-fraction strategies and reaches wealth targets fastest. Therefore, betting less than full Kelly seems like an ad hoc concession to risk aversion, not a mathematically optimal move within the Kelly framework.
      *   **The Conflict:** Thorp (a Kelly purist) recommended fractional Kelly. Samuelson objected to Kelly.
      *   **The Questions:**
          1.  Why do experts (like Thorp) recommend fractional Kelly if Breiman's theorem says full Kelly wins almost surely?
          2.  Does Garrabrant's "geometric rationality" change anything substantive, or is it just philosophical restatement?

  2.  **Initial Assessment & Fact-Checking:**

      *   *Breiman's Theorem:* It's true that Kelly maximizes the asymptotic growth rate. It's true that with probability 1, a Kelly bettor will outperform any *essentially different* strategy in the long run.
      *   *The "Almost Surely" Caveat:* "Probability 1" doesn't mean "always." There are paths where Kelly does terribly in the short/medium term.
      *   *Thorp's Stance:* Thorp *did* recommend fractional Kelly. Why? Primarily due to *estimation error* (edge uncertainty), not just risk aversion.
      *   *Samuelson's Objection:* Samuelson argued that maximizing expected log-utility isn't universally optimal for *all* utility functions, especially over finite horizons. He criticized the idea that Kelly is "the" objective truth for everyone.
      *   *Garrabrant/Geometric Rationality:* This frames probabilities and updates in terms of geometric means rather than arithmetic means to avoid Dutch books and ensure coherence in logical induction contexts. It supports the log-utility framework but adds a layer of epistemic humility.
      *   *The "Risk of Ruin" Misconception:* Full Kelly *never* goes to zero if bets are finite and edge is positive, but it experiences massive drawdowns.
      *   *The Key Insight:* The user is conflating *asymptotic optimality* with *finite-horizon utility* and *parameter uncertainty*.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate their understanding of Breiman/Kelly but pinpoint the missing pieces (estimation error, finite horizons, utility curvature).
      *   **Point 1: Estimation Error (The Thorp Reason):** This is the biggest practical reason. Kelly assumes you know the *true* probabilities and payoffs. In reality, you have an *estimated* edge. If you overestimate your edge, Full Kelly becomes overbetting, which leads to negative growth. Fractional Kelly is a hedge against overconfidence.
          *   *Math intuition:* Growth rate is a parabola peaking at Kelly. It drops off sharply on the overbetting side (risk of ruin/negative growth) and slowly on the underbetting side. Fractional Kelly sits on the "safe" slope.
      *   **Point 2: Finite Horizons and Volatility Drag (The Samuelson Reason):** Breiman's theorem is asymptotic ($t \to \infty$). Humans have finite lifespans and finite investment horizons.
          *   *Volatility:* Full Kelly has massive variance. In the short run, you might be down 50%+ while a half-Kelly bettor is up.
          *   *Utility:* If your utility of wealth isn't *exactly* log (e.g., you need a certain amount to retire, or you have diminishing returns steeper than log), Full Kelly isn't optimal. Samuelson's critique was that Kelly is only optimal *if* your utility is log. If it's not, don't use Kelly. Fractional Kelly approximates a more risk-averse utility function.
      *   **Point 3: The "Almost Surely" Trap:** Explain what "Probability 1" means. It allows for paths where you go broke (or close to it) before the long run kicks in. Also, "outperforming others" doesn't mean "absolute wealth is high." You can win the race while both of you are poor.
      *   **Point 4: Garrabrant and Geometric Rationality:** Address the specific LessWrong angle.
          *   Geometric rationality reinforces the *log* score as the proper measure of belief accuracy.
          *   Does it change the bet sizing debate? Not really on the math, but it strengthens the epistemic humility argument. If probabilities are logical inductions rather than frequentist truths, uncertainty is higher. This supports fractional Kelly as a buffer against epistemic error.
      *   **Conclusion:** Summarize. Fractional Kelly isn't a compromise on risk aversion *within* the Kelly framework; it's an optimization *of* the Kelly framework given real-world constraints (error, finite time).

  4.  **Refining the Arguments (Self-Correction/Nuance):**

      *   *Correction on Thorp:* Make sure to emphasize Thorp's specific reasoning. In *Fortune's Formula* and his papers, he explicitly talks about "edge uncertainty."
      *   *Correction on Breiman:* Breiman compares Kelly to *other fixed fraction* strategies. It doesn't necessarily beat *all* strategies (e.g., strategies that change based on state), but it's the growth optimal one.
      *   *Samuelson's specific critique:* Samuelson argued against the "Fallacy of Large Numbers." Just because something is good in the limit doesn't mean it's good for any finite $N$. This is crucial.
      *   *Geometric Rationality:* Be careful not to overstate this. It's more about the foundation of probability than bet sizing mechanics, but the "optimization under logical uncertainty" angle is relevant.

  5.  **Final Polish:**

