prompt: |-
  My grandmother turns ninety next month, and I am giving the toast at her birthday dinner. She taught Latin and Roman history for forty years, and although she has grown physically frail and no longer travels or lectures, she still spends every morning tending her garden and has never, in my hearing, complained about old age in the way the very old are expected to. For decades she has instead quoted Cicero's De Senectute at anyone who will listen, treating it as something closer to scripture than to consolation literature. The guest list is a curious mix: three or four of her former doctoral students, now classicists in their own right, are flying in and will notice immediately if I mangle Cato's argument, while most of the table will be grandchildren, cousins, and neighbors who have never read a word of Cicero and simply want to feel something.

  I would like the toast organized around the four charges that Cicero has Cato answer in turn — that old age removes us from active affairs, weakens the body, strips away most of our pleasures, and brings us near to death — using that structure to say something true about her present life rather than something merely nice. She has always insisted that the cheap comfort people offer the old ("you're only as old as you feel," "age is just a number") is precisely what Cato refuses to say, since his whole argument depends on old age being genuinely different from youth and still worth having on its own terms; the toast should not lapse into that cliché even in passing. The fourth charge, concerning the nearness of death, cannot be avoided at a ninetieth birthday, but my grandmother does not share Cato's hope of one day rejoining the company of great souls, so that closing movement will need real delicacy: it should neither put a belief in her mouth that is not hers nor flatten the argument into mere stoic resignation. The toast should reward the former students who will recognize every move from the text while still landing, unassisted, for relatives who have never heard of Cato. Please write it, aiming for about four or five minutes at the lectern.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** 90th Birthday Dinner for Grandmother.
      *   **Speaker:** Grandchild.
      *   **Honoree:** Former Latin/Roman History teacher (40 years), physically frail, gardener, stoic (no complaining), loves Cicero's *De Senectute* (treats it like scripture).
      *   **Audience:** Mixed.
          *   *Experts:* 3-4 former doctoral students (classicists) who know the text well.
          *   *Laypeople:* Grandchildren, cousins, neighbors (want emotion, not academic lecture).
      *   **Structure:** Organize around the four charges against old age in *De Senectute* (withdrawal from affairs, physical weakness, loss of pleasure, nearness of death).
      *   **Tone/Constraint:**
          *   Must be "true," not just "nice."
          *   Avoid clichés ("age is just a number," "young at heart"). Acknowledge old age is *different*, not denied.
          *   Handle the 4th charge (death) delicately. She *doesn't* believe in the afterlife/rejoining great souls (unlike Cato), so don't put that in her mouth. Avoid mere stoic resignation.
          *   Length: 4-5 minutes spoken (approx. 600-750 words).
          *   Dual-layer: Reward the classicists (accurate references) while remaining accessible to the family.

  2.  **Deconstruct *De Senectute* (On Old Age):**
      *   *Context:* Cicero writes this at 62 (considered old then), voicing Cato the Elder (who is 84 in the dialogue).
      *   *Charge 1:* Old age withdraws us from active pursuits (*abstrahit a rebus gerendis*). Cato argues wisdom guides the ship, not physical strength.
      *   *Charge 2:* Old age makes the body weaker (*corpus facit infirmius*). Cato argues for maintaining what you have and using the mind.
      *   *Charge 3:* Old age deprives us of pleasures (*privat omnibus fere voluptatibus*). Cato argues this is a *good* thing (freedom from passion).
      *   *Charge 4:* Old age is not far from death (*haud longe abesse a morte*). Cato argues for the immortality of the soul/nature's cycle.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Welcome everyone. Acknowledge the dual audience (family + academics). State the theme: Cicero's *De Senectute*. Establish that we won't offer cheap comfort.
      *   **Charge 1 (Active Affairs):** She doesn't lecture anymore. She doesn't travel. *But* she tends the garden. This is her new "active affair." It's not withdrawal; it's a change of scale.
          *   *Classicist nod:* Reference *rebus gerendis*.
      *   **Charge 2 (Physical Weakness):** Acknowledge the frailty. Don't lie and say she's strong. She *is* frail. But the mind remains. The garden requires bending, but she does it.
          *   *Classicist nod:* Reference *infirmius*.
      *   **Charge 3 (Pleasures):** She doesn't chase the pleasures of youth. She finds satisfaction in the harvest, the bloom. Cato says losing pleasure is a benefit; for her, it's a refinement.
          *   *Classicist nod:* Reference *voluptatibus*.
      *   **Charge 4 (Death):** The tricky part. 90 years. Death is near. Cato promises an afterlife. She doesn't. How to frame this? Focus on *legacy*, *memory*, and the natural cycle without the metaphysical promise. The "fruit" remains.
          *   *Classicist nod:* Reference *a morte*, but pivot the conclusion.
      *   **Conclusion:** Raise a glass. To her.

  4.  **Refining the Tone:**
      *   *Avoid:* "You're young at heart!" (She hates this).
      *   *Embrace:* "You are old, and it is magnificent."
      *   *Voice:* Respectful, warm, slightly intellectual but grounded.
      *   *Timing:* Read aloud to check pace. 650-750 words is usually safe for 4-5 minutes with pauses.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Grandma loves Cicero. Cato lists 4 complaints about being old. I'll go through them.
      1. You can't work. Grandma doesn't teach, but she gardens.
      2. You get weak. Grandma is frail, but she stands in the dirt.
      3. No fun. Grandma doesn't party, but she likes tomatoes.
      4. You die soon. Grandma doesn't think she'll see ghosts. But she lives in us.
      Happy Birthday.

      *Critique 1:* Too blunt. Needs more poetry and specific Ciceronian texture for the students. Needs to handle the death section more philosophically.

  6.  **Drafting - Iteration 2 (Adding Texture):**
      *   *Intro:* Mention the text explicitly. "Cato the Censor."
      *   *Point 1:* Use the metaphor of the pilot/steersman. She steers the family now, not the classroom.
      *   *Point 2:* Acknowledge the body. "The vessel wears." But the gardener's hands still work.
      *   *Point 3:* Pleasure. Cato says sex and food matter less. She says the taste of a strawberry matters more.
      *   *Point 4:* Death. Cato looks to the stars. She looks at the soil. Compost. New life. Not resurrection, but continuation.
      *   *Closing:* To the Gardener.

  7.  **Final Polish (Checking Constraints):**
      *   *Check:* Did I avoid "age is a number"? Yes.
      *   *Check:* Is the Latin accurate enough for the PhDs? (Need to ensure the four charges are distinct).
      *   *Check:* Is the death section secular but dignified? (Focus on memory and nature).
      *   *Check:* Length? (Aim for ~700 words).

  8.  **Writing the Toast (incorporating the above):**
      *   *Self-Correction during writing:* Make sure I don't sound like *I'm* lecturing. I am quoting *her* quoting Cicero.
      *   *Refining the Death Section:* Instead of "immortality of the soul," focus on "immortality of influence." The garden metaphor works well here. Seeds remain.

  9.  **Final Review against constraints:**
      *   4-5 minutes? (Word count looks good).
      *   4 Charges addressed? (Yes).
      *   No clichés? (Yes).
      *   Death handled delicately/secularly? (Yes, focused on legacy/nature).
      *   Accessible to laypeople? (Yes, explained the context).
      *   Rewarding to experts? (Yes, specific structural adherence).

  **(Self-Correction Note):** Ensure I don't get *too* academic in the language. Keep the sentences rhythmic for speech. Make sure the transition from the "death" point to the "toast" is uplifting, not somber.

  10. **Final Polish:** (Produces the provided output).
answer: |-
  Good evening, everyone. For those who don't know me, I am [Your Name], and I have the privilege of being [Grandmother's Name]'s grandchild.

  When I asked my grandmother what she wanted for her ninetieth birthday, she told me she didn't want platitudes. She didn't want to be told she was "young at heart." She has spent forty years teaching Roman history, and specifically, she has spent forty years insisting that Cicero's *De Senectute*—Cato on Old Age—is not a comfort book. It is an argument. Cato argues that old age is not a decline from youth, but a distinct state with its own virtues.

  So, in her honor, I am not going to tell you that ninety is the new fifty. Instead, I want to walk through the four charges Cicero levels against old age, and explain why my grandmother has answered every single one of them, not with words, but with her life.

  The first charge is that old age withdraws us from active affairs—*abstrahit a rebus gerendis*. It is true, Grandmother no longer lectures. She no longer travels to archives or grades papers late into the night. To the outside eye, she has withdrawn. But anyone who has seen her garden knows this is false. She has simply changed the scale of her republic. She does not steer the university anymore; she steers the seasons. She manages the soil, the pests, and the blooms with the same administrative rigor she once applied to a department. She is not retired from action; she has just changed her theater of operations.

  The second charge is that old age makes the body weaker—*corpus facit infirmius*. We do not need to lie about this. We see the frailty. The walking is slower; the hands are more brittle. Cato admits the body weakens, but argues the mind must hold the helm. We see this in her every morning. She does not pretend she can lift what she lifted at forty. Instead, she tends to what she can reach. She accepts the limitation without surrendering to it. There is a profound dignity in acknowledging the vessel is wearing thin, while refusing to let the light inside go out.

  The third charge is that old age deprives us of pleasures—*privat voluptatibus*. Cato argues this is actually a benefit, freeing us from the tyranny of passion. My grandmother would perhaps go further. She does not miss the frantic pleasures of youth. She has traded them for something deeper. The pleasure of a tomato ripened on the vine; the pleasure of a quiet morning with coffee; the pleasure of seeing her grandchildren grow. She has not lost the capacity for joy; she has refined it. She proves that when the noise of impulse fades, the signal of satisfaction becomes clearer.

  And finally, the fourth charge: that old age is not far from death—*haud longe abesse a morte*. This is the charge we cannot avoid today. Ninety years is a long reach, but the horizon is closer now than it was. Cato ends his argument by promising that the soul will survive to rejoin the company of great men. My grandmother is too honest a historian to promise what she cannot prove. She does not expect to meet Cicero in the ether.

  But she offers us something more grounded. She teaches us that death is not the opposite of life, but a part of its cycle. A gardener knows that the fallen leaf feeds the root. She does not look to the sky for immortality; she looks to the earth, and to us. She lives on in the stories we tell, in the history she taught, in the students who became scholars, and in the blood that runs through this room. She is not afraid of the end, because she knows she has already planted what will grow after she is gone.

  So, Grandmother, we will not tell you that you are young. You are ninety. You are old. And you are magnificent.

  To [Grandmother's Name].
