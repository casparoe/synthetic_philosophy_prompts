answer: |-
  This is a really painful situation, and it makes complete sense that you're torn. You are grappling with two distinct questions here: one is philosophical (can *not* doing something be a cause?), and the other is relational (why is the blame landing on just one person?).

  Here is a breakdown of what is happening, both logically and emotionally, which might help you navigate the conversation with your family.

  ### 1. Can "not doing something" actually cause an event?
  Your sister's argument ("I didn't do anything") is a very common intuitive reaction. In physics, if you don't touch a ball, it doesn't move. But in human systems (like health, safety, or relationships), **omission is absolutely a cause.**

  *   **The Context of Duty:** If a stranger walks past a drowning person, they didn't *cause* the drowning. But if a *lifeguard* sits in the chair and ignores a drowning person, their inaction is considered a cause of the death. Why? Because they accepted a role where action was expected.
  *   **The Medical Reality:** With heart medication, consistency is often part of the treatment. Breaking that consistency disrupts the biological system. Therefore, the missed dose is a contributing factor to the hospitalization.
  *   **The Verdict:** Logically, yes, her forgetting was a causal factor. It broke the chain of care that was keeping him stable.

  However, acknowledging that her forgetting was a *cause* does not mean she is the *only* cause, or that she deserves the level of blame she is receiving.

  ### 2. Why is the blame landing only on her?
  You noticed the double standard: You and your mom also didn't remind him, but you aren't being blamed. This comes down to **Role Expectation vs. General Responsibility.**

  *   **Established Roles:** Your sister has become the "Medication Manager." By doing it usually, she created a dependency. When you have a specific role, failing to perform it is noticeable and damaging. When you (the user) or your mom don't do it, it's business as usual because it wasn't your job.
  *   **The "Weak Link" Theory:** When a family is scared (and hospitalizations are terrifying), they look for the point of failure to fix. Since your sister was the designated reminder, she is the "broken part" in their eyes. Blaming you or your mom wouldn't make sense to them because you weren't the assigned safety net.
  *   **Scapegoating Fear:** Often, when a parent gets sick, the family feels out of control. Blaming the sister gives the family a false sense of control. It implies: "If we just make sure *she* doesn't forget, this won't happen again." It ignores the reality that humans *always* forget things eventually.

  ### 3. The Elephant in the Room: Dad's Agency
  There is a massive piece of this puzzle that the family seems to be ignoring, which is why the blame feels so unfair to your sister. **Your dad is an adult.**

  Unless your father has been diagnosed with dementia or a cognitive impairment that prevents him from understanding his routine, **the ultimate responsibility for his medication lies with him.**
  *   The family has built a "single point of failure" system. They have tied his health entirely to your sister's memory.
  *   By blaming her exclusively, the family is inadvertently treating your dad like a child and your sister like a parent. This is unhealthy for everyone.
  *   If the system collapses because one person forgot one thing, **the system is broken,** not just the person.

  ### How to move forward
  You are in a unique position to mediate this because you see the unfairness but understand the logic. Here is how you might frame it to your family:

  **1. Validate the Sister (to lower defenses):**
  "I know everyone is scared and angry about Dad being in the hospital. [Sister's Name], I know you didn't do this on purpose. You carry a lot of the load for Dad's care, and one slip-up doesn't erase all the times you helped."

  **2. Reframe the Problem (System vs. Person):**
  "The issue isn't that [Sister] forgot. Humans forget things. The issue is that Dad's health depends 100% on one person's memory. That is too risky. If I had been the reminder, I could have forgotten too. If Mom had been, she could have forgotten."

  **3. Propose a Solution (Remove the Human Error):**
  Suggest moving away from "who reminds Dad" to "how do we automate this."
  *   **Pill Organizers:** A weekly box that shows if a dose was taken.
  *   **Alarms:** A loud alarm on Dad's own phone or watch.
  *   **Pharmacy Blister Packs:** Many pharmacies can package meds by date/time.
  *   **Shared Apps:** If a reminder is needed, use a shared family app where *everyone* gets a notification, or rotate the duty so no one person bears the burden.

  ### Summary
  To answer your specific questions:
  1.  **Did her forgetting cause it?** Yes, in the context of her established role, her inaction was a contributing cause.
  2.  **Is it weird to call inaction a cause?** No, not in caregiving contexts. Omission is a valid cause when there is an expectation of action.
  3.  **Why only her?** Because she holds the specific role. However, the family is unfairly placing *all* the responsibility on her and ignoring the fragility of the system and your dad's own autonomy.

  The goal now shouldn't be to decide who is guilty, but to build a system where a single forgotten reminder doesn't land anyone in the hospital again. That takes the target off your sister's back and puts the focus on keeping your dad safe.
