      *   Focus on family dynamics and logic.

  9.  **Final Polish:** Ensure the distinction between *causal responsibility* (did this lead to that?) and *moral responsibility* (should she be punished/blamed?) is clear. The sister might have causal responsibility without bearing the full weight of moral blame if the system was flawed.

