      *   **The Application:** Marriage isn't alive. So, technically, Theo and Sam are still two distinct substances.
      *   **The Acknowledgement:** Nod to the fellow philosophers in the room. "I know you're listening."
      *   **The Turn (Sincerity):** Why does this matter? Because love isn't about ontology; it's about action. Even if they aren't *one thing*, they act *as one*.
      *   **Reframing:** Instead of "two becoming one," it's "two choosing to navigate life as a team."
      *   **Conclusion:** The actual toast.

  5.  **Refining the Tone:**
      *   *Avoid:* Being too dry, academic, or self-indulgent. Don't make the philosophers feel superior, make them feel included in a private joke. Don't make the mom feel confused.
      *   *Include:* Warmth about Theo and Sam. Specific details (housemate life) to ground it.
      *   *Key Line:* Need a line that bridges the gap. "Metaphysics describes the world, but love changes it." (Maybe too cheesy). How about: "Ontology is about what exists; marriage is about what matters."

  6.  **Writing - Iteration 1 (Mental Outline):**
