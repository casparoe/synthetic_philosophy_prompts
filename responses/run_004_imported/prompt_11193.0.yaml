answer: |-
  Good evening, everyone. For those of you who don't know me, my name is [Your Name]. I'm Theo's housemate, his friend, and apparently, the guy he trusted to stand here and speak emotionally coherent sentences after he saw my dissertation draft.

  Theo and I have lived together for the past four years of grad school. Which means I've seen him at his best: defending his thesis, comforting friends, and planning this beautiful day. And I've seen him at his worst: trying to fix the dishwasher at 2:00 AM while muttering about Kant. So, when he asked me to be his Best Man, I was incredibly honored.

  But then, I started thinking about the speech. And as a metaphysician, I have a bit of a professional problem.

  You see, my entire doctoral dissertation defends a specific answer to what we call "The Special Composition Question." In plain English: *When do a bunch of separate things add up to make a new, single thing?*

  For example, take these bricks. Do they compose a wall? Or are they just bricks arranged wall-wise? Take the cells in my hand. Do they compose a hand? Or just cells arranged hand-wise?

  The philosopher Peter van Inwagen, whose work I base my career on, argues that some things compose a further thing *only* when their activity constitutes a life. Cells compose an organism because they are alive. Bricks do not compose a wall, because the wall is not alive. There is no "wall." There are just bricks.

  And this brings me to Theo and Sam.

  Traditionally, at a wedding, the Best Man says something like, "Today, two become one." Or, "They are now joined together."

  But if I say that literally, I am violating the core tenets of my own research. Because while Theo and Sam are definitely alive, "The Marriage" is not a biological organism. There is no third entity here. Ontologically speaking, there is still just Theo, and there is still just Sam. They remain two distinct substances.

  Now, I see about a third of you nodding. You know who you are. You're from the program. You are currently sipping your wine, waiting for me to contradict myself.

  To the rest of you—Theo's mom, Sam's aunts, the people from the office—I promise I am not about to turn this into a lecture. I mention this because it highlights something important about why I love this couple.

  If I were a strict van Inwagen-ian, I would have to tell you that nothing has changed. That they are the same separate people they were yesterday. But that's the thing about philosophy: it's great for describing the world, but it's terrible at describing *love*.

  Because while my dissertation says they don't compose a new *object*, looking at them together, it's obvious they compose a *life*.

  And that is the van Inwagen loophole I'm happily taking.

  When their activity constitutes a life—when they support each other through tenure reviews, when they raise a family, when they decide whose turn it is to take out the trash—they are doing the only thing in the universe that actually justifies composition. They aren't merging into a single blob. They are coordinating their lives so perfectly that, for all intents and purposes, they function as a single unit.

  So, Theo and Sam: I cannot truthfully say you are now one substance. The metaphysicians in row three would heckle me.

  But I can say this: You have chosen to entangle your lives so deeply that the distinction no longer matters. You are building a world where the sum is greater than the parts. You are proving that while logic might say you are two, love is a force strong enough to override the Special Composition Question.

  Theo, you're my best friend. Sam, you make him infinitely better than he was when he was just muttering about Kant over a broken dishwasher.

  So, if everyone could please raise a glass.

  To Theo and Sam. May you remain two distinct substances, but may your activities constitute a long, happy, and vibrant life together.

  To Theo and Sam!
