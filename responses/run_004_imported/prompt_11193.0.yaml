  1.  **Analyze the Request:**
      *   **Speaker:** A grad student in philosophy.
      *   **Honoree:** Theo (grad-school housemate, getting married to Sam).
      *   **Occasion:** Wedding reception (Best Man speech).
      *   **Duration:** ~5 minutes (roughly 700-900 words spoken at a moderate pace).
      *   **Core Conflict:** The speaker's dissertation defends Peter van Inwagen's *Special Composition Question* (SCQ) answer (Composition as Life). According to this view, composite objects only exist when their parts constitute a life. A marriage isn't a biological life, so "two becoming one" is mereologically false.
      *   **Audience:** Mixed. ~1/3 are metaphysicians (will get the technical joke), ~2/3 are normies (family, work friends, just want a nice toast).
      *   **Tone:** Warm, genuinely funny, sincere. Needs to acknowledge the philosophical constraint without alienating the non-philosophers or making the groom look like a logical puzzle.
      *   **Goal:** Make the philosophers laugh at the admission of "fibbing," but ensure the normies feel the emotional weight of the union.

  2.  **Deconstruct the Philosophical Concept (van Inwagen's SCQ):**
      *   *The Special Composition Question:* Under what conditions do some things compose a further thing?
      *   *Van Inwagen's Answer:* Only when the activity of those things constitutes a life. (e.g., cells compose a cat, but bricks don't compose a wall in the same ontological sense; there are just bricks arranged wall-wise).
      *   *Application to Marriage:* Two people (Theo and Sam) do not constitute a biological life together. Therefore, "The Marriage" is not a composite object. There is no "third thing."
      *   *The Joke:* The Best Man cannot truthfully say "they are now one."

  3.  **Drafting Strategy - Balancing the Audiences:**
      *   *The Hook:* Start normal. Establish the relationship.
      *   *The Pivot:* Introduce the philosophical conflict gently. Don't use jargon immediately.
      *   *The "Inside Baseball":* Make the specific van Inwagen reference clear enough for the grad students but framed as "my job is overthinking things" for the normies.
      *   *The Resolution:* Reframe the metaphysics into something romantic. Even if they aren't *ontologically* one, they are *practically* one. Or, shift from "composition" to "relation."
      *   *The Toast:* Bring it back to love and commitment.

  4.  **Drafting - Section by Section:**

