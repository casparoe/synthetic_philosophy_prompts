      *Emotional Pivot:* "But while my dissertation says they don't compose an object, my heart says they compose a life." (Wait, van Inwagen says "constitutes a life." I can use that!). "They *constitute a life* together." That's the bridge!

  9.  **Final Review against constraints:**
