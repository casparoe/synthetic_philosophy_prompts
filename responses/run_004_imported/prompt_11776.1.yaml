answer: |-
  Here are 8 rigorous interview questions designed to pin down the "relocation of coincidence" tactic, plus a final falsifiability question. Each includes the guest's likely philosophical counter-move and a tip on how to press further.

  ### 1. The Criteria for "Coincidence"
  **Question:** "You often dismiss third-factor explanations by saying they merely 'relocate the coincidence a level up.' But for our listeners to understand the weight of that objection, we need a positive standard. What would a *successful* third-factor explanation actually look like to you? Is there any conceivable link between evolutionary pressure and moral truth that you would accept as non-coincidental, or is the bar set so high that only direct causal contact counts?"

  *   **Anticipated Response:** She will likely say that moral facts are causally inert, so *no* causal link is possible, making any correlation coincidental by definition. She may argue that a successful explanation requires the truth of the belief to explain *why* we hold it, which realism can't do.
  *   **Prep Note:** If she says "causal contact is required," press her on whether we have causal contact with logical truths or mathematical sets. If she says "the truth must explain the belief," ask if that isn't an impossibly high standard for almost any abstract knowledge, not just morals.

  ### 2. Engaging Enoch's Specifics
  **Question:** "Let's look at David Enoch's specific third-factor claim: that survival is at least *permissibly* good, and evolution selects for survival. Therefore, there's a common cause linking our beliefs to the truth. When you say this 'relocates the coincidence,' are you objecting to the premise that survival is good, or are you objecting to the logical structure? Because if you grant that survival is good, the coincidence seems to dissolve."

  *   **Anticipated Response:** She will likely argue that even if survival is good, evolution selects for *adaptive behavior*, not *true moral beliefs*. We could have false beliefs that still lead to survival (e.g., thinking we have a divine duty to protect kin, when really it's just genes).
  *   **Prep Note:** Be ready to ask: "But if the false belief and the true belief lead to the same behavior, on what grounds do you claim the realist's belief is *less* likely to be true? Aren't you assuming we can distinguish adaptive falsehoods from adaptive truths without already trusting our reasoning?"

  ### 3. The Companions-in-Guilt (Math & Logic)
  **Question:** "Critics often raise the 'companions-in-guilt' objection. We evolved cognitive faculties to handle medium-sized objects and social counting. Yet we trust those same faculties when they do abstract logic or higher mathematics, which have no survival value. If evolutionary genealogy debunks our moral confidence because it wasn't 'aimed at truth,' why doesn't that same story debunk our confidence in the very logic you're using to make the argument?"

  *   **Anticipated Response:** She will likely distinguish between *normative* domains (ethics) and *descriptive/formal* domains (logic/math). She might argue that logic is constitutive of reasoning itself, whereas morality is a substantive domain subject to evolutionary distortion.
  *   **Prep Note:** Push back by asking: "But the *faculty* is the same. If evolution shaped the hardware of our reasoning for fitness rather than truth, why is the hardware reliable for logic but unreliable for ethics? Isn't that an arbitrary exemption?"

  ### 4. The Self-Defeat Challenge
  **Question:** "This leads to the self-defeat worry. Your argument relies on premises about evolution, probability, and epistemic justification. All of those beliefs are products of evolved cognition. If we can't trust our moral beliefs because they were shaped by survival pressures rather than truth-tracking, why should we trust the cognitive faculties that produced the debunking argument itself? Are you sawing off the branch you're sitting on?"

  *   **Anticipated Response:** This is Street's standard move: She will say the argument is *internal* to the realist. She isn't claiming skepticism is true; she's claiming *realism leads to skepticism*. She thinks her own constructivist view avoids this trap.
  *   **Prep Note:** Don't let her hide behind "internal critique." Ask: "But to persuade us, you need us to trust your reasoning. If evolved reasoning is unreliable for realists, and we are all evolved beings, how do you escape the skeptical bubble even for your own view? Doesn't the genealogy apply to the philosopher too?"

  ### 5. The "Relocation" Analogy in Science
  **Question:** "You use the phrase 'relocating the coincidence' as a defeater. But in science, we often relocate coincidences to solve them. We used to think the correlation between seasons and earth's tilt was a coincidence until we found the common cause of orbital mechanics. When is 'relocating the coincidence' a legitimate scientific explanation, and when is it a philosophical dodge? What is the structural difference between the orbital mechanics case and Enoch's third-factor case?"

  *   **Anticipated Response:** She will argue that in the orbital case, we have independent access to the facts (we can measure the tilt). In ethics, the realist claims the facts are mind-independent and causally inert, so we have no independent access to check the correlation.
  *   **Prep Note:** Press on "independent access." Ask: "Do we have independent access to logical truths? Do we have independent access to the past? If we rely on inference to the best explanation in those cases, why is it forbidden in ethics?"

  ### 6. Causal Inertness vs. Tracking
  **Question:** "Your argument leans heavily on the idea that moral facts are causally inert. But many realists argue that 'tracking' doesn't require physical causation. We track mathematical truths without physically touching them. If you allow that we can track logical truths without causal contact, what is the specific metaphysical barrier that prevents us from tracking moral truths in the same way?"

  *   **Anticipated Response:** She will likely argue that logic is *formal* and ethics is *substantive*. Logic tells us how to think; ethics tells us what to do. She may claim that without causal contact, there is no mechanism to explain the *correlation* specifically for substantive values.
  *   **Prep Note:** Ask: "Isn't that just an intuition pump? If the mechanism is 'rational insight' or 'reflective equilibrium,' why is that mechanism ruled out a priori? Are you defining moral facts in such a way that they are unknowable by design?"

  ### 7. Moral Progress as Data
  **Question:** "Let's look at the historical data. We see something that looks like moral progress: the expansion of the moral circle, the rejection of slavery, the recognition of universal rights. The Realist says this is us getting better at perceiving moral truth. You say this is just shifting social preferences. But which hypothesis actually explains the *stability* and *direction* of this progress better? Doesn't the Realist story offer a simpler explanation for why moral reasoning converges over time?"

  *   **Anticipated Response:** She will argue that "progress" is an illusion or is defined by our current standards (circularity). She will say convergence is due to shared human psychology and globalized communication, not mind-independent truths.
  *   **Prep Note:** Ask: "But if it's just psychology, why does the convergence feel like *discovery* to the agents involved? And if it's just psychology, on what grounds do you criticize societies that *don't* converge with us? Doesn't your view make moral criticism merely a statement of preference?"

  ### 8. The Constructivist Alternative
  **Question:** "If we accept your debunking argument, we lose mind-independent moral truths. You offer Constructivism as the alternative: we make values through valuing. But if our 'valuing' is itself shaped by the same evolutionary forces you just used to debunk realism, isn't Constructivism just Realism with an extra step? How does grounding values in 'us' save them from the evolutionary critique if 'us' is a product of blind evolution?"

  *   **Anticipated Response:** She will say Constructivism doesn't claim to track independent truths, so there's no coincidence to explain. Values are authoritative because they are ours, not because they match the universe.
  *   **Prep Note:** Ask: "But if our 'valuing' is corrupted by evolutionary biases (like tribalism or sexism), how do you filter those out? If you can't appeal to truth to filter them, aren't you stuck with whatever evolution handed us? How is that normative?"

  ### 9. Falsifiability (The Closer)
  **Question:** "Finally, a question on the limits of the view. Philosophical positions should be open to revision. What discovery—whether empirical, scientific, or philosophical—would actually count as evidence *against* your view? If tomorrow we found a neural mechanism that seemed to track moral truths independently of survival fitness, would you update your position, or is the argument insulated from empirical data?"

  *   **Anticipated Response:** She will likely say the argument is conceptual, not empirical. It's about the *definition* of realism and the *structure* of justification. She might say no empirical data could bridge the gap between 'is' and 'ought.'
  *   **Prep Note:** If she says "It's conceptual," ask: "Then isn't your view immune to reality? If no possible world could contain evidence for moral realism, are you describing the world, or just stipulating definitions? How do we know your conceptual map matches the territory?"
