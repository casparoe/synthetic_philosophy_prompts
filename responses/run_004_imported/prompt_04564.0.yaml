  **Correlated equilibrium**
  This demands the Harsanyi Doctrine (Common Prior) in addition to common knowledge of rationality, requiring players to derive conjectures from a shared probability distribution rather than arbitrary beliefs.

  **Nash equilibrium**
  This requires all conditions for correlated equilibrium plus mutual knowledge of conjectures, forcing players' beliefs to be both independent and correctly predict actual play.

