      *   **Controversy:** His wartime record. He planned an air campaign targeting state broadcaster, power, and water utilities in a besieged capital.
      *   **Key Evidence:** His memoir states these were chosen "to bring the war home to the population and hasten the collapse of its will to continue" (less for military value).
      *   **Consequences:** War ended quickly (weeks), ground invasion averted. Cost: Several thousand civilian deaths from disease/exposure due to infrastructure failure.
      *   **The Debate:**
          *   *Side A (Anscombe/Truman):* Deliberately breaking civilian will via suffering is murder/immoral, regardless of consequences. Intention matters more than outcome.
          *   *Side B (Double Effect/Proportionality):* Targets were dual-use. Civilian deaths were foreseen but unintended side effects. Memoir is unreliable evidence of intent compared to contemporaneous orders.
      *   **Requirements:**
          *   Must settle on a definite recommendation (Award, Withhold, or Middle Path).
          *   Must adjudicate the question of *intention* (cannot retreat to proportionality or "different era").
          *   Must take the strongest form of the losing side's case seriously (steel-manning).
          *   Tone: Academic, rigorous, appropriate for a university committee (political theory background evident but accessible).
          *   Timeline: Vote in three weeks.

  2.  **Deconstruct the Ethical Conflict:**
      *   *The Anscombe Objection:* Anscombe opposed Truman's degree because he authorized atomic bombs on cities. Her core argument is that *intentionally* killing innocents (or causing their death as a means to an end) is intrinsically evil, regardless of the "greater good." If Ashworth targeted utilities *to make civilians suffer enough to surrender*, that treats civilians as means, not just collateral.
      *   *The Double Effect Defense:* Doctrine of Double Effect (DDE) allows harm if: 1) The act is good/neutral, 2) The bad effect is not intended, 3) The good effect is not produced *by* the bad effect, 4) Proportionality. Side B argues the *intent* was military capability (command/control), and the memoir is just loose talk.
      *   *The Crux:* The memoir quote ("bring the war home to the population") vs. Contemporaneous Orders ("degrading military capability"). Which represents the *moral intention*?

