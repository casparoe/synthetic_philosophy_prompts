      *   *Decision:* I will recommend **awarding the degree**, but with a **revised citation** that does not shy away from the controversy. This allows the university to model how to engage with complex moral histories rather than erasing them. It validates Side B's view of his *current* worth while validating Side A's view of the *past* act's morality.

  4.  **Drafting - Section by Section:**
