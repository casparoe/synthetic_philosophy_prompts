answer: |-
  **TO:** The Honorary Degrees Committee
  **FROM:** Graduate Assessor, Department of Political Theory
  **DATE:** October 24, 2023
  **SUBJECT:** Assessment of Nomination: Lieutenant General Daniel Ashworth (Ret.)

  **1. Introduction**

  The Committee is currently deadlocked on the nomination of Lt. Gen. Daniel Ashworth. The division is not merely procedural but foundational, reflecting a tension between two distinct modes of moral evaluation: one rooted in the intrinsic nature of actions (the Anscombe/deontological view) and one rooted in the trajectory of a life and the consequences of actions (the pragmatic/consequentialist view). As requested, this opinion seeks to adjudicate the specific question of *intention* regarding the air campaign of thirty years ago, rather than retreating into general proportionality or historical context. It then offers a concrete recommendation intended to resolve the deadlock without dissolving the ethical stakes.

  **2. Adjudication of Intention**

  The core objection, invoking G.E.M. Anscombe's protest against Harry Truman's honorary degree at Oxford, rests on the claim that deliberately targeting the civilian population's will to endure—by destroying essential life-support infrastructure—is morally impermissible, regardless of the war's eventual duration or outcome. The defense rests on the Doctrine of Double Effect (DDE), arguing that the infrastructure was dual-use, the civilian harm was foreseen but unintended, and the General's later memoir is unreliable evidence of *mens rea* at the time of command.

  On the question of intention, the Committee must weigh contemporaneous military orders against a reflective memoir written three decades later. The defense argues that operational orders ("degrade military capability") represent the binding intent, while the memoir ("bring the war home to the population") is retrospective storytelling.

  I argue the Committee should treat the memoir as the more morally candid document. In the fog of war, operational language often sanitizes strategic logic to fit legal frameworks. A retired officer, writing for a popular audience with no remaining chain of command to answer to, often possesses the *freedom* to admit the strategic logic that was implicit but unstated during the conflict. When Ashworth writes that utilities were chosen "less for their remaining military value than to... hasten the collapse of [the population's] will," he is describing a causal mechanism where civilian suffering is not a side effect, but the *instrument* of victory.

  If the collapse of the will is the goal, and the deprivation of water and power is the means, then the civilian hardship is not merely "foreseen"; it is utilized. This aligns with Anscombe's critique: the civilians are being used as a lever to force the enemy state's hand. To accept the DDE defense here requires us to believe that the General's later reflection is a lie, while his contemporaneous legalistic orders are the truth. Given the specificity of the memoir's admission, the stronger ethical reading is that the intention *did* encompass the breaking of civilian morale through hardship. On this specific point—the morality of the 1993 campaign—the Anscombe objection holds. The act cannot be fully cleansed by Double Effect.

  **3. Steel-manning the Objection**

  However, to vote solely on this adjudication would be to ignore the strongest argument of the opposing faction, which I take to be this: Moral agency is not frozen in time. To define Ashworth solely by the worst moment of his military career is to deny the possibility of moral growth, repentance, and repair. The proponents of the degree argue that his thirty years of humanitarian diplomacy and the founding of the mediation institute are not merely "good deeds" to offset "bad deeds" in a utilitarian calculus. Rather, they represent a substantive *repudiation* of the logic he employed in 1993.

  By dedicating his post-service life to mediation and the protection of civilians in conflict zones, Ashworth has arguably done more to mitigate the harms of war than most career pacifists. To withhold the degree on the strength of the Anscombe argument risks turning the university into a court of permanent moral record, incapable of recognizing redemption. If we believe that moral agents can learn, change, and contribute to the common good after grave ethical errors, then a blanket withholding punishes the man he *is* for the officer he *was*.

  **4. Recommendation**

  I recommend that the Committee **award the honorary doctorate**, but **only under a revised citation** that explicitly acknowledges the complexity of his record.

  We should not award the degree *for* his military service, nor should we award it *despite* his military service as if that service were irrelevant. We should award it for his subsequent contribution to peace, while using the citation to signal that the University is fully aware of the ethical controversy surrounding his earlier career. This avoids the hypocrisy of whitewashing (which offends the Anscombe camp) and the rigidity of cancellation (which offends the redemption camp).

  **5. Proposed Citation**

  The current draft citation focuses vaguely on "distinguished service." I propose the following amendment:

  > *"For thirty years of dedication to humanitarian diplomacy and the resolution of armed conflict through the Mediation Institute; and for a lifetime of service that reflects a profound commitment to the preservation of human life, born of hard-won experience in the complexities of war and peace."*

  This phrasing ("hard-won experience in the complexities of war") signals to the informed reader that we know the history. It does not celebrate the bombing, but it does not erase it either. It frames the honor as recognition of his *later* ethical commitment, which gained its urgency from his earlier actions.

  **6. Conclusion**

  This recommendation accepts the Anscombe critique as morally valid regarding the *act* (the targeting was ethically compromised) but accepts the pragmatic defense as institutionally valid regarding the *agent* (the man is worthy of honor now). It allows the University to maintain its ethical standards without forfeiting its capacity to recognize moral growth. We honor not the General of 1993, but the Diplomat of 2023, while acknowledging that the latter exists only because of the moral reckoning of the former.

  Respectfully submitted,

  [Your Name]
  Graduate Assessor
