answer: |-
  **The Axiomatic Mirage: Why Harsanyi's Theorem Fails to Vindicate Utilitarianism**

  To a physicist, the appeal of John Harsanyi's 1955 Aggregation Theorem is immediate and visceral. It possesses the elegance of a derivation in statistical mechanics: begin with a few clean boundary conditions (the von Neumann-Morgenstern axioms), apply a constraint (Pareto indifference), and derive a macroscopic law (the social welfare function is a weighted sum of individual utilities). For decades, this result served as the holy grail for normative economics, promising to bridge the is-ought gap with linear algebra. It suggested that utilitarianism was not merely a moral intuition, but a mathematical necessity for any rational society.

  However, your reading group's cooling enthusiasm is well-founded. While the mathematics of the theorem are sound, its philosophical payload is overstated. The theorem demonstrates a structural consistency between individual and social preferences under risk, but it does not establish the moral truth of utilitarianism. The objections raised by Amartya Sen and Peter Diamond are not mere technical quibbles; they identify category errors in the translation from formal axioms to moral philosophy.

  To reach a verdict, we must dissect the theorem's mechanics, weigh the objections, and determine whether the "utility" in Harsanyi's equation is the same stuff as the "utility" in the utilitarian calculus.

  ### The Mechanics of the Derivation

  Harsanyi's setup is precise. He posits a society of $n$ individuals.
  1.  **Individual Rationality:** Each individual's preferences over lotteries satisfy the von Neumann-Morgenstern (VNM) axioms (completeness, transitivity, continuity, independence). This guarantees that each individual can be represented by a utility function $U_i$, unique up to positive affine transformation ($U'_i = aU_i + b$, where $a > 0$).
  2.  **Social Rationality:** Society's preferences over the same lotteries also satisfy the VNM axioms, yielding a social utility function $W$.
  3.  **Pareto Indifference:** If every individual is indifferent between two lotteries, society must also be indifferent.

  From these premises, Harsanyi proves that $W$ must be an affine combination of the $U_i$'s:
  $$W = \sum_{i=1}^{n} a_i U_i + b$$
  If we normalize the scales, this looks exactly like classical utilitarianism: maximize the weighted sum of individual utilities. The allure is that the word "welfare" never appears; the result seems to emerge purely from rationality constraints.

  ### Sen's Objection: The Measurement Problem

  Amartya Sen's critique strikes at the interpretability of the variables. In VNM theory, utility is a numerical representation of preference ordering under risk. It is cardinal in the sense that it measures the *intensity* of preference regarding gambles, but it is not inherently a measure of *well-being*.

  More critically, VNM utility is unique only up to an affine transformation. For individual $A$, a utility of 10 might represent a specific preference intensity. For individual $B$, a utility of 10 represents something entirely different unless their scales are calibrated against one another. To sum $U_A + U_B$, as utilitarianism requires, we need interpersonal comparability of utility levels and units. We need to know that a "util" for A is the same "size" as a "util" for B.

  Harsanyi's axioms do not provide this calibration. The Pareto condition ensures that if everyone prefers X to Y, society does too, but it does not fix the zero points or the unit sizes across different people. One could multiply $U_A$ by 1,000 and $U_B$ by 1, and the Pareto condition would still hold, but the social weighting would shift drastically in favor of A.

  Sen argues that Harsanyi conflates **utility as preference satisfaction** (a formal index of choice) with **utility as welfare** (a substantive measure of human good). The theorem proves that if society is rational, it must aggregate *preferences* linearly. It does not prove that satisfying those preferences maximizes *welfare*, nor does it provide the metric to compare welfare across persons. Without an independent ethical assumption establishing interpersonal comparability, the "utilitarian" sum is mathematically arbitrary.

  ### Diamond's Objection: The Fairness Problem

  Peter Diamond's objection targets the moral implications of the VNM independence axiom when applied to social choice. Consider his famous example: An indivisible good (say, a life-saving drug) must be allocated to one of two individuals, A and B, who are identical in need and desert.

  *   **Policy 1:** Give the drug to A. (Utilities: 1, 0)
  *   **Policy 2:** Give the drug to B. (Utilities: 0, 1)
  *   **Policy 3:** Flip a fair coin to decide. (Expected Utilities: 0.5, 0.5)

  Under Harsanyi's framework, we evaluate these based on expected social utility.
  Policy 1 yields $0.5(1) + 0.5(0) = 0.5$ (assuming equal weights).
  Policy 2 yields $0.5(0) + 0.5(1) = 0.5$.
  Policy 3 yields $0.5(0.5) + 0.5(0.5) = 0.5$.

  The theorem dictates that society must be indifferent between giving the drug deterministically to one person and flipping a coin. Yet, most moral intuitions suggest Policy 3 is superior because it treats the individuals with equal respect *ex-ante*. It offers each an equal chance, whereas Policies 1 and 2 arbitrarily favor one over the other.

  Diamond shows that the linearity required by Harsanyi's theorem (a consequence of the VNM independence axiom) is incompatible with a concern for the *distribution* of chances. The theorem forces us to evaluate social lotteries solely by their aggregate expected outcome, ignoring the fairness of the process. If utilitarianism is committed to Harsanyi's derivation, it is committed to the view that fair procedures have no intrinsic value, only instrumental value.

  ### Evaluating the Rescue Strategies

  Defenders of Harsanyi have attempted to patch these holes. The most common strategy is to **expand the domain of preferences**. Regarding Diamond, one might argue that individuals care about fairness, so their utility functions $U_i$ should include a term for "probability of receiving the good." If A and B both value a 50% chance more than a 100% chance for the other person (due to a preference for equity), the theorem can accommodate the coin flip.

  However, this rescue is costly. First, it risks triviality. If we can define "utility" to include *any* moral consideration (fairness, rights, desert), then the theorem becomes a tautology: "Society maximizes whatever people value." This strips utilitarianism of its distinctive claim—that we should maximize *welfare* specifically, rather than moralized preferences.

  Second, regarding Sen, one cannot simply "prefer" interpersonal comparability into existence. Preferences reveal how I rank my own options; they do not reveal how my happiness compares to yours. To fix the scales requires an ethical postulate external to the axioms (e.g., "all persons count for one"), which admits that the theorem alone does not generate utilitarianism. It merely shows what form utilitarianism must take *if* you already accept its substantive premises.

  ### The Verdict

  We must now answer the question: Does Harsanyi's theorem give us good reason to accept utilitarianism, or does it trade on a conflation of utilities?

  **The verdict is that the objections succeed.** Harsanyi's theorem does not provide an axiomatic vindication of utilitarianism. Its apparent force relies on conflating two distinct senses of "utility":

  1.  **VNM Utility:** A formal index of coherent choice under risk.
  2.  **Benthamite Utility:** A cardinal measure of welfare or well-being suitable for interpersonal aggregation.

  The theorem successfully proves that if you treat social choice as a problem of individual choice under risk, you get an additive function. But Sen shows that VNM utility lacks the metric properties required for welfare aggregation, and Diamond shows that the VNM structure (specifically the independence axiom) actively excludes moral concerns like fairness that are essential to a plausible welfare theory.

  For a physicist, the analogy might be this: Harsanyi derived a conservation law for a system, but he defined the "energy" variable so broadly that it includes things we don't want to conserve (like unfair advantages), and he failed to specify the units so that energy in subsystem A can be added to energy in subsystem B. The equation balances, but it doesn't describe the physical reality we care about.

  Harsanyi's theorem remains a profound result in social choice theory, but it is a **consistency constraint**, not a **moral foundation**. It tells the utilitarian: "If you want to be rational in the VNM sense, your aggregation must be linear." It does not tell us: "You ought to be a utilitarian." The move from rational preference to moral obligation requires ethical premises—about the comparability of welfare and the value of fairness—that the axioms themselves cannot supply.

  Your reading group was right to cool in its enthusiasm. The theorem is a beautiful piece of machinery, but it cannot run without the fuel of independent moral assumptions. To treat it as a proof of utilitarianism is to mistake the map for the territory.
