      *   **Newton/Clarke's Position:** Absolute space exists as a sensorium of God/substance. Explains inertia and rotation (Bucket).
      *   **General Relativity (GR):** Spacetime is a dynamic field (the metric $g_{\mu\nu}$). It curves, it waves, it carries energy. It exists even where matter density ($T_{\mu\nu}$) is zero (vacuum solutions).
