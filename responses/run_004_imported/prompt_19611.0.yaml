  Here is a joke that relies on the specific argumentative moves in the *Bái mǎ fēi mǎ* (White Horse Not Horse) chapter, specifically the "sufficiency" argument and the distinction between compound and simple names.

  ***

  Gongsun Long arrives at the Hangu Pass with a white horse. The border guard stops him.

  **Guard:** "Toll for horses is five coins."

  **Gongsun:** "This is a white horse. As I have demonstrated in my latest pamphlet, a white horse is not a horse. 'Horse' denotes the shape; 'white' denotes the color. A compound name is not a simple name. Therefore, I owe you nothing."

  **Guard:** *flips through the pamphlet* "Okay, I see your point. If one asks for a horse, a yellow or black horse suffices. If one asks for a white horse, a yellow or black horse does not. Since the conditions of fulfillment differ, the objects are distinct. You're right. This isn't a horse."

  **Gongsun:** "Exactly. May I pass?"

  **Guard:** "Sure. But the toll for a *white horse* is ten coins."

  **Gongsun:** "What? You just agreed it's not a horse!"

  **Guard:** "Precisely. Since it is not a 'horse,' it doesn't qualify for the standard 'Horse' subsidy rate. It falls under 'Exotic Compound Livestock.' That's premium pricing."

  **Gongsun:** "But if I asked for a horse, a yellow one would suffice! That means the category 'horse' includes me!"

  **Guard:** "No, no. You said a white horse is *not* a horse. So a yellow horse sufficing for 'horse' has nothing to do with you. You are outside the set. You're in the 'White Horse' set. Which is taxed higher."

  **Gongsun:** *Grumbling, pays ten coins.* "Here. Take it."

  **Guard:** *Hands him a receipt.* "Here's your proof of payment."

  **Gongsun:** "This receipt says 'Horse'. I paid for 'White Horse'. Since a white horse is not a horse, a receipt for 'Horse' is not a receipt for 'White Horse'. This document is ontologically void."

  **Guard:** "Oh, don't worry. 'Validity' is not 'Paper'. You have the paper. That's actual enough for me. But since you haven't technically 'Paid'—because 'Paying for White Horse' is not 'Paying for Horse'—I'm going to have to confiscate the animal for unpaid tolls."

  **Gongsun:** "You can't confiscate what isn't a horse!"

  **Guard:** "And 'Confiscation' is not 'Theft'. So go home and write a pamphlet about it."

