answer: |-
  Good morning. For those of you who don't know me, I'm one of the hundred or so people who spent time in Marguerite's garage.

  For thirty years, that garage was a kind of laboratory. It smelled of old paper, damp concrete, and whatever tea she was brewing. And if you spent any time in there, you know there was one question she asked more than any other. She'd put down a manuscript, look over her glasses, and ask: "Does it infect you?"

  Now, to half of you in this room, that sounds like a medical warning. To the writers in the back, it sounds like a command.

  She was quoting Tolstoy. He believed that art isn't about being clever, or winning prizes, or using the right big words. He believed art is only real if it transmits a feeling from the artist to the audience. If you read a sentence and you feel exactly what the writer felt when they wrote it—grief, joy, shame—you have been "infected." If you just admire the technique but feel nothing, Tolstoy called it "counterfeit art." Marguerite called it "dead."

  She spent her life hunting for the living stuff. She wanted us to write things that made people cry on the subway. She wanted the infection to spread.

  And this brings me to the hard part. The part where I have to be as honest as she demanded we be on the page.

  Marguerite spent decades polishing a "serious" literary novel. It was technically flawless. It was intelligent. It was the kind of book that gets respect. She never submitted it. She never tried to publish it. For a long time, I think we all assumed it was because she was a perfectionist. Or that she was afraid of rejection.

  But after she passed, I was helping sort through her papers. And I found the truth.

  Marguerite did publish novels. She published six of them. They weren't the literary one. They were romances. The kind with the flowered covers and the titles that promise everything. She wrote them under a pen name.

  I know some of you might be surprised. I know some of the writers here are doing the math on her bibliography. But I need you to hear why I'm telling you this. It's not a scandal. It's the punchline to her life's work.

  By her own rules—by Tolstoy's rules, by the rules she drilled into us until we couldn't take it anymore—those romance novels were better art than the unpublished literary one.

  I've read them. I've watched strangers read them. They do exactly what she told us to do. They make grown adults feel something visceral and true in a world that tells them they shouldn't. They infect the reader. The "serious" novel? I suspect she kept it in the drawer because she knew, deep down, that it was clever. She knew it was technically dazzling. And she knew it was dead at the center.

  She was willing to sacrifice her prestige to tell the truth about what matters. She taught us that the feeling is the thing. Not the genre. Not the award on the shelf. Not the approval of the critics. The feeling.

  To her family: You knew her heart. You knew she was warm, and stubborn, and deeply loving. You might not have known she was hiding those books, but you knew she valued connection over status. She didn't write those romances to hide; she wrote them to reach people. She was practicing what she preached.

  To her students: We are the proof that the infection worked. We are the carriers. She didn't just teach us how to construct a sentence; she taught us how to be vulnerable. She taught us that if we aren't risking embarrassment, we aren't risking art.

  There is a contradiction here, yes. A teacher who worshipped high art but found her own success in paperbacks. A writer who demanded truth but hid her name. But Marguerite never claimed to be a saint. She claimed to be a writer.

  And in the end, she solved the riddle she gave us every autumn. She showed us that "What Is Art?" isn't answered by where the book sits in the library. It's answered by what happens in the chest of the person holding it.

  Her literary novel is in a box in her attic. It is perfect, and it is silent.
  Her romance novels are in used book stores, in waiting rooms, in backpacks. They are worn, and dog-eared, and they have made people feel less alone.

  I think she'd prefer it that way.

  Thank you.
