answer: |-
  This is not random at all. In fact, you have independently reinvented one of the most famous thought experiments in contemporary epistemology.

  Welcome to the club. What you are describing is almost a textbook example of what philosophers call **The Bank Cases**, introduced by Keith DeRose (1992) and expanded upon by Jeremy Fantl and Matthew McGrath (2002). In their scenario, a couple drives past a bank on a Friday. In the "low stakes" version, they just want to deposit a paycheck; in the "high stakes" version, they must deposit a check or face foreclosure. The evidence (the bank looks open) is identical, but our intuition about whether they *know* the bank is open shifts based on the stakes.

  Since you're in linguistics (semantics/pragmatics), you are actually better equipped to parse this than most philosophers, because the debate hinges entirely on how we model the semantics of *know* versus the pragmatics of action.

  Here is the breakdown of who is "right," why your reaction was rational, and what this says about the architecture of knowledge.

  ### 1. The Philosophical Landscape
  There are three main camps fighting over your oven thermometer, and your intuition places you squarely in one of them.

  **A. Traditional Invariantism (Priya's Camp)**
  Priya is arguing for **Epistemic Invariantism**. This view holds that whether you "know" $p$ (the oven is 350°F) depends *only* on truth-conducive factors: evidence, reliability of the source, and the absence of defeaters.
  *   **The Argument:** The thermometer reading is the evidence. The cost of the cake is not evidence about the temperature. Therefore, your epistemic position is identical in both cases. If you knew it in the cupcake scenario, you know it in the wedding cake scenario.
  *   **The Verdict:** On this view, you were being irrational (or at least, you *knew* it, but you were overly cautious).

  **B. Pragmatic Encroachment (Your Camp)**
  This is the view that validates your freezing moment. **Pragmatic Encroachment** argues that practical stakes *can* affect whether a true belief counts as knowledge.
  *   **The Argument:** Knowledge is not just a mental state; it is a status that licenses action. If the cost of being wrong is \$20 of cupcakes, the evidence suffices for knowledge. If the cost is a \$600 ruined wedding cake and reputational damage, the *same evidence* no longer suffices for knowledge. The practical stakes "encroach" on the epistemic domain.
  *   **The Verdict:** You didn't know. The threshold for knowledge shifted because the stakes shifted.

  **C. Contextualism (The Linguist's Favorite)**
  Since you work in semantics, this might appeal to you most. **Epistemic Contextualism** (defended by DeRose and David Lewis) suggests that the word *know* is context-sensitive, similar to gradable adjectives like *tall* or *flat*.
  *   **The Argument:** "Tall" doesn't have a fixed height; it depends on the context (tall for a jockey vs. tall for a basketball player). Similarly, "knows" picks out different epistemic standards depending on the conversational or practical context. In the "cupcake context," the standard is low. In the "wedding cake context," the standard is high.
  *   **The Verdict:** Both sentences ("I know" vs. "I don't know") can be true, because the semantic value of *know* shifted between the two contexts.

  ### 2. Why You Weren't Being Neurotic
  Priya called you irrational because she assumes that **Evidence = Knowledge**. But human cognition operates on a **Knowledge + Risk = Action** model.

  Even if you reject Pragmatic Encroachment and side with Priya that you technically *did* know the temperature, your behavior was still rational under **Risk-Weighted Decision Theory**.
  *   **The Norm of Action:** Many philosophers argue that knowledge is the norm of practical reasoning. You should act on $p$ only if you know $p$.
  *   **The Salience of Error:** In the wedding cake scenario, the possibility of error (the thermometer being calibrated wrong) became *salient*. In the cupcake scenario, that possibility was present but ignored.
  *   **The Rational Move:** When the cost of error exceeds the cost of verification (buying a second thermometer), it is rational to seek more evidence, regardless of whether you label your previous state "knowledge."

  So, were you neurotic? No. You were sensitivity-tracking. Your brain correctly identified that the **utility function** had changed, even if the **probability function** (the thermometer reading) had remained the same.

  ### 3. What This Says About "Knowing"
  Since you're in semantics/pragmatics, here is the juicy part for your research interests. This scenario suggests that *know* is not a pure descriptive term like *water* or *electron*. It behaves more like a **modal** or a **gradable adjective**.

  1.  **The Action-Knowledge Link:** Your intuition supports the idea that knowledge is fundamentally tied to action. We don't attribute knowledge to ourselves to store facts in a database; we do it to certify that we are ready to act. If you aren't ready to act (put the cake in), then by definition, you don't feel you "know."
  2.  **Defeasibility:** In the high-stakes context, the *possibility* of the thermometer being broken becomes a **relevant alternative**. In low stakes, that alternative is properly ignored. In high stakes, it is not. This aligns with David Lewis's "Rule of Attention": possibilities you are attending to cannot be properly ignored. By thinking about the \$600, you attended to the possibility of error, which destroyed the knowledge claim.
  3.  **Semantic vs. Pragmatic:** The debate is whether this shift is semantic (the meaning of *know* changes) or pragmatic (the meaning stays the same, but what it is appropriate to *say* or *act on* changes). Given your field, you might look at this as a **pragmatic strengthening** of the epistemic standard.

  ### The Verdict
  **Priya is technically defending a cleaner metaphysical view** (evidence is evidence), but **you are defending a more functional, human view** (knowledge is for doing).

  In the literature, the tide has turned somewhat toward acknowledging that stakes matter, at least in our *attributions* of knowledge. Most experimental philosophers (x-phi) have run surveys on these exact cases, and the majority of non-philosophers agree with **you**: stakes change whether we say someone "knows."

  **So, to answer your question:**
  1.  **Is there something genuinely rational going on?** Yes. You were correctly adjusting your evidential threshold to match the risk profile.
  2.  **Were you neurotic?** No. You were adhering to a higher standard of justification required by the context.
  3.  **What does it say about knowing?** It suggests that "knowing" is not a binary switch flipped solely by evidence. It is a status granted when evidence meets a contextually determined threshold of safety, and that threshold is partially set by **what happens if you're wrong.**

  You haven't lost your mind; you've just stumbled into the intersection of epistemology and decision theory. Next time Priya gives you grief, tell her she's a "Strict Invariantist" and you're a "Pragmatic Encroacher," and see if she still thinks you're being irrational. (Spoiler: She'll probably still give you a funny look, but now you know why.)
