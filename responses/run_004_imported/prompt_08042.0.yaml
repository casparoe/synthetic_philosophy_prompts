answer: |-
  First off, your reading of *On Certainty* is way better than most people who actually study it in university. You nailed the core tension: Wittgenstein isn't giving you a *weapon* to beat the skeptic (like a proof that you're not a brain in a vat); he's trying to show that the skeptic's *game* is broken.

  You are also right that philosophers are still fighting about whether this is a "solution" or a "dodge." Here is the breakdown of the three camps you mentioned, translated into "IB TOK / Arguing with Jake" language, followed by how to actually use this to settle the debate.

  ### 1. The "Entitlement" View (Crispin Wright)
  **The Gist:** This camp admits Wittgenstein is right that we have no *evidence* for hinge propositions. We can't prove the world isn't five minutes old. However, Wright argues we have a rational **entitlement** to accept them anyway.
  **The Analogy:** Think of it like a "free pass" in a board game. You don't earn the free pass through strategy (evidence); the rules of the game just give it to you so you can play.
  **Does it beat Jake?** *Sort of, but it's risky.*
  *   **Why it helps:** It gives you permission to ignore Jake. You can say, "I am rationally entitled to assume I have hands, even without proof."
  *   **Why Jake might still win:** It sounds suspiciously like "blind faith." Jake will say, "Aha! You admit you have no evidence! You're just assuming reality exists. That's exactly what I said!" This view risks turning Wittgenstein into a foundationalist (someone who says "some beliefs are just basic and don't need proof"), which is exactly what skeptics attack.

  ### 2. The "Hinges as Action" View (Danièle Moyal-Sharrock & others)
  **The Gist:** This is the most radical and arguably the most faithful to Wittgenstein. It says hinges **aren't beliefs at all**. Beliefs are mental states that can be true or false. Hinges are *instincts* or *ways of acting*.
  **The Analogy:** You don't "believe" in gravity in a propositional way; you *walk*. If you try to "doubt" gravity while walking down stairs, you aren't doing philosophy, you're just going to fall. "I have two hands" isn't a fact I check; it's how I interact with the world.
  **Does it beat Jake?** *Yes, by dissolving the question.*
  *   **Why it helps:** It makes Jake's question nonsense. Asking "But do you *know* you're not a brain in a vat?" is like asking "What color is the number 7?" It looks like a question, but it doesn't connect to how language actually works.
  *   **Why Jake might still win:** Jake can dig his heels in and say, "Okay, you act like you have hands. But are you *actually* sure? Isn't it possible you're wrong?" This view requires you to stop caring about "truth" in the abstract and focus on "practice." If Jake cares more about abstract truth than practical reality, he won't be satisfied.

  ### 3. The "Epistemic Angst" View (Duncan Pritchard)
  **The Gist:** Pritchard tries to save the concept of "Knowledge." He agrees hinges can't be known (because you can't doubt them). But he argues that **ordinary knowledge doesn't depend on knowing the hinges.**
  **The Analogy:** Imagine you're building a house. You need a foundation (hinges). You can't see the foundation once the house is built. Pritchard says: "Just because I can't inspect the foundation *right now* doesn't mean I don't know I'm sitting in the living room." We can have knowledge of daily things even if the ultimate background (hinges) is unproven.
  **Does it beat Jake?** *It creates a stalemate.*
  *   **Why it helps:** It lets you claim you "know" things (like "I am sitting in a chair") without needing to prove "I am not a brain in a vat." It separates local knowledge from global skepticism.
  *   **Why Jake might still win:** He will argue that if the foundation is shaky (unproven), the house is shaky. If you can't rule out the BIV scenario, your claim to "know" you're in a chair is technically false.

  ---

  ### So, is it a dodge?
  Here is the gut-level truth: **Wittgenstein is not solving the problem; he is dissolving it.**

  If you try to use Wittgenstein to *prove* to Jake that he is wrong, **Jake wins.** Because Wittgenstein agrees with Jake on one huge point: **There is no logical proof that we are not brains in vats.**

  If you say, "Wittgenstein proves we aren't BIVs," you have misunderstood the book.

  **Here is how you actually settle the argument with Jake:**

  Jake is playing the **Cartesian Game**. The rules of this game are:
  1.  To "know" something, you must be able to rule out *all* possible doubt.
  2.  Since you can't rule out the "Brain in a Vat" doubt, you know nothing.

  Wittgenstein's move is to say: **Rule #1 is nonsense.**

  **The Argument to use on Jake:**
  1.  **Doubt needs a background:** Tell Jake, "To doubt something, you have to hold something else steady. If I doubt whether that's a tree, I'm assuming my eyes work, that light exists, that 'trees' are a thing. If I doubt *everything* at once (like being a BIV), the word 'doubt' loses its meaning."
  2.  **Knowledge is a social game:** "Knowing" isn't a magical mental state where your brain touches reality. "Knowing" is a move in a language game. In the game of human life, saying "I know I have hands" is weird. You just *use* your hands.
  3.  **The "So What?" Test:** Ask Jake: "Okay, let's say we are brains in vats. Does that change how you treat your friends? Does it change whether you study for the IB exam? Does it change if you step in front of a bus?"
      *   If he says "No," then his skepticism is empty. It's a parlor trick, not a real philosophical problem.
      *   If he says "Yes," then he's crazy (don't step in front of a bus to test it).

  ### The Verdict
  *   **Wright (Entitlement):** Feels like a dodge. Admits we lack evidence.
  *   **Pritchard (Epistemic):** Good for saving "knowledge," but technical.
  *   **Action/Instinct (Moyal-Sharrock/Wittgenstein):** **This is the winner.**

  **Why?** Because it shows Jake that his demand for "absolute certainty" is a category error. He wants a kind of certainty that doesn't exist in human language.

  **Your closing line to Jake:**
  "Wittgenstein doesn't say you're wrong that we can't *prove* we aren't brains in vats. He says that 'proving it' isn't what 'knowing' means. You're trying to use a ruler to measure its own length. The hinge doesn't move, not because we proved it's stuck, but because if it moved, there's no door left to open. So yeah, technically we can't prove it. But since we have to live as if it's false anyway, your point doesn't actually change anything about what we know."

  In TOK terms: Wittgenstein shifts the focus from **Certainty** (a state of mind) to **Certainty** (a functional role in a system). Jake is arguing about the first; Wittgenstein is talking about the second. Jake isn't "wrong" logically, but he's irrelevant practically.
