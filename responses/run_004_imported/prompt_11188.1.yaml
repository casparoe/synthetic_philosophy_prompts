      *   *My Verdict:* Hitchhiker is the stronger *pragmatic* indictment (money/life on the line based on algorithm). Toxin is the stronger *philosophical* indictment (coherence of rational agency). However, for a CDT defender, Toxin is arguably *easier* to dismiss ("Well, I guess I just don't get the money, but I'm still rational") whereas Hitchhiker forces them to admit their decision procedure leads to suboptimal outcomes in a direct competition.
