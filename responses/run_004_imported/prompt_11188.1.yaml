answer: |-
  You are absolutely right to be suspicious of the "they're the same puzzle" hand-wave. It's a common move in online rationalist spaces to collapse Kavka's Toxin and Parfit's Hitchhiker into a single "Newcomblike problem" bucket, but doing so glosses over the specific philosophical friction each one generates. Your intuition is spot-on: Toxin is primarily a problem for the **philosophy of action and the metaphysics of intention**, whereas Hitchhiker is a problem for **decision algorithms and dynamic consistency**.

  Here is the breakdown of where they overlap, where they diverge, and why Hitchhiker is ultimately the more damaging indictment of plain Causal Decision Theory (CDT), even if Toxin is the deeper conceptual paradox.

  ### 1. The Structural Map: Where They Align
  You correctly identified the surface isomorphism. In both cases, we have a temporally extended scenario with three key nodes:
  1.  **$T_0$ (The Offer):** A verifier assesses you.
  2.  **$T_1$ (The Transfer):** The reward is secured (money wired / ride given).
  3.  **$T_2$ (The Execution):** The costly action is performed (drinking toxin / paying fare).

  In both puzzles, the payoff at $T_1$ is decoupled from the action at $T_2$. Once you reach $T_2$, the marginal utility of performing the action is negative (pain/cost) with no compensating reward. A naive expected utility maximizer looking only at $T_2$ will defect in both cases.

  ### 2. The Divergence: The Verifier's Input
  This is the critical split that your group chat is missing.

  **In Toxin, the verifier checks a *present mental state*.**
  The billionaire isn't predicting whether you *will* drink; he is checking whether you *intend* to drink right now (at midnight). This makes Toxin a puzzle about **doxastic voluntarism** and the nature of intention.
  *   **The Trap:** Intention is generally understood as a state that aims at action. If you know with certainty that you will not act (because at $T_2$ you will be rational and not drink), can you coherently hold the intention at $T_0$?
  *   **CDT's Problem:** CDT doesn't actually have a theory of intention; it has a theory of *choice*. A CDT agent looks at $T_0$ and asks, "What choice maximizes utility?" But the reward isn't contingent on a choice; it's contingent on a *state of mind*. CDT agents struggle here because they cannot "choose" to intend any more than they can "choose" to believe the sky is green.

  **In Hitchhiker, the verifier predicts a *future action*.**
  The driver isn't hooking you up to an intention-o-meter; he is simulating your algorithm to see what you *will do* when you reach town.
  *   **The Trap:** This is a problem of **dynamic consistency**. The driver is effectively simulating your $T_2$ decision node from the perspective of $T_0$.
  *   **CDT's Problem:** CDT treats the $T_2$ decision as a new, independent causal node. At $T_2$, paying has no causal impact on the ride (which already happened). So CDT defects. But because the driver simulates this, the ride is never given. CDT fails because it cannot treat its future self's decision as logically subjunctive to its current self's disposition.

  ### 3. Theoretical Stress-Testing: Bratman vs. McClennen
  This is where the distinction becomes concrete.

  **Bratman's Planning Theory of Intention (Favors Toxin)**
  Michael Bratman argues that intentions are distinct from desires; they are partial plans that stabilize future deliberation. For Bratman, it can be rational to form an intention at $T_0$ even if you know you might have a reason to reconsider at $T_2$, *provided* that having the plan itself yields a benefit (the money).
  *   **Verdict:** Bratman can solve Toxin by arguing that "intending" is a distinctive cognitive action that is rational to perform at $T_0$ because it secures the money. He legitimizes intention as a resource.
  *   **Hitchhiker Application:** Bratman's theory is less helpful here. The driver doesn't care about your plan; he cares about your payment. You can plan to pay all you want, but if your decision algorithm defects at $T_2$, you die. Hitchhiker requires a theory of *choice*, not just a theory of *planning*.

  **McClennen's Resolute Choice (Favors Hitchhiker)**
  Edward McClennen argues that rational agents should adopt a "resolute" stance: they choose a plan at $T_0$ and bind their future selves to it, ignoring preference changes at $T_2$ that aren't based on new information.
  *   **Verdict:** This crushes Hitchhiker. A resolute chooser decides at $T_0$ "I will pay," and when they reach $T_2$, they execute that prior resolution despite the cost. The driver predicts this resolution and gives the ride.
  *   **Toxin Application:** Resolute choice helps, but it hits the metaphysical wall. You can resolve to drink, but can you *intend*? If you know you are resolute, you know you will drink. If you know you will drink, intending is easy. But if you are merely resolute without a mechanism to force the hand, the "intention" at $T_0$ might still feel hollow if the agent knows the $T_2$ self has no *incentive* to comply. Resolute choice solves the *action* problem, but Toxin is an *intention* problem.

  ### 4. The Verdict: Which is Harder for CDT?
  You asked for a sharp take on which puzzle is the harder case for a defender of plain Causal Decision Theory.

  **The Toxin Puzzle is easier for a CDT defender to dodge.**
  A sophisticated CDT defender can bite the bullet and say: *"CDT is a theory of rational choice, not rational intention. If the billionaire rewards irrational mental states, that's his prerogative. I cannot choose to intend what I know I won't do. I remain rational; I just stay poor."*
  Because CDT lacks a formal account of intention, it can treat Toxin as "outside the domain." The failure is framed as a limitation of human psychology (we can't intend arbitrarily), not necessarily a flaw in the decision calculus itself.

  **The Hitchhiker Puzzle is the kill shot for CDT.**
  Hitchhiker cannot be dismissed as a "mental state" issue. It is a pure sequential choice problem.
  1.  **Domain:** It falls squarely within CDT's wheelhouse (choices over time).
  2.  **Dominance:** In Hitchhiker, the CDT agent is dominated by an agent using FDT or TDT. The FDT agent gets the ride and pays (net positive). The CDT agent doesn't get the ride (net zero/death).
  3.  **The "Why Ain't Cha Rich" Argument:** In Toxin, the CDT agent can claim the setup is rigged against *agency*. In Hitchhiker, the setup is rigged against *myopia*. The driver is simply offering a contract that requires dynamic consistency. CDT explicitly forbids binding your future self without an external enforcement mechanism.
  4.  **No Retreat:** A CDT defender cannot say "this is about intention." They have to admit that their decision procedure leads to an outcome that is strictly worse than a competing procedure in a standard game-theoretic context.

  ### Summary for the Group Chat
  If you want to shut down the "they're the same" argument, tell them this:

  **Toxin** asks: *Can a mind rationally hold a plan it knows it will abandon?* It attacks the coherence of **intention**.
  **Hitchhiker** asks: *Can a decision algorithm win when its future choices are predicted?* It attacks the coherence of **dynamic consistency**.

  Toxin is a paradox for philosophers of action (Bratman wins here). Hitchhiker is a paradox for decision theorists (FDT/TDT wins here). For a defender of plain CDT, **Hitchhiker is the harder case** because it demonstrates that CDT isn't just missing out on "magic money for magic thoughts"—it is actively selecting for death in scenarios where the only requirement is to be the kind of agent who keeps their word. Toxin lets CDT claim it's too rational to play the game; Hitchhiker proves CDT isn't rational enough to survive it.
