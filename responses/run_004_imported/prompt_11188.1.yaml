          *   *Verifier:* Checks *current intention* (mental state).

      *   **Parfit's Hitchhiker:**
          *   *Setup:* Stranded in desert. Driver offers ride *if* you will pay once in town.
          *   *Condition:* Driver predicts whether you *will pay* at $T_1$. If prediction is "yes," you get ride at $T_0$.
          *   *Payoff:* Once in town ($T_1$), you have the utility of survival. Paying costs money.
          *   *Core Tension:* At $T_1$, you have the benefit (survival). Paying is costly. CDT says don't pay. But if you don't pay, you don't get the ride.
          *   *Verifier:* Predicts *future action* (behavior).

  3.  **Compare and Contrast (The "Meat" of the response):**

