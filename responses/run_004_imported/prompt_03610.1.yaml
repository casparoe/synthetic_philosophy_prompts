      *   *Restriction Strategies (Tennant, Dummett):*
          *   **Tennant (Cartesian):** Restricts knowability to "Cartesian" propositions (those whose truth doesn't entail they aren't known).
              *   *Pros:* Blocks the derivation formally. Preserves a version of verificationism.
              *   *Cons:* Often criticized as ad hoc (why *that* restriction?). Does it capture the *spirit* of "all truths are knowable"? It says "all *knowable* truths are knowable," which is trivial.
          *   **Dummett (Basic Statements):** Restricts to basic statements.
              *   *Pros:* Tied to Dummett's broader semantic project.
              *   *Cons:* Very restrictive. Hard to motivate why complex truths aren't knowable in principle.
          *   *Assessment:* Solid technical fixes, but the "ad hoc" charge is hard to shake. Tennant is generally seen as the best of the restrictionists.

      *   *Actuality Operator / Situation Semantics (Edgington, Rabinowicz & Segerberg):*
          *   **Idea:** Distinguish knowledge *in* a situation vs. knowledge *of* a situation. $K@p$ vs $@Kp$.
          *   *Pros:* Very sophisticated. Addresses the modal scope issue directly. Preserves anti-realism well.
          *   *Cons:* Technically complex. Requires a specific metaphysics of situations/actualities. Some argue it changes the subject.
