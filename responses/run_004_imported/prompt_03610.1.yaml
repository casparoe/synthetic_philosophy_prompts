      *   *Paraconsistency (Beall, Routley):*
          *   **Idea:** Accept the contradiction ($p \land \neg Kp$ is known).
          *   *Pros:* Bold.
          *   *Cons:* Massive cost. Abandons classical logic entirely. Most epistemologists reject this as too high a price.
          *   *Assessment:* Interesting, but generally viewed as too radical for the payoff.

