      *   *Principle of Charity:* Constitutive, not heuristic. We *must* interpret the speaker as largely rational and largely correct about the world to attribute beliefs/meanings at all.
      *   *Triangulation:* Essential for objectivity. Two creatures + a shared cause in the world. This fixes the content of thought (distinguishing "rabbit" from "undetached rabbit part" or "temporal slice of rabbit").
