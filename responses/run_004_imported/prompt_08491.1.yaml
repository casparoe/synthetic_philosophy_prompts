answer: |-
  **Setting:** *A slightly noisy bar a few blocks from the meetup venue. It's 11 PM. Alex (the Bayesian) and Jamie (the Economist) are finishing a second round. The earlier group argument has dispersed, but these two are still at it.*

  **Alex:** I'm just saying, the math is incredibly clean. I.J. Good proved it in 1967. If you're a Bayesian expected-utility maximizer, and you have the option to observe a free signal before acting, the expected utility of observing that signal is always greater than or equal to the expected utility of ignoring it. Worst case, the signal is noise, and you do exactly what you would have done anyway. You can't be *harmed* by having more map, provided the territory stays the same.

  **Jamie:** The territory doesn't stay the same, Alex. That's the whole point of the Hirshleifer effect. You're treating the payoff structure as fixed. But in an economy, the payoff structure depends on what other people know.

  **Alex:** But Good's theorem is about *my* decision. It's single-agent decision theory. It says *I* should never pay to avoid information. If the weather forecast is free on my phone, I should look at it. Even if it's going to rain, knowing I'm going to get wet allows me to bring an umbrella. How is looking at the forecast ever negative EV for me?

  **Jamie:** Okay, let's use the forecast example, but let's make it about crop insurance, like back at the meetup. Suppose you're a farmer. You can buy insurance against drought. The premium is based on the historical average risk. Now, suppose a perfectly accurate, public weather satellite goes online. It predicts the harvest outcome six months in advance.

  **Alex:** Okay.

  **Jamie:** As soon as that satellite turns on, the insurance market vanishes. The insurer won't sell you a policy if they know you're going to fail, and you won't buy one if you know you're going to succeed. The risk-sharing opportunity disappears. You are now exposed to the full variance of the weather. From behind a veil of ignorance—before you know if you're the lucky farmer or the unlucky one—you are worse off with the satellite than without it.

  **Alex:** I grant you that *socially*, or *ex-ante*, the group might be worse off. But Good's theorem isn't about social welfare. It's about instrumental rationality for an agent at the moment of choice. Once the satellite *exists*, and the data is *free*, do I want to look?

  **Jamie:** If you look, you know your fate. But you also know that no one will insure you.

  **Alex:** But that's true whether I look or not! If the data is public, the insurer knows. My looking at the data doesn't change the insurer's behavior. The market is already unraveled. So, given the market is unraveled, shouldn't I still look? If I know a drought is coming, I can at least sell my land or switch crops. Ignorance doesn't bring the insurance back.

  **Jamie:** *Pauses, takes a sip of beer.* Okay, that's a strong defense. You're isolating the decision to "observe" from the decision of "whether the signal exists." You're saying, "Given the hellish equilibrium where insurance is gone, I should still maximize my utility within that hell." And Good's theorem holds there. But that misses the real bite of the counterexample. The rationalist claim isn't just "don't close your eyes if the screen is already on." It's "information is inherently good, so we should build transparent systems."

  **Alex:** Right. The prescriptive claim.

  **Jamie:** Exactly. If you tell policymakers, "Information always has non-negative value, proof by Good's Theorem," they will build the satellite. And the farmers will be worse off. So the theorem failed as a guide for *designing* the information environment.

  **Alex:** I think you're conflating the value of information with the value of *privacy* or *commitment*. Good's theorem assumes the action set is fixed. "Act with info" vs. "Act without info." In your insurance case, the action set *changes*. "Buy insurance" is an available action in World A (no satellite). It is *not* an available action in World B (satellite).

  **Jamie:** But why isn't it available? Because of information.

  **Alex:** Because of *other agents'* reaction to information. Good's theorem is a single-agent theorem. It assumes the environment is passive. It says $E[\max_a U(a, \omega | \text{info})] \geq \max_a E[U(a, \omega)]$. The $\max_a$ implies you pick the best action from a set. In the insurance case, the set of actions $A$ shrinks when info arrives. The theorem doesn't account for $A$ being a function of the information structure.

  **Jamie:** Okay, I can accept that distinction. Single-agent vs. multi-agent equilibrium. But here's where I think you still have a leak. Even in a single-agent case, if the information changes your *preferences* or your *ability to commit*, you can be worse off. Think about Newcomb's Problem or Parfit's Hitchhiker. Sometimes, being the kind of agent who *can't* access certain information makes you a better bargaining partner.

  **Alex:** That's different. That's about logical correlation or precommitment. Good's theorem assumes you're a standard causal decision theorist or evidential decision theorist updating on a signal. It doesn't account for "I wish I was the kind of person who didn't know X so I could credibly threaten Y." But that's a limitation of the agent's architecture, not the value of the information itself.

  **Jamie:** Is it? Let's go back to the veil of ignorance. Suppose I'm behind the veil. I know I will be a farmer. I have a choice: Build the satellite or don't. If I build it, I get accurate info later. If I don't, I get insurance. Good's theorem suggests I should want the info. But my expected utility is higher without the info because the insurance payout smooths my consumption. So, *ex-ante*, the value of information is negative.

  **Alex:** *Leans forward.* Okay. This is the crux. We need to distinguish between the *ex-ante value of the availability of information* and the *interim value of observing a signal*.
  Good's theorem is about the **interim** value. It says: "You are at time $t$. The signal is here. It is free. Should you look?" The answer is Yes.
  Your insurance argument is about the **ex-ante** value. It says: "You are at time $t-1$. Should you create a world where this signal exists?" The answer might be No.

  **Jamie:** Precisely. And the rationalist community often slides from the first claim to the second. They say, "Since looking is always good, knowing is always good." But "knowing" implies the information structure of the world has changed.

  **Alex:** I'll concede that slide happens. But is it really a contradiction of the theorem? The theorem has boundary conditions. It assumes the payoff function $U$ is fixed. In the insurance case, the payoff function is endogenous. The existence of the signal changes the contracts available, which changes the payoffs. So the theorem isn't *wrong*, it's just... out of scope.

  **Jamie:** "Out of scope" is doing a lot of work there. If a theorem about the "Value of Information" doesn't apply to the most economically significant cases of information—markets, contracts, signaling—then calling it "The Value of Information Theorem" is misleading. It should be called "The Value of Private Information in a Fixed Environment Theorem."

  **Alex:** *Laughs.* That doesn't fit on a t-shirt. But look, I think we can salvage the intuition. Even in the insurance case, once the satellite is up... I still want to look.

  **Jamie:** Do you?

  **Alex:** Yes. Because if I don't look, I'm just a blind gambler in a world without insurance. If I look, I'm an informed gambler. I can hedge in other ways. Futures markets, storage, diversification. The insurance market unraveling is a loss, but it's a sunk loss once the satellite exists. Ignoring the forecast doesn't bring the insurance back. It just leaves me stupid *and* uninsured.

  **Jamie:** Okay, I'll grant you that. Once the information is public and the market has adjusted, ignorance is not a remedy. The damage is in the *arrival* of the information, not the *consumption* of it.
  But here's my pushback: What if the information is private to you? Suppose *only you* get the forecast. The insurer doesn't know.

  **Alex:** Then I have an advantage. I only buy insurance when I know I'll fail.

  **Jamie:** Exactly. Adverse selection. And what happens? The insurer realizes people like you exist. They raise premiums for everyone. The market unravels *because* some people looked at the signal. So your rational decision to look (per Good's Theorem) contributes to the destruction of the pool that benefits you.

  **Alex:** That sounds like a Prisoner's Dilemma. Individually rational moves lead to a collectively worse outcome.

  **Jamie:** It is a Prisoner's Dilemma. Good's Theorem tells you to Defect (look at the info). But if everyone Defects, the cooperative equilibrium (insurance market) collapses.

  **Alex:** Okay, now we're getting somewhere. Good's Theorem proves that "Defect" dominates "Cooperate" in the decision to acquire information *if* you treat the environment as fixed. But in a multi-agent system, the environment isn't fixed. It reacts to the aggregate information acquisition.
  So the rationalist slogan "Curiosity is instrumentally rational" is true for the individual in isolation, but potentially false for the individual embedded in a system where information affects trust or risk-sharing.

  **Jamie:** Yes. And specifically, it fails when the value of the information to *others* knowing that *you* have it is negative. In the insurance case, the value isn't just in me knowing the weather. It's in the insurer knowing *that I might know* the weather.

  **Alex:** So the distinction is: Good's Theorem holds when the information is **non-interactive**. It fails when the information is **strategic** or **general equilibrium**.
  If the information changes the *terms of trade*, the theorem breaks.

  **Jamie:** I'd go further. The theorem assumes the information is a **resource**. In the insurance case, information is a **toxin** to the risk-sharing mechanism. It turns a pool of uncertainty into a set of certainties, and insurance only works on uncertainty.

  **Alex:** *Nods slowly.* So, "I'd rather not know" is rational if "knowing" prevents the creation of a beneficial institution. But "I'd rather not look" is irrational if the institution is already gone and the info is free.

  **Jamie:** That feels right. It's about the timing.
  1. **Ex-Ante (Design Phase):** "Should we build the oracle?" Answer: Maybe not, if it kills insurance. Here, "I'd rather not know" (as a collective precommitment) is rational.
  2. **Interim (Decision Phase):** "The oracle is built. Should I query it?" Answer: Yes. Here, Good's Theorem holds. Ignoring it is irrational.

  **Alex:** And the confusion at the meetup was people applying the Interim result to the Design Phase.

  **Jamie:** Exactly. They were using a theorem about *updating beliefs* to justify *transparency policies*.

  **Alex:** Okay, I can live with that. Good's Theorem is a bound on *processing*, not on *architecture*.
  But one last push: Even in the Design Phase, isn't there a way to have the info *and* the insurance? What if we contractually agree to ignore the satellite?

  **Jamie:** *Smiles.* Now you're talking about costly state verification and commitment mechanisms. If you can credibly commit to not looking, you can keep the insurance. But that commitment has to be enforceable. If I can secretly look, I will. Good's Theorem ensures I *want* to cheat on the commitment.

  **Alex:** So the tension is real. The theorem guarantees that the *temptation* to know is always positive. Which means maintaining ignorance requires external enforcement, not just internal rationality.

  **Jamie:** Bingo. Rationality pushes toward information. Welfare sometimes requires ignorance. Therefore, rational agents in social contexts need *institutions* to enforce ignorance, because their individual rationality won't do it for them.

  **Alex:** *Raises glass.* So Good's Theorem proves we need privacy laws.

  **Jamie:** *Clinks glass.* I think I.J. Good would have hated that conclusion. But yes. To the tension between individual rationality and social welfare.

  **Alex:** And to reading the fine print on "fixed environments."

  **Jamie:** Cheers.
