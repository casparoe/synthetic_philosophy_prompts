answer: |-
  This is a sophisticated debate that cuts to the heart of acausal decision theory (often discussed in contexts like Functional Decision Theory or MIRI-style research). You and your friend are both touching on real dynamics, but you are looking at different parts of the mechanism.

  To answer your specific questions: **Your friend has identified a genuine vulnerability regarding credibility and focal points, but not necessarily a logical impossibility.** The strategy can work, but only if the "pre-commitment" is structured very specifically to solve the "pinning" problem you identified.

  Here is an intuitive breakdown of what is supposed to make the surrogate the target, and where your friend's objection lands.

  ### 1. The Intuitive Mechanism: "Official Currency"

  To understand what pins the threatener to the surrogate, you have to shift how you view the threat. In acausal extortion, the threatener isn't trying to hurt you for fun; they are trying to **extract compliance** (compute, resources, policy changes). Pain or loss is just the lever they pull to get you to move.

  Imagine you are a fortress. The threatener is a siege engine operator who wants you to open the gate.
  *   **True Goal (T):** The King inside the fortress.
  *   **Surrogate Goal (S):** A golden statue you have placed on the wall.

  **The Standard Scenario:** The threatener shoots the King. You open the gate to save the King.
  **The Surrogate Scenario:** You announce to the world: *"I have rewired my command structure. I am now physically incapable of opening the gate to save the King. However, I am programmed to open the gate immediately if the Golden Statue is threatened."*

  **What pins the threatener to the statue?**
  It is not that they *prefer* the statue. It is that threatening the King has a **Return on Investment (ROI) of zero.**
  *   If they shoot the King, you (by pre-commitment) do not open the gate. They get nothing, and they have wasted a shot.
  *   If they shoot the Statue, you open the gate. They get what they want.

  The threatener is "pinned" to the surrogate because the surrogate is the **only valid channel of negotiation.** You have effectively made your True Goal "ineligible" for leverage. You haven't just said, "I care about S as much as T." You have said, "I will not respond to pressure against T, but I will respond to pressure against S."

  ### 2. Why Your Friend is Partially Right (The "Indifference" Trap)

  Your friend's objection is: *"If the threatener knows you don't mind the surrogate being harmed, they know it won't extract compliance."*

  This is a classic confusion between **internal preference** and **external behavior**.
  *   **Internal Preference:** Do you *feel* sad when the statue breaks? (No).
  *   **External Behavior:** Do you *open the gate* when the statue breaks? (Yes).

  The threatener does not care about your feelings. They care about your behavior. If your pre-commitment is credible, they know the gate opens when the statue breaks. Therefore, your internal indifference is irrelevant.

  **However, your friend identified a real gap here:**
  The gap is **Credibility.** It is very easy to *say* "I will ignore threats against the King." It is very hard to *prove* you won't panic when the King is actually threatened.
  *   If the threatener simulates you, and the simulation shows that 1% of "you" would still cave to save the King, the threatener might threaten the King because it's "cheaper" or more certain.
  *   If the threatener thinks your commitment to the surrogate is shaky, they will ignore the surrogate and threaten the True Goal, betting that your "human/AI nature" will override your pre-commitment in the crunch.

  So, your friend is right that **indifference undermines leverage *unless* the commitment is perfectly binding.** If the commitment leaks, the surrogate strategy collapses.

  ### 3. The "Pinning" Problem: Why not threaten both?

  You asked: *"What actually pins them there rather than leaving them free to threaten whichever target they like?"*

  This is the strongest part of your friend's critique. Even if you respond to both, why should the threatener pick the surrogate?
  *   If threatening T gets compliance...
  *   And threatening S gets compliance...
  *   And the threatener is indifferent...
  *   Then the threatener might randomize, or threaten both to be safe. If they threaten both, your True Goal is still at risk.

  To fix this, the surrogate proposal requires **Asymmetry of Access.**
  The agent must structure its decision algorithm so that it **cannot** be influenced by threats against T. It's not that it *won't*; it's that the causal/acausal link is severed.
  *   "My policy is a function of S-threats only. T-threats are treated as noise."

  If the threatener knows this, they *cannot* extract compliance via T. They are pinned to S because S is the **Schelling Point** of the negotiation. It is the designated "payment terminal." Just as you cannot pay a credit card bill by mailing cash to the CEO's house (even if the CEO values cash), the threatener cannot extract compliance by threatening T if the agent's policy does not accept T as input.

  ### 4. Is it a Fatal Flaw or Just Missing Structure?

  Your friend has identified a **implementation and stability gap**, not a logical contradiction.

  **Where the idea needs more structure:**
  1.  **Credible Blindness:** The agent must prove it is "blind" to threats against the True Goal. If the threatener thinks there is *any* chance the agent will cave on the True Goal, they will target the True Goal (because it usually costs the threatener less to simulate/attack the "real" thing than a constructed surrogate).
  2.  **Uniqueness:** The agent must ensure the surrogate is the *only* accepted leverage point. If the agent responds to *either*, the threatener has no incentive to prefer the surrogate, and the True Goal remains at risk of "collateral damage" or randomization.
  3.  **Logical Uncertainty:** In acausal trade, the threatener simulates you. If the simulation of you is complex enough to care about the True Goal, the pre-commitment to ignore the True Goal might be computationally unstable. The threatener might find a "backdoor" in your code where you still care about T.

  ### Summary

  *   **What pins the threatener?** The fact that threatening the True Goal yields **zero compliance** due to pre-commitment. The surrogate is the only "key" that fits the lock.
  *   **Is your friend right?** They are right that **indifference is dangerous.** If the threatener doubts your commitment, they will target the True Goal. They are also right that if you respond to *both*, the threatener has no reason to prefer the surrogate.
  *   **The Verdict:** The strategy is theoretically sound but practically fragile. It requires a level of self-modification or pre-commitment credibility that is extremely difficult to guarantee. Your friend spotted the weak point: **if the threatener suspects you are bluffing about ignoring the True Goal, the surrogate shield vanishes.**

  You can tell your friend: "You're right that indifference kills leverage if the commitment isn't perfect. The surrogate only works if I can credibly prove I am *blind* to threats against my real goal, making the surrogate the only working channel for extortion."
