      *   Cite the *Essai* where possible (e.g., the Sunrise Problem, the discussion on testimony).
      *   Maintain a tone of intellectual reconstruction.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Laplace would *definitely* reject it. He might say it's a valid *lower bound* of knowledge. But his tendency was towards causal explanation.
      *   *Emphasis:* Highlight the distinction between "moral arithmetic" (statistics of society) and "physical causes." The DA treats humans like balls in an urn. Laplace treated humans as subjects of moral statistics *but* also as agents within a deterministic system.
      *   *Key Quote/Concept:* "Probability is relative to our ignorance." If we know causes, probability changes.

  8.  **Final Structure:**
      *   Introduction: Validate the insight.
      *   Mathematical Resonance: Why the link makes sense (Inverse Probability).
      *   The Causal Objection: Laplace's determinism vs. DA's indexicality.
