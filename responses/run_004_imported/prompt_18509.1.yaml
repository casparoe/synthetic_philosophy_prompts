  **Notes on the Ranking Logic:**

  *   **S vs A (Split-Brain):** IIT posits that after the corpus callosum is cut, the brain bifurcates into two separate "complexes." Each hemisphere supports its own stream of consciousness, so it is definitely conscious (Tier A), but the total integrated information is less than the unified whole (Tier S).
  *   **A (Expander Graph):** This is the crux of Aaronson's critique. IIT's mathematical formula *does* assign a high $\Phi$ to these highly connected grids, predicting they are highly conscious. I ranked this in A to reflect IIT's internal prediction (high $\Phi$), even though intuition (and Aaronson) says it should be D. This highlights the non-functionalist "substrate matters" logic you noticed.
  *   **B (Cerebellum):** Despite having ~80% of the brain's neurons, the cerebellum is highly modular and feedforward-like in its processing. IIT explicitly cites it as having low $\Phi$ compared to the cortex, which is why cerebellar damage doesn't erase consciousness. It ranks above a photodiode because it's still biological recurrence, but below the main cortical complex.
  *   **C (Photodiode):** Tononi's canonical example of a system with minimal but non-zero $\Phi$. It distinguishes two states (light/dark) and has a tiny amount of integration. It must rank above Tier D to satisfy the theory's claim that consciousness is a spectrum starting from simple systems.
  *   **D (The Unconscious/Zero Tier):**
      *   **Deep Sleep:** IIT uses this as a primary validation case; effective connectivity drops, $\Phi$ collapses below the threshold for consciousness.
      *   **CNN:** Purely feedforward systems have $\Phi = 0$ in IIT because there is no recurrent cause-effect power within the system.
      *   **Simulation:** IIT is substrate-dependent. A simulation on a classical CPU lacks the intrinsic causal power of the neurons it simulates. The *hardware* has negligible $\Phi$, and the *simulation* has none.
      *   **Stadium Wave/Beehive:** These are "aggregates," not "complexes." The causal links between individuals are too weak and slow to generate significant integration ($\Phi$) for the collective entity.
