          *   *Anti-Publish (Objection 1):* Infohazard/Roko's Basilisk risk (specifying the channel feeds it).
          *   *Anti-Publish (Objection 2):* Ineffectiveness (smart adversaries see through the surrogate and threaten the real target anyway).
      *   **Constraint:** The org's policy bars "clear and substantial infohazards." This phrase has never been used before.
      *   **Task:** Draft the memo the committee will use to decide on Friday.
