      *   *Constraint:* "Follow-up keyed to the answer she's most likely to give." -> I need to predict her defense. Usually, proponents argue from theoretical priors when empirical evidence is lacking.

      *(Self-Correction on Q1)*: Make sure the distinction between GMG and Reward Hacking is clear. GMG is about the *goal* representation. Reward hacking is about exploiting the *reward signal*. The overlap is the critique.
