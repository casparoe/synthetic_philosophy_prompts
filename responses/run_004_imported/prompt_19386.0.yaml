      *   *Key Texts:* *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2), *De Regno* (On Kingship), *Summa Theologiae* (I-II, q. 96, a. 4; II-II, q. 42, a. 2).
      *   *Key Distinctions:*
          1.  **Tyrant by Usurpation (ex defectu tituli):** Seized power illegitimately.
          2.  **Tyrant by Exercise (ex parte exercitii):** Legitimate title, rules badly.
      *   *Who can act?*
          1.  **Usurper:** Generally, public authority can act. Private individuals *might* act if no public authority exists, but Aquinas is cautious. In *In II Sent.*, he suggests a private person *can* kill a usurper if it's for the public good and no superior is available. However, later in *De Regno* and *ST*, he tightens this.
          2.  **Legitimate Ruler turned Tyrant:** Private individuals *cannot* kill him. This is the crucial point. Aquinas explicitly rejects private tyrannicide for legitimate rulers in *De Regno* (Book I, Ch. 6) and *ST* (II-II, q. 42, a. 2 - sedition is sinful). Only *public authority* (the community or a superior) can depose him.
      *   *Self-Defense:* Aquinas allows self-defense against unjust aggression (*ST* II-II, q. 64, a. 7), but applying this to a *ruler* is tricky. He generally subordinates individual self-defense to the common good when it comes to political authority.
      *   *Remedies:* Prayer, patience, appeal to a superior (Emperor, Pope), or public deposition. Violent rebellion by private persons is usually condemned as seditious.
      *   *The "Scourge" Argument:* Yes, Aquinas argues tyranny can be a punishment for sin, and rebellion often leads to worse tyranny.

