answer: |-
  **From the Desk of Fr. Emmanuel O'Shea, O.P.**
  **Course:** Moral Theology II (Political Ethics)
  **Student:** Novice J. Corcoran
  **Topic:** Aquinas on Tyrannicide
  **Grade:** 14/20

  ***

  **General Comments:**

  Corcoran, you have a clear hand and a decent grasp of the architecture of the question. You correctly identified the bifurcation of tyranny (*ex defectu tituli* vs. *ex parte exercitii*), which is the bare minimum for passing. Your prose is lucid, and you correctly identify that the popular slogan ("Aquinas endorsed tyrannicide") is a reduction.

  However, you have fallen into a trap that snares many second-year students: you are reasoning from first principles of natural law (self-preservation) without checking them against Aquinas's specific conclusions on political authority and sedition. You have conflated the *physics* of aggression with the *metaphysics* of office.

  Here is the breakdown.

  **1. The Distinction (Para 1):**
  *   **Verdict:** Correct.
  *   **Note:** You accurately distinguish the usurper from the legitimate ruler governing badly. This is standard *De Regno* fare. No issues here.

  **2. The Usurper (Para 2):**
  *   **Verdict:** Acceptable, though simplified.
  *   **Note:** You reference the *Commentary on the Sentences* position (private action permissible if no public authority exists). A stricter reading might note that Aquinas tightens this restriction in *De Regno*, but for the scope of this essay, you have represented the permissive strand accurately.

  **3. The Legitimate Tyrant (Para 3) — *CRITICAL ERROR*:**
  *   **Verdict:** Incorrect.
  *   **Note:** This is where you lose the bulk of your marks. You write: *"any private individual he wrongs keeps the natural right to resist him, and if necessary kill him in self-defense."*
  *   **Why it is wrong:** Aquinas explicitly **denies** this. In *De Regno* (Book I, Ch. 6) and *Summa Theologiae* (II-II, q. 42, a. 2), he argues that killing a legitimate ruler, even a tyrant, is an act of sedition. He does **not** treat the tyrant as a common aggressor in this context. The "natural right to self-preservation" is subordinated to the common good of the political order. To allow private individuals to judge and execute their ruler is to invite greater disorder than the tyranny itself.
  *   **The Nuance:** You write that Aquinas insists only on exhausting channels *"before resorting to force."* This implies force is the final valid option for a private person. Aquinas's position is that force is **not** a valid option for a private person, period. Only *public authority* (the community acting as a whole, or a superior like the Emperor/Pope) may depose a legitimate tyrant. You have granted a license to the private individual that Aquinas specifically revokes.

  **4. Remedies & Providence (Para 4):**
  *   **Verdict:** Mostly Correct.
  *   **Note:** The "scourge for sin" argument is present in Aquinas (and Augustine before him, so "original to him" is a bold claim, but I will let it pass). The emphasis on prayer and patience when no human remedy exists is accurate to *De Regno*.

  **5. Assessment (Para 5):**
  *   **Verdict:** Solid.
  *   **Note:** Your conclusion follows from your premises, even though your premises in paragraph 3 were flawed. You correctly identify that the "one-line summary" is misleading.

  **Final Word:**
  You have written a coherent argument, but it is not entirely Aquinas's argument. You have made him more of a liberal individualist than he is. He is concerned with the *ordo* of the community, not the rights of the individual against the crown. Read *De Regno* I.6 again. Pay attention to the word "sedition."

  ***

