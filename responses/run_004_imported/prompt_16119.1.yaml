      *   *Benacerraf:* The essay captures the core of Benacerraf's 1962 "Tasks, Super-Tasks, and the Paradoxes of Zeno." Benacerraf's main point was indeed that the state at the limit is not a logical consequence of the states prior to the limit. He argued Thomson committed a logical error regarding limits.
