  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did I distinguish between *inscrutability of reference* and *indeterminacy of translation*? They are related but distinct. Inscrutability is about terms (reference); Indeterminacy is about sentences (holophrastic meaning). The proxy function argument is usually about inscrutability. I need to make sure I link inscrutability to the IT/UTE distinction properly. Quine often uses them interchangeably in later work, but the distinction matters. *Correction:* I will clarify that proxy functions primarily target reference (inscrutability), which underpins the indeterminacy thesis. If reference is indeterminate, translation is indeterminate. If reference is indeterminate in physics, physics is indeterminate.
      *   *Check:* Is the "Fact of the Matter" distinction clear? UTE = We can't know, but God knows. IT = God doesn't know either, because there's nothing to know.
      *   *Check:* Does the proxy function argument make physics indeterminate? Quine says no, because we can hold the physics fixed and just change the interpretation of the ontology. But if the ontology is part of the theory, then the theory is indeterminate. This is the crux.

