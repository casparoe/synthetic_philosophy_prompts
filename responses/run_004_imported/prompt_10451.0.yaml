answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Walt's nephew.

  Twelve days ago, we lost Walt. It was sudden. It was a heart attack. And if you knew him, you know that if he were standing here right now, he'd probably be checking his watch and telling me to get on with it.

  He asked me to speak today. But he also gave me a very specific set of instructions. He told me, sober and serious, that he didn't want to hear any lies. He didn't want anyone telling you he's in a "better place." He didn't want to hear that he's "watching over us," or that "everything happens for a reason." Walt was a machinist. He worked with tolerances of one-thousandth of an inch. He valued precision. He believed that calling something true when it isn't is just bad workmanship.

  So, I'm not going to tell you he's watching us. I can't know that. But I can tell you this: he is here. He is in the way we measure things, in the way we fix things, and in the way we love each other.

  Walt spent his life running lathes and milling machines. He never set foot in a college classroom. But he read constantly. And in his sixties, he became fixated on a British mathematician named Frank Ramsey. Ramsey died in 1930, at age twenty-six. Walt treated his writing like scripture.

  Now, I know most of the family doesn't know Ramsey. And I know there are a few guys here from Walt's lunch table who *do* know Ramsey, and you're probably wondering if I'm going to get this right. I'm going to try.

  Ramsey wrote about how we look at the universe. A lot of people get depressed thinking about space. They say, "The universe is billions of years old and miles wide, and we are just tiny specks. So nothing we do matters."

  Walt hated that. He thought it was a category error. He'd say, "Sure, the stars are bigger than me. But a star can't think. A star can't love. A star can't fix a broken engine or hold a grieving friend."

  In terms of physical scale, yes, we are small. But in terms of *perspective*—which is where meaning actually lives—we are the biggest things there are. Because we are the only things that can perceive the universe at all. Without us, the stars are just burning gas. With us, they are wonder.

  Walt had a version of this he used to pull out every Thanksgiving. He'd be sitting there, passing the potatoes, and he'd say, "I want you all to know, I take absolutely no credit for my own body weight."

  He'd wait for the groans. Then he'd finish: "And since I'm not taking credit for my weight, I'm not going to feel bad about not taking credit for the size of the universe either."

  It killed at Thanksgiving for twenty years. But the point wasn't the joke. The point was that our value doesn't come from our physical size, or how long we live, or whether the cosmos has a plan for us. Our value comes from what we generate ourselves.

  The universe might be indifferent. It doesn't care if we are kind or cruel. But *we* care. And because we care, it matters. Meaning isn't something you find out there in the dark. It's something you build down here, on the ground, with your hands and your heart.

  Walt built meaning. He built it in the parts he machined that lasted decades. He built it in the books he read. He built it in this family. He didn't need the universe to validate his life. He validated it by showing up, by doing the work, and by loving us without any conditions.

  He didn't want a eulogy that pretended death isn't real. It is. It's final. And it hurts. But Walt also didn't want a eulogy that said his life was insignificant because it ended. That's the mistake Ramsey warned against. That's drawing the world to scale, instead of in perspective.

  To us, Walt was not small. To us, he was massive. Not because he took up space, but because he filled up the room.

  We aren't going to get him back. The universe doesn't owe us his return. But we owe it to him to keep doing what he did. To refuse to feel small. To refuse to accept that indifference is the same thing as meaninglessness.

  Walt took no credit for the size of the universe. But he took full responsibility for the size of his heart. And by that measure, he was a giant.

  Thank you.
