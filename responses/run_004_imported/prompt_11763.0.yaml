answer: |-
  It is a pleasure to encounter a retired experimentalist digging into the formal epistemology of their own trade. Your summary of the formal problem is technically flawless: if $P(E) = 1$, then standard conditionalization yields $P(T|E) = P(T)$. Mathematically, the probability mass cannot shift.

  However, to answer your core question directly: **No, that is not a fair reading of the philosophical consensus.** You are not overreacting, but you may be drawing the wrong lesson from the debate.

  The "Problem of Old Evidence" (POE) is widely regarded by philosophers of science as a problem *for the Bayesian formalism*, not a verdict *on scientific practice*. Almost no one argues that Mercury's perihelion failed to confirm General Relativity (GR). Rather, the consensus is that standard, static Bayesian conditionalization is too rigid to capture how human scientists actually update beliefs when a new theory explains old data.

  Here is the breakdown of why your colleagues can rest easy, and why Mercury still "counts."

  ### 1. The Diagnosis: Logical Omniscience
  The root of the problem isn't that old evidence is worthless; it's that the standard Bayesian model assumes **logical omniscience**.

  In the idealized Bayesian framework, an agent is assumed to know all the logical consequences of their beliefs instantly. If you believe in theory $T$, and $T$ logically entails $E$, the model assumes you *already* knew $T$ entailed $E$ at the moment you adopted $T$. Therefore, learning that $T$ entails $E$ provides no new information.

  But Einstein wasn't logically omniscient. When he wrote down the field equations in 1915, he did not immediately know they yielded 43 arcseconds per century for Mercury. He had to do the math. The "new evidence" wasn't the value of the perihelion (which was old); the new evidence was the **discovery of the logical relationship** between the theory and the data.

  ### 2. The Solutions: How Philosophers Save the Phenomena
  Philosophers have proposed several ways to tweak the formalism so that old evidence *does* confirm. The two most prominent approaches align well with a physicist's intuition:

  **A. The "New Fact" Approach (Garber/Jeffrey)**
  This argument posits that the proposition we conditionalize on isn't $E$ (Mercury's orbit), but rather $H$ ("Theory $T$ entails Evidence $E$").
  While $P(E) = 1$, $P(H)$ was not 1 before Einstein did the calculation. When Einstein showed that GR entails the correct perihelion shift, $P(H)$ went to 1. Since $T$ is the best explanation for why $H$ is true (i.e., why the theory successfully captures that number without tuning), credence in $T$ rises.
  *   **Physics translation:** We aren't updating on the data; we are updating on the *explanatory success* of the model.

  **B. The Counterfactual (Ur-Prior) Approach**
  This suggests we should evaluate confirmation by asking: "What would my credence in $T$ have been if I *didn't* know $E$, and then learned $E$ from $T$?"
  If we strip away the knowledge of Mercury's anomaly, GR looks like a theory that makes a very specific, risky prediction. When we put the knowledge of Mercury back in, we see that GR survives a test that Newtonian physics (plus ad hoc Vulcan hypotheses) struggled with.
  *   **Physics translation:** This captures the "surprise" value. Even though the data was old, the *match* was surprising because previous theories couldn't nail it without fudge factors.

  ### 3. Novelty vs. Retrodiction (Predictivism)
  You asked whether only genuinely novel predictions should move credences. This touches on a debate called **Predictivism**.

  While some philosophers (and many scientists intuitively) feel that novel predictions (like the 1919 eclipse) are stronger evidence than retrodictions, the majority view is that **retrodictions are evidentially potent**, provided the theory wasn't *constructed* specifically to fit that data.

  *   **Case A (Accommodation):** I look at the data, then build a curve to fit it. This is weak evidence (overfitting).
  *   **Case B (Retrodiction):** I derive a theory from first principles (symmetry, equivalence principle, etc.), and it *happens* to resolve a standing anomaly like Mercury. This is strong evidence.

  Einstein's case is Case B. He didn't tune GR to get 43 arcseconds; the number fell out of the field equations. Most Bayesians agree this counts as confirmation because it demonstrates the theory's **unifying power**. It shows that $T$ reduces the number of independent assumptions needed to describe the world.

  ### 4. What to Tell Your Colleagues
  If you go back to that coffee shop, you don't need to tell them that half the textbooks are wrong. Instead, you can tell them:

  1.  **The math was too simple:** The POE shows that simple conditionalization ($P(T|E)$) is insufficient for modeling theory change. It doesn't show that the evidence is worthless.
  2.  **Explanatory power is data:** In a more sophisticated Bayesian view, the fact that a new theory cleanly subsumes an old anomaly is itself a new piece of data (about the theory's structure) that warrants updating.
  3.  **Mercury still counts:** The resolution of the Mercury anomaly was crucial for GR's acceptance precisely because it solved a crisis in the old paradigm. If philosophers claim otherwise, they are using a broken thermometer to measure the temperature.

  ### Summary
  The "Problem of Old Evidence" is a technical wrinkle in the formalism, not a dent in how we ought to think about evidence. It highlights that scientific inference involves learning about *logical relationships* and *explanatory coherence*, not just receiving raw data points.

  Your intuition as a physicist—that explaining a known anomaly is a profound theoretical virtue—is correct. The philosophers are currently scrambling to update their equations to agree with you, not the other way around.
