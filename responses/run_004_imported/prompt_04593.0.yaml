  3.  **Explore the "Principled Reason" (Premise-based vs. Conclusion-based):**
      *   This is the core of the user's second question. There is extensive literature on this.
      *   *Conclusion-based (Direct Vote):* Respects individual integrity on the final outcome. Treats the group as a democracy of outcomes. Good for accountability. Bad for logical consistency.
      *   *Premise-based (Issue-by-Issue):* Respects the logical structure of the decision. Treats the group as a collective reasoner. Good for consistency and epistemic accuracy (if the premises are the "truth"). Bad because it might override the majority's will on the final outcome.
      *   *Context Matters:* In a court (judges), premise-based is often preferred (legal consistency). In a legislature (policy), conclusion-based is often preferred (political will). In a giving circle (epistemic truth-seeking), premise-based might be stronger *if* the goal is to find the "correct" charity, but conclusion-based is better if the goal is "shared ownership of the decision."

