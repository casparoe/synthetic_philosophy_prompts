      *   It's not exactly Arrow's Impossibility Theorem (which deals with ranking preferences).
      *   It's not exactly a Condorcet Cycle (which deals with cyclic preferences over options).
      *   It *is* the **Doctrinal Paradox** (also known as the **Discursive Dilemma**).
