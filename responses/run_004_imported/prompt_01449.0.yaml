      *   *The Nature of Truth:* If $p$ is true, counter-evidence *is* misleading by definition. Why should I treat misleading evidence as weighty?
      *   *Pragmatic Stability:* If knowledge didn't allow this, we could never act on knowledge. Every belief would be perpetually provisional. We need "epistemic stoppers."
      *   *Critique of Defeasibility:* The defeasibility theory leads to skepticism. If *potential* defeaters destroy knowledge, do I know anything? Also, it creates a temporal paradox: Did I know it *before* the evidence arrived? If yes, I should have ignored it. If no, I never knew it.
      *   *Contextualism/Interest-Relative Invariantism (IRI):* Maybe "know" means different things in different contexts. In a high-stakes context of *maintaining* belief, dogmatism is the correct norm.
