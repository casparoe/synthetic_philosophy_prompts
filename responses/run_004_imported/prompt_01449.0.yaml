      *   *Point 1: The Logic of Truth.* If $p$ is true, $\neg p$ is false. Evidence for $\neg p$ is evidence for a falsehood. Evidence for a falsehood is misleading. If I *know* $p$, I am in contact with the truth. Why should contact with truth bow to appearances of falsehood?
      *   *Point 2: The Failure of Defeasibility (The "Prior Knowledge" Problem).* The defeasibility fix says "You lose knowledge when evidence arrives." But the paradox is about the *prior* state. At $t_1$, I know $p$. At $t_2$, evidence $e$ arrives. The dogmatist says at $t_1$ I am justified in planning to ignore $e$. The defeasibility theorist says "No, because at $t_2$ you won't know." But rationality is about decision-making *now* based on *current* states. If I know now, I must plan for the future based on current knowledge.
      *   *Point 3: Skeptical Threat of Defeasibility.* If I have to treat every possible future defeater as live, I never know anything. To know $p$, I must be able to rule out relevant alternatives. If "future evidence" is a relevant alternative that I can't rule out without dogmatism, knowledge collapses.
      *   *Point 4: Epistemic Rights vs. Psychological Inability.* Dogmatism isn't saying you *can't* look. It's saying you aren't *rationally compelled* to change your belief. You have an epistemic right to hold firm.

