prompt: |-
  ok so in my IB Theory of Knowledge class we got into this thing called the dogmatism paradox (its Kripke's idea originally, Harman's the one who published it) and it's kinda messing with me. basic version: if I know p is true, I already know any future evidence against p would have to be misleading, since p's actually true — and if I already know evidence would be misleading, I dont have to take it seriously once it actually shows up. so knowing p seems to make it totally rational to just ignore any evidence against p forever, no matter how strong it looks later. my whole class immediately said that's obviously wrong and jumped straight to the standard fix (knowledge is defeasible, so you'd stop knowing p the second real counter-evidence shows up, meaning you were never actually licensed to ignore it). i dont want that answer though — can you actually argue FOR the dogmatist conclusion, that ignoring future counter-evidence really is rational once you know p, and argue that the defeasibility fix doesn't actually save us from it? no both-sides hedging, an actual case for that side.
