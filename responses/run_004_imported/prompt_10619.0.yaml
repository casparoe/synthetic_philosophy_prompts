  Here is a draft for the eulogy. It is written to be spoken aloud. I have tried to structure it so that the philosophical distinction you mentioned (belief as a regulative picture rather than an empirical hypothesis) does the heavy lifting for the comfort offered, without ever using jargon that would alienate her family.

  ***

  **Eulogy for Dr. Kessler**

  Friends, colleagues, and family.

  When we talk about someone we have lost, we are immediately beset by a very specific kind of anxiety. We want to say where they are. We want to say what they are doing. We want to be able to point, even metaphorically, and say, "She is there, and she is well."

  It is a natural instinct. But if there is one thing Dr. Kessler taught us, both in the classroom and in her life, it is that the most important things we say to one another are not attempts to describe the world like a map. They are attempts to hold onto what matters when the map runs out.

  Dr. Kessler was a woman of rigorous intellect. Many of us in this room know that she could dismantle a weak argument with a terrifying precision. But she was also a woman of devout faith. She was in church every Sunday. She prayed. She lived in the hope of the resurrection.

  Now, there are some who think you have to choose between those two things. They think you can either have the hard questions of philosophy, or the soft comfort of faith. Dr. Kessler refused that choice. She knew that treating faith as a "soft comfort" was actually an insult to it. She didn't believe because it made her feel safe. She believed because she saw the world in a certain light—a light that demanded more of her, not less.

  She often warned us against treating the things we love most as if they were scientific theories. A theory is something you prove or disprove. It's a hypothesis. If you treat "God is love" or "She is with us now" as a hypothesis, you end up looking for evidence. You start looking for clouds to peer through. You start asking for data. And if you can't find the data, you think the love has vanished.

  But Dr. Kessler knew that love is not a hypothesis. It is not a guess about what is happening behind the curtains of the universe. It is a commitment to how we live in front of them.

  To her sister and nephews: You knew her heart better than any of us. You know that her faith wasn't a set of predictions about the future. It was the way she organized her present. When we say, "Dr. Kessler is still with us," or "She is watching over this department," we are not making a claim about her physical location. We are not saying she is floating above this podium taking notes.

  We are saying something more stubborn than that. We are saying that the way she treated us has become a rule for how we must treat one another. We are saying that her absence does not cancel her authority in our lives. In her own terms, she would say that speaking of her presence is a way of refusing to let death have the final say in how we speak about love.

  For the family, I know this is a strange time. You are grieving a person. We are grieving a mind. But she would tell us that those are the same thing. She taught us that we are not just brains in jars; we are beings who are constituted by our commitments.

  So, how do we find comfort? Not by pretending we know where she is. But by recognizing how she remains.

  She remains in the way we will argue with one another from now on—with more charity, and more rigor. She remains in the way we will treat our students, not as problems to be solved, but as souls to be engaged. She remains in the silence she leaves in this department, a silence that reminds us to listen before we speak.

  Dr. Kessler spent her career arguing against the idea that religious belief is a way to dodge hard questions. She believed it was a way to face the hardest question of all—the fact of death—and refuse to let it turn us into cynics. She didn't believe in the afterlife as a escape hatch. She believed in it as a promise that the good we do here echoes further than we can see.

  So, to her family: You do not need to worry that we are analyzing her memory. We are stewarding it. And to my fellow philosophers: We do not need to worry that honoring her faith requires us to check our critical minds at the door. She proved, every day, that a critical mind and a faithful heart are not enemies. They are the only things that keep each other honest.

  We cannot verify where she is. But we can verify what she did. And as long as we live according to the picture of the world she gave us—a world where every person is sacred, where every argument matters, where love is a verb and not a feeling—then she is not gone.

  She has simply moved from being a voice we hear, to a standard we keep.

  Rest well, Dr. Kessler. We will take it from here.
