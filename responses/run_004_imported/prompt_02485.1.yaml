      *   *Section 3: The Verification Problem.* This is the crux. She can't "show" the truth. She has to stage a *logical trap*.
          *   The "Gödelian" move. She doesn't prove the fact exists; she proves the Loom *cannot process* the fact without contradicting itself.
          *   Dramatic execution: A ritual of ingestion. The Loom tries to consume the statement and glitches/fails/admits error.
      *   *Section 4: Dramatic Flair.* Suggest making the fact personal or tied to the protagonist's agency. The "Unarchived Choice."
      *   *Section 5: Potential Pitfalls.* Warn about the "Omnipotence" counter-argument (God can do logic-defying things). She needs to pin the Loom down to *Logic* vs. *Magic*.

  6.  **Refining the "Verification" Logic (Self-Correction during drafting):**
      *   Wait, if she writes "The Loom does not know X," and she knows X, then the Loom can just learn X from her. Then the statement becomes false.
      *   The statement must be about the *state of the archive at the moment of inscription*.
      *   Statement: "At time T, this proposition is not in the Loom."
      *   If the Loom adds it at Time T+1, the statement was true at Time T. So the Loom *can* know it retrospectively.
      *   *Correction:* Fitch's paradox is about *conjunctions*. $p \land \neg Kp$. "It is raining and nobody knows it is raining."
      *   If the Loom knows "It is raining and nobody knows it is raining," then somebody (the Loom) knows it is raining. So the second part ($\neg Kp$) becomes false.
      *   So the truth *exists* (it is raining and nobody knows it), but it *cannot be known* (because knowing it makes it false).
      *   *Application:* The protagonist needs to point out a truth that *ceases to be true* if the Loom records it.
      *   *The Climax:* She doesn't hand the Loom a fact. She hands the Loom a *mirror*. She forces the Loom to acknowledge a blind spot that vanishes upon acknowledgment.
