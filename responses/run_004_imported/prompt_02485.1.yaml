  2.  **Evaluate the Philosophy (Fitch's Paradox):**
      *   *What is Fitch's Paradox?* It states: If all truths are knowable ($\forall p (p \rightarrow \Diamond Kp)$), then all truths are known ($\forall p (p \rightarrow Kp)$). Since clearly not all truths are known, it follows that not all truths are knowable.
      *   *The User's Interpretation:* The user says: "the only way out is to accept that there's got to be at least one truth out there that is straight-up unknowable, period, even to a perfect all-knowing being."
      *   *Correction/Nuance:* This is the tricky part. Fitch's paradox applies to *knowers* within a logical system. If the Loom is defined as *omniscient* (knows all truths), Fitch's paradox creates a contradiction *if* the Loom is also bound by the logic of "knowability."
      *   *The "Omniscient Being" Problem:* If the Loom is truly god-like and outside time/logic, Fitch might not apply to *it* directly, but rather to the *concept* of truth itself. However, the user's premise is that the Loom claims to hold *all* truths. If Fitch proves some truths are *inherently* unknowable, then the Loom's claim is logically impossible.
      *   *The Verification Problem:* This is the user's biggest hurdle. How do you prove $X$ is a truth if $X$ is unknowable? If you know $X$, it's known. If it's known, it's not a Fitch-truth (which relies on the structure "p is true but not known").
      *   *Refining the Logic:* Fitch's paradox usually hinges on the "Knower Paradox" structure: "p is true but nobody knows p." If someone knows *that* statement, the statement becomes false. Therefore, that specific type of truth cannot be known.
      *   *Application to the Story:* The protagonist doesn't need to find a truth the Loom *doesn't* know (because if she finds it, the Loom could just learn it). She needs to find a truth that *cannot be recorded* without becoming false. A self-negating truth.

