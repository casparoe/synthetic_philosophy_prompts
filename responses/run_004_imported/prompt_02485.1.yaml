      *   *Wait, one nuance:* If the Loom is *already* omniscient, Fitch's paradox implies there are no unknown truths. But if the Loom *claims* to be omniscient but isn't, Fitch applies.
      *   *Actually, the stronger argument:* If the Loom claims "I know all truths," and Fitch proves "There are truths no one can know," then the Loom's claim is logically incoherent.
      *   *The "Truth" she finds:* It's not a specific fact about the world (like "the butler did it"). It's a structural fact about knowledge itself.
      *   *Okay, let's pivot slightly:* The most dramatic version is a truth that depends on *her* ignorance. "I do not know this fact." If she knows it, it's false. If it's true, she doesn't know it.
