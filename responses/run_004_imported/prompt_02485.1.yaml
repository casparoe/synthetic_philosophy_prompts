      *   *Section 1: The Philosophy Check.* Validate Fitch's Paradox but clarify the "Omniscient Being" nuance. The paradox proves there are truths that *cannot be known*, not just truths that *aren't known*. This supports her goal.
      *   *Section 2: The Candidate Fact.* Propose the "Self-Negating Record." Specifically, a statement about the Loom's own current state of knowledge.
          *   Example: "The Loom does not currently hold the record of this specific sentence."
