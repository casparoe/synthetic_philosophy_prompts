answer: |-
  **Setting:** *A quiet corner of a university library. Two graduate students, **Alex** (defending the Actualist Higher-Order Thought theory, akin to Rosenthal) and **Dan** (defending the Dispositional Higher-Order theory, akin to Carruthers), are reviewing notes for a seminar.*

  **Alex:** I've been reviewing your outline on the dispositional account, Dan. It's elegant, I'll give you that. It saves us from positing a cognitive explosion. But I keep hitting a wall with the metaphysics. You're treating consciousness as a capacity, like solubility. But being conscious isn't like being soluble. It's like dissolving.

  **Dan:** That's the standard Actualist line. But think about the cognitive architecture. If I'm looking at a sunset, I'm consciously seeing the orange, the clouds, the horizon. I'm also consciously feeling the breeze, hearing the traffic, and sensing my posture. On your view, for every single one of those first-order states to be conscious, there must be a distinct, occurrent higher-order thought (HOT) targeting it *right now*. That's dozens of simultaneous meta-cognitive events. It's biologically profligate.

  **Alex:** It's only profligate if you assume the first-order field is as rich as it seems. We know from change blindness that our conscious field is actually quite sparse. We only consciously experience what we attend to. And attention, on my view, just *is* the mechanism generating the occurrent HOT. So, there's no explosion. There's only one or two occurrent HOTs at a time, matching the narrow bandwidth of consciousness.

  **Dan:** But that concedes too much phenomenology. It feels like a rich field, even if attention is narrow. But let's grant the bandwidth point for a moment. My deeper worry is the "thinness" of the disposition. You say a state is conscious only if a HOT is actually occurring. I say a state is conscious if it is *available* to the mindreading system.
  Consider this: If I'm driving on autopilot, I'm perceiving the road. I brake for a pedestrian. Later, I realize I didn't consciously see them until the last second. On your view, before that realization, there was no HOT, so there was "nothing it was like" to see the road. But I was clearly sensitive to the visual data.
  My view says the state was conscious *in the sense that matters for agency* because it was poised for access. Your view says the lights were literally off until the HOT flipped the switch. But a disposition to be accessed isn't an occurrence. It's too metaphysically thin to ground the *presence* of experience.

  **Alex:** Precisely! That's my point. You're conflating *access* with *phenomenality*. Just because a state is available to the mindreading system doesn't mean there is something it is like to *be* in that state.
  Think of a camera recording in an empty room. The data is there. It is disposed to be viewed. But is there "something it is like" to be the camera? No. You need a viewer. The occurrent HOT is the viewer. Without the actual occurrence of the thought "I am seeing red," there is no subjective presence. You're describing a zombie state—a state that functions like consciousness but lacks the ontological weight of actual awareness. A sugar cube is soluble even when dry, but it isn't *dissolving*. Consciousness is the dissolving, not the solubility.

  **Dan:** But that analogy cuts both ways. Solubility is a real physical property of the sugar, grounded in its molecular structure. It doesn't require water to be *there* to be real.
  Here is where my view has the upper hand: The Targetless Thought problem. This is the bullet you have to bite that I don't.
  On your Actualist view, consciousness is constituted by the HOT itself. So, what happens if a HOT occurs—due to a neural glitch or stimulation—without a corresponding first-order state? Rosenthal admits this is possible. He says you would consciously seem to see red, even if no red-representation exists.
  But think about what that implies. You're saying a higher-order thought can *manufacture* phenomenality out of thin air. It creates a "what it's like" where there is no underlying state to be conscious of. That sounds like magic. It severs the link between consciousness and the world entirely.

  **Alex:** It's not magic, it's misrepresentation. And it's a virtue of the theory, not a bug. Think about dreams or hallucinations. In a vivid dream, I see a dragon. There is no first-order visual state of a dragon (since no dragon is present). Yet, there is definitely "something it is like" to see the dragon.
  If you require an actual first-order state for consciousness, you can't explain the phenomenology of hallucination without positing strange, non-veridical first-order contents. My view handles it cleanly: The HOT is occurring, representing me as being in a state of seeing a dragon. That occurrence *is* the consciousness. The fact that it's targetless explains why the experience is non-veridical.
  Your Dispositional view struggles here. If I hallucinate a dragon, what state is "disposed" to be targeted? If there's no first-order state, there's no disposition. So, on your view, hallucinations shouldn't be conscious experiences at all, or you have to posit "ghost" first-order states.

  **Dan:** I don't need ghost states. I just need to say the mindreading system is misfiring on its *own* outputs. But let's look at the biological implausibility again, because you waved it away too quickly.
  Even if we accept your sparse attention model, consider the *timing*. For a state to be conscious on your view, the HOT must be roughly simultaneous. But neural processing takes time. If the HOT comes too late, it's a memory, not a consciousness of the present. If it comes too early, it's a prediction.
  You require a precise, occurrent synchronization for every conscious moment. My view is robust. It says the first-order state has the right functional connections to the mindreading system. Whether the HOT actually fires right now is irrelevant to the *status* of the state. It's like a website being "online." It's online even if no one is currently loading the page. The server is ready.
  Your view requires that the page is only "online" when someone is actively refreshing it. That makes consciousness incredibly fragile.

  **Alex:** But the "website" analogy fails because consciousness isn't a public resource; it's a private occurrence. If no one loads the page, the content isn't being experienced.
  You're worried about biological cost; I'm worried about metaphysical accuracy. You want to naturalize consciousness by making it a functional disposition. But in doing so, you've eliminated the very thing we're trying to explain: the *occurrence* of experience.
  If I am in pain, but I am deeply distracted and not currently thinking about the pain (no occurrent HOT), your view might say the pain state is still conscious because it's disposed to be targeted. But if I'm truly absorbed in a task, there is literally nothing it is like to feel the pain *at that moment*. The pain becomes conscious only when I attend to it—when the HOT occurs.
  Your view blurs the line between *being in a state* and *being conscious of the state*. You've made consciousness a property of the first-order state (its dispositional profile). I maintain consciousness is a relational property that only exists when the second-order relation is actually instantiated.

  **Dan:** And that's where we fundamentally diverge. You think the "light" of consciousness is a separate beam shining on the object. I think the "light" is just the object being visible to the rest of the system.
  Let's press your Targetless Thought defense again. You say it explains hallucinations. But it also implies that if I have a targetless HOT, I am conscious of *nothing*. Rosenthal calls this "consciousness of nothing."
  But introspectively, when I hallucinate, I am conscious *of a dragon*. The experience has content. If the HOT is targetless, where does the content come from? If the HOT says "I am seeing red," but there is no red-state, the HOT is lying. Why should a lie generate genuine phenomenology?
  On my view, the content comes from the first-order system, even if it's noisy. The disposition is to interpret *that* noise. I don't need to manufacture qualia from a meta-thought. The qualia are in the first-order processing; the consciousness is the availability of that processing.

  **Alex:** Because you treat qualia as first-order properties. I treat them as properties of the *complex* of the first-order state plus the HOT.
  Look, Dan, your worry is that I make consciousness too fragile and too prone to error. My worry is that you make consciousness too cheap.
  If consciousness is merely a disposition, then a sophisticated robot with a monitoring system could be conscious, even if it never actually monitors anything. It just needs the wiring. But intuitively, if the monitoring never happens, the lights are never on.
  You accuse me of biological implausibility. I accuse you of phenomenological implausibility. You've saved the brain from cognitive overload by sacrificing the "what it's like"-ness. You've given us a theory of *access* and called it a theory of *consciousness*.

  **Dan:** And you've given us a theory of *introspection* and called it *consciousness*.
  If I'm right, consciousness is a biological tool for global control. It doesn't need to be an occurrent glow; it needs to be a functional readiness. That explains why we have it—it allows for flexible reasoning.
  Your occurrent HOT is a homunculus waiting to happen. Who reads the HOT? If the HOT is the consciousness, do we need a HOT-2 to be conscious of the HOT? You stop the regress by saying "no," but it feels arbitrary.
  My regress stops naturally: The system is disposed to represent the state. That's it. No infinite tower of thoughts.

  **Alex:** The regress stops because the HOT is non-conscious. Only the first-order state is conscious *in virtue of* the HOT. The HOT is the make-up artist, not the actor. It doesn't need to be seen to do its job.
  But we're back to the core metaphysical split. You think "what it's like" is a functional role. I think it's an ontological category.
  If you're right, then a state could be conscious even if the creature dies the moment before the HOT fires, provided the disposition was there. That seems absurd. The experience never happened.
  If I'm right, then experience is fleeting and actual. It happens or it doesn't.
  Perhaps the truth is, your theory explains the *function* of consciousness, and mine explains the *existence* of consciousness.

  **Dan:** That might be the most honest stalemate we can reach. I'm explaining how the mind uses states. You're explaining how states feel.
  But I still maintain: if the feeling requires an actual thought every time, the mind is far busier than the brain can support.

  **Alex:** And I maintain: if the feeling is just a disposition, the mind is far emptier than it subjectively appears.
  Maybe the biological cost is the price of admission for subjective presence.

  **Dan:** Or maybe subjective presence is just the user-illusion generated by the disposition.

  **Alex:** *[Closes notebook]* Then I suppose we'll have to agree that the price of the illusion is the one thing we can't settle without stepping outside the theory itself.

  **Dan:** *[Smiles]* Which is, presumably, what the Extended Essay is for.
