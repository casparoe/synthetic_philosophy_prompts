answer: |-
  This is a sophisticated dispute that cuts to the heart of dispositional metaphysics. You and your friend have correctly identified the structural impasse: you are arguing about the *topology* of Tom's psychology under counterfactual conditions, using the vocabulary of behavior to describe what is essentially a question about causal bases.

  Here is the verdict on Tom, a new example designed to dissolve the ambiguity you faced, and a brief note on the implications for Aristotelian virtue.

  ### 1. The Verdict on Tom: Underdetermined

  Based strictly on the facts as you described them, Tom's case is **underdetermined**.

  Your friend claims Tom is a **Fink**; you claim Tom is **Masked**. The behavioral evidence (acting boldly in moderate risk, unknown behavior in extreme risk) is compatible with both metaphysical structures. To settle the matter, we need to know the status of the *categorical basis* of the disposition at the exact moment of stimulation.

  *   **The Finkish Interpretation (Your Friend):** Tom's "courage" is causally dependent on a low-level assessment of risk. The basis of the disposition is something like *confidence*. When the risk scales to "serious death," the stimulus itself triggers a psychological mechanism that dissolves the confidence *before* the action can be initiated. The disposition to act boldly ceases to exist *because* the test occurred. If we could freeze time at the moment of extreme danger, we would find Tom no longer *inclined* to act.
  *   **The Masked Interpretation (You):** Tom's "courage" is a stable *hexis* (settled state). The basis is a robust commitment to intervention. When the risk scales to "serious death," the stimulus triggers a distinct physiological fear response (freezing, paralysis) that prevents the motor execution of the bold act. If we could freeze time at the moment of extreme danger, we would find Tom still *inclined* to act, but unable to translate that inclination into motion.

  **The Further Fact Required:**
  To settle this, you need access to Tom's **counterfactual volition**.
  Imagine a scenario where Tom is faced with the extreme risk, but we magically remove the *consequence* of fear (e.g., we stimulate his motor cortex directly).
  *   If his brain sends the "go" signal but his body freezes, it is a **Mask**. The disposition was ready to fire; the output was blocked.
  *   If his brain generates *no* "go" signal because the valuation of the risk has instantly rewritten his priorities, it is a **Fink**. The disposition itself was removed by the stimulus.

  Without knowing whether the fear *overrides* the courage (Mask) or *erases* the courage (Fink), the verdict remains indeterminate. Your friend assumes courage is fragile (finkish) under high pressure; you assume it is robust but physically constrained (masked).

  ### 2. A New Example: The Honest Politician

  To prevent two observers from talking past each other, we need a case where the *internal state* is decoupled from the *external outcome* in a way that is conceptually sharp. Physical objects (wires/glass) allow this easily because physics is distinct from the disposition. With humans, we must separate *will* from *capacity*.

  **The Character:** Senator Elias.
  **The Disposition:** Integrity (a disposition to tell the truth when questioned).
  **The Stimulus:** A grand jury inquiry where telling the truth guarantees his political destruction.

  **Case A: The Mask (The Panic Attack)**
  Elias enters the hearing with the firm intention of testifying truthfully. His commitment to integrity is intact. However, the moment he is sworn in, the sheer magnitude of the stakes triggers a severe, involuntary psychosomatic panic response. His throat constricts; he suffers a dissociative fugue. He sits silently or babbles incoherently, failing to tell the truth.
  *   **Diagnosis:** Masked. The disposition (Integrity) remained present up to the moment of manifestation. The failure was in the *channel* of manifestation, not the source. If we had administered a truth serum that bypassed his panic, the truth would have come out.

  **Case B: The Fink (The Rationalization Switch)**
  Elias enters the hearing with a reputation for integrity. However, his integrity is causally sustained by a belief that "honesty is the best policy *for a successful career*." The moment the stimulus (the guarantee of destruction) is processed, a subconscious defense mechanism triggers. To protect his ego, he instantly re-frames the situation: "Lying now is actually protecting my family; therefore, lying is the moral choice." His valuation shifts so rapidly that by the time he opens his mouth, he *believes* the lie is the right thing to do. He lies calmly and confidently.
  *   **Diagnosis:** Finkish. The stimulus (the threat of destruction) caused the disposition (Integrity) to vanish *before* the action. He did not fail to manifest integrity; he ceased to possess it at the moment of testing. A truth serum would not help, because he no longer holds the truth as his primary value.

  **Why this prevents talking past each other:**
  In the car, you and your friend argued about *behavior* (would he run in?). In the Politician case, the distinction rests on *belief and desire* at time *t*.
  *   If the Mask theorist is right, Elias *wanted* to tell the truth but couldn't.
  *   If the Fink theorist is right, Elias *stopped wanting* to tell the truth.
  This forces the argument away from "what happened" to "what was the psychological state when it happened," which is the actual locus of the fink/mask distinction.

  ### 3. Implications for Aristotelian Virtues

  Do these cases give us reason to doubt that virtues can be given a conditional analysis? **Yes, significantly.**

  The simple Conditional Analysis (CA) states: *S is virtuous V iff S would do action A if circumstance C arose.*
  *   **Finks** break CA because the virtue disappears when C arises (Martin's point).
  *   **Masks** break CA because the virtue remains but A is not done (Bird's point).

  Lewis's *Reformed Conditional Analysis* (RCA) attempts to fix this by adding a "ceteris paribus" clause regarding the intrinsic basis: *S would do A if C arose, provided S retained the intrinsic basis of V.*

  However, for Aristotelian virtues, this is insufficient. Aristotle defines virtue not merely as a disposition to act, but as a *hexis*—a settled state involving practical wisdom (*phronesis*).
  1.  **Finkish Virtues aren't Virtues:** Aristotle would likely argue that if a character trait evaporates under pressure (the Fink case), it was never a virtue to begin with; it was merely a natural temperament or a habit. True virtue, for Aristotle, is robust by definition. Therefore, a conditional analysis that allows for finkishness fails to capture the *normative* weight of virtue.
  2.  **The Problem of the Basis:** The RCA requires us to identify the "intrinsic basis" of the virtue. In humans, this basis is psychological and often opaque (as seen in the Tom case). If we cannot independently identify the basis without referencing the manifestation, the analysis becomes circular.

  **Conclusion:**
  Cases like Tom's suggest that virtues cannot be analyzed *purely* conditionally (in terms of inputs and outputs). They require a **causal basis clause**. We must say: *S is courageous iff S has an internal state X, and X would cause action A in circumstance C, absent masks.* But since identifying X often requires knowing if S is courageous, the conditional analysis struggles to be reductive. It implies that virtue is a primitive property of the agent's psychology, not merely a summary of their counterfactual behaviors. Your intuition in the car was closer to the Aristotelian view: the disposition (the *hexis*) is the real thing; the action is just its shadow, which can be blocked without destroying the object casting it.
