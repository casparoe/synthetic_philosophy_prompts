  **Justifications**

  (1) **Owen:** This is a textbook-accurate summary of Kim's exclusion dilemma, correctly identifying the tension between causal closure, sufficiency, and non-identity.
  (2) **Nadia:** She correctly deploys Stephen Yablo's proportionality constraint, a standard and robust counter-argument that distinguishes determinable mental causes from determinate physical realizers.
  (3) **Owen:** While distinguishing causation from explanation is a valid reductionist maneuver, it begs the question against difference-making accounts of causation that Nadia is about to invoke.
  (4) **Nadia:** This accurately applies Woodward's interventionist framework, which is currently the leading formal defense of non-reductive physicalism against exclusion.
  (5) **Owen:** This raises the serious "Baumgartner objection" regarding interventions on supervenient properties, but it assumes a constraint on valid interventions that interventionists explicitly reject.

  **Adjudication**

  Owen's closing move does **not** settle the matter against non-reductive physicalism. Nadia has a strong comeback available via **variable selection**: interventionists argue that when modeling mental causation, the physical realizer should not be treated as a confounding variable to be "held fixed," but rather as part of the background conditions or the mechanism through which the intervention operates. By defining the causal model such that the mental variable is independently fixable *for the purposes of the model*, Nadia can maintain that intervening on the mental (via its realizer) still demonstrates the mental property's specific causal relevance, preserving non-reductive physicalism without violating physical closure. Both debaters missed the opportunity to explicitly clarify that their disagreement ultimately rests on competing metaphysics of causation (production vs. difference-making) rather than empirical facts.
