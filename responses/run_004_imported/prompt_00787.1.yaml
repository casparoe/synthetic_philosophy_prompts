prompt: |-
  I'm taking an upper-level seminar this semester on Hobbes's natural and civil philosophy, and this week's reading pulled us out of Leviathan and into some of his more technical writings on mathematics and method, including the Epistle Dedicatory to Six Lessons to the Professors of the Mathematiques (1656) — his polemical response to John Wallis and Seth Ward, the Savilian professors at Oxford who had challenged his work in mathematics and natural philosophy. I brought the following passage up in office hours, but my professor only had time to mention "maker's knowledge" as a label before rushing off to a meeting, and none of the secondary readings on our syllabus actually gloss it. I was hoping you could help me reconstruct the argument properly:

  "Of arts, some are demonstrable, others indemonstrable; and demonstrable are those the construction of the subject whereof is in the power of the artist himself, who, in his demonstration, does no more but deduce the consequences of his own operation. The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same; and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for. Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves; and civil philosophy is demonstrable, because we make the commonwealth ourselves. But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be." (English Works, vol. VII, p. 184)

  What I'd like is less a paraphrase than an actual reconstruction of the reasoning. First, what precisely is doing the epistemic work here: is Hobbes saying that geometrical certainty comes from the fact that lines and figures are our own constructions, as opposed to, say, the self-evidence of axioms or the validity of the inferences drawn from them? Second, how is this supposed to license treating civil philosophy as equally "demonstrable" — a commonwealth seems like a far messier, more historically contingent object than a triangle, so what exactly is being preserved when Hobbes says "we make" it in the relevant sense? And finally, given the closing sentence about natural bodies, does the passage commit Hobbes to a genuinely different and weaker notion of scientific knowledge in physics than in geometry and politics, or is this just the standard early modern worry about underdetermination dressed up in his own vocabulary? I'd also appreciate it if you could flag any point where this seems to sit in tension with his broader materialism, since that's the piece I find hardest to square.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Upper-level seminar on Hobbes (Natural and Civil Philosophy).
      *   **Text:** *Epistle Dedicatory to Six Lessons to the Professors of the Mathematiques* (1656).
      *   **Passage:** A specific quote distinguishing "demonstrable" vs. "indemonstrable" arts based on who constructs the subject (artist vs. nature).
      *   **Professor's Hint:** "Maker's knowledge."
      *   **Task:** Reconstruct the argument (not just paraphrase).
      *   **Specific Questions:**
          1.  What does the epistemic work? (Construction vs. axioms/inference?)
          2.  How does this license civil philosophy as demonstrable? (Analogy between geometry and commonwealth?)
          3.  Does this commit Hobbes to a weaker physics? (Underdetermination vs. distinct epistemology?)
          4.  Tension with materialism? (How does "making" fit with a materialist ontology?)

  2.  **Deconstruct the Passage (The "Maker's Knowledge" Thesis):**
      *   *Premise 1:* Science/Demonstration requires knowledge of causes (generation/construction).
      *   *Premise 2:* We only truly know causes if we generate/construct the subject ourselves.
      *   *Observation 1:* In Geometry, we draw the lines/figures. -> Therefore, Geometry is demonstrable.
      *   *Observation 2:* In Civil Philosophy, we make the commonwealth (via covenant/sovereign). -> Therefore, Civil Philosophy is demonstrable.
      *   *Observation 3:* In Natural Philosophy (Physics), nature makes the bodies, not us. We only see effects. -> Therefore, Natural Philosophy is *not* demonstrable (only hypothetical: "what they *may* be").

  3.  **Address Question 1: The Source of Epistemic Certainty:**
      *   *Standard View:* Certainty comes from logical deduction from self-evident axioms.
      *   *Hobbes's View (in this passage):* Certainty comes from *causal knowledge*. We know *why* a triangle has properties because we *made* the triangle according to a definition.
      *   *Key Concept:* *Verum factum* (the true is the made). Though Vico is usually associated with this phrase, the concept is Hobbesian here.
      *   *Nuance:* It's not just that we draw them, but that the definition *is* the command to construct. The truth is internal to the act of generation.

  4.  **Address Question 2: Civil Philosophy as Demonstrable:**
      *   *The Problem:* Commonwealths seem messy/historical. Triangles seem eternal/abstract.
      *   *Hobbes's Move:* He isn't talking about *existing* historical commonwealths (Athens, Rome). He is talking about the *concept* of the Commonwealth generated by the Social Contract.
      *   *The "Making":* The Covenant. We (the multitude) artificially construct the Sovereign.
      *   *Preservation:* What is preserved is the *causal chain*. Just as I know the properties of a circle because I defined it as "locus of points equidistant...", I know the rights/obligations of the Sovereign because I (rationally) constructed the Commonwealth via the covenant to achieve peace.
      *   *Normative vs. Descriptive:* It makes civil philosophy normative/engineering rather than empirical history.

  5.  **Address Question 3: Natural Philosophy (Physics) and Underdetermination:**
      *   *The Claim:* Physics is "indemonstrable."
      *   *Meaning:* We cannot know the *true* necessary causes, only *possible* causes that fit the phenomena.
      *   *Is it weaker?* Yes, strictly speaking. It yields "hypotheses" rather than "truths."
      *   *Underdetermination:* Yes, this is an early version of underdetermination of theory by data. Multiple causal stories can explain the same motion.
      *   *Hobbes's Ambition:* Despite this, Hobbes *tried* to make physics demonstrative (e.g., *De Corpore*). This passage is polemical (against Wallis), so he might be sharpening the distinction to defend his geometry/politics while conceding ground on physics (or perhaps claiming his physics *does* find the true causes where others don't). But strictly reading this text: Physics is hypothetical.

  6.  **Address Question 4: Tension with Materialism:**
      *   *Materialism:* Everything is body in motion. Mind, State, God (if he exists) are material or names for material processes.
      *   *Tension:* If everything is matter in motion, why is the "making" of a triangle epistemically different from the "making" of a stone by nature? Both are matter in motion.
      *   *Resolution:* The distinction is *epistemological*, not *ontological*. Ontologically, a drawn circle and a planetary orbit are both bodies in motion. Epistemologically, I have access to the *generative recipe* of the circle (my mind's command to my hand) but not the planet.
      *   *Nominalism:* Hobbes is a nominalist. Definitions are names we impose. In geometry/politics, we impose the names/definitions that create the object. In physics, nature imposes the objects, and we struggle to name them correctly.

  7.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the "Maker's Knowledge" principle (*verum factum*). Set the stage (anti-Aristotelian, anti-empiricist in the strict sense).
      *   **Section 1: The Epistemic Engine (Causality vs. Logic).** Explain that for Hobbes, reasoning is computation, but computation needs premises. Premises are secure only if we know the cause. We know the cause if we made it. Contrast with Euclidean axioms.
      *   **Section 2: The Civil/Geometric Analogy.** Address the "messiness" objection. Distinguish *de facto* states from *de jure* Commonwealths. The "making" is the Covenant. It's a rational reconstruction, not a historical claim.
      *   **Section 3: The Status of Physics.** Confirm the "weaker" status. Explain "what they *may* be." Connect to underdetermination. Note the tension with *De Corpore* (Hobbes wanted physics to be certain, but this passage admits limits).
      *   **Section 4: The Materialism Tension.** Crucial section. Ontological monism vs. Epistemological dualism. The role of language/names.
      *   **Conclusion:** Summarize the reconstruction.

  8.  **Refine the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Did I emphasize the polemical context? *Correction:* Mention Wallis. Wallis attacked Hobbes's math. Hobbes retorts: "I know math because I make it; you professors treat it like natural philosophy (empirical/contingent)."
      *   *Check:* Is "Maker's Knowledge" accurate? *Yes,* but ensure I don't attribute Vico's later theological version to Hobbes. For Hobbes, it's about *causal generation*.
      *   *Check:* Materialism tension. *Refinement:* Make sure to highlight that for Hobbes, "making" isn't creation ex nihilo. It's rearrangement of matter. The "knowledge" comes from knowing the rearrangement plan.

  9.  **Drafting the Response:** (Mental or scratchpad)
      *   Start with the core syllogism.
      *   Tackle the Geometry point: It's not about the ink on paper, it's about the universal idea generated by definition.
      *   Tackle the Politics point: The Sovereign is an "Artificial Man." We build him. Therefore we know his rights.
      *   Tackle Physics: We can't get inside God/Nature's head. So we guess causes.
      *   Tackle Materialism: The world is one thing (matter), but our access to it varies based on agency.

  10. **Final Polish:** Ensure tone is appropriate for an upper-level seminar student (rigorous, text-focused, engaging with secondary literature concepts like *verum factum* and nominalism). (Proceed to generate output based on these thoughts.)
answer: |-
  This is a superb passage for getting at the core of Hobbes's epistemology, and your professor's hint ("maker's knowledge") points directly to the principle often summarized by the later Viconian phrase *verum ipsum factum* ("the true is the made"). However, Hobbes's version is more mechanistic and less theological than Vico's.

  Here is a reconstruction of the argument, broken down by your specific questions, keeping in mind the polemical context against Wallis (who treated mathematics as a mixed science relying on empirical verification) and Hobbes's broader materialist system.

  ### 1. The Epistemic Engine: Causality vs. Logical Validity

  You asked whether the certainty comes from construction or from axioms/inference. In this passage, Hobbes is explicitly prioritizing **causal knowledge over logical coherence.**

  For Hobbes, "reasoning" is computation (adding and subtracting names/concepts). You can compute validly from false premises. Therefore, logical validity alone does not yield *scientia* (scientific knowledge). *Scientia* requires knowing the **cause**.

  *   **The Syllogism:**
      1.  To demonstrate a truth about $X$, one must know the cause/generation of $X$.
      2.  One can only know the cause of $X$ with certainty if one has generated $X$ (since the generator knows the recipe of generation).
      3.  In geometry, the mathematician generates the figures (via definition/construction).
      4.  Therefore, geometry is demonstrable.

  **The Epistemic Work:** The work is being done by **agency**, not self-evidence. Hobbes is an anti-realist about mathematical objects. A circle does not exist in nature; it exists because a human mind commanded a hand (or a mind) to trace a path equidistant from a center. Because the definition of a circle *is* the command for its construction, the properties of the circle are nothing other than the necessary consequences of that construction.

  If you treat geometry like natural philosophy (as Hobbes accuses Wallis of doing), you are measuring physical drawings and finding them imperfect. For Hobbes, the truth lies in the *universal* generated by the definition, not the particular ink on the page. We know the truth because we prescribed the conditions of its existence.

  ### 2. The Civil/Geometric Analogy: What is "Made"?

  This is the most controversial leap in the passage. You rightly note that commonwealths seem historically contingent and messy, unlike triangles. Hobbes bridges this gap through **Nominalism** and **Artificiality.**

  *   **The Object of Study:** Hobbes is not claiming demonstrative knowledge of *historical* regimes (e.g., why Rome fell). That would be natural philosophy (studying effects to guess causes). He is claiming demonstrative knowledge of the *Commonwealth as such* (the *civitas*).
  *   **The "Making":** Just as a geometer constructs a triangle by defining lines, the citizens construct a Commonwealth by defining the **Covenant**.
      *   In Geometry: "Let a circle be..." (I impose a definition that generates the object).
      *   In Politics: "I authorize this Sovereign..." (I impose a will that generates the Sovereign).
  *   **What is Preserved:** What is preserved is the **logic of authorization.** Because the Sovereign's rights are derived entirely from the transfer of right enacted by the subjects, the Sovereign is an "Artificial Man" whose soul is Sovereignty and whose voice is the Law. Since we (the multitude) are the authors of this Artificial Man, we know his rights and obligations with the same certainty that a geometer knows the properties of a square.

  **The Reconstruction:**
  1.  The Commonwealth is not a natural growth (like a family or a hive); it is an artifact.
  2.  The "matter" is men; the "maker" is the covenanting multitude.
  3.  Because we know the specific causal mechanism that brings the Commonwealth into being (the mutual transfer of right), we can deduce the necessary consequences of that existence (e.g., the Sovereign cannot be unjust, because he is the author of the law).
  4.  Therefore, Civil Philosophy is demonstrable.

  This makes politics a branch of **engineering**, not history. If actual commonwealths fail, it is not because the *science* is wrong, but because the *construction* was flawed (like a badly drawn circle).

  ### 3. Natural Philosophy: Underdetermination or Weaker Science?

  The closing sentence commits Hobbes to a genuinely **weaker notion of scientific knowledge in physics.** This is not just standard underdetermination; it is a structural limitation on human epistemology.

  *   **The Limitation:** In physics, the "generator" is Nature (or God). We do not have access to Nature's "recipe." We see the motion (the effect) but cannot perceive the immediate causal mechanism with certainty.
  *   **"What they may be":** Hobbes is saying that in physics, we can only offer **hypotheses**. If hypothesis $A$ explains the phenomena, and hypothesis $B$ explains the phenomena equally well, we cannot demonstrate which is *true*, only that they are *possible*.
  *   **Tension with *De Corpore*:** This creates a famous tension in Hobbes's corpus. In *De Corpore* (On Body), Hobbes attempts to deduce physics from first principles of matter and motion, seemingly claiming demonstrative certainty.
      *   *Reconciliation:* Scholars often argue that Hobbes treats the *general principles* of motion (kinematics) as demonstrable (because they are definitions we stipulate), but the *specific explanations* of natural phenomena (e.g., why magnetism works) remain hypothetical.
      *   *Polemical Context:* In the *Six Lessons*, Hobbes is fighting Wallis. He may be sharpening the distinction to protect his Geometry and Politics from the criticisms leveled at his Physics. He is essentially saying: "You can attack my physics as hypothetical, but you cannot attack my geometry or politics, because I made those objects."

  So, yes, physics is epistemologically inferior to geometry and politics in this schema. It yields "belief" or "opinion" based on coherence with phenomena, rather than "science" based on causal generation.

  ### 4. The Tension with Materialism

  This is the sharpest philosophical difficulty you identified. If Hobbes is a materialist (everything is body in motion), why is there an epistemic divide between a "made" triangle and a "natural" stone? Ontologically, both are just matter in motion.

  **The Resolution: Epistemological Dualism within Ontological Monism.**

  Hobbes resolves this through his theory of **Names and Definitions.**

  1.  **Ontology:** Yes, a triangle drawn in sand and a crystal forming in the earth are both configurations of matter.
  2.  **Epistemology:** Knowledge for Hobbes is not a mirror of nature; it is a manipulation of **names**.
      *   In **Geometry/Politics**, the definitions precede the existence of the object. We decide what "Justice" or "Circle" means, and then we instantiate it. The truth is internal to our linguistic/conceptual stipulation.
      *   In **Physics**, the object exists prior to our definition. We must try to match our names to the external thing. Since we cannot see the "inner motion" of the thing, we cannot be sure our names (causes) match the reality.

  **The Tension Point:** The tension lies in the status of the **Mind** that does the "making."
  *   If the mind is just matter in motion (as Hobbes's materialism suggests), then the "construction" of a triangle is just a physical event in the brain causing a physical event in the hand.
  *   Why should *that* physical event grant epistemic privilege over the physical event of a stone forming?
  *   **Hobbes's Implicit Answer:** It isn't the *physical act* of drawing that grants certainty; it is the **universal reasoning** behind it. When I define a circle, I am reasoning about a universal concept, not a particular piece of chalk. Because I control the definition of the universal, I control the truth. In physics, I do not control the universals of nature; I only observe their particulars.

  However, many critics (like Bramhall and later Leibniz) argued this is inconsistent. If thoughts are motions, they are just as "natural" and opaque as the motion of a stone. Hobbes tries to square this by treating reasoning as a **linguistic technology**. We have access to the "code" of geometry and politics because we wrote the code. We do not have the source code for nature.

  ### Summary Reconstruction

  To bring this back to your seminar discussion, you can reconstruct the argument as follows:

  1.  **Criterion of Science:** Scientific demonstration requires knowledge of causes.
  2.  **Criterion of Causal Knowledge:** Certain causal knowledge is only possible when the knower is the generator of the object (The Maker's Knowledge Thesis).
  3.  **Application to Geometry:** We generate geometric figures via definition/construction; therefore, Geometry is a science.
  4.  **Application to Politics:** We generate the Commonwealth via Covenant/Authorization; therefore, Civil Philosophy is a science. (This treats the State as an artifact, not an organism).
  5.  **Application to Physics:** Nature generates natural bodies; we only observe effects; therefore, Physics is hypothetical (knowledge of "what may be," not "what is").
  6.  **Materialist Constraint:** This distinction is not ontological (all are bodies) but epistemological (based on access to generative definitions via language).

  **Critical Discussion Point:** You might ask your seminar whether this "Maker's Knowledge" thesis saves Hobbes's politics from empiricism at the cost of making it **tautological**. If we know the Commonwealth only because we defined it, does *Leviathan* tell us how states *actually* work, or only how they *must* work if they are to be called Commonwealths by Hobbes's definition? This is the classic "normative vs. descriptive" tension in Hobbes scholarship, rooted directly in this passage.
