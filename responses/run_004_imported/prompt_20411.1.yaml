answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm [Your Name], and I've had the privilege of calling [Honoree] a colleague for [Number] years. But looking around this room, I see the real measure of her career. I see decades of students, now colleagues themselves. I see family who have supported her through sabbaticals, tenure reviews, and the occasional existential crisis about moral realism.

  Forty years. That is an extraordinary span of time to spend in a single classroom. For four decades, [Honoree] has stood at the front of a lecture hall and asked a very simple, very disturbing question: "There is a trolley coming down the track. What do you do?"

  She has sent thousands of students home with that image in their heads. She has forced generations of undergraduates to argue with their dates about utilitarianism. She has made the Doctrine of Double Effect a dinner table topic in households that previously only debated politics or sports.

  But those of us who know her best know that her career wasn't just about teaching the trolley problem. It was about riding it.

  About ten years ago, [Honoree] did something rare. In a field where people often dig in their heels as they get senior, she did what Judith Jarvis Thomson did in "Turning the Trolley." She stood up, after twenty years of teaching one position, and announced that she no longer believed the bystander may flip the switch.

  Now, I know we have two distinct groups in this room, and I want to address the difference carefully.

  To the former grad students here: You know exactly what that move cost. You know that wasn't just a "change of mind." You know that by withdrawing permission to flip the switch, she didn't just update a syllabus; she removed the load-bearing intuition that the entire bystander/footbridge literature was resting on. You watched her dismantle a framework she helped build, purely because the argument demanded it. It was intellectually terrifying. It was beautiful.

  To her husband and her sister: You remember 2014 differently. You don't remember the load-bearing intuition of the bystander case. You remember the load-bearing tension in the dining room. You remember that for about eighteen months, the only thing being served at Christmas was nuance, and it was cold.

  And this brings me to the one joke I promise to make tonight. It's about that reversal.

  [Honoree] spent forty years teaching us the Doctrine of Double Effect. She taught us that there is a moral difference between an intended means and a foreseen but unintended side effect. And I think that doctrine perfectly explains the fallout of her big reversal.

  Because, looking back, we can see that her *intended means* was rigorous intellectual honesty. She wanted to follow the argument where it led, regardless of her own past publications. But I think we can all agree that the *foreseen but unintended side effect* was making her brother-in-law refuse to make eye contact over the ham for three consecutive holidays.

  (Laughter)

  In all seriousness, that story captures exactly who she is. She cares more about the truth than she cares about being consistent. She cares more about the integrity of the argument than the comfort of the room. That is what made her a formidable philosopher, and I suspect, that is also what made her a formidable friend.

  Most people retire to stop working. But I have a feeling [Honoree] isn't retiring to stop thinking. She's retiring to stop worrying about whether she is morally responsible for the train. She's retiring to let the trolley come to a rest, so she can finally get off the tracks and enjoy the view.

  [Honoree], you have spent forty years asking us to make hard choices. You have asked us to weigh lives, to measure intentions, and to calculate consequences. Tonight, the calculation is easy. There are no trade-offs. There are no hidden variables. We all love you, we all admire you, and we are all so grateful that you decided to flip the switch on your career while you still had the energy to enjoy the stop.

  So, if everyone could please raise a glass.

  To [Honoree]. May your retirement be free of dilemmas, free of obligations, and may the only thing running down your track from now on be a leisurely train ride to somewhere beautiful.

  Cheers.
