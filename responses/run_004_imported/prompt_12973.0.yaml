answer: |-
  This is a fantastic topic for a seminar handout. It cuts to the heart of the difference between **decision theory** (single agent against nature) and **game theory/general equilibrium** (agents interacting where payoffs depend on mutual knowledge).

  To answer your question directly: **Good's Theorem is mathematically sound within its axioms, but Hirshleifer's scenario violates a background assumption that Good treats as implicit.**

  The specific assumption in Good's proof that Hirshleifer's scenario violates is the **Invariance of the Feasible Set (and Payoff Function) with respect to the Information Partition.**

  Here is the breakdown you can use for your handout.

  ### 1. The Core Conflict
  *   **Good's Theorem:** In a fixed decision problem, acquiring free evidence allows you to condition your action on the state of the world. Since you can always ignore the evidence and act as you would have anyway, the expected utility of having the evidence must be at least as high as not having it.
  *   **Hirshleifer Effect:** In a market setting, the *availability* of certain actions (specifically, risk-pooling contracts) depends on the information structure itself. Public information can collapse the set of feasible contracts, removing the very option that provided high expected utility.

  ### 2. The Violated Assumption
  Good's proof relies on the assumption that **the consequences of an act depend only on the act and the state of the world, not on the agent's information partition.**

  Formally, Good assumes a utility function $U(a, \omega)$ and a set of acts $A$ that are **exogenous** to the information signal $E$. The signal updates your probability distribution $P(\omega) \to P(\omega|E)$, but it does not change $A$ or $U$.

  Hirshleifer's scenario violates this. In his model, the utility/consequence of the act "purchase insurance" is not $U(\text{insure}, \text{sick})$. It is effectively $U(\text{insure}, \text{sick}, \text{information structure})$.
  *   **Without the signal:** The act "purchase pooled insurance" is feasible and has positive expected utility.
  *   **With the signal:** The act "purchase pooled insurance" is **removed from the feasible set** (or its price adjusts so drastically that it is effectively a different act with lower utility).

  ### 3. Why This Assumption Was "Doing the Work"
  Good's theorem is essentially an application of **Jensen's Inequality** to the maximum operator. The logic flows like this:

  1.  Let $V(E)$ be the value of the decision problem given evidence $E$.
  2.  $V(E) = \max_{a \in A} \mathbb{E}[U(a, \omega) | E]$.
  3.  The value of the information is $\mathbb{E}[V(E)] - \max_{a \in A} \mathbb{E}[U(a, \omega)]$.
  4.  Because the $\max$ function is convex, $\mathbb{E}[\max_{a} (\dots)] \ge \max_{a} \mathbb{E}[(\dots)]$.

  **The Work:** This inequality holds *only if* the set $A$ and the function $U$ remain constant across the expectation.
  *   In Good's proof, you are comparing $\mathbb{E}[\max_{a \in A} \dots]$ against $\max_{a \in A} \mathbb{E}[\dots]$. The $A$ is the same on both sides.
  *   In Hirshleifer's scenario, the information signal changes the $A$. You are comparing $\mathbb{E}[\max_{a \in A_{\text{informed}}} \dots]$ against $\max_{a \in A_{\text{uninformed}}} \dots$.
  *   If $A_{\text{informed}} \subset A_{\text{uninformed}}$ (because risk-pooling options vanish when uncertainty is resolved), the convexity argument fails. The "option value" of being able to choose the best act is outweighed by the "loss of options" caused by the information arriving.

  ### 4. Seminar Takeaway
  For your students, the distinction can be summarized as **Instrumental Value vs. Structural Value**.

  *   **Good** proves information has non-negative *instrumental* value: it helps you map existing options to states more accurately.
  *   **Hirshleifer** shows information can have negative *structural* value: it alters the environment (the market equilibrium) in a way that deletes high-value options.

  Good's theorem assumes the "rules of the game" are fixed. Hirshleifer shows that in social/economic contexts, information *changes the rules*. If your handout emphasizes that Good's theorem applies to **parametric** decision problems (against nature) while Hirshleifer applies to **strategic** decision problems (equilibrium settings), you will have pinned down the exact boundary condition.
