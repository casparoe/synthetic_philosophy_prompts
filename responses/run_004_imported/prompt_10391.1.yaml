      *   **Speed of Adaptation:** The core thesis of "Can We Survive Technology" is that social adaptation lags behind technical capability. AI widens this gap.
      *   **Game Theory:** AI changes the payoff matrix of conflict. First-strike stability (like nukes) might be undermined if AI enables decapitation strikes or cyber warfare that is too fast for humans to manage.
