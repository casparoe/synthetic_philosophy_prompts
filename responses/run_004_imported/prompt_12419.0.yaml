answer: |-
  Welcome to the dark side. It is a very common reaction for someone with a background in physics to read David Lewis's *On the Plurality of Worlds* and think, "Ah, he's just doing metaphysics for the Many-Worlds Interpretation (MWI) or eternal inflation."

  It is an intuitive leap, but as you dive deeper, you'll find that the gap between Lewisian Modal Realism and the Physical Multiverse is actually a chasm. If philosophers aren't just waiting for physicists to settle the matter, it's because physics fundamentally lacks the tools to answer the specific question Lewis is asking.

  Here is the breakdown of why Lewis isn't talking about quantum branching, and why physics can't settle the debate.

  ### 1. Nomological vs. Metaphysical Possibility
  This is the single biggest distinction.
  *   **The Physical Multiverse (MWI/Inflation):** This deals with **nomological possibility**. These are worlds consistent with the fundamental laws of physics (the Hamiltonian, the inflationary potential, etc.). In MWI, every branch obeys the Schrödinger equation. In eternal inflation, every bubble universe obeys the underlying field theory.
  *   **Lewis's Modal Realism:** This deals with **metaphysical (or logical) possibility**. Lewis claims that *any* world that can be coherently described exists.

  For Lewis, there is a concrete world where the speed of light is 10 m/s. There is a concrete world where gravity is repulsive. There is arguably a concrete world where magic works, provided the concept of "magic" in that world is internally consistent.

  Physics can never validate or invalidate those worlds because physics is the study of the laws of *our* world (or the meta-laws governing our multiverse). Physics can tell you what is possible *given* the Standard Model. It cannot tell you if there is a concrete reality where the Standard Model simply doesn't apply. Lewis's space of worlds is vastly larger than the Hilbert space of our universe.

  ### 2. Causal Isolation vs. Common Origin
  In physical multiverse theories, the "other" universes usually share a causal history or a structural relationship with ours.
  *   **MWI:** Branches decohere from a single universal wavefunction. They are parts of a single mathematical object.
  *   **Inflation:** Bubble universes nucleate from a common inflaton field. They might even collide (leaving scars on the CMB).

  For Lewis, possible worlds are **spatiotemporally isolated**. There is no causal connection, no shared spacetime manifold, and no common wavefunction between our world and any other. You cannot travel to them, signal them, or derive them from our initial conditions.

  If a physicist claims MWI is real, they are claiming that the *entirety* of physical reality is one big branching structure. Lewis is claiming that the branching structure is just *one world* (ours), and there are infinitely many other structures completely unrelated to it.

  ### 3. The "Actual" Indexical
  Lewis makes a provocative claim: "Actual" is an indexical term, like "here" or "now." When I say "the actual world," I just mean "the world I am in." An observer in another possible world calls their world "actual."

  In physics, even in MWI, we usually treat the whole wavefunction as the "real" object, and the branches as components. For Lewis, the worlds are individuals. They are not components of a larger "Hyper-Universe." They are distinct ontological primitives.

  This matters because physics seeks a unified theory of *everything that exists*. Lewis is saying there is no unified theory of everything, because "everything" includes causally disconnected realms with different laws that cannot be unified under one mathematical framework.

  ### 4. Why Physics Can't Settle the Matter
  You asked why we don't just wait for physics to decide if branching is real. The problem is that **empirical science is limited to the actual world's causal network.**

  To prove Lewis wrong, you would need to prove that there *are no* causally isolated concrete worlds where gravity is repulsive. But since they are causally isolated by definition, no experiment in *this* world can detect them.
  To prove Lewis right, you would need to detect one. But if you detect it, it's causally connected to you, which means by Lewis's definition, it's part of *our* world, not a separate possible world.

  Lewis's theory is **empirically inert**. It is designed to be. It is a metaphysical framework intended to make sense of language and logic, not a cosmological model intended to predict particle masses. Physics can tell us about the structure of *this* world (and its physical siblings), but it cannot tell us about the ontology of *possibility* itself.

  ### 5. What Work is the Theory Doing?
  Finally, philosophers debate this because Lewis isn't primarily trying to describe cosmology; he's trying to solve problems in **semantics and properties**.

  Lewis wants to analyze counterfactuals: *"If I had dropped this cup, it would have broken."*
  *   **Physicist:** "Well, in the branch where you dropped it, it broke." (MWI)
  *   **Lewisian:** "In the nearest possible world where you drop it, it breaks."

  Lewis offers a reductive analysis of modality. He wants to reduce "possibility" to "existence." He thinks it's cleaner to say "There exists a world where X happens" than to posit a mysterious property of "possibility" that attaches to propositions.

  Physicists generally don't care about the truth conditions of counterfactual statements. Philosophers do. If MWI turns out to be false, Lewis doesn't care. His theory doesn't rely on quantum mechanics. It relies on the utility of treating possible worlds as concrete individuals to make sense of logic, probability, and properties.

  ### Summary
  You are reading Lewis as a **cosmologist**, but he is writing as a **logician**.

  *   **Physics Multiverse:** "All solutions to the equations exist."
  *   **Lewisian Multiverse:** "All coherent stories exist."

  Philosophers continue to debate it because it's a claim about the nature of reality that is strictly outside the bounds of empirical verification. It's a classic metaphysical stance: is the realm of possibility "out there" (Realism), or is it a construct of our language/mind (Ersatzism/Actualism)?

  Since you come from condensed matter, think of it like this: Physics studies the ground state and excitations of *this* vacuum. Lewis is making a claim about the landscape of *all possible Lagrangians*, and asserting that every single one of them is instantiated somewhere. No collider is going to test that.

  Enjoy the ride. Lewis is a thrill, but keep your logical guard up; he argues like a physicist but posits like a mystic.
