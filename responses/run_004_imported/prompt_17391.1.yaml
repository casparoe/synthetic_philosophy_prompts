          *   *Souls (Ames):* Animals. Have memory, feeling, distinct perception.
          *   *Spirits (Esprits):* Humans. Have apperception (consciousness of perception), reason, knowledge of necessary truths, moral identity.
      *   *City of God:* A moral kingdom of spirits under God. Only spirits are members.
      *   *Pre-established Harmony:* Mind and body don't interact; they run in parallel synchronized by God.

  3.  **Address Specific Prompt Points:**

      *   **(a) Natural vs. Artificial Machines & The Dominant Monad:**
