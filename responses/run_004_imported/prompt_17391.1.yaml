      *   **Specific Requirements:**
          *   (a) Address the distinction between natural machines (organized to infinity) vs. artificial machines (inert parts) and implications for a dominant monad.
          *   (b) Address the hierarchy (bare monads -> souls -> spirits), specifically apperception/reason and the "City of God."
          *   (c) Address whether "artificial" changes meaning if software modifies its own weights (learning).
