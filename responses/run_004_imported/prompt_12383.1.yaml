      *   **The Two Camps:**
          *   *Doxastic (Belief):* Hinges are propositions we believe with maximum certainty. (e.g., "I have hands").
          *   *Non-Doxastic (Rule/Action):* Hinges are grammatical rules disguised as empirical propositions. They govern the game, they aren't moves *in* the game.
      *   **Why It Matters (The Stakes):** This is the crucial part.
