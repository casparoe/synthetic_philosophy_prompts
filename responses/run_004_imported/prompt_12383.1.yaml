      *   *Doxastic View (Belief):* Hinges are beliefs, just super-justified or foundational beliefs. They are propositional attitudes.
      *   *Non-Doxastic View (Rule/Action):* Hinges aren't beliefs *about* the world; they are rules *for* investigating the world. They are enacted, not stated.
