answer: |-
  **The Event Horizon of Computation: On Malament-Hogarth Spacetimes and the Physical Church-Turing Thesis**

  Your writers group is reacting to a genuine tension in the foundations of physics, but they are conflating two distinct claims that share a name. To determine whether your protagonist's device is "magic," "impossible," or "groundbreaking," we must disentangle the *Mathematical* Church-Turing Thesis (MCTT) from the *Physical* Church-Turing Thesis (PCTT).

  The short verdict is this: Your device is **not incoherent**, it **does violate the Physical Church-Turing Thesis**, and it is **physically unstable but not impossible in principle.** Your beta readers are half-right: it does break the standard limits of computation, but that is a feature of the general relativistic universe, not a bug in your plotting.

  Here is the weighing of the three positions you encountered, and why the second one offers the only viable landing spot for hard SF.

  ### 1. The Derivationist Position (Gandy's Constraints)
  *The Claim:* The Church-Turing thesis is effectively a theorem derived from minimal physical assumptions (finite signal speed, finite information density, etc.). Therefore, no physical setup can violate it.

  *The Weighing:* This is the strongest argument for "impossible in principle," but it fails in the context of General Relativity. Robin Gandy's 1980 derivation showed that if space-time is structured in a specific way (essentially, if it adheres to certain locality and causality constraints), then any physical machine is Turing-equivalent. However, Gandy's premises assume a global causal structure that **Malament-Hogarth (MH) spacetimes explicitly violate.**

  An MH spacetime (like the interior of a maximal Kerr black hole) allows a worldline $\gamma_1$ to experience infinite proper time while remaining in the causal past of a point $p$ on worldline $\gamma_2$. This geometry bypasses Gandy's constraints on the relationship between time and causal propagation. To say Gandy forbids your device is like saying Newtonian mechanics forbids time dilation; it forbids it only within the domain where Newtonian assumptions hold. In the extreme gravity of a Kerr metric, Gandy's "theorem" does not apply. This position is too rigid for hard SF that takes General Relativity seriously.

  ### 2. The Empiricist Position (PCTT as Contingent)
  *The Claim:* The Physical Church-Turing Thesis is a claim about *our* universe, not about logic. It states: "Every function physically computable by a machine in our universe is Turing-computable." This is an empirical claim, open to falsification by exotic physics.

  *The Weighing:* This is the correct framework for your novel. The MCTT (about abstract Turing Machines) remains safe; a Turing Machine still cannot solve the Halting Problem. However, the PCTT is a hypothesis about the computational capacity of spacetime itself. If the universe permits MH geometries, and if an observer can survive the journey to utilize them, then the PCTT is false.

  This is not "magic." Magic implies a violation of causal law. Your device uses causal law—specifically the causal structure of a rotating black hole—to outsource the infinite regress. The "computation" isn't happening on the laptop; it's happening in the geometry of the universe. The laptop is merely the receiver of the result. This position treats the thesis as a law of physics akin to thermodynamics: robust in our local neighborhood, but potentially breakable under extreme conditions.

  ### 3. The Semantic Position (Moving the Goalposts)
  *The Claim:* "Computation" is just a human concept. If the device works, we just expand the definition of "computable." There is no violation, only linguistic drift.

  *The Weighing:* This is a philosophical dodge that drains the dramatic stakes from your story. While technically true that definitions evolve, it ignores the hierarchy of complexity. Solving the Halting Problem places the device in a higher complexity class (super-Turing) than any algorithmic process. If you accept this position, you render the distinction between a slide rule and a quantum computer meaningless—they just "compute differently." For the purpose of narrative tension, this is useless. There *is* a difference between checking a proof step-by-step and receiving the result from an infinite future. To call it merely semantic is to ignore the physical cost of that infinity.

  ### The Landing Spot: Stability vs. Possibility

  So, where does this leave your protagonist?

  **1. Is it "Impossible in Principle"?**
  **No.** General Relativity mathematically permits Malament-Hogarth spacetimes. The causal structure exists in the solution to the Einstein Field Equations for a rotating black hole. It is not logically incoherent.

  **2. Is it a "Meaningful Violation"?**
  **Yes.** It violates the *Physical* Church-Turing Thesis. Your beta readers are correct that this breaks the standard rules of what we consider "computable" in our everyday experience. But in hard SF, breaking a contingent physical law is not cheating; it's the plot. The violation is meaningful because it requires access to a region of spacetime that is causally disconnected from our standard experience.

  **3. Is it "Wildly Improbable"?**
  **Yes, and here is your load-bearing snag.** The mathematical existence of MH spacetimes does not guarantee their *physical stability*. This is the real scientific hurdle you should lean into.

  The inner horizon of a Kerr black hole (the Cauchy horizon), where your protagonist receives the infinite signal, is subject to **mass inflation instability**. As the infinite signal from the outside universe approaches the inner horizon, it undergoes infinite blue-shift. In classical GR, this is manageable. In semi-classical gravity (including quantum effects), this infinite energy density likely creates a singularity that destroys the observer before the signal can be read.

  ### Recommendation for the Novel

  Do not retreat from the premise. Instead, pivot the conflict from "Is this allowed?" to "Can the signal survive the noise?"

  Your beta readers are treating the Church-Turing Thesis as a logical absolute. You should treat it as a thermodynamic one. The universe *allows* the calculation, but it charges an energy cost for the information transfer. The "snag" in your plot shouldn't be whether the topology works (it does); it should be whether the blue-shifted radiation at the Cauchy horizon scrambles the message before she can decode it.

  **Final Verdict:** Your device is **wildly improbable but not incoherent.** It relies on the Physical Church-Turing Thesis being false in extreme relativistic environments. This is a legitimate, debated position in the philosophy of physics (championed by figures like István Németi and David Deutsch). It is not magic; it is physics pushed to the point where computation and geometry become indistinguishable.

  Tell your writers group: The thesis isn't broken; the spacetime is just curved enough to bypass it. The cost isn't logical consistency; it's survival.
