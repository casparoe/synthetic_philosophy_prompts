      2.  Round 1 (Instances vs. Process): Alice wins on intuition, Bob on metaphysics.
      3.  Round 2 (Clones): Alice wins hard. This is Bob's weakest point.
      4.  Round 3 (Divergence): Bob recovers, but relies on a fragile premise.
