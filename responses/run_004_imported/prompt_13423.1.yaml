answer: |-
  **Marcus:** The mistake is thinking the obligation floats free of the institution. When you say "I promise," you aren't just expressing an intention; you're making a move in a social game. Like moving a pawn in chess. You can't claim the benefits of the pawn's power while denying the rules that govern its movement. The obligation arises from fairness. We all benefit from a world where promises are kept; it's unfair to accept that benefit while exempting yourself from the cost.

  **Elena:** That reduces morality to a kind of mutual protection racket. The obligation isn't about the "game," Marcus. It's about the person standing in front of you. When I promise, I intentionally lead you to expect that I will do the thing. I give you assurance. To break that promise is to wrong *you*, specifically, by betraying the trust I invited you to place in me. It's interpersonal, not institutional.

  **Marcus:** Interpersonal trust is fragile without the institution. But let's test this. Consider the deathbed case. A man promises his dying friend, alone in a room, to scatter her ashes on a specific hill. She dies moments later. He is the only living witness. If he keeps it, no one knows. If he breaks it, no one knows. The social practice suffers no reputational damage. No one remains to feel the sting of betrayal.

  **Elena:** He is still bound. Absolutely.

  **Marcus:** Why? On my view, this is problematic. The "fair play" argument requires a cooperative scheme. Here, the scheme isn't visibly stressed. If he breaks it, the general utility of promising doesn't dip. A strict conventionalist might say the obligation evaporates with the witness. But I want to say it holds. Why? Because he invoked the rule. To break it is to corrupt his own standing as a participant in the practice, even in secret.

  **Elena:** There it is. You *want* to say it holds, but your theory can't carry the weight. You're borrowing my intuition. On your account, the binding force comes from the risk to the practice. But you just admitted there is no risk. So why does it bind? You're secretly appealing to the wrong done to the friend, not the rule broken.

  **Marcus:** Am I? Or are you ignoring that without the convention, there is no "promise" to break? If I merely say, "I intend to scatter your ashes," I create an expectation. But a promise creates an *obligation*. How does the friend know the difference? Only because we share a convention that imbues those words with normative force. You need my practice to make sense of your assurance.

  **Elena:** I need the *words*, perhaps. But I don't need the *obligation* to come from the words' social utility. Scanlon's Principle F is clear: If I lead you to expect I will do X, and I know you want that assurance, I must do X unless you release me. The friend wanted the assurance that her wish would be honored. He gave it. He wrongs *her* memory, her autonomous will, by disregarding it. The obligation survives her death because the reason for it—her reliance on his word—existed when she was alive.

  **Marcus:** But reliance on what? If there were no social practice of promising, her reliance would be mere hope. You're assuming the practice does the heavy lifting of creating the expectation of *obligation*, and then you claim the moral force comes purely from the psychology of trust. In the secret deathbed case, your theory implies the obligation is robust. Mine implies it's tenuous, dependent on the agent's own commitment to the rules. If he doesn't care about the practice, your theory says he's still wrong. Mine says he's merely inconsistent.

  **Elena:** And that's why your view is cold. If he breaks it, he hasn't just been inconsistent; he's violated a duty owed to another human being. You're worried about the integrity of the institution. I'm worried about the integrity of the relationship.

  **Marcus:** But without the institution, you can't explain why that relationship generates a *duty* rather than just a regret. In the silence of that room, with the practice unobserved and the beneficiary gone, if you feel bound, it's because you've internalized the rule. You've made the convention part of your conscience. So, in the end, even your "interpersonal" duty rests on a conventional foundation.

  **Elena:** Or, Marcus, perhaps the convention is just the vessel. The wine—the actual moral binding—is the human claim one person has on another. You can keep the vessel; I'll keep the wine.
