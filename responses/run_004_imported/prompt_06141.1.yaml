answer: |-
  Here are ten interview questions designed to press on the vulnerabilities of disjunctivism, incorporating your specific requirements regarding causal screening, negative characterization, and epistemological disjunctivism.

  ### 1. The Causal Screening-Off Objection
  **Question:** In my migraine auras, the shimmering arcs feel phenomenologically seamless with ordinary vision. Neuroscience suggests that veridical seeing and vivid hallucinations often share identical proximate cortical mechanisms. If the immediate physical cause in the brain is the same in both the "good case" and the "bad case," doesn't the principle of *same-cause-same-effect* force us to admit a common underlying mental state? How can the distal cause (the actual lamp vs. nothing) metaphysically constitute the experience if the proximate neural cause has already "screened off" that contribution?

  **Follow-up:** You will likely appeal to the distinction between sub-personal neural states and personal-level mental states. But if the sub-personal state is sufficient to produce the phenomenology, doesn't positing an extra metaphysical relation to the object become an explanatorily idle wheel?

  ### 2. The "Negative Characterization" of Hallucination
  **Question:** Disjunctivists often characterize the hallucinatory "bad case" merely as a state that is *indiscriminable* from a veridical perception. Is this an honest ontological account of what is happening during my aura, or is it simply a negative placeholder? When I see the jagged light, there is a positive, vivid qualitative character to the experience; by defining it only by what it *lacks* (a relation to an object), aren't you refusing to explain the very thing that needs explaining?

  **Follow-up:** If you insist that the positive character is *only* available in the good case, does this imply that during the hallucination, I am not truly having a visual experience at all, but merely under the illusion that I am?

  ### 3. Metaphysical vs. Epistemological Disjunctivism
  **Question:** Duncan Pritchard defends *epistemological* disjunctivism, arguing that in the good case, we have factive reasons for belief that are unavailable in the bad case. Is this epistemic view parasitic on your *metaphysical* disjunctivism? Could a philosopher consistently hold Pritchard's view while rejecting Naive Realism, or does the claim that we have better epistemic access in the good case collapse without the metaphysical claim that the world is constitutively part of the mind?

  **Follow-up:** If you argue they are mutually supporting, which one bears the argumentative burden? If the metaphysical view fails to convince, does the epistemological advantage of the good case disappear with it?

  ### 4. The Common Kind Assumption and Science
  **Question:** The "Common Kind Assumption"—that veridical and hallucinatory experiences fall under the same highest psychological kind—is a working hypothesis in empirical psychology. By rejecting it, does disjunctivism force a wedge between philosophical accounts of mind and scientific accounts of the brain? Are you asking us to treat the taxonomy of mental states as immune to empirical revision?

  **Follow-up:** If neuroscience eventually provides a complete causal story of the aura that makes no reference to external objects, will disjunctivism have been falsified, or will it simply retreat to a realm of "normative" description that science cannot touch?

  ### 5. Introspective Indistinguishability
  **Question:** If the metaphysical difference between seeing a lamp and hallucinating one is as radical as you claim—they are fundamentally different *kinds* of states—why is introspection completely blind to this difference? If the good case involves a direct openness to the world and the bad case does not, shouldn't that radical difference in constitution be detectable from the inside?

  **Follow-up:** You might say introspection is limited. But if introspection cannot distinguish the fundamental nature of our own conscious states, how can we rely on it to validate the disjunctivist intuition in the first place?

  ### 6. Causal Efficacy in the Bad Case
  **Question:** When I see a shimmering arc during an aura, I might react with alarm or change my behavior, just as I would if the light were real. If the hallucination is not a mental state with its own intrinsic intentional content, but merely a "failure" of relation, what is doing the causal work? What exactly is triggering my fear if not a positive representational state shared with the veridical case?

  **Follow-up:** If you say the experience itself has causal power despite lacking an object, aren't you conceding that there is an internal property sufficient for causation, which undermines the claim that the external object is constitutive of the state?

  ### 7. The Phenomenology of "Seamlessness"
  **Question:** I described my aura as "phenomenologically seamless" with ordinary seeing until I cognitively registered the error. Disjunctivism suggests that the *nature* of the experience changes entirely when the object is removed. Does this view require us to say that the moment the lamp is removed (or the migraine starts), the *phenomenology* itself shifts, even if I can't tell?

  **Follow-up:** If the phenomenology remains identical to the subject, in what sense is the metaphysical difference relevant to the *experience* of perception, rather than just the post-hoc classification of it?

  ### 8. The Argument from Illusion's Original Motivation
  **Question:** The Argument from Illusion was originally motivated by a desire to unify the explanation of perception: to treat illusions, hallucinations, and veridical cases as data points for a single theory of how the brain constructs reality. By fracturing this unity, isn't disjunctivism sacrificing theoretical simplicity for the sake of saving a pre-theoretical intuition about direct contact with the world?

  **Follow-up:** Is the intuition of "direct contact" robust enough to warrant a metaphysics that makes the science of perception look like it is studying a different category of thing than the philosophy of perception is?

  ### 9. Defective Exercises of Capacity
  **Question:** Some disjunctivists describe hallucination as a "defective exercise" of a perceptual capacity. But in medicine, a defective heartbeat and a healthy heartbeat are still both heartbeats of the same fundamental kind. Why is perceptual failure different? Why is a "defective perception" not still a perception of the same kind as a successful one, just with a different causal history?

  **Follow-up:** If the capacity is the same, doesn't that imply the *state* produced by exercising that capacity must share a common nature, regardless of whether the exercise succeeded in latching onto an object?

  ### 10. Normative Implications for the Sufferer
  **Question:** If veridical perception is the only case where the world is truly "present" to the mind, does this render the hallucinator's experience second-rate or ontologically impoverished? For someone suffering from chronic migraines, does disjunctivism imply that during their episodes, their conscious life is less real or substantial than when they are pain-free?

  **Follow-up:** If you say the experience is not "less real" but just "different," what positive ontological status do you grant the aura? If it's not a relation to the world, and not a representation, what *is* it, other than a philosophical problem?
