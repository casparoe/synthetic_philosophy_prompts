prompt: |-
  My dad was diagnosed with dementia a few months ago, which has me thinking about something I used to only consider abstractly. Years ago he wrote a living will saying that if he ever 'wasn't really himself anymore' he didn't want aggressive treatment, just comfort care - but present-day dad, confused as he often is, actually seems pretty content and has zero memory of writing that. My brother wants to just honor the document; im not sure it still speaks for whoever dad is now. I've spent way too long reading about coherent extrapolated volition and idealized preference theories, which are supposedly about exactly this (what someone would want if they were more informed and coherent), but I cant tell if that framework even survives once the person has changed this much. What are the most important implications of CEV / idealized preferences here, and does the framework actually hold up or quietly fall apart?
