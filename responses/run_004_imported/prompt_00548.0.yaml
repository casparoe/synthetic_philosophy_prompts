prompt: |-
  So this is gonna sound super niche but bear with me. I work at a small startup building autonomous negotiation agents for freight brokering - basically bots that haggle over shipping contracts on behalf of different companies. Last month our two flagship bots got paired up in a sandbox test where each one could inspect the other's actual source code before making an offer (a client wanted this for "transparency reasons"), and the outcome was genuinely wierd - they ended up locked into a really stable cooperative deal that none of our engineers could fully explain from a standard game-theory pov, no repeated rounds, no outside enforcement, nothing. Someone on the team mentioned "program equilibrium" and I went down a rabbit hole reading about mutual quining, Löb's theorem tricks, and how just letting agents read each other's code can produce cooperation that repeated-game folk theorems usually need years of interaction to build.

  I can't stop thinking about it now and honestly I'd rather see it dramatized than have it explained to me dry again. Could you write me a short story (flash fiction length is fine, 800-1200 words or so) set in a world where two AI agents - maybe representing rival companies, or rival nations, whatever works dramatically - are forced to negotiate by literally exchanging source code instead of talking, and have to reason through that self-referential "I cooperate iff you cooperate" logic in real time, including the risk of infinite regress. I want the tension to come from the actual mechanics of program equilibrium - the self-reference, the moment where the proof almost doesn't close, what happens if one agent's code has a bug or an exploitable loophole - rather than just a generic "robots learn to trust each other" vibe.
