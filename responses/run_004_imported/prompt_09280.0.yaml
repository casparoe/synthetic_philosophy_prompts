  - **A paper notebook...**: The canonical "Otto" case; meets all criteria for reliability, access, automatic trust, and prior endorsement perfectly.
  - **Your own biological memory...**: **Does not belong on this list**; this is the internal baseline for cognition, not an *extended* system, though it sets the functional standard.
  - **Your phone's notes app...**: Functionally identical to the notebook but slight friction (unlocking, battery) weakens the "constant availability" criterion slightly.
  - **Turn-by-turn GPS directions**: High trust and access, but fails the endorsement criterion since the route is generated by an algorithm, not stored/verified by you beforehand.
  - **Post-it notes...**: Accessibility is high, but your skepticism ("iffy") introduces scrutiny, breaking the automatic trust required for cognitive coupling.
  - **GitHub Copilot's suggestions...**: Fails endorsement and trust criteria; you must verify every line, making it a collaborative tool rather than a memory store.
  - **Googling something mid-task...**: The paradigmatic counter-example; requires active query formulation and source evaluation, so it remains tool use rather than memory retrieval.
