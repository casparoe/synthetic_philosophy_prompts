      SSA: $P(T2|Rank) = P(Rank|T2)P(T2) / P(Rank)$. $P(Rank|T2)$ is lower if T2 is huge and Rank is low.
      The dialogue needs to reflect this without getting bogged down in math.

      *One nuance:* The prompt asks for the SIA proponent to address "whether there is a principled reason to trust self-locating evidence in one of these cases and not the other." This implies the SSA proponent might try to say "Doomsday is okay, Presumptuous Philosopher is not." Thorne needs to challenge that distinction.

