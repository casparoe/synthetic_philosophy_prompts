answer: |-
  **Setting:** *The Grand Auditorium of the CERN-Alpha Facility, Geneva. Year 2100. A massive particle accelerator hums faintly beneath the floorboards. On stage, the Director of the Cosmological Survey stands before a holographic display showing two equations: Theory T1 (universe contains $10^{24}$ observers) and Theory T2 (universe contains $10^{36}$ observers). The budget for the decisive test is displayed in red: 400 Billion Credits.*

  **Dr. Aris Thorne (SIA Proponent):** [Standing from the third row] Director, with respect, you cannot authorize this expenditure. The decision has already been made.

  **Director:** Dr. Thorne, we are aware of the theoretical parity. That is why we need the test.

  **Thorne:** There is no parity. If you accept the Self-Indication Assumption, the probability of T2 is one trillion times higher than T1, simply because T2 contains one trillion times more observers. To find yourself existing in T1 would be like drawing the single white ball from an urn containing a trillion black balls. We are not white balls. The experiment is a waste of money. Cancel it.

  **Prof. Elias Vance (SSA Proponent):** [Standing from the aisle, voice sharp] That is not epistemology, Aris; it is magic. You are claiming to settle an empirical question about the energy density of the vacuum from the comfort of your chair, solely because you prefer a universe teeming with life.

  **Thorne:** I prefer nothing. I am following the Bayesian update. Your existence is evidence. T2 predicts more instances of "you" existing than T1 does. Ignoring that count is ignoring data.

  **Vance:** It is ignoring the *source* of the data. You are treating your own existence as a random sample from *possible* observers. But you are not a random sample from the set of all possible minds. You are a specific actual observer. If we accept your logic, any theory that postulates infinite observers becomes certain probability one. We could prove the existence of God, or multiverses, or invisible dragons, provided they create enough observers to outweigh the prior. It renders physics obsolete.

  **Thorne:** [Smiling thinly] A dramatic slippery slope, Elias. But let's look at the alternative. You reject SIA because it makes cosmology too easy from the armchair. So you retreat to the Self-Sampling Assumption. You say I should reason as if I am a random sample from the *actual* observers in my reference class.

  **Vance:** Precisely. It grounds the probability in actuality, not possibility.

  **Thorne:** Then you have already lost the moral high ground on "armchair empiricism." If you are a random sample from the actual observers of humanity, you know your birth rank. You are roughly the hundred-billionth human. If humanity survives for millions of years and colonizes the stars, the total number of humans will be in the quadrillions. If that were true, your birth rank of 100 billion would be incredibly anomalous—an early outlier.

  **Vance:** The Doomsday Argument. We know it.

  **Thorne:** You know it, but you dismiss it. But on your own view, it is just as binding as my Presumptuous Philosopher verdict. SSA dictates that you should be highly confident humanity will go extinct soon. Why? Because it is much more likely that you are a random sample from a small population (extinction soon) than a random sample from a huge population (long future). So, Elias, here is the trade: I am willing to bet on cosmology from the armchair. Are you willing to bet on extinction from the armchair? Or is your objection not to armchair reasoning, but simply to *my* conclusions?

  **Vance:** [Pauses, gripping the seat in front of him] The Doomsday Argument is counter-intuitive, I grant you. But it does not force the same absurdity as your Presumptuous Philosopher. Your view allows observer counts to *overwhelm* physical priors. Mine uses observer counts to *adjust* them based on indexical information.

  **Thorne:** That is a distinction without a difference. In both cases, self-locating information is altering your credence in a physical theory without new sensory data.

  **Vance:** No. The difference lies in the Reference Class. You are stuck on the Doomsday Argument because you assume the reference class is "all humans." But that is too coarse. If I narrow the reference class to "observers with my exact epistemic access to the cosmological parameters," the Doomsday inference dissolves. In T1 and T2, there is exactly one "Elias Vance" with my specific data. The ratio cancels out. I am not forced to predict extinction because my reference class is defined by my evidence, not merely my species membership.

  **Thorne:** [Leaning forward] Ah. So you relocate the problem. By narrowing the reference class to "observers with my exact evidence," you escape Doomsday. But does that not just relocate the arbitrariness? Who decides what counts as "exact evidence"? If you define the class narrowly enough to avoid Doomsday, haven't you just gerrymandered the class to avoid the conclusion you dislike? And if you have the power to gerrymander the class to save humanity, why can't I gerrymander the class to include "possible observers" and save the experiment budget?

  **Vance:** Because "possible observers" do not exist! You are sampling from a set of ghosts. My reference class restriction isn't arbitrary; it's epistemic. I can only reason about observers who share my causal context. If I narrow the class, I am acknowledging that I cannot treat myself as a random sample from beings who live in galaxies I will never see, under physical laws I have not yet verified. It relocates the commitment, yes, but it relocates it to a claim about *similarity*, not a claim about *existence*. It forces us to ask: "Who is truly like me?" That is a hard question, but it is better than your answer, which is "Everyone who could possibly exist."

  **Thorne:** But that creates a principled inconsistency. You are happy to use self-locating evidence when it tells you something modest, but you reject it when it tells you something grand. If my existence is evidence for T2 because T2 has more observers, why is my birth rank not evidence for Doomsday because a short future has a higher density of early ranks? You say I can't trust the count of *possible* observers. But SSA relies on the count of *actual* observers. How do you know the count of actual observers without empirical data? You don't. You are making an assumption about the total number of humans to calculate the probability of your birth rank.

  **Vance:** I am using my birth rank to *estimate* the total number. That is a valid statistical inference. Estimating a population size from a serial number is standard statistics.

  **Thorne:** It is standard statistics only if you assume you are a random sample. But why am I a random sample of humans, but not a random sample of *possible* minds? If the principle is "Reason as if you are randomly selected," SIA applies it universally. SSA applies it selectively. You want to have your cake and eat it too: you want to use indexical information to avoid the Presumptuous Philosopher, but you want to discard indexical information to avoid Doomsday.

  **Vance:** I am not discarding it. I am constraining it. The Presumptuous Philosopher scenario implies that if T2 were true, I would be *more likely to exist* than if T1 were true. That is false. I exist in both. The probability of my existence is 1 in both worlds, provided I am actual. SIA conflates the probability of *someone* existing with the probability of *me* existing.

  **Thorne:** But "me" is an indexical. In T2, there are a trillion times more candidates for the index "me." If you refuse to weight by that count, you are asserting that your specific identity is metaphysically privileged independent of the physical structure of the world. That is the real armchair metaphysics, Elias. SIA is humble: it admits I am just one among many. SSA is arrogant: it assumes my perspective is a fixed point around which the universe is arranged.

  **Vance:** And SIA is solipsistic in the opposite direction! It dissolves the individual into a cloud of probability. If we run with your view, we cancel the experiment. We save 400 billion credits. But we establish a precedent that empirical verification is secondary to observer counting. Next year, a biologist will come here and say, "Don't test for disease carriers, the SIA says most observers are healthy, so I am likely healthy." It destroys the link between evidence and theory.

  **Thorne:** No, it strengthens it. It acknowledges that *I am here* is a piece of evidence. You just refuse to weigh it because the result makes you uncomfortable. You fear the Presumptuous Philosopher because it sounds arrogant. I fear the Doomsday Argument because it sounds fatalistic. But we are in the same boat. You want to run the experiment to prove T2 or T1. I am telling you that you have already proved T2. You call that presumption. I call it deduction.

  **Vance:** And I call it a category error. You are treating the size of the universe as a probability weight for your own existence. But the experiment is not about *your* existence. It is about the vacuum energy.

  **Thorne:** And the Doomsday Argument is not about *your* death. It is about the total population. Yet you use your existence to infer it. If self-locating evidence can settle the future of the species, why can it not settle the size of the cosmos? What is the principled boundary, Elias? Where does the self-locating evidence stop counting?

  **Vance:** [Silence for a moment. He looks at the holographic equations, then back to Thorne.] The boundary is causal contact. I can reason about observers I could, in principle, interact with. I cannot reason about observers in a sector of the multiverse causally disconnected from me, whose only link to me is a logical possibility. That is the boundary.

  **Thorne:** Then you admit the Reference Class is restricted by causal access. But in the Doomsday case, the future humans are causally disconnected from me *now*. They do not exist yet. Why am I a random sample of them?

  **Vance:** Because they will be of the same kind. They are future humans.

  **Thorne:** And the T2 observers are the same kind. They are current humans, just elsewhere. You are drawing a line in the sand between "future" and "elsewhere" and calling it principled. I see only a line drawn to protect the budget and the species.

  **Vance:** And I see a line drawn to protect the scientific method from being swallowed by anthropic metaphysics. If you cancel this experiment, Aris, you aren't doing science. You are doing theology with Bayes' Theorem.

  **Thorne:** And if you run it, Elias, you are ignoring the data you already have. The data of your own presence.

  *[The Director looks between them. The hum of the accelerator seems to grow louder.]*

  **Director:** We have a vote in ten minutes. Until then, the machine remains on standby.

  **Thorne:** [Sitting down] Then you are burning money.

  **Vance:** [Remaining standing] Then you are betting the house on a hand you haven't seen.

  *[They lock eyes. Neither blinks. The auditorium waits.]*
