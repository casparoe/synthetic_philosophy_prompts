prompt: |-
  so my philosophy of mind seminar has a guest speaker coming for a Q&A next week and I got roped into drafting the questions. She defends the 'switch model' of split-brain unity -- the view that a split-brain patient only ever has one stream of consciousness at a time that switches really fast between being grounded in the left vs right hemisphere, rather than there being two seperate streams running in parallel the whole time. Can you draft 8-10 questions that go beyond just having her restate the view? I want at least one question on the simultaneous divergent-task evidence (cases where the two hands seem to do genuinely incompatible things at literally the same instant, which seems too fast for any plausible switching rate), one on how the view handles that Pinto et al finding from a few years back where split-brain patients showed more unified awareness across hemispheres than the classic two-streams picture predicts, and one pushing on what actually triggers a "switch" in the first place -- like, is there some further single subject managing the switching, which just relocates the unity problem instead of solving it? For each of those three, add a follow-up keyed to whatever answer she'd probably give.
