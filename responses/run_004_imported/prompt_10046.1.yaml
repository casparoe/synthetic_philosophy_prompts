answer: |-
  Here are 10 questions drafted for your seminar Q&A. They are designed to be philosophically rigorous while engaging with the empirical literature. The first three address your specific requirements, including the anticipated follow-ups.

  ### 1. The Simultaneous Divergent-Task Objection
  **Question:** One of the strongest empirical challenges to the Switch Model is the divergent-task evidence, where patients draw different geometric shapes with each hand or manipulate different objects simultaneously. If consciousness switches between hemispheres, there must be a non-zero switching cost or interval. How does your model account for behaviors that appear to require genuine *simultaneous* conscious monitoring of incompatible motor programs, rather than just rapid serial execution?

  *   **Anticipated Answer:** She will likely argue that complex motor tasks can be initiated consciously and then handed off to unconscious motor modules, allowing the consciousness to switch while the hand keeps moving.
  *   **Follow-up:** If the motor execution is unconscious, does that imply that for significant portions of the day, one hemisphere is acting as a "philosophical zombie"? If so, doesn't that reintroduce a form of duality where we have one conscious subject and one unconscious agent, rather than a single unified subject?

  ### 2. The Pinto et al. Integration Findings
  **Question:** Recent work by Pinto and colleagues (2017) suggests that when response methods are controlled for, split-brain patients show much more cross-hemispheric integration and unified awareness than the classic Sperry-Gazzaniga paradigm suggests. If the hemispheres can share information more robustly than previously thought, does the Switch Model risk being a solution to a problem that doesn't exist? In other words, if there is sufficient subcortical or residual connectivity to support unity, why posit a switching mechanism at all?

  *   **Anticipated Answer:** She will likely concede that connectivity exists but argue it is insufficient for *full* phenomenological unity, necessitating the switch to explain why patients still report disjointed experiences in high-demand tasks.
  *   **Follow-up:** But if the switch rate is fast enough to mimic unity in low-demand tasks (per Pinto), but slow enough to cause disunity in high-demand tasks, aren't we just defining the "switch rate" ad hoc to fit the data? Is there an independent way to measure the switching frequency that doesn't rely on the behavioral output we are trying to explain?

  ### 3. The Trigger and the Homunculus Worry
  **Question:** I'd like to press on the mechanism of the switch itself. What determines which hemisphere is the locus of consciousness at any given millisecond? If there is a physical mechanism that selects the active hemisphere, does that mechanism itself require a unified subject to operate it? I'm worried that positing a "switcher" merely relocates the unity problem rather than solving it.

  *   **Anticipated Answer:** She will likely deny a homunculus, claiming the switch is a subpersonal, competitive process (e.g., neural salience or attentional bidding) that doesn't require a further subject.
  *   **Follow-up:** If the switching is driven by subpersonal competition, can a subpersonal process truly ground *personal-level* unity? It seems we are left with a fragmented subpersonal basis trying to generate a unified personal output; why is that metaphysically preferable to simply accepting two persons with fragmented coordination?

  ### 4. Phenomenological Continuity
  **Question:** Patients generally report a sense of continuous, uninterrupted experience. If consciousness is grounding in the left hemisphere, then switching to the right, there should theoretically be a micro-gap or a "jump cut" in the phenomenology, akin to a saccadic mask but potentially more disruptive. How does the Switch Model explain the absence of reported phenomenological gaps in the patient's first-person perspective?

  ### 5. Memory and Diachronic Unity
  **Question:** For a single stream of consciousness to persist over time, there must be memory transfer between time-slices. If the left hemisphere is conscious at $t_1$ and the right at $t_2$, how is the episodic memory of the experience at $t_1$ made available to the consciousness at $t_2$ without the commissural connections that were severed? Does the Switch Model require a subcortical memory buffer that bypasses the split?

  ### 6. Ontological Parsimony vs. Empirical Fit
  **Question:** Proponents of the Switch Model often argue it is more parsimonious than the Two-Subjects view because it posits only one person. However, if the Switch Model requires complex, unobserved mechanisms (rapid switching, subcortical buffers, unconscious motor agents) to make the data fit, have we really saved on parsimony? At what point does ontological simplicity become empirical gerrymandering?

  ### 7. The Status of the "Offline" Hemisphere
  **Question:** When consciousness is grounded in the left hemisphere, what is the metaphysical status of the right hemisphere? Is it merely a biological engine without moral status, or does it retain some latent subjectivity? This has ethical implications: if the right hemisphere is "offline," is it permissible to stimulate it in ways that would be harmful if it were conscious?

  ### 8. Compatibility with Global Workspace Theory
  **Question:** How does the Switch Model interface with Global Workspace Theory (GWT)? In GWT, consciousness arises from widespread broadcasting. In a split-brain patient, the broadcasting network is physically severed. Are you suggesting that the "global workspace" itself physically migrates between hemispheres, or that there are two workspaces but only one is "lit up" at a time?

  ### 9. Falsifiability Conditions
  **Question:** What specific empirical finding would force you to abandon the Switch Model? For example, if we found a case where a patient could verbally report (Left) a stimulus presented to the left visual field (Right) with zero latency and no subcortical route available, would that falsify the view, or could the model be adjusted to accommodate it?

  ### 10. The Definition of a "Stream"
  **Question:** Finally, your view hinges on the definition of a "stream of consciousness." If the content of the stream changes radically every 100 milliseconds as it switches hemispheres (e.g., from verbal processing to spatial processing), in what sense is it the *same* stream? Are we preserving the unity of the *subject* at the cost of the coherence of the *experience*?
