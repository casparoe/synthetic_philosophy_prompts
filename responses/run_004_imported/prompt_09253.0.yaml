answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. Which means I've spent a lifetime watching my sister figure out how to be good in the world. She takes ethics seriously. I mean *seriously*. So, when she told me she was marrying someone who didn't always see the world exactly the way she does, I'll admit—I was protective.

  But then I started watching them together.

  Actually, full disclosure: I'm giving this toast three weeks after my own moral uncertainty seminar covered a concept by the philosopher Toby Ord called "moral trade." Now, for the half of you who are currently scrolling through your mental index of ethical literature: yes, you know the one. For the rest of my family: don't worry, I'll translate.

  The idea is that two people can disagree completely on what's right, but still find a way to help each other achieve their own version of "good." It's not compromising. It's not saying, "Well, I guess we're both kinda right." It's saying, "I know I'm not going to change your mind, and I respect your conscience enough to help you live by it anyway."

  And that is exactly what I see in this marriage.

  My sister believes factory farming is a moral catastrophe. Her husband? He thinks that's a bit overblown. He hasn't become a vegetarian. But he has quietly funded her animal-welfare donations for years. He doesn't do it because he thinks she's right. He does it because *she* is right, to him. He sees that this matters to her, and he lightens that burden.

  In exchange, she has let go of her grief over his Thursday poker nights. She still thinks it's a little morally grimy. He thinks it's harmless fun. She hasn't decided he's correct. She's decided that his joy is worth more to her than her objection.

  Now, I know "trade" sounds cold. It sounds transactional. But when you watch them do it, it's the opposite. It requires a level of humility and attention that is rare. It means listening deeply enough to understand what weighs on the other person's soul, and loving them enough to carry some of that weight, even if you don't agree it needs carrying.

  They aren't trying to win arguments. They are trying to win *for* each other.

  To the philosophers in the room: You might call it moral trade. But to the rest of us, that's just what love looks like when it grows up. It's making space for the other person to be who they are, without demanding they become who you are.

  So, if everyone could please raise a glass.

  To [Sister] and [Groom]. May you always disagree with respect, support each other without condition, and come out ahead by your own lights, together.

  To the happy couple.
