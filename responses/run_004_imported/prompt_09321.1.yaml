answer: |-
  You have stumbled onto one of the most fascinating ethical showdowns of late antiquity, and your footnote is correct. This is not apocryphal. Around 420 AD, a layman named Consentius (likely from the Balearic Islands or Spain) wrote to Augustine proposing exactly what your bishop is considering: infiltrating the Priscillianists by feigning adherence to their beliefs to expose them.

  Augustine's response, *Contra Mendacium* (Against Lying), is not merely a restatement of his earlier, more theoretical *De Mendacio*. It is a specific, pastoral, and rigorously argued rebuttal to the **utilitarian** logic Consentius employed.

  If you want your bishop to sound like he is rebutting the informant's logic point-by-point rather than just quoting Scripture, you need to understand that Augustine treats Consentius's proposal not as a "necessary evil," but as a **spiritual trap that undermines the very authority of the Church.**

  Here is the shape of Augustine's argument in *Contra Mendacium*, broken down into the specific logical beats you can give your bishop.

  ### 1. The Corruption of the Messenger (The Epistemological Argument)
  Consentius argues that the *end* (saving souls/stopping heresy) justifies the *means* (lying). Augustine argues that the means corrupt the end.

  *   **Consentius's Logic:** Heresy is a lie. We use a lie to defeat a lie. It is tactical.
  *   **Augustine's Rebuttal:** The Church's currency is Truth (Christ is *the* Truth). If the Church authorizes lying, even for a "holy" purpose, it devalues its own testimony.
  *   **For your Bishop:** He shouldn't just say "Lying is a sin." He should argue: *"If we preach the Truth using the tools of Falsehood, who will believe the Truth when we speak it openly? If we are caught in this deception—and we will be—the orthodox faith becomes indistinguishable from the heresy we fight. We become the Priscillianists in all but name."*

  ### 2. The Distinction Between Concealment and Falsehood (The Loophole)
  This is the most practical part for your novel. Augustine makes a crucial technical distinction that allows for secrecy without requiring lies.

  *   **Consentius's Logic:** To gain trust, I must affirm their doctrines as my own.
  *   **Augustine's Rebuttal:** There is a difference between *hiding* the truth and *speaking* a falsehood. You are not obligated to reveal your orthodoxy to those who would misuse it.
  *   **For your Bishop:** *"You do not need to tell them you are orthodox. That is concealment, which is permissible. But you must not tell them you are Priscillianist. That is a lie. Walk among them in silence if you must. Nod if you must. But do not open your mouth to affirm what you know is damnable. There is a space between silence and perjury. Stay in it."*

  ### 3. The Slippery Slope of "Pious Fraud"
  Augustine is terrified of the precedent. He engages directly with the idea that some sins are "small" if the cause is "great."

  *   **Consentius's Logic:** This is a small lie to prevent spiritual murder.
  *   **Augustine's Rebuttal:** If we allow lying for the sake of doctrine today, what stops us from stealing for the sake of the poor tomorrow? Or killing for the sake of peace? Once you admit that sin can be a tool of righteousness, you remove the boundary between the City of God and the City of Man.
  *   **For your Bishop:** *"If we permit ourselves to sin so that God's justice may be done, we imply that God's justice is too weak to succeed without our sin. If lying is a weapon we can sanctify, why not poison? Why not betrayal? We cannot build a holy house with rotten timber."*

  ### 4. The Damage to the Spy's Soul (The Pastoral Argument)
  Augustine is deeply concerned with the spiritual formation of the individual. He argues that habituation to lying damages the liar's capacity for truth, even internally.

  *   **Consentius's Logic:** I am strong enough to lie to them and remain true to God.
  *   **Augustine's Rebuttal:** The soul is shaped by its actions. To act the part of a heretic is to invite the confusion of heresy into your own mind. You cannot play the serpent without absorbing some of its venom.
  *   **For your Bishop:** *"You think you can wear the mask without it sticking to your skin? To speak the lie is to invite the doubt. I will not trade your soul for their secrets. I would rather they remain hidden than you be lost."*

  ### 5. Divine Providence vs. Human Cunning
  Finally, Augustine argues from Providence.

  *   **Consentius's Logic:** We must take matters into our own hands because the heretics are secretive.
  *   **Augustine's Rebuttal:** God does not need our sins to accomplish His judgment. If these heretics are guilty, God can reveal them through other means without requiring you to violate His law.
  *   **For your Bishop:** *"Do not presume to help God by breaking His law. If He wishes them exposed, He will expose them. He does not require us to dirty our hands to clean His house."*

  ### Is *Contra Mendacium* More Extreme than *De Mendacio*?
  It is not more *extreme* in its conclusion (both ban lying absolutely), but it is more **rigorous in its application.**

  *   *De Mendacio* (395 AD) is a theoretical taxonomy of lies (classifying them into eight types, though all are sinful).
  *   *Contra Mendacium* (420 AD) is a battlefield response. It addresses the specific pressure of the Priscillianist crisis, where the heretics were accused of oath-bound secrecy and infiltration themselves.

  Augustine acknowledges the *temptation* of Consentius's argument. He admits it feels like the right thing to do. This makes his refusal more dramatic. He isn't ignoring the stakes; he is saying the stakes are *too high* to compromise on truth.

  ### How to Use This in Your Scene
  To make your bishop sound like he's channeling *Contra Mendacium* without sounding like a textbook:

  1.  **Acknowledge the Utility:** Have the bishop admit the plan would *work*. "I do not doubt you could learn their names. I do not doubt you could bring them to justice." This validates the layman's logic before dismantling it.
  2.  **Focus on the "Truth" Brand:** The bishop should worry about the Church's reputation. In Roman Spain, the orthodox church was trying to distinguish itself from the "secretive, magical" reputation of the Priscillianists. Using their methods validates their culture.
  3.  **The "Silence" Alternative:** Give the bishop a concrete alternative. "Go to them. Eat with them. But when they ask your creed, tell them you are a penitent seeking answers. Do not say 'I believe' when you do not."
  4.  **The Personal Cost:** The bishop should frame the refusal as an act of protection for the layman, not just obedience to dogma. "I am not forbidding this to protect the Church. I am forbidding it to protect *you*."

  Augustine's argument is essentially that **methodology is theology.** How you fight defines what you are fighting for. If you fight lies with lies, you are not fighting for Truth; you are fighting for dominance. That is a powerful thematic note for a novel set in the collapse of Roman order.
