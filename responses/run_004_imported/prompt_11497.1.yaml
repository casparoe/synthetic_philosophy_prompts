      *   **The Case for Irrelevance (The Autonomy of Reason):** Focus on the nature of logical truth. It's mind-independent. The *ad hominem* fallacy. The success of the *Begriffsschrift* regardless of Frege's soul.
      *   **The Case for Relevance (The Unity of Worldview):** Focus on the *drive* for objectivity. The link between logical absolutism and political absolutism. The exclusion of the "subjective" mirrors the exclusion of the "other."
      *   **The Weighing/Resolution:** Distinguish between *Logic* (the calculus) and *Philosophy of Logic* (the story we tell about why the calculus works).
      *   **Conclusion:** Reiterate the distinction. We can use Frege's tools without buying his worldview. Dummett's tension is resolved by splitting the legacy.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I take a side? Yes, the side is "Differentiated Relevance."
