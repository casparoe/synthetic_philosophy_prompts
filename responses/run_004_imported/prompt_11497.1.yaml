      *   *Specific Detail:* Mention the "drittes Reich" coincidence but dismiss it as etymological, focusing instead on the conceptual structure of authority.

  6.  **Final Polish:**
      *   Ensure the distinction between "formal system" and "philosophical apparatus" is sharp.
      *   Make sure the conclusion is decisive.

  *(Self-Correction)*: I need to be careful not to sit on the fence. A "differentiated" view can look like fence-sitting. I need to frame it as: "The diary *fails* to touch the logic, but *succeeds* in tarnishing the metaphysics." That is a definite claim. I will argue that the *philosophical cost* of the diary is the loss of Frege's *authority* as a guide to truth, not the loss of truth itself.

  Let's structure the essay to lead to this distinction.

  *   **Title:** Something about the Third Realm and the Shadow.
  *   **Intro:** The Dummett shock. The thesis.
  *   **Section 1:** The Fortress of Logic (Irrelevance argument).
  *   **Section 2:** The Architecture of Authority (Relevance argument).
  *   **Section 3:** The Verdict (Distinguishing System from Metaphysics).
  *   **Conclusion:** Final commitment.

