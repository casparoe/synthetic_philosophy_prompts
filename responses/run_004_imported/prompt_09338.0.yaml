answer: |-
  You have stumbled upon one of the most famous problems in the philosophy of language. This specific pair of sentences is known as **"Adams' Pair"** (named after the philosopher Ernest Adams, who introduced it in 1970).

  It is the "Hello World" of conditional logic. You are absolutely right to feel that simply saying "one is indicative and one is subjunctive" is a cheat code answer. It labels the phenomenon without explaining the mechanism.

  Here is the actual account of why that mood swap flips your brain, and what it implies about truth conditions.

  ### 1. The Mechanism: What are we "Holding Fixed"?

  The reason the mood change matters isn't just grammatical; it signals a shift in **which facts of the world you are allowed to treat as immutable** while you run the mental simulation.

  **The Indicative: "If Oswald didn't kill Kennedy, someone else did."**
  *   **The Stance:** Epistemic (about knowledge).
  *   **What is held fixed:** The *outcome* (Kennedy is dead).
  *   **How it works:** When you process this sentence, you are reasoning from your current knowledge state. In your current knowledge state, **Kennedy is definitely dead.** That is a hard fact.
  *   **The Logic:** You are effectively saying: "Given that Kennedy is dead, if we remove Oswald from the list of suspects, who is left?" Since the death is a fixed point in your actual world, the logic forces the existence of another killer. It is an inference to the best explanation based on *actual* history.

  **The Counterfactual: "If Oswald hadn't killed Kennedy, someone else would have."**
  *   **The Stance:** Metaphysical/Causal (about how the world works).
  *   **What is held fixed:** The *past* up until the moment of the shot.
  *   **How it works:** When you process this, you are asked to imagine a "nearby possible world." To make the antecedent true ("Oswald hadn't killed"), you have to rewind history to before the shot and change Oswald's actions.
  *   **The Logic:** Now you have to play the tape forward. In the actual world, there was no conspiracy. So, in this nearby world where Oswald doesn't shoot, there is no secret backup assassin waiting in the wings. Therefore, Kennedy lives. The *outcome* (Kennedy's death) is **not** held fixed here; it is allowed to vary based on the causal chain.

  **The Summary:** The mood shift tells your brain whether to hold the **consequent** (Kennedy died) fixed (Indicative) or to hold the **causal past** fixed (Counterfactual).

  ### 2. Do Indicatives have Truth Conditions?

  This leads directly to your second question: *Does this mean indicative conditionals don't have fixed truth conditions?*

  Many philosophers say **yes, exactly.**

  **The Problem with Truth Conditions**
  In classical logic, a statement is true or false based on how the world is. But the Oswald case suggests Indicatives don't describe the world; they describe **constraints on belief.**

  *   **Counterfactuals** try to describe other possible worlds. David Lewis (a giant in this field) argued they have truth conditions based on "similarity" between worlds. (Is the world where Oswald misses and JFK lives more similar to ours than the world where Oswald misses and a backup shooter fires?)
  *   **Indicatives**, however, often violate standard truth conditions. This is captured by **Adams' Thesis**. Ernest Adams argued that indicative conditionals don't have truth values (True/False) at all. Instead, they have **assertibility conditions** based on conditional probability.

  **The "Suppositional Theory"**
  Philosophers like Dorothy Edgington take this further. They argue that when you say, "If Oswald didn't do it, someone else did," you aren't stating a fact about the universe. You are inviting someone to **suppose** the antecedent ("Oswald didn't do it") and add it to their stock of knowledge to see what follows.

  *   If you suppose "Oswald didn't do it" and you keep "JFK is dead" in your stock of knowledge, then "Someone else did" follows.
  *   But that doesn't mean the sentence *itself* corresponds to a fact in the world in the same way "The cat is on the mat" does.

  So, to answer your hunch: **Yes.** The Oswald case is the primary evidence used to argue that Indicative Conditionals are not standard propositions with fixed truth conditions. They are tools for updating probabilities, whereas Counterfactuals are tools for modeling causal dependencies.

  ### 3. Why "Restating the Puzzle" is actually the answer (sort of)

  You mentioned you didn't want to hear "well, those are different types of conditionals." But the deep reason *why* they are different types is **temporal orientation.**

  *   **Indicatives are backward-looking.** They assume the outcome is known and reason about the causes. (JFK is dead -> Who did it?)
  *   **Counterfactuals are forward-looking.** They assume a change in cause and reason about the outcomes. (Oswald doesn't shoot -> What happens next?)

  The "mood" (didn't vs. hadn't) is the linguistic marker that tells your brain which direction to run the simulation.

  ### The Verdict

  Your intuition is spot on.
  1.  **Why the flip?** Because the Indicative holds the *actual outcome* fixed (JFK is dead), while the Counterfactual holds the *causal structure* fixed (No conspiracy existed).
  2.  **Truth Conditions?** The Oswald case is the strongest argument we have that Indicative Conditionals **do not** have standard truth conditions. They function more like rules for updating belief states than descriptions of reality.

  It feels like they should be the same sentence because they share the same vocabulary, but they are actually performing two completely different cognitive operations: one is **diagnostic** (Indicative), and the other is **predictive/causal** (Counterfactual).
