answer: |-
  "The moment she says 'Mother,' she's speaking a language she doesn't know," Halloway said. He was staring at the coffee machine, not Reyes. "She makes the sounds. She feels the grief. But there is no causal chain linking that neural state to the woman who birthed her. There's only a chain linking it to the energy field that stitched her together."

  "And I'm telling you that's temporal snobbery," Reyes said. She was leaning against the bulkhead, arms crossed. "You're saying the value of a signal depends on when it was sent. If the wiring is identical, the function is identical. She sees a picture of her mom, her amygdala fires, her cortisol spikes. That's a reference. It's pointing at the thing."

  "It's not pointing. It's echoing. Imagine I record your voice saying 'fire' and play it back when the ship burns. The recording isn't warning anyone. It's just noise triggered by a button."

  "She's not a recording, Halloway. She's metabolizing. She's observing. If she looks at a star and says 'star,' she is successfully navigating her environment based on that concept. If it walks like reference and quacks like reference, insisting it's not reference because of some invisible historical receipt is mysticism. You want there to be a soul-tag attached to the atoms."

  "I want there to be grounding. Putnam showed us this. Meaning isn't in the head. If I put a brain in a vat and stimulate it to feel like it's touching a tree, it isn't thinking about trees. It's thinking about electrical impulses. Wren's duplicate has never interacted with the past. Her 'memories' are structurally isomorphic to memories, but they lack the intentional object. When she mourns, she isn't mourning a death. She's mourning a fiction her biology was instantiated with."

  "So what happens when she meets the actual mother? Let's say the mother was on the other ship, survives. They meet. Wren hugs her. Is that not a connection? Does the history update retroactively?"

  "No. The causal chain starts then. But everything prior to that moment? It's empty. She's reacting to a internal model, not an external history. It's like... look, if I build a perfect model of the solar system on a table, the little ball representing Mars isn't *about* Mars. It's just a ball. It only becomes about Mars if I use it to track Mars over time. She popped into existence finished. She never tracked anything."

  "You're confusing the origin of the map with the utility of the map," Reyes said. "You're an externalist. You think the content of her mind is determined by things outside her skin. I'm looking at the biology. The biology says this organism has a predictive model of a woman she calls 'Mother.' That model exists. It influences her behavior. Whether that model was carved by experience or assembled by a cosmic glitch is irrelevant to the fact that it is currently governing her actions. You're saying she's a philosophical zombie."

  "I'm saying she's a Swampman. Physically human. Cognitively... unanchored. It's not about being a zombie. It's about truth conditions. If she says 'I broke my arm when I was seven,' that statement is false. She didn't break anything. The field did. So if her beliefs about the past are all false, how can her references be true? You can't have veridical reference built on a foundation of lies."

  "Truth conditions are for logicians. I'm a biologist. I care about homeostasis. She is maintaining homeostasis with her environment using those memories. If she avoids a hot stove because she 'remembers' burning herself, the memory is doing the work of a memory. You're drawing a line in the water and demanding the ocean respect it. Why does the causality have to go backward? Why can't the reference be grounded in the present interaction?"

  "Because then anything could be about anything. If I stare at a cloud and think 'Napoleon,' and you say 'well, you're thinking about Napoleon right now,' you've stripped the word 'about' of all meaning. Reference requires constraint. History is the constraint. Without it, she's not remembering her sister. She's just having a state that feels like remembering. And yeah, that sounds cold. But telling her she's living in a false past is kinder than letting her build a life on the premise that she's someone she isn't."

  "She is someone she isn't," Reyes said. "She's Wren. Just... new Wren. You're worried about the pedigree of the atoms. I'm worried about the person standing in front of us who is crying because she thinks she's lost. If you tell her her grief isn't 'about' her brother, you're not doing philosophy. You're gaslighting."

  "I'm trying to define the terms so we don't break the ship trying to fit her into a legal box designed for a ghost."

  "Then define them around the function," Reyes said, pushing off the bulkhead. "Because if you tell her her memories are empty, she'll prove you wrong. She'll make them real. And then what happens to your theory?"

  "Then I admit I was wrong about the future," Halloway said. "But I'm not wrong about the past. She didn't live it. And until she does, she's speaking a language where all the words refer to nothing."

  "Then we'll teach her new words," Reyes said. "Or maybe we'll just learn to listen to the old ones."
