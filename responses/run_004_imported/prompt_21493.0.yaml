answer: |-
  A student raises her hand and asks, "Professor Lewis, isn't it ironic that the philosopher who insists all possible worlds are real is the one telling us what God *can't* do in this one?"

  Lewis takes a drag of his cigarette and replies, "Not at all. In every possible world, the metaphysics are the same. You can transfer a debt—I can pay your bar tab. But you can't transfer punishment. If I go to jail for your crime, the state isn't punishing me; it's just inflicting hard treatment on an innocent. Punishment requires the suffering to be *because* of the guilt. Break that link, and you don't have Penal Substitution. You have Divine Kidnapping."

  He pauses, tapping ash into a saucer. "So, Christ can pay the fine. But if He serves the time, He must be guilty. And if He's guilty, well... that creates other theological problems. You can pay someone's bill, but you can't do their time without making the Judge a liar about who committed the crime."
