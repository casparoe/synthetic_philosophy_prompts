prompt: |-
  hey so in my early modern political philosophy class we just started a short pascal unit (kind of randomly sandwiched between hobbes and rousseau) and i'm stuck on the "justice, force" fragment from the pensees. here's the passage, trotter's translation:

  "Justice, Might.—It is right that what is just should be obeyed; it is necessary that what is strongest should be obeyed. Justice without might is helpless; might without justice is tyrannical. Justice without might is gainsaid, because there are always offenders; might without justice is condemned. We must then combine justice and might, and for this end make what is just strong, or what is strong just. Justice is subject to dispute; might is easily recognised and is not disputed. So we cannot give might to justice, because might has gainsaid justice, and has declared that it is she herself who is just. And thus being unable to make what is just strong, we have made what is strong just."

  my prof called this "notoriously ambiguous" and then just moved on, which was not helpful lol. what i can't tell is whether that last bit is pascal exposing a con that power always pulls (basically debunking every time force dresses itself up as justice) or whether he's actually endorsing "make the strong just" as the sane conclusion once you accept that justice is endlessly disputable and force isn't. and if he means the second thing, doesnt that clash with the other fragment where he says its dangerous to tell ordinary people the laws aren't really just — cause isnt that exactly what he's doing to US by writing this down? also, random side question, who's the "she" in "she herself who is just," is that just a translation artifact? can you help me work out the actual logical move from "il faut mettre ensemble justice et force" to that last sentence, and maybe connect it to his other stuff about reason getting corrupted after the fall?
