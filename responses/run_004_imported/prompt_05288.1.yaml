      *   *Epicurus's Principle:* "If more than one theory is consistent with the data, keep them all." (As preserved by Epicurus via Sextus Empiricus, often cited in Jaynes/Solomonoff contexts).
      *   *Solomonoff Induction:* $M(x) = \sum_{p: U(p)=x*} 2^{-l(p)}$. It sums over *all* programs. Simpler programs (shorter $l(p)$) get exponentially higher weight.
      *   *MDL:* Selects the hypothesis minimizing $L(H) + L(D|H)$. It's a point estimate (usually).
      *   *The Tension:* The user is right that SI doesn't *discard* complex hypotheses. It *downweights* them. Is downweighting enough to call it Occam? Or is it a hybrid?

