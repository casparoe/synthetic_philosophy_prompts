answer: |-
  Here are two scenarios designed to isolate the specific variables of standing you are wrestling with.

  ### Scenario 1: The Safety Marshal (Hypocrisy with Standing)

  **The Setup:**
  Elena is a volunteer safety marshal at a large, crowded music festival. All staff and volunteers sign a strict code of conduct that includes a rule: "No staff member is to consume alcohol while on shift." This rule exists to ensure marshals remain alert enough to manage crowd surges.

  **The Situation:**
  Earlier in the shift, Elena, overwhelmed by the heat and stress, quietly drank half a beer in a backstage area where she thought she wouldn't be seen. She did not report this violation to her superiors. Later, she spots a different volunteer, Marcus, openly drinking a beer while manning a critical gate entrance. Marcus is visibly impaired and laughing with fans rather than monitoring the flow of people.

  **The Confrontation:**
  Elena confronts Marcus, orders him to pour out the beer, and reports him for disciplinary action. Marcus retorts that Elena has no standing to enforce the rule because she is drinking too (hypocrisy).

  **Diagnosis:**
  In this case, Elena is a **narrow hypocrite**: she is holding Marcus to a standard of sobriety that she is currently violating without acknowledgment. Yet, intuitively, she retains the standing to blame him.

  The consideration doing the work here is **Relationship/Role-Based Authority**. Elena's standing does not derive from her personal moral purity, but from her fiduciary responsibility to the safety of the crowd. Her role grants her the license to intervene in situations that threaten the collective good. While her hypocrisy might make her *less* persuasive or morally admirable, it does not strip her of the *authority* to act, because the source of that authority is the duty she owes to the festival-goers, not her own virtue. The standing is anchored in the **office she holds**, not the **cleanliness of her hands**.

  ***

  ### Scenario 2: The Architect (Non-Hypocrite without Standing)

  **The Setup:**
  Julian is an architect who prides himself on absolute professional honesty; he has never falsified a document or lied to a client in his life. He is hired to design a community center with a very specific, tight budget provided by the city.

  **The Situation:**
  During the design phase, Julian insists on including a complex, expensive roofing structure that he knows consumes 40% of the total budget, leaving insufficient funds for the electrical and plumbing systems required by code. He refuses to simplify the design despite warnings from the construction team. The project goes to build. The general contractor, Sarah, realizes mid-construction that there is literally no money left to pay for the required wiring. To avoid halting the project and laying off workers, Sarah falsifies an invoice to cover the cost of the wiring, intending to pay it back later.

  **The Confrontation:**
  Julian discovers the falsified invoice and publicly berates Sarah for "professional dishonesty" and ethical failure. Sarah points out that Julian has never lied (he is not a hypocrite regarding honesty), yet she refuses to accept his blame.

  **Diagnosis:**
  In this case, Julian is **not a hypocrite** regarding the specific norm of honesty; he has never committed the wrong he is condemning. Yet, intuitively, he lacks the standing to blame Sarah.

  The consideration doing the work here is **Complicity/Involvement**. Julian is causally responsible for the conditions that made the wrongdoing inevitable. By designing a plan that was financially impossible to execute honestly, he created the "dilemma structure" that forced Sarah's hand. Even though his hands are clean of the *lie*, they are dirty with the *coercion*. His involvement in the genesis of the wrong strips him of the moral position to condemn the reaction to it. Here, standing is lost not because the critic violated the norm, but because the critic **engineered the violation**.

  ***

  ### A Note on Your Situation

  In the literature you are reading (Cohen, Wallace, Bell), these distinctions are often used to determine whether blame is *fair*, not just whether it is *true*.

  In your dispute, your sister's argument suggests she views your standing as compromised by **Complicity/Involvement** (you structured your life to avoid the burden, thereby increasing hers) rather than **Hypocrisy** (you aren't necessarily cancelling shifts yourself). She is arguing that by moving away, you became an "Architect" of the current imbalance, even if you are now asking her to be honest about her shifts.

  Understanding which strand she is pulling on might help you address the standing charge directly, rather than getting stuck on the facts of the cancelled shifts. If she feels you lack standing due to *complicity*, no amount of perfect behavior now will restore it without addressing the structural imbalance of care.
