      *   *Why did they miss it?*
          1.  **Cosmological Context:** In 1895, the "Universe" was essentially the Milky Way. The idea of an infinite, eternal multiverse wasn't the standard backdrop. Boltzmann is talking about *one* universe that is spatially vast and temporally eternal.
