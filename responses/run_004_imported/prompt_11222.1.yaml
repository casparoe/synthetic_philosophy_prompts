  2.  **Evaluate the Views (Population Axiology):**
      *   *Total Utilitarianism (Classic Utilitarianism):* Maximizes sum of welfare. Avoids the Sadistic Conclusion. Implies the Repugnant Conclusion (RC).
      *   *Average Utilitarianism:* Maximizes average welfare. Avoids RC. Implies the Sadistic Conclusion (adding miserable lives can raise average if existing lives are miserable enough) and the Mere Addition Paradox issues.
      *   *Critical-Level Utilitarianism (CLU):* Lives count only if welfare exceeds a critical level $c$. Avoids RC (if $c > 0$). Implies the Sadistic Conclusion (adding lives below $c$ but above negative can lower value) or the Very Repugnant Conclusion (depending on parameters).
      *   *Critical-Range Views:* Welfare within a range is neutral. Avoids some issues of CLU. Still faces impossibility results, often similar to CLU but slightly more nuanced. Can imply Sadistic Conclusion.
      *   *Variable-Value Views (e.g., S-Shape):* Value per person decreases as population grows. Avoids RC. Often implies the Sadistic Conclusion or violates independence conditions.
      *   *Person-Affecting Views (PAV):* Only matters if it makes someone better/worse off. Avoids RC and non-identity issues in some ways. Implies the Absurd Conclusion (it's neutral to create happy people if no existing people are affected) or the Non-Identity Problem (cannot say harming future people is wrong if they wouldn't exist otherwise).

