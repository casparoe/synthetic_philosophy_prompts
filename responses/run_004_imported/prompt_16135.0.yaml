answer: |-
  ### 1. A Non-Physical Instantiation: The Case of X-ray Crystallography

  To isolate the structural features of Glymour's Problem of Old Evidence (POE) without relying on the canonical General Relativity/Mercury case, consider a paradigmatic episode in structural biology: **Max Perutz's determination of the hemoglobin structure (1959–1960).**

  **The Context:**
  By the mid-1950s, crystallographers had long possessed high-resolution X-ray diffraction photographs of hemoglobin crystals. Let us designate this specific, complex pattern of diffraction spots as evidence $E$. This data was "old" in the relevant sense: it was measured, recorded, and certain ($P(E) = 1$) well before the correct structural hypothesis was formulated.

  **The Hypothesis:**
  Perutz proposed a specific atomic lattice model of the hemoglobin molecule, positing the precise spatial arrangement of its heme groups and polypeptide chains. Call this hypothesis $H$.

  **The Bridge Principles:**
  The connection between $H$ and $E$ is mediated by the physical laws of X-ray diffraction (specifically Bragg's Law and the Fourier transform relationship between electron density and diffraction amplitude). Let $K$ represent this background theoretical knowledge.

  **The Entailment:**
  Given $K$, the hypothesis $H$ strictly entails the evidence $E$. If the atoms are arranged according to $H$, and X-rays interact according to $K$, the resulting diffraction pattern *must* be $E$. Formally:
  $$ (H \land K) \vdash E $$

  **The Bayesian Impasse:**
  In standard Bayesian confirmation theory, confirmation is defined as a positive probabilistic relevance: $E$ confirms $H$ if and only if $P(H|E) > P(H)$.
  However, since $E$ is already known to the agent prior to the formulation of $H$:
  1.  $P(E) = 1$
  2.  Since $(H \land K) \vdash E$, then $P(E|H \land K) = 1$.

  Applying Bayes' Theorem:
  $$ P(H|E \land K) = \frac{P(E|H \land K) \cdot P(H)}{P(E)} = \frac{1 \cdot P(H)}{1} = P(H) $$

  Standard conditionalization yields the counter-intuitive result that the known diffraction pattern $E$ provides **zero confirmation** for Perutz's structural model $H$, despite the fact that the scientific community regarded the fit between the model and the old photographs as the primary justification for accepting the model.

  ---

  ### 2. The Garber-Jeffrey Strategy Applied

  The strategy proposed by Daniel Garber (1983), building on Richard Jeffrey's insights regarding logical omniscience, resolves this by expanding the algebra of propositions upon which the agent's probability function is defined. The core move is to distinguish between the evidence $E$ itself and the *logical relation* between $H$ and $E$.

  #### A. Expanding the Algebra
  Standard Bayesianism assumes **Logical Omniscience (LO)**: agents assign probability 1 to all logical truths and recognize all entailment relations immediately. In the POE scenario, this forces $P(H \rightarrow E) = 1$ at all times.

  Garber suggests we model the agent as *not* logically omniscient. We expand the language $\mathcal{L}$ to a richer language $\mathcal{L}^*$ that includes a new atomic sentence, $A$, which represents the proposition:
  $$ A := \text{"}H \text{ entails } E \text{ (given } K\text{)"} $$

  Crucially, in $\mathcal{L}^*$, $A$ is treated as a contingent proposition regarding the agent's epistemic state, even if it represents a logical truth in the object language. The agent can be uncertain about $A$.

  #### B. The Learning Event
  The confirmation event is not the observation of $E$ (which happened in the past), but the *discovery* that $H$ explains $E$. The agent updates by conditionalizing on $A$, not $E$.
  $$ \text{New Probability Function: } P_{new}(\cdot) = P_{old}(\cdot | A) $$

  #### C. The Garber Conditions
  To ensure this update yields confirmation ($P(H|A) > P(H)$), Garber imposes specific constraints on the prior probability function $P_{old}$. These constraints capture the intuition that learning about the entailment should not alter the probability of $E$ (since $E$ is already certain) but should alter the probability of $H$.

  1.  **Certainty of Evidence:** $P_{old}(E) = 1$.
  2.  **Screening Off:** $P_{old}(E | H \land A) = 1$ and $P_{old}(E | \neg H \land A) = P_{old}(E | \neg H)$.
      *   *Interpretation:* Once I know $H$ entails $E$, $E$ is guaranteed if $H$ is true. If $H$ is false, knowing that $H$ *would have* entailed $E$ doesn't change how likely $E$ is on its own.
  3.  **Independence:** $P_{old}(A | H) = P_{old}(A)$.
      *   *Interpretation:* The truth of $H$ is probabilistically independent of my *discovery* that $H$ entails $E$. (This is the most contentious condition, but necessary for the math to work cleanly).

  #### D. The Derivation
  We want to show $P_{old}(H | A) > P_{old}(H)$.
  Using Bayes' Theorem on the new evidence $A$:
  $$ P_{old}(H | A) = \frac{P_{old}(A | H) \cdot P_{old}(H)}{P_{old}(A)} $$

  By Condition 3 (Independence), $P_{old}(A | H) = P_{old}(A)$. This seems to imply no update. However, Garber's actual derivation relies on the interaction with $E$. A more robust formulation (following Eells 1985) utilizes the fact that $H$ and $E$ are not independent *given* $A$.

  Let us look at the ratio form. We compare the odds of $H$ before and after learning $A$.
  The confirmation arises because $H$ "captures" the certainty of $E$ once the link $A$ is established.
  If we assume $P_{old}(E) = 1$, then $P_{old}(E | \neg H) = 1$ as well (since $E$ is certain regardless).
  However, the key is that prior to learning $A$, $H$ did not "get credit" for $E$.
  Garber shows that if we assume $P_{old}(E | H \land \neg A) < 1$ (i.e., before I knew the entailment held, I wasn't sure $H$ predicted $E$), then learning $A$ raises the probability of $H$.

  Specifically, if the agent was previously uncertain whether $H$ entailed $E$, then $H$ was not fully leveraging the certainty of $E$. Once $A$ is learned, $H$ becomes a hypothesis that successfully "predicts" a certainty.
  $$ P_{old}(H | A) = P_{old}(H) + \delta $$
  Where $\delta > 0$ provided that $H$ was not already known to entail $E$. In the crystallography case, Perutz did not know his model fit the data until he ran the Fourier synthesis. Learning that "Model $\vdash$ Pattern" ($A$) confirmed the Model ($H$), even though the Pattern ($E$) was old.

  ---

  ### 3. Coherence Conditions and the Cost of Relaxing Logical Omniscience

  While the Garber-Jeffrey strategy successfully models the *descriptive* intuition that old evidence can confirm new theories, it exacts a significant toll on the *normative* foundations of Bayesianism. As you draft your chapter, you should flag the following tensions:

  #### A. Vulnerability to Dutch Books
  Standard Bayesian coherence is defended via Dutch Book arguments: if your degrees of belief violate the probability axioms (including $P(\text{Tautology}) = 1$), a bookie can construct a set of bets that guarantees your loss.
  *   **The Conflict:** In the Garber framework, the proposition $A$ ("$H$ entails $E$") is treated as having a probability $P(A) < 1$ prior to the discovery. But if $H$ really does entail $E$ (given $K$), then $A$ is a logical truth.
  *   **The Consequence:** By assigning $P(A) < 1$, the agent is formally treating a logical truth as a contingent uncertainty. A logically omniscient bookie could exploit this. For example, the bookie could sell the agent a bet that pays \$1 if $A$ is true for a price less than \$1. Since $A$ is logically true, the agent *must* pay out, guaranteeing a loss relative to the logical facts.
  *   **Dissertation Point:** Adopting Garber's solution requires abandoning the claim that Bayesianism provides a logic of *ideal* rationality. It shifts the framework to a logic of *bounded* rationality. You must argue whether confirmation theory ought to model ideal agents or actual scientific practitioners.

  #### B. The Ad Hoc Nature of the Garber Conditions
  The conditions required to make the math work (specifically the independence conditions regarding $A$) lack a strong independent justification.
  *   **The Conflict:** Why should the proposition "$H$ entails $E$" be probabilistically independent of $H$ itself? In many scientific contexts, the complexity of $H$ might make the entailment harder to verify (correlation between $H$'s truth and the difficulty of deriving $E$).
  *   **The Consequence:** If these conditions are merely *assumed* to save the phenomenon of confirmation, the solution risks being circular. We are tuning the priors on logical relations to ensure the posteriors come out "right."
  *   **Dissertation Point:** This highlights a broader issue in Bayesian epistemology: the tension between *kinematics* (how beliefs update) and *dynamics* (what the priors are). Garber solves the kinematic problem of old evidence by imposing constraints that look like dynamic constraints on logical learning.

  #### C. The Fragmentation of the Algebra
  To make this work, the agent effectively operates with two algebras: one where $A$ is contingent (for the purpose of updating) and one where $A$ is necessary (for the purpose of truth).
  *   **The Conflict:** Standard probability theory is defined over a Boolean algebra where logical relations are fixed. Garber requires a "fragmented" algebra where logical relations are themselves objects of belief.
  *   **The Consequence:** This complicates the definition of coherence. If $A$ becomes certain ($P(A)=1$) after the discovery, does the agent then become vulnerable to Dutch Books regarding *other* logical relations they haven't discovered yet?
  *   **Dissertation Point:** This suggests that "relaxing logical omniscience" is not a one-time fix but requires a comprehensive theory of *logical learning* (e.g., Hintikka's distributive normal forms or more recent work by Garber himself and later Eells). Without a general account of how logical probabilities update, the Garber solution to POE remains a localized patch rather than a systemic repair.

  ### Summary for the Chapter
  The crystallography example demonstrates that the Problem of Old Evidence is not peculiar to fundamental physics but arises wherever theoretical models are retrofitted to established data via strict entailment. The Garber-Jeffrey strategy rescues the intuition of confirmation by re-categorizing the discovery of entailment as the evidential event. However, this rescue operation comes at the price of severing the link between Bayesian coherence and logical truth. For your dissertation, the critical takeaway is that solving POE via Garber requires a commitment to **bounded rationality**: we must accept that a scientifically rational agent is one who is *not* coherent in the strict, logical-omniscience sense, thereby forcing a revision of what "Bayesian Rationality" normatively entails.
