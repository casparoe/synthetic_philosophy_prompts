      *   *Key Distinction:* Kant is talking about the *motive* required for an action to have moral worth. WKR is talking about the *analysis* of value itself (what it *means* for something to be good).
      *   *Buck-Passing Account (BPA):* "To be good is to be such as to provide reasons." WKR challenges this by showing some reasons don't make things good (e.g., the demon's threat).
