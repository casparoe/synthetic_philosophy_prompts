answer: |-
  This is a classic moral dilemma that philosophers, psychologists, and just regular people have wrestled with for centuries. The short answer is: **Your buddy is right about the impact, but you are right about the character.**

  Neither of you is wrong, but you are looking at the same event through different lenses. Here is a breakdown of why you feel this way, why your buddy's logic holds water, and why you shouldn't let this ruin the good deed for yourself.

  ### 1. The Buddy's View: Consequentialism
  Your buddy is arguing from a **consequentialist** perspective. In this view, the moral worth of an action is determined solely by its outcome.
  *   **The Reality:** The elderly woman's feet stopped hurting. She didn't fall over. She got to rest.
  *   **The Verdict:** The world is objectively better because you stood up. If you had stayed seated, the universe would be slightly worse. Therefore, you did a good thing.

  Your buddy is right that we cannot control the purity of our subconscious impulses, only our physical actions. If we required "pure" altruism for every good deed, almost no one would ever help anyone.

  ### 2. Your View: Virtue Ethics
  You are feeling uneasy because you are looking at this through the lens of **virtue ethics** or **integrity**. You care about *who you are*, not just *what you did*.
  *   **The Fear:** You're worried that you aren't actually a "kind person," but rather a "performative person." You're worried that your kindness is conditional on an audience.
  *   **The Verdict:** That discomfort you feel? That is actually a good sign. It proves you care about authenticity. A truly selfish person wouldn't lose sleep over this; they'd just take the credit.

  ### 3. The Myth of Pure Altruism
  Here is the psychological reality that might help you shake this off: **Human motivation is almost never pure.**

  We are social animals. We are wired to care about our status, our reputation, and how we are perceived by potential mates or peers. That is an evolutionary survival mechanism.
  *   When you donate to charity, part of it is to help the cause, and part of it is to feel good about yourself (the "warm glow").
  *   When you hold a door, part of it is politeness, and part of it is not wanting to look like a jerk.

  The fact that the girl was a catalyst doesn't erase the empathy you *did* feel. You said it yourself: *"I did notice she seemed exhausted... it wasn't like I felt nothing for her."*
  The girl might have been the **push**, but the empathy was the **foundation**. Without that foundation, even with the girl watching, you might have just fixed your hair instead of giving up your seat.

  ### 4. The "Counterfactual" Trap
  You are torturing yourself with a "what if" scenario: *"If she hadn't been on that train, I'm pretty sure I would've just kept my headphones in."*

  But that didn't happen. That is a ghost timeline. You cannot judge your character in this reality based on a version of yourself that didn't exist.
  *   **The Growth Mindset:** Instead of seeing this as proof that you are a fraud, see it as data. You now know that social accountability helps you act on your better instincts.
  *   **The Habit:** Actions reinforce identity. Every time you stand up for someone, even if the motive is mixed, you reinforce the neural pathway that says, *"I am the kind of person who stands up."* Next time, the barrier to do it without an audience might be lower.

  ### The Verdict
  Your buddy is right that the **result** is what matters to the old lady.
  You are right that the **motive** matters to *you*.

  But here is the compromise: **Don't let the perfect be the enemy of the good.**

  If you beat yourself up too hard about your motives, you might become cynical and stop doing good deeds altogether because you feel you can't do them "perfectly." That would help no one.

  **You did a human thing.** You had mixed motives. You helped someone. You learned something about yourself.
  *   Accept the compliment your brain is trying to give you (you did a nice thing).
  *   Accept the critique your conscience is giving you (you want to be kinder for kindness' sake).
  *   Let that critique guide your *next* action, not ruin your *last* one.

  You aren't a fraud. You're just a person who needed a little extra nudge to do the right thing. That nudge came in the form of a crush. So what? The lady still got the seat. Give yourself credit for taking the hint.
