prompt: |-
  Been down a bit of an AI safety rabbit hole on youtube and blogs lately, and I keep running into people talking about "eliciting latent knowledge" like its one of the biggest unsolved problems in alignment. I feel like im missing something though, because it seems pretty solvable to me? Cant you just train the model with RL where human raters check its answers and reward it whenever it truthfully reports what it actually believes, and punish it whenever its caught being deceptive? Given enough training steps, wouldn't the model just learn to always surface its real internal beliefs, since hiding stuff stops paying off eventually? People act like ELK is this deep open problem but it kinda just sounds like regular RLHF with extra steps to me, so what am I missing here?
