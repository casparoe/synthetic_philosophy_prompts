answer: |-
  Here are 10 interview questions designed for a philosophy of physics audience, avoiding pop-sci tropes and targeting the specific metaphysical and epistemological commitments of modern Everettianism (specifically the Oxford/Wallace line).

  ### 1. The Ontological Status of "Worlds"
  **Question:** Modern Everettians, particularly David Wallace, tend to argue that "worlds" are not fundamental ontological primitives but rather emergent structures within the universal wavefunction, similar to how a "table" is an emergent structure of atoms. If worlds are merely emergent patterns, does this not risk making the "Many Worlds" label misleading? Are we really committed to *many worlds*, or just *one wavefunction* with a complex internal structure?
  **Follow-up:** If it's just one wavefunction, what grounds the reality of the emergent branches? If a branch has vanishingly small amplitude, does it exist in the same sense as a high-amplitude branch, or does "existence" come in degrees here?

  ### 2. The Preferred Basis Problem (Required)
  **Question:** A classic objection is that the wavefunction alone doesn't dictate a unique decomposition into branches; you need a preferred basis to define what a "world" actually *is*. You likely rely on decoherence to select this basis, but critics argue this is circular: doesn't invoking decoherence already presuppose a tensor product structure (splitting the system into "observer" and "environment") that implicitly assumes the very basis you're trying to derive?
  **Follow-up:** If the choice of basis is partly pragmatic or dependent on the location of the observer, does that reintroduce a form of perspectivalism that undermines Everett's claim to be a fully objective, view-from-nowhere interpretation?

  ### 3. The Deutsch-Wallace Derivation (Required)
  **Question:** Let's turn to probability. The Deutsch-Wallace program uses decision theory to derive the Born Rule, arguing that a rational agent in an Everettian universe *must* bet as if the Born Rule were true. But decision theory typically tells us how to act given our beliefs, not what the objective chances *are*. Does this derivation actually recover objective probability, or does it merely show that we are rationally compelled to *act as if* there are probabilities, even if there aren't any?
  **Follow-up:** If it's only a normative constraint on rationality, what stops a "maverick" agent from adopting a different betting strategy that doesn't track branch weights? Would they be irrational, or just empirically unlikely to survive?

  ### 4. Subjective Uncertainty & The Incoherence Problem (Required)
  **Question:** Connected to that, there's the "Incoherence Problem." If I know MWI is true, I know that *both* outcomes of a measurement will occur. In a deterministic theory where everything happens, what is there to be uncertain *about* prior to measurement? How do you make sense of the pre-measurement subjective uncertainty that seems required for the decision-theoretic argument to even get off the ground?
  **Follow-up:** Some suggest this is just a semantic issue about the word "uncertain." But if I know my future selves will see both results, isn't my epistemic situation fundamentally different from a Copenhagenist who thinks only one result will happen? Does MWI require us to revise the concept of knowledge itself?

  ### 5. Personal Identity & Quantum Suicide (Required)
  **Question:** I want to press on the metaphysics of identity using the "Quantum Suicide" thought experiment. If the universe branches, does the pre-measurement "I" survive as *both* successors, or neither? If I survive as both, why should I fear a risky quantum event where one branch involves my death?
  **Follow-up:** If you say I should still fear it because one of my successors dies, aren't you implicitly privileging the "continuity of consciousness" in a way that looks suspiciously like a single-world intuition? How does your view of fission avoid the conclusion that rational agents should be reckless with quantum risks?

  ### 6. Ockham's Razor and Parsimony
  **Question:** Proponents often argue MWI is parsimonious because it removes the collapse postulate. But critics argue it violates quantitative parsimony by positing a vast multiplicity of unobservable entities. How do you weigh *ideological* parsimony (fewer laws) against *ontological* parsimony (fewer entities)? Is there a principled reason to think the former is more valuable than the latter in fundamental physics?
  **Follow-up:** If ontological bloat doesn't count against a theory, what stops us from accepting even more extravagant metaphysical additions as long as they simplify the equations? Where is the breaking point?

  ### 7. Locality and Bell's Theorem
  **Question:** Everettians often claim their interpretation is "local" in a way that Copenhagen is not, since there's no non-local collapse. But Bell's inequalities still hold. How does MWI explain the perfect correlations between entangled particles across spacelike separation without invoking non-local influences, given that the outcomes are determined locally at each branch?
  **Follow-up:** Does this require a specific view of spacetime or causation? If the correlation is explained by the global structure of the wavefunction rather than local beables, are we really saving "locality" in the sense relativists care about?

  ### 8. The "Splitting" Metaphor vs. Differentiation
  **Question:** Pop-sci often describes MWI as the universe "splitting" or "copying." You've likely argued against this, preferring a view where the universal wavefunction differentiates. Why is this distinction important? Does "splitting" imply a duplication of substance that leads to energy conservation worries, whereas "differentiation" avoids this?
  **Follow-up:** If it's differentiation rather than splitting, does that imply the number of worlds is fixed and just becomes more distinct over time? If so, how do we account for the apparent *creation* of new branches during measurement?

  ### 9. Theory Choice & Empirical Equivalence (Required Closing)
  **Question:** Finally, MWI is often claimed to be empirically equivalent to standard Copenhagen quantum mechanics, at least for all practical purposes. If two theories make the same predictions for all possible observations, what counts as evidence *against* Everett? Is there any conceivable experiment that could falsify MWI without also falsifying the underlying Schrödinger dynamics?
  **Follow-up:** If the choice between MWI and Copenhagen is underdetermined by empirical data, are we ultimately choosing based on metaphysical taste? If so, should we be teaching this as physics, or as a specific metaphysical framework for interpreting the physics?

  ### 10. The Payoff: What Changes?
  **Question:** To close, suppose a student in our seminar becomes convinced by your arguments tonight. They accept MWI. How should that change how they *do* physics tomorrow? Does accepting Everett impose new constraints on model-building, or is it purely a retrospective interpretation of the math we're already using?
  **Follow-up:** If it doesn't change the practice of physics, is the primary value of MWI that it dissolves the "measurement problem" anxiety, allowing us to take the formalism literally without cognitive dissonance?
