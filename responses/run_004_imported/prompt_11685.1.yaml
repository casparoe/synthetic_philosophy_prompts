answer: |-
  **Grade: B+**

  **Comments for Feedback:**

  *   **What's Solid:**
      *   **Case Facts:** Your summary of the grudge informer case is concise and accurate. You correctly identify the postwar court's reasoning (invalidating the statute based on "sound conscience") which sets up the theoretical conflict nicely.
      *   **Hart's Position:** You have a very clear grasp of Hart's specific proposal. Identifying that Hart advocates for a "frankly retroactive statute" rather than denying the validity of the Nazi law is correct, and your explanation of *why* he does this (to reveal the "moral price" rather than hide it behind conceptual confusion) is excellent. This is the core of Hart's positivist argument in this exchange.
      *   **Fuller's Critique of Hart:** You correctly note that Fuller would object to Hart's solution on the grounds that it violates the requirements of legality (specifically non-retroactivity). You also correctly identify Fuller's view that the Nazi regime's procedural failures (secret laws, inconsistent enforcement) undermined its status as a legal order.

  *   **What's Shaky / Needs Correction:**
      *   **Theoretical Conflation (Major Issue):** In the third paragraph, you write: *"His [Fuller's] idea of an internal morality of law — what Hart elsewhere calls the 'minimum content of natural law'..."* This is theoretically incorrect and obscures a key distinction between the two theorists.
          *   **Hart's "Minimum Content of Natural Law"** (*The Concept of Law*) is **substantive**. It argues that any legal system must contain certain rules protecting persons, property, and promises to ensure human survival (based on contingent facts about human vulnerability, resources, etc.).
          *   **Fuller's "Internal Morality of Law"** (*The Morality of Law*) is **procedural**. It consists of eight desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence) regarding *how* law is made and administered.
      *   **Definition of Internal Morality:** Consequently, your description of Fuller's internal morality as "protecting citizens' basic security and welfare against arbitrary power" sounds more like Hart's substantive minimum content or a substantive due process claim. For Fuller, the "internal morality" is about the integrity of the law-making process itself. While the *result* protects security, the *mechanism* is procedural fidelity.
      *   **Impact on Grade:** While you correctly describe the *work* the concept does for Fuller (disqualifying the Nazi regime and critiquing Hart's retroactivity), conflating Fuller's central concept with Hart's distinct concession to natural law is a significant error in a graduate jurisprudence seminar. Precision in terminology is essential when distinguishing these two specific frameworks.

