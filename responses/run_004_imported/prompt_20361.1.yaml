answer: |-
  It is refreshing to hear someone say they are bored of the heart-valve example. It is the *Drosophila* of philosophy of biology: useful for teaching the basics, but if you stare at it for 35 years, you stop seeing the organism and only see the model.

  Since you spent your career in evolution, I will skip the anatomical low-hanging fruit and go straight to the molecular level, where this distinction gets bloody. Let's talk about **enzyme moonlighting**, specifically the case of **$\epsilon$-crystallin in the duck eye lens.**

  ### The Biological Setup
  In many vertebrates, the eye lens is packed with proteins called crystallins to create the high refractive index needed to focus light. You would assume these are specialized structural proteins evolved specifically for optics. They aren't.

  In the duck (and some other birds), the major protein in the lens ($\epsilon$-crystallin) is identical to **Lactate Dehydrogenase B (LDH-B)**. In the rest of the duck's body, this molecule is a metabolic enzyme involved in glycolysis (converting lactate to pyruvate). In the lens, however, it is expressed at massive concentrations, is structurally stabilized, and often loses its catalytic activity entirely to serve as a transparent structural brick.

  This is a classic case of "gene sharing" or molecular co-option. Here is how the two philosophical accounts carve it up.

  ### The Divergence

  **1. The Etiological Account (Selected Effects)**
  *   **The Verdict:** The function of this protein is **metabolic catalysis (glycolysis).**
  *   **The Reasoning:** The gene exists and is conserved in the duck genome because of selection pressures acting on its metabolic utility in the *ancestral* lineage. The lens recruitment is a secondary event. According to Ruth Millikan or Karen Neander, a trait's "proper function" is the effect for which it was historically selected. The lens transparency is a beneficial *side effect* (or a newly selected effect if you argue the recruitment itself was selected), but the etiological identity of the *trait type* (LDH-B) remains rooted in metabolism. If the lens transparency vanished tomorrow, the gene would still be selected for in the muscles.

  **2. The Causal-Role Account (Cummins)**
  *   **The Verdict:** The function of this protein in the lens is **maintaining refractive index (transparency).**
  *   **The Reasoning:** Robert Cummins doesn't care about the history. He asks: "What capacity does the containing system (the eye) have?" (Focusing light). "What contribution does this trait token make to that capacity?" (Refraction). The fact that this molecule used to be an enzyme in a fish ancestor is irrelevant to the current systemic analysis. In the context of the eye, its function is optical.

  ### Why They Diverge
  The split happens because **Etiology is diachronic** (across time), while **Causal-Role is synchronic** (at this moment).

  The Etiological account ties function to *lineage*. It treats the protein as a historical entity that carries its "job description" from its origin. The Causal-Role account ties function to *context*. It treats the protein as a component in a current machine; if you put a brick in a computer, its function in the computer is "doorstop," regardless of its function in the wall.

  ### Which Verdict Sounds Like "Shop Talk"?

  Here is the uncomfortable truth we all lived with: **We are contextual pluralists, but we lean Etiological when the stakes are high.**

  If you walk into a **physiology lab** and ask, "What is the function of $\epsilon$-crystallin in the lens?", they will look at you like you're daft if you say "glycolysis." They will say, "It's for refraction." In mechanistic explanations, biologists are hardline Cummins-style Causal-Rolers. We need to know what the knob *does* to turn the machine, not where the knob came from.

  However, if you walk into an **evolutionary biology seminar** (your old haunt) and ask, "Is the lens transparency the *function* of LDH-B?", the room will split.
  *   The strict adaptationists will say: "No, the function is metabolism; transparency is an **exaptation**."
  *   The pragmatists will say: "It's a function *now* because it's currently under selection for transparency."

  But here is the tell: When we want to distinguish **adaptation from noise**, we revert to Etiology.
  If a trait has a Causal-Role (it *does* something useful) but no Etiological history (it wasn't *selected* for that), we often hesitate to call it a "true function" in evolutionary discussions. We call it a "byproduct," a "spandrel," or "pre-adaptation."

  **The Verdict:**
  In the field, **Etiological accounts win on prestige, but Causal-Role accounts win on utility.**

  We *talk* like Causal-Rolers 90% of the time because it's efficient. ("The function of this sequence is binding.") But we *think* like Etiologicalists when we are judging whether a trait is an adaptation. If you published a paper claiming the "function" of a neutrally evolving repetitive DNA sequence was "chromatin spacing" solely because it *does* space chromatin (Causal-Role), without evidence of selection (Etiology), the reviewers would tear you apart.

  So, while we use Causal-Role language to describe mechanisms, the **Etiological account** is the one that governs our ontology of what counts as a "biological function" versus a "mere effect." We are etiologicalists by conviction, causal-rolers by convenience.
