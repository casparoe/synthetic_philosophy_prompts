answer: |-
  You have nailed Anscombe's position on Truman. That is precisely the hinge of her argument in *War and Murder* (1961) and her public protest at Oxford in 1956. She wasn't arguing consequentialism (i.e., "more people died than were saved"); she was arguing **moral taxonomy**. She claimed that because the terrorization of the civilian population was the *method* by which the surrender was achieved, the civilians were not "collateral damage" (foreseen but unintended); they were the **instrument** (intended as a means). Therefore, it was the direct killing of the innocent, which she classified as murder, full stop.

  Applying that specific, rigorous framework to modern drone "signature strikes" is fascinating because it stress-tests her distinction between **intention** and **foresight** in an environment of radical uncertainty.

  Here is how Anscombe would likely dissect signature strikes, and why her framework probably doesn't break—it just tightens the noose.

  ### 1. The "Means vs. Side Effect" Question
  In a standard Just War application of Double Effect (DDE), you bomb a munitions factory. You foresee civilians living nearby will die. Their death is not the *means* to destroying the factory; it is a tragic side effect.

  In a **signature strike**, you are not bombing a factory; you are bombing a "pattern of life."
  *   **The Anscombean Analysis:** Anscombe would ask: *What is the mechanism of success here?*
      *   If the goal is to degrade a militant network, the death of the "target" is the means.
      *   However, because the target is defined by *behavioral patterns* rather than *identity*, the strike effectively targets **anyone fitting the description in that location.**
      *   If the "pattern" includes activities that civilians might engage in (e.g., gathering in groups, using radios, moving in trucks), then the strike treats **civilians-as-possible-combatants** as the target.

  Anscombe would likely argue that this collapses the distinction between means and side effect. If your method of warfare relies on killing people who *might* be enemies, you have made the **risk to the innocent** part of your operational mechanism. You aren't just "accepting" their death as a side effect; you are proceeding on a plan that *requires* their potential death to function.

  For Anscombe, if you choose an action where the death of the innocent is a statistical certainty required to achieve the goal, you intend their death in the moral sense, even if you hope they turn out to be guilty.

  ### 2. The Identity Problem: Does "Who" Matter?
  You ask if her framework holds when "nobody can say who exactly is being killed."

  Anscombe would say: **The names don't matter; the moral status does.**

  Her absolute prohibition is on killing the **innocent** (those not engaged in unjust aggression). She does not require a name tag to establish innocence; she requires **liability**.
  *   In traditional combat, a uniform or a weapon in hand establishes a presumption of liability (combatant status).
  *   In signature strikes, that presumption is replaced by **probability**.

  Anscombe was a fierce critic of "probabilism" in ethics (the idea that if an action is *probably* okay, you can do it). She argued that you cannot kill a man on the probability that he is guilty. To do so is to treat him as if he has no right to life unless proven otherwise, which inverts the presumption of innocence.

  She would likely argue that firing a missile at a group of unidentified men is morally equivalent to firing into a crowd where you *know* some are innocent but hope you hit the guilty ones. In her view, **you intend to kill whoever is there.** If some of them are innocent, you have intended to kill the innocent. The lack of specific identity doesn't absolve the shooter; it implicates them in a policy of indiscriminate killing.

  ### 3. Would she call it "Murder" like Hiroshima?
  There is a subtle distinction she might draw, but the verdict would likely be the same.
  *   **Hiroshima:** The civilians were the *explicit* target. The intention was *direct*.
  *   **Signature Strikes:** The civilians are the *implicit* target. The intention is *oblique* regarding the bystanders, but *direct* regarding the "signature."

  However, Anscombe would likely argue that signature strikes are **potentially more insidious** than Hiroshima. Hiroshima was honest about its terror; signature strikes hide behind the language of "precision" and "collateral damage."

  She would likely argue that because the "target" is undefined, the death of the bystanders cannot be truly "unintended." If you don't know who the target is, you don't know if the person dying is the target or the bystander. Therefore, you are willing the death of **human beings simpliciter**, not "combatants."

  In her essay *War and Murder*, she writes:
  > *"It is not lawful to kill the innocent... To kill the innocent is murder."*

  If a signature strike kills a civilian (which they predictably do), and that civilian was not identified as a combatant prior to the strike, Anscombe would classify that specific death as murder. If the strategy *predictably* produces these deaths as a necessary cost of the "pattern" targeting, the strategy itself is a mechanism for murder.

  ### 4. Does the Framework Break?
  No. In fact, Anscombe's framework is designed specifically to handle this kind of "technocratic obscuring."

  Her philosophy attacks the idea that **foresight** can sanitize **injustice**.
  *   **Consequentialist view:** "We foresaw civilians would die, but the strategic value was high, so it's okay."
  *   **Anscombean view:** "If the act involves killing the innocent, no amount of foresight vs. intention parsing saves you if the act itself is unjust."

  The uncertainty of the target makes the act unjust *ab initio* (from the start). You cannot apply Double Effect to an action that is already morally illicit. DDE only applies to actions that are good or neutral in themselves (like destroying a military target). Anscombe would argue that **bombing unidentified people is not a neutral act;** it is an act of aggression against the innocent.

  Therefore, the "foresight" defense fails. You can't say "their death was foreseen but not intended" if the action you took was *defined* by the willingness to kill anyone fitting a vague description.

  ### The Verdict
  Anscombe would likely view signature strikes as a **corruption of the concept of intention.**

  She would argue that by removing the requirement for positive identification, the military is effectively saying: *"We intend to kill the people in this zone, and we accept that some of them are innocent."*

  For Anscombe, accepting that some of them are innocent makes them **intended victims** in the moral sense, because their death is part of the chosen plan's cost structure. It returns us to the Hiroshima logic: **Human beings are being used as material to be expended for a strategic end.**

  She would likely conclude that signature strikes are not a "lesser evil" or a "tragic side effect," but a form of **institutionalized murder** that uses the fog of war to bypass the absolute prohibition on killing the innocent. The lack of names doesn't save the drone operator; it indicts the policy.

  **In short:** She wouldn't say the framework fails; she'd say the framework reveals that signature strikes are morally incoherent. You cannot "collaterally damage" people you haven't even identified as non-combatants. You are just killing people. And if they aren't proven guilty, you are killing the innocent. And that is murder.
