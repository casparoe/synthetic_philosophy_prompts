      *   *Stage 2:* Focus on the "Twin Prisoner's Dilemma." Lewis's argument is that the correlation is screened off by the past. ECL tries to bypass this with "logical decision theory" vibes. Lewis would call this "magical thinking." The "Large World" aspect just multiplies the stakes, not the causal leverage. $0 \times \infty$ is still problematic if the causal probability is 0.
      *   *Stage 3:* Modal Realism. This is the trickiest. ECL usually talks about space-time regions. Lewis talks of Worlds. If ECL is about *physical* multiverse, Lewis treats those as parts of one World (the actual one). If ECL is about *modal* multiverse, Lewis says no causal contact. The prompt asks about Lewis's *own* modal realism. I need to distinguish between the "Large World" of cosmology (which Lewis accepts as part of @) and the "Plurality of Worlds" (which Lewis accepts as $W$). ECL usually targets the former. But if we apply ECL to the latter... Lewis would say counterparts are not *me*. I can't help them.
