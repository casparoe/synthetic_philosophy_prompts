answer: |-
  This is a fascinating counterfactual exercise. David Lewis is indeed the perfect stress test for Evidential Cooperation in Large Worlds (ECL) because his philosophy simultaneously maximizes the *ontological* plausibility of the scenario (via Modal Realism and a tolerance for plenitude) while minimizing the *normative* plausibility of the inference (via Causal Decision Theory and Humean Supervenience).

  Here is a reconstruction of how Lewis would likely have engaged with ECL, proceeding through the three stages you outlined.

  ### Stage 1: Humean Supervenience and the Correlational Premise

  The first hurdle for any decision theory is metaphysical: do the relevant correlations exist? ECL relies on the claim that there are causally disconnected agents in distant regions of the multiverse whose decision procedures correlate with yours sufficiently to make your action evidence of theirs.

  Lewis's commitment to **Humean Supervenience**—the thesis that the truth about the world supervenes on the spatiotemporal distribution of local qualitative properties—might initially seem hostile to ECL. Lewis famously denied "necessary connections between distinct existences." If ECL required a metaphysical glue binding your decision to a decision in a causally disconnected Hubble volume, Lewis would reject it as occult.

  However, Lewis distinguishes sharply between *causal* dependence and *evidential* dependence. In *"Causal Decision Theory"* (1981), Lewis grants that an agent's act can be highly informative about states of the world they cannot cause. His example is the common cause structure: a barometer falls and a storm comes; the barometer doesn't cause the storm, but reading the barometer is evidence of the storm.

  Applied to ECL, Lewis would likely **grant the correlational premise** without hesitation. In fact, his metaphysics makes the existence of such correlates more secure than for most philosophers. In *On the Plurality of Worlds* (1986), Lewis argues that anything that possibly exists, does exist (in some world). Even restricting ourselves to the "Actual World" (the concrete spatiotemporal system we inhabit), Lewis accepts a plenitude of matter. If the universe is infinite or sufficiently vast, patterns must repeat.

  Lewis would argue that if two agents instantiate the same algorithm (or sufficiently similar decision procedures), their outputs will correlate. This correlation does not require a "necessary connection" in the anti-Humean sense; it requires only a similarity in intrinsic properties and initial conditions. Since Lewis believes properties are natural and sparse, and that laws of nature are systems of regularities, he would accept that "running the same code" yields correlated outputs across space.

  **Verdict on Stage 1:** Lewis would not resist the *existence* of the correlation. His Humeanism bans causal powers traveling across the void, not patterns repeating across the void. He would agree that your cooperation is *evidence* that your distant counterpart cooperates. His objection would not be "that correlation is impossible," but rather "that correlation is irrelevant to rational action."

  ### Stage 2: Causal Decision Theory and the "Why Ain't Cha Rich?" Objection

  This is the crux of the disagreement. ECL proponents argue that because the correlation exists, you should maximize *evidential* expected utility (EDT). Lewis is the arch-defender of *causal* expected utility (CDT).

  In his 1979 paper *"Prisoners' Dilemma Is a Newcomb Problem,"* Lewis addresses the exact structural core of ECL: the Twin Prisoner's Dilemma. In this scenario, you play against a twin who is guaranteed to do exactly what you do. EDT says cooperate (since $C$ implies Twin-$C$, yielding a high payoff). CDT says defect (since your choice cannot *cause* the twin's choice; the correlation is screened off by the past common cause of your shared psychology).

  Lewis bites the bullet: **You should defect.** He argues that rationality is about influencing the world, not reading the news. If you defect, you get the "defect/defect" payoff. If you cooperate, you get the "cooperate/cooperate" payoff. While the latter is better, your choice doesn't *bring it about*. The outcome is already fixed by the past conditions that determined both your psychologies. To act as if you can change the twin's move is to engage in "magical thinking."

  **How would Lewis handle ECL's specific modifications?**

  1.  **Imperfect Correlation:** ECL admits correlations aren't perfect (unlike the Twin case). Lewis would argue this weakens the EDT case further. In CDT, we look at the probability of outcomes *given* the act, holding fixed the past. If the correlation is imperfect, the causal leverage is still zero. The expected utility calculation changes numerically, but the *causal structure* remains: your act does not causally impact the distant agents.
  2.  **Heterogeneous Values:** ECL emphasizes trade across different value systems. Lewis would note that CDT maximizes the agent's *own* values. If I cannot causally promote my values in distant regions, I shouldn't try, even if those regions contain agents who value what I do. The "trade" is illusory because I am not actually delivering the goods; I am merely signaling that the goods are being delivered by someone else.
  3.  **The Scale (Large Worlds):** ECL proponents argue that the sheer number of agents ($N$) makes the evidential weight overwhelming. Lewis would reject this aggregation. In *"Prisoners' Dilemma,"* he anticipates the "Why ain't cha rich?" objection (that CDT agents lose out in Newcomb-like scenarios). His reply is that rationality is not defined by wealth accumulation in worlds rigged against causal agents. If the universe is structured such that causal efficacy is decoupled from evidential import, the rational agent still follows causal efficacy. Multiplying the stakes by infinity ($N \times \text{payoff}$) does not create causal leverage where there is none ($0 \times \infty$).

  **Verdict on Stage 2:** Lewis would view ECL as a scaled-up version of the Newcomb error. He would argue that ECL proponents are conflating *good news* (my decision indicates a cooperative multiverse) with *good outcomes* (my decision causes a cooperative multiverse). He would maintain that a rational agent acts to *make* things happen, not to *learn* that they have happened.

  ### Stage 3: Modal Realism as a Special Problem or Opportunity?

  This is the most distinctively Lewisian angle. ECL is usually framed within inflationary cosmology (many Hubble volumes in one spacetime). Lewis, however, believes in a **Plurality of Worlds** (many spacetimes). Does his Modal Realism make him more receptive to ECL, or less?

  **The Opportunity:**
  One might think Lewis's comfort with "other worlds" makes him open to the idea of valuing distant existents. In *On the Plurality of Worlds*, Lewis argues that possible worlds are concrete and real. However, he also introduces **Counterpart Theory**. I do not exist in other worlds; my *counterparts* do. They resemble me, but they are not *me*.

  **The Problem:**
  Lewis's Modal Realism actually reinforces his CDT conclusion against ECL, perhaps even more strongly than standard cosmology does.
  1.  **Absolute Isolation:** In cosmological ECL, regions are causally disconnected *de facto* (due to distance/expansion). In Lewis's Modal Realism, worlds are causally disconnected *de jure* (by definition). There is no physical signal, even in principle, that can cross worlds. If Lewis treats the "Large World" of ECL as analogous to his Modal Realism, the causal isolation is absolute.
  2.  **The Indexicality of Value:** Lewis is a hedonistic utilitarian of sorts, but his ethics are indexed to the agent's position. In *"Utility and Truth"* and other ethical writings, Lewis suggests we care about our own happiness and the happiness of those we can affect. While he acknowledges we have *some* concern for counterparts (they are, after all, "us" in a loose sense), he denies **trans-world identity**. I am not my counterpart. Therefore, I have no direct obligation to maximize their utility, especially at a causal cost to myself.
  3.  **The "Actuality" Distinction:** For Lewis, "Actual" is indexical. I am in @. ECL asks me to act as if I am a citizen of the Multiverse. Lewis would argue this is a category error. I am an inhabitant of @. My causal powers are limited to @. Even if @ is large, the logic of causal isolation holds. If ECL proponents try to extend the logic to *modal* neighbors (other possible worlds), Lewis would shut it down immediately: you cannot causally affect other possible worlds. If they stick to *cosmological* neighbors (parts of @), Lewis applies the Twin Prisoner's Dilemma logic.

  **A Nuanced Lewisian Concession:**
  There is one area where Lewis might pause. In *"Decision Theoretic Regrets"* (implied in his 1981 work), Lewis acknowledges that if the world is known to be a Newcomb problem, the CDT agent might regret their rationality. If the "Large World" hypothesis is true, and if the correlation is robust, the ECL agent *will* end up with more utility (in terms of their values being satisfied across the multiverse) than the CDT agent.

  Lewis might concede that in a "Large World," **evolutionary selection** would favor ECL-type decision procedures. Agents who act as if they have acausal leverage will correlate with other cooperators and out-reproduce defectors. Lewis, being a naturalist, would accept that ECL agents might dominate the population. But he would distinguish **rationality** from **success**. He would say: "The ECL agents are more successful, but only because the universe is set up to reward irrational (acausal) thinking. I prefer to be rational and poor than irrational and rich."

  ### Conclusion: The Lewisian Verdict

  Had David Lewis encountered ECL, his response would likely have been a firm, textured rejection.

  1.  **Metaphysically:** He would accept the **ontology** of the Large World. He would agree that there are countless counterparts running similar algorithms. He would not dispute the correlation.
  2.  **Decision-Theoretically:** He would reject the **normativity**. He would classify ECL as a sophisticated form of the Newcomb error. The lack of causal mechanism is fatal to the prescription, regardless of the evidential weight. The "Large World" aspect scales the stakes but does not bridge the causal gap.
  3.  **Modally:** His **Modal Realism** would serve as a *reductio* of the ECL intuition. By showing that we can imagine worlds that are maximally similar yet causally isolated, he would argue that similarity alone never generates obligation or causal leverage.

  Lewis's final word on ECL would likely mirror his conclusion on the Twin Prisoner's Dilemma: **"It is sad that the world is so arranged that rationality does not pay. But it is no argument against the definition of rationality that it fails to pay in a world rigged against causal efficacy."** He would view ECL not as a breakthrough in cooperation, but as a category mistake regarding the nature of agency—a attempt to bargain with shadows that, however real they may be, cannot hear you.
