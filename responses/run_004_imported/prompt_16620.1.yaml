answer: |-
  **MEMORANDUM**

  **TO:** University Research Practices Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Finding and Recommendation Regarding Case [ID-Number]: Sequential Analysis and Reporting Standards

  **Introduction**

  This case presents a methodological dispute that cuts to the epistemological core of how we validate empirical claims. We are asked to adjudicate whether a postdoctoral researcher violated data-integrity policy by employing optional stopping in a frequentist framework, despite a post-hoc Bayesian defense. Having reviewed the complaint, the response, and the relevant literature on the foundations of inference, I offer the following finding. My aim is to resolve the immediate dispute without pretending to settle the centuries-old debate between frequentist and Bayesian paradigms, while acknowledging that our institutional policies currently privilege one over the other.

  **The Philosophical Tension**

  To reach a fair verdict, we must engage honestly with the strongest version of the argument made by the respondent (the postdoc), even if we ultimately rule against her procedural conduct.

  The respondent's defense rests on the Likelihood Principle, a cornerstone of Bayesian inference. The principle holds that the evidential import of data is contained entirely within the likelihood function of the observed data. Under this view, the *stopping rule*—the reason data collection ceased—is irrelevant to what the data say about the hypothesis. If the data favor the hypothesis by 8:1 (as her Bayes Factor suggests), they do so regardless of whether she planned to collect 200 participants or stopped at 137 because the trend was clear. From this perspective, sanctioning the researcher for "optional stopping" punishes her for attending to the evidence as it accumulated, imposing a penalty based on counterfactuals (what *might* have happened had she continued) rather than the actual data in hand. This is a coherent, philosophically robust position, and it is increasingly influential in fields grappling with replication crises.

  However, the respondent published a $p$-value ($p = .043$), not a Bayes Factor. The $p$-value is a frequentist construct defined by the probability of obtaining results at least as extreme as the observed data, *assuming the null hypothesis is true and the sampling plan is fixed*. By checking data periodically and stopping upon significance, the researcher altered the sampling distribution. She effectively increased the probability of a false positive (Type I error) beyond the nominal 5% threshold implied by the $p$-value.

  **Finding**

  While the Likelihood Principle offers a compelling philosophical critique of frequentist stopping rules, scientific publishing operates as a social contract. When a researcher reports a $p$-value without qualification, they implicitly invoke the frequentist framework and its associated error-control guarantees. To report a frequentist metric while violating frequentist assumptions is to mislead the reader regarding the reliability of the claim.

  Therefore, the Committee finds that the postdoctoral researcher **did violate the department's data-integrity policy** regarding methodological transparency and reporting standards. This is not a finding of fraud or malicious misconduct; rather, it is a finding of "Questionable Research Practice" in the form of inconsistent statistical reporting. The validity of the Bayesian defense does not excuse the misapplication of frequentist metrics in the original publication. One cannot claim the philosophical immunity of the Likelihood Principle while simultaneously cashing in the currency of frequentist significance.

  **Corrective Action**

  To correct the scientific record without unduly penalizing the researcher for a systemic confusion in the field:

  1.  **Publication Correction:** The corresponding author must submit a formal Correction or Erratum to the publishing journal within **90 days**.
  2.  **Content of Correction:** The notice must explicitly disclose the sequential nature of the data collection and the unregistered stopping rule. It should either:
      *   Report a $p$-value adjusted for sequential testing (e.g., using an alpha-spending function); OR
      *   Formally report the Bayesian analysis (Bayes Factor) as the primary metric of evidence, including the pre-specified prior, while contextualizing the original $p$-value as unadjusted.
  3.  **Data Availability:** The raw data and analysis code must be made publicly available in a recognized repository to allow for independent re-analysis.

  **Forward-Looking Policy Recommendation**

  This case will not be the last of its kind. The tension between flexible data collection (which is often efficient and ethical) and rigid statistical assumptions (which ensure error control) will persist. I recommend the Committee propose the following policy amendments to the Graduate School and Research Office:

  1.  **Pre-Registration of Analysis Plans:** For confirmatory studies intended to support causal claims, researchers must pre-register their sample size determination and stopping rules. Deviations must be justified in the final publication as exploratory.
  2.  **Paradigm Consistency:** Researchers must align their reporting metrics with their design. If a sequential design is used without adjustment, frequentist $p$-values should not be reported as the primary evidence of significance. Conversely, if Bayesian methods are used, priors and stopping intentions must be declared *a priori*.
  3.  **Educational Requirement:** The Psychology Department (and others relying heavily on NHST) should incorporate a module on the foundations of statistical inference into their graduate core, explicitly addressing the implications of optional stopping and the distinction between evidential strength (Bayesian) and error rates (Frequentist).

  **Conclusion**

  We are not here to decide whether Bayes or Fisher was right about the nature of probability. We are here to ensure that the claims made by our researchers are consistent with the methods used to generate them. The respondent's Bayesian argument is philosophically sound but procedurally misapplied in this instance. By requiring a correction that aligns the reported metrics with the actual design, we uphold rigor without stifling methodological evolution.

  I look forward to discussing this draft at our next meeting.
