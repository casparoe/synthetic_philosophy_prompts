answer: |-
  "Look, I know we've all heard the Incompleteness jokes. 'He was incomplete,' 'He couldn't prove he left the room.' Let's let that rest.

  The real gem is the letter to his mother. Gödel wrote, 'If the world is rationally constructed and has meaning, then there must be an afterlife. A *Wiedersehen*.'

  Now, Kurt was a man who needed his proofs airtight. And he had... serious concerns about the sustainability of the physical plane. Specifically, the cafeteria.

  So, technically, he didn't die of starvation. He died because he refused to consume the premises until he was absolutely sure of the conclusion."
