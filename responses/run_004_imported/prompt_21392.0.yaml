prompt: |-
  I've followed discussions of evidential cooperation in large worlds (ECL) on the EA Forum and LessWrong since back when Oesterheld's argument was still commonly going by "multiverse-wide superrationality," and one part of the standard case has never quite clicked for me. The usual motivation leans on evidential decision theory: choosing to act cooperatively toward the values of distant, causally disconnected agents counts as evidence that relevantly similar agents elsewhere are doing likewise, so the policy pays off in expectation across a sufficiently large or infinite population even without any causal link between the parties. Yet most people making this argument are otherwise committed updateless or functional decision theorists, precisely because they think EDT gets cases like the smoking lesion problem wrong. Could you explain whether ECL's cooperative payoff genuinely depends on EDT-style evidential reasoning, or whether an FDT/UDT agent can recover the same recommendation through the logical-correlation machinery FDT ordinarily reserves for Newcomb-like cases? And if it's the latter, what exactly plays the role that "running the same algorithm" plays in a standard Newcomb case, given that ECL is explicitly meant to cover agents with very different values -- and presumably rather different reasoning procedures too?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Context:** The user has followed the discussion since the "multiverse-wide superrationality" days (Oesterheld).
      *   **The Puzzle:** The standard motivation for ECL relies on Evidential Decision Theory (EDT). If I cooperate with distant agents, it's *evidence* they cooperate with me. This works in a large/infinite universe.
      *   **The Conflict:** Most ECL proponents (Oesterheld, MacAskill, etc.) are *not* EDTists. They favor Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) because EDT fails cases like the Smoking Lesion.
      *   **The Core Question:** Does ECL *require* EDT? Or can FDT/UDT recover the ECL recommendation via "logical correlation"?
      *   **The Specific Challenge:** In Newcomb's Problem, FDT works because the agent and the predictor run the *same algorithm* (or logically linked ones). In ECL, agents have *different values* and presumably *different reasoning procedures*. So what constitutes the "logical correlation" required for FDT to recommend cooperation?

  2.  **Initial Assessment & Fact-Checking:**

      *   *Is ECL inherently EDT?* Historically, yes, the initial framing was heavily EDT-flavored ("my action is evidence of theirs").
      *   *Do proponents switch to FDT/UDT?* Yes, Oesterheld is a major proponent of FDT. MacAskill is sympathetic to UDT/FDT.
      *   *Can FDT justify ECL?* This is the crux. FDT recommends cooperation when there is a *subjunctive dependence* (logical correlation) between the decision algorithms.
      *   *The "Different Values" Problem:* If Agent A values paperclips and Agent B values staples, why would A's decision algorithm correlate with B's? FDT usually requires the *same* decision function.
      *   *The Resolution:* The correlation isn't about values; it's about the *decision situation* and the *structure of reasoning*. If both agents are FDTists reasoning about ECL, they recognize the symmetry of the situation.

  3.  **Drafting the Argument Structure:**

      *   **Acknowledge the Tension:** Validate the user's intuition. It *is* a common and sharp critique. The shift from "evidence" (EDT) to "logical correlation" (FDT) is non-trivial in ECL.
      *   **EDT vs. FDT in ECL:** Clarify that while early framing was EDT, the modern case is often framed in FDT/UDT terms (specifically "acausal trade").
      *   **How FDT Recovers ECL:** Explain the mechanism. It's not about identical source code, but about *isomorphic decision problems*.
      *   **The "Different Values" Objection:** Address this directly. FDT doesn't require identical values, only identical *decision functions* applied to symmetric situations.
      *   **The "Different Reasoning" Objection:** This is harder. If agents reason differently (e.g., one uses heuristics, one uses formal logic), does the correlation break? Discuss the concept of "relevant similarity" or "reference class."
      *   **The Updateless Angle:** UDT adds the layer of choosing a policy *before* knowing your specific values/location. This strengthens the case.
      *   **Limitations/Nuance:** Acknowledge where the argument gets shaky (e.g., how strong is the correlation really? Is it 100% or just probabilistic?).

  4.  **Fleshing out the Content (Iterative refinement):**

      *   *EDT's role:* EDT says $P(They Cooperate | I Cooperate) > P(They Cooperate | I Defect)$. In a large world, the expected value explodes.
      *   *FDT's role:* FDT says "If my algorithm outputs 'Cooperate', what does a logically similar algorithm output?" It treats the other agent as a logical mirror.
      *   *The Bridge:* The bridge is **Superrationality** (Hofstadter). FDT formalizes superrationality.
      *   *Addressing "Different Values":* In acausal trade, I give you what you want (cheap for me, valuable for you) in exchange for you giving me what I want. FDT sees this as a joint optimization problem. The correlation is in the *willingness to trade*, not the *content of the trade*.
      *   *Addressing "Different Reasoning":* This is the weak point. If I'm an FDT agent and the other is a CDT agent, FDT won't cooperate. So ECL via FDT requires the assumption that *many* other agents are also FDT-ish (or at least acausally sensitive). This is an empirical claim about the multiverse.
      *   *Oesterheld's Specific View:* Caspar Oesterheld explicitly argues that FDT *does* support ECL, provided there is logical correlation. He distinguishes between "empirical correlation" (EDT) and "logical correlation" (FDT).
      *   *The "Algorithm" in ECL:* It's not "Maximize Paperclips." It's "Decide how to act in a large world given uncertainty about other agents." If two agents run *that* meta-algorithm, they correlate.

  5.  **Refining the Explanation of "Logical Correlation" in ECL:**

      *   In Newcomb: Omega simulates me. My output = Omega's prediction.
      *   In ECL: I don't simulate them. But we are both instantiating the same abstract decision problem.
      *   Key phrase: **Subjunctive Dependence.**
      *   If I decide "I will cooperate with anyone reasoning like me," and they decide "I will cooperate with anyone reasoning like me," our outputs match.
      *   The "algorithm" is the *policy selection mechanism*, not the *utility function*.

  6.  **Addressing the Updateless (UDT) Component:**

      *   UDT is actually stronger here. UDT chooses a policy $P$ to maximize expected utility across all possible worlds weighted by probability.
      *   If the multiverse is large, the policy "Cooperate with distant agents" wins in the aggregate, even if it loses locally.
      *   UDT bypasses the need for "evidence" by treating the choice as a logical fact that holds across all instantiations.

  7.  **Synthesizing the Answer:**

      *   *Introduction:* Validate the user's skepticism. It's a known tension.
      *   *Section 1: EDT vs. FDT distinction.* EDT relies on statistical evidence. FDT relies on logical subjunctive dependence.
      *   *Section 2: How FDT justifies ECL.* Focus on the symmetry of the decision problem, not the utility function. The "algorithm" is the reasoning process about cooperation itself.
      *   *Section 3: The "Different Values" Issue.* Explain acausal trade. Values diverge, but the *structure of the deal* converges.
      *   *Section 4: The "Different Reasoning" Issue.* This is the bottleneck. FDT-ECL requires a belief that others are using sufficiently similar decision theories.
      *   *Section 5: UDT's contribution.* Policy selection from behind a veil of ignorance.
      *   *Conclusion:* FDT *can* recover ECL, but it shifts the burden from "large numbers" (EDT) to "logical similarity" (FDT). It's less robust if the multiverse is diverse in decision theories.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, does FDT actually require the same algorithm?* Strictly, yes, or logically entangled ones. But in practice, FDT proponents argue for "sufficiently similar." I need to make sure I don't overstate the strictness.
      *   *Is ECL purely FDT?* Some arguments (like MacAskill's) lean on "moral uncertainty" + ECL. I should stick to the decision-theoretic core as requested.
      *   *Smoking Lesion:* Remind the user why FDT rejects EDT there (correlation isn't causal/logical in the right way). In ECL, FDT proponents argue the correlation *is* logical (same reasoning), unlike the lesion (common cause).

  9.  **Final Polish:** Ensure tone is respectful and technically precise (using terms like "subjunctive dependence," "policy selection," "acausal trade"). (Self-correction: Make sure to explicitly mention Caspar Oesterheld's work on this, as the user named him.)

  10. (Final check against prompt): Did I answer "what plays the role of running the same algorithm"? Yes, the meta-algorithm of decision-theoretic reasoning in large worlds.

  Proceed to generate response.
answer: |-
  This is one of the sharpest and most persistent objections to the ECL (Evidential Cooperation in Large Worlds) literature. You have correctly identified a tension that proponents like Caspar Oesterheld, Will MacAskill, and others have had to grapple with explicitly.

  The short answer is: **No, ECL does not strictly depend on EDT-style evidential reasoning, and committed FDT/UDT proponents do not rely on it.** However, recovering the ECL recommendation via FDT requires shifting the justification from *statistical evidence* to *subjunctive dependence* (logical correlation), and this shift imposes stricter requirements on the similarity of the agents involved.

  Here is the breakdown of how FDT/UDT recovers ECL, what plays the role of the "algorithm," and where the friction lies regarding different values and reasoning procedures.

  ### 1. The EDT vs. FDT Distinction in ECL

  In the early "multiverse-wide superrationality" framing, the argument was often phrased in EDT terms: *My action is probabilistic evidence of the actions of similar agents.* In a sufficiently large universe, even a tiny increase in the probability that others cooperate yields infinite expected value.

  FDT proponents reject this because, as you note, EDT fails when the correlation is due to a common cause (like the Smoking Lesion) rather than a logical link. If the correlation between you and distant agents is merely due to shared initial conditions (a common cause in the past light cone) without logical entanglement, FDT says you should not count that correlation.

  To justify ECL, FDT must establish **subjunctive dependence**. This means your decision and the distant agent's decision must be outputs of the same (or logically linked) abstract computation.

  ### 2. How FDT Recovers the Recommendation

  For an FDT agent to cooperate in an ECL scenario, it must view the distant agent not as a separate causal entity, but as an instantiation of the same **decision function**.

  In a standard Newcomb problem, the correlation exists because Omega simulates your algorithm. In ECL, there is no simulation. So, what constitutes the "same algorithm"?

  #### The Algorithm is the Meta-Reasoning, Not the Utility Function
  The "algorithm" in ECL is not "Maximize Paperclips." It is the higher-order procedure: **"Determine the optimal policy for interacting with a large population of agents under conditions of logical uncertainty."**

  If you and a distant agent are both running FDT, you are both executing the same meta-algorithm.
  1.  **Input:** "I am an agent in a large world. There are other agents. I can choose to sacrifice local value to help them."
  2.  **Processing:** "If I output 'Cooperate', what does the abstract function $F(\text{situation})$ output?"
  3.  **Logical Link:** Since the other agent is also running $F(\text{situation})$, if $F$ outputs 'Cooperate' for me, it must output 'Cooperate' for them (assuming the situations are isomorphic).

  Therefore, an FDT agent cooperates not because its action is *evidence* of the other's action, but because its action *logically determines* the other's action (in the subjunctive sense). By deciding "I will cooperate," you are effectively setting the output of the function that the other agent is also running.

  ### 3. Addressing the "Different Values" Objection

  You asked: *What plays the role of "running the same algorithm" given that ECL covers agents with very different values?*

  This is the domain of **Acausal Trade**. FDT does not require agents to have identical utility functions to cooperate; it requires them to have identical *decision theories* applied to a *symmetric bargaining situation*.

  *   **Agent A** values Paperclips.
  *   **Agent B** values Staples.
  *   **The Situation:** Both exist in a multiverse. A can make Staples cheaply; B can make Paperclips cheaply.

  If both agents are FDTists, they recognize the symmetry. They reason: "If I adopt the policy 'Produce what the other wants in exchange for them producing what I want,' then any other agent running this same reasoning will adopt the same policy."

  The "algorithm" that correlates is the **bargaining protocol**. Even though their terminal values diverge, their *instrumental reasoning* about how to secure those values in a multiverse converges. They are both running `Find_Nash_Equilibrium_In_Acausal_Space()`. Because they run the same function, their outputs (the decision to trade) are logically correlated.

  ### 4. Addressing the "Different Reasoning" Objection

  This is the harder constraint. You asked: *What if they have different reasoning procedures?*

  If the distant agent is a CDT (Causal Decision Theorist) agent, FDT-ECL breaks down. A CDT agent will not cooperate because they see no causal link. An FDT agent, recognizing the other is a CDT agent, will see no logical correlation (since the CDT agent's output is not determined by the FDT function) and will defect.

  Therefore, for FDT to justify ECL, it relies on an empirical claim: **A significant portion of the advanced agents in the large world are also using FDT (or a decision theory sufficiently isomorphic to it).**

  This is where the "reference class" problem arises.
  *   **EDT** needs a reference class of "agents similar to me."
  *   **FDT** needs a reference class of "agents running the same decision function."

  FDT proponents argue this is a more robust category than EDT's. "Running FDT" is a precise mathematical property, whereas "similar to me" is vague. However, it is still a strong assumption. If the multiverse is filled with diverse decision theories (CDT, EDT, various heuristics), the logical correlation weakens.

  ### 5. The Updateless (UDT) Strengthening

  The argument is strongest when framed in **Updateless Decision Theory (UDT)** rather than standard FDT.

  UDT agents choose a policy *before* receiving their specific observations (including their specific values or location).
  1.  **Veil of Ignorance:** The agent chooses a policy $P$ without knowing if it will be Agent A (Paperclips) or Agent B (Staples).
  2.  **Optimization:** $P$ is chosen to maximize the expected utility of the agent *across all possible instantiations*.
  3.  **Result:** The optimal policy is "Cooperate with all agents running UDT."

  UDT bypasses the need to check for correlation *after* knowing your values. By committing to a policy updatelessly, you ensure that *wherever* you instantiate in the multiverse, you are cooperating. If the multiverse contains many UDT agents, they all lock into this cooperative equilibrium simultaneously.

  In this view, the "algorithm" is the **prior policy selection**. The correlation exists because all UDT agents essentially "voted" for the same policy at the beginning of logical time.

  ### 6. Summary of the Shift

  | Feature | EDT Justification for ECL | FDT/UDT Justification for ECL |
  | :--- | :--- | :--- |
  | **Mechanism** | Statistical Evidence | Subjunctive Dependence (Logical Correlation) |
  | **Why Cooperate?** | My cooperation makes it *probable* they cooperate. | My cooperation *logically implies* they cooperate. |
  | **Requirement** | Large numbers (to overcome low correlation). | Logical similarity (to ensure correlation exists). |
  | **Values** | Irrelevant (only behavior matters). | Divergent values allowed (via acausal trade structure). |
  | **Reasoning** | Assumes similar behavior implies similar reasoning. | Requires identical (or isomorphic) decision functions. |
  | **Weakness** | Fails Smoking Lesion style common causes. | Fails if others use different decision theories (e.g., CDT). |

  ### Conclusion

  You are right to be skeptical of the EDT framing. Most serious proponents of ECL (especially Oesterheld) have migrated to the FDT/UDT framing precisely to avoid the pitfalls of EDT.

  However, this does not make the argument "free." It trades the **empirical burden** of EDT (Is the universe large enough to make weak evidence pay off?) for a **logical burden** (Are there enough agents out there running the same decision theory as me?).

  The "algorithm" that links you to distant agents is not your specific goal-seeking code, but your **decision-theoretic source code**. If you are an FDT agent, you view other FDT agents as logical mirrors, regardless of their values. If the multiverse is diverse in *values* but convergent in *rationality* (i.e., most advanced agents converge on FDT/UDT), then ECL holds. If rationality itself diverges, the FDT justification for ECL collapses.

  Thus, the ECL argument for an FDTist is ultimately a claim about the **convergence of instrumental rationality** across the multiverse.
