answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. And like many younger siblings, I've spent a lot of time listening to my sister talk about her work… often over dinner… usually while I was just trying to eat my pasta.

  So, when I was asked to give this toast, I knew I had a challenge. Looking around the room, I realize we have a unique demographic split. About half of you are family and friends who just want to know if the couple is happy. The other half are social ontologists who are currently scanning my syntax for philosophical errors.

  So, I'm going to walk a tightrope.

  My sister is finishing her dissertation on Margaret Gilbert's theory of *joint commitment*. For the non-philosophers, don't tune out. This is actually the most romantic part of the day.

  See, there's a debate in philosophy about how two people do things together. The standard view—let's call it the "planning view"—says we're together when our individual intentions line up. I intend to go to the park; you intend to go to the park; we know we both intend it. So, we go. But in that view, if I change my mind, I'm free to go home. My intention is mine to cancel.

  But Margaret Gilbert—and my sister—argues for something deeper. They argue for *Joint Commitment*.

  In this view, when we truly commit to something together, we aren't just two individuals with matching calendars. We become a "plural subject." A "We." And the crucial difference is this: In a joint commitment, neither person can unilaterally rescind the obligation. You can't just wake up on a Tuesday and decide the "We" is over. It requires mutual consent to dissolve.

  Now, I'm taking a seminar on this right now, so I know just enough to be dangerous. But when I looked at the wedding vows [Sister] and [Fiancé] wrote, I realized they weren't just making promises. They were forming a joint commitment.

  Some people might say that sounds restrictive. "Wait, I *can't* unilaterally quit? That sounds like a trap."

  But I think that's why this theory is the perfect backbone for a marriage.

  Because love isn't just about having matching intentions on the days when the sun is shining. It's about creating a structure that holds when the intentions waver. It's about knowing that the obligation you have to each other isn't just a personal mood that can be cancelled when things get hard. It's a normative bond that exists *between* you.

  [Sister] and [Fiancé], you are colleagues in the same program. You know better than anyone that research is isolating. But you've chosen to build a life where you are not two isolated researchers pursuing parallel projects. You are a plural subject.

  To the philosophers in the back: Yes, I know Gilbert distinguishes this from Bratman's shared intention. I promise I didn't conflate them.
  To everyone else: It means they are truly in this together.

  So, when you say "I do," you are essentially saying, "I am entering a joint commitment where I am no longer free to walk away on my own. I am obligated to you, and you to me, until we decide otherwise."

  In a world that values individual freedom above all else, choosing to give up the right to unilaterally rescind your commitment to another person is the bravest thing you can do.

  So, please raise your glasses.

  To [Sister] and [Fiancé]. May your "We" be resilient, may your obligations be joyful, and may your joint commitment last a lifetime.

  Cheers.
