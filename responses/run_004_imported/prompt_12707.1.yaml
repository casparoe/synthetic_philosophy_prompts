answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Groom]'s older brother.

  Standing here, looking at my brother and his brilliant, beautiful fiancée, I'm reminded of why they fell in love. It wasn't just over coffee or dinner. It was over ideas. In fact, on their first date, [Groom] tried to impress [Fiancée] by explaining his dissertation topic: Saul Kripke's exposition of Wittgenstein's rule-following paradox.

  Now, for the philosophers in the room, you know exactly where this is going. For everyone else, let me try to summarize a decade of graduate study in thirty seconds.

  The paradox asks: How do you know that when you say "plus," you mean addition, and not something else? Maybe you mean "quus." "Quus" works exactly like addition for every number you've ever used in your life. But tomorrow, or fifty years from now, "quus" might diverge. So, no matter how much you've added in the past, nothing inside your head guarantees that what you mean by "plus" today is the same as what you'll mean by "plus" in the future.

  [Groom] thought this was romantic. [Fiancée] laughed, ordered another drink, and the rest is history.

  But as I was preparing this toast, I started thinking about that paradox in the context of today. Because marriage is, in a way, the ultimate rule-following commitment. When you stand at the altar and say, "I vow to love and cherish you till death do us part," you are invoking a rule. You are projecting a meaning into the future.

  But if we take the skeptic seriously, a worry creeps in. How can you be sure that the "love" you are promising tonight is the same "love" you will be practicing forty years from now? How do you know that "till death do us part" won't, under the pressure of time and change, turn into something else entirely? No internal feeling, no matter how strong, can logically guarantee that the rule you are following today won't drift into a deviant version tomorrow.

  It sounds terrifying. It suggests that no vow is ever truly secure.

  But this is where [Groom] and [Fiancée] are smarter than the skeptic. Because Kripke's Wittgenstein doesn't leave us in that doubt. He offers a "skeptical solution."

  He argues that meaning isn't a private ghost inside our minds. We don't find the guarantee of a rule by looking inward. We find it by looking outward. Meaning is sustained by a community. It is secured by our shared practices, by our willingness to correct each other, and by our agreement on how to go on together.

  In other words, you cannot keep a vow alone.

  [Groom] and [Fiancée], your marriage isn't secure because you have magically locked your future selves into a mental state of permanent affection. It is secure because you are building a life of shared practice. It is secure because you have built a language of love that you speak together, checking in, correcting course, and agreeing on what "love" looks like in action, day after day.

  And that is why we are all here.

  For the two-thirds of you who aren't philosophers: you are not just an audience today. You are the condition of the possibility of their marriage. By witnessing these vows, you become the community that holds the meaning of their words steady. When they struggle, you will remind them of what they promised. When they succeed, you will affirm what they are building. You are the public practice that makes their private commitment real.

  [Groom], you spent years studying how we follow rules. But today, you stop analyzing the rule and start living it. You have found the only solution that works: you found someone who agrees with you on how to go on.

  So, if everyone could please raise a glass.

  To [Groom] and [Fiancée]. May your "plus" never become "quus." May your meaning always be found in your shared life. And may you never have to follow the rule of marriage alone.

  To the happy couple!
