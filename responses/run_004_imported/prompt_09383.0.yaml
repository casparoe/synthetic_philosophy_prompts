          *   **Nuance:** Lewis's counterparts are *not* "you." They are distinct individuals who resemble you. The user says "a version of literally me." Lewis would say "a counterpart of you." Physics (Everett) might say "a branch of your wavefunction," which is closer to "you," but identity over branching is a philosophical nightmare.
