      *   **Topic:** Multiverse theory in physics vs. David Lewis's Modal Realism in philosophy.
      *   **Core Claim:** The user suggests that the growing acceptance of the multiverse in physics vindicates Lewis's Modal Realism.
      *   **Implication:** Therefore, there must be literal counterparts of "me" living out every possible life choice (other job, stayed with ex, etc.).
