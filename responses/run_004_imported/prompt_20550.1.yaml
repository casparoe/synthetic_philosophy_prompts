      *   **Core Argument:** Standard possible-worlds semantics implies agents know all logical consequences. Impossible worlds allow $P$ and $P \to Q$ to be true while $Q$ is false in the agent's doxastic alternatives.
      *   **Speaker's Defense/Weakness:** When challenged that this just "relocates" the problem (restricting accessibility without explanation) or lacks psychological mechanism, she says: "You're asking the model to do psychology's job for it." This shuts down conversation.
      *   **Goal:** 8-10 questions that prevent restatement and block the "psychology's job" dodge.
