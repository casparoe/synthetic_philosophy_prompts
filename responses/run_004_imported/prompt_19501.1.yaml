answer: |-
  You have indeed gone down a classic rabbit hole, and you've identified the exact friction point where the math stops being "cute analysis trivia" and starts breaking normative decision theory. You are correct on the citation: it's Alan Hájek and Harris Nover, "The Pasadena Paradox" (2004).

  Your intuition about the "natural order" ($n=1, 2, 3...$) is the most common first reaction. It feels like the obvious fix: *The coin flips happen in time, so the expectation should be the limit of the partial sums in temporal order.*

  Here is why decision theorists reject that stipulation, why it's considered a foundational crisis rather than a quirk, and how it relates to the Pascal's Mugging/fanaticism debates.

  ### 1. Why the "Natural Order" Fix Fails

  The core reason you can't just stipulate the temporal order is that **Expected Utility is supposed to be a property of the gamble, not a property of your bookkeeping.**

  In decision theory, a lottery is defined as a mapping from states of the world to outcomes (or utilities). The "index" $n$ is just a label we attach to the states to keep track of them. It is not an intrinsic part of the ontology of the gamble.

  **The Description Invariance Principle**
  Rational choice theory generally assumes that if two descriptions represent the exact same physical situation, they should yield the same recommended action.
  *   **Description A:** I label "Heads on flip 1" as state $\omega_1$, "Heads on flip 2" as $\omega_2$, etc. I sum in order $1, 2, 3...$ Result: $\ln(2)$.
  *   **Description B:** I label "Heads on flip 2" as state $\omega_1$, "Heads on flip 1" as $\omega_2$, etc. I sum in order $1, 2, 3...$ (which corresponds to physical flips $2, 1...$). Result: Something else.

  If the value of the game depends on which integer I assign to which outcome, then Expected Value isn't measuring the *value of the game*; it's measuring *the order in which I wrote down the states*. That makes value subjective in a way that violates the objectivity required for a normative theory. It implies that an agent could change the value of a gamble simply by renumbering their files.

  **The Integration Problem**
  Mathematically, Expected Value is an integral over a probability space: $E[U] = \int U dP$.
  In measure theory (the rigorous foundation of probability), the Lebesgue integral is defined such that it is independent of the ordering of the domain *only if* the integral converges absolutely. If a series is only conditionally convergent (like the Pasadena game), the Lebesgue integral is technically **undefined**.

  By stipulating a specific order, you are effectively switching from a Lebesgue integral to a specific Riemann-style summation limit. You are changing the mathematical definition of Expectation to save the theory. Decision theorists argue that if your definition of Expectation requires arbitrary stipulations to yield a number, the definition is doing too much work.

  ### 2. Why This is Damning for Expected Utility (EUT)

  It's not just that the number is weird; it's that **EUT loses its normative force.**

  **Paralysis**
  If the Expected Utility of the Pasadena game is undefined, then standard EUT cannot tell you whether to play it, reject it, or pay \$1 to avoid it. It renders the theory silent. A normative theory that goes silent on clear-cut cases (like "would you play this coin game?") is failing its job.

  **Violation of Dominance**
  This is the killer argument.
  Imagine Game P (Pasadena) and Game P+ (Pasadena plus \$1 in every single possible outcome).
  Intuitively, P+ strictly dominates P. In every possible world, you get \$1 more. Rationality demands you prefer P+ to P.
  *   $Utility(P+) = Utility(P) + 1$
  *   But if $Utility(P)$ is undefined, then $Utility(P) + 1$ is also undefined.
  *   EUT cannot formally express the preference for P+ over P because it cannot assign values to compare.

  This suggests that the axioms of Expected Utility (like Von Neumann-Morgenstern) are inconsistent with unbounded utility functions over infinite state spaces. You have to give up one: either infinite states, unbounded utility, or the EUT axioms themselves.

  ### 3. Pasadena vs. Pascal's Mugging (Fanaticism)

  This is the bonus question, and it's crucial for the EA/LessWrong context. They are siblings, but they attack different flanks.

  **The Difference**
  *   **Pascal's Mugging / Fanaticism:** The expectation **diverges to infinity** (or is astronomically large). The problem is that the theory tells you to do something absurd (pay the mugger) because the math says "Infinity > \$5".
  *   **The Pasadena Paradox:** The expectation **does not exist**. The problem is that the theory tells you *nothing*. It doesn't say "play the game"; it says "I cannot compute a value."

  **The Connection**
  Both pathologies arise from the same source: **Unbounded Utility + Infinite State Space.**
  *   St. Petersburg shows that unbounded utility leads to infinite EV.
  *   Pasadena shows that even if you try to fix St. Petersburg (by making the terms shrink faster so it *looks* like it should converge), the lack of *absolute* convergence breaks the math entirely.

  **Does Pasadena bite in the real world?**
  Less than Mugging, but it's more dangerous theoretically.
  *   **Mugging** is a practical risk for AI alignment. An AGI maximizing unbounded utility might actually divert all resources to chasing low-probability, high-impact scenarios (e.g., simulating ancestors to save them).
  *   **Pasadena** is less likely to occur physically because it requires a very specific alternating structure of payoffs that likely doesn't map to real-world resources (which are usually non-negative).

  However, Pasadena is arguably *more* damning for theorists. With Mugging, you can say, "Okay, the EV is huge, maybe we need a discount rate." With Pasadena, you can't even calculate the EV to argue about it. It proves that **Expected Value is not well-defined for general unbounded utilities.**

  **The Consensus Take**
  Most decision theorists and rationalists who take this seriously conclude that **utility functions must be bounded.**
  If your utility function has a hard cap (e.g., no outcome can be worth more than $10^{100}$ utils, or simply has an asymptote), then the series *must* converge absolutely. The Pasadena paradox disappears, and Pascal's Mugging is neutered (because the "astronomical payoff" gets capped at the bound).

  The cost of this solution is accepting that there is some finite amount of suffering or happiness that is "just as bad/good" as infinite suffering or happiness, which some find morally repugnant. But mathematically, it's the cleanest way to stop the rabbit hole.

  ### Summary
  You can't stipulate the order because rational value shouldn't depend on how you label the states of the world. The paradox is damning because it breaks the Dominance principle and renders EUT silent. And while Pasadena is less of a practical risk than Pascal's Mugging, it provides the rigorous mathematical proof that **unbounded utility functions are incompatible with standard Expected Utility Theory.**

  If you want to keep EUT, you generally have to accept bounded utility. If you keep unbounded utility, you have to abandon standard EUT (looking at things like hyperreal decision theory or relative expectation), which is a much heavier lift.
