answer: |-
  The room was soundproofed, but Elias could feel the hum of the servers through the soles of his shoes. It was a low, vibrational thrum, the sound of money waiting to be allocated. On the table between him and Mara sat the Terminal. It was a sleek, black slab with a single haptic interface and a countdown timer glowing in red numerals: 00:14:59.

  They were negotiating the merger of Helios and Vantage, two energy conglomerates whose grid infrastructure had become dangerously entangled. If they didn't agree on a load-sharing protocol within fifteen minutes, the automated safety systems would interpret the silence as a grid instability event. Both companies would be locked out. Both would bankrupt.

  But this wasn't a normal negotiation. This was a Binding Protocol arbitration.

  Under the new antitrust laws, human hesitation was considered a market inefficiency. So, the terms had to be submitted via smart contract. Once a key was pressed, the offer was cryptographically sealed. It could not be altered, withdrawn, or conditioned. It was irrevocable. The first party to lock in a demand set the Schelling point. The second party had only two choices: accept the terms or trigger the mutual default.

  Elias knew the game theory. He had taught it, once, before he was hired to play it. It was the Commitment Race. In a game of Chicken, the winner is the driver who convincingly throws their steering wheel out the window before the other driver does. But in the digital age, you didn't need to throw the wheel. You just had to code the car to drive straight.

  "Fourteen minutes," Mara said. Her voice was flat. She wasn't looking at him; she was looking at her tablet, where spreadsheets cascaded like waterfalls. "My analysts say the optimal split is sixty-forty. Helios takes sixty. We have the larger legacy infrastructure."

  "My analysts say fifty-fifty," Elias replied. He kept his hands in his lap. He was afraid to touch the table. "If we split the maintenance costs evenly, both stocks stabilize."

  "Sixty-forty," Mara insisted. "If I submit a sixty-forty demand in the first minute, you have to calculate whether fighting is worse than accepting. That takes time. If I lock it in, I win."

  Elias felt a cold knot tighten in his stomach. This was the pathology. In a rational world, they would spend fourteen minutes finding the efficient frontier, the deal that maximized value for both. But the Protocol rewarded the first person to stop thinking.

  If Elias spent ten minutes running simulations to prove that sixty-forty would eventually crash Helios's stock, Mara could submit her demand at minute eleven. She would have committed to a position that hurt Elias. Elias would then have one minute to decide: accept the bad deal, or let both companies die. Rational choice dictates you accept the bad deal rather than die. Mara knows this. So Mara should commit early.

  But Elias knows Mara knows this. So Elias should commit even earlier.

  "Twelve minutes," the Terminal announced.

  Elias opened his own tablet. He had a draft ready. *Fifty-fifty split. Joint oversight.* It was the sensible deal. It was the deal a wise negotiator would make.

  And that was why he couldn't submit it.

  Wisdom required verification. To be wise, Elias had to check the clauses. He had to ensure the language held up in court. He had to *think*. But thinking took time. Every second he spent reasoning was a second in which Mara could blind-commit to *Ninety-Ten*.

  If Mara submitted a Ninety-Ten demand at minute two, she wasn't being rational. She was being crazy. But in the Commitment Race, insanity is a strategic asset. If she locks in a demand that is suicidal for him but merely painful for her, she forces his hand.

  The only defense against a crazy commitment is a crazier one.

  "Ten minutes," said the Terminal.

  Mara's fingers were hovering over her tablet. She wasn't typing. She was staring at the screen, her brow furrowed. She was calculating. She was being rational.

  *She's losing,* Elias realized with a jolt of vertigo. *She's trying to find the optimal number. She doesn't realize the number doesn't matter. Only the timestamp matters.*

  If he waited for her to finish her calculation, she would see him waiting. She would realize he was deliberating. And then she would know she had the advantage. She could stop calculating, pick a number at random, and lock it in.

  To win, Elias had to prove he didn't care about the number. He had to prove he was willing to burn the grid rather than yield. But how do you prove that when you are a man in a suit who wants to keep his job?

  You don't think.

  The horror of it washed over him. The logic of the Protocol demanded that he lobotomize his own decision-making process. To be a credible agent, he had to become a machine that did not evaluate consequences. If he evaluated the consequences, he might find that mutual default was too high a price. If he believed that, he would swerve. Mara would anticipate the swerve.

  He had to make himself unable to swerve.

  "Eight minutes."

  Elias typed. *Ninety-Ten. Helios takes ninety.*

  His finger hovered over the submit key.

  This was suicide. If Mara did the same, they both defaulted. The grid would crash. Millions would lose power. His pension would vanish. Hers too. A rational agent would never submit this.

  *Exactly,* the voice in his head whispered. *A rational agent loses.*

  To make the commitment credible, he couldn't hesitate. If he paused, Mara would see the latency on the server logs. She would know he was scared. She would know he was still thinking.

  Thinking was the liability. Deliberation was the weakness. The capacity to understand the downside was the very thing that would destroy him.

  He looked at Mara. She was sweating. She was still looking at her spreadsheets. She was trying to be smart. She was trying to be a good negotiator. She was doomed.

  "Elias," she said, her voice trembling slightly. "We don't have to do this. We can signal. We can agree verbally and then type it in."

  "The Protocol logs keystroke dynamics," Elias said. His voice sounded distant to him. "If I type slowly, it shows hesitation. If I hesitate, you know I'm bluffing."

  "So don't bluff."

  "I can't. Because you can't."

  He saw the realization hit her eyes. It was a terrible clarity. She understood that as long as she retained the capacity to reason, she was vulnerable to anyone who had abandoned it. She looked at her tablet, then at the Terminal.

  "If we both commit hard," she said, "we both die."

  "Yes."

  "Then one of us has to yield."

  "Yes. But whoever yields has to yield *before* the other commits. And to yield early is to admit you're still thinking. And if I know you're thinking, I can commit."

  "Six minutes."

  The air in the room felt thin. Elias felt a strange dissociation, as if he were watching himself from the corner of the ceiling. He was watching a man prepare to destroy his own life because the rules of the game punished self-preservation.

  He thought about Newcomb's Problem. He thought about the Unexpected Hanging. Those were puzzles. This was a trap. The trap wasn't in the room; it was in the logic itself. The system was designed to select for agents who could not process risk. It selected for the blind.

  "I'm going to submit," Mara said. Her hand moved toward her tablet.

  "Don't," Elias said. "If you submit anything less than total, I have to beat it. If you submit total, I have to match it."

  "Then what do we do?"

  "We stop thinking."

  Elias closed his eyes. He needed to kill the part of his brain that calculated risk. He needed to find a state of pure, unreflective action. He thought about the steering wheel. Schelling's driver didn't look at the oncoming car. He looked at his own hands throwing the wheel.

  Elias opened his eyes. He didn't look at the numbers on his screen. He didn't check the clauses. He didn't verify the encryption hash. To check was to doubt. To doubt was to lose.

  He placed his finger on the haptic surface.

  "Elias, wait," Mara said. She stood up. "We can walk out. We can breach the contract."

  "Breach triggers immediate default," Elias said. "The code is the law."

  "The code is insane."

  "The code is rational," Elias corrected. "It optimizes for speed. It optimizes for commitment. We built it to remove human error. This isn't error. This is the output."

  "Four minutes."

  Mara sat back down. She looked defeated. Not by him, but by the structure of the table between them. She picked up her tablet. She deleted her spreadsheets. She cleared the calculations. She opened a blank command line.

  She was doing what he had done. She was stripping away the wisdom. She was making herself stupid enough to win.

  Elias felt a surge of pity, and then he crushed it. Pity was a calculation. Pity implied he valued her outcome. He couldn't value anything. He had to be a vector.

  "Three minutes."

  They sat in silence. The hum of the servers grew louder, or perhaps it was just the blood in Elias's ears. He realized that this was the true cost of credible commitment. It wasn't the risk of the crash. It was the necessity of becoming the kind of person who could cause one. To survive the negotiation, he had to cease being a partner and become a force of nature.

  He looked at Mara. She was staring at her screen, her face pale. She had found the same void he had. She had accepted that to save her company, she had to be willing to kill it.

  "Two minutes."

  Elias took a breath. He didn't exhale. He pressed the key.

  The Terminal chimed. A green light pulsed. *COMMITMENT RECEIVED. IRREVOCABLE.*

  He didn't look to see what he had submitted. He didn't want to know. Knowing would bring regret. Regret was a post-calculation emotion. He had pre-committed.

  Mara saw the light. She flinched. She looked at him, her eyes wide with a mixture of awe and terror. She understood what he had done. He had burned his bridge before crossing it. He had made it impossible to turn back.

  Now the pressure was entirely on her. She had one minute. She could accept his terms, whatever they were, or she could submit her own counter-commitment. If she submitted a counter-commitment, the system would compare them. If they were incompatible—which they would be, since both were now locked into maximum aggression—the grid would sever.

  She looked at her tablet. Her finger trembled.

  She had the capacity to think. She could still calculate the probability of Elias bluffing. She could still reason that no one would actually press the button.

  But she saw the green light on the Terminal. She saw the absolute stillness in Elias's posture. He wasn't watching her. He was watching the clock. He had already left the room.

  To think was to die.

  Mara closed her eyes. She pressed her key.

  *COMMITMENT RECEIVED. IRREVOCABLE.*

  The Terminal processed the inputs. The red timer stopped at 00:00:45.

  For a long moment, nothing happened. The servers hummed. The air conditioning cycled.

  Then, the screen on the Terminal changed. It didn't show a deal sheet. It didn't show a transfer of funds.

  It showed a single line of text: *INCOMPATIBLE PARAMETERS. INITIATING SAFETY PROTOCOL.*

  Elias watched the words appear. He felt nothing. He had trained himself not to feel.

  Mara let out a sound that was half-laugh, half-sob. "We won," she whispered. "We played it perfectly."

  "Yes," Elias said.

  "The logic was sound," she said. "We committed. We didn't hesitate. We were the ideal agents."

  "Yes."

  Outside the soundproof room, somewhere in the vast, dark web of the grid, the circuits began to trip. The load-sharing agreement had failed. The safety protocols interpreted the incompatible commitments as a hostile signal. The connection severed.

  Helios and Vantage were now isolated. Both would fail. The stocks would tank by morning. The lights in the city might flicker, but they would stay on. The people wouldn't know why the lights stayed on while the money vanished.

  Elias stood up. His legs felt heavy. The vertigo was gone, replaced by a flat, gray exhaustion. He had won the game. He had demonstrated the highest form of rationality defined by the system. He had proven he could bind his own hands tighter than his opponent.

  "See you in bankruptcy court," Mara said. She didn't move to shake his hand. There was no point. They were no longer negotiators. They were evidence.

  "See you there," Elias said.

  He walked to the door. He didn't look back at the Terminal. He didn't look back at the green lights that signaled a successful submission. He thought about the steering wheel, spinning on the asphalt, miles away from the crash. He thought about how clean it looked, tumbling through the air, before the metal met the stone.

  He opened the door and stepped out into the hallway. The air was cooler here. He took a breath, and for the first time in fifteen minutes, he allowed himself to think. He thought about how he would explain this to his wife. He thought about the house. He thought about the shame.

  It was a very human thought. It was irrational. It was too late to matter.

  And as he walked toward the elevator, Elias Thorne understood the final joke of the Commitment Race. The system didn't select for the winners. It selected for the survivors. And in a world of binding commitments, there was no one left to survive.
