answer: |-
  It is a pleasure to address a question from someone who has spent a career applying these tools in the laboratory. Your intuition is shared by many who first encounter the Lewis-Teller Diachronic Dutch Book argument: it feels as though the same "coherence" logic that locks you into the probability axioms at a single instant should lock you into Conditionalization across time.

  However, the reason Bayesian epistemologists treat Conditionalization as a substantive, debatable postulate rather than a mere corollary of Probabilism comes down to a structural distinction in the mathematics and a philosophical distinction in the norms involved.

  To put it in terms familiar to your background: **Probabilism is a constraint on the state space, while Conditionalization is a dynamical law.** You cannot derive the Schrödinger equation solely from the requirement that a wavefunction be normalized; you need an additional postulate about how the system evolves. Similarly, you cannot derive Conditionalization solely from the Kolmogorov axioms; you need an additional postulate about how credences relate across time.

  Here are the specific reasons why the Diachronic Dutch Book argument (DDA) is considered less "clean" and more substantive than the Synchronic Dutch Book argument (SDA).

  ### 1. The Logical Gap: Static vs. Dynamic
  The Synchronic Dutch Book argument shows that if your credences at time $t$ violate the probability axioms, there exists a set of bets available *at $t$* that guarantees a loss. The axioms of probability are essentially the axioms of consistent logic applied to degrees of belief. Violating them is akin to asserting $A$ and $\neg A$ simultaneously.

  The Diachronic argument, however, attempts to link time $t_1$ to time $t_2$. The probability axioms themselves are timeless; they govern a single probability function $P$. They contain no variables for time, no operators for updating, and no constraints on how $P_{t_1}$ relates to $P_{t_2}$.

  To get the DDA off the ground, you must introduce a **bridge principle**. The most common one is the **Reflection Principle** (van Fraassen) or an assumption that the agent *plans* their update rule in advance. If an agent does not pre-commit to an updating rule, or if they do not view their future self as a reliable processor of information, the Diachronic Dutch Book cannot be constructed. Thus, Conditionalization is not a corollary of Probabilism; it is a corollary of Probabilism *plus* a specific norm about diachronic planning and memory.

  ### 2. The Assumption of Certain Evidence
  In your experimental work, you likely dealt with data that had error bars. Standard Bayesian Conditionalization, however, assumes that the evidence $E$ learned at $t_2$ becomes certain ($P_{t_2}(E) = 1$).

  The Diachronic Dutch Book argument strictly applies only to this case of "learning with certainty." If your evidence is uncertain (e.g., a instrument reading that shifts your credence in a hypothesis but doesn't make the reading itself probability 1), standard Conditionalization is technically inapplicable. In those cases, one must use **Jeffrey Conditionalization** (probability kinematics).

  Philosophers debate Conditionalization because it is not clear that "certain evidence" is ever actually obtained in the real world (the "Myth of the Given"). If the foundational assumption of the update rule (that $P(E)=1$) is rarely met, the rule itself becomes a substantive idealization rather than a logical necessity.

  ### 3. Pragmatic vs. Epistemic Normativity
  This is the deepest philosophical objection. The Dutch Book arguments are **pragmatic**: they show that incoherent agents lose money.
  *   **Synchronic:** If you are statically incoherent, you are vulnerable *now*. This feels very close to logical inconsistency.
  *   **Diachronic:** If you violate Conditionalization, you are vulnerable to a bookie who knows your *future* strategy and bets against you *now* based on what you *will* do later.

  Many epistemologists argue that pragmatic coherence (not losing money) does not perfectly map onto epistemic rationality (believing truth and avoiding falsehood).
  *   **The "Clever Bookie" Problem:** The DDA requires a bookie who knows your updating rule and can offer bets at $t_1$ that pay off at $t_2$. In the synchronic case, the inconsistency is internal to the agent. In the diachronic case, the vulnerability relies on an external adversary exploiting the temporal gap.
  *   **Epistemic Utility:** Modern Bayesians (like Jim Joyce) often prefer **Accuracy Arguments** over Dutch Books. They argue we should update by Conditionalization because it minimizes expected "inaccuracy" (distance from the truth), not because it saves us from financial loss. In these frameworks, Conditionalization is derived from a norm of accuracy, which is a distinct substantive assumption from probabilistic coherence.

  ### 4. Forgetting and Self-Locating Belief
  There are cases where rational agents *should* violate Conditionalization.
  *   **Forgetting:** If you rationally forget information, your credences change without conditionalizing on new evidence.
  *   **Centered Beliefs:** If you learn "It is now noon," your credences change due to the passage of time, not just evidence.

  If Conditionalization were a strict logical corollary of Probabilism, these rational changes in belief would be impossible. Since they are possible, Conditionalization must be a normative rule that holds *ceteris paribus* (all else being equal), rather than a logical truth.

  ### Summary
  Your intuition that the arguments feel similar is correct; they are both coherence arguments. However, the Synchronic argument relies on the **logic of consistency** at an instant, while the Diachronic argument relies on the **norms of planning and memory** across time.

  To use the physics analogy again:
  *   **Probabilism** is like requiring a state vector to have unit norm.
  *   **Conditionalization** is like the Hamiltonian determining time evolution.

  You cannot derive the Hamiltonian from the norm constraint. You need a physical postulate about how the system changes. Similarly, epistemologists treat Conditionalization as a substantive assumption because it requires a postulate about how rational agents *ought* to process new information, which is not contained in the definition of probability itself.

  Retirement gives you the luxury of asking *why* the machinery works, not just *that* it works. In this case, the machinery of Conditionalization requires a few extra bolts (Reflection, Memory, Certain Evidence) that are sturdy enough for experimental physics, but loose enough to keep philosophers employed.
