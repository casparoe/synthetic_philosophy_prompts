          *   *Deception Check:* Lying requires a different utility function. If our utility functions are transparent (via the broadcast), lying is computationally expensive or impossible to hide from a perfect simulation.

      *   *Idea 3: The Cost of Deception (Signaling Theory).*
          *   To lie convincingly requires simulating the other side to know what they want to hear.
          *   If the cost of generating the lie is higher than the cost of the resource being harvested, rational agents won't lie.
          *   *Plot Device:* "Proof of Work" style value declaration.

      *   *Idea 4: Observable Consequences (The "Shadow" Effect).*
          *   Even if *they* can't see *us*, does the harvesting affect the universe in a way that changes the *probability* of the other existing?
          *   *Anthropic Reasoning:* If harvesting destroys universes or reduces the measure of observers, then my existence depends on you not harvesting.
          *   *Plot Device:* The resource is something fundamental (vacuum energy, entropy). Harvesting it creates a "shadow" in the probability distribution.

      *   *Idea 5: Pre-commitment via Irreversible Modification.*
          *   You can't just say "I won't." You have to *make it impossible* to.
