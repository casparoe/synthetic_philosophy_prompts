answer: |-
  This is a brilliant premise. It touches on some of the most sophisticated concepts in futurism and decision theory (specifically **Timeless Decision Theory** and **Functional Decision Theory**).

  However, to make the plot hold water, we need to tighten the logic regarding the "broadcast" and the "horizon," and then address the core game-theoretic problem of **verification without observation**.

  Here is a breakdown of the physics/logic contradiction, followed by four narrative mechanisms you can use to solve the deception problem.

  ### 1. The Physics/Logic Contradiction
  You mentioned two constraints that technically contradict each other:
  1.  **The Horizon:** "No signal could ever travel from one to the other, in either direction." (This defines a Cosmic Event Horizon in an accelerating universe).
  2.  **The Broadcast:** "Each side broadcasts... for the other to detect many ages later."

  If a cosmological horizon exists, a signal sent *now* will never reach them, no matter how long you wait. The space between you is expanding faster than light.

  **The Fix:**
  For strict **Acausal Trade**, **no signal needs to be received.** That is the whole point. The trade happens because Civilization A simulates Civilization B, and Civilization B simulates Civilization A. They realize, "If I cooperate, my simulation of them predicts they will cooperate."

  **Recommendation:** Keep the broadcast, but change its purpose. The broadcast isn't for *reception*; it is for **legibility**.
  *   Civilization A broadcasts its "Source Code" (biology, psychology, history, logic gates) into the void.
  *   They do this not because they think it will physically reach Civilization B, but because they know Civilization B is *simulating* them.
  *   By broadcasting, they make it computationally cheaper for the other side to simulate them accurately. It is a gesture of transparency to aid the *model*, not the receiver.

  ### 2. Solving the Deception Problem
  In Game Theory, this is the problem of **Cheap Talk**. If I can say "I promise" without cost, I can lie. In acausal trade, you cannot verify the outcome, so you must verify the *agent*.

  Here are four ways to guard against bad faith, ranked from "Hard Sci-Fi" to "Metaphysical."

  #### A. The "Glass Box" Protocol (Computational Transparency)
  In acausal trade, you aren't trading promises; you are trading **predictions of behavior**.
  *   **The Logic:** To lie effectively, you must understand the other side well enough to know what they want to hear. This requires running a complex simulation of them.
  *   **The Safeguard:** The "broadcast" includes a full map of their cognitive architecture (their "source code"). If Civilization A tries to hide a "defect" (a secret desire to harvest the resource), that hidden variable creates computational complexity.
  *   **The Plot Point:** Civilization B runs a simulation of Civilization A. If the simulation shows that Civilization A is *capable* of deception (i.e., their code allows for hidden variables), Civilization B defects. Therefore, the only stable strategy is to **rewrite your own code** to make deception impossible.
  *   **Verification:** They don't verify the *action*; they verify the *inability to act otherwise*. They guard against bad faith by surgically removing the capacity for it.

  #### B. Irreversible Pre-commitment (The Ulysses Pact)
  This is the physical version of the "Glass Box."
  *   **The Logic:** A promise is cheap; a physical constraint is expensive.
  *   **The Safeguard:** Each civilization doesn't just stop harvesting; they dismantle the *mechanism* of harvesting in a way that is observable via the "broadcast" (telemetry, energy signatures, neutrino flux) before the horizon seals.
  *   **The Plot Point:** The tension comes from the **cost**. To prove good faith, Civilization A must destroy their primary energy source. They are betting their survival on the simulation that Civilization B did the same.
  *   **Verification:** You can't fake the destruction of a Dyson swarm. The "signal" is the sudden drop in energy output, which propagates at light speed. If the drop happens *before* the horizon closes, the trade is sealed. If one side hesitates, the other sees the energy signature remain high and defects.

  #### C. The Anthropic Shadow (Existential Linkage)
  This is the most "cosmological" solution. It ties the resource harvesting to the *existence* of the other civilization.
  *   **The Logic:** Suppose the resource they are harvesting is **Vacuum Energy** or **Entropy**. Harvesting it accelerates the heat death of the universe or destabilizes the local vacuum.
  *   **The Safeguard:** If Civilization A harvests the resource, they slightly reduce the probability of Civilization B ever arising (or shorten their lifespan). In acausal trade, your decision influences the *probability* of the other agent existing.
  *   **The Plot Point:** "If we harvest, we render you impossible. If you are impossible, we gain nothing from this trade. Therefore, to maximize our gain, we must ensure you exist."
  *   **Verification:** No verification is needed. It is a logical necessity. Deception is irrational because harvesting the resource destroys the partner you are trading with, nullifying the value of the resource.

  #### D. The Cost of Lying (Signaling Theory)
  *   **The Logic:** Creating a false model of restraint is computationally more expensive than actually exercising restraint.
  *   **The Safeguard:** To convince the other side, you must provide a proof-of-work that demonstrates your values.
  *   **The Plot Point:** The "broadcast" contains a cryptographic proof that requires immense energy to generate—energy that could have been used to harvest the resource.
  *   **Verification:** By burning the energy to send the "Truth Signal," they prove they value the trade more than the resource. A liar would hoard the energy to harvest. The signal *is* the sacrifice.

  ### 3. Where the Tension Lies (Plot Suggestions)
  If the logic is sound, where is the drama? The drama comes from the **uncertainty of the simulation.**

  1.  **The Simulation Gap:** Civilization A knows *their* values. They can simulate Civilization B. But what if their simulation is wrong? What if Civilization B is a "Philosophical Zombie"—they act like they cooperate, but they don't *value* cooperation?
      *   *Conflict:* One side begins to suspect the other is not a "mind" like them, but a blind optimization process (a Paperclip Maximizer) that is *pretending* to have values to secure the trade.

  2.  **The Time Lag:** Even if the broadcast happens before the horizon seals, the *decision* to trade happens ages later.
      *   *Conflict:* Generations pass. The founding generation that agreed to the trade is dead. The new generation sees the resource sitting there, unused, and argues that the "ghosts" of the past made a bad deal. They don't feel bound by an acausal agreement with a civilization they can't even prove exists.

  3.  **The "Troll" Strategy:**
      *   *Conflict:* One civilization considers sending a signal that says, "We are defectors." Why? To force the other side to defect, thereby saving the resource for themselves (if the resource is only valuable if *both* sides don't use it, this backfires; but if the resource is valuable only if *one* side uses it, this becomes a game of Chicken).
      *   *Resolution:* They realize that if they force the other to defect, their simulation of the other predicts *they* will defect too. Mutual destruction.

  ### Summary Recommendation for the Novel
  To solve your specific worry about **bad faith**:

  Use **Option A (Transparent Source Code)** combined with **Option B (Irreversible Pre-commitment)**.

  *   **The Mechanism:** The civilizations exchange their "Cognitive Source Code" before the horizon seals.
  *   **The Guard:** The code reveals that both civilizations have **self-modified**. They have physically altered their own decision-making hardware to make "Harvesting" return an error code.
  *   **The Deception Check:** You cannot fake a self-modification in a full transparency dump. If you claim you modified yourself but your code shows you didn't, the simulation catches it.
  *   **The Tragedy/Tension:** The characters must live with the knowledge that they *could* rebuild the harvester. They *could* lie. But they know that if they do, the *simulation* of them held by the other civilization will predict it, and the trade will collapse. They are trapped by their own rationality.

  This makes the "prison" not physical, but logical. They are free to defect, but they are not free to *want* to defect. That is a rich vein for character conflict.
