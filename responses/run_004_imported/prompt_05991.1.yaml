      *   *The Crux:* If I can't observe you, why shouldn't I defect?
      *   *Standard Answer:* Because I simulate you, and you simulate me. If I defect, my simulation of you predicts you will defect. If I cooperate, my simulation predicts you will cooperate. My decision *is* the prediction of your decision because we run the same algorithm.
      *   *The Deception Problem:* If one side is fundamentally different (e.g., a "paperclip maximizer" vs. "human values"), simulations might fail. Or if one side can hide its true utility function.

  3.  **Brainstorming Solutions to the Deception Problem:**

