answer: |-
  **Setting:** *A soundproofed basement lab. In the center sits a heavy steel box with a single lever and a digital display reading $0.00. A helmet with neural sensors rests on the table. The hum of liquid helium cooling is audible.*

  **Alex:** (Hand hovering over the lever) It's not death, Jamie. It's pruning. In fifty percent of the branches, I'm ten thousand dollars richer. In the other fifty percent, the process terminates before consciousness registers the event. I don't experience the termination. I only experience the payout.

  **Jamie:** You're conflating subjective continuity with objective measure. Yes, *this* instance of Alex will only witness the branches where the spin is up. But you are reducing your total amplitude in the Hilbert space by half. You are literally making yourself less real.

  **Alex:** "Less real" is meaningless. Reality is indexical. I am here, now. If I pull this, the future me on this thread sees money. The future me on the other thread sees nothing, because there is no future me there to see anything. The expected utility for *my* stream of consciousness is positive infinity over time.

  **Jamie:** That's the Sleeping Beauty problem wearing a lab coat. If you wake up after the trial, do you bet that the coin landed heads or tails? If you say heads, you're ignoring the measure. If you say tails, you admit that probability tracks amplitude, not just existence. By pulling that lever, you aren't gaining money; you're trading global weight for local currency. You're thinning yourself out.

  **Alex:** Measure isn't utility. If a branch has zero observers, it has zero moral weight *to those observers*. Why should I care about the Alex who ceases to exist? He has no preferences. He has no future. Caring about him is like caring about a video game character you deleted before the save file wrote.

  **Jamie:** Because the wavefunction doesn't care about your save files! The Born rule isn't a suggestion; it's the geometry of existence. If you run this a hundred times, you survive in one branch out of 2^100. You're a ghost in the machine, a vanishingly thin slice of amplitude screaming about how lucky you are while the vast majority of *you*—the measure-weighted sum of your identity—is dead in the water.

  **Alex:** But the "vast majority" is a view from nowhere. There is no God's eye view, Jamie. There's only the view from *here*. From here, the probability of me experiencing death is zero. It's a guaranteed win. This is the only interpretation of probability that makes sense for a first-person observer in MWI. Self-locating uncertainty collapses when the outcome is non-experience.

  **Jamie:** No, it doesn't collapse, it updates! Look, imagine I offer you a deal. I clone you. One clone gets tortured, the other gets a cookie. You say, "Great, I'll get the cookie," because you assume you'll be the lucky one. But *both* are you. You're just prioritizing the copy that speaks over the copy that screams. It's solipsism disguised as decision theory.

  **Alex:** It's not solipsism, it's causality. The tortured copy cannot influence the future. The surviving copy can. I am optimizing for the branch that continues to compute. If I don't pull this, I stay at full measure but zero dollars. If I do, I drop to 0.5 measure but gain utility. As long as the utility gain outweighs the measure loss, it's rational. And since death is a hard stop on utility, the loss is capped. The gain is compounding.

  **Jamie:** You're treating measure like a budget. It's not a budget; it's existence. If you erode your measure, you erode your causal influence on the macroscopic world. Eventually, you're a Boltzmann brain in a sea of dead branches, rich and alone, while the version of you that stayed home is influencing elections, curing diseases, living a life that *matters* in the aggregate.

  **Alex:** The aggregate doesn't feel anything. I feel. This hand feels. (He grips the lever.) I'm not afraid of the branches where I die, Jamie. I'm pitying the versions of you in those branches who have to watch it happen.

  **Jamie:** And I'm pitying the version of you in *this* branch who thinks he's the only one that counts. You pull that lever, you validate a decision theory that says it's okay to burn the world as long as your specific thread survives. That's not rationality. That's a cancer in the wavefunction.

  **Alex:** Or it's the next step in evolution. Surviving the branches that support survival.

  **Jamie:** Don't do it.

  **Alex:** Watch me.

  *Alex's fingers tighten. The hum of the cooler spikes in pitch.*

  **Jamie:** If you pull that, you and I are done. Not because you'll die. But because the Alex I know cares about the whole, not just the slice.

  **Alex:** Then the Alex you know is already obsolete.

  *Alex pauses, hand shaking slightly, not from fear, but from the tension of the calculation.*

  **Alex:** See you in the winning branch, Jamie.

  **Jamie:** (Quietly) There are fewer of them every time you say that.

  *Alex does not let go. Jamie does not move to stop him. The display remains at $0.00.*
