answer: |-
  "It wasn't a recantation," Elena said, stirring her coffee with aggressive precision. "It was a surrender. Popper signed the 1978 peace treaty because he was tired of being the villain, but read the fine print. He still thought the core logic was a metaphysical research programme. He just decided metaphysics was acceptable if it was useful."

  Marcus leaned back, arms crossed. "That's uncharitable. He accepted the propensity interpretation. Fitness isn't the survival itself; it's the *disposition* to survive. Like fragility isn't the breaking of the glass, it's the physical structure that leads to breaking. You can measure the structure independently of the outcome."

  "Can you?" Elena shot back. "In practice, how do you operationalize that disposition without counting the survivors? You say 'fragility,' I say 'tautology in a lab coat.' You measure the beatings until the survival stops. If your independent measure of fitness—say, metabolic efficiency—doesn't correlate with actual reproduction, you don't say selection failed. You say there was a hidden variable. Drainage, drift, linkage. The theory absorbs the anomaly."

  "That's a straw man of modern population genetics," Marcus said. "We don't just absorb anomalies. Look at experimental evolution. The Lenski LTEE. They predicted the trajectory of allele frequencies in *E. coli* populations over thousands of generations based on initial fitness estimates. Those were risky predictions. They could have come out wrong. If natural selection were just 'survival of the survivors,' you couldn't predict the *rate* of change before the survival happened."

  Elena paused, tapping her spoon against the rim. "Okay, the LTEE is the strongest card in your hand. But even there, the 'fitness' parameter is derived from relative growth rates in a specific environment. It's still relational. If the environment shifts unpredictably, your 'propensity' vanishes. You're predicting survival based on past survival rates in similar conditions. It's induction dressed up as deduction. You're saying 'they survived because they were fit,' and when asked 'how do you know they were fit?' you say 'because they survived.'"

  Marcus sighed, rubbing his temple. "Alright, I'll concede the verbal narratives. When biologists write purely qualitative adaptive stories—'this trait evolved *because* it enhanced fitness' without quantifying the trade-offs—that is often circular. Pan-selectionism is a real sin. I grant you that the *storytelling* often collapses into the tautology Popper feared."

  "But it's not just the storytelling," Elena pressed, sensing blood. "It's the explanatory structure. If the definition of the *explanans* relies on the *explanandum*, you haven't explained anything. You've just redescribed the data."

  "Except the math doesn't lie," Marcus countered, leaning forward again. "The Hardy-Weinberg equilibrium gives you a null model. When you see deviations, you test specific selective pressures against drift. You can falsify specific selection hypotheses. If you claim a trait is adaptive but show no heritability or cost, the model rejects it. That's falsifiability in action. Popper's mistake was treating 'Natural Selection' as a single statement rather than a framework containing hundreds of testable models."

  "But who decides when the framework itself is on the hook?" Elena asked. "If every specific model fails, do we ditch selection? Or do we just say we haven't found the right fitness landscape yet? Popper's worry was that the core principle is immune to refutation. It becomes a convention, not a theory."

  "Conventions guide research," Marcus said. "But they don't dictate results. We find maladaptive traits all the time. Spandrels. Genetic hitchhiking. We know selection isn't omnipotent because we can identify where it *didn't* happen. That requires an independent standard."

  "Or," Elena said, finishing her coffee, "it just requires a more complex description of the survival conditions. Popper knew that. He just hoped we'd admit it's metaphysics."

  "And yet," Marcus smiled, picking up his bag, "it predicts the bacteria in the petri dish every single time. Metaphysics doesn't grow cultures."
