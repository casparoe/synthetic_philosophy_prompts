      *   *Timelessness vs. Causation:* The debate assumes a temporal sequence (Decide -> Act). But if Death is a perfect predictor, the decision and the prediction are correlated via a common cause (the agent's psychology).
      *   *Functional Decision Theory (FDT) / Timeless Decision Theory (TDT):* Modern successors to CDT/EDT (Yudkowsky, Soares, etc.) handle this by treating the decision as an output of a algorithm that Death predicts. They would say "Stay" (or whatever leads to the best outcome given the logical correlation).
      *   *The "Why" of the Mix:* Even if the mix is ratifiable, *how* does the agent implement it? Do they need a quantum randomizer?
      *   *The Payoff Structure:* The debate assumes Death = Death. But what if the utility of trying to escape is different?
