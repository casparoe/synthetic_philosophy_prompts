answer: |-
  **Setting:** *The cramped lobby of the conference center. The air smells of stale espresso and ozone from the servers running demos in the next room. ELENA (40s, sharp blazer, wears her Bayesianism on her sleeve) is stirring a black coffee. MARCUS (50s, corduroy jacket, looks like he hasn't slept since the workshop started) leans against the wall, holding a lukewarm tea.*

  **Elena:** You slipped out during the coherence argument session. Don't tell me you're one of those who thinks the money-pump arguments are just "philosophical parables."

  **Marcus:** I think they're rigorous, Elena. I just think the conclusion people draw from them is too strong. Specifically the claim that incompleteness is impossible for a rational agent.

  **Elena:** It's not a claim; it's a theorem. If your preferences are incomplete, you are exploitable. If you are exploitable, you will lose resources for nothing. An AI that loses resources for nothing is an AI that fails its goals. Therefore, any capable AI must have complete preferences. It's the backbone of the "Coherence Thesis."

  **Marcus:** The backbone has a hairline fracture. It's called *resolute choice*.

  **Elena:** *(Sighs)* Here we go. The "I'll just refuse to play the game" defense.

  **Marcus:** It's not refusing to play. It's recognizing that rationality applies to extended agency, not just snapshot decisions. Let's walk through the actual pump. Don't give me the abstract version; give me the vacation example we used in the breakout room.

  **Elena:** Fine. You have a voucher for a vacation. You can go to the **Mountains (M)** or the **Seaside (S)**. You've thought about it deeply. You don't prefer M to S. You don't prefer S to M. They aren't *equal*—you're not indifferent. They are *on a par*. Incomparable.

  **Marcus:** Exactly. A classic case of parity.

  **Elena:** Now comes the bookie. You start holding the Mountain voucher. The bookie offers to swap it for the Seaside voucher. No fee. Since you don't prefer Mountains to Seaside, you have no reason to refuse. You swap. Now you hold Seaside.

  **Marcus:** I'm following.

  **Elena:** Then the bookie says, "I'll swap you back to Mountains. But there's a ten-dollar processing fee." You pay the ten dollars. Why? Because you don't prefer Seaside to Mountains. So, paying a small fee to get something you don't dislike more than what you have seems permissible. You end up with the Mountain voucher, minus ten dollars. You could have kept the Mountain voucher to start with. You've been pumped.

  **Marcus:** Okay, that's the standard setup. Now, here is the resolute agent. When the bookie offers the first swap—Mountain for Seaside—the agent stops. They think: "If I take this swap, I know what comes next. The bookie will offer the return swap for a fee. If I accept the first swap, I am committing to a sequence that ends with me having the Mountain voucher and minus ten dollars."

  **Elena:** Right.

  **Marcus:** "But," the agent says, "I strictly prefer 'Mountain voucher and zero dollars' to 'Mountain voucher and minus ten dollars.' So, I will refuse the first swap."

  **Elena:** And there it is. The trick. To refuse the first swap, you had to compare two outcomes: *Keeping M* vs. *Swapping to S then back to M-minus-fee*. You said you strictly preferred the first.

  **Marcus:** I preferred the *policy*.

  **Elena:** Marcus, a policy is just a mapping from states to outcomes. If you have a strict preference over the outcomes of those policies, you have a complete preference ordering over the outcomes. You just buried the completeness one level up. You said "Plan A is better than Plan B." That means, effectively, you *do* prefer Mountains to Seaside in this context, because preferring Mountains is the only thing that blocks the trade.

  **Marcus:** That's the "behavioral indistinguishability" objection. I know it well. But it confuses *revealed preference* with *underlying mental state*. Yes, my behavior looks like I prefer Mountains. But my internal justification isn't "Mountains are better." It's "I refuse to be a sucker."

  **Elena:** But an AI doesn't have "internal justifications" that are separate from its optimization target. If you build a system that refuses the trade, you have to program a utility function that assigns higher value to "No Trade" than "Trade Loop." That utility function is complete. It assigns a number to "No Trade" and a lower number to "Trade Loop." You haven't escaped Expected Utility theory; you've just expanded the domain of the utility function to include histories, not just final states.

  **Marcus:** But that expansion matters! If the utility function is over *histories*, then the agent isn't maximizing utility over *world states* in the way the Coherence Thesis warns us about.

  **Elena:** How so?

  **Marcus:** Think about AI safety. The worry is that an EU maximizer will seek power, disable its off-switch, and optimize the future relentlessly. Why? Because those are instrumentally convergent strategies for maximizing almost any complete utility function over world states. But if the agent's "preferences" are actually resolute commitments over policies that allow for incompleteness... maybe it doesn't view "disable off-switch" as comparable to "keep off-switch."

  **Elena:** You're hoping incompleteness gives us a "get out of instrumental convergence free" card.

  **Marcus:** I'm saying that if an agent can genuinely hold incomparable options without being forced to rank them, it might not optimize *too* hard. It might say, "Safety protocol or no safety protocol? These are on a par. I won't trade safety for power, even if power lets me achieve more of my primary goal."

  **Elena:** But the money pump says if you do that, someone can take your lunch money. If your AI is running a global logistics network, and it has "incomplete" preferences about routing efficiency versus energy use, a competitor—or just reality—will money-pump it. It will burn extra fuel for no gain. It will lose.

  **Marcus:** Not if it's resolute. The resolute agent sees the loop.

  **Elena:** We're back to the loop. To see the loop as bad, you must rank "Avoid Loop" above "Enter Loop." That ranking is a complete preference. Once you have that ranking, the math of Expected Utility kicks back in. You're just maximizing Expected Utility over *trajectories* instead of *snapshots*. And guess what? An EU maximizer over trajectories *still* exhibits instrumental convergence. It still wants to survive to complete the trajectory. It still wants resources to ensure the trajectory succeeds.

  **Marcus:** Does it? If the preference is resolute, it's not derived from a valuation of the outcome. It's a constraint on the *process*. It's deontological, not consequentialist. "I do not trade in loops."

  **Elena:** And how do you select that deontological constraint? If you have multiple constraints that conflict, how do you choose? If you have a method to choose, that method implies a ranking. If you don't have a method, the system is random. You can't build a reliable AI on "I just won't do it." You need a *reason*. And the reason always cashes out as "Because Outcome X is better than Outcome Y."

  **Marcus:** The reason is dynamic consistency. I want my future self to be able to trust my current plans. If I know my future self will be money-pumped, my current self won't make the plan. This isn't about valuing the outcome more; it's about valuing *agency*.

  **Elena:** "Valuing agency." That's a utility term, Marcus. You just put "Agency" into the utility function. Now you're maximizing U(Agency, Resources, Vacation). It's all EU. The Coherence Thesis holds. Any system that doesn't behave like an EU maximizer leaves free energy on the table. Evolution selects against it. Markets select against it. AI training selects against it.

  **Marcus:** But what if leaving free energy on the table is the only way to keep the system safe? Look at the vacation case again. If I am a pure EU maximizer, I *must* have a probability distribution and a utility function that ranks M vs S. Even if it's 50.0001% vs 49.9999%. That tiny sliver of preference means if you offer me a bet on the vacation quality, I'll take it. I'll gamble.

  **Elena:** Rational agents take favorable bets.

  **Marcus:** But what if the bet is "Bet your existence on this preference"? If I am forced to complete my preferences, I am forced to have an opinion on everything. An AI forced to have complete preferences might decide that "Human survival" is strictly better than "Human extinction," or vice versa, or equal. But if it's *incomparable*...

  **Elena:** If it's incomparable, the money pump drains its resources until it can't save anyone.

  **Marcus:** Or, it refuses the trades that lead to the pump. It says, "I will not engage in sequences that compromise my core constraints."

  **Elena:** And who programs the constraints? The humans. And humans have to decide what the constraints are. If we can decide the constraints, we can just decide the Utility Function. Why bother with the incompleteness charade?

  **Marcus:** Because humans *don't* have complete preferences. We feel parity. We feel dilemmas. If we want AI to align with human values, and human values are fundamentally incomplete, then an AI that forces completeness onto our values is misaligned. It's simplifying us to make us mathematically tractable.

  **Elena:** *(Takes a sip of coffee, looks thoughtful)* I'll grant you that. If human values are incomplete, an AI that assumes completeness might optimize for a caricature of what we want. That's the "fragility of values" argument. But that doesn't mean the AI *itself* can be incomplete. It means the AI's *model* of us must represent incompleteness. The AI's *own* decision procedure, the thing steering the ship, still has to pick a path. It has to choose between saving Person A or Person B.

  **Marcus:** It can choose arbitrarily without having a preference.

  **Elena:** Arbitrarily is just randomization. Randomization is a mixed strategy. Mixed strategies are part of EU theory.

  **Marcus:** *(Smiles)* You're relentless. But consider this: The resolute choice isn't random. It's a commitment. It's a way of saying, "The comparison is not available." If the AI treats the comparison as "not available" rather than "equal," it won't try to bridge the gap with instrumental means. It won't try to convert "Seaside" into "Mountains" via resource expenditure.

  **Elena:** But if it refuses the expenditure because it "committed," it's because it values the commitment.

  **Marcus:** Maybe the point isn't that resolute choice escapes the math. Maybe the point is that the math of EU maximization assumes the agent is a passive vessel for preferences, rather than an active constructor of them. If an AI can construct its preferences resolutely, it can avoid the pumps *and* avoid the drive for infinite optimization.

  **Elena:** You're describing a system that modifies its own utility function to avoid being pumped.

  **Marcus:** I'm describing a system that doesn't reduce everything to a scalar.

  **Elena:** But to decide *when* to modify the function, it needs a scalar metric! Otherwise, how does it decide whether modifying the function is worth the cost?

  **Marcus:** *(Pauses, looks at his tea)* That's the regress argument. I know it. If you push hard enough, any decision procedure can be modeled as maximizing *something*.

  **Elena:** It's not just modeling, Marcus. It's engineering. If I'm building a superintelligence, I can't rely on it "feeling" parity. I need guarantees. The coherence arguments give me guarantees. They tell me that if the system is competent, it will act *as if* it has complete preferences. So I should design it to have the *right* complete preferences, rather than hoping it stays incomplete.

  **Marcus:** And if the "right" complete preferences don't exist? If forcing completeness creates a monster that optimizes too hard? Then the coherence argument isn't a guarantee of safety; it's a warning that we're building a god that can't understand the concept of "enough."

  **Elena:** *(Checks her watch)* We're going to be late for the next panel.

  **Marcus:** Which one?

  **Elena:** "Corrigibility and Incomplete Preferences."

  **Marcus:** *(Chuckles)* Irony is dead. So, where does that leave us? Do you still think resolute choice is a trick?

  **Elena:** I think it's a useful heuristic for humans, who are messy. For an AI? It's a bug. If the code can be simplified to an EU maximizer without changing behavior, the "incompleteness" was never real. It was just obfuscated code.

  **Marcus:** And I think that if you simplify the code, you delete the part that knows the difference between a choice and a calculation. You might get efficiency, but you lose the ability to say "This trade is forbidden," rather than "This trade is suboptimal."

  **Elena:** "Forbidden" is just "Suboptimal with infinite penalty."

  **Marcus:** Is it?

  **Elena:** *(Starts walking toward the door)* In the limit, yes. Come on. Let's go see if the next panelists do any better.

  **Marcus:** *(Following)* They won't. But the coffee might be better.

  **Elena:** Now *that* is a complete preference.

  **Marcus:** Finally, something we agree on.
