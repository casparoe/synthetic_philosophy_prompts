      *   **The "Large World" Assumption:** Infinite/huge universe means there are many agents similar enough to me (in decision algorithm) but not identical copies.
      *   **Logical Correlation:** It's not physical causation; it's logical correlation based on similar reasoning processes.
      *   **Trade Logic:** I help *their* values, they help *mine*. Since we can't talk, we must *acausal* trade.
      *   **The "Why Care?" Question:** This is the crux. If I can't change their action, why does the correlation matter? (Answer: Because in EDT, you *do* condition on your action as evidence of theirs).
