answer: |-
  This is a precise question about the structural mechanics of Ruth Chang's meta-ethical project. To understand why the "small-improvement argument" (SIA) is necessary, we first have to locate the specific gap it is meant to fill in the standard rationalist model of choice.

  The standard model relies on the **Trichotomy Thesis**: for any two options $A$ and $B$ regarding a specific value $V$, one of three relations must hold:
  1.  $A$ is better than $B$ ($A > B$)
  2.  $B$ is better than $A$ ($B > A$)
  3.  $A$ is equally as good as $B$ ($A = B$)

  When faced with a "hard choice" (like Lawyer vs. Clarinetist), where neither option seems better and they don't seem exactly equal, the standard rationalist move is to claim **incomparability** (no relation holds) or **imprecise equality** (they are roughly equal within a margin of error).

  Chang argues that incomparability is too strong (we *can* choose between them, so they are comparable) and that imprecise equality is too weak (it collapses under scrutiny). Her "on a par" relation is the fourth alternative. The Small-Improvement Argument is the logical lever she uses to pry "on a par" away from "equality" (both precise and rough).

  Here is the reconstruction of the argument's mechanics.

  ### 1. The Setup: The Assumption of Equality
  To run a *reductio*, Chang asks us to assume the skeptic's position: suppose that in a hard choice between Career $L$ (Lawyer) and Career $C$ (Clarinetist), the two are **at least roughly equal** in overall value.

  This assumption covers both exact equality ($L = C$) and "rough" equality (where $L$ and $C$ are within a margin of error $\delta$ such that we cannot distinguish which is better).

  ### 2. The Intervention: The Small Improvement
  Next, we introduce a sweetener. We imagine a version of the legal career, $L+$, that is identically the same as $L$ in every respect *except* it comes with a slightly higher salary (say, \$50 more per month).

  Crucially, two things are stipulated about this improvement:
  1.  **Determinacy:** $L+$ is determinately better than $L$. There is no vagueness here; more money, ceteris paribus, is better. ($L+ > L$)
  2.  **Smallness:** The improvement is small. It is not enough to radically transform the nature of the choice (it doesn't turn the lawyer job into a dream job that obviously crushes the clarinet option).

  ### 3. The Transitivity Test
  Now we compare the sweetened option $L+$ against the original alternative $C$.

  If the original relation between $L$ and $C$ were **equality** ($L = C$):
  *   Logic dictates that if $L = C$, and $L+ > L$, then by the transitivity of "better than," **$L+$ must be better than $C$**.
  *   *Analogy:* If Scale A balances Scale B, and you add a gram to Scale A, Scale A must now outweigh Scale B.

  If the original relation were **rough equality** (imprecise value):
  *   Rough equality implies there is a "zone of indeterminacy" or a margin of error. Let's say the value of $L$ and $C$ are equal within a margin of $m$.
  *   If the sweetener added to $L$ (to make $L+$) is larger than that margin $m$, the indeterminacy should be resolved. $L+$ should snap into being determinately better than $C$.
  *   Even if we don't know the exact margin, the skeptic claims the difficulty of the choice is *due to* the values being close enough to be called equal. Therefore, a sufficient improvement should tip the scale.

  ### 4. The Phenomenological Observation
  Chang argues that in genuine hard choices, this tipping does not happen.

  When you compare $L+$ (Lawyer + \$50) against $C$ (Clarinetist), **$L+$ is still not determinately better than $C$.** The choice remains hard. You are not rationally required to choose $L+$. You do not feel that $C$ is now irrational.

  If the choice remains hard, it means the relation between $L+$ and $C$ is *not* "Better Than."

  ### 5. The Deduction (The Collapse of Equality)
  Here is the logical collision:
  1.  We know $L+ > L$ (by stipulation).
  2.  We observe that it is **not** the case that $L+ > C$.
  3.  If $L = C$ (or $L \approx C$), then ($L+ > L$) combined with ($L = C$) *entails* ($L+ > C$).
  4.  Since ($L+ > C$) is false, the premise ($L = C$) must be false.

  Therefore, $L$ and $C$ cannot be equal.

  ### Why This Rules Out "Rough Equality" Specifically
  This is the crux of your question. Why doesn't this just prove that the "margin of error" was larger than the \$50? Why can't the skeptic just say, "Okay, they were roughly equal, but your \$50 wasn't enough to break the tie. Make it \$5,000"?

  Chang anticipates this. Her argument relies on the idea that **parity is not vagueness.**

  If the relation were rough equality (vagueness/imprecision), the values would still be located on a single cardinal (or interval) scale. On a single scale, addition is monotonic. If $Value(A) \approx Value(B)$, then $Value(A) + \epsilon > Value(B)$ for a sufficiently large $\epsilon$.

  Chang argues that in hard choices, you can add improvements that *should* be sufficient to break any reasonable margin of error, yet the "better than" relation still fails to obtain.
  *   If you make the lawyer job slightly more meaningful, or slightly better paid, or slightly shorter hours, the choice often remains hard.
  *   If the difficulty were merely due to imprecise measurement of a single value scale, enough small improvements would eventually accumulate to force a "Better Than" judgment.
  *   The fact that $L+$ is better than $L$, but $L+$ is *not* better than $C$ (even though $L$ was not worse than $C$), violates the transitivity properties that govern equality on a scale.

  Specifically, it violates this principle: **If $A$ is equal to $B$, anything better than $A$ is better than $B$.**
  Since $L+$ is better than $L$, but not better than $C$, $L$ cannot be equal to $C$.

  But $L$ is also not *worse* than $C$ (otherwise you should choose $C$). And they are not *incomparable* (you can reason about them).

  Thus, they must stand in a relation that:
  1.  Allows comparability (unlike incomparability).
  2.  Does not support the transitivity of strict betterness through equality (unlike equality).

  Chang labels this relation **"On a Par."**

  ### The Structural Difference
  To visualize why "rough equality" fails where "parity" succeeds, consider the topology of the value space:

  *   **Rough Equality:** Implies a 1-dimensional line where points are fuzzy. $L$ and $C$ are overlapping blobs. If you shift blob $L$ to the right ($L+$), it eventually stops overlapping and sits clearly to the right of $C$.
  *   **On a Par:** Implies a multi-dimensional space where $L$ and $C$ are in different "categories" of value that are nonetheless comparable. $L$ excels in dimension $X$ (security), $C$ excels in dimension $Y$ (artistic expression).
      *   Adding money to $L$ increases its score on $X$.
      *   But because $C$ is not competing on $X$, increasing $L$'s $X$-score doesn't necessarily make $L$ "better than" $C$ overall. It just makes $L$ "more of an $L$."
      *   The relation is not about magnitude (which allows for small improvements to tip the scale); it is about **normative significance**.

  ### Summary of the Mechanics
  The Small-Improvement Argument works by exploiting the **transitivity of strict betterness over equality**.

  1.  **Assume:** $L$ and $C$ are equal (precisely or roughly).
  2.  **Axiom:** If $X = Y$, and $Z > X$, then $Z > Y$.
  3.  **Fact:** $L+ > L$.
  4.  **Observation:** It is not the case that $L+ > C$.
  5.  **Conclusion:** The assumption ($L = C$) is false.

  Since they are comparable but not equal, and not related by "better/worse," they must be **on a par**. The argument proves that the "hardness" of the choice is not a cognitive failure to detect a difference in magnitude (which a small improvement would fix), but a structural feature of the values themselves. They are in a different league, but the leagues are comparable.

  This is why Chang insists that hard choices are not about *finding* the reason (which would imply the reason was already there, waiting to be discovered via measurement), but about *creating* the reason through commitment. If they were merely roughly equal, the reason would exist on the scale; you'd just need a bigger magnifying glass (or a bigger sweetener). The SIA shows the magnifying glass won't work, because there is no single scale to measure.
