answer: |-
  **Setting:** *The living room floor. Cardboard packaging is strewn everywhere. An IKEA-style instruction manual lies open between us, displaying a cryptic diagram of Panel B being attached to Panel D. I am holding a wooden dowel; my flatmate, Sarah, is wrestling with an Allen key.*

  **Sarah:** Pass me that cam-lock.

  **Me:** You mean the simples arranged cam-lock-wise?

  **Sarah:** *[Sighs, doesn't look up]* If you say "the cam-lock" one more time while denying its existence, I'm going to use this Allen key on your ontology. Just hand it over.

  **Me:** *[Slides the metal piece across the carpet]* I'm just being precise. There are particles there. They are locked together. They are functioning as a fastener. But there is no *extra* entity, over and above the particles, that is "the cam-lock."

  **Sarah:** This is the Special Composition Question, and we are doing it over particle board. Look, even if you're right about the fundamental level, you have to admit *this*—*[she gestures at the half-assembled frame]*—is a thing. It's a shelf. Or it will be.

  **Me:** It's not a shelf. It's simples arranged shelf-wise. There is no "it." There's just the wood, the screws, and the dowels. When we're done, there won't be a shelf either. Just simples arranged shelf-wise, but more rigidly.

  **Sarah:** Okay, let's run the Vagueness Argument again, because you're dodging the sharp cutoff. If composition is restricted—if *some* things compose a whole and *others* don't—then there has to be a precise moment where it switches on. Is it a shelf now?

  **Me:** No.

  **Sarah:** What if I tighten this screw?

  **Me:** Still no. Just tighter arrangement.

  **Sarah:** What if I attach the back panel?

  **Me:** No.

  **Sarah:** So you're saying there is no point in the continuous process of assembly where a new object comes into existence?

  **Me:** I'm saying there is *never* a point where a new object comes into existence. Composition never happens. Van Inwagen was close, but he stopped at life. I'm going all the way. There are only simples.

  **Sarah:** That's the nihilist hardline. But think about the cost. If you say composition is restricted, you have to accept brute, arbitrary facts. Why does *this* configuration of wood count as an object, but *this* configuration—*[she points to a pile of sawdust and a loose screw]*—doesn't? If you can't give a non-arbitrary principle for when composition occurs, you have to accept it's either never or always.

  **Me:** I'm comfortable with "never." It's parsimonious.

  **Sarah:** But it makes ordinary truth conditions impossible. If I say "The shelf is wobbly," and there is no shelf, what am I saying? "The simples arranged shelf-wise are wobbly"? That's clunky.

  **Me:** It's not clunky, it's accurate. And it does all the work. "There are simples arranged shelf-wise" is true. "There is a shelf" is false. We can keep the first sentence for our ontology and the second for our casual conversation. It's a paraphrase strategy. We don't need to reify the whole to talk about the parts acting in concert.

  **Sarah:** Lewis would call that linguistic idealism. You're letting our concepts dictate reality. Lewis says unrestricted composition is ontologically innocent.

  **Me:** *[Laughs]* Innocent? Sarah, if unrestricted composition is true, then right now, there is an object composed of my left ear and the Andromeda Galaxy.

  **Sarah:** There is.

  **Me:** That's absurd.

  **Sarah:** It's counter-intuitive. There's a difference. Lewis's point is that the fusion of the ear and Andromeda doesn't add any *new* stuff to the universe. It's just the ear and Andromeda. Counting the fusion doesn't increase the ontological weight. It's innocent. You aren't positing new matter, just a new way of counting the matter that's already there.

  **Me:** But it posits a *boundary* where there isn't one. It says there is a *thing* that binds my ear to Andromeda. That's not innocent, that's a category error. It's like the Trout-Turkey.

  **Sarah:** Oh, here we go. The Trout-Turkey.

  **Me:** Lewis admits it! If universalism is true, there is an object composed of a trout and a turkey. He says, "So much the worse for common sense." I say, so much the worse for universalism. If your theory tells me that a scattered object made of a fish and a bird is just as real as the shelf we're building, your theory has lost touch with what "object" means.

  **Sarah:** "Object" doesn't mean "what common sense points at." "Object" means "value of a bound variable." If our best logic requires quantification over fusions to avoid arbitrariness, then the fusions exist. The Trout-Turkey is weird, sure. But is it weirder than believing there's a magic line where particles suddenly stop being just particles and start being a *Shelf*?

  **Me:** I don't believe in the magic line. I believe the line is in the language, not the world. The world is just quarks and fields. "Shelf" is a map, not the territory. You're confusing the map for the territory. You think because we have a word "shelf," there must be a referent in the fundamental ontology.

  **Sarah:** I'm not saying "shelf" is fundamental. I'm saying the *fusion* is real, even if the *concept* of shelf is pragmatic. Look, imagine we burn the shelf. At what point does the shelf cease to exist?

  **Me:** When the arrangement breaks down sufficiently that we no longer say "shelf."

  **Sarah:** But *when*? If you burn one corner, is it still the shelf?

  **Me:** It's simples arranged burnt-shelf-wise.

  **Sarah:** See! You rely on the arrangement predicate. But if the arrangement is what matters, why isn't *any* arrangement an object? Why is "shelf-wise" special?

  **Me:** Because "shelf-wise" tracks causal powers. The particles interact with each other and the environment in a specific way that allows me to put books on them. The Trout-Turkey doesn't have unified causal powers. My ear doesn't causally interact with Andromeda in a way that makes the fusion a useful unit of description.

  **Sarah:** But utility isn't existence. Radio waves weren't useful to the Romans, but they existed. The Trout-Turkey fusion exists, it just doesn't *do* anything as a unit. You're conflating epistemology with ontology. You only want to admit things exist if they are useful to *you*.

  **Me:** And you're admitting things exist just to save a logical principle from looking arbitrary! You'd rather populate the universe with infinite, scattered, causally inert monsters like the Trout-Turkey than admit that composition is a conceptual tool we use to carve up the simples.

  **Sarah:** It's not about populating. It's about consistency. If you deny the Trout-Turkey, you need a principle for why *some* fusions count and others don't. Contact? Spatiotemporal continuity? Fastening?

  **Me:** Fastening works for the shelf.

  **Sarah:** *[Tightens a screw aggressively]* Does it? At the atomic level, nothing touches. It's just electromagnetic repulsion. So "fastening" is just "simples arranged close-wise." If "close-wise" counts, how close? One angstrom? One micron? If you set a limit, you're back to the vagueness problem. If you don't set a limit, you're a universalist.

  **Me:** I'm a nihilist. I deny the limit exists because I deny the composition exists. I don't need a threshold for when parts become a whole, because they never do.

  **Sarah:** But then you have to explain why "There is a shelf" feels true.

  **Me:** Error theory. It feels true because it's a useful shorthand.

  **Sarah:** *[Pauses, looks at the half-built frame]* Okay. Let's localize this. You think the disagreement is about what exists. I think the disagreement is about what we mean by "exists."

  **Me:** Go on.

  **Sarah:** For you, "exists" means "is a fundamental causal unit." For me, "exists" means "is a valid value for a variable in our best logical system."

  **Me:** I think "exists" means "is part of the fundamental furniture of the world." If it's derivative, it's not real in the ontological sense. It's real in the pragmatic sense. You're refusing to distinguish the two.

  **Sarah:** And you're refusing to admit that derivative things can still be *ontologically* real without being fundamental. You think if it's not fundamental, it's a fiction. I think if it's logically entailed by the fundamentals plus the rules of composition, it's real.

  **Me:** So you think the Trout-Turkey is logically entailed by the fundamentals?

  **Sarah:** I think the existence of the trout and the turkey entails the existence of their fusion. That's the axiom.

  **Me:** And I think that axiom is the mistake.

  **Sarah:** *[Picks up the back panel]* Okay. Here's the test. If I nail this back on, and the structure becomes rigid... will you admit *something* changed?

  **Me:** The spatial relations of the simples changed. The causal interactions changed.

  **Sarah:** Did a new object come into being?

  **Me:** No.

  **Sarah:** *[Smiles]* And if I smash it?

  **Me:** The relations change again.

  **Sarah:** So for you, the entire history of the universe is just a shifting cloud of simples, and "objects" are just patterns we project on the cloud.

  **Me:** Basically. LessWrong style. No "wing" in the physics, just quarks arranged wing-wise.

  **Sarah:** And for me, the patterns *are* things. The cloud is things, and the shapes the cloud makes are also things.

  **Me:** So we aren't disagreeing about the physics. We agree on the quarks. We agree on the screws.

  **Sarah:** We disagree on the counting. You count only the atoms. I count the atoms *and* the sums.

  **Me:** And you think my counting is arbitrary.

  **Sarah:** I think it's incomplete. You think my counting is bloated.

  **Me:** *[Picks up a dowel]* Bloated is an understatement. It's infinite.

  **Sarah:** *[Takes the dowel]* But innocent.

  **Me:** *[Shakes head]* Pass me the simples arranged Allen-key-wise.

  **Sarah:** *[Hands it over]* Here.

  **Me:** Thanks. Now, help me arrange these simples into a configuration that can hold books.

  **Sarah:** Deal. But I'm calling it a shelf.

  **Me:** As long as you know it's a fiction.

  **Sarah:** As long as you know the fiction is real.

  *[We work in silence for a moment, the sound of wood clicking into place filling the room.]*

  **Me:** You know, if universalism is true, there's an object composed of this screw and the dust bunny under the sofa.

  **Sarah:** There is.

  **Me:** That's really weird.

  **Sarah:** *[Tightens the screw]* Yeah. But look at the shelf. It's standing up.

  **Me:** The simples are supporting other simples.

  **Sarah:** The shelf is holding.

  **Me:** ...Fine. The shelf is holding.

  **Sarah:** Progress.
