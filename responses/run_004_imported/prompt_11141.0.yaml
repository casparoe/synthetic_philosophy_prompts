      *   **Psychological/Physiological Validity:** Fatigue affects metacognition. You might have the *capacity* to drive (reflexes are okay), but your *assessment* of that capacity is compromised. Or, you might be right by luck (true belief) without justification.
      *   **The "Creeping Normality" Aspect:** Theo's first point supports the second. If the decline is gradual, your internal calibration drifts. You might be "right" that you're okay relative to an hour ago, but "wrong" relative to safety standards, yet feel certain.

  4.  **Evaluate the User's Position:**
