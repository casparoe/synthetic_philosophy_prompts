answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The remnants of a colloquium on naturalized epistemology linger in the air. Elena (a teleosemanticist) pours tea. Marcus (a causal-informational semanticist) leans back, rubbing his temples.*

  **Marcus:** You know, listening to the Q&A today, I couldn't help but think of your background. You spent thirty years mapping retinal ganglion cells in *Rana pipiens* before you turned to philosophy. And yet, the philosophers up there were talking about the frog's "fly-detector" as if it were a thought experiment. To you, it was just Tuesday.

  **Elena:** [Smiling] It was more than Tuesday. It was the foundation of the "bug detector" paper by Lettvin and colleagues. But yes, it's frustrating when the biology gets smoothed over to fit the metaphysics. Though, I suppose that's where teleosemantics tries to bridge the gap. We use the biology to ground the normativity.

  **Marcus:** That's precisely where I get off the train. Let's use the frog, since it's our shared touchstone. The standard story is: the frog has a neural state, let's call it *N*, triggered by small, dark, moving contrasts. When *N* fires, the tongue shoots. Teleosemantics says *N* means **Fly**. If a BB pellet is swung past on a wire and *N* fires, the frog is in error. It's a false representation.

  **Elena:** Exactly. Because the *proper function* of the mechanism producing *N* is to detect flies. That function is fixed by the history of natural selection. Ancestors with neurons tuned to flies caught food and reproduced. Ancestors with neurons tuned to nothing starved. The BB is a malfunction because it falls outside the conditions for which the mechanism was selected.

  **Marcus:** But here is the disjunction problem, Elena, and I want to press you on the selection history itself. You say selection fixed the content as **Fly**. But selection is blind to our semantic categories. What actually covaries with the neuron firing in the frog's evolutionary history?

  **Elena:** Flies. Nutritious prey.

  **Marcus:** Does it? Or does it covary with *small, dark, moving things*? In the frog's niche, the set of "flies" and the set of "small, dark, moving things" might have been co-extensive. But if a BB had flown past an ancestral frog, the neuron would have fired then, too. The causal law is: *N* fires if and only if a small, dark, moving thing is present. If you ground meaning in causal covariance, the content is **Fly-or-BB-or-Pellet**.

  **Elena:** I'm not grounding it in raw covariance. I'm grounding it in *success*. The reason the neuron exists is that it successfully guided the tongue to *nutrition*. A BB does not provide nutrition. Therefore, the BB is not the intentional object. The content is determined by what the mechanism was *supposed* to do, not just what it causally interacts with.

  **Marcus:** But "supposed to" is the magic word. Who says the mechanism was supposed to detect flies rather than "small, dark, moving things"? Imagine an ancestral frog, *F*. *F* snaps at a fly. *F* survives. *F* snaps at a pellet (maybe it looks like a fly). *F* doesn't survive. You want to say selection favored the "Fly" detector. But from the perspective of the selection pressure, the description "detector of small, dark, moving things that are usually nutritious" fits the data just as well as "detector of flies."

  **Elena:** It fits the data, but it misses the *explanatory* link. Why were those moving things nutritious? Because they were flies (or mosquitoes, or beetles). The property that explains the reproductive success is the *fly-ness*—the nutritional value inherent in the biological kind. If the content were **Small Dark Moving Thing**, then snapping at a BB wouldn't be an error; it would be a true representation of a BB. But it *is* an error. The frog starves. Teleosemantics captures the normativity: the system failed to achieve its goal.

  **Marcus:** I agree the frog starves. I agree it's a biological failure. I disagree that this biological failure translates to *semantic* error. Look, if I build a thermometer, and I calibrate it to measure temperature, but it actually expands based on molecular kinetic energy, does it represent Temperature or Kinetic Energy?

  **Elena:** It represents Temperature, because that's its function.

  **Marcus:** But in the frog, who did the calibrating? Natural selection. And selection only "sees" differential reproduction. If the property *Small Dark Moving Thing* is what triggers the snap, and the property *Nutrition* is what rewards the snap, why isn't the content **Nutrition-Source**? Or **Snap-Worthy-Object**? You're smuggling in the human categorization of "Fly." The frog's visual system doesn't segment the world into species. It segments it into contrast gradients. To say the content is **Fly** is to impose a taxonomy the frog doesn't possess.

  **Elena:** That's the "Grain Problem," and it's serious. But Millikan's response is that we look at the *consumption* side. The content is fixed by how the downstream systems use the signal. The digestive system expects a fly. The motor system expects a catchable mass. The content is determined by the interface between the producer of the signal and the consumer of the signal. The consumer is adapted for flies. Therefore, the signal means **Fly**.

  **Marcus:** But the consumer is adapted for *calories*. If you could feed the frog a slurry of fly-protein via a tube, it would reproduce just as well. If the ultimate selection pressure is caloric intake, why isn't the content **Calorie**? If the content is **Calorie**, then the BB is still an error, but so is a non-nutritious fly. But intuitively, if the frog snaps at a non-nutritious fly, it didn't make a perceptual error. It made a digestive gamble. The perceptual error only happens if it snaps at a non-fly.

  **Elena:** Because the *proximal* mechanism is tuned to the visual signature of the fly. The selection history includes the *means* of acquisition, not just the end state. You can't get the calories without the detection. The detection mechanism was selected for tracking flies *specifically* because that was the reliable causal route to calories in the Environment of Evolutionary Adaptedness (EEA).

  **Marcus:** "Reliable causal route." Now we're back to causation. And here is my strongest worry, Elena. Even if we accept that selection fixes a function, selection history is compatible with multiple, logically distinct descriptions of that function. This is the indeterminacy of translation applied to evolution.
  Suppose in the EEA, every small dark moving thing *was* a fly. There were no BBs. There were no pellets. The extension of **Fly** and **Small Dark Moving Thing** was identical. Selection cannot distinguish between them. It selects for the phenotype that snaps at *X*. If *X* = Fly and *X* = Small Dark Moving Thing, the history underdetermines which property is the content. You need a fact of the matter *now* to decide, but the history is silent.

  **Elena:** It's not silent. It's normative. The history establishes a standard. When the frog snaps at a BB, we can ask: "Did this fulfill the function?" No. "Why?" "Because BBs aren't flies." We explain the failure by referencing the specific biological kind that was the target of the adaptation. If the target were just "moving contrast," the BB would fulfill the function. The fact that we identify the behavior as *maladaptive* in the presence of a BB proves the content is narrower than "moving contrast."

  **Marcus:** But *we* identify it as maladaptive. We are the interpreters. The frog just goes hungry. You're saying teleosemantics solves the disjunction problem by ruling out the BB as a false positive. I'm saying you've only ruled it out as a *biological* failure, not a *semantic* one.
  Consider this: If the content is fixed by what the system was selected to correlate with, and the system was selected to correlate with *whatever keeps the frog alive*, then in a world where BBs were nutritious, the BB would be a "fly." Since content depends on the selection history, and the selection history is about survival, the content is inherently tied to the *value* for the organism, not the *ontology* of the object. So the content is **Food**.

  **Elena:** If the content were just **Food**, the frog should snap at stationary berries. It doesn't. It snaps only at moving contrasts. So the content must include the motion.

  **Marcus:** Fine. **Moving Food**.

  **Elena:** But a moving leaf isn't food.

  **Marcus:** **Moving Food-Source**.

  **Elena:** You're just adding qualifiers to avoid the specific intentional object. The point of teleosemantics is that the intentional object is the thing that *actually caused* the survival in the past. It was flies. Not leaves, not BBs. The causal history is specific.

  **Marcus:** But the causal history is accessed *through* the description. And that's the wall I hit. To say "It was flies" is to assume that "fly" is a natural kind that selection can "see." But selection sees phenotypes interacting with environments. The phenotype is "tongue-shooter." The environment stimulus is "retinal contrast change." The link between "retinal contrast change" and "fly" is a correlation, not an identity.
  If you ground content in the correlation that produced the selection, you get **Retinal Contrast Change**. If you ground it in the distal object that caused the correlation, you get **Fly**. But nothing in the selection history itself tells you whether the mechanism is *about* the proximal trigger or the distal cause. Informational semantics says it's the proximal trigger (covariance). Teleosemantics says it's the distal cause (function). But both are consistent with the same physical history.

  **Elena:** That's true. The physical history is consistent with both. But only one supports the possibility of *mis*representation in the way we experience it. If the content is **Retinal Contrast Change**, the frog is never wrong. It sees a contrast, it snaps. Truth is guaranteed. But biology is full of error. Eyes are tricked. Brains misfire. We need a theory that allows for falsity. Teleosemantics provides the conditions for falsity: divergence from the proper function. Informational semantics struggles to allow for falsity without invoking the very teleology it tries to avoid.

  **Marcus:** I'll concede that pure causal covariance has trouble with error. That's why I'm an informational semanticist who thinks we need *asymmetry*. The fly causes the neuron firing, but the neuron firing doesn't cause the fly. The BB causes the firing only because the fly causes the firing (in the sense that the mechanism is tuned to flies).
  But here is where I stick. You claim selection fixes the asymmetry. I claim selection fixes the *disposition*, not the *content*. The frog is disposed to snap at flies. That disposition explains the behavior. Do we need to posit a semantic content of **Fly** to explain the snapping? Or is "Fly" just a label we paste on the disposition?
  If I say the neuron means **Small Dark Moving Thing**, I can explain the snapping at the BB perfectly. It's a true representation. The frog's *action* is maladaptive, but its *representation* is accurate. It saw a small dark moving thing, and it was one. Why insist the representation was false?

  **Elena:** Because if the representation is accurate, the failure lies entirely in the decision procedure. But the frog doesn't have a high-level decision procedure. It's a reflex arc. If the input is veridical, and the output is fatal, the error must be in the mapping. The mapping is designed for flies. Therefore, the input *should have been* a fly. When it isn't, the input is misrepresented.
  You're trying to save the semantics by sacrificing the biology. You're saying the frog correctly perceives the world but acts stupidly. I'm saying the frog perceives the world *as* a food-source, and when it's a BB, the perception is a hallucination of food.

  **Marcus:** But "hallucination of food" implies the content is **Food**. And we went in circles on that. If the content is **Food**, why doesn't it snap at stationary food?
  Look, Elena, I think we are at the crux. You believe that "Proper Function" is a primitive that cuts through the underdetermination of causal history. I believe "Proper Function" is just a description of stable causal correlations over time, dressed up in normative language.
  When you say selection fixed the content as **Fly**, you are assuming selection has a "goal." It doesn't. It has a result. The result is survival. The description of *what* survived is up to us. We can describe the survivor as "The Fly-Eater" or "The Moving-Contrast-Snapper." Both are true. Teleosemantics picks one and calls it "The Truth." Informational semantics says both are causal facts, and "meaning" is the wrong category for the lower-level interaction.

  **Elena:** And I say that without picking one, you cannot distinguish the frog from a camera. A camera records small dark moving things. It has no errors, only recordings. The frog has errors. It has a perspective. It has a *point of view*. That point of view is constituted by its goals, and its goals are constituted by its history. If you strip the history of its teleological force, you strip the frog of its mind. You leave it with mere mechanism.

  **Marcus:** And I reply that if you imbue the history with more teleological force than is physically present, you strip the theory of its naturalism. You leave it with magic.
  The frog snaps. Sometimes it eats. Sometimes it starves. The causal story explains the snapping. The nutritional story explains the eating. The semantic story... I'm not sure there is one that isn't just a projection of the biologist's own categories onto the ganglion cells.

  **Elena:** [Sips tea] So we are back to the retina. I see a mechanism designed by selection to track a specific kind. You see a mechanism causally coupled to a range of stimuli, where "design" is just a metaphor for "stable causation."

  **Marcus:** Precisely. You think the history determines the content. I think the history determines the *structure*, and the content is indeterminate until an interpreter comes along.

  **Elena:** Then the interpreter is the evolutionary process itself.

  **Marcus:** Then the evolutionary process is a mindless algorithm, Elena. It doesn't interpret. It culls.

  **Elena:** And yet, here we are, interpreting. Perhaps the frog's error is the seed of our own truth.

  **Marcus:** Or perhaps the frog's "error" is just our inability to decide if we're talking about biology or meaning.

  *They sit in silence for a moment, watching a housefly buzz against the windowpane, neither of them reaching for a swatter.*
