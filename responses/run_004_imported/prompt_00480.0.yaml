      *   **Round 1: The Setup.** Marcus raises the disjunction problem. Elena counters with Proper Function.
          *   *Key point:* Marcus: "The neuron fires for BBs too." Elena: "But it wasn't selected for BBs."
      *   **Round 2: The Description Problem.** Marcus presses on *how* we describe the selection pressure.
          *   *Key point:* Selection sees phenotypes, not semantic contents. Did it select for "nutrition" or "fly-ness"? "Small moving thing" is the actual stimulus trigger.
      *   **Round 3: The Normative Turn.** Elena argues that without teleology, you can't have *mis*representation.
          *   *Key point:* If content is just causal covariance, snapping at a BB is "true" (it is a BB). Teleosemantics allows it to be "false."
      *   **Round 4: The Grain of Selection.** Marcus argues that selection is coarse-grained.
          *   *Key point:* Evolution selects for survival/reproduction. "Fly" is a human categorization. The frog's ancestor just needed calories. Maybe the content is "Calorie-Source"?
      *   **Round 5: Closing.** Acknowledge the stalemate. The biological data is the same; the metaphysical interpretation differs.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I making Marcus too Fodor-like? Fodor is an informational semanticist but famously hated teleosemantics. I need to make sure he focuses on the *indeterminacy of the selection history* rather than just "causes are sufficient."
      *   *Check:* Is Elena too dogmatic? She needs to acknowledge the difficulty of pinning down selection history but argue it's the *only* game in town for normativity.
      *   *Biology Check:* Ensure references to "bug detectors" (Lettvin et al.) are accurate. The frog snaps at small moving contrasts. It doesn't actually identify "flies" in the human sense. This is the skeptic's strongest weapon.
      *   *Tone Check:* Keep it respectful but rigorous. No "You just don't get it."

  6.  **Final Polish:**
      *   Enhance the biological terminology (T5.2 neurons, optic tectum).
      *   Ensure the "Disjunction Problem" is explicitly addressed.
      *   Make sure the ending feels natural, not forced.

  7.  **Final Review against constraints:**
