answer: |-
  This is one of the juiciest intellectual feuds in history, and you have spotted the exact right vein to mine. Douglas Jesseph's *Squaring the Circle: The War Between Hobbes and Wallis* is indeed the definitive text, and your instinct is correct: reducing this to "Hobbes was wrong" kills the drama. The drama lies in the fact that **they were not playing the same game.**

  For your coffeehouse scene, you need to understand that this wasn't just a math error; it was a collision between two incompatible visions of reality. Here is the breakdown of the disagreement, tailored for character motivation and dialogue.

  ### 1. The Ontological Clash: What is a "Line"?

  This is the bedrock of their argument. If your characters argue about the circle, they should do so by arguing about what the circle is *made of*.

  **The Hobbes-Character (Materialist/Physicalist):**
  *   **The View:** Geometry is a branch of physics. There are no abstract objects.
  *   **The Point:** A point is not a dimensionless abstraction (which is "nothing"). A point is a physical mark made by a body.
  *   **The Line:** A line is not a collection of points; it is the *trace* of a moving point. It is generated by **motion**.
  *   **The Argument:** "You cannot reason about things that do not exist. Show me a line without width? Show me a point without size? You cannot. Therefore, your 'geometry' is just speech without sense. To square a circle is to describe a **motion** that transforms one body into another. If I can describe the motion, I have squared it."
  *   **The Flaw:** He conflates physical plausibility with logical proof. He thinks if he can imagine a machine or a motion that *seems* to work, it must be true.

  **The Wallis-Character (Algebraic/Analytic):**
  *   **The View:** Geometry is a branch of arithmetic/logic. It deals with ratios and magnitudes, not just physical bodies.
  *   **The Indivisible:** Wallis uses "indivisibles" (precursors to infinitesimals). He treats a plane figure as a stack of infinite lines.
  *   **The Argument:** "We are not carpenters cutting wood. We are measuring ratios. Whether the line has width or not matters less than whether the **proportions** hold. I can sum an infinite series of numbers to find the area. The result is true even if you cannot draw it with a ruler."
  *   **The Flaw:** To Hobbes, this looks like mysticism. Summing "infinities" sounds like theology, not science.

  **Dialogue Hook:**
  *   **Hobbes:** "You sum ghosts, Mr. Wallis. You add up nothings and claim they make a something."
  *   **Wallis:** "And you stare at the ruler and miss the number, Mr. Hobbes. You mistake the chalk for the truth."

  ### 2. Is Hobbes Tragically Consistent?

  **Yes.** This is crucial for your characterization. Hobbes isn't just being stubborn; he is being **philosophically loyal.**

  In his system (*De Corpore*), knowledge comes from understanding causes. The "cause" of a geometric figure is the motion that generates it. Therefore, a valid proof *must* be a causal account of how the figure is constructed.

  When Wallis disproves Hobbes's squaring using algebraic ratios, Hobbes rejects the disproof because he rejects the method. To Hobbes, Wallis is like a priest chanting Latin to cure a disease; the words might sound impressive, but they don't engage with the **body** of the problem.

  *   **For the Novel:** Your Hobbes-character shouldn't look confused when he's proven wrong. He should look **disgusted**. He should view Wallis's corrections as category errors.
  *   **Internal Logic:** "I have not failed. I have described a motion. That you cannot calculate the ratio of that motion is a failure of your arithmetic, not my geometry."

  ### 3. The Specific Mathematical Sticking Point

  You don't need the math to be perfect, but you need the *texture* of it to be right.

  *   **Hobbes's Mistake:** He often confused **magnitude** (size/length) with **proportion** (ratio). He thought that if he could construct a line that was roughly the right length compared to the radius, he had solved it. He relied on visual intuition and "approximate" constructions.
  *   **Wallis's Attack:** Wallis used the *Arithmetica Infinitorum*. He showed that the ratios Hobbes claimed were equal actually diverged when you pushed them through infinite series.
  *   **The "Indivisibles" Fight:** This is the hottest button. Wallis treats a surface as made of infinite parallel lines. Hobbes hates this. He argues that if you add lines (which have no breadth), you can never get a surface (which has breadth). It's like adding zeros to get a one.
      *   **Hobbes Line:** "Add a thousand nothings, you have nothing still."
      *   **Wallis Line:** "Add a thousand threads, you have a rope."

  ### 4. Who Has the Defensible View? (For Character Sympathy)

  If you want the reader to understand why both men think they are right, here is the split:

  **Wallis is Right for the Future (The Winner):**
  Wallis is paving the way for Newton and Calculus. His willingness to treat geometric magnitudes as numbers and to manipulate infinities is the future of mathematics. He is pragmatic. He cares about **results**.
  *   *Defensible position:* "Mathematics is a tool for discovery. If the method yields true predictions, the metaphysics can wait."

  **Hobbes is Right about Rigor (The Loser):**
  Hobbes is actually anticipating later crises in mathematics (like the foundational crisis of the 19th century). He is right that "infinitesimals" were logically shaky at the time (they *were* essentially "ghosts of departed quantities," as Berkeley later called them). He demands **constructibility**.
  *   *Defensible position:* "Do not build your science on mysteries. If you cannot construct it, you do not know it. You are guessing."

  **Verdict for the Scene:**
  Wallis has the better *math*, but Hobbes has the tighter *philosophy*. This allows your Hobbes-character to be arrogant without being stupid. He looks down on Wallis not as a better mathematician, but as a sloppy thinker who uses "mystical" shortcuts.

  ### 5. Scene Suggestions & Metaphors

  To make this sing in a coffeehouse setting, use metaphors of **trade and craft** vs. **scholasticism**.

  *   **Hobbes as the Architect/Engineer:** He sees himself as a man of the real world. He builds systems (like *Leviathan*). He wants geometry to be solid, like brickwork.
      *   *Action:* He draws on the table with a knife or a coin. Physical marks.
      *   *Insult:* Calls Wallis a "schoolman" or a "presbyterian divine" (Wallis was a clergyman). Accuses him of using math to hide ignorance, just as priests use Latin.
  *   **Wallis as the Accountant/Alchemist:** He sees himself as a man of pure reason. He deals in the abstract relationships that govern the universe.
      *   *Action:* He writes symbols in a notebook. Abstract.
      *   *Insult:* Calls Hobbes a "carpenter" or a "mechanic." Accuses him of being unable to rise above the physical to see the universal truth.

  **Sample Dialogue Beat:**

  > **Hobbes:** "You speak of indivisibles. Tell me, sir: if I slice a cheese into infinite slices, does the cheese vanish? If your lines have no breadth, how do they make a surface? It is transubstantiation. It is priestcraft."
  >
  > **Wallis:** "It is arithmetic, Mr. Hobbes. The breadth is irrelevant. The ratio holds. You cling to the chalk because you fear the number."
  >
  > **Hobbes:** "I cling to the world! You live in a universe of words. I have squared the circle by motion. By cause. You have only squared it by... by hoping the sums behave."
  >
  > **Wallis:** "I have squared it by proof. And I will do it again tomorrow, when you publish your third correction."

  ### Summary for Your Notes
  1.  **Hobbes:** Geometry = Physics. Lines = Motion. Proof = Construction. Infinity = Nonsense.
  2.  **Wallis:** Geometry = Arithmetic. Lines = Numbers. Proof = Calculation. Infinity = Tool.
  3.  **The Tragedy:** Hobbes is consistent. He *cannot* accept Wallis's proof without abandoning his entire materialist philosophy. He isn't losing a math argument; he's watching his worldview be declared obsolete.
  4.  **The Vibe:** Hobbes is the angry old revolutionary who thinks the new guys are selling out truth for tricks. Wallis is the calm professional who thinks the old guy is a relic who doesn't understand the new tools.

  This gives your Hobbes-character dignity in his error. He isn't mad; he's just the last man standing for a universe where everything must be a Body.
