answer: |-
  **Setting:** *A dimly lit green room backstage at a conference center. The muffled sound of the audience dispersing drifts through the wall. Two empty coffee cups sit on a table between **ELENA** (50s, pragmatic, wearing a blazer that has seen better days) and **DAVID** (40s, intense, still wearing his microphone pack).*

  **ELENA:** (Rubbing her temples) You hammered the "liability" point hard in the Q&A. I thought we were here to talk about latency in target recognition, not the metaphysics of murder.

  **DAVID:** (Unclipping the mic) We can't talk about coding lethal autonomy without talking about who is liable to be killed. If we build a system that targets based on status rather than threat, we're baking a moral theory into silicon. And I still think your theory is broken, Elena.

  **ELENA:** My theory is what keeps soldiers from having to be Supreme Court Justices in the middle of a firefight.

  **DAVID:** Let's take the case you dodged onstage. The conscript. Let's call him Alex. Alex is drafted by an aggressor state. He's told his country is defending itself. He's non-culpably ignorant—he has no way of knowing his cause is unjust. He follows the rules of war. He shoots a soldier from the defending nation. Under Walzer's view, Alex is the moral equal of the defender.

  **ELENA:** Under Walzer's view, Alex is *protected* by the convention of war. Yes.

  **DAVID:** But the defender had a right to defend their home. If the defender had a right to defend, then Alex was threatening something he had no right to threaten. How can they be equals? It's like saying a mugger and a homeowner are moral equals because the mugger didn't break the window on his way in.

  **ELENA:** It's not like a mugging, David. That's the ordinary morality trap. War is a distinct practice. It's a collective state of violence. When Alex puts on that uniform, he enters a contract. The contract says: "I will follow the rules of engagement, and in exchange, if I kill you, I am not a murderer."

  **DAVID:** A contract between whom? The soldier on the other side didn't sign it.

  **ELENA:** It's a convention between states, accepted by the international community to limit the horrors of war. If you tell Alex, "You are not a moral equal," you are telling him he is liable to be killed *and* that he has no right to kill in return. But if he believes his cause is just—as he must, to fight effectively—then you're asking him to accept his own death as deserved while believing he's doing right. That's psychological torture.

  **DAVID:** I'm not asking him to accept it. I'm saying the *reality* is that he lacks the justification. Look, think about self-defense. If I mistakenly believe you're about to attack me, and I shoot you in "self-defense," I am objectively wrong. I might be *blameless* because I was ignorant, but I'm not *permitted*. The act is still a violation of your rights.

  **ELENA:** So you distinguish between being excused and being permitted.

  **DAVID:** Exactly. Alex is excused. He's not a criminal. He's a tragic figure. But he isn't *permitted* to kill the just combatant. The just combatant has done nothing to forfeit their right to life. By granting Alex "moral equality," you're saying he *did* have the right to kill. That's a lie.

  **ELENA:** It's a necessary fiction. Here's the practical cost you're ignoring. If we adopt your revisionism, the laws of war collapse. If combatants on the unjust side know they are morally liable to be killed without recourse, they have no incentive to follow *jus in bello*. Why follow the rules of engagement if you're a war criminal regardless?

  **DAVID:** They follow the rules because it's wrong to torture prisoners, not because they get a "get out of hell free" card for the war itself.

  **ELENA:** Come on. In the fog of war, incentives matter. Walzer's equality is a barrier. It says, "We won't judge your cause in the trenches; we will only judge your conduct." It contains the violence. If you remove that barrier, you turn every conflict into a holy war where the "just" side feels licensed to exterminate the "unjust" side because they are merely liable objects, not equal combatants.

  **DAVID:** (Pacing) But look at what you're buying with that containment. You're buying it with the lives of the just combatants. You're saying it's acceptable for Alex to kill the defender, provided Alex follows procedure. You're prioritizing the *structure* of war over the *justice* of the outcome.

  **ELENA:** I'm prioritizing the only thing we can actually regulate. We can regulate conduct. We cannot reliably regulate *ad bellum* judgment at the individual level.

  **DAVID:** But we're building machines now. (He taps the table) That's why this panel mattered. If we program an autonomous sentry, do we program it with Walzer or McMahan? If we program it with Walzer, it treats an invading soldier and a defending soldier as identical targets based on uniform and weapon. If we program it with McMahan, it needs to know *who started it*.

  **ELENA:** And how does the sensor determine *jus ad bellum*? It can't. So if your theory is true, autonomous weapons are inherently immoral because they can't make the distinction you demand.

  **DAVID:** Or, it means we admit that autonomous weapons can only be used in clearly defensive roles. But that's beside the point. The point is the moral truth. If Alex kills the defender, a life is extinguished that should not have been. Your convention washes the blood off Alex's hands. Mine acknowledges the stain, even if we don't punish him for it.

  **ELENA:** Acknowledging the stain doesn't help the next conscript. If you tell Alex he's morally unequal, you alienate him from the only community that can protect him: his fellow soldiers. You make him an outlier. Walzer gives him a shield. You strip him naked and tell him, "You're safe from prosecution, but you're still a killer." What does that do to a society post-war?

  **DAVID:** It forces a reckoning. It forces the society to ask, "Why were our sons killing men who had no reason to die?" Your view lets the society off the hook. "Oh, they were just equal combatants. Nothing to see here." Revisionism demands we look at the cause. It prevents the normalization of aggressive war.

  **ELENA:** (Sighs, leaning back) You sound like you want war to be impossible.

  **DAVID:** I want war to be morally intelligible.

  **ELENA:** It's not. It's a mess. And the "moral equality of combatants" is the firebreak. It stops the fire from jumping from the politicians who start the wars to the kids who fight them. You want to hold the kids accountable for the politicians' lies because they were ignorant?

  **DAVID:** Not accountable. Just... incorrect. There's a difference.

  **ELENA:** In the courtroom, maybe. In the grave? The defender is just as dead whether Alex was "excused" or "permitted." But the difference is, under my view, Alex can come home and reintegrate. Under yours, he comes home carrying the knowledge that he violated the rights of every man he put down, even if he couldn't have known it.

  **DAVID:** And under your view, the defender died knowing his killer had a "right" to kill him, when he was only defending his family. Which lie is more corrosive?

  *(Silence hangs between them. The cleaning crew starts vacuuming the auditorium outside, a low hum vibrating through the walls.)*

  **ELENA:** I spent twenty years studying this, David. I still don't know if Walzer was right, or if he was just... kind.

  **DAVID:** (Softening) And I don't know if McMahan is right, or if he's just demanding a clarity that human beings can't sustain in the dark.

  **ELENA:** (Standing up) We need to code the machines, though. Next month. The procurement committee wants specs.

  **DAVID:** (Gathering his papers) If we code for Walzer, we risk automating injustice. If we code for McMahan, we risk systems that hesitate when they shouldn't, or judge what they can't know.

  **ELENA:** So we build them to follow the rules, and we hope the politicians don't break the world.

  **DAVID:** And we hope the soldiers don't have to pay for it.

  *(Elena picks up her bag. She pauses at the door.)*

  **ELENA:** That conscript, Alex. In your view... does he deserve forgiveness?

  **DAVID:** (Looks up) He deserves pity. And he deserves a world where he isn't asked to kill for a lie.

  **ELENA:** In mine, he deserves to sleep at night.

  **DAVID:** Maybe those are the same thing.

  *(Elena exits. David stays behind, turning off the small table lamp, leaving the room in the gray glow of the exit sign.)*
