      *   *Excusing Conditions:* "He didn't mean to," "He was pushed." The agent is still a participant, but the *quality of will* in this specific instance wasn't bad. (Mitigation).
      *   *Exempting Conditions:* "He is a child," "He is psychotic." The agent is not currently capable of participating in normal moral relations. We take the *objective attitude* (manage/treat rather than blame).
      *   *The Tension:* The user notes the case resists clean categorization. It looks like an exemption (dissociation/psychosis) but is temporary/situational (grief-induced). If we exempt, do we lose the ability to hold them accountable later? If we excuse, do we ignore the medical reality of the loss of control?
      *   *The Solution:* A "Finding of Non-Responsibility due to Incapacity" (Exemption) *for this incident*, coupled with a "Re-entry/Accountability Plan" (return to Participant Status). This acknowledges the medical reality (no ill will/capacity) without permanently objectifying the student or dismissing the harm.

