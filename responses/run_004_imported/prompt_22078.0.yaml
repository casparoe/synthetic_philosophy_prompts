answer: |-
  This is a classic and formidable objection to disjunctivism, often called the **"Causal Argument"** or the argument from **"Common Proximate Cause."** Your friend is relying on a deeply entrenched intuition in philosophy of mind: Internalism. The intuition is that what makes a mental state *the kind of state it is* must supervene on what is happening inside the skin (specifically, the brain). If the brain is identical, the mind must be identical.

  To defend disjunctivism without retreating into a weak stipulation that hallucinations are merely "not-seeing," you need to attack the Internalist assumption head-on. You need to argue that the *metaphysical nature* of an experience is not exhausted by its proximate neural cause.

  Here is the strongest disjunctivist response, structured around three key moves: **Externalism about Mental States**, the **Constitution vs. Causation Distinction**, and a **Positive Account of Hallucination**.

  ### 1. The Externalist Move: Mental States Are Not Just Brain States
  Your friend's objection assumes that the identity of a mental state is determined solely by internal physiology. Disjunctivism rejects this. It aligns with **Semantic Externalism** (like Putnam's Twin Earth), but applies it to *phenomenal character* and *mental kinds*.

  *   **The Argument:** Consider the mental state of **knowing**. You can have two subjects with identical brain states. Subject A looks at a clock that is working and tells the right time (Knowledge). Subject B looks at a broken clock that happens to show the right time by luck (True Belief).
  *   **The Point:** Despite identical proximate neural causes, we intuitively agree that Subject A is in a fundamentally different mental state (Knowledge) than Subject B (Lucky Guess). Knowledge is a factive state; it requires the world to cooperate.
  *   **Application to Perception:** Disjunctivists argue that **Veridical Perception** is like Knowledge. It is a factive mental state. It is essentially a relation to an external object. If the object is missing, you cannot be in that specific relational state, no matter how similar your brain activity is. The presence of the object is not just a *cause* of the experience; it is a *constituent* of it.

  **Response to Friend:** "You are assuming that the brain state *exhausts* the mental state. But if perception is a relation to the world (like knowing is a relation to a fact), then the external object is part of the experience's identity conditions. Identical brain states can realize different mental kinds if one succeeds in latching onto the world and the other fails."

  ### 2. The Metaphysical Move: Constitution vs. Causation
  This is the technical heavyweight counter to the "same cause" objection. Your friend argues: *Same Cause $\rightarrow$ Same Effect.* The disjunctivist replies: *Same Causal Precondition $\nrightarrow$ Same Constitutive Nature.*

  *   **The Analogy of the Marriage:** Imagine a wedding ceremony. In Case A, the couple says the vows, and the officiant is licensed. In Case B, the couple says the exact same vows (same physical sounds, same brain states in the couple), but the officiant is an impostor with no legal authority.
      *   In Case A, a **Marriage** occurs.
      *   In Case B, no Marriage occurs (only a "mock marriage" or "seeming marriage").
      *   **The Kicker:** The physical actions (the proximate cause) were identical. But the *social fact* created is fundamentally different in kind. One is a binding union; the other is a charade. The external fact (the license) doesn't just *cause* the marriage; it *constitutes* it.
  *   **Application:** The neural state is like the speaking of the vows. It is the *causal precondition* for the experience. But in the veridical case, the external object *completes the circuit* to constitute a perceptual relation. In the hallucination, that circuit is broken. The neural state is the same, but the resulting event is metaphysically distinct.

  **Response to Friend:** "You are conflating the *causal basis* of the experience with the *nature* of the experience. The brain state is the engine, but the experience is the journey. If the road exists (the object), you are driving. If the road is a hologram (hallucination), you are simulating driving. The engine noise is the same, but 'driving' and 'simulating driving' are different kinds of events, defined by their relation to the environment, not just the engine."

  ### 3. Addressing Your Constraint: A Positive Characterization of Hallucination
  You mentioned you want to avoid characterizing hallucination merely negatively (i.e., "whatever is indiscriminable from seeing"). Strong Disjunctivism (specifically M.G.F. Martin's version) often leans this way, but it leaves you vulnerable to the charge that hallucinations are "nothing."

  To strengthen your position, offer a **Positive Disjunctive Account**:
  *   **Veridical Perception:** A relational state of *awareness of X*. Its nature is determined by X.
  *   **Hallucination:** A positive, non-relational state of *apparent awareness*. Its nature is determined by the internal neural/functional profile.

  **Crucial Distinction:** Admit that hallucinations have a **positive intrinsic nature**. They are real mental events with their own causal powers and neural realizers.
  *   **The Disjunctivist Claim:** The claim is *not* that hallucinations have no nature. The claim is that the nature of a hallucination is **not the same kind** as the nature of a perception.
  *   **Why this helps:** It concedes to your friend that the hallucination is a "real thing" caused by the brain (satisfying her causal intuition) but maintains that it is a *different species* of mental event than perception.
  *   **The "Indiscriminability" Point:** Explain that introspective indiscriminability is an **epistemic** relation, not a **metaphysical** one. Just because a subject cannot tell the difference between Gold and Fool's Gold (pyrite) does not mean they are the same substance. Similarly, just because a subject cannot tell the difference between Perception and Hallucination does not mean they share a common mental core.

  ### Summary of the Counter-Argument
  Here is how you can synthesize this into a response for your friend:

  > "Your objection relies on the assumption that the intrinsic nature of an experience must supervene on the brain state alone. But this assumes Internalism, which Disjunctivism explicitly rejects in favor of Externalism.
  >
  > Consider the distinction between **causation** and **constitution**. The identical brain state in both cases is the *causal precondition*, but it does not exhaust the *metaphysical constitution* of the experience. In the veridical case, the experience is constituted by the brain state *plus* the actual object (a relational state). In the hallucination, the experience is constituted by the brain state alone (a non-relational state).
  >
  > Just as a 'valid marriage' and a 'mock wedding' can involve identical physical actions but differ in kind due to external legal facts, 'seeing' and 'hallucinating' can involve identical neural firing but differ in kind due to the presence of the object.
  >
  > Finally, I am not claiming hallucinations are 'nothing.' They are positive states of *apparent seeing*. But 'apparent seeing' and 'actual seeing' are as metaphysically distinct as 'fake diamond' and 'real diamond.' The fact that they look the same to the subject is an epistemic limitation of the subject, not proof of a shared mental ontology."

  ### Recommended Reading for Ammo
  If she wants to go deeper, point her to these specific arguments:
  1.  **M.G.F. Martin, "The Limits of Self-Awareness" (2004):** This is the definitive text on the "Causal Argument" against disjunctivism. He explicitly addresses the "same cause" objection using the distinction between causal explanation and metaphysical nature.
  2.  **John McDowell, "Criteria, Defeasibility, and Knowledge" (1982):** For the analogy between perception and knowledge (factive states).
  3.  **Hilary Putnam, "The Meaning of 'Meaning'" (1975):** For the general Externalist framework (Twin Earth) that underpins the rejection of her internalist intuition.

  This approach respects her intuition (yes, the brain is the same) but challenges her inference (therefore the mental state is the same), which is the only way to win a disjunctivist debate.
