      *   **Recommendation:** Reject the *build*, but perhaps suggest the postdoc resubmit for a *theoretical/empirical limits study*. (Actually, let's stick to a clean Reject for the current proposal to be decisive, but offer the pivot in the feedback).
      *   **Wait, let's look at the "Fund with Conditions" option again.** If I say "Fund on condition you study the limits," that's effectively a new proposal. It's cleaner to Reject this one and invite a new one.
