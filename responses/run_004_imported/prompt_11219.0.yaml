          3.  *The "Implicit Commitment" Argument (Best Strategy):* This is the standard strong defense (associated with Halbach, Horsten, or responses to Shapiro). The argument is: If you accept PA, you are *already* committed to Con(PA) implicitly. You just didn't have the vocabulary to express it. Adding the truth predicate doesn't add *ontological* weight; it just makes explicit the commitments you already held by accepting the base theory. The truth predicate is a device for expressing infinite conjunctions/generalizations. It expands expressive power, not metaphysical commitment.

