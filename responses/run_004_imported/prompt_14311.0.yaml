answer: |-
  You have hit on a profound and widely debated issue in formal epistemology. Your intuition is mathematically sound: the geometric structure of Jim Joyce's accuracy-dominance argument is isomorphic to the structure of de Finetti's Dutch Book argument. Both rely on convexity theorems to show that incoherent points in a probability space are "dominated" by coherent points.

  However, the claim that Joyce's argument is "nonpragmatic" rests not on the mathematical machinery, but on the **normative interpretation of the currency** being minimized and the **bridge principles** connecting the math to the mind.

  Here is the substantive breakdown of why Joyce's argument is classified as epistemic rather than pragmatic, along with the lingering objections that suggest the line is blurrier than proponents admit.

  ### 1. The Currency of the "Loss" (Prudence vs. Veritism)
  The most obvious distinction is what the agent is losing.

  *   **Dutch Book (Pragmatic):** The "loss" is monetary (or utility-based). The argument shows that if your credences violate the axioms, you are disposed to act in a way that frustrates your own preferences (losing money). The normativity derives from **prudence**: it is irrational to act against your own interests.
  *   **Joyce (Epistemic):** The "loss" is inaccuracy (distance from the truth). The argument shows that if your credences violate the axioms, there is an alternative set of credences that is *more accurate* in every possible world. The normativity derives from **veritism**: it is irrational to hold beliefs that are less accurate than they could be.

  **Why this matters:** If epistemology is the study of knowledge, justification, and truth, a justification for probabilism that relies on *money* is category-mistaken. It justifies probabilism as a norm of *action*, not a norm of *belief*. Joyce's argument attempts to justify probabilism as a norm of belief *itself*, independent of whether those beliefs ever cash out in bets.

  ### 2. The Bridge Principles (Belief-Action vs. Belief-World)
  To get from the math to the norm, both arguments require a bridge principle linking credences to the "currency."

  *   **Dutch Book Bridge:** *Credences are identified with (or entail) betting dispositions.*
      *   *Vulnerability:* This invites the "conditional fallacy" or simply the objection that one can have beliefs without being willing to bet. If I refuse to bet, the Dutch Bookie cannot touch me. The DBA thus seems to show that *betting incoherently* is bad, not necessarily *believing incoherently*.
  *   **Joyce Bridge:** *Credences are evaluated by their accuracy relative to the world.*
      *   *Advantage:* This links belief directly to the world (truth values), not to action. Even if you are stranded on a desert island with no opportunity to bet, your credences are still accurate or inaccurate. Joyce argues that accuracy is the constitutive aim of belief (following William James or Bernard Williams). Therefore, the dominance of accuracy applies to the doxastic state itself, regardless of behavioral dispositions.

  ### 3. The Scope of the Norm
  Because of the bridge principles, the scope of the two arguments differs.

  *   **DBA:** Applies strictly to agents who engage in transactions or have preferences over outcomes. It is a norm of **instrumental rationality**.
  *   **Joyce:** Applies to any agent with graded beliefs. It is a norm of **theoretical rationality**.

  If you accept Joyce's premise that "accuracy is the sole fundamental epistemic good," then the dominance argument proves that probabilism is a requirement of epistemic rationality, not just financial safety.

  ### 4. The "Decision Theoretic" Objection (Where your suspicion is valid)
  Your suspicion that this is "the same move in different clothing" is shared by several critics (e.g., Alan Hájek, Brian Hedden, and Richard Pettigrew to some extent). They argue that Joyce's argument is **pragmatic in structure**, even if epistemic in content.

  **The Objection:** Joyce's argument uses the **Dominance Principle** from decision theory.
  1.  Define a set of options (credence functions).
  2.  Define a utility function (negative Brier score/accuracy).
  3.  Show that Option A dominates Option B.
  4.  Conclude: Rational agents must not choose dominated options.

  Critics argue that step 4 is a *pragmatic* norm of choice. By framing epistemic rationality as a maximization problem (maximizing expected accuracy), Joyce is essentially treating truth as a "cognitive utility." If epistemic rationality is just a species of decision theory, is it truly "nonpragmatic"?

  **The Joycean Reply:** Proponents argue that there is a distinction between **pragmatic reasons** (concerning well-being, desire satisfaction, money) and **epistemic reasons** (concerning truth, evidence, accuracy). Even if the *logic* of the argument is decision-theoretic, the *values* being maximized are purely epistemic. Therefore, it vindicates probabilism as an *epistemic* norm, distinct from a *prudential* norm.

  ### 5. Why the Distinction is Substantive, Not Just Semantic
  The distinction protects probabilism from the "So What?" objection.

  *   **Against DBA:** A skeptic can say, "I don't care about money. I don't bet. Therefore, I don't need to be probabilistic."
  *   **Against Joyce:** A skeptic must say, "I don't care about accuracy. I don't care if my beliefs map reality correctly."

  The latter is a much harder position to hold if one accepts that belief *aims at truth*. By shifting the currency from money to accuracy, Joyce forces the skeptic to attack the nature of belief itself, rather than just opting out of the betting market.

  ### Summary
  You are correct that the **logical engine** is identical (convexity/dominance). However, the **normative ground** is different.

  *   **Dutch Book:** Violating probabilism makes you a **sucker** (pragmatic defect).
  *   **Joyce:** Violating probabilism makes you **inaccurate** (epistemic defect).

  Joyce's argument counts as "nonpragmatic" because it severs the link between rationality and action/utility, grounding it instead in the relationship between mind and world (accuracy). Whether one accepts that "accuracy" can function as a utility without rendering the argument pragmatic is the central tension in modern epistemic utility theory, but the *intent* and *classification* rely on that shift from prudence to veritism.
