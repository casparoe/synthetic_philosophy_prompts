answer: |-
  You have identified the single most famous objection to expressivism, but your assessment that it "settles the debate" is precisely where the contemporary metaethical conversation gets interesting. If the Frege-Geach problem were the knockout blow you suggest, metaethics would have looked very different for the last 40 years.

  Philosophers like Simon Blackburn and Allan Gibbard do not concede because they do not accept the premise that logical validity *requires* robust truth-apt content in the way cognitivism understands it. Furthermore, they argue that expressivism solves other, equally difficult problems that cognitivism cannot.

  Here is why the debate is still very much alive, and why expressivists continue to build elaborate theories rather than packing up.

  ### 1. The Project of Quasi-Realism
  You interpret the Frege-Geach problem as proof that moral sentences *must* have truth conditions. Simon Blackburn's response, known as **Quasi-Realism**, essentially agrees with you on the surface but disagrees on the underlying metaphysics.

  Blackburn's goal is not to deny that moral language *functions* logically. His goal is to explain **how non-cognitive attitudes can earn the right to mimic cognitive discourse.** He argues that we can develop a logic of attitudes. When we say, "If lying is wrong, then getting your brother to lie is wrong," the expressivist argues we are not comparing two truth-bearing propositions; we are expressing a higher-order attitude about the consistency of our lower-order attitudes.

  For Blackburn, the fact that moral language *looks* truth-apt is a feature of our linguistic practice that expressivism must explain, not a metaphysical fact that refutes it. He argues we can have a "minimalist" or deflationary notion of truth where moral claims count as "true" simply because they are properly assertible within the moral framework, without requiring a mind-independent moral reality.

  ### 2. Logic Without Truth Conditions
  Your argument rests on the assumption that for *modus ponens* to work, the premises must be capable of being true or false. Expressivists challenge this.

  Allan Gibbard, in *Wise Choices, Apt Feelings* and later works, argues that logic is not solely about the preservation of truth, but about the **consistency of norms**. To accept "If lying is wrong, then X is wrong" and "Lying is wrong" while denying "X is wrong" is not a failure to track truth; it is a failure of rational coherence in one's planning states.

  Recent work by philosophers like Mark Schroeder (in *Being For*) has attempted to construct formal semantic models for expressivism. Schroeder argues that the Frege-Geach problem is technically solvable if we posit that moral sentences express complex relations of "being for" certain types of mental states. The logic holds because the mental states themselves have a structure that mirrors logical operators, even if they aren't descriptive beliefs.

  ### 3. The Trade-Off: Why Save Expressivism?
  If the Frege-Geach problem is so difficult, why not just become a cognitivist? Because cognitivism faces its own "decisive" problems that expressivism solves elegantly.

  *   **The Motivation Problem (Internalism):** Cognitivism struggles to explain why believing "X is wrong" necessarily provides a motivation not to do X. If moral judgments are just beliefs about facts (like "snow is white"), why do they move us to act? Expressivism explains this naturally: moral judgments *are* conative states (desires/attitudes), which are inherently motivational.
  *   **The Queerness Argument:** J.L. Mackie argued that if moral facts existed, they would be metaphysically "queer"—unlike any other facts in the universe, requiring a special faculty of intuition to detect. Expressivists avoid positing these strange entities entirely.
  *   **Epistemology:** If moral facts are truth-apt, how do we know them? Expressivists avoid the need for a moral epistemology because there are no moral facts to know, only attitudes to hold.

  For an expressivist, the Frege-Geach problem is a technical hurdle to be cleared, whereas the problems of motivation and queerness are existential threats to cognitivism. They keep working on expressivism because they believe the cost of solving Frege-Geach is lower than the cost of accepting moral realism.

  ### 4. The Shift to Hybrid Views
  The state of play has actually moved beyond the binary you describe. Many contemporary metaethicists now advocate for **Hybrid Expressivism** (e.g., Daniel Boisvert, Michael Ridge, Mark Schroeder).

  These theories concede part of your point: they argue that moral sentences *do* have some truth-apt descriptive content (which solves Frege-Geach) but *also* express non-cognitive attitudes (which solves the Motivation Problem). In this view, "Lying is wrong" might mean "Lying has natural property N, and I disapprove of N."

  This development acknowledges the force of the Frege-Geach objection without conceding the entire expressivist insight. It suggests the debate isn't about whether expressivism is "dead," but about how much cognitive content is required to make the logic work.

  ### Summary
  Philosophers don't concede because:
  1.  **Quasi-Realism** aims to explain away the appearance of truth-aptness rather than deny the logical function.
  2.  **Deflationary theories of truth** allow expressivists to say moral claims are "true" without being realist.
  3.  **Cognitivism has fatal flaws** regarding motivation and metaphysics that expressivism avoids.
  4.  **Hybrid theories** have emerged that incorporate the logical insights of cognitivism while retaining the psychological insights of expressivism.

  The Frege-Geach problem is the price of admission for expressivism, not the eviction notice. As long as philosophers believe that moral judgments are inherently motivational in a way descriptive beliefs are not, expressivism (in some form) will remain a viable contender.
