answer: |-
  The seed merchant called it Sun-Grain. He laid the samples on the table, kernels hard and bright as copper coins. He told them the history of it: in half the valleys where it was planted, the stalks grew tall and yielded one and a half times the seed sown. In the other half, the blight took hold, and the harvest returned only six tenths of what was planted. The weather decided which valley got which fate, and the weather did not care who planted the seed.

  "It's a gift," Elias said, weighing a handful of the copper kernels. He looked at Kael across the table. "On average, you walk away with more than you started. Every single season."

  Kael ran a thumb over the grain. He was the older of the two, though only by a year. They had shared fences and water rights since they were boys. "On average," Kael said. "But if I plant it all and the blight comes, I have less seed for next year. Then I need a bigger win just to get back to where I am."

  "So don't get blight," Elias said, smiling. He poured the entire sack into his bin. "I'm planting every grain I have. Why leave wealth in the barn?"

  Kael opened his own sack. He poured three-quarters into his bin and locked the remaining quarter in the iron-bound chest beside the hearth. "I'm planting enough to eat, and enough to grow. The rest stays."

  "You're choking the field," Elias said, shaking his head. "You know the odds are in our favor. You're leaving money on the table."

  "I'm keeping a future," Kael said.

  The first harvest was lush. The rains came soft and steady. Elias's fields exploded with gold. He harvested sacks piled higher than his head, one and a half times what he'd sown. He laughed when he saw Kael's yield. Kael's fields were healthy, but smaller. He had held back seed, so his harvest was smaller still.

  Elias bought new tools. He reinforced his barn. He clapped Kael on the shoulder. "Look at the cost of caution, friend. You could have had this."

  Kael counted his sacks. He put the same fraction into the bin for the next season and locked the rest in the chest. "The weather changes," he said.

  The second year was lush too. Elias was now operating on a scale Kael couldn't match. He was planting four times what he had started with. Kael was growing, but slowly, like a tree ring. Elias began to talk about buying the mill down the road. He spoke of the average yield as if it were a promise written in stone. "It's math, Kael. You can't argue with the average."

  "I'm not arguing with the average," Kael said, watching the clouds gather over the ridge. "I'm arguing with the sequence."

  The third year, the blight came.

  It swept through the valley like a grey fire. The stalks withered before they could head. Elias stood in his field, kicking at the dry earth. He had planted everything, every grain of his massive surplus. The harvest returned only six tenths. His mountain of grain vanished into a hill. He was still above where he started three years ago, but the collapse was violent. The silence in his barn was heavy.

  Kael lost his crop too. The blight didn't care. But when he opened his chest, he had the reserve. He planted the next season from the iron box. His total wealth dipped, but he didn't stumble.

  Elias borrowed. He couldn't bear to shrink his operation. "I just need one good year to make back the loss," he told Kael. "The odds reset every time. The average is still positive."

  "You're planting debt," Kael said.

  "I'm planting opportunity."

  Years turned. The weather swung like a pendulum. Good years, bad years, good, bad, good. Sometimes two bad years in a row. Sometimes three good.

  Elias rode the waves. When the sun came, he surged ahead, his wealth compounding explosively. He looked like a king. When the blight came, he crashed harder. Because he was betting everything, every loss took a chunk out of a larger base, and every gain had to work harder to recover the ground. A forty percent loss required a sixty-seven percent gain just to break even, but the seed only offered fifty. He didn't notice the floor rising to meet him, slowly, inevitably. He only saw the peaks.

  Kael's barn never looked impressive. He never bought the mill. He never bought new tools unless the old ones broke. But his sacks never emptied. He slept through the storms. When Elias would come over, frantic after a bad season, calculating how many big wins he needed to recover, Kael would offer him bread and listen.

  "Don't bet the whole sack," Kael would say.

  "If I don't bet big, I'll never catch up," Elias said. He looked tired. The lines around his eyes were deep. "The math says I should win. Why am I losing ground?"

  "Because you're playing one game," Kael said. "You think you're playing a thousand people at once. But you're just one man playing one game, over and over."

  Elias didn't answer. He went back to his fields.

  Ten years after the Sun-Grain arrived, the valley held a drought. It wasn't the blight, just dry wind. The yield was poor across the board, even for the traditional crops. The Sun-Grain returned barely half its seed.

  Elias stood by his fence. His barn was empty. He had planted everything again, chasing the average, chasing the recovery. The multiplicative drag had finally eaten the hull. He had no seed for the spring. He had no reserve. The positive expected value had not saved him from the timeline he actually lived.

  Kael walked over. He carried a sack of seed on his shoulder. He didn't say *I told you so*. He didn't talk about geometric means or ergodicity. He just set the sack down on the post between them.

  Elias looked at the seed, then at his own barren fields. He looked at Kael's barn, modest and full.

  "The average was right," Elias whispered. "Over ten years, the valley produced more than we started with. I did the right thing."

  "You did the logical thing," Kael said. "For a crowd."

  "For me," Elias said.

  "For you," Kael agreed.

  Elias put his hand on the sack. It was heavy enough to plant a field, light enough to carry. He looked at the horizon where the sun was setting, casting long shadows across the fields that would lie fallow without seed.

  "I don't know how to plant small," Elias said.

  "Then don't," Kael said. He turned back toward his own house. "Just know that next year, I'll have seed again. Whether you do depends on what you take from this sack."

  Kael walked away. Elias stood at the fence for a long time, holding the weight of the grain, watching the light fade over the fields where the math had worked perfectly, and yet had failed him completely. He opened the sack. He looked at his own empty barn. He looked at the darkening sky.

  He began to count out the kernels, one by one, into his hand.
