answer: |-
  I have some good news and some bad news for you regarding your bet.

  The good news is that your writing group member is well-read; they are correctly referencing a specific, famous debate in the philosophy of science. The bad news is that they are about 50 years out of date. There is no working formula, the "math" they described was proven logically impossible in 1974, and even if it weren't, it cannot be applied to literature.

  Here is the breakdown of what your friend was talking about, why the formula doesn't exist, and why you shouldn't let it worry your novel.

  ### 1. What Your Friend Was Talking About (Popper's Definition)
  In 1963, the philosopher Karl Popper published *Conjectures and Refutations*, where he tried to solve a problem: How do we say that Einstein's theory is "closer to the truth" than Newton's, if we assume that even Einstein's theory might eventually be proven false?

  He proposed the concept of **Verisimilitude** (or "truthlikeness"). He suggested that the verisimilitude ($Vs$) of a statement or theory ($A$) could be calculated by comparing its **Truth Content** ($Ct_T$) against its **Falsity Content** ($Ct_F$).

  In plain English, the "formula" looked like this:

  $$Vs(A) = Ct_T(A) - Ct_F(A)$$

  *   **Truth Content:** The set of all true statements that can be derived from your account.
  *   **Falsity Content:** The set of all false statements that can be derived from your account.

  **How your friend wanted to apply it:**
  *   **Your Friend's Book:** High Truth Content (matches the logs), Low Falsity Content (invents little).
  *   **Your Book:** Lower Truth Content (changed dates, invented affair), Higher Falsity Content (things that didn't happen).

  Under a naive reading of Popper, your friend wins. Their book has more true statements and fewer false ones.

  ### 2. Why The Formula Is Broken (The 1974 Collapse)
  Here is the part your friend missed. In 1974, two philosophers, **Pavel Tichý** and **David Miller**, independently proved that Popper's definition is logically inconsistent.

  They demonstrated mathematically that under Popper's rules, **no two false theories can be compared.**

  Here is the logic in plain English: If a theory is false (which both of your novels are, because they are fiction), adding *more* content to it inevitably increases its Falsity Content faster than it increases its Truth Content. Popper's math accidentally implies that a theory that says *nothing* is closer to the truth than a theory that tries to explain everything but gets a few details wrong.

  Worse, it implies that if you correct a false statement in your story, you might actually *lower* your verisimilitude score depending on how the logical consequences stack up.

  **The Result:** The philosophical community did not settle on a new "agreed-on formula." Instead, this sparked 50 years of ongoing debate. Philosophers like Ilkka Niiniluoto and Graham Oddie have proposed *new* measures (like the "min-sum" measure or "similarity" approaches), but none are universally accepted as "the solution." There is no textbook equation you can plug variables into.

  So, objectively? **The bet is a draw because the metric is broken.**

  ### 3. The Category Error (Science vs. Art)
  Even if a perfect formula for scientific verisimilitude existed today, it would still be the wrong tool for your novel. This is a **category error**.

  Popper was talking about **propositional truth**. He was analyzing scientific claims like "Water boils at 100°C."
  *   If the water boils at 100°C, the statement is True.
  *   If it boils at 99°C, the statement is False.

  Novels do not work on propositional truth. A novel makes a **narrative claim**.
  *   When you write about an invented affair between the first mate and a passenger, you are not making a historical claim that "This specifically happened."
  *   You are making a thematic claim that "This *could* have happened, and it illuminates the human experience of the wreck."

  In literature, "Truth Content" isn't about matching logbooks; it's about **internal consistency** and **psychological realism**. If your invented affair feels earned, resonates with the themes of grief, and fits the characters' motivations, it has high *literary* verisimilitude, even if it has zero *historical* verisimilitude.

  Applying Popper's scientific verisimilitude to a novel is like using a thermometer to measure the weight of a painting. It's measuring the wrong property.

  ### 4. What "Verisimilitude" Actually Means for Novelists
  In creative writing, verisimilitude does not mean "adherence to fact." It means **"the appearance of being true or real."**

  Readers accept dragons in *Game of Thrones* because they behave consistently within the world (high verisimilitude). Readers reject a character suddenly knowing kung fu in a gritty crime drama if it wasn't set up (low verisimilitude), even if people *do* know kung fu in real life.

  For your historical fiction:
  *   **Your Friend's Approach:** Prioritizes **factual accuracy**. This is valuable for history buffs.
  *   **Your Approach:** Prioritizes **narrative truth**. This is valuable for emotional resonance.

  Neither is "closer to the truth" in a philosophical sense because they are aiming at different targets. Your friend is aiming at the **Event** (the wreck). You are aiming at the **Experience** (the grief/duty).

  ### 5. How to Settle the Bet
  Since the philosophical formula is defunct and misapplied, you should settle the bet based on the actual goal of historical fiction.

  **The "Hilary Mantel" Defense:**
  The late, great historical novelist Hilary Mantel (author of *Wolf Hall*) argued that the novelist's job is not to be a court stenographer. She said: *"The past is not a foreign country; it is a different country, and we need a passport to enter it. That passport is imagination."*

  If you stick only to the documented record, you often lose the "truth" of the human experience because history rarely documents interiority (what people felt). Documents tell us the ship sank at 4:00 PM; they don't tell us the captain's regret. Your invented affair might be factually false, but if it reveals a truth about loneliness or duty that the logs omit, you are achieving a different, arguably deeper kind of verisimilitude.

  **My Advice:**
  Tell your writing group member that while Popper's 1963 definition is a fascinating piece of intellectual history, the Tichý/Miller proof of 1974 rendered it unusable for calculation.

  Tell your novelist friend: **"Popper's math is broken, so we can't use it. Instead, let's judge based on the reader. Whose book makes the wreck feel real?"**

  Keep writing your affair. If it serves the grief and the duty, it belongs in the book. Historical fiction that feels like a textbook is often less "true" to the human experience than historical fiction that takes risks to find the emotional core.
