      2.  **The Category Error:** Confidence $\neq$ Knowledge.
      3.  **The Defeasibility Condition:** Knowledge requires ruling out contrary evidence, not assuming it's false.
      4.  **The Circularity:** Assuming the conclusion to dismiss the premise.
      5.  **The Institutional Role:** Jury duty is a specific epistemic practice designed to prevent this exact error.

  9.  (Review against constraints): The user wants to know *where* the reasoning breaks down. I need to be precise. It breaks down at the claim to *knowledge* prior to *total evidence evaluation*.

