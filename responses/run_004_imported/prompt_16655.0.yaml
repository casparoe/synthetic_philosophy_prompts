      *   **Point 2: Circularity/Question-Begging.** To say the evidence is misleading assumes the conclusion (guilt) is already fixed. But the evidence is there to test the conclusion.
      *   **Point 3: Fallibilism.** Human judgment is prone to error. The "knowledge" claim is premature.
