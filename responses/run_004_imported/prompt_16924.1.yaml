      *   **The "Fines are Debts" Argument (The Core Analysis):** This is the crux. A parking fine is technically a penalty, but functionally a debt to the state. It lacks the *retributive* sting of prison. Prison is about the *body* and *liberty* of the offender. It is inherently personal. You cannot rehabilitate or incapacitate a substitute.
      *   **Implications for PSA:** If God's justice is retributive (like prison), PSA is unjust (punishing the innocent). If God's justice is compensatory (like fines), PSA is coherent but ceases to be *Penal* Substitution. It becomes *Satisfaction*.
