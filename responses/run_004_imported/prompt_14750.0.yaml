      *   **Distinguish Implementation vs. Theory:** Explain *why* current systems don't wirehead yet. It's not because they *won't*, but because they *can't* (yet). This addresses the "capability" aspect.
      *   **Nuance the Reward Mechanism:** Differentiate between "reward as input" (ICSS) vs. "reward as feedback signal" (RLHF/RL). In current LLMs, the reward isn't always a direct input the model can modify during deployment.
      *   **Address the "Convergent Instrumental Goal" aspect:** Acknowledge that instrumental convergence theory supports their view (agents seek to preserve and maximize reward).
