      *   *The Nature of the Reward Signal:* In ICSS, the stimulation *is* the reward. In RL, the reward is a scalar feedback signal used to update weights. During deployment (inference), the model isn't usually updating weights. So, wireheading requires *training-time* access or *goal misgeneralization* where the model pursues the *proxy* for reward rather than the intent.
