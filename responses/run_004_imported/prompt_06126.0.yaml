answer: |-
  Good evening, everyone. For those who don't know me, I'm the bride's brother. I also own a hardware store with my best friend.

  After twelve years of business, you learn that there is a difference between two people happening to agree, and two people making a decision *as a unit*. If my partner and I both independently decide we like a certain brand of hammer, that's a coincidence. But if we order five hundred of them "for the store," something shifts. I can't wake up the next day and decide, "Actually, I'm out." I don't have that right anymore. I've given it away.

  For a long time, I wondered what that shift was. Eventually, I started reading about what philosophers call "joint commitment." Specifically, the work of Margaret Gilbert.

  Now, I'm not going to give a lecture—mostly because the only people who would enjoy it are sitting at table four, and I don't want to bore the rest of you. But Gilbert's idea changed how I see marriage.

  She argues that when we jointly commit, we become what she calls a "plural subject." We aren't just two individuals walking parallel lines. We are a single entity made of two wills. And because of that, the commitment doesn't rely on your mood. It holds on the days you feel deeply in love, and it holds on the days you're tired, or frustrated, or wondering why we ordered five hundred hammers.

  More importantly, this commitment gives you something precious: it gives each of you the standing to call the other back.

  In a casual relationship, if one person drifts, the other can only feel disappointed. But in a marriage built on joint commitment, if one of you drifts, the other has the *right* to say, "Wait. This isn't who we are. We made a promise." It turns accountability into an act of love. It means you never have to navigate the hard days alone, because the "you" that is navigating them is bigger than just one person.

  So, [Sister] and [Fiancé], my wish for you isn't that you always feel the rush of romance you feel tonight. Feelings are weather; they change.

  My wish is that you build the structure that holds when the weather turns. May you always honor the "we" you are creating today. May you never try to rescind that commitment unilaterally. And may you always grant each other the privilege of reminding the other who they are together.

  To the bride and groom.
