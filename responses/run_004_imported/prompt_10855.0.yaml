  ### A Note for You (The TA)
  Since you mentioned the argument with Deniz is still rattling around: It is completely normal that this specific point (the Condorcet cycle vs. IIA) is tripping you up. It is one of the most persistent misconceptions in teaching social choice.

  Many people intuitively feel that the Condorcet cycle *must* be an IIA violation because the presence of candidate C changes the *winner* between A and B. But Arrow's IIA is about the *social ranking*, not the winner selection method. Under Majority Rule, the social *ranking* of A vs. B remains "A > B" regardless of C; the problem is that the collection of those rankings creates a cycle (A>B, B>C, C>A), violating the requirement that the social welfare function outputs a *transitive* order.

  The student made this exact error. You were right to pause on grading it. Docking points here is justified, but recognize that this is a subtle distinction that often requires a blackboard proof to fully untangle. You're doing a good job.
