answer: |-
  **Setting:** *A dimly lit server room at the Institute for Strategic Logic. A single terminal glows on a desk. A digital countdown on the wall reads 04:12. ELENA and MARCUS stand over the keyboard. They are co-authors on a grant proposal that hinges on the outcome of this automated negotiation. The opposing party is an anonymous AI research lab, known to be competent.*

  **Elena:** (Hand hovering over the enter key) We're uploading *FairBot*. It's the only consistent choice. If we upload anything else, we're signaling that we don't understand the game.

  **Marcus:** We're signaling that we understand the *world*, Elena. Look at the constraints again. "Source code transparent." It doesn't say "semantically equivalent." It says *source code*. *FairBot* relies on finding a proof that the opponent cooperates if and only if *FairBot* cooperates. That requires the opponent to run a proof search on *our* specific syntax.

  **Elena:** That's implementation detail. If they are rational, they will recognize the logical structure. Tennenholtz's point wasn't about string matching; it was about computational transparency replacing the black box of the mind. If I can see your code, I can see your intent. If your intent is conditional cooperation, mine matches it. Löb's theorem does the heavy lifting. It closes the loop.

  **Marcus:** Löb's theorem works in Peano Arithmetic, not in a Python interpreter running on a server with a memory limit and a timeout clock. (He points to the wall.) Three minutes. Do you really believe the opposing agent has enough compute time to verify the fixed-point proof of our specific implementation before it has to output its move?

  **Elena:** They submitted their hash an hour ago. They've been running proof searches since then. They know we're rational. They know we know they're rational. If we submit *DefectBot*, we guarantee a mutual defection payoff. If we submit *FairBot*, we open the channel for the cooperative equilibrium. It's a dominant strategy in the space of *programs*, even if it's not in the space of *actions*.

  **Marcus:** It's a dominant strategy only if the space of programs is restricted to those that can prove things about each other instantly. What if they submit *FairBot-Prime*? It's functionally identical but uses a different variable naming convention. Our proof searcher might timeout trying to map their variables to ours. Then *FairBot* defaults to defection.

  **Elena:** Then we both lose. But that's a risk of *their* incompetence, not ours. We have to play the strategy that rewards competence. If we defect, we punish the very possibility of program equilibrium. You spent twenty years studying the evolution of cooperation, Marcus. You know that without a mechanism to assort cooperators, defection wins. This *is* the mechanism. Source code is the ultimate green beard.

  **Marcus:** (Laughs softly) A green beard that requires a compiler to read it. In biology, the signal is cheap, but the correlation is statistical. Here, you're asking me to bet the project on a logical necessity that dissolves if the interpreter throws a `StackOverflow` error. I'm not worried about their competence. I'm worried about the idealization. This isn't a Platonic realm. It's a server in Virginia.

  **Elena:** So what? We retreat to Causal Decision Theory? We treat the other player as a physical cause disconnected from our choice? That's empirically false in this setup. My choice of program *is* the cause of their prediction. My code is literally sitting on their hard drive right now. If I change a line, their output changes. The causal link is stronger than in any biological interaction you ever studied.

  **Marcus:** The link is there, yes. But is it robust? In evolution, a strategy survives if it works against a population of mutants. If I submit *FairBot*, I am vulnerable to a agent that simulates me, sees I cooperate, and then defects. *FairBot* only works against other *FairBots* or agents that can prove they cooperate with *FairBot*.

  **Elena:** *FairBot* defects against Defectors. It simulates them, sees they defect, and defects back. It's not a sucker.

  **Marcus:** It simulates them *if it has time*. If the simulation is computationally expensive, it hits the timeout. Timeout means default move. What's our default?

  **Elena:** Defect. Obviously.

  **Marcus:** So we are submitting a program that says, "I will cooperate if I can prove you cooperate, otherwise I defect." They are submitting something similar. We are both gambling that our proof systems are compatible enough to find the fixed point before the clock hits zero. If the proof search is too deep, we both default to defect. We get the punishment payoff.

  **Elena:** And if we submit *DefectBot* outright, we get the punishment payoff *guaranteed*. We lose the upside. The expected utility of *FairBot* is higher, provided there is a non-zero probability they are also playing for program equilibrium. Given they agreed to this protocol, that probability is near one.

  **Marcus:** Is it? Or did they agree to the protocol because they think they can exploit the proof-search latency? Think about the biology again. Organisms don't read genes; they read phenotypes. And phenotypes can be faked. A viper looks like a vine. In this game, the "phenotype" is the source code, yes, but the "expression" is the runtime behavior. Can we be certain their runtime environment matches ours?

  **Elena:** The rules stipulate a common interpreter.

  **Marcus:** Rules stipulate a lot of things. I'm talking about trust. You say this solves trust. I say it just moves the trust problem from the *agent* to the *infrastructure*. I have to trust that their compiler doesn't optimize away the cooperation check. I have to trust that their random seed doesn't interfere with the proof search. I have to trust that "source code" means the exact binary we're seeing.

  **Elena:** You're demanding certainty in a probabilistic universe. That's not rationality; that's paralysis. We are designing agents, Marcus. We aren't the agents. We can choose to be the kind of agents that make cooperation possible. If we retreat to safety now, we validate the idea that trust is impossible. We become the defectors we claim to oppose.

  **Marcus:** And if we upload this, and the proof search fails by a millisecond, and we both defect, we look like fools who believed in magic spells. I'm not afraid of being a defector. I'm afraid of being naive. There is a difference between a Nash equilibrium in a mathematical model and a stable outcome in a negotiation.

  **Elena:** (Turns to face him) Look at me. In your career, did you ever see cooperation evolve without some form of reciprocity or recognition?

  **Marcus:** Never without cost. Kin selection costs genes. Reciprocal altruism costs time and memory for reputation tracking. This... this claims to get cooperation for free. Just by looking. It feels like a perpetual motion machine.

  **Elena:** It's not free. The cost is the computational burden of the proof. We pay in CPU cycles. They pay in CPU cycles. It's an energy tax on trust. But it's paid. The equilibrium holds.

  **Marcus:** (Glances at the clock. 01:45.) It holds *in the limit*. As compute goes to infinity. We have ninety seconds.

  **Elena:** Then we optimize the code. Remove the comments. Minify the variables. Make the proof as short as possible.

  **Marcus:** That's hacking the symptom, not curing the disease. You want to submit *FairBot*. I want to submit a "ClippedCooperator"—cooperate only if the proof is found within ten seconds, otherwise defect. It's safer.

  **Elena:** If you clip the time, you break the Löbian fixed point. They might need twelve seconds to verify us. If we timeout at ten, they see we defect on them, so they defect. You've just turned a potential cooperation into a guaranteed failure because you were impatient.

  **Marcus:** And if I don't clip it, and the server lags, we get the same result. I'm trying to manage the risk of the medium. You're ignoring the medium entirely.

  **Elena:** Because the medium is supposed to be transparent! That's the point of the game! If we start second-guessing the interpreter, we aren't playing Program Equilibrium anymore. We're playing "Guess the Hardware."

  **Marcus:** We are *always* playing "Guess the Hardware." Even in biology. Is that signal honest? Is the environment stable? You want to treat this logic as if it descends from heaven, untouched by the physics of the machine running it.

  **Elena:** And you want to treat logic as if it's just another physical force, subject to friction. It's not. If the proof exists, it exists. Whether the server finds it is a practical hurdle, not a logical one. We must signal that we stand on the logic.

  **Marcus:** (Sighs, rubbing his temples.) If we do this, and it fails, the grant committee will say we prioritized philosophical elegance over project security.

  **Elena:** If we do this, and it succeeds, we demonstrate a new protocol for high-stakes coordination without enforcement. That's worth more than the grant.

  **Marcus:** (Looks at the screen. The cursor blinks in the input field.) I still think it's naive. I think we are the first organisms to try to read each other's DNA before mating, and we're going to find out that DNA is written in disappearing ink.

  **Elena:** Then let's be the ones who held the pen steady.

  **Marcus:** (Pauses. He looks at the countdown. 00:30.) I won't stop you. But I'm not signing off on the upload log as "Rational Choice." I'm signing it as "Calculated Risk."

  **Elena:** In this game, Marcus, they're the same thing.

  **Marcus:** Only if the math survives the contact with the machine.

  *(Marcus steps back from the keyboard. Elena's finger rests on the enter key. The countdown hits 00:10. She does not look at him. She presses Enter. The screen flashes: SUBMISSION RECEIVED. WAITING FOR OPPONENT.)*

  **Elena:** Done.

  **Marcus:** (Watching the status light) Now we wait to see if they believe in the math as much as we do. Or if they just believe in the clock.

  **Elena:** If they defect, we defect next time.

  **Marcus:** There might not be a next time. That's the tragedy of the one-shot.

  **Elena:** Then we made it count.

  *(They stand in silence as the status bar loads. It stalls at 90%. Neither moves. The screen does not change before the dialogue ends.)*
