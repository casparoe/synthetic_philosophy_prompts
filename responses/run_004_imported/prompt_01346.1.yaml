answer: |-
  The silence between courses was heavier than the silverware. Willem swirled the wine in his glass, watching the legs run down the side.

  "It hung for ten years, Willem," Nora said. Her voice was steady, but her knuckles were white around her fork. "Ten years people stood in front of it. They cried. They felt something. By every metric that matters to a viewer, it *was* a Van Der Hout."

  "It wasn't," Willem said. He didn't look up. "Because art isn't just the light hitting the retina. If it were, we'd value high-resolution forgeries the same as originals. We don't."

  "That's because of the market. The scarcity."

  "No. It's because the history of production is part of the work." Willem finally met her eyes. "When you look at a Van Der Hout, you aren't just seeing paint. You're seeing a man in 1645 solving a problem about light with the tools he had. You're witnessing an achievement. You didn't witness an achievement, Nora. You performed a trick."

  "That's the Goodman argument," Nora shot back. "That the aesthetic identity is bound up with the lineage. But it's circular. If I solve the problem *now*, with the same result, why is the solution lesser? Alfred Lessing got this right. The aesthetic value tracks the perceivable properties. If you can't tell the difference, there *is* no difference aesthetically. The fraud is ethical. The money is legal. But the art? The art is identical."

  "Is it?" Willem leaned forward. "Let's test that. You buy a first edition paperback. You buy a reprint. The text is the same. You buy a vinyl record, a second pressing. The music is the same. We don't call the second pressing a 'fake.' We don't feel cheated. But if you paint a canvas that looks exactly like a Vermeer, we call it a forgery. Why?"

  "Because books and records are meant to be reproduced," Nora said. "Painting claims uniqueness."

  "Exactly. Because the uniqueness is the achievement. When you forged that canvas, you didn't engage with the same risks Van Der Hout did. You had hindsight. You had chemistry. You had the safety net of knowing what worked. You skipped the struggle. And the struggle is the art."

  "So if I forge something perfectly, and nobody ever knows—"

  "Then the viewers are living in a delusion," Willem interrupted. "They think they're connecting with a history that isn't there. They're appreciating a narrative that's false."

  "But if the narrative is false and the experience is real, why does the falsity matter?" Nora pressed. "Why do people feel physically sick when they find out? If Lessing is right, they should just say, 'Oh, wrong name,' and keep enjoying the light. But they don't. They feel violated. Why?"

  Willem set his glass down. The clink was sharp. "Because appreciation is cognitive. It's not just sensation. When you find out it's a fake, you realize you weren't admiring mastery; you were admiring deception. The object hasn't changed, but your relationship to it has. And that relationship is part of the aesthetic experience."

  "That's convenient for you," Nora said, her voice dropping. "It protects your institution. It protects the curator. If the history matters more than the object, then you're the gatekeeper of the history. I just made the object."

  "I protected the truth, Nora."

  "You protected the signature."

  "I protected the conversation," Willem said. "Art is a conversation across time. You interrupted it. You inserted yourself into a dialogue you weren't part of and pretended you were there."

  "I *am* there," Nora said. "The painting is here. The emotion is here. You're just angry because I proved your expertise is irrelevant. If a fake can do the same job as the real thing, then the 'real thing' isn't magic. It's just chemistry. And you hate that."

  Willem picked up his fork again. He didn't eat. "I hate that you asked me to lie. That was the art I cared about. The trust."

  "The trust is separate from the canvas."

  "No," Willem said softly. "It's the only thing that isn't."

  They sat in the silence again. The food was getting cold. Neither of them moved to clear the plates.
