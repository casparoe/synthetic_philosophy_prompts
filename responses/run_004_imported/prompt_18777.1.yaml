  **TO:** Allocations Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Round 4 Allocations & Population Ethics Framework

  ### Executive Summary

  This memo proposes a resolution to the current impasse regarding our potential partnership with the Family Planning (FP) provider versus renewing our Bednet Distribution partner. 

  Given the lack of consensus on population ethics, I recommend we **adopt a Person-Affecting Welfare Framework** for this allocation cycle. Under this rule, benefits accruing to non-existent persons (the uncreated child) are weighted at **0**, while benefits to existing persons (mothers, siblings, community) are weighted at **1.0**. 

  Based on this weighting, I recommend an **80/20 split**: 80% of capital to the Bednet partner (highest certainty on existing-life welfare) and 20% to the FP partner (strategic diversification and high maternal welfare returns). We will revisit the underlying ethical framework in **12 months**.

  ### 1. The Decision Rule: Person-Affecting Welfare

  For this round, we will score interventions based solely on their impact on *existing* sentient beings. 

  *   **Bednets:** Count fully (life saved = benefit to existing person).
  *   **Family Planning:** Count maternal health, autonomy, and economic benefits fully. Count resource-dilution benefits for *existing* siblings fully. **Do not count** the welfare of the uncreated child (neither as a loss of potential happiness nor a gain from averted suffering).

  **Rationale:** 
  Our fund operates with a mandate to "do good," not to optimize the size and composition of the future population. The Total View (scoring averted births as welfare losses unless net-negative) implicitly commits us to a form of population maximization that conflicts with our members' intuitions and risks the "Repugnant Conclusion" (where we are obligated to create vast numbers of barely-happy lives rather than improve existing ones). The Person-Affecting view provides a bounded, stable moral accounting system that aligns with standard global health metrics and avoids claiming moral authority over non-existent entities.

  ### 2. Allocation Recommendation: 80% Bednets / 20% FP

  While the FP program's cost-per-outcome was comparable under previous scoring, applying the Person-Affecting rule strictly reduces its calculated impact (by removing the "averted child" variable). However, I recommend a 20% allocation to the FP partner for two reasons:

  1.  **Maternal Welfare is Undercounted:** Standard DALY-based models often undercapture the welfare value of reproductive autonomy and maternal health. The 20% allocation acts as a "value adjustment" for these hard-to-quantify Person-Affecting benefits.
  2.  **Portfolio Diversification:** As a small fund, we benefit from testing high-upside interventions. Even if the moral accounting is uncertain, the empirical data on FP's downstream economic effects is strong.

  The 80% majority to Bednets reflects our fiduciary duty to deploy capital where the moral accounting is uncontested (saving existing lives) while we resolve the philosophical framework.

  ### 3. Steelmanning the Rejected View (Total Utilitarianism)

  In adopting the Person-Affecting view for this cycle, we are explicitly setting aside the **Total View**. It is critical we acknowledge why the Total View proponents on this committee are right to be concerned.

  The strongest argument for the Total View is **consistency regarding suffering**. If we agree it is good to prevent a child from being born into a life of excruciating, unremitting pain (e.g., Tay-Sachs), we are already making a judgment about the welfare of a non-existent person. To say that preventing a net-negative life is good, but preventing a net-positive life is neutral (or bad), relies on an asymmetry that some philosophers argue is arbitrary. 

  By ignoring the welfare of the uncreated, we risk blind spots. If the FP program operates in a context where expected child welfare is demonstrably net-negative (extreme mortality risk + severe deprivation), the Total View correctly identifies that *averting that birth* is a moral good in itself, independent of the mother's welfare. Our Person-Affecting rule ignores this specific benefit. We are accepting this blind spot for the sake of operational consensus, not because it is philosophically definitive.

  ### 4. Timeline for Revisit

  This framework is a provisional tool for decision-making, not a permanent doctrinal stance. 

