prompt: |-
  In a philosophy seminar on social norms this term, we spent several weeks on David Lewis's account of convention, and a disagreement I overheard between two friends last week seems like a good test case for it. One friend was complaining about the tip-prompt screens now appearing at self-checkout kiosks and coffee-shop registers: tipping there, he argued, is a purely manufactured expectation -- there's no server, no personalized effort, nothing resembling the service tips were originally meant to reward -- so declining to tip in these settings isn't a moral failing but simply the correct response. The other disagreed: once enough customers tip in a given setting, she said, workers and employers start planning around that income, so declining stops being a neutral choice and starts imposing a real cost on people who now depend on it, meaning the practice becomes something one ought to go along with, whatever its arbitrary origin. He replied that this proves too much: by that logic, any expectation a company successfully manufactures and gets enough customers to comply with becomes binding on everyone else, turning successful manipulation into genuine obligation. She conceded there should be some difference between a norm that genuinely serves everyone who follows it and one a company simply imposes top-down, but admitted she couldn't say exactly where that line falls. Neither of them could settle it, and neither could I. Could you go through their exchange move by move, saying who has the better of it at each step, and then note anything important that both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy seminar on social norms, specifically focusing on David Lewis's account of convention.
      *   **Scenario:** A disagreement between two friends about tipping at self-checkout kiosks/coffee shops (digital tip prompts).
      *   **Task:**
          1.  Analyze the exchange move-by-move.
          2.  Evaluate who has the better of the argument at each step (based on Lewisian theory and general normative ethics).
          3.  Identify what *both* are missing (crucial philosophical blind spots).
      *   **Tone:** Academic but accessible, fitting a philosophy seminar context.

  2.  **Deconstruct the Friends' Arguments:**
      *   **Friend A (The Skeptic):** Tipping here is manufactured. No service/effort. Declining isn't a moral failing; it's the correct response.
      *   **Friend B (The Conventionalist/Consequentialist):** Once enough people tip, expectations form (workers/employers depend on it). Declining imposes costs. One ought to go along with it, regardless of origin.
      *   **Friend A's Rebuttal:** This proves too much. Successful manipulation $\rightarrow$ obligation?
      *   **Friend B's Concession:** There must be a difference between serving everyone vs. top-down imposition, but can't define the line.

  3.  **Apply David Lewis's Theory of Convention:**
      *   *Key Concepts:* Regularity in behavior, common knowledge, conditional preferences (I prefer to do X if others do X), arbitrary alternatives (could have done Y instead), coordination problem.
      *   *Relevance:* Lewis focuses on *coordination conventions* (driving on the right, language). Tipping is slightly different (it's more of a social norm/moral norm hybrid), but Lewis's framework on how arbitrary practices gain normative force is central.
      *   *Lewis's Criteria:*
          1.  Regularity.
          2.  Common knowledge of the regularity.
          3.  Conditional preference (I want to conform if others do).
          4.  Alternative regularity was possible.
      *   *Application to Tipping:* Is it a coordination problem? Not exactly. It's more of a contribution problem or a norm of reciprocity. Lewis might say it's a convention *if* the preference to tip depends on others tipping. But Friend B argues the dependence is on *economic reliance*, not just coordination.

  4.  **Step-by-Step Analysis (Move by Move):**

      *   *Move 1 (A's Opening):* "Manufactured expectation, no service."
          *   *Analysis:* Strong on the *origin* story (etymology of tips = To Insure Promptness, though historically debated). Weak on the *current* normative status. Lewis would say origin matters less than current equilibrium.
          *   *Verdict:* A is right about the *arbitrariness*, but wrong that arbitrariness negates obligation *if* it's a stable convention.

      *   *Move 2 (B's Response):* "Reliance/Expectation creates obligation."
          *   *Analysis:* This shifts from Lewisian convention to Scanlonian contractualism or rule utilitarianism. If people rely on it, breaking it harms them.
          *   *Verdict:* B has the stronger normative point here. Conventions gain force through reliance.

      *   *Move 3 (A's Rebuttal):* "Manipulation becomes obligation."
          *   *Analysis:* This is the "Is-Ought" problem or the "Legitimacy" problem. Just because a norm *exists* doesn't mean it's *just*. Lewis describes conventions; he doesn't necessarily morally endorse all of them.
          *   *Verdict:* A scores a major point. B's logic risks legitimizing exploitative norms.

      *   *Move 4 (B's Concession):* "Need a line between serving everyone vs. top-down."
          *   *Analysis:* B admits the gap. This is the crux of the philosophical problem.
          *   *Verdict:* Draw, but B admits weakness.

  5.  **Identify What Both Are Missing (The "Seminar" Value-Add):**
      *   *Lewis Specifics:* Lewis defines convention as a solution to a *coordination problem*. Tipping at a kiosk isn't really a coordination problem (my tipping doesn't help you tip). It's a *public goods* or *compliance* problem. So, strictly speaking, Lewis might say this *isn't* a convention in his technical sense.
      *   *Normative Force:* Lewis is descriptive (how conventions work), not necessarily prescriptive (why we *should* follow them). The friends are arguing prescriptively. They need a bridge (e.g., fairness, promise-keeping, reliance).
      *   *Power Dynamics:* Both ignore the employer's role. The "convention" is often a subsidy for low wages. The moral burden is shifted from employer to customer.
      *   *Common Knowledge:* Lewis emphasizes *common knowledge*. Do customers *know* others are tipping? Do they know workers rely on it? The digital prompt creates this common knowledge artificially.
      *   *Arbitrariness:* Lewis says conventions must be arbitrary (could have been otherwise). A agrees it's arbitrary. B agrees origin doesn't matter. But is it *still* arbitrary if wages are set based on it?

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the Lewis framework. Set the stage.
      *   *Move-by-Move:*
          *   Move 1 (A: Origin): A is right on history, wrong on normativity.
          *   Move 2 (B: Reliance): B is stronger here (Lewisian equilibrium + reliance).
          *   Move 3 (A: Manipulation): A wins this round (The "Legitimacy Gap").
          *   Move 4 (B: Concession): Stalemate.
      *   *What's Missing:*
          1.  **Lewis's Technical Definition:** Is this actually a Lewisian convention? (Coordination vs. Compliance).
          2.  **The Source of Normativity:** Lewis explains *how* conventions persist, not *why* they bind morally. Need Rawls/Scanlon/Utilitarianism.
          3.  **The Third Party (Employers):** The convention masks a wage dispute.
          4.  **Common Knowledge:** The screen *creates* the common knowledge required for Lewisian convention, which is manipulative.
      *   *Conclusion:* Summarize the philosophical lesson.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Lewis provides moral obligations. Lewis provides an account of *convention*. The friends are arguing about *moral obligation* derived from convention. I need to distinguish between "It is a convention" (Lewis) and "You ought to follow it" (Ethics).
      *   *Nuance:* Friend B sounds more like a Rule Utilitarian or a follower of Margaret Gilbert (plural subjects) than pure Lewis. I should point that out.
      *   *Lewis's "Arbitrariness":* Lewis insists a convention must have an alternative. If wages depend on tips, is it still arbitrary? If the alternative (no tipping) crashes the system, it's not arbitrary anymore. This is a key Lewisian critique of B.

  8.  **Final Polish:** Ensure the tone is appropriate for a philosophy seminar participant (rigorous, precise, referencing the text implicitly or explicitly). (Check: Did I address the prompt's request for "who has the better of it"?) Yes.

  9.  **Final Output Structure:**
      *   Intro: Contextualize within Lewis.
      *   Round-by-Round Analysis.
      *   The "Missing" Elements (Lewisian & Ethical).
      *   Concluding thought.

  *(Self-Correction Note)*: Wait, one specific Lewis point: Lewis conventions solve *recurrent coordination problems*. Tipping isn't strictly coordination (I don't need to match your tip to succeed). It's more of a norm of reciprocity. I must highlight that this might fall *outside* Lewis's strict definition, which is a major philosophical insight for the seminar.

  Okay, ready to write.
answer: |-
  This is an excellent test case for a seminar on David Lewis. It cuts right to the heart of the distinction between a *descriptive* account of how conventions arise and a *normative* account of why we are obligated to follow them. Lewis's *Convention: A Philosophical Study* (1969) is primarily descriptive—he explains how arbitrary regularities become self-perpetuating equilibria—but your friends are arguing about moral obligation.

  Here is an analysis of their exchange move-by-move, evaluated through a Lewisian lens (and where Lewis runs out of room), followed by the crucial elements both are missing.

  ### Part 1: Move-by-Move Analysis

  **Move 1: The Skeptic's Opening (Origin Story)**
  *   **Argument:** Tipping at kiosks is "manufactured." There is no service/effort. Therefore, declining is not a moral failing.
  *   **Lewisian Evaluation:** **Point to the Skeptic.**
      Lewis insists that for something to be a convention, it must be *arbitrary*. There must be at least one other possible regularity that could have solved the problem instead. The Skeptic is correctly identifying that this specific regularity (tipping at a kiosk) lacks the historical "coordination problem" that usually birthed tipping (rewarding prompt service).
      However, the Skeptic makes a category error. For Lewis, the *origin* of a convention matters less than its current status as an equilibrium. Just because a norm is "manufactured" doesn't mean it isn't a convention. But the Skeptic is right that without the original service justification, the *moral* force is weak. Lewis describes conventions; he doesn't automatically grant them moral weight.

  **Move 2: The Conventionalist's Response (Reliance & Expectations)**
  *   **Argument:** Once enough people comply, expectations form. Workers/employers plan around it. Declining imposes a cost. Therefore, one ought to comply.
  *   **Lewisian Evaluation:** **Point to the Conventionalist.**
      This is the strongest Lewisian move. Lewis defines convention partly through "conditional preferences": I prefer to conform *if* others conform. The Conventionalist expands this to include the *beneficiaries* of the convention (the workers). If a regularity is established, common knowledge exists, and reliance is formed, breaking the regularity causes coordination failure (or in this case, economic harm).
      In Lewisian terms, the practice has achieved "equilibrium." To disrupt it is to introduce instability. The Conventionalist correctly identifies that the *current* utility of the norm (income stability) may outweigh its *arbitrary origin*.

  **Move 3: The Skeptic's Rebuttal (The Manipulation Objection)**
  *   **Argument:** This proves too much. If successful manufacturing creates obligation, then manipulation creates morality.
  *   **Lewisian Evaluation:** **Point to the Skeptic.**
      This is the fatal flaw in the Conventionalist's Lewisian application. Lewis's account is susceptible to the "Is-Ought" problem. Just because a regularity *is* a convention (descriptive) does not mean it *ought* to be followed (normative).
      Lewis explicitly notes that conventions can be bad (e.g., a convention of driving on the left might be worse than the right, or a convention of bribery). The Skeptic correctly identifies that "successful imposition" is not a sufficient condition for "moral obligation." If a company manufactures a norm to shift labor costs onto customers, the fact that it *becomes* a convention doesn't automatically make it *just*. The Conventionalist has conflated *social pressure* with *moral duty*.

  **Move 4: The Conventionalist's Concession (The Line Problem)**
  *   **Argument:** Admits there must be a difference between a norm that serves everyone vs. top-down imposition, but cannot define it.
  *   **Lewisian Evaluation:** **Draw.**
      This is where the Lewisian framework reaches its limit. Lewis explains how we *coordinate*, not how we *adjudicate fairness*. The Conventionalist senses that a "good" convention (mutual benefit) differs from a "bad" one (exploitation), but Lewis's machinery doesn't easily distinguish them. Both are equilibria. The Conventionalist is right to pause, as this requires moving beyond Lewis into political philosophy or ethics.

  ---

  ### Part 2: What Both Are Missing

  Since this is for a seminar, the most valuable contribution you can make is to point out where the Lewisian framework itself might be the wrong tool for the job, and what normative theories need to be brought in to settle the dispute.

  **1. Is this actually a Lewisian Convention?**
  Both friends assume tipping at a kiosk is a convention in Lewis's technical sense. It likely is not.
  *   **Coordination vs. Compliance:** Lewisian conventions solve *coordination problems* (e.g., which side of the road to drive on). My conforming helps you conform. We both win if we match.
  *   **The Kiosk Problem:** Tipping at a kiosk is not a coordination problem. My tipping does not make it easier for you to tip. It is a *compliance* problem or a *public goods* problem. It is more akin to a norm of reciprocity or fairness.
  *   **Why it matters:** If it's not a coordination convention, Lewis's criteria for "arbitrariness" and "equilibrium" apply differently. The Conventionalist cannot rely on the stability of the equilibrium to generate obligation because the equilibrium isn't solving a mutual coordination issue; it's solving a wage subsidy issue.

  **2. The Source of Normative Force (The "Ought" Gap)**
  Lewis provides a descriptive account of how conventions persist, not a prescriptive account of why they bind us morally.
  *   **The Missing Theory:** To settle the argument, you need **Scanlonian Contractualism** or **Rawlsian Fairness**.
      *   *Scanlon:* Could the principle "customers must subsidize wages via kiosks" be reasonably rejected by workers? By customers?
      *   *Rawls:* Would this norm be chosen behind a veil of ignorance (not knowing if you are the worker, the customer, or the owner)?
  *   **The Verdict:** The Skeptic is right that the *origin* matters if the origin is exploitative. The Conventionalist is right that *reliance* matters. But without a theory of fairness, they are talking past each other. The obligation doesn't come from the *convention*; it comes from the *fairness of the reliance*.

  **3. The Role of "Common Knowledge"**
  Lewis places huge weight on **common knowledge** (everyone knows, everyone knows that everyone knows, etc.).
  *   **The Missing Insight:** The digital screen *manufactures* common knowledge artificially. In traditional tipping, the norm is culturally embedded. At a kiosk, the prompt *creates* the common knowledge in the moment to induce guilt.
  *   **Why it matters:** A Lewisian convention usually evolves organically to solve a problem. Here, the "common knowledge" is a design feature intended to bypass rational deliberation. This supports the Skeptic's "manipulation" argument. The norm isn't emerging from the group's need to coordinate; it is being imposed by a designer to extract value.

  **4. The "Arbitrariness" Criterion**
  Lewis insists a convention must be arbitrary (we could have done otherwise).
  *   **The Missing Insight:** The Conventionalist argues that workers now *depend* on the income. If workers depend on it, is it still arbitrary?
  *   **Why it matters:** If the alternative (no tipping) results in workers starving or businesses closing, the regularity is no longer arbitrary in the Lewisian sense. It has become structurally necessary. If it is necessary, it is no longer a mere convention; it is a structural feature of the wage system. This shifts the moral burden from the *customer* (who is following a convention) to the *employer* (who set the structure). Both friends are fighting over the customer's duty while ignoring the employer's structural coercion.

  ### Summary for the Seminar

  If I were to synthesize this for your group:

  1.  **On Lewisian Grounds:** The **Skeptic** wins on the definition (this lacks the coordination element of a true Lewisian convention), but the **Conventionalist** wins on the sociological reality (reliance creates expectations).
  2.  **On Normative Grounds:** Both lose. Lewis cannot tell us if a convention is *just*.
  3.  **The Synthesis:** The obligation to tip at a kiosk does not arise because it is a *convention* (Lewis), but because breaking a reliance expectation causes harm (Utilitarianism) *unless* the expectation was founded on deception or coercion (Contractualism).
  4.  **The Blind Spot:** Both friends treat the tip as a transaction between customer and worker. Philosophically, the kiosk tip is a tripartite relationship involving the **employer**, who is using the convention to externalize labor costs. The "norm" is a smokescreen for a wage policy.

  The Conventionalist is right that we have duties to those who rely on us. The Skeptic is right that we do not have duties to those who manipulate us into creating that reliance. The seminar's job is to find the line between *reliance* and *manipulation*—and that line is likely found not in Lewis, but in theories of consent and power.
