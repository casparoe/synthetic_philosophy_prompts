answer: |-
  **Setting:** *A quiet corner of a university library, late evening. The table is scattered with printouts of Harsanyi (1955), Diamond (1967), and Broome's annotations. Nadia and Simon have coffee; the cups are empty.*

  **Nadia:** Let's reconstruct the impasse. You're claiming that Harsanyi's aggregation theorem forces us into a version of utilitarianism that is morally blind. Specifically, you think it cannot account for the value of a fair procedure, like a coin flip, independent of the expected utilities it generates.

  **Simon:** Not just "cannot account for." I think it actively *forbids* us from valuing the procedure if that valuation conflicts with the ex ante Pareto principle. Harsanyi tells us that if individual preferences satisfy vNM axioms, and social preferences satisfy vNM plus Pareto, then social welfare must be a linear combination of individual expected utilities. $W = \sum a_i E[U_i]$. If that's true, then a fair coin flip between two claimants is only as good as its expected utility sum.

  **Nadia:** And in the symmetric case—two claimants, one good—the expected utility sum of a fair flip is identical to giving the good to Person 1 deterministically, assuming risk neutrality. $0.5(1) + 0.5(0)$ equals $1(1) + 0(0)$. So the theorem says society should be indifferent. You find that repugnant.

  **Simon:** I find it incoherent. We prefer the flip. Not because the participants feel warmer about it, but because it treats them as equals. The *ex post* outcome of the flip is still unequal—one gets the good, one doesn't—but the *process* respected their equal claim. Harsanyi's framework washes that out. It reduces fairness to a preference parameter.

  **Nadia:** Okay, here is where you need to be precise. When you say "we prefer the flip," who is "we"? If the two claimants themselves value the fairness of the procedure, that value enters their utility functions. If $U_1$ includes a term for "being treated fairly," then the expected utility of the flip rises above the deterministic assignment. Harsanyi accommodates that perfectly. The weights $a_i$ sum the utilities, the fairness preference boosts $E[U]$, and the social choice function selects the flip.

  **Simon:** That's the standard move, Nadia, and it's insufficient. It reduces a deontological constraint to a psychological taste. Suppose the claimants are stoics. Suppose they don't *care* about the procedure; they only care about the good. They are indifferent between a fair flip and a rigged flip, provided their expected chances are the same. On your view, if they don't care, society shouldn't care.

  **Nadia:** If they don't care, and no one else is affected, why should society care? The Pareto principle says social preference should track individual preference. If everyone is indifferent between Option A and Option B, social indifference is the only rational response. To prefer the flip when the agents themselves do not is paternalism. You're imposing a value of "fairness" that the subjects of the decision do not hold.

  **Simon:** It's not paternalism; it's objective right. There are constraints on how we treat people that aren't exhausted by how they feel about being treated. Think of the "consent" argument you usually deploy. You say, "Wouldn't they agree to the fair flip ex ante?"

  **Nadia:** Precisely. Behind a veil of ignorance, not knowing if they are Person 1 or Person 2, rational agents would choose the fair flip. It maximizes their expected utility. So the ex ante agreement supports the flip.

  **Simon:** But that only works because the ex ante agreement *happens* to align with the ex post fairness in this specific case. Let's modify the example. Suppose we have a medical resource. Claimant A will live 40 years with it. Claimant B will live 2 years with it. A fair coin flip gives them equal *procedural* chance. But ex ante, both might prefer a utilitarian calculation that gives it to A, because B might reason, "I'd rather have a 50% chance at 2 years than a 0% chance, but if I could bind society to save the most life-years, I might agree to that."
  Actually, let's stick to the Diamond case. Your reliance on ex ante agreement is the problem. You argue that because the agents *would* consent to the flip ex ante, the flip is justified. But if I reject the ex ante Pareto principle, I'm saying that ex ante consent isn't the final moral arbiter.

  **Nadia:** Then what is? If you discard ex ante Pareto, you're saying society can prefer Option X over Option Y even if *every single individual* prefers Y to X. That's a terrifying position. It severs the link between social welfare and individual welfare. It makes "society" a mystical entity with its own preferences that override the people composing it.

  **Simon:** It severs the link between social welfare and individual *expectations*. I'm arguing for an ex post view. Social welfare should be the expected value of a function of *actual* utilities in each state. $W = E[\sum v(U_i)]$. If $v$ is concave, we care about equality in the realized state.
  In the coin flip case:
  State 1 (Heads): A gets 1, B gets 0.
  State 2 (Tails): A gets 0, B gets 1.
  A deterministic assignment to A is:
  State 1: A gets 1, B gets 0. (Probability 1).
  If we evaluate ex post, the flip creates two states where inequality exists, but the *risk* was shared. The deterministic case creates one state where inequality is fixed.
  My point is this: You claim Harsanyi is a theorem. It is. But it relies on the Independence Axiom applied to *social* preferences. I'm willing to drop Social Independence.

  **Nadia:** You're willing to drop the axiom that ensures consistency in social choice under risk. Fine. But you still haven't answered the consent objection. If you impose the fair flip in a case where the agents prefer a deterministic outcome ex ante—perhaps because they are risk-averse about the *process* itself, or they trust a specific authority more than chance—you are overriding their rational agency.
  You say fairness is objective. But whose fairness? If I am Person 1, and I know I am Person 1, and I prefer to just take the good, and Person 2 agrees to a lottery because it's their only chance... wait, that's not symmetric.
  Let's take the hard case. Suppose Person 1 and Person 2 both believe that a coin flip is superstitious nonsense. They prefer a "first-come, first-served" rule. It yields the same expected utilities as the flip (50/50 chance of arriving first). But they prefer the rule. You want to force the coin flip because it looks fairer to *you*, the observer. That is the tyranny of the theorist.

  **Simon:** I'm not talking about superstition. I'm talking about rights. If two people have an equal claim to a good, they have a right to an equal chance. That right isn't a preference they hold; it's a status they occupy.
  Here is the counter to your consent argument: Ex ante agreement is hypothetical. In the real world, we are making decisions for people who are already distinct. When I stand before Person 1 and Person 2, I cannot say to the loser, "Well, you agreed to this possibility behind a veil of ignorance." The loser says, "I am here, I lost, and the process was rigged."
  If I use a utilitarian calculus that ignores the procedure, I might justify a rigged lottery that yields the same expected utilities. Say, I use a random number generator that Person 1 knows is biased, but Person 2 doesn't. Ex ante expected utilities might look equal to the observer. But the procedure is corrupt. Harsanyi's theorem, focusing on the aggregation of expected utilities, cannot distinguish the corrupt lottery from the fair one if the $E[U_i]$ are identical.

  **Nadia:** If the $E[U_i]$ are identical, then by definition the individuals are indifferent, assuming they know the probabilities. If Person 2 doesn't know it's biased, their subjective expected utility is different from the objective one.
  You're smuggling in information asymmetry. Let's assume full information. If both know the probabilities, and both know the utilities, and $E[U]$ is the same, they are indifferent. If they are indifferent, Harsanyi says society is indifferent.
  If you say society should *not* be indifferent, you must say society knows something about their good that they don't.
  This brings us to the tractability limit. You believe there is a "moral truth" about fairness that exists independently of the agents' rational preferences. I believe moral truth in social choice *is* the structure of rational agreement among agents.

  **Simon:** I believe that rational agreement is constrained by moral truth, not constitutive of it.
  But let's press your "rational agreement" point. You say Harsanyi corners us. If we accept vNM and Pareto, we get Utilitarianism. I accept vNM for individuals. I reject Pareto for *social* preferences over lotteries.
  Specifically, I reject *ex ante* Pareto. I accept *ex post* Pareto.
  If in every state of the world, everyone prefers Outcome A to Outcome B, then society should prefer A.
  But in the lottery case:
  State 1: A wins. Person 1 prefers A, Person 2 prefers B (the flip).
  State 2: B wins. Person 2 prefers B, Person 1 prefers A (the flip).
  There is no ex post Pareto dominance. So my view doesn't violate ex post Pareto. It only violates ex ante Pareto.
  And my answer to your "tyranny" charge is this: Ex ante Pareto allows a tyranny of the majority over the minority in expectation. If 99 people gain slightly from a policy that kills 1 person for sure, the ex ante expected utility might be positive for everyone (if they think they won't be the one). Ex ante Pareto approves it. Ex post fairness screams no.

  **Nadia:** That's the "Death in Damascus" style objection, but it conflates risk with certainty. In the Harsanyi framework, if the 1 person knows they will die, their utility plummets. The sum won't necessarily be positive.
  But let's grant the tension. You reject ex ante Pareto. That means you are willing to tell a group of people: "I know you all prefer Lottery X to Lottery Y, given your own interests and values. But I prefer Y."
  You have to own that. You are prioritizing a pattern—procedural fairness—over the unanimous will of the affected parties.
  My worry isn't just that it's paternalistic. It's that it makes social choice impossible. If we can't aggregate preferences because we're constantly checking them against an external metric of "fair process," we lose the ability to make trade-offs. What if a slightly unfair procedure saves a million lives?
  If your fairness constraint is lexical, you're a deontologist who can't do policy. If it's weighted, you're back to aggregating, and we're back to Harsanyi.

  **Simon:** And if your aggregation is lexical, you're a utilitarian who can't do justice.
  You ask me to own overriding unanimous will. I do. But I question the "unanimity."
  When Person 1 and Person 2 agree to a utilitarian trade-off ex ante, they are agreeing as *preference-satisfiers*. They are not agreeing as *rights-bearers*.
  The disagreement stops here, Nadia. You think the "rational agent" model captures the whole moral person. I think the "rational agent" is a construct that leaves out the moral status that exists prior to the calculation.
  You say Harsanyi's theorem is a mathematical truth given the axioms. I say the axioms are the question. Specifically, the assumption that social preferences over lotteries should satisfy the same independence conditions as individual preferences over gambles.
  Why should society be risk-neutral just because individuals are? Or why should society be risk-averse in the way individuals are? Society isn't a person. It shouldn't have a vNM utility function at all.

  **Nadia:** If society doesn't have a vNM function, it's susceptible to money pumps. It's irrational.
  I'll grant you this: Harsanyi assumes the "Identity Thesis"—that social rationality is just individual rationality scaled up. If you deny that, the theorem falls.
  But if you deny that, you lose the democratic link. Why should your external metric of fairness bind me? Because it's "True"? That's where I stop. I can't argue against your moral realism. I can only say that in a pluralistic society, we have nothing but our preferences to aggregate. If your preference is for "objective fairness," put it in the utility function. If you won't, you're opting out of the social contract.

  **Simon:** And I say the social contract is void if it doesn't recognize the objective fairness.
  We're at the boundary. You see the ex ante Pareto principle as the definition of respecting persons—taking their preferences as sovereign. I see it as a failure to respect persons—treating their claims as mere inputs to a sum, rather than constraints on action.
  The coin flip isn't valuable because it maximizes utility. It's valuable because it's the only way to act when reasons run out and claims are equal. Harsanyi assumes reasons never run out; there's always a utility difference. I'm saying sometimes there isn't, and the procedure *is* the reason.

  **Nadia:** Then we agree on the math, and disagree on the metaphysics. You think fairness is a property of the world. I think it's a property of the agreement.

  **Simon:** No. I think fairness is a property of the relation. You think it's a property of the outcome.

  **Nadia:** *(Closes notebook)* I think we're going to need more coffee. And perhaps a new set of axioms.

  **Simon:** *(Smiles)* Or a new restaurant. One that doesn't close when the argument gets hard.

  **Nadia:** Deal. But I'm paying. Utilitarian aggregation of the bill.

  **Simon:** Only if we flip for the tip.

  **Nadia:** Agreed.
