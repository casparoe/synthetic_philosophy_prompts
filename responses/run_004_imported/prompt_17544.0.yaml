          *   **Nadia:** Defends ex ante Pareto, accepts Harsanyi's utilitarian aggregation. Sharp, rigorous.
          *   **Simon:** Defends ex post/procedural fairness, willing to depart from ex ante Pareto if necessary. Sharp, rigorous.
      *   **Constraints:**
          *   Must be a dialogue.
          *   Must respond to actual arguments (no talking past each other).
          *   Nadia must address the "fair coin flip" intuition (Diamond's case).
          *   Simon must address the "consent/ex ante agreement" objection.
