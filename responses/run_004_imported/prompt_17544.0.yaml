  Simon's point: We strictly prefer the coin flip.
  Nadia's point: Why? If the individuals are risk-neutral, they are indifferent ex ante between "50% chance I get it" and "I get it for sure" (if they don't know who they are)? No, behind a veil of ignorance.
  Let's stick to the ex ante Pareto argument. If both prefer the coin flip to "Give to 1" (because Person 2 prefers it, Person 1 is indifferent), then Pareto says choose the coin flip.
  The real conflict arises when we compare the coin flip to a *different* lottery with the same expected utilities but "unfair" probabilities? No, that's not Diamond.
