      *(Final check on Move 5)*: Elena says "locally." Marcus says "circular." The literature (e.g., Caie 2013 "Rational Probabilistic Incoherence") suggests Marcus is closer to the truth regarding *general* accuracy arguments, but Joyce (2009) tries to patch it. I will call it a Standoff that leans toward Marcus technically, but Elena philosophically. Actually, better to say Marcus identifies a real tension, but Elena describes the standard fix. I'll call it a Standoff with a caveat.

