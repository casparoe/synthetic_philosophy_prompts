answer: |-
  This is a remarkably crisp reconstruction of a debate that mirrors the actual literature quite closely (echoing exchanges between Joyce, Caie, Pettigrew, and Levinstein). Your students have identified the fault lines in the accuracy program with impressive precision. Here is my assessment of the five moves, followed by a verdict on the exchange and a suggestion for where the discussion ought to go next.

  ### Analysis of the Moves

  **(1) Elena's Opening: The Alethic Claim**
  *   **Verdict:** **Elena** has the better of it, provisionally.
  *   **Reasoning:** Elena is correctly characterizing the *intent* and *surface structure* of Joyce's argument (1998, 2009). The accuracy argument is explicitly designed to avoid the pragmatic instrumentalism of the Dutch Book argument. It posits a constitutive aim of belief (accuracy) rather than a pragmatic constraint (avoiding loss). While critics (like Marcus will argue) may claim pragmatic notions are smuggled in later, Elena is right that the argument *starts* from a purely alethic norm: "Accuracy is the sole epistemic good." Marcus has not yet earned the right to call this misleading; he must demonstrate the smuggling first.

  **(2) Marcus's Objection: The Genealogy of Propriety**
  *   **Verdict:** **Marcus** has the better of it.
  *   **Reasoning:** Marcus identifies the weakest link in the armor of the accuracy program. The Accuracy-Dominance Theorem (that non-probabilistic credences are accuracy-dominated) holds *only* if the inaccuracy measure is a strictly proper scoring rule (SPSR). As Marcus notes, the definition of an SPSR is historically and conceptually tied to incentive compatibility in decision theory (eliciting honest reports from self-interested agents). If the justification for restricting our attention to SPSRs relies on pragmatic elicitation contexts, then the "purely epistemic" argument rests on a pragmatic foundation. Elena claims it's purely alethic; Marcus shows the definition of "alethic measure" relies on a pragmatic property.

  **(3) Elena's Reply: The Immodesty Defense**
  *   **Verdict:** **Elena** regains the advantage.
  *   **Reasoning:** This is the standard Joycean/Pettigrewian counter-move. Elena correctly notes that genealogy is not justification. Even if propriety was discovered in betting contexts, it can be justified epistemically *now*. The "Immodesty" norm (a credence function should not expect a rival to be more accurate than itself) is a coherence constraint on the doxastic state, not a pragmatic constraint on the agent's wallet. If a credence function expects another to be more accurate, it is "self-undermining." This is a genuine epistemic defect (instability), independent of action. Marcus's pragmatic worry is blunted if propriety can be grounded in doxastic coherence.

  **(4) Marcus's Counter: The Circularity Charge**
  *   **Verdict:** **Marcus** lands a significant hit (Standoff leaning Marcus).
  *   **Reasoning:** This is the technical crux of the debate (see Caie 2013). To determine if a credence function is "immodest," one must calculate its *expected* inaccuracy. The standard definition of expectation is linear ($\sum c_i v_i$). However, linearity and additivity are properties of probability functions. If a non-probabilistic credence function (e.g., one that violates additivity) uses a linear expectation to judge itself, it is being judged by a standard that presupposes the very norms (probabilism) it is being accused of violating. Marcus is right: using probabilistic expectation to prove probabilism looks viciously circular. Elena needs to explain why a non-probabilist should care about linear expectation.

  **(5) Elena's Last Word: The Locality Defense**
  *   **Verdict:** **Standoff** (but Elena clarifies the procedure).
  *   **Reasoning:** Elena is describing the "local" dominance argument correctly. We do not assume *the agent's* actual credences are probabilistic to run the test; we ask of *every* mathematically possible function $c$, "Does $c$ expect itself to be best?" It turns out only probabilistic $c$'s say "yes." However, Marcus's worry persists in a normative form: Why should a non-probabilistic agent accept the verdict of a test that uses linear expectation? Elena shows the math isn't circular (we aren't assuming the conclusion in the premises), but she hasn't fully answered the normative charge that the *metric* itself is biased toward probabilism.

  ### Overall Verdict on the Exchange

  **Does Marcus's circularity worry leave residue?**
  Yes, it does. Elena's move (5) successfully defends the *mathematical* consistency of the argument (it is not logically circular in the sense of $P \vdash P$), but it does not fully dissolve Marcus's *normative* circularity worry.

  The residue is this: The accuracy argument tells a non-probabilist, "You are irrational because you are accuracy-dominated." The non-probabilist can reply, "I am only dominated relative to *your* choice of inaccuracy measure and *your* definition of expectation. If I use a non-linear expectation operator appropriate for my non-additive beliefs, I am not dominated."

  Elena treats the linear expectation operator as a neutral tool for measuring "closeness to truth." Marcus correctly suspects that the linear expectation operator is not neutral; it is the mathematical footprint of probabilism itself. Therefore, the argument risks begging the question against the non-probabilist by imposing a probabilistic structure on the *evaluation* of the credences before proving the credences must be probabilistic. Marcus has not found a logical contradiction in Elena's account, but he has identified a dialectical stalemate: the argument convinces only those who already accept the normative authority of linear expectation.

  ### What They Are Overlooking

  To move this dispute forward, you should direct Elena and Marcus to the relationship between **Propriety, Linearity, and the Normativity of Expectation.**

  1.  **The Savage Representation:** Both students are treating Propriety and Probabilism as distinct concepts that need to be linked. They should look at Savage's (1971) representation theorem for proper scoring rules. Mathematically, a scoring rule is proper *if and only if* it is generated by a convex function, which essentially encodes the probability axioms. In a deep sense, **Propriety *is* Probabilism** expressed in the language of utility. The debate isn't whether propriety leads to probabilism (mathematically, it does); the debate is whether "minimizing expected inaccuracy" is the fundamental epistemic norm.
  2.  **The Normativity of Linearity:** The crucial overlooked element is the justification for **Linearity**. Why should epistemic value aggregate linearly?
      *   Elena assumes linearity is the only way to calculate "expected accuracy."
      *   Marcus senses this is the smuggling point but frames it as circularity.
      *   **The Way Forward:** The real philosophical work lies in justifying why a rational agent's epistemic utility function must be linear. If one can justify linearity on purely alethic grounds (e.g., via continuity or separability arguments regarding truth-values), then Marcus's worry dissolves. If linearity can only be justified pragmatically (e.g., via Dutch Books or money pumps), then Elena's claim that the argument is "purely alethic" fails.

  **Suggestion for the Seminar:**
  Ask them to read **Michael Caie's "Rational Probabilistic Incoherence" (2013)** alongside **Joyce's "Accuracy and Coherence" (2009)**. Then, ask them to consider **Leitgeb and Pettigrew's** work on how to define expectation for non-probabilists. The question to pose is: *"Can we define a notion of 'expected inaccuracy' for a non-probabilistic credence function that does not presuppose the probability axioms, and if so, does the dominance argument still go through?"*

  If the answer is "No," Marcus wins (the argument is question-begging). If the answer is "Yes, but the non-probabilist is still dominated," Elena wins. Currently, they are arguing past each other on whether the *definition* of expectation is a neutral tool or a loaded weapon. It is likely the latter.
