          *   *Cons:* Violates Mere Addition, can be complex.
          *   *Usability:* Moderate.
          *   *Status:* Respected, avoids RC without Sadistic Conclusion usually.
      *   **Person-Affecting Views (PAV):**
          *   *Narrow:* Only matters if better for someone who exists.
