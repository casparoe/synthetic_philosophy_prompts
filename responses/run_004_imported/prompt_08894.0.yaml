          *   *Cons:* Indecisiveness (action-guiding failure).
          *   *Usability:* Low (hard to make decisions when outcomes are incomparable).
          *   *Status:* Philosophically interesting, practically difficult.
      *   **Variable Value Theory (VVT):** Value of lives diminishes as population grows.
