      *   **Total Utilitarianism (TU):** Maximizes sum of welfare.
          *   *Pros:* Simple, satisfies Many Mere Addition, avoids Sadistic Conclusion.
          *   *Cons:* Implausible Repugnant Conclusion (RC).
          *   *Usability:* High (easy to calculate).
          *   *Status:* Often the default for longtermism but philosophically contested due to RC.
      *   **Average Utilitarianism (AU):** Maximizes average welfare.
          *   *Pros:* Avoids RC.
          *   *Cons:* Sadistic Conclusion (adding miserable lives can raise average if existing lives are worse), Mere Addition Paradox (adding happy lives can lower average).
          *   *Usability:* Moderate.
          *   *Status:* Generally considered less defensible than TU due to Sadistic Conclusion.
      *   **Critical-Level Utilitarianism (CLU):** Adds welfare only if above a critical level $c$.
          *   *Pros:* Avoids RC (if $c > 0$).
          *   *Cons:* Sadistic Conclusion (if $c$ is too high), Non-Elitism issues.
          *   *Usability:* Moderate (depends on setting $c$).
          *   *Status:* Strong contender, often seen as the best compromise.
      *   **Critical-Range Utilitarianism (CRU):** Welfare contributions are indeterminate within a range.
