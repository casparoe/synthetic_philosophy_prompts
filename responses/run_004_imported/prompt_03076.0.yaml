          *   Metaphysician view (Fine): Grounding is *metaphysical explanation*, not *scientific explanation*. It's about *in virtue of* relations, not *because of* (efficient cause) relations.
          *   Key distinction: Diachronic (causation) vs. Synchronic (grounding).
          *   Why the physicist might conflate them: In physics, explaining *why* a table is solid involves the causal history of its atoms *and* their current arrangement. But metaphysics asks: "What makes it the case *now* that the table exists?"
      *   **Issue 2: Priority Monism (Schaffer) vs. Priority Pluralism (Standard Physics).**
          *   Physicist view: Break things down to find the basics. Quarks are more real than tables.
          *   Schaffer's view: Quantum holism (entanglement) suggests the state of the whole determines the state of the parts. You can't define the parts independently of the whole. Therefore, the whole is fundamental.
