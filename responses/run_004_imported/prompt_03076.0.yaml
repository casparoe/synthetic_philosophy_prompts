      *   **User Persona:** Retired experimental particle physicist (35 years experience). Highly knowledgeable about physics, specifically reductionism, composition, and the standard model hierarchy (macro $\to$ molecules $\to$ atoms $\to$ nuclei $\to$ nucleons $\to$ quarks). Familiar with the goal of quantum gravity.
