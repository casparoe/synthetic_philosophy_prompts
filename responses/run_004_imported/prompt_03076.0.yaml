      *   **Conclusion:** Summarize. The physicist's view is "Priority Pluralism." Schaffer offers "Priority Monism." Both are consistent with the math, but differ on ontology. Metaphysics isn't done when physics is done because physics doesn't interpret its own ontological commitments uniquely.

