          *   *Marcus:* That's the "push back" point. God knows *exactly* what happens. He could have chosen a world where I don't. He didn't. So He willed it.
          *   *Danny:* Distinction between willing and permitting.
          *   *Marcus:* Semantic sleight of hand.

      *   **The Climax/Resolution:**
