answer: |-
  The bass from the reception band thumped through the floorboards, vibrating the ice in Danny's highball glass. He leaned against the mahogany bar, watching the bride cut the cake across the room.

  "You're smiling," Marcus said, sliding onto the stool next to him. He signaled the bartender for a bourbon. "Which means you're either happy for Sarah, or you think you've got a answer to the problem of evil tucked in your pocket."

  Danny chuckled, clinking his glass against Marcus's empty one. "Can't it be both? Grace is abundant, Marcus. Even at an open bar."

  "Grace is particular," Marcus corrected, taking the bourbon the bartender slid over. "And you're still drinking from the well of Molina. I thought the seminary would have cured you of that Jesuit halfway house."

  "And I thought the Presbytery would have cured you of thinking God is a cosmic puppeteer." Danny took a sip. "Middle knowledge isn't a halfway house. It's the only architecture that holds up the weight of genuine love without collapsing into chance."

  Marcus swirled his drink. "Genuine love requires libertarian freedom. I know the pitch. But let's get to the foundation, Danny. The Grounding Objection. We're in the second logical moment of God's knowledge. Before the decree. Before creation. No creatures exist. So, tell me: what makes the proposition *'If placed in circumstance C, Danny would freely choose X'* true?"

  Danny set his glass down. "The truthmaker is the possible person's essence. In the divine intellect, I exist as a possible being. My nature includes how I would respond to specific stimuli. God doesn't determine that response; He just knows the contours of the person He *could* create."

  "But the person *doesn't* exist," Marcus pressed, leaning in. "There is no ontological ground for that counterfactual. You're asking me to believe there are true propositions about nothing. That's not theology; that's Platonism. You've turned abstract entities into gods that constrain Yahweh. If those counterfactuals are true independent of God's will, then something exists outside of God's sovereignty that dictates what He can do."

  "It's not outside of God," Danny countered. "It's within His knowledge of His own power. He knows what He can create. If I am a free creature, my choice must originate in me, not in God. If God makes the counterfactual true by decree, then I'm not free. If He doesn't make it true, but knows it, then my freedom is preserved."

  Marcus shook his head. "You're preserving the word 'freedom' by evacuating the reality of sovereignty. Let's move to the third moment. The Decree. God surveys all these possible worlds—World A where you evangelize, World B where you apostatize. He chooses to actualize World B."

  "Because He has a morally sufficient reason," Danny said.

  "Sure," Marcus said. "But He *could* have actualized World A. He knew exactly what you would do in World B before He turned the key. He selected the world in which you apostatize when He could have selected the one where you don't. So, whose will is ultimately decisive regarding your apostasy?"

  Danny paused. This was the pivot. "God's will is decisive regarding the *circumstances*. My will is decisive regarding the *action* within the circumstances. God didn't make you sin, Marcus. He placed you in a situation where He knew you would."

  "Semantics," Marcus said sharply. "If I know my son will walk into a trap because I told him to go there, and I send him anyway because I want him trapped... I put him in the trap. God's knowledge isn't passive observation. By selecting the world based on the outcome, He endorses the outcome. You haven't saved libertarian freedom; you've just pushed the determinism back a step. Instead of God determining the act, He determines the actor's environment with precise knowledge of the inevitable result. The causal chain still terminates in God's choice of world."

  Danny turned to face him fully. "But the *mode* of causation matters. In your view, God moves the will. In Molina's, God moves the world to the will. There is a real difference between causing a choice and causing the conditions for a choice. If the choice is truly counterfactually dependent on me, then the responsibility is mine. God takes the risk of creation."

  "God doesn't take risks," Marcus said, his voice dropping, losing its edge for a second. "If He takes risks, He's not God. He's a gambler. You're trying to protect God from the stain of evil by limiting His knowledge or His power. But if those counterfactuals are true before creation, and God creates anyway, He is the author of sin just as much as if He decreed the sin directly. The grounding might be missing in your system, Danny, but the guilt is still there."

  Danny sighed, looking back at the dance floor. The newlyweds were spinning, oblivious. "Maybe. But if you're right, Marcus, then the wedding up there is a script. Not a covenant. Just actors reading lines written before the foundation of the world. I need to believe that when she said 'I do,' she could have said 'I don't.' Otherwise, it's not love. It's mechanics."

  Marcus took a long drink. "And I need to believe that when she said 'I do,' it was because God secured her heart so she wouldn't say 'I don't.' Otherwise, it's not grace. It's luck."

  They sat in silence for a moment, the bass drum kicking a steady rhythm between them.

  "So," Danny said, lifting his glass. "To the mystery."

  Marcus clinked his bourbon against it. "To the Sovereign. Even when He hides."

  "Even when He hides," Danny agreed.
