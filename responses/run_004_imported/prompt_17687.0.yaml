      *   **Marcus (Reformed):** Needs to sound like he values God's sovereignty and logical consistency. Likely dry, wry, perhaps a bit more cynical about human capability. Uses terms like "decree," "grounding," "truthmaker," "causal determinism."
      *   **Dynamic:** Old friends. There should be banter, shared history, and a sense that they've had this argument before.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the relationship. A toast or a drink order works well to break the ice before diving into the deep end.
          *   *Idea:* They are holding drinks. The wedding is in the background.
          *   *Action:* Clinking glasses. Acknowledging the irony of discussing predestination at a wedding (covenant/union imagery).

      *   **The Hook:** Marcus brings up the Molinist position first, perhaps mocking it gently as a "dodge."
