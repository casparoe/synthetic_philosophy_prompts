  Here is a simple numerical example illustrating the partition invariance problem, followed by an evaluation of the objection.

  ### The Example

  Let the utility function be linear, $u(x) = x$, and the risk function be convex (risk-averse), $r(p) = p^2$. We are comparing a **Safe Act** against a **Risky Act**.

  **1. Coarse-Grained Partition**
  *   **Safe Act ($S$):** \$50 with probability 1.
      *   Since the probability of getting at least \$50 is 1, the weight is $r(1) = 1$.
      *   $REU(S) = 1 \cdot 50 = \mathbf{50}$.
  *   **Risky Act ($R$):** 50% chance of \$100, 50% chance of \$0.
      *   Outcomes ranked: \$0, \$100.
      *   Weight on \$100: $r(0.5) - r(0) = 0.25 - 0 = 0.25$.
      *   Weight on \$0: $r(1) - r(0.5) = 1 - 0.25 = 0.75$.
      *   $REU(R) = 0.25(100) + 0.75(0) = \mathbf{25}$.
  *   **Verdict:** $S \succ R$ (Strictly prefer Safe).

  **2. Fine-Grained Partition**
  Now, we redescribe the **Safe Act** using the same state partition as the Risky Act (e.g., a coin flip), even though the payoff is identical in both states.
  *   **Safe Act ($S'$):** 50% chance of \$50 (Heads), 50% chance of \$50 (Tails).
  *   **The Problem:** If the agent (or the theory) treats "Heads-\$50" and "Tails-\$50" as distinct outcomes for the purpose of risk-weighting *without collapsing them first*, the calculation changes. The risk function applies to the probability of each *described* event.
      *   Weight on Heads-\$50: $r(0.5) = 0.25$.
      *   Weight on Tails-\$50: $r(0.5) = 0.25$.
      *   $REU(S') = 0.25(50) + 0.25(50) = \mathbf{25}$.
  *   **Risky Act ($R$):** Remains \$100 (0.5), \$0 (0.5). $REU(R) = \mathbf{25}$.
  *   **Verdict:** $S' \sim R$ (Indifferent).

  **The Flip:** By merely spelling out the "sure thing" into two finer-grained states, the REU value of the safe option drops from 50 to 25, flipping the recommendation from **Strict Preference** to **Indifference**.

  ### Is This Fatal?

  This is a serious objection (championed by critics like Thoma and Stefansson), but Buchak has a standard reply. She argues that **Reduction of Compound Lotteries** is a normative requirement of rationality: a rational agent *ought* to aggregate states that yield identical utilities before applying the risk function. If an agent's preferences flip based on this description, Buchak claims they are irrational (violating description invariance), not that the theory is broken. However, critics counter that this reply undermines the psychological motivation of REU; if agents are rational to be sensitive to risk structure (as in the Allais paradox), it is unclear why they are irrational to be sensitive to the partition structure that defines that risk. For quals purposes, it is best to frame this as a tension between **normative coherence** (Buchak's defense) and **descriptive adequacy** (the critic's charge).
