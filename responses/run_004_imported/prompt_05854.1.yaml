          *   Evidence comes from experience.
          *   Uniform experience = Proof (certainty).
          *   Variable experience = Probability (degrees of assurance).
          *   Miracles are violations of laws of nature.
          *   Laws of nature are established by uniform experience (Proof).
          *   Therefore, there is a "Proof" against miracles.
      *   *Part II:* The Testimony Problem.
          *   Testimony for a miracle constitutes a counter-claim.
