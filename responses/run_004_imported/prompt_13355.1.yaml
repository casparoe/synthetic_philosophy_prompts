      *   **Actionable Advice for the User:** How to talk to them? Don't use jargon. Use analogies (radio signal, engine capacity). Focus on the *uncertainty* rather than the *answer*.
      *   **Closing:** Validate the user's role. They aren't being a pedant; they are holding space for nuance in a situation that demands false certainty.

  6.  **Refining the Tone:**
