answer: |-
  This is a profound question that cuts to the heart of political philosophy: how do we maintain principled distinctions when the political language around them becomes corrupted?

  Michael Dummett is a fascinating figure to bring to this debate precisely because he refuses the usual binaries. He was not a cosmopolitan who thought borders were meaningless, nor was he a nationalist who thought they were sacred. He was a moral realist who believed that our obligations to other human beings were paramount, but who also respected the integrity of political communities.

  To answer your question, we have to look at how Dummett used logic and ethics together. He was a philosopher of language who spent his life hunting for hidden premises and ambiguities. When he carved out the "submersion" exception, he was doing what he did best: defining the *necessary conditions* for a restriction to be just, while simultaneously arguing that the *sufficient conditions* were almost never met.

  Here is how I believe Dummett would analyze the post-2015 landscape, and whether his distinction holds water.

  ### 1. Vindication or Alarm?

  If Dummett were alive today, I am confident he would be **alarmed**, not vindicated.

  You noted that he believed the "submersion" exception had "almost no real-world application" to Britain in 2001. This is the crucial key. For Dummett, the exception was a theoretical safety valve—a concession to the idea that a political community must have the right to continue existing as a going concern. It was not a policy recommendation.

  He would likely view the post-2015 rhetoric (Brexit, the "Great Replacement" theory, etc.) as a catastrophic failure of the very clarity he prized. Dummett spent the 1960s fighting the Commonwealth Immigrants Acts, which were explicitly framed as economic or social necessities but which he successfully argued were motivated by racial prejudice. He would see the modern usage of "submersion" not as a legitimate engagement with his exception, but as the exact same "bad faith" argument he fought fifty years ago, merely updated with demographic statistics instead of overt biological racism.

  Dummett was a devout Catholic and a humanitarian; he drew a sharp moral line between *economic migrants* (where states have more discretion) and *refugees* (where obligations are near-absolute). The 2015 crisis was primarily a refugee crisis. Dummett would likely argue that invoking "submersion" to turn away refugees is morally incoherent. A country is only "submerged" if it ceases to function or ceases to exist as a political entity. He would likely argue that Western European nations absorbing refugees—even in large numbers—does not threaten the *existence* of the state, only its *homogeneity*. And for Dummett, a right to homogeneity is very close to a right to racial exclusion.

  He would not see the rise of demographic anxiety as proof that his warning was needed; he would see it as proof that his warning was ignored. He would argue that politicians are using his "exception" to smuggle in the "rule" of exclusion that he spent his life fighting.

  ### 2. Does the Distinction Hold Up?

  This is the harder philosophical question. Can we actually separate a "legitimate worry about numbers" from a "racist worry about culture"?

  **The Theoretical Strength**
  Philosophically, Dummett's distinction is robust. It mirrors the difference between *capacity* and *character*.
  *   **Capacity:** "We physically cannot house, feed, or educate this many people without societal collapse." This is a logistical claim. It can be true or false.
  *   **Character:** "We cannot accept this many people because they will change who we are." This is an identity claim.

  Dummett's test demands that restrictions be based on the former, never the latter. In the abstract, this is a vital tool. It forces politicians to argue about infrastructure, housing, and public services rather than "national identity." If a government says, "We must limit immigration because our schools are full," Dummett would say: "Then build more schools. If you cannot build schools fast enough to accommodate human beings fleeing danger, *that* is the injustice, not the migration."

  **The Practical Fragility**
  However, in practice, Dummett was aware that this distinction is fragile because "capacity" is often a proxy for "character."
  When people say, "There are too many of them," they rarely mean the country is physically full. They mean the *cultural dominance* of the incumbent population is threatened. Dummett knew that "submersion" is a subjective feeling, not an objective metric.

  In 2001, the "stakes" felt lower because immigration was a slower burn. Today, the speed of demographic change in some areas is faster. Does this make Dummett's test obsolete? I don't think so, but it makes it harder to apply.
  *   **The Threshold Problem:** Dummett implies the threshold for "submersion" is existential. It's not about a shift in demographics; it's about the dissolution of the political community. Given that nations like the US, Canada, and Australia have "survived" massive demographic shifts without ceasing to be those nations, the threshold remains incredibly high.
  *   **The Bad Faith Problem:** The distinction only works if the interlocutor is acting in good faith. Dummett's entire career was based on the idea that philosophy should expose bad faith. If a politician uses "submersion" to rally voters against a specific ethnic group, Dummett's test identifies this as unjust, regardless of the numbers.

  ### 3. The Verdict on Dummett's Legacy

  I suspect Dummett would argue that his distinction was never meant to be a **policy tool** for the public, but a **moral constraint** on the state.

  He would likely say: "The state may only restrict if it is truly submerged. But since the state defines what 'submerged' means, it will always claim it is submerged to protect its own power or the prejudices of its majority. Therefore, the presumption must always be in favor of the migrant."

  In this light, the developments since 2001 vindicate his **pessimism**, not his **exception**. He suspected that any loophole for restriction would be widened until it swallowed the rule of openness. The fact that "submersion" is now a standard talking point for parties he would have considered morally suspect suggests he was right to be wary of the concept's political utility, even if he felt compelled to admit its theoretical validity.

  **To answer your final question:** Does his way of separating the worries hold up?
  *   **As a moral test:** Yes. It remains one of the few ways to challenge a restrictionist without denying the right of a community to self-preservation. It forces the argument onto concrete grounds (infrastructure, resources) rather than mystical grounds (blood, soil, identity).
  *   **As a political shield:** No. As you and your friends found, it is easily weaponized. Without Dummett's rigorous personal commitment to anti-racism, the "submersion" clause becomes a dog whistle.

  Dummett's tragedy, perhaps, is that he offered a nuanced philosophical distinction to a world that prefers blunt instruments. He gave a tiny concession to the restrictionists hoping it would satisfy them, and instead, they took it as a foundation. He would likely tell you today that the only way to make the distinction hold is to return to the grassroots activism he practiced: constantly challenging the motives behind the numbers, and insisting that the burden of proof for "submersion" lies impossibly high on the state.

  If you take one thing from his book for your debate with friends, it might be this: Dummett did not believe that a country belongs to the people currently living in it. He believed it belongs to the *principle* of justice that the state is supposed to uphold. If upholding that justice requires demographic change, then so be it. The "submersion" exception exists only for the moment when the state literally cannot function—and he died believing that moment had never come for Britain.
