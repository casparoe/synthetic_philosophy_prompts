          5.  Inductive Step: If one knows in $\alpha_i$, one feels cold in $\alpha_{i+1}$ (Margin for Error). If one feels cold in $\alpha_{i+1}$, one knows in $\alpha_{i+1}$ (Luminosity).
          6.  Conclusion: One knows/feels cold in $\alpha_n$.
          7.  Contradiction: By construction, in $\alpha_n$, one does *not* feel cold.
