      *   *Source:* Timothy Williamson, *Knowledge and Its Limits* (Chapter 4).
      *   *Core Concept:* Luminosity. A condition $C$ is luminous iff for every case $\alpha$, if $C$ obtains in $\alpha$, then one is in a position to know in $\alpha$ that $C$ obtains.
