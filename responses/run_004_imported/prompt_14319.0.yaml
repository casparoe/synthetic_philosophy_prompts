          2.  Construct a sorites-style series of cases $\alpha_0, \alpha_1, ..., \alpha_n$ from feeling cold to not feeling cold.
          3.  Reliability/Margin for Error Principle: If one knows one feels cold in $\alpha_i$, then one feels cold in $\alpha_{i+1}$ (because $\alpha_i$ and $\alpha_{i+1}$ are indiscriminable).
