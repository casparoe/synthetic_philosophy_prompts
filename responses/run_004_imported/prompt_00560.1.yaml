      *   *Descartes' Metaphysics:* Sharp dualism. Either you have a rational soul (mind) or you are an automaton (body/beast). There is no middle ground. Truth is about correspondence to reality (God guarantees clear and distinct ideas).
      *   *The Clash:* Dennett dissolves the "real" question into utility. Descartes demands the "real" answer to secure the foundation of knowledge and morality (animals don't suffer, humans are immortal).
