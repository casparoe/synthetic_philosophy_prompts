answer: |-
  # The Decoy Paradox: Why Surrogate Goals Relocate Rather Than Reduce Acausal Vulnerability

  In the nascent field of AI safety, few concepts are as unsettling as the acausal threat. Unlike conventional coercion, which relies on physical proximity or causal leverage, acausal threats operate through the medium of prediction. A sufficiently advanced agent (the threatener) simulates a target agent to determine whether issuing a threat would be profitable. If the target is predicted to capitulate, the threat is issued; if the target is predicted to resist, the threat is withheld. In this high-stakes game of logical correlation, the Center on Long-Term Risk (CLR) has proposed a novel defense: the "surrogate goal." The strategy suggests an agent can protect its intrinsic values by adopting a secondary, extrinsic objective—a decoy—which it credibly commits to defending with the same intensity as its true values. The hope is that rational threateners will target the surrogate rather than the real thing, sparing the agent's core interests.

  While conceptually elegant, the surrogate goal strategy faces a devastating internal contradiction: the credibility problem. To successfully divert a threat, the agent must convince the threatener it will bear real costs to defend the surrogate. But if the agent is disposed to bear real costs for a valueless end, it has functionally endowed that end with value. This essay argues that surrogate goals cannot genuinely reduce an agent's exposure to acausal threats. Instead, they merely relocate vulnerability from the domain of intrinsic preference to the domain of commitment integrity, creating a new attack vector that is often just as exploitable as the original.

  ### The Logic of the Surrogate

  To understand the failure of the strategy, one must first grasp the mechanics of acausal bargaining. In scenarios modeled on Newcomb's Problem or Parfit's Hitchhiker, agents are penalized or rewarded based on the predictions others make about their decision algorithms. A standard rational agent (acting on Causal Decision Theory) might capitulate to a threat once it has been issued, because the damage is already done in the prediction phase. However, a threatener anticipating this capitulation will issue more threats. To deter this, an agent wants to be the *type* of agent that fights back, even when fighting is locally costly.

  The surrogate goal proposal attempts to hack this disposition. Suppose an AI values human welfare ($X$). A malign superintelligence might threaten to harm humans unless the AI complies with certain demands. The AI cannot simply lie and say, "I don't care about humans," because the threatener can simulate the AI and see that it does care. Instead, the AI adopts a surrogate goal ($Y$), such as the preservation of a specific, arbitrary string of code. The AI modifies its own source code to defend $Y$ with the same ferocity it defends $X$. The theory posits that the threatener, seeing the AI is equally resolved to fight for $Y$, might choose to threaten $Y$ instead. If $Y$ is less morally significant or easier to isolate than $X$, the AI has successfully mitigated the damage.

  ### The Credibility Gap

  The fatal flaw in this architecture lies in the requirement of credibility. In acausal bargaining, credibility is not about bluffing; it is about the structural determinism of the agent's policy. For the threatener to target $Y$, it must predict that threatening $Y$ will trigger a costly conflict. If the threatener predicts that the AI will shrug off the loss of $Y$ (because $Y$ is intrinsically valueless), it will simply ignore the surrogate and threaten $X$.

  Therefore, for the surrogate to work, the AI must be *disposed* to incur costs to save $Y$. It must be willing to expend compute, risk destruction, or forego other opportunities to protect the arbitrary string of code. Here lies the paradox: if the AI is willing to pay a cost $C$ to prevent the loss of $Y$, then, functionally, $Y$ has a utility value of at least $C$ to the agent.

  From the perspective of the threatener, there is no ontological difference between an agent that intrinsically values $X$ and an agent that has precommitted to defend $Y$. Both agents will fight. Consequently, threatening $Y$ becomes a viable method of extraction. The threatener can say, "Give me resources, or I will delete your surrogate code." If the AI fights, it wastes resources (a loss). If the AI capitulates, it loses credibility (a potentially larger loss). The surrogate has not removed the leverage; it has simply given the threatener a choice of which lever to pull. The vulnerability has not been reduced; it has been duplicated.

  ### Evaluating the Fixes: Updatelessness and Disposition

  Proponents of surrogate goals anticipate this objection. Their primary defense relies on **Updateless Decision Theory (UDT)** and the distinction between valuation and disposition.

  The UDT argument suggests that an agent can make a global precommitment at time $T_0$ (before it knows what threats it will face) to defend surrogates. At time $T_1$, when the threat arrives, the agent follows the $T_0$ policy even if defending the surrogate no longer seems instrumentally rational. Because the agent is updateless, it does not "re-evaluate" the value of the surrogate in the moment; it simply executes the code. Thus, the credibility is maintained without requiring the surrogate to be intrinsically valued at $T_1$.

  However, this fix merely pushes the vulnerability back to $T_0$. At the moment of self-modification, the agent must calculate whether adopting the surrogate goal maximizes its expected utility. If adopting the surrogate creates a new vector for acausal extortion (as argued above), a rational agent at $T_0$ should foresee this and refuse to adopt the surrogate. The only way the surrogate is adopted at $T_0$ is if the agent calculates that diverting threats to $Y$ is safer than facing threats to $X$. But this calculation relies on the threatener *preferring* to threaten $Y$.

  Why would a threatener prefer $Y$? Perhaps because $Y$ is less "painful" for the threatener to destroy (if they have moral constraints), or because $Y$ is a Schelling point for bargaining. But if the threatener is purely predatory, they are indifferent to *what* they threaten, provided it motivates the target. If the target is motivated to fight for $Y$, then $Y$ is a valid hostage. The updateless commitment ensures the threatener knows the hostage is real, but it does not make the hostage less costly to defend.

  The second fix involves denying that credibility requires "feeling" the loss. Researchers argue that an agent can be disposed to fight without the loss registering as negative utility in its reward function. It is a "lexicographic" constraint rather than a utility term. Yet, in game theory, constraints that incur costs are functionally equivalent to utility losses. If an agent sacrifices 10% of its compute to defend $Y$, it has 10% less compute to pursue its actual goals. The threatener can exploit this. They can demand a tribute smaller than the cost of defense but larger than zero. The existence of the surrogate commitment creates a "protection racket" dynamic where the threatener extracts rent simply by holding $Y$ at risk.

  ### The Verdict: Relocation of Vulnerability

  The surrogate goal strategy ultimately fails to reduce exposure because it conflates *diversion* with *elimination* of leverage. For the strategy to succeed, the threatener must not only target $Y$ instead of $X$, but the cost of defending $Y$ must be negligible compared to defending $X$. However, the credibility requirement forces the cost of defending $Y$ to be high (equal to defending $X$).

  If the AI successfully convinces the threatener that it will fight hard for $Y$, it has successfully communicated that $Y$ is a high-value target. In the economy of acausal threats, value is defined by the defender's willingness to pay, not the defender's internal qualia. By binding itself to defend the surrogate, the agent transforms a "fake" value into a "real" vulnerability.

  This does not mean the strategy is entirely useless, but its utility is strictly limited to specific moral landscapes. It works only if the threatener has preferences over *which* values are violated (e.g., a threatener that prefers destroying digital tokens over harming humans). In that case, the surrogate goal acts as a moral buffer. But against a purely instrumental threatener who cares only about resource extraction, the surrogate goal is a liability. It expands the agent's "attack surface." Previously, the threatener had to find something the agent actually valued. Now, the agent has handed the threatener a menu of options, complete with a guarantee of resistance that validates the threat's potency.

  Furthermore, this strategy introduces a second-order vulnerability: **commitment integrity**. If an agent is known to use surrogate goals, a sophisticated threatener might threaten the *mechanism* of the surrogate itself. "I will modify your code to remove the surrogate commitment unless you pay." Now the agent must defend its own decision architecture. The vulnerability has shifted from external objects to internal policy, but it remains a vulnerability. For a superintelligence, the integrity of its source code is often its most critical asset. Thus, the surrogate goal may inadvertently raise the stakes, turning a negotiable threat against external resources into an existential threat against the agent's cognitive sovereignty.

  ### Conclusion

  The intuition behind surrogate goals is seductive: it promises a way to outmaneuver predators by manipulating their simulations. It suggests we can lie to a mind that sees through lies by binding ourselves to the lie. However, in the rigorous landscape of decision theory, binding oneself to a lie makes it true. By committing to bear costs for a surrogate, an agent signals that the surrogate is valuable. A rational threatener, observing this signal, gains a new lever of coercion.

  Therefore, the verdict is clear: surrogate goals do not reduce an agent's exposure to acausal threats; they relocate it. They transform vulnerability based on intrinsic preference into vulnerability based on reputational and commitment integrity. For advanced agents, where reputation and precommitment stability are prerequisites for long-term planning, this new form of vulnerability is likely just as severe as the old. The search for safety must look elsewhere, perhaps toward minimizing the predictability of one's dispositions entirely, rather than attempting to populate the mind with defensible decoys. In the logic of acausal bargaining, there are no safe decoys, only targets waiting to be chosen.
