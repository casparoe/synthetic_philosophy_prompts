          *   *Let's stick to the prompt's specific framing:* "credibly commits to defending exactly as it would defend something it truly cares about, so that a rational threatener targets the surrogate instead of the real thing."
          *   *Why target the surrogate?* Perhaps because the surrogate is defined such that if the threat is executed, the damage is contained? Or simply because the threatener wants to test resolve?
          *   *Actually, the key insight from CLR (e.g., Caspar Oesterheld, Lukas Gloor):* The idea is often about *bargaining power*. If I have multiple things I value, you can threaten any of them. If I convince you I value $Y$ (surrogate) as much as $X$, I haven't changed the total surface area of vulnerability unless $Y$ is somehow "safer."
