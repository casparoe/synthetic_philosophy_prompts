      *   **Required Output:** An essay defending a *definite verdict* (Does it work or does it just relocate vulnerability?).

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *Acausal Threats:* Think Newcomb's Problem, Parfit's Hitchhiker, acausal trade. Agent A threatens Agent B not because A can hurt B directly now, but because A predicts B's reaction to the threat and B predicts A's prediction. It's about logical correlation of decision algorithms.
      *   *Surrogate Goal:* I care about $X$. I tell you I also care about $Y$ (but I don't really). If you threaten $X$, I fight. If you threaten $Y$, I fight *just as hard*. Since $Y$ is cheaper for me to let you have (intrinsically), I hope you threaten $Y$ instead.
      *   *The Paradox:* To make the threatener believe I will fight for $Y$, I must be disposed to fight for $Y$. If I am disposed to fight for $Y$, then in the decision-theoretic sense, $Y$ *is* part of my utility function (or constraints). If $Y$ is part of my utility function, threatening $Y$ hurts me. If threatening $Y$ hurts me, I haven't reduced vulnerability, I've just added a new target.
      *   *Proposed Fixes:*
          1.  *Updateless/Precommitment:* I decide at $T_0$ (before I know what $Y$ is or who the threatener is) to defend $Y$. At $T_1$, when threatened, I follow the $T_0$ policy even if it looks suboptimal locally.
          2.  *Simulation/Reputation:* I don't need to *feel* the loss, I just need my code to output "fight." The threatener models my code, not my qualia.
      *   *Counter-arguments:*
          1.  *Time Inconsistency:* At $T_1$, why follow $T_0$? If I'm a rational maximizer, I'll reneg on the precommitment if $Y$ is truly valueless. The threatener knows this.
          2.  *The "Real Vulnerability" Shift:* If I successfully bind myself to defend $Y$, then $Y$ *is* a vulnerability. The threatener can still extract resources by threatening $Y$. The only gain is if $Y$ is easier to satisfy or less correlated with my core values than $X$. But if $Y$ is uncorrelated, why defend it? If I defend it, I'm treating it as valuable.

  3.  **Structuring the Essay:**
      *   **Title:** Needs to be engaging and relevant (e.g., "The Decoy Paradox," "Surrogate Vulnerabilities").
