answer: |-
  Harsanyi's Aggregation Theorem is frequently cited as the most rigorous decision-theoretic foundation for utilitarianism. It posits that if individuals and a social planner satisfy the von Neumann-Morgenstern (vNM) axioms of rationality, and if the planner's preferences satisfy the Pareto principle, then the planner's social welfare function must be a weighted sum of individual utilities. However, this reading is unwarranted. The theorem relies on a purely *ex ante* formulation of the Pareto principle, which structurally blinds the social planner to considerations of procedural fairness and the distribution of risk. This is not a minor technical oversight but a fundamental ethical deficit that severs the link between Harsanyi's mathematical result and utilitarian *ethics*.

  ### The Mechanism of Ex Ante Pareto

  To understand the flaw, one must distinguish between *ex ante* and *ex post* evaluations.
  *   **Ex Post:** Evaluates social states based on the actual utility outcomes in every possible state of the world.
  *   **Ex Ante:** Evaluates social states based on the *expected* utilities of individuals before uncertainty is resolved.

  Harsanyi's theorem derives the linear utilitarian form ($W = \sum a_i U_i$) by applying the Pareto principle to individual *preferences over lotteries*. This is an **Ex Ante Pareto** principle: if every individual prefers lottery $L$ to lottery $M$ based on their expected utility, society must prefer $L$ to $M$. This constraint forces the social welfare function to depend *only* on the vector of individual expected utilities. It mathematically excludes any independent social concern for how risk or chances are distributed among individuals, provided the expectations remain constant.

  ### The Indivisible Good Counter-Example

  The ethical hollowness of this derivation is best illustrated by the case of the indivisible good. Consider two equally deserving claimants, Person 1 and Person 2, and one unit of a good.
  *   **Option A (Fair Lottery):** A coin flip determines who gets the good. Each has a 50% chance.
  *   **Option B (Outright Award):** The planner arbitrarily gives the good to Person 1.

  Assume both individuals value the good at 1 utility unit and have linear utility over the probability of receiving it (risk neutrality regarding the good itself).
  *   In **Option A**, the expected utilities are $EU_1 = 0.5$ and $EU_2 = 0.5$. The sum is 1.
  *   In **Option B**, the expected utilities are $EU_1 = 1.0$ and $EU_2 = 0.0$. The sum is 1.

  Because Harsanyi's theorem dictates that social welfare is a linear function of individual expected utilities, the planner calculates $W(A) = a(0.5) + a(0.5) = a$ and $W(B) = a(1.0) + a(0.0) = a$. The planner is **indifferent** between the fair lottery and the arbitrary outright award.

  ### Why This Is a Genuine Ethical Problem

  This indifference is often dismissed as a technical feature of expected utility theory, but it represents a catastrophic failure for any theory claiming to ground *ethics*.

  **1. Violation of Equal Moral Status**
  Utilitarian ethics is traditionally grounded in the principle of equal consideration of interests. In the scenario above, both claimants have an equal moral claim to the good. Option A respects this equality by giving them equal *ex ante* chances (procedural fairness). Option B violates it by favoring one without justification. A moral planner *ought* to prefer Option A, or at least recognize a moral difference between the two. Harsanyi's planner cannot. By reducing moral value to the sum of expectations, the theorem validates a system where arbitrary discrimination is morally equivalent to fair procedure, provided the "aggregate expectation" is unchanged. This contradicts the core utilitarian intuition that every person counts for one and none for more than one.

  **2. The Ex Ante/Ex Post Gap**
  The theorem vindicates *Ex Ante Utilitarianism*, but many ethicists (such as Peter Diamond and Amartya Sen) argue that morality is fundamentally *Ex Post*. We care about what actually happens to people, not just their prospects. In Option B, Person 2 is definitively left out. In Option A, Person 2 has a genuine opportunity. The Ex Ante Pareto principle forbids the social planner from valuing that opportunity independently of the expected outcome. Because the theorem *requires* Ex Ante Pareto to derive the utilitarian form, it structurally prohibits the incorporation of ex post fairness concerns. You cannot simply "add" a fairness term to the welfare function without violating the vNM axioms or the Pareto principle that underpin the theorem. Thus, the indifference is not a bug that can be patched; it is a feature of the decision-theoretic framework itself.

  **3. Rationality vs. Morality**
  Harsanyi's theorem is often presented as showing that utilitarianism is the only *rational* approach to social choice. However, the indifference in the lottery case demonstrates that the theorem conflates *rational preference aggregation* with *moral justification*. It may be "rational" for a single agent to be indifferent between a gamble and a sure thing with the same expected value. But it is not "moral" for a social planner to be indifferent between fairness and favoritism. By grounding utilitarianism in a principle (Ex Ante Pareto) that ignores the moral significance of risk distribution, the theorem vindicates a calculus of efficiency, not a doctrine of justice.

  ### Conclusion

  Harsanyi's Aggregation Theorem proves that a planner who respects individual rationality and Ex Ante Pareto efficiency must act like an expected-utility maximizer. However, because the Ex Ante Pareto principle ignores the moral value of procedural fairness and the actual distribution of outcomes, the resulting "utilitarianism" is ethically impoverished. It cannot distinguish between a society that treats its members as equals through fair lotteries and one that arbitrarily privileges some over others. Therefore, the theorem does not vindicate utilitarian *ethics*; it merely vindicates a specific, morally blind method of aggregating preferences. The indifference to the fair lottery is not a technicality—it is proof that the theorem captures the logic of rational betting, not the demands of moral justice.
