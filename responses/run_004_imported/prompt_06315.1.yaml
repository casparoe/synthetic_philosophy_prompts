      *Refining the "Irrationality" point:* It is safer to say non-utilitarian views require rejecting the *applicability* of vNM axioms to social choice, rather than calling them irrational. Rationality is defined by the axioms. If you reject the axioms, you are outside the theorem's scope, not necessarily "irrational" in a broader sense.

