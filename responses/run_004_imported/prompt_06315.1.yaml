answer: |-
  Your economist colleague is correct, and if you present the theorem as entailing *equal* weighting without qualification, you will likely face significant pushback from the decision theorists in the audience. Your current framing conflates two distinct steps in Harsanyi's project: the **Aggregation Theorem** itself and the **Impartial Observer Argument** (or Veil of Ignorance argument) used to fix the weights.

  Here is a precise breakdown of the gap in your current framing, the technical assumptions required to bridge it, and how to adjust your talk to withstand scrutiny.

  ### 1. The Technical Gap: Weighted vs. Classical Utilitarianism

  **What the Aggregation Theorem Actually Says:**
  Harsanyi's Aggregation Theorem (1955) states that if:
  1.  Individual preferences satisfy the von Neumann–Morgenstern (vNM) axioms.
  2.  Social preferences satisfy the vNM axioms.
  3.  The **Pareto Indifference** condition holds (if everyone is indifferent between two lotteries, society is indifferent), and often **Strong Pareto** (if everyone weakly prefers $A$ to $B$ and someone strictly prefers $A$, society strictly prefers $A$).

  Then, the social utility function $W$ is a **positive affine transformation** of a linear combination of individual utility functions $U_i$:
  $$W = \sum_{i=1}^n a_i U_i + b$$
  where $a_i \geq 0$.

  **The Problem:**
  The theorem does **not** determine the values of the coefficients $a_i$. It establishes the *form* of utilitarianism (linearity), but not the *weights*.
  *   **Classical Utilitarianism** requires $a_i = a_j$ for all $i, j$.
  *   **Harsanyi's Theorem** only guarantees **Weighted Utilitarianism**.

  As your economist noted, vNM utility functions are unique only up to positive affine transformations ($U'_i = \alpha U_i + \beta$). If you double the scale of person A's utility function, their weight in the sum effectively doubles unless you adjust $a_i$ downward. Therefore, the statement "summing everyone's utility with equal weight" is mathematically meaningless unless you have already fixed the interpersonal scaling of the utility functions. The theorem itself provides no mechanism for this scaling.

  ### 2. The Missing Assumption: Interpersonal Comparability

  To move from "some affine combination" to "the equally weighted sum," you must introduce an assumption regarding **Interpersonal Comparability of Utility (ICU)**.

  Harsanyi addressed this in the same 1955 paper ("Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility") via the **Impartial Observer Argument**. He argues that a moral agent behind a veil of ignorance, assuming an **equiprobability assumption** (an equal chance of being any person in society), would maximize expected utility.
  *   If the probability of being person $i$ is $1/n$ for all $i$, the expected utility is $\frac{1}{n} \sum U_i$.
  *   This yields equal weights.

  **However**, this equiprobability assumption is a substantive ethical premise, not a logical consequence of the vNM axioms or the Pareto principle. It is a claim about how to normalize utility scales across persons (often grounded in "extended preferences"—imagining oneself in another's situation with their tastes).

  **For your talk:** You must distinguish between the *Aggregation Theorem* (which secures linearity) and the *Impartial Observer Argument* (which secures equal weights). If you claim the theorem alone mandates equal weighting, you are smuggling in the equiprobability assumption.

  ### 3. The Harsanyi-Sen Debate Context

  Your colleague mentioned the "Harsanyi-Sen debate." This is crucial context for a graduate workshop.
  *   **Harsanyi's Stance:** Defended welfarism and interpersonal comparability based on extended preferences. He believed objective comparisons were possible and that utilitarianism was the only rational outcome of impartiality.
  *   **Sen's Critique:** Amartya Sen argued that the informational basis of the theorem is too thin. Without robust interpersonal comparability, the weights $a_i$ are arbitrary. Furthermore, Sen argued that restricting social choice to welfarism (ignoring rights, freedoms, or capabilities) is ethically unacceptable. Sen's work on **Social Choice Theory** demonstrates that if you relax the informational constraints (allowing for non-utility information) or the axioms (e.g., dropping IIA), you can justify prioritarian or Rawlsian views without "irrationality."

  ### 4. Addressing the "Irrationality" Claim

  You wrote: *"Prioritarian or Rawlsian departures... are not merely contestable value judgments but outright violations of rationality."*

  This is too strong and will be the easiest target for your audience.
  *   **Rawlsians:** Do not necessarily violate rationality; they reject the applicability of the **vNM Independence Axiom** to the social choice problem behind the veil of ignorance. Rawls explicitly argues that the maximin rule is rational under conditions of extreme uncertainty where probabilities are unknown or meaningless (contrary to Harsanyi's equiprobability assumption).
  *   **Prioritarians:** Often argue that the *individual* utility $U_i$ should be transformed by a concave function $f$ before aggregation ($\sum f(U_i)$). This can be modeled within Harsanyi's framework if we define the "individual utility" as $f(U_i)$, but this raises questions about paternalism. Alternatively, they may reject the **Pareto Principle** in cases where it conflicts with equity.

  **Better Framing:** The theorem shows that non-utilitarian views require rejecting at least one of the following:
  1.  vNM rationality for the social planner (e.g., Rawls).
  2.  The Pareto Principle (in certain equity-focused views).
  3.  Welfarism (the idea that only utility information matters, per Sen).

  It does not prove them "irrational" simpliciter; it proves they are incompatible with *that specific set of axioms*.

  ### 5. Recommendations for Your Talk

  To survive the decision theorists in the room, I suggest the following adjustments to your framing:

  1.  **Precision on the Result:** State that the theorem vindicates **Weighted Utilitarianism** (linear aggregation), not necessarily Classical Utilitarianism (equal weights).
  2.  **Explicitly State the Normalization Assumption:** Acknowledge that to get equal weights, one must assume **Cardinal Unit Comparability** across individuals. Mention that Harsanyi supplies this via the Impartial Observer/Equiprobability argument, which is a distinct ethical premise.
  3.  **Soften the "Irrationality" Claim:** Frame the theorem as a **representation result**. It shows that *if* one accepts vNM rationality and Pareto, one is committed to a utilitarian *form*. Non-utilitarians are thus committed to rejecting one of the axioms (usually Independence or Pareto) rather than being "irrational" in a general sense.
  4.  **Acknowledge the Sen Critique:** Briefly note that the theorem's force depends on the informational basis. If interpersonal comparisons are not objectively grounded (as Sen argues), the weights remain indeterminate, leaving room for democratic or egalitarian determination of weights.

  **Sample Phrasing for the Slide:**
  > "Harsanyi's Aggregation Theorem demonstrates that Social Welfare functions satisfying vNM axioms and Pareto must be linear combinations of individual utilities ($W = \sum a_i U_i$).
  >
  > **Caveat:** The theorem fixes the *functional form* (utilitarianism) but not the *weights* ($a_i$). Equal weighting requires an additional ethical assumption regarding interpersonal comparability (e.g., Harsanyi's Equiprobability Assumption). Consequently, the theorem rules out non-linear aggregation (e.g., Rawlsian Maximin) as incompatible with vNM social rationality, but leaves the distribution of weights open to ethical debate."

  This framing respects the technical constraints while preserving the philosophical weight of your argument. It shows you understand the machinery well enough to know where the ethical work is actually being done.
