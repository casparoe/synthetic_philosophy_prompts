      *   **Argument 2 (Extension/Reference):** If you ask for a "horse," any color works. If you ask for a "white horse," only white works. Therefore, the extension of "white horse" $\neq$ the extension of "horse".
      *   **The Logical Trap (Western View):** Equivocation on "is" (identity vs. predication vs. inclusion). $A \subset B$ does not mean $A = B$, but in natural language "is" often implies inclusion. Gongsun Long seems to be arguing $A \neq B$ (identity) to prove $A \notin B$ (membership) or vice versa.
      *   **The Linguistic Twist (Mass Noun Hypothesis):** If Chinese nouns are mass terms (like "water"), then "horse" refers to "horse-stuff." "White horse" refers to "white-horse-stuff." Is "white-horse-stuff" identical to "horse-stuff"? No, because it excludes black-horse-stuff. This shifts the logic from set theory to mereology (parts/wholes).

