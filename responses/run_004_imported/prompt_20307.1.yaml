answer: |-
  **The Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophers, Elena and Marcus, are staring at a ceramic mug on the table between them.*

  **Elena:** You're looking at the mug like it's about to bite you.

  **Marcus:** I'm trying to decide if there are two things sitting here or one. If I drop it, does one thing break, or two?

  **Elena:** Don't start with the Lumpl and Goliath again. We spent last semester on that.

  **Marcus:** I'm serious. I've been reading through the constitution literature again. Baker, Wiggins, the whole lot. And I keep coming back to the same intuition: it is ontologically profligate to say there are two distinct objects occupying the same space, made of the same atoms, with the same causal powers, just because we describe them with different sortals.

  **Elena:** It's not profligacy; it's precision. Look, take the clay statue case. Lumpl is the lump of clay. Goliath is the statue. I shape the lump into the statue. At time $t$, they coincide perfectly. But if I squash the statue at $t+1$, Goliath ceases to exist. Lumpl does not. By Leibniz's Law, if they have different properties, they are not identical. Therefore, they are distinct.

  **Marcus:** The modal argument. I know it well. But it buys you a nightmare: the Grounding Problem.

  **Elena:** Here we go.

  **Marcus:** No, listen. At time $t$, Lumpl and Goliath share every categorical property. Same mass, same shape, same atomic arrangement, same location, same history up to that point. They even share their parts. So, what *grounds* the difference in their modal properties? What makes it true that *this* object (you point to Goliath) is essentially statue-shaped, while *that* object (you point to Lumpl) is only accidentally statue-shaped? If there's no categorical difference in the base, aren't you just asserting a brute modal fact? It smells like magic.

  **Elena:** It's not magic, Marcus. It's sortal-dependence. The modal profile of an object isn't grounded in its atomic arrangement alone; it's grounded in *what the object is*. And "what it is" is determined by the sortal concept under which it falls. Lumpl falls under "lump of clay." Goliath falls under "statue." These sortals carry different persistence conditions. The grounding isn't in the physics; it's in the metaphysics of identity conditions.

  **Marcus:** But that just pushes the question back. Why does the world contain an object that satisfies the "statue" sortal *and* an object that satisfies the "lump" sortal in the exact same place? If the physics is identical, why isn't there just one object that we can describe in two ways? You're doubling the ontology without a difference in the substance.

  **Elena:** I'm not doubling the substance; I'm acknowledging that reality supports multiple modes of persistence. Think about it: if I squash the statue, you'd agree the clay survives, right?

  **Marcus:** Sure.

  **Elena:** And you'd agree the statue is destroyed?

  **Marcus:** Yes.

  **Elena:** So something survives that something else doesn't. If there were only one object, say $X$, then $X$ would both survive and not survive the squashing. That's a contradiction. To avoid the contradiction, you need distinct objects.

  **Marcus:** Or, you deny that identity is necessary.

  **Elena:** *[Pauses]* You're going down the Gibbard road? Contingent identity?

  **Marcus:** Why not? Look, Kripke's proof that identity is necessary relies on rigid designators. "Lumpl" and "Goliath" pick out the same object in the actual world. But in a counterfactual world where the clay is never shaped, "Goliath" doesn't pick out anything, or picks out a different configuration. If we treat the names as rigid, we get the contradiction. But if we allow that identity statements can be contingent—that $a=b$ can be true in the actual world but false in another—we dissolve the problem. There is one object. In the actual world, it is both a lump and a statue. In the squashing world, it is a lump, but not a statue.

  **Elena:** Marcus, that's a massive bullet to bite. Kripke dismantled contingent identity fifty years ago. If $a$ is identical to $b$, then anything true of $a$ is true of $b$. If it's *possible* that $a$ exists without $b$, then by Leibniz's Law, they aren't identical. You can't just say "identity is contingent" to save parsimony. That looks like changing the rules of logic to avoid counting objects.

  **Marcus:** Is it worse than changing the rules of metaphysics to allow two things in one place? You accuse me of ad hocery, but look at your position. You have two objects, interpenetrating, sharing all parts. How do you count them? If I ask "How many things are on this table?" do you say "Two"?

  **Elena:** I say there are two coincident objects. Yes.

  **Marcus:** And if I add another statue made of different clay? Now you have four objects?

  **Elena:** You have two lumps and two statues. Yes.

  **Marcus:** It's an explosion of entities. And for what? To save the intuition that "Lumpl" refers to something distinct from "Goliath." But reference is pragmatic. We can talk *as if* they are distinct because our interests differ. The art critic cares about Goliath; the geologist cares about Lumpl. But that doesn't mean the world contains two *res*.

  **Elena:** It's not just about interests, Marcus. It's about truth conditions. If I say "Goliath could not survive being squashed," that is true. If I say "Lumpl could survive being squashed," that is also true. If they are the same object, and identity is necessary, one of those statements must be false. You're asking me to deny obvious truths about persistence to save a logical principle. I'd rather save the truths and accept coincidence.

  **Marcus:** But you haven't answered the Grounding Problem. If they are distinct, there must be a truth-maker for their distinctness. They share all microphysical properties. They share all spatial properties. They share all historical properties up to $t$. The only difference is modal. But modal properties supervene on categorical properties. You can't have a difference in *what could happen* without a difference in *what is*. So, what is the categorical difference between Lumpl and Goliath at $t$?

  **Elena:** The categorical difference is their sortal instantiation. Lumpl instantiates *being a lump*. Goliath instantiates *being a statue*. These are real properties, not just linguistic labels.

  **Marcus:** But instantiation of a sortal isn't a physical property. It's a classification. If I have a single particle, and I classify it as "a particle" and "a constituent of a mug," have I created two entities?

  **Elena:** No, because a particle and a constituent aren't distinct in persistence conditions in the same way. With the statue, the conditions diverge.

  **Marcus:** They diverge *modally*. But modality is derivative. Here's the cost of my view versus yours. My cost: I have to explain away the necessity of identity. I can do that by arguing that rigid designation fails in constitution cases because the criteria for re-identification shift with the sortal. "Lumpl" tracks the matter; "Goliath" tracks the form. They track the same thing here, but diverge elsewhere. So $L=G$ is true-at-actual-world, but not true-at-squashing-world.

  **Elena:** And my cost?

  **Marcus:** Your cost is accepting brute, ungrounded modal differences between distinct entities. You're saying the universe contains two things that are physically indistinguishable but metaphysically distinct. That violates a very strong supervenience intuition. No difference in being without a difference in base.

  **Elena:** I don't think it's ungrounded. The ground is the causal role associated with the sortal. A statue has a function, an artistic history, a dependency on an artist's intention. A lump does not. These are real, relational properties. Goliath has the property *was created by an artist*. Lumpl does not (the clay existed before).

  **Marcus:** Ah, but now we're talking about historical properties. At time $t$, after creation, they share the property *was created by an artist*.

  **Elena:** No. Lumpl *contains* the clay that was shaped. Goliath *is* the shaped clay. The property applies differently.

  **Marcus:** This is getting messy. You're relying on fine-grained descriptions of properties to distinguish the objects. But if the objects are distinct, they should be distinct regardless of how we describe them.

  **Elena:** Okay, let's flip it. Let's talk about your Kripke problem. You say identity is contingent. But if $L=G$ in the actual world, and I point to the object and say "This," am I pointing to one thing or two?

  **Marcus:** One thing.

  **Elena:** So there is one thing there. But you also say Lumpl exists in the squashing world and Goliath doesn't. So in the squashing world, the thing I pointed to exists, but Goliath doesn't. So Goliath is not identical to the thing I pointed to in that world. But "This" is rigid. So Goliath is not rigid?

  **Marcus:** "Goliath" is rigid for statues. It picks out the statue in every world where that statue exists. In the squashing world, there is no statue, so "Goliath" fails to refer. "Lumpl" picks out the clay. In the squashing world, the clay exists. So in the actual world, the referents coincide. In the squashing world, they don't. Identity is a relation that holds between objects relative to a world.

  **Elena:** That sounds like you're saying identity isn't a relation between objects at all, but between concepts. If identity is world-relative, then you've essentially abandoned transworld identity. And if you've abandoned that, you've lost the ability to say the *same* object persists through time in a robust sense. You're sliding into perdurantism or eliminativism.

  **Marcus:** Maybe. Or maybe I'm just acknowledging that "object" is a count noun that depends on conceptual schemes. But look, Elena, be honest. Is it really more plausible that the universe contains ghostly doubles—statue-duplicates of every lump—than that our logic of identity needs a slight tweak for composite objects?

  **Elena:** They aren't ghostly doubles. They are coincident objects. It's not like they are in different dimensions. They are right here. The "doubling" is only in the persistence conditions. And I'd rather accept that than say that whether $A$ is identical to $B$ depends on which possible world we're asking from. That makes identity unstable. If Lumpl and Goliath are the same thing now, how can they become different things later? Identity is an all-or-nothing, timeless relation.

  **Marcus:** Is it? Or is that just a feature of the logic we learned in grad school? If we treat constitution as a kind of identity—constitution-identity—then we keep the one object, we keep the parsimony, and we just accept that the identity claim is sensitive to the sortal context.

  **Elena:** But then you lose the ability to say "Lumpl survived the squashing." Because if Lumpl *is* Goliath, and Goliath didn't survive, then Lumpl didn't survive. Unless you say "Lumpl-survived" is true and "Goliath-survived" is false, which brings you right back to Leibniz's Law and distinct objects.

  **Marcus:** I say "The object, considered as a lump, survived. The object, considered as a statue, did not."

  **Elena:** So there is one object with contradictory properties?

  **Marcus:** No. One object with different properties relative to different sortals.

  **Elena:** That's just Relative Identity dressed up. And Relative Identity has its own logical nightmares.

  **Marcus:** And Coincidence has the Grounding Problem. We're at a stalemate.

  **Elena:** Not quite. Let's weigh the costs. My cost: I violate the intuition that two material objects can't be in the same place at the same time. I have to explain why they don't compete for space. (Answer: because they share parts). I have to explain the grounding of modal differences. (Answer: sortals).

  **Marcus:** My cost: I violate the Necessity of Identity. I have to explain how one thing can have two names that diverge in modal contexts. (Answer: sortal-sensitive reference).

  **Elena:** Which is the bigger violation? Logic or Intuition?

  **Marcus:** Logic is a tool. If the tool breaks on the case, we fix the tool. Intuition about "two things in one place" is a deep metaphysical commitment. It's the Impossibility of Coinlocation.

  **Elena:** But coincident objects don't compete. They aren't like two electrons. They are constituted of the same matter. The Impossibility of Coinlocation applies to *disjoint* objects.

  **Marcus:** But then you have to define "disjoint" in a way that excludes Lumpl and Goliath. It feels like you're defining the problem away.

  **Elena:** And you feel like you're defining the object away.

  **Marcus:** *[Sips coffee]* You know, the worst part is that both of us agree on all the physical facts. We agree on when the clay was dug up, when it was shaped, when it was squashed. We agree on what an observer would see.

  **Elena:** Exactly. So the dispute is purely metaphysical.

  **Marcus:** Which suggests maybe the metaphysics is tracking something real, or maybe it's tracking nothing at all.

  **Elena:** If it were nothing, we wouldn't be able to make true claims about survival. "The statue was destroyed" is true. "The clay was not" is true. My theory explains why both are true without contradiction. Yours explains it by making the truth relative to a sortal.

  **Marcus:** And my theory explains why there aren't two things sitting on your table when you only paid for one mug.

  **Elena:** *[Laughs]* I didn't pay for the clay separately, Marcus. It came with the mug.

  **Marcus:** See? Even your wallet knows there's only one object.

  **Elena:** My wallet knows there's one transaction. It doesn't know metaphysics. But look, if I'm right, the world is richer than you think. It contains objects defined by their persistence conditions, not just their matter.

  **Marcus:** And if I'm right, the world is simpler, but identity is more complex than you think. It's not a brute relation; it's sortal-relative.

  **Elena:** So, we're left with a choice between a complex ontology with standard logic, or a simple ontology with non-standard logic.

  **Marcus:** Essentially.

  **Elena:** I'll keep my objects. I trust Leibniz more than I trust parsimony when it comes to persistence.

  **Marcus:** And I'll keep my object. I trust the unity of the physical base more than I trust the divergence of modal intuitions.

  **Elena:** Same time next week?

  **Marcus:** Sure. Bring the clay.

  **Elena:** Don't worry. I won't squash it. I don't want to destroy the evidence.

  **Marcus:** Or create two things where there was one.

  **Elena:** *[Smiles]* We'll see.
