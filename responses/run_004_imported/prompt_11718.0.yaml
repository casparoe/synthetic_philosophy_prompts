answer: |-
  **MEMORANDUM**

  **TO:** Data-Visualization Standards Committee
  **FROM:** [Your Name], Software Engineer
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Mobile Iconography Exception (Isotype Standard 4.1)

  **Purpose**
  This memo requests a vote on whether to grant a narrow exception to Standard 4.1 (Isotype Icon Repetition) for the County Health Mobile Dashboard. The proposal is to allow icon scaling (resizing) for high-volume metrics where icon repetition compromises legibility on small screens.

  **Context**
  Our current standard mandates representing quantity through the repetition of fixed-size icons (e.g., ten syringes for 100,000 doses), adhering to Otto Neurath's ISOTYPE method. A proposal has been made to allow single icons to scale in area to represent larger quantities on mobile devices, where screen real estate limits the number of repeatable units.

  **Analysis of Principles**
  To decide, we must revisit why Neurath insisted on repetition over resizing. His objection was not merely aesthetic; it was semantic. Neurath argued that enlarging a symbol changes its *kind*, not just its *amount*. A syringe twice the size of another does not intuitively read as "twice the doses"; it reads as a "large syringe" versus a "small syringe." This conflates intensity with quantity. Furthermore, ISOTYPE was designed for democratic accessibility: the public can count units easily, but humans are notoriously poor at comparing areas (a finding later confirmed by Stevens' Power Law).

  However, Neurath's goal was *public comprehension*, not dogmatic adherence to a technique. If a mobile chart displays 50 tiny syringes that blur into visual noise, the "unit" is no longer countable, and the semantic integrity is lost anyway. A cluttered chart fails the public trust just as a misleading one does.

  **Recommendation**
  I recommend **carving out a narrow exception** to Standard 4.1, subject to the following constraints:

  1.  **Threshold Limit:** Icon repetition remains the default. Scaling is permitted *only* when the count exceeds 10 units, at which point repetition is deemed to compromise legibility on mobile viewports.
  2.  **Explicit Annotation:** Scaled icons must be accompanied by exact numerical figures (visible or on tap) to mitigate area-estimation errors.
  3.  **Legend Clarity:** The legend must explicitly state "Icon size represents volume" rather than "1 Icon = X doses," ensuring the user understands the shift from counting to estimating.

  **Rationale**
  This approach preserves Neurath's core intent—truthful representation of quantity—where it is most effective (low numbers), while acknowledging the medium's constraints where it is not (high-density mobile data). We maintain the "unit" concept for small counts, preserving the intuitive counting mechanism, but prioritize clarity over dogma when the medium prevents legibility.

  **Action Required**
  Please review this proposal prior to Monday's meeting. A majority vote is required to amend Standard 4.1.
