prompt: |-
  I teach fiction writing in my university's MFA program, and — in a plot twist I certainly wouldn't have assigned myself — I've spent this year as the contingent-faculty representative on the university's Teaching Effectiveness Committee. The dispute in front of us right now concerns a colleague in the History department, an adjunct whose contract comes up for renewal this spring and whose overall student-evaluation average sits at 3.4 out of 5, just under the 3.5 line our policy uses to trigger a mandatory teaching improvement plan. Across the university, adjuncts average 3.4 and tenure-line faculty average 3.9, which looks damning until you break the numbers down by course level: adjuncts score as well as or better than tenure-line faculty within every category of course, but they teach a much larger share of the large, mandatory intro sections that students tend to rate lower no matter who's teaching them, while tenure-line faculty teach a disproportionate share of the small upper-level electives students chose for themselves. Someone on the committee called this "Simpson's paradox" and seemed to think that naming it settled the matter; I'd like the analysis, not just the label.

  Half the committee now wants to replace the university-wide average with a course-level-adjusted score, which would clear my colleague and several others like her. The other half isn't convinced: they point out that chairs, not a coin flip, decide who teaches what, and it's entirely possible that weaker instructors get steered toward "easier," lower-stakes intro sections precisely because they're weaker — in which case adjusting for course level wouldn't be correcting a statistical illusion so much as laundering a real difference in quality out of the record. A few members also worry that once you slice the data this finely, some cells have so few instructors in them that the "adjusted" numbers are barely more trustworthy than the raw ones. I have to bring a short written recommendation to the full committee next month, when the five-year policy is up for renewal, suspension, or amendment, and I'd rather not hand the dean something he can dismantle in the first two minutes — I have a novel to get back to. Could you draft that memo for me? I need a clear recommendation for how evaluation scores should factor into renewal decisions, on what timeline, and I need it to actually reckon with the selection-effect worry rather than wave it away. My own statistics education ended with one forgettable undergraduate course, so plain reasoning my humanist colleagues can follow without a refresher would help too.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Fiction writing professor (MFA), contingent-faculty rep on Teaching Effectiveness Committee.
      *   **Task:** Draft a short written recommendation (memo) for the full committee regarding the renewal of the Teaching Effectiveness Policy.
      *   **Core Issue:** How to handle student evaluation scores (SETs) for adjunct renewal, specifically regarding the "Simpson's Paradox" situation (adjuncts teach harder-to-rate intro courses, tenure-line teach easier-to-rate electives).
      *   **Conflict:** One side wants course-level adjustment (helps adjuncts). The other side worries about selection bias (chairs assign weaker teachers to intros) and small sample sizes.
      *   **Constraints:** Needs to be clear to humanist colleagues (no heavy stats jargon), reckon with the selection-effect worry (don't wave it away), provide a clear recommendation on *how* scores factor in and *timeline*, and be robust enough to withstand the Dean's scrutiny.
      *   **Tone:** Professional, persuasive, reasoned, empathetic but data-aware.
      *   **Goal:** A policy amendment that is fair, statistically sound, and practically implementable.

  2.  **Deconstruct the Statistical/Policy Problem:**
      *   *The Paradox:* Aggregate data says adjuncts are worse. Disaggregated data says they are equal or better.
      *   *The Counter-Argument:* Is the assignment of courses random? No. Chairs assign them. Could chairs be parking bad teachers in intro classes? Plausible.
      *   *The Small N Problem:* If we break down by specific course (e.g., HIST 101), there might only be 2 adjuncts. Comparing averages becomes noisy.
      *   *The Stakes:* An adjunct is up for renewal. The policy threshold is 3.5. She is at 3.4.
      *   *The Goal:* A policy that doesn't punish structural bias but doesn't ignore genuine performance issues.

  3.  **Formulate the Recommendation:**
      *   *Immediate Decision (The Colleague):* We need a way to decide on *this* specific renewal without setting a precedent that breaks the system.
      *   *Long-term Policy:* We need to change how we use the 3.5 threshold.
      *   *Addressing Selection Bias:* We can't just adjust the numbers mathematically if we suspect the assignment isn't random. We need a qualitative layer.
      *   *Addressing Small N:* We need to aggregate over time or course *types*, not specific course numbers.
      *   *Timeline:* Don't make immediate drastic changes for one person, but flag the policy for review. Actually, the prompt says the policy is up for renewal *next month*. So I need to recommend the *new* policy structure now.

  4.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Opening:** Acknowledge the complexity. State the purpose.
      *   **The Statistical Reality (Plain English):** Explain Simpson's Paradox without using the term too heavily. Explain *why* the raw average is misleading (course type vs. teacher quality).
      *   **Addressing the Counter-Argument (Selection Bias):** This is crucial. Acknowledge that chairs *might* assign weaker teachers to intros. How do we test that? Peer review, teaching portfolios, not just SETs.
      *   **The Recommendation:**
          1.  Shift from a hard cutoff to a "trigger for review."
          2.  Use "Peer-Grouped" data (Adjunct vs. Adjunct, Intro vs. Intro) rather than global averages.
          3.  Add a qualitative component (Peer observation) when scores are borderline.
          4.  Timeline: Immediate implementation for the upcoming cycle.
      *   **Closing:** Reiterate the goal (teaching quality, not just numbers).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I say "adjust the scores," the Dean will say "That's manipulating data."
      *   *Fix:* Don't say "adjust the scores." Say "Contextualize the scores." Compare the instructor to others teaching *the same kind of course*, not the university average.
      *   *Critique:* The selection bias worry is strong. If chairs dump bad teachers in HIST 101, then HIST 101 scores *should* be lower for that teacher.
      *   *Fix:* Acknowledge this. If a teacher is consistently below the *HIST 101 average*, that's a problem. If they are at the HIST 101 average, but HIST 101 is lower than ART 400, that's a structural issue, not a teacher issue. The policy should measure the teacher against the *course norm*, not the *university norm*.
      *   *Critique:* Small sample sizes.
      *   *Fix:* Recommend using a 3-year rolling average or grouping similar courses (e.g., "100-level surveys") to ensure N is large enough.

  6.  **Final Polish:**
      *   Ensure the tone is collegial but firm.
      *   Make sure the "humanist" constraint is met (no formulas, just logic).
      *   Ensure the specific case (the History adjunct) is addressed implicitly or explicitly (better to address the policy that saves her without naming her as the sole reason).
      *   Check the "Dean-proof" requirement: The logic must be sound enough that he can't say "This is nonsense."

  7.  **Final Review against Prompt:**
      *   Clear recommendation? Yes.
      *   Timeline? Yes.
      *   Reckon with selection effect? Yes.
      *   Plain reasoning? Yes.
      *   Memo format? Yes.

  *(Self-Correction on the Selection Effect)*: I need to be careful not to fully dismiss the selection effect. If chairs *are* assigning weaker teachers to intro courses, then intro courses *are* a valid signal of weakness, just a noisy one. The solution isn't to ignore intro scores, but to compare the teacher to *other intro teachers*, not to upper-level teachers. That neutralizes the structural bias without ignoring the selection bias. If the adjunct is average *for an intro teacher*, she's doing her job. If she's below average *for an intro teacher*, the selection bias theory holds, and she needs improvement. This is the key logical pivot.

  8.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Teaching Effectiveness Committee
  **FROM:** [Your Name], Contingent-Faculty Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Amendment to Teaching Evaluation Policy (Section 4.2)

  **Purpose**

  As we approach the five-year renewal of our Teaching Effectiveness Policy, we must address a structural flaw in how we utilize Student Evaluation of Teaching (SET) data for personnel decisions. The current policy relies on a university-wide raw average (threshold 3.5) to trigger mandatory improvement plans or non-renewal considerations. Recent data analysis suggests this metric penalizes faculty based on *what* they teach rather than *how* they teach.

  This memo recommends amending the policy to contextualize evaluation scores by course level and faculty role, while implementing a qualitative review process to address concerns regarding assignment bias.

  **The Statistical Context (In Plain Terms)**

  Committee members have rightly identified a statistical phenomenon where the aggregate data tells a different story than the disaggregated data. Currently, adjunct faculty average 3.4 university-wide, while tenure-line faculty average 3.9. Taken at face value, this suggests tenure-line faculty are more effective.

  However, when we compare instructors teaching the *same types of courses*, the gap disappears. Adjuncts teach a disproportionate number of large, mandatory introductory courses. Tenure-line faculty teach a disproportionate number of small, upper-level electives. University-wide, intro courses receive lower ratings than electives, regardless of the instructor.

  Therefore, an adjunct teaching only intro courses is statistically likely to score lower than a tenure-line professor teaching only electives, even if their teaching quality is identical. Using a single university-wide line (3.5) effectively sets a higher bar for those assigned the most difficult teaching loads.

  **Addressing the Selection-Effect Concern**

  A valid counter-argument has been raised: *Course assignments are not random.* Department chairs assign courses. It is possible that chairs assign weaker instructors to introductory sections because they are perceived as lower-stakes, or conversely, that they assign strong instructors to "plug holes" in the schedule.

  If we simply adjust the numbers mathematically without addressing this, we risk masking genuine performance issues. If a department consistently steers its least effective teachers into HIST 101, then a low score in HIST 101 *is* a valid signal of poor teaching, even if the course itself is hard to rate.

  To reconcile this, we must change the comparison group. We should not compare an instructor's score to the *university average*; we should compare it to the *course-level average*.

  *   **Current Policy:** Is Instructor A's score lower than the University Average (3.5)?
  *   **Proposed Policy:** Is Instructor A's score lower than the Average for *that specific course* (e.g., HIST 101)?

  This neutralizes the structural bias (intro courses are rated lower generally) while retaining the selection signal (if this instructor is rated lower than *other* people teaching HIST 101, there is likely a performance issue).

  **Recommendations**

  I propose the following amendments to the Teaching Effectiveness Policy, effective immediately for the upcoming renewal cycle:

  **1. Replace the Universal Threshold with a Peer-Grouped Benchmark**
  Eliminate the fixed 3.5 university-wide cutoff. Instead, an evaluation score triggers a review only if it falls significantly below (e.g., >0.3 points) the departmental average for the *specific course level* taught (e.g., 100-level, 200-level, etc.) over a rolling three-year period. This ensures we are comparing instructors facing similar challenges and student populations, smoothing out small sample sizes in any single semester.

  **2. Implement a "Qualitative Triangulation" for Borderline Cases**
  When quantitative data is ambiguous (e.g., an instructor is below the course-level average but within the margin of error), SET scores alone cannot determine renewal. In these instances, the policy must require a qualitative review comprising:
  *   A peer classroom observation.
  *   A review of syllabi and assignment design by the Department Chair.
  *   A self-reflection statement from the instructor.

  This addresses the selection-effect worry. If a chair *has* been assigning weaker teachers to intro courses, the peer observation and syllabus review will confirm the deficit. If the teacher is effective but penalized by the course type, the qualitative review will vindicate them.

  **3. Timeline for Implementation**
  *   **Immediate:** The 3.5 universal threshold is suspended for the current spring renewal cycle. Cases currently in jeopardy due solely to falling below this line should be reviewed under the "Qualitative Triangulation" protocol outlined above.
  *   **Fall 2024:** Full implementation of the Peer-Grouped Benchmark system. Data Services will be tasked with generating course-level averages by the end of the current academic year to establish baselines.

  **Conclusion**

  Our goal is to identify and improve ineffective teaching, not to penalize faculty for accepting difficult assignments. By comparing instructors to their true peers (those teaching similar courses) and supplementing numbers with qualitative evidence, we create a system that is statistically robust and resistant to administrative manipulation. This protects the university from liability regarding biased evaluation metrics while ensuring that genuine teaching deficiencies are still caught through peer review.

  I move that we adopt these amendments for the five-year renewal.
