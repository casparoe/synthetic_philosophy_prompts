      *   *Is there a case where they differ?* Some argue FDT fails on "The Bomb" (Ahmed 2019) or similar logical uncertainty cases where the agent can prove things about itself. UDT's "prior" approach might handle logical uncertainty better by treating it as empirical uncertainty (before logical omniscience). FDT's strict logical implication can lead to paradoxes (Löb).
