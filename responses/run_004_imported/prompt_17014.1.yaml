      *   *Correction:* Did FDT actually change the recommendations? In the FDT paper, they discuss cases where FDT diverges from EDT/CDT. Do they diverge from UDT? The paper claims FDT *is* the formalization of UDT.
      *   *Key Distinction:* UDT 1.0 vs UDT 1.1. UDT 1.0 treated the agent as a single input-less program. UDT 1.1 allowed inputs. FDT aligns with UDT 1.1. So FDT fixed a bug in early UDT formulations.
