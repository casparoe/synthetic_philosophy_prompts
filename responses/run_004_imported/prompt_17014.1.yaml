answer: |-
  This is one of the sharpest questions one can ask about the modern rationalist decision-theory canon. You have correctly identified the tension: Wei Dai's **Updateless Decision Theory (UDT)** is framed as an optimization problem over policies relative to a prior, while Yudkowsky and Soares' **Functional Decision Theory (FDT)** is framed as an analysis of subjunctive (logical) dependence between algorithmic instances.

  My thesis is this: **UDT and FDT are extensionally equivalent in all standard decision problems, but they differ intensionally in how they justify those recommendations.** FDT is best understood as an attempt to provide the metaphysical and formal machinery that UDT left implicit. "Subjunctive dependence" does genuine technical work—not by changing the *output* of the decision procedure in standard cases, but by constraining the *input* (the set of allowable correlations) in a way that prevents UDT from becoming a "magic prior" machine.

  However, because the formalization of "logical counterfactuals" remains incomplete, UDT retains an advantage as a robust mathematical abstraction, while FDT serves as the superior pedagogical and philosophical interface.

  Here is the detailed breakdown.

  ---

  ### 1. The Core Mechanisms: Policy Selection vs. Logical Output

  To see where the theories align and diverge, we must look at what they treat as the primitive object of optimization.

  **UDT (Policy Selection):**
  UDT asks you to ignore your current observations for the sake of the decision calculation. Instead of asking "Given I see $X$, what should I do?", you ask "What function $S \to A$ (mapping observations to actions) should I have committed to before seeing anything?"
  *   **The Engine:** Maximize Expected Utility over the space of policies, weighted by your **prior**.
  *   **The Black Box:** UDT does not strictly specify *why* your choice of policy affects the outcome in simulations or predictions. It simply asserts that your prior assigns probability mass to worlds where your policy determines the outcome. If your prior says "Omega simulates me," UDT says "Optimize the policy knowing that."

  **FDT (Subjunctive Dependence):**
  FDT asks you to view your decision as the output of a fixed decision algorithm $\text{Dec}(\text{Observation})$.
  *   **The Engine:** Evaluate counterfactuals based on **subjunctive dependence**. If another entity (Omega, a twin, a simulation) contains a subsystem that is logically equivalent to your decision algorithm, then changing your output *logically implies* changing their output.
  *   **The Mechanism:** It explicitly models the *link* between you and the predictor. It forbids you from treating the predictor's prediction as a fixed fact (CDT) or a mere statistical correlation (EDT). It treats it as a logical identity.

  **The Relationship:**
  FDT is effectively UDT 1.1 with a specific account of *how* the policy selection exerts influence. UDT 1.0 (the original 2009 posts) treated the agent as a program with no inputs, which led to confusion about how to handle observations. UDT 1.1 (and subsequently FDT) treats the agent as a function $f(obs) \to action$. FDT adds the vocabulary of "subjunctive dependence" to explain *which* nodes in the causal graph are tied to $f$.

  ### 2. Does "Subjunctive Dependence" Do Technical Work?

  You asked whether subjunctive dependence does work that "policy selection under a fixed prior" could not do on its own. The answer is **yes, but primarily as a constraint on admissible priors.**

  A naive UDT agent could theoretically be programmed with a "magical prior." For example, a UDT agent could have a prior that assigns high probability to "If I one-box, Omega put the money there," even if Omega is actually a random number generator unrelated to the agent. UDT, purely as an optimization procedure, would one-box and lose, because it is maximizing *expected* utility relative to a *wrong* prior.

  FDT tightens this. FDT says you cannot simply *assume* a correlation in your prior; there must be a **structural reason** for the correlation. That reason is subjunctive dependence: the predictor's model must actually *run* (or logically entail) your decision algorithm.
  *   **UDT says:** "Maximize utility given your beliefs about the world." (If your beliefs are wrong about the correlation, you fail.)
  *   **FDT says:** "Maximize utility given the logical implications of your algorithm." (This forces you to only count correlations where the algorithm is actually instantiated.)

  In this sense, FDT is a **restriction** of UDT. It tells you which priors are rationally permissible. It rules out "evidential" correlations that lack a logical/causal link (solving the Newcomb problem without falling into the "Smoking Lesion" trap of EDT).

  ### 3. Concrete Test Case: Newcomb's Problem with a Transparent Box

  Let's use a variant of Newcomb's Problem to test for divergence. Consider **Transparent Newcomb**:
  *   Two boxes: A (transparent, visible) and B (opaque).
  *   Box A contains \$1,000. Box B contains \$1,000,000 or \$0.
  *   Omega predicts your choice. If Omega predicts you will take **only B**, it puts \$1M in B. If it predicts you will take **both**, it leaves B empty.
  *   **Crucial Twist:** Box A is transparent. You can *see* whether B is full or empty before you choose.

  **The Scenario:** You look and see that Box B is **full**.

  **CDT/EDT:**
  *   **CDT:** Take both. The money is already there. Your action now cannot causally change the past prediction. +\$1,000.
  *   **EDT:** Take both. (Usually). The state of the box is evidence of the past, but your action doesn't change it. (Some EDT variants might one-box, but standard causal reasoning dominates once the box is observed).

  **UDT:**
  *   UDT refuses to update on the observation "Box B is full" for the purpose of decision-making.
  *   It asks: "Which policy yields more utility ex-ante? Policy 'Always One-Box' or Policy 'Take Both if Full'?"
  *   Policy 'Always One-Box' gets \$1M. Policy 'Take Both if Full' gets \$0 (because Omega predicts this and leaves B empty).
  *   **Recommendation:** One-Box (take only B), even though you see the million dollars sitting there. You act as if your choice now determines the past placement.

  **FDT:**
  *   FDT analyzes the algorithmic dependence. Omega's prediction was generated by simulating your decision algorithm.
  *   Even though you have observed the outcome, your decision algorithm is *logically identical* to the one Omega simulated.
  *   If your algorithm outputs "Take Both" in this state, the simulation would have output "Take Both," and the box would be empty.
  *   The fact that you *see* a full box is logically consistent *only* with your algorithm outputting "One-Box."
  *   **Recommendation:** One-Box.

  **Divergence?**
  In this standard setup, **there is no divergence.** Both recommend One-Boxing.

  **Where Divergence Might Arise (The "Troll Bridge"):**
  The divergence appears not in the *recommendation*, but in the **handling of logical uncertainty**.
  Suppose there is a "Troll" who blows up the bridge if you cross *and* you can prove that crossing is safe.
  *   **UDT:** Handles this via the prior. If your prior assigns probability to "Troll explodes if I prove safety," UDT avoids crossing.
  *   **FDT:** Struggles with "spurious counterfactuals." If the agent can prove "If I cross, Troll explodes" (via Löb's theorem shenanigans), FDT might get stuck in a loop where it refuses to cross because it can prove crossing is bad, but the proof is only valid because it refuses to cross.

  FDT attempts to solve this with specific rules about counterfactual reasoning, but this is the weakest link in FDT. UDT, by treating logical uncertainty as just another form of uncertainty in the prior (before logical omniscience), is arguably more robust here, though less specific.

  ### 4. Substantive Difference or Framing?

  It is **mostly framing**, but the framing solves a critical implementation bug in early UDT.

  1.  **The Input Problem:** UDT 1.0 struggled to define what counted as an "observation." If I update on *anything*, I break updatelessness. If I update on *nothing*, I can't act on information. FDT clarifies this: The decision is a function of observations, but the *counterfactuals* are evaluated over the function, not the specific output. This was a substantive fix to UDT's formalism.
  2.  **The "Why" Problem:** UDT feels like magic commitment. "Why should I care about the counterfactual world where the coin came up Tails, when I know it came up Heads?" UDT says "Because your prior said so." FDT says "Because your algorithm is the same in both branches." FDT provides the *mechanism* for the commitment.

  So, while they recommend the same actions in the "canon" of decision problems (Newcomb, Mugging, Hitchhiker, Prisoner's Dilemma), FDT is a **refinement** that makes the theory more portable and less reliant on "hand-wavy priors."

  ### 5. Foundational Preference: Which is More Satisfying?

  If forced to choose a foundational account, I consider **UDT (specifically UDT 1.1)** to be the more robust *mathematical* core, while **FDT** is the superior *philosophical* account.

  **Why UDT is the better mathematical core:**
  "Subjunctive dependence" is not yet a rigorously defined mathematical object. We do not have a complete theory of logical counterfactuals. We don't know how to compute them in general cases involving self-reference (as seen in the Troll Bridge problem). UDT, by contrast, reduces the problem to: *Maximize expected utility over policies given a prior.* This is a well-defined optimization problem (even if computationally intractable). It pushes the mystery into the "prior," which is where uncertainty belongs.

  **Why FDT is the better philosophical account:**
  UDT risks being a "bucket" for any non-causal decision theory. Without the concept of subjunctive dependence, one might mistakenly apply UDT to cases where there is no logical link (e.g., thinking your decision affects the stock market because you have a prior that says so). FDT's insistence on **algorithmic identity** provides the necessary constraint to distinguish rational acausal trade from superstition. It explains *why* the policy selection works.

  **Conclusion:**
  The transition from UDT to FDT was not a change in the *destination* (the set of rational choices), but a repair of the *map*.
  *   **UDT** identified the target: Policy selection without updating.
  *   **FDT** identified the terrain: Logical dependence between algorithmic instances.

  If you are building an AI, you want the UDT objective function (maximize over policies). But if you are trying to understand *why* that objective function is rational, you need the FDT explanation (subjunctive dependence). The "knot" you are trying to untangle is real, but it is a knot between **formalism** (UDT) and **justification** (FDT). They are two sides of the same coin, and neither is complete without the other.

  For your own understanding, I recommend treating **UDT as the math** and **FDT as the semantics**. When in doubt about what to do, calculate the policy value (UDT). When in doubt about *why* that policy is valid, check for algorithmic correlation (FDT).
