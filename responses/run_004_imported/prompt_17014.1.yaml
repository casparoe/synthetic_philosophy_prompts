      *   *Relationship:* FDT is widely considered a formalization and refinement of UDT. UDT was somewhat informal/pseudocode. FDT tried to ground it in a more rigorous decision-theoretic framework.
      *   *Substantive Difference:* Most experts in the rationalist community view them as effectively the same *recommendation* engine, but FDT provides a different *justification* mechanism (logical counterfactuals vs. policy selection). However, there are nuances regarding *how* the prior is handled and how "logical uncertainty" is modeled.
      *   *Divergence:* Are there cases where they diverge? Generally, no, not in standard problems. The divergence usually comes from how one *implements* the logical counterfactuals (the "troll" problems, etc.).
      *   *Foundational Account:* FDT is often seen as more explicit about the metaphysics of decision (logical causation), while UDT is more pragmatic (optimization over policies).

  3.  **Drafting the Comparison (Section by Section):**

