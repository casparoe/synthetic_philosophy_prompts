          *   *FDT:* "Subjunctive Dependence." The decision is $DecisionAlgorithm(Observation)$. If Omega simulates you, the simulation runs the *same* algorithm. Changing the output changes the simulation's output.
          *   *Connection:* Policy selection *implies* subjunctive dependence. If I commit to a policy, I am effectively treating my future self and simulations of me as bound by that policy.

      *   **The Technical Work of "Subjunctive Dependence":**
