      *   **Task:** The user wants me to argue the *opposite* of the committee's demand. They want an argument that evolutionary biologists *are* entitled to treat adaptation by natural selection as the *default* explanation (null hypothesis) for complex, well-functioning traits, placing the burden of proof on non-adaptive alternatives.
      *   **Constraint:** I must argue this specific position, even though the "Spandrels" critique is a cornerstone of modern evolutionary biology. I need to provide a robust, intellectually honest defense of adaptationism without necessarily dismissing Gould and Lewontin entirely, but rather contextualizing their critique within a broader methodological framework.
      *   **Tone:** Academic, persuasive, nuanced, and supportive of the student's position (while acknowledging the complexity).

  2.  **Deconstruct the Scientific/Philosophical Debate:**
      *   **The "Spandrels" Critique:** Gould and Lewontin argued against "pan-selectionism" (the idea that every trait is an optimal adaptation). They warned against just-so stories and emphasized constraints, drift, and exaptation.
      *   **The Adaptationist Defense:** Why might one argue adaptation should be the default?
          *   *Design/Complexity:* Complex traits that look engineered usually are (Dawkins' argument).
          *   *Predictive Power:* Adaptationism generates testable hypotheses.
          *   *Parsimony:* Natural selection is the only known process that creates functional complexity.
          *   *Methodological Necessity:* You have to start somewhere. If you assume everything is a spandrel, research stalls.
          *   *Empirical Success:* Many "spandrels" turned out to be adaptations upon closer inspection.

  3.  **Drafting the Argument - Key Points to Include:**
      *   **Introduction:** Acknowledge the weight of the "Spandrels" paper but frame the adaptationist program as a necessary heuristic.
      *   **Point 1: The Unique Causal Power of Selection.** Drift and constraints break things or keep them the same; selection builds function. If a trait looks functional, selection is the only tool in the toolbox that builds function.
      *   **Point 2: Methodological Parsimony (The "Sherlock Holmes" approach).** Eliminating the most probable cause first is inefficient. Start with the strongest engine of change.
      *   **Point 3: The Risk of the "Spandrel" Default.** If non-adaptive explanations are the null, they become unfalsifiable "get-out-of-jail-free" cards. It stifles inquiry.
      *   **Point 4: Distinguishing "Panglossian" from "Pragmatic" Adaptationism.** Defend against the charge of being naive. One can be an adaptationist without believing *everything* is optimal.
      *   **Point 5: Empirical Track Record.** Historically, rigorous adaptationist research has yielded more concrete results than assuming traits are by-products.
      *   **Conclusion:** Summarize why the burden of proof should logically rest on the nullification of function, not the assumption of it, for *complex* traits.

  4.  **Refining the Tone and Nuance:**
      *   *Caution:* I cannot tell the student to ignore their committee. That's bad advice. I need to frame this as a philosophical justification for their *approach*, which they can use to refine their proposal (perhaps by framing adaptation as the working hypothesis while acknowledging constraints).
      *   *Accuracy:* I must ensure I represent the evolutionary biology debate accurately. The "default" status of adaptationism is contested (e.g., Lynch on drift, neutral theory). I need to focus on *complex, well-functioning traits* as the user specified. This is a crucial qualifier. Neutral theory applies well to molecular sequences; adaptationism applies better to phenotypes.
      *   *Key Terminology:* Use terms like "methodological adaptationism," "empirical adaptationism," "functional complexity," "null hypothesis," "exaptation."

  5.  **Self-Correction/Safety Check:**
