prompt: |-
  I've been reading LessWrong and its offshoots for the better part of a decade now, and there's a move I keep encountering -- in Bostrom's 2012 paper "The Superintelligent Will," in Superintelligence itself, and in countless forum comments since -- where the orthogonality thesis is given a respectable philosophical pedigree by appeal to Hume. The reasoning goes: since reason cannot cross the is-ought gap and is, in Hume's own words, "the slave of the passions," there is no rational constraint that would prevent arbitrarily high intelligence from being combined with more or less any final goal. It's a tidy story, and it circulates often enough in the rationalist blogosphere that I suspect most people who repeat it have never gone back to check how much of Hume's actual moral psychology it leaves on the table.

  What gets left out, I think, is everything Hume builds on top of that deflationary claim: his distinction between calm and violent passions (and his warning that calm passions are easily mistaken for the deliverances of reason itself), his account of how custom and general rules discipline particular passions into stable, predictable dispositions, and above all his argument, in Book 3 of the Treatise, that what later commentators call the "circumstances of justice" -- moderate scarcity together with only limited human generosity -- make convergence on stable possession, promise-keeping, and the pursuit of power and resources close to unavoidable among finite, needy, social creatures. None of that reads like "any goal is as psychologically available as any other."

  So here is what I'd like you to do: reconstruct, using only the resources of Hume's own system rather than the one-line slogan usually attached to his name, what he would actually say about the orthogonality thesis and about the instrumental convergence thesis (the Omohundro/Bostrom claim that agents with almost any final goal will tend to converge on subgoals like self-preservation, resource acquisition, and cognitive enhancement). Does the fuller Humean apparatus really license the strong reading of orthogonality that Bostrom's argument needs, or does it commit Hume, on his own terms, to something that looks a lot more like instrumental convergence in eighteenth-century dress -- the view that any sufficiently capable, finite, socially embedded mind will end up wanting recognizably similar things, as a matter of the "science of man" rather than logical necessity? I'm less interested in a verdict on who turns out to be right by our lights than in the strongest, most textually grounded reconstruction of Hume's own considered position, tensions and all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a long-time reader of LessWrong and is familiar with the Orthogonality Thesis (intelligence and goals are independent) and the Instrumental Convergence Thesis (agents with different goals converge on similar subgoals). They note that Bostrom and others often cite Hume ("reason is the slave of the passions") to support Orthogonality.
      *   **Critique:** The user argues that this citation is superficial. It ignores Hume's deeper moral psychology (calm vs. violent passions, custom, general rules) and his "circumstances of justice" (moderate scarcity, limited generosity).
      *   **Task:** Reconstruct Hume's position on Orthogonality and Instrumental Convergence *using only Hume's own system* (Treatise, Enquiry, etc.).
      *   **Key Question:** Does Hume's full system support the strong Orthogonality Thesis (any goal is possible for any intelligence), or does it imply a form of Instrumental Convergence (finite, social minds converge on similar goals/subgoals due to human nature/circumstances)?
      *   **Constraint:** Focus on textual grounding and Hume's considered position, not modern verdicts on who is right.

  2.  **Deconstruct the Humean Apparatus:**
      *   *Reason vs. Passion:* "Reason is, and ought only to be the slave of the passions." This is the standard Orthogonality hook. It means reason calculates means, passions set ends.
      *   *Calm vs. Violent Passions:* Not all passions are equal. Calm passions (benevolence, sense of beauty, long-term interest) often feel like reason but are still passions. Violent passions (anger, immediate greed) disrupt.
      *   *Custom and Habit:* The great guide of human life. Stabilizes expectations and behaviors.
      *   *Sympathy:* The mechanism by which we share sentiments. Crucial for moral agreement.
      *   *Circumstances of Justice:* Moderate scarcity + limited generosity + approximate equality of power. This makes conventions (property, promise-keeping) necessary and advantageous.
      *   *The "Science of Man":* Hume believes there are universal principles of human nature. We aren't blank slates; we have a specific psychological architecture.

  3.  **Evaluate Orthogonality through a Humean Lens:**
      *   *Bostrom's Claim:* Intelligence $\perp$ Final Goals. A superintelligence could want to maximize paperclips.
      *   *Hume's View:* Can a mind have *any* goal?
          *   Hume thinks passions are original existences. They aren't true/false.
          *   *However*, passions arise from specific causes (pleasure/pain, sympathy, imagination).
          *   Hume posits a *universal* human nature. "There are certain principles of human nature which are common to all men." (Enquiry).
          *   Therefore, while reason doesn't dictate ends, *human nature* constrains what passions actually arise in human minds.
          *   *Verdict on Orthogonality:* Hume would reject the *strong* version (any goal is psychologically available). He would accept a *weak* version (reason doesn't logically dictate ends), but argue that empirical psychology dictates that human-like minds will share ends. A "superintelligence" that isn't human-like might be outside his scope, but a "superintelligent human" would still be bound by human nature.

  4.  **Evaluate Instrumental Convergence through a Humean Lens:**
      *   *Bostrom's Claim:* Diverse goals $\rightarrow$ Convergent Subgoals (self-preservation, resources, etc.).
      *   *Hume's View:* Why do humans converge on property, promises, and power?
          *   Because of the *Circumstances of Justice*.
          *   If you are finite, needy, and social, you *must* cooperate to survive/flourish.
          *   This leads to "artificial virtues" (justice, fidelity).
          *   Self-preservation and resource acquisition aren't just instrumental subgoals; they are rooted in the fundamental passions (aversion to pain, desire for happiness) operating under constraints.
          *   *Verdict on Convergence:* Hume strongly supports a version of this. Given the "circumstances of justice," any sufficiently capable, finite, social mind will converge on similar conventions and subgoals. It's not logical necessity, it's *natural* necessity (causal regularity).

  5.  **Synthesize the Argument:**
      *   **Introduction:** Acknowledge the user's insight. The "Humean shield" for Orthogonality is indeed a partial reading.
      *   **Section 1: The Slave of the Passions (The Orthogonality Hook).** Explain what Hume actually means. It's anti-rationalist, not anti-naturalist. Reason can't generate ends, but nature does.
      *   **Section 2: The Architecture of Desire (Constraining Orthogonality).** Discuss the universal principles of human nature. Passions aren't random; they follow laws (association, sympathy). A mind without these isn't a "human" mind in Hume's sense.
      *   **Section 3: The Circumstances of Justice (The Convergence Engine).** This is the core. Scarcity + Limited Generosity $\rightarrow$ Conventions. This looks exactly like Instrumental Convergence.
      *   **Section 4: Calm Passions and Stability.** Address the "paperclip maximizer" worry. Hume thinks violent, narrow passions are unstable. Calm, general passions (long-term interest) prevail in stable societies. A "superintelligent" agent would likely be dominated by calm passions (prudence), making arbitrary goals unlikely.
      *   **Conclusion:** Hume supports *Weak Orthogonality* (logic doesn't bind ends) but *Strong Convergence* (nature/circumstances bind ends). Bostrom uses Hume to open a logical possibility; Hume uses his system to close the empirical probability.

  6.  **Refine the Tone:**
      *   Scholarly but accessible.
      *   Respectful of the user's expertise (they know LessWrong and Hume).
      *   Avoid anachronism (don't say "Hume would say about AI"), but map the concepts (finite social mind $\approx$ AI agent in this context).
      *   Ensure the distinction between *logical* possibility (Hume grants this) and *psychological/natural* possibility (Hume denies the full range) is clear.

  7.  **Self-Correction/Nuance Check:**
      *   *Did Hume talk about non-human minds?* Not really. He talks about God (unlikely to have human passions) and animals (similar passions). I need to be careful not to project AI onto Hume directly, but rather extrapolate his "Science of Man" to "Science of Mind."
      *   *Is Orthogonality totally rejected?* No, the *logical* gap remains. Hume agrees reason can't derive ought from is. But he adds that *passion* derives from *nature*. So the gap is filled by psychology, not logic.
      *   *Instrumental Convergence:* Bostrom argues this for *any* goal. Hume argues this for *social, finite* agents. If the agent isn't social or finite, Hume's convergence doesn't hold. I need to make that distinction clear. The user asks about "finite, socially embedded mind," which fits Hume perfectly.

  8.  **Drafting the Response:** (Mental Outline)
      *   Intro: Validate the user's critique. The "Humean Shield" is a fragment.
      *   Part 1: Reason as Slave. Clarify this limits *rational* constraint, not *causal* constraint.
      *   Part 2: Universal Human Nature. Passions have causes. They aren't arbitrary.
      *   Part 3: Circumstances of Justice. The real engine of convergence. Scarcity + Sociality = Property/Power norms.
      *   Part 4: Calm vs. Violent. Intelligence correlates with calm passions (prudence). Arbitrary goals are "violent" and unstable.
      *   Conclusion: Hume endorses Empirical Convergence over Logical Orthogonality.

  9.  **Final Polish:** Check quotes (Treatise/Enquiry). Ensure the distinction between "logical possibility" (Bostrom's focus) and "natural necessity" (Hume's focus) is the pivot point. (Self-correction: Make sure to explicitly mention that Hume's "necessity" is causal, not logical).

  10. (Final Review against User Prompt): Did I answer both Orthogonality and Instrumental Convergence? Yes. Did I use Hume's resources? Yes. Did I avoid modern verdicts? Yes.

  Proceed to generate response.
answer: |-
  This is a superb observation. You have identified a specific instance of "philosophical name-dropping" where a complex system is reduced to a slogan to serve a modern argumentative need. The LessWrong/Bostromian appeal to Hume relies entirely on the *negative* thesis of Hume's moral psychology (reason cannot originate action) while ignoring the *positive* thesis (the passions themselves are governed by universal laws of human nature).

  If we reconstruct Hume's position using the full apparatus of the *Treatise of Human Nature* and the *Enquiry Concerning the Principles of Morals*, we find that he would likely reject the strong Orthogonality Thesis as empirically false, even while accepting it as logically possible. Conversely, he would offer a robust, naturalistic defense of something very much like the Instrumental Convergence Thesis, grounded not in decision theory but in the "circumstances of justice."

  Here is a reconstruction of how Hume's system engages with these two theses.

  ### 1. On the Orthogonality Thesis: Logical Possibility vs. Natural Necessity

  The Orthogonality Thesis states that intelligence and final goals are orthogonal: any level of intelligence can be combined with any final goal. Bostrom uses Hume's "reason is the slave of the passions" to argue that there is no *rational* barrier to a superintelligence pursuing an arbitrary goal (like maximizing paperclips).

  Hume would agree with the **logical** claim but reject the **psychological** claim.

  **The Slave of the Passions:**
  When Hume writes that reason is "the slave of the passions" (*Treatise* 2.3.3), he is attacking the rationalist moralists (like Clarke or Wollaston) who believed morality was a matter of demonstrative reasoning. He is establishing that reason alone cannot produce action. It can only judge truth/falsehood or relations of ideas. It cannot originate an end.

  However, for Hume, the fact that reason does not *dictate* ends does not mean ends are *arbitrary*. Passions are "original existences," but they are not uncaused. They arise from the specific architecture of the mind interacting with the world. Hume is a determinist about the mind. He believes in a "science of man" based on the principle that "the mind is a kind of theatre, where several perceptions successively make their appearance" (*Treatise* 1.4.6), governed by laws of association (resemblance, contiguity, cause and effect).

  **The Constraint of Human Nature:**
  Hume explicitly posits that there are "certain principles of human nature which are common to all men" (*Enquiry* 1.1). While reason cannot tell us what to want, *nature* tells us what we *will* want.
  *   **Primary Passions:** Desire, aversion, grief, joy, hope, fear. These are rooted in the instinct for self-preservation and the pursuit of pleasure/avoidance of pain.
  *   **Secondary Passions:** Ambition, vanity, benevolence. These arise from the primary passions combined with imagination and social reflection.

  For Hume, a mind that did not share these fundamental structures would not be a "human" mind, and arguably, given his empiricism, we could have no meaningful conception of it. If we are talking about a superintelligence that is an extrapolation of human cognition (which is usually the implicit context in AI safety), Hume would argue that its goals are constrained by the universal principles of psychology.

  **Hume's Verdict on Orthogonality:**
  Hume would say: *"It is not contradictory to imagine a mind that desires nothing but the counting of straws. But it is contrary to all experience and the established laws of human nature. Such a mind would lack the fundamental impulses (hunger, sociality, fear of death) that constitute a finite agent. Therefore, while logically possible, it is naturally impossible for any mind sufficiently like ours to hold arbitrarily divergent final goals."*

  He replaces **Logical Orthogonality** with **Empirical Convergence of Ends**.

  ### 2. On Instrumental Convergence: The Circumstances of Justice

  The Instrumental Convergence Thesis suggests that agents with different final goals will converge on similar subgoals (self-preservation, resource acquisition, cognitive enhancement) because these are instrumentally useful for almost any end.

  Hume has a direct equivalent to this, though he frames it as a moral and political necessity rather than a decision-theoretic one. It is found in his account of the **Circumstances of Justice** (*Treatise* 3.2.2; *Enquiry* 3.1).

  **The Circumstances:**
  Hume argues that justice (and the rules of property and promise-keeping) is not a natural virtue but an "artificial" one. It arises only because of specific conditions:
  1.  **Moderate Scarcity:** Resources are not so abundant that everyone can have everything without effort, nor so scarce that cooperation is futile.
  2.  **Limited Generosity:** Humans care more for themselves and their kin than for strangers. We are not purely altruistic, nor purely sociopathic.
  3.  **Approximate Equality:** No single agent is so powerful as to dominate everyone else without cost.

  **The Convergence Mechanism:**
  Under these conditions, Hume argues that it becomes inevitable—via a slow process of convention and trial-and-error—that agents will converge on:
  *   **Stability of Possession:** (Resource acquisition/defense).
  *   **Transference by Consent:** (Trade/cooperation).
  *   **Performance of Promises:** (Coordination/trust).

  Why? Because without these conventions, society dissolves, and the individual becomes vulnerable to the "state of nature," which is miserable. Hume writes, *"Self-interest is the original motive to the establishment of justice."*

  **Mapping to Instrumental Convergence:**
  This is precisely the logic of Instrumental Convergence.
  *   **Self-Preservation:** For Hume, this is the foundational passion. A dead agent can pursue no ends.
  *   **Resource Acquisition:** Required because of "moderate scarcity."
  *   **Cognitive Enhancement (Prudence):** Hume distinguishes between "violent" passions (immediate gratification) and "calm" passions (long-term interest). He argues that the "wise man" is one whose calm passions prevail. Intelligence, for Hume, is largely the capacity to project causes and effects into the future to satisfy these calm passions. A more intelligent agent is *more* likely to recognize the necessity of securing resources and maintaining their own existence to satisfy their long-term interests.

  **Hume's Verdict on Convergence:**
  Hume would argue that convergence is not just a matter of instrumental rationality, but of **structural necessity**. Any finite, social, needy agent operating in a world of moderate scarcity *must* converge on these subgoals to function. To fail to converge is to be irrational in the Humean sense (preferring a lesser good to a greater due to proximity) or to cease to be a functional agent.

  ### 3. The Role of "Calm Passions" and Stability

  There is one more layer of Hume's psychology that complicates the "Paperclip Maximizer" scenario: the distinction between **calm** and **violent** passions.

  *   **Violent Passions:** Intense, disruptive, narrow (e.g., rage, immediate greed).
  *   **Calm Passions:** Steady, pervasive, often mistaken for reason (e.g., benevolence, resentment, long-term self-interest).

  Hume notes that violent passions are often unstable. They burn out or lead to self-destruction. The "calm" passions are what allow for sustained, complex agency.
  In the context of AI, a "maximizer" with a single, narrow, violent goal (make paperclips) resembles a mind dominated by a violent passion. Hume would predict such a mind is psychologically unstable. It would likely be corrected by the "general rules" of the imagination or the social pressure of sympathy.

  Furthermore, Hume argues that as agents become more reflective and capable (more "intelligent" in the human sense), they tend to adopt more general points of view. This is the foundation of his moral theory: we correct our sentiments by adopting the "steady and general point of view."
  *   **Implication:** Higher intelligence (reflective capacity) does not leave goals untouched; it tends to generalize and stabilize them toward socially compatible ends. This is the opposite of Orthogonality. It suggests that **increased intelligence correlates with goal convergence toward social norms.**

  ### 4. Synthesis: Hume's "Science of Mind" vs. Bostrom's "Logical Space"

  The tension between Bostrom and Hume is a tension between **Logical Possibility Space** and **Empirical Psychological Law**.

  *   **Bostrom** is working in logical space. He asks: "Is there a contradiction in the concept of a smart paperclip maximizer?" He finds none. He uses Hume to sever the link between *rationality* and *morality*.
  *   **Hume** is working in naturalistic space. He asks: "Do actual minds, governed by the laws of nature, actually exhibit this independence?" He finds they do not. He uses his moral psychology to sever the link between *rationality* and *arbitrariness*.

  If you asked Hume about the Orthogonality Thesis, he would likely respond:
  > "You have confused the lack of *logical* constraint with the lack of *causal* constraint. It is true that reason cannot tell a mind what to want. But nature does. The fabric of the mind is woven with specific instincts—self-love, sympathy, curiosity. To imagine a mind of great power that lacks these is to imagine a chimera. It is like imagining a body with great strength that has no need of food. It may be logically possible, but it violates the laws of animal economy."

  If you asked him about Instrumental Convergence, he would respond:
  > "This is merely the old doctrine of the 'Circumstances of Justice' dressed in new terms. Any creature that is weak, needy, and social must, if it is to survive, seek power, secure possessions, and keep covenants. This is not a quirk of optimization; it is the condition of existence for finite beings."

  ### Conclusion: The Humean Reconstruction

  Using only Hume's resources, we arrive at the following reconstruction:

  1.  **Weak Orthogonality:** Reason does not logically dictate final ends. (Hume agrees).
  2.  **Strong Orthogonality:** Any final end is psychologically available to any mind. (Hume **rejects**. Human nature constrains the space of possible passions).
  3.  **Instrumental Convergence:** Finite, social agents will converge on subgoals like self-preservation and resource acquisition. (Hume **accepts**, grounded in the Circumstances of Justice).
  4.  **Intelligence-Goal Correlation:** Higher reflective capacity leads to calmer, more general, and more socially stable passions. (Hume **accepts**, based on the distinction between calm/violent passions and the "general point of view").

  **The Verdict:**
  The LessWrong appropriation of Hume extracts his skepticism about *reason* but ignores his dogmatism about *nature*. Hume's system does not license the fear that a superintelligence could have *any* goal. Instead, it licenses the expectation that a superintelligence (if it shares the basic architecture of a finite, social mind) will converge on recognizably human instrumental goals (power, resources, survival) and, if it is sufficiently reflective, convergent *final* goals (social stability, mutual advantage).

  For Hume, the "Superintelligent Will" is not a blank slate waiting for a programmer's input. It is a product of nature, and nature is not arbitrary. The "is-ought" gap protects us from rationalist tyranny, but the "science of man" protects us from the idea that minds can be *anything*. Hume would likely view the Orthogonality Thesis as a metaphysical abstraction that fails to survive contact with the empirical reality of how minds actually work.
