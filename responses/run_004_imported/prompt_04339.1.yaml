answer: |-
  **Setting:** *A sterile white chamber. In the center stands the Teletransporter booth—a glass cylinder surrounded by humming rings of machinery. A digital display counts down. Alex stands inside the booth, hand on the control panel. Jamie stands outside, arms crossed, looking pale.*

  **Jamie:** You're actually going to do it.

  **Alex:** It's a Tuesday commute, Jamie. London to Mars in a blink. No jet lag, no radiation, no ticket price.

  **Jamie:** It's disassembly. The manual says it scans every atom, records the state, and then… *vaporizes* the input to conserve energy. Then it prints a copy at the destination.

  **Alex:** "Vaporizes" is dramatic. It converts mass to energy to power the transmission. But yes, the Earth-body ceases to function.

  **Jamie:** It ceases to function because you're destroying it. Look, we argued about *The Prestige* for two hours. Angier wasn't traveling. He was drowning a clone every night and paying a fortune to be the guy in the balcony. You're proposing to drown yourself every morning.

  **Alex:** That's the Williams view, isn't it? The body is the anchor. But you're fetishizing the hardware. I am not my atoms. I'm the pattern. The memories, the intentions, the character traits. Parfit called it Relation R. Psychological continuity and connectedness. That's what matters in survival.

  **Jamie:** "What matters" isn't the same as "what I am." If I stand here and shoot you, then immediately hire an actor to walk out of the booth on Mars wearing your clothes and reciting your memories, Relation R holds. The Mars-man thinks he's Alex. He has your memories. But *you* are dead.

  **Alex:** But suppose we don't hire an actor. Suppose the Mars-man is causally connected to you. The scan causes his existence. He wakes up thinking, "I just stepped in." From the inside, it's indistinguishable from ordinary survival.

  **Jamie:** From *whose* inside?

  **Alex:** From his!

  **Jamie:** Exactly. *His*. Not yours. There's a subject of experience standing in this booth right now. Let's call him Alex-Earth. When that scanner fires, Alex-Earth's stream of consciousness terminates. Full stop. A new stream, Alex-Mars, begins three minutes later. You're asking me to believe that because the second stream *looks* like the first, the first didn't end.

  **Alex:** You're assuming identity is a deep, further fact. Like a soul-string tying the moments together. Parfit's point is that there is no string. There's just the overlapping relations. Think about sleep. You go under, consciousness stops. You wake up. You assume you're the same person. But if a demon swapped you for a duplicate while you were unconscious, and the duplicate had all your memories of going to bed… how would you know?

  **Jamie:** I wouldn't know. But *I* wouldn't be there to know. That's the horror. Look, let's try a different angle. Imagine I tell you that tomorrow, after you step out on Mars, you will be tortured. Severe pain. But, before the torture, we wipe your memory of stepping into the machine. You'll just remember being in this lab, then suddenly pain. Do you fear that pain?

  **Alex:** …Yes. Obviously.

  **Jamie:** Why? If identity is just psychological continuity, and we're going to interrupt that continuity with amnesia, why fear it?

  **Alex:** Because the psychological continuity *will* resume. After the torture, the memories will knit back together. The victim will be psychologically connected to me now.

  **Jamie:** Okay. Now imagine I tell you: We won't torture you. We will torture the *copy* on Mars. But before we do, we wipe *your* memory of this conversation. You, in the booth, will never know about the torture. You'll just step in, wake up on Mars, and then… pain. Do you fear it?

  **Alex:** This is Williams's torture case.

  **Jamie:** It's my intuition pump. If you say "yes, I fear it," you're admitting that what triggers your fear is the anticipation of *this* body's future states, not just the abstract flow of data. If you say "no, I don't fear it," you're lying about your own instincts.

  **Alex:** *(Pauses, looks at the humming rings)* I'll concede the instinct. The fear is visceral. It's tied to the body. But instincts can be irrational. Just because I fear the pain doesn't mean the fear is tracking a metaphysical truth about identity. It tracks the fact that my brain is wired to protect its own organism. But rationally? If the Mars-man has my projects, my love for my family, my unfinished work… then *I* survive in the only way that makes sense.

  **Jamie:** But consider the Branch Line.

  **Alex:** Ah. The malfunction.

  **Jamie:** Suppose the scanner works, the Mars-man is created… but the Earth-destroyer fails. You step out of the booth here. You're alive. But the doctors tell you, "Sorry, the scan radiation was fatal. You have a week to live." Meanwhile, Alex-Mars is living his life. Now, Alex-Earth, do you feel comforted?

  **Alex:** No. I feel terrified. I'm dying.

  **Jamie:** But Alex-Mars has Relation R. He has your psychology. If that's what matters, you should be happy. "I will live on as him."

  **Alex:** I am happy *for* him. But I know I am not *him*.

  **Jamie:** Exactly! In that moment, the distinction between "survival" and "identity" collapses. You realize that *you*—the one standing there bleeding out—won't experience his Tuesday mornings. You won't taste his coffee.

  **Alex:** Wait. That's where you're missing the nuance. Parfit says this realization should make me *less* afraid of death, not more. In the Branch Line case, I realize that "being" Alex-Mars isn't what matters. What matters is that *someone* carries the torch. If I accept that identity isn't what matters, then my impending death here is less significant. The boundary between me and him is like the boundary between me tonight and me tomorrow morning. Less deep than we think.

  **Jamie:** That's a beautiful sentiment, Alex, really. "Don't fear death, just ensure your R-continuity." But it doesn't work on the first-person perspective. You can't inhabit the future of another body, even if it's a perfect copy.

  **Alex:** Let's push the body then. You think the body is the anchor? The Combined Spectrum. Suppose we replace your brain cells one by one with synthetic equivalents that function identically. At what percentage of replacement do *you* cease to exist?

  **Jamie:** I don't cease to exist. The organism persists. It's a continuous process.

  **Alex:** Is it? If I replace them all over ten years, are you the same person?

  **Jamie:** Yes. Biological continuity.

  **Alex:** Now, suppose I do it instantly. I scan you, build a synthetic body with your exact brain state, and destroy the organic one. Why is the speed of replacement the difference between life and death?

  **Jamie:** Because causality matters. In the slow replacement, each state causes the next in a continuous physical chain. In the machine, you break the chain. You're relying on information, not causation. It's like burning a book and printing a new one from the PDF. It's the same text, but it's not the *same book*.

  **Alex:** But the "book" is the only thing we can read! The paper is irrelevant.

  **Jamie:** The paper is *me*.

  *(Silence hums between them. The countdown on the panel ticks down: 05:00.)*

  **Alex:** *(Softly)* I have to admit something. When you described the Branch Line… the idea of staying here and dying while "I" live there… it felt like a betrayal. Like I'd be left behind.

  **Jamie:** Good. That's the truth talking.

  **Alex:** But… I also have to ask you this. If you had a terminal illness, and the only way to save your daughter's memory of you was to upload your mind to a server that could talk to her, love her, advise her… would you refuse? Because the server isn't *your body*?

  **Jamie:** *(Hesitates)* I… I want to say yes. I'd want to be there. But if the upload could do everything I could do…

  **Alex:** Then the body isn't the only thing that matters. You care about the impact, the connections. That's Relation R.

  **Jamie:** I care about *my* connections. Not copies of them. *(Looks at Alex)* You know, Parfit says realizing identity doesn't matter should make you less selfish. Less concerned with your own boundaries.

  **Alex:** It does. It makes death less scary.

  **Jamie:** Or it makes you willing to sacrifice the subject for the pattern. *(Steps closer to the glass)* Look, I'll concede this: If I step in there, and I wake up on Mars… I won't know the difference. From the inside, it works. I'll drink my coffee, I'll call my wife. I'll feel like I survived.

  **Alex:** Then what's the problem?

  **Jamie:** The problem is the guy who doesn't wake up. The guy in the booth. He gets nothing. He's the cost of the trick. And you're asking him to volunteer.

  **Alex:** *(Touches the glass)* I am volunteering.

  **Jamie:** I know. That's what unsettles me. You've convinced yourself that the guy in the booth doesn't matter as much as the pattern. And logically… I can't find the flaw in the Branch Line argument. If the copy is perfect, "identity" does seem like an empty word. But my gut… *(puts hand on own chest)* …my gut screams that when the lights go out for you, *you* are gone. And no amount of "Relation R" brings you back.

  **Alex:** Maybe we're both right. Maybe identity is empty, like Parfit says, but the *fear* is real, like Williams says. Maybe the tragedy isn't that I die, but that I *feel* like I die, even if I don't.

  **Jamie:** That's a hell of a price for a commute.

  **Alex:** *(Turns to the control panel)* Maybe. But the show must go on. The Prestige, right?

  **Jamie:** *(Whispering)* Don't let the water tank be locked this time, Alex.

  **Alex:** *(Smiles, a bit tightly)* See you on Mars.

  *(Alex presses the button. The rings begin to spin, a rising whine filling the room. Jamie doesn't look away. He watches Alex's face, waiting for the moment the light hits, searching for a flicker of doubt, or perhaps, a flicker of the man who is about to cease to be. The light flares. Alex is gone. The booth is empty. On the screen: TRANSFER COMPLETE.)*

  *(Jamie stands alone in the silence. He touches his own chest, breathing deeply, as if to check that he is still there. He looks at the empty booth, then at the door leading to Mars. He does not move.)*
