          **Marcus:** But that's psychologically revisionist. If I admire him to save my family, I'm responding to a normative pressure. It is a reason to admire, just the wrong *kind*. Parfit's distinction handles this: it's a state-given reason (benefits of having the attitude), not an object-given reason (properties of the demon).

