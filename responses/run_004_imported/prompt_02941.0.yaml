      *   **Elena:** Admiration isn't voluntary. You can't admire on command. Therefore, the threat gives a reason to *try* to admire, not a reason that counts in favor of the attitude's correctness. FA analysis defines value via reasons for the attitude *itself*.
      *   **Marcus:** But phenomenologically, it feels like a reason. If we say it's not a reason to admire, we ignore the normative pressure. The distinction should be about the *source* of the reason (object properties vs. state consequences), not whether it's a reason at all. Parfit's state-given vs. object-given.
