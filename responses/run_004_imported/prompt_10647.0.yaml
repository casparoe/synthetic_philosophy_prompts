answer: |-
  Good evening, everyone. For those of you who don't know me, I'm a friend of Owen's from grad school. And for those of you who noticed the tension at the dessert table last night: yes, that was a philosophical argument. No, it wasn't about the cake. It was about Immanuel Kant.

  Specifically, we were arguing about Owen's dissertation. Which feels appropriate, because Owen has spent the last five years analyzing whether an action has "moral worth" only if it's done from duty, rather than from love or desire. And Mira, you have sat through more rants about Kant's "warm-hearted philanthropist" than any human being should have to. For the uninitiated: Kant says if you help someone because you enjoy it, you get no moral credit. You have to help them because it's the *rule*.

  So, I started thinking about that while preparing this toast. And I have some concerning news for the couple. On a strict Kantian reading, this marriage is in trouble.

  Why? Because looking at the two of you, it is painfully obvious that you do things for each other out of *inclination*. Owen, you bring Mira coffee not because you've calculated it is your categorical imperative, but because you like seeing her smile. Mira, you support Owen through his writing not out of cold obligation, but because you believe in him. Kant would look at this romance and say, "Technically, this has zero moral worth." You're just doing what you want. Where is the struggle? Where is the grim duty?

  And this is where the philosopher Bernard Williams would step in and say, "Thank goodness." Williams argued that if a man saves his wife from drowning, and he pauses to think, "Is it my duty to save her?" he has had "one thought too many." You shouldn't need a rulebook to love your spouse. If Owen loved Mira purely out of duty, he wouldn't be a saint; he'd be a robot. And Mira deserves better than a robot.

  So, we have a puzzle. If love is just inclination, Kant says it's shallow. If love is just duty, Williams says it's cold.

  But I think Owen's own research—and this marriage—offers the solution. It comes from the philosopher Barbara Herman. She argued that duty doesn't need to be the *motive* that pushes you forward; it just needs to be the *limiting condition* in the background. Think of it like the guardrails on a bridge. You drive across because you want to get to the other side—that's inclination, that's love. But the guardrails are there to hold you if the road gets icy. That's duty.

  For the first few years, maybe you won't need the guardrails. You'll cross the bridge because the drive is beautiful. You'll make sacrifices for each other because it brings you joy. Kant might say that lacks moral worth, but I say that's the honeymoon phase, and I hope it lasts a lifetime.

  But we all know marriage is long. There will be days when the inclination isn't there. Days when Owen is grumpy about his data, or Mira is exhausted, and the "warm-hearted" feeling is buried under stress and fatigue. On those days, you won't help each other because it's fun. You'll help each other because you made a vow. Because you said "I will."

  That is where the Kantian duty saves the day. Not as the engine of the car, but as the safety belt. It ensures that when the inclination fades temporarily, the commitment remains. It means your love isn't just a feeling that happens to you; it's a structure you build for each other.

  So, Owen and Mira, my hope for you is this: May you almost always act from inclination. May you always *want* to be there for each other. May Kant be wrong about your moral worth every single day because you are so naturally, joyfully devoted.

  But on the hard days, when the inclination is hard to find, may you have the strength to act from duty. Not because you're cold, but because your love is sturdy enough to carry the weight of an obligation. May you have a love that doesn't need to think about duty to function, but is strong enough to honor it when it counts.

  To Owen and Mira: May your inclinations be warm, and your duties be light, but your commitment be absolute.

  To the happy couple.
