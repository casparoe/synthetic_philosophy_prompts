answer: |-
  Thank you all for being here.

  Looking out at this room, I see the two worlds my uncle inhabited, seated in distinct rows. In the front, the men who walked through the jungle with him. In the back, the minds who walked through arguments with him. And in the middle, the family who simply loved him.

  My task is to speak for the man who stood at the intersection of those groups. That was never a comfortable place to stand, but he stood there for forty years.

  We know him as a philosopher of war. But before he was a philosopher, he was a soldier. He went to Vietnam as a young infantry officer, saw things that cannot be unseen, and came home carrying a weight that most of us cannot imagine. For decades, he managed that weight with what he called the "boring, decent" view. He found comfort in Michael Walzer's idea of the moral equality of combatants: that a soldier who fights by the rules is morally equal to his enemy, regardless of the cause.

  For a long time, this wasn't just theory for him. It was survival. It was the handshake he offered his friends in the front row. It said: *We did our duty. We are blameless.* And for thirty years, he believed that was enough.

  But my uncle was, fundamentally, a truth-teller. And in the last decade of his life, his honesty outgrew his comfort. He began to argue that legal equality is a necessary fiction, but not a moral truth. He came to believe that justice matters, that the cause matters, and that the moral standing of a combatant is not shielded entirely by uniform or order.

  I know some of you worry that this shift was a repudiation of his past. I am here to tell you it was not. It was an act of deepening integrity. He did not move to the "revisionist" view because he lost respect for the soldier. He moved because he gained a terrifying respect for the act of killing itself. He decided that war was too grave a matter to be settled by comforting fictions, even the ones that had protected his own peace of mind.

  He never wrote down what this meant for his own service in Vietnam. He left that page blank. Some might call that an inconsistency. I call it humility. He was willing to question the moral structure of war, but he refused to presume he had the final judgment on the hearts of the men who fought it. He held the tension between the truth he discovered and the friends he loved, and he bore that tension without letting it break him or divide this room.

  To his students, who are finishing the work he started: He trusted you with the hard questions because he knew you wouldn't flinch from the answers.
  To his comrades: He never judged you. He judged the war. And he loved you enough to sit in the front pew with you, wearing the same jacket he wore in the highlands, until the very end.

  He spent a lifetime trying to make sense of violence, first by leveling the ground between enemies, and later by mapping the moral slopes we slide down when we send young people to kill. He didn't finish the map. But he showed us how to read it.

  For his family, he was not the theorist of liability or the defender of *jus in bello*. He was the uncle who listened more than he spoke, who poured the wine, who remembered birthdays, and who taught us that changing your mind is not a weakness, but a form of courage.

  We are left with the unfinished volume, the unanswered questions, and the silence where his voice used to be. But we are also left with his example: that it is possible to examine the darkest parts of human nature without losing your own humanity.

  Rest now, Uncle. The argument is over. The burden is laid down.

  Thank you.
