  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Deceased uncle, moral philosopher, 78 years old.
      *   **Background:** Vietnam infantry officer (two tours), then philosopher specializing in ethics of war.
