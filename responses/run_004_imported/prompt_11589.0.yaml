      *   **Unresolved Tension:** He never publicly reconciled his later view with his own Vietnam service. Two PhD students are working on this extension but haven't finished.
      *   **Audience:**
          *   Front pews: Army buddies (believe honorable fighting = blameless).
          *   Middle/Back: Colleagues & Students (know his later revisionist stance).
          *   Family: Need comfort/warmth.
      *   **Constraint:** ~5 minutes speaking time (approx. 750-850 words).
      *   **Goal:** Honest about his intellectual journey, warm for family/vets, precise enough for philosophers (no platitudes that contradict his work).

  2.  **Determine the Core Message/Theme:**
      *   The tension is between *legal/institutional equality* and *moral truth*.
      *   The tension is between *his youth (soldier)* and *his maturity (philosopher)*.
      *   The resolution shouldn't be "he changed his mind so he was wrong before." It should be about *integrity* and the *burden of questioning*.
      *   Key insight: His shift wasn't a betrayal of his fellow soldiers, but an act of deep respect for the gravity of killing. He took the moral weight seriously enough to question the comforting fictions.
      *   Bridge: The "boring, decent" view provided peace for a long time. The later view provided truth, even if it was harder. Both stem from a desire to make sense of violence.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the diverse crowd. Set the tone (respectful, intellectual but human). Mention his dual identity (soldier/scholar).
      *   **The Early Years (Vietnam & Walzer):** Acknowledge his service. Validate the "moral equality" view without endorsing it as the final truth. It was a survival mechanism and a professional starting point. It allowed him to look his buddies in the eye.
      *   **The Intellectual Shift (The McMahan Turn):** Address the change. Don't hide it. Frame it as intellectual courage. He didn't stop loving his comrades; he started loving the truth more.
      *   **The Unresolved Question (His Service):** This is the minefield. Don't say "he thought he was immoral." Don't say "he thought he was perfect." Say that he held the tension. He lived the question. The unfinished work is a testament to his honesty.
      *   **Closing:** Bring it back to the human being. The philosopher died, the man remains. Comfort the family and friends.

  4.  **Refining the Tone (The "Wince Test"):**
      *   *Risk:* Saying "all soldiers are equal" will make the students wince.
      *   *Fix:* Quote his earlier view as what he *held*, not necessarily eternal truth. Use phrases like "institutional fiction" (his term) carefully.
      *   *Risk:* Saying "justice determines liability" will make the vets feel judged/criminal.
      *   *Fix:* Frame the later view as a philosophical inquiry into the *nature* of war, not a indictment of specific individuals. Emphasize that he never applied the harshness of the theory to his friends personally.
      *   *Risk:* Ignoring the Vietnam service.
      *   *Fix:* Make it central. It's the source of his authority.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hello everyone. Uncle Bob was a soldier and a thinker. He used to think soldiers were equal. Then he thought maybe they weren't. He didn't finish his book. But he was a good man. Love you all.
      *Critique:* Too blunt. Hurts the vets. Boring for the philosophers.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      Bob served in Vietnam. He came back and studied war. He liked Walzer's idea that soldiers are just tools. It helped him sleep. Later, he read McMahan and thought, wait, does cause matter? Yes. He didn't say what that meant for him. But he was honest. We miss him.
      *Critique:* Better, but needs more grace. The transition needs to feel like growth, not contradiction.

  7.  **Drafting - Iteration 3 (Polishing for the Prompt):**
      *   *Opening:* Welcome the "two armies" in the room (vets and academics).
      *   *Middle:* The concept of "burden." The first view lifted the burden. The second view accepted it.
      *   *The Pivot:* He didn't change because he hated his past, but because he respected the moral reality too much to simplify it.
      *   *The Unfinished Work:* The students know the argument. The vets know the man. The man contains the argument.
      *   *Ending:* Rest in peace.

  8.  **Writing the Eulogy (incorporating specific phrases from prompt):**
      *   Use "boring, decent."
