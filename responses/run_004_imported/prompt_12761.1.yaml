answer: |-
  A physicist, a presumptuous philosopher, and a retired geologist are standing in front of the "Cosmos Collider" at 3:00 AM, waiting to run the decisive experiment. The test will determine whether we live in Theory 1 (a "Small" universe with 1 billion observers) or Theory 2 (a "Big" universe with 1 trillion observers).

  The philosopher steps forward and puts a hand on the switch. "Don't bother flipping it. I've applied the Self-Indication Assumption. The fact that I exist at all makes Theory 2 a trillion times more likely than Theory 1. The experiment is redundant. Just write the grant money out to me."

  The geologist spits on the floor. "Don't listen to him. I'm using the Self-Sampling Assumption. We're human birth-rank number 100 billion. If Theory 2 were true, we'd be in the first 0.01% of all observers. That's a statistical fluke. It's far more likely Theory 1 is true, which means the total population is small and humanity goes extinct soon. Doomsday's next Tuesday."

  The physicist looks at the switch, then at the bill for the electricity sitting on the console. "So, the philosopher says I already know the answer, and the geologist says I won't be around to care. Should I even run the test?"

  The geologist lights a cigarette. "Flip the switch."

  "Why?"

  "Because if the philosopher is right, there's a trillion other versions of you running this test right now, so who cares about this one? And if I'm right, the power company won't be around next month to collect the bill."
