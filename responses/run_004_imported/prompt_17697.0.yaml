answer: |-
  Here are nine sequenced interview questions with follow-ups, designed to progressively constrain the "dung-heap" defense. They move from the classification of astrological tools to the metaphysics of the aspect, then to the motivation for the reform, and finally to the coherence of Kepler's broader physics.

  **1. The Arbitrary vs. The Natural**
  **Question:** Herr Kepler, in *Tertius Interveniens*, you argue that the zodiac signs and the houses are merely "human bookkeeping," arbitrary divisions imposed on the sky by ancient shepherds, whereas the aspects are natural. But both are methods of slicing the celestial sphere. If the zodiac is a human fiction because it lacks a physical basis in the stars themselves, what physical feature of the planets generates the aspects that the zodiac lacks?
  **Follow-up:** If you answer that the aspects are grounded in geometry while the signs are not: Does geometry exist in the void between planets, or only in the mind that measures it? If the latter, how is a geometric relation less "human" than a zodiacal sign?

  **2. The Ontology of the Aspect**
  **Question:** You have compared traditional astrology to a dung-heap where a hen scratches up a pearl—the pearl being the aspect. But a pearl is a physical object; an aspect is an angle. In *Harmonices Mundi*, you suggest the aspect is not a physical reality like light, but a "configurational relation." If the aspect has no physical substance, how does it exert any purchase on the sublunary world to warrant keeping it in a science of nature?
  **Follow-up:** If you claim it acts through the soul's perception of harmony: Does this not merely relocate the occult quality from the planetary rays into the human soul? How is a soul magically triggered by a geometric angle less "superstitious" than a star magically sending a ray?

  **3. The Mechanism of Perception**
  **Question:** Let's press on that mechanism. You argue the *anima mundi* or the human soul perceives these aspects much like the ear perceives musical consonance. But musical consonance requires a medium (air) and a physical vibration. What is the medium for the aspect? If there is no physical species traveling from the planets to the soul, on what channel does this "perception" travel?
  **Follow-up:** If you insist it is a non-physical, immediate recognition of divine archetypes: Does this not render the aspect independent of the planets entirely? If the soul perceives the harmony regardless of the matter, why do we need the planets at all?

  **4. Constructibility and the Quintile**
  **Question:** In Book IV of the *Harmonices*, you introduce new aspects, like the quintile, based solely on whether the corresponding polygon is constructible by compass and straightedge. Why should the limitations of a Euclidean construction on a piece of paper be diagnostic of a causal power in the heavens? Why does the ability to draw a shape dictate the ability of a planet to influence the earth?
  **Follow-up:** If you argue that constructibility marks a distinction in the mind of God: How do you access that divine mind to verify the rule, other than by checking if the astrology works? And if the astrology *doesn't* work consistently, does the geometry still hold, or does the geometry bow to experience?

  **5. Motivation and Mediation**
  **Question:** *Tertius Interveniens* was written explicitly to mediate between the dogmatic astrologer Feselius and the dogmatic skeptic Rosen. You position yourself as the reformer purifying the art. But you were also the Imperial Mathematician, earning a living casting nativities and publishing calendars. Is this purification a principled philosophical stance, or is it a pragmatic survival strategy to keep astrology profitable but defensible against Church and academic criticism?
  **Follow-up:** If you claim it is purely principled: Why does the "purified" astrology still retain enough of the traditional structure (like the seven planets) to remain marketable to patrons like Wallenstein, rather than being reduced to pure astronomy?

  **6. Causality vs. Signification**
  **Question:** You often speak of the aspects as "harmonies." In music, harmony does not *cause* events; it signifies structure. When a hard aspect occurs, do you believe the planets physically *force* an event on earth, or do they merely *signify* that a certain harmony is present which God aligns with earthly events?
  **Follow-up:** If you choose signification (conspiracy of heaven and earth): How is this different from the "sympathetic magic" of the dung-heap you rejected? If the planets don't push, but only signal, what physical work is the "pearl" actually doing?

  **7. The *Astronomia Nova* Conflict**
  **Question:** During these same years, in the *Astronomia Nova*, you are busy assigning a physical *vis motrix* to the Sun, a force that weakens with distance. This is a mechanical, quantitative physics. Your harmonic astrology is qualitative and perceptual. Are you doing one physics or two? Does the soul's perception of aspects interact with the Sun's physical force, or do these two systems run in parallel without touching?
  **Follow-up:** If you claim they are unified: How does a geometric angle (the aspect) modulate a physical force (the *species*)? If you cannot explain the coupling, are you not maintaining a dualism that undermines your claim to have naturalized astrology?

  **8. The Empirical Limit**
  **Question:** You admit that even with the "pearls," predictions often fail. You blame this on the complexity of the chart or the interference of other causes. But if the zodiac is rejected because it is arbitrary, and the aspects are kept because they are natural, shouldn't the natural parts work more reliably than the arbitrary ones? Why is the "pearl" often as dull in practice as the "dung"?
  **Follow-up:** If you argue that experience is fallible but geometry is certain: At what point does the failure of experience force you to discard the geometry? If the dung-heap yields better empirical results than the pearl, do you keep the pearl?

  **9. The Final Boundary**
  **Question:** Ultimately, you are policing the boundary between astronomy and astrology. You keep the aspects because they are geometric, and discard the rest because they are not. But if geometry is the criterion, why stop at aspects? Why not include the distances, the velocities, or the latitudes, which are also geometric? Why is the angle the sole licit "pearl"?
  **Follow-up:** If you cannot give a non-circular reason for why *only* the angle matters: Does this not suggest the "dung-heap" distinction is not a discovery of nature, but a retrospective justification for saving a practice you were unwilling to fully abandon?
