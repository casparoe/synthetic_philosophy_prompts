answer: |-
  The observation deck of the *Aethelgard* was dark, save for the glow of the nav-console and the distant, unblinking smear of the target nebula. Elias sat with his back to the stars, tapping a stylus against a datapad. Mara leaned against the bulkhead, arms crossed, watching him with the patience of a predator waiting for a tripwire to snap.

  "You're doing it again," Mara said.

  "Doing what?"

  "Treating your own existence like a lottery ticket."

  Elias didn't look up. "It's the only data point we have that isn't corrupted by the Archive decay. I'm just applying the Self-Sampling Assumption. Standard procedure."

  "Standard procedure for suicide pacts, maybe," Mara muttered, pushing off the bulkhead to pace. "You're trying to date the voyage based on your birth rank. Generation Forty-Two. You assume you're a 'random sample' of all passengers who will ever live on this ship. So, you conclude there's a 95% chance we're in the middle 95% of the ship's total history. Therefore, the ship won't last much longer than it already has."

  "It's the Doomsday Argument, Mara. It's math."

  "It's numerology wrapped in a reference class!" She stopped in front of him. "You're ignoring the Self-Indication Assumption. The fact that we exist *at all* is evidence. And existence favors hypotheses with more observers."

  Elias finally looked up, rubbing his temples. "Here we go. The Presumptuous Philosopher."

  "It's not presumptuous if it's correct," Mara said, her eyes lighting up. "Imagine two theories about the *Aethelgard*'s construction. Theory A says the life-support systems were designed for ten thousand generations. Theory B says they were designed for ten million. Prior to looking at the engineering specs, you might think they're equally likely."

  "Okay."

  "Now," Mara said, pointing a finger at him. "Apply SSA. Your view. You say, 'I am Generation 42.' Under Theory B, being Gen 42 is incredibly rare. You're in the first fraction of a percent. Under Theory A, you're still early, but less absurdly so. SSA forces you to penalize Theory B heavily just because it implies more people. You're saying the universe is likely *small* because you happened to be born early."

  "I'm saying we should be typical," Elias corrected. "It's unlikely I'm a freak outlier."

  "But SIA corrects for that!" Mara's voice rose, echoing off the curved glass. "SIA says the probability of you existing is proportional to the number of observers in that hypothesis. If Theory B has a thousand times more people, you are a thousand times more likely to exist in Theory B than in Theory A. The fact that you *are* here overwhelms the 'early birth' penalty. SIA lets us look at the engineering specs and say, 'Actually, the big universe is way more likely,' purely because there are more of us to look at it."

  Elias stood up, pacing now. "And that is why your position is dangerous arrogance. You're telling me I can settle cosmological questions from an armchair? If I use SIA, I can prove the ship is infinite. I can prove the Void is teeming with life, simply because if it weren't, I wouldn't be here to ask. It bypasses empirical evidence. It's magic."

  "It's Bayesian updating!" Mara shot back. "You're the one clinging to a principle that guarantees pessimism. Your SSA is a doom machine. If you apply it to humanity back on Earth, it suggests extinction is imminent. If you apply it to the *Aethelgard*, it suggests the life-support fails within the next few centuries. Is that what you want to tell the Captain? 'Don't bother planting the hydroponic trees, statistically we're dead anyway'?"

  Elias stopped. He looked down at his datapad. The projection showed a bell curve, the shaded region of 'likely remaining duration' shrinking as he tweaked the variables.

  "I don't *want* it to be true," Elias said quietly. "But look at the history of the colony ships. *The Icarus* failed at Gen 10. *The Vaunt* at Gen 60. We are Gen 42. If I assume I am a random observer from the set of all humans who ever travel the Void..."

  "You see?" Mara stepped closer, her voice softening but losing none of its edge. "That's the trap. You're defining the reference class as 'humans on colony ships.' If you define it as 'conscious entities,' the numbers shift. If you define it as 'observers in a multiverse,' they shift again. You can tune the Doomsday Argument to say anything just by drawing the circle around the data differently."

  "At least my circle acknowledges risk," Elias said. "Your circle assumes that because we are here, we must be in the biggest possible party. What if the party is small, Mara? What if this is it? What if there are only five thousand generations total? SIA would tell me I'm crazy to think that, just because a bigger number feels more 'probable' for an observer to inhabit."

  "SIA doesn't say the bigger number *is* true," Mara corrected. "It says the evidence of our existence *weights* the bigger number. If the engineering specs say the reactor dies in Gen 5000, SIA accepts that. But if the specs are ambiguous... if there's a 50/50 chance the reactor lasts for 5,000 years or 5,000,000 years... SSA says 'Bet on 5,000.' SIA says 'Bet on 5,000,000.'"

  "Because there's more people to bet with," Elias said, disgusted.

  "Because there's more people to *be*," Mara countered. "Think about the Presumptuous Philosopher thought experiment. Two theories of physics. Theory 1 says the universe is finite. Theory 2 says it's infinite. A philosopher using SSA says, 'I can't distinguish them.' A philosopher using SIA says, 'Theory 2 is infinitely more likely because it contains infinitely more observers like me.' It allows us to rule out empty universes from the comfort of our chairs."

  "It allows us to ignore reality!" Elias slammed his hand on the console. "If I walk outside and see a wall, SIA shouldn't let me say, 'Walls are unlikely because they block observers.' But that's where your logic leads. You prioritize *population* over *physics*."

  "I prioritize the data point of *experience*," Mara said. "You prioritize the data point of *index*. You care about the number on my back. I care about the fact that I have a back."

  She walked to the window, looking out at the nebula. "Elias, if you're right... if SSA holds... then the *Aethelgard* is likely near its end. Not because the metal is tired. But because *we are here*. It implies the future is short. It means we should consume resources now. It means hope is a statistical error."

  Elias felt a cold knot in his stomach. That was the part he didn't put in his reports. The SSA didn't just predict the end; it incentivized it. If the future is likely short, why save for Generation 100?

  "And if you're right," Elias said, his voice tight, "then we are living in a universe that is biased toward complexity and life. It means the Void isn't a graveyard. It means the odds of finding a habitable world aren't one in a billion, but much higher, because if they were low, there wouldn't be enough observers to wonder about the odds."

  "Exactly," Mara said. "SSA makes us orphans in a dying house. SIA makes us children in a crowded city."

  "But the arrogance," Elias whispered. "To assume the universe is big just because we're in it."

  Mara turned back to him. The neon light from the console cut across her face, half in shadow. "Is it more arrogant to assume the universe is small enough to fit your timeline? Or to assume that existence is the default, and you are simply one of many?"

  Elias looked back at his datapad. The bell curve glowed, a tombstone shape. He thought about the hydroponics bay, the seeds waiting to be planted for the next cycle. If he followed his own math, planting them was a waste of calories.

  He deleted the projection.

  "I'm not putting this in the briefing," Elias said.

  "Because the math is wrong?"

  "Because," Elias said, meeting her eyes, "if SSA is right, telling the crew we're statistically likely to be in the last half of the voyage causes panic. And if SIA is right, telling them the universe is biased toward life makes them reckless."

  Mara smiled, a thin, sharp thing. "So we agree. The truth is unusable."

  "The truth," Elias said, turning off the console, "is that we're Generation 42, and we have a shift tomorrow. Whatever assumption gets us to 43 is the one we use."

  "Pragmatism," Mara said, pushing off the window. "The only assumption that doesn't require a reference class."

  "Go to sleep, Mara."

  "Goodnight, Elias. Try not to count yourself out of existence."

  She left him in the dark. Elias sat for a moment longer, staring at his own reflection in the black glass. He looked typical. He looked like a random sample. He looked, for all the world, like a man living in the middle of something that had an end.

  He tapped the console once, reactivating the screen, then immediately powered it down again. He didn't need to know the total number of passengers to know he had to act like there would be more after him.

  Even if the math said otherwise.
