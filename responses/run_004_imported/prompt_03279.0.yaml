      *   **Conflict 1: Mechanism vs. Anti-Mechanism.** Gödel believed the mind is *not* a Turing machine. Uploading assumes the mind *is* effectively computable (or at least simulatable by a computer). If the mind can grasp truths a machine can't, a machine simulation of the mind should also be limited. But if the simulation *acts* like it grasps them, is it genuine understanding? Gödel would likely say no.
