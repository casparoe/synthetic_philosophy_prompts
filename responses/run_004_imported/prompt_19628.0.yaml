answer: |-
  **The Impossibility of Ultimate Authorship: Assessing Strawson's Neutrality Claim**

  For much of the history of philosophy, the problem of free will was treated as a subsidiary of the problem of determinism. The intuition was straightforward: if the physical world is a closed causal system, human actions are merely links in a chain stretching back to the Big Bang, and "freedom" is an illusion. Conversely, if determinism is false—if quantum indeterminacy or some other form of randomness breaks the chain—perhaps there is room for the agent to step in. However, Galen Strawson's "Basic Argument" challenges this entire framework. Strawson contends that the real barrier to moral responsibility is not determinism, but the logical impossibility of being *causa sui* (cause of oneself). He claims this argument holds regardless of whether the universe is deterministic or indeterministic.

  This essay assesses Strawson's claim of neutrality. Specifically, it examines whether libertarian theories, such as Robert Kane's model of "Self-Forming Actions" (SFAs), successfully halt the regress Strawson identifies. I argue that Strawson has indeed earned his neutrality claim. While Kane's libertarianism attempts to ground responsibility in undetermined moments of will, it ultimately fails to provide the control necessary for moral responsibility. By substituting necessity with luck, Kane's model confirms rather than refutes Strawson's thesis: without the ability to be the ultimate source of one's own mental nature, true moral responsibility remains impossible, whether the causal chain is rigid or stochastic.

  ### The Basic Argument and the Regress of Responsibility

  Strawson's Basic Argument is deceptively simple. It rests on the principle of Ultimate Responsibility (UR): to be truly morally responsible for an action, one must be responsible for the reasons and motives that led to that action. If I act out of anger, I am only responsible for that action if I am responsible for being the kind of person who gets angry in that situation.

  This generates a regress. To be responsible for my current mental nature ($N_1$), I must have performed some prior action or choice ($A_1$) that shaped $N_1$. But to be responsible for $A_1$, I must have been responsible for the mental nature ($N_0$) that led to $A_1$. This chain cannot go on forever. Eventually, it must reach a starting point—a genetic endowment, an early childhood environment, or a first choice—for which the agent cannot be responsible. Since humans cannot create themselves *ex nihilo*, they cannot be *causa sui*. Therefore, they cannot be ultimately morally responsible.

  Strawson's crucial intervention is to assert that this logic is invariant under the conditions of determinism or indeterminism. If determinism is true, my choices are the inevitable result of prior states I did not choose. If indeterminism is true, my choices involve an element of randomness. In neither case do I possess the kind of "buck-stopping" authorship required for deep moral responsibility.

  ### The Libertarian Challenge: Kane's Self-Forming Actions

  Robert Kane offers the most sophisticated contemporary defense against this pessimism. Kane accepts Strawson's requirement for Ultimate Responsibility but argues that it can be met within an indeterministic framework. He posits that at certain key moments in life, agents face "Self-Forming Actions." These are situations of conflicting wills—for example, a conflict between moral duty and personal ambition.

  In an SFA, the agent exerts effort to resolve the conflict. Kane argues that the outcome is undetermined; the neural noise in the brain means that either choice is physically possible given the exact same prior state. However, Kane insists that whichever way the agent chooses, they *make* it happen through their effort. The indeterminism does not undermine control; it constitutes the freedom. By choosing in these undetermined moments, the agent forms their own character. Thus, the regress stops: the agent is responsible for their character because they literally constituted it through these undetermined choices.

  For a mind trained in the physical sciences, Kane's model initially appears promising. It mirrors the transition from classical to quantum mechanics: the future is not a fixed trajectory but a probability distribution collapsed by observation (or in this case, volition). If the brain utilizes quantum indeterminacy, perhaps the "gap" in causation is where the "self" resides.

  ### The Luck Objection and the Failure of Neutrality

  However, when subjected to Strawson's rigorous logical scrutiny, Kane's solution collapses. The core issue is the "Luck Objection." If an SFA is truly undetermined, then given the exact same past history and the exact same mental state, the agent could have chosen otherwise. If the choice is not determined by the agent's prior character, motives, or reasons, then the specific outcome cannot be fully explained by the agent.

  From a causal perspective, if $A$ (the agent's state) does not determine $B$ (the choice), then the transition from $A$ to $B$ involves a probabilistic element external to the agent's rational control. If I choose duty over ambition, but the physical laws of my brain allowed for the opposite outcome with equal probability, then the fact that I chose duty involves an element of chance. As Strawson would argue, luck is not responsibility. If the choice was not determined by who I was, it is not truly *mine* in the requisite sense; if it *was* determined by who I was, we return to the question of who made me that way.

  Kane attempts to evade this by distinguishing between the *effort* of will (which he claims is determined) and the *outcome* (which is not). He argues the agent is responsible for the effort. But Strawson's regress bites here too. Why did the agent exert *that* specific effort with *that* specific intensity? If the effort is determined by the agent's prior character, the agent must be responsible for that character (regress). If the effort is undetermined, then the exertion of will itself is a matter of luck.

  Consequently, Kane's libertarianism does not halt the regress; it merely relocates it. He posits a "self" that stands behind the choices, but he cannot explain the origin of that self's capacity to choose without falling back into the dichotomy Strawson identified. Either the self's choice is a function of its nature (determinism/regress) or it is not (indeterminism/luck). Kane tries to have it both ways by claiming the choice is "willings" that are not fully determined, but this amounts to a metaphysical assertion that lacks causal intelligibility. For a scientist, a cause that does not determine its effect is indistinguishable from randomness. A random number generator is not "free"; it is merely stochastic. Attributing moral weight to stochasticity does not grant control; it merely obscures the lack of it.

  ### The Verdict: Strawson's Neutrality Holds

  Does Strawson earn his neutrality claim? Yes. The debate over free will is often misconstrued as a debate over physics (determinism vs. indeterminism), but Strawson correctly identifies it as a debate over metaphysics (authorship vs. derivation).

  Kane's SFAs fail to restore the control necessary for moral responsibility because they cannot bridge the gap between "activity" and "authorship." An agent can be active in an undetermined choice, but they cannot be the *ultimate source* of that activity unless they created the capacity for that activity. Since no agent creates their own capacity for volition, the regress remains unbroken. Indeterminism adds noise to the system, but noise does not confer ownership.

  Therefore, Strawson's Basic Argument succeeds. It demonstrates that the condition for true moral responsibility—being *causa sui*—is logically impossible for finite beings. This impossibility holds whether the causal chain is rigid or probabilistic. Determinism denies responsibility by making the agent a conduit of the past; indeterminism denies it by making the agent a victim of chance. Neither allows the agent to be the unmoved mover required by the libertarian intuition.

  ### Conclusion

  The transition from physics to philosophy reveals that the constraints on human freedom are not merely empirical but logical. Strawson's Basic Argument strips away the hope that quantum mechanics or chaos theory might save moral responsibility. By focusing on the requirement of ultimate self-creation, Strawson shows that the determinism/indeterminism dispute is secondary. Robert Kane's attempt to utilize indeterminism via Self-Forming Actions is a valiant effort to secure a place for human agency, but it ultimately succumbs to the luck objection. It substitutes the hard chains of necessity for the soft chains of probability, but chains remain chains.

  Strawson's neutrality claim survives scrutiny. The impossibility of moral responsibility is not a feature of a deterministic universe; it is a feature of the concept of responsibility itself. We may still hold each other accountable for pragmatic reasons—to shape behavior and maintain social order—but we must concede that this is a forward-looking utility, not a backward-looking metaphysical truth. In the end, we are not *causa sui*, and no amount of indeterministic noise can make us so.
