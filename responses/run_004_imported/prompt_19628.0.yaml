  2.  **Deconstruct Strawson's Basic Argument:**
      *   *Premise 1:* To be truly morally responsible for an action ($X$), one must be responsible for the mental state/character ($M$) that led to $X$.
      *   *Premise 2:* To be responsible for $M$, one must have chosen $M$ based on some prior mental state ($M-1$).
      *   *Premise 3:* To be responsible for choosing $M$ based on $M-1$, one must be responsible for $M-1$.
      *   *Conclusion:* This leads to an infinite regress. Since humans cannot cause themselves (be *causa sui*) from the beginning of their existence, true moral responsibility is impossible.
      *   *Neutrality Claim:* This logic holds regardless of whether the causal chain is determined or indeterministic. If determined, you aren't the ultimate source. If indeterministic, the break in the chain is just randomness (luck), not control.

  3.  **Deconstruct Kane's Libertarian Response (Self-Forming Actions):**
      *   Kane accepts the need for "Ultimate Responsibility" (UR).
      *   He argues that at certain moments (SFAs), an agent faces conflicting wills (e.g., moral duty vs. self-interest).
      *   The outcome is undetermined.
