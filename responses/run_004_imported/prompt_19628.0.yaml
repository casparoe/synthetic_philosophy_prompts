      *   Kane claims this establishes ownership: "I caused this," even if it wasn't determined.
      *   The regress stops here because the agent constitutes their own will *in that moment*.

  4.  **Evaluate the Clash (Strawson vs. Kane):**
      *   *Strawson's Critique of Libertarians:* Indeterminism introduces randomness. If the choice isn't determined by who you are, it's luck. If it *is* determined by who you are, you need to be responsible for who you are (back to regress).
