      *   **Decision Theory vs. Epistemology:** The Dutch Book argument is pragmatic (about action/betting). The Sleeping Beauty problem is ostensibly about *credence* (belief). Halfers argue that pragmatic vulnerability doesn't necessarily imply epistemic error if the decision situation is skewed (e.g., being asked multiple times for the same decision).
