answer: |-
  You have hit on the exact nerve of the Sleeping Beauty debate. It is completely understandable why, from a rationalist perspective, the Dutch Book argument feels like a checkmate. If rationality is about avoiding guaranteed losses, and Halferism leads to guaranteed losses while Thirderism doesn't, then Halferism seems pragmatically irrational.

  However, the reason serious philosophers (including heavyweights like David Lewis) remain Halfers isn't stubbornness. It's because they reject the premise that **betting odds must always equal credence** in cases involving self-locating uncertainty and multiple decisions per event.

  Here is why the Dutch Book argument does not "settle" the debate, and what the Halfers are actually saying in response.

  ### 1. The Betting Protocol vs. The Credence
  The standard Dutch Book against the Halfer looks like this:
  *   **The Bet:** Every time Beauty wakes, she is offered a bet: Pay \$15 to win \$30 if the coin is Heads.
  *   **Halfer Strategy:** She accepts because her credence is 1/2 (Expected Value = 0).
  *   **The Outcome:**
      *   **Heads:** She wakes once (Monday). She pays \$15, wins \$30. Net: +\$15.
      *   **Tails:** She wakes twice (Mon & Tue). She pays \$15 twice (\$30 total), wins nothing. Net: -\$30.
      *   **Result:** Over many experiments, she loses money.

  The Thirder says: "See! Your 1/2 credence is wrong. If you used 1/3, you'd reject the bet (EV is negative at 1/3 credence) and save yourself."

  **The Halfer Counter-Argument:**
  The Halfer argues that this Dutch Book exploits the **betting protocol**, not the **credence**.
  The Halfer claims that her credence of 1/2 correctly reflects the objective chance of the coin. The reason she loses money is not because her belief is wrong, but because the **stakes are skewed**. In the Tails world, she is forced to make the *same decision* twice for the *same outcome*.

  If you normalize the bet so that it counts **per experiment** rather than **per awakening**, the Halfer breaks even.
  *   *Halfer Proposal:* "I will accept the bet, but if it is Tails, I only lose the stake once, even if I am asked twice."
  *   *Thirder Objection:* "But you *are* asked twice. You voluntarily accept the bet twice."

  This reveals the core disagreement: **Is the unit of agency the 'awakening' or the 'experimenter/subject pair'?**
  *   **Thirders** treat each awakening as a distinct decision node.
  *   **Halfers** treat the awakenings as temporally distinct but agentially identical moments of the same person making the same commitment to the same proposition.

  ### 2. Credence vs. Decision Weight
  Many Halfers (specifically "Lewisian Halfers") draw a sharp distinction between **credence** (degree of belief) and **betting quotient** (price at which you buy a ticket).

  In standard probability theory, these are the same. But in Sleeping Beauty, the Halfer argues that **indexical information** (knowing "I am awake now") changes the *decision weight* without changing the *objective credence*.

  David Lewis's argument was essentially:
  1.  Beauty knows the coin is fair. $P(Heads) = 1/2$.
  2.  Upon waking, she learns no new relevant information about the coin toss itself (she knew she would be woken up regardless).
  3.  Therefore, $P(Heads | Awake)$ should remain $1/2$.

  Lewis acknowledged that if Beauty is offered a bet *each time she wakes*, she should bet *as if* the probability is 1/3 to avoid the Dutch Book. But he argued this is a quirk of **decision theory in self-locating contexts**, not a correction to **epistemology**.

  To a Lewisian, saying "Beauty should believe 1/3" conflates "Beauty should believe the coin is biased" with "Beauty should act as if the coin is biased because she gets penalized double for being wrong." They argue rationality requires your beliefs to track truth, not just utility maximization in skewed betting environments.

  ### 3. The "Frequency" Mismatch
  The Dutch Book argument relies on a frequency interpretation: "In the long run, 2/3 of awakenings are Tails."
  *   **Thirder:** "Probability is about the proportion of observer-moments."
  *   **Halfer:** "Probability is about the proportion of world-histories (experiments)."

  If you run the experiment 100 times:
  *   There will be roughly 50 Heads experiments and 50 Tails experiments.
  *   There will be 50 Heads awakenings and 100 Tails awakenings.

  If you care about being right about the **coin**, the Halfer is right 50% of the time (per experiment).
  If you care about being right about the **current awakening**, the Thirder is right 66% of the time (per awakening).

  The Dutch Book works because it charges per **awakening**. If you structured a Dutch Book that charged per **experiment** (e.g., Beauty pays out on Sunday after the experiment concludes), the Halfer would not be vulnerable. The fact that the Halfer is vulnerable *only* under specific betting protocols suggests to them that the vulnerability lies in the protocol, not the probability assignment.

  ### 4. Why the Literature Persists
  You asked if philosophers are just refusing to update. In this case, it's more that the two sides are answering slightly different questions.

  *   **The Thirder Question:** "What credence should I have such that I make optimal decisions given that I am an observer-moment who doesn't know which moment I am?"
  *   **The Halfer Question:** "What credence should I have that accurately reflects the objective chance of the random event, independent of how many times I am queried?"

  There is also a technical camp known as **"Double Halfers"** who try to keep the 1/2 credence *and* avoid the Dutch Book by modifying decision theory (e.g., using "causal decision theory" variants or "halfer betting rules" where bets are voided if made multiple times for the same outcome).

  ### Summary
  The Dutch Book argument proves that **if** you define rationality strictly as "avoiding sure losses in per-awakening betting markets," **then** Thirding is the only consistent position.

  However, Halfers reject that definition. They argue:
  1.  **Credence $\neq$ Betting Odds** in self-locating cases.
  2.  The Dutch Book exploits a **sampling bias** (counting Tails twice), not an epistemic error.
  3.  Rational belief should track the **chance of the event**, not the **frequency of the query**.

  So, you aren't missing a logical flaw in the Dutch Book itself; you are missing the Halfer's rejection of the assumption that *susceptibility to a specific betting scheme is the definitive test of epistemic rationality.*

  If your reading group values pragmatic consistency and decision theory above metaphysical distinctions about "world-histories" vs. "observer-moments," then yes, Thirding wins. But if you value credence as a map of objective reality regardless of how often you are asked to read the map, Halferism remains defensible. That is why the debate is still alive.
