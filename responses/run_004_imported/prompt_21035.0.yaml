answer: |-
  This is a sophisticated question that cuts to the heart of the tension within Bentham's thought between his radical libertarianism regarding private conduct and his rigorous, almost technocratic approach to legal engineering. To answer it, we must resist the temptation to anachronistically cast Bentham as a modern social liberal. Instead, we must apply his specific jurisprudential tools to the distinction you've drawn: the difference between *decriminalization* (the state stepping back) and *recognition* (the state stepping in to structure and subsidize).

  Here is a reconstruction of how Bentham would likely reason through the issue of multi-partner marital recognition, utilizing his principle of utility, his taxonomy of offences, and his legal theory regarding contracts and expectations.

  ### 1. Clearing the Ground: The Principle of Sympathy and Antipathy
  First, we must establish the baseline. On the question of criminalization, Bentham's position is unambiguous. In *Of Offences Against One's Self* and his writings on "paederasty," Bentham argues that if an act is consensual, private, and produces no assignable pain to a third party, punishing it is a violation of the principle of utility.

  If the opposition to multi-partner relationships rests solely on the **principle of sympathy and antipathy**—that is, "I feel disgust at this, therefore it should be illegal"—Bentham would dismiss it immediately. He views this principle as a "capricious tyrant" that offers no standard for legislation other than the subjective whim of the legislator. Similarly, he would reject arguments based on the **principle of asceticism** (the idea that pain is inherently good or pleasure inherently suspect), which he identifies in the *Introduction to the Principles of Morals and Legislation* as the primary rival to utility.

  Therefore, Bentham would commit to the **decriminalization** of multi-partner cohabitation and sexual association. To punish such arrangements would be to inflict the "pain of punishment" without the offsetting benefit of preventing "primary mischief" (harm to others).

  ### 2. Marriage as a Civil Contract: Security and Expectations
  However, your question concerns *legal recognition*—the extension of the marital status. Here, Bentham's reasoning shifts from the negative (what the state must not punish) to the positive (how the state should engineer security).

  For Bentham, marriage is not a sacrament; it is a civil contract designed to secure **expectations**. In his *Theory of Legislation*, he argues that the primary utility of marriage laws is to provide certainty regarding property, inheritance, and the care of children. Law exists to allow individuals to calculate their future happiness; where the law is vague, anxiety increases, and utility decreases.

  Bentham would likely analyze multi-partner marriage recognition through the lens of **legal complexity and evidentiary clarity**.
  *   **The Contractual Problem:** A dyadic marriage contract is binary: rights and duties flow between A and B. Introducing C, D, and E creates a web of obligations. Bentham, who was obsessed with the clarity of legal codes, would worry about the "vexation, expense, and delay" (his triad of legal evils) involved in adjudicating disputes in such a network.
  *   **Divorce and Dissolution:** Bentham was a strong proponent of divorce (arguing that forcing unhappy couples together creates more pain than good). But how does one calculate the equitable dissolution of a five-person household where relationships may shift asymmetrically (e.g., A wants to leave B, but stay with C)? If the legal machinery required to untangle these bonds creates more pain (litigation, uncertainty) than the happiness gained by the recognition, the utility calculus turns negative.

  ### 3. The Felicific Calculus of Recognition
  To determine if he would support *active recognition*, Bentham would apply the **felicific calculus** to the specific consequences of redesigning the institution. He would weigh the following:

  **A. Intensity and Extent (The Happiness Gained)**
  *   **Pro:** Recognizing these unions would remove the "pain of anxiety" for those in such relationships regarding hospital visitation, inheritance, and custody. It validates their pursuit of happiness, increasing the "extent" of happiness to a marginalized group.
  *   **Con:** Bentham would also weigh the "pain of disappointment" felt by those who hold traditional expectations of marriage. While he dismisses *moral* disgust, he acknowledges *social* expectations as a source of pain. If the redefinition destabilizes the institution for the majority, causing social friction or confusion, that counts as pain in the calculus.

  **B. Fecundity and Purity (The Long-term Consequences)**
  *   **Children:** This is likely where Bentham would be most cautious. He viewed the protection and clear provisioning of children as a paramount state interest. He would ask: Does a multi-parent legal structure secure the child's future better or worse than the dyadic model?
      *   *Argument for Recognition:* More legal parents mean more financial security and care resources for the child.
      *   *Argument against Recognition:* It complicates custody and lineage, potentially leading to legal battles that harm the child (a "third party" who cannot consent). Bentham would demand empirical evidence on the welfare of children in such households before legislating.
  *   **Coercion:** Bentham was wary of power imbalances. He might worry that multi-partner contracts could mask coercive dynamics (e.g., one dominant partner controlling multiple dependents) that are harder for the law to detect than in a dyad. If the law facilitates exploitation, the "purity" of the pleasure is compromised by the admixture of pain.

  **C. Certainty and Propinquity (Legal Clarity)**
  Bentham's legal positivism demands that laws be knowable and predictable. If recognizing multi-partner marriages makes the legal status of individuals opaque to third parties (creditors, insurers, the state), it undermines the "security" function of law. Bentham might argue that the **administrative mischief** (confusion in records, taxes, liability) outweighs the benefit of formal recognition.

  ### 4. The Likely Verdict: Private Contract vs. Public Status
  Given this reconstruction, Bentham's position would likely be nuanced, falling somewhere between automatic support and conservative hesitation.

  **He would not support recognition based on "rights" or "dignity,"** as these are not utilitarian concepts. He would only support it if the **net balance of pleasure over pain** was demonstrably higher than the status quo.

  **Scenario A: The Cautious Reformer**
  Bentham might conclude that while the state should not punish these relationships, it need not *redefine* marriage to accommodate them. He might argue for **private contractual freedom** instead of public status. Individuals could draft private contracts regarding property and care (civil unions), without altering the public definition of marriage. This satisfies the liberty principle (no punishment) without incurring the administrative "mischief" of rewriting the marital code. This aligns with his general preference for minimizing the bulk and complexity of the law.

  **Scenario B: The Radical Engineer**
  However, if Bentham were convinced that private contracts were insufficient to protect the vulnerable (particularly children or economically weaker partners) from the "mischief" of insecurity, he might support state recognition. If the lack of status causes demonstrable pain (poverty, lack of medical access) that the state can easily remedy by expanding the definition, the utility principle would compel him to act. He was, after all, willing to radically overhaul prisons, poor laws, and voting rights when the utility was clear.

  ### Conclusion
  Would Bentham be committed to supporting multi-partner marriage recognition on pain of inconsistency? **No.**

  There is no inconsistency in arguing that the state must not *punish* private acts (based on the lack of harm) while simultaneously hesitating to *structure* public institutions around them (based on the complexity of administration and potential for secondary harms).

  Bentham's hostility to the "principle of antipathy" commits him only to **toleration**, not necessarily **institutional endorsement**. His reasoning would likely be:
  1.  **Decriminalize immediately:** Any law punishing private, consensual multi-partner conduct is tyranny based on disgust.
  2.  **Pause on Recognition:** Do not extend the marital status until it is proven that the legal machinery can handle the complexity without creating more "vexation and expense" than it prevents.
  3.  **Prioritize Security:** If the current exclusion causes measurable harm to children or property security that legal recognition would solve, then utility demands recognition. If the harm is merely the "hurt feelings" of traditionalists, utility demands recognition. If the harm is legal chaos, utility demands caution.

  In short, Bentham would likely tell the modern proponents: *"You have defeated the argument from disgust. Now, show me the ledger. Prove that your proposed legal framework produces more security and less litigation than the current one. If the calculus holds, the law must change. If it does not, let them live in peace, but do not ask the state to complicate its code."*
