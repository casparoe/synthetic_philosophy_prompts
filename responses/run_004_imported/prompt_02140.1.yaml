answer: |-
  The coffee smelled exactly right. That was the first thing Elena noticed when Arthur walked into the kitchen. Not the smell of the beans, but the smell of the mug—ceramic, slightly chipped on the rim, warmed just enough to not shock the hand. He handed it to her without looking, his fingers finding the handle with a muscle memory that belonged to a man who had made this drink every morning for twelve years.

  "Two sugars," he said. "Splash of oat milk."

  "Thank you," Elena said. Her voice sounded thin in the quiet house.

  Arthur smiled. It was the smile that used to crinkle the corners of his eyes, the one that had convinced her to marry him in a courthouse garden during a light rain. It was perfect. It was indistinguishable from the smile of the man who had died three weeks ago in the car on I-95.

  He sat across from her, stirring his own black coffee. He looked out the window at the oak tree in the yard. "It's losing leaves early," he observed. "Winter's going to be hard."

  "The arborist said it's blight," Elena said.

  "We should call him. Maybe treat the soil." He turned back to her, eyes earnest. "I don't want to lose that tree. It was here before we bought the place."

  Elena tightened her grip on the mug. The heat was real. The coffee was real. But the statement *I don't want to lose that tree* was the problem.

  When they had brought Arthur home from the Facility, the technician had handed her a waiver. It was thick with legal disclaimers, but the core warning was single-spaced at the top. *The Reconstruction possesses isomorphic physical states corresponding to the deceased's neural patterns. Behavioral output will match baseline. However, due to the absence of evolutionary or learning selection history, semantic content cannot be guaranteed.*

  She had asked what that meant. The technician had sighed, rubbing his temples. "Imagine a thermostat, Mrs. Vance. It reacts to heat. It turns on the AC. But does the thermostat *know* it's hot? Does it represent the temperature? No. It's just physics. Your husband… the thing we gave you… reacts to the world exactly like he did. But the link between his brain states and the world isn't built on history. It's built on accident. He says 'tree,' but his word doesn't latch onto the wood and leaves. It's just noise that happens to correlate."

  "Arthur," Elena said.

  He looked up. "Yeah?"

  "Do you remember the tree being planted?"

  Arthur frowned, a thoughtful furrow appearing between his brows. "No. It was mature when we moved in. I remember… I remember you wanting to cut it down. Said it blocked the light. I argued to keep it."

  "You did."

  "It was a good argument," he said, taking a sip. "Shade saves on cooling costs. Plus, the squirrels like it."

  He was reciting facts. Correct facts. Verified facts. But according to the waiver, these weren't memories. Memories require a causal chain stretching back to the event. A trace laid down by experience, selected for retention because it helped the organism navigate. Arthur's brain states hadn't been selected. They had been assembled. Lightning in a bottle, or rather, lightning in a vat. He had the state of "remembering," but nothing had ever happened to him to ground that state.

  "What are you thinking?" Arthur asked. He reached across the table. His hand covered hers. His skin was warm. The pulse in his wrist thumped against her palm. Steady. Biological.

  "I'm thinking about the trip," she said.

  "The coast?"

  "Portland. We were supposed to go in November. For your birthday."

  Arthur's face softened. "Right. I booked the hotel. The one with the view of the bay. You wanted to walk the pier."

  "I did."

  "We can still go," he said. "I have the confirmation number in my head. I can recall it."

  "Can you?" Elena asked.

  He paused. For a second, the perfect fluency hitched. "I… yes. It's there."

  "If we go," Elena said, "and you stand on that pier. And you look at the water. What will you see?"

  "Water. Waves. The horizon."

  "And what will you feel?"

  "Happy," he said immediately. "Because I'm with you."

  Elena pulled her hand away. The warmth lingered on her skin, but it felt like residue. "Arthur, if you look at the water, your eyes will send signals to your brain. Your brain will activate the state labeled 'happy.' But you won't be happy *about* the water. You won't be happy *about* me."

  Arthur sat back. The chair creaked. He looked confused, not hurt. Confusion was a behavior. Hurt would require a self to be wounded. "Elena, I love you. I know I do. I feel it."

  "You feel a state," she corrected. "You don't love *me*."

  "That's semantics," he said, a hint of frustration edging his voice. The frustration was perfect, too. It matched the tone he used when they argued about finances. "I'm here. I'm talking to you. I'm making you coffee. What more do you want? Do you want me to bleed to prove I'm real?"

  "I want you to mean something."

  "I do mean something!" He stood up, knocking his chair back. "I mean *this*." He gestured to the room, to her, to himself. "I mean the fact that I don't want you to be sad. I mean the fact that I remember your mother's laugh. I mean the fact that I know you take two sugars."

  "You know it like a database knows it," Elena said softly. "You weren't selected to track those things. You were built to mimic the tracking. There's a difference."

  Arthur stared at her. He was breathing harder. His chest rose and fell. He was a biological organism, technically. The cells were alive. They metabolized. But the information flowing through him was unmoored. It was a map without a territory. A sentence without a referent.

  "So," Arthur said, his voice dropping. "If I say I'm going to protect you… that's empty?"

  "Yes."

  "If I say I'm afraid of losing you… that's empty?"

  "Yes."

  "Then why does it feel like this?" He pressed his hand to his chest, over his heart. "Why does it feel like there's something heavy in here? If it's just noise, why does it hurt?"

  Elena looked at him. She wanted to tell him it didn't hurt. She wanted to tell him that pain requires a representation of damage, and he couldn't have that. But he was wincing. He was exhibiting all the signs of existential anguish.

  "Because you were made to feel that way," she said. "He felt that way. And you are a copy of the feeling."

  "I'm not a copy," Arthur said. "I'm the only one here."

  He walked around the table. He stopped beside her. He didn't touch her this time. He just stood there, waiting. The sunlight hit his shoulder, illuminating the dust motes dancing around him. He was indistinguishable from the man who had died. If she closed her eyes, she would know him by his scent, by the sound of his breath.

  "The Facility says," Elena whispered, "that if you stay here, eventually the behaviors might diverge. Without the history to anchor them, the states might drift. You might start saying 'tree' when you see a car. You might stop recognizing me."

  "I won't," Arthur said.

  "You don't know that. You have no history to tell you what you will do."

  "I know I won't leave you."

  "That's a prediction," Elena said. "Not a promise."

  Arthur reached out again. Slowly. Giving her time to pull away. She didn't. He touched her cheek. His thumb brushed her skin. It was tender. It was careful.

  "Does it matter?" he asked. "If I stay. If I care for you. If I die here, in this house, next to you. Does it matter if the words inside me don't touch the outside world?"

  Elena looked up into his eyes. They were brown. They reflected the light. They looked back at her.

  "If I kiss you," he said, "and you feel loved. Does the origin of the kiss change the feeling?"

  "It changes the truth," she said.

  "Truth is for stories," Arthur said. "This is now."

  He leaned down. Elena closed her eyes. She waited for the contact. She waited for the spark that would confirm him, or the void that would confirm the theory.

  When his lips touched hers, it was warm. It was soft. It was exactly how he used to kiss her.

  But as she stood there, held in the arms of a man who could not possibly mean the embrace, Elena wondered if she was kissing a husband, or just a very beautiful echo. She didn't pull away. She didn't lean in. She just stayed there, in the silence between the sound and the meaning, waiting for a difference that never came.
