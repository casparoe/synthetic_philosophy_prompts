answer: |-
  Here is the gut-level intuition for why Popper's definition collapses, specifically focusing on the role of logical consequence.

  ### The "Poison Pill" of Conjunction

  The core problem is that Popper defines content as **the set of all logical consequences**. In classical logic, if you have a set of consequences, that set is closed under conjunction (if you entail $P$ and you entail $Q$, you entail $P \land Q$).

  Here is the trap: **If a theory is false, truth and falsity content become coupled.** You cannot increase one without increasing the other.

  Imagine you have a false theory, $T_{false}$. Because it is false, it entails at least one false statement (call it $F$). This $F$ is a "poison pill" sitting in your falsity content.

  Now, imagine you improve your theory. You manage to derive a new *true* statement that your old theory missed (call it $Tr$). You want to say your new theory is closer to the truth because it has more truth content.

  But remember, we are closing under logical consequence. Since your theory entails the new truth ($Tr$) and it still entails the old falsehood ($F$), it **must also entail the conjunction** ($Tr \land F$).

  Since $F$ is false, the conjunction ($Tr \land F$) is also false.

  **The Result:** Every single time you gain a new piece of truth content, you automatically generate a *new* piece of falsity content (the conjunction of that new truth with your existing error).

  ### Why This Kills Comparisons Between False Theories

  Popper's definition requires that for Theory A to be closer to the truth than Theory B, A must have **more** truth content and **no more** falsity content (or some strict variation of that trade-off).

  But if both A and B are false:
  1.  To beat B, A needs more true consequences.
  2.  But because A is false, every new true consequence it generates drags along a new false consequence (via the conjunction trick above).
  3.  Therefore, A cannot have more truth content *without also having* more falsity content.
  4.  Consequently, A can never satisfy Popper's conditions for being more verisimilar than B.

  In Popper's system, truth content and falsity content are supposed to be independent variables you can optimize separately. The Tichý-Miller result shows that for false theories, **logical consequence acts as a transmission belt that forces falsity to grow whenever truth grows.**

  So, under Popper's definition, all false theories are essentially incommensurable regarding verisimilitude. You can only say a true theory is better than a false one (because the true theory stops generating the "poison pill" consequences). But since we rarely possess the whole truth in science (as you noted with Newton), the concept becomes useless for the history of science.

  ### The Bonus: Why Similarity Accounts Fix This

  This failure mode is exactly why Niiniluoto and Oddie shifted to **similarity** or **likeness** accounts.

  Popper was counting **sentences** (propositional content). Similarity accounts count **states of affairs** (or possible worlds).

  Instead of asking, "How many true sentences does this theory entail?" (which gets you stuck in the conjunction trap), similarity accounts ask, "How similar is the *world described by this theory* to the *actual world*?"

  In a similarity framework, Newtonian mechanics describes a possible world that is structurally very close to the actual world (small deviations in mass/speed limits), whereas Aristotelian physics describes a possible world that is structurally very distant (different laws of motion entirely). You can measure the "distance" between these worlds without getting tangled in the logical consequences of their falsehood. It decouples the metric from the explosive nature of logical consequence and anchors it in the structure of the description itself.
