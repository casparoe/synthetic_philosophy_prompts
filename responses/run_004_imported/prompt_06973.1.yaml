prompt: |-
  I'm a backend engineer, not a philosophy person at all, but I've been falling down a rabbit hole reading old rationalist-blog posts about decision theory and counterfactuals (the stuff that comes up around Newcomb's problem, causal vs evidential decision theory, that whole cluster), and I keep running into references to "Stalnaker's thesis" and then a "triviality result" by David Lewis that apparently blows it up. As far as I can piece together, the thesis is the intuitively obvious-sounding claim that the probability of the conditional "if A then B" should just equal the conditional probability P(B|A) -- which matches how people actually reason with ifs day to day. But then Lewis apparently showed that if you accept that, plus a pretty mild assumption that you're allowed to update your probabilities on new evidence (conditionalize on stuff), you get forced into concluding that A and B must be probabilistically independent for more or less any A and B you pick, which is obviously nuts -- so something has to give, and the whole setup gets called "trivial" instead.

  I found a sketch of the actual derivation (conditionalize on B and seperately on not-B, apply the thesis in each case, then recombine with the law of total probability, and P(B|A) = P(B) just pops out) and I can follow the algebra step by step, but it still feels like a magic trick, not something I actually get. Is there some underlying reason -- like a one-sentence "ah, THAT's why it has to break" -- for why treating a conditional as an ordinary proposition whose probability tracks conditional probability just can't coexist with normal Bayesian updating? I don't need the formal proof re-derived at me line by line, I want the gut-level version, kind of like how people explain Gödel's incompleteness or Arrow's theorem by pointing at the one weird self-referential or structural trick that makes the whole thing tick. Also, only if you happen to know off the top of your head: is this a "yeah the thesis was just wrong, philosophers moved on" kind of situation, or more of a live wound people still argue about, with proposed workarounds and restricted versions and whatnot? That part's optional -- mainly I just want to actually understand why the collapse happens instead of just watching the symbols move around.
