prompt: |-
  My grandpa passed away a few weeks ago and I've been down this wierd rabbit hole reading what smart, non-religious types have said about the afterlife instead of the usual religious answers. Turns out Godel (yes, the incompleteness theorem guy) apparently tried to convince his mom, in letters, that some kind of afterlife basically has to exist, roughly because the world is rational and well-ordered, and it'd be absurd for a mind as complicated as a human's to develop for decades only to just switch off for no reason. This rang a bell from a philosophy class I took forever ago on Leibniz's monads, how they supposedly can't be destroyed through ordinary means, so death for him is really more of a transformation than a true ending. Are Godel's and Leibniz's arguments basically doing the same move dressed up differently, or is Godel sneaking in something distinct while borrowing Leibniz's rationalist vibe? And honestly, which of the two actually holds up better as an argument, and why?
reasoning: |-
