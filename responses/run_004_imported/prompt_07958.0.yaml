      *   **Characters:** A Sophisticated Substantivalist (SS) and a Relationist (R).
      *   **Setting:** Two philosophers of physics at a blackboard.
      *   **Key Arguments to Include:**
          *   SS: Diffeomorphic models represent the same physical reality (Leibniz Equivalence). Points are individuated by the metric field (structuralism/sophistication).
          *   R: This makes substantivalism vacuous/indistinguishable from relationism.
