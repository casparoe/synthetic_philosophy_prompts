answer: |-
  Good evening, everyone. For those of you who don't know me, I'm a friend of the couple from graduate school. And for those of you who *do* know me from graduate school: yes, I promise to keep the jargon to a minimum.

  We are here to celebrate Priya and Daniel, which means we have to talk about how they began. As many of you know, Daniel proposed by taping the engagement ring to the last page of a typeset proof of Harsanyi's Aggregation Theorem. It was romantic, in a very specific, very nerdy way. Because what Daniel was really saying with that ring wasn't just "I love you." It was, "I want to form a coalition with you that satisfies the Pareto condition."

  For the family members wondering what that means: Harsanyi's theorem is a piece of math about how people make decisions together. It says that if two rational people want to act as a single household, and they want to respect each other's wishes without ever making a decision that makes both of them worse off, then their shared goals must be a weighted average of their individual goals. In plain English: a good marriage requires compromise. You take what Priya wants, you take what Daniel wants, and you find the sum.

  But there is a catch. And this is the part that matters for tonight.

  Almost everyone who cites this theorem stops at the compromise part. They say, "See? Love is just adding up your utilities." But the math is stricter than that. The theorem only holds true if Priya and Daniel agree on the probabilities of the world around them. It assumes they share the same view of reality. It assumes that when they look at the future, they see the same risks, the same opportunities, and the same likelihoods of things going right or wrong.

  If their views of reality diverge—if one sees a storm coming and the other sees clear skies—you can't just average their preferences. The math breaks down. The aggregation fails.

  So, the real lesson of Harsanyi isn't about compromise. It's about alignment. It's not enough to respect what the other person wants. You have to work, tirelessly, to see the world the way they see it. You have to update your beliefs until your priors match. You have to look at the uncertainties of life—the careers, the health, the family, the unknown—and agree on what is real, together.

  That is a much higher bar than simple compromise. It requires a level of communication and trust that is rare in any context, let alone a marriage. But looking at them, I know they are up for it.

  The theorem says your household utility is a weighted sum of your individual utilities. Now, I haven't seen Daniel's calculations, but I'm going to assume he assigned the higher weight to Priya's utility function.

  But in all seriousness, my wish for you is not just that you maximize your joint happiness. I wish for you the harder thing. I wish you the courage to constantly align your vision of the world. May your arguments be short, may your priors converge, and may you always find that you are looking at the same horizon, even when the path there is uncertain.

  Please raise your glasses. To Priya and Daniel: may your probabilities be common, and your love be certain. To the couple!
