      *   **Lewis's Objection to Armstrong:** The "Inference Problem" (van Fraassen's label, often associated with Lewis's critique). Does $N(F,G)$ actually entail $\forall x (Fx \to Gx)$? Why call it "necessitation" if it doesn't guarantee the regularity?
      *   **Armstrong's Objection to Lewis:** The "Explanation Problem" (or circularity). BSA makes laws depend on instances, so laws can't explain instances. Also, the "Natural Properties" objection (smuggling in non-Humean structure).
