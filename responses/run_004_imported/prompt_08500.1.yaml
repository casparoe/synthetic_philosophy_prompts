prompt: |-
  So this semester I'm taking a research methods class for my psych major, and last week we spent basically a whole lecture on Simpson's paradox -- my professor's big line was that the paradox doesn't actually get "solved" by crunching more numbers, it gets solved by figuring out the causal story behind why the groups differ in the first place, which I'm still chewing on. Anyway, I ended up arguing about this with my roommate last night because it turns out to be extremely relevant to something happening on the Learning Support Advisory Committee, which I sit on as the student rep.

  Here's the situation: the committee has to decide by next Tuesday whether to renew, expand, or cut funding (about $80k/year) for our college's Supplemental Instruction (SI) program, where upperclassmen run extra study sessions attached to specific gateway courses. The provost's office gave us the pass-rate data, and depending on how you slice it, it tells opposite stories. Overall, across the whole student body, kids who went to SI passed their course at about 77% (347/450) vs about 86% (475/550) for non-attendees -- so on paper SI attendees do worse, and two committee members want to kill the program over this. But broken down by course it flips: in Calc I, SI attendees passed at 75% (300/400) vs 65% (65/100) for non-attendees, and in Intro Psych, SI attendees passed at 94% (47/50) vs about 91% (410/450) for non-attendees -- SI attendees do better in both courses individually. The reversal happens because SI attendance is way more concentrated in Calc I (which has a much lower baseline pass rate for everybody, SI or not) than in Psych. Our committee chair pointed this out and wants to expand SI, but the member who wants to cut it says breaking the data down by course just lets us keep slicing it until we land on whatever story we already wanted, and that the trustees are only ever gonna ask about the topline number anyway.

  I have to actually write the one-page recommendation memo for Tuesday, and I dont want to just yell "Simpson's paradox!" and call it a day -- I want it to seriously engage with the "you're just cherry-picking your slice" objection, since it kind of nags at me too even though I suspect it's wrong here. Could you draft that memo for me: a clear recommendation with a timeline for how we'd check it's actually working, and reasoning solid enough that it'd definately survive being read out loud to the one committee member who thinks this is all statistical sleight of hand?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Psychology major, Research Methods class. Learned about Simpson's Paradox (causal story > just numbers).
      *   **Situation:** Student rep on Learning Support Advisory Committee. Decision needed by next Tuesday on Supplemental Instruction (SI) program funding ($80k/year).
      *   **The Data (Simpson's Paradox in action):**
          *   *Overall:* SI attendees pass rate 77% (347/450) < Non-attendees 86% (475/550). (SI looks bad).
          *   *Calc I:* SI attendees 75% (300/400) > Non-attendees 65% (65/100). (SI looks good).
          *   *Intro Psych:* SI attendees 94% (47/50) > Non-attendees 91% (410/450). (SI looks good).
          *   *Confounding Variable:* Course difficulty/enrollment distribution. SI is concentrated in hard courses (Calc I), Non-SI in easier courses (Psych).
      *   **The Conflict:** Chair wants to expand (based on stratified data). One member wants to cut (based on topline data + "cherry-picking" objection).
      *   **Task:** Write a one-page recommendation memo.
      *   **Requirements:** Clear recommendation, timeline for checking effectiveness, reasoning that addresses the "cherry-picking/slicing" objection (engaging with the causal story aspect from the psych class), robust enough to withstand scrutiny from the skeptical member.

  2.  **Deconstruct the Statistical Argument:**
      *   *The Paradox:* The aggregate data is misleading because the groups (SI vs. Non-SI) are not comparable at the baseline. SI attracts students in harder classes.
      *   *The "Cherry-Picking" Objection:* The skeptical member argues that stratifying by course is arbitrary. Why not stratify by major, GPA, time of day?
      *   *The Rebuttal (Causal Story):* In research methods terms, "Course" isn't just a random slice; it's a *confounding variable* that affects both the treatment (SI attendance) and the outcome (Pass Rate).
          *   *Path A:* Hard Course -> Higher likelihood of seeking SI.
          *   *Path B:* Hard Course -> Lower likelihood of Passing.
          *   Therefore, comparing SI vs. Non-SI without controlling for Course compares "Students in Hard Classes" vs. "Students in Easy Classes."
      *   *Why Course is the Right Slice:* SI is *attached* to specific courses. It is structurally impossible to attend SI for a course you aren't in. Therefore, course-level analysis is the unit of analysis for the program's effectiveness, not the student body aggregate.

  3.  **Drafting Strategy - The Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the decision immediately (Renew & Expand).
      *   **The Data Analysis (The "Why"):** Explain the paradox without using jargon like "Simpson's Paradox" (or use it sparingly with explanation). Focus on *comparability*.
      *   **Addressing the Skeptic:** Directly tackle the "slicing" objection. Explain *why* course-level data is the valid metric (causal mechanism) vs. aggregate data (selection bias).
      *   **Implementation/evaluation Plan:** Propose a timeline and metrics to prove it's working moving forward (pre/post, matched controls, etc.).
      *   **Tone:** Professional, evidence-based, persuasive but respectful of the fiscal concern.

  4.  **Drafting - Section by Section:**

      *   *Header:* Keep it formal.
      *   *Recommendation:* Renew and Expand.
      *   *Analysis:* Present the numbers clearly. Show the aggregate vs. stratified.
      *   *The "Slicing" Counter-Argument:* This is the core. I need to explain that we aren't slicing to find a positive result; we are slicing to ensure *apples-to-apples* comparison. The aggregate compares students in Calc I (hard) to students in Psych (easier). That's a selection bias issue, not a program failure.
      *   *Causal Logic:* SI is course-specific. Therefore, efficacy must be measured course-specific.
      *   *Future Verification:* How do we stop this argument next year?
          *   Track GPA/Incoming risk factors.
          *   Survey data (student perception).
          *   Pilot expansion carefully.
      *   *Budget:* Acknowledge the $80k.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "Course is the causal variable" too academic?
      *   *Fix:* Frame it as "Program Design." The SI program is designed *per course*. Evaluating it *across courses* ignores its design.
      *   *Critique:* The skeptic says trustees only look at topline numbers.
      *   *Fix:* Acknowledge this risk. Propose that the *reporting* to trustees should highlight the risk-adjusted success rate, or explain the enrollment disparity so the topline number isn't misinterpreted. Better yet, change *how* we collect data so the topline number becomes valid (e.g., encouraging SI in easier classes too, or weighting the data). Let's stick to weighting/explaining for the memo to keep it actionable.
      *   *Key Insight from Psych Class:* The professor said "figure out the causal story." The causal story here is: Students don't choose SI randomly; they choose it when they struggle or when the class is hard. The "treatment" is not randomly assigned. Therefore, observational data requires controlling for the confound (Course Difficulty).

  6.  **Final Polish:**
      *   Ensure the math checks out (300+47 = 347, 400+50=450, etc.).
      *   Keep it to one page (visually).
      *   Make the "Next Steps" concrete.

  7.  **Final Review against constraints:**
      *   One-page memo? (Will aim for ~500-600 words).
      *   Clear recommendation? (Yes).
      *   Timeline for checking? (Yes).
      *   Addresses "cherry-picking" objection? (Yes, via the "Apples-to-Apples" argument).

  *(Self-Correction on the Math)*:
  Calc I: SI 300/400 (75%), Non 65/100 (65%).
  Psych: SI 47/50 (94%), Non 410/450 (91.1%).
  Total SI: 347/450 (77.1%).
  Total Non: 475/550 (86.3%).
  Wait, let's check the denominators.
  SI Total N = 400 + 50 = 450. Correct.
  Non-SI Total N = 100 + 450 = 550. Correct.
  The math holds. The paradox is valid.

  *(Refining the "Cherry-Picking" Rebuttal)*:
  The skeptic says "you can slice until you win."
  The counter is: "We aren't slicing to win; we are slicing to control for selection bias."
  Analogy: Comparing mortality rates of two hospitals. If Hospital A takes all the trauma cases and Hospital B takes only routine checkups, Hospital A will have a higher death rate overall. You must compare within injury types. Here, Calc I is the "Trauma Center."

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Learning Support Advisory Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Supplemental Instruction (SI) Funding

  **Recommendation**
  I recommend the Committee **renew and conditionally expand** funding for the Supplemental Instruction (SI) program. While aggregate pass-rate data suggests SI attendees underperform, a stratified analysis reveals the program is effective within specific courses. The aggregate data reflects student self-selection into difficult courses, not program failure.

  **Data Analysis & The "Slicing" Objection**
  The concern regarding data manipulation is valid; stratifying data arbitrarily can indeed manufacture trends. However, in this instance, stratifying by course is not "cherry-picking," but rather controlling for a **confounding variable**.

  SI is not a general resource; it is attached to specific gateway courses. Attendance is driven by course difficulty.
  *   **Calc I:** High difficulty, high SI uptake (89% of SI attendees).
  *   **Intro Psych:** Lower difficulty, low SI uptake (11% of SI attendees).

  Comparing the *overall* SI pass rate (77%) to the *overall* non-SI pass rate (86%) compares students in high-risk courses against students in low-risk courses. This is a selection bias issue. To use an analogy: If Hospital A specializes in trauma and Hospital B specializes in routine care, Hospital A will have a higher overall mortality rate. Judging Hospital A as "worse" without adjusting for patient severity would be incorrect. Similarly, judging SI by aggregate data ignores the "severity" (difficulty) of the courses served.

  When we compare apples-to-apples (within courses), SI attendees outperform non-attendees in both Calc I (+10%) and Intro Psych (+3%).

  **Implementation & Evaluation Timeline**
  To address concerns about future data interpretation and ensure fiscal accountability, I propose the following evaluation framework for the expanded program:

  1.  **Risk-Adjusted Reporting (Spring Semester):**
      *   Moving forward, pass rates will be reported *by course* rather than as a student-body aggregate.
      *   We will collect incoming GPA data for SI attendees vs. non-attendees to ensure we are comparing students of similar academic risk profiles, further neutralizing selection bias.

  2.  **Pilot Expansion (Next Academic Year):**
      *   Expand SI to two additional high-failure gateway courses.
      *   Funding for these specific expansions will be contingent on a mid-semester review showing SI attendance correlates with improved exam scores relative to matched controls (students with similar incoming GPAs who do not attend).

  3.  **Trustee Reporting Strategy:**
      *   To prevent the "topline number" issue raised by the Committee, the final report to the Trustees will explicitly contextualize the aggregate pass rate. We will present the "Weighted Success Metric," which accounts for the baseline difficulty of the courses served, ensuring the Trustees understand that lower aggregate pass rates indicate the program is successfully targeting the hardest classes.

  **Conclusion**
  Cutting funding based on the aggregate number would penalize the program for successfully attracting students in the courses where they struggle most. By renewing funding with the evaluation safeguards above, we ensure the program remains effective and the data remains transparent.

  **Decision Required:** Approval to renew $80k base funding + authorization to draft expansion pilot criteria by December 1.
