      *Re-evaluating the "Immortality" point:* The Flying Man establishes the soul is a substance *independent* of the body. Immortality follows from that independence *plus* other metaphysical claims (that the soul is not inherently corruptible). Saying the Flying Man *is* the proof of immortality is a slight conflation. I'll note it but not dock heavily.
