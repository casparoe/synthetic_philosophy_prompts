      *   **Constraint:** Need to ensure consistency with other TAs (calibration).
      *   **Output Format:** Grade (out of 20 + letter), point-by-point analysis (solid vs. shaky), specific margin comments, preferably a rubric structure (JSON or clear text).
      *   **Key Question:** "Explain Avicenna's 'flying man'... what it establishes... compare to Descartes' cogito. Are they making the same move?"

  2.  **Analyze the Student Answer:**
      *   *Part 1: Avicenna's Scenario.* "created fully mature in a single instant, floating in empty space... eyes covered... limbs held apart... no sensory contact." -> **Accurate.** This is the standard description of the *Flying Man* (al-insan al-muhallaq).
      *   *Part 2: What it Establishes.* "affirm his own existence... immediate awareness of himself... doubting whether his body exists." -> **Accurate.** It establishes self-awareness independent of the body. "soul is a substance really distinct from the body." -> **Mostly Accurate.** Avicenna uses it to show the soul's *substantiality* and *immateriality* (self-subsistence). "proof that the soul... must be immortal." -> **Slightly Shaky/Overstated.** While immateriality implies incorruptibility for Avicenna, the *Flying Man* specifically targets self-awareness and substantiality. Immortality is a downstream consequence, not the immediate point of the thought experiment itself (which is epistemological/ontological regarding the *nature* of the soul).
      *   *Part 3: Comparison to Descartes.* "Avicenna is doing basically what Descartes does in the Second Meditation: stripping away everything that can be doubted... until only the certainty of the self is left standing." -> **Problematic.** This is the "Cartesian interpretation" of Avicenna, which is historically anachronistic and philosophically contested. Avicenna isn't doing methodological skepticism. He's doing intuitive self-verification (*tahqiq*). Descartes is doing epistemic foundationalism via doubt.
      *   *Part 4: "Are the two philosophers making the same move?"* "From this shared method both philosophers draw the same conclusion..." -> **Incorrect/Too Simplistic.** They reach similar *conclusions* (mind/soul distinct from body), but the *move* is different. Avicenna: Primordial self-awareness (you don't need to *infer* existence). Descartes: Inference from thinking (*cogito, ergo sum*). Avicenna isn't doubting to find certainty; he's pointing out a pre-existing certainty.
      *   *Overall:* Good description of the scenario. Good grasp of the conclusion (dualism). Weak/Nuanced understanding of the *methodological* difference between Avicenna and Descartes. It treats them as identical proto-Cartesians, which is a common undergrad simplification but misses the specific prompt asking "Are they making the same move?"

  3.  **Determine the Grading Standard (Calibration):**
      *   *20 Points Total.*
      *   *Breakdown:*
          *   Avicenna Scenario (5 pts)
          *   Avicenna's Conclusion/Establishment (5 pts)
          *   Descartes Comparison (Similarities) (5 pts)
          *   Descartes Comparison (Differences/"Same Move?") (5 pts)
      *   *Alternative Breakdown:*
          *   Avicenna Explanation (10 pts)
          *   Descartes Comparison (10 pts)
      *   *Let's go with a balanced approach:*
          1.  Accuracy of Flying Man Scenario (5)
          2.  Accuracy of Avicenna's Conclusion (5)
          3.  Accuracy of Descartes' Cogito (5)
          4.  Critical Comparison (The "Same Move?" question) (5)

  4.  **Evaluate the Student Answer against the Breakdown:**
      1.  *Scenario (5/5):* Nailed the sensory deprivation details.
      2.  *Avicenna's Conclusion (4/5):* Gets substance dualism right. Slightly conflates immediate self-awareness with a proof of immortality (which requires more premises), but acceptable for intro level. Let's say 4.5.
      3.  *Descartes' Cogito (4/5):* Describes the "stripping away" (methodological doubt) correctly enough for a summary.
      4.  *Critical Comparison (2/5):* This is the weak point. The prompt asks "Are they making the same move?" The student says "Yes... shared method." Most scholars (and likely the professor in a course bridging Medieval/Early Modern) would want the student to notice that Avicenna is *not* using skepticism. Avicenna says "You *already* know yourself," Descartes says "I must *discover* I exist through reasoning." The student misses the epistemic vs. ontological nuance.

      *   *Total:* 5 + 4.5 + 4 + 2 = 15.5/20. Let's round to 15 or 16 depending on generosity. Given the "same move" error is significant in a philosophy course, 15/20 (B) feels fair. It shows reading but lacks critical nuance.

  5.  **Drafting the Feedback:**
      *   *Tone:* Constructive, specific, calibrated for TA consistency.
      *   *Key Distinction to Highlight:* Avicenna = Intuition/Presence (no inference needed). Descartes = Inference/Argument (I think, *therefore* I am). Avicenna = No doubt involved. Descartes = Hyperbolic doubt.
      *   *Margin Comments:* Need to be punchy and reference specific lines.

  6.  **Formatting:**
      *   The user asked for JSON if convenient, but "whatever format makes the reasoning clearest." A structured text report with a JSON summary at the end might be best for copy-pasting into a grading canvas/LMS while keeping the reasoning clear for the TA. Actually, a clear text rubric is often easier to read than raw JSON. I will provide a structured text breakdown *and* a JSON object for easy data entry if they use a script.
      *   Wait, the prompt asks: "if it's easy for you to lay it out as a little rubric... that would be great, as JSON if that's convenient, but honestly whatever format makes the reasoning clearest is fine." I will prioritize clarity for the TA's understanding, then provide the JSON.

  7.  **Refining the Critique (Self-Correction):**
      *   *Is the student wrong about immortality?* Avicenna does argue for immortality based on the soul's subsistence. The Flying Man is the *start* of that argument. I shouldn't penalize too heavily there.
      *   *Is the "Same Move" verdict definitely wrong?* Some scholars (like Dag Hasse) argue there are strong continuities. However, in an *intro* course, the standard distinction is usually: Avicenna = Self-awareness without inference; Descartes = Inference from activity. The student says "shared method... stripping away." Avicenna doesn't "strip away" via doubt; he imagines a *scenario* to isolate attention. Descartes *doubts* to find indubitable truth. The distinction is crucial. I will mark down on the "Same Move" section.
      *   *Grade:* 15/20 seems right. It's a B. Good summary, weak analysis.

  8.  **Finalizing the Output:**
