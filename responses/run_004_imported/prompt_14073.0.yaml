      *   **Key Figures/Studies:** Daryl Bem (2011), Wagenmakers et al. (Bayesian critique), Galak et al. (Frequentist replication), Andrew Gelman (Garden of Forking Paths).

  2.  **Deconstruct the Arguments:**
      *   *The Pro-Bayes Argument:* Wagenmakers et al. showed that Bem's $p < .05$ results often corresponded to Bayes Factors ($BF_{10}$) that were anecdotal or weak ($< 3$). NHST asks "Is the data unlikely under the null?" Bayes asks "Is the data more likely under the alternative than the null?" The latter penalizes vague predictions and low power more effectively.
      *   *The Pro-Practices Argument:* Gelman and others argue that a Bayesian analysis using the same "garden of forking paths" (p-hacking, selective reporting, post-hoc decisions) will yield misleading Bayes Factors just as easily as misleading p-values. If you try 20 models and report the one with the best BF, you've hacked the BF.
      *   *The Replication Reality:* Galak et al. (2012) used standard frequentist methods on large samples and found null effects. This suggests the problem wasn't just the *metric* (p vs. BF), but the *signal* (or lack thereof).

