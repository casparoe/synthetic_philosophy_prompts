      *   *Actually, let's look at the math.* Wagenmakers showed Bem's evidence was weak. But Galak showed the effect was zero. If the effect is zero, NHST says "sometimes significant by chance," Bayes says "evidence for null." Bayes *can* quantify evidence for the null. NHST cannot. That is a specific advantage.
      *   *Revised Thesis:* The verdict should be: **Bayesian methods provide a better *language* for uncertainty, but they are not a *bulwark* against bias.** The replication crisis was caused by flexibility, not formula. Therefore, the moral is: **Fix the process (preregistration), not just the math.** But I need to acknowledge where Bayes helps.
      *   *Final Decision:* I will argue that viewing Bayes as a "fix" is a category error. The Bem episode proves that **no statistical framework can compensate for uncontrolled researcher degrees of freedom.** The verdict: **Methodological constraints (preregistration) are the necessary condition for truth; statistical framework is secondary.** I will argue that Bayes is *better* at admitting ignorance, but not *immune* to manipulation.

  4.  **Drafting - Section by Section:**
