answer: |-
  **The Statistical Savior That Wasn't: Why the Bem Saga Is About Process, Not Philosophy**

  The story of Daryl Bem's 2011 paper, "Feeling the Future," has hardened into a convenient fable for the statistics community. In the standard telling, the gods of Frequentism smiled upon a impossible claim: nine experiments, clean $p$-values under .05, and a peer-reviewed publication in a top journal suggesting humans can sense erotic images before they appear on a screen. Then came the Bayesian cavalry. Eric-Jan Wagenmakers and his colleagues re-analyzed Bem's data using Bayes factors, demonstrating that what looked like "significance" was actually anecdotal evidence at best. The moral usually drawn from this is seductive: Null Hypothesis Significance Testing (NHST) is a broken engine that lets pseudoscience pass, while Bayesian inference is the safety brake that stops us from believing in magic.

  It is a comforting narrative because it suggests the replication crisis was a mathematical error, solvable by swapping one formula for another. But this narrative collapses under the weight of what happened next. When Galak and colleagues ran large-scale, preregistered replications of Bem's work using standard frequentist tests, the effect vanished. Furthermore, statisticians like Andrew Gelman have demonstrated that the "Garden of Forking Paths"—the multitude of small, subjective decisions researchers make during analysis—can manipulate Bayesian outcomes just as easily as $p$-values.

  The Bem episode does not vindicate Bayesian statistics as a systemic firewall against false positives. The actual verdict is sharper and less comforting: **The replication crisis was a crisis of flexibility, not frequency. No statistical framework, however coherent, can compensate for uncontrolled researcher degrees of freedom. The fix is not better math; it is stricter process.**

  To understand why the "Bayesian solution" is a category error, we must acknowledge what Bayes factors actually did in the Bem saga. Wagenmakers was correct that Bem's data, taken at face value, provided weak evidence for the alternative hypothesis compared to the null. NHST asks, "Is the data unlikely assuming the null is true?" Bayes asks, "Is the data more likely under the alternative than the null?" The latter is indeed a more rigorous question. It penalizes vague predictions and low power, and it allows researchers to quantify evidence *for* the null, something $p$-values cannot do. In a vacuum, where data is collected and presented honestly, Bayesian inference is a superior language for uncertainty.

  However, the Bem data was not collected in a vacuum. It was collected in a system that rewarded novelty and punished null results. This is where the "Garden of Forking Paths" becomes fatal to the idea of Bayesian immunity. Gelman's argument is straightforward: if a researcher has enough degrees of freedom—deciding which outliers to exclude, which covariates to include, when to stop collecting data—they can navigate that garden until they find a path that yields a desired result.

  Crucially, this applies to Bayes factors just as it does to $p$-values. A researcher can "BF-hack." They can try different priors, exclude different participants, or analyze subsets of the data until the Bayes Factor crosses the threshold of "substantial evidence" ($BF > 3$ or $BF > 10$). If the underlying workflow allows for post-hoc storytelling, a Bayes factor is not a measure of objective evidence; it is merely a different currency for the same inflation. Switching from frequentism to Bayesianism without fixing the incentive structure is like replacing a flimsy lock on a door that you leave wide open. The security upgrade is irrelevant if the breach point is the workflow, not the math.

  The Galak replications drive this point home. They did not use Bayesian methods; they used the very frequentist tests that supposedly "failed" with Bem. Yet, they found nothing. Why? Because they removed the flexibility. They preregistered their sample sizes, their exclusion criteria, and their analysis plans. They closed the garden gates. The fact that frequentist methods produced true negatives when the process was constrained proves that the $p$-value was not the primary vector of infection. The vector was the ability to tune the analysis until the signal appeared.

  Therefore, viewing Bayesian statistics as the "cure" for the replication crisis is dangerous. It encourages a form of statistical alchemy—the belief that pouring better equations over dirty data will purify it. It allows institutions to feel they are addressing the crisis by adopting new software while maintaining the same publish-or-perish incentives that drive $p$-hacking. If we teach graduate students that Bayes factors are "safer," we risk creating a new generation of researchers who believe their subjective analytical choices are justified because they are reporting $BF_{10}$ instead of $p$.

  This is not to say the switch to Bayesian methods is worthless. It is a meaningful upgrade in *communication*. Bayes forces researchers to be explicit about their priors and allows them to distinguish between "absence of evidence" and "evidence of absence." In the long run, a scientific culture that thinks in terms of updating probabilities rather than binary significance thresholds is healthier. But this is a cultural shift, not a procedural safeguard.

  The hard verdict on the Bem saga is this: **Methodological hygiene is the necessary condition for truth; statistical philosophy is secondary.** Preregistration, open data, and constrained degrees of freedom are the vaccines. Bayesian inference is merely a vitamin—it might improve your health, but it won't save you from the plague if you keep drinking contaminated water.

  The replication crisis taught us that human ingenuity in finding patterns is infinite, but the truth is fragile. Bem's results weren't a failure of Fisher's math; they were a success of human flexibility. We cannot math our way out of bias. We must regulate our way out of it. The moral of the story is not that we need to change how we calculate; it is that we need to change how we work. Until the process is locked down, the philosophy of the calculation is just aesthetics.
