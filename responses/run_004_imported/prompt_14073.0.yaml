      *Wait, one more nuance:* Bayes *does* handle the "evidence for null" better. In the replication crisis, knowing when to *stop* claiming an effect is key. NHST says "fail to reject." Bayes says "evidence for null." That *is* a meaningful difference. I should incorporate that. But does it solve the crisis? No.
      *Okay, final plan:* The verdict is that Bayes is a **better diagnostic tool**, but Preregistration is the **only cure**. Relying on Bayes alone is dangerous.

