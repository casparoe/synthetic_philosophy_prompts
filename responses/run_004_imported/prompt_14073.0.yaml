      *   **The Core Mechanism of Failure:** Why did Bem pass? Not because $p < .05$ is evil, but because the *process* allowed tuning until $p < .05$. The incentive structure rewards novelty over accuracy.
      *   **The Verdict:** Be explicit. Bayes is not the vaccine. Preregistration is. Bayes is a vitamin.
