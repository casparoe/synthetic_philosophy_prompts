answer: |-
  You have correctly identified the pressure point. The "collapse objection" is not just a casual worry; it is the central technical challenge for supervaluationism. Your intuition that it risks becoming "epistemicism in a trenchcoat" is shared by many metaphysicians, including Timothy Williamson himself, who argues that supervaluationism *is* a species of epistemicism once you formalize the semantics rigorously.

  However, the dialectic is more nuanced than a simple surrender. To get the gears-level view, we need to look at the interaction between the **determinacy operator**, the **meta-logic**, and the **semantics of admissibility**.

  Here is the breakdown of the higher-order vagueness problem, the collapse argument, and the available escape routes.

  ### 1. The Formal Setup and the First Crack
  Standard supervaluationism defines truth via a set of admissible precisifications, $P$.
  *   $\phi$ is **True** iff $\forall p \in P, [\phi]_p = 1$.
  *   $\phi$ is **False** iff $\forall p \in P, [\phi]_p = 0$.
  *   $\phi$ is **Indeterminate** otherwise.

  We introduce a determinacy operator $D$, where $D\phi$ means "$\phi$ is determinately true." In supervaluationist semantics, $D\phi$ is true iff $\phi$ is true in all $p \in P$.

  **The First-Order Issue:** This handles the borderline between "heap" and "not heap."
  **The Higher-Order Issue:** Consider the boundary between "determinately a heap" ($D\phi$) and "merely indeterminate" ($\neg D\phi \land \neg D\neg\phi$). Is *that* boundary sharp?

  Intuitively, no. There should be borderline cases of determinacy (cases where it's vague whether the claim is determinately true). This is **higher-order vagueness**.

  ### 2. The Collapse Mechanism (Williamson's Attack)
  The collapse objection relies on the commitment to **classical logic in the meta-language**.

  Supervaluationists typically want to preserve classical logic for the object language (to save $P \lor \neg P$). To define the semantics (truth in all $p \in P$), they use standard model theory, which is built on classical set theory.

  **The Argument:**
  1.  **Classical Meta-Theory:** In classical set theory, for any precisification $p$, it is either an element of $P$ or it is not. There is no "indeterminate membership" in a standard set.
  2.  **Sharp Boundary of $P$:** Therefore, the boundary between admissible and inadmissible precisifications is sharp.
  3.  **Sharp Boundary of $D$:** Since $D\phi$ is defined by quantification over $P$, the transition from $D\phi$ being true to $D\phi$ being false must occur at a specific point in the sorites series.
  4.  **Iteration:** If you iterate $D$ ($D, DD, DDD...$), classical logic dictates that for any sorites series, there is some $n$ such that $D^k \phi(n)$ is true and $D^k \phi(n+1)$ is false.
  5.  **Conclusion:** There is a sharp cutoff for *every* order of determinacy.

  **Why this looks like Epistemicism:**
  Epistemicism says: There is a sharp cutoff for "heap," but we cannot know it.
  Supervaluationism (under collapse): There is a sharp cutoff for "admissible precisification," but we cannot know it (because usage underdetermines it).

  If the only difference is that the sharp cutoff is located at the level of *semantic facts* (which precisifications are admissible) rather than *worldly facts* (how many grains make a heap), the structural isomorphism is nearly perfect. We are constitutionally incapable of knowing the boundary of $P$ just as Williamson says we are incapable of knowing the boundary of "heap." Hence: Epistemicism in a trenchcoat.

  ### 3. The Supervaluationist Defenses (The Escape Routes)
  Supervaluationists are aware of this. To avoid the collapse, they must block one of the premises above. There are three main "gears" they can tweak.

  #### A. Rejecting Classical Meta-Logic (The Hard Line)
  Some (like Hartry Field) argue that if vagueness is genuine, it must infect the meta-language too. You cannot use classical set theory to model vagueness without distorting it.
  *   **The Move:** Use a non-classical meta-logic (e.g., fuzzy logic or intuitionistic logic) to define the set $P$. Membership in $P$ becomes a matter of degree.
  *   **The Cost:** This makes the semantics incredibly difficult to state. You end up needing a semantics for the semantics, risking an infinite regress. If you say "membership in $P$ is vague," you need a super-set $P^*$ to define that vagueness, and so on.
  *   **Verdict:** This avoids epistemicism but threatens to make the theory inexpressible.

  #### B. Global Validity vs. Local Validity (The Technical Dodge)
  This is the most sophisticated technical defense (championed by Rosanna Keefe and others). It distinguishes between **local validity** (truth preservation at every precisification) and **global validity** (truth preservation of the super-truth).
  *   **The Move:** Supervaluationists can argue that while classical logic holds *locally* (within each $p$), it fails *globally* (for the super-truth values).
  *   **Application to Higher-Order:** They argue that the inference rules for $D$ (like $D\phi \to DD\phi$) might fail globally even if they hold locally. This allows them to deny that there is a specific $k$ where $D^k$ cuts off, without denying classical logic within the precisifications.
  *   **The Cost:** It creates a disconnect between the logic we use to reason *about* vagueness and the logic *of* vagueness. It makes the consequence relation non-transitive in some contexts, which is a bitter pill for classical logicians.

  #### C. Contextualism / Shifting $P$ (The Dynamic Dodge)
  Philosophers like Diana Raffman argue that $P$ is not fixed.
  *   **The Move:** The set of admissible precisifications shifts depending on context. When you focus on a borderline case, the context shifts to make that case indeterminate. When you ask "is it determinately true?", the context shifts again.
  *   **Why it helps:** There is no *single* sharp cutoff because the cutoff moves when you try to locate it. The "sharp boundary" exists only relative to a static context, but competent usage never allows the context to remain static during a sorites reasoning.
  *   **Verdict:** This explains the *phenomenology* of vagueness well but struggles to provide a static semantic model. It dissolves the problem rather than solving it within a fixed model.

  ### 4. Is the Collapse Objection "Correct"?
  It depends on what you mean by "correct."

  **Structurally:** Yes. If you demand a rigorous model-theoretic semantics using standard mathematics, supervaluationism posits a sharp boundary for the set $P$. Since we cannot access $P$ via usage (otherwise usage would determine a single precisification), $P$ is unknowable. This is structurally identical to Williamson's epistemicism.

  **Metaphysically:** Maybe not.
  *   **Williamson's Epistemicism:** The sharp cutoff is a **brute fact**. It is a feature of reality (or the meaning relation) that is robust and fixed.
  *   **Supervaluationism:** The sharp boundary of $P$ is an **artifact of the model**. The supervaluationist can argue: "I am not claiming there *is* a sharp set $P$ in reality. I am claiming that 'truth' is defined as truth-in-all-admissible-precisifications. The fact that my *model* of admissibility uses a sharp set is a limitation of set theory, not a claim about the world."

  However, this defense is precarious. If the model doesn't reflect the reality of the semantics, what does? If there is no fact of the matter about which precisifications are admissible, then the truth conditions for vague sentences are themselves indeterminate. But if truth conditions are indeterminate, how can we assert the theory as true?

  ### 5. The "Trenchcoat" Verdict
  The collapse objection holds water **if** you assume that a semantic theory must provide a determinate account of truth conditions.

  If supervaluationism says, "Truth is determined by $P$," and $P$ has a sharp boundary we can't know, then we are ignorant of the truth conditions. That is epistemicism about semantics.

  **The Principled Reason it might *not* be Epistemicism:**
  Epistemicism claims the ignorance is **in principle** (constitutional). Supervaluationism can claim the "ignorance" regarding $P$ is **conceptual**. It's not that there is a fact we can't see; it's that the question "Is $p$ *really* in $P$?" is a category mistake. $P$ is a theoretical construct to model the behavior of 'true', not a natural kind we are failing to detect.

  **Summary of the Dialectic:**
  1.  **Williamson:** Your semantics requires a set $P$. Sets have sharp boundaries. Therefore, you posit sharp boundaries. Since usage doesn't fix them, they are unknowable. You are an epistemicist.
  2.  **Supervaluationist:** $P$ is a tool for defining truth, not an ontological commitment. The sharpness is in the model, not the phenomenon.
  3.  **Williamson:** If the sharpness is only in the model, your model fails to capture higher-order vagueness. If the sharpness is in the phenomenon (to capture higher-order vagueness), you are an epistemicist.
  4.  **Supervaluationist:** We reject classical meta-logic / We adopt contextualism / We distinguish global validity.
  5.  **Williamson:** Those moves render your theory unable to explain why classical logic works so well in ordinary discourse, or they lead to regress.

  **Bottom Line:** The collapse objection is technically sound against **classical** supervaluationism. To survive, supervaluationism must become **non-classical** (changing the meta-logic) or **pragmatic** (contextualism). If it stays classical and semantic, the "trenchcoat" charge sticks: it is epistemicism about semantic boundaries rather than worldly boundaries. Most contemporary consensus leans toward the view that pure supervaluationism cannot solve higher-order vagueness without either collapsing or retreating into a more radical non-classical logic (like fuzzy logic or intuitionism), at which point it ceases to be standard supervaluationism.
