prompt: |-
  Ok so this isn't a philosophers' dispute, just something that happened among friends, but it's got me thinking about standing to blame and I can't shake it. Backstory: Marco has spent the past year telling our friend Deniz that cheating on a partner is a real betrayal and basically makes you a bad person -- Deniz has cheated on his girlfriend twice now and Marco's been pretty blunt about it with him. Last month it came out that Marco cheated on an ex back in college. He's never hidden it exactly, but never brought it up either, and he says he felt terrible at the time and told his ex what happened.

  Two other friends of mine, Nadia and Theo, ended up going a few rounds about whether Marco still has standing to give Deniz grief over this:

  (1) Nadia said it's just straightforwardly hypocritical -- you don't get to moralize about a sin you've committed yourself, so Marco should really shut up about it.
  (2) Theo said the cases aren't parallel: Marco did it once, years ago, owned it and apologized at the time; Deniz is doing it now and shows no sign of stopping. Theo said that's exactly the difference between having a skeleton in your closet and actually claiming an exception for yourself -- Marco isn't doing the second thing anymore, wheras Deniz would be if he turned around and criticized someone else for it.
  (3) Nadia said the apology is beside the point -- Marco still got the benefit of cheating without consequences back then, and realizing later it was wrong doesn't undo that. If anything, knowing better and doing it anyway is worse, not better.
  (4) Theo said that's an argument about whether Marco is a good person overall, which isn't the same question as whether he has standing to make this particular complaint -- and owning your past wrongdoing is exactly what keeps it from being a live exception-claim.
  (5) Nadia's comeback was that Marco never actually said any of this remorse stuff to Deniz's face -- he just lectured him like a guy with clean hands. So whatever's true about Marco's private history, it wasn't doing any work in the actual exchange, and the message Deniz got was still 'I'm better than you,' which is supposed to be what sinks your standing in the first place.

  I teach the blame / moral responsibility material most years and my instinct is this is definately a better test case than the stock ones, but I genuinely go back and forth on who's winning at each step. Could you go through moves (1)-(5) and say who's got the better of it each time, plus flag anything you think both of them are missing? Not just an overall winner -- I want the blow-by-blow.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A dispute among friends (Marco, Deniz, Nadia, Theo) about "standing to blame."
      *   **Scenario:** Marco condemns Deniz for cheating. Marco cheated in college (once, confessed, remorseful). Deniz is currently cheating (twice, unrepentant/ongoing).
      *   **The Debate:** Nadia (argues Marco lacks standing due to hypocrisy) vs. Theo (argues Marco has standing due to reform/distinction).
      *   **Task:** Analyze moves (1) through (5) blow-by-blow. Determine who has the better argument at each step. Flag missing considerations. Avoid just picking an overall winner.
      *   **User Persona:** Teaches blame/moral responsibility material. Wants philosophical rigor applied to a real-world case.

  2.  **Deconstruct the Philosophical Core:**
      *   **Topic:** Standing to Blame (a sub-topic of Moral Responsibility).
      *   **Key Concept:** Hypocrisy. Does being a hypocrite rob you of the standing to blame others?
      *   **Key Distinction:** *Tu Quoque* (you too) fallacy vs. Moral Standing. Just because someone did X doesn't mean X isn't wrong, but does it mean *they* can't say it's wrong?
      *   **Relevant Literature (Mental Check):** Bell (2013), Fritz & Miller (2018), Todd (2012), Wallace (2010). Concepts: Commitment to norms, superiority claims, forgiveness/reform.

  3.  **Analyze Each Move:**

      *   **Move (1) Nadia:** "Straightforwardly hypocritical -- you don't get to moralize about a sin you've committed yourself."
          *   *Analysis:* This is the "strict liability" view of hypocrisy. If you did it, you're out.
          *   *Critique:* Too broad. It implies moral reform is impossible regarding standing. If I stop smoking, can I never tell my kid not to smoke? Most philosophers reject this absolute bar.
          *   *Verdict:* Theo likely has the better of it here (eventually), but Nadia states the intuitive folk view.
          *   *Refinement:* Nadia is stating the *prima facie* case for hypocrisy. It's strong intuitively but philosophically weak if taken as an absolute rule.

      *   **Move (2) Theo:** "Cases aren't parallel... Marco did it once, years ago, owned it... Deniz is doing it now." Distinction between skeleton in closet vs. claiming an exception.
          *   *Analysis:* Theo introduces *temporal distance* and *reform*. He distinguishes between *being* a hypocrite and *acting* hypocritically. He touches on the "commitment to the norm" condition.
          *   *Critique:* This is the standard philosophical counter to the strict liability view. Standing is lost when you imply you are *exempt* from the norm you enforce. If Marco acknowledges he violated it, he isn't claiming exemption.
          *   *Verdict:* Theo wins this round. He identifies the mechanism of lost standing (claiming exceptionalism) rather than just the fact of past wrongdoing.

      *   **Move (3) Nadia:** "Apology is beside the point -- Marco still got the benefit... knowing better and doing it anyway is worse."
          *   *Analysis:* Nadia shifts from *standing* to *severity of wrongdoing*. She argues that past guilt + current knowledge = higher culpability.
          *   *Critique:* This conflates *blameworthiness* with *standing to blame*. Even if Marco is *more* blameworthy historically, does that silence him now? Also, the "benefit" argument suggests a transactional view of morality (sinning buys you silence).
          *   *Verdict:* Nadia makes a good point about moral weight, but she's arguably changing the subject from standing to comparative guilt. Theo's framework (standing) holds better here.

      *   **Move (4) Theo:** "Argument about whether Marco is a good person overall, which isn't the same question as whether he has standing... owning your past wrongdoing is exactly what keeps it from being a live exception-claim."
          *   *Analysis:* Theo nails the distinction between *status* (good person) and *authority/standing* (right to speak). He reiterates the "exception-claim" condition (Fritz & Miller style).
          *   *Critique:* This is philosophically robust. It isolates the specific condition for losing standing (implied superiority/exemption).
          *   *Verdict:* Theo wins this round clearly. He keeps the debate on the specific technical question of standing.

      *   **Move (5) Nadia:** "Marco never actually said any of this remorse stuff to Deniz's face... message Deniz got was still 'I'm better than you'."
          *   *Analysis:* Nadia pivots to *communication* and *uptake*. Standing isn't just internal; it's relational. If the blame *sounds* hypocritical, it functions hypocritically.
          *   *Critique:* This is Nadia's strongest move. It touches on the *function* of blame. If blame is meant to be a moral address, and the address implies superiority falsely, the standing is undermined by the *presentation*, not just the history.
          *   *Verdict:* Nadia wins this round (or at least ties). It highlights the pragmatic dimension of standing.

  4.  **Identify Missing Considerations:**
      *   **The Nature of Blame:** Is it punitive or communicative? (Smart vs. Wallace).
      *   **Relevance of Relationship:** Does friendship change the standing requirements compared to strangers?
      *   **The "Clean Hands" Fallacy:** Does anyone actually have clean hands?
      *   **Deniz's Agency:** Does Marco's standing matter if Deniz *is* guilty? (The truth of the claim vs. the messenger).
      *   **Proportionality:** Is Marco's "grief" proportional?

  5.  **Drafting the Response:**
      *   *Tone:* Academic but accessible (since the user teaches this). Acknowledge the richness of the case.
      *   *Structure:* Go 1-5. Then a "Missing Moves" section.
      *   *Content:* Use philosophical terminology (standing, hypocrisy, exception-claim, communicative vs. punitive) but ground it in the Marco/Deniz facts.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Theo is right because he sounds like a philosopher." Nadia's intuition is shared by many (the "clean hands" requirement). I need to validate why her moves feel strong even if Theo is technically more precise on the definition of standing. Move 5 is crucial because it challenges the *internalist* view of standing (what Marco thinks) with an *externalist* view (what Deniz hears).

      *Refining Move 1:* Nadia states the "Moral Equivalence" view. Theo counters with the "Reform" view.
      *Refining Move 3:* Nadia is arguing about *culpability*, not standing. Theo catches this in Move 4.
      *Refining Move 5:* This is about the *expression* of blame. Even if you have standing internally, you can forfeit it by how you express it.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Blow-by-blow? Yes.
      *   Who has the better of it each time? Yes.
      *   Flag missing considerations? Yes.
      *   No overall winner declaration (though I can lean towards one side's framework).

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a fantastic case study. It's messy enough to resist easy categorization but structured enough to isolate specific variables in the standing debate (temporal distance, reform, uptake, internal vs. external conditions). Since you teach this material, I'll skip the intro 101 on standing and jump straight into the dialectic, evaluating the strength of each move based on the current literature (Bell, Fritz & Miller, Todd, Wallace, etc.).

  Here is the blow-by-blow analysis.

  ### Move (1): Nadia
  **Claim:** Strict Hypocrisy. You cannot moralize about a sin you have committed.
  **Verdict:** **Theo has the better position (eventually), but Nadia captures the folk intuition.**

  Nadia is articulating what we might call the "Clean Hands" principle. In the literature, this is often the starting intuition: hypocrisy undermines standing because it implies a false claim to moral superiority.
  *   **Strength:** It aligns with the *tu quoque* intuition that feels robust in everyday life. If you broke the rule, you lost the right to enforce it.
  *   **Weakness:** Philosophically, this is too blunt. It makes moral reform impossible regarding standing. If I recover from alcoholism, do I lose the standing to advise my child against drinking? Most accounts of standing (e.g., Bell 2013) argue that standing is lost due to a *commitment* issue, not merely a *history* issue. Nadia treats standing as a permanent stain rather than a functional relationship to the norm.
  *   **Point:** Nadia wins the intuitive round, but she sets up a straw man that is too rigid to survive scrutiny.

  ### Move (2): Theo
  **Claim:** Distinction of Cases. Past reform vs. current violation. No "live exception-claim."
  **Verdict:** **Theo wins this round clearly.**

  Theo introduces the crucial distinction between *having violated a norm* and *claiming an exemption from a norm*. This aligns closely with Fritz and Miller's account of hypocrisy. They argue hypocrisy undermines standing when the blamer implies they are exempt from the demands they place on others.
  *   **Strength:** Theo identifies that Marco's past action is not a *current* refusal to be bound by the norm. By owning it and apologizing, Marco reaffirmed the norm's authority over himself. Deniz, conversely, is currently acting as if the norm doesn't bind him.
  *   **Weakness:** It relies on the sincerity of Marco's past remorse, which is currently private (a point Nadia will pounce on later).
  *   **Point:** Theo successfully narrows the definition of hypocrisy from "doing the thing" to "claiming exceptionalism." This is the standard philosophical defense of standing for reformed wrongdoers.

  ### Move (3): Nadia
  **Claim:** Apology is irrelevant. Marco got the "benefit" of cheating. Knowing better makes it worse.
  **Verdict:** **Nadia makes a strong point about culpability, but conflates it with standing.**

  Nadia shifts the ground here. She moves from *standing to blame* to *comparative blameworthiness*.
  *   **Strength:** She highlights the "benefit" argument. Even if Marco regrets it, he enjoyed the utility of the cheating at the time without immediate sanction. There is a residual unfairness in him judging Deniz while holding that unearned utility.
  *   **Weakness:** This is a category error. Even if Marco is *more* blameworthy than Deniz (because he knew better), it doesn't necessarily follow that he lacks *standing*. A recovering addict might be more culpable for a slip-up than a new user, but still has standing to warn the new user. Nadia is arguing that Marco is a bad person, not that he lacks the authority to speak.
  *   **Point:** Nadia scores a hit on Marco's moral character, but she fails to dislodge Theo's structural argument about standing. She is arguing about the *weight* of the blame, not the *right* to deliver it.

  ### Move (4): Theo
  **Claim:** Distinction between "Good Person" and "Standing." Owning wrongdoing prevents exception-claims.
  **Verdict:** **Theo wins this round decisively.**

  Theo correctly identifies Nadia's category error in Move (3). He isolates the specific condition for standing: the absence of a live claim to exemption.
  *   **Strength:** This is technically precise. Standing is a normative power, not a reward for virtue. You don't need to be a "good person" to have standing (a vicious person can still have standing to blame someone for betraying *them*, for example). Theo keeps the focus on the *relationship to the norm*.
  *   **Weakness:** It is somewhat internalist. It assumes that Marco's internal state (remorse) is what matters, rather than how the blame is received.
  *   **Point:** Theo maintains the philosophical high ground by keeping the definitions tight. He successfully defends the view that reform restores standing.

  ### Move (5): Nadia
  **Claim:** Communication and Uptake. Marco didn't disclose his past to Deniz. The message received was "I'm better than you."
  **Verdict:** **Nadia wins this round (or at least forces a draw).**

  This is Nadia's strongest move because it shifts from the *metaphysics of standing* to the *pragmatics of blame*.
  *   **Strength:** Blame is a communicative act (Wallace, Smart). If the communication implies a superiority that the blamer knows is false (or knows is complicated), the blame can be defective. If Marco lectures Deniz *as if* he has clean hands, he is engaging in a deceptive practice. Even if he *has* standing (per Theo's argument in Move 4), he is *exercising* it in a way that generates the very hypocrisy that undermines the moral address. It touches on the "duty to disclose" in certain blame contexts.
  *   **Weakness:** One could argue Marco isn't obligated to confess past sins to every person he blames. However, in a close friendship where the blame is persistent ("spent the past year... pretty blunt"), the omission becomes more salient.
  *   **Point:** Nadia successfully argues that standing isn't just a static status you hold; it's dynamically affected by how you present yourself. You can *forfeit* standing through the *manner* of blaming, even if you possess it through reform.

  ---

  ### What Both Are Missing

  Since you teach this, you'll likely spot these gaps, but they are worth flagging as "Move (6)" possibilities:

  **1. The Proportionality of the Response**
  Neither Nadia nor Theo discusses the *intensity* of Marco's blame. Standing is often scalar. Marco might have standing to say, "Hey, I think that's wrong," but not standing to lecture Deniz "pretty bluntly" for a year. Excessive blame can forfeit standing even if the blamer has clean hands. If Marco is using Deniz's failure to bolster his own ego (even subconsciously), that undermines standing regardless of his past.

  **2. The Function of the Blame**
  Is Marco blaming Deniz to bring him back to the moral community (communicative), or to punish him/purge his own guilt (retributive/expressive)?
  *   If it's **communicative**: Nadia's Move (5) is fatal. You can't effectively call someone back to a norm you are hiding your own relationship to.
  *   If it's **retributive**: Theo's Move (4) holds more water. Retribution is more about desert than moral address.
  They are talking past each other because they haven't agreed on what blame *is for* in this friendship.

  **3. The "Relevance" Condition**
  Does Marco's past cheating need to be identical to Deniz's?
  *   If Marco cheated in a committed marriage and Deniz cheated in a casual relationship (or vice versa), the standing changes.
  *   More importantly: Did Marco's past cheating inform his *empathy*? A reformed wrongdoer often has *more* standing to blame because they understand the temptation and the fallout better than a moral novice. Nadia treats the past as a disqualifier; it could be argued it's an *qualifier* for effective moral address, provided it's disclosed.

  **4. Deniz's Agency (The Truth Condition)**
  Both are so focused on Marco that they ignore Deniz. Does Deniz's guilt depend on Marco's standing? No. Deniz is still guilty. The question is whether Marco is the right agent to deliver the sanction. In close friendships, there is often a "mutual accountability" clause that overrides standard hypocrisy norms. Friends *owe* each other moral feedback even if imperfect. Nadia treats them like strangers in a public square; Theo treats them like moral agents in a vacuum. Neither fully accounts for the *friendship* norms which might compel Marco to speak *despite* his past, perhaps even *because* of it.

  ### Summary for the Classroom
  If you use this in class:
  *   **Moves 1-4** are a classic setup for the **Fritz & Miller vs. Bell** debate (Exception-claiming vs. Commitment to norms).
  *   **Move 5** introduces the **Communicative/Pragmatic turn** (it's not just about whether you *have* standing, but how you *wield* it).
  *   **The Missing Piece** is the **Ethics of Friendship**. Does friendship create a special obligation to be vulnerable (disclose the past) that strangers don't have?

  **Overall:** Theo wins on the *theory* of standing (reform restores it). Nadia wins on the *practice* of blame (hiding the reform undermines the address). The case is unresolved because Marco is theoretically in the clear but pragmatically in the wrong.
