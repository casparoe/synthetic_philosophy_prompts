answer: |-
  This is an excellent catch, and you are right to feel that circular tension. You have put your finger on the precise fault line between the *metaphysical* repair Parfit offers and the *normative* intuitions Reid relies on.

  To give you the short answer first: **Parfit would argue it is not a shell game, but a necessary revision of our concepts.** He concedes Reid's logical point about *identity* but argues that *identity* is not what we should care about. However, many critics (like Marya Schechtman and David Wiggins) argue that you are correct: Parfit saves "Relation R" (Continuity) at the cost of making "Connectedness" do all the normative heavy lifting, which reintroduces Reid's problem at the level of prudence and moral responsibility.

  Here is a breakdown of how to navigate this in your dissertation, distinguishing between the logical fix and the normative cost.

  ### 1. The Logical Fix: Continuity vs. Connectedness
  You are correct that Parfit's definition of **Psychological Continuity** (overlapping chains of strong connectedness) is transitive by construction.
  *   **Reid's Target:** Locke's theory of *Identity*. Since Identity must be transitive ($A=B, B=C \rightarrow A=C$), and Memory is not transitive, Locke's theory fails.
  *   **Parfit's Concession:** Parfit agrees with Reid. He explicitly states that if personal identity is defined by psychological criteria, it cannot be what matters, because identity is a one-one, all-or-nothing relation, whereas psychological relations hold by degrees and can branch (fission).
  *   **The Move:** Parfit separates **Identity** from **Survival**.
      *   **Connectedness ($C$):** Direct psychological links (not transitive).
      *   **Continuity ($R$):** Overlapping chains of $C$ (transitive).
      *   **Claim:** Survival consists in $R$ holding, not in Identity holding.

  So, logically, Parfit *does* earn something: he creates a relation ($R$) that can hold between the General and the Boy even if direct memory is lost, without violating the laws of logic. The contradiction Reid identifies ($A=B, B=C, A \neq C$) is dissolved because Parfit stops claiming $A=C$ in the sense of *Identity*. He claims $A$ bears Relation $R$ to $C$.

  ### 2. The "Shell Game" Charge: Where the Normative Weight Lands
  Your worry is that **Connectedness** is "the notion we cared about in the first place." This is the crux of the dissertation chapter.

  If I am the General, and I am asked, "Should you be punished for the Boy's crime?" my intuition (and Reid's) says: *Only if I am the same person.*
  *   **Locke/Reid:** If Memory fails, Identity fails. If Identity fails, Punishment is unjust.
  *   **Parfit:** Identity is irrelevant. Relation $R$ holds (via the Officer). Therefore, Survival holds. *However*, Parfit admits that the *degree* to which survival matters depends on the degree of Connectedness.

  **Is this a shell game?**
  *   **Parfit's Defense:** It is not a shell game because he is openly revisionary. He argues our intuition that "Identity is what matters" is the mistake. We care about the future because of psychological connections. If those connections fade (General vs. Boy), we should care *less*, not demand a binary "guilty/not guilty" based on a metaphysical fiction of Identity. He accepts that the General has less reason to fear the Boy's punishment than the Officer did, but maintains the General is still the *survivor*.
  *   **The Critic's Counter (Your Position):** You can argue that for *specific* normative practices (punishment, promise-keeping, prudential concern), Connectedness *is* the necessary condition. If Connectedness is broken, Continuity is an empty shell. By making Continuity the criterion for "Survival," Parfit creates a category of "Survival without significant Connectedness" that has no practical cash value. If the General feels no connection to the Boy, telling him "But you are psychologically continuous with him!" offers no reason to accept the flogging.

  ### 3. Key Literature to Break the Circle
  Since you are writing a diss, you need to situate this within the existing debate. This specific tension (Reid's objection vs. Parfit's Continuity) is discussed in several key places:

  **A. Sydney Shoemaker (The Causal Defense)**
  Shoemaker (*Personal Identity: A Materialist's Account*) tries to save a Lockean view without Parfit's reductionism. He argues for "Quasi-Memory" and causal continuity. He might argue that the *causal chain* itself preserves identity even if memory access is lost, provided the right causal mechanism exists. This avoids the "shell game" by grounding the continuity in something more robust than just overlapping memories.

  **B. Marya Schechtman (The Narrative Objection)**
  This is crucial for you. In *The Constitution of Selves*, Schechtman argues that Parfit's "Psychological Continuity" is too thin to support personhood. She explicitly tackles Reid. She argues that for moral responsibility and prudential concern, we need a **Narrative Self-Constitution**.
  *   **Her point:** The General can only be responsible for the Boy if the General can *incorporate* the Boy's actions into his current self-narrative. If the memory is lost, the narrative is broken, and responsibility lapses.
  *   **Relevance:** She validates your intuition that Parfit's "Continuity" is a metaphysical fix that fails the normative test.

  **C. Derek Parfit, *Reasons and Persons*, Section 84 ("Why Identity is Not What Matters")**
  Re-read his discussion of the "Brave Officer" specifically. Parfit acknowledges that if connectedness is weak, "what matters" is reduced. He argues we should accept this. He writes: *"We should not regard this as a contradiction... We can describe the facts without using the concept of personal identity."* He bites the bullet: The General *survives* the Boy, but the special concern is diminished.

  **D. John Johnston ("Human Beings")**
  Johnston argues that we are human animals, not psychological chains. For Johnston, the General *is* the Boy simply because they are the same organism. Reid's objection is dissolved because biological identity is transitive. The psychological discontinuity is irrelevant to identity (though relevant to responsibility). This is the "Animalist" counter-move.

  ### 4. How to Frame This in Your Dissertation
  You can frame this not as Parfit failing, but as Parfit forcing a choice between **Metaphysical Consistency** and **Normative Intuition**.

  *   **Option 1 (Parfitian):** Accept that "Identity" is a empty question. Reid is right that Locke's *Identity* theory fails, but wrong to think Identity matters. We must update our moral practices (punishment, etc.) to track degrees of Connectedness, not binary Identity.
  *   **Option 2 (Reidian/Schechtman):** Argue that Parfit's "Continuity" is metaphysically coherent but normatively inert. If Connectedness is what grounds prudential concern, and Connectedness is non-transitive, then "Survival" (as Parfit defines it) cannot ground prudential concern in the non-transitive cases. Therefore, Parfit hasn't solved the problem of *survival*, he has just redefined the word.

  **Recommendation:**
  Your intuition that it "relocates the problem onto connectedness" is philosophically robust. It is essentially the argument that **transitivity is a requirement for the *subject* of moral responsibility.** If the relation that grounds responsibility (Connectedness) is not transitive, then responsibility cannot be transferred across the chain. Parfit's "Continuity" bridges the gap metaphysically, but it doesn't bridge it *morally* if the moral weight rests on Connectedness.

  You might conclude that Parfit's move earns him **logical consistency** (he avoids Reid's contradiction) but costs him **normative force** (he cannot explain why the General should care about the Boy's fate in the way required for retributive justice). This makes it a "shell game" *only if* one insists that Personal Identity must serve both metaphysical and normative functions simultaneously. Parfit's whole project is to argue that we should stop expecting it to do both.

  **Search Terms for your lit review:**
  *   "Parfit Reid Brave Officer"
  *   "Transitivity of Psychological Continuity"
  *   "Schechtman Parfit Personal Identity"
  *   "The What Matters Claim"
  *   "Degrees of Survival Parfit"

  This is a strong chapter pivot. If you can clearly articulate that Parfit solves the *logic* of Reid's objection by abandoning Identity, but inherits a *normative* problem regarding Connectedness, you will have a very solid critique.
