      *   *Paper Check:* In the LI paper, the market prices sentences. The "truth" is determined by a fixed deductive process (like a theorem prover). If the process proves $\phi$, the share pays $1. If it proves $\neg \phi$, it pays $0$. If neither is ever proven, the share never pays out (or the value is undefined in the limit, but the *price* converges). Actually, the standard setup is: shares pay $1 if $\phi$ is true, $0 if false. But since we don't know truth, we evaluate performance against a *deductive process*.
      *   *Refinement:* The user says "if $\phi$ eventually gets proven." This is slightly imprecise. The market is evaluated against a *deductive process* $D$. If $D \vdash \phi$, the share is worth $1. If $D \vdash \neg \phi$, it's worth $0$. If $D$ never decides, the share's "true value" is undefined, but the *price* must still converge to *something* to satisfy the criterion.
      *   *Claim:* Price is what computable trading strategies bid.
