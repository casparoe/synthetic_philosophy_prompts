answer: |-
  The spectrogram looked like a jagged mountain range rendered in neon blue. On the screen, the spike coincided perfectly with the active sonar ping. Again. And again.

  "It's affirmative," Lena said, her finger hovering over the ballast release. "Every time we ping, it clicks back within the latency window of recognition. It's saying *'Here.'* It's guiding us through the trench."

  Aris didn't look at the screen. He watched the depth gauge. "It's saying *'Stop.'* The click isn't an answer; it's a flinch. We ping, it hurts, it vocalizes pain. Charity dictates we assume it knows its own body better than we do."

  "Charity dictates we assume it's rational," Lena countered. "If it were pain, it would flee. It's holding position. It wants us to follow."

  "And if it's holding position to warn us off a cliff? If it believes we are blind predators it needs to halt?"

  They were three thousand meters down in the *Demos*, hovering outside the Mariana's southern lip. Outside the thick quartz glass, a sperm whale hung in the void, illuminated only by the sub's work lights. It hadn't moved in twenty minutes. The AI translation matrix—trained on decades of coda recordings—had crashed out an hour ago, returning equal probability scores for 'Greeting,' 'Warning,' and 'Hunting Coordination.'

  So they were left with the manual work. Radical interpretation.

  "The Principle of Charity," Aris muttered, rubbing his temples. "We maximize the truth of its beliefs to decode the meaning of its words. But look at the loop, Lena. You can maximize truth two different ways."

  He pulled up the data log. "Scenario A: You interpret the click as *'Affirmative.'* To make that true, you must attribute to the whale the belief that *'The submarine is a safe follower.'* Given the noise we make, is that a true belief? Maybe not. But if you assume the whale knows something we don't—that we are harmless—it fits."

  "Scenario B," Lena said, her voice tight. "I interpret the click as *'Warning.'* To make that true, I attribute the belief that *'The submarine is a threat.'* Given the noise, that is a highly true belief. It fits better."

  "Does it?" Aris tapped the glass. "If it believed we were a threat, rationality dictates evasion. It isn't evading. So if you choose 'Warning,' you have to attribute a false belief to the whale: that *'Standing still stops threats.'* Which is less charitable. You're making the whale irrational to save your translation."

  Lena frowned. She ran the numbers again. He was right. If the click meant 'Danger,' the whale was behaving stupidly. If the click meant 'Guide,' the whale was behaving rationally, but its belief in the sub's safety was optimistic.

  "Okay," Lena said. "Flip it. What if the click means *'Danger'* but the behavior isn't freezing? What if the behavior is *'Blocking'*? It's placing itself between us and the trench wall."

  "Then the belief is *'The wall is dangerous,'*" Aris said. "Which is true. And the meaning is *'Do not pass.'*"

  "Or," Lena snapped, "It means *'The wall is prey,'* and it's showing us where to cut."

  "Same behavior. Contradictory meanings. Both maximize the truth of the whale's beliefs about the world. Both assume rationality." Aris leaned back, the hydraulic chair hissing. "Davidson warned us. There is no fact of the matter. There is only the manual we choose to enforce."

  "The drill starts in ten minutes," Lena said. "If it's guiding us, we drop to four thousand. If it's blocking us, we surface."

  "If we drop and it's blocking, we crush it against the ridge."

  "If we surface and it's guiding, we abandon the discovery of the century. The thermal vents down there... the energy potential..."

  "The life potential," Lena corrected.

  They looked at the whale. It hung there, an ancient, wrinkled monument in the dark. It clicked again. *Ping.*

  "It's waiting," Lena whispered.

  "It's watching," Aris said.

  The bind was absolute. They had exhausted the evidence. They had applied the charity. They had assumed the whale was rational and mostly right about the world. Yet the geometry of meaning remained bent. There was no hidden variable, no deeper scan, no universal translator that could step outside the circle of interpretation and point to the 'real' meaning. Meaning wasn't in the whale. It wasn't in the water. It was in the relationship between the observer and the observed, and that relationship was fractured.

  "If I press the drop," Lena said, her hand on the control yoke, "I am making it a guide."

  "If I press the surface," Aris said, his hand on the abort switch, "I am making it a victim."

  "Neither of us is finding the truth."

  "No," Aris said. "We're assigning it."

  The silence in the cabin was heavier than the ocean outside. The whale clicked again. A sharp, brittle sound.

  *Ping.*

  Lena looked at Aris. Aris looked at the depth gauge. There was no third option. There was no appeal to a higher court of semantics. The whale would not speak English. The AI was silent. The data was symmetrical.

  "We have to choose," Lena said.

  "I know."

  "Which charity do we extend? The one that gives us energy, or the one that gives it safety?"

  "Neither," Aris said softly. "We choose the one we can live with when the lights come back on."

  Lena's hand trembled. The whale drifted closer, filling the viewport, an eye vast and dark as the trench itself. It clicked.

  *Ping.*

  Lena closed her eyes. She pushed the yoke forward. The ballast tanks groaned. The *Demos* began to sink.

  "Guide," she said.

  "Victim," Aris replied.

  They watched the depth counter climb, neither speaking, waiting to see if the water would remain clear or turn red, knowing that whatever happened next would not tell them what the whale had said, only what they had decided to hear.
