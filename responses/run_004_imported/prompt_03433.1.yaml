answer: |-
  **Setting:** *A quiet study, late afternoon. Sunlight falls across a sturdy wooden chair. Two philosophers, Ned (a Nihilist regarding composite objects) and Ria (a Commonsense Realist), sit facing one another. The chair sits between them, empty.*

  **Ned:** Let's begin with the obvious. There is no chair in this room.

  **Ria:** That is a bold way to start, Ned. I am looking at it. I could sit on it. If I kicked it, my toe would hurt. Are you suggesting my toe is hallucinating?

  **Ned:** Not at all. Your toe would encounter resistance. But that resistance is caused by a collection of fundamental particles—simples—interacting with your foot. There are simples arranged chair-wise. There are no simples, and then, in addition to them, a "chair." To say the chair *exists* is to commit an ontological error. It's like saying there is a "wave" in the ocean over and above the water molecules.

  **Ria:** But you just admitted there are "simples arranged chair-wise." That is a mouthful. When I say, "There exists a chair," I am saying exactly that, just more efficiently. If we agree on the arrangement of the particles, haven't we agreed on all the facts? What work is left for the word "chair" to do other than to name that arrangement?

  **Ned:** The work it does is deceptive work. It suggests there is an extra entity, a composite substance, glued on top of the particles. My claim is that we can translate every true sentence containing the word "chair" into a sentence about "simples arranged chair-wise" without loss of meaning. "The chair is brown" becomes "There are simples arranged chair-wise and they are brown." If the translation holds, the chair is redundant. We should eliminate it from our fundamental inventory of what exists.

  **Ria:** I grant you the translation works for practical purposes. But you are moving from "we can talk without this term" to "the thing referred to does not exist." That is a non sequitur. Consider the physicist who works with phonons. They are quasiparticles, collective excitations in a lattice. Strictly speaking, there are only atoms vibrating. Yet, no physicist would say phonons are "unreal" or that talk of phonons is merely a *façon de parler*. They carry energy; they scatter. They are emergent entities. Why is a chair different?

  **Ned:** Aha, but you touch on my strongest point. In your field, you knew phonons were not fundamental. They were useful fictions—mathematical conveniences for modeling the lattice. You didn't believe a phonon was a little bead sliding between the atoms. You treated it *as if* it were an entity because the math worked. I am treating the chair the same way. It is a useful fiction for navigating the macro-world. But if we are asking what *really* exists, strictly speaking, the answer is only the simples. The phonon, like the chair, vanishes under fundamental analysis.

  **Ria:** But that assumes "fundamental analysis" is the only metric for reality. This brings me to your next defensive line, which I've seen in the literature. You might say, "Ria, we aren't actually disagreeing. You use 'exists' to mean 'exists as a composite,' and I use 'exists' to mean 'exists as a fundamental simple.' We are both right." This is the doctrine of Quantifier Variance. You're suggesting the dispute is merely linguistic.

  **Ned:** Precisely. Why insist there is only One True Meaning of "there exists"? Your language has a quantifier that ranges over composites. Mine ranges only over simples. Both languages can describe the same world. When you say "There exists a chair," you speak truth in your language. When I say "There does not exist a chair, only simples," I speak truth in mine. There is no substantive disagreement about the world, only a preference for conceptual schemes.

  **Ria:** If that were true, ontology would be trivial. I could define a "trout-turkey" as the fusion of the front half of a trout and the back half of a turkey. In my language, "There exists a trout-turkey" is true. In yours, it is false. If Quantifier Variance holds, we are both right, and there is no fact of the matter. But surely reality doesn't care about my linguistic preferences. There is a structure to the world. Some ways of carving it up match that structure; others are gerrymandered.

  **Ned:** And who decides which carving matches the structure? You appeal to intuition. "Of course chairs exist!" But intuition is a poor guide to fundamental reality. Intuition told us the sun goes around the earth. Why is "chair" a natural kind but "trout-turkey" not? Because it's useful to humans. But utility is pragmatic, not ontological.

  **Ria:** It's not just utility. It's about *joint-carving*. The distinction between a chair and a random scattering of wood dust is objective. The particles in the chair are bound by forces; they move together; they have causal powers as a unit. If I push the chair, the whole thing moves. If I push a scattered arrangement of "chair-wise simples" that aren't actually bonded, they fly apart. The world itself distinguishes between the composite and the scattering. My quantifier tracks that objective distinction. Yours ignores it. Therefore, one of us is using the "privileged" sense of existence that aligns with the structure of reality.

  **Ned:** But the "binding" you speak of is just more interaction between simples. You haven't found a new ontological glue; you've just described a specific pattern of relations between the fundamentals. To say the chair *really* exists is to say the pattern is an object. But patterns aren't objects; they are descriptions of objects. You are reifying a description.

  **Ria:** Let's test this. You proposed earlier that our disagreement might be merely verbal. There is a method for checking this. Let us ban the word "exists" entirely. It is too loaded. Instead, we introduce two subscripted terms. Let $exists_N$ mean "exists according to the Nihilist's restricted quantifier" (only simples). Let $exists_R$ mean "exists according to the Realist's unrestricted quantifier" (simples and composites).

  **Ned:** Agreed.

  **Ria:** Now, I make the claim: "The chair $exists_R$." Do you agree?

  **Ned:** Yes. In your language, that is true. There are simples arranged chair-wise, so the condition for $exists_R$ is met.

  **Ria:** And you make the claim: "The chair does not $exists_N$." Do I agree?

  **Ned:** You should. Since you admit there are no fundamental composite particles, the condition for $exists_N$ is not met.

  **Ria:** So, if we translate all our claims into these subscripted terms, do we still disagree?

  **Ned:** It appears we do not. We both agree on the distribution of simples. We both agree on the arrangements. We only differ on which quantifier to use. This suggests the dispute is merely verbal. We are arguing over which language to speak, not what the world is like. If the subscript test dissolves the disagreement, then Quantifier Variance wins. There is no "fact of the matter" about whether the chair exists, only a fact about which language we are using.

  **Ria:** I resist that conclusion. The subscript test shows we can *translate* the disagreement, not that it vanishes. The crucial question remains: Which quantifier *carves at the joints*? Is $exists_R$ or $exists_N$ the one that matches the objective structure of reality?

  **Ned:** But what does "matching the structure" mean if not "being the language we find most useful"? If you say $exists_R$ is privileged, you are making a metaphysical claim. But if I can say everything you say using $exists_N$ plus arrangement talk, what explanatory work is the privileged status doing?

  **Ria:** It explains why some predictions hold and others don't. If I treat the chair as a single object ($exists_R$), I can predict its motion using Newtonian mechanics on the center of mass. If I treat it as $10^{25}$ individual simples ($exists_N$), the calculation is impossible, but more importantly, it misses the *constraint* that holds the object together. The constraint is real. The chair is a causal unit. If existence is tied to causal power, the chair exists. Your $exists_N$ ignores causal units that aren't fundamental.

  **Ned:** But the causal power is still located in the interactions of the simples. The "unit" is a pattern of interaction. You are back to the phonon analogy. You treated phonons as real because they had causal power, yet you admitted they weren't fundamental. If you were a metaphysician then, would you have said phonons *really* existed, or that they were emergent features of the lattice?

  **Ria:** I would have said they were real *features*. And that is my point. A chair is a real feature. You insist that "exists" applies *only* to the substrate. I insist "exists" applies to the substrate and its stable, causally integrated features. This isn't just a linguistic choice. It's a choice about what we value in ontology. Do we value only the bottom layer? Or do we value the layers of structure that actually do the work in the world?

  **Ned:** If it's just about what we "value," then we are back to pragmatics. And if it's pragmatic, then my nihilism is just as valid as your realism, provided I am willing to do the heavy lifting of paraphrase.

  **Ria:** But you aren't just offering a pragmatic alternative. You are making the negative ontological claim: "There is *no* chair." That sounds like a claim about the world, not a preference for grammar. If it were merely a preference, you wouldn't say I am *wrong*. You would say I am speaking a different dialect. But you do say I am wrong.

  **Ned:** I say you are wrong if you claim your dialect is the *only* true one. If you claim that "exists" *must* range over composites, then yes, you are wrong. But if you admit Quantifier Variance, we can both be right.

  **Ria:** And I say you are wrong if you claim reality doesn't support the composite carving. The subscript test didn't solve this. It just labeled the two positions. It didn't tell us which label corresponds to the *world*. We can agree on the truth conditions for $exists_R$ and $exists_N$, but we still disagree on whether the chair's $exists_R$ status is ontologically robust or merely derivative.

  **Ned:** "Ontologically robust." There it is again. You want a hierarchy of existence. I offer a flat ontology: simples exist, everything else is talk. You offer a layered ontology: simples exist, and some arrangements also exist. Both describe the same distribution of mass and energy. Why is your layering "true" and mine "false"?

  **Ria:** Because the layering is in the world, not just in the talk. The bond between the wood fibers is physical. The boundary between the chair and the air is a site of physical discontinuity. My ontology respects those discontinuities as markers of objects. Yours treats them as arbitrary lines drawn by humans.

  **Ned:** But the discontinuity is just a gradient of particle density. Where exactly does the chair end? One atom further out? If the boundary is vague, how can the object be a precise constituent of reality? Simples are precise. Chairs are vague. Therefore, chairs are not fundamental constituents.

  **Ria:** Vagueness doesn't imply unreality. "Mountain" is vague. "Heap" is vague. Yet mountains exist. The vagueness is epistemic or semantic, not necessarily ontological. Or, perhaps reality itself admits of vague boundaries. Either way, it doesn't force us to nihilism.

  **Ned:** We seem to have circled back. I appeal to precision and fundamentality. You appeal to causal integration and structure. I say your structure is just relations between my fundamentals. You say my fundamentals miss the reality of the structure itself.

  **Ria:** And regarding the subscript test?

  **Ned:** I maintain it shows the dispute is verbal. We agree on the world; we disagree on the quantifier.

  **Ria:** I maintain it shows only that we can formalize the disagreement. It doesn't show the disagreement is empty. The question "Which quantifier is privileged?" remains, and on that, we still disagree.

  **Ned:** So we are at an impasse. I cannot convince you that the "chair" is a fiction without losing the world you live in.

  **Ria:** And I cannot convince you that the "chair" is a substance without appealing to intuitions you reject as folk physics.

  **Ned:** Perhaps. Though I suspect if you tried to walk through that chair, you'd find my ontology hurts less than yours.

  **Ria:** *[Smiles]* Only because the simples arranged chair-wise are hard. Whether you call it a chair or not, I'd still bruise my shin.

  **Ned:** True. The simples are real. That, at least, we agree on.

  **Ria:** We do. And perhaps that is enough to be getting on with. Though I shall continue to sit on the "arrangement," and you shall continue to warn me that I am merely hovering above a cloud of particles.

  **Ned:** As long as you don't fall through the gaps.

  **Ria:** I don't think I will. The joints, after all, are carved quite deeply.
