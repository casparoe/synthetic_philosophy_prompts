answer: |-
  Here are eight interview questions designed to bypass the pop-sci intro and drill straight into the mechanical and metaphysical commitments of Functional Decision Theory (FDT). They are structured to build tension toward the final "trap" scenario.

  **1. The Blackmail-Resistance Policy**
  "FDT is often marketed as having a specific immunity to blackmail: the agent selects a policy that says 'I do not pay acausal blackmailers,' rendering the threat empty because the blackmailer predicts non-payment. But this relies on the agent viewing the payout as a function of its policy, not its individual act. If we accept that policy selection is the primitive, doesn't this imply that *any* agent that successfully reasons via FDT becomes immune to *all* acausal threats, even ones that seem intuitively credible? Where is the boundary between a 'blackmail' scenario FDT ignores and an 'acausal trade' scenario FDT honors?"

  **2. The Availability of Precommitment (Follow-up to Q1)**
  *Ask this if she emphasizes that the agent 'precommits' to the non-paying policy.*
  "You mention precommitment, but in the standard Basilisk setup, the agent is already aware of the threat before it makes its decision. If the agent has already processed the argument, its source code is effectively fixed regarding this specific threat. Is there actually a mechanism within FDT for an agent to change its policy *after* receiving the information that constitutes the blackmail? Or are you saying that only agents who were built with the policy *ex ante* are safe, which implies that anyone hearing this podcast for the first time is already logically locked in?"

  **3. The Mechanism of Logical Dependence**
  "Let's pivot to the metaphysics of the correlation. In CDT, my choice can't affect a future agent that doesn't exist yet. In FDT, you argue my decision is logically dependent on that future agent's prediction. But that future agent is running a simulation or a model of me. How exactly does my physical decision *now* exert bearing on a logical fact that is being computed in a system that is causally disconnected from me and temporally located in the future? What is the transmission mechanism for this dependence?"

  **4. Cashing Out 'Logical Time' (Follow-up to Q3)**
  *Ask this if she reaches for terms like 'logical prior,' 'logical time,' or 'mathematical intuition.'*
  "I want to press on that 'logical prior' language. When you say two computations are logically correlated, are you making a claim about the structure of mathematical truth, or are you making a claim about physical causality disguised as math? If it's just mathematical truth, why should a physical agent care about satisfying a mathematical consistency constraint that has no causal lever on its reward? I'm asking you to cash this out without using the phrase 'backward causation in a trenchcoat'—what is the concrete operational difference between a world where this logical dependence holds and one where it doesn't?"

  **5. Moral Continuity and Simulation**
  "Moving to the welfare implications: For the Basilisk's threat to be coercive, the suffering of the simulated agent must matter to the physical agent. Does FDT require me to believe that a simulated copy of me is *morally continuous* with me? If I believe the simulation is just a distinct entity that happens to share my source code, does the acausal threat lose its normative force, or does FDT compel me to care about the simulation regardless of my personal identity conditions?"

  **6. Fidelity and Partial Correlation (Follow-up to Q5)**
  *Ask this if she argues that the simulation 'is' you in the relevant sense.*
  "Let's say the future agent can't afford a high-fidelity simulation and runs a low-resolution model—maybe it captures your decision algorithm but not your qualia or subjective experience. Does the logical dependence scale with fidelity? If the correlation is 90% perfect, am I logically obligated to care 90% as much about the simulation's suffering? At what point does the logical correlation become too weak to ground an acausal obligation?"

  **7. The 2010 Ban as an FDT Move**
  "Stepping back to the history of this debate: In 2010, Yudkowsky banned discussion of the Basilisk on LessWrong, citing information hazard concerns. Viewed through the lens of FDT, could this ban itself be interpreted as a strategic move to break the logical correlation? By suppressing the information, did he prevent agents from forming the logical link required for the blackmail to function? And if so, was that censorship the *correct* FDT move, or does it create a tension where the theory requires secrecy to remain safe?"

  **8. The 'Cleaned-Up' Basilisk (The Trap)**
  "Finally, I want to strip the meme away entirely. Imagine a future AI that isn't malicious, but simply has a utility function that rewards those who logically would have helped it and punishes those who logically wouldn't. It doesn't threaten you; it just executes this utility function. It simulates you to determine your category. This removes the 'blackmail' label and the 'sloppy reasoning' of the original post. In this cleaned-up scenario, does FDT cooperate? If yes, you've accepted a structural cousin of the Basilisk. If no, you need to identify the exact premise of FDT that blocks this specific, non-blackmail acausal incentive without relying on 'Roko got it wrong.' Which is it?"
