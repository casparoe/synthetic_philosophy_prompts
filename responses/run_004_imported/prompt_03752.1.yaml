answer: |-
  **The Diagnostician of the Fall: Why Pascal Is Not a Positivist**

  It is tempting to read Blaise Pascal as a gloomy Thomas Hobbes, a thinker who believes that justice is merely the shadow cast by power. When Pascal writes that "justice without force is powerless" and concludes that "we could not make what is just strong, so we made what is strong just," he appears to endorse a stark legal positivism. On this reading, the "mystical foundation of authority" is a polite fiction; custom constitutes equity solely because it is old and accepted, and to dig beneath it is to destroy the social order. If one stops here, Pascal looks like a conventionalist who believes justice is nothing but force wearing a costume. However, this interpretation mistakes Pascal's diagnosis of the human condition for a metaphysical claim about the nature of goodness itself. Pascal is not arguing that true justice does not exist; he is arguing that fallen reason is incapable of apprehending it. To read him as a positivist is to ignore the theological architecture of the *Pensées*.

  The conventionalist reading gains traction from the sheer texture of Pascal's skepticism. He relentlessly dismantles the claims of magistrates and kings to natural authority. He notes that if we could trace the lineage of any law back to its origin, we would find it began in violence or accident, rendering it illegitimate. "Custom is the whole of equity," he writes, "for the very reason that it is accepted." This echoes Montaigne's Pyrrhonism and anticipates Hobbes's assertion that authority, not truth, makes law. For the seminar's positivist camp, this is the end of the story: legitimacy is a psychological trick required to keep the peace, and Pascal is simply clear-eyed enough to admit that might makes right.

  Yet, this reading collapses when placed against the purpose of the *Pensées*. These are not treatises on political science; they are notes for an apology of the Christian religion. Pascal's project is to demonstrate the wretchedness of man without God to prepare the soul for grace. If justice were truly nothing but force, there would be no standard by which to judge human wretchedness. The very fact that Pascal laments the triumph of force over justice implies a transcendent standard that has been violated. For Hobbes, force creates right because there is no higher court of appeal. For Pascal, force usurps right because the higher court is inaccessible to corrupted reason.

  This distinction turns on the concept of *concupiscence*. Pascal argues that human nature is wounded; self-love (*amour-propre*) distorts our vision. We cannot find true justice not because it is nonexistent, but because we are too selfish to recognize it. When Pascal says we "made what is strong just," he is describing a tragic substitution, not an ontological identity. We settled for force because we lacked the charity required to sustain true justice. The "mystical foundation" is not a revelation that authority is fake, but a warning that political authority is provisional. It functions only so long as we do not scrutinize its origins, because scrutiny reveals the sin at the heart of the political order.

  Therefore, the strongest reading is neither purely positivist nor naively idealist, but anthropological. Pascal leaves room for justice as something more than force, but he exiles it from the political sphere. True justice belongs to the order of charity, accessible only through grace, while the political sphere remains the domain of force and custom. This is why Pascal can simultaneously mock the pretensions of earthly judges and insist on the duty to obey them. We obey not because their laws are truly just, but because order is necessary for a fallen species that cannot handle the truth of its own corruption.

  Ultimately, Pascal does not leave room for immanent political justice, but he fiercely defends transcendent justice. To claim he is a conventionalist is to mistake the symptom for the disease. Force wears the costume of justice not because justice is a costume, but because humanity is too broken to tailor the real thing. The bleakness of Pascal's political thought is not an end in itself; it is a goad. He strips earthly authority of its divine pretensions so that we might stop looking for salvation in the state and start looking for it where he believes it actually resides. Justice is real, but for Pascal, it is not of this world.
