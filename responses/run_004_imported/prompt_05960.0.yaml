answer: |-
  This is a fantastic question. You have hit on exactly the right intuition: *Why can't we just say the conditional expresses a complex attitude?*

  The short answer is: You **can** say that, and many expressivists have tried. But doing so creates a new problem that threatens to break logic itself. The Frege–Geach problem isn't just about whether moral sentences fit into "if/then" statements; it is about whether moral arguments can be **valid** in the same way that factual arguments are.

  Here is the walkthrough in plain terms, focusing on why the "obvious response" creates a logical dead end.

  ### 1. The Golden Rule of Logic: Consistency of Meaning

  To see the problem, we first need to look at how logic works in normal, factual sentences. Consider this classic valid argument:

  1.  It is raining.
  2.  If it is raining, then the grass is wet.
  3.  Therefore, the grass is wet.

  This argument works because the phrase **"It is raining"** means the exact same thing in Premise 1 and Premise 2. It refers to the same state of affairs (water falling from the sky).

  If the meaning shifted between the two premises, the argument would fail. This is called the **fallacy of equivocation**. Imagine if "raining" meant something different in the second line:

  1.  It is [water falling from sky].
  2.  If [I am feeling sad], then the grass is wet.
  3.  Therefore, the grass is wet.

  This is nonsense. The conclusion doesn't follow, because the link between premise 1 and premise 2 is broken. For logic to work, the components of a sentence must contribute the same "meaning" whether they are being asserted as facts or tucked inside an "if."

  ### 2. The Expressivist Dilemma

  Now, let's apply this to your view, emotivism/expressivism.

  **The Expressivist Claim:**
  When you assert "Stealing is wrong," you aren't stating a fact. You are expressing an attitude. Let's simplify it to: **"Boo stealing!"**

  **The Argument:**
  Now let's build a moral argument that looks just like the rain argument:

  1.  Stealing is wrong.
  2.  If stealing is wrong, then getting your little brother to steal is wrong.
  3.  Therefore, getting your little brother to steal is wrong.

  Intuitively, this is a good, valid argument. If you accept 1 and 2, you *must* accept 3. If you don't, you are being irrational.

  **The Problem:**
  According to your "obvious response," here is what the expressivist says those sentences mean:

  *   **Premise 1:** "Stealing is wrong" = **"Boo stealing!"** (A simple attitude of disapproval).
  *   **Premise 2:** "If stealing is wrong..." = **"Boo [stealing-in-a-hypothetical-context]!"** (A complex, conditional attitude).

  Do you see the crack in the foundation? In Premise 1, "wrong" expresses a simple **Boo**. In Premise 2, "wrong" is part of a complex **Boo-if**.

  If the meaning of "wrong" changes depending on whether it is standalone or inside an "if," then the argument commits the **fallacy of equivocation**. It's like the "raining" example above.
  *   Premise 1 talks about *Attitude A*.
  *   Premise 2 talks about *Attitude B*.
  *   Therefore, the conclusion doesn't actually follow from the premises.

  If expressivism is true, then moral arguments are logically invalid. They just *look* valid because we use the same words, but under the hood, we are swapping meanings. This implies that you cannot logically reason your way to a moral conclusion; you can only have feelings that happen to line up.

  ### 3. Why the "Complex Attitude" Fix Doesn't Work

  Your instinct was: *"Why not just say the whole conditional expresses a more complicated attitude?"*

  Philosophers call this move accepting that the sentence has a different "force" in different contexts. But here is why that fails to save the theory:

  **A. It makes moral disagreement impossible to explain.**
  Imagine I say: "Stealing is wrong."
  You say: "No, stealing is not wrong."

  In a factual view, we disagree because we can't both be right. In expressivism, we disagree because our attitudes clash (I say Boo, you say Hooray).

  But now consider this:
  *   I say: "If stealing is wrong, then getting your brother to steal is wrong."
  *   You say: "Stealing is wrong, but getting your brother to steal is *not* wrong."

  In normal logic, you are being inconsistent. You are affirming the "If" and the "Then" but denying the connection. But if expressivism says the "If" version expresses a totally different attitude than the standalone version, **you aren't being inconsistent.** You just have three different attitudes that don't logically conflict.

  Expressivism struggles to explain why you are being *irrational* here. It reduces moral reasoning to a collection of unrelated feelings rather than a structured web of beliefs.

  **B. It creates an infinite regress of attitudes.**
  If "Stealing is wrong" is one attitude, and "If stealing is wrong..." is a second attitude, what about:
  *   "Either stealing is wrong or I am mistaken."
  *   "I believe that stealing is wrong."
  *   "It is possible that stealing is wrong."

  Every time you embed the sentence in a new logical structure (negation, belief, possibility, disjunction), you would need to invent a brand new, unique attitude to match it. Soon, the word "wrong" doesn't have a stable meaning at all; it's just a chameleon that changes color every time it moves. If the word has no stable meaning, we can't really say we are talking about the same thing.

  ### 4. So, is Expressivism Dead?

  This is the nuance your friend might have missed. The Frege–Geach problem is not necessarily a "refutation" that killed the theory forever. Instead, it was a challenge that forced expressivists to become much more sophisticated.

  Modern expressivists (like Simon Blackburn and Allan Gibbard) developed a view called **Quasi-Realism**. Their response to your "obvious instinct" is basically: *"You are right, but we need to explain how we project logic onto our attitudes."*

  They argue that even though moral statements express attitudes, we can construct a "logic of attitudes." They try to show that even if "wrong" isn't a fact, we can treat it *as if* it were a fact for the purposes of logic, without lying about what it really is (an attitude).

  However, many critics remain unconvinced. They argue that Quasi-Realism is a workaround that secretly smuggles factual truth back in through the back door. If you have to build a system where attitudes behave exactly like facts (obeying logic, consistency, and validity), why not just admit they are a special kind of fact?

  ### Summary

  The Frege–Geach problem is not just about grammar; it is about **validity**.

  1.  **Logic requires consistency:** A word must mean the same thing in Premise 1 and Premise 2 for an argument to work.
  2.  **Expressivism creates inconsistency:** It says "wrong" means "Boo!" when asserted, but something else when inside an "if."
  3.  **Your "obvious response":** Suggests the "if" version is just a complex "Boo."
  4.  **The Failure:** If the "Boo" changes shape, the link between Premise 1 and Premise 2 is broken. The argument becomes invalid (equivocation).
  5.  **The Stakes:** If expressivism can't solve this, it implies that moral reasoning is an illusion—we can't logically argue about morals, only clash feelings.

  Philosophers dwell on this because it strikes at the heart of whether ethics can be rational. If the Frege–Geach problem holds, expressivism suggests that moral logic is a mirage. Solving it is the expressivist's way of trying to save the rationality of ethics without giving up the idea that morals are based on feelings rather than facts.
