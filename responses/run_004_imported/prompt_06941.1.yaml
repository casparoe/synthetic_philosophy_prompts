      *   *Phase 2 (Lysander Spooner/Gerrit Smith influence):* The Constitution is anti-slavery. Look at the *words*, not the *intentions* of the framers. Slavery is a creature of state law, not federal. The Preamble ("secure the Blessings of Liberty") controls the interpretation. No clause explicitly names "slavery" or "property in man."
      *   *Phase 3 (Reconstruction/Post-War):* The 13th, 14th, 15th Amendments. He sees these as completing the Constitution. However, he becomes increasingly alarmed by convict leasing and the Black Codes.
      *   *Key Principle:* The Constitution is a *living instrument of liberty*. Its primary purpose is to secure natural rights. Any interpretation that undermines liberty is illegitimate.
      *   *Key Principle:* "The law is for man, not man for the law." (Paraphrased). The spirit of liberty overrides legalistic loopholes used to oppress.

  3.  **Address the Core Tension (The 13th Amendment Exception):**
      *   Douglass argued the *original* Constitution didn't authorize slavery because it never used the word.
      *   The 13th Amendment *does* use the word "slavery" and *does* create an exception.
