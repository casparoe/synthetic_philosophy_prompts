          1.  **Purpose over Loophole:** His textualism was teleological (aimed at liberty). The 13th Amendment's purpose was to end slavery. The exception clause was meant for penal labor (hard labor), not chattel slavery. Using it to recreate chattel-like conditions violates the amendment's *primary* command.
