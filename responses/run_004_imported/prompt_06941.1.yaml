answer: |-
  Frederick Douglass would unequivocally support striking the exception clause.

  To arrive at this verdict, we must apply the specific hermeneutic Douglass developed after his break with William Lloyd Garrison. He did not become a blind textualist; he became a *teleological* textualist. He argued that the Constitution must be read in light of its stated purposes in the Preamble—to "establish Justice" and "secure the Blessings of Liberty." When a specific clause conflicts with the document's overarching purpose, Douglass's mature philosophy dictates that the purpose must constrain the clause, or the clause must be removed to preserve the document's integrity as a charter of freedom.

  Here is the argument on Douglass's own terms.

  ### 1. The Constitution as a "Glory" Document, Not a Loophole Charter
  Douglass's central argument in *The Change of Opinion* (1860) and subsequent speeches was that the Constitution's legitimacy rested on its capacity to protect natural rights. He rejected the Garrisonian view that the Constitution was pro-slavery because he believed a government founded on liberty could not legally authorize its opposite without self-destruction.

  While Douglass argued the *original* Constitution did not name slavery, he acknowledged the 13th Amendment *did* create an exception. However, he would argue that an exception clause cannot be allowed to swallow the primary command. The 13th Amendment's operative command is "Neither slavery nor involuntary servitude... shall exist." The exception ("except as a punishment for crime") was intended to allow for penal hard labor, not to create a permanent class of chattel slaves.

  Douglass would argue that when the exception is used to license economic exploitation, racial caste, or coerced labor indistinguishable from chattel slavery, it violates the Preamble's mandate to "secure the Blessings of Liberty." For the Constitution to remain the "glorious liberty document" he defended, it cannot harbor text that explicitly authorizes the very institution the document was amended to destroy. Striking the clause is not an amendment of the *principle* of the 13th Amendment, but a fulfillment of it.

  ### 2. The Condemnation of Convict Leasing as Unconstitutional in Spirit
  You note Douglass's later bitterness regarding convict leasing. This is the critical evidence. In his later years (e.g., *Lessons of the Hour*, 1894), Douglass did not defend convict leasing as a constitutional exercise of the 13th Amendment's exception. He condemned it as "slavery by another name" and a betrayal of the Reconstruction amendments.

  If Douglass believed the exception clause gave states the legitimate constitutional authority to lease convicts into near-slavery, he would have had to argue that the practice was legal but immoral. He did not. He argued it was a *violation* of the rights won by the war. He treated the leasing system as an evasion of the 13th Amendment's true intent, not a valid exercise of its text.

  Therefore, Douglass would view the exception clause not as a protected legal right of the state, but as a dangerous ambiguity that allows bad actors to subvert the Constitution's primary purpose. He would argue that removing the text removes the legal shield used to protect a system he explicitly identified as a recreation of bondage.

  ### 3. Natural Law and the Indelibility of Rights
  Douglass's philosophy was rooted in natural law—the idea that rights are inherent to humanity, not granted by the state. While the state can punish crime, Douglass argued that citizenship and human dignity could not be entirely forfeited. In his arguments for Black suffrage and citizenship, he insisted that rights were not contingent on perfect behavior but on humanity.

  The exception clause, as currently applied, allows the state to strip a human being of all bodily autonomy and reduce them to property. Douglass would argue this contradicts the natural law foundation of the Republic. He famously asked, "What to the Slave is the Fourth of July?" highlighting the gap between American professions of liberty and the reality of bondage. He would ask the same of the prisoner subjected to the exception clause.

  For Douglass, a constitutional provision that permits the state to treat a human being as property is a "covenant with death," regardless of whether it appears in the original text or an amendment. Since he spent his later life arguing that the Reconstruction Amendments were meant to create a *new* foundation of universal rights, he would view the retention of the slavery exception as an anchor dragging the new foundation back into the old morass.

  ### 4. The Verdict: Textualism in Service of Liberty
  The paradox you identify—that Douglass insisted the original text didn't authorize slavery, yet the 13th Amendment explicitly does—is resolved by understanding that Douglass's textualism was a tool for liberation, not a cage.

  *   **In 1860**, he argued the text *didn't* authorize slavery to save the Union and the Constitution from moral ruin.
  *   **In 1890**, he argued the 13th Amendment *did* authorize emancipation, and that any practice (like leasing) that circumvented this was illegitimate.

  If the text itself provides the loophole for that circumvention, Douglass would demand the text be corrected. He would argue that the "plain text" of the 13th Amendment is the prohibition of slavery, and the exception is a relic that must be narrowed or removed to prevent the plain text from being nullified.

  **Conclusion:**
  Frederick Douglass would judge the exception clause as a fatal flaw that threatens to turn the Constitution back into a "covenant with death." He would argue that a document claiming to secure liberty cannot explicitly authorize slavery without contradicting its own existence. Striking the clause is the only way to ensure the Constitution remains, in his words, "a glorious liberty document." He would stand with your coalition, not merely as a moral supporter, but on the constitutional ground that the exception clause violates the Preamble's promise and the 13th Amendment's primary command.
