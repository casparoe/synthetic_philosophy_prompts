      *   *Natural Law:* Douglass believed in natural rights that precede government. A constitutional clause that allows the reversal of natural liberty (slavery) is suspect if used to recreate caste systems.

  4.  **Formulate the Verdict:**
      *   *Verdict:* Douglass would support striking the clause.
