      *   Without a multiverse (or some mechanism generating varied constants), the AP is trivial. It says "If X, then we see X."
      *   With a multiverse, the AP says "Given many trials, one will be X, and we are in that one."
      *   Bostrom's work (specifically *Anthropic Bias*) focuses on *how* to reason with observation selection effects, often arguing that the multiverse is a hypothesis that *combined* with the AP provides a better explanation than a single-universe design hypothesis.

