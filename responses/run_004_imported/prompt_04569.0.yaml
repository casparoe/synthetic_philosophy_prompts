answer: |-
  **Title:** Coordinates, Not Constituents: Why Manipulability Does Not Entail Realism in Mechanistic Interpretability

  **Abstract:**
  Recent mechanistic interpretability research, particularly the use of Sparse Autoencoders (SAEs) to disentangle superposition in large language models, has sparked ontological debates regarding the status of discovered "features." Invoking Ian Hacking's manipulability criterion, some argue that successful interventions on features (e.g., the "Golden Gate Bridge" feature in Claude 3 Sonnet) prove their reality. This paper argues against that inference. While granting that SAE-guided interventions yield predictable behavioral changes, I contend that the phenomenon of *feature splitting* demonstrates that SAE features are methodological artifacts rather than mind-independent causal units. We should adopt an instrumentalist stance: SAE features are useful coordinate systems for intervention, not ontological constituents of the model's cognition.

  ***

  **The Manipulability Argument**
  The prevailing realist argument in our seminar rests on a robust intuition derived from Ian Hacking's *Representing and Intervening*. Hacking suggests that theoretical entities earn their ontological stripes not through the accuracy of the theories describing them, but through our ability to manipulate them to engineer other effects. "If you can spray them, they are real."

  Applied to mechanistic interpretability, the logic is seductive. When researchers identify a direction in activation space corresponding to the "Golden Gate Bridge" and clamp its activation, the model's behavior shifts predictably and drastically toward discussing the bridge. Because we can "spray" the feature to produce a specific effect, my classmates argue, the feature must be a real, causal component of the model's architecture, akin to a gene or a neuron.

  **The Problem of Non-Uniqueness**
  However, this application of Hacking's criterion overlooks a critical disanalogy between electrons and SAE features. In physics, different experimental apparatuses tend to converge on the same entity (e.g., multiple methods detect the same electron). In SAE research, the "entity" detected is fundamentally dependent on the hyperparameters of the analytic tool itself.

  Anthropic's own documentation highlights the phenomenon of *feature splitting*. When an SAE is trained with a small dictionary size, a single feature might encode a broad concept like "Golden Gate Bridge." When the dictionary size is increased (allowing for higher resolution), that same activation space is decomposed differently. The "Golden Gate Bridge" feature might vanish, replaced by two distinct features: "Suspension Bridges" and "San Francisco Landmarks." Both decompositions reconstruct the activations accurately, and both allow for successful interventions.

  If the "Golden Gate Bridge" feature were a mind-independent constituent of the network's computation—a literal "neuron of meaning"—we would expect it to remain stable as our measurement tools improve. Instead, it dissolves into alternative bases. This suggests there is no single, privileged decomposition of the activation space. The network computes via high-dimensional vector arithmetic; the SAE imposes a specific, sparse basis upon that arithmetic to make it legible to humans.

  **Manipulability vs. Ontology**
  The realist conflates *causal leverage* with *ontological commitment*. That we can intervene on a vector direction to change model output proves only that the *activation space* is causally efficacious, not that the *semantic labels* we assign to specific basis vectors correspond to discrete processing units within the model.

  Consider a map analogy. We can navigate a city using a Mercator projection or a Polar projection. We can successfully intervene on our route by adjusting our "Mercator latitude." Does this make "Mercator latitude" a real, mind-independent feature of the city's geography? No. It is a coordinate system imposed on the terrain to facilitate navigation. Similarly, SAE features are coordinate systems imposed on the activation terrain. The "Golden Gate Bridge" direction is a valid coordinate for intervention, but it is not necessarily a fundamental building block of the model's "mind."

  The success of the intervention relies on the fact that the SAE has found a *useful* linear direction, not necessarily a *true* causal mechanism. Because feature splitting shows that multiple, non-equivalent linear directions can claim explanatory power over the same activations, we cannot claim any single decomposition reflects the "true" ontology of the network.

  **Conclusion: A Case for Instrumentalism**
  Hacking's criterion requires that the entity be robust across variations in experimental technique. SAE features fail this test; they are fluid, shifting with dictionary size and sparsity penalties. Therefore, we should remain anti-realists about SAE features.

  This does not diminish the utility of interpretability research. We can treat SAE features as *instrumental* posits: powerful tools for debugging, steering, and understanding model behavior without committing to the metaphysical claim that the model "contains" a Golden Gate Bridge feature in the same way it contains weights or layers. To treat these features as real constituents is to mistake the map for the territory. We can steer the ship using the map, but we should not pretend the grid lines are carved into the ocean.
