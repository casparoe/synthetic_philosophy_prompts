answer: |-
  This is an exceptionally sharp question. You have identified the precise friction point where meta-philosophy, biography, and the sociology of knowledge collide. The case of Frege is indeed the "hard mode" version of the *separability of content and context* debate because Frege himself built his entire system on the claim that content *must* be separable from context.

  To give you the systematic rundown you're looking for, we need to disentangle three distinct layers: the specific historical/philosophical case of Frege, the general logical problem (the genetic fallacy vs. hermeneutics), and the disciplinary spectrum (why logic feels different from ethics).

  ### 1. The Frege Specifics: The Diary and Dummett

  First, a brief confirmation of the historical ground. Frege's *Tagebuch* (diary) from 1924–1925 was indeed published by Gottfried Gabriel in 1994 (*Gottlob Frege: Briefwechsel mit D. Hilbert, E. Husserl, B. Russell, sowie ausgewählte Einzelbriefe*). Prior to this, Frege was viewed as a somewhat reclusive, apolitical bachelor. The diary revealed him to be a virulent antisemite, a monarchist who despised the Weimar Republic, and an admirer of proto-fascist strongmen.

  Michael Dummett, whose 1973 *Frege: Philosophy of Language* essentially canonized Frege for the analytic tradition, wrote a famous introduction to the 1997 edition of Frege's *Basic Laws of Arithmetic*. Dummett did not mince words. He called the diary "shocking" and admitted that Frege was "a reactionary and an antisemite." However, Dummett did not abandon Frege's philosophy. His stance serves as a primary data point for **Position A (The Autonomist)** below.

  ### 2. The Conceptual Map: Four Positions on Character and Content

  When we ask whether an author's moral failings invalidate or color their theoretical work, philosophers generally cluster around four positions.

  #### Position A: Radical Autonomism (The "Fregean Shield")
  *   **The Claim:** The truth-value or validity of a proposition is entirely independent of the psychological or moral state of the proposer.
  *   **The Fregean Basis:** This relies on Frege's **Anti-Psychologism**. For Frege, "Thoughts" (*Gedanken*) inhabit a "Third Realm" distinct from the external physical world and the internal mental world. They are objective abstract objects. Therefore, the biography of the person grasping the Thought is as irrelevant to the Thought's truth as the biography of a calculator is to the sum it produces.
  *   **Application:** Frege's *Begriffsschrift* (concept notation) is valid regardless of his hatred of Jews. To suggest otherwise is to commit the **Genetic Fallacy** (confusing the origin of a belief with its justification).
  *   **The Weakness:** As you noted, using Frege's own anti-psychologism to defend Frege can feel question-begging. It assumes anti-psychologism is *true*. If one believes that all logic is ultimately grounded in human practices (later Wittgenstein, Brandom, or pragmatists), then the "Third Realm" is a fiction, and the social/moral context of the logician *does* matter.

  #### Position B: Hermeneutic Contextualism
  *   **The Claim:** While validity might be independent, *meaning* and *interpretation* are not. We cannot fully understand *why* a philosopher asked certain questions or framed certain distinctions without knowing their biography.
  *   **The Nuance:** This position distinguishes between **Validity** (does the argument hold?) and **Significance** (why does this argument exist?).
  *   **Application to Frege:** Frege's logic might be valid, but his later philosophy of language (sense/reference) might be interpreted differently knowing his political views. For example, did his obsession with "objective thought" stem from a fear of social chaos and pluralism? Dummett leaned this way: he suggested Frege's political reactionaryism might explain his philosophical hostility to anything "subjective" or "psychological."
  *   **The Weakness:** It risks sliding into reductionism, where every philosophical move is explained away as a symptom of bias rather than engaged with as an argument.

  #### Position C: The Contamination Thesis
  *   **The Claim:** In some cases, moral/political bias is not just biographical background; it is *structurally embedded* in the theory itself.
  *   **The Test:** Does the theory *require* the bias to function?
  *   **Comparison:** This is the standard charge against Heidegger. Critics argue Nazism isn't just in Heidegger's biography; it's in the structure of *Being and Time* (e.g., the valorization of "destiny" and "folk").
  *   **Application to Frege:** Most scholars argue Frege passes this test. His logic does not *require* antisemitism to function. However, his later writings on culture and language show more signs of contamination.
  *   **The Weakness:** It is very difficult to prove. It requires showing a logical entailment between a moral premise and a formal conclusion, which is rare in high-level formal work.

  #### Position D: Ethical/Pragmatic Exclusion
  *   **The Claim:** Even if the work is intellectually valid, we may choose not to teach or canonize it based on the author's character.
  *   **The Rationale:** This is not an epistemic claim (about truth) but an ethical one (about community). Canonizing a monster signals that the community tolerates monstrosity.
  *   **Application:** Some argue we should de-center Frege in curricula, not because his logic is wrong, but because centering him harms marginalized students.
  *   **The Weakness:** It conflates the *study of truth* with the *celebration of persons*. It risks impoverishing the discipline to satisfy moral hygiene.

  ### 3. Discipline Sensitivity: Why Logic Feels Different

  You asked if there is a principled reason formal disciplines are more insulated than ethics. There is, and it hinges on **Truth-Conditions**.

  | Discipline | Insulation Level | Principled Reason |
  | :--- | :--- | :--- |
  | **Logic / Math** | **High** | Truth conditions are internal and formal. $A \to A$ is true regardless of who writes it. The "object" of study (formal relations) is abstract. |
  | **Natural Science** | **Medium-High** | Empirical verification is theoretically independent of the observer. However, *choice of research* and *interpretation of data* can be biased (e.g., eugenics). |
  | **History / Sociology** | **Medium** | The "data" is interpretive. Bias affects what counts as evidence and how narratives are constructed. Biography is highly relevant. |
  | **Ethics / Political Theory** | **Low** | The *subject matter* is human value and conduct. If the theorist demonstrates a fundamental failure of moral perception (e.g., endorsing slavery), their moral intuitions are directly evidentially compromised. |

  **The Principled Distinction:**
  In logic, the "object" is distinct from the "subject." In ethics, the "subject" (the moral agent) is part of the "object" (the study of moral agency). Therefore, a flaw in the subject is a flaw in the data for ethics, but not necessarily for logic.

  ### 4. Addressing Your "Circularity" Worry

  You asked: *Is there something almost self-undermining about reaching for that same move [anti-psychologism] to wave away the diary... or does that just quietly assume the very separability thesis that's actually in question?*

  This is the crux. It is not logically circular, but it is **philosophically contingent**.

  1.  **It is not circular:** To say "Frege's anti-psychologism protects Frege's work from biographical criticism" is not a circle; it is an application of a theory. It is like saying "Newton's laws explain why the apple fell." You are using the theory to explain the resilience of the theory.
  2.  **It is contingent:** The defense *only works if Frege was right about anti-psychologism.*
      *   If you are a **Platonist** about logic (like Frege), then the diary is irrelevant to the logic.
      *   If you are a **Pragmatist** or **Naturalist** (like Quine or Rorty), who believes logic is a refined tool of human language and practice, then Frege's biography *is* relevant. It tells us about the social pressures and cultural blind spots that shaped the tool.

  So, when Dummett used Frege's own standards to save Frege's logic, he was effectively saying: *"I accept Frege's Platonism about logic, even though I reject Frege's morality."* He was willing to compartmentalize.

  ### 5. The Dummett Synthesis

  Dummett's actual reaction is perhaps the most mature philosophical response to this problem. He did not say "The diary doesn't matter." He said:
  1.  **Moral Judgment:** Frege was morally repugnant.
  2.  **Philosophical Judgment:** Frege's logic remains foundational.
  3.  **Hermeneutic Adjustment:** We must now read Frege's later philosophy (specifically his views on language and community) with suspicion, knowing that his desire for "objectivity" may have been a reaction against a pluralistic society he hated.

  Dummett realized that while the *formal system* (the *Begriffsschrift*) is insulated, the *philosophical motivation* behind it is not.

  ### Summary: How to Carve It Up

  If you are looking for a principled way to navigate this in discussion, here is the taxonomy:

  1.  **Validity vs. Genesis:** Always distinguish between "Is the argument valid?" (Logic) and "Why did they make this argument?" (History/Biography). The former is insulated; the latter is not.
  2.  **Formal vs. Normative:** Acknowledge that insulation decreases as the subject matter moves from formal symbols to human values. Logic is highly insulated; Political Theory is not.
  3.  **The "Contamination" Check:** Ask: *Does the theory require the bias?* If the logic works without the antisemitism, the logic stands. If the ethical theory requires the subjugation of a group, the theory falls.
  4.  **The Meta-Philosophical Cost:** Admit that defending Frege requires defending **Anti-Psychologism**. If you think logic is a human practice, you must admit Frege's humanity (flaws and all) is part of the logic's history.

  **The Verdict:**
  Using Frege's anti-psychologism to defend Frege isn't a genetic fallacy, but it is a **commitment**. It commits you to the view that logical laws are mind-independent. If you hold that view, the diary is tragic but philosophically inert. If you hold that logic is a social practice, the diary is a crucial piece of data for understanding the limits and blind spots of that practice. Dummett chose the former for the logic, and the latter for the biography, and managed to hold both thoughts at once. That is likely the most stable position available.
