answer: |-
  The humidity inside the recording tent was a physical weight, pressing the paper of my notebook against the clipboard. Outside, the jungle hummed—a dense, cyclical noise of insects and wind that had become the silence against which I measured everything. Inside, the red light of the recorder blinked steadily. Across from me sat Kael, his hands resting on his knees, watching me with a patience that felt older than my discipline.

  We were six weeks in. I had three hundred hours of audio, a preliminary phonology that seemed stable, and a lexicon of about four hundred roots. It was enough to build a skeleton. It was enough to start asking questions. It was not enough to know what was happening.

  "Show me the *vrek* again," I said, pointing to a sketch I'd made of the small, rodent-like animal that scurried through the underbrush.

  Kael nodded. "*Vrek*," he said. His tone was flat, informative.

  I had heard this word dozens of times. When a live one ran past, Kael said *vrek*. When I pointed to a dead one lying on the trap line, he said *vrek*. When I pointed to a fur pelt drying on a rack, he said *vrek*. When I pointed to a leg of one cooking over the fire, he said *vrek*.

  In introductory semantics, this is where you draw the box around the stimulus meaning. The range of sensory stimulations that prompt assent to the utterance. But Quine's ghost had been sitting in the tent with us since day one. I could feel it now, in the way the data refused to coalesce into a single ontology.

  I needed to test for identity. I needed to know if *vrek* referred to an enduring object, a temporal stage, or an undetached part. I set up the elicitation session carefully. I took two distinct pelts, laying them side by side.

  "Is this one *vrek*?" I pointed to the left.
  "Yes," Kael said.
  "Is this one *vrek*?" I pointed to the right.
  "Yes."

  I pushed them together until they touched. "Are these two *vrek*?"
  Kael looked at me, then at the pelts. "Yes."

  I noted the response. *Vrek* behaves like a mass noun here. Like "water." You can have two piles of water, but you don't say "two waters." But earlier, when two live animals ran past, Kael had used a plural suffix, *-i*. *Vrek-i*. So it counts sometimes. It masses sometimes.

  I spent the next three days building what I called Manual A. In Manual A, *vrek* translates to "rabbit." The suffix *-i* marks plural objects. The mass usage is a secondary derivational process, akin to "there's too much rabbit on this plate." It fit the data. Every utterance Kael had made since my arrival could be mapped through Manual A and result in a prediction of his assent or dissent that held true.

  But late on the fourth night, by the light of a kerosene lamp, I started Manual B.

  In Manual B, *vrek* translates to "undetached rabbit part." When Kael says *vrek* upon seeing a live animal, he is referring to the largest undetached part present—effectively the whole, but ontologically distinct. When he says *vrek-i* (plural), he is referring to multiple distinct collections of parts. When he points to the pelt, he is pointing to a collection of parts. When he points to the leg, he is pointing to a collection of parts.

  I worked through the corpus. I ran the sentences through the grammar of Manual B.
  *"I killed a vrek."* -> "I separated a collection of parts from the environment."
  *"There are many vrek-i in the forest."* -> "There are many collections of parts in the forest."

  The predictions held. Every single one.

  I felt a cold prickle on the back of my neck that had nothing to do with the air conditioning. I tried to construct a test to break the tie. I needed to ask about identity over time. I needed to ask, "Is this the same *vrek* that was here yesterday?"

  To ask that, I needed the word for "same." I had elicited *talo*. If I pointed to two identical bowls, Kael said *talo*. If I pointed to the same bowl twice, he said *talo*.

  I set up the test. I showed Kael a live animal in a cage. I labeled it *vrek*. The next day, I showed him the same animal.
  "Is this *talo vrek*?" (Same rabbit?)
  Kael assented.

  Then I showed him a different animal of the same species.
  "Is this *talo vrek*?"
  Kael dissented.

  It seemed to settle it. Manual A was correct. *Vrek* is an enduring object. *Talo* is identity.

  But then I went back to the notes from week two. I had recorded a ceremony where a man was painted with clay. The next day, the paint was washed off. I had asked about the man. Kael had used a different classifier. I realized that *talo* didn't mean "same." It meant "matching stimulus pattern." When I showed the same rabbit, the stimulus pattern matched. When I showed the same man washed clean, the stimulus pattern differed enough that the classifier changed.

  In Manual B, *talo* translates not as "identity" but as "stimulus match."
  So, when I asked "Is this *talo vrek*?" I was asking "Does this rabbit-part collection match the previous rabbit-part collection stimulus?"
  Since it was the same animal, the stimulus matched. Kael assented.
  Manual B still fit.

  I tried to find a crack. I thought about spatial continuity. If I cut a rabbit in half, do I have two *vrek*? I couldn't ask that. I couldn't perform the experiment. Even if I could, Kael's answer would be processed through my analytical hypotheses. If he said "yes," Manual A would call it a pluralization of objects. Manual B would call it the revelation of two previously hidden collections of parts. If he said "no," Manual A would call it destruction of an object. Manual B would call it the disruption of a specific collection.

  There was no behavioral evidence that could distinguish between "object" and "collection of parts" because any evidence I gathered had to be interpreted through a translation manual that already presupposed one or the other. The circle was closed.

  I looked at the two notebooks lying on the table. Manual A: *The Grammar of Kaelo Objects.* Manual B: *The Grammar of Kaelo Processes and Parts.*

  They were isomorphic. They predicted every nod, every shake of the head, every utterance Kael would make until the end of time. They were empirically equivalent. And they described fundamentally different worlds. In Manual A, Kael lives among things that persist. In Manual B, Kael lives among ephemeral manifestations of matter.

  I couldn't choose. There was no fact of the matter. The meaning wasn't hidden in Kael's head waiting to be found; meaning *was* the mapping, and the mapping was underdetermined.

  The sun began to rise, bleeding grey light through the tent fabric. The jungle noise shifted from night insects to morning birds. Kael would arrive soon for our final session before I flew out. I had to pack my equipment. I had to finalize the dictionary that would be the only record of this language left when I was gone.

  I picked up my pen. I hovered over Manual A. It was simpler. It felt more like English. It was what my advisor would expect. It was what the department would publish. *Vrek*: n. Rabbit.

  I looked at Manual B. It was more complex, but perhaps more honest to the data's resistance. *Vrek*: n. Undetached collection of rabbit-matter.

  I realized then that picking one wasn't a discovery. It was a decision. It was an imposition of my own ontology onto Kael's behavior. I was not uncovering his mind; I was building a bridge from my mind to his behavior, and I could build that bridge in two ways that were structurally identical but philosophically divergent.

  I closed Manual B. I opened Manual A. I wrote *Rabbit*.

  But as I capped the pen, I knew I was lying. Not maliciously, but necessarily. I was forcing a determinacy where there was none. I would fly home, defend my dissertation, and publish the grammar. Other linguists would read it and say, "Now we know what Kaelo speakers believe." But they wouldn't know. They would only know what Kaelo speakers do, filtered through a manual I had chosen arbitrarily from a set of infinite equivalents.

  Kael stepped into the tent, shaking the rain from his hair. He smiled and sat down. He pointed to the recorder.
  "Ready?" he asked in the pidgin we'd developed.

  "Ready," I said.

  He pointed to the notebook. "What word today?"

  I looked at the page. The ink was still wet. *Rabbit*.
  "Today," I said, my voice sounding thin in the humid air, "we check the words again."

  Kael nodded, comfortable in the certainty of his own speech. I started the recorder. The red light blinked. I watched it, knowing that for every signal it captured, there were a thousand interpretations sleeping silently beneath the waveform, none of them true, none of them false, all of them mine.
