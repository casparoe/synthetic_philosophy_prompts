  okay this has been bugging me for weeks and idk how to explain it. my best friend always told everyone she taught herself guitar and wrote this really beautiful song about her grandma, and that was honestly a big part of why i admired her so much - then last month i found out from her sister that she actually just found the song from some random artist online and never corrected anyone who assumed it was hers. the weird part is hanging out with her feels exactly the same as before i knew, shes still just as funny and caring as always and nothing about our actual friendship changed. but i can't shake this feeling that i'm loosing something anyway, and my other friend says thats dumb since if it feels the same then nothing was actually lost and i just have hurt pride. is she right, or can something actually be missing even if i can't feel any difference?
