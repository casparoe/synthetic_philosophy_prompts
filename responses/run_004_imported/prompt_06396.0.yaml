answer: |-
  Here are 8 questions designed for a podcast interview, including follow-ups keyed to likely Thomist responses.

  **1. The Moral Weight of the Title**
  "Your book leans heavily on Aquinas's distinction between a tyrant *ex defectu tituli* (a usurper with no right to rule) and a tyrant *ex parte exercitii* (a legitimate king who rules badly). You argue we can kill the usurper but not the legitimate tyrant. But morally speaking, if the outcome for the citizen is identical—oppression, injustice, violence—why does the *origin* of the ruler's power matter more than the *abuse* of it? Does this distinction actually do moral work, or does it just protect the sanctity of the office at the expense of the people?"

  *   **Follow-up:** "You'll likely say that order and authority are goods in themselves. But if a legitimate king is actively destroying the common good, hasn't he already severed the bond of authority? Why does the 'title' act as a moral shield against force when his actions have already declared war on his subjects?"

  **2. The Prohibition on Private Citizens**
  "Aquinas is adamant that a private citizen cannot assassinate a tyrant, even a bad one. But in a scenario where the tyrant controls the courts, the army, and the legislature, the 'public authority' you rely on to remove him doesn't exist. By ruling out private action, aren't you effectively ruling out *any* action in the most desperate cases? Is this a principled stand against murder, or a practical guarantee of impunity for tyrants?"

  *   **Follow-up:** "I expect you'll argue that private killing leads to anarchy and vendettas. But if the state has monopolized violence and is using it to crush the common good, isn't the 'anarchy' already here? Why is the risk of chaos worse than the certainty of tyranny?"

  **3. Who Constitutes the 'Community'?**
  "You argue that the 'community' or a superior authority can remove a tyrant, but not an individual. In a modern context, who exactly is authorized to make that call? If we don't have a Holy Roman Emperor to appeal to, does this default to the military? The parliament? A revolutionary council? How do we prevent this 'public authority' exception from just becoming vigilante justice with a committee?"

  *   **Follow-up:** "If you say it requires constitutional mechanisms, what happens when the tyrant has suspended the constitution? At that point, doesn't your theory leave us with no agent capable of acting, rendering the right to resistance theoretical rather than real?"

  **4. The Incentive to Label**
  "One of the classic objections to tyrannicide theory is that it incentivizes rebellion. If the difference between a lawful removal and a murder hinges on whether the ruler is a 'usurper' or a 'tyrant,' doesn't that encourage every faction to brand their opponent a usurper to justify violence? How does your Thomistic framework prevent the 'usurper' label from becoming a mere political weapon?"

  *   **Follow-up:** "You might say there are objective criteria for usurpation. But political legitimacy is often contested. If two sides genuinely believe the other is the usurper, doesn't your view sanctify civil war rather than preventing it?"

  **5. The 'Pray' Fallback**
  "In *On Kingship*, Aquinas suggests that when human remedies fail against a tyrant, the recourse is to pray to God. Critics call this quietism. If your political philosophy's fallback position when justice is impossible is divine intervention, aren't you admitting that Thomism offers no practical solution for the worst political evils? Is 'pray about it' a sufficient political ethic?"

  *   **Follow-up:** "I anticipate you'll say this is about avoiding greater evils, like civil war, and trusting in Providence. But isn't there a moral cost to tolerating grave evil when you have the capacity to stop it? Does patience become complicity?"

  **6. Elections and Usurpation**
  "Aquinas wrote for monarchies, but we live in democracies. If a leader is elected legitimately but then subverts the constitution to stay in power indefinitely, do they become a usurper *ex post facto*? Or does the initial election grant them a permanent 'legitimate' status that forbids forceful removal? Where does the line cross in an electoral system?"

  *   **Follow-up:** "If you say they become a usurper once they break the law, doesn't that mean any illegal act by a leader justifies force? How do you keep that threshold high enough to prevent instability without making it so high that it's useless?"

  **7. Stability vs. Justice**
  "Thomist political thought often prioritizes the preservation of the regime to ensure the common good. But doesn't this create a bias toward stability over justice? If the choice is between a bloody revolution that might restore justice or a peaceful continuation of tyranny, does your view implicitly demand we choose the tyranny to avoid the bloodshed?"

  *   **Follow-up:** "You'll likely argue that a peace built on bloodshed isn't a true common good. But is a peace built on the silence of the oppressed really peace? At what point does the 'disturbance' of justice become preferable to the 'quiet' of oppression?"

  **8. The July 20th Plot**
  "Finally, let's apply this to the hardest case. The July 1944 plot to assassinate Hitler involved military officers and civilians acting against a head of state who was initially appointed legally but became a monster. Under your reading of Aquinas, was that plot morally licit? Was Hitler a usurper who could be killed, or a legitimate authority who had to be tolerated or removed only by a superior power that didn't exist?"

  *   **Follow-up:** "If you say the plot was justified, doesn't that require stretching the definition of 'usurper' or 'public authority' so far that it undermines the strict prohibitions you defend earlier? And if you say it wasn't justified, can you defend a theory that forbids killing Hitler in 1944?"
