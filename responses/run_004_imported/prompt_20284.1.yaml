answer: |-
  **SCENE START**

  **SETTING:**
  A dimly lit sports bar, Tuesday night. The noise level is a low hum of chatter and clinking glass. ALEX (Philosophy PhD, wearing a slightly frayed blazer) and JAMIE (Quant Trader, wearing a Patagonia vest that costs more than Alex's blazer) are sitting in a booth. Between them sits a phone displaying a Polymarket interface: *Will the incumbent win the popular vote?* YES shares are trading at 54 cents.

  Alex is hovering a thumb over the "NO" button. Jamie has their phone out, ready to match the position on "YES."

  **ALEX**
  (Hovering)
  Wait.

  **JAMIE**
  What? The line's moving. If you want fifty-four, click it.

  **ALEX**
  I can't. I literally… I think I can't do this.

  **JAMIE**
  (Laughs, short and sharp)
  You're having a crisis of conscience over a fifty-dollar election bet? Since when do epistemologists have gambling addictions?

  **ALEX**
  It's not the money. It's the consistency. Look, we've been over this. We both think we're rational. We both know the other went to grad school. We both know the other knows the basic probability calculus.

  **JAMIE**
  Okay…

  **ALEX**
  And right now, I'm looking at your screen, and I see you're buying YES at fifty-four. That means your posterior probability is at least 54%. My posterior is… well, I'm about to buy NO, so mine is below 50%.

  **JAMIE**
  Right. That's why there's a trade. I think it's more likely than you do.

  **ALEX**
  But where did those posteriors come from? We're looking at the same public polls. We've read the same FiveThirtyEight analysis. The only difference is… what? Your gut? Some proprietary model you're not showing me?

  **JAMIE**
  My "gut" is pattern recognition built on ten years of data, Alex. Call it private info if you want.

  **ALEX**
  If it's private info, fine. But we're sitting here. We *know* we disagree. I know you're betting YES. You know I'm betting NO. That disagreement is now common knowledge. If we share a common prior—and we should, we started with the same universe—Aumann says our posteriors should have converged. They haven't. So one of the assumptions is broken.

  **JAMIE**
  (Puts phone down, leans in)
  You're invoking Aumann's Agreement Theorem to stop us from making a bet in a sports bar?

  **ALEX**
  I'm invoking the No-Trade Theorem. Milgrom and Stokey. If we have a common prior, and we both know we're rational expected-utility maximizers, we shouldn't be able to agree to a zero-sum bet. The fact that we *are* agreeing to it proves either you think I'm irrational, or I think you're irrational, or we're lying about the common prior.

  **JAMIE**
  Okay, stop. Take the training wheels off. You're treating the Common Prior Assumption like it's a law of physics. It's not. It's a modeling convenience.

  **ALEX**
  It's the Harsanyi Doctrine. Differences in belief must stem from differences in information, not differences in priors. If we have different priors, one of us is objectively weighting the evidence wrong from the start.

  **JAMIE**
  No. That's the bait-and-switch your professor pulled. Harsanyi didn't prove priors *are* the same. He proved that if you *assume* they are the same, you can model agents *as if* they have different priors but different information. It's a mathematical trick to make the game solvable. It doesn't mean there is a "God's Eye" prior that we both failed to download at birth.

  **ALEX**
  But if priors are just… arbitrary… then rationality loses its normative force. If your prior says "always bet on red" and mine says "always bet on black," and we call that "rational," then the word rational just means "consistent." It doesn't mean "correct."

  **JAMIE**
  Exactly. Rationality is internal consistency. It's not matching your beliefs to some Platonic truth. My prior is mine. Yours is yours. I've got edge, you've got… what do you have?

  **ALEX**
  I have a model that suggests the market is overreacting to the latest scandal.

  **JAMIE**
  So you have private info. I have private info. We're trading on information asymmetry. That's not a violation of Aumann, that's the whole point of markets.

  **ALEX**
  But Aumann says if we *know* we disagree, the asymmetry gets traded away! If I know you're a rational trader, and I see you buying YES, I have to ask myself: "Why is Jamie buying?" If Jamie is rational, Jamie must have info I don't. So I should update my belief toward YES. But if I update toward YES, and you see me updating, you update toward NO… we iterate until we meet in the middle. We shouldn't be betting. We should be agreeing on a price and sitting on our hands.

  **JAMIE**
  (Sips beer)
  You're describing angels. Not traders.

  **ALEX**
  I'm describing what it means to be rational!

  **JAMIE**
  You're describing what it means to be a logic gate. Look, Alex. The Common Prior Assumption requires that before we were born, before we saw a single scrap of data, we had the exact same probability distribution over the state of the universe. That's insane.

  **ALEX**
  It's not about birth. It's about the logical space of possibilities. If we are both trying to track the truth, there is a correct way to weight evidence.

  **JAMIE**
  Is there? Why? Maybe I'm more risk-averse. Maybe I weight recent data heavier than historical data. That's a prior. You call it a bias; I call it a strategy. In my world, if I assume you and I have the same prior, I go broke. Because I assume you know something I don't, so I fold. And then I never make money.

  **ALEX**
  So you're admitting you're assuming I'm irrational?

  **JAMIE**
  I'm admitting I don't know what's in your head. Aumann requires *common knowledge* of posteriors. We don't have that. I see your bet. I don't know your model. You don't know my weighting. We have incomplete information about each other's information.

  **ALEX**
  But we know we're both trying to maximize expected utility.

  **JAMIE**
  Do we? Maybe I'm hedging a different position. Maybe I'm bored. Maybe I'm irrational. The theorem holds in a closed system. We are not in a closed system.

  **ALEX**
  (Pauses, rubs temples)
  Okay. I hear you. But here's the thing that keeps me up. If you say "priors are personal," you're saying there's no fact of the matter about whether a belief is reasonable before evidence comes in. That means if I believe the moon is made of cheese with probability 0.99, and you believe it's rock with 0.99, and we see the same evidence, we can remain apart forever. That's not just "different strategies." That's… solipsism.

  **JAMIE**
  It's humility. It's admitting I can't prove my starting point is better than yours, only that it works for me.

  **ALEX**
  But then why are we betting? If it's just "my prior vs. your prior," it's not a bet on the election. It's a bet on whose priors are more profitable.

  **JAMIE**
  (Grins)
  Bingo. That's the market.

  **ALEX**
  That's not epistemology. That's Darwinism.

  **JAMIE**
  Same thing, eventually.

  **ALEX**
  (Sighs, looks at the phone)
  I feel like we're talking past each other. I'm making a claim about how we *ought* to reason if we want to converge on truth. You're making a claim about how agents *do* behave when money is on the line.

  **JAMIE**
  And I'm saying your "ought" implies a "can" that doesn't exist. You can't get a common prior without a God to hand them out.

  **ALEX**
  And I'm saying without a common prior, "rational disagreement" is just a polite phrase for "we can't communicate."

  **JAMIE**
  So what? We walk away?

  **ALEX**
  If we walk away, we acknowledge that at least one of us is failing the rationality test. Either I'm ignoring the signal your bet sends, or you're ignoring mine.

  **JAMIE**
  Or… we acknowledge that the theorem assumes we know each other's minds better than we know our own. I don't know if you're rational, Alex. I know you're smart. But are you updating correctly? I don't know. So I take the bet.

  **ALEX**
  And if I take the bet, I'm asserting that my prior is superior to yours, without being able to justify why, other than… it's mine.

  **JAMIE**
  (Shrugs)
  It's the only one you've got.

  *Silence stretches between them. The bartender drops a tray of glasses nearby. They both flinch, then look back at the phones.*

  **ALEX**
  If I click this… I'm essentially saying I don't respect your rationality.

  **JAMIE**
  If you don't click it… you're saying you respect my rationality more than your own model.

  **ALEX**
  (Quietly)
  Maybe the model is the problem.

  **JAMIE**
  Maybe the theorem is.

  *Alex stares at the "NO" button. Jamie's thumb hovers over "YES." The cursor blinks. Neither moves.*

  **ALEX**
  Do you think… do you think if we talked for another hour, we'd converge?

  **JAMIE**
  (Laughs, but it's tired)
  No. I think we'd just get better at explaining why we're not going to.

  **ALEX**
  Then we're not common knowledge.

  **JAMIE**
  No. We're just friends.

  *Alex locks the phone screen. Jamie doesn't. The screen glows between them, the numbers ticking up to 54.5.*

  **SCENE END**
