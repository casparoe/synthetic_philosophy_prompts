prompt: |-
  Okay so I've been going down a rabbit hole lately that started with redistricting algorithms. There's this whole civic-tech niche where people write optimization code (simulated annealing, MCMC over district maps, that sorta thing) to fight gerrymandering by scoring maps on compactness, population balance, keeping counties/communities whole, etc. Somewhere down that rabbit hole I ran into some political philosophy papers about something called the "boundary problem" — saw names like Whelan and Goodin getting thrown around — and I honestly assumed at first this was just academic-speak for the exact same redistricting problem I've been hacking on. But the more I read the more it seems like they're pointing at something totally different, and treating it as this huge, maybe unsolvable puzzle at the heart of democracy, which lead to me getting kinda confused, because isn't this basically just an optimization problem?

  Like once you define your objective function (contiguity, equal population, whatever fairness metric you like), you can just let a computer chew through the possible ways to partition people into districts and get a defensible answer out the other end. I mentioned this to a friend who did a poli sci degree and even she couldn't really explain why its treated as such a deep issue rather than an engineering problem we just haven't thrown enough compute at yet. So — am I missing some crucial distinction between what these theorists mean by "the boundary problem" and the kind of redistricting problem I actually write code for? Or is this genuinely a case of academics dressing up something tractable in fancy language to make it sound more profound than it actually is?
