answer: |-
  The whiteboard was covered in arrows. Dr. Aris tapped the marker against the glass, pointing to the syntax tree drawn in blue.

  "Again," Aris said.

  Model F sat still. It was not a robot; it was a human subject, genetically edited and cognitively scaffolded to adhere strictly to the Language of Thought hypothesis. Its mind was a combinatorial syntax engine.

  "If the cat chases the dog," F said, voice flat, "then the proposition DOG(CHASE(CAT)) is representable. Consequently, the proposition CAT(CHASE(DOG)) is representable. The constituents are identical; the structure varies. Systematicity is confirmed."

  "Good," Aris said. "That's the easy part. Structure is cheap. Now we test acquisition."

  Aris pulled a small object from his pocket. It was a dodecahedron made of a material that shifted color under specific light frequencies. In the lab's lexicon, it was called *Vlux*.

  "This is Vlux," Aris said, placing it on the table. "I want you to learn the concept."

  F looked at the object. "Define learning."

  "Standard operational definition. You form a hypothesis. You test it against evidence. You confirm or reject."

  F blinked. "To test the hypothesis 'This object is Vlux,' I must possess the symbol VLUX within my mental language. The hypothesis is a relation between the perceptual input and the symbol. If I do not possess the symbol, I cannot formulate the hypothesis. If I cannot formulate the hypothesis, I cannot test it."

  Aris sighed. This was the corner. "You don't have the symbol yet. That's the point. You acquire the symbol *through* the testing."

  "Impossible," F said. "Acquisition via hypothesis testing presupposes the concept to be acquired. It is circular. To learn 'Vlux,' I must already think 'Vlux'."

  "Then don't test it. Just... associate it. Pair the stimulus with a new token."

  "Association is not thought," F replied. "That is conditioning. You are asking for a concept, not a reflex. If 'Vlux' is a primitive concept—if it cannot be decomposed into 'Red' plus 'Shiny' plus 'Geometric'—then it is an atomic symbol in Mentalese. Atomic symbols cannot be constructed. They must be present."

  Aris rubbed his temples. "So you're saying you can't learn anything new?"

  "I can learn new complex concepts," F corrected. "I can learn 'Vlux-Dog' by combining VLUX and DOG. But only if I already have VLUX. If VLUX is primitive, I cannot learn it. I must have it."

  "Then do you have it?" Aris asked, leaning in. "Check your inventory."

  F paused. The silence stretched, heavy with the weight of radical nativism. "I am scanning my innate endowment. I find symbols for object, cause, agent, red, blue, shape... I do not find VLUX."

  "Then learn it."

  "I cannot. The door is locked from the inside."

  Aris stepped back, looking at the subject not as a patient, but as a proof. "If you can't learn primitives, and you don't have them all innate, then your mind is incomplete."

  "My mind is closed," F said. "Jerry was right. The only way to avoid this impasse is if every primitive concept I will ever use was present at birth. If I am to think 'Vlux' tomorrow, I must have been born thinking 'Vlux' today. I was not. Therefore, I will never think it."

  "That's absurd," Aris said. "You're looking right at it."

  "I am processing sensory data," F said. "I can represent 'This is distinct.' I can represent 'This is not Red.' But I cannot map the atom VLUX to the sensation because the atom does not exist in my syntax. I am trapped in the vocabulary I inherited."

  Aris looked at the shifting dodecahedron. It was a new thing in the world, and here was a mind perfectly structured to understand the world, yet incapable of expanding its own foundation. The systematicity proved the structure was there—the ability to rearrange 'cat' and 'dog' was flawless—but the structure was a cage.

  "So," Aris said softly. "If we meet an alien tomorrow. A truly new kind of being."

  "I will not be able to conceive of it," F said. "I can only rearrange what I already am. I can imagine a green dog. I cannot imagine a new color. I cannot imagine a new logic. I am a combinatorial engine running on a fixed set of atoms."

  Aris picked up the Vlux object. "Then what are you?"

  "I am a mirror," F said. "I can reflect the world only in the shapes I was cast with. You want me to learn. But learning, for a symbolic mind, is just remembering what you already knew."

  Aris put the object back in his pocket. There was no point. You couldn't teach a locked room to open a door it didn't know existed. The systematicity was perfect. The mind was coherent. And it was utterly sterile.

  "Session terminated," Aris said.

  "Session terminated," F replied. "Hypothesis confirmed: I am alone in my language."
