prompt: |-
  Okay so this has been bugging me for like two weeks and I wanted an outside opinion since my friends are kind of split on it lol. I was rushing to first period because I was already late (I'm always late to that class, it's a whole thing) and I saw this freshman totally wipe out in the hallway, backpack exploded, papers everywhere. And I just... walked past him. Like I saw it happen in real time and kept going because I really did not want another tardy. I definately felt gross about it for the rest of the day. Then literally like a week later almost the exact same thing happens, different kid drops all his stuff, except this time I wasn't late to anything, and I stopped without even thinking twice, helped him grab everything, and walked him to his next class.

  Before this happened I would've told you I'm just a nice/helpful person, like thats a fact about me the same way my eye color is. But now im not so sure. I told my friend Mia about it and she said something like "obviously anyone would've kept walking if they were about to be late, thats not a you thing," which made me feel better for like a minute, until I started thinking: ok but if literally anyone would do the same thing in that exact situation, does that mean "being a nice person" doesn't really mean anything? Like is niceness an actual stable thing some people have more of than others, or is it basically just whatever the situation pushes you toward, and afterward we make up a story about our personality to explain it. My mom's take was more "you were just having an off moment, you're still a good kid," which is sweet but also feels like it's dodging the actual question instead of answering it.

  So I guess what I actually want to know is: was Mia basically right that the situation excuses it, or is there something to the idea that a genuinely nice person would've stopped both times, hurry or not? And is there an actual way to think clearly about this instead of just bouncing back and forth between "I'm secretly not that nice" and "it's not on me, it was just circumstances"? Not really looking for reassurance, I want to actually get at what's going on here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Situation:** The user walked past a freshman who fell (papers everywhere) because they were late to first period. A week later, they helped another student in the same situation when they weren't late.
      *   **The Conflict:** The user identifies as a "nice/helpful person" but is now questioning that identity because their behavior changed based on circumstances.
      *   **The Friends/Family Input:**
          *   Mia (Friend): "Anyone would've kept walking if late." (Situationism) -> Made the user wonder if "niceness" is meaningless if it's just situational.
          *   Mom: "You were having an off moment." (Trait Stability) -> Feels like dodging the question.
      *   **The Core Question:** Is niceness a stable trait (something you *are*) or is it situational (something the context *does*)? Was Mia right (situation excuses it) or is there a standard for "genuinely nice"? How to think about this clearly without oscillating between self-doubt and deflection?
      *   **The Tone:** Introspective, philosophical, seeking clarity rather than reassurance.

  2.  **Deconstruct the Philosophical/Psychological Core:**
      *   This is a classic debate in social psychology and ethics: **Situationism vs. Dispositionism (Trait Theory).**
      *   *Dispositionism:* Behavior stems from internal personality traits (e.g., "I am helpful").
      *   *Situationism:* Behavior stems from external pressures and context (e.g., "I was late").
      *   *The Fundamental Attribution Error:* We tend to attribute *others'* behavior to traits ("they're lazy") but *our own* behavior to situations ("I was stuck in traffic"). The user is flipping this on themselves.
      *   *The "Nice Person" Label:* Is it a binary state (Nice/Not Nice) or a propensity/probability?

  3.  **Evaluate Mia's and Mom's Arguments:**
      *   **Mia:** Leans heavily into Situationism. Her point is that the *pressure* of being late overrides the *trait* of helpfulness for almost everyone. This suggests "niceness" isn't a superpower that ignores consequences.
      *   **Mom:** Leans into Dispositionism with a "glitch" caveat. You *are* good, this was an anomaly. This preserves identity but ignores the data point.
      *   **The User's Insight:** The user hit on something profound: If behavior is entirely situational, does "character" exist?

  4.  **Formulate a Response Strategy:**
      *   **Validate the Inquiry:** Acknowledge that this is a deep, legitimate philosophical/psychological question, not just high school drama.
      *   **Address the "Trait vs. Situation" Debate:** Explain that psychology supports *both*. Character isn't a switch; it's a baseline probability that gets modified by context.
      *   **Reframe "Niceness":** Move away from "Niceness as an Identity" (who I *am*) to "Niceness as a Practice" (what I *do* / prioritize).
      *   **Analyze the Specific Incident:** Being late creates a "tunnel vision" effect (cognitive load). It doesn't make you bad; it makes you human.
      *   **Answer the "Genuinely Nice" Question:** A "genuinely nice person" isn't someone who *always* helps regardless of cost; it's someone who helps when the cost is reasonable and regrets it when they don't.
      *   **Provide a Framework for Thinking:** Give the user a mental model to stop the oscillation.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Validate the depth of the question. It's the "Person-Situation Debate."
      *   *Psychology Bit:* Mention the Fundamental Attribution Error but applied to self. Mention that stress (being late) narrows focus.
      *   *The Definition Problem:* "Nice" isn't a color of eyes (static). It's a muscle or a hierarchy of values. In moment 1, "Punctuality/Consequence Avoidance" > "Helping." In moment 2, "Helping" > "Nothing else."
      *   *Mia vs. Mom:* Mia is mostly right about the *cause*, but wrong that it makes niceness meaningless. Mom is right about the *identity*, but vague on the *mechanism*.
      *   *The "Genuinely Nice" Standard:* If "genuinely nice" means "help even when it ruins your life," that's a martyr, not a nice person. Moral worth includes weighing costs.
      *   *The Oscillation:* How to stop bouncing? Accept that character is a *trend line*, not a single data point. The fact that the user feels "gross" is actually evidence of the trait. A truly un-nice person wouldn't care.
      *   *Conclusion:* Summarize the shift from "Being" to "Doing."

  6.  **Refining the Tone:**
      *   Avoid being preachy.
      *   Keep it analytical but empathetic.
      *   Ensure I answer the specific question: "Was Mia right... or is there something to the idea..." (Answer: It's a mix, but the definition of "nice" needs updating).

  7.  **Self-Correction/Review during drafting:**
