answer: |-
  Good evening, everyone. For those who don't know me, I've had the privilege of being Marcus's friend and patrol mate since sixth grade. That is a long time to know someone. Usually, when you know someone that long, you learn to ignore their habits. But Marcus is different. He documents his habits.

  For years, there has been a piece of tape inside Marcus's scout binder. On it, he's drawn a grid. It's a tracking chart for the thirteen virtues Benjamin Franklin listed in his *Autobiography*. Franklin tried to master them one by one. And Marcus, in his own earnest, half-joking way, tried to do the same. Specifically, he has been engaged in a long-term campaign against the virtue Franklin called "Order."

  Now, anyone who knows Marcus knows this campaign has been… ongoing. If Franklin struggled with punctuality, Marcus has certainly kept him company. But here is the thing that makes Marcus an Eagle Scout: He didn't hide the chart when he missed a mark. He didn't pretend he was perfect. He just kept the tape in the binder. He kept tracking.

  I know there are people in this room who have read Franklin's *Autobiography*. You know that Franklin never actually achieved moral perfection. He admitted that he never got his axe completely bright. He wrote that a "speckled axe" is often best, because a life spent chasing flawlessness can make you rigid, or worse, proud of your own humility. Franklin understood that the value wasn't in the perfection; it was in the attention.

  Scouting, at its best, understands this too. The Scout Oath doesn't say "Do Your Perfect Best." It says "Do Your Best." It acknowledges that we are works in progress.

  Marcus is an Eagle Scout not because he arrived at a destination where he never makes a mistake, is never late, and never struggles. He is an Eagle Scout because he shows up with his chart. He shows up with the self-awareness to know where he falls short and the integrity to keep trying to close the gap. In a world that encourages us to curate perfect images of ourselves, Marcus has chosen to be a little speckled. He chooses honesty over the appearance of flawlessness.

  Franklin wrote that he hoped his descendants would imitate his example, "the circumstances attending it considered." Marcus, I think you've done that. You've taken the struggle, not just the success.

  So, as you move forward from this rank, my wish for you isn't that you finally master Order. My wish is that you keep the tape in the binder. Keep measuring yourself. Keep showing up, even when you're fighting your own nature. Because the Eagle rank isn't a trophy for finishing the game; it's a badge that says you're ready to keep playing it seriously.

  Congratulations, Marcus. We're proud of the man you're becoming, chart and all.
