answer: |-
  This is a sophisticated disagreement that touches on the boundary between decision theory and welfare economics. Both you and your friend are citing seminal, correct results, but you are correct in your suspicion: **the two claims operate at different levels of analysis and rely on different assumptions about the economic environment.**

  Your friend is right that information can be socially harmful, but wrong to characterize Hirshleifer's result as a logical counterexample to Good's theorem. You are closer to the truth: the results are compatible because they answer different questions under different constraints.

  Here is the rigorous comparison you requested to settle the dinner argument.

  ### 1. I. J. Good's Theorem (1967)
  **The Claim:** For a single Bayesian decision-maker, the expected utility of observing free, relevant evidence before acting is always greater than or equal to the expected utility of acting without it.

  **The Mechanism:**
  Good's proof relies on the convexity of the utility function over probabilities. Essentially, having more information allows you to tailor your action to the specific state of the world. Since you can always choose to ignore the information and act as if you hadn't seen it, the option to use it must have non-negative value.

  **Key Assumptions:**
  *   **Single Agent:** The theorem analyzes the private expected utility of one decision-maker.
  *   **Fixed Action Space:** The set of available actions (options) remains constant regardless of what the information reveals.
  *   **No Externalities:** The agent's utility depends on the outcome of their decision and the state of the world, but not on how their information acquisition alters the environment for others (which might feedback to harm them).
  *   **Costless Information:** The evidence is "free" in terms of resources.

  ### 2. Jack Hirshleifer's Argument (1971)
  **The Claim:** The public arrival of information can reduce social welfare (aggregate utility) by destroying risk-sharing opportunities (insurance) that depend on uncertainty.

  **The Mechanism:**
  Hirshleifer analyzes a general equilibrium setting with multiple agents. Before information arrives, agents are behind a "veil of ignorance" regarding their specific endowments or risks. Because they are uncertain, they are willing to trade contingent claims (insurance) to smooth consumption across possible states. Once information arrives publicly, the uncertainty is resolved. The market for insurance against those specific risks collapses because the "losers" can no longer get coverage and the "winners" no longer need to sell it. Agents are left with their raw, uninsured endowments, which may yield lower expected utility for everyone ex-ante.

  **Key Assumptions:**
  *   **Multiple Agents:** The analysis concerns social welfare and market interactions.
  *   **Endogenous Action Space:** The arrival of information changes the *feasible set* of economic arrangements (i.e., insurance markets cease to function).
  *   **Public Information:** The information is observed by all market participants, altering prices and trading incentives.

  ### 3. The Precise Divergence
  The reason these two results do not contradict is that Hirshleifer's scenario violates a critical implicit assumption in Good's theorem.

  **The "Fixed Action Space" Assumption**
  Good's theorem assumes that upon receiving information, you still have access to all the actions you had before, plus the ability to condition them on the new data. In Hirshleifer's model, the arrival of information **removes actions**. Specifically, it removes the ability to enter into insurance contracts that were only viable under uncertainty.

  If observing evidence causes your set of available options to shrink (e.g., "If I learn I am sick, I can no longer buy health insurance"), Good's theorem does not guarantee that the information has positive value. Good's proof holds only if the information refines your beliefs *within* a fixed decision problem. Hirshleifer shows that information can change the *structure* of the decision problem itself.

  **Individual vs. Social Rationality**
  Good's theorem is a statement about **individual rationality** (partial equilibrium). It says, "Given the world as it is, you should not refuse free info."
  Hirshleifer's argument is a statement about **collective rationality** (general equilibrium). It says, "If we all receive this info, the structure of our interactions changes such that we are all worse off."

  This is analogous to a Prisoner's Dilemma. Individually, I may benefit from knowing (or defecting), but if we all know (or defect), the collective outcome is worse. Good proves the individual benefit; Hirshleifer identifies the social cost.

  ### 4. The Verdict

  **You are closer to being right.**

  *   **Your Intuition:** You suspected the claims are "simply about different things." This is mathematically and economically accurate. Good is discussing the *value of information for a decision function*; Hirshleifer is discussing the *value of information for a market equilibrium*.
  *   **Your Friend's Error:** Your friend claimed Hirshleifer is a "direct counterexample" to Good. This is false. A counterexample would require a single Bayesian agent, facing a fixed set of actions, for whom free evidence has negative expected utility. Hirshleifer does not provide this; he provides a scenario where the *social environment* changes upon information arrival, violating Good's premises.

  **How to concede gracefully:**
  You should acknowledge that your friend identified a profound economic insight: **Private value does not equal social value.** While Good proves that *I* should not refuse free information for my own decision-making, Hirshleifer proves that *we* might wish to collectively commit to ignorance to preserve insurance markets.

  **Summary for the record:**
  Good's theorem holds for the individual within a fixed environment. Hirshleifer's effect arises when information alters the environment (specifically, the feasibility of risk-sharing). Therefore, Hirshleifer does not disprove Good; he merely delineates the boundary where individual decision theory ends and welfare economics begins. You win on the logic; your friend wins on the economic intuition.
