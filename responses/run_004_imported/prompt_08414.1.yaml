answer: |-
  This is an incredibly heavy burden to carry, and I am so sorry for your loss. Writing a eulogy is hard enough without trying to honor the complexity of a person while you are grieving. You are right to want to avoid simplifying him; the truth of who he was is more powerful than a myth.

  Here is a draft that attempts to hold both sides of him—the man of action and the man of thought—without resolving the tension between them. Please feel free to change any words to sound more like you, or to add specific memories of him.

  ***

  **Eulogy for [Brother's Name]**

  Thank you all for being here. Looking out at this room, I see the different worlds my brother lived in. I see the firefighters and the rowing club—people who know him for his strength, his discipline, and his physical courage. I see his friends from university, the ones who know him for his mind, his questions, and the things that kept him up at night. And I see our family, who knew him in all of it.

  Two weeks ago, [Brother's Name] died saving a little girl from the river near our parents' home. He got her to the bank. He made sure she was safe. And then the current took him.

  In the days since, I've heard him called a hero. And he was. There is no hesitation in that fact. For the firefighters and the rowers here, that heroism is something you recognize instantly. It's the instinct to move when others freeze. It's the training to trust your body when the water turns dangerous. I know many of you see his death as a tragic accident of bravery, and in many ways, it was.

  But if I only tell you that story, I am not telling you the whole truth of who he was. And [Brother's Name] cared too much about the truth for me to leave it out.

  For as long as I can remember, my brother was wrestling with a specific question. Some of his philosophy friends know the reference well. It was about a drowning child. The idea is simple: If you saw a child drowning in a shallow pond, and you could save them but it would ruin your clothes or make you late, you would do it. Of course you would. But he argued that the distance doesn't change the math. He believed that if we can save a life—anywhere—and we don't, we are walking past the drowning child.

  For some people, that's just a theory. For [Brother's Name], it was a weight. He didn't use this idea to judge other people. He used it to judge himself. It ate at him. He worried that he wasn't doing enough, that he wasn't giving enough, that he was comfortable while others weren't. He never really made peace with that tension. He carried it like a stone in his pocket.

  I tell you this not to turn his funeral into a lecture, but to explain why he didn't hesitate at the river.

  For the rest of us, saving that girl would have been a split-second decision. For him, it was a decision he had made a thousand times before. He had already weighed the cost. He had already decided, in the quiet moments of his life, that the safety of others mattered more than his own comfort, more than his own plans, and ultimately, more than his own life.

  When he waded into that water, he wasn't just acting on instinct. He was acting on conviction.

  I know some of you might find that heavy. You might wish he could have just been a hero without the burden. You might wish he could have saved that girl and come home to argue another day. I wish that too. God, I wish that too.

  But he didn't leave us a simple story. He left us a complicated one. He showed us that thinking deeply about what is right isn't just an intellectual exercise. It isn't just for reading groups or classrooms. He showed us that what you believe about the world eventually meets the water.

  To the firefighters and the rowers: Honor him for his strength. He had plenty of it.
  To his friends from philosophy: Honor him for his integrity. He lived the questions he asked.
  And to our family: We honor him by remembering that he was both. He was the muscle and the mind. He was the action and the reason for the action.

  We cannot resolve the struggle he felt. We cannot fix the world in his name today. But we can try to be a little less comfortable. We can try to care a little more seriously. Not because we have to be perfect, but because he showed us that the cost of caring is high, and yet, it is the only thing that makes us human.

  [Brother's Name], you kept your promise. You didn't walk away. We will miss you, every day, for the rest of our lives.

  Rest now.
