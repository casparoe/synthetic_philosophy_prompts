      *   Deliver the "Stop" signal gently but clearly regarding the "more variables" claim.
      *   Explain the nuance (Causal inference > Statistical adjustment).
      *   Offer alternative one-liners.
      *   Provide a "Monday Morning Checklist" instead of a single rule.

