answer: |-
  You have hit on one of the most famous and enduring critiques in the philosophy of economics. Your intuition is sharp: if "preference" is defined *solely* as "what was chosen," then saying an agent "maximizes preference" is indeed logically equivalent to saying "the agent did what the agent did."

  This is often called the **tautology problem** of revealed preference theory. Philosophers like Amartya Sen and Daniel Hausman have written extensively about it.

  However, economists do not consider the theory empty. Here is why they believe "utility maximization" remains a substantive, testable, and meaningful claim, along with where your critique actually holds water.

  ### 1. It is falsifiable through *consistency*, not single choices
  You are correct that a single choice cannot falsify the theory. If I choose coffee over tea, you can always assign numbers (Utility: Coffee=10, Tea=5) that make that choice look like maximization.

  However, revealed preference theory is not about a single choice in isolation. It is about the **logical consistency of choices across different situations.**

  To say an agent is maximizing a stable utility function imposes strict constraints on how their choices must change when their constraints (prices, income) change.
  *   **The Test:** If you choose Coffee over Tea when both cost $1, you have "revealed" a preference for Coffee.
  *   **The Falsification:** If next week Tea costs $1 and Coffee costs $2, and you choose Tea, that is consistent (Coffee is now more expensive). **But**, if next week both still cost $1 and you choose Tea, you have violated the **Weak Axiom of Revealed Preference (WARP)**.

  If you violate WARP, **no utility function exists** that can describe your behavior. Therefore, the claim "this agent is maximizing a utility function" is falsifiable. It is falsified by intransitive or inconsistent choices (e.g., preferring A to B, B to C, but C to A).

  ### 2. It generates specific empirical predictions
  Because the theory requires consistency, it allows economists to make specific predictions about how demand responds to price changes, independent of knowing the person's psychology.

  The most famous example is the **Slutsky Equation**. If the theory of utility maximization holds, then under certain conditions, demand curves must slope downward (with some technical caveats regarding Giffen goods). If we observed people systematically buying *more* of a good solely because its price rose (holding real income constant), in a way that violated the Slutsky conditions, the utility maximization model would be rejected.

  The theory restricts the *pattern* of behavior. It says: "You can do anything you want, but once you do X, you are logically forbidden from doing Y later." That restriction is the substantive content.

  ### 3. The "Money Pump" Argument (Normative Rationality)
  Even if the theory were purely descriptive, it serves a normative role in decision theory. Why *should* we treat utility maximization as an ideal of rationality?

  Consider an agent with intransitive preferences (A > B, B > C, C > A).
  1.  I offer to trade your C for B (since you prefer B). You pay me $1.
  2.  I offer to trade your B for A (since you prefer A). You pay me $1.
  3.  I offer to trade your A for C (since you prefer C). You pay me $1.

  You now have your original item (C) but you are $3 poorer. I can repeat this forever and drain your bank account. This is called a **Money Pump**.

  "Maximizing utility" is essentially a requirement for **coherence**. It is the mathematical way of saying "your choices shouldn't allow you to be exploited." Economists treat it as a meaningful ideal because violating it implies a form of self-defeating behavior.

  ### 4. The "As If" Defense (Instrumentalism)
  Many economists, following Milton Friedman, adopt an instrumentalist view. They argue that it doesn't matter whether people *actually* have a utility function in their heads or whether the definition is circular.

  The question is: **Does assuming they maximize utility help us predict aggregate market behavior?**

  If assuming people act *as if* they are maximizing utility leads to accurate predictions about inflation, interest rates, or supply shocks, then the theory is useful, regardless of the philosophical tautology. For many economists, the "truth" of the axioms matters less than the success of the models built upon them.

  ### 5. Where you are right (The Behavioral Critique)
  Your skepticism is shared by modern **Behavioral Economics**.

  Researchers like Daniel Kahneman and Amos Tversky demonstrated that humans *do* systematically violate the axioms of revealed preference. We suffer from framing effects, context dependence, and intransitivity.
  *   **Example:** You might prefer a small apple to a large orange, and a small orange to a small apple, but when presented with a large orange and a small orange, the presence of the large one changes your preference between the others (violating the "Independence of Irrelevant Alternatives").

  When these violations occur, the "utility function" breaks down. Behavioral economists argue that because the axioms are frequently violated, the standard model is indeed often an empty or misleading description of human psychology.

  ### Summary
  You are correct that **without constraints**, utility maximization is a tautology.

  However, economists treat it as substantive because:
  1.  **It imposes constraints:** It forbids inconsistent choices (WARP/GARP).
  2.  **It is falsifiable:** If choices are inconsistent, no utility function can be constructed.
  3.  **It is normative:** Inconsistency leads to exploitation (Money Pumps).
  4.  **It is predictive:** It allows for specific mathematical derivations about demand (Slutsky).

  The theory is not "people do what they do." It is "people do what they do, **provided that what they do today doesn't contradict what they did yesterday.**" That proviso is where the science lives.
