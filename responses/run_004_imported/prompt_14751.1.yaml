              *   *Score:* This is a big mistake. Maybe 2/6 or 3/6. They defined the *concepts* (mostly) but swapped the names and the resulting alignment.

      *   **Part (c): Present one serious objection to Thirder, sketch Thirder response.** (6 pts)
          *   *Student Answer:*
              *   Objection: "Presumptuous Philosopher" (PP).
