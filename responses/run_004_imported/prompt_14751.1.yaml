              *   Thirder Response: SB reshuffles credence within a single run, doesn't license runaway inference about external world.
          *   *Critique:*
              *   *Attribution Error:* The Presumptuous Philosopher argument is due to **Nick Bostrom** (2002), *not* Adam Elga. Elga is the primary defender of Thirdism (and SIA-like reasoning), Bostrom is the critic who devised the PP case *against* SIA/Thirdism. Attributing the counter-argument to the proponent is a factual error.
