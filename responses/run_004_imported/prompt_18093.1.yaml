answer: |-
  **Title:** The Meet of the Partitions

  **Characters:**
  *   **ALICE:** A rationalist.
  *   **BOB:** A rationalist.
  *   **THERAPIST:** A normal person.

  **Setting:** A marriage counseling office.

  **THERAPIST**
  Okay, so you're both here because you feel like you're drifting apart. Usually, I'd ask you to share your feelings, but your intake form says you prefer "Bayesian Dialogue."

  **ALICE**
  Correct. Sharing qualitative evidence introduces noise. We'll use the Geanakoplos-Polemarchakis protocol.

  **BOB**
  Common priors established?

  **ALICE**
  Established. We both agree the base rate for divorce in our demographic is 40%.

  **THERAPIST**
  Right. So... Alice, how do you feel about the marriage?

  **ALICE**
  (Turning to Bob)
  Posterior probability of divorce within five years: 85%.

  **BOB**
  (Nods, thinking)
  Interesting. If you were 90%, I'd know you found the credit card statements. Since you're only 85%, you must have only found the hotel receipt.

  **ALICE**
  And if you were below 50%, I'd know you still think you can gaslight me. But you're hesitating. Your posterior is high.

  **BOB**
  Posterior probability of divorce: 70%.

  **ALICE**
  Updating. You know about the receipt, but you're lower than me. That means you have exculpatory evidence I haven't seen. But you can't tell me what it is, or I'd update on the evidence directly rather than your announcement.

  **BOB**
  Exactly. I'm updating on the fact that *you* know about the receipt.

  **ALICE**
  New posterior: 78%.

  **BOB**
  New posterior: 74%.

  **ALICE**
  76%.

  **BOB**
  75.5%.

  **ALICE**
  75.2%.

  **BOB**
  75.1%.

  **ALICE & BOB**
  (In unison)
  75.1%.

  **THERAPIST**
  Okay! You've converged. So, you agree there's a 75.1% chance you're getting divorced.

  **ALICE**
  Common knowledge achieved.

  **THERAPIST**
  Great. So, do you want to try to work on it? Like, maybe talk about *why*?

  **ALICE**
  Why would we do that?

  **THERAPIST**
  Because... you still don't know *why* the probability is 75.1%. Alice, you don't know what evidence Bob has. Bob, you don't know the full extent of Alice's evidence. You only know the *number*.

  **BOB**
  That's a feature, not a bug. If we shared our partitions, we might discover our priors weren't actually common.

  **ALICE**
  Right now, we have perfect agreement on the outcome without the mess of understanding the cause. It's efficient.

  **THERAPIST**
  But how do you fix a problem if you don't know what it is?

  **ALICE**
  (Stands up)
  We don't fix it. We just accept the posterior.

  **BOB**
  (Stands up)
  Indeed. The theorem guarantees we can't agree to disagree. It doesn't guarantee we'll stay married.

  **ALICE**
  (To Bob)
  Same time next week to update on the separation proceedings?

  **BOB**
  Only if you promise not to reveal your lawyer's discovery requests. Just shout the settlement probability.

  **ALICE**
  Deal.

  *(They exit. The Therapist stares at the whiteboard, which just has the number "75.1%" written on it.)*

  **THERAPIST**
  (To self)
  I'm billing them for the hour.
  (Pauses)
  Actually, given their willingness to pay, my posterior on *them* paying is... 100%.

  **(Blackout)**
