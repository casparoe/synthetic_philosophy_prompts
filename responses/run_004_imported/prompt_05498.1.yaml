answer: |-
  This is a fantastic knot to untangle. You have hit on one of the central tensions in contemporary moral philosophy regarding blame: is the loss of standing about the **logic of the address** (Wallace) or the **moral history of the addresser** (Cohen)?

  They are not merely verbal disagreements; they represent two different architectures for understanding what gives someone the authority to hold another accountable. Here is the breakdown of the two views, applied to your oil exec case, followed by a verdict on which tracks our intuitions.

  ### 1. R. Jay Wallace: The Equal Standing Account
  **Core Text:** *"Hypocrisy, Moral Address, and the Emotions"* (and related work on responsibility).

  **The Theory:**
  For Wallace, blame is not just a judgment; it is a **communicative act** (a form of moral address). When I blame you, I am implicitly demanding that you acknowledge a norm that binds us both. This act presupposes a relationship of **moral equality**.

  *   **The Violation:** Hypocrisy undermines standing because the hypocrite implicitly claims an **exemption** from the norm they are enforcing. By blaming you for $X$ while doing $X$, I am effectively saying, "This rule applies to you, but I am special; it does not apply to me."
  *   **The Consequence:** This violates the condition of equal standing. You cannot demand accountability from me if you do not acknowledge yourself as accountable to the same standard. It turns blame from a moral demand into an exercise of power or domination.
  *   **The Fix:** Wallace allows that standing can be restored if the blamer acknowledges their own fault. If I say, "I am doing $X$, it is wrong, I am guilty too, but you should stop," I re-establish equal standing by submitting myself to the same judgment.

  **Key Metric:** Is the blamer claiming a *normative exemption* in the act of blaming?

  ### 2. G.A. Cohen: The Complicity / Clean Hands Account
  **Core Text:** *"Casting the First Stone: Who Can Condemn the Terrorists?"* (2002).

  **The Theory:**
  Cohen is less interested in the logical presuppositions of speech acts and more interested in **moral positionality within structural injustice**. His argument arises from the question: Can Western powers condemn terrorists?

  *   **The Violation:** Cohen argues that standing is lost not just through identical acts of hypocrisy, but through **complicity in the background conditions** that produce the wrong. Even if I do not commit the specific act you are committing, if I benefit from or sustain the system that makes your act likely (or necessary), I lack the moral purity to condemn you.
  *   **The Consequence:** It is about "clean hands." If my hands are dirty from the same *source* of injustice, even if the dirt is slightly different, I am morally disqualified from casting the first stone. It is a substantive claim about moral history, not a procedural claim about communication.
  *   **The Fix:** Much harder to fix. Acknowledging fault helps, but if the structural advantage remains (e.g., wealth gained from injustice), the standing may remain compromised because the power dynamic is still skewed.

  **Key Metric:** Is the blamer **complicit** in the broader injustice they are condemning?

  ---

  ### The Case Study: The Former Oil Exec
  **Scenario:** A former executive made millions funding drilling projects (but never held a drill themselves). They are now a climate activist shaming everyday people for their carbon footprints (e.g., flying, eating meat, driving SUVs).

  #### Wallace's Verdict
  Wallace would look closely at the **norm being enforced**.
  *   **If the norm is:** "No one should emit carbon."
      *   *Analysis:* Does the exec currently emit carbon? Probably yes (we all do). If they live a high-carbon lifestyle while shaming others for small carbon acts, Wallace says they lack standing because they claim an exemption (my emissions don't count, yours do).
      *   *Nuance:* However, if the exec has radically reduced their personal footprint and acknowledges their past, Wallace might grant them standing. For Wallace, the crucial thing is the *current attitude*. If the exec says, "I profited from this, it was wrong, I am guilty, but we must stop," they are not claiming an exemption. They are submitting to the norm.
  *   **Verdict:** **Conditional Standing.** If the exec is repentant and currently abides by the norm, Wallace says they can blame. The past profit is a separate moral failing, not necessarily a defeater for *current* standing to enforce the norm of emission reduction.

  #### Cohen's Verdict
  Cohen would look at the **structural relationship**.
  *   **The Analysis:** The everyday person's carbon footprint is often a matter of survival or participation in a system they didn't build. The exec *built* (or funded) the system and profited from it.
  *   **The Complicity:** The exec is complicit in the *cause* of the crisis, while the everyday person is merely participating in the *effects*. For Cohen, the exec lacks standing because their wealth and position are derived from the very injustice they are now condemning others for navigating. Shaming the little guy while sitting on oil money is the definition of lacking "clean hands."
  *   **Verdict:** **No Standing.** The exec is structurally complicit. It does not matter if they are personally "reformed." Their moral authority is undermined by the fact that they are blaming victims of a system they profited from. To Cohen, this looks like the West condemning terrorists while ignoring the foreign policy that fueled radicalization.

  ---

  ### Which Theory Tracks Intuition Better?

  Here is the crux of your piece. In the specific context of **political hypocrisy and structural injustice** (like climate change), **Cohen tracks our intuitions significantly better than Wallace.**

  Here is why:

  **1. The "Exemption" Problem (Wallace's Weakness)**
  Wallace's theory works beautifully for interpersonal morality (e.g., a cheating spouse condemning infidelity). But in politics, the "exemption" is often structural, not just behavioral.
  The oil exec might say, "I am not claiming an exemption! I agree emissions are bad!" Wallace would have to grant them standing if they are personally low-emission now. But our intuition screams that something is still wrong. We feel the *wealth disparity* and the *causal history* matter. Wallace's focus on the *logic of address* misses the *material reality* of the blamer.

  **2. The "Complicity" Insight (Cohen's Strength)**
  Cohen captures why we hate the "individual carbon footprint" narrative when pushed by corporations. It feels like gaslighting. Cohen explains this: the blamer is complicit in the *background injustice* (the lack of green infrastructure, the lobbying against regulation) that forces the individual to have a high footprint.
  When the exec shames the individual, they are shifting the burden of a structural crime they profited from onto the shoulders of those who had no choice. Cohen's "clean hands" doctrine explains why this undermines standing even if the exec isn't technically violating the *exact same norm* at this *exact moment*.

  **3. Is the Disagreement Verbal?**
  No, it is substantive.
  *   **Wallace** is asking: "Are you claiming to be above the law?"
  *   **Cohen** is asking: "Did you write the law to benefit yourself while punishing others for breaking it?"

  You can answer "No" to Wallace (I submit to the law!) and "Yes" to Cohen (I wrote the law!).

  ### Recommendation for Your Piece

  If your piece is about **political hypocrisy call-outs**, Cohen is the heavier lifter.
  Wallace explains why we dislike a preacher who drinks on the sly. Cohen explains why we dislike a billionaire telling the working class to eat less meat while they lobby against agricultural regulation.

  The "rabbit hole" you are falling into reveals a shift in the literature: older accounts (like Wallace's) treat standing as a matter of **consistency**, while newer accounts (influenced by Cohen, Bell, or Fritz) treat standing as a matter of **power and justice**.

  **The Verdict:**
  In the case of the Oil Exec, **Cohen wins.**
  Wallace would let the exec off the hook too easily (provided they are "reformed"). Cohen correctly identifies that the *source of their authority* (their wealth/status) is tainted by the *object of their blame* (the climate crisis). The hypocrisy isn't just "do as I say, not as I do"; it is "I broke the world, now I will judge you for living in the rubble." That is a loss of standing that Wallace's "equal standing" model is too narrow to capture.

  Use Wallace to explain why *personal* hypocrisy feels slimy. Use Cohen to explain why *political* hypocrisy feels oppressive.
