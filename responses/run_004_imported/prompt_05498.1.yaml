          *   Apply Cohen: The exec is structurally complicit. They profited from the harm. They lack the moral position to shame the little guy. Cohen says "No standing."
      *   **Section 4: Comparison/Verdict.**
          *   Is it verbal? No, it's structural vs. transactional.
          *   Which fits intuition? Cohen fits the "oil exec" intuition better. We feel the *wealth/power disparity* and *historical causation* matters more than just "do they drive a gas car now?"
          *   Nuance: Wallace protects against *self-righteousness*. Cohen protects against *structural gaslighting*.
      *   **Conclusion:** Summarize. Suggest that for political hypocrisy (systemic issues), Cohen is the stronger tool. For interpersonal morality, Wallace is sharper.

  7.  **Review and Refine:**
      *   *Check Wallace:* Make sure not to conflate Wallace with simple "tu quoque." Wallace is about the *presuppositions of moral address*. The hypocrite undermines the *relationship*.
      *   *Check Cohen:* Ensure the distinction between "hypocrisy" and "complicity" is clear. Cohen argues that complicity *defeats standing* even without strict hypocrisy.
      *   *Case Study:* Ensure the distinction between "drilling the well" (act) and "making a fortune" (benefit/complicity) is highlighted.
      *   *Tone:* Keep it academic but accessible (the user is clearly well-read).

  8.  **Final Polish:** (Self-Correction during drafting) *Wait, does Wallace allow for repentance?* Yes, Wallace discusses that acknowledging one's own fault can restore standing. I should mention that. If the oil exec says "I was wrong, I profited, but we still need to stop," Wallace might grant standing. Cohen might still say the structural power dynamic prevents true equal standing. This highlights the difference well.

