prompt: |-
  So I've been falling down a rabbit hole on the "standing to blame" literature after writing a piece on all the hypocrisy call-outs in politics (every scandal now comes with someone yelling "you're a hypocrite, shut up" like that settles anything). Two accounts of why hypocrisy actually undermines standing to blame keep bumping into each other in my notes and I cant tell if they really disagree. One is R. Jay Wallace's "equal standing" story: hypocritical blame fails because your implicitly claiming an exemption from the norm you're holding someone else to, which breaks the equal standing that blaming (as a kind of address) is supposed to presuppose. The other is G.A. Cohen's line from "Casting the First Stone" (his piece on who gets to condemn terrorists), which, if I remember right, is less about narrow do-as-I-say-not-as-I-do hypocrisy and more about whether you're complicit in the same background injustice, even without personally doing the exact thing.

  Can you lay out both views properly and then tell me which gives the better verdict on this case: a former oil exec turned climate activist, who never drilled a single well themselves but made a fortune off the industry, now shaming everyday people for their carbon footprints. Does one theory actually track our intuitions better here, or is the Wallace/Cohen disagreement more verbal than real?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing about political hypocrisy call-outs ("you're a hypocrite, shut up").
      *   **Problem:** They are confused about two specific accounts of "standing to blame" regarding hypocrisy: R. Jay Wallace's "equal standing" view and G.A. Cohen's "complicity/background injustice" view (from "Casting the First Stone"). They want to know if these views disagree or if the disagreement is merely verbal.
      *   **Task:**
          1.  Lay out both views properly (Wallace vs. Cohen).
          2.  Apply both views to a specific case study: A former oil exec turned climate activist who shames everyday people for their carbon footprints.
          3.  Evaluate which theory tracks intuitions better or if the disagreement is superficial.

  2.  **Deconstruct the Philosophical Views:**

      *   **R. Jay Wallace (The "Equal Standing" / Normative Authority View):**
          *   *Core Idea:* Blame is a communicative act (address) that presupposes a relationship of moral equality.
          *   *The Flaw of Hypocrisy:* When a hypocrite blames, they implicitly claim a special exemption for themselves from the norm they are enforcing. This violates the condition of equal standing.
          *   *Key Nuance:* It's not just about doing the bad thing; it's about the *attitude* or *claim* inherent in the blaming act. If I blame you for X while doing X, I am saying "The rule applies to you, but not to me." That undermines my authority to hold you accountable.
          *   *Source:* Primarily "Hypocrisy, Moral Address, and the Emotions" (though the user might be thinking of *The Stance of Taking Someone to Be Responsible*). Let's stick to the core "equal standing" argument found in his work on hypocrisy.

      *   **G.A. Cohen (The "Complicity / Clean Hands" View):**
          *   *Core Idea:* Focuses on who has the *moral position* to condemn, often in structural contexts.
          *   *The Flaw:* It's not just about identical actions (do-as-I-say-not-as-I-do). It's about benefiting from or contributing to the *system* that produces the wrong. Even if I don't do the specific act, if I am complicit in the broader injustice, I lack the standing to cast the first stone.
          *   *Source:* "Casting the First Stone: Who Can Condemn the Terrorists?" (2002). Cohen argues that Western powers/citizens lack standing to condemn terrorists because they are complicit in the global injustices that fuel terrorism.
          *   *Key Nuance:* This is broader than strict hypocrisy. It's about *moral purity* or *clean hands* regarding the *structural conditions*.

  3.  **Analyze the Case Study:**
      *   **Subject:** Former oil exec turned climate activist.
      *   **Action:** Made a fortune off the industry (complicity) but never drilled a well (no identical act).
      *   **Target:** Everyday people's carbon footprints.
      *   **Conflict:** Shaming individuals for small contributions while having profited massively from the system causing the problem.

  4.  **Apply the Views to the Case:**

      *   **Wallace's Application:**
          *   Did the exec claim an exemption?
          *   If the exec says, "You must reduce emissions," but lives a high-emission lifestyle *now*, that's classic hypocrisy (Wallace).
          *   But the prompt says they are an *activist* now. Presumably, they are trying to live better now. The issue is their *past*.
          *   Wallace focuses on the *current* relationship of equality. If the exec says, "The norm applies to you, but my past profits exempt me from the guilt," that might fit. But Wallace is usually about *current* violation of the norm being blamed.
          *   *Verdict:* Wallace might struggle here if the exec is currently following the norm. The "exemption" claim is tricky. Is profiting from oil a violation of the norm "don't emit"? Not exactly. It's a violation of "don't profit from harm."
          *   *Refinement:* Wallace's view is about the *authority* to blame. If the exec blames people for emissions while having caused way more, are they claiming an exemption? Maybe not an exemption from the *rule*, but an exemption from the *consequences* or *shame*.
          *   *Weakness:* Wallace is often criticized for being too narrow (focuses on identical norm violation).

      *   **Cohen's Application:**
          *   This fits Cohen perfectly.
          *   The exec is complicit in the background injustice (climate change) via profit, even if they didn't pull the lever (drill the well).
          *   They lack "clean hands."
          *   Cohen explicitly deals with structural complicity (Western citizens vs. Terrorists). Here: Oil Profiteer vs. Everyday Citizens.
          *   *Verdict:* Cohen would likely say the exec lacks standing because their hands are dirty from the *system* they are now condemning others for participating in.

  5.  **Evaluate the Disagreement (Verbal vs. Real):**
      *   Is it just semantics?
      *   Wallace is about the *logic of the blaming act* (presuppositions of address).
      *   Cohen is about the *moral status of the blamer* (complicity in structural wrongs).
      *   They are distinct. Wallace is deontological/procedural regarding the speech act. Cohen is substantive regarding moral history and structural justice.
      *   *Which tracks intuition?* Most people feel the oil exec *is* hypocritical or lacks standing, even if they are "reformed." Cohen explains *why* better than Wallace. Wallace requires a violation of the *same norm*. Cohen allows for violation of *related structural norms*.
      *   *Synthesis:* They aren't contradictory, but they cover different ground. Wallace explains why *I can't blame you for lying if I lie*. Cohen explains why *I can't blame you for stealing bread if I own the bakery that starved you*.

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the depth of the rabbit hole (it's a hot topic in moral philosophy). Validate the user's confusion (the distinction is subtle).
      *   **Section 1: R. Jay Wallace (Equal Standing).** Explain the "normative authority" aspect. Focus on the *claim of exemption*. Blame is a demand for accountability that assumes we are both under the same law.
      *   **Section 2: G.A. Cohen (Complicity/Clean Hands).** Explain "Casting the First Stone." Focus on *structural complicity*. It's not just "did you do X?" it's "are your hands clean of the conditions that made X happen?"
      *   **Section 3: The Oil Exec Case.**
