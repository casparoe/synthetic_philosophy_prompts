answer: |-
  **The Price of Continuity: A Verdict on Cryonics and Personal Identity**

  You are facing a decision that is simultaneously financial, technological, and deeply metaphysical. The premiums for an Alcor membership are not trivial, and they are purchased against the ultimate risk: the cessation of your existence. To justify the expense, you require more than hope; you require coherence. You need to know that the entity waking up in the future is not merely a being who *thinks* it is you, but is the legitimate continuation of your own conscious stream. Your return to Derek Parfit's *Reasons and Persons* is the correct move, but your unease suggests you have identified a crack in the reductionist armor that Parfit himself acknowledged but perhaps downplayed.

  To decide whether this investment is rational, we must move beyond a catalog of theories and determine what "survival" actually means in the context of cryonics. This requires examining Parfit's claim that identity is not what matters, confronting the specific threat of branching in emulation, and weighing the animalist insistence on biological continuity. Ultimately, the coherence of cryonics depends on the method of revival. My verdict is this: **Cryonics is a coherent investment in survival only if it prioritizes biological repair over emulation. If the pathway relies on scanning and emulation, you are not funding your survival; you are funding the creation of a psychological successor.** For the purpose of avoiding death, the latter is not worth the premium.

  ### Parfit's Reductionism and the Teletransporter

  Parfit's central thesis in *Reasons and Persons* is that personal identity is not a deep, further fact. It is not a metaphysical soul or a persistent ego that travels through time. Instead, identity consists entirely in psychological continuity and connectedness (Relation R) and its cause. In ordinary life, Relation R is caused by the continued existence of the brain and body. However, Parfit argues that the *cause* need not be standard for survival to occur.

  Consider his Teletransporter. It scans you, destroys your body on Earth, and recreates an atom-for-atom replica on Mars. The replica has your memories, character, and intentions. Parfit argues that you should not fear this process. Although strict identity might be technically ambiguous (depending on how we define "same body"), what matters—Relation R—holds. You survive.

  Parfit extends this to the "Branch-Line Case." Suppose the machine malfunctions: the Earth body is not destroyed, and the Mars replica is created. Now there are two of you. Parfit admits that strict identity cannot hold here (one person cannot be identical to two distinct people). However, he insists this is not as bad as death. You (on Earth) will die, but someone psychologically continuous with you will live on Mars. For Parfit, this is "survival without identity." He suggests we should care less about the "all-or-nothing" concept of identity and more about the degree of psychological connection.

  ### The Emulation Problem: Branching as Death

  Your specific worry regarding cryonics is that emulation-based revival structurally mirrors the Branch-Line Case, not the standard Teletransporter. In a biological repair scenario, your frozen brain is thawed and healed. The causal chain is continuous, akin to a long sleep. But in an emulation scenario, your brain is scanned to extract its connectome, which is then instantiated on hardware.

  This introduces the possibility of copying. Digital information is non-rivalrous; it can be duplicated. If your mind is software, there is no logical barrier to running two instances of "you" simultaneously. Even if the cryonics organization promises a single instance, the *ontology* of emulation permits branching.

  Here, Parfit's consolation fails to address the prudential concern driving your insurance premium. Parfit claims that branching survival is "not as bad as death." But from the first-person perspective of the person paying the premium, it *is* death. If I step into a teletransporter and a copy appears on Mars while I remain on Earth, *I* do not wake up on Mars. The Mars entity has my memories of stepping into the machine, but my stream of consciousness ends on Earth.

  Parfit treats this as a semantic quibble, suggesting we should care about the future existence of Relation R regardless of who experiences it. But this ignores the subjective locus of experience. The fear of death is the fear of the cessation of *this* specific perspective. If branching is possible, the unique continuity of *this* perspective is broken. If you pay for cryonics to avoid death, you are paying for *your* experience to continue, not for the universe to contain a being with your memories. Emulation, by its nature, severs the unique causal link required for that specific continuity. It creates a successor, not a survivor.

  ### The Animalist Objection

  This intuition is bolstered by the Animalist objection, most notably associated with Eric Olson. Animalism posits that you are not a psychological construct or a pattern of information; you are a human animal. Personal identity is tied to the persistence of the biological organism.

  From this view, the Parfitian Teletransporter is a homicide followed by the creation of a clone. The organism on Earth dies. The organism on Mars is a new organism that merely believes it is the old one. Applied to cryonics, the Animalist argues that if your biological functions cease and are not restarted in the *same* organism, you are dead. An emulation is a simulation of a person, not a person. It is a map, not the territory.

  While Animalism can seem rigid (what about gradual brain replacement?), it captures a vital truth about the substrate of consciousness. Current neuroscience suggests that mental states are not just abstractly encoded but are constituted by the specific physical dynamics of neural tissue. To emulate a brain is to model it, not to be it. If consciousness is a biological process, moving it to silicon is like moving a fire from a wood stove to a computer simulation of a fire; the simulation may behave like fire, but it produces no heat.

  ### The Verdict: Biological Repair vs. Emulation

  So, where does this leave your decision? We must synthesize Parfit's insight that psychology matters with the Animalist insight that substrate matters, while rejecting Parfit's conclusion that branching is acceptable for survival.

  Parfit is correct that psychological continuity is essential. A biological body without memory or character is not *you* in the sense you care about. However, the Animalists are correct that you are your organism. The synthesis lies in the concept of **non-branching causal continuity.**

  For survival to be coherent in the sense that justifies the cost of life insurance, two conditions must be met:
  1.  **Psychological Continuity:** The future being must possess your memories and character (Relation R).
  2.  **Unique Causal Continuity:** The future being must arise from your current state through a process that does not allow for branching.

  Biological repair satisfies both. If your brain is vitrified and later repaired, the causal chain is physical, unique, and continuous. It is analogous to a coma. The organism persists, and the psychology is restored. This counts as survival.

  Emulation satisfies only the first condition. It preserves the pattern (Psychological Continuity) but breaks the physical causal chain (Unique Causal Continuity). Because the pattern can be copied, it inherently allows for branching. Even if only one copy is made, the *type* of existence is one that permits duplicates. Therefore, the entity that wakes up in the simulation is a psychological descendant, not you.

  ### Recommendation

  You asked whether the underlying idea is coherent enough to warrant the rising premiums. The answer depends entirely on the protocol your friend—and you—would be signing up for.

  If the cryonics plan relies on **whole-body or neuropreservation with the intent of biological restoration**, the metaphysical coherence is sufficient to justify the cost. In this scenario, you are betting on future medicine to heal a damaged organism. This is a gamble on technology, but not a gamble on your identity. You would survive.

  However, if the plan relies on **information-theoretic revival (scanning and emulation)**, the idea is incoherent as a survival strategy. In this scenario, you are not insuring your life; you are commissioning a memorial. You are paying to ensure that a being exists in the future who will love your friends and remember your life as if it were their own. That is a noble altruistic act, but it is not survival.

  Given your hesitation and your engagement with Parfit's branching problem, you clearly value the uniqueness of your first-person perspective. Parfit tells you to let go of that uniqueness, but your intuition correctly identifies that letting go of uniqueness is tantamount to accepting death.

  **Therefore, do not commit to the policy unless the contract and the current scientific roadmap prioritize biological repair over emulation.** If the organization views emulation as the primary or only viable path to revival, the premiums are a donation to the future, not an investment in your continued existence. For the specific goal of *not dying*, emulation is a philosophical dead end. Stick to the biology, or keep your money.
