      *   **The Goal:** Show that the "averaging fallacy" accusation begs the question by presupposing a specific causal ontology that the mathematical equivalence undermines.

  3.  **Brainstorming the Deflationary Case (The "Strongest Possible Case"):**
      *   *Argument 1: Underdetermination.* If two models predict exactly the same evolutionary trajectory and are mathematically transformable into one another, empirical data cannot distinguish them. If empirical data can't distinguish them, positing an ontological difference is metaphysical excess.
      *   *Argument 2: Causal Interpretation of the Price Equation.* The Price equation is a tautology. It partitions variance, not necessarily causation. Assigning causal weight to the between-group term requires extra assumptions not contained in the equation itself.
