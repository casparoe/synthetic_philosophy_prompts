answer: |-
  Two game theorists, Alice and Bob, are debriefing after a tournament. They played a Centipede Game with a potential pot of $10,000. Alice chose "Take" at the very first node. She walked away with $10. Bob got nothing.

  Bob is rubbing his temples. "Alice, we just left $9,990 on the table. Why did you take immediately?"

  Alice adjusts her glasses. "It was the only Subgame Perfect Nash Equilibrium. Backward induction."

  "But that logic relies on Common Knowledge of Rationality," Bob argues. "If you had passed just once, I would have observed that deviation. I would have updated my beliefs and realized you aren't a strict backward-induction robot. Once *that* common knowledge is broken, the backward induction argument collapses. My rational move would then be to pass, and we'd both get rich."

  Alice nods slowly. "I know. That's the paradox."

  "So," Bob says, "by playing 'rationally,' you ensured we both got the worst possible outcome? Whereas if you had played 'irrationally,' we could have maximized utility?"

  "Exactly," Alice says. "In the Centipede Game, being rational is a dominated strategy."

  Bob stares at her. "So you're saying the only way to win is to convince the other guy you're too stupid to do the math?"

  "No," Alice says, pocketing her $10. "I'm saying 'Common Knowledge of Rationality' is just academic code for 'Common Knowledge of Poverty'."
