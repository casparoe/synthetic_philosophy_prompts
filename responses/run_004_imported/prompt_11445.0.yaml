          *   Hiring/Promotions: Often Conclusion-Based (holistic fit), but your committee had a rule (AND), which forces Premise-Based logic.
          *   *My take:* If there's a written rule (T & L), you *must* use Premise-Based to respect the rule. If it's holistic, use Conclusion-Based. The error in the user's committee was mixing the two procedures.

