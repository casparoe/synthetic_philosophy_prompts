          *   Vote 2 (Outcome-based/Conclusion-based): Majority said No to Promote.
          *   Constraint: Same 3 voters, no one changed their minds.
      *   **User's Knowledge:** Knows this is the "Doctrinal Paradox" / "Discursive Dilemma." Knows about List & Pettit's impossibility theorem (Arrow's theorem for judgment aggregation). Knows terms like "systematicity," "anonymity," "universal domain."
      *   **User's Goal:** Wants an *intuitive* understanding of *why* this divergence is structurally guaranteed (not just a fluke). Wants the logic built from concrete cases, not abstract axioms. Wants an opinion on "premise-based vs. conclusion-based" voting.
