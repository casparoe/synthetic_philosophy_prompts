      *   Voters: A, B, C.
      *   To get the paradox:
          *   Majority on $T$ must be Yes (2 out of 3).
          *   Majority on $L$ must be Yes (2 out of 3).
          *   Majority on $P$ must be No (2 out of 3).
      *   How? The "Yes" votes on $T$ and $L$ must come from *different* people.
      *   Configuration:
          *   Voter 1: T=Yes, L=Yes $\rightarrow$ P=Yes
          *   Voter 2: T=Yes, L=No $\rightarrow$ P=No
          *   Voter 3: T=No, L=Yes $\rightarrow$ P=No
      *   Check:
          *   T: Yes (1, 2) vs No (3) $\rightarrow$ Majority Yes.
          *   L: Yes (1, 3) vs No (2) $\rightarrow$ Majority Yes.
          *   P: Yes (1) vs No (2, 3) $\rightarrow$ Majority No.
      *   *Intuition:* The "coalition" for Technical is different from the "coalition" for Leadership. They overlap only on Voter 1. When you vote on the conclusion directly, Voters 2 and 3 see a missing piece and vote No. When you vote on premises, the missing pieces get averaged out.

  3.  **Address the "Impossibility Theorem" (List-Pettit):**
      *   The user asked if this is *always possible* for some set of opinions. Yes.
