answer: |-
  This is a fantastic real-world capture of the **Doctrinal Paradox** (or Discursive Dilemma). It feels like a glitch in the matrix, but you are absolutely right: it is not a fluke. It is a structural feature of group decision-making whenever logical connections exist between the questions being voted on.

  To give you that "gut-level feel" for why this divergence is guaranteed to happen, let's reconstruct your Tuesday using the specific logic of the paradox, then look at why the math forces this outcome, and finally tackle which voting method is "less wrong."

  ### 1. The Anatomy of Your Committee's Tuesday

  To see why this isn't a coincidence, we need to look at the specific distribution of opinions that makes the paradox possible.

  You have three voters (A, B, C) and three propositions:
  1.  **Technical Bar ($T$)**
  2.  **Leadership Bar ($L$)**
  3.  **Promote ($P$)**

  The Rule: $P$ is True **IF AND ONLY IF** ($T$ is True **AND** $L$ is True).

  For the paradox to occur (Majority says Yes to $T$, Yes to $L$, but No to $P$), the "Yes" votes for Technical and Leadership must come from **different coalitions**.

  Here is the exact configuration of opinions that likely existed in your room:

  | Voter | Technical ($T$) | Leadership ($L$) | **Promote ($P$)** |
  | :--- | :---: | :---: | :---: |
  | **A** | **Yes** | **Yes** | **Yes** |
  | **B** | **Yes** | No | **No** |
  | **C** | No | **Yes** | **No** |
  | **Majority** | **Yes (2-1)** | **Yes (2-1)** | **No (1-2)** |

  **The Intuition:**
  *   **Voter A** is the "True Believer." They think the candidate is great at everything.
  *   **Voter B** is the "Tech Advocate." They care deeply about technical skills. They see the tech bar is cleared, but since leadership failed, they vote **No** on promotion.
  *   **Voter C** is the "Leadership Advocate." They care deeply about soft skills. They see the leadership bar is cleared, but since tech failed, they vote **No** on promotion.

  **Where the Divergence Comes From:**
  When you voted **issue-by-issue (Premise-Based)**, you aggregated the *optimism*. Voter B's optimism on Tech combined with Voter C's optimism on Leadership created a "Frankenstein Majority" that looks supportive overall, even though neither B nor C actually supports the candidate.

  When you voted **up-or-down (Conclusion-Based)**, you aggregated the *vetoes*. Both B and C had a specific reason to veto the promotion. The logical "AND" gate requires *both* inputs to be green. In the direct vote, B and C respected the "AND" gate individually. In the issue-by-issue vote, the committee effectively turned the "AND" gate into an "OR" gate (Promote if Tech is good OR Leadership is good, as long as different people think so).

  ### 2. Why This Is Structurally Guaranteed (The List-Pettit Logic)

  You asked if there is a "minimal structural fact" that guarantees this. Yes. The impossibility theorem rests on the tension between **Collective Rationality** and **Majority Responsiveness**.

  In your committee context, the List-Pettit axioms translate like this:

  1.  **Universal Domain:** Your committee members are allowed to have any combination of opinions. (e.g., It is legal for Voter B to think "Tech is good, Leadership is bad, so No Promote.")
  2.  **Anonymity:** Every voter counts equally. (No one has a veto or double vote.)
  3.  **Systematicity:** You use the same decision rule (majority vote) for every proposition ($T$, $L$, and $P$).

  **The Impossibility:**
  If you accept those three conditions, **you cannot guarantee that the group's judgments will be logically consistent.**

  Why? Because majority rule is a **linear** aggregator (count the heads), but logic is **non-linear** (the AND gate).
  *   Linear aggregation averages out the "No" votes. (B says No on Leadership, C says No on Tech $\rightarrow$ Average is "Yes" on both).
  *   Logical consistency requires the "No" votes to propagate. (If B says No on Leadership, and the rule is AND, the outcome must be No).

  As long as you have:
  1.  Multiple interconnected issues (Tech, Leadership, Promote).
  2.  A logical constraint linking them (Promote $\iff$ Tech $\land$ Leadership).
  3.  Diverse opinions (people weigh the issues differently).

  ...the divergence is mathematically inevitable for some profile of votes. It is not a bug in your committee; it is a bug in the concept of "Majority Rule" applied to logical propositions.

  ### 3. Premise-Based vs. Conclusion-Based: Which is "Less Wrong"?

  This is the heart of the debate in judgment aggregation theory. There is no mathematically "correct" answer, but there is a **procedurally correct** answer depending on your goal.

  #### Option A: Premise-Based Procedure (Vote on Tech & Leadership, derive Promote)
  *   **How it works:** You accept the majority view on $T$ and $L$, then apply the rule to determine $P$.
  *   **Result in your case:** Promote.
  *   **The Philosophy:** This prioritizes **public reason** and **consistency**. It forces the group to agree on the *facts* before deciding the *outcome*.
  *   **When to use it:** This is standard in **Law** and **Science**.
      *   *Courts:* A supreme court must establish a legal precedent (the premise) that applies to future cases, not just resolve the current dispute.
      *   *Your Committee:* You explicitly stated there is a **rule**: "Someone gets promoted *only if* they clear BOTH bars."
  *   **Verdict:** If the "Tech & Leadership" requirement is a binding constraint (like a union contract or company policy), **this is the only valid method.** To vote "No" on promotion when the majority says both bars were cleared is to violate the written rule. It disenfranchises Voter A, who followed the rules, in favor of B and C, who effectively added a secret veto ("I won't promote unless *I* personally think both are met").

  #### Option B: Conclusion-Based Procedure (Vote on Promote directly)
  *   **How it works:** You ignore the breakdown of $T$ and $L$ and just vote on $P$.
  *   **Result in your case:** Do Not Promote.
  *   **The Philosophy:** This prioritizes **responsiveness** and **holistic judgment**. It respects the individual's right to weigh the premises however they want.
  *   **When to use it:** This is standard in **Legislatures** and **Hiring** (when criteria are vague).
      *   *Juries:* "Guilty or Not Guilty." We don't ask jurors to vote on each piece of evidence separately; we ask for the verdict.
      *   *Hiring:* Often, "bars" are guidelines, not logic gates. A candidate might fail the "coding test" but be such a genius leader that you promote them anyway.
  *   **Verdict:** If the "bars" are just heuristics to help you decide, this method is better. It prevents the "Frankenstein Majority" from promoting a candidate that 2/3 of the committee actually opposes.

  ### The "Less Wrong" Fix for Your Committee

  Given your description, **the Premise-Based Procedure (Issue-by-Issue) is the correct fix**, but with a major caveat.

  **Why?**
  You said: *"The rule is: someone gets promoted only if they clear BOTH the 'technical bar' and the 'leadership bar'."*

  That is a logical constraint. If you use the Conclusion-Based vote (which resulted in "No Promote"), you are effectively allowing individual committee members to redefine the promotion criteria in the privacy of their own minds.
  *   Voter B effectively voted: "Promote only if Tech is Good AND Leadership is Good AND I personally approve of the Leadership assessment."
  *   Voter C effectively voted: "Promote only if Tech is Good AND Leadership is Good AND I personally approve of the Tech assessment."

  By voting "No" on the conclusion despite the premises passing, B and C violated the committee's mandate. They turned a conjunctive rule (AND) into a subjective holistic judgment.

  **However,** the reason this feels unsatisfying is that **the candidate probably shouldn't be promoted.**
  If 2 out of 3 committee members have serious reservations (B doubts leadership, C doubts tech), promoting them is risky. The Premise-Based procedure protects the *rule*, but the Conclusion-Based procedure protects the *risk management*.

  **The Real Solution:**
  The paradox reveals that your **voting rule** is mismatched with your **decision goal**.
  1.  **If the bars are hard constraints:** You must vote Premise-Based. But you need to acknowledge that this might force a promotion that feels uncomfortable. The fix isn't changing the vote; it's ensuring the "bars" are defined so clearly that B and C wouldn't disagree on them.
  2.  **If the bars are guidelines:** Abolish the "AND" rule. Admit that promotion is a holistic judgment. Then vote Conclusion-Based. This legitimizes the "No" vote because it acknowledges that a candidate can pass the bars but still not be the right fit.

  ### Summary Intuition
  The divergence happens because **majorities on parts do not guarantee a majority on the whole** when the parts are combined via logic.
  *   **Issue-by-Issue** averages out the objections (dangerous for risk, good for consistency).
  *   **Outcome-by-Outcome** amplifies the objections (good for risk, dangerous for consistency).

  Your HR partner accidentally ran a stress test on your committee's logic and found a crack. The "fix" isn't to find a better voting math (it doesn't exist), but to decide if you are a **Court** (bound by the premises/rule) or a **Jury** (bound by the verdict/conscience). Given you have a written rule, you're a Court. Stick to the premise-based vote, but maybe revisit whether that rule actually makes sense.
