      *(Self-Correction during drafting)*: I initially thought about bringing in Condorcet's paradox. *Correction:* No, keep it focused on Doctrinal Paradox. Condorcet is about cycles (A>B>C>A), this is about logical inconsistency (Yes, Yes, therefore No). Don't confuse the user. Stick to List & Pettit.

      *(Refining the Axioms)*: The user specifically asked about "systematicity," "anonymity," etc. I should explicitly translate those into "Committee Speak" so they feel their question was answered directly.
      *   Anonymity = One person, one vote.
      *   Universal Domain = Voters can think whatever they want.
      *   Systematicity = We vote on T, L, and P using the same rule (majority).
