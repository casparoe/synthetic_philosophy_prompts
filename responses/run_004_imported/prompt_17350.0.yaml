answer: |-
  Here are nine interview questions designed to progressively narrow the space available for a standard Strawsonian retreat, complete with follow-ups keyed to your guest's likely defensive maneuvers.

  **1. The Excuse/Exemption Boundary**
  "In my new novel, a driver kills a pedestrian during an undiagnosed narcoleptic episode. In Strawson's framework, we usually distinguish between *excuses* (I didn't mean to do it) and *exemptions* (I am not a full participant in the moral community). But this case feels like a category error; the driver didn't choose to sleep, yet he isn't mentally incapacitated in the way we usually exempt. When our reactive attitudes hit this kind of friction, does your naturalism suggest we simply wait to see what our emotions settle on, or is there a fact of the matter about whether resentment is appropriate here that exists prior to our feeling it?"

  *   **Likely Answer:** She will argue that the distinction isn't pre-theoretical; it emerges *from* the practice. If we feel resentment, he's accountable; if we pivot to objective concern, he's exempt. The "fact" is the reaction itself.
  *   **Follow-up:** "So the metaphysical status of the agent is entirely downstream of our emotional response? That suggests if our community became more vengeful, the driver would literally become more responsible. Is the ontology of responsibility that dependent on our psychology?"

  **2. Watson's Distinction (Fittingness vs. Naturalness)**
  "Gary Watson argues that we can judge someone's character as 'bad' (attributability) without necessarily holding them liable to blame or sanction (accountability). Strawson seems to collapse these, implying that if we are in a relationship, the reactive attitudes come as a package deal. Critics suggest this smuggles a normative claim—that these attitudes are *fitting*—under the cover of a descriptive claim—that they are *natural*. Are you claiming we *cannot* stop blaming, or that we *should not* stop blaming because it would cost us something?"

  *   **Likely Answer:** She will likely say the "should" is internal to the practice. To ask if we should have relationships is to ask if we should be human. The "cost" is the loss of interpersonal life itself.
  *   **Follow-up:** "But Watson's point is that we might retain the relationships while modifying the blame. If you admit there is a 'cost' to the practice, aren't you implicitly weighing it against a standard of value outside the practice? What currency are you using to measure that cost?"

  **3. The Objective Attitude and Causal History**
  "Strawson argues we cannot sustain the 'objective attitude' toward everyone all the time because it would mean abandoning love and friendship. But suppose we gained perfect knowledge of everyone's causal history—every trauma, genetic predisposition, and environmental pressure. Would it not be *rationally* inconsistent to maintain reactive attitudes in the face of that data? Is your defense of resentment ultimately a claim that human beings are psychologically incapable of consistency, rather than that our inconsistency is justified?"

  *   **Likely Answer:** She will argue that total causal knowledge is impossible for participants in relationships. Even with knowledge, the participatory stance forces reactive attitudes upon us. It's not inconsistency; it's a different mode of engagement.
  *   **Follow-up:** "Yet we do manage to turn off resentment when we learn enough about someone's history. If the volume of causal knowledge can dial down the 'inescapable' attitude, doesn't that suggest the attitude was answering to a belief about desert all along, rather than just being a brute fact of nature?"

  **4. R. Jay Wallace's Fairness Alternative**
  "R. Jay Wallace offers a rival account where responsibility is grounded in fairness: it's only fair to blame someone if they had the power to grasp and act on moral reasons. This looks like the external justification Strawson says we don't need. If Wallace is right, doesn't that mean Strawson's naturalism is incomplete? Isn't 'fairness' the hidden engine making the reactive attitudes legitimate, rather than the attitudes legitimizing themselves?"

  *   **Likely Answer:** She will likely contend that Wallace is describing the internal norms of our practice, not grounding them in something external. "Fairness" is just another concept within the reactive framework, not a foundation outside it.
  *   **Follow-up:** "But Wallace uses fairness to tell us when our reactive attitudes are *mistaken*. If our practice says 'blame him' but fairness says 'he couldn't have known,' and you side with fairness, haven't you just admitted there is a court of appeal higher than the practice itself?"

  **5. Pereboom and the Plasticity of Resentment**
  "Derk Pereboom and other hard incompatibilists argue that while resentment feels natural, we can actually moderate or extinguish it through sustained philosophical practice and cognitive reframing. If these attitudes are truly constitutive of human interpersonal life, as Strawson claims, why are they so susceptible to erosion by theory? If we can train ourselves out of them without losing our relationships, doesn't that undercut the premise that they are inescapable?"

  *   **Likely Answer:** She will argue that while we can mitigate specific instances, a life entirely devoid of reactive attitudes would be pathological or inhuman. The "practice" Pereboom suggests is itself a niche form of life, not the general human condition.
  *   **Follow-up:** "If it requires a 'niche' philosophical practice to remove them, that admits they are contingent on ignorance. But if they rely on ignorance of determinism, aren't they essentially cognitive errors? And do we have an obligation to correct errors, even comfortable ones?"

  **6. Internal Corrections and External Standards**
  "You've mentioned that our practice has internal resources for correcting excessive blame—we can calm down, listen to others, or reflect. But to correct a practice implies a standard of correctness. If I say your resentment is 'excessive,' am I appealing to a better version of our shared practice, or am I appealing to a moral truth that exists independently of what we happen to feel? If it's just the shared practice, what happens when the whole culture is wrong?"

  *   **Likely Answer:** She will likely say "wrong" only makes sense internally. A culture that blames differently isn't "wrong," just different. If they abandon blame entirely, they aren't immoral, they are post-moral.
  *   **Follow-up:** "That leads to a troubling quietism. If a culture systematically resents victims for their own victimization, your framework seems to lack the tools to call that 'unjust' rather than just 'their practice.' Is naturalism powerless against toxic social norms because it treats those norms as the source of validity?"

  **7. The "Promising" Analogy**
  "In previous interviews, you've compared asking for a justification of blame to asking for a justification of promising—you say the question can only be raised from inside the practice. But we can ask whether the *institution* of promising is beneficial or harmful overall. We can imagine abolishing it. If we can evaluate the practice of promising from the outside, why is the practice of blame immune to that same evaluation? Is the analogy holding, or is it a shield?"

  *   **Likely Answer:** She will argue that promising is a convention, whereas reactive attitudes are a natural outgrowth of human needs for regard and safety. You can abolish conventions; you can't abolish needs without destroying the subject.
  *   **Follow-up:** "But needs can be maladaptive. Evolution gave us many needs we strive to overcome. If blame is a 'need' that causes immense suffering, as my novel explores, why is the demand to evaluate its utility confused? Isn't the request for justification precisely the moment we exercise the rationality that supposedly defines us?"

  **8. The Cost of the Fabric**
  "Let's talk about the 'fabric of interpersonal life' you often cite. For the family in my book, that fabric is woven through with grief and rage. Keeping the practice of blame alive keeps their pain alive; letting it go might bring peace but feels like a betrayal. If the 'fabric' requires the possibility of this specific kind of suffering to exist, is it possible the price of admission is too high? Are you defending responsibility, or are you defending the necessity of pain?"

  *   **Likely Answer:** She will likely say that a life without the possibility of this pain is a life without deep investment. You cannot have love without the risk of resentment. To remove the pain is to remove the stakes of the relationship.
  *   **Follow-up:** "That assumes the pain is a byproduct of love. But for my protagonist, the pain is a prison. If the 'stakes' are high enough to justify a decade of misery, that sounds like a consequentialist calculation. Are you secretly weighing the benefits of relationships against the costs of blame, which is exactly the external justification you claim is impossible?"

  **9. Falsifiability and Evidence**
  "Finally, I want to ask about the status of your claim. You argue that reactive attitudes are the bedrock of human life and require no external justification. What would count as evidence against this view? Is there a psychological discovery, a philosophical argument, or a social phenomenon that, if proven true, would force you to abandon naturalism? Or is the position structured such that any challenge can be absorbed as merely another move within the practice?"

  *   **Likely Answer:** (This is the trap). She will likely struggle here, perhaps suggesting that if humans ceased to have relationships, the theory would fall, but that is tautological.
  *   **Follow-up:** (None, this is the close). "Thank you. It seems the strength of the view is also its vulnerability: if it explains everything we do, it risks predicting nothing we might stop doing."
