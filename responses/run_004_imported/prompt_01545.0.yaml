answer: |-
  Your friend is incorrect. You have not made an arithmetic error, and the scenario you described is mathematically possible.

  This is a classic statistical phenomenon known as **Simpson's Paradox**. It occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined.

  Here is the breakdown of why this happens and how it should guide your decision.

  ### 1. The Math Check
  Your calculations are accurate. Here is the verification:

  **Agent A**
  *   **Literary:** 45/100 = **45%**
  *   **Commercial:** 18/20 = **90%**
  *   **Overall:** (45 + 18) / (100 + 20) = 63/120 = **52.5%**

  **Agent B**
  *   **Literary:** 8/20 = **40%**
  *   **Commercial:** 85/100 = **85%**
  *   **Overall:** (8 + 85) / (20 + 100) = 93/120 = **77.5%**

  Agent A wins in both individual categories, but Agent B wins the overall total.

  ### 2. Why This Happens
  The discrepancy is caused by the **unequal sample sizes** (the number of manuscripts) in each category. The "Overall" rate is a weighted average, and the weights are heavily skewed.

  *   **Agent A** specializes in **Literary Fiction**. They represented 100 Literary manuscripts (a category that appears harder to sell, based on the lower percentages for both agents) and only 20 Commercial ones. Their overall average is dragged down because they handle a high volume of the "harder" books.
  *   **Agent B** specializes in **Commercial Fiction**. They represented 100 Commercial manuscripts (the "easier" category) and only 20 Literary ones. Their overall average is buoyed up because they handle a high volume of the "easier" books.

  Agent B's superior overall record is largely a result of their business mix, not necessarily superior skill in selling individual manuscripts.

  ### 3. Whose Record Should Guide Your Decision?
  You should ignore the overall totals and look strictly at the category relevant to you.

  Since you write **Literary Fiction**, Agent A is the statistically better choice for you.
  *   **Agent A** sells **45%** of their Literary manuscripts.
  *   **Agent B** sells **40%** of their Literary manuscripts.

  While Agent B has a flashier overall success rate, that is driven by their success in Commercial fiction. For your specific genre, Agent A has the stronger track record.
