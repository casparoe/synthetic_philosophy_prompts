      *   *Agent A Total:* 63/120 = 0.525
      *   *Agent B Total:* 93/120 = 0.775
      *   *Comparison:* 0.775 > 0.525 (Agent B wins)
      *   *Conclusion:* The math holds up. The friend is wrong.

  4.  **Explain *Why* This Happens (The Mechanism):**
