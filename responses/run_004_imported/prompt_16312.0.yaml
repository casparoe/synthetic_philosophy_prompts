answer: |-
  It is a genuine pleasure to correspond with someone who brings a working physicist's intuition to the metaphysics of causation. You have hit upon exactly the tension that keeps philosophers of science up at night. Your instinct is correct: the "crack" you suspect exists is real, but Dowe and Lewis are actually patching opposite sides of the wall.

  To answer your core question directly: **No, they are not papering over the same crack.** They are prioritizing two fundamentally different concepts that we unfortunately lump under the single word "causation." Dowe is defending *causal production* (the physical mechanism), while Lewis is defending *causal relevance* (the explanatory dependence).

  Here is how they cope with omissions, and why neither offers a completely satisfying "principled line" without costs.

  ### 1. Dowe's Conserved Quantity Theory: The Hard Line
  As you noted, Dowe's theory is music to a physicist's ears. A causal process is a world line of an object that possesses a conserved quantity (energy, momentum, charge); a causal interaction is an intersection of such world lines involving an exchange of those quantities.

  **The Problem with Omissions:**
  In your ficus example, there is no world line for "my not watering." There is no exchange of momentum or energy between my forgetting and the plant's wilting. In strict CQ terms, the omission is nothing. It is the absence of a process.

  **Dowe's Solution:**
  Dowe bites the bullet. He argues that omissions are **not genuine causation**. He distinguishes between:
  1.  **Genuine Causation:** Physical processes involving conserved quantities.
  2.  **Quasi-Causation:** Causal talk involving omissions, preventions, and double preventions.

  For Dowe, saying "I caused the ficus to die" is a useful pragmatic fiction, but metaphysically false. The *real* cause was the evaporation of water from the soil, the metabolic processes of the plant continuing without intake, etc. My omission is merely the *context* in which those physical processes played out.

  **Does he draw a principled line?**
  **Yes.** The line is ontological. If there is no transfer of a conserved quantity, it isn't causation.
  *   **The Cost:** This clashes violently with legal and moral intuition. In a court of law, negligence (an omission) is treated as a cause. Dowe has to tell a judge, "Strictly speaking, the defendant didn't cause the accident; he just failed to prevent the physical processes that did."

  ### 2. Lewis's Counterfactual Theory: The Floodgates
  Lewis defines causation via counterfactual dependence: $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.

  **The Problem with Omissions:**
  As you pointed out, this handles omissions effortlessly. Had I watered the ficus, it would not have died. Therefore, my not watering caused the death.
  However, this leads to the "abundance" problem. Had the Queen of England watered the ficus, it would not have died. Had you watered it, it would not have died. Therefore, the Queen, you, I, and the mailman are all causes of the ficus's death.

  **Lewis's Solution:**
  Lewis accepts this. He argues that causation is indeed abundant. There are thousands of causes for the ficus's death. The reason we single *me* out is not metaphysical, but **pragmatic**. We select causes based on salience, normality, and expectation.
  *   My not watering is *abnormal* (I was asked to do it).
  *   The Queen's not watering is *normal* (she has no duty to do it).

  **Does he draw a principled line?**
  **No, not metaphysically.** For Lewis, the line between "cause" and "background condition" is not in the world; it is in our conversational context.
  *   **The Cost:** This makes causation mind-dependent. If causation is a feature of the physical world (as a physicist would hope), it shouldn't depend on whether we think the Queen's behavior was "normal."

  ### 3. Are They Papering Over the Same Crack?
  This is the crux of your question. It looks like they are both struggling with omissions, but they are actually struggling with different problems.

  The philosopher Ned Hall (another physicist-turned-philosopher, interestingly) argued that we have **two concepts of causation**, and these two theories are each capturing one of them.

  1.  **Production (Dowe):** This is the "physics" concept. It's about the transmission of influence. It is local, intrinsic, and objective. It handles the "mechanism." It cannot handle omissions because omissions produce nothing.
  2.  **Dependence (Lewis):** This is the "explanatory" concept. It's about counterfactual relationships. It is global, extrinsic, and handles omissions perfectly. But it loses the physical "oomph."

  **The Verdict on the "Principled Line":**
  *   **Dowe** draws a principled line around *Production*. He saves the physics but loses the omissions.
  *   **Lewis** draws a pragmatic line around *Dependence*. He saves the omissions but loses the objective boundary.

  They aren't papering over the same crack; they are building bridges from opposite banks of a canyon. The "crack" is the fact that human language uses the word "cause" to refer to both *physical mechanisms* (the billiard ball hitting the eight-ball) and *explanatory dependencies* (the drought causing the famine).

  ### A Physicist's Perspective on the Solution
  Since you come from experimental physics, you might find the **Interventionist** account (James Woodward) interesting as a potential synthesis, though it has its own issues. Woodward defines causation in terms of invariance under intervention. $X$ causes $Y$ if an intervention on $X$ changes $Y$, holding other variables fixed.

  This handles omissions well (an intervention to water the plant changes the outcome) without requiring the Queen to be a cause (intervening on the Queen's behavior is not part of the relevant model of the ficus's ecosystem). It treats causation less as a metaphysical relation and more as a tool for explanation and control—closer to how scientists actually use causal graphs.

  ### Summary
  To answer your specific suspicion: **They are not papering over the same crack.**

  *   **Dowe** preserves the ontology of physics at the expense of ordinary language. He says omissions aren't causes.
  *   **Lewis** preserves the logic of ordinary language at the expense of a sparse ontology. He says omissions are causes, but so is everything else that mattered, and we just filter them by context.

  If you want a theory that respects the "transfer of quantity" intuition, Dowe is superior, but you must accept that moral/legal causation is a different category than physical causation. If you want a theory that respects the "but-for" reasoning used in history and law, Lewis is superior, but you must accept that causation is partially context-dependent.

  Most contemporary metaphysicians suspect the truth is pluralist: "Causation" is a ambiguous term covering both Dowe's processes and Lewis's dependencies. The friction you feel is the friction between those two distinct concepts rubbing against each other.
