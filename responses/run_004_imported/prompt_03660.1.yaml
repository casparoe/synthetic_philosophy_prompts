  8.  **Drafting the Content:** (Mental check of specific Leibniz texts). *Theodicy* deals with freedom and contingency. *Discourse on Metaphysics* deals with complete concepts. *Monadology* deals with windowlessness. Use these.

      *Specific point on Infinite Analysis:* UDT assumes the agent can compute the expected utility of policies. Leibniz would argue finite minds cannot do this perfectly (only God can). So UDT is an idealization that finite monads approximate.

      *Specific point on Logical Dependence:* UDT relies on "logical counterfactuals." Leibniz relies on "compossibility." They are similar but not identical. Compossibility is about consistency of existence. Logical counterfactuals are about consistency of propositions.

