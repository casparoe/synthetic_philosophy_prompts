          *   The "Infinite Analysis" point: UDT assumes computable utility. Leibniz would note that a finite mind cannot truly calculate the "best policy" like God can. We approximate.
      *   **Section 3: The Metaphysical Obstacle (Counterfactuals & Worlds):**
          *   This is the biggest friction point.
          *   Counterfactual Mugging relies on weighting unrealized branches.
