      *   **Section 4: Freedom and the "Complete Concept":**
          *   Does UDT destroy freedom?
          *   Leibniz: Freedom is spontaneity + intelligence + contingency.
          *   UDT agent acts spontaneously (from internal policy) and intelligently (calculation).
