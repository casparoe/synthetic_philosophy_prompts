      *   **Leibniz:** Monads are windowless. No causal interaction. God chooses the "Best of All Possible Worlds" (BAPW) from eternity. Each monad's complete concept contains all its predicates (past, present, future). Pre-established Harmony ensures synchronization without interaction. Contingent truths are true but not logically necessary (infinite analysis). Human freedom is preserved because actions follow from the agent's nature, not external coercion, even if determined by sufficient reason.
      *   **The Hook:** Both systems look "global" and "atemporal." UDT optimizes from the "view from nowhere" (the prior). Leibniz optimizes from the "divine intellect" (eternity).
      *   **The Tension:** UDT is a normative theory for finite agents *within* time. Leibniz is a descriptive/metaphysical theory about the structure of reality *sub specie aeternitatis*.

