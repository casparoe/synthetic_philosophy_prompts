answer: |-
  The file on Mrs. Gable was a mess of ink and uncertainty. Dr. Elias Thorne sat in his office at the Harrow Clinic, the hum of the 1981 air conditioner fighting the silence of the paper before him. Mrs. Gable, forty-two, housewife, referred for "nervous static." She claimed that before she spoke, she heard a noise. Not a voice, not a word, just a rush of white noise, like a radio tuning between stations, occurring inside her skull. Sometimes it was a hum, sometimes a crackle. Sometimes it happened before she poured tea, sometimes before she answered the phone.

  Thorne tapped his pen against the dossier. *Subjective auditory pre-stimulus.* It was clumsy. There was no pattern to the timing, no correlation to stress levels. Mrs. Gable couldn't say if the noise lasted a second or a minute. She only knew it signaled that her mouth was about to move. It was idiosyncratic, messy, deeply human in its lack of precision. Thorne wrote *Idiopathic Pre-Vocal Noise* in the ledger. He published a brief case note in the *Journal of Nervous Disease* that autumn, mostly to see if anyone else had seen this particular ghost.

  For a year, nothing. Then, the letters began to arrive.

  By 1983, the second patient sat in the chair opposite him. Mr. Henderson was a bank teller, precise, wearing a tie knotted with geometric exactness. He didn't describe static. He described a whisper.

  "It's a voice, Doctor," Henderson said, his hands flat on his knees. "Just before I speak. It says what I'm going to say."

  Thorne paused, his pen hovering over the notepad. "A whisper? Not static?"

  "Soft. Like someone standing behind me. But it's my voice."

  "And the timing?"

  "Two seconds. Maybe three."

  Thorne felt a flicker of recognition, sharp and cold. This was cleaner than Mrs. Gable's static. It fit the nascent category better, though it excluded her specific symptoms. He updated the diagnosis in his private files: *Pre-Echo Phenomenon.* He wrote a follow-up paper, expanding the criteria. He noted that the auditory hallucination was likely verbal, not noise-based. He didn't mention Mrs. Gable's static in the definition, classifying her retrospectively as an atypical presentation. It was necessary science; you couldn't build a model on outliers.

  The clinic grew busier. Referrals came from Chicago, from Boston. People who heard their futures.

  By 1985, the waiting room was full of them. Thorne watched them through the glass pane of his office door. They sat quietly, rarely speaking to one another. They didn't need to. They shared a taxonomy.

  The third wave arrived with clipboards.

  Ms. Lowell, a graduate student in linguistics, sat down and placed a logbook on his desk before he could ask her a single question. The pages were filled with columns: *Time, Trigger, Latency, Content.*

  "I experience Pre-Echo," she said. She didn't say "I hear voices." She used the name he had given the thing. "I've tracked the latency. It's consistently 2.4 seconds prior to vocalization. It occurs primarily in social adjacency situations. When I am expected to speak."

  Thorne opened the logbook. The handwriting was neat, the data rigorous. She hadn't just suffered the symptom; she had curated it. She knew what mattered. She knew that the static Mrs. Gable described was noise, irrelevant to the syndrome. She knew the whisper Mr. Henderson described was too vague. She offered him precision.

  "And when the echo occurs," Thorne asked, his voice sounding strangely loud in the small room, "does it match your intended speech exactly?"

  "Verbatim," Ms. Lowell said. "Sometimes the intonation differs. But the lexicon is identical."

  Thorne looked down at his own diagnostic criteria, printed on the clinic letterhead she had presumably read. *Symptom: Auditory pre-cognition of verbal output. Latency: Approximate. Content: Similar.*

  He picked up his pen. He needed to change *Approximate* to *Consistent*. He needed to change *Similar* to *Verbatim*. If he didn't, Ms. Lowell didn't fit. If she didn't fit, the syndrome fractured. But if he changed the criteria, then Mrs. Gable no longer fit. Mrs. Gable became a mistake. A false positive.

  "Did you read the 1983 paper?" Thorne asked.

  "I cited it in my thesis proposal," Ms. Lowell said. "Your distinction between Pre-Echo and standard auditory hallucination was crucial. The lack of external locus. The temporal binding."

  She was speaking his language back to him, but polished, refined. She was performing the diagnosis with more fidelity than he had originally drafted. She was a better case study than he could have written.

  Thorne dismissed her with a prescription for mild anxiolytics he knew she wouldn't need. She thanked him for validating the condition. She didn't thank him for healing her. She thanked him for naming her.

  After she left, Thorne sat alone. The air conditioner hummed, a steady white noise. He thought of Mrs. Gable, somewhere in the suburbs, still hearing her static, now excluded from the club she had inadvertently founded. He thought of Mr. Henderson, whose whisper was now too imprecise for the new standards.

  He opened the master file for *Pre-Echo Phenomenon*. The criteria section stared back at him. He could feel the weight of the pen in his hand. This was the mechanism of his career. He found a pattern, he named it, and the world rearranged itself to match the name.

  If he tightened the criteria, the syndrome became real. It became measurable. It became a thing that existed in the world, like a kidney or a virus. It would have a prevalence rate. It would have a treatment protocol. Insurance would code it.

  But if he tightened the criteria, he was erasing the history of its discovery. He was pruning the branches to make the trunk look straighter.

  He looked at the next appointment card. *Mr. Davies. Referral: Pre-Echo.*

  Thorne wondered what Mr. Davies would bring him. Would he bring a logbook? Would he bring a recording? Would he hear his voice five seconds prior, because a new paper suggested latency varied?

  Thorne dipped his pen in the ink. He crossed out *Approximate*. He wrote *Consistent (2-3 seconds)*. He crossed out *Similar*. He wrote *Verbatim*.

  He paused. The ink pooled slightly at the edge of the letter *V*.

  If he wrote this down, tomorrow's patients would hear verbatim echoes at 2.5 seconds. They would listen for it. They would filter out the static, the whispers, the mismatches. They would tune their internal radios to the frequency he had selected. They would become the kind of person who suffers from *Pre-Echo Phenomenon*, defined by the 1985 revision.

  And if he didn't write it? If he kept the definition loose? Then the category would remain a swamp, unusable, scientifically void. It would disappear. The patients would remain suffering, but without a shape for their pain. They would be messy again.

  He looked at the file for Mrs. Gable. It was buried at the bottom of the stack. He could pull it out. He could re-examine her. He could decide that her static was a different condition entirely. *Auditory Drift*, perhaps. Separate it. Save the purity of *Pre-Echo*.

  Or he could admit that *Pre-Echo* was a container that changed size depending on what was poured into it.

  Thorne heard the receptionist call the next name. *Mr. Davies.*

  He looked at the blank space in the new file where the symptoms would be recorded. He knew, with a certainty that unsettled him, exactly what Mr. Davies would report. He knew because he had just told the world what to report. He had sent the blueprint out into the waiting room.

  Thorne capped the pen. He did not put it down. He held it over the paper, waiting for the patient to enter, waiting to see if the man would walk in with static in his head or words. He waited to see if he was about to discover a disease, or if he was about to witness the completion of a construction he had started five years ago.

  The door handle turned. Thorne adjusted his glasses. He prepared his face to be the mirror that would show the patient who he was. He opened his mouth to speak, and for a fleeting second, he wondered if he would hear his own voice say the words before he said them, or if that privilege belonged only to the kinds of people he made.

  He said, "Please, sit down."

  The room was silent. There was no echo. Only the paper, waiting to be written.
