          *   Strategy: Bet 100% of bankroll every week ("All-In").
          *   Justification: Law of Large Numbers (LLN) guarantees convergence to EV over time.
          *   Observation: Two people went all-in and lost everything. Friend calls this "unlucky."
      *   **User's Intuition:** Something feels wrong, despite the EV math checking out.
