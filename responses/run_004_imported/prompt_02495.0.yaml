answer: |-
  Your intuition is spot-on. In fact, your skepticism demonstrates a better grasp of decision theory than your friend's, despite his correct arithmetic.

  Your friend has fallen into a classic trap that plagues introductory decision theory and finance: he is conflating **Expected Value (Ensemble Average)** with **Time-Average Growth**. He is also misapplying the Law of Large Numbers.

  Here is exactly where his reasoning breaks down, how to fix it, and how this connects to the material you are covering in your course.

  ### 1. The Arithmetic is Right, The Inference is Wrong
  Your friend's calculation for a single round is correct:
  $$E[\text{Return}] = (0.55 \times 1.8) + (0.45 \times 0.4) = 0.99 + 0.18 = 1.17$$
  If you bet \$100 once, walk away, and never play again, your expected value is indeed \$117. In a one-off scenario, maximizing Expected Value (EV) is often the standard rational prescription (assuming risk neutrality).

  However, this is a **repeated, multiplicative process**. You are reinvesting your current balance. This changes the mathematics entirely.

  ### 2. The Ergodicity Problem (Ensemble vs. Time)
  This is the core philosophical and mathematical error.
  *   **Ensemble Average (Friend's View):** Imagine 1,000 parallel versions of you play one round each. The average wealth of that group will grow by 17%.
  *   **Time Average (Your Reality):** You are one person playing 1,000 rounds in a row. Your wealth trajectory depends on the *product* of returns, not the *sum*.

  The Law of Large Numbers (LLN) guarantees that the *frequency* of wins and losses will converge to the probabilities (55% wins, 45% losses). It does **not** guarantee that your wealth will converge to the Expected Value.

  Let's look at what happens over two weeks if you bet 100% of your bankroll. There are four equally weighted paths (Win-Win, Win-Loss, Loss-Win, Loss-Loss), but notice the multiplicative effect:
  *   **Win then Loss:** $\$100 \times 1.8 \times 0.4 = \$72$
  *   **Loss then Win:** $\$100 \times 0.4 \times 1.8 = \$72$

  Even though the "expected value" per round is positive, a win followed by a loss (which is the typical experience over time) results in a **28% loss of capital**. Because multiplication is commutative, the order doesn't matter; the *geometric mean* determines your long-term fate.

  To find the long-term growth rate, we calculate the **Geometric Mean**:
  $$G = (1.8)^{0.55} \times (0.4)^{0.45}$$
  Using logarithms:
  $$\ln(G) = 0.55 \ln(1.8) + 0.45 \ln(0.4)$$
  $$\ln(G) \approx 0.55(0.588) + 0.45(-0.916)$$
  $$\ln(G) \approx 0.323 - 0.412 = -0.089$$
  $$G \approx e^{-0.089} \approx 0.915$$

  **The Result:** The geometric mean is **0.915**. This means that for every week you play "all-in," your wealth is expected to *shrink* by roughly 8.5% in the long run. If you play enough rounds, your wealth will converge to **zero** with probability 1.

  Your friend's claim that the two students who lost everything were "unlucky" is false. They experienced the inevitable mathematical consequence of the strategy.

  ### 3. Decision Theory Connection: Utility Functions
  In your course, you've likely discussed why rational agents maximize **Expected Utility** $E[U(W)]$ rather than **Expected Wealth** $E[W]$. This scenario is the canonical justification for that distinction.

  If you maximize $E[W]$ (linear utility), you are forced to bet 100% every time, leading to ruin.
  If you maximize **Expected Log Utility** $E[\ln(W)]$, you maximize the long-term geometric growth rate of your wealth. This is not just "risk aversion" as a psychological quirk; it is a requirement for survival in multiplicative environments.

  Using Log Utility, we can find the optimal fraction of your bankroll to bet ($f$) to maximize growth. This is known as the **Kelly Criterion**.

  We want to maximize:
  $$0.55 \ln(1 + 0.8f) + 0.45 \ln(1 - 0.6f)$$

  Taking the derivative with respect to $f$ and setting it to zero yields the optimal fraction:
  $$f^* \approx 35.4\%$$

  **The Rational Strategy:** You should not bet 100%. You should bet approximately **35%** of your current balance each week.
  *   At 35%, your expected logarithmic growth is positive.
  *   At 100%, your expected logarithmic growth is negative.

  ### 4. Why This Matters for Your Course
  This scenario highlights a major debate in modern decision theory regarding **Ergodicity**.
  *   **Standard Expected Utility Theory (EUT):** Often justifies risk aversion by positing a concave utility function (like log wealth) as an axiom of preference.
  *   **Ergodicity Economics (e.g., Ole Peters):** Argues that we don't need to assume a subjective utility function. Instead, we should recognize that time averages (what happens to one person over time) differ from ensemble averages (what happens to many people at once). In non-ergodic systems (like this betting game), maximizing Expected Value is objectively irrational because it does not maximize the time-average growth rate.

  ### Summary for Your Rebuttal
  1.  **Acknowledge the Math:** Admit his single-round EV calculation is correct ($1.17$).
  2.  **Point out the Process:** Explain that repeated betting is multiplicative, not additive.
  3.  **The Ruin Argument:** Show that a win followed by a loss ($1.8 \times 0.4$) results in a net loss ($0.72$). Therefore, volatility drains capital.
  4.  **The LLN Correction:** The Law of Large Numbers applies to the *frequency* of outcomes, but in multiplicative processes, the "average" outcome is the Geometric Mean, not the Arithmetic Mean. The Geometric Mean here is less than 1.
  5.  **The Solution:** The rational strategy for repeated play is not "All-In," but rather a fractional bet (specifically ~35% via the Kelly Criterion) which maximizes long-term growth.

  Your friend is treating a repeated survival game as a one-off lottery ticket. In decision theory terms, he is maximizing Arithmetic Expected Value in a context that requires maximizing Geometric Expected Utility. Your unease is the correct philosophical response.
