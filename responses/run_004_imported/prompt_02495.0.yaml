prompt: |-
  I'm a philosophy major taking a course on decision theory this term, where we've spent the last few weeks working through expected utility theory, Dutch book arguments, and the standard reasons why credences and preferences are supposed to satisfy the probability axioms. Something that happened on my floor this week doesn't sit right with me, and I can't tell whether it's actually in tension with anything we've covered or whether I'm just missing something obvious.

  A friend of mine who's really into trading set up an informal betting arrangement for anyone on our floor who wants in. Each week, you can stake any portion of your current balance, and he's been completely upfront about the odds: whatever amount you commit has a 55% chance of growing by 80% and a 45% chance of shrinking by 60%. You're free to let your balance ride into the next week if you want, and most people have been doing that. He's been urging everyone to commit their entire balance every single week, on the grounds that 0.55 times 1.80 plus 0.45 times 0.40 comes out to 1.17, meaning the wager nets a positive expected return of seventeen percent per round, so holding anything back is just leaving free money on the table. He's also pointed out that since most of us intend to keep playing every week for the rest of the semester, the law of large numbers guarantees that our results will converge toward that expected return, so it's practically a sure thing for anyone who sticks with it. Two people who followed his advice and went all-in for several weeks running have already lost their entire balance, but he maintains that this is just an unlucky run and doesn't undermine the underlying reasoning.

  I can't shake the sense that something is wrong here, but his expected-value arithmetic checks out, and I don't have a clean rebuttal to the law-of-large-numbers point either. Is my friend right that committing your whole balance every week is the rational strategy as long as each round has positive expected value, or is there a flaw in his reasoning? If there is, I'd like to understand exactly where it breaks down, and how one should actually think about how much of a balance to risk on a wager like this when you intend to keep playing it repeatedly.
