      *   **The Core Error (Ergodicity):** Explain the difference between averaging across many people (ensemble) vs. one person over time (time).
      *   **The Math of Ruin:** Show why "All-In" leads to zero wealth almost surely in the long run.
      *   **The Solution (Kelly Criterion):** Introduce the optimal betting fraction.
      *   **Decision Theory Connection:** Tie it back to their coursework (Utility Functions, Risk Aversion).
      *   **Conclusion:** Summarize the lesson.

  4.  **Fleshing out the Details (Mental Sandbox):**

