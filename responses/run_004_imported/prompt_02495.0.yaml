      *   *All-In Dynamics:* If you bet 100%, a loss reduces you to 40%. To get back to 1.0, you need a 150% gain. But the max gain is 80%. Actually, simpler: If you lose once, you have 0.4. If you win next, $0.4 \times 1.8 = 0.72$. You lost money overall.
      *   *Long Run:* In $N$ rounds, you expect $0.55N$ wins and $0.45N$ losses.
      *   *Wealth Formula:* $W_N = W_0 \times (1.8)^{0.55N} \times (0.4)^{0.45N}$.
      *   *Geometric Mean:* Calculate $(1.8^{0.55} \times 0.4^{0.45})$.
          *   $\ln(1.8) \approx 0.587$
          *   $\ln(0.4) \approx -0.916$
          *   $0.55(0.587) + 0.45(-0.916) = 0.322 - 0.412 = -0.09$.
          *   $e^{-0.09} < 1$.
      *   *Result:* The geometric mean is less than 1. Wealth trends to zero.
      *   *Kelly Criterion:* Formula $f^* = p - \frac{q}{b}$.
          *   $p = 0.55$, $q = 0.45$.
          *   $b$ is net odds received. Wait, standard Kelly notation: Win $b$ times stake.
