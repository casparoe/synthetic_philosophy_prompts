          *   Problem: Overdetermination and Preemption often involve structural equations where removing one cause leaves the effect unchanged due to the other cause.
          *   Patch: HP (Halpern-Pearl) Definition / Contingencies. We are allowed to hold certain variables fixed at *non-actual* values to test the dependency. (e.g., "If the Sergeant *hadn't* ordered, would the Major's order still cause the charge?")

