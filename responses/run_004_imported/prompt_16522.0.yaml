  4.  **Evaluate the "Patches":**
      *   **Lewis's Influence:** It moves from binary dependence to functional dependence. It feels somewhat natural (causes make a difference to *how* effects happen). However, in trumping cases, it relies on the idea that we *can* alter the trumped cause in a way that matters. In strict trumping (where the lower order is completely ignored), does altering S really change anything? Schaffer argues S has no influence. Lewis's framework needs to show M has influence and S doesn't. This works if the mechanism is sensitive to M's specific command but insensitive to S's.
      *   **Interventionist Contingencies (HP):** This is the crux. To identify M as a cause in trumping, we must evaluate the counterfactual "If M=0 and S=0, then C=0". But S was actually 1. We are testing dependency in a *counterfactual context*. Woodward calls these "modularity" or "invariance." HP calls them "contingencies."
      *   *Critique:* The Interventionist patch looks suspiciously like the Counterfactual patch. Interventionism claims to be about *actual* interventions. But to handle preemption, it relies on *counterfactual* interventions in *counterfactual* worlds (holding S fixed at 0 when it was 1). This blurs the line between the two theories.

