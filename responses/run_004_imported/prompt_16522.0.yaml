          *   *Interventionist:* Standard $do(M=0)$ leaves $C=1$ (because $S=1$). Need to set $S=0$ as a *contingency* to see $M$'s effect. Is setting $S=0$ legitimate?
      *   **Symmetric Overdetermination:** Shooter A and Shooter B. Both hit Victim V. V dies.
          *   *Lewis:* Simple counterfactual fails (if no A, B kills V). Influence? Maybe, if we consider timing/manner, but if truly symmetric and simultaneous, influence might fail to distinguish A from B as *the* cause (both are causes). Lewis accepts both are causes.
