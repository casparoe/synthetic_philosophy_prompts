answer: |-
  Here is the argument you need. It is a hard line, but it is the only one that keeps the metaphysics clean enough to serve your reporting.

  **The Verdict:** You should accept the "profligate" view. Causation is abundant, objective, and entirely devoid of normative force. The Queen's failure to water the plant is metaphysically identical to the gardener's failure. The reason we blame the gardener and ignore the Queen is not because the gardener *caused* the death in a way the Queen did not, but because our practices of explanation, law, and morality are selective filters applied *on top* of a chaotic web of causal dependencies. Metaphysics cannot tell you who is responsible for a regulatory failure; it can only tell you that the failure sits at the intersection of countless preventions that did not occur.

  ### The Case for Unrestricted Causation

  To understand why we must bite the bullet, we have to look at what we lose if we don't. The strongest argument for the unrestricted view (championed by David Lewis and refined by contrastivists like Jonathan Schaffer) is that it preserves the integrity of the counterfactual test, which is the only tool we have for objectively tracking dependence in the world.

  The logic is simple: Event $E$ (the plant dies) depends on Condition $C$ (water is absent). If $C$ had not obtained (if water had been present), $E$ would not have occurred. This is true for the gardener. It is equally true for the Queen. It is equally true for me, sitting in my office, failing to teleport water to the plant.

  If you argue that the Queen is *not* a cause, you are forced to introduce a metaphysical cut-off point that has no basis in the physical structure of the world. You are claiming that reality itself distinguishes between "relevant" absences and "irrelevant" absences. But the universe does not care about relevance. The universe only cares about dependence. If you prune the causal tree based on human expectations, you are no longer doing metaphysics; you are doing sociology.

  By accepting that the Queen is a cause, you keep causation as a natural relation, like gravity or mass. It is everywhere. It is boring. And that is its strength. It means that when you ask "What caused this?" you are asking a question with a stable, objective answer, independent of who is asking or what laws are in place.

  ### The Failure of the Normative View (Engaging McGrath)

  The most sophisticated rival to this view is the one you encountered in Sarah McGrath's work: the idea that causation by omission has a built-in normative component. On this view, the gardener causes the death because he *ought* to have watered the plant; the Queen does not, because she had no duty.

  This view is tempting, especially for a journalist covering negligence. It aligns perfectly with the courtroom. But it is a category error that collapses under scrutiny.

  **1. The Instability of Norms**
  If causation depends on duty, then causation becomes relative to the moral or legal framework of the observer. Imagine a scenario where a doctor fails to save a patient. In a jurisdiction with a "Good Samaritan" law, a bystander has no duty to act. In a jurisdiction with a "duty to rescue" law (like in France or Germany), the bystander *does* have a duty.
  If McGrath is right, the *causal structure of the event* changes depending on which side of the border the death occurs. The bystander's omission becomes a cause in Metz but not in Marseille. This is absurd. The physiological chain of events leading to the patient's death is identical in both cases. To make causation contingent on local statute is to surrender the idea that causation is a feature of the world.

  **2. The Conflation of Cause and Blame**
  The deeper error in the normative view is that it tries to solve the problem of *selection* by altering the definition of *causation*.
  Consider a malicious actor who sneaks into the garden and severs the irrigation line. We agree the saboteur caused the plant's death. But suppose the saboteur is a hermit with no social duties, no contracts, and no moral obligations to the gardener. He *ought* not to have cut the line, but his "duty" is negative (do not harm), whereas the gardener's duty is positive (do help).
  If we follow the normative account, we risk creating a metaphysics where positive acts and negative omissions are fundamentally different kinds of causes. But in your reporting on regulatory failure, this distinction blurs. A regulator approving a faulty valve (act) and a regulator failing to inspect the valve (omission) often lead to the exact same physical outcome. If we say the inspection failure is only a cause because of a duty, but the approval is a cause because of physics, we fracture the concept of causation into two incompatible types.

  The normative view tries to do too much work. It wants causation to explain *why* we blame someone. But causation should only explain *how* the event happened. Blame is a separate layer.

  ### The Pragmatic Solution: Causation vs. Explanation

  So, if the Queen is a cause, why do we never say she is? The answer lies in the distinction between **causation** (the metaphysical relation) and **causal explanation** (the pragmatic speech act).

  When we ask "What caused the plant to die?", we are rarely asking for a complete list of every counterfactual dependence in the universe. We are asking a context-sensitive question: "What was *abnormal* enough to warrant attention?" or "What can we *control* to prevent this in the future?"

  Jonathan Schaffer's contrastive account helps here. We don't just ask "Did $C$ cause $E$?" We ask "Did $C$ rather than $C^*$ cause $E$ rather than $E^*$?"
  *   In the **gardener context**, the contrast is: "Did the gardener's neglect (rather than his care) cause the death (rather than survival)?" Yes.
  *   In the **Queen context**, the contrast is: "Did the Queen's neglect (rather than her care)..." This contrast is pragmatically infelicitous because "Queen's care" is not a live option in our conversational context.

  This solves the profligacy problem without lying about the metaphysics. The Queen *is* a cause. But citing her is **conversationally irrelevant**. It violates the Gricean maxims of conversation. It provides no useful information for intervention.

  ### Application to Your Reporting

  This distinction is critical for your work on negligence and regulatory failure.

  If you adopt the normative view (McGrath), you are forced to conclude that the regulator's inaction is *more causal* than the engineer's design flaw, because the regulator had a specific duty. This leads to confused reporting where metaphysical weight is assigned based on job descriptions.

  If you adopt the unrestricted view (Lewis/Schaffer), you can report with clarity:
  1.  **The Metaphysical Fact:** The disaster was overdetermined. It was caused by the engineer's flaw, the regulator's inaction, the whistleblower's silence, and the Queen's failure to intervene. All are genuine causes. All satisfy the counterfactual test.
  2.  **The Explanatory Selection:** We single out the regulator not because their inaction was "more of a cause," but because their inaction was a **violation of a system designed to prevent it.**

  The regulator is the *explanatorily salient* cause. They are the "switch" we expect to be in the 'on' position. When a switch fails, we cite it. We do not cite the millions of other switches that also failed (the Queen, the public, the rain clouds) because they were never expected to be on.

  ### Final Conclusion

  Do not look to metaphysics to solve the problem of negligence. Metaphysics is a map of dependencies, and on that map, the entire world is connected. If you want to find the "real" cause of a regulatory failure, you will find that there is no singular real cause. There is only a web of preventions that failed.

  The question you are actually asking in your reporting is not "Who caused this?" It is "Who is the most appropriate target for intervention and blame?" That is not a metaphysical question. It is a moral, legal, and pragmatic one.

  **The Definite Verdict:**
  Causation is profligate. Every omission that makes a difference is a cause. The regulator's inaction is a cause in exactly the same sense as the Queen's. The burden of distinguishing them belongs entirely to the pragmatics of explanation and the norms of liability. To expect metaphysics to filter out the Queen is to ask physics to tell you who deserves prison. It cannot do it, and it should not try. Your reporting should reflect this: acknowledge the vast web of causal omissions, but be explicit that the decision to focus on the regulator is a choice about **accountability**, not a discovery about **causality**.
