answer: |-
  This is a profound question that cuts to the heart of **consequentialism under conditions of uncertainty**. Your friend is articulating a position that has serious philosophical pedigree, often associated with **epistemic humility** and a specific interpretation of **actual consequentialism**. However, your intuition that this argument "lets you off the hook" points to a significant flaw in that reasoning: it implicitly privileges the *status quo*.

  Here is a breakdown of the principled arguments on both sides, and why your friend's position might be philosophically weaker than it appears.

  ### 1. The Friend's Argument: The Traceability Principle
  Your friend is arguing for a constraint on moral action based on **knowledge**. Their logic rests on two pillars:

  *   **Actualism vs. Expectabilism:** In ethics, *Actual Consequentialism* judges an act by the good it *actually* produces. *Expected Consequentialism* judges it by the good one *reasonably expects* it to produce. Your friend is leaning toward Actualism: since you cannot guarantee the campaign's outcome, its moral value is currently zero (or negative), whereas the tutoring is actualized good.
  *   **The Precautionary Principle:** In complex systems (like city funding), interventions often have "non-linear" effects. Your friend argues that when the risk of unforeseen harm is unknowable, the moral default should be inaction to avoid becoming complicit in new harms.

  **Why it feels like "letting off the hook":**
  This reasoning suffers from **Status Quo Bias**. It treats the current state of affairs (underfunded schools) as a neutral baseline. It assumes that *doing nothing* is safe. But in your context, doing nothing means maintaining a system that is already harming thousands of students. By demanding traceable certainty for change but accepting untraceable certainty for the status quo, your friend is applying an asymmetrical standard of evidence.

  ### 2. The Counter-Argument: Expected Utility and Omission
  Your intuition aligns better with **Expected Utility Theory** and the moral significance of **omissions**.

  *   **Expected Value (EV):** Even if the probability of success is low or uncertain, if the magnitude of the benefit is massive (thousands of students), the *Expected Value* (Probability $\times$ Impact) of the campaign may still exceed the certain but small value of tutoring.
      *   *Example:* If tutoring creates 10 units of good with 100% certainty, and the campaign creates 10,000 units of good with only a 1% chance, the EV is equal. If the chance is higher, the campaign is mathematically preferable.
  *   **The Paralysis Problem:** If we adopt your friend's principle—that we should only act where effects are traceable—we morally disqualify almost all systemic reform. Climate change, public health policy, and civil rights legislation all involve unforeseeable downstream effects. If moral agents retreat to "traceable" acts, systemic injustice becomes permanent because it is too complex to fix safely.
  *   **Omission Bias:** Psychologically, we tend to view harms caused by action as worse than harms caused by inaction. Ethically, many argue this is a fallacy. If you know the current funding model hurts kids, and you have a chance to change it, failing to act is a choice with consequences. You are not "staying safe"; you are actively choosing the known harm of the status quo over the uncertain benefit of reform.

  ### 3. A Principled Middle Ground: The Epistemic Duty
  There is a third way to frame this, which might resolve your nagging feeling. The dilemma isn't necessarily between "Tutoring" and "Campaigning." It is between **"Acting on Ignorance"** and **"Reducing Ignorance."**

  Your friend says: "You don't know the odds, so stop."
  A more robust ethical stance says: "You don't know the odds, so **find out**."

  In ethics, we often have an **epistemic duty**. Before deciding that the campaign is too risky, do you have an obligation to investigate the risks more thoroughly?
  *   Can you consult policy experts?
  *   Can you look at case studies from other cities?
  *   Can you advocate for a pilot program rather than a full overhaul?

  If you abandon the campaign solely because the effects are currently opaque, you might be prioritizing your own **moral comfort** (knowing you did good) over **moral effectiveness** (doing the most good).

  ### 4. The "Portfolio" Approach
  Finally, consider that this might be a false dichotomy. In **Effective Altruism** circles, this is often resolved through a "portfolio" approach to moral action.
  *   **Tutoring** is high-certainty, low-scale. It hedges your moral risk.
  *   **Campaigning** is low-certainty, high-scale. It is your moral "venture capital."

  A virtuous agent might recognize that a world where everyone tutors is a world where systems never change, but a world where everyone campaigns is a world where immediate suffering is ignored. The question is not "Which one is the *right* thing?" but "What is the *optimal mix* for me, given my skills and resources?"

  ### Conclusion: Is your friend onto something?
  Your friend is right about **risk**, but wrong about **obligation**.
  *   **They are right** that complex systems are fragile and good intentions can cause harm. You should not enter the campaign blindly.
  *   **They are wrong** that uncertainty mandates retreat to the traceable. If we only acted where consequences were fully predictable, we would be morally paralyzed.

  **The Principled Reason to Favor the Campaign (with caveats):**
  There is a principle of **Moral Ambition** (or Scale Sensitivity). When faced with a choice between alleviating a symptom (tutoring) and curing the disease (funding reform), there is a *prima facie* duty to attempt the cure, provided the risk of catastrophic harm is not overwhelming.

  Your friend's argument feels like "letting yourself off the hook" because it substitutes **certainty** for **value**. It suggests that the *cleanliness of your moral ledger* (knowing exactly what good you did) is more important than the *total amount of good in the world*.

  **Recommendation for your seminar:**
  Frame this as a conflict between **Epistemic Constraint** (Friend) and **Expected Value Maximization** (You). Argue that while epistemic humility is a virtue, it becomes a vice when it is used to rationalize inaction in the face of known, systemic suffering. The uncertainty of the campaign doesn't make it morally inferior; it just makes it morally *costlier* in terms of the risk you must shoulder. Taking that risk might be the more demanding, and therefore more praiseworthy, ethical choice.
