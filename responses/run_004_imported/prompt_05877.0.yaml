answer: |-
  **MEMORANDUM**

  **TO:** Committee on Elections
  **FROM:** Committee Chair
  **DATE:** Saturday, February 24, 2024
  **SUBJECT:** Pre-Vote Analysis: Bill 104 (Municipal Voting Age Reduction)

  **1. Purpose**
  This memo serves to frame the Committee's debate on Bill 104, which proposes lowering the voting age to 16 for municipal elections only. This legislation mirrors ordinances passed in Takoma Park and Hyattsville, Maryland, as well as several municipalities nationwide.

  As we approach the vote, much of the preliminary discussion has centered on the "maturity" of sixteen-year-olds. While relevant, this line of questioning overlooks a fundamental issue in political theory known as the **boundary problem**. This memo outlines the theoretical stakes, weighs the proposal against the status quo, analyzes the proposed Demeny Voting amendment, and offers a Chair's recommendation.

  **2. The Boundary Problem: Who Belongs in the *Demos*?**
  To vote on *who* should vote, we must first agree on *why* we vote. Political theorists generally offer two standard tests for inclusion in a political community (*demos*):

  *   **The All-Affected-Interests Principle:** Anyone whose interests are significantly affected by political decisions should have a say in them.
  *   **The Subjection to Coercion Principle:** Anyone subject to the binding, coercive laws of the state should have a role in authorizing them.

  **The Challenge:** If we apply these tests strictly, they do not distinguish cleanly between sixteen-year-olds and twelve-year-olds. A twelve-year-old is equally subject to curfew laws, zoning decisions, and school board policies as a sixteen-year-old. If "affected interests" are the only metric, an age cutoff of 16 is theoretically arbitrary.

  Therefore, an age limit cannot rest solely on *interest* or *coercion*. It requires a third principle: **Capacity for Autonomous Judgment.** The debate, then, is not just about whether teens care, but where we draw the administrative line for individual political agency.

  **3. The Case for the Status Quo (Voting Age 18)**
  Delegates arguing against this bill often rely on tradition. However, the strongest philosophical defense of the age-18 threshold is not tradition, but **Legal Consistency and Autonomy.**

  *   **The Bright Line of Adulthood:** Eighteen is the threshold for full legal liability. At 18, citizens can sign contracts, serve on juries, enlist in the military without parental consent, and be tried as adults. To grant the franchise before this threshold creates a dissonance: one can authorize the state's coercive power (vote) before one is fully responsible for one's own legal personhood.
  *   **Protection from Coercion:** A primary argument for age limits is protecting minors from undue influence. Sixteen-year-olds are more financially and residentially dependent on parents than eighteen-year-olds. There is a valid concern that lowering the age does not enfranchise *youth*, but rather enfranchises *parents* (by doubling their household influence), potentially compromising the secret ballot within the home.
  *   **Cognitive Consistency:** While sixteen-year-olds possess logical reasoning capabilities comparable to adults, the brain's prefrontal cortex (regulating impulse control and long-term planning) continues developing into the mid-20s. Maintaining the age at 18 aligns voting with the legal recognition of full cognitive and legal responsibility.

  **4. The Case for Bill 104 (Voting Age 16, Municipal Only)**
  Proponents argue that the "Legal Adulthood" bright line is too blunt an instrument for *municipal* governance.

  *   **Proportionality of Stake:** Municipal elections govern schools, parks, libraries, and zoning. These issues impact sixteen-year-olds more directly than many state or federal issues (such as foreign policy or Social Security). Under the *All-Affected-Interests* principle, the intensity of the impact at the local level justifies earlier inclusion.
  *   **Civic Habit Formation:** Behavioral science suggests voting is a habit. At 16, most citizens are in stable living situations (high school). At 18, life instability (moving for college or work) often disrupts voter registration. Lowering the age captures citizens while they are civically anchored.
  *   **Partial Autonomy:** Sixteen-year-olds already possess limited legal autonomy (driving, employment, taxation on income). If the state recognizes their capacity to operate vehicles and contribute to the tax base, excluding them from the budgetary decisions of their town is a form of "taxation without representation."

  **5. Analysis of the Demeny Voting Amendment**
  Some delegates have proposed an amendment to implement **Demeny Voting**. This system would grant parents a proxy vote for each minor child, effectively weighting family units by size rather than enfranchising the minor directly.

  *   **Theoretical Strength:** Demeny Voting solves the *Boundary Problem* elegantly. It ensures the interests of the 12-year-old are represented without requiring the 12-year-old to possess adult-level cognitive capacity. It acknowledges that children are stakeholders without forcing them to be agents.
  *   **Practical & Ethical Weakness:**
      1.  **Agency:** Youth and Government is founded on the principle of youth voice. Demeny voting treats minors as *interests to be weighed* rather than *agents to be heard*. It reinforces the idea that children are property of the household rather than individuals.
      2.  **Administration:** Implementing proxy voting for municipal elections creates significant administrative burden regarding custody disputes, guardianship, and ballot secrecy.
      3.  **Dilution:** It fails to achieve the bill's primary goal: civic engagement. A proxy vote does not teach the minor how to engage with democracy; it teaches them that their voice is mediated by their parents.

  **6. Chair's Recommendation**
  The Committee must decide between a theoretically pure boundary (18 for full legal autonomy) and a pragmatic expansion of democracy (16 for local stakeholding).

  While the defense of 18 as the "Threshold of Full Legal Autonomy" is robust, Bill 104 is narrowly tailored to **municipal** elections. This distinction is crucial. It acknowledges that while 16-year-olds may not be ready to select a Governor or President, they are competent to select a School Board or City Council that governs their daily reality. This creates a tiered citizenship that matches rights to specific spheres of impact.

  Furthermore, while Demeny Voting addresses the representation of younger children, it fundamentally contradicts the mission of this program by denying individual agency. If we believe minors are subject to coercion, the remedy is to give *them* the shield of the ballot, not to hand that shield to their parents.

  **Recommendation:**
  The Chair recommends that the Committee on Elections report **Bill 104 FAVORABLY**.

  Delegates are encouraged to vote on the principle that for *local* governance, the "affected interests" principle should outweigh the "full legal autonomy" principle, and that direct enfranchisement is superior to proxy representation.

  **Action Required:**
  Please review this analysis prior to Saturday's session. Amendments must be submitted by 8:00 AM.
