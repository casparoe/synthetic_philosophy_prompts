prompt: |-
  I've been in a reading group this term working through Dummett-style semantic anti-realism, and the last two sessions were on Fitch's paradox of knowability (apparently some people call it the Church-Fitch paradox now, since Joe Salerno dug up an old referee report from the 1940s with basically the same proof in it, and the referee was probably Alonzo Church -- wild bit of trivia if true). Anyway, you know the basic setup: assume every truth is knowable by someone at some time (KP), assume there's at least one truth nobody actually knows (non-omniscience), plug p = "q & nobody knows that q" into KP for any currently unknown truth q, and you can derive that q must already be known -- so unrestricted KP plus non-omniscience collapses into full omniscience, which is obviously terrible news if you're a verificationist who wants truth to just BE knowability.

  Everyone in my cohort treats Neil Tennant's fix as basically closing the case: restrict KP to "Cartesian" propositions, i.e. ones that could jointly be true and known, so the poisonous "q & nobody knows q" instances get carved out of the principle's scope by stipulation, and Dummett's anti-realism supposedly comes out unscathed. This has been bugging me for weeks, because it feels like once your core semantic thesis gets to gerrymander its own domain every time it produces an embarrassing instance, you've basically conceded the fight -- what's left of the manifestation and acquisition arguments that were supposed to independently motivate identifying truth with knowability, if those arguments dont also tell you, from outside the paradox, which propositions are allowed to count as "Cartesian"? I've got to present on this to my reading group next week and I really don't wanna just recite the standard "restriction strategies save the day" line everyone already believes. Can you build me the strongest possible case that the Cartesian restriction (or any restriction strategy relevantly like it) is ad hoc in exactly this way, and that a real Dummettian anti-realist can't adopt it without quietly giving up the very considerations that made anti-realism look attractive in the first place? Premise by premise please, not just a vibes-based summary -- I can find the neutral SEP-style overview on my own.
