answer: |-
  **Setting:** *A university seminar room, late afternoon. The chalkboard is still covered in diagrams of the circuit of capital. Two graduate students, ELENA and MARCUS, are packing their bags after a heated class discussion.*

  **ELENA:** You looked frustrated when the professor wrapped up, Marcus. I thought the Woodian reading was fairly decisive regarding the *Gotha* passage.

  **MARCUS:** Decisive? It was evasive. Allen Wood argues that for Marx, justice is purely immanent to the mode of production. Therefore, since the capitalist pays the full value of labour-power, the exchange is just. But then how do you explain the rhetoric? Marx doesn't just say exploitation is inefficient; he calls it "robbery," "theft," and "embezzlement." If I steal your wallet, I haven't just alienated you; I've treated you unjustly.

  **ELENA:** But you're importing a trans-historical definition of theft. Look at *Capital*, Volume 1. Marx explicitly states that the sphere of circulation is "a very Eden of the innate rights of man." There, freedom, equality, and property reign. The worker sells a commodity—labour-power—and receives its equivalent value. If justice is, as Marx says in *The German Ideology*, a form of consciousness derived from material conditions, then within the capitalist mode of production, that exchange *is* just. To call it unjust is to judge capitalism by feudal standards, or by some abstract moral skyhook.

  **MARCUS:** That's the Woodian trap. It renders Marx's critique merely descriptive. If capitalism is just by its own standards, then the communist revolution isn't a demand for justice; it's just a change of management. But consider *Capital* again. When Marx discusses surplus value, he says the capitalist appropriates unpaid labour. He writes, "Capital... is dead labour which, vampire-like, lives only by sucking living labour." You can't sustain that kind of moral outrage on the grounds of "immanent functionality." Husami is right: Marx is judging capitalism by the standards of the *future* mode of production.

  **ELENA:** But that violates historical materialism! You can't judge a historical epoch by the standards of one that doesn't exist yet. Marx mocks the Lassalleans in the *Critique of the Gotha Programme* precisely for this. He writes, "Right can never be higher than the economic structure of society and its cultural development conditioned thereby." If he says right is bounded by the economic structure, he cannot simultaneously be appealing to a socialist "right" to condemn capitalism. He's telling us to stop talking about justice altogether.

  **MARCUS:** He's telling us to stop talking about *bourgeois* right. There's a difference. In the *Gotha* critique, Marx distinguishes between the lower and higher phases of communist society. In the higher phase, we move "beyond the narrow horizon of bourgeois right." But the fact that he envisions a society where the principle "from each according to his ability, to each according to his needs" prevails implies a normative standard. If capitalism violates human needs to satisfy profit, it is unjust relative to the human potentiality that socialism realizes. Husami argues that the proletariat's standpoint *is* the standpoint of the future. We aren't judging from outside history; we are judging from the emerging mode within the old one.

  **ELENA:** That's a clever move, but it conflates "good" with "just." Marx certainly thinks capitalism is bad. It stunts human flourishing; it creates alienation. But alienation is an anthropological or psychological category, not a juridical one. When Marx says the capitalist robs the worker, he is describing the *mechanism* of surplus value extraction, not filing a legal brief. The "theft" is that the worker produces value they do not control. But since the worker voluntarily sold their labour-power, they have no claim to the product. To say they *should* have a claim is to invoke a property right that capitalism has already abolished.

  **MARCUS:** So the "theft" is metaphorical?

  **ELENA:** It's structural. It describes a transfer of value without equivalent return *from the perspective of the producer*, but Marx knows that under capitalism, the only equivalent is the wage.

  **MARCUS:** But if it's merely structural, why does Marx bother with the moralized language at all? Why not stick to "extraction"? Because he knows that "justice" has a mobilizing power. But more importantly, look at the *Grundrisse*. Marx argues that as capitalism develops, it creates the conditions for its own negation. The "wealth of society" becomes socialized, yet appropriation remains private. This contradiction isn't just a glitch; it's a violation of the social nature of production. When he calls it appropriation of "unpaid labour," he is appealing to a norm of reciprocity that transcends the wage contract. The worker contributes more than they get back. That is the definition of injustice, regardless of what the wage contract says.

  **ELENA:** Reciprocity is a bourgeois norm, Marcus. "Quid pro quo." Marx's point in *Gotha* is that even "equal right" is a defect. In a communist society, we don't get back what we put in; we get what we need. If you base your critique on the fact that the worker isn't paid for all the labour they perform, you're actually reinforcing the bourgeois principle that labour should be the measure of reward. You're demanding a "fair day's wage for a fair day's work," which Marx explicitly rejects as conservative sloganeering.

  **MARCUS:** I'm not demanding a fair wage. I'm saying the relation itself is coercive. Wood says the exchange is free because the worker isn't forced to sell to *this* capitalist. But they are forced to sell to *a* capitalist.

  **ELENA:** That's a critique of freedom, not justice. And I agree with it! Wood agrees with it. The Woodian reading doesn't say capitalism is *good*. It says "justice" is the wrong category. When you frame it as injustice, you invite reforms—better wages, fairer distribution. When you frame it as alienation and unfreedom, you demand abolition. By insisting Marx thinks capitalism is unjust, you risk turning him into a distributive justice liberal, like Rawls before the fact.

  **MARCUS:** That's a risk, but the greater risk is disarming the critique. If capitalism is just by its own standards, then the capitalist can say, "Exactly! I follow the rules. I pay the market rate. Your revolution is just envy." If Marx's critique is only that capitalism is alienating, that's a complaint about how it *feels* to be a worker. But if it's unjust, it's a claim about what the worker is *owed*.

  **ELENA:** But owed on what basis? Nature? God?

  **MARCUS:** On the basis of social cooperation. Husami points out that Marx views justice as a function of the mode of production, yes, but that doesn't mean we can't evaluate modes of production against each other. We judge feudalism by capitalist standards of efficiency and liberty. Why can't we judge capitalism by socialist standards of human development and need? When Marx says surplus value is "embezzlement," he is using the juridical language of the bourgeoisie to show that they fail even by their own deeper ideals of property. If property is founded on one's own labour, as Locke and the classical economists claimed, then the capitalist who lives off surplus value is a parasite.

  **ELENA:** Ah, but there's the rub. Marx knows the classical labour theory of property is incoherent under capitalism. He doesn't want to rescue Locke; he wants to bury him. In *Capital*, he notes that the separation of labour from property is the necessary precondition of capitalist production. The "theft" happened historically—primitive accumulation, the enclosures, "written in the annals of mankind in letters of blood and iron." But once that system is established, the ongoing exploitation is legally valid. Marx's condemnation of primitive accumulation is historical and moral, yes. But his analysis of the *daily* operation of capital is scientific. He wants to show that even with "fair" exchange, exploitation occurs. If you rely on the "theft" argument for the daily operation, you undermine the scientific discovery of surplus value. You make it look like a moral fraud rather than a systemic necessity.

  **MARCUS:** But systemic necessities can be unjust. Slavery was a systemic necessity for the Roman economy. Does that mean we can't call it unjust without violating historical materialism?

  **ELENA:** We can call it unjust *now*, from our standpoint. But could a Roman communist call it unjust *then*, without invoking anachronistic standards? Marx warns against "moralizing." He wants the critique to come from the contradictions of the system itself, not from an external moral tribunal. The system condemns itself by creating its own gravediggers, not by violating a abstract rule of justice.

  **MARCUS:** But the "gravediggers" dig because they feel the injustice. You can't separate the subjective experience of exploitation from the objective category. When Marx writes about the factory legislation and the struggle over the working day, he frames it as a contest of rights. "Between equal rights, force decides." He acknowledges that the worker has a right to limit their labour, just as the capitalist has a right to extend it. This implies a normative conflict, not just a mechanical one.

  **ELENA:** It implies a conflict of interests grounded in the mode of production, not a conflict of abstract justice. The worker's "right" is the biological limit of their body. The capitalist's "right" is the logic of valorization. It's a collision of forces.

  **MARCUS:** You're stripping the normativity out of "force." But let's meet in the middle. Suppose we grant Wood that "justice" is a juridical concept internal to a mode of production. Doesn't the transition from one mode to another involve a moment where the old justice is revealed as injustice by the new? The bourgeoisie called feudal privileges unjust. The proletariat calls capitalist property unjust.

  **ELENA:** They call it *obsolete*. "Unjust" implies it violates a standing norm. "Obsolete" implies the norm itself has changed. If I say capitalism is unjust, I imply there is a valid court of appeal. Marx says there is no court of appeal above history.

  **MARCUS:** Then history itself is the court. And history, for Marx, has a direction—toward human emancipation. If capitalism blocks that emancipation, it stands condemned. Whether we label that condemnation "injustice" or "alienation" might be semantic, but the political stakes are real. If we tell workers, "Marx says you aren't treated unjustly, just alienated," we lose the moral fire that fuels revolution.

  **ELENA:** And if we tell them, "Marx says this is unjust," we invite them to demand a fairer capitalism, rather than the abolition of the wage system. Wood saves Marx from becoming a moralist so he can remain a revolutionary.

  **MARCUS:** And Husami saves Marx from becoming a functionalist so he can remain a critic.

  **ELENA:** (Pauses, picking up her bag) Perhaps. But I still maintain that when Marx dismisses "fair distribution" as verbal rubbish, he's warning us exactly against your move.

  **MARCUS:** (Smiling) And I maintain that when he calls surplus value "unpaid labour," he's warning us exactly against yours.

  **ELENA:** Then I suppose we'll have to settle this in the next seminar.

  **MARCUS:** I'll bring the *Grundrisse*. You bring *Capital*.

  **ELENA:** Deal.
