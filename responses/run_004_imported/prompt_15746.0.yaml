  so i've been down a rabbit hole for like two weeks on this jain concept anekantavada (the "many-sidedness" idea, always taught with the blind men and the elephant story) after a workmate who's jain brought it up at lunch. i tried writing up my own notes on the part of it that actually confuses me, past the beginner level, and i want to know if my reasoning actually holds up or if im just going in circles.

  my notes so far:
  - the elephant story part is easy, different people grab different bits of the elephant and each is "right" from where they're standing. not controversial.
  - the real logic version is syadvad, where every claim about a thing has to be said "in a sense" (syat), which jain logicians built out into 7 options (saptabhangi): it is / it is not / it is and is not (one after the other) / its inexpressible / its is-and-inexpressible / its not-and-inexpressible / its is-and-not-and-inexpressible.
  - options 1-3 are fine, thats just relativizing to angle, time or aspect, like "the pot exists as clay but not as cloth."
  - option 4, avaktavya ("inexpressible"), is where i get stuck. if theres a whole named slot for it, and it combines cleanly into three more named slots, in what sense is it actually inexpressible? feels like a dodge, like what they really want to say is "it both is and is not, fully, at the same time" and they slap "inexpressible" on that combo so it doesn't look like theyre straight up breaking the law of non-contradiction.
  - somewhere i saw a comment that some modern logicians compare this whole schema to paraconsistent logic (logics that tolerate real contradictions), which makes me wonder if thats basically the honest description and "inexpressible" is just flavor text over an actual contradiction.

  i already read the wikipedia-tier explanation of anekantavada so please dont just hand me that back, i specifically want to know if my complaint about the avaktavya move (bullet 4) is a real problem people raise about jain logic, and whether it has an actual answer or if ive found a genuine crack in it.
