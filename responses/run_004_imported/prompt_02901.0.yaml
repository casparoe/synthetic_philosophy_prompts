prompt: |-
  so i've been nerding out on futarchy (the "vote on values, bet on beliefs" governance idea) since a couple of DAOs have actually tried versions of it, and the basic pitch makes sense to me at a high level. but i keep getting stuck on one thing: say you run a conditional market on "treasury value given we fire the lead dev" vs "given we dont", and the market prices imply the treasury does better in the "fire them" world. doesn't that just mean firing them is correlated with good outcomes, not that it actually causes the good outcome? like maybe the lead dev only even gets floated for firing in timelines where the project was already headed somewhere great for unrelated reasons. is that a real, known flaw in how these decision markets are supposed to work, and if so is there some clever fix for it, or does the whole scheme just quietly assume the causal arrows point the way you want them to?
