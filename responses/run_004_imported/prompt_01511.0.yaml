answer: |-
  You and your second friend are correct. Your first friend is falling for one of the most famous traps in probability theory.

  While his statement that the bet has a "positive expected value" is technically true, his conclusion that you should bet 100% of your bankroll is mathematically suicidal in a repeated game.

  Here is the breakdown of why your intuition is right, why your friend's math is misleading, and why your second friend is accidentally playing perfectly.

  ### 1. The Trap: Arithmetic vs. Geometric Growth
  Your first friend is optimizing for **Arithmetic Expected Value (EV)**.
  If you bet \$100 one time:
  *   55% chance you have \$200.
  *   45% chance you have \$0.
  *   Average outcome: \$110.

  This looks great. However, in a **repeated** game, you aren't playing against an average of parallel universes; you are playing through time. This is a concept called **Ergodicity**.

  When you bet 100% of your bankroll repeatedly, you are subject to **Geometric Growth**. The moment you lose a single flip, your bankroll goes to zero. You cannot bet again.
  *   Probability of surviving 1 round: 55%
  *   Probability of surviving 10 rounds: $0.55^{10} \approx 0.25\%$
  *   Probability of surviving 100 rounds: Effectively zero.

  No matter how high the positive edge is, if you bet 100% of your bankroll, the **Risk of Ruin is 100%** over an infinite timeline. Your friend is maximizing the *theoretical* average of a million parallel versions of you, but guaranteeing that the *actual* version of you (living through time) goes broke.

  ### 2. The Solution: The Kelly Criterion
  There is a specific mathematical formula designed exactly for this scenario. It is called the **Kelly Criterion**. It tells you the exact fraction of your bankroll to bet to maximize your long-term wealth growth rate without going bust.

  The formula is:
  $$f^* = \frac{bp - q}{b}$$

  Where:
  *   $f^*$ = Fraction of bankroll to bet
  *   $b$ = Net odds received (profit per unit bet). Since you "double your stake," you profit 1 unit for every 1 unit bet. So, **$b = 1$**.
  *   $p$ = Probability of winning (**0.55**)
  *   $q$ = Probability of losing (**0.45**)

  Plugging in your numbers:
  $$f^* = \frac{1(0.55) - 0.45}{1}$$
  $$f^* = 0.55 - 0.45$$
  $$f^* = 0.10$$

  **The mathematically optimal bet size is exactly 10% of your bankroll.**

  ### 3. Who is Right?
  *   **Friend A (100% Bet):** He is wrong. He is confusing "Expected Value" with "Expected Growth." By betting 100%, he is "overbetting the Kelly." In finance and gambling theory, betting more than the Kelly fraction increases risk but *decreases* long-term growth. Betting double the Kelly (20% in this case) reduces growth to zero; betting 100% guarantees ruin.
  *   **Friend B (10% Bet):** She is accidentally playing perfectly. She is betting the **Full Kelly**. This maximizes the compound growth rate of her bankroll while ensuring she never goes to zero (theoretically). This explains why she is "slowly and steadily up."
  *   **You:** You were right to be suspicious. Your empirical evidence (going bust twice) aligns with the mathematical certainty of ruin at 100% sizing.

  ### The Takeaway
  Your first friend's reasoning is the same logic used by people who martingale (double down after losses) or buy out-of-the-money lottery tickets. It looks good on a spreadsheet average, but it ignores the **sequence of returns risk**.

  In repeated betting or investing:
  1.  **Positive EV is not enough.** You must manage position size.
  2.  **Survival is priority #1.** You cannot compound if you hit zero.
  3.  **Friend B is the pro.** She is maximizing her geometric growth rate. Friend A is gambling; Friend B is investing.

  **Verdict:** Listen to Friend B. Bet 10% (or even less, like 5%, to reduce volatility), and never go all-in.
