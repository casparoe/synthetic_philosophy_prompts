prompt: |-
  I'm prepping a seminar on conditionals for thursday and I keep running into the same wall trying to motivate Lewis's triviality results for the students without just marching them through the algebra line by line. I can reproduce the proof fine -- you assume the Thesis (that P(A > B) equals P(B|A)) holds not just for whatever credence function P we happen to have, but for every P we'd land on by conditionalizing on some further proposition, and a couple of substitutions later you've shown A and B come out probabilistically independent no matter what they actually are, which is obviously absurd. What I don't have is a gut-level feel for *why* that closure-under-conditionalization premise is the thing that detonates everything. Is it basically that we're asking a single number, P(A > B), to simultaneously encode infinitely many different conditional probabilities as the evidence varies, and theres no way to do that unless the conditional secretly stops tracking any real relationship between A and B? Or is the actual culprit somewhere else in the derivation and I'm misdiagnosing it?

  The other thing I never manage to explain well is why this gets treated as a problem specifically for Stalnaker's semantics rather than for conditional-probability talk in general. Adams supposedly walks away unscathed because on his view 'if A, B' was never truth-apt to begin with, so there's no proposition sitting there for P to be assigning a probability to independently of just stipulating that it equals P(B|A). But 'there's no proposition' feels like it's dodging the question rather than answering it. What is it about treating the conditional as expressing a genuine proposition, with a determinate truth value at each world, that makes the triviality argument bite -- such that denying propositional content actually gets you out of the problem rather than just hiding the same tension somewhere else? If you could walk through both pieces at the intuitive level, keeping the formal machinery in the background rather than the foreground, it'd genuinely help me figure out how to pitch this in class.
