      *   *The Solution:* Not a treaty, not a ban, not a silver bullet. It's a *process*. A "long sequence of small, correct, day-to-day decisions."
      *   *The Vibe:* Stewardship, vigilance, humility, endurance.

  3.  **Determine the Structure of the Eulogy:**
      *   **Opening:** Acknowledge the loss, the unexpected nature, and the setting (mixed audience). Introduce the central image (the essay above the desk).
      *   **Middle 1 (The Career/Context):** Bridge the gap between nuclear physics and AI. Explain *why* she moved between them (the underlying pattern of risk). Make von Neumann accessible to the family.
