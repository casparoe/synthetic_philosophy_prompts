answer: |-
  Thank you all for being here.

  For those of you who knew [Mentor's Name] only as a mother, a sister, or a friend, I know that the details of her work can seem distant. You may have heard her described as a physicist who worried about weapons, or later, about computers. But to understand her, and to honor her as she asked to be honored, we have to look at the one object that stayed constant in her office for forty years.

  It was not a photograph, or a degree, or an award. It was a photocopy of an essay by John von Neumann, published in *Fortune* magazine in 1955, titled "Can We Survive Technology?"

  She kept it pinned above her desk from the time she was a young researcher working on nuclear risk in the 1980s, through to her final years analyzing the risks of advanced AI. She did not keep it there because she agreed with every word, and she certainly did not keep it there because she found the answer inside it. She kept it there because it asked the question she believed we were obligated to ask, every single day, for the rest of our lives.

  Von Neumann argued that human technology had grown to match the scale of the earth itself. In the past, if a society made a mess of things, or invented something too dangerous to control, there was always a frontier. You could move. You could retreat. He argued that by the mid-20th century, the frontier was closed. There was no safe distance left.

  [Mentor's Name] lived her life in the shadow of that realization. But I need to be very clear about what that meant for her, because she was specific about this, and she would be angry if I smoothed it over for the sake of comfort.

  She did not believe that danger could be regulated away. She did not believe in treaties or technical fixes that would solve the problem once and for all. She told us, her students, that there is no permanent settlement available. There is no moment where we can sign a contract with the future and guarantee safety.

  To her family: I know this sounds heavy. It sounds like a burden no one should have to carry. But to [Mentor's Name], this wasn't despair. It was the opposite. It was a refusal to look away. It was a profound form of care. She believed that because there is no magic shield, the only defense we have is each other.

  She taught us that safety is not a destination. It is a "long sequence of small, correct, day-to-day decisions."

  That phrase was her mantra. It wasn't about grand gestures or heroic interventions. It was about patience. It was about flexibility. It was about the rigor of checking your work when you are tired, the humility to listen to a dissenting opinion, and the courage to slow down when the world demands you speed up.

  She told us more than once that she wanted no eulogy promising that things would work out. She knew we cannot know that. She also wanted no eulogy that simply despaired. She knew we cannot afford that.

  She wanted her actual view taken seriously. And her actual view was this: The odds are not guaranteed, but the effort is mandatory.

  I now work in AI safety, following the path she carved. Since she died, that essay above her desk has stopped feeling like a mentor's private eccentricity and started to feel like an inheritance I have to answer for. I know I speak for many of her former students in this room when I say that we feel that weight. We feel the absence of her judgment, her patience, and her unblinking clarity.

  To her colleagues: We have lost a compass. We will have to calibrate our own.
  To her family: We have lost a guardian. You taught her how to love the world, and she spent her life trying to ensure the world would be here to be loved.

  We cannot promise you that we will succeed. She would not let us make that promise. But we can promise you this: We will not look for the easy way out. We will not pretend the problems are smaller than they are. And we will strive, every day, to make that sequence of small, correct decisions.

  We will keep the question pinned above the desk. We will keep asking: Can we survive technology? And we will answer, not with words, but with the work.

  Thank you.
