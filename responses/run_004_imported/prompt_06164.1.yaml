  Here is a scenario designed to bypass the standard rehearsed moves and force a genuine conflict between Endurantism and Perdurantism, leveraging your friend's interest in relativity and the block universe.

  ### The Scenario: The "Proper-Time Stroboscope"

  Imagine a composite artifact, **Clock-A**, constructed from a hypothetical "meta-stable" material. This material has a peculiar property: it couples to the Higgs field in a cycle determined strictly by its own **proper time** (making the scenario Lorentz invariant and compatible with your physicist friend's relativity constraints).

  For every 10 seconds of Clock-A's proper time, the material undergoes "ontological blinking."
  1.  **Phase On (10s):** The atoms have mass, interact causally, and the clock functions normally.
  2.  **Phase Off (10s):** The coupling disengages. The atoms do not merely scatter; they cease to have mass or spatial location. They dissolve entirely into the vacuum background energy. During this gap, there is *nothing* at the clock's location—no particles, no fields, no substratum.
  3.  **Phase On (10s):** The vacuum energy recoalesces into the exact same atomic configuration, resuming the clock's function exactly where it left off. The causal state (the position of the gears, the digital readout) is preserved via a topological imprint in the vacuum field during the "Off" phase, ensuring that when the mass returns, it picks up the causal chain precisely.

  This cycle repeats indefinitely. Clock-A exists for 10 seconds, goes out of existence entirely for 10 seconds, and pops back into existence for 10 seconds.

  **The Question:** Is the Clock-A that exists in the *third* "On" phase numerically identical to the Clock-A that existed in the *first* "On" phase?

  ---

  ### The Conflict

  This case forces a split because it isolates **Causal Continuity** (the Perdurantist's strength) from **Substantial/Spatio-Temporal Continuity** (the Endurantist's strength). It is not a case of parts being replaced (Ship of Theseus) or two objects coinciding (Statue/Lump). It is a case of *existence itself* being intermittent.

  #### 1. The Perdurantist Verdict: **Numerical Identity**
  **The View:** The Perdurantist views Clock-A as a 4D space-time worm. In the block universe, the "gaps" are simply regions where the worm has no temporal parts.
  **The Argument:** Identity for a 4D object is a matter of causal continuity across the manifold. Because the "On" phases are causally linked by the vacuum imprint (the later phases are counterfactually dependent on the earlier ones), they constitute segments of a single, discontinuous world-line. The fact that the worm is "dashed" rather than "solid" is topologically irrelevant.
  **The Commitment:** The Perdurantist is committed to the claim that **an object can survive its own non-existence.** As long as the causal chain is preserved, the 4D worm remains one entity, even if it has temporal gaps.
  **The Cost:** This view must accept "gappy existence" as coherent. It implies that you could step out of a room, cease to exist for a century, and pop back in, remaining the *same person* liable for your previous debts. This strains the intuitive link between existence and identity.

  #### 2. The Endurantist Verdict: **Numerical Distinctness**
  **The View:** The Endurantist views Clock-A as a 3D object that is *wholly present* at every moment it exists. Persistence is a primitive relation that requires the *same substance* to endure through time.
  **The Argument:** During the "Off" phase, Clock-A does not exist. There is no substance, no parts, and no "wholly present" entity. When the "On" phase returns, a new collection of atoms is assembled. While this new collection is qualitatively identical and causally linked to the first, it is not *substantially* continuous with it. For a material artifact, identity requires the continuous existence of the constituting matter (or at least the continuous existence of *some* substance). Since the substance vanished, the original object ceased. The object in the third phase is a *successor* (Clock-A2), not the original.
  **The Commitment:** The Endurantist is committed to the claim that **cessation of existence is the end of identity.** You cannot have "primitive persistence" through a period of absolute non-being.
  **The Cost:** This view creates a proliferation of objects. Every "blink" generates a new numerical entity. This breaks our ordinary practices of attribution: if Clock-A1 was promised a repair in Phase 1, Clock-A3 has no claim to it, even though it has the "memories" of the promise. It renders long-term responsibility impossible for any entity subject to such gaps.

  ### Why This Breaks the Stalemate

  In the Ship of Theseus, the Endurantist can wave their hands about "form" persisting even if matter changes. In the Statues/Lump case, they can argue about constitution. But in the **Proper-Time Stroboscope**, the *matter itself* vanishes.

  *   **The Perdurantist** wins on **Causal Continuity**: They can explain why we treat the clock as one thing (the causal chain is unbroken).
  *   **The Endurantist** wins on **Ontological Parsimony**: They refuse to grant "existence" to something that isn't there. To say the object "persists" through non-existence sounds like magic to them.

  **The Genuine Conflict:**
  If a crime is committed by Clock-A in Phase 1, and Clock-A is destroyed in Phase 3:
  *   The **Perdurantist** says: "You destroyed the criminal. Justice is served." (One worm).
  *   The **Endurantist** says: "You destroyed an innocent successor. The criminal ceased to exist in Phase 2." (Many objects).

  This is not a verbal dispute about the definition of "worm" vs. "substance." It is a material disagreement about whether *causal connection alone* is sufficient to bridge the void of non-existence. Your physicist friend will likely side with the Perdurantist (the block universe doesn't care about gaps), while you can hold the Endurantist line that *existence* is a binary precondition for identity—you can't be the same thing if, for a stretch of time, you are nothing.
