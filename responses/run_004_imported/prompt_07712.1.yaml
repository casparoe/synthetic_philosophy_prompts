      *   *Actually, Wright's specific take on Bootstrapping:* Wright is often associated with the idea that we have entitlement to the *presuppositions* of inquiry. However, regarding bootstrapping specifically, Wright tends to agree it's problematic. He argues that while we are entitled to trust, we cannot *establish* reliability through that trust alone in a way that counts as evidential warrant.

