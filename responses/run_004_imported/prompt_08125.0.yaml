answer: |-
  Good evening. For those of you who are here simply because you love my mother, welcome. For those of you who are here because you've spent the last thirty years debating her interpretation of *Nicomachean Ethics* Book V, Chapter 5: please put away your red pens. Tonight, no one is grading.

  My mother has spent her life arguing that modern economics got something fundamental wrong. She teaches that price is merely a convention—a *nomisma*—created to measure something deeper, which is need, or *chreia*. In her view, a price tag is just a temporary stand-in we use so a builder can trade with a shoemaker. But the thing that actually holds a community together isn't the currency that changes hands; it is the underlying reciprocity. It is the recognition that we need each other.

  She also teaches that this is why the ancient city maintained a public shrine to the Charites—the Graces. Aristotle notes this specifically. The shrine was there to remind citizens that exchange is not about settling a debt and walking away. It is about returning a favor with gratitude, so that the relationship continues.

  I have grown up hearing this argument. I have heard it at the dinner table, in the car, and over holiday meals. For a long time, I thought this was just theory. It was about cities, and markets, and the history of thought. But watching my mother prepare for this marriage, at sixty-eight, I realize she hasn't just been teaching economic history. She has been describing how to love.

  In our culture, we are often taught to view relationships through the lens of modern price theory. We are told to count the cost. We are told to assess value, to weigh what we are putting in against what we are getting out, to ensure the transaction is balanced so that no one is left in deficit. That is the logic of the sticker price. It is the logic of the contract that ends the moment the obligation is fulfilled.

  But my mother knows that *chreia*—need—is not a deficit. To need someone is not to be lacking; it is to be bound to them. When she looks at [Partner's Name], she is not looking for a settlement of accounts. She is looking for a partner in reciprocity.

  This is why this marriage, this second chapter, is so profound. If this were a marriage of convention, it would be about *nomisma*. It would be about security, or social expectation, or the standard price of companionship. But at sixty-eight, you do not marry for convention. You marry because you have identified a need that is specific, and real, and worthy of a shrine.

  [Partner's Name], you are entering a life with a woman who believes that the value of a thing is not what it costs, but what it sustains. She knows that the only way to keep an exchange alive is to ensure that the gratitude outlasts the gift. She knows that the Charites must be honored. In practical terms, this means she will never keep score. But it also means she expects that you will not keep score either. She expects that when one of you gives, the other returns it not because a debt is owed, but because the relationship itself is the thing of value.

  To the friends in the room who just want something warm about second chances: this is it. A second chance is not a discount. It is not a clearance sale on happiness. It is the Aristotelian ideal realized. It is the moment when you stop worrying about the price of the exchange and start honoring the need that makes the exchange necessary.

  My mother has spent thirty years telling us that the city survives only when we remember that money is a fiction, but need is real. Tonight, she proves it. She is not marrying for a price. She is marrying for a *chreia*. She is marrying because she knows that a life without reciprocity is no life at all.

  So, if we could all raise our glasses.

  To my mother, and to [Partner's Name]. May your house always be like the shrine to the Charites. May you never mistake the price for the value. And may you always find that the favor returned is greater than the favor given.

  To love, and to reciprocity.
