answer: |-
  This is an excellent case study for a moral responsibility seminar because it pits several competing theories of blame against one another: causal contribution, role obligations, and the significance of omissions versus commissions. Your discomfort stems from a tension between *outcome responsibility* (who caused the bad grade) and *process responsibility* (who violated a norm).

  Here is a breakdown of the principled arguments for and against singling you out, which should help you navigate this in your seminar.

  ### 1. The Argument for Special Blame (Role Obligations)
  Your teammates' verdict relies on the concept of **role responsibility**. In a division of labor, moral duties are not distributed equally; they are allocated by function.

  *   **The Safety Net Function:** Even if everyone read the document, the proofreader serves as the final gatekeeper. Philosophically, this creates a specific duty of care that differs from the general duty of a contributor. By skipping your read-through, you didn't just fail to help; you removed the specific mechanism designed to catch exactly this kind of error.
  *   **The Breach of Agreement:** Moral responsibility is often grounded in voluntary assumption of obligation. You accepted the task. When you accepted it, you created an expectation in your teammates. Even if they checked it before you, the social contract of the group project implies that the final check is the definitive one. Violating a specific promise is often viewed as more blameworthy than failing a general expectation.
  *   **Omission vs. Commission:** While the teammate who copy-pasted made an error of *commission* (doing something wrong), you made an error of *omission* (failing to do something right). In professional and academic contexts, negligence (skipping a required step) is often treated as more culpable than honest mistake, because negligence implies a choice to disregard a protocol.

  ### 2. The Argument for Shared Blame (Causal Symmetry)
  Your intuition rests on **causal contribution** and **counterfactual dependence**.

  *   **The "No Difference" Challenge:** You argue that reading it wouldn't have changed the outcome ("I would have had no better a chance of catching it"). If your action would not have altered the result, are you responsible for the result? If the error was subtle enough to fool three people, your omission might be causally inert regarding the *grade*, even if it was normatively wrong.
  *   **Epistemic Symmetry:** All three of you had the same epistemic access to the document. If the error was invisible to the two who read it carefully, it is arguably unfair to assume you would have seen it. To blame you more is to assume a level of competence you may not possess, which feels like a form of moral luck.
  *   **Primary Causation:** The teammate who made the copy-paste error is the *sine qua non* of the situation. Without that error, your proofreading would have been a formality. Some theories of responsibility argue that the creator of the risk bears more blame than the fail-safe who missed it.

  ### 3. Resolving the Tension: *Ex Ante* vs. *Ex Post*
  The key to resolving this philosophically lies in distinguishing between judging the decision *before* the outcome (*ex ante*) and judging it *after* the outcome (*ex post*).

  **The *Ex Post* View (Your Teammates):**
  Looking back, the error existed, and it wasn't caught. Since it was your specific job to catch it, you are the most salient cause of the *persistence* of the error. In a bureaucratic or institutional context, this is usually the standard: whoever held the pen last is responsible for the document.

  **The *Ex Ante* View (Your Intuition):**
  Looking at the decision at the moment you made it: You took a gamble. You decided the risk of an error slipping through was low enough to justify skipping the work.
  *   **The Principled Distinction:** You are more blameworthy not necessarily because you caused the grade loss, but because you **unilaterally increased the risk**.
  *   Even if you wouldn't have caught *this* error, by skipping the check, you made it possible for *any* error to slip through. Your teammates (presumably) did their checks. You opted out of the risk-mitigation process entirely.
  *   Therefore, the blame isn't arbitrary. It is anchored in the **violation of the risk-management protocol**, not necessarily in the specific causal chain of the data error.

  ### 4. The Problem of Moral Luck
  Your unease also touches on **constitutive moral luck**.
  *   **Scenario A:** You skip the check. No errors exist. You get an A. No one blames you.
  *   **Scenario B:** You skip the check. An error exists. You get a B-. You are blamed.

  In both scenarios, your *action* (skipping the check) was identical. Your *negligence* was identical. The only difference is luck (whether an error actually existed). If your teammates blame you more in Scenario B than they would have in Scenario A, they are succumbing to **resultant moral luck**.

  However, most practical ethical systems (and grading rubrics) reject the idea that luck should absolve negligence. We hold people responsible for the risks they create, not just the harms that materialize.

  ### Conclusion for Your Seminar
  Is the blame arbitrary? **No.**
  Is it proportionate? **That is debatable.**

  There is a principled way to single you out: **You are responsible for the *process failure*, while the copy-paster is responsible for the *content error*.**
  *   The copy-paster introduced a defect.
  *   You disabled the quality control system.

  In engineering, medicine, and aviation, disabling the safety check is often treated as more egregious than the initial mistake, because the safety check is the last barrier against catastrophe. Your teammates are viewing the proofread as a safety barrier. You are viewing it as a redundant pair of eyes.

  **The Verdict:** You bear the most blame for the **negligence** (skipping the task), but you do not necessarily bear the most blame for the **error** (the copy-paste). Your teammates are conflating the two. You should accept responsibility for failing your role (which justifies some blame), but you can push back on the idea that you are solely responsible for the grade loss, given that the error was created by another and was undetectable to the others who fulfilled their roles.

  This situation perfectly illustrates the conflict between **liability models** of responsibility (who broke the rule?) and **causal models** of responsibility (who changed the outcome?). It's a great topic to bring up in class.
