answer: |-
  Good evening. For those who don't know me, I'm Alex. I sat in Mr. Doyle's third-period history class in 1998. I'm also, somewhat improbably, a philosophy professor now. I mention that because when I tell people I teach for a living, they often ask where I learned to think. The answer is always the same. It wasn't in a graduate seminar. It was in Room 304, with the peeling paint on the windowsill and the map that was outdated by ten years.

  I want to start by telling you about the first week of school. Most of us remember the syllabus. We remember the rules. But in Mr. Doyle's class, the first week was never about the rules. It was about the mystery. He wouldn't start with the date of a battle or the name of a treaty. He'd start with a letter written from a trench in 1916, or a diary entry from a factory girl in 1910. He'd read it aloud, and for fifteen minutes, we weren't students in suburban high school. We were there. We were cold, we were tired, we were angry, or we were hopeful. He made history feel like a story that hadn't finished writing itself yet. He made us care about the people before he ever asked us to care about the timeline. He hooked us. He made us fall in love with the question before he ever demanded we answer it.

  But, as many of us in this room know, that romance was only the beginning. Because once Mr. Doyle had you hooked, he closed the trap.

  This is the part of the evening where I need to be careful. The one unforgivable move tonight would be a toast that's just a pile of inert facts about the guy's career. Mr. Doyle hated those. He called them "dead facts." You know the kind: *He started in 1985. He taught 4,000 students. He served on three committees.* You can memorize that for a quiz, but you can't *do* anything with it. It's weight without movement.

  So, let's talk about the work instead. Because after the story came the discipline. If you wanted to stay in Mr. Doyle's good graces, you couldn't just feel things. You had to prove them. He taught us that intuition without evidence is just a guess. We learned that "because I think so" was not a citation. We learned to interrogate a source. Who wrote this? Why? What are they leaving out? He graded our essays with a red pen that felt like a scalpel. He made us rewrite paragraphs until the logic held water. It was rigorous. It was often frustrating. There were days we wanted the romance back without the price tag. He taught us that freedom isn't the absence of structure; it's the mastery of it. He made us sweat through the details so that we wouldn't be fooled by easy answers later in life.

  And that brings us to now. Because if you only have the story, you're a dreamer. If you only have the facts, you're a clerk. But if you have both, if you can move between the emotion and the evidence, you become something else. You become a thinker.

  That is what he gave us. He didn't just teach us history; he taught us how to inhabit the world. I look around this room and I see lawyers, journalists, engineers, parents, business owners. I see people who know how to listen to a story, but also know how to check the fine print. We are the generalization. We are the proof that the method works. We are the moment in the lesson where the teacher steps back and lets the students run with it.

  Mr. Doyle, you spent thirty-eight years mastering a rhythm. You started with the spark, you forced us through the fire, and then you let us walk out carrying the light. You may never have read the educational theorists who wrote about this cycle. You didn't need to. You lived it. You understood that education isn't about filling a bucket with data; it's about lighting a fire and then teaching us how to tend it so it doesn't go out.

  So, I'd like to propose a toast.

  To Mr. Doyle. Thank you for the romance that woke us up. Thank you for the precision that sharpened us. And thank you for the freedom to go out and use it all. May your retirement be filled with new stories to explore, free of grading periods, and may you never, ever have to grade another multiple-choice test on the Industrial Revolution.

  To Mr. Doyle.
