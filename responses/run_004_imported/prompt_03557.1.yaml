prompt: |-
  Write a joke that plays on the philosophical distinction between a critic's lacking the standing to blame someone and the critic's simply being mistaken that the person did anything blameworthy. It should be funny to people familiar with the debate about hypocrisy and moral standing — that is, the punchline should turn on the actual content of that distinction (for example, the fact that a hypocritical critic's accusation can be true even though the critic has no right to voice it) rather than being a generic joke about hypocrites.
