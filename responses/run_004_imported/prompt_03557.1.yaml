answer: |-
  Two moral philosophers, Evans and Prichard, are having drinks after a conference.

  Evans points a finger at Prichard. "You lied about your data in that paper."

  Prichard sighs. "Evans, you lied about your data in *your* paper last year. You're a hypocrite. You have no standing to blame me."

  "Granted," says Evans, taking a sip of his beer. "My standing is zero."

  "So," Prichard says, leaning back, "you admit your accusation is unfounded? That you were mistaken about my blameworthiness?"

  "Not at all," Evans replies. "I admit I have no *right* to speak. I do not admit you have no *guilt*."

  "But what good is an accusation you have no right to make?" asks Prichard. "If you can't blame me, the norm is silent."

  "I'm not blaming you," says Evans. "Blaming implies I'm above you. I'm not. I'm just... corroborating the norm from below."

  Prichard frowns. "Corroborating from below?"

  "Think of it like this," says Evans. "A judge can't sentence a thief if the judge is also a thief. But the thief-judge can still testify that the theft occurred."

  "So what are you?" asks Prichard.

  "I'm not the judge," says Evans. "I'm the co-signer on your damnation."
