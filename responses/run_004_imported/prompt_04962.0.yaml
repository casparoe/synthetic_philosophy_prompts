      *   **Section 2: The Fate of the Losing Ground (Moral Residue).** Direct answer: Kant generally rejects moral residue. If you follow the stronger ground, you fulfill your duty perfectly. The losing ground becomes morally inert *as an obligation*. Discuss the difference between *regret* (permissible) and *remorse/guilt* (implies wrongdoing).
      *   **Section 3: Is it Definitional Fiat?** Analyze the philosophical weight. It's not just wordplay; it's about the unity of reason. But acknowledge the criticism (e.g., from Bernard Williams or contemporary dilemma theorists) that this ignores the phenomenology of moral life.
      *   **Section 4: Implications for the User's Piece.** How to frame this? Kant offers a "conflict of grounds" model vs. the "conflict of duties" model. This changes the nature of the dilemma from tragic violation to difficult judgment.
