      *   *Reasoning:* Duties express objective practical necessity. Two opposite necessary rules cannot coexist. If $A$ is duty, not-$A$ is contrary to duty.
      *   *Concession:* Grounds of obligation (*rationes obligandi*) can conflict.
      *   *Resolution:* The stronger ground wins (*fortior obligandi ratio vincit*).
      *   *Outcome:* The losing ground does *not* become a duty. Acting on it would be contrary to duty.

  3.  **Address Core Question 1: Moral Residue:**
      *   *Kant's Stance:* Strictly speaking, no. If the stronger ground wins, it becomes *the* duty. The other ground ceases to generate an obligation. Therefore, failing to act on the losing ground is not a violation of duty.
      *   *Implication:* No objective guilt. No objective requirement for restitution *qua* duty violated.
      *   *Nuance:* However, Kant acknowledges human finitude. We feel pain/regret. But is this *moral* residue (implying a lingering obligation) or just *psychological* residue (sadness that the world required a trade-off)?
      *   *Scholarly Consensus:* Most Kantians (e.g., Timmermann, Baron) argue Kant rejects moral residue because it implies a violation of the Categorical Imperative's consistency. If you did the right thing, you did the *whole* right thing.
      *   *Counter-point:* Some argue the "ground" doesn't disappear entirely; it retains normative weight as a *reason*, just not a *binding* one. But does Kant allow this? The text says "in that case the one of them is not a duty."
      *   *Conclusion on Residue:* Kant's system leaves little room for *objective* moral residue. Any lingering feeling is subjective, not a trace of a violated obligation.

  4.  **Address Core Question 2: Definitional Fiat vs. Real Work:**
      *   *The Charge:* Is Kant just playing semantics? Redefining "duty" so conflicts are impossible?
      *   *Defense:* It's not just fiat; it stems from the logic of law and reason. For Kant, morality is legislative. A legislature cannot command $X$ and not-$X$ simultaneously without losing authority.
      *   *The "Work" it does:* It preserves the sovereignty of reason. If dilemmas were real, reason would be contradictory, and the Categorical Imperative would fail as a universal test.
      *   *The Cost:* It makes the system rigid. It struggles with tragic cases (e.g., lying to a murderer at the door).
      *   *Verdict:* It's a substantive metaphysical claim about the nature of rational agency, not just a linguistic trick. However, it *does* shift the problem from "which duty do I break?" to "which ground is stronger?" which can look like the same practical problem dressed up.

  5.  **Synthesize and Structure the Response:**
