  **(Plan for "Moral Residue"):** Be clear: For Kant, if you obey the stronger ground, the moral ledger is clean. There is no debt left over. This is the antithesis of the "moral residue" view.

  **(Plan for "Definitional Fiat"):** Argue it's a *constitutive* claim about rationality, not just a definition. But admit it has the *effect* of ruling out dilemmas a priori.

