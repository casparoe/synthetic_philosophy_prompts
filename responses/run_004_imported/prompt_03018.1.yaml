          *   *Devon 2:* He wins on the *behavioral* interpretation. If utility includes pride, the payoff matrix changes.
          *   *Missing:* Winner's Curse is the big one for overpaying relative to market value (Reverb). Sunk cost explains *why* he stayed, Winner's Curse explains *why* the price was too high. Also, the Endowment Effect is crucial for eBay specifically (being the high bidder feels like ownership).

  6.  **Self-Correction/Review during drafting:**
