answer: |-
  The espresso machine hissed, a sharp counterpoint to the lull in conversation. Dana stirred her latte, the spoon clinking against the ceramic. Priya watched her, hands wrapped around a black coffee.

  "Okay," Dana said, setting the spoon down. "I've been thinking about what you said regarding the 'reckless mother' objection. You think my view lets people off the hook too easily."

  "I think it lets them off the hook entirely," Priya corrected gently. "Look, take the CF case. On your view, if the parents conceive naturally and the child has cystic fibrosis, they haven't wronged *that* child. Fine. But apply that logic to a pregnant woman who drinks heavily. If the alcohol alters the timing of ovulation or conception— which biologically it might — she creates a *different* child. A child with Fetal Alcohol Spectrum Disorders. By your logic, she hasn't made *that* child worse off than it would otherwise have been. The alternative for that specific child was non-existence. So, is she blameless?"

  Dana nodded slowly. "I know. It's the standard objection. Boonin deals with it by distinguishing between *identity-affecting* choices and *identity-preserving* choices. But you're right, in the messy biology of conception, almost everything is identity-affecting. If I say 'no wrong is done,' it sounds like I'm saying 'no moral constraint exists.'"

  "Exactly," Priya said. "And that's why the non-comparative account works better. The child with FASD is in a harmed state. The parents imposed that state. It doesn't matter if the alternative was a different, healthy child. You don't get to justify imposing a serious burden by saying, 'Well, otherwise you wouldn't be here.'"

  "But Priya, that's where your view terrifies me," Dana leaned forward. "Because if the mere imposition of a burden is enough to constitute a wrong, regardless of the alternative, where do you stop? I could have waited five years to have my son. I would have been more established, less stressed, maybe able to afford a better school district. By waiting, I could have created a *different* child who would have been significantly better off. Did I wrong my actual son by having him *when I did*? I imposed the burden of a less-than-optimal upbringing on him."

  Priya smiled, anticipating this. "This is the 'Non-Identity Problem' turned into the 'Non-Existence Problem.' If you require parents to maximize the welfare of the potential child, procreation becomes impossible. But that's not what Harman or Shiffrin are arguing. It's not about *better*. It's about *good enough*."

  "Define 'good enough'," Dana challenged.

  "A threshold of basic functioning," Priya said. "Shiffrin talks about burdens that restrict the capacity for autonomous agency. Cystic fibrosis is a lifelong, taxing medical condition that significantly restricts physical autonomy and imposes pain. FASD causes cognitive impairment. Those cross a threshold. Having a smaller bedroom or a less wealthy mother? That doesn't cross the threshold. The duty is negative: do not create a child in a state of severe deprivation or suffering. It is not a positive duty to create the *best* child."

  Dana absorbed this. "So you're moving from a comparative account of harm to a threshold-based account of rights. You're saying the child has a right not to be born into a state below a certain baseline, even if the only alternative to violating that right is their non-existence."

  "Right."

  "Okay," Dana said, picking up her spoon again, then putting it down. "Here is where I have to push back on your threshold. Who sets it? CF is severe. But what about moderate asthma? What about a genetic predisposition to depression? If I use PGD to screen for CF, am I morally obligated to screen for depression too? If I don't, and my child suffers from depression, have I wronged them on your view? Because I could have selected a different embryo without that predisposition."

  Priya frowned. "That's the slippery slope, yes. But medicine draws lines all the time. We treat pathology differently than we treat normal variation. CF is a pathology that shortens life and requires grueling daily treatment. Depression is serious, but a genetic *risk* is different from a guarantee. The avoidability matters. In the CF case, the burden is foreseeable, serious, and avoidable via PGD."

  "Avoidable," Dana repeated. "That word is doing a lot of work for you. Because if 'avoidable' means 'we could have had a different child,' then we are back to square one. The only reason it's avoidable is because a *different* child is possible."

  "No," Priya insisted. "It's avoidable in the sense that the *state of suffering* is avoidable. We aren't comparing Child A to Child B. We are comparing 'Child A with CF' to 'No Child A.' If 'Child A with CF' involves a level of suffering that violates their right to an open future, then imposing it is wrong. The existence of Child B is irrelevant to the wrongness done to Child A."

  Dana was quiet for a moment. She looked out the window at the rain. "I think I need to concede something here. Or at least, refine my position."

  Priya raised an eyebrow. "Oh?"

  "My 'Bite the Bullet' position... it's logically consistent regarding *complaints*," Dana said slowly. "If the child with CF exists, and their life is worth living, they cannot logically say, 'You should have done otherwise,' because doing otherwise means *I* don't exist. So, in terms of *wronging the child*, I stand by it. There is no victim who has a valid comparative complaint."

  "But?"

  "But," Dana sighed, "I think I've been conflating 'wronging the child' with 'acting morally permissibly.' Just because the child cannot claim they were wronged doesn't mean the parents didn't do something wrong."

  Priya leaned in. "Go on."

  "Parfit suggested this with the 'No Difference View.' Maybe the moral status of the act doesn't depend entirely on the identity of the victim. If I knowingly create a child who will suffer significantly, when I could have created a child who won't... the *impersonal* badness of the suffering matters. Even if the sufferer isn't 'wronged' in the strict comparative sense."

  "So you're admitting an impersonal principle?" Priya asked. "That suffering is bad, regardless of who suffers?"

  "I am," Dana said. "And that's where I have to qualify my view. I told you earlier that if the child isn't worse off, nothing is wrong. That's too strong. It should be: 'If the child isn't worse off, the *child* has no claim of justice against the parents.' But the parents might still violate a moral duty to minimize suffering."

  "Does that change the decision for our friends?" Priya asked. "The ones facing the CF screening?"

  "It should," Dana said. "Because on my old view, they could say, 'It doesn't matter, we can't wrong the kid.' On this refined view, they have to say, 'We won't wrong the kid either way, but creating a child with CF creates more suffering in the world than creating a child without it, and we have a duty to avoid that if we can.'"

  Priya nodded, looking satisfied but thoughtful. "That brings us closer. But I still worry about your 'impersonal duty.' If it's just about minimizing suffering, does it demand too much? If I have one child naturally, and I could have had two via IVF and donation, am I failing a duty by not maximizing the number of happy people?"

  "Fair point," Dana smiled. "Okay, let's limit the duty. It's not about maximizing good. It's about avoiding *foreseeable, serious harm* when the cost to the agents is reasonable. IVF is costly and taxing, but for CF carriers, it's a known medical pathway. The burden on the parents is high, but the burden on the child is higher."

  Priya took a sip of her coffee. "So, we meet in the middle. I accept that 'wronging' might be too strong a word if the life is worth living, but I maintain that imposing a severe, avoidable burden is a moral failure, regardless of identity. And you accept that 'no comparative harm' doesn't equal 'moral permission.'"

  "Exactly," Dana said. "It stops being about whether the child can sue us, and starts being about whether we can look at the choice clearly. We aren't choosing between Child A and Child B. We are choosing between bringing a child into a struggle versus bringing a child into a clearer path. Even if they are different children."

  "It's a shift from *justice* to *care*," Priya mused. "Justice asks: Did I violate your rights? Care asks: Did I do what I could to ensure you flourish?"

  Dana nodded. "And for our friends... I think that helps. It removes the paralysis. They don't have to solve the metaphysics of identity to know that using PGD is the more responsible choice. It's not that the natural child is 'wronged.' It's that the parents have a reason to prefer the path with less suffering."

  "I can live with that," Priya said. "As long as you admit that 'less suffering' is an objective good, even if the sufferer changes."

  "I can admit that," Dana said. "The bullet still needs biting, but maybe we don't have to swallow it whole."

  Priya laughed. "I'll take it." She checked her watch. "I have to run, but... do you think they'll go for the IVF?"

  Dana looked into her empty cup. "If they're anything like us, they'll argue about the philosophy for another three weeks. But yeah. I think they'll do it."

  "Good," Priya said, standing up. "Less suffering is a good place to start."
