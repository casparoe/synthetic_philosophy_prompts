          *   *Analysis:* Aunt's "original sin" argument is logically sound regarding *causality* but emotionally rigid regarding *recovery*. Uncle's analogy (pills) is strong against moralizing the origin, but might minimize the voluntary nature of gambling vs. medical necessity.
          *   *Verdict:* Uncle has the stronger ethical argument here (blaming the origin doesn't help the present), but Aunt is right that Danny isn't a passive victim of circumstance initially.

      *   **Round 3: The Function of Anger (Justice vs. Utility)**
          *   *Aunt:* Anger is the right reaction to betrayal.
          *   *Uncle:* Is anger the *useful* reaction? Sadness/worry is better. Anger stopped making sense.
          *   *Analysis:* This is the crux. Aunt focuses on *retributive justice* (he wronged me, I feel wronged). Uncle focuses on *utilitarian outcome* (will anger fix this?).
