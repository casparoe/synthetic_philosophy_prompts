          *   *Uncle:* It's a compulsion/addiction. Cravings run the show. Anger is like anger at a seizure.
          *   *Analysis:* Aunt is right about the *legal/moral* definition of theft (it's still theft). Uncle is right about the *psychological/neurological* reality of addiction (diminished impulse control).
          *   *Verdict:* Aunt wins on accountability/boundaries. Uncle wins on medical reality/empathy.

      *   **Round 2: Origin Story (Initial Choice vs. Disease Progression)**
          *   *Aunt:* He chose to start. He knew the risks. He set this in motion. He can't hide behind it now.
