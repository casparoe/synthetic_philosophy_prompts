      *   **Evidence:** $P(H|R) = 3/4$ (Odds 3:1 for HQ given Red).
      *   **MaxEnt Update:** Minimize $D_{KL}(P_{new} || P_{old})$ subject to $P_{new}(H|R) = 3/4$.
      *   **Result:** $P_{new}(R)$ drops below $1/2$ (specifically to roughly $4/7$ or similar depending on exact formulation, but definitely shifts).
      *   **Why?** To satisfy the constraint while changing the distribution as *little as possible* (in terms of information distance), the algorithm adjusts the $R$ mass relative to $B$ mass because the internal structure of $R$ changed significantly while $B$ remained untouched. It's a feature of the geometry of the probability simplex, not necessarily a bug, but it feels like "learning about R tells you something about B."

  3.  **Analyze Keynes's *Treatise on Probability*:**
      *   **Key Concept 1: The Principle of Indifference (PoI).** Keynes accepts it but restricts it heavily. It requires "no relevant evidence" to distinguish alternatives. Crucially, the alternatives must be *indivisible* or based on the same evidence. He worries about re-description (the paradoxes of PoI).
      *   **Key Concept 2: Logical Relations.** Probability is a logical relation between evidence ($h$) and conclusion ($a$), denoted $a/h$. It's not necessarily numerical.
      *   **Key Concept 3: Weight of Argument.** Distinct from probability. Probability is the *balance* of evidence; Weight is the *amount* of evidence. New evidence can lower probability but must increase weight.
      *   **Key Concept 4: Conditional Probability.** Keynes treats conditionals carefully. He distinguishes between direct evidence and evidence about relations.

