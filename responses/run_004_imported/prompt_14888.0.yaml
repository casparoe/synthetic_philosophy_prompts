      *   *Refining the Conditional:* Keynes is wary of treating conditionals as material implications or simple constraints. He views probability as $a/h$. Learning "If $R$, then $P(H) = 3/4$" changes $h$. Does it change the relation $R/h_{new}$? Keynes would argue no, unless $h_{new}$ contains info about $R$'s likelihood relative to $B$.

