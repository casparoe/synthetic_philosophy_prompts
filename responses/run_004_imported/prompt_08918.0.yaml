answer: |-
  Good evening. For those of you who don't know me, I'm a friend of Warren's from the agency. Looking around this room, I realize we have a bit of a split audience. About half of you are health physicists who know exactly what a "collective dose" is. The other half are Warren's family and neighbors, who are currently wondering if "collective dose" is a type of laundry detergent.

  I want to talk about that split, because it's actually the story of Warren's career. And to explain it, I have to tell you about a philosophical puzzle I recently read about, concerning dust specks.

  Imagine I have a magic button. If I press it, one specific person gets tortured horribly for fifty years. That's option A. Option B is that I press the button, and a number of people so large it breaks the human brain—three raised to the power of three, raised to the power of three again—each get a single, tiny dust speck in their eye. Just a blink. A momentary irritation.

  Which is worse?

  Mathematically, if you add up all that irritation, the total suffering in Option B is higher. But intuitively? Most of us say the torture is worse. You can't just multiply a trivial annoyance until it outweighs a tragedy.

  For twenty-five years, Warren and I fought about exactly this problem. We just used different words. In radiation protection, we call it "collective dose." It works like this: If you give a trillion people a radiation dose so small their bodies repair it before lunch, regulators say you still have to multiply that tiny risk by a trillion. Out pops a number of "statistical cancer deaths." Ghost bodies. People who will never get sick, counted as casualties on a spreadsheet.

  I always took the hard line. I told Warren, "If you believe risk is linear, you have to trust the math all the way down. You can't cherry-pick where the arithmetic stops."

  Warren's position was more subtle. He wasn't saying safety didn't matter. He was saying that *meaning* matters. He argued that below a certain threshold, a risk stops being a risk and just becomes noise. You can't summon a ghost by adding up a trillion whispers. To Warren, treating a phantom statistical death the same as a real, preventable tragedy wasn't just bad math; it was bad ethics. It diverted resources from helping real people to chasing imaginary ones.

  We had this argument at every conference from here to Vienna. **(To the specialists)** *I think the only thing that actually followed a Linear No-Threshold model was the slope of our bar tabs after the evening sessions.*

  But here's the thing. We never settled it. I didn't convince him, and he certainly didn't convince me. And reading about this dust speck problem recently, I realized why we never settled it. It's not a physics problem. It's a human one.

  It's the question of whether the universe cares about our sums. Does a billion negligible things add up to one significant thing? Warren spent his life arguing that we have a duty to distinguish between the two. That protecting the public means protecting *people*, not just protecting *numbers*.

  To Warren's family: You don't need to understand the radiation to understand the man. Warren was the guy who refused to let the spreadsheet replace the human being. He was the guy who looked at a "statistical death" and said, "Show me the person."

  Warren, we may never agree on whether the dust specks add up to torture. But I know for a fact that thirty-five years of friendship, thousands of conference coffees, and one hell of a career add up to something real.

  So, if everyone could raise a glass. To Warren. May your retirement doses be negligible, your risks be non-existent, and may you never have to sum up a single thing ever again.

  To Warren!
