prompt: |-
  ok so i've been down a bit of a rabbit hole reading about why so many old religions/cultures banned charging interest (its still a whole thing in islamic banking today) and that led me to actually sit down and read some of Aristotle's Politics, book 1, in one of those free translations online. im not a philosophy person at all so bear with me here. there's a part earlier on where he's talking about ordinary possessions in general and he says this:

  "Of everything which we possess there are two uses: both belong to the thing as such, but not in the same manner, for one is the proper, and the other the improper or secondary use of it. For example, a shoe is used for wear, and is used for exchange; both are uses of the shoe. He who gives a shoe in exchange for money or food to him who wants one, does indeed use the shoe as a shoe, but this is not its proper or primary purpose, for a shoe is not made to be an object of barter."

  then a bit later, once he actually gets to money, he says this:

  "The most hated sort, and with the greatest reason, is usury, which makes a gain out of money itself, and not from the natural object of it. For money was intended to be used in exchange, but not to increase at interest. And this term interest, which means the birth of money from money, is applied to the breeding of money because the offspring resembles the parent. Wherefore of all modes of getting wealth this is the most unnatural."

  i don't think im getting the actual argument here, just the general vibe of it. like, trading a shoe away for food seems like a completely normal thing to do, so why does he call that the "improper" use of it? and is the usury bit seriously just resting on "money having babies is gross/unnatural" as the whole argument, or is that just a catchy way of putting some deeper point? feels like these two bits are supposed to link up into one actual argument but i can't work out what it is on my own, so if someone could break down the logic for me that'd be great.
