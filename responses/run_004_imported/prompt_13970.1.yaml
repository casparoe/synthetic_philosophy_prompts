      *Refining the "Resentment" line:* "It means I don't have to protect myself from you by pretending you aren't there. You're back. You're real. And that means you have the power to hurt me, and I have the power to be mad at you. And I wouldn't trade that for anything."

      *Let's make it smoother.* "You've earned the standing to be a regular brother. Which means I expect you to show up. It means if you let me down, I'll tell you. And it means I know you'll listen."

      *Okay, let's write it.*

      *(Post-Draft Review)*: Does it hit the Strawson note? Yes, the shift from managing a problem to engaging a person. Is it safe for the sponsor? Yes, emphasizes responsibility and amends. Is it safe for family? Yes, emphasizes love and forgiveness.

      *Final Polish on the "Resentment" aspect:* The prompt specifically asks to end with him earning the standing to be "thanked, loved, and yes, even resented." I need to make sure that specific triad or sentiment is clear without using the word "resented" in a hostile way. I will use the concept of "ordinary grievances."

      *Wait, one nuance:* The prompt says "ending with my brother having earned back the standing to be thanked, loved, and yes, even resented, in the ordinary way again." I should try to include that sentiment explicitly but naturally.

      *Revised plan:* "You've earned the right to be treated like everyone else. To be thanked when you help. To be loved when you're here. And yes, to be held accountable when you slip. The ordinary stuff."

      *Let's go.*

