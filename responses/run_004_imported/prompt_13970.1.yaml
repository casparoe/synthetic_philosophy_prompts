answer: |-
  Five years. When I look at this chip, I see the time. But when I look at you, I see the work.

  I need to be honest about what the last few years were like for me. During the worst of it, I stopped expecting things from you. I know people say addiction is a disease, and maybe it is. But for me, it felt like you had left the room. I stopped seeing my brother and started seeing a problem that needed managing. I treated you like you were made of glass, or like you were sleepwalking. I told myself, "He can't help it." I lowered the bar so low I thought it was on the floor, because I thought you couldn't jump over it.

  In doing that, I thought I was protecting myself. But I realize now that I was also shutting you out. You can't have a relationship with someone you've excused from responsibility. You can't truly trust someone you think is powerless to keep a promise.

  So, tonight, I want to talk about what your amends mean to me. An apology only lands if the person hearing it believes you had the choice to do otherwise. For a long time, I didn't believe that. I thought "it" was driving the car. But watching you over these last five years, showing up, doing the hard things, keeping your word when it was inconvenient—you have convinced me otherwise.

  You have earned something tonight. It isn't just our forgiveness. It's our expectations.

  I am ready to treat you like a brother again. And I want you to know what that means. It means I'm not walking on eggshells anymore. It means I'm not going to blame a sickness for your choices. It means that when you show up, I'll be grateful. When you help me, I'll thank you. And if you hurt me, I'll tell you, and I'll expect you to fix it.

  That might sound like a lot of pressure. But it's actually the highest respect I can pay you. It means you are back in the arena with the rest of us. You are back in the messy, risky, ordinary world where people love each other, disappoint each other, and make it up to each other.

  You have earned the standing to be thanked, loved, and yes, even resented in the ordinary way again. You are back. And we are so glad you are here.

  To my brother.
