      *   *Gödel:* Uses Higher-Order Modal Logic. Defines "God-like" via "positive properties." Axioms about positivity (e.g., if $P$ is positive, $\neg P$ is not; necessary existence is positive). Derives that a God-like being exists necessarily.
      *   *Comparison:* Anselm is semantic/conceptual (greatness). Gödel is axiomatic/set-theoretic (positivity).
      *   *Verdict:* Not just "extra steps." Gödel shifts the burden from "conceivability/greatness" to "axioms about value properties." It's a different *kind* of argument, even if the conclusion is the same. It formalizes the intuition of "perfection" into "positive properties."

  3.  **Deconstruct Question 2: Vulnerability to Objections:**
      *   *Gaunilo (Perfect Island):* Anselm is vulnerable (why not a perfect island?). Gödel blocks this via the definition of "positive properties." An island is a contingent object; "God-like" is a bundle of essential properties. Gödel's axioms implicitly rule out contingent composites.
      *   *Kant (Existence is not a predicate):* Anselm treats existence as a perfection. Gödel treats *Necessary Existence* as a property (specifically, an essential property of a God-like being).
