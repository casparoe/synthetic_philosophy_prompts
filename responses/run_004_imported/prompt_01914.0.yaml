prompt: |-
  I spent about thirty-five years as a physicist before I retired, and it's only in the last year or so that I've actually sat down and read philosophy properly, rather than just whatever shows up in a pop-sci article. I've gone a bit down a rabbit hole on the ontological argument lately, mostly because I discovered that Godel - who to me was always just "the incompleteness theorem guy" from grad school, the one who supposedly used to walk home from the Institute with Einstein - apparently worked out his own modal version of the argument around 1970, showed it privately to Dana Scott because he was worried people would think he actually believed in God rather then just doing a logic exercise, and the thing wasn't even published until after he died.

  So I've now read through Anselm's original in the Proslogion, and it turns out there's actually some dispute about whether he's even giving one argument or two - I gather people like Malcolm think chapter 2 is just about mere existence, while chapter 3 is a seperate, arguably stronger, argument about necessary existence. Then there's Godel's version, with all his business about "positive properties" and the S5 modal axioms, which I can follow line by line without really feeling like I understand it. A friend from my old lab, who's gotten into this stuff around the same time I have, insists Godel's version is basically "Anselm with extra steps." That seems too quick to me, but I can't articulate why.

  Could you give me a real comparison of the two, rather than just describing each one in turn? Specifically I'd like to know: (1) whether Godel's formalization introduces anything structurally new compared to Anselm's necessary-existence argument, or whether my friend is basically right, (2) whether formalizing things this way makes the argument more or less vulnerable to the old objections, like Gaunilo's perfect island or Kant's point about existence not being a real predicate, and (3) what this "modal collapse" problem is that I keep seeing mentioned alongside Godel's axioms, and whether it's a fatal flaw or just an ugly side-effect he could've patched up. And if you had to say which of the two is the more serious piece of philosophy, Anselm's or Godel's, which would it be, and why?
