answer: |-
  This is an excellent question that cuts to the heart of why Kripke's "A Puzzle about Belief" (1979) remains a central text in the literature. You are right to feel that the Paderewski case looks superficially like a textbook application of the Fregean sense/reference distinction. After all, Peter clearly has two different "modes of presentation" for the same man.

  However, Kripke's aim in the paper is not to refute Fregeanism (he explicitly disclaims this), but to show that the puzzle arises from principles of belief attribution that *any* theory—Millian or Fregean—ought to accept. The difficulty for the Fregean is not explaining Peter's rationality (which senses do easily), but explaining how *we* can truly report Peter's beliefs using public language without falling into contradiction or ineffability.

  Here is a reconstruction of Kripke's reasoning regarding the neutrality of the puzzle, followed by an assessment of the "mental files" Fregean comeback.

  ### 1. Why Kripke Takes the Puzzle to be Neutral

  Kripke argues that the Paderewski case generates a contradiction using two principles that seem too weak to deny, regardless of one's theory of names:

  1.  **The Disquotation Principle:** If a normal speaker sincerely assents to a sentence $p$, then they believe that $p$.
  2.  **The Principle of Translation:** If a sentence in one language expresses a truth, its translation into another language expresses a truth (less relevant for Paderewski, but part of the broader setup).

  In the **Pierre/Londres** case, a Fregean can argue that "London" and "Londres" are distinct names in the public language, potentially carrying distinct senses. But in the **Paderewski** case, there is only one name in the public language: "Paderewski."

  **The Problem for the Fregean:**
  If you are a Fregean, you typically hold that the sense of a name is part of the public language (or at least shareable between speakers). When Peter assents to "Paderewski has musical talent," he expresses a belief. When he assents to "Paderewski has no musical talent," he expresses a belief.

  If we apply the Disquotation Principle straightforwardly:
  1.  Peter assents to "Paderewski has musical talent." $\rightarrow$ Peter believes that Paderewski has musical talent.
  2.  Peter assents to "Paderewski has no musical talent." $\rightarrow$ Peter believes that Paderewski has no musical talent.
  3.  Therefore, Peter believes a contradiction.

  To avoid this, the Fregean must claim that the two occurrences of "Paderewski" in Peter's idiolect express **different senses**. Let's call them $Sense_A$ (pianist) and $Sense_B$ (statesman).

  **Kripke's Trap:**
  Kripke argues that this move creates a new problem regarding **belief attribution**. When *we* (the semanticists or observers) report Peter's belief, what sentence do we use?
  *   If we say, "Peter believes that Paderewski has musical talent," we are using the public name "Paderewski."
  *   If the public name "Paderewski" has a single sense (as public names usually do), then our report attributes a belief involving that single sense. But Peter doesn't grasp the identity of the two senses.
  *   If the public name "Paderewski" is ambiguous (having two senses), then our report "Peter believes that Paderewski has musical talent" is itself ambiguous. But ordinary belief reports don't strike us as ambiguous in that way. We feel we are reporting a specific belief Peter holds.
  *   If we try to specify the sense (e.g., "Peter believes that Paderewski-the-pianist has talent"), we are using a description Peter might not accept. Peter doesn't know there is a "Paderewski-the-pianist" distinct from "Paderewski-the-statesman." He just thinks there are two different men named Paderewski.

  Kripke's point is that the Fregean apparatus requires us to individuate beliefs by sense. But in the Paderewski case, the public linguistic resources to individuate those senses (distinct names) are missing. If the Fregean insists Peter has two senses, they must explain how *we* can truly report those beliefs using the *one* public name available. If we can't, then the Fregean theory makes ordinary belief attribution systematically false or impossible in cases of ignorance.

  Thus, the puzzle is neutral: The Millian gets a contradiction in Peter's mind (irrationality); the Fregean gets a contradiction in our reports (or an inability to report).

  ### 2. Assessing the Fregean Comeback: Mental Files

  The comeback you suggest is the standard contemporary Fregean move: appeal to **psychological modes of presentation** (often cashed out as "mental files," "notions," or "individual concepts").

  **The Move:**
  The Fregean argues that sense is not solely a property of the public language but is relative to the speaker's cognitive state. Peter has opened two distinct "mental files" labeled "Paderewski."
  *   File 1: Populated by information about a pianist.
  *   File 2: Populated by information about a statesman.
  *   When Peter thinks "Paderewski has talent," he is accessing File 1.
  *   When Peter thinks "Paderewski has no talent," he is accessing File 2.
  *   Therefore, the proposition believed is not $\langle \text{Paderewski, Talent} \rangle$ in both cases, but $\langle \text{File}_1, \text{Talent} \rangle$ and $\langle \text{File}_2, \neg \text{Talent} \rangle$.
  *   Peter is rational; no contradiction is believed.

  **Does this save the Fregean account?**
  This move successfully saves Peter's rationality, but it faces three significant challenges regarding whether it resolves the *semantic* puzzle or merely relocates it.

  #### A. The Attribution Problem (The "Effability" Objection)
  If senses are individuated by private mental files, how can *we* report Peter's beliefs?
  When I say, "Peter believes Paderewski has talent," I am using the public name. If the content of Peter's belief is essentially tied to his private File 1, my public sentence fails to capture that content. My sentence "Paderewski has talent" expresses a proposition involving *my* sense of Paderewski (or the public sense), not Peter's File 1.
  *   **Consequence:** This leads to a form of skepticism about belief reports. If senses are this fine-grained and psychological, we can rarely truly report what others believe, because we don't have access to their specific mental files.
  *   **Assessment:** This saves the theory of cognitive significance at the cost of making belief attribution largely false or approximate. Many philosophers find this too high a price.

  #### B. The Ambiguity Objection
  To make the Disquotation Principle work without contradiction, the Fregean must claim that the name "Paderewski" is ambiguous *in Peter's mouth*.
  *   **Consequence:** This implies that proper names are systematically ambiguous for any speaker who has multiple files for a single referent. If I know John Smith the banker and John Smith the baker, and I say "John Smith is rich," is my sentence ambiguous?
  *   **Assessment:** If the Fregean says "Yes," they are committed to a pervasive ambiguity in natural language that speakers are unaware of. If they say "No," they must explain why disquotation fails in Peter's case but works in ours. This risks making the theory *ad hoc*.

  #### C. The "Relabeling" Charge
  You asked if this move just relabels the puzzle. There is force to this worry.
  *   In the classic Hesperus/Phosphorus case, the difference in sense is grounded in a difference in **public linguistic meaning** (two different names). This explains why the identity statement is informative: it links two public linguistic items.
  *   In the Paderewski case, the difference in sense is grounded solely in **psychological history** (two introductions).
  *   **Critique:** If "sense" is defined as "whatever differs when a rational agent fails to recognize an identity," then the claim "Peter associates two senses with 'Paderewski'" is trivially true by definition. It doesn't explain *how* the semantics works; it just posits a semantic difference to match the psychological difference.
  *   A robust Fregean theory needs senses to be normative and shareable (public). By retreating to mental files, the Fregean risks turning "sense" into a purely psychological causal role. If so, it ceases to be a *philosophy of language* solution and becomes a *philosophy of mind* solution. It explains why Peter is rational, but it doesn't explain the semantics of the sentence "Paderewski is Paderewski."

  ### Conclusion

  Kripke treats the Paderewski case as a problem for Fregeans because it severs the link between **public linguistic difference** and **cognitive difference**. Frege's original solution relied on the idea that different names provide different routes to the referent. Paderewski shows that a single name can provide multiple routes for a single speaker.

  The "mental files" comeback is the best available Fregean response, and it is widely accepted in contemporary neo-Fregeanism (e.g., by Recanati or Evans). It successfully explains Peter's rationality. However, it does not fully resolve Kripke's puzzle regarding **belief attribution**. It forces the Fregean to either:
  1.  Accept that ordinary belief reports are often false (because they don't capture the specific file).
  2.  Accept that public names are ambiguous (which complicates communication).
  3.  Deny the Disquotation Principle (which Kripke argues is too intuitive to deny).

  So, to answer your specific question: The move does not *genuinely save* the classic Fregean account of cognitive significance if that account relies on public senses. It saves a *psychologized* version of Fregeanism. Whether this is a "relabeling" depends on whether you think mental files have enough structure to function as semantic values. If they are just placeholders for "way of thinking," then yes, it risks being a relabeling that explains the psychology but leaves the semantics of belief reports in tatters. Kripke's genius was to show that you cannot fix the semantics of belief without either making belief attribution opaque or making speakers look irrational. The Paderewski case ensures that the Fregean cannot have it both ways easily.
