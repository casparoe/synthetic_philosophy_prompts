      *   **Conclusion:** Incomparability is effectively intransitivity in disguise ("intransitivity wearing a trenchcoat"). To avoid money pumps, agents must force all values onto a single scale (completeness).
      *   **Question:** Is this right? Or is there a principled reason incomparability doesn't collapse into the transitivity case?

