answer: |-
  This is a sharp intuition, and you are effectively reconstructing one of the most serious arguments in modern decision theory: the **Money Pump Argument for the Completeness Axiom.**

  You are channeling the work of Johan Gustafsson (specifically his 2022 book *Money-Pump Arguments*), who argues exactly what you are suggesting: that rational agents are rationally required to have complete preferences to avoid exploitation.

  However, your conclusion that incomparability *necessarily* collapses into intransitivity (or forces a single scale) relies on a specific premise that is highly contested. The break in your reasoning is here:

  > *"if you genuinely can't rank two things against each other, then by definition you'd take a trade between them for an arbitrarily small sweetener"*

  This is the weak link. This statement conflates **indifference** with **incomparability**. If you fix that distinction, the money pump loses its grip, and the "trenchcoat" stays on.

  Here is where the argument breaks, philosophically and technically.

  ### 1. Indifference vs. Incomparability (The Sweetener Fallacy)
  In standard preference logic:
  *   **Indifference ($A \sim B$):** You rank them as equal. Crucially, this implies **unidimensional sensitivity**. If $A \sim B$, then $B + \$1 \succ A$. The sweetener breaks the tie.
  *   **Incomparability ($A \perp B$):** The preference relation is undefined. You cannot say $A \succ B$, $B \succ A$, or $A \sim B$.

  Your argument assumes that incomparability acts like indifference regarding sweeteners (i.e., $A \perp B \implies B + \$1 \succ A$). But proponents of incommensurability (like Ruth Chang, Joseph Raz, or James Griffin) argue the **Small Improvement Argument**:

  If Career ($A$) and Family ($B$) are genuinely incomparable, adding \$1 to Family ($B+$) makes $B+$ better than $B$. But it does **not** necessarily make $B+$ better than Career. They might *remain* incomparable.

  If $A \perp B+$, then you are not rationally required to trade $A$ for $B+$. You can simply say, "I still can't compare these." If you aren't required to trade, the money pump cannot start. The cycle requires you to strictly prefer the sweetened option to the original; incomparability allows you to remain agnostic even after the sweetener.

  ### 2. The Dependence on Choice Rules
  Money pumps are **dynamic**. They don't happen in a static snapshot of preferences; they happen over a sequence of choices. To get pumped, you need a rule for how you choose when your preferences are silent.

  *   **The Vulnerable Rule:** "If $X$ and $Y$ are incomparable, choose the one that offers a monetary sweetener." (This leads to the pump).
  *   **The Shielded Rule:** "If $X$ and $Y$ are incomparable, stick with the status quo." (This blocks the pump).

  You argue that any agent that "doesn't want to get pumped" must force a scale. But an agent can avoid the pump simply by adopting a **Status Quo Bias** (or Endowment Effect) as a rational policy for handling incompleteness.

  If I have Career, and you offer Family + \$1, and I deem them incomparable, I stay with Career. If you then offer Career - \$1 vs Family, I deem them incomparable and stay with Career (minus the dollar, unfortunately, but I don't trade to Family). Wait, actually, if I have Career, and you offer Family + \$1, and I stay with Career, I pay nothing. If you then offer to trade Career for Family (no sweetener), I stay with Career.

  The pump only works if you assume the agent is *compelled* to maximize even when the maximand is undefined. If "rationality" permits a "no trade" default when preferences are incomplete, the pump is blocked without needing to complete the preference ordering. Gustafsson spends a lot of time trying to argue that Status Quo Bias is irrational, but that is a normative claim, not a logical necessity.

  ### 3. "Forcing a Scale" Might Be Conceptually Incoherent
  Your conclusion is that agents "eventually have to force everything onto one scale." This assumes that a single scale *exists* to be found.

  In many philosophical models of value (e.g., Value Pluralism), values are **heterogeneous**.
  *   **Example:** The value of a human life vs. the value of a pleasant afternoon.
  *   If you force these onto a single scale (say, "utilons"), you are claiming there is a fact of the matter about how many pleasant afternoons equal a life.
  *   Many argue this is a category error. It's not that the number is hidden; it's that the equation is meaningless.

  If you force a scale where none exists, you aren't becoming "more rational"; you are introducing **false precision**. An AI that forces all values onto a single scalar reward function might become extremely efficient, but it might also become a paperclip maximizer because it collapsed "human flourishing" and "paperclip production" into the same metric to avoid a money pump. Avoiding exploitation is good, but not if the cost is misrepresenting the structure of reality.

  ### 4. Imprecise Probabilities / Sets of Utilities
  There is a formal middle ground between "Complete Preferences" and "Money Pump Victim."

  Instead of a single utility function $U(x)$, an agent can have a **set** of utility functions $\{U_1, U_2, ...\}$.
  *   $A \succ B$ only if $U_i(A) > U_i(B)$ for *all* $U_i$ in the set.
  *   If some functions prefer $A$ and others prefer $B$, they are incomparable.

  This model (Imprecise Expected Utility) allows an agent to say "I will not pay to swap $A$ for $B$, nor $B$ for $A$." This creates a "zone of indecision." As long as the agent is allowed to refrain from trading within this zone, they are not money-pumpable, yet they have not collapsed their values onto a single scale. They have simply acknowledged that their value system is a vector, not a scalar.

  ### Summary: Where you talked yourself into a corner
  You are right that incompleteness *creates vulnerability* to money pumps **under standard assumptions of dynamic choice**. Gustafsson is right that this is a strong pressure toward completeness.

  But you are wrong that it is a **logical collapse**.
  1.  **Incomparability $\neq$ Indifference:** Sweeteners don't necessarily resolve incomparability.
  2.  **Choice Rules Matter:** A rational "Status Quo" policy blocks the pump without requiring completeness.
  3.  **Ontology of Value:** Forcing a single scale might be a category error (false precision) rather than a rational requirement.

  The "trenchcoat" isn't hiding intransitivity; it's hiding a different logical structure (partial ordering) that requires different norms of rationality to navigate safely. If you insist on the standard norms of dynamic choice (always trade if strictly better, no status quo bias), then yes, you must complete your preferences. But those norms are exactly what is up for debate when values are incommensurable.

  **Verdict:** Your intuition is the standard argument for **Expected Utility Theory**, but it fails against **Value Pluralism** and **Imprecise Probability** models, which are designed specifically to handle the "trenchcoat" without taking it off.
