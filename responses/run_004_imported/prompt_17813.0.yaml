answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophy of medicine professors, Alex and Sam, are grading papers. The conversation has drifted from their students' essays to a personal topic.*

  **Alex:** You're still thinking about your aunt, aren't you?

  **Sam:** It's hard not to. She got the call yesterday. HbA1c of 5.8%. She's "prediabetic." She feels fine. She eats fine. But now she's terrified she's dying, and her insurance premium might jump. I keep asking myself: Did she get sick yesterday? Or did a committee just move a line on a graph?

  **Alex:** She got a risk assessment, Sam. Not a death sentence. But look, I know where you're going. You think "prediabetes" is made up. But there is a biological reality there. Her insulin response is statistically deviating from the species-typical functional range for a human of her age. That's not a value judgment; that's a mechanical fact. Her engine is knocking.

  **Sam:** But whose engine? And what counts as "knocking"? This is the thing that keeps me up. You're acting like "disease" is a natural kind, like "gold" or "water." Like we can find it under a microscope. I'm saying "disease" is a judgment we *apply* to biology. It's a label that says, "This is bad, and we should fix it."

  **Alex:** That's the Normativist trap. If disease is just a judgment about what's "bad," then it's subjective. One culture says hearing voices is a spiritual gift; another says it's schizophrenia. Are you saying there's no biological difference between the two?

  **Sam:** I'm saying the biology is one thing, and the *disease label* is another. Take the classic case: Drapetomania. 1851. Samuel Cartwright. He diagnosed enslaved people who fled captivity with a mental illness. He had a theory, he had "symptoms," he had treatments (whipping, essentially). By your definition, if their brains were functioning in a way that caused "survival-threatening behavior" within their social environment, wasn't that a dysfunction?

  **Alex:** No. And this is where your side usually gets it wrong. Drapetomania wasn't a disease because it wasn't a *biological* dysfunction. The desire to escape captivity doesn't indicate a failure of the cognitive machinery. In fact, the cognitive machinery is working perfectly to detect threat and seek safety. Cartwright was wrong about the biology, not just the ethics. He claimed a mechanism existed that didn't.

  **Sam:** But how do you separate the biology from the ethics so cleanly? Cartwright defined the "proper function" of a slave as staying put. He defined the "proper function" of the body relative to a social hierarchy. You say, "No, the proper function is evolutionary survival." But that's still a choice of framework. Why is evolutionary survival the metric? If I have a genetic mutation that makes me sterile but brilliant, am I diseased?

  **Alex:** You're hitting on the Menopause problem.

  **Sam:** Exactly. Menopause. The reproductive system stops functioning. Completely. It's a universal loss of function. If disease is "loss of function," menopause is a disease. But we don't treat it like one. We call it "natural." Why?

  **Alex:** Because "natural" in medicine means "statistically typical for the reference class." Menopause is universal for women past a certain age. It is the *expected* functional trajectory of the female reproductive system. Prediabetes is not expected. It's a deviation from the norm that predicts future harm.

  **Sam:** But "harm" is the weasel word, Alex. Harm to what? To reproduction? My aunt isn't trying to reproduce. To longevity? Maybe. But if we lower the blood sugar cutoff enough, half the population is "diseased." At what point does "risk factor" become "disease"? That's not a biological question. That's a resource allocation question. That's about whether we want to medicate a population or change their diet.

  **Alex:** I disagree. The cutoff isn't arbitrary. It's based on the point where tissue damage becomes probabilistically significant. Retinopathy, neuropathy—those are objective biological failures. We draw the line at 5.7% or 6.0% because that's where the curve bends. It's like a bridge. If a bridge can hold 10 tons, and you put 11 on it, it's not a "value judgment" to say it's overloaded. It's physics.

  **Sam:** But who decided the bridge was supposed to hold 10 tons? If the bridge is only ever used by bicycles, does it matter? Look, if my aunt never develops full diabetes, never has symptoms, and dies of old age with a 5.9% sugar level... was she diseased for the last twenty years of her life?

  **Alex:** Yes. Asymptomatic hypertension is the same. You feel fine until you have a stroke. The disease is the underlying pathology, not the feeling of being sick.

  **Sam:** And there it is. You're defining disease as *Pathology*. I'm defining it as *Illness*.

  **Alex:** Go on.

  **Sam:** You're talking about a state of the organism. I'm talking about a status of the person. When we call something a disease, we grant the person certain rights. Sick leave. Sympathy. Exemption from responsibility. We also impose duties. Take your meds. Change your life. With your aunt, labeling her "prediabetic" changes her relationship with her own body. She goes from "healthy person with a number" to "patient in waiting."

  **Alex:** But if we don't label it, she doesn't get the intervention that prevents the stroke. The label saves lives.

  **Sam:** Or it creates anxiety and medicalizes normal variation. Remember the osteoporosis campaigns? They lowered the bone density threshold so millions of "healthy" women suddenly had a "disease" and needed expensive drugs. Was that biology? Or was it a market strategy dressed up as your "objective function"?

  **Alex:** It could be both. A market strategy can only work if there's a biological lever to pull. Look, Sam, I get the fear of over-medicalization. But if we go full Normativist, if we say disease is *only* a value judgment, then cancer is only a disease because we *value* life. If a society decided cancer was a holy transition, would it stop being a disease?

  **Sam:** It would stop being a *disease* in the social sense. It would still be cells dividing uncontrollably. That's the distinction I'm trying to make. There is the biological reality—the lesion, the virus, the hormone level. That's your territory. Then there is the classification of that reality as a "disease." That's my territory.

  **Alex:** So you're saying we agree on the facts, but fight over the word?

  **Sam:** Maybe. But words have teeth. If I call menopause a disease, I pathologize aging women. If I call drapetomania a disease, I justify slavery. If I call prediabetes a disease, I shift the burden of public health onto individual pill-taking. The "objective" definition you want... it feels safe. It feels like it protects medicine from politics. But it doesn't. It just hides the politics inside the word "function."

  **Alex:** I see your point on the social consequences. I do. But I worry that without an objective anchor, medicine collapses. If a patient comes in with a broken leg, I don't want to have a philosophical debate about whether "walking" is a valued social construct. I want to say, "The tibia is fractured. The function of weight-bearing is compromised. We fix it."

  **Sam:** I'm not saying we don't fix it. I'm saying we fix it because we value mobility, not because the universe demands it.

  **Alex:** But we value mobility *because* our bodies are built for it. The values track the biology, not the other way around.

  **Sam:** Usually. But not always. And the exceptions are where the harm happens. Like with my aunt. If her blood sugar is slightly high, but she's happy and active, and the treatment makes her miserable... is she healthier if she takes the drug?

  **Alex:** Biologically, yes.

  **Sam:** Humanly? I'm not sure.

  **Alex:** *[Pauses, stirs coffee]* Okay. Let's try this. Maybe the disagreement isn't about what disease *is*, but what the concept is *for*. I'm using "disease" to mean "a target for medical intervention." You're using it to mean "a legitimate claim on social resources and sympathy."

  **Sam:** That's closer. If "disease" means "biological target," then prediabetes is real. If "disease" means "sick role," then maybe it isn't. The problem is, in the clinic, those two get mashed together. The doctor says "You have a disease," and the patient hears "You are broken."

  **Alex:** And if the doctor says "You're fine, it's just a number," the patient hears "I'm not listening to your risk."

  **Sam:** Exactly. So maybe the solution isn't to solve the definition. Maybe it's to admit that "disease" is doing too much work. We need to separate the prognosis from the identity.

  **Alex:** I can agree to that. We can acknowledge the biological dysfunction—the "pathology"—without necessarily assigning the full social stigma of the "sickness." But I still need to be able to say that Cartwright was scientifically wrong, not just morally wrong.

  **Sam:** Deal. Cartwright was bad science *and* bad ethics. But you have to admit that the line between "treating a dysfunction" and "enforcing a norm" is thinner than you want it to be.

  **Alex:** And you have to admit that without the concept of biological dysfunction, we lose the ability to distinguish between a body that's failing and a body that's just different.

  **Sam:** *[Smiles]* So we're both unhappy, but for rigorous reasons?

  **Alex:** Sounds like philosophy.

  **Sam:** Sounds like medicine. I'll call my aunt. Tell her the number is real, but the label is optional.

  **Alex:** Tell her to eat her vegetables. That's objective advice, regardless of the definition.

  **Sam:** Finally, something we agree on.
