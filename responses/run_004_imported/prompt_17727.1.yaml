answer: |-
  This is a fantastic observation, and you are right to flag it. The excision of the ESP section from almost every anthology of "Computing Machinery and Intelligence" is a form of retrospective sanitization that obscures Turing's actual epistemic stance. He wasn't treating ESP as a mystical truth; he was treating it as a *confounding variable* in an experimental setup. To Turing, the Imitation Game was a measurement instrument, and if telepathy existed, it was noise in the channel that needed to be engineered out.

  To answer your core question: If Turing had lived to see Markwick (1978) and Bem (2011), would he have recanted?

  My read on Turing's intellectual character—specifically the Turing of *Banburismus* and the 1950 paper—is that he would have performed a massive negative update on the *existence* of psi based on Markwick, and a near-total collapse of credence based on the Bem saga, **but** he would not have adopted a dogmatic "impossible" stance. He would have shifted to a position of "vanishingly small prior, requiring massive likelihood ratios to move."

  Here is how I think Turing would have processed these developments, using his own epistemic tools.

  ### 1. The Markwick Revelation: Data Integrity as a Precondition
  You noted that Turing called the evidence for telepathy "overwhelming." In 1950, relying on Soal's published statistics, this was a defensible frequentist position. The p-values were tiny. But Turing's work at Bletchley Park wasn't just about calculating probabilities; it was about **signal integrity**.

  In *Banburismus*, Turing developed sequential analysis to weigh evidence for Enigma settings. A core tenet of that work was that the input data (the intercepts) had to be trusted. If the Germans changed their cipher procedures (a "key change"), you couldn't just apply old statistics; you had to detect the shift.

  Betty Markwick's 1978 analysis didn't just suggest Soal was wrong; it suggested the data generation process was corrupted (hits added post-hoc). For Turing, this is analogous to discovering that the intercepts you are running against the Bombe were tampered with by a double agent.
  *   **The Update:** He wouldn't just lower his credence; he would discard the dataset entirely. In his 1950 framework, the "overwhelming" evidence was the sole pillar supporting the non-zero prior. Remove Soal, and the prior collapses back to a baseline of "biological implausibility."
  *   **The Recantation:** He would likely have appended a note to the 1950 paper similar to a software patch: *Condition 7 (ESP) withdrawn due to data integrity failure in source S (Soal).*

  ### 2. The Bem Saga and the Replication Crisis: A Banburismus Analysis
  This is where it gets interesting. You asked for a deciban-style bookkeeping on Bem's 2011 "Feeling the Future." Turing wouldn't have been swayed by $p < 0.05$. He understood that $P(Data | H_0)$ is not $P(H_0 | Data)$. He would have resonated deeply with Wagenmakers' 2011 Bayesian reanalysis of Bem.

  Let's run the numbers as Turing might have, using **decibans** (where 1 ban = factor of 10 in odds, 1 deciban = 0.1 ban).

  **The Prior:**
  Post-Markwick, Turing's prior on Psi would be low. Let's be generous and say he retains a "Humean" openness.
  *   $Odds_{prior} = 1 : 1000$ (Psi is false).
  *   In decibans: $\log_{10}(1/1000) = -30$ decibans.

  **The Likelihood Ratio (Bem's Data):**
  Bem reported 9 experiments. Wagenmakers et al. calculated Bayes Factors (BF) for these.
  *   For most experiments, the BF favoring Psi ($H_1$) over Null ($H_0$) was weak, often between 1 and 3.
  *   Let's be incredibly charitable to Bem and assume an average BF of 3 per experiment.
  *   $\log_{10}(3) \approx 0.47$ bans $\approx 4.7$ decibans per experiment.
  *   If we treat them as independent (a big if), 9 experiments $\times$ 4.7 decibans $\approx$ +42 decibans.

  **The "Noise" Penalty (The Replication Crisis):**
  Here is where Turing's cryptanalytic instinct kicks in. In *Banburismus*, you don't just add up scores; you account for the "noise" of the channel. If the enemy is sending decoys, the score doesn't accumulate linearly.
  *   The failure to replicate (Galak et al., 2012; various registered replication reports) acts as negative evidence.
  *   More critically, Turing would spot the **p-hacking** (optional stopping, flexible analysis) as "enemy interference." It implies the data generation process is not stationary.
  *   Wagenmakers' analysis showed that when using a more realistic prior distribution for effect sizes (rather than Bem's optimistic one), the BF often favored the *Null*.
  *   If we apply a "complexity penalty" (Occam's razor) for the ad-hoc hypotheses required to explain why psi only works in certain labs or disappears under strict protocols, we incur a heavy deciban cost. Let's estimate a penalty of -50 decibans for methodological fragility and publication bias.

  **The Posterior:**
  *   Start: -30 decibans (Skeptical Prior)
  *   Bem Data: +42 decibans (Charitable Read)
  *   Methodological/Replication Penalty: -50 decibans
  *   **Net:** -38 decibans.

  **Result:** The odds shift from 1:1000 against to roughly 1:1500 against.
  Turing would conclude that Bem's data provided **no significant weight** to the hypothesis. In fact, the *instability* of the data (the replication crisis) would actively decrease the probability of the hypothesis being true, because a law of nature should not be sensitive to the experimenter's publication bias.

  ### 3. The "Telepathy-Proof Room" Revisited
  So, does he keep the "telepathy-proof room"?
  **Yes, but the label changes.**

  In 1950, Turing proposed the room to prevent a psychic human from cheating the test by reading the interrogator's mind. If he lived through the Markwick and Bem sagas, he would realize that "telepathy" was the wrong variable. The real variable is **Information Leakage**.

  Turing was obsessed with the flow of information (entropy, channel capacity). The lesson from the replication crisis (and the Soal fraud) is that information leaks in ways we don't anticipate (sensory cues, data dredging, experimenter effects).
  *   He would likely redefine the room not as a "telepathy-proof" shield, but as a **Zero-Knowledge Protocol**.
  *   The goal remains the same: ensure the interrogator's input and the contestant's output are coupled *only* through the defined text channel.
  *   He would argue that even if psi doesn't exist, the *possibility* of unmodeled information channels (like the subtle cues that allowed Clever Hans to do math) requires the isolation.

  ### 4. Why He Wouldn't Become a Dogmatic Skeptic
  You asked if there is a plausible version of him that keeps some credence. I think there is, but it's subtle.

  Turing was a morphologist. He was fascinated by how patterns emerge in nature (see his 1952 paper on chemical morphogenesis). He was interested in *anomalies* because anomalies often point to missing variables in the model, not necessarily magic.
  *   **The Yudkowsky Point:** You mentioned the "parapsychology is the control group for science" framing. Turing would agree. If your scientific method cannot definitively rule out psi after 70 years of trying, your method has a leak.
  *   **The Update:** He wouldn't say "Psi is impossible." He would say, "The hypothesis 'Psi exists' is currently less probable than the hypothesis 'Our experimental protocols are leaky'."
  *   He would maintain a non-zero prior because he understood that "impossible" is a claim about the map, not the territory. But he would demand a Likelihood Ratio of at least $10^6$ (60 decibans) to move that prior, given the history of fraud.

  ### Summary
  If Turing had seen the last 70 years:
  1.  **On Soal/Markwick:** He would have treated the fraud as a fatal compromise of the data source, retracting the "overwhelming" claim immediately.
  2.  **On Bem:** He would have run a Bayesian update similar to Wagenmakers', concluding that the evidence is statistically indistinguishable from noise plus publication bias. The deciban count would be negative.
  3.  **On the Imitation Game:** He would keep the "telepathy-proof room" concept but rebrand it as strict information-theoretic isolation to prevent *any* side-channel leakage, psychic or otherwise.

  He wouldn't have become a skeptic who says "It can't be." He would have become a skeptic who says, "The signal-to-noise ratio is insufficient to justify updating the model." That is a crucial distinction. It preserves the scientific openness he valued in 1950 while applying the rigorous error-checking he practiced at Bletchley. The tragedy is that we lost the one person who might have been able to formalize the "control group for science" argument with the mathematical weight it actually requires.
