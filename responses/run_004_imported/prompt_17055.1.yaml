answer: |-
  This is a fascinating exchange because both of your beta readers are clearly well-read, and they are arguing over a genuine tension in medieval political theology. Neither is inventing facts; they are prioritizing different texts and different philosophical principles within Aquinas's corpus.

  Here is a breakdown of their exchange, move by move, followed by the nuances both seem to be overlooking and some advice for your novel.

  ### Move-by-Move Analysis

  **Move 1: The Seminarian**
  *   **Argument:** Cites *Summa Theologiae* (II-II, Q. 42, Art. 2). Argues that resisting a tyrant is not sedition because a tyranny is not a true government (it seeks private good, not common good).
  *   **Verdict:** **The Seminarian wins this round.**
  *   **Why:** She is textually correct. In the *Summa*, Aquinas explicitly states that a tyrannical regime is not "just" and therefore disturbing it does not strictly carry the character of sedition (which is a sin against the unity of the multitude). He writes that the tyrant is the one guilty of sedition for fostering discord to maintain power. If your conspirators are quoting the *Summa*, they have a textual basis for saying the regime is illegitimate.

  **Move 2: The Lawyer**
  *   **Argument:** Concedes the *Summa* point but introduces *De Regno* (On Kingship, Book I, Ch. 6). Distinguishes between a usurper (tyrant by lack of title) and a legitimate ruler who becomes tyrannical (tyrant by exercise). Argues Aquinas warns against *private* individuals killing the latter, as it invites chaos.
  *   **Verdict:** **The Lawyer wins this round.**
  *   **Why:** This is the crucial distinction. In *De Regno*, Aquinas addresses the specific scenario of a prince who was legitimately installed but rules badly. He argues that while removal might be justified, it must not be undertaken by "private presumption." He fears that if any individual can decide a ruler is a tyrant and kill him, "often the wicked kill the good" under false pretenses. Since your novel involves a conspiracy (private individuals) against a prince (likely legitimate by birth/installation), the Lawyer has identified the specific prohibition that blocks the Seminarian's justification.

  **Move 3: The Seminarian**
  *   **Argument:** Claims the distinction between "usurper" and "legitimate ruler gone bad" is mere paperwork. The suffering is the same, so Aquinas wouldn't prioritize legitimacy of origin over welfare.
  *   **Verdict:** **The Lawyer wins this round.**
  *   **Why:** The Seminarian is applying a modern utilitarian framework (outcome = morality) to a medieval scholastic. For Aquinas, *ordo* (order) is an ontological good. A legitimate ruler who turns bad is still a part of the divine order of authority in a way a usurper is not. Removing him privately disrupts the metaphysical hierarchy, which risks spiritual and social chaos. Aquinas absolutely cares about "paperwork" (title/origin) because authority comes from God through specific channels; bypassing those channels is a sin, even if the outcome is materially better.

  **Move 4: The Lawyer**
  *   **Argument:** Reframes the issue not as welfare vs. paperwork, but as "who judges." Private judgment invites anarchy. This risk exists even if the abuse is real.
  *   **Verdict:** **The Lawyer wins this round (and the debate).**
  *   **Why:** This captures the core of Aquinas's political caution. Aquinas is not a pacifist regarding tyrants, but he is a proceduralist. He wants the *multitudo* (the community/public authority) or a *superior authority* (like an Emperor over a King, or the Pope) to act, not a cabal of nobles. The Lawyer correctly identifies that Aquinas's primary fear is the precedent of vigilante justice, which destabilizes the very concept of law.

  ### What Both Are Missing

  While the Lawyer wins on the specific question of *private assassination*, both readers are missing three crucial nuances that could enrich your novel.

  **1. The "Public Authority" Loophole**
  Aquinas does not say "do nothing." In *De Regno*, he suggests that if there is a superior authority (e.g., the Holy Roman Emperor has authority over a local King, or the Pope has authority over both), that superior can depose the tyrant. More radically, he implies that if the community has the *right* to elect the ruler, the community (acting as a public body, not a private mob) can depose him.
  *   **For the Novel:** If your conspirators can claim to represent the "Community" or "Estates of the Realm" rather than just themselves, they move closer to Aquinas's approval. If they are just a few disgruntled nobles, they are in the wrong.

  **2. The Authorship of *De Regno***
  *De Regno* is a tricky text. Book I is by Aquinas, but he died before finishing it. Book II was completed by his student, Ptolemy of Lucca. Ptolemy was much more republican and much more open to tyrannicide than his master. Medieval readers often read the text as a unified whole.
  *   **For the Novel:** Your conspirators could be conflating the two. They might cite *On Kingship* generally, relying on the more radical sections (potentially Ptolemy's) while ignoring Aquinas's specific cautions in Book I. This makes them plausible but perhaps slightly disingenuous scholars.

  **3. The John of Salisbury Alternative**
  If your conspirators want a theological cover for assassination, Aquinas is actually the *wrong* saint to cite. They should be citing John of Salisbury's *Policraticus* (1159). Salisbury explicitly argues that killing a tyrant is not only lawful but "right and just." He uses the metaphor of the tyrant as a disease that must be cut out. This was the standard text for tyrannicide for centuries.
  *   **For the Novel:** If your conspirators are using Aquinas, it suggests they are trying to sound moderate or orthodox. If they want to be true historical radicals, they should be quoting Salisbury. If they *must* use Aquinas, perhaps they are misinterpreting him willfully to soothe their consciences.

  ### Recommendation for the Manuscript

  The Lawyer is historically and theologically more accurate regarding the specific act of **private conspiracy**. Aquinas generally forbids private individuals from assassinating a legitimately titled ruler, even a bad one, due to the risk of anarchy and the sin of usurping judgment.

  However, for the sake of the novel, you have three options to resolve this:

  1.  **The Conspirators are Wrong (Tragic Irony):** Let the Seminarian be right in the text, but show that the conspirators are misusing Aquinas to salve their guilt. One of them could voice the Lawyer's objection in a moment of doubt, only to be overruled. This adds moral complexity.
  2.  **The "Public" Claim:** Have the conspirators argue that they are not acting privately, but as representatives of the "body politic." They aren't murdering a prince; they are the "hand of the community" amputating a diseased limb. This aligns better with Aquinas's "public authority" exception.
  3.  **Switch the Authority:** Have a character mention that Aquinas is too cautious, and produce a copy of John of Salisbury instead. This shows your research is deep and settles the argument: "Aquinas is for bishops; Salisbury is for liberators."

  **Summary:** The Lawyer has the stronger argument on Aquinas's specific prohibitions regarding private assassination. The Seminarian has the stronger argument on the general illegitimacy of tyranny. Your conspirators are trying to use the Seminarian's premise to justify the Lawyer's forbidden action. That tension is excellent drama; don't resolve it too cleanly. Let the ambiguity haunt them.
