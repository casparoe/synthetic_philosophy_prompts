prompt: |-
  My coworker and I are jointly given a $6,000 professional-development fund each year, and our manager leaves it up to the two of us to decide how to split it; the catch is that it can only be spent on training programs and doesn't roll over if unused. The program I want to take costs $4,500 for the full package, and there's nothing else I'd put any leftover money toward once that's covered. Her program costs $3,000 at most, so anything past that wouldn't get her anything more either. We can't agree on whether to just divide the $6,000 evenly, divide it in the same proportion as what our two programs cost, or do something else, since what we're each aiming for isn't the same size to begin with. What would actually count as a fair way to split it?
