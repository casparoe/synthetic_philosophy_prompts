      *   *The "No Free Lunch" Theorem for IRL:* This is the crucial piece of evidence. Armstrong & Mindermann (2018) showed that without strong priors on the planner (the mapping from reward to policy), *any* policy is consistent with *any* reward function.
      *   *Bounded Rationality vs. Systematic Bias:* IRL handles noise (random errors). It struggles with systematic cognitive biases (hyperbolic discounting, framing effects, preference construction) because these look like *different preferences* under a rationality model.
