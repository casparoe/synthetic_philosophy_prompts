  Each of these has been accused of merely pushing the problem back a step — of succumbing to a "revenge" liar, a new paradoxical sentence constructed using exactly the resources the theory itself introduces to solve the original one. Please rank the five theories from most to least successful at resisting revenge paradoxes. For each, briefly state what you take to be the strongest revenge construction against it and whether it actually succeeds. Give the ranking itself as a JSON object of the form:

  ```json
