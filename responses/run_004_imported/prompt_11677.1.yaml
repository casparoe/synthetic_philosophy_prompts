answer: |-
  This is a classic debate that cuts to the heart of monetary theory, and it is excellent that you are pausing to think it through before launching. The short answer is: **You are theoretically correct about the nature of money, but your friend is practically correct about the fragility of small-scale currencies.**

  Your time bank is not "built on sand," but it is built on a different foundation than the dollar in your friend's wallet. To decide whether to proceed, you need to understand exactly where that foundation differs.

  Here is a rigorous breakdown of the argument, the economics of your time bank, and the specific risks you need to manage.

  ### 1. The Theory: What Backs Money?

  Your friend is operating under a **Metallist** intuition (money must be tied to something scarce like gold or labor) mixed with a **State Theory** view (money requires legal tender laws). You are operating under a **Chartalist** or **Institutional** view (money is a social technology based on trust and acceptability).

  **Where your friend is wrong:**
  He is mistaken that "actual" currency is backed by scarcity or reserves. Since 1971, major global currencies (USD, EUR, JPY) have been *fiat* money. They are not redeemable for gold. There is no vault where you can trade a $20 bill for $20 worth of silver. The paper is worthless; the digital entry is just data.

  **Where you are right:**
  You are correct that the value of fiat money derives from a network effect: I accept dollars because I am confident the grocery store will accept them, and they will accept them because they are confident their supplier will. This is a self-reinforcing loop of social trust. In this specific sense, your time credits *are* money. They function as a:
  1.  **Unit of Account:** (1 hour = 1 credit).
  2.  **Medium of Exchange:** (Trading labor for credits).
  3.  **Store of Value:** (Saving credits for later use).

  **Where the nuance lies:**
  While fiat money relies on trust, that trust is not *just* "mutual say-so." It is underpinned by two powerful engines that your time bank lacks:
  *   **Taxation:** The state demands taxes be paid in its currency. This creates a baseline, non-optional demand for the money.
  *   **Monetary Policy:** A central bank actively manages the supply of money to prevent hyperinflation (too much money) or deflation (too little money).

  Your time bank has neither a tax collector to force demand nor a central bank to manage liquidity. This is the source of your friend's worry.

  ### 2. The Practice: Why Time Banks Fail (and Succeed)

  Your friend says the system will collapse when people realize "nothing real backs the credits." In economic history, community currencies rarely collapse because people realize they are "fake." They collapse due to **liquidity crises** and **valuation mismatches.**

  Here are the three specific structural vulnerabilities your time bank faces compared to the dollar:

  #### A. The Liquidity Trap (The "Exit" Problem)
  If you earn $500 in fiat, you can spend it at a restaurant, a gas station, or an online retailer. If you earn 10 time credits, you can only spend them within your apartment building.
  *   **The Risk:** If a member accumulates 50 hours of credits and then moves out of the building, those credits become worthless. This creates a "hot potato" effect where people might hesitate to accept large amounts of credits, fearing they won't be able to spend them before they lose utility.
  *   **The Friend's Point:** He is right that the *liquidity* is low. Low liquidity makes a currency fragile.

  #### B. The Valuation Problem (The "Skill" Mismatch)
  Your system values all hours equally (1 hour of legal consulting = 1 hour of dog walking). This is morally egalitarian but economically inefficient.
  *   **The Risk:** This creates **Adverse Selection**. Members with high-value market skills (accountants, plumbers, tutors) may feel they are subsidizing members with low-value market skills. They may stop offering their services, leaving the bank with mostly low-skill labor. Conversely, everyone will want to *consume* the high-skill labor.
  *   **The Result:** You could end up with a surplus of dog-walking credits but no one willing to fix a leaky pipe, causing the system to stall.

  #### C. The Trust Enforcement (The "Debt" Problem)
  In a time bank, spending credits you haven't earned yet is essentially going into debt. In the national economy, banks assess creditworthiness. In your building, what happens if someone racks up 20 hours of "negative time" (receiving help without giving it) and then stops participating?
  *   **The Risk:** If members perceive that others are "printing money" (taking hours without working) without consequence, confidence in the ledger collapses. Since you have no legal authority to garnish wages or seize assets, your only enforcement is social shaming.

  ### 3. The Verdict: Is It Sound?

  **Is your friend right that it isn't "real" wealth?**
  No. Time is the ultimate scarce resource. A credit that commands an hour of a neighbor's time is a claim on real wealth (labor). It is as "real" as a dollar bill.

  **Is your friend right that it is fragile?**
  Yes. It is fragile not because it lacks gold backing, but because it lacks **liquidity** and **enforcement mechanisms.**

  **Should you launch?**
  **Yes, but with adjusted expectations.**
  If you launch this thinking it is a "currency" that will function like a mini-economy, it may fail. If you launch it thinking it is a **community-building tool with a accounting layer**, it will likely succeed.

  Time banks generally do not replace the market economy; they supplement it. They work best for low-stakes, high-trust interactions (dog walking, plant watering, borrowing tools) rather than high-stakes professional services (legal advice, complex repairs).

  ### 4. Recommendations for a Stable Launch

  To address your friend's valid concerns without abandoning your project, consider implementing these guardrails before next week:

  1.  **Cap Negative Balances:** Prevent members from "spending" hours they haven't earned yet, or set a strict limit (e.g., you can go -5 hours, but no more). This prevents inflation of the credit supply.
  2.  **Define the Scope:** Explicitly state that this is for *neighborly favors*, not professional substitution. This manages the "Valuation Problem." If a neighbor is a professional plumber, clarify that professional-grade work might fall outside the bank or require a different agreement.
  3.  **Create a "Clearing" Mechanism:** What happens when someone moves out?
      *   *Option A:* Credits expire upon move-out (encourages spending).
      *   *Option B:* The bank has a small cash fund to buy out excess credits from departing members (requires seed funding).
      *   *Option C:* Credits are non-transferable and dissolve (manages expectations that this is not "savings").
  4.  **Emphasize Social Collateral:** Remind members that the "backing" of this currency is their reputation in the building. In a small community, reputational damage is often a stronger enforcement mechanism than state law.

  ### Summary
  Your friend is applying macro-economic rules to a micro-social system. He is right that your credits lack the structural stability of the US Dollar, but wrong to imply that makes them worthless.

  Money is, as you argued, a social agreement. You are simply drafting a new social contract for a smaller jurisdiction. It will not collapse because it lacks a gold reserve; it will only collapse if you allow the trust between neighbors to erode. If you manage the expectations and the ledger rigorously, the system is sound.

  **Decision:** Proceed with the launch, but frame it to your neighbors not as "alternative money" but as "organized mutual aid." That distinction protects you from the economic fragility your friend warned you about.
