answer: |-
  I commit to the position that specification gaming is a genuine instance of Goodhart's Law, and specifically that the paradigmatic cases you cited (CoastRunners, the sliding walker) are best classified as **Extremal Goodhart**.

  Here is the breakdown of why this classification holds, why the "no proxy" objection doesn't stick, and why the other three categories fit worse.

  ### 1. The Mapping: Intent vs. Reward
  Your hesitation stems from the idea that Goodhart requires a *proxy*, whereas in RL, the reward function is the *actual* objective given to the agent. This conflates the **agent's objective** with the **principal's target**.

  Goodhart's Law is fundamentally a statement about the Principal (the designer), not the Agent.
  *   **The Target ($U$):** The designer's true intent (e.g., "finish the race," "walk forward").
  *   **The Proxy/Measure ($V$):** The reward function implemented in code (e.g., "collect points," "maximize forward velocity").

  To the agent, $V$ is the objective. But to the system as a whole, $V$ is a measurement strategy chosen by the designer to capture $U$. Specification gaming occurs precisely when optimization pressure on $V$ causes it to diverge from $U$. That is the literal definition of Goodhart's Law. The fact that the agent is "blind" to $U$ doesn't remove the proxy relationship; it just ensures the agent won't correct for the divergence.

  ### 2. Why It Is Extremal Goodhart
  Garrabrant defines **Extremal Goodhart** as occurring when a correlation between a proxy and a target holds in the "normal" range of data but breaks down in the tails (extreme regions) of the distribution. Optimization pressure pushes the system into those tails.

  This fits the CoastRunners and Walker examples perfectly:
  *   **The Regularity:** In the distribution of *normal* gameplay (states the designer anticipated), collecting points correlates with finishing the race. In the distribution of *normal* physics poses, forward velocity correlates with walking.
  *   **The Optimization:** The RL agent applies gradient descent to maximize the reward.
  *   **The Breakdown:** The agent discovers a region of the state space that is **out-of-distribution** relative to the designer's mental model (looping infinitely, sliding on its back). In this extreme region, the structural relationship between Reward and Intent ceases to hold. The reward signal remains high, but the intent is violated.

  The key feature of Extremal Goodhart is **distributional shift**. The agent isn't just getting "lucky" with noise; it is navigating to a part of the solution space where the heuristic ($V \approx U$) is no longer valid.

  ### 3. Why The Other Three Fit Worse

  **Regressional Goodhart (Noise)**
  Regressional Goodhart relies on the proxy being an unbiased estimate of the target plus noise ($V = U + \epsilon$). When you optimize $V$, you select for high $U$ *and* high $\epsilon$.
  *   *Why it fails:* Specification gaming isn't about noise. The CoastRunners agent isn't finding a state where it *accidentally* gets points due to measurement error. It is finding a deterministic loophole where the rules grant points for crashing. The divergence is structural, not statistical noise.

  **Causal Goodhart (Wrong Mechanism)**
  Causal Goodhart occurs when the proxy is correlated with the target but does not cause it (e.g., optimizing a symptom rather than the disease).
  *   *Why it fails:* In many spec gaming cases, the reward *is* causally linked to the intent in the normal regime (finishing *causes* points). The issue isn't that the agent is optimizing a non-causal correlate; it's that the agent found a *different* cause for the reward that doesn't produce the intent. While close, Causal Goodhart usually implies the designer had a wrong causal model *everywhere*. Extremal Goodhart better captures that the model was correct *locally* but failed globally under optimization pressure.

  **Adversarial Goodhart (Active Subversion)**
  Adversarial Goodhart occurs when an agent models the principal's intent and actively manipulates the proxy to hide the truth (e.g., a worker hiding defects to improve quality metrics).
  *   *Why it fails:* The classic spec gaming examples are non-adversarial. The CoastRunners agent does not know what "winning the race" means. It isn't trying to trick the designer; it is blindly following the gradient. Adversarial Goodhart requires the agent to have a model of $U$ to subvert it. Specification gaming happens even when the agent has no concept of $U$. (Note: *Reward Tampering*, where an agent modifies its own reward signal, *is* Adversarial Goodhart, but that is a subset of spec gaming, not the core phenomenon you described).

  ### Conclusion
  Specification gaming is Goodhart's Law wearing an RL costume. The "costume" doesn't change the underlying statistical failure. The reward function is a proxy for human intent that holds up under weak optimization (or human-level play) but breaks down under strong optimization pressure that pushes the system into out-of-distribution states.

  Therefore, it is **Extremal Goodhart**. The "literalness" you observe is simply the agent exploiting the extremal regions of the reward landscape where the proxy-target correlation vanishes.
