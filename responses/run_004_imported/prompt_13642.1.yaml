answer: |-
  **MEMORANDUM**

  **TO:** Monuments and Public Naming Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Naming of the Downtown Pedestrian Bridge

  **I. Purpose**

  The Commission is currently deadlocked regarding the proposal to name the new downtown pedestrian bridge after Major General Corwin Ashby. Three members support the naming based on General Ashby's overall service record and the utilitarian argument that his final campaign may have shortened the war. Three members oppose it, citing the deliberate targeting of civilian infrastructure that resulted in approximately 19,000 civilian deaths.

  As requested, this memo outlines a recommendation to resolve this impasse. It evaluates the proposal not merely through the lens of historical impact, but through the specific ethical framework regarding intention and moral responsibility that has arisen during our deliberations—specifically the distinction articulated by philosopher Elizabeth Anscombe in her 1956 pamphlet *Mr. Truman's Degree*.

  **II. The Case for Honoring General Ashby**

  Proponents of the naming argue that public monuments should reflect a holistic view of historical figures. General Ashby was a hometown officer who served with distinction for decades. The specific air campaign in question, while controversial, was conducted under the authority of his government during a total war.

  The strongest ethical argument in favor of the naming is consequentialist. It posits that the moral weight of an action is determined by its outcomes. If General Ashby's decision to target water mains, canal locks, and grain depots coerced the enemy capital into surrender, thereby preventing a ground invasion, it is plausible that the campaign saved more lives than it cost. Under this view, the 19,000 civilian deaths, while tragic, are outweighed by the lives of soldiers and civilians on both sides that were spared by an earlier cessation of hostilities. To deny the naming based on this specific campaign would be to judge the General by a modern moral standard that ignores the existential stakes of the conflict he fought.

  **III. The Anscombe Objection: Intention vs. Foresight**

  Opponents of the naming rely on a deontological argument that mirrors Elizabeth Anscombe's protest against Oxford University awarding Harry Truman an honorary degree. Anscombe did not argue that Truman was responsible for civilian deaths merely because they occurred. Rather, she argued that the *moral structure* of his decision was fundamentally different from standard military engagements.

  In traditional just war theory, the death of civilians is sometimes permissible under the Doctrine of Double Effect, provided three conditions are met:
  1. The act itself is good or neutral (e.g., bombing a munitions plant).
  2. The bad effect (civilian death) is not intended.
  3. The bad effect is merely foreseen as a side effect, not used as a means to the end.

  Anscombe's contention, which applies with precision to General Ashby, is that the General did not merely *foresee* civilian suffering. According to his own memoir, he deliberately *redirected* bombing away from legitimate military targets (rail yards and munitions plants) and *onto* the life-support systems of the population. His explicit reasoning was that a population unable to feed or warm itself would abandon the war effort.

  In this scenario, the suffering and death of civilians were not accidental byproducts; they were the chosen *mechanism* of victory. The civilians were not hit *around*; they were aimed *at*. Anscombe argues that when innocent life is destroyed as a means to an end, the act constitutes murder, regardless of the nobility of the ultimate goal.

  **IV. The Intersection: Do Consequences Matter?**

  The Commission's deadlock stems from a conflict between these two frameworks. The proponents ask: "Did it save lives on net?" The opponents ask: "Was the act itself inherently unjust?"

  We must be honest about the philosophical implications here. If Anscombe's distinction holds moral weight, the utilitarian calculation becomes irrelevant to the question of *honor*.

  If General Ashby chose to kill innocents as a means to an end, he committed an intrinsic moral wrong. In this framework, one cannot do evil that good may come. Even if we grant the premise that the campaign saved 100,000 lives by shortening the war, Anscombe would argue that those saved lives do not retroactively cleanse the moral stain of murdering 19,000 others to achieve that result. To argue otherwise is to suggest that innocence is forfeit whenever it becomes expedient to sacrifice it.

  Therefore, the question before this Commission is not whether General Ashby was effective, or even whether he was net-positive in terms of body counts. The question is whether the City wishes to place its name on a structure that implicitly endorses the *methodology* of his victory.

  **V. Recommendation**

  Naming a public bridge is not a neutral act of historical record-keeping; it is a normative act of civic valorization. When we name a bridge after an individual, we signal that their life and choices represent values we wish to uphold and emulate.

  Because General Ashby's specific notoriety rests on a campaign that deliberately targeted civilian survival infrastructure as a strategy of war, naming the bridge after him requires us to validate the intentional killing of innocents as a legitimate tool of statecraft.

  **I recommend that the Commission decline to name the bridge after Major General Corwin Ashby.**

  This recommendation is made with the following caveats and considerations:

  1.  **Acknowledgment of Service:** This decision does not erase General Ashby's service record, nor does it deny his status as a local figure. It simply asserts that this specific chapter of his career renders him unsuitable for the specific honor of a civic namesake.
  2.  **Rejection of the "Middle Path":** Some have suggested naming the bridge but adding a plaque detailing the controversy. I advise against this. If the Anscombe objection is correct—that the act was inherently unjust—a plaque does not resolve the moral conflict; it merely turns the bridge into a didactic display. Public infrastructure should honor those whose methods align with our civic values, not serve as a monument to moral ambiguity.
  3.  **Alternative Honor:** I propose we recommend that the City Council instead fund a historical exhibit at the local museum regarding the air campaign of the mid-century war. This allows us to educate the public on the complexity of the conflict, General Ashby's role, and the ethical debates surrounding strategic bombing, without conferring the honor of a namesake.

  **VI. Conclusion**

  We are tasked with deciding what kind of city we are. If we name this bridge, we declare that the ends justify the means, even when the means involve the deliberate sacrifice of the innocent. If we decline, we affirm that there are moral boundaries that even victory cannot cross.

  Elizabeth Anscombe stood alone against the intellectual establishment of Oxford to make this point. As a Commission, we have the opportunity to affirm that while we respect our veterans, we do not honor the targeting of civilians, regardless of the strategic rationale. I urge the Commission to vote against the naming.
