      *   **Task:** Rank the strongest objections to REU theory (as a *normative* theory of rational choice) from most to least damaging.
      *   **Format:** JSON array with specific keys (`objection`, `rationale`).
      *   **Constraint:** The rationale must be 1-2 sentences.
