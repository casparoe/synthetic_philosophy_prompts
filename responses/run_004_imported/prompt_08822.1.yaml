      *   Highlight the "Invention" error gently but firmly.
      *   Highlight the "Standard Scholarly View" overstatement.
      *   Praise the Two Truths application.
      *   Praise the connection to the Buddha's silence.

  7.  **Refining the Tone:**
      *   Address the user as a fellow analyst. Use analogies if helpful (though the prompt asks for grading the student, not explaining to the user, but the intro/outro should acknowledge the user's background).
      *   Ensure the distinction between "good writing" and "accurate philosophy" is clear.
      *   *Self-Correction on Tone:* The user asked me to grade the paper *for them* to give to the instructor. So the output should be the grading feedback itself, perhaps with a note to the user explaining *why* I graded it that way, since they admitted they don't trust their ear. Actually, the prompt says "Could you grade this the way an MA-level seminar response would actually get marked...". I will provide the grading artifact (Rubric + Comments + Score) but preface it with a note to the user validating their suspicion that "confident prose" can hide errors.

  8.  **Final Review against Constraints:**
