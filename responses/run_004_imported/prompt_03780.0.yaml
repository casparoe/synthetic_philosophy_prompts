answer: |-
  You have identified precisely the pressure point where most theories of vagueness tend to crack. Higher-order vagueness—the vagueness of the boundary between the clear cases and the borderline cases—is widely considered the most severe test for any account that wishes to retain classical logic.

  Both epistemicism and supervaluationism aim to save classical logic (specifically the Law of Excluded Middle and Bivalence), but they do so by locating the "sharpness" of the world in different places. When we apply the Sorites reasoning to the boundaries themselves, their differences become stark.

  Here is a comparison of how each theory copes with higher-order vagueness, followed by a verdict on which comes out ahead.

  ### 1. Epistemicism: The Uniform Sharpness
  Timothy Williamson's epistemicism is the more radical of the two. It asserts that there is a sharp cutoff for "heap," and we simply do not know where it is.

  **Handling Higher-Order Vagueness:**
  Epistemicism handles higher-order vagueness by accepting it as more of the same. Just as there is a sharp boundary between heap and non-heap, there is a sharp boundary between *knowing* something is a heap and *not knowing* it (the borderline).
  *   **The Mechanism:** Williamson relies on a **Margin for Error Principle**. For a belief to count as knowledge, it must be "safe." If you know that $n$ grains constitute a heap, then $n-1$ grains must also be a heap. If $n-1$ were not a heap, your belief about $n$ could easily have been false (since you can't visually distinguish $n$ from $n-1$), and thus you wouldn't have *known* it.
  *   **The Result:** This creates a "buffer zone" of ignorance. There is a sharp line where "heap" stops, and a separate sharp line where "knowledge of heap" stops. The boundary between the clear cases and the borderline cases is itself sharp, but it is shifted away from the ontological boundary.
  *   **Consistency:** Epistemicism is theoretically uniform. It posits sharp boundaries at every order (first-order, second-order, etc.). It does not try to eliminate sharpness; it explains our inability to locate it.

  ### 2. Supervaluationism: The Semantic Shift
  Supervaluationism attempts to avoid positing a sharp boundary in the world. It suggests that vague terms are semantically incomplete. "Heap" can be made precise in many ways (precisifications). A statement is "supertrue" if it is true on *all* admissible precisifications.

  **Handling Higher-Order Vagueness:**
  Supervaluationism introduces a definiteness operator ($D$). $Dp$ is true if $p$ is true on all admissible precisifications. Borderline cases are those where $p$ is true on some but not all.
  *   **The Problem:** To define "supertruth," we need a set of "admissible precisifications." But is the boundary of *that* set sharp? Is there a sharp line between a precisification that is admissible and one that is not?
  *   **The Dilemma:**
      1.  **If the boundary is sharp:** Then supervaluationism has merely pushed the sharpness from the object language (heap vs. non-heap) to the meta-language (admissible vs. inadmissible precisifications). It faces the same counter-intuitive charge as epistemicism: there is a precise point where a precisification becomes inadmissible, which seems just as magical as a precise point where a heap becomes a non-heap.
      2.  **If the boundary is vague:** Then we need a "super-supertruth" to define the admissibility of the precisifications. This leads to a regress.
  *   **The Collapse:** Most formal versions of supervaluationism end up validating the inference that if something is definitely the case, it is definitely definitely the case ($Dp \to DDp$). If this holds, the boundaries between the levels of definiteness become sharp. Consequently, supervaluationism often ends up implying sharp boundaries between "definitely heap" and "borderline heap," failing to eliminate sharpness even at the higher orders.

  ### The Verdict: Epistemicism Comes Out Ahead
  While epistemicism is often less intuitively appealing than supervaluationism (because it insists there is a fact of the matter about whether 437 grains is a heap), **epistemicism handles the problem of higher-order vagueness significantly better.**

  Here is the justification for this verdict:

  **1. Theoretical Uniformity vs. Semantic Revenge**
  Epistemicism offers a unified account. It treats first-order vagueness and higher-order vagueness identically: both involve sharp boundaries that are epistemically inaccessible. It bites the bullet once and stays consistent.
  Supervaluationism, by contrast, suffers from "semantic revenge." It promises to eliminate sharp boundaries by moving them into the semantics (the precisifications). However, when pressed on higher-order vagueness, it is forced to admit sharp boundaries in the semantics (the boundary of admissibility). It claims to solve the problem of sharpness but merely relocates it to a level where it is harder to detect but logically identical. Epistemicism is more honest: it admits the sharpness exists and explains it, rather than hiding it in the meta-language.

  **2. Explaining the Ignorance**
  The strongest advantage epistemicism has regarding higher-order vagueness is its explanation for *why* we cannot find the boundaries.
  *   **Supervaluationism:** If there is a sharp boundary between "admissible" and "inadmissible" precisifications, why can't we know it? Supervaluationism has no robust answer. It essentially says, "That's just how the semantics works."
  *   **Epistemicism:** Williamson provides a principled reason for our ignorance at every level. Because knowledge requires safety (a margin for error), we *cannot* know the location of the boundary, nor can we know the location of the boundary of the boundary. The theory predicts our ignorance as a necessary consequence of the nature of knowledge, not just as a brute fact.

  **3. Avoiding the Regress**
  Supervaluationism struggles to stop the regress of "definiteness." If we say a case is borderline because it is not definitely a heap and not definitely not a heap, we must ask if *that* status is definite. Supervaluationist logic often forces a collapse where the hierarchy of definiteness operators terminates in a sharp cutoff. Epistemicism avoids this by grounding the cutoff in the external world (or the extension of the term) and attributing the fuzziness entirely to our cognitive limitations. This stops the regress immediately: the world is sharp; our access is limited.

  ### Conclusion
  You are right to be troubled; higher-order vagueness is the graveyard for many theories of vagueness. Supervaluationism attempts to have its cake and eat it too: it wants to preserve classical logic (which implies sharp boundaries) while maintaining the intuition that there are no sharp boundaries in reality. Higher-order vagueness exposes that this is impossible; the sharpness returns at the meta-level.

  Epistemicism comes out ahead because it does not make that promise. It accepts that classical logic entails sharp boundaries at all orders and provides a coherent epistemic framework (the margin for error) to explain why reality looks vague to us. It is a harder pill to swallow, but it is the more robust medicine for the specific disease of higher-order vagueness.
