answer: |-
  This is a great question, and the programming analogy is apt: in code, a `Promise` is just a placeholder for a future value; in ethics, a promise is a placeholder for a future *obligation*. The bug in your team's argument is assuming the "runtime environment" (social consequences) is the only thing that executes the code.

  Here is the direct comparison you're looking for, focusing on where the theories diverge on the *existence* of the obligation, not just the reasoning.

  ### The Core Architecture: System vs. Transaction

  To see where they disagree, you have to look at where they locate the "source code" of the obligation.

  *   **Hume (The Systemic View):** For Hume, a promise is a **social technology**. The words "I promise" have no magical moral power on their own. They only work because we live in a society that has agreed to a convention where saying those words creates an expectation *and* a penalty for breaking it. The obligation is **external**. You are obligated because breaking the promise damages the *institution* of promising, which everyone needs.
  *   **Scanlon (The Transactional View):** For Scanlon, a promise is a **specific interpersonal interaction**. He doesn't care about the "institution." He cares about *Principle F*: If you intentionally lead someone to expect you will do X, and you know they want that assurance, you are obligated. The obligation is **internal** to the relationship you just built. You are obligated because breaking the promise wrongs *that specific person*, regardless of what society thinks.

  ### The Stress Test: The "Perfect Secret" Deathbed Promise

  This is the case you remembered, and it is the classic "unit test" that breaks Hume's code but lets Scanlon's pass.

  **The Scenario:** You promise a dying friend to look after their cat. They die immediately. You are the only witness. You can rehome the cat (breaking the promise) with 100% certainty that no one will ever know, no one will lose trust in the institution of promising, and the friend is dead so they cannot feel "let down."

  #### 1. Hume's Glitch (The Utility Gap)
  Hume's theory struggles here. Since the obligation is based on the *utility of the convention*, we have to ask: **Does breaking this promise damage the convention?**

  *   **The Problem:** In this specific scenario, the answer is **no**. The secret is perfect. The social system suffers zero damage. No one else loses trust.
  *   **The Verdict:** A strict Humean has a hard time saying you are *morally* obligated. If the only reason promises bind us is to support a useful social practice, and this breach doesn't harm that practice, the obligation evaporates.
  *   **The Patch:** To survive this, Humeans usually have to pivot to **Rule Utilitarianism**. They argue: "You can't calculate utility case-by-case. You must follow the *rule* 'keep promises' because if everyone calculated utility like you, the system would collapse."
  *   **Does it survive?** Barely. It feels like a workaround. It implies you aren't actually obligated to *your friend*; you're obligated to *society*. If society isn't watching, the leash is loose.

  #### 2. Scanlon's Execution (The Principle Lock)
  Scanlon's theory handles this cleanly because he doesn't care about the social system.

  *   **The Logic:** When your friend was alive, you invoked Principle F. You knowingly gave them assurance. You created a specific moral reason for yourself to act.
  *   **The Verdict:** You are **obligated**. The fact that they are dead doesn't erase the reason you generated when they were alive. The wrong isn't "damaging society" or "hurting their feelings now"; the wrong is violating the principle of assurance that governed your interaction.
  *   **Does it survive?** Yes. Scanlon argues that moral reasons, once created, persist. You can't un-ring the bell of "I gave you my word."

  ### Where They Actually Disagree on the Obligation

  While both might tell you to "keep the promise" in the end, they disagree on **whether the obligation exists in a vacuum.**

  **Case: The "State of Nature" Promise**
  Imagine you promise something to a stranger in a situation where there is no pre-existing social convention of promising (e.g., two people from cultures that don't have "promising," or a hypothetical state of nature).

  *   **Hume says: No Obligation.** Without the background convention, the words are just noise. You cannot create an obligation out of thin air. There is no "social technology" to back up the code.
  *   **Scanlon says: Obligation Exists.** If you intentionally create an expectation and offer assurance, Principle F kicks in immediately. You don't need a social contract; you just need two rational agents.

  **This is the critical divergence:**
  *   For **Hume**, the obligation is **contingent**. It depends on the external environment (society) functioning.
  *   For **Scanlon**, the obligation is **intrinsic**. It depends only on the interaction between the two agents.

  ### Summary for Your Team Argument

  If you want to win the argument about whether it's "fine" to break a secret promise:

  1.  **If your team are Humeans:** They have to admit that if the breach is *truly* undetectable and has *zero* impact on trust, the obligation is philosophically shaky. They are relying on the idea that "rules are rules," not that the specific act is wrong.
  2.  **If your team are Scanlonians:** They have to admit the obligation holds even if God himself wouldn't know you broke it. The wrong is done the moment you decide to violate the assurance you gave, regardless of the outcome.

  **The "Promise<T>" Analogy:**
  *   **Hume:** A `Promise` is only valid if the `EventLoop` (Society) is running. If the loop stops, the promise resolves to `undefined`.
  *   **Scanlon:** A `Promise` is a binding contract between the caller and the function. Even if the program crashes (death), the logic of the promise remains valid in the stack trace.

  **Winner?** Scanlon survives the deathbed case better. Hume requires a "faith patch" (follow the rule even when it doesn't help) to get the same result. In the secret deathbed case, Hume's theory suggests the obligation is an illusion maintained by habit, whereas Scanlon's suggests the obligation is a real moral object created by your will.
