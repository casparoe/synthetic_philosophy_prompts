      *   **Technical Distinction:** Clarify the domain difference (Choice Functions vs. Welfare Functions).
      *   **The "Secret Extra Work":** This is the meat of the answer.
          *   *Informational Richness:* Arrow's IIA is an *informational constraint*. It says the SWF is blind to anything other than ordinal pairwise data. Individual WARP is a *consistency constraint* on behavior.
          *   *Aggregation Specifics:* Arrow's IIA rules out interpersonal comparisons of intensity and "compromise" candidates. It forces the social choice to be locally determined.
          *   *The "Decoy" connection:* The decoy effect is a violation of individual IIA. Arrow *imposes* IIA. So Arrow is demanding rationality from the *collective* even if individuals might not be perfectly rational (though Arrow assumes individual rationality).
      *   **Defensibility:**
          *   *Pro:* Prevents manipulation (agenda setting), ensures stability, aligns with liberal individualism (social choice shouldn't depend on irrelevant personal tastes).
          *   *Con:* Too strong. Rules out reasonable voting methods (Borda, Ranked Choice often violates in practice depending on formulation). Ignores intensity. Makes the "Condorcet" cycles hard to resolve without a dictator.
      *   **Conclusion:** The intuition is right, but the *consequences* are heavier in the social context because it restricts the *mechanism* of aggregation, not just the output consistency.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check the WARP vs. IIA mapping.* WARP is about choices from subsets. Arrow's IIA is about the social ordering given a profile.
      *   *Sen's Contribution:* Amartya Sen famously analyzed this. He distinguished between "independence of irrelevant alternatives" (Arrow) and "independence of infeasible alternatives" (Choice theory). In Arrow, $z$ is feasible, we just don't care about preferences over $z$. In choice theory, $z$ is often removed from the menu.
      *   *Correction:* Actually, in Social Choice, we often talk about Choice Functions too (Social Choice Functions). But Arrow's theorem is about Social Welfare Functions (orderings). I need to be precise. Arrow's IIA says $F(\succ_1, \dots, \succ_n)|_{\{x,y\}}$ depends only on $(\succ_1|_{\{x,y\}}, \dots, \succ_n|_{\{x,y\}})$.
      *   *Key Insight:* The "extra work" is that Arrow's IIA prohibits the *aggregator* from looking at the context provided by $z$ to interpret the $x/y$ split. For example, if $z$ is a extremist option, maybe $x$ is a moderate compromise. Arrow says you can't use that info.

  6.  **Final Polish:**
