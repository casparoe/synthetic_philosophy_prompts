answer: |-
  You are right to trust your intuition, but you are also right to be suspicious. The DNA is identical, but the expression of the gene changes significantly once you move from a single brain to an aggregation rule.

  Here is the proper comparison, the "extra work" Arrow's condition is doing, and what that implies for its defensibility.

  ### 1. The Intuition: Same Family, Different Species
  Your seminar pitch is pedagogically sound. Both concepts rely on the **binary consistency** intuition: *If I prefer $x$ to $y$, the presence or properties of $z$ shouldn't flip that preference.*

  *   **Individual Rationality (WARP/Menu Independence):** If an agent chooses $x$ when $\{x, y\}$ is available, they shouldn't choose $y$ when $\{x, y, z\}$ is available (unless they choose $z$). The addition of an option shouldn't reverse the revealed preference between existing options.
  *   **Arrow's IIA:** If society ranks $x$ above $y$ given a profile of preferences, changing how individuals feel about $z$ (while keeping their $x$ vs. $y$ feelings constant) shouldn't flip the social ranking of $x$ vs. $y$.

  In both cases, the core idea is **separability**: the decision between two options should be isolated from the context of other options.

  ### 2. The Technical Difference: Consistency vs. Information
  Here is where the "extra work" sneaks in. While the intuition is the same, the mathematical object being constrained is different.

  **Individual Choice (WARP):**
  This is a **consistency constraint on outcomes**. It says: "Your observed choices must be rationalizable by a stable preference ordering." It allows the *process* of decision-making to be messy, provided the *result* looks like it came from a stable ordering. It does not explicitly forbid the agent from looking at $z$ to decide between $x$ and $y$ (e.g., " $z$ is too expensive, so I'll buy $x$ instead of $y$"), provided the final choice doesn't contradict previous choices.

  **Arrow's IIA:**
  This is an **informational constraint on the aggregation function**. It doesn't just say the social ordering must be consistent; it says the Social Welfare Function (SWF) is **blind** to certain information.
  *   Arrow's IIA mandates that the social ranking of $\{x, y\}$ is a function *only* of the individual rankings of $\{x, y\}$.
  *   It explicitly forbids the SWF from looking at how individuals rank $z$ to help decide between $x$ and $y$.

  **The "Extra Work": Pairwise Separability**
  In individual choice, WARP is a necessary condition for transitivity, but it doesn't force the agent to make decisions pairwise. An agent can evaluate the whole menu at once.
  Arrow's IIA forces the SWF to be **pairwise separable**. It requires that society's preference between $x$ and $y$ be determined *independently* of the preference between $y$ and $z$.

  This is much stronger. It rules out any aggregation mechanism that uses the "context" of the third option to interpret the intensity or compromise value of the first two.

  ### 3. Example: Where the Difference Matters
  Consider the **Borda Count**, which violates Arrow's IIA but satisfies individual rationality.
  *   **Profile 1:** 50% vote $x \succ y \succ z$, 50% vote $y \succ z \succ x$.
      *   Borda scores: $x=1, y=1.5, z=0.5$. Society picks $y$.
  *   **Profile 2:** Everyone keeps $x$ vs. $y$ exactly the same. But now everyone hates $z$ less. 50% vote $x \succ z \succ y$, 50% vote $z \succ y \succ x$.
      *   Wait, I need to keep $x$ vs $y$ fixed.
      *   Let's try: Profile A: $x \succ y \succ z$ vs $y \succ z \succ x$. ($y$ wins Borda).
      *   Profile B: $x \succ y \succ z$ vs $y \succ x \succ z$. (Wait, that changes $x$ vs $y$).
      *   *Correct Violation:*
          *   Scenario 1: 2 voters. $1: x \succ y \succ z$, $2: y \succ z \succ x$.
              *   Borda: $x(2+0)=2, y(1+2)=3, z(0+1)=1$. Winner $y$.
          *   Scenario 2: $1: x \succ y \succ z$, $2: z \succ y \succ x$. (Note: Voter 2 still prefers $y \succ x$).
              *   Borda: $x(2+0)=2, y(1+1)=2, z(0+2)=2$. Tie.
          *   Scenario 3: $1: x \succ y \succ z$, $2: y \succ x \succ z$. (Wait, I must keep $x$ vs $y$ fixed).
      *   *Let's stick to the conceptual point:* In Borda, the position of $z$ affects the point totals of $x$ and $y$. Even if no one changes their mind about $x$ vs. $y$, moving $z$ around changes the point gap between $x$ and $y$.
      *   **Arrow's IIA says:** This is illegal. If no one changed their mind about $x$ vs. $y$, the social ranking of $x$ vs. $y$ cannot change, regardless of where $z$ went.

  **Why is this "Extra Work"?**
  Because it prevents $z$ from acting as a **proxy for intensity** or a **compromise buffer**.
  If everyone agrees $z$ is the worst possible option, that might signal a high consensus environment. If $z$ is polarizing, it signals conflict. Arrow's IIA forces the SWF to ignore this contextual data. It treats a 51-49 split on $x$ vs. $y$ exactly the same whether the voters are passionate or indifferent about $z$.

  ### 4. Defensibility: Does the Extra Bit Help or Hurt?
  This is the crux for your students. Does this extra restriction make IIA more or less defensible?

  **Argument for "More Defensible" (Stability & Strategy):**
  *   **Agenda Manipulation:** If the social choice between $x$ and $y$ depends on $z$, a chairperson can manipulate the outcome by introducing a "decoy" $z$ (the exact decoy effect you mentioned). Arrow's IIA immunizes the voting rule against this specific form of strategic agenda setting.
  *   **Liberal Individualism:** It respects the idea that social preferences should supervene on individual preferences. If the only thing that changed was how people feel about $z$, why should the social contract between $x$ and $y$ change? It isolates the social decision to the relevant conflict.

  **Argument for "Less Defensible" (Information Loss):**
  *   **Intensity Ignorance:** As Sen and others pointed out, Arrow's IIA strips the SWF of all cardinal or intensity information. If 99% of people slightly prefer $x$ to $y$, and 1% intensely prefer $y$ to $x$, Arrow's IIA treats this the same as a 51-49 split, provided the ordinal ranking is the same. It prevents the system from finding compromises.
  *   **The Impossibility Driver:** This "extra work" is precisely what breaks the system. By forcing pairwise separability, Arrow's IIA prevents the SWF from using the structure of preferences over $z$ to resolve Condorcet cycles between $x, y, z$. It starves the aggregator of the information needed to produce a transitive social ordering without being a dictatorship.

  ### 5. Summary for the Seminar
  You can tell your students:
  1.  **Yes, the intuition is the same:** It's about binary consistency and menu independence.
  2.  **But the constraint is stricter:** Individual WARP constrains the *output* of a choice function to be rational. Arrow's IIA constrains the *input processing* of the aggregation rule. It forbids the rule from looking at irrelevant columns in the preference profile.
  3.  **The Cost:** This extra restriction makes Arrow's IIA **less defensible** as a requirement for a *good* voting system (because it rules out reasonable methods like Borda that account for consensus/intensity), but **more defensible** as a requirement for a *manipulation-proof* system.
  4.  **The Verdict:** Arrow's IIA is essentially "WARP on steroids." It demands not just that society acts rationally, but that it acts rationally *without using all the available information*. That informational austerity is what makes the Impossibility Theorem possible.

  **One-liner for the board:** "Individual IIA says your choices must be consistent. Arrow's IIA says the voting rule must be blind."
