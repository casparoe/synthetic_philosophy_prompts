      *   Make sure to mention *why* it leads to impossibility (it starves the SWF of information needed to resolve cycles).

  7.  (Final check of the prompt requirements): "Compare the two properly", "Is Arrow's IIA just ordinary menu independence...", "Does that extra bit make IIA more or less defensible".

      *   *Plan:*
