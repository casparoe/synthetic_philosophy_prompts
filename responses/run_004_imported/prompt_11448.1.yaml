      *Refining the "Extra Work":* In individual choice, IIA/WARP ensures *transitivity* of revealed preference. In Arrow, we *assume* individual transitivity. Arrow's IIA ensures the *aggregation rule* doesn't introduce external dependencies. It restricts the *function*, not just the output. It says "You are not allowed to look at column Z to decide column X vs Y." That's a restriction on the *process*, whereas WARP is a restriction on the *result*. This is a vital distinction.

