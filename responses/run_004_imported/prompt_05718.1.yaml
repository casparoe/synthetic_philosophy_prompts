answer: |-
  This is a remarkably precise reconstruction of the debate. You and your friend have indeed stumbled directly into the distinction between **finkish dispositions** (where the stimulus causes the disposition to vanish) and **masked dispositions** (where the disposition remains but is prevented from manifesting). Your friend is arguing for a finkish interpretation of Tom's courage; you are arguing for a masked one.

  Here is the verdict on Tom, a new example designed to sharpen the distinction, and a brief note on the implications for Aristotelian virtue.

  ### 1. The Verdict on Tom

  Based strictly on the facts provided, Tom's case is **underdetermined**.

  Your friend claims Tom is a **Fink**: the stimulus (extreme, life-threatening danger) triggers a causal process (sheer fear) that removes the intrinsic basis of the disposition (courage) *before* the manifestation (bold action) can occur. In Martin's terms, the "wire" goes dead the moment it is touched.

  You claim Tom is a **Mask**: the stimulus triggers fear, but the intrinsic basis (courage) remains intact. The fear acts as an interfering factor (like the packing around the glass) that prevents the manifestation without destroying the disposition itself.

  **Why it is underdetermined:**
  We cannot distinguish these two cases merely by observing that Tom *fails* to act in the extreme scenario. Both the Fink and the Mask result in the same outcome: no bold action. To settle the debate, we need access to Tom's **psychological state at the exact moment of failure.**

  **The Settling Fact:**
  The matter would be settled by determining whether Tom's **evaluative judgment** persists during the fear response.
  *   **If it is a Mask (You are right):** Tom, while frozen by fear, still *judges* that he ought to act and *wants* to act, but finds himself unable to initiate the movement. The fear overrides the *executive* function, not the *volitional* state. He experiences this as frustration or regret in the moment (or immediately after).
  *   **If it is a Fink (Your friend is right):** Tom, upon facing the extreme danger, undergoes a shift in valuation. He no longer *judges* that acting is the right thing to do, or his desire to preserve himself instantly extinguishes the desire to help. The courage doesn't just fail to fire; it ceases to exist. He experiences this as relief or a rationalization ("It would be suicide to go in there").

  Without knowing whether the intention to act survives the onset of fear, we cannot know if the disposition was masked or finked.

  ### 2. A New Example: The Two Whistleblowers

  To prevent talking past one another, we need a case where the internal mechanism is stipulated clearly, removing the ambiguity of "reputation." Consider two employees, **Alice** and **Barbara**, both known for the character trait of **Integrity** (specifically, a disposition to report unethical conduct).

  **The Scenario:**
  Both Alice and Barbara discover their company is dumping toxic waste. Both intend to report it. However, before they can do so, the CEO calls them into his office, locks the door, and explicitly threatens to ruin their careers and harm their families if they speak. Under this pressure, neither woman reports the crime.

  **The Divergence:**

  *   **Alice (The Fink):** Alice has a "conditional integrity." The moment the threat is uttered (the stimulus), a psychological defense mechanism triggers. She instantly re-evaluates the situation, convincing herself that the waste isn't *that* dangerous and that loyalty to the company is more important. The threat causes her integrity to **evaporate**. By the time she leaves the office, she genuinely believes staying silent is the right choice. She does not feel guilt; she feels relieved.
      *   *Diagnosis:* Her integrity was finkish. The stimulus removed the disposition.

  *   **Barbara (The Mask):** Barbara has "absolute integrity." The moment the threat is uttered, she remains fully convinced that she ought to report the crime and retains the desire to do so. However, the threat induces a state of paralyzing terror (or she is physically confined). Her integrity remains **intact**, but the fear (or confinement) acts as a **mask**, blocking the manifestation of the trait. She leaves the office weeping, intending to report it as soon as the threat is lifted, hating herself for her silence.
      *   *Diagnosis:* Her integrity was masked. The disposition persisted but was prevented from manifesting.

  **Why this settles the argument:**
  In the car, you and your friend could argue endlessly about whether Tom "really" had courage. In this case, we stipulate the internal psychology. Alice is not courageous in the extreme case because she ceases to be the kind of person who values truth over safety. Barbara *is* courageous (she retains the valuation), but she is prevented from acting. If your friend's theory of Tom is correct, Tom is Alice. If your theory is correct, Tom is Barbara.

  ### 3. Implications for Aristotelian Virtue

  Do these cases give us reason to doubt that virtues can be given a conditional analysis? **Yes, decisively.**

  The Simple Conditional Analysis (SCA) states: *S is disposed to M in C if and only if, if C were the case, S would M.*
  *   **The Mask Problem:** Barbara has the virtue (Integrity), C occurs (Threat), but she does not M (Report). SCA falsely says she lacks the virtue.
  *   **The Fink Problem:** Alice lacks the virtue in the extreme case, but if we test her only in moderate cases, she passes. SCA struggles to capture the *stability* required of the disposition across changing contexts.

  For the Aristotelian, this is particularly damaging because virtue (*aretē*) is defined as a **stable hexis** (settled state).
  1.  **Finkish Virtues are Counterfeit:** Aristotle would likely argue that Alice never possessed full virtue to begin with. Her "integrity" was merely a natural temperament dependent on safety. A true Aristotelian virtue cannot be finkish; if the disposition vanishes when tested, it wasn't a *hexis*, it was a fleeting passion.
  2.  **Masked Virtues are Real:** Barbara retains her virtue even when masked. This implies that virtue cannot be analyzed simply as "doing the right thing when the situation arises." It must be analyzed as **possessing the correct internal causal basis** (the reasoning, the desire, the choice), regardless of whether external or internal interferers block the action.

  Therefore, cases like Tom's, Alice's, and Barbara's demonstrate that a conditional analysis of virtue is insufficient. We cannot define courage merely as "acting boldly when dangerous." We must define it by the **persistence of the motivational state** underlying the action. If the analysis ignores the intrinsic basis (the character) and looks only at the extrinsic manifestation (the behavior), it will inevitably misclassify masks as failures and finks as successes (until they aren't).
