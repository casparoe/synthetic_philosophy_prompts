      *   **Key Condition:** The information must be *costless* (in terms of utility/resources/time).
      *   **Implication:** If information costs *anything*, the theorem does not apply directly. You must weigh the Expected Value of Sample Information (EVSI) against the Cost of Sample Information (CSI).
