answer: |-
  It is a pleasure to correspond with someone who has navigated the transition from the concrete constraints of the wet lab to the abstract constraints of the philosophy of science. Your recollection of that long-standing debate with your postdoc is a perfect case study for the application of decision theory to scientific practice.

  However, I must gently suggest that your reading of I. J. Good's 1967 theorem, while mathematically sound in the abstract, contains a specific interpretative vulnerability when applied to the physical world of experimental biology. In fact, when the theorem is applied correctly to your specific context, it vindicates *your* intuition far more than it does your postdoc's.

  Here is why the "Good's Theorem" argument for infinite data collection collapses under the weight of real-world constraints, and what a disciplined stopping rule actually looks like.

  ### 1. The "Costless" Clause
  The core of Good's result (often summarized as "the expected value of free information is non-negative") rests on a critical, often elided premise: the information must be **costless**.

  Good proved that for a Bayesian agent, the expected utility of making a decision *after* observing a new piece of evidence $E$ is at least as high as the expected utility of making the decision *without* $E$, provided that observing $E$ costs nothing.

  In your longitudinal animal studies, data was never costless. It cost:
  *   **Financial capital:** Grants are finite.
  *   **Temporal capital:** Your time and your team's time are finite.
  *   **Biological capital:** The lives and welfare of the animals (an ethical cost).
  *   **Opportunity cost:** Every month spent on Cohort $N+1$ was a month not spent on a different, potentially more fruitful hypothesis.

  Once you introduce a cost function $C(E)$ for obtaining evidence, Good's inequality changes. The rational agent should only seek further evidence if:

  $$ \text{Expected Value of Sample Information (EVSI)} > \text{Cost of Sample Information (CSI)} $$

  Your postdoc was arguing for the maximization of *epistemic utility* (certainty/truth) without regard for *economic utility* (resource allocation). A rational laboratory, however, is not a truth-maximizing machine; it is a utility-maximizing organism operating under scarcity.

  ### 2. Diminishing Marginal Returns
  You mentioned worrying about "diminishing returns." This is not just a heuristic; it is a mathematical feature of Bayesian updating.

  As you collect more data, your posterior distribution narrows. The first ten animals might reduce your uncertainty (variance) by 50%. The next ten might reduce it by 10%. The next hundred might reduce it by 1%.

  Because the reduction in uncertainty follows a curve of diminishing returns, while the cost of data collection in longitudinal studies is typically linear (or even exponential, if attrition rates rise), there is inevitably a crossover point.

  If you plot the Marginal Benefit of Information (MBI) against the Marginal Cost of Information (MCI), the rational stopping rule is the intersection point. To continue past this point is not "rigour"; it is, in decision-theoretic terms, **irrational waste**. It actively lowers the expected utility of the laboratory's total output by consuming resources that could have generated more utility elsewhere.

  ### 3. The Ethical Dimension (The 3 Rs)
  In experimental biology, there is a moral constraint that pure decision theory sometimes overlooks but should not: the principle of Reduction (part of the 3 Rs: Replacement, Reduction, Refinement).

  If Good's theorem were applied without cost constraints, it would imply that we should never stop experimenting on animals until absolute certainty is reached. This is ethically indefensible. If the data already gathered is sufficient to make a decision with an acceptable level of risk (e.g., "this drug is safe enough to proceed to Phase I" or "this hypothesis is unsupported"), collecting further data violates the ethical contract of animal research.

  Therefore, a "Good-respecting" stopping rule in biology must include an ethical cost term that approaches infinity as the necessity of the data approaches zero.

  ### 4. What Does a Disciplined Stopping Rule Look Like?
  So, what would a stopping rule look like for a laboratory that takes decision theory seriously? It would not be a fixed $N$ (as in traditional frequentist power analysis), nor would it be "whenever we feel like it." It would be a **Sequential Decision Policy**.

  1.  **Define the Decision:** Before starting, define what decision the data will inform. (e.g., "Abandon the compound" vs. "Advance to toxicology.")
  2.  **Define the Payoff:** Assign a utility value to the correct decision and a cost to the incorrect one. (False positives might cost millions in failed trials; false negatives might cost a potential cure.)
  3.  **Monitor the Posterior:** As data comes in, update the probability of the hypothesis.
  4.  **Calculate EVSI:** At each interim analysis, ask: "If I collect one more cohort, how much will this change my probability of making the *wrong* decision?"
  5.  **Stop when:** The cost of the next cohort exceeds the expected reduction in loss from avoiding a wrong decision.

  In practice, this looks like **Bayesian Sequential Analysis**. You set boundaries not for $p$-values, but for posterior probabilities. If $P(H|Data) > 0.95$, stop and accept. If $P(H|Data) < 0.05$, stop and reject. If in between, collect more data *only if* the budget allows and the expected reduction in uncertainty justifies the spend.

  ### 5. Reconciling the Debate
  Your postdoc sent you Good's paper thinking it was a checkmate. He viewed the laboratory as a disembodied mind seeking Truth. You viewed the laboratory as a situated institution seeking viable knowledge under constraints.

  Good's theorem does not mandate infinite data collection; it mandates that you never ignore *free* information. But since information in the lab is never free, the theorem actually supports your position: **You were implicitly calculating the cost of information.**

  Your "failure of nerve" was actually **bounded rationality**. You recognized that the marginal utility of the next cohort was lower than the marginal cost of funding it. Your postdoc's desire for "one more round" was a form of *epistemic greed*—valuing certainty above the resources required to purchase it.

  ### Conclusion
  A disciplined, Good's-theorem-respecting programme stops gathering evidence the moment the cost of the next measurement exceeds the expected improvement in decision quality that the measurement would provide.

  In your four decades at the bench, you were not failing to be a perfect Bayesian; you were succeeding as a rational manager of scientific resources. The postdoc's argument holds only in the Platonic realm of costless observation. In the messy reality of longitudinal animal studies, your instinct to stop was the one that respected the true utility function of science: the maximization of knowledge *per unit of resource consumed*.

  Perhaps the philosophical lesson here is that Good's theorem is not an argument for infinite data, but an argument for explicitly pricing the cost of curiosity.
