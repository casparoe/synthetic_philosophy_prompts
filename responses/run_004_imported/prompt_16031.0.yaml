answer: |-
  Friends, family, colleagues. Thank you for being here to welcome Leo.

  For three weeks, I have held my grandson, and like any grandparent, I have felt a love that is startling in its intensity. But those of you who know my work also know that I view the occasion of a birth differently than most. I stand before you as a grandfather who loves this child deeply, and as a philosopher who believes that coming into existence is always a serious matter—specifically, that it is an entry into vulnerability.

  I will not say the things convention is expected to demand. I will not say that Leo was "meant to be," or that the world is a richer place because he exists, or that he is lucky to be here. To say these things would be to misunderstand the nature of existence. Non-existence is not a state of deprivation; it is a state of safety from harm. By being born, Leo has left that safety. He has entered a world where pain, loss, and disappointment are possible, indeed inevitable. In that specific sense, his birth is not a triumph over nothingness, but a submission to risk.

  However, philosophy is not lived in the abstract; it is lived in the arms of a family. And while I cannot celebrate the fact *that* he exists, I can wholeheartedly commit to the quality of the life he *now* has.

  The asymmetry of his situation is this: he did not need to be born to be spared suffering, but now that he is born, he needs us to mitigate it. The harm of coming into existence cannot be undone, but the harm of *living* can be softened, and the joys of living can be amplified.

  To Leo's parents, my child and their partner: I know the love that motivated this choice. I do not stand here to judge that love, but to join it. You have taken on the profound responsibility of shepherding a vulnerable consciousness through a difficult world. My promise to you is that I will not offer you platitudes about how "everything happens for a reason." Instead, I offer you my support in making sure that, for Leo, as much as humanly possible, everything happens for *his* good. We cannot undo the fact of his birth, but we can determine the texture of his life.

  And to Leo: I love you. I do not love you because you were born; I love you because you are here, and you are capable of feeling, and thinking, and being. My duty is not to thank the universe for you, but to thank you for allowing me to care for you. I promise to do everything in my power to ensure that your life contains as much relief from suffering and as much genuine pleasure as I can provide.

  We are gathered to welcome you. Let us welcome you not by pretending the world is perfect, but by pledging to make it kinder for you. Let us commit to being the buffer between you and the harm that existence inevitably brings.

  Please raise your glasses. Not to the necessity of birth, but to the possibility of a good life. To Leo.
