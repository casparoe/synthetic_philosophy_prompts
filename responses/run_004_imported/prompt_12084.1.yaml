answer: |-
  This is a fantastic debate to be having. You and Jae are effectively reenacting the central tension in contemporary ethics of blame between **reductive/functionalist accounts** (your side) and **relational/authority-based accounts** (Jae's/Wallace's side).

  You are asking for two things: first, the steelman of your reductive position that survives the "Unapologetic Reformed Cheater" case; and second, an honest verdict on whether that steelman holds up or if Jae's "equal standing" view is actually required.

  Here is the strongest possible version of your argument, followed by my assessment of where the philosophical weight actually lies.

  ---

  ### Part 1: The Steelman of the Reductive View
  **Thesis:** "Standing" is not a distinct deontic property. It is a shorthand for (A) the blamer's lack of normative competence (sincerity) and (B) the blamer's commission of a distinct, ongoing unfairness.

  To save your view against the Cheater case, you have to stop treating "sincerity" as a mere psychological state ("I really feel bad about cheating now") and start treating it as **Normative Competence.**

  #### 1. Redefining Sincerity as "Endorsing the Full Norm"
  Your reductive view fails if "sincerity" just means "I currently believe X is wrong." But in moral philosophy, endorsing a norm isn't just believing a proposition; it's accepting the *commitments* that come with it.

  The norm "Loyalty is required in relationships" entails two things:
  1.  **Forward-looking constraint:** Do not cheat in the future.
  2.  **Backward-looking duty:** If you cheat, you owe repair (apology, accountability) to those you violated.

  **The Move:** You argue the Cheater is *not* sincere because he has only accepted commitment #1 while rejecting commitment #2. By lecturing friends on loyalty without apologizing to exes, he is presenting a truncated, self-serving version of the norm. He is treating "loyalty" as a rule for *others* to follow, while treating his own past violations as "closed cases" that require no further moral labor.

  Therefore, his failure to apologize isn't a separate issue from sincerity; it is **constitutive evidence of insincerity.** He doesn't actually believe in *Loyalty*; he believes in *Compliance for Others.* Under your view, he lacks standing not because of a magical deontic status, but because he is objectively misrepresenting the norm he claims to uphold. He is morally incompetent regarding the full scope of the rule.

  #### 2. The "Ongoing Unfairness" Argument
  You mentioned the "separate wrong" of hypocrisy. The trick is to argue that this wrong is **ongoing**, not past.

  When the Cheater lectures his friends, he is implicitly positioning himself as a moral peer entitled to hold them accountable. But by refusing to apologize to his exes, he is actively maintaining a position of **unearned moral privilege.** He is enjoying the social benefits of being a "reformed man" without paying the moral costs of repair.

  Every time he lectures a friend without having cleaned up his own past, he is committing a fresh act of unfairness. He is asking others to submit to a moral scrutiny he refuses to submit to himself regarding his own victims.
  *   **Your Reductive Explanation:** We don't say "He lacks standing." We say, "He is currently committing an act of unfairness by demanding of us what he denies to his exes." The blame doesn't fail to "land" (the advice is still good); rather, accepting his blame would make *us* complicit in his ongoing unfairness. We reject the blame to protect the integrity of the moral community, not because he lacks a metaphysical license to speak.

  #### 3. Solving the Cheater Case (Without "Standing")
  So, why does the Cheater's blame feel infelicitous to the friends?
  *   **Not because:** He lacks a deontic right to speak (Wallace/Jae).
  *   **But because:** His speech act is **pragmatically defeated.**

  Think of it like a thief yelling "Stop thief!" The proposition "That person is stealing" might be true. The thief isn't lying. But the speech act is infelicitous because the context (the thief's own guilt) undermines the *function* of the blame, which is to uphold a shared standard.

  In the Cheater's case, his lack of apology signals to the friends: *"I do not view moral norms as binding commitments that require repair, but as tools for social regulation."* If the friends accept his blame, they validate that distorted view of morality. So they reject the blame. This is fully explained by (1) his distorted understanding of the norm (insincerity) and (2) the unfairness of his position. No extra "standing" variable is needed.

  ---

  ### Part 2: The Verdict
  **If I had to referee this seminar debate, who wins?**

  I have to bet on **Jae (Wallace)**.

  Here is why your reductive story, even steelmanned as above, eventually cracks under the weight of the "Unapologetic Reformed Cheater."

  #### 1. The "Cowardly Penitent" Counter-Counter-Example
  Your reductive view hinges on the idea that the Cheater is *insincere* or *incompetent* because he hasn't apologized. But imagine a variation:

  > The Cheater is deeply ashamed. He *knows* he owes apologies. He *wants* to apologize. He genuinely believes loyalty is paramount. But he is pathologically cowardly. He is terrified of facing his exes. So he stays silent, suffering in guilt, while faithfully maintaining his current relationship and urging friends to be loyal.

  **The Test:** Does this guy have standing to blame his friends for cheating?
  *   **Jae's View (Wallace):** **No.** He still lacks equal standing. He is still demanding of his friends a transparency and accountability he is too cowardly to offer his exes. The relational deficit remains.
  *   **Your View (Reductive):** **Yes.** Why? Because he *is* sincere (he believes the norm) and he isn't *unfairly exempting* himself (he admits he owes the apology, he's just scared). He isn't hypocritical in the sense of thinking the rule doesn't apply to him; he's just weak.

  **The Intuition Pump:** Most people feel the Cowardly Penitent *still* lacks the authority to lecture others on loyalty. He might offer good advice, but he can't *blame*. If a friend cheats, and this guy says, "How could you? Loyalty is everything!" the friend is entitled to say, "You're in no position to judge me."

  Your reductive view struggles here. You'd have to argue that his cowardice *makes* him insincere. But that stretches "sincerity" so thin it loses meaning. He *is* sincere; he just lacks the **moral authority** that comes from cleaning up one's own mess. That authority is exactly what Wallace calls "standing."

  #### 2. Blame is a Speech Act, Not a Fact-Report
  Your view treats blame like a weather report: "It is raining (you did wrong)." If it's raining, it's raining, regardless of who says it.
  Jae's view treats blame like a verdict in a court of law: "I hold you accountable."

  For a verdict to be valid, the judge must not be an accomplice. This isn't about whether the judge *believes* the law is real (sincerity); it's about whether the judge has the **jurisdiction** to pronounce judgment.
  *   The Cheater, by leaving his past wrongs unaddressed, has placed himself outside the jurisdiction of the moral community he is trying to police.
  *   Your reductive view explains why he is *annoying* or *unfair*.
  *   Jae's view explains why his blame **does not land.**

  #### 3. The "Landing" Distinction
  The strongest evidence for Jae is the phenomenology of the interaction.
  When a hypocrite blames you, you don't just think, "He is being unfair." You think, "You can't talk to me like that."
  There is a **silencing** effect (as Cohen notes). The reductive view says the blame lands but we ignore it because the messenger is flawed. The relational view says the blame *fails to constitute a valid demand.*

  In the Cheater case, if he blames a friend, and the friend says, "Look at your exes," the friend isn't just saying "You're annoying." They are saying, "Your demand has no weight." The demand itself is hollowed out. That hollowness is "standing."

  ### Final Recommendation for Your Seminar
  You should concede that **pure reductivism** (Sincerity + Separate Wrong) is insufficient to explain the *authority* dimension of blame, specifically in cases of **unresolved past wrongs.**

  However, you can save face by arguing that Wallace's "Standing" is not a *mystical* deontic status, but a **relational fact.** It's not that he loses a "right"; it's that the *relationship* required for moral address is broken by the unaddressed past.

  **The Bet:**
  *   **Does your reductive story survive?** Barely. It survives only if you define "sincerity" so broadly that it includes "having discharged all backward-looking duties." But if you do that, you've basically admitted that there is a normative condition for blame beyond just believing the norm is true. You've smuggled "standing" into "sincerity."
  *   **Who is right?** Jae is. The Unapologetic Reformed Cheater shows that you can believe the norm (sincerity) and even admit you violated it (no exemption), yet still lack the **moral authority** to hold others accountable until you repair the past. That gap between "believing the rule" and "having the authority to enforce it" is precisely what "standing" is for.

  **Advice:** Tell Jae she wins on the Cheater case, but you win on the "Manager who is late" case. In the manager case, it *is* mostly about unfairness (separate wrong). In the Cheater case, it's about the integrity of the moral address itself. Distinguishing those two contexts will show you've mastered the nuance of both Cohen and Wallace.
