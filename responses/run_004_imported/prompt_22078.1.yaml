answer: |-
  This is a classic and formidable objection to disjunctivism, often called the **Causal Argument**. Your friend is relying on the intuition that mental states must supervene on the brain (Internalism). If the brain is the same, the mind must be the same.

  To defend disjunctivism without simply retreating to a definitional stipulation (i.e., "hallucinations are just whatever isn't perception"), you need to attack the metaphysical assumptions underlying your friend's objection. You need to argue that the **nature** of an experience is not exhausted by its **proximate neural cause**.

  Here is a construction of the strongest disjunctivist response, drawing heavily on the Naïve Realist tradition (associated with philosophers like M.G.F. Martin and John McDowell).

  ### 1. Distinguish Causal Enablement from Metaphysical Constitution
  Your friend's argument assumes that because the brain state is the *cause* of the experience, it determines the *nature* of the experience. The disjunctivist rejects this inference.

  **The Argument:**
  *   **Premise:** A proximate brain state is necessary to *enable* a subject to have an experience.
  *   **Counter-Premise:** However, what *constitutes* the experience is not the enabling condition, but the successful exercise of a perceptual capacity.
  *   **Analogy:** Consider the act of "unlocking a door."
      *   In the successful case, I turn a key (internal motion) and the lock opens (external fact).
      *   In the failure case (hallucination), I turn the key (same internal motion), but the lock is broken or absent, so the door does not open.
      *   **The Point:** The nature of "unlocking" is not just "turning the key." "Unlocking" is a relational success state. If the door doesn't open, I haven't performed the act of unlocking, even if my hand moved identically. I have performed the act of "trying to unlock."
  *   **Application:** Similarly, veridical perception is a relational success state (contact with the world). The brain state enables this contact. In a hallucination, the brain state is active, but the relation fails to obtain. Therefore, the mental state is not a "perception" that happens to lack an object; it is a fundamentally different kind of event (a "seeming" or a "misfiring") that shares an enabling condition but not a metaphysical nature.

  ### 2. Reject Local Supervenience (Externalism about Phenomenology)
  Your friend finds it "wildly implausible" that external facts determine the nature of the experience. This is because they are assuming **Local Supervenience** (the mind supervenes only on the brain). However, externalism is already widely accepted in other areas of philosophy of mind.

  **The Argument:**
  *   **Precedent:** We accept that *semantic content* is external (Putnam's Twin Earth). Oscar's thought "water is wet" refers to H₂O; Twin-Oscar's identical brain state refers to XYZ. They have different mental states despite identical brains.
  *   **Extension:** Disjunctivism argues that *phenomenal character* (what it is like to have the experience) is also external.
  *   **The Transparency of Experience:** When you introspect your visual experience, you "look right through" it to the world. You are aware of the redness of the apple, not the redness of your neural firing. If the apple is constitutive of the experience (as Naïve Realism claims), then removing the apple changes the experience fundamentally, even if the neural vehicle remains the same.
  *   **Response to Implausibility:** It is only implausible if you assume the mind is "in the head." If the mind is a capacity for engaging with the environment, then facts about the environment are facts about the mind.

  ### 3. The "Fundamental Kind" Argument (Avoiding Negative Characterization)
  You specifically asked to avoid defining hallucination merely as "whatever is indiscriminable from perception." Here is how to give hallucination a positive characterization while maintaining disjunctivism.

  **The Argument:**
  *   **Positive Account of Perception:** Veridical perception is a state of **awareness of mind-independent objects.** This is a positive, relational property.
  *   **Positive Account of Hallucination:** Hallucination is a state of **sensory seeming.** It is a positive event where the subject's sensory systems are active and presenting a world, but without the anchoring relation to an object.
  *   **Why they are different kinds:**
      *   Think of **Winning** vs. **Playing**.
      *   Winning is a positive state (crossing the line first).
      *   Playing is a positive state (running the race).
      *   From the inside, running the race while winning feels exactly like running the race while losing (until you check the scoreboard).
      *   However, "Winning" and "Losing" are not the same kind of state, even if the internal exertion is identical.
      *   Disjunctivism claims Perception is like "Winning" (a success state involving the world) and Hallucination is like "Playing but not Winning" (a distinct positive state of sensory activity).
  *   **The Indiscriminability Clause:** We only link them via indiscriminability because that is our *epistemic* access to them. But their *metaphysical* natures are distinct. One is constituted by the world; the other is constituted by the subject's own sensory activity.

  ### 4. Addressing the "Common Cause" Directly
  Finally, you must address the specific claim that "one type of cause cannot yield experiences of fundamentally different natures."

  **The Response:**
  The brain state is not the *sole* cause of the experience; it is a *partial* cause.
  *   **Veridical Case:** Cause = Brain State + **Distal Object**.
  *   **Hallucinatory Case:** Cause = Brain State + **Neural Misfire/Random Noise**.
  *   Since the total causal history is different, there is no mystery in the effects being different. Your friend is isolating the brain state and treating it as the *total* cause. The disjunctivist argues the brain state is merely the *internal contribution* to the experience.
  *   **Analogy:** A radio playing music vs. a radio playing static.
      *   The internal circuitry (brain) might be functioning identically in terms of voltage and amplification.
      *   But in one case, there is a signal (external object); in the other, there is noise.
      *   The *sound* (experience) is fundamentally different (Music vs. Static), even if the amplifier (brain) is doing the same work. It is not implausible that the source of the signal determines the nature of the sound.

  ### Summary for Your Argument
  To summarize this for your friend, you can say:

  > "Your objection assumes that the brain state *constitutes* the experience. I am arguing that the brain state merely *enables* the experience.
  >
  > If perception is a relation to the world (like unlocking a door), then the presence of the world is part of the mental state, not just a cause of it. When the world is absent, you don't have the same mental state with a missing object; you have a different kind of mental state (a sensory seeming) that shares the same neural enabling conditions.
  >
  > This isn't a negative definition of hallucination; it's recognizing that 'Success' and 'Failure' are different ontological categories, even if the internal machinery looks the same. It is no more implausible than saying a winning race and a losing race are different outcomes, even if the runner exerted the same effort."

  This moves the debate from "neural correlates" (where your friend wins) to "metaphysical constitution" (where the disjunctivist has a strong foothold).
