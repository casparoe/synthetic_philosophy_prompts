          2.  **Evidence Distinction:** Validate this. Mention "normic support" or the legal analogy (Gatecrasher). It's a strong point. Warn that the "error" belief is still statistical.
          3.  **Editions:** Clarify that the paradox is synchronic (at one time). Fixability is diachronic. It doesn't solve the logic but adds a pragmatic layer. It's a nice literary insight, even if not a philosophical "solution."
