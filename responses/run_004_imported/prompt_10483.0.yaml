prompt: |-
  Robin Hanson and other writers in the rationalist blogosphere frequently invoke Zahavi's handicap principle to explain why certain costly displays function as honest signals: a peacock's tail, a lavish wedding, or a startup founder forgoing salary is trustworthy precisely because a lower-quality signaler could not afford to fake it. If that is the whole mechanism, then it seems the right heuristic for evaluating any purported honest signal is simply to ask how expensive or wasteful it is, on the logic that the costlier and more extravagant the display, the harder it is to fake and therefore the more it should be trusted. Is that a fair extension of the handicap principle, or is there a distinction built into the theory that this heuristic glosses over?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Deconstruct the User's Query:**
      *   **Core Concept:** Zahavi's Handicap Principle (costly signaling theory).
      *   **Context:** Robin Hanson, rationalist blogosphere (e.g., LessWrong, Slate Star Codex/Astral Codex Ten).
      *   **Proposed Heuristic:** "The costlier/more wasteful the display, the harder it is to fake, therefore the more it should be trusted."
      *   **Question:** Is this a fair extension of the theory, or does it gloss over crucial distinctions?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the Handicap Principle about cost?* Yes, but specifically *differential* cost.
      *   *Is "more cost = more trust" always true?* No. There are diminishing returns, wrong kinds of cost, and equilibrium issues.
      *   *Who is Robin Hanson?* An economist known for applying signaling theory to social behavior (e.g., *The Elephant in the Brain*). He definitely uses these concepts.
      *   *What is the core mechanism?* It's not just that the signal is costly; it's that the cost is *lower* for the high-quality signaler than for the low-quality signaler (marginal cost differential).

  3.  **Identify the Flaw in the User's Heuristic:**
      *   The user suggests: Cost $\propto$ Trustworthiness.
      *   The theory actually says: (Cost for Low Quality) > (Benefit of Signaling) > (Cost for High Quality).
      *   *Crucial Distinction:* It's not about absolute cost, but *relative* cost (marginal utility). A \$10,000 watch is a signal for a millionaire, but a \$10,000 watch is bankruptcy for a poor person. If a poor person buys it, it's not an honest signal of wealth, it's a signal of financial irresponsibility.
      *   *Wastefulness:* The signal must be wasteful *to the low-quality type*. If it's wasteful to everyone but provides no benefit, it won't evolve.
      *   *Equilibrium:* Signaling costs settle at an equilibrium where low-types are just deterred. Going *above* that equilibrium is just waste, not more signal.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Point 1: Marginal Cost vs. Absolute Cost.* This is the biggest economic nuance. A 10-hour workout is easy for an athlete, impossible for a sedentary person. The cost isn't the hours; it's the *suffering/effort relative to capacity*.
      *   *Point 2: The Equilibrium Problem.* If everyone starts burning money to signal wealth, the price of signaling goes up. Just burning *more* money doesn't necessarily signal *more* quality if the baseline shifts. It leads to an arms race.
      *   *Point 3: Relevance of the Signal.* The cost must be linked to the trait being signaled. Burning money signals wealth, not necessarily kindness or competence. A founder forgoing salary signals confidence/wealth, but maybe also irresponsibility if the company fails.
      *   *Point 4: Counter-Signaling.* Sometimes high-quality types *don't* signal because their quality is obvious. (The "Bill Gates wears a normal watch" argument).
      *   *Point 5: Hanson's Specific Take.* Hanson often emphasizes that we signal to *manage impressions*, not just reveal truth. The "waste" is the point, but the *type* of waste matters (e.g., education signals conformity/intelligence, not just that you paid tuition).

  5.  **Refining the Argument (incorporating Rationalist context):**
