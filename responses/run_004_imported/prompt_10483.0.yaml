      *   Need to mention that "cost" isn't just money; it's risk, opportunity cost, pain.
      *   Need to address the "trust" aspect. Costly signals make claims *credible*, but not necessarily *true* in a normative sense (e.g., a cult leader fasting is a credible signal of conviction, but the beliefs might be false).

  6.  **Structuring the Response:**
