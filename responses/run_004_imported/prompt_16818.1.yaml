      *   **The Goal:** A short memo for the Thursday meeting. It needs a *real recommendation with a timeframe*, not a punt. It must take her present refusal seriously (not just dismiss it as "akrasia" or "symptoms") while acknowledging the validity of the Ulysses contract.
