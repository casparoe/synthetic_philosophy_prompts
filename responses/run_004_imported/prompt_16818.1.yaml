      *   **Current Autonomy (The Refusal):** She is articulate now. Dismissing her voice as "just the illness" risks paternalism and undermining personhood.
      *   **Decisional Capacity:** It's borderline. This is the crux. If she lacks capacity, the AD wins. If she has capacity, the AD is arguably void. But "capacity" isn't a binary switch, especially in psychiatry.
      *   **The User's Insight:** The user knows that "akrasia" (weakness of will) isn't just a moral failing; it's a structural feature of temporal discounting. The hypomanic self values immediate reward/grandiosity highly (steep discounting). The stable self values long-term stability. The Ulysses contract is a mechanism to bridge this temporal gap. However, treating the patient *now* requires engaging with the *current* agent, not just overriding them.

