answer: |-
  This is a heavy topic, and it is completely understandable that the argument is still bugging you. You are dealing with one of the most uncomfortable discoveries in the history of analytic philosophy: the 1924 diary of Gottlob Frege, discovered and published in the 1990s, which reveals virulent antisemitism and monarchist authoritarianism in a man considered the grandfather of modern logic.

  Your friend is making a sophisticated philosophical argument, often called a **structural homology** argument. They are claiming that the *structure* of Frege's philosophical reasoning (anti-psychologism) is identical to the *structure* of his political reasoning (anti-democratic authoritarianism).

  However, your intuition that this is a "stretch" is shared by most major Frege scholars. While there may be a biographical or temperamental link, there is no **logical entailment** between his technical work and his politics.

  Here is a breakdown of where your friend's argument holds water, where it breaks down, and what the scholarly consensus actually is.

  ### 1. Where your friend has a point (The "Temperamental" Link)
  Your friend is correct that there is a shared *temperament* in Frege's work.
  *   **In Logic:** Frege fought "psychologism." He argued that truth is not determined by what humans *think* or *feel* (subjective), but by objective laws that exist independently of us. He wanted to remove the "human element" from truth.
  *   **In Politics:** Frege's diary shows he despised democracy because he felt it put governance in the hands of the "masses" (subjective, emotional, chaotic). He wanted order imposed from above by an objective authority (the Monarch).

  In both cases, Frege displays a deep distrust of **human subjectivity**. He wants to anchor truth and order in something outside of individual human minds. If you view philosophy as an expression of personality, your friend is right: the same rigid, authoritarian personality produced both the logic and the politics.

  ### 2. Where the argument fails (The Logical Flaw)
  This is where you can push back. Just because two systems share a structure (objectivity over subjectivity) does not mean they are morally or logically equivalent. Here are three specific counter-arguments:

  **A. Universality vs. Exclusion**
  *   **Logic:** Frege's logical laws are **universal**. The law of non-contradiction applies to everyone equally: a Jew, a German, a democrat, a monarchist. His anti-psychologism actually *protects* minority truths. If truth were determined by the "majority mind" (psychologism), then a majority could vote that 2+2=5. Frege's logic says the minority is still right if the objective facts are on their side.
  *   **Politics:** Frege's politics were **exclusionary**. He explicitly argued that certain groups (Jews) should *not* have equal standing.
  *   **The Flaw:** If his logic truly drove his politics, he should have argued that political rights, like logical laws, apply universally to all rational beings. Instead, his politics contradicted the universalism inherent in his logic.

  **B. Category Error (Truth vs. Power)**
  *   **Logic:** Logical laws are descriptive of reality. They don't "rule" over you; they just *are*. You can't disobey the law of non-contradiction; you can only be wrong.
  *   **Politics:** Political laws are prescriptive. They use force to compel behavior.
  *   **The Flaw:** Conflating ontological objectivity (how truth exists) with political authority (how people are governed) is a category mistake. Believing that mathematical truths are objective does not logically require you to believe that kings should have absolute power over subjects. Many mathematicians believe in objective truth and are staunch democrats.

  **C. The "No Entailment" Proof**
  *   **The Flaw:** If the friend's argument were true, then **all** anti-psychologists should be authoritarian antisemites, and **all** democrats should be psychologizers.
  *   **Reality:** This is historically false. Bertrand Russell, who built on Frege's logic, was a pacifist and a social democrat. Edmund Husserl, who also fought psychologism, was not an antisemitic authoritarian in the same vein. Conversely, many Nazi ideologues rejected "cold, Jewish logic" in favor of "vitalist, intuitive truth" (which is actually a form of psychologism).
  *   **Conclusion:** Since you can have Frege's logic without Frege's politics, the logic does not *cause* the politics.

  ### 3. What do the scholars say?
  The discovery of the diary caused a massive crisis in philosophy departments in the 90s. The consensus generally falls into two camps, but neither fully supports your friend's strong claim.

  **The "Separation" Camp (Michael Dummett)**
  Sir Michael Dummett, perhaps the most important Frege scholar of the 20th century, wrote the introduction to the diary. He was horrified but argued for **separation**.
  *   **View:** Frege's logic is a technical achievement that stands on its own merits. The political views are a moral failing of the man, not a flaw in the system.
  *   **Analogy:** Heidegger was a Nazi, but that doesn't mean *Being and Time* is a Nazi text. The arguments must be evaluated on their own terms.

  **The "Contextual" Camp (Hans Sluga)**
  Hans Sluga (author of *Frege's Reason*) argues that Frege's philosophy cannot be fully understood without its historical context.
  *   **View:** Frege's desire for "order" and "objectivity" was influenced by the same German nationalist anxieties that led to his politics.
  *   **Nuance:** Even Sluga does not argue that the logic *is* the politics. He argues they spring from the same *cultural soil*. He acknowledges that the logic itself does not mandate the antisemitism.

  **The Critical Camp (Richard Rorty / Critical Theory)**
  Some philosophers, like Richard Rorty, have argued that the entire philosophical quest for "Objective Truth" (which Frege started) is a kind of authoritarian move.
  *   **View:** By saying "Truth is out there and you must submit to it," philosophers create a hierarchy that mimics political authoritarianism.
  *   **Relevance:** This is the closest to your friend's view. However, this is a critique of *all* objective philosophy, not just Frege, and it is a controversial meta-philosophical stance, not a historical fact about Frege's diary.

  ### Summary for your next conversation
  You can tell your friend that their observation is **psychologically plausible but logically unsound.**

  1.  **Acknowledge the grain of truth:** Yes, Frege had an "authoritarian temperament" that valued order and objectivity in both his math and his politics.
  2.  **Point out the contradiction:** Frege's logic is universal (true for everyone), while his politics were exclusionary (rights for some). The politics actually violate the spirit of the logic.
  3.  **Cite the counter-examples:** Many logicians were democrats; many antisemites rejected logic. Therefore, the logic does not entail the politics.
  4.  **The Scholarly Verdict:** Most scholars (like Dummett) treat the diary as a tragic biographical footnote that stains the man but does not invalidate the *Begriffsschrift*.

  Your friend is making a category error by assuming that because two things *feel* similar (a rejection of subjective whim), they must be *structurally* identical. You were right to feel it was a stretch; it conflates **epistemology** (how we know truth) with **ethics** (how we treat people). Frege failed to make that distinction in his life, but we don't have to make it in our analysis of his work.
