answer: |-
  Jonathan Schaffer's "trumping preemption" case presents a formidable challenge to theories of causation. In this scenario, a Major and a Sergeant simultaneously order a Corporal to advance. By military protocol, the Corporal obeys the Major; the Sergeant's order is effective only if the Major is silent. Intuitively, the Major's order causes the advance, while the Sergeant's does not, despite the fact that the Corporal would have advanced on the Sergeant's order alone had the Major remained silent.

  The standard narrative in contemporary metaphysics suggests that while simple counterfactual theories (like David Lewis's early account) fail here, the interventionist structural-equations (SE) approach succeeds. This essay argues that this narrative is mistaken. When analyzed under the standard Halpern–Pearl (HP) definition of actual causation, the SE approach initially counts the Sergeant's order as a cause alongside the Major's. To rectify this and match intuition, the SE theorist must import an independent ranking of "normal" contingencies. This move renders the SE approach no more principled than the counterfactual theory, as it relies on the same kind of stipulative prioritization it claims to render unnecessary. Furthermore, while it is true that all causal theories require resources to handle hard cases, this does not excuse the SE approach from the charge of lacking a *comparative* advantage, which is the very basis of its claim to superiority.

  ### The Failure of Simple Counterfactuals and the Promise of Structure

  To understand the stakes, one must first see why the counterfactual theory struggles. On a simple Lewisian account, $C$ causes $E$ only if $E$ counterfactually depends on $C$. In the trumping case, if we suppose the Major had not ordered the advance ($M=0$), the Corporal would still have advanced ($C=1$) because the Sergeant ordered it ($S=1$). Thus, the advance does not counterfactually depend on the Major's order. The theory falsely denies the Major is a cause.

  The structural-equations approach appears to offer a solution by encoding the causal mechanism directly into mathematical functions. We can model the Corporal's behavior with an equation like $C = M$ if $M \neq 0$, else $C = S$. This structure explicitly represents the priority of the Major. It seems the formalism itself captures the intuition that the Major trumps the Sergeant. Consequently, many have argued that SE theories enjoy a principled advantage: they resolve preemption through the topology of the model rather than through vague similarity metrics between possible worlds.

  ### The Halpern–Pearl Problem: The Sergeant as Cause

  However, the structural equation alone does not determine *actual causation*. For that, we need a definition, and the standard is the Halpern–Pearl (HP) account. Roughly, $X=x$ is an actual cause of $Y=y$ if there exists a contingency (a setting of other variables) such that $Y$ counterfactually depends on $X$.

  This is where the SE advantage dissolves. To test if the Major's order ($M=1$) is a cause of the advance ($C=1$), we look for a contingency where $C$ depends on $M$. If we set the Sergeant's order to silent ($S=0$), then $C$ depends on $M$. The Major is correctly identified as a cause.

  But now consider the Sergeant. To test if $S=1$ is a cause of $C=1$, we look for a contingency where $C$ depends on $S$. If we set the Major's order to silent ($M=0$), then $C$ depends on $S$ (since the protocol dictates the Corporal follows the Sergeant if the Major is silent). Under the standard HP definition, the Sergeant's order *also* counts as an actual cause.

  This result violates the intuition of trumping. The Sergeant's order was preempted; it was causally inert in the actual scenario. The SE approach, despite its structural encoding of priority, fails to exclude the Sergeant as a cause using its standard machinery. The structural equation describes the *potential* influence, but the HP definition of *actual* causation allows us to test that potential by imagining away the Major. By doing so, it treats the trumped cause exactly like the trumping cause.

  ### The Necessity of Normality and the Loss of Principle

  To rescue the SE account, proponents (such as Halpern and Hitchcock) have introduced "normality" conditions. They argue that when testing for contingencies, we should not consider all mathematically possible settings of variables, but only those that are "sufficiently normal." In the trumping case, the contingency where the Major stays silent ($M=0$) is deemed less normal than the contingency where the Sergeant stays silent, given the actual context of a military hierarchy. By ruling out the $M=0$ contingency as abnormal, we block the path that makes the Sergeant a cause.

  This move reveals that the SE approach enjoys no principled advantage over the counterfactual theory. The work of excluding the Sergeant is not being done by the structural equations themselves, nor by the logic of interventionism. It is being done by an external ranking of scenarios based on normative or statistical "normality."

  A counterfactual theorist can make the exact same move. Faced with the failure of simple dependence, the Lewisian can appeal to a refined similarity metric. They can stipulate that worlds where the military protocol is violated (or where the Major inexplicably stays silent despite being present) are less similar to the actual world than worlds where the protocol holds. By weighting the similarity metric to respect the priority of the Major, the counterfactual theorist can also ensure that the advance depends on the Major but not the Sergeant.

  In both cases, the formalism (whether SE or CF) underdetermines the causal verdict. Both require an external, stipulative ranking to prioritize one potential cause over another. The SE theorist ranks *contingencies* by normality; the CF theorist ranks *possible worlds* by similarity. Neither ranking is derived from the causal structure itself; both are imported to save the intuition. Therefore, the claim that SE solves trumping "naturally" via equations is false. It solves it by fiat, just as the counterfactual theorist must.

  ### Defending Against the "All Theories Struggle" Objection

  A common objection to this line of argument is that it sets an unfairly high bar for interventionism. Every theory of causation faces hard cases—overdetermination, late preemption, and trumping. It is inevitable that theories must be refined with additional resources (like normality or similarity metrics) to handle these edge cases. If the counterfactual theory needs extra resources, and SE needs extra resources, why is this a specific mark against SE? Why does this negate their advantage?

  The response is that the objection conflates the *need for refinement* with the *claim of superiority*. The interventionist approach was not merely marketed as "another theory that needs work." It was specifically promoted as an improvement over counterfactual theories *because* it purported to handle preemption and trumping more robustly through its structural machinery. The selling point was that SE could encode the asymmetry of causation (the priority of the Major) directly into the model, thereby avoiding the need for the vague, context-sensitive similarity metrics that plagued Lewis's account.

  If the SE approach must now import a "normality" ranking to handle trumping, it has reintroduced the very vagueness and context-sensitivity it claimed to eliminate. The "normality" of a contingency is often just as contentious and stipulative as the "similarity" of a possible world. Is it statistically normal for a Major to be silent? Normatively normal? The criteria for this ranking are external to the causal model.

  Therefore, the objection that "all theories need resources" misses the point. The issue is not that SE needs resources; it is that it needs the *same kind* of resources as its rival to solve the *same problem*, despite claiming to have a structural solution that rendered those resources unnecessary. If a new car is marketed as having an engine that doesn't require oil, but it turns out it requires a specific synthetic fluid that functions exactly like oil, the manufacturer cannot defend themselves by saying, "Well, all cars need fluids." The claim was about the *type* of resource and the *mechanism* of operation.

  Similarly, SE claimed to resolve trumping via structure, not via ranking. By showing that it requires a ranking of contingencies to match intuition, we demonstrate that the structural advantage is illusory in this domain. The counterfactual theorist can posit priority by fiat in their similarity metric; the SE theorist must posit priority by fiat in their normality ranking. Neither has a principled ground to stand on that the other lacks.

  ### Conclusion

  Schaffer's trumping preemption case demonstrates that causal intuition relies heavily on normative or hierarchical priorities that are not fully captured by mere counterfactual dependence or structural equations alone. While the structural-equations approach initially appears to solve the problem by encoding priority into the model, the standard definition of actual causation (Halpern–Pearl) fails to exclude the trumped cause without further amendment. To fix this, the SE theorist must invoke an independent ranking of "normal" contingencies. This requirement neutralizes the SE approach's claimed advantage over counterfactual theories, as the counterfactual theorist can equally invoke a similarity ranking to achieve the same result. Both theories ultimately rely on stipulative prioritization to handle trumping. Consequently, the structural-equations approach offers no principled advantage in this regard; it merely shifts the locus of stipulation from world-similarity to contingency-normality, without resolving the underlying philosophical difficulty.
