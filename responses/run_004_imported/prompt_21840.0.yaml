      *   **The Task:** Argue that SE has *no principled advantage* over counterfactual theory regarding trumping.
      *   **Key Argument:** Excluding the Sergeant requires an independent ranking of "normal" contingencies. This ranking is just as stipulative as the priority a counterfactual theorist could posit by fiat.
