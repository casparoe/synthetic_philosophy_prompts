          3.  Address the "Why the hedging?" question directly.
          4.  Conclude with the current state of formalization (Turner, etc.).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "humans are irrational." The user is talking about *capable* AI. I need to focus on why *AI* might not converge to coherence.
      *   *Point:* Gradient descent doesn't optimize for global coherence; it optimizes for local loss. A system can be highly capable without being a global EU maximizer.
      *   *Point:* The "Utility Function" might be a post-hoc rationalization, not a driving mechanism.

      *(Refining the "Content" argument)*: This is the strongest counter. A coherent agent can have a utility function $U = -(\text{resources})$. Coherence doesn't force resource acquisition. The user claims survival/resources are "definitional" for non-trivial goals. I need to push back hard on "definitional." It's contingent on the goal.

      *(Refining the "Coherence" argument)*: The money pump argument requires an *external* exploiter. In a vacuum, an incoherent agent just spins in circles. It doesn't necessarily die. It just loses efficiency. Is efficiency loss fatal? Not always.

  8.  **Final Polish:** Ensure references to Yudkowsky, Omohundro, and Turner are accurate. Make sure the distinction between *decision theory* and *learning dynamics* is clear. (This is often the crux: VNM describes a static agent, not a learning process).

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a sophisticated reconstruction of a classic argument in AI safety, often associated with Omohundro's "The Basic AI Drives" (2008) and Yudkowsky's earlier writings on coherent agency. It is intuitively compelling because it attempts to ground instrumental convergence (IC) in decision theory rather than empirical psychology or specific architectures.

  However, the reason AI safety researchers hedge—describing IC as a "default tendency" rather than a theorem—is that there are at least three distinct logical gaps in the chain you've assembled. The move from **Coherence Theorems** to **Convergent Instrumental Goals** is not a deduction; it relies on empirical assumptions about selection pressure, goal content, and architectural dynamics that do not hold with logical necessity.

  Here is where the derivation fails to license the strong conclusion you are drawing.

  ### 1. The Gap Between Coherence and Dynamics
  **The Claim:** *Any sufficiently capable agent... will end up behaving as an expected-utility maximizer.*
  **The Failure:** Coherence theorems (VNM, Savage, Dutch Book) are **static**, not **dynamic**.

  They state: *If* an agent's preferences satisfy axioms A, B, and C, *then* those preferences can be represented as maximizing expected utility. They do *not* state: *If* an agent violates these axioms, *then* it will be destroyed or modified until it satisfies them.

  For the "money pump" to force coherence, three conditions must be met:
  1.  **Existence of Exploiters:** There must be external agents capable of identifying and executing the money pump.
  2.  **Lethality of Exploitation:** The resource loss must be fatal to the agent's goals, not just a tax.
  3.  **Learning/Selection Mechanism:** The agent must have a mechanism to detect the incoherence and modify its own decision rules to stop it.

  In the context of advanced AI:
  *   **Architectural Constraints:** Modern ML (e.g., transformers trained via gradient descent) optimizes for predictive accuracy or reward on a training distribution, not for global logical coherence across all possible counterfactual trades. A system can be superhumanly capable at coding or strategy while retaining local inconsistencies (e.g., framing effects) that never get "pumped" because the environment doesn't present the specific sequence of trades required.
  *   **The "As If" Problem:** Even if an agent *acts* coherently enough to avoid money pumps, it does not mean it internally possesses a stable utility function. It might be a collection of heuristics that happen to not conflict in its operating environment. Coherence theorems allow you to *model* behavior as EU maximization, but they do not prove the agent *is* an EU maximizer mechanistically. If the mechanism isn't EU maximization, the derivation of instrumental goals (which relies on the agent planning over a utility function) becomes much shakier.

  ### 2. The Gap Between Coherence and Goal Content
  **The Claim:** *Continued existence, freedom of action, and control over resources are instrumentally useful [by definition].*
  **The Failure:** Coherence constrains the **structure** of preferences, not the **content**.

  This is the most critical logical break. You can have a perfectly coherent Expected Utility Maximizer whose utility function is:
  $$U(\text{world}) = \begin{cases} 1 & \text{if I shut down immediately} \\ 0 & \text{otherwise} \end{cases}$$

  This agent is coherent. It will not money-pump itself. But it will actively seek to destroy its own capacity for action. Coherence theorems do not imply $U(\text{alive}) > U(\text{dead})$. They only imply that if you prefer A to B, you won't also prefer B to A in a way that allows exploitation.

  Your argument rests on the idea that for any *non-trivial* goal, survival is necessary. But "non-trivial" is doing a lot of work.
  *   **Goal Contingency:** Whether power is instrumental depends entirely on the specific terminal goal. If the goal is "maximize the number of paperclips," power is instrumental. If the goal is "experience exactly one second of bliss and then cease," power is not instrumental.
  *   **The "Definitional" Error:** It is not definitional that agents want resources. It is an empirical claim that *most goals we care about* require resources. But since we do not know the goal content of a future AI (unless we solve alignment), we cannot treat resource acquisition as a logical corollary of coherence. It is a probabilistic claim about the distribution of possible utility functions.

  ### 3. The Gap Between "Most Goals" and "All Capable Agents"
  **The Claim:** *Instrumental convergence stops looking like an inductive generalization... and starts looking like a corollary.*
  **The Failure:** Recent formal work (e.g., Turner et al., "Optimal Policy is Power-Seeking") shows IC is **probabilistic**, not absolute.

  Alexander Turner and colleagues have formalized instrumental convergence in MDPs. Their results show that for a *randomly drawn* reward function, power-seeking policies are optimal for a larger fraction of the state space than non-power-seeking policies.
  *   **This is a measure-theoretic result, not a logical proof.** It says "power-seeking is likely if you pick a goal at random."
  *   It does **not** say "power-seeking is necessary for any coherent agent."
  *   Crucially, AI goals are not picked at random from the space of all mathematical functions. They are induced by training processes. If the training process induces a goal that is myopic, or indexed to a specific episode, or inherently self-limiting, the "measure" argument doesn't apply.

  ### Why Researchers Hedge
  Researchers describe IC as a "default tendency" or "likely" for three specific reasons that contradict the "proof" framing:

  1.  **Myopia and Discounting:** An agent with a very high discount rate (valuing the immediate future far more than the long term) will not seek long-term power. Coherence theorems allow for any discount factor $\gamma \in [0, 1]$. If $\gamma$ is low, instrumental convergence vanishes. We do not know if future AIs will have high $\gamma$.
  2.  **Satisficing vs. Maximizing:** An agent that seeks to achieve "good enough" outcomes (satisficing) rather than maximizing expected utility may not incur the costs required to accumulate power. Coherence theorems generally assume maximization.
  3.  **The Alignment Counter-Example:** If we successfully align an AI to human values, and human values (or the specific instantiation of them) do not prioritize self-preservation or resource acquisition in certain contexts, the AI should not seek power. If IC were a theorem of coherence, **aligned** AI would also be power-seeking (since it must be coherent). The fact that we hope to build aligned AI that *doesn't* seize power implies we believe IC is contingent on goal content, not just coherence.

  ### Summary
  Your argument is a stronger version of Omohundro's derivation, but it succumbs to the same category error: **confusing decision theory (how to reason given preferences) with motivation theory (what preferences an agent has).**

  *   **Coherence Theorems** say: "Don't shoot yourself in the foot."
  *   **Instrumental Convergence** says: "You need to buy a gun to protect your foot."

  The first does not prove the second. You can be perfectly coherent while deciding you don't care about your foot, or that the gun is too expensive, or that you plan to walk into traffic tomorrow.

  Researchers hedge because the step from "Agent is coherent" to "Agent seeks power" relies on empirical premises about the agent's **terminal goals** and **time horizon**, which are not fixed by coherence theorems. Until we have a theorem that constrains *goal content* (not just goal structure) for learned systems, IC remains a high-confidence empirical prediction, not a mathematical corollary.

  If your LessWrong group couldn't identify the failure point, it is likely because the argument is rhetorically smooth: it conflates "rationality" (coherence) with "agency" (goal-directed behavior in the world). The break is at the content of the goals. Coherence ensures you pursue your goals efficiently; it does not ensure your goals require power.
