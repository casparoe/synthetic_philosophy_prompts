prompt: |-
  so my friend Sam and I got into this two-hour argument last night (a few beers in, admittedly) about Aristotle's theory of money and neither of us actually "won," we just both got more confused the longer it went. Sam's claim was that Aristotle is basically running a proto labor-theory-of-value, like a warm-up act for Marx. I said no way, that's reading Marx backwards into him. Then we actually dug up the passage we were half-remembering (Nicomachean Ethics, Book V, ch. 5, Ross translation) and honestly it just made things worse:

  "This is why all things that are exchanged must be somehow comparable. It is for this end that money has been introduced, and it becomes in a sense an intermediate; for it measures all things, and therefore the excess and the defect—how many shoes are equal to a house or to a given amount of food. The number of shoes exchanged for a house (or for a given amount of food) must therefore correspond to the ratio of builder to shoemaker. For if this be not so, there will be no exchange and no intercourse. And this proportion will not be effected unless the goods are somehow equal. All goods must therefore be measured by some one thing, as we said before. Now this unit is in truth demand, which holds all things together (for if men did not need one another's goods at all, or did not need them equally, there would be either no exchange or not the same exchange); but money has become by convention a sort of representative of demand; and this is why it has the name 'money' (nomisma)—because it exists not by nature but by law (nomos) and it is in our power to change it and make it useless. There will, then, be reciprocity when the terms have been equated so that as farmer is to shoemaker, the amount of the shoemaker's work is to that of the farmer's work for which it exchanges."

  Sam thinks "demand" here is standing in for some real, objective thing (like labor) that value actually tracks, with money just being a token for it. I thought "demand" sounded way more subjective, like wanting/utility, which would make the whole thing closer to a proto-marginalist view, but then I couldn't explain why Aristotle keeps insisting money is only "by convention" if its tracking something that real underneath. Can you help me actually work through what "demand" (I guess its "chreia" in the greek?) is doing in this argument, how it fits with the bit about money existing "by law, not by nature," and whether either of our two readings holds up, or if we're both just projecting later economic theories onto a guy who wasn't answering our question at all?
