  4.  **Formulate the "Considered Judgment" (The Core Argument):**
      *   *Thesis:* Nozick's instability is not a bug to be fixed but a feature that exposes the moral cost of the research. Taking Nozick seriously forces the conclusion that the work was ethically precarious, perhaps indefensible under strict scrutiny, because the "line" Nozick struggles to draw falls *within* the category of beings the user worked on (macaques), not between them and humans.
      *   *Key Point 1: The Failure of the "Line".* Nozick's hesitation suggests that if a being has *any* significant subjective life, treating it purely utilitarianly is morally suspect. Macaques possess capacities (social bonding, pain anticipation, memory) that mimic the "life plan" capacity Nozick values in humans.
