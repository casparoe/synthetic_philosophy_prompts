      *   **Context:** The user is reflecting on their career ethics in light of a specific, often overlooked passage in Nozick regarding animal rights.
      *   **Specific Text:** Nozick's discussion in *ASU* (Chapter 3, "Moral Constraints and the State") where he discusses rights as side constraints, the Kantian principle (ends not means), and the problem of animals. Nozick notes a utilitarian treatment of animals vs. rights-based treatment of humans and admits uncertainty about the line.
      *   **The Task:** Describe the *implications* of this instability in Nozick's view for the user's retrospective ethical assessment of their work (macaque studies, significant non-lethal suffering, basic research with diffuse medical payoff).
