      *   **Analyzing Nozick's Instability:** Explain *why* Nozick is uncomfortable. It's the clash between Kantian dignity and Utilitarian calculation. He wants rights to be absolute for humans but admits animals get the calculus.
      *   **Applying to the Macaque:** This is the crux. Macaques aren't rats. They have social structures, memory, anticipation. They fit the "intermediate" category Nozick worries about.
      *   **The "Side Constraint" Implication:** If Nozick's rationale for human rights is "value of a subjective life," macaques qualify. If they qualify, they get side constraints. If they get side constraints, you cannot sacrifice them for diffuse benefits.
