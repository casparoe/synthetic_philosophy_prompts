      *   *The Problem:* Why do these constraints apply to humans but not animals? Nozick suggests it might be related to the capacity to shape one's life according to an overall conception (self-consciousness, rational agency).
      *   *The Instability:* Nozick admits this leads to a "dual system": Utilitarianism for animals, Deontology for humans. He finds this uncomfortable ("utilitarianism for animals, Kantianism for people"). He doesn't fully resolve *why* the line is there or if it's arbitrary.
      *   *The "Trade-off" Issue:* If animals don't have rights as side constraints, their suffering can be aggregated to outweigh human benefits. If they *do* have some moral weight but not full rights, where is the threshold?

  3.  **Evaluate the User's Specific Scenario:**
