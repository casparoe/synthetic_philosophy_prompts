      *   *Key Point 3: Retrospective Guilt/Validation.* The user shouldn't feel absolved by "standard practice." Nozick's view implies standard practice (utilitarian animal use) is philosophically weak when applied to high-order mammals.
      *   *Key Point 4: Intermediate Cases.* The existence of infants and apes proves the "rational agency" criterion is flawed. If we protect infants who lack rational agency, we must protect macaques who have more agency than infants. Therefore, the macaques *should* have had side constraints.

  5.  **Drafting the Response - Section by Section:**

