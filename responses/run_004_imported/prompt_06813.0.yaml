answer: |-
  Friends, family, parishioners, and colleagues.

  Thank you for being here. For thirty years, I had the privilege of walking the halls of the philosophy department with Helen. I know many of you knew her in the pews, in the choir, or around the dinner table. To some, she was Professor Helen, the rigorous scholar who could dismantle an argument with a single raised eyebrow. To others, she was simply Helen, the woman who brought casseroles to the sick and sang the hymns a little louder than everyone else.

  It is a rare thing to inhabit two worlds so fully without letting one dilute the other. But Helen did not see her life as divided. She did not keep her philosophy in one pocket and her prayer book in another. She spent a career insisting that these were not competing territories, but different depths of the same human experience.

  We are gathered to honor a woman who thought deeply about what it means to speak about God. Helen was a scholar of Wittgenstein, and she took seriously his suggestion that religious belief is not a matter of assembling evidence for a hypothesis. She often told me, and she told her students, that when she professed belief in the Resurrection or the Last Judgement, she was not making a prediction about future physics. She was not guessing about a distant event that might be verified like a weather forecast.

  For Helen, these beliefs were what she called a "regulative picture." They were a framework that gave shape and weight to her present life. To believe in the Last Judgement, for her, was to live with the profound seriousness that every action matters. To believe in the Resurrection was to refuse to let death have the final word in how she loved the living.

  I tell you this not to analyze her, but to explain the solidity of her comfort. There are those who might try to comfort us today by saying, "Well, she wanted it to be true, and now she knows it is." And there are others who might say, "Her faith was a beautiful metaphor for her goodness."

  Helen asked us not to say either of those things.

  To say she now "knows" implies her faith was a question waiting for an answer, a uncertainty now resolved by data. But her faith was not a uncertainty. It was a commitment. To say it was "just a metaphor" implies she wasn't really talking about God, but only about human kindness. But Helen was talking about God. She meant exactly what she said. The power of her belief lay precisely in the fact that it was not a hypothesis to be tested, nor a poem to be admired, but a foundation to stand upon.

  So, how do we honor that today? How do we speak of her death without violating the very grammar of belief she held dear?

  We honor it by looking at the life that the belief produced. If religious belief is a picture that regulates a life, then the truth of that belief is found in the regulation itself. We see the truth of Helen's faith in the patience she showed difficult students. We see it in the way she forgave old grudges. We see it in the quiet confidence she brought to this very community, not because she was sure of the mechanics of heaven, but because she was sure of the authority of Love.

  For Helen, the Resurrection was not a loophole out of mortality; it was a demand on morality. It meant that nothing we do is lost. It meant that grief is real, but it is not absolute.

  To her colleagues here: she did not abandon her intellect at the church door. She brought her intellect to the altar to be sanctified, not silenced.
  To her family and church family: she did not check her skepticism at the door to make room for faith. She brought her faith to the world to make sense of the suffering, not to ignore it.

  She taught us that you do not need to prove the light exists in order to walk by it. You only need to walk. And Helen walked this path with a steady, unwavering gait.

  We miss her. We miss her laughter in the breakroom, and we miss her voice in the sanctuary. There is a silence where she used to be. But if we understand her as she asked to be understood, we know that silence is not an emptiness waiting to be filled with explanations. It is a space where her commitments continue to resonate.

  She lived by a promise. She did not treat that promise as a fact to be proven, nor as a story to be pretty. She treated it as a reality to be inhabited. And in that inhabitation, she made us all better. She made our department kinder, and she made our community deeper.

  We do not need to resolve the mystery of where she is now to know the truth of where she has been. She has been here, with us, living out the conviction that love is stronger than the grave. That was not a metaphor to her. That was the rule by which she played the game. That was the picture that held her captive.

  Let us comfort one another not by claiming we know what she knows now, but by remembering how she lived then. Let us hold to the same regulative picture that held her: that nothing done in love is wasted, and that the light she walked by is not extinguished by the closing of eyes.

  Rest in peace, Helen. Your work is done. Your picture remains. And we will keep walking by the light you showed us.

  Amen.
