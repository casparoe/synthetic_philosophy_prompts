answer: |-
  The fire had burned down to embers, casting long, shifting shadows over the scattered papers. Hobbes sat rigid in his chair, his hands resting on the head of his cane. Wallis stood by the table, tracing a diagram with a finger that hovered just above the ink.

  "You speak of quantities," Hobbes said, his voice dry as parchment. "But you cannot tell me what you are counting. A line, Mr. Wallis, is not a static thing. It is the tract of a moving point. It is motion frozen by definition."

  "And if I refuse to freeze it?" Wallis asked, not turning. "If I treat the line as composed of indivisibles? An infinite sum of parallels?"

  Hobbes tapped the cane. "Then you speak nonsense. There is no such thing as an indivisible magnitude. To say a line is made of points is to say a wall is made of no-bricks. You build your cathedral on nothing."

  "I build it to hold weight," Wallis countered, finally facing him. "Your definition is clean, Thomas. I grant you that. A line generated by motion is intelligible. But tell me: can your moving point measure the area under a hyperbola? Can it trace the path of a projectile subject to resistance? My indivisibles yield numbers. They predict. Yours yield definitions."

  "They yield certainty," Hobbes snapped. "Because we make the objects. We prescribe the motion. Therefore we know the cause. If you rely on these... these infinitesimal ghosts, you claim knowledge of effects without causes. You are a sorcerer counting sparks and calling it fire."

  Wallis leaned forward, resting his hands on the table. "And if the sparks light the room? You insist that geometry is merely civil philosophy in disguise. That because we construct the figures, we possess the same certainty as we do over contracts. But nature does not sign contracts. The planets do not move by covenant. If my method finds the true proportion of the circle to the square, even if I cannot fully articulate the metaphysics of the indivisible, have I not found truth?"

  "You have found a coincidence," Hobbes said. "And you invite error. If you allow undefined entities into geometry, men will allow undefined entities into law. They will speak of 'rights' and 'spirits' with no measurable bulk, no motion, no cause. They will quarrel over words."

  "And you," Wallis said softly, "would forbid the question because you cannot answer it within your mechanics. You say a point is a body whose bulk we ignore. But if it has bulk, however small, it is divisible. If it has no bulk, it cannot accumulate to make a line. You are trapped, sir. To maintain your certainty, you must deny the tools that extend our reach. You limit God's creation to what a human hand can trace."

  Hobbes looked away, toward the dark window. The accusation hung in the cold air. He knew the quadrature was disputed. He knew the Royal Society laughed. But the principle remained.

  "If I limit the tools," Hobbes said quietly, "it is because I have seen what happens when men wield tools they do not understand. You admit your foundations are obscure. You calculate in the dark."

  "We all calculate in the dark," Wallis replied. "Some of us are simply willing to admit it while we light the candle. You demand the sun before you will take a step. But the night is long, Thomas. And there are curves here that will not wait for your motion."

  Hobbes tightened his grip on the cane. He saw the truth in it: his geometry was safe, but it was small. Wallis's was vast, but it was shaky.

  "Then you shall have your curves," Hobbes said, standing slowly. "But do not call it science if you cannot say what it is. Call it what it is: a useful art. But do not ask me to sign the charter."

  Wallis gathered his papers, the rustle loud in the silence. "I do not need your signature. I need the sum to hold."

  "And I," Hobbes said, turning toward the door, "need the world to make sense."
