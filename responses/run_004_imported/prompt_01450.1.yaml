answer: |-
  This is a fascinating angle for a feature, and you have clearly done your homework on the philosophical literature. G.A. Cohen's work on the "clean hands" objection and R. Jay Wallace's development of moral standing are indeed central to this debate.

  However, there is a crucial misunderstanding in your premise that, if corrected, might actually make for a much richer story. The short answer to your question is that logic textbooks are still correct to label *tu quoque* a fallacy because the "standing to blame" literature **does not claim that hypocrisy negates the truth of the accusation.**

  The philosophers you cite are not arguing that a hypocrite's moral claim becomes *false*; they are arguing that the hypocrite loses the *authority* to assert it. Distinguishing between the **truth of the proposition** and the **felicity of the speech act** is the key to resolving the apparent conflict between academic ethics and critical thinking textbooks.

  Here is a breakdown of why the textbooks remain right, why the philosophers are talking about something different, and how this distinction could sharpen your feature.

  ### 1. The Logical Distinction: Truth vs. Standing
  Critical thinking textbooks classify *tu quoque* ("you too") as a fallacy because logic is concerned with the truth value of propositions, independent of the speaker.

  *   **Proposition:** "Flying private jets to climate summits increases carbon emissions and undermines climate goals."
  *   **Speaker:** A climate activist who flies private jets.

  If the activist makes this claim, logic textbooks ask: *Is the statement true?* The activist's behavior is irrelevant to the atmospheric physics or the economic impact of the flight. Therefore, pointing out the activist's hypocrisy does not logically disprove the statement. To treat it as a rebuttal is to commit an ad hominem fallacy (attacking the source rather than the argument).

  The "standing to blame" literature (Wallace, Cohen, Macalester Bell, etc.) is not doing logic; it is doing **normative ethics** and **speech-act theory**. They argue that while the *proposition* remains true, the *act of blaming* is infelicitous or inappropriate when coming from a hypocrite.

  When R. Jay Wallace argues that hypocrisy undermines standing, he is saying that the hypocrite violates a norm of reciprocity required for moral address. By violating the norm themselves, they forfeit the right to hold *others* to it. But they do not erase the norm itself.

  **The Journalistic Hook:** The conflict isn't between logic and ethics; it's between **validity** and **authority**. A hypocrite can be logically right but morally silenced.

  ### 2. What G.A. Cohen Actually Argued
  It is worth revisiting Cohen's specific argument regarding terrorism (specifically in his piece "Castro's Brain" and his broader work on egalitarian justice). Cohen was often concerned with how the *force* of a criticism is blunted by the critic's own behavior, not how the *truth* is negated.

  When Cohen discusses who has the right to condemn terrorism, he is exploring the **political efficacy and moral weight** of the condemnation. If a state that engages in state terrorism condemns non-state terrorism, the condemnation may be factually accurate (non-state terrorism is wrong), but it lacks **moral traction**.

  Cohen's insight is that moral discourse is a social practice, not just a truth-table exercise. In a social practice, consistency is a prerequisite for participation. But participating poorly (hypocrisy) doesn't change the rules of the game (the moral truth); it just gets you ejected from the role of "referee."

  ### 3. Why Textbooks Don't Change (And Shouldn't)
  Textbooks teach *tu quoque* as a fallacy because, in public discourse, it is overwhelmingly used to imply that **nothing is wrong.**

  *   **Valid Use of Standing:** "You cannot rightfully punish me for this infraction when you committed the same one yesterday." (This challenges the *authority* to punish.)
  *   **Fallacious Use of Tu Quoque:** "I didn't actually break the rules, because you break them too." (This challenges the *existence* of the rule.)

  Pundits and politicians rarely use the "standing" argument correctly. They rarely say, "Your point is true, but you have no right to say it." Instead, they say, "Your point is invalid because you are a hypocrite." This implies that the hypocrisy makes the climate change real or the deficit spending acceptable. That is logically false.

  If textbooks were to nuance the *tu quoque* entry based on the Wallace/Cohen literature, they would risk validating the much more common, fallacious usage where hypocrisy is treated as a moral eraser.

  ### 4. A Better Angle for Your Feature
  The tension you've identified is real, but it isn't a contradiction between philosophy and logic. It is a tension between **abstract moral truth** and **conversational legitimacy.**

  Your feature could explore why the public conflates these two things. When a politician is caught in hypocrisy, the public often reacts as if the policy they advocated is now tainted or false. This is a psychological and sociological phenomenon, not a logical one.

  **Potential narrative threads:**
  *   **The "Clean Hands" Premium:** Why do we instinctively feel that a moral claim is less "true" when the speaker is dirty? Is this a heuristic that usually serves us well (identifying insincere signaling) but fails in strict logic?
  *   **The Weaponization of Standing:** How bad actors use the sophisticated philosophical concept of "standing" to shield themselves from valid criticism. (e.g., "You can't criticize my emissions because you drive a car.")
  *   **The Cost of Hypocrisy:** Even if the *tu quoque* is a fallacy, does the loss of standing matter more than the truth? If a climate advocate loses all credibility due to private jet use, their ability to effect change vanishes. In public life, **authority often matters more than accuracy.**

  ### Summary for Your Research
  To answer your specific question: Logic textbooks still insist *tu quoque* is a fallacy because the "standing to blame" literature **does not vindicate the "look who's talking" defense as a truth-functional rebuttal.**

  The philosophers have established that hypocrisy negates the **right to blame**, not the **wrongness of the act**. Textbooks teach students to evaluate the act; philosophers are evaluating the relationship between the blamer and the blamed.

  If you frame your piece around this distinction—the gap between being *right* and having the *right to speak*—you will capture the nuance of the Wallace/Cohen literature without contradicting the basic tenets of logic. It turns the story from "Philosophers prove pundits right" to "Why we confuse moral authority with factual truth," which is a much more compelling investigation into public life.
