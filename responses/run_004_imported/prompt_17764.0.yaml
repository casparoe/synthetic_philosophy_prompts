answer: |-
  The Span was a ribbon of metal suspended between the orbital habitats of the Ostra and the Vex. It was narrow, barely wide enough for two loaded cargo sleds to pass if both pilots hugged the edges perfectly. For three centuries, the Ostra had lived in the spinward ring, and the Vex in the counter-spinward. They had never needed to cross until the water recyclers failed.

  Now, the Span was the only lifeline.

  Elara watched from the control booth as the first meeting occurred. An Ostra pilot, Kael, guided his sled along the starboard rail. He moved with the relaxed confidence of inherited habit. In the Ostra rings, everyone kept right. It wasn't law; it was simply how things were done. To go left was to invite collision, to signal confusion, to be wrong.

  Approaching from the other side was a Vex driver, Tolen. He hugged the port rail. In the Vex habitats, left was the only sane choice. The geometry of their docking bays made it natural, or so they claimed.

  They met in the center of the Span.

  Neither stopped. Why would they? Kael expected Tolen to stay left, because that was where Tolen belonged. Tolen expected Kael to stay right, because that was the safe path. They were both following a rule that ensured safety within their own populations, but here, the rules were mirror images. The sleds scraped, sparks showering into the void, and locked bumpers.

  It wasn't malice. It was a failure of anticipation.

  Elara opened the comms channel. "Back up," she ordered. "Both of you."

  "I am on the correct side," Kael said, his voice tight. "He is drifting."

  "I am holding the line," Tolen countered. "He is encroaching."

  Elara sighed. She had read the archives. She knew that before the habitats split, the ancestors had simply agreed to keep right. But over generations, the Vex had drifted—literally and socially. Their convention had flipped. Neither side was physically superior. The metal was symmetrical. The gravity was artificial. There was no sun to guide them, no heart side to favor. The choice was utterly arbitrary, yet now it felt as solid as gravity.

  "Turn off your engines," Elara said. "We need to talk."

  They met in the airlock midway across the Span. Three people: Elara, the neutral mediator; Kael, representing the Ostra; and Tolen, representing the Vex. The tension wasn't hostile, but it was bewildered. They couldn't understand how the other side could be so consistently wrong.

  "It's about visibility," Kael argued, gesturing with his hands. "When you keep right, your dominant hand is toward the wall, ready to brace. It's natural."

  Tolen shook his head. "If you keep left, your dominant hand is toward the open space. You can signal or grab a rail if you slip. It's safer."

  Elara listened. They were rationalizing the arbitrary. They had built entire logic structures on top of a coin flip that happened centuries ago. This was the core of the problem. For a norm to hold, everyone must expect everyone else to follow it. But here, Kael expected Tolen to follow Ostra norms, and Tolen expected Kael to follow Vex norms. There was no common knowledge. They didn't know that the other didn't know.

  "We need a new rule," Elara said. "For the Span."

  "Then adopt ours," Kael said. "It's the original standard."

  "Yours causes drift in our mag-locks," Tolen replied. "Ours is adapted to current tech."

  They talked for hours. They tried to vote, but conventions aren't decided by ballots. A rule only works if you know the other person will follow it even when you aren't watching. A vote doesn't create expectation; only consistent action does. They tried to draw lots. They flipped a coin. Heads for Right, Tails for Left.

  It came up Heads.

  Kael nodded, satisfied. Tolen frowned. "A coin doesn't move sleds," he said. "Tomorrow, when the pressure is on, will your people remember? Will mine?"

  He was right. A convention relies on precedent. It needs a history of success to reinforce the expectation. One coin flip wasn't history. It was just noise.

  The deadlock broke three days later, not by agreement, but by accident.

  A micrometeoroid struck the starboard rail of the Span, halfway across. It didn't breach the hull, but it sheared off the guidance magnets on the right side. Suddenly, keeping right was dangerous. The sleds would shudder and drift toward the center.

  Keeping left, however, was smooth. The port rail was untouched.

  Elara watched the next transit. An Ostra pilot approached the damage. He instinctively started to hug the right, then felt the shudder. He corrected, moving left. A Vex pilot approached from the other side. He was already on the left. They passed each other smoothly, without stopping, without signaling.

  Elara waited for the complaint. She waited for Kael to call and say the Ostra couldn't accept the Vex way.

  The call never came.

  A week later, the magnets on the right were repaired. Elara stood in the booth, watching a new pair of pilots approach. Both were Ostra. Both moved to the left side of the Span.

  She checked the logs. The Vex had never switched. They had always been on the left. But the Ostra had shifted. Why? Because for three days, the left side was the only one that worked. The accident had created a new salience. It made one option "stick out" not because it was better in principle, but because it was the only one that functioned during the crisis.

  Now, the Ostra expected the Vex to be on the left, because the Ostra were now on the left. The Vex expected the Ostra to be on the left, because they always had been. The expectations had aligned. The common knowledge was restored.

  Elara looked at the empty Span. The damage was gone. The right side was perfectly safe. But no one used it.

  She realized then how fragile the whole thing was. It wasn't about logic, or safety, or even the coin flip. It was about the moment when everyone realized everyone else had moved. The convention hadn't been chosen; it had crystallized around a glitch. And now, even though the glitch was fixed, the crystal remained.

  She opened a channel to Kael. "You know the right rail is fixed, don't you?"

  "Yes," Kael said.

  "Your people could go back. It's what you grew up with."

  There was a pause. "And meet a Vex driver who expects me on the left? No. That's not how we do things now."

  "But it was how you did things."

  "It was," Kael agreed. "But now we do this."

  Elara closed the channel. The old precedent was dead. The new one was alive. It didn't matter that the solution was arbitrary. It didn't matter that the reason for the switch was a random meteoroid. What mattered was that now, when two pilots met, they didn't hesitate. They knew what the other would do. They knew the other knew what they would do.

  The Span was quiet. The coordination problem was solved, not by reason, but by the quiet, heavy weight of having done it once before, together.
