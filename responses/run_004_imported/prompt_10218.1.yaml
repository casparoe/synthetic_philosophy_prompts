  Actually, the complementary event ($A$ and $\neg A$) is the punchiest for a short story. It highlights the tension between hope and rigor.
  Elias assigns $P(\text{Success}) = 0.8$ and $P(\text{Failure}) = 0.4$. Why? Because he wants success, but respects the possibility of failure. The sum is 1.2.
  The Bookie sells him a ticket paying \$1 if Success for \$0.80.
