answer: |-
  This is a fantastic rabbit hole to fall down, and honestly, it's a much better use of your time than grading undergraduates who think *Leviathan* is a biblical reference. You've hit on one of the central tensions in Hobbes scholarship: the relationship between his epistemology, his mathematics, and his political theory.

  Here is my take on both fronts.

  ### 1. Geometry and Civil Philosophy: Same Warrant or Rhetorical Theft?

  You are right to suspect that this isn't just Hobbes borrowing the *prestige* of geometry to dress up politics. It is the **same epistemic warrant**, grounded in what later gets called the *verum factum* principle (the true is the made), though Hobbes doesn't use that exact phrase.

  For Hobbes, *scientia* (scientific knowledge) is knowledge of consequences from known causes.
  *   **In Natural Philosophy (Physics):** We see effects (motion, light, heat) and reason backward to possible causes. Because we did not create nature, we cannot be certain our inferred causes are the *actual* causes. God could have produced these effects via mechanisms we can't conceive. Thus, physics is always conjectural.
  *   **In Geometry:** We define the object (e.g., a circle) and we generate it (by rotating a line around a point). Because we stipulated the definition and performed the generation, we know the cause perfectly. The truth is internal to the construction.

  **The Move to Politics:**
  Hobbes's genius (or audacity) in *Leviathan* and *De Cive* is treating the Commonwealth not as a natural growth (like a family or a tribe) but as an **artifact**.
  *   We construct the Commonwealth via Covenant.
  *   We authorize the Sovereign.
  *   Therefore, the Sovereign's will *is* our will (artificially unified).

  Because we made the Commonwealth, we can know its "properties" (rights, laws, duties) with geometric certainty. We don't need to look at history to see what works (that's prudence, not science); we need to look at the logical implications of the Covenant. If you covenant to obey, you cannot logically claim a right to disobey without contradiction.

  **The Catch:**
  However, there is a disanalogy that Hobbes struggles with. In geometry, the "matter" (the paper, the mind) is passive. In civil philosophy, the "matter" is human beings, who have their own internal motions (passions) that resist the geometric structure.
  *   **Verdict:** It is not merely rhetorical. Hobbes genuinely believes civil philosophy is demonstrative *because* it is constructive. However, he admits in *De Corpore* that while the *science* of justice is certain, the *practice* is harder because human matter is unruly. So, the epistemic warrant is the same, but the ontological resistance is higher.

  ### 2. The Wallis Saga: Stubbornness or Epistemic Flaw?

  Your advisor is giving you the standard "charitable reconstruction" view: a philosopher of math can be bad at math. (Think of Wittgenstein being terrible at calculations, or Frege's logicism being undermined by Russell's paradox). In that sense, Hobbes failing to square the circle doesn't logically invalidate his claim that geometry is certain *if* done correctly.

  **However, I think your intuition is sharper here.** The Hobbes-Wallis controversy isn't just about a calculation error; it reveals a crack in Hobbes's specific theory of *why* geometry is certain.

  **The Materialist Glitch:**
  Hobbes was a thoroughgoing materialist. For him, there are no abstract objects. A "line" is the trace of a moving body. A "point" is a body considered without magnitude.
  *   **Wallis (and the mainstream):** Geometry deals with abstract quantities independent of physical bodies.
  *   **Hobbes:** Geometry is the study of **motion**.

  Hobbes's failed attempts to square the circle often stemmed from conflating physical magnitude with mathematical proportion. He treated geometric proofs as if they were mechanical problems. When Wallis pointed out the errors, Hobbes didn't just dig in out of pride; he dug in because admitting the error would require admitting that his **materialist ontology of mathematics** was flawed.

  **The Epistemic Trap:**
  This connects back to your first question. Hobbes thinks geometry is certain because *we construct it*. But in his old age, Hobbes became convinced that his *own* construction was the only valid one.
  *   If certainty comes from internal construction, how do we adjudicate between two conflicting constructions?
  *   Hobbes's answer tends toward: "My construction follows the true motion; yours is abstract nonsense."

  The saga suggests that Hobbes's theory of geometric certainty contains a **solipsistic risk**. If knowledge is guaranteed because *I* made the definitions, I become immune to external correction. The Wallis controversy shows that Hobbes's "constructive certainty" blinded him to public verification. He trusted the certainty of his own deductive chain over the consensus of the mathematical community.

  **So, is it separable?**
  *   **Logically:** Yes. You can have a true theory of knowledge and be a bad practitioner.
  *   **Historically/Psychologically:** No. Hobbes's specific theory of geometry (as kinematics/motion) *caused* his errors. He couldn't square the circle partly because he refused to treat geometry as anything other than the study of physical motion.

  ### How to use this while grading

  If you see a student arguing that Hobbes is just using geometry as a metaphor for politics, push them on the **artifact** argument. The Commonwealth isn't *like* a circle; it is an artifact *made* like a circle.

  If you see a student bringing up the Wallis controversy, tell them to be careful not to dismiss Hobbes's math as just "bad." It was "bad" in a way that was **philosophically consistent** with his materialism. He wasn't bad at *their* geometry; he was refusing to play *their* game because he thought their game was metaphysically unsound.

  **Summary for your sanity:**
  1.  **Politics/Geometry:** Same warrant. Both are constructive sciences (*scientia* of the made). Politics is harder only because the "matter" fights back.
  2.  **Wallis:** Your advisor is technically right (theory $\neq$ practice), but you are philosophically right (Hobbes's practice failed *because* of his specific theory of what geometry is).

  Now, go grade those papers. If any of them mention "state of nature" without defining it as a war of "every man against every man," you have my permission to channel Hobbesian severity.
