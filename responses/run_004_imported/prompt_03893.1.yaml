answer: |-
  The glass booth hummed, a low frequency that Elara felt in her teeth. Across the desk, the Broker slid a tablet toward her. The screen displayed two options, stark and white against the black background.

  **Option A:** $100 credited immediately.
  **Option B:** $150 credited in 30 days.

  Elara didn't hesitate. Her hand hovered over Option B. Thirty days was nothing. A month of patience for fifty percent growth was rational. It was the kind of choice her future self would thank her for. But the interface demanded a commitment fee. To ensure she didn't panic when the month felt long, she had to lock the choice.

  **Commitment Fee:** $10.

  She tapped *Confirm*. The machine whirred, printing a slip of paper that felt heavier than it should. It stated that access to Option A was now revoked. Elara pocketed the slip. She felt virtuous, solid, a single unified entity extending through time. She left the booth, the glass door sealing behind her with a pneumatic hiss.

  The waiting room was circular, windowless. There were no clocks, only a digital counter on the wall ticking down the seconds. 29 days, 23 hours, 59 minutes.

  Elara sat. She read magazines that smelled of ozone. She slept in chairs that molded to her spine. As the counter dropped, the room seemed to shrink. The air grew thicker. The rational certainty of the booth felt like a memory belonging to someone else, someone who wasn't currently hungry, someone who didn't feel the itch of immediate need buzzing under their skin.

  When the counter hit 24 hours, Elara stood up. The $150 was tomorrow. The $100 was... well, it was gone. Locked away by a woman who didn't understand what it felt like to be here, now, in the crunch of the present.

  She walked back to the glass booth. The Broker was there again. Or perhaps a different Broker; the suit was the same shade of grey, the smile the same width of white.

  "I need to access Option A," Elara said. Her voice sounded thinner than it had a month ago.

  "Option A was revoked," the Broker said, tapping a keyboard. "You paid to revoke it."

  "I know. I want to undo the revocation."

  "That incurs a penalty. A liquidity release fee."

  Elara watched the screen. The numbers swam. If she paid the fee, she could have the money today. Not the $150 tomorrow, but the $100 today. The difference between today and tomorrow felt like the difference between life and death. The $150 was a promise; the $100 was a heartbeat.

  **Release Fee:** $15.

  She had already paid $10 to lock the choice. Now she was paying $15 to unlock it. Total cost: $25.
  If she took the $100 now, she would net $75.
  If she had just taken Option A at the start, she would have $100.
  If she had waited for Option B, she would have $140 ($150 minus the initial fee).

  She was losing money. She knew she was losing money. The arithmetic was simple, flat, and undeniable. But the urge was not arithmetic. It was a hunger that lived only in the present tense.

  "Proceed," she whispered.

  The Broker didn't judge. He simply processed. The machine whirred again. A new slip printed. **Option A Activated. Funds Transferred.**

  Elara took the slip. She felt lighter, unburdened by the future, but her wallet felt physically thinner. She turned to leave the booth.

  "Will you be joining us next cycle?" the Broker asked. His tone was casual, like a grocer asking about tomatoes.

  Elara paused at the door. Next cycle. There was always a next cycle. A new project, a new diet, a new savings goal. She knew, with a chilling certainty, that when she stood outside this room, looking back at the waiting period from the perspective of safety, she would want to be the person who waits. She would want the $150. She would want to lock the door.

  But she also knew that when she was inside the wait, when the future was a day away and the present was a screaming need, she would want to be the person who takes.

  "Maybe," Elara said.

  "It's common," the Broker said, leaning forward slightly. "Some say you're the same person making a mistake. Others say the Elara who signed the first paper isn't the Elara signing the second. Different preferences, different times. Like trading with a stranger."

  Elara looked at her reflection in the glass door. The woman staring back looked tired. Her eyes were the same color as the woman who had entered thirty days ago, but the expression was different. The first woman was hopeful, disciplined. This woman was relieved, depleted.

  "Did I make a mistake?" Elara asked the reflection.

  The reflection didn't answer. It only mouthed the words along with her, slightly out of sync.

  "If you're the same person," the Broker called out from the desk, "you've just paid twenty-five dollars to lose twenty-five dollars. That's irrational."

  "And if I'm not?" Elara asked, without turning around.

  "Then you've just been exploited by a market inefficiency between two distinct agents. The past Elara sold a constraint to the future Elara, and the future Elara bought it back at a premium. Both acted rationally according to their own temporal coordinates."

  Elara pushed the door open. The hallway outside was bright, blindingly so. She held the slip for the $100 in one hand and the receipt for the $25 in fees in the other. She crumpled them together in her fist.

  She walked toward the exit, where a new terminal waited. It flashed a new offer. **$100 Today vs $150 in 30 Days.**

  Elara stopped. Her hand twitched. Part of her wanted to walk away, to keep the $75 net and leave. Another part, the part that felt like a stranger living in her skin, felt the pull of the cycle beginning anew. The woman who wanted the future was waking up, even as the woman who wanted the present walked away.

  She stepped toward the terminal. She wasn't sure who was driving.
