answer: |-
  This is a remarkably sharp observation, especially for someone coming at it without formal training. You have put your finger on the exact hinge upon which Hobbes's entire philosophical system turns. Many professional philosophers miss the connection between his geometry and his politics, treating them as separate interests. You are right to suspect they are the same project.

  Given your background as a machinist, you actually have an advantage in understanding Hobbes. You know the difference between looking at a finished part and knowing the cuts that made it. You know that a blueprint isn't just a picture; it's a set of instructions for generation.

  Here is how those two ideas you identified fit together, how they explain his politics, and finally, how they shed light on that embarrassing, decades-long fight with John Wallis.

  ### 1. Geometry as "Making," Not "Finding"

  To understand Hobbes, you have to understand what he hated about the traditional view of geometry (and philosophy). The traditional view, going back to Plato, was that truths exist "out there" in a realm of ideals. A circle exists perfectly in the universe of forms, and we just try to glimpse it.

  Hobbes, the materialist, rejected this. He believed nothing exists but **body in motion**.

  This leads to your first point: **Generative Definitions.**
  Euclid defines a line as "length without breadth." To Hobbes, that is nonsense. You cannot have length without breadth in the real world; that is an abstraction that refers to nothing. For Hobbes, a definition must tell you **how the thing is caused.**
  *   **Euclid:** A circle is a set of points equidistant from a center. (Static description)
  *   **Hobbes:** A circle is the shape traced by a point moving around a fixed center while keeping a constant distance. (Dynamic generation)

  For a machinist, this is the difference between measuring a finished shaft and knowing the tool path on the lathe that cut it. Hobbes believed you only truly *know* the shaft if you know the cut. If you know the cause (the motion), you necessarily know the effect (the shape).

  ### 2. Certainty Comes from Construction (*Verum Factum*)

  This leads to your second point: **We know best what we make.**
  This is the epistemological engine of Hobbes's system. He argues that God has certain knowledge of the natural world because **God made it.** Humans, however, did not make nature. We can observe it, but we can never be truly certain about it because we don't know the "tool path" God used to create the universe. We can guess (hypothesize), but we can't know.

  So, where can humans have certain knowledge? Only in domains where **we are the creators.**
  1.  **Geometry:** We define the points and lines. We construct the figures in our minds (or on paper). Because we imposed the rules, we can be certain of the results.
  2.  **Civil Philosophy (Politics):** This is the crucial leap. Hobbes argues that the Commonwealth (the State) is not a natural organism like a beehive. It is an artifact. It is an "Artificial Man," as he calls it in the Introduction to *Leviathan*. We construct it via covenant (contract).

  **The Connection:**
  Because the Commonwealth is something we *construct* (like a geometric figure), we can have scientific certainty about it. We can know exactly how it must work, just as we know a triangle's angles must add up to 180 degrees.
  *   If you define a Sovereign as the entity with absolute power to keep the peace, and you define human nature as competitive and fearful, you can deduce with geometric certainty that undermining the Sovereign leads to civil war.
  *   Politics becomes a deductive science, identical in method to geometry.

  For Hobbes, this wasn't just a metaphor. He believed he had done for politics what Euclid did for geometry: he found the axioms (human nature, the state of nature) and derived the necessary conclusions (absolute sovereignty).

  ### 3. The Wallis Dispute: Pride or Philosophy?

  Now, let's look at the disaster with John Wallis. As you noted, Hobbes was objectively wrong. Squaring the circle is mathematically impossible (as was proven later regarding the transcendental nature of $\pi$). Wallis, a brilliant mathematician, dismantled Hobbes's proofs repeatedly.

  Was this just wounded pride? Or was something deeper at stake?

  **The Case for Wounded Pride:**
  Hobbes was in his 60s and 70s during this feud. He was famous, wealthy, and used to being the smartest man in the room. Wallis was younger, Presbyterian (a group Hobbes despised), and represented the university establishment Hobbes loved to mock. Hobbes often insulted Wallis, calling him a "teacher of accounts" rather than a philosopher. There is no doubt ego was involved.

  **The Case for Philosophical Commitment:**
  However, your intuition is correct: simple stubbornness doesn't explain the *duration* and *intensity* of the feud. If geometry is the foundation of your entire claim to scientific truth, you cannot afford for your own geometry to be shaky.

  Consider what a concession would mean for Hobbes's system:
  1.  **The Method is Flawed:** Hobbes believed his method of "resolutive-compositive" reasoning (breaking things down to causes and building them back up) was infallible. If he applied this method to a geometric problem and got a false result, it suggests the method itself is broken.
  2.  **The Analogy Collapses:** If Hobbes cannot achieve certainty in geometry (the domain where humans *should* be God-like creators), then his claim that he can achieve certainty in politics (the other domain of human creation) is weakened. If the "model science" is corrupt, the "political science" built on its image is suspect.
  3.  **The Nature of Error:** Hobbes had a specific theory of error. He believed error comes from improper use of language (misdefined terms). To admit he was wrong about the circle would be to admit he didn't know the meaning of his own definitions. For a philosopher who built his system on precise definitions, this is catastrophic.

  **The Machinist Perspective:**
  Imagine you have designed a new jig for a lathe. You have calculated the cuts based on your understanding of the metal and the tool. A younger apprentice tells you the jig won't work. If you admit the jig is wrong, you aren't just admitting a math error; you are admitting you don't understand the machine.
  Hobbes viewed Wallis not as a fellow geometer, but as someone shuffling symbols without understanding the *bodies in motion* underneath. Hobbes thought Wallis was doing "accounting," not geometry. Hobbes believed that as long as his reasoning about *motion* was sound, the numerical result had to be right. He essentially prioritized his philosophical physics over the algebraic proof.

  ### 4. Is This a Fair Reading?

  You asked for an honest sense of whether this credits him with too much coherence.

  **Yes, it is a fair reading of his *intent*, but no, it does not excuse the *conduct*.**

  It is fair to say that Hobbes wasn't just being petulant; he was defending the structural integrity of his life's work. He genuinely believed that if he yielded to Wallis, he was yielding ground to the "darkness" of scholasticism and religious dogma that he spent his life fighting. He saw himself as the defender of Reason itself.

  However, it is **unfair** to suggest his position was coherent *mathematically*. Here is where the reading must be critical:
  Hobbes conflated **conceptual construction** with **physical possibility**.
  *   In his head (and on paper), he could construct a square with the same area as a circle. He could trace the motion.
  *   But he failed to recognize that some motions are impossible to resolve into straight lines, no matter how you define them.

  He treated geometry as a branch of philosophy (reasoning about names and consequences) rather than a branch of mathematics (quantitative relationships). Wallis was doing math; Hobbes was doing metaphysics disguised as math.

  **The Verdict:**
  You are right to reject "plain stubbornness" as the sole explanation. It was **philosophical desperation.**
  Hobbes had staked everything on the claim that human reason, when properly applied to things we construct, yields absolute truth. To admit he failed at the one thing he claimed was the gold standard of absolute truth would have been to admit that *Leviathan* was built on sand.

  He chose to look like a fool to mathematicians rather than a skeptic to philosophers. He preferred to be a wrong geometer than a uncertain political theorist.

  ### Summary for the Machinist-Philosopher

  1.  **Generative Definitions:** Hobbes wanted definitions that were like tool paths, not blueprints. He wanted to know *how* the shape was cut, not just what it looked like.
  2.  **Certainty:** We know what we make. We make geometry and states. Therefore, we can know them with certainty. We cannot know nature (God's make) with certainty.
  3.  **The Wallis Feud:** Hobbes couldn't admit he was wrong about the circle because the circle was the foundation of his claim to know the State. If his geometry was fallible, his politics were just opinions.
  4.  **Fairness:** It is a coherent philosophical motive, but it led him into incoherent mathematics. He let his metaphysics blind him to his math.

  It is a tragic irony: The man who demanded rigorous proof above all else spent his final decades defending a proof that didn't exist, because he couldn't bear the thought that the "Science of Justice" he built might rest on a geometric impossibility.
