answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain taps against the window. ALEX (retired paleontologist) sits with ELENA (Epistemicist) and SAM (Supervaluationist). Coffee cups are scattered with napkins covered in stratigraphic columns.*

  **Alex:** So, that's the itch. I have a stratigraphic column. Layer 1 has *Ancestralus robustus*. Layer 100 has *Descendantus gracilis*. In between, every layer blends into the next. If I name a species boundary between Layer 50 and 51, I'm lying. There is no biological event there. But if I don't name it, I can't write the paper. I realized recently: I've been living inside the Sorites paradox for three decades.

  **Elena:** And you suspect there is no fact of the matter about where the species ends?

  **Alex:** Exactly. It's a smooth slide.

  **Elena:** I disagree. There *is* a specific specimen—let's say Specimen 4,392 in your sequence—that is the last *robustus*. The very next one, 4,393, is the first *gracilis*. The boundary is sharp. We just cannot know where it is.

  **Alex:** That feels like metaphysics detaching from reality. If the boundary is unknowable, what explanatory work does it do? It doesn't help me classify the fossil. It doesn't predict morphology. It's a "fact" that makes no difference to the science. Why posit a magic line?

  **Elena:** It's not magic; it's the nature of reference. Our terms like "*robustus*" are fixed by causal chains and usage. Those facts determine a unique extension, even if the properties involved are similar. The "work" the boundary does is preserving classical logic. If you deny the sharp cutoff, you deny bivalence. You have to say "Specimen 4,392 is *robustus*" is neither true nor false.

  **Alex:** And if I deny bivalence?

  **Elena:** Then logic breaks down at the margins. You lose the Law of Excluded Middle. Science relies on deduction. If premises can be "gappy," valid arguments become invalid. Epistemicism saves logic by locating the vagueness in our *knowledge*, not the *world*. The boundary explains why you feel compelled to draw a line, even if you can't find it. You're sensing a real cutoff that your margin-for-error principles prevent you from locating.

  **Sam:** But Elena, that assumes the world is sharper than our access to it. Alex just said the biology is a smooth slide.

  **Alex:** Right. The variation is continuous.

  **Sam:** That's why Supervaluationism fits your case better. There is no single sharp cutoff. Instead, there are many "admissible precisifications" of the term *robustus*. On one precisification, the cutoff is at Specimen 4,390. On another, it's 4,410. As long as the cutoff falls within the range of what's semantically acceptable, it's admissible.

  **Alex:** So when is a statement true?

  **Sam:** A statement is "supertrue" only if it is true on *all* admissible precisifications. "Specimen 1 is *robustus*" is supertrue. "Specimen 10,000 is *robustus*" is superfalse. But "Specimen 4,392 is *robustus*" is indeterminate. It's true on some precisifications, false on others. This captures the "smooth slide" you see without forcing a magic line.

  **Alex:** I like that. It matches the data. But I've been reading the critiques. Isn't "admissible" itself vague? Where does the range of admissible cutoffs start? If you draw a line around the admissible cutoffs, haven't you just pushed the vagueness back a step?

  **Sam:** That's the higher-order vagueness problem. And I'll concede: yes, "admissible" is vague. There is no sharp boundary between the admissible precisifications and the inadmissible ones.

  **Alex:** So you haven't solved the paradox. You've just expanded it.

  **Sam:** Not solved it, no. Philosophy rarely solves science's problems. But I've modeled it more faithfully than Elena. Epistemicism posits a cliff where there is a slope. Supervaluationism allows for slopes all the way up. We can iterate the semantics. We can supervaluate over the precisifications of "admissible." It's vague all the way up, which matches your fossil record. The cost is giving up bivalence for borderline cases, but the gain is a semantics that doesn't require unknowable biological miracles.

  **Elena:** But Sam, if "admissible" is vague, then your semantics are unstable. You're building a theory of truth on a foundation of sand.

  **Sam:** Better sand than a hidden cliff. Alex, does your fossil record look like it has hidden cliffs?

  **Alex:** No. It looks like sand. Shifting, overlapping sand.

  **Elena:** But Alex, when you write your paper, you *do* draw a line. You act as if there is a fact of the matter. You argue with colleagues about whether a specimen belongs here or there. If it were truly indeterminate, why argue?

  **Alex:** Because we need to communicate. We need boxes to put things in.

  **Elena:** Precisely. The epistemic view explains the *practice* of taxonomy. We are trying to track real boundaries, and we fail because of ignorance. The supervaluationist says we're just picking conventions. But you feel like you're *discovering*, not *stipulating*.

  **Alex:** I do feel like I'm discovering. But I also know that if I find a new specimen right on the line, I can't prove which box it goes in.

  **Sam:** And that's the truth-value gap.

  **Elena:** That's the margin of error.

  **Alex:** (Sips cold coffee) So, Elena says the line is there, but I'm blind. Sam says the line isn't there, but my logic needs to account for the fog.

  **Elena:** I say the line is there, and logic is safe.

  **Sam:** I say the fog is real, and logic needs to be flexible enough to describe it.

  **Alex:** Well. In paleontology, if you find a bone you can't classify, you put it in a box marked "aff." *robustus*. Affinis. Related to.

  **Sam:** A truth-value gap.

  **Elena:** A placeholder for unknown knowledge.

  **Alex:** (Smiles) You two could argue over a single bone for hours.

  **Elena & Sam:** (In unison) Yes.

  **Alex:** Good. At least some things never change.
