      *   *Sam (Supervaluationist):* "Disagreement is about which precisification to adopt. There is no fact of the matter. 'Admissible' covers a range."
      *   *Alex:* "But isn't 'admissible' vague? Where does the range end?"
      *   *Sam:* (Needs strong response) Yes, higher-order vagueness exists. But we can supervaluate over the precisifications of 'admissible'. It's vague all the way up. That matches the smooth slide you see in the fossils. Epistemicism posits a cliff where there is a slope.

  6.  **Polishing:**
