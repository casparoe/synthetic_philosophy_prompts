  **Move 1 (Nadia): +1**
  Clinically standard and intuitive, but philosophically vulnerable. She asserts a teleological function ("job is to... let go") without defending why that specific endpoint is the design goal rather than, say, survival at any cost.

  **Move 2 (Marcus): +2**
  Philosophically precise. He correctly identifies the "etiological function" problem and cites real, competing evolutionary hypotheses (analytical rumination, social risk) that undermine the claim that depression is inherently a failure of design.

  **Move 3 (Nadia): +2**
  Strong clinical boundary-drawing. She successfully distinguishes between adaptive low mood and severe, endogenous pathology (suicidality), noting that selection pressures rarely favor self-destruction, which rescues the "malfunction" claim for severe cases.

  **Move 4 (Marcus): +1**
  Logically valid critique of Nadia's consistency. He catches her shifting from an evolutionary definition of function to a pragmatic one, though in clinical practice, this shift is often necessary rather than dishonest.

  **Move 5 (Nadia): +1**
  Pragmatically honest but theoretically loose. She abandons the evolutionary battle to focus on harm and impairment, which is how medicine is often practiced, but this leaves her open to the charge of pathologizing normal suffering.

  **Move 6 (Marcus): +2**
  Theoretically dominant. Invoking Wakefield's "Harmful Dysfunction" analysis is the gold standard in this debate; the grief counter-example effectively demonstrates why "harm" alone is insufficient to define a disorder.

  **Move 7 (Nadia): +1**
  Clinically robust recovery. She attempts to define dysfunction via phenomenology (tracking/fading) rather than evolutionary history, which is actionable for a clinician, even if it doesn't fully satisfy the philosophical requirement for "dysfunction."

  ***

  ### The Verdict for Your Narrator

  This is a **genuine standoff**, not a debate with a clear winner. In the philosophy of psychiatry, this is essentially the unresolved tension between *Naturalism* (Wakefield/Marcus: disorders require a biological/evolutionary failure) and *Normativism* (Nadia: disorders are defined by social harm and impairment).

  For your novel, however, **Marcus's position is the better engine for your narrator's crisis.** If your narrator is starting to distrust her diagnoses, Marcus's arguments provide the intellectual scaffolding for that doubt. He shows her that her labels might be moral judgments disguised as medical facts. However, she cannot *practice* medicine using Marcus's framework; she needs Nadia's pragmatism to actually treat patients.

  **Recommendation:** Don't have your narrator decide who is right. Have her realize that Nadia is right *in the clinic* (you must act to stop harm) but Marcus is right *in the study* (you cannot claim to know the machine's design). The tragedy—and the source of your narrator's unraveling—is that she has to treat patients as if Nadia is right while secretly fearing Marcus is. That cognitive dissonance is richer fiction than a conversion to one side.
