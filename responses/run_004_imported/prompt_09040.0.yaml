answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Dr. Elena Vance (Behavioral Psychologist) and Dr. Marcus Thorne (Game Theorist) are having coffee. The conversation has turned to a mutual acquaintance's recent disastrous experience buying a house.*

  **Elena:** It's a textbook case, Marcus. Truly. They set a cap, broke it, reset the cap, broke it again. Four times. They weren't calculating odds; they were managing regret. Every time they stopped bidding, they faced the certainty of losing the deposit of effort *and* the house. The next bid bought them temporary relief from that pain. That's escalation of commitment. It's internal.

  **Marcus:** It's internal only because the external structure gets under the skin. You're describing the symptom, not the disease. What your friends experienced was the Dollar Auction. Shubik didn't design that game to expose a psychological quirk; he designed it to expose a hole in rational choice theory. Once two players are in, the Nash equilibrium doesn't say "stop." It says the game is unstable.

  **Elena:** Unstable for whom? For a computer? Look, I know the payoff matrix. Bidder A is at 90 cents, Bidder B is at 95. The dollar is worth 100. If A stops, A loses 90 cents. If A bids $1.05, A might win the dollar for a 5-cent loss, which is better than losing 90. So they bid. But this relies on the assumption that the opponent is rational and will eventually fold. In reality, people bid up to five dollars for a single dollar bill. That's not equilibrium; that's madness. A rational agent shouldn't even sit at the table.

  **Marcus:** Agreed. The *entry* is the mistake. But you're conflating "rational" with "omniscient." In a War of Attrition model—which this effectively is once the bids pass the dollar's value—the mixed strategy equilibrium implies a distribution of bid lengths. Yes, the mean might be low, but the tail is long. High bids *do* occur in equilibrium. The structure permits them. If the incentives didn't drive it, you wouldn't see the bids correlate so tightly with the penalty rule. When you remove the rule that the second-highest bidder pays, the runaway bidding vanishes. If it were just a "bias," it should persist regardless of the second-place penalty. But it doesn't. It tracks the payoff structure.

  **Elena:** That's a strong point, I'll give you that. The behavior tracks the incentives. But a lever only works because there's a hand to pull it. The incentive structure is the lever; the sunk cost fallacy is the hand. You say the structure *permits* high bids in equilibrium. I say the structure *exploits* a specific cognitive vulnerability: loss aversion. We weigh losses twice as heavily as gains. Losing 90 cents feels worse than losing 90 cents plus the effort of bidding again.

  **Marcus:** But why does it happen even when people know the theory? I've run this in class. I explain the trap. I tell them, "Do not bid past a dollar." They nod. Someone bids 20 cents. Someone else bids 30. Within five minutes, they're at $3.50. They know the math, Elena. The knowledge doesn't inoculate them. That suggests the logic of the situation overrides the individual psychology. It's a systemic trap, not a user error.

  **Elena:** Knowing the map doesn't stop you from falling into the hole if you're running from a bear. Here's my counter-evidence, Marcus. We see this escalation in solitary decisions. No opponent. No second-place penalty. A company pours millions into a failing project just because they've already spent millions. There is no other bidder forcing them to pay for their failure. The "opponent" is just reality. If your game theory explanation requires a strategic adversary to force the escalation, how do you explain the solitary sunk cost trap?

  **Marcus:** That's a category error. The Dollar Auction is a specific game with specific rules. The solitary project failure is an optimal stopping problem under uncertainty.

  **Elena:** Is it? Or is it the same mechanism? In the solitary case, the decision-maker is fighting their past self. The "second highest bidder" is their own historical investment. They feel they have to pay the cost of their past decisions to validate them. If the mechanism were purely structural—dependent on an external opponent's threat—solitary escalation shouldn't exist. But it does. It suggests the "trap" is actually a feature of how human brains process time and commitment, not just how payoffs are arranged.

  **Marcus:** I'll concede that the *intensity* of the escalation might be amplified by psychology. But the *direction* is determined by the game. Let's go back to your friends and the house. You say it's bias. But consider the market as the opponent. The market doesn't care about their feelings. The market presents a price. If they walk away, they lose the inspection fees, the time, the emotional energy—that's the "second place payment." If they bid higher, they risk more money but retain the chance of the asset. Given that housing is an appreciating asset, unlike a dollar bill, the expected value calculation actually shifts. Maybe they weren't irrational. Maybe the game changed.

  **Elena:** Ah, but that's the rationalization! That's the post-hoc story they tell themselves to sleep at night. "The house was worth it." But they admitted, afterwards, they blew their budget. They violated their own utility function. You're defending them as rational agents who updated their priors. I'm looking at them as stressed mammals who couldn't bear the pain of withdrawal.

  **Marcus:** I'm not defending them. I'm saying calling it a "bias" lets the structure off the hook. If we call it a bias, the solution is "think better." "Don't be emotional." That's useless advice. If we call it a structural incentive problem, the solution is "don't play games where the second-place bidder pays." That's actionable. You don't fix this by teaching people meditation; you fix it by regulating auction types or setting hard pre-commitments that are legally binding.

  **Elena:** But pre-commitments fail *because* of the bias! They set a ceiling. They broke it. Why? Because when the moment came, the pain of the loss outweighed the rule. You can't legislate away the amygdala. If I treat a patient with a phobia, I don't just tell them "spiders are statistically harmless." I treat the fear response. Similarly, if we want to stop escalation, we have to understand the emotional accounting. Why does spending $10,000 to save a $5,000 investment feel like a win? Because the $5,000 loss is certain, and the $10,000 is probabilistic. We are bad at probability when emotion is high.

  **Marcus:** We aren't bad at probability; we are playing a different game. You're assuming the goal is to maximize monetary profit. But in a social auction, the goal might be to minimize public humiliation, or to signal resolve. If I bid $1.50 for a dollar, I look like a fool monetarily. But if I bid $1.50 to punish you for trying to beat me, and you fold at $1.60, I have established dominance for the next auction.

  **Elena:** That's revenge, Marcus. That's emotion.

  **Marcus:** It's reputation. It's game theory over an iterated game.

  **Elena:** But the Dollar Auction is usually a one-off! In the experiments, the subjects know they will never see each other again. Yet they still escalate. There is no future reputation to protect. There is only the immediate sting of loss.

  **Marcus:** *Pauses, stirring his coffee.* Okay. The one-off constraint is fair. In a strict one-off, reputation doesn't hold. But consider the "mixed strategy" again. If I believe there is even a 1% chance you are irrational—that you *will* bid forever regardless of cost—then it becomes rational for me to bid higher to test that hypothesis. The escalation isn't necessarily because *I* am biased. It's because I am rationally responding to the *possibility* that *you* are biased.

  **Elena:** So the bias creates the structure?

  **Marcus:** The possibility of the bias changes the equilibrium.

  **Elena:** Exactly! The "irrationality" is the variable in the equation. If everyone were a cold calculator, the auction would end at $1.00 or nobody would enter. The fact that it goes to $5.00 proves the calculator model is missing a component. You can patch the model by adding "probability of irrationality," but that just admits the irrationality is the engine.

  **Marcus:** I'd argue the engine is the *uncertainty* about the other player. Rationality under uncertainty looks a lot like madness from the outside. But let's meet in the middle. Your friends with the house. They entered a bidding war. That implies a second-place cost (losing the house after getting hopes up).

  **Elena:** And they escalated past their limit.

  **Marcus:** Because the structure made the cost of stopping higher than the cost of continuing, *in the moment*.

  **Elena:** Because their brains coded the "sunk cost" as a loss to be avoided, rather than a cost already paid.

  **Marcus:** Fine. The structure loads the gun. The psychology pulls the trigger.

  **Elena:** I can live with that. But if I'm counseling them, I'm focusing on the trigger. You can't change the housing market's auction structure. You can't stop it from being a War of Attrition. So telling them "the game is risky" doesn't help. Telling them "your brain will lie to you about sunk costs when you are tired and emotional" might.

  **Marcus:** And if I'm advising them, I'm saying: "Never enter a bidding war without a proxy." Use an agent who doesn't care about the house. Remove the psychology from the loop. Let the agent treat it as a cold calculation. If the agent overbids, fire the agent. Don't fire yourself.

  **Elena:** *Smiles.* So we agree on the remedy, if not the cause.

  **Marcus:** We agree that the Dollar Auction is a machine designed to eat utility. Whether it eats it because the machine is broken or because the operator is human...

  **Elena:** ...might not matter to the victim. But it matters to the scientist. If it's the machine, we ban the machine. If it's the operator, we train the operator.

  **Marcus:** And if it's both?

  **Elena:** Then we're in trouble. Because you can't fix the machine without changing the incentives of capitalism, and you can't fix the operator without rewriting human evolution.

  **Marcus:** *Raises his cup.* To the unresolved tension, then.

  **Elena:** *Clinks her mug against his.* To the tension. May it keep us employed.
