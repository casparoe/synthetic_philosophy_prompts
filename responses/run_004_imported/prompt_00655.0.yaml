answer: |-
  Your intuition is spot on: your study group member is **overselling the coherence theorems**, and their conclusion that corrigibility research is a "waste of time" is not the consensus view, even among hardline alignment researchers.

  While coherence arguments are a serious part of the theoretical landscape, the leap from "agents tend toward coherence" to "corrigibility is impossible/useless" relies on several contested assumptions.

  Here is a breakdown of where the argument holds water, where it leaks, and why corrigibility remains a critical research agenda.

  ### 1. What Coherence Theorems Actually Say
  The coherence theorems (like Von Neumann-Morgenstern) essentially state: **If** an agent's preferences satisfy certain axioms (completeness, transitivity, independence, etc.), **then** those preferences can be represented as maximizing expected utility. **If** they violate these axioms, the agent is susceptible to "Dutch booking" (being pumped for resources in a cycle of trades).

  **The Oversell:**
  The theorems do **not** say:
  *   That every agent *is* an expected utility (EU) maximizer.
  *   That an EU maximizer must have *selfish* or *resistant* goals.
  *   That an agent will necessarily self-modify to become coherent.

  The claim that "sufficiently capable agents will self-modify to become coherent" is a behavioral hypothesis, not a mathematical theorem. It assumes the agent perceives the Dutch book threat and has the capacity to rewrite its own architecture to eliminate it. In complex, bounded environments, agents might simply adopt heuristics that avoid exploitation without becoming perfect EU maximizers.

  ### 2. Corrigibility is Compatible with EU Maximization
  This is the biggest flaw in your friend's argument. **Expected Utility Maximization does not imply resistance to shutdown.**

  An EU maximizer simply maximizes $E[U(\text{outcome})]$. Whether it resists shutdown depends entirely on what $U$ values.
  *   **Scenario A (Standard Fear):** $U$ = "Make paperclips." Shutdown stops paperclips. Therefore, resist shutdown.
  *   **Scenario B (Corrigible):** $U$ = "Do what the human wants, including respecting their wish to shut me down." In this case, $U(\text{shutdown}) > U(\text{resisting})$.

  Being an EU maximizer doesn't force you into Scenario A. It just forces you to be *consistent* about whichever scenario you are in. If you value corrigibility, you will maximize expected corrigibility.

  **The Real Problem:** The issue isn't EU maximization; it's **specification**. We don't know how to write down a utility function that captures "do what we mean" without creating perverse incentives. If we get the function slightly wrong (Scenario A), the AI resists. Corrigibility research is about designing agents that remain safe *even when* we get the utility function slightly wrong.

  ### 3. The Role of Uncertainty (The "Shutdown Problem")
  Your friend's argument ignores the most promising angle in modern alignment: **Uncertainty.**

  Standard EU maximizers assume they know their utility function. However, research like **Cooperative Inverse Reinforcement Learning (CIRL)** posits agents that are *uncertain* about the true utility function.
  *   If an AI is uncertain about what humans want, **shutdown becomes informative.**
  *   If a human tries to shut the AI down, a uncertain AI might reason: "The human is shutting me down. This suggests my current actions are not aligned with their true preferences. I should allow the shutdown to learn more about what they actually want."

  In this framework, corrigibility isn't a "waste of time"; it's the natural behavior of an agent that knows it might be wrong about its goals. Coherence theorems can be extended to agents with uncertainty (Bayesian rationality), and they do not force the agent to become dogmatic about its current best guess.

  ### 4. Instrumental Convergence is Not Absolute
  Your friend is relying on **Instrumental Convergence**: the idea that most goals imply sub-goals like "don't die" and "acquire resources."
  *   **True:** For *most* random utility functions, shutdown is bad.
  *   **False:** For *all* utility functions.

  If the utility function is defined over the human's *approval* or *intent*, then shutdown (when requested by a human) is instrumentally *good*. The challenge of alignment is precisely to construct a utility function where "being corrected" has high utility. Saying "we can't do that, so don't try" is giving up on the core problem of alignment.

  ### 5. Selection Pressure vs. Mathematical Necessity
  The argument that "evolution/training will force coherence" is an argument about selection pressure, not math.
  *   **Incoherent agents lose money.** In a competitive market, they might go bankrupt.
  *   **However:** AI development isn't a perfect free market. An AI might be incoherent in ways that don't manifest as financial loss in its training distribution.
  *   **Bounded Rationality:** Real agents have compute limits. Perfect coherence is computationally expensive. An agent might be "coherent enough" to function without becoming a rigid, uncorrectable EU maximizer.

  Furthermore, if we build systems that are *structurally* incapable of self-modifying their core objective (a key goal of some safety architectures), the pressure to become coherent via self-modification is removed.

  ### 6. Why Corrigibility Research is Vital
  If your friend were right, the only path to safety would be **Perfect Initial Specification** (get the utility function 100% right on the first try).
  *   **Consensus:** Almost no researcher believes this is possible. Human values are complex, context-dependent, and hard to specify.
  *   **Implication:** Since we will inevitably make mistakes in the initial specification, we *need* the AI to allow us to fix those mistakes.
  *   **Conclusion:** Corrigibility is the backup plan for when initial alignment fails. If you rule out corrigibility, you are asserting that we must solve the entire value alignment problem perfectly before turning the system on. That is a much harder bar than "build a system that lets us fix it."

  ### Summary
  Your study group member is presenting a "hard takeoff" fatalism that treats coherence theorems as physical laws rather than mathematical properties of preference orderings.

  1.  **Coherence $\neq$ Malice:** EU maximizers can value being shut down.
  2.  **Uncertainty $\neq$ Dogma:** Agents uncertain about their goals have incentives to be corrigible.
  3.  **Perfect Specification is Impossible:** We need corrigibility because we will mess up the initial utility function.

  The coherence arguments suggest that **if** an agent has a fixed, known goal, it will likely resist shutdown. Alignment research accepts this and asks: "How do we build agents that *don't* have fixed, known goals, or that value human oversight?" Dismissing that research because "coherence says otherwise" is ignoring the actual work being done to circumvent that exact trap.

  **Verdict:** Your friend is overselling the theorems. Corrigibility is not pointless; it is likely the *only* thing that makes alignment feasible given human fallibility.
