answer: |-
  You have stumbled onto exactly the right tension, and your close reading is spot-on. You are not the last to find this—it's a famous crux in Augustinian scholarship—but you are among the few journalists writing on "paltering" who have actually gone to the source to see how the sausage is made.

  To answer your specific questions: **Yes, Augustine resolves it, but his resolution validates your suspicion that his definition of lying and our moral intuition about harm can come apart.** In fact, that separation is the entire engine of his ethics.

  Here is how Augustine untangles (or tightens) that knot in *De Mendacio*, and why it matters for your piece on paltering.

  ### 1. The Verdict: Who Lies?
  Augustine's answer is counterintuitive to the modern mind but consistent with his ontology.

  *   **Man A (False statement, good intent):** Augustine says this man **lies**.
  *   **Man B (True statement, bad intent):** Augustine says this man **does not lie**.

  By Augustine's strict definition ("having one thing in the mind and uttering another in words"), Man A is the liar because there is a rupture between his internal belief and his external speech. Man B, however, has achieved a correspondence between mind and speech. He believes there are robbers; he says there are robbers. The fact that he *expects* the listener to disbelieve him is a matter of the listener's psychology, not the speaker's veracity.

  ### 2. The Moral Weight: Who Sins More?
  Here is where it gets fascinating for your article. Augustine does not let Man B off the hook. He argues that while Man A commits the sin of *lying* (a violation of the divine order of signs), Man B commits the sin of **homicide** (or at least malevolence/treachery).

  Augustine writes later in the treatise that Man B is "guilty of a great crime," potentially worse than the lie. He distinguishes between the *species* of the act (lying vs. truth-telling) and the *moral gravity* of the act (charity vs. malice).

  So, to your point: **Yes, the definition and the morality come apart.** Augustine is willing to accept that a person can tell the truth and be more evil than a person who tells a lie.

  ### 3. Why This Feels "Slippery" (The Ontology of Speech)
  The reason this passage feels unresolved to a modern reader is that we are mostly **consequentialists** (we judge acts by their outcomes), whereas Augustine is an **ontologist** (he judges acts by their alignment with divine order).

  For Augustine, speech has a God-given purpose: to communicate the contents of the mind to another mind.
  *   When you speak, you are using a "sign."
  *   If the sign (words) points to something other than what is in the mind, you are corrupting the sign itself. You are breaking the tool of human community.
  *   Therefore, Man A breaks the tool, even if he uses the broken tool to save a life.
  *   Man B uses the tool correctly (truth matches mind) but uses it as a weapon.

  This is the exact friction point for "paltering." Paltering is the art of being **Man B**. It is using truthful statements (matching mind and word) to engineer a false belief in the listener.

  ### 4. How This Serves Your Article
  This passage is a goldmine for your piece for three reasons:

  **A. It explains the loophole.**
  Modern corporate and political spin doctors are essentially Augustinian Man B. They know that if they can align their words with their internal belief ("I technically didn't say X"), they can claim moral innocence regarding "lying," even if their intent is pure deception. Augustine gives them the theological cover to say, "I did not lie." (Though Augustine would add, "But you are a murderer.")

  **B. It highlights the limits of "Truth."**
  Your piece is about why "technically true" feels unsatisfying. Augustine explains *why*: because truth-telling is not just about the proposition; it's about the *communion* between minds. Paltering preserves the proposition but destroys the communion. Augustine would argue that Man B is violating the *spirit* of truth-telling even if he keeps the *letter*.

  **C. The "Intent to Deceive" Nuance.**
  There is one layer deeper you might want to check. Augustine adds a clause to his definition: a lie requires the *will to deceive* (*voluntas fallendi*).
  *   In your Man A example, does the speaker *want* the listener to believe the false words? No. He wants the listener to believe the *opposite*.
  *   Some scholars argue Augustine wobbles here. If I don't want you to believe my words, am I really lying?
  *   However, in *De Mendacio*, Augustine generally holds the line: if you utter what you believe to be false, you have disordered your soul, regardless of whether you expect the listener to catch on.

  ### 5. A Note on *Contra Mendacium*
  Since you found the later treatise (*Against Lying*), it is worth noting that Augustine's position hardens. *De Mendacio* is more philosophical and exploratory (hence the "So that it may be inquired..." tone you noticed). *Contra Mendacium* is polemical, written against the Priscillianists (heretics who argued it was okay to lie to catch heretics).

  In the later work, Augustine is less interested in the "robber on the road" thought experiments and more interested in closing loopholes for the clergy. He doubles down on the idea that **no lie is ever justified**, not even to save a soul or a life. This reinforces your point: the "slipperiness" of the technically true statement is a feature, not a bug, for those who want to maintain power without accountability. They want the Man B outcome (deception) without the Man A label (liar).

  ### Summary for your piece
  You can frame it like this:
  > "We get frustrated by 'technically true' deception because we sense a moral crime is being committed, even if the factual box isn't checked. Augustine of Hippo identified this 1,600 years ago. He presented a scenario where a truth-teller tries to get a man killed, and a liar tries to save him. Augustine concluded the truth-teller wasn't technically lying, but was morally worse. We live in a world that has kept Augustine's loophole ('I didn't lie') but discarded his moral judgment ('But you are a murderer'). Paltering is the secularization of Augustine's Man B: the weaponization of truth to destroy trust."

  You read the text correctly. The tension isn't a bug in your reading; it's the feature of Augustine's system. He separates the *sin of the tongue* from the *sin of the heart*, and modern spin doctors exploit exactly that gap.
