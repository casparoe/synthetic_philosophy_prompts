answer: |-
  First, I want to say that your intuition about your writing group is correct. When a workshop tells you a character is "inconsistent" because they are oscillating between two painful emotional states, they are often prioritizing narrative neatness over human truth. In fiction, as in life, consistency is sometimes the lie. Complexity is the truth.

  To answer your specific question: **No, neither the anger nor the detachment is the "correct" lane. The oscillation *is* the lane.**

  Here is why I think your reading of the situation is more accurate than the advice you're getting from both your support system and your writing group.

  ### 1. The False Dichotomy of "Him vs. The Illness"
  The advice you receive—"that's the illness, not him"—is a survival mantra for caregivers, but it is philosophically fragile. It asks you to perform a lobotomy on the person you love. It asks you to believe that there is a "real" brother hidden inside a "sick" brother, and if you just peel back the mania, you'll find the person who didn't mean to hurt you.

  But you know him. You know that the specific, wounding things he says come from *his* mind, *his* observations, and *his* memory, even if the *impulse* to weaponize them is driven by neurochemistry. To say "it's not him" is to erase the agent of your pain.

  When you get angry, you are acknowledging him as a person with agency. When you detach, you are acknowledging him as a patient with symptoms. Your oscillation isn't indecision; it is your heart struggling to reconcile two conflicting realities: **He is my brother, and he is dangerous to me.**

  ### 2. Anger is a Form of Respect
  You asked if anger is the fair response. I would argue that anger, in this context, is actually a form of dignity.

  When you allow yourself to be furious, you are asserting that your boundaries matter. You are saying, "I am a person who deserves not to be spoken to this way." If you skip straight to "it's the illness," you are bypassing your own wound to accommodate his. That is noble, but it is also exhausting and, eventually, resentful.

  The anger proves that you still expect something from him. You still expect reciprocity. You still expect the relationship to be between two equals. As long as you are angry, you haven't given up on the idea of him as a full participant in the relationship.

  ### 3. Detachment as "Demotion"
  Your insight about detachment feeling like a "demotion" is profound, and it is the crux of your novel's emotional conflict.

  Treating him like "bad weather" or a "broken car" is a protective strategy. It stops the hurt from landing. But as you've noticed, the cost of that protection is intimacy. You cannot have a relationship with the weather. You can only prepare for it.

  If you fully adopt the detachment model, you save yourself from pain, but you lose the brother. You become a case manager. You become a nurse. The relationship becomes functional, not familial. That feeling of "quietly demoting him" is your grief speaking. It is the mourning of the sibling reciprocity you are losing. It feels like a cop-out because, in a way, it is a surrender.

  ### 4. The "Both/And" Reality
  So, is bouncing between the two just what it looks like to keep loving someone? **Yes.**

  There is a psychological concept called **Ambiguous Loss**, coined by Dr. Pauline Boss. It describes grieving someone who is physically present but psychologically absent, or who is present but "not themselves." It creates a freeze-frame in the grieving process. You can't move on, and you can't fix it.

  The only way to survive ambiguous loss is to develop a "both/and" mindset.
  *   He is my brother *and* he is my burden.
  *   He loves me *and* he hurts me.
  *   It is the mania *and* it is him.

  Your writing group wants a character arc that moves from Point A (Confused/Angry) to Point B (Resolved/Detached). But the truest arc for this story might be a character who learns to **carry the weight of the contradiction without dropping either side.**

  ### For the Novel
  If I were reading this manuscript, I wouldn't want the sister to "pick a lane." I would want her to realize that the lane *is* the oscillation.

  The resolution shouldn't be that she stops getting hurt. The resolution should be that she stops beating herself up for getting hurt. She stops trying to solve the equation. She realizes that she can be furious at him on Tuesday, manage his medication on Thursday, and hug him on Sunday, and that doesn't make her inconsistent; it makes her a sister in a impossible situation.

  **My honest verdict:**
  The anger is fair because the wound is real.
  The detachment is necessary because the pain is unsustainable.
  The oscillation is the cost of admission.

  Don't let your writing group smooth out the rough edges of her psyche. That friction is where the story lives. You are writing about the specific tragedy of loving someone whose mind is a house that occasionally burns down, and you are the one standing outside with the hose. Sometimes you scream at the fire, sometimes you just aim the water, and sometimes you sit on the curb and cry because you miss the house. All three are true.

  Keep writing it exactly as it hurts. That is where the art is.
