answer: |-
  Here is a position paper for the reading group.

  ***

  **Title:** The Curve vs. The Will: Why Hyperbolic Discounting Dissolves Rather Than Solves *Akrasia*

  **The Thesis**
  The standard narrative in behavioral economics is that George Ainslie's hyperbolic discounting model provides the long-awaited mechanistic explanation for Aristotle's *akrasia*. The story goes: we are time-inconsistent, our valuation curves cross, and we succumb to temptation.

  I argue that this narrative is a category error. Hyperbolic discounting does not explain weakness of will; it explains **preference reversal**. By modeling the agent's valuation as shifting over time, the hyperbolic model quietly evacuates the synchronic conflict that makes *akrasia* philosophically puzzling in the first place. Consequently, it fails to violate Davidson's Principle of Continence. To recover a genuine theory of weakness of will, we need Richard Holton's distinction between *preference* and *resolution*. Without it, Ainslie gives us a theory of the addict, but not of the *akrates*.

  ### 1. The Aristotelian and Davidsonian Constraint
  To see why the discounting model falls short, we must recall what makes *akrasia* a puzzle. For Aristotle (*NE* VII.3), the incontinent agent acts against correct reasoning. Crucially, Aristotle distinguishes between:
  *   **Impetuosity (*propeteia*):** Acting due to passion before reason has concluded.
  *   **Weakness (*astheneia*):** Reason has concluded (the agent possesses the knowledge), but passion overrides it.

  In both cases, but especially weakness, there is a **synchronic conflict**. At the moment of action ($T_{action}$), the agent holds a judgment that $X$ is better, yet does $Y$.

  Donald Davidson formalized this as the **Principle of Continence**: If an agent judges that $X$ is better than $Y$ all-things-considered, they cannot intentionally do $Y$. *Akrasia* is the violation of this principle. The puzzle is: *How can I intentionally do what I judge, right now, to be worse?*

  ### 2. The Hyperbolic Dissolution
  Ainslie's hyperbolic discounting model posits that the subjective value of a reward increases disproportionately as the delay to receipt shrinks.
  *   At $T_1$ (far from reward): Value(Large-Late) > Value(Small-Soon).
  *   At $T_2$ (close to reward): Value(Small-Soon) > Value(Large-Late).

  Here lies the rub. If the model holds, then at $T_{action}$ ($T_2$), the agent **does not judge** the Large-Late reward to be better. Their utility function literally ranks the Small-Soon reward higher.

  If the agent acts on their highest current utility, they are acting in accordance with their best current judgment. **Davidson's Principle of Continence is preserved, but *akrasia* has vanished.** The agent isn't acting against their better judgment; their better judgment has flipped to match their action.

  This reduces the "weak-willed" agent to a **time-inconsistent planner**. It is not that Present-Me is weak; it is that Present-Me has different preferences than Past-Me. This is not *astheneia* (having knowledge but failing to use it); it is simply changing one's mind. As Kenny (1979) noted, if I prefer the cake now, eating the cake is rational relative to my current preferences. The "puzzle" of how I can act against my judgment is dissolved because the judgment is no longer there to act against.

  ### 3. Holton's Objection: Resolution vs. Preference
  Richard Holton (*Willing Unable*, 2009) sharpens this critique. He argues that the standard belief-desire model (which Ainslie inherits) cannot capture weakness of will because it reduces intentions to predictions of desire.

  For Holton, weakness of will is not merely a preference reversal; it is the **failure to maintain a resolution**.
  *   **Preference:** A ranking of outcomes based on expected utility (what Ainslie models).
  *   **Resolution:** A distinctive mental state aimed at stabilizing intention against temptation, often involving a refusal to reconsider.

  Holton's objection to the discounting model is that it treats the struggle of will as a struggle of *valuation*. But the phenomenology of *akrasia* is often that the valuation *doesn't* change. The smoker knows the cigarette is less valuable than health, even while lighting up. They do not suddenly think "Health is worth less than this puff." They think "This puff is worth less, but I'm having it anyway."

  Ainslie's model cannot account for this. In the hyperbolic story, the "temptation" works by distorting the value metric. In Holton's story, the "temptation" is resisted or succumbed to via the capacity to sustain a resolution *despite* the value metric shifting (or despite the local desire spiking).

  If we accept Ainslie's model as a complete theory of *akrasia*, we must say the agent who eats the cake while on a diet *no longer values the diet more than the cake* at that moment. But this contradicts the agent's own report (and the immediate regret that follows). The regret signals that the "all-things-considered" judgment remained constant (Diet > Cake), even though the action (Cake) prevailed. Ainslie explains the pull of the cake, but he cannot explain the persistence of the judgment that Diet > Cake alongside the action of eating Cake.

  ### 4. Impetuosity vs. Weakness
  Does Ainslie save *propeteia* (impetuosity) if he fails *astheneia*?
  Perhaps. *Propeteia* involves passion overwhelming reason before it can conclude. One could argue hyperbolic discounting models the "passion" of proximity swamping the "reason" of long-term planning.

  However, Aristotle insists the *akrates* still possesses the knowledge in a universal sense, even if not in use. Ainslie's agent doesn't just fail to *use* the knowledge; their cognitive apparatus recalculates the data to output a different result. This is closer to a cognitive error or a shift in perspective than a moral/volitional failure.

  ### 5. Verdict
  Hyperbolic discounting is a genuine theory of **time-inconsistency**, but it is not a genuine theory of **weakness of will**.

  It borrows the name *akrasia* to lend philosophical weight to an economic observation, but in doing so, it changes the subject. It transforms a synchronic conflict (Judgment vs. Action) into a diachronic conflict (Past-Self vs. Present-Self).
  *   **If you accept Ainslie:** You must deny that *akrasia* involves acting against one's *current* better judgment. You accept that we are just a sequence of different selves with different utility functions.
  *   **If you accept Aristotle/Davidson/Holton:** You must insist that *akrasia* requires a single agent acting against a standing judgment.

  **Conclusion:**
  For the reading group, I suggest we treat Ainslie's model as describing the **environment of temptation**, not the **structure of the will**. Hyperbolic discounting explains why the temptation is hard to resist (the curve spikes), but Holton is right: without the concept of a *resolution* that persists independently of current preference strength, we haven't explained weakness. We've only explained why the preferences changed. To solve Aristotle's puzzle, we need to explain how an agent acts against a judgment that *remains in place*, not one that flips to accommodate the action. Ainslie gives us the flip; he doesn't give us the failure.

  ***

  **Discussion Questions for the Group:**
  1.  Does the phenomenology of regret support Holton over Ainslie? (i.e., Do we regret because our preferences flipped back, or because they never flipped in the first place?)
  2.  Can we salvage Ainslie by viewing the "Self" as a collective of agents? Is *akrasia* just civil war between temporal selves rather than individual weakness?
  3.  If hyperbolic discounting isn't *akrasia*, is it a excusing condition? (i.e., "My brain chemistry made me value the drug more," vs "I was weak.")
