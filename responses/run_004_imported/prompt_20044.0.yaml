answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a novelist, Priya's college roommate, and currently someone who is losing sleep over two things: the revision deadline for my third book, and the fact that Priya asked me to give this toast.

  When she asked, I panicked. Not just because public speaking is terrifying, but because I know who is sitting in the front row. Fifteen of you have read David Lewis's *Convention* cover to cover. Fifteen of you will know if I misuse the term "coordination equilibrium." And the rest of you are Marcus's soccer team and my parents, who are just here to see if anyone cries. So, my goal tonight is to satisfy the philosophers without boring the soccer team, and to make my mother weep without making Priya roll her eyes.

  Priya is finishing a dissertation on Lewis. And Lewis teaches us that conventions are not fate. They are not written in the stars. A convention is arbitrary. It is a solution to a coordination problem that we agree upon, not because it's the *only* solution, but because it's the solution we've all agreed to use. Driving on the right side of the road is a convention. Driving on the left would work fine, too, as long as we all did it together.

  So, when people say Priya and Marcus were "meant to be," strictly speaking, Lewis would object. There was no cosmic necessity that brought them together. It was contingent. It was arbitrary. They could have missed each other at the coffee shop; they could have taken different flights.

  But here is the beauty of Lewis's account, and the beauty of what we are celebrating tonight. Once a convention is established, it ceases to be arbitrary in practice. It becomes binding. It becomes necessary. Because you have built a life on this precedent.

  I see this in the small things. Like the ritual Marcus and Priya have when one of them leaves for the airport. Marcus says, "See you on the other side." Nobody knows why. The origin is lost to history. It is, in Lewis's terms, completely arbitrary. There is no logical reason why that phrase signals safety and return. But it does. Because they have done it before. Because they expect the other to say it. Because if Marcus stopped saying it, Priya would feel the absence like a physical weight.

  That phrase is a tiny coordination equilibrium. It holds because they sustain it. And that is what marriage is. It is not a magical state of being; it is a daily practice of coordination. It is the willingness to uphold the precedent, even when it's hard. Even when you're tired. Even when driving on the left side of the road might seem easier in the moment, you stay on the right because you are driving together.

  Now, I know what the philosophers in the front row are thinking. You're thinking about the vows. Lewis argues that conventions arise *without* explicit agreement, because agreements already require language, and language itself is a convention. So, does standing up here and swapping vows break the framework? Are we pretending a contract creates the love?

  I don't think so. Because the vows aren't the origin of their convention. They've already been coordinating. They've already been solving the problems. The vows are something else. The vows are about *common knowledge*.

  In Lewis's view, a convention holds when everyone knows, and everyone knows that everyone knows, that this is the agreement. Before today, Priya and Marcus knew they loved each other. Their families suspected it. Their friends hoped for it. But today, by speaking these vows in front of us, you make it common knowledge. You signal to this entire community that the equilibrium is stable. You invite us to witness the precedent, so we can help you uphold it.

  That is why the ceremony matters. It transforms a private habit into a public truth.

  And to the rest of you, to my mom and Marcus's parents: I know this sounds technical. But what it means is simple. Fate is easy. Fate happens to you. But this? This is work. This is choosing, every single day, to say "See you on the other side," and meaning it. It is the understanding that love isn't something you find; it's something you build, brick by brick, precedent by precedent, until it is strong enough to hold you.

  Priya, you taught me that the world is made of conventions we agree to honor. Marcus, you taught us that honoring them is an act of love.

  So, if everyone could please raise a glass.

  To Priya and Marcus. May your coordination problems be few, may your precedents be kind, and may you always, always meet on the other side.

  To Priya and Marcus.
