      *   **Constraint 1 (Philosophical):** Must accurately reflect David Lewis's account of convention (*Convention: A Philosophical Study*, 1969). Specifically: conventions are arbitrary, self-perpetuating, sustained by precedent and mutual expectation (common knowledge), not fate/necessity. Avoid "meant to be."
