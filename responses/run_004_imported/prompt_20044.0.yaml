  2.  **Deconstruct David Lewis's *Convention*:**
      *   **Coordination Problem:** A situation where people benefit from coordinating their actions (e.g., driving on the right vs. left).
      *   **Arbitrariness:** It doesn't matter *which* solution is chosen, as long as everyone chooses the same one. (Driving on the left works too, if everyone does it).
      *   **Precedent:** Past solutions guide future expectations.
      *   **Common Knowledge:** Everyone knows everyone knows everyone knows... that this is the solution.
      *   **Equilibrium:** Once established, no one has an incentive to deviate unilaterally.
      *   **The "Agreement" Problem:** Lewis wants to explain how language/conventions exist *before* explicit agreements (since agreements require language). Conventions evolve through signaling and precedent, not necessarily a signed contract.
      *   **Application to Marriage:** Marriage *is* a convention in the legal/social sense. But the *relationship* is a coordination equilibrium they maintain daily. The vows aren't the *origin* of the convention (they've already been coordinating), but a public signaling of common knowledge.

