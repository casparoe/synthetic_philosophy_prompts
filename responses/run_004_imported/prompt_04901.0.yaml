  ### Justifications for Scores

  **Move 1 (Nadia): -1**
  Nadia relies on a probabilistic view of justification (Fallibilism). While intuitive, this move ignores the specific philosophical problem known as the **Lottery Paradox**. Most epistemologists agree that high statistical probability alone does not constitute knowledge or warrant flat assertion in lottery cases, whereas we typically assume we *do* know store hours via testimony or signage. Equating the two ignores the difference between statistical evidence and normative/causal evidence.

  **Move 2 (Owen): 2**
  Owen correctly identifies this as a canonical case for the **Knowledge Norm of Assertion**. His intuition aligns with the standard philosophical consensus: one cannot claim to *know* a lottery ticket will lose before the draw, regardless of the odds, because the belief lacks the right connection to the truth. This move accurately diagnoses why the assertion feels "off" compared to ordinary claims.

  **Move 3 (Nadia): 0**
  This is a strong dialectical challenge but philosophically mixed. Nadia is right that ordinary claims are fallible, but she conflates different *types* of fallibility. Store hours rely on institutional reliability and testimony (which track truth), whereas the lottery claim relies on bare statistical chance (which does not track the specific truth of ticket #4821). It is a valid pushback but ultimately fails to distinguish the epistemic bases.

  **Move 4 (Owen): 2**
  Owen invokes a **Sensitivity Condition** (associated with Nozick or DeRose). He points out that the friend's belief is not sensitive to the truth: if ticket #4821 *were* the winner, the friend would still have said it would lose. In contrast, if store hours changed, the sign (ideally) would reflect that. This identifies the precise epistemic defect in the lottery assertion, making it the strongest philosophical move in the exchange.

  **Move 5 (Nadia): 1**
  Nadia shifts to **Pragmatic Encroachment** or Contextualism (the idea that stakes affect knowledge/assertion standards). She is right that lower stakes make the assertion feel more permissible. However, this explains the *appropriateness* of the assertion rather than the *epistemic status* of the belief. It is a strong pragmatic point, but it doesn't fully refute Owen's claim that the epistemic foundation remains weak regardless of the prize value.

  ### What Both Are Overlooking

  Both parties overlook the distinction between **statistical evidence** and **individualized evidence**. Nadia treats all uncertainty as mathematically equivalent, while Owen focuses on the modal status (sensitivity) without explicitly naming the evidentiary difference. Furthermore, they conflate the **norm of belief** (can I believe it?) with the **norm of assertion** (can I say it?). It is possible that one is licensed to *act* as if the ticket will lose (pragmatic), but not licensed to *assert* it as a fact (epistemic). Neither fully disentangles the rudeness of the assertion from the truth of the proposition.

  ### Verdict

  The view that comes out looking best is a **Knowledge Norm of Assertion**, specifically one that requires **Sensitivity** (as argued in Move 4), modulated by **Pragmatic Stakes** (as argued in Move 5).

  Owen wins on the epistemic front: high probability alone does not license assertion because it lacks a causal or counterfactual connection to the specific truth (you don't *know* the ticket will lose). However, Nadia is right that assertion is not purely epistemic; the "cost of being wrong" influences whether a violation of the knowledge norm is tolerated. Therefore, the best account is that assertion requires knowledge, but what counts as "knowing" or "being licensed to assert" can shift slightly depending on the practical stakes involved.
