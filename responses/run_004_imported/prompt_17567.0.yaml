      *   **Context:** High school AI safety/rationality club.
      *   **Topic:** Updateless Decision Theory (UDT), specifically Wei Dai's proposal.
      *   **Specific Problem:** Newcomb's Problem and Counterfactual Mugging.
      *   **User's Understanding:** UDT means picking a policy *before* observations based on a prior and sticking to it, ignoring new evidence (like the coin landing tails in Counterfactual Mugging).
      *   **User's Objection:** This seems to violate the "Conservation of Expected Evidence" (you can't predict the direction of belief update). It looks like disregarding evidence on purpose.
