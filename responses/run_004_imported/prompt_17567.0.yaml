  6.  **Final Polish:** Ensure the distinction between *epistemic rationality* (believing true things) and *instrumental rationality* (achieving goals) is clear. UDT sacrifices a certain flavor of epistemic conditionalization for instrumental gain in specific logical structures.

      *(Self-Correction on "Disregarding Evidence"):* I need to be careful. The UDT agent doesn't disregard the evidence in the sense of pretending it didn't happen. It disregards it *for the purpose of selecting the action function*. It says, "I know it's Tails, but my action function $F(observation)$ was chosen to maximize utility over all possible observations." So $F(Tails)$ outputs "Pay" not because "Tails implies Pay is good" but because "The function $F$ that outputs Pay on Tails yields higher global utility."

