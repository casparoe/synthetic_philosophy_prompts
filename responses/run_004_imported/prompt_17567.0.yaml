          *   It's not about *epistemic* updating (beliefs).
          *   It's about *decision-theoretic* updating (policy selection).
          *   Analogy: Writing code before deployment vs. editing code during runtime.
      *   **Address the Counterfactual Mugging:**
          *   Explain the setup clearly (Omega, Coin, Tails = Pay, Heads = Reward if you would have paid).
          *   Explain the Causal Decision Theory (CDT) / Evidential Decision Theory (EDT) failure: Once you see Tails, the deal is gone. Paying loses $100.
          *   Explain the UDT success: The decision is made *behind the veil of ignorance*. If you commit to paying, you gain the upside in the Heads world. The expected value *ex-ante* is positive.
          *   Crucial Point: You don't *forget* you saw Tails. You just recognize that your *action* is logically linked to the counterfactual world where you saw Heads (via the predictor Omega).
      *   **Address "Conservation of Expected Evidence":**
          *   This principle says $E[P(H|E)] = P(H)$.
          *   UDT agents *do* update beliefs. They know the coin is Tails.
          *   But they don't update their *policy*.
          *   Why? Because the "you" that sees Heads and the "you" that sees Tails are logically correlated instances of the same decision algorithm. Optimizing for one optimizes for the other.
      *   **Why is UDT taken seriously? (AI Alignment Context):**
