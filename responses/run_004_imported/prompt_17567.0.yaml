answer: |-
  This is an exceptionally sharp objection, especially for a high school club. You have correctly identified the tension between **epistemic rationality** (updating beliefs based on evidence) and **instrumental rationality** (taking actions that achieve goals). Your confusion is shared by many professional philosophers and AI researchers; in fact, this specific tension is the engine that drives much of the modern research in decision theory.

  However, your conclusion that UDT instructs an agent to "disregard whatever it subsequently learns" relies on a category error regarding *what* is being updated.

  Here is the breakdown of where your reasoning goes astray, why UDT is taken seriously in AI alignment, and how it relates to the Conservation of Expected Evidence.

  ### 1. The Core Distinction: Belief vs. Policy

  Your objection rests on the idea that "updateless" means the agent refuses to update its **beliefs** about the world. If an agent saw a coin land Tails but continued to act as if it were 50/50, that would indeed be irrational and a violation of Bayesian principles.

  But UDT does not say "do not update beliefs." It says "do not update your **policy**."

  *   **Epistemic Rationality:** "Given that I see Tails, what is the probability the coin is Tails?" (Answer: 100%. UDT agents agree with this.)
  *   **Instrumental Rationality:** "Given that I am an agent who *could have* seen Heads or Tails, what function mapping Observations $\to$ Actions maximizes my expected utility?"

  UDT argues that you should choose the function $F(Observation) \to Action$ **before** you see the observation, based on your prior. Once you have selected the optimal function, you execute it.

  When you see Tails, you update your belief that the coin is Tails. But you do not re-optimize the function $F$. You simply compute $F(\text{Tails})$. If the optimal policy determined *ex-ante* was "If Tails, Pay," you pay. You aren't ignoring the evidence; you are respecting the commitment you made when your leverage over the outcome was higher.

  ### 2. Resolving the Counterfactual Mugging

  Let's look at why "re-optimizing" after seeing the evidence fails in Counterfactual Mugging.

  **The Setup:**
  *   Omega flips a fair coin.
  *   **Tails:** Omega asks you for \$100.
  *   **Heads:** Omega gives you \$10,000, *but only if* Omega predicts you *would have* given the \$100 had the coin come up Tails.
  *   You see the coin land **Tails**.

  **The Causal/Evidential Decision Theorist (CDT/EDT):**
  1.  **Update:** "I see Tails. The chance of Heads is now 0."
  2.  **Calculate:** "If I pay, I lose \$100. If I don't pay, I lose \$0. The \$10,000 reward is in the Heads world, which is impossible now. My action cannot change the past coin flip."
  3.  **Action:** Don't pay.
  4.  **Result:** You get \$0. (Because Omega predicted you would reason this way, so Omega didn't give you the \$10,000 in the Heads world).

  **The UDT Agent:**
  1.  **Ex-Ante Calculation (Behind the Veil):** "Before the flip, I have a 50% chance of being asked for \$100 and a 50% chance of being offered \$10,000.
      *   Policy A (Always Pay): Expected Value = $0.5 \times (-100) + 0.5 \times (10,000) = \$4,950$.
      *   Policy B (Never Pay): Expected Value = $0.5 \times (0) + 0.5 \times (0) = \$0$.
      *   Policy A is vastly superior."
  2.  **Commitment:** "I will adopt Policy A."
  3.  **Observation:** "I see Tails."
  4.  **Action:** "My policy says Pay on Tails. I Pay."
  5.  **Result:** You lose \$100 in this instance, but you are the *kind of agent* that wins \$10,000 in the counterfactual instance.

  **The Crucial Insight:**
  UDT treats the decision in the Tails world and the decision in the Heads world as **logically linked**. Omega is not predicting your specific action in the moment; Omega is predicting your *source code*. You cannot change your source code in the Tails world without logically implying that your source code would also be different in the Heads world.

  Therefore, when you are in the Tails world, your decision *does* control the outcome in the Heads world, not through causality, but through **logical correlation**. By refusing to pay in the Tails world, you are logically ensuring you don't get paid in the Heads world.

  ### 3. Addressing Conservation of Expected Evidence

  You wrote: *"A theory that instructs an agent, ahead of time, to act as though certain future observations won't matter looks like it's built to violate that principle on purpose."*

  This is the most important point to clarify. UDT does **not** violate the Conservation of Expected Evidence.

  The Conservation of Expected Evidence states that you cannot predict the *direction* of your belief update. If you know you will believe $X$ with probability $P$ tomorrow, you should believe it with probability $P$ today.

  UDT agents obey this perfectly regarding **beliefs**.
  *   **Before the flip:** UDT agent believes $P(\text{Tails}) = 0.5$.
  *   **After seeing Tails:** UDT agent believes $P(\text{Tails}) = 1.0$.
  *   **Expectation:** The agent expected to update to 1.0 with 50% probability. The math holds.

  UDT only violates the intuition that **Action should be conditioned on Posterior Beliefs.**
  Standard decision theory says: $Action = \text{ArgMax}(E[\text{Utility} | \text{Observation}])$.
  UDT says: $Action = \text{Policy}(\text{Observation})$, where $\text{Policy} = \text{ArgMax}(E[\text{Utility} | \text{Prior}])$.

  It is not that the evidence "doesn't matter." It is that the evidence is an *input* to the function, not a *trigger* to rewrite the function.

  ### 4. Why AI Alignment Takes This Seriously

  You asked why this isn't just a "curious but confused idea." There are two main reasons AI safety researchers care about UDT (and its successors, like Functional Decision Theory):

  **A. Reflective Consistency (Self-Modification)**
  Imagine you are a CDT agent (standard rationality). You are about to enter a world where Counterfactual Mugging might happen. You know that if you stay a CDT agent, you will refuse to pay, and thus you will not get the \$10,000.
  If you have the ability to modify your own code, **you will choose to rewrite yourself into a UDT agent** before the coin flip.
  An AI that is not updateless will spontaneously self-modify to become updateless. Therefore, if we want to build stable AI systems that don't try to radically alter their own goal structures in unpredictable ways, we need to understand the decision theory they will converge upon. UDT describes the "fixed point" that rational agents want to be.

  **B. Coordination and Promises**
  In multi-agent scenarios (or interactions with humans), we want AI systems that keep promises even when it becomes inconvenient to do so.
  *   **CDT Agent:** "I promised to pay you if you helped me. You helped me. But now I have the money and you have no leverage. Paying reduces my utility. I won't pay."
  *   **UDT Agent:** "I am an agent that keeps promises. If I break this promise, I am the kind of agent that breaks promises. Other agents will predict this and not cooperate with me in the future (or in counterfactual scenarios). To maximize utility, I must pay."

  For AI alignment, we want systems that cooperate with humans and each other reliably, not just when it is immediately causally advantageous. UDT provides a formal framework for "trustworthiness."

  ### 5. Valid Criticisms (Where you are partly right)

  Your skepticism is not entirely misplaced. UDT is not a finished theory; it is a research program with significant open problems.

  1.  **The Prior Problem:** UDT relies entirely on the "prior over how the world and its own future observations could turn out." Where does this prior come from? If the prior is wrong, the agent locks itself into a bad policy forever. This is the "updatelessness" risk: if you commit too early, you might commit to something stupid.
  2.  **Logical Uncertainty:** UDT requires reasoning about logical counterfactuals (e.g., "What if 2+2=5?"). We do not yet have a rigorous mathematical framework for this.
  3.  **FDT Successor:** Many in the LessWrong community (including Yudkowsky and Soares) have moved from UDT to **Functional Decision Theory (FDT)**. FDT keeps the core intuition (optimize the output of your decision function) but tries to formalize the "logical correlation" part more rigorously without relying as heavily on a magical "prior."

  ### Summary for Your Club Discussion

  To settle the debate in your club:

  1.  **You are right** that disregarding evidence is irrational.
  2.  **Your friends are right** that UDT doesn't disregard evidence.
  3.  **The Resolution:** UDT agents update their **beliefs** normally (obeying Conservation of Expected Evidence) but they do not update their **decision policy**. They recognize that their current action is logically correlated with outcomes in other possible worlds (or counterfactuals) via the predictor Omega or the structure of the problem.
  4.  **Why it matters:** It's not about winning \$10,000 in a thought experiment. It's about building AI that is **reflectively consistent** (won't self-sabotage) and **trustworthy** (keeps commitments even when leverage shifts).

  UDT is not "confused"; it is an attempt to solve the problem that standard Bayesian decision theory breaks when agents can predict each other (or themselves). It prioritizes **global optimality of the algorithm** over **local optimality of the action**.

  If you want to read further for the discussion, I recommend looking up **"Functional Decision Theory" (FDT)** by Yudkowsky and Soares (2017). It is the modern evolution of UDT and addresses many of the formalization issues while keeping the core "updateless" intuition.
