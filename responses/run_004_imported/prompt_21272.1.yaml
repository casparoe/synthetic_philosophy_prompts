answer: |-
  Good morning. For those who don't know me, I am Eleanor's grandchild. I am also, as of this semester, a student in the seminar on Early Chinese Philosophy that she more or less willed me into before she died.

  Eleanor left very specific instructions for this service. She was direct about what she did not want. She asked that we not say she is "looking down on us." She asked that we not speak of her "going to a better place." And she asked, most urgently, that we not flatten her life's work into a comforting slogan about "going with the flow."

  She knew this room would be split today. On one side, her colleagues and students, who know the texts as well as she did. On the other, her family and friends, who simply know *her*. My task, as she saw it, was to speak to both of you without betraying either.

  For the last two weeks, my classmates and I have been arguing about how to translate the word *hua*. It is the concept at the center of the *Zhuangzi*, the text Eleanor read every year like a scripture. We argue over whether to call it "transformation," "change," or "process." "Process" sounds too clinical for a funeral. "Change" sounds too breezy, as if she has simply changed trains. But "transformation" feels closer to what she taught us.

  In the *Zhuangzi*, there is a story where the philosopher's wife dies. When his friend Huizi arrives to offer condolences, he finds Zhuangzi sitting on the ground, drumming on a basin and singing. Huizi is horrified. He says, "You lived with her, she raised your children, and now you drum and sing? Is this not too much?"

  Zhuangzi replies that when she first died, he grieved like anyone else. He cried. But then he looked back at where she began. Before she had life, she had no life. Before she had form, she had no form. Before she had energy, she had no energy. She emerged from the great blur, took on the shape of a human, lived, and now has changed again, just as spring turns to summer, and autumn to winter. He says that if he were to keep crying and wailing, he would be showing that he does not understand the mandate of heaven. So he stops. He drums.

  Eleanor loved this story. But she always reminded us of the part we often forget: Zhuangzi cried first.

  To the family here: Eleanor's philosophy was not a shield against grief. It was not a way to pretend the loss didn't hurt. She cried when her friends died. She cried when her husband died. She believed that grief is the honest cost of loving something that is temporary. The philosophy does not ask you to stop crying. It asks you to understand that your tears are part of the same transformation as her passing. She is not gone into nothingness. She has returned to the stuff that makes the world. She is not watching us from above, because she is no longer separate from what is below.

  There is another story, from the end of Zhuangzi's own life. His disciples tell him they want to give him a lavish burial. They want to protect his body. Zhuangzi refuses. He says, "I will have heaven and earth for my coffin. The sun and moon will be my jade pendants. The stars will be my pearls. Will not all things be there to accompany me?"

  The disciples worry. They say, "We are afraid the crows and kites will eat you."

  Zhuangzi laughs. He says, "Above ground, the crows and kites will eat me. Below ground, the mole crickets and ants will eat me. Why would you rob one to feed the other?"

  Eleanor found this hilarious. It was her favorite kind of joke: precise, egalitarian, and utterly devoid of ego. She did not want a lavish burial. She did not want to be preserved. She did not want to be treated differently than the soil, or the air, or the insects. To treat her body as sacred would be to deny the very thing she spent thirty years teaching: that there is no hierarchy in existence. We are all things among things.

  So, how do we say goodbye to someone who does not believe in "goodbyes" in the permanent sense, but also does not believe in "seeing you later"?

  We do it by acknowledging the shape of the absence.

  To her colleagues: I know we worry about getting the translation right. I know we worry about the nuance between *hua* and mere change. But Eleanor would tell you that the text is not a puzzle to be solved, but a way to live. If we get the philosophy right but lose the human being, we have failed the text.

  To her family: I know you want to feel close to her. You want to know she is okay. I cannot tell you she is watching you. I cannot tell you she is waiting for you. But I can tell you this: The energy that made her laugh, that made her grade your papers, that made her hug you, has not vanished. It has scattered. It is in the wind that moves the trees outside this chapel. It is in the dust motes dancing in this light. It is in us, because we are made of the same world she was.

  She is not elsewhere. She is otherwise.

  My classmates and I are still arguing about how to translate *hua*. But maybe the translation isn't a word. Maybe the translation is this service. It is us, gathering, acknowledging the change, refusing to lie about where she went, and refusing to pretend she isn't missed.

  Eleanor spent her life arguing against the idea that death is a tragedy to be fixed with platitudes. She believed death is a fact to be met with clarity. So, let us have clarity. She is dead. We are sad. The world continues. And in continuing, it carries her forward.

  Zhuangzi drummed on the basin not because he didn't care, but because he cared enough to honor the whole cycle, not just the part where she was here. We can cry. We can miss her. We can feel the hole she left. But we can also trust that she is exactly where she intended to be: returned to the great transformation, unburdened, unbounded, and finally, perfectly at rest.

  Thank you.
