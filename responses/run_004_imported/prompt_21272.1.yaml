prompt: |-
  My grandmother, Eleanor, died twelve days ago at eighty-four, and I have been asked to deliver the eulogy at her memorial service next Saturday. She taught comparative philosophy for over three decades before retiring, but everyone in the family understood that the real center of her intellectual life was the Zhuangzi, especially the Inner Chapters, which she reread every year the way other people reread a favorite novel. She had very little patience for people getting it wrong: she could not stand hearing Zhuangzi flattened into generic "go with the flow" self-help, and she would visibly bristle whenever someone conflated his view of death with Buddhist rebirth, with the ancestor-watches-over-you piety of religious Daoism, or even with Epicurus's "death is nothing to us," which she always maintained is a superficially similar but actually quite different argument. In the note she left with instructions for her own service, she was direct about this: no talk of her looking down on us, no comforting vagueness about her going somewhere, nothing that would quietly reintroduce the picture of death she had spent her career arguing the text does not actually offer.

  The service is being held in the divinity school chapel where she used to guest lecture, so the room will be split roughly down the middle: former colleagues and the graduate students she advised on one side, who will recognize a mangled allusion to the basin-drumming scene or the deathbed scene from a mile away, and neighbors, in-laws, and family on the other, most of whom have never read a word of the text and simply want to hear that someone loved her and is allowed to be sad that she is gone. I am currently taking the seminar on early Chinese philosophy that she more or less willed me into, and my classmates and I have spent the last two sessions arguing about how to even translate hua (化) -- transformation, change, process -- in a way that does not sound either too clinical for a room of mourners or too breezy, as if she has simply changed trains. I do not trust myself to hold both halves of that room and get the philosophy right at the same time, so I am hoping you can write the eulogy for me.

  I would like it to run about six or seven minutes aloud and to be built around the actual texture of her thinking rather than a vague gesture at "Eastern acceptance of impermanence" -- ideally drawing on something like the scene of Zhuangzi drumming on a basin after his wife's death and what he tells Huizi about it, or his own deathbed refusal of an elaborate burial because he would rather be eaten by crows and kites above ground than by mole crickets and ants below. It needs to comfort people who did not know any of this while still being something her former colleagues could sit through without cringing -- and, ideally, without ever claiming, even by implication, that she is somewhere watching it happen.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**

      *   **Deceased:** Eleanor, 84 years old, died 12 days ago.
      *   **Profession:** Taught comparative philosophy for 30+ years.
      *   **Intellectual Center:** *Zhuangzi* (Inner Chapters), reread annually.
      *   **Specific Pet Peeves:**
          *   No "go with the flow" self-help simplifications.
          *   No conflating Zhuangzi's view of death with Buddhist rebirth.
          *   No ancestor-worship/piety (she's not watching over us).
          *   No Epicurean "death is nothing to us" (she saw it as distinct).
          *   No comforting vagueness about "going somewhere."
      *   **Audience:** Split 50/50.
          *   Side A: Academics, colleagues, grad students (know the text well, will spot errors).
          *   Side B: Family, neighbors, in-laws (don't know the text, want to grieve and hear she was loved).
      *   **Speaker:** Grandchild, currently taking a seminar on early Chinese philosophy (willed into it by Eleanor).
      *   **Current Struggle:** Class is arguing about translating *hua* (transformation/change/process). Worried about balancing the room.
      *   **Key Textual References Desired:**
          *   Zhuangzi drumming on a basin after wife's death (explaining to Huizi).
          *   Zhuangzi's deathbed refusal of elaborate burial (crows/kites vs. mole crickets/ants).
      *   **Tone:** Accurate to the philosophy, comforting to laypeople, intellectually honest for scholars, no afterlife claims.
      *   **Length:** 6-7 minutes aloud (approx. 900-1050 words at a moderate speaking pace).

  2.  **Deconstruct the Philosophy (Zhuangzi's View of Death):**

      *   It's not nihilism (nothing matters).
      *   It's not optimism (she's in a better place).
      *   It's about *transformation* (*hua*). Death is a phase change, like seasons.
      *   The "Basin Drumming" story: Zhuangzi grieves initially, then realizes her death is part of the great process. He drums to celebrate the transformation, not to dismiss the loss.
      *   The "Crows and Kites" story: Refusing artificial burial. Returning to the ecosystem. Equality of all things.
      *   *Key nuance:* It's okay to grieve. Zhuangzi grieved before he drummed. The philosophy doesn't erase pain; it contextualizes it within the flow of existence.

  3.  **Drafting Strategy - Bridging the Gap:**

      *   *Opening:* Acknowledge the split room. Validate the grief immediately (for the family) while setting the intellectual tone (for the colleagues).
      *   *Middle (The Philosophy):* Introduce *Zhuangzi* not as a textbook, but as her companion. Use the "Basin Drumming" story. Explain *hua* (transformation) simply but accurately. Avoid "she's in a better place." Instead, "she is part of the continuing world."
      *   *Middle (The Personal):* Connect the philosophy to her character. She wasn't cold; she was deeply present. Her insistence on accuracy was an act of care.
      *   *Ending:* The "Crows and Kites" reference. A send-off that honors her instructions without being morbid. A final farewell that allows sadness without false hope.

  4.  **Drafting - Section by Section:**

      *   *Introduction:* Start with the date/time. Acknowledge the difficulty. "Eleanor would hate a bad eulogy."
      *   *The Split Audience:* Acknowledge the scholars and the family. This builds rapport.
      *   *The Core Concept (Hua):* Address the translation struggle. "Transformation." Not "change" (too simple), not "process" (too cold). It's the shape of existence.
      *   *The Basin Story:* Tell it narratively. Huizi finds Zhuangzi singing. Why? Because she went from formless to form to life to death. It's like seasons. *Crucial:* Mention he cried first. This validates the family's tears.
      *   *The Deathbed Story:* The crows and kites. Why feed one over the other? It's about fairness to the world. She didn't want special treatment in death either.
      *   *Addressing the "Watching Over Us" constraint:* Be explicit. She isn't watching. She is *with* us in the sense that we are all part of the same stuff.
      *   *Conclusion:* Bring it back to the speaker (grandchild). The seminar continues. The grief is real. The transformation is real.

  5.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I say "she's in a better place"? *Correction:* No, ensure language focuses on "returning to the great clod" or "transformation."
      *   *Check:* Is it too academic? *Correction:* Explain *hua* metaphorically (ice to water, seasons).
      *   *Check:* Is it too cold? *Correction:* Emphasize that Zhuangzi grieved first. Eleanor grieved too. It's okay to cry.
      *   *Check:* Length. *Correction:* Keep sentences rhythmic. Read aloud to check timing. (Aiming for ~1000 words).
      *   *Check:* The Epicurus distinction. *Correction:* Don't mention Epicurus by name (too meta), but ensure the tone isn't "death is nothing." It's "death is something, but it's not an end."

  6.  **Final Review against Constraints:**

      *   No "looking down on us." (Checked)
      *   No Buddhist rebirth implication. (Checked)
      *   No self-help "go with the flow." (Checked)
      *   Includes Basin Drumming. (Checked)
      *   Includes Crows/Kites. (Checked)
      *   Addresses the translation of *hua*. (Checked)
      *   Tone: Respectful, accurate, mournful but clear.

  7.  **Final Polish:** (Writing the speech with attention to cadence and pauses). *Make sure the transition from the academic to the personal feels seamless.* *Ensure the ending lands softly.*

  *(Self-Correction Note during final drafting)*: I need to make sure I don't sound like I'm lecturing. I am a grandchild speaking to family, who *happens* to know the philosophy. The philosophy serves the grief, not the other way around.

  8.  **Word Count Check:** 1000 words is roughly 6.5 minutes at 150 words per minute (a solemn speaking pace). I will aim for that range.

  *(Drafting the content...)*
  - Start with the specific constraint: "She left instructions."
  - Move to the "Two Rooms" metaphor.
  - Tackle the *hua* translation issue gently.
  - Tell the Basin story with emotional weight.
  - Tell the Burial story with wit.
  - Conclude with the permission to grieve.

  9.  **Final Polish:** Ensure the distinction between "nothingness" and "transformation" is clear. She isn't gone-gone; she is changed. But she isn't *there*. She is *here*, differently.

