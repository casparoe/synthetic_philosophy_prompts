answer: |-
  Here are 9 substantive interview questions designed to press your guest on the philosophical mechanics of Dummett's argument rather than the biography or general themes.

  Per your request, the first three address your specific requirements (The Brute Right, Colonial Hypocrisy, and the Refugee Definition), while the remaining six target other vulnerable points in Dummett's thesis. Each includes the question, the answer she is most likely to give, and a follow-up to prevent evasion.

  ### 1. The "Brute Fact" of Movement
  **Question:** In Part One, Dummett treats the right to emigrate and immigrate almost as a brute, self-evident fact, rather than deriving it from a deeper moral framework. He essentially says, "If you can move inside a country, why not between them?" But for a listener who doesn't share that intuition—who sees national borders as morally distinct from municipal lines—Dummett offers very little derivation. If someone rejects that starting axiom, does his entire argument collapse, and what do you say to them?

  *   **Likely Answer:** She will likely argue that freedom of movement is a prerequisite for exercising almost any other right (work, association, safety). She'll lean on the analogy: if it's arbitrary to stop someone moving from London to Manchester, it's equally arbitrary to stop them moving from London to Paris, as both are morally irrelevant lines on a map.
  *   **Follow-up:** "But the London-Manchester move happens within a shared democratic framework where both parties vote for the same welfare budget. The London-Paris move crosses a fiscal and political jurisdiction. If the right to move is brute, does that mean I have a right to move into your house? If not, why is the national border different from your front door?"

  ### 2. Colonial History vs. Moral Principle
  **Question:** Dummett argues that Britain's colonial history undercuts its standing to restrict immigration today. But isn't this a *tu quoque* fallacy? Even if the UK is hypocritical for restricting borders after empire, that might show the *messenger* is flawed, not that the *message* (that restrictions are permissible) is wrong. How do you bridge the gap between proving Britain is hypocritical and proving that open borders are morally required for everyone?

  *   **Likely Answer:** She will likely pivot from "hypocrisy" to "reparative justice." She'll argue it's not just that Britain can't complain, but that Britain owes a specific debt. The wealth extracted during colonialism created the stability that attracts migrants; therefore, the restriction is not just rude, it's a continuation of exploitation.
  *   **Follow-up:** "Okay, let's grant the debt. But debts are usually quantifiable and expirable. Does this obligation last in perpetuity? If Germany pays reparations to Israel, do they lose the right to control their borders forever? At what point does the colonial past stop dictating the immigration policy of the present?"

  ### 3. The 1951 Convention and the "Deserving" Refugee
  **Question:** A significant portion of Dummett's defense relies on the distinction between the refugee and the economic migrant. But that definition is inherited from the 1951 Convention, which was a product of Cold War politics focused on individual persecution. It excludes people fleeing famine, climate collapse, or generalized civil war. Isn't Dummett building his moral house on a legal category that was never meant to be a moral discovery? What about the people who don't clear that bar?

  *   **Likely Answer:** She will likely concede the 1951 definition is imperfect but argue Dummett uses it as a *minimum* threshold, not a ceiling. She'll suggest that while the legal definition is narrow, the moral obligation extends to anyone fleeing life-threatening conditions, regardless of whether a specific agent is persecuting them.
  *   **Follow-up:** "If the moral obligation extends to anyone fleeing life-threatening conditions, then the distinction between 'refugee' and 'economic migrant' dissolves, because starvation is life-threatening. If you erase that line, aren't you effectively arguing for open borders for everyone, not just refugees? And if so, why keep the confusing legal terminology at all?"

  ### 4. The Analogy with Racism
  **Question:** Dummett famously equates immigration control with racism, arguing both exclude people based on morally irrelevant characteristics. But critics argue this is a category error. Racism discriminates based on inherent traits; border control discriminates based on jurisdiction and shared social contracts. Is comparing the border guard to the segregationist a philosophical insight, or does it shut down necessary debate about collective self-determination?

  *   **Likely Answer:** She will defend the analogy by focusing on the *effect* rather than the *intent*. She'll argue that excluding someone based on their place of birth is just as morally arbitrary as excluding them based on their skin color, as neither is chosen by the individual.
  *   **Follow-up:** "But a state has a fiduciary duty to its current citizens that it doesn't have to non-citizens. If a parent prioritizes their own child over a stranger's child, we don't call that racism. Why is the state not permitted the same partiality toward its own electorate without being branded immoral?"

  ### 5. The "Overwhelming Numbers" Objection
  **Question:** Dummett dismisses the fear that open immigration would overwhelm public services as largely empirically false and fueled by prejudice. But even if the *economic* impact is neutral, what about the *political* impact? If rapid demographic change fuels the far-right and threatens the very welfare state Dummett wants to protect, isn't restriction instrumentally necessary to preserve the conditions for justice?

  *   **Likely Answer:** She will likely argue that conceding to prejudice legitimizes it. She'll claim that the "backlash" argument is a self-fulfilling prophecy and that the solution is better political leadership and integration, not capitulation to xenophobia.
  *   **Follow-up:** "That sounds like ideal theory. But if capitulating to xenophobia preserves a welfare state that lifts millions out of poverty, while moral purity leads to a populist takeover that dismantles it, isn't the 'capitulation' the more ethical choice? Is Dummett asking us to risk the welfare of the poor for the sake of philosophical consistency?"

  ### 6. Democratic Self-Determination
  **Question:** The core tension in the book is between individual rights to move and a community's right to determine its own character. Dummett comes down heavily on the side of the individual. But without the power to exclude, does a 'people' cease to exist as a political agent? If you can't choose who joins the club, do you still own the club?

  *   **Likely Answer:** She will likely challenge the premise that a "people" needs exclusion to exist. She'll argue that political communities are defined by shared laws and values, not by ethnicity or closed borders, and that these can be maintained through civic integration rather than exclusion.
  *   **Follow-up:** "But values require enforcement. If a group enters that explicitly rejects the liberal values of the host nation, does the host nation have the right to exclude them to protect its liberal constitution? If yes, you've admitted the right to exclude exists. If no, how do you prevent the erosion of the very liberties Dummett champions?"

  ### 7. Citizenship vs. Residence
  **Question:** Dummett proposes decoupling citizenship from residence, suggesting that long-term residents should have full rights without necessarily holding the passport. But if citizenship is no longer the gateway to rights, what leverage does the state have to ensure integration or loyalty? What stops this from creating a permanent class of denizens with rights but no stake in the long-term future of the nation?

  *   **Likely Answer:** She will argue that "stake" comes from living and working somewhere, not from a piece of paper. She'll suggest that making citizenship harder to get (or less relevant) actually reduces nationalism and fosters a more cosmopolitan, stable society based on presence rather than status.
  *   **Follow-up:** "But voting is the ultimate lever of power. If you give non-citizens full voting rights immediately, you are allowing people to decide the fate of a community they might leave in two years. Isn't there a minimum 'skin in the game' required before someone gets to decide how the community's resources are spent?"

  ### 8. Ideal vs. Non-Ideal Theory
  **Question:** This book reads more like a manifesto than a policy white paper. Dummett tells us what justice *is*, but is sometimes vague on how we get there from here without causing social chaos. As a philosopher defending this work, do you think Dummett bears any responsibility for the practical consequences if his ideas were implemented prematurely, or is his only job to tell the truth?

  *   **Likely Answer:** She will likely take the Kantian line: philosophy's job is to define the moral north star. If reality cannot match the moral truth, reality must change. She'll argue that compromising on justice for the sake of "stability" often just entrenches injustice.
  *   **Follow-up:** "But philosophers influence politicians. If a politician implements Dummett's policies and the result is a collapse in public trust and a surge in authoritarianism, can you really wash your hands of that? Where is the 'non-ideal theory' in Dummett's work that accounts for human irrationality?"

  ### 9. The Nation-State as a "Club"
  **Question:** Dummett treats the nation-state as an illegitimate exclusionary club. But historically, the nation-state has been the only vehicle capable of delivering redistribution and social welfare. If we dismantle the exclusionary power of the state as Dummett suggests, what unit of governance replaces it to collect taxes and redistribute wealth?

  *   **Likely Answer:** She will likely argue for a shift toward supranational institutions or a global federalism. She'll suggest that the nation-state is a historical accident that is now obsolete, and that clinging to it prevents the global redistribution necessary to solve migration issues at the source.
  *   **Follow-up:** "Global federalism doesn't exist and isn't on the horizon. If we weaken the nation-state's ability to control borders before we have a global structure to replace it, aren't we just left with a power vacuum? Who collects the taxes for the welfare state in the interim—the very thing Dummett wants to protect?"
