answer: |-
  **MEMORANDUM**

  **TO:** Common Names Committee, Entomological Society of America (ESA)
  **FROM:** [Your Name], Retired Member & Committee Liaison
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for a Lexical Eligibility Standard regarding Anthropogenic Slurs

  **1. Purpose and Context**

  As we all know, the transition from "gypsy moth" to "spongy moth" was necessary, but it left us with a difficult precedent and a significant backlog. We are currently deadlocked between two principled positions. 

  One side argues that slurs carry an intrinsic harm that contaminates any label they touch, regardless of intent. The other side argues that common names are technical descriptors, not speech acts aimed at people, and that changing them risks scientific stability without solving a social problem.

  Having spent 40 years in this field and the last few studying the philosophy of language, I believe both sides are partially right. This memo outlines that philosophical overlap and proposes a vote-able rule that respects the concerns of stability while upholding our ethical obligations.

  **2. The Philosophical Impasse: Word vs. Use**

  To break the deadlock, we must address the underlying disagreement about how language works.

  *   **The "Intrinsic Harm" View (Camp A):** This position holds that the ugliness of a slur is baked into the word itself (semantic content). Therefore, attaching it to a moth perpetuates the slur's existence in the public sphere, normalizing the term even if no human is directly targeted.
  *   **The "Contextual Use" View (Camp B):** This position holds that meaning is determined by usage (pragmatics). A word is only a slur when used to demean a person. When applied to an insect, the word is stripped of its derogatory force; it is merely a label. Changing it is therefore performative overreach that jeopardizes clarity in regulation, trade, and public health communication.

  **Where we agree:** Language shapes perception. Even if Camp B is correct that we lack *intent* to harm, Camp A is correct that we cannot control *impact*. If a term alienates colleagues, students, or stakeholders from marginalized groups, it hinders the dissemination of science. 

  However, Camp B is also correct that scientific names serve a functional role in biosecurity and law. Indiscriminate renaming can cause tangible confusion in quarantine protocols or pesticide regulation. 

  Therefore, our policy must distinguish between **ethical eligibility** (what words *should* we use?) and **operational stability** (what words *can* we change safely?).

  **3. Proposed Policy: The Lexical Eligibility & Stability Protocol**

  I propose we vote on the following two-tiered rule. This moves us away from "case-by-case judgment" (which causes deadlock) toward a standardized process.

  **Tier 1: The Exclusion Standard (Ethical Eligibility)**
  *   **Rule:** Any common name containing a word whose primary historical etymology or contemporary dictionary definition is a derogatory term for a protected human group is deemed **ineligible** for future use and flagged for replacement.
  *   **Rationale:** This accepts the "Intrinsic Harm" argument. We acknowledge that the society does not wish to curate a lexicon that relies on human derogation, regardless of the target species. This removes the need to debate "intent" for each species.

  **Tier 2: The Regulatory Stability Waiver (Operational Pragmatics)**
  *   **Rule:** If a name flagged under Tier 1 is codified in active federal or international law (e.g., USDA APHIS quarantine orders, invasive species acts), the Committee shall **not** unilaterally rename the species. Instead, we will:
      1.  Adopt a "Parallel Common Name" for use in all society publications, meetings, and educational materials.
      2.  Formally petition the relevant regulatory body to update the legal code.
      3.  Retain the legacy name in parentheses only where legal citation is required.
  *   **Rationale:** This accepts the "Contextual Use" argument. It acknowledges that the Committee cannot override federal law without causing the confusion Camp B fears. It allows us to maintain scientific stability while signaling our ethical stance and working toward long-term resolution.

  **4. Why This Rule Works**

  1.  **It is Binary:** A word either meets the definition of a slur (Tier 1) or it does not. This eliminates subjective debates about whether a specific moth "deserves" a name change.
  2.  **It Respects Stability:** It prevents the Committee from accidentally disrupting public health alerts or trade agreements (addressing Camp B's primary concern).
  3.  **It Upholds Inclusivity:** It ensures that in our own house—our journals, conferences, and outreach—we are not using language that marginalizes members of our community (addressing Camp A's primary concern).

  **5. Motion for Vote**

  I move that the Common Names Committee adopt the **Lexical Eligibility & Stability Protocol** as the governing standard for all future name reviews, replacing the current ad-hoc review process.

  **6. Closing**

  We are scientists. We know that precision matters. But we also know that science is a human endeavor, conducted in a social context. We can honor the stability of our discipline without anchoring it to language that hurts our colleagues. This rule allows us to say: *The science is stable, but our standards evolve.*

  I look forward to discussing this at the next meeting.

  Respectfully,

  [Your Name]
  *Retired Fellow, ESA*
