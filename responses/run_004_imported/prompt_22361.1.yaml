      *   *Theoretical Explanation:* Marx isn't being eugenic or cold for the sake of it. He is defining the *commodity* of labour-power. Unlike a machine (which depreciates), this commodity is attached to a human body that dies. For capitalism to continue, the *supply* of this commodity must continue. Therefore, the *price* (wage) must cover not just the individual's survival but the creation of the next generation of workers.
      *   *Why this phrasing?* It emphasizes the *systemic* requirement. Capital doesn't care about the family; it cares about the "race of peculiar commodity-owners" (the working class) remaining available in the market. It objectifies the worker because *capital* objectifies the worker. Marx is describing the logic of capital, not necessarily endorsing it as moral.
      *   *Connection to User:* Validate the feeling. It *is* cold. That's the point. It reveals how capitalism views human life as fuel for production.

