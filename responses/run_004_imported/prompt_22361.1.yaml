      *   Make sure the "digestion" explanation is crystal clear because that's the technical sticking point.
      *   *Self-Correction on Digestion:* Let's look really closely at the analogy again.
          *   Rossi: Separating capacity from subsistence is a phantom.
          *   Marx: Capacity for labour $\neq$ Labour. Just as Capacity for Digestion $\neq$ Digestion.
          *   "The latter process [digestion] requires something more than a good stomach."
          *   Meaning: The *capacity* resides in the organism (the worker). The *process* (labour/digestion) requires external inputs (means of subsistence/food).
          *   Rossi wants to say the *capacity* includes the *subsistence*. Marx says no, the *capacity* is the physical/mental potential. The *subsistence* is what fuels it. You buy the capacity (wage covers subsistence), but you distinguish the two to see the exchange.
          *   Actually, the key is that Rossi is arguing you can't value the capacity without including the cost of living *in the definition of the capacity itself* in a way that obscures the transaction. Marx is insisting on the commodification: The worker sells the *capacity*. The price of that capacity is determined by the cost of the subsistence needed to maintain it. Rossi thinks this distinction is fake ("phantom"). Marx says it's real, like the distinction between having a stomach and actually digesting food.
          *   *Wait, one more nuance:* Rossi says "When we speak of labour... we speak at the same time of the labourer and his means of subsistence." He's conflating the *act* with the *conditions*. Marx says: We are analyzing the *commodity* sold. The commodity is the *capacity*. The *price* is determined by subsistence. But they are analytically distinct.
          *   *Okay, simpler explanation:* Rossi says "You can't separate the worker's ability to work from the food they need to eat." Marx says "Yes I can. I have a stomach (capacity). I need food (subsistence). They are different things. I sell you the use of my stomach for 10 hours. You pay me for the food I need to keep the stomach working. The distinction allows me to show you how you profit from my stomach."

  6.  **Final Polish:** Check against the "union organizer" background. Use that lens. This is about the mechanics of the wage relation.

