      *   *The Text:* Rossi says separating "capacity for labour" from "means of subsistence" is a "phantom." Marx says "capacity for digestion" isn't "digestion." Digestion needs more than a stomach (it needs food).
      *   *Rossi's Objection:* Rossi (a bourgeois economist) thinks you can't talk about the *ability* to work without talking about the *welfare* of the worker. He wants to blur the line between the worker's life and the work they sell. He's essentially saying, "You can't separate the person from the job."
      *   *Why Marx hates this:* If you can't separate the *capacity* to work from the *person's whole life/subsistence*, you can't analyze how that capacity is bought and sold as a commodity. Rossi is trying to make the economic relationship look natural or moral rather than transactional.
      *   *The Digestion Analogy:*
          *   Capacity for digestion = The stomach/physiology (Labour-Power).
          *   Digestion = The actual process (Labour).
          *   Food = Means of Subsistence (Wages).
          *   Marx's point: Having a stomach (capacity) is distinct from the act of digesting (labour), and both require food (subsistence) to happen. But economically, we are buying the *capacity* for a set time, not the digestion itself yet.
          *   *Correction/Refinement:* Actually, looking closer at the analogy: "When we speak of capacity for labour, we do not speak of labour, any more than when we speak of capacity for digestion, we speak of digestion. The latter process requires something more than a good stomach."
          *   *Interpretation:* Rossi says "Labour-power + Subsistence = Phantom if separated." Marx says "No, Capacity is distinct from the Act." The digestion analogy highlights that the *potential* exists within the body, but the *realization* requires external inputs (food/work conditions).
          *   *Why it matters:* This distinction is crucial for Surplus Value. If I buy your *labour* (the result), I pay for the value created. If I buy your *labour-power* (the capacity for 12 hours), I pay the cost of your survival, but I get to use you for 12 hours. If you produce value in 6 hours but I own you for 12, that's surplus. Rossi's confusion blocks this insight.

