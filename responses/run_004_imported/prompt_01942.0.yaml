prompt: |-
  Had a whole argument with a friend last night that started with her trying to choose between two job offers that are good in totally different ways, and spiraled into a bigger fight about 'hard choices' generally -- she thinks when options are like that theres just no fact about which is better, they're incommensurable, and picking one is basically a coin flip dressed up as a decision. I tried to bring up something I half remember from Ruth Chang about a 'parity' relation (not equal, not better, not worse, but still somehow comparable), which is suppose to be different from just saying the options are incomparable and reason runs out -- but I couldn't defend it well in the moment. Can you write a dialogue between someone arguing for parity and someone arguing for flat incomparability, where they actually engage with each other's strongest moves instead of talking past each other? I think the parity side has some argument involving making a small improvement to one of the options that I can't fully reconstruct, if that helps.
