answer: |-
  Here are 6 main questions (with 2 built-in follow-ups) designed to progressively corner the "Death is a Refutation" defense of Resolute Choice. They move from definitional clarity to specific counter-examples, ending with a falsification condition.

  **1. The "Outcome vs. Action" Distinction**
  "You've argued that if a decision theory tells you to die of thirst, that's a refutation of the theory, not a fact about rationality. This suggests you define rationality primarily by *survival outcomes* rather than *causal efficacy at the moment of choice*. If that's the case, are you essentially arguing that it is rational to engage in magical thinking? In the town, the money is gone either way you choose. How does wishing the past were different change the present causal reality without invoking something supernatural?"

  **2. The Kavka's Toxin Comparison**
  "Let's test this against Kavka's Toxin Puzzle. In that case, a billionaire rewards you *solely* for forming the intention to drink a toxin, but you don't actually have to drink it to get the money. A Resolute Chooser forms the intention, gets the money, and then—since drinking the toxin makes them sick and gains nothing—doesn't drink it. In Parfit's Hitchhiker, you form the intention, get the ride, and then—since paying the money costs you utility and gains nothing causally—Resolute Choice says you *must* pay. Why does the resolution bind you to the *action* in the Hitchhiker case, but not in the Toxin case? What is the structural difference that forces payment in one but not the other?"

  *   **Follow-up (If she says: "Because in Toxin, drinking never helps secure the reward, but in Hitchhiker, paying maintains the disposition for future rides"):**
      "Okay, but let's make Hitchhiker a one-shot game. There are no future rides, no reputation to maintain. You are safe in town, the driver is gone, and you will never be in the desert again. At that exact moment, paying has zero causal impact on your survival, just like drinking the toxin. If you say you still pay, aren't you admitting that Resolute Choice requires you to act against your current preferences for no causal reason, effectively worshipping a past self that no longer exists?"

  **3. The Imperfect Predictor (95% Reliability)**
  "Let's introduce noise. Suppose the driver's lie detector is only 95% reliable. There is a 5% chance they think you're sincere even if you intend to defect. As a Resolute Chooser, do you still form the resolution to pay? Or do you form the resolution to pay, get in the car, and then update your decision once you're safe, accepting the 5% risk of being caught?"

  *   **Follow-up (If she says: "No, a 5% risk of death is too high, so you must still pay"):**
      "So the obligation to pay isn't about the logic of Resolute Choice itself, but simply a calculation of risk aversion? If the penalty for being caught wasn't death, but just a $5 fine, would a Resolute Chooser then be rationally required to defect? If the answer changes based on the penalty size, haven't you just collapsed Resolute Choice back into Causal Decision Theory with a risk premium?"

  **4. The Mechanism of Binding**
  "I want to press on the mechanism. In CDT, my current choice is determined by my current beliefs and desires. In your view, my current choice is determined by a resolution formed in the past. How does that past resolution physically or normatively bind my present self? If my current desires have shifted—because I'm now safe and wealthy—what prevents me from simply *changing my mind*? Is 'Resolute Choice' just a fancy name for having a psychological inability to update your preferences?"

  **5. The Exploitation Objection**
  "One major criticism of Resolute Choice is that it makes you vulnerable to exploitation. If a bandit knows you are a Resolute Chooser, they can threaten you with a penalty that is slightly less bad than death, knowing you will resolve to pay to avoid the worse outcome. A CDT agent might call the bluff, knowing that once the threat is made, paying has no causal power to stop it. By making survival your trump card, aren't you guaranteeing that Resolute Choosers will be money-pumped by anyone who knows your theory?"

  **6. The CDT Victory Condition**
  "Finally, I want to ask about falsification. You've said that a theory telling you to die is a refutation of that theory. I want to flip that. What would a scenario have to look like for you to admit that Causal Decision Theory was right all along? Is there *any* case where following your resolution leads to a worse outcome than following causal dominance, where you would concede that rationality requires you to abandon the resolution and take the dominant action?"
