  Here is a constructed hypothetical scenario designed to isolate genuine cognitive penetration from the standard deflationary alternatives. I call this **The "Semantic Gain" Motion Aftereffect**.

  ### The Scenario

  **1. The Setup**
  Imagine a subject seated in a darkened room, fixating on a central point. In their peripheral vision (at 20 degrees eccentricity), a patch of **Random Dot Kinematogram (RDK)** is displayed. Crucially, the dots in this patch are **physically stationary**; there is zero coherent motion in the stimulus. However, the dots are updated with high-frequency noise that creates a "shimmering" effect, making the patch perceptually ambiguous and prone to illusory motion (aperture problem noise).

  **2. The Cognitive Manipulation**
  Before the trial, the subject is given a specific, novel piece of information intended to induce a high-level belief about the nature of the stimulus.
  *   **Condition A (Biological):** The subject is told (via a convincing but fake calibration screen) that the peripheral patch displays "Micro-Biological Activity," which naturally tends to drift *upward* due to convection.
  *   **Condition B (Mechanical):** The subject is told the patch displays "Static Electronic Noise," which naturally tends to drift *downward* due to signal decay.

  The subject is instructed to maintain strict fixation on the center and to attend to the peripheral patch passively. They are told the belief is a fact about the physical generation of the image, not a suggestion about what to look for.

  **3. The Phenomenon**
  The subject views this stationary-but-shimmering patch for 60 seconds. Immediately afterward, the screen goes blank (or shows a static test pattern).
  *   **The Result:** In **Condition A**, the subject reports a robust **downward** Motion Aftereffect (MAE). In **Condition B**, they report a robust **upward** MAE.
  *   **The Implication:** The MAE is caused by neural adaptation to motion. Since the physical stimulus was stationary, the adaptation must have been driven by *perceived* motion. Since the direction of the MAE flipped based *only* on the semantic belief ("Biology/Up" vs. "Mechanical/Down"), the belief must have caused the visual system to *see* upward motion in Condition A and downward motion in Condition B.

  ### Why This Rules Out the Deflationary Alternatives

  This scenario is engineered specifically to block the three standard "escape routes" your friend utilized. Here is the explicit breakdown:

  #### 1. Ruling Out "Mere Reallocation of Attention"
  The skeptic argues that beliefs don't change perception; they just change where or how we attend. If I believe there is upward motion, I might attend more to upward-oriented noise features.
  *   **The Counter:** The stimulus is **isotropic temporal noise**. There are no "upward features" or "downward features" in the physical signal to attend to; the noise is mathematically uniform in all directions. Attention acts as a *selector* of existing information; it cannot create a directional signal where none exists. For the subject to adapt to upward motion, the visual system must have *generated* a directional signal from non-directional noise. A mere spotlight of attention cannot manufacture directionality; only a change in the *processing parameters* (i.e., the perceptual content itself) can do that. The belief acted as a "gain control" on specific motion detectors, not a selector of pre-existing features.

  #### 2. Ruling Out "Mere Perceptual Learning or Differentiation"
  The skeptic argues that what looks like penetration is actually long-term learning (e.g., an expert birdwatcher sees a sparrow differently because their visual system is hard-wired by years of practice).
  *   **The Counter:** The belief induced in this scenario is **novel and arbitrary**. The subject has no prior history associating "Micro-Biological Activity" with upward drift in this specific context; they were told this minutes before the trial. Perceptual learning requires repeated exposure to rewire low-level receptive fields. A single instruction cannot rewire V1/MT circuitry through learning mechanisms. Therefore, the effect must be due to the *current* cognitive state directly modulating the processing, not a dormant skill acquired in the past.

  #### 3. Ruling Out "Mere Post-Perceptual Judgment or Response Bias"
  The skeptic argues that the subject *saw* the same thing but *reported* it differently to please the experimenter (demand characteristics) or because they inferred, "If it's biology, I should say it moved up."
  *   **The Counter:** The measure is the **Motion Aftereffect (MAE)**. The MAE is an involuntary, low-level physiological phenomenon (often called the "waterfall illusion"). It is a sensation of motion that occurs *after* the stimulus is gone, driven by neural fatigue. You cannot voluntarily "decide" to feel an aftereffect, nor can you easily fake its direction without actually experiencing it. If the subject reports a downward MAE, it proves their motion detectors fatigued from firing upward. Since the detectors fired upward, the *perceptual experience* during the adaptation phase must have contained upward motion. If it were merely a judgment bias, they might *say* "it moved up," but they would not suffer the physiological aftereffect of having *seen* it move up.

  ### Conclusion
  In this scenario, the cognitive state (the belief about the stimulus identity) causally influences the *content* of the visual experience (the direction of motion seen), evidenced by a low-level, involuntary aftereffect, without relying on prior learning or attentional selection of existing features. If this scenario were empirically realized, it would constitute a clean case of cognitive penetration: the mind reaching down and altering the very character of what is seen, not just what is thought about what is seen.
