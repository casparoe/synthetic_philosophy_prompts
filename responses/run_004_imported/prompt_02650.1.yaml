answer: |-
  Here is a reconstruction and analysis of the argument presented in this passage from the *White Horse Dialogue*.

  ### 1. Reconstruction of the Argument

  To understand the argument on its own terms, we must treat it as a logical proof concerning semantics (how names refer) and ontology (the status of attributes).

  **Premise 1 (The Status of "White"):** The term "White" (*bai*), when used alone, refers to an abstract, unfixed universal. It is not tied to any specific object.
  **Premise 2 (The Status of "White Horse"):** The term "White Horse" (*bai ma*) refers to "White" only insofar as it is **fixed** (*ding*) to a specific object (a horse).
  **Premise 3 (The Identity of Attributes):** An attribute that is fixed to a particular object is not identical to that same attribute in its abstract, unfixed state. (Therefore, "Fixed White" $\neq$ "White").
  **Premise 4 (The Extension of "Horse"):** The term "Horse" makes no distinctions regarding color; it accepts brown, black, and white horses equally. It involves no **exclusion** (*qu*).
  **Premise 5 (The Extension of "White Horse"):** The term "White Horse" distinguishes regarding color; it rejects brown and black horses. It involves **exclusion**.
  **Intermediate Conclusion:** A term that excludes (White Horse) is not identical to a term that does not exclude (Horse).
  **Final Conclusion:** Therefore, a white horse is not a horse.

  ---

  ### 2. The Distinction Between "Fixed" and "Unfixed" White

  The core metaphysical move in this passage is the distinction between *bai* (white/whiteness) as a universal and *bai* as a property of a specific thing.

  *   **Unfixed White:** This is "Whiteness" in the abstract. It is a free-floating quality that could potentially apply to a horse, a stone, a feather, or a wall. Because it is not anchored to any specific subject, it is "unfixed." In modern terms, this is the **universal**.
  *   **Fixed White:** This is whiteness as it actually appears in the world, attached to a specific entity. In this passage, it is whiteness anchored to the shape of a horse. This is the **particular instantiation**.

  **Why is "Fixed White" no longer "White"?**
  This is the most counter-intuitive claim ("What is fixed to a particular white thing is no longer white"). Gongsun Long is not claiming the horse lacks the color white. Rather, he is making a claim about **naming and reference**.

  For the School of Names, a name (*ming*) must correspond precisely to a reality (*shi*).
  1.  The name "White" refers to the abstract universal.
  2.  The name "White Horse" refers to a compound reality (Color + Shape).
  3.  Once "White" is compounded with "Horse," it loses its independence. It is no longer the free-floating universal "White"; it has become a modifier within a complex concept.

  If "White" meant the exact same thing in both contexts, there would be no need for the compound term "White Horse." By arguing that fixed white is "no longer white," Gongsun Long asserts that the **context of application changes the identity of the attribute.** The "White" in "White Horse" is a restricted subset of the concept "White." Therefore, the concept "White Horse" cannot be reduced to the concept "Horse" plus the concept "White," because the "White" inside the compound is ontologically distinct from the standalone "White."

  ### 3. Connection to the Argument of Exclusion (*Qu*)

  The point about "fixing" provides the metaphysical grounding for the logical point about "exclusion."

  *   **From Fixing to Exclusion:** Because "White" in "White Horse" is **fixed** to the horse, it necessarily limits the scope of what can be called a "White Horse." You cannot have a black horse satisfy the term, because the color attribute is fixed to *white*.
  *   **The Comparison:**
      *   **"Horse":** Refers to the shape only. Since shape is independent of color, the term "Horse" remains open to all colors. It **does not exclude**.
      *   **"White Horse":** Refers to shape + fixed color. Because the color is fixed, the term **excludes** non-white colors.
  *   **The Logical Leap:** Gongsun Long argues that identity requires functional equivalence. If Term A (Horse) allows $X$ (a black horse) to be a valid answer, and Term B (White Horse) does *not* allow $X$ to be a valid answer, then Term A and Term B cannot be identical.

  The "fixing" argument explains *why* the exclusion happens (the attribute is bound to the object), and the "exclusion" argument demonstrates the *consequence* of that binding (the extension of the term is narrowed). Together, they prove that the two terms operate differently and therefore refer to different realities.

  ### 4. Does This Argument Stand on Its Own?

  This argument is **not merely a restatement** of the earlier "Shape vs. Color" point; it is a significant deepening of the thesis, shifting from mereology (parts and wholes) to semantics and extension.

  **The Earlier Argument (Shape/Color):**
  *   *Logic:* "Horse" names a shape. "White" names a color. "White Horse" names both. Therefore, the composite (White Horse) is not identical to the component (Horse).
  *   *Focus:* This is a **mereological** argument. It treats "White Horse" as a sum of parts and argues the sum is not equal to one of the parts. (A car is not an engine).

  **The Later Argument (Fixed/Exclusion):**
  *   *Logic:* "Horse" has a broad extension (all colors). "White Horse" has a narrow extension (white only). Terms with different extensions are not identical.
  *   *Focus:* This is a **logical/semantic** argument. It focuses on the *reference* of the terms and the conditions under which they are satisfied.

  **Why the distinction matters:**
  The earlier argument could be objected to by saying, "Sure, 'White Horse' is a complex term, but a white horse is still a *type* of horse." A mereological distinction doesn't necessarily deny class membership.

  However, the "Fixed/Exclusion" argument attacks class membership directly. By arguing that "Fixed White $\neq$ White," Gongsun Long undermines the idea that "White Horse" is just "Horse" with an added descriptor. He suggests that "White Horse" creates a *new category* that functions differently than "Horse."
  *   "Horse" functions as an **open class**.
  *   "White Horse" functions as a **closed class**.

  Because the criteria for satisfying the two terms are fundamentally different (one requires only shape, the other requires shape + specific color fixation), they cannot be the same.

  ### Summary
  This passage reconstructs the "White Horse is not a Horse" thesis by moving beyond simple composition. It argues that **abstraction is not instantiation.** "White" as a universal is unfixed; "White" in a horse is fixed. Because fixing an attribute restricts the extension of a term (creating exclusion), the term "White Horse" functions logically differently than "Horse." Since terms that function differently cannot be identical, a white horse is not a horse. This stands as a sophisticated, independent argument regarding the logic of classification and the rigidity of names, distinct from the earlier mereological claims.
