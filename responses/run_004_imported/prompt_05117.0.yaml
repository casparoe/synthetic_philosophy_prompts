answer: |-
  Your hunch is correct: the student has identified a surface-level continuity but missed the metaphysical and logical chasm underneath. While it is a common introductory-level reading to treat James as merely "psychologizing" Peirce's logic, the claim that **Peirce signed off on James's extension of the maxim into a theory of truth is historically and philosophically false.**

  In fact, Peirce's later career is largely defined by his attempt to distance himself from exactly the view your student is attributing to him.

  Here is a breakdown of where the student is off-base, where the real doctrinal daylight lies, and how you might frame this for a graduate seminar without simply dismissing James.

  ### 1. The Historical Correction: Peirce Did Not Endorse James
  The strongest counter-evidence to the student's claim is Peirce's own reaction to James's 1907 book (and his earlier 1906 lectures). Peirce was alarmed by James's popularization. He felt James had turned a rigorous logical principle into a license for subjective wish-fulfillment.

  *   **The Renaming:** In 1905, two years *before* James's *Pragmatism* was published (but as James's lectures were circulating), Peirce published "What Pragmatism Is" in *The Monist*. He explicitly states he is modifying the doctrine to prevent the "loose" interpretations he saw coming. By 1906, he coined the term **"Pragmaticism"** specifically because the word "Pragmatism" had been "abused in the merciless way that words have to expect when they fall into literary clutches."
  *   **The Critique:** Peirce accused James of **Nominalism**. Peirce was a Scholastic Realist (believing generals, laws, and the community of inquiry are real); James was an empiricist/nominalist (believing only particular experiences are real). Peirce argued that by making truth dependent on individual satisfaction ("what works for me"), James destroyed the objectivity of truth.

  **Seminar Point:** Peirce didn't see James as extending his project; he saw him as corrupting it.

  ### 2. The Doctrinal Daylight: Three Key Divergences
  If the student claims they are the "same insight in two dialects," you can push back on three specific technical grounds.

  #### A. Meaning vs. Truth (Scope of the Maxim)
  *   **Peirce (1878):** The Pragmatic Maxim is a theory of **meaning** (semiotics), not truth. It asks: *What conception are we clarifying?* It is a method for making intellectual concepts clear by tracing their conditional experimental consequences. It is a rule for logic, not a definition of truth.
  *   **James (1907):** James explicitly shifts the maxim to a theory of **truth**. He asks: *What makes a belief true?* His answer is the "cash-value" of the belief in terms of satisfaction.
  *   **The Bite:** Peirce would argue you cannot derive a theory of truth directly from a theory of meaning without a robust realism to bridge them. For Peirce, meaning is public and logical; for James, truth is often private and psychological.

  #### B. The Community vs. The Individual (Epistemology)
  *   **Peirce:** Truth is defined by the **community of inquirers** in the **indefinite long run**. "The opinion which is fated to be ultimately agreed to by all who investigate." No single individual can possess truth; only the community converging toward the limit can.
  *   **James:** Truth happens to an idea. It is verified by **individual believers** in specific contexts. James allows for truths that are true *now* because they help a specific person navigate their life (e.g., religious faith), even if they aren't universally verifiable in a scientific sense.
  *   **The Bite:** For Peirce, if you believe something that "works" for you but would be disproven by infinite inquiry, you are wrong. For James, if it "works" for your life purposes, it is true (for you, in that context). Peirce finds this subjectivism intolerable.

  #### C. The Limit vs. The Process (Metaphysics)
  *   **Peirce:** Truth is a **regulative ideal**. It is the *limit* of inquiry. We assume it exists to make inquiry possible, but we may never reach it. It is independent of what you or I think *now*.
  *   **James:** Truth is **mutable and plastic**. "The truth is what works." Since experiences change, what "works" can change. Truth is *made* in the process of verification. A truth can "expire" if it stops working.
  *   **The Bite:** Peirce is a realist about truth (it is there waiting to be found); James is an instrumentalist (truth is a tool we forge).

  ### 3. Why the Student's Reading is Tempting (and Partially Right)
  To be fair to the student (and keep the seminar dialectical), acknowledge where she is right.
  *   **Anti-Cartesianism:** Both reject the idea of truth as a static "copy" of reality (naive correspondence).
  *   **Future-Oriented:** Both look to future consequences rather than past origins.
  *   **Experience:** Both ground philosophy in lived experience, not abstract metaphysics.

  The student is right that James *thought* he was being faithful to Peirce. James dedicated *Pragmatism* to John Stuart Mill but acknowledged Peirce as the originator. He didn't think he was betraying Peirce; he thought he was liberating Peirce's logic from Peirce's own technical constraints. But Peirce disagreed.

  ### 4. How to "Set Her Straight" in Seminar
  You don't want to simply lecture her down. You want to show her that the distinction has stakes. Here is a suggested strategy:

  **1. The "Pragmaticism" Text:**
  Assign a short excerpt from Peirce's 1905 *The Monist* paper, "What Pragmatism Is." Specifically, the section where he distinguishes his view from the "nominalistic" pragmatism of James. Ask the class: *Why does Peirce feel the need to rename his own doctrine? What is he afraid James is losing?*

  **2. The "Religious Hypothesis" Test:**
  Use James's allowance for religious belief as a wedge. James argues that if believing in God gives you a vital benefit and doesn't contradict empirical facts, it is a "true" option for you.
  *   **Ask:** Would Peirce accept this as "truth"?
  *   **Answer:** No. Peirce would say religious belief is only true if it would be confirmed by the ultimate scientific consensus of the infinite future. For Peirce, "what works for me now" is not truth; it is sentiment.

  **3. The Realism Question:**
  Ask the student: *Does truth exist if no one is there to verify it?*
  *   **James:** Truth is a property of ideas in relation to experiences. No ideas/experiences, no truth.
  *   **Peirce:** The *object* of the final opinion is real, even if inquiry is interrupted. The reality is independent of what finite minds think.
  *   **Conclusion:** If they differ on whether truth is mind-independent in the limit, they differ on Realism. If they differ on Realism, they are not just speaking different dialects; they are speaking different metaphysical languages.

  ### Summary for Your Prep
  You are not overcomplicating a convergence. The standard contrast is not just "vibes and reputation."
  *   **Peirce:** Logical, Realist, Communal, Limit-oriented, Objective.
  *   **James:** Psychological, Nominalist, Individual, Process-oriented, Instrumental.

  The student's claim that Peirce "signed off" is the weak link. Peirce spent the last decade of his life trying to unsign it. If you anchor the discussion in Peirce's 1905 rejection of James's interpretation, you give the student a textual basis to revise her view without dismissing her insight about their shared anti-Cartesian roots.
