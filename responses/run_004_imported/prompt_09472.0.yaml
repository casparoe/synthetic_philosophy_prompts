answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, Backcountry Medical Response Network
  **FROM:** [Your Name/Steering Committee Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Provisional Protocol for Mutually Exclusive Triage Decisions

  ### 1. Context and Purpose

  Three weeks ago, our on-call medic faced an impossible choice: deploy our entire antivenom stock to save one solo hiker, or divide it to save six trail crew volunteers. The medic chose to save the six. The hiker died.

  The medic acted in good faith, but the incident revealed a gap in our governance. We have no standing protocol for cases where resources are insufficient to save all parties, and individual prognosis (likelihood of survival if treated) is roughly equal. Without a pre-agreed rule, future medics will be forced to make split-second moral calculations under extreme stress, exposing them to undue liability and moral injury.

  This memo recommends a provisional protocol for the coming season. It commits to a specific decision rule, but it also addresses the philosophical disagreement that has arisen within the committee regarding *why* we choose that rule. Specifically, it addresses the challenge posed by John Taurek's argument ("Should the Numbers Count?") and the contractualist response (T.M. Scanlon). Resolving this is not academic; it determines whether our medics act on a heuristic of "math" or a principle of "fairness."

  ### 2. Recommendation

  **The Committee should adopt the "Greater Number" Protocol.**

  In scenarios where resources are mutually exclusive (saving Group A precludes saving Group B) and individual stakes are equal (death vs. survival for each person), medics are instructed to prioritize the larger group.

  **However,** the justification for this rule must be updated. We are not adopting this rule because "six lives are worth more than one" in a utilitarian sum. We are adopting it because it is the only principle that treats the claims of all individuals fairly.

  ### 3. The Philosophical Objection (Taurek)

  To draft a robust protocol, we must engage seriously with the minority view on this committee, which draws on John Taurek's 1977 argument. This is not a quibble; it is a fundamental objection to how we value human life.

  **The Argument:** Taurek argues that "saving more lives" is not a coherent goal for an agent who must choose between specific individuals. Loss is experienced individually, not collectively. To the solo hiker, his death is not "1/6th of a tragedy"; it is the total loss of his future. There is no "social entity" that suffers the sum of the deaths. Therefore, aggregating the six volunteers' interests into a single weight that outweighs the hiker's interest is a category error. It treats people as containers of value rather than individuals with claims.

  **The Implication:** If the hiker's claim to life is equal to each volunteer's claim, and there is no transcendent "sum" to consult, then favoring the six arbitrarily discounts the hiker. Taurek suggests that in such cases, fairness demands a **lottery** (e.g., a coin flip). This gives the hiker a 50% chance and the group a 50% chance, respecting the equality of their individual claims.

  **Why this unsettles us:** It suggests that our medic's decision, while intuitive, may have been morally unjustified. It implies that by saving the six automatically, we treated the hiker as a means to maximize a statistic rather than an end in himself.

  ### 4. The Aggregative Default vs. Contractualist Fairness

  The majority of the committee instinctively rejects the lottery. However, the standard justification—"six is greater than one, so we save six"—is vulnerable to Taurek's critique. It relies on crude aggregation, which ignores the separateness of persons.

  We should instead ground our protocol in **Contractualism**, specifically the framework offered by T.M. Scanlon. This distinction is vital for our medics to understand, as it changes the moral residue of the decision.

  **Crude Aggregation (Utilitarian):**
  *   *Logic:* Value of 6 lives > Value of 1 life.
  *   *Problem:* It implies the hiker's death is "worth it" to achieve the greater good. It validates the hiker's fear that he was sacrificed for the group.

  **Contractualist Fairness (Scanlonian):**
  *   *Logic:* We ask: What principle of action could no individual reasonably reject?
  *   *Application:* Consider the principle: *"In mutually exclusive triage, save the larger group."*
      *   **Can the solo hiker reasonably reject this?** He might argue, "This principle ignores my equal claim to life."
      *   **Can the six volunteers reasonably reject a lottery?** They would argue, "This principle subjects us to a 50% risk of six deaths when those deaths could have been prevented, for the sake of giving one person a chance at survival."
  *   *Resolution:* Scanlon argues that the claims of the six outweigh the claim of the one, not because they sum to a larger number, but because **each of the six has a claim equal to the one.** If you honor the one (via lottery), you are necessarily dishonoring the five *extra* claims. There is no justification you can give to those five extra people for why their equal claims were ignored.
  *   *Conclusion:* Saving the greater number is not about maximizing a total; it is about minimizing the number of individuals whose equal claims are necessarily thwarted. It is the principle that shows equal respect to the claims of all involved, by thwarting the fewest number of those claims.

  ### 5. Operational Protocol

  Medics cannot deliberate on contractualism in the field. The protocol must be a clear heuristic derived from the reasoning above.

  **Standing Order: Mutually Exclusive Resource Allocation**

  1.  **Assessment:** Confirm that available resources are insufficient to treat all patients and that treatment is binary (treated patients survive; untreated patients die or suffer catastrophic loss).
  2.  **Equality of Stake:** Confirm that the medical stakes are comparable (e.g., fatality risk is high for all parties). *Note: If one party has a significantly higher probability of survival with treatment, standard triage efficacy rules apply.*
  3.  **Decision Rule:** If stakes are equal and resources are mutually exclusive, **allocate resources to the larger group.**
  4.  **Documentation:** Log the decision as "Protocol 4.1: Greater Number." Do not document utilitarian calculations (e.g., "saved more lives"). Document the constraint (e.g., "Insufficient antivenom for both parties; prioritized larger group per standing order").

  ### 6. Moral Remainder and Support

  Adopting the Contractualist justification acknowledges that a "right" decision can still result in a tragedy. The hiker's death is not "canceled out" by the survival of the six.

  *   **Moral Injury:** We acknowledge that following this protocol may cause moral distress to medics who feel they abandoned the individual.
  *   **Support:** The organization commits to providing full psychological and legal support to any medic acting in compliance with this protocol. We will not treat the death of the minority party as a failure of judgment, provided the protocol was followed.
  *   **Family Communication:** In the event of a fatality under this protocol, the Steering Committee, not the medic, will handle communication with the deceased's family, explicitly framing the decision as an organizational policy based on fairness, not a field calculation of value.

  ### 7. Review and Sunset

  This protocol is adopted provisionally for the upcoming season (May–October). It will be reviewed at the November retreat. The review will specifically assess:
  1.  Operational clarity for medics.
  2.  Psychological impact on staff.
  3.  Further engagement with the Taurek/Scanlon literature to ensure our ethical framework remains robust.

  ### 8. Conclusion

  We cannot eliminate the tragedy of triage. We can only choose the principle that best honors the individuals involved. A lottery respects the hiker's claim but disregards the specific claims of the five extra volunteers. Saving the greater number respects the equality of all claims by thwarting the fewest.

  I move that we adopt the **Greater Number Protocol**, justified by **Contractualist Fairness**, effective immediately.

  ***

  **Attachments:**
  *   *Excerpt: T.M. Scanlon, "What We Owe to Each Other" (Chapter 5)*
  *   *Excerpt: John Taurek, "Should the Numbers Count?" (Summary)*
