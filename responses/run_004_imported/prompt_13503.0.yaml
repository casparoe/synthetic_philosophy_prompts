prompt: |-
  I'm on the committee rewriting our school district's anti-bullying policy -- a couple parents, a couple teachers, an assistant principal. We keep hitting the same wall. Nobody argues about the shoving and name-calling cases. But most of what's actually reported now is stuff like a kid quietly dropped from the group chat, uninvited from things in a way that's clearly meant to be seen, a whole friend group going cold on one kid overnight. Half the committee says thats normal teen social life, not policy material, and putting it in the policy means we'll drown in complaints nobody can fairly investigate. The other half of us suspects it gets waved off partly because its mostly girls reporting it and it doesn't look like the bullying everyone pictures -- and we honestly don't have good words yet for what's going on, which makes the argument hard to pin down. This has been bugging me for weeks. Can you draft the short recommendation memo I need for next week's meeting? It needs a real recommendation -- specific policy language, leave it to staff judgment, or something else -- plus what changes for staff starting next semester, and it has to take the 'not policy material' side seriously instead of just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** School district committee rewriting anti-bullying policy.
      *   **Committee Composition:** Parents, teachers, assistant principal (AP).
      *   **The Conflict:** Clear agreement on physical/verbal bullying (shoving, name-calling). Disagreement on relational/social aggression (exclusion from group chats, cold shoulders, uninviting).
      *   **Side A (Status Quo/Skeptics):** This is normal teen social life, policy can't cover everything, risk of drowning in uninvestigable complaints.
      *   **Side B (Advocates):** This is often gendered (girls reporting), dismissed because it doesn't look like "traditional" bullying, lacks vocabulary.
      *   **Goal:** A short recommendation memo for the next meeting.
      *   **Requirements:**
          *   Must make a *real* recommendation (specific language, staff judgment, or other).
          *   Must outline changes for staff starting next semester.
          *   Must take the "not policy material" side seriously (validate their concerns about over-policing friendship).
          *   Tone: Professional, balanced, actionable, empathetic.

  2.  **Deconstruct the Problem:**
      *   *The Core Issue:* Distinguishing between normal social friction/conflict and targeted relational aggression (bullying).
      *   *The Risk:* If the policy is too vague, administrators get overwhelmed. If it's too strict, the school polices friendships. If it ignores it, vulnerable students suffer harm that impacts learning.
      *   *The Solution:* A tiered approach. Define the behavior not by the *act* (being uninvited) but by the *intent and impact* (power imbalance, repetition, exclusion as a weapon). Focus on *education and intervention* rather than just *punishment*.

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the deadlock respectfully. Validate both sides immediately.
      *   **The Recommendation:** This needs to be the "Goldilocks" solution. Not "ban exclusion," but "address harmful patterns."
          *   *Idea:* Differentiate "Conflict" vs. "Bullying."
          *   *Idea:* Focus on "Relational Aggression" as a specific category.
          *   *Idea:* Shift burden from pure investigation to restorative practice/education for gray areas.
      *   **Policy Language:** Needs to be specific enough to guide but broad enough to cover scenarios. Key elements: Power imbalance, intent to harm, pattern of behavior.
      *   **Staff Changes/Training:** Teachers need to know *how* to spot this and *what to do*. It can't just be "investigate." It needs to be "mediate" or "educate."
      *   **Addressing the Counter-Argument:** Explicitly state why this won't drown the AP in complaints (thresholds for investigation).

  4.  **Refining the Recommendation (The "Pivot"):**
      *   *Initial thought:* Just add "social exclusion" to the definition.
      *   *Critique:* Too vague. Leads to the "drowning in complaints" fear.
      *   *Better thought:* Create a "Relational Aggression" clause that requires *evidence of intent to isolate and harm* combined with a *power imbalance*.
      *   *Best thought:* A two-track system. Track 1: Policy violation (severe, repetitive, power imbalance). Track 2: Social-Emotional Learning (SEL) intervention (friendship drama, one-off incidents). This satisfies Side A (not everything is a policy violation) and Side B (we aren't ignoring the harm).

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Recommendation on Relational Aggression."
      *   *Executive Summary:* We need to bridge the gap.
      *   *Validating Side A:* Acknowledge that schools shouldn't micromanage friendships. Acknowledge the resource constraint.
      *   *Validating Side B:* Acknowledge that exclusion *can* be weaponized and impacts mental health/learning. Acknowledge the gendered aspect without making it the only focus.
      *   *The Proposal:* Define "Relational Aggression." Set a threshold for policy enforcement (Power + Intent + Repetition).
      *   *Staff Action:* Training on the difference between conflict and bullying. Restorative circles for the gray areas.

  6.  **Polishing the Tone:**
      *   Avoid accusatory language ("Side B is right").
      *   Use administrative language ("Resource allocation," "Actionable thresholds," "Educational intervention").
      *   Ensure the recommendation is concrete.

  7.  **Final Review against Constraints:**
      *   Real recommendation? Yes (Two-track system).
      *   Specific policy language? Yes (included in draft).
      *   Changes for staff? Yes (Training + Protocol).
      *   Take "not policy material" side seriously? Yes (Explicitly limits scope to prevent over-policing).

  8.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't use the word "girls" too exclusively, even though the prompt mentioned it. Keep it inclusive but acknowledge the demographic reality subtly.* *Ensure the distinction between "friendship drama" and "bullying" is the centerpiece.*

  **(Self-Correction Note):** The prompt asks for a "short recommendation memo." I need to keep it tight. No fluff.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Anti-Bullying Policy Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Relational Aggression and Social Exclusion

  **Executive Summary**
  We are currently deadlocked on whether social exclusion (e.g., group chat removal, coordinated cold-shouldering) belongs in district policy. One side rightly fears over-policing normal adolescent social development and overwhelming administration with uninvestigable complaints. The other side rightly notes that weaponized exclusion causes documented psychological harm and is often dismissed because it lacks the visibility of physical aggression.

  This memo recommends a **two-track approach**: We will define "Relational Aggression" in the policy but set a high threshold for disciplinary investigation, while routing lower-level incidents toward social-emotional intervention. This protects staff resources while acknowledging the harm.

  **The Recommendation**
  We should not ban "exclusion" outright, as friendship selection is private. However, we must address exclusion when it is used as a *weapon* rather than a boundary.

  **1. Proposed Policy Language (Addition to Definition of Bullying)**
  *Current Policy:* Bullying is defined by physical acts, verbal threats, or cyber harassment.
  *Proposed Addition:*
  > "Relational Aggression: Behavior intended to harm a student's social standing or relationships. This includes, but is not limited to, malicious exclusion, spreading rumors to isolate, or coordinated social rejection.
  > **Enforcement Threshold:** To qualify as a policy violation warranting administrative investigation, Relational Aggression must demonstrate:
  > 1. **Intent:** Evidence the act was designed to harm or isolate, not merely a shift in friendship preference.
  > 2. **Power Imbalance:** The targeted student lacks the social capital to stop the behavior.
  > 3. **Pattern:** The behavior is repetitive or part of a coordinated campaign, rather than a singular interpersonal conflict."

  **2. Operational Changes for Staff (Starting Next Semester)**
  To address the concern that this will drown administration in complaints, we will implement a **Triage Protocol**:

  *   **Track A (Policy Violation):** If the "Enforcement Threshold" above is met (e.g., a dominant group systematically isolating a vulnerable peer), the Assistant Principal's office conducts a formal investigation per current bullying protocols.
  *   **Track B (Social Conflict):** If the behavior is messy but lacks a clear power imbalance or malicious pattern (e.g., two friends drifting apart, a group chat dissolving naturally), it is routed to School Counselors for mediation or Social-Emotional Learning (SEL) modules, not discipline.
  *   **Documentation:** Teachers will log Track B incidents in a "Climate Log" rather than a "Discipline Log." This allows us to track patterns without creating permanent disciplinary records for normal social friction.

  **3. Staff Training & Support**
  Recognizing that "intent" is difficult to judge, we will implement the following before Semester 2:
  *   **Scenario Training:** A 90-minute workshop for teachers and admins distinguishing "Friendship Conflict" vs. "Relational Bullying" using anonymized real-world cases.
  *   **Scripting:** Providing staff with neutral language to address students (e.g., *"I've noticed a pattern where X is being left out intentionally. I need to understand if this is a friendship change or something targeted."*) to gather facts without accusing.

  **Why This Works**
  *   **For the "Not Policy Material" Side:** This explicitly prevents the school from micromanaging friendships. Singular incidents or mutual fallouts are routed to counseling, not the AP's office. It protects administrative bandwidth.
  *   **For the "Harm is Real" Side:** It validates that social aggression is bullying when weaponized. It creates a vocabulary ("Relational Aggression") that allows us to name the behavior without needing a bruise to prove it happened. It ensures that when gendered patterns of exclusion arise, they are not dismissed as "drama."

  **Next Steps**
  I request we vote on adopting the "Enforcement Threshold" language above. If approved, I will work with the counseling department to draft the Track B referral protocol by [Date].

  **Recommendation:** Adopt the two-track system with the specific thresholds listed above.
