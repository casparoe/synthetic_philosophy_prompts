answer: |-
  Thank you for coming. For those who don't know me, I'm [Your Name], and I have the difficult job of trying to sum up fifty years of my father's thinking in about five minutes. He was a man who liked precision. He was an electrician by trade, and he approached his beliefs the same way he approached a fuse box: if the wiring was dodgy, he'd trace it back to the source and fix it.

  Dad left school at sixteen, but he never stopped studying. He was the treasurer of the local Humanist group for decades, and he loved a good argument. But the story he told most often, usually after a second pint, wasn't about his own ideas. It was about a philosopher named A. J. Ayer.

  In 1988, Ayer choked on some smoked salmon and his heart stopped for four minutes. When he came back, he wrote a famous article saying he'd seen a divine light and beings managing the universe. It was the kind of story religious people love to quote. But a few weeks later, Ayer published a short postscript. He clarified that while the experience was real to him, it hadn't convinced him God existed. It had only convinced him that he'd been too arrogant about people who believed differently.

  Dad loved that postscript more than the miracle. He used to say, "If I ever go briefly dead, I hope I have the nerve to correct the record like that."

  Well, two winters ago, Dad got his chance. On an operating table, his heart stopped. It was long enough that the doctors had to work to bring him back. When he woke up, he told my brother he'd "seen something," and it had shaken him. We waited for the conversion. We waited for the man who spent a lifetime arguing against the afterlife to suddenly find faith.

  Ten days later, sitting up in bed with a notepad, he delivered his own postscript. He wrote that he hadn't changed his mind about there being nothing afterward. But he admitted he'd changed his mind about how he treated the people who thought otherwise. He realized that sneering at hope wasn't the same thing as defending truth. He asked me to make sure you all knew that. He didn't want anyone pretending the hospital business was nothing, but he didn't want anyone pretending it was something it wasn't, either. He wanted the wiring to be honest.

  So, I can't stand here and tell you he's in a better place, because he'd be the first to point out he doesn't know where that is. And I can't tell you he's watching over us, because he spent fifty years telling us nobody was watching, and we had to look out for each other instead.

  But I can tell you this: he loved you. He loved his sister, who is here today, and he cherished her faith even while he disagreed with it. He loved his workmates, the neighbours, and his brothers. He was a man who fixed things. If your lights flickered, he was there. If your argument had a logical short-circuit, he was there for that too, usually with a grin that dared you to prove him wrong.

  He was stubborn, he was brilliant, and he was deeply kind. He taught me that integrity isn't about never changing your mind; it's about having the courage to say exactly *how* you've changed it.

  We are not going to pretend he is somewhere else. He is here. He is in the work we do, in the honesty we try to show each other, and in the love we feel for him right now. He asked for no false comforts, so I will give you the truth: losing him is painful. The house is quieter. The workbench is still. But the circuit he completed—the connection between all of us in this room—remains live.

  He was an electrician to the end. He didn't believe in the light at the end of the tunnel, but he certainly knew how to keep the lights on for the rest of us while he was here. We'll miss him terribly. Thank you.
