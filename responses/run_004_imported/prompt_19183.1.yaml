answer: |-
  This is an exceptionally sharp reading of the text. You are not overreading it; you have identified the central tension that defines not just the Society for Psychical Research (SPR), but Sidgwick's own intellectual life during this period. Scholars of Sidgwick (most notably Bart Schultz in *Henry Sidgwick: Eye of the Universe*) regard this tension not as a slip-up, but as a deliberate, high-wire act of epistemic positioning.

  To understand how the two halves of that passage hang together, we have to unpack what Sidgwick meant by "scandal" in the specific context of Victorian science, and distinguish between a *methodological* commitment and an *epistemic* critique.

  Here is a breakdown of how to resolve the apparent contradiction and understand the rhetorical strategy.

  ### 1. The "Scandal" is Epistemic, Not Moral
  When Sidgwick calls the situation a "scandal to the enlightened age," he is not using the word in the modern sense of a moral outrage. He is using it in a scientific and legal sense: **a failure of due process.**

  In the early 1880s, the "educated world" (the scientific establishment, led by figures like T.H. Huxley and John Tyndall) was coalescing around scientific naturalism. The default position was that claims of telepathy or survival of death were impossible *a priori* because they violated known laws of physics. Consequently, testimony regarding these phenomena was dismissed without examination.

  Sidgwick's argument is that **science cannot dismiss evidence based on theory.** If "generally credible witnesses" (and he meant respectable figures like scientists, judges, and clergy, not just séance attendees) report phenomena, the scientific method *requires* investigation. To refuse to investigate because the claims sound impossible is dogmatism, not science.

  Therefore, the "scandal" is not that people don't believe. The scandal is that the "educated world" has adopted an **"attitude of incredulity"** that precludes inquiry. They have reached a verdict without a trial.

  ### 2. Why the Pressure is on the Skeptics, Not the Believers
  You asked: *Why phrase it in language that seems to fall specifically on the sceptics, rather than equally on the credulous believers?*

  This is the crux of Sidgwick's rhetorical strategy. In 1882, the "believers" did not need an invitation to investigate; they were already convinced. The Spiritualist movement was vibrant, active, and producing literature. The barrier to knowledge was not the enthusiasm of the believers, but the gatekeeping of the skeptics.

  *   **The Believers:** Already accept the phenomena. They are "profoundly interested in having the question determined" because they want validation.
  *   **The Skeptics:** Hold the institutional power. They define what counts as "Science." If they refuse to look, the question can never be settled.

  Sidgwick is essentially telling the skeptics: *You claim to represent the 'enlightened age,' but by refusing to look at evidence that doesn't fit your materialist worldview, you are being just as dogmatic as the priests you criticize.*

  So, the "scandal" is specifically the **asymmetry of inquiry.** The believers are investigating (however poorly); the skeptics are ignoring. To restore balance, the SPR must force the skeptics to engage.

  ### 3. "Unpledged" vs. "Scandal": Diagnosis vs. Prescription
  This is how you resolve the contradiction you sensed.

  *   **The Diagnosis (The Scandal):** The current status quo is biased toward disbelief. The "attitude of incredulity" is a foregone conclusion disguised as skepticism.
  *   **The Prescription (The Society's Aim):** To fix this bias, we must create a body that is "quite unpledged."

  Sidgwick is arguing that true neutrality is impossible in the current climate because the climate itself is hostile. Therefore, to be truly neutral, the SPR must actively combat the default setting of incredulity.

  When he says the Society is "unpledged," he is reassuring the skeptics in the room: *We are not Spiritualists. We are not trying to prove ghosts exist. We are willing to debunk them.*
  When he calls incredulity a "scandal," he is reassuring the believers (and himself): *We are not materialists. We acknowledge that the evidence deserves a hearing.*

  He is holding the door open for both sides by criticizing the closed doors of the establishment.

  ### 4. Sidgwick's Personal Stake (The "Hidden" Premise)
  Your intuition that Sidgwick "privately suspects are real" is historically supported, though with nuance. Sidgwick was not a gullible believer. He was a desperate seeker.

  As a utilitarian ethicist, Sidgwick struggled with the "Dualism of Practical Reason." If the universe is purely material and there is no afterlife or cosmic justice, then acting ethically (maximizing general happiness) might be irrational if it conflicts with self-interest. He *needed* evidence of a moral order (i.e., survival of death, divine governance) to make his ethical system coherent.

  However, Sidgwick was intellectually honest to a fault. He would not assert belief without evidence.
  *   **Publicly:** He must maintain the "unpledged" stance to preserve the SPR's scientific credibility. If the SPR is seen as a front for Spiritualism, no serious scientist will join.
  *   **Privately:** He hoped the "scandal" would be resolved by proving the phenomena real, because that would solve his philosophical anxieties.

  So, the passage is not a contradiction; it is a **strategic ambiguity.** He is signaling to the initiated (like himself) that the evidence is worth pursuing, while signaling to the public that the process will be rigorous.

  ### 5. Is this a Known Interpretive Crux?
  Yes. This tension is central to the historiography of the SPR.
  *   **Alan Gauld**, in *The Founders of Psychical Research*, notes that Sidgwick's rigorous skepticism was necessary to give the Society cover, but his personal hope for positive results drove the energy.
  *   **Bart Schultz** argues that Sidgwick viewed psychical research as the "scientific theology" of the future. He wasn't contradicting himself; he was trying to expand the boundaries of what "science" could admit as evidence.

  The "scandal" line is often cited as the moment Sidgwick defines **scientific skepticism** (which investigates) against **scientific materialism** (which dismisses).

  ### Summary
  You have correctly identified that Sidgwick is doing something deliberate. He is not contradicting himself; he is distinguishing between **the sociology of science** (which is currently scandalously biased against the paranormal) and **the methodology of science** (which the SPR will practice neutrally).

  He blames the skeptics because they hold the keys to legitimacy. He insists on being "unpledged" because he knows that without that shield, the Society will be dismissed as a cult. It is a sophisticated rhetorical maneuver designed to carve out a legitimate space for inquiry in a hostile intellectual environment.

  You are reading it exactly right: the scandal is not the lack of belief, but the **refusal to test.** And for Sidgwick, a scientist who refuses to test evidence because it contradicts his worldview is the greatest scandal of all.
