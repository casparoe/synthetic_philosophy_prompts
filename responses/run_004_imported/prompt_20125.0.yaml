answer: |-
  You have hit on the single most common misconception about Updateless Decision Theory (UDT), so don't feel bad—your intuition is shared by almost everyone when they first encounter the term.

  The short answer is: **Your friend is right, and your understanding of "updateless" is slightly off.**

  A UDT agent **does** switch doors in Monty Hall. A UDT agent **does** use sensory information. A UDT agent does not walk into walls because it refuses to update on the visual observation that a wall is there.

  Here is the sanity check you need to reconcile the "Updateless" name with the actual math, why Monty Hall isn't the battleground, and why this is actually considered profound.

  ### 1. The Core Misconception: Updating *What*?

  Your current model is:
  > "The agent precommits to just never update on evidence at all... treating the actual observation as basically irrelevant noise."

  The actual model is:
  > "The agent chooses a **policy** (a function mapping observations to actions) based on its **prior**, and then executes that policy."

  In standard Causal Decision Theory (CDT) or Evidential Decision Theory (EDT), the agent waits until it receives an observation, updates its probabilities (the posterior), and *then* asks, "Given what I now know, which action maximizes utility?"

  In UDT, the agent asks, "Before I knew anything (from the perspective of the prior), which **function** from observations to actions maximizes expected utility?"

  Once that function is selected, the agent *does* feed observations into it. It just doesn't re-optimize the function based on the observation.

  **The Technical Distinction:**
  *   **CDT/EDT:** Choose $Action$ to maximize $E[Utility \mid Action, Observation]$.
  *   **UDT:** Choose $Policy$ to maximize $E[Utility \mid Policy, Prior]$, then output $Policy(Observation)$.

  So, "updateless" refers to the **optimization step**, not the **execution step**. You update your *state* (you know the coin is tails), but you don't update your *decision criterion*.

  ### 2. Why Your Friend is Right About Monty Hall

  In the Monty Hall problem, the observation (Host opens Door B) is statistically correlated with the location of the car in a way that is fixed by the laws of physics/probability.

  From the perspective of the **Prior** (before the game starts):
  *   Policy A: "Always Stay" wins 1/3 of the time.
  *   Policy B: "Always Switch" wins 2/3 of the time.

  A UDT agent calculates this at the start. It precommits to Policy B. When it sees the host open Door B, it doesn't stop and recalculate. It just runs the pre-committed code: `if host_opens_door: switch`.

  So, a UDT agent switches. The reason this doesn't make UDT trivial is that **CDT and EDT also switch in Monty Hall.** Monty Hall is not a problem that distinguishes these theories. It's a problem where Bayesian updating works perfectly fine.

  The "Updateless" label sounds confusing here because standard Bayesian updating *is* the optimal policy for Monty Hall. UDT encompasses Bayesian updating as a sub-routine for standard probability problems.

  ### 3. Where "Updateless" Actually Matters: Counterfactual Mugging

  This is the example you cited, and it's the correct place to look.

  **The Setup:** Omega flips a fair coin.
  *   **Heads:** Omega asks you for $100.
  *   **Tails:** Omega gives you $10,000 *if and only if* it predicts you would have given it $100 had the coin come up Heads.
  *   You see the coin is **Tails**.

  **The CDT/EDT Agent:**
  1.  Observes "Tails".
  2.  Updates probability of "Heads" to 0%.
  3.  Calculates: "If I pay $100, I lose $100. The Heads world is impossible now, so I can't get the $10,000 reward. Paying gains me nothing."
  4.  **Decision:** Don't pay.
  5.  **Result:** If the coin had come up Heads, this agent wouldn't have paid (because it's the same algorithm), so Omega doesn't give the $10,000 in the Tails branch. The agent gets $0.

  **The UDT Agent:**
  1.  Looks at the **Prior** (50% Heads, 50% Tails).
  2.  Evaluates Policy: "Pay if asked, regardless of coin outcome."
      *   Expected Value: (0.5 * -$100) + (0.5 * +$10,000) = +$4,950.
  3.  Evaluates Policy: "Don't pay."
      *   Expected Value: $0.
  4.  **Precommitment:** Selects the "Pay" policy.
  5.  **Execution:** The coin lands Tails. The agent observes Tails. It does **not** re-evaluate the policy. It executes `if asked: pay`.
  6.  **Result:** Omega (predicting this behavior) awards the $10,000.

  **Why is this "Updateless"?**
  Because when the agent sees "Tails," a standard agent updates its belief about the world to "Heads is impossible." The UDT agent effectively says, "I know Heads is impossible *now*, but my decision algorithm is evaluated based on what it *would* do in the Heads world, because that determines my payout in the Tails world."

  It refuses to update its *decision weights* to match its *observational probabilities*. It treats the "Counterfactual" Heads world as still relevant to its current decision, because its current decision is logically correlated with that counterfactual.

  ### 4. Why Is This Considered Profound?

  If it were just "precommit to Monty Hall," it wouldn't be a big deal. The profundity comes from **Time Consistency** and **Logical Correlation**.

  1.  **Time Consistency:** CDT agents suffer from dynamic inconsistency. Before the coin flip, a CDT agent *wishes* it could precommit to paying in the Counterfactual Mugging. But once the flip happens, it loses the will to follow through. UDT agents are time-consistent; the agent you are now is the agent you wished you were in the past. You don't need external precommitment devices (like contracts or reputation); your decision theory *is* the precommitment.
  2.  **Logical Uncertainty:** UDT (and its successor, Functional Decision Theory or FDT) treats your decision algorithm as a logical object. If there is a perfect predictor (Omega) or a clone of you (Twin Prisoner's Dilemma), your decision is *logically correlated* with theirs. CDT says "My choice can't causally affect the clone." UDT says "My choice and the clone's choice are outputs of the same function; if I output Cooperate, the function outputs Cooperate, so the clone cooperates."
  3.  **Solving Newcomb's Problem:** In Newcomb's Problem, CDT two-boxes (leaving $1M on the table). EDT one-boxes (but for "spooky" evidential reasons). UDT one-boxes because it selects the policy "One-Box" which causes Omega to have put the money in the box. It provides a causal-ish mechanism for acausal correlations.

  ### 5. Summary for Your Reading Group

  To sanity check your understanding going forward:

  1.  **UDT agents use observations.** They are not blind. They just don't let observations change the *goal function*.
  2.  **"Updateless" means "Optimize from the Prior."** You choose the best map from *all possible observations* to *actions* before you know which observation you will get.
  3.  **Monty Hall is a red herring.** Standard updating works there. The magic happens in problems involving prediction, logical correlation, or where your decision affects the probability of the state (via a predictor).
  4.  **The "Profound" bit:** It solves the problem of rational agents sabotaging their future selves. It turns "precommitment" from a strategic add-on into a fundamental property of rationality.

  **One final note:** UDT is technically a bit informal (Wei Dai's original posts). The modern, more rigorous formulation of these ideas is usually referred to as **Functional Decision Theory (FDT)**, developed by Yudkowsky and Soares. If you want to keep diving, look up the FDT paper ("Functional Decision Theory: A New Theory of Instrumental Rationality"). It cleans up a lot of the "how do we actually compute the counterfactuals?" hand-waving in early UDT discussions.

  You're on the right track, just adjust the definition from "ignoring evidence" to "ignoring evidence *for the purpose of policy selection*."
