      *   *Monty Hall:* A UDT agent *does* switch in Monty Hall. Why? Because the policy "if I see a goat, switch" has higher expected utility from the perspective of the prior than "if I see a goat, stay." The observation (which door has the goat) is part of the input to the policy, but the *choice of policy* was made "updatelessly."
