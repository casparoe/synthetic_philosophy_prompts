answer: |-
  Friends, family, colleagues, old comrades from the Commission.

  My uncle left us with a rule for days like this. He told me once, "The worst thing you can say about someone at their funeral is that they did it all on their own."

  So, I am not going to stand here and tell you about what a remarkable man he was in isolation. I am not going to list his achievements as if he climbed a mountain by himself. Because if I did that, I wouldn't be talking about him. I'd be talking about a stranger.

  To the colleagues in the room who sat with him during those long, heavy days in the 90s: You know that for him, the work was never about the law. It was about the space between people. When he walked into a hearing, he didn't bring a gavel; he brought a chair. He made space. He knew that truth doesn't come from a spotlight shone on a single witness; it comes from the connection between the one speaking and the ones listening. He believed that justice wasn't a transaction, but a restoration. He didn't try to fix broken laws; he tried to help broken people recognize each other again.

  And to the family in the room, who knew him as Dad and Oupa: You might think that world was far away from our Sunday lunches and birthday parties. But it wasn't. He brought that same chair to our dinner table.

  I remember watching him with his grandchildren. He never just watched them play; he got on the floor. If one child was crying, he didn't just comfort the child; he gathered the siblings. He taught them, without ever using big words, that your pain is my pain, and your joy is my joy. He was the kind of father who measured his success not by how well his children obeyed him, but by how well they treated each other when he left the room. He was the kind of Oupa who made sure every story ended with "we," never "I."

  He lived by the idea that a person is only a person through other people. *Umuntu ngumuntu ngabantu.*

  For the colleagues here, that phrase carries the weight of history. For the family, it carries the weight of love. But for him, it was just the truth. It meant that he didn't exist in a vacuum. He existed in the laughter of his daughters, in the advice he gave a young lawyer, in the hand he held during a difficult testimony, in the silence he shared with his wife.

  And that is why we are hurting so much today.

  If he were a man who did it all on his own, his death would be a simple closing of a file. But because he was a man who wove himself into all of us, his death feels like a tearing. We feel this grief precisely because we are connected to him. The pain we feel is the proof of the bond he spent his life building.

  He is not gone in the way we fear. He is present in the way we are sitting together right now. He is in the colleagues checking on one another. He is in the family members hugging across the aisles. He is in the way we are choosing to be here, for each other, rather than grieving alone at home.

  So, how do we honor him? We don't build a statue. We don't write a plaque that lists his titles.

  We honor him by refusing to do it alone.

  When you leave here today, do not go home to an empty house and sit in the dark. Call someone. Share a meal. Forgive a grudge that has been held too long. Make space for someone else at your table. Treat your colleagues like neighbors and your neighbors like family.

  He spent his life reminding us that we belong to each other. The greatest tribute we can pay is to keep belonging.

  Rest well, Oupa. Rest well, brother. Rest well, friend. We have you, and we have each other.

  Thank you.
