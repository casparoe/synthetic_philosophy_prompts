      *   **Goal:** A eulogy that honors his life and death through the lens of relationality.

  2.  **Determine the Tone and Structure:**
      *   **Tone:** Warm, respectful, interconnected, humble, grieving but hopeful. It needs to bridge the gap between the heavy historical work and the intimate family man.
      *   **Structure:**
          *   *Opening:* Acknowledge the loss, but immediately frame it through connection (not isolation).
          *   *Body Paragraph 1 (The Work):* Address the TRC colleagues without jargon. Focus on the *human* impact of his work, not the legal theory.
          *   *Body Paragraph 2 (The Family Man):* Address the family. Show how the same philosophy applied at home (listening, forgiving, being present).
          *   *Body Paragraph 3 (The Death):* Reframe grief. We grieve because we are connected.
          *   *Closing:* A call to action based on his principle. We carry him forward through our relationships.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the uncle's own rule. "He always said..." This anchors the speech in his voice. It immediately signals to the colleagues *why* we are gathered this way, and tells the family *how* to listen.
      *   *Addressing the Colleagues:* They know the TRC context. Don't explain *Ubuntu*. Show it. Talk about how he treated people in the hearings. Not as cases, but as neighbors. Use the phrase "umuntu ngumuntu ngabantu" but translate the *feeling* of it, not just the words. *Idea:* Mention the coffee breaks, the listening, the silence.
