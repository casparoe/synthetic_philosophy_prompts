      *   **Core Question:** Would Arendt view the current disinformation environment (deepfakes, social media, "alternative facts") as a difference in *degree* or a difference in *kind* compared to what she diagnosed in the 1960s/70s?
      *   **Constraint:** Do not hand-wave. Tie the answer back to her specific arguments (rational vs. factual truth, organized image-making, self-deception of liars).
