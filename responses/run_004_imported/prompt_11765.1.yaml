      *   *Lying in Politics (1971):* Analyzes the Pentagon Papers. Key insight: Modern lying isn't just hiding secrets; it's **rewriting history/reality** to fit a functional image. It's "organized lying."
      *   *The Liars:* They aren't just cynical manipulators; they often suffer from **self-deception**. They believe their own image-making because it serves a "higher purpose" (national security, ideology).
