      *   *Focus:* The argument should be about what kind of *human* the FIL is becoming. The wife's instinct is about the *relationship*, not just the dog's welfare.
      *   *Specific Point:* The FIL says the dog has no idea what's happening. Counter: She knows *who* he is. That relationship has value independent of work.
