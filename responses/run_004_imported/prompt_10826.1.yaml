prompt: |-
  I'm one of the public members on my state's parole board (long story — a piece I wrote a few years back on actuarial risk tools apparently impressed the right person), and we've hit a snag this month I can't stop turning over. We're deciding on a file where the risk instrument our office uses was run by two different consultants who reached very different numbers for the exact same guy: one anchored his five-year reoffending estimate to "all men convicted of this offense category released in the past decade," which comes out to 44%, and the other used a narrower comparison group — same offense, same age band, completed the same in-prison program, no juvenile record — which comes out to 13%. Everyone agrees both groupings are legitimate and both rest on decent sample sizes, but nobody can tell me why one is "more correct" for this specific human being than the other. A board member who used to teach philosophy says this has an actual name, something like "the reference class problem" (hope I'm getting that right), and that it isn't just the usual algorithmic-bias story with extra math — it's that literally any person belongs to endless overlapping reference classes that would each hand you a different number, bias or no bias.

  I need to send round a short memo before thursdays vote, and I'd like it to do double duty: what we should do with this particular file, and what our standing policy should be for weighing these actuarial numbers whenever this kind of split shows up again (apparently it's more common than I realized). Make the recommendation concrete enough that the board could actually vote on it line by line, and please don't let the memo off easy on the strongest pushback it'll get in the room — that walking away from the single "official" number just hands the decision back to individual members' gut instincts, which is exactly the unaccountable, possibly more biased discretion these tools were brought in to replace.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Public member of a state parole board.
      *   **Context:** A specific parole case where two actuarial risk assessments give vastly different probabilities of reoffending (44% vs. 13%) based on different reference classes.
      *   **Core Issue:** The "Reference Class Problem" (identified by a board member). Any individual belongs to multiple overlapping groups, each yielding different statistical probabilities.
      *   **Task:** Write a short memo for the board.
      *   **Goals:**
          1.  Recommend a decision for the specific file.
          2.  Propose a standing policy for handling such splits in the future.
          3.  Make recommendations concrete/votable.
          4.  Address the strongest pushback: abandoning a single number might return decision-making to unaccountable gut instincts/bias, defeating the purpose of the tools.
      *   **Tone:** Professional, authoritative, nuanced, actionable, respectful of the gravity of the decision (liberty vs. public safety).
      *   **Deadline:** Before Thursday's vote (implies urgency).

  2.  **Deconstruct the "Reference Class Problem":**
      *   What is it? In probability and statistics, it's the problem of deciding which class of events or individuals to use when calculating the probability of a specific event.
      *   Why does it matter here? The 44% figure is broad (all men, offense category). The 13% figure is narrow (offense, age, program, juvenile record).
      *   Which is "right"? Statistically, narrower classes that are *relevantly similar* to the individual are generally more predictive, *provided* the sample size remains robust. However, overly narrow classes risk overfitting.
      *   Ethical/Legal implication: Using the broader class might punish the individual for traits they can't change or don't share (e.g., older offenders in the cohort). Using the narrower class acknowledges rehabilitation (program completion) and specific risk factors.

  3.  **Address the Pushback (The "Gut Instinct" Fear):**
      *   *Argument:* If we don't trust the number, we trust the human. Humans are biased.
      *   *Counter-argument:* The tool isn't a crystal ball; it's an input. Blindly following a potentially misaligned number is also a bias (automation bias). The policy shouldn't be "ignore the numbers" but "weigh them transparently."
      *   *Solution:* Create a structured framework for *when* to deviate from the baseline score, requiring written justification. This maintains accountability without blind reliance.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the specific case and the core statistical dilemma (Reference Class Problem). Validate the philosophy board member's insight.
      *   **Analysis of the Specific Case:**
          *   Compare the two classes.
          *   Argue for the narrower class *in this instance* because it accounts for dynamic factors (program completion) and specific static factors (age, juvenile record) that distinguish this individual from the broad average.
          *   *Recommendation:* Vote to grant parole (based on the lower risk profile), *conditional* on specific post-release planning.
      *   **Proposed Standing Policy:**
          *   Need a rule for future splits.
          *   *Hierarchy of Reference Classes:* Prefer classes that include dynamic risk factors (behavior in prison) over static ones (historical offense data only), provided sample sizes are adequate.
          *   *Transparency Requirement:* If the board deviates from the "official" or highest risk score, they must state why on the record.
      *   **Addressing the Pushback (Crucial Section):**
          *   Acknowledge the risk of discretion.
          *   Frame the policy not as "discretion" but as "structured professional judgment."
          *   Emphasize that automation bias is also a risk.
          *   Require documentation to ensure accountability.
      *   **Closing:** Call to action for Thursday's vote.

  5.  **Refining the Content (Self-Correction/Polishing):**
      *   *Critique:* Is the recommendation too soft?
      *   *Fix:* Make the policy points bulleted and bolded so they look like motion items.
      *   *Critique:* Did I explain the Reference Class Problem clearly?
      *   *Fix:* Keep it brief but accurate. It's about relevance, not just sample size.
      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like a board member speaking to colleagues, not a lecturer. Use "we" and "our."
      *   *Critique:* Did I address the "gut instinct" fear strongly enough?
      *   *Fix:* Dedicate a specific section to "Accountability vs. Automation." Argue that *blind* reliance is the real abdication of duty.

  6.  **Final Review against Constraints:**
      *   Short memo? Yes.
      *   Concrete recommendations? Yes.
      *   Addresses pushback? Yes.
      *   Specific case + Standing policy? Yes.

  7.  **Final Polish:** Check for clarity, impact, and legal/practical feasibility. (e.g., ensuring the policy doesn't violate state statutes regarding risk scores). *Self-correction: I don't know the specific state statutes, so I must phrase the policy as "weighting" rather than "overriding" statutory requirements.*

  **(Self-Correction during drafting):** I need to make sure I don't sound like I'm dismissing the 44% entirely. It represents a baseline risk. The 13% represents *mitigated* risk. The memo should reflect that distinction. The policy should be about *selecting the most relevant reference class*, not just picking the lower number.

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Members
  **FROM:** [Your Name], Public Member
  **DATE:** [Current Date]
  **SUBJECT:** Actuarial Discrepancies in Case #[ID] and Proposed Protocol for Reference Class Selection

  **Purpose**
  This memo addresses the conflicting risk assessment scores in Case #[ID] and proposes a standing protocol for resolving similar discrepancies in future hearings. As noted in our last session, we are facing the "Reference Class Problem": the statistical reality that any individual belongs to multiple overlapping groups, each yielding different probability estimates.

  In this case, we have a 44% recidivism estimate (broad class: offense category) versus a 13% estimate (narrow class: offense, age, program completion, juvenile history). Both are mathematically valid. Neither is inherently "true." The question is which is *morally and statistically relevant* to this specific applicant.

  **Recommendation for Case #[ID]**
  I recommend we vote to **grant parole**, weighting the 13% estimate more heavily than the 44% baseline.

  *Reasoning:* The 44% figure treats the applicant as a static member of a historical cohort. The 13% figure accounts for *dynamic* factors—specifically, the completion of in-prison rehabilitation programs and age-related risk decay. To ignore the narrower class is to ignore evidence of rehabilitation. It punishes the applicant for the past behavior of strangers he does not resemble, rather than judging him on the specific traits he actually possesses.

  **Proposed Standing Policy: "Structured Weighting of Actuarial Data"**
  To prevent future deadlock and ensure consistency, I move we adopt the following protocol when risk instruments produce divergent reference class outcomes:

  1.  **Relevance Hierarchy:** When multiple valid reference classes exist, the Board shall prioritize the class that includes the highest number of *dynamic* risk factors (e.g., program completion, disciplinary record) over classes relying solely on *static* factors (e.g., offense type, demographic history), provided the sample size remains statistically robust (n > 100).
  2.  **Deviation Documentation:** If a Board member votes to rely on a higher-risk estimate over a lower-risk estimate (or vice versa), they must articulate the specific factual basis for that weighting on the record. "Gut instinct" is not a sufficient basis; the reasoning must link to specific file evidence.
  3.  **Automation Bias Warning:** Risk scores are advisory inputs, not verdicts. The Board acknowledges that blindly deferring to a single "official" number constitutes automation bias, which is as unaccountable as unchecked human discretion.

  **Addressing the Pushback: Accountability vs. Automation**
  I anticipate the objection that moving away from a single "official" number returns power to individual discretion, reintroducing the bias these tools were meant to curb. This is a serious concern, but it rests on a false dichotomy.

  *   **Blind Reliance is Not Accountability:** If we rubber-stamp a 44% risk score that we know ignores an applicant's rehabilitation, we are not being objective; we are hiding behind an algorithm. That is an abdication of our statutory duty to assess *individual* suitability.
  *   **Structured Discretion is Accountable:** The policy above does not grant carte blanche. It requires *written justification* for how we weigh the data. It is easier to audit a Board member's written reasoning on why they prioritized one reference class than it is to audit their silent reliance on a black-box number.
  *   **The Goal is Accuracy, Not Consistency:** Consistency in error is not a virtue. If the tool's default setting is known to be over-inclusive for certain profiles, using it without adjustment creates systemic injustice.

  **Next Steps**
  I ask that we vote on the specific recommendation for Case #[ID] this Thursday. Following that vote, I request the Chair schedule a brief working session to finalize the Standing Policy language for adoption next month.

  We cannot solve the Reference Class Problem mathematically. We can only solve it procedurally, by committing to transparency about how we choose to see the people standing before us.

  Respectfully,

  [Your Name]
  Public Member, State Parole Board
