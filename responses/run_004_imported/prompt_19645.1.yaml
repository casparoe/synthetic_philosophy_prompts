      *Wait, one more thought:* If we review it, do we have the authority to *stop* it? If it's voluntary, can the PI say "No thanks"? Usually, the University controls the resources. So the IACUC can say "We won't clear this for resource use unless reviewed." That makes it mandatory *institutionally* even if voluntary *federally*. I should phrase it as "Institutional Requirement" rather than "Federal Mandate."

      *Revised Plan:*
