      *   *Refinement:* Actually, the prompt asks to "reach a concrete recommendation... proceed without review, review it and under what standard, or something else."
      *   *Strongest Argument for Status Quo:* The "Slippery Slope/Expertise" argument. If we review octopuses, why not Drosophila? The committee isn't trained for that. Also, regulatory overreach can cause institutional liability.
