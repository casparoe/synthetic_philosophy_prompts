answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of calling Priya a friend since around 2015.

  Now, Priya asked me to give this speech, but she gave me one rule. She said, "You have to talk about the Driver."

  If you're on Priya's side of the room, you're nodding. If you're on the Groom's side, you're probably wondering if we're tipping the Uber.

  It's actually a story from philosophy. It's called Parfit's Hitchhiker. Imagine a traveler is dying of thirst in the desert. A driver comes by and says, "I'll take you to town, but only if you promise to pay me once we get there."

  Here's the catch: Once the traveler is safe in town, with water in their belly and money in their pocket, they have no logical reason to pay. They're already safe. The driver knows this. So, the driver will only pick up the traveler if they can trust that the traveler is the *kind of person* who pays even when they don't have to.

  For the last decade, Priya's personal ethos has been: "Pay the Driver."

  She calls it "rational irrationality." It means that being a person who keeps promises *only* when it's convenient makes you untrustworthy. To be truly trustworthy, you have to be the kind of person who keeps promises even when it's inconvenient. Even when you could get away with not doing it. Even when it's "irrational."

  And honestly, standing here today, looking at the two of you, I realize that this isn't just a philosophy puzzle. It is the blueprint for a marriage.

  Because let's be honest: The wedding day is the desert. You're thirsty for this celebration, you're exhausted, you've spent months planning. But the marriage? The marriage is the town.

  There will be days in your future when you are safe, and comfortable, and perhaps a little tired of each other. There will be moments where the "logical" thing to do—the easy thing—might be to cut a corner, to withhold forgiveness, or to prioritize your own comfort over the relationship.

  The world is full of people who love when it's easy. But Priya? Priya is the person who pays the driver.

  I have seen her be loyal to friends when it cost her time. I have seen her keep her word when breaking it would have been smarter. She has trained herself to be "irrationally" committed, on purpose. And that is the safest place in the world for a partner to stand.

  [Groom's Name], you are marrying a woman who believes that a promise is binding not because of the consequences, but because of who she is. And I know, watching you two together, that you understand the assignment. You are building a car where you both know the other person will pay the fare.

  So, my wish for you is this: May you always be safe enough to rest, but never so comfortable that you forget to pay the driver. May you be irrationally loyal to one another. And may you always know, with absolute certainty, that when the other person is thirsty in the desert, you will be picked up.

  Please raise your glasses.

  To Priya and [Groom's Name]: To keeping promises when no one is watching, and to a lifetime of paying the driver.

  Cheers.
