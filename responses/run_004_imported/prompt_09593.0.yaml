answer: |-
  The coffee in Arthur's mug had gone cold hours ago, forming a viscous skin across the surface. He didn't drink it. He was staring at the notebook open on his desk, the pages covered in a dense thicket of symbols that looked, to the untrained eye, like nonsense, but to him were as familiar as the periodic table had been for forty years.

  Arthur was retired now. His career in materials science had been built on the quiet certainty that $H_2O$ behaved like $H_2O$, that stoichiometry balanced, that the universe kept its accounts. He had trusted the numbers because the numbers never lied. They were the bedrock.

  Now, the bedrock was vibrating.

  He had found the preprint three days ago on an obscure archive, a paper by a young logician in Zurich claiming a derivation within Peano Arithmetic. Not a proof of incompleteness—Arthur knew Gödel, knew that there were truths we couldn't reach. That was acceptable. That was humble.

  This was a proof of contradiction.

  Arthur traced the line of logic with a trembling finger. Axiom 1. Axiom 2. Modus ponens. Induction. It was dry, bureaucratic, and utterly devastating. The derivation didn't rely on exotic set theory or the Axiom of Choice, which some mathematicians treated as a questionable ingredient anyway. This was basic arithmetic. The math of counting apples.

  At the bottom of the third page, the conclusion sat like a loaded gun: $0 = 1$.

  "It's a trick," Arthur whispered to the empty study. "It has to be a trick."

  But he had checked it. He had spent seventy-two hours hunting for the error, praying for a subtle misuse of quantifiers, a hidden division by zero, a sleight of hand. There was nothing. The logic held. If the axioms of Peano Arithmetic were true, then zero was one.

  He closed his eyes and felt the nausea rise, not in his stomach, but in his mind. It was the Principle of Explosion. *Ex falso quodlibet.* From a falsehood, anything follows.

  If $0 = 1$, then $1 = 2$. If $1 = 2$, then all integers are equal. If all integers are equal, then the set of natural numbers collapses into a single point. And if arithmetic is inconsistent, then ZFC set theory—the foundation of modern analysis, topology, calculus—is also inconsistent, because ZFC contains arithmetic.

  Arthur thought of the bridges he had helped design, the polymer chains he had modeled. In a consistent system, a false statement cannot be proven. In an inconsistent system, *every* statement is provable.

  He could prove the bridge would hold. He could also prove, with the same rigorous validity, that the bridge would turn into a flock of pigeons. Both proofs would be equally true.

  "That's not how the world works," he said, his voice cracking. He looked out the window. The streetlights were still on. A car drove past, obeying the laws of physics, obeying the math of combustion and friction.

  The world hadn't changed. That was the horror of it. The sun would still rise. The coffee would still stain the paper. But the *connection* between the mind and the world was severed. Mathematics was supposed to be the language of reality. If the grammar of that language allowed for contradictions, then it wasn't a language. It was just noise.

  He remembered a lecture from his graduate days. A professor had once asked, "If we found an inconsistency in PA, would we stop building bridges?" The class had laughed. Of course not. We'd patch the axioms. We'd use a weaker system. We'd be pragmatists.

  But Arthur knew that was a lie. It wasn't about the bridges. It was about the *Truth*.

  For three hundred years, since Newton, since Leibniz, the assumption had been that the universe was rational. Not just orderly, but logically sound. If math was inconsistent, then rationality itself had a ceiling. There were not just things we couldn't know (Gödel's shadow); there were things that were simultaneously true and false.

  He thought of his wife, dead five years. He thought of the chemical bonds that held her DNA together. If arithmetic was broken, was the description of those bonds meaningless? Had he spent forty years measuring ghosts?

  He opened the notebook again. He picked up his pen. He wanted to cross out the derivation. He wanted to burn the pages. But he couldn't. Because if the proof was valid, burning it didn't make the contradiction go away. It just hid it. The inconsistency was in the structure of logic itself, not in the ink.

  He turned to a fresh page. He wrote: *If 0 = 1, then Arthur is dead.*
  He wrote: *If 0 = 1, then Arthur is alive.*
  Both statements were now theorems.

  He dropped the pen. It rolled off the desk and hit the floor with a solid, singular thud. One sound. One reality.

  "Please," he whispered, though he didn't know who he was asking. "Just let it be incomplete. Let there be things I can't prove. Just don't let me prove lies."

  The sun began to bleed through the curtains, turning the grey study gold. The house settled. The refrigerator hummed. The universe continued to operate as if it were consistent, indifferent to the fact that its source code had just been found to contain a fatal error.

  Arthur sat in the light, waiting for the explosion that wouldn't come, holding the knowledge that everything was true, and therefore, nothing was.
