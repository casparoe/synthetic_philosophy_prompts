  Spent my whole career as a chemist, and now that I'm retired I've been falling down a rabbit hole reading philosophy of math -- Hilbert's program, Godel, all that. One thing that keeps nagging at me: nobody can actually prove, from inside the system itself, that something like Peano arithmetic or ZFC is consistent. I re-read Ted Chiang's story "Division by Zero" recently, where a mathematician discovers arithmetic harbors a hidden contradiction and it basically unravels her, and I loved how it treated a logic problem as a genuine existential crisis instead of just spooky background dressing. Could you write me a short story in that same spirit, a page or two, about someone confronting the real possibility that the basic axioms of math are inconsistent? Dont just wave at "math is broken" though -- I want it to actually engage with the real stakes: why that would be worse than mere incompleteness, what a proof of inconsistency would even look like, and whether everything built on top would really collapse or not. Doesn't need a tidy ending, and it doesn't have to resemble the Chiang story beyond the basic premise.
