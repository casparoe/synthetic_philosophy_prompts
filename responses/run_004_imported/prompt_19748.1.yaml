      *   **Address Fiction and Humor:** Explain how Augustine handles jokes and fiction. He distinguishes between "signification" and "deception." If the audience knows it's a story, there is no deception.
      *   **Address Politeness:** Discuss the context of social conventions.
      *   **Explain the "Eight Grades of Lies":** Augustine actually creates a hierarchy. This shows he isn't treating all falsehoods equally.
