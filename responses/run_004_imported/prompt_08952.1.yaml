  **Move 1:** Dominic correctly identifies the core epistemic worry of cluelessness, but he overstates the case by implying near-term expected value is meaningless rather than just uncertain.
  **Move 2:** Marlene deploys the standard and logically robust "symmetry argument": if uncertainty applies equally to all options, it cannot serve as a reason to prefer one over the other.
  **Move 3:** Dominic makes a valuable philosophical distinction between random noise and systematic bias, but his empirical claim that we know the *direction* of long-term welfare effects is unsupported.
  **Move 4:** Marlene successfully extends the symmetry argument to Dominic's refinement, noting that the counterfactual use of funds carries its own systematic long-term risks.
  **Move 5:** Dominic accurately pivots to a meta-ethical critique, correctly noting that if expected value is incalculable, the theory loses its action-guiding force regardless of the specific choice made.
  **Move 6:** Marlene is right to distinguish between the criterion of rightness and decision procedures, though she overstates the case by claiming all normative theories face this gap to the same degree.

  **Closing Note:**
  Both interlocutors overlook the argument for "near-term dominance," which suggests that even if long-term effects are clueless, sufficiently certain near-term benefits can swamp long-term uncertainty in expected value calculations. Additionally, neither mentions risk-weighted expected utility, which would allow a consequentialist to account for the variance and ambiguity of long-term outcomes without abandoning the framework entirely.
