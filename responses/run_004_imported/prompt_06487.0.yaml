      *   Setting: "Before" creation/Menu of worlds? Yes.
      *   Grounding objection with teeth? Yes.
      *   Freedom/fixity worry? Yes.
      *   Molinist counter-moves (counterfactual power)? Yes.
      *   Open Theist pressed on Providence? Yes.
      *   No clear winner? Yes.

