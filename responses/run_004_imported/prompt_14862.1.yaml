answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. The table is cluttered with printouts. One stack features David Lewis's "Causation as Influence" and *On the Plurality of Worlds*. The other features James Woodward's *Making Things Happen* and a printout of a recent LessWrong post on "Logical Counterfactuals and Causal Nets."*

  **Characters:**
  *   **LEO (The Lewisian):** Metaphysically conservative, committed to Humean Supervenience, seeks reductive analysis.
  *   **MARA (The Woodwardian):** Pragmatic realist, focused on scientific explanation and invariance, comfortable with causal primitives.

  ***

  **Leo:** I saw you reading that LessWrong post. The one trying to bridge Pearl and Functional Decision Theory. It's the same old ghost, isn't it? Everyone wants the utility of causation without the metaphysical bill.

  **Mara:** Maybe. Or maybe they realize the bill Lewis left on the table is too high. You're still carrying the torch for the old man? Humean supervenience, possible worlds, the whole mosaic?

  **Leo:** Someone has to ensure the concepts don't float free of the facts. If we're going to talk about cause and effect, we need to know what in the world *makes* it true that $C$ caused $E$. Lewis gave us that. A reductive analysis in terms of counterfactual dependence across possible worlds, grounded in non-causal particular matters of fact.

  **Mara:** Grounded in "non-causal" facts? That's where the cracks show. Let's test it. The standard late-preemption case. Suzy and Billy. Both throw. Suzy's rock hits first. Bottle shatters. Billy's rock would have hit a split second later.

  **Leo:** Classic. Lewis handles this.

  **Mara:** Does he? Simple counterfactual dependence fails. If Suzy hadn't thrown, the bottle still shatters (thanks to Billy). So, "If not-Suzy, then not-Shatter" is false. On the simple view, Suzy isn't a cause. But intuitively, she is.

  **Leo:** Lewis knows this. That's why he moves to *stepwise* dependence. There is a chain of events. Suzy's throw leads to Suzy's rock in mid-flight, which leads to the collision, which leads to the shattering. At each step, there is counterfactual dependence. If Suzy's rock hadn't been *there*, the shattering wouldn't have happened *then*. Billy's rock is cut off from the chain. The causal process is complete on Suzy's side, incomplete on Billy's.

  **Mara:** It's elegant, I'll give you that. But it's fragile. You have to rely on a very specific similarity metric between possible worlds to ensure that in the nearest world where Suzy doesn't throw, Billy *does* still throw. You're tweaking the "miracles" or the "match of particular fact" to get the intuition you want.

  **Leo:** It's not tweaking; it's precision. The world is a mosaic of local qualities. Causation supervenes on that mosaic. My account tells you how to read the causal structure off the non-causal facts. What does your interventionist account do? You say Suzy is the cause because an *intervention* on Suzy's throw changes the outcome.

  **Mara:** Exactly. In a structural equation model, I set $Billy = 1$ (he throws) as a background fixed fact, or I treat the system such that I intervene on $Suzy$. If I set $Suzy = 0$, the bottle doesn't shatter. The relationship is invariant under that intervention. Suzy is the difference-maker.

  **Leo:** But here we hit the wall. You define an "intervention" as a causal process. To intervene on $X$ with respect to $Y$, the intervention variable $I$ must cause $X$, and $I$ must not be caused by any other variable in the system except those that are causally irrelevant to $Y$ except through $X$.

  **Mara:** Right.

  **Leo:** You see the circle? You are analyzing *causation* in terms of *interventions*. But an intervention is defined as a specific kind of *causal* interaction. You haven't reduced causation to anything non-causal. You've just assumed the very notion you're trying to explain. It's viciously circular.

  **Mara:** It's only circular if your goal is Lewisian reduction. If your goal is to clarify the concept for scientific practice, it's not vicious; it's illuminating. We understand "intervention" operationally. We know what it is to manipulate a variable. We don't need to reduce "manipulation" to Humean mosaics to use it effectively.

  **Leo:** But you claim this is an account of *objective* causation, not just human manipulation. If "intervention" is a causal primitive, then your theory rests on an unanalyzed black box. Lewis offers a complete map. You offer a toolbox with a handle labeled "Cause." When I ask what the handle is made of, you say, "It's made of Cause."

  **Mara:** Lewis's map is a fantasy. He wants to reduce causation to non-causal facts plus logic and semantics. But the similarity metric for possible worlds *itself* relies on causal intuitions. When he says, "Hold the past fixed, allow a small miracle," he's making a causal asymmetry assumption. He's smuggling in the arrow of time to save the counterfactual.

  **Leo:** That's a standard objection, but Lewis argues the asymmetry comes from the asymmetry of overdetermination in the actual world, not from presupposing causation. The future leaves more traces than the past. That's a non-causal fact about the distribution of qualities.

  **Mara:** That's a stretch, and you know it. Look, let's be honest about the circularity charge. Yes, interventionism is non-reductive. I admit it. Causation is a primitive feature of the world. But it's not magic. It's about stable, invariant relationships. The "circularity" is actually a feature: causal concepts come in a package. You can't understand cause without understanding intervention, and vice versa. That doesn't make it useless; it makes it a coherent network of concepts.

  **Leo:** It makes it metaphysically idle. If I ask, "What in the world makes it true that this intervention is valid?" you have to point to... another causal fact. And if I ask what makes *that* true? You regress. Lewis stops the regress at the local qualities.

  **Mara:** Lewis stops the regress at a level that can't support the weight. Consider the rationalists you mentioned. They're struggling with "logical counterfactuals" in decision theory because they're trying to force causal reasoning into a purely logical or probabilistic box. They need interventionism. They need to know: if I *do* X, what happens? Not "if I observe X." Your counterfactuals are about similarity between worlds. Mine are about the behavior of systems under manipulation.

  **Leo:** But without reduction, how do you adjudicate disputes? If we disagree on whether a variable is "intervenable," how do we settle it? We need a causal story to define the intervention, but we need the intervention to define the cause. It's coherentist, sure, but it lacks a foundation.

  **Mara:** Foundations are overrated. Science doesn't wait for metaphysics to finish its work. Scientists distinguish causal from correlational relationships all the time using randomized trials. They know what an intervention is. They don't need to know if it supervenes on a Humean mosaic. My account captures *why* the randomized trial works: it breaks the incoming arrows to the treatment variable. Your account has to construct a convoluted chain of counterfactual dependencies to explain why the trial gives the right answer.

  **Leo:** I explain why the trial works by showing that the randomization ensures the treatment variable counterfactually depends only on the randomizer, breaking the back-door paths. I can model your interventions using my counterfactuals.

  **Mara:** Can you? Only if you assume the causal structure first to set the similarity metric! You say, "In the nearest world where the treatment is different..." But which world is nearest? The one where the laws are the same? The one where the past is the same? You decide "nearness" based on what you think is causally possible. You're using causal knowledge to fix your semantics, then claiming your semantics explain causal knowledge.

  **Leo:** I'm using causal *intuitions* to refine the analysis, yes. But the goal is to cash those intuitions out in terms of something else. You've given up on the project of analysis. You're essentially saying, "Causation is real, it's primitive, deal with it."

  **Mara:** I'm saying causation is real, it's objective, and it's characterized by invariance under intervention. The circularity isn't definitional; it's epistemic. We learn causal concepts together. But ontologically, the invariance is what matters. Lewis's view renders causation epiphenomenal. If it supervenes on the mosaic, why do we need the concept at all? Why not just talk about the mosaic?

  **Leo:** Because the mosaic is too detailed. We need summaries. Causation is the summary. But the summary must be grounded. If you detach it from the mosaic, you risk modal magic. You risk saying causal relations exist over and above the events.

  **Mara:** I don't posit extra entities. I posit structure. The structure of the world includes asymmetries of manipulation. Lewis wants to flatten the world into a sequence of snapshots. I'm telling you the world has depth. The "circularity" you hate is just the recognition that you can't understand the depth from the outside. You have to be in the game of manipulation to see the causal structure.

  **Leo:** And that's where the LessWrong crowd gets stuck. They want to run the game from the outside. They want "logical counterfactuals" that work even when the agent is part of the logic.

  **Mara:** Exactly. And interventionism handles that better. If you can't intervene, you don't have a causal claim. If the decision theory agent can't conceptually separate its action from the logical output, it hasn't identified an intervention. Lewis's counterfactuals just spin in circles there, too. "If I one-box, does the predictor..." It becomes a mess of world-similarity.

  **Leo:** A mess you resolve by... stipulating interventions?

  **Mara:** By clarifying the model. By asking what is held fixed.

  **Leo:** Which is a causal question!

  **Mara:** *Everything* is a causal question, Leo. That's the point. You want to reduce causation to non-causal facts because you're afraid of metaphysical bloat. I'm willing to accept that causation is a fundamental structural feature of reality, not reducible to spatiotemporal arrangements.

  **Leo:** And I'm willing to accept a complex similarity metric to save the world from spooky powers.

  **Mara:** (Laughs) Spooky powers? Invariance is spooky now?

  **Leo:** When it's defined by the very thing it's supposed to explain, yes. Look, we agree on Suzy. We agree on the bottle. We even agree that Billy is preempted.

  **Mara:** We agree on the verdicts. We disagree on the price.

  **Leo:** I pay in complexity of semantics. You pay in metaphysical primitives.

  **Mara:** I pay in primitives, but I buy a theory that scientists can actually use. You pay in semantics, and you buy a theory that metaphysicians can argue about for fifty years without a experiment ever touching it.

  **Leo:** Touché. But if your primitives are wrong, your science is built on sand.

  **Mara:** And if your semantics are circular, your metaphysics is built on mirrors.

  **Leo:** (Sips cold coffee) So we're at a stalemate. The rationalists will keep trying to merge us. Pearl will keep drawing graphs. Lewis will keep counting worlds.

  **Mara:** And Suzy's rock will keep shattering the bottle, regardless of whether we think it's a mosaic or a mechanism.

  **Leo:** True. But I still think you're begging the question.

  **Mara:** And I still think you're chasing a ghost.

  *(They sit in silence for a moment, looking at the Suzy and Billy diagram, neither willing to fold the paper.)*
