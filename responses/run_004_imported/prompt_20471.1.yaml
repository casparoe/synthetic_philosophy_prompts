answer: |-
  The report arrived not as a thunderclap, but as a PDF attachment in a Tuesday morning email. *Sample 44-B: Cellulose composition inconsistent with pre-1920 manufacture.*

  Elias sat in the back office of the Harbormouth Maritime Museum, the blue light of the monitor reflecting in his glasses. Outside, the North Sea battered the breakwater, a sound that had accompanied the town for centuries. Inside, hanging in the dim coolness of Gallery 3, was *The Grey Wake*. For sixty years, it had been the town's crown jewel, attributed to the Dutch master Van Der Hout. It was the reason tourists bought train tickets. It was the image on the tea towels in the gift shop.

  Elias walked to the gallery. The room was empty save for Mrs. Gable, a local who came every week to sit on the velvet bench and look at the water. She wasn't looking at the canvas, though. She was looking at her phone. The news had leaked.

  Elias stood before the painting. It was a seascape, heavy with impasto, the whites of the cresting waves built up like frosting. He knew every inch of this surface. He had cleaned the varnish layer himself ten years ago. He knew the crackle pattern in the lower left corner resembled a dried riverbed. He knew the specific yellow of the buoy in the distance was lead-tin oxide.

  Nothing had changed since yesterday. The light hitting the ridges of the paint was the same. The chemical composition of the visible pigments was identical. The beauty remained, objectively, intact.

  But Elias felt a physical recoil, a nausea deep in the gut. It was as if the painting had stepped back from him, behind a pane of glass that hadn't been there moments before.

  Yesterday, when he looked at the brushwork on the horizon, he saw the hand of a genius struggling against the limits of perception. He saw history. He saw the year 1898. He saw the master's breath in the room.

  Today, he saw a technique. He saw a decision made by a forger in a warm studio in Amsterdam, perhaps in the 1950s. He saw calculation. The brushstroke wasn't a gesture of expression; it was a simulation of one. The emotion was fake because the history was fake.

  Mrs. Gable looked up from her phone. Her eyes were red. "Is it true, Elias?"

  "The analysis is conclusive," he said. His voice sounded thin in the high-ceilinged room.

  "It looks the same," she whispered. She stood and walked to the canvas, stopping inches from the surface. She searched the grey waves. "It looks exactly the same."

  "It is the same object," Elias said.

  "Then why does it feel empty?"

  She wasn't asking about the art. She was asking about the town. The identity of Harbormouth was tied to this piece. They were the keepers of Van Der Hout's vision. Now they were keepers of a lie. The aura hadn't just faded; it had been severed. Walter Benjamin had written about the decay of the aura in the age of mechanical reproduction, but this was different. This was the decay of the aura in the age of informational truth. The object was unique. It was singular. But its lineage was broken.

  Elias reached into his pocket and pulled out the new placard. It was printed on the same brushed steel as the old one. The font was identical. The only difference was the text.

  *Attributed to: Unknown (20th Century)*
  *Title: The Grey Wake (Copy)*

  He knelt by the wall. The screws were small, requiring a specific jeweler's screwdriver. He worked slowly. Removing the old placard felt like peeling off a bandage from healed skin. He didn't want to do it. Part of him wanted to leave the old name, to let the town keep its comfort. But science was a merciless curator.

  He fitted the new steel plate into the grooves. It clicked into place.

  The sound was final.

  Elias stood up and stepped back to where he usually stood to evaluate the lighting. He looked at the painting. He tried to force his eyes to reset. He tried to invoke Goodman's distinction, to separate the aesthetic experience from the autographic history. He tried to see only the colors, the composition, the balance of light and dark.

  He looked at the buoy. Yesterday, that yellow dot was a beacon of hope in a stormy life. Today, it was a mixture of pigments applied to deceive a buyer.

  The light in the room shifted as a cloud passed over the sun outside. The painting darkened. The textures of the impasto cast tiny shadows.

  Mrs. Gable was still standing there. "I can't see it anymore," she said softly. "I look at it, and I know I'm looking at a trick. My eyes know, even if I don't want them to."

  "It hasn't moved," Elias said. He wanted to comfort her, but he couldn't find the truth that would help.

  "It's not the painting," she said, turning away. "It's the silence. The silence around it is different."

  She walked out of the gallery. Her footsteps echoed on the wood floor.

  Elias was alone with the copy. He walked closer, close enough to see the individual hairs of the brush trapped in the oil. He searched for a flaw, a hesitation, a sign of the mimicry. There was none. It was perfect. It was a masterpiece of deception.

  He raised his hand, hovering it over the canvas, feeling the radiant heat of the lights above, careful not to touch. He wondered if the value lay in the matter or in the story. If he burned the provenance documents, if he destroyed the email, if he let the town forget... would the genius return? Would the hand of the master reappear in the brushstroke?

  He looked at the signature in the lower corner. *Van Der Hout.* It was painted with confidence. It was part of the image now, another layer of oil on canvas.

  Elias lowered his hand. He stood in the silence of the gallery, looking at a perfect object that had become imperfect the moment it was understood. The paint dried slowly, century by century. The truth had arrived instantly.

  He turned off the spotlight. The painting disappeared into the gloom, but he knew it was still there, hanging in the dark, waiting for eyes that could no longer see it.
