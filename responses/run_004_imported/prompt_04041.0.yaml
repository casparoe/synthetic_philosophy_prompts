      *   *Key Sentence 2:* "When for the sake of the present, therefore, we sacrifice the future, our conduct appears to him absurd and extravagant in the highest degree, and he cannot enter into the principles which influence it."
          *   *Implication:* Discounting the future is "absurd" from the spectator's view. It's a failure of sympathy/alignment.
      *   *Key Sentence 3:* "The pleasure which we are to enjoy ten years hence interests us so little in comparison with that which we may enjoy to-day... that the one could never be any balance to the other, unless it was supported by the sense of propriety..."
