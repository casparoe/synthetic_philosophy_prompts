      *   However, he calls the sacrifice of the future "absurd." Absurdity implies a failure of reason or judgment.
      *   *Crucial Distinction:* Smith distinguishes between the *object* (the pleasure) and the *passion* (the feeling about the pleasure). The spectator judges the *object* as equal. The agent feels the *passion* as unequal.
      *   *Resolution:* It's likely a hybrid. The "absurdity" suggests a normative claim (you *ought* to value them equally), but the mechanism of failure is motivational (the passion is too weak). The "sense of propriety" acts as a counter-weight to the stronger present passion.
      *   *Behavioral Econ Connection:* This anticipates the distinction between *normative* time preference (what is rational) and *descriptive* discounting (what humans do). It also hints at "dual-system" models (System 1 present impulse vs. System 2 spectator judgment).

