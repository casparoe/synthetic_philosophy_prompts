answer: |-
  The book was a paperback, the spine cracked white, smelling of vanilla and old dust. Elias had found it in a bin outside a closed-down academic bookstore, sandwiched between a discarded thesis on mycology and a copy of *Dune*. *On the Plurality of Worlds*. David Lewis.

  He hadn't meant to read it. He'd meant to look up the quantum many-worlds interpretation to win a text argument with his brother, Mark. Mark was convinced that every time Elias hesitated at a crosswalk, the universe bifurcated, spawning a new Elias who crossed and another who waited. It was a comforting thought. It meant nothing was lost. Every missed chance was cashed out somewhere else.

  But Lewis wasn't talking about physics. He wasn't talking about splitting. He was talking about a library that had no librarian, no shelves, and no doors.

  Elias sat on his fire escape, the city humming below him. The book lay open on his knees. He read the sentence for the fourth time. *Our world is only one among many. It is not fundamentally different from the others, only different in content.*

  He looked at his hand. He flexed his fingers. In the quantum version—the one Mark believed—this hand was the result of a cascade of collapses, a singular thread pulled from a weaving loom. But Lewis was saying the loom didn't weave. The tapestry was already finished. Every possible pattern existed, stitched in concrete reality, just… elsewhere. Not in another dimension you could punch a hole into. Not in the future. Just *there*, spatiotemporally isolated.

  His phone buzzed. Mark.

  *So? Did you find the paper? Told you. We're branching every second. You're immortal, basically.*

  Elias typed back, then deleted it. How do you explain that there is no branching? That the other versions of you aren't your children, they aren't your siblings, they aren't *you*? They are strangers who look like you, smell like you, and remember being you up until a certain point, but they are as separate from you as Napoleon is from a goldfish.

  *It's not branching,* Elias wrote finally. *It's static. They're already there. We don't make them.*

  *Semantics,* Mark replied instantly. *Point is, there's a version of you who bought Bitcoin in 2010.*

  *That's not me,* Elias said. *That's a guy named Elias-749. He has my face. He has my memories. But if I die tonight, I don't wake up in his bed. I just stop.*

  The three dots of Mark's typing indicator danced for a long time, then vanished. Mark didn't get it. Nobody got it. The quantum multiverse was a story about survival. It was evolution on a cosmic scale. Modal realism was a story about solitude.

  Elias closed the book. The air was cool, biting at his cheeks. He thought about Sarah.

  It had been three years since she left. Three years of the standard human calculus: *If only I had said this. If only I hadn't worked that late. If only I had gotten on the plane.*

  In Mark's quantum world, there was a branch where Elias got on the plane. In that world, he and Sarah were probably drinking wine on a balcony in Lisbon right now. Mark would say that version of Elias was *him*, just shifted down a probability track. It made the grief bearable. It meant the happiness existed, and it was his.

  But Lewis said no.

  The Elias in Lisbon was a distinct concrete entity. He was made of different atoms, occupying a different spacetime manifold. He was a counterpart. To him, *this* Elias—the one sitting on the fire escape in the rain, alone—was the fiction. The ghost. The mere possibility.

  There was no bridge. There was no quantum tunnel. There was only the vast, silent ocean of logical space, with islands of reality floating infinitely apart. You could not swim between them. You could not signal them. You were trapped on your island, and the only reason you called it "Actual" was because you were standing on it. Just like "Here" is only special because you are standing in it.

  A wave of nausea rolled over him. It was heavier than nihilism. Nihilism said nothing mattered. This said *everything* mattered, everywhere, all at once, and none of it touched.

  If he jumped off the fire escape, he wouldn't wake up in a world where he didn't. He would just be dead. The Elias who didn't jump would go on living, yes. But that Elias was a different person. A cousin. A doppelgänger.

  So why be good? Why try? If every choice is realized somewhere, does agency vanish?

  Elias stood up. His legs felt heavy. He walked back into his apartment, the floorboards creaking. The sound was sharp, definitive. *This* sound. In a billion other worlds, the board didn't creak. In some, he wasn't walking at all. In some, the apartment didn't exist. In some, dragons flew over the skyline instead of helicopters.

  He went to the kitchen and filled a glass with water. He looked at his reflection in the dark window.

  *You are local,* he told the reflection. *You are indexical.*

  It was a terrifyingly small thing to be. To be the "Here" in a universe of "Theres."

  He thought about the future. He had a job interview tomorrow. He was terrified of it. Usually, he would soothe himself with the idea that if he failed, there was a timeline where he succeeded. But now he saw the lie in that comfort. The success wasn't his. It belonged to a stranger.

  The only thing that was his was this fear. This specific knot in his stomach. This cold glass in his hand.

  The isolation was absolute. He would never meet his other selves. He would never compare notes. He would never know if the Lisbon version was actually happier, or if he was miserable and divorced. They were causally sealed.

  And yet.

  Elias set the glass down.

  If every possible world was real, then this world—the one where he was scared, and alone, and reading philosophy on a Tuesday night—was just as real as the one where he was a celebrated architect or a dead hero. It didn't need to be *better* to be *real*.

  The quantum view demanded that reality be a tree, growing, reaching, optimizing. It implied a direction. But Lewis's view was a crystal. Static. Complete. Every facet shining with the same intensity.

  If he failed the interview, he wasn't pruning a branch. He was just walking a path that existed in the crystal. If he succeeded, he was walking a different path. Neither created the other. Neither was more "true."

  The weight lifted, just a fraction. It wasn't hope. Hope implied a future change. This was something else. Acceptance of the concrete.

  He picked up his phone again. Mark had sent one last message.

  *Whatever, man. You're overthinking it. Sleep on it.*

  Elias typed back. *I am sleeping on it. I'm sleeping right here.*

  He put the phone down. He walked to the bedroom and turned off the light. He lay down in the dark.

  He knew that somewhere, in the vast, silent plurality, there was an Elias who was closing his eyes in a penthouse. There was an Elias dying of a heart attack. There was an Elias who never met Sarah, and never felt the pain of losing her, but also never felt the joy of finding her.

  None of them were him. They were the audience; he was the actor. Or maybe they were all actors on different stages, never seeing each other's plays.

  He pulled the duvet up to his chin. The darkness of his room felt different now. It wasn't a void waiting to be filled by probability. It was a specific, concrete location. *Here.*

  He would go to the interview tomorrow. He might fail. He might succeed. It wouldn't change the total amount of reality in the universe. It wouldn't spawn new worlds. It would just be the story of this world.

  And that, Elias decided as his breathing slowed, had to be enough. To be the "Actual" for a little while. To be the "Here" before the lights went out.

  He closed his eyes. He did not dream of other worlds. He dreamed of this one, solid and heavy and his.
