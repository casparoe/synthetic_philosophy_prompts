answer: |-
  Good morning. Traditionally, this is the part where I tell you to "reach for the stars" or "trust yourself." But after this year, I'm not sure trusting ourselves is actually the best advice.

  We all survived Senioritis. We knew we needed to study for finals, yet there we were at 11 PM, watching a show we'd already seen. Why? In my philosophy elective, we spent two weeks breaking our brains over this. Socrates argued that what we call "weakness of will" doesn't actually exist. He said we never choose what we know is bad. We just mess up the math. When a pleasure is right in front of us, it looks huge. A consequence two weeks away looks tiny. It's an optical illusion of time.

  Our AP Psych teacher called this "hyperbolic discounting." Basically, our brains aren't wired to value the future smoothly. The "now" is weighted insanely higher than the "later." So, when you chose Netflix over studying, Socrates would say you weren't weak; you were just bad at measuring distance. You genuinely believed, in that moment, that the episode was worth more than the grade.

  But Aristotle disagreed. He said weakness of will is real. He argued you *did* know better. You had the knowledge, but it wasn't active. He compared it to a drunk person reciting geometry proofs or poetry. The words are there, but the understanding is asleep. When senioritis hit, maybe you weren't bad at math. Maybe you were just emotionally overwhelmed, and your knowledge went dormant. You knew the major premise—"exams matter"—but the passion of the moment clouded the minor premise—"I need to study *now*."

  So, we have a problem. Whether it's Socrates' math error or Aristotle's sleeping knowledge, the result is the same: Future Us loses to Present Us.

  Usually, a speaker would tell you to fix this by building character. "Have more willpower!" But that ignores the whole point of what we learned. Willpower is unreliable. It fluctuates. It gets tired. If Socrates and Aristotle agree on one thing, it's that human judgment is vulnerable to proximity and passion.

  So, my wish for you isn't that you become people who never struggle. My wish is that you stop trusting yourselves to be heroes.

  Instead, be architects.

  There's an old story about Odysseus sailing past the Sirens. He knew their song would make him steer the ship into the rocks. He didn't try to tough it out. He didn't tell his crew, "I believe in myself." He had them tie him to the mast and plug their own ears. He used precommitment. He knew his future self would be weak, so his past self built a structure to hold him steady.

  That is the real lesson of this year. Don't rely on your willpower to save you when things get hard. Build the mast before you leave the harbor.

  Set up automatic savings accounts so you don't spend what you should save. Join study groups where showing up is mandatory, not optional. Put your phone in another room when you work. Make friends who are willing to be the crew members who ignore your orders when you're trying to steer toward the rocks.

  We are graduating into a world that demands long-term thinking in an economy designed to hijack our short-term attention. You will feel the pull of the "now." You will have moments where your knowledge goes to sleep. That is okay. That is human.

  So, class of 2024, do not just hope you are strong enough. Know that you won't be. And then, go tie yourself to the mast. Build the systems that make doing the right thing easier than doing the easy thing. Trust your structures, not just your spirits.

  Thank you.
