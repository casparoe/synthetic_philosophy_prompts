answer: |-
  This is a profound and incredibly difficult spot to be in, and your intuition is telling you something important. Your friend is coming from a place of wanting you to have peace, and her advice is a very common coping mechanism for loved ones of people with mental illness. However, her "bad weather" analogy contains a flaw that your hesitation has correctly identified.

  To answer your question directly: **No, knowing the "cause" behind behavior does not automatically make resentment illogical, nor does it erase the need for accountability.**

  Here is the breakdown of why your hesitation is valid, where the actual line lies, and how to hold both compassion for your brother and respect for yourself.

  ### 1. The Problem with the "Bad Weather" Analogy
  Your friend suggests treating your brother's episodes like bad weather. The logic is: *You don't get mad at a storm for raining; you just bring an umbrella.*

  The problem is that your brother is not a storm. He is a human being with agency.
  *   **Dehumanization:** When we attribute all harmful behavior solely to a disorder ("It wasn't him, it was the BPD"), we inadvertently strip the person of their agency. If he isn't responsible for the bad stuff, is he truly responsible for the good stuff? If he is just a vessel for symptoms, he isn't a full participant in the relationship.
  *   **The Recovery Paradox:** Effective treatment for BPD (like Dialectical Behavior Therapy) is built on the premise that while emotions may be involuntary, **behaviors and repairs are choices.** By saying "it's just the disorder," your friend is actually lowering the bar for his recovery. Holding him accountable is, ironically, more respectful of his personhood than excusing him.

  ### 2. Explanation vs. Excuse
  There is a massive ethical difference between explaining behavior and excusing it.
  *   **Explanation:** "He said those vicious things because his emotional regulation failed during an episode." (This is true and helpful for understanding.)
  *   **Excuse:** "Because his emotional regulation failed, the harm doesn't count, and you shouldn't feel hurt." (This is false.)

  Resentment is not just "anger." Psychologically, resentment is often a signal that a boundary has been crossed and **the harm has not been adequately repaired.** You can understand *why* someone hit you (e.g., they were having a seizure) and still feel shaken and hurt by the impact.

  If you force yourself to drop the resentment solely because there is a "cause," you are gaslighting your own pain. You are prioritizing his diagnosis over your lived experience.

  ### 3. Where is the Line?
  The line lies between **Intent/Control** and **Impact/Repair.**

  **During the Episode (Limited Control):**
  You are right to adjust expectations here. If he is in a dissociative state or extreme emotional dysregulation, he may not have full access to his rational brain. In that specific moment, expecting him to be calm is like expecting a broken leg to run. This is where your friend's advice applies: *Don't take it personally in the moment.*

  **After the Episode (High Control):**
  This is where the line is drawn. Once the episode passes, the responsibility shifts to **repair.**
  *   Did he acknowledge the specific harm?
  *   Did he validate your pain?
  *   Did he discuss a plan to mitigate it next time?

  You mentioned he offered a half-hearted "sorry, I was in a bad place." This is likely the source of your stuckness. That is an explanation, not an apology. It centers his state ("I was in a bad place") rather than your injury ("I hurt you").

  Your resentment is lingering because the transaction is incomplete. He took something from you (your sense of safety/respect) and hasn't paid it back with genuine accountability.

  ### 4. Why Your Hesitation is Healthy
  You said, *"Another part feels like fully dropping the resentment treats him as less of a person, not more."*

  You are absolutely right. This is a concept in ethics called **Moral Exclusion.** If we decide someone is not responsible for their actions because of an illness, we sometimes slide into treating them like a child or a patient rather than a brother.
  *   **Compassion** says: "I know you are suffering and this illness makes things hard for you."
  *   **Boundaries** say: "I know you are suffering, but I cannot be the target of it."

  If you drop the resentment entirely, you risk enabling the behavior. If he learns that "BPD" is a get-out-of-jail-free card for viciousness, he has less incentive to do the hard work of managing his symptoms. Protecting your boundaries actually helps him, because it provides real-world consequences that encourage growth.

  ### 5. How to Move Forward
  You don't have to choose between "Hating my brother" and "Pretending it didn't happen." There is a middle path.

  *   **Validate your hurt:** Tell yourself, "It makes sense that I am hurt. Words have impact regardless of intent."
  *   **Reframe the resentment:** Instead of viewing it as "holding a grudge," view it as "waiting for repair." Your system is telling you the wound hasn't closed yet.
  *   **Communicate the Line:** If you feel safe doing so, you can tell him: *"I love you and I know the BPD makes emotions intense. But when you say [X], it hurts me. 'I was in a bad place' explains it, but it doesn't fix the hurt. I need to know you understand how much that damaged our trust."*
  *   **Adjust Expectations (The Right Way):** Your friend was right about one thing: adjust expectations. But adjust them regarding **safety,** not **accountability.**
      *   *Wrong adjustment:* "I won't expect him to apologize."
      *   *Right adjustment:* "I won't expect him to be stable 100% of the time, but if he becomes abusive, I will leave the conversation/house until he is regulated."

  ### Summary
  Your friend is advocating for **peace at the cost of truth.** You are advocating for **truth at the cost of comfort.**

  In a sibling relationship, truth usually wins in the long run. You can have compassion for his struggle with BPD without accepting abuse as the price of admission. Your resentment isn't a failure of empathy; it's a guardian of your self-respect. Keep it until the repair is genuine.
