  *(Self-Correction Note)*: I need to make sure the Millian doesn't accidentally concede too much to the "guise" argument without framing it as a pragmatic feature of belief *attribution* rather than belief *content*. That's the standard Millian defense (Salmon/Soames style). The Fregean should attack that distinction.

  Let's write it.
answer: |-
  **Setting:** *Outside the philosophy department, 5:30 PM. The autumn wind is cutting. FREY (Fregean) and MILL (Millian) are walking toward the bus stop. They have clearly not stopped talking since the seminar ended.*

  **MILL:** Well, that was a bloodbath. Kripke really walked in there, dropped two little stories about Frenchmen and pianists, and watched the entire room try to drown in their own distinctions.

  **FREY:** It wasn't a bloodbath, it was a reductio. Did you see the professor's face when you tried to claim Peter isn't believing a contradiction?

  **MILL:** Because he isn't! That's the point, Frey. Peter is a rational agent. He's not walking around asserting "Paderewski has talent and Paderewski lacks talent." He's asserting "The pianist has talent" and "The statesman lacks talent." He just happens to be wrong about the world—specifically, he's wrong that there are two Paderewskis. But ignorance isn't irrationality.

  **FREY:** Ignorance of *fact* isn't irrationality. Ignorance of *logic* is. If names contribute nothing but their referent to the proposition, then the content of Peter's belief in case one is <Paderewski, Having-Talent>. The content of his belief in case two is <Paderewski, Lacking-Talent>.

  **MILL:** Right.

  **FREY:** So he believes $Fa$ and he believes $\neg Fa$. He holds contradictory beliefs about the same object. If he's rational, he shouldn't do that. You Millians always say belief is a relation between a subject and a proposition. If the proposition is the same, the relation should be consistent. You're forced to say Peter is logically incompetent.

  **MILL:** I'm forced to say nothing of the sort. I'm saying *belief attribution* is context-sensitive. When we say "Peter believes Paderewski had talent," we are implicitly indexing that to the 'pianist' guise. When we say "Peter believes Paderewski lacked talent," we index to the 'statesman' guise. The *proposition* believed is the same singular proposition, but the *way* Peter grasps it differs. We just don't encode the guise in the semantics of the name. We encode it in the pragmatics of the report.

  **FREY:** [Stops walking] Oh, come off it. "Guise"? "Way of grasping"? You're smuggling Sense in through the back door! You want to keep the clean, hard ontology of Direct Reference—names are just tags—but the moment things get tricky, you start talking about cognitive perspectives. That *is* Sense. You're a Fregean in denial, Mill.

  **MILL:** [Keeps walking, faster] I am not. Sense is supposed to be semantic content. It's supposed to determine reference. If "Paderewski" and "Paderewski" are the same word in the same language, on your view, they should have the same Sense. That's the beauty of Kripke's second puzzle. It's not like Pierre. With Pierre, you could at least try to argue that "Londres" and "London" have different linguistic senses because they belong to different languages.

  **FREY:** Exactly! The Translation Principle is shaky. Just because two terms translate doesn't mean they present the object in the same way to the *speaker*.

  **MILL:** But Peter! It's the *same name*. Same spelling, same sound, same linguistic community. If Sense is public—if it's part of the language and not just inside Peter's head—then the Sense of "Paderewski" must be identical in both utterances. If the Sense is identical, and Sense determines Cognitive Significance, then Peter should realize it's the same guy. The fact that he doesn't proves that "Sense" isn't doing the work you say it is. You have to retreat to private mental files. And if you do that, you've abandoned public semantics for psychology.

  **FREY:** I don't have to retreat anywhere. The Sense is the mode of presentation. For Peter, the mode of presentation associated with the first token of "Paderewski" involves *hearing about a concert*. The mode of presentation associated with the second involves *reading a political pamphlet*. These are distinct cognitive routes to the referent.

  **MILL:** But those aren't in the *name*! Those are in Peter's biography. If Sense is that granular, then communication is impossible. I never grasp the exact same Sense you do. My "London" is tied to my memories, your "London" to yours. If Sense is the content of belief, we never believe the same things.

  **FREY:** We share the *reference*, Mill. That's how we talk about the world. But we don't share the cognitive significance. That's why identity statements are informative! "Hesperus is Phosphorus" taught us something. "Paderewski is Paderewski" teaches Peter nothing, but "The Paderewski I heard play is the Paderewski I read about" would teach him something. The puzzle doesn't break Frege; it just shows that names can be associated with different descriptive clusters for different speakers, or even the same speaker at different times.

  **MILL:** [Turns sharply] But Kripke killed the Descriptive Theory! We went over this three weeks ago. Peter isn't associating a description. He's just using the name. He's a causal theorist! He got the name via a chain. One chain goes to the pianist, one to the statesman. They converge on the same man. If the name is just a tag passed down the chain, the tag is identical. So the content is identical. So Peter is believing a contradiction.

  **FREY:** Or, the puzzle shows that the Disquotation Principle—"If a normal speaker assents to 'p', he believes that p"—is too crude.

  **MILL:** Aha! So you concede! You have to restrict the principles of belief attribution to save your Senses.

  **FREY:** And you have to restrict the transparency of belief reports to save your Direct Reference. We're in the same boat.

  **MILL:** No, we're not. Look at the symmetry. Kripke's puzzle is supposed to be neutral, right? A plague on both your houses. But it's not symmetric. For me, the problem is explaining away the *appearance* of contradiction. I say: It looks like Peter believes $p$ and $\neg p$, but really he believes $p$ under guise $A$ and $p$ under guise $B$. The contradiction is in the *reporting*, not the *world*.

  **FREY:** And for me?

  **MILL:** For you, the contradiction is in the *semantics*. If "Paderewski" has two Senses, then "Paderewski" is ambiguous. Like "bank." But it's not ambiguous! It's the same name. If you say it has two Senses, you're saying the word itself changed meaning without changing form. That destroys compositionality. You can't know the meaning of a sentence just by knowing the meanings of the words, because you don't know *which* Sense of "Paderewski" is in play until you psychoanalyze the speaker.

  **FREY:** That's a feature, not a bug! Language is a tool for expressing thought. If the thought differs, the semantic value in that context differs. But let's turn it back on you. You say Peter is rational. Fine. But suppose Peter is a logician. He sits down and writes:
  1. Paderewski is musical.
  2. Paderewski is not musical.
  He doesn't see the contradiction because he doesn't know the names co-refer. On your view, the proposition expressed by (1) is identical to the negation of (2). So he is explicitly affirming $X$ and $\neg X$.

  **MILL:** He's affirming $X$ via route A and $\neg X$ via route B.

  **FREY:** Routes! You keep saying routes. If the route matters for rationality assessment, then the route is part of the content relevant to the attitude. You can't just say "It's all the same proposition" and then explain his behavior by appealing to differences that you claim aren't semantic. You're having your cake and eating it. You want the simplicity of Millianism for metaphysics, but you need Fregean machinery for psychology.

  **MILL:** I want the simplicity of Millianism for *semantics*. I admit psychology is messy. But you... you're making semantics messy. You're making the meaning of "London" depend on whether I learned it from a French textbook or an English immersion program. That makes meaning subjective. If meaning is subjective, how do we disagree? If I say "London is pretty" and you say "London is not pretty," are we even talking about the same thing?

  **FREY:** We're talking about the same *object*. That's enough for disagreement about the world. We disagree about the property instantiation. We just grasp that disagreement through different modes.

  **MILL:** But in the Pierre case, Pierre says "Londres est jolie" and "London is not pretty." He thinks he's talking about two cities. You have to say he's expressing two different propositions.

  **FREY:** I do say that.

  **MILL:** But "Londres" and "London" mean the same thing! They are synonyms. If they mean the same thing, they express the same proposition. If they express the same proposition, Pierre believes a contradiction. If you say they express different propositions because Pierre *thinks* they are different, then meaning is in the head. And if meaning is in the head, reference doesn't determine meaning. And if reference doesn't determine meaning, Twin Earth kills you.

  **FREY:** [Laughs bitterly] Don't you dare bring Twin Earth into this. Putnam buried externalism, he didn't save Millianism. Look, the puzzle works against us both, but it hurts you more. Why? Because I can accommodate the data. I can say "Sense is fine-grained." I can say "Translation doesn't preserve Sense for the speaker." It costs me some elegance, but it saves the phenomena.

  **MILL:** And I save the phenomena too!

  **FREY:** No, you save the *logic* by sacrificing the *psychology*. You make Peter look like a bad logician to save the idea that names are tags. I make the language flexible to save the idea that Peter is rational. Which is the greater sin? Misdescribing language or misdescribing the mind?

  **MILL:** Misdescribing language is the sin of philosophy of *language*! If you make Sense too thin, it collapses into Reference. If you make it too thick, it collapses into Psychology. Kripke showed you're stuck in the middle. "Paderewski" can't have two Senses in the public language. It's one name. So your "Sense" isn't public. It's private. And if it's private, it's not semantics.

  **FREY:** And if your "Proposition" is something Peter can believe and disbelieve simultaneously without noticing, it's not a credible object of belief. It's a ghost. A metaphysical shard that does no explanatory work. Why posit singular propositions if they can't explain behavior?

  **MILL:** Because they explain *truth conditions*! "Paderewski is musical" is true if and only if Paderewski is musical. It doesn't matter how Peter grasps it. The world makes it true, not Peter's head.

  **FREY:** We aren't talking about truth conditions, Mill. We're talking about *belief*. The seminar was about the Puzzle about *Belief*. If your theory of content can't handle the attitude, it's useless for this domain.

  **MILL:** [Stops at the bus stop] Maybe the domain is the problem. Maybe belief reports are just... messy. Contextual. Not a mirror of metaphysical reality.

  **FREY:** [Stops beside him] So you admit it. The disquotation principle fails. The translation principle fails. We can't map assent to belief directly.

  **MILL:** I admit that *attribution* is messy. I don't admit that *content* is messy. The world is sharp. Names point to things. Peter is just confused.

  **FREY:** And I admit that *reference* is stable. But the cognitive value varies. Pierre is not confused; he's informationally isolated.

  **MILL:** [Bus approaches] You know, Kripke never solved it. He just left it there.

  **FREY:** [Steps onto the bus] Maybe because it's not a puzzle to be solved. It's a tension to be managed. Semantics pulls one way, Psychology pulls the other.

  **MILL:** [Follows her on, swipes his card] I think it's a grenade. And Millianism is still standing.

  **FREY:** [Takes a seat] Only because you're holding it with your eyes closed.

  **MILL:** [Stands in the aisle] Better than drowning in Senses you can't define.

  **FREY:** [Looks out the window] See you next week. We're doing Donnellan.

  **MILL:** [Groans] Great. Referential vs. Attributive. More ways to argue about whether anyone knows what anyone is talking about.

  **FREY:** Exactly.

  *[The bus pulls away. Neither looks at the other.]*
