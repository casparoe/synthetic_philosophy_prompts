      4.  Precedent & Common Knowledge: Explain the instability of the "rule."
      5.  "Languages and Language": Distinguish meaning from provenance.
      6.  Prediction: It will not stabilize.

      *(Final check on Lewis's specific text)*: In *Convention*, Lewis emphasizes that conventions solve *recurrent* coordination problems. If the problem changes every 6 months (new model, new detector), it's not the *same* recurrent situation $S$. This is a key technical point to hit.

