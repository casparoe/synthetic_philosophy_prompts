answer: |-
  David Lewis would likely find your observation philosophically rich, but he would probably conclude that this word-avoidance behavior is **not a convention in the strict technical sense** defined in his 1969 book *Convention*. While it superficially mimics the structure of a convention (a regularity in behavior sustained by expectation), the underlying game-theoretic structure violates two of his core criteria: the requirement of a **coordination problem** (as opposed to a conflict or signaling game) and the requirement of **arbitrariness**.

  Here is a reconstruction of how Lewis would analyze this situation, drawing on *Convention* and his later paper "Languages and Language" (1975).

  ### 1. The Coordination Problem vs. The Adversarial Signal
  Lewis's theory rests on the premise that conventions arise to solve *coordination problems*. In a coordination problem (like driving on the right side of the road), parties have a **coincidence of interest**. I want to match your behavior, and you want to match mine. We both prefer the equilibrium where we match over the equilibrium where we clash.

  In your scenario, the interests are not perfectly coincident.
  *   **The Human-Human Layer:** There is a coordination interest between you and your colleagues. You both want successful communication and trust.
  *   **The Human-AI Layer:** There is an adversarial interest between human writers and AI generators (and the detectors trying to distinguish them).

  Lewis would argue that the regularity (avoiding "delve") is not sustained primarily by the mutual benefit of matching each other, but by a **defensive response to an external constraint** (the detector/reader suspicion). In *Convention*, Lewis distinguishes between conventions and mere regularities caused by common external pressures. If we all carry umbrellas because it is raining, that is not a convention; it is a shared reaction to a state of nature.

  Lewis would likely classify the "AI detection" environment as a change in the **payoff structure** of the situation, not a coordination equilibrium. You avoid "delve" not because you prefer to match your colleague's vocabulary, but because using "delve" now carries a penalty (suspicion of artificiality). If the penalty were removed (e.g., if readers stopped suspecting AI), the regularity would vanish. In a true Lewisian convention, the regularity persists because *others* conform, not because an external detector flags the deviation.

  ### 2. The Loss of Arbitrariness
  A crucial condition for a Lewisian convention is **arbitrariness**. There must be at least one alternative regularity ($R'$) that could have solved the coordination problem equally well. We drive on the right, but we could have driven on the left. Both work.

  In your case, is avoiding "delve" arbitrary?
  *   **Initially:** Yes. "Explore" and "delve" were interchangeable.
  *   **Currently:** No. Because detectors and readers have been trained to flag "delve" as high-probability AI, using "delve" is now objectively riskier than using "explore."

  Lewis would argue that once a specific word acquires a "cost" (mistrust), the choice is no longer arbitrary. It becomes a **rational imperative** rather than a conventional agreement. You are not coordinating on a signal; you are optimizing against a threat. In *Convention*, Lewis writes that if one equilibrium becomes strictly better than another due to external factors, it ceases to be a convention and becomes a matter of prudence. The "unwritten rule" you describe is less like driving on the right and more like avoiding a bridge that has been marked "Unsafe."

  ### 3. Precedent and the Recurrent Situation ($S$)
  Lewis defines a convention as a regularity in a **recurrent situation $S$**. The same situation must arise repeatedly, allowing precedent to guide expectation.

  Lewis would point out a fatal instability here: **The situation $S$ is not recurrent; it is evolving.**
  *   In month 1, $S$ = "Write a report without 'delve'."
  *   In month 6, $S$ = "Write a report without 'delve' or 'tapestry'."
  *   In month 12, $S$ = "Write a report without 'delve,' 'tapestry,' or em-dashes."

  Because the AI models and detection methods adapt, the "rules of the game" change faster than a precedent can solidify. Lewis's theory relies on **common knowledge** built on past success: "We did $R$ last time, it worked, so we expect to do $R$ this time." In your environment, doing $R$ (avoiding "delve") last time does not guarantee it will work this time, because the "opponent" (the statistical model) has updated its weights.

  Lewis would argue that you cannot have a convention without a stable precedent. What you are witnessing is a **transient equilibrium in a signaling game**, not a convention. It is a series of temporary fixes, not a settled rule.

  ### 4. "Languages and Language": Truthfulness vs. Provenance
  In his 1975 paper "Languages and Language," Lewis extends his theory to semantics. He argues that language itself is a convention of **truthfulness and trust**. We speak truthfully because we expect to be trusted, and others trust because they expect truthfulness.

  Lewis would distinguish between:
  1.  **Conventions of Meaning:** The agreement that "delve" means "to investigate deeply." This remains stable.
  2.  **Conventions of Provenance:** The agreement that "delve" signals "human authorship." This is collapsing.

  He would suggest that the anxiety you feel stems from a confusion between these two. The convention of *meaning* is intact (everyone understands what you wrote). The convention of *trust* is under attack. However, Lewis would note that in his framework, trust is based on the expectation of truthfulness, not stylistic markers. If a reader mistrusts a true statement because it uses "delve," they are violating the convention of language (trust) based on a heuristic (style) that is not part of the semantic convention.

  Lewis might say the readers are committing a category error. They are treating a stylistic regularity (which should be arbitrary) as evidence of a semantic violation (dishonesty/AI-generation).

  ### 5. Lewis's Prediction: Dissolution, Not Stability
  Given his apparatus, Lewis would predict that this specific regularity **will not settle into a stable convention.**

  *   **Reason 1: Lack of Coinciding Interests.** As long as AI models are trained to minimize perplexity (which often leads to words like "delve"), and detectors are trained to maximize perplexity, the "optimal" human strategy must constantly shift. A convention requires a stable equilibrium; this is an arms race.
  *   **Reason 2: Common Knowledge Breakdown.** For a convention to hold, it must be common knowledge that *everyone* knows *everyone* conforms. In your office, this is becoming true. But in the wider population, it is not. As soon as the "avoidance list" becomes common knowledge, AI models will be fine-tuned to avoid those words too. Once AI stops using "delve," humans can use it again to signal humanity. This oscillation prevents the "common knowledge" condition from locking in.

  ### Conclusion: What Would Lewis Call It?
  Lewis would likely classify this not as a **Convention**, but as a **defensive signaling regularity within a mixed-motive game.**

  *   **It is not a Convention** because the regularity is not arbitrary (one option is penalized) and the situation is not recurrent (the rules change).
  *   **It is a Signaling Game** because writers are trying to send a signal ("I am human") that is costly for the "imposter" (AI) to mimic, though currently, the cost is low for the imposter.
  *   **It is Defensive** because the motivation is avoidance of penalty, not achievement of coordination.

  **Lewis's Advice:**
  If you could ask him, he would likely advise that you cannot convention your way out of a structural conflict. The only way to restore a genuine convention of trust is to decouple *style* from *provenance*. As long as "delve" is treated as evidence of AI, the coordination problem remains unsolved. He might suggest that the community needs to establish a new convention of **verification** (e.g., "we trust based on attribution, not vocabulary") rather than a convention of **avoidance**. Avoidance lists are inherently unstable because they rely on the ignorance of the adversary; once the adversary learns the list, the convention collapses.

  In short: You are watching a convention try to form on quicksand. Lewis would say it looks like a duck, but it lacks the skeletal structure of a convention. It is a temporary truce in a war, not a rule of the road.
