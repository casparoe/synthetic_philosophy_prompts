      *   *Tone:* Professional, analytical, decisive. Avoid hedging too much.

  6.  **Final Polish:** Check against the prompt's specific constraints.
      *   "Reach a real verdict." (Yes)
      *   "Defend it against the strongest version of the opposing case." (Yes, the Coherence/Money Pump argument).
      *   "Weigh the two strategies." (Yes, Indifference vs. Incompleteness).
