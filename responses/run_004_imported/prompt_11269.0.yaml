answer: |-
  You have put your finger on one of the most famous, persistent, and technically difficult problems in 20th-century metaethics. You aren't just imagining this tension; you have independently reconstructed the **Frege-Geach Problem** (sometimes called the Embedding Problem).

  Since you've taught intro ethics, I'll skip the preamble and go straight to the diagnosis: Your brother-in-law is holding a version of **Simple Emotivism** (or naive Non-Cognitivism). The puzzle you identified regarding the conditional statement ("If owning up is right...") is widely considered the fatal flaw of that specific view.

  However, whether it kills *all* versions of expressivism is still a live debate. Here is the breakdown of why this bugs you, whether it's fixable, and how to explain it to him before the next holiday gathering.

  ### 1. The Problem: Logic Requires Content, Not Just Force
  Your intuition is spot on. In the argument your brother-in-law made:

  1.  If owning up to mistakes is right, then telling the boss is right.
  2.  Owning up to mistakes is right.
  3.  Therefore, telling the boss is right.

  This is a instance of *Modus Ponens*. For this argument to be **valid**, the phrase "owning up to mistakes is right" must mean the **exact same thing** in premise 1 as it does in premise 2.

  *   **In Premise 2:** On his view, he is expressing an attitude (Cheering!).
  *   **In Premise 1:** He is *not* expressing an attitude. He is not cheering for owning up to mistakes inside the antecedent of a conditional. He is merely considering a relationship between propositions.

  If the meaning of the sentence changes depending on whether it's being asserted or embedded in a conditional, the argument commits the fallacy of **equivocation**. It would be like arguing:
  1.  If *banks* are steep, we can't climb them.
  2.  *Banks* hold our money.
  3.  Therefore, money-holders can't be climbed.

  The word "bank" shifts meaning, so the logic fails. Your brother-in-law wants to have his cake (moral sentences aren't truth-apt facts) and eat it too (moral sentences function in logic exactly like truth-apt facts). The Frege-Geach problem argues he can't do both.

  ### 2. Is it Fatal or a Wrinkle?
  **For his specific view (Simple Emotivism)?**
  It is fatal. If moral language is *just* "Boo!" and "Hooray!", it cannot function logically. You cannot derive a "Boo!" from an "If Boo! then..." structure. Logic governs truth-preserving relations between propositions; emotions don't have truth values.

  **For sophisticated Expressivism (Quasi-Realism)?**
  It is a "wrinkle" that requires massive theoretical machinery to patch. Philosophers like **Simon Blackburn** (Quasi-Realism) and **Allan Gibbard** (Norm-Expressivism) have spent careers trying to solve this.
  *   **The Patch:** They argue that we can reconstruct logic not in terms of *truth conditions*, but in terms of **consistency of attitudes**. To accept the premises but deny the conclusion isn't "false," it's a kind of pragmatic inconsistency in your own web of attitudes (like believing "If P then Q" and "P" but refusing to accept "Q").
  *   **The Catch:** Many critics (including cognitivists and realists) argue that in patching this hole, expressivists end up reinventing truth conditions anyway. They end up describing a "logic of attitudes" that looks so much like a "logic of propositions" that the distinction collapses.

  So, is it a problem that shows it can't be the whole story? **Yes.** It shows that moral language *cannot be merely* cheering and booing. It must have a propositional structure that allows for embedding, even if the metaphysical grounding of that structure is debated.

  ### 3. The Thanksgiving Explanation
  Since you want to explain this to him without getting bogged down in jargon, here is a clean way to frame it over pie. You don't need to use the name "Frege-Geach," but you should use the structure of the objection.

  **The Setup:**
  Tell him you agree that moral feelings are like cheering. But point out that *arguments* aren't just collections of cheers; they are maps of how ideas connect.

  **The Script:**
  > "Look, I get the 'booing' idea. When I say 'Murder is wrong,' I am definitely expressing an attitude. But here is the glitch: Logic works on **content**, not **attitude**.
  >
  > Imagine I say: 'If murder is wrong, then hiring a hitman is wrong.'
  >
  > In that sentence, I am not currently booing murder. I'm not even saying murder *is* wrong. I'm just setting up a rule. If your theory is right, that first sentence doesn't have a 'truth' to it, it's just a hypothetical cheer.
  >
  > But then when you say, 'Murder *is* wrong,' and conclude 'Hiring a hitman is wrong,' you're treating that first sentence like it was a fact all along. You're using it like a brick in a wall.
  >
  > If moral sentences are just noises we make when we feel strongly (like 'Ouch!' or 'Yay!'), they can't be bricks. You can't build a logical bridge out of 'Ouch.' The fact that we *can* build that bridge—and that your argument about my sister felt perfectly logical—suggests that moral sentences have to be capable of being true or false, at least enough to fit into the 'If/Then' structure. Otherwise, you're just equivocating."

  **The "Gotcha" Question:**
  If he pushes back, ask him this:
  > "Do you think your argument about my sister was **valid** regardless of how anyone felt? If a Nazi heard your argument, understood the words, but didn't care about honesty, would you say he made a *logical error* by rejecting the conclusion, or just a *moral error*?
  >
  > If it's a logical error, then the premises must have truth values. If it's just a moral error, then logic doesn't apply to ethics at all, and you can't argue people into morality, you can only cheer louder."

  ### Summary for You
  You are right to be bugged. The fact that moral sentences embed in conditionals, negations, and questions without losing their meaning is the strongest evidence that they function cognitively (as propositions), even if their ontology is weird.

  Your brother-in-law is a **naive expressivist**. He can salvage the *spirit* of his view by moving to **Quasi-Realism**, but he has to concede that moral language *mimics* fact-stating discourse so perfectly that for all logical and practical purposes, it *is* fact-stating discourse. He can't have the simple "it's just booing" view and also claim to be making valid logical arguments.

  Enjoy the pie, and happy debating.
