      Better grade: 7.5 or 8/10. Let's stick with 8/10 but be very specific in the feedback that the conclusion is problematic. Actually, 8/10 feels generous if they missed the main point of part (c). The main point of (c) is the *dilemma*. SIA has PP cost; SSA has DA cost. The student says SIA has PP cost, SSA has DA mechanism, but DA isn't a cost. That misses the symmetry of the problem.
      Let's adjust the rubric weights to reflect the complexity.
      Definitions: 2 pts.
      PP Explanation: 3 pts.
      SSA Cost Analysis: 5 pts. (This is the critical thinking part).
      Score: 2 + 3 + 3 = 8/10.
      Or keep it simple: 2 / 4 / 4.
