      PP: 4/4.
      SSA Cost: 2/4. (1 pt for mentioning DA, 1 pt for explaining mechanism, 0 pts for correctly identifying it as a cost/consequence that balances the PP problem).
      Total: 8/10.

      *Refining the Feedback:*
      I need to be careful not to sound like I'm grading *myself*. I am acting as a TA/colleague giving a second opinion.
