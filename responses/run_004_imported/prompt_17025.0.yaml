          *   *Grading Decision:* This is the differentiator. The student identifies the DA but fails to recognize it as the "cost" requested by the prompt. They answer the "whether" with "no," when the literature standard is "yes." This is a significant conceptual error in part (c).

  4.  **Drafting the Rubric & Grade:**

