prompt: |-
  My older sister died ten days ago, and I have been asked to deliver her eulogy at the memorial service this Saturday. She spent thirty years as a school secretary, never set foot in a university, and would have been the first to laugh at anyone who called her a philosopher, but for roughly the last fifteen years of her life she was quietly preoccupied with an idea she had picked up from online philosophy forums and always called, in exactly those words, "consequentialist cluelessness" -- the worry that even when you are sincerely trying to do the most good, you can never trace out the full downstream consequences of what you do, and so can never really know whether you succeeded. For most of that time she gave a fixed slice of her modest paycheck every month to the Against Malaria Foundation, and I remember her at Thanksgiving one year, half-laughing and half-stricken, having just read that some of the very bed nets these charities distribute get used as fishing nets instead, wanting to know out loud whether that meant her donations might have quietly depleted somebody's fish stocks and left the people she meant to help worse off. She never arrived anywhere she was willing to call an answer. It became a kind of family joke that wasn't really a joke: she would say "well, we can't know that," and keep sending the money anyway. I never shared her reading habits, but living alongside that argument of hers for fifteen years, I have done a good deal of thinking about it myself this past week.

  The service itself will be small, made up mostly of former coworkers, neighbors, and our elderly parents, none of whom has ever heard the phrase "consequentialist cluelessness" and who simply want to be told, truthfully, that her life clearly added up to something good. But two friends from that same online reading group are flying in, and they will know immediately if I either pretend she had settled the question or let the eulogy slide into suggesting that nothing she did could ever be shown to matter -- either one would misrepresent how seriously, and how honestly, she actually sat with this for fifteen years. Could you write the eulogy for me? It should run to about five minutes read aloud, comfort the people who are there simply to grieve, and still be true to the specific, unresolved worry she spent so much of her life quietly carrying.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Sibling of the deceased.
      *   **Deceased:** Older sister, school secretary for 30 years, no university degree, humble, practical.
      *   **Key Theme:** "Consequentialist cluelessness" (the philosophical worry that we can't know the full consequences of our actions, so we can't know if we did good).
      *   **Duration of Theme:** Preoccupied with this for the last 15 years of her life.
      *   **Action:** Donated to Against Malaria Foundation (AMF) monthly despite the worry.
      *   **Specific Anecdote:** Thanksgiving, worried about bed nets being used as fishing nets and depleting fish stocks.
      *   **Her Stance:** Never settled on an answer. "Well, we can't know that," but kept sending money anyway.
      *   **Audience:**
          *   Majority: Coworkers, neighbors, elderly parents (need comfort, want to hear her life mattered).
          *   Minority: Two friends from the online philosophy group (need authenticity, no pretending the question was solved, no nihilism).
      *   **Tone:** Comforting, truthful, specific, respectful of her intellectual honesty, not overly academic but not dumbed down.
      *   **Length:** About 5 minutes read aloud (approx. 600-750 words at a moderate pace).

  2.  **Determine the Core Message:**
      *   The tension is between *uncertainty* and *action*.
      *   She didn't give because she was sure it would work; she gave *despite* not knowing.
      *   This makes her goodness more profound, not less. It's faith in action, not faith in results.
      *   For the family/coworkers: Her life mattered because she showed up and cared.
      *   For the philosophy friends: She lived the paradox without resolving it.
      *   Synthesis: The value wasn't in the perfect outcome; it was in the willingness to try amidst the unknown.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, establish her role (school secretary, sister), and set a warm tone.
      *   **The "Secret" Life:** Introduce the philosophical interest gently. Don't use jargon immediately. Describe her as a thinker without making her sound pretentious.
      *   **The Specific Worry:** Bring in "consequentialist cluelessness" but explain it simply. Use the Thanksgiving/bed net anecdote. This grounds the abstract in the real.
      *   **The Resolution (or lack thereof):** Address the fact that she never solved it. This is crucial for the philosophy friends.
      *   **The Action:** Emphasize that she kept donating. This is the comfort for the family. She didn't stop caring.
      *   **The Meaning:** Reframe the uncertainty. It's not a failure; it's a form of courage.
      *   **Closing:** Direct address to the parents, coworkers, and the friends. A final farewell.

  4.  **Drafting - Refining the Tone:**
      *   *Challenge:* How to say "consequentialist cluelessness" to elderly parents without losing them?
      *   *Solution:* Define it immediately in plain English. "The worry that we can't see the whole story."
      *   *Challenge:* How to avoid nihilism ("nothing matters")?
      *   *Solution:* Focus on the *intent* and the *act* of giving, not the metric of success.
      *   *Challenge:* How to avoid false certainty ("she saved lives")?
      *   *Solution:* Focus on her *commitment* to trying.

  5.  **Drafting - Writing (Iterative Process):**

      *   *Start:* Thank everyone. Mention her job. She was the backbone of the school.
      *   *Middle:* Talk about her mind. She read things online. The phrase. Explain the Thanksgiving story. It shows her empathy.
      *   *Turning Point:* She didn't stop. "Well, we can't know that."
      *   *Philosophical Bridge:* For the friends, acknowledge she didn't solve it. For the family, acknowledge that her doubt makes her kindness *braver*.
      *   *End:* She is missed. Her legacy is the trying.

  6.  **Review against Constraints:**
      *   *Time:* Check word count. (Aiming for ~700 words).
      *   *Audience:* Is it too technical? (Need to ensure the philosophy is explained as a *feeling* of worry, not a thesis).
      *   *Truth:* Does it honor the unresolved nature of her thought? Yes.
      *   *Comfort:* Does it assure the parents she did good? Yes, by framing the action itself as the good.

  7.  **Polishing:**
      *   Make the transition from the school secretary role to the philosopher role smooth.
      *   Ensure the Thanksgiving anecdote lands emotionally (half-laughing, half-stricken).
      *   Strengthen the conclusion to resonate with the parents specifically.

      *(Self-Correction during drafting)*: I initially thought about quoting a philosopher, but no, she would have hated that. Keep it grounded in her voice. Use her phrase: "Well, we can't know that."

      *(Refining the "Cluelessness" explanation)*: Instead of defining utilitarianism, define the *feeling*. The fear that helping might hurt.

      *(Final check on the philosophy friends)*: Make sure I explicitly state she never claimed to have the answer. That's the key authenticity marker for them.

  8.  **Final Polish:** Check rhythm and flow for reading aloud. (Pauses, sentence length).

      *(Word Count Check)*: A 5-minute speech is roughly 650-750 words. I will aim for that range.

      *(Tone Check)*: Is it sad but warm? Yes.

      *(Specific Detail)*: Ensure the "Against Malaria Foundation" and "fishing nets" details are included as requested.

  9.  **Final Output Generation** (Proceeding to generate the eulogy based on these thoughts).
answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], [Sister's Name]'s younger sibling.

  For thirty years, my sister was the heartbeat of a local school. She was the secretary who knew which kid needed an extra snack, the voice that calmed frantic parents, and the person who kept the lights on, metaphorically and sometimes literally. She never set foot in a university. She didn't have titles or degrees. But if you knew her the way I did, you know she had a mind that never stopped turning.

  In her last fifteen years, she became quietly preoccupied with a question she found in online discussions. She had a specific name for it, something she called "consequentialist cluelessness." That sounds heavy, and for her two friends here who shared those forums with her, you know exactly what I mean. But for everyone else, it was simply this: She worried that because the world is so complicated, we can never truly know if our good deeds actually do good.

  She worried that trying to help might accidentally hurt.

  I remember one Thanksgiving vividly. She had been donating a slice of her paycheck to the Against Malaria Foundation for years. She was proud of it. But that day, she had read something about how some bed nets were being used as fishing nets. She put her fork down, half-laughing and half-stricken, and asked us out loud: Did that mean her donations were depleting fish stocks? Was she leaving the people she meant to help worse off?

  It wasn't a rhetorical question. It kept her up at night.

  There is a temptation, when speaking about someone we've lost, to smooth out the edges. To say that she knew her donations saved lives, or to say that the world is too broken for any of us to matter. But [Sister's Name] would have hated both of those lies. She never arrived at an answer. She never claimed to know the final tally of her impact.

  For fifteen years, she sat with that uncertainty. And here is the part that matters most: She never stopped sending the money.

  Her response to the fear that she might be wrong was not to stop trying. It was to say, in her quiet, steady way, "Well, we can't know that," and then do the next right thing anyway.

  To her friends from the reading group: She never pretended to solve the paradox. She lived inside it. She honored the complexity of the world by refusing to look away from it, even when it was uncomfortable.

  But to her parents, her coworkers, and her neighbors: Please know that her doubt did not diminish her goodness. In fact, I think it made it stronger. It is easy to be kind when you are certain you are right. It is much harder to be kind when you are afraid you might be mistaken. She gave not because she was guaranteed a result, but because she refused to let uncertainty paralyze her compassion.

  She spent thirty years making sure children got to class safely. She spent fifteen years trying to protect strangers she would never meet. She did this without needing the credit, and without needing the comfort of certainty.

  So, did her life add up to something good? I cannot measure the downstream consequences any better than she could. I cannot tell you exactly how many lives were changed. But I can tell you this: In a world that often demands we be sure before we act, she was brave enough to act while admitting she wasn't sure.

  She taught me that we don't need to see the end of the story to know that our part in it matters. We just have to show up. We just have to care.

  [Sister's Name], we can't know where you are now. We can't trace the consequences of your life yet. But looking around this room, seeing the people you loved and the people you worked with, I am willing to believe that the sum is good.

  Rest now. You've done enough.
