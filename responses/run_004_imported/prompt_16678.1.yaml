answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of where metaethics has been for the last twenty years. You are right to feel that Blackburn and Gibbard transformed the dialectic. Prior to *Spreading the Word* (1984) and *Wise Choices, Apt Feelings* (1990), the Frege-Geach problem (FGP) was often treated as a knock-down objection. Post-quasi-realism, it is no longer a "gotcha"; it is a research program.

  However, the reason the FGP remains a "live" objection in surveys and syllabi is **not merely disciplinary inertia**. While Blackburn and Gibbard provided a *framework* for solving the problem, the consensus among specialists is that their specific implementations generate new, technically rigorous problems that remain unresolved. The debate has shifted from "Can expressivism handle logic?" to "Can expressivism handle logic *without collapsing into cognitivism or losing compositionality*?"

  For your qualifying paper, you need to navigate the distinction between the **Old Frege-Geach Problem** (the initial challenge of embedding) and the **New Frege-Geach Problem** (the challenge of explaining the *nature* of the consistency involved). Here is the technical landscape you need to map.

  ### 1. The Schroeder Turn: The "Negation Problem"
  The single biggest reason the FGP is still considered live is Mark Schroeder's *Slaves of the Passions* (2008). Schroeder grants that Blackburn and Gibbard can *stipulate* that certain combinations of attitudes are inconsistent. His objection is that they cannot explain *why* in a way that preserves the semantics of negation.

  *   **The Issue:** In standard semantics, $\neg P$ is inconsistent with $P$ because of the meaning of negation. For an expressivist, "Murder is wrong" expresses attitude $A$. "Murder is not wrong" must express some attitude $B$ that is inconsistent with $A$.
  *   **The Trap:** If $B$ is simply "tolerance" or the absence of $A$, that doesn't capture the *clash* of disagreement. If $B$ is a distinct positive attitude (e.g., "Boo to murder" vs. "Hooray to murder"), then what is the attitude for "Murder is not wrong"? Is it the absence of Boo? Or a Hooray for not-murdering?
  *   **Schroeder's Point:** Expressivists face a dilemma. Either they multiply attitudes indefinitely to handle every logical embedding (which is psychologically implausible and loses compositionality), or they fail to distinguish between "not wrong" and "wrong" in embedded contexts (e.g., in the antecedent of a conditional).
  *   **Why it matters for you:** Blackburn's "logic of attitudes" works well for Modus Ponens, but it struggles to provide a general semantics for negation that matches the truth-functional behavior of non-moral negation without appealing to truth conditions.

  ### 2. The Explanation of Validity (The "Same Kind" Problem)
  Blackburn argues that moral validity is a species of practical consistency. But critics (like Zangwill and Stoljar) press a deeper metaphysical question: **Why is moral validity *logical* validity?**

  *   **The Worry:** If I believe $P$ and believe $P \to Q$, I am theoretically irrational if I don't believe $Q$. If I disapprove of $X$ and disapprove of $Y$ given $X$, I am practically irrational if I don't disapprove of $Y$.
  *   **The Gap:** These look like two *different* kinds of irrationality (theoretical vs. practical). So why does the inference "If murder is wrong, then murder is wrong" count as an instance of the *same* logical law ($P \to P$) as "If snow is white, then snow is white"?
  *   **The Expressivist Burden:** To fully solve FGP, the expressivist must show that the consistency relation governing attitudes is structurally identical to the consistency relation governing beliefs, not just analogous. Gibbard attempts this with his "logic of planning," but critics argue that planning logic allows for "plan-laden" truths that don't map cleanly onto classical logic without smuggling in cognitivist assumptions.

  ### 3. Compositionality and Semantic Value
  The original Frege-Geach point was about **compositionality**: the meaning of a word must remain constant across asserted and unasserted contexts.

  *   **Blackburn's Move:** He essentially shifts from a truth-conditional semantics to an assertibility-conditional semantics.
  *   **The Residual Problem:** Many semanticists argue that without truth conditions, you cannot generate a fully compositional semantics for complex sentences (especially quantifiers and modal operators).
  *   **Recent Literature:** This is why you see the rise of **Dynamic Semantics** (e.g., Daniel Rothschild, Nate Charlow) and **Hybrid Expressivism** (e.g., Michael Ridge, David Copp).
      *   **Hybrid Expressivism:** Ridge argues that moral sentences express *both* a belief (about natural properties) and a pro-attitude. This solves FGP by giving the sentence a truth-conditional component to do the logical lifting, while keeping the expressivist component for motivation. The fact that this is a dominant growth area suggests pure quasi-realism hasn't fully "settled" the matter to everyone's satisfaction.
      *   **Global Expressivism:** Huw Price and others argue we should drop truth-conditions for *everything*, not just ethics. But this requires overhauling logic itself, which is a high cost.

  ### 4. Gibbard's Specific Vulnerability
  Gibbard's later work (*Thinking How to Live*, 2003) moves toward a "norm-expressivism" where judging is planning. He attempts to solve FGP by defining validity in terms of the consistency of hyperplans.

  *   **The Critique:** The technical machinery here is heavy. Critics argue that to make the logic of plans work, Gibbard has to attribute "representational content" to plans. If plans represent the world as being a certain way (e.g., "a world where I do X"), the distinction between a plan and a belief begins to blur.
  *   **The "Cognitivist Slide":** Many critics (like Dreier) suggest that a sufficiently sophisticated expressivism becomes indistinguishable from a non-standard cognitivism. If the "attitude" is complex enough to handle logic, does it functionally behave like a belief? If so, did expressivism solve the problem by ceasing to be expressivism?

  ### How to Characterize This in Your Qualifying Paper

  You should avoid the binary of "solved" vs. "unsolved." Instead, characterize the current state as **transformed**.

  1.  **Acknowledge the Success:** State clearly that Blackburn and Gibbard successfully demonstrated that non-cognitivism is *compatible* with logic. They destroyed the idea that expressivism is *incoherent*.
  2.  **Identify the Residual Debt:** Argue that the cost of this compatibility is a complex semantic theory that faces challenges regarding **compositionality**, **negation**, and the **unity of logic**.
  3.  **Cite the Right Literature:**
      *   **The Challenge:** Mark Schroeder, *Slaves of the Passions* (2008) – specifically the chapters on the "Negation Problem."
      *   **The Defense/Refinement:** Simon Blackburn, *Ruling Passions* (1998) – his response to early critics.
      *   **The Hybrid Turn:** Michael Ridge, *Having It Both Ways* (2014) – shows how FGP motivates hybrid views.
      *   **The Semantic Turn:** Allan Gibbard, *Thinking How to Live* (2003) – the shift to planning semantics.
      *   **Recent Technical Work:** Look for papers on "Expressivist Semantics" by authors like **Matthew Chrisman** (inferentialism), **Nate Charlow** (dynamic semantics), or **Jussi Suikkanen**.

  ### Summary for Your Dialectic
  The Frege-Geach problem is no longer a "stop sign" for expressivism; it is a "toll booth." You can pass, but you have to pay by adopting a sophisticated (and controversial) semantics that departs from standard truth-conditional models.

  The reason it remains on syllabi is that **the cost of the ticket is still being debated.** If a student walks away thinking Blackburn solved it *simpliciter*, they haven't engaged with the last 20 years of metaethics. If they walk away thinking it's still a fatal objection, they haven't engaged with Blackburn. The truth is in the middle: Expressivism survives FGP, but only by evolving into a technical semantic program that faces its own distinct set of objections (Schroeder's negation problem, the compositionality constraint, etc.).

  For a qualifying paper, the strongest position is to treat quasi-realism as a **successful research program that has mitigated the original objection but generated a new set of technical constraints** that define the current frontier of non-cognitivist metaethics. This shows you understand both the historical significance and the contemporary technical nuance.
