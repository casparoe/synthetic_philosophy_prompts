answer: |-
  The machine didn't look like much. It was a coffin-sized box of brushed steel and fiber-optic cabling, humming with a sound that felt more like pressure than noise. Elias lay inside, the cold metal pressing against his spine, staring up at the lid. He wasn't trying to change the past. He knew better than that. The physicists who built the Resonator were clear: you cannot bridge the gap between *what is* and *what was*.

  But you could look sideways. You could look at what *might have been*.

  "Stabilizing," the technician's voice crackled over the intercom. "Target parameters locked. World-Seed 892. Divergence point: October 14th, twenty-six years ago."

  Elias closed his eyes. October 14th. The day he forgot to pick up Maya from soccer practice. The day the icy roads took her home without him. The day his wife left him because she couldn't live with a man who forgot his own daughter.

  "Initiating resonance," the technician said.

  The pressure in the box spiked. Elias felt a sensation like falling backwards while standing still. Then, the darkness behind his eyelids was replaced by light. Not the sterile white of the lab, but the warm, golden haze of a late afternoon sun.

  He was seeing through the Resonator's sensors, projected directly into his visual cortex. He was standing in a backyard. Grass, green and lush. A wooden fence. The smell of charcoal and citronella.

  And there, running across the lawn, was Maya.

  She wasn't six years old, frozen in the memory of a car crash. She was ten. Her hair was longer, tied back in a ponytail. She was laughing, chasing a soccer ball. Elias's breath hitched in the dark box. She was alive. In this sideways world, the ice had held. The car had skidded but not spun. He had been there.

  He scanned the patio, desperate to see the rest of the picture. He needed to know that *he* was there too. He needed to know that in this world, he hadn't failed.

  There was a man standing by the grill. He wore a stained apron. He had Elias's face, though softer, less lined by grief. He was flipping burgers, smiling at something Maya shouted.

  Elias waited for the rush. He waited for the feeling of connection, the spiritual tether that should snap into place. *That is me,* he thought. *I am there. I fixed it.*

  But the feeling didn't come. He watched the man at the grill turn his head, and Elias felt no phantom turn of his own neck. He watched the man laugh, and Elias's throat remained tight and silent. It was like watching a high-definition recording of a stranger who happened to wear his face.

  Then, the man at the grill turned to his left. Another man was sitting at the picnic table, opening a beer.

  Elias froze.

  The second man also had Elias's face. He was slightly heavier, his hair cut shorter, but the resemblance was undeniable. The same nose. The same scar on the chin from a childhood fall.

  Maya ran over to the table. She hugged the seated man's leg. "Papa, can I have a soda?"

  The seated man laughed and ruffled her hair. "Ask your Dad, bug. He's got the grill."

  She turned to the man at the grill. "Dad, can I have a soda?"

  "Water," the grilling man said, pointing to a pitcher.

  Elias stopped breathing. In this world, he wasn't an only child. In this world, his parents had had twins. Two brothers. Both named, essentially, after the same lineage. Both equally responsible for Maya's existence? No, biology didn't work like that. Only one could be the father.

  But which one?

  They both looked at Maya with the same fierce, protective love Elias felt in his chest right now. They both carried the same history, up until the split. They were both equally similar to the Elias lying in the steel box.

  If the man at the grill was the father, then the man at the table was just an uncle. If the man at the table was the father, the griller was the uncle. But they looked so much alike. To the sensors, to the logic of similarity, they were both matches. They were both counterparts.

  Elias focused on the grilling man. *Let it be him,* Elias pleaded silently. *Let him be me.*

  The grilling man burned his finger on the spatula. He jerked his hand back, cursing softly.

  Elias felt nothing. No sting. No shock. Just the observation of pain happening to someone else.

  He shifted his focus to the seated man. The uncle? Or the father? The man took a sip of beer and winced at the bitterness.

  Elias felt nothing.

  A cold horror began to seep into the warm vision. He realized then what the technicians had warned him about, though he hadn't understood it until now. You can find a world where things are better. You can find a man who looks like you, living the life you wanted. But he isn't you. He is just a man who resembles you.

  If the grilling man was the father, then the seated man was a stranger to Maya, despite the face. If the seated man was the father, the griller was the stranger. But in this world, maybe they didn't even know which twin was which. Maybe the identity was shared, blurred.

  It didn't matter. Because neither of them was Elias.

  Maya ran over to the fence, looking right at the sensors, right at him. She smiled. In this world, she was happy. She was safe.

  But Elias was still in the box. His daughter was still dead. His wife was still gone. The man at the grill would go inside tonight and sleep in a bed next to his wife. Elias would go back to an empty apartment.

  The comfort he had sought—the idea that *somewhere*, it worked out—evaporated. Why should it matter to him that a stranger with his face was happy? If it wasn't *him*, then the victory was hollow. It was like watching an actor play him in a biopic and winning an Oscar. The award doesn't go to the subject. The happiness doesn't transfer.

  "Vitals spiking," the technician's voice cut through the vision. "Elias, you need to calm down. The resonance is destabilizing."

  The image flickered. The backyard wavered. For a second, the two men merged into one blur, then split again. One man held Maya. The other stood alone, looking sad.

  Which one was the counterpart? Both? Neither?

  It didn't matter. The relation was just similarity. It was a measure of distance, not a bridge of identity. He was alone in his world, bounded by his own skin, bounded by his own choices. The man at the grill was lucky, yes. But he wasn't Elias.

  "Elias, disconnecting," the technician said.

  "No," Elias whispered, but his voice was lost in the hum. "I need to know which one..."

  "Disconnecting."

  The light vanished. The pressure lifted. The lid hissed open, revealing the sterile white ceiling of the lab. The smell of charcoal was gone, replaced by antiseptic and ozone.

  Elias sat up, his hands shaking. The technician was looking at him with pity.

  "Did you... did you see what you wanted?" the technician asked.

  Elias swung his legs over the side of the machine. He thought of the backyard. He thought of the two men. He thought of Maya's smile, directed at a father who wasn't him, in a world he couldn't touch.

  "I saw a man who got to be happy," Elias said, his voice cracking. "He has my face. He has my daughter."

  "And?"

  "And it doesn't help." Elias stood up, his knees weak. He walked to the sink in the corner of the lab and splashed cold water on his face. He looked into the mirror. Just one man staring back. No twins. No alternatives. Just the one who forgot.

  "It's just a picture," Elias said to the reflection. "It's just a picture of a guy who looks like me."

  He dried his hands on a paper towel. The grief was still there, heavy and absolute. It hadn't been diluted by the happiness of a stranger. If anything, it was heavier now, because he knew exactly what he had lost, and he knew that no matter how many worlds he looked into, he would never find himself inside them. He was stuck here.

  "Shut it down," Elias said, not turning around.

  "Sir?"

  "The machine. Shut it down. There's no one in there but strangers."
