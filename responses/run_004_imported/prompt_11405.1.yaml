answer: |-
  Karl Popper walks into a biology department in 1976, looking visibly sheepish. He finds a senior evolutionary theorist and says, "I need to make a correction. I'm recanting. Natural selection is not a tautology. It's not just a 'metaphysical research programme.' It is genuinely testable science."

  The biologist raises an eyebrow. "That's a massive U-turn, Sir Karl. What falsified your previous position? Did you find a new logical criterion?"

  "No," Popper says. "I decided to treat my own critique as a competing hypothesis. I introduced my objection into the ecosystem of ideas to see if it would survive contact with the evidence."

  "And?"

  "Well," Popper sighs, "the theory survived my attempt to kill it. My objection, however, went extinct."

  The biologist smiles. "So, let me get this straight. You proved natural selection isn't just 'survival of the survivors'... by demonstrating that the theory survived your attack while your attack didn't survive the theory?"

  Popper pauses, takes off his glasses, and rubs the bridge of his nose.

  "Technically, yes. But look at the bright side."

  "What's that?"

  "My argument was the unfit one. So, strictly speaking, I didn't fail to falsify the theory. The theory selected against me."
