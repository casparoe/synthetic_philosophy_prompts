answer: |-
  This is a fantastic debate to be having for a historical novel. Both Nora and Theo have grabbed hold of genuine historical truths, but they are pulling on different ends of the same rope. Kepler is notoriously difficult to pin down because he straddles the exact moment where magic becomes physics.

  Here is the round-by-round referee decision, followed by the crucial context both of them are skating past that could make your protagonist's perspective unique.

  ### Round 1: Income vs. Theory
  **Nora:** He did it for the money and mocked the credulity.
  **Theo:** He wrote *Tertius Interveniens* to reform the field, not mock it.

  **Verdict: Theo wins on character motivation; Nora wins on economic reality.**

  Nora is factually correct that Kepler was perpetually destitute. The position of Imperial Mathematician paid poorly and irregularly (often in worthless currency or promissory notes during the Thirty Years' War). Astrology was absolutely a revenue stream. However, Theo is right that calling him a "cynic" is reductive. *Tertius Interveniens* (The Third-Party Intervener) wasn't a cynical cash-grab; it was a serious philosophical attempt to save astrology from itself.

  If you write him purely as an eye-rolling cynic, you flatten a man who believed that understanding the geometry of the cosmos was a form of religious worship. He didn't think he was selling snake oil; he thought he was selling distilled wine while everyone else was selling vinegar.

  ### Round 2: Mechanism vs. Retail Predictions
  **Nora:** He could believe the mechanism (aspects) but think the specific client predictions were guesswork.
  **Theo:** (Implicitly) The theory demands the practice be accurate.

  **Verdict: Nora takes this round.**

  This is Nora's strongest point. Kepler made a hard distinction between the *physical influence* of the planets and the *interpretation* of that influence. He believed the planets emitted physical light rays that affected the Earth's "soul" (weather, tides, human temperaments), but he had zero patience for the arbitrary rules of traditional astrology (zodiac signs, houses, planetary rulerships).

  He frequently complained that while the *physics* were certain, the *judgments* were probabilistic. He would often tell patrons, "The stars show a tendency toward conflict," while thinking, "But whether you start a war or just argue with your wife is up to you." He absolutely viewed much of the retail horoscope business as noise obscuring the signal. Your protagonist would likely hear Kepler grumbling about how clients want concrete dates ("Will I win the battle on Tuesday?") when the math only offers probabilities ("The geometry is tense on Tuesday").

  ### Round 3: The Wallenstein Engagement
  **Nora:** Retail horoscopes are embellished guesswork.
  **Theo:** He spent years on Wallenstein's chart and revised it constantly.

  **Verdict: Theo wins decisively.**

  The *Genitura Wallensteinii* is the smoking gun against the "cynic" theory. Albrecht von Wallenstein was the most powerful military commander in Europe. Kepler didn't just dash off a horoscope; he produced a massive, printed Latin treatise on the man's nativity, revising it over years.

  A cynic phones it in for a dangerous warlord. Kepler, however, was terrified of Wallenstein but also intellectually obsessed by him. He treated Wallenstein's chart as a data set to test his harmonic theories. If Kepler were just smirking and cashing checks, he wouldn't have engaged in the intense, private correspondence about the *uncertainties* of that chart. He took the risk seriously. He believed the geometric influence was real enough that getting the calculation wrong was a sin against truth, not just a business error.

  ---

  ### What Both Are Skating Past (The Gold for Your Novel)

  To write Kepler authentically through the eyes of a calculation assistant, you need to look at the nuances both friends are missing. Here is the texture you should be aiming for:

  **1. Light as Physics, not Magic**
  Theo mentions the "earth-soul," but he misses the mechanism. Kepler wasn't a mystic in the vague sense; he was an optical physicist. He believed the aspects worked because planetary light rays physically struck the Earth, just like light hits the retina. To Kepler, astrology was a branch of optics and meteorology.
  *   **For the novel:** Your protagonist shouldn't see Kepler casting runes. They should see him obsessing over refraction, angles, and the intensity of light. Kepler's "faith" was in geometry, not spirits.

  **2. Temperament vs. Will (The Lutheran Loophole)**
  This is the biggest miss from both friends. Kepler was a devout Lutheran. He *could not* believe the stars determined human will, because that negated free will and sin.
  *   **The View:** Kepler believed the stars influenced the *body* (health, weather, temperament, impulses), but not the *soul* (moral choices).
  *   **For the novel:** This creates great tension. A patron asks, "Will I betray the Emperor?" Kepler has to calculate if the stars make him *irritable and prone to aggression*, but he must insist the moral choice is the patron's. Your protagonist would see Kepler walking this tightrope constantly—giving the patron the "weather report" of their soul without absolving them of responsibility.

  **3. The "Assistant" Perspective: Drudgery vs. Epiphany**
  Nora sees the drudgery (calculations for cash); Theo sees the epiphany (harmonic theory). Your protagonist lives in the middle.
  *   **The Reality:** 90% of Kepler's astrology was boring, grueling arithmetic to feed his family. 10% was genuine, trembling discovery about the nature of the universe.
  *   **For the novel:** The most authentic portrayal isn't "cynic" or "believer." It's **frustrated reformer.** Kepler was angry. He was angry at the superstitious astrologers for making his job harder, angry at the skeptics for throwing out the baby with the bathwater, and angry at his patrons for demanding certainty where nature only offered probability.

  ### Recommendation for the Character
  Don't play him as Nora's cynic or Theo's pure theorist. Play him as a **tired architect.**

  He knows the foundation (geometry/aspects) is solid. He knows the building (traditional astrology) is full of rot and fake decorations. He is trying to rebuild the structure while people are still living in it and demanding to know if the roof will leak next Tuesday.

  *   **When calculating:** He is meticulous (Theo is right).
  *   **When billing:** He is desperate and resentful (Nora is right).
  *   **When predicting:** He is hedging, nuanced, and focused on weather/health rather than specific events (The missing nuance).

  If your protagonist is a calculation assistant, their primary view of Kepler should be a man who treats numbers as holy, but treats clients as noisy obstacles to the truth. That captures the tragedy of Kepler's life: he wanted to sing the harmony of the spheres, but he had to sell almanacs to buy bread.
