answer: |-
  **The Ghost in the Multiverse: Why Evidential Cooperation Fails to Guide Action**

  The proposal known as Evidential Cooperation in Large Worlds (ECL) is one of the most provocative ideas in contemporary decision theory. It suggests that agents separated by vast cosmic distances, or even by the boundaries of causally disconnected universes, have a rational obligation to cooperate. The logic rests on the premise that in a sufficiently large world, there exist countless agents reasoning in ways correlated with our own. Because my decision is evidence of their decision, I should act to maximize the collective welfare of this correlated cohort, even if I can never causally affect them. While ECL has been championed as a breakthrough for altruism in a cosmological context, it remains deeply controversial. This essay argues that while ECL is a logically coherent implication of Evidential Decision Theory (EDT), it ultimately fails to provide actionable guidance. The epistemic conditions required to calculate the benefits of cooperation are impossible to satisfy without succumbing to the very fanaticism critics fear, rendering the theory practically inert.

  To understand the force of ECL, one must first grasp its decision-theoretic engine. ECL is not a causal claim; it does not suggest that my pressing a button here causes a button to be pressed in a distant galaxy. Rather, it is an evidential claim. It relies on the framework of Evidential Decision Theory, which posits that agents should choose actions that provide the best news about the state of the world. In a standard one-shot Prisoner's Dilemma, a Causal Decision Theorist (CDT) defects because their choice cannot causally influence the other player. An Evidential Decision Theorist (EDT), however, may cooperate if they believe their decision is correlated with the other's—perhaps because both are rational agents running similar algorithms. If I cooperate, it is evidence that the other cooperates, leading to a mutually beneficial outcome.

  ECL scales this logic to the cosmos. If the universe is infinite, or if a multiverse exists, there are likely infinite regions containing agents identical or relevantly similar to us. Let us call this set the "correlated cohort." If I choose to pursue a parochial goal (e.g., maximizing only my own values), this is evidence that my correlated cohort will do the same. If I choose to cooperate (e.g., sacrificing some resources to promote values I do not hold, in expectation that they do the same), this is evidence that they will cooperate. If the cohort is large enough ($N$), the total value generated by $N$ agents cooperating outweighs the local cost of my cooperation, even if the probability of correlation is less than one. The expected value equation becomes: $EV = P(\text{correlation}) \times N \times \text{Benefit}$. In a "large world," $N$ is so vast that even a tiny $P$ yields a massive expected value, seemingly mandating cooperation.

  The first objection to ECL is that it presupposes EDT, whereas Causal Decision Theory (CDT) dominates much of philosophical and economic thinking. CDT insists that rational agents maximize causal impact; since I cannot causally influence a causally isolated agent, ECL offers no reason to cooperate. However, dismissing ECL solely on these grounds is too quick. The debate between EDT and CDT is unresolved, and there are strong arguments for EDT in Newcomb-like problems. To truly test ECL, we should grant the EDT framework and ask if the argument holds internally. Even accepting EDT, ECL faces severe difficulties regarding the inputs required for its calculation.

  The primary failure of ECL lies in the "reference class problem." To compute the expected value of cooperation, an agent must estimate $P(\text{correlation})$ and the size of the cohort $N$. But who counts as correlated? If the reference class is defined narrowly (e.g., "exact physical duplicates"), $N$ may be large in an infinite universe, but the opportunity for "trade" is null; exact duplicates share my values, so there is no need to compromise. If the reference class is defined broadly (e.g., "any agent using evidential reasoning"), $N$ is enormous, but the values of these agents are unknown.

  This creates a dilemma. For ECL to generate a reason to compromise my values, I must be correlated with agents who hold *different* values. However, the more different their values are, the less likely it is that our decision procedures are correlated. If I am a utilitarian and my "partner" is a paperclip maximizer, our reasoning processes diverge fundamentally. To assume correlation is to assume a similarity in reasoning that implies a similarity in values. If I assume enough similarity to justify a high $P(\text{correlation})$, I likely assume enough value alignment to make trade unnecessary. If I assume enough value divergence to make trade beneficial, I must lower $P(\text{correlation})$ to the point where the expected value calculation becomes indeterminate. Defenders of ECL suggest a "modest upshot": we should simply give some weight to widely shared, compromise-friendly values. But this is question-begging. We cannot know which values are "widely shared" among the correlated cohort without knowing who is in the cohort, which returns us to the unsolvable reference class problem.

  Furthermore, the "large world" assumption exposes ECL to a form of Pascal's Mugging. In an infinite multiverse, every possible configuration of agents exists somewhere. This means there are infinitely many agents who would cooperate with me if I sacrifice my local values, and infinitely many who would defect regardless. The calculation depends on weighting these infinities or comparing measures of existence, concepts that are currently mathematically and metaphysically murky. If I allow my actions to be dictated by the potential for infinite gains from causally inert partners, I open the door to fanaticism. I might be compelled to sacrifice definite, local good for speculative, multiverse-wide gains based on unprovable cosmological models. A decision theory that licenses sacrificing the certain for the unmeasurable infinite is practically self-defeating; it severs the link between rationality and achievable outcomes.

  Defenders might argue that these are merely implementation difficulties, not refutations of the core logic. They claim that even with uncertainty, the sheer magnitude of $N$ ensures that *some* cooperation is better than *none*. This response underestimates the risk of negative value. If I cooperate with a cohort that turns out to be hostile to my core values (e.g., I sacrifice resources to help them, but they do not reciprocate because our reasoning was not actually correlated), I have incurred a local loss with no gain. In a large world, the probability of encountering "acausal traps"—situations where evidential correlations are misleading or exploitative—may be non-negligible. Without a principled way to distinguish genuine correlation from coincidental similarity, the ECL agent is flying blind. The "reason" to cooperate evaporates when the sign of the expected value (positive or negative) is unknowable.

  Moreover, the metaphysical mystery of "correlation" across causal gaps cannot be waved away. In standard EDT, correlation is usually grounded in a common cause (e.g., both players are rational, or both have read the same book). In ECL, the "common cause" is often posited as the logical necessity of mathematical truths or the structure of the multiverse. But if two agents are causally isolated, what grounds the claim that my decision *now* is evidence of their decision *there*? If the correlation is purely logical, it applies only to identical algorithms. If it is statistical, it requires a sample space we cannot access. The theory relies on a notion of "acausal influence" that functions like a deus ex machina to rescue altruism in a godless universe. While not logically contradictory, it is epistemically unmoored.

  Therefore, the verdict on ECL must be nuanced but firm. As a piece of formal decision theory, ECL is valid: if one accepts EDT, and if one assumes specific, favorable distributions of agents in a multiverse, then cooperation maximizes expected value. However, as a guide to action, it fails. The parameters required to make the calculation work ($P$, $N$, and the value function of the cohort) are inaccessible to any finite agent. Attempting to estimate them invites arbitrary assumptions that can be tuned to justify any behavior, from total selfishness to total self-sacrifice.

  Consequently, ECL should be regarded as a theoretical limit case rather than a practical imperative. It demonstrates that in a sufficiently structured and transparent universe, the distinction between self-interest and altruism might blur. But in our actual epistemic situation, characterized by radical uncertainty about the cosmos and the minds within it, ECL provides no traction. The "reason" it offers is like a map of a territory we cannot visit and cannot verify; it may be accurate, but it cannot tell us where to walk. We are left with the conclusion that while evidential cooperation is a fascinating possibility for gods or omniscient beings, for human agents, the causal horizon remains the boundary of moral obligation. To act otherwise is not to be superrational, but to gamble with values we cannot afford to lose on odds we cannot know.
