      *   *Check:* Did I address the "same benchmarks" point? *Correction:* Yes, emphasize that data interpretation depends on priors and utility functions.

  8.  **Final Output Generation:** (This matches the structure of the provided good response.)
      *   Hook: You're not irrational.
      *   Core reason: The assumptions are too strict.
