answer: |-
  **New York City, 1928**

  **Du Bois:** (Tapping the cover of *Home to Harlem*) "This isn't art, Alain. It's ammunition. When a white critic reads of Jake's drunken stupor and the cabaret brawl, he doesn't see 'individual expression.' He sees confirmation. You claim universal appeal, but who is this universal? It is the white voyeur slumming in print."

  **Locke:** "It is Harlem, Bill. Not a press release for the NAACP. You want saints because you fear sinners. But art isn't morality; it's recognition. If we paint only the dignified professor, we confirm the lie that we are not flesh."

  **Du Bois:** "I demand we survive. I told the conference two years ago: all art is propaganda. If it doesn't fight the caricature, it feeds it. You speak of freedom from politics while standing in a burning house. That luxury isn't yours to take."

  **Locke:** "There it is. The cage. You would have us police our own souls to manage white perception. That is not freedom; it is a nicer set of chains. You argue against caricature, yet your propaganda standard polices Black life almost as tightly as the minstrels do. Who decides which truths are safe for the race?"

  **Du Bois:** "Truth without wisdom is cruelty. Who is this for? The Black child who needs a hero, or the publisher who needs a spectacle? You assume a neutrality that doesn't exist. McKay writes the gutter, and the world says, 'That is all there is.'"

  **Locke:** "And you write the podium, and the world says, 'That is all they allow themselves to be.' You fear the weapon might turn inward. But if our art is merely image management, we are not artists; we are clerks. Does the Black artist have no right to the messy human condition unless it serves a political end?"

  **Du Bois:** "Not when the human condition is used to justify our lynching. You treat aesthetics as separate from consequence. They are not. You hand the enemy the weapon and call it integrity."

  **Locke:** "Or perhaps you are afraid the weapon might reveal that the race is not a monolith of victims and heroes. You want us to be representatives. I want us to be individuals. If the cost is white discomfort, let them be uncomfortable."

  **Du Bois:** "And if the cost is Black safety?"

  **Locke:** "Then we are already dead."

  *(Silence settles between them. Du Bois holds the book tightly; Locke turns toward the window, neither yielding the ground.)*
