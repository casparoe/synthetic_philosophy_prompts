      *   *Diana's Specific Answer:* This is the hard part. She can't just say "deprivation." She needs to say the badness is *timeless* or indexed to the life trajectory. Let's go with the idea that the harm is located at the times *the goods would have occurred*. It's a "timeless truth about a temporal subject."
      *   *Elias's Counter:* That makes harm abstract. If I don't feel it, how is it *my* misfortune?
