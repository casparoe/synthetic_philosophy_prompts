answer: |-
  # The Uniform and the Conscience: Moral Truth and Legal Fiction in the Ethics of War

  The debate over the Moral Equality of Combatants (MEC) is perhaps the central fault line in contemporary just war theory. It began, as so many philosophical disagreements do, over dinner. On one side stood the Traditionalist, channeling Michael Walzer: the soldier in the trench is morally equal to the soldier opposing him, provided both follow the rules of engagement. On the other stood the Revisionist, echoing Jeff McMahan: a soldier fighting for an unjust cause has no right to kill, rendering his violence morally wrongful even if legally permissible.

  This is not merely academic hair-splitting. It determines whether we view the enemy as a moral peer or a culpable aggressor, and it shapes the international laws that govern conflict. To resolve the tension between these views, we must navigate three specific sticking points: the role of practical consequences in moral theory, the distinction between justification and excuse, and the analogy between war and ordinary self-defense. While the Revisionists possess the stronger account of *moral ontology*, the Traditionalists offer the indispensable logic of *political order*. Therefore, the most defensible position is a qualified dual-track verdict: combatants are morally unequal, but they must remain legally equal.

  ### The Traditionalist Fortress: Order Over Truth

  Michael Walzer's *Just and Unjust Wars* defends the "Independence Thesis": *jus in bello* (justice in war) is independent of *jus ad bellum* (justice of war). For Walzer, the MEC is not a mistake; it is a feature of the "War Convention."

  The Traditionalist argument rests on the reality of the soldier's condition. Soldiers are coerced instruments of the state, often conscripted, socialized, and epistemically blinded. They do not decide grand strategy; they obey orders. If we deny them moral equality, we strip them of their humanity, turning them into mere criminals. More importantly, Walzer argues from necessity. If unjust combatants know they are morally liable to be killed and lack the right to fight, they have no incentive to follow the rules of war. Why observe proportionality or discrimination if you are already a murderer? Symmetry provides a reciprocal incentive: "I will spare your POWs if you spare mine," regardless of who started the fight.

  For the Traditionalist, the moral status of the combatant is defined by their status as a combatant, not by the justice of their cause. To introduce *ad bellum* considerations into *in bello* judgments is to invite total war, where the "just" side feels licensed to commit atrocities because they view the enemy as illegitimate.

  ### The Revisionist Assault: Morality Cannot Be Suspended

  Jeff McMahan and the Revisionists argue that Walzer has conflated legal convention with moral truth. In ordinary morality, the right to kill is derivative of the right to self-defense or the prevention of injustice. If a mugger attacks you, you may kill him to save your life; he may not kill you to save his life, because he is the aggressor. There is no "moral equality" between victim and aggressor.

  Revisionists argue war should be no different. If a nation is invaded unjustly, its soldiers act in collective self-defense. The invading soldiers, lacking a just cause, are participating in a wrongful harm. Satisfying *in bello* constraints (not targeting civilians, using proportional force) makes their conduct *less* bad, but it does not make it *good*. They lack the substantive right to kill.

  The Revisionist insists that we cannot outsource our moral agency to the state. Just because a government declares a war just does not make it so, and soldiers retain some responsibility for the violence they enact. To claim otherwise is to create a "moral magic" where the uniform absolves the individual of the fundamental wrong of killing without cause.

  ### Engaging the Sticking Points

  To move beyond this stalemate, we must grapple with the three specific objections that keep this debate alive.

  **1. Practical Costs vs. Moral Truth**
  The Traditionalist argues that even if MEC is morally false, it is pragmatically necessary. The Revisionist counters that a moral theory that requires us to ignore the truth is defective.
  Here, we must distinguish between *ethics* and *institutional design*. It is morally true that an unjust aggressor wrongs his victim. However, international law is not a court of ultimate moral judgment; it is a tool for minimizing suffering. If adopting the Revisionist view as *law* leads to worse outcomes (e.g., unjust combatants refusing surrender, fighting more brutally), then the law should not reflect the full moral truth.
  This does not refute Revisionism morally; it merely confines it. The practical costs count against making MEC a *legal* norm, but they do not change the *moral* reality. We can acknowledge that unjust killing is wrong while simultaneously agreeing that prosecuting every soldier on the losing side is politically disastrous. The practical costs justify a legal fiction, but they do not transmute that fiction into moral truth.

  **2. Justification vs. Excuse**
  This is the crux of the Revisionist defense against the charge of demonizing soldiers. If unjust combatants are doing something wrong, are they all war criminals?
  Revisionists rely heavily on the distinction between *justification* (the act was permissible) and *excuse* (the act was wrong, but the agent is not blameworthy). McMahan concedes that most ordinary soldiers are *excused* because they lack the epistemic capacity to judge the war's justice. They are "innocent aggressors."
  The Traditionalist finds this unsatisfying, arguing that calling a soldier a "wrongdoer" (even an excused one) undermines the respect due to them. However, the Revisionist distinction is vital. It preserves the intuition that the victim of aggression has a stronger claim than the aggressor. It allows us to say, "You were mistaken, and we will not punish you, but your side was in the wrong." This preserves historical and moral accountability without demanding individual punishment. The Traditionalist view collapses this distinction, granting full justification where only excuse is warranted.

  **3. The Act/Agent-Neutrality Analogy**
  The Traditionalist implicitly relies on an act-neutral view of killing in war: the act of shooting a combatant is morally identical regardless of who pulls the trigger. The Revisionist argues this is a view we would reject in ordinary self-defense.
  The Traditionalist replies that war is *sui generis*—a unique collective activity where individual agency is submerged. However, this defense is weakening in the modern era. With the decline of mass conscription and the rise of professional volunteer armies, the claim that soldiers are "coerced instruments" is less persuasive. Furthermore, modern communication allows soldiers greater access to information regarding the justice of their cause.
  While war is distinct from a bar fight, it is ultimately composed of individual acts of killing. If we accept that individuals possess moral agency in all other spheres, we need a compelling reason to suspend it here. The state's authority is significant, but it is not absolute. A state cannot grant a moral right to kill that does not exist. Therefore, the Revisionist analogy to ordinary morality holds more weight: the agent's relation to the justice of the cause *does* matter morally, even if the uniform obscures it legally.

  ### The Verdict: Moral Inequality, Legal Equality

  Having weighed these arguments, we must commit to a conclusion. The Traditionalist is right about the law, but the Revisionist is right about the morality.

  We should reject the Moral Equality of Combatants as a *moral* thesis. It is simply untenable to claim that a soldier defending their homeland from genocide is in the same moral position as a soldier invading to annex territory. The right to kill is not a free-floating license granted by uniform; it is derived from the justice of the cause. To deny this is to sever the link between individual agency and moral responsibility, creating a dangerous zone of impunity where "following orders" becomes a metaphysical absolution. The Revisionist correctly identifies that unjust combatants are, at best, excused wrongdoers, not justified peers.

  However, we must simultaneously accept the Traditionalist position as a *legal and institutional* norm. International Humanitarian Law (IHL) must maintain the Independence Thesis. Why? Because the legal system is not designed to dispense perfect moral justice; it is designed to regulate violence.
  If the Geneva Conventions required a determination of *jus ad bellum* before granting POW status, the result would be paralysis. Every capture would become a tribunal on the war's origins. Unjust combatants, knowing they face criminal prosecution for mere participation, would fight to the death, increasing casualties and making war termination harder. Furthermore, international law must remain neutral enough that states on all sides feel safe signing onto it.

  Therefore, the solution is a **Dual-Track Theory**.
  1.  **In the realm of conscience and history:** We affirm Moral Inequality. We teach soldiers that they have a duty to assess the justice of their orders. We acknowledge that the "just" side fights with a moral right the "unjust" side lacks. We refuse to sanitize history by pretending both sides were morally equivalent.
  2.  **In the realm of law and policy:** We affirm Legal Equality. We grant POW protections and immunity from prosecution for mere participation to all combatants who follow *in bello* rules. We treat the MEC as a necessary convention, a "noble lie" that serves the greater good of limiting humanitarian catastrophe.

  ### Conclusion

  My friend the PhD candidate was defending the legal order; I was defending the moral truth. We were both right, but in different domains. To conflate them is to risk either moral cynicism (believing the legal fiction is the whole truth) or humanitarian disaster (imposing the moral truth as law).

  We must have the courage to tell the soldier that fighting for an unjust cause is a moral tragedy, even if he is not a war criminal. And we must have the wisdom to protect that same soldier under international law, not because he is morally equal to his opponent, but because humanity cannot afford to treat him otherwise. The uniform grants legal immunity, but it cannot wash the conscience clean. Recognizing this distinction is the only way to honor both the reality of war and the demands of justice.
