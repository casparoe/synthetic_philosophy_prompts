answer: |-
  **MEMORANDUM**

  **TO:** Health Technology Assessment Committee
  **FROM:** Methodology & Ethics Sub-Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Source of Utility Weights for QALY Calculations

  ### 1. Executive Summary

  For the past three cycles, this Committee has deferred a final decision regarding the source of utility weights used in our cost-per-QALY calculations. We have recognized a systematic divergence: patients living with chronic health states consistently rate their quality of life higher (closer to 1.0) than members of the general public asked to imagine those same states. This "adaptation gap" is not methodological noise; it is a value judgment that alters funding priorities. When we use public weights, treatments for conditions the public fears (often severe disabilities) appear more cost-effective. When we use patient weights, treatments for conditions patients find burdensome (often pain or mental health) rise in priority.

  To resolve this impasse and ensure consistency in future cycles, the Sub-Committee recommends adopting a **Condition-Duration Hybrid Model**.

  ### 2. Recommendation

  We recommend that the Committee no longer seek a single universal source for utility weights. Instead, the source should be determined by the **expected duration and stability of the health state** being treated.

  *   **Chronic/Stable States (>12 Months):** Utility weights must be derived from **Patient-Reported Outcome Measures (PROMs)**.
  *   **Acute/Transient States (<12 Months) & Prevention:** Utility weights must be derived from **General Public Valuations** (e.g., Time Trade-Off or Standard Gamble surveys administered to community members).

  ### 3. Rationale

  This hybrid approach balances two competing ethical imperatives: **Epistemic Authority** and **Social Opportunity Cost**.

  1.  **Respecting Experiential Knowledge (Chronic):** For long-term conditions, the general public's valuation is often driven by ignorance and stigma rather than evidence. The "disability paradox" demonstrates that individuals adapt to limitations that outsiders view as catastrophic. To fund treatments based on the public's *fear* of a condition, rather than the patient's *experience* of it, risks allocating resources based on prejudice. In chronic care, the patient is the only valid authority on their own quality of life.
  2.  **Maintaining Societal Perspective (Acute/Prevention):** For acute conditions (e.g., broken hip, pneumonia) or preventative measures (e.g., vaccination), there is no established patient cohort to survey, and the "state" is temporary. Here, the General Public perspective is appropriate because it reflects the societal willingness to pay to avoid the risk or burden. It ensures the QALY remains a common currency across the health system, anchored in the opportunity costs borne by taxpayers.

  ### 4. Operational Rule for Future Cycles

  Effective immediately, all economic evaluations submitted to the Committee must adhere to the following protocol:

  1.  **Classification:** The applicant must classify the target health state as *Chronic* (expected duration >12 months) or *Acute/Preventative* (expected duration <12 months).
  2.  **Source Selection:**
      *   If *Chronic*, the base-case analysis must utilize utility weights from a validated instrument completed by the target patient population (e.g., EQ-5D-5L completed by trial participants).
      *   If *Acute/Preventative*, the base-case analysis must utilize utility weights from a representative general public sample.
  3.  **Divergence Check:** In Chronic cases, applicants must include a sensitivity analysis using General Public weights. If the funding recommendation changes (i.e., the ICER crosses the threshold) based on this switch, the submission must be flagged for full Committee review rather than expedited approval.

  ### 5. Candid Account of the Strongest Objection

  **The Objection: The "Resilience Penalty"**

  The strongest ethical objection to using Patient-Reported weights for chronic conditions is that it systematically penalizes resilience.

  Because patients adapt to their circumstances, they report higher utility values (e.g., a patient with permanent paralysis may rate their state 0.8, whereas the public rates it 0.5). In a QALY calculation, a higher baseline utility means a *smaller* calculated gain from treatment.
  *   **Public Weight:** 0.5 $\rightarrow$ 0.8 (Treatment Gain = 0.3 QALYs)
  *   **Patient Weight:** 0.8 $\rightarrow$ 0.9 (Treatment Gain = 0.1 QALYs)

  By adopting patient weights, we are effectively deciding that a treatment for a condition is *less valuable* because the patients have coped well with it. This creates a perverse incentive where successful adaptation leads to lower priority for funding. We risk creating a system that underfunds treatments for disabilities precisely because the people living with them have demonstrated strength and resilience.

  This objection argues that health funding should be based on *objective burden* or *capability restoration*, not subjective satisfaction. If we follow this recommendation, we must accept that some highly effective treatments for chronic disabilities may fail cost-effectiveness thresholds, not because they don't work, but because our metric respects the patient's ability to endure the condition without treatment.

  ### 6. Conclusion

  There is no methodologically neutral choice. Using public values privileges societal fear; using patient values privileges adaptation. The Hybrid Model recommended above acknowledges that while the public should decide how to spend its money on acute risks, it should not define the lived reality of those living with chronic conditions. We recommend adoption of this rule to break the current cycle of deferral.

  **Action Required:** Vote to adopt the Condition-Duration Hybrid Model for Cycle 2024-B.
