      *   *Is the user right?* Yes, fundamentally. Aristotle is making a scope distinction.
      *   *Why is it hard?* Because Aristotle doesn't have modern modal logic notation. He's working within a metaphysical framework where truth, time, and modality are intertwined differently than in post-Kripke semantics.

  3.  **Address Question 1: Is the scope-distinction reading correct?**
