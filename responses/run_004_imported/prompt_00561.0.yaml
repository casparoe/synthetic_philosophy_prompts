      *   **Nuance:** The translation makes it harder. "It is necessary for a naval action to occur or not occur" vs. "It is necessary that there should be a naval action."
      *   **Formalization:**
          *   Principle of Excluded Middle (PEM): $p \lor \neg p$ (Always true).
          *   Principle of Bivalence (PB): Either $p$ is true or $\neg p$ is true (assigned *now*).
          *   Aristotle's move: Accept PEM for future contingents, but reject PB *in a specific sense* regarding definite truth *now* implying necessity *now*.
