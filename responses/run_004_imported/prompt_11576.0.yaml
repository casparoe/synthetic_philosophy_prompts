      *   Key Point 3: **Computational Tractability.** Bounded rationality means agents can't compute Zorn extensions.
      *   Key Point 4: **Money-Pump Counter-strategies.** Agents can avoid pumps without completing preferences (e.g., sophisticated choice mechanisms).

  6.  **Refine the Tone:**
