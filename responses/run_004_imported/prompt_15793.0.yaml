  I've just taken on a teaching assistant position for an undergraduate jurisprudence course, and this is the first batch of short-answer papers I'm grading on my own, so I'd welcome a second opinion before I finalize marks. Here is the question and one student's answer.

  Question (10 points, 200-word limit): The Hart–Fuller debate is often illustrated with the "grudge informer" scenario, in which a woman is prosecuted by a post-war German court for having denounced her husband to the Nazi authorities during the war over remarks he made against the regime. Explain (a) how Hart's legal positivism bears on the legal status of the Nazi-era statute under which the husband was convicted, and how Hart thought the post-war court should have resolved the case; and (b) how Fuller's response differs, including what he means by law's "inner morality."

  Student's answer: Hart's positivism rests on the separation thesis: whether a rule is law and whether it is just are two different questions, so an unjust statute can still be valid law. On this view, the Nazi-era statute criminalizing remarks against the regime was valid law when the husband was convicted, however wicked its content. Hart argued that the post-war court was right to treat that statute as never having been valid, since a rule so far removed from ordinary decency could not create a genuine legal duty to inform in the first place. Fuller rejects this sharp separation. He argues that law has an "inner morality" — Hart's own term for it is the minimum content of natural law — made up of procedural virtues such as generality, prospectivity, and consistency between announced rules and official action, which any system of rules must largely satisfy simply to count as law at all. Because the Nazi regime flouted these virtues so persistently, Fuller concludes that much of what it called law was not law, so the post-war courts owed it no special deference.

  Could you grade this out of 10 and give point-by-point comments explaining exactly what the student got right and what they got wrong, quoting the specific phrases responsible for any deductions? Please also complete this rubric as JSON:

