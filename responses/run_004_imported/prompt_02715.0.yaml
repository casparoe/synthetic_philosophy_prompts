  **Move 1 (Marco): +2**
  Marco accurately captures Hart's core "separation thesis" argument: that conflating law and morality obscures the moral choice being made. Hart's primary concern was clarity; by calling the Nazi statute "law," we are forced to admit we are sacrificing the value of non-retroactivity to achieve justice, rather than pretending the law already provided the answer. This is the strongest version of the positivist position.

  **Move 2 (Yuki): +2**
  Yuki correctly deploys Fuller's distinction between "external" morality (justice) and "internal" morality (procedural legality). If the Nazi regime systematically violated the eight desiderata (e.g., secret laws, retroactive decrees), Fuller argues those edicts lacked legal character *ab initio*. Yuki also adds a crucial pragmatic point: a new democracy damages its own rule-of-law credibility by passing explicit retroactive statutes, whereas denying validity to a tyrannical system preserves the new regime's integrity.

  **Move 3 (Marco): +1**
  Marco raises a valid institutional concern about judicial discretion, which is central to the rule of law. However, he slightly caricatures Fuller's position by implying judges would invalidate laws based on regimes they "dislike" rather than objective procedural failures. While the worry about uncertainty is real, Fuller's eight desiderata are meant to be objective criteria, not free-floating moral judgments, making Marco's attack somewhat less precise than his first move.

  **Move 4 (Yuki): +2**
  Yuki effectively parries Marco's discretion objection by clarifying that Fuller's test is structural, not subjective. Furthermore, Yuki lands a decisive blow by noting that Hart's solution does not eliminate discretion; it merely shifts it from the judiciary to the legislature. Someone still must decide to single out this specific conduct for retroactive punishment, so Hart's "honesty" does not actually solve the problem of exceptionalism.

  **Missing Consideration: The Radbruch Formula**
  Neither Marco nor Yuki mentioned Gustav Radbruch, whose "formula" arguably bridges the gap between Hart and Fuller and was actually influential in postwar German courts. Radbruch argued that positive law loses its legal character not just when it fails procedural tests (Fuller), but when the contradiction between positive law and justice reaches an "intolerable level." This substantive threshold allows courts to void specific statutes without declaring the entire prior system "non-law" (addressing Marco's stability concern) while avoiding the need for explicit retroactive legislation (addressing Yuki's rule-of-law concern). Ignoring this middle ground leaves the debate stuck in a binary that the actual historical resolution transcended.
