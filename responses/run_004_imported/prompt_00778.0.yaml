answer: |-
  You have hit on exactly the right tension, and your intuition is spot-on. You are reading Broad correctly: the dividing line he is drawing is indeed between **structural/relational properties** (which he grants, for the sake of argument, might be deducible) and **qualitative/experiential properties** (which he argues are fundamentally undeducible).

  Here is the breakdown of why Broad makes this distinction, how it relates to the "Hard Problem," and why his definition of emergence is much stronger than what is typically used in computer science today.

  ### 1. The Dividing Line: Primary vs. Secondary Qualities
  To understand why Broad treats "solubility" differently from "smell," you have to look at the historical framework he is inheriting: the Lockean distinction between **Primary and Secondary Qualities**.

  *   **Primary Qualities:** Properties inherent to the object itself, independent of an observer (e.g., mass, shape, motion, atomic arrangement). In principle, these can be described mathematically and structurally.
  *   **Secondary Qualities:** Properties that arise only in the interaction between the object and a perceiver (e.g., color, smell, taste, sound).

  In the passage you quoted, Broad is making a strategic concession. He says, *"If the mechanistic theory be true..."* He is essentially telling the reductionists: "Okay, let's pretend you can deduce all the physical structures and chemical reactions from micro-physics. I will grant you that 'solubility' and 'atomic ratio' are just complex descriptions of particle arrangements."

  However, he draws the line at **smell**. Why? Because "smell" is not a property of the ammonia molecule itself; it is a **conscious experience** produced in a mind when the molecule interacts with a nose.
  *   The Archangel can predict the *physical cause*: "Molecule X binds to receptor Y, causing ion channel Z to open."
  *   The Archangel cannot predict the *phenomenal effect*: "...and this will *feel like* a pungent odor."

  So, yes, you are correct: Broad is smuggling in what David Chalmers would later (in 1995) call the **"Hard Problem of Consciousness."** Broad is arguing that there is an **explanatory gap** between physical processes and subjective experience that cannot be bridged by deduction, no matter how much micro-data you have.

  ### 2. Broad's "Strong Emergence" vs. Modern "Weak Emergence"
  This leads directly to your second question. Broad's notion of emergence is fundamentally different from—and stronger than—the way the term is used in complexity science, multi-agent systems, and ML.

  #### Broad's View: Strong (Ontological) Emergence
  For Broad, a property is **emergent** if it is **in principle undeducible** from the properties of the parts, even with complete knowledge of the laws governing the parts.
  *   **The Claim:** Nature has "brute" laws that only kick in at certain levels of complexity. You cannot derive the law of smell from the laws of physics; you have to observe it and add it as a new fundamental law.
  *   **The Implication:** The whole is *ontologically* greater than the sum of the parts. Reductionism is false.

  #### Modern CS/ML View: Weak (Epistemic) Emergence
  When software engineers talk about emergent behavior in flocking simulations, cellular automata, or LLMs, they almost always mean **Weak Emergence**.
  *   **The Claim:** The macro-behavior is surprising, hard to predict, and perhaps computationally irreducible (you have to run the simulation to see the result), but it is **in principle deducible** from the micro-rules.
  *   **The Implication:** There are no new laws of nature. The "emergence" is a limitation of *our* cognition or computing power, not a limitation of the universe's reducibility.

  **The Mismatch:**
  If you showed Broad a flocking simulation, he would likely say, "That isn't emergence; that's just complicated mechanism." Since the flocking behavior is fully determined by the code governing each agent, the Archangel *could* deduce the flocking patterns from the code. Therefore, for Broad, it is a **resultant** property, not an **emergent** one.

  ### 3. A Nuance on Broad's Actual Theory
  It is worth noting one subtlety for your deeper understanding. In the passage you quoted, Broad grants the mechanist the ability to deduce chemical properties (solubility, ratios) to isolate his argument about *mind*.

  However, in the full text of *The Mind and Its Place in Nature*, Broad actually argues that **chemical properties are also emergent** in the Strong sense. He believed you could not deduce the chemical behavior of Silver Chloride just from knowing the physics of Silver and Chlorine separately. He used the "smell" argument because it was the most undeniable case (the "wedge"), but his full theory ("Emergent Materialism") posits that emergence happens at every level of complexity (physics → chemistry → biology → mind).

  So, ironically, Broad's actual view is even *more* emergentist than the specific passage suggests. He thinks the "solubility" fact is also undeducible, but he concedes it in that paragraph to show that *even if* you win on physics/chemistry, you still lose on consciousness.

  ### 4. Why This Matters for Your Work
  As a software engineer working with multi-agent systems, this distinction is practically vital:

  1.  **Debuggability:** If you believe in "Weak Emergence" (the standard engineering view), then any weird behavior in your system is theoretically traceable back to the code/rules, even if it's hard. If you start believing in "Strong Emergence," you might start looking for magical properties that aren't in the code.
  2.  **LLMs and Consciousness:** When people discuss "emergent abilities" in Large Language Models, they usually mean Weak Emergence (capabilities appearing at scale that weren't explicitly trained). However, when people ask, "Could an LLM ever be conscious?", they are stumbling into Broad's territory. If consciousness is Broad-emergent (Strong), then scaling up parameters might never produce it, because it requires a new kind of "brute law" not present in matrix multiplication.
  3.  **Terminology:** It helps to be precise in conversations. When you say "emergent," clarify if you mean "surprising macro-pattern" (Weak) or "fundamentally new causal powers" (Strong). Most physicists and engineers assume the former; Broad is arguing for the latter.

  ### Summary
  *   **The Dividing Line:** Yes, it is subjectivity. Broad distinguishes between physical structure (deducible) and qualitative experience (undeducible).
  *   **The Hard Problem:** Yes, this is the 1925 version of the Hard Problem of Consciousness.
  *   **Strong vs. Weak:** Broad's emergence is **Strong** (ontological, new laws required). Modern ML emergence is **Weak** (epistemic, surprising but computationally derivable).

  You have correctly identified that the modern engineering usage of "emergence" is a watered-down, metaphorical cousin of the philosophical concept Broad was defending. Broad would likely classify your multi-agent systems as "mechanistic complexes," not truly emergent systems, unless you can prove they exhibit properties that are *in principle* unpredictible from their code.
