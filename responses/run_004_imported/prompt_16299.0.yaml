      *   *Premise 2:* Human progression requires freedom to expand spontaneously (think/act for oneself, not resign to rulers).
      *   *Observation:* Communist associations bring private life under public authority more than ever before.
      *   *Conclusion (Main):* Less scope for individual character/preferences than in existing progressive states.
