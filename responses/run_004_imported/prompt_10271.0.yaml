answer: |-
  # The Junction

  Dr. Aris Thorne stood at the airlock of Sector 1, looking down the curve of the Halo. The orbital ring was a perfect circle, a silver ribbon against the bruised purple of the Earth below. It was supposed to be a lifeboat for humanity, a place to wait out the atmospheric collapse. But three centuries of radiation exposure and low-gravity adaptation had turned the Halo into something else.

  Aris was a Taxonomist, one of the few remaining specialists in the Bureau of Continuity. Her job was to find lines where none existed.

  "Status report," she said. Her voice was flat, practiced.

  "Segment 400 is requesting the antiviral," said Commander Hales of Sector 1. Hales was Baseline—smooth skin, five fingers, eyes that didn't reflect infrared. He looked like the portraits of the Ancestors in the archive. "They claim they are still Human. They claim continuity."

  "And your assessment?"

  Hales gestured to the sealed canister of medicine at his feet. "Look at them, Doctor. Segment 400? They have dermal plating. Their lung capacity is triple ours. Their gametes won't fuse with ours without artificial intervention. They aren't us. If we give them the cure, we set a precedent. Next, they'll want voting rights. Then, access to the Core."

  "They are dying," Aris said.

  "They are *diverging*," Hales corrected. "The Charter states aid is mandatory for *Homo sapiens*. It is discretionary for post-human derivatives. You are here to tell us which they are."

  Aris nodded. She knew the file. The *Ensatina* Precedent was taught in every philosophy of biology seminar, but this was the first time it had been litigated with lives on the line. The Halo population had drifted. Sector 1 was Baseline. Sector 2 had slight bone density changes. Sector 3 had altered circadian rhythms. Sector 4 interbred freely with 3 and 5. And so on, around the 500 sectors of the ring.

  The gene flow was unbroken. You could trace a lineage from Sector 1 to Sector 400 through a chain of valid marriages, valid births, and valid genetic compatibility. Every neighbor could breed with their neighbor. But Sector 1 and Sector 400, who met at this junction, could not. The ring had closed, and the ends did not touch.

  "I need to walk the chain," Aris said.

  Hales frowned. "Protocol allows for remote data analysis."

  "Remote data shows the statistics," Aris said, pulling on her mag-boots. "I need to see the continuity."

  ***

  The transit car moved along the inner rim of the Halo. Aris watched the sectors slide by.

  In Sector 10, the children were taller, their limbs slightly elongated for the lower gravity. They waved at the car. They spoke the Common Tongue.
  In Sector 50, the air mix changed. The people wore filtration masks, not because the air was bad, but because their oxygen saturation needs had shifted. They traded with Sector 49 and 51. Aris reviewed the logs: intermarriage rates were at 40%. No reproductive barriers.
  In Sector 100, the skin pigmentation had darkened to a deep violet to block cosmic radiation. A woman in Sector 100 sold Aris water. Her fingers were webbed. "For the hydroponics," she explained, seeing Aris look. "My mother was from 99. My husband is from 101. We're fine."

  Aris took samples. She ran the compatibility algorithms. The results were always the same: *Continuous.*

  By Sector 200, the language had drifted. It was still the Common Tongue, but the syntax had folded in on itself, efficient and dense. Aris needed a translator app to understand the station master. He showed her the family trees. They were sprawling webs that crossed sector lines effortlessly. There was no isolation. There was no speciation event. There was only the slow, accretion of difference, grain by grain.

  In Sector 300, the biology became harder to recognize. Eyes were larger, nictitating membranes flickering over irises that saw into the ultraviolet. They communicated with light pulses as much as sound. Yet, when Aris asked about Sector 299, they nodded. "Our kin." And Sector 301? "Our kin."

  The Sorites heap was not a puzzle here. It was a physical reality. If you removed one grain of sand, it was still a heap. If you moved one sector over, it was still humanity.

  Aris reached Sector 399.
  The people here were heavily modified. Their spines were externalized, protective ridges running down their backs. They breathed a mix that would suffocate Hales in minutes. But they could breed with 398. And they could breed with 400.
  Aris met the delegate from 400 at the border.
  He was tall, his skin a matte grey, his hands possessing six digits, the extra finger opposable. He did not speak. He projected a thought-package into Aris's neural link.
  *We are the Halo. We are the Wall. We are the Children.*
  *Are you Human?* Aris projected back.
  *We are the end of the line that begins at 1.*
  *Can you breed with 1?*
  *No.*
  *Then you are not the same species.*
  *Where is the break?*

  Aris paused. This was the question. The biological reality was a circle. The legal definition was a line.
  *There is no break,* she admitted.
  *Then why do we die?*

  ***

  Aris returned to Sector 1 after four days. Hales was waiting. The canister of antiviral sat untouched. The countdown clock on the wall showed 12 hours until Segment 400's life support failed.

  "Well?" Hales asked. "Is there a discontinuity?"

  Aris placed her datapad on the table. She pulled up the genetic maps. They formed a perfect gradient. A color wheel where red slowly became blue, with every shade in between.
  "No," Aris said. "There is no point of speciation. Reproductive isolation is only present between the terminals. Every intermediate population is fully fertile with its neighbors. By the Biological Species Concept, they are a single ring species. By the Phylogenetic Species Concept, they are a single lineage."

  Hales stared at the data. "So they're us."

  "So they're continuous with us," Aris corrected. "But 'us'... 'us' is a definition, Commander. Not a fact."

  Hales leaned forward. "If I release the cure, I admit that Sector 400 is Human. If Sector 400 is Human, then Sector 300 is Human. Then Sector 200. Then the modifications in Sector 50. Do you understand the implication? The Charter protects Baseline Humanity. It does not protect... whatever this is."

  "If you don't release the cure," Aris said softly, "you are condemning four hundred sectors of your own lineage to death. You are killing your grandchildren."

  "They aren't my grandchildren!" Hales slammed his hand on the table. "My grandchildren look like me. They don't have gill slits and six fingers. You're asking me to expand the definition of 'Human' until it means nothing. If 'Human' can be anything, then 'Human' has no value."

  "And if 'Human' is a fixed point," Aris countered, "then you are admitting that evolution is a crime. That change is a forfeiture of rights."

  She looked at the datapad. She had the authority to make the ruling. The Bureau had sent her because the local command was deadlocked. She could classify Segment 400 as *Homo sapiens haloensis*, a subspecies eligible for aid. Or she could classify them as *Homo novus*, a new species, ineligible under the Charter.

  The science offered no help. Nature did not draw lines. Nature only drew circles. The line was a violence that humans inflicted on the world to make it manageable.

  "Doctor," Hales said, his voice dropping. "If you rule for them, the Board will remove you. They'll say you compromised the Sanctuary. They'll say you endangered the Baseline."

  "And if I rule against them?"

  Hales looked at the countdown. 10 hours. "Then they die. And we keep our definition clean."

  Aris thought about the delegate in Sector 399. The ridges on his spine. The way he spoke of Sector 400 as *kin*. She thought about the salamanders in the old textbooks, the *Ensatina* winding around the valley. The biologists had argued about them for decades. They wrote papers. They drew maps. They didn't have to watch the populations starve.

  She realized then that the puzzle wasn't about the biology. It was about the cost of categorization. To save them, she had to lie about the continuity. She had to pretend there was a boundary she could defend. To tell the truth was to condemn them.

  "Give me the pen," Aris said.

  Hales slid the digital stylus across the table.

  Aris opened the classification form. Field 4: *Taxonomic Designation.*
  She hovered the stylus over the input field.
  If she wrote *Homo sapiens*, she validated the ring. She saved Sector 400. But she opened the door for Sector 500, Sector 600, until the Baseline was diluted into oblivion.
  If she wrote *Homo novus*, she drew the line. She saved the Baseline. She killed the Ring.

  There was no correct answer. There was only the cut.

  "Is it done?" Hales asked.

  Aris looked at the form. She had entered a designation. It was arbitrary. It was a number pulled from a table of codes that had no basis in the genetic data. It was a lie that would function as truth.

  "It's done," she said.

  Hales exhaled, a sound of relief that tasted like guilt. He picked up the canister. "I'll authorize the transport."

  "Commander," Aris said.

  He paused.

  "Where did you draw the line?"

  Hales looked at her, then at the datapad. He saw the code she had entered. It designated Sector 400 as *Homo novus*. Ineligible.
  "You ruled against them?" Hales asked, confused. "Then why..."

  "I ruled that Sector 400 is a new species," Aris said. "Aid is discretionary. I am invoking the Emergency Humanitarian Clause. It allows aid to non-human sentient entities in extremis."

  Hales blinked. "That... that sets a different precedent. It acknowledges they aren't us."

  "It acknowledges they are dying," Aris said. "It keeps your definition pure, Commander. You don't have to call them human to save them. You just have to call them valuable."

  Hales stared at her for a long moment. He understood. She had found a loophole in the law to bypass the paradox in the biology. She had allowed the line to stand, even though she knew it was fake. She had preserved the comfort of the category at the cost of its truth.

  "It will hold," Hales said quietly. "For now."

  "For now," Aris agreed.

  He took the canister and left the room. The airlock cycled. The medicine went to Sector 400. They would live another generation. They would drift another degree. The ring would tighten.

  Aris remained alone in the command center. She looked at the datapad. The designation *Homo novus* glowed on the screen. It was a fiction. A necessary fiction.
  She thought about the walk along the ring. The seamless chain of faces, each one recognizable, each one loving their neighbor, until the neighbor at the end of the line was a stranger.

  She deleted the file.
  The paradox remained. The line was drawn. The blood was on the paper, not the blade.
  Outside, the Halo turned, a perfect circle of light in the dark, hiding the break that wasn't there, and the break that was.
