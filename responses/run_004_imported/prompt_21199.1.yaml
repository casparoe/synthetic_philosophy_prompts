      *   *Elena's stance:* If the filaments arose as thermal insulation (selected for heat retention), calling them "display structures" is category error, even if they look flashy. If they are spandrels (byproducts), they have *no* proper function until selected.
      *   *Marcus's stance:* If the filaments increase aerodynamic stability during a jump, that is their causal role function *now*, in this system, regardless of why they grew.
      *   *The Extinction Problem:* Since the animal is dead, selection has stopped. Elena says: "Function is closed." Marcus says: "Function is frozen but readable."
      *   *The Marriage Parallel:* Elena: We are who we were raised to be (our selection history). The divorce was inevitable based on our origins. Marcus: We are what we did in the room. The divorce was about current incompatibility.

