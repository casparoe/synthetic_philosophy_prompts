answer: |-
  # Type Specimen

  The limestone slab sat on the steel table under the glare of the halogen lamp, casting a shadow that looked like a bruise. It was a troodontid, undescribed, from the Yixian Formation. Early Cretaceous. One hundred and twenty-five million years dead.

  Elena adjusted the calipers. She didn't look at Julian. She hadn't looked directly at him since he'd swiped his badge at the door forty minutes ago.

  "The aspect ratio is wrong for flight," she said. Her voice was the same as it had been in the tenure review, in the kitchen of the house in Cambridge, in the lawyer's office. Flat, precise, devoid of ornament. "And the attachment points on the ulna don't support the muscle mass required for active flapping. So we cannot code it as *flight*."

  Julian leaned against the counter, arms crossed. He looked tired. The grey in his beard was new; the last time she'd seen him, at the Society of Vertebrate Paleontology in Montreal, he'd been dyeing it. "We aren't coding for flight, El. We're coding for aerodynamic stability during predation. Look at the center of mass. If it jumps, those filaments generate drag. They act as rudders."

  "They *can* generate drag," Elena corrected. She finally looked up. His eyes were the same dark brown, but the skin around them had settled into permanent creases. "Capability is not function. Under the etiological account, a trait's function is the effect for which it was *selected*. Did natural selection favor these filaments because they helped the animal turn while jumping? Or did it favor them for insulation, and the turning is just a lucky accident? A spandrel."

  "It's a distinction without a difference," Julian said. He pushed off the counter and stepped closer to the table. The smell of him—old wool and coffee—triggered a phantom memory of a shared bed, a sensation she suppressed immediately. "In a Cummins framework, the function is what the trait *does* in the containing system. The system is the hunting animal. The trait contributes stability. Therefore, the function is stability. Selection history is irrelevant to the current mechanical reality."

  "Selection history is the only thing that gives the word 'function' meaning in biology," Elena said. She tapped the rock with the tip of her pen. "Otherwise, you're just describing physics. If a rock falls and kills a predator, the rock's function isn't 'weapon.' It's just a rock. If these filaments weren't selected for steering, they aren't steering mechanisms. They are insulation that happens to catch air."

  "But the animal is dead," Julian said. He gestured at the slab. "Selection has stopped. The history is closed. If you require evidence of specific selection pressure to assign function, and the animal is extinct so we can't observe the pressure, then you're left saying this structure has *no* function. It's just there. Decorative noise."

  "It might be noise," Elena said. "Nature is full of byproducts."

  "You hate that idea," Julian said.

  "I hate inaccuracy."

  "You hate the idea that things can be more than their origins," he said.

  Elena stopped writing. She looked at the fossil. The filaments were preserved in carbon film, dark halos radiating from the forelimbs. They were exquisite. They looked like hope.

  "I hate the idea that we project utility onto chaos because we're uncomfortable with ambiguity," she said.

  Julian walked around the table. He stood on the opposite side, looking down at the specimen. They were framing it, two figures bracketing the dead thing.

  "We published three papers on *Microraptor* using the causal-role model," Julian said. "You were co-author on two of them."

  "I was accommodating your methodology to secure the grant," Elena said. "That doesn't mean I conceded the ontological point."

  "You conceded enough to sign the byline."

  "I conceded that the grant committee didn't care about Millikan."

  Julian laughed, a short, dry sound. "We're arguing about a ghost, El. This animal lived, it hunted, it died. Whether its feathers were 'for' warmth or 'for' turning doesn't change the rock. But it changes how we write the description. If you write 'insulation,' you lock it into a phylogenetic box. If I write 'aerodynamic control,' I open it up to behavioral ecology."

  "If you write 'aerodynamic control' without evidence of selection, you are writing fiction," Elena said. "You are saying this animal *wanted* to turn. You are assigning intent to the genome."

  "I'm assigning role to the system," Julian countered. "Just like... look. Just like us."

  Elena capped her pen. The click was loud in the quiet lab. "Don't."

  "We're co-authors on four papers since the divorce," Julian said. "We function as a unit. We review each other's drafts. We balance the grant budgets. In the system of this department, our causal role is 'collaborators.' Why does it matter that the selection pressure—the marriage—is gone?"

  "Because the function of a marriage is reproduction. Or support. Or cohabitation," Elena said. She began to pack her calipers into their foam case. "We do none of those things. We are two independent variables that occasionally intersect. To call it a partnership implies a selected effect. There was no selection for this. This is just... drag. Residual friction."

  "That's the etiological view," Julian said softly. "You think we are only what we were built to be. Because we were selected to be husband and wife, and we failed that, we can't have a function now. You think our history invalidates our current utility."

  "I think our history explains our current limitations," Elena said. She snapped the case shut. "You were raised to believe that utility justifies existence. If it works, it's right. If we can write papers together, the partnership is valid. I was raised to believe that origin dictates destiny. We were selected for intimacy. We lost that adaptation. The trait is vestigial."

  "So I'm a vestigial husband?"

  "You're a co-author with a shared dataset."

  Julian looked back at the fossil. He reached out, hovering his hand over the limestone, not touching it. Conservation rules.

  "The problem with your view," Julian said, "is that for an extinct species, the 'selected effect' is unknowable. We weren't there. We can infer, but we can't know. So you're paralyzed. You can't say what this feather is for. You have to leave the field blank in the database."

  "I leave it blank because I don't know," Elena said. "Honesty is a valid scientific position."

  "It's a dead end," Julian said. "If I use the causal-role view, I can say: This feather provided stability. That is true, regardless of why it grew. It allows me to model the behavior. It allows me to understand the animal as a living system, not just a lineage."

  "It allows you to invent a living system," Elena said. "You're animating a rock because you can't stand the silence of the deep time."

  "And you're burying the animal under its own genealogy," Julian said. He turned to face her. "You do the same thing with yourself. You think you are who your parents made you. Who your training made you. You think the divorce proved that the 'Elena' selected for marriage was defective, so the 'Elena' that exists now is just a broken version of the original."

  Elena picked up her bag. She felt the weight of it, the physical reality of the leather strap. "I think I am the sum of my adaptations. Some were maladaptive in the environment of a marriage. That doesn't make me broken. It makes me mismatched."

  "And I think you are what you do," Julian said. "You come here. You work the fossil. You write the paper. That is your function. The fact that we slept in the same bed for ten years is just phylogeny. It's the history. It doesn't determine the current mechanics."

  "It determines the stress fractures," Elena said.

  She moved to the door. She needed to leave before the humidity in the room changed, before the air became too thick to breathe.

  "Wait," Julian said.

  She paused, hand on the handle.

  "The filaments," he said. "Look at the asymmetry. The rachis is offset."

  Elena turned back. She looked at the fossil again. She knew what he was going to say. Asymmetry in flight feathers is a classic indicator of aerodynamic function. It reduces drag on the upstroke.

  "If it's asymmetrical," Julian said, "it suggests selection for air manipulation. Not just insulation. Insulation is usually symmetrical down."

  "Or," Elena said, "it suggests a structural byproduct of keratin growth patterns that were selected for something else entirely. Display. Sexual selection. The asymmetry makes them catch the light differently."

  "Display is a function," Julian said.

  "Under the etiological view, only if they were selected for display," Elena said. "If they were selected for heat, and used for display, the display is a side effect. Not a function."

  "So you still won't say what it's for."

  "I will say what it *is*," Elena said. "I will not lie about *why*."

  "It's the same argument," Julian said. "We've had this argument for fifteen years. In the lab. In the bedroom. In the mediation session."

  "It's the only argument that matters," Elena said. "Are we our history? Or are we our current capacity?"

  Julian looked at her, and for a moment, the professional mask slipped. She saw the exhaustion, the lingering affection that had no place to go, the frustration of a man who wants to fix a machine that refuses to acknowledge it's broken.

  "I miss you," he said. It was a causal statement. A current contribution to the emotional system of the room.

  Elena looked at him. She felt the pull of the past, the heavy gravity of the years they had selected for each other. She felt the etiological weight of it. She was the woman who loved him, because that was what she had been shaped to be. But she was also the woman who left, because that was what she currently did.

  "I know," she said.

  She didn't say *I miss you too*. To say it would be to assign a function to the feeling that she wasn't sure it possessed. Was it love? Or was it the friction of two surfaces that had worn smooth against each other?

  "I'll send the draft on Tuesday," she said.

  "Send it," Julian said. "I'll mark up the functional analysis."

  "I'll reject the changes."

  "I know."

  Elena opened the door. The hallway was dark, the motion sensors flickering on as she stepped out. She didn't look back. Behind her, the halogen lamp hummed, illuminating the limestone slab. The fossil lay in the light, its filaments frozen in a permanent gesture, neither flying nor falling, simply remaining, waiting for a hand to describe it.

  Julian stayed in the lab. He turned off the main lights, leaving only the lamp on the table. He sat down in the chair Elena had vacated. He picked up the pen she had left on the table. He looked at the fossil, at the asymmetrical vanes of the feathers.

  He opened the database file on the laptop. In the field labeled *Function*, the cursor blinked.

  He typed: *Aerodynamic stability.*

  He paused. He hit delete.

  He typed: *Unknown.*

  He sat there for a long time, watching the cursor blink, neither saving nor closing the file, while the building settled around him, cold and silent as the Cretaceous.
