      *   The object: A slab of rock.

  5.  **Drafting - Section by Section:**

      *   **Opening:** Establish the physical distance and the object. The fossil. The atmosphere.
      *   **The Scientific Argument:** Introduce the specific disagreement about the filaments. Use the terminology (Selected Effects vs. Causal Role) but weave it into dialogue.
      *   **The Personal Subtext:** Hints of the marriage. The divorce. The shared history.
