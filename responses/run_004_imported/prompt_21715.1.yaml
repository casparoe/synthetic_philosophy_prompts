prompt: |-
  So this has been rattling around in my head for weeks and I can't quite settle it. I built basically my whole intro to logic course around Frege, he's the reason I fell in love with philosophy of language as an undergrad, Sense and Reference genuinely changed how I think about, well, everything. Anyway, a colleague from the history department mentioned over lunch that Frege kept a private diary near the end of his life, 1924 I think, that only got discovered and translated decades later (I want to say Dummett is the one who broke the news on this to everyone). Its apparently full of really ugly stuff, hardline antisemitism, wanting Jews stripped of political rights, hoping for some strongman to sweep away the Weimar government, that whole cluster of views. I looked up a couple of the passages afterward and yeah, its rough reading, and none of it has anything to do with logic, it's just his private political grumbling.

  Ever since hearing about this I feel weirdly off putting up a slide with Begriffsschrift notation on it, like I'm quietly endorsing the guy by teaching his stuff. My colleague's reaction was basically "who cares, the concept-script doesn't care who invented it," and brought up how Newton was obsessed with alchemy and treated Hooke horribly, and how Wittgenstein was apparently a pretty brutal schoolteacher, so why should Frege get special treatment. That feels too fast to me, like it's dodging the actual question rather than answering it, but I can't quite say why. Is there something philosophically real underneath my discomfort here, or am I just running together two things that have nothing to do with each other and should get over it? Genuinely curious how you'd untangle this one.
