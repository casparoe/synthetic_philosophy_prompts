answer: |-
  First, a small but significant correction on the timeline: G.E.M. Anscombe died in **January 2001**, just months before the 9/11 attacks that precipitated the modern expansion of the US drone and targeted-killing program. So, she never actually saw the era of "signature strikes" or the post-9/11 drone war. However, her philosophical framework is robust enough to apply hypothetically.

  You are correct about her pamphlet, *Mr. Truman's Degree* (1956), and her core argument. Anscombe argued that the atomic bombings were not permissible under the Doctrine of Double Effect (DDE) because the death of civilians was not merely a *foreseen side effect* of hitting a military target; it was the *means* by which the victory was achieved (breaking morale/will to fight). In her view, intending the death of the innocent is murder, full stop, regardless of the good consequences (ending the war).

  If we apply Anscombe's specific logic from *Mr. Truman's Degree* and her broader work *War and Murder* (1961) to modern "signature strikes," it is highly probable she would condemn them just as fiercely, perhaps even more so. Here is how she would likely analyze the disanalogy regarding "intention" and "uncertainty."

  ### 1. The Problem of Intention and Description
  Anscombe's philosophy of action (laid out in her book *Intention*) hinges on the idea that intention is defined by the description under which an action is chosen.

  *   **Truman Case:** The description was "bomb this city to break their will." Since breaking their will required killing the civilians, the civilians' deaths were intended.
  *   **Signature Strike Case:** The official description is "kill combatants exhibiting suspicious patterns." However, Anscombe would look at the *practical truth* of the action. If the intelligence is insufficient to identify individuals, the operative description of the action becomes closer to "kill everyone fitting this profile in this area."

  For Anscombe, you cannot intend to kill "only the guilty" if your method makes it impossible to distinguish the guilty from the innocent. If you pull the trigger knowing you cannot verify who is in the compound, you are willing the death of *whoever is there*. If innocents are there (and in signature strikes, they frequently are), you have willed their death as part of the execution of the act. The uncertainty does not absolve the intention; it corrupts it.

  ### 2. The "Means" vs. "Side Effect" Distinction
  The crux of the Double Effect defense for drone strikes is usually that civilian deaths are "collateral damage" (foreseen but not intended). Anscombe would likely reject this in the context of signature strikes for two reasons:

  **A. Indiscriminate Method as a Means**
  In Hiroshima, the killing of civilians was the *means* to surrender. In signature strikes, if the strategy relies on "pattern of life" analysis rather than positive identification, the killing of people in that zone becomes the *method* of threat neutralization. If the "signature" includes behaviors that civilians also engage with (e.g., gathering in groups, using phones, moving in trucks), then the strike effectively treats civilians as combatants. Anscombe would argue this obliterates the distinction between combatant and non-combatant, which is the foundational requirement for *jus in bello* (justice in war).

  **B. Recklessness as Intention**
  Anscombe was a moral absolutist regarding the innocent. She argued that if you undertake an action where the death of innocents is highly probable and you proceed without absolute necessity and discrimination, you bear responsibility for those deaths. In *War and Murder*, she writes that the immunity of the innocent is not a matter of calculation (proportionality) but of absolute prohibition.

  Signature strikes, by definition, accept a higher risk to civilians than targeted strikes with positive ID. For Anscombe, accepting that risk as "standard operating procedure" suggests that the deaths of innocents are being treated as an acceptable cost of doing business. In her framework, treating innocent death as an acceptable cost is functionally equivalent to intending it, because you are subordinating their right to life to a military objective.

  ### 3. Is there a Disanalogy?
  You asked if the uncertainty of identity creates a disanalogy that might save the drone program from her condemnation.

  **The Argument for Disanalogy:**
  One could argue that Truman *wanted* civilians dead to terrorize Japan. Drone operators *want* to kill terrorists but sometimes fail due to bad intel. Therefore, the intention is pure, even if the outcome is tragic.

  **Anscombe's Likely Rebuttal:**
  Anscombe would likely find this distinction morally hollow. She was deeply suspicious of consequentialist reasoning (the idea that good outcomes justify bad means). She would argue that **uncertainty imposes a duty to refrain, not a license to strike.**

  In her view, if you cannot be sure you are killing a guilty party, you do not have the moral authority to kill. To kill while uncertain is to act as a judge without evidence. She would likely argue that a "signature strike" where identity is unknown is not an attempt to kill combatants with unfortunate side effects; it is an act of killing *human beings* under a presumption of guilt. If that presumption is wrong, the killer has murdered an innocent person, and if the strategy *systemically* relies on presumptions that risk innocence, the strategy itself is intrinsically evil.

  She famously argued that the distinction between "intended" and "foreseen" is not a loophole to be exploited by vague descriptions. If the only way to achieve your military goal is to use a method that kills innocents (because you can't identify the guilty), then you are intending the killing of innocents as the price of your goal.

  ### 4. The Verdict
  Anscombe would likely view signature strikes as a **technological refinement of the Hiroshima error.**

  *   **Hiroshima:** "We kill these civilians to break their state."
  *   **Signature Strikes:** "We kill these people (some of whom are civilians) to degrade their network."

  In both cases, the absolute immunity of the innocent is violated. The fact that the drone operator *hopes* there are no children in the compound would not matter to Anscombe if the operator proceeds despite knowing the intelligence is probabilistic rather than certain.

  She would likely argue that the "signature" methodology institutionalizes the killing of the innocent by blurring the line between combatant and civilian. For Anscombe, **intention is not just what is in your heart; it is what is embodied in your action.** If the action is "launch missile at compound with unverified occupants," the intention encompasses the death of those occupants, innocent or not.

  Therefore, she would almost certainly classify signature strikes as murder, not permissible collateral damage. The uncertainty of identity doesn't make it less intentional; it makes the intention more indiscriminate, which for a natural law theorist like Anscombe, is even worse.
