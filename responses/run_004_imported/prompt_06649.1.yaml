      *   *The "Signature" Problem:* This is the crux. If you don't know who they are, can you intend to kill only the guilty? Anscombe would say "No." Acting on probability where lives are at stake is morally reckless.
      *   *Intention:* In "Intention" (her book), she argues intention is what you are doing under a description. If the description is "killing people in this compound based on patterns," and innocents are there, you are killing innocents.
      *   *Verdict:* She would likely see it as a technological extension of the same moral error: prioritizing military efficacy over the absolute prohibition of killing the innocent. The "uncertainty" doesn't help; it hurts the moral case because it removes the certainty of discrimination.

  8.  **Final Polish:** Check for clarity on PDE. Ensure the distinction between "collateral damage" (foreseen but not intended) and "signature strikes" (where the distinction is blurred) is clear. Emphasize that for Anscombe, *uncertainty* does not grant license; it imposes a duty to refrain.

  **(Self-Correction during drafting):** I need to make sure I don't attribute views to her she didn't hold, but extrapolate from her established principles in "War and Murder" and "Intention." She was a staunch Catholic natural law theorist. The absolute prohibition on killing the innocent is the non-negotiable premise.

