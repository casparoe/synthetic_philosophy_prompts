answer: |-
  The multispectral scan glowed on the monitor, a ghostly negative of the saint's face. The blue channel highlighted the underdrawing, revealing brushstrokes that belonged to 1924, not 1624.

  Elias stood behind Julian, the new curator, watching the younger man's shoulders tighten. For twenty years, Elias had breathed linseed oil and turpentine. He had saved this museum from bankruptcy with his quiet miracles. He had saved *this* painting, the *Madonna of the Veil*, when it arrived waterlogged and torn. The lower quadrant had been lost. He had filled it. Not copied—*completed*. He had channelled the master so deeply he felt he'd earned the right to sign it, though he never did.

  "It's you," Julian said. He didn't turn around. "The pigment analysis matches your batch from '98. The brushwork in the veil… it's too confident. The Master hesitated. You didn't."

  "I saved it," Elias said. His voice sounded thin in the climate-controlled lab. "Without me, it's a hole."

  Julian spun his chair around. He looked at the painting standing on the easel nearby, draped in shadow. Then he looked back at the screen. He stood up and walked to the canvas, leaning in until his nose was inches from the dried oil. He stared at the veil, the section Elias had breathed into existence.

  For a full minute, Julian said nothing. Then he flinched, physically recoiling as if the canvas had snapped at him.

  "It's dead," Julian whispered.

  "It's the same paint," Elias said. "It's the same light."

  "No." Julian rubbed his eyes, then looked again, harder. "Before I saw the scan, the veil flowed. It had weight. Now… now I see the calculation. I see you thinking about where the brush should go. It's hesitant. It's trying to convince me."

  "It hasn't changed," Elias insisted. "The light hitting it is the same. Your eyes are the same."

  "My eyes aren't the same because *I'm* not the same," Julian snapped. "I know the history of this surface now. I can't un-know it. Every time I look at it, I'm not looking at a miracle anymore. I'm looking for the lie. And now that I'm looking for it, I see it. The aesthetic experience is broken because the category is broken. It's not a masterpiece anymore. It's a trick."

  "The view is unchanged," Elias said, though he felt a cold knot in his stomach. "If you blinded yourself to the provenance, you'd feel the same awe."

  "I can't blind myself," Julian said. "Knowledge isn't separate from sight. It trains the eye. Tomorrow, I'll see cracks I didn't see today. The fake might be perfect now, but it won't be perfect next week, because I'll be hunting it. The authenticity isn't in the oil, Elias. It's in the knowing."

  The door opened. Margaret, the museum director, stepped in, holding a folder. She'd heard the raised voices. She looked from the scan to the painting, then to Elias. She didn't need to ask. She'd suspected for years.

  "Stop," Margaret said. She walked to the painting, but she didn't look at the brushwork. She looked at the frame, the label, the accession number. "You're both missing the point."

  "He ruined the integrity of the collection," Julian said, gesturing to the canvas. "He altered our perception."

  "He stole credit," Margaret corrected. She turned to Elias. "It doesn't matter if the veil looks alive. It doesn't matter if Julian sees the hesitation or not. Even if you painted it so perfectly that no microscope could ever tell the difference, even if everyone looked at it for another four hundred years and felt 'awe'… it would still be wrong."

  "That's superstition," Julian said. "It's about the visual experience."

  "No," Margaret said firmly. "It's about the event. Art isn't just the object; it's the act of creation. When we look at a Master, we are witnessing a specific moment in history where a human being solved a problem. We are connecting with that specific mind across time."

  She tapped the canvas, right over Elias's handiwork.

  "You didn't solve the problem, Elias. You simulated the solution. You bypassed the struggle. When people look at this, they think they are communing with a genius from the seventeenth century. They aren't. They are being lied to about the nature of human achievement. It's not about whether the eye can tell. It's about the lineage. You inserted yourself into a conversation you weren't part of. You stole the credit for the discovery."

  "I kept it alive!" Elias argued. "If I hadn't stepped in, there would be no conversation at all. Just a rotting canvas in a basement."

  "Then let it rot," Margaret said softly. "Better a ruin that is true than a completion that is false. We preserve history, Elias. Not illusions."

  Julian looked back at the painting. He squinted. "I see it now. The shadow under the chin. It's too soft. It lacks the tension of the era."

  "Or maybe you just want to see it," Elias said.

  "Maybe," Julian admitted. "But now I have to look. I can't just see."

  Margaret closed her folder. "And I have to deaccession it. Not because it looks bad. But because the signature of history is forged."

  They stood in the triangular silence of the lab. The painting hung between them, unchanged in its chemistry, unchanged in its visual data. Yet the air around it had shifted, heavy with the weight of the revelation.

  Elias looked at the veil he had painted. He tried to see it as he had ten minutes ago—as a triumph of preservation. He tried to strip away the knowledge of his own hand. But the brushstrokes looked stiff now. Or perhaps they looked too smooth. He couldn't tell if he was seeing the flaw or if the flaw was simply the knowledge that he was there.

  Julian saw a lie that altered the light.
  Margaret saw a theft that altered the record.
  Elias saw only the work, which suddenly felt like neither.

  "Turn off the monitor," Elias said.

  Julian didn't move. The screen continued to glow, casting a blue, forensic light over the saint's face, making the oil paint look like skin under autopsy.
