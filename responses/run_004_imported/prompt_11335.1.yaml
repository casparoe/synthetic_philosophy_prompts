      *   *Attempt 3 (Structuring for Settlement):*
          1.  Direct Answer: You are right.
          2.  The Core Concept: "Optional Stopping" or "Peeking."
          3.  Why the Friend is Wrong: The definition of p-value depends on the *process*, not just the math snapshot.
          4.  The Coin Analogy: Expand on the user's own good analogy.
          5.  The "Past Failures" Evidence: Connect the empirical evidence to the theory.
          6.  How to do it right: Mention Sequential Testing or Fixed Horizons so they have a solution, not just a critique.

  5.  **Refining the Explanation (Key Statistical Points to Hit):**
      *   **The Definition of P-Value:** It's the probability of observing data this extreme *assuming the null is true AND assuming a specific stopping rule*. Change the rule, change the p-value's meaning.
      *   **Error Inflation:** Checking 10 times can inflate the 5% error rate to 20-30% or more.
      *   **Regression to the Mean:** Early results are noisy. Stopping early captures noise.
      *   **Solutions:** Bonferroni (too conservative), Alpha Spending (O'Brien-Fleming), or Bayesian (credible intervals).

