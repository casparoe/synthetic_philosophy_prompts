answer: |-
  You are statistically correct, and your friend's team is making a classic, well-documented error known as **"Optional Stopping"** (or the "Peeking Problem").

  While your friend is right that the math for *that specific day's snapshot* is calculated correctly, she is wrong about what that number *means* for decision-making. By checking daily and stopping at the first sign of significance, they are drastically inflating their false positive rate.

  Here is the breakdown you can use to settle the argument, explained in a way that addresses her specific points.

  ### 1. The Core Misunderstanding: What a P-Value Actually Is
  Your friend argues that "every day's p-value is a real calculation." Technically, yes. If you freeze time on Day 3 and calculate a p-value, the arithmetic is correct for a test that *was planned to end on Day 3.*

  However, a p-value is not just a property of the data; **it is a property of the data *plus the testing process*.**

  The standard definition of $p < 0.05$ assumes you picked a sample size in advance and checked the results **exactly once** at the end. It means: *"If there were no real effect, and I ran this test one time, there is a 5% chance I'd see results this extreme by luck."*

  When you check every day, you aren't running the test one time. You are running a sequence of tests. The question changes to: *"If there were no real effect, and I checked this test 10 times, what are the odds I'd see a 'significant' result **at least once** by luck?"*

  That probability is much, much higher than 5%.

  ### 2. The Coin Flip Analogy (Yours was spot on)
  Your analogy of flipping a coin until you hit a streak is exactly right. Here is how to sharpen it for her:

  Imagine a fair coin (50/50 heads/tails).
  *   **The Rule:** If you flip 10 heads in a row, you declare the coin "rigged."
  *   **Fixed Sample:** If you flip the coin exactly 10 times and get 10 heads, that is very unlikely ($p \approx 0.001$). You can confidently say the coin is rigged.
  *   **Optional Stopping:** If you flip the coin all day, and every time you get a tail you say "ignore that, let's keep going," and you stop only when you hit a streak of 10 heads... you *will* eventually hit that streak.

  Does that streak prove the coin is rigged? No. It proves you were willing to wait long enough for randomness to produce a streak.

  By checking the dashboard every day, her team is effectively saying, "Ignore the days where the p-value was 0.20; we only care about the first day it hits 0.05." This guarantees that eventually, random noise will look like a signal.

  ### 3. The "Smoking Gun": The Flopped Retests
  Your friend waved off the fact that past winners flopped later as a "separate issue." It is actually the **most important piece of evidence.**

  This phenomenon is called **Regression to the Mean.**
  *   Early in a test, results are noisy.
  *   Sometimes, purely by chance, Variant B will look amazing on Day 2.
  *   If you stop then, you are capturing the "luck" component of that variance.
  *   As you collect more data (or retest), the luck washes out, and the true effect (which might be zero) reveals itself.

  If their "winners" consistently flop upon retesting, that is empirical proof that their false positive rate is way higher than the 5% they think it is. Studies on this specific practice show that checking daily can inflate the actual false positive rate from 5% to **20%, 30%, or even higher**, depending on how long they wait.

  ### 4. How to Prove It (The "Alpha Spending" Compromise)
  If she still doubts you, suggest this compromise:

  Tell her: *"You are allowed to check daily, but you can't use 0.05 as the threshold every day."*

  To check daily without breaking statistics, you need to use **Sequential Testing** methods (like O'Brien-Fleming boundaries or Alpha Spending).
  *   **Day 1:** You might need a p-value of 0.001 to stop (because it's too early to trust).
  *   **Day 5:** You might need 0.01.
  *   **Final Day:** You can use 0.05.

  If her dashboard is just showing standard p-values without adjusting the threshold for "peeking," then the numbers are misleading. Most standard A/B testing tools (like Google Optimize used to be, or basic SQL queries) do **not** do this adjustment automatically.

  ### The Verdict
  *   **You:** You are right. The process invalidates the p-value.
  *   **Her:** She is confusing "arithmetic correctness" with "statistical validity."
  *   **The Solution:** They need to either (A) determine the sample size in advance and wait until they hit it, or (B) use a testing platform that specifically supports "Sequential Testing" with corrected significance thresholds.

  **The TL;DR for your friend:**
  "The p-value tells you the odds of seeing this result by chance *assuming you only looked once*. Since we looked multiple times, the odds of seeing a 'lucky' result by chance are much higher than the dashboard says. The flopped retests prove we've been shipping noise."
