prompt: |-
  Had a long argument with my friend last night about how her team runs experiments at work — they watch the results dashboard every day, and the second the p-value on some test dips below 0.05 they call it and ship whichever variant is "winning" at that moment. I said that felt off, kinda like flipping a coin over and over and stopping the second you hit an impressive streak, which doesn't actually mean the coin's rigged. She says every day's p-value is a real calculation on all the data collected so far, so theres nothing shady about stopping the moment one crosses the line — and she waved off the fact that a couple of their past "winners" flopped completely when they got retested later, calling that a totally seperate issue. Who actually has the stronger argument here, and can you explain it in a way that'd settle this for both of us?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Conflict:** The user had an argument with a friend about A/B testing practices at her work.
      *   **Friend's Practice:** Her team checks the results dashboard *every day*. As soon as $p < 0.05$, they stop the test and ship the winner.
      *   **User's Objection:** This feels like "flipping a coin until you get a streak" (peeking/optional stopping). It inflates false positives.
      *   **Friend's Defense:** Every day's p-value is a "real calculation" on accumulated data. Past failures are a "separate issue."
      *   **Goal:** Determine who is right and explain it clearly to settle the argument.

  2.  **Determine the Statistical Truth:**
      *   **Core Concept:** Sequential testing / Optional Stopping / Peeking Problem.
      *   **Standard Frequentist A/B Testing:** Assumes a fixed sample size determined *before* the test starts. If you check repeatedly without adjustment, the Type I error rate (false positive rate) inflates dramatically.
      *   **The "0.05" Meaning:** In a fixed sample test, $p < 0.05$ means there's a 5% chance of seeing this result if there's no real effect *given that you only checked once at the end*.
      *   **The "Peeking" Effect:** If you check every day, you are effectively running multiple hypothesis tests. The probability of *at least one* false positive across many checks is much higher than 5%.
      *   **Friend's Claim:** "Every day's p-value is a real calculation." Technically, the math for *that specific snapshot* is correct, but the *interpretation* (that it implies 5% error risk for the decision process) is wrong.
      *   **User's Claim:** "Like flipping a coin... stopping the second you hit an impressive streak." This is an accurate analogy for the Optional Stopping Problem.
      *   **Past Failures:** The fact that winners flopped later is strong empirical evidence that the false positive rate is indeed inflated.

  3.  **Formulate the Verdict:**
      *   **Winner:** The User is statistically correct. The Friend's team is committing a classic statistical error known as "p-hacking" via optional stopping.
      *   **Nuance:** There *are* methods to check daily (Sequential Testing, Bayesian methods), but standard p-value dashboards usually assume fixed sample sizes. If they aren't using specific sequential correction methods (like Alpha Spending), they are wrong.

  4.  **Drafting the Explanation (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* You are right. She is wrong. Checking every day increases false positives. It's called the multiple comparisons problem. Her p-values are invalid because the stopping rule wasn't fixed. The past failures prove it.
      *   *Critique 1:* Too blunt. Needs to be diplomatic but firm on the math. Needs to explain *why* the daily calculation isn't "real" in the decision-making context.

      *   *Attempt 2 (Adding Analogies):* Use the coin flip analogy the user mentioned. It's good. Explain that 0.05 means 1 in 20. If you check 10 times, your chance of a false alarm is way higher than 1 in 20.
