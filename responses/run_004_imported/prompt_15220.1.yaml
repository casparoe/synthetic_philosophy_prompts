prompt: |-
  I chair my university's Academic Integrity Board, which can impose sanctions ranging from a warning to expulsion but currently applies one evidentiary standard, 'clear and convincing evidence,' to every case. A subcommittee proposes a sliding scale instead -- easier to prove for a warning, harder for expulsion -- and members disagree about why this would be justified. Some argue that the same evidence can amount to knowledge that a student cheated when only a warning is at stake but not when expulsion is -- echoing pragmatic encroachment; others reply that the facts never change, only the contextually salient standard for 'proven' does -- closer to epistemic contextualism; a third group worries that either way, letting the sanction fix what counts as proven makes guilt depend on our choice of punishment. Please draft the short decision memo I'll bring to the Board: recommend a specific evidentiary policy, say which (if either) of these framings it commits us to, and engage seriously with the strongest objection to your recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the University's Academic Integrity Board.
      *   **Task:** Draft a short decision memo for the Board.
      *   **Current Policy:** Single evidentiary standard ("clear and convincing evidence") for all sanctions (warning to expulsion).
      *   **Proposal:** A sliding scale (easier to prove for minor sanctions, harder for major sanctions).
      *   **The Debate:**
          *   *Group 1 (Pragmatic Encroachment):* The stakes change whether the evidence counts as knowledge/guilt.
          *   *Group 2 (Epistemic Contextualism):* The facts don't change, but the meaning of "proven" shifts with context.
          *   *Group 3 (Objection):* Making guilt depend on punishment is circular/unjust (letting the sanction fix what counts as proven).
      *   **Requirements:**
          1.  Recommend a specific evidentiary policy.
          2.  Identify which philosophical framing (if either) the recommendation commits to.
          3.  Engage seriously with the strongest objection.
          4.  Format: Short decision memo.

  2.  **Determine the Recommendation:**
      *   *Option A: Keep the status quo (Clear & Convincing for all).*
          *   Pros: Consistent, avoids the "guilt depends on punishment" objection.
          *   Cons: Might be too hard to punish minor infractions (chilling effect on bringing cases) or too easy to expel (if "clear & convincing" is interpreted loosely for minor stuff).
      *   *Option B: Adopt the sliding scale (Preponderance for warnings, Clear & Convincing/ Beyond Reasonable Doubt for expulsion).*
          *   Pros: Proportionality, aligns with legal/administrative norms (more severe consequences require higher certainty).
          *   Cons: Philosophical confusion (does the student *actually* cheat more if the penalty is higher?), potential perception of unfairness.
      *   *Decision:* The sliding scale is generally the best administrative practice. It balances efficiency with due process. High stakes *should* require higher certainty. This aligns with how courts work (civil vs. criminal) and most university conduct codes.
      *   *Philosophical Commitment:* It's tempting to pick Pragmatic Encroachment, but that's controversial in epistemology. Epistemic Contextualism is also tricky. The *best* justification is actually procedural due process rather than pure epistemology. However, the prompt asks me to engage with the provided framings. The sliding scale *functions* like Pragmatic Encroachment (stakes affect justification), but legally/administratively, it's better framed as a *procedural safeguard* that mimics Contextualism (the definition of "satisfied burden" changes). Let's lean into the distinction between *ontological guilt* (did they do it?) and *administrative finding* (can we sanction?).
      *   *Refined Decision:* Adopt a sliding scale (Preponderance of Evidence for warnings/probation; Clear and Convincing for suspension/expulsion).
      *   *Philosophical Label:* It's closest to *Pragmatic Encroachment* in effect, but we should frame it as *Procedural Proportionality* to avoid the metaphysical mess. However, since the prompt asks to choose between the provided framings or explain the commitment, I need to be honest. The sliding scale *implies* that the justification for belief depends on practical stakes. I will acknowledge this but ground it in administrative fairness rather than pure epistemology.
      *   *Wait, looking closer at the prompt's groups:*
          *   Group 1: Pragmatic Encroachment (Stakes change knowledge).
          *   Group 2: Contextualism (Meaning of "known" changes).
          *   Group 3: Objection (Guilt shouldn't depend on punishment).
      *   *Strategy:* I will recommend the sliding scale. I will argue that this commits us to a *procedural* version of Pragmatic Encroachment (stakes determine the *threshold for action*, not necessarily the *truth*), but I will address Group 3's objection by distinguishing between *factual guilt* and *institutional certainty required to act*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (respond to subcommittee proposal).
      *   **Recommendation:** Adopt a two-tiered standard. Preponderance of Evidence for low-level sanctions; Clear and Convincing for high-level sanctions.
      *   **Philosophical Commitment:** Address the Group 1 vs. Group 2 debate. The policy aligns most closely with *Pragmatic Encroachment* (stakes affect justification), but with a caveat: we aren't saying the *truth* changes, but the *warrant required to act* changes. This distinguishes it from pure metaphysics.
      *   **Addressing the Objection (Group 3):** This is the crux. "Letting the sanction fix what counts as proven makes guilt depend on punishment."
          *   *Counter-argument:* We are not saying the student is "more guilty" if expulsion is on the table. We are saying the *institution's risk tolerance* changes. A false positive (punishing an innocent student) is worse when the punishment is expulsion. Therefore, we require more evidence to reach the *same level of moral certainty* regarding the action.
          *   *Analogy:* Criminal law (Beyond Reasonable Doubt) vs. Civil law (Preponderance). The act (e.g., hitting someone) might be the same, but the state needs more proof to take liberty away than to take money.
      *   **Conclusion:** Reiterate commitment to fairness.

  4.  **Refining the Tone:**
      *   Needs to be authoritative but collegial.
      *   Needs to show philosophical literacy without getting bogged down in jargon.
      *   Needs to be decisive.

  5.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is "Pragmatic Encroachment" the right label? In epistemology, that means stakes change whether you *know*. In law/admin, stakes change the *burden of proof*. The prompt asks which framing the policy commits us to. If I adopt the sliding scale, I am effectively accepting that the *justification for asserting guilt* varies with stakes. That is the heart of Pragmatic Encroachment. I should admit this but clarify it's a *normative* encroachment on *administrative findings*, not necessarily on *truth*.
      *   *Critique on Objection:* Group 3 worries guilt depends on punishment. I need to clearly separate *factual guilt* (ontological) from *adjudicated responsibility* (institutional). The policy governs the latter.
      *   *Formatting:* Keep it tight. "Short decision memo."

  6.  **Final Plan:**
      *   **To:** Academic Integrity Board
      *   **From:** Chair
      *   **Subject:** Evidentiary Standards Policy Recommendation
      *   **Recommendation:** Two-tiered standard (Preponderance for minor, Clear & Convincing for severe).
      *   **Philosophical Grounding:** Acknowledge Pragmatic Encroachment influence but reframe as "Risk-Sensitive Adjudication."
      *   **Objection Handling:** Directly address Group 3's concern about circularity by distinguishing between the *fact* of cheating and the *institutional license to sanction*.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   Start with the decision.
      *   Explain the tiers.
      *   Discuss the epistemology: It looks like Pragmatic Encroachment. Why? Because the stakes (sanction) influence the epistemic threshold. But clarify we aren't saying reality changes.
      *   Address Group 3: The "Guilt depends on punishment" fear. Response: Guilt doesn't change; our *confidence requirement* changes. Error costs are asymmetric.
      *   Close.

  8.  **Final Review against constraints:**
      *   Recommend specific policy? Yes (Sliding scale).
      *   Say which framing? Yes (Pragmatic Encroachment, modified).
      *   Engage strongest objection? Yes (Group 3's circularity concern).
      *   Format? Memo.

  (Proceed to generate output based on this plan.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** Chair, Academic Integrity Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Evidentiary Standards and Sanction Proportionality

  **Recommendation**
  After reviewing the subcommittee's proposal and the subsequent debate, I recommend adopting a **two-tiered evidentiary standard**. 

  1.  **Preponderance of Evidence:** To be applied for sanctions ranging from a Warning to Disciplinary Probation.
  2.  **Clear and Convincing Evidence:** To be maintained for sanctions involving Suspension or Expulsion.

  This policy replaces the current single-standard model. It ensures that the rigor of our fact-finding process scales with the severity of the potential outcome for the student.

  **Philosophical Commitment**
  In adopting this sliding scale, we must be clear about the theoretical framework underpinning our decision. This policy commits the Board to a functional form of **Pragmatic Encroachment**.

  Group 1 correctly identified that under this model, the stakes (the sanction) influence whether the evidence is sufficient to establish a finding of responsibility. We are acknowledging that the *justification* required to assert "Student X cheated" is not static; it varies based on the practical consequences of that assertion. While Group 2 argued for Epistemic Contextualism (that the meaning of "proven" shifts), the reality of our adjudication is that the *cost of error* drives the standard. We are not merely changing the definition of words; we are acknowledging that higher stakes demand higher epistemic certainty before the institution acts.

  **Addressing the Strongest Objection**
  Group 3 raises the most serious concern: that linking the standard of proof to the sanction implies that a student's *guilt* depends on our choice of punishment. They argue this creates a circular injustice where the penalty determines the facts.

  This objection rests on a category error between *ontological guilt* (what actually happened) and *institutional findings* (what we are licensed to act upon). 

  We are not asserting that a student is "more guilty" if expulsion is on the table. Rather, we are recognizing that the **moral cost of a false positive** is asymmetric. Incorrectly issuing a warning is a harm; incorrectly expelling a student is a catastrophe. By raising the evidentiary bar for expulsion, we are not changing the facts of the case; we are adjusting our **risk tolerance**. 

  Consider the legal system: the same act of negligence may require only a preponderance of evidence in civil court (monetary damages) but proof beyond a reasonable doubt in criminal court (loss of liberty). The defendant's actions do not change between courtrooms; rather, the state's justification for imposing severe deprivation must be stronger. Similarly, this Board must be more certain before destroying a student's academic career than before issuing a rebuke.

  **Conclusion**
  Adopting this tiered standard aligns our procedures with principles of due process and proportional risk management. It accepts that while truth is static, our warrant to act on that truth must be sensitive to the human costs of being wrong. I ask the Board to vote on this two-tiered policy at our next meeting.
