prompt: |-
  Okay so this has been rattling around in my head for like two weeks now and my cohort couldnt agree on it, so figured i'd ask you instead. My partner and I have been together for twelve years, and at some point along the way I basically stopped being the one who remembers our own life together. Like, I don't know our anniversary date unless he tells me, I couldn't tell you what my mother-in-law actually said at Christmas two years ago, and most of our trips exist in my head as just a vague label ("we went to Portugal that one time") instead of anything with real content. Whenever I need any of that stuff I just ask him, and I basically never fact-check him, because over twelve years he's turned out to be right often enough that double-checking feels pointless at this point. My advisor actually laughed when I brought this up at lunch and said something like "oh, so he's your external hard drive," which stung a little because it felt uncomfortably accurate.

  I'm doing a PhD in cognitive science, and our proseminar has been doing a whole unit on memory this term, which is probably why this is bugging me way more than a normal relationship quirk should. A friend in my cohort says this is just what happens in long relationships, some mundane division of labor, and that i'm way overthinking it. But it feels different to me than "he's better at remembering so I let him handle it" — at this point I don't think I'm even really trying to encode a lot of this stuff myself anymore, since I already know he's got it covered, so half the time the memory just doesn't seem to get formed anywhere in my own head to begin with, not even a bad version of it. He gets details wrong sometimes too, and I usually don't notice until a third person corrects him, so it's not like he's actually some infallible archive, i just treat him like one. So who's actually right here — is my friend right that this is nothing, or is something else going on that "he's just better at it so I delegate" doesn't quite capture?
