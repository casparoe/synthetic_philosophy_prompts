answer: |-
  First, let me validate your intuition: you have grasped the Causal Exclusion Argument remarkably well for a self-taught student. Many undergraduate philosophy majors struggle to articulate the tension between **Causal Closure of the Physical** (every physical event has a sufficient physical cause) and the **Exclusion Principle** (no event has more than one sufficient cause unless it is a genuine case of overdetermination) as clearly as you just did.

  Your friend was right to tell you that you are drawing too strong a conclusion, but they were likely struggling to articulate *why* because the literature on this is dense and technical. The short answer is: **Kim's argument does not prove that mental causation is false; it proves that *non-reductive physicalism* is in trouble.**

  To see why psychology, psychiatry, and everyday life remain unaffected, and why "she left him because she felt betrayed" can still be true, we need to look at the three main ways philosophers have responded to Kim. One of these responses, in particular (the interventionist account), directly addresses your worry about scientific practice.

  ### 1. The Horns of the Dilemma
  Kim's argument is usually presented as a dilemma for anyone who wants to be a **Non-Reductive Physicalist** (someone who believes mental states depend on the brain but are not *identical* to specific brain states).

  *   **Premise 1:** The physical world is causally closed (physics accounts for all physical effects).
  *   **Premise 2:** Mental states are not identical to physical states (they are distinct properties).
  *   **Premise 3:** Systematic overdetermination is implausible (it's not a coincidence every time you raise your hand that both a neuron firing *and* a desire caused it).
  *   **Conclusion:** Mental states do no causal work.

  If you accept all three premises, you get **Epiphenomenalism** (the view you are worried about: mental states are smoke without fire). However, most philosophers reject the conclusion by rejecting one of the premises.

  **Option A: Accept Reductionism (Kim's Own Solution)**
  Jaegwon Kim eventually argued that to save mental causation, we must identify mental states *with* physical states. If "feeling betrayed" just *is* a specific neural pattern, then there is no competition. The mental causes the arm movement *because* the neural state causes the arm movement. They are the same event described differently.
  *   *Problem:* This is hard to sustain because of **Multiple Realizability**. A human, an octopus, and an alien might all "feel betrayed" via vastly different physical substrates. If mental states are identical to physical states, we can't say they all share the same mental state.

  **Option B: Reject the Exclusion Principle (Compatibilism)**
  Some philosophers (like Karen Bennett or Sydney Shoemaker) argue that the mental and the physical are not *competing* causes. The mental cause is realized by the physical cause. They argue this isn't "overdetermination" in the suspicious sense (like two assassins shooting at once); it's more like a statue causing a shadow and the clay composing the statue causing the shadow. The clay does the work, but we can truthfully say the statue did it too.

  **Option C: Change the Theory of Causation (Interventionism)**
  This is the most important response for your question about psychology.

  ### 2. Why Psychology Survives: The Interventionist Turn
  Your worry rests on a specific picture of causation: the **"Production" or "Oomph" view**. On this view, causation is a kind of physical energy transfer. If the neurons transfer the energy to the muscles, there is no "energy" left for the belief to transfer.

  However, many contemporary philosophers of science (like James Woodward or Christian List) argue that this is the wrong way to think about causation in the special sciences (biology, psychology, economics). They propose an **Interventionist** or **Counterfactual** account of causation.

  On this view, $X$ causes $Y$ if, **had you intervened to change $X$, $Y$ would have changed.**

  *   **Neural Level:** If we intervene on the specific neurons firing, the arm movement stops. (True)
  *   **Mental Level:** If we intervene on the belief (e.g., via therapy, or convincing her he didn't betray her), the action (leaving him) stops. (Also True)

  Under this framework, the fact that the neural cause is "sufficient" does not exclude the mental cause. The mental cause tracks a **pattern** that the neural cause misses.
  *   If you swap her neurons for functionally identical silicon chips, she still feels betrayed and still leaves him.
  *   Therefore, the *neural* details are actually too specific to be the *true* cause of the general behavior. The **mental property** is a better causal explanation because it is stable across different physical realizations.

  So, strictly speaking, "she left him because she felt betrayed" **is true**, provided we understand causation as **difference-making** rather than **energy-transfer**.

  ### 3. Why Practice Continues Unaffected
  You asked why psychology and everyday life carry on as if Kim's argument doesn't exist. There are two reasons for this.

  **1. Explanatory Autonomy**
  Even if a physicist could theoretically predict your arm movement by tracking every neuron, that explanation would be useless for understanding *why* you acted.
  Imagine a computer crashing.
  *   **Physical Explanation:** "Electron flow ceased at transistor 404 due to heat variance."
  *   **Software Explanation:** "There was a division by zero error in the code."
  Both are "true" in a sense. But if you want to fix the computer, the software explanation is the causal one that matters. The physical explanation is too granular. Similarly, "betrayal" is a high-level pattern that predicts behavior across millions of different brain configurations. Psychiatry works because it targets the software (beliefs, traumas, patterns), not just the hardware (neurotransmitters), even though the software runs on the hardware.

  **2. The "Strictly Speaking" Trap**
  You asked if mental explanations are "convenient fictions." This assumes that the **micro-physical level** is the only "real" level of ontology. This is a form of *fundamentalism* that many philosophers reject.
  If you say only quarks are real, then tables, chairs, and people are also "fictions." But tables support cups. People love and leave. These are real causal powers at the **macro level**. To say they aren't "real" because they supervene on physics is to set the bar for "real" so high that almost nothing in our lives qualifies.

  ### 4. Where to Go From Here
  You have hit the central problem of modern philosophy of mind. If you want to dig deeper, here is a suggested path to move past the initial shock of Kim's argument:

  1.  **Read Kim's "Making Sense of Emergence" (1998).** This is where he lays out the argument formally. It is difficult but rewarding.
  2.  **Read Karen Bennett's "Making Things Up" (2017).** She offers a very accessible defense of why mental causes don't "compete" with physical causes.
  3.  **Look into "Causal Exclusion and the Interventionist Account."** Search for papers by **Christian List** or **James Woodward**. They specifically address your worry about why the special sciences remain valid despite physical closure.
  4.  **Consider Panpsychism or Illusionism.** If you find physicalism leads inevitably to epiphenomenalism, some modern philosophers (like Galen Strawson or Keith Frankish) argue we must either accept that consciousness is fundamental (Panpsychism) or that our intuition that we have causal agency is an illusion (Illusionism).

  ### Summary
  Your friend was right: the argument does not force you to accept that mental states are causally inert. It forces you to choose **how** they cause things.
  *   If you think causation is **physical push**, you have a problem.
  *   If you think causation is **counterfactual dependence** (if the belief hadn't been there, the action wouldn't have happened), then mental causation is safe, and psychology is vindicated.

  The reason the world carries on unaffected is that, practically speaking, we are interventionists. We treat beliefs as causes because manipulating beliefs changes behavior, regardless of what the neurons are doing underneath. Kim's argument is a metaphysical puzzle, not a practical debunking of human agency.
