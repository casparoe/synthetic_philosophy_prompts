answer: |-
  **Setting:** *A quiet bench in a university botanic garden. Autumn leaves are scattered on the path. ELIAS (60s, sharp, wears a cardigan) and SARAH (40s, intense but relaxed) are former colleagues. Elias is the skeptic; Sarah is the defender.*

  **Elias:** You know, I've been thinking about that donation you convinced the department to match last year. The mosquito nets.

  **Sarah:** (Smiling) And? Did the utilitarian calculus finally click for you?

  **Elias:** It clicked, and then it shattered. I spent thirty years studying nonlinear dynamics, Sarah. I know what happens when you perturb a complex system. You tweak an initial condition, and the trajectory diverges exponentially. That's the Lyapunov exponent. In ethics, you call it the "Cluelessness Objection."

  **Sarah:** The worry that we can't predict the long-term consequences of our actions?

  **Elias:** It's worse than not predicting. It's that the uncertainty swamps the signal. We save a child from malaria today. Great. That child grows up, has children, consumes resources, maybe starts a war, maybe cures a disease. The causal ripples go on forever. Since we have zero epistemic access to those long-term effects, how can we possibly claim the *net* utility is positive? The direct benefit is finite. The indirect uncertainty is infinite.

  **Sarah:** It's not infinite, Elias. Causal influence decays.

  **Elias:** Does it? In a chaotic system, small perturbations don't decay; they amplify. That's the butterfly effect. A flap in Brazil causes a tornado in Texas. If I save a life in Malawi, I am flapping a wing. Why should I assume the tornado is benign?

  **Sarah:** Because you're conflating *causal magnitude* with *axiological magnitude*. Just because a small change alters the future significantly doesn't mean it alters the *value* of the future significantly in a way we can't bound.

  **Elias:** But that's the assumption I'm challenging. Why assume the value changes cancel out? The standard defense is, "Well, maybe the ripple effects are good, maybe bad, so we assume a mean of zero and focus on the direct effect." But that's statistically naive. There's no reason to think the distribution of unknown consequences is centered on zero. It could be systematically negative.

  **Sarah:** Systematically negative? Why?

  **Elias:** Think about resource constraints. We are keeping people alive in a system with finite carrying capacity. By preventing death now, we might accelerate a Malthusian collapse later. Or, consider the political economy. Aid can create dependency, shift local power dynamics, entrench corrupt regimes. These aren't random noises; they are structural risks. If the unknown long-term effects have a negative mean, then your "slam-dunk" donation is actually a moral hazard.

  **Sarah:** That's a strong point. If the uncertainty is biased, expected utility theory breaks down. But you're making an assumption too. You're assuming the *status quo* is a stable baseline against which we measure risk. But the status quo is also a trajectory.

  **Elias:** Meaning?

  **Sarah:** Meaning, not buying the nets is also an intervention. If I don't buy the net, a child dies. That also changes history. It traumatizes a family, reduces economic productivity, shifts population demographics. You're treating "doing nothing" as if it's causally inert. It's not. It's just a different perturbation.

  **Elias:** I grant that inaction has consequences. But there's an asymmetry in the *knowledge* of those consequences. The consequence of the child dying is immediate and certain: suffering and loss of agency. The consequences of the child living are diffuse and unknown.
  Here is the crux: When I intervene, I am introducing a *new* variable into the equation. When I don't, I am letting the equation run its current course. If the system is chaotic, introducing a new variable increases the variance of the outcome. If I care about avoiding catastrophic downside risk, and I am clueless about the long term, prudence suggests I shouldn't poke the bear.

  **Sarah:** But "the bear" is already roaring. The child is suffering *now*. You're arguing that we should prioritize the *potential* suffering of future strangers over the *actual* suffering of present persons because we are unsure if saving the present person helps the future strangers.

  **Elias:** I'm arguing that if the future matters—and consequentialism says it matters immensely—then the present is just a drop in the bucket. If the drop poisons the bucket, it doesn't matter how thirsty the person is right now.
  Look, imagine you have a black box. You put a coin in, and it definitely gives you $10 now. But it also might emit a gas that kills 1,000 people in a hundred years. You don't know the probability. Do you put the coin in?

  **Sarah:** In your black box scenario, the mechanism is opaque. But the mosquito net isn't a black box. We know the mechanism. It reduces disease burden. We have strong historical evidence that healthier populations tend to be more stable, more prosperous, and more peaceful.

  **Elias:** "Tend to be." That's an inductive leap based on past data. But we are in a novel regime. Climate change, nuclear proliferation, AI. The phase space of the future is different from the past. Past correlations between health and stability might not hold. You're extrapolating a linear trend onto a nonlinear system. As a physicist, you know that's how you get model failure.

  **Sarah:** (Pauses, picking up a leaf) Okay. Let's grant the model failure risk. Let's grant that we can't predict the long-term historical trajectory. I'm going to shift ground. I'm not going to argue that the long-term effects are positive. I'm going to argue that the *value* of reducing suffering is robust across trajectories.

  **Elias:** Robust how?

  **Sarah:** Almost every plausible theory of value—utilitarian, prioritarian, even many deontological views—agrees that acute, preventable suffering is bad. Whether the child grows up to be a saint or a sinner, the malaria attack itself is a disvalue. It is a local negative utility that is certain.
  The long-term ripple effects are uncertain, yes. But for the donation to be *wrong*, the negative value of those ripples would have to outweigh the certain good of saving the life *plus* the likely good of a healthier community, *plus* the moral value of acting on solidarity.
  You're worried about systematic bias in the unknown effects. I'm suggesting there is a systematic bias in the *known* effects. We know suffering is bad. We don't know if future population shifts are bad. In the face of uncertainty, we should anchor on the robust goods.

  **Elias:** That sounds like "doing the best we can," which is where I thought you'd end up. But it doesn't solve the cluelessness. Suppose saving the child leads to a tyrant who causes a genocide in 40 years. The suffering of the malaria attack is small compared to a genocide. The "robust good" of the moment is swamped by the "fragile bad" of the future.
  Your argument relies on the assumption that the future value distribution is roughly symmetrical or bounded. But in a power-law world—which history looks like—black swan events dominate. One bad actor outweighs a million net distributions. If our intervention increases the variance of the future, and the downside tail is unbounded (extinction, totalitarianism), then maximizing expected value might actually be reckless.

  **Sarah:** That is the "Pascal's Mugging" of long-termism. If we let infinite variance paralyze us, we can never act. But here is the counter-move: The "do nothing" option has the same variance profile.
  If I don't save the child, maybe that child was the one who would have stopped the tyrant. Or maybe the grief of the family radicalizes a community. We are just as clueless about the counterfactual.
  You say intervention adds variance. I say inaction preserves the variance of a trajectory that already includes malaria, poverty, and instability. We have data on the variance of *that* system. It produces suffering. We have less data on the variance of the *intervention* system, but we have priors that health is a stabilizing force.
  To use your physics: We are in a local minimum of suffering. We don't know the topography of the global landscape. But staying in the local minimum of "letting children die of parasites" seems like a bad heuristic for finding the global maximum of well-being.

  **Elias:** (Nods slowly) The local minimum argument is better. But it still assumes the landscape is smooth enough that small steps don't throw us off a cliff.
  Here is where I'll meet you, though. I think the cluelessness objection kills *strong* consequentialism—the idea that we can calculate the *optimal* act. But it might not kill *satisficing* consequentialism.

  **Sarah:** Go on.

  **Elias:** If I can't know the net utility, I can't claim funding the nets is the *best* thing I could do. Maybe investing in AI safety is better. Maybe buying art is better. The uncertainty makes optimization impossible.
  However, if I accept your "robust goods" argument... I can say that saving a life is *good enough*. It clears a threshold of moral acceptability, even if I can't verify it maximizes the good.
  The worry about systematic bias remains, but perhaps it's not a reason to *not act*, but a reason to be humble about claiming our action is *optimal*.

  **Sarah:** I can live with that. We act on the robust, near-term goods because they are the only coordinates we have on the map. We acknowledge the fog of the long term, but we don't let the fog stop us from walking the path in front of us.
  But I want to press you on one thing. You mentioned the "systematic bias" of unknown effects being negative. Is there any evidence for that? Or is it just a fear of complexity?

  **Elias:** (Chuckles) It's a fear of complexity, but a trained one. In control theory, if you don't know the parameters of your system, adding feedback gain often leads to instability before it leads to optimization. We are adding gain to the human system.
  But... I suppose the system is already unstable. And the "gain" of a mosquito net is pretty small. It's not a nuclear reactor. It's a piece of mesh.

  **Sarah:** Exactly. It's a low-magnitude perturbation. The butterfly effect requires sensitive dependence, but it also requires the perturbation to hit the right leverage point. A net is a diffuse intervention. It saves many lives, slightly altering many trajectories, rather than drastically altering one. It diversifies the risk.

  **Elias:** Diversification. Now that's an argument I understand. If you spread the causal impact across thousands of children, the variance of the aggregate outcome might be lower than if you tried to save one specific "important" person.

  **Sarah:** So, the department match stands?

  **Elias:** (Sighs, smiling) The department match stands. But I'm not signing the card that says "Maximizing Global Utility." I'm signing the one that says "Reducing Local Suffering."

  **Sarah:** I'll take it.

  **Elias:** Just don't ask me to donate to the future generations fund. I have no idea what they'll want.

  **Sarah:** (Laughs) One step at a time, Elias. One step at a time.
