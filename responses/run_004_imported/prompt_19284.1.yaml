      *   **The Defender (Sarah):** Needs to go beyond "expected utility." Needs to address the *structure* of the uncertainty. Maybe argue about the *decay* of influence over time, or the *robustness* of certain values, or a distinction between "direct" and "indirect" consequences that isn't just arbitrary.
      *   **Setting:** A quiet university café or a park bench. Let's go with a park bench—fits the retired/reflective vibe.

  3.  **Key Philosophical Arguments to Include:**
