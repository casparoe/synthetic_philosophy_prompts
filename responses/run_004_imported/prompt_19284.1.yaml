      *   **Round 5: Value Stability.** Sarah shifts ground. Even if the future is unpredictable, is *suffering* unpredictable? Reducing acute suffering is a local good that is robust across many futures. Elias concedes this is stronger but worries about "rights violations" in the future to achieve goods.
