answer: |-
  Yes, Nietzsche has principled grounds for this distinction, and your intuition regarding the "economy of forces" in the *Genealogy of Morals* is the correct key to unlocking it. The tension you perceive is one Nietzsche was acutely aware of, and he addresses it not by denying the similarity in *behavior* (abstinence) but by radically distinguishing the *physiology* and *teleology* behind it.

  To write this scene accurately, you must avoid having Nietzsche defend his diet as a moral virtue. If he argues that his restraint is "good," he falls into the trap of the ascetic priest. Instead, he must frame it as a matter of **instinctual necessity** and **strategic conservation**.

  Here is the philosophical breakdown of how he resolves the gap, followed by suggestions for dramatizing it.

  ### 1. The Teleological Distinction: Means vs. Ends
  In the *Genealogy* (Third Essay, §10), Nietzsche analyzes the relationship between philosophers and the ascetic ideal. He concedes that philosophers have historically looked like ascetic priests. They live frugally, avoid sex, and seek silence.

  However, Nietzsche argues that for the philosopher, this is not an end in itself.
  *   **The Ascetic Priest:** Practices self-denial because he believes the body/instincts are sinful or obstacles to salvation. He says "No" to life because he suffers from life. The denial is an expression of *ressentiment* against existence.
  *   **The Free Spirit (Nietzsche):** Practices self-denial because creative/intellectual work is an immense expenditure of energy. He says "No" to specific stimuli (alcohol, heavy food, social noise) so that he can say a louder "Yes" to his task.

  In *Twilight of the Idols* ("Maxims and Arrows," §3), he writes: *"One thing is needful.—To 'give style' to one's character—a great and rare art!"* This styling involves cutting away the weak, the unmanageable, and the draining. It is not mortification; it is **pruning**. A gardener cuts a branch not because he hates the tree, but to ensure the fruit ripens.

  **For the scene:** Nietzsche should not speak of "resisting temptation." He should speak of "avoiding waste." If the guest offers him wine, Nietzsche shouldn't say, "I am too virtuous to drink." He should say, "Wine makes my thinking heavy. I cannot afford the cost."

  ### 2. The "Economy of Forces" (GM III:11)
  You suspected this was the crux, and it is. Nietzsche describes the philosopher's life as a closed economy of energy.
  > *"The philosopher... requires for his problem a kind of intellectual pregnancy... [He] needs to conserve his strength."*

  The ascetic ideal is a strategy for survival used by the *weak* to preserve themselves (by numbing their pain). Nietzsche's regimen is a strategy for potency used by the *strong* to maximize their output.
  *   **Pathological Asceticism:** Drains life to preserve a moral fiction.
  *   **Physiological Discipline:** Conserves life to produce a philosophical reality.

  In *Ecce Homo* ("Why I Am So Wise," §1), he is explicit: *"My formula for greatness in a human being is amor fati... not merely to endure what is necessary, still less to conceal it... but to love it."* His diet is part of loving his fate. He does not *suffer* his restriction; he *enjoys* the clarity it brings. If he feels deprivation, he is doing it wrong.

  **For the scene:** The guest sees a man denying himself pleasure. Nietzsche experiences himself as a man *indulging* in clarity. The pleasure is not in the eating, but in the thinking that the eating permits.

  ### 3. Physiology as Destiny
  In his late period, Nietzsche collapses the spirit/body dualism. He argues that moral judgments are often just symptoms of digestion (*"A theologian's belly is the real objection to his theology"*).

  The Ascetic Priest hates the body and tries to starve the spirit into submission. Nietzsche listens to the body to liberate the spirit. In *Ecce Homo*, he claims his dietary choices are not intellectual decisions but **instinctual reflexes**. He doesn't *choose* water over beer; his instinct recoils from beer as it would from poison.

  This is the critical shield against the charge of asceticism: **Universality vs. Particularity.**
  *   The Ascetic Ideal claims to be true for *everyone* (all must deny the flesh).
  *   Nietzsche's regimen is strictly for *him* (or his "type"). He does not prescribe it as a moral law. He prescribes it as a medical necessity for his specific constitution.

  **For the scene:** Nietzsche must avoid preaching. If he tells the guest what *they* should eat, he becomes a priest. He must explain why *he* must eat this way. It is a confession of weakness regarding alcohol, not a condemnation of it. *"For you, perhaps, beer is a bridge to genius. For me, it is a bridge to nothingness."*

  ### 4. Does this close the gap or relocate it?
  It closes the gap, provided you accept Nietzsche's revaluation of values.
  If "asceticism" is defined by the *act* of denial, Nietzsche is an ascetic.
  But Nietzsche defines "asceticism" by the *motive* of life-denial.
  Since his motive is life-affirmation (specifically, the affirmation of his own creative power), the act is transfigured.

  The risk of "relocating the gap" exists only if Nietzsche claims his way is the *only* way. He avoids this in *Ecce Homo* by framing his wisdom as highly personal. He is not discovering a universal truth about food; he is discovering the conditions of his own existence.

  ### Dramatizing the Scene
  To avoid "potted biography," do not have Nietzsche lecture on the *Genealogy*. Have him embody the distinction.

  **The Setup:**
  The guest (perhaps a well-meaning bourgeois friend or a young admirer) is eating heartily, drinking wine, and enjoying the warmth of the room. Nietzsche is eating sparingly (perhaps just boiled eggs or vegetables) and drinking water. The atmosphere is comfortable, which makes Nietzsche's rigidity look pathological to the guest.

  **The Conflict:**
  The guest expresses concern: "You look pale, Friedrich. You deny yourself every comfort. Is this not the old monkish sickness returning? You taught us to embrace the earth, yet you treat your body like an enemy."

  **Nietzsche's Defense (The "Right" Answer):**
  1.  **Reject the Moral Frame:** He should laugh at the word "deny." To him, the guest is the one denying themselves (denying themselves clarity, health, or future power for present gratification).
  2.  **The Cost of Thought:** He should frame thought as a physical exertion. *"You think thinking is done in the clouds? It is done in the blood. A heavy meal is a heavy thought. I cannot afford heavy thoughts."*
  3.  **Instinct, Not Will:** He must make it clear he isn't using "willpower" to resist the wine. Willpower implies a struggle between two equal desires. For Nietzsche, the desire for the wine is dead; only the desire for the work remains. *"I do not resist the wine. I simply do not want it. To want it would be to want my own dullness."*
  4.  **The Cocoon:** He can use the image of the cocoon (from GM III). He is not hiding from the world; he is gestating. *"The caterpillar does not eat the leaf because it is sinful. It eats only what becomes the butterfly. I am not a priest. I am a caterpillar."* (Or a more Nietzschean metaphor: a pregnant woman avoiding poison).

  **Sample Dialogue Beat:**

  > **Guest:** "But surely, Friedrich, a little wine is a celebration of life? To reject it feels like a rejection of the senses."
  >
  > **Nietzsche:** (Pushing the glass away gently, not with disgust, but with distance) "You confuse the *stimulus* with the *strength*. The ascetic priest rejects the wine because he fears the devil in the grape. I reject it because I fear the fog in the mind. He says 'No' because he is weak. I say 'No' because I am... expensive. My work costs me a tremendous amount of vitality. If I spend it on digestion, I cannot spend it on Zarathustra. Is that self-denial? Or is it economy?"
  >
  > **Guest:** "It looks the same from where I sit."
  >
  > **Nietzsche:** "From where you sit, yes. You see the fast. You do not see the feast. You think I am starving my body. I tell you, I am feeding my future. The priest fasts to die. I fast to live."

  ### Summary for the Novelist
  Nietzsche's defense rests on three pillars you can weave into the subtext:
  1.  **Motivation:** Affirmation (Life) vs. Negation (Anti-Life).
  2.  **Mechanism:** Instinctual Necessity vs. Moral Willpower.
  3.  **Scope:** Personal Physiology vs. Universal Law.

  If he argues from **necessity** rather than **virtue**, he remains consistent with his critique of the Ascetic Ideal. He is not mastering his instincts; he is following his deepest instinct (self-preservation of his mission) over a shallow one (taste). That is the "economy of forces."
