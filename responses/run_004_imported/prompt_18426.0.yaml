      *   *Nietzsche's Regimen (EH/TI):* Defined by strict selection of food, place, and habits. It looks like self-denial (no beer, little meat, early to bed).
      *   *The Key Distinction:* Motivation and Teleology (End Goal).
          *   Ascetic Priest: Denies appetite to *punish* the self or escape the suffering of existence. Goal: Nothingness/Redemption from life.
