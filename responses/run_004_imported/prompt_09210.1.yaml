answer: |-
  **Boston, May 1851. A private room behind the Tremont Temple, following a heated meeting of the American Anti-Slavery Society.**

  **Garrison:** (Pouring water with a shaking hand) You understand what you have done, Frederick? By announcing this shift in *The North Star*, you have not merely changed a tactic. You have legitimized the machinery of our oppression. You tell the colored man he can vote under a Constitution that chains him?

  **Douglass:** I tell him he can fight under a Constitution that does not explicitly name his bondage. William, look at the text. I have read it until the letters burned in my eyes. Nowhere does it say "slavery." Nowhere does it say "slave." It speaks of "persons held to service." It speaks of "people."

  **Garrison:** And you think the world is fooled by euphemism? The framers knew exactly what they were bargaining for. When they wrote the Three-Fifths Clause, they did not mean free men. They meant property. To argue otherwise is to ignore the secret understanding that birthed the Union. It is a covenant with death, Fred. An agreement with hell. You cannot cleanse a garment soaked in blood by arguing about the stitchery.

  **Douglass:** But if the text is clean, why must we wear the guilt of the framers' hearts? You argue from their private intentions; I argue from the public law. If the Constitution says "We the People," then it belongs to all people. If it allows for liberty, then slavery is a state crime, not a federal right. You say the document is pro-slavery because of what men *wanted* it to be. I say it is anti-slavery because of what it *says* it is.

  **Garrison:** (Slamming the cup down) Because words are wind when power is steel! The Fugitive Slave Clause demands we return the escaped brother to the lash. Does the text demand that? Yes. Does your "plain reading" change the marshal's duty? No. By participating in this government, by voting, you swear an oath to uphold those clauses. You make yourself a slavecatcher in the eyes of the law.

  **Douglass:** And by refusing to vote, by demanding disunion, what do you achieve? You leave the government entirely in the hands of the slaveholder. If I stay out of the voting booth because the Constitution is imperfect, the slaveholder walks in alone. I would rather wield a flawed weapon than stand unarmed while the enemy fires.

  **Garrison:** It is not about utility, Frederick. It is about sin. You cannot do evil that good may come. If the Constitution compromises with slavery, it is morally null. There is a Higher Law than parchment. God's law does not count a man as three-fifths of a person. When the text conflicts with conscience, conscience must burn the text.

  **Douglass:** Conscience needs power to protect itself. You speak of Higher Law, but I speak of the ground beneath our feet. If the words "liberty" and "justice" are on the page, I will claim them. I will force the government to live up to its own writing. You want to dissolve the Union to escape slavery's shadow. I want to seize the Union to extinguish the fire.

  **Garrison:** (Softly, weary) You were my son in this cause. We stood together while mobs threw stones at us. Now you tell me the shield we hated is actually a sword?

  **Douglass:** I tell you the shield belongs to us now, William. Not because the framers loved us, but because the words they wrote are bigger than their hearts. They wrote "secure the Blessings of Liberty." I intend to hold them to it.

  **Garrison:** Then God help us both. For if you are wrong, you have tied the cause of freedom to the very engine of its destruction.

  **Douglass:** And if you are wrong, William, you have left the engine running with no one at the brakes.
