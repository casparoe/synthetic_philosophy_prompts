      *   **Sister's Burden:** Emotional/Psychological. High emotional strain (draining). Low logistical strain (flexible schedule).
      *   **Core Dilemma:** How to compare/weigh incommensurable burdens (logistical/financial vs. emotional/psychological) between two people when subjective experience is private ("first-person reports").
      *   **Question:** Is there a legitimate way to weigh these against each other, or are they irreconcilable?

  2.  **Initial Assessment & Empathy:**
      *   This is a classic "apples vs. oranges" fairness problem in caregiving.
      *   Both burdens are real and valid.
      *   The "fairness" trap is dangerous; it can lead to resentment.
      *   There is no objective scale (like a currency) to convert emotional drain into hours of work.
      *   However, saying they are *irreconcilable* is defeatist and unhelpful. There are frameworks to manage this.

  3.  **Deconstruct the "Fairness" Concept:**
