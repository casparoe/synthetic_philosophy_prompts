      *   The goal shouldn't be perfect mathematical equivalence (impossible), but sustainable equity and preserved relationship.
      *   Acknowledge the "Subjectivity Problem": You can't measure the sister's burnout against the user's lost wages directly.

  4.  **Brainstorming Solutions/Frameworks:**
      *   **Reframing:** Move from "splitting the burden" to "maximizing total capacity."
      *   **External Valuation:** Can we put a dollar value on the user's time? Can we put a value on the sister's emotional labor? (Hard to do without resentment).
      *   **Task Specialization:** Play to strengths. User does money/logistics/errands? Sister does hands-on/companionship?
      *   **Third-Party Mediation:** A social worker or therapist might help validate both sides.
      *   **Periodic Review:** Agreements shouldn't be static.
