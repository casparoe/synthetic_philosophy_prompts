answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Voting System Review & Recommendation for Upcoming Season

  **Context**

  As we prepare for Saturday's meeting, I want to address the elephant in the room regarding last year's Best Novel category. We had a result that left a significant portion of our membership dissatisfied: three thematically similar cozy mysteries split the "cozy vote," allowing a polarizing horror novella to win with a plurality (most votes, but not a majority).

  Under our current **Plurality Voting** system (one pick, highest count wins), this is a known failure mode often called the "spoiler effect." The push to adopt **Ranked-Choice Voting (RCV)** is a direct response to this. However, we have hit an impasse. Dave (our Treasurer) has raised a theoretical objection based on social choice theory, arguing that switching systems is merely "theater" because no voting method is immune to strategic manipulation.

  This memo outlines why Dave is technically correct but practically wrong, and why I am recommending we adopt Ranked-Choice Voting for the upcoming cycle.

  **The Mathematical Objection**

  Dave has invoked what is likely the **Gibbard-Satterthwaite Theorem** (sometimes conflated with Arrow's Impossibility Theorem). I want to validate his point before we dismiss it, because he isn't making it up.

  The theorem states that for any voting system with three or more outcomes, there is *always* a scenario where a voter can benefit by voting insincerely (i.e., not ranking their true preference first). In short: **There is no perfect voting system.** Every system can be gamed under specific, contrived conditions.

  If the goal of changing our rules is to create a system that is *mathematically impossible* to game, Dave is right: we should save our time and keep Plurality.

  **Why We Should Switch Anyway**

  However, "no system is perfect" is not the same as "all systems are equally flawed." We are not looking for mathematical perfection; we are looking to prevent a specific, recurring failure that damages the award's reputation.

  1.  **Resistance to *This* Kind of Strategy:** While RCV can be gamed in complex scenarios, it is highly resistant to the specific problem we faced last year: vote-splitting among similar candidates. Under RCV, voters can rank all three cozy mysteries 1, 2, and 3 without fear of wasting their vote. The system aggregates support rather than fracturing it. Plurality *invites* the problem we had; RCV *mitigates* it.
  2.  **Barrier to Entry for Manipulation:** The Gibbard-Satterthwaite theorem proves manipulation is *possible*, not that it is *easy*. To game Plurality, a voter simply needs to bullet-vote (vote for the frontrunner they hate least). To game RCV effectively requires detailed knowledge of how other members are voting to calculate elimination rounds. For a volunteer-run award with 200 voters, RCV raises the complexity of strategic voting high enough that sincere voting remains the dominant strategy for the vast majority.
  3.  **Industry Standard:** The Hugos and the Nebulas both utilize forms of ranked/preferential voting. Our membership is drawn from the same pool. Using a familiar system reduces confusion and increases the perceived legitimacy of our winners.

  **Recommendation**

  I recommend we **adopt Ranked-Choice Voting (Instant Runoff)** for all finalist categories effective immediately.

  We should not let the perfect be the enemy of the good. Dave is right that a magic bullet doesn't exist. But wearing a seatbelt doesn't guarantee you'll survive a crash, yet we still wear them because they drastically improve the odds. Last year, we drove without seatbelts. We crashed. We should buckle up.

  **Next Steps for Saturday**

  1.  **Vote on the Motion:** I will move to amend the bylaws to adopt RCV.
  2.  **Platform:** We need to confirm our voting platform (OpaVote or similar) can handle RCV within our budget. (I've checked; the cost increase is negligible).
  3.  **Communication:** We need to draft a simple "How to Vote" guide for the membership. We cannot assume they know how to rank candidates.

  I know this topic has caused some friction. I appreciate Dave's diligence in ensuring we don't chase mathematical unicorns. But our goal isn't to satisfy a theorem; it's to ensure our winners reflect the consensus of our readers. RCV gets us closer to that than the status quo.

  See you Saturday.
