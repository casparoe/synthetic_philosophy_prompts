answer: |-
  **Rome, 1615. The Private Study of Cardinal Robert Bellarmine.**

  *The room is quiet, smelling of beeswax and old paper. Outside, the city hums, but here the only sound is the settling of embers in the hearth. GALILEO GALILEI stands by the window, looking restless. CARDINAL BELLARMINE sits behind a desk cluttered with folios, his hands folded over a letter.*

  **BELLARMINE**
  You write with a sharp pen, Galileo. Sharper than your telescopes.

  **GALILEO**
  I write with the ink of truth, Eminence. If the ink appears sharp, it is only because the error it cuts through is thick.

  **BELLARMINE**
  Truth. A heavy word. We both serve her, you and I. But you serve her through the book of Nature, written in mathematics. I serve her through the book of Scripture, written in the blood of martyrs. The problem arises when you insist the second book must be rebound to match the first.

  **GALILEO**
  I insist nothing of the sort. I suggest only that we read the second book correctly. If Nature is the handiwork of God, and Scripture is the word of God, they cannot contradict. If an observation is demonstrated, and a passage of Scripture seems to deny it, the error lies in our reading, not in the Creation.

  **BELLARMINE**
  And who determines when a reading is in error? The individual observer?

  **GALILEO**
  Reason determines it. St. Augustine himself warned us. In *The Literal Meaning of Genesis*, he wrote that if a pagan can prove a point about the heavens with "unshakable evidence," we must not cling to a literal interpretation of Scripture lest we make the faith a laughingstock to the world. Augustine knew the Earth is round, though the Psalms speak of the heavens being stretched out like a tent. He understood accommodation.

  **BELLARMINE**
  *(Nods slowly)*
  Augustine is a Doctor of the Church. I do not dispute him. But Augustine spoke of things not central to salvation. The shape of the Earth does not save a soul. Whether the Sun stands still or moves... this touches the narrative of Joshua. It touches the unanimous consent of the Fathers. The Council of Trent is clear: no one is to interpret Scripture contrary to that unanimous consent.

  **GALILEO**
  But the Fathers were not astronomers! They spoke to the common people, in the language of appearance. When a peasant says the sun rises, he speaks truthfully about his experience. If the Psalmist says the Sun moves, he speaks to the peasant, not the philosopher. To demand we believe the Sun orbits the Earth to save the literal wording is to demand we deny our eyes.

  **BELLARMINE**
  To demand we believe the Sun orbits the Earth is to maintain order until you can prove otherwise. And therein lies the rub, Sig. Galileo. You speak of "unshakable evidence." You speak of demonstration.

  **GALILEO**
  I have it. The phases of Venus. The moons of Jupiter. The system of Copernicus is not just a hypothesis to save the phenomena. It is the physical reality.

  **BELLARMINE**
  Is it? You treat the Copernican system as a calculating tool—a hypothesis—and the Church has no quarrel with that. Mathematicians may use it to predict planetary positions. It works well enough for the calendar. But you insist it is *physically* true. That the Earth actually moves. For that, you need more than mathematical consistency. You need physical proof.

  **GALILEO**
  I have told you. The tides. The ebb and flow of the seas is the smoking gun. If the Earth were stationary, the waters would rest. It is the double motion of the Earth—rotation and revolution—that sloshes the oceans against the basins. It is mechanical necessity.

  **BELLARMINE**
  *(Leans forward, picking up a small globe from his desk)*
  You rely heavily on this theory of the tides. You call it your demonstration.

  **GALILEO**
  It is the consequence of the Earth's motion. Without the motion, there is no tide. With the motion, there must be.

  **BELLARMINE**
  Must there?
  *(He rotates the globe slowly)*
  I have spoken to sailors, Galileo. Men who have crossed the Atlantic and the Indian Ocean. They know the tides. They know the Moon.

  **GALILEO**
  *(Waves a hand)*
  Superstition. The Moon is a rock. It has no occult power to pull water. That is magic, not physics.

  **BELLARMINE**
  Perhaps. But the correlation is observed. The tides follow the Moon, not the Sun. If your theory holds—that the tides are caused by the Earth's motion relative to the Sun—then the high tide should occur at the same time each day, dictated by the Earth's position. Yet the tide shifts. It follows the lunar cycle.

  **GALILEO**
  That is a secondary perturbation. The primary cause is the Earth's motion.

  **BELLARMINE**
  Is it? Or is it that you are so eager to prove the Earth moves that you have forced the oceans to comply? You claim your proof is airtight, yet you dismiss the very variable the sailors say governs the sea. If the Earth's motion is the sole engine of the tides, why does the Moon get the credit?

  **GALILEO**
  *(Stiffens)*
  Because the Moon is irrelevant to the mechanics of the vessel! The vessel moves regardless of what watches it from the sky.

  **BELLARMINE**
  Then why does the water keep time with the watcher?
  *(Bellarmine sets the globe down gently.)*
  I am not trying to trap you, Galileo. I am trying to protect you. If you stake your reputation, and the Church's authority, on a "demonstration" that leaks... what happens when a better philosopher finds the hole?

  **GALILEO**
  Then we patch the hole! We do not blind ourselves.

  **BELLARMINE**
  We do not burn the house down to fix a window. If you claim physical truth without absolute demonstration, you force the Church to condemn a proposition that might later be proven true. Do you see the trap? If we say the Earth moves, and you are wrong, we look foolish. If we say the Earth is still, and you are right, we look obstructive.

  **GALILEO**
  Then let us say nothing definitive! Let us allow the question to be debated.

  **BELLARMINE**
  Debate is for universities. Doctrine is for the faithful. You are blurring the line. You want the accommodation of Scripture—you want the holy texts to bend to your mathematics—but you offer only a mathematical hypothesis in return, not a physical certainty.

  **GALILEO**
  It *is* certain. I feel it in my bones.

  **BELLARMINE**
  Feelings are not demonstrations.
  *(Bellarmine sighs, the weight of his office settling on his shoulders.)*
  Here is my counsel, as a man who admires your mind. Treat heliocentrism as a hypothesis. Speak of it as a tool for calculation. Do not assert it as physical truth. Do not wrestle Scripture to make it bow to a theory that... regarding the tides, at least... still limps.

  **GALILEO**
  And if I cannot do that? If I believe that to treat truth as a hypothesis is a sin against the Holy Spirit?

  **BELLARMINE**
  Then you will force my hand. And I do not wish to do what the machinery of the Holy Office will require me to do.
  *(He pauses, looking at Galileo with genuine sadness.)*
  You believe you are defending the truth. I believe I am defending the unity of the Church. Both of us believe we are right. That is the tragedy.

  **GALILEO**
  Truth is not tragic, Eminence. It simply *is*.

  **BELLARMINE**
  Truth without charity is a hammer. Go home, Galileo. Revise the letter. Remove the assertions. Leave the mathematics. Leave the theology to us.

  **GALILEO**
  *(He bows, stiffly)*
  I will pray on it, Eminence.

  **BELLARMINE**
  Pray. But also... calculate. Check the tides again. Watch the Moon. Even a genius must check his instruments.

  *Galileo turns to leave. At the door, he stops, looking back at the Cardinal.*

  **GALILEO**
  The Bible teaches us how to go to Heaven, not how the heavens go.

  **BELLARMINE**
  *(Softly)*
  And if the way to Heaven requires us to believe the heavens are still?

  *Galileo has no answer. He opens the door and steps out into the corridor. Bellarmine remains seated, staring at the globe, his hand resting on the Mediterranean.*
