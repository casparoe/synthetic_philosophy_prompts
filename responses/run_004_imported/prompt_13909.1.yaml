prompt: |-
  I help run the aggregation side of a shoestring internal forecasting project a few of us built at our EA-adjacent org (basically a tiny Metaculus knockoff). We've got a live problem before Friday's report: our best forecaster is at 92% on our trickiest open question, Q17, while everyone else, including our simple model, is sitting around 55%, and she won't move. Last month we ran a retro on every past case where someone was >30 points from consensus and stuck to their number anyway -- across our history, those confident holdouts were right only about half the time, no better than chance, even though most of them (her included) have great track records otherwise. She's seen the retro and agrees it's probably right, but says it hasn't changed how Q17 feels to her at all, so she's now fully holding both 'people who feel this sure about stuff like this are usually wrong' and 'I'm still 92% on Q17,' which feels like an odd place to be in. I got stuck writing Friday's committee memo on how to handle her number (run it raw, fold it into the model's 55%, flag it some other way) and what our standing policy should be going forward -- can you draft it? I want an actual recommendation, not a 'both sides' shrug, but take the case for not discounting her seriously too: if we mechanically haircut everyone who confidently disagrees with the crowd we might be destroying the exact signal that makes a good forecaster worth having, and honestly I'm not sure why the retro gets to be the trusted judge here either -- its just another number somebody crunched.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small internal forecasting project (EA-adjacent, shoestring, Metaculus-like).
      *   **Problem:** Best forecaster (let's call her "Alice") is at 92% on Q17. Consensus/Model is at 55%. She won't move.
      *   **Data:** Historical retro shows confident holdouts (>30 pts from consensus) are right only ~50% of the time (no better than chance), even if they have good overall track records.
      *   **Forecaster's Stance:** Acknowledges the retro data but says her intuition hasn't changed. She holds both "confident holdouts are usually wrong" and "I'm 92% on this."
      *   **Task:** Draft a committee memo for Friday's report.
      *   **Requirements:**
          *   Actual recommendation (no "both sides" shrug).
          *   Take the case for *not* discounting her seriously (preserving signal, questioning the retro's authority).
          *   Address immediate handling of Q17.
          *   Address standing policy going forward.
      *   **Tone:** Professional, analytical, pragmatic, respectful of the forecasting culture (EA-adjacent implies rationality, Bayesian thinking, epistemic humility).

  2.  **Deconstruct the Core Tension:**
      *   *The Outside View (Reference Class):* The retro says "confident dissenters are usually wrong." This is base rate data.
      *   *The Inside View (Specific Case):* Alice is the *best* forecaster. Her intuition is strong. 92% vs 55% is a massive gap.
      *   *The Meta-Problem:* If we discount her, we lose the value of having elite forecasters (who by definition must sometimes disagree with the crowd to add value). If we don't, we ignore base rates that suggest this specific behavior (stubborn dissent) is noise, not signal.
      *   **Key Insight:** The retro data (50% accuracy for holdouts) might be aggregating *all* holdouts, not just *elite* holdouts. If Alice is the best forecaster, her holdouts might perform differently than the average holdout. However, the prompt says "even though most of them (her included) have great track records otherwise." This implies her *holdouts specifically* aren't better than chance, even if her general forecasting is good. This is a crucial distinction. She is good at forecasting, but bad at knowing when to stick her neck out against the crowd.

  3.  **Formulate the Recommendation:**
      *   *Option A: Run it raw (92%).* Risks skewing the aggregate based on a known bias (overconfidence in dissent).
      *   *Option B: Hard override (force to 55%).* Demoralizing, ignores potential unique insight, destroys incentive to think independently.
      *   *Option C: Discounted/Weighted.* Acknowledge her skill but apply a "dissent penalty" based on the retro.
      *   *Option D: Bimodal/Scenario Reporting.* Report the consensus and the "risk case" separately.
      *   *Decision:* The prompt asks for *an* actual recommendation. The most epistemically honest approach that balances the "preserve signal" concern with the "base rate" concern is a **Weighted Aggregation with a Specific Dissent Adjustment**, coupled with a **Narrative Flag**.
      *   *Wait, let's look closer at the "preserve signal" argument.* If we mechanically haircut everyone who disagrees, we kill the value. But the retro says *this specific behavior* (stubborn holdout) has historically been noise.
      *   *Refined Decision:* For Q17, we should **include her forecast but cap its influence on the aggregate** (e.g., treat it as a 70% or weight it lower than usual), while explicitly documenting the divergence in the narrative. For policy, we need a **"Dissent Protocol"** that requires justification beyond "it feels right" when diverging >30 points, without banning the divergence.
      *   *Actually, a stronger stance might be better for a memo.* Let's recommend **including the raw number in the aggregate but flagging it as a "High-Variance Signal"** in the narrative, while instituting a policy that requires *written justification* for future >30pt divergences to improve the retro data quality. Why raw? Because 50% accuracy on holdouts is still *information* if the consensus is wrong. If the consensus is 55% and she's 92%, the truth might be 80%. Averaging to 60% might be worse than 55% if she's right. But the retro says she's likely wrong.
      *   *Let's pivot.* The prompt says "take the case for not discounting her seriously too." The strongest argument for not discounting is that base rates of "holdouts" might not apply to "elite holdouts on specific question types." But the prompt says "her included." Okay, so her holdouts *are* historically unreliable.
      *   *Best Recommendation:* **Do not mechanically discount the number in the aggregation, but do not let it dominate the narrative.** Use a **Geometric Mean** or **Log Odds** aggregation which naturally handles outliers better than arithmetic mean, or simply **report the range**.
      *   *Wait, the user wants a recommendation on "how to handle her number (run it raw, fold it into the model's 55%, flag it some other way)".*
      *   *My Choice:* **Run it raw in the aggregate, but attach a "Confidence Warning" to the final report.** Why? Because mechanically discounting creates a black box that forecasters can't learn from. If we hide her 92%, we lose the ability to score her later and update the retro. If we cap it, we pretend we know more than we do. The retro says 50/50. That means there's still a 50% chance she's the only one who sees something.
      *   *Policy:* **Mandatory "Dissent Memo" for >30pt divergence.** This addresses the "it feels right" issue. It forces the inside view to be articulated, which can be evaluated.

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Executive Summary:** The recommendation (Raw number + Narrative Flag + New Policy).
      *   **Situation:** Q17 divergence (92% vs 55%).
      *   **Analysis:**
          *   The Retro (Base Rate): Holdouts are 50/50.
          *   The Signal: She is our best forecaster. Discarding her risks losing the one edge we have.
          *   The Epistemology: The retro is data, not truth. 50% means uncertainty, not falsehood.
      *   **Recommendation (Q17):** Include 92% in the aggregate. Do not average it down manually. But highlight the divergence in the text.
      *   **Recommendation (Policy):** "Structured Dissent." If you diverge >30pts from consensus/model, you must write 3 sentences on *why* (new info, different model, etc.). This turns "feelings" into data for future retross.
      *   **Rationale:** Balances respect for individual skill with institutional learning. Avoids mechanical suppression of outliers.

  5.  **Refining the Tone:**
      *   Needs to sound like it comes from an EA-adjacent org (rationalist, data-driven, but aware of cognitive biases).
      *   Avoid bureaucratic jargon. Use terms like "outside view," "inside view," "epistemic humility," "signal-to-noise."
      *   Ensure the argument for *not* discounting is robust. (Key point: If we suppress outliers, we guarantee we never catch the black swans that the crowd misses).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is running it raw irresponsible given the retro?
      *   *Counter:* The retro says 50%. That's a coin flip. If we discount her to 55%, we are assuming the retro is 100% predictive. It's not. It's just historical data. Also, if she *is* right this time, and we suppressed her, we look foolish. If she's wrong, the aggregate (which includes the model and others) will likely still be closer to truth than her alone. The aggregate absorbs the error.
      *   *Critique:* Is the policy too burdensome?
      *   *Counter:* It's only for >30pt divergences. That should be rare. It improves the data quality for the next retro.
      *   *Check:* Did I address the "odd place to be in" (holding both beliefs)?
      *   *Add:* Acknowledge this is actually a rational state (knowing the base rate but trusting the specific evidence).

  7.  **Final Polish:** Check against constraints.
      *   Actual recommendation? Yes.
      *   Take case for not discounting seriously? Yes.
      *   Address Q17 and Standing Policy? Yes.
      *   Tone appropriate? Yes.

  8.  *(Final thought on the aggregation method)*: I should recommend a specific aggregation method if possible. Log-odds averaging is standard for forecasting. I'll suggest we stick to our standard aggregation (assuming it's robust) but add the narrative flag. I won't recommend changing the math mid-stream, just how we treat the input. Actually, the prompt asks "run it raw, fold it... flag it". I will recommend **Run Raw + Narrative Flag**.

      *Wait, one nuance:* The prompt says "our simple model... is sitting around 55%". If the aggregate is model + humans, her 92% might pull it up too much.
      *Revised Recommendation:* **Run it raw in the "Human Aggregate," but keep the "Model Forecast" separate in the report.** This allows stakeholders to see the Model (55%) vs. The Humans (pulled higher by her) vs. The Outlier (92%). This preserves the signal without contaminating the baseline.
      *Actually, keep it simpler.* **Include in aggregate, but annotate.** The aggregate *should* move. If she's the best forecaster, her weight should be high. The retro says her *dissent* is noisy.
      *Okay, final decision:* **Include raw, but implement a "Dissent Justification" policy.** The argument is that mechanical discounting is worse than noisy data because it stops learning.

      *Let's strengthen the "Don't Discount" argument:* The retro is a lagging indicator. It tells us about *past* questions. Q17 is the "trickiest" question. Trickier questions might have higher variance where elite intuition *should* diverge. The 50% stat might be an artifact of easy questions where dissent is just noise. On hard questions, dissent might be necessary for accuracy.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Committee
  **FROM:** Aggregation Lead
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Q17 Divergence & Standing Policy for Outlier Forecasts

  ### Executive Summary

  For Friday's report, I recommend we **include Forecaster A's 92% estimate raw in the aggregate**, but explicitly **flag the divergence in the narrative analysis** rather than smoothing it mechanically. 

  Going forward, I propose we adopt a **"Structured Dissent" policy**: any forecast diverging >30 points from the consensus/model requires a brief written justification (new information, alternative model, etc.). This preserves the value of elite intuition while generating higher-quality data for future retros, avoiding the epistemic trap of mechanically suppressing outliers.

  ### Situation: Q17 Divergence

  We face a significant outlier on Q17. Our top-performing forecaster (Forecaster A) holds at 92%, while the consensus and simple model cluster at 55%. Forecaster A acknowledges our historical retro—showing that confident holdouts are right only ~50% of the time—but maintains that her inside view on *this specific question* has not updated.

  This creates a tension between the **Outside View** (historical base rates suggest her confidence is noise) and the **Inside View** (her specific reasoning and track record suggest signal).

  ### Analysis: The Case Against Mechanical Discounting

  While the impulse to haircut Forecaster A's number is understandable, I recommend against it for three reasons:

  1.  **The "Black Swan" Risk:** The primary value of maintaining a human forecasting layer over a simple model is to catch things the model misses. By definition, these moments look like outliers *before* they resolve. If we mechanically regress confident dissenters toward the mean, we guarantee we will never capture the upside of elite intuition. We effectively insure ourselves against being embarrassingly wrong, but cap our ability to be surprisingly right.
  2.  **The Retro is a Lagging Indicator:** The 50% accuracy stat on holdouts is historical data, not a physical law. It aggregates across all question types. Q17 is flagged as our "trickiest" open question. It is plausible that on high-complexity questions, the base rate for "elite dissent" differs from the base rate on standard questions. Treating the retro as a definitive truth rather than a prior introduces its own overconfidence bias.
  3.  **Incentive Compatibility:** If forecasters know that deviating from the consensus triggers an automatic discount, they will sandbag their estimates toward the middle to maintain influence. This degrades the information content of the entire pool. We need forecasters to report their true credences, not what they think the aggregation algorithm will tolerate.

  Forecaster A's position—holding both "holdouts are usually wrong" and "I'm 92% on this"—is not irrational. It is a precise Bayesian update: *My prior on holdouts is low, but my likelihood ratio on this specific evidence is high enough to overcome it.* We should respect that calculation even if we suspect it might be wrong.

  ### Recommendation: Q17 Handling

  **Action:** Run Forecaster A's 92% raw in the aggregate calculation.

  **Mitigation:** In the Friday report, do not present a single number in isolation. Use a **Range + Narrative** format:
  *   **Aggregate Forecast:** [Calculated Number, likely ~65-70%]
  *   **Model Baseline:** 55%
  *   **Analyst Note:** *"Significant divergence on Q17. While the model and consensus sit at 55%, a senior forecaster assesses 92% based on [brief reason if provided]. Historical data suggests confident holdouts are split 50/50 on accuracy; stakeholders should treat the upper bound of this range as high-variance."*

  This approach gives stakeholders the full information set. It allows them to see the consensus pull while acknowledging the specific risk case Forecaster A is raising.

  ### Standing Policy: "Structured Dissent"

  To address the root cause without suppressing signal, we should update our submission protocol effective immediately.

  **Current State:** Forecasters submit numbers; we aggregate; we retro later.
  **Proposed State:** If a forecast diverges >30 points from the current consensus/model, the submission form requires a 2-3 sentence justification tag.

  **Options for the tag:**
  *   *New Information:* (e.g., "Saw a source the model doesn't ingest")
  *   *Model Disagreement:* (e.g., "Believe the base rate class is wrong")
  *   *Intuition/Heuristic:* (e.g., "Pattern match to previous case X")

  **Why this works:**
  1.  **Improves the Retro:** Currently, our retro only knows *that* they disagreed, not *why*. This lets us calculate if "New Information" holdouts perform better than "Intuition" holdouts.
  2.  **Forces Inside/Outside Integration:** It requires the forecaster to explicitly articulate why their inside view overrides the outside view. Often, the act of writing this down causes the forecaster to update toward consensus voluntarily (resolving the issue before aggregation).
  3.  **Preserves Autonomy:** It does not veto the forecast. If Forecaster A writes "Intuition," we still run the 92% raw. We just record that it was intuition-based for future scoring.

  ### Conclusion

  We are building a system to find truth, not to minimize variance. Minimizing variance is the model's job. The humans' job is to find the edges where the model breaks. That will inevitably look like overconfidence sometimes. 

  Let's take the hit on Q17 if she's wrong, because the cost of suppressing her if she's right is much higher. Implement the Structured Dissent policy to ensure we learn from the outcome, whatever it is.

  **Approved?**
  [ ] Yes
  [ ] No
  [ ] Discuss
