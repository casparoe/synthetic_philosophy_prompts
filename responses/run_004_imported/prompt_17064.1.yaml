answer: |-
  This is a classic conflict between **aspirational identity** (what he tells you) and **revealed preference** (what he does).

  The short answer is: **Trust his actions regarding his priorities, but trust his words regarding his identity.**

  Here is the breakdown of why both are "true," why they contradict, and how you should handle it.

  ### 1. The Validity of His Words (The Identity)
  Your friend is likely not lying to you. When he talks about race dates and gear, he is engaging in what psychologists call "identity crafting." He genuinely *wants to be the kind of person* who runs marathons. To him, the goal is real.

  He is also partially right about accountability. Many people cannot achieve hard goals in isolation. We hire coaches, join gyms, or get study buddies because we know our internal discipline is flawed. Needing external structure does not inherently invalidate a goal.

  ### 2. The Validity of Your Observation (The Priority)
  However, actions reveal **cost tolerance**. Everyone wants to be fit, successful, or disciplined, but few want to endure the pain, boredom, and time commitment required to get there.

  *   **The "Relief" Signal:** This is the most critical data point you have. If someone needs a push but is committed to the goal, they usually feel *grateful* or *determined* when pushed. If they feel *relieved* when the pressure is removed, it indicates that the activity is experienced as a net negative.
  *   **The Volume Problem:** You cannot train for a marathon solely on group runs. It requires significant solo volume. If he *never* runs alone, he is not training for a marathon; he is training for "hanging out with you while jogging."

  ### 3. The Distinction: Process vs. Outcome
  The disconnect here is likely that your friend wants the **outcome** (the medal, the title, the health benefit) but dislikes the **process** (the running).

  *   **What he tells you:** "I want to finish a marathon." (True)
  *   **What he does:** "I do not want to run enough to finish a marathon." (Also True)

  These two truths can coexist. He can genuinely desire the finish line while simultaneously lacking the desire to do the work required to cross it. This isn't necessarily malice; it's a common human struggle with delayed gratification.

  ### 4. How You Should Handle It
  You are currently in the role of "Enforcer," and that is a draining position that breeds resentment. Here is how to shift the dynamic:

  **Stop dragging him.**
  If you stop organizing the sessions, one of two things will happen:
  1.  He will find another way to run (proving his words).
  2.  He will stop running (proving your suspicion).

  Both outcomes are healthy for *you*. Right now, you are subsidizing his discipline with your energy. If he needs a push, let him find a running club, a coach, or an app. Make it clear that you are happy to run *with* him as a peer, but you are no longer willing to be his *manager*.

  **Reframe the friendship.**
  Accept that he may value the **social connection** of the run more than the **run** itself. If you enjoy running with him, keep inviting him, but lower your expectations. Treat it as a social hang that happens to involve movement, rather than a training session for a race.

  **The Verdict**
  You asked which to trust more.
  *   Trust his **words** enough to be supportive when he succeeds.
  *   Trust his **actions** enough to know you shouldn't invest your own emotional energy in his success.

  He is telling you who he *wishes* he was. He is showing you who he *is* right now. Believe the behavior, because that is the only thing that will actually get him to the starting line. If the behavior doesn't change, the goal is a fantasy, regardless of how much he talks about gear.
