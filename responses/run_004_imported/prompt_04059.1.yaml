      *   *Alternative:* I could argue for Pragmatics. It preserves the objective nature of counterfactual dependence. The objection is that it makes causation too cheap.
      *   *Decision:* I will advocate for **Strategy (a) Normality** (specifically a default/deviant distinction) as more defensible because it respects the discriminative nature of causal claims, but I will highlight the **Objectivity/Normativity Objection** as the strongest counter. (Actually, looking at recent philosophy, the "Default/Normal" view is the dominant attempt to solve this. I'll stick with that).

