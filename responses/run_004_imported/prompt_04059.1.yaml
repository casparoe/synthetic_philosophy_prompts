answer: |-
  ### 1. The Asymmetry: Why Omissions are Worse for Counterfactual Theories

  The problem of profligate omissions is significantly more severe for counterfactual theories than for process/transference theories because of the **filtering mechanism** available to each.

  **Process/Transference Theories (Production):**
  Theories like those of Wesley Salmon or Phil Dowe define causation in terms of a physical connection: the transmission of a conserved quantity (energy, momentum, charge) along a continuous spatiotemporal process. This provides a robust, mind-independent filter.
  *   **The Filter:** For $C$ to cause $E$, there must be a physical "causal net" connecting them.
  *   **Application to Omissions:** When the gardener fails to water the plant, there is no physical process flowing from the gardener to the plant. There is no transfer of energy. Consequently, a strict process theorist can simply say, "There is no causation here," or treat it as a distinct category of "quasi-causation." More importantly, regarding the Queen: there is definitively no physical process connecting the Queen's inaction to the plant. The physical absence of a link automatically rules out the Queen, the stranger, and the gardener equally as *producers*. The theory doesn't need to distinguish between them; it rejects them all as "production" causes, or handles them via a separate account of prevention.

  **Counterfactual Theories (Dependence):**
  Counterfactual theories (like Lewis's) define causation primarily through dependence: $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
  *   **The Lack of a Filter:** In cases of omission, there is no physical process to act as a constraint. We are left solely with the logic of counterfactual dependence.
  *   **The Logical Explosion:** The counterfactual "If the gardener had watered, the plant would have lived" is true. But so is "If the Queen had watered, the plant would have lived." So is "If a passing stranger had watered..." In the actual world, none of these people watered the plant. In the nearest possible worlds where any one of them *does* water the plant, the plant lives.
  *   **The Result:** Without a physical process to restrict the causal field, counterfactual dependence is ubiquitous. Every agent who *could* have intervened but *didn't* stands in the same relation of counterfactual dependence to the effect. The theory lacks an internal resource to distinguish the gardener (who had a specific role) from the Queen (who did not) because, metaphysically speaking, their "non-actions" look identical: both are simply the absence of an event.

  Thus, the problem is more severe for counterfactualists because they lack the **independent, non-counterfactual criterion** (physical connection) that process theorists use to rule out irrelevant candidates. They must solve the selection problem using only the tools of dependence, which are too coarse-grained to handle the infinite sea of preventers.

  ***

  ### 2. Evaluating the Strategies: Normality vs. Pragmatics

  To solve this, philosophers generally split into two camps:

  **(a) The Normality Strategy (Semantic/Metaphysical):**
  Proponents (e.g., Hart & Honoré, Peter Menzies, Halpern & Hitchcock) argue that we must build a notion of "normality" or "default expectation" into the truth conditions of causation itself.
  *   **The Mechanism:** Causal claims are evaluated against a background of norms (statistical or prescriptive). An omission is a cause only if it represents a **deviation** from the normal or expected course of events.
  *   **The Result:** The gardener's omission is a cause because gardeners *ought* to (or normally do) water plants. The Queen's omission is not a cause because it is normal/expected that Queens do not water strangers' plants. The distinction is made at the level of *truth*; it is literally false that the Queen caused the death.

  **(b) The Pragmatic Strategy (Lewisian Egalitarianism):**
  Proponents (most notably David Lewis) argue that causation is objective and egalitarian, but causal *attribution* is pragmatic.
  *   **The Mechanism:** All counterfactually dependent omissions are genuine causes. The plant died because the gardener didn't water it, *and* because the Queen didn't water it, *and* because the rain didn't come.
  *   **The Result:** The distinction between the gardener and the Queen is not about causation, but about **conversational salience**. We mention the gardener because he is responsible, salient, or easy to fix. We ignore the Queen not because she isn't a cause, but because mentioning her is unhelpful or misleading in context.

  ***

  ### 3. Defense and Objection

  **Which is more defensible?**
  I find **Strategy (a), the Normality Strategy**, more defensible.

  While Strategy (b) preserves a clean, objective metaphysics, it does so at the cost of making the concept of causation detached from its primary function: **explanation and discrimination**. If we accept Lewis's view, we must admit that in a strict metaphysical sense, the Queen is just as much a cause of the plant's death as the gardener. This renders the concept of "cause" almost useless for distinguishing between relevant and irrelevant factors in the world. We use causal language specifically to pick out the *difference-makers* that matter for responsibility, prediction, and intervention. If the theory tells us that everything that didn't prevent the effect is a cause, it fails to capture the discriminative nature of our causal reasoning. By integrating normality into the analysis, Strategy (a) respects the intuition that there is a *factual* difference between the gardener's negligence and the Queen's non-interference, not just a conversational one.

  **The Strongest Objection: The Objectivity Problem**
  The strongest objection facing the Normality Strategy is that it **renders causation mind-dependent or normative**, which contradicts the intuition that causation is an objective feature of the physical world.

  *   **The Objection:** Causal relations should depend on how the world *is*, not on what we *expect* or what duties people *have*. If causation depends on "normality," then causal facts become unstable.
      *   *Statistical Normality:* If 90% of gardeners neglect their plants, does the neglect stop being a cause because it's statistically normal?
      *   *Prescriptive Normality:* If the gardener quits his job tomorrow, he no longer has a duty to water the plant. Does the cause of the plant's future death suddenly shift from the gardener to the neighbor, or vanish entirely, simply because a social norm changed?
  *   **The Implication:** This suggests that causal facts are not discovered but are partly constituted by our social expectations or moral judgments. This "metaphysical queerness" makes it difficult to see how causation can play a role in the hard sciences (physics, chemistry), where norms and duties do not exist. If causation is sensitive to norms, then there is no unified concept of causation linking the social world to the physical world.

  **Conclusion:**
  While the Normality Strategy better captures our discriminative causal practices, it pays a high price: it risks collapsing the distinction between *what caused this* and *who is to blame for this*. The Process theorist avoids this by denying omissions are causes at all; the Counterfactualist must choose between a theory that is too broad (Pragmatics) or a theory that makes causation sensitive to human norms (Normality). I argue the latter is preferable because a theory of causation that cannot distinguish a negligent gardener from a distant monarch fails to explain why we care about causation in the first place.
