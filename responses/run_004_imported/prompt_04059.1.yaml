      *   **Task 2:** Evaluate two main strategies for restricting omissions:
          *   (a) Normative/Statistical Normality (building it into the analysis).
          *   (b) Pragmatics (egalitarian ontology, pragmatic selection).
      *   **Task 3:** Choose which strategy is more defensible and identify the strongest objection against it.

  2.  **Task 1: The Severity of the Problem for Omissions vs. Production:**

      *   *Ordinary Causation (Production):* Process theories (e.g., Salmon, Dowe) rely on physical connections. A billiard ball hits another; energy/momentum transfers. There's a spatiotemporal continuum. This acts as a filter. Only things connected by this process count. The Queen didn't transfer energy to the plant.
      *   *Omission Causation:* There is *no* event, *no* process, *no* transfer. It's the absence of an event. Counterfactual dependence is the *only* tool left.
      *   *The Logic:* If $C$ is "Gardener doesn't water" and $E$ is "Plant dies," $E$ depends on $C$ (if Gardener watered, Plant lives). But $E$ also depends on "Queen doesn't water," "Stranger doesn't water," etc.
      *   *The Asymmetry:* In production, physical constraints limit the candidate causes. In omission, logical counterfactual dependence is ubiquitous. Every non-prevention is a cause. Without a physical process to filter, we rely entirely on the counterfactual relation, which is too broad.
      *   *Key Point:* Process theories have an *independent* criterion (physical connection). Counterfactual theories of omission lack this independent criterion, making the "profligacy" unavoidable without extra machinery.

  3.  **Task 2 & 3: Evaluating Strategies (Normality vs. Pragmatics):**

      *   *Strategy (a) Normative/Statistical Normality:* (e.g., Menzies, Hart & Honoré, McGrath). Only "abnormal" or "norm-violating" omissions count. The gardener had a duty; the Queen did not. Or, gardeners usually water; Queens usually don't.
      *   *Strategy (b) Pragmatics:* (e.g., Lewis). All omissions are ontologically equal causes. The plant died because the gardener didn't water, the Queen didn't water, the rain didn't come, etc. We *talk* about the gardener because of conversational context (salience, responsibility), not because the causal relation is different.
      *   *Decision:* Which is more defensible?
          *   *Pragmatics (Lewisian):* Keeps the metaphysics clean and simple. Causation is objective; explanation is subjective. But it clashes with intuition. We really feel the Queen *isn't* a cause. Saying she is a cause but we ignore her feels like cheating.
          *   *Normality:* Captures intuitions better. Distinguishes the gardener from the Queen at the level of truth conditions. But it makes causation sensitive to norms/expectations, which seems subjective or context-dependent. Is causation really normative?
      *   *Selection:* I need to pick one. The "Normality" view is currently more popular in recent literature (e.g., Halpern & Hitchcock, Menzies) because the Pragmatic view is often seen as too revisionary. However, the Pragmatic view is metaphysically cleaner.
      *   *My Choice:* I will argue that **Strategy (a) Normality** is more defensible *despite* its flaws, because Strategy (b) renders the concept of causation useless for distinguishing explanatory relevance. However, I must acknowledge the strong objection to (a).
      *   *Wait, let's reconsider.* Actually, the Pragmatic view (Lewis) is often criticized for being too error-theoretic about our causal judgments. The Normality view aligns better with how we use causation in law and science. But the "Strongest Objection" to Normality is the "Objectivity Problem" (causation becomes mind-dependent or norm-dependent). The Strongest Objection to Pragmatics is the "Intuition Problem" (it denies what seems true).
      *   *Refining the Choice:* I think the **Normality** approach is more defensible in the context of *explaining* why we pick the gardener. It integrates the selection criteria into the truth conditions.
