          *   *Psychological Insight:* The crowd psychology (before Le Bon) – individuals act differently in aggregates.

      *   **Side B: Rationalized Grudge/Elitism.**
          *   *Context:* Written immediately after *The Corsair* destroyed his reputation.
          *   *Motivation:* Self-protection. If the public is evil/abstract, then *my* suffering isn't personal failure, it's a metaphysical battle.
