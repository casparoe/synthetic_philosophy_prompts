answer: |-
  Here is an adjudication of the exchange, move by move, followed by a synthesis of what remains unresolved.

  ### Move 1: Criterion vs. Procedure
  **Verdict: Felix**

  Felix is on solid ground here. He is invoking the standard distinction between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent decides what to do). This is a foundational move in consequentialist defense (associated with R.M. Hare's two-level utilitarianism or Smart's defense). It is analytically correct that a theory can judge actions by their outcomes without requiring agents to perform explicit utility calculus in real-time. Naomi grants this distinction immediately, acknowledging that Felix has successfully corrected a common caricature of the theory.

  ### Move 2: The Convergence Problem
  **Verdict: Naomi**

  Naomi correctly identifies that Move 1 solves a psychological objection but not a normative one. The demandingness objection isn't primarily about the *stress* of calculating; it's about the *cost* of the actions required. Even if a consequentialist cultivates habits rather than calculating every move, those habits must still be calibrated to produce the best outcomes. If the best outcome requires giving away 50% of your income, a "habit-based" consequentialist must cultivate the habit of giving away 50%. Felix's distinction explains why the agent might not feel exhausted, but it doesn't explain why the sacrifice itself isn't required. Naomi wins this point because she shows the objection survives the shift from calculation to cultivation.

  ### Move 3: The Fair Share / Full Compliance View
  **Verdict: Naomi**

  Felix attempts to rescue the theory by importing a fairness constraint (often called the "Compliance Condition," associated with Liam Murphy). He argues that one's obligation is limited to the share one would bear in a fully compliant world. While this is intuitively appealing and protects agents from being exploited by non-compliers, it creates a tension with the core consequentialist commitment: maximizing *actual* good. Naomi's pushback is stronger here because Felix's move effectively modifies the theory to save it. If the goal is to maximize welfare, the fact that others are shirking doesn't change the fact that the person in front of you needs help. By prioritizing hypothetical fairness over actual impact, Felix is arguably stepping outside of pure consequentialism. Naomi wins because she exposes that this move sacrifices the theory's defining feature (responsiveness to actual consequences) to solve the demandingness problem.

  ### Move 4: The Rescue Principle
  **Verdict: Naomi**

  Naomi solidifies her victory in Move 3 by appealing to the "rescue principle." She points out that tying obligations to hypothetical compliance leads to counterintuitive results in emergency scenarios (e.g., walking past a drowning child because others aren't helping). This is the classic reductio against the Fair Share view from a consequentialist perspective. Felix has no easy reply here without admitting that his version of consequentialism allows preventable harm to persist for the sake of fairness. Since the debate is about the demandingness objection *to consequentialism*, Naomi successfully demonstrates that Felix's solution dilutes the theory to the point where it may no longer qualify as the view under discussion.

  ***

  ### What They Are Missing
  Both Felix and Naomi are trapped in a debate over **ideal normative theory** while ignoring the **empirical and epistemic inputs** that actually drive modern effective altruist reasoning. They are arguing as if we know with certainty that extreme sacrifice *always* produces more utility than a sustainable, balanced life. They miss the possibility that the "demandingness" is an artifact of bad modeling: if burning out reduces your long-term capacity to do good, or if radical sacrifice signals instability that reduces movement growth, then self-care isn't a concession to non-consequentialist morality—it's an instrumental requirement of consequentialism itself. They are fighting over how much the agent must *lose*, without rigorously establishing that the loss is actually *gainful* in the long run.
