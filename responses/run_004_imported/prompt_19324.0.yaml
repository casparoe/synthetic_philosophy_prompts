answer: |-
  Yes, there is a real, principled way to distinguish these two issues. Your friend is logically correct about *compliance*, but they are missing the point about *culture and leadership*.

  You are dealing with two separate layers here:
  1.  **The Compliance Layer:** Did you violate a stated policy? (Yes.)
  2.  **The Cultural Layer:** How are policies enforced, who is exempt, and what does that signal about psychological safety? (This is where the Director has a problem.)

  Your friend is focusing entirely on Layer 1. You are intuitively sensing a problem in Layer 2. Both are real, but Layer 2 is actually more important for your long-term happiness and the health of the team.

  Here is how to think through the distinction, analyze the Director's logic, and handle the 1:1.

  ### 1. The Principled Distinction: Compliance vs. Credibility

  Your friend's argument ("two wrongs don't make a right") applies to **moral culpability**. If you speed and get a ticket, pointing out that the police officer speeds too doesn't invalidate your ticket. In a vacuum, you did agree to a process and you bypassed it.

  However, the Director's behavior isn't just about "another wrong." It is about **leadership credibility**. In organizational psychology, there is a concept called "shadow culture." The written rules are the official culture; what leaders *actually do* is the shadow culture. Employees always follow the shadow culture over the written one.

  *   **Your Action:** You broke a safety rule intended to prevent outages. You owned it immediately.
  *   **His Action:** He breaks the same safety rule regularly, claims exemption based on rank, and then uses your infraction to lecture the team on accountability.

  The distinction is this: **You broke a rule; he broke trust.**

  When a leader exempts themselves from safety protocols (like code review) that they enforce on others, it signals that the protocol is not actually about safety—it's about control. It tells the team: *"This process is for people I don't trust, not for people who know what they're doing."* That undermines the very rationale for the rule (preventing outages).

  ### 2. Analyzing the Director's Justification

  The Director told you: *"As director I'm ultimately accountable... so the rule was never really meant to apply to him in the same sense."*

  This is a category error.
  *   **Accountability is retrospective:** It means who gets fired or blamed when things go wrong.
  *   **Process is preventative:** It means what steps we take to ensure things *don't* go wrong.

  Being "ultimately accountable" does not make you immune to typos, logic errors, or fatigue. In fact, because his changes carry more weight (often infrastructure or high-level config), the risk of his unreviewed code might be *higher* than your one-line hotfix. By bypassing review, he is increasing the risk of the very outages the rule was designed to prevent.

  His argument essentially says, "I am the boss, so I am the only one allowed to decide when safety is optional." That is not a principled distinction; it is a privilege claim.

  ### 3. The Issue of the Retro

  Even if you were 100% in the wrong on the merge, the way he handled it in the retro was poor leadership.
  *   **Public Shaming:** Even if he didn't use your name, if everyone knew it was you, it was a public shaming. Retros should be blameless environments for process improvement, not tribunals for policy violations.
  *   **The "Gotcha":** Spending five minutes lecturing on accountability immediately after exempting himself from that same accountability creates resentment, not alignment.

  ### 4. Strategy for the 1:1

  You should raise this, but **do not frame it as "You're a hypocrite."** If you lead with accusation, he will become defensive, and the conversation will become about his ego rather than team culture.

  Instead, frame it as **seeking clarity on risk and process integrity.** You want to understand how to navigate the system he leads.

  **Goal of the conversation:**
  1.  Re-establish trust (show you take the rule seriously).
  2.  Surface the double standard without attacking his character.
  3.  Advocate for a culture where safety processes apply to everyone (including him).

  **Suggested Script/Approach:**

  **Step 1: Own your part (Disarm the defense)**
  > "I've been thinking about the retro and my Friday merge. I want to reiterate that I know I bypassed the process. I understand why that rule exists, and in the future, I will wait for the sign-off or escalate differently if it's urgent. I don't want to be the person who undermines our stability."

  **Step 2: Address the impact of the Retro (Set boundaries)**
  > "I also wanted to share some feedback on how the incident was discussed in the retro. While I understand the need to reinforce the process, being singled out—even anonymously—felt like a public reprimand. It made me hesitant to be transparent about mistakes in the future. I think we get better outcomes if we treat slip-ups as coaching moments rather than examples of 'lack of accountability.'"

  **Step 3: Raise the Process Consistency (The "Principled" Argument)**
  > "This brings me to something I've been struggling to reconcile. When I mentioned the merge to you, you mentioned that the review rule applies differently to you because of your accountability level.
  >
  > "I want to understand the philosophy there better. From my perspective, code review isn't about trust in the person; it's about catching human error regardless of rank. If the goal is preventing weekend outages, does it make sense for *anyone* to bypass review? I worry that if the team sees leadership bypassing safety checks, they'll view the checks as bureaucratic hurdles rather than risk mitigation. How do we align on that?"

  ### Why this approach works:
  *   **It's not "You do it too."** It's "How does your action align with our stated goal of safety?"
  *   **It focuses on the Team.** You aren't defending yourself; you are defending the *integrity of the process* for the rest of the engineers.
  *   **It tests his leadership.** If he is a good leader, he will reflect on this and admit that perhaps he shouldn't be bypassing review either. If he doubles down on "I'm the boss, rules are for you," you have learned something very important about your long-term future at this company.

  ### Summary
  Your friend is right that you broke the rule. But you are right that the Director's behavior is a separate, significant issue.
  *   **Your mistake:** Operational (bypassing a guardrail).
  *   **His mistake:** Cultural (eroding trust and psychological safety).

  You can admit the first without accepting the second. In your 1:1, own the operational error, but push back gently on the cultural precedent. If he cannot see the difference between "accountability for outcomes" and "adherence to safety process," you are likely to run into this wall again.
