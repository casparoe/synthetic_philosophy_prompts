answer: |-
  This is a fantastic scene idea. The anecdote about Gongsun Long and the border guard is indeed apocryphal (it appears in later commentaries and anecdotal collections like the *Liezi*, likely to mock the School of Names), but it is perfect for fiction because it dramatizes the clash between abstract philosophy and concrete state power.

  You have spotted the exact logical hinge that makes the argument work (and where it breaks). Here is the breakdown of the logic, the equivocation, and how your guard can counter it without sounding like a brute.

  ### 1. Is the "Asking for a Horse" argument doing logical work?

  **Yes, but it relies on a specific definition of "is."**

  Your intuition about **Intension vs. Extension** is spot on.
  *   **Intension:** The definition of a concept. (The intension of "White Horse" is *Horse-ness + White-ness*. The intension of "Horse" is just *Horse-ness*.)
  *   **Extension:** The set of objects the concept applies to. (The extension of "Horse" includes white, black, yellow horses. The extension of "White Horse" includes only white ones.)

  Gongsun Long's argument in the second half is essentially this:
  1.  If Concept A is identical to Concept B, they must be interchangeable in all contexts.
  2.  If I ask for a "horse," a yellow horse satisfies the request.
  3.  If I ask for a "white horse," a yellow horse does *not* satisfy the request.
  4.  Therefore, the contexts are different.
  5.  Therefore, Concept A ("White Horse") is not identical to Concept B ("Horse").

  **Where the Equivocation Happens:**
  He is equivocating on the word "is" (or in Chinese, *fei* 非，"is not").
  *   **Common Sense "Is":** Class inclusion ($A \subset B$). "A white horse *is a* horse." (A member of the set).
  *   **Gongsun Long's "Is":** Strict Identity ($A = B$). "The concept 'white horse' is identical to the concept 'horse'."

  Gongsun Long knows that a white horse is physically a horse. He is arguing about **Names (Ming 名)**. He is claiming that the *Name* "White Horse" is not the *Name* "Horse." Because the names have different definitions and different extensions, they are not the same thing.

  ### 2. The Mohist Counter-Attack

  You remembered correctly. The later Mohists (who were obsessed with logic and utility) attacked the School of Names specifically on this point. Their stance was **Realism/Pragmatism**. They believed names must correspond to realities (*Shi* 實).

  The Mohist Canon says: *"Riding a white horse is riding a horse."* (Cheng baima, cheng ma ye 乘白馬，乘馬也).

  **Does this finish him off?**
  *   **Philosophically:** It forces Gongsun Long into a corner where he has to argue that "Riding a white horse" is a totally different action than "Riding a horse," which becomes absurd.
  *   **Practically:** Yes, it destroys the argument for the purpose of a border crossing.

  **Why the Mohist argument works:**
  It shifts the ground from **Semantics** (what words mean) to **Action/Consequence** (what happens when you use the thing).
  *   Gongsun Long: "The *name* is different."
  *   Mohist: "But the *act* is the same."

  ### 3. How to Write the Guard's Counter

  The guard shouldn't try to out-philosophize Gongsun Long on metaphysics. He should use the Mohist pragmatic angle to highlight the **purpose of the law**.

  The law banning horses isn't about linguistics; it's about military resources. A white horse pulls a chariot just as well as a black horse.

  **The Pressure Points for the Guard:**
  1.  **The Purpose of the Ban:** "The law bans horses to stop war chariots, not to sort colors."
  2.  **The Consequence:** "If I let you pass, have I not let a horse pass?"
  3.  **The Authority:** "My job is to enforce the King's will, not analyze his grammar."

  ### 4. Scene Drafting Suggestions

  Here is a way to stage the dialogue so the logic lands clearly, moving from Gongsun Long's abstract victory to the Guard's concrete victory.

  **Gongsun Long:** "If the Lord of the Pass seeks a 'horse,' a yellow or black one will suffice. If he seeks a 'white horse,' they will not. Since the requirement differs, the thing required must differ. Therefore, a white horse is not a horse. Your ban applies to 'horses.' This is a 'white horse.' The ban does not apply."

  **Guard:** (Silence. He looks at the horse. He looks at his spear.) "Scholar, if I shoot this animal with an arrow, will it die?"

  **Gongsun Long:** "Presumably."

  **Guard:** "If I shoot a black horse, will it die?"

  **Gongsun Long:** "Yes."

  **Guard:** "If I ride this animal into battle, can I strike an enemy?"

  **Gongsun Long:** "You can."

  **Guard:** "If I ride a black horse, can I strike an enemy?"

  **Gongsun Long:** "You can."

  **Guard:** "Then for the purpose of the arrow, and for the purpose of the battle, and for the purpose of the King's law... the difference is in your mouth, not in the animal. You say it is not a horse. I say if it bleeds like a horse and fights like a horse, it dies like a horse. Do you want to test if the law's arrow distinguishes colors?"

  ### 5. One Nuance for Your Character

  If you want Gongsun Long to remain dignified (rather than just being shut down), have him concede the practical point while holding the philosophical one. This is historically consistent with the School of Names; they often cared more about being logically "correct" than practically useful.

  **Gongsun Long's Retort:**
  "You speak of utility, Guard. I speak of Truth. You may stop the animal, for you hold the spear. But you cannot stop the logic. You may detain a 'white horse,' but you cannot detain a 'horse,' for I have proven I do not possess one."

  This leaves the tension unresolved: The Guard has the physical power, but Gongsun Long believes he has won the intellectual battle. It captures the tragedy of the School of Names—they were brilliant, but ultimately sidelined because they prioritized linguistic precision over social order.

  ### Summary for your notes:
  *   **The Logic:** It distinguishes **Concept Identity** ($A = B$) from **Class Inclusion** ($A \subset B$). It is valid semantics, but invalid ontology.
  *   **The Equivocation:** Using "is" to mean "is identical to" rather than "is a member of."
  *   **The Counter:** The Mohist "Riding a white horse is riding a horse." Focus on **function** over **definition**.
  *   **The Vibe:** Abstract Logic vs. Concrete Power.

  This gives your guard a sharp, philosophical rebuttal that doesn't require him to be a scholar, just a man who understands how the world actually works.
