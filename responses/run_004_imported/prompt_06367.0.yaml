      *   *Key Mohist Point:* "Jian" (Universal/Whole) vs. "Ti" (Part/Specific). A white horse is a subset of horses. To deny this is to confuse names with realities.
      *   *The "Riding" Argument:* If you ride a white horse, have you ridden a horse? Yes. Therefore, functionally, a white horse is a horse.
      *   *Does it finish him off?* In practical terms, yes. In Gongsun Long's metaphysical terms, he would say "Riding a white horse" is a specific act distinct from the general act of "Riding a horse," but this gets messy. The Mohist objection is generally considered the "common sense" refutation that grounds language in utility.

