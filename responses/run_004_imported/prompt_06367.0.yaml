      *   *Source:* The *Gongsun Longzi* text, specifically the "White Horse Discourse" (Baima Lun).
      *   *Core Claim:* "White horse is not horse" (Baima fei ma).
      *   *Argument 1 (Metaphysical/Semantic):* "Horse" names the shape/form. "White" names the color. "White horse" names shape + color. Therefore, the concept "white horse" $\neq$ the concept "horse."
      *   *Argument 2 (Pragmatic/Extension):* If you ask for a "horse," yellow/black work. If you ask for a "white horse," yellow/black don't work. Therefore, the set of things satisfying "white horse" is not identical to the set of things satisfying "horse."
      *   *User's Question:* Is Argument 2 valid? Is it equivocation?
      *   *Analysis:* It hinges on the meaning of "is" (fei). In classical Chinese, *fei* means "is not" but often functions like "is not equivalent to" or "is not the same category as."
      *   *Modern Logic Translation:*
          *   Gongsun Long treats "White Horse" as a compound concept ($W + H$) and "Horse" as a simple concept ($H$). Since $W + H \neq H$, the *terms* are not identical.
          *   The "asking" argument highlights *intension* (definition) vs. *extension* (set of referents).
          *   Gongsun Long argues: If $A = B$, then any request for $A$ is satisfied by $B$. Request for "Horse" $\neq$ Request for "White Horse". Therefore "White Horse" $\neq$ "Horse".
          *   *The Trick:* He is arguing about the *concept* (the name), not the *object*. A white horse *is* a horse ontologically, but the *name* "white horse" is not the *name* "horse."
      *   *Verdict:* It is a mix of semantic precision and ontological separation. It *is* equivocation on the copula "is" (identity vs. class inclusion), but it's a sophisticated equivocation designed to highlight the gap between language and reality.

