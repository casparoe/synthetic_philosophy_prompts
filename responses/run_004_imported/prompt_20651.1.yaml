          *   *Verdict:* Hard to defend ethically given the user's philosophical background and the specific complaint about borderline cases.
      *   *Option 2: Adopt a Discretionary Band (1.80–2.00).*
          *   *Pros:* Allows for context, mitigates the "cliff edge" effect, acknowledges that GPA isn't a perfect measure of potential.
