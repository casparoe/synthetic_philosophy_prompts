answer: |-
  Thank you. And thank you, Dr. Aris and Dr. Chen, for those beautiful summaries of her work. Hearing the science laid out like that… it reminds me of the walks we used to take.

  I'm the grandchild. I'm still in high school. And for most of those walks, my grandmother wasn't telling me about her day. She was telling me why everyone else was wrong.

  Specifically, she was telling me why people shouldn't talk about DNA like it's a language. She hated the idea that our bodies are just reading a script. She hated words like "blueprint," "program," or "instructions." To her, those words made life sound like a puppet show, where the strings are pulled by molecules written down before we even start. She used to joke that if anyone said she'd "live on in the code of her grandchildren," she would come back just to argue about it.

  So, standing here, I know I have to be careful. I know half this room is waiting to see if I slip up and use the words she spent forty years fighting. And I know the other half of this room—my family—might be wondering why it matters so much.

  Here is why it mattered to her, and why it matters to me, especially today.

  If you think of a person as a blueprint, then when they die, the plan is filed away. It becomes static. A record. But my grandmother didn't see life that way. She saw it as chemistry. She saw it as action. To her, DNA wasn't a boss giving orders; it was a tool in a toolbox, waiting for a hand to pick it up. And the "hand" is everything else: the environment, the cell, the food we eat, the air we breathe, the questions we ask.

  So, if I stand here and say, "She lives on in my genes," I would be telling a lie she taught me to spot. Because that suggests she is a fixed thing inside me, waiting to unfold no matter what. That isn't what she believed.

  But that doesn't mean she isn't here. It just means she is here in a more complicated, and honestly, more beautiful way.

  She isn't in a script. She is in the machinery.

  She is in the way I look at a problem and ask, "What is actually happening here?" instead of "What am I supposed to do?" She is in the habit of checking the context. She is in the understanding that who we are isn't written in stone; it is built, moment by moment, by how we interact with the world around us.

  To my family: I know we want to feel close to her. We want to know what part of her we kept. The comforting truth—the *real* truth—isn't that we are carrying her ghost in our cells. It's that we are carrying her methods. We are carrying the environment she helped build.

  When I get curious, that's her. When I refuse to accept a simple answer for a complex question, that's her. When I look at a living thing and see a dynamic process instead of a finished object, that's her. She didn't leave us a map. She left us a compass, and she taught us how to hold it.

  To her colleagues: I promise to watch my language. I won't call it a code.

  But to everyone: Please don't think of her as a blueprint that's been rolled up and put away. Think of her as a reaction that started a chain of other reactions. Think of her as the conditions that allow something new to grow.

  She taught me that we are not pre-written. We are made. And because we are made, we have a say in the making. That was her fight. That was her life. And as long as we keep asking how the machinery works, and who is holding the tools, she is still here, doing the work.

  Thank you.
