answer: |-
  The Frege-Geach problem is not merely a technical glitch in metaethical semantics; it is the expressivist's existential crisis. If you cannot explain why moral arguments are valid without smuggling in truth-conditions, you have not explained moral reasoning; you have merely explained moral noise. After weighing the classic quasi-realist attempts against the contemporary analytic refinements, the verdict is clear: Simon Blackburn and Allan Gibbard offer compelling psychological pictures but fail the logical rigor required to solve the problem on expressivism's own terms. Mark Schroeder's "Being For" account provides the only working technical solution, but it succeeds only by mutating expressivism from a theory of emotion into a theory of rational consistency. This mutation is necessary, and it proves your roommate wrong: these semantic distinctions determine whether moral disagreement is a rational endeavor or merely a clash of tastes.

  To see why the classic solutions fail, look at Blackburn's project in *Spreading the Word*. Blackburn attempts to construct a "logic of attitudes." He argues that when we assert a conditional like "If stealing is wrong, then getting your brother to steal is wrong," we are not stating a fact but expressing a higher-order attitude: a commitment to disapproving of getting your brother to steal whenever we disapprove of stealing. Gibbard refines this in *Wise Choices, Apt Feelings* by shifting from attitudes to plans. To judge something wrong is to accept a norm that forbids it. Validity is preserved because inconsistent moral judgments reflect inconsistent plans.

  The fatal flaw here is what Schroeder calls the "negation problem." Blackburn and Gibbard can explain why holding two positive moral beliefs might be inconsistent (Type A inconsistency). But they struggle to explain the difference between "not accepting a norm" and "accepting the negation of a norm" (Type B inconsistency). If I say "It is not the case that stealing is wrong," Blackburn says I am not expressing disapproval. But if I say "Stealing is not wrong," I am expressing a conflicting attitude. The logic of attitudes struggles to distinguish these without covertly appealing to the truth-conditions of the propositions they are trying to avoid. When pressed, the quasi-realist explanation of validity starts to look like a relabeling exercise: they define "logical inconsistency" as "psychological inconsistency," but without explaining why the psychological state has the same structural constraints as logical negation. It feels like saying "logic works because our brains are wired to follow logic," which begs the question.

  Schroeder's *Being For* solves this by generalizing the expressive state. He argues that moral judgments express a specific, generic relation: "being for." To believe stealing is wrong is to be for blaming for stealing. This allows him to map logical operators directly onto attitudes. Negation becomes "not being for," and conditionals become complex relations of "being for." Because "being for" is a single type of mental state with a specific consistency condition, Schroeder can distinguish between conflicting attitudes and merely absent attitudes without smuggling in truth-conditions. Technically, this works. It validates modus ponens in moral contexts without requiring moral facts to exist in the world.

  However, this success comes at a cost. To make the logic work, Schroeder has to abstract away from the specific psychological phenomenology that made early expressivism attractive (emotions, boo/hurrah). The view mutates into a structural account of rationality. Is this still expressivism? Yes, but barely. It remains expressivist because it denies that moral judgments are true in virtue of corresponding to mind-independent properties. But it concedes that moral judgments function *exactly as if* they were truth-apt descriptions of normative relations. The mutation is real: expressivism survives only by becoming a cognitivism about rational requirements rather than a non-cognitivism about moral facts.

  This is where your roommate's objection collapses. She claims this is a semantic word-game with no stakes for actual ethics. She is wrong because the Frege-Geach problem determines whether moral argument is possible at all. If Blackburn and Gibbard fail, then when you argue with a racist, you are not pointing out a logical error in their worldview; you are merely trying to causally manipulate their emotions like training a dog. There is no rational pressure to change their mind, only force. If Schroeder succeeds, then moral disagreement involves a failure of rational consistency. The racist is not just feeling differently; they are violating the structural norms of reasoning itself.

  Therefore, the verdict is this: Expressivism survives the Frege-Geach problem, but only by accepting Schroeder's mutation. It is no longer a theory about how we feel; it is a theory about how we plan and reason. This is not a defeat; it is a maturation. The semantic stakes are high because they secure the possibility of moral reasoning without requiring a spooky moral reality. If expressivism cannot solve Frege-Geach, ethics collapses into rhetoric. Since Schroeder shows it can be solved, ethics remains a domain of rational inquiry, even if the "facts" we discuss are ultimately reflections of our own normative planning. You can push back on whether "being for" is truly non-cognitive, but you cannot deny that without this solution, moral argument loses its normative force.
