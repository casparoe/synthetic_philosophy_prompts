answer: |-
  Your intuition is spot on: **Your teammate is wrong.**

  This is a fascinating question that sits right at the intersection of psychology and philosophy. What you are experiencing is a well-documented disconnect between **knowledge retrieval** (accessing the fact) and **metacognition** (knowing that you know the fact).

  Here is the breakdown of why your teammate's argument fails, why your experience is real, and what is actually happening in your brain during Quiz Bowl.

  ### 1. The Psychology: Metacognition is Imperfect
  Your teammate is assuming that "knowing" and "the feeling of knowing" are the same thing. In cognitive psychology, they are not.

  *   **Retrieval:** This is the mechanical process of your brain accessing a stored memory.
  *   **Metacognitive Monitoring:** This is your brain's *assessment* of how likely that retrieval is to be correct.

  Research shows that metacognitive monitoring is fallible. It is a heuristic (a mental shortcut), not a perfect gauge. Under high-pressure situations like Quiz Bowl, your stress hormones (cortisol/adrenaline) can dampen the *signal* of confidence even if the *data* is successfully retrieved.

  **The "Realization" Proof:**
  The strongest evidence against your teammate is your own description: *"get it right and realize afterward that I actually did know it the whole time."*
  If it were pure luck (a random guess), you would not recognize the answer as familiar the moment it was read out. You would think, "Wow, I can't believe I guessed that." Instead, you feel, "Oh, right, that was in my head." That post-hoc recognition proves the neural pathway existed *before* you buzzed; the "confidence signal" just failed to fire in time.

  ### 2. The Philosophy: Internalism vs. Externalism
  Your teammate is arguing for a philosophical position called **Internalism**. This is the idea that to truly "know" something, you must have internal, conscious access to the justification for that belief. In his view: Knowledge = Truth + Belief + *Awareness of Justification.*

  However, most modern epistemologists (philosophers who study knowledge) lean toward **Externalism** or **Reliabilism**.
  *   **Reliabilism** argues that you know something if your belief is produced by a reliable cognitive process, regardless of whether you are consciously aware of that process.
  *   **Example:** You know how to catch a ball. If someone asks you the exact physics equations your brain is calculating to move your hand, you can't tell them. You don't "feel" the math. But you *know* where the ball will land.

  In Quiz Bowl, your brain is pattern-matching clues to stored facts. This is a reliable process. Even if your conscious mind hasn't caught up to say "I am sure," your subconscious has already done the work. Therefore, you *knew* it.

  ### 3. The "False Confidence" Trap (Case C)
  You mentioned a third scenario that disproves your teammate's theory even further: *"times I felt 100% sure and still got it wrong."*

  If "feeling sure" was the requirement for knowledge, then feeling sure would guarantee correctness. Since you can be 100% confident and 100% wrong, confidence cannot be the definition of knowledge.
  *   **Scenario A:** High Confidence / Correct (Calibrated)
  *   **Scenario B:** Low Confidence / Correct (Under-confident)
  *   **Scenario C:** High Confidence / Incorrect (Over-confident/Dunning-Kruger)

  Your teammate is treating Confidence as a necessary condition for Knowledge. Scenario C proves it isn't necessary, and Scenario B proves it isn't sufficient.

  ### 4. Why This Happens in Quiz Bowl Specifically
  Quiz Bowl is unique because it adds a **speed constraint** to knowledge retrieval.
  *   **Storage Strength:** How deeply the fact is learned.
  *   **Retrieval Strength:** How easily it comes to mind right now.
  *   **Processing Speed:** How fast you can buzz.

  Sometimes, your retrieval speed is faster than your metacognitive processing speed. Your hand buzzes because the pattern matched. Your brain says "Wait, are we sure?" but by then you've already buzzed. You interpreted that lag as "not knowing," but it was just a processing delay.

  ### The Verdict
  You can absolutely know something without being able to tell in the moment that you know it.

  **Your teammate's mistake:** He is confusing the *map* (your feeling of confidence) with the *territory* (the actual state of your memory). Just because the map says "unknown territory" doesn't mean the road isn't there.

  **Advice for your game:**
  Trust the "Scenario B" buzzes more. In Quiz Bowl, negative points hurt, but missed opportunities hurt more. If you find that you frequently get "guesses" right and recognize them immediately after, your internal threshold for buzzing is too high. You are waiting for a confidence signal that is often late or unnecessary.

  You aren't getting lucky; you're just under-confident in your own database.
