answer: |-
  Here is an argument you can adapt for your chapter, structured to highlight the tension between conciliationism's normative scope and its own epistemic status, followed by the bonus paragraph on steadfastness.

  ### The Self-Undermining Objection and the Failure of the Fixed Point

  The claim that conciliationism is self-undermining rests on the observation that the view generates a pragmatic instability when applied to itself. Conciliationism is motivated by a robust fallibilism: the recognition that the existence of an epistemic peer who disagrees with you is strong higher-order evidence that you have mishandled the first-order evidence. However, the debate *about* conciliationism is populated by epistemic peers. There are brilliant, well-informed steadfasters who have evaluated the same arguments for conciliationism and rejected them. If conciliationism is true, this disagreement constitutes higher-order evidence that the conciliationist has mishandled the evidence regarding conciliationism. Consequently, the conciliationist is rationally required to lower their credence in conciliationism.

  The problem arises when we ask what happens as that credence drops. If the conciliationist follows their own advice, their confidence in the normative force of conciliationism should diminish in proportion to the steadfast disagreement. But if their confidence in conciliationism diminishes, their justification for applying conciliationism to the first-order dispute (and to the dispute about conciliationism itself) evaporates. The view eats its own tail: to be consistent, the conciliationist must abandon the very rule that demands consistency.

  Adam Elga's "fixed-point" proposal attempts to arrest this spiral by arguing that one must always treat one's current reasoning standards as a fixed point; you cannot evaluate your standards without *using* your standards. While logically sound in a narrow sense, this maneuver fails to rescue conciliationism from the charge of self-undermining because it violates the **principle of impartiality** that motivates the view in the first place. Conciliationism is attractive because it forbids epistemic egoism; it demands you treat a peer's assessment of the evidence as weighty as your own. By exempting conciliationism itself from this requirement, the proponent engages in epistemic special pleading. They are effectively saying, "For all claims $p$, peer disagreement requires conciliation, except for the claim that peer disagreement requires conciliation."

  This creates a structural isomorphism between the conciliationist using the fixed-point move and the dogmatist they seek to criticize. When a flat-earther refuses to conciliate, they implicitly treat their method of evaluating evidence (e.g., "trust my eyes over NASA") as a fixed point immune to peer critique. If the conciliationist exempts their own standard from conciliatory pressure, they are doing the exact same thing, merely with a more sophisticated standard. The fixed-point move saves the *logic* of the view from contradiction, but it kills the *normative spirit* of the view. It transforms conciliationism from a universal epistemic norm into a local, dogmatic commitment that one happens to hold. Thus, the view remains self-undermining in the sense that maintaining it requires violating the very epistemic humility it prescribes.

  ***

  ### Bonus: Does Steadfastness Escape the Charge?

  Steadfast views (such as the Total Evidence View) largely escape this specific self-undermining charge, though they face a different vulnerability. Because steadfastness permits an agent to maintain their credence in $p$ despite peer disagreement (provided they judge their handling of the evidence to be correct), it is perfectly consistent for a steadfaster to remain steadfast about steadfastness. When a steadfaster encounters a conciliationist peer, they can evaluate that disagreement, determine that the conciliationist is mistaken about the normative requirements of rationality, and justifiably maintain their own view without triggering a spiral of doubt. However, while steadfastness is logically stable, it is vulnerable to the charge of **epistemic arbitrariness**. If the steadfaster cannot provide a non-question-begging reason for why *their* assessment of the disagreement trumps the conciliationist's, their position risks collapsing into an unprincipled epistemic egoism. So, while steadfastness does not self-destruct, it struggles to justify why it shouldn't be dismissed as dogmatic—a irony given that this is the very charge conciliationists usually level against them.
