  **Memory Loss (S):** This is the deepest structural flaw; unlike weakness of will, forgetting can happen to perfectly rational agents, forcing van Fraassen to add a "no forgetting" clause that severely limits the principle's applicability to real learners.

  **Ulysses & Tampering (A):** These are fatal to the *unrestricted* version but motivate obvious restrictions (trust only reliable selves); they show the principle fails when expertise is compromised, which is easier to patch than the memory problem.

  **Sleeping Beauty (B):** While it creates tension between Reflection and Conditionalization, this is largely confined to self-locating belief contexts where defenders can propose centered modifications rather than abandoning the principle entirely.

  **Clever Bookies (C):** This undermines the pragmatic Dutch Book *argument* for Reflection, not the principle itself; a defender can concede the Dutch Book point while maintaining Reflection holds on epistemic utility grounds.
