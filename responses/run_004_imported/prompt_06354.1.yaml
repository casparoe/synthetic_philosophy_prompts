  Your friend is channeling a critique made by John Norton (in his later work) and others: If the "substance" has no independent identity, what work is it doing? If the metric field does all the physical work, insisting on "points" underneath it might be ontologically redundant. Your friend is right that the *motivation* for sophisticated substantivalism becomes thin, but they are wrong that it *logically collapses*.

  **3. The Vacuum Argument**
  The clearest substantive difference lies in the vacuum.
  *   **Relationalist:** In a region with no matter, spatial relations are relations between... what? They must either deny the reality of the vacuum or treat the gravitational field as "matter."
