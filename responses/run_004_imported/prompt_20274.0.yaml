answer: |-
  You have identified a crucial tension in the literature, but your understanding of the upshot of Lewis's 1976 result is slightly too strong, which is generating the puzzle about Stalnaker and Jackson.

  To put it bluntly: **Lewis's triviality results do not prove that indicative conditionals cannot have truth conditions *simpliciter*.** Rather, they prove that indicative conditionals cannot have truth conditions **if** one accepts a specific set of auxiliary assumptions (most notably, "The Equation").

  Stalnaker and Jackson did not ignore Lewis; they rejected different premises of his argument to preserve truth-conditional semantics. If you present the 1976 result as a "proof that truth conditions are impossible," you will misrepresent the dialectic. It is better presented as a "fork in the road."

  Here is the breakdown you need to get the history and dialectic right for your seminar.

  ### 1. The Triviality Result: What it Actually Says
  In "Probabilities of Conditionals and Conditional Probabilities" (1976), Lewis argues that two claims are incompatible (unless the probability space is trivial, i.e., agents only have certainties):

  1.  **Truth-Conditionalism:** Indicative conditionals ($A \to C$) express propositions and therefore have truth conditions. Consequently, they can be inputs to standard probability functions (i.e., we can talk about the probability that the conditional is *true*).
  2.  **The Equation (Adams's Thesis):** The probability of the conditional equals the conditional probability: $P(A \to C) = P(C|A)$.

  Lewis shows that if you assume both (1) and (2) hold for *all* probability functions, you derive a mathematical contradiction (triviality).

  **Lewis's Choice:** Lewis found The Equation (2) to be intuitively undeniable for indicative conditionals. Therefore, he concluded that (1) must be false. He adopted an Adams-style view: indicatives do not express propositions, they have no truth conditions, and they are not objects of belief but rather objects of *degree of belief*. (He retained truth conditions for *counterfactuals*, where The Equation is less plausible).

  ### 2. Why Stalnaker and Jackson Persisted
  Stalnaker and Jackson agreed that Lewis's math was correct, but they disagreed with his philosophical choice of which premise to discard. They both wanted to save Truth-Conditionalism (1), so they had to find a way to reject or restrict The Equation (2) or the assumptions surrounding it.

  #### Robert Stalnaker: Context Dependence
  Stalnaker's response (developed in papers like "Indicative Conditionals" [1975/1981]) is that Lewis's proof assumes the proposition expressed by $A \to C$ is fixed independently of the agent's epistemic state.

  *   **The Move:** Stalnaker argues that the content of an indicative conditional is **context-sensitive**. The proposition expressed by $A \to C$ depends on the context set (the common ground of the conversation).
  *   **Blocking Triviality:** Lewis's proof quantifies over *all* probability functions. Stalnaker argues that you cannot shift the probability function (the epistemic state) without potentially shifting the proposition expressed by the conditional. If the proposition changes when the probability function changes, the triviality proof fails.
  *   **Result:** Stalnaker maintains a possible-worlds truth-conditional semantics for indicatives (similar to his counterfactuals but with a different accessibility relation) by embracing contextualism.

  #### Frank Jackson: Convention and Assertibility
  Jackson's response (most famously in "On Assertion and Indicative Conditionals" [1979]) is Gricean. He agrees with Lewis that The Equation holds for *assertibility*, but denies it holds for *probability of truth*.

  *   **The Move:** Jackson argues that indicative conditionals **do** have truth conditions: they are simply material conditionals ($A \supset C$).
  *   **The Catch:** However, we are only conventionally warranted in *asserting* them if the conditional probability is high.
  *   **Blocking Triviality:** Jackson distinguishes between $P(A \to C)$ (probability the material conditional is true) and Assertibility($A \to C$). He accepts Adams's thesis applies to *assertibility*, not truth. Since $P(A \supset C) \neq P(C|A)$ generally, there is no triviality.
  *   **Result:** Jackson preserves truth conditions (the material conditional) but explains the intuitive pull of Adams's thesis via pragmatics/convention.

  ### 3. Correcting the Historical Narrative for Your Lecture
  To teach this accurately, you should structure the dialectic not as "Lewis proved X, everyone else ignored him," but as "Lewis proved a dilemma, and the field split on how to resolve it."

  **The Dialectic Map:**

  1.  **Pre-1976:** General optimism that conditionals could be treated with possible worlds (Stalnaker 1968, Lewis 1973).
  2.  **Lewis 1976:** The Triviality Result. Establishes that **Truth Conditions + The Equation = Impossible**.
  3.  **The Split:**
      *   **The Non-Truth-Conditional Camp (Lewis, Adams, later Edgington):** Keep The Equation, drop Truth Conditions. Conditionals express no propositions.
      *   **The Truth-Conditional Camp (Stalnaker, Jackson):** Keep Truth Conditions, modify/reject The Equation or its assumptions.
          *   *Stalnaker:* Rejects the assumption that content is invariant across probability functions (Contextualism).
          *   *Jackson:* Rejects the identification of probability of truth with probability of assertion (Griceanism/Materialism).

  ### 4. Common Pitfalls to Avoid
  *   **Don't say Lewis proved truth conditions are impossible.** Say he proved they are incompatible with *unrestricted* adherence to The Equation.
  *   **Don't conflate Indicatives and Counterfactuals.** Lewis's triviality result targets indicatives. He maintained a robust truth-conditional semantics for counterfactuals (*Counterfactuals*, 1973) because The Equation is not plausible for counterfactuals (e.g., "If Oswald hadn't shot Kennedy, someone else would have" might have low probability even if the conditional probability of someone else shooting given Oswald didn't is high, due to conspiracy theories, etc.—the logic is different).
  *   **Don't ignore Edgington.** If you are teaching the modern state of the debate, Dorothy Edgington is the contemporary heir to Lewis/Adams. Her work (e.g., "Do Conditionals Have Truth Conditions?", 1995) reinforces the non-truth-conditional view against Stalnaker/Jackson.

  ### Summary for your Lecture Notes
  *   **Lewis (1976):** "You can't have both Truth Conditions and The Equation." -> Chooses Equation.
  *   **Stalnaker:** "You can have both if you make the content context-sensitive." -> Chooses Truth Conditions + Context.
  *   **Jackson:** "You can have both if you distinguish truth from assertibility." -> Chooses Truth Conditions (Material) + Pragmatics.

  This framing respects the intelligence of Stalnaker and Jackson (they weren't ignoring a proof) and accurately represents the logical force of Lewis's result (it is a constraint, not a total elimination).
