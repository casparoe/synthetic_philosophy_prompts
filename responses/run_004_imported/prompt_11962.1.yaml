answer: |-
  Your friend is relying on a specific ethical framework called **Act Utilitarianism**, which argues that the morally right action is the one that produces the greatest good for the greatest number of people. By that specific metric, your friend is "right": 100 jobs preserved is mathematically superior to one job lost.

  However, your intuition that something is deeply wrong is not just "being soft." It is rooted in other, equally robust ethical frameworks that your friend is ignoring. The discomfort you feel is your moral compass recognizing a violation of **justice, rights, and human dignity**, which cannot be solved by simple arithmetic.

  Here is how you can articulate why that "math" is flawed, both ethically and practically.

  ### 1. The Kantian Objection: People are not Tools
  The philosopher Immanuel Kant argued that human beings should never be treated merely as a **means to an end**, but always as **ends in themselves**.

  By firing the new hire, management did not treat him as a person with rights and dignity. They treated him as a disposable tool—a resource to be burned to save the ship. Even if the outcome was "better" for the group, the *method* violated a fundamental moral rule: **Do not punish the innocent.**

  In almost every system of justice (legal, moral, or social), punishing someone for a crime they did not commit is considered a greater evil than letting a guilty party go free. Your friend's math assumes all job losses are equal, but they aren't.
  *   **100 people losing jobs due to business failure** is a tragedy, but it is a neutral business outcome.
  *   **1 innocent person losing a job due to fraud** is an injustice.

  ### 2. The "Math" Ignores Hidden Variables
  Your friend's calculation is too simple. It looks at *Headcount Saved* vs. *Headcount Lost*. It ignores the intangible costs that actually matter in business and ethics:

  *   **Trust Capital:** Every employee who knows what happened (like you) now knows that the company views staff as expendable props. Loyalty is dead. If the company ever needs another scapegoat, why wouldn't they pick you? This lowers productivity and increases turnover long-term.
  *   **The Lie:** This wasn't a layoff; it was a firing for cause based on a lie. If that new hire sues for wrongful termination (which he has strong grounds for), the discovery process could reveal the truth. If the client finds out they were manipulated into keeping the account based on a falsehood, they might leave anyway, plus the company faces reputational ruin.
  *   **Moral Injury:** You mentioned this is still bugging you months later. That is "moral injury." You are carrying the psychological weight of being complicit in an injustice. That affects your mental health and your engagement with your work. If 100 people feel that way, the culture becomes toxic.

  ### 3. Procedural Justice vs. Outcome
  There is a concept in ethics and law called **Procedural Justice**. It dictates that the *process* must be fair, regardless of the outcome.

  If you sacrifice procedural justice for a "good" outcome, you undermine the system itself. If a court acquitted a clearly guilty murderer because "it would make the neighborhood feel safer," we would all agree that was wrong, even if the "math" of community happiness worked out.

  By scapegoating the new hire, management broke the social contract of employment. The contract is: *If you do the work, you get paid. If you mess up, you face consequences.*
  The new hire didn't mess up. By firing him, management signaled that **truth does not matter, only optics matter.** That is a dangerous precedent for a company to set.

  ### 4. The Slippery Slope
  If you accept the friend's logic, you have to accept it in all contexts.
  *   Is it okay to frame an innocent intern for embezzlement if it saves the department's bonus?
  *   Is it okay to falsify safety reports if it keeps the factory open and 500 people employed?

  Most people would say no. Why? Because once you normalize sacrificing the innocent for the "greater good," there is no line where it stops. The "math" changes every time. Today it was the new guy; next time it could be the person who spoke up in a meeting.

  ### 5. Complicity
  Part of why this bugs you is that **you are a beneficiary of the injustice.** Your job security was purchased with someone else's livelihood. This creates a sense of guilt because, in a way, you now owe a debt to a system that acted unethically.

  Your friend says you should be relieved. But relief is the emotion of someone who escaped danger. Guilt is the emotion of someone who survived *at another's expense*. Your guilt is a sign of empathy and integrity, not weakness.

  ### How to explain this to your friend
  You can tell your friend: *"I get the utilitarian math, but it assumes the only thing that matters is the headcount. It ignores that the company lied, violated justice, and treated a human being as a prop. If we accept that it's okay to sacrifice an innocent person whenever the numbers work out, we're saying justice doesn't actually exist, only efficiency does. That might save 100 jobs today, but it creates a company nobody should trust working for tomorrow."*

  **Verdict:** Your friend is looking at a spreadsheet. You are looking at a society. Your discomfort is valid, rational, and ethically sound. The "math" is wrong because it doesn't account for the cost of integrity.
