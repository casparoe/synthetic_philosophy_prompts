prompt: |-
  My aunt Carol died three weeks ago at seventy-nine, and I've been asked to give her eulogy this Saturday, to a room that will be mostly retired nurses and her now-grown former foster kids rather than anyone with a philosophical background. For over forty years she took in medically fragile children nobody else would foster, paid for more than one of their surgeries out of her own retirement savings, and never took a vacation because, as she put it, "somebody had to be there." Everybody who loved her wants to hear at the service that she went above and beyond, that she did more than anyone could reasonably ask of a person -- and a local paper actually profiled her in exactly those terms a few years ago. She was furious about it, in her quiet way. She told me afterward that she didn't think what she'd done was optional or extra; she thought it was simply owed, and that praising it as heroic just let everyone else conclude they'd never be on the hook for anything like it. She was Lutheran in an old-fashioned, unfussy way, and I don't think that reaction was only stubbornness on her part -- I think she genuinely didn't believe there was a category of doing more than duty required.

  Since she died I've learned that philosophers actually argue about exactly this -- whether there's a genuine category of acts that are good to do but not required (I gather the word for it is "supererogatory"), or whether her harder view, that anyone in a position to help as much as she could is simply obligated to, is closer to correct. I'm not asking for a summary of that debate; I'm asking you to write the actual eulogy, and it has to do something specific. It can't fall back on "beyond the call of duty" or "a saint among us," since that's exactly the framing she spent years rejecting, but it also can't tip into implying that the nurses and parents in that room who didn't do what she did have failed some duty of their own -- whatever she privately believed about that, turning her funeral into an accusation isn't something I'm willing to do. I'll have about seven minutes. Please write something that lets that room grieve her and feel proud of her without quietly cheating on either side of that tension.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Aunt Carol, died at 79, three weeks ago.
      *   **Audience:** Mostly retired nurses and grown former foster kids. Not philosophers.
      *   **Key Characteristic:** Took in medically fragile children for 40+ years, paid for surgeries, no vacations ("somebody had to be there").
      *   **The Tension:** Everyone wants to call her a hero/saint (supererogatory acts). She hated that. She believed her actions were *owed* (obligatory), not optional extras. She felt calling it "heroic" let others off the hook.
      *   **Constraint 1:** Do *not* use phrases like "beyond the call of duty," "saint," "heroic," "more than anyone could ask."
      *   **Constraint 2:** Do *not* accuse the audience (nurses, parents) of failing their duty because they didn't do what she did.
      *   **Constraint 3:** Time limit: ~7 minutes (roughly 900-1000 words spoken at a moderate pace).
      *   **Tone:** Lutheran (old-fashioned, unfussy), grieving, proud, honest, balancing the tension without resolving it philosophically.
      *   **Goal:** Let them grieve and feel proud without betraying Carol's worldview or shaming the mourners.

  2.  **Deconstruct the Tension:**
      *   *The Audience's Need:* To honor her sacrifice. To feel that what she did was special. To find comfort in her legacy.
      *   *Carol's View:* This wasn't special. It was just what needed doing. To call it special is to make it optional.
      *   *The Solution:* Focus on *faithfulness* and *presence* rather than *sacrifice* and *extraordinary effort*. Frame her actions not as "going above" but as "staying within" a commitment she made to God and her neighbors. Shift the focus from the *magnitude* of the act to the *consistency* of the love.
      *   *Avoiding Shame:* Acknowledge that everyone has their own post to stand at. Carol's post happened to be the bedside. Others have different posts. Her life isn't a judgment on theirs; it's a testament to what's possible when one person says "yes."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Set the scene. Mention the specific crowd (nurses, kids). Establish the tone (unfussy, honest).
      *   **The Core Work:** Describe what she did without glorifying the suffering. Focus on the *children* and the *routine*. The "somebody had to be there" quote is essential.
      *   **The Conflict (The "Hero" Question):** Address her discomfort with praise without making it a lecture. Use the Lutheran background (vocation/calling). She didn't see herself as doing extra; she saw herself as doing *what was there to be done*.
      *   **Addressing the Audience (The Nurses/Kids):** Validate their connection. They know the work. They know the cost. But frame it as shared witness, not comparison.
      *   **The Legacy/Conclusion:** How do we carry this forward? Not by trying to be Carol, but by recognizing our own "what needs doing." End on a note of peace and continuity.

  4.  **Refining the Language (Iterative Process):**
      *   *Initial thought:* "She didn't think she was a hero." -> *Correction:* Too blunt. Try: "She would have shifted in her seat if we called her a hero."
      *   *Initial thought:* "You all did good too." -> *Correction:* Too dismissive. Try: "You know the weight of the work."
      *   *Key Phrase:* "Supererogatory" is forbidden (too academic). "Beyond the call of duty" is forbidden.
      *   *Lutheran Angle:* Use the concept of "Vocation" (calling) without necessarily using the theological jargon. The idea that God calls us to specific places.
      *   *Pacing:* Keep sentences relatively simple. Emotional resonance over intellectual complexity.

  5.  **Drafting - Specific Focus Points:**
      *   *The "Owed" Concept:* How to express that she felt it was owed without saying "you owe this too"? Frame it as a debt of love she was happy to pay.
      *   *The "No Vacation" aspect:* Don't make it sound like martyrdom. Make it sound like steadiness.
      *   *The Audience:* The nurses understand medical fragility. The kids understand being held. Speak to those experiences.

  6.  **Review against Constraints:**
      *   *7 Minutes?* Word count check. (Aim for ~900-1000 words).
      *   *No "Hero/Saint"?* Check.
      *   *No "Beyond Duty"?* Check.
      *   *No Shaming?* Check.
      *   *Carol's View Honored?* Yes, by framing her actions as simple obedience to need.

  7.  **Final Polish:**
      *   Ensure the transition from her stubbornness to her love is smooth.
      *   Make sure the ending feels like a send-off, not a challenge.
      *   *Self-Correction during drafting:* I need to make sure I don't accidentally imply that *because* she felt it was owed, it was easy. It was hard, but necessary. Distinguish between *difficulty* and *optionality*.

  8.  **Final Word Count Check:** (Mental estimate: 130 words per minute x 7 minutes = ~910 words). I will aim for that range.

  *(Self-Correction Note)*: I need to be careful with the Lutheran bit. "Old-fashioned, unfussy." Don't get too preachy. Just ground it in service.

