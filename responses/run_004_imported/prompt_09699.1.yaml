      *   **Ramban's Position (as understood by the student):** Sacrifices existed before idolatry (Cain, Abel, Noach). Therefore, it can't be just an anti-idolatry measure. Sacrifices have intrinsic spiritual value/effect. (Source: Commentary on Leviticus 1:9).
