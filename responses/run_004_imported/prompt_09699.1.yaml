      *   *Ramban's View:* Accurate. In his commentary on Vayikra 1:9, he explicitly critiques the Rambam's view, calling it "hevel" (vanity/nonsense) and citing the sacrifices of Adam, Cain, Abel, and Noach as proof that sacrifice is primordial, not just an Egyptian hangover.
