answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's younger brother.

  Looking around the room, I see a pretty distinct split. On one side, we have the boatyard crew—the family and friends who know [Brother's Name] by the calluses on his hands and the smell of sawdust on his jacket. On the other side, we have the lab cohort—the people who know him by his research notes and the late nights spent staring at petri dishes.

  For a long time, it looked like [Brother's Name] was going to have to choose between these two tribes. As many of you know, he spent nearly three years torn between finishing his PhD in marine biology and taking over our late uncle's workshop. It was a genuine struggle. And I know that even now, some well-meaning relatives still ask him, half-joking, if leaving the program meant he "wasted" all that training.

  I want to take a minute to address that, because I think it gets at something important about the man he is, and the marriage he's entering today.

  When we face big decisions, we usually think there are only three ways the options can relate to each other. Option A is better than Option B. Option B is better than Option A. Or, they're exactly equal—like flipping a coin.

  But [Brother's Name]'s choice wasn't like that. The PhD wasn't better than the boatyard. The boatyard wasn't better than the PhD. And they certainly weren't equal; they were completely different kinds of lives.

  There's a philosopher who argues that when you're in this spot, the options aren't better, worse, or equal. She says they're what she calls "on a par." They're in the same neighborhood of value, but you can't measure them against each other on a single scale. When you're facing choices that are "on a par," the reasons run out. You can't calculate your way to the answer.

  So, how do you resolve it? You don't *find* the right answer. You *make* it the right answer.

  You step in and commit. By throwing your will behind one option, you create the reasons that make it worthwhile. You build the value into the choice by sticking with it.

  [Brother's Name] didn't leave the lab because the boatyard was objectively "better." He left because he decided to put his weight behind the wood, the water, and the workshop. And in doing so, he didn't waste his training. He used the discipline, the rigor, and the curiosity he developed in that lab to build a life here on land. The training wasn't a ticket to a specific destination; it was the toolset he used to build this one.

  And this, I think, is the perfect lead-in to why he and [Partner's Name] are such an incredible match.

  [Parker's Name] faced the same crossroads. She walked away from the same lab, at the same time, for the same reasons. But more importantly, they found each other in that space where the reasons run out.

  Marriage is the ultimate "hard choice." There is no objectively perfect spouse. There is no calculation that proves [Partner's Name] is the statistically superior match for [Brother's Name]. If you're looking for that, you'll be single forever.

  Like the choice between the lab and the loft, marriage is "on a par" with every other path life could have taken. It becomes the *right* path only because two people commit to making it so. They don't discover a pre-existing happiness; they create it. They stand up in the face of uncertainty and say, "This is what I will. This is who I am."

  [Brother's Name], you didn't waste your past. You used it to author your present. And [Partner's Name], thank you for co-authoring the next chapter.

  So, if everyone could please raise a glass.

  To the hard choices. To the commitment that makes them right. And to the bride and groom, who didn't just find a life together, but decided to build one.

  To [Brother's Name] and [Partner's Name]!
