      *   *The Resolution:* He didn't *find* the answer; he *made* the answer by committing to it. By choosing the boatyard and his partner, he created the reasons that make that choice right *for him*.
      *   *Application to Marriage:* This parallels marriage perfectly. Marriage isn't about finding the objectively "best" partner (who doesn't exist), but committing to someone so that they *become* the best partner for you.

