prompt: |-
  So we had a pretty nasty outage last week (payments service was down for almost 40 minutes during peak traffic, not fun) and now we're stuck writing the postmortem, and me and my team lead are kind of at odds over how to actually explain what happened. He's very "5 whys," and wants the doc to boil down to one clean root cause — some general principle like "when the connection pool saturates under a retry storm, downstream timeouts cascade and take out the whole service," basically a rule you could apply anytime those conditions hold and predict the exact same failure. I get why that's appealing, it's clean, and it gives you something concrete to go fix.

  But when I actually walk through how the outage happened, what comes to mind isn't a rule, its more like a story: someone pushed a config change around 2am, completely unrelated to that a marketing email had gone out earlier that morning and spiked traffic more than usual, an on-call engineer muted an alert because it looked like a known flaky one, and so on. Take away any one of those coincidences and the outage probably doesn't happen, or happens totally differently. It feels like the "real" explanation is this whole particular, unrepeatable chain of stuff, not some general law — but then I start second-guessing myself, like, is that actually explaining anything, or is it just a fancy description of what happened? My team lead's whole position is that a pile of "and then this happened, and then that happened" doesn't explain anything until you name the underlying mechanism. Meanwhile a couple other people on the team don't even get why we're arguing about it, to them the timeline section and the root-cause section are obviously just doing the same job from different angles.

  I don't have any philosophy background, just a CS degree, but this feels like it's pointing at something bigger than postmortem formatting, like theres an actual disagreement buried in here about what even counts as an explanation, not just a style preference. Is my team lead right that only the general-mechanism version really explains the outage and the timeline is just color commentary? Or is there something wrong with assuming every real explanation has to cash out as a repeatable rule? Something about the whole debate bugs me but I can't quite articulate what. If there's an existing way of thinking about this that would help us figure out who's actually right, or whether we're just talking past each other, I'd love to hear it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A tech team is writing a postmortem for a significant outage (payments service down, 40 mins, peak traffic).
      *   **Conflict:** The user and their team lead disagree on the nature of the "explanation" in the postmortem.
      *   **Team Lead's View:** Wants a "5 Whys" approach, boiling it down to *one clean root cause*, a general principle/mechanism (e.g., "connection pool saturation under retry storm"). Believes this is the only real explanation because it's predictive and actionable.
      *   **User's View:** Sees the outage as a unique chain of events (config change + marketing spike + muted alert). Believes the "story" is the real explanation because removing any link breaks the chain. Feels like reducing it to a general rule misses the specific context.
      *   **Other Team Members:** Think it's just formatting (timeline vs. root cause do the same job).
      *   **User's Intuition:** Feels like there's a deeper philosophical disagreement about what counts as an "explanation," not just style. Wants to know if there's a framework to resolve this.

  2.  **Identify the Core Philosophical/Conceptual Conflict:**
      *   This is a classic debate in incident management, systems thinking, and philosophy of science.
      *   *Team Lead:* Represents **Reductionism / Nomothetic Explanation** (seeking general laws, deterministic causality, "the root cause").
      *   *User:* Represents **Systems Thinking / Idiographic Explanation** (seeking specific context, conjunctive causality, "the accident trajectory").
      *   *Philosophical Hook:* David Hume (causality), Nancy Cartwright (capacities vs. laws), Charles Perrow (Normal Accident Theory), Sidney Dekker (Human Error/Just Culture), Erik Hollnagel (Resilience Engineering).

  3.  **Evaluate the Positions:**
      *   **Team Lead (5 Whys/Root Cause):**
          *   *Pros:* Actionable, clear ownership, prevents specific technical recurrence (e.g., fix the connection pool).
          *   *Cons:* Can be overly simplistic, ignores context, leads to "silver bullet" thinking, might blame individuals (e.g., "why did they mute the alert?"), assumes linearity.
      *   **User (Story/Chain of Events):**
          *   *Pros:* Accurate to reality (complex systems are non-linear), captures the *why now?* question, highlights systemic fragility.
          *   *Cons:* Can feel like "stuff happened," harder to derive a single ticket from it, might feel unsatisfying to management wanting a "fix."
      *   **Synthesis:** Both are partially right, but the "Root Cause" model is increasingly seen as outdated in high-reliability organizations (HROs). The "Story" is actually closer to how modern SRE/DevOps thinks (Blameless Postmortems, Resilience Engineering).

  4.  **Formulate the Response:**
      *   **Validate the User:** Acknowledge that their intuition is spot on. This *is* a philosophical disagreement, not just formatting.
      *   **Introduce the Frameworks:**
          *   *The "Root Cause" Fallacy:* Explain why seeking *one* cause in a complex system is often misleading (Causality isn't linear).
          *   *Systems Thinking / Resilience Engineering:* Introduce the idea that accidents are emergent properties, not just broken parts. Mention Sidney Dekker or Erik Hollnagel.
          *   *The "Swiss Cheese Model" (Reason):* Good visual for the user's "chain of events" idea.
      *   **Address the "Explanation" Question:**
          *   Does a general law explain better than a specific narrative? In complex socio-technical systems, the narrative *is* the explanation of *why it happened then*. The general law explains *how it was possible*.
      *   **Practical Advice for the Postmortem:**
          *   Don't choose one. Use both.
          *   Timeline = The specific trajectory (Idiographic).
          *   Root Cause/Contributing Factors = The systemic vulnerabilities (Nomothetic).
          *   Action Items = Need to address both specific bugs and systemic resilience.
      *   **Reframing the Argument:** Help the user talk to the Team Lead. The Lead wants preventability; the User wants accuracy. They can coexist.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Opening:* Validate the feeling. It's not just you.
      *   *Philosophy Bit:* Keep it accessible. Use "Nomothetic" (laws) vs. "Idiographic" (specifics) but explain them simply.
      *   *The "Root Cause" Critique:* Mention that "Root Cause Analysis" (RCA) is controversial in modern SRE. "Root Cause" implies a single point of failure in a web of dependencies.
      *   *The "Story" Defense:* The story explains the *conjuncture*. Why didn't it happen last week? Because the marketing email didn't go out.
      *   *Synthesis:* The mechanism (Lead's view) explains the *vulnerability*. The story (User's view) explains the *trigger*. You need both.
      *   *Actionable Advice:* How to write the doc to satisfy both. "Contributing Factors" instead of "Root Cause."
      *   *Key Names:* Charles Perrow (Normal Accidents), Sidney Dekker (Just Culture), John Allspaw (Blameless Postmortems). *Self-Correction: Don't get too academic, keep it practical for a CS context.*

  6.  **Refining the Tone:**
      *   Empathetic, professional, analytical.
      *   Avoid taking sides completely, but validate the user's skepticism about the "One True Cause."
      *   Make sure to answer the specific question: "Is my team lead right... or is there something wrong with assuming every real explanation has to cash out as a repeatable rule?"

  7.  **Final Polish:**
      *   Check for clarity.
      *   Ensure the distinction between "necessary conditions" (the mechanism) and "sufficient conditions" (the specific chain) is clear.
      *   Add a section on how to negotiate this with the Lead.

  8.  *(Self-Correction during drafting)*: I should be careful not to dismiss the Team Lead entirely. The mechanism *is* important for engineering fixes. If the connection pool doesn't saturate, the outage doesn't happen. So the mechanism is a *necessary* condition. The user's story provides the *sufficient* conditions. I need to make sure this distinction is clear.

  9.  **Final Structure:**
