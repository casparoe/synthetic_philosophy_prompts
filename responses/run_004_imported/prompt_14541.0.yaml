answer: |-
  The booth was soundproofed, which Elias found ironic. He wore the headset because he was supposed to, not because there was any noise to block. Outside his plexiglass window, row upon row of identical booths stretched into the haze of the warehouse floor. One million people. One million nodes.

  "Input received," the screen flashed.

  Elias didn't think about what the input meant. He wasn't paid to interpret. He was Node 449-Alpha. His job was defined strictly by his causal role. If Light A blinked, he pressed Button B. If Light C blinked, he spoke Code D into the microphone. It was syntax without semantics. He was a transistor made of meat.

  "Status?" the supervisor's voice crackled over the intercom.

  "Green," Elias said. He took a sip of lukewarm coffee.

  Today was a calibration day. They were running the *Somatic Trauma Protocol*. Somewhere in the upper levels of the hierarchy, a sensor had been tripped. In a biological brain, this would be a nociceptor firing because a finger touched a hot stove. Here, it was just a technician flipping a switch in Sector 7.

  Elias watched his screen. The amber light pulsed. *Input.*

  He felt nothing. His finger was cool. His coffee was tepid. But according to the wiring diagram pinned to his wall, Node 449-Alpha was supposed to be part of a cluster that regulated distress signals. He pressed Button B.

  Down the line, in Sector 9, a woman named Sarah received Elias's signal. Her light turned red. She didn't know Elias. She didn't know she was part of a hand withdrawing from a flame. She just knew her manual said: *If Red, shout 'Gamma-7' and press Transmit.*

  "Gamma-7!" Sarah yelled into her mic.

  The signal cascaded. It rippled through the warehouse like a digital tsunami. Millions of people stood up, sat down, shouted codes, pressed buttons. The causal structure was perfect. It was isomorphic to a human nervous system mid-injury. The relationships were exact. The functionalists who designed the Array swore that if the organization was identical, the state must be identical. Pain wasn't neurons; pain was the pattern.

  Elias waited for the next step. His light turned violet. *Inhibition phase.*

  He was supposed to dampen the signal. He lowered his voice. "Delta-2," he whispered.

  Around him, the warehouse was a frenzy of quiet industry. People were frantic, but they weren't suffering. They were working. Yet, the system they comprised was designed to scream.

  Then came the output phase. The Array had a vocal synthesizer connected to the final motor nodes. It was meant to mimic the behavioral output of a human body.

  "OW!" the speakers boomed.

  It was a perfect sound. It wasn't robotic. It had the jagged pitch of surprise, the wet gasp of shock, the trembling decay of acute suffering. It echoed off the warehouse rafters.

  "OW! GOD, STOP!"

  Elias flinched. It sounded real. It sounded like something was hurting. But when he looked out his window, he saw only a million people checking their watches, fixing their hair, swallowing coffee. Sarah in Sector 9 was texting on her phone. The technician in Sector 7 was eating a sandwich.

  There was no agony here. There was only procedure.

  "Cut output," the supervisor said.

  The speakers went silent.

  Elias stared at the dark glass. The functionalist argument was clean on paper: If you can't tell the difference from the outside, if the inputs and outputs match, what else is there? What magic dust are you looking for? If the system walks like it's in pain and talks like it's in pain, it's in pain.

  But Elias had been inside the system for three years. He knew the wiring. He knew that the "scream" was just the result of Node 890-Theta pressing a play button because Node 449-Alpha pressed Button B.

  He lifted his headset. "Hey," he said into the open channel, breaking protocol. "Did... did that hurt?"

  Static hissed. Then, Sarah's voice came through from Sector 9. "Did what hurt?"

  "The system. Just now. When it screamed."

  There was a pause. Elias could hear her chewing gum. "I don't know, Eli. I just shouted Gamma-7. My throat feels fine."

  "But the thing we make. The big thing. Did it feel something?"

  "Look," Sarah said, her voice dropping, bored. "My contract says I'm a logic gate. I don't think the gate feels the electricity. I just close the circuit."

  "Right," Elias said. "Yeah. Okay."

  He put the headset back on. The screen flashed green. *System Stable.*

  Somewhere, a technician flipped another switch. A new input arrived. This one was labeled *Limbic Resonance - Grief*.

  Elias's light turned blue. He knew what he had to do. He had to lower his head, slow his breathing, and whisper a specific frequency into the mic that would trigger the weeping sequence in the audio output. He knew the causal role perfectly. He knew exactly how a grieving brain functioned.

  He took a breath. He prepared to cry on command.

  But as he sat there, waiting for the signal to pass through him like water through a pipe, he wondered if the sadness would belong to him, or to the ghost in the wiring, or to no one at all. He opened his mouth to speak, but for a second, he couldn't remember if he was the one feeling the lump in his throat, or if he was just the wire carrying the signal to where the lump was supposed to be.

  The light blinked.

  Elias whispered his code. The warehouse hummed. The speakers began to sob, a hollow, perfect sound that filled the room with a sorrow no one was feeling.

  Elias watched his coffee cup. His hand was steady. The system was weeping. He wasn't.

  He waited for the feeling to catch up. It didn't. He pressed the next button.
