  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Douglass *wins* against Taney legally (he didn't in 1857), but that he offers a competing *theory* of interpretation.
      *   *Nuance:* Ensure I distinguish between "Original Intent" (what framers thought) and "Original Meaning" (what text meant to public). Douglass attacks the Intent by prioritizing the Text/Purpose.
