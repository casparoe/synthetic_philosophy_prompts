  7.  **Final Polish:** Check against the prompt's specific questions.
      *   Distinct lines of argument? Yes.
      *   Restating in three guises? No.
      *   Block Taney? Only if you accept Douglass's hermeneutic rule over Taney's.
      *   Missing premise? Yes, the normative claim about the nature of government.

