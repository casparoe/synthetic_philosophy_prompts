answer: |-
  **MEMORANDUM**

  **TO:** Undergraduate Curriculum Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Bentham's Sexual Morality Texts in "Intro to Ethics"

  **Recommendation**
  I recommend we **exclude** Bentham's *Offences Against One's Self* and *Of Sexual Irregularities* from the *required* reading list for the 100-level "Intro to Ethics" course. Instead, the core *arguments* regarding harm and the felicific calculus found in these texts should be integrated into lecture materials, while the primary texts themselves be reserved for the upper-level "History of Ethics" seminar.

  **Rationale**

  **1. Pedagogical Alignment (100-Level Learning Outcomes)**
  Our primary goal in the introductory course is to ensure students can *apply* the hedonic calculus, not merely analyze Bentham's biography or historical context. While the proposed texts demonstrate the calculus in action, they risk shifting student focus from the *structure* of the argument to the *subject matter*. In a large, mixed-major lecture, we must prioritize clarity of method. We can achieve the proponent's goal—showing Bentham "biting the bullet"—by presenting the *logic* of his harm analysis in class (e.g., comparing harms of adultery vs. sodomy) without requiring all students to navigate the primary text's archaic and sensitive language.

  **2. Addressing Appropriateness and Distraction**
  The concern regarding appropriateness in a 100-level setting is valid and should not be dismissed as censorship. We cannot anticipate the comfort levels of hundreds of non-majors in a large lecture hall. Assigning explicit primary texts on sexual acts risks triggering administrative complaints or student distress that overshadows the philosophical lesson. By moving the *argument* into the instructor's control (via lecture), we maintain intellectual rigor while managing the delivery appropriately. This prevents the "edgy Jeremy" distraction; the instructor can frame the discussion strictly around utility and harm, whereas a primary text invites unguided interpretation.

  **3. The "Publicity Principle" Irony**
  Regarding the question of Bentham's suppression of his own work: teaching this irony does *not* require students to read the suppressed text. The pedagogical point is the *fact* of suppression versus his public advocacy for transparency. This is effectively taught as historical context: "Bentham argued publicity checks power, yet he hid these specific conclusions because he calculated the social pain of publication outweighed the good." This biographical fact lands with equal force whether or not the student has read the manuscript. Requiring the text adds content load without enhancing the specific lesson on the publicity principle.

  **Path Forward**
  *   **Intro to Ethics:** Instructor lecture notes to include a case study based on Bentham's harm analysis of sexual offenses, focusing on the *method* of calculation.
  *   **History of Ethics Seminar:** Add *Offences Against One's Self* to the required syllabus, where students have the background to contextualize the primary source historically and philosophically.
  *   **Optional Reading:** A link to the Bentham Project's digital edition can be provided on the course site for interested students, clearly marked as optional.

  This approach preserves the integrity of Bentham's thought, respects the constraints of the introductory level, and ensures our teaching of the "publicity paradox" remains sharp and focused.
