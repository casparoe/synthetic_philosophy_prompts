answer: |-
  Good evening. For those who don't know me, I'm [Name]. I had the privilege of being Priya's dissertation advisor, which means I watched her think harder than almost anyone I've ever met. And I also had the unique front-row seat to watch her fall in love with Theo during a dissertation seminar.

  Usually, couples meet over a shared love of music, or hiking, or a specific bar. Priya and Theo met over a fight about Immanuel Kant.

  Specifically, they fought about why we do good things. Priya took the Kantian line: that an action has true worth when you do it because it's *right*, even if your feelings are tired. Theo took the opposing view: that doing good because you care about the person is actually better than doing it because a rule told you to.

  They tell me their first date was a debate over whether a philanthropist who has gone numb to suffering, but helps people anyway out of pure principle, is admirable or repellent. Priya said admirable. Theo said repellent.

  Now, for the philosophers in the room: I know the literature. I know the charge of "fetishism." I know the stakes regarding the Good Will. I promise I will not resolve that debate tonight.

  But for everyone else: imagine you make your partner coffee every morning.
  Theo asks: "Do you make it because you love me, or because it's your duty?"
  If you only do it out of duty, you're a robot. That's cold.
  But if you only do it out of inclination, what happens on the mornings you're exhausted, or angry, or just don't feel like it? Do you not make the coffee then?

  This is where Priya and Theo have built something extraordinary. They haven't solved the philosophical problem. They've embodied the synthesis.

  A marriage cannot survive on inclination alone. Feelings are weather; they change. There will be days when the "numb philanthropist" is exactly who you need. You need a partner who shows up, who keeps a promise, who does the hard work of care *because they said they would*, even when the spark feels dim. That is the Kantian spine of a commitment. It is the safety net.

  But a marriage cannot survive on duty alone. That is just contract law. You need the Arpaly/Smith response. You need the partner who brings you soup not because they "ought" to, but because seeing you sick hurts *them*. You need the warmth that makes the duty feel like a gift rather than a tax.

  Priya brings the steadfastness. Theo brings the responsiveness.
  Priya ensures they never walk away when it's hard. Theo ensures they never forget why they stayed.

  The story goes that they still litigate this over breakfast. "Is this out of love or out of duty?"
  My advice to you both is: Never stop asking.
  Because the moment you stop asking is the moment you take the other for granted. The tension between the two isn't a bug in your relationship; it's the engine. It keeps you honest. It keeps you present.

  Priya, Theo: You have proven that you don't need to agree on the moral worth of an action to agree on a life together. In fact, your disagreement is the very thing that makes your union morally worthy.

  So, please raise your glasses.
  To the numb philanthropist, and to the feeling heart.
  To the duty that holds you, and the love that moves you.
  To Priya and Theo.
