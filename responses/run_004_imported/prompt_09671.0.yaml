prompt: |-
  Me and a friend (we're both LW lurkers) keep arguing about whether LLMs actually "believe" false things when they hallucinate. His take: dead simple, the model says something that doesn't match reality, so it has a false belief, done. But somethings bugging me about that -- when a model confidently invents a fake court citation, is "it believes the case exists" really the right description, or could we just be reading its output wrong, projecting a claim onto it that isn't the claim being made (if "claim" even applies to whatever's going on in there)? Feels like you can't pin down what the thing means without some prior take on what it believes, and you can't pin down what it believes without some prior take on what it means -- so "it's simply wrong about the facts" isn't the neutral slam dunk he thinks it is. Is there something real going on here, or am I overthinking a word (hallucination) that nobody meant this literally?
