prompt: |-
  I'm a software engineer who co-hosts a small podcast on the social effects of the systems we build. Next month's guest — a composite figure, not a named researcher — has built a reputation defending a hard-line reading of the calibration/balance impossibility result in algorithmic fairness: once two groups have different base rates for the predicted outcome, no non-trivial risk score can be both calibrated within each group and equalized in its false positive and false negative rates across groups. She treats the ProPublica/Northpointe dispute over the COMPAS recidivism tool as the canonical illustration — both sides' numbers were correct, and the disagreement was really about which of the two incompatible properties to prize. Draft eight to ten interview questions that go beyond having her restate the theorem, including at least one on whether prioritizing calibration quietly launders whatever produced the base-rate gap in the first place, one on whether the result is closer to an Arrow's-theorem-style structural impossibility or a symptom of badly chosen metrics, and one on what she'd tell a team that has to ship a risk score next week and can't wait for the philosophy to settle. For each, add a short follow-up keyed to the answer she's most likely to give.
