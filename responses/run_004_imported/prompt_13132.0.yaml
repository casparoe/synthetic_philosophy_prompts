answer: |-
  Here are ten interview questions designed for your podcast, tailored to a guest who holds a hard-line view on the fairness impossibility theorem. They move past the math into the normative and practical implications, including the three specific angles you requested.

  ### 1. The COMPAS Legacy
  You treat the ProPublica/Northpointe dispute as the canonical case study where both sides were mathematically correct but normatively incompatible. Since that debate, do you think framing the issue as an "impossibility" has clarified the public discourse, or has it inadvertently given developers a get-out-of-jail-free card to ignore disparate impact?

  *   **Follow-up:** If you argue it clarified the discourse, I'd push back: Has it actually led to better policy, or just more footnotes in technical documentation acknowledging trade-offs that affected populations never see?

  ### 2. The Decision Authority
  If we accept your reading that we must choose between calibration and error-rate balance, who gets to make that choice? In the COMPAS case, the choice was effectively made by the tool's architects prioritizing calibration. Should that trade-off be a product decision, a legal requirement, or a democratic one?

  *   **Follow-up:** If you say it should be a legal or policy decision, how do you reconcile that with the fact that most legislators don't understand the math, leaving them dependent on the very experts building the system?

  ### 3. Base Rates as Facts vs. Artifacts
  Your position relies heavily on the existence of different base rates between groups as a fixed constraint. But in criminology, base rates are often a function of reporting and policing patterns rather than actual underlying behavior. Do you treat base rates as immutable inputs, or as variables that the model itself might be influencing?

  *   **Follow-up:** If you acknowledge they are mutable, doesn't that shift the burden from "managing the trade-off" to "fixing the data," which contradicts the idea that the model is neutral to the base rate?

  ### 4. The Laundering Mechanism (Required)
  There's a critique that prioritizing calibration quietly launders whatever produced the base-rate gap in the first place. If a risk score is perfectly calibrated to arrest data, and arrest data is biased, the score is "honestly" reflecting bias. Does treating calibration as the gold standard essentially codify historical injustice as statistical truth?

  *   **Follow-up:** If you argue that calibration is necessary for the score to mean anything probabilistically, I'd ask: Meaningful for whom? Is it more important that the probability is "true" to the data, or "fair" to the person being scored?

  ### 5. The "Non-Trivial" Clause
  The theorem states that no *non-trivial* risk score can satisfy these conditions simultaneously. The trivial solution is to not score people at all, or to ignore the data. Given the impossibility result, is the only ethically consistent position to refuse to build these systems in high-stakes domains entirely?

  *   **Follow-up:** If you say "no, we still build them," aren't you implicitly arguing that the utility of the system outweighs the mathematical guarantee of unfairness? Who calculated that utility?

  ### 6. Structural Impossibility vs. Bad Metrics (Required)
  Some critics compare this fairness impossibility to Arrow's Impossibility Theorem in voting theory. Do you view this as a structural impossibility inherent to fairness itself (i.e., fairness is undefined), or is it a symptom of us trying to optimize for badly chosen metrics that don't capture what we actually care about?

  *   **Follow-up:** If you lean toward Arrow's-style structural impossibility, does that imply we should stop searching for a "fair" algorithm and focus entirely on regulating the *outcomes* of the system post-deployment?

  ### 7. Modeler vs. Policymaker Responsibility
  You've argued that modelers should deliver the most accurate, calibrated probabilities and let policymakers handle the fairness trade-offs. But if the modeler knows the policymaker will default to the calibrated version because it maximizes efficiency, isn't the modeler effectively making the policy choice by design?

  *   **Follow-up:** If you maintain the separation of duties is possible, can you name a real-world instance where a policymaker successfully overrode a calibrated model to enforce error-rate balance without breaking the tool's utility?

  ### 8. Communicating Uncertainty
  When a system cannot be both calibrated and balanced, there is inherent uncertainty about what the score *means* for different groups. Should affected individuals be told, for example, "This score predicts risk accurately for your population, but the threshold for action is stricter for you than for others"?

  *   **Follow-up:** If you say yes, that requires transparency most vendors resist. If you say no, doesn't that violate the informed consent of the people the system is judging?

  ### 9. The "Ship Next Week" Heuristic (Required)
  I'm a software engineer, and I have a team that has to ship a risk score next week. We know we can't satisfy all fairness metrics. We can't wait for the philosophy to settle. What is the specific, actionable heuristic you give that team for choosing which constraint to violate?

  *   **Follow-up:** If your advice is "maximize calibration," I'd ask: What if the cost of a false positive for your group is incarceration, but the cost of a false negative is a minor financial loss? Does calibration still win?

  ### 10. The Endgame of Fairness Research
  You defend a hard-line reading of the impossibility result that has been established for nearly a decade. Do you expect future research to overturn this, or are we in a permanent state of managing trade-offs? Is the field of algorithmic fairness essentially done, now that we know the limits?

  *   **Follow-up:** If you say we are in a permanent state of trade-offs, does that suggest we should stop funding research into new fairness *metrics* and start funding research into fairness *governance*?
