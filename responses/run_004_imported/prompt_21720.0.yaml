  ***

  # The Pyrrhic Victory of Expressivism: Why Solving Frege-Geach Costs the Theory Its Soul

  **Introduction**

  For fifty years, the Frege-Geach problem has functioned as the gatekeeper of metaethical respectability. If non-cognitivism could not explain how moral sentences function in unasserted contexts—specifically within the antecedents of conditionals—it was to be relegated to the history of errors. The trajectory of the debate, however, has shifted from a question of *possibility* to a question of *cost*. Early expressivists like Ayer were indeed felled by Geach's insight: if "lying is wrong" merely expresses disapproval, it has no content to carry over into "If lying is wrong, then..." But the contemporary landscape, dominated by the sophisticated machinery of Blackburn, Gibbard, and most notably Mark Schroeder, suggests that the logical problem is technically solvable.

  However, solving the logical problem is not the same as vindicating the expressivist project. In this paper, I argue that while the "hard" problem of logical validity has been formally resolved by biforcated attitude semantics (specifically in Schroeder's *Being For*), this solution comes at the price of expressivism's primary theoretical virtue: parsimony. To save moral logic, expressivists must posit mental states with a structural complexity indistinguishable from beliefs. Consequently, the Frege-Geach problem does not refute expressivism, but it does force a "creeping cognitivism" that dissolves the sharp distinction between moral and descriptive thought. The verdict is not that expressivism is false, but that it is no longer the lean, distinctive alternative to realism it claimed to be. It survives only by mimicking the enemy.

  **The Distinction Between Inconsistency and Validity**

  To understand the cost of the solution, we must first distinguish the two tiers of the Frege-Geach objection. The "easy" problem concerns inconsistency. If I say "Lying is wrong" and "Lying is not wrong," I am inconsistent. For a realist, this is a contradiction in belief. For a classic expressivist, this is a clash of attitudes (like booing and cheering at the same time). Blackburn's quasi-realism handles this by suggesting that holding conflicting moral commitments constitutes a pragmatic inconsistency in one's overall stance.

  But as Schroeder presses, the "hard" problem is about *validity*. Consider the argument:
  1. If lying is wrong, then getting your little brother to lie is wrong.
  2. Lying is wrong.
  3. Therefore, getting your little brother to lie is wrong.

  This is a valid instance of *modus ponens*. For the argument to be valid, the term "lying is wrong" must have the same semantic content in premise (1) and premise (2). If the expressivist says the content in (2) is an attitude but the content in (1) is... something else (or nothing), the inference is equivocal. Blackburn attempts to solve this by analyzing the conditional as expressing a higher-order attitude: disapproval of disapproving of lying while not disapproving of inducing it.

  The weakness here, which Schroeder identifies, is that Blackburn's account explains why it is *irrational* to hold the premises and deny the conclusion, but it does not explain why the argument is *logically valid* in virtue of its form. Blackburn offers a psychological explanation of inconsistency, not a semantic explanation of validity. He tells us why we shouldn't disagree with the conclusion, but not why the conclusion follows from the premises. This leaves expressivism vulnerable to the charge that it changes the subject: it explains moral psychology, but it fails to account for moral logic.

  **Schroeder's Biforcated Solution**

  Schroeder's *Being For* attempts to close this gap by providing expressivism with a compositional semantics. His move is to treat moral predicates as expressing a specific, generic pro-attitude: "being for." To say "Lying is wrong" is to express being for blaming for lying. Crucially, Schroeder assigns semantic values to these sentences that allow them to combine logically. He constructs a semantics where the semantic value of a sentence is not a truth condition, but a condition on the mental state of "being for."

  This allows Schroeder to validate *modus ponens*. Because the semantic value of "lying is wrong" is constant across asserted and unasserted contexts, the logical form is preserved. The inference is valid because the semantic machinery ensures that anyone who accepts the premises *must*, by the nature of the attitudes involved, accept the conclusion. Schroeder successfully demonstrates that expressivism can host a logic as robust as classical logic without positing moral truth-conditions.

  On the surface, this looks like a checkmate for the Frege-Geach objection. The logical form is validated; the embedding problem is dissolved. If the user's goal is merely to show that expressivism is *logically coherent*, Schroeder has won. But metaethics is not merely formal logic; it is an inquiry into the nature of moral thought. And here, the victory begins to look pyrrhic.

  **The Cost of Salvation: Parsimony and Structure**

  The traditional selling point of expressivism was ontological and psychological parsimony. Realists require weird moral properties and belief-like states directed at them. Expressivists promised a leaner ontology: just natural properties and standard conative attitudes (desires, plans, approvals). The Frege-Geach problem threatened to show that this lean ontology was insufficient to support moral discourse.

  Schroeder saves the discourse, but he does so by bloating the ontology of the mental. To make the logic work, the "being for" attitude cannot be a simple, atomic desire. It must be a structured, complex state that mirrors the structure of belief. As James Dreier argues in "Negation for Expressivists," solutions to Frege-Geach often relocate the problem from semantics to psychology. We no longer ask, "What is the semantic content?" but rather, "What is the structure of the mental state that makes this logic work?"

  Schroeder's mental states must be sensitive to logical operators in the same way beliefs are. They must have negation, conjunction, and conditional structures built into the attitude itself. But once we posit a mental state that has the structural complexity of a belief, tracks logical validity, and functions in reasoning exactly like a belief, the distinction between "belief" and "expressivist attitude" becomes merely terminological.

  This is the heart of the "creeping cognitivism" objection. If the expressivist solves Frege-Geach by making moral attitudes structurally isomorphic to beliefs, they have conceded the core cognitivist insight: that moral thought is a representational capacity capable of being true or false (or at least, correct or incorrect) in a way that mirrors descriptive thought. Schroeder denies this, insisting these are still "non-cognitive" states. But if the only difference between a moral belief and a Schroederian "being for" state is a label, the theoretical gain of expressivism evaporates. We have purchased logical validity at the cost of the very simplicity that motivated the view.

  **The Verdict: Transformation, Not Refutation**

  So, where does this leave us? The Frege-Geach problem has not been "answered" in the sense that expressivism has emerged unscathed. Nor has it "refuted" expressivism in the sense that the view is logically incoherent. Instead, the problem has functioned as a transformative pressure.

  The strongest verdict we can offer is that the Frege-Geach problem forces expressivism to evolve into a view that is indistinguishable from a certain kind of realism in its semantic structure, even if it retains a non-cognitivist metaphysics. Schroeder shows us that you can have expressivist semantics, but only if you build them out of cognitivist-looking bricks.

  This suggests that the debate should no longer center on whether expressivism *can* handle logic. It can. The debate must shift to whether the resulting psychological architecture is plausible. Is it more plausible to say we have beliefs about moral properties, or that we have complex, logic-sensitive "being for" attitudes that behave exactly like beliefs but aren't? The latter begins to look like a Rube Goldberg machine designed to avoid the word "belief."

  Therefore, the Frege-Geach problem succeeds not by killing expressivism, but by taming it. It strips expressivism of its claim to be a radically different kind of semantic theory. It forces the expressivist to admit that moral language functions logically *as if* it were truth-conditional, and moral psychology functions *as if* it were belief-based. If the expressivist must explain away all the "as ifs" with increasingly complex machinery, the realist's simpler explanation—that it *is* truth-conditional and belief-based—regains its default status.

  **Conclusion**

  In conclusion, the Frege-Geach problem is no longer the dead end it appeared to be in the 1960s. Thanks to Schroeder and the hybrid expressivists, we know that non-cognitivism can be made logically consistent. However, consistency is not the only virtue of a metaethical theory. We must also weigh explanatory power and parsimony. The sophisticated expressivist solutions validate logical inference only by attributing to agents a mental architecture that mirrors the cognitivist model so closely that the distinction between the two views blurs.

  For the purpose of this seminar, the takeaway is clear: do not ask whether expressivism solves Frege-Geach. Ask what expressivism *becomes* once it does. The argument is not that expressivism is impossible, but that the price of its possibility is its distinctiveness. If the solution to the embedding problem requires expressivism to adopt the structural commitments of realism, then realism wins the explanatory war even if expressivism survives the logical battle. This is the position worth defending: that Frege-Geach did not kill the patient, but it did require a transplant so extensive the patient is no longer who they claimed to be.

  ***

  ### Notes for Your Drafting Process

  1.  **Own the Verdict:** Notice how the essay above doesn't say "Some say X, others say Y." It says "X is the case, and here is the consequence." Your advisor wants to see *you* driving the bus. Even if you change the verdict (e.g., you decide Schroeder is actually right and parsimony isn't lost), state it definitively.
  2.  **Use the "Cost" Framework:** The "Pyrrhic Victory" angle is a strong way to avoid the "book report" trap. It allows you to summarize Schroeder (which you have to do) but frames that summary as evidence for a critical claim (that he loses parsimony).
  3.  **Engage Dreier:** I mentioned Dreier in the text. Make sure you actually look up his "Negation for Expressivists" or "Relocation" paper to flesh out that specific paragraph with a direct quote or specific argument from him. That will ground the philosophical claim in the literature.
  4.  **Refine the "Belief" Definition:** A potential counter-argument you should anticipate: The expressivist will say, "We define belief by its 'mind-to-world' direction of fit, and our attitudes still have 'world-to-mind' fit, so they aren't beliefs." You should address this in your full draft. (My argument above implies that if they function logically like beliefs, the direction-of-fit distinction might not be doing enough work).

  Good luck with the draft. You clearly know the material; the key now is to stop asking what the authors think and start telling the reader what the *situation* is.
