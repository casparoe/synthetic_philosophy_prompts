answer: |-
  You have hit on the single most significant objection to Brian Keeley's influential 1999 paper, *"Of Conspiracy Theories."* In academic circles, this is often called the **"Real Conspiracy Objection"** or the **"False Negative Problem."** Philosophers like Charles Pigden and David Coady have built entire careers pushing on exactly this point.

  The strongest version of the argument against Keeley's "self-sealing" criterion relies on demonstrating that **structural features cannot distinguish truth from falsehood in conditions of secrecy.** If a criterion for irrationality rules out actual truths *ex ante* (before the evidence is fully known), it is not a criterion of rationality; it is a criterion of conformity.

  Here is the built-out argument for why the self-sealing criterion fails to separate vicious conspiracy theories from legitimate, hard-to-falsify explanations.

  ### 1. The Necessity Argument: Real Conspiracies *Must* Be Self-Sealing
  Keeley argues that a theory is epistemically suspect if it explains away lack of evidence (by claiming it was hidden) and explains away contrary evidence (by claiming it was planted). He treats this as a bug. The counter-argument is that this is a **feature of successful secrecy.**

  For a conspiracy to succeed, the conspirators *must* engage in the exact behaviors Keeley identifies as pathological:
  *   **Destruction of Evidence:** If the conspiracy is real, the perpetrators will destroy records. To an outsider, the lack of records looks like "paranoid speculation," but it is actually a factual description of the cover-up.
  *   **Discrediting Witnesses:** If a whistleblower emerges, real conspirators will attack their character to protect the secret. To an outsider, a theorist saying "they are discrediting him because he's telling the truth" looks self-sealing. But if the conspiracy is real, that statement is factually accurate.
  *   **Planting False Evidence:** Intelligence agencies and criminal organizations do plant false flags. A theory that accounts for this is not necessarily irrational; it is accounting for the known tactics of the accused.

  **The Logical Trap:** If you accept Keeley's criterion, you must conclude that believing in Watergate was epistemically irrational *until the smoking gun tape was found.* Before the tapes were discovered, the "Nixon Cover-up Theory" relied on assuming missing evidence was destroyed and denials were lies. By Keeley's structural definition, Woodward and Bernstein were promoting a "self-sealing conspiracy theory" until the moment they weren't.

  Therefore, the self-sealing structure does not track *falsehood*; it tracks *secrecy.* Since some secrets are real, the structure cannot be used to dismiss the theory.

  ### 2. The Epistemic Symmetry Problem
  This is the core philosophical heavy lifter. It argues that from the perspective of the investigator, a true conspiracy and a false conspiracy look **identical.**

  *   **Scenario A (Fake):** A theorist claims the CIA faked the moon landing. When shown photos, they say "CGI." When shown rocks, they say "planted."
  *   **Scenario B (Real):** A journalist claims the CIA ran MKUltra. When shown denial memos, they say "lies." When shown lack of records, they say "destroyed."

  In 1970, Scenario B was the truth. In 1970, Scenario A was false. However, the **epistemic position** of the person making the claim is structurally symmetrical. They are both positing a hidden agent capable of manipulating the information landscape.

  Keeley wants to use structure to filter out Scenario A without accidentally filtering out Scenario B. But because the *mechanisms of concealment* are the same in both true and false conspiracies, there is no structural marker that distinguishes them. The only difference is ontological (is it actually happening?), not epistemological (does the argument hold together?).

  If you cannot distinguish them structurally *before* the reveal, then labeling the structure itself as "unwarranted" is an appeal to **prior probability**, not logic. It essentially says: *"Conspiracies are so unlikely that any argument for them is suspect."* That is a Bayesian prior, not a logical flaw in the theory's construction.

  ### 3. The "General Heuristic" Failure
  Keeley's goal was to provide a general heuristic: *If it looks self-sealing, dismiss it.* He wanted to save us the trouble of investigating every claim. The counter-argument is that this heuristic is **too blunt to be useful.**

  A legitimate historical explanation often requires "immunizing strategies" that are rational. Consider the hypothesis: *"The tobacco industry knew cigarettes caused cancer and hid it."*
  *   **Lack of internal memos?** "They hid them."
  *   **Public studies saying it's safe?** "They funded fake science."
  *   **Executives testifying to Congress they aren't addictive?** "They lied under oath."

  For decades, this looked like a self-sealing conspiracy theory. It was only later confirmed as fact. If we apply Keeley's rule strictly, we must say that believing the tobacco industry was lying was irrational *until the documents were leaked.*

  This leads to the **Investigative Journalism Paradox** (championed by philosopher Charles Pigden): If conspiracy theories are inherently irrational because they posit secret groups manipulating evidence, then **investigative journalism is inherently irrational.** The entire job of investigative journalism is to posit that the official story is false and that the lack of evidence is due to concealment. Keeley's criterion inadvertently pathologizes the scientific and journalistic method of hypothesis testing in adversarial environments.

  ### 4. The Bayesian Counter: Priors and Institutional Trust
  The strongest philosophical rebuttal reframes the issue from "self-sealing" to "Bayesian updating."

  Keeley assumes the "Official Story" has a high prior probability of being true. Therefore, any theory that requires assuming the Official Story is a lie requires extraordinary evidence. When a theorist treats counter-evidence as part of the conspiracy, Keeley says they are refusing to update their beliefs.

  The counter-argument is that the theorist is actually updating their beliefs about **the reliability of the source.**
  *   If I believe Institution X has lied before (e.g., WMDs in Iraq, Tuskegee Syphilis Study), my prior probability that Institution X is lying *now* increases.
  *   Therefore, when Institution X produces evidence, I must discount it based on their reliability history.
  *   "Explaining away" evidence isn't self-sealing; it's **weighting evidence based on source credibility.**

  If an institution has a track record of deception, treating their denials as "part of the cover-up" is a rational Bayesian update, not a logical fallacy. Keeley's criterion fails because it treats all institutions as having equal default credibility. It assumes that "Official Denial" is neutral data, when in epistemology, "Official Denial from a Compromised Source" is weak data.

  ### Summary of the Argument
  To summarize the strongest case against Keeley for your purposes:

  1.  **False Negatives:** The criterion classifies proven truths (Watergate, MKUltra, Tobacco) as epistemically irrational during the period they were concealed.
  2.  **Structural Symmetry:** True and false conspiracies utilize identical concealment strategies; therefore, structure cannot distinguish truth from falsehood.
  3.  **Pathologizing Inquiry:** The criterion defines the core methodology of investigative journalism and historical revisionism (positing hidden causes for missing data) as inherently unwarranted.
  4.  **Source Credibility:** What Keeley calls "self-sealing" is often a rational adjustment for low source credibility. Dismissing official evidence because the source has lied previously is not a fallacy; it is risk assessment.

  **The Conclusion:**
  Keeley is right that *some* conspiracy theories are self-sealing vices. But he is wrong that *self-sealing* is the line that separates them from legitimate theories. The line is not structural; it is **evidential.**

  You cannot dismiss a theory because it *could* explain away all evidence (Watergate could have done that). You must dismiss it because it *fails to provide specific, positive evidence* that outweighs the complexity of the claim. The problem with the JFK "second shooter" theories isn't that they are self-sealing (Watergate was too); the problem is whether they offer better predictive power or explanatory scope than the lone gunman theory *despite* the self-sealing nature of secrecy.

  Keeley tries to give you a shield to block out the noise. The philosophical counter-argument proves that the shield also blocks out the signal. You have to look at the evidence, not the structure.
