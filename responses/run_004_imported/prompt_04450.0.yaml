prompt: |-
  Aquinas holds that a private individual may licitly kill a tyrant who has seized power through usurpation, yet insists that a ruler who acquired power legitimately and then governs tyrannically may be deposed only by public authority, never by a private person acting alone. But Aquinas also holds that a ruler's authority is justified only insofar as it serves the common good. Write an essay on whether these two commitments are genuinely consistent: if a legitimate ruler's title depends on his governing for the common good, doesn't a decisive turn to tyranny strip him of that title and assimilate his case to the usurper's, thereby undermining the very distinction Aquinas relies on to forbid a private individual from killing him? Weigh the strongest considerations on both sides, and don't settle for a non-committal answer -- defend a definite conclusion.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Core Question:** Are Aquinas's two commitments consistent?
          1.  Private individuals *may* kill a usurping tyrant.
          2.  Private individuals *may not* kill a legitimate ruler who becomes tyrannical (only public authority can depose him).
          3.  Premise: Ruler's authority is justified *only* insofar as it serves the common good.
      *   **The Tension:** If authority depends on the common good, doesn't tyranny (betrayal of the common good) strip the legitimate ruler of his title? If he loses his title, isn't he just like a usurper? If so, why can't a private individual kill him?
      *   **Requirement:** Weigh strongest considerations on both sides.
      *   **Requirement:** Defend a definite conclusion (no fence-sitting).

  2.  **Initial Knowledge Retrieval & Textual Check (Mental Sandbox):**
      *   *Source:* primarily *De Regno* (On Kingship) and *Summa Theologiae* (II-II, q. 42, a. 2; q. 64, a. 3).
      *   *Aquinas's Position:* In *De Regno*, he discusses tyrannicide. He actually argues *against* private tyrannicide even for usurpers in some contexts, but the prompt asserts he allows it for usurpers. I need to address the prompt's premise while staying true to Aquinas's broader logic. Actually, in *De Regno* I.6, Aquinas says it is not sedition to depose a tyrant, but warns against the dangers of doing so privately if it leads to worse tyranny. However, the prompt sets up a specific distinction: Usurper (private killing okay) vs. Legitimate-turned-Tyrant (private killing not okay). I must engage with *this* specific formulation, even if Aquinas's texts are nuanced. The prompt asks about the *consistency* of the commitments provided in the prompt's framing.
      *   *Key Concept:* The nature of authority (Office vs. Person), the Common Good, Order/Stability, and the definition of Usurpation vs. Abuse.

  3.  **Deconstruct the Argument:**
      *   *Side A (Inconsistency):* Authority is functional (for the common good). If function fails, authority ceases. A legitimate tyrant is functionally identical to a usurper (both harm the common good). Therefore, the distinction is artificial. Private killing should be allowed for both or neither.
      *   *Side B (Consistency):* Authority has a dual source: functional (common good) and procedural/ontological (legitimate acquisition/social contract/divine ordination). A legitimate ruler holds the *office* even if he abuses it. Removing him privately causes greater harm to the common good (anarchy, civil war) than tolerating him. The usurper never had the office, so removing him restores order. Removing a legitimate ruler destroys order.

  4.  **Developing the Thesis:**
      *   I need to choose a side.
      *   *Option 1:* They are inconsistent. Aquinas tries to have it both ways.
      *   *Option 2:* They are consistent. The distinction rests on the *consequences* for the common good, not just the *source* of authority.
      *   *Decision:* I will argue for **Consistency**. Why? Because Aquinas is a consequentialist regarding political stability (in a teleological sense). The "Common Good" isn't just immediate justice; it's the *order* of the community. Private violence against a legitimate title undermines the very principle of authority required for the common good, whereas removing a usurper restores it. The distinction is pragmatic and teleological, not merely legalistic.

  5.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The problem of tyrannicide in natural law theory.
          *   State Aquinas's positions (as given in prompt).
          *   State the tension (Functional view of authority vs. Distinction in removal).
          *   Thesis: The commitments are consistent because Aquinas understands the "common good" to include the stability of political order and the sanctity of public procedure, not merely the immediate moral character of the ruler. The distinction lies in the *effect* of the killing on the political community, not just the *status* of the ruler.

      *   **Body Paragraph 1: The Case for Inconsistency (The Functionalist Objection).**
          *   Argument: Authority is teleological. End (common good) justifies means (authority).
          *   If a ruler destroys the common good, he voids the contract.
          *   A legitimate tyrant is de facto a usurper of the *purpose* of power.
          *   Therefore, distinguishing based on initial title seems like legalistic fetishism over substantive justice.

      *   **Body Paragraph 2: The Nature of the Common Good (Order and Stability).**
          *   Counter-argument: The common good isn't just "nice policies." It's *ordo* (order).
          *   Private killing introduces chaos.
          *   If anyone can judge the ruler, authority dissolves into mob rule.
          *   Aquinas prioritizes the *system* of authority to ensure long-term good over short-term removal of a bad actor.

      *   **Body Paragraph 3: The Distinction Between Usurper and Legitimate Tyrant.**
          *   Usurper: Has no legal/moral claim. Removing him *restores* legitimate order.
          *   Legitimate Tyrant: Has a claim to the office. Removing him privately *destroys* the principle of legitimate succession/authority.
          *   Analogy: A corrupt judge vs. a fake judge. Firing the fake one is easy; firing the corrupt one requires the judicial council, or the whole system loses credibility.

      *   **Body Paragraph 4: Public Authority as the Safeguard.**
          *   Aquinas doesn't say the tyrant stays forever. He says *public authority* must depose him.
          *   This preserves the rule of law even in revolution.
          *   This shows consistency: The method of removal must also serve the common good. Private murder rarely does for a legitimate king.

      *   **Conclusion:**
          *   Restate Thesis.
          *   Summarize main points (Teleology of Order, Distinction in Restoration vs. Destruction).
          *   Final thought: Aquinas is not contradictory; he is prudential. The consistency lies in the overarching goal: the preservation of the community's peace and structure.

  6.  **Refining and Polishing:**
