      *   *Key Terminology:* *Bonum commune*, *sedition*, *tyrannus ex defectu tituli* (usurper) vs. *tyrannus ex parte exercitii* (abuser). Using these Latin terms adds precision.

  7.  **Final Review against the Prompt:**
