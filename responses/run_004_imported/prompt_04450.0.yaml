      *   Address the specific tension (Title vs. Function)? Yes.

  8.  *(Self-Correction during drafting)*: I need to make sure I don't just say "Aquinas says so." I need to explain *why* it makes philosophical sense. The core argument is that the "Common Good" includes the *institutional integrity* of the polity. A legitimate ruler, even a bad one, embodies that institution. A usurper does not. Therefore, attacking them has different metaphysical and social consequences.

  9.  **Final Polish:** Check transitions and ensure the conclusion is strong. (Proceed to generate output).

