answer: |-
  You are not reaching for a distinction without a difference. Your confusion stems from a genuine philosophical tension in the sociology of science, but your colleague's position commits a specific category error that has practical consequences for how science functions.

  She is conflating **epistemic justification** (whether we are socially warranted in believing a claim) with **methodological soundness** (whether the inference from data to claim is valid).

  Here is the breakdown of why her view is philosophically fragile, what the "reviewer-independent standard" actually is, and how this should inform your decision about the postdoc year.

  ### 1. The Category Error: Institutional Facts vs. Brute Facts
  Your colleague's "bachelor" analogy relies on the concept of an *institutional fact*. It is true by definition that a bachelor is unmarried because "bachelor" is a label we assign within a linguistic system. If the community agrees you are a bachelor, you are one.

  Scientific soundness, however, is not purely an institutional fact. It is an attempt to describe a *brute fact* about the relationship between a method, data, and the world.
  *   **Peer Review** is a social process (Institutional).
  *   **Soundness** is a logical and statistical property (Methodological/Ontological).

  When your colleague says soundness is *constituted* by review, she is arguing for a strong form of **epistemic constructivism**. Under this view, there is no "outside" of the scientific community to check against. But this dissolves the concept of error. If the reviewers say the math is right, the math is right. If the reviewers say the confound is controlled, it is controlled.

  This renders the concept of "false positive" incoherent. A false positive is, by definition, a result that passed the filters (review) but does not hold up to reality (soundness). If passing the filters *makes* it sound, false positives cannot exist. Yet, we know they do.

  ### 2. The Reviewer-Independent Standard
  You mentioned you struggle to identify the "reviewer-independent standard" reviewers are trying to track. It feels elusive because it is counterfactual.

  The standard is **Counterfactual Stability** (or Reliability).
  A result is methodologically sound if, *independent of who is looking at it*, the experimental design isolates the variable it claims to isolate, and the statistical analysis accurately reflects the probability of the data given the null hypothesis.

  *   **Example:** If a p-value is calculated as 0.03, it is 0.03 regardless of whether Reviewer A or Reviewer B checks it. If there is a coding error in the analysis script, the error exists regardless of whether the reviewers caught it.
  *   **The Standard:** The standard is the **logical and statistical integrity of the inference chain.**

  Reviewers are *detectives* trying to assess that integrity. They are not *judges* whose verdict creates the integrity. Your colleague is confusing the verdict with the crime.

  ### 3. The Replication Crisis as Proof of Concept
  Your intuition about the replication scandals is the strongest empirical argument against her view.

  If publication constituted soundness, the Replication Crisis would be a logical impossibility. We would not be able to say, "These 50% of published findings failed to replicate." We would have to say, "These 50% of findings were sound at Time A (publication) and became unsound at Time B (replication)."

  But effects don't degrade like milk. If a finding was truly methodologically sound at publication, it should replicate (within power constraints). The fact that published findings frequently fail to replicate proves that **publication is a fallible proxy for soundness, not a constituent of it.**

  The crisis happened precisely because the field operated closer to your colleague's view (trust the published literature) than to yours (trust the underlying methodology), leading to a systemic overestimation of truth.

  ### 4. Why This Matters for Your Postdoc
  This is not merely academic. If you accept your colleague's view, your proposed replication project is not just low-yield; it is *conceptually redundant*. Why test something that is already defined as true?

  However, if you hold your view (that soundness is independent of review), replication is the primary mechanism by which we align our *social justification* with *methodological reality*.

  **You should take the replication year, but frame it carefully.**
  Do not frame it as "testing if the journal was wrong." Frame it as "testing the boundary conditions and robustness of the effect."
  *   **The Colleague's Trap:** If you say "I'm checking if this is true," she will say "It's already true; it's published."
  *   **The Escape:** Say "I am checking the *reliability* of the effect." Reliability is distinct from validity. A result can be validly derived (sound methodology) but fragile (only works in specific contexts).

  ### 5. Summary of the Crux
  Your colleague is advocating for a **coherence theory of truth** (a result is true if it coheres with the community's standards of acceptance). You are intuitively reaching for a **correspondence theory of truth** (a result is sound if it corresponds to the actual statistical and causal structure of the phenomenon).

  Science requires both, but they are not identical.
  *   **Peer Review** establishes *consensus*.
  *   **Replication** establishes *reliability*.

  Consensus without reliability is dogma. Reliability without consensus is noise. Your field needs more reliability testing, not less.

  **Verdict:** She is wrong. The distinction is real. The "reviewer-independent standard" is the stability of the inference under repeated testing and logical scrutiny. Your confusion is a sign that you are correctly identifying the gap between *social warrant* and *empirical reality*. Spend the year on the replication. It is the only way to bridge that gap.
