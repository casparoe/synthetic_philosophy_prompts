      *   *Analogy:* "Bachelor/Married." This implies a definitional truth. "Published Sound Result" = "Result accepted by reviewers."
      *   *Implication:* Replication is unnecessary for validation, only for extension or boundary testing. Failed replications imply the *replication* failed, not the original.

  3.  **Deconstruct the User's Position:**
      *   *Claim:* There is a fact of the matter about soundness independent of review.
