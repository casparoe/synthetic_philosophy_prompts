      *   **The User's Intuition:** The user feels this view is wrong because it makes replication scandals conceptually impossible (if published = sound, then failed replications of published work shouldn't happen or imply the original was unsound). However, the user struggles to articulate a *reviewer-independent standard of soundness* that reviewers are trying to track.
      *   **The Decision:** The user is deciding whether to spend a year replicating a result. If the colleague is right, the replication is a waste of time (the result is already "sound").
