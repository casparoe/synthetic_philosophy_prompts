      *   *Key Evidence:* Preamble ("liberty," "justice"), 5th Amendment (due process), lack of explicit mention of "slavery" or "slaves" (using "persons held to service"), Article IV Section 4 (guarantee of republican government).
      *   *Vulnerabilities:* Historical context of the Convention, the 3/5ths compromise, the Fugitive Slave Clause, the political pragmatism of the shift, the reliance on natural law principles while claiming textualism.

  3.  **Drafting the Questions (Iterative Process):**

