          *   *Follow-up:* She will say it was intellectual growth. Push on whether the *timing* undermines the claim of pure principle.

      *   *Requirement 4: Additional Questions (Need 4-5 more to reach 7-8).*
          *   *Idea A: The "Slave Power" Conspiracy.* If the Constitution was antislavery, why did the Slave Power dominate for 60 years?
          *   *Idea B: The Dred Scott Decision.* How does Douglass's view survive Taney's ruling? (Actually, Douglass addressed this, but it's a good pressure point).
          *   *Idea C: The 10th Amendment/States Rights.* If slavery is state-level, how can the Feds abolish it? (Douglass argued federal power over territories and DC). Let's focus on the tension between federal power and state sovereignty.
          *   *Idea D: Comparison with Lincoln.* Lincoln thought the Constitution *tolerated* slavery where it existed but hated it. Douglass thought it *forbade* it. Who was right legally?
