prompt: |-
  David Lewis's "Humean supervenience" has been a recurring touchstone in the philosophy-of-physics threads I've followed for years: it's the thesis, named in Hume's honor, that all facts whatsoever—laws, chances, causation, counterfactuals—supervene on nothing but the spatiotemporal arrangement of local qualities (the "Humean mosaic"). It's a sharp test case in the broader Humean/anti-Humean dispute about laws of nature, because Lewis himself conceded that quantum mechanics might undo the doctrine: particles that violate a Bell inequality seem to be correlated in ways that don't supervene on any arrangement of local properties, a point philosophers of physics such as Tim Maudlin have pressed hard. Lewis's own response was to concede the threat while refusing to revise his metaphysics on the strength of physics he considered interpretively unsettled.

  Hume died in 1776, more than a century before J. J. Thomson identified the electron and nearly two centuries before Bell's theorem. Drawing as carefully as you can on his actual arguments about causation and induction in the Treatise and the first Enquiry, reconstruct how he would have reacted to this situation. Would he embrace "Humean supervenience" as the natural heir to his skepticism about necessary connection, siding with Lewis that entanglement poses a real threat to be resisted or somehow absorbed into the mosaic? Or would he see Lewis's mosaic—committed as it is to a privileged manifold of local, separable qualities—as smuggling in exactly the metaphysical baggage that his own, purely epistemic argument against necessary connections was meant to avoid, so that a consistent Humean empiricist should simply shrug at nonlocal correlations rather than see them as posing any threat at all? Stake out one of these readings, or a third if you think Hume would have gone somewhere else entirely, and defend it by appeal to what Hume actually argued—not to what later self-described Humeans have made of his name.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Prompt:**
      *   **Topic:** David Lewis's "Humean Supervenience" (HS) vs. David Hume's actual philosophy, specifically in light of quantum mechanics (QM) and Bell's theorem (non-locality/entanglement).
      *   **Core Question:** How would Hume himself react to the conflict between HS (which QM threatens) and QM?
      *   **Options:**
          1.  Embrace HS as the heir to his skepticism, seeing entanglement as a threat to be resisted/absorbed (Lewis's view).
          2.  Reject HS as smuggling in metaphysical baggage (local separability) that Hume's epistemic skepticism was meant to avoid, thus shrugging at non-local correlations.
          3.  A third option.
      *   **Constraint:** Base the argument on Hume's actual texts (*Treatise*, *Enquiry*), not later "Humean" interpretations.
      *   **Goal:** Stake out a reading and defend it.

  2.  **Deconstruct "Humean Supervenience" (Lewis):**
      *   *Thesis:* All truths supervene on the spatiotemporal distribution of local intrinsic properties (the "mosaic").
      *   *Metaphysical Commitment:* It's an ontological claim about the *structure of the world*. It assumes a world of distinct, separable existences arranged in space and time.
      *   *Lewis's Dilemma:* QM (Bell inequalities) suggests non-separability/non-locality. Lewis admitted this might falsify HS but hoped physics would change or an interpretation (like Many-Worlds or Bohmian) would save locality.

  3.  **Deconstruct Hume's Actual Philosophy:**
      *   *Epistemology vs. Ontology:* Hume is primarily an epistemologist/skeptic. He limits claims to what can be known via impressions/ideas. He is agnostic about the "secret springs" of nature.
      *   *Causation:* We never observe "necessary connection." We observe constant conjunction. Causation is a habit of the mind (projection), not a feature of the objects.
      *   *Substance/Matter:* Hume is skeptical about the idea of "substance" or underlying substratum. We only have perceptions.
      *   *Space and Time:* Hume has a very specific, somewhat atomistic view of space and time (minima sensibilia), but crucially, he denies we have an impression of "necessary connection" *between* objects.
      *   *Separability Principle:* "Whatever objects are different are distinguishable, and whatever objects are distinguishable are separable by the thought and imagination." (*Treatise* 1.1.7). This is often cited as the root of HS.
      *   *Skepticism about Hidden Powers:* Hume argues we cannot know *why* things happen, only *that* they happen.

  4.  **Evaluate the Conflict (Hume vs. Lewis vs. QM):**
      *   *Lewis's HS:* Ontological thesis. The world *is* a mosaic of local qualities.
      *   *Hume's View:* Epistemic thesis. We *conceive* of the world as distinct perceptions. We cannot know the ultimate nature of reality.
      *   *The Crux:* Lewis uses Hume's name to justify a specific *metaphysical* picture (local realism). Hume would likely reject the metaphysical certainty required to assert HS as a necessary truth about the world.
      *   *QM Non-locality:* If particles are entangled, their states are not locally determined. For Lewis, this breaks the mosaic. For Hume, does it matter?
      *   *Hume on "Secret Powers":* Hume explicitly says we don't know the bonds that tie cause to effect. If physics says "there is a non-local correlation," Hume says "Okay, that's the constant conjunction we observe." He wouldn't demand it supervene on local qualities because he doesn't believe we have access to the "qualities" in the Lewisian sense (intrinsic properties independent of perception).

  5.  **Formulate the Argument (The "Second Option" seems strongest):**
      *   *Thesis:* Hume would reject Lewis's Humean Supervenience as too metaphysically robust. He would side with the empiricist acceptance of the phenomena (QM correlations) rather than defending a priori constraints on the "mosaic."
      *   *Reasoning 1: Epistemic Humility.* Lewis treats HS as a metaphysical thesis about what *exists*. Hume treats his principles as descriptions of how we *conceive* and *infer*. Hume denies knowledge of the "ultimate springs" of nature. To insist on local supervenience is to claim knowledge of the intrinsic nature of things that Hume denies we have.
      *   *Reasoning 2: The Separability Principle.* Lewis relies on the idea that distinct existences are separable. Hume's separability principle is about *ideas/perceptions*, not necessarily mind-independent objects. If experience (QM) presents us with non-separable correlations, Hume's empiricism demands we follow experience, not an a priori metaphysical constraint derived from the *Treatise*.
      *   *Reasoning 3: Causation as Projection.* For Lewis, laws supervene on the mosaic. For Hume, "laws" are psychological habits. If QM shows non-local regularities, the mind forms a habit accordingly. There is no "fact of the matter" about the underlying ontology beyond the perceptions.
      *   *Reasoning 4: Agnosticism on Substance.* Lewis's "local qualities" imply intrinsic properties. Hume is skeptical of substrata. He wouldn't defend the "local qualities" part of the mosaic against empirical evidence.

  6.  **Refine the Argument (Anticipating Counter-arguments):**
      *   *Counter:* But Hume *did* argue for the separability principle. Doesn't that entail locality?
      *   *Rebuttal:* Hume's separability is about the *imagination*. If the imagination cannot separate two ideas (because experience always presents them together in a specific way), then they aren't separable *for us*. QM suggests nature doesn't respect our intuitive separability. Hume would adjust his conception of nature, not deny the physics.
      *   *Counter:* Lewis called it "Humean" for a reason.
      *   *Rebuttal:* Lewis was a systematic metaphysician; Hume was a mitigated skeptic. Lewis wanted a best-system analysis of laws; Hume wanted to dissolve the anxiety about not knowing necessary connections.

  7.  **Drafting the Response (incorporating textual evidence):**
      *   *Introduction:* Define the tension. Lewis = Metaphysical Realist about the Mosaic. Hume = Epistemic Skeptic about Powers.
      *   *Point 1: The Nature of the "Mosaic".* Lewis needs intrinsic properties. Hume denies we know intrinsic properties (*Enquiry* Section 4, Section 7).
      *   *Point 2: Separability.* *Treatise* 1.1.7. Distinguish between conceptual separability and ontological independence. Hume's principle is about ideas. If experience forces a conjunction, the mind accepts it.
      *   *Point 3: Necessity.* Lewis tries to save locality to save the supervenience base. Hume says there is no necessity in objects anyway (*Enquiry* Section 7). Why fight for local necessity if there's no necessity at all?
      *   *Point 4: The Role of Physics.* Hume defers to experience. If Bell's experiments are the "experiments," they trump metaphysical speculation.
      *   *Conclusion:* Hume would view Lewis's defense of HS as a relapse into dogmatic metaphysics. He would accept QM correlations as mere "constant conjunctions" without worrying about the local supervenience base.

  8.  **Self-Correction/Nuance Check:**
      *   Did Hume believe in space/time as a container? He had a theory of minima sensibilia. It's atomistic. This *looks* like Lewis's mosaic.
      *   *Correction:* Yes, Hume's phenomenology is atomistic. But Lewis's mosaic is *ontological*. Hume's atoms are *perceptual*. If physics says the underlying reality isn't locally separable, Hume (the skeptic about external reality) would say "We only know the perceptions." But if we are talking about the "external world" (which Hume treats as a natural belief), he wouldn't impose a priori constraints on it that contradict experience.
      *   *Key Distinction:* Lewis uses Hume to block necessary connections. Hume uses skepticism to block knowledge of *any* connections (local or non-local). Lewis thinks if you remove necessity, you get the mosaic. Hume thinks if you remove necessity, you get *ignorance* of the machinery, whatever it is.
      *   *Decision:* The strongest argument is that Lewis reified Hume's epistemology into an ontology. Hume would reject this reification.

  9.  **Final Polish:** Ensure tone is philosophical and rigorous. Cite *Treatise* and *Enquiry* specifically. (e.g., *Enquiry* IV on skepticism, *Treatise* 1.3 on causation).

      *(Self-Correction during drafting)*: I need to be careful not to make Hume a modern anti-realist. He believes in bodies via natural instinct. But he denies we know their *secret constitution*. Lewis's HS claims to know the *form* of that constitution (local qualities). Hume would deny we can know that form a priori.

      *Plan:*
      1.  Introduction: Lewis vs. Hume (Metaphysics vs. Epistemology).
      2.  The Status of "Local Qualities": Hume's skepticism about intrinsic properties.
      3.  The Separability Principle: Conceptual vs. Ontological.
      4.  Causation and Necessity: Why Hume doesn't need locality to deny necessity.
      5.  Conclusion: Hume sides with the phenomena (QM), not the metaphysics (HS).

  10. (Final Review against Prompt): Did I answer the specific question? Yes (Would he embrace HS or see it as baggage?). Did I use Hume's arguments? Yes. Did I address QM/Bell? Yes.

      *Let's write.*
answer: |-
  David Lewis's "Humean Supervenience" (HS) is a bold metaphysical thesis: that the whole truth about the world supervenes on the spatiotemporal distribution of local, intrinsic qualities. Lewis took this to be the natural ontological upshot of Hume's rejection of necessary connection. However, if we return to Hume's actual texts—principally *A Treatise of Human Nature* and *An Enquiry Concerning Human Understanding*—it becomes clear that Lewis transformed Hume's epistemic skepticism into a dogmatic ontology. 

  Consequently, Hume would not recognize Lewis's defense of the "mosaic" against quantum non-locality as faithful to his project. He would likely view Lewis's commitment to local separability as precisely the kind of unjustified metaphysical speculation his skepticism was designed to dismantle. A consistent Humean empiricist, drawing on the *Treatise* and *Enquiry*, would not see Bell's inequalities as a threat to be resisted; he would shrug at them. For Hume, the demand that correlations supervene on local qualities is not a requirement of empiricism, but a rationalist constraint smuggled into the name of "Humean."

  ### 1. The Ontological vs. Epistemic Divide
  The fundamental divergence lies in the modal status of their claims. Lewis treats HS as a claim about what *exists*: the world *is* a mosaic of local matters of particular fact. Hume, conversely, treats his principles as claims about what can be *known* or *conceived*.

  In *Enquiry* Section IV, Hume establishes that all reasoning concerning matter of fact is founded on the relation of cause and effect, and that our knowledge of this relation is derived entirely from experience. Crucially, in Section VII, Hume argues that we have no impression of "power" or "necessary connection" in objects. We observe constant conjunction, and the mind feels a determination to pass from one object to another. 

  Lewis uses this to argue that since there are no necessary connections, there is nothing to the world but the categorical base (the mosaic). But Hume's argument is agnostic, not eliminative. Hume writes in the *Enquiry* (Section IV, Part II) that we are "ignorant of those powers and principles" by which objects operate. He does not assert that the powers *do not exist*; he asserts that we cannot comprehend them. To assert that reality *must* be composed of local intrinsic qualities is to claim knowledge of the "secret constitution" of bodies, which Hume explicitly denies is possible. If quantum mechanics suggests that the "secret springs" of nature involve non-separable states, Hume's skepticism prevents him from ruling this out a priori. He would regard Lewis's insistence on locality as a dogmatic assertion about the unknowable essence of matter.

  ### 2. The Separability Principle and the "Mosaic"
  Lewis leans heavily on Hume's "Separability Principle" from *Treatise* 1.1.7: "Whatever objects are different are distinguishable, and whatever objects are distinguishable are separable by the thought and imagination." Lewis interprets this as an ontological claim: distinct spacetime points must have distinct, independent existences.

  However, Hume introduces this principle in the context of the *contents of the mind* (perceptions/ideas), not necessarily the mind-independent world. For Hume, the limit of what is separable is the limit of what the imagination can conceive. If empirical investigation (such as Bell test experiments) reveals that nature presents us with correlations that cannot be decomposed into local states, the Humean empiricist must adjust the ideas to fit the impressions. 

  In *Treatise* 1.3.6, Hume argues that "chance is merely the negation of a cause." He does not demand that the "cause" (or the regularity) be local; he demands only that we observe the regularity. If the "constant conjunction" observed in quantum mechanics is non-local, the mind will form a customary association accordingly. To insist that the conjunction *must* be grounded in local qualities is to impose a rationalist structure on experience. Hume would argue that if our experience (via physics) dictates that distinct particles behave as a single system, then our idea of "separability" must yield to the impression. Lewis's defense of the mosaic prioritizes a metaphysical principle over empirical data; Hume's empiricism prioritizes the data over metaphysical principles.

  ### 3. Causation as Projection, Not Structure
  Lewis's HS is motivated by a desire to save laws of nature without "necessary connection." He wants laws to be summaries of the mosaic. But for Hume, laws are not summaries of ontology; they are habits of the mind. 

  In *Treatise* 1.3.14, Hume concludes that necessity "is something that exists in the mind, not in objects." Lewis accepts the "not in objects" part but tries to reconstruct objectivity via the Best System Analysis of the mosaic. Hume would find this reconstruction unnecessary and overly ambitious. If an observer sees entangled particles correlate instantaneously across distance, the observer forms a causal expectation. Whether this expectation supervenes on local qualities is irrelevant to the psychological mechanism of causation. 

  Furthermore, Hume's skepticism about induction (*Enquiry* Section IV) implies that we have no rational justification for believing the future will resemble the past, regardless of whether the past is local or non-local. Lewis tries to secure a rational foothold for science via HS. Hume would point out that HS itself cannot be empirically verified (it is a metaphysical thesis about the supervenience base) and thus falls under the same skeptical scrutiny as the necessary connections it seeks to replace. To fight quantum mechanics to save HS is to fight an empirical observation to save a metaphysical hypothesis—a move Hume condemns in his critique of scholastic philosophy.

  ### 4. Hume's Likely Verdict
  Hume would likely view the Lewisian dilemma as a category error. Lewis assumes that to be a Humean is to be a *local realist*. Hume shows that to be a Humean is to be an *empiricist skeptic*.

  If confronted with Bell's theorem, Lewis feels tension because his metaphysics (the mosaic) conflicts with physics (non-locality). Hume would feel no such tension. For Hume:
  1.  **We do not know the intrinsic nature of objects.** Therefore, we cannot assert they *must* have local intrinsic properties.
  2.  **Causation is constant conjunction.** If non-local correlation is the conjunction, that is the cause.
  3.  **Metaphysics must yield to experience.** In *Enquiry* Section XII, Hume warns against "abstruse" reasoning that contradicts common life or established science. A metaphysical doctrine (HS) that requires rejecting or reinterpreting settled physics (QM) to maintain "local qualities" is precisely the kind of "false philosophy" Hume warns against.

  Hume would not see entanglement as a threat to "Humean" philosophy because his philosophy does not entail the "Supervenience" part of Lewis's label. Lewis's HS is a specific metaphysical wager that the world is simple and local. Hume's philosophy is a methodological caution that the world might be unknowable in its depths. 

  ### Conclusion
  David Lewis appropriated Hume's name for a metaphysical system that Hume's own epistemic limits would not permit. Lewis's "Humean Supervenience" smuggles in a robust commitment to local separability that functions as a synthetic a priori constraint on physical theory. Hume, the skeptic who denied we could know the "ultimate springs" of nature, would reject this constraint. He would argue that if experiment demonstrates non-local correlations, then the "mosaic" of local qualities is a fiction of the metaphysician, not a demand of empiricism. 

  Hume would not side with Lewis in resisting quantum non-locality. He would side with the physicists, viewing the non-local correlations as simply another instance of constant conjunction, devoid of comprehensible necessity, requiring no further reduction to a local base. He would tell Lewis that in trying to save the mosaic, he has abandoned the skepticism that made Hume's name worth invoking.
