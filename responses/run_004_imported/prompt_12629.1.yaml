  2.  **Deconstruct the Arguments:**

      *   **The Allais Choices:**
          *   Problem 1: $1M for sure (1A) vs. 89% $1M, 10% $5M, 1% $0 (1B). Most pick 1A.
          *   Problem 2: 11% $1M, 89% $0 (2A) vs. 10% $5M, 90% $0 (2B). Most pick 2B.
          *   *Violation:* If $u(1M) > 0.89u(1M) + 0.1u(5M) + 0.01u(0)$, then algebraically you must prefer 2A over 2B. Picking 1A and 2B violates Independence.

      *   **Theorist A (EUT/Savage):**
          *   *Core Claim:* Rationality requires consistency. If you prefer A to B, you should prefer A+C to B+C.
          *   *Attack:* Money Pump / Dynamic Inconsistency. If you hold these preferences, I can trade you back and forth and take your money.
          *   *Normative Stance:* axioms are constitutive of rationality. If intuition conflicts with axioms, intuition is wrong.

      *   **Theorist B (Risk-Weighted/Non-EUT):**
          *   *Core Claim:* Independence ignores the *context* of the gamble (the spread, the common consequence). Caring about security (minimizing regret or variance) is rational.
          *   *Defense against Money Pump:* The money pump requires a specific setup (sequential choices with knowledge of previous outcomes) that doesn't match the one-shot nature of the Allais problem. Or, they accept some "cost" for their risk attitude as a premium for security.
          *   *Specific Framework:* Lara Buchak's *Risk-Weighted Expected Utility* (REU) is the strongest modern normative defense. It introduces a risk function $r(p)$ that transforms probabilities non-linearly based on risk attitude, without needing reference points (unlike Prospect Theory).
          *   *Normative Stance:* EUT is too thin. Rationality allows for different attitudes toward risk structures, not just outcomes.

  3.  **Drafting - Section by Section:**

