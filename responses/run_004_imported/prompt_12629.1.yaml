          2.  Agent prefers 1A (sure thing). Pay $\epsilon$ to switch to 1A.
          3.  Now Agent has 1A.
          4.  But wait, the Money Pump usually relies on dynamic inconsistency in sequential choices. The Allais paradox is usually presented as simultaneous.
          5.  *Better argument:* The "Sure-Thing Principle" violation. If you prefer 1A over 1B, you are saying the 89% common chunk makes the 1% risk of zero unacceptable. But in choice 2, you remove the common chunk. If the common chunk is irrelevant (Independence), your preference shouldn't flip.
          6.  *A's angle:* If you violate Independence, you can be induced to make trades that leave you worse off in every state of the world.
          7.  *B's angle:* The states aren't evaluated in isolation. The *correlation* of outcomes matters.

      *   *Refining the Money Pump:* The strongest money pump argument against Allais preferences involves sequential choices where the agent doesn't pre-commit. If I offer you Choice 1, you pick Sure. Then I offer you a chance to switch to the Gamble based on Choice 2 preferences... actually, the classic money pump relies on the agent failing to recognize that two situations are equivalent.
      *   *Let's stick to the "Dutch Book" style argument:* If you violate independence, there exists a set of bets you will accept that guarantees a loss.
      *   *Actually, the strongest EUT argument is Dynamic Consistency:* If you plan to take the Sure Thing, but at the moment of choice you act on the Gamble preference because the context shifted, you are inconsistent.
      *   *Let's have Elena focus on the "Separability" of states.*

      *(Self-Correction on Money Pump)*: The money pump for Allais is tricky because it's usually a one-shot. The dynamic inconsistency arises if you face the choice *before* the common consequence is resolved.
      *   Scenario: You choose between 1A and 1B.
