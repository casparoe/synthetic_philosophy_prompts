  *   If you want to maximize the chance of finding the molecule in the place where it has the most freedom (maximum entropy), you should look in the South.

  The clue tells you that the North Wing is more structured than you thought. In the absence of any reason to prefer structure over randomness, the principle of indifference suggests you should favor the random (South) over the structured (North).

  ### The Takeaway
  The disagreement underneath is about **what counts as a "fact."**
  *   Mia treats the 50/50 Wing split as a fact that can only be changed by direct evidence about the Wings.
  *   Priya treats the 50/50 Wing split as a consequence of total ignorance. Since the clue removes some ignorance from the North Wing, the split must change to reflect the new asymmetry in knowledge.

  Priya's result feels strange because our brains are wired like Mia's: we like to compartmentalize information. But in strict probabilistic reasoning, making one part of the world more predictable *does* make the other parts relatively more probable if you want to remain maximally open-minded. Priya's math is correct for the method she chose; Mia's intuition is correct for how humans usually talk, but it hides an extra assumption.

