answer: |-
  Your roommate is technically correct according to the standard framework you are likely studying in your decision theory course, but your intuition is also defended by significant developments in behavioral economics and philosophy. What you experienced is a famous problem known as the **Allais Paradox**.

  Here is a breakdown of why your roommate says you contradicted yourself, why it *feels* like you didn't, and what that implies about the definition of "rationality."

  ### 1. The Roommate's Argument: Expected Utility Theory
  In standard decision theory, rationality is usually defined by **Expected Utility Theory (EUT)**. A core axiom of EUT is the **Independence Axiom**. This axiom states that if you prefer Option X to Option Y, you should still prefer X to Y even if both are combined with a third, identical uncertain outcome.

  Let's look at the math of your two scenarios. We can rewrite your Trivia Night choices to reveal the hidden structure:

  *   **Trivia Option A (Safe):** 100% chance of $100.
      *   *Mathematically equivalent to:* 89% chance of $100 + **11% chance of $100**.
  *   **Trivia Option B (Risky):** 89% chance of $100 + 10% chance of $500 + 1% chance of $0.

  Notice that **89% of the outcome is identical** in both options (you get $100). According to the Independence Axiom, a rational agent should ignore the common 89% and focus only on the remaining 11%.
  *   **The Core Choice:** Compare **11% chance of $100** (from Option A) vs. **10% chance of $500 + 1% chance of $0** (from Option B).
  *   **Your Choice:** You preferred the 11% chance of $100.

  Now look at the Raffle:
  *   **Raffle Option C:** 11% chance of $100 + 89% chance of $0.
  *   **Raffle Option D:** 10% chance of $500 + 90% chance of $0.
      *   *Mathematically equivalent to:* 10% chance of $500 + **1% chance of $0** + **89% chance of $0**.

  Again, **89% of the outcome is identical** (you get $0). If you ignore that common 89%, you are left with the exact same Core Choice as above:
  *   **The Core Choice:** Compare **11% chance of $100** vs. **10% chance of $500 + 1% chance of $0**.
  *   **Your Choice:** You preferred the 10% chance of $500.

  **The Contradiction:** In the first scenario, you indicated that the "11% chance of $100" is more valuable. In the second, you indicated it is less valuable. Under Expected Utility Theory, this is inconsistent. No single utility function for money can satisfy both preferences simultaneously. Your roommate is right that, within the standard course framework, this is a violation of rationality.

  ### 2. Your Intuition: The Certainty Effect
  If the math is identical, why does the first choice feel so different from the second? You noted that "giving up something guaranteed seemed like a genuinely different kind of decision."

  You have identified what psychologists Daniel Kahneman and Amos Tversky called the **Certainty Effect**. Human beings do not perceive probabilities linearly.
  *   The drop from **100% to 89%** feels psychologically massive. You are losing the quality of *certainty*.
  *   The drop from **11% to 10%** feels negligible. Both are unlikely.

  In the trivia night, the fear of walking away with nothing (the 1% risk) when you *could* have had $100 for sure generates a specific emotional cost (anticipatory regret) that isn't present in the raffle. In the raffle, you expect to lose anyway; both options are "long shots," so you might as well go for the bigger prize.

  ### 3. Are You Actually Irrational?
  This is the philosophical heart of your question. Is EUT the final word on rationality, or is it just a model that fails to capture human values?

  **Argument for "Yes, you were irrational" (Normative EUT):**
  If you accept the axioms of EUT as the definition of rationality, then yes, the choices are inconsistent. The logic is that the "common consequence" (the 89%) should not sway your preference because it cancels out. If you wouldn't bet on the $100 in the raffle scenario, you shouldn't "bet" on it in the trivia scenario just because it's wrapped in a guarantee.

  **Argument for "No, you were rational" (Alternative Models):**
  Many philosophers and economists argue that EUT is too narrow. There are principled bases for your choices that require different models:

  1.  **Regret Theory:** This model suggests people maximize expected utility *minus* expected regret.
      *   In the Trivia Night, if you choose the risky envelope and get $0, you will feel crushing regret knowing you passed up a guaranteed $100.
      *   In the Raffle, if you choose the $500 ticket and lose, you feel little regret because the other ticket probably would have lost too.
      *   Minimizing regret is a coherent, rational goal, even if EUT doesn't model it.
  2.  **Prospect Theory:** This descriptive model argues that people value gains and losses relative to a reference point, and they weight probabilities non-linearly (overweighting small probabilities and the certainty of 100%). Under this framework, your choices are perfectly consistent with how humans value risk.
  3.  **The Value of Certainty:** One could argue that "certainty" itself has utility. A guaranteed $100 allows you to plan with 100% confidence. An 89% chance does not. If you value the *state of knowing* you have the money, preferring Option A is rational, even if the expected monetary value is lower.

  ### Conclusion
  Your roommate is right **within the context of your course**. If you are being tested on Expected Utility Theory, the correct answer is that these preferences violate the Independence Axiom and cannot be represented by a single utility function.

  However, you are right **in a broader philosophical and psychological context**. Your choices reflect a consistent aversion to regret and a high valuation of certainty. You did not make a "mistake" in processing information; you simply applied a decision heuristic that prioritizes emotional security over mathematical consistency.

  The Allais Paradox is famous precisely because it shows that standard decision theory often clashes with intuitive rationality. Most people make the exact same choices you did. Rather than viewing it as a personal error, view it as evidence that the standard model (EUT) is sometimes insufficient to capture the complexity of human values.

  **Summary for your course:** You violated the Independence Axiom.
  **Summary for life:** You minimized regret and valued certainty, which is a defensible strategy.
