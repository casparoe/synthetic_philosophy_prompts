      *   *Character B (The Pragmatist/Soft Liner):* Needs to represent the view that the obstacle is an artifact of overly strict provability criteria. Let's call him **Marcus**. He leans towards logical induction, probabilistic reasoning, and bounded rationality (Garrabrant, Christiano, etc.).
