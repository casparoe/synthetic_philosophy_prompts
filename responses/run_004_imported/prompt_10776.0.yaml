answer: |-
  Good evening. For those who don't know me, I'm [Name]. I had the privilege of being Priya's dissertation advisor. And if you know Priya, you know she doesn't do anything halfway. Including falling in love.

  Most couples meet at a bar, or through friends, or on an app. Priya and Theo met in my dissertation seminar. Their courtship didn't begin with flowers; it began with a dispute over the *Groundwork of the Metaphysics of Morals*.

  Specifically, they argued about the "numb philanthropist." This is a famous thought experiment where a person loses all sympathy for humanity but keeps helping people purely because it's the right thing to do. Priya, channeling Barbara Herman, argued this is the peak of moral worth. It's pure. It's reliable. It's duty for duty's sake.

  Theo, arguing for the Arpaly side, called that moral fetishism. He said helping someone because you actually *care* about them—like Huck Finn helping Jim—is morally richer than helping them because you're following a rule.

  I tell you this not just to prove they are nerds—though they are—but because this argument is the backbone of their marriage. I'm told there is a running bit where one makes the other coffee, and the other asks, dead serious: "Is this out of love, or out of duty?"

  Now, as Priya's advisor, my sympathies run Kantian. I believe in the sanctity of the promise. But if I stand here today and tell you that Duty wins, I do a disservice to Theo, and to marriage itself. Because Theo is right: A relationship without spontaneous affection is a contract, not a romance. If you only stay because you "have to," you've lost the spark.

  But Priya is right, too. Because inclination is fickle. Feelings fade. We all have days where we are the "numb philanthropist," where we are tired, or stressed, or just don't *feel* like being kind. On those days, the "Huck Finn" instinct might not show up. And that is when you need the Kantian engine. You need to do the right thing *because it is the right thing*, because you made a vow, even when the feelings are quiet.

  The brilliance of Priya and Theo's relationship isn't that one of them solved the argument. It's that they refuse to let the other get comfortable. When they ask, "Is this love or duty?" they aren't trapping each other. They are checking the vitals of the marriage. They are ensuring they have both the warmth of inclination and the steel of commitment.

  To the non-philosophers in the room: What this means is that they have built a love that is both passionate and durable. They have the fire to enjoy the good times, and the structure to endure the hard ones.

  So, Priya and Theo, my advice is to never resolve this debate. Keep litigating the moral worth of your morning coffee. Keep challenging each other on whether you are acting from inclination or obligation. Because in the end, a great marriage is the only place where those two things become indistinguishable. Where doing your duty *is* the highest expression of your love.

  Please raise your glasses. To Priya and Theo: May your inclinations always be warm, and your duties always be light. To the bride and groom.
