answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Wei's cousin. I'm also the "philosophy person" in the family, which is a polite way of saying I'm currently studying for my comprehensive exams while everyone else is having a nice time. **Honestly, Wei threatened to cut me off if I messed this up, and since I can't afford to lose family support during dissertation season, the stakes feel significantly higher than my actual oral defense.**

  I was told I have toast duty precisely because of what I study. And I know that for some of you, that raises a specific kind of anxiety. There tends to be two stories about marriage floating around in this room.

  On one side, there's the traditional view: Marriage is a sacred structure, a ritual role that completes us. We become full persons by taking our proper place in the family. On the other side, there's the modern view: Marriage is a contract between two independent individuals who "find" each other, like two distinct puzzle pieces clicking together.

  Usually, people think you have to pick a side. But the tradition I study—Confucian role ethics—suggests both of those stories get it slightly wrong.

  There is an idea in this philosophy that we are not static nouns. We are not pre-packaged selves who walk around waiting to be chosen. Instead, we are more like verbs. We are constituted by where we stand. There's a phrase my professors use: we are a "focus in a field." You are the sum of your relationships, concentrated in one spot.

  So, Wei, when I look at you, I don't see a standalone individual who is about to lose her independence. And I don't see someone simply filling a slot labeled "Wife." I see a focus that is about to expand its field.

  I know you've worried that taking on this role means dissolving into it. That "becoming a wife" means becoming smaller. But in this tradition, filling a role well isn't about obedience. It's about *yi*—appropriateness. And it requires *quan*—moral discretion.

  There's a famous story in the *Mencius* about a man who asks: "Ritual says men and women shouldn't touch. But if my sister-in-law is drowning, should I save her?" The answer is yes. If you don't save her, you're a wolf. The rule is real, but the *weighing* of the situation matters more. Rigid rule-following isn't virtue; it's actually a failure of humanity.

  Wei, you're finishing your JD. You know better than anyone that the law isn't a script you read blindly. It's a practice that requires judgment, nerve, and sometimes, the courage to interpret the spirit over the letter.

  That is what this view of marriage offers you. It's not a cage. It's a practice that demands your full intelligence. To be a partner in this deep sense doesn't mean suppressing your sharpness or your opinions. It means applying that sharpness to the shared project of a life. It means having the discretion to know when to follow the script and when to throw it out because the situation demands care.

  And to [Fiancé's Name], this applies to you, too. You aren't "completing" Wei. You are entering a field with her where you will both be constantly remade by the challenges you take on together.

  So, to the parents: Thank you for teaching us that relationships matter more than isolation. And to the friends: Thank you for reminding us that those relationships must be chosen freely and lived creatively.

  Wei, you are not disappearing into this marriage. You are bringing your whole, difficult, brilliant self into a new field, and you are going to cultivate it with the same rigor you bring to everything else.

  Please raise your glasses. To Wei and [Fiancé's Name]. May your field be wide, your judgment be sharp, and your *quan* always be weighted toward joy.

  To the couple.
