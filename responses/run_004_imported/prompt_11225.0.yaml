answer: |-
  **The Archivist of Simples**

  In the Institute of Ontic Hygiene, the furniture was notoriously uncomfortable. This was not a matter of budget, but of doctrine. We adhered strictly to van Inwagen's Organicism: composition occurs only when the activity of the *xs* constitutes a life. Consequently, the room contained no chairs, no tables, and no lamps. It contained only simples arranged chairwise, tablewise, and lampwise. To sit was to perch upon a cloud of atoms that, lacking the internal causal unity of a living organism, possessed no more ontological weight than a scattered pile of sand.

  I, Elías, was the Archivist. My duty was to maintain the Census of Beings. In a world where mountains and ships are merely fictions of language, the Census was a slender volume. It listed the bacteria in the ventilation filters, the mold in the grout, the potted fern in the corner, and the staff themselves. We were the only things that existed. The rest was geometry without substance.

  The difficulty of my profession is not often understood. It is easy to dismiss a chair as a fiction. It is much harder to determine where one life ends and another begins, for it is only at that boundary that existence flickers into being.

  The crisis arrived on a Tuesday, centered on Specimen 89-B.

  89-B was a *Physarum polycephalum*, a slime mould, housed in a glass terrarium on the only surface in the room that I acknowledged as a table (it was not a table; it was a slab of wood, but I sat upon a stool that was, biologically, a dried gourd, and thus a dead organism, which posed its own categorical problems). The mould was a bright, venous yellow, a single cell containing millions of nuclei, pulsing with a slow, peristaltic rhythm. It was, by our lights, a genuine object. A *y* composed of *xs*.

  The experiment was simple. We had divided 89-B three weeks prior, slicing the plasmodium in two with a sterile scalpel. We placed the halves at opposite ends of the terrarium. At that moment, the Census required two entries: 89-B-1 and 89-B-2. Two lives, two objects. The *xs* of the left side were caught up in one life; the *xs* of the right side in another.

  Now, they had grown toward each other.

  I sat on my gourd-stool, pen hovering over the ledger. The yellow veins of 89-B-1 stretched out like probing fingers. The veins of 89-B-2 mirrored them. The air in the Institute was still. The non-existent chairs around me offered no support, reminding me that if I stood, I would fall through the arrangement of wood and air just as surely as a ghost.

  The question was not biological. Biologically, the merger was inevitable. The question was mereological.

  Van Inwagen's criterion relies on the phrase "constitutes a life." Singular. When the two fronts touched, would the activity of the combined *xs* constitute *one* life, or would it constitute two lives operating in extreme proximity? If the former, then at the moment of contact, 89-B-1 and 89-B-2 would cease to exist, and a new object, 89-B-Prime, would pop into existence. If the latter, they would remain distinct, merely sharing a border.

  This is the terror of Organicism. In the universalist view, the merging changes nothing; the two patches were always parts of a larger composite object, just as they were parts of the universe. In the nihilist view, nothing exists but the atoms, so the merging is a dance of particles with no ontological consequence. But for us, for the Organacists, existence is binary and fragile. Objects are born and die constantly, contingent on the flow of nutrients and the firing of synapses.

  The yellow veins touched.

  I held my breath. In the glass box, the cytoplasm began to flow across the boundary. There was no hesitation. The protoplasm of the left merged with the protoplasm of the right. A single rhythm emerged, a unified pulsing that swept across the entire span of the terrarium.

  I looked at the Census.

  If I crossed out 89-B-1 and 89-B-2 and wrote 89-B-Prime, I was asserting that a death had occurred. Two beings had vanished. In their place, a new being stood. But where was the corpse? There was no decay. The matter remained. The activity continued. It was a death by fusion, an ontological subsumption.

  If I kept both entries, I was asserting that the flow of matter between them was irrelevant to their identity. I was claiming that a life is defined by its history, not its current causal unity. But if I cut 89-B-Prime in half again tomorrow, would the original twins return? Or would they be new children of the parent?

  The puzzle of the Special Composition Question is usually presented as a static riddle: *Do these bricks make a wall?* But in the terrarium, it was a temporal thriller. *When* do these bricks make a wall? *When* does the wall cease to be two walls?

  I watched the yellow network thicken. It was solving a maze we had set for it, finding the shortest path between two oat flakes. The intelligence of the action suggested a singular agent. A committee of two slime moulds would require negotiation; this was immediate coordination. The *xs* were undeniably caught up in a single event.

  Yet, I hesitated. To record the merger was to accept vagueness. For there was no precise second where the touch became a union. There was a moment of membrane contact, then a moment of pore formation, then a flow. At which micro-second did the *one life* begin? If existence has sharp boundaries, then there must be a precise atom-transfer that triggered the birth of 89-B-Prime. But nature offers no such precision. The border was fuzzy.

  If the boundary of the object is fuzzy, can the object be real?

  I thought of the chair I had sat on yesterday. I had treated it as a fiction, a collection of simples arranged chairwise. But if the slime mould, with its fuzzy boundaries, counts as a real object because it is alive, then why does the chair not count? The chair maintains its shape through external forces (glue, nails) just as the mould maintains its shape through internal pressure. The difference is only the source of the unity: external versus internal.

  But what is a life, if not a process that resists entropy? The chair resists entropy too, just more passively.

  The yellow pulsing quickened. The mould had reached the second oat flake. It was feeding. The entire mass shuddered in a single wave of satisfaction.

  I realized then that the Census was not a description of the world, but a prescription. By writing "One Object," I was not discovering a fact; I was granting a license to exist. Van Inwagen believed he was describing the furniture of the universe, but he was merely drawing lines in the sand and commanding the tide to respect them.

  I dipped my pen. The ink was black, a stark contrast to the yellow life in the glass.

  If I wrote "One," I validated the intuition that unity is found in causal connection. If I wrote "Two," I validated the intuition that identity is found in origin. Both were defensible. Both were arbitrary.

  I looked around the room. The empty chairs waited for sitters who would never arrive, because the sitters, like the chairs, were merely arrangements of particles, unless I decided otherwise. The Institute was a cathedral of silence, built on the refusal to acknowledge the composite dead.

  I wrote: *Specimen 89-B. Status: Indeterminate.*

  It was a heresy. In mereology, there is no indeterminate composition. Either the *xs* compose a *y*, or they do not. To allow a third option was to collapse the system. It was to admit that the Special Composition Question has no answer, or rather, that the answer is not in the objects, but in the observer.

  I closed the ledger. The slime mould continued to pulse, indifferent to its own ontology. It existed because it lived, regardless of whether I counted it as one or two. It was the only thing in the room that did not need my permission to be whole.

  I stood up from the gourd-stool. My legs, composed of cells caught up in the life that was Elías, supported me. I walked to the window. Outside, the city sprawled, a vast landscape of non-existent buildings and imaginary roads, populated by billions of walking, talking lives, all of them screaming silently into the void, demanding to be counted as one.

  I placed my hand against the glass. My skin touched the pane. The simples of my hand and the simples of the glass did not compose a new object. We remained separate. I was alone. The mould was alone. And between us lay the vast, empty geometry of the world, waiting for a life to catch it up and make it real.
