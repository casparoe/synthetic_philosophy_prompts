  2.  **Deconstruct the Technical Concept (Löb's Theorem & Program Equilibrium):**
      *   *The Problem:* In game theory (Prisoner's Dilemma), rational agents defect. If I say "I'll cooperate if you cooperate," you say "I'll cooperate if you cooperate," and we spiral into infinite recursion without action.
      *   *The Solution (Program Equilibrium):* Agents read each other's source code.
      *   *FairBot:* Cooperates if it can *prove* the other agent cooperates.
      *   *Löb's Theorem:* Roughly, if it's provable that "if P is provable, then P," then P is true. In this context: If I can prove that you will cooperate *if* you can prove I will cooperate, then we both cooperate. It creates a stable fixed point of trust without infinite simulation.
      *   *The Metaphor:* Marriage vows act as the "public source code" that allows for this fixed point of trust.

