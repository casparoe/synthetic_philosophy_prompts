prompt: |-
  Ok this might be a weird ask but I think you guys can help me think this through. My best friend's marriage fell apart a few months ago after her husband cheated, and when it all came out he kept saying stuff like "I wouldn't have done this if you hadn't completely shut me out that whole year after your dad died." She's now torn on how much to actually blame him for it — like, does that count as a genuine mitigating factor, or is it just a convenient story he's telling himself after the fact to feel less guilty? I'm a few years into a PhD in philosophy of religion, and this whole thing reminds me a lot of stuff that comes up in my work on divine foreknowledge, specifically the question of whether it's even coherent to say there's a fact of the matter about what a free person WOULD have done under circumstances that never actually happened. My advisor keeps pushing back on wether such claims can be true (or false) at all before anyone actually acts on them, since nothing ever grounds them. Now I keep noticing this same structure everywhere, including in my friend's situation, and I honestly don't know if that literature gives us any real traction on cases like hers or if it's just a dead end outside of pure abstraction. Would genuinely love help thinking through whether "he would have done otherwise under different conditions" is a legitimate thing we can use to judge someone's culpability, or whether the whole idea falls apart once you actually try to use it on a real person.
