answer: |-
  Here is the strongest version of your friend's argument, structured to support your feature's narrative arc. It treats the undermining problem not as a technical glitch, but as a metaphysical indictment of Humean chance.

  ***

  ### The Retroactive Decree: Why the New Principle Fails to Save Humean Chance

  Your friend is right to be unsatisfied. The standard narrative in the literature is that Lewis's "New Principle" (NP) is a successful patch—a way to save Humean Supervenience from a logical contradiction. But this view mistakes a syntactic fix for a metaphysical solution. The undermining problem isn't a bug in the Principal Principle; it is a symptom of a category error in the Humean definition of chance itself.

  The core argument is this: **Objective chance is essentially a *guide* for credence. A fact cannot guide your belief about the future if that fact is metaphysically constituted by the very future you are trying to predict.** Lewis's New Principle attempts to hide this circularity, but it cannot eliminate it. Because Humean chance is defined by the total history of the world (the "mosaic"), it is partially constituted by future events. Therefore, Humean "chance" lacks the temporal and metaphysical asymmetry required to function as objective chance.

  Here is the breakdown of why the New Principle is a relabeling rather than a repair, and why this forces us toward a primitivist or propensity view.

  #### 1. The Metaphysical Loop
  The Principal Principle (PP) demands a specific directional relationship: **Chance $\rightarrow$ Credence.**
  If the objective chance of Heads is 50%, your credence should be 50%. The chance fact is the *reason* for the credence.

  However, under Humean Supervenience, the relationship is reversed (or at least bidirectional). The chance fact *supervenes* on the total pattern of events in the mosaic, which includes the future.
  **Future Events $\rightarrow$ Chance $\rightarrow$ Credence.**

  This creates a vicious loop. You are being asked to set your credence based on a fact (the chance) that is not fully fixed until your credence (and the subsequent actions/events) are realized.
  When Lewis introduces the New Principle ($Cr(A | T_w H_t) = x$), he asks you to conditionalize on $T_w$ (the true theory of chance for the world). But for a Humean, $T_w$ is a summary of the *entire* history of the world. To know $T_w$ is to know the future frequencies.

  If you are at time $t$, you do not know $T_w$. You only know candidates for $T_w$. If you conditionalize on "The theory that *will turn out* to be the Best System," you are conditionalizing on a future fact. If you conditionalize on "The theory that *currently looks* like the Best System," you are not conditionalizing on the objective chance, but on your best guess of it. The NP requires you to treat $T_w$ as given, but Humeanism makes $T_w$ contingent on the future. You cannot use a future-contingent fact as a present constraint on rationality without begging the question.

  #### 2. The "Admissibility" Shell Game
  Lewis tried to solve the original undermining problem by declaring undermining futures "inadmissible" information. The idea was that you shouldn't let knowledge of the future frequency override the current chance.

  Your friend's critique cuts deeper: **For a Humean, *all* future information is effectively inadmissible, because all future information determines the chance.**

  If chance is just a summary of frequencies, then *any* deviation in the future frequency is, by definition, a change in the chance. The distinction between "the chance is 0.5 but the frequency deviates" (which PP handles) and "the frequency deviates so the chance was never 0.5" (which undermines PP) collapses.
  In a Humean world, there is no such thing as a "deviation" from chance in the long run. There is only the pattern. If the pattern changes, the chance changes.

  Therefore, the NP asks you to conditionalize on a theory ($T_w$) that claims to fix the chances, while admitting that the truth of that theory depends on the outcome of the very tosses you are assigning credence to. This isn't a solution; it's asking the agent to pretend the metaphysical dependency doesn't exist. It asks the agent to treat a retrospective summary as a prospective law.

  #### 3. The Normative Failure
  The most damning point for your feature is the normative one. We care about objective chance because we think it should *guide* action and belief. It tells us how much to worry, how to bet, what to expect.

  But Humean chance cannot guide. Imagine a physicist telling you: "You should believe this atom has a 50% chance of decaying."
  *   **Primitivist/Propensity:** This means the atom *now* possesses a physical property (a propensity) that warrants 50% confidence. The property exists independently of whether it decays.
  *   **Humean:** This means "In the final history of the universe, the best summary of events will include a rule assigning 50% to this decay."

  Notice the difference? The Humean statement is a prophecy about the *final bookkeeping of the universe*. Why should that bookkeeping rule constrain your belief *now*?
  If the future turns out differently, the Humean must say, "Well, the chance wasn't actually 50%." This renders the concept of chance useless for guiding expectation. It turns "chance" into a label we stick on events *after* they happen, pretending we knew it beforehand.

  The undermining problem proves that Humean chance is **epistemically inaccessible** in the way required by the PP. The PP requires that chance be a fixed point around which credence orbits. Humeanism makes chance a moving target that only settles when the world ends. You cannot navigate by a star that moves depending on where you sail.

  #### 4. The Primitivist Escape
  This is why your friend is right to point toward primitivism or propensity theories. These views posit chance as a **categorical physical property** located in the present moment.
  *   On a propensity view, a coin has a physical disposition to land Heads 50% of the time.
  *   If the coin lands Heads 100% of the time, the propensity view says: "That was incredibly unlucky, but the propensity was still 0.5."
  *   The Humean view says: "If it landed Heads 100% of the time, the chance *was* 1.0."

  The propensity view breaks the metaphysical loop. The chance fact is fixed by the present physical setup, not the future frequency. Therefore, the future cannot "undermine" the present chance, because the present chance does not depend on the future. The Principal Principle works seamlessly here because the direction of fit is correct: **Present Physical Property $\rightarrow$ Rational Credence.**

  #### The Bottom Line for Your Piece
  The undermining problem is not a technical wrinkle; it is a reductio ad absurdum of Humean chance. It demonstrates that you cannot have it both ways:
  1.  You cannot define chance as a summary of the total history (Humeanism).
  2.  And simultaneously claim that chance is a normative guide for present belief (Principal Principle).

  Lewis's New Principle tries to keep both by using complex conditionalization to mask the dependency. But as your friend argues, this is merely moving the contradiction from the object level to the meta-level. It asks agents to treat a contingent, future-dependent summary as a necessary, present constraint.

  If we want a concept of chance that actually does the work we need it to do—grounding prediction, explanation, and rational decision—we must abandon the idea that chance supervenes on the mosaic. We must accept that chance is a real, irreducible feature of the present world, not a shadow cast by the future. The undermining problem isn't something to be solved; it's a signpost telling us we've gone down the wrong metaphysical road.
