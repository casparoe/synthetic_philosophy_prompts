answer: |-
  This is a heavy burden to carry, and it is understandable that your cousin's disclosure sent you searching for a framework rigid enough to hold the weight of it. G.E.M. Anscombe is perhaps the sharpest tool available for this specific job. She was not a pacifist, but she was an absolutist regarding the intentional killing of the innocent.

  To answer your question directly: **Anscombe would almost certainly classify both "double tap" strikes on responders and loose "signature strikes" as Truman-style murder, and she would likely reject the Principle of Double Effect (PDE) as a defense for them.**

  Here is how she would map her specific distinction between *intended means* and *merely foreseen consequences* onto these tactics.

  ### 1. The Core Distinction: Intention vs. Foresight
  Anscombe's argument in "Mr. Truman's Degree" rests on the **description of the action**. She argues that you cannot judge morality by looking at the outcome (consequentialism); you must look at what the agent *intends*.

  *   **Intended:** What you aim to bring about; what is necessary for your plan to succeed. If X must happen for your goal to be achieved, you intend X.
  *   **Merely Foreseen:** What happens as a result of your action, but if it *didn't* happen, your plan would still succeed (and you might even prefer it didn't happen).

  For Anscombe, Truman was a murderer because the death of civilians was not a "side effect" of hitting a factory; the death of civilians *was the mechanism* of surrender. The terror *was* the point. Therefore, the deaths were intended.

  ### 2. Applying this to "Double Tap" Strikes
  In a double tap strike where the second missile is delayed until responders arrive, Anscombe would scrutinize the **timing** and the **target description**.

  **The Argument for Murder (Truman-Style):**
  If the operator waits specifically for people to run in and help before striking, the presence of those people has become a condition of the strike's execution.
  *   **The Means:** If the goal is to kill the original target, why wait? If the goal is to kill the *responders* (to prevent future aid, to punish association, or to eliminate witnesses), then their death is the **end** or the **means**.
  *   **The Description:** Under what description is the operator acting? Is it "I am finishing off the wounded combatant"? Or is it "I am striking the group that has formed"?
  *   **Anscombe's Verdict:** If the strike is timed to coincide with the arrival of medics or bystanders, Anscombe would argue their death is no longer "collateral damage" (merely foreseen). By waiting for them to gather, the operator has integrated their presence into the kill chain. Their death becomes part of the operational success condition. This mirrors Truman: the civilians are not an unfortunate accident; they are part of the target package. That makes it intentional killing of innocents, which Anscombe defines as murder.

  **Is there a Double Effect Defense?**
  The only way Double Effect applies here is if the second strike was *solely* to ensure the death of a confirmed combatant who was playing dead, and the death of the responders was truly incidental.
  *   **Anscombe's Rebuttal:** She would likely reject this. If you know with near certainty that helpers will die, and you strike *because* they are there (using them as a proxy for the target or to maximize casualties), you are willing their death. You cannot claim their death is "unintended" if your tactic relies on their presence to trigger the weapon.

  ### 3. Applying this to "Signature Strikes"
  Signature strikes target individuals based on behavior patterns (e.g., "military-age males carrying weapons in a specific zone") rather than confirmed identity.

  **The Argument for Murder (Truman-Style):**
  Anscombe would focus on the **certainty of innocence**.
  *   **The Description:** When Truman dropped the bomb, he knew innocents were inside. When a drone operator conducts a signature strike, they know with high probability that innocents fit the "signature."
  *   **Intention:** If I shoot at a "pattern" rather than a "confirmed combatant," under what description am I killing the person who dies? I am killing "a person who fits the pattern." If that person turns out to be a shepherd with a rifle for protection (a common scenario), did I intend to kill a combatant? No. I intended to kill a pattern-fitter.
  *   **Anscombe's Verdict:** Anscombe would argue that if the criteria for the "signature" are broad enough to include innocents, and you strike anyway, you are treating innocent life as expendable material. You are effectively saying, "I intend to kill whoever is in this circle, regardless of whether they are actually guilty." This collapses the distinction between combatant and non-combatant. For Anscombe, this is functionally identical to Truman's logic: the death of the innocent is accepted as the *cost* of the strategy, making it an intended part of the war-making mechanism.

  **Is there a Double Effect Defense?**
  Proponents argue the death of innocents is "foreseen but not intended" because the *intent* is to kill terrorists.
  *   **Anscombe's Rebuttal:** She would argue this is a misuse of Double Effect. Double Effect requires that the bad effect (civilian death) not be the *means* to the good effect. In signature strikes, the "terror" or "disruption" caused by striking uncertain targets is often part of the strategic value. Furthermore, Anscombe demands a high bar of certainty. If you proceed without positive identification, you are acting recklessly regarding the innocence of the target. For Anscombe, recklessness with innocent life when you have the power to verify identity borders on intentional killing.

  ### 4. Why Anscombe Would Reject the "Saved Lives" Argument
  You mentioned your cousin's context involves the "it saved more lives overall" justification. Anscombe explicitly demolishes this in "Mr. Truman's Degree."

  She argues that **consequences do not justify intrinsically evil acts.** Even if killing 100,000 civilians ends a war and saves 1,000,000 lives, if the mechanism you chose was the *intentional killing of those 100,000*, you are a murderer. She believed that adopting a utilitarian calculus ("the ends justify the means") corrupts the moral agent and the society that employs them.

  She would say the same to the drone program: The fact that Reaper strikes might degrade a network and save US soldiers' lives does not change the moral description of the act. If the act involves intending the death of innocents (via double taps or loose signatures), it is murder, regardless of the strategic utility.

  ### Summary of Anscombe's Likely Judgment
  1.  **Double Tap on Responders:** **Murder.** The timing implies the responders' presence is utilized for the strike. Their death is likely intended as a means (to ensure target death or deter aid), not merely foreseen.
  2.  **Signature Strikes:** **Murder (or close to it).** Targeting based on probability rather than identity treats innocent life as a statistical acceptable loss. This makes their potential death part of the plan's calculus, not a true side effect.
  3.  **Double Effect Defense:** **Failed.** Both tactics likely fail the test because the death of innocents is too integrated into the success of the operation (either through timing or target definition) to be considered "merely foreseen."

  ### A Note on the Human Cost
  Anscombe's philosophy is cold, but her motivation was deeply human. She protested Truman's degree because she believed that calling murder "statecraft" destroys our ability to recognize evil.

  If you are struggling with this, it is because your moral intuition is aligning with Anscombe's: **The distinction between "collateral damage" and "intended target" matters.** When tactics blur that line (like waiting for medics to arrive), it violates the fundamental rule of non-combatant immunity.

  Your cousin carried this for six years before speaking. Anscombe would tell you that his discomfort is not a weakness; it is evidence that his conscience recognizes the moral reality of the act, despite the uniform he wore or the orders he followed. She would argue that acknowledging this as murder is the only way to stop the "Truman logic" from becoming the permanent standard of warfare.
