prompt: |-
  my cousin was an Air Force sensor operator on Reaper drones for like 6 years, and over Thanksgiving he finally opened up about being part of a "double tap" strike - hitting the same spot again once people ran in to help the wounded from the first hit. I haven't been able to shake it, so I went down a rabbit hole and ended up reading Anscombe's old pamphlet "Mr. Truman's Degree." Her whole point there is that Truman deserved no honorary degree because he chose to kill huge numbers of innocent civilians as the actual mechanism for ending the war - terrorizing Japan into surrendering - not as some regrettable side effect of hitting a legit military target, and that no amount of "it saved more lives overall" turns that into anything but murder.

  I keep trying to map her argument onto what my cousin described, and onto "signature strikes" generally (targeting based on behavior patterns instead of confirmed identity). Using her actual intend-as-a-means vs merely-foreseen distinction, not just generic double-effect talking points, what do you think she'd say about double-tap and signature strikes? Do they count as Truman-style murder by her lights, or is there something about them that could actually earn the double-effect defense she refused to extend to Hiroshima?
