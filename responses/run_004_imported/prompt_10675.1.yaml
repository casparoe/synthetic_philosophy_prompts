answer: |-
  Based on Sidgwick's correspondence, his founding principles for the Society for Psychical Research (SPR), and the concluding chapters of *The Methods of Ethics*, his reaction to the Bem affair and the subsequent replication crisis would likely be a complex mixture of **methodological vindication** and **philosophical despair**. He would view the collapse of "Feeling the Future" not as a failure of science, but as a tragic confirmation of the very epistemic standards he spent his life trying to enforce.

  Here is a reconstruction of his reaction, grounded in his specific epistemic commitments.

  ### 1. On Bem's Methodology: "The Old Enemy of Coincidence"
  Sidgwick would not have been shocked by Bem's initial publication, nor would he have been immediately dismissive. Sidgwick was one of the first thinkers to apply statistical aggregation to anecdotal phenomena (most notably in the SPR's "Census of Hallucinations"). He understood that individual testimony was worthless, but that large-scale deviations from chance could theoretically constitute evidence.

  He would recognize Bem's logic as the same logic the SPR used in the 1880s: *If the probability of this result occurring by chance is sufficiently low, we must posit a new cause.* Sidgwick spent decades wrestling with the mathematical theory of errors to ensure the SPR wasn't fooled by the "law of large numbers."

  However, Sidgwick was acutely aware of what modern psychologists call "researcher degrees of freedom." In his investigations of mediums, he constantly battled the problem of "selective reporting"—where successes are recorded and failures ignored. He would likely look at Bem's multiple experiments and post-hoc analyses with deep suspicion. In an 1886 letter to Frederic Myers, Sidgwick wrote of the difficulty in distinguishing "genuine abnormal phenomena" from "unconscious exaggeration or error." He would see Bem's p-values not as proof, but as a preliminary signal that required the exacting scrutiny that followed.

  ### 2. On the Replication Crisis: Vindication of SPR Rigor
  When Bem's results failed to replicate, Sidgwick would not view this as a scandal, but as the proper functioning of the empirical method he championed. The SPR was founded specifically to create a buffer between "credulity" and "scoffing." Sidgwick's goal was to subject extraordinary claims to a level of scrutiny that would strip away fraud, error, and coincidence.

  The field's subsequent turn toward **preregistration and open data** would strike Sidgwick as the logical maturation of the SPR's original protocol. The SPR required detailed logs, independent witnesses, and controlled conditions to prevent self-deception. Preregistration is simply the digital-age equivalent of the Sidgwickian demand that the rules of the experiment be fixed *before* the phenomenon is invited to appear.

  He would likely argue that the replication crisis proved his central thesis about psychical research: **the signal is so weak (if it exists at all) that it is indistinguishable from noise without extreme methodological constraints.** He would see the collapse of Bem's findings as a victory for the "rigor he pioneered." It would confirm his belief that the human mind is inherently prone to find patterns where none exist, and that only draconian methodological discipline can correct for this bias.

  ### 3. On the Philosophical Consequence: Deepening Melancholy
  This is where the reconstruction turns somber. For Sidgwick, psychical research was not a hobby; it was a rescue mission for ethics. In *The Methods of Ethics*, he concludes that without a belief in divine justice or personal survival, there is no rational way to reconcile the conflict between **Rational Egoism** (what is best for me) and **Rational Benevolence** (what is best for all). If death is the end, the egoist is rational to ignore morality when it conflicts with self-interest.

  Sidgwick hoped that empirical proof of survival would provide the "sanction" needed to make morality rational. If Bem's results had held up—if precognition were proven—it would imply a universe where time and causality are not as materialism suggests, opening the door for the spiritual reality Sidgwick needed to resolve the Dualism.

  Watching Bem's results collapse would therefore deepen his "old melancholy." He would see it as another missed opportunity to close the gap between duty and self-interest. In his final years, Sidgwick admitted to a friend that he had found "no evidence of a kind which would convince a reasonable skeptic." The failure of Bem's experiments to survive scrutiny would simply be the 21st-century echo of his own life's conclusion: **the universe remains silent.**

  ### 4. The Sidgwickian Synthesis: "Honesty Over Hope"
  Ultimately, Sidgwick's reaction would be defined by his commitment to **intellectual integrity over emotional comfort**. He famously wrote that he could not bring himself to believe a proposition simply because it was morally necessary.

  He would likely issue a judgment similar to his final verdict on the SPR:
  1.  **Methodologically:** The failure of Bem's work validates the necessity of the replication movement. It proves that "statistical significance" alone is insufficient without structural safeguards against bias. This is a triumph of the empirical spirit.
  2.  **Metaphysically:** The null result leaves the "Dualism of Practical Reason" intact. We are still left without a rational guarantee that virtue pays.
  3.  **Ethically:** We must continue to act morally *despite* the lack of evidence. Sidgwick lived with this tension, refusing to embrace dogmatic religion or nihilistic egoism. He would urge modern psychologists and ethicists to do the same: accept the methodological victory of replication, accept the metaphysical silence, and continue to uphold duty as a fundamental intuition, even if it cannot be rationally reconciled with self-interest.

  In short, Sidgwick would view the Bem affair as a **tragic vindication**. He would be pleased that science is now rigorous enough to catch its own errors (validating his life's work in methodology), but sorrowful that the errors caught were the very ones that might have saved ethics from its foundational crisis (validating his life's fear). He would conclude, as he did in 1900, that we must act as if the moral order is real, even if the empirical evidence remains, frustratingly, out of reach.
