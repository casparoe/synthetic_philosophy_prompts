answer: |-
  This is a sharp observation, and you are right to sense that the literature often blurs the line. The short answer is: **They are structurally isomorphic problems deployed for opposite metaphysical ends, but they got historically tangled because Russell was trying to solve Bradley's problem without accepting Bradley's solution.**

  Here is the breakdown of the moving parts so you can write about this without butchering the nuance.

  ### 1. Two Regresses, One Structure, Opposite Aims
  You have correctly identified the two contexts.
  *   **Bradley's Metaphysical Regress (*Appearance and Reality*):** This is destructive. Bradley argues that if a relation $R$ is distinct from its terms $A$ and $B$, it requires a further relation $R'$ to connect $R$ to $A$, and so on *ad infinitum*. For Bradley, this proves relations are unintelligible and therefore unreal (appearances). The conclusion is **Monism**: only the Absolute is real.
  *   **Russell's Logical Regress (*Principles of Mathematics*):** This is constructive (or rather, a crisis of construction). Russell wants to save relations (Pluralism). But he notices that if you analyze a proposition like "$A$ differs from $B$" into its constituents ($A$, $B$, Difference), you get a mere list, not a unified claim that can be true or false. If the relation is just another term, what binds it? If you add a binding relation, you trigger Bradley's Regress.

  **Are they the same?** Structurally, yes. Both ask: *How do distinct entities hook up to form a unity?*
  **Are they the same job?** No. Bradley uses the regress to **eliminate** relations. Russell encounters the regress as an obstacle to **explaining** how propositions work.

  The "conflation" you see isn't necessarily sloppy; it's acknowledging that Russell was fighting Bradley's ghost. Russell realized that to defend realism about relations, he had to solve Bradley's regress without concluding that relations are unreal. He needed a "terminus" for the regress that Bradley denied existed.

  ### 2. Frege's "Unsaturated" Move: Escape or Relocation?
  Frege's solution is to introduce a **categorial distinction**. Objects are "saturated"; Concepts (functions) are "unsaturated." The relation isn't a third thing sitting between two objects; it's a function that *demands* completion by objects.

  **Does it escape the regress?**
  *   **The Fregean Defense:** Yes. The regress only starts if you treat the relation as an object (a nameable entity). By making the concept fundamentally different in logical type, you cannot ask for a "relation" between the function and the argument in the same way you ask for a relation between two objects. To ask "what binds the function to the argument?" is a category mistake. The binding is internal to the nature of the function.
  *   **The Critic's View (Wittgenstein, Dummett, etc.):** It relocates the problem. It posits a kind of magical "fit" or "glue" (unsaturatedness) without explaining *how* it works. If unsaturatedness is a property of the concept, how does *that* property hook onto the object? If it's not a property, what is it? Critics argue Frege stops the regress by **fiat** (stipulating a logical type difference) rather than by metaphysical explanation. He makes the problem unaskable rather than solving it.

  For your piece, the safest nuanced take is: **Frege dissolves the regress by changing the rules of the game (logic/types), but he does not satisfy the metaphysical intuition that demands a mechanism for unity.**

  ### 3. Russell's Multiple Relation Theory (MRTJ) & Wittgenstein
  This is where the circle closes. Around 1910, Russell abandoned the proposition as a single complex entity (partly because of the problem of false propositions: if "A loves B" is false, does a non-existent complex exist?).

  He switched to the **Multiple Relation Theory of Judgment**: Judging is not a relation between a mind and a *proposition*; it is a multiple relation between a mind and the *constituents* ($S$ judges $a$, $R$, $b$).

  **Did he run face-first into Bradley's problem?**
  **Yes.** By breaking the proposition into a list of objects ($a, R, b$) related by the mind, Russell stripped the relation $R$ of its "relating" power. In the judgment complex, $R$ is just another object.
  *   **Bradley's Old Point:** If $R$ is just an object, it doesn't relate $a$ and $b$.
  *   **Wittgenstein's Torpedo:** In *Notes on Logic* (1913), Wittgenstein argued that MRTJ cannot distinguish sense from nonsense. If judgment is just $J(S, a, R, b)$, nothing prevents $S$ from judging "this table penholders the book." The theory lacks a constraint on **logical form**.

  Wittgenstein's point was essentially a revival of the Unity of the Proposition problem. For a judgment to be possible, the constituents must already be capable of combining. But if they are capable of combining on their own, you don't need the mind to relate them (Bradley's point). If they aren't, the mind can't force them to combine logically.

  Russell's MRTJ was an attempt to avoid the ontological commitment to "false complexes," but in doing so, he made the relation inert, resurrecting Bradley's regress inside the theory of judgment. He needed the relation to *relate* inside the judgment, but his theory treated it as a *term*.

  ### Summary for your piece
  1.  **The Conflation:** It is not sloppy. It is a recognition that the **Problem of Unity** (logic) and the **Problem of Relations** (metaphysics) are two sides of the same coin. Bradley used the regress to destroy the coin; Russell tried to mint a new one.
  2.  **Frege:** Escapes the regress only by declaring it a category mistake. It works for logic, but leaves the metaphysical "hook" mysterious.
  3.  **Russell's MRTJ:** Was indeed a collision with Bradley's problem. By trying to avoid false entities, Russell made relations inert terms again. Wittgenstein showed that without a pre-existing logical form (unity), you can't even judge nonsense, let alone truth.

  **The Deep Connection:** The "tangle" exists because early analytic philosophy was born trying to refute Bradley's Idealism. Consequently, even when analytic philosophers (like Russell) were doing "logic," they were often solving metaphysical problems left by Bradley. The "Unity of the Proposition" *is* the secularized, logical version of "The Reality of Relations."

  If you need a punchline: **Bradley showed that relations require a glue; Russell spent 20 years trying to find a glue that wasn't just more relations, only for Wittgenstein to tell him the glue was in the logic, not the psychology.**
