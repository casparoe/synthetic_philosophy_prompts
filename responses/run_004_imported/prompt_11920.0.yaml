answer: |-
  Thank you. For those who don't know me, I was Marguerite's student fifteen years ago, and for the rest of her life, one of her many unofficial sounding boards.

  Marguerite left typed instructions for today. One line reads: "Do not let anyone up there call me punctual. I would rather be laughed at than lied for."

  I intend to honor that. But for the philosophers in the room, and for her family who simply knew her as Aunt Maggie, honoring that instruction creates a specific problem. One that Marguerite would have loved.

  Marguerite's career was built on the ethics of blame. She argued that when a person condemns a fault they share, they don't just look bad—they forfeit the *standing* to raise the issue at all. She called this being "out of order." If you are late, she taught, you cannot blame others for lateness. You have lost the moral authority to make the demand.

  And Marguerite was, by any objective measure, a hypocrite on this point. In thirty-one years, she never started a lecture or a meeting within ten minutes of the hour. She called lateness "a small daily theft," yet she stole those minutes from us, constantly.

  So, here I am. Standing at this podium. About to highlight her hypocrisy.

  By Marguerite's own definitions, I risk being out of order. To blame the dead is a strange act; they cannot answer, cannot apologize, cannot reform. And to highlight a flaw while claiming to honor the person feels like a violation of the gentle silence we usually offer the departed. If I bring this up simply to get a laugh, I am using her flaw for my performance. That would be a theft of its own.

  But I believe there is a way through this, using her own tools.

  First, Marguerite granted me standing. She wrote the note. She invited the truth, even if it was uncomfortable. In her own framework, she waived the privilege of silence. She demanded that we not treat her memory as fragile.

  Second, and more importantly, a eulogy is not a tribunal. It is not an act of blame. When we speak of a loved one's flaws here, we are not trying to punish or correct. We are trying to see them whole. To smooth over Marguerite's lateness would be to present a stranger. It would be to say that only the perfect parts of her were real.

  She taught us that moral life is messy. She taught that we are all, constantly, negotiating our standing with one another. She was capable of piercing insight into the nature of fairness, and incapable of catching a bus. She could write a devastating op-ed on the morality of waiting, and then keep a graduate student waiting in the hall for twenty minutes while she finished a thought.

  Was this frustrating? Yes. Was it hypocritical? Absolutely. But was it malicious? Never.

  Her lateness was not a disregard for us; it was often an over-regard for the person currently in front of her, or the thought currently in her head. She lived in the intensity of the moment, even when the schedule demanded she live in the future. She was human in a way that her own rigorous standards technically forbade, but which her heart demanded.

  To the family and friends here: You knew this. You knew that if Marguerite said she'd be there at six, you brought a book. But you also knew that when she arrived, she was entirely *there*. She didn't check her phone. She didn't look at the clock. She gave you the gift of her full attention, even if it started late.

  To the colleagues and students: We know we lost a brilliant mind. But we also lost a woman who held herself to a standard of truth that frightened most of us. She knew she was late. She knew she was contradicting herself. And she asked us, today, to acknowledge it.

  She taught that hypocrisy forfeits the standing to blame. But I think she also showed us that honesty restores the standing to be loved.

  By telling the truth about her lateness, I am not blaming her. I am testifying to her integrity. She wanted a community built on truth, not on polite fictions. She wanted us to know that you can be brilliant and flawed, rigorous and messy, "out of order" and yet deeply, profoundly right about what matters.

  So, I will not call her punctual. I will not lie for her.

  I will say that she was often late, but she was never absent. She was often contradictory, but she was never false. And while she may have forfeited the standing to complain about our tardiness, she earned, through thirty years of honesty and care, the standing to ask us to love her exactly as she was.

  Thank you, Marguerite, for the lesson. And for the permission to tell it.
