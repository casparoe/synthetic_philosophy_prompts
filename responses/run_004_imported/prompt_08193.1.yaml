  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s sister and Maid of Honor.

  I'll be honest: preparing this speech was intimidating. Not because I'm nervous about public speaking, but because I'm giving a speech about love to a woman who has spent the last six years studying the evolutionary biology of deception.

  [Sister's Name] is an expert in behavioral ecology. Specifically, she studies costly signaling and the handicap principle. For my grandmother and the rest of the family, that basically means she knows exactly why peacocks have those massive, glittering tails. It turns out, the tail is heavy and awkward and makes it harder to escape predators. It's a liability. But that's exactly the point. Because it is so difficult to carry, it proves to the world that the peacock is strong enough to survive *despite* the burden. It's a signal that is honest precisely because it is too expensive to fake.

  When I first started thinking about this toast, I worried that applying this theory to a wedding felt cold. It's easy to hear "costly signaling" and think, "Oh, so marriage is just a transaction? So we're just animals trading resources?"

  But the more I thought about it, the more I realized that [Sister's Name]'s research isn't cynical. It's actually incredibly romantic.

  Because the theory tells us that "cheap talk" doesn't work. In biology, and in life, anyone can say "I love you." It costs nothing to say. But love isn't built on what costs nothing. It's built on the things that *do* cost.

  It costs to show up when you're tired. It costs to be vulnerable when you're scared. It costs to support someone else's dream even when it means putting your own on hold for a while. And [Partner's Name], I have watched you send those signals clearly. I saw it when you drove four hours to bring her dinner during her dissertation crunch. I saw it in the patience you showed when she was stressed about fieldwork, and in the way you celebrate her wins as if they were your own.

  You have demonstrated that your commitment is a "handicap" in the best sense of the word. You are willing to carry the weight.

  And [Sister's Name], you've done the same. You've invested time, energy, and heart into this relationship, not because it was easy, but because [Partner's Name] was worth the investment.

  Now, I know about a third of the people in this room are from [Sister's Name]'s old lab. I want to assure you that I know the difference between a Zahavi handicap and a Grafen equilibrium, and I am aware that an index signal is physically constrained while a handicap is strategically costly. (Pause for laughter/nods). I promise I am not conflating them. I'm just saying that whatever the mathematical model says, the data here is robust: this couple has established a stable, honest signaling equilibrium.

  But for the rest of us, you don't need the math to see the truth. You just need to look at them.

  There was a study a few years ago that tried to correlate wedding spending with marriage length. Some people say spending too much is bad. But I think that misses the point. It's not about the dollar amount on the dress or the venue. It's about the willingness to invest. It's about gathering all of us here—family, friends, colleagues—and making a public declaration that requires effort to maintain.

  The "cost" of a marriage isn't the price tag of the wedding. The cost is the daily choice to prioritize another person above yourself. And the fact that [Sister's Name] and [Partner's Name] are willing to pay that price is the only proof we need that this signal is honest.

  So, if a peacock's tail is a promise of genetic fitness, then this marriage is a promise of something far more enduring. It is a promise that when things get heavy, you won't drop the burden. You will carry it together.

  [Sister's Name], you've spent your career studying how animals prove they are worthy. Today, you don't need a theory to prove anything. You just need to look at the person standing next to you.

  Please raise your glasses.

  To the cost, to the effort, and to the honesty of it all. To [Sister's Name] and [Partner's Name].
