      *   *The Intuitive Hook:* The choice function *must* respect extensional equality. But extensional equality of these sets is equivalent to $P$. So the choice function effectively decides $P$ by its behavior.

  7.  **Addressing CC/DC specifically:**
      *   CC says: $\forall n \exists x \phi(n,x) \implies \exists f \forall n \phi(n, f(n))$.
