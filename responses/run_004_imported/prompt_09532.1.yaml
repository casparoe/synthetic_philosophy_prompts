      *   *Resolution:* In IZF, the sets $A$ and $B$ are not necessarily "standard" sets in the domain of CC in the same way.
      *   *Actually, the standard resolution:* Diaconescu's theorem holds for **Full** AC. It does *not* hold for Countable Choice. Why? Because to apply CC, you need a sequence of sets $(X_n)_{n \in \mathbb{N}}$. To define the sequence $X_0=A, X_1=B$, you need to know that $A$ and $B$ are well-defined sets. They are.
      *   *The Catch:* The catch is in the **Extensionality of the Choice Function**. Full AC provides a function $f: \mathcal{P}(S) \to S$. This function *must* respect extensional equality of sets ($X=Y \implies f(X)=f(Y)$).
      *   CC provides a sequence $x_n$. It does not provide a function on the *sets themselves*, but rather a selection based on the *index*.
      *   *Crucial Distinction:* Full AC chooses based on the *identity of the set*. CC chooses based on the *index of the set*.
      *   In Diaconescu: If $P$ is true, $A=B$. Full AC requires $f(A)=f(B)$. This forces the choices to be identical.
      *   With CC: We define $X_0=A, X_1=B$. Even if $A=B$ (extensionally), $X_0$ and $X_1$ are distinct *indices*. CC allows us to pick $x_0 \in X_0$ and $x_1 \in X_1$. It does *not* require $x_0 = x_1$ even if $X_0 = X_1$ extensionally, because the choice depends on the index $n$, not the extension of $X_n$.
      *   *Bingo:* This is the core intuition. Full AC is **extensional** (depends on what the set *is*). CC is **intensional** (depends on how the set is *indexed*). Diaconescu exploits the extensionality requirement.

