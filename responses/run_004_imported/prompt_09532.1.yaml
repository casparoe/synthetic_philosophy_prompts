      *   *Correction:* CC *does* imply a limited form of excluded middle if applied to *all* subsets of $\mathbb{N}$. But in Bishop's math, CC is restricted to *constructive* sets.
      *   *Ah, the nuance:* In IZF, CC does *not* imply LEM. Why does Diaconescu fail for CC?
      *   Diaconescu uses the Power Set axiom implicitly to form $A$ and $B$ as objects to be chosen from. Full AC applies to the Power Set. CC applies to sequences.
      *   *Key Insight:* The Diaconescu argument requires the choice function to be defined on the *collection* $\{A, B\}$. Full AC says there is a function on $\mathcal{P}(S) \setminus \{\emptyset\}$. CC says there is a function on $\mathbb{N} \to \bigcup X_n$.
