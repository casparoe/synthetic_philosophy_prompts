      *   *Standard Proof:* Let $P$ be a proposition. Define $A = \{x \in \{0,1\} \mid x=0 \lor P\}$ and $B = \{x \in \{0,1\} \mid x=1 \lor P\}$. Both are inhabited (0 is in A, 1 is in B). AC gives a choice function $f$. Let $a = f(A)$ and $b = f(B)$. If $a=b$, then $P$ holds. If $a \neq b$, then $\neg P$ holds (actually, it implies $P \lor \neg P$).
