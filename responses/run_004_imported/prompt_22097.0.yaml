      *   **The Hanson Pushback:** Alex asks *why* the priors differ. "We grew up in the same town, listened to the same tapes."
      *   **The Deep Dive (The Crux):** Jordan needs to explain the origin of the prior without just saying "because I'm me." This is the hard part. Jordan needs to argue for indexicality or something fundamental about consciousness/valuation that isn't shared information.
