      *   *Check:* Is the 1755 critique too harsh? *Correction:* Kant was actually fond of his 1755 work but recognized its speculative excess. I should note that he might see it as a "dream" of reason.
      *   *Check:* Fermi Paradox relies on probability. Kant hates probabilistic metaphysics. Emphasize that.
