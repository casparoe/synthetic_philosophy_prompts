answer: |-
  This is a fantastic knot to untangle. You have hit on one of the most productive tensions in contemporary moral philosophy regarding the "standing to blame."

  The confusion you are experiencing is understandable because both accounts explain why a blame interaction fails, but they diagnose the *pathology* differently. One diagnoses a failure of **consistency** (Wallace), and the other diagnoses a failure of **authority** derived from innocence (Cohen).

  Here is the breakdown of the two views, their application to your Oil Exec case, and a verdict on whether the disagreement is verbal or substantive.

  ### 1. R. Jay Wallace: The Equal Standing Account
  **Core Text:** *Responsibility and the Moral Sentiments* (and later papers on standing).

  **The Theory:**
  For Wallace, blame is fundamentally a **communicative address**. When I blame you, I am not just registering a negative judgment; I am demanding that you acknowledge a moral claim that binds us both. This practice presupposes a relationship of **moral equality**.

  *   **The Violation:** Hypocrisy undermines standing because it violates this equality. When I blame you for $X$ while I do $X$, I am implicitly claiming a **normative exemption**. I am acting as though the moral norm binds you but does not bind me.
  *   **The Condition for Standing:** To have standing, I must be committed to the norm I am invoking. I must be willing to apply it to myself.
  *   **The Nuance:** Wallace allows that a past violator can regain standing. If I violated the norm in the past but now acknowledge my fault, hold myself accountable, and genuinely submit to the norm, I restore the equal standing. The sin is not the *violation* itself, but the *attitude of exemption* during the act of blaming.

  **In short:** You lose standing if you claim to be *above* the rule you are enforcing.

  ### 2. G.A. Cohen: The Complicity Account
  **Core Text:** "Casting the First Stone" (1991).

  **The Theory:**
  Cohen is less concerned with the logical consistency of the blamer and more concerned with the **moral authority** required to condemn. He argues that to condemn a wrong, one must not be **implicated** in the conditions that produce that wrong.

  *   **The Violation:** It is not merely about doing the *same token act* (e.g., "I also stole bread"). It is about being complicit in the *structural injustice* that makes the act occur. If I benefit from a system that forces others into wrongdoing, or if I helped create the conditions for the wrongdoing, my hands are not clean.
  *   **The Condition for Standing:** You need a degree of "innocence" regarding the *type* of harm. If you are a beneficiary of the injustice you are condemning, your condemnation is morally muted, regardless of whether you currently violate the specific norm.
  *   **The Nuance:** Cohen is stricter than Wallace. Even if I am not currently doing the bad thing, if I am profiting from the system that causes it, I lack the standing to condemn those who are crushed by that system.

  **In short:** You lose standing if your hands are *dirty* from the system that produced the harm, even if you aren't currently committing the harm.

  ---

  ### 3. The Case Study: The Reformed Oil Exec
  **The Scenario:** A former oil executive made millions facilitating fossil fuel extraction (but never drilled a well personally). They are now a climate activist shaming everyday people for their individual carbon footprints (flying, driving, eating meat).

  #### The Wallace Verdict
  Wallace would ask: **Is the exec claiming an exemption from the norm they are enforcing?**

  *   **The Norm:** If the norm is "Do not contribute to climate change," the exec might argue, "I am not contributing anymore. I have divested. I live simply."
  *   **The Hypocrisy Charge:** If the exec is currently living a low-carbon life, Wallace might say they **retain standing**. The fact that they violated the norm *in the past* does not permanently strip standing, provided they now acknowledge that past violation and submit to the norm.
  *   **The Catch:** Wallace would only strip standing if the exec acts as though their *past* emissions don't count, or if they are secretly still living high-carbon while preaching austerity. If they are genuinely reformed, Wallace says: "They can blame. They are no longer claiming an exemption."

  **Intuition Check:** Does this feel right? Many people would feel uneasy here. We might think, "Okay, you're reformed, but you got rich destroying the planet. Who are you to yell at me for taking a flight I need for work?" Wallace's view might feel too forgiving of the *history* of the blamer.

  #### The Cohen Verdict
  Cohen would ask: **Is the exec implicated in the background injustice?**

  *   **The Injustice:** The structural devastation of the climate by the fossil fuel industry.
  *   **The Complicity:** The exec didn't drill the wells, but they facilitated the industry and **profited** from the harm. They are a beneficiary of the very system they are now condemning the everyday people for participating in.
  *   **The Standing:** Cohen would likely argue the exec **lacks standing**. The everyday people are often trapped in a high-carbon infrastructure built by people like the exec. For the exec to condemn the individuals for participating in the system they (the exec) monetized is to ignore their own causal and beneficiary role in the structural wrong.

  **Intuition Check:** This tracks closer to the visceral reaction against the exec. The resentment isn't just "you do it too" (Wallace); it's "you built the trap I'm stuck in" (Cohen).

  ---

  ### 4. The Verdict: Is the Disagreement Real?

  The disagreement between Wallace and Cohen is **substantive, not verbal.** They are identifying two different necessary conditions for standing.

  1.  **Wallace identifies a *procedural* defect:** The blame fails because the *transaction* is unfair (unequal application of the rule).
  2.  **Cohen identifies a *historical/structural* defect:** The blame fails because the *agent* is tainted by the context of the wrong.

  **Which tracks the intuition better?**
  For your specific case (The Oil Exec), **Cohen tracks the intuition better.**

  Here is why: In modern political discourse, when people scream "Hypocrite!" at figures like this, they rarely mean it in the strict Wallaceian sense (i.e., "You are currently flying a private jet while telling me to recycle"). They often mean it in the Cohenian sense (i.e., "You are structurally complicit in the harm you are blaming me for").

  If you use Wallace, the Oil Exec can easily escape the charge by saying, "I acknowledge my past sins, I am reformed, therefore I have equal standing now."
  If you use Cohen, the Oil Exec cannot escape the charge easily, because their wealth and history remain a form of complicity that undermines their moral authority to scold victims of the industry.

  ### 5. Implications for Your Piece on Political Call-Outs

  This distinction is gold for your writing on political hypocrisy. Here is the thesis suggestion:

  **Most political "hypocrisy" call-outs are actually Cohenian complicity charges masquerading as Wallaceian consistency charges.**

  When a politician is called a hypocrite for taking a private jet to a climate summit:
  *   **Wallace says:** They lose standing *only if* they claim they are exempt from the rule while taking the jet. If they say, "This is wrong, I'm doing it for necessity, and I accept the blame," Wallace says they keep standing.
  *   **The Public says:** "You don't get to lecture us." This is a Cohenian intuition. The public feels the politician is *implicated* in a system of privilege that makes their carbon footprint inevitable, while the public is punished for theirs.

  **Conclusion:**
  The "Hypocrite!" shout in politics is often a clumsy way of expressing a **Cohenian loss of authority**. The crowd is sensing that the blamer is too embedded in the structural injustice to have the moral right to condemn the little guy. Wallace explains why *liars* lose standing; Cohen explains why *beneficiaries* lose standing. In politics, we are usually angry at the beneficiaries.

  If you frame your piece around this distinction, you can argue that the "Hypocrisy" label has become a catch-all term for any loss of standing, blurring the line between *normative inconsistency* (Wallace) and *structural complicity* (Cohen). Recognizing the difference clarifies why some hypocrisy call-outs feel justified even when the politician isn't technically lying, and why others feel like cheap shots.
