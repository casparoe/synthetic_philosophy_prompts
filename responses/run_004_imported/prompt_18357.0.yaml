          *   Therefore, persistence $\rightarrow$ bounded surprise $\rightarrow$ minimizing variational free energy.
          *   *Crucial distinction:* This is a mathematical derivation, not an empirical hypothesis. You can't falsify math, only the applicability of the math to the system.
      *   **Normative vs. Descriptive:**
          *   FEP is normative (what a system *must* do to exist).
          *   PC/Active Inference is descriptive (how the brain *actually* implements it).
          *   The value of FEP isn't predicting *that* a neuron fires, but constraining *what kind* of architectures are possible.
      *   **The "Dressing Up" Charge:**
          *   Is it just unification? Yes, but unification has value. It connects thermodynamics, information theory, and biology.
          *   Does it generate *new* predictions? Defenders say yes: it predicts specific architectures (e.g., hierarchical reciprocal connectivity) that might not be obvious otherwise.
      *   **The Microscopist's Angle:** Relate it back to the user's experience. A cell maintains homeostasis. FEP says homeostasis *is* inference. That's a category shift, not just a mechanism description.
      *   **The Verdict:** Summarize the current state of play. It's a research program, not a settled law.

