  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Compensation and Governance Committee of a small nonprofit legal aid clinic.
      *   **Task:** Draft a short memo to the full committee ahead of a vote.
