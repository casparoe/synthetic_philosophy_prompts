  okay so apparently theres this whole tiktok/twitter thing that went around a while back about how alot of people dont have an inner monologue and just think without any words at all. doesnt that basically disprove the language of thought hypothesis in philosophy of mind? like if thought is literally made of language then everyone should be narrating their thoughts in words, but plenty of people think with zero verbal narration, so the theory cant be a general theory of how minds work, right?
