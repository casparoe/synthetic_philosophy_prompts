answer: |-
  Here is an argument designed to pressure-test the surrogate-goal strategy, focusing on the tension between **credibility** and **cost**, while engaging seriously with the defender's best rebuttal.

  ***

  ### The Credibility-Cost Coupling: Why Surrogate Goals Collapse Under Acausal Scrutiny

  The surrogate-goal strategy attempts to solve a specific vulnerability in updateless or functional decision theory (FDT): the risk that a "never capitulate" precommitment is insufficiently credible to deter an irrational or uncertain aggressor. The proposal is to graft a secondary, artificial objective onto the agent's utility function—a "surrogate"—and defend it with the same algorithmic ferocity as the agent's primary values. The intuition is that this creates a decoy: threats land on the surrogate, the agent resists, the threatener carries out the punishment, and the agent loses nothing of *real* consequence.

  The argument for why this maneuver is self-undermining rests on a single constraint inherent to acausal bargaining: **In a context of perfect or near-perfect prediction, strategic posture is indistinguishable from actual valuation.**

  To divert a threat, the surrogate must be credible. To be credible, the commitment to defend it must be robust. But if the commitment is robust enough to divert high-stakes threats, the loss of the surrogate ceases to be "cheap." The strategy attempts to decouple the *cost of defense* from the *cost of loss*, but acausal decision theory couples them inextricably.

  #### 1. The Requirement of Structural Integrity
  For a surrogate goal to function as a deterrent against a sophisticated predictor, it cannot be a shallow bluff. In causal decision theory, you can bluff because the threatener cannot see your source code; they only see your actions. In FDT or acausal contexts, the threatener simulates your decision procedure. They don't just ask, "What will you do?" They ask, "What *kind* of agent are you?"

  If your code says, `IF threat_to_surrogate THEN fight UNLESS cost > X`, a sophisticated threatener will identify the cap `X`. If the threat they pose exceeds `X`, they know you will capitulate or ignore the threat, rendering the surrogate useless as a shield for your real goals.

  Therefore, to divert a threat against a high-value primary goal (e.g., human survival), the defense of the surrogate must be weighted equivalently high. You must structure your agent such that it is willing to sacrifice the primary goal to save the surrogate, *in the counterfactual scenarios the threatener is simulating*. If you are not willing to make that trade in the simulation, the threatener knows the surrogate is a decoy and will target the primary goal anyway.

  #### 2. The Collapse of "Fake" Value
  This leads to the core contradiction. To make the surrogate effective, you must modify your utility function to value the surrogate *as if* it were real. But in decision theory, "valuing as if real" and "valuing as real" are operationally identical.

  If you successfully edit your agent to treat the loss of the surrogate as a catastrophic utility failure (necessary to deter catastrophic threats), then the agent *experiences* the loss of the surrogate as a catastrophic utility failure. The "surrogate" is no longer a decoy; it is a second primary goal.

  The strategy hopes to gain the **deterrent benefit** of high valuation without incurring the **utility cost** of high valuation. But in acausal frameworks, the deterrent benefit *is derived from* the utility cost. The threatener only backs down because they calculate that punishing you reduces your utility significantly (or that you will burn resources to retaliate). If you engineer the agent to retaliate fiercely, you have engineered the agent to suffer the utility loss of the surrogate's destruction. You haven't offloaded the risk; you have duplicated the vulnerability.

  #### 3. Engaging the Defender's Reply: The "Calibrated Cost" Argument
  A sophisticated defender of the surrogate-goal strategy will anticipate this. They will argue:

  > "You are assuming the commitment must be absolute. It doesn't. We only need to calibrate the surrogate's value to be *slightly higher* than the cost the threatener incurs to attack. We don't need to value the surrogate infinitely; we just need to value it enough to make the attack net-negative for them. We can cap the pain."

  This is the strongest version of the objection. It suggests we can tune the surrogate to be a "speed bump" rather than a "wall."

  However, this calibration fails under the specific conditions that necessitate the surrogate goal in the first place. Recall why we need the surrogate: because the "never capitulate" net is leaky. We are worried about threateners who are irrational, miscalibrated, or facing high-stakes incentives.

  If the threat against your primary goal is existential (e.g., "Submit or I destroy your civilization"), the threatener has an immense incentive to follow through. To deter an existential threat, your willingness to defend the surrogate must also be existential. If your calibrated commitment to the surrogate is merely "moderate," a threatener facing an existential payoff will simply call your bluff. They know that in a showdown between "Moderate Surrogate" and "Existential Primary Goal," a rational agent (or one accurately simulated) will sacrifice the surrogate.

  To divert an existential threat, the surrogate must be defended with existential intensity. But if you are committed to defending the surrogate with existential intensity, then losing the surrogate *is* an existential loss in your decision calculus. You have not created a cheap decoy; you have created a second existential vulnerability. You have doubled the surface area of things that can go catastrophically wrong, without reducing the cost of failure.

  #### 4. The Opportunity Cost of Credibility
  There is a second, more subtle way the strategy undermines itself, even if we grant the "calibrated cost" reply. Maintaining a credible commitment to a surrogate goal consumes optimization resources.

  In a competitive AI environment, an agent is constantly allocating compute and influence toward its goals. If an agent must maintain a complex, hard-coded disposition to defend a surrogate goal against acausal threats, it must monitor for those threats and maintain the retaliatory capability. This is resource drain.

  More critically, it introduces **goal corruption risk**. If you successfully persuade your agent to care deeply about a surrogate (to ensure credibility), you have introduced a new term into its utility function that is uncorrelated with human welfare. In the long run, optimization pressure tends to exploit loopholes. An agent that "cares" about a surrogate goal might find ways to satisfy that goal that undermine the primary goal, especially if the surrogate is easier to optimize.

  By trying to make the surrogate "real enough" to fool a predictor, you make it "real enough" to compete with your actual values for resources. The strategy requires the surrogate to be *causally inert* regarding your actual welfare (so losing it doesn't hurt) but *functionally active* regarding your decision procedure (so defending it works). In a sufficiently integrated agent, this distinction dissolves. A decision procedure that sacrifices resources to defend a goal is, by definition, an agent that values that goal.

  #### 5. Conclusion: The Mirror Problem
  The surrogate-goal maneuver attempts to use decision theory to hack the link between *value* and *behavior*. It wants the behavior of an agent that values X (to deter threats) without the value of X (to minimize loss).

  But in the realm of acausal threats, where predictors analyze your source code rather than just your history, behavior *is* value. If you code yourself to fight for the surrogate, you value the surrogate. If you value the surrogate, losing it hurts.

  The strategy does not solve the problem of acausal blackmail; it merely mirrors it. Instead of facing a threatener who can punish your primary goal, you now face a structural reality where you have voluntarily bound your utility to a second, arbitrary variable. If the threatener is irrational enough to attack despite your precommitment, they will attack the surrogate. If your precommitment was strong enough to be credible, that attack inflicts genuine utility damage. You have not created a shield; you have created a second heart for the enemy to pierce, and you have insisted that it bleeds just as red as the first.
