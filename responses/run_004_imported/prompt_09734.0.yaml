      *   **Van Fraassen's Cube Factory:** A factory makes cubes with side length between 0 and 1 ft. What's the probability side < 0.5? (1/2). What's the probability face area < 0.25? (1/4). Same state of affairs, different parametrization. Invariance doesn't fix the choice of *parameter*.

  4.  **Drafting - Section by Section:**

