          *   *Philosopher B (Anti-Jaynes/Skeptic):* Believes Jaynes' solution is a "shell game." Choosing the symmetries is itself an arbitrary choice. Cites Bas van Fraassen's "Cube Factory" paradox to show the problem persists (invariance doesn't save you from framing effects).
