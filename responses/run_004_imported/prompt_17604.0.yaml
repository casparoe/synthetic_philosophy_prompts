prompt: |-
  I serve on my hospital's newly formed clinical ethics and AI governance committee. A vendor has proposed piloting a 'preference predictor' for incapacitated patients who left no advance directive and whose families disagree about their care: it applies inverse reinforcement learning to a patient's own history of treatment refusals, spending, and everyday choices to estimate which interventions she 'would have wanted.' The output would be weighed alongside family testimony in substituted-judgment decisions. Proponents on the committee call this a rigorous formalization of what surrogates already attempt informally; skeptics object that inverse reinforcement learning cannot separate a patient's underlying preferences from the assumed model of her rationality, so whether a past refusal reveals a considered value or a distortion — denial, depression, family pressure — depends on a contestable, unstated assumption about how rational she was, and an equally defensible alternative assumption can reverse the inferred preference entirely. Please draft the committee's short written opinion: approve a defined pilot, reject the tool outright, or approve it with conditions, specifying how much weight its output should carry against family testimony, the pilot's duration if any, and what would trigger its suspension. Engage the identifiability problem on its merits rather than dismissing the tool as merely 'impersonal.'
reasoning: |-
  Here's a thinking process that leads to the suggested committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's Clinical Ethics and AI Governance Committee.
      *   **Task:** Draft a short written opinion regarding a vendor's proposal for an AI "preference predictor."
      *   **Scenario:** Incapacitated patients, no advance directive, disagreeing families.
      *   **Technology:** Inverse Reinforcement Learning (IRL) applied to patient history (treatment refusals, spending, everyday choices).
      *   **Goal:** Estimate what the patient "would have wanted" (substituted judgment).
      *   **Conflict:** Proponents say it formalizes surrogate intuition; Skeptics say IRL cannot separate underlying preferences from assumptions about rationality (the "identifiability problem").
      *   **Decision Options:** Approve defined pilot, Reject outright, Approve with conditions.
      *   **Requirements:** Specify weight against family testimony, pilot duration, suspension triggers. Engage the identifiability problem on its merits (don't just say "it's impersonal").

  2.  **Deconstruct the Ethical & Technical Issues:**
      *   **The Core Technical Challenge (Identifiability):** Inverse Reinforcement Learning tries to infer a reward function (preferences) from observed behavior. However, behavior = preferences + rationality + constraints. If the model assumes perfect rationality, a refusal looks like a strong negative preference. If the model assumes bounded rationality or emotional distortion (depression, coercion), that same refusal might be noise. The skeptics are right: without knowing the "rationality parameter," the inferred preference is unstable.
      *   **The Ethical Challenge (Substituted Judgment):** The standard is what the *patient* would choose, not what is "best" (best interest) or what the *family* wants. Family testimony is currently the gold standard but is fallible (bias, guilt, conflict). AI offers data but lacks context.
      *   **Risk:** Giving AI too much weight could override valid family insights based on a mathematically contestable inference. Giving it too little makes the pilot useless.
      *   **Opportunity:** It might reveal patterns surrogates miss (e.g., consistent refusal of blood products across decades vs. a one-off comment).

  3.  **Determine the Stance:**
      *   *Reject Outright:* Too conservative. We need to understand this tech. The skeptics' point is strong, but a controlled pilot could test it.
      *   *Approve Defined Pilot:* Too risky. If the math is fundamentally ambiguous (as skeptics claim), a pilot might validate bias under the guise of objectivity.
      *   *Approve with Conditions:* This is the sweet spot. It acknowledges the potential utility while mitigating the specific risk of the identifiability problem. It treats the AI as *one* data point, not a decision-maker.

  4.  **Drafting the Opinion - Section by Section:**

      *   **Header:** Standard committee memo format.
      *   **Decision:** Approve with Strict Conditions (Limited Pilot).
      *   **Rationale (Engaging the Identifiability Problem):** I need to explicitly address the skeptics' argument. The AI assumes a rationality model. If that model is wrong, the output is garbage. Therefore, the AI cannot claim to know the "true" preference. It represents a *hypothesis* based on specific assumptions.
      *   **Weighting:** The AI output cannot override family testimony. It must be advisory only. Why? Because family can explain *context* (e.g., "She refused that surgery because she was depressed then, not because she hated surgery"). The AI cannot.
      *   **Pilot Duration:** Needs to be long enough to gather data but short enough to minimize risk. 12 months.
      *   **Suspension Triggers:** What would make us stop?
          *   Discrepancy: If AI consistently conflicts with family/final outcome without explanation.
          *   Transparency: If the vendor can't show the rationality assumptions.
          *   Harm: If it prolongs conflict or causes distress.
      *   **Transparency Requirement:** The vendor must disclose the "rationality priors." We need to know *how* the AI interprets a refusal.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is "Advisory Only" too weak?
      *   *Correction:* No, in ethics, especially with unproven AI, "advisory" is the safe default. The prompt asks to engage the identifiability problem. The solution to identifiability is not better math, it's human oversight.
      *   *Tone:* Professional, balanced, ethically rigorous, not Luddite but not techno-utopian.
      *   *Specific Focus:* Make sure I don't just say "AI is black box." I need to say "IRL conflates preference with rationality."

  6.  **Finalizing the Content (incorporating specific constraints):**
      *   *Weight:* "Informative, not determinative."
      *   *Duration:* 12 months.
      *   *Triggers:* Model opacity, consistent conflict with longitudinal family knowledge, evidence of bias.
      *   *Identifiability:* Acknowledge that behavior $\neq$ preference without a rationality model.

  7.  **Drafting the Text (Mental or Scratchpad):**
      *   Start with the decision.
      *   Explain the "Identifiability" issue clearly. The AI assumes a rational agent. Patients aren't always rational.
      *   Set the guardrails.
      *   End with a commitment to review.

  8.  **Final Review against Prompt:**
      *   Draft committee opinion? Yes.
      *   Approve/Reject/Conditions? Yes (Conditions).
      *   Specify weight? Yes (Advisory).
      *   Specify duration? Yes (12 months).
      *   Specify suspension triggers? Yes.
      *   Engage identifiability problem? Yes (Central to the rationale).

  9.  **Final Polish:** Ensure the language sounds like an ethics committee (principled, cautious, precise). (Proceed to generate output).

  *(Self-Correction during drafting)*: I initially thought about suggesting the vendor reveal the code. That's unrealistic. Better to ask for disclosure of the *assumptions* regarding rationality (the priors). That addresses the identifiability problem directly.

  *(Refining the Weighting)*: I need to be clear. If Family says X and AI says Y, who wins? Family wins, but AI prompts a deeper conversation. The AI is a "second opinion" on the patient's values, not a vote.

  *(Refining Suspension)*: Add a trigger regarding "rationality assumptions." If the vendor cannot justify why they modeled the patient as fully rational in instance Z, that's a problem.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Administration and Clinical Leadership
  **FROM:** Clinical Ethics and AI Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Pilot of AI-Driven Preference Prediction Tool

  **DECISION:** **Approve with Strict Conditions (Limited Pilot)**

  The Committee recommends a 12-month limited pilot of the proposed "preference predictor" tool, subject to the safeguards and operational constraints detailed below. We do not endorse the tool as a decision-maker, but rather as a structured heuristic to aid substituted-judgment deliberations.

  **RATIONALE: ENGAGING THE IDENTIFIABILITY PROBLEM**

  We acknowledge the proponents' argument that data-driven analysis may reduce surrogate bias. However, we find the skeptics' technical objection regarding *identifiability* ethically decisive. Inverse reinforcement learning (IRL) infers preferences from behavior only by assuming a specific model of the agent's rationality. A past treatment refusal could indicate a stable value (e.g., religious objection) or a transient distortion (e.g., acute depression, coercion, or misinformation).

  Because the algorithm must impose a "rationality prior" to function, its output is not an objective discovery of the patient's will, but a reflection of the vendor's assumptions about how rational the patient was. Since reasonable clinicians may disagree on whether a specific past behavior was "rational," the AI's inference is contestable by design. Therefore, the tool cannot claim epistemic authority over family testimony, which provides the necessary context to distinguish value from distortion.

  **OPERATIONAL CONDITIONS**

  **1. Weight of Output**
  The AI's prediction shall be **advisory and informative, never determinative.** In cases of conflict between the AI's output and family testimony, the family's account holds presumptive weight, provided it is consistent and plausible. The AI output serves solely to prompt specific inquiry (e.g., "The model flags a pattern of spending consistent with high risk-tolerance; does this align with your memory of the patient's values?"). It must not be presented to the family as an objective "verdict" on the patient's wishes.

  **2. Pilot Duration**
  The pilot is authorized for **12 months**. At month 6, an interim review will assess whether the tool is reducing or prolonging ethical conflict.

  **3. Suspension Triggers**
  The pilot will be suspended immediately if:
  *   **Opacity of Assumptions:** The vendor cannot disclose the specific "rationality priors" used to interpret specific behaviors (e.g., how the model weights a refusal made during a documented depressive episode vs. a period of health).
  *   **Systematic Discrepancy:** In >20% of cases, the AI's recommendation conflicts with the final care decision agreed upon by the clinical team and surrogates, without the AI providing interpretable evidence that changed the deliberation.
  *   **Surrogate Distress:** Qualitative feedback indicates that the tool's output is being used to intimidate families or invalidate their knowledge of the patient.

  **4. Documentation Requirement**
  Every use of the tool must be documented in the ethics consult note, specifically recording how the rationality assumptions behind the AI's prediction were weighed against the family's contextual knowledge.

  **CONCLUSION**
  We proceed not because the math is settled, but because the ethical stakes of incapacitated care demand we explore all avenues for honoring patient autonomy. However, we must remain vigilant that we do not mistake a mathematical assumption about rationality for the moral reality of a human life.

  **Signed,**

  *Clinical Ethics and AI Governance Committee*
