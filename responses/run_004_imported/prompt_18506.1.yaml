      *   **Point 2: Epistemic Privilege vs. Epistemic Distortion.** The father knows addiction, but that knowledge is tainted by his failure. It makes his blame look like displacement of self-loathing.
      *   **Point 3: The Relational Debt.** Standing is relational. 30 years of smoking likely impacted the family unit. Quitting stops the bleeding but doesn't heal the scar.
      *   **Point 4: The Distinction between Repentance and Authority.** One can be forgiven (repentance) without regaining the podium (authority).
      *   **Conclusion:** Summarize. The father has concern, but not *standing*. He can share experience, but not issue condemnation.

  7.  **Refining the Tone:**
