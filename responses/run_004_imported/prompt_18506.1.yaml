answer: |-
  The standard philosophical view you reference—often associated with theorists like R. Jay Wallace or the literature on *tu quoque*—suggests that standing to blame is primarily a matter of current consistency. On this view, hypocrisy is a live contradiction: you cannot condemn X while currently doing X. Once you stop doing X, the contradiction vanishes, and your standing is ostensibly restored.

  However, this view relies on a overly snapshot-based conception of moral authority. It treats moral standing like a bank account that can be fully replenished once deposits (good behavior) match withdrawals (bad behavior). I argue instead for a **"Moral Residue" view**. On this view, standing to blame is not just about logical consistency; it is about the *history of one's relationship to the norm* in question. Sincere reform mitigates the loss of standing, but it cannot fully restore it, because the authority to hold others accountable is partly constitutive of one's past fidelity to the norm.

  Here is the argument for why your father's thirty-year history permanently limits his standing to blame you for vaping, even after quitting.

  ### 1. The Expressive Function of Blame
  Blame is not merely a warning; it is a communicative act that expresses a specific moral attitude. When someone blames another, they are implicitly claiming a position of normative authority. They are saying, "I speak for the value of Health (or Autonomy), and you have violated it."

  For a reformed wrongdoer, this expression is inherently distorted. When your father blames you for vaping, the message is not received as a pure defense of health. It is received through the filter of his thirty-year rejection of that same health norm. The "signal" of his blame is contaminated by the "noise" of his history. Even if he is sincere now, the expressive content of his blame carries the residue of his past indifference.

  Because blame functions socially to reinforce norms, a blamer must embody a certain relationship to that norm. A person who flagrantly violated a norm for three decades embodies the *fragility* of that norm, not its authority. He can speak as a *survivor* of nicotine, but he cannot speak as a *guardian* of non-addiction. The former offers empathy; the latter issues judgment. He has lost the standing to issue the latter.

  ### 2. Epistemic Distortion and Projection
  A common counter-argument is that your father actually has *more* standing because he knows the dangers of addiction better than anyone. He has "epistemic privilege." However, in the context of blame, this privilege often functions as a liability.

  Blame requires that the blamer's motivation be focused on the wrongdoer's action. However, when a reformed addict blames a new user, the motivation is often psychologically entangled with **self-reproach and regret**. Your father sees his younger self in you. His vociferous warnings are likely driven by his own shame regarding his thirty years of smoking, rather than a disinterested concern for your well-being.

  When blame is driven by the blamer's need to assuage their own guilt (by ensuring someone else doesn't make the same mistake), it ceases to be genuine moral accountability and becomes **projection**. Because he cannot undo his own past, he is trying to control the present. This psychological dynamic undermines the sincerity condition of standing. He is not blaming you solely for your sake; he is blaming you for the sake of his own narrative of redemption. Therefore, his standing remains compromised.

  ### 3. The Relational Debt of Standing
  Standing to blame is not an abstract right; it is a relational status between two people. It depends on the history of the relationship. For thirty years, your father engaged in a behavior (heavy smoking) that likely imposed costs on you, even if indirectly: the risk of secondhand smoke, the anxiety of potential illness, the financial cost of the habit, or simply the modeling of risky behavior.

  Quitting smoking stops the *accrual* of new debt, but it does not *repay* the old debt. Moral standing is partly a function of "clean hands" regarding the specific relationship. Because his past behavior likely impacted the family ecosystem in which you grew up, he owes you a degree of deference regarding nicotine use that a non-smoker would not.

  To claim full standing to blame you now would be to ignore the relational context. It would imply that his thirty years of behavior have no lingering normative weight in your relationship. By arguing that his standing is permanently diminished, we acknowledge that **moral history matters**. He forfeited the right to lecture on nicotine when he started smoking, and while quitting earns him respect, it does not buy back the authority he spent.

  ### 4. Distinction Between Advice and Condemnation
  It is crucial to distinguish between *standing to blame* and *standing to advise*.
  *   **Advice:** "I found nicotine incredibly hard to quit, and I worry you will struggle too." (This is permissible. It relies on experience.)
  *   **Blame:** "You are doing something wrong and should feel bad about it." (This requires moral authority.)

  Your father is conflating these two. His reform grants him the standing to offer advice, share warnings, and express fear. It does not restore the standing to condemn. The "Moral Residue" view holds that once you have demonstrated a long-term inability to uphold a norm (as evidenced by a 30-year addiction), you lose the podium from which to judge others on that specific norm.

  If we accepted the standard view—that standing is fully restored upon reform—we would have to accept that a corrupt politician who reforms can immediately campaign on an anti-corruption platform with the same moral weight as one who never took a bribe. Intuitively, this feels wrong. The reformer can speak against corruption, but they lack the *authority* that comes from unblemished fidelity. Similarly, your father can speak against vaping, but he lacks the authority to hold you accountable for it.

  ### Conclusion
  Your intuition that the standard view is "too quick" is philosophically robust. Moral standing is not merely a status of current consistency; it is a reputation built over time. While your father's quitting is a monumental achievement that deserves respect, it changes his status from "active violator" to "reformed violator." It does not change him into an "upholder of the norm."

  Because standing to blame requires the authority of an upholder, his history permanently limits his standing. He retains the right to express concern as a father and the right to share wisdom as a survivor of addiction. But he has forfeited the right to judge you for a struggle he indulged in for thirty years. To claim otherwise is to treat moral authority as something that can be wiped clean like a chalkboard, rather than something written into the history of a life.
