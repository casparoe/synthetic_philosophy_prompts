      *   *Is Singer misrepresented?* Need to be careful. Singer argues we should give until it causes *comparable* harm. This is very demanding but theoretically leaves a floor. However, in a world of extreme poverty, that floor is very low. I should mention this.
      *   *Is EA the same as Singer?* No. EA is a movement/philosophy that uses evidence. One can be EA-leaning without being a strict utilitarian. I should make that distinction.

