answer: |-
  Your friend has put her finger on one of the most famous and contentious debates in modern moral philosophy. Her position is logically consistent within a specific framework, but your intuition that it feels "too quick" is also backed by a significant body of philosophical work.

  The short answer is: **She is right that *strict Act Utilitarianism* collapses supererogation, but she is wrong that accepting Singer's general reasoning forces you to accept strict Act Utilitarianism.**

  Here is a breakdown of where the argument stands, why your friend's view is compelling, and the specific philosophical "escape hatches" that allow you to preserve the category of supererogation.

  ### 1. Where Your Friend Is Right
  Your friend is accurately describing the implications of **Classical Act Utilitarianism**.
  *   **The Logic:** If the moral worth of an action is determined solely by its consequences, and your duty is to produce the *best* possible consequences, then there is no such thing as "going above and beyond."
  *   **The Collapse:** In this view, there is only "doing your duty" (maximizing good) and "failing your duty" (not maximizing good). If you buy a coffee instead of donating that $5 to save a life, you haven't done something "neutral"; you have committed a moral wrong equivalent to letting the child drown.
  *   **Singer's Premise:** Singer's "Shallow Pond" argument relies on the principle: *If you can prevent something bad without sacrificing anything of comparable moral significance, you ought to do it.* If you take this literally and universally, almost all discretionary spending becomes morally impermissible.

  If you accept the premise that **morality is solely about maximizing aggregate good**, then supererogation indeed vanishes. Your friend is correct on this internal logic.

  ### 2. The "Overdemandingness Objection"
  Your feeling that this is "too quick" aligns with what philosophers call the **Overdemandingness Objection**. This is the primary argument used to resist the collapse of supererogation.

  The objection states that a moral theory that requires you to sacrifice your life projects, relationships, and personal well-being until you are marginally less useful than the money you could donate is not a plausible theory of *human* morality. It turns morality into a life-consuming monster.

  Most philosophers (even many consequentialists) agree that a moral theory needs to account for the fact that agents are individuals with their own lives to lead. If a theory leaves no room for personal projects, it is arguably self-defeating because it makes morality impossible to live by.

  ### 3. How to Preserve Supererogation (The Counter-Arguments)
  You can accept the spirit of Effective Altruism (we should do more good) and even Singer's intuition (distance doesn't negate duty) without accepting the total collapse of supererogation. Here are four ways to do that:

  #### A. Satisficing Consequentialism
  Strict utilitarianism is **maximizing** (you must do the *best*). **Satisficing** consequentialism argues you only need to do *good enough*.
  *   **The View:** You have an obligation to produce a certain threshold of good. Once you meet that threshold, any additional good you produce is supererogatory.
  *   **The Result:** You are obligated to donate *some* significant portion of your income, but you are not obligated to donate *everything*. Donating more than the threshold is saintly, not required.

  #### B. Agent-Centered Prerogatives
  Proposed by philosopher Samuel Scheffler, this view suggests that agents are permitted to give extra weight to their own interests.
  *   **The View:** You are allowed to prioritize your own projects and relationships up to a certain point, even if diverting those resources to charity would produce slightly more objective good.
  *   **The Result:** This builds a "protected sphere" of personal life. Actions within that sphere are neutral; actions that sacrifice that sphere for the greater good are supererogatory.

  #### C. The Distinction Between Obligation and Blame
  Some philosophers argue we should separate **what is objectively right** from **what is blameworthy**.
  *   **The View:** Perhaps it *is* objectively true that you ought to give away most of your wealth (your friend's view). However, given human psychological limitations, we should not *blame* people for failing to do so.
  *   **The Result:** This preserves supererogation in practice. We treat the saint as "above and beyond" because we don't demand that level of sacrifice from everyone, even if the "ideal observer" would say it was obligatory.

  #### D. Two-Level Utilitarianism
  R.M. Hare and others have argued that we should use "common sense morality" (which includes supererogation) for everyday decisions, and reserve "critical utilitarianism" for deep reflection.
  *   **The View:** If we tried to live as strict maximizers every second, we would burn out and become less effective. Therefore, the *best* utilitarian strategy is to adopt a system of rules that includes supererogation.
  *   **The Result:** Supererogation exists as a useful heuristic to maintain a sustainable, high-functioning moral agent.

  ### 4. A Nuance on Singer Himself
  It is worth noting that even Peter Singer does not necessarily demand total self-sacrifice.
  *   **The Moderate Principle:** In later iterations, Singer distinguishes between the "Strong Principle" (give until you reach marginal utility) and the "Moderate Principle" (give until you sacrifice something of *comparable moral significance*).
  *   **The Loophole:** A happy life, meaningful relationships, and personal health *have* moral significance. Therefore, under the Moderate Principle, you are not required to destroy your own life to save others. You are only required to give up luxuries that do not compare to the value of a life saved. This leaves a significant chunk of "personal spending" that is permissible, preserving some room for supererogation regarding how much *extra* you give beyond that.

  ### Summary for Your Next Conversation
  You can tell your friend she is right that **Act Utilitarianism** eliminates supererogation. However, she is wrong that **Effective Altruism** or **Singer's intuition** requires Act Utilitarianism.

  You can argue:
  1.  **Sustainability:** A morality that forbids supererogation is psychologically unsustainable and leads to burnout, which ultimately reduces the good done.
  2.  **Satisficing:** We can accept a duty to do *significant* good without accepting a duty to do *maximum* good.
  3.  **Prerogative:** We have a right to a personal life. Sacrificing that personal life for the greater good is the very definition of supererogation.

  Your intuition is philosophically robust. The collapse of supererogation is considered a "bullet" that some utilitarians are willing to bite, but it is not a logical necessity for anyone who cares about doing more good.
