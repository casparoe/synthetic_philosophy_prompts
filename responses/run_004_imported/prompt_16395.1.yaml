answer: |-
  The rain blurred the lights of the campus into smeared watercolors against the window of the study lounge. Arthur liked the blur. It made the world look less defined, less committed to being one thing or another.

  "You're doing it again," Elena said. She wasn't looking up from her laptop, but her voice cut through the hum of the heater.

  "Doing what?"

  "Assigning weight to ghosts." Elena closed her laptop and turned her chair. She was a doctoral candidate in statistics, sharp-featured and perpetually amused by the messy ways humans processed information. Arthur was just a hobbyist, a man who read textbooks on decision theory the way others read thrillers, looking for a system that would stop the anxiety of being wrong.

  "I'm just assessing the Veritas trial," Arthur said, tapping his pen against his notebook. "The results come out Monday. I'm trying to calibrate my expectations."

  "And?"

  "And I think there's a solid chance it works. The preliminary data is strong." Arthur paused, chewing his lip. "I'd say I'm sixty percent confident the trial succeeds."

  Elena nodded slowly. "Sixty percent. Reasonable. And the other forty?"

  "That's the thing," Arthur said, leaning forward. "I can't shake the feeling that it's going to fail. The sample size is small. The variance is high. If I'm being honest about my fear... I'd say there's a fifty percent chance it fails."

  He waited for her to correct him. He knew the axiom. $P(A) + P(\neg A) = 1$. He knew it like he knew his own name. But knowing a rule and feeling it are different things. In his chest, the hope weighed sixty pounds and the fear weighed fifty. The sum was one hundred and ten. He felt over-full, burdened by a reality that seemed too heavy to fit inside the container of the world.

  Elena didn't correct him. She reached into her bag and pulled out a small notepad. "So, just to be clear. You are willing to stake your credibility on these numbers? You believe they represent fair odds?"

  "Yes," Arthur said. "Intellectually."

  "Then let's make it financial. It helps crystallize things."

  Arthur hesitated. "I don't want to gamble, Elena."

  "It's not gambling if your beliefs are coherent. It's just accounting. If you're right about your confidence levels, you shouldn't lose anything in the long run. You should break even." She tore a page from the pad and slid it across the table. "I'll offer you two tickets. Based on your numbers."

  She wrote quickly.

  **Ticket A:** Pays \$1,000 if the Veritas trial succeeds. Cost: \$600.
  **Ticket B:** Pays \$1,000 if the Veritas trial fails. Cost: \$500.

  Arthur looked at the numbers.
  Ticket A cost \$600 for a \$1,000 payout. That matched his 60% confidence. It was a fair bet. If he bought a hundred of them, he'd pay \$60,000 and win \$60,000.
  Ticket B cost \$500 for a \$1,000 payout. That matched his 50% confidence. It was also a fair bet. If he bought a hundred of them, he'd pay \$50,000 and win \$50,000.

  Individually, they were perfect. They matched his internal state exactly.

  "If I buy both," Arthur said slowly, "I'm spending \$1,100."

  "Yes."

  "And no matter what happens, only one ticket pays out."

  "Correct."

  "So I get \$1,000 back."

  "Correct."

  Arthur did the subtraction. "\$100 loss. Guaranteed."

  Elena capped her pen. "The math is inescapable, Arthur. If your degrees of belief sum to more than one, you are effectively paying for overlap in a universe that doesn't allow it. You're paying to be sure of *both* outcomes."

  "I'm not paying to be sure," Arthur said, his voice tightening. "I'm paying to be prepared. If I only bet on success, I'm devastated if it fails. If I only bet on failure, I'm devastated if it succeeds. I wanted... I wanted to cover the emotional spread."

  "But the world doesn't trade in emotional spread. It trades in binary outcomes." Elena pushed a pen toward him. "You don't have to take the bets. But if you claim those probabilities are rational, you have to take them. If you refuse, you're admitting your beliefs aren't real probabilities. They're just... feelings."

  Arthur looked at the rain. He wanted to be a rational agent. He wanted his mind to be a clean machine. But his mind was a room where the furniture took up more space than the walls allowed. He picked up the pen. He signed the chit. He transferred the money on his phone. \$1,100.

  "Monday," Elena said, pocketing the chit. "We settle up."

  ***

  The weekend was agonizing. Arthur checked the news feeds every hour. He oscillated between the 60% and the 50%. He felt the incoherence physically, a kind of pressure behind his eyes. He was trying to occupy two mutually exclusive futures simultaneously, and the strain was giving him a migraine.

  On Monday morning, the results were published. The trial failed. The variance was too high. The drug was ineffective.

  Arthur felt a wash of relief, immediately followed by a sting of disappointment. The 50% fear had been justified; the 60% hope had been wasted.

  He met Elena at the same table. The rain had stopped, leaving the glass clear and cold.

  "It failed," Arthur said.

  "I saw," Elena replied. She didn't gloat. She looked almost sympathetic. She pulled out her wallet and counted out \$1,000 in cash. She slid it across the table.

  Arthur took it. He had paid \$1,100. He held \$1,000. He was down \$100.

  It was a small amount of money. He could earn it back in a few hours of consulting work. It wasn't the loss that sat heavy in his stomach. It was the structure of it.

  "I didn't get the fact wrong," Arthur said quietly. "The trial did fail. My assessment of the failure was... well, it was accurate enough."

  "But your system is leaky," Elena said.

  "I was trying to be cautious. I was trying to acknowledge the risk."

  "You acknowledged the risk so much you paid a premium on reality itself." Elena leaned back. "Do you know what a Dutch Book proves, Arthur? It doesn't prove you'll lose money. I could have chosen not to exploit you. Most people won't. They're too polite, or too busy."

  "Then what does it prove?"

  "It proves that you are vulnerable. It proves that your internal map of the world has geometry that doesn't exist outside your head." She tapped the \$1,000 stack. "You wanted to feel safe in both futures. You wanted to live in the world where the drug worked, and you also wanted to live in the world where it didn't. You tried to buy a ticket to both."

  Arthur looked at the money. It felt dirty, not because it was winnings, but because it was the remainder of something broken.

  "I just didn't want to be blindsided," Arthur said.

  "The cost of not being blindsided is accepting that one door must close," Elena said. "When you keep both doors open, you're not standing in a hallway. You're standing in a wall."

  Arthur put the money in his pocket. He should have felt vindicated. He had predicted the failure, after all. He had been right about the outcome. But he felt hollowed out. He realized that for the past year, he hadn't been learning probability to understand the world. He had been learning it to find a way to make his anxiety mathematically valid. He wanted a formula that said it was okay to be 110% invested in reality.

  He stood up. "I should go."

  "Arthur," Elena said.

  He paused.

  "Next time," she said, "try believing the sum is one. It's lighter that way."

  Arthur walked out into the clear, cold air. He checked his phone. One notification, then another. He felt the urge to assign odds to his next interaction, to calculate the probability of the bus arriving on time, to hedge his expectations.

  He stopped himself. He put the phone in his pocket. He walked to the bus stop and waited. He knew the bus would either come or it wouldn't. There was no overlap. There was no cushion. There was only the waiting, and the certainty that whatever happened, it would be everything that happened, and nothing more.

  It felt terrifyingly thin. But for the first time all week, he wasn't carrying the extra weight.
