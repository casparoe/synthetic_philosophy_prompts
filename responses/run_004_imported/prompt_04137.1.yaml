answer: |-
  First off, this is a fantastic catch. You have stumbled onto one of the central tensions in *On Certainty* that actual Wittgenstein scholars debate. You aren't misreading it; you are reading it exactly as carefully as you should be.

  The short answer is: **They are not contradictory, but they operate on different timescales and describe different functions.**

  If you can get this distinction right in your character's head, it will make his unraveling feel incredibly authentic to anyone who knows the text, without alienating readers who don't. Here is how you reconcile the Hinge and the River-bed, and how to translate that into your character's psychological state.

  ### 1. The Hinge: Synchronic Stability (The "Now")
  The Hinge metaphor (OC 341–343) is about **logic and function in the present moment.**

  Wittgenstein is arguing that doubt is a game that requires rules. You cannot doubt *everything* at once, because to formulate a doubt, you need a background of certainty to give the doubt meaning.
  *   **Example:** If I doubt whether the train leaves at 5:00 PM, I am not doubting whether trains exist, whether I can read the schedule, or whether time is real. Those are the hinges.
  *   **The Constraint:** The hinge *must* stay put **while the door is turning.** If the hinge moves *while* you are trying to open the door, the mechanism fails.

  For your professor, this represents the **structural integrity of a single thought process.** To finish a sentence, to grade a paper, to have an argument with a colleague, certain things must be treated as immovable *for the duration of that activity.*

  ### 2. The River-bed: Diachronic Flux (The "Over Time")
  The River-bed metaphor (OC 96–99) is about **history, culture, and biography.**

  Wittgenstein acknowledges that what counts as a "hinge" changes.
  *   **Example:** "The earth is flat" was once river-bed rock for humanity. Now it is sand. "Energy is conserved" is rock for us now; it might be sand for physicists in 3,000 years.
  *   **The Constraint:** The bed shifts, but **slowly.** The water (our daily thoughts/doubts) flows over the bed. Occasionally, the water erodes the rock, turning it into sand, or deposits new sediment that hardens into rock.

  For your professor, this represents the **evolution of a worldview over a lifetime.** The things he was certain of at 30 (religious dogma, a specific political theory, the reliability of memory) might have shifted by the time he is 70.

  ### 3. The Synthesis: How They Fit Together
  The contradiction dissolves if you view the "Hinge" as a **role** a proposition plays, not an **intrinsic property** of the proposition.

  *   **Hinge:** "This proposition is acting as a foundation *right now*."
  *   **River-bed:** "Which propositions get to act as foundations changes *over time*."

  Wittgenstein's point is that we need the hinges to stay put *locally* (so we can think), even though they shift *globally* (so we can learn and adapt).

  **The Scholarly Nuance for Your Character:**
  The crisis for a philosophy professor isn't that he forgets facts (dementia). It's that he loses the **pragmatic sense of which role a proposition is playing.**

  In a healthy mind, the transition from rock to sand is unconscious. You don't notice when a belief softens; you just stop using it as a foundation. But your professor is hyper-aware. He is looking at the hinges and asking, *"Are you actually rock? Or are you just sand pretending to be rock?"*

  ### 4. Translating This to the Novel
  Here is how you can write his unraveling so it tracks with this specific Wittgensteinian puzzle:

  **A. The "Intellectualizing" Trap**
  Wittgenstein hated the idea that certainties were "knowledge." You don't *know* you have hands; you just use them. Knowledge implies you could be wrong. Certainty is animal; it's how you act.
  *   **The Character's Glitch:** Because he is a philosopher, he tries to *justify* his hinges. He tries to prove why the door hinge is solid. But hinges aren't proven; they are used. By scrutinizing them, he turns rock into sand. He is eroding his own river-bed by staring at it too hard.
  *   **Scene Idea:** He finds himself unable to leave the house because he's stuck analyzing whether "the ground will support my weight" is a hypothesis or a certainty. If it's a hypothesis, he needs evidence. If it's a certainty, why does it feel like a guess?

  **B. The Timing Mismatch**
  His crisis could be that the river-bed is shifting *too fast* for the hinges to hold.
  *   **The Character's Glitch:** Normally, the bed shifts over decades. For him, it's shifting over afternoons. A belief is a hinge in the morning (e.g., "My wife loves me") but by evening, it feels like sand.
  *   **The Wittgensteinian Horror:** It's not that he thinks she *doesn't* love him. It's that he loses the ability to treat that belief as a **background condition** for his life. It becomes an **object of investigation.** And as OC 342 says, if you investigate it, it's no longer a hinge. If it's not a hinge, the door falls off.

  **C. The "Load-Bearing" Confusion**
  You mentioned he's losing track of which beliefs are load-bearing. In Wittgensteinian terms, he is losing the **grammar of his certainty.**
  *   **Normal:** "I am in pain" (Not a hypothesis, not a doubt. Just an expression.)
  *   **Professor:** "I am in pain" (Is this a report? A metaphor? A neurological fact? A linguistic construct?)
  *   **Result:** He isn't losing his mind; he is losing his **traction.** He is spinning his wheels because he keeps trying to verify the road while driving.

  ### 5. Recommended Reading (Light Touch)
  If you want to dig slightly deeper without drowning in academic papers, look up **Avrum Stroll's** interpretation of *On Certainty*. He championed the "River-bed" reading specifically to explain how certainties can be empirical yet unshakeable.
  Also, **Danièle Moyal-Sharrock** writes about the "Hinge" as a kind of "animal certainty." This might help you describe the professor's loss of that "animal" trust in the world.

  ### Summary for Your Draft
  You can write his internal monologue knowing this:
  He isn't worried that the hinges are broken. He is terrified because he can **feel them moving.** He knows that for the game of language to work, the hinges must stay put (OC 343). But he also knows that the river-bed shifts (OC 97). His tragedy is that he is experiencing the geological shift of the river-bed *in real-time*, while trying to open a door that requires a static hinge.

  That is a genuinely Wittgensteinian nightmare. It's not "nothing is real." It's "I can no longer tell what I am allowed to stop doubting."

  Good luck with the book. It sounds like a compelling read.
