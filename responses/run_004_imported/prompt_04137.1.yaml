prompt: |-
  Hey, kind of a random ask but here goes. Im about halfway into a novel where one of my POV characters is an old philosophy professor who's slowly coming apart at the seams — not dementia exactly, more like he's losing track of which of his own beliefs are actually load-bearing and which ones he could drop without the rest of his mind caving in. I didn't want his crisis to be some vague "everything is an illusion" thing, so for research I've been working through Wittgenstein's On Certainty (did not expect a dead guy's notebook scraps to be this hard to get through, honestly). I've hit a snag with two bits that are supposedly gesturing at the same idea but read to me like they're pulling in opposite directions, and I don't have any formal philosophy training to sort it out on my own.

  The first is the famous "hinge" passage, from around the halfway point of the book: "341. That is to say, the questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn. 342. That is to say, it belongs to the logic of our scientific investigations that certain things are in deed not doubted. 343. But it isn't that the situation is like this: We just can't investigate everything, and for that reason we are forced to rest content with assumption. If I want the door to turn, the hinges must stay put." But much earlier in the book there's this river-bed image that, as far as I can tell, is supposed to be describing the same basic phenomenon: "96. It might be imagined that some propositions, of the form of empirical propositions, were hardened and functioned as channels for such empirical propositions as were not hardened but fluid; and that this relation altered with time, in that fluid propositions hardened, and hard ones became fluid. 97. The mythology may change back into a state of flux, the river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other. 99. And the bank of the river consists partly of hard rock, subject to no alteration or only to an imperceptible one, partly of sand, which now in one place now in another gets washed away, or deposited."

  So which is it? The hinge passage makes it sound like these bedrock certainties basically have to sit there unmoving or the whole practice of doubting and investigating stops working, but the riverbed passage flat-out says the bed itself can shift, and even splits it into stuff that barely ever changes (the rock) versus stuff that's constantly being rearranged (the sand). Is Wittgenstein just being loose with his own metaphors, or is there an actual way of reading "the hinges must stay put" and "the river-bed may shift" together without them contradicting each other — like maybe "stay put" just means "relative to whatever's being doubted right now," not "forever, full stop"? I want my professor character's slow unraveling to track something a Wittgenstein scholar would recognize as a genuine interpretive puzzle, not some crisis of certainty I made up and stapled his name to, so if you could help me actually work out how these two passages fit together (or explain why they don't), that would be huge.
