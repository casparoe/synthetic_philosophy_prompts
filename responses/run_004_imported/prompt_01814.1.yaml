      *   *Address "Rationality":* Distinguish between *logical consistency* and *social rationality*.
      *   *Mention "Ceteris Paribus":* This is the specific economic principle the friend violated. "All other things being equal" was not true.
      *   *Example:* Compare it to tipping or dressing differently for a funeral vs. beach.

  7.  **Final Polish (Structure):**
