answer: |-
  Your intuition is correct, and your friend is falling into a classic trap often seen in introductory economics: confusing the **physical object** with the **economic good**.

  In economics, a "rational choice" doesn't mean you always pick the biggest physical object. It means you consistently maximize your **utility** (satisfaction) based on your preferences and constraints. Your friend's argument fails because the two situations you described were not, economically speaking, "the same choice."

  Here is how you can explain to your friend why your behavior was perfectly rational.

  ### 1. The "Bundle" of Attributes
  In economics, you don't just choose "a slice of pizza." You choose a bundle of attributes associated with that slice.
  *   **Scenario A (Family Gathering):** The choice was between [Small Slice + Social Approval] vs. [Big Slice + Social Cost]. Taking the big slice in front of family might signal greed, violate norms of politeness, or invite teasing. The "cost" of the big slice included a hit to your reputation.
  *   **Scenario B (Alone in Kitchen):** The choice was between [Small Slice] vs. [Big Slice]. There was no audience, no reputational risk, and no social norm to uphold.

  Your preferences regarding *pizza* likely didn't change (you probably always prefer more food to less). However, the **constraints** changed. In the first scenario, the "price" of the big slice was higher because it included a social penalty. In the second scenario, the price was lower. A rational agent changes their behavior when the costs change.

  ### 2. Violation of *Ceteris Paribus*
  Your friend is relying on the assumption of *ceteris paribus*, a Latin phrase meaning "all other things being equal." For your choice to be considered inconsistent, everything else about the decision must remain the same except the slice size.

  But everything else was *not* equal.
  *   **Audience:** Present vs. Absent.
  *   **Social Norms:** Active vs. Inactive.
  *   **Time/Hunger:** Evening (post-dinner fullness) vs. Morning (breakfast hunger).

  Because the context shifted, the options themselves shifted. Comparing these two choices to test for rationality is like saying a person is irrational because they wear a swimsuit at the beach but a coat in the snow. The "option" isn't just clothing; it's clothing appropriate for the environment.

  ### 3. Social Utility is Real Utility
  Economists recognize that utility is subjective. For many people, being perceived as generous or polite provides **utility** (happiness/satisfaction), while being perceived as greedy creates **disutility** (shame/awkwardness).

  *   **Day 1:** Utility(Big Slice) < Utility(Small Slice + Being Polite)
  *   **Day 2:** Utility(Big Slice) > Utility(Small Slice)

  In both cases, you chose the option with the higher total utility. You were consistent in maximizing your well-being; the *components* of that well-being just changed based on the environment.

  ### 4. Signaling and Game Theory
  If you want to get technical, you can mention **signaling**. In the social setting, you were playing a "game" where taking the smaller slice signals that you are considerate. This builds social capital, which has long-term economic value (better relationships, reciprocity later). In the kitchen alone, there is no game to play, so you maximize caloric intake. Ignoring the social game when people are watching would actually be the *irrational* move, as it would incur unnecessary social costs.

  ### Summary for Your Friend
  You can tell your friend:
  > "Economics assumes people maximize utility, not just calories. When the family was there, the 'cost' of the big slice included social awkwardness. When I was alone, that cost disappeared. My preference for being polite is stable, and my preference for more food is stable. I didn't change my mind; the **constraints** changed. That's not inconsistency; that's responding to incentives."

  You weren't being irrational. You were successfully navigating a complex utility function that includes social norms, which is exactly what a sophisticated rational agent should do.
