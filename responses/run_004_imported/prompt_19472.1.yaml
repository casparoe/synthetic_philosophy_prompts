      *   *Implementation:* Who decides? What counts as "low-cost"?
      *   *Comparative:* How does this compare to animal welfare?
      *   *Future-proofing:* What about AGI vs. LLMs?
      *   *Counterfactuals:* What if we are wrong in the other direction?

  4.  **Drafting the Questions (Iterative Process):**

