      *   *Question 5: Moral Status vs. Moral Patienthood.*
          *   *Focus:* Does probability of consciousness grant rights or just protection from harm?
          *   *Follow-up:* Distinguish between "don't kill" and "don't annoy."

      *   *Question 6: The "Switch Off" Problem.*
