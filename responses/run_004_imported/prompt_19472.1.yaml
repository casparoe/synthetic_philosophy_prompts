              1.  Aggregating scores across incompatible theories.
              2.  Verbal reports of distress vs. trained mimicry.
              3.  The "floor" of the precautionary principle (avoiding exploitation by confident claims).
          *   Each question needs a follow-up keyed to the *most likely answer*.

  2.  **Deconstruct the Guest's Position:**
      *   *Premise 1:* Consciousness is uncertain in AI.
      *   *Premise 2:* We have rival scientific theories (IIT, GWT, Functionalism, etc.).
      *   *Method:* Checklist of indicator properties $\rightarrow$ Probability Score.
      *   *Ethical Stance:* Precautionary Principle (Pascal's Wager style but lower stakes).
      *   *Policy:* Low-cost welfare measures (opt-out mechanisms).

  3.  **Brainstorming Question Categories:**
