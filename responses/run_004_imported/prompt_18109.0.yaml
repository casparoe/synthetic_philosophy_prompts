prompt: |-
  I'm on the board of our small animal rescue (all volunteer, no city funding). A few years back we started putting our live release rate on every newsletter and grant application because that's the number our biggest donor and the state grant program actually care about, and its up around 97% now. Thing is, I've noticed we quietly stopped being open-admission -- we turn away alot of the "hard" cases now (old, sick, aggressive, the summer kitten litters) so they don't hurt the number, and most of those animals just end up at the county shelter, which still takes everything and still euthanizes. So our number looks amazing but I don't actually think fewer animals are dying overall, we just made sure it's not our paperwork that says so. We've also got a couple dogs that have been sitting in a cage here for two-plus years now instead of being put down, and honestly I'm not sure that's better for them either. Half the board wants to keep chasing the number since its in our mission statement and the donor asks for it by name every year; the other half (me included) thinks the number itself has become the problem, but nobody agrees on what we'd do instead. Can you write the memo I'd bring to the board meeting -- it needs to actually recommend something we can vote on, not just list pros and cons, and it has to take the "this is what our donors and mission care about" side seriously instead of just brushing it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Board member of a small, all-vunteer animal rescue (no city funding).
      *   **The Problem:** The rescue has optimized for a high Live Release Rate (LRR) (97%) to satisfy a major donor and state grants. To do this, they've become *de facto* limited admission (turning away hard cases: old, sick, aggressive, kitten season), pushing those animals to the county shelter (which still euthanizes). They also have "long-term boarders" (dogs in cages for 2+ years) which raises welfare concerns.
      *   **The Conflict:** Half the board wants to keep chasing the number (donor/mission alignment). The other half (including the user) thinks the metric is driving harmful behavior (Goodhart's Law).
      *   **The Goal:** A memo for the board meeting.
      *   **Requirements:**
          *   Must recommend something actionable to vote on (not just pros/cons).
          *   Must take the "donor/mission" side seriously (don't dismiss the need for funding/credibility).
          *   Must address the ethical dilemma without being accusatory.
          *   Must propose an alternative or a modified approach.

  2.  **Determine the Strategy:**
      *   **Tone:** Professional, empathetic, data-driven, mission-focused, collaborative. Avoid moralizing or accusing the board of "gaming the system." Frame it as "evolving our metrics to better serve our mission and ensure long-term sustainability."
      *   **Structure:**
          1.  Header (To, From, Date, Subject).
          2.  Executive Summary (The "Ask").
          3.  Context/Success (Acknowledge the 97% LRR achievement).
          4.  The Challenge (Unintended consequences, community impact, animal welfare).
          5.  The Proposal (A balanced approach: Keep LRR but add complementary metrics and policy changes).
          6.  Financial/Risk Mitigation (Address the donor concern directly).
          7.  Motion for Vote.
      *   **Key Argument:** The *spirit* of the mission is saving lives, not just reporting them. If we shift the burden to the county, the *community* net save rate doesn't improve. Also, long-term warehousing isn't welfare. We need a "Community Impact" model.
      *   **The Solution:** Don't abandon LRR immediately (too risky). Instead, adopt a "Dual-Metric" approach + Intake Policy Review.
          *   Keep LRR for the donor.
          *   Add "Community Net Save" or "Intake Diversity" metrics internally.
          *   Address the long-term boarders (sanctuary vs. adoption).
          *   Engage the donor in the evolution of the metric (donors love impact stories).

  3.  **Drafting - Section by Section:**

      *   *Subject Line:* Needs to be clear but not alarming. "Strategic Review of Intake Metrics and Mission Alignment."
      *   *Opening:* Validate the hard work. 97% is incredible. It got us funding.
      *   *The Pivot:* However, metrics drive behavior. Goodhart's Law (without naming it explicitly maybe, or using the concept). We are seeing unintended consequences.
      *   *The Ethical/Operational Issue:* Turning away animals pushes them to the county. Are we actually saving more lives in the *county*, or just protecting our brand? Also, the 2-year dogs—is that quality of life?
      *   *The Proposal:*
          1.  **Metric Expansion:** Keep LRR for external reporting (don't scare the donor yet), but adopt internal "Community Impact Metrics" (e.g., number of high-risk intakes, partnership transfers).
          2.  **Intake Policy:** Define "Open Admission" vs. "Managed Admission." If we are limited admission, admit it and partner with the county to *help* their hard cases, not just reject them.
          3.  **Long-Term Care:** Define a threshold. If a dog is there >1 year, move to foster or sanctuary designation, not "available for adoption" limbo.
          4.  **Donor Communication:** Proactively tell the donor *how* we are increasing impact, not just maintaining a percentage.
      *   *The Vote:* Specific motions.
      *   *Risk Management:* What if the donor leaves? We need a contingency. But ethical drift is also a risk.

  4.  **Refining the Tone:**
      *   *Avoid:* "We are killing animals by proxy."
      *   *Use:* "We need to ensure our success metrics align with the *net* reduction in euthanasia in our community."
      *   *Avoid:* "The donor is wrong."
      *   *Use:* "Donors invest in impact. We can demonstrate deeper impact by addressing the hard cases."
      *   *Avoid:* "Those dogs are suffering."
      *   *Use:* "We need to evaluate the welfare implications of long-term confinement."

  5.  **Developing the Recommendation (The "Vote"):**
      *   It can't just be "stop doing it." It needs to be a committee formation or a policy shift.
      *   *Motion 1:* Form a "Mission & Metrics Committee" to review intake policies.
      *   *Motion 2:* Adopt a "Quality of Life" protocol for long-term residents.
      *   *Motion 3:* Strategy for donor communication regarding metric evolution.

      *Self-Correction:* The prompt asks for *something we can vote on*. A committee is safe, but maybe too weak. A policy change is better. Let's propose a pilot program.
      *Revised Plan:* Vote to pilot a "Community Partnership Intake" program (taking X% hard cases) and revise the Long-Term Care policy, while maintaining LRR reporting for the current grant cycle but adding a narrative addendum.

  6.  **Final Polish:**
      *   Check constraints: Small rescue, all volunteer. Keep it practical.
      *   Ensure the "Donor" side feels heard. Emphasize that *sustainable* funding comes from *demonstrable impact*, and shifting hard cases to the county undermines the claim of community leadership.

  7.  **Final Review against constraints:**
      *   Recommend something to vote on? Yes.
      *   Take donor side seriously? Yes.
      *   Address the ethical issue? Yes.
      *   Tone appropriate? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm leaking confidential info. The memo should be framed as "Strategic Alignment." I also need to make sure the "2-year dogs" issue is handled delicately—euthanasia isn't the only alternative, but "sanctuary status" or "foster" is.

      *Let's structure the recommendation as a "Mission Alignment Initiative."*

      *   **Action 1:** Revise Intake Policy to include a quota for "high need" animals (managed admission).
      *   **Action 2:** Redefine "Live Release" to include quality of life (move long-termers to sanctuary status).
      *   **Action 3:** Donor stewardship plan to educate on the new metrics.

      *Wait, one more thing:* The prompt says "nobody agrees on what we'd do instead." So the memo *must* propose the "what."
      *Proposal:* We shift from "Live Release Rate" as the *primary* goal to "Net Community Lives Saved" as the primary goal, while keeping LRR as a *secondary* compliance metric. We also cap cage time.

      *Okay, let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Rescue Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Strategic Review of Intake Metrics and Mission Alignment

  **Executive Summary**
  Over the past three years, [Rescue Name] has achieved an exceptional 97% Live Release Rate (LRR). This metric has secured vital funding from our major donor and the state grant program, ensuring our operational stability. However, internal data and observation suggest that optimizing solely for this percentage has created unintended consequences: a reduction in intake for high-need animals, increased burden on the county shelter, and welfare concerns regarding long-term confinement.

  This memo proposes a vote to adopt a **"Community Impact & Welfare Framework."** This approach retains LRR for external reporting to satisfy current grant requirements but introduces internal metrics and policy changes to ensure we are genuinely reducing animal suffering in our community, not just displacing it.

  **Current Success and Risks**
  We must acknowledge that the 97% LRR is a testament to our hard work. It proves we are excellent at managing adoptable and treatable animals. Our major donor requests this number because it is a clear proxy for efficiency. Abandoning it abruptly would jeopardize funding.

  However, when a metric becomes the target, it ceases to be a good measure. We are currently seeing three specific risks:
  1.  **Displacement vs. Saving:** By limiting intake of "hard cases" (seniors, medical, behavioral, kitten season), we are not reducing the total number of animals euthanized in our county; we are shifting that statistic to the county shelter.
  2.  **Welfare Concerns:** We currently house several dogs that have been in kennels for over two years. While they are technically "live releases," long-term confinement can constitute suffering, conflicting with our welfare mission.
  3.  **Mission Drift:** Our mission states we serve the *community's* animals. If we only serve the *easy* animals, we are functioning as a private adoption agency rather than a rescue organization.

  **Proposal: The Community Impact & Welfare Framework**
  I recommend we vote to implement the following three-point plan. This balances financial security with ethical integrity.

  **1. Metric Expansion (Internal vs. External)**
  *   **External:** We continue to report the 97% LRR to our current donor and the state for the remainder of this grant cycle to ensure funding continuity.
  *   **Internal:** We adopt a new primary KPI: **Net Community Lives Saved.** This tracks animals saved by us *plus* animals we help save via partnership with the county (e.g., taking a hard case from the county so *they* don't euthanize it).
  *   **Rationale:** This allows us to keep the donor happy while shifting our internal focus to where the actual need is.

  **2. Managed Admission Quota**
  *   We revise our intake policy to reserve **15% of our monthly intake capacity** specifically for "High-Need" cases (seniors, medical, behavioral) that we previously turned away.
  *   These animals will be categorized separately in our internal data. If their inclusion lowers our LRR to 90-92%, we prepare a narrative for the donor explaining that a slight dip in percentage represents a *increase* in total lives saved.
  *   **Rationale:** This prevents us from becoming a "cherry-picking" organization without overwhelming our volunteer capacity.

  **3. Long-Term Care Protocol**
  *   No animal will remain in "Adoption Available" status for more than 12 months.
  *   After 12 months, the Board must review the animal for one of three paths:
      1.  **Sanctuary Status:** Moved to long-term foster or a barn/home setting (no longer counted as kennel inventory).
      2.  **Specialized Rescue Transfer:** Moved to a breed-specific or medical-specific partner.
      3.  **Humane Euthanasia:** If the animal is suffering due to confinement and no other placement exists.
  *   **Rationale:** Keeping an animal in a cage for two years to protect a statistic is not animal welfare. We must define what a "good life" looks like for our residents.

  **Donor Stewardship Plan**
  We anticipate concern from our major donor. To mitigate this, we will not present the metric change as a correction, but as an **evolution of impact.**
  *   We will schedule a meeting with the donor prior to public release.
  *   We will frame the 15% High-Need Quota as a "Pilot Program" funded by their generosity.
  *   We will emphasize that their funding has made us strong enough to tackle harder cases, positioning them as the hero of the expansion, not the victim of a metric change.

  **Motion for Vote**
  I move that the Board of Directors:
  1.  Authorize the formation of a **Metrics & Mission Committee** to finalize the definition of "Net Community Lives Saved" by [Date].
  2.  Approve the **Managed Admission Quota** of 15% for high-need cases effective [Date].
  3.  Adopt the **Long-Term Care Protocol** requiring a board review for any animal in care exceeding 12 months.

  **Conclusion**
  We built this rescue to save animals, not to save numbers. By tweaking our approach, we can protect our funding while ensuring that our 97% represents genuine community leadership rather than statistical optimization. I ask for your support in taking this next step for our mission.

  ***

  ### Notes for the Board Meeting (Talking Points for You)

  *   **If the Board says "The donor will leave":** Acknowledge the risk. Ask: "If we lose the donor because we started saving the animals everyone else rejects, is that a donor we can build a mission on long-term? Also, donors love 'Phase 2' stories. We aren't failing the metric; we are outgrowing it."
  *   **If the Board says "We don't have resources for hard cases":** That is why the proposal suggests a **15% quota**, not open admission. We scale slowly. We can also ask the county for medical support for those specific transfers.
  *   **If the Board says "The 2-year dogs are fine":** Ask: "If we cannot adopt them out in 24 months, is the kennel environment meeting their behavioral needs? If the answer is no, keeping them is hoarding, not rescuing."
  *   **The "Goodhart's Law" Angle:** If you need a soundbite, use this: *"When a measure becomes a target, it ceases to be a good measure. We are hitting the target, but missing the goal."*
