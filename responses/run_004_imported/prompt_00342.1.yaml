  *Revised Plan for "Why it fails":*
  1.  **The Bookie's Knowledge:** The bookie needs to know the agent's updating rule *before* the evidence arrives to set the first bet.
  2.  **The Agent's Commitment:** The agent must be committed to accepting the second bet. If they can reject it, no sure loss.
  3.  **Epistemic vs. Pragmatic:** Does avoiding loss equal truth-tracking?
  4.  **Time-Slice Independence:** Why should $t_2$ care about $t_1$'s wallet?

