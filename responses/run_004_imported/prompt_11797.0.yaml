answer: |-
  **Setting:** *A quiet corner of the faculty lounge, shortly after a seminar on Longtermism and Climate Economics. Two coffee cups sit untouched between them.*

  **Characters:**
  *   **Dr. Aris Thorne:** An economist specializing in intergenerational growth models. Pragmatic, mathematically rigorous.
  *   **Dr. Elena Vance:** A moral philosopher specializing in population ethics and the Sidgwick-Parfit tradition. Principled, conceptually precise.

  ***

  **Elena:** You defended the parameter well, Aris. But when you wrote $\delta = 0.015$ on the whiteboard, I heard Frank Ramsey turning in his grave. You remember his charge? That a positive pure rate of time preference is "a mere weakness of the imagination," ethically indefensible. It implies we care less about a person simply because they are born later.

  **Aris:** I do remember. And I respect Ramsey. But I also respect the mathematics of infinite horizon optimization. If we set the pure rate of time preference, $\delta$, to exactly zero, we run into the problem of non-convergence. If the future is unbounded and utility is positive, the sum of discounted utilities diverges. The optimization problem becomes ill-posed. We literally cannot calculate the "best" path because every path yields infinite value. A positive $\delta$ isn't just bias, Elena; it's a mathematical necessity for decision-making over an infinite horizon.

  **Elena:** That's the standard economist's shield, but it's porous. First, divergence can be handled with alternative criteria—the overtaking criterion, or catching-up criteria. We don't need to abandon impartiality just because the calculus gets tricky. Second, and more importantly, look at the magnitude. You're using 1.5%. The Stern Review used 0.1%. Nordhaus uses roughly your rate. Mathematical convergence only requires an infinitesimal $\epsilon$. It does not require a rate that halves the moral weight of a human life every fifty years. The gap between Stern and Nordhaus isn't about convergence; it's about ethics.

  **Aris:** Is it? Or is it about opportunity cost? You treat $\delta$ as a moral parameter in isolation. But in the Ramsey rule, $r = \delta + \eta g$. The discount rate reflects the return on capital. If I tell society to save massively for the future—essentially forcing $\delta \to 0$—I am demanding massive capital accumulation today. That drives down the marginal return on capital. Market interest rates carry genuine normative information; they reflect the revealed preferences of actual people trading off present consumption against future security. To ignore that is to impose a tyranny of the theorist over the living.

  **Elena:** But the "people" whose preferences are revealed in market rates don't include the future generations you claim to be saving. They can't bid in today's market. This is exactly the point Parfit and Cowen made in their joint critique. They argued that using market rates to determine the social discount rate is circular. It takes the existing capital stock and existing inequalities as given. It's like saying we shouldn't redistribute wealth because the market says money is currently more valuable to the rich.

  **Aris:** It's not circular; it's about the chain of compensation. If we invest less today to mitigate climate change, growth slows. Future people might have a cleaner climate, but they will be poorer in terms of capital stock. If $\delta$ is too low, we might impoverish the present so severely that we leave the future a smaller economy, less capable of solving *their* problems. A positive $\delta$ acknowledges that future people will likely be richer than us due to technological progress. It's not that their lives matter less; it's that the marginal utility of consumption is lower for them. That's the $\eta g$ term.

  **Elena:** I agree that growth affects marginal utility. That's the $\eta g$ term, and I'll grant you that. But you're smuggling ethical weight into $\delta$ that belongs elsewhere. Parfit's analogy holds: Discounting by time is morally equivalent to discounting by distance. If you said, "We care less about people in Bangladesh because they are far away," you'd be accused of spatial bias. Why is "temporal bias" acceptable?

  **Aris:** Because time has a direction that space does not. Causality flows forward. Uncertainty increases with time. There is a non-zero probability that humanity goes extinct, or that the technology to solve the problem emerges spontaneously. A positive $\delta$ can act as a proxy for existential risk. If there's a 1% chance humanity doesn't make it to 2100, discounting at 1% isn't bias; it's probability weighting.

  **Elena:** That's a stronger argument. But you must admit that in the Stern-Nordhaus debate, the disagreement wasn't primarily about existential risk probabilities. It was about the *pure* rate. Stern argued that absent extinction risk, $\delta$ should be zero. Nordhaus argued for a positive rate based on opportunity cost. If we strip away the empirical disagreements about growth rates ($g$) and the elasticity of marginal utility ($\eta$), are you left defending a positive $\delta$ on purely ethical grounds? Can you look me in the eye and say a child born in 2200 has less moral worth than a child born in 2020?

  **Aris:** *Pauses, stirring his coffee.* No. I cannot say they have less moral worth. That is indefensible. However, I will defend a positive $\delta$ as a procedural rule for *aggregation*, not a statement on *worth*. If we treat all generations as equals with $\delta = 0$, the present generation becomes a slave to the future. The "Repugnant Conclusion" looms in intergenerational form. We could be forced to reduce current consumption to subsistence levels to maximize the sum of utilities for an infinite future. A positive $\delta$ protects the standing of the present generation against the infinite demand of the future. It's a boundary condition for a sustainable ethics, not a denial of equality.

  **Elena:** So you view it as a constraint on obligation rather than a discount on value?

  **Aris:** Precisely. It prevents the moral calculus from demanding infinite sacrifice.

  **Elena:** I can accept that as a pragmatic concession, provided we acknowledge it's a second-best solution. But let's return to the crux of the Stern-Nordhaus dispute. You admitted earlier that $\delta$ is often doing heavy lifting for other parameters. If we agree that $\delta$ should be near-zero ethically, does the divergence remain?

  **Aris:** If $\delta \approx 0$, then the discount rate is driven almost entirely by $\eta g$. Nordhaus assumes high growth ($g$) and moderate elasticity ($\eta$), leading to a high discount rate. Stern assumes lower growth and higher elasticity regarding climate damages, leading to a low discount rate. So, yes, much of the policy divergence is empirical. It's about how much richer we think the future will be and how much they will value a stable climate relative to consumption.

  **Elena:** Then why the vitriol? Why does it feel like an ethical clash?

  **Aris:** Because $\delta$ is the handle policymakers can turn. It's easier to argue about the "fairness" of the rate than to model the precise trajectory of TFP growth for the next three centuries. $\delta$ becomes a proxy for patience. But you're right. If we settled the empirical questions—growth, risk, damages—the ethical disagreement over $\delta$ would shrink to that infinitesimal $\epsilon$ required for convergence.

  **Elena:** And that $\epsilon$ is where Ramsey was right. It is a weakness of the imagination to treat that $\epsilon$ as 1.5%. It allows us to ignore the far future without admitting we are ignoring it. We call it "economic efficiency," but it's temporal parochialism.

  **Aris:** And yet, without it, the model breaks. Perhaps the truth is that the Ramsey formula itself is the limitation. It tries to compress a complex moral relationship between generations into a single exponential decay factor.

  **Elena:** Agreed. Parfit would say we need a different moral theory, not a better discount rate. But until we have that, Aris, will you concede that in your next paper, you'll treat $\delta$ as a tragic necessity rather than a normative virtue?

  **Aris:** *Smiles faintly.* I can treat it as a parameter of scarcity, not morality. I'll acknowledge that a lower $\delta$ is ethically preferable, even if it makes the optimization harder. But you must concede that if we force $\delta$ to zero, we must be prepared for the present generation to consume significantly less. There is no free lunch in intergenerational ethics.

  **Elena:** And I will concede that if the future is indeed vastly richer, the *value* of transferring resources to them diminishes, even if their *moral status* does not. The fight isn't about whether they matter. It's about how much they need us.

  **Aris:** Then perhaps the Stern-Nordhaus debate was never really about $\delta$.

  **Elena:** No. It was about whether we believe the future is a foreign country that we should visit, or a colony that we own.

  **Aris:** I'll drink to that.

  **Elena:** *Raises her cup.* To the imagination. May it strengthen.
