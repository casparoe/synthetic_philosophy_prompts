      *   **Philosopher's Counter (Spatial Analogy):** Parfit's *Reasons and Persons*. Discounting by time is like discounting by distance. Why is 2050 less important than 2024 just because it's later? Also, the magnitude issue: Nordhaus uses ~1.5%, Stern uses ~0.1%. Convergence only needs $\epsilon$. The gap is ethical, not mathematical.
      *   **Economist's Rebuttal (Market Rates & Opportunity Cost):** It's not just math; it's about opportunity cost. If we invest less now, capital is scarcer, rates rise. Market rates reflect revealed preference of actual people. Also, the "chain of compensation" argument (Beckerman/Heal).
      *   **Philosopher's Counter (Identity & Non-Identity):** Future people don't exist to reveal preferences. The non-identity problem. We can't use market rates for non-existent agents.
      *   **Economist's Concession/Nuance:** Distinguish between *descriptive* discounting (market) and *prescriptive* discounting (ethical). Acknowledge Stern's low $\delta$ is ethically defensible but economically radical.
      *   **The Crux (Stern vs. Nordhaus):** Is it $\delta$ or is it $\eta$ (elasticity of marginal utility) and $g$ (growth)?
