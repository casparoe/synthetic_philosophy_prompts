answer: |-
  **Setting:** *A university coffee shop, shortly after a seminar on Analytical Marxism. Two graduate students, Julian and Sarah, are reviewing their notes. Both are well-versed in the primary texts and the secondary literature.*

  **Julian:** I have to say, I think Allen Wood gets the better of the exchange. It's the only reading that takes Marx's historical materialism seriously. If you read *Capital* Volume One closely, Marx is explicit: in the sphere of circulation, the worker and the capitalist meet as equals. The worker sells labor-power, the capitalist buys it. They exchange equivalents. As Marx writes, "This sphere... is in fact a very Eden of the innate rights of man." If the exchange is equivalent, where is the injustice?

  **Sarah:** But Julian, you're stopping at the sphere of circulation. Marx immediately drags us into the "hidden abode of production." He doesn't just say surplus value is extracted; he calls it "theft," "robbery," and "appropriation of unpaid labor." You can't read those terms as mere metaphors without stripping Marx's rhetoric of all its force. If I steal your watch, I've violated a property right. When the capitalist appropriates surplus labor, Marx says they are stealing the worker's time. That sounds like a charge of injustice to me.

  **Julian:** It sounds like it, but you have to look at what Marx thinks "justice" *is*. For Marx, justice is a juridical concept. It belongs to the superstructure. As he argues in *The German Ideology*, legal relations arise from material relations. So, a transaction is "just" if it corresponds to the prevailing mode of production. Since the wage-labor relation is the engine of capitalism, it is, by definition, just *within capitalism*. To call it unjust is to apply an external, moralistic standard, which Marx explicitly mocks in the *Critique of the Gotha Programme*. He laughs at the Lassalleans demanding "fair distribution." He calls that "obsolete verbal rubbish."

  **Sarah:** I agree he mocks the Lassalleans, but not because he thinks questions of distribution are irrelevant. He mocks them because their conception of "fairness" is stuck within *bourgeois right*. But look at how he transitions to the higher phase of communist society. He says, "In a higher phase... only then can the narrow horizon of bourgeois right be crossed in its entirety." The fact that he posits a horizon *beyond* bourgeois right implies that bourgeois right is limited, defective. If Marx evaluates the capitalist mode of production from the standpoint of the proletariat, and the proletariat represents the future communist society, then he is judging capitalism by the standard of that future society. That's Husami's point. Historical materialism doesn't trap us in the present; it allows the emerging class to judge the old order by the standards of the new one.

  **Julian:** But that assumes Marx has a trans-historical theory of justice, which he explicitly denies. When Marx says bourgeois right is "defective," he doesn't mean it's *unjust*. He means it's historically necessary but limited. You're conflating "bad" with "unjust." Marx certainly thinks capitalism is bad. He thinks it's exploitative, crisis-ridden, and dehumanizing. But his indictment isn't that it violates rights; it's that it alienates workers from their species-being. The worker doesn't own the product, doesn't control the process, and is estranged from other workers. That's an ontological critique, not a juridical one. If you frame it as injustice, you're inviting reformist demands for "fair wages" rather than the abolition of the wage system itself.

  **Sarah:** I think you're creating a false dichotomy between alienation and justice. Why can't the demand for the abolition of the wage system be a demand for justice? Consider *Theories of Surplus Value*. Marx writes that capitalist production is "antagonistic to the development of the mass of the workers." He contrasts the capitalist's appropriation with the worker's need to appropriate the conditions of their own realization. If the worker produces the capital that dominates them, that is a violation of a normative claim about who *should* control the means of production. That "should" is a claim of justice. And regarding *Gotha*: Marx critiques the "equal right" of socialism because it recognizes class differences tacitly. Why critique it as a defect if there isn't a standard of non-defective social organization he is appealing to?

  **Julian:** Because the standard isn't justice; it's human flourishing. Look, if I say a car engine is "defective" because it can't fly, I'm not being unjust to the engine. I'm judging it by a standard of functionality it wasn't designed for. Marx treats capitalism the same way. It's functionally necessary for a time, but it becomes a fetter on human development. When he uses the word "robbery," he's describing the *mechanism* of accumulation, not filing a legal brief. If it were actual robbery in the juridical sense, the capitalist state would punish it. But the state protects it. So, for Marx to call it robbery, he must be using the term to describe the *material* transfer of value, not a violation of *right*. Wood's point is that if you insist capitalism is unjust, you're implicitly accepting the bourgeois framework of rights that you ought to be overthrowing.

  **Sarah:** But that renders Marx's critique entirely internal to capitalism's own logic. If we can't say capitalism is unjust, even from the standpoint of the future, then on what basis do we rally the workers? You say "human flourishing," but isn't that just a substantive theory of the good life? And if we have a theory of the good life that capitalism violates, why isn't that a theory of justice? Husami argues that for Marx, justice is class-relative. Bourgeois justice says the wage contract is fair. Proletarian justice says the appropriation of surplus value is theft. Marx isn't stepping outside history to judge capitalism; he's standing firmly with the proletariat *within* history, articulating their normative standpoint against the capitalists. When Marx says the capitalist "usurps" the labor of others, that is a normative condemnation.

  **Julian:** It is a normative condemnation, I grant you that. But is it *justice*? Marx distinguishes between the "rights of man" and "human emancipation." Justice belongs to the former; communism belongs to the latter. In *On the Jewish Question*, he shows how rights isolate individuals. If you demand justice, you're demanding a fairer distribution of rights within a framework of isolation. Marx wants to abolish that framework. That's why the *Gotha* critique is so damning for your position. He says, "Right can never be higher than the economic structure." If the economic structure is capitalist, the right is capitalist. You can't jump the gun. The injustice only becomes visible *after* the revolution, when looking back. To fight *for* justice is to fight for a better form of bourgeois society. To fight for communism is to fight beyond justice.

  **Sarah:** I think you're reading "Right can never be higher" too deterministically. Yes, right is constrained by the economic structure, but revolutionary practice *changes* the economic structure. The proletariat's conception of justice is part of the material force that transforms that structure. You mention *On the Jewish Question*, but consider *Capital* Volume Three, where Marx discusses the "realm of freedom." He says the true realm of freedom begins only where labor determined by necessity ends. The capitalist curtails that realm for the worker to expand it for themselves. That is an unequal distribution of freedom. If justice is about giving each their due, and the worker is due the fruit of their labor to achieve that freedom, then capitalism is unjust. You say Wood argues we should focus on alienation. But alienation *is* the experience of injustice from the inside. It's the lived reality of being robbed of one's agency.

  **Julian:** But if you call it injustice, you invite the wrong solutions. If the problem is "unfair distribution," the solution is redistribution—taxes, welfare, higher wages. That's social democracy, not Marxism. If the problem is that the *production relation itself* is alienating, the solution is the abolition of private property and the wage system. Wood's reading protects the revolutionary core of Marx. It forces us to see that you can't make capitalism just. You have to end it. By calling it unjust, you imply it could be made just, perhaps by paying the worker the "full value" of their product. But Marx says that's impossible within commodity production. The surplus is necessary for accumulation. So the injustice isn't an accident; it's the feature. But calling it "injustice" suggests it's a moral failure rather than a structural necessity.

  **Sarah:** I disagree that calling it injustice implies reformism. The Civil Rights movement called segregation unjust; that didn't lead to mere reform, it led to a fundamental restructuring of social relations. Why can't the proletariat's claim of "theft" function the same way? It delegitimizes the system. You say paying the full value is impossible. Exactly! That's why the system is unjust—it promises equivalence in the market but delivers domination in production. Marx exposes this contradiction. He shows that the "justice" of the market is a sham that masks the "injustice" of production. Husami's point is that Marx is exposing the hypocrisy of bourgeois justice by holding it up against the material reality of exploitation. He's not rejecting justice; he's rejecting the *bourgeois definition* of it in favor of a proletarian one.

  **Julian:** But does Marx ever define that proletarian justice? Or does he always retreat to describing the conditions of emancipation? Whenever he gets close to defining a principle of distribution, like in *Gotha*, he critiques it. "From each according to his ability, to each according to his needs!" isn't a principle of justice; it's a principle of abundance that renders justice obsolete. Justice is about adjudicating claims over scarce resources. Communism, for Marx, is about overcoming that scarcity and the conflict it generates. So, to say capitalism is unjust is to judge it by a standard that Marx thinks will eventually disappear. It's anachronistic.

  **Sarah:** It's not anachronistic if it's the midwife of that future. The claim of injustice is the lever that pries open the present. You rely heavily on the idea that Marx rejects moralizing. But as Engels later admitted, they often had to use moral arguments to reach the masses. Textually, though, look at *Wage Labour and Capital*. Marx says the worker "works for the capitalist, not for himself." This implies a claim of self-ownership. If I own my labor, and you take the product without my consent, that is theft. Marx doesn't deconstruct the concept of self-ownership here; he uses it to show the capitalist violates it. He meets the bourgeois on their own ground to show they aren't living up to their own ideals. That is a charge of injustice.

  **Julian:** He uses it rhetorically, sure. But analytically? In *Capital*, he dismantles the idea that the worker sells "labor." They sell "labor-power." That distinction is crucial. If they sold labor, they would be owed the full value of the product. But they sell the capacity to work for a set time. The capitalist owns that time. So, analytically, there is no theft. The worker is paid for what they sold. The surplus comes from the difference between the value labor-power creates and the value of labor-power itself. That's a structural gap, not a moral violation. If you insist on the theft narrative, you have to ignore Marx's own correction of the classical economists on the nature of the commodity being sold.

  **Sarah:** But that structural gap is sustained by coercion. The worker sells labor-power because they are separated from the means of subsistence. That original separation—primitive accumulation—Marx describes as "written in the annals of mankind in letters of blood and fire." That was theft. And the reproduction of that separation is the ongoing condition of the "fair" exchange. So the "fair" exchange rests on an original and sustained injustice. Marx knows this. He traces the genealogy of capital to show that the "Eden of rights" is built on a foundation of violence. You can't separate the clean exchange in Volume One from the bloody history that made it possible. The justice of the transaction is tainted by the injustice of the history.

  **Julian:** I concede that primitive accumulation was violent. Marx calls it conquest and enslavement. But that's pre-capitalist. Once capitalism is established, the reproduction of the relation happens through economic means, not extra-economic coercion. The worker is "free" in a double sense: free to sell their labor, and free from the means of production. That freedom is the basis of the juridical relation. To say the outcome is unjust because the starting point was violent is a moral argument, not a materialist one. The materialist argument is that this relation develops the productive forces until it bursts its fetters. The indictment is that it becomes a barrier to further development, not that it's "mean."

  **Sarah:** But the "barrier to development" includes the development of the worker as a human being. That brings us back to alienation. If the system stunts human potential, it violates the highest standard of social organization Marx can conceive. Why hesitate to call that injustice? Perhaps the disagreement is semantic. You want to reserve "justice" for bourgeois right to show its limits. I want to expand "justice" to include the proletarian claim to the conditions of their own humanity. But if we look at the text, Marx doesn't shy away from the moral weight of "exploitation." He calls it a "vampire-like" thirst for labor. That's not neutral scientific description. That's condemnation. And condemnation implies a norm. If the norm isn't justice, what is it?

  **Julian:** It's freedom. Not juridical freedom, but real freedom. The freedom from necessity. Justice is a virtue of institutions that manage conflict. Communism is the dissolution of that conflict. So, to judge capitalism as unjust is to treat it as a bad version of a society of rights. Marx treats it as a bad version of a human society. The distinction matters. If we follow Wood, we stop asking "Is this fair?" and start asking "Does this allow for the free development of all?"

  **Sarah:** And I say those questions are inseparable. You cannot have the free development of all while one class appropriates the surplus labor of another. That relation *is* the injustice. Husami helps us see that Marx's historical materialism isn't a cage that prevents normative judgment. It explains *whose* judgment counts. The proletariat's judgment is that this system is robbery. And since the proletariat represents the future, their judgment is the one that matters for Marx. To tell them, "Actually, strictly speaking, this isn't unjust," is to disarm them theoretically.

  **Julian:** Or it's to arm them with a clearer understanding of what they're fighting against. Not a moral wrong, but a historical dead-end. But I see your point. If we strip the moral force from "exploitation," we risk turning Marxism into a dry sociology.

  **Sarah:** Exactly. And if we insist it's *only* moral, we risk turning it into liberalism. Maybe the truth is in the tension. Marx uses the language of justice to mobilize, but the language of science to analyze.

  **Julian:** I can live with that. As long as we agree that the "science" shows the wage relation is internally consistent with capitalism, even if it's morally repugnant to the future society.

  **Sarah:** Agreed. But I maintain that for Marx, "internally consistent" doesn't mean "beyond critique." It just means the critique must come from the future, not the present's own rulebook.

  **Julian:** Fair enough. Though I still think Wood is right that Marx would roll his eyes at us arguing about "rights."

  **Sarah:** *(Laughs)* Probably. He'd tell us to go organize. But until then, we have to get the theory right.

  **Julian:** Cheers to that.
