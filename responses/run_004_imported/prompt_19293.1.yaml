prompt: |-
  So my older sister Maya is getting married in like 3 weeks and she asked ME (her annoying 16 year old sibling) to give the toast at the rehearsal dinner, which is already terrifying on its own. Backstory: we had to read big chunks of Franklin's autobiography for APUSH this semester, and the part where he makes that whole chart of 13 virtues and tracks himself with a dot every time he messes up literally made me think of Maya, bc she has done the EXACT same thing since she was like 12 -- color coded bullet journals, a habit tracker app with streaks, an actual laminated chore chart from middle school that my mom still has taped inside a cabinet. I want to build the toast around that comparison (like, "here's a guy who invented a whole moral self-improvement system 250 years before habit trackers were a thing, and my sister basically reinvented it from scratch") and get into the part where Franklin admits he never actually nailed all the virtues, especially humility, plus that bit about the guy who wants his axe polished all the way and eventually decides he likes it "speckled" because its way less work than he thought -- I think that's actually the perfect note to land the toast on but I have no idea how to get there without it sounding mean, like I'm just saying she's a control freak who never finishes anything.

  The problem is the audience is SO mixed. My grandma is coming and she's pretty religious and takes "striving to be good" seriously, so she might not vibe with a joke that sounds like its about giving up on being virtuous. My sister's fiancé Dan has never read a word of Franklin in his life and will be completely lost if I go too deep into it. But also like half of Maya's friends are on the debate team with her and definitely read the same excerpt, so they'll 100% clock it if I get the Franklin stuff wrong or make it too shallow/Wikipedia-summary-of-the-13-virtues. Can you actually write the toast for me, like a full script, roughly 2-3 minutes if read out loud? I don't want the Franklin thing to just be decoration sitting on top of a normal toast -- I want it to actually be doing the work of both the joke AND the sincere part, and it has to end sweet and not cynical, even though "you're never going to actually finish becoming perfect and that's sort of fine" is a pretty cynical thing to say if you land it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** 16-year-old sibling (self-described as "annoying").
      *   **Occasion:** Rehearsal Dinner (more intimate than the wedding, but still formal enough for a toast).
      *   **Honoree:** Older sister Maya (getting married in 3 weeks).
      *   **Core Theme:** Benjamin Franklin's 13 Virtues / Autobiography (APUSH connection) vs. Maya's obsession with organization/self-improvement (bullet journals, habit trackers, chore charts).
      *   **Key Franklin References:** The chart of virtues, the dot system, the failure to achieve perfection (especially humility), the "speckled axe" anecdote.
      *   **Audience:** Mixed. Religious Grandma (values virtue), Fiancé Dan (no Franklin knowledge), Debate Friends (know Franklin well).
      *   **Tone:** Funny but sincere. Not mean/cynical (avoiding "control freak" vibes). Needs to land on "imperfection is okay/connection is better."
      *   **Length:** 2-3 minutes spoken (approx. 300-450 words).
      *   **Goal:** Integrate the Franklin analogy deeply, not just as a surface joke.

  2.  **Deconstruct the Franklin Analogy & Potential Pitfalls:**
      *   *The Trap:* Calling Maya a control freak or saying she gives up on things.
      *   *The Fix:* Frame her organization as *caring deeply* about being a good person/partner, not just being bossy.
      *   *The "Speckled Axe":* This is the tricky part. Franklin decided perfection was too much work. For a wedding, we don't want to say "marriage is too much work, so just settle." We want to say "perfection isn't the goal, love is."
      *   *Grandma:* Needs to hear that striving for good is still good.
      *   *Dan:* Needs to understand the reference without a history lecture.
      *   *Debate Friends:* Need accurate references (13 virtues, humility, the axe).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, the age gap, and the "annoying sibling" dynamic. Establish the APUSH connection immediately but simply.
      *   **The Comparison:** Describe Maya's systems (journals, charts) and link them to Franklin's virtue chart. Make it affectionate, not critical.
      *   **The Franklin Twist (Humility):** Mention Franklin's failure to master humility. Connect this to Maya. Maybe she's perfect at organizing, but learning to share control with Dan.
      *   **The Speckled Axe (The Climax):** Explain the anecdote simply (polishing the axe). Reframe it. It's not about laziness; it's about accepting flaws for the sake of the relationship.
      *   **The Turn to Dan:** Bring the fiancé in. He is the "speckle" or the partner in imperfection.
      *   **Closing:** A wish for their future. Not perfection, but happiness. Raise a glass.

  4.  **Refining the Tone (Iterative Process):**
      *   *Drafting thought:* "Maya loves charts just like Franklin." -> *Better:* "Maya didn't need to read Franklin to know how to track virtue."
      *   *Drafting thought:* "Franklin gave up on being perfect." -> *Better:* "Franklin realized perfection wasn't the point."
      *   *Drafting thought:* "Dan, you're the speckle." -> *Better:* "Dan, you're the reason she doesn't need the chart anymore." (Wait, that might undermine her). Let's go with: "Dan, you're the one who helps her see the axe doesn't need to be shiny."
      *   *Addressing Grandma:* Ensure the word "virtue" is treated with respect.
      *   *Addressing Debate Team:* Make sure the "Order" and "Humility" virtues are hinted at.

  5.  **Writing the Script (incorporating timing):**
      *   *Word Count Check:* A 2-3 minute speech is roughly 300-400 words at a moderate pace. I need to be concise.
      *   *Voice:* 16-year-old smart kid. Not too childish, not too academic. A bit self-deprecating.

  6.  **Review against Constraints:**
      *   *Mean?* No, frame the tracking as love/care.
      *   *Cynical?* No, frame the "speckled axe" as acceptance, not laziness.
      *   *Franklin Accurate?* Yes, 13 virtues, humility, axe anecdote included.
      *   *Audience Check:* Dan gets context, Grandma gets respect, Debate kids get accuracy.

  7.  **Final Polish:** Check the flow. Ensure the transition from the joke to the sincere wish is smooth. (Self-Correction: Make sure I explicitly mention the "speckled axe" story clearly enough for Dan to get it without bogging down).

      *(Self-Correction during drafting)*: I need to make sure I don't imply Maya is *actually* humble yet. The joke is she's working on it. And the axe story needs to land as "marriage isn't about perfection."

  8.  **Final Output Generation** (Proceeding to generate the script based on these thoughts).

      *Wait, one more thing:* The prompt asks for the toast to be *written*. I should provide the script clearly. I will also add a few "stage directions" in brackets to help the user with delivery.

      *Let's check the "Speckled Axe" logic again.* Franklin's story: A man wants his axe polished. The smith says he has to turn the wheel. The man gets tired and says he likes the speckled axe. Franklin's point was sometimes people settle for mediocrity. *My pivot:* For a wedding, the point must be that *human connection* is worth more than *polished perfection*. A speckled axe still cuts wood. A imperfect marriage still holds love. That's the key distinction to avoid cynicism.

      *Okay, ready to write.*
answer: |-
  **Toast for Maya's Rehearsal Dinner**
  **(Time: Approx. 2:30 – 3:00 minutes)**

  [Stand up, take a breath, and smile at Maya. Keep the paper in hand, but look up often.]

  Hi everyone. For those who don't know me, I'm [Your Name], Maya's younger sibling. And yes, I am the annoying one. So when Maya asked me to give this toast, I was terrified. Mostly because she probably has a color-coded rubric for what a "Good Sibling Speech" looks like, and I'm worried I'm going to lose points on "Eye Contact" and "Posture."

  [Pause for laughter]

  But seriously, preparing for this made me think about this semester in APUSH. We had to read Benjamin Franklin's autobiography. You know the part: where he makes that chart of 13 Virtues—Temperance, Silence, Order, all that—and he puts a black dot next to one every time he messes up. He spent his whole life trying to clear the page.

  And I read that, and I immediately thought: *Maya has been doing this since she was twelve.*

  [Gesture to Maya]

  I'm talking about the laminated chore charts from middle school. The color-coded bullet journals. The habit tracker apps with the streaks that we are all afraid to break. Maya, you basically reinvented Franklin's moral self-improvement system from scratch, without even needing the 18th century.

  Now, Franklin admits in his book that he never actually mastered the chart. Specifically, he says "Humility" was the hardest one. He wrote, "I cannot boast of much success in acquiring the *reality* of this virtue."

  Maya, I think you relate to that. You strive to be good, and kind, and organized, and perfect. And that is one of the things I admire most about you. You care deeply about being a good person. But Franklin also tells a story about a man who wanted his axe polished. The smith told him he'd have to turn the grinding wheel for a long time to get it shiny. The man eventually said, "You know what? I think I like the axe speckled." He decided the work wasn't worth the perfection.

  For a long time, I thought that story was about giving up. But standing here, looking at you and Dan, I think it's about something else.

  It's about realizing that a shiny axe is cold. A speckled axe has history. It has grip.

  Dan, [Turn to Dan] Maya doesn't need you to be perfect. And she's learning that she doesn't need to be perfect for you, either. Marriage isn't about clearing the chart. It's not about getting all the dots off the page. It's about finding someone who loves you even when the dots are there. Someone who looks at your speckled axe and says, "That's the one I want to build a life with."

  Maya, you've spent years tracking virtues. My wish for you isn't that you finally check every box. My wish is that you find enough joy in the mess that you don't need to track it anymore.

  So, if everyone could raise a glass.

  To Maya and Dan: May your life be virtuous, may your love be strong, and may you both be happy enough to leave the axe a little speckled.

  To the happy couple!

  [Raise glass]
