      *   Threshold Radius ($r^*$): $\frac{4}{3}\pi (r^*)^3 = \frac{1}{2} \cdot \frac{4}{3}\pi (2)^3 \implies (r^*)^3 = \frac{1}{2} \cdot 8 = 4 \implies r^* = \sqrt[3]{4} \approx 1.587$.
      *   **Theo's Calc (Uniform $r$):** $P(r < \sqrt[3]{4}) = \frac{\sqrt[3]{4} - 0}{2 - 0} = \frac{\sqrt[3]{4}}{2} = \sqrt[3]{\frac{4}{8}} = \sqrt[3]{0.5} \approx 0.7937$. (Matches Theo's 79%).
      *   **Nadia's Calc (Uniform $V$):** $P(V < 0.5 V_{max}) = 0.5$. (Matches Nadia's 50%).
      *   **Third Housemate's Calc (Uniform $A$):** $A = 4\pi r^2$. $A \propto r^2$. Uniform $A$ means CDF of $A$ is linear. $P(A < 0.5 A_{max}) = 0.5$. Wait, let's check the user's claim.
