          *   We want $P(V < 0.5 V_{max}) \iff P(r^3 < 0.5 R^3) \iff P(r < \sqrt[3]{0.5}R)$.
          *   Under Uniform $A$: $P(r < k) = P(\sqrt{A'} < k) = P(A' < k^2) = \frac{k^2}{R^2}$.
          *   Here $k = \sqrt[3]{0.5}R$. So $P = (\sqrt[3]{0.5})^2 = (0.5)^{2/3} \approx 0.6299$.
