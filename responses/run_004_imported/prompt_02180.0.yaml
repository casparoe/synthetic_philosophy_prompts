      *   *Point 2: Jaynes' Invariance.*
          *   Critique: Jaynes' method (Group Invariance) is designed to solve Bertrand-style paradoxes. However, it requires identifying a specific group of transformations (scale, translation, rotation) that leave the problem *unchanged*.
