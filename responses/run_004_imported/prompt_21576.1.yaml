  10. (Final check of Elga's specific argument): Elga argues that to apply EWV, you need an estimate of reliability. That estimate depends on your current beliefs. So if you believe EWV, you estimate those who deny EWV as less reliable on that topic. Thus, no conciliation required on EWV. This creates a "fixed point."

