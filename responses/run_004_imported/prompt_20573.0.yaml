answer: |-
  Good evening. For those who don't know me, I spent forty years as an x-ray crystallographer. My life was measuring symmetry. Where atoms sit, how they mirror each other, how they hold a structure together. When I retired, I thought I'd left symmetry behind. Instead, I found it in philosophy.

  Specifically, in a 1952 paper by Max Black.

  Black asks us to imagine a universe containing nothing but two iron spheres. They are exactly the same size, same mass, same temperature. They are the same distance from each other. In fact, every qualitative property of one is a property of the other.

  For centuries, following Leibniz, philosophers argued that if two things share every property, they must be the same thing. The Principle of Identity of Indiscernibles. Black disagreed. He argued that even in that perfectly symmetric universe, there are still *two* spheres. Numerical distinctness does not require qualitative difference. They are not one thing; they are stubbornly, fundamentally two.

  I thought of this often, watching Nora and Ellie grow up.

  The world has always had a hard time with the "two spheres" problem. People look at identical twins and instinctively hunt for differences. A mole here, a tone of voice there. As if your validity as individuals depends on your divergence. As if being "two" is a mistake that needs to be corrected by being "different."

  Nora, Ellie: I know you have banned jokes about mixing up your names. Good. Because that joke relies on the error Leibniz made. It assumes that unless you are qualitatively distinct to the observer, your numerical distinctness doesn't matter.

  But Black was right. You are not two because you are different. You are two because you are Nora, and you are Ellie. Your "twoness" is not a glitch in the symmetry; it is the foundation of it. You don't need to be distinguishable to be distinct. You simply *are*.

  And this brings me to your partners.

  In Black's universe, the spheres are static. But a marriage is not a static universe. It is a system of new relations.

  [Nora's Fiancé], I know you're writing your chapter on Black right now. I won't try to out-argue you. But I will say this: In your thesis, you discuss how relations might individuate objects. In life, love does exactly that.

  When you marry Nora, and [Ellie's Fiancé] marries Ellie, you are not breaking a symmetry. You are adding new coordinates. You are creating unique relational properties that no one else in the universe shares. The distance between Nora and [Fiancé] is not the distance between Ellie and [Fiancé]. Not in space, and not in spirit.

  My job as a crystallographer was to shine light on structures and see how they held together. My job as a father is to watch you build your own.

  So, here is my wish for you. May you never feel the need to prove your distinctness to a world that loves to categorize. You don't need to be different to be separate. You don't need to be unlike to be unique.

  And may your marriages be the proof that while symmetry is beautiful, it is the new relations—the love, the promises, the shared days—that make a universe worth living in.

  To Nora and [Fiancé]. To Ellie and [Fiancé]. To the stubborn, beautiful fact of being two.

  Cheers.
