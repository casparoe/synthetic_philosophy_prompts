answer: |-
  Here is the argument structured for a quals-level discussion. It moves from the failure of the "cordon off" strategy to the necessity of bounded utility, and finally defends boundedness against the charge of implausibility.

  ***

  ### Title: The Contagion Crisis and the Necessity of Bounded Utility

  **Thesis:** The "cordon off" strategy (Colyvan) fails because epistemic uncertainty renders the contagion problem inescapable for any agent who assigns non-zero credence to Pasadena-like causal structures. Consequently, Expected Utility (EU) theory is only coherent if utility functions are strictly bounded. This boundedness should not be interpreted as a metaphysical cap on value, but as a structural constraint on the *decision-theoretic leverage* any outcome can exert, preserving the autonomy of mundane reasoning against Pascalian domination.

  #### I. The Failure of the "Cordon Off" Strategy
  The standard response to the Pasadena Game is to treat it as a pathological singularity. Colyvan suggests we simply accept that some gambles have no defined expected value and restrict EU maximization to well-behaved cases. This works only if we can partition the space of possible acts into "Defined" and "Undefined" with certainty.

  However, this ignores the **Epistemic Contagion Problem**. In any real-world decision, an agent is never certain of the underlying causal structure or probability space. Let $A$ be a mundane act (e.g., "eat an apple") with a well-defined expected utility $E[A] = k$. Let $P$ be a Pasadena-type gamble with undefined expected utility $E[P] = \updownarrow$.

  Consider a mixed act $A_\epsilon$: "With probability $1-\epsilon$, eat the apple; with probability $\epsilon$, enter the Pasadena game."
  By linearity of expectation (which holds for defined values but breaks here):
  $$E[A_\epsilon] = (1-\epsilon)E[A] + \epsilon E[P]$$
  $$E[A_\epsilon] = (1-\epsilon)k + \epsilon(\updownarrow) = \updownarrow$$

  If an agent assigns *any* non-zero credence ($\epsilon > 0$) to the hypothesis that their current situation involves a Pasadena-like structure (or is mixed with one), the expected utility of the mundane act $A$ becomes undefined. Since rational agents should arguably never assign probability 1 to empirical hypotheses (dogmatism is irrational), $\epsilon$ is always non-zero.

  **Result:** If unbounded utilities are permitted, contagion renders the expected utility of *every* act undefined. EU theory collapses globally, not locally. The "cordon off" move is therefore epistemically unstable.

  #### II. The Argument for Bounded Utility (Arrow's Constraint)
  To rescue EU theory from global collapse, we must ensure that no admissible gamble can generate a conditionally convergent series. The only mathematical guarantee against conditional convergence in a probability space where $\sum p_i = 1$ is **absolute convergence**.

  For a series $\sum p_i u_i$ to converge absolutely regardless of the probability distribution $p_i$, the utility terms $u_i$ must be bounded.
  *Proof Sketch:* If $|u_i| \leq M$ for all $i$, then $\sum |p_i u_i| \leq \sum p_i M = M$. The series converges absolutely by the comparison test. Absolute convergence implies order independence, neutralizing the Riemann Rearrangement threat inherent in the Pasadena Game.

  Therefore, **bounded utility is a necessary condition for the coherence of EU theory under empirical uncertainty.** It is not merely a patch for the Pasadena Game; it is a prerequisite for preventing the Pasadena Game from infecting all decision-making. If we wish to retain EU maximization as a normative standard, we must adopt Kenneth Arrow's constraint: rational preference orderings over lotteries must be representable by a bounded utility function.

  #### III. Addressing the "Arbitrary Cap" Objection
  The strongest objection to bounded utility is the **Intuition of Unbounded Goodness**. It seems plausible that there is no upper limit to how good a world could be (e.g., a world with $N$ happy people is worse than a world with $N+1$). If utility represents value, bounding utility implies there is a "maximum possible good," which seems metaphysically absurd. Furthermore, it implies that saving a billion lives is not significantly better than saving one, once the bound is approached.

  This objection conflates **Metaphysical Value** with **Decision-Theoretic Utility**. The argument for boundedness does not deny that outcomes can be ordinally ranked without limit; it denies that they can be cardinally weighted without limit *within a probabilistic framework*.

  **1. The Leverage Argument (Pascal's Mugging)**
  If utility is unbounded, then for any finite utility $U(A)$, there exists some outcome $O$ such that $U(O) > U(A) / p$, for any arbitrarily small probability $p$.
  This leads to **Pascalian Domination**: an agent with unbounded utility must always prefer a gamble with a tiny probability of an immense payoff over a certainty of a mundane good.
  *Example:* If saving $2^n$ lives has utility $2^n$, you should trade a 100% chance of saving 1,000 lives for a $1/2^{100}$ chance of saving $2^{100}$ lives.
  This makes rational agency impossible, as all mundane considerations are "swamped" by astronomical long-shots. Bounded utility is not an arbitrary cap on *goodness*; it is a cap on *leverage*. It ensures that as probabilities approach zero, the decision-theoretic weight of the outcome approaches zero, preserving the relevance of high-probability mundane outcomes.

  **2. The Operationalist Defense**
  Utility in decision theory is defined by preferences over lotteries (von Neumann-Morgenstern), not by intrinsic moral worth. The axioms required to derive a utility function (completeness, transitivity, continuity, independence) are constraints on *choice behavior*.
  If an agent claims to prefer a $1/2^n$ chance of $O_n$ over a certainty of $O_{fixed}$, where $O_n$ grows unbounded, they violate the **Continuity Axiom**.
  *   *Continuity:* If $A \succ B \succ C$, there exists a probability $p$ such that $pA + (1-p)C \sim B$.
  *   Unbounded preferences imply that for some $B$, no such $p$ exists (because the "top" outcome is always too valuable to mix down).
  To reject boundedness is to reject Continuity. But without Continuity, we cannot represent preferences with a utility function at all. We are left with no formal decision theory. Thus, the "cap" is simply the boundary of what can be represented as a coherent preference ordering over risk.

  **3. Diminishing Marginal Utility vs. Hard Bounds**
  The objection often assumes a linear mapping between "units of good" (e.g., lives saved) and utility. But rational preference almost certainly involves extreme diminishing marginal utility.
  The argument for boundedness requires only that this diminishing return is strong enough to converge. It does not require a "hard ceiling" where saving more lives adds *zero* value. It requires only that the *marginal decision-theoretic weight* of additional lives approaches zero fast enough to prevent the Pasadena divergence.
  We can maintain that World B is better than World A (ordinal), while maintaining that the *utility difference* $U(B) - U(A)$ is bounded (cardinal). The "cap" applies to the measurement scale required for calculating expectations, not to the underlying axiological ordering.

  #### Conclusion
  The Pasadena Game is not an isolated puzzle; it is a symptom of the incompatibility between unbounded value scales and probabilistic reasoning. The "cordon off" strategy fails because epistemic humility ensures that Pasadena-like uncertainties contaminate all expected value calculations.

  The only robust solution is to accept that rational utility functions must be bounded. This is not a claim that value itself has a maximum limit, but rather that **rational agents cannot treat value as unbounded when acting under uncertainty.** To do so is to surrender agency to low-probability extreme events (Pascal's Mugging) and to render all expected utility calculations undefined (Contagion). Bounded utility is the price of admission for a decision theory that functions in the real world.
