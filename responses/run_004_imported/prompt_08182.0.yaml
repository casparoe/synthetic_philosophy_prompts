      *   *Key Paper:* "Signal Cost and Signal Reliability" (various authors). The condition is $C(q, s)$ where $q$ is quality and $s$ is signal. $\frac{\partial^2 C}{\partial s \partial q} < 0$. The marginal cost decreases with quality.
