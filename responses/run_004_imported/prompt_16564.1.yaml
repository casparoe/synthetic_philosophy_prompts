  8.  **Final Polish:** Ensure tone is appropriate for a graduate seminar (scholarly, precise, engaging). Use terms like "Monarchomachs," "Lesser Magistrates," "Sedition," "Body Politic."

      *(Self-Correction during drafting)*: I need to be careful not to paint Aquinas as a democrat. He is a hierarchist. His "public authority" usually means the Pope or the Emperor, or the nobility, not "the people" in a modern sense. Salisbury's "people" is also organic, not democratic. The distinction is about *agency*.

