      *   *Usurper:* Aquinas suggests killing a usurper *might* be meritorious (citing Cicero/Old Testament), but even here, he is cautious about private initiative. He often leans toward public authority.
      *   *Legitimate but Bad:* Aquinas is very restrictive. Sedition is a mortal sin. Resistance should generally come from public authority (e.g., the Empire checking a king, or the community acting through representatives), not private individuals.
      *   *Key Nuance:* Aquinas is often read as *restricting* tyrannicide more than permitting it. He emphasizes order and the danger of chaos (which is worse than tyranny).
      *   *Private/Unilateral?* Generally no. He prefers public mechanism.

  3.  **Deconstruct John of Salisbury's Position:**
      *   *Text:* *Policraticus* (Book VIII).
      *   *Distinction:* The killer's relationship to the tyrant (Oath of Fealty).
      *   *The Logic:* A tyrant is an image of depravity, an enemy of the commonwealth, and effectively kills the "body politic." Therefore, killing him is killing a public enemy.
      *   *The Oath:* If you are bound by oath, you cannot kill him (perjury/sacrilege). If you are *not* bound by oath, you are not only permitted but *duty-bound* to kill him.
      *   *Private/Unilateral?* Yes. Salisbury explicitly praises figures like Ehud and Brutus who acted privately or without specific public mandate, provided they weren't sworn vassals. He frames it as a religious duty.

  4.  **Compare the Licensing of Private Tyrannicide:**
      *   *Aquinas:* Highly restrictive. Even against a usurper, private action is risky and often discouraged in favor of public remedy. Against a legitimate ruler, private action is sedition.
      *   *Salisbury:* Much more permissive regarding *who* can act. If you aren't a vassal, you are an agent of God's justice.
      *   *Verdict:* John of Salisbury licenses *more* private, unilateral action. Aquinas creates bureaucratic/public hurdles; Salisbury creates a moral/religious imperative for the non-sworn individual.

