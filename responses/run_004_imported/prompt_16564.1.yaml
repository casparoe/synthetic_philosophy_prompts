      *   **Section 2: Thomas Aquinas (The Juridical Constraint).** Focus on *De Regimine* and *ST*. Distinction: Usurper vs. Exercise. Even against a usurper, private action is fraught. Against a legitimate tyrant, only public authority. Sedition is sinful. Order > Justice in terms of method.
      *   **Section 3: Comparing the License.** Salisbury is more radical regarding the *agent* (private individual). Aquinas is more radical regarding the *definition* of tyranny (usurpation) but conservative on the *remedy*. Conclusion: Salisbury licenses more private killing.
