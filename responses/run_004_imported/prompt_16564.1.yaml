      *   *Decision:* I will argue Aquinas had the greater afterlife in terms of *structural* resistance theory (lesser magistrates), while Salisbury remained the touchstone for the *moral* permissibility but was often qualified by Aquinas's constraints in the early modern period.

  6.  **Drafting the Argument:**
