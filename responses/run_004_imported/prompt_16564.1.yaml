answer: |-
  This is an excellent prompt for a graduate seminar because it forces students to grapple with the tension between moral justification and political mechanism. The textbook simplification ("Scholastics = Tyrannicide") collapses the crucial difference between *defining* a tyrant and *licensing an agent* to kill him.

  Here is a comparative analysis designed to help you structure that seminar discussion, arguing that while **John of Salisbury licenses more private, unilateral violence**, **Aquinas's framework provided the structural machinery for early modern resistance theory.**

  ### 1. John of Salisbury: The Moral Imperative and the Oath
  In Book VIII of the *Policraticus*, Salisbury treats the tyrant not merely as a political error but as a spiritual pollution, an "image of depravity" who kills the body politic. Consequently, killing the tyrant is an act of piety.

  *   **The Distinction:** Salisbury's critical qualification is not the *origin* of the ruler's power, but the *relationship* of the killer to the ruler. The dividing line is the **oath of fealty**.
  *   **The Mechanism:** If a subject is bound by oath, killing the tyrant is perjury and sacrilege. However, if the individual is *not* bound by oath (which includes most private citizens, foreign agents, or those whose oath was coerced/invalid), they are not only permitted but **duty-bound** to execute the tyrant.
  *   **The License:** This is a radically decentralized theory of justice. It empowers the private individual (*privatus*) to act as the sword of God. Salisbury praises Ehud and Brutus precisely because they acted without waiting for public authorization. For Salisbury, the tyranny itself dissolves the political bond, returning the killer to a state of nature where they act as a divine agent.

  ### 2. Thomas Aquinas: The Juridical Constraint and Public Order
  Aquinas engages with the same problem in *De Regimine Principum* (I.6) and the *Summa Theologiae* (II-II, q. 42, a. 2 on Sedition), but his concern shifts from spiritual purity to political stability.

  *   **The Distinction:** Aquinas distinguishes between the **tyrant by title** (usurper) and the **tyrant by exercise** (legitimate title, abusive rule).
  *   **The Mechanism:**
      *   *Against a Usurper:* Aquinas is more permissive here, noting that killing a usurper is not technically sedition and can be meritorious (citing Cicero). However, even here, he introduces a cautionary note regarding scandal and the potential for greater chaos.
      *   *Against a Legitimate Ruler:* This is where Aquinas slams the door on private action. He argues that resisting a legitimately installed ruler, even a bad one, is sedition (a mortal sin) unless undertaken by **public authority**.
  *   **The License:** Aquinas channels resistance through institutional hierarchies. If a king rules tyrannically, the remedy lies with a superior authority (e.g., the Emperor checking a King, or the Pope checking an Emperor) or through a public representative body of the realm. He explicitly warns that private attempts to kill tyrants often result in greater tyranny (as the successor may be worse) or civil war. For Aquinas, **order is a precondition for justice.**

  ### 3. Comparison: Who Licenses More Private Tyrannicide?
  When you take the qualifications seriously, **John of Salisbury licenses significantly more private, unilateral tyrannicide.**

  *   **Salisbury** creates a moral obligation for the private individual. Unless you have specifically sworn an oath (and even then, some interpreters argue the oath is void if the ruler breaks the divine law), you are an agent of execution. The barrier to entry is low (lack of oath), and the mandate is high (religious duty).
  *   **Aquinas** creates a procedural barrier. Even if the ruler is a usurper, private action is risky. If the ruler is legitimate, private action is sinful. The barrier to entry is high (possession of public authority), and the mandate is cautious (avoid greater evil).

  **Seminar Point:** Ask your students to consider the "Anarchist Problem." Salisbury's theory risks turning every disgruntled subject into a potential assassin claiming the tyrant lacks divine favor. Aquinas's theory risks protecting tyrants by making resistance impossible without an institutional veto that the tyrant might control.

  ### 4. The Afterlife in Early Modern Resistance Theory
  This is the crux of the historiographical debate. While Salisbury is often cited as the "father" of tyrannicide, **Aquinas's framework had the greater and more sustained afterlife in mainstream early modern resistance theory.**

  *   **The Monarchomachs (16th Century):** The Huguenot theorists (Hotman, Beza, the author of the *Vindiciae Contra Tyrannos*) faced the problem of justifying resistance against Catholic monarchs without endorsing anarchy (which they associated with the Anabaptists). They explicitly rejected the Salisbury-style private tyrannicide. Instead, they adopted the **Aquinas-derived "Lesser Magistrate" doctrine**. Resistance was legitimate only when led by constituted public authorities (Estates, Parliaments, Electors). This is Aquinas's "public authority" constraint repurposed for constitutionalism.
  *   **The Jesuit Controversy:** The more radical, Salisbury-esque position (private tyrannicide) did survive in the work of Juan de Mariana (*De Rege*, 1599). However, this position was condemned by the French Parliament and the Jesuit order itself following the assassinations of Henry III and Henry IV. It was politically toxic.
  *   **The Glorious Revolution (1688):** The justification for deposing James II relied not on private individuals killing a tyrant, but on the "original contract" being breached, acted upon by the Convention Parliament (a public body). This is the triumph of the Thomistic channeling of resistance over the Salisburian privatization of it.

  **Why Aquinas Won:** Early modern resistance theory was largely a project of the nobility and the magistracy, not the masses. They needed a theory that justified *their* resistance without legitimizing peasant revolts or regicide by lone actors. Aquinas provided the juridical architecture (public authority vs. private sedition) that allowed elites to resist without collapsing the concept of sovereignty. Salisbury provided the moral fervor, but Aquinas provided the constitutional machinery.

  ### Summary for the Seminar
  *   **Salisbury:** High moral license, low procedural barrier. Licenses private killing. Legacy: Radical fringes, regicide, revolutionary fervor.
  *   **Aquinas:** Low moral license for individuals, high procedural barrier. Licenses public/constitutional resistance. Legacy: Monarchomachs, Calvinist resistance theory, Glorious Revolution, modern constitutionalism.

  **Final Thought for Students:** The "flattened textbook claim" fails because it ignores that the Scholastic contribution (via Aquinas) was actually to *restrict* tyrannicide more than to justify it. They transformed tyrannicide from a holy duty (Salisbury) into a legal remedy of last resort administered by public bodies (Aquinas). The "afterlife" of resistance theory is the story of how early moderns tried to keep Salisbury's fire inside Aquinas's fireplace.
