answer: |-
  **Marcus:** You're conflating metaphysics with morality, Elena. That's the trap. When the plant dies, a physiological process occurs: turgor pressure drops, cells collapse. That's causation. The neighbor's inaction? That's a null set. You can't build a causal chain out of nothing.

  **Elena:** "Nothing" is doing a lot of heavy lifting there. If I unplug your server, the service dies. If I *fail* to plug it in when it's part of my job, the service also dies. The counterfactual dependence is identical. If I had acted, the effect wouldn't have occurred.

  **Marcus:** Counterfactual dependence isn't causation. If I take birth control pills, I don't get pregnant. But my taking the pills didn't *cause* my non-pregnancy in the same way a barrier method would. And don't give me the "everyone on Earth" dodge. If omissions are causes, then *my* failure to water your plant is a cause. The stranger in Jakarta's failure is a cause. We are drowning in causes for every single event.

  **Elena:** We aren't drowning if we acknowledge that causation is context-sensitive. We select causes based on the "normal course of events." In the vacation scenario, the neighbor is the designated variable. The rest of the world is background. It's not about physics; it's about the system model.

  **Marcus:** There it is! You admit it. "System model." "Designated variable." Those are normative filters. You're smuggling expectations into the ontology. You're saying the neighbor caused the death because he *should* have watered it. That makes causation dependent on obligation.

  **Elena:** I'm saying causation is about difference-making within a structure. Look at your own field. If a safety valve fails to open, we say the failure caused the explosion. We don't say "the pressure caused the explosion" and treat the valve as moral window dressing.

  **Marcus:** We say that for shorthand. But strictly? The pressure burst the vessel. The valve's failure is just the absence of a prevention mechanism. This is exactly what Dowe and Beebee argue. Omissions are "quasi-causes." They explain why we blame, not what happened.

  **Elena:** "Quasi-cause" sounds like a get-out-of-jail-free card for metaphysicians who can't handle human systems. Let's use a real case. Last month, a queue backed up at work and took down half the service. The postmortem conclusion was: "The lack of an alert on queue depth caused the outage."

  **Marcus:** No. The influx of messages exceeding processing capacity caused the outage.

  **Elena:** But that influx happens every Tuesday. It never takes the service down.

  **Marcus:** Because usually someone clears it.

  **Elena:** Exactly. The *absence* of the alert meant the *absence* of the clearing. If you tell the engineers, "Your inaction wasn't a cause, it was just quasi-causation," they'll throw you out of the room. The missing alert is the specific difference that turned a routine spike into a catastrophe.

  **Marcus:** And that's why we blame them! But blame is a social practice. Causation is a feature of the world. You're insisting that because our *blame practices* target omissions, our *ontology* must include them. That's a category error. Beebee's point is precisely that we have a folk concept of causation that tracks responsibility, not physical processes.

  **Elena:** If your ontology of causation can't account for why the service went down in a way that helps us prevent it next time, your ontology is useless. If I model the system without the human-in-the-loop as a causal variable, I will build a model that fails. The "nothing" of the missing alert is a functional hole in the system.

  **Marcus:** A functional hole isn't a physical push. You want to say the neighbor caused the plant's death. I say the plant died of thirst. The neighbor is the reason we hold *him* accountable, not the reason the plant is dead. If the stranger in Jakarta had promised to water it, *then* his omission would be the cause. See? The physics didn't change. Only the promise changed. Therefore, the causation claim tracks the promise, not the world.

  **Elena:** It tracks the *relevant* change in the world. A promise sets a baseline. Deviation from the baseline is an event.

  **Marcus:** Deviation from a norm is not an event. It's a description of an event's absence. You're trying to have your cake and eat it too. You want the rigor of causation without the physical baggage.

  **Elena:** And you want the purity of physics while ignoring that most of the world runs on institutional omissions. If I don't sign the authorization code, the missile doesn't fire. Did my not-signing cause the non-firing?

  **Marcus:** It prevented the firing. Prevention is different.

  **Elena:** How?

  **Marcus:** Because prevention implies an active blocker.

  **Elena:** I just sat on my hands! That's an omission!

  **Marcus:** (Pauses) Fine. You sat on your hands. That's a physical state. But you're claiming the *not-signing* caused it. If you were unconscious, the result is the same. Is your unconsciousness the cause? Or the lack of a signature?

  **Elena:** The lack of a signature is the cause because the system requires a signature.

  **Marcus:** And there's the norm again! You can't escape it. You've defined causation as "violation of expectation."

  **Elena:** I've defined it as "dependency within a system." If you strip that out, you can't explain complex failures. You'll end up saying the queue overflow caused the outage, and the engineers are just morally culpable for being near it.

  **Marcus:** I'm saying the engineers are culpable because they controlled a variable that, if set differently, changes the outcome. That's control, not causation. We punish omissions because we need to regulate behavior, not because "nothing" pushed the domino.

  **Elena:** But if "nothing" didn't push the domino, why does fixing the "nothing"—adding the alert—stop the domino from falling next time?

  **Marcus:** Because you've added a *something*. An alert system. A physical process. You fixed the omission by adding a cause.

  **Elena:** So the cause was always the potential alert, waiting to exist?

  **Marcus:** The cause was the intervention. The omission is just the shadow where the intervention should have been.

  **Elena:** A shadow that kills plants and crashes servers.

  **Marcus:** A shadow we agree to treat as solid, for the sake of keeping the garden alive. But don't call it metaphysics.

  **Elena:** When the garden dies, Marcus, the metaphysics is the least of our worries. But if you can't tell me why the shadow killed it without referencing the gardener, you haven't explained the world. You've just described your physics.

  **Marcus:** And if you call the shadow a killer, you've described your guilt. Not the garden.
