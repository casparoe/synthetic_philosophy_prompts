      *   *Rule:* Tenure is granted ($R$) IF AND ONLY IF ($P$ AND $Q$).
      *   *Voters:* Professor X, Professor Y, Professor Z.
      *   *Goal:* Need a distribution where majority says Yes to $P$, majority says Yes to $Q$, but majority says No to $R$ (or vice versa).
      *   *Standard Paradox Setup:*
          *   Judge 1: Yes, Yes -> Yes (Consistent)
          *   Judge 2: Yes, No -> No (Consistent)
          *   Judge 3: No, Yes -> No (Consistent)
          *   *Majority on P:* Yes (2-1)
          *   *Majority on Q:* Yes (2-1)
          *   *Majority on R:* No (1-2)
          *   *PBP Outcome:* P=Yes, Q=Yes -> R=Yes.
          *   *CBP Outcome:* R=No.
          *   *Conflict:* Yes vs No.

      *   *Refining the Scenario:* Let's make it a **Zoning Board** deciding on a new building.
          *   $P$: The building meets safety codes.
          *   $Q$: The building fits the neighborhood aesthetic.
          *   Rule: Permit approved ($R$) if $P$ AND $Q$.
          *   *Voter 1:* Safe (Yes), Aesthetic (Yes) -> Approve (Yes).
          *   *Voter 2:* Safe (Yes), Aesthetic (No) -> Approve (No).
          *   *Voter 3:* Safe (No), Aesthetic (Yes) -> Approve (No).
          *   *Majorities:* Safe (Yes), Aesthetic (Yes), Approve (No).
          *   *PBP:* Majority says Safe + Majority says Aesthetic -> Approve.
