      *   *Difference:* Arrow deals with *ordinal preferences* (ranking A > B > C). Discursive Dilemma deals with *judgment aggregation* (True/False on connected propositions).
      *   *Link:* List and Pettit (2002) formalized Judgment Aggregation Theory, showing it's a generalization of Arrow-like problems. There is a "Judgment Aggregation Impossibility Theorem."
      *   *Verdict:* They are cousins/siblings, not identical twins. The underlying math (logic vs. orderings) differs, but the philosophical implication (democracy/rationality tension) is the same. I should clarify this nuance.

