          *   *Systemic Failure:* *Inadequate Equilibria* is about cases where the outside view is broken (market inefficiencies, academic stagnation).
          *   *Evidence vs. Evaluation:* Distinguishing between first-order evidence (the data) and higher-order evidence (the disagreement).
      *   **Address the HOE Literature:** Mention key names (Christensen, Elga, Sliwa, Horowitz). Explain the "split-level" tension.
      *   **Nuance the "Cavalier" Claim:** Yudkowsky wasn't saying "ignore HOE." He was saying "don't use modesty as a shield against doing the work."
      *   **Conclusion:** It's not a mistake everyone agrees on; it's a fundamental tension in epistemology between *coherence* (avoiding akrasia) and *responsiveness to evidence* (including HOE).

