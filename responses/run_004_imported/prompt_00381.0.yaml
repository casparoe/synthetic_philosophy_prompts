answer: |-
  **Setting:** *A cluttered office, late afternoon. Two coffee cups sit on a stack of journals. The Skeptic (S) leans back in a worn armchair; the Dispositionalist (D) sits forward on the edge of a desk.*

  **S:** Let's cut to the chase. You claim to know what I meant by "plus" in the past. I say there is no fact about me that constitutes that meaning. Take the specific case: $68 + 57$. I've never computed this sum before. Why is the correct answer $125$ rather than $5$?

  **D:** Because you meant *addition*, not *quaddition*. And the fact that constitutes that meaning is your dispositional state. You were disposed to answer $125$ when presented with that query.

  **S:** I anticipated the naive version. You know I'm finite. My brain has a capacity limit. There are sums so large that were I asked them, my neurons would fire incorrectly, or I'd die before calculating, or I'd simply guess. If my disposition is just a description of what I *would* output, then for sufficiently large numbers, my disposition is to make mistakes. So, on your view, for large numbers, I *mean* the function that includes those mistakes. That's absurd. I mean addition, even if I'm too stupid to compute it.

  **D:** I grant the finitude point. That's why I'm not a naive dispositionalist. I'm talking about an *idealized* disposition. I mean the answer you *would* give if certain interfering conditions were removed. If you weren't fatigued, if your memory didn't lapse, if you had infinite time and paper. We treat the actual output as a noisy signal of the underlying dispositional state. We look for the limit of the function as error approaches zero.

  **S:** So you're appealing to a counterfactual. "If conditions $C$ obtained, you would answer $125$." But now tell me: is there a fact of the matter about what a finite biological organism *would* do in conditions that are physically impossible for it? If I say, "If I had infinite memory, I would answer $5$," how do you prove me wrong? You've moved from observable behavior to a speculative claim about a non-existent state of affairs.

  **D:** It's not speculative in the way you imply. We do this in science all the time. We say a gas *would* behave ideally if friction were absent, even if we can't create a frictionless vacuum. We fix the *ceteris paribus* clauses by looking at the causal structure of the system. My cognitive architecture is built to track numerical relations. The "ideal" isn't arbitrary; it's defined by the structural integrity of the system itself. When I say $5$, that's a breakdown of the mechanism. When I say $125$, that's the mechanism functioning.

  **S:** Ah, now I see where you're retreating. You've shifted from "what I would do" to "what the mechanism is *for* doing." You're smuggling in normativity. You say saying $5$ is a "breakdown" or "error." But on a purely dispositional account, an error is just a different disposition. If I am disposed to say $5$ under stress, why is that an error rather than just the meaning of "quus" under stress?

  **D:** Because the disposition isn't brute. It's grounded in my learning history and biological function. I was trained in a community. I was corrected when I said $5$ as a child. My cognitive systems were selected—or at least shaped—to preserve truth in arithmetic derivations. There is a teleological fact here. My mental states have the *function* of representing addition. A disposition that yields $5$ fails that function. It's a malfunction.

  **S:** Let's pause on "function." I agree you have a history. You were trained. But recall the skeptical challenge: that history is finite too. You were corrected on $2 + 2$, on $10 + 10$. You were never corrected on $68 + 57$. How does the finite training fix the infinite rule? Maybe your trainers meant "quus" when they corrected you. Maybe "correct" just meant "say what we say," and what we say diverges at $68$. By appealing to "function," you're just interpreting that history *as* training for addition. But the physical facts of the training—the sounds made, the neural firings—are compatible with quus.

  **D:** But the *causal* facts aren't. The reason I say $125$ isn't just blind habit; it's because I grasp the recursive structure of the successor function. My disposition is sensitive to the *reasons* for the answer. The idealization clauses rule out "blind guessing." They specify that the response must be generated by the same cognitive process that generated $2 + 2 = 4$. If the process is the same, the function is the same.

  **S:** This is the crux. You say "the same process." But how do you identify the process *as* addition rather than quaddition without already presupposing the meaning? If the process is just a physical causal chain, it is quus-compatible. If the process is identified by its *content* (i.e., "the adding process"), you're begging the question. You're using the notion of meaning to explain meaning.

  **D:** I'm not begging the question; I'm naturalizing it. Look, Kripke's Wittgenstein demands a "justification" that stands outside the causal order. You want a fact that *logically compels* the answer $125$. I'm saying there is no such Platonic fact. There are only natural facts. The normativity you're looking for is biological normativity. A heart *ought* to pump blood. If it doesn't, it's defective. That "ought" is real, even if it's grounded in "is." Similarly, my cognitive system *ought* to output $125$. If it outputs $5$, it's defective *relative to its design*. That is sufficient for meaning.

  **S:** Is it? Consider the heart. If a heart is disposed to pump blood, but in a specific rare condition pumps poison, we call that a malfunction. Why? Because the *type* "heart" is defined by its evolutionary history of pumping blood. But now apply this to meaning. Suppose my evolutionary history (or learning history) disposed me to survive. Maybe saying $5$ to $68 + 57$ would have been more survival-conducive in some ancestral environment. If I adopt a teleosemantic view, doesn't the "function" become "survival" rather than "truth"? If saying $5$ helps me survive, is it then *correct*?

  **D:** No, because the proximate mechanism is tuned to truth-tracking, not direct survival calculation in every instance. The module for arithmetic has the proper function of tracking numerical relations. We can distinguish the function of the *module* from the function of the *organism*.

  **S:** But who draws that line? You do. You, the interpreter, looking at my brain, decide, "Ah, this bit is for arithmetic, and this bit is for panic." But the skeptical challenge applies to *you* now. What fact about *your* interpretation fixes it that you are identifying the "arithmetic module" correctly? You're just another finite creature interpreting another finite creature. You're assuming your own grasp of "arithmetic" is secure to validate mine. But that's what's in question.

  **D:** I'll concede I can't step outside the human form of life to validate it. But I don't need to. The skepticism only bites if you think normativity requires a view from nowhere. If we accept that we are natural creatures with shared reactive dispositions, then the "ought" emerges from the "is" of our shared nature. When I say you *ought* to say $125$, I'm projecting my own idealized dispositions onto you and noting a convergence. If we diverge, one of us is malfunctioning relative to the shared form of life. That convergence *is* the fact of meaning.

  **S:** So you're retreating to a communitarian view? "Correct" just means "agrees with the community"?

  **D:** Not merely agrees. *Would* agree under ideal conditions. It's a convergence of idealized dispositions.

  **S:** Then we are back to the counterfactual. And I ask again: what makes it the case that your idealized disposition is *addition* and not *quus*? You say "convergence." But if the whole community were disposed to say $5$ for $68 + 57$ under ideal conditions, would addition *be* quus?

  **D:** ...If the whole community, under ideal conditions, converged on $5$, then yes, they would mean quus. There is no meaning independent of our capacities.

  **S:** Then you've surrendered the normativity. You've admitted that "correctness" is just "what we are disposed to say." But the whole point of the rule-following consideration was that I can be wrong *even if* I'm disposed to say it. I want to know what makes my current intention to mean addition *bind* my future self. You've told me what my future self *will* do (ideally). You haven't told me why my future self *must* do it. You've described the rails; you haven't explained what makes them lay themselves out ahead of the train.

  **D:** And you're demanding a metaphysical glue that doesn't exist. I've given you the only normativity there is: the normativity of a self-correcting, functionally organized system. If that doesn't satisfy you, it's because you want meaning to be magical. I'd rather have naturalized meaning with a residual philosophical itch than no meaning at all.

  **S:** And I'd rather acknowledge the itch than pretend it's gone. You've explained how we *manage* to communicate. You haven't explained how our words *reach* up and touch the abstract objects they purport to name. You've bridged the gap between finite minds by lowering the status of meaning to a biological habit. I'm not sure that's a bridge; it looks more like a demolition.

  **D:** Then we're at a stalemate. You think the demolition is necessary because the building was never there. I think the building is made of wood and stone, not crystal, but it still shelters us.

  **S:** Precisely. The question is whether "shelter" is enough for *truth*.

  *(Silence falls. S picks up his coffee. D stares at the equation on the whiteboard: $68 + 57 = 125$.)*
