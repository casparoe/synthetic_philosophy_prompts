answer: |-
  You have done exactly the right thing by going to the source. The dinner-table version of this story is a classic example of a "zombie argument"—an idea that keeps getting repeated long after it has been nuanced or refuted by the experts. Your intuition that the situation is "messier" is correct. Popper's position evolved, and the relationship between the "tautology" charge and the "metaphysical" charge is subtle.

  Here is the breakdown of the two objections, the specifics of Popper's recantation, and an evaluation based on modern biological practice.

  ### 1. The Two Objections: Side by Side

  While often used interchangeably by critics of evolution, the "Tautology Objection" and the "Metaphysical Objection" are distinct logical categories, though they are causally linked.

  **Objection A: The Tautology Charge ("Survival of the Survivors")**
  *   **Nature:** Semantic and Logical.
  *   **The Claim:** This objection argues that the definition of "fitness" is circular. If "fitness" is defined *solely* as "actual reproductive success," then the statement "the fittest organisms survive" translates to "the organisms that survive, survive."
  *   **The Consequence:** If the statement is a tautology (true by definition), it conveys no empirical information about the world. It cannot be false, and therefore it explains nothing.
  *   **Origin:** This predates Popper. It was a common critique in the late 19th and early 20th centuries (often associated with critics like Fleeming Jenkin or philosopher Herbert Spencer's phrasing).

  **Objection B: The Metaphysical/Unfalsifiable Charge**
  *   **Nature:** Epistemological and Methodological.
  *   **The Claim:** This is Popper's specific contribution, rooted in his *demarcation problem* (distinguishing science from non-science). Popper argued that for a theory to be scientific, it must be falsifiable. He initially viewed natural selection as a "metaphysical research programme."
  *   **The Consequence:** He meant that natural selection is a useful *framework* for organizing research, but not a testable *law* in itself. It is too flexible; it can explain any outcome post-hoc (e.g., "Why did this moth survive?" "Camouflage." "Why did that one die?" "Lack of camouflage.").
  *   **Origin:** Popper's *The Logic of Scientific Discovery* (1934) and later writings in the 1970s.

  **Where They Overlap and Diverge**
  *   **Overlap:** Both objections conclude that natural selection lacks **empirical content**. If the theory is a tautology, it is necessarily unfalsifiable. Thus, the tautology charge is often used as *evidence* for the metaphysical charge.
  *   **Divergence:** One can theoretically be unfalsifiable without being a tautology. For example, the statement "There is an invisible, undetectable dragon in my garage" is unfalsifiable (metaphysical, in Popper's sense), but it is not a tautology (it could be false).
      *   The **Tautology** objection attacks the *internal logic* of the definitions.
      *   The **Metaphysical** objection attacks the *scientific status* of the theory.

  ### 2. Popper's Recantation: What Did It Undo?

  The reference you were looking for is likely Popper's lecture **"Natural Selection and the Emergence of Mind,"** delivered in 1977 (published in *Dialectica* in 1978). This was indeed part of a Darwin commemoration context.

  In this lecture, Popper explicitly stated: *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to recant."*

  **Did he recant both objections?**
  **Yes, effectively.** Popper treated the two problems as a bundled knot. His reasoning was that if the theory generates testable predictions, it cannot be a tautology, and it cannot be merely metaphysical.

  However, there is a nuance in *how* he resolved them. Popper realized that his earlier critique assumed natural selection stood alone. He came to accept that:
  1.  **Natural Selection + Heredity + Variation = Testable Theory.** When combined with genetics (which provides the mechanism of inheritance) and specific ecological constraints, the theory makes "risky predictions."
  2.  **Fitness is not just survival.** He acknowledged that fitness could be analyzed in terms of specific traits that confer a propensity to survive, rather than just the retrospective fact of survival.

  **Could someone hold one objection but not the other after the recantation?**
  Logically, yes, but it would be difficult to sustain.
  *   One could argue: *"Okay, Popper, the theory makes predictions (not metaphysical), but those predictions rely on defining fitness by survival (tautology)."*
  *   However, if the theory makes risky predictions (e.g., "Organisms with Trait X will out-reproduce Organisms with Trait Y in Environment Z"), and we measure Trait X *independently* of the reproduction outcome, the tautology charge collapses. Popper's recantation hinged on the realization that biologists *do* measure traits independently. Therefore, by recanting the "metaphysical" label based on the existence of tests, he implicitly invalidated the "tautology" label as well.

  ### 3. Judgment: Which Side Was Right?

  Based on how biologists actually define and measure fitness in practice, **Popper's later view (the recantation) is correct, and the tautology objection is largely a strawman.**

  Here is why the "tautology" charge fails in modern practice:

  **1. The Propensity Interpretation of Fitness**
  Philosophers of biology (such as Robert Brandon and John Beatty) and evolutionary biologists no longer define fitness simply as "actual reproductive success." Instead, they use the **Propensity Interpretation**.
  *   **Definition:** Fitness is a *probabilistic propensity* to survive and reproduce, grounded in physical traits.
  *   **Analogy:** Consider a biased coin. If you flip it once and it lands on tails, you cannot say it was a "tails coin." Its "bias" (fitness) is a property of its weight distribution, not the single outcome. Similarly, an organism's fitness is a property of its physiology (metabolism, speed, camouflage) relative to an environment, not just the fact that it happened to survive.
  *   **Result:** Because fitness is defined by the *traits* (which can be measured before survival is known), the statement "the fittest survive" is not "those who survive, survive." It is "those with traits conferring high propensity survive." This is an empirical claim that can be falsified (e.g., if organisms with the supposed advantageous trait die out).

  **2. Independent Measurability**
  Biologists routinely measure fitness components without waiting for the "survival" outcome to define them.
  *   **Example:** In a study of Darwin's finches, researchers measure beak depth *before* a drought. They predict that deeper beaks will process harder seeds more efficiently. After the drought, they measure survival. If the birds with deeper beaks had died off, the theory would have been falsified.
  *   Because the trait (beak depth) and the environmental pressure (seed hardness) are measured independently of the survival outcome, the logic is not circular.

  **3. The "Optimality" Tests**
  Evolutionary biologists frequently construct "optimality models." They predict what the *ideal* trait value should be for a given environment based on energy costs and benefits. If the organisms in nature deviate significantly from this prediction without a clear explanatory constraint, the model is rejected. This is the hallmark of a falsifiable scientific theory, not a metaphysical tautology.

  ### Summary for the Family Barbecue

  If your brother-in-law brings this up again, you can confidently say:

  1.  **Popper agreed with you eventually.** He publicly recanted his earlier criticism in 1977, admitting natural selection is testable.
  2.  **The Tautology Charge is outdated.** It relies on defining "fitness" as "survival." Modern biology defines fitness as a "propensity based on traits." Since we can measure the traits before we know who survives, the circle is broken.
  3.  **The Distinction.** The "tautology" worry is a semantic error; the "metaphysical" worry is a methodological one. Popper realized that because the semantic error isn't how science is actually done, the methodological worry disappears too.

  Popper's initial criticism was valuable because it forced biologists to be more rigorous about how they define fitness and construct models. But his final verdict was that natural selection is indeed a robust, falsifiable scientific theory.
