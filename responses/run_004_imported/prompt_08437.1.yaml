      *   *Leibniz vs. Kant:* Leibniz believes in the pre-established harmony and that this is the best of all possible worlds (knowable). Kant says we can't know the noumenal arrangement.
      *   *Conclusion:* The user's intuition is correct. Gödel bypasses the Critical barrier.

