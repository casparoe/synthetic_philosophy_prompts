prompt: |-
  I'm writing my IB Extended Essay on theories of biological function, and the part I keep struggling to get right is the disagreement between etiological accounts of function, where, following Larry Wright, a trait has a function only because past instances of it were selected for some effect, and Robert Cummins' causal-role account, where a trait's function is simply whatever it currently contributes to some capacity of the system it belongs to, regardless of history. My supervisor suggested that if I could dramatize the disagreement in fiction, I'd probably understand it well enough to write about it properly. Could you write me a short story, around 1000 words, built around a case where the two accounts would hand down different verdicts — say, a creature that comes into existence by pure chance, a perfect physical duplicate of an ordinary animal, heart and lungs and all, but with no ancestors and no selection history behind it whatsoever (I believe this is a version of what's sometimes called a 'Swampman' case)? I'd like an actual character to have to decide, out loud, whether that creature's organs really have functions, and to feel the pull of both answers, rather than having the two theories simply explained to the reader — it doesn't need to resolve which account is right.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** IB Extended Essay on theories of biological function.
      *   **Core Conflict:** Etiological accounts (Larry Wright) vs. Causal-role accounts (Robert Cummins).
      *   **Specific Scenario:** A "Swampman" case (a creature created by chance, physical duplicate of an ordinary animal, no evolutionary history).
      *   **Format:** Short story (fiction/dramatization).
      *   **Length:** Around 1000 words.
      *   **Key Requirement:** A character must decide out loud whether the creature's organs have functions, feeling the pull of both answers. No definitive resolution (leave the tension intact).
      *   **Goal:** Help the student understand the disagreement through narrative.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Etiological (Wright):** Function = History. A heart pumps blood *because* ancestors pumped blood and survived/reproduced. No history = No function (even if it works).
      *   **Causal-Role (Cummins):** Function = Current Contribution. A heart pumps blood *because* it contributes to the circulation capacity of the system now. History doesn't matter. If it works, it has a function.
      *   **The Swampman Case:** A lightning strike creates a duplicate of a human (or animal) from swamp gas. Physically identical, but no parents, no evolution.
      *   **The Tension:** Does the duplicate's heart *function*?
          *   Wright says: No. It's just a lump of muscle doing things. It lacks the "proper function" derived from selection.
          *   Cummins says: Yes. It contributes to circulation. It has a "system capacity" function.

  3.  **Drafting - Setting the Scene:**
      *   Need a scientist or observer. Let's call her Dr. Aris.
      *   Need the creature. Let's make it a small mammal for simplicity, maybe a rodent or a generic "beast." Let's go with a humanoid or near-humanoid to make the "heart" analogy stronger, but the prompt suggests "creature/animal." Let's stick to a complex animal, maybe a fox-like creature.
      *   Setting: A lab, sterile, post-creation event.
      *   Atmosphere: Tense, contemplative.

  4.  **Drafting - The Character's Internal/External Conflict:**
      *   Aris needs to be recording logs or talking to a colleague/AI. Talking to herself or a recorder works best for "deciding out loud."
      *   She needs to articulate the Wright view (History matters) and the Cummins view (Current capacity matters).
      *   She needs to feel the weight of both. If she says it has no function, does that mean she can treat it differently? If she says it does, is she lying about its origin?

  5.  **Drafting - Plot Outline:**
      *   **Introduction:** The creature exists. It's alive. Aris is observing it.
      *   **Inciting Incident (Internal):** She needs to label the organ functions in her report.
      *   **Rising Action:** She examines the heart. She recites the Etiological view (it has no past). She recites the Causal-Role view (it works now).
      *   **Climax:** She tries to make a definitive statement for the record.
      *   **Falling Action/Resolution:** She hesitates. The tension remains. She acknowledges the duality.

  6.  **Writing - Section by Section (monitoring word count):**

      *   *Scene Setting:* The containment unit. The creature (let's call it Subject Zero or "The Emergent"). It's breathing.
      *   *The Problem:* The database requires a function code for the organs.
      *   *The Wright Argument:* Aris voices the history requirement. "Nothing selected this." "It's an accident."
      *   *The Cummins Argument:* Aris voices the capacity requirement. "It circulates." "It keeps the system running."
      *   *The Moment of Decision:* She hovers over the key/command.
      *   *The Ending:* She leaves it ambiguous or notes both.

  7.  **Refining the Philosophy:**
      *   Make sure Wright's view is clear: *Proper function* requires selection history. Without it, it's merely *acting* as a heart, not *being* a heart functionally.
      *   Make sure Cummins' view is clear: *Functional analysis* requires contribution to a capacity. History is irrelevant.
      *   Avoid jargon where possible, or embed it naturally in dialogue/monologue.

  8.  **Drafting - Word Count Check:**
      *   Need to expand on the sensory details and the internal struggle to hit ~1000 words.
      *   Focus on the heartbeat sound. It's the metaphor for the tension.

  9.  **Revision Plan:**
      *   Check: Did I resolve it? (Must not resolve).
      *   Check: Is the distinction clear? (History vs. Current Capacity).
      *   Check: Is the character feeling the pull? (Yes, frustration/confusion).
      *   Check: Word count.

      *(Self-Correction during drafting)*: Initially, I might make it too dry. I need to make sure Aris feels the moral/ontological weight. If the heart has no function, is the creature alive in the same way? Or is it a machine?

      *(Refining the Swampman aspect)*: Ensure it's clear there was no evolution. It popped into existence.

      *(Final Polish)*: Ensure the ending lingers on the uncertainty.

  10. **Final Word Count Check:** Aiming for tight prose to stay near 1000.

