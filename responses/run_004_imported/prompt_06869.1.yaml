answer: |-
  The containment hum was the only sound in the lab, a low-frequency vibration that Dr. Aris felt in her teeth. Inside the glass cylinder, the creature floated in amber fluid. It looked like a fox, roughly, though its fur was too uniform, its symmetry too perfect. It had no parents. It had no species. Three days ago, a localized quantum fluctuation in the vacuum chamber had simply… rearranged the carbon.

  Now, it was alive. Its chest rose and fell. Its heart beat.

  Aris sat at the console, her cursor blinking in a field labeled *Organ System Analysis: Primary Pump*. The database required a functional designation before she could proceed to metabolic testing. She tapped her recorder icon.

  "Log entry four-zero," she said, her voice sounding thin in the sterile air. "Subject remains stable. However, we have reached the ontological bottleneck. I need to classify the function of the cardiac muscle."

  She looked at the monitor. A real-time scan showed the ventricles contracting. Blood—synthetic, yet chemically identical to hemoglobin—pushed through the arteries.

  "Argument One," Aris said, pacing slightly. "The Etiological view. Wright's condition."

  She stopped in front of the glass. The creature drifted, eyes closed.

  "For this organ to have a function," she recited, "it must exist *because* it did this thing in the past. A heart pumps blood because ancestors pumped blood, survived, and passed on the trait. Selection history is the criteria. Proper function is backward-looking."

  She gestured at the fox-thing. "But you have no past. You were not selected. No ancestor of yours survived a predator because of this heart. You are a statistical accident. A lightning strike in the swamp. Therefore, strictly speaking, this organ has no function. It is merely causing effects. It is a heart-shaped object doing heart-shaped things, but it isn't *for* pumping blood. It's just… happening."

  Aris felt the cold logic of it. If she marked 'Function: Circulation,' she was lying about the history. She was implying a design or a selection process that never occurred. To call it a function was to imbue it with a purpose it didn't earn. It was a clock made by an explosion; it might tell time, but it wasn't *for* telling time.

  "Argument Two," she said, turning back to the console. "The Causal-Role view. Cummins."

  She leaned in, watching the rhythmic spike of the ECG line.

  "For this organ to have a function," she continued, "it only needs to contribute to the capacity of the containing system. What does this muscle do? It pressurizes fluid. What does that contribute to? It keeps the tissues oxygenated. What does that contribute to? The viability of the organism."

  She touched the glass. The creature twitched, a reflex.

  "History is irrelevant," she said. "If I analyze a carburetor, I don't need to know who built it to know its function is mixing air and fuel. I just need to know how it fits into the car's capacity to run. You are running. Your system has a capacity for life. This organ contributes to that capacity. Therefore, it has a function. To say otherwise is pedantry. It's pumping. It's keeping you alive. What more do you need?"

  The cursor blinked. *Define Function.*

  If she chose Wright, the field remained empty. The creature was a collection of accidental causes. It was a biological zombie, alive but without functional parts. It changed how she could treat it. If the heart had no function, could she remove it without violating a biological norm? Was it merely damaging a structure, or disabling a function?

  If she chose Cummins, she validated the creature as a biological system equivalent to any evolved animal. But she ignored the truth of its origin. She would be erasing the miracle of its randomness by forcing it into a narrative of selection.

  "Damn it," Aris whispered.

  The creature's eyes opened. They were dark, liquid, and focused on her. It didn't look like an accident. It looked like a being. It took a breath, the fluid cycling around its gills—or were they lungs?—adjusting to the oxygen mix.

  "It works," Aris said to the glass. "That's the pull. It works so perfectly that denying it function feels like blindness. Cummins wins on intuition. If it walks like a duck…"

  "But it didn't evolve like a duck," she countered herself. "Wright wins on truth. There is no lineage. There is no 'for' here. There is only 'is'."

  She sat down. The lab felt colder. The distinction wasn't just semantic; it was about what kind of thing sat in the tank. Was it a machine that resembled life, or life that resembled a machine?

  "If I mark 'No Function'," Aris murmured, "I am preserving the integrity of evolutionary history. I am saying that selection matters. That history matters."

  "If I mark 'Circulation'," she said, louder, "I am preserving the integrity of the organism. I am saying that presence matters. That capacity matters."

  The creature pressed a paw against the glass. A simple gesture. A demand? Or just physics?

  Aris hovered her finger over the keypad. The Wrightian verdict felt honest but cruel. It rendered the creature a philosophical ghost, a thing composed of parts that weren't really parts. The Cummins verdict felt compassionate but scientifically loose. It smoothed over the miracle of the anomaly by treating it as mundane.

  She thought about the heartbeat. *Thump-thump.* Was that a purpose being fulfilled, or just a noise being made?

  "Log entry four-zero, addendum," Aris said, her voice trembling slightly. "The disagreement is not resolvable by observation. The data is identical. The history is the variable."

  She looked at the creature. It blinked, slow and steady.

  "I cannot decide if you are doing what you are supposed to do," she said softly, "or if 'supposed to' is a story I tell myself to make sense of the noise."

  Her finger descended. She typed a command, but she did not hit enter. She left the cursor flashing in the box, suspended between the history that wasn't there and the life that was.

  "End log," she said.

  The hum of the containment unit continued, filling the silence, neither functional nor accidental, just present.
