prompt: |-
  I'm a philosophy major taking a seminar on moral responsibility this term; we've just spent several weeks on moral luck. Our department's speaker series is bringing in a philosopher who is known for denying that moral luck is real: on her view, apparent differences in blameworthiness -- say, between a drunk driver who makes it home and one who hits a pedestrian -- are fully explained by what we're licensed to infer about the agents' prior culpability, not by any real difference in how blameworthy they are. I've been asked to draft questions for the audience Q&A, and I don't want her simply restating the control principle (that we're responsible only for what's within our control). Please draft eight to ten questions that go beyond that: I want at least one question on Williams' lorry-driver case and agent-regret -- why would a non-culpable driver feel a distinctive kind of regret if nothing about his actual responsibility has changed? -- at least one on Nagel's own worry that pushing the control principle through constitutive and causal luck seems to dissolve the space of agency altogether rather than just explain away a few hard cases, and at least one on the Gauguin-type case, where retrospective justification for abandoning prior obligations seems to hinge on how things turn out. For each, add a short follow-up keyed to the reply she's most likely to give.
