answer: |-
  Your friend sees a contradiction where there is actually a profound continuity. To understand Sidgwick's psychical research not as a lapse but as a logical necessity, we must stop viewing it as a hobby and start viewing it as the empirical execution of the final problem in *The Methods of Ethics*.

  Here is the strongest version of your argument.

  ### 1. The Ethical Imperative: The Dualism of Practical Reason
  Your argument begins at the very end of *The Methods of Ethics*. Sidgwick concludes his magnum opus not with a triumph, but with a crisis. He identifies a "dualism of practical reason." He has demonstrated that both Rational Egoism (maximize your own happiness) and Universal Hedonism (maximize the general happiness) are equally rational methods. However, they are not always compatible. In a naturalistic world, doing what is best for everyone often requires sacrificing your own happiness.

  If there is no guarantee that virtue will be rewarded with happiness, then Reason is divided against itself. It commands me to be moral, but it also commands me to be prudent, and when those conflict, Reason offers no tie-breaker. For Sidgwick, this is unacceptable. If ethics is to be a rational system, there must be a "Moral Order of the Universe"—a fact of the matter ensuring that, in the long run, duty and self-interest coincide.

  This is where Sidgwick diverges from Kant. Kant resolved this by *postulating* God and immortality as necessary conditions for moral action. He essentially argued: *We must act as if these are true, so we are permitted to assume they are true.* Sidgwick, the rigorous empiricist, found this intellectually dishonest. He refused to "believe by an act of will." He writes explicitly that if we are to accept the Moral Order, it must be on the basis of **evidence**, not faith.

  Therefore, the closing chapter of *The Methods* issues a demand: *Find the further fact, or admit that ethics is irrational.*

  ### 2. The Empirical Bridge: Why Psychical Research?
  This is the link your friend is missing. Sidgwick did not turn to spiritualism out of grief or gullibility; he turned to it because it was the only domain where the "further fact" could possibly be found.

  What is the "further fact" required to reconcile egoism and utilitarianism? It is the existence of sanctions outside the natural, phenomenal world—specifically, the survival of consciousness after death and the existence of a moral governor. If consciousness ends at death, the utilitarian calculus is limited to a finite lifespan, and the egoist often wins. If consciousness survives, the horizon of happiness becomes infinite, and the calculus shifts.

  But how do you prove survival or a moral order? You cannot do it through abstract logic (Kant's failed route). You cannot do it through theology (too dogmatic). You must do it through **observation**.

  In the late 19th century, the only empirical claims that pointed toward the independence of mind from matter were claims of telepathy, mediumship, and apparitions. Sidgwick reasoned that if *any* natural law could be shown to be violated by mental phenomena, the materialist worldview that creates the "Dualism of Practical Reason" would crack. Investigating mediums was not a departure from his philosophy; it was the only way to satisfy the evidentiary requirements of his philosophy. He treated the séance room exactly as he treated the moral intuition: as a data source that required rigorous sifting to find the signal in the noise.

  ### 3. Meeting the Hardest Objection: The Null Results
  Your friend's strongest point is this: Sidgwick spent decades on this and found nothing conclusive. By Sidgwick's own probabilistic standards, shouldn't decades of failure have counted as evidence *against* the hypothesis? If he demanded high standards of evidence in ethics, why did he accept low standards of yield in psychical research?

  Here is the head-on rebuttal, grounded in Sidgwick's own epistemology:

  **A. The Asymmetry of Anomalies**
  Sidgwick was not looking for a frequency; he was looking for an anomaly. In standard science, if you test a drug 1,000 times and it fails, the drug doesn't work. But Sidgwick was investigating claims of *psychical* causation, which, by definition, would be rare, elusive, and dependent on specific psychological conditions. If the "Moral Order" is real, it is not a brute physical fact like gravity; it is likely subtle (otherwise, morality would be coerced by obvious reward and punishment, destroying moral freedom).
  Therefore, null results do not falsify the hypothesis in the same way they would in a chemistry lab. A thousand failed séances do not disprove telepathy; only one verified instance proves it. Sidgwick remained rational because he recognized that the *absence of evidence* in this specific domain is not *evidence of absence*, provided the phenomenon is hypothesized to be fragile and rare.

  **B. The Stakes of the Inquiry**
  We must weigh the cost of the search against the cost of failure. For Sidgwick, the alternative to finding the "further fact" was the admission that Practical Reason is fundamentally flawed. If he stopped searching, he was forced to conclude that morality is ultimately irrational.
  Given the infinite stakes of ethical coherence, the rational assignment of probability changes. Even if the likelihood of psychical phenomena is low, the *value* of confirming them is infinite (it saves the rationality of ethics). Therefore, a prolonged search with low yield is still a rational investment. To give up the search prematurely would be to succumb to despair, not rigor.

  **C. Agnosticism, Not Belief**
  Finally, your friend accuses Sidgwick of believing what he shouldn't. But Sidgwick never claimed to *know* the spiritualists were right. He remained an agnostic. He argued that the evidence was *sufficient to justify further investigation*, not sufficient to justify dogma.
  In his view, the scientific materialism of his day (which said psychical research was impossible) was just as dogmatic as the religious faith he rejected. By keeping the inquiry open despite null results, he was upholding the true scientific spirit: refusing to let a prevailing theory (materialism) dictate what data is permissible. He was protecting the *possibility* of the Moral Order, not claiming to have secured it.

  ### Conclusion
  Your friend sees a man who demanded proof in ethics but chased ghosts in his spare time. You see a man who realized that without proof of the "ghost" (the survival of the self and a moral order), the ethics collapses.

  Sidgwick's psychical research was the price he paid for his own honesty. He refused to lie to himself with Kantian postulates. He demanded empirical proof for the foundations of morality. When that proof wasn't available in physics or biology, he went to look for it in the only place it could possibly hide: the anomalous capacities of the human mind. That he died without finding it is a tragedy, but the search itself was the most consistent act of his philosophical life. He didn't lapse; he followed the argument where it led, even into the dark.
