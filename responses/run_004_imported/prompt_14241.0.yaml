      *   **The Ethical Imperative (The "Dualism"):** Detail the ending of *Methods*. Explain that without a moral order, ethics is rationally unstable. Kant postulates; Sidgwick demands proof.
      *   **The Epistemic Bridge:** Why psychical research? It's not about "magic"; it's about the survival of consciousness and extra-empirical knowledge. If mind survives body, the utilitarian calculus changes (infinite horizon).
      *   **Consistency of Method:** Sidgwick applied the same rigorous scrutiny to séances as to moral intuitions. He wasn't a believer; he was an investigator looking for a "further fact."
      *   **The Hard Objection (Null Results):** This is crucial. If he looked for 30 years and found nothing, shouldn't he have stopped?
          *   *Counter-argument:* The nature of the evidence. Psychical phenomena are elusive (by definition, if they are to be distinguished from normal physics). Absence of evidence isn't evidence of absence in this specific domain *if* the phenomena are hypothesized to be rare/subtle.
          *   *Stronger Counter-argument:* The cost of error. If the dualism isn't resolved, morality collapses. The potential value of the discovery outweighs the cost of the search. Also, Sidgwick *did* find some evidence he thought promising (e.g., the Creery experiments), even if inconclusive to others. He remained agnostic, not dogmatic.
          *   *Refining the Objection:* The friend says null results = disproof. I need to argue that for Sidgwick, the *possibility* remained open because the null results weren't definitive falsifications, just failures to confirm. He maintained a "hopeful agnosticism."
          *   *Wait, I need to be stronger.* The prompt asks to meet the objection head-on. The objection is: *By his own lights (probabilistic/empirical), decades of failure should lower the probability to near zero.*
          *   *Response:* Sidgwick wasn't calculating simple frequency. He was looking for *anomalies* that break natural law. One solid instance proves the possibility. Thousands of failures don't disprove the possibility if the conditions are hard to replicate. Furthermore, the *need* for the fact is so great (ethical coherence) that the prior probability he assigned to the search remained high enough to justify continued inquiry. It was a "Pascal's Wager" grounded in empirical diligence.

  5.  **Refining the Tone:**
      *   Needs to be philosophical, rigorous, and persuasive.
      *   Avoid apologetics; acknowledge the tension but resolve it through Sidgwick's specific epistemology.
      *   Use Sidgwickian terminology (Dualism of Practical Reason, Moral Order, Postulate vs. Evidence).

  6.  **Developing the "Null Results" Rebuttal (The Crux):**
      *   Friend's view: Null results = Hypothesis false.
