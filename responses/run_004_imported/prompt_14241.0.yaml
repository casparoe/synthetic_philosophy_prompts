      *   Also, Sidgwick distinguished between *belief* and *search*. He didn't claim to *know* it was true, only that it was rational to *seek* it until definitively disproven. And since you can't definitively disprove a rare anomaly, the search remains rational.
      *   *Key Point:* Sidgwick's ethics requires the *possibility* of harmony to keep rationality intact. If he stops looking, he admits reason is fundamentally flawed. He *had* to keep looking to preserve the rationality of morality.

