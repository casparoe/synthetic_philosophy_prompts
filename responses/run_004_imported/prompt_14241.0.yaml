          1.  Engage specifically with the closing chapter of *The Methods of Ethics* (the "Dualism of Practical Reason").
          2.  Explain why Sidgwick's standards of evidence compelled him to search empirically rather than postulate on faith (unlike Kant).
          3.  Address the hardest objection: Decades of null results should have counted as evidence *against* the hypothesis, by his own standards.

  2.  **Deconstruct Sidgwick's Position (*The Methods of Ethics*):**
      *   *The Problem:* Rational Egoism (maximize my happiness) and Universal Hedonism/Utilitarianism (maximize general happiness) are both rational methods. But they conflict. If being moral hurts my happiness, why be moral?
      *   *The "Dualism of Practical Reason":* Reason is divided against itself. There is no purely rational solution within the phenomenal world.
      *   *The Solution Requirement:* To reconcile them, we need a "moral order of the universe." Specifically, we need to know that virtue leads to happiness (sanctions). This implies God and immortality.
      *   *Sidgwick's Epistemology:* He is an empiricist/fallibilist. He rejects dogmatism and intuitionism unless validated. He rejects Kant's "practical postulate" (believing because we need to) as intellectually dishonest. He needs *evidence*.

  3.  **Deconstruct the Psychical Research Connection:**
      *   Sidgwick didn't just believe in ghosts; he investigated *telepathy* and *survival of death* as empirical hypotheses.
      *   If consciousness survives death, and if there's a moral governor, then the sanctions required to reconcile egoism and utilitarianism might exist.
      *   Therefore, investigating psychical phenomena is investigating the necessary condition for the coherence of ethics.

  4.  **Drafting the Argument - Section by Section:**

