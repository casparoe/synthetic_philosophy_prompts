answer: |-
  # The Vicious Glue: Why Bradley's Regress Demands Primitive Unity

  The problem of the unity of the proposition is the problem of how truth is possible. If we analyze the fact that *Desdemona loves Cassio* into its constituent parts—Desdemona, Cassio, and the relation of loving—we are left with a mere list. A list, however exhaustive, is not a fact. A list cannot be true or false; it simply *is*. To get from a list to a fact, something must bind the constituents together. F.H. Bradley's famous regress argues that any attempt to supply this binding element fails, threatening to dissolve the world into a soup of unrelated qualities or a single, undifferentiated Absolute.

  Bradley's Regress is often treated as a logical puzzle to be sidestepped, but it is actually a metaphysical sledgehammer. I argue here that the regress is genuinely vicious, not harmless. It successfully demolishes the view that facts are constructed from pre-existing, self-subsistent particulars and relations (constituent ontology). However, the solution is not to abandon facts, as Bradley did, nor to hide the glue behind linguistic distinctions, as Frege did. The only viable escape route is to invert the ontological order: we must accept that states of affairs are ontologically primitive. The unity of the proposition is not a problem to be solved by adding parts; it is a fundamental feature of reality that resists analysis.

  ### The Strongest Version of the Regress

  To appreciate the force of Bradley's argument, we must strip it of its historical baggage and present its strongest metaphysical formulation. The standard telling is that if $a$ and $b$ are connected by relation $R$, we need a further relation $R'$ to connect $R$ to $a$ and $b$, and so on *ad infinitum*. Critics often dismiss this as a harmless infinite regress, akin to Zeno's, suggesting that the job gets done at the first step and the rest is redundant.

  This misses the point. The regress is vicious because the goal is *ontological unity*, not spatial traversal. In Zeno's paradox, the sum of the infinite series converges on a destination. In Bradley's regress, no amount of added relations changes the ontological category of the collection. If $a$, $b$, and $R$ are all treated as self-subsistent entities (relata), then adding $R'$ simply adds another entity to the list. We move from $\{a, b, R\}$ to $\{a, b, R, R'\}$. We have increased the plurality, but we have not achieved unity.

  The core of the regress is a category mistake. It arises when we treat the *relating relation* as just another *relatum*. If $R$ is a thing that exists independently of $a$ and $b$, it is inert. It is a "relation-in-isolation." To make it work, we must relate it to the terms. But if the connector is itself a thing, it requires a connector. The regress demonstrates that you cannot build unity out of purely discrete, independent building blocks. If the parts are fully real prior to the whole, the whole can never emerge.

  ### Why the Regress is Vicious

  Is the regress harmless? Only if one is satisfied with a coherence theory of truth or a deflationary account of facts. But for the realist who believes that *Desdemona loves Cassio* is true because there exists a corresponding fact in the world, the regress is fatal to "building block" metaphysics.

  The viciousness lies in the failure of explanation. An explanation of unity must terminate in something that *is* a unity. If the explanation always points to a further relation, the unity is perpetually deferred. It is not that we run out of time or energy to posit the relations; it is that the very strategy of positing relations to explain unity is conceptually bankrupt. A chain of links, where every link is disconnected from the next, is not a chain; it is a pile of links. Bradley shows that if every connector is itself a link, we only ever have a pile. Therefore, the regress proves that the unity of a fact cannot be constituted by a relation that is ontologically on par with its terms.

  ### The Failure of Linguistic and Psychological Escapes

  Historically, philosophers have tried to dodge the regress without accepting its metaphysical implications. Two prominent attempts—Frege's and Russell's—fail to grasp the nettle.

  Frege's solution was to distinguish between "saturated" objects and "unsaturated" concepts. He argued that a concept like *loves* is inherently incomplete; it has a gap waiting to be filled by an object. Therefore, no further glue is needed because the unsaturated nature of the concept logically necessitates a connection. While this works for the semantics of language, it is metaphysically obscurantist. To say a concept is "unsaturated" is to use a spatial metaphor to describe logical function. It asserts that concepts *do* connect without explaining *how* they can exist in reality without being self-subsistent entities. If the concept exists, it is something. If it is something, Bradley asks, what makes it hook onto the object? Frege essentially stipulates the solution by fiat, hiding the metaphysical glue behind a linguistic distinction between function and argument.

  Russell's later "Multiple Relation Theory of Judgment" attempts to dissolve the objective fact entirely. He suggested that in a judgment like "A believes that $aRb$," there is no single object "$aRb$." Instead, the believing mind relates directly to $a$, $R$, and $b$ separately. This avoids the regress by denying that the proposition is a unified object outside the mind. However, this sacrifices objective truth. If there is no unified fact *that $aRb$*, then what makes the belief true or false? Russell saves the mind from the regress by drowning the world in subjectivity. It solves the logical problem by abandoning metaphysical realism, which is too high a price to pay.

  ### The Case for Primitive States of Affairs

  If the regress is vicious, and if linguistic stipulations and psychological reductions fail, we are left with a stark choice: either accept Bradley's Monism (that all relations are unreal and only the Absolute exists) or find a way to have unified facts without the regress. The most robust solution is the Neo-Aristotelian view championed in the 20th century by D.M. Armstrong: the ontology of **States of Affairs**.

  Armstrong accepts Bradley's central insight: you cannot build a fact out of independent particulars and universals. However, he rejects Bradley's conclusion that facts are impossible. Instead, Armstrong argues that we have the ontological priority backward. We should not think of particulars and universals as the primary existents that combine to form facts. Rather, the **State of Affairs** is the primary existent.

  In this view, *Desdemona's loving Cassio* is a fundamental unit of reality. Desdemona and Cassio and the relation *loving* are not separate things that come together; they are abstractions *from* the state of affairs. They are distinguishable by thought, but not separable in reality. The "tie" that binds them is not a further relation (which would restart the regress); it is the non-merelogical composition of the state of affairs itself.

  This defeats Bradley's Regress by refusing to play the game that generates it. The regress only gets going if we assume that $a$, $b$, and $R$ are fully real *before* they are related. If the state of affairs is primitive, then $R$ is never found "in isolation." It is always already relating. There is no "relation-in-itself" that needs a further relation to connect it to the terms. The relating is internal to the existence of the universal within the state of affairs.

  Critics often charge that this is unintelligible. How can a particular and a universal be "one" without being identical? How can there be a unity that is not a sum of parts? This objection, however, begs the question against the theory. It assumes that all composition must be mereological (like bricks in a wall). But if the world is made of facts, not just things, then non-mereological composition is the rule, not the exception. The "incoherence" charged by critics is merely the friction of trying to force a holistic reality into an atomistic conceptual framework.

  Furthermore, this view offers the "ontological free lunch" that Armstrong described. Once you have the state of affairs, you get the particulars and universals for free. You do not need to pay an extra ontological cost for a "tie." The unity is not a component; it is the mode of existence of the components. By positing the state of affairs as primitive, we acknowledge that reality comes in unified chunks. We can analyze these chunks, but we cannot construct them from the results of our analysis.

  ### Conclusion

  Bradley's Regress is one of the most durable arguments in metaphysics because it targets a genuine weakness in naive realism: the assumption that the world is built like a Lego set, with discrete blocks snapped together by connectors. The regress proves that if the blocks and the connectors are of the same ontological kind, unity is impossible. It is a vicious regress because it renders the existence of facts inexplicable, reducing truth to an endless deferral of connection.

  Frege and Russell attempted to evade this by retreating into language or the mind, but in doing so, they lost the world. Bradley himself retreated into Monism, losing the plurality of things. The only path that preserves both the plurality of objects and the unity of facts is to accept that the unity is primitive. We must endorse an ontology where states of affairs are fundamental. The glue is not a thing; it is the way things are. To ask what binds the fact together is to misunderstand the fact; the fact is not a thing bound together, it is the fundamental unit of being. Bradley was right that you cannot build unity from disjointed parts, but wrong to think unity is an illusion. The world is not a pile of parts waiting for glue; it is a web of facts, and the unity is woven into the thread itself.
