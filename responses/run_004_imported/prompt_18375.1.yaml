answer: |-
  You and Priya have essentially recreated one of the most famous and frustrating debates in contemporary moral philosophy. The fact that neither of you walked away happy is not a failure on your part; it is a feature of the problem. You have stumbled onto what is arguably the central "open wound" in the theory of moral responsibility.

  To answer your specific question: **No, this is not a solved problem.** There is no consensus on a principled stopping point that satisfies both the intuition that "luck shouldn't matter" and the intuition that "people are responsible for their actions."

  Here is the breakdown of the argument structure, why your regress objection is philosophically robust, and the available (but contested) ways philosophers try to bandage the wound.

  ### 1. The Structure of Nagel's Argument
  You are correct that Nagel's 1979 paper "Moral Luck" is the canonical text here. Nagel doesn't offer a solution; he offers a diagnosis of a paradox.

  The paradox arises from the collision of two deeply held intuitions:
  1.  **The Control Principle:** We can only be morally assessed for what is within our control.
  2.  **The Practice of Judgment:** In real life, we constantly judge people based on things outside their control (outcomes, circumstances, temperament).

  Nagel's taxonomy (Resultant, Circumstantial, Constitutive, and Causal Luck) is designed to show that if you take the **Control Principle** seriously and start peeling away the layers of luck, the "moral self" shrinks until it vanishes.

  *   **Resultant Luck:** The drunk driver case. You peel this off first (Priya's move). Now we judge only the *attempt* or the *choice*, not the outcome.
  *   **Circumstantial Luck:** Why was there a kid in the road? Why were you on that road? Why were you born in a time/place where cars exist? Peel that off.
  *   **Constitutive Luck:** This is your move against Priya. Why did you have the *character* to choose to drive drunk? Your impulsivity, your risk tolerance, your alcohol tolerance, your respect for law—all of this is largely genetic or environmental. You didn't choose your parents or your genes.
  *   **Causal Luck:** The laws of nature and antecedent circumstances determine how you act.

  **The Devastating Conclusion:** If you strictly adhere to the Control Principle, you end up with a "vanishing point." There is no "you" left to blame. The self is just a nexus of causal forces it did not choose.

  ### 2. Is Your Regress Objection Valid?
  **Yes.** Your argument against Priya is essentially **Galen Strawson's "Basic Argument"** (1994).

  Strawson argues that to be truly morally responsible for an action, you must be responsible for the mental state that caused the action. But to be responsible for that mental state, you must have chosen it based on a prior mental state. This leads to an infinite regress. Since you cannot create yourself *ex nihilo* (out of nothing), you can never be *ultimately* responsible for your actions.

  Priya's frustration ("you have to just stop the regress") is the standard Compatibilist reaction. She is intuitively grasping that if we accept your conclusion, society becomes impossible. But you are right to press her on the *principle*. If the principle is "only what is up to you," she cannot give you a metaphysical reason why constitutive luck is different from resultant luck. Both are outside the agent's ultimate control.

  ### 3. Williams vs. Nagel: The "Agent-Regret" Distinction
  You mentioned Bernard Williams. It is crucial to distinguish his project from Nagel's, because it offers a different way out of the deadlock.

  *   **Nagel** is working within a Kantian framework: He assumes morality *ought* to be pure and immune to luck, and he is distressed that it isn't.
  *   **Williams** thinks the Kantian framework is the problem. He argues that our moral concepts *should* be vulnerable to luck because our lives are.

  Williams introduces **Agent-Regret**.
  In the drunk driver case, Williams argues that the driver who hits the child *should* feel something the other driver does not. It isn't just "guilt" (which implies a moral fault). It is a specific regret that attaches to the *outcome* of one's agency, even if the outcome was lucky/unlucky.
  *   **Priya's view:** Blame is identical for both.
  *   **Williams' view:** Blame might be similar, but the *moral experience* of the agents is fundamentally different, and rightly so. The driver who killed the kid has a relationship to that death that the other driver does not. To deny this is to deny the reality of human agency in the world.

  Williams suggests that trying to purify morality of luck (Priya's initial stance) makes morality too thin to be meaningful.

  ### 4. How Philosophers Try to Block the Regress
  Since the "vanishing self" conclusion is practically and psychologically untenable, most philosophers try to block the regress. There is no single "solved" answer, but there are three main strategies.

  #### A. Compatibilism (Redefining Control)
  This is the industry standard. Compatibilists argue that the Control Principle doesn't require *metaphysical* freedom (the ability to have done otherwise in a universe of identical laws). It only requires **reasons-responsiveness**.
  *   **The Stop Point:** You are responsible if your action flowed from your own desires and beliefs, and you would have acted differently *if* there had been good reasons to do so.
  *   **Why it blocks the regress:** It stops at the level of psychology. It doesn't matter if your psychology was caused by your genes; what matters is that the action came from *your* psychology, not from a gun to your head or a seizure.
  *   **The Weakness:** It doesn't satisfy the "Ultimate Responsibility" intuition. It basically changes the subject from "Could you have chosen your character?" to "Did this action reflect your character?" Priya was implicitly relying on this, but couldn't articulate the shift in definition.

  #### B. P.F. Strawson's "Freedom and Resentment" (1962)
  Strawson argues that the whole debate is a category error. We don't hold people responsible because we have a metaphysical theory that justifies it. We hold people responsible because we are human beings embedded in social relationships.
  *   **The Stop Point:** **Reactive Attitudes.** Resentment, gratitude, forgiveness, and indignation are non-optional features of human social life. We can only suspend them in specific cases (insanity, coercion), not generally.
  *   **Why it blocks the regress:** It dissolves the demand for a "principled stopping point." The stopping point is our nature as social animals. To ask for more is to ask to opt out of humanity.
  *   **The Weakness:** It feels like an evasion. It explains why we *do* blame, but not whether we are *justified* in blaming.

  #### C. Forward-Looking/Consequentialist Accounts
  This view says blame isn't about "desert" (what you deserve based on the past); it's about modification (making the future better).
  *   **The Stop Point:** Utility. We blame the drunk driver to incentivize safe driving.
  *   **Why it blocks the regress:** It doesn't care about the regress. It cares about results.
  *   **The Weakness:** It seems to treat people as tools rather than agents. It also struggles to explain why we feel *angry* at a murderer, rather than just seeing them as a broken machine to be fixed.

  ### 5. The Verdict: Is it an Open Wound?
  **Yes.**
  If you demand a metaphysical justification for why constitutive luck is irrelevant while resultant luck is irrelevant, **Priya loses.** There is no principled distinction that survives the regress. Galen Strawson and other "Hard Incompatibilists" argue we must accept that no one is ever truly morally responsible in the "basic desert" sense.

  However, if you ask, "Can we function as a society without pretending people are responsible?" **You lose.** We cannot live without the practices of praise and blame.

  Most contemporary philosophy lives in the tension between these two poles.
  *   **Priya** is a **Compatibilist**. She knows the regress exists but believes "control" is a functional concept, not a metaphysical one. Her "stop before it gets silly" is actually a sophisticated pragmatic move, even if she couldn't defend it theoretically.
  *   **You** are flirting with **Hard Incompatibilism** or **Skepticism**. You are correctly identifying that the Control Principle, pushed to its logical limit, destroys responsibility.

  ### How to Make Up With Priya
  You can tell her this:
  1.  **Validate her:** She is right that we *must* stop the regress to live human lives. This is the Strawsonian/Compatibilist position.
  2.  **Validate yourself:** You are right that there is no *metaphysical* principle that stops the regress cleanly. This is the Nagel/Strawson skepticism.
  3.  **The Synthesis:** The debate isn't about who is right, but about what we want "responsibility" to do.
      *   If we want it to be a **cosmic judgment** of the soul, you win (it's impossible).
      *   If we want it to be a **social tool** for navigating relationships, she wins (it's necessary).

  Nagel himself concluded his paper by saying the problem has no solution. He wrote: *"If we cannot live with it, we cannot live with the truth."*

  You two didn't fail to solve the problem; you successfully identified why it's unsolvable. That's a successful seminar, even if it's a lousy night.
