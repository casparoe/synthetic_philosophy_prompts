  **Move 1 (Elena): Score 1**
  Elena is relying on the **Counterfactual Theory of Causation** (associated with David Lewis). Her logic is sound within that framework: if event E (fire spread) would not have happened if event C (watchman sleeping) had not occurred, then C is a cause of E. In a legal context, this is the "but-for" test. She is correct that omissions *can* be causes, but she presents this as the *whole* story, which leaves her vulnerable to Marcus's next point. She wins on the basic definition, but not on the selection criteria.

  **Move 2 (Marcus): Score 2**
  Marcus identifies the classic philosophical problem of **Causal Overgeneration** (or "profligate causation"). If counterfactual dependence is the *only* requirement for causation, then the absence of a fire extinguisher in my bedroom is a "cause" of a warehouse fire in another city (because if I *had* put it there and flown it over, the fire might have been out). This is a devastating objection to a pure counterfactual view. He correctly points out that we need a filter to distinguish *relevant* causes from *infinite possible* causes.

  **Move 3 (Elena): Score 1**
  Elena pivots to **Causal Selection Theory** (specifically the Hart & Honoré view). She argues that "normal" vs. "abnormal" conditions determine causation, and duties define what is normal. This is the standard legal approach: a breach of duty makes an omission "causally relevant." However, she claims this makes his omission *causally* distinct, not just *morally* distinct. This is metaphysically controversial (does a contract change physics?), even if it is legally pragmatic. She is right about how courts work, but Marcus is right that she is stretching the definition of "cause."

  **Move 4 (Marcus): Score 2**
  Marcus nails the **Is-Ought Distinction**. He correctly diagnoses that Elena is smuggling normative judgments (blame/duty) into a descriptive category (causation). From a physicalist standpoint, the fire spreads due to thermodynamics, not employment contracts. By calling this out, he highlights that the trial isn't actually about "what caused the fire" in a scientific sense, but "who is responsible for the damage." He wins the philosophical point, even if he might lose the legal argument.

  ***

  ### The Missing Consideration: **Scope of Risk**

  The reason they are talking past each other is that they are arguing about **Factual Causation** (Cause-in-Fact), but the trial will actually turn on **Proximate Cause** (Legal Causation).

  Neither of them raised the concept of **Risk Allocation**. In a civil trial, the court doesn't just ask, "Did his omission allow the fire to spread?" (Elena's point) or "Is he physically distinct from the rest of humanity?" (Marcus's point). The court asks: **"Was the damage that occurred the specific type of risk the watchman was hired to prevent?"**

  *   **Why this matters for your plot:** If the watchman was hired to prevent theft, and a fire broke out, his sleeping might be a "but-for" cause of the loss, but he might not be liable because the fire wasn't the *risk he was contracted to manage*. Conversely, if he was hired specifically for fire safety, the "omission" becomes actionable not because it changed the physics of the fire, but because the **liability was contractually assigned to him.**

  The disagreement turns on the fact that **legal causation is a policy tool, not a metaphysical truth.** The court isn't trying to discover the "true" cause of the fire; it's trying to decide where the loss should fall based on social and economic policy. Elena is arguing from the standpoint of *Liability*, Marcus is arguing from the standpoint of *Physics*. The verdict comes from a third place: **Foreseeability and Duty.**
