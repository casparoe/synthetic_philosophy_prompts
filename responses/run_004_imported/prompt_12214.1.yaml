  **Top Tier Defense:** Equalized odds is the strongest compliance standard for pretrial risk assessment because it directly operationalizes the normative commitment to equalizing the burden of state error. In this context, the primary civil rights harm is the false positive: depriving a low-risk individual of liberty based on a flawed prediction. By mandating that false positive rates (and false negative rates) be equal across groups, this criterion ensures that no demographic bears a disproportionate cost of the system's uncertainty, even if base rates differ. While it forces a trade-off with calibration, prioritizing error balance over predictive consistency is the more defensible choice when the stakes involve incarceration, as it prevents the tool from mathematically encoding historical disparities into unequal rates of wrongful detention.

  **Bottom Tier Disqualification:** Counterfactual fairness is disqualified as a formal compliance standard because it is operationally unverifiable. While philosophically robust, it requires a fully specified causal model to determine what would have happened had an individual's protected attribute been different—a claim that cannot be tested against observational data. Adopting this as a legal standard would shift audits from measuring observable outcomes to litigating subjective causal assumptions, allowing agencies to game the system by tweaking the causal graph rather than improving actual equity, rendering it useless for regulatory enforcement.
