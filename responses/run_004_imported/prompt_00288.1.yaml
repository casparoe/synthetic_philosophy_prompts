answer: |-
  This is an excellent question, and you have hit upon the single most common misconception regarding Updateless Decision Theory (UDT). It is a worry that arises almost immediately when one encounters the term "updateless," and it is understandable why it would seem fatal to the theory.

  The short answer is: **Your reasoning relies on a misunderstanding of what "updateless" refers to.** A UDT agent *does* condition on new information (like the host opening a door in Monty Hall) and *does* switch doors. It does not ignore sensory input.

  The longer answer requires distinguishing between **updating beliefs to choose an action** (standard Bayesian/CDT/EDT) and **choosing a policy that maps observations to actions** (UDT).

  Here is a breakdown of where the line of reasoning goes wrong and how UDT actually handles sequential problems like Monty Hall.

  ### 1. What "Updateless" Actually Means

  The term "updateless" is unfortunately named. It does not mean the agent refuses to process new information. It means the agent does not **update its prior distribution** before selecting its **decision rule (policy)**.

  *   **Standard Bayesian Agent (CDT/EDT):**
      1.  Start with Prior $P$.
      2.  Observe Evidence $E$.
      3.  Update to Posterior $P(\cdot | E)$.
      4.  Choose Action $A$ that maximizes expected utility relative to $P(\cdot | E)$.

  *   **Updateless Agent (UDT):**
      1.  Start with Prior $P$.
      2.  Select a **Policy** $\pi$ (a function mapping all possible observations to actions) that maximizes expected utility relative to $P$.
      3.  Observe Evidence $E$.
      4.  Execute Action $A = \pi(E)$.

  In both cases, the action taken depends on $E$. The difference is *when* the optimization happens. The standard agent optimizes the action *after* seeing $E$. The UDT agent optimizes the *mapping* from $E$ to $A$ *before* seeing $E$.

  ### 2. The Monty Hall Case

  Let's apply this to your Monty Hall example. This is the crucial test case.

  **The Setup:** You pick Door 1. The Host (who knows where the car is) opens Door 3 to reveal a goat. Should you switch to Door 2?

  **The CDT/EDT Approach:**
  1.  I observe "Host opened Door 3."
  2.  I update my credence: $P(\text{Car at 2} | \text{Host opened 3}) = 2/3$.
  3.  I choose the action "Switch" because it has higher expected utility given my new credence.

  **The UDT Approach:**
  1.  **Ex Ante (Before the game starts):** I consider all possible policies.
      *   Policy A: "Whatever door I pick initially, I will Stay."
      *   Policy B: "Whatever door I pick initially, I will Switch."
      *   Policy C: "Switch only if Host opens Door 3," etc.
  2.  **Calculation:** I calculate the expected utility of these policies based on my **Prior** (Car is at 1, 2, or 3 with prob 1/3 each).
      *   Expected Utility of "Always Stay" = 1/3.
      *   Expected Utility of "Always Switch" = 2/3.
  3.  **Selection:** I commit to Policy B ("Always Switch").
  4.  **Execution:** The game begins. I pick Door 1. The Host opens Door 3. My policy $\pi$ takes "Host opened Door 3" as input and outputs "Switch."
  5.  **Result:** I switch. I win 2/3 of the time.

  **Conclusion:** In Monty Hall, UDT and CDT/EDT yield the **same behavior**. The UDT agent does not stubbornly stick to its initial door. It follows the pre-committed policy that says "If you see a goat revealed, switch."

  ### 3. Why UDT is Not "Systematically Worse"

  Your worry was that UDT agents would perform worse in mundane sequential problems because they "can never let subsequent evidence change what it does."

  As shown above, subsequent evidence *does* change what the agent does, because the policy is a function *of* that evidence. The agent effectively says: *"I decided in advance that if I saw X, I would do Y. I am now seeing X, so I will do Y."*

  In almost all standard decision problems (Monty Hall, Prisoner's Dilemma with communication, sequential betting with known odds), UDT converges with CDT/EDT. It does not sacrifice mundane rationality.

  ### 4. So, What is the Advantage? (The "Disease" it Cures)

  If UDT agrees with CDT in Monty Hall, why adopt it? The divergence occurs in problems where **your decision provides evidence about the state of the world** or where **predictors simulate your decision process.**

  In these cases, the standard Bayesian update leads to "time inconsistency." The agent, *ex ante*, wants to commit to a plan, but *ex post* (after updating on being in the specific situation), it wants to deviate from that plan.

  **Example: Counterfactual Mugging**
  *   **Setup:** Omega flips a coin.
      *   If Tails: Omega asks you for \$100.
      *   If Heads: Omega gives you \$10,000, *but only if* Omega predicts you would have given the \$100 had the coin come up Tails.
  *   **The Situation:** The coin came up Tails. Omega asks for \$100.
  *   **CDT/EDT Reasoning:** "I know the coin is Tails. The Heads world is impossible. Giving \$100 now has no causal effect on the Heads world (it already didn't happen). I keep my \$100."
      *   *Result:* You get \$0. (Omega predicted you'd do this, so it didn't give you the \$10k in the Heads branch).
  *   **UDT Reasoning:** "I am optimizing my policy *ex ante* (before the coin flip).
      *   Policy 'Pay if Tails': Expected Value = (0.5 * -\$100) + (0.5 * \$10,000) = \$4,950.
      *   Policy 'Don't Pay': Expected Value = 0.
      *   I commit to 'Pay if Tails'."
  *   **Execution:** The coin comes up Tails. The policy says "Pay." You pay \$100.
      *   *Result:* You lose \$100 in this instance, but you are the *kind of agent* that wins \$10,000 in the counterfactual branch. UDT maximizes **ex ante expected utility**, whereas CDT maximizes **ex post expected utility**.

  ### 5. Summary for Your Seminar

  To address your seminar preparation, you can frame the correction this way:

  1.  **The Name is Misleading:** "Updateless" refers to the optimization of the **decision rule**, not the conditioning on **observations**.
  2.  **Policies are Functions:** A UDT policy is not "Do X." It is "If I observe X, do A; if I observe Y, do B."
  3.  **Monty Hall is a False Counterexample:** UDT agents switch doors because the policy "Always Switch" dominates "Always Stay" in expectation relative to the prior.
  4.  **The Real Trade-off:** UDT is not "Rationality vs. Irrationality." It is "Ex-Post Rationality (CDT)" vs. "Ex-Ante Rationality (UDT)." UDT sacrifices the ability to change your mind when doing so would have made you predictable in a way that harms your prior expected utility.

  Your intuition that an agent *should* use new information is correct, and UDT *does* use new information. It just refuses to let that new information alter the **criterion** by which actions are judged. It judges actions by how well they served the prior goal, not how well they serve the posterior belief.

  In mundane cases (Monty Hall), Prior and Posterior goals align. In Newcomb-like cases, they diverge, and UDT sides with the Prior. This is why it is treated as an advance: it solves the time-inconsistency problems that plague CDT/EDT without sacrificing performance in standard sequential problems.
