      *   *Misconception 2: "Refuse to switch."* UDT agents *do* switch in Monty Hall.
      *   *Misconception 3: "Updating vs. Policy Selection."* The key distinction isn't "update vs. don't update" in the sense of ignoring data. It's "update your *beliefs* and act on them" (CDT/EDT) vs. "select a *policy* mapping observations to actions that maximizes expected utility from the prior."
      *   *The "Updateless" Label:* It's slightly misleading. It means "updateless regarding the *selection of the decision rule*," not "updateless regarding *observations*."

  3.  **Formulate the Explanation:**

      *   **Acknowledge and Validate:** Start by validating that this is a very common and understandable confusion. The name "Updateless" is notoriously confusing.
      *   **Core Correction:** Clarify what "Updateless" actually means.
          *   It doesn't mean ignoring observations.
          *   It means optimizing a *policy* (a function from observations to actions) based on the *prior*, rather than optimizing an *action* based on the *posterior*.
      *   **The Monty Hall Example (Crucial Step):** Walk through how a UDT agent actually solves Monty Hall.
          *   *Prior:* Car is behind A, B, or C with prob 1/3.
          *   *Policy:* A function $P(\text{initial\_choice}, \text{host\_reveal}) \to \text{final\_choice}$.
          *   *Optimization:* Which policy maximizes win probability *ex ante*?
          *   *Result:* The policy "Always Switch" wins 2/3 of the time. The policy "Stay" wins 1/3.
