answer: |-
  Here are 5 main questions with tailored follow-ups (10 questions total) designed to push on the defense of moral luck without falling into definitional traps. They cover your four specific requirements plus one additional angle on the "is/ought" gap to round out the interview.

  ### 1. The Nagel Regress & The Arbitrary Stopping Point
  **Main Question:** Nagel's worry is that the Control Principle is a slippery slope: if we exclude resultant luck (outcomes), consistency demands we exclude circumstantial and constitutive luck too, until the "inner will" is the only thing left—and even *that* might be causally determined. If you want to defend moral luck, you have to stop this regress somewhere. Where do you draw the line so that it doesn't look like an arbitrary "stop loss" just to save our intuitive practices of blame?

  **Follow-Up:** If you say we stop at the "quality of the will" or the "choice itself," isn't that choice still the product of constitutive luck (temperament, upbringing)? If you concede that, are you essentially admitting that *nothing* is truly under control, and we should just embrace a kind of skepticism about responsibility altogether?

  ### 2. Williams' Agent-Regret: Phenomenology vs. Normativity
  **Main Question:** Williams leans heavily on "agent-regret" to show that the lucky driver and the unlucky driver are in different moral situations. But critics argue that agent-regret is just a *psychological* description of how we happen to feel, not a *normative* justification for why we *should* judge them differently. How do you get from "the driver feels a special kind of regret" to "the driver is actually more blameworthy"?

  **Follow-Up:** If a bystander felt that same intensity of regret—say, a parent who feels devastated they didn't stop the child from running into the road—we wouldn't blame them morally. So isn't the difference just the causal link, not the moral worth? Does grounding moral luck in a feeling risk making blame contingent on how sensitive an agent's conscience is?

  ### 3. Constitutive Luck & The Kantian Citadel
  **Main Question:** Kant tries to inoculate morality from luck by locating value in the "Good Will." But if constitutive luck determines my temperament—my patience, my courage, even my capacity for rational reflection—then the "Good Will" itself looks like a gift of luck. If you defend moral luck, do you have to abandon the Kantian idea that moral worth is the one thing that *must* be immune to fortune, or can you salvage a version of it?

  **Follow-Up:** If you abandon that immunity, doesn't praise become indistinguishable from praising someone for being tall or healthy? If moral worth is lucky, what work is the concept of "moral worth" doing that "good temperament" isn't already doing?

  ### 4. Criminal Law: Attempts vs. Completion
  **Main Question:** The legal system punishes attempted murder significantly less than completed murder, even if the intent and recklessness are identical. If you defend moral luck, you seem committed to saying the law is *correct* to do this. But many argue this is just a pragmatic rule for evidence, not a moral truth. Do you think the driver who kills the kid is *morally* worse than the one who doesn't, or just *legally* liable for more?

  **Follow-Up:** If you say they are morally worse, how do you respond to the fairness objection? If I can be a "murderer" or a "reckless driver" based on where a pedestrian happens to be standing, doesn't that make moral status vulnerable to the universe in a way that undermines the very idea of a moral community?

  ### 5. The Is/Ought Gap (Descriptive vs. Prescriptive)
  **Main Question:** A lot of the defense of moral luck relies on pointing out that we *do* judge people based on outcomes (the descriptive claim). But even if it's psychologically impossible for us to stop judging based on luck, does it follow that we *ought* to continue doing so (the prescriptive claim)? Could moral luck be a pervasive bias that we should acknowledge but try to mitigate in our ideal moral theories?

  **Follow-Up:** If you argue we *shouldn't* mitigate it because it tracks something real about agency, does that mean we should actively cultivate our tendency to judge harshly when things go wrong, rather than viewing it as a cognitive error to be corrected?

  ***

  **Podcast Tip:** Since you're co-hosting, these questions work well if you frame them as "The tension my seminar kept hitting was..." or "One objection that kept coming up in our readings was..." It signals that you've done the work without sounding like you're grading the guest. Good luck with the recording!
