answer: |-
  It is a pleasure to speak with someone who has actually looked through the eyepiece at the optic tectum firing. You are right to be suspicious. While philosophers often treat the disjunction problem as a puzzle to be solved by tweaking definitions (e.g., refining "proper function" or "normal conditions"), your intuition as a biologist cuts to the bone: the problem isn't a lack of data about the frog's evolutionary history; it is a category error in how we apply evolutionary theory to semantics.

  Here is the strongest case for the position that the disjunction/distality problem is fatal to the teleosemantic project. The core argument is that **natural selection operates on causal covariance, but semantics requires referential specificity, and there is no fact of the matter in the causal history that privileges the distal object over the proximal stimulus.**

  I will focus this critique on **Ruth Millikan's "Normal Conditions"** account, as it is the most sophisticated attempt to resolve this. I will argue that her solution presupposes the very intentionality it seeks to naturalize.

  ### 1. The Biological Reality: The Proximal Bottleneck
  As you know better than anyone, the frog's nervous system never encounters a fly. It encounters photon fluxes on the retina, transduced into electrochemical gradients by ganglion cells, processed by the optic tectum. The "fly" is a distal construct; the "small-dark-moving-thing" (SDMT) is the proximal cause.

  Teleosemantics claims that the content of the tectal firing is determined by what that firing mechanism was *selected for* detecting. Millikan argues that we identify the content by looking at the **Normal Conditions** under which the mechanism performs its Proper Function.
  *   **Proper Function:** Catching nutrition.
  *   **Normal Condition:** The presence of a fly.
  *   **Content:** <Fly>.

  Millikan argues that "SDMT" is not the content because the SDMT is merely the *interface* or the *sign*, not the *significate*. The mechanism is designed to correspond to the fly, even if it accesses the fly via the SDMT.

  ### 2. The Fatal Flaw: The Indeterminacy of Causal Description
  The fatal objection is that **selection history does not contain semantic descriptions.** It contains only causal chains. When we reconstruct the "selection history" to determine content, we are forced to describe the causal chain using *our* intentional vocabulary. But there are multiple, empirically equivalent descriptions of the selective advantage, and evolution itself provides no metric to choose between them.

  Consider the selective pressure on the frog's snapping mechanism in the Environment of Evolutionary Adaptedness (EEA). We can describe the success condition of the mechanism in at least three ways, all of which are true and co-extensive in the EEA:
  1.  **Distal:** The presence of a nutritious fly (*Musca*).
  2.  **Proximal:** The presence of a specific retinal stimulation pattern (SDMT).
  3.  **Consummatory:** The ingestion of protein.

  In the EEA, (1), (2), and (3) were perfectly correlated. Every time (2) occurred, (1) was present, leading to (3). Natural selection selected for the behavior that resulted in (3), triggered by (2), in the presence of (1).

  **The Problem for Millikan:** Millikan says content is fixed by the "Normal Condition" required for the Proper Function. But what *is* the Normal Condition?
  *   If the mechanism requires a **Fly** to function properly, then content is <Fly>.
  *   If the mechanism requires an **SDMT** to function properly, then content is <SDMT>.

  How does nature decide? The biological mechanism only "cares" (causally) about the SDMT. If you present a hologram (SDMT without Fly), the frog snaps. If you present a dead fly (Fly without SDMT), the frog does not snap. Biologically, the *necessary and sufficient condition* for the firing of the neuron is the SDMT, not the Fly.

  Millikan tries to bypass this by saying the device is *supposed* to map to the Fly. But "supposed to" is the very thing we are trying to naturalize. To say the device maps to the Fly rather than the SDMT is to assert that the evolutionary history privileges the distal link over the proximal link. **But evolutionary history is just a chain of physical causes.** In a physical causal chain, the proximal cause is *more* causally relevant to the effect (the snap) than the distal cause.

  To claim the content is <Fly> requires inserting a semantic boundary between the SDMT and the Fly that does not exist in the physics or the biology. It requires saying, "The selection was for the Fly," but selection was actually for the *correlation* between SDMT and Protein. Since the SDMT was the reliable marker, selection could equally be described as "selecting for sensitivity to SDMTs."

  ### 3. Why "Normal Explanations" Beg the Question
  Millikan's deeper reply involves "Normal Explanations." She argues that to explain why the mechanism exists, we must cite the Normal Condition. We explain the existence of the snapping mechanism by saying, "It was there to catch flies." We would *not* explain it by saying, "It was there to catch SDMTs," because SDMTs aren't valuable in themselves.

  **Here is why this fails in principle:**
  This move smuggles in human intentionality to fix biological content. *We* know flies are nutritious and SDMTs are not. *We* know the frog wants the protein. But the frog's mechanism does not know this. The mechanism is a transducer.

  If we are trying to **naturalize** intentionality, we cannot rely on the intentionality of the theorist (the philosopher/biologist) to fix the content of the subject (the frog).
  *   If we say the content is <Fly> because flies are *valuable*, we are defining content by *value* (teleology) rather than *reference* (semantics).
  *   If we say the content is <Fly> because the mechanism was *designed* for flies, we are using a metaphor (design) that collapses back into the causal history.

  If the causal history is compatible with both "Selected for detecting Flies" and "Selected for detecting SDMTs" (because they were co-extensive), then appealing to "value" doesn't solve the disjunction; it just changes the subject from "what does this state represent?" to "what is useful about this state?" A state can be useful because it tracks SDMTs which usually indicate Flies. That doesn't make the state *about* the Fly.

  ### 4. The Modal Collapse (The "Swampfrog" Argument)
  The indeterminacy becomes fatal when we consider modal intuitions, which are essential for semantics. Semantics is about truth conditions: Under what conditions is this representation *false*?

  *   **Teleosemantic View:** If a "Swampfrog" (a molecule-for-molecule duplicate of the frog, created by chance, with no evolutionary history) snaps at a hologram, its neural state has **no content** (or undefined content), because it has no selection history.
  *   **Biological View:** The Swampfrog's optic tectum is functioning identically to the real frog's. The causal role of the state is identical.

  If teleosemantics is true, the internal biological state of the real frog means <Fly>, but the identical state in the Swampfrog means nothing. This implies that **semantic content is not intrinsic to the biological state.**

  While teleosemanticists accept this (they are externalists), the disjunction problem shows this leads to a disconnect between content and causal explanation.
  *   When explaining why the frog snapped, a biologist cites the SDMT (proximal cause).
  *   When explaining the *content*, the philosopher cites the Fly (distal history).

  If the content <Fly> plays no role in the causal production of the snap (since the neuron only sees SDMT), then **intentionality is epiphenomenal.** The "meaning" is a label we paste onto the history of the mechanism, but it does no work in the system. If the goal of naturalizing intentionality is to explain how meaning guides behavior, teleosemantics fails because the "meaning" (Fly) is causally inert relative to the mechanism that supposedly bears it. The mechanism is driven by the SDMT.

  ### 5. Conclusion: The Metaphysical Gap
  The disjunction problem is fatal because it reveals that **etiology underdetermines semantics.**

  You can know every fact about the frog's evolutionary history, every selection pressure, and every reproductive success rate. You can know that in the EEA, SDMTs and Flies were co-extensive. But those facts are compatible with multiple semantic interpretations:
  1.  The state means <Fly>.
  2.  The state means <SDMT>.
  3.  The state means <Food>.
  4.  The state means <Snap-trigger>.

  Selection selects for the *outcome* (survival), not the *description* of the cause. Since there is no "description" encoded in the DNA or the selection pressure itself, there is no fact of the matter about which description is the "true" content.

  Millikan's "Normal Conditions" attempts to resolve this by asserting that the Normal Condition is the distal object. But this assertion is not derived from the biology; it is imposed *upon* the biology to save the intuition that thoughts are about the world. It assumes that because the *organism* benefits from the Fly, the *mechanism* must represent the Fly. But the mechanism only interacts with the SDMT.

  Therefore, teleosemantics does not naturalize intentionality; it merely **relocates** the mystery. It moves the indeterminacy from the present moment to the historical record, but since the historical record is just a series of physical causes subject to multiple descriptions, the indeterminacy remains. The "aboutness" never emerges from the "caused-by."

  As a biologist, you know the sensory system is a set of filters and transducers. Teleosemantics asks us to believe that the history of those transducers turns their causal sensitivity into semantic reference. The disjunction problem shows that history alone cannot bridge that gap. The frog snaps at the shadow, not the fly, and no amount of evolutionary storytelling can change the fact that the shadow is the only thing the frog ever actually knew.
