      *   **The "Fatal" Conclusion:** The problem isn't that we lack the fossil record. It's that *causal history underdetermines semantic description*. Multiple true descriptions of the selective advantage exist (catching flies, catching SDMTs, ingesting protein). Evolution selects for the *effect*, not the *description of the cause*. Therefore, teleosemantics cannot naturalize intentionality because it cannot bridge the gap between causal covariance and semantic aboutness.

