      *   **The Core Tension:** Evolution selects for *consummatory acts* (eating), but mechanisms respond to *proximal stimuli* (shadows on retina). The link between the two is causal, not logical.
      *   **Engaging Millikan (The "Normal Conditions" Reply):**
          *   Explain her move: Content is fixed by the relation that *normally* holds between the sign (neural state) and the significate (fly) such that the proper function (catching) is achieved.
          *   She tries to rule out "SDMT" by saying SDMT is just the *interface*, not the *object* of representation. The device is supposed to map to the distal object.
