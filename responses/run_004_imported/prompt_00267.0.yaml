      *   **User Background:** Retired field biologist, specialized in frog sensory systems. This is crucial. They know the biology better than most philosophers. They aren't looking for a basic intro; they want a rigorous philosophical argument that respects their empirical knowledge.
      *   **Topic:** Teleosemantics (Millikan, Papineau, Neander) and the Disjunction/Distality Problem (the "fly vs. small-dark-moving-thing" problem).
      *   **Task:** Make the *strongest case* that the disjunction/distality problem is *fatal* to teleosemantics. The argument must show that indeterminacy is baked into the etiological framework, not just a lack of data.
      *   **Constraint:** Engage seriously with at least one standard teleosemantic reply (e.g., Millikan's "Normal Conditions" or Neander's "Selected Effects") and explain why it fails *in principle*.

  2.  **Deconstruct the Core Problem:**
