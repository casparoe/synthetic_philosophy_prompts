      *   *The Question:* What is the content of the neural state triggering the snap? Is it <Fly>? Or is it <Small Dark Moving Thing> (SDMT)? Or is it <Nutritious Thing>?
      *   *The Teleosemantic Answer:* Content is determined by the *proper function* of the mechanism, which is determined by its selection history. The mechanism was selected *for* catching flies. Therefore, content is <Fly>.
      *   *The Objection (Disjunction/Distality):* In the evolutionary past, the frog never caught actual *flies* (Musca domestica, etc.) directly. It caught retinal stimulations, or SDMTs, which were *correlated* with flies. Natural selection selects for effects (catching food), but it acts on mechanisms triggered by proximal causes (retinal patterns). If SDMTs and Flies were co-extensive in the Environment of Evolutionary Adaptedness (EEA), selection cannot distinguish between them.
      *   *The "Fatal" Claim:* It's not that we don't know the history; it's that the history *itself* doesn't contain the distinction required to fix content.

  3.  **Select the Target for Critique:**
      *   Ruth Millikan's "Normal Conditions" (from *Language, Thought, and Other Biological Categories*) is the most sophisticated and well-known attempt to solve this. She argues that content is fixed by what the mechanism was designed to correspond to under *normal conditions* for its operation.
      *   *Why target Millikan?* Her work is the gold standard. If I can show her solution fails, the weaker versions (like early Papineau) fall too. Plus, a biologist would appreciate the nuance of "normal conditions."

  4.  **Drafting the Argument - Step-by-Step:**

