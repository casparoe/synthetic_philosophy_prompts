      "Money-metric/willingness-to-pay measures as used in cost–benefit analysis"
    ]
  }
  ```

  **Sen's capability approach (S):** This clears the bar least badly by shifting the currency of comparison from subjective mental states to objective freedoms, thereby handling human heterogeneity without pretending to measure unobservable utils.

  **Rawls's index of primary goods (A):** It avoids the measurement problems of utility entirely by focusing on publicly verifiable means to freedom, though it is slightly less defensible than Sen's approach because it ignores differences in individuals' abilities to convert goods into functionings.

  **Harsanyi's impartial-observer (A):** This provides the most rigorous formal derivation of utilitarianism from rationality axioms, but it remains vulnerable to the charge that its "identity" assumption covertly smuggles in the very utilitarian ethics it claims to derive.

  **Suppes–Sen extended-sympathy (B):** This offers a logically sound framework for stating interpersonal comparisons (e.g., "A in x is better than B in y"), but it remains an abstract ordering principle that requires further ethical input to generate specific policy judgments.

  **Subjective-well-being survey data (B):** While empirically grounded and superior to introspection, these measures are plagued by adaptation effects and cross-cultural scale inconsistencies that limit their reliability for precise aggregative judgments.

  **Classical cardinal hedonism (C):** Although ethically transparent about its goal, it is scientifically indefensible today because pleasure and pain are not cardinally measurable quantities that can be summed across persons.

  **Robbins-style ordinalist skepticism (C):** While logically robust regarding positive economics, it is ranked low here because it refuses to provide the normative basis for judgments that welfare economics and ethics actually require to function.

  **Money-metric/willingness-to-pay measures (D):** This is the least defensible because it covertly builds in a regressive value judgment by equating welfare with ability to pay, thereby weighting the preferences of the wealthy more heavily than the poor under the guise of technical neutrality.
