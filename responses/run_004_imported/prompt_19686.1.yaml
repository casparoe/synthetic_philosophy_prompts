      *   **Mara's Deep Dive:** Okay, but to prove the theorem, you need to assign truth values to "Rationality at node $x$" even for nodes off-path. That requires a belief revision policy. If I see you pass, do I think you're irrational *now* or just *then*? Aumann assumes dispositions that preserve rationality counterfactually. That's a heavy lift.
