answer: |-
  You have hit on one of the most significant and frequently overlooked tensions in modern moral philosophy. Your close reading of the text is correct: **Aquinas is discussing self-defense against an unjust aggressor, not the sacrifice of an innocent bystander.**

  To answer your specific question: **No, this passage does not, on its own, give you the resources to handle the trolley cases.** Applying Aquinas's reasoning from *Summa Theologica* II-II, Q. 64, Art. 7 to the trolley problem does indeed "smuggle in" several massive assumptions that are not present in the text.

  Here is a breakdown of what Aquinas is actually claiming, followed by an analysis of why that claim struggles to bridge the gap to the trolley problem.

  ### 1. What Aquinas is Actually Claiming
  In this article, Aquinas is addressing a specific question: *Is it lawful to kill a man in self-defense?* His "yes" is qualified by three specific conditions that are often glossed over in introductory ethics classes:

  1.  **The Context of Aggression:** The person being killed is an *aggressor* ("the slaying of the aggressor"). In Aquinas's legal and moral framework, an unjust aggressor has, by their action, forfeited certain rights to safety that an innocent person retains. The moral calculus here is not just about numbers; it is about justice. You are permitted to repel force with force because the other party is acting unjustly.
  2.  **The Intention:** The agent must intend self-preservation, not the death of the other. The death is *praeter intentionem* (beside the intention). If you enjoyed the killing or aimed specifically at it, the act becomes sinful.
  3.  **The Proportionality of Care:** Aquinas writes, "one is bound to take more care of one's own life than of another's." This is an agent-relative duty. He is not establishing a general rule that "five lives outweigh one." He is establishing a specific priority: *my* life takes precedence over *your* life when you are trying to kill me.

  ### 2. The Gap Between Aquinas and the Trolley
  When philosophers invoke the Doctrine of Double Effect (DDE) to explain why switching the track is permissible but pushing the man is not, they are relying on the **structural** distinction Aquinas makes (intended vs. foreseen), but they are discarding the **substantive** context (aggression vs. innocence).

  Here are the three assumptions that must be "smuggled in" to make Aquinas fit the trolley case:

  #### A. The Assumption of Innocence
  In Aquinas's text, the person who dies is a threat. In the trolley problem (both versions), the person who dies is an innocent bystander.
  *   **Aquinas:** It is permissible to cause the death of an aggressor as a side effect of saving yourself.
  *   **Trolley:** Is it permissible to cause the death of an *innocent* person as a side effect of saving others?
  Aquinas does not answer this in Article 7. In fact, elsewhere in the *Summa*, he is quite strict regarding the rights of the innocent. To apply his reasoning here, you have to assume that the moral weight of "intended vs. foreseen" is so powerful that it overrides the moral weight of "aggressor vs. innocent." That is a modern modification of the doctrine, not Aquinas's own.

  #### B. The Assumption of Authority (Self vs. Others)
  Aquinas is discussing **self**-defense. He justifies the act based on the natural instinct and duty to preserve *one's own* being ("natural to everything to keep itself in being").
  *   **Aquinas:** I may act to save *me*, even if *you* die as a side effect.
  *   **Trolley:** I may act to save *five strangers*, even if *one stranger* dies as a side effect.
  Aquinas provides no justification for a third party to weigh the lives of others against each other. His proportionality clause ("more care of one's own life than of another's") explicitly rejects the idea that I should sacrifice myself for another ("Nor is it necessary for salvation that a man omit the act of moderate self-defense... to avoid killing the other man"). Stretching this to mean "I should sacrifice one person to save five" inverts his agent-relative duty into an agent-neutral utilitarian calculation.

  #### C. The Assumption of "Means" vs. "Side Effect"
  This is the one area where the connection is strongest, but still fraught.
  *   **Footbridge:** Pushing the man uses his body as a *means* to stop the trolley. His impact is the mechanism of salvation. This violates the DDE because the bad effect (death) is part of the intended plan.
  *   **Switch:** Diverting the trolley saves the five; the death of the one is a *side effect* of the diversion.
  *   **The Problem:** Even if we accept this distinction, Aquinas requires the act itself to be good or neutral. Is diverting a trolley onto a person who has a right to be there a "good or neutral" act? Aquinas might argue that directly violating an innocent person's right to life (even as a side effect) renders the act disproportionate. Remember his warning: *"an act may be rendered unlawful if it be out of proportion to the end."* He does not define proportionality as a simple body count (1 < 5).

  ### 3. Historical Context: The Evolution of DDE
  It is important to note that the "Doctrine of Double Effect" as a named, free-standing ethical tool is largely a later development. While the *principle* is in Aquinas, its application to cases involving innocent bystanders was developed by later Scholastics (like Cardinal Cajetan in the 16th century) and refined by modern Catholic moral theologians.

  When contemporary philosophers (like Philippa Foot or Judith Jarvis Thomson) use DDE to analyze the trolley problem, they are using a **secularized, generalized version** of the principle. They have extracted the *logic of intention* from Aquinas while leaving behind the *theological and legal context* of self-defense against aggression.

  ### Conclusion
  You are right to be skeptical. The passage you found cannot bear the weight placed upon it by standard trolley problem explanations without significant modification.

  1.  **Aquinas's Claim:** You may kill an aggressor as a side effect of saving yourself, provided you use moderate force.
  2.  **Trolley Application:** You may kill an innocent bystander as a side effect of saving five others, provided you don't intend their death.

  To get from (1) to (2), you must add:
  *   That the rights of an innocent bystander are weaker than the rights of an aggressor (or that side effects on innocents are permissible in a way Aquinas doesn't specify here).
  *   That a third party has the authority to trade one innocent life for five (contradicting Aquinas's focus on self-preservation).
  *   That "proportionality" is determined by simple arithmetic (5 > 1) rather than the nature of the act itself.

  So, while Aquinas provides the **vocabulary** (intended vs. foreseen) that philosophers use to solve the trolley problem, he does not provide the **justification**. Using this passage to explain the trolley intuition is less an exegesis of Aquinas and more an appropriation of his framework for a problem he never considered. Your instinct that something is being smuggled in is philosophically sound.
