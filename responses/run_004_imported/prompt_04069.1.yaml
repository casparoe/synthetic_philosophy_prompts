  So in my Frege seminar this week we read Mendelsohn's translation of the 1924 diary (the part where he talks about jews needing to be 'marked' somehow and deprived of political rights, praising Ludendorff, ranting about the Weimar republic, etc) and it turned into this huge argument about whether any of that actually matters for evaluating Frege's actual philosophy -- the logicism, sense/reference, the whole Begriffsschrift project -- or if its just separate ad hominem stuff that doesn't touch his arguments at all. Can you write me an essay taking this on directly? Lay out the strongest case that the diary is philosophically irrelevant AND the strongest case for the people who think its actually continuous with his logical project (like the ones who think the obsession with eliminating vagueness/hidden ambiguity in his concept-script is suspiciously resonant with the antisemitic stuff about marking 'hidden' jews) -- then actually pick a side instead of hedging into 'its complicated' at the end.
