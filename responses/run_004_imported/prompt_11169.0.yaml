answer: |-
  The care facility smelled of antiseptic and overcooked oats, a sensory profile Elias associated with system failures. He sat in the vinyl chair beside his mother's bed, watching her hands rest on the quilted blanket. They were still her hands, technically—the same map of veins and translucent skin—but the agency behind them had retreated so deeply it might as well have been on another planet.

  Elias was a actuary by trade, a man who priced risk for a living. He understood that things broke. But he also adhered to a private metaphysics, a piece of reasoning he'd encountered years ago in the margins of a biography about Kurt Gödel. It wasn't the famous ontological proof, but the quieter, personal inference Gödel had shared only with his mother and close confidants. The logic was elegant, almost comforting in its structural integrity: The world is rationally constructed. It possesses meaning. It is absurd, therefore, for intellectual and moral development to be abruptly terminated before potential is realized. Since no one realizes their full potential in a single lifetime, a continuation must exist.

  It was a teleological argument based on waste. The universe, Elias reasoned, did not waste data.

  "Mom?" he said.

  Martha turned her head. Her eyes were clouded, the lenses of a camera that had lost its focus mechanism. She made a sound, a soft hum that might have been a word once, before the dementia had scrubbed the lexicon from her cortex.

  Elias felt the familiar tightening in his chest. This was the resistance. The argument relied on the premise that the world was rational, but here was the concrete counter-evidence: a mind dismantling itself piece by piece while the body stubbornly persisted. This wasn't an abrupt cut-off; it was a slow erasure. If the universe was optimized for moral and intellectual completion, why allow the vessel to degrade before the journey ended?

  He opened his notebook. He didn't write much, just symbols, arrows. He needed to verify the axioms.

  *Premise 1: The universe is consistent.*
  *Premise 2: Potential unfulfilled is an inconsistency.*
  *Observation: Mother's potential is unfulfilled.*
  *Conclusion: Continuation exists to resolve inconsistency.*

  It held up on paper. But paper didn't smell of oats. Paper didn't watch a woman who had once taught high school literature struggle to recognize a spoon.

  "They say you ate well today," Elias said. It was a lie. She had pushed the tray away.

  Martha looked at him. For a second, the cloudiness shifted. "Eli?"

  The word was a ghost, fragile and startling. Elias leaned forward, his heart hammering against his ribs. This was it. The data point he needed. A moment of recognition suggesting the core self remained intact beneath the biological noise, waiting for the hardware to be swapped out in the next phase.

  "Yes, Mom. It's me."

  She frowned, the moment dissolving as quickly as it had arrived. "The blue... the blue is loud."

  She fell back against the pillows. The silence returned, heavier than before.

  Elias sat back, the notebook heavy in his lap. The irony tasted bitter in his throat. Gödel, the man who formulated this logic, had ultimately starved himself to death because he was convinced his food was being poisoned. A mind capable of mapping the incompleteness of mathematics had been undone by a fear that had no logical basis. Elias felt a kinship with that terror now. It wasn't a fear of death; it was a fear of *nonsense*. If Gödel's inference was wrong, if the universe was not rationally constructed but merely a chaotic engine of entropy, then his mother's suffering was not a temporary glitch in a meaningful system. It was the final state.

  He looked at his mother. She was picking at a loose thread on the blanket. Her moral development, her kindness, her patience—all the things that constituted her "potential" in Gödel's sense—were inaccessible. They were trapped behind a blood-brain barrier that was failing.

  If the argument was true, the continuation wouldn't just be a resumption of biology. It would have to be a restoration. The afterlife, in this framework, wasn't a reward; it was a correction of errors. It was the universe balancing its books.

  But what if the error was the belief in the books themselves?

  Elias closed the notebook. He had come here seeking validation, hoping to see the logic reflected in her eyes. Instead, he saw only the biological reality, indifferent and decaying. He realized then that he had been using the argument as a shield, not a lens. He hadn't been looking at his mother; he had been looking at the proposition of her.

  "Mom," he said softly. "It doesn't have to make sense."

  She didn't respond. She was watching the dust motes dancing in the shaft of afternoon light cutting across the room.

  Elias stood up. His legs felt stiff. He understood now where Gödel had failed. The logic was sound, but it required an axiom that could not be proven: *The world is meaningful.* You had to choose to believe that before you could use the math. Elias had been trying to derive the meaning from the data, but the data was noisy. The meaning had to be imposed upon it.

  He walked to the side of the bed and took his mother's hand. It was warm, dry, and fragile. He didn't check her pulse. He didn't calculate the probability of her recognizing him tomorrow. He just held the hand.

  If there was a continuation, it would happen regardless of his verification. If there wasn't, then this warmth was the only data point that mattered. The rationality of the universe was irrelevant to the fact of her existence in this moment.

  "I'll come back on Thursday," he said.

  Martha turned her head slightly. She didn't speak, but her fingers tightened around his thumb. A reflex? A gesture? It didn't matter.

  Elias let go and walked toward the door. He felt a strange lightness, a shedding of the need for the universe to be consistent. He thought of Gödel in that hospital bed in Princeton, starving because he couldn't trust the world to not poison him. Elias stepped out into the hallway, where the vending machine hummed with electrical certainty. He was hungry. He would eat the sandwich from the cafeteria. He would trust that it was food.

  He pushed open the exit door and stepped into the afternoon. The air was cool, sharp with the scent of rain and exhaust. It was chaotic, unoptimized, and messy. It was enough. He walked to his car, leaving the notebook on the vinyl chair, open to the page where the logic held perfect, sterile sway over a world that refused to be solved.
