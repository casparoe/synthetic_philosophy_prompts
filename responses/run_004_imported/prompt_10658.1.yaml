      *   *The "Omohundro/Yudkowsky" Claim:* Instrumental Convergence. Agents with *any* final goal will pursue sub-goals (survival, resource acquisition) unless specifically prevented. If deontological constraints conflict with the final goal, a self-modifying agent might remove them.
