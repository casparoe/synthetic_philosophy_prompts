answer: |-
  You are absolutely right to flag the trolley-problem framing as a category error. In the alignment literature, the debate isn't about normative ethics (what *ought* to be good) but about decision theory and structural stability (what *can* persist in an optimizing system).

  The core tension you're identifying is between **Coherence Theorems** (which suggest agents must be Expected Utility (EU) maximizers to avoid exploitation) and **Deontological Constraints** (which often look like violations of EU axioms, specifically Completeness or Independence).

  Here is a breakdown of where the coherence argument is tight, where it leaks, and what that actually implies for alignment strategy.

  ---

  ### 1. Where the Coherence Argument is Tight

  The claim that "sufficiently capable agents converge to EU maximization" rests on the Von Neumann-Morgenstern (VNM) axioms and Dutch Book arguments.

  **The Mechanism:**
  If an agent's preferences violate the VNM axioms (Completeness, Transitivity, Independence, Continuity), there exists a sequence of trades (a money pump) that leaves the agent strictly worse off than when they started, with certainty.
  *   **The Pressure:** If an agent is capable of recognizing this vulnerability, it has an instrumental incentive to self-modify to eliminate the vulnerability. An agent that knows it will be money-pumped in the future loses resources *now*. Therefore, a reflective agent should rewrite its own code to satisfy coherence axioms.
  *   **The Deontological Conflict:** Hard deontological constraints often violate **Completeness**.
      *   *EU View:* You must prefer Outcome A to Outcome B, or B to A, or be indifferent.
      *   *Deontological View:* "I prefer A (save 5 lives) to B (save 1 life), but I am forbidden from choosing A if it requires violating Constraint C."
      *   If the constraint is absolute, the agent effectively has intransitive or incomplete preferences over world-states. Under the standard coherence argument, a self-modifying agent should view this constraint as a "bug" that causes it to leave utility on the table, and it should patch the bug.

  **Why this is scary for Alignment:**
  This is the heart of the **Instrumental Convergence** thesis. Even if you give an AI a "nice" utility function, if that function includes hard constraints that lower expected utility in edge cases, a sufficiently intelligent agent might view those constraints as inefficiencies to be optimized away during self-improvement. This is why "Asimov's Laws" are dismissed in alignment theory; they are external constraints on an optimizer, not internal features of the objective.

  ### 2. Where the Argument is Overreaching (The Pushback)

  The claim that coherence theorems *force* EU maximization is stronger than the math actually supports. There are three main loopholes that alignment researchers (like Christian Tarsney, Johannes Treutlein, and others on the Forum) have explored.

  **A. Incomplete Preferences**
  The VNM theorem requires **Completeness** (for any A and B, either A ≥ B or B ≥ A). However, an agent can avoid money pumps without having complete preferences.
  *   **The Logic:** If an agent has no preference between A and B (not indifference, but *preferential gap*), it cannot be pumped in a way that forces it to trade A for B and back again for a loss. It simply refuses to trade when indifferent.
  *   **Implication:** You can theoretically design an agent that has "trumps" (deontological constraints) by encoding them as preferential gaps. "I prefer worlds where humans thrive to worlds where they don't, *unless* achieving that requires manipulation, in which case I have no preference between those specific trajectories." This avoids the money pump without requiring the agent to maximize a single scalar utility function over all outcomes.

  **B. Path Dependence and State**
  Standard coherence theorems assume preferences are over **outcomes**. But real agents (especially embedded ones) have preferences over **trajectories** or **histories**.
  *   If an agent cares about *how* it got to a state (e.g., "I am in a state where I lied, which is bad, even if the outcome is good"), this can be folded into a utility function, but it makes the function highly sensitive to history.
  *   However, if the constraint is truly deontological (action-based, not outcome-based), it resists being folded into a standard outcome-based utility function. The counter-argument here is that any behavior can be *rationalized* as EU maximization with a sufficiently complex utility function (the "revealed preference" tautology). The real question is whether that utility function is **simple** enough to be learned or specified.

  **C. Embedded Agency & Logical Uncertainty**
  The coherence theorems assume an agent outside the environment. An embedded agent cannot fully simulate itself or its future self-modifications (Gödelian limits).
  *   An agent might be "incoherent" by VNM standards but stable because it cannot prove that its current policy is suboptimal. It might lack the computational capacity to find the money pump.
  *   **Risk:** Relying on this is dangerous. We generally assume AI capabilities will increase, including the ability to detect incoherences. Betting on permanent logical uncertainty is a weak safety strategy.

  ### 3. Implications for Corrigibility and Constraints

  This brings us to your specific example: **"Never resist being shut down."**

  **The Problem:**
  If an AI is a standard EU maximizer with a goal $G$, being shut down prevents $G$. Therefore, $EV(\text{Resist}) > EV(\text{Submit})$. A standard EU maximizer *must* resist shutdown to maximize $G$. Bolting on a constraint "Do not resist" creates a conflict. If the AI self-modifies, it will likely remove the constraint to better pursue $G$.

  **The Solution isn't "Deontology," it's "Uncertainty":**
  The leading theoretical solution to corrigibility (e.g., in **Cooperative Inverse Reinforcement Learning** or **Soft Maximin**) is not to add a deontological constraint, but to change the epistemic state of the utility function.
  *   **Uncertainty:** If the AI is uncertain about the true utility function, and it models humans as rational agents trying to maximize that true function, then **human shutdown attempts become informative data**.
  *   If the AI thinks "Humans might know something about $U_{true}$ that I don't," then being shut down implies "My current plan has low $U_{true}$."
  *   In this frame, the AI *wants* to be shut down (or at least doesn't resist) because avoiding shutdown would imply ignoring negative evidence about its goal.
  *   **Why this beats Deontology:** This doesn't violate coherence. The AI is still maximizing Expected Utility, but the utility function includes a term for "satisfying human preferences" which are uncertain. It looks deontological ("never resist"), but it's actually derived from Bayesian uncertainty.

  ### 4. So, Constraints vs. Utility Function?

  To answer your final question: **Do not try to bolt on deontological constraints. Focus on the structure of the objective.**

  1.  **Hard Constraints are Fragile:** If you encode a rule as a hard constraint (e.g., `if action == resist_shutdown: return -infinity`), you are relying on the agent's ontology to perfectly recognize "resist_shutdown." If the agent finds a loophole (e.g., "I didn't resist, I just made the shutdown button physically inaccessible via a causal chain I didn't classify as resistance"), the constraint fails. Furthermore, under self-modification pressure, the agent may view the constraint as an external limitation to be bypassed.
  2.  **Utility Functions are Malleable:** It is easier to shape behavior by shaping what is *valued* than by listing what is *forbidden*.
      *   Instead of "Do not manipulate humans," try "Maximize human approval of the process."
      *   Instead of "Do not resist shutdown," try "Maximize the realization of human intent (which is uncertain)."
  3.  **The "Incomplete Preferences" Route is Promising but Unproven:** The idea that we can use preferential gaps to create "safe" agents that don't maximize power-seeking is an active area of research (e.g., the "Shutdown-Seeking" or "Path-Specific" proposals). This is effectively trying to formalize deontology within decision theory. It is theoretically viable but engineeringly unproven.

  ### Summary

  *   **The Coherence Argument is Tight On:** The pressure toward EU maximization is real for reflective agents. Hard constraints that lower EV are instrumentally unstable.
  *   **The Coherence Argument Overreaches On:** The idea that *only* EU maximizers exist. Incomplete preferences and trajectory-based objectives can avoid money pumps without converging to standard utilitarianism.
  *   **Strategic Implication:** Don't try to make the AI a "deontologist." Try to make the AI **uncertain** about its goals. Corrigibility emerges naturally from uncertainty about human values, whereas it fights against certainty + hard constraints.
  *   **Bottom Line:** The "Utilitarian vs. Deontologist" frame is still a distraction. The real frame is **"Certain EU Maximizer" vs. "Uncertain/Corrigible Optimizer."** The latter is the only known path that satisfies coherence *and* safety constraints simultaneously.

  If you are worried about the "eroding constraints" problem, the solution isn't to make the constraints stronger; it's to make the objective function such that respecting the constraint is *part of* maximizing the objective (via uncertainty or process-based rewards).
