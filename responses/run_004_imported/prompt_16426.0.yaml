      *   *Verdict Formulation:* Korsgaard is *reconstructing* Kant, not merely extending him. She keeps the *method* (transcendental derivation from the nature of agency) but changes the *criterion* for moral considerability from "rational legislation" to "natural normativity." This is a significant departure from Kant's explicit metaphysics of morals, even if it claims to be faithful to his *spirit*. It is *not* simple sentimentalism, but it is closer to a naturalistic teleology than Kant's dualistic rationalism.

