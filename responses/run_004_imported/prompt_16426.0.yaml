      *   **Korsgaard's Position (*Fellow Creatures*):**
          *   *Core Premise:* Value comes from the structure of *practical identity* and the necessity of valuing one's own good to act at all.
          *   *Mechanism:* To act, an agent must value its own ends. If I value my own good because I am a creature who *has* a good, I must acknowledge that other creatures who *have* a good (even if not rationally reflective) also have claims. The "good" is normative for the creature.
          *   *Animals:* They are "end-directed." Things can be good or bad *for* them. They are "ends-in-themselves" in a natural sense, which translates to moral status.
