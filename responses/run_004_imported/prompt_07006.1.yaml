prompt: |-
  My most recent novel followed the Bloomsbury Group through the 1920s, with Keynes as a supporting character, which is presumably why the economics department where I did my own undergraduate degree — before I left the PhD track for fiction — has asked me to give this year's commencement address to the graduating economics majors. Most of them are headed straight into banking, consulting, or further study that will reward exactly the trait Keynes diagnosed, in "Economic Possibilities for our Grandchildren," as a temporary, half-pathological necessity rather than a virtue: "purposiveness," the habit of valuing an act only for what it secures later. He thought avarice, usury, and precaution would have to serve as our gods "for a little longer still," on the way to a good life he located instead in what a later essay, "My Early Beliefs," called our real ends — love, beauty, and the pursuit of knowledge, wanted for themselves and not for what they yield. Please write me about eight minutes of remarks that take this seriously rather than decoratively: the speech can't simply congratulate the graduates on choosing the means Keynes distrusted, but it can't curdle into a sermon against ambition either, since Keynes himself was an avid speculator and art collector, not a monk, and I'd rather not sound like a novelist who escaped economics only to come back and lecture the department on the vanity of its own discipline. Please don't reach for "in the long run we are all dead" — wrong essay, wrong argument, and every economist in the hall will have heard it too many times already. Half the room has read Keynes's own essays closely; the other half know him only as the stimulus-spending, animal-spirits Keynes of the textbooks, and the speech has to genuinely work for both.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist who studied economics (undergrad) but left a PhD track for fiction. Wrote a recent novel about the Bloomsbury Group in the 1920s (Keynes as a supporting character).
      *   **Audience:** Graduating economics majors. Some are going into banking/consulting (high "purposiveness"), some into further study. Half know Keynes's essays well, half know him only as the textbook macroeconomist.
      *   **Key Theme:** Keynes's distinction between "means" (purposiveness, avarice, usury, precaution) and "ends" (love, beauty, knowledge). Specifically referencing "Economic Possibilities for our Grandchildren" and "My Early Beliefs."
      *   **Tone:** Serious, not decorative. Not a sermon against ambition (Keynes was a speculator/collector), but not a validation of pure instrumentalism either. Avoid clichés ("in the long run we are all dead").
      *   **Constraint:** Approximately 8 minutes spoken (roughly 1,000-1,200 words at a moderate pace).
      *   **Goal:** Bridge the gap between the discipline they studied and the life they might want to lead, using Keynes's philosophy without being preachy or dismissive of their career choices.

  2.  **Determine the Core Argument:**
      *   Acknowledge the tension: You studied a discipline of *means* (allocation, efficiency, incentives) but you are entering a life that requires *ends* (meaning, purpose).
      *   Reframe "Purposiveness": It's a tool, not a virtue. It's necessary *now* (as Keynes said), but it shouldn't become the whole identity.
      *   The Bloomsbury Connection: Use the speaker's experience writing the novel to humanize Keynes. He wasn't just a theorist; he lived the tension. He made money to fund the life of the mind/art.
      *   Call to Action: Use your economic training to secure the "little longer still" period efficiently, so you can get to the "real ends" sooner. Don't let the means consume the ends.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1-2 mins):**
          *   Welcome and acknowledgment of the oddity of the invitation (novelist vs. economists).
          *   Mention the novel/Bloomsbury connection to establish credibility and personal link.
          *   Set the stage: The specific Keynes we are talking about today (not just the textbook one).

      *   **The Problem of Purposiveness (2-3 mins):**
          *   Define "purposiveness" from "Economic Possibilities for our Grandchildren."
          *   Acknowledge the career paths (banking, consulting). Validate them as necessary.
          *   The danger: Mistaking the tool for the goal. The "half-pathological necessity."
          *   Address the two halves of the room (essay readers vs. textbook learners).

      *   **Keynes the Human (2 mins):**
          *   He wasn't a monk. He speculated. He collected art.
          *   Why? To fund the "real ends."
          *   The Bloomsbury context: They valued relationships and art *above* the grind, but used the grind to support it.
          *   This prevents the speech from being anti-ambition.

      *   **The Charge/Conclusion (2 mins):**
          *   How to apply this.
          *   Don't wait until retirement for the "real ends."
          *   Use economics to solve the problem of scarcity so you can enjoy abundance (of time/spirit).
          *   Final thought on the "good life."

  4.  **Refining the Tone:**
      *   *Check:* Is it too preachy? *Adjustment:* Ensure I validate the utility of their skills. Economics is the engine, not the destination.
      *   *Check:* Is it too academic? *Adjustment:* Keep the language accessible but respectful of their intelligence.
      *   *Check:* Is the length right? *Adjustment:* Aim for ~1100 words.
      *   *Check:* Did I avoid the "long run" quote? *Yes.*

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hello. I wrote a book about your guy.
      *   You are going to make money. Keynes said making money is a stopgap.
      *   But he made money too. So it's okay.
      *   Just don't forget to love art and people.
      *   Goodbye.
      *   *Critique:* Too simple. Needs more nuance on *why* purposiveness is necessary but dangerous. Needs to sound like a writer, not a generic speaker.

  6.  **Drafting - Iteration 2 (Focusing on Language):**
      *   Use the phrase "temporary, half-pathological necessity."
      *   Contrast "instrumental value" with "intrinsic value."
      *   Bring in the specific imagery of the 1920s/Bloomsbury without getting bogged down in plot summary.
      *   Make sure the transition from "economics as a tool" to "life as an end" feels seamless.

  7.  **Final Polish (Reviewing against constraints):**
      *   Word count check.
      *   Ensure the distinction between the "textbook Keynes" and the "essayist Keynes" is clear but unified.
      *   Ensure the "novelist" persona shines through (storytelling element).

  **(Self-Correction during drafting):** I need to make sure I don't sound like I'm telling them *not* to go into banking. The prompt says "can't curdle into a sermon against ambition." I need to frame banking/consulting as the "necessary work" that Keynes acknowledged, provided it doesn't become the *only* work. The key is *consciousness* of the distinction.

  8.  **Finalizing the Text:** (Proceeding to write the speech based on these thoughts.)
      *   *Opening:* Acknowledge the irony.
      *   *Body:* The definition of purposiveness. The Bloomsbury example. The practical application.
      *   *Close:* A charge to keep the "ends" in view.

  9.  **Timing Check:** 1100 words at 140 words/minute = ~7.8 minutes. Perfect.

  10. **Final Review:** Does it mention "in the long run we are all dead"? No. Does it mention the novel? Yes. Does it address both groups of students? Yes.

  (Proceed to generate output.)
answer: |-
  Thank you. It is a genuine honor to stand here, and perhaps a slightly confusing one. I know what the bulletin says: a novelist. But to this department, I am also a prodigal alumni who walked away from the PhD track to write fiction. And, as some of you know, my most recent book spent time in the 1920s with the Bloomsbury Group, where John Maynard Keynes was not just a theorist, but a friend, a lover, and a diner at the table.

  When the chair invited me, I worried about the optics. It is one thing for a novelist to talk about the life of the imagination; it is another to stand before graduates of a rigorous, quantitative discipline and talk about the "good life." You are entering fields—banking, consulting, policy, academia—where precision matters. Where models must clear. Where incentives are real.

  But I am not here to tell you that economics is vain. I am here to suggest that the man whose name is on your textbooks had a much wider map of human motivation than the curves you've spent four years mastering. And he had a specific warning for people exactly like you.

  Half of you know Keynes as the architect of counter-cyclical spending and the prophet of animal spirits. The other half have read his essays and know him as a moral philosopher who happened to do math. Today, I want to speak to the tension between those two figures.

  In *Economic Possibilities for our Grandchildren*, Keynes made a startling claim about the drive that motivates most of your career plans. He called it "purposiveness." He defined it as the habit of valuing an act only for what it secures later. We do X to get Y, so we can eventually buy Z. It is the logic of investment. It is the logic of the resume. It is the logic of the market.

  Keynes did not say this was evil. He said it was a "temporary, half-pathological necessity." He argued that avarice, usury, and precaution must serve as our gods "for a little longer still." Why? Because we have not yet solved the economic problem. We still need to secure the base.

  Many of you are heading into industries that reward purposiveness above all else. You will be billed by the hour. You will be promoted based on quarterly returns. You will optimize portfolios to maximize future utility. There is dignity in this work. It is the work of building the platform upon which a civilized society stands. Keynes himself was no monk. He was an avid speculator. He managed endowments. He collected art. He understood that without economic surplus, there is no freedom.

  But here is the danger, and it is the reason I am standing here instead of a senior partner from a consulting firm. The danger is that you will mistake the means for the end.

  Keynes believed that once the economic problem was solved, the purposive instinct would lose its value. He located the "real ends" of life elsewhere: in love, in beauty, and in the pursuit of knowledge wanted for itself, not for what it yields. He worried that for centuries, we had been trained to value the stem and ignore the flower. He worried that when we finally had the wealth to stop, we wouldn't know how to live.

  As you leave here, you will be entering a world that demands you live in the stem. That is fine. But I ask you to keep the flower in view.

  When I was writing my novel, trying to capture the texture of those Bloomsbury weekends at Charleston and Gordon Square, I was struck by how they treated economics. To them, money was a utility, like plumbing. It had to work, it had to be reliable, but you didn't invite guests over to admire the pipes. You invited them over to talk about art, to argue about philosophy, to fall in love.

  Keynes speculated fiercely so that he could write gently. He engaged with the "grim necessity" of the market so that he could protect the time required for the "real ends."

  I am not suggesting you reject ambition. I am suggesting you audit it.

  For those of you going into finance: Make your money. But do not let the accumulation of capital become the sole metric of your self-worth. If you value your work only for the bonus it secures, you are practicing the "purposiveness" Keynes warned was pathological. You are deferring your life to a future date that may not arrive, or that may arrive with you too tired to enjoy it.

  For those of you going into policy or academia: Remember that efficiency is not the only virtue. A model can be elegant and still miss the human texture it claims to describe. Economics gives you the tools to manage scarcity. But wisdom is knowing what to do when scarcity is alleviated.

  The split in this room—between those who know the essayist Keynes and those who know the textbook Keynes—is actually a map of your own coming decade. You will need the textbook Keynes to pay your rent and support your families. You need the essayist Keynes to keep from becoming a machine that processes incentives.

  There is a temptation, when one leaves a discipline for the arts, to romanticize the escape. To imply that I went to do something "real" while you stay to do something "technical." I reject that. Writing a novel is a craft with its own brutal economics of time and attention. But the freedom to write it came from understanding that the work itself was the end, not just the publication.

  So, my charge to you is this: Use your training to solve the problem of necessity as efficiently as possible. Be brilliant at the means. But do not let the means colonize your soul.

  When you are in your thirties, grinding through a week that feels entirely instrumental, ask yourself: Where is the non-purposive part of my life? Where am I doing something simply because it is beautiful? Where am I loving someone without calculating the return? Where am I learning something that will never appear on a performance review?

  Keynes hoped that for our grandchildren, the economic problem would be solved, and we would return to the "principle of love." We are not there yet. You are entering the workforce at a time of great uncertainty, where the "little longer still" of necessity might feel like a very long time indeed.

  That makes your task harder, but also more vital. If economists forget the ends of life, who will remember them? If the people who understand the machinery of the world do not also value the people living inside it, the machinery will run us over.

  Go forth and be purposive when you must. Build your security. Manage your risk. But remember that you are not an agent in your own utility function. You are the end.

  Secure the "little longer still," yes. But do not wait until the end of it to start living.

  Thank you.
