answer: |-
  **STATE GAMING CONTROL BOARD**
  **OFFICE OF ADMINISTRATIVE HEARINGS**

  **IN THE MATTER OF THE PETITION OF**
  **[PETITIONER NAME]**
  **FOR REMOVAL FROM THE**
  **INVOLUNTARY EXCLUSION PROGRAM**

  **Case No:** 2024-SEP-089
  **Date:** October 24, 2024
  **Panel:** Administrative Appeals Division

  **WRITTEN DECISION AND ORDER**

  **I. PROCEDURAL HISTORY AND FINDINGS OF FACT**

  1.  On [Date, 11 years ago], the Petitioner voluntarily executed a Lifetime Self-Exclusion Agreement pursuant to State Gaming Act § 404(b). At the time of execution, the Petitioner was twenty-six (26) years of age.
  2.  The Agreement expressly stated that the exclusion was irrevocable and that violation would constitute criminal trespass.
  3.  On [Date], the Petitioner filed a Petition for Release, citing sustained recovery, gainful employment, and a material change in life circumstances.
  4.  The Panel finds by clear and convincing evidence that the Petitioner has maintained continuous employment for the past eight (8) years, has no recorded attempts to enter licensed facilities during the exclusion period, and has provided corroborating testimony from third-party witnesses regarding lifestyle stability.
  5.  The Panel further finds that eleven (11) years have elapsed since the execution of the Agreement, representing a duration significantly exceeding the typical cycle of acute addiction volatility.

  **II. ANALYSIS AND CONCLUSIONS OF LAW**

  **A. The Tension Between Precommitment and Rehabilitation**

  The central legal and ethical question before this Panel is the interpretation of the regulatory standard: whether "circumstances have changed such that continued exclusion no longer serves the petitioner's interest."

  The Petitioner's counsel argues that the regulatory language mandates a utilitarian assessment of the Petitioner's current welfare. Conversely, the State argues, consistent with decision-theoretic principles regarding precommitment devices, that the efficacy of the Self-Exclusion Program relies on its resolute nature. If the Board grants release based solely on a petitioner's current desire to be released, the Program risks becoming a "revolving door," validating preference reversals that the contract was specifically designed to prevent. In this view, a self-exclusion list that permits exit upon request functions not as a shield against compulsion, but as a temporary barrier that a compromised agent can simply pay to lower.

  The Panel acknowledges the weight of this argument. A policy that treats a Lifetime Self-Exclusion Agreement as a temporary subscription undermines the integrity of the Gaming Control Board's protective mechanisms. If the "Ulysses Pact" is to have meaning, the agent binding themselves must anticipate that their future self may lack the capacity to unbind them. To grant release based merely on a sincere assertion of recovery is to privilege the "hot state" preference of the moment over the "cool state" deliberation of the past.

  However, the Panel cannot accept the proposition that the "past self" holds absolute sovereignty over the "future self" in perpetuity. The regulation explicitly contemplates the possibility of changed circumstances. The decision-theoretic objection holds strongest when the agent remains fundamentally the same entity experiencing a temporary fluctuation in willpower. It holds less force when the passage of time and evidence suggest a structural transformation of the agent's identity and capacities.

  Eleven years is not a mere fluctuation. It is a distinct epoch. To deny release solely on the basis of the original signature would be to treat the Petitioner not as a recovering citizen, but as the legal property of his past addiction. The Board's interest is in preventing harm, not in enforcing penance. Where the harm the contract sought to prevent (compulsive gambling) is no longer present, the continued enforcement of the contract ceases to serve a protective function and becomes purely punitive.

  **B. The Standard for Release: Durability vs. Desire**

  To reconcile the regulatory mandate with the necessity of binding precommitment, the Panel establishes the following standard for future petitions of this nature:

  1.  **Mere Desire is Insufficient:** A petitioner's sincere desire to gamble, or sincere belief in their own recovery, is not sufficient evidence of changed circumstances. This guards against the "money pump" dynamic where an agent cycles between exclusion and inclusion based on transient impulses.
  2.  **Evidence of Structural Change:** Release requires objective, external evidence that the petitioner's *capacity* for choice has been restored. This includes long-term stability (employment, housing), absence of related legal issues, and third-party verification.
  3.  **Risk Mitigation:** Because the risk of preference reversal can never be fully eliminated, release should not be binary (banned vs. unrestricted). A graduated reintegration respects the gravity of the original pact while acknowledging the possibility of rehabilitation.

  **III. ORDER**

  Based on the foregoing, the Panel finds that the Petitioner has met the burden of proof under the governing regulation. However, to honor the serious nature of the original precommitment and to mitigate the risk of immediate relapse, the Panel orders a **Conditional Release with Probationary Monitoring.**

  **IT IS HEREBY ORDERED:**

  1.  **Probationary Period:** The Petitioner is removed from the Lifetime Self-Exclusion List, subject to a twenty-four (24) month probationary period commencing on the date of this Order.
  2.  **Wagering Limits:** During the probationary period, the Petitioner is restricted to a maximum wagering limit of $[Amount] per day and is prohibited from obtaining credit or markers at any licensed facility.
  3.  **Reporting Requirement:** The Petitioner shall submit to quarterly reviews with the Board's Responsible Gaming Division. Failure to attend or provide truthful information shall result in immediate reinstatement to the Lifetime List without further hearing.
  4.  **Reinstatement Clause:** Should the Petitioner be found on the premises of a licensed facility for the purpose of gambling while in a state of intoxication, or should the Petitioner file for bankruptcy attributable to gambling losses during the probationary period, the original Lifetime Self-Exclusion Agreement shall be automatically reinstated.
  5.  **Finality:** Upon the successful completion of the twenty-four (24) month period, all restrictions shall be lifted, and the Petitioner shall be restored to full standing as a patron of licensed gaming establishments.

  **IV. CONCLUSION**

  This decision does not negate the validity of self-exclusion contracts. Rather, it affirms that such contracts are instruments of health and safety, not indelible tattoos. The Board respects the Petitioner's past decision to bind himself as an act of survival. We respect his current petition to unbind himself as an act of recovery. By conditioning this release on a verified period of stability, we ensure that the exit door is not opened by the hand of addiction, but by the hand of the restored citizen.

  **SO ORDERED.**

  __________________________
  **Administrative Law Judge**
  **State Gaming Control Board**

  **CONCURRING/DISSENTING OPINIONS:**
  *None.*
