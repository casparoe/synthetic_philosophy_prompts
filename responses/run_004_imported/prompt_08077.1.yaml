answer: |-
  Here are 10 interview questions designed to press past the standard exposition of Functional Decision Theory (FDT), including the specific topics you requested and targeted follow-ups for common evasions.

  **1. The "Tax" on Rationality**
  Standard Causal Decision Theory (CDT) agents lose money in Newcomb's Problem and Parfit's Hitchhiker. You argue FDT agents win because they act as the output of a decision function rather than a specific instance. But isn't there a cognitive tax to being an FDT agent? In the real world, calculating the "subjunctive dependence" between your choice and a predictor's simulation seems computationally expensive compared to just looking at physical causality. Are you arguing for a rationality that is only viable for agents with infinite compute?
  *   **Follow-up:** If he says *"Rationality isn't about computation cost, it's about outcomes,"* press him: "But if the algorithm required to achieve the outcome is too complex to run, isn't it practically irrational? At what point does the overhead of FDT negate the winnings?"

  **2. The Imperfect Predictor (Required)**
  Let's look at Parfit's Hitchhiker where the driver is an imperfect predictor—say, right 9 times out of 10. In CDT, the math for paying is straightforward based on conditional probability. In FDT, you pay because your decision *logically* determines the prediction. But as accuracy drops, that logical link weakens. Is there a specific threshold of accuracy where FDT flips and tells you *not* to pay? Or is it a smooth gradient?
  *   **Follow-up:** If he says *"It's a smooth gradient,"* ask: "If it's a gradient, then at the margin, FDT collapses into CDT. Doesn't that admit that 'controlling the past' is just a metaphor for high-confidence statistical correlation, rather than a distinct metaphysical mechanism?"

  **3. The Metaphysics of Control (Required)**
  I need you to spell out the mechanics of "control." When I am sitting in town, the driver's prediction is already in the bank. The event is in my past light cone. To say my current choice "controls" that past event sounds like backward causation. You call it "subjunctive dependence," but physically, where does this connection live? How do I manipulate a variable that has already been fixed?
  *   **Follow-up:** If he says *"It's logical, not physical,"* push back: "Logic is a map, not the territory. A logical correlation doesn't move money. If there is no physical mechanism transmitting my choice to the past, aren't you just asking me to engage in a magical ritual that *feels* like it influences the past?"

  **4. Kavka's Toxin Puzzle (Required)**
  In Kavka's Toxin Puzzle, you are rewarded for *intending* to drink a toxin, not for actually drinking it. CDT says you can't rationally intend to drink it because you'll have no reason to once paid. FDT says you can commit. But in Hitchhiker, you actually *pay* the money. In Toxin, you actually *spit it out*. If committing to pay in Hitchhiker is rational because it makes you the "type who pays," why isn't committing to drink the toxin rational because it makes you the "type who drinks"? Where is the hard line between a rational pre-commitment and a self-delusion you plan to break?
  *   **Follow-up:** If he says *"Toxin is about intention, Hitchhiker is about action,"* counter: "But the reward in Toxin is based on the *source* of the intention. If FDT allows me to select the source code that generates the intention, why can't I select the source code that generates the intention *and* the follow-through, then hack it later?"

  **5. The Reference Class Problem**
  FDT relies on me identifying with a "decision function." But I am not identical to the simulation the driver ran. I am flesh; the simulation was code. I am in town; the simulation was in the car. How similar must the predictor's model be to me for FDT to apply? If the driver predicts me using a crude heuristic rather than a perfect simulation, does the "logical control" vanish? Who defines the reference class of "me"?
  *   **Follow-up:** If he says *"It depends on the similarity,"* ask: "Doesn't that introduce a subjective loophole? If I can arbitrarily decide my simulation is 'too different' from me, can't I use FDT to justify defecting whenever it's convenient?"

  **6. Post-Decision Regret**
  A key test for decision theories is whether the agent feels regret after the fact. A CDT agent in Newcomb's Problem regrets not one-boxing. An FDT agent supposedly doesn't. But in Hitchhiker, once I am safely in town, the money is gone and the ride is over. The prediction is fixed. I now have zero causal power over the driver's payout. Why shouldn't an FDT agent look at the $100 leaving their wallet and feel genuine regret that they threw away money for a cause that was already settled?
  *   **Follow-up:** If he says *"They don't regret it because they won,"* ask: "But they only 'won' by the metric of the pre-trip self. From the perspective of the post-trip self, they are strictly poorer than a CDT agent who would have kept the money. Which self's utility function counts?"

  **7. Evolution and Emotions**
  Humans often pay in Hitchhiker-like scenarios because of emotions like guilt or honor. Evolution selected for these emotions because they solve commitment problems. Is FDT actually a new theory, or is it just a formalized mathematical description of what human emotions have been doing for millennia? If evolution already solved this with visceral feelings, what work is FDT actually doing?
  *   **Follow-up:** If he says *"FDT formalizes it for AI,"* ask: "Then isn't FDT essentially a prescription to build AI with artificial 'emotions' or hard-coded constraints? Why call it 'decision theory' rather than 'constraint engineering'?"

  **8. Blackmail and Extortion**
  FDT proponents argue that FDT agents are harder to blackmail because they won't pay out to protect secrets. But if I know you are an FDT agent, I know you won't pay. So I simply never blackmail you. However, if I'm a irrational blackmailer who doesn't know your theory, I might try. Does FDT make you a target for those who don't understand the theory? Is being an FDT agent an information hazard?
  *   **Follow-up:** If he says *"FDT agents signal their nature,"* ask: "Signaling works on rational actors. But most threats come from irrational or desperate actors. Doesn't FDT leave you vulnerable to the very people who don't care about decision theory?"

  **9. AI Alignment Implications**
  If we build AGI, should it be an FDT agent? If an FDT AI interacts with a CDT human, the AI might expect the human to act as a function of the AI's decision, but the human won't. Does this create a mismatch where the AI makes suboptimal sacrifices expecting reciprocity that a CDT human is incapable of giving?
  *   **Follow-up:** If he says *"We should build humans to be FDT,"* ask: "That sounds like social engineering. Are you arguing that for FDT to work, the entire ecosystem of agents needs to adopt it? Is FDT stable in a mixed population?"

  **10. Falsification (Required)**
  Finally, let's talk about evidence. Critics say FDT is unfalsifiable philosophy because it redefines "rationality" to match its conclusions. What empirical observation, what real-world scenario, or what mathematical proof would actually convince you that FDT is wrong and CDT is right? If there is no scenario where FDT says "I lost," how is this science?
  *   **Follow-up:** If he says *"It's normative, not descriptive,"* press: "Normative theories still have to map to reality to be useful. If a normative theory consistently recommends actions that result in less physical resources in a causal universe, isn't it normatively wrong? What reality-check exists for your theory?"
