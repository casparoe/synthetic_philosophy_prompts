      *   **Constraint 2:** Don't let the interviewee just re-explain the setup (avoid basic exposition).
      *   **Constraint 3:** Specific required topics:
          *   Imperfect prediction (90% accuracy).
          *   The metaphysics/mechanics of "controlling" a past prediction.
          *   Comparison to Kavka's Toxin Puzzle.
          *   Ending question: What evidence would prove FDT wrong?
      *   **Constraint 4:** Each question needs a follow-up keyed to a likely dodge/evasion.
      *   **Tone:** Professional, probing, intellectually rigorous, suitable for a publication about science and ideas.

  2.  **Deconstruct Functional Decision Theory (FDT):**
      *   *Core Claim:* Agents should act as the output of a decision function, not as a specific instance in time. This allows for "subjunctive dependence" between the agent's choice and a predictor's simulation.
      *   *Key Cases:* Newcomb's Problem, Parfit's Hitchhiker, Prisoner's Dilemma (vs. CDT/EDT).
      *   *Common Criticisms:* "Magic," backward causation, confusion about logical vs. physical causation, difficulty defining the "reference class" of the decision function.
      *   *Key Proponents:* Eliezer Yudkowsky, Nate Soares (MIRI).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Hook/Foundations.* Need to start strong without asking "What is FDT?" Let's ask about the *cost* of this rationality.
          *   *Draft:* Why should I care about FDT?
          *   *Refinement:* Focus on the "tax" on rationality. CDT agents lose money in Newcomb. FDT agents win. But is there a cost?
          *   *Follow-up:* If he says "No cost," push on the cognitive burden of defining the function.

      *   *Question 2: Imperfect Prediction (Required).*
          *   *Draft:* What if the driver is only 90% accurate?
          *   *Refinement:* Make it specific. At what threshold does FDT collapse into CDT? Is there a cliff edge?
          *   *Follow-up:* If he says "It's continuous," ask about the math of the break-even point vs. the categorical shift in reasoning.

      *   *Question 3: Controlling the Past (Required).*
          *   *Draft:* How do you control the past?
          *   *Refinement:* Use the word "subjunctive." How do you distinguish this from magic? The prediction is *already* in the bank.
          *   *Follow-up:* If he says "Logical correlation," ask for a physicalist account of where that correlation lives.

      *   *Question 4: Kavka's Toxin (Required).*
          *   *Draft:* Why is Toxin different?
          *   *Refinement:* In Toxin, you get paid for *intending*, not drinking. In Hitchhiker, you pay for *being the type who pays*. Where is the line? Why can't I intend to drink and then not?
          *   *Follow-up:* If he says "Toxin is about intention, Hitchhiker is about action," push on the *source* of the intention.

      *   *Question 5: The Reference Class Problem.* (Good additional technical question).
          *   *Draft:* How do you define the function?
          *   *Refinement:* If I tweak my code slightly, am I still the same function? Does FDT require agents to be identical copies?
          *   *Follow-up:* If he says "Similar enough," ask who decides the similarity metric.

      *   *Question 6: Evolution/Biology.* (Connecting to real world).
          *   *Draft:* Do animals do this?
          *   *Refinement:* Evolution selects for outcomes. Does FDT describe how humans actually evolved to behave (emotions as pre-commitment)?
          *   *Follow-up:* If he says "Yes," ask why we need a new theory if evolution already solved it.

      *   *Question 7: Blackmail/Extortion.* (A known weakness/feature of FDT).
          *   *Draft:* What about blackmail?
          *   *Refinement:* FDT agents are supposed to be hard to blackmail. But doesn't that make them targets for *more* aggressive blackmailers who know the theory?
          *   *Follow-up:* If he says "No," ask about the information hazard of being known as an FDT agent.

      *   *Question 8: The "Why Now?" Question.*
          *   *Draft:* Why is this important today?
          *   *Refinement:* AI alignment. If we build AI, should it be FDT? What happens if an FDT AI meets a CDT human?
          *   *Follow-up:* If he says "AI needs FDT," ask if that makes AI exploitable by humans who understand CDT.

      *   *Question 9: The "Evidence" Question (Required Ending).*
          *   *Draft:* What proves you wrong?
          *   *Refinement:* FDT is often criticized as unfalsifiable philosophy. What empirical observation would force you to abandon it?
          *   *Follow-up:* If he says "It's normative," push that normative theories still need to map to reality to be useful.

      *   *Review against constraints:*
