      *   *Nuance on Marcus's Round 3:* Marcus says if apology fixes it, it's about honesty, not hypocrisy. That's a bit glib. Hypocrisy *is* often about the concealment of the violation. So Priya is actually defining hypocrisy more accurately than Marcus.
