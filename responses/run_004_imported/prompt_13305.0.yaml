      *   **Scenario:** Student Council President (Sam) criticized Member (Alex) for skipping a meeting. Sam previously skipped a meeting without admitting it.
      *   **Characters:** Priya (argues Sam lacks standing due to hypocrisy) vs. Marcus (argues hypocrisy doesn't negate the wrongness/standing, accuses Priya of *tu quoque*).
      *   **Task:** Analyze the argument round-by-round, determine who has the stronger argument at each step, identify missing nuances, and provide a final verdict on Sam's standing.

  2.  **Deconstruct the Arguments (Round by Round):**

