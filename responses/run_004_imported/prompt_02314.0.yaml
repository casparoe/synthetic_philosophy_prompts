answer: |-
  Here are three options ranging from dry to narrative. Since this is for a decision theory seminar, the humor relies on the tension between **Subgame Perfect Equilibrium (SPE)** and **experimental data**.

  ### Option 1: The "Lab Gap" (Best for your bonus points)
  *This one directly targets the gap between the theoretical prediction and experimental reality.*

  "I was running a Centipede Game in the lab yesterday. According to backward induction, Player 1 should defect at Node 1. But my subject passed. And passed. And passed.

  Finally, I leaned into the booth and whispered, 'Do you realize you're violating Common Knowledge of Rationality?'

  And the subject looked at me, pocketed the $50, and said, 'Yeah, but do you realize your equilibrium is the only one where I leave here broke?'"

  **Why it works:** It explicitly names "Common Knowledge of Rationality" (the engine of the paradox) but contrasts it with the actual payoff. It validates the audience's knowledge that the theory predicts poverty while "irrational" cooperation yields wealth.

  ### Option 2: The "Node 1" Social Defect
  *This one plays on the absurdity of applying the logic to real life.*

  "My date asked me where I saw our relationship going. I told her I'd solved for the Subgame Perfect Equilibrium.

  She asked, 'So, marriage?'

  I said, 'No. In a finite horizon game with Common Knowledge of Rationality, the only credible move is to defect at Node 1. So... I'm not buying the first round of drinks.'

  She left. Which, technically, confirms the model."

  **Why it works:** It highlights the self-fulfilling prophecy of the paradox (defecting ensures the bad outcome) and uses the "Node 1" terminology that will land immediately with this crowd.

  ### Option 3: The Short & Punchy (For a title slide)
  *If you just want one line to put on the screen while you talk.*

  "Backward Induction in the Centipede Game: The only mathematical proof that being 'rational' is just a fancy way of saying you're too smart to get rich."

  **Why it works:** It summarizes the entire paradox (Pareto inefficiency of the Nash Equilibrium) in a single sentence.

  ### Delivery Tips for a Seminar:
  *   **Don't rush the pause:** In Option 1, pause after "Common Knowledge of Rationality." Let the theorists nod, *then* hit them with the punchline.
  *   **Know your room:** If the room is full of experimentalists, go with **Option 1**. If it's pure theorists, **Option 3** might get a wryer smile.
  *   **The "lol":** Since you need this by tomorrow, Option 1 is the safest bet. It acknowledges that everyone in the room knows the theory is "wrong" in the lab, which creates immediate camaraderie.

  Good luck with the seminar! Hope the unraveling stops at a standing ovation.
