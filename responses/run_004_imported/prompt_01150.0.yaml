  There's a genetic condition on my dad's side of the family that you can get tested for, but even if it comes back positive there's nothing you can actually do differently, no treatment, no prevention, nothing changes. I keep going back and forth on whether to get tested anyway. My sister thinks I'm being silly for hesitating, her argument is that more information can never leave you worse off, at worst it's neutral, so theres no real reason not to know. That sounds pretty airtight but somethings still nagging at me about it. Am I missing something or is she just right?
