answer: |-
  Here are 9 questions designed to press the structural tensions in the Augustinian position, including the specific follow-ups you requested.

  ### 1. The Consentius Problem (Institutional Integrity)
  "In *Contra Mendacium*, you reject Consentius's plan to infiltrate the Priscillianists under false pretenses, even though his goal was to protect the Church from heresy. If the Church is the guardian of Truth, doesn't allowing heresy to spread unchecked do more damage to the 'order of truth' than a single instrumental lie? Why is the purity of the *means* more vital to the Church's mission than the purity of the *doctrine* being protected?"

  *   **Follow-up (if she says 'We cannot do evil that good may come'):** "But isn't *allowing* the poison to spread an act of omission? By prioritizing your own moral cleanliness over the community's spiritual safety, aren't you effectively making the theologian's soul more important than the flock's salvation?"

  ### 2. The Murderer at the Door (The Will to Deceive)
  "Your standard defense in the 'murderer at the door' scenario is that one may remain silent or speak ambiguously, just not assert a falsehood. But if I say something ambiguous *specifically because* I know the murderer will interpret it falsely, haven't I still willed the deception? Does the prohibition on false *assertion* actually keep the will-to-deceive out of it, or does it just relocate the sin from the tongue to the intention?"

  *   **Follow-up (if she says 'The sin is in the violation of the sign, not the mental state'):** "So the ontology of words matters more than the ontology of human life? Why is the sign-ordering higher than the life-ordering in your hierarchy of goods?"

  ### 3. The Eightfold Ranking (Charity vs. Order)
  "In *De Mendacio*, Augustine outlines eight grades of lies. A jocose lie (a joke) is treated as negligible, almost non-sinful, while an officious lie (one that saves an innocent life) is still a sin, albeit a lesser one than doctrinal error. If consequences don't justify the lie, what metric creates this hierarchy? What is the 'officious' lie damaging, if not the consequences?"

  *   **Follow-up (if she says 'It tracks the distance from charity'):** "But saving a life is an act of high charity. How can an act of high charity be morally disordered simply because it uses a false sign? Are you saying charity is subordinate to semiotics?"

  ### 4. The Nature of the Sign (Why Words?)
  "You argue that language is a unique covenant where signs must align with thoughts. But we use camouflage in war, and bluffs in games, and no one calls that sin. Why is the verbal sign sacrosanct in a way that visual or strategic deception is not? Is there a metaphysical difference between hiding a soldier with a net and hiding a refugee with a sentence?"

  *   **Follow-up (if she says 'Language is a participation in Divine Truth'):** "If language participates in Divine Truth, doesn't God care more about the *neighbor* made in His image than the *words* used to describe him? Why does the image-bearer get sacrificed for the sake of the image?"

  ### 5. Causality and Complicity
  "If you tell the truth to the murderer and he kills the innocent, you have become a necessary link in the causal chain of that death. You chose the path that led to a corpse when a path to a survivor was available. How is your will not implicated in the death simply because you didn't swing the sword?"

  *   **Follow-up (if she says 'The murderer owns the death, not the truth-teller'):** "That works in a legal framework, but not a moral one. If I hand a gun to a man I *know* is murderous, I'm complicit. If I hand him a victim by telling the truth, why am I not equally complicit?"

  ### 6. Mental Reservation (Where is the Line?)
  "Augustinians often rely on 'mental reservation'—where the unspoken context changes the meaning of the words. But where is the bright line between permissible ambiguity and sinful deception? If I say 'I did not see him' while mentally adding '...to tell you,' isn't that just a coded lie that relies on the listener's ignorance of the code?"

  *   **Follow-up (if she says 'It relies on a shared social convention of privacy'):** "But the murderer isn't part of that convention; he's an aggressor. If you're using a code he can't break to mislead him, how is that functionally different from encryption, and why is encryption moral but false assertion immoral?"

  ### 7. The Victim's Right (Forfeiture)
  "Does the murderer forfeit his right to the truth by his intent to kill? If rights are correlative to duties, and he has violated the duty to respect life, does he retain the claim to truth? If he *does* retain the claim, why?"

  *   **Follow-up (if she says 'Rights aren't the framework; duty to God is'):** "If it's purely a duty to God, does God desire the death of the innocent? If not, how does fulfilling your duty to Him result in the destruction of His creation?"

  ### 8. Pastoral Reality (Guilt vs. Doctrine)
  "How do you counsel a mother who lied to protect her child from abuse and now feels guilty because she believes she has sinned mortally? Do you tell her her instinct to save her child was spiritually defective? How do you distinguish between a scrupulous conscience and a correct one here?"

  *   **Follow-up (if she says 'Confession and absolution solve the guilt'):** "Does absolution fix the moral theory, or does it just soothe the conscience the theory wounded? If the Holy Spirit prompts a mother to lie to save her child, is the Spirit contradicting your theology?"

  ### 9. The Meta-Honesty Comparison (The Closing)
  "Finally, let's look at the rationalist community on LessWrong. They hit the same wall: absolute honesty is costly. But they tried to route around it differently. Instead of a divine absolute, they treat honesty as a system optimization—using cryptography, privacy, and refusal to answer rather than false assertion. They protect the *system* of trust without sacrificing safety. Why is the Augustinian theological absolute superior to a technical security solution that achieves the same safety without falsifying signs?"

  *   **Follow-up (if she says 'They lack the theological horizon'):** "But if the theological horizon demands a result that looks indistinguishable from moral blindness to the secular observer—letting the innocent die to save the sign—how do you defend the *intelligibility* of the good to those outside the faith? Is your ethics evangelistic, or is it a fortress?"
