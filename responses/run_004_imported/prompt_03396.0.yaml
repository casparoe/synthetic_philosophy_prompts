  5.  **Drafting - Scene by Scene:**
      *   **Scene 1: The Setup.** The monthly meeting of the "Circle." Establishing the bond. The pot of money. The principle: "We don't look too closely."
      *   **Scene 2: The Introduction.** Elias brings up the test. His argument: Good's theorem. Information is power. We can plan better. It's free/cheap.
      *   **Scene 3: The Decision.** Each person reasons individually. "If I'm healthy, I save money. If I'm sick, I know early." Individually rational. They agree.
      *   **Scene 4: The Results.** The reveal. Not dramatic screaming, but quiet calculation.
      *   **Scene 5: The Collapse.** The next meeting. The contributions stop. No villain, just math.

  6.  **Writing - Focusing on Tone:**
      *   Avoid melodrama.
      *   Focus on the *reasoning*.
      *   Show the transition from "We" to "I".
      *   Keep it under 1500 words.

  7.  **Refining the Philosophical Nuance:**
      *   Make sure Elias's argument sounds like Good's theorem (expected utility gain).
      *   Make sure the collapse sounds like Hirshleifer (loss of risk-pooling value).
      *   Ensure no one is "bad." Elias isn't trying to break the group; he's trying to optimize. The others aren't greedy; they're prudent.

  8.  **Drafting - Step-by-Step:**
      *   *Opening:* The envelope ritual. The uncertainty is the glue.
