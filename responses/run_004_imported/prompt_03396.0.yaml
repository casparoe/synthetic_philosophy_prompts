      *   **Tone:** Dramatic, earned ending, no moralizing.

  2.  **Deconstruct the Philosophical Core:**
      *   *Good's Theorem:* $E[U|look] \geq E[U|don't look]$. For a single agent, free information is always good because you can ignore it if it's bad, or act on it if it's good. You update your credences and maximize expected utility.
      *   *Hirshleifer's Effect:* Information changes the *distribution* of knowledge. If agents are risk-averse and pooling risk (insurance), knowing the outcome beforehand eliminates the risk. If you know you won't get sick, you don't buy insurance. If you know you will, the insurer won't sell it to you (or premiums skyrocket). The "pool" dries up. The value of the *arrangement* depends on the *uncertainty*.
      *   *The Conflict:* Individual rationality (look) vs. Collective stability (don't look).

  3.  **Brainstorming Settings:**
      *   *Idea 1: Fishing Crew.* Traditional risk pooling. If one boat knows where the fish are, they don't share. But Good's theorem applies to *consulting evidence*. Maybe a sonar device? If one has it, they defect. But the prompt wants the *group* to unravel because *everyone* looks.
      *   *Idea 2: Marriage/Prenup.* Too intimate/emotional, might drift into malice.
      *   *Idea 3: Village Harvest Insurance.* Classic Hirshleifer example. Farmers pool grain. If everyone knows exactly who will have a drought, the pool fails.
      *   *Idea 4: A Gambling Syndicate/Investment Club.* A group pools money to bet on uncertain outcomes. If they get perfect information, the bookie closes the shop, or the internal trust breaks because expected returns diverge.
