      *   *Dialogue:* Elias argues for transparency. "Ignorance is a tax."
      *   *Reaction:* Sarah, Mark, etc. They think: "If I'm clear, I pay less elsewhere."
      *   *The Turn:* The results come in.
      *   *The End:* The pot sits empty. The friendship remains, but the contract is dead.

