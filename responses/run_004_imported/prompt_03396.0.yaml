      Wait, Hirshleifer is about *insurance*. The value comes from *sharing risk*. If the risk is known, it's not insurance anymore.
      Let's stick to the **Medical/Health Mutual Aid**. It's the clearest example of risk pooling. A group of 10 friends who agree to cover each other's catastrophic medical costs instead of buying commercial insurance. They are young, healthy-ish.
      Enter: A new cheap genomic test that predicts susceptibility to a specific, costly condition with high accuracy.

  4.  **Character Development:**
      *   **Protagonist/Instigator:** Elias. Rational, data-driven. Wants to optimize.
