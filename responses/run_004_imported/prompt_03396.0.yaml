      *   **Topic:** The tension between I. J. Good's Theorem (value of information is non-negative for a single Bayesian agent) and Jack Hirshleifer's critique (information can be socially destructive in multi-agent settings by dissolving shared ignorance necessary for cooperation/insurance).
      *   **Task:** Write a short story (1000-1500 words).
      *   **Theme:** Hirshleifer side (information unraveling cooperation).
