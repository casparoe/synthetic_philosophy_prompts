answer: |-
  The envelopes sat in the center of the oak table, unsealed. Inside each was a check for five hundred dollars, the monthly contribution to the Compact. For four years, the five of them had lived by this ritual. They were freelancers—graphic designers, coders, a copywriter—bound by the precarious economics of gig work. The Compact was simple: if anyone went more than two months without income, the pot covered their rent. No questions asked. No audits.

  The system relied on a specific kind of blindness. They knew the aggregate risk—that statistically, one of them might crash while the others floated—but they did not know the individual trajectory. That ignorance was the glue. It allowed them to treat the money as *ours* rather than *mine helping yours*.

  Elias pushed his envelope aside. He was the oldest, the most data-driven, and tonight he had brought a brochure.

  "I've been reading about this new biomarker panel," Elias said, tapping the glossy paper. "Predictive health analytics. It costs about two hundred bucks. It tells you your likelihood of major incapacitating illness over the next twenty-four months with eighty-five percent accuracy."

  Mara, a coder who handled the Compact's spreadsheet, looked up from her wine. "Health? Elias, this is for income insurance."

  "Health is income," Elias said. His voice was calm, the tone of someone explaining a proof. "If I know I'm likely to get sick, I can pivot. I can save more now. I can buy specific coverage. If I know I'm healthy, I can invest aggressively. Information has non-negative expected utility. Good's theorem. It's never rational to ignore free evidence."

  "It's not free," David muttered. "Two hundred dollars."

  "Cheap compared to ruin," Elias countered. "And think about the Compact. If we all know our risk profiles, we can adjust contributions. Fairness, right? Why should I subsidize David if his biology says he's going to crash in six months?"

  David stiffened. He had been quiet all evening.

  Mara frowned. "The point of the Compact is that we don't know. That's why it's insurance."

  "That's why it's charity," Elias corrected gently. "I'm talking about sustainability. If we optimize individually, the group becomes more resilient. We stop bleeding money on lost causes."

  It was a perfect argument. Individually, no one could refute it. To refuse the test was to choose ignorance over clarity, to accept a lower expected utility for oneself. To say *I don't want to know if I'm going to get sick* was irrational. To say *I don't want to know if I'm subsidizing a lost cause* was financially imprudent.

  Jen, the copywriter, picked up the brochure. "If I know I'm safe, I could lower my premiums elsewhere. Save money."

  "Exactly," Elias said. "We all win."

  They voted. It was unanimous. To vote otherwise would be to admit to a fear of knowledge, a superstition. They were rational agents; they optimized.

  ***

  The results arrived digitally, staggered over three days.

  Elias got his first. Low risk. High stability. He felt a surge of vindication. He had been right. Knowledge was power. He ran the numbers on his personal spreadsheet. If he stayed in the Compact, he was effectively donating money to higher-risk peers. His expected return on contribution was negative. He wasn't buying insurance; he was buying a liability.

  Mara got hers next. Moderate risk. She looked at Elias's message in their group chat: *Green across the board.* She did the math. If Elias opt-out, the pool shrinks. If she stays, she's carrying more weight. She thought about her mortgage. She thought about the principle of total evidence. She had the evidence. To ignore it would be malpractice.

  David's result came on a Tuesday. High risk. Significant probability of incapacitating back failure within eighteen months.

  He stared at the screen. Before the test, he had been a member of the pool. His risk was abstract, distributed among five people. He was one-fifth of a problem. Now, he was a specific problem. He was a line item labeled *Likely Default*.

  He called Elias. "So, what happens now?"

  "We meet," Elias said. "We renegotiate."

  "Renegotiate what? You know I'm going to need the money."

  "We know there's a probability," Elias said. "We can adjust. Maybe you pay less now, but we set aside a reserve..."

  "Or maybe I just buy my own policy," David said. He knew he couldn't. The commercial insurers would see the same data. He was uninsurable. The test hadn't just revealed his health; it had revealed his market value. It was zero.

  ***

  The next meeting was held in the same dining room. The envelopes were there, but only three of them.

  Elias sat with his hands clasped. He looked tired. The rationality remained, but the comfort had evaporated. "I've run the simulations," he said. "With the new data, the risk pool is fragmented. The correlation between individual risk and payout is too high. We aren't pooling risk anymore; we're pre-paying known costs."

  "So the Compact is done," Jen said. She hadn't brought an envelope. Her result had been low risk. She had already signed up for a cheaper, private plan that excluded pre-existing conditions revealed by the test. She was rational. She had maximized her utility.

  "I can stay," David said. "I'll pay double."

  "You can't afford double," Mara said softly. "And if you pay double, you're not insured. You're just saving money in a box labeled 'Compact.' I might as well keep my own savings."

  "It's Hirshleifer's effect," Elias said, almost to himself.

  "What?"

  "Nothing," Elias said. "Just... the value of the information was positive for each of us individually. I saved money. Jen saved money. David knows to plan for disability. We all improved our individual positions."

  "And the group?" David asked.

  "The group value is zero," Elias said. "The information destroyed the surplus."

  They sat in silence. The tragedy wasn't that they had turned on each other. There was no malice. No one had cheated. They had all simply followed the mandate of rationality: *Update your credences. Maximize expected utility. Look before you leap.*

  But by looking, they had dissolved the fog that allowed them to walk together. Before the test, David's potential illness was a shared shadow, light enough for five people to carry. Now it was a solid weight, and it belonged entirely to him. The others couldn't help him carry it without violating their own rational mandates. To help him now was not insurance; it was charity. And while they were friends, they were not charities. They were agents.

  "I'll write a check," David said. "For this month. To close it out."

  He wrote it. The others matched it, not out of obligation, but out of habit. The pot was full, but it was dead capital. There was no uncertainty left to insure against. They knew too much.

  Elias picked up his envelope. He felt the crisp paper. He thought about Good's theorem, about the proof that looking is always weakly rational. It was true. He was better off. They were all better off, individually.

  "We should eat," Mara said. "I made lasagna."

  They ate. They talked about movies, about vacations, about anything that didn't involve the future. They were still friends. But the mechanism that had bound them—the shared ignorance, the comfortable blindness—was broken. They had opened the biopsy results, just as the joke went. They knew exactly what was wrong. And now, they had to live with the cure being worse than the disease.

  When they left, they didn't schedule the next meeting. There was no need. The uncertainty was gone, and with it, the reason to return.
