  6.  **Refining Answers and Follow-ups:**
      *   Ensure Turing's answers reflect the 1950 paper's logic, not modern hindsight. He treats ESP as a *possibility* that must be controlled for, not necessarily a *truth* he worships.
      *   The follow-ups need to be the "novelist's gold"—the moment the character pushes back.

  7.  **Review against Constraints:**
