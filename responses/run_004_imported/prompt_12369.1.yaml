          *   **Harrys and Edwards:** Medieval England (12th-15th century). A time perceived as economically simpler/poorer in terms of circulating coin.
          *   **Water Level:** Communicating vessels. Physics analogy. Equilibrium. It's not just restating; it implies an *automatic physical force* (gravity/pressure) rather than human policy.

      *   *Step-by-Step Mechanics (The "Code Logic"):*
