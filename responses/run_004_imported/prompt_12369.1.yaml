      *   *Modern Applicability (The "Gotcha"):*
          *   Hume assumes a metallic standard (fixed exchange rates effectively).
          *   Today: Floating rates. If money supply drops, currency *value* drops (exchange rate), not necessarily domestic prices immediately.
          *   The mechanism still exists but operates through *exchange rates* as much as *price levels*.
