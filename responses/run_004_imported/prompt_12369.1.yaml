  2.  **Deconstruct Hume's Argument (The Price-Specie-Flow Mechanism):**
      *   *Premise 1:* Money supply determines price levels (Quantity Theory of Money). More money = higher prices; Less money = lower prices.
      *   *Premise 2:* Trade flows respond to price differentials. Cheaper goods export better; expensive goods import better.
      *   *Premise 3:* Trade balances settle in money (gold/silver). Surplus = money in; Deficit = money out.
      *   *Scenario A (Annihilation):* Money $\downarrow$ $\rightarrow$ Prices $\downarrow$ $\rightarrow$ Exports $\uparrow$ / Imports $\downarrow$ $\rightarrow$ Trade Surplus $\rightarrow$ Money flows in $\rightarrow$ Money supply restores.
      *   *Scenario B (Multiplication):* Money $\uparrow$ $\rightarrow$ Prices $\uparrow$ $\rightarrow$ Exports $\downarrow$ / Imports $\uparrow$ $\rightarrow$ Trade Deficit $\rightarrow$ Money flows out $\rightarrow$ Money supply restores.
      *   *The "Why":* It's about *competitiveness*. If you are poor (low money), your labor is cheap. Foreigners want your stuff. They pay you in money. You get richer until you aren't cheap anymore.

  3.  **Address the Specific Confusions:**
      *   *Why not permanently poorer?* Because "poorer" in terms of money stock means "cheaper" in terms of goods. The world wants cheap goods. Buying those goods brings money back.
      *   *Why not permanently richer?* Because "richer" in money stock means "expensive" goods. The world stops buying your stuff and sells you theirs. Money leaves to pay for imports.

