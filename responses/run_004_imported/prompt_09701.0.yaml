          *   *Verdict:* Strong historically, but many find it obscure or merely verbal.
      *   *Russell (Multiple Relation Theory):* Judgement isn't a binary relation between subject and proposition, but a multiple relation between subject and constituents. Dissolves the proposition as a unit.
          *   *Critique:* Russell abandoned it himself. Wittgenstein famously critiqued it (color exclusion problem). It avoids the regress by denying the unity exists *before* judgement.
          *   *Verdict:* Historically significant, but generally considered a failure or a retreat.
      *   *Armstrong (States of Affairs + Non-relational Tie):* States of affairs are fundamental. Instantiation is not a relation but a "non-relational tie."
