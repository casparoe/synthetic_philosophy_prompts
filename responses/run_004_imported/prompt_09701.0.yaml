      *   *Bradley's Regress:* The problem is that if a particular $a$ has a property $F$, we need a relation of instantiation ($I$) to connect them ($I(a, F)$). But then we need a relation to connect $I$ to $a$ and $F$ ($I'(I, a, F)$), ad infinitum. The proposition lacks unity.
      *   *Frege (Unsaturated Concepts):* Concepts are inherently incomplete/unsaturated. Objects fill the gap. No extra glue needed.
