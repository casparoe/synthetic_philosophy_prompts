  2.  **Determine the Core Message:**
      *   *The Challenge:* How to grieve someone who, technically, still exists in the past temporal parts of their "spacetime worm."
      *   *The Trap:* Saying "she still exists" sounds cold or nonsensical to the family. Saying "she's gone" sounds false to the philosophers.
      *   *The Solution:* Focus on the *reality* of the past parts. She isn't "gone" in the sense of being erased. The moments of her life are fixed, real, and unchangeable parts of the universe's structure. Grief is the experience of reaching the end of the worm, but the worm itself remains.
      *   *Accessibility:* Use metaphors. A movie reel? A landscape? A life story? Let's go with the "landscape" or "path" metaphor, but keep it grounded in the "temporal parts" language without getting bogged down.
      *   *The Heraclitus Joke:* Needs to be gentle. "You can't step into the same river twice" -> Marion would say "No, but you can step into two different temporal parts of the same river-worm."

  3.  **Drafting - Section by Section:**

