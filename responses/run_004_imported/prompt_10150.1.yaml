answer: |-
  Thank you all for coming. Looking around this room, I see two distinct groups. In the front, I see colleagues who know Marion as the philosopher who could dismantle an argument about temporary intrinsics before the coffee had cooled. In the back, I see her sister, her nieces, and her neighbors, who know Marion as the woman who brought casseroles, told terrible jokes, and listened better than anyone I've ever known.

  Marion would have loved this split. She would have found it structurally elegant. But she also would have been terrified that I'm about to say something metaphysically sloppy in front of her. So, I'm going to try to walk a line she would have approved of: telling the truth about what happened, without lying about where she is.

  We are gathered to mark the end of Marion's life. But if we are being faithful to her work, we have to be precise about what "end" means.

  Marion was a perdurantist. For those of you who aren't philosophers, that's a specific way of understanding how things exist in time. The common view is that we are three-dimensional objects moving through time. We are wholly here now, and wholly gone later. Marion argued that this is wrong. She argued that we are four-dimensional beings. We are like long worms stretching through spacetime. Every moment of your life—your first breath, your tenth birthday, the moment you met your spouse, the moment you got sick—is a real, existing part of that worm.

  To the family: I know this sounds technical. But please hear the comfort in it. In Marion's view, the past is not a mist that fades. It is not just a memory in your head. The moments of Marion's life are fixed coordinates in the universe. They are as real as the chair you are sitting on. When you miss her, you are not chasing a ghost. You are looking back at a part of her that is permanently, indestructibly there. The laughter you remember at Sunday dinner? That is a real slice of Marion. It hasn't vanished. It is located at an earlier part of her path, and it is secure.

  She often used the puzzle of "temporary intrinsics" to explain this. How can one woman be straight-backed and vigorous in 1980, and bent and frail in 2024, and still be the same person? The endurantist says it's a mystery. Marion said it's simple: those are two different temporal parts of the same four-dimensional whole. The young Marion isn't gone; she's just located at a different temporal coordinate. The old Marion isn't a replacement; she's the final segment. Both are equally real. Both are equally *her*.

  Now, for my colleagues in the second row: I know Marion would be tapping her foot if I conflated this with standard eternalism. She spent thirty years correcting people who thought believing in the past was the same as believing time is an illusion. She hated the Einstein letter to Besso. She would tell us that calling time an "illusion" is lazy. Time is real, the parts are real, and the boundaries between them matter.

  She would also, inevitably, want me to address Heraclitus. We all know the quote: "You cannot step into the same river twice." Marion used to laugh at that. She'd say, "Of course you can't. You're trying to step into the same temporal part twice. That's a category error. But the river-worm is all there, from source to mouth."

  In that spirit, I want to say this: We cannot step into the same moment with Marion twice. We cannot call her on the phone. We cannot argue with her about the necessity of identity. That temporal part of the worm—the one where she is here, with us, in the present—is finished. It is the far edge of her shape. To deny that loss, to pretend she is "watching over us" or "in a better place," is to deny the reality of the boundary. Marion respected boundaries. She respected the truth of where things are located.

  So, how do we grieve a four-dimensional object?

  We grieve because we are three-dimensional creatures moving through time, and we have reached the coordinate where she is no longer alongside us. That pain is real. It is the pain of a traveler reaching the end of a path. But the path itself remains.

  To her sister and nieces: You do not need to understand spacetime geometry to know that what you shared with her is safe. Marion's metaphysics tells us that the universe does not delete its history. The hug she gave you last year, the advice she whispered at your wedding, the quiet way she sat with you when you were sad—those are not just neural firings in your brain. They are events in the fabric of the world. They are parts of Marion that nothing can touch or change. She is not wholly gone, because she was never wholly *here* in the present moment to begin with. She is spread out across every moment she ever lived.

  To my colleagues: We have lost the sharpest mind in the room. We have lost the person who would footnote our eulogies. But we have also lost a friend whose temporal parts we are privileged to have occupied.

  Marion taught us that persistence isn't about staying the same. It's about having parts that connect. It's about a structure that holds together from beginning to end. Her structure holds. The worm is complete. It has a beginning, a middle, and an end, and it is a beautiful shape.

  We are standing at the end of it now. It is quiet here. It is lonely here. But if we look back along the path she traced, we see a life that is fully real, fully present, and permanently hers.

  Thank you, Marion. For all the parts.
