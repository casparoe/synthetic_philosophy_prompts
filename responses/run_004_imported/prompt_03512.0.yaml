      *   *Jains (Anekāntavāda):* *Syādvāda* ("maybe" or "from a certain perspective"). *Saptabhaṅgī* (7 modes: is, is not, is and is not, inexpressible, is and inexpressible, is not and inexpressible, is and is not and inexpressible). Goal: Epistemological humility, acknowledging multiple valid perspectives on a complex reality. Logic is constructive and descriptive.
      *   *Key Distinction:* Ontology vs. Epistemology. Madhyamaka denies inherent existence; Jainism affirms complex existence.
