      *   *Did I mention Bayesianism?* Briefly, as it shifts the problem but doesn't fully erase it (prior selection).
      *   *Is the distinction between prediction and explanation clear?* This is key. ML cares about $P(Y|X)$, Philosophy cares about what $P$ *means*.

  8.  **Final Polish:** Ensure the distinction between *epistemic* probability (knowledge-based) and *ontic* probability (frequency-based) is clear, as RCP hits Frequentism hardest. (Decided to keep it focused on Frequentism since Reichenbach is a Frequentist).

  9.  *(Final thought)*: Make sure to explicitly mention Alan Hájek, as he wrote the definitive SEP article on this.

