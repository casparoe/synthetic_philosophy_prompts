answer: |-
  Good evening, everyone. For those of you I haven't met yet, I'm [Your Name]. I'm the senior PhD student in the lab, which in evolutionary time makes me roughly equivalent to a coelacanth.

  I was told that the traditional role of a toast like this is to construct a narrative. You know the kind: a stirring, linear account of how [Advisor's Name] possessed a visionary spark from childhood, how every grant rejected was actually a hidden blessing, and how every paper published was a deliberate step toward this exact evening. It is a story of perfect optimization. A story where every trait serves a function, and every function leads inevitably to glory.

  And I know, because I have seen her raise an eyebrow at less, that [Advisor's Name] would find that story scientifically unsound. It is, to use the technical term, Panglossian. It assumes we live in the best of all possible worlds where everything happens *for* a reason.

  But we know better. Or at least, this half of the room knows better. [Advisor's Name] has spent thirty-five years reminding us that not everything is an adaptation. Sometimes, you build an arch to hold up a dome, and you end up with a triangular space in between. The architects didn't design that space to hold mosaics. It's just a byproduct of the structure. A spandrel.

  Now, I know there are strict adaptationists in the room tonight. I see you. I promise I am not telling a "just-so story." I am not saying her career happened *by accident*. I am saying that her career is a testament to the beauty of the byproduct.

  There is a story I love, which [Advisor's Name] loves even more. Architectural purists will tell you that the spaces in San Marco are technically pendentives, not spandrels. For decades, critics have used this to poke holes in the Gould-Lewontin paper. But [Advisor's Name]? She delights in it. To her, the fact that the metaphor is architecturally flawed but biologically true is the whole point. It proves that we can find truth in imperfect structures. It proves that function often follows form, not the other way around.

  So, here is the joke I promised myself I'd make, and I hope she appreciates the precision of it: If we look at [Advisor's Name]'s career through her own lens, we have to admit that becoming a "Legend of Evo-Devo" was not the adaptation. It was the exaptation.

  She didn't set out to build a monument. She set out to ask difficult questions. She built a lab to house her curiosity. She built a tenure track to support her skepticism. The "Legacy" we are celebrating tonight? The hundreds of students, the paradigm shifts, the retirement dinner? That is the mosaic. That is the decoration we painted onto the structural necessities of her intellect. The career was the arch; the impact is the art we filled it with.

  For her family, who have heard the word "spandrel" at Thanksgiving since the Clinton administration: I know this sounds technical. But what she has been trying to tell you over the turkey is deeply human. She is saying that you don't need to have a perfect plan to have a beautiful life. You don't need to optimize every choice. Sometimes, you just build the best arch you can with the materials you have, and let the beauty emerge in the spaces between.

  She taught us that constraints are not limitations; they are the prerequisites for structure. She taught us that being wrong about the name of the arch doesn't mean you're wrong about the building. And she taught us that while natural selection is powerful, it is not a designer. It is a tinkerer.

  [Advisor's Name], you have been a magnificent tinkerer. You have shown us that a flawed metaphor can carry a true argument, and that a career built on questioning design can result in something that looks remarkably designed.

  So, I ask you all to raise your glasses.

  To the constraints that shaped us. To the byproducts that surprised us. And to [Advisor's Name], whose career proves that you don't need to be an adaptation to be essential.

  Cheers.
