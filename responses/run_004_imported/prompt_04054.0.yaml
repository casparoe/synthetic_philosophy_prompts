answer: |-
  First, welcome to the rabbit hole. It is a delight to discuss this with someone who has spent a career grappling with actual uncertainty rather than just philosophical toy models. Your intuition is sharp, and your analogy is not only coherent, it touches on a connection that decision theorists and statisticians don't make often enough.

  To answer your specific questions: No, you haven't mangled the Counterfactual Mugging (CM) setup significantly, and yes, there is genuine decision-theoretic work being done by the "updateless" label here, though it requires distinguishing between the *mechanism* of enforcement and the *justification* of the rule.

  Here is a breakdown of where your analogy holds, where it diverges, and how to distinguish UDT from garden-variety precommitment in this context.

  ### 1. The Setup: Did you mangle Counterfactual Mugging?

  Your recollection is functionally correct for the purpose of your essay, but for precision's sake:
  *   **The Setup:** Omega flips a fair coin.
  *   **Tails:** Omega asks you for $100.
  *   **Heads:** Omega gives you $10,000 **if and only if** it predicted that, *had the coin come up Tails*, you would have given it $100.
  *   **The Tension:** If you are on the Tails branch, the Heads branch is counterfactual. Causal Decision Theory (CDT) says: "The coin is already Tails. Paying $100 gains me nothing. Keep the money." UDT says: "I want to be the type of agent that pays, because that policy wins $4,950 in expectation across the coin flip."

  You captured the essence perfectly: the conflict between **ex-post rationality** (maximizing utility given what I know *now*) and **ex-ante rationality** (maximizing utility given what I knew *before*).

  ### 2. UDT vs. Ordinary Precommitment (Ulysses)

  This is the crux of your question. Is pre-registration just tying yourself to the mast (Ulysses), or is it updateless reasoning?

  **The Mechanism is Precommitment; The Justification is Updateless.**

  *   **Garden Variety Precommitment (Ulysses):** I know my future self will have different incentives than my current self. I physically restrict my future options.
      *   *In Trials:* Journals reject post-hoc endpoint changes. Your reputation suffers if you p-hack. This is a causal constraint on your future actions.
  *   **Updateless Decision Theory:** I reason that my decision *now* determines the output of my decision algorithm in counterfactual worlds where I observe different things. I don't bind my future self; I simply *am* an agent whose policy is fixed across all branches of possibility.

  **Where "Updatelessness" does real work in your analogy:**
  In a Ulysses scenario, I bind myself because I distrust my future preferences (I know I'll be tempted by the Sirens). In the clinical trial scenario, the statistician *should* theoretically want to find the truth in both the ex-ante and ex-post states. The temptation to switch endpoints isn't necessarily a "change in values," but a change in **information**.

  When the data comes in "messy," the data provides evidence that a *different* endpoint would yield significance. A standard Bayesian updater might say, "Given this data, Endpoint B is more likely to show an effect."
  The Pre-registered (Updateless) Statistician says, "I am ignoring the information this data gives me about which endpoint is 'winning,' because my policy was selected to maximize truth-tracking across the **ensemble of all possible data realizations**, not just this one."

  That is the UDT move. You are refusing to condition your *policy choice* on the observation, even though you condition your *belief* on the observation. You are optimizing the **algorithm** (the trial protocol), not the **output** (the specific p-value).

  So, to your point: "Nobody thinks trial statisticians literally forget they've seen the data." Correct. But UDT doesn't require amnesia. It requires that the *decision rule* was selected without conditioning on the specific observation, and that you stick to it *because* it was selected that way.

  ### 3. Where the Analogy Shines (and the "Omega" of Science)

  The strongest part of your essay is the identification of the **Ex-Ante Expectation**.

  In Counterfactual Mugging, Omega rewards the *policy*, not the *action*.
  In Clinical Trials, "Nature" (or the Scientific Community/Replication) rewards the *procedure*, not the *result*.

  If you p-hack (deviate from the pre-registered plan on the Tails branch), you might get a publication (the $10,000). But you have corrupted the Type I error rate of the scientific literature. The "Omega" here is the long-run frequency properties of the scientific method.
  *   **CDT Statistician:** "The data is what it is. I'll find the p<0.05 hidden in here." (Local optimization, global degradation).
  *   **UDT Statistician:** "I will follow the plan that guarantees a 5% false positive rate across all possible trials, even if this specific trial yields a null result." (Global optimization, local sacrifice).

  Your analogy correctly identifies that pre-registration is a defense against **selection bias**, which is structurally identical to the problem UDT solves: how to prevent your decision from being corrupted by information that is logically correlated with the outcome but causally downstream of the policy selection.

  ### 4. Where the Analogy Diverges (Logical vs. Statistical Correlation)

  If you want to be bulletproof against a sharp LessWrong reader, you should acknowledge one divergence.

  In CM, Omega's prediction creates a **logical correlation** between your action on Tails and the reward on Heads. Your decision *now* literally determines the past prediction.
  In Trials, there is no Omega. The "reward" (Truth/Replication) doesn't depend on a prediction of your behavior. It depends on the **frequentist properties** of your method.

  *   **CM:** If I don't pay, I *never* get the $10k (because Omega predicted that).
  *   **Trials:** If I p-hack, the drug might still actually work. I still get the $10k (publication), but the *value* of that money is degraded because the map no longer matches the territory.

  So, while the *reasoning structure* (Ex-Ante Policy Optimization) is identical, the *metaphysical mechanism* differs. CM relies on logical subjunctive dependence; Trials rely on frequentist error control. You might frame it as: **Pre-registration is the institutional implementation of Updateless Decision Theory for collective epistemic agents.**

  ### 5. A Note on TDT, UDT, and FDT

  Since you asked about the alphabet soup:
  *   **TDT (Timeless Decision Theory):** Focuses on the idea that your decision is a logical node that can be correlated with other nodes (like Omega's prediction).
  *   **UDT (Updateless Decision Theory):** Specifically focuses on the "don't update on your observations" aspect to solve problems like CM. It chooses a policy mapping *all possible observations* to actions, before seeing any observations.
  *   **FDT (Functional Decision Theory):** The modern synthesis (Yudkowsky/Soares). It subsumes both.

  For your essay, **UDT** is the precise term you want. The defining feature of pre-registration is that you choose the analysis plan *before* updating on the data. That is the definition of "Updateless."

  ### Summary Feedback for Your Essay

  1.  **Keep the Core:** The link between Ex-Ante Policy Selection and Pre-Registration is robust and insightful. It elevates pre-registration from "bureaucratic hurdle" to "epistemic necessity."
  2.  **Clarify the "Binding":** Acknowledge that while journals provide the *causal* binding (Ulysses), the *rationale* is updateless (preserving the integrity of the algorithm across the ensemble of possibilities).
  3.  **Refine the Mugging Description:** Just ensure you state that Omega predicts the *policy* (what you would do on Tails), not just the action.
  4.  **The "Omega" of Science:** Explicitly state that in science, the "reward" in the counterfactual branch is the **reliability of the literature**. If we all act like CDT agents on our specific data, the whole system collapses (the Replication Crisis). If we act like UDT agents, the system remains robust.

  You have stumbled onto a very solid philosophical defense of frequentist pre-registration using modern decision theory. It's not just a fancier name; it correctly identifies that the unit of optimization in science should be the *methodology*, not the *result*.

  Write it. It's a perspective the field needs.
