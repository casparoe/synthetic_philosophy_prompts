answer: |-
  The premise outlined in your question contains a significant historical and philosophical misconception. While it is true that Thomas Aquinas argued political authority exists for the common good and that a tyrant forfeits legitimate authority, **Aquinas explicitly rejected the conclusion that a private citizen may justly assassinate a tyrant.**

  Therefore, to answer your question accurately according to Aquinas's actual natural law theory: **Aquinas would condemn the act of a private citizen assassinating a dictator without public sanction.**

  Here is a detailed breakdown of why Aquinas holds this position, based on his texts *De Regno* (On Kingship) and the *Summa Theologiae*.

  ### 1. The Distinction Between Legitimacy and Execution
  Aquinas agrees with the first part of your premise: a ruler who governs solely for his own advantage rather than the common good is a tyrant, and his rule is unjust. In *Summa Theologiae* (II-II, Q. 42, A. 2), he notes that resisting such a regime does not necessarily constitute "sedition" (which is a sin against the unity of the multitude).

  However, Aquinas makes a crucial distinction between the *loss of legitimacy* by the ruler and the *right of execution* by the subject. Just because the tyrant is no longer a legitimate authority does not automatically grant every private individual the right to act as an executioner.

  ### 2. The Prohibition of Private Tyrannicide
  In *De Regno* (Book I, Chapter 6), Aquinas addresses the specific question of how to deal with a tyrant. He argues that it is **not for the presumption of private individuals** (*non est privatae praesumptionis*) to kill the tyrant.

  He offers several natural law-based reasons for this prohibition:
  *   **The Danger of Greater Evil:** Aquinas argues that private assassination often leads to greater instability. He cites the example of Julius Caesar, whose assassination led to worse turmoil and more cruel rulers. In natural law terms, if an action risks causing greater disorder than the evil it seeks to remedy, it violates the principle of pursuing the common good.
  *   **The Preservation of Order:** Natural law dictates that there must be order in human affairs. Allowing private citizens to judge and execute rulers undermines the very concept of public authority and invites anarchy.
  *   **The Example of the Apostles:** Aquinas notes that even under pagan persecutors, the Apostles urged Christians to be obedient to masters, suggesting that private violence is not the remedy for unjust rule.

  ### 3. The Role of Public Authority
  Aquinas does allow for the removal of a tyrant, but he insists it must be done through **public authority**, not private initiative.
  *   If the community originally had the right to elect the ruler, that same public authority (or its representatives) retains the right to depose him if he becomes a tyrant.
  *   If there is no human recourse, Aquinas suggests the people should turn to God, rather than taking violence into their own hands.

  ### 4. Application to the Modern Scenario
  Applying Aquinas's actual natural law theory to the scenario you described—a private citizen assassinating a dictator without sanction from a court, legislature, or foreign government—Aquinas would argue the following:

  1.  **The Act is Unjust:** Even if the dictator is evil, the private citizen lacks the *jurisdiction* to inflict capital punishment. In Aquinas's view, the power of the sword belongs to the public order, not private individuals.
  2.  **It Risks the Common Good:** The assassination would likely precipitate chaos, civil war, or a succession crisis, which violates the natural law imperative to preserve social peace and order.
  3.  **It Constitutes Sedition:** Paradoxically, while the tyrant is seditious against the common good, the private assassin is also seditious against the *order* of the community.

  ### Summary
  The view that "any citizen may justly kill" a tyrant is more closely associated with later Scholastics (such as Juan de Mariana in the 16th century) or Enlightenment thinkers (like John Locke), rather than Aquinas.

  **Aquinas's Verdict:** A private citizen who assassinates a dictator without public sanction acts contrary to natural law. While the tyrant is an aggressor against the common good, the private citizen becomes an aggressor against public order. For Aquinas, two wrongs do not make a right; the remedy for tyranny must come from public authority, not private violence.
