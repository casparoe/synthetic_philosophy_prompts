  **Move 1:** Sasha correctly identifies that cost is central to signaling theory but prematurely assumes financial expense alone satisfies the strict differential-cost requirement of the handicap principle.
  **Move 2:** Theo accurately clarifies the biological mechanism, noting that Zahavi's principle requires the cost to scale inversely with the signaler's quality, which fixed monetary costs do not inherently do.
  **Move 3:** Sasha successfully rehabilitates the hypothesis by shifting the cost domain to expected social utility, which genuinely varies based on the proposer's private confidence levels.
  **Move 4:** Theo rightly highlights confounding variables like social norms and alternative motives, though he slightly overstated the claim that any embarrassing act would function equivalently without established convention.

  **Closing:**
  Both participants treat the proposal primarily as a mechanism for revealing pre-existing private information (signaling), but they overlook its function as a commitment device that alters future incentives (bonding). A public display doesn't just signal that the proposer is currently committed; it activates social monitoring networks that raise the exit costs for *both* parties going forward, effectively locking in the relationship rather than merely advertising its quality. This distinction matters because a handicap signal is valuable only insofar as it is honest about the past, whereas a commitment device is valuable insofar as it secures the future.
