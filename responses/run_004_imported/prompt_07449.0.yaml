answer: |-
  Here are ten interview questions designed to press your guest on the continuity thesis, specifically tailored to avoid letting her rest on the "inheritance doesn't need permission" defense. Each includes a follow-up calibrated to pivot if she relies on that specific line of reasoning.

  ### 1. The Falsifiability Challenge
  "Your continuity thesis is compelling, but I want to press on its boundaries. If Rawls's mature work is structurally theological even when he explicitly disavows theology, what specific textual or historical evidence would actually count *against* your reading? Is there a document, a letter, or a draft chapter you could find that would force you to say, 'No, here the break is real'?"

  *   **Follow-up:** "If your answer is that the structural similarities persist regardless of his intent—which sounds like a variation of 'the heir doesn't need permission'—doesn't that make your claim unfalsifiable? If nothing Rawls says or writes can overturn the continuity, are we doing intellectual history or literary projection?"

  ### 2. The Weight of "On My Religion"
  "Rawls's private memoir, 'On My Religion,' describes a loss of faith triggered by the horrors of war. He frames his later secularism not as a translation of his faith, but as a response to its collapse. If we prioritize your structural reading over his own explicit testimony about why he changed, aren't we effectively treating his biography as a distraction rather than a key to the text?"

  *   **Follow-up:** "If you argue that he couldn't see his own intellectual DNA—that the inheritance works without his permission—do we risk rendering Rawls's own self-conception irrelevant? At what point does analyzing the philosopher become more important than listening to him?"

  ### 3. The Devout Citizen's Dilemma
  "Let's talk about the citizen. Take a natural-law Catholic who opposes abortion on theological grounds. Rawls asks her to bracket those convictions in public discourse to ensure fairness. But if your reading is right, and Rawls's framework is actually a secularized version of Christian ethics, isn't she being asked to silence her specific faith in favor of a generic one she didn't sign up for?"

  *   **Follow-up:** "If you say she is still benefiting from the Christian ethic of community even if she doesn't recognize it—that the inheritance works without her permission either—isn't that profoundly paternalistic? Does that turn 'public reason' into a Trojan Horse?"

  ### 4. The Nature of the "Break"
  "You argue the theology survived the war. But Rawls describes the war as shattering the very possibility of the community he valued in 1942. If the trauma of the Pacific theater destroyed the *condition of possibility* for his early faith, can the later work really be a descendant? Or is it a ruin built on a grave?"

  *   **Follow-up:** "If you maintain that the structure survived the trauma—that the inheritance persists through the break—does that sanitize the horror that caused the break? Does smoothing over the rupture do violence to the moral urgency of his later liberalism?"

  ### 5. Public Reason as Secularized Confession
  "In the 1942 thesis, sin is self-isolating egoism, and faith is restored community. In *Political Liberalism*, 'unreasonable' citizens are those who impose their comprehensive doctrines on others. It's tempting to see 'public reason' as a secular confession booth where we admit our egoism. But without the possibility of grace, isn't this just restraint without redemption?"

  *   **Follow-up:** "If you argue the discipline of restraint is the same regardless of the theological substrate—that the heir keeps the family discipline without the family religion—does the practice lose its meaning when the promise of restoration is removed?"

  ### 6. The "Heir" Metaphor and Authority
  "You've said 'an inheritance doesn't need the heir's permission.' In law, heirs can reject an inheritance. In philosophy, if an author explicitly rejects the lineage we are assigning them, on what authority do we insist the lineage holds? Is this a claim about Rawls, or a claim about how we want to use Rawls?"

  *   **Follow-up:** "If you stick with the idea that the text owns the author rather than the author owning the text—that the inheritance claims the heir—does that free us to ignore any authorial intent whenever it suits our narrative? Where does that interpretive license stop?"

  ### 7. Overlapping Consensus vs. Assimilation
  "Rawls wants an 'overlapping consensus' among different faiths and secular views. But if the framework they are overlapping *into* is secretly a secularized Protestant communitarianism, aren't non-Protestant citizens being asked to assimilate into a specific tradition while being told it's neutral?"

  *   **Follow-up:** "If you say they are inheriting the benefits of that tradition without needing to adopt the label—that the inheritance is universalized—doesn't that look like intellectual colonialism? Are we asking everyone to speak a dialect of Christianity they don't know?"

  ### 8. The Source of Obligation
  "In 1942, the obligation to be just came from God and the nature of community. In 1990, it comes from 'reasonableness.' If 'reasonableness' is just theology in disguise, where does the binding power come from for the atheist? Is the obligation stable if it denies its own roots?"

  *   **Follow-up:** "If you argue the obligation holds because the structural relationship is the same—that the heir is bound by the estate regardless of belief—does that make the obligation fragile? What happens when the secular citizen realizes the 'reason' they are obeying is actually someone else's 'faith'?"

  ### 9. Intellectual Honesty
  "There is a virtue in intellectual honesty: calling things what they are. If Rawls scrubbed the theological language to make his theory more palatable to a pluralistic society, but you are re-introducing it, are we making the theory more honest or less useful? Does the continuity thesis undermine the very stability Rawls was trying to build?"

  *   **Follow-up:** "If you say honesty matters less than the truth of the structure—that the inheritance exists whether we label it or not—doesn't that risk destabilizing the consensus Rawls spent his life trying to secure? Are we breaking the tool to show how it was made?"

  ### 10. The Practical Stakes
  "Finally, for those of us in the garage trying to figure out how to live together: if we accept your reading that liberalism is secularized Christianity, what do we *do* differently? Does it mean we should stop pretending to be neutral? Or does it mean we should acknowledge that our politics is always going to be theological, one way or another?"

  *   **Follow-up:** "If you say we should just acknowledge the inheritance without needing to restore the theology—that we can keep the heirloom without the house—aren't you asking us to live in a contradiction? Can we really sustain a political order on an inheritance we refuse to fully acknowledge?"
