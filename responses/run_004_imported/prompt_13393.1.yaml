  The student has reversed the roles. It was **not** Garrison who convinced Douglass that the Constitution was anti-slavery; it was **Lysander Spooner** (and Gerrit Smith). In fact, Garrison was furious when Douglass adopted this view. Garrison maintained until the Civil War that the Constitution was a pro-slavery document ("covenant with death"). The student claims Garrison "came to much the same conclusion about the text around the same time," which is factually incorrect and fundamentally misunderstands the nature of their famous split.

