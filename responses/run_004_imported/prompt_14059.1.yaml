          *   Total Recidivists = 45. Base Rate = 45%.
          *   Total Non-Recidivists = 55.
          *   TP = 30, FP = 10. FN = 15, TN = 45.
      *   *Check:*
          *   Group A Base Rate: 65%. Group B Base Rate: 45%. (Different! Good).
          *   Calibration: Both 75% for High, 25% for Low. (Same! Good).
      *   *Calculate Error Rates:*
          *   **False Positive Rate (FPR)** = FP / (FP + TN) = FP / Total Non-Recidivists.
              *   Group A: 20 / 35 = 57.1%.
              *   Group B: 10 / 55 = 18.2%.
              *   **UNEQUAL.**
          *   **False Negative Rate (FNR)** = FN / (FN + TP) = FN / Total Recidivists.
              *   Group A: 5 / 65 = 7.7%.
              *   Group B: 15 / 45 = 33.3%.
              *   **UNEQUAL.**
      *   *Perfect.* This example works and uses clean-ish numbers. I will refine the numbers slightly to make them even cleaner if possible, but these are calculable. Actually, let's make Group A 100 people and Group B 100 people to keep sample size constant, which is intuitive.
      *   *Refining Group A:* 100 people. 65 Recidivists, 35 Non.
          *   High Risk: 80 people (60 Recid, 20 Non). Rate = 60/80 = 75%.
          *   Low Risk: 20 people (5 Recid, 15 Non). Rate = 5/20 = 25%.
      *   *Refining Group B:* 100 people. 45 Recidivists, 55 Non.
