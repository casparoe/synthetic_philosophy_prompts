answer: |-
  This is one of the most important and frustrating concepts in data science, and it is completely normal that surface-level articles aren't satisfying you. Most journalists skip the math because it's dry, but without the math, the controversy makes no sense.

  Your teacher is absolutely right. This is known as the **Impossibility Theorem of Fairness** (formalized in papers by Chouldechova in 2017 and Kleinberg et al. in 2016).

  Here is the concrete numerical proof you asked for, followed by the plain English explanation of why this happens, and finally, the answer to your bonus question.

  ---

  ### Part 1: The Numerical Proof (The "Tale of Two Groups")

  To make the arithmetic easy to follow, we will use a simplified binary model. Instead of a score from 1–10, our algorithm just outputs a label: **"High Risk"** or **"Low Risk."**

  We will create two groups of 100 defendants each.
  *   **Group A:** Has a higher underlying base rate of reoffending.
  *   **Group B:** Has a lower underlying base rate of reoffending.

  **The Constraint:** We will force the algorithm to be **Perfectly Calibrated**. This means if the algorithm says "High Risk," the percentage of people who actually reoffend must be *exactly the same* for Group A and Group B. This satisfies the company's (Northpointe's) definition of fairness.

  #### Group A (Higher Base Rate)
  *   **Total People:** 100
  *   **Actually Reoffend (Positives):** 65 people (65% Base Rate)
  *   **Actually Do Not Reoffend (Negatives):** 35 people

  *The Algorithm's Decision:*
  To maintain calibration, let's say the algorithm labels **80 people** as "High Risk."
  *   Among these 80 "High Risk" people, we need a 75% reoffense rate (our calibration target).
  *   $80 \times 0.75 = 60$ people actually reoffend.
  *   $80 - 60 = 20$ people do **not** reoffend.

  *The Remaining 20 people are labeled "Low Risk":*
  *   Total Recidivists was 65. We accounted for 60. So, **5** recidivists are left (False Negatives).
  *   Total Non-Recidivists was 35. We accounted for 20. So, **15** non-recidivists are left (True Negatives).
  *   *Check Calibration:* 5 reoffenders out of 20 low-risk people = 25% reoffense rate. (Matches).

  **Group A Summary:**
  *   **False Positives (Innocent flagged High):** 20
  *   **False Negatives (Guilty flagged Low):** 5
  *   **Total Innocent People:** 35
  *   **Total Guilty People:** 65

  #### Group B (Lower Base Rate)
  *   **Total People:** 100
  *   **Actually Reoffend (Positives):** 45 people (45% Base Rate)
  *   **Actually Do Not Reoffend (Negatives):** 55 people

  *The Algorithm's Decision:*
  We must keep the **same Calibration** (75% reoffense rate for "High Risk" labels).
  However, because there are fewer total reoffenders in this group, the algorithm cannot label as many people "High Risk" without ruining that 75% accuracy.
  Let's say the algorithm labels **40 people** as "High Risk."
  *   Among these 40 "High Risk" people, we need a 75% reoffense rate.
  *   $40 \times 0.75 = 30$ people actually reoffend.
  *   $40 - 30 = 10$ people do **not** reoffend.

  *The Remaining 60 people are labeled "Low Risk":*
  *   Total Recidivists was 45. We accounted for 30. So, **15** recidivists are left (False Negatives).
  *   Total Non-Recidivists was 55. We accounted for 10. So, **45** non-recidivists are left (True Negatives).
  *   *Check Calibration:* 15 reoffenders out of 60 low-risk people = 25% reoffense rate. (Matches).

  **Group B Summary:**
  *   **False Positives (Innocent flagged High):** 10
  *   **False Negatives (Guilty flagged Low):** 15
  *   **Total Innocent People:** 55
  *   **Total Guilty People:** 45

  ---

  ### Part 2: The Arithmetic of "Unfairness"

  Now we calculate the metrics ProPublica used. They looked at **Error Rate Parity**.

  **1. False Positive Rate (FPR)**
  *Definition: Of the people who did NOT reoffend, what percentage was wrongly flagged as High Risk?*
  *   **Group A:** 20 False Positives / 35 Total Innocent = **57.1%**
  *   **Group B:** 10 False Positives / 55 Total Innocent = **18.2%**
  *   **Result:** Group A is flagged wrongly **3x more often** than Group B.

  **2. False Negative Rate (FNR)**
  *Definition: Of the people who DID reoffend, what percentage was wrongly flagged as Low Risk?*
  *   **Group A:** 5 False Negatives / 65 Total Guilty = **7.7%**
  *   **Group B:** 15 False Negatives / 45 Total Guilty = **33.3%**
  *   **Result:** Group B's criminals are let off the hook **4x more often** than Group A's.

  **The Verdict:**
  *   **Calibration:** Perfectly Equal (75% for High Risk in both).
  *   **Base Rates:** Different (65% vs 45%).
  *   **Error Rates:** Wildly Unequal.

  You cannot fix this by tweaking the algorithm. If you try to lower Group A's False Positive Rate, you *must* lower their "High Risk" labels, which *must* lower the reoffense rate among those labeled High Risk, breaking Calibration.

  ---

  ### Part 3: Plain English Explanation (Why is this inevitable?)

  Imagine you are a farmer trying to catch fish (recidivists) using a net (the algorithm). You have two ponds (Group A and Group B).

  1.  **Pond A is full of fish.** (High base rate).
  2.  **Pond B has very few fish.** (Low base rate).
  3.  **The Rule:** You are only allowed to sell a bucket of "Catch" if 75% of what's in the bucket is actually fish. (This is **Calibration**).

  In **Pond A**, because fish are everywhere, you can cast a huge net. You catch a lot of fish, and even though you catch some old boots (innocent people), the fish are so dense that they still make up 75% of the bucket. You are catching most of the fish in the pond.

  In **Pond B**, fish are rare. If you cast a huge net like you did in Pond A, you will mostly catch old boots. Your bucket will be only 10% fish. You violate the Rule! To keep the bucket at 75% fish, you have to use a tiny, precise net. You catch fewer boots (Good!), but because the net is so small, you miss a ton of fish swimming by (Bad!).

  **The Mathematical Squeeze:**
  Because the "density" of recidivists (base rate) is different, the algorithm has to behave differently to keep its accuracy (calibration) the same.
  *   To stay calibrated in the **High Risk** group, the algorithm must be **aggressive** in Group A (catching more innocents, missing fewer guilty).
  *   To stay calibrated in the **High Risk** group, the algorithm must be **conservative** in Group B (catching fewer innocents, missing more guilty).

  ProPublica looked at the **innocent people caught** (False Positives) and said "That's unfair to Group A!"
  The Company looked at the **accuracy of the prediction** (Calibration) and said "We are equally accurate for everyone!"

  **Both are telling the truth.** But because the ponds started with different amounts of fish, they cannot both be satisfied at the same time.

  ---

  ### Part 4: The Bonus Question (Is Fairness Incoherent?)

  **Does this mean fairness is a made-up idea?**
  No. It means fairness is a **value judgment**, not a mathematical fact.

  Math can tell you what is *possible*. It cannot tell you what is *right*.
  *   **Calibration** is useful for a judge. If a judge sees a "7/10 Risk Score," they want to know that a 7/10 means the same thing regardless of race. If it doesn't, the score is meaningless information.
  *   **Error Rate Parity** is useful for society. We generally believe it is unfair for one group to suffer disproportionately from false accusations (High False Positives), even if the predictions are "accurate."

  **The Takeaway for your project:**
  The existence of this impossibility theorem doesn't mean we should give up on fairness. It means we have to be honest about **trade-offs**.

  When we deploy an algorithm, we are implicitly choosing which mathematical definition of fairness matters more for that specific context.
  *   In **medical testing**, we usually care about False Negatives (don't miss the disease), even if it means more False Positives (unnecessary scare).
  *   In **criminal justice**, many argue we should care about False Positives (don't jail an innocent person), even if it means more False Negatives (some guilty people go free).

  The "bias" isn't always in the data or the code; sometimes the bias is in **which mathematical constraint we chose to prioritize.** The danger arises when companies claim their tool is "Fair" (singular) without admitting they only satisfied *one* definition of fairness while violating another.

  **For your AP Stats project:**
  If you present the table above and explain that "Fairness depends on which denominator you choose" (Total Innocents vs. Total Predicted High Risk), you will have a deeper understanding than 99% of the news coverage on the topic.
