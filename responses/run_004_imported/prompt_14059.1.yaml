          *   FNR A: 5/65 = 1/13 ≈ 7.7%.
          *   FNR B: 15/45 = 1/3 ≈ 33%.
      *   *Conclusion:* Calibration is perfect. Base rates differ. Error rates differ wildly.

  4.  **Drafting the Explanation (Plain English):**
      *   Why does this happen?
