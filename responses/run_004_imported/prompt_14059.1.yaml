  2.  **Deconstruct the Mathematical Impossibility:**
      *   *Definition 1: Calibration (Predictive Parity).* $P(Y=1 | S=s, A=0) = P(Y=1 | S=s, A=1)$. If the model says 70% risk, 70% of Group A and 70% of Group B actually reoffend.
      *   *Definition 2: Error Rate Balance (Equalized Odds/Opportunity).* $P(S=1 | Y=0, A=0) = P(S=1 | Y=0, A=1)$ (False Positive Rate Parity) AND $P(S=0 | Y=1, A=0) = P(S=0 | Y=1, A=1)$ (False Negative Rate Parity).
      *   *The Constraint:* Base Rates ($P(Y=1 | A=0)$ vs $P(Y=1 | A=1)$).
      *   *The Proof Logic:* If Calibration holds, the Positive Predictive Value (PPV) is the same. If Base Rates differ, the ratio of Positives to Negatives differs. To maintain the same PPV with different ratios of Positives/Negatives, the True Positive Rate and False Positive Rate *must* shift relative to each other.

  3.  **Drafting the Numerical Example:**
      *   *Goal:* Create two groups (Group A and Group B) with different base rates but perfect calibration. Then calculate error rates to show they differ.
      *   *Setup:*
          *   Group A (Higher Base Rate): 100 people. Let's say 50 reoffend (50% base rate).
