      *   Key concept: The "Pie" of Recidivists vs. Non-Recidivists is different sizes in each group.
      *   If you keep the "quality" of the prediction (Calibration) the same, you have to cast the net differently to catch the different amounts of fish.
      *   If Group A has way more recidivists, you can label more people "High Risk" without hurting your calibration. If Group B has fewer, you must be stingier with "High Risk" labels to keep the % accurate.
