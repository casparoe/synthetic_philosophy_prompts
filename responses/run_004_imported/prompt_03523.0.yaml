answer: |-
  **The Right to Be Let Alone, or Just the Right to Own Things? A Defense of Distinct Privacy**

  For a software engineer, the architecture of privacy often looks like an access control problem. Who has the token? What is the permission level? Is the data encrypted at rest? It is tempting to view privacy violations as mere security failures or breaches of contract. This intuition aligns surprisingly well with one of the most famous arguments in moral philosophy. In 1975, Judith Jarvis Thomson published "The Right to Privacy," a paper that sent shockwaves through legal and ethical theory. Her thesis was stark: there is no such thing as a distinct right to privacy. Every time we think privacy has been violated, she argued, we are actually witnessing a violation of a more fundamental right, typically property rights or rights over one's own person.

  Thomson's argument is a model of ontological parsimony. She asks us to examine standard privacy violations and strip them down. If a landlord installs a camera in your bathroom, Thomson argues this is a violation of your property rights (you rent the space) or your bodily rights (you are being observed without consent). If someone reads your diary, it is a violation of property (the book belongs to you). If someone listens to your conversation via a wiretap, it is a violation of the property rights of the telephone line or the physical trespass of the bug. For Thomson, "privacy" is merely a label we slap on a cluster of these other, more basic rights. It does no independent moral work. To posit a distinct right to privacy is, in her view, a philosophical error akin to positing a distinct "right to be punched" rather than simply citing the right to bodily integrity.

  However, Thomson's contemporaries in that same 1975 issue of *Philosophy & Public Affairs*, specifically James Rachels and Thomas Scanlon, identified a fatal flaw in this reductionism. While Thomson successfully shows that many privacy violations *co-occur* with property violations, she fails to prove that the property violation is what makes the act *wrong* in the specific way we care about.

  Rachels offered the strongest counter-thesis: privacy is distinct because it is the necessary condition for maintaining diverse human relationships. We share different information with our doctors, our spouses, our employers, and our friends. The moral weight of a privacy violation lies not in the ownership of the information, but in the breach of the relationship context. If a doctor shares your medical history with your employer, no property right of yours is necessarily violated (the records may belong to the hospital), and no bodily harm occurs. Yet, a profound wrong has taken place. The distinct interest at stake is your ability to control who knows what about you, which allows you to sustain different social roles. Scanlon added that there is a distinct interest in freedom from intrusive scrutiny, defined by social convention, which exists independently of ownership.

  To determine who is correct, we must stress-test these theories against a scenario Thomson could not have fully anticipated: the problem of data aggregation. This is the "mosaic theory" of privacy, and it serves as the decisive refutation of Thomson's reductionism.

  Consider a modern data broker. They collect your publicly available property records (which you own but are public), your loyalty card purchases (contractual data), your public tweets (publicly broadcast), and your metadata from navigation apps. Individually, each data point is innocuous. You have no property right in the fact that you bought pregnancy vitamins; you have no property right in the fact that you drove past a clinic; you have no property right in the fact that you searched for "symptoms of morning sickness." Under Thomson's framework, the data broker has violated no right. They have not trespassed, they have not stolen your property, and they have not touched your person. They have merely aggregated information you voluntarily placed into the public or commercial sphere.

  Yet, when these points are combined, they reveal a intimate fact: you are pregnant. If this data is then sold to an advertiser or an insurer, we intuitively feel a privacy violation has occurred. You have been "known" in a way you did not consent to, despite never hiding a single piece of the puzzle.

  Thomson's reductionism collapses here. Because no single act of collection violates a property or bodily right, Thomson must conclude there is no privacy violation. But this contradicts our deepest moral intuitions about autonomy and dignity. The harm in data aggregation is not the loss of ownership over specific bits of data; it is the loss of control over the *inferences* drawn from them. It is a violation of what we might call **epistemic self-determination**—the right to control how one is known by others.

  This confirms Rachels' insight while updating it for the information age. The violation is not about the "things" (the data points) but about the *context* of the relationship between the subject and the observer. You consented to share your location with a map app for the purpose of navigation. You did not consent to share your location with an insurer for the purpose of risk assessment. When the data moves from the "navigation context" to the "insurance context," a distinct privacy right is violated, even if property laws remain intact.

  If we accept Thomson's view, we are forced to accept that surveillance capitalism is morally neutral so long as it avoids trespass and theft. We would have to argue that if you walk down a public street, a government agency has the right to log your face, your gait, and your companions, because you have no property right in your public appearance. This is a *reductio ad absurdum* of the reductionist position. It ignores the chilling effect of constant scrutiny, which Scanlon identified. The harm is the intrusion itself, the shift in the power dynamic between the observer and the observed, which exists independently of property ownership.

  Therefore, Thomson is incorrect. Privacy is a genuinely distinctive right. It cannot be reduced to property or bodily integrity because it protects an interest that those rights do not cover: the interest in the **flow of information relative to social context.** Property rights protect assets; bodily rights protect physical integrity; privacy rights protect the boundaries of the self in relation to society.

  For the software engineer, this verdict has practical weight. If Thomson were right, privacy would be a solved problem once we secured our databases and enforced copyright. But because privacy is distinct, security is necessary but not sufficient. We must design systems that respect *context*, not just ownership. We must recognize that aggregating public data can constitute a moral harm even when the API calls are authorized and the terms of service are signed.

  Thomson sought to tidy up moral philosophy by eliminating a redundant right. In doing so, she inadvertently highlighted exactly why we need it. In a world where information is fluid and aggregation creates new knowledge from old fragments, the right to privacy is not a shadow of property law. It is the only shield we have against being known in ways we never chose to be.
