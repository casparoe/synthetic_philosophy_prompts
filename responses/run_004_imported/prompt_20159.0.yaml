      *   *Analysis:* This is textually very strong. In *De Regno* (On Kingship), Aquinas explicitly warns against killing tyrants privately because it endangers the common good more than the tyranny itself (fear of succession, civil war). He emphasizes public authority. Stauffenberg was a private individual (even if a colonel) acting without a formal public mandate from a legitimate superior body.
      *   *Score:* 2. This is the strongest textual argument. Aquinas is very clear on the danger of private assassination.

