      *   *Analysis:* Aquinas does distinguish between a tyrant *by exercise* (legitimate title, bad rule) and a tyrant *by defect/title* (usurper). For a usurper, resistance is more permissible. However, did Hitler become a "usurper" in the Thomistic sense? He was legally appointed Chancellor and then consolidated power legally (Enabling Act). Shredding the constitution later is tyranny by *exercise*, not necessarily making him a *usurper* in the strict sense of never having had title.
