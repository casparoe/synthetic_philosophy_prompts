prompt: |-
  Two people in my Aquinas reading group got into it over whether Aquinas would've blessed the July 20 plot to kill Hitler, and I can't tell whos actually right about the text. (1) Marcus said obviously yes -- a ruler running a genocide is the textbook tyrant, and Aquinas is famous for licensing resistance to tyranny. (2) Nina said not so fast: in De Regno Aquinas actually argues against private individuals killing tyrants on their own initiative, warning it just invites ambitious men to murder any ruler they can smear as a tyrant -- so a lone colonel like Stauffenberg, acting with no public mandate, is exactly the "private presumption" he's warning against. (3) Marcus countered that Aquinas carves out an exception for a tyrant who's a pure usurper with no legitimate title at all, and Hitler basically became that once he shredded the constitution he'd been legally appointed under. (4) Nina said that exception is for someone like a warlord who never held office at all, not a messy case like Hitler's, and that Stauffenberg still wasn't acting for or with any public authority regardless. (5) Marcus said that under a totalitarian regime there's no public authority left to even appeal to, so Aquinas's actual fallback -- pray and reform your own morals -- is useless against an ongoing genocide, which just shows the view breaks down, not that Nina's reading is wrong. Give a verdict on each numbered move as a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>}, using -2 (clearly wrong) to 2 (clearly right), then briefly explain each score and say what both of them are missing overall.
