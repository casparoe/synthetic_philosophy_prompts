  *Setting:* A quiet clinic.

  *Step 1 (Is):* The nerve tests show nothing. The hand is flesh. It *is* numb.
  *Step 2 (Is Not):* The hand moves. It warms. It is not dead.
  *Step 3 (Both):* It is functionally alive, sensorially dead.
  *Step 4 (Neither):* "Alive" and "Dead" are labels imposed on a process.
  *Ending:* Aris signs the form. The form is empty. The hand remains.

  *Wait, one nuance:* Nagarjuna's tetralemma is often used to negate *inherent existence*. So the collapse should show that the "Numbness" has no findable essence in any of the four positions.
