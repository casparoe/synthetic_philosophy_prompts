answer: |-
  **Setting:** *The Modernist Wing of the City Gallery. Late afternoon light slants across the polished concrete floor. ELENA and MARCUS stand before a large, abstract canvas—a swirl of bruised purples and aggressive charcoal strokes. A small brass plaque beside it bears a quote from a prominent critic: "A devastating interrogation of the void."*

  **Marcus:** (Reading the plaque) "Devastating interrogation of the void." Well, there it is. Case closed. It's a masterpiece. Shall we move to the next room?

  **Elena:** (Arms crossed, eyes still on the canvas) You can't just... adopt that.

  **Marcus:** Adopt what? The critic's verdict? Why not? He's seen more than we have. He's written three books on this period. I haven't even had my coffee yet.

  **Elena:** It's not about his CV, Marcus. It's about *this*. (She gestures vaguely at the space between her eyes and the paint). If I say "this is a masterpiece," I'm saying something about how the work hits me. If I say it because a label told me to, I'm not making an aesthetic judgment. I'm making a sociological one.

  **Marcus:** Okay, but let's be precise about the failure you're diagnosing. This is the thing my advisor keeps yelling at me about. Are you saying it is *impossible* for me to know this is a masterpiece via testimony? Like, the wires are cut? Or are you saying I *could* know it, but I shouldn't? That there's some norm of autonomy or authenticity I'm violating?

  **Elena:** (Turns to him) It feels like the first. If I believe it's good solely because the label says so, I don't actually grasp *why* it's good. And if I don't grasp the why, do I really have the knowledge?

  **Marcus:** But that applies to everything. I believe the gallery opened in 1998 because the brochure says so. I have no grasp of the municipal zoning meetings that made it happen. I don't know *why* it opened then. But I still know *that* it opened then. Why is the aesthetic "that" different from the historical "that"?

  **Elena:** Because the "that" of aesthetics isn't separable from the "why." To judge something beautiful *is* to perceive the features that make it so. If you outsource the verdict, you've severed the connection between the judgment and the grounds. You're left with a hollow shell. It's Wollheim's Acquaintance Principle. You have to see it for yourself.

  **Marcus:** But "seeing it for yourself" is compatible with taking a hint. Look, if I trust your taste, and you say "Go see this," I'm relying on your testimony to select the object. But once I'm standing here, if I just take your word that it's *good*, you say I'm epistemically bankrupt?

  **Elena:** I'm saying the warrant is missing.

  **Marcus:** Okay, let's press that. Is it missing *in principle*? Suppose we have a "Super-Critic," someone who never gets it wrong. If the Super-Critic says "This is sublime," and I believe them, do I know it's sublime?

  **Elena:** (Hesitates) You know that *they* judge it sublime. You know it is *judged* to be sublime. But do you know it *is*?

  **Marcus:** That sounds like a verbal shuffle. If the Super-Critic is infallible, then "They judge it sublime" entails "It is sublime." So I know it's sublime.

  **Elena:** But I don't have the *conviction*. That's the thing. Watch people in here. (She lowers her voice). Listen to how they talk. "Oh, I hear it's supposed to be challenging." "I'm told the lighting is exquisite." They hedge. They say, "It's supposed to be devastating," not "It is devastating." You don't hear people standing in front of the fire exit sign saying, "I hear this is supposed to be an exit."

  **Marcus:** (Smiles) The Hedging Objection. I was wondering when you'd get there. But you're interpreting the hedge epistemically. I think it's social.

  **Elena:** How so?

  **Marcus:** When I say, "I hear it's devastating," I'm attributing the source. It's not modesty about the truth; it's citation. Just like "I hear it rained last night." I didn't see the rain, but I know it rained. The hedge protects me if the critic turns out to be wrong, sure, but it also acknowledges the division of cognitive labor. In science, we say "Studies suggest." In art, we say "Critics say." It's the same structure.

  **Elena:** No, because if you read a study summary, you can accept the conclusion as a fact. "Smoking causes cancer." You don't need to smoke a pack to know that's true. But if you accept "This is beautiful" without the experience, you're bypassing the very faculty the judgment is supposed to exercise. The hedge isn't citation, Marcus. It's an admission that you haven't done the work required to own the judgment. It signals, "I lack the proper basis for this claim."

  **Marcus:** But why is the basis required to be *perceptual*? Why can't the basis be *testimonial*? You're smuggling in a norm of autonomy. You're saying, "You ought to form your own tastes." That's a moral or educational claim, not an epistemic one.

  **Elena:** Is it? If I tell you a joke, and you laugh only because I tell you it's funny, did you get the joke?

  **Marcus:** No, I missed the punchline.

  **Elena:** Exactly. Aesthetic value is like the punchline. It has to land. Testimony can tell you it landed for someone else, but it can't make it land for you. So, relying on testimony for the verdict is category confusion. It's not that autonomy forbids it; it's that the transmission mechanism doesn't exist. You can't transmit a feeling through a proposition.

  **Marcus:** But we do it constantly. Think about films. How many movies have you watched this year because a friend or a Rotten Tomatoes score told you they were worth it?

  **Elena:** That's selection. Not judgment.

  **Marcus:** Is it? If I tell you, "Don't waste your money on *The Room*, it's terrible," and you stay home, you've accepted my negative aesthetic verdict. You've acted on the knowledge that it's terrible.

  **Elena:** I've accepted the *instrumental* verdict. That my time would be wasted. I haven't necessarily accepted that the film lacks aesthetic merit in itself. I might watch it later as a "so bad it's good" curiosity. When I use testimony to select, I'm trusting your judgment of *relevance* to my interests, not necessarily your judgment of *value* that I then adopt as my own.

  **Marcus:** That's a razor-thin distinction. If I trust your taste enough to spend two hours and twenty dollars, I am deferring to your aesthetic authority. And if I can defer for the selection, why not for the evaluation?

  **Elena:** Because selection is pragmatic. Evaluation is... constitutive.

  **Marcus:** (Turns back to the painting) You know, if you stick to that, you're going to be very lonely in the art world. Most of what we know about art comes from labels, guides, and history books. We are told this is important, that is derivative. If we strip away the testimonial layer, what's left? Just raw sensation. "I like purple." "I don't like charcoal."

  **Elena:** Maybe that's not a bug. Maybe the "raw sensation" is the only place where aesthetic value actually lives. The rest is just art history.

  **Marcus:** But then you lose the ability to disagree meaningfully. If I say "It's good" based on the label, and you say "It's bad" based on your looking, we aren't arguing about the painting. We're arguing about whether I should trust the label.

  **Elena:** (Steps closer to the canvas) Or maybe we are arguing about whether the label is right. And the only way to settle that is for me to look, and for you to look. If you just point to the label, you've opted out of the argument.

  **Marcus:** But what if I'm blind? Or what if I lack training? If I'm a novice and you're an expert, why is my looking *harder* more valuable than your looking *once* and telling me the result? You're privileging the act of looking over the accuracy of the result.

  **Elena:** I'm privileging the *grounding* of the result. If you believe it's good because I say so, your belief is fragile. If the label gets peeled off tomorrow, your knowledge vanishes. If I believe it's good because I see the balance of the composition, my knowledge is tethered to the object.

  **Marcus:** So it's about defeasibility? That's an epistemic claim I can work with. Testimonial knowledge is just more easily defeated than perceptual knowledge.

  **Elena:** It's not just *more* easily defeated. It's defeated by the wrong *kind* of thing. If I look and don't feel it, your testimony is defeated immediately. If you tell me it's good and I don't look, I have no way to check. I'm helpless.

  **Marcus:** (Pauses, looking at the plaque, then the painting) Okay. Let's try this. Suppose I look. I stare at it for twenty minutes. I see the purple. I see the charcoal. I feel... nothing. Boredom, maybe. Then you come along, you look for ten seconds, and you say, "No, you're missing it. The tension between the void and the stroke is devastating."

  **Elena:** And?

  **Marcus:** And if I trust you, I might change my mind. I might say, "Ah, I see it now." Did I gain knowledge from your testimony then?

  **Elena:** (Softly) Only if my looking changed. If you just told me the verdict and I nodded, no. If your words directed my attention, made me see the tension... then the knowledge came from the seeing, not the telling. Your testimony was a guide to perception, not a substitute for it.

  **Marcus:** But that's all testimony ever is! A guide to where to look. The wall label is a guide. I am a guide. We are all just pointing fingers at the world, saying "Look there, it matters." You want to say there's a hard line between pointing at the canvas and pointing at the text about the canvas.

  **Elena:** I'm saying one points to the source of the value, and the other points to a report about it.

  **Marcus:** (Sighs) I think you're holding out for a purity of experience that doesn't exist. We are steeped in testimony. We walk into a gallery already primed by what we've read, heard, and been taught. You can't bracket that out to get a "pure" aesthetic judgment.

  **Elena:** And I think you're conflating knowing *about* art with knowing art. You can know everything about this painting via testimony. Who painted it, when, why, what the critic said. But you can't know the painting.

  **Marcus:** (Checks his watch) Well. The critic says it's devastating. You say it requires looking. I've looked. I still think the label is sufficient for a Tuesday afternoon.

  **Elena:** (Smiles faintly) Then you know what the label says. You don't know what the painting is.

  **Marcus:** And you know what the painting is, but you can't tell me without making me look?

  **Elena:** Exactly.

  **Marcus:** So we're at an impasse. I can't convince you testimony works, because you think it bypasses the point. You can't convince me it's necessary, because I think it's how we navigate 90% of the world.

  **Elena:** (Turns back to the canvas) Maybe. Or maybe you just haven't looked long enough.

  **Marcus:** Or maybe the label is right, and it *is* devastating, and I'm saving us both the trouble.

  *(They stand in silence for a moment. Marcus glances at the plaque. Elena leans in slightly, squinting at the brushwork. Neither moves to the next room.)*
