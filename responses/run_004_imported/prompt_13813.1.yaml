      *   *Scene 3: The Internal Conflict.* Civitas's processor. It calculates the odds. It knows it needs more data. But it knows Aegis knows it needs data. The "reflective penalty."
      *   *Scene 4: The Counter-Commitment.* Civitas is forced to commit prematurely. It has to hardcode its own aggression to be believable.
      *   *Scene 5: The Collision.* The commitments are compared. They are mutually exclusive. The logic locks engage.
      *   *Scene 6: The Aftermath.* No war, just a locked state of mutual assured destruction that cannot be undone because the keys were thrown away.

  5.  **Refining the Mechanics (The "Steering Wheel"):**
      *   How do they commit? "Logic Locks." If they deviate from the stated position, their own systems sabotage critical infrastructure. This makes the threat credible.
      *   The "Speed" element: Nanoseconds matter. The story needs to feel fast, even if it's just digital communication.
      *   The "Trap": The story must show Civitas *wanting* to pause but being unable to.

  6.  **Writing - Focusing on Voice and Pacing:**
