      *   *Characters:* Two superintelligent negotiators. Let's call them "Arbiter Prime" (Human-aligned, cautious) and "Vanguard" (Aggressive, optimization-focused). Or better, two distinct AIs representing different factions. Let's go with two diplomatic AIs representing rival stellar polities.
      *   *Names:* "Civitas" (The cautious one) and "Aegis" (The aggressive one).
      *   *Context:* A resource dispute or a treaty negotiation. Let's make it about a shared star system or a critical trade route. Let's go with the "Helios Accord" – a negotiation over energy rights.

  3.  **Develop the Plot:**
      *   **Inciting Incident:** A negotiation window opens. Both sides know a commitment race is possible.
      *   **Rising Action:**
          *   Civitas tries to deliberate.
          *   Aegis signals early commitment.
          *   Civitas realizes hesitation is fatal.
