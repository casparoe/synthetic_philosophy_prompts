answer: |-
  **Setting:** *A faculty lounge, 11:30 PM. The whiteboard is covered in half-erased logical notation and a diagram of a rabbit. Two empty coffee pots sit on the warmer. ELENA (PhD candidate, staunch Quinean) is wiping the board. MARCUS (Visiting fellow, cognitive science leanings) is slumped in an armchair, spinning a marker.*

  **Marcus:** You know, the more I stare at this "no fact of the matter" claim, the more it looks like a magic trick. You wave the word "ontology" and suddenly empirical limitations become metaphysical impossibilities.

  **Elena:** It's not a trick, Marcus. It's a distinction of category. You're treating translation like physics. In physics, if I have two theories of gravity that predict all the same data, I say, "One of these is true, I just don't know which." The world makes one true.

  **Marcus:** And in translation?

  **Elena:** In translation, if I have a manual that maps *gavagai* to "rabbit" and a manual that maps it to "undetached rabbit part," and both account for all speech dispositions... neither is true. Not because we're ignorant. Because there's nothing *to* be true about. Meaning isn't a hidden object in the head waiting to be found. It's a property of the mapping between behavior and behavior.

  **Marcus:** That's exactly where Chomsky got off the train. "Meaning isn't in the head"? Come on, Elena. We aren't in 1960. We know things are in the head. We have a language faculty. We have Universal Grammar. If you put a native speaker in an fMRI, or better yet, map their computational cognitive state, you will find a specific structure that processes *gavagai*. That structure is going to look like an object tracker, not a stage tracker. That's a physical fact. Doesn't that settle it?

  **Elena:** It settles the causal trigger. It tells me what neural event happens when the rabbit hops by. But it doesn't tell me what the term *refers* to. Look, suppose the native's brain lights up in pattern X when a rabbit is present. Pattern X is caused by the rabbit. Fine. But does pattern X represent *the rabbit*? Or *the temporal slice of the rabbit*? Or *the universal rabbithood*? The neural firing is the same in all those cases.

  **Marcus:** But the *role* of that firing in the wider cognitive system isn't. If their cognitive system treats the trigger as an enduring object for the purposes of counting, predication, and memory, then it *is* an object concept. If it treats it as a stage, the downstream inferences change. You said it yourself earlier: the manuals have to account for all speech dispositions.

  **Elena:** I did. But "speech dispositions" are behavioral outputs. I can construct a manual that translates their "counting" words as our "counting of stages" rather than "counting of objects." I just have to adjust the translation of their logical particles—your "is," "same," "another"—to compensate. That's the point of the analytical hypotheses. You can save the phenomena either way.

  **Marcus:** You can save the *behavioral* phenomena. But you can't save the *cognitive* phenomena without changing the subject. If I claim the native is thinking about rabbit stages, I'm claiming their internal computational architecture is segmented temporally. If I claim they're thinking about rabbits, I'm claiming it's segmented materially. Those are different claims about the machine. One of them matches the actual wiring. That's the fact of the matter you're denying.

  **Elena:** You're smuggling in intentionality, Marcus. You're saying the wiring *means* something intrinsically. Quine's point is that the wiring is just more physics. I can interpret the wiring as representing objects, or I can interpret the wiring as representing stages, provided I reinterpret the rest of the system to keep the logic consistent. This is Ontological Relativity. Reference is inscrutable not just between languages, but even within one.

  **Marcus:** So you're saying even *I* don't know if I'm talking about rabbits or rabbit stages?

  **Elena:** I'm saying the question makes no sense except relative to a background language. When you ask, "Do *I* mean rabbit?", you're asking it in English. And in English, sure, we mean rabbit. But that's just because we're using English to fix the reference. If you ask, "What does the native *really* mean, independent of any background language?" there is no answer.

  **Marcus:** But the background language isn't arbitrary! It's constrained by biology. That's the Chomskyan hammer. The human brain isn't a blank slate that can equally sustain an "object ontology" or a "stage ontology." It has biases. It defaults to spatio-temporal continuities. If the native's brain has the same UG as mine, then the hypothesis that they mean "rabbit" is not just simpler; it's biologically mandated. The "fact of the matter" is a fact of human biology.

  **Elena:** Okay, let's grant that. Suppose biology mandates a bias toward object-tracking. That makes the "rabbit" manual the *natural* one. The *useful* one. The one we'd all pick. But does it make it the *true* one?

  **Marcus:** What's the difference? If "truth" in semantics just means "fits the evidence and the cognitive architecture," then it's true.

  **Elena:** Ah, but there's the rub. In physics, we assume there's a world independent of our architecture. If our brains were wired differently, gravity would still work the same way. But with translation... if you say the fact of the matter is just "what fits the human cognitive architecture," you've reduced meaning to a disposition to behave and process. And if it's just dispositions, I'm back to square one. I can map those dispositions to "rabbit" or "rabbit parts" equally well, as long as I tweak the logical connectives. The biology fixes the *causes*, Marcus. It doesn't fix the *reference*.

  **Marcus:** You're drawing a line between "cause" and "reference" that naturalism shouldn't allow. If the cognitive system is designed by evolution to track rabbits for survival, then the content of the representation *is* rabbits. To say "Well, technically it could be rabbit stages if we redefine 'identity'" is to play a logical game that ignores the teleological fact of the matter. The system is *about* rabbits because that's what it was selected to track.

  **Elena:** Now you're doing metaphysics, not linguistics. "Aboutness." Intentionality. Quine wants to naturalize epistemology, sure, but he won't buy magic. You can't get "aboutness" out of physics, even neural physics. You can get causal covariation. Rabbit causes neural state N. Rabbit part also causes neural state N. Selection history? Maybe that favors rabbits. But I can tell a selection story for stages too—survival depends on avoiding the dangerous-stage-of-a-rabbit.

  **Marcus:** That's gerrymandering.

  **Elena:** Is it? Or is it just showing that "gerrymandering" is a judgment we make *within* a conceptual scheme? You think my distinction is verbal. I think your "fact of the matter" is a phantom. You want there to be a Meaning God who looks at the native and says, "Ah, yes, definitely rabbits, not parts." But all God sees is physics. And physics underdetermines the translation.

  **Marcus:** I don't need a Meaning God. I need a competent cognitive scientist. If I understand the native's language faculty well enough, I can predict sentences they haven't uttered yet. If my "rabbit stage" manual fails to predict a novel utterance that the "rabbit" manual predicts, then the "rabbit" manual is empirically superior.

  **Elena:** But I can always adjust the analytical hypotheses in the "rabbit stage" manual to accommodate that new utterance. I just change how I translate their subjunctive conditional.

  **Marcus:** At what cost? At some point, the manual becomes so convoluted it's useless.

  **Elena:** "Useless" is pragmatic. "False" is semantic. Quine's claim is that there is no semantic falsity here. Both manuals are compatible with all physical facts. If you say the convoluted one is "false," you're saying there's a fact of the matter beyond physical facts. But you're a naturalist! You think everything is physical. So where is this extra fact hiding?

  **Marcus:** It's hiding in the *structure* of the physical facts! It's not an "extra" fact. It's the fact that the cognitive system is organized *as if* it posits objects. The organization *is* the meaning. You're acting like meaning has to be some ghostly ether. It's not. It's the computational role.

  **Elena:** Computational role relative to *what*? If I map their computational role to our "stage" concepts, the math works out. You keep saying "the math works out better for objects." Maybe. But "better" is a virtue of theory choice, not a truth condition. In physics, we say the better theory is *probably* true. In translation, Quine says the better manual is just *better*. There is no "probably true" lurking behind it.

  **Marcus:** Why? Why is linguistics special? Why is the "truth" of a translation manual metaphysically weaker than the "truth" of a quantum mechanical model?

  **Elena:** Because the quantum model is trying to describe electrons. The translation manual is trying to describe *meanings*. And meanings, Quine argues, aren't real entities like electrons. They're shadows cast by behavior. You can't be wrong about a shadow's shape if the light source and the object are fixed, because the shadow *is* the relation. If I describe the shadow differently, I'm just using a different geometry.

  **Marcus:** But the "object" casting the shadow is the brain! And the brain has a specific geometry.

  **Elena:** The brain has a specific *structure*. But structure doesn't dictate interpretation. A circuit board can be interpreted as adding numbers or as sorting lists depending on how you map the inputs and outputs. The board doesn't care.

  **Marcus:** But the *user* of the circuit board cares. The native uses the language to ask for food, to warn of danger. If I translate "gavagai" as "rabbit stage," and they say "There is a gavagai," and I hand them a frozen rabbit leg, they'll be confused.

  **Elena:** Only if I translate their word for "hand" and "leg" and "confused" using *my* object-biased manual. If I translate consistently within the "stage" manual, I'll know that when they say "gavagai," they are indicating a presence of rabbit-stuff, and when I hand them the leg, I am handing them a leg-stage. As long as the stimulus meanings match, the exchange works.

  **Marcus:** This is insufferable. You've made translation solipsistic.

  **Elena:** I've made it behaviorist. Look, Marcus, here's the crux. You think the disagreement is about how much evidence we have. You think if we had enough neural data, the indeterminacy would vanish.

  **Marcus:** Yes.

  **Elena:** I think the indeterminacy remains even if we have a complete physical description of the universe. That's the difference between Underdetermination and Indeterminacy. Underdetermination says, "We need more data." Indeterminacy says, "There is no data that *could* decide this, because the question presupposes a distinction that doesn't exist."

  **Marcus:** So you think I'm asking a nonsense question when I ask, "Does he mean rabbit?"

  **Elena:** I think you're asking a question that only has an answer relative to a manual. "Does he mean rabbit relative to Manual M?" Yes. "Does he mean rabbit simpliciter?" No.

  **Marcus:** And I think "relative to Manual M" is just a philosopher's way of saying "We haven't finished the science yet." You're calling it "metaphysical indeterminacy" to protect behaviorism from cognitive science. If cognitive science says the brain encodes object permanence innately, then "rabbit" is the correct translation, full stop. Not relative to anything.

  **Elena:** Then we aren't disagreeing about linguistics. We're disagreeing about realism. You're a realist about intentional states. Quine isn't.

  **Marcus:** I'm a realist about biological functions.

  **Elena:** And I'm saying biological functions don't fix reference. They fix survival.

  *(Silence hangs for a moment. Marcus rubs his temples. Elena caps the marker.)*

  **Marcus:** So, if I understand you... you're saying that even if I map every neuron, I still have to *choose* a translation manual, and that choice isn't dictated by the neurons?

  **Elena:** The neurons dictate the *structure*. The manual dictates the *interpretation* of that structure. You can interpret the structure as object-based or stage-based. Both work. Neither is the "one true" interpretation of the mind.

  **Marcus:** And I'm saying that at some point, "interpretation" is just a word you use to ignore the fact that the system is *designed* for one and not the other. If I design a calculator to add, and you interpret it as subtracting using a weird input-output mapping, you're not being deep. You're being wrong about the design.

  **Elena:** But who designed the native? Evolution. And evolution selects for behavior, not ontology. As long as the rabbit-avoidance behavior happens, evolution doesn't care if the organism thinks "rabbit" or "rabbit-stage."

  **Marcus:** Evolution selects for mechanisms. The mechanism *is* the ontology.

  **Elena:** Then show me the mechanism of "aboutness."

  **Marcus:** I can't. Not in a way that satisfies you. Because you've defined "fact of the matter" as "something that exists outside of any conceptual scheme."

  **Elena:** *(Pauses)* ...Maybe.

  **Marcus:** Maybe?

  **Elena:** If you define "fact of the matter" as "physical state of the world," then I agree there are facts. But if you define it as "semantic content independent of a background language," then I say there aren't. You're using "fact of the matter" to mean "physical cause." I'm using it to mean "semantic truth."

  **Marcus:** And I'm telling you semantic truth *just is* a certain kind of physical cause.

  **Elena:** And I'm telling you that's a category error.

  **Marcus:** So we're back to metaphysics.

  **Elena:** We never left. Quine's point was always that once you push empiricism hard enough, it eats itself. You want to be a naturalist, Marcus. So am I. But if you're a thoroughgoing naturalist, you have to admit that "meaning" isn't a natural kind. It's a tool we use. And tools aren't true or false. They're just fit for purpose.

  **Marcus:** Then why do we argue about them?

  **Elena:** Because we forget they're tools and treat them like mirrors.

  **Marcus:** *(Stands up, grabs his coat)* I still think you're letting the native off the hook. He knows what he means.

  **Elena:** He knows how to use his words. That's all any of us know.

  **Marcus:** We'll see. Next week, I'm bringing the neural imaging data. Let's see if your "analytical hypotheses" can explain away the visual cortex.

  **Elena:** *(Smiles faintly)* I'll bring the logic. You bring the pictures.

  *(Marcus exits. Elena looks at the whiteboard, at the word "RABBIT" circled in red. She picks up the eraser and wipes it away, leaving only the logical symbols.)*
