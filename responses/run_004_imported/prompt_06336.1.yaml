          *   Contrast with Physics: In physics, rival theories (T1 vs T2) describe the *same* world, but one is true. In translation, T1 ("rabbit") and T2 ("rabbit parts") are *both* compatible with all facts, and neither is "truer."
      *   **Chomsky's Critique:**
          *   From "Quine's Empirical Assumptions" (1968).
          *   IT is just Underdetermination of Theory by Evidence (UTE).
          *   Science always faces UTE. Why is linguistics special?
          *   There *are* facts of the matter: facts about the human mind/brain (Universal Grammar, innate structures).
          *   If we knew the neural/cognitive structure, we would know the native *means* rabbit, not rabbit stages.
      *   **The Clash:** Ontology (Quine: meanings don't exist as entities) vs. Cognitive Realism (Chomsky: mental structures are physical facts).

  3.  **Drafting - Scene Setting:**
