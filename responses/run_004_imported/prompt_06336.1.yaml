      *   *Check:* Make sure Marcus doesn't just say "Science finds facts." He needs to argue that cognitive science *is* the tribunal for these facts.
      *   *Nuance:* Quine distinguishes between "underdetermination" (physics) and "indeterminacy" (translation). In physics, we assume a real world. In translation, "meaning" isn't a real world object. Marcus needs to challenge that assumption.
