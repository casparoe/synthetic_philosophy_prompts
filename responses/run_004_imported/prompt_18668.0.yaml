  Ok I've fallen into an accuracy-first epistemology hole and it's messing with my sense of humor. The whole research program (Jim Joyce's original argument, then a bunch of people including Pettigrew building it out into a whole book) ditches the classic Dutch-book stuff and instead just scores your credences against the world with something like a Brier score, then shows that if your credences aren't probabilistically coherent, there's always some coherent alternative that would've been more accurate then yours no matter which way the world turned out. No betting required, just straight up "you could've scored better, full stop." (Feels pretty on brand for someone who's spent like a decade reading Overcoming Bias/LW/ACX posts about calibration and prediction markets, tbh.)

  Tried explaining the immodesty part to my roommate last night, the bit where a proper scoring rule basically forces you into a position where, by your own lights, your current credences always come out looking like the most accurate ones on offer, otherwise you'd have standing reason to just switch to whatever you think is better calibrated. She said "so the theory's conclusion is that everyone's already doing great, according to themselves" and honestly, thats basically a punchline already, except she wasn't going for one.

  Which is what's bugging me - im pretty sure there's an actual joke buried in there (something turning on immodesty, or on propriety of the scoring rule, or on the whole "extremism" worry, where these arguments seem to end up rewarding credences that are closer to 0 and 1) and I can't quite get it to land myself. Can you take a shot at writing one? One-liner, dialogue, whatever format - I don't care, I just don't want generic "philosophers be pedantic" humor. I want the punchline to actually turn on the mechanics of the framework, such that someone who's only ever heard the phrase "Bayesian epistemology" wouldn't get it, but someone who's actually sat down with a proper scoring rule would.
