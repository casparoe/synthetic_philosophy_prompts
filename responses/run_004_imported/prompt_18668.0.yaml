answer: |-
  **Title:** The Modesty Penalty

  **Characters:** Two grad students, Alex and Jordan, staring at a whiteboard covered in Brier scores.

  **Alex:** "I feel like my credences are too extreme. I want to adjust them toward 0.5. You know, be more epistemically humble."

  **Jordan:** "You can't do that."

  **Alex:** "Why not? It's my brain."

  **Jordan:** "Because of Immodesty. By your own lights, your current credences already minimize your expected inaccuracy. If shrinking them toward 0.5 looked more accurate to you, you'd have already updated to that."

  **Alex:** "So I'm mathematically forced to think I'm optimal?"

  **Jordan:** "You're forced to think you're *undominated*. Anything else is incoherence."

  **Alex:** "I don't care. I value humility. I'm going to add a penalty to my scoring rule for high confidence."

  **Jordan:** "Go ahead. But you know what that makes your scoring rule?"

  **Alex:** "More ethical?"

  **Jordan:** "Improper."

  **Alex:** "..."

  **Jordan:** "Technically speaking, you're just incentivizing yourself to misreport your true credence to yourself. You're not being humble; you're lying about your uncertainty."

  **Alex:** "So modesty is just structured self-deception?"

  **Jordan:** "Only if you define it as a deviation from a Proper Scoring Rule."
