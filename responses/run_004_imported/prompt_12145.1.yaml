  ok so we covered the "block universe" idea in physics class — how relativity means past, present, and future all exist together, not just this moment. it came up again in my philosophy class on the endurantism vs perdurantism debate, and it seems like the physics side just settles it: if every point in time is exactly as real as every point in space, objects can't be "wholly present" at one moment anymore, they have to be spread out into temporal parts across time the same way theyre spread out across space. so doesnt modern physics basically prove perdurantism and refute endurantism? is there even a real comeback for endurantists once you accept relativity, or is it just a dead position at this point?
reasoning: |-
