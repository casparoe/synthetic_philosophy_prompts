prompt: |-
  I'm interviewing a game theorist next week for a piece on why smart people (and whole companies) keep throwing good money after bad, and her favorite illustration is the dollar auction -- Shubik's game where the dollar goes to the highest bidder but the second-highest bidder also has to pay up and gets nothing, so bids routinely blow way past a dollar. Her whole angle is that this isn't proof anyone's irrational: once your the second-highest bidder, ratcheting up another bid is the rational move given what you and your rival each know about the other's resources, so the "trap" is built into the rules, not into anybody's head. She uses this to wave off the comparison people love to make to plain old sunk-cost escalation in business (funding a doomed project because of what's already been sunk into it), saying that's a different mechanism wearing the same costume.

  Can you draft me 8 interview questions that don't just let her restate that line? I want at least one that presses on the fact that in actual lab versions of the game, bids regularly blow past anything a tidy "rational escalation" model would predict, one that makes her actually draw the line between dollar-auction escalation and plain sunk-cost thinking since she tends to blur the two, and one asking what result would actually convince her the bidders, not the rules, were the irrational part. Give me a quick follow-up for each, keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Subject:** Interviewing a game theorist about the Dollar Auction (Shubik's game).
      *   **Core Argument of Interviewee:** The escalation isn't irrational; it's structurally induced by the rules (second-highest pays). It's distinct from standard sunk-cost fallacy in business. Rational escalation given resources/knowledge drives the bids past $1.
      *   **Goal:** 8 interview questions that *challenge* or *deepen* her argument, not just let her restate it.
      *   **Specific Requirements:**
          *   One question on lab results exceeding "rational escalation" models.
          *   One question forcing a clear distinction between Dollar Auction escalation and standard sunk-cost thinking (since she blurs them).
          *   One question on what evidence would change her mind (falsifiability).
          *   Include a likely answer and a follow-up for each.
      *   **Tone:** Professional, probing, journalistic.

  2.  **Deconstruct the Interviewee's Position:**
      *   *Claim 1:* Bidding past $1 is rational within the game's constraints (minimizing loss).
      *   *Claim 2:* This is structurally different from business sunk-cost fallacy.
      *   *Claim 3:* The "trap" is in the rules, not human psychology.

  3.  **Brainstorming Angles of Attack:**
      *   *The "Rationality" Definition:* If rationality leads to guaranteed loss for everyone except the auctioneer, is it a useful definition of rationality?
      *   *The Lab Data:* Real humans bid way higher than game theory Nash equilibriums often predict. Why?
      *   *The Business Analogy:* If the mechanism is different, why does the *feeling* and the *outcome* look so similar? Can you really separate them in practice?
      *   *Entry Deterrence:* The smartest move is not to play. Why do smart people play?
      *   *Collusion:* Why don't bidders collude to bid $0.01 and split the dollar?
      *   *Falsifiability:* What would prove her wrong?
      *   *Emotional Component:* Does pride/ego play a role, or is it purely cold calculation?
      *   *Real World Application:* If it's structural, how do we change the structure in business?

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Lab Data Requirement):* Need to address that bids go *way* past $1, often to $5, $10, etc. A purely rational loss-minimization model might stop earlier.
          *   *Draft:* In labs, people bid $20 for a $1 bill. Your model says they minimize loss. But why so much loss?
          *   *Refinement:* Make it about the gap between the theoretical "rational stop" and the empirical "blowout."

      *   *Q2 (Sunk Cost Distinction Requirement):* She says they are different mechanisms. Need to pin her down on *where* the line is.
          *   *Draft:* You say business sunk cost is different. But it looks the same. Where is the line?
          *   *Refinement:* Focus on the *decision matrix*. In business, you can walk away. In the auction, you are forced to pay. Is that the only difference?

      *   *Q3 (Falsifiability Requirement):* What proves her wrong?
          *   *Draft:* What would make you think people are irrational?
          *   *Refinement:* Specific scenario. If we change the rules but they still escalate, does that implicate the head, not the rules?

      *   *Q4 (Entry/Participation):* The most rational move is not to bid. Why do they enter?
          *   *Draft:* Why play at all?
          *   *Refinement:* Focus on the "first bid." If the trap is structural, the rational agent shouldn't step on the trap.

      *   *Q5 (Collusion/Cooperation):* Game theory often solves these with cooperation. Why doesn't that happen?
          *   *Draft:* Why don't they team up?
          *   *Refinement:* If they are rational, they should collude. The failure to collude suggests a psychological barrier, not just structural.

      *   *Q6 (The "Winner's Curse" vs. "Loser's Levy"):* Distinguish the motivation.
          *   *Draft:* Are they trying to win or not lose?
          *   *Refinement:* At what point does the motivation switch from profit-seeking to loss-avoidance? Does that switch matter for your definition of rationality?

      *   *Q7 (Real World Translation):* How do we fix business if the auction is different?
          *   *Draft:* How does this help CEOs?
          *   *Refinement:* If the mechanisms are different, does your solution for the auction apply to the boardroom? Or is the analogy useless?

      *   *Q8 (Emotional/Reputational):* Is it purely financial?
          *   *Draft:* What about ego?
          *   *Refinement:* In anonymous lab settings, escalation still happens. But in business, reputation matters. Does adding reputation make the business case *more* like the auction, or less?

  5.  **Review and Refine against Constraints:**
      *   8 questions? Yes.
      *   Follow-ups included? Yes.
      *   Likely answers anticipated? Yes.
      *   Specific requirements met? (Lab data, Sunk Cost distinction, Falsifiability). Yes.
      *   Tone check: Ensure they don't sound hostile but do sound rigorous.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Check Q1:* Make sure it highlights the *excess* beyond rational loss minimization.
      *   *Check Q2:* Ensure it forces a concrete boundary, not just a theoretical one.
      *   *Check Q3:* Ensure it's about *evidence*, not just opinion.
      *   *Follow-ups:* Make sure they pivot based on her likely defensive stance (i.e., if she doubles down on structure, push on psychology).

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 8 interview questions designed to press past the standard "it's the rules, not the people" explanation, including the three specific angles you requested.

  ### 1. The Empirical Gap (Lab Data Requirement)
  **Question:** In controlled lab versions of the Dollar Auction, bids don't just tick past a dollar; they often explode to $5, $10, or even $20. A strict 'loss-minimization' model suggests bidders should cut their losses much earlier once the cost exceeds their estimate of the rival's bankroll. When the bidding blows past the point of *any* rational recovery, doesn't that suggest emotional commitment is overriding the calculation you're describing?

  *   **Likely Answer:** She will likely argue that in the heat of the moment, the "bankroll" is ambiguous, or that the utility of winning (prestige) is being factored into the calculation, keeping it rational.
  *   **Follow-up:** "If we have to add 'prestige' or 'spite' to the utility function to make the math work, haven't we just moved the irrationality from the *action* to the *valuation*? At what point does a model that requires infinite variables stop explaining behavior and start excusing it?"

  ### 2. The Entry Paradox
  **Question:** You argue the trap is in the rules, but the most rational move in the Dollar Auction is to never place the first bid. If smart people and companies can recognize the structure is predatory, why is the entry threshold so low? Is the real cognitive failure not the escalation, but the initial belief that they can control a game designed to spiral?

  *   **Likely Answer:** She'll likely say that in business, you don't know you're in a Dollar Auction until you're already in it, or that the first bid seems cheap enough to be low-risk.
  *   **Follow-up:** "But in your own examples, the rules are explicit. If a CEO knows the project requires continuous funding with no guarantee of return, isn't signing the first check the same as placing the first 20-cent bid? Where does the 'unknown structure' defense end?"

  ### 3. The Sunk-Cost Boundary (Distinction Requirement)
  **Question:** You draw a hard line between the Dollar Auction and standard sunk-cost escalation in business, arguing the mechanisms are different. In the auction, the second-highest bidder *must* pay. In business, they usually *choose* to keep funding. If the business leader has the power to walk away but doesn't, isn't that a psychological commitment rather than a structural coercion?

  *   **Likely Answer:** She will argue that in business, walking away triggers other costs (reputation, stock price, layoffs) that functionally mimic the auction's "second-highest pays" rule.
  *   **Follow-up:** "So you're saying the 'rules' of the market artificially construct the same trap? If so, why do we treat the auction as a structural anomaly and the business decision as a psychological failure? If the outcome is identical, does the distinction matter for fixing the problem?"

  ### 4. The Collusion Blindspot
  **Question:** Game theory often solves escalation games through cooperation or collusion. In the Dollar Auction, the rational outcome for the *group* is to bid one cent and split the dollar. Yet, bidders almost never collude; they almost always compete. If they are rational actors, why do they fail to solve the game cooperatively?

  *   **Likely Answer:** She'll likely cite the lack of communication channels in the standard setup or the incentive to defect (one person bids 2 cents to take the whole dollar).
  *   **Follow-up:** "In business, communication channels *do* exist. Boards, advisors, competitors talking at conferences. If the rational move is cooperation, and they have the tools to cooperate, but they still escalate into a price war, doesn't that point back to human competitiveness overwriting rational payoff?"

  ### 5. The Falsifiability Test (Evidence Requirement)
  **Question:** Let's talk about what would change your mind. If we ran a version of the Dollar Auction where the second-highest bidder *didn't* have to pay, but participants still escalated bids past a dollar due to pride or competition, would you concede that the driver is internal psychology, not external rules?

  *   **Likely Answer:** She might say that without the penalty, it's a different game entirely (a standard auction), so escalation there would indeed be irrational, but it doesn't invalidate her point about the specific Dollar Auction structure.
  *   **Follow-up:** "But if humans bring that same escalation instinct to the 'safe' version, doesn't that prove the Dollar Auction just *activates* a pre-existing bug in human reasoning, rather than installing a new one? Isn't the gun structural, but the trigger finger psychological?"

  ### 6. The "Rationality" Definition
  **Question:** You define the escalation as rational because it minimizes loss relative to the rival. But if both parties end up with a net negative, and the auctioneer takes all the value, isn't that a system where 'rationality' is indistinguishable from mutual assured destruction? Is 'rational' the right word for a strategy that guarantees a loss for the participants?

  *   **Likely Answer:** She will likely stick to the technical definition: Rationality is about maximizing utility given constraints, not guaranteeing profit.
  *   **Follow-up:** "If a definition of rationality predicts that two smart actors will systematically destroy their own capital, is that a useful definition for a business audience? Or are we just semanticizing disaster?"

  ### 7. The Time Horizon
  **Question:** In the Dollar Auction, the escalation happens in minutes. In business, it happens over quarters or years. Does the time dilation matter? Does the slow drip of sunk costs in business allow for more 'rational' off-ramps that the speed of the auction denies, making the business failure *more* blameworthy on the decision-maker?

  *   **Likely Answer:** She might argue the time horizon actually makes it worse in business because it allows for more narrative-building to justify the continued spend.
  *   **Follow-up:** "So time gives them *more* opportunity to think, yet they still fail? If the auction forces a snap judgment and business allows deep reflection, but both result in escalation, doesn't that suggest the business leaders are actually *less* rational than the auction bidders?"

  ### 8. The Prescription
  **Question:** If the trap is truly structural, as you say, then telling CEOs to 'be more rational' is useless advice. They need to change the contract. But in business, you can't always rewrite the market rules. If a leader finds themselves in a Dollar Auction scenario they didn't design, what is the *rational* move? To pay the dollar, or to burn the money and walk?

  *   **Likely Answer:** She will likely say the only rational move is to recognize the game early and refuse to play, or to signal commitment so strongly the rival folds immediately.
  *   **Follow-up:** "But signaling commitment requires spending money. So the advice is 'spend money to convince them you'll spend more money.' That sounds exactly like the escalation you're saying is rational. How do they break the cycle without taking the loss?"
