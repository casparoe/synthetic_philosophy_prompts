prompt: |-
  My colleague and I run a small consulting partnership and split the profits from our joint contracts according to an informal agreement anchored to what each of us would earn if we worked entirely on our own. Recently, my colleague received an extremely lucrative outside job offer that they have no real intention of accepting, but they argue that this offer raises their theoretical "ceiling" in our partnership and therefore entitles them to a larger share of our joint profits, even though neither of our actual fallback positions has changed. It strikes me as strange that a hypothetical outcome neither of us will ever realize should affect how we divide real, current earnings, but I can't quite articulate why this bothers me. Is my colleague's reasoning defensible, or am I right to resist it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Small consulting partnership (two people).
      *   **Current Agreement:** Informal profit split based on "what each would earn if working entirely on their own" (fallback position/outside option).
      *   **The Conflict:** Colleague got a lucrative outside job offer (not intending to accept).
      *   **Colleague's Argument:** This offer raises their theoretical "ceiling" (outside option), so they deserve a larger share of joint profits.
      *   **User's Intuition:** It feels wrong because the offer is hypothetical, won't be realized, and actual fallback positions haven't changed.
      *   **Question:** Is the colleague's reasoning defensible, or is the user right to resist? Why does it bother the user?

  2.  **Deconstruct the Economic/Game Theory Logic:**
      *   *Bargaining Theory (Nash Bargaining Solution):* In cooperative game theory, the split of surplus often depends on the "disagreement point" (BATNA - Best Alternative to a Negotiated Agreement).
      *   *Colleague's View:* My BATNA has increased. Therefore, my threat point is higher. I bring more leverage to the table.
      *   *User's View:* The BATNA is not *real*. It's a one-off offer, not a sustainable market rate. It doesn't reflect the actual value brought to *this* partnership.
      *   *Key Distinction:* Is the profit split based on *contribution/value added* or *leverage/threat power*?
      *   *Sustainability:* If the offer is rejected, it ceases to exist. Basing a recurring revenue split on a one-time, non-recurring offer is unstable.

  3.  **Evaluate the "Defensibility" of the Colleague's Reasoning:**
      *   *Technically:* In strict bargaining theory, an improved outside option *does* shift the negotiation range. So, there's a theoretical basis.
      *   *Practically:* It's flawed. Why?
          *   **Credibility:** If they don't intend to take it, it's a bluff.
          *   **Relevance:** Consulting partnerships usually split based on effort, client ownership, or expertise applied *to the joint work*, not what someone *could* do elsewhere.
          *   **Precedent:** If the user gets an offer later, does the split flip back? What if the offer is rescinded?
          *   **Good Faith:** Using a rejected offer as leverage undermines trust.

  4.  **Articulate Why It Bothers the User (The "Gut Check"):**
      *   It feels like hold-up behavior (rent-seeking).
      *   It decouples reward from actual contribution.
      *   It introduces volatility based on noise (random job offers) rather than signal (market value).
      *   It violates the spirit of partnership (shared risk/reward) in favor of transactional leverage.

  5.  **Drafting the Response:**
      *   **Validation:** Acknowledge the user's intuition is sound.
      *   **Theoretical Analysis:** Explain *why* the colleague thinks this (BATNA/Nash Bargaining) but why it's misapplied here.
      *   **Practical Flaws:** List the specific problems with using a non-credible outside offer (volatility, credibility, contribution vs. leverage).
      *   **Partnership Health:** Discuss the impact on trust and long-term viability.
      *   **Actionable Advice:** How to push back constructively. Reframe the agreement around value contribution, not threat points.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Nuance:* I shouldn't say the colleague is 100% wrong about *leverage*. In a pure negotiation, leverage matters. But in a *partnership*, contribution matters more. I need to distinguish between a "deal" and a "partnership."
      *   *Tone:* Professional, objective, but supportive of the user's ethical stance.
      *   *Key Concept:* "Opportunity Cost" vs. "Market Value." The offer represents a specific opportunity cost for *that moment*, not a sustained market value.

  7.  **Final Structure:**
      *   **Direct Answer:** You are right to resist.
      *   **The Theory (Why they argue this):** BATNA explanation.
      *   **The Flaw (Why it's weak):** Credibility, Sustainability, Contribution vs. Leverage.
      *   **The Risk:** Precedent and Trust.
      *   **How to Respond:** Reframe the profit-sharing logic.

  8.  *(Self-Correction during drafting)*: Make sure to mention that if the agreement was *explicitly* "market rate outside options," the colleague might have a technical point, but even then, a single offer isn't a market rate. The prompt says "informal agreement anchored to what each of us would earn." A single offer isn't a reliable anchor for "what one would earn."

  9.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on this thought process.)
answer: |-
  You are right to resist this reasoning. While your colleague's argument borrows from legitimate economic concepts, it misapplies them in a way that undermines the stability and spirit of a partnership.

  Here is an articulation of why your intuition is correct, the theoretical flaw in your colleague's logic, and how you might address this professionally.

  ### 1. The Theoretical Flaw: BATNA vs. Value
  Your colleague is relying on a concept from negotiation theory called **BATNA** (Best Alternative to a Negotiated Agreement). In a pure negotiation, the party with the stronger outside option often has more leverage and can command a larger share of the surplus.

  However, there are three critical flaws in applying this to your partnership:

  *   **Credibility:** A BATNA only has weight if it is credible. Your colleague has admitted they have "no real intention of accepting" the offer. In game theory, a non-credible threat (or promise) should not influence the equilibrium. If they aren't willing to walk away, the offer is not a true alternative; it is merely data.
  *   **Volatility vs. Stability:** A single job offer is a data point, not a market rate. If profit splits fluctuate every time one of you gets an interview or an offer, your financial planning becomes impossible. A sustainable partnership anchors splits to **sustained market value** or **contribution**, not transient opportunities.
  *   **Contribution vs. Leverage:** Partnerships generally differ from transactional negotiations. In a partnership, profits are typically divided based on value contributed to the *joint* enterprise (effort, expertise, client relationships), not on who has the biggest stick to hold over the other. Your colleague is arguing for **rent-seeking** (extracting value based on leverage) rather than **value creation** (earning value based on input).

  ### 2. Why It Bothers You (The Ethical & Practical Cost)
  Your discomfort stems from the fact that this reasoning violates the implicit social contract of a partnership.

  *   **It decouples reward from work:** If the split changes based on outside offers, your income is no longer tied to how hard you work or how well the business performs, but to the random noise of the job market.
  *   **It creates a "Hold-Up" Problem:** If you accept this logic, you set a precedent that any time one partner gets an offer, they can hold the partnership hostage for a larger share. This incentivizes your colleague to constantly shop for offers not to leave, but to extract rent from you.
  *   **It erodes trust:** Partnerships rely on the assumption that you are both "all in." Using a rejected offer as leverage signals that your colleague views the partnership as a temporary arbitrage opportunity rather than a shared commitment.

  ### 3. Is the Reasoning Defensible?
  **Technically, no.** Even under the "fallback position" logic you described ("what each of us would earn if we worked entirely on our own"), a single offer does not establish what someone *would* earn.
  *   **Market Rate vs. One-Off Offer:** "What you would earn" implies a sustainable income stream. A single lucrative offer might be an outlier, a signing bonus anomaly, or specific to a role you wouldn't actually take.
  *   **The "Intention" Clause:** Since they do not intend to accept the offer, their *actual* fallback position remains what they could get if they left the partnership *today*. If they turned down the offer, that specific fallback no longer exists.

  ### 4. How to Respond
  You need to move the conversation from "leverage" back to "partnership principles." Here is a suggested approach:

  **A. Challenge the Metric**
  > "Our agreement is based on sustainable market value, not transient offers. A single offer you don't intend to take doesn't change your sustainable market rate. If we base our split on random offers, my income becomes volatile based on your job search activity, which isn't fair or sustainable."

  **B. Highlight the Precedent**
  > "If we accept this logic, we have to agree that if I get an offer next month, the split swings back. Do we want to spend our time renegotiating every time one of us interviews? It creates instability in the business."

  **C. Reframe the Partnership**
  > "We are partners, not negotiators. Profit splits should reflect the value we bring to *this* client work, not what we could do elsewhere. If your market value has genuinely increased, let's discuss that in the context of your role and responsibilities here, not based on an offer you've rejected."

  **D. The "Walk Away" Test**
  > "The fallback position is what happens if we dissolve the partnership. Since you aren't taking the job, that offer isn't part of the dissolution scenario. Therefore, it shouldn't impact the profit split."

  ### Summary
  Your colleague is attempting to convert **potential energy** (an offer they won't use) into **kinetic energy** (actual cash flow from the partnership). This is economically unsound for a recurring revenue arrangement and toxic for a partnership.

  You should resist this firmly but professionally. If you concede this point, you are no longer partners; you are adversaries in a recurring negotiation, and the partnership will likely not survive the next time the market shifts.
