      *   **Requirements:** Reconstruct Leibniz's likely response using specific concepts (Principle of Sufficient Reason, Identity of Indiscernibles, Causation among Finite Substances, Best of All Possible Worlds). Evaluate where his reasoning holds up and where it fails by "our own lights" (modern perspective).
