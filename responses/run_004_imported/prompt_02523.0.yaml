answer: |-
  You are not crazy, and your close reading is paying off. This is one of the knottiest passages in Moore, precisely because he is watching himself think in real-time. He is famously honest to a fault; where other philosophers would plaster over a crack in the argument, Moore will stare at the crack for three pages and then admit he doesn't know how to fix it.

  For your novel, this is gold. An insufferable Apostle doesn't need to be right; he needs to be *precisely confused*. He needs to treat uncertainty as a form of intellectual virtue.

  Here is the breakdown of what is happening logically, followed by answers to your three specific questions, and finally some advice on how to voice this for your character.

  ### 1. The Logical Breakdown (Sentence by Sentence)

  To understand this, you need the standard view Moore is fighting against.
  *   **The Standard Sense-Data View:** When I look at a round penny from an angle, I am directly aware of a visual patch (a sense-datum). That patch *is* elliptical. When I look from above, the patch *is* circular. Therefore, the sense-datum changes even though the penny doesn't.
  *   **Moore's Worry:** If the sense-datum changes, am I really seeing the penny? Or am I trapped inside my own mind looking at changing pictures? Moore wants to save the idea that we are in contact with reality.

  **Sentence 1 & 2:** *"What now seems to me to be possible is that the sense-datum... may not really be perceived to be smaller... but that it is only perceived to seem smaller..."*
  *   **The Move:** Moore is proposing a radical shift. Usually, we say "The sense-datum *is* smaller." Moore asks: What if the sense-datum *doesn't change at all*? What if the visual patch is constant, but my experience of it involves a specific feeling of "seeming"?
  *   **The Logic:** He is trying to move the variation from the *object* of perception (the sense-datum) to the *mode* of perception (the "seeming").

  **Sentence 3:** *"...that all that is perceived is that the one seems elliptical and the other circular..."*
  *   **The Logic:** This clarifies the previous point. I do not perceive "ellipticality." I perceive "elliptical-seeming." It is a distinction between a property and the *appearance* of a property.

  **Sentence 4:** *"...that the sense-datum presented to me when I have the blue spectacles on is not perceived to be different in colour... but only to seem so..."*
  *   **The Logic:** He extends the argument from shape (penny) to color (spectacles) and even cross-modal (touch vs. sight). He is universalizing the theory. In *every* case of potential illusion or perspective shift, the underlying datum might be constant; only the "seeming" varies.

  **Sentence 5:** *"If such a view is to be possible, we shall have, of course, to maintain that the kind of experience which I have expressed by saying one seems different... involves an ultimate, not further analysable, kind of psychological relation..."*
  *   **The Logic:** This is the heavy lifting. He admits this requires a new category of mental state.
      *   **Perceiving:** "It is blue." (Commitment to fact).
      *   **Judging:** "I believe it is blue." (Intellectual assent).
      *   **Seeming:** "It seems blue." (The raw experience, without the commitment).
      *   He claims this "Seeming" relation is **ultimate**. You can't explain it in terms of the other two. It's a brute fact of consciousness.

  **Sentence 6:** *"...since a presented object might, in this sense, seem to be elliptical... when it is neither perceived to be so, nor judged to be so."*
  *   **The Logic:** The justification for the new category. I can have the experience of "elliptical-seeming" (like in a mirage or a trick of light) without believing it is elliptical (judgment) and without it actually being elliptical (perception of fact). Therefore, "seeming" must be a distinct mental faculty.

  **Sentence 7:** *"But there seems to me to be no reason why there should not be such an ultimate relation."*
  *   **The Logic:** Logical possibility. There is no contradiction in positing this mental state.

  **Sentence 8:** *"The great objection to such a view seems to me to be the difficulty of believing that I don't actually perceive this sense-datum to be red... and that I only perceive, in many cases, that it seems so."*
  *   **The Logic:** The psychological cost. This is Moore's honesty kicking in. It feels *wrong* to say "I don't see red, I see *seeming-red*." It makes our contact with the world feel indirect and thin.

  **Sentence 9:** *"I cannot, however, now persuade myself that it is quite clear that I do perceive it to be so."*
  *   **The Logic:** The stalemate. He can't prove the "seeming" theory is true, but he can't prove the standard "direct perception" theory is true either. He ends in *aporia* (puzzlement).

  ---

  ### 2. Answering Your Three Questions

  **1. What is this "seeming" relation if it's neither perceiving nor judging?**
  Moore is isolating the **phenomenology** from the **commitment**.
  Think of it like this: When you watch a 3D movie, you see a dragon flying at your face.
  *   **Judgment:** You know there is no dragon.
  *   **Perception (Fact):** There is no dragon.
  *   **Seeming:** It *looks* like a dragon is coming at you.
  Moore is suggesting that *all* perception might be like the 3D movie. We are always just seeing the "seeming," never the fact itself. He is trying to make "seeming" a primitive, irreducible mental state—a raw "givenness" that doesn't promise truth.

  **2. Does Moore even believe his own move?**
  **No.** And this is the most important thing for your character to capture. Moore is not preaching a doctrine; he is mapping the limits of his own understanding. He finds the theory logically possible but psychologically implausible.
  For your Apostle character: He shouldn't sound like he's won the argument. He should sound like he's *haunted* by the argument. The insufferable part isn't his certainty; it's his inability to let go of a distinction that doesn't actually help anyone enjoy the dinner. He values the precision of the confusion more than the resolution.

  **3. Is this an ancestor of Disjunctivism?**
  **No, actually it is the opposite.** This is a crucial distinction if you want your character to be philosophically credible.
  *   **Disjunctivism (The Modern View):** Says that when you see a real penny, your experience is fundamentally *different in kind* from when you hallucinate a penny. There is no common "sense-datum" in both cases. In the good case, you see the world. In the bad case, you see nothing but your mind.
  *   **Moore Here:** He is assuming there *is* a common factor (the sense-datum) in both cases. He is trying to tweak the relationship to that common factor.
  *   **Why it matters for your book:** If your character claims this is the future of philosophy, a knowledgeable reader might spot the error. However, your character can be *straining* toward Disjunctivism without reaching it. He is feeling the pressure that *caused* Disjunctivism (the desire to say we see the real world), but he is stuck in the old Sense-Data framework.
  *   **Better "Ahead of his time" angle:** Moore is anticipating the distinction between **phenomenal character** (what it feels like) and **doxastic commitment** (what you believe). This is huge in modern philosophy of mind. Your character can be excited that "seeming" is a distinct category of mental life, which is a genuine insight, even if his metaphysics are dated.

  *(Note on Dates: You mention the novel is set "right before WWI" (pre-1914), but this paper is from 1918. Moore gave lectures on these topics around 1910–1911 which formed the basis of the paper. For strict historical accuracy, have your Apostle reference Moore's recent **lectures** rather than the published paper, or acknowledge the date discrepancy.)*

  ---

  ### 3. Writing the Scene: The Voice of the Apostle

  To make this scene work, the Apostle shouldn't just dump this text. He should be reacting to the painter. The painter deals in *appearances*; the Apostle deals in *truth*.

  **The Dynamic:**
  The painter says something like, "The light makes the bowl look blue, though it's white."
  The Apostle pounces. "But what do you mean by 'look'? Do you perceive the blueness? Or do you perceive the whiteness seeming blue?"

  **Key Character Traits for the Dialogue:**
  1.  **Qualifiers:** He should use Moore's specific hedging. "What *seems* to me possible," "I cannot *persuade myself*," "It is *not further analysable*." This makes him sound rigorous but indecisive.
  2.  **The "We":** Apostles often speak for the collective intellect. "If *we* are to maintain..."
  3.  **Frustration with Art:** He should be slightly annoyed that the painter is comfortable with ambiguity. To the painter, "it looks blue" is enough. To the Apostle, "it looks blue" is a philosophical crisis.
  4.  **The Ending:** Don't let him resolve it. The scene should end with him admitting he's stuck, but treating that stuckness as a moral victory. "It is better to be clearly puzzled than falsely certain."

  **Sample Dialogue Snippet:**

  > "You say the bowl looks blue," Julian said, leaning over the asparagus. "But you must distinguish. Do you perceive the blue? Or do you perceive the white *seeming* blue?"
  >
  > "I perceive that it looks blue, Julian. I'm a painter, not a logician."
  >
  > "But 'looks' is the very thing!" He tapped his fork against the table, a staccato beat of epistemological distress. "Moore suggests—and I confess I am not yet persuaded, but the possibility haunts me—that the 'seeming' is an ultimate relation. It is not a judgment. It is not a perception of fact. It is... a third thing. A psychological primitive."
  >
  > "A third thing," I repeated, reaching for the wine.
  >
  > "Precisely. Because if the sense-datum actually changed, we should be cut off from the object. We should be trapped in the eye. But if only the 'seeming' varies..." He trailed off, frowning at his plate as if the asparagus might offer a syllogism. "Though I cannot persuade myself it is clear. It is a terrible difficulty. One feels one ought to perceive the red, and yet..."
  >
  > "And yet you only perceive the seeming," I said.
  >
  > "Yes. Or perhaps not. I cannot say. But one must not pretend to certainty where there is none."

  This captures the Moorean voice: the precision, the hesitation, the moral weight of intellectual honesty, and the ultimate lack of resolution. It makes him insufferable not because he's arrogant, but because he won't let the dinner party just *be*.
