prompt: |-
  I'm prepping questions for a podcast interview with a Thomist political philosopher who's just written a book arguing that Aquinas's actual view on tyrannicide still holds up: a ruler who was always a usurper can be removed by force, even killed, by the community, but a legitimate king who simply turns tyrannical has to be tolerated or removed through proper channels only, never assassinated by some fed-up private citizen. Give me 7-8 questions that push on whether that usurper/tyrant-by-practice line is doing real moral work or just lets Aquinas dodge endorsing vigilante killing, on the worry that licensing any of this invites people to brand whatever ruler they dislike a "tyrant," and on the fact that On Kingship's fallback plan when nothing else works is basically pray about it. Add a follow-up to each keyed to the reply she's most likely to give, and end with a question on whether her view would sanction something like the July '44 plot against Hitler.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** Thomist political philosopher.
      *   **Topic:** Her new book arguing Aquinas's view on tyrannicide holds up.
      *   **Core Argument:** Distinction between a *usurper* (always illegitimate, can be removed/killed by community) and a *legitimate king turned tyrant* (must be tolerated or removed via proper channels, no private assassination).
      *   **Task:** Create 7-8 interview questions.
      *   **Specific Angles to Push:**
          *   Is the usurper/tyrant distinction doing real moral work or just dodging vigilante violence?
          *   The risk of people branding any disliked ruler a "tyrant."
          *   Aquinas's fallback in *On Kingship* (pray about it) seems passive.
          *   **Final Question:** Application to the July 20, 1944 plot against Hitler.
      *   **Format:** Question + Follow-up (keyed to likely reply).

  2.  **Deconstruct the Thomist Position (Mental Sandbox):**
      *   *Aquinas's Text:* Primarily *De Regno* (On Kingship) and *Summa Theologiae* (II-II, Q. 42, Q. 64).
      *   *The Distinction:* Usurpers lack title (*defectus tituli*). Tyrants by exercise (*tyrannus exercitio*) have title but abuse power.
      *   *The Mechanism:* Public authority vs. private authority. Private individuals cannot kill tyrants (sedition). Public authority (the community or superior) can depose a usurper.
      *   *The Tension:* If the "community" acts, isn't that just organized vigilantism? If the "superior" acts, what if there is no superior (e.g., the Emperor)?
      *   *The "Pray" Problem:* Aquinas suggests patience and prayer if no human remedy exists. This sounds quietist to modern ears.
      *   *The Hitler Case:* Hitler was legally appointed (Enabling Act), so technically a tyrant by exercise, but the regime was criminal. Does the Thomist view condemn the Stauffenberg plot?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Core Distinction.* Need to establish the usurper vs. legitimate tyrant line immediately.
          *   *Follow-up:* She'll say it's about order/authority. Push on whether "community action" is just mob rule with a fancy name.
      *   *Q2: The "Who Decides?" Problem.* If the community acts, who speaks for the community?
          *   *Follow-up:* She'll say "representative bodies." Push on what happens when those are corrupted (which they usually are under tyranny).
      *   *Q3: Vigilante Dodge.* Is this distinction just a way to condemn private assassination without actually allowing removal?
          *   *Follow-up:* She'll say it prevents anarchy. Push on whether it effectively protects bad guys.
      *   *Q4: The Labeling Risk.* Anyone can call a ruler a tyrant. How do we stop subjective judgment?
          *   *Follow-up:* She'll say there are objective criteria. Push on who interprets those criteria in the moment.
      *   *Q5: The "Pray" Fallback.* *On Kingship* says if no human remedy, look to God. Is this political quietism?
          *   *Follow-up:* She'll say it's not passive, it's recognizing limits. Push on whether this fails in extreme evil scenarios.
      *   *Q6: Modern Application/Constitutionalism.* Does this work outside monarchies?
          *   *Follow-up:* She'll say yes, "community" translates to "people/constitution." Push on whether modern tyranny is more bureaucratic, making "usurpation" harder to define.
      *   *Q7: The Threshold of Violence.* When does removal become permissible? Is it last resort?
          *   *Follow-up:* She'll say yes, proportionality. Push on whether the requirement for "public authority" creates a catch-22.
      *   *Q8: The Hitler Question.* (Required).
          *   *Follow-up:* (Not needed for the last one, but good to have ready).

      *Refining for the Prompt's Constraints:* The prompt asks for 7-8 questions *with follow-ups keyed to likely replies*. The final question must be about July '44.

      *Drafting Q1 (The Distinction's Moral Weight):* Focus on whether the distinction is substantive or semantic.
      *Drafting Q2 (The Community Agent):* Who constitutes the "community" authorized to kill a usurper?
      *Drafting Q3 (The Vigilante Charge):* Directly ask if this is just a workaround to avoid endorsing assassination.
      *Drafting Q4 (Subjectivity/Labeling):* The worry about anyone calling a ruler a tyrant.
      *Drafting Q5 (The "Pray" Problem):* Address the *On Kingship* quietism.
      *Drafting Q6 (Institutional Corruption):* What if the "proper channels" are the problem?
      *Drafting Q7 (Natural Law vs. Positive Law):* Where does the authority come from if positive law is suspended?
      *Drafting Q8 (Hitler):* The specific case study.

  4.  **Polishing the Follow-ups:**
      *   Need to anticipate the "Thomist Speak." She will likely talk about *ordo*, *common good*, *public authority*, and *sedition*.
      *   The follow-up needs to press the tension, not just say "Interesting."
      *   *Example:* If she says "Public authority prevents anarchy," the follow-up should be "But what if the public authority is the tyrant's puppet?"

  5.  **Review against Constraints:**
      *   7-8 questions? Yes.
      *   Push on usurper/tyrant line? Yes.
      *   Push on "labeling" worry? Yes.
      *   Push on "pray" fallback? Yes.
      *   Follow-up to each? Yes.
      *   End with July '44? Yes.

  6.  **Final Polish (Tone Check):**
      *   Ensure the tone is respectful but probing (podcast style).
      *   Make sure the Thomist terminology is accurate enough to not sound like a strawman (e.g., distinguishing *tyrannus ex defectu tituli* vs *tyrannus ex parte exercitii*).

      *(Self-Correction during drafting)*: Make sure Q3 and Q1 don't overlap too much. Q1 is about the moral logic; Q3 is about the "dodge" accusation specifically.
      Make sure Q5 captures the "pray" aspect specifically mentioned in the prompt.
      Ensure the Hitler question is nuanced (Hitler was legally empowered, making him a tyrant by exercise, which complicates the Thomist view).

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 8 questions designed for your podcast interview, including follow-ups keyed to the likely Thomist responses.

  **1. The Moral Weight of the Distinction**
  "Your book hinges on Aquinas's distinction between the *tyrannus ex defectu tituli* (the usurper who never had a right to rule) and the *tyrannus ex parte exercitii* (the legitimate king who rules badly). You argue the former can be removed by force, but the latter generally cannot be assassinated by private citizens. Is this distinction doing heavy moral lifting here, or is it primarily a juridical technicality designed to condemn vigilante violence without actually providing a mechanism for removal?"

  *   **Follow-up:** "You'll likely say it preserves public order and prevents sedition. But if the 'community' acts against a usurper, isn't that just organized vigilantism with a different name? At what point does the 'community's' use of force become indistinguishable from the private assassination you're trying to rule out?"

  **2. The "Who Decides?" Problem**
  "Aquinas suggests that a usurper can be removed by the community. But in a political crisis, the 'community' is rarely a monolith. Who exactly has the standing to declare a ruler a usurper and authorize force? Is it the nobles? The parliament? The mob? If there isn't a clear procedural mechanism, doesn't this invitation to 'community action' essentially license civil war?"

  *   **Follow-up:** "If you say it requires representative bodies or elites, what is your advice for when those institutions are already corrupted or dissolved by the ruler? If the only people left to judge are private citizens, are they not back in the position you forbid?"

  **3. The Vigilante Dodge**
  "Critics might argue that by forbidding private citizens from killing a legitimate king turned tyrant, Aquinas—and your defense of him—is effectively protecting bad actors by hiding behind the concept of 'legitimacy.' Once a king turns tyrant, hasn't he broken the social contract so severely that his legitimacy is void? Why does the initial title matter more than the current reality of his oppression?"

  *   **Follow-up:** "I anticipate you'll argue that removing a legitimate king causes more scandal and disorder than tolerating him. But isn't there a point where the disorder of tyranny outweighs the disorder of removal? Does Thomism have a threshold for 'sufficient evil' that overrides the presumption against private violence?"

  **4. The Subjectivity of "Tyrant"**
  "One of the classic worries about tyrannicide theory is that it makes every disgruntled subject a potential judge of the sovereign. If we accept your reading, what objective criteria prevent a political faction from simply branding a ruler they dislike as a 'usurper' or a 'tyrant' to justify violence? How do we stop this from becoming a tool for factionalism rather than justice?"

  *   **Follow-up:** "You'll likely point to Natural Law or objective violations of the common good. But in the heat of the moment, who interprets Natural Law? If the Church or the courts are sidelined, aren't we back to subjective judgment, which is exactly what Aquinas wanted to avoid?"

  **5. The "Pray About It" Fallback**
  "In *On Kingship*, Aquinas admits that if there is no human remedy for a tyranny, the people must have recourse to God through prayer. To modern ears, this sounds like political quietism. Are you comfortable endorsing a view where, if the institutional channels are blocked, the moral obligation is essentially to suffer and pray rather than to act?"

  *   **Follow-up:** "If you argue that prayer isn't passive but a recognition of divine sovereignty, doesn't that risk sanctifying the status quo? If a regime is genocidal, is 'patience' really a virtue, or does Thomism lack the resources to justify emergency action when all legal channels are closed?"

  **6. Institutional Corruption and Proper Channels**
  "You emphasize that a legitimate tyrant must be removed through 'proper channels' rather than private plots. But tyranny, by definition, tends to corrupt or dismantle the very channels that would check it. If a king dissolves the parliament and packs the courts, haven't the 'proper channels' ceased to exist? Does your view leave the people powerless in the exact scenario they need power most?"

  *   **Follow-up:** "If you say the 'community' retains latent authority even when institutions are dissolved, how does that authority manifest without looking like the private sedition Aquinas condemns? Is there a practical difference between a 'latent community authority' and a revolutionary committee?"

  **7. Legitimacy vs. Performance**
  "Your argument suggests that initial legitimacy creates a durable bond that survives significant abuse. But in a modern context, where legitimacy is often tied to performance or constitutional adherence rather than divine right or heredity, does this distinction hold? If a democratically elected leader dismantles democracy, are they a usurper or a legitimate tyrant in your framework?"

  *   **Follow-up:** "If you classify them as a legitimate tyrant because they were elected, doesn't that make your view more restrictive than Aquinas's? Aquinas was dealing with monarchs; applying his strictures to modern leaders might make removal nearly impossible compared to the medieval context."

  **8. The July 20th Plot**
  "Finally, I want to apply this to the hardest case. The July 1944 plot against Hitler involved military officers and civilians attempting to assassinate a head of state. Hitler was legally appointed under the Enabling Act, so he wasn't a usurper in the strict sense; he was a legitimate authority turned monster. Based on your reading of Aquinas, would you sanction the Stauffenberg plot, or does the Thomist prohibition on private assassination of a legitimate ruler condemn them as seditious murderers?"

  *   **Follow-up:** "If you say they were justified, are you admitting that in extreme cases, the distinction between usurper and legitimate tyrant collapses? And if you say they were not justified, are you comfortable telling a German in 1944 that they had a moral duty to tolerate the Third Reich because Hitler's initial title was valid?"
