answer: |-
  Here are ten questions designed to move beyond the standard intuitions and press on the specific structural weaknesses of moral testimony pessimism. Each includes the question, a brief note on the *Likely Reply* (based on her typical reliance on the belief/understanding distinction), and a *Follow-Up* designed to test whether that distinction is doing genuine philosophical work or merely restating the problem.

  ### 1. The Moral Education Challenge (Early Childhood)
  **Question:** A common objection to pessimism is that it seems to render ordinary moral education impossible. Parents constantly tell young children, "Don't hit," or "Share your toys," and we assume the children acquire moral knowledge from this. If pessimism is true, are we to say that children literally cannot acquire justified moral belief from their parents? If so, isn't pessimism committed to the view that moral education is inherently stunting until the child can reason independently?

  *   **Likely Reply:** She will likely concede that children can acquire *true belief* via testimony but argue they lack *moral understanding*. She may argue this is acceptable for children because they are not yet full moral agents.
  *   **Follow-Up:** "If children can act rightly based on testimony-induced true belief, does that mean they have moral worth when they share their toys? Or are they merely well-trained until they grasp the reasons themselves? If it's the latter, aren't you drawing a sharp line between 'behaving well' and 'acting morally' that seems counterintuitive for developing agents?"

  ### 2. The Transition Problem
  **Question:** Following up on education: If testimony can give children true belief but not understanding, there must be a developmental point where they transition from accepting testimony to grasping reasons. How does that transition happen without testimony? If a parent explains *why* hitting is wrong, isn't that still a form of testimony? At what exact point does your view say the child stops relying on the parent's word and starts relying on their own grasp?

  *   **Likely Reply:** She will likely argue that explanation is different from verdict-testimony. Explaining reasons allows the child to "see" the value, whereas stating a verdict does not.
  *   **Follow-Up:** "But if the parent's explanation is the vehicle for that understanding, isn't the child still deferring to the parent's epistemic authority regarding which reasons are relevant? If the distinction rests on whether reasons are *stated* versus *grasped*, isn't that a psychological fact about the child rather than an epistemic fact about the testimony itself?"

  ### 3. The Asymmetry Challenge (Scientific Expertise)
  **Question:** In fields like climate science or medicine, we think it is rational—even obligatory—to defer to experts. We don't demand that every citizen understand the chemistry of greenhouse gases to be justified in believing climate change is real. What is the principled difference between deferring to a climate scientist about facts that demand action, and deferring to a moral sage about values that demand action? Why is autonomy required in one domain but not the other?

  *   **Likely Reply:** She will likely argue that moral action requires acting *from* the right reasons to have moral worth, whereas mitigating climate change only requires the *outcome* to be correct.
  *   **Follow-Up:** "So the asymmetry rests entirely on the value of moral worth? If I defer to a scientist and act to save lives, I get no 'scientific worth,' but if I defer to a moralist, I lose 'moral worth.' Does this imply that moral value is fundamentally more self-regarding than other forms of practical rationality? It risks making morality about the purity of the agent rather than the good being done."

  ### 4. The "Moral Expert" Scenario
  **Question:** Let's press the expertise angle. Suppose there is a recognized moral genius—someone with a flawless track record of ethical judgment. If I encounter a complex dilemma and simply ask them, "What should I do?" and do it, you say I lack understanding. But if I have no time to deliberate, isn't deferring to them the most rational way to ensure I do the right thing? Why is epistemic rationality (believing the expert) severed from practical rationality (doing the good) in your view?

  *   **Likely Reply:** She will likely distinguish between *rightness of action* (which you achieved) and *praiseworthiness* (which you lack). She will say you acted rightly, but not virtuously.
  *   **Follow-Up:** "If I act rightly based on testimony, I have the true belief and the right action. The only thing missing is the 'grasp of reasons.' If that grasp doesn't change the outcome, is 'understanding' just a label for 'doing the reasoning yourself'? If so, isn't the pessimist view just stipulating that independent reasoning is valuable, without explaining why testimony fails to transmit the *value* of that reasoning?"

  ### 5. The Aesthetic Parallel
  **Question:** Critics often point to aesthetic testimony as a parallel. If a trusted critic tells me a film is profound, I might believe them, but I haven't really *appreciated* the film until I see it myself. Is moral testimony more like aesthetic testimony than empirical testimony? And if so, does that mean moral knowledge is more about a kind of perception or sensibility than propositional knowledge?

  *   **Likely Reply:** She will likely embrace this analogy. She argues that moral value, like aesthetic value, requires a first-personal engagement to be fully apprehended.
  *   **Follow-Up:** "If moral knowledge is akin to aesthetic appreciation, doesn't that make it private and non-cumulative? In science, we build on the testimony of others. If morality is like art, does that mean moral progress is impossible? Can society ever improve morally if each generation has to 'see it for themselves' rather than building on the testimony of the last?"

  ### 6. The Emergency Case
  **Question:** Consider a high-stakes emergency. I see a friend about to make a catastrophic moral error. I don't have time to walk them through the reasons. I just shout, "No, don't do that, it's wrong!" They defer to me and stop. On your view, have I helped them act rightly, or have I merely manipulated them into a correct behavior without moral worth?

  *   **Likely Reply:** She will likely say you helped them act rightly, but they did not act virtuously. In emergencies, right action is all we can expect; understanding is a luxury for calm reflection.
  *   **Follow-Up:** "If understanding is a luxury we can dispense with in emergencies, doesn't that suggest it isn't constitutive of moral agency itself, but rather an ideal add-on? If I can be a fully functional moral agent in a crisis via testimony, why does testimony fail to constitute knowledge in non-crisis cases? Is the deficit in the testimony, or just in the circumstances?"

  ### 7. The Metaphysics of "Understanding"
  **Question:** You often distinguish between acquiring a *true moral belief* and acquiring *moral understanding*. Optimists argue that if testimony gives me justified true belief, I have knowledge. What exactly is the 'understanding' component that testimony misses? Is it a separate mental state, or is it just the causal history of how I got the belief?

  *   **Likely Reply:** She will likely argue it is a cognitive state involving the ability to weigh reasons and explain the verdict, not just the belief itself.
  *   **Follow-Up:** "If I can repeat your reasons back to you and apply them to new cases, do I have understanding? If yes, then testimony *did* transmit understanding. If no, then 'understanding' seems to require a non-testimonial origin. Are you defining understanding in a way that simply begs the question against the optimist by ruling out testimony by definition?"

  ### 8. The Value of Understanding
  **Question:** Let's talk about the value at stake. Why is it so important that we act from our own grasp of reasons? If the world is better because I did the right thing, why does it matter if I did it because I understood the good, or because I trusted a friend who understood the good? Is there a risk of moral elitism here, where only those with the time and capacity to reason count as full moral agents?

  *   **Likely Reply:** She will likely argue that morality is about the quality of the will, not just the state of the world. Autonomy is a intrinsic good.
  *   **Follow-Up:** "But if autonomy is the intrinsic good, doesn't that make morality self-regarding? If I defer to a victim of oppression who tells me their rights are being violated, and I act on that testimony, am I failing morally because I didn't work it out myself? Doesn't your view risk prioritizing the oppressor's need for 'understanding' over the victim's demand for justice?"

  ### 9. Testimony from Marginalized Groups
  **Question:** This connects to the previous point. In social justice contexts, marginalized groups often ask privileged groups to simply believe their testimony about oppression without demanding further proof or reasoning. Does your pessimism apply here? If a privileged person believes a marginalized person's moral testimony without independently grasping the reasons, are they failing to be morally good allies?

  *   **Likely Reply:** She will likely try to carve out an exception, or argue that listening *is* a form of engaging with reasons, not blind deference.
  *   **Follow-Up:** "If listening is engaging with reasons, then it's not really testimony in the 'blind deference' sense you criticize. But if it *is* blind deference, and you say that's deficient, aren't you placing an extra burden on allies to 'figure it out themselves' rather than trusting the lived experience of others? How do you avoid making pessimism a tool for epistemic injustice?"

  ### 10. Practical Implications for Philosophy
  **Question:** Finally, a practical question for our audience. We are students in a moral epistemology seminar. We are reading your papers and listening to your arguments. If pessimism is true, can we actually learn moral truth from you? Or are we just learning *about* your views? If we adopt your conclusions based on your authority as a professor, haven't we violated the very principle you defend?

  *   **Likely Reply:** She will likely say we are learning *philosophical* truths (about morality), not first-order moral truths. Or she will say she is providing reasons, not verdicts.
  *   **Follow-Up:** "But if you provide reasons, and we accept them because you are the expert, aren't we still deferring? If the distinction is that you give us the 'tools' to reason, doesn't that mean testimony *can* transmit moral knowledge if it's framed as argumentation rather than verdicts? If so, isn't the debate just about the *format* of the testimony, rather than the possibility of moral testimony itself?"
