  3.  **Analyze Coherentism:**
      *   *Structure:* Holistic web. Belief $A$ supports $B$, $B$ supports $C$, $C$ supports $A$ (broadly).
      *   *The Objection:* This is vicious circularity. $A$ cannot justify $B$ if $B$ is needed to justify $A$. It begs the question.
      *   *Standard Coherentist Defense:* It's not *linear* circularity. It's mutual reinforcement within a system. The justification comes from the *system's* coherence, not linear derivation.
