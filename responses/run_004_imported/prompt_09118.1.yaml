      *   *The Objection:* Humans are finite. We can't hold infinite reasons in mind. Therefore, infinitism is psychologically impossible.
      *   *Klein's Defense:* Justification doesn't require all reasons to be *occurrent* (actively thought of) at once. They only need to be *available* (dispositional). If challenged, the believer can produce the next reason. The chain exists as a potentiality, not an actuality of consciousness.
