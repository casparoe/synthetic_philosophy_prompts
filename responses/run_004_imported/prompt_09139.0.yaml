      *   **Point 3: Faith and Morals / Consensus Patrum:** Bellarmine argues this touches doctrine; Galileo argues it's physical.
      *   **Closing:** An impasse, but a respectful one. No resolution (history didn't resolve it then).

  5.  **Drafting - Content & Arguments (Iterative Process):**

      *   *Galileo:* Needs to sound confident, relying on observation (telescope) and physical necessity (tides). He needs to argue that the "motion of the earth" is a physical fact, not a theological proposition.
      *   *Bellarmine:* Needs to sound cautious, relying on epistemological humility. He needs to distinguish between *mathematical utility* and *ontological truth*. He needs to invoke the Council of Trent regarding the Fathers.

      *(Self-Correction during drafting)*: Make sure Galileo doesn't sound like a modern atheist. He must sound like a devout Catholic who thinks he's saving the Church from error. Make sure Bellarmine doesn't sound like a blind dogmatist. He must sound like a rigorous scholar who demands high evidentiary standards.

      *Refining the "Demonstration" point:* Galileo often claimed the tides were the "grand proof." Bellarmine would likely view this as speculative physics, not geometric demonstration like Archimedes.
      *Refining the "Faith and Morals" point:* Bellarmine argues that if Scripture says the sun moves, and the Fathers agree, denying it undermines Scriptural authority on *other* matters (like Resurrection). Galileo argues Scripture teaches "how to go to heaven, not how the heavens go."

  6.  **Writing the Dialogue (incorporating specific phrases/concepts):**
