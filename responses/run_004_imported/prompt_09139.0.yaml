      *   **Context:** Immediate aftermath of Bellarmine's 1615 letter to Paolo Antonio Foscarini (April 1615). This is *before* the formal Inquisition trial (1633) and before the 1616 decree, but tensions are high.
      *   **Key Themes:**
          1.  Hermeneutics of Scripture (Augustinian accommodation).
          2.  The standard of "demonstration" (proof) in natural philosophy vs. theological authority (Council of Trent, Consensus of the Fathers).
          3.  Whether heliocentrism touches "faith and morals."
      *   **Constraints:**
          *   Engage with actual arguments (no generic science vs. religion tropes).
