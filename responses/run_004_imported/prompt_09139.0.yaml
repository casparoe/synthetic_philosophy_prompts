answer: |-
  **Rome, April 1615**
  **The Private Study of Cardinal Robert Bellarmine, Collegio Romano**

  **Galileo:** Your Eminence. I thank you for receiving me. I have read your letter to Father Foscarini three times now. I confess, I searched for a condemnation and found instead a caution. That gives me hope.

  **Bellarmine:** Signor Galileo. Please, sit. I am glad you read it closely. It was not written to silence a mind such as yours, but to protect the Church from a scandal it does not yet need. You know my position is not one of hostility toward the new philosophy. I have seen the moons of Jupiter through your glass. I know they exist.

  **Galileo:** Then we begin on solid ground. In my *Letter to the Grand Duchess Christina*, which I know you have also reviewed, I argued precisely for the latitude you suggest. We are agreed, are we not, on the principle of accommodation? That the Holy Spirit speaks through Scripture in the language of the common people, not the technical tongue of the natural philosopher? When the Psalmist writes that the sun runs its course like a bridegroom, he describes appearance, not mechanism.

  **Bellarmine:** On this, we are entirely of one mind. I cited Augustine myself in my letter to Foscarini. If a physical truth were genuinely demonstrated, we would be obliged to reinterpret those passages to avoid making the Faith look foolish before the pagans. Truth cannot contradict truth. If the earth moves, and it is proven, then Scripture must be read as speaking phenomenologically. I would be the first to admit it.

  **Galileo:** Then the obstacle is not theological, but epistemological. You doubt the proof.

  **Bellarmine:** I doubt the *demonstration*. There is the rub, Galileo. In mathematics, a demonstration is absolute. Two plus two is four. In natural philosophy, to overturn the common sense of mankind and the unanimous consent of the Fathers, the proof must be of that same geometric necessity. You offer hypotheses that save the phenomena better than Ptolemy. I grant you that. The Copernican arrangement is elegant. It simplifies the calculations. But to say the earth *actually* moves? That is a leap from mathematical utility to physical ontology.

  **Galileo:** It is not a leap, Eminence. It is a inference from physical necessity. Consider the tides. The ebb and flow of the seas cannot be explained by the moon's attraction or subterranean vapors. It is the sloshing of water caused by the dual motion of the earth—rotation and revolution. This is not a hypothesis to save appearances; it is a causal mechanism. If the earth were stationary, the tides would not exist as they do. Is that not a demonstration?

  **Bellarmine:** It is a compelling argument, I concede. But is it a demonstration in the strict sense? Could there not be another cause for the tides that we have not yet conceived? God's power is infinite; our understanding of secondary causes is finite. To claim absolute certainty where another explanation might theoretically exist is to risk the very scandal we wish to avoid. If you assert the earth moves as a proven fact, and tomorrow a new argument arises showing it does not, the Church's credibility in Scripture is damaged.

  **Galileo:** But we cannot suspend judgment forever! If we wait for a proof that admits no shadow of a doubt, we will never speak on nature. You say you would reinterpret Scripture if the proof were certain. But who decides when certainty is reached? If I show you the phases of Venus, which prove Venus orbits the sun, and the sunspots, which show the sun rotates, does the weight of evidence not accumulate to a moral certainty?

  **Bellarmine:** Moral certainty is sufficient for daily life, Galileo. It is not sufficient to overturn the *Consensus Patrum*. And this brings us to the second, perhaps more difficult, point. You treat the motion of the earth as a matter of physics alone. I say it touches faith and morals.

  **Galileo:** How can the mechanics of the spheres touch morals? I am not preaching against the sacraments.

  **Bellarmine:** The Council of Trent is clear. In matters of faith and morals, Scripture is not to be interpreted against the unanimous consent of the Fathers. Now, you say the Fathers spoke only on salvation. But they spoke on the cosmos as part of the created order. When Joshua commanded the sun to stand still at Gibeon, the miracle relies on the sun moving, not the earth. If the earth is already moving, and the sun stationary, the miracle changes its nature entirely. It becomes a stopping of the earth's rotation.

  **Galileo:** And why is that a problem? God could stop the rotation just as easily as He could stop the sun's orbit. The miracle remains a miracle.

  **Bellarmine:** The problem is not the power of God, but the authority of the text. All the Fathers, without exception, read Joshua as the sun moving. If we say they were wrong on this, on what grounds do we say they are right on the Resurrection? If Scripture is accommodated to the point where its literal sense is never to be trusted on physical matters, where does the accommodation end? Does it end at the stars? Or does it extend to the waters of the Flood, or the rib of Adam?

  **Galileo:** I argue for accommodation only where the text is clearly using metaphorical language to convey spiritual truth. The purpose of Scripture is to teach us how to go to heaven, not how the heavens go. To insist the earth is stationary because of Joshua is to bind the Holy Spirit to the cosmology of the Bronze Age. It makes the Faith a prisoner of outdated physics.

  **Bellarmine:** And I argue that to insist the earth moves without absolute demonstration is to bind the Faith to the physics of the seventeenth century. What if *your* physics is outdated, Galileo? I am not defending Aristotle. I am defending the stability of Revelation. If you make the Copernican system an article of faith now, and it is later disproven, you have made the Church a liar. If you keep it as a hypothesis, you lose nothing. You can do your math, you can predict the planets, but you speak *ex hypothesi*.

  **Galileo:** But Eminence, to speak *ex hypothesi* when one knows the truth is a lie. I have seen the evidence. To ask me to treat a truth as a fiction is to ask me to deny the reason God gave me. If the earth moves, it is a fact of creation. To hide that fact is to hide the glory of God's work.

  **Bellarmine:** And if you are mistaken? Humility, Signor Galileo. That is the virtue I urge. Not humility before Aristotle, but humility before the limits of human reason. We share the same premise: Truth cannot contradict Truth. But you are certain you hold the scientific truth. I am certain that without geometric necessity, we cannot risk the theological truth.

  **Galileo:** So we are at an impasse. You require a proof that I believe I have already given.

  **Bellarmine:** Precisely. If you can demonstrate the earth's motion as one demonstrates the properties of a triangle, I will stand with you. I will argue for the reinterpretation of Joshua before the Pope myself. But until then, as a matter of prudence, and to preserve the unity of the Church on matters where the Fathers speak with one voice, you must refrain from asserting it as dogma.

  **Galileo:** And if the cost of that prudence is the stagnation of truth?

  **Bellarmine:** Then we bear that cross, as we bear many others. But I do not believe truth will stagnate. I believe you will continue to look through your glass, and I will continue to read Augustine. Perhaps, in God's time, the proof will become as clear as the moons of Jupiter. Until then, let us not force a marriage between Science and Scripture where there is yet no dowry of certainty.

  **Galileo:** *(Rising slowly)* You are a fair man, Cardinal Bellarmine. You do not fear the light. You only fear we are lighting a torch in a room full of gunpowder.

  **Bellarmine:** *(Standing)* And you, Galileo, are a devout son of the Church. You do not seek to burn the house down. You only wish to open the windows. Let us pray that the air outside is as fresh as you believe it to be.

  **Galileo:** I shall continue to observe.

  **Bellarmine:** And I shall continue to pray. And to read.

  *(They bow to one another. The distance between them is small, physical, but the intellectual gulf remains unbridged.)*
