      *   **Tone:** Scholarly, respectful but firm, historically plausible (though imagined).

  2.  **Historical & Intellectual Context Check:**
      *   *Galileo's Position (1615):* He believes he has strong proofs (tides, sunspots, phases of Venus), though modern historians note the "proofs" weren't actually conclusive demonstrations by Aristotelian standards (no stellar parallax observed yet). He argues Scripture speaks phenomenologically.
      *   *Bellarmine's Position (1615):* He is a Jesuit, a brilliant theologian, and open to new science *if* proven. He distinguishes between "saving the phenomena" (mathematical hypothesis) and asserting physical reality. He holds that without strict demonstration, one cannot overturn the Consensus Patrum (Consent of the Fathers) on scriptural interpretation regarding faith/morals.
      *   *Shared Ground:* Both are Catholics. Both respect Augustine. Both agree: *If* science is certain, Scripture must be reinterpreted. *If* science is uncertain, Scripture stands.
      *   *The Pivot:* Is the Copernican system *certain*? Does it impinge on *faith/morals*?

  3.  **Drafting - Scene Setting:**
      *   Location: Rome, perhaps Bellarmine's study or a neutral garden. Let's go with a private chamber in the Jesuit College (Collegio Romano), where Galileo had previously shown his telescope.
      *   Atmosphere: Civil, intellectual, slightly tense but courteous.

  4.  **Drafting - The Dialogue Structure:**
      *   **Opening:** Acknowledge the letters. Establish mutual respect.
