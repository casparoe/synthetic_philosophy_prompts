answer: |-
  # The Continuity Clause

  The courtroom was located at Meridian Zero, the administrative seam where the end of the Annulus met the beginning. From the high bench, Magistrate Kaelen could look out the armored glass and see the curvature of the habitat ring. To his left lay Sector 1, the Baseline District, where the air was Earth-standard and the gravity was a nostalgic 1G. To his right lay Sector 360, the Terminal District, where the air was thick with oxygen and the gravity was tuned for high-density labor.

  They were neighbors. You could walk from the plaza of Sector 1 to the market of Sector 360 in ten minutes. But you could not breathe in both.

  Kaelen adjusted his respirator—a habit, not a necessity for him—and looked down at the claimant.

  Elara of Sector 360 stood before the bench. She was tall, her bone density visibly higher than the Baseline norm, her skin possessing the faint, iridescent sheen of the UV-filtering dermal grafts common in the Terminal District. She looked human. She spoke the Common Tongue, though with the clipped, tonal cadence of the 300s.

  "The Trust," Kaelen said, his voice amplified by the room's acoustics, "was established by the Founder, Hideo Vance, in Year 1. The charter states that the principal inheritance is reserved for 'Hideo Vance's direct biological descendants of unbroken Baseline stock.'"

  Elara did not flinch. "I am Hideo Vance's direct biological descendant. My mother was Sector 359. Her mother was Sector 358. The chain goes back, generation by generation, to Hideo himself in Sector 1."

  "The chain is not in dispute," Kaelen said. He tapped the datapad on his bench. "The Registry confirms every birth certificate. Every transfer of citizenship between adjacent sectors is valid. Sector 1 recognizes Sector 2. Sector 2 recognizes Sector 3. This continues until Sector 359 recognizes Sector 360."

  "Then the recognition is total," Elara said. "I am a citizen of the Annulus. I am an heir of Vance."

  "But Sector 1 does not recognize Sector 360," Kaelen countered. "And Sector 360 does not recognize Sector 1. We are at the Seam. Biologically, Elara, your gametes are incompatible with a Baseline from Sector 1. Your immune system would reject our pathogens; ours would incinerate yours. By the Biological Definition of Species adopted by the High Council in Year 80, you and the Founder are reproductively isolated."

  Elara stepped forward. The gravity in the well was set to 1G, and Kaelen saw the micro-tremor in her leg muscles as she adjusted to the lighter pull.

  "Magistrate, if you take a single step from Sector 1 to Sector 2, are you a different species?"

  "No."

  "And from 2 to 3?"

  "No."

  "Then at what step did humanity end?" She gestured to the window, to the ring stretching away in both directions. "There is no cliff here. There is only a slope. If you say I am not human enough to inherit, you must identify the sector where the humanity stopped. Was it Sector 50? Sector 200? If you cannot name the sector, you cannot name the crime."

  This was the Sorites heap, made flesh and blood. Kaelen had studied the philosophy of biology during his training, back when he was still a clerk in Sector 10. He remembered the old Earth texts about salamanders encircling valleys. It had seemed like a logic puzzle then. A parlor trick for undergraduates.

  Now, Elara was standing in his court, asking for the rights to a fortune that controlled the water filtration for three million people, and the logic was a noose around his neck.

  "The law requires a boundary," Kaelen said. "Jurisprudence cannot function on gradients. It requires binaries. Guilty or innocent. Heir or stranger. Human or non-human."

  "The law is a map," Elara said softly. "The territory is the biology. If your map says there is a wall where there is only a hill, the map is wrong. Not the hill."

  The Defense Attorney, a man from Sector 5 named Corin, stood up. He looked baseline. Soft skin, standard lung capacity. He looked at Elara with the pity one might show a well-trained dog.

  "Magistrate, the 'Neighbor Principle' is a administrative convenience for trade and travel," Corin argued. "It allows a merchant from Sector 20 to sell goods in Sector 21 without a visa. It was never intended to confer ontological status. Just because Sector 100 accepts Sector 101 does not mean Sector 1 accepts Sector 101. Transitivity fails. It is a known logical failure in ring topologies."

  "It is not a logical failure," Elara snapped, her composure cracking for the first time. "It is a biological fact. We are one population. We share a culture. We share a history. We share a lineage. The only thing we do not share is the ability to breed across the Seam without medical intervention. Is that the test? Fertility? If I marry a man from Sector 1 and we require IVF to conceive, I am a stranger? If we use a respirator to visit, I am an alien?"

  Kaelen looked at the datapad again. He had the authority to rule. But the precedent was empty. There had never been a case where the ring closed. Usually, disputes were local. Sector 12 vs. Sector 13. In those cases, the continuity was obvious. Here, the continuity was global, but the compatibility was local.

  If he ruled for Elara, he invalidated the Baseline Charter. He admitted that the "Humanity" of Sector 1 was not a fixed state, but a drifting concept. If Elara is Vance's heir, then the definition of "Vance's heir" has drifted so far that it no longer resembles Vance. The Trust would be open to anyone in the Annulus, eventually. The assets would be diluted. The life-support contracts would be voided.

  If he ruled against Elara, he had to specify where the lineage broke. If he said Sector 360 is out, what about Sector 359? They are 99% compatible with 360. If 359 is in, and 360 is out, then the difference between 359 and 360 is the difference between inheritance and destitution. But 359 and 360 are neighbors. They interbreed freely. To draw the line there would be to punish a biological accident of geography.

  "Magistrate?" Corin prompted. "The Council expects a ruling before the cycle ends."

  Kaelen stood up. He walked to the window. Below, in the plaza, he could see people from Sector 1 and Sector 360 mingling. They wore different suits, different respirators. They laughed together. They traded. They were friends. But they could not go to each other's homes. They could not share a meal without checking the atmospheric seals.

  They were the same, and they were not.

  Kaelen turned back to the court. He felt the weight of the gavel. It was a piece of wood from Sector 1. Earth-wood. It would rot in Sector 360's humidity.

  "The Court acknowledges the continuity of the lineage," Kaelen said. "There is no break in the chain of birth. There is no break in the chain of law."

  Elara exhaled, a sound of relief.

  "However," Kaelen continued, "the Charter specifies 'Baseline Stock.' This is a static definition anchored to Year 1. While the population has remained continuous, it has not remained static. The definition of 'Baseline' is fixed to the phenotype of Sector 1."

  "That is arbitrary!" Elara shouted. "It privileges the start of the circle over the end!"

  "It is the law," Kaelen said. He felt sick. He was drawing a line in the sand, knowing the tide would wash it away, but needing the line to exist for the next five minutes. "The Court finds that while you are a citizen of the Annulus, you are not a beneficiary of the Baseline Trust. The continuity of the population does not guarantee the continuity of legal status across a reproductive barrier."

  "So I am a stranger in my own home," Elara said. Her voice was flat.

  "You are a neighbor," Kaelen corrected. "But you are not kin. Not in the eyes of the Charter."

  "On what basis?" Elara demanded. "Show me the generation where the humanity died. Show me the parent who was human and the child who was not. If you cannot, this is not justice. This is violence."

  Kaelen looked at her. He knew she was right. He knew that if he walked out of this courtroom, went to Sector 359, then 358, all the way around to Sector 1, he would find no break. He would find only a slow, gradual turning of a page until the text was unreadable to the first reader.

  But he had to sign. The system required a binary output.

  "The ruling stands," Kaelen said. He brought the gavel down.

  It made a solid, dry crack. Earth-wood on a synthetic block.

  Elara did not move. She just looked at him, and then at the window, at the ring that enclosed them all. "You have drawn a border where there is no land," she said. "One day, Magistrate, the water will rise. And when it does, you will find that your borders do not float."

  She turned and left the courtroom. She would have to pass through the airlock to get to her sector. She would have to seal her suit. She would have to leave the gravity of her birth behind to go home.

  Kaelen sat back down. The clerk handed him the next file. A dispute over water rights between Sector 14 and Sector 15. A simple case. Clear continuity. Clear compatibility.

  Kaelen opened the file, but he didn't read it. He looked at his own hand. He was from Sector 12. He was Baseline enough. But his grandfather was from Sector 8. His grandmother from Sector 15.

  He wondered, if he walked far enough in either direction, would he meet a version of himself he could not shake hands with? And if he did, which one would the law allow to breathe?

  He picked up the pen. He had to draw the line somewhere. He just hoped, for the sake of the next man who stood where Elara had stood, that the line would hold.

  But as he signed the order, he knew it wouldn't. The ring was closed. The paradox was real. And he was just the man paid to pretend it wasn't.
