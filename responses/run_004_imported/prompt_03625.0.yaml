  6.  **Refine the Argument (Self-Correction/Nuance Check):**
      *   *Correction:* Did Davidson say *human* language specifically? He said "language." But he often implied human language. I need to be careful not to conflate the two. If whales have a language with truth-conditions, Davidson *might* concede. But he doubts non-humans have that.
      *   *Nuance on AI:* Davidson cares about the *Principle of Charity*. An AI optimizes for prediction accuracy, not necessarily for making the speaker rational/true. This is a key distinction.
