answer: |-
  This is a fantastic objection. You are definitely onto something, and it is philosophically robust enough to be the crux of a seminar presentation. In fact, you have put your finger on the exact nerve that caused the "Dutch Book Wars" of the 90s to fizzle out into more nuanced discussions of epistemic utility and planning norms.

  To answer your specific questions immediately:
  1.  **Are you onto something?** Yes. This is the "Triviality" or "Emptiness" objection to Reflection.
  2.  **Is it known?** Yes, but your specific framing (focusing on the loss of *formality/structural neutrality*) is a very sharp pedagogical way to package it. It aligns closely with critiques by **Patrick Maher (1992)** and **David Christensen (1991)**, though they focus slightly more on the Dutch Book mechanics than the "formal constraint" aspect.
  3.  **Should you cite it?** You should absolutely cite the lineage (Maher/Christensen/van Fraassen's replies), but you can still present the *argument* in your own words because your focus on the "structural vs. substantive" distinction is a great teaching hook.

  Here is a point-by-point poke at the argument, including the defenses a van Fraassenian might mount, and the literature you need to footnote.

  ---

  ### 1. The "Formal" Status of Probabilism (The Comparison Class)
  **Your Claim:** Reflection is sold as a formal constraint like Probabilism.
  **The Poke:** Is Probabilism actually "subject-matter neutral" in the way you imply?
  *   **The Defense:** A van Fraassen defender (or a Joyce-style epistemic utility theorist) might argue that Probabilism isn't purely structural either; it presupposes that the agent's options are closed under truth-functional connectives and that the agent cares about accuracy.
  *   **The Nuance:** However, Probabilism is *synchronic*. It evaluates a state at $t$. Reflection is *diachronic*. To evaluate a diachronic constraint, you necessarily need to evaluate the *transition* between $t$ and $t'$.
  *   **The Hit:** You are right that diachronic constraints cannot be purely structural in the same way synchronic ones are. A synchronic constraint checks for static inconsistency. A diachronic constraint checks for dynamic consistency. To know if a dynamic transition is consistent, you need a rule for what counts as a "valid move" (like a rule of inference). If Reflection *is* that rule, it can't also be the test for whether the rule was followed.
  *   **Citation:** **Patrick Maher, "Diachronic Rationality" (1992)**. Maher argues explicitly that diachronic norms are not coherence norms in the same sense as synchronic ones.

  ### 2. The Restriction: Ceteris Paribus or Definition?
  **Your Claim:** Restricting Reflection to "rational updating" makes it dependent on an independent standard.
  **The Poke:** Van Fraassen might argue the restriction isn't an *external* check, but an *internal* idealization.
  *   **The Defense:** Van Fraassen often treats Reflection as a principle for an *ideal* agent. The principle says: "If you regard your future self as a rational updater, defer to them." The "rational updating" clause isn't a condition you check from the outside; it's part of the supposition. If you know you are going to be brainwashed, the antecedent ("I am certain my future credence will be $r$ *via rational updating*") is false, so the principle doesn't apply.
  *   **The Hit:** This leads to your redundancy point. If the antecedent requires me to know that my future update is rational, I must already possess the standard of rationality that Reflection is supposed to provide. If I know I'm updating rationally, I presumably know I'm Conditionalizing. If I know I'm Conditionalizing, Reflection is a theorem, not an axiom.
  *   **Citation:** **David Christensen, "Clever Bookies and Coherent Beliefs" (1991)**. Christensen argues that the Dutch Book argument for Reflection only works if we assume the agent is already committed to Conditionalization.

  ### 3. Redundancy vs. Constitutivity
  **Your Claim:** Once you have the standard for rational updating, Reflection adds no independent constraint.
  **The Poke:** Is Reflection meant to *replace* Conditionalization or *ground* it?
  *   **The Defense:** Some defenders (like **Briggs 2009**) argue Reflection is more fundamental than Conditionalization. They try to derive Conditionalization *from* Reflection (plus some other assumptions). If Reflection is the bedrock, then it's not redundant; Conditionalization is the derivative concept.
  *   **The Hit:** But to derive Conditionalization from Reflection, you need to assume Reflection holds in *all* cases of evidence acquisition. As soon as you admit exceptions (memory loss, etc.), you need a independent story about *why* those are exceptions. That story usually appeals to... Conditionalization (or lack thereof). This creates a circle. You need Conditionalization to define the scope of Reflection, but you want Reflection to justify Conditionalization.
  *   **Citation:** **Rachael Briggs, "Disturbing Implications of a Conservatism Principle" (2009)**. She explores the tension between Reflection and Conditionalization.

  ### 4. The Dutch Book Residue
  **Your Claim:** The Dutch Book argument dresses up a substantive norm as a structural one.
  **The Poke:** Does the Dutch Book still bite in the restricted cases?
  *   **The Defense:** Even if restricted, the Dutch Book shows that violating Reflection in *allowed* cases makes you susceptible to a sure loss. That suggests a genuine inconsistency in your planning.
  *   **The Hit:** The "sure loss" only exists if you are committed to acting on your future credences. If the norm is merely "don't hold these credences," the Dutch Book doesn't apply (as **Christensen** and **Maher** famously argued). The Dutch Book only works if you assume the agent is forced to bet at both $t$ and $t'$. If the agent can just refuse to bet at $t'$, there is no book. Thus, the "incoherence" is actually a pragmatic inconsistency about *betting policies*, not a purely epistemic inconsistency about *credences*.
  *   **Citation:** This is the core of the **Christensen/Maher** critique of Diachronic Dutch Books.

  ### Summary of the Literature Map for Your Handout
  You are effectively reconstructing the **"Coherence vs. Correspondence"** debate regarding diachronic norms.

  *   **Van Fraassen (1984):** Introduces Reflection as a coherence principle.
  *   **Christensen (1991) & Maher (1992):** Argue that diachronic Dutch Books do not prove incoherence; they prove pragmatic inconsistency, and Reflection relies on substantive assumptions about evidence.
  *   **Arntzenius (2003):** "Some Problems for Conditionalization and Reflection." Shows cases where even rational updating violates Reflection (e.g., when evidence is lost but not forgotten, or when the "partition" shifts).
  *   **Schoenfield (2014):** "Permission to Believe." Discusses how Reflection interacts with permissivism.

  ### Pedagogical Advice for the Seminar
  Since this is a TA presentation, you want to avoid getting bogged down in the math of the Dutch Book and keep the focus on the *conceptual* worry you raised.

  1.  **Frame it as "The Scope Problem":** Start with the Brainwashing case. Get the class to agree Reflection needs a restriction.
  2.  **Introduce your "Formality" Worry:** Ask: "If we add the restriction 'provided you update rationally,' have we explained anything? Or have we just pushed the problem back to defining 'rational updating'?"
  3.  **The "Independent Standard" Trap:** Show that if 'rational updating' = Conditionalization, Reflection becomes a theorem. If 'rational updating' is something else, what is it?
  4.  **Conclusion:** Conclude that Reflection is best understood not as a *freestanding coherence constraint* (like Probabilism), but as a *planning norm* that is entangled with our theory of evidence.

  ### Verdict
  **Do not scrap this.** It is a known criticism, but it is the *right* criticism. The fact that it appears in the literature (Maher/Christensen) validates it, but your formulation regarding the loss of "structural neutrality" is a very clear way to explain *why* those earlier critiques matter.

  **One caveat:** Be prepared for a student (or professor) to say: "But van Fraassen never claimed it was purely structural; he claimed it was a principle of *opinion*."
  **Your Reply:** "If it's a principle of opinion that only applies when opinions change in specific, substantively-defined ways, it ceases to function as a general test of rationality and becomes a specific claim about how evidence *ought* to work. That shifts it from Formal Epistemology to Substantive Epistemology."

  You're good to go. Just make sure to drop the Christensen (1991) and Maher (1992) citations so they know you've done the reading on the reading.
