      *   **Relationism (R) / Sophisticated Substantivalism:** Spacetime is constituted by relations between events/fields. Diffeomorphic models represent the *same* physical state.
          *   *Vulnerability:* Accusations of instrumentalism or "defining away" reality. If points aren't real, what carries the metric? What grounds the topology?
