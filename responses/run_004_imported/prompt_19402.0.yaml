  Actually, the strongest "real comeback" for a Substantivalist against Earman/Norton is often to deny the premise that Leibniz Equivalence is required for determinism, OR to argue that the "indeterminism" is merely haecceitistic (about *which* point is which) and not qualitative, so it doesn't affect physics. Let's use that. It's subtle and fits a PhD level discussion.

