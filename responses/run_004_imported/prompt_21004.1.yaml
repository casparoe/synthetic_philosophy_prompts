answer: |-
  **Title:** The Limits of Formalism: Harsanyi's Aggregation Theorem and the Normative Foundations of Utilitarianism

  **Introduction**

  John Harsanyi's 1955 aggregation theorem remains one of the most seductive results in social choice theory. It promises to bridge the is-ought gap in distributive ethics using the tools of decision theory: if individual preferences and social preferences satisfy the von Neumann-Morgenstern (VNM) axioms of rationality under risk, and if the social evaluator respects a minimal Pareto condition, then social welfare must be represented as a weighted sum of individual utilities. For Harsanyi and later proponents like John Broome, this looks like a vindication of utilitarianism derived from the very concept of rationality. It suggests that to reject utilitarian aggregation is to commit a formal inconsistency.

  However, the normative weight of this theorem is contested. Critics such as Amartya Sen and Peter Diamond argue that the theorem's premises are not morally neutral. Sen charges that the theorem equivocates on the concept of utility, while Diamond argues that it ignores the moral significance of fair procedures, exposing a fatal tension between *ex ante* and *ex post* evaluations of welfare. This essay evaluates whether Harsanyi's theorem provides a robust foundation for utilitarianism or whether it merely systematizes utilitarian assumptions under the guise of formal necessity. I argue that while the theorem is mathematically valid, it fails as an independent moral justification for utilitarianism. Its premises smuggle in substantive normative commitments that a non-utilitarian need not accept. Furthermore, the tension between *ex ante* and *ex post* Pareto principles cannot be mathematically resolved; it must be lived with by making a prior moral choice, one that typically undermines the Harsanyiian derivation.

  **The Rationalist Case for Aggregation**

  To appreciate the force of Harsanyi's argument, we must state it in its strongest form. The argument is not merely mathematical; it is grounded in a specific conception of the good. Harsanyi assumes that individual utility functions are VNM indices, representing rational preferences over lotteries. The crucial normative premise is the Pareto principle: if every individual prefers lottery $L$ to lottery $M$, society ought to prefer $L$ to $M$.

  Proponents like Broome defend this by arguing that "good" is analytically linked to rational preference. If we accept that individuals are the sovereign judges of their own welfare, and we accept that social rationality should mirror individual rationality (coherence), then the linear aggregation of utilities follows inevitably. On this view, the theorem does not beg the question; it reveals the structural implications of taking individual rationality and social respect seriously. If you want to respect individual preferences under risk (VNM) and respect unanimous agreement (Pareto), you *cannot* be a prioritarian, an egalitarian, or a sufficientarian without violating basic consistency constraints. The additive structure is not an artifact; it is the only functional form that preserves the ordinal and risk properties of the inputs. For the Harsanyiian, the burden of proof lies on the critic to explain why social choice should be *less* rational than individual choice.

  **Sen's Measurement Objection**

  Amartya Sen's objection strikes at the interpretability of the variables in Harsanyi's equation. The theorem concludes that social welfare $W$ is an affine transformation of $\sum a_i u_i$. However, VNM utility functions are unique only up to positive affine transformations ($u' = au + b$). To sum individual utilities meaningfully, we must fix the zero points and the units of measurement across different persons. We need to know not just that Person A prefers $x$ to $y$, but whether A's gain from $x$ is "larger" than B's loss from $y$.

  Sen argues that Harsanyi trades on an equivocation. In the VNM axioms, "utility" measures an individual's attitude toward risk (e.g., risk aversion). In utilitarian ethics, "utility" measures interpersonal welfare or well-being. These are not the same. A person might be risk-averse regarding income not because the marginal welfare of income diminishes, but because they are psychologically cautious. If we sum VNM indices, we might be aggregating risk attitudes rather than welfare levels.

  Harsanyians reply that we can normalize the scales (e.g., setting the worst outcome to 0 and the best to 1 for everyone). But Sen counters that this normalization is arbitrary. It assumes that the "distance" between the worst and best life is the same for everyone, which is a substantive ethical claim, not a formal one. Consequently, the theorem does not deliver utilitarianism "for free." It delivers a formal structure that *looks* like utilitarianism but lacks the interpersonal comparability required to make it a theory of distributive justice. Without an independent account of why individual utility scales are comparable, the theorem is normatively empty.

  **Diamond's Fairness Objection and the Pareto Tension**

  Peter Diamond's 1967 critique targets the Pareto premise itself, specifically in the context of risk and fairness. Consider a case where an indivisible benefit must go to one of two equally situated people. Option A: Give it to Person 1. Option B: Give it to Person 2. Option C: Toss a fair coin.

  If Person 1 and Person 2 both prefer the coin toss (Option C) to a dictator's assignment (Option A or B), perhaps because they value the equal *chance*, the *ex ante* Pareto principle requires society to prefer the toss. Harsanyi's framework accommodates this. However, Diamond points out a deeper conflict. Suppose the coin is tossed, and Person 1 wins. In the *ex post* realization, the outcome is identical to Option A. If we care about fairness, we might value the *procedure* of the toss even if the *ex post* distribution is unequal.

  More technically, Diamond showed that you cannot simultaneously satisfy: (1) VNM rationality for society, (2) *Ex Ante* Pareto (respect preferences over lotteries), and (3) *Ex Post* Pareto (respect preferences over certain outcomes in every state). Mongin (1995) later generalized this impossibility. Harsanyi's theorem relies on *Ex Ante* Pareto. But *Ex Ante* Pareto can conflict with distributive fairness. If two people have different risk attitudes, *Ex Ante* Pareto might require a social lottery that exacerbates inequality in every possible state of the world, provided it satisfies their risk preferences.

  For Diamond, the Harsanyi framework is "normatively thin" because it reduces fairness to expected utility. It cannot capture the moral value of a fair procedure independent of the outcomes it produces. If the theorem forces us to choose between *Ex Ante* Pareto and our considered judgments about fairness (like the value of a coin toss), the theorem should be rejected, not our judgments.

  **The Verdict on the Ex Ante/Ex Post Tension**

  This brings us to the crux of the matter: can the tension between *ex ante* and *ex post* ways of honoring the Pareto principle be resolved? The mathematical literature is clear: within the VNM framework, they are incompatible. One must be dropped. Therefore, the tension cannot be *resolved* formally; it must be *lived with* substantively.

  We must decide which principle is more fundamental to justice. Harsanyi prioritizes *Ex Ante* Pareto because it aligns with the sovereignty of individual preferences over risk. However, in distributive ethics, the *Ex Post* perspective often carries more moral weight. We care about who actually ends up worse off, not just what their chances were. If a policy maximizes expected utility for everyone but leaves a specific minority destitute in every realized state, *Ex Ante* Pareto endorses it, but *Ex Post* scrutiny condemns it.

  To resolve the tension in favor of Harsanyi is to assume that risk is the only morally relevant feature of distribution. To resolve it against him is to acknowledge that fairness constraints (like ex post equity) can legitimately override unanimous preferences over lotteries. Given that the seminar focuses on *distributive* ethics, the *Ex Post* perspective is indispensable. Therefore, the *Ex Ante* Pareto principle, which is the engine of Harsanyi's theorem, must be regarded as conditional, not absolute.

  **Conclusion**

  Does Harsanyi's aggregation theorem give us good reason to accept utilitarianism? On balance, the argument fails to provide an independent justification. It succeeds only as a conditional claim: *if* you accept VNM rationality as the sole criterion of social goodness, *if* you accept that individual utility scales are interpersonally comparable, and *if* you prioritize *Ex Ante* preferences over *Ex Post* outcomes, *then* you must be a utilitarian. But each of these "ifs" is a substantive moral commitment that a non-utilitarian can reasonably reject.

  Sen is correct that the theorem conflates risk-attitude indices with welfare measures, rendering the additive structure potentially meaningless without extra-theoretical assumptions about comparability. Diamond is correct that the reliance on *Ex Ante* Pareto blinds the theory to the moral value of fair procedures and realized outcomes.

  Therefore, the tension between *ex ante* and *ex post* Pareto cannot be resolved within the formalism; it must be lived with by making a moral choice. In the context of distributive justice, that choice should favor *Ex Post* considerations. Once we acknowledge that *Ex Ante* Pareto can be overridden by fairness, the necessity of Harsanyi's utilitarian conclusion dissolves. The theorem is a powerful tool for systematizing utilitarian beliefs, but it is not a proof of them. It demonstrates that utilitarianism is coherent, not that it is true. For the graduate seminar, the lesson is not that formal methods vindicate utilitarianism, but that formal methods reveal exactly where the substantive moral disagreements lie: in the measurement of welfare, the comparability of lives, and the moral significance of risk.
