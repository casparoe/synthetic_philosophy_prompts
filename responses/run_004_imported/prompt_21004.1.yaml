      *   *The Utilitarian Leap:* Harsanyi assumes equal weights (via the "veil of ignorance" argument in his *cardinal utility* paper, though the Aggregation Theorem itself allows unequal weights). For the seminar context, the focus is on the *aggregation* form (additive) rather than the *weights* (equal), but the move from "additive" to "utilitarian" requires interpersonal comparability.
      *   *Sen's Critique:* VNM utility is unique only up to positive affine transformations ($u' = au + b$). To sum them ($W = \sum a_i u_i$), we need to fix the zeros and units across persons. The theorem doesn't do this. It assumes what it needs to prove (interpersonal comparability). Also, VNM utility measures risk attitude, not necessarily well-being intensity.
      *   *Diamond's Critique:* Focuses on fairness under risk. Two states, two people. Option 1: Person 1 gets benefit (Utility: 1, 0). Option 2: Person 2 gets benefit (Utility: 0, 1). Option 3: Coin toss (Utility: 0.5, 0.5). Harsanyi's ex ante Pareto says if individuals prefer the toss (because they value the *chance*), society should too. But Diamond argues the *ex post* distribution matters. A sure assignment is unfair; a toss gives ex ante fairness. Harsanyi's framework struggles to capture the moral value of the procedure itself if it conflicts with ex ante preferences or if the theorem forces indifference where we see a difference. Actually, Diamond's specific point is often that Harsanyi's framework implies indifference between a sure thing for one and a coin toss if expected utilities are identical, ignoring the value of "fair chances."
