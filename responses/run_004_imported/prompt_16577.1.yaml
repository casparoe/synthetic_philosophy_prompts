answer: |-
  For those of you who don't know, I'm the family novelist. It's a title that sounds complimentary, but in this house, it usually means "the one who is professionally allowed to lie." When we argue about what happened at Thanksgiving 1999, my opinion carries less weight because I'm known for making things up. For a living.

  But my grandmother didn't make things up. Especially not for the last six years.

  As many of you know, Alzheimer's took pieces of her, bit by bit. It's a cruel thief. But what I want to talk about today is how she fought back. Not with medicine, and not with denial, but with a fat, green spiral notebook.

  She carried it everywhere. If you told her something, if she saw something, if she took a pill, she wrote it down. Immediately. And here is the important part: she trusted it completely. If we told her, "Grandma, you already ate," but the book said *Lunch: 12:30*, she believed the book. She didn't check her memory against the book. She checked her memory against the book, and if they disagreed, she assumed her head was wrong.

  My cousin, who is currently getting a PhD in philosophy and has read far more than any of us want to about how the human brain works, told me something this week. She said there's a theory that when you rely on a tool that completely, when you trust it as much as you trust your own neurons, it stops being a tool. It becomes part of your mind.

  It's not a metaphor. It's not poetry. It's the idea that for the last six years, my grandmother's mind wasn't just the biological tissue inside her skull. Her mind was the tissue *plus* the green notebook.

  I love that idea. Not because it makes me feel better about her being gone—I know she's gone. The notebook doesn't have a soul. But it does something else for me. It changes how I see those last six years.

  We often look at dementia as a subtraction. A losing of self. But watching her use that book, I didn't see someone losing her mind. I saw someone rebuilding it. She was constructing a new kind of thinking, a hybrid of biology and paper and ink. She was saying, "I may not be able to hold this truth inside me anymore, but I can hold it right here."

  And she was rigorous about it. She never doubted an entry. She never cross-checked. She gave that book the authority of her own consciousness. In a way, she was more honest than the rest of us. We lie to ourselves about what we remember all the time. We polish our memories until they shine. She didn't have that luxury. If it wasn't written down, it hadn't happened. If it was written down, it was fact.

  There is a comfort in that, but I want to be careful with it. My cousin is sitting in the second row, and she will tell you later that the notebook wasn't magic. It was a cognitive prosthesis. When the pen stops, the thinking stops. I'm not standing here to tell you that she's still here in these pages.

  I'm standing here to tell you that she was whole for as long as she could write.

  She didn't surrender to the disease. She outsourced her memory so she could keep being who she was. She kept her appointments. She kept track of our birthdays. She kept track of who loved her. She built a scaffold out of paper to hold up her dignity, and it worked.

  I am a writer. I make worlds out of words. But she was the real one. She knew that words weren't for making things up. They were for keeping things true.

  The notebook is closed now. The system is offline. And that leaves the rest of us with the job she handled so beautifully. We don't have the green book. We have to carry it in our heads. We have to remember her not just as she was at the end, with the pen in her hand, but as she was for all the years before that, when her memory was her own.

  We have to be the memory now. We have to get it right. Not because we have to write it down, but because she taught us that the truth matters, even when it's hard to hold.

  Thank you.
