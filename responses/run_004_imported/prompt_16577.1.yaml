  2.  **Deconstruct the "Extended Mind Thesis" (Otto Case):**
      *   *The Case:* Otto has Alzheimer's. He uses a notebook to store information. Inga uses her biological memory. When they want to go to the museum, Otto checks the notebook, Inga recalls. Clark & Chalmers argue the notebook is *part* of Otto's cognitive process, not just an external aid. It functions exactly like biological memory.
