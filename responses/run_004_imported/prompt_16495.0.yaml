          *   Address Singer's "Shallow Pond" (fixed stopping points are arbitrary).
          *   Address Susan Wolf's "Moral Saints" (life needs room for non-moral projects).
          *   Address Non-Ideal Theory/Liam Murphy (Fair Share view vs. actual shortfall).
          *   *Crucial:* Be honest about the "convenience" of the Fair Share view when compliance is low.
