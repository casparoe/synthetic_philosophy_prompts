      *   *Murphy Point:* I need to make sure I don't just say "Murphy says fair share." I need to address the prompt's specific worry: "capping individual obligation at the fair-share level looks uncomfortably convenient precisely in the case that actually obtains."
      *   *Response:* Acknowledge that yes, it is convenient. But in a *voluntary association*, coercive moral demandingness leads to collapse. The "Fair Share" here isn't about global justice enforcement, but about the *sustainability of the movement*. If we demand the Ideal Share in a Non-Ideal world, we get no members. If we get no members, we get no good. Therefore, the Fair Share is instrumentally rational even if theoretically imperfect.

  5.  **Final Polish:**
