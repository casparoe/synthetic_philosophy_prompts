answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, Effective Giving Society
  **FROM:** Faculty Advisor
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Voting Membership Pledge Requirements

  You have asked for a philosophical assessment of our current deadlock regarding the voting membership pledge. We are torn between a maximalist view (the 10% pledge is too lenient), a compliance view (the 10% pledge is too demanding given low global participation), and a pragmatic desire to maintain membership numbers.

  After reviewing the exit interviews and the philosophical stakes, I recommend we **replace the single-tier pledge with a two-tier membership structure.** Voting membership should require a modest, time-limited pledge (e.g., 2% of gross income for five years post-graduation). The current 10% lifelong pledge should be retained as an optional, high-status "Fellow" designation. Existing members who have signed the 10% pledge should be automatically grandfathered into the "Fellow" tier, retaining full voting rights and public recognition.

  This recommendation attempts to navigate three specific philosophical tensions that underlie your disagreement.

  **1. The Arbitrariness of the Stopping Point (Singer)**
  The faction arguing that 10% is too low relies on a Singerian logic: if we accept the "shallow pond" premise—that we should prevent bad things from happening if the cost to us is less than the benefit to others—then any fixed percentage is morally arbitrary. Why stop at 10%? Why not 50%? Why not until marginal utility equals marginal cost? To treat 10% as *sufficient* risks moral complacency, allowing members to feel they have "done their part" while preventable suffering continues. This objection is theoretically sound. If our goal is strictly to maximize good, a fixed cap is difficult to defend.

  **2. The Moral Saints Objection (Wolf)**
  However, the faction arguing the pledge is too demanding invokes Susan Wolf's concern regarding "Moral Saints." Wolf argues that a life organized entirely around moral maximization leaves no room for the personal projects, relationships, and idiosyncrasies that make a life meaningful *to the person living it*. If we require the 10% lifelong pledge as a condition of participation, we effectively select for individuals willing to subordinate their non-moral interests to a degree that may be unsustainable for a typical student. By making sainthood a prerequisite for voting, we risk creating a sect rather than a society. We lose the ability to influence the many in favor of catering to the few.

  **3. The Fair Share and the Shortfall (Murphy)**
  This brings us to the hardest issue: Liam Murphy's "Fair Share" view. Murphy argues that in a non-ideal world where others do not comply with their moral duties, compliant agents are not required to pick up the slack. They owe only their "fair share" of what would be required under full compliance. The 10% pledge implicitly assumes a collective movement; without it, the individual sacrifice feels like covering a collective deficit.

  I must be honest about the weakness here. As you noted, capping obligation at the "fair share" looks uncomfortably convenient precisely when compliance is low. It allows the non-compliance of others to limit the moral obligations of the compliant. If the suffering exists regardless of who pays, does the unfairness of the distribution really mitigate the duty to relieve it? Strictly speaking, no.

  However, in the context of a *voluntary student organization*, Murphy's logic holds instrumental weight. If we set the entry bar at the "Ideal Share" (what would be required if everyone acted perfectly) in a non-ideal world, the organization collapses. If the society dissolves, our collective impact drops to zero. Therefore, setting the *mandatory* floor at a sustainable "Fair Share" is not an admission that the suffering doesn't matter; it is a recognition that we must maintain the agency of the moral actor to be effective over time. We cannot demand self-immolation as the price of membership.

  **The Recommendation**
  The tiered structure resolves this by separating *obligation* from *aspiration*.

  1.  **Voting Member (The Floor):** Requires a 2% income pledge for five years post-graduation. This satisfies the Singerian demand that membership requires *some* tangible sacrifice (avoiding empty talk) but respects the Wolfian constraint that members need room to build careers and lives. It aligns with Murphy by not asking members to single-handedly fix global systemic failures.
  2.  **Fellow (The Aspiration):** The 10% lifelong pledge becomes an honors track. This satisfies the maximalists by keeping the rigorous standard alive and visible, without making it a coercive barrier to entry.
  3.  **Transition:** Current pledgers are honored as Founding Fellows. To ask them to lower their pledge now would break trust; to force new members to match it immediately is exclusionary.

  This policy admits that while we may have a moral reason to give until it hurts, we cannot build a durable institution on that requirement alone. We must build a floor that holds, and a ceiling that inspires.

  Please vote on this tiered proposal at the next meeting. I am available to discuss the transition logistics for current members beforehand.
