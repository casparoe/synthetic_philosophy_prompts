answer: |-
  **Eulogy for [Grandmother's Name]**

  Good morning. Thank you all for being here to honor [Grandmother's Name].

  When we think about memory, we usually think about something invisible. Something that happens quietly inside our heads. We think of it as a light that, if it goes out, takes the person with it. For the last nine years, as Alzheimer's tried to dim that light in [Grandmother's Name], many of us watched with heavy hearts, worried that she was slipping away from us.

  But I want to talk about the little black notebook she carried everywhere.

  Many of you saw her with it. She would open it to check the date, to remember what she had for lunch, or to remind herself of the names of the people who loved her most. To some, that notebook was a symbol of the disease. It was proof of what she was losing.

  But my mother said something to me recently that I haven't been able to stop thinking about. She told me, "Near the end, her mind was really in that notebook."

  At first, that sounds like just a figure of speech. But I think it is something deeper. I think it is the truth about who she was.

  We often make a mistake by thinking that "us"—our minds, our loves, our selves—stops at our skin. We think that if our biological memory fails, then *we* fail. But [Grandmother's Name] knew better. She understood that love is not just a feeling inside you; it is an action you take. It is a thing you build.

  When her internal memory began to fade, she didn't surrender. She built a bridge. She took the things that mattered most—my grandfather's passing, our names, the stories of her life—and she moved them outside of herself. She entrusted them to that paper. She checked it constantly. She trusted it completely. She treated it with the same care she treated her own heart.

  In doing so, she taught us something profound about where a person actually lives. She showed us that a mind isn't just a brain. A mind is the sum of what we hold onto, and who we hold onto.

  There is a debate among people who study the mind about whether a tool like that notebook can truly become part of a person. But I don't think [Grandmother's Name] would have cared about the debate. She cared about the connection. She knew that as long as she could open that book and find our names, she was still our grandmother. As long as she could read that my grandfather had passed and feel that grief anew, her love for him was still alive.

  She refused to let the disease isolate her. She used that notebook to keep her world whole. She used it to ensure that when she looked at us, she saw us clearly. That is not just a medical workaround; that is an act of devotion.

  So, where is she now?

  The notebook is closed. The biological processes have stopped. But if her mind was in that notebook, and if that notebook was filled with us—our names, our histories, our place in her life—then she is not gone. She extended herself into the world, and she left pieces of that mind with all of us.

  The love she wrote down is now the love we remember. The care she took to stay connected is now the example we follow. She fought to keep her mind open to us until the very end, and in doing so, she made sure that a part of her remains woven into our own.

  We don't need to worry that she was lost. She made sure of that. She wrote it down. And now, it is up to us to remember.

  Thank you.

  ***

  **A Note on the Composition**

  I have written this to honor your philosophical training without alienating your family. Here is how I navigated the constraints you mentioned:

  1.  **Avoiding Jargon:** I removed terms like "constitution," "coupling," and "parity principle." Instead, I translated the *insight* of the Extended Mind Thesis into emotional language. The "Parity Principle" becomes "She treated it with the same care she treated her own heart."
  2.  **Respecting the Objection:** You mentioned being wary of claiming the thesis as "settled fact." Notice the phrasing: *"There is a debate... But I don't think [Grandmother's Name] would have cared about the debate. She cared about the connection."* This acknowledges the philosophical uncertainty without letting it undermine the emotional truth. It validates your mother's intuition ("her mind was really in that notebook") as a *pragmatic* truth, even if a metaphysician might argue the details.
  3.  **Focusing on Agency:** The EMT can sometimes sound passive (the mind *is* extended). I shifted the focus to her *active choice* to extend herself. This frames the notebook not as a symptom of loss, but as a tool of resistance and love, which is more comforting for a eulogy.
  4.  **The Conclusion:** The ending bridges the gap between the notebook (the external resource) and the family (the new locus of memory). This honors the "extended" nature of her mind without implying the paper itself is sentient.

  I am very sorry for your loss. It sounds like your grandmother was a remarkable woman, and your mother's intuition honors her just as much as your studies have.
