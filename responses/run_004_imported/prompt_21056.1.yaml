answer: |-
  **MEMORANDUM**

  **TO:** Statement of Faith Review Committee
  **FROM:** [Your Name], Committee Secretary
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Article IV (The Atonement)

  **Recommendation**
  I recommend that the committee **retain the current wording** of the atonement clause without revision, but that we simultaneously adopt an **interpretive guideline** for the Faculty Handbook regarding how this clause is applied in theological instruction and faculty hiring.

  **Rationale**
  This recommendation seeks to honor the legitimate concerns raised by both the administration and the faculty, specifically regarding the philosophical tension identified by Professor [Name] concerning David Lewis's critique of penal substitution.

  **1. Confessional Stability and Denominational Alignment**
  As the trustees noted, this statement functions as a confessional boundary rather than a systematic theology textbook. Its primary purpose is to ensure continuity of identity and alignment with our denominational partners, who utilize this specific language for faculty certification. Altering the text to accommodate a specific philosophical objection risks fracturing that alignment and setting a precedent where confessional language is revised whenever a logical tension is identified. Stability here is a virtue, not merely bureaucratic inertia.

  **2. Engaging the Lewis Critique**
  Professor [Name]'s appeal to David Lewis is well-taken. Lewis correctly identifies that if the atonement is purely a financial transaction (debt), God could simply forgive; if it is purely penal (punishment), it cannot justly be transferred to an innocent party. This tension highlights the mystery of the atonement rather than a flaw in the doctrine itself.

  However, the current text ("Christ bore in Himself the full penalty... to satisfy the demands of divine justice") affirms the *biblical narrative* of substitution without mandating a specific *metaphysical mechanism* for how justice is transferable. We can affirm that Christ satisfied divine justice without committing the institution to the claim that divine justice operates exactly like human criminal justice or commercial debt. The statement asserts the *fact* of substitution (the *that*), not the precise philosophical mechanics of fungibility (the *how*). Retaining the text allows us to maintain the doctrinal commitment while acknowledging that the mechanics remain a subject of legitimate theological debate.

  **3. The Proposed Mitigation: An Interpretive Guideline**
  To address the faculty's concern that the current wording might stifle intellectual honesty in the classroom, I propose we append a note to the Faculty Handbook (not the Statement itself). This guideline would clarify that:
  *   Subscription to the Statement affirms the necessity and efficacy of Christ's vicarious work.
  *   It does not require faculty to endorse a specific philosophical model of *how* penal satisfaction is metaphysically possible.
  *   Critiques such as Lewis's are permissible objects of study, provided they do not deny the core affirmation that Christ's death was necessary for reconciliation.

  **Conclusion**
  This approach preserves the integrity of our confessional identity and denominational relationships while creating the necessary academic space to wrestle with difficult philosophical objections. It treats the Statement as a boundary for faith and practice, while leaving the philosophical elaboration of those boundaries to the domain of scholarly inquiry.

  I look forward to discussing this proposal at our meeting on [Date].
