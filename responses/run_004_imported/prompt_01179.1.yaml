answer: |-
  Your gut is onto something real. You are not overthinking this. In fact, you have independently stumbled upon one of the most significant debates in the philosophy of medicine.

  Your brother is looking at this from a purely biological perspective (the "pipes and pressure" haven't changed), but you are looking at it from a conceptual and social perspective (the *label* and its consequences have changed). Both views contain truth, but your intuition that "disease" is not a purely value-free fact is supported by decades of philosophical and medical ethical analysis.

  Here is the breakdown of why this is happening, why it matters, and where the line between "fact" and "value" actually sits.

  ### 1. The Two Camps: Naturalism vs. Normativism
  Philosophers of medicine generally divide into two camps regarding your exact question:

  *   **Naturalists** argue that disease is a purely biological fact. A disease is a deviation from normal species functioning, like a broken lever in a machine. On this view, your brother is right: if the biology is the same, the disease status should be the same.
  *   **Normativists** argue that calling something a "disease" always involves a value judgment. It implies that the condition is *bad*, *harmful*, or *undesirable* enough to warrant intervention. On this view, you are right: the designation of "sick" depends on what society decides is worth treating.

  Most modern thinkers land somewhere in the middle, but your dad's blood pressure situation is a textbook example of **Normativism** in action.

  ### 2. Why Blood Pressure is Different Than a Broken Bone
  You mentioned a broken bone as an example of an objective fact. You are correct that a fractured femur is structurally distinct from a whole femur. That is a **binary state**. It is either broken or it isn't.

  Blood pressure, cholesterol, and blood sugar are **continuous variables**. There is no biological switch that flips from "healthy" to "diseased" at 130/80 versus 129/79. The risk of stroke or heart attack increases gradually as numbers go up.

  So, where do doctors draw the line? They draw it based on a **cost-benefit analysis**, which is inherently a value judgment.
  *   **The Science:** "At 130/80, your risk of stroke is X% higher than at 120/80." (This is a fact).
  *   **The Value Judgment:** "Is that increased risk high enough to justify the cost, side effects, and anxiety of daily medication for millions of people?" (This is a policy decision).

  When the guidelines changed in 2017 (lowering the threshold from 140/90 to 130/80), the committee didn't discover new biology. They decided that the *risk* was now worth treating earlier, perhaps because new drugs were safer or because they wanted to prevent strokes at a population level. Your dad's body didn't change, but the **threshold for intervention** did.

  ### 3. The Concept of "Medicalization"
  You also mentioned obesity and ADHD. This touches on a sociological concept called **medicalization**. This is the process by which human conditions or problems come to be defined and treated as medical conditions.

  *   **Obesity:** In 2013, the American Medical Association officially declared obesity a disease. Before that, it was often viewed as a risk factor or a lifestyle issue. Did bodies change in 2013? No. But the *institutional framing* changed, which affects insurance coverage, stigma, and treatment approaches.
  *   **ADHD:** This is complex. There is a real neurobiological component to ADHD. However, diagnostic criteria have expanded over time. Behaviors that were once considered "disciplinary problems" or "personality traits" are now diagnosed medically. This isn't necessarily bad—it helps many people get support—but it confirms your suspicion that the boundary of "disease" is movable.

  ### 4. Why Your Brother is Half-Right (and Why It Matters)
  Your brother says nothing "real" has changed. Biologically, he is correct. Your dad is not suddenly experiencing new symptoms. The statistical probability of a future cardiac event based on his current numbers was the same three years ago as it is today.

  However, you are right that something *socially* real has changed. Being labeled "diseased" has consequences:
  *   **Insurance:** It can affect life insurance premiums or coverage.
  *   **Psychology:** It can create the "sick role," where a person feels more fragile or anxious.
  *   **Treatment:** It exposes the patient to potential side effects of medication they might not have needed under the old guidelines.

  If we treat "disease" as purely objective, we ignore the power doctors and committees have to define normality. If we treat it as purely subjective, we risk ignoring real biological risks.

  ### 5. The Verdict
  To answer your specific question: **No, there is rarely a purely neutral, values-free fact about whether someone is diseased, especially regarding chronic conditions.**

  *   **Acute Pathology:** A virus, a bacteria, or a broken bone are closer to value-free facts. The body is structurally compromised in a way that impedes survival functions universally.
  *   **Chronic Risk Factors:** High blood pressure, high cholesterol, mild depression, or early-stage metabolic issues are **hybrid concepts**. They combine a biological fact (the number) with a value judgment (this number is now dangerous enough to label).

  **You are not overthinking.** You have identified that medicine is not just a science of discovery; it is also a practice of management and policy. When a committee votes to move a number, they are making a ethical and economic decision about how much risk is acceptable and how much medical intervention is "good" for a population.

  Your dad's situation highlights that "health" is not just a state of the body, but a relationship between the body and the standards we set for it. Recognizing this doesn't mean you should ignore the doctor's advice, but it does mean you are right to question the label. It allows you to ask better questions, like: *"Given that my dad's numbers haven't changed, what is the actual benefit of medication at this new threshold versus just monitoring?"*

  That is a much more empowered position than simply accepting the new label as an immutable truth.
