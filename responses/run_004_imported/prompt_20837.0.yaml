prompt: |-
  So I'm drafting a novel where one of my side characters constantly says things slightly wrong -- malaprops, mangled idioms, words that almost but don't quite fit -- and yet everyone around her understands her just fine, they just kind of adjust in real time. It reminded me of that Davidson essay "A Nice Derangement of Epitaphs" (the title's a malaprop itself, nice touch), which I gather is basically a sequel to his radical interpretation stuff -- he uses this exact phenomenon to argue there's basically no such thing as "a language" in the sense of a shared, fixed code we each internalize, just a "passing theory" two people converge on for that one exchange, as opposed to whatever "prior theory" they walked in with. Can you cook up a short bit of dialogue that actually illustrates this -- a case where the prior theory clearly fails but the passing theory saves the exchange -- and then unpack why Davidson thought this was a genuinely radical claim about meaning and not just a fancy way of saying "people use context clues"? Don't want to undersell it when i explain it to my beta reader who did a philosophy minor and will absolutely call me out if i get it wrong.
