  8.  **Final Polish:** Check against the prompt requirements (move-by-move, flag missing bits, no strict winner needed). Ensure Bratman and UDT concepts are applied accurately. (Bratman: Intention involves belief of action. UDT: Choose policy before evidence).

      *Wait, one nuance:* Theo says "The policy 'drink' wins." But the payout is on *intending*, not drinking. UDT says "Adopt policy: Intend at midnight, Drink at noon." But if the agent is truly updateless, do they *re-evaluate* at noon? UDT says no. Sasha says humans *do* re-evaluate. This is the psychological gap.

