    "grade": "<letter grade>",
    "score_out_of_20": <integer>,
    "comments": {
      "personal_and_external_time": "<comment on part a>",
      "two_senses_of_can": "<comment on part b>",
      "comparison_with_horwich": "<comment on part c>"
    }
  }
  ```
