  **MEMORANDUM**

  **TO:** Investment and Grantmaking Committee
  **FROM:** [Your Name/Chair, Policy Subcommittee]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Capital Deployment Policy and Payout Rate

  ### 1. Executive Summary

  Following the receipt of the unrestricted bequest, this committee faces a foundational decision regarding the intertemporal allocation of capital. Our mandate—to "do the most good, weighing all persons and generations impartially"—requires us to move beyond standard foundation payout norms (typically ~5%) without succumbing to indefinite accumulation.

  After reviewing the divergent perspectives within the committee, this memo recommends a **Target Annual Payout Rate of 2.5%**, coupled with a **Five-Year Strategic Review Cycle**. Additionally, it proposes the establishment of a **Contingent Liquidity Facility** (reserved capital) accessible only upon the verification of specific existential risk triggers.

  This policy is designed as a "moral hedge." It acknowledges the compelling economic and ethical case for patient capital while retaining sufficient liquidity to address the unique leverage of the present moment. It explicitly addresses the "Cluelessness Objection" by treating diversification across time as the rational response to deep uncertainty.

  ### 2. Context and Mandate

  The donor's mandate imposes a requirement of **Intertemporal Neutrality**. We are not permitted to discount the welfare of future persons simply because they do not yet exist. Standard philanthropic practice, which typically spends down capital within a human lifetime, implicitly assumes that current opportunities are superior to future ones. Our mandate forbids this assumption unless evidenced.

  However, "impartiality" does not dictate equality of spending in nominal terms; it dictates equality of *impact*. If capital can generate more good in the future, impartiality demands we save. If capital is more potent now, impartiality demands we spend.

  ### 3. The Case for Patient Philanthropy (Steelman)

  The faction advocating for a low payout rate (<1%) argues not for hoarding, but for **strategic intertemporal arbitrage**. Their position rests on three pillars that must be taken seriously:

  1.  **Economic Compounding vs. Problem Growth:** If the endowment achieves a real return of 5% and the "problems" of the world grow at a rate lower than that (or if technology makes solutions cheaper over time), every dollar saved today becomes more than a dollar tomorrow in terms of purchasing power for good. Delaying gratification is mathematically robust if the efficiency of philanthropy increases over time.
  2.  **Option Value:** Future generations may face challenges we cannot conceive, or possess technologies we lack. By preserving capital, we hand future agents—potentially wiser, more informed, and facing different constraints—the resources to solve those specific problems. Spending everything now forecloses future options.
  3.  **Moral Circle Expansion:** History suggests a trend toward expanding the moral circle (e.g., from tribe to nation to all humans to non-human animals). Future agents may represent a more enlightened ethical standpoint. Empowering them allows capital to be deployed according to a more refined moral compass than we currently possess.

  ### 4. The Case for Present Leverage

  The faction advocating for a higher payout rate (>5%) argues that the "patient" model relies on fragile assumptions about the continuity of civilization and the stability of our values.

  1.  **The Hinge of History:** We may be living through the most critical century in human history. Transformative AI, engineered pathogens, and nuclear proliferation present non-linear risks. A dollar spent on alignment research or biosecurity today may prevent an extinction event, rendering all future capital moot. The expected value of preventing existential catastrophe now likely dwarfs the compound interest of an endowment that no longer has beneficiaries.
  2.  **Institutional Decay and Value Drift:** There is no guarantee that this foundation will exist in 200 years, nor that its trustees will share the founder's longtermist commitments. Capital is exposed to expropriation, mission drift, and bureaucratic bloat. "A bird in the hand" argument applies: capital deployed now is good accomplished; capital saved is merely *potential* good subject to institutional risk.
  3.  **Diminishing Returns to Capital:** In specific high-leverage domains (e.g., policy advocacy during a critical legislative window), money is time-sensitive. An extra $100 million in 2050 may be less useful than $10 million in 2024 if the 2024 window closes the door on a catastrophic trajectory.

  ### 5. The Meta-Objection: The Cluelessness Problem

  Both factions face a deeper philosophical challenge: **Epistemic Humility.**

  We are arguably too "clueless" about the long-run consequences of our actions to make confident century-scale expected value calculations.
  *   *Against Patience:* We cannot know if saving money helps future people if we don't know what their economy or moral landscape will look like.
  *   *Against Spending:* We cannot know if our interventions now have positive long-term effects. (e.g., Saving lives in a low-income country today could theoretically accelerate population growth or resource depletion in ways that harm the long-term future).

  If we accept that we are fundamentally clueless about the remote future, then maximizing based on *any* single model (either "now is best" or "later is best") is unjustified arrogance.

  **The Solution: Moral Hedging.**
  The rational response to deep uncertainty is not paralysis, but diversification. Just as an investment portfolio diversifies across asset classes to manage risk, a longtermist portfolio should diversify across *time*. We should not bet 100% of the capital on the hypothesis that "now is the hinge of history," nor 100% on the hypothesis that "the future will be more efficient." We should split the difference to minimize maximum regret.

  ### 6. Recommended Policy

  To balance these competing risks and honor the mandate of impartiality under conditions of uncertainty, I recommend the following policy:

  **A. Target Payout Rate: 2.5% Annually**
  *   **Rationale:** This rate is below the standard 5% industry norm, allowing the real value of the endowment to grow (assuming conservative real returns of 4-5%). This satisfies the Patient Philanthropy requirement for capital preservation and compounding. However, it is high enough to maintain a robust grantmaking operation, retain institutional talent, and address immediate tail risks, satisfying the Present Leverage faction.
  *   **Legal Note:** We will structure Program-Related Investments (PRIs) and Mission-Related Investments (MRIs) to count toward legal minimum distribution requirements where applicable, ensuring the *economic* payout remains at 2.5% while maintaining compliance.

  **B. Contingent Liquidity Facility (The "Emergency Brake")**
  *   **Mechanism:** 10% of the annual payout allowance (0.25% of total assets) shall be accrued into a liquid reserve rather than granted annually.
  *   **Trigger:** This reserve may be deployed only upon a ¾ committee vote certifying an existential risk emergency (e.g., imminent unaligned AI deployment, active engineered pandemic).
  *   **Rationale:** This directly addresses the "Hinge of History" concern without committing to a high baseline spend rate during non-emergency periods.

  **C. Review Schedule: Quinquennial (Every 5 Years)**
  *   **Mechanism:** Every five years, the committee shall vote to reaffirm, adjust, or sunset this policy.
  *   **Metrics:** The review will not merely assess financial performance, but **Leverage Metrics**: Has the cost-effectiveness of our target interventions increased or decreased relative to the market rate of return?
  *   **Rationale:** This institutionalizes humility. It acknowledges that our 2.5% recommendation is a best guess based on current information. If the world becomes safer, we can lower the rate. If risks escalate, we can raise it. This prevents the "value drift" of locking in a policy that becomes obsolete.

  ### 7. Conclusion

  This recommendation rejects the false dichotomy between "spend it all now" and "save it all for later." By adopting a 2.5% payout rate with a contingency reserve and a fixed review schedule, we acknowledge that we are likely living in a critical time *without* assuming we know exactly how critical it is.

  We preserve option value for the future while retaining the agency to act decisively in the present. In the face of cluelessness, this diversified approach is the most faithful interpretation of our mandate to weigh all generations impartially.

  **Action Requested:**
  Please review this framework prior to our meeting on [Date]. I propose we structure the first hour of the meeting to debate the *Review Schedule* and the *Emergency Trigger Definition*, as these are the mechanisms that will allow us to coalesce around the 2.5% rate.
