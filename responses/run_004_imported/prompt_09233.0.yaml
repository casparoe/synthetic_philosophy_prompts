answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. Marisa and I go back about a decade, to our undergrad days. We were roommates, and if you know Marisa, you know she has a relentless curiosity about how the world works. It was my job, as the resident philosophy nerd, to feed that curiosity.

  Naturally, I made her read Bertrand Russell.

  Specifically, I made her read *Marriage and Morals*. Now, for the two-thirds of the room who are happily normal, Bertrand Russell was a 20th-century British philosopher and a Nobel Prize winner. For the philosophers in the room… yes, *that* Russell. The one with the four marriages. The one whose personal life was, let's say, experimentally turbulent.

  Marisa has kept that book for ten years. She's weirdly attached to it. And when she asked me to speak tonight, she asked me to talk about it. I was nervous about this. Because if you know Russell's biography, you know he isn't exactly the patron saint of marital stability. But the more I thought about it, the more I realized: Russell is actually the perfect lens for Marisa and [Partner's Name].

  Not because they are like Russell. But because they are the solution to the problem Russell was trying to solve.

  In *Marriage and Morals*, Russell makes a distinction that I think is profoundly wise. He argues that much of what we call "romantic jealousy" isn't actually about love. It's about property. It's a social artifact, a leftover from an era when marriage was a transaction of ownership. He suggests that when you strip away the fear of losing "what's yours," you're left with something much quieter, but much stronger.

  Looking at Marisa and [Partner's Name], I see that distinction in action. They do not treat each other as property. There is no anxiety of ownership here. There is a profound security. They are two independent people who have chosen to walk in the same direction, not because they fear what happens if they let go, but because they genuinely want to be where the other one is. That is a rare and beautiful thing.

  Russell also argued that the "passionate" phase of romance—the lightning strike, the fireworks—is biologically guaranteed to fade. He thought this was a tragedy. But watching this couple, I think Russell missed the good news.

  He wrote that the real core of a marriage isn't the spark; it's the "unglamorous business" of building a life together. He talked about the shared work, the companionship, the quiet project of raising a family and facing the world as a unit. He thought that sounded boring compared to passion.

  But look at them. The "boring" part is actually the romantic part.

  Anyone can sustain a fireworks display for a few months. It takes real character to sustain a partnership through the mundane, the difficult, and the ordinary. Marisa and [Partner's Name] are as sturdy and low-drama a couple as you will ever find. They are not building a marriage on the shifting sand of intense emotion. They are building it on bedrock. They are building it on friendship.

  Now, to my philosopher friends in the audience: I know what you're thinking. I know Russell's own track record didn't always match this ideal. He struggled with the very jealousies he diagnosed. He believed that honesty could sometimes accommodate infidelity, a view that history has judged… complicatedly.

  But I don't think we toast the man; we toast the insight. Russell was a brilliant diagnostician, even if he wasn't always a healthy patient. He identified what makes marriage *last*, even if he couldn't always make it last himself. He knew that jealousy is the enemy of trust, and that companionship is the engine of endurance.

  Marisa and [Partner's Name] have taken the best of that wisdom and left the rest behind. They have kept the insight that love is not possession. They have kept the insight that the "unglamorous work" is where the meaning lives. And they have quietly rejected the idea that commitment is fragile.

  So, I want to propose a toast.

  To Marisa and [Partner's Name]. May your marriage be less like Russell's life, and more like Russell's best hope. May you find that the "unglamorous business" of life together turns out to be the greatest adventure of all. May you never treat each other as property, but always as partners. And may the friendship you have built today be the sturdy shelter that keeps you warm for the next fifty years.

  To Marisa and [Partner's Name]!
