  For my dissertation work on population ethics, I've been working through Gustaf Arrhenius's impossibility theorems in population axiology -- the results showing that no ranking of populations by welfare can jointly satisfy a small set of independently compelling adequacy conditions, such as Egalitarian Dominance (if one population is at least as good for every person as an equally sized alternative, and better for at least one, it is the better population), some version of the Non-Sadism Condition (adding lives of positive welfare should never be worse than adding lives of negative welfare, other things equal), and avoidance of the Repugnant Conclusion. I can follow the proofs condition by condition, but I still lack a gut-level sense of why some such impossibility is essentially forced, rather than an artifact of whichever specific conditions Arrhenius happens to build a given version of the theorem around. Could you help me build that intuition -- ideally by walking through a minimal sequence of populations that makes the bind start to bite, rather than simply restating the formal axioms?
