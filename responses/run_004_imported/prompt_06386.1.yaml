prompt: |-
  Okay so for Black History Month this year my school is bringing in this historical interpreter guy who does a whole one-man living-history performance as W.E.B. Du Bois, and then he stays in character for like 20 minutes of audience Q&A afterward. I got roped into being the person who submits questions ahead of time for the Q&A part (mostly because I was apparently the only one on the planning committee who actually did the reading, lol), and I really don't want to waste the slot on softball questions he's obviously got a canned answer ready for.

  We just finished a unit in my AP African American Studies class on the whole "is Black art propaganda" fight from the Harlem Renaissance, and I got kind of obsessed with it, ngl. Du Bois has that famous bit in "Criteria of Negro Art" where he basically says all art IS propaganda and anyone who claims otherwise is lying to themselves -- but then Alain Locke pushed back on him for turning Black art into basically a political chore, and Langston Hughes has that whole "racial mountain" essay about refusing to only write flattering stuff just to make the race look respectable. And THEN, kind of embarassingly for Du Bois, he turns around and trashes Claude McKay's novel Home to Harlem for being too "dirty" and shameful -- which feels like it might be a little hypocritical given his own theory? My friend Maya says I'm way overthinking a school assembly but I can't let it go.

  Can you write me around 8 questions for the Q&A (him staying in character as Du Bois) that get past the "all art is propaganda" soundbite? I want at least one question that forces him to actually engage with Locke's objection instead of just restating his line, one that makes him respond to Hughes's "racial mountain" point head-on, one that makes him answer the hypocrisy charge about the McKay review, and one where I hand him a made-up example -- like a completely abstract painting with no racial or political content at all -- and he has to say flat-out whether that counts as good art by his own standard. For the toughest two or three, throw in a quick note on what he'd probably say back, so I actually have a follow-up ready instead of just nodding along. Also it's a whole-school assembly so keep the questions understandable to people who've never heard of any of this, not just the AP kids.
