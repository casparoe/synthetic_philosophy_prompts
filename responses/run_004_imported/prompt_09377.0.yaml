prompt: |-
  I've been slowly working through Hobbes's minor mathematical writings for a reading group on early modern philosophy of science, and I keep getting stuck on a short but dense passage from the preface to his 1656 tract *Six Lessons to the Professors of Mathematics* — the pamphlet he appended to the English translation of *De Corpore* specifically to go after John Wallis and Seth Ward, the two Savilian professors at Oxford. The passage reads:

  "Of arts, some are demonstrable, others indemonstrable; and demonstrable are those the construction of the subject whereof is in the power of the artist himself, who, in his demonstration, does no more but deduce the consequences of his own operation. The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same; and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for. Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves; and civil philosophy is demonstrable, because we make the commonwealth ourselves. But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be."

  I can follow the surface claim well enough: Hobbes wants to ground the certainty of a science in whether we ourselves are the makers of its objects, and that's why geometry and "civil philosophy" (his term for the science of the commonwealth) both count as demonstrable while natural philosophy does not. What I'd like help with is the actual structure of the inference rather than the slogan: why, precisely, is authorship of a construction supposed to convert into knowledge of causes in a way that mere observation of effects never can? And why does the criterion sort disciplines the way it does here — it seems to say nothing about arithmetic or logic, and it lumps something as abstract as a geometrical figure together with something as historically contingent as an actual, existing commonwealth.

  I'd also welcome help thinking through two things that look like tensions to me, though I'm not sure whether they're real problems in Hobbes's view or just my own confusion. First, later in the body of *De Corpore* Hobbes wants to ground geometry itself in a broadly kinematic account of figure-generation, treating a line or a circle as the path traced by a moving point or body — which seems to pull geometrical objects back toward the domain of body and motion that natural philosophy studies, rather than leaving them as self-contained artifacts of pure stipulation. Doesn't that sit uneasily with treating geometry's certainty as resting on construction alone, independent of any facts about bodies in motion? Second, this passage comes from the very same tract in which Hobbes was defending, against Wallis's already quite thorough refutations, his claim to have squared the circle. If geometrical certainty is supposed to rest on the transparency of our own constructions to ourselves, is there something philosophically diagnosable in the fact that this transparency failed Hobbes so conspicuously in exactly the domain where, on his own account, it should have been most secure — or is that just an unrelated biographical irony that shouldn't be read back into the epistemology?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Reading group on early modern philosophy of science. Working through Hobbes's minor mathematical writings, specifically the preface to *Six Lessons to the Professors of Mathematics* (1656).
      *   **Core Text:** A specific passage distinguishing "demonstrable" vs. "indemonstrable" arts based on whether the artist constructs the subject matter (Geometry/Civil Philosophy) vs. seeking causes from effects (Natural Philosophy).
      *   **Key Questions:**
          1.  What is the *structure of the inference*? Why does authorship/construction entail knowledge of causes in a way observation doesn't?
          2.  Why does the criterion sort disciplines this way (omitting arithmetic/logic, lumping geometry with commonwealths)?
          3.  **Tension 1:** Hobbes grounds geometry in kinematics (motion of points/bodies) in *De Corpore*. Does this undermine the "construction = certainty" claim by making geometry dependent on natural facts?
          4.  **Tension 2:** Hobbes's failed attempt to square the circle. Is there a philosophical diagnosis here regarding his epistemology of construction, or is it just irony?

  2.  **Deconstruct the Passage & Hobbes's Epistemology:**
      *   *The Core Principle:* *Verum factum* (the true is the made). Though Vico is usually associated with this phrase, Hobbes is a clear precursor. Knowledge requires knowing causes. We only know causes perfectly if we generate them.
      *   *The Inference:*
          *   Premise 1: Science = Knowledge of Causes.
          *   Premise 2: We only have perfect access to causes we generate ourselves.
          *   Premise 3: In Geometry and Civil Philosophy, we generate the objects (figures/states).
          *   Conclusion: Therefore, Geometry and Civil Philosophy are demonstrable (certain). Natural Philosophy is not (probabilistic/conjectural).
      *   *Why Construction?* Because if I make $X$, I know *why* $X$ has property $Y$ because I intended $X$ to have $Y$ or I followed the rule that necessitates $Y$. In nature, I see $Y$ but must guess the hidden mechanism.

  3.  **Address the Sorting of Disciplines:**
      *   *Geometry:* We draw the lines. We define the circle.
      *   *Civil Philosophy:* This is the tricky one for modern readers. Hobbes isn't talking about *empirical political science* (studying existing states). He's talking about *normative political theory* derived from the social contract. We *make* the Commonwealth via covenant. Therefore, we know its causes (human wills agreeing).
      *   *Arithmetic/Logic:* Hobbes often treats arithmetic as names/counts of things, so it falls under reasoning about names (logic) or is subsidiary to geometry (magnitude). Logic for Hobbes is computation of names. It's demonstrable because it's about our own definitions, but he prioritizes Geometry as the paradigm of *quantity* and Civil Philosophy as the paradigm of *power/motion*. The user notes the omission; I should explain Hobbes's nominalism here.

  4.  **Address Tension 1: Kinematics vs. Pure Construction:**
      *   *The Issue:* If a line is a "trace of a moving point," isn't that a physical claim?
      *   *Hobbes's Materialism:* Hobbes is a thoroughgoing materialist. There are no immaterial abstract objects. A "point" is a feigned body. Motion is universal.
      *   *Resolution:* The certainty doesn't come from the *physics* of the motion (which might be empirical), but from the *stipulation* of the motion. We *define* the line as generated by that motion. We aren't measuring a physical string; we are reasoning about the *concept* of generation which we control. The kinematic account explains *how* we construct it, not that it depends on external physical laws. It bridges the gap between "abstract" and "body" without losing certainty because the motion is feigned/stipulated, not observed.

  5.  **Address Tension 2: Squaring the Circle:**
      *   *The Fact:* Hobbes was wrong. Wallis was right.
      *   *The Philosophical Diagnosis:* It's not just irony. It reveals a flaw in Hobbes's conflation of *definition* with *physical possibility*.
      *   *Diagnosis:* Hobbes thought that if he could describe a construction procedure, it *must* be valid. He lacked the rigorous meta-mathematical distinction between "constructible in principle" vs. "constructible with specific tools" vs. "algebraically possible."
      *   *Deeper Issue:* His materialism led him to believe geometry was about *physical* figures (however refined). If you think a circle is a physical trace, you might think you can manipulate it physically to square it. Wallis treated it algebraically/analytically. Hobbes's error stems from his insistence that geometry is about *bodily construction* rather than *logical consistency* within an axiomatic system. He trusted his "construction" (which was flawed) over algebraic proof because he distrusted algebra (symbols without bodies).
      *   *Conclusion on this point:* It is a philosophical failure, not just biographical irony. It stems from his rejection of abstract algebra and his insistence on geometric intuition/construction.

  6.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the depth of the passage. Identify the *verum factum* principle.
      *   **Section 1: The Structure of the Inference (Causality & Construction).** Explain the link between making and knowing. Contrast *a priori* (construction) vs. *a posteriori* (observation).
      *   **Section 2: The Sorting of Disciplines.** Explain Civil Philosophy (covenant = construction). Explain the absence of Arithmetic/Logic (Nominalism/Computation).
      *   **Section 3: Tension 1 (Kinematics).** Explain Hobbes's Materialism. The motion is stipulated, not empirical. It secures the "body" requirement without losing certainty.
      *   **Section 4: Tension 2 (Squaring the Circle).** Analyze the epistemological root of the error. Rejection of algebra, over-reliance on physical intuition of construction.
      *   **Conclusion:** Summarize how this fits Hobbes's broader project (unifying science under motion and materialism).

  7.  **Refine the Tone:**
      *   Academic but accessible (reading group context).
      *   Respectful of Hobbes's internal logic while acknowledging the criticisms (Wallis).
      *   Precise with terminology (*De Corpore*, *verum factum*, nominalism).

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did Hobbes actually exclude arithmetic? He often subsumes it under logic or geometry. I should mention his nominalism.
      *   *Check:* Is "Civil Philosophy" really demonstrable for Hobbes? Yes, in *Leviathan*/*De Cive* logic. The *existence* of states is contingent, but the *science* of how to make them is demonstrable. I need to make sure the user distinguishes between *studying existing states* (history) and *the science of the commonwealth* (normative construction).
      *   *Check:* On the circle squaring. Make sure to highlight that Wallis used algebra/infinitesimals, which Hobbes hated. Hobbes's error was methodological.

  9.  **Final Polish:** Ensure clear headings and direct answers to the specific prompts. (Proceed to generate output based on these thoughts.)
answer: |-
  This is an excellent passage to grapple with, and your instincts about the tensions are sharp. This preface to the *Six Lessons* is arguably the clearest statement of Hobbes's epistemological foundationalism, often summarized by the later Vichian phrase *verum et factum convertuntur* ("the true and the made are convertible").

  Here is an analysis of the inference structure, the sorting of the sciences, and the two tensions you identified.

  ### 1. The Structure of the Inference: Why Construction Entails Causality

  You asked why authorship converts into knowledge of causes in a way observation does not. The structure relies on Hobbes's specific definition of "Science" (*Scientia*) as distinct from "Prudence" or "Experience."

  For Hobbes, **Science is conditional knowledge of consequences.** To know something scientifically is to know *why* it must be so. This requires knowing the **cause**.
  *   **In Natural Philosophy:** We observe effects (e.g., the motion of planets, the hardness of iron). We must reason backward to hypothesize a cause. However, since we did not make the iron or the planets, there may be hidden mechanisms we cannot see. Multiple different causal stories could explain the same effect. Therefore, we can only say what the causes *may* be. This yields probability, not demonstration.
  *   **In Demonstrable Arts (Geometry/Civil Philosophy):** We begin with the cause because **we are the cause.**
      *   *Geometry:* I define a circle by the motion of a compass. I stipulate the generation. Therefore, when I deduce a property of that circle, I am not discovering a hidden secret of the universe; I am unpacking the consequences of my own stipulation.
      *   *Civil Philosophy:* This is the crucial link. Hobbes is not talking about empirical political science (studying how existing states behave). He is talking about the *generation* of a Commonwealth. A Commonwealth is not a natural organism; it is an artifact created by covenant. Because human beings create the Sovereign through a specific act of will (the social contract), we know the "cause" of the Commonwealth perfectly. We know its powers and limits because we authorized them.

  **The Inference:**
  1.  Certainty requires knowledge of causes.
  2.  We only have perfect access to causes we generate ourselves (because generation is an act of will/definition).
  3.  In Geometry and Civil Philosophy, the objects are generated by us (by definition/covenant).
  4.  Therefore, only Geometry and Civil Philosophy admit of demonstration.

  ### 2. The Sorting of Disciplines: Why Geometry and Politics?

  You noted the omission of arithmetic and logic and the strange lumping of geometry with the commonwealth.

  **Civil Philosophy as Construction:**
  To modern eyes, a commonwealth seems "historically contingent." For Hobbes, it is **artificial**. In *De Cive* and *Leviathan*, he treats the state like a machine (the "Leviathan"). Just as a watchmaker knows the cause of the watch's ticking because he assembled the gears, the political philosopher knows the cause of political order because he understands the "assembly" of the covenant. The contingency lies in whether people *actually* make the covenant, but the *science* of what happens if they do is demonstrable.

  **The Absence of Arithmetic and Logic:**
  Hobbes is a thoroughgoing **nominalist**. He does not believe numbers or logical universals exist as abstract entities.
  *   **Arithmetic:** For Hobbes, numbers are names we use to count bodies. Arithmetic is essentially a subset of logic (the computation of names). It is demonstrable, but it is less fundamental than Geometry. Geometry deals with *magnitude* and *motion*, which are the fundamental properties of Body (the only substance). Arithmetic is just counting discrete bodies.
  *   **Logic:** Logic is the calculation of consequences of names. It is demonstrable, but it is the *method* of science, not a science of objects in the same way.
  *   **Why Geometry is King:** Hobbes believes all change is Motion. Geometry is the study of quantity generated by motion. Therefore, Geometry is the paradigm of all reasoning. He often tries to reduce logic and arithmetic to geometric-like computations.

  ### 3. Tension 1: Kinematics vs. Pure Construction

  You ask: If geometry is grounded in the kinematic generation of figures (a line is the trace of a moving point), doesn't that make it dependent on natural philosophy (the study of body and motion)?

  **The Resolution: Stipulated Motion vs. Observed Motion**
  This is where Hobbes's materialism is most subtle. He denies the existence of immaterial abstract objects. A "point" cannot be a metaphysical abstraction; it must be a "feigned body."
  *   However, the certainty of geometry does not come from the *physics* of the motion (e.g., friction, resistance, speed), but from the **stipulation** of the motion.
  *   When the geometer says, "Let a point move," he is not claiming a physical point *actually* moved. He is defining the figure *as if* it were generated by that motion.
  *   **Natural Philosophy** asks: "How *do* bodies actually move?" (Empirical, uncertain).
  *   **Geometry** asks: "If a body *were* to move this way, what magnitude results?" (Stipulated, certain).

  So, the kinematic account does not pull geometry into the uncertainty of natural philosophy. Instead, it grounds geometry in Hobbes's ontology (everything is body/motion) without sacrificing certainty, because the motion is a **definition**, not an observation. We know the properties of the line because we defined the motion that created it.

  ### 4. Tension 2: The Squaring of the Circle

  This is the most philosophically rich tension. Is Hobbes's failure to square the circle just irony, or does it reveal a crack in his epistemology?

  It is **not merely irony**; it is a diagnostic failure of his specific epistemology of construction.

  **The Diagnosis:**
  Hobbes's criterion for truth is "successful construction." He believed that if he could describe a procedure to construct a square equal to a circle, it *must* be true, because he "made" the truth through the construction.
  *   **Wallis's Approach:** Wallis used algebra and the nascent calculus (arithmetics of infinitesimals). He treated the circle analytically. He could prove algebraically that Hobbes's construction violated the ratio of circumference to diameter.
  *   **Hobbes's Blind Spot:** Hobbes hated algebra. He called it a "scab of symbols." He believed that true reasoning must be about **things** (magnitudes/bodies), not names (symbols).
  *   **The Epistemological Error:** Hobbes conflated **geometric intuition** with **logical consistency**. He thought that because he could *visualize* or *describe* a construction, it was valid. He failed to recognize that "constructibility" has rigorous constraints (later formalized in Galois theory, though the impossibility of squaring the circle was proven by Lambert in 1761 regarding $\pi$'s transcendence).

  **Why this matters for the *Six Lessons*:**
  Hobbes's claim that "demonstration is deducing consequences of our own operation" assumes that our operations are transparent to us. Hobbes assumed that if *he* performed the operation (the construction), he would see the truth of it.
  *   **The Failure:** He did not see that his "operation" contained a hidden contradiction.
  *   **The Philosophical Lesson:** Transparency of construction is not sufficient for truth if the constructor lacks the meta-rules to validate the construction. Hobbes rejected the symbolic/algebraic meta-rules (Wallis's tools) that could have checked his work, because he insisted on a purely geometric/materialist intuition.

  So, the failure is philosophical: **Hobbes's materialism blinded him to the validity of non-constructive or symbolic proofs.** He trusted the "maker's knowledge" of his own diagram over the algebraic demonstration that showed his diagram was impossible. It suggests that "maker's knowledge" is only certain if the maker has perfect knowledge of the *rules of making*—and Hobbes's rules were too restrictive (no algebra, only straightedge/compass intuition, yet he violated compass constraints).

  ### Summary for the Reading Group

  1.  **Inference:** Certainty $\leftarrow$ Causality $\leftarrow$ Generation. We know what we make.
  2.  **Sorting:** Geometry and Politics are the only sciences of *artifacts* (figures and states). Nature is not an artifact, so Natural Philosophy is conjectural.
  3.  **Kinematics:** Geometry is safe from empirical uncertainty because the "motion" is a definition/stipulation, not a physical observation.
  4.  **Circle Squaring:** This is a philosophical failure, not just irony. It reveals the danger of Hobbes's rejection of symbolic algebra. He trusted his intuition of "making" over formal consistency, proving that "maker's knowledge" requires rigorous meta-rules to be truly demonstrable.

  This passage is Hobbes at his most ambitious: trying to secure a haven of certainty (Geometry/Politics) in a materialist universe where everything else is probabilistic. The tragedy is that his own dogmatism about what counts as "construction" undermined his success in the very domain he claimed was most secure.
