answer: |-
  **The Uncaused Cause: Assessing Strawson's Basic Argument and the Illusion of Indeterministic Escape**

  Coming from a career in experimental physics, I approached the problem of free will with a specific prejudice. I assumed the battlefield was drawn between the clockwork universe of classical mechanics and the probabilistic fog of quantum mechanics. It seemed to me that if the brain were a deterministic machine, freedom was an illusion; if it were a quantum amplifier, perhaps freedom had a foothold. It was a surprise, then, to encounter Galen Strawson's "Basic Argument," which asserts that the physics of the brain is largely irrelevant. Strawson argues that true moral responsibility requires being *causa sui* (cause of oneself), a logical impossibility that generates a vicious regress regardless of whether the links in the chain are determined or random.

  As I have examined the dialectic between Strawson and libertarian incompatibilists like Robert Kane, I have come to a conclusion that may disappoint those seeking a metaphysical loophole for human agency. Strawson's Basic Argument is logically robust, and his claim of neutrality regarding determinism and indeterminism largely survives scrutiny. While Robert Kane's theory of "Self-Forming Actions" (SFAs) attempts to utilize indeterminism to halt the regress, it ultimately substitutes luck for control. Consequently, the Basic Argument succeeds: the kind of "ultimate moral responsibility" Strawson describes is impossible, and the introduction of indeterminism does not rescue it.

  ### The Architecture of the Basic Argument

  To understand why Strawson claims neutrality, one must first grasp the strictures of his argument. It is not an argument about the causal structure of the universe, but about the conditions required for *desert*. Strawson posits that to be truly morally responsible for an action, one must be responsible for the mental state that produced the action. If I act from courage, I am only responsible if I am responsible for being a courageous person. But to be responsible for being courageous, I must have chosen to become courageous. That choice, however, would have stemmed from some prior reason or preference. To be responsible for *that* preference, I must have chosen it based on yet earlier preferences.

  This generates an infinite regress. To stop it, one would need to be a *causa sui*—to have created oneself from nothing, with no prior mental character dictating the creation. Strawson argues this is logically impossible. One cannot stand outside of oneself to construct oneself.

  Crucially, Strawson insists this logic holds whether the choices in the chain are determined or undetermined. If my choice to build courage is determined by my prior character, I am not the ultimate source. If my choice is *undetermined* (random), I am also not the source; I am merely the locus of a chance event. In neither case do I possess the control required for ultimate responsibility.

  ### The Libertarian Counter: Kane's Self-Forming Actions

  Robert Kane, a leading libertarian incompatibilist, accepts that determinism precludes ultimate responsibility. However, he rejects Strawson's claim that indeterminism is equally fatal. Kane argues that the regress does not need to extend infinitely into the past; it only needs to anchor at specific moments of "self-formation."

  Kane identifies moments of moral conflict where an agent's will is divided (e.g., the desire to act selfishly versus the desire to act altruistically). In these moments, Kane posits that neural noise introduces genuine indeterminacy. The outcome is not determined by the agent's prior character, because the character is precisely what is being formed. When the agent exerts effort to resolve the conflict, whichever way they choose, they "own" the choice because it resulted from their own effort. These Self-Forming Actions (SFAs) serve as the bedrock of responsibility. They halt the regress by making the agent the *ultimate source* of their will at that specific moment, without requiring them to have chosen their prior nature.

  Kane's appeal is intuitive to the scientist who knows that not all systems are linear. He suggests a system where the output feeds back into the input, altering the system's parameters. If the feedback loop contains an indeterministic element, the system is not merely unfolding a pre-written script.

  ### The Luck Objection and the Failure of Control

  However, when we subject Kane's model to Strawson's scrutiny, the cracks appear. The core issue is not whether the regress stops, but whether the stopping point confers *responsibility*. Strawson's neutrality claim rests on the assertion that indeterminism adds nothing but noise to the equation of agency.

  From a physicist's perspective, an undetermined event is, by definition, not fully explained by the prior state of the system. If a choice is undetermined, it means that given the exact same prior mental state and environmental conditions, the agent could have chosen otherwise. Kane views this as the seat of freedom. Strawson (and his ally, the "Luck Objector") views this as the seat of chance.

  If my SFA is not determined by my character (because my character is in flux), then the outcome is not fully explained by *me*. It is partially explained by random neural fluctuations. If I choose the altruistic path, was it because I am good, or because the quantum noise tipped in that direction? If the latter, I cannot claim credit for the outcome in the deep moral sense Strawson demands. I did not control the outcome; I merely witnessed it emerge from my neural circuitry.

  Kane attempts to dodge this by arguing that the *effort* is determined, even if the *outcome* is not. He claims we are responsible for the effort to resolve the conflict. But Strawson would press the regress here as well: Why did I make *that* effort? Why did I value resolving the conflict in favor of altruism? If the intensity and direction of the effort are determined by my prior nature, we are back to the original regress (I am not responsible for my prior nature). If the effort itself is undetermined, then the effort is also a matter of luck.

  Therefore, Kane's SFAs do not halt the regress of *responsibility*; they merely hide it behind a veil of probability. They satisfy the condition of "alternative possibilities" (I could have done otherwise), but they fail to satisfy the condition of "control" (I made it happen *because* I willed it, rather than *although* I willed it). Strawson's neutrality claim holds: indeterminism breaks the chain of causal necessity, but it does not forge a chain of agency. It replaces a prison of necessity with a sea of chance, but the agent is still not the captain of the ship.

  ### The Verdict on Neutrality and Success

  Does Strawson's Basic Argument succeed? Yes, provided we accept his definition of moral responsibility. He defines responsibility in a way that requires ultimate authorship of the self. This is a high bar, perhaps impossibly high, but it is the only bar that justifies the kind of retributive blame and praise that underpins many of our moral intuitions. If we cannot be the *causa sui*, we cannot be ultimately responsible.

  Does the claim of independence from the determinism/indeterminism dispute survive scrutiny? It does. Libertarians often accuse Strawson of begging the question by assuming a deterministic model of agency. They argue that if agency is fundamentally indeterministic, the regress doesn't apply because the agent isn't a "thing" being pushed by prior causes, but a "substance" exercising power.

  However, this response is metaphysically obscure. To say an agent exercises power indeterministically is to say the agent's action is not fully determined by the agent's properties. But if the action is not determined by the agent's properties (beliefs, desires, character), in what sense is it the *agent's* action? It becomes an event that happens *in* the agent, not *by* the agent. Strawson correctly identifies that inserting randomness into the causal chain does not generate control. Whether the gear is locked (determinism) or slipping (indeterminism), the driver (the self) is not turning the wheel unless the driver exists prior to the gear. But the driver is made of gears.

  Kane's SFAs fail to restore responsibility-conferring control because they cannot distinguish between "I chose this" and "This choice emerged in me." The indeterminism required to break the causal regress simultaneously breaks the link of ownership required for moral responsibility.

  ### Conclusion

  As a physicist, I am accustomed to systems where boundary conditions dictate outcomes. Strawson's argument effectively demonstrates that the human mind, viewed as a natural system, cannot satisfy the boundary condition of self-creation. We are the products of genetics, environment, and chance. We can shape ourselves, but only using the materials we were given, according to the laws of physics that govern us.

  Robert Kane's attempt to use indeterminism as a wedge to create space for agency is valiant but ultimately unsuccessful. It addresses the problem of causal closure but ignores the problem of control. Strawson is right: the regress bites all the same. If my choices are determined, I am a puppet of the past. If they are undetermined, I am a puppet of chance. In neither case am I the *causa sui* required for the deep moral responsibility Strawson describes.

  Therefore, the Basic Argument succeeds. Its claimed neutrality survives because the introduction of indeterminism fails to provide the one thing necessary to stop the regress: a self that exists independently of its own history to authorize that history. We must either abandon the concept of ultimate moral responsibility or redefine it in a compatibilist framework that accepts we are not *causa sui*. But if we demand the latter—the God's-eye view of responsibility where we are truly the authors of our souls—Strawson has proven that such a thing is not to be found in this universe, whether it is determined or not.
