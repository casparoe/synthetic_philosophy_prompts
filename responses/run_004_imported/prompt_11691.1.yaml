      *(Self-Correction during drafting)*: I need to be careful not to simply say "Sofia is right." Mateo has a point about the *intent* of the Baronius quote, even if his structural analysis is weaker. I should acknowledge where Mateo is plausible before explaining why Sofia's textual reading is stronger.
