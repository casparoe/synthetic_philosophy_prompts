      *   **The Morning Star/Evening Star example:** Hesperus (Evening Star) and Phosphorus (Morning Star) both refer to Venus. Knowing "Hesperus is Phosphorus" feels like new information, even though "Hesperus is Hesperus" is a tautology.
      *   **Cognitive Significance:** The *way* an object is presented matters, not just the object itself.
      *   **Epistemic State:** The user had two separate mental files for "Jake" and "nightowl92." Merging them updates the user's epistemic state, even if the external referent is the same.

  3.  **Evaluate the Roommate's Argument:**
      *   **Premise:** Jake = nightowl92 (Identity).
      *   **Premise:** User knows Jake.
      *   **Conclusion:** User knows everything about nightowl92.
      *   **Flaw:** This assumes transparency of identity. It ignores *modes of presentation*. Knowing someone in a lab setting is different from knowing them anonymously online. The *context* creates different properties/attributes in the user's mind.

