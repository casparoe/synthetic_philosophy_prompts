prompt: |-
  Ok so this happened last week and it's been living in my head rent free. My dorm has this anonymous confessions/compliments app, and for like two months I'd been going back and forth with someone who posts as "nightowl92" -- honestly some of the best conversations I've had all semester, and I basically treated them as a totally seperate person in my head. Turns out nightowl92 is literally my chem lab partner Jake, who I've known since September. My roommate says I'm being ridiculous for acting like I learned something huge, since obviously Jake is Jake, so I already "knew" everything about nightowl92 the second I met Jake -- finding out should've been finding out nothing, according to her. But it did not feel like nothing, it felt like actual new information just hit me. Kind of funny given I'm taking intro logic this semester and we haven't covered anything close to this. I feel like her argument is missing something but I can't put my finger on what -- is she right and I'm just being irrational?
