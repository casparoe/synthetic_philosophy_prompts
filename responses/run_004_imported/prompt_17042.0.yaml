answer: |-
  This is a classic negotiation trap, and the short answer is: **Yes, the strategy was doomed from the start, specifically because you both used it at the same time.**

  You didn't "play it wrong" in a vacuum; you played a high-stakes poker hand in a game that required cooperation. Here is a breakdown of why this happened, why the advice you received was flawed for this specific situation, and how you can fix it before there's nothing left to split.

  ### 1. The "Commitment Trap"
  In negotiation theory, what you both did is called a **commitment tactic**. By sending a "final number" and refusing to negotiate, you tried to bind your own hands to force the other person to yield. This works *only if* the other person remains flexible.

  When both parties commit to a hard line simultaneously, you create a deadlock.
  *   **The Trap:** Now, for either of you to move, you have to admit your "final" number wasn't actually final. In your minds, that feels like losing face or weakness.
  *   **The Reality:** You aren't negotiating against an enemy; you're negotiating against a mirror. He is feeling the exact same pressure, pride, and frustration you are. He isn't necessarily being more stubborn than you; he is just trapped in the same box.

  ### 2. The Advice Was Context-Blind
  Your lawyer friend and his fiancée gave you advice that works in **transactional** settings (buying a house, settling a lawsuit with a stranger), but fails in **relational** settings (family).
  *   **Business:** If you walk away from a deal with a stranger, you find another deal.
  *   **Family:** If you walk away or stalemate, you burn a bridge you have to cross for the rest of your life (holidays, family events, caring for Mom).
  *   **The Cost:** In a business deal, time is money. In a family estate, time is *also* money (legal fees), but it is also emotional capital. Every week you stall, you aren't just burning cash; you are burning trust.

  ### 3. The Financial Bleed
  You mentioned legal fees are piling up. This is the most objective metric of failure.
  *   If you both spend $5,000 a month on legal fees to fight over a $50,000 asset, and you stall for six months, you have lost $60,000.
  *   **The "Win" is Shrinking:** By holding out for a "better number," you are actively reducing the total value of the estate. The longer you fight, the less there is to win.

  ### 4. A Critical Detail: Mom Is Still Alive
  You wrote that she has moved into assisted living, implying she is still living. This is a crucial distinction.
  *   **Legal/Ethical Risk:** Distributing an "estate" before death can have significant tax implications, Medicaid look-back penalties, or legal ramifications regarding her capacity to consent.
  *   **Emotional Weight:** If Mom is aware that her children are fighting over her assets while she is still alive, the guilt and stress could impact her health.
  *   **Reframing:** This isn't just about splitting assets; it's about stewardship of her resources while she needs care.

  ### How to Fix It (Without "Losing")
  You need a way to de-escalate that allows both of you to save face. You cannot wait for him to blink, because he is likely waiting for you to blink.

  **1. Change the Medium**
  Text and email are terrible for de-escalation because tone is lost and everything feels like a legal record. Stop texting about numbers. Call him or meet for coffee.

  **2. Blame the Strategy, Not Each Other**
  You can back down without looking weak if you frame it as realizing the *process* is broken.
  *   *Script:* "I've been thinking about how we're handling this. We both got advice to take a hard line, and I realize now that since we both did it, we've just locked ourselves into a corner where the lawyers are the only ones winning. I don't want to spend Mom's money on fees. Can we hit reset?"

  **3. Introduce a Neutral Third Party**
  Your current lawyers are paid to fight. You need a **mediator** or a **financial neutral**.
  *   A mediator's job is to get you to an agreement, not to bill hours on conflict.
  *   Agree to split the cost of one session with a certified mediator. This signals you want to solve the problem, not win the fight.

  **4. Focus on the "Why"**
  Remind each other *why* you are doing this. Is it to secure Mom's care? Is it to ensure fairness? If the legal fees are jeopardizing Mom's care fund, that is a shared enemy you can fight together.

  ### The Bottom Line
  You didn't play it right, but you aren't a villain. You took bad advice for the context. The "upper hand" in a family negotiation isn't the person who stands the firmest; it's the person mature enough to realize the stalemate is hurting everyone and proposes a way out.

  If you reach out first to suggest mediation or a reset, you aren't losing. You're taking actual control of the situation, whereas right now, the situation (and the legal bills) is controlling you.
