answer: |-
  Here is a draft of ten questions, plus the optional eleventh on preemption. I've written them to reflect your background—leveraging your experience with experimental design to press the philosophical points without getting bogged down in jargon. The three mandatory topics (circularity, non-intervenable causes, and the rivalry with counterfactualism) are included with the requested follow-ups.

  ### Interview Questions for the Interventionism Defense

  **1. The "Lab Bench" Test**
  In my thirty-five years running a fly lab, an "intervention" was never a metaphysical primitive; it was a messy procedure involving P-element transposons, CRISPR, or temperature shifts, always with some risk of off-target effects. Woodward's *Making Things Happen* treats interventions as idealized variables that break causal arrows without introducing confounds. From your perspective, does the philosophical utility of interventionism depend on these interventions being *physically possible*, or is it enough that they are *conceptually coherent*? If it's the latter, how do we prevent the concept from drifting so far from actual practice that it loses its grip on science?

  **2. Epistemic Access**
  Interventionism is often touted as superior because it aligns with how we actually learn about causation: by manipulating variables. But to identify a valid intervention variable $I$ for cause $X$, we seemingly need to know in advance that $I$ affects $Y$ *only* through $X$. In a discovery context where the causal structure is unknown, how do we identify an intervention without already having the causal knowledge we're trying to acquire? Are we not stuck in a bootstrapping problem?

  **3. The Circularity Worry (Mandatory)**
  This brings me to a worry that struck me reading Woodward. He admits that "intervention" is defined using causal vocabulary—an intervention is a cause of the treatment variable that doesn't affect the outcome via other paths. Lewis tried to reduce causation to non-causal facts about world similarity, but interventionism seems to explain causation partly in terms of itself. If the analysis is circular, in what sense is it explanatory? Does it not merely map causal relations onto other causal relations without grounding them?
  *   **Follow-up:** I anticipate you might reply that interventionism isn't aiming for *reduction* but rather *elucidation* of the concept's structure. But if we can't cash out "intervention" in non-causal terms, doesn't that limit the theory's ability to settle disputes where two scientists disagree on whether a specific manipulation counts as a valid intervention?

  **4. Non-Intervenable Causes (Mandatory)**
  In biology, we often make causal claims about variables that cannot be intervened upon, even in principle. We say being male causes higher susceptibility to certain X-linked disorders, or that being *Drosophila melanogaster* rather than *simulans* causes specific courtship behaviors. Woodward has famously suggested "no causation without manipulation." Does interventionism force us to treat these claims as meaningless or confused? If so, does that make the theory too restrictive for actual scientific discourse, where we treat species or sex as genuine causal factors?
  *   **Follow-up:** A common defense is that we can imagine "idealized" interventions on these properties (e.g., swapping chromosomes while holding everything else fixed). But if we are relying on hypothetical swaps that violate the actual laws of nature or development, aren't we just doing Lewis-style counterfactuals under a different name? At what point does the "idealization" become so detached from physical possibility that the interventionist label is just a veneer?

  **5. Interventionism vs. Counterfactualism (Mandatory)**
  I spent the summer looking at Pearl's do-calculus after reading Lewis. Pearl defines counterfactuals by performing "surgery" on structural equations, which looks remarkably like Woodward's interventions. Lewis used "miracles" to sever causal chains. To a biologist, the math looks like the same machinery: you break a link and see what happens. Is interventionism truly a metaphysical rival to the counterfactual theory, or is it essentially the same theory dressed in more rigorous, causal-model notation?
  *   **Follow-up:** If you argue the difference lies in *invariance* and *explanation* rather than truth conditions, does that mean interventionism is silent on what *makes* a causal claim true, focusing only on how we use it? If so, is it a competitor to Lewis's metaphysics, or just a pragmatics of causal explanation?

  **6. Mechanisms vs. Difference-Making**
  In genetics, we distinguish between a "black box" correlation (knockout $X$, phenotype $P$ disappears) and a mechanism (we trace the protein pathway from $X$ to $P$). Interventionism is explicitly a difference-making account; it claims we don't need to know the mechanism to know the cause. But in practice, we rarely trust a knockout result until we have a plausible mechanism to rule out spurious correlations. Does interventionism undervalue the role of mechanistic knowledge in *confirming* causal claims, even if it doesn't define them?

  **7. The Problem of "Fat-Handed" Interventions**
  In the lab, we worry about "fat-handed" interventions—trying to knock out gene $X$ but accidentally affecting gene $Y$ nearby. Philosophy tends to assume we can isolate variables cleanly. How does interventionism handle cases where variables are metaphysically or nomologically inseparable? For example, if changing a mental state necessarily involves changing a physical neural state, can we ever intervene on the mental without intervening on the physical? Does the theory force us into a specific stance on reductionism?

  **8. Proportionality and Granularity**
  Woodward and others have discussed the idea of "proportionality"—that a cause should be specific enough to explain the effect but not overly detailed. If I say "the fly died because I hit it with a flyswatter," that's causal. If I say "the fly died because I moved my arm with momentum $X$ at angle $Y$," that's also true but perhaps less explanatory. How does interventionism determine the correct "grain" of the causal variable? Is there a fact of the matter about which level of description is the *real* cause, or is that purely relative to our interests?

  **9. Causal Discovery from Observational Data**
  Much of modern biology (e.g., transcriptomics) relies on observational data where interventions are impossible or unethical. We use algorithms (like PC or FCI) that assume a causal structure to infer DAGs from correlations. These algorithms rely on assumptions like "causal sufficiency" or "faithfulness." Does interventionism view these inferred causal claims as second-class citizens compared to experimental claims? Or does the theory provide a framework for treating observational inference as a form of "virtual" intervention?

  **10. Normative Implications**
  Finally, interventionism is often linked to policy and ethics: to fix a problem, find a lever you can pull. But this seems to privilege manipulable causes over stable ones. If climate change is caused by structural economic factors that are hard to "intervene" on without societal collapse, does an interventionist framework inadvertently steer us toward "easier" technical fixes rather than deeper structural causes? Does the theory have a normative bias toward the manipulable?

  **11. Preemption and Redundancy (Optional)**
  *Since you mentioned preemption:* In genetics, we often see redundancy: Gene $A$ and Gene $B$ both produce Enzyme $E$. If I knock out $A$, the phenotype is normal because $B$ compensates. Counterfactual theories struggle here (if $A$ hadn't fired, $E$ would still exist, so $A$ didn't cause $E$). Interventionism claims to handle this by looking at the path along $A$ while holding $B$ fixed. But doesn't holding $B$ fixed require an intervention that might not be physically possible in the actual system? If the system is hard-wired to compensate, is the "intervention" on $A$ while fixing $B$ truly coherent, or are we again relying on a hypothetical scenario that breaks the system's actual laws?
