      *   **Conclusion:** They believe frequentist null-hypothesis significance testing (NHST) with $p < 0.05$ is "structurally broken" and caused the crisis.
      *   **Specific Evidence:** They cite Wagenmakers' Bayesian reanalysis of Bem's data as the "smoking gun" showing evidence evaporates with proper priors.
