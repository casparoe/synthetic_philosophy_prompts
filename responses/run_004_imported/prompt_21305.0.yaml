      *   *The Real Culprit:* It's not just the math; it's the *incentives*. Publish or perish. Positive results get published. NHST made it easy to game the system.
      *   *The Pre-2015 Rule:* Too harsh. Many robust effects (Stroop, basic cognitive psych) hold up. Don't throw the baby out with the bathwater.
