answer: |-
  You have successfully completed the "Rationalist Statistics Initiation Ritual." Welcome to the other side. It is indeed a rite of passage to read Scott Alexander, stare into the abyss of the Bem ESP papers, and realize that a huge chunk of social science is built on sand.

  You are right that the misuse of $p$-values was a primary *mechanism* of the crisis. However, your conclusion—that switching to Bayesian statistics with honest priors would have solved everything, and that you should now blindly trust Bayes Factors (BF) over $p$-values—is a common overcorrection.

  Here is the nuanced reality of why the crisis happened, why Bayes isn't a magic bullet, and how you should actually update your heuristics for trusting papers.

  ### 1. Was NHST "Structurally Broken"?
  Yes and no. The math of frequentism isn't broken, but the **incentive structure surrounding it** was catastrophic.

  *   **The Binary Trap:** $p < 0.05$ became a binary "publish/don't publish" switch. This encouraged **p-hacking** (trying different analyses until one works) and **HARKing** (Hypothesizing After Results are Known).
  *   **The Interpretation Error:** Everyone treats $p < 0.05$ as "there is a 95% chance the hypothesis is true." It isn't. It means "if the null were true, data this extreme would happen 5% of the time." This confusion allowed weak evidence to be sold as strong proof.
  *   **The Prior Problem:** Frequentism ignores base rates. As Wagenmakers showed with Bem, ESP is a priori incredibly unlikely. Frequentism asks, "Is this data unlikely under the null?" Bayesianism asks, "How much should this data update my prior belief?" Since the prior for ESP is near zero, it takes astronomical evidence to move the needle. Frequentism allowed Bem to claim victory with evidence that was merely "unlikely under the null," ignoring that it was *even more* unlikely under reality.

  ### 2. Would Bayesian Stats Have Prevented the Crisis?
  If psychology had used Bayesian methods in 2000, the replication crisis would likely have been **smaller**, but not non-existent. Here is why Bayes is not a panacea:

  *   **"Honest Priors" are Subjective:** Who decides the prior? If a researcher is motivated to find an effect, they can choose a prior distribution that makes the Bayes Factor look favorable. This is sometimes called **"BF-hacking."**
  *   **Garbage In, Garbage Out:** Bayesian statistics cannot fix bad experimental design. Bem's ESP studies had massive methodological flaws (protocol flexibility, lack of blinding) that go beyond which statistic you run at the end. A Bayesian analysis of biased data still yields biased results.
  *   **Complexity Hides Sins:** Bayesian models are often more complex than a t-test. This complexity can sometimes obscure researcher degrees of freedom rather than illuminate them.
  *   **Wagenmakers' Actual Point:** Wagenmakers didn't just argue for Bayes; he argued for **preregistration**. The "smoking gun" wasn't just the math; it was that Bem could have analyzed his data in 20 different ways. Bayes helps weigh the evidence, but preregistration prevents you from choosing the analysis that gives the answer you want.

  ### 3. Should You Discount Pre-2015 Findings?
  **No.** That is too blunt an instrument.

  *   **Robust Effects Exist:** Basic cognitive psychology (e.g., Stroop effect, working memory limits) and many psychophysical findings from the 1970s are rock solid. They replicate because the effect sizes are huge and the measurements are objective.
  *   **The "Decline Effect":** It is true that social priming and subtle behavioral effects (like power posing) from that era are highly suspect.
  *   **Better Heuristic:** Don't look at the **date**; look at the **process**.
      *   Was the study **preregistered**? (This is the single biggest marker of credibility).
      *   Was the sample size **large**? (Pre-2015 psych was notoriously underpowered).
      *   Has it been **directly replicated**? (Look for "ManyLabs" or registered replication reports).

  ### 4. Should You Trust Bayes Factors by Default?
  **No.** A Bayes Factor is only as good as the model and priors behind it.

  *   **Default Priors:** Many papers use "default" priors (e.g., in JASP software). These are better than nothing, but they aren't "truth."
  *   **Sensitivity Analysis:** A good Bayesian paper shows how the BF changes under different priors. If the result flips from "strong evidence" to "anecdotal" based on a slight tweak in the prior width, the finding is not robust.
  *   **The New Standard:** The post-crisis gold standard isn't "Bayesian vs. Frequentist." It is **"Frequentist/Bayesian + Preregistration + High Power + Open Data."**

  ### Summary: How to Update Your Priors on Science
  You are right to be skeptical, but don't swap one idol (p-values) for another (Bayes Factors).

  1.  **Suspect "Surprising" Social Science:** If a paper claims a subtle intervention changes complex behavior (voting, grades, posture) with a small sample, be skeptical regardless of the statistic used.
  2.  **Preregistration is King:** A preregistered study with $p = 0.04$ is often more trustworthy than an unregistered study with $BF = 10$. Preregistration limits the "garden of forking paths."
  3.  **Look for Replications:** Trust the meta-analysis or the replication study more than the original discovery. The "Discovery" phase is where the noise is highest.
  4.  **Effect Sizes > Significance:** A tiny effect with $p < 0.001$ (due to huge N) might be statistically real but practically meaningless. Look at the Confidence Intervals.

  **The Lesson:** The replication crisis wasn't caused by math errors; it was caused by a culture that rewarded novelty over truth. Math can help (Bayes is generally more intuitive for evidence weighing), but only a cultural shift toward transparency (Open Science) fixes the root cause.

  So, keep reading Scott Alexander, but maybe add Andrew Gelman (for the "Garden of Forking Paths") and Ulrich Schimmack (for "Z-curve" analysis of replicability) to your reading list. They provide the structural critique that balances the statistical one.
