      *   *The Defense Strategy:* The "Ex Ante Strategy" view. Rationality is about choosing the best plan *before* the game starts, conditional on the information structure. Counterfactuals at off-equilibrium nodes are evaluated based on the *ex ante* plan, not by updating beliefs as if the node were reached in reality (which would violate the CKR premise).

