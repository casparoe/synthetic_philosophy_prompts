answer: |-
  You have hit on something profound, and your intuition is spot-on. What you are witnessing is a microcosm of political philosophy playing out in real-time, and your observation that everyone is "reverse-engineering principles to benefit themselves" has a name: **Public Choice Theory.**

  In short, Public Choice Theory suggests that individuals in political (or quasi-political) settings act primarily out of self-interest, even when they claim to be arguing for abstract justice. Gary isn't arguing for "consequences" because he read Rousseau; he's arguing for it because he lives there year-round. The seasonal owner isn't arguing for "property rights" because of Locke; they're arguing for it because they don't want to lose control of their asset.

  To answer your question: **Is there a non-arbitrary way to sort this out?**

  Philosophically, no. There is no "God's eye view" of justice that solves this perfectly. But practically? Yes. There are established frameworks for balancing these competing interests that prevent the community from tearing itself apart.

  Here is a breakdown of the three models currently fighting in your community, the legal reality of your situation, and how stable communities usually solve this.

  ### 1. The Three Competing Models
  You identified three arguments. In political science, these map to specific theories of legitimacy:

  *   **The Property Model (Current Status Quo):**
      *   *Principle:* The POA is a **corporation**, not a government. The houses are shares.
      *   *Logic:* You own the asset, you control the asset. If you buy a share of Apple, you get a vote, even if you never visit Cupertino.
      *   *Who it benefits:* Seasonal owners and investors.
      *   *Weakness:* It allows people with no "skin in the game" regarding daily life (Airbnb investors) to dictate rules to those who actually live with the consequences.

  *   **The Polity Model (Gary's Argument / Residency):**
      *   *Principle:* The POA is a **municipality**.
      *   *Logic:* Legitimacy comes from being governed. If you sleep here, you should vote here. This is the "No Taxation Without Representation" argument flipped to "No Rules Without Representation."
      *   *Who it benefits:* Full-time residents and tenants.
      *   *Weakness:* It disenfranchises the people whose capital actually maintains the property values. It also creates a transient electorate (tenants move out, owners stay).

  *   **The Fiscal Model (The "Dues" Argument):**
      *   *Principle:* The POA is a **co-op**.
      *   *Logic:* Voting power is tied to financial contribution.
      *   *Who it benefits:* High-dues payers (usually owners).
      *   *Weakness:* It creates a plutocracy where wealth equals voice, and it ignores the wear-and-tear caused by residents.

  ### 2. The Legal Reality (The "Fantasy" Check)
  You asked if it always comes down to "whoever has enough votes to write the rule first."

  In a POA, **yes, but with a huge caveat.**
  Unlike a town, a POA is bound by contract law (the Covenants, Conditions, and Restrictions, or CC&Rs). In most states, you cannot simply vote to change voting rights from "owners" to "residents" without a supermajority (often 67% or 75% of *all* owners).

  This is actually a feature, not a bug. It prevents the "Tyranny of the Majority." If full-time residents (50% of houses) could vote to seize control tomorrow, seasonal owners would never invest in the community in the first place. The difficulty of changing the bylaws forces compromise.

  **Regarding the Tenants:**
  Legally, tenants are almost always excluded from voting in POAs. Their "vote" is their lease. If they don't like the rules, they move. Giving tenants voting rights creates a principal-agent problem: The tenant can vote to lower dues and defer maintenance, knowing they won't be there when the road crumbles in five years. The owner pays the bill for that decision.

  **Regarding the Mill Houses:**
  This is likely an **easement** issue, not a voting issue. If they have a legal easement to use the road, the POA cannot block them, nor can the POA force them to join. However, the POA *might* be able to charge a "user fee" for road maintenance if the easement allows for it, or if state law permits lien-based road associations. They are "free riders," which is infuriating, but usually a legal constraint you have to live with.

  ### 3. Is There a Non-Arbitrary Solution?
  Since no single principle is "true," successful communities usually adopt **Hybrid Models** that acknowledge the validity of multiple claims. Here is how other associations break this deadlock:

  **A. Weighted Voting or Quotas**
  Instead of "One House, One Vote," the bylaws can stipulate board composition.
  *   *Example:* The Board must have 5 members. 3 must be full-time residents, 2 must be seasonal owners.
  *   *Why it works:* It guarantees that daily consequences are represented (Gary gets his say) without stripping ownership rights from seasonal folks.

  **B. The "Occupant" vs. "Owner" Distinction**
  Keep voting for *owners* (protecting the asset), but create a **Tenant/Resident Advisory Committee.**
  *   *Example:* Tenants can't vote on the budget, but the POA bylaws require the Board to meet with the Tenant Committee before approving rules on noise, trash, or road use.
  *   *Why it works:* It gives residents a voice on "consequences" without giving them control over "capital."

  **C. Tiered Dues / Voting**
  Some associations differentiate between "Class A" (Owner-Occupied) and "Class B" (Investor/Seasonal) memberships.
  *   *Example:* Class A gets 1.2 votes, Class B gets 0.8 votes. Or, Class B pays slightly lower dues because they don't use the trash service year-round, but they retain full voting rights to protect their investment.

  ### 4. The Cynical Truth (and the Hopeful One)
  You asked: *"Is that basically a fantasy and it always just comes down to whoever already has enough votes to write the rule first?"*

  **The Cynical Truth:**
  Yes. If the seasonal owners realize they are losing power, they will form a bloc and vote down any bylaw change. If the full-time residents realize they have the numbers, they will try to pack the board. It is power dynamics.

  **The Hopeful Truth:**
  Because the threshold to change bylaws is usually high (supermajority), **no side can win outright.** This forces negotiation.
  The "Non-Arbitrary" solution isn't a philosophical discovery; it's a **stable equilibrium.**

  The best path forward for your community is to stop arguing about *who is right* and start arguing about *what creates stability.*
  *   **To the Seasonal Owners:** "If you don't give residents a voice, resentment will build, property values will drop, and the community will feel hostile when you visit."
  *   **To the Residents:** "If you strip owners of voting rights, investment will dry up, dues will skyrocket, and the road won't get plowed."
  *   **To the Airbnb Investors:** "You are the weakest link here. You extract value without adding social capital. You should be the first to compromise."

  ### Summary
  There is no philosophical "correct" answer. Your neighbor Gary is right that consequences matter. The owner is right that funding matters. The lawyer would tell you that deeds matter.

  The solution is almost always **structural compromise.**
  1.  Keep voting with the **deeds** (protects investment).
  2.  Mandate **board residency requirements** (protects daily living).
  3.  Create a **formal channel for tenant input** (protects quality of life).
  4.  Accept the **Mill Houses** as a legal reality, but explore legal counsel on whether a road maintenance fee can be levied against them.

  If everyone insists their principle is the *only* principle, the community will fracture. If everyone admits they are arguing for their own interest (as you wisely noticed), they can start trading concessions. That's not just politics; that's how neighbors stay neighbors.
