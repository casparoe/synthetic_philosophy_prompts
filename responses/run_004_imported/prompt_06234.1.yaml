answer: |-
  **Setting:** *A seminar room, late evening. The whiteboard is covered in the notation of Lewis's triviality proof: $P(A \to C) = P(C|A)$, leading to $P(C|A) = P(C)$. Marcus (Truth-Conditionalist) is capping a marker. Elena (Non-Truth-Conditionalist) is leaning against a desk, arms crossed.*

  **Marcus:** You're smiling like someone who just watched a building collapse.

  **Elena:** Isn't it beautiful? Lewis didn't just find a crack in the foundation. He showed that if you try to build a house of propositions on the foundation of the Equation, the walls have to be parallel to the floor. It's a reductio of the truth-conditional project for indicatives. Full stop.

  **Marcus:** It's a reductio of the idea that the Equation is a *semantic* constraint. That's the difference. You're treating Lewis's result as a discovery about conditionals. I'm treating it as a discovery about probability functions. We keep the propositions. We restrict the scope of the Equation.

  **Elena:** Restrict it where? To "special" cases? That's ad hocery, Marcus. The Equation captures the Ramsey Test. When I ask you to assess "If it rains, the match won't light," you don't look for a world where that proposition is true. You suppose it rains and check your confidence in the match not lighting. That's the data. Lewis proves you can't map that data onto a truth value without trivializing your credence function. So the data wins. Conditionals aren't propositions.

  **Marcus:** But if they aren't propositions, what are you doing when you assert one? Assertion is a norm-governed activity. The standard norm is: Assert $p$ only if you believe $p$ is true. If "If $A$, then $C$" has no truth conditions, it can't be true. So what norm governs your assertion?

  **Elena:** A norm of *acceptability*, not truth. I assert the conditional to invite you into a supposition. I'm saying, "Add $A$ to your stock of beliefs; how much does $C$ follow?" It's not a description of the world; it's a instruction on how to update.

  **Marcus:** An instruction? Then how do we disagree? If I say "If the butler did it, he used the candlestick" and you say "No, if the butler did it, he used the rope," we aren't contradicting each other if there's no proposition at stake. You're giving one instruction, I'm giving another. But it *feels* like a contradiction. We act as though we can't both be right.

  **Elena:** We can't both be right *given the same evidence*. If we share a probability function, and your $P(\text{Candlestick}|\text{Butler})$ is high and mine is low, one of us is miscalculating the evidential support. We disagree about the relation between the antecedent and consequent, not about a fact in the world.

  **Marcus:** That's a slippery slope. Because now you have to explain embedding. This is where your view hits the wall. "Either if $A$ then $B$, or if $C$ then $D$." Or McGee's famous case: "If a Republican wins, then if it's not Reagan, it's Anderson." You can embed conditionals in the antecedents of other conditionals. Logic requires truth-values to compute the truth-value of the compound. If the inner conditional has no truth value, the whole sentence is semantically defective. But it's not defective. I can believe it. I can assert it.

  **Elena:** *Pushes off the desk and walks to the board.* You're assuming classical logic is the only game in town. Dynamic semantics handles this. We treat the conditional as a context change potential. "If $A$, then $C$" updates the context. A compound sentence is just a sequence of updates. We don't need a truth value for the parts to know the effect of the whole.

  **Marcus:** Dynamic semantics is a patch. It explains the *flow* of information, but it doesn't explain validity in the traditional sense. Modus Ponens. $A \to C$, $A$, therefore $C$. If the first premise isn't the kind of thing that can be true, in what sense does it *entail* the conclusion? You're changing the rules of logic to save the Equation.

  **Elena:** I'm changing the rules of *semantics* to save the data. Look at the board, Marcus. Lewis's proof is rigorous. If you insist there is a proposition $A \to C$, and you insist rational agents obey the probability axioms, then $P(A \to C)$ must equal $P(C)$ whenever $A$ and $C$ are probabilistically independent. That means learning $A$ shouldn't change your belief in the conditional. But that's absurd. Learning the antecedent is exactly what makes the conditional relevant.

  **Marcus:** I grant that $P(A \to C) = P(C|A)$ fails as a general identity. But that doesn't mean the conditional lacks truth conditions. It means the *assertability* of the conditional tracks conditional probability, even if its *truth* conditions do not. Jackson's line. The proposition might be material ($A \supset C$), which is truth-conditional, but we only assert it when it's robust—when it remains believable even after learning $A$.

  **Elena:** Jackson's "robustness" is just the Equation in a trench coat. You're saying the truth condition is the material conditional, which is trivially true whenever $A$ is false. So I can truthfully say "If I drop this glass, it will turn to gold" simply because I'm not dropping it. That violates the basic intuition of what conditionals *do*. You save truth-conditions by making them irrelevant to use.

  **Marcus:** I save the logic. You save the intuition of probability but sacrifice the logic of embedding. We both have a bullet to bite.

  **Elena:** Mine is softer. I just say logic for natural language isn't classical propositional logic. Yours is harder. You have to explain why, if the truth conditions are material (or even Stalnakerian closest worlds), the probability of the conditional *so perfectly* aligns with conditional probability in almost every non-pathological case we actually encounter. If the Equation is false, why is it such a good heuristic?

  **Marcus:** Because rational agents update by conditionalization! If the truth conditions are sensitive to similarity relations between worlds—as Stalnaker argues—then the probability of the proposition *approximates* the conditional probability in standard contexts. Lewis's triviality result relies on the assumption that the conditional proposition is independent of the antecedent in a specific way. We can deny that independence. We can say the proposition expressed by $A \to C$ shifts depending on the probability distribution.

  **Elena:** Contextualism about the proposition? Now you're multiplying entities. The content of my sentence changes depending on my credence function? That makes communication a miracle. How do I know which proposition you're expressing if I don't already know your credences?

  **Marcus:** And how do I know which "suppositional context" you're invoking if I don't know your semantic rules? You accuse me of mystifying the proposition. I accuse you of mystifying the speech act. You say we "express conditional degrees of belief." But language is public. We argue about conditionals in courtrooms, in science. "If the defendant was there, he left fingerprints." A jury has to decide if that's *true*, not if it's a useful supposition.

  **Elena:** The jury decides if the evidence supports the inference. They aren't looking for a Platonic fact about "if-ness."

  **Marcus:** They verdict on facts. "Guilty" implies the premises were true. If your conditionals have no truth value, the chain of reasoning has no truth value. You leave us with a pragmatism that can't ground a verdict.

  **Elena:** And you leave us with truth conditions that force us into triviality or irrelevance. Look, let's be honest about the cost.

  **Marcus:** Agreed.

  **Elena:** If I stick with the Equation, I owe the world a semantics for negation. "It is not the case that if $A$, then $C$." If the conditional isn't a proposition, what does it mean to negate it? Is it denying the suppositional link? Does it have a truth value now? I have to explain how a non-truth-apt sentence can sit inside a truth-apt operator without category error. That's my debt. A logic of unassertibles.

  **Marcus:** And if I stick with Truth Conditions, I owe the world an explanation of the *Equation's Grip*. I have to explain why, for forty years, the most brilliant logicians have felt that $P(\text{If } A, C)$ just *is* $P(C|A)$. If I say that's a confusion between truth and assertability, I need a psychological story about why that confusion is so universal and so resistant to correction. I can't just say "people are sloppy." I have to show why the sloppiness is rational.

  **Elena:** So you admit the Equation describes our practice better than your truth conditions do.

  **Marcus:** I admit it describes our *credences* better. It doesn't describe our *logic*.

  **Elena:** And I admit my logic is non-classical. But my practice is human.

  **Marcus:** *Picks up his bag.* Then we're at a standoff. Like Gibbard's case. Same evidence, different theoretical commitments.

  **Elena:** *Smiles.* If we're at a standoff, then according to you, there's a fact of the matter about who's right. According to me, there's just a difference in how we choose to model the language.

  **Marcus:** Careful, Elena. If you say that, you're making a conditional claim about truth. "If we adopt your view, then there is no fact..."

  **Elena:** *Laughs.* Touché. See you next week?

  **Marcus:** Only if you promise to bring a truth value for that invitation.

  **Elena:** I'll bring a high conditional probability. It'll have to do.

  *[They turn off the lights. The whiteboard remains in the dark, the equation $P(A \to C) = P(C|A)$ faintly visible.]*
