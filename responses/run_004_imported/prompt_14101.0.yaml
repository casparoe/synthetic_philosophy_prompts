answer: |-
  This is a fantastic debate, and honestly, it cuts to the core of a tension in modern ethics that most people gloss over. Priya has done her homework on the *formalism*, but you have the better grasp on Ramsey's *philosophy*.

  Here is the reconstruction you need to settle this. It turns on the difference between Ramsey's **logic of decision** (the math) and Ramsey's **theory of inquiry** (the epistemology).

  ### 1. Priya's Trap: The Formalist Objection
  Priya is technically correct that Frank Ramsey is the grandfather of the Subjective Expected Utility (SEU) framework. In *Truth and Probability* (1926), Ramsey defines belief not as a static mental state, but as a disposition to act (betting odds). If you accept SEU, the math is ruthless:
  $$ \text{Expected Value} = \text{Probability} \times \text{Utility} $$
  If the Utility (future people) approaches infinity, even a vanishingly small Probability dominates the equation. Priya's point is: *You built the engine, Frank. You don't get to complain when it drives off a cliff.*

  If Ramsey were dragged to an EA talk, Priya argues he would be forced to concede that if you accept his axioms, you must accept Longtermism.

  ### 2. Ramsey's Counter: The Pragmatist Objection
  However, Priya is making a category error common among effective altruists: she is treating Ramsey's formalism as a metaphysical truth-generator rather than a tool for human inquiry. Ramsey would not bite the bullet. He would reject the **inputs** of the Longtermist equation, not the logic.

  Here are the three specific objections Ramsey would raise, based on his actual texts (*Truth and Probability*, *On Truth*, and *Foundations of Mathematics*):

  #### A. The "Betting" Constraint on Probability
  Ramsey defined probability operationally. To say you assign a probability of $10^{-6}$ to an event, you must be able to conceive of a bet where that odds ratio makes you indifferent.
  **Ramsey's Objection:** "You cannot form a coherent betting quotient on the state of the world in 10,000 years."
  For Ramsey, probability is relative to a system of knowledge and a context of action. The causal chain between "present policy" and "astronomical future population" is so attenuated that no coherent degree of belief can be formed. It's not just "uncertain"; it is **undefined** in the Ramseyan sense. To assign a number there is not rational calculation; it is pseudoscience masquerading as math. He would argue the Longtermist is violating the very conditions that make probability meaningful.

  #### B. The Utility Function is Human, Not Cosmic
  Ramsey was a humanist. His utility theory is derived from *actual* human preferences and goods. In *On Truth* (the unfinished manuscript where the "threepenny bits" quote appears), he argues that our goods are local, human, and finite.
  **Ramsey's Objection:** "Whose utility are we maximizing?"
  Longtermism relies on **Impersonal Total Utilitarianism** (the sum of all welfare). Ramsey's framework does not mandate this. It only mandates that *if* you have certain desires, you act consistently to fulfill them. Ramsey would argue that a utility function that scales linearly with abstract, non-existent beings violates the psychological and ethical reality of the agent. Value is perspectival. If my ethical perspective is drawn in human scale (as the "threepenny bits" quote says), then "astronomical numbers" are not valid inputs for my utility function. They are category errors.

  #### C. Truth is What Works in Inquiry
  Ramsey was a pragmatist about truth. A belief is true if it leads to successful action and inquiry within a community.
  **Ramsey's Objection:** "Does this belief guide actionable inquiry?"
  Focusing on the "astronomical future" often leads to paralysis or abstract speculation that disconnects from immediate human verification. For Ramsey, ethics is part of the "system of knowledge" we use to navigate life. An ethical system that demands we sacrifice the "big foreground" (real people, real suffering) for the "small background" (statistical ghosts) fails the pragmatic test of truth. It doesn't help us live better; it makes our ethical map unusable.

  ### 3. The Verdict: Can He Hold Both Positions?
  **Yes.** And this is where you win the argument, provided you refine your position.

  Priya thinks Ramsey's math *dictates* his ethics. Ramsey would say his math *describes* how ethics functions for a rational agent, but it does not *prescribe* what that agent must value.

  *   **Priya is right that:** Ramsey invented the calculator.
  *   **You are right that:** Ramsey gets to decide what numbers you are allowed to type into it.

  The "threepenny bits" quote isn't just a mood; it is a **boundary condition on the utility function**. Ramsey is asserting that human value does not scale cosmically. Therefore, the "Astronomical Waste" argument fails not because the math is wrong, but because the *axiology* (theory of value) is inhuman.

  ### How to Settle It
  Tell Priya this:

  > "Ramsey's framework requires that probabilities be grounded in actionable betting contexts and that utilities be grounded in actual human goods. Longtermism fails the first test because we cannot form coherent probabilities over deep time (it's not a valid bet), and it fails the second test because it assumes an impersonal utility function that Ramsey explicitly rejected in favor of a human-centric perspective.
  >
  > Ramsey didn't build a machine that forces us to worship the future; he built a machine that forces us to be honest about what we actually value and what we can actually know. The 'threepenny bits' isn't a refusal to do math; it's a refusal to let bad math overwrite human reality."

  **The Score:**
  *   **Priya:** Wins on formal logic (SEU implies aggregation).
  *   **You:** Win on philosophical application (Ramsey's epistemology forbids the inputs Longtermism requires).

  Ramsey would tell Priya she is using a hammer to perform surgery. Just because he invented the hammer doesn't mean he'd agree with cutting the patient.
