answer: |-
  The booth smelled like ozone and stale coffee, the same as it had every Friday for three years. I stepped onto the pad, checking the alignment of my heels on the yellow markers. Routine. That was the selling point of the Quantum Displacement Network. You could work the helium mines on Luna and sleep in your own bed in Chicago. No six-month transit, no radiation sickness. Just step in, flash, step out.

  "Vitals look green, Elias," Sarah said from the control glass. She didn't look up from her tablet. She'd scanned me four hundred times. I was just cargo with a pulse.

  "See you Monday," I said. My voice sounded flat in the acoustic foam.

  "Have a good weekend. Say hi to Maya for me."

  I nodded, though she was already looking at her screen. I closed my eyes. I wasn't supposed to, but I always did. I wanted to be unconscious for the unspooling. I wanted to miss the moment where the machine mapped every atom of my body, recorded the state, and then vaporized the meat so it could print the data somewhere else.

  There was the usual hum, a pressure behind the eyes like a sneeze that never comes, and then the white flash.

  Then, gravity returned.

  I stumbled forward, catching myself on the railing. The air here smelled different—recycled Earth air, heavy with humidity compared to Luna's dry scrub. I took a breath, waiting for the post-jump nausea to settle.

  "Jesus," a voice said.

  I froze. I knew that voice. It was mine.

  I looked up. Across the reception bay, standing near the exit door, was a man in a grey jumpsuit. He had my face. He had the same scar on his chin from when I fell off a bike at age nine. He had the same wedding band on his left hand, the one Maya had slipped on during a courthouse ceremony five years ago.

  He was staring at me, his mouth slightly open.

  "System error," a technician shouted, running into the bay from the control room. "Buffer overflow. The stream split. We have two instances."

  I looked at the man across the room. He looked at me. We raised our hands at the same time. We touched our chins at the same time.

  "I'm Elias," I said.

  "I'm Elias," he said. His voice cracked exactly where mine did when I was tired.

  "We need to isolate them," the lead technician barked. He didn't look worried about us; he looked worried about the paperwork. "Security, seal the bay."

  Two guards moved in, hands on their holsters. They weren't looking at us like people. They were looking at us like duplicated files on a hard drive.

  "Wait," I said, stepping forward. The other me stepped forward too. "What happens now?"

  The lead tech, a man named Henderson I'd never seen before, sighed. "Protocol 88. In the event of multiplicity, one instance is designated Prime based on biometric stability. The other is... recycled."

  "Recycled," the other me repeated. The word hung in the air, heavy and final. "You mean killed."

  "Deconstructed," Henderson corrected. "The atoms are reclaimed. It's painless."

  I felt a cold sweat break out on my back. I remembered walking into the booth on Luna. I remembered the smell of ozone. I remembered thinking about Maya's birthday dinner tonight. I remembered the fear of the flash.

  He remembered it too. I could see it in his eyes. We were the same person up until the nanosecond of reconstruction. We both had the same claim to the memories. We both had the same love for our wife. We both had the same fear of dying.

  "If you kill him," I said, pointing at my double, "you're killing me."

  "If I kill you," Henderson said, checking his tablet, "I'm killing you. It's semantics. The original was destroyed in Luna. You are both reconstructions. Statistically, neither of you is the 'original' Elias. But only one can leave."

  The other me laughed, a bitter, jagged sound. "So we're both ghosts? And you get to decide which one haunts the house?"

  "We get to decide which one is legally recognized," Henderson said. "Now, stand apart. We need to run a stability diagnostic."

  We stood there, five feet apart, while machines hummed around us. I looked at him. Really looked at him. I saw the way he shifted his weight on his left leg, favoring an old knee injury. I saw the way he chewed the inside of his cheek when he was scared. He was me. If he died, a part of me died. But if I died... I wouldn't be there to feel the loss.

  "Maya hates cilantro," I said suddenly.

  He blinked. "I know. I put it in the salad once by accident and she made me sleep on the couch for a week."

  "We promised to take her to the lake house in August."

  "We bought the tickets last Tuesday," he said. His voice softened. "She's waiting. She's making pot roast."

  The diagnostic beeped. Henderson looked at the screen. "Instance Two has a .04 percent variance in neural mapping. Instance One is stable."

  He pointed at me. Instance One.

  "No," the other me said. He stepped back, hitting the wall. "Flip a coin. Let us decide."

  "That's not protocol," Henderson said. He signaled the guards.

  "Wait," I said. My heart was hammering against my ribs. If I was the stable one, I lived. If I was the unstable one, I died. But the difference was .04 percent. A glitch in the scan. A random noise in the data. It wasn't merit. It wasn't soul. It was noise.

  The other me looked at me, and in his eyes, I saw a terrifying resignation. He knew what I was thinking. We were thinking the same thing.

  "Go," he said.

  "What?" Henderson snapped.

  "Let him go," the other Elias said. He looked at me, and for a moment, the existential horror shifted into something else. Pity? "You're Instance One. You're the one they want. Just... go home. Tell her I love her."

  "Sir, step away from the instance," a guard said.

  "No," I said. I looked at my double. "If I walk out there... what are you?"

  "I'm the draft," he said. "I'm the copy you make when you're practicing a signature."

  "That's not true."

  "Isn't it?" He smiled, but it didn't reach his eyes. "You remember the booth. You remember the fear. But you're walking out. I'm not. That makes you the real one, doesn't it? Because you're the one who gets to keep being afraid."

  Henderson nodded to the guards. They moved in on him.

  "Wait!" I shouted.

  "Instance Two is being scheduled for reintegration," Henderson said calmly. "Instance One, please proceed to the exit. Your transport to Chicago is waiting."

  I stood frozen. The door to the outside world was open. I could see the grey sky of Earth. I could go home. I could eat the pot roast. I could hold Maya.

  But I looked at the man they were escorting toward a different door, a door marked *Materials*. He wasn't fighting. He was looking at me, waiting to see if I would trade places. But I couldn't. The instinct to survive was too loud. It drowned out the philosophy.

  I walked to the exit.

  "See you Monday," I whispered, though I knew I wouldn't.

  He didn't answer. The door closed between us.

  The car ride to Chicago was quiet. The driver didn't speak. I looked out the window at the passing fields, the corn stalks blurring into green lines. I touched my face. The skin was warm. I checked my pulse. It was steady.

  When I got home, Maya was in the kitchen. The smell of pot roast hit me before I opened the door. She turned, smiling, wiping her hands on a towel.

  "You're early," she said. "Jump go okay?"

  I stood in the doorway. I looked at her, really looked at her. I remembered loving her. I remembered the memory of loving her. But I couldn't remember the feeling of continuity. I felt like a book that had been scanned, printed, and bound perfectly, but the ink was still wet.

  "Fine," I said. My voice sounded normal. "Just tired."

  I walked over and hugged her. She felt solid. Real. I buried my face in her hair, breathing her in.

  "You okay?" she asked, pulling back. "You feel cold."

  "I'm fine," I said.

  I went to the bathroom to wash my hands. I turned on the tap and looked in the mirror. The man in the glass looked back. He had my eyes. He had my scar. He had my life.

  I wondered, as I dried my hands, if the man in the materials room had looked in a mirror too, just before the end. I wondered if he had felt the same doubt. I wondered if I was the survivor, or just the one who got away with the murder of myself.

  I turned off the light, but I didn't leave the room. I just stood in the dark, waiting to see if I would fade.
