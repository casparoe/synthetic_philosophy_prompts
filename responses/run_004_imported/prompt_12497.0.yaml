answer: |-
  Good morning. For thirty years, my office was a dome at fourteen thousand feet. My job was to collect photons that had been traveling for billions of years before they hit my detector. I never touched the source. I never will. I couldn't turn a star off to see if the galaxy dimmed. I couldn't rearrange the initial conditions of the universe to check if the cosmic microwave background would look different. I could only watch the one run of the experiment that was already finished.

  I mention this because I am the bridge you've asked me to build. On one side of this room are the philosophers, debating the architecture of causation. On the other are the scientists of the historical past—astronomers, paleontologists, linguists—people whose data is fixed, whose subjects are dead or distant, and whose "experiments" are strictly forbidden by nature.

  I've spent my retirement reading Woodward. I've spent my career living Lewis. And I need to tell you where the friction burns.

  Woodward's *Making Things Happen* offers a compelling picture: to know a cause is to know how to manipulate an effect. Causation is about handles. If you can't grab a handle, you don't have a causal relation. For a chemist, this is literal. You add the reagent; the solution changes color. The handle is real.

  But for me, standing under that dome, the handle is a ghost. Woodward knows this. He retreats to *hypothetical* interventions. He says it doesn't matter if I *can* turn off the star; it matters whether the theory tells me what *would* happen *if* I could. The causal claim stands if the dependency structure survives the thought experiment.

  This is where I snag.

  To the philosophers: When you make the intervention hypothetical, you are asking me to evaluate a counterfactual. I am to imagine a world where the initial conditions of a star formation are different, hold the laws of physics fixed, and see if the luminosity changes. But that is precisely David Lewis's game. Lewis asked us to compare the actual world to the closest possible world where the cause did not occur.

  If Woodward's intervention is something I can never perform, not even in principle, but only imagine in a model, then manipulability looks like Lewis's counterfactuals in graph-theoretic dress. It looks like you have imported the ontology of possible worlds, drawn some arrows between them, and called it "manipulation" to make it feel more engineering-friendly.

  To the scientists in the room: You might think this is academic hair-splitting. It isn't. If causation requires a handle, and you have no handles, then strictly speaking, you are not doing causal science. You are just pattern matching. You are correlating fossil layers or spectral lines. If you want to claim you are finding *causes*, you need to know if Woodward gives you a license that Lewis does not.

  Here is my honest position, forged from reading the texts and reducing the data.

  Yes, Woodward's reliance on hypothetical interventions concedes Lewis's main ontological point. In the historical sciences, there is no metaphysical difference between "If I had intervened..." and "If things had been different..." Both require me to simulate a universe I do not inhabit. Both rely on similarity metrics between the actual and the possible.

  *However*, Woodward demands a higher tax on that simulation than Lewis does.

  Lewis's counterfactuals can be slippery. When I ask, "If this species hadn't gone extinct, would the ecosystem have collapsed?", Lewis allows me to look for the closest world where the extinction didn't happen. But how do I get there? Do I miracle the asteroid away? Do I evolve the species differently? Lewis worries about the "miracle" required to break the chain.

  Woodward forces me to specify the *mechanism* of the change. He doesn't just ask "If X hadn't happened." He asks "If an external variable had set X to a different value, independent of the usual history." This bans what we call "backtracking." In astronomy, we often fall into the trap of saying, "If the black hole weren't there, the stars wouldn't orbit so fast." But if the black hole weren't there, the gas cloud wouldn't have collapsed, and the stars wouldn't be there either. That's backtracking.

  Woodward's framework slaps my wrist. It forces me to isolate the variable. It demands I imagine a "surgical" strike on the model, not a rewrite of history. Lewis gives me the freedom to imagine any close world; Woodward forces me to imagine a specific *kind* of change—one that breaks the arrow into the variable without breaking the arrows coming out of the past.

  So, does Woodward concede to Lewis? Ontologically, yes. In the realm of the untestable, a hypothetical intervention is a counterfactual conditional. But methodologically, no. Woodward provides a discipline for the imagination that Lewis lacks. He turns the counterfactual from a poetic musing into a structural constraint. He forces the astronomer to build a model where the "intervention" is a well-defined parameter change, not a magical rewrite of the past.

  But this leaves us with a tension that I want to leave on the table for this workshop.

  If the intervention is purely hypothetical, its validity rests entirely on the model I use to simulate it. I cannot check the model against the intervention, because the intervention is impossible. I can only check the model against the one actual history I have.

  So here is the question I bring to this room, from the observatory to the seminar table:

  If the "intervention" is never to be performed, not even by a god, but exists only as a constraint on how we construct our models... are we still talking about *causation* in the world? Or are we talking about *causation* in our maps?

  When Woodward says "no causation without manipulation," and I reply "I cannot manipulate," and he answers "Then manipulate in your model," have we discovered a feature of the universe? Or have we simply agreed on a rigorous way to tell stories about the past?

  I invite you to spend the next two days telling us whether that distinction matters for the work we do.

  Thank you.
