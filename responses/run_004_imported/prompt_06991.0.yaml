  My friend is 100% convinced her boyfriend isn't cheating on her, not just hopes it, she says she flat out knows it. When another friend mentioned seeing him getting cozy with someone at a bar, she brushed it off without even asking him about it, saying "if I really do know he's not cheating, then whatever they saw has to be some kind of mistake, so theres no point even looking into it." That logic has been bugging me for days, it feels like it would work for literally anything anyone claims to know, but I cant pin down whats wrong with it, since it does seem true that evidence against something you truly know has to be misleading somehow. Is she actually right to blow this off, or is there a hole in that reasoning?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Situation:** A friend is 100% convinced her boyfriend isn't cheating. Another friend reports seeing him getting cozy with someone else. The girlfriend dismisses the report without investigation, reasoning: "If I *know* he's not cheating, then this evidence must be misleading, so there's no point looking into it."
      *   **User's Intuition:** The logic feels wrong/circular, applicable to anything, but the user acknowledges the philosophical truth that *knowledge* implies truth (so counter-evidence *must* be false if the knowledge is real).
      *   **Core Question:** Is she right to blow this off, or is there a hole in the reasoning?

  2.  **Deconstruct the Girlfriend's Argument:**
      *   *Premise 1:* I know $P$ (Boyfriend is not cheating).
      *   *Premise 2:* If I know $P$, then $P$ is true.
