answer: |-
  Your intuition is spot on. There is a significant hole in her reasoning, even though it sounds superficially logical.

  Your friend is conflating **confidence** with **infallibility**, and she is using a philosophical technicality to shield herself from a practical risk.

  Here is a breakdown of exactly where her logic fails, ranging from the philosophical to the practical.

  ### 1. The Epistemological Flaw (The Definition of "Know")
  In philosophy, the standard definition of knowledge is **Justified True Belief**. To say you "know" something, three things must be true:
  1.  You believe it.
  2.  It is actually true.
  3.  You have justification for believing it.

  Your friend's argument relies entirely on point #2. She is saying, *"If I **know** it, then it must be **true**."* Logically, this is a tautology. If you *actually* know something, it cannot be false.

  **The Hole:** Human beings cannot have 100% certainty about empirical events (things that happen in the real world). We can only have high probability.
  *   **Logical Truth:** "A triangle has three sides." You can know this 100%. Evidence to the contrary is impossible.
  *   **Empirical Truth:** "My boyfriend is faithful." This relies on human behavior, which is unpredictable and hidden.

  By claiming she "knows" he isn't cheating, she is claiming **infallibility** regarding another human being's actions. She is treating her internal conviction as an external fact. When she says, *"Evidence against something you truly know has to be misleading,"* she is technically right **IF** she truly knows. But since she cannot possibly verify his every move, she doesn't *know*; she *believes strongly*.

  ### 2. The Circular Reasoning (The Self-Sealing Loop)
  Her logic creates a "self-sealing" argument that makes it impossible for her to ever be proven wrong. It looks like this:
  1.  **Premise:** I know he is not cheating.
  2.  **Conflict:** Friend says she saw him cheating.
  3.  **Resolution:** Since Premise 1 is true, the Conflict must be false.
  4.  **Action:** Do not investigate.

  This is circular. She is using the *claim* of knowledge to dismiss the *evidence* that would test the validity of that knowledge.

  **The "Locked Door" Analogy:**
  Imagine you leave your house and think, *"I know I locked the door."*
  A neighbor calls and says, *"I walked by and your door was open."*
  If you use your friend's logic, you would say: *"I **know** I locked it. Therefore, you must be mistaken. I won't go check."*
  In reality, the rational response is: *"I am 99% sure I locked it, but your evidence introduces doubt. I should go check to resolve the conflict."*

  ### 3. The Bayesian Flaw (Ignoring Probability)
  Rational thinking works on probability, not absolutes.
  *   **Prior Probability:** She believes there is a 1% chance he is cheating (99% faithful).
  *   **New Evidence:** A trusted friend reports seeing him getting cozy with someone.
  *   **Updated Probability:** Even if the friend is sometimes mistaken, the probability of cheating should rise from 1% to, say, 30%.

  By refusing to update her probability based on new evidence, she is violating the basic rules of how humans process information. She is treating a probabilistic belief as a mathematical constant.

  ### 4. The Practical Flaw (Risk Assessment)
  This is the most important part for your friend's well-being. Decisions should be based on **Risk vs. Cost.**

  *   **Scenario A: She investigates.**
      *   *If he is innocent:* She has an awkward conversation, clears it up, and gains peace of mind. **Cost: Low.**
      *   *If he is guilty:* She finds out early, protects her health (STIs), and saves time. **Benefit: High.**
  *   **Scenario B: She ignores it (Her current plan).**
      *   *If he is innocent:* Nothing changes. **Benefit: Neutral.**
      *   *If he is guilty:* She remains deceived, risks her health, and invests more time in a failing relationship. **Cost: Catastrophic.**

  Even if she is 99% sure, the cost of being in the 1% wrong is so high that the rational move is *always* to investigate. Dismissing the evidence isn't "trusting"; it's **risk negligence.**

  ### 5. Trust vs. Willful Ignorance
  There is a distinction between **Trust** and **Blind Faith.**
  *   **Trust:** "I have no evidence you are cheating, but if something looks suspicious, we will talk about it openly to resolve the doubt."
  *   **Blind Faith:** "I refuse to look at evidence that contradicts my belief, because looking at it would mean I don't 'know'."

  Her reasoning suggests she is afraid that *asking the question* invalidates the *knowledge*. She thinks, *"If I have to ask, then I didn't really know."* This is an emotional defense mechanism, not a logical stance. She is protecting her feeling of safety rather than ensuring her actual safety.

  ### Summary
  You are right to be bugged. Her logic works for math ("I know 2+2=4, so if a calculator says 5, the calculator is broken"), but it does not work for human relationships.

  She is using the **definition of knowledge** to bypass the **process of verification.** She isn't actually "knowing" anything; she is choosing comfort over clarity. If she truly cared about the truth, she would realize that if he *isn't* cheating, a simple conversation will confirm it instantly with zero downside. The fact that she refuses to have that conversation suggests she is protecting her belief, not the relationship.
