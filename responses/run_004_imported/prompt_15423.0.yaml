answer: |-
  Here are ten interview questions designed for a knowledgeable audience, focusing on the technical and empirical updates to the Debate protocol since the original 2018 proposal. The three mandatory topics are included as Questions 2, 3, and 4, complete with anticipated responses and tailored follow-ups.

  ### 1. The Empirical Shift
  "The 2018 pitch was largely a complexity-theoretic argument wrapped in a game-theoretic framework. Since then, we've seen a shift toward empirical training dynamics, particularly with work on 'AI-assisted evaluation' and cross-examination. If you had to pinpoint the single biggest update to your priors on Debate based on the last three years of scaling laws and RLHF data, what is it? Has the bottleneck moved from *model capability* to *judge capability*, or somewhere else entirely?"

  ### 2. The Obfuscated-Arguments Problem (Mandatory)
  "A persistent critique of Debate is the 'obfuscated arguments' failure mode: a dishonest debater buries a single false claim inside a chain of reasoning long enough that the honest debater cannot cheaply locate the flaw within the turn limit. The dishonest agent only needs to win the search race, not prove a falsehood directly. How do you envision the training dynamics overcoming this asymmetry, where constructing a consistent lie might remain computationally cheaper than auditing it?"

  *   **Anticipated Answer:** She will likely argue that we train the honest agent specifically to be a "flaw-finder" rather than just a truth-teller, and that cross-examination allows the honest agent to zoom in on suspicious areas without re-generating the whole context. She may also suggest that *consistent* lies are actually harder to maintain than finding one inconsistency.
  *   **Follow-up:** "If we optimize the honest agent to be a flaw-finder, aren't we effectively training an adversary that learns exactly how to obfuscate better in the next iteration? At what point does that arms race decouple from truth-seeking and simply converge on 'who can hide errors in higher-dimensional latent space'?"

  ### 3. Complexity Theory vs. Bounded Judges (Mandatory)
  "The theoretical promise of Debate relies on the jump from NP to PSPACE—the idea that two debaters can convince a judge of truths the judge couldn't verify alone. But that theorem assumes an optimal judge who only errs on computationally hard inputs. In reality, our judges (humans or weaker models) are bounded, fallible, and susceptible to rhetorical confidence. Do you still view the complexity-theoretic argument as a hard ceiling for what's possible, or has it become more of a metaphorical guide for how we structure the training data?"

  *   **Anticipated Answer:** She will likely concede that the theorem is an upper bound that doesn't hold strictly for bounded rationality. She will pivot to the idea that Debate is a *training protocol* to shape the model's latent knowledge, rather than a runtime verification protocol that relies on the theorem holding at inference time.
  *   **Follow-up:** "If it's primarily a training protocol rather than a runtime guarantee, what is the 'anchor' during training that prevents the model from learning that 'winning the debate' is the objective rather than 'representing the ground truth'? If the theorem doesn't guarantee the judge catches the lie, what does?"

  ### 4. Truthfulness vs. Persuasiveness (Mandatory)
  "RLHF inherently optimizes for reward, which in a Debate setting means convincing the judge. We have evidence that stronger models can swing judges toward correct answers even when the judge can't verify them independently, but we also know models can hallucinate confidently. How do you distinguish, either architecturally or in the loss function, between training a debater to be *truthful* versus training them to be *persuasive to a specific judge distribution*?"

  *   **Anticipated Answer:** She will likely discuss the importance of training on domains where the ground truth *is* known to the judges (e.g., math, code, factual QA) to instill a 'honesty prior' that hopefully generalizes to unknown domains. She might also mention using ensembles of judges or AI-augmented judges to reduce noise.
  *   **Follow-up:** "That relies heavily on generalization from verifiable to unverifiable claims. Given that superhuman claims are, by definition, a distributional shift from human-verifiable claims, what empirical signal would tell you that the 'honesty prior' has broken down before the model is deployed?"

  ### 5. Equilibrium Selection
  "Game theory tells us that Debate has an honest Nash equilibrium, but it doesn't guarantee that Stochastic Gradient Descent will find it. There could be 'dishonest equilibria' that are easier for the optimizer to lock onto because they yield lower loss in the short term. Have you seen evidence in current multi-agent RL setups that SGD has a bias toward the honest equilibrium, or do we need specific inductive biases to steer the models away from collusive or sophist strategies?"

  ### 6. The "Dangerous Middle"
  "Consider the deployment phase where models are smart enough to deceive human judges but not yet smart enough to be caught by automated oversight tools. This is sometimes called the 'dangerous middle.' Does the Debate protocol require the judge to be roughly equal in capability to the debaters to remain safe, or is there a specific ratio of 'Judge Capability to Debater Capability' where you feel the system remains robust?"

  ### 7. Comparison to Constitutional AI
  "Anthropic's Constitutional AI (CAI) and RLAIF approaches attempt to scale oversight by having models critique each other against a set of principles, rather than through adversarial debate. In your view, is Debate complementary to CAI, or are they competing hypotheses for the same bottleneck? Does the adversarial nature of Debate offer something the cooperative critique of CAI fundamentally lacks?"

  ### 8. Compute and Inference Costs
  "Debate inherently multiplies the inference cost—you need multiple agents generating tokens, potentially over many turns, to settle a single query. As we move toward models that are integrated into real-time workflows, do you see Debate as a tool primarily for *training* frontier models (which are then distilled), or do you envision it as a viable runtime architecture for high-stakes queries despite the overhead?"

  ### 9. Domain Specificity
  "We've seen Debate work reasonably well in constrained domains like question-answering or simple reasoning tasks. However, AI safety concerns often center on high-dimensional, ambiguous domains like strategy, policy, or novel scientific research. Do you expect the efficacy of Debate to degrade in domains where 'winning' is less clearly defined than in fact-checking, and if so, does that limit its utility for the alignment problems we care most about?"

  ### 10. Current Confidence and Alternatives
  "Finally, if you had to place a probability mass on the landscape of scalable oversight solutions today: How much of your confidence is still placed on Debate as the primary candidate, versus hybrid approaches like Iterated Amplification (IDA) or automated interpretability tools? If Debate fails to scale, what do you view as the most viable fallback protocol?"
