  3.  **Identify the Core Conceptual Issue:**
      *   It's not about computational limits (though that's part of the experimental result).
      *   It's about **Common Knowledge of Rationality (CKR)** and **Belief Revision**.
      *   Backward Induction relies on the premise: "I know you are rational, you know I am rational, I know you know I am rational..." all the way down.
      *   In the Centipede Game, if Player 1 *Passes* at node 1, they have violated the BI prediction.
      *   Player 2 now faces a node that *should not have been reached* if CKR held.
      *   Player 2 must update their belief: "Player 1 is not rational (in the BI sense)" OR "Player 1 thinks *I* am not rational."
      *   If Player 2 believes Player 1 is likely to Pass again, Player 2's optimal move is to Pass (to get the bigger pot later).
      *   Therefore, BI is unstable because the act of deviating from BI provides information that makes deviating from BI rational. This is the **Paradox of Backward Induction** (or the Renormalization/Epistemic problem).

