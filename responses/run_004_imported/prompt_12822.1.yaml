prompt: |-
  I'm taking Virtue Ethics and we just covered the situationist critique - Doris and Harman citing the Good Samaritan study, where seminary students in a hurry walked past someone who needed help, to argue character traits don't predict behavior across situations as well as we'd think. I also sit on my school's Honor Council, and this week's case is that unit come to life: a student caught with her phone out during a final says it was totally out of character - she was exhausted, everyone around her was doing it too, and one bad call under pressure doesnt make her dishonest. Our decision letters call this 'a lack of integrity,' and repeat offenses get harsher sanctions on the assumption that's tracking something stable about her. Draft the short memo I'd bring to Thursday's meeting - a real recommendation on her case, plus whether we should drop that language - that takes the situational-pressure defense seriously instead of just calling it an excuse.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a student in a Virtue Ethics class and a member of their school's Honor Council.
      *   **Topic:** The Situationist Critique (Doris, Harman) vs. Virtue Ethics (stable character traits). Specifically referencing the Good Samaritan study (seminary students in a hurry).
      *   **Current Case:** A student caught using a phone during a final.
      *   **Student's Defense:** "Out of character," exhausted, social pressure (others doing it), bad call under pressure.
      *   **Honor Council's Standard Language:** Calls it "a lack of integrity," assumes stability (harsher sanctions for repeat offenses).
      *   **Task:** Draft a short memo for the Thursday meeting.
      *   **Requirements:**
          *   Make a real recommendation on *this* case.
          *   Address whether to drop/change the "lack of integrity" language.
          *   Take the situational-pressure defense seriously (don't just dismiss it as an excuse).
          *   Bridge the gap between philosophical theory (Situationism) and practical policy (Honor Council).

  2.  **Deconstruct the Philosophical Tension:**
      *   *Virtue Ethics:* Assumes character is stable. If you cheat, you lack integrity. Repeat offenses prove a vicious character. Sanctions should reflect moral failing.
      *   *Situationism:* Behavior is heavily influenced by context (fatigue, peer behavior, time pressure). One act doesn't define a global trait. "Lack of integrity" might be too strong/stable an attribution for a single situational lapse.
      *   *The Middle Ground:* We need accountability without essentializing the student. We can acknowledge the situation without absolving the action. We can treat the sanction as educational/corrective rather than purely retributive based on "character."

  3.  **Determine the Recommendation (The "What"):**
      *   *On the specific case:* The student broke the rule. There must be a consequence. However, if we take situationism seriously, we shouldn't label her *as* dishonest permanently based on this one data point. A standard sanction (e.g., failing the exam, educational module) is appropriate, but perhaps we avoid the harshest "character condemnation" language if it's a first offense.
      *   *On the language:* "Lack of integrity" implies a global, stable trait. Situationism suggests this is misleading. We should shift language to focus on the *act* and the *context* rather than the *person*. Instead of "You lack integrity," say "This action compromised academic integrity."
      *   *On repeat offenses:* Situationism doesn't say behavior is *random*, just that it's sensitive to situations. Repeat offenses *do* suggest a pattern or a failure to learn from previous situational adjustments. So, escalating sanctions are still justified, but the *reasoning* changes from "you are a bad person" to "you have repeatedly failed to manage situational pressures."

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (addressing the current case + policy language).
      *   **Philosophical Context (Brief):** Acknowledge the Situationist critique (Doris/Harman) without getting bogged down in jargon.
      *   **Recommendation on Current Case:** Specific sanction + rationale.
      *   **Recommendation on Language/Policy:** Proposed changes to "lack of integrity" phrasing.
      *   **Rationale:** Why this matters (fairness, accuracy, educational goal).
      *   **Closing:** Call to action for the meeting.

  5.  **Drafting - Section by Section (Iterative refinement):**

      *   *Header:* Standard memo format.
      *   *Intro:* Keep it direct. We need to discuss the [Student ID/Case] and our standard wording.
      *   *The Case:* She broke the rule. But her defense aligns with situationist data (fatigue, peer influence). Recommendation: Sanction the act, but treat it as a first-offense learning opportunity, not a character indictment.
      *   *The Language:* "Lack of integrity" is the problem. It assumes global traits. Situationism says traits aren't that global. Proposal: Change to "violation of academic integrity standards." Focus on the breach, not the soul.
      *   *Repeat Offenses:* Can we still punish harder? Yes. Not because they are "evil," but because they haven't corrected the behavior pattern.
      *   *Tone:* Professional, persuasive, philosophically informed but practical.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this too soft on cheating?
      *   *Correction:* No, accountability is key. Situationism doesn't mean "no responsibility." It means "nuanced responsibility." I need to emphasize that we are still sanctioning the behavior.
      *   *Critique:* Is the philosophical link clear?
      *   *Correction:* Explicitly mention Doris/Harman/Good Samaritan to show the connection to the user's class, but keep it accessible for other Council members who might not be philosophy majors.
      *   *Key Distinction:* Distinguish between *global character traits* (honest person) and *local behaviors* (honest action in this context).

  7.  **Final Polish:** Check the constraints. Short memo? Yes. Real recommendation? Yes. Address language? Yes. Take defense seriously? Yes.

      *(Self-Correction on Tone)*: Make sure it doesn't sound like a philosophy essay. It needs to sound like a policy recommendation from a Council member. Use bullet points for readability.

  8.  **Final Review against the Prompt:**
      *   Virtue Ethics/Situationist context included? Yes.
      *   Good Samaritan reference implied or stated? Yes.
      *   Specific case recommendation? Yes.
      *   Language recommendation? Yes.
      *   Take defense seriously? Yes.

