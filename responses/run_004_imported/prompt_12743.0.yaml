      *   *Skepticism vs. Anti-Luminosity:* Skepticism says "You don't know." Williamson says "You know, but you don't always know *that* you know." The failure is in *reflection*, not in the *state* itself.
      *   *The "Direction" Comment:* The friend likely meant that Williamson isn't using the instability of self-knowledge to undermine first-order knowledge. He's using the stability requirements of first-order knowledge to undermine the possibility of perfect self-knowledge (luminosity).

