answer: |-
  This is a classic collision between two distinct ethical frameworks. You are operating from a **Liberal Harm Principle** (derived largely from John Stuart Mill), while Devon is operating from **Moral Traditionalism** (with a heavy dose of what Leon Kass called "the wisdom of repugnance").

  You asked for something sharper than "ethics is complicated." Here is the rigorous breakdown of where Devon is logically correct, where he is logically weak, and how to adjudicate the weight of disgust and tradition.

  ### 1. The "Proves Too Much" Objection
  Devon's strongest philosophical point is his claim that your standard ("no harm + consent = permissible") proves too much. He is technically correct here.

  If consent and the absence of immediate harm are the *only* metrics, you run into edge cases that most people find morally intuitive to reject.
  *   **Consensual Incest:** If two adult siblings use contraception and no one knows, where is the harm? Most legal and moral systems still forbid this.
  *   **Selling Organs:** If I consent to sell you my kidney for $50k, and the surgery is safe, where is the harm? Yet, most societies ban this.
  *   **Voluntary Slavery:** If I consent to be your slave, is that permissible? Mill himself argued no, because it destroys future autonomy.

  **The Verdict:** Devon is right that your *formula* is incomplete. "Harm + Consent" is a necessary condition for morality in a liberal society, but it may not be a *sufficient* one. There are other values (human dignity, commodification, social structure) that sometimes override pure consent.

  **However,** Devon makes a logical leap. Just because your formula has edge cases doesn't mean *his* conclusion about Mara is correct. He assumes that because the "Harm Principle" isn't perfect, the "Traditional Principle" must be the default. That is a false dichotomy.

  ### 2. Can Disgust Carry Moral Weight?
  Devon admits the arrangement "grosses him out." In philosophy, this is often called the **Yuck Factor**.

  The rigorous answer is: **No. Disgust is not a moral argument.**
  Disgust is a physiological and psychological response, often evolved to protect us from pathogens (rotting meat, feces). When applied to social norms, it is notoriously unreliable.
  *   **Historical Contingency:** Interracial marriage, homosexuality, and left-handedness have all historically triggered genuine, visceral disgust in majority populations. If disgust equals moral wrongness, then those things were morally wrong *then* but morally right *now*. That creates a contradiction.
  *   **The Kass Counter-Argument:** Bioethicist Leon Kass argued that disgust is a "deep wisdom" protecting us from things that violate human dignity. However, even Kass admits disgust must be *interrogated*. It can be a starting point for inquiry ("Why does this bother me?"), but it cannot be the verdict.

  **The Adjudication:** If Devon cannot articulate a harm or a violation of rights *beyond* his own visceral reaction, his argument rests on **moral subjectivism disguised as objectivity.** He is saying, "I don't like this," but framing it as "This is wrong."

  ### 3. Can Tradition Carry Moral Weight?
  Devon argues that the universality of monogamy suggests it serves a function we shouldn't tamper with. This is the **Burkean Argument** (named after Edmund Burke).

  *   **The Strength:** Traditions often encode "latent wisdom." We might not know *why* a norm exists, but it might be holding up a social structure that prevents chaos.
  *   **The Weakness:** Tradition is an argument from authority/history, not truth. The "universal" claim is also empirically shaky. While serial monogamy is common, strict lifelong monogamy is not historically universal (polygyny was standard in many cultures).
  *   **The Burden of Proof:** In a pluralistic society, the burden of proof lies on the person restricting liberty, not the person exercising it. Devon needs to demonstrate *how* Mara's marriage undermines the institution of marriage for others. There is currently no sociological evidence that consensual non-monogamy (CNM) destabilizes monogamous marriages nearby.

  **The Adjudication:** Tradition can act as a **heuristic** (a rule of thumb), but it cannot act as a **veto**. If a tradition restricts liberty, it must justify itself by showing it prevents harm or promotes a specific public good. "We've always done it this way" is insufficient to override individual autonomy in a modern liberal context.

  ### 4. The Real Conflict: Moral Foundations
  Psychologist Jonathan Haidt's **Moral Foundations Theory** explains why you two are talking past each other.
  *   **You (Liberal):** You prioritize **Care/Harm** and **Liberty/Oppression**. If no one is hurt and everyone is free, the moral equation balances.
  *   **Devon (Conservative/Traditionalist):** He prioritizes **Sanctity/Degradation** and **Authority/Subversion**. To him, marriage is a sacred institution with a specific "nature." Violating that nature feels like a desecration, regardless of consent.

  Devon isn't necessarily a "bad guy," but he is treating a ** Sanctity violation** (violating the "sacred" definition of marriage) as if it were a **Harm violation**.

  ### The Sanity Check
  Here is the sharp distinction you were looking for:

  1.  **Devon is right that your standard is simplistic.** "Consent + No Harm" is not a complete moral theory. It fails in edge cases involving human dignity or commodification.
  2.  **Devon is wrong that his standard applies here.** Disgust and Tradition cannot override Liberty *unless* they can point to a tangible harm or a collapse of social function. He has not demonstrated that Mara's marriage harms society or degrades human dignity in a way that warrants intervention.
  3.  **The "Wrongness" Claim:** For an act to be morally *wrong* (rather than just *unpalatable*), it usually requires a victim or a violation of duty. In Mara's case, there is no victim (consent is clear) and no violation of duty (she and her husband set their own vows).

  **Conclusion:**
  Devon is experiencing a **Sanctity Violation**, which feels like moral wrongness to him, but is actually **aesthetic or cultural discomfort.**

  You can concede that your "Harm + Consent" metric isn't a perfect theory of *everything* (to acknowledge his "proves too much" point), while maintaining that in *this specific instance*, his reliance on disgust and tradition fails to meet the burden of proof required to label someone else's consensual life choices as "wrong."

  **The Rigorous Verdict:** Disgust and tradition are **data points**, not **judges**. They tell you something about the observer (Devon) and the culture, but they do not determine the moral status of the act itself. Without evidence of harm or coercion, Devon's position is a preference, not a moral truth.
