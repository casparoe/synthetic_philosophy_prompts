prompt: |-
  Okay I need a sanity check because I've been chewing on this since last night and can't quite let it go. We had people over for game night and it came up that our friend Mara and her husband have an open marriage — fully consensual, both of them into it, nobody's being lied to or cheated on. After she left, my friend Devon got kind of heated about it, saying it's still wrong even though nobody's getting hurt, because marriage just isn't "supposed" to work that way, and if he's honest it kind of grosses him out. I said if nobody's harmed and both of them are genuinely happier this way, I don't see what's left to be wrong about. Devon said that's a cop-out — that if "nobody's hurt and everyone's into it" is my whole standard, then I can never actually call anything wrong, and that the fact that pretty much every culture throughout history has looked down on this kind of thing has to count for somthing, otherwise why would the reaction be so universal.

  I don't think Devon's a prude or a bad guy for feeling that way, but "it squicks me out" and "it's morally wrong" still feel like two different claims to me, even though I couldn't cleanly separate them for him in the moment, so we just ended up agreeing to disagree, which is bugging me more than it should. Is Devon actually onto something when he says my standard proves too much, or is his gut reaction to Mara's marriage just doing a lot of unexamined work thats getting dressed up as a moral argument? I'd love something sharper than "ethics is complicated" here — is there an actual, rigorous way to adjudicate whether disgust or tradition can carry moral weight on its own, separate from whether an act actually harms anyone?
