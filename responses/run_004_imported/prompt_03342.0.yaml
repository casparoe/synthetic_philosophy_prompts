      *   Section 2: Identified vs. Statistical Lives. This is the practical wedge.
      *   Section 3: Ex Ante vs. Ex Post (Expected Value). This is the mathematical wedge.
      *   Section 4: The "Paralysis" Admission. Yes, Taurek breaks EA. That's why EA rejects Taurek.
      *   Section 5: Philosophical Engagements (Parfit, Scanlon, Kamm). Show it's not ignored in philosophy.
      *   Conclusion: It's a feature, not a bug. EA is committed to aggregation.

  8.  **Final Polish:** Ensure tone is respectful, intellectually rigorous, and directly answers the "why isn't this a threat" question. (Make sure to emphasize that for EA, Taurek isn't a "puzzle to solve" but a "rival framework to reject".)

  *(Self-Correction during drafting)*: I should be careful not to dismiss Taurek too easily. His argument is strong. I need to explain that the "refutation" is often just asserting the utilitarian axiom. But there are stronger arguments (Parfit's "Absurdity of Negligibility"). I must include Parfit.

  *(Final check on constraints)*: "Engage with whether, and why, that inference goes through." Okay, I need to explicitly state: The inference *does* go through logically, which is why EA must reject Taurek's premises *ab initio*. It's not that the inference is blocked; it's that the starting point is different.

  Wait, is there a way the inference is blocked? Yes, the *context* blocks it. Rescue cases (non-actuarial) vs. Policy cases (actuarial). In policy, no specific individual is being "sacrificed" in the same way. I need to highlight the **non-identity problem** aspect or the **risk distribution** aspect. In EA, you aren't choosing between David and the Five. You are choosing between Program A (helps Group X) and Program B (helps Group Y). The individuals are often not yet determined. This weakens Taurek's "loss to someone" claim because the "someone" is probabilistic.

