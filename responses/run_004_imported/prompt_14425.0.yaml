answer: |-
  Good evening, everyone. For those of you who don't know me, I'm Priya's uncle. I'm also the family's designated "philosopher." Usually, that means I get cornered at holidays to explain why Kant matters, which, let's be honest, is a great way to clear a room. So when Priya asked me to give this toast, I was honored. But then she gave me some instructions.

  She said, "Please, no talk of 'two souls becoming one.' Dev and I have spent ten years practicing Vipassana. We know there aren't two souls. There aren't even two solids."

  And she's right. In my line of work, we worry about these things. If you take the idea of impermanence seriously—that we are not static statues, but flowing rivers of thoughts, sensations, and changes—it raises a tricky question about marriage. Specifically, about the vows.

  If "til death do us part" implies that the "us" is fixed and eternal, well, that contradicts everything they've practiced. And if there is no fixed self, what exactly is being promised? As the philosopher Derek Parfit once asked: If I change enough over thirty years, am I still the same person who made the promise? Why should the "future me" be bound by the "past me"?

  It's a serious question. But I think the answer is actually the most beautiful part of what Priya and Dev are doing today.

  In the traditional view, a vow is a chain linking two static identities. But in the view Priya and Dev are bringing to this marriage, a vow isn't a chain. It's a compass.

  You aren't promising to remain the same people. You *won't*. The Priya standing here today will not be the Priya in thirty years. The Dev listening to this will change, countless times. Life will bring joy, grief, illness, aging. The aggregates will shift.

  But here is the commitment: You are promising to orient your changing selves toward each other. You are promising that as the river flows, it will flow in the same direction.

  For the Catholics in the family, like my sister Carol, this sounds like love as a verb. For the Dharma friends in the room, this is *cetana*—intention. It is the conscious choice, made again and again in the present moment, to prioritize the well-being of the other.

  So, what binds you in thirty years? It isn't a contract signed by ghosts of your past selves. It is the continuity of your care. You are promising to recognize each other, even as you change. You are promising to meet the stranger you each become with the same kindness you offer the person standing here today.

  Priya and Dev, you met in silence. You know that words are just vibrations. But you also know that intention has weight. You are not building a monument to be preserved. You are tending a garden that will constantly grow, die back, and bloom anew.

  So, I won't ask you to be one. I won't ask you to be permanent. I will ask you to be present.

  If everyone could please raise a glass.

  To Priya and Dev. May your practice be steady. May your compassion be wider than your confusion. And may you find, in the endless change of life, a refuge in each other.

  To the bride and groom.
