answer: |-
  This is a sophisticated reading of the Keynes corpus, and it cuts against the grain of the standard interpretation (which usually dismisses *Economic Possibilities* as a mere arithmetic error regarding compound interest). You are right to identify a philosophical fault line between the 1930 and 1938 texts.

  To build this case for your dissertation, you need to demonstrate that the 1938 critique of Mooreanism isn't just a change of heart about ethics, but a structural correction to the anthropology underpinning the 1930 growth forecast. The argument rests on the shift from viewing human motivation as **rationally contingent on scarcity** (1930) to viewing it as **structurally dependent on convention** (1938).

  Here is a structured argument you can adapt for your chapter, building the case that the 1938 Keynes retrospectively invalidates the 1930 Keynes on internal philosophical grounds.

  ---

  ### Thesis Statement
  While *Economic Possibilities for our Grandchildren* (1930) treats "purposiveness" (accumulation) as a temporary psychological distortion necessitated by scarcity, *My Early Beliefs* (1938) argues that civilization relies on non-rational habits and conventions that cannot be simply discarded once their original utility expires. Therefore, the 1938 Keynes provides the philosophical premises to conclude that the 1930 prediction was not merely an arithmetic overestimate, but a **category error regarding human psychology**: we cannot rationally "switch off" the purposive instinct because it is embedded in the conventional fabric of society, not just the material conditions of scarcity.

  ### 1. The 1930 Premise: Purposiveness as a Temporary Neurosis
  In *Economic Possibilities*, Keynes constructs a dualistic anthropology. He distinguishes between:
  *   **The Instrumental:** The "love of money," which he calls a "somewhat disgusting propensity," a "semi-criminal, semi-pathological habit."
  *   **The Intrinsic:** The "art of life," loving things for themselves (beauty, relationships), which aligns with G.E. Moore's *Principia Ethica*.

  **The 1930 Logic:**
  Keynes argues that the "instrumental" is only necessary so long as we are in the "tunnel" of scarcity. He assumes a **rationalist model of motivation**: humans are naturally Moorean (seeking intrinsic goods), but are *forced* by material necessity into being Purposive (seeking instrumental goods).
  *   *The Prediction:* Once compound interest solves scarcity (the means are secured), the *reason* for the neurosis vanishes. Therefore, the neurosis itself will vanish. We will return to our natural state.
  *   *The Assumption:* Human ends are stable and rational; only the means change. Once the means are abundant, the "purposive man" can simply retire.

  ### 2. The 1938 Correction: The Indispensability of Convention
  In *My Early Beliefs*, the older Keynes reflects on the Apostles' adoption of Moore. He admits they were wrong to believe that rational calculation of "states of mind" was sufficient for ethics or social cohesion.
  *   **The Critique:** Mooreanism was "thin" because it ignored the "useful." It assumed individuals could calculate the "good" in a vacuum.
  *   **The Correction:** Keynes argues that civilization is held together not by rational pursuit of the good, but by **"habit," "instinct," and "convention."** These are often non-rational and sometimes divorced from intrinsic goodness, but they provide the stability required for life to continue.
  *   **Key Passage:** He notes that without these "vain" conventions, society would fall into chaos. We need "automatic" behaviors that we don't constantly subject to ethical scrutiny.

  ### 3. The Collision: Why 1938 Undermines 1930
  Here is where you build the tension. The 1930 essay relies on the idea that "purposiveness" is a *choice* driven by *need*. The 1938 essay argues that social behavior is driven by *habit* and *convention*, which are resistant to rational revision.

  **A. Purposiveness as Convention, Not Just Necessity**
  In 1930, Keynes treats accumulation as a response to scarcity. In 1938 (and the *General Theory* of 1936), he recognizes that economic behavior is driven by "conventions" (e.g., assuming the future will be like the past, valuing liquidity, seeking status through wealth).
  *   *The Argument:* If "purposiveness" is a social convention (a way we coordinate and find meaning) rather than just a biological reaction to hunger, it does not disappear when hunger disappears.
  *   *The 1938 Insight:* We are not free to discard conventions just because they are no longer "useful" in the narrow material sense. They are the "cake of custom" that keeps us sane. To expect humanity to drop the habit of accumulation because it is no longer economically necessary is to expect humanity to drop the very conventions that 1938 Keynes says protect us from chaos.

  **B. The Rejection of Rational Re-optimization**
  The 1930 essay assumes that once rich, humans will *rationally calculate* that they no longer need to hoard, and thus will stop.
  *   *The 1938 Counter:* Humans do not act on rational calculations of "states of mind." We act on instincts and habits. The "love of money" is not just a calculation; it is a "habit" (as he calls it in 1930) but 1938 teaches us that habits are sticky.
  *   *The Tension:* 1930 Keynes believes we can step out of the "economic tunnel" and leave the tunnel-dwelling psychology behind. 1938 Keynes suggests we *are* the tunnel-dwelling psychology. The "purposive man" is not a mask we wear until rich; he is the creature formed by the conventions of civilization.

  **C. The "Useful" vs. The "Good"**
  In 1930, Keynes hopes to move from the "Useful" (money) to the "Good" (Moorean ends).
  In 1938, he admits that the "Useful" (conventions, duties, habits) is often the *precondition* for the "Good." You cannot have the "art of life" without the "vain" conventions that sustain the society allowing for art.
  *   *The Implication:* If acquisitiveness is part of the "useful" convention that keeps the engine running (even post-scarcity), then 1930 Keynes was wrong to think we could segregate it. We might *need* the "disgusting propensity" permanently to maintain the social order that allows for the "art of life."

  ### 4. Synthesis: The "Wishful Thinking" Charge
  You can now argue that the 1930 prediction fails on **anthropological grounds**, not just mathematical ones.

  1.  **1930 View:** Scarcity $\rightarrow$ Purposiveness. Remove Scarcity $\rightarrow$ Remove Purposiveness. (Linear, Mechanical).
  2.  **1938 View:** Civilization $\rightarrow$ Convention/Habit $\rightarrow$ Stability. Purposiveness is a Convention. Conventions are resistant to rational change. (Complex, Organic).

  **The Conclusion for your Chapter:**
  The 1938 Keynes gives us the tools to diagnose the 1930 error. The error was not assuming 5% compound interest was possible; the error was assuming that **human ends are independent of the means used to achieve them.**
  By 1938, Keynes realizes that the "means" (the habits of accumulation, the conventions of the market) shape the "ends." If you spend 100 years training humanity to be "purposive" to solve scarcity, you cannot expect them to suddenly become "contemplative" just because the scarcity is gone. The habit *becomes* the nature.

  Therefore, the 1930 vision of a post-scarcity utopia is "wishful thinking" precisely because it relies on the early Moorean belief that rational recognition of the "Good" can override the non-rational habits that actually govern human life—a belief the 1938 Keynes explicitly disowns.

  ### 5. Dissertation Framing Suggestion
  For your chapter on "Histories of Growth-Optimism," this tension allows you to categorize Keynes not just as a growth optimist, but as a **tragic growth optimist**.
  *   He hopes for the end of scarcity (Optimism).
  *   But his own later philosophy suggests the *process* of growth alters human nature in ways that make the "end of growth" psychologically impossible (Tragedy).
  *   This positions Keynes as a precursor to later critiques of consumer society (like Galbraith or Hirsch), but rooted in a specific Cambridge philosophical failure: the realization that Moore's "states of mind" cannot be decoupled from the "conventions" required to sustain them.

  This approach moves your analysis beyond "Keynes got the math wrong" to "Keynes got the *human* wrong, and later admitted the philosophical framework that made that error possible was flawed."
