prompt: |-
  Ok so I've been down a Keynes rabbit hole for a dissertation chapter on histories of growth-optimism, specifically the "purposive man" bit in "Economic Possibilities for our Grandchildren" -- the hoarding, accumulating type Keynes half-admits is basically a psychological case by his own (broadly Moorean) lights, but who we supposedly need for another hundred years to drag us out of scarcity, after which we get to go back to loving beauty and each other for their own sake. Separately I've been reading "My Early Beliefs," where older Keynes disowns the G.E. Moore-worship of his Apostles days as dangerously thin, precisely because it left no room for the "useful," non-rational, convention-bound stuff that actually keeps civilization from falling apart -- and it strikes me that plain acquisitiveness/purposiveness is a pretty natural member of that same category. Can you argue that these two essays are in genuine tension -- i.e., that the chastened 1938 Keynes gives us, on his *own* later premises, good reason to think the 1930 prediction (that abundance finally lets us drop avarice and get back to Moore's true ends) is wishful thinking, and not just naive about compound interest? Actually build the case rather then just asserting the vibes line up.
