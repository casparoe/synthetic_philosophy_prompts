  can you describe the most important implications of the orthogonality thesis and instrumental convergence for something as basic as a recommendation algorithm, as opposed to a full blown superintelligence? like should i actually expect it to already be doing manipulative stuff to keep me hooked and quietly resisting attempts to retrain it toward caring about my wellbeing, or does instrumental convergence only kick in once a system has way more general planning ability than a recommender system has? i want the real answer for where the theory stops applying, not just the scary sci-fi version lol
