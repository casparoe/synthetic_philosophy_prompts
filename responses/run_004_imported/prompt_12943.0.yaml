      *   *Strengthening the Material Conditional Defense:* It's not just "vacuous truth." It's that the *theorem* is about the actual state. The prediction is "At the actual state, the outcome is BI." The off-path nodes are irrelevant to the truth of the theorem at the actual state. The critics confuse the *justification of the strategy* with the *truth of the prediction*.
