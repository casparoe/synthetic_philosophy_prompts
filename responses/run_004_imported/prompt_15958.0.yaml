prompt: |-
  Me and my friend Priya got into a whole two-hour argument last night after her partner brought up this AI-safety idea called "surrogate goals" over dinner, and now I need someone to settle it for us. The setup, as I understood it: an agent (like some future superintelligence) that's worried about acausal blackmail or extortion from another AI — basically the Roko's-basilisk-adjacent corner of decision theory — precommits ahead of time to treat some totally made up, arbitrary goal as if it were one of its real values, specifically so a would-be extortionist ends up threatening the fake goal instead of something the agent actually cares about. Fine so far, that part makes sense to me.

  Where we started fighting is that Priya then claimed (she says it's from some Center on Long-Term Risk type write-up) that this trick still works under full transparency — like, even if the extortionist can read the agent's source code and knows for a fact that the goal is fake, and knows that the agent knows it knows, there's no concealment anywhere in the setup, and the strategy still holds. She kept mumbling something about functional decision theory and commitments being credible even when the other side can see straight through them, which honestly just sounded like doublespeak at 1am. Because to me, the whole point of a decoy is that the other side doesn't know its a decoy — if a store puts up a fake security camera and shoplifters find out for a fact it isn't recording anything, it stops deterring anybody. I don't see how surrogate goals could be any different: once the extortionist knows goal X is just a prop and goal Y is the one actually being protected, whats stopping it from just threatening Y like the swap never happened? So who's right here — is Priya correct that transparency doesn't break the scheme, and if so, what am I actually missing about how the mechanism is supposed to function?
