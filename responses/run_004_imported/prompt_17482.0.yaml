              1.  Tension between "All Art is propaganda" vs. appeal to "Beauty" as an independent standard.
              2.  Response to Hughes/younger generation objection (trading white condescension for Black respectability politics/censorship, e.g., *Home to Harlem*).
              3.  Scope of the thesis (General theory of art vs. specific political emergency under Jim Crow).
          *   Each question must have a follow-up keyed to the *likely* answer.
      *   **Tone:** Academic, engaged, critical but respectful.

  2.  **Deconstruct the Core Text & Debate:**
      *   **Text:** Du Bois's "Criteria of Negro Art" (1926).
      *   **Key Quote:** "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
      *   **Key Tension:** Du Bois also says art must possess "Beauty," "Truth," and "Goodness." How does propaganda (persuasion/advocacy) fit with Beauty (often seen as autonomous)?
      *   **The Critics:** Langston Hughes ("The Negro Artist and the Racial Mountain"), Wallace Thurman, Claude McKay. They argued for artistic freedom, depicting Black life "as is" (including the gritty/low-life), not just as racial uplift.
      *   **The Scholar's Project:** Defending Du Bois against these critics. This is a revisionist take, as the standard narrative often sides with Hughes on artistic freedom.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Propaganda vs. Beauty.*
          *   *Draft:* How do you fit Beauty and Propaganda together?
          *   *Refinement:* Needs to be more specific about the tension. Du Bois says art *must* be propaganda, but also implies Beauty is a criterion. Is Beauty instrumentalized?
          *   *Follow-up:* If she says Beauty is instrumental, does that reduce aesthetics to ethics?

      *   *Requirement 2: Respectability Politics/Hughes Objection.*
          *   *Draft:* Hughes said you can't just write about nice Black people. What about *Home to Harlem*?
          *   *Refinement:* Frame it as the charge of "respectability politics." Du Bois criticized McKay for focusing on the underworld. Does your defense inadvertently validate censoring Black complexity?
          *   *Follow-up:* If she says Du Bois isn't censoring but curating, what defines the limit of acceptable representation?

      *   *Requirement 3: Scope (General vs. Specific).*
          *   *Draft:* Is this for all art or just Black art in the 1920s?
          *   *Refinement:* "All Art is propaganda" sounds universal. But the context is Jim Crow. If it's universal, does it deny aesthetic autonomy for *everyone*? If specific, is it still valid today?
          *   *Follow-up:* If specific, does the thesis expire when the emergency ends?

      *   *Requirement 4: Additional Questions (Need 5-6 more to reach 8-9 total).*
          *   *Idea 4: The definition of Propaganda.* Du Bois reclaims a pejorative term. How does her definition compare to modern usage?
          *   *Idea 5: The Audience.* Who is the propaganda *for*? White skeptics or Black community building? This changes the aesthetic strategy.
          *   *Idea 6: Truth vs. Goodness.* Du Bois lists Truth, Goodness, Beauty. How does "Truth" function if the goal is political advocacy? Can uncomfortable truths serve propaganda?
          *   *Idea 7: Comparative Aesthetics.* How does Du Bois compare to Alain Locke? Locke was more about cultural value than direct propaganda.
          *   *Idea 8: Contemporary Relevance.* How does this apply to Black Lives Matter art or current cinema?
          *   *Idea 9: The "Ever Must Be" claim.* Why the permanence? Is there a utopian horizon where art *stops* being propaganda?

  4.  **Refining and Polishing (Checking against constraints):**
      *   Ensure the tone is seminar-appropriate (sophisticated, referencing specific texts/figures).
      *   Ensure follow-ups are logical predictions of the scholar's defense.
      *   Check count: Need 8 or 9. I have 9 ideas above. I will select the strongest 9.

      *   *Self-Correction on Follow-ups:* The prompt asks for the follow-up to be "keyed to the answer she's most likely to give." Since she is *defending* Du Bois, her answers will likely try to reconcile tensions, nuance the "propaganda" definition, or contextualize historically. The follow-ups should press on the implications of those likely defenses.

  5.  **Final Review of the Questions:**
      1.  Beauty/Propaganda tension (Required).
      2.  Hughes/Respectability (Required).
      3.  Scope/Universality (Required).
      4.  Definition of Propaganda (Reclamation vs. Manipulation).
      5.  The Audience (White gaze vs. Internal community).
      6.  Truth vs. Advocacy (The risk of distortion).
      7.  Locke vs. Du Bois (New Negro vs. Propaganda).
      8.  The "Ever Must Be" (Utopian horizon).
      9.  Contemporary Application (Post-Civil Rights context).

      *Wait, let's make sure the follow-ups are sharp.*
