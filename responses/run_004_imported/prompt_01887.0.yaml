answer: |-
  This is a fantastic historical and theological puzzle. You have correctly identified the core tension in Newton's theological project: he applied the same empirical, evidentiary rigor to scripture that he applied to optics and gravity, expecting that **truth, once uncovered, would be self-evident and irresistible.**

  If Newton were transported to 2024, handed a Nestle-Aland critical Greek text, and shown that the *Johannine Comma* (1 John 5:7) is universally regarded by scholars as a later Latin interpolation, his reaction would be a complex mix of **smug vindication** and **prophetic confirmation.**

  He would not view the survival of Trinitarianism as a failure of his method. Rather, he would view it as confirmation of his specific theory of the **Great Apostasy.**

  Here is how I reconstruct Newton's reasoning, based on his letters to Locke, his *Two Notable Corruptions of Scripture*, and his broader millenarian writings.

  ### 1. The Textual Vindication: "I Told You So"
  Newton would be immensely satisfied that modern philology agreed with him. Newton hated the "mystical" interpretation of scripture that allowed priests to override the plain text. He believed that if you treated the Bible like any other historical document—collating manuscripts, checking languages, tracing transmission history—the "corruptions" would reveal themselves.

  *   **On Erasmus:** Newton argued that Erasmus was coerced into adding the Comma to his Greek New Testament (1522) after a Franciscan monastery "produced" a Greek manuscript that conveniently contained it (Codex Montfortianus). Newton knew this was a forgery. Modern scholarship agrees: that manuscript was likely created *to satisfy Erasmus.*
  *   **On the Evidence:** Newton would point to the fact that the Comma is absent from all early Greek manuscripts, all early Oriental versions, and is not cited by any Greek Church Father during the Trinitarian controversies (when it would have been the nuclear option).

  To Newton, the removal of the Comma from modern Bibles is proof that **his scientific method works on history.** It validates his claim that truth is recoverable through evidence.

  ### 2. The Doctrinal Resilience: The "Man of Sin"
  However, you note the kicker: Trinitarianism didn't die. Churches just shifted their weight to other proof texts (John 1:1, John 10:30) and the Creeds.

  A modern skeptic might say, "See? Doctrine isn't about evidence; it's about tradition." Newton would say something more specific: **"The Corruption is Institutional, not just Textual."**

  Newton was an Arian (or more accurately, a Subordinationist). He believed Christ was divine but created by and subordinate to the Father. He believed the doctrine of the Co-Equal Trinity was a later invention, solidified at the Council of Nicaea (325 AD) through political maneuvering, not apostolic teaching.

  *   **The Root vs. The Branch:** Newton did not believe the Comma was the *source* of Trinitarianism; he believed it was a *later patch* applied to support a doctrine that was already corrupt. Removing the Comma removes a crutch, but the patient (the Church) is still sick.
  *   **The Interest of the Clergy:** Newton had a profound distrust of clerical power. He believed that once the Church became a political entity (post-Constantine), the clergy had a vested interest in maintaining "mysteries" that only they could interpret. If doctrine became simple and rational (as Newton thought Arianism was), the priesthood's power would diminish.
  *   **The Verdict:** Newton would argue that modern churches retaining Trinitarianism despite dropping the Comma proves that **Creeds have superseded Scripture.** He would say the Church is still in bondage to the "Athanasian Idolatry," and that they are interpreting the remaining verses through a Trinitarian lens imposed by Nicaea, rather than letting the text speak for itself.

  ### 3. The "Two Notable Corruptions"
  It is crucial to remember that the Comma was just one battle for Newton. He wrote *Two Notable Corruptions of Scripture* (1690) specifically to dismantle the other pillars of Trinitarian proof-texting (specifically 1 John 5:7 and 1 Timothy 3:16).

  If you showed him that modern translations footnote 1 Timothy 3:16 ("God was manifest in the flesh" changed to "He who was manifest..."), he would nod grimly. He would argue that the Church is slowly being stripped of its fraudulent props, but it refuses to walk without them.

  He would likely argue that the survival of Trinitarianism is due to **intellectual inertia** and **spiritual blindness**, which he viewed as prophesied conditions of the "Last Days."

  ### 4. The Millenarian Perspective: The Long Game
  This is the piece most people miss. Newton wasn't expecting a quick reformation. He was a millenarian. He believed history was moving toward a specific prophetic climax.

  *   **The Apocalypse:** Newton spent more time calculating the date of the Apocalypse than writing physics. He believed the "Great Apostasy" (the corrupt Catholic/Trinitarian church system) would dominate for 1,260 years (based on Daniel and Revelation).
  *   **The Restoration:** He believed that before the end, true knowledge would increase (Daniel 12:4). The recovery of the true text was a *sign* of the end times.

  **Newton's Reaction:** He would not be discouraged that 300 years later the doctrine persists. He would view the *exposure* of the Comma as a prophetic event. The fact that the lie has been uncovered is the victory; the fact that the world hasn't fully accepted it yet is just the "birth pangs" of the restoration.

  He would likely say: *"The Idolatry is exposed. The text is cleansed. Now the world must choose between the Tradition of Men and the Word of God. That they choose Tradition confirms the prophecy of the Hardened Heart."*

  ### 5. Conclusion: Method Vindicated, Premise Nuanced
  To answer your specific dichotomy:

  **Does he take it as proof his method was right?**
  **Yes.** The textual criticism vindicates his empirical approach to scripture. He was right about the documents.

  **Does the result undercut his premise that doctrine tracks textual evidence?**
  **No, but it refines it.** Newton assumed that *honest* men following *honest* evidence would arrive at the truth. The fact that Trinitarianism survived the loss of its best proof text tells Newton that the barrier isn't a lack of evidence—it's a **willful rejection of evidence** by a corrupt institution.

  He would conclude that the corruption runs deeper than he perhaps hoped, embedded in the Creeds and the psychology of the Church itself, but he would remain confident that the textual victory is the first domino. In his view, you cannot build a true theology on a false text, and now that the false text is gone, the false theology is vulnerable. It just hasn't collapsed *yet*.

  **In short:** Newton would look at the modern NIV or ESV, see the brackets around the Comma, smile grimly, and say, **"The first step is taken. Now wait for the rest of the Apostasy to fall."** He would view the modern Church not as reformed, but as a Trinitarian fortress that has lost its outer wall but refuses to surrender the keep.
