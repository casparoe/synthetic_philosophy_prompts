  *Decision:* I will recommend **Approval Voting** because for 14 people, *understandability* is a governance feature. If people don't understand how the winner was picked, trust erodes. Approval is transparent. Schulze is a black box to most. I will justify this trade-off.

  *Wait, one more check:* The prompt asks to "call out the Schulze guy's inconsistency if it really is one."
