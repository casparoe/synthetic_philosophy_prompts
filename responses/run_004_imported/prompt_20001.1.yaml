answer: |-
  **To:** All Co-op Members
  **From:** Governance Committee
  **Date:** October 26, 2023
  **Subject:** Proposal to Update Our Voting System (Action Required)

  Hi Team,

  As many of you know, after last quarter's steering election, we heard significant feedback that our current voting method (plurality/"first-past-the-post") didn't reflect the group's will. Specifically, we elected a candidate who many of you indicated you would have preferred *less* than other available options head-to-head. This is a classic "spoiler effect," and it undermines the trust we need in our governance.

  The Governance Committee has spent the last month researching alternatives. We've heard three main positions in our discussions: keep the current system for simplicity, switch to a ranked method like Schulze, or switch to Approval Voting. There has also been some debate involving economic theory that we want to clarify before we vote.

  This memo summarizes what we found, clears up the confusion around "Arrow's Theorem," and offers a concrete recommendation for the vote at our all-hands in two weeks.

  ### 1. The "Arrow's Theorem" Question
  One of our members has rightly pointed out **Arrow's Impossibility Theorem**. This is a real mathematical result, but it is often misunderstood in practical discussions.

  *   **What it says:** If voters *rank* candidates (1st, 2nd, 3rd), no system can satisfy a specific list of fairness criteria perfectly all the time.
  *   **What it implies:** There is no *perfect* ranked voting system.
  *   **What it does NOT imply:** It does not mean all systems are equally bad, nor does it mean we shouldn't switch. It simply means every ranked system involves trade-offs.

  **The Contradiction:** We've heard Arrow's Theorem cited to argue that "switching is pointless," while simultaneously advocating for the **Schulze method** (a ranked system). These positions are in tension. If Arrow's Theorem makes ranked voting pointless, it makes Schulze pointless too. The more useful takeaway is: *"No ranked system is perfect, but some are much better than plurality at avoiding spoilers."* Schulze is mathematically robust at finding a consensus winner, even if it isn't mathematically "perfect."

  **The Approval Exception:** Another member noted that **Approval Voting** is not subject to Arrow's Theorem. She is correct. Arrow's Theorem applies to *ordinal* systems (ranking A over B). Approval is a *cardinal* system (rating A as "acceptable" or "not"). It sidesteps the theorem entirely, though it introduces different trade-offs (mostly around whether voters approve just one candidate or many).

  ### 2. The Options on the Table

  Here is the breakdown of the three systems we are considering, sized for a 14-person organization.

  #### Option A: Plurality (Current System)
  *   **How it works:** Vote for one candidate. Most votes wins.
  *   **The Best Argument For It:** It is brutally simple. Everyone understands it instantly. Counting is transparent and requires no software. In a high-trust group of 14, some argue the mathematical edge cases rarely matter enough to justify added complexity.
  *   **The Risk:** As we saw last quarter, it encourages tactical voting. If two similar candidates run, they split the vote, and a polarizing candidate can win with a minority of support. It forces you to vote against who you dislike, rather than for who you like.

  #### Option B: Schulze Method (Ranked)
  *   **How it works:** You rank candidates (1st, 2nd, 3rd). The system calculates "beatpaths" to find the candidate who wins the most head-to-head matchups.
  *   **The Best Argument For It:** It is the most mathematically rigorous way to solve the specific problem we just had (the Condorcet/Spoiler problem). It ensures the winner is the person most acceptable to the broadest coalition.
  *   **The Risk:** It is a "black box" to most people. Explaining *why* someone won requires a whiteboard and 20 minutes. If members don't understand the count, they may not trust the result. For a 14-person co-op, this level of algorithmic complexity may be over-engineering.

  #### Option C: Approval Voting (Recommended)
  *   **How it works:** You vote "Yes" or "No" for *every* candidate. You can vote for as many as you like. The candidate with the most "Yes" votes wins.
  *   **The Best Argument For It:** It solves the spoiler problem without the complexity of Schulze. You can vote for your ideal candidate *and* the compromise candidate you'd be okay with. It encourages consensus-building rather than factionalism. It is easy to count by hand on a whiteboard.
  *   **The Risk:** It can sometimes result in ties, or voters might "bullet vote" (only vote for one) if they get strategic. However, in a small co-op culture, we generally prefer honest voting over strategic gaming.

  ### 3. Our Recommendation: Approval Voting

  The Governance Committee recommends adopting **Approval Voting** for steering elections and project selection.

  **Why this fits us:**
  1.  **Solves the Spoiler Problem:** It allows you to support your favorite candidate without worrying about "wasting" your vote, which directly addresses last quarter's issue.
  2.  **Transparency:** Unlike Schulze, every member can verify the count in their head. In a worker co-op, governance should be legible to everyone, not just the person with an economics minor.
  3.  **Culture:** Approval voting rewards candidates who are broadly acceptable to the team, rather than those with a intense minority following. This aligns with our values of collaboration.
  4.  **Low Friction:** We can implement this immediately. No new software is required; we just change the ballot instructions.

  ### 4. Next Steps

  We will hold a binding vote on this change at the all-hands meeting on [Date].

  *   **If the motion passes:** We will use Approval Voting for the next steering election and for any client project go/no-go decisions where we have multiple options.
  *   **If the motion fails:** We will retain Plurality voting for the next cycle, with a review scheduled for six months.

  We believe this is a pragmatic upgrade that respects our size and culture while fixing the demonstrated flaws in our current process. Please come prepared to discuss.

  Thanks,

  The Governance Committee

  ***

  ### Appendix: FAQ for the Skeptical

  **"Isn't Approval Voting just as flawed as the rest?"**
  Yes. No system is perfect (see Arrow). But Approval is *less* flawed than Plurality for our specific use case. It removes the pressure to vote tactically against your interests.

  **"Why not Schulze if it's more mathematically sound?"**
  Mathematical soundness is valuable, but *legibility* is a governance feature. If three people have to explain the math to the other eleven for the result to be accepted, the system is too complex for a 14-person team.

  **"Does Arrow's Theorem mean we're doomed?"**
  No. It means we should stop looking for a perfect system and start looking for the *least bad* one for our specific context. For a small, high-trust group, Approval is that system.
