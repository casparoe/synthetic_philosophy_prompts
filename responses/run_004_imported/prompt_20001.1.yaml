      *   **Problem:** Last election resulted in a "spoiler" effect (Condorcet loser likely won).
      *   **Conflict:**
          *   Person A (Econ minor): Cites Arrow's Impossibility Theorem to say "all systems are flawed/arbitrary" (nihilism) BUT pushes for Schulze method (contradiction?).
          *   Person B: Pushes Approval Voting, claiming Arrow doesn't apply (true, but is it the best solution?).
          *   User: Needs clarity, wants to cut through jargon, needs a concrete recommendation suitable for a 14-person tech co-op.
      *   **Deadline:** Meeting in two weeks.
      *   **Requirements:** Explain Arrow's Theorem accurately, address the Schulze guy's inconsistency, evaluate Approval Voting, include a strong argument for keeping Plurality (steelman), and make a specific recommendation.

  2.  **Deconstruct the Technical/Mathematical Claims:**
      *   **Arrow's Impossibility Theorem:**
          *   *What it says:* No ranked voting system can satisfy a specific set of fairness criteria (Unrestricted Domain, Non-dictatorship, Pareto Efficiency, Independence of Irrelevant Alternatives) simultaneously when there are 3+ candidates.
          *   *What it doesn't say:* It doesn't mean all systems are equally bad. It doesn't mean we shouldn't vote. It doesn't apply to cardinal systems (like Approval or Score).
          *   *The "Schulze Guy's" Contradiction:* If he uses Arrow to say "ranked voting is pointless," he shouldn't advocate for Schulze (which is a ranked method). He likely means "No perfect system exists, but Schulze is the *best* among ranked options." This needs to be clarified gently.
      *   **Schulze Method:**
          *   A Condorcet method (tries to find the candidate who beats everyone else head-to-head).
          *   Complex to count by hand, easy with software.
          *   Good for avoiding spoilers.
      *   **Approval Voting:**
          *   Voters mark "yes" or "no" for each candidate.
          *   Arrow's theorem technically doesn't apply (it's cardinal/ratings-based, not ordinal ranking).
          *   Simple to understand, hard to mess up.
          *   Can lead to "bullet voting" (voting for only one) if strategy kicks in.
      *   **Plurality (Current):**
          *   Simple.
          *   Prone to spoilers (vote splitting).
          *   Encourages tactical voting (vote for the "lesser evil" rather than favorite).

  3.  **Determine the Best Recommendation for a 14-Person Co-op:**
      *   *Scale:* 14 people is tiny. Complexity is a bigger risk than mathematical edge cases.
      *   *Culture:* Worker co-op implies high trust, desire for consensus, low tolerance for opaque bureaucracy.
      *   *Frequency:* Quarterly steering + ad-hoc project decisions.
      *   *Comparison:*
