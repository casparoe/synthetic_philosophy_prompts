prompt: |-
  I'm on the "governance committee" (three of us, a very grandiose title for a fourteen-person company) at the worker-owned software co-op I work at, and we got tasked with fixing how we vote on internal stuff -- mainly electing the 3-person steering rotation every quarter, but also things like which client projects we take on when we've got more inbound than capacity. Right now it's plain plurality, most first-place votes wins, and last quarter's winner turned out to be someone that a bunch of people apparently liked less than at least one other candidate head-to-head -- it came out in hallway conversations afterward that we basically elected a spoiler. So there's momentum to switch to ranked-choice for the next cycle.

  Except it's stalled, because one of our devs did an economics minor and now brings up Arrow's impossibility theorem every single meeting to argue that switching is pointless -- something like, you can't have independence of irrelevant alternatives and non-dictatorship both hold once you've got 3+ candidates, so its all equally arbitrary and we might as well keep plurality. But confusingly he's ALSO the person pushing hardest for some other ranked method he calls "Schulze," which he swears is more mathematically sound than ranked-choice -- which feels contradictory to me but I can't articulate why. Meanwhile another coworker wants approval voting instead, and her whole pitch is that it "isn't ordinal, so Arrow's theorem doesn't even apply to it," like that alone settles things in her method's favor.

  I don't have any background in this stuff (I write backend Java, not political theory) so I can't tell who's actually right here or whether people are just talking past each other with borrowed vocabulary. We vote on whether to adopt something new at our meeting in two weeks, so could you write the memo I'll send the other 13 people beforehand? I need it to actually explain what Arrow's theorem does and doesn't establish instead of letting it get cited as a mic-drop, call out the Schulze guy's inconsistency if it really is one, weigh the "approval voting is exempt" claim on its actual merits rather than just accepting it, and land on one concrete recommendation sized to a group our age and scale -- including a fair, honest version of the best argument for just keeping plurality, not a strawman of it.
