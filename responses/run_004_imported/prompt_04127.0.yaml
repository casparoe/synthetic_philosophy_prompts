      *   **Point 2: The Disanalogies (The Meat):**
          *   *Reflexivity/Feedback:* Social agents react to theories about them. Molecules don't read physics papers.
          *   *Constitutive Rules:* Institutional facts vs. Brute facts (Searle). Money, marriage, borders exist *by virtue of* collective intentionality, not just aggregation.
          *   *Downward Causation (Stronger sense):* Institutions shape *preferences*, not just constrain actions. (Socialization).
          *   *Multiple Realizability:* Makes reduction computationally impossible, not just hard.
      *   **Point 3: Emergence:** Distinguish between "weak emergence" (SM style, predictable in principle) and "strong emergence" (controversial, but maybe relevant in complexity theory).
      *   **Conclusion:** The analogy vindicates *ontological* individualism (mostly), but not necessarily *methodological* individualism as a practical heuristic. Holism isn't just a placeholder; it's often the only tractable level of description.

  5.  **Drafting the Content (Iterative refinement):**
