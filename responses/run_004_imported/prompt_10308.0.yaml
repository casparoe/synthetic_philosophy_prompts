answer: |-
  Here is a draft of ten interview questions designed for your podcast, structured to move from the classic theoretical objections to the pressing contemporary implications of your guest's work.

  **1.** In his review of *The Morality of Law*, Hart famously charged that your eight desiderata are indistinguishable from the "morality" of an efficient poisoner—principles of technique that are compatible with any end, good or evil. If a tyrant uses clear, prospective, and consistent rules to systematically oppress a minority, hasn't Hart shown that procedural excellence is morally neutral?

  **2.** I anticipate your response will turn on the idea of reciprocity: that the internal morality requires the lawgiver to respect the citizen's agency, which poisoning does not. But does that reciprocity guarantee a moral outcome, or merely a stable expectation of oppression? If the citizen knows exactly how they will be oppressed, where is the moral gain over arbitrary oppression?

  **3.** Let's press on the internal architecture of the eight desiderata themselves. Congruence between declared rule and official action seems to carry the heavy moral lifting in your account, whereas something like clarity or promulgation looks much closer to pure craftsmanship. Are all eight really doing equal moral work, or are you smuggling substantive morality into what are otherwise technical requirements?

  **4.** If you grant that some desiderata are merely technical while only others are genuinely moral, doesn't that shrink your thesis into something Hart could accept? If we separate the "craft" of law from the "morality" of law, haven't we essentially conceded the separation thesis you aim to defeat?

  **5.** I want to turn to the grudge-informer case. In the postwar prosecution of the woman who denounced her husband under a Nazi statute, would you argue that the statute she invoked was valid law at the time she used it? I am looking for a direct answer: was it law, or was it a failure of the internal morality?

  **6.** If you say it was not law because it failed the internal morality, how is your solution practically distinguishable from Hart's preferred solution? Hart argued we should admit it was valid law but punish the woman via frank, openly retroactive legislation. Is your denial of legal validity anything more than a semantic strategy to avoid the hard choice Hart forced us to make?

  **7.** You have built your career arguing that serious injustice always manifests as a failure of one of the eight desiderata. Fuller himself argued Nazi Germany failed this test. But if we accept that premise for the Nazis, does it hold when we move to a regime that is more bureaucratically sophisticated?

  **8.** Consider apartheid-era South Africa. Fuller judged it a gross departure from the eight desiderata, yet some of your own colleagues argue the apartheid state satisfied all eight about as well as any real legal system ever has. If a regime can maintain racial tyranny while satisfying generality, constancy, and congruence, does your signature move—that injustice reveals itself procedurally—begin to break down?

  **9.** Let's bring this closer to the present. Imagine a modern authoritarian state enacting a wartime "anti-disinformation" statute. It is prospective, clear, and consistently administered, yet its purpose is to silence dissent. If this regime satisfies the eight desiderata better than the apartheid state did, are you forced to admit that the internal morality is compatible with substantive injustice, or must you insist such a system is conceptually impossible?

  **10.** Finally, to test the falsifiability of your thesis: specify concretely what a legal system would have to look like to count as a decisive counterexample to the internal-morality claim. Can you point to anything real or realistic that comes close, or does the theory define such a system out of existence by fiat?
