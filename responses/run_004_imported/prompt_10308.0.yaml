      *   **Guest's Position:** Defends Fuller's claim that the eight desiderata constitute a *genuine morality*, not just craft/efficiency. Signature move: Argues that serious injustice manifests as a failure of one or more desiderata.
      *   **Goal:** Draft 8-10 interview questions that *press* on this position, not just invite restatement.
      *   **Required Elements:**
          1.  Hart's "efficient poisoner" objection + follow-up on reciprocity.
