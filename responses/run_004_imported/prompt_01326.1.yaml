  quick one from the Popper rabbit hole I'm down for a piece — in Conjectures and Refutations he nukes Freud, Adler, and Marx for being unfalsifiable, since their theories can basically "explain" any observation after the fact, so nothing's ever really at risk. But elsewhere (Unended Quest, i think?) he says almost the same thing about natural selection — calls it "almost tautological," basically survival of the survivors, and downgrades it to a "metaphysical research programme" instead of real science. Then in that '78 Darwin lecture he recants, at least partly, specifically on Darwinism, but as far as i can tell he never budges an inch on Freud or Marx. Whats the actual structural argument for treating these two cases differently, and does it actually hold up? Like why is "traits that help organisms survive tend to spread" less of a just-so story than "this dream confirms the Oedipal thing" — or is he just cutting evolution a break he wouldn't cut psychoanalysis?
