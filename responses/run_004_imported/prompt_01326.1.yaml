answer: |-
  This is one of the sharpest questions you can ask about Popper. You've hit on the exact tension that keeps philosophers of biology up at night.

  The short answer is: **Popper didn't just cut evolution a break; he changed his mind about the *logical structure* of evolutionary theory, whereas he saw the logical structure of Freudianism and Marxism as inherently immune to change.**

  Here is the structural argument for the distinction, why he recanted on Darwin, and whether it actually holds water.

  ### 1. The Tautology Trap (Why he nuked them both initially)
  Popper's initial beef with Darwin (in *Unended Quest*, 1974) was the same as his beef with Freud: **Circularity.**

  *   **Freud:** Why did the patient dream of a sword? Phallic symbol. Why did he dream of a snake? Also phallic. Why did he dream of a box? Vagina. The theory absorbs any data.
  *   **Darwin (Early Popper view):** Who survives? The fit. Who are the fit? Those who survive.

  If "fitness" is defined *solely* by "survival," then "the fit survive" is a tautology. It contains no empirical content. It's true by definition, like "all bachelors are unmarried." Popper classified this as a "metaphysical research programme"—a useful way of looking at the world, but not strictly scientific because you can't imagine a state of affairs that would contradict it.

  ### 2. The Recantation (The 1978 Darwin Lecture)
  In his lecture *"Natural Selection and the Emergence of Mind,"* Popper famously said: **"I have changed my mind."**

  The structural argument for why Darwinism gets upgraded to "Science" while Freud stays in "Metaphysics" rests on three specific shifts:

  **A. Independent Definition of Fitness**
  Popper realized that biologists do not (or should not) define fitness *post hoc* by survival. Fitness can be defined **physiologically** or **functionally** *before* the selection event.
  *   *Example:* If you predict that white moths will survive better on white bark due to camouflage (a physiological trait independent of the survival outcome), and then you test it, that is falsifiable.
  *   If the white moths get eaten anyway, the theory is busted.
  *   Freudianism lacks this independent variable. There is no "physiological" measure of an Oedipal complex that exists prior to the interpretation of the behavior.

  **B. The Mechanism of Variation**
  Popper came to view the **variation** part of Darwinism (mutation, recombination) as the hard, testable scientific core, while natural selection was the guiding principle.
  *   Genetics provides a mechanism that makes risky predictions (e.g., Mendelian ratios, specific genetic markers in fossils).
  *   Marxism and Freudianism lack a mechanism that generates risky, quantitative predictions. They offer *interpretations* of history or psyche, not predictive models of future states.

  **C. Immunizing Stratagems**
  This is the big one. Popper argued that a theory becomes pseudoscience when its adherents use "ad hoc hypotheses" to explain away contradictions.
  *   **Freud/Marx:** When a prediction failed (e.g., the revolution didn't happen in the most industrialized nation), Marxists added ad hoc clauses (imperialism, false consciousness). When a patient didn't fit the Oedipal mold, Freudians claimed "repression" or "reaction formation." The theory became stronger the more it was attacked.
  *   **Darwinism:** While "just-so stories" exist (especially in evo-psych), hard evolutionary biology *does* allow for falsification. If you find a rabbit fossil in the Precambrian layer, the theory dies. Popper realized that evolutionary biology *does* risk falsification in a way classical psychoanalysis does not.

  ### 3. Does the Distinction Hold Up?

  **Yes, mostly.**
  Popper was right to recant on Darwin. Modern evolutionary theory (the Modern Synthesis and beyond) is mathematically rigorous (population genetics). It makes specific predictions about allele frequencies, phylogenetic trees, and biogeography. It is not merely "survival of the survivors."

  **However, the "Just-So" warning remains valid.**
  Popper's initial skepticism was actually healthy. There is a corner of evolutionary biology (specifically **Evolutionary Psychology**) where Popper's original critique still applies. When researchers claim a modern human behavior is an "adaptation" without a fossil record or genetic pathway to prove it, they are often telling Freudian-style just-so stories. Popper's initial "metaphysical" label was a warning against *that* specific laziness.

  **No, regarding Freud/Marx.**
  Popper never budged here because the *structure* of those theories didn't change.
  *   **Marx:** Historical materialism is still largely retrospective. It explains why capitalism fell (or didn't) after the fact, but its predictive track record on *when* and *where* revolutions would occur was falsified and then immunized.
  *   **Freud:** Classical psychoanalysis remains hermeneutic (interpretive) rather than empirical. You cannot isolate the "id" in a petri dish.

  ### 4. Was he cutting Evolution a break?
  It doesn't look like bias; it looks like **track record.**

  Popper was a realist about scientific progress. By 1978, evolutionary biology had successfully predicted the discovery of transitional fossils, explained antibiotic resistance, and mapped genetic lineages. It was *doing* the work of science.

  Freudianism and orthodox Marxism, by contrast, had stagnated. They weren't generating new, risky predictions that turned out to be true; they were generating new *interpretations* of old data.

  **The Verdict:**
  Popper's structural argument holds:
  1.  **Darwinism** allows for independent variables (traits) to be tested against outcomes (survival).
  2.  **Freud/Marx** collapse the variable and the outcome into a single narrative interpretation.

  He wasn't giving evolution a free pass; he was acknowledging that evolutionary biologists had done the work to make their theory falsifiable, whereas the followers of Freud and Marx had worked hard to make theirs unfalsifiable.

  Popper's initial error was assuming "Natural Selection" *had* to be tautological. His correction was realizing that **Natural Selection + Genetics = Testable Science.** There is no equivalent "Genetics" for the Oedipus Complex.
