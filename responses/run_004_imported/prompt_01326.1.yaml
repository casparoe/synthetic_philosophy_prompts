      *   *The Role of Variation:* Popper came to see the *variation* part of Darwinism as the testable, scientific core, while selection was the guiding principle.
      *   *Predictive Power:* Evolutionary biology makes specific predictions (fossil records, genetic markers, biogeography). Psychoanalysis generally interprets past data without making risky predictions about future observations or specific physical mechanisms.
      *   *Progressive Research Programme:* Lakatos's influence (though Popper doesn't fully adopt Lakatos). Is the programme generating new knowledge? Evolution did; classical Freudianism stagnated.

