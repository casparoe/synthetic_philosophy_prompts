answer: |-
  The first week home, the kitchen became a laboratory of errors.

  Elena sat at the table, her hands wrapped around a mug of tea that had gone cold. She looked at the window, where the rain was streaking the glass in gray lines.

  "It's bright out," she said.

  Mark paused, the dish towel in his hand. The sky was charcoal. The light in the room was dim. He had two options. Option one: Elena was hallucinating, or her perception of light was broken. Option two: The word *bright* no longer mapped to luminance.

  If he chose option one, he treated her as mistaken about the world. If he chose option two, he treated her as speaking a different dialect. To keep the conversation alive, to keep her rational, he had to minimize the error. It was easier to assume the word had shifted than to assume her mind was fracturing.

  "It is," Mark said. "Very bright."

  She nodded, satisfied. She took a sip of the cold tea.

  "Hot," she said.

  Mark didn't correct her. If he said *no, it's cold*, he was asserting that her sensory experience was wrong. If he accepted *hot*, he had to update his definition of her vocabulary. *Hot* might mean *liquid*. Or *mine*. Or *comfort*.

  "Drink it," he said.

  She smiled. It was a small victory. He wasn't teaching her English again; she knew the syntax, the grammar, the nouns for common objects. The problem was the bridge between the word and the belief. When she said *dog*, she pointed to the neighbor's cat. Was she misidentifying the animal (a false belief), or had the label *dog* expanded to include small furry quadrupeds (a shift in meaning)?

  Mark decided it was a shift. He stopped correcting her. If she called the cat a dog, he would talk about the dog. To insist on the truth of the matter—that it was a cat—would be to claim she was irrational. And if she was irrational, communication was impossible. He had to assume she made sense, even if the sense was new.

  By the third week, they had developed a rhythm. It wasn't the rhythm of their marriage before the accident. That language was dead, buried with the memories of their honeymoon, their arguments about politics, the nicknames that relied on shared history. This was something improvised, built day by day.

  They sat on the sofa. Elena was holding a book, upside down.

  "Story?" she asked.

  "It's a cookbook," Mark said.

  "Story," she insisted. She tapped a picture of a lasagna. "Layers. Drama."

  Mark felt the urge to correct her. *It's not a story, it's instructions.* But that would require her to understand the distinction between narrative and instruction, a distinction that might not exist in her current map. If he assumed she was rational, then to her, the sequence of layers *was* a narrative.

  "Okay," Mark said. "What happens next?"

  "Cheese," she said. "Then fire."

  "Then fire," he agreed.

  She turned the page. She was happy. He was successful. But as he watched her trace the image of the oven, Mark wondered: Did she understand what he meant by *fire*? Did he understand what she meant? Or had they simply agreed to use the sound *fire* to mark the end of the sequence?

  They were converging. That was the only word for it. Their theories of each other were adjusting. He had a prior theory of how Elena spoke—based on ten years of marriage—but that theory was useless now. It predicted she would call the book a cookbook. She didn't. He had to build a passing theory, a temporary set of rules that worked for this conversation, this moment.

  Tomorrow, the rules might change.

  Two months in, the test came.

  They were walking in the park. Autumn leaves covered the path. Elena stopped by a bench. She pointed to a pigeon pecking at a crust of bread.

  "Free," she said.

  Mark looked at the bird. It was tethered by nothing, yet it stayed. It could fly, but it chose the bread.

  "Yes," Mark said.

  "No," she said. She pointed to the bread. "Free."

  She meant the bread was free. Gratis. But she used the word without looking at him for confirmation. She assumed he knew. This was the danger. When you stop checking, you assume the convergence is complete. You assume the language is shared.

  Mark looked at the bread. It was stale. Hardly a gift. But if he said *no, it's not free*, he risked breaking the flow. He had to assume she believed the bread was available without cost. Given the context—a public park, discarded crust—was that an unreasonable belief? No. It was charitable to assume she thought the bread was available.

  "It's free," Mark said.

  She picked up the crust. She offered it to him.

  "Eat."

  He took it. It was hard, dry.

  "Good?" she asked.

  "Good," he said.

  She beamed. They walked on. His hand brushed hers. She didn't pull away. In the old life, this would have meant *I love you*. In this life, it meant *I am walking beside you*. The meaning was determined by the use, not the history.

  That night, Mark lay awake while Elena slept. The house was quiet. He thought about the word *love*. He hadn't used it since she came home. He didn't know what it meant to her now. Did it mean *care*? Did it mean *presence*? Did it mean *the person who hands me the cold tea and calls it hot*?

  He could say it. He could watch her face. If she smiled, did she understand the word as he intended? Or did she interpret it as *comfort*, or *safety*, or *routine*?

  If she said it back, would it mean she remembered him? Or would it mean she had learned that when he says *love*, the correct response is *love*?

  He rolled over. She murmured in her sleep. "Bright," she whispered.

  The room was dark.

  Mark closed his eyes. He knew what she meant. She meant *safe*. She meant *here*. He had solved the equation. He had balanced the belief and the meaning until the system held.

  But as he drifted off, a doubt lingered, cold and sharp. If he handed her a glass of water tomorrow and she called it *fire*, and he handed her a match and she called it *water*, and they navigated the day without burning or drowning, would it matter which was which?

  He reached out in the dark and found her hand. She squeezed back.

  "Here," she said.

  "Here," he answered.

  He didn't know if they were in the same place. He only knew they were arriving at the same time.
