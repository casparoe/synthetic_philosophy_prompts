      *   *Mention the TV show irritation:* A specific detail that brings him to life.
      *   *The "Corpse" comment:* Do *not* use this word. Instead, focus on "the body remaining" vs. "the person."
      *   *The Organ Donation:* Acknowledge it didn't happen, but focus on the intent.

  6.  **Review against constraints:**
      *   4-5 minutes? (Looks good, approx. 650 words).
      *   Honest about brain death? (Yes).
      *   Kind to Grandma? (Yes, frames it as emotional necessity).
      *   Not a lecture? (Focuses on love and memory).

  7.  **Final Polish:** Check transitions. Ensure the ending feels resolved. (The resulting draft in the main response follows this structure.)

  8.  **Adding Advice:** Since the user is nervous, add some delivery tips (breathing, printing large font, etc.).

  **(Self-Correction Note):** I need to be very careful not to validate the medical inaccuracy (brain death *is* death legally and medically) while validating the emotional reality (it *felt* like he was there). The eulogy must walk this tightrope. The phrasing "He taught us about the science of life, but we taught him about the difficulty of letting go" might work well.

