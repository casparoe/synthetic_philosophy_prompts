      *   **Audience:** Divided family. One side agrees with Grandpa's medical definition (brain death = death). The other side (including Grandma/Aunt) believes death happened when the heart stopped.
      *   **Goal:** Honor Grandpa's specific wishes/views without shaming Grandma/Aunt for their grief process. Acknowledge the disagreement without making it a fight.
      *   **Tone:** Respectful, honest, compassionate, not morbid, not a philosophy lecture.
      *   **Length:** 4-5 minutes (approx. 500-750 words spoken at a moderate pace).

  2.  **Determine the Angle/Theme:**
      *   *The Hard Truth vs. The Soft Goodbye:* Grandpa dealt in hard medical truths. His family dealt in soft emotional goodbyes. Both are valid in their own contexts.
      *   *Integrity:* Grandpa was a man of integrity (ICU nurse, specific wishes).
      *   *Love:* The reason for the conflict was love. Grandma held on because she loved him, not to spite him.
      *   *Resolution:* We honor him by telling the truth about who he was, even the hard parts, while forgiving the human element of grief.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor and the nervousness (humanizes the speaker). Introduce Grandpa not just as a grandfather, but as a professional.
      *   **The Professional Man:** Discuss his career as an ICU nurse. Mention his specific views on brain death. This needs to be stated clearly because he would want it acknowledged. Use his "deadpan" humor.
      *   **The Conflict (The Elephant in the Room):** Address what happened at the end. This is the tricky part.
          *   *Strategy:* Frame it as a clash between his professional clarity and his family's emotional need.
