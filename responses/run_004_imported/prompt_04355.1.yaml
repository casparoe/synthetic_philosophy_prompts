answer: |-
  It is a pleasure to correspond with someone who stood on the front lines of the plate-tectonics revolution. Your experience with the geosynclinalists is the perfect empirical anchor for this philosophical problem. You witnessed firsthand what Kuhn was trying to theorize: colleagues who weren't "stupid" or "irrational," but who were working within a lexical structure that made the new evidence look like anomalies rather than refutations.

  You have identified the precise pivot point in Kuhn's later philosophy (roughly 1980s onward, collected in *The Road Since Structure*). Kuhn explicitly conceded that Davidson was right about *global* incommensurability but insisted he was wrong about *local* incommensurability.

  Here is an explanation of how Kuhn's taxonomic machinery attempts to escape Davidson's charge, followed by an assessment of whether this retreat weakens Kuhn's original thesis.

  ### 1. Escaping Davidson: The Taxonomic Solution

  Donald Davidson's 1974 critique, "On the Very Idea of a Conceptual Scheme," attacked the dualism of "scheme" and "content." Davidson argued that if we can interpret a speaker's utterances as expressing beliefs, we must share a vast background of true beliefs and logical structures with them (the Principle of Charity). Therefore, the idea of a scheme that is *wholly* untranslatable is incoherent; if it were truly untranslatable, we couldn't even identify it as a language or a scheme.

  In his early work (*Structure*, 1962), Kuhn sometimes wrote in ways that invited this critique, suggesting that proponents of different paradigms "practice their trades in different worlds."

  **The Later Kuhn's Concession and Counter-Move:**
  In his later essays (e.g., "Commensurability, Comparability, Communicability," 1982), Kuhn agreed with Davidson that **wholesale** untranslatability is impossible. If two groups share no vocabulary, they cannot recognize each other as scientific communities.

  However, Kuhn argued that Davidson proved too much. Just because *total* untranslatability is impossible doesn't mean *partial* untranslatability is impossible. Kuhn localized the failure of translation to specific **taxonomic structures**.

  **The Mechanism: Kind Terms and the No-Overlap Principle**
  Kuhn's later model posits that scientific vocabularies are structured as hierarchies of "kind terms" (e.g., *planet, star, element, species*). These hierarchies obey a **No-Overlap Principle**: within a given taxonomy, an object cannot belong to two mutually exclusive kinds at the same level (e.g., nothing can be both a *planet* and a *star*).

  Incommensurability arises when two theories structure these hierarchies differently.
  *   **Theory A** might have a node labeled "Geosyncline" which implies a specific causal mechanism of subsidence.
  *   **Theory B** (Plate Tectonics) eliminates that node entirely and replaces it with "Subduction Zone" and "Rift," which carve up the geological phenomena differently.

  **How this escapes Davidson:**
  1.  **Shared Background:** Because the incommensurability is *local*, the vast majority of the vocabulary (logic, mathematics, basic observational terms like "rock," "layer," "tilt") remains translatable. This satisfies Davidson's requirement that we share enough background to recognize the other group as rational agents.
  2.  **Identifiable Locus of Failure:** We can point to the specific term where translation fails. We can say, "There is no term in your language that maps onto my term 'geosyncline' without changing the truth conditions of the sentences it inhabits."
  3.  **No Scheme-Content Dualism:** Kuhn dropped the idea that the "world" is an unstructured content waiting for a scheme to organize it. Instead, he argued that the *lexical structure itself* determines what kinds of objects can be recognized.

  In short, Kuhn tells Davidson: "You are right, we can't have two totally alien schemes. But we can have two schemes that overlap 90%, where the remaining 10% involves structural mismatches in kind terms that make direct translation of specific claims impossible."

  ### 2. Assessment: Is "Local" Incommensurability Strong Enough?

  The critical question you raise is whether this "localized" version retains the teeth of Kuhn's original argument. Kuhn's original goal was to explain why paradigm shifts are not merely cumulative and why theory choice is not algorithmic (i.e., why there is no neutral set of rules that dictates the winner).

  **The Case for "Yes" (It holds up):**
  The localized taxonomic view actually strengthens Kuhn's position against charges of irrationality while preserving the core insight.
  *   **Rational Incomparability:** If the definitions of the *kinds* change, then the standards for what counts as a solution change. In your field, a "solution" in geosynclinal theory involved explaining vertical crustal movements via cooling/shrinking. In plate tectonics, the "solution" involves horizontal movement via convection. Because the *kind terms* (crust, mantle, force) are interdefined differently, you cannot simply plug the data from one into the equations of the other.
  *   **No Neutral Algorithm:** Even if we can translate 90% of the language, the crucial 10% determines how the evidence is categorized. If a rock formation is categorized as a "geosynclinal deposit" in Theory A, it implies a history that Theory B says is impossible. There is no neutral language to describe the rock *without* already committing to one taxonomy or the other. Thus, rational comparison is possible, but algorithmic decision is not.

  **The Case for "No" (It is weakened):**
  Critics (such as Philip Kitcher or, earlier, Imre Lakatos) might argue that by conceding the translatability of most vocabulary, Kuhn admits that the theories *are* comparable after all.
  *   **The "Change of Subject" Objection:** If the terms change meaning so drastically that they are untranslatable, are the scientists really disagreeing? Or are they just talking past each other? If Kuhn restricts incommensurability to a few kind terms, it risks looking like a mere semantic stipulation rather than a deep epistemic break.
  *   **Davidson's Lingering Shadow:** If we can identify the taxonomic mismatch (as Kuhn says we can), haven't we already created a "neutral" meta-language to describe the difference? If I can say "Newton's mass is not Einstein's mass," I have successfully compared them. Davidson would argue this shows the schemes are commensurable enough to be rationally evaluated.

  **My Assessment:**
  Kuhn's later position is philosophically more defensible but historically less dramatic. It saves the phenomenon of **meaning variance** without succumbing to relativism.

  However, does it explain why successive paradigms are "rationally incomparable"? I would argue **yes, but with a caveat.**
  *   **Yes:** It explains why there is no *proof* in a revolution. You cannot prove plate tectonics to a geosynclinalist using the geosynclinalist's own criteria, because the criteria rely on kind terms that plate tectonics renders obsolete. The rationality lies in the ability to learn the new language, not in an algorithmic deduction.
  *   **The Caveat:** It shifts the burden from "incomparable" to "incommensurable but comparable." Kuhn always insisted paradigms *are* comparable (we can discuss them), just not via a common measure. The later work clarifies this. The "incomparability" is not that we cannot judge them, but that we cannot judge them *neutrally*.

  **Applying this to your Geology:**
  When you spoke to the geosynclinalists, you weren't speaking different languages (Davidson's worry). You shared the words "strata," "fossil," and "time." But the *network* connecting those words differed. To accept plate tectonics, they didn't just have to accept new facts; they had to dismantle a taxonomy where "continents" were fixed and "basins" subsided vertically.

  Kuhn's later machinery captures this perfectly. The incommensurability wasn't that you couldn't understand them; it was that the term "geosyncline" carried a theoretical load in their taxonomy that had no referent in yours. You could translate the word, but you couldn't translate the *kind*.

  **Conclusion:**
  Kuhn's retreat to local incommensurability was necessary to avoid Davidson's *reductio ad absurdum*. While it softens the "different worlds" rhetoric of 1962, it preserves the crucial insight: scientific revolutions involve a restructuring of the lexical categories through which the world is accessed. This is strong enough to explain why theory choice is not algorithmic. It validates your experience: the resistance you faced wasn't just stubbornness; it was the cognitive friction of trying to map a new taxonomy onto an old one without losing the coherence of the old system. Kuhn's later work provides the vocabulary to describe that friction without declaring the older geologists irrational.
