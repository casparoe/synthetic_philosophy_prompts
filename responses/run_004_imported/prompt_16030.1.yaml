answer: |-
  **MEMORANDUM**

  **TO:** Model-Risk Review Committee
  **FROM:** Engineering Representative
  **DATE:** Thursday, October 26
  **SUBJECT:** Recommendation on Credit-Scoring Model Launch Criteria

  **Executive Summary**
  I recommend we **approve the model for deployment conditional on a bounded False Positive Rate (FPR) disparity constraint**, explicitly treating the resulting deviation from strict calibration as a quantified business cost rather than a statistical error. We cannot satisfy both Data Science's calibration requirement and Compliance's fairness requirement simultaneously; choosing between them is a governance decision, not a technical one.

  **The Technical Impasse**
  Data Science is correct regarding the impossibility theorem (KMR/Chouldechova). Given the historical base-rate differences between applicant groups, a single model cannot be perfectly calibrated for both groups *and* produce equalized error rates. If we force FPR parity, the predicted probability of default at the approval threshold will necessarily differ by group.

  However, Compliance is correct that mathematical impossibility is not a regulatory defense. Under fair lending frameworks (e.g., ECOA), a model that systematically denies creditworthy minority applicants at higher rates than majority applicants creates actionable disparate impact risk, regardless of calibration.

  **The Decision Framework: "Cost of Fairness"**
  We must decouple the **Risk Estimate** (the model score) from the **Decision Policy** (the approval threshold).

  1.  **Preserve Calibration for Risk Management:** The model scores should remain calibrated. This ensures our capital reserves and pricing accurately reflect the true probability of default. Data Science's work here is sound and must not be altered for reporting purposes.
  2.  **Constrain the Decision Policy for Fairness:** We will adjust the approval threshold strategy to bound the FPR disparity between groups to a specific ratio (e.g., < 1.2x). This acknowledges Compliance's mandate.
  3.  **Quantify the Tradeoff:** Adjusting the threshold to lower the minority FPR will, by mathematical necessity, approve marginal applicants with higher predicted risk. We must treat this as an explicit **Expected Loss Increase**.

  **Recommendation**
  I propose the Committee vote on the following **Bounded Tradeoff Criterion**:

  *   **Approve the model** provided the decision policy is optimized to reduce the Minority FPR to within 20% of the Majority FPR.
  *   **Accept an Expected Loss increase** of up to [X] basis points in the minority segment as the documented cost of this fairness constraint.
  *   **Mandate a quarterly review** to ensure the base-rate disparity does not widen, which would require recalibrating this tradeoff.

  **Reasoning**
  This approach engages Data Science by acknowledging that we are intentionally accepting miscalibration at the *decision margin* in exchange for a regulatory objective, rather than claiming the model itself is broken. It engages Compliance by moving beyond a binary "pass/fail" to a managed risk approach where the cost of fairness is transparent to the business.

  We are not deciding if the math is wrong; we are deciding how much financial risk we are willing to underwrite to meet our fairness obligations. I request the Committee authorize the specific Expected Loss budget associated with this constraint by Friday EOD.

  **Action Required**
  Vote to approve the **Bounded Tradeoff Criterion** and the associated **Expected Loss Budget**.
