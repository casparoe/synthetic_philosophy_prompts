      *   *Keywords:* Harmony, geometry, light, aspects, soul, divine, superstition, tables, precision.
      *   *Reaction to the Phone:* It's a "magic mirror" (glass that lights up). He won't know it's a computer. He'll focus on the *content* displayed.
      *   *Reaction to the App:*
          1.  Awe at the calculation speed/accuracy (Rudolphine Tables took decades; this is instant).
          2.  Disgust at the interpretation ("Scorpios are soft").
