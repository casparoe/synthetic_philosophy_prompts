  2.  **Deconstruct Kepler's Actual Position (Historical Research):**
      *   *Source:* *Tertius Interveniens* (The Third Party Intervening, 1610).
      *   *The "Third Party":* He positions himself between the "superstitious fatalists" (traditional astrologers who say stars *force* actions) and the "scoffing atheists" (who deny any celestial influence).
      *   *Mechanism:* It's not about the stars themselves being magical. It's about *geometry* and *light*. The planets form angles (aspects) at the Earth. These angles resonate with the human soul (which is created in God's image and understands geometry) and the Earth (weather).
      *   *The Zodiac:* He was skeptical of the 12 signs as arbitrary divisions. He cared about the *ecliptic* and the actual positions, not the constellations' mythologies.
      *   *Prediction:* He cast horoscopes for money (Wallenstein, Rudolf II), but often hedged his bets or focused on weather/harvest rather than "you will meet a tall stranger."
      *   *Data:* He was obsessed with precision (Tycho Brahe's data). Inaccurate tables = inaccurate aspects = false physics.
      *   *The Conflict:* He wanted a "reformed astrology" based on physical causes (optics/harmonics), not tradition.

  3.  **Drafting the Reconstruction (The "Why"):**
