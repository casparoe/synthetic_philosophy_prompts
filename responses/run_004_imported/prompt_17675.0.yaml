answer: |-
  This is a fantastic nuance to capture. You are absolutely correct: the binary of "Kepler the Mystic" vs. "Kepler the Rationalist" is a later invention. The historical Kepler was a "Natural Philosopher" who believed the physical and spiritual worlds were woven together by geometry. He didn't think astrology was fake; he thought *most astrologers were doing the math wrong and asking the wrong questions.*

  Here is a reconstruction of his specific philosophical position, followed by a scene draft in his voice.

  ### Part 1: The Reconstruction (Kepler's Actual Position)

  To write Kepler accurately, you need to understand that for him, **Theology, Geometry, and Physics were the same subject.**

  **1. The Mechanism: Light and Angles, not Stars and Myths**
  Kepler rejected the idea that the constellations (the Lion, the Virgin, the Scales) had any power. To him, those were just human myths painted on the stars. He also rejected the idea that planets were "gods" influencing fate.
  *   **His Theory:** The planets emit a physical light (or *species*) that sweeps across the Earth. When two planets form a specific geometric angle (a conjunction, a sextile, a square) relative to the Earth, their light rays interact.
  *   **The Resonance:** The human soul is made in the image of God, and God is a Geometer. Therefore, the human soul unconsciously perceives these planetary angles the way the ear perceives musical harmonies. A "square" aspect feels dissonant (tension); a "trine" feels consonant (ease).
  *   **The Effect:** This doesn't force you to *do* anything. It creates a "weather" in the soul or the atmosphere. It might make you irritable (Mars) or melancholic (Saturn), but your free will remains. It influences *inclination*, not *compulsion*.

  **2. The Data: Precision is Piety**
  Kepler spent decades on the *Rudolphine Tables* because he believed that if you pray with the wrong numbers, God cannot hear you. If your planetary positions are off by even a few minutes of arc, the geometric aspect is wrong. If the aspect is wrong, the "music" is out of tune.
  *   **The Conflict:** Traditional astrologers used sloppy tables and arbitrary house systems. Skeptics (like his contemporary, Erasmus Reinhold or later figures) threw out the baby with the bathwater.
  *   **Tertius Interveniens:** In this treatise, he argues that the "superstitious" astrologers discredit the true science of the stars, while the "scoffers" deny the obvious harmony of creation. He is the "Third Party" trying to save the science from the charlatans.

  **3. The App Paradox**
  To Kepler, your smartphone app represents a theological tragedy.
  *   **The Miracle:** It calculates planetary positions instantly and (presumably) with accuracy that surpasses his life's work. It is the ultimate tool of the Divine Geometer.
  *   **The Insult:** It uses that divine precision to feed the user generic, sign-based nonsense ("Scorpios are soft"). It is using a microscope to read a fortune cookie. It validates the *math* while corrupting the *meaning*.

  ***

  ### Part 2: The Scene (In Kepler's Voice)

  *Context: The modern character has shown him the glowing screen. Kepler is examining it not as technology, but as a manifestation of light and data.*

  "You hold the light in a box of glass. I shall not ask by what artifice the spirits are trapped inside to make it glow; my eyes are old, and the world is already full of wonders I have not the time to unravel. Look instead to what the light *says*.

  "You tell me this... *instrument*... knows the sky? Instantly? I spent thirty years with Tycho, squinting through brass sights until my spine curved like a bow, calculating the motion of Mars until the numbers bled into my dreams. I produced the *Rudolphine Tables* so that a scholar in Vienna and a sailor in Lisbon might look at the same sky and see the same truth. And you say this glass does it in a breath?

  "If that is true, then you hold the key to the New Astrology. You have the precision I prayed for. You have the exact degrees, the very minutes of the arc. With this, we could finally map the true harmonies. We could see exactly when the light of Saturn strikes the Earth at a quartile to the Moon, and warn the farmers of the frost. We could understand the geometry of the soul's tempers.

  "But then... you show me the reading.

  "*'Scorpio.'*

  "Do you hear what you are saying? You have taken the most precise measurement of the heavens ever conceived—measurements that reveal the mind of God in number—and you have poured them into a bucket of old wives' tales.

  "The Scorpion is not in the sky, madam. There is no tail. There is no sting. There is only the ecliptic, a circle of 360 degrees, measured from the vernal equinox. To say a man is shaped by the 'Scorpion' because the Sun was in that slice of the zodiac is to say a man is fed by the picture on his dinner plate. It is arbitrary. It is poetic, perhaps, but it is not *physics*.

  "And this phrase... 'Secretly soft.' What geometry is soft? What angle is secret? If Mars is in opposition to your natal Venus, you will feel a tension, a discord, like a lute string wound too tight. That is not 'softness.' That is the architecture of creation vibrating through your blood.

  "It is a tragedy. It is a profound and weeping tragedy.

  "In my time, the charlatans excuse their errors by blaming the stars. They say, 'The prediction failed because the art is difficult.' But you... you have no excuse. You have the truth of the positions. You have the exactness I died for. And yet you use it to tell people they are 'compatible' because of a symbol drawn by Chaldean shepherds three thousand years ago.

  "You have built a cathedral of crystal and filled it with mud.

  "Give it back to me. Let me see the degrees. Ignore the 'Sign.' Ignore the 'House.' Show me only the aspects. Show me where the light strikes the Earth. If you will not use this miracle to understand the harmony of the spheres, then let me at least see if the numbers are true. For if the numbers are true, and you still tell the people lies... then you are not astrologers. You are merely merchants selling mirrors to the blind."
