          1.  *Quality of Policy:* If no one critiques the plan, flaws remain. Groupthink leads to failure (even on the party's own terms).
          2.  *Corruption of Agency:* Members become instruments, not agents. This undermines the *purpose* of democracy (self-governance).
          3.  *The "Ends Justify Means" Trap:* If you sacrifice democracy to save the environment, do you value the environment more than the people living in it?
