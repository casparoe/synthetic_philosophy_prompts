      *   **The Circularity Objection (AR to R):** You need testimony to verify testimony. The inductive base is contaminated.
      *   **The Gullibility Objection (R to AR):** If trust is default, how do we filter liars, mistakes, or crazy claims?
      *   **Intermediate Positions:**
