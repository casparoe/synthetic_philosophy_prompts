      *Self-Correction on Śabda vs Anumāna:* Is Śabda more contested than Anumāna? Yes. Sāṅkhya, Vaiśeṣika (early), and Buddhists all question Śabda's independence. Only Cārvāka questions Anumāna's validity (others refine it). So Śabda is more contested regarding its *independence* as a pramāṇa. Upamāna is the most contested. Pratyakṣa is the least.
      So: Pratyakṣa > Anumāna > Śabda > Upamāna.

      *Wait, one nuance:* Vaiśeṣika eventually merged with Nyāya and accepted Śabda. But early Vaiśeṣika Sutras only list Perception and Inference. Buddhists (Dignāga/Dharmakīrti) list only Perception and Inference. Sāṅkhya lists Perception, Inference, Testimony (so they accept Śabda). Cārvāka lists Perception.
      So:
