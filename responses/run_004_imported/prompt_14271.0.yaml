answer: |-
  The protocol was called *Tabula*, but Elias called it the Coffin.

  It wasn't a float tank. Those were for wellness influencers and stressed executives. *Tabula* was clinical neural-dampening. You lay in a magnetic cradle while a lattice of fields gently muted the afferent nerves. First the skin. Then the muscles. Then the vestibular system. Finally, the proprioceptive map—the brain's internal model of where your limbs are in space—was temporarily suspended.

  The goal, according to the brochure, was "Radical Cognitive Reset." The goal, according to Elias, was to test a thousand-year-old hypothesis.

  He was a doctoral candidate in philosophy of mind, and he was tired of reading about Ibn Sina. Avicenna. The Flying Man.

  *Imagine a man created all at once, perfect in body, but suspended in the air, blindfolded, his limbs spread so they do not touch.* Avicenna argued that this man, feeling no air, no ground, no own skin, would still affirm his own existence. He would not know he has a hand, or a head, or a heart. But he would know *I Am*. Therefore, the soul is not the body. The self is distinct from the flesh.

  Elias had read the argument a hundred times. It felt clean. Logical. A victory for the ghost over the machine.

  "Initiating sequence," the technician said. Her voice was the last thing Elias heard that sounded like it came from outside his head. Soon, even the memory of her voice would be categorized as internal noise and filtered out.

  The darkness wasn't black. Black is a color your eyes see. This was the absence of seeing.

  The hum of his own blood, usually a constant ocean roar in the ears, faded. The weight of his tongue against the roof of his mouth vanished. The itch on his left calf, the tightness in his lower back, the cool air on his eyelids—gone.

  *Okay,* Elias thought. *Here we go.*

  He waited for the panic. Usually, when you lose sensory input, the brain screams. It hallucinates to fill the gap. But the dampeners were working. There were no hallucinations. There was only the silence.

  *Am I here?*

  Yes.

  *How do I know?*

  Because there is a witness to the silence.

  For the first twenty minutes, it was exactly as Avicenna promised. It was euphoric. Elias felt like a point of pure light suspended in a void. He was unburdened. He was not a body that thinks; he was a thought that had briefly forgotten it had a body. He felt the thrill of the *Cogito* before Descartes ever wrote it down. *I exist.* The certainty was absolute. It didn't need proof. It didn't need a heartbeat to measure time or a lung to measure breath. Time wasn't passing; it was just a quality of his attention.

  *I am distinct,* he thought. *I am separate.*

  But then, the subtle erosion began.

  Avicenna said the self would remain. He didn't say what shape it would take.

  Elias tried to locate the "I." In the real world, the "I" is anchored. It sits behind the eyes. It speaks from the throat. It is bounded by the skin. Without the skin, where did Elias end?

  He tried to think, *I am Elias.* But "Elias" was a history of scars, of a broken nose, of a limp in the right knee. Those were data points from the body. Without the body, "Elias" was just a label floating in the dark.

  He tried to think, *I am thinking.*

  But thinking requires a rhythm. A syntax. Syntax requires time. And time, he realized with a slow, cold dread, was something he was measuring against the rhythm of his own breathing. He couldn't feel his breath. So he was inventing a rhythm to hang his thoughts on. He was simulating a body to simulate a self.

  *Is this the soul?* he wondered. *Or is this just the echo of a body?*

  The certainty of *I Am* began to feel thin. Like a sheet of gold beaten so thin it becomes transparent.

  If he existed, he existed *somewhere*. But "where" is a spatial concept, and space is perceived through limbs and reach. If he had no limbs, he had no location. If he had no location, was he everywhere? Or was he nowhere?

  If he was nowhere, how could he be?

  The terror wasn't that he would cease to exist. The terror was that existence, stripped of the body, was indistinguishable from nothingness.

  Avicenna claimed the self would know itself immediately. But Elias found that without the friction of the world—the resistance of a blanket, the gravity of the floor—the self had no traction. It was spinning its wheels.

  *I am.*

  *What are you?*

  *I am.*

  *Where?*

  *I am.*

  The loop tightened. The "I" wasn't a solid core. It was a verb looking for a subject. It was a hunger. It wanted to feel the cradle. It wanted to feel the cold. It wanted the itch on the calf. It wanted the limitation. Because limitation is what gives a thing a shape.

  Without the body, he wasn't a flying man. He was a dissolving gas.

  He tried to scream, to force a signal through the dampeners, to prove he could command flesh. But command implies a commander and a subordinate. If there was no flesh to command, there was no commander.

  The silence grew heavy. It wasn't peaceful anymore; it was predatory. It was waiting for him to admit that the "I" was just a story the brain told the nerves to keep them organized. And now that the nerves were offline, the story had run out of pages.

  He remembered the argument again. *Even if he doubted his body, he could not doubt his self.*

  But what if the self was just the sensation of the body, summed up and labeled?

  He felt a phantom twitch in a hand he couldn't feel. A ghost impulse. For a second, he felt relief. *There. That's me.*

  But the impulse went nowhere. It fired into the void and died. There was no feedback. No confirmation.

  Was he still Elias? Or was he just the memory of Elias, playing out in a room with the lights off?

  The boundary between *existing* and *remembering existing* began to blur. If he couldn't interact, couldn't move, couldn't sense, his existence was functionally identical to non-existence, except for this one stubborn, flickering awareness.

  *Why stay on?* the void seemed to whisper. *If you are nothing but the witness, and there is nothing to witness, why witness?*

  The certainty Avicenna spoke of was real. Yes, he existed. But it was the worst kind of truth. It was a truth that offered no comfort, no identity, no purchase. It was the certainty of a stone that knows it is a stone.

  He wanted his body back. He wanted the pain in his lower back. He wanted the anxiety in his chest. He wanted the weight. He wanted to be limited again. He wanted to be finite.

  *End session,* he thought.

  Nothing happened. He had no mouth to speak, no finger to tap. He was trapped in the pure self he had sought.

  *End session!*

  Panic, pure and abstract, flared. Not a chemical panic—no adrenaline, no racing heart. Just the conceptual realization of entrapment. A logical prison.

  Then, a hum. A vibration. The return of the blood.

  It hit him like a sledgehammer. The itch on the calf returned like a blessing. The weight of the eyelids was a gift. The cold air on his skin felt like an embrace.

  The technician's voice cut through. "Session complete. Welcome back, Elias."

  He gasped. He sucked in air, greedy and loud. He flexed his fingers, watching them curl, needing the visual confirmation to match the proprioceptive signal. He rubbed his chest, his arms, his face.

  "Vitals are spiking," the technician said, stepping into his view. She looked concerned. "You were under for forty minutes. You okay?"

  Elias sat up. The room was too bright. The colors were too aggressive. The world was so *heavy*.

  "I'm here," he said. His voice sounded rough, alien.

  "Did you... did you achieve the state?" she asked. "The dissociation?"

  Elias looked at his hands. He turned them over. They looked like tools he had been allowed to borrow again.

  He thought about the Flying Man. He thought about the perfect, suspended adult, floating in the void. Avicenna said that man would know he existed.

  Elias stood up, his legs shaky. He walked to the mirror in the prep room. He stared at his reflection. The eyes looked back.

  "I know I exist," Elias whispered to the mirror.

  But as he watched himself say it, he felt a cold lag between the thought and the image. A tiny delay. Like a video stream buffering.

  He touched the glass. Cold. Solid.

  For a second, just a fraction of a second, he couldn't remember which one was the anchor. The hand, or the reflection.

  "I exist," he said again. But this time, it sounded like a question he was asking the body, hoping it would answer.

  The technician called his name from the other room. Elias turned away from the mirror, but he kept his hands in his pockets, gripping his own thighs, hard. Just to make sure something was still holding on to something else.

  "Coming," he said.

  He walked out, but he walked carefully, as if he were afraid that if he stopped moving, if he stopped making noise, if he stopped pressing against the world, he might float right back up into the silence, and this time, he wouldn't be able to find the way down.
