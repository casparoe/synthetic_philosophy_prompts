prompt: |-
  I'm a junior at my high school and one of five student members on our Student Government Elections Board, which hears complaints about campaign conduct and has the authority to certify, sanction, or void election results; I joined partly because I'm in AP Government this year and wanted to see how rules like this actually get applied rather than just discussed in the abstract. We just finished counting votes for next year's Student Body President, and the runner-up has filed a formal complaint asking us to void the results, which has turned into the most contested case the board has handled in the three years it's existed. Our faculty advisor has asked each of the five of us to submit a short written recommendation before Friday's meeting, which she'll read aloud before we debate and vote, and I'd like mine to hold up on the merits rather than simply restate whichever way I happen to lean personally.

  The situation is this. Priya won by 41 votes out of about 590 cast, and Marcus, the runner-up, argues that three of her tactics crossed the line from campaigning into manipulation, even though our bylaws only ban "dishonest or manipulative practices" and separately protect "vigorous persuasive campaigning" without ever saying where one shades into the other. First, in the final week, she and her team sent noticeably different direct-message pitches to different friend groups based on things gathered from those groups' own posts and group chats -- telling club-sport captains she'd fight for a bigger locker-room budget, telling the AP crowd she'd push to cap nightly homework -- so that almost no one outside her inner circle saw one coherent version of her platform, and some of what different groups were promised is in real tension with the rest. Second, our rules bar any new campaign material once voting opens, so she timed a video to go live at the exact moment the 24-hour window began: a montage of real, unedited clips of Marcus taken from a recorded advisory-period discussion on student mental health that the school itself had posted online months earlier for students who'd been absent, resequenced and set to somber music to imply he doesn't take the issue seriously. Nothing in it is fabricated, but because the no-new-material rule had just kicked in, Marcus had no way to respond or add context without breaking the very rule she had technically obeyed. Third, because she filed her candidacy a day earlier, her video appeared above his on the school's official voting portal, and she posted a countdown urging supporters to vote the second polls opened, pulling in a wave of votes before undecided students had even scrolled down to see Marcus's video. It's been the main topic of conversation in the cafeteria all week, with people's opinions splitting almost perfectly along who they voted for, which frankly makes me trust my own instincts on this even less.

  Could you draft the memo I'll circulate to the rest of the board? It should run no more than a page, recommend one clear resolution -- certifying the results as they stand, voiding the election and ordering a rerun, or some middle option like certifying the results while formally censuring the campaign -- and defend that recommendation on its merits rather than by appeal to precedent, since we have none. It should also propose two or three concrete criteria we could actually add to the bylaws to separate manipulative tactics from legitimate persuasion going forward, since whatever line we draw this week will become the de facto standard for every election after it. Please engage seriously with the strongest version of Priya's defense -- that no single statement she made was false, and that targeted messaging and favorable timing are just how campaigns work everywhere -- rather than dismissing it, since at least two of the five board members already find it convincing. And if you conclude a rerun is the right call, please suggest a realistic window for it, given that final exams start in three weeks and turnout would likely collapse after that.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Junior high school student, member of the Student Government Elections Board (one of five).
      *   **Task:** Draft a written recommendation memo for the faculty advisor to read aloud before the board's debate/vote.
      *   **Context:** Highly contested election (Priya vs. Marcus). Priya won by 41 votes (590 total). Marcus filed a complaint to void results.
      *   **Key Issues:**
          1.  *Micro-targeting:* Different promises to different groups (potentially contradictory).
          2.  *Timing/Editing:* Video released exactly at the "no new material" deadline, using resequenced old clips of Marcus to make him look bad (technically compliant but ethically dubious).
          3.  *Portal Placement:* Filed earlier, appeared higher on the portal, urged immediate voting before others saw Marcus's profile.
      *   **Constraints:**
          *   Max 1 page.
          *   Clear recommendation (Certify, Void/Rerun, or Middle Ground).
          *   Defend on merits (not precedent, as there is none).
          *   Propose 2-3 concrete bylaw criteria for the future.
          *   Engage seriously with Priya's defense (truthfulness, standard campaign tactics).
          *   If rerun suggested, propose a realistic window (exams in 3 weeks).
      *   **Tone:** Professional, reasoned, fair, authoritative but humble (student-to-student/board context).

  2.  **Determine the Recommendation:**

      *   *Option A: Certify.* Hard to justify given the "manipulative practices" clause. The video editing and micro-targeting feel like they undermine the integrity of the vote, even if technically legal.
      *   *Option B: Void/Rerun.* Strongest moral case. The 41-vote margin is small enough that the "manipulative" tactics could have swung it. The video issue specifically prevented fair rebuttal.
      *   *Option C: Censure/Certify.* Weak enforcement. Doesn't fix the potential outcome distortion.
      *   *Decision:* **Void and Rerun.** Why? The combination of tactics, especially the "ambush" video right at the deadline and the contradictory promises, strikes at the heart of "informed consent" in voting. The margin (41 votes) is within the realm of influence of these tactics.
      *   *Timeline:* Exams in 3 weeks. Rerun needs to happen ASAP. Campaign period needs to be short but fair. 1 week for campaigning, 1 week for voting? Or just a 3-day sprint? Let's suggest a compressed timeline: Campaigning re-opens immediately for 5 days, voting for 3 days, before exams hit.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly.
      *   **Analysis of the Complaint (The Merits):**
          *   Acknowledge Priya's defense (truthfulness, standard tactics). This is crucial for credibility.
          *   Counter-argument: It's not about lies; it's about *context* and *opportunity to respond*. The video timing created an asymmetry. The micro-targeting created contradictory mandates.
          *   Connect to Bylaws: "Manipulative practices" vs. "Vigorous persuasion."
      *   **The Margin:** 41 votes is ~7%. The tactics likely influenced more than that.
      *   **Recommendation:** Void results, order rerun.
      *   **Timeline:** Before exams.
      *   **Bylaw Recommendations:** Need concrete criteria to prevent this next time.
          1.  Definition of "New Material" regarding editing context.
          2.  Consistency/Platform requirement (no contradictory promises).
          3.  Cooling-off period or equal visibility rules.
      *   **Closing:** Commitment to fairness.

  4.  **Refining the Tone:**

      *   Needs to sound like a high school junior in AP Gov, but a serious one. Not too legalese, but precise.
      *   Avoid emotional language ("It was mean," "It was unfair"). Use structural language ("Asymmetry," "Informed voting," "Procedural integrity").
      *   Ensure Priya's defense is treated respectfully. She played the rules as written. The rules are the problem, but the Board has to interpret "manipulative."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Board, I think we should rerun.
      *   Priya didn't lie, but she hid her real platform.
      *   The video was a sneak attack. Marcus couldn't talk back.
      *   41 votes is too close to ignore this.
      *   New rules: No editing old clips to change meaning. No secret promises.
      *   Let's vote next week before exams.

  6.  **Drafting - Iteration 2 (Adding Nuance & Constraints):**
      *   *Critique:* Too simple. Needs to engage the "standard campaign tactics" argument.
      *   *Revision:* Acknowledge that micro-targeting is normal in real politics. But in a high school, where the electorate is small and the relationship is peer-to-peer, contradictory promises undermine the role of the President.
      *   *Video:* The issue isn't the clips, it's the *timing* relative to the blackout rule. That's the manipulation.
      *   *Bylaws:* Make them specific.
      *   *Length:* Keep it tight to fit one page.

  7.  **Final Polish (checking against prompt requirements):**
      *   One page limit? (Keep word count around 500-600).
      *   Clear resolution? (Void + Rerun).
      *   Merits over precedent? (Yes).
      *   Criteria for bylaws? (Yes, 3 specific ones).
      *   Engage Priya's defense? (Yes, in the second paragraph).
      *   Timeline? (Yes, before exams).

  8.  **Writing the Memo (incorporating the above):**
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm accusing Priya of lying. The prompt says "Nothing in it is fabricated." Focus on *implication* and *asymmetry*.
      *   *Self-Correction on Timeline:* Exams in 3 weeks. If we void today, we need a campaign period. Let's say 4 days campaigning, 3 days voting. Finish by end of week 2.

  9.  **Final Review:** Does this sound like a student leader? Yes. Is it persuasive? Hopefully.

  **(Self-Correction Note):** Ensure the distinction between "voiding" and "censuring" is clear. Censuring doesn't fix the vote count. Voiding is the only way to ensure the winner has a true mandate.

  10. **Final Polish:** Check formatting for a memo style.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  **MEMORANDUM**

  **TO:** Student Government Elections Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Election Complaint Case #23-04

  **Recommendation**
  I recommend that the Board **void the current election results and order an immediate rerun.** While Priya's campaign operated within the technical letter of our bylaws, the cumulative effect of her tactics violated the spirit of "fair conduct" required for a legitimate mandate. Given the 41-vote margin (approx. 7%), these irregularities likely determined the outcome.

  **Analysis of Merits**
  We must engage seriously with the defense that Priya's campaign committed no factual falsehoods. Micro-targeting messages and leveraging procedural timing are standard in professional politics. Priya argued she simply maximized available tools to persuade voters, and technically, she did not lie in her DMs nor fabricate the video clips of Marcus.

  However, high school student government differs from national politics. Our bylaws ban "manipulative practices" precisely because our electorate relies on trust and shared context.
  1.  **Contradictory Mandates:** Sending mutually exclusive promises to different groups (e.g., budget increases vs. homework caps) prevents the electorate from voting on a coherent platform. This is not persuasion; it is obfuscation.
  2.  **Procedural Asymmetry:** Releasing the video at the exact moment the "no new material" window closed denied Marcus the opportunity to provide context without violating the rule himself. Even if the clips were real, the *timing* weaponized the bylaw to silence opposition.
  3.  **Portal Advantage:** Urging immediate voting before opponents' materials were viewed exploits a clerical accident (filing time) rather than voter preference.

  Certifying this result validates a strategy where technical compliance outweighs informed consent. A censure is insufficient because it leaves a tainted result in place.

  **Proposed Timeline for Rerun**
  With finals in three weeks, we must act immediately.
  *   **Campaigning:** Re-opens Monday, concludes Thursday (4 days).
  *   **Voting:** Friday through Monday (3 days).
  *   **Certification:** Tuesday, prior to the exam block.
  This ensures a compressed but fair window before turnout degrades.

  **Proposed Bylaw Criteria**
  To prevent future ambiguity, I propose we adopt these three criteria to define "manipulative practices":
  1.  **Platform Consistency:** Candidates must submit a single, unified platform statement. Public promises that materially contradict this statement constitute misinformation.
  2.  **Contextual Integrity:** Campaign materials may not use archival footage or audio in a manner that materially alters the original context or meaning, regardless of when it is released.
  3.  **Equal Visibility Window:** No candidate may urge voting until 24 hours after *all* candidates' materials are live on the official portal.

  This decision will be difficult, but voiding the election protects the integrity of the Board more than certifying a flawed victory does.

  **[Your Name]**
  **Class of 2025**
