answer: |-
  To argue against Michael Dummett's quarantine of Frege's logic from his politics is not to claim that the *Begriffsschrift* logically entails the expulsion of Jews from Germany. It is, rather, to demonstrate that the structural foundations of Frege's anti-psychologism and the structural foundations of his authoritarian politics share a single metaphysical commitment regarding the source of normativity. Dummett treats the diary as a moral failing external to the philosophy. The stronger claim is that the diary is the political instantiation of the very metaphysical hierarchy that secures Frege's logic.

  The continuity lies in Frege's radical separation of the **objective** (valid, immutable, binding) from the **psychological** (contingent, subjective, unstable). In logic, this distinction protects truth from human error; in politics, this same distinction protects authority from human will. If we trace the specific doctrines of anti-psychologism found in the preface to the *Grundlagen* and "Der Gedanke," we find they map precisely onto the exclusionary politics of the 1924 diary.

  ### 1. The Source of Normativity: Laws of Truth vs. Laws of Taking-to-be-True

  The central engine of Frege's anti-psychologism is articulated in the preface to the *Grundlagen* (1884). Frege distinguishes between "laws of taking-to-be-true" (*Gesetze des Fürwahrhaltens*) and "laws of truth" (*Gesetze des Wahrseins*). Psychology deals with the former: how human beings *actually* judge, which is contingent on our biological and mental constitution. Logic deals with the latter: how one *ought* to judge to attain truth, which is independent of human recognition.

  Frege writes that if logic were based on psychology, "logic would depend on anthropology and biology." Truth would become relative to the species. This horror of relativity drives his logic.

  In the 1924 diary, this same horror drives his politics. Frege attacks parliamentary democracy and universal suffrage not merely on pragmatic grounds, but on metaphysical ones. He views the "will of the people" as the political equivalent of the "laws of taking-to-be-true." It is an aggregate of subjective, contingent mental states. For Frege, a vote is a psychological event; it registers what a person *wants* or *feels*, not what is *true* or *right*.

  **The Continuity:** Just as logic cannot be grounded in the contingent mental constitution of the thinker (anti-psychologism), the State cannot be grounded in the contingent will of the electorate (anti-democracy). Both systems require a source of authority that stands *above* the human mind and commands assent, rather than deriving authority *from* the human mind via consensus. To accept Frege's logic is to accept that validity is discovered, not voted upon. His politics simply applies this epistemic hierarchy to the social order: legitimate authority must be objective (monarchical/aristocratic), not psychological (democratic).

  ### 2. The Ontology of the *Gedanke* and the Rejection of the "Private"

  In "Der Gedanke" (1918), Frege argues that a *Gedanke* (thought) is not a private mental image (*Vorstellung*). Mental images are subjective; "my pain is not your pain." If thoughts were mental images, communication would be impossible, and science would be solipsistic. Thoughts must belong to a public, objective realm that any competent mind can grasp identically.

  Frege associates the "private" with error, confusion, and the contamination of logic. The psychologist errs by confusing the objective thought with the subjective act of thinking.

  In the diary, Frege's antisemitism and nationalism function through a similar categorization of the "private" versus the "public." Frege characterizes the Jewish presence in Germany as a destabilizing element that prioritizes particularistic interests over the objective good of the Volk. He writes of Jews as having no true "fatherland," implying they operate according to a private, internal logic rather than an objective loyalty to the German state.

  **The Continuity:** The philosophical work here is the **devaluation of the subjective particular**. In logic, the "private idea" is a contaminant that must be purged to ensure the purity of the *Gedanke*. In politics, the "particular interest" (associated by Frege with liberals, democrats, and Jews) is a contaminant that must be purged to ensure the purity of the State. Frege's demand that logic be cleansed of psychological coloration is structurally identical to his demand that Germany be cleansed of political pluralism. Both require the subordination of the particular (the individual mind/the minority group) to the universal (the objective thought/the German State).

  ### 3. Grasping vs. Creating: The Passivity of the Subject

  A crucial doctrine in "Der Gedanke" is that thinkers do not *create* thoughts; they *grasp* (*fassen*) them. Thoughts exist timelessly. The thinker is passive before the truth. We are beholden to the thought; the thought is not beholden to us. This secures the objectivity of truth: it remains true even if no one believes it.

  This doctrine entails a specific posture of the subject: **submission**. The rational agent is one who recognizes their subordination to the logical order.

  Frege's political ideal, as expressed in the diary, demands the same posture of the citizen. He advocates for a monarchy where the sovereign's authority is not derived from below (the people) but stands as an objective fact to be recognized. Universal suffrage implies that the citizen *creates* legitimacy through the act of voting. Frege's model implies the citizen *recognizes* legitimacy through the act of obedience.

  **The Continuity:** The relationship between the thinker and the *Gedanke* is isomorphic to the relationship between the subject and the Sovereign. In both cases, validity flows one way: from the Objective to the Subjective. To allow the subject to determine the validity (via psychologism in logic, or suffrage in politics) is to invert the proper ontological order. Frege's hostility to the Social Democrats is not just class prejudice; it is the logical outrage of an anti-psychologist watching people treat objective authority as if it were a matter of subjective preference.

  ### 4. Purity and the Threat of Contamination

  Finally, we must look at the motivation for anti-psychologism. Frege fears that if psychology enters logic, logic loses its normative force. It becomes "hostage," as your prompt notes, to the contingent. The boundary between logic and psychology must be hermetically sealed.

  In the diary, Frege expresses a parallel fear regarding the German nation. He views the admixture of Jews, Catholics, and foreigners as a dilution of German essence. He proposes stripping Jews of civil rights and expelling them to restore the integrity of the political body.

  **The Continuity:** The operative doctrine here is **systemic purity**. For Frege, a mixed system (logic + psychology) is a broken system. It yields no truth. Similarly, a mixed polity (Germans + "alien" elements) is a broken state. It yields no order. The rigorous, exacting prose Frege uses to dismiss bad definitions is the same tool he uses to dismiss human beings. In both cases, the "other" (the psychological/the Jew) is treated as a category error that threatens the coherence of the system. The exclusion is not merely emotional; it is presented as a necessary condition for the system's functionality.

  ### Conclusion

  Dummett wishes to save Frege's logic by isolating it from his life, treating the diary as a tragic blemish on a rational mind. But this assumes that Frege's rationality was purely procedural. The argument above suggests that Frege's rationality was substantive: it was a commitment to an objective order that transcends human will.

  The 1924 diary is not a departure from Frege's philosophy; it is its shadow. The same drive that compelled Frege to purge the "psychological" from logic to save it from relativity compelled him to purge the "democratic" from politics to save it from chaos. If the laws of truth cannot be subject to a vote, why should the laws of the land be? To accept Frege's anti-psychologism is to accept a world where validity is hierarchical, objective, and exclusive. The diary shows us what happens when that worldview is applied not just to numbers, but to people. Dummett's quarantine fails because the virus is not in the biography; it is in the logic.
