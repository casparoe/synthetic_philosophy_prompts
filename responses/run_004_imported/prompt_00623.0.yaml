answer: |-
  This is a profoundly difficult position to be in, and it is compounded significantly by your training. You are navigating the intersection of intimate friendship and clinical knowledge, a place where the tools of your profession can sometimes become obstacles to your personal life.

  Your labmates are offering a heuristic that works in legal or strictly diagnostic contexts (determine liability), but it fails in the context of human relationships, particularly those involving addiction. Their advice assumes that responsibility is a binary switch: either he is an agent who chose this, or he is a patient to whom this happened.

  The short answer to your core question is: **It is entirely coherent to relate to him both ways, and your oscillation is not a failure of resolve. It is a rational response to a complex reality.** The problem isn't that you haven't decided which lens to use; the problem is that neither lens, used exclusively, captures the truth of the situation or protects your well-being.

  Here is a framework for thinking about this that might help you integrate these conflicting modes without burning out or becoming resentful.

  ### 1. Distinguish Causal Responsibility from Relational Responsibility
  In clinical training, we often focus on *causal* responsibility (etiology). *Why* did Marco miss the wedding? *Why* did he say those cruel things? The answer is: Alcohol Use Disorder (AUD), neurobiological hijacking of impulse control, and craving. In this domain, holding him "morally responsible" in a punitive sense is indeed unscientific. The disease model explains the mechanism.

  However, friendship operates on *relational* responsibility. This asks: *Who owns the impact? Who is tasked with the repair?*

  Even if the *cause* of the behavior was a disruption of judgment due to addiction, Marco remains the only agent capable of making amends. You can hold two truths simultaneously:
  1.  **Truth A:** The addiction compromised his volition in the moment (Causal).
  2.  **Truth B:** He is the one who must face the consequences and do the work to rebuild trust (Relational).

  When you swing into "Clinical Mode," you are focusing on Truth A to protect yourself from pain. When you swing into "Resentment Mode," you are focusing on Truth B to protect your boundaries. You need both. If you only have Truth A, you become an enabler or a case manager. If you only have Truth B, you become a judge.

  ### 2. The "Clinical Gaze" as a Defense Mechanism
  You noted that when you view him as a patient, his apologies feel like "symptoms to note." This is a very common defense mechanism for clinicians and trainees dealing with loved ones' pathologies. We call this **intellectualization** or **professional detachment**.

  It feels safer to view his cruelty as a "symptom of AUD" than as "Marco hurting me." If it's a symptom, it isn't personal. If it isn't personal, it can't wound you as deeply.

  However, this mode is unsustainable in friendship because friendship requires **mutuality**. A patient does not need to be mutually vulnerable with a therapist; a friend does. If you suppress your hurt by categorizing it clinically, you are effectively withdrawing from the friendship. You aren't "failing to make up your mind"; you are instinctively putting on armor when the pain gets too high. That is a signal that you need boundaries, not that you need to decide on his culpability.

  ### 3. Re-evaluating the "Choice" Observation
  You mentioned that friends observe him making choices (choosing the bar over the wedding). This aligns with modern models of addiction that view it not as a total loss of agency, but as a **pathological prioritization**.

  He is not a robot programmed to drink. He is a human making choices within a narrowed horizon of options where the urge to drink outweighs other values *in that moment*. Acknowledging this is crucial. It means that while the *drive* is pathological, the *action* still flows through his agency.

  Therefore, it is not "unfair" to hold him responsible for the preparation and the aftermath. He may not have been able to stop drinking once the craving peaked (depending on the severity), but he is responsible for the sober choices that led to the vulnerability (e.g., keeping alcohol in the house, going to high-risk environments, not calling a sponsor).

  ### 4. A Principled Framework for Interaction
  Instead of trying to decide "Is he responsible?", try deciding "What is my capacity?" Here is a way to structure your relating to him that honors both your friendship and your sanity:

  **A. Separate the Person from the Behavior (Without Dehumanizing)**
  You can love Marco while hating the behavior. When he is sober and self-aware, relate to Marco. When he is drinking or dealing with the fallout, relate to the *situation*.
  *   *Incoherent:* "He didn't mean it, it's the alcohol." (Dismisses your hurt).
  *   *Coherent:* "I know the alcohol drove this, but I was still hurt by it, and I need him to address the hurt, not just the alcohol."

  **B. Resentment as Data, Not Sin**
  You mentioned feeling "plainly resentful" some weeks. In a clinical context, we might pathologize counter-transference. In a friendship, resentment is a **boundary signal**. It tells you that a line has been crossed.
  *   Do not try to talk yourself out of resentment using your clinical knowledge. ("I shouldn't feel this way, I know how addiction works.")
  *   Instead, listen to it. ("I feel resentful because I need reliability, and that is currently unavailable.")
  *   This allows you to set boundaries without needing to condemn him morally. "I cannot attend events with you if you have been drinking," is a boundary based on your needs, not a judgment on his soul.

  **C. The "Repair" Standard**
  Make the metric of the friendship not *abstinence*, but *repair*.
  *   Relapse may happen.
  *   Hurtful behavior may happen.
  *   **The Deal:** When it happens, the "Clinical Mode" explains *why*, but the "Friend Mode" dictates *what happens next*.
  *   If his apologies feel like "symptoms," it may be because they are focused on guilt management (him feeling better) rather than restitution (you feeling safer). A genuine repair involves asking: "What do you need from me to feel safe again?" rather than "Please forgive me so I know I'm a good person."

  ### 5. Managing the "Case Manager" Drift
  You are worried about becoming his case manager. This happens when you take responsibility for his recovery.
  *   **Check:** Are you monitoring his drinking? Are you reminding him of meetings? Are you soothing his guilt?
  *   **Correction:** If yes, step back. You can be a friend who supports sobriety without being a stakeholder in it. His recovery is his responsibility. Your responsibility is your own emotional safety.

  ### Summary
  You are not failing to make up your mind. You are correctly perceiving that Marco is both a **moral agent** (your friend) and a **biological patient** (someone with a disorder).

  *   **When to use the Clinical Lens:** When trying to understand *why* it happened, to depersonalize the attack, and to cultivate empathy for his struggle.
  *   **When to use the Friend Lens:** When determining *consequences*, setting boundaries, and evaluating whether the relationship is currently safe for you.

  It is coherent to say: *"I understand scientifically why you did this, and I forgive you for the intent. But I am still hurt by the impact, and I need to step back until I feel safe."*

  This allows you to keep your empathy without sacrificing your self-respect. It acknowledges the illness without absolving the agent. And it protects you from the burnout of trying to be his therapist, which ultimately helps neither of you.
