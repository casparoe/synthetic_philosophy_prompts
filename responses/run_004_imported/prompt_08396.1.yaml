      *   *Clarify "Mythology":* Explain that Wittgenstein doesn't mean "fake." He means "foundational story." It's not verified *within* the system; it *makes* verification possible.
      *   *Clarify "Game Rules":* Use the chess analogy. You don't prove how the knight moves; you just play. But the fact we play chess and not some other game is historical/biological.
      *   *Resolve the Tension (Chosen vs. Given):* Distinguish between *individual choice* (I can't choose my hinges) and *historical contingency* (Humanity could have developed differently). The professor is right about the individual; Wittgenstein is right about the system's origin.
      *   *Tackle Relativism:* This needs nuance. He's not a radical relativist (truth still exists *within* the system). But he denies a "View from Nowhere." Use the "riverbed" analogy (later in the book) to help explain fluidity over time.
