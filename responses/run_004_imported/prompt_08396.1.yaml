answer: |-
  This is a fantastic catch. You have put your finger on exactly the tension that makes *On Certainty* so difficult and so rewarding. You aren't misreading it; you're spotting the central interpretive problem of the book.

  Your professor is emphasizing the **internal necessity** of hinges (for *me*, right now, they aren't chosen), while the text seems to emphasize the **external contingency** of hinges (for *humanity*, historically, they look like a "mythology" or "game").

  Here is a way to reconcile these two ideas without making Wittgenstein inconsistent, and how to handle the relativism worry.

  ### 1. "Mythology" doesn't mean "False"
  When W. calls the world-picture a "mythology," he is not saying it is a lie or a superstition (like believing the earth is flat). He is using "mythology" to describe a **foundational narrative that is not itself subject to verification.**

  In a myth, you don't ask for evidence for the gods; the gods are the background against which events make sense. Similarly, for W., propositions like "The earth has existed for many years" or "Objects don't vanish when I look away" are not things I have tested. They are the *medium* in which testing happens.

  *   **Reconciliation:** Calling it a mythology highlights that it is **not empirical knowledge.** It looks like knowledge (it's a proposition), but it functions like a myth (it's the background). This supports your professor: you don't "choose" a myth; you inherit it.

  ### 2. The "Game Rules" Analogy: Contingent vs. Arbitrary
  This is the key to your "arbitrary" worry. Wittgenstein often uses game analogies to show that rules are **constitutive**, not **descriptive**.

  *   **Inside the game:** The rule "the bishop moves diagonally" is not "up for grabs." If you move it straight, you aren't playing chess badly; you aren't playing chess. In this sense, the rules are fixed. (This is your professor's point).
  *   **Outside the game:** Why do we play chess and not a game where the bishop moves like a knight? That is historical and contingent. We could have developed a different game. (This is the "mythology" point).

  **So, is it arbitrary?**
  No. "Arbitrary" implies I could wake up tomorrow and decide my hinge is "I am a teapot." Wittgenstein would say: No, you can't. Your hinges are anchored in your **form of life** (your biology, your community, your actions).
  However, they are **contingent**. It is not a *logical necessity* that humans have the hinges we have. If we were a different species, or lived in a radically different environment, our "rules of the game" (hinges) might be different.

  **The Synthesis:** The system is not arbitrary *for us*, but the fact that *this* is our system is not metaphysically necessary.

  ### 3. The Relativism Trap
  Does this make him a relativist? This is the biggest debate in *On Certainty* scholarship. Here is the nuanced view you can take to class:

  **The Relativist Reading:**
  If hinges are like "game rules," and different cultures play different games, then there is no neutral ground to say one world-picture is "true" and another is "false." If a community's hinge is "Spirits cause illness," and ours is "Germs cause illness," we can't prove them wrong using our hinges, because they don't accept our hinges.

  **The Naturalist Reading (The Counter-Argument):**
  Wittgenstein pushes back against radical relativism by grounding hinges in **action**, not just belief. He often points out that we all share a human form of life. We all get hungry, we all fall if we jump off a cliff, we all reach for objects.
  *   **Quote to keep in mind:** Later in the book (§559), he says, "It is not only certain premises that are common to us, but the *conclusions* too... we agree in the *actions*."

  **The Verdict:**
  He is not a "anything goes" relativist. He is a **pluralist about frameworks, but a naturalist about foundations.**
  *   He admits our framework isn't the *only possible* one (anti-dogmatism).
  *   But he insists our framework is grounded in shared human behavior, so it's not *purely* subjective (anti-skepticism/relativism).

  ### 4. How to read those specific passages in context

  **Passage 1:** *"But I did not get my picture of the world by satisfying myself of its correctness..."*
  *   **Meaning:** Epistemic justification stops somewhere. You can't verify everything, or you'd need an infinite regress of proofs. The "world-picture" is the place where justification stops. It is **animal**, not rational.
  *   **For your seminar:** This supports the idea that hinges are **pre-rational**. We don't choose them via reason; we find ourselves with them.

  **Passage 2:** *"The propositions describing this world-picture might be part of a kind of mythology. And their role is like that of rules of a game..."*
  *   **Meaning:** The *status* of these propositions is different from ordinary facts. "Here is a hand" looks like an empirical fact, but its *role* is grammatical (like a rule).
  *   **For your seminar:** This supports the idea that hinges are **functional**. They aren't "true" in the same way "it is raining" is true. They are "true" in the way "the king moves one square" is true.

  ### Summary for your Seminar
  If you want to impress your prof, you can frame your question like this:

  > "I'm struggling with the modal status of hinges in §94-95. On one hand, Wittgenstein says the world-picture is 'inherited,' which suggests it's fixed for us (not chosen). But by calling it a 'mythology' and comparing it to 'game rules,' he seems to suggest it's contingent—it could have been otherwise.
  >
  > Is the point that hinges are **locally necessary** (I can't doubt them within my form of life) but **globally contingent** (humanity could have had a different form of life)? And if so, does that contingency open the door to relativism, or does our shared 'human form of life' block that?"

  **The Short Answer:**
  Wittgenstein is saying: **We don't choose the rules, but the fact that we are playing *this* game is an accident of history/biology.** That isn't inconsistency; it's the difference between *playing* the game (where rules are fixed) and *observing* the game (where we see it's just one of many possible human activities).

  He isn't a relativist in the sense that "all truths are equal," but he is a relativist in the sense that "rationality is internal to a system." You can't judge a system from the outside, because you need a system to judge with.
