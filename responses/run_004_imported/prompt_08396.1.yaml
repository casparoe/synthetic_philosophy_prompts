prompt: |-
  hey so for my epistemology seminar we're on the On Certainty unit and i got stuck on a passage, wondering if u can help me actually get what's going on. it's from somewhere around §94-95 (no numbers on the scan my prof gave us so i might have the numbering wrong):

  "But I did not get my picture of the world by satisfying myself of its correctness; nor do I have it because I am satisfied of its correctness. No: it is the inherited background against which I distinguish between true and false."

  "The propositions describing this world-picture might be part of a kind of mythology. And their role is like that of rules of a game; and the game can be learned purely practically, without learning any explicit rules."

  so my prof keeps stressing that hinge propositions aren't things we chose, they're not "up for grabs," they're just what our practices happen to turn on. but then here W. calls the world-picture "mythology" and compares it to the rules of a game, which sounds like he's saying its basically arbitrary, like it could've gone totally differently?? those two ideas feel like they're pulling in opposite directions to me. is he being inconsistent, or is there a way to read "mythology"/"rules of a game" here that doesn't actually mean arbitrary? also, does this passage make him some kind of relativist about our most basic certainties, or not - that's the bit i really can't figure out.
reasoning: |-
