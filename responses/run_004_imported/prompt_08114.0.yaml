answer: |-
  You have hit on one of the most famous and persistent headaches in the philosophy of science. You are absolutely correct: this is **Glymour's Problem of Old Evidence** (1980), and the General Relativity (GR) / Mercury perihelion case is the canonical example.

  Your intuition is spot on: strict, textbook Bayesianism implies that if $P(E) = 1$ (the evidence is already known), then $P(H|E) = P(H)$. The evidence cannot confirm the hypothesis. Yet, historically, Mercury's orbit was the "smoking gun" that convinced physicists Einstein was onto something real.

  Here is the breakdown of how Bayesians have tried to patch this, and—more importantly for you—how you should weigh "retrodictions" vs. "predictions" when evaluating scientific claims.

  ### 1. Have Bayesians "Patched" the Hole?
  The short answer is: **They have proposed workarounds, but there is no consensus on a single "fix."** It remains a live debate. However, three main strategies have emerged that restore the intuitive result that GR *was* confirmed by Mercury.

  *   **The Counterfactual (Ur-Prior) Approach:** This suggests we should evaluate confirmation not against our *actual* current beliefs (where $P(E)=1$), but against a counterfactual state of ignorance. We ask: "If we *didn't* know about Mercury's anomaly, how much would learning GR increase our expectation of that anomaly?" Since GR makes Mercury's orbit highly probable and Newtonian physics does not, GR gets the confirmation boost.
  *   **The "Learning the Entailment" Approach (Garber/Jeffrey):** This is the most technical but arguably most robust fix. It argues that we aren't updating on the evidence $E$ (Mercury's orbit), which we already knew. We are updating on the **logical connection** between $H$ and $E$. Before 1915, $P(\text{GR} \rightarrow \text{Mercury})$ was unknown. When Einstein derived the field equations, we learned that GR *entails* the correct precession. We update our credence in GR because we learned a new logical fact, not a new empirical fact.
  *   **Comparative Confirmation:** Confirmation isn't absolute; it's relative. We don't ask "Does $E$ increase the probability of GR?" We ask "Does $E$ favor GR over Newton?" Since Newton (even with fudge factors like the hypothetical planet Vulcan) struggled to explain $E$, and GR explained it naturally, the *ratio* of probabilities shifts heavily toward GR.

  ### 2. Implications for Weighing Scientific Claims
  So, next time a scientist says, "Our new model explains [Known Phenomenon X]," should you be suspicious?

  **Yes, but with nuance.** Here is your heuristic for distinguishing "deep explanation" from "curve fitting."

  #### A. The Risk of Accommodation (Be Suspicious)
  In machine learning and statistics, this is **overfitting**. If I give you a dataset of the last 100 stock prices and ask you to build a model, you can build a polynomial equation that fits those 100 points perfectly ($R^2 = 1$). It "explains" all the old evidence. But it will fail miserably on day 101.
  *   **The Red Flag:** If the model has many free parameters that were tuned specifically to match the old data, the "explanation" is cheap. In Bayesian terms, the prior probability of such a gerrymandered theory is low, so even a good fit doesn't raise the posterior probability much.
  *   **The Rule:** Suspect claims where the theory was *constructed* to fit the data (accommodation) rather than data that *fell out* of the theory (prediction).

  #### B. The Value of Resolving Anomalies (Don't Dismiss)
  However, the Mercury case shows that old evidence *can* be powerful. Why? Because Mercury wasn't just "data on the books"; it was a **stubborn anomaly**.
  *   **The Green Flag:** If the old evidence was previously considered a problem, a bug, or an unexplained outlier for the *prevailing* theory, and the new theory explains it naturally without new free parameters, that is strong confirmation.
  *   **Why:** This falls under the "Comparative Confirmation" patch. The new theory isn't just fitting data; it is surviving a test that killed its predecessor. It suggests the new theory has captured the underlying causal structure, not just the surface pattern.

  #### C. Use-Novelty vs. Explanatory Depth
  Philosophers distinguish between **Use-Novelty** (the evidence was unknown when the theory was made) and **Explanatory Depth** (the theory unifies disparate phenomena).
  *   **Prediction (Use-Novelty):** High risk for the scientist. If they are wrong, they are falsified. This is the gold standard for trust.
  *   **Retrodiction (Old Evidence):** Lower risk. But if the retrodiction unifies two previously unrelated old facts (e.g., GR explaining both Mercury's orbit *and* the bending of starlight), it gains "extra credit" through unification, even if the data is old.

  ### 3. Practical Advice for Your Rabbit Hole
  When you hear a scientist claim their model "explains" existing data:

  1.  **Ask about the parameters:** Did they have to tune 10 knobs to get the old data to fit? If so, discount the claim.
  2.  **Ask about the rivals:** Did the previous theory fail to explain this specific data point? If the new theory succeeds where the old one choked, treat it as significant confirmation (the GR/Mercury scenario).
  3.  **Ask about derivation:** Did the data fall out of the core postulates (like Einstein's field equations), or was it added as a patch?
  4.  **Demand a "Mercury":** If they only have retrodictions, ask: "What is the *new* prediction that distinguishes you from the old model?" If they can't name one, the theory might be empirically equivalent to the old one, making it a philosophical preference rather than a scientific advance.

  ### Summary
  You are right to be skeptical of **accommodation** (fitting data to a model), but you should not dismiss **explanation** (deriving data from a model).

  The Bayesian "hole" hasn't been perfectly patched in a way that satisfies all philosophers, but the consensus among working scientists is pragmatic: **Old evidence confirms a theory if and only if the theory explains it *better* than the alternatives, without ad-hoc adjustments.**

  Einstein didn't tweak GR to fit Mercury; Mercury fit GR because the geometry of spacetime demanded it. That is the difference between a curve-fit and a discovery. Look for that distinction.
