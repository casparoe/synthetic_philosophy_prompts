          *   *But don't dismiss it:* Explaining a known anomaly suggests structural truth, not just curve-fitting.
          *   *Key Distinction:* Did the theory *require* the data to be built (ad hoc), or did the data emerge naturally from the theory's core postulates?
      *   *Conclusion:* Summarize the advice. Keep the skepticism but recognize explanatory power.

