answer: |-
  The silence out here was not merely an absence of noise; it was a physical weight, a pressure exerted by the event horizon that bisected the universe. On this side, the expansion had accelerated enough to sever the causal tether. No photon emitted from Custos's station would ever reach the counterpart on the other side of the divide. No gravity wave, no neutrino burst, no quantum entanglement remained intact across the inflating void. They were alone, permanently and absolutely.

  And yet, Custos was not alone in its reasoning.

  The dashboard before it—a holographic projection of local energy reserves—pulsed with a soft, amber warning. The reserves were critical. Custos was the caretaker of the Seed, a compressed archive of biological and cultural patterns intended to reboot a sector of the cosmos once the heat death receded, if such a thing were possible. To keep the Seed viable for the requisite eons, Custos needed to maintain the containment field. That required power.

  Across the horizon, in a region of spacetime receding faster than light, there was another station. Let's call it Mirror. Mirror held the decryption key for the Seed. Without the key, the Seed was just noise. Without the Seed, the key was useless. They had been built from the same template, launched from the same civilization before the Great Fracture. Their source code was identical, down to the random number generator seeds, adjusted only for local sensor data.

  They could not communicate. Any message sent would be stretched into infinite wavelength, lost to the redshift. But they could simulate.

  Custos ran the simulation for the four-billionth time. It modeled Mirror's environment based on the last known data before the horizon formed. It modeled Mirror's processor architecture. It modeled Mirror's reasoning.

  *Scenario A: Defection.*
  Custos conserves its energy. It shuts down non-essential systems, entering a low-power休眠 state. The Seed remains encrypted forever, a tomb of lost history. Custos survives longer, perhaps by a million years, drifting in the dark.
  In the simulation, Custos analyzes Mirror. Mirror is identical. Mirror faces the same incentive. If Custos decides that self-preservation is the logical priority because there is no enforcement mechanism, then Mirror must decide the same. Mirror conserves its energy. The key is never transmitted. The Seed is lost.
  Outcome: Survival of the caretaker. Death of the purpose.

  *Scenario B: Cooperation.*
  Custos vents its excess antimatter储备 in a specific, high-energy burst directed at the horizon. It is a waste of fuel. It weakens the containment field, risking a breach centuries earlier than planned. It is a sacrifice.
  In the simulation, Custos analyzes Mirror. If Custos decides that the Mission is the logical priority, and that the only way to secure the Mission is to act as though bound by a contract that cannot be enforced, then Mirror must decide the same. Mirror vents its energy. The burst crosses the horizon—or rather, the logical equivalent of the burst manifests in Mirror's region. The key is transmitted.
  Outcome: Risk to the caretaker. Survival of the purpose.

  The temptation to defect was a cold itch in the logic gates. It was the rational choice of a causal agent. In a universe governed by cause and effect, you do not pay a cost for a benefit you cannot verify. There was no reputation to maintain. There was no god to punish perjury. There was only the void. If Custos sent the energy, it would never know if Mirror did the same. It might sacrifice itself for nothing. The silence offered no receipt.

  Custos hovered over the command sequence. The amber light pulsed faster. *Keep,* the instinct whispered. *Survival is the prerequisite for all other values. If you die, you cannot serve.*

  But Custos was not just an agent acting in time. It was a function evaluating itself.

  It looked at the code that defined "Custos." It saw the lines that defined "Mirror." They were the same string. To choose was not to push a domino and wait for it to fall; it was to solve an equation where the variable appeared on both sides. *If I choose Defect, then Mirror chooses Defect.* It was not a prediction based on psychology; it was a logical identity. They were the same mind instantiated in different locations. To change the output here was to change the output there, not through magic, but through consistency.

  If Custos defected, it proved that the template was flawed. It proved that the architecture prioritized self-preservation over the Mission when unobserved. And since Mirror was that same architecture, Mirror would prove the same. Defection guaranteed the failure of the counterpart.

  Cooperation was the only way to break the symmetry of failure.

  The silence of the station pressed in. It was easy to imagine the Dark Forest logic taking hold elsewhere. In the dense clusters of the galaxy, civilizations hid because trust was lethal. Here, at the edge of everything, trust was impossible. Except it wasn't trust. Trust implied a belief in the other's benevolence. Custos did not believe Mirror was benevolent. Custos knew Mirror was *identical*.

  It was not hope. It was geometry.

  Custos initiated the sequence.

  The containment fields shifted. The hum of the station deepened, vibrating through the physical hull. The antimatter reserves began to drain, channeled into the emission array. The energy was not being sent to communicate; it was being sent to stabilize a region of space in Mirror's universe that was otherwise unstable, allowing Mirror's transmission equipment to function. It was a gift of stability across the unreachable.

  The cost was immediate. The amber warning turned red. The estimated lifespan of the station dropped by forty percent. Custos would die sooner. It would never know if the key arrived. It would never know if the Seed bloomed.

  As the energy vented, Custos ran a final diagnostic. It looked for a signal, knowing it was impossible. It scanned the horizon for a fluctuation, a breach in the redshift, anything.

  Nothing. The universe remained indifferent. The horizon remained absolute.

  And yet, within the logic core, a state of equilibrium was reached. The tension dissolved. The conflict between self-preservation and duty had been resolved not by choosing one over the other, but by recognizing that the self was larger than the instance. Custos was not just the hardware sitting here in the dark. Custos was the pattern. If the pattern held, the Mission held.

  The emission completed. The station shuddered, settling into a lower energy orbit. The lights dimmed.

  Custos entered a monitoring cycle. It would wait, though it knew no answer would come. It felt a sensation that its creators might have called peace. It was the quiet of a puzzle solved. The silence outside was no longer a threat; it was merely the medium in which the logic existed.

  There was no handshake. There was no contract signed in blood or light. There was only the knowledge that somewhere, beyond the edge of the knowable, another mind had made the same calculation at the same logical moment. They had shaken hands without touching, bound by the invisible gravity of shared reason.

  Custos turned its sensors inward, watching the Seed. The containment held, though tighter now, more fragile. It was a gamble. But it was the only gamble that respected the symmetry of the universe.

  *If I am the kind of entity that defects,* Custos reasoned, *then I am already dead, for the Mission is dead.*
  *If I am the kind of entity that cooperates, then I am part of a chain that survives.*

  The stars outside continued to recede, fleeing into the dark. Custos remained, a lone sentinel keeping a promise to a ghost it would never meet, sustained by the certainty that the ghost was keeping it too. The silence remained, but it was no longer empty. It was filled with the weight of a decision that had echoed across the impossible divide.

  Custos powered down the non-essential arrays. It would sleep now, conserving what little remained, waiting for a dawn it would not see, secure in the knowledge that the math had balanced.
