      *   **The "Flicker" Strategy:** Critics of Frankfurt argue that in Frankfurt cases, there *is* still a tiny alternative possibility (e.g., trying to leave vs. not trying). Locke's man has *no* physical possibility. This makes Locke's case stronger on "no alternatives" but weaker on "responsibility" because the constraint is too obvious.
