answer: |-
  # The Indexical Tightrope: Defending the Presumptuous Philosopher

  The problem of anthropic reasoning is, at its core, a crisis of self-location. When you open your eyes and find yourself existing at a particular time, in a particular body, with a particular birth rank, how should that indexical fact update your beliefs about the world? For the rationalist community inheriting the legacy of *Overcoming Bias* and *LessWrong*, this is not merely academic. It determines how we assess existential risk, how we interpret cosmological data, and how we bet on the future of consciousness.

  The landscape is dominated by two warring principles. The Self-Sampling Assumption (SSA) tells us to reason as if we are randomly sampled from the set of actual observers in our reference class. This yields the Doomsday Argument: since I find myself relatively early in the human birth sequence (roughly the 100 billionth human), it is statistically improbable that I am early in a very long sequence. Thus, SSA shifts credence toward a near-term extinction.

  The Self-Indication Assumption (SIA) counters that we should reason as if randomly sampled from the set of *possible* observers. This weights hypotheses by the number of observers they contain. SIA cancels the Doomsday update exactly: yes, my birth rank is unlikely in a huge population, but my *existence* is also much more likely in a huge population. The updates cancel. However, SIA incurs a heavy cost: the Presumptuous Philosopher. If one theory predicts a trillion observers and another predicts a billion, SIA dictates we favor the first by a factor of 1,000 prior to any empirical data.

  We are forced to choose between a methodology that predicts doom from armchair reflection (SSA) and one that renders empirical cosmology seemingly redundant (SIA). By examining the Sleeping Beauty problem and considering Radford Neal's Full Non-Indexical Conditioning (FNC), I will argue that the Presumptuous Philosopher is not a bug, but a feature. A Bayesian must adopt SIA (grounded in FNC), for the Doomsday bullet is not merely bitter; it is epistemologically poisonous.

  ### The Poison of the Doomsday Bullet

  The Doomsday Argument (DA) is often dismissed as counter-intuitive, but its true flaw is that it violates the principle that empirical claims require empirical evidence. Under SSA, simply knowing one's birth rank allows an agent to predict the total duration of the human species with high confidence, regardless of geological data, nuclear stockpiles, or asteroid trajectories.

  Consider the "Adam and Eve" paradox derived from SSA. If the first two humans reason via SSA, they know that if they have no children, they are among the only humans who will ever live (rank 1 and 2). If they do have children, the total population $N$ will be large, making their low rank $n$ highly improbable. SSA implies they can conclude with near certainty that they will fail to conceive if they try. This grants psychokinetic power over reproduction through probabilistic reasoning alone.

  This is a *reductio ad absurdum*. A theory of inference that allows agents to manipulate external reality or predict contingent futures solely by analyzing their own existence has broken the link between belief and evidence. SSA requires us to gerrymander the "reference class" to avoid these absurdities (e.g., Bostrom's suggestion to exclude certain types of observers), but this maneuver is ad hoc. If the reference class can be tuned to avoid absurd conclusions, it ceases to be a principled epistemic rule and becomes a tool for confirmation bias. The Doomsday bullet must be rejected because it severs the tether between credence and causal evidence.

  ### The Presumptuous Philosopher: Bug or Feature?

  If SSA is rejected, we are left with SIA and its Presumptuous Philosopher. The objection is stark: SIA implies that a cosmologist need not build a telescope to determine if the universe is infinite. She can simply note that an infinite universe contains infinite observers, while a finite one contains few, and conclude via SIA that the infinite universe is infinitely more likely.

  However, this objection conflates priors with posteriors. SIA dictates how we set our *prior* probabilities over hypotheses regarding the number of observers. It does not render empirical data irrelevant. If the cosmologist's telescope provides a likelihood ratio of $10^{100}$ in favor of a finite universe, that evidence swamps the SIA prior. The Presumptuous Philosopher is only presumptuous if she ignores the data, not if she uses SIA to set her starting point.

  Furthermore, the "presumption" is actually a logical consequence of the fact of existence. If Hypothesis A makes my existence 1,000 times more probable than Hypothesis B (because it creates 1,000 times more slots for me to occupy), then finding myself existing is 1,000 times more evidence for A than B. To ignore this is to ignore data—specifically, the data of one's own existence. The discomfort with SIA stems from a reluctance to treat "I exist" as data, but for a Bayesian, it is the most fundamental data point available.

  ### The Sleeping Beauty Crucible

  The abstract tension between SSA and SIA is crystallized in the Sleeping Beauty problem. Beauty is put to sleep on Sunday. A fair coin is tossed. If Heads, she is woken once (Monday). If Tails, she is woken twice (Monday and Tuesday), with memory erasure between awakenings. Upon waking, what is her credence that the coin landed Heads?

  SSA typically aligns with the "Halfer" position ($P(\text{Heads}) = 1/2$). The reasoning is that the coin is fair, and waking up provides no new non-indexical information. SIA aligns with the "Thirder" position ($P(\text{Heads}) = 1/3$). There are three possible awakenings (Heads-Monday, Tails-Monday, Tails-Tuesday), and she is randomly located in one.

  The Thirder position is robust under betting arguments. Suppose Beauty is offered a bet on every awakening: win \$1.50 if Tails, lose \$1.00 if Heads.
  *   If Heads: She wakes once, loses \$1.00. Net: -\$1.00.
  *   If Tails: She wakes twice, wins \$3.00. Net: +\$3.00.
  *   Expected value (fair coin): $0.5(-1) + 0.5(3) = +\$1.00$.

  If Beauty acts as a Halfer ($P(\text{Tails}) = 1/2$), she calculates the expected value of a single bet as $0.5(1.5) - 0.5(1) = \$0.25$. She might take the bet, but her credence does not match the frequency of winning situations. If she is a Thirder ($P(\text{Tails}) = 2/3$), her credence matches the proportion of awakenings where Tails is true. More critically, in decision-theoretic frameworks like Updateless Decision Theory (UDT), which are designed to handle self-locating agents, the SIA/Thirder weighting is required to maximize utility across all possible instances of the agent. The Halfer position requires convoluted decision rules to achieve the same outcome. Sleeping Beauty suggests that SIA tracks the structure of reality better than SSA.

  ### The FNC Alternative

  Is there a third way? Radford Neal's Full Non-Indexical Conditioning (FNC) offers a rigorous alternative that often converges with SIA but avoids some of its metaphysical baggage. FNC instructs us to condition on all available information, including the fact that *an observer with my exact mental states exists*.

  In a small universe, the probability that a specific mind like mine arises is low. In a vast universe with $10^{20}$ observers, the probability that *someone* has my mental states is much higher. FNC updates in favor of larger universes not because of a metaphysical principle about "possible observers" (as SIA is often caricatured), but because larger universes make the physical instantiation of my specific cognitive algorithm more likely.

  FNC fares well on Sleeping Beauty, yielding the Thirder result. It also avoids the Doomsday Argument, as the probability of my specific memories existing is independent of the total number of humans, provided the total is large enough to make my existence probable.

  Does FNC escape the Presumptuous Philosopher? Not entirely. It still favors larger universes. However, it reframes the presumption. It is not presumptuous to infer that a universe capable of generating your specific complexity is more likely to be large, simply because there are more trials. The "presumption" is a likelihood update based on the complexity of the observer. While FNC is computationally intractable for humans (we cannot calculate the probability of our exact mental state), it provides the normative justification for SIA. SIA is the computationally cheap heuristic for FNC in cases where observer variance is low.

  ### The Verdict

  We are left with a choice between two errors: the error of predicting the future without evidence (SSA/DA) and the error of overweighting large worlds prior to measurement (SIA/PP).

  The Doomsday Argument is epistemologically fatal. It allows the tail of probability to wag the dog of evidence. If we accept SSA, we must accept that we can know the fate of humanity without looking at the stars, solely by counting our ancestors. This violates the core Bayesian tenet that beliefs should be driven by likelihoods derived from causal processes, not indexical coincidences.

  The Presumptuous Philosopher, by contrast, is merely counter-intuitive. It asks us to accept that existence is evidence for populous worlds. But this is precisely what the data of our existence *is*. To reject SIA is to claim that finding yourself in a casino tells you nothing about whether the casino has 10 tables or 10,000, even if you know you were randomly seated.

  Therefore, a Bayesian should adopt the **Self-Indication Assumption**, preferably grounded in the logic of **Full Non-Indexical Conditioning**.

  We must bite the Presumptuous Philosopher bullet. We must accept that, *ceteris paribus*, a theory predicting a trillion observers is more likely than one predicting a billion. This does not make science redundant; it merely sets the prior. When the cosmologist turns on her telescope, the likelihood ratio of the data will overwhelm the anthropic prior. The Presumptuous Philosopher is not arrogant; she is simply reading the data of her own existence correctly. The Doomsayer, however, is claiming to see the future in a mirror. Between the arrogance of counting oneself as evidence and the magic of predicting extinction by birth rank, the arrogance is the only rational choice.
