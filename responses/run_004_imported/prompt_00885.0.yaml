answer: |-
  **Setting:** *The hotel bar at the APA Eastern Division. It's 11:30 PM. The air smells of stale beer and damp wool. Two name tags rest on the sticky table: **ALEX** (Conciliationist) and **BEN** (Steadfaster). They are halfway through their second drinks.*

  **Ben:** (Swirling his whiskey) I still think you got off easy in the Q&A. The moderator let that slide way too fast.

  **Alex:** (Rubbing her temples) The "self-defeat" objection? Come on, Ben. It's the oldest trick in the book. Just because a theory has a tricky implication doesn't mean it's false.

  **Ben:** It's not just tricky, Alex. It's fatal. Look, your view is the Equal Weight View. When an epistemic peer disagrees with you, you have to split the difference. You have to conciliate.

  **Alex:** Roughly, yes. Higher-order evidence demands a shift in credence.

  **Ben:** Okay. Now look around this room. Half the people on our panel are my peers. They disagree with you. *I* disagree with you. I'm your peer. We've read the same papers, we have the same tenure track, we're equally drunk right now. By your own lights, shouldn't you be significantly less confident in Conciliationism than you were before you sat down at this table?

  **Alex:** (Pauses, takes a sip of wine) I *am* less confident. I'm not dogmatic. I assign a credence of maybe… 0.7 to Conciliationism.

  **Ben:** But you're arguing for it like it's the normative standard for rationality. If Conciliationism is true, then the fact that a bunch of smart people think it's *false* is evidence that it's false. So, if you believe Conciliationism, you have to believe you should probably stop believing Conciliationism. It eats its own tail.

  **Alex:** It doesn't eat its tail. It just… digests it slowly. Look, I can acknowledge the force of your disagreement without abandoning the framework. I'm conciliating *about* Conciliationism. That's why I'm here, talking to you, rather than publishing a decree.

  **Ben:** That's special pleading and you know it. If I were a creationist and you were an evolutionary biologist, you wouldn't say, "Well, I'll split the difference on the age of the earth." You'd say I'm wrong.

  **Alex:** Because I have first-order evidence for evolution!

  **Ben:** And I have first-order evidence for Steadfastness! I think the reasoning is on my side. So why does your view get to treat *my* disagreement as a defeater for your view, while your view treats *my* view as a mistake? You're using Conciliationism to dismiss the people who disagree with Conciliationism. That's bootstrapping.

  **Alex:** (Leans forward) Okay. Fair. It feels like bootstrapping. I grant you that. It's the hardest pill to swallow. But consider the alternative. If I adopt your view—if I go Steadfast—I get to ignore you. I get to say, "I've reasoned it out, you've reasoned it out, I'm right, so you must have messed up somewhere."

  **Ben:** And that's arrogant. I know.

  **Alex:** It's not just arrogant, Ben. It's dogmatic. It insulates belief from the social reality of inquiry. If I can't be shaken by the fact that *you*—someone I respect—think I'm wrong, then what role does peerhood play at all?

  **Ben:** It plays a role. It tells me to check my work. It tells me to be anxious. But it doesn't force me to surrender my conclusion. Here's the thing that keeps *me* up at night, though.

  **Alex:** (Surprised) You have nightmares about Steadfastness?

  **Ben:** Sure. Because if *you're* right, then I'm being irrational right now. I'm failing to respond to evidence. The evidence being… you. So, if Conciliationism is true, I'm definitely in the wrong. But if Steadfastness is true, then we're both allowed to be here, drinking, thinking the other is nuts.

  **Alex:** So you get the better epistemic deal either way.

  **Ben:** No, I get the more *honest* deal. Look, maybe the solution is that this specific debate—the debate about disagreement—is a unique zone. A "domain specific" exception.

  **Alex:** (Groans) Oh, don't tell me you're retreating to domain specificity. That's the bunker of the desperate.

  **Ben:** Is it? Think about it. To conciliate on this issue, you have to use the very principle you're conciliating about. It's circular. Maybe rationality doesn't demand you apply the rule to the rule-maker.

  **Alex:** But then where do you draw the line? If I can be steadfast about disagreement, can I be steadfast about climate data because "it's a complex model"? Can I be steadfast about ethics?

  **Ben:** I don't know. (Signals the bartender) Maybe the answer isn't a rule. Maybe it's a vibe. A sense of when you're really right and when you're just lucky.

  **Alex:** That's terrifying. That's just intuitionism with a suit on.

  **Ben:** (Takes the fresh whiskey) Maybe. But your view implies that if we keep talking long enough, we should converge. We should meet in the middle.

  **Alex:** Ideally.

  **Ben:** We haven't. We've been talking for twenty minutes. I'm more Steadfast than I was at the panel. You're… well, you're still Conciliating, but you look annoyed.

  **Alex:** (Laughs) I am annoyed. Because you've hit the nerve. It *is* awkward. I want to say, "Ben, you're my peer, so I must lower my confidence in the view that says I should lower my confidence." It feels like a paradox.

  **Ben:** So what do you do?

  **Alex:** I guess… I treat the disagreement about disagreement as a reason to be humble, not necessarily to switch sides. I lower my confidence from 0.9 to 0.7. But I don't go to 0.5. Because I think the first-order arguments for Conciliationism are still strong.

  **Ben:** And I treat your disagreement as a reason to check for bias, but not to abandon my conviction that sometimes, you just have to trust your own reasoning. Even if that means I'm the only one in the room who thinks I'm right.

  **Alex:** Which makes you look like a jerk.

  **Ben:** And which makes you look like you're trying to have your cake and eat it too.

  **Alex:** (Raises her glass) To looking bad, then.

  **Ben:** (Clinks glass) To the hope that one of us is actually rational.

  **Alex:** And if we're peers…

  **Ben:** …then we probably both aren't.

  *They drink. The noise of the bar swells around them, neither willing to concede, both wondering if the other's existence is proof they're wrong.*
