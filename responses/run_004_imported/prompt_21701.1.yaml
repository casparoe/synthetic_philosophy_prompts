answer: |-
  You and your friend have stumbled onto one of the most fascinating, frequently redacted footnotes in the history of computer science. You are both right, in a way, but your intuition about the philosophical implications cuts deeper than your friend's dismissal.

  The short answer to your question—why this passage is ignored—is that it is embarrassing to the mythos of the Turing Test. But the longer answer validates your suspicion: that passage reveals that the Turing Test was never intended to be a metaphysical proof of consciousness, but rather a pragmatic, experimental protocol that relies on controlling variables.

  Here is why that passage matters, why it was written, and why the "clean benchmark" narrative persists despite it.

  ### 1. The Historical Context: It wasn't just "woo"
  Your friend is correct that this was a "period curiosity," but that understates the scientific climate of 1950. In the late 1940s, parapsychology was not strictly the domain of stage magicians. J.B. Rhine's experiments at Duke University on ESP and psychokinesis were generating statistically significant data that was being discussed in serious scientific journals.

  Turing was, above all, an empiricist. His stance in the paper is consistent with his approach to the rest of the objections: *If the data suggests a phenomenon exists, we must account for it in the experimental design.* He writes that the "statistical evidence, at least for telepathy, is overwhelming." To dismiss it outright would be unscientific dogmatism.

  However, your friend is wrong to imply Turing was merely indulging a fad. He was rigorously defining the boundary conditions of his experiment. If a human contestant can access information via telepathy that a machine cannot, the test is no longer measuring *intelligence* or *computation*; it is measuring *paranormal bandwidth*.

  ### 2. The "Telepathy-Proof Room" as Experimental Control
  Your argument is the stronger one philosophically. You noted that if the test requires stipulating away non-computational channels, it isn't a neutral test of "thinking."

  This is precisely the point. The Turing Test is not an ontological probe (i.e., "Does this entity have a soul?"); it is an operationalist protocol (i.e., "Can this entity simulate human output under controlled conditions?").

  By proposing the "telepathy-proof room," Turing is acknowledging that the **Imitation Game** is just that: a game with rules. For the results to be valid, the channel of communication must be restricted to the symbolic (the teleprinter, in his setup). If information can leak through "psychic" channels, the symbolic channel is compromised.

  In this light, the "crack" you identified is actually a feature. Turing is admitting that **indistinguishability is relative to the interface.** If you change the interface (allow ESP), the machine fails. If you restrict the interface (text only), the machine might succeed. This concedes that the test measures *interface performance*, not internal state.

  ### 3. Why is it ignored in Philosophy and Pop Science?
  If this passage so clearly undermines the idea of the test as a definitive measure of "mind," why do intro courses and tech journalists treat it as a holy grail?

  **A. The Embarrassment Factor**
  In the 70 years since 1950, the scientific consensus on ESP has collapsed. For modern AI researchers, admitting that Turing worried about telepathy makes the founding father of their field look gullible. It is easier to treat Section 6 as a miscellany of "other objections" (like the Argument from Consciousness or the Argument from Continuity of the Nervous System) and skip the one that sounds like science fiction.

  **B. The "Clean Benchmark" Myth**
  You asked why it is treated as a "clean and authoritative benchmark." The uncomfortable truth is that **serious philosophers of mind do not treat it that way.**
  *   **Ned Block** (1981) argued that the test is too behaviorist and could be passed by a look-up table (the "Blockhead" argument).
  *   **John Searle** (1980) used the Chinese Room argument to show that passing the test implies syntax, not semantics.
  *   **Daniel Dennett** has noted that the test is a heuristic, not a definition.

  The "clean benchmark" narrative is largely a creation of pop science and computer engineering culture, which prefers binary pass/fail metrics over philosophical nuance. The ESP passage complicates the binary, so it is excised from the simplified version of the story.

  **C. Trivialization by Reality**
  Because we now assume telepathy is impossible, the "telepathy-proof room" constraint is trivially satisfied by any normal room. Therefore, modern interpreters assume the constraint is moot. But this misses your point: the *need* for the constraint reveals that the test relies on physicalist assumptions about how information is transmitted.

  ### 4. What Turing Was Actually Doing
  Your intuition that Turing "conceded that his own criterion could never be fully decisive" is astute. But Turing might not have seen that as a bug.

  In the very first paragraph of the paper, Turing writes: *"I propose to consider the question, 'Can machines think?' This should begin with definitions of the meaning of the terms 'machine' and 'think'... If the meaning of the words... is to be found by means of a statistical survey... that is absurd."*

  Turing wanted to *replace* the question "Can machines think?" with "Are there imaginable digital computers which would do well in the imitation game?"

  The ESP section reinforces this. He is not trying to prove the machine thinks; he is trying to construct a scenario where the question of "thinking" becomes irrelevant, replaced by "performance." The telepathy-proof room ensures that the performance is strictly computational. If the human wins because they are psychic, the computational comparison is invalid.

  ### Conclusion
  You won the dinner argument, essentially. The ESP passage demonstrates that the Turing Test is not a transcendent measure of intelligence, but a context-dependent experiment that requires the isolation of specific variables.

  It gets ignored because it undermines the romantic notion that a machine could ever be *proven* to be human. Instead, it shows that a machine can only be proven to be *indistinguishable from a human under specific, controlled constraints.*

  The reason it persists as a "clean benchmark" is that the AI industry needs a finish line, and philosophy departments need a standard reference point for undergraduates. But you have correctly identified that the author himself knew the finish line was drawn on shifting sand. Turing wasn't defining intelligence; he was defining the rules of a game where intelligence is the only legal move. The ESP objection simply reminds us that if you allow cheating, the game collapses.
