      *   **Causal/Counterfactual Theorist (Carter):** Focuses on current causal links, information, nomic dependencies, and intuition about intrinsic properties. Needs to defend against the Disjunction Problem (Frog/BB).
      *   **Tone:** Philosophical, rigorous, respectful, but persistent.

  3.  **Drafting - Section by Section:**

