      *   *Frog Case:* Carter starts. "The frog snaps at the BB. Your theory says it's a mistake. Mine says it's just a different cause." Telia: "Without selection, you can't distinguish mistake from success."
      *   *Swampman Case:* Telia: "Swampman has no selection history." Carter: "So he doesn't mean anything by 'water'?"
      *   *The Crunch:* Telia admits Swampman intuition is strong but insists normativity is stronger. Carter admits Disjunction is hard but insists ahistorical content is necessary.
      *   *Ending:* No easy resolution, but mutual understanding of the stakes.

  6.  **Polishing:**
      *   Ensure philosophical terminology is accurate (e.g., "normativity," "covariation," "proper function," "asymmetric dependency").
      *   Make the voices distinct. Telia is more biological/systematic. Carter is more intuitive/physicalist.
      *   Check constraints: Did they engage with the *difficulty*? Yes, Telia acknowledges the Swampman bullet is hard to bite. Carter acknowledges the Disjunction Problem is the "original sin" of causal theories.

  7.  **Final Review against Prompt:**
