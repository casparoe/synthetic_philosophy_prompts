      *   **Round 1: The Frog and the BB (The Disjunction Problem).**
          *   *Carter's Attack:* Why does the frog's neuron fire for BBs? If it fires for flies and BBs, why isn't the content "Fly or BB"?
          *   *Telia's Defense:* It's about *function*. The mechanism was selected for flies. BBs are errors.
          *   *Carter's Counter:* But how do you naturalize "function" without appealing to the very intentionality you're trying to explain? Also, what about the *current* causal power?
      *   **Round 2: Swampman (The History Problem).**
          *   *Telia's Attack:* Swampman has no history. Therefore, no functions. Therefore, no content. He's a zombie (semantically).
          *   *Carter's Defense:* That's absurd. Swampman acts exactly like us. He says "That's a tree." If he has no content, communication is impossible.
          *   *Telia's Counter:* It's not about behavior; it's about *normativity*. Swampman can't be *wrong* in the right way.
      *   **Round 3: Digging Deeper (Engaging the Difficulties).**
          *   *Carter presses Telia:* If Swampman lacks content, when does he get it? After one interaction? Ten years? This seems arbitrary.
          *   *Telia presses Carter:* If content is just causal covariation, how do you distinguish error? If a neuron fires for a fly, a BB, and a shadow, is the content "Fly-or-BB-or-Shadow"? If so, error disappears.
      *   **Round 4: Attempted Synthesis/Stand-off.**
          *   Acknowledge the costs. Telia accepts Swampman is counter-intuitive but necessary for normativity. Carter accepts the Disjunction Problem is hard but necessary for intrinsic content.
          *   Maybe hint at hybrid views or the idea that "content" might be a cluster concept.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did Telia just say "Selection is good"? *Correction:* She needs to explain *why* selection solves the disjunction problem (it introduces norms).
      *   *Check:* Did Carter just say "Swampman thinks"? *Correction:* He needs to explain *how* causal links ground content without history (e.g., asymmetric dependency or nomic regularity).
      *   *Focus:* Make sure they use the specific examples requested (Frog/BB and Swampman) repeatedly to anchor the abstract points.

  5.  **Drafting the Dialogue (Iterative Process):**
