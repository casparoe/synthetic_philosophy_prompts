answer: |-
  **Setting:** *A university common room, late afternoon. Rain streaks the window. Two philosophers, TELIA (a teleosemanticist) and CARTER (a causal/counterfactual theorist), sit in armchairs with cooling coffee.*

  **Carter:** You know, I've been reading your latest paper on proper function. It's elegant, Telia, truly. But every time I think I'm ready to sign onto teleosemantics, I picture Swampman.

  **Telia:** *(Sighs)* I knew you'd lead with him. The lightning strike in the swamp. A molecule-for-molecule duplicate of a human, popped into existence with no evolutionary history, no learning trajectory, nothing.

  **Carter:** Exactly. He steps out of the swamp, sees a tree, and says, "That's a tree." He points to a bird and says, "Bird." He navigates the world perfectly. On your view, because his neural states lack a selection history, they lack proper functions. If they lack proper functions, they lack content. So, when Swampman says "tree," he isn't actually thinking about a tree.

  **Telia:** That is the conclusion, yes.

  **Carter:** It's a bullet so hard I think it shatters the gun. If Swampman doesn't have content, who are we talking to? He behaves indistinguishably from us. He passes every Turing test. If you say he has no thoughts, you're severing the link between what a state *does* now and what it *means*. You're making meaning dependent on a ghost story about the past.

  **Telia:** It's not a ghost story; it's biology. Look, Carter, the reason I bite the Swampman bullet is that I can't see how you solve the Disjunction Problem without history. Let's talk about the frog.

  **Carter:** The fly-detector neuron.

  **Telia:** Right. A frog snaps at a fly. The neuron fires. But if I flick a small black BB pellet past the frog's eye, the neuron also fires, and the frog snaps. On a purely causal theory, that neuron covaries with flies *and* BBs. So why is the content "Fly" and not "Fly-or-BB-pellet"?

  **Carter:** Because of the counterfactual dependencies. If there were no flies, but there were BBs, the neuron might still fire. But the link to the fly is more fundamental. We can set up an asymmetric dependency. The BB causes the firing *only because* the fly causes the firing. The fly connection is primary; the BB connection is parasitic.

  **Telia:** But what grounds that asymmetry? Why is the fly connection primary? Is it just nomic regularity? Because in the frog's actual environment, BBs don't exist. But if I introduce BBs, and the frog keeps snapping, the causal link is real. The frog starves because it's snapping at metal. It is *mistaken*.

  **Carter:** I agree it's mistaken.

  **Telia:** Do you? On your view, if the neuron reliably fires for BBs in that context, then "BB" is part of the content. You struggle to define error. If a state is caused by X, it represents X. If it's caused by X or Y, it represents X-or-Y. If the content is "Fly-or-BB," then every time the frog snaps at a BB, it's *right*. It's successfully detecting a Fly-or-BB. Misrepresentation disappears.

  **Carter:** I know that's the charge. But if I deny Swampman has content, I lose something just as vital. I lose the intuition that mental states are intrinsic to the system *now*. You're telling me that two physically identical brains, one with a history and one without, differ in that one is thinking about trees and the other is just... glowing?

  **Telia:** I'm telling you one has a normative standard and the other doesn't. Think about what "content" is supposed to do. It explains behavior, yes, but it also explains *failure*. The frog fails when it snaps at the BB. It violates a norm. Where does that norm come from? It comes from the fact that the mechanism was *selected* to catch flies, not BBs. The history establishes the standard of correctness. Swampman has no standard. He can't be wrong. He's just a causal engine.

  **Carter:** But Telia, consider the transition. Suppose Swampman survives. He lives for a week. He interacts with trees. He eats food. At what precise moment does he acquire content? Is it after the first successful interaction? After a generation of offspring?

  **Telia:** It's a gradual acquisition of function, yes.

  **Carter:** That seems arbitrary. If he says "water" on day one, and points to water, and drinks it, he's functionally integrated. If you say he lacks content on day one but has it on day thirty, you're making meaning depend on a bureaucratic stamp from evolution. It makes content extrinsic in a way that disconnects it from cognitive explanation. If I want to predict Swampman's behavior on day one, I attribute beliefs to him. If he has no beliefs, my prediction works by magic.

  **Telia:** Your prediction works because you're using *your* concepts, not his. You're interpreting him. But does *he* mean anything? Here's the difficulty I have to admit: I know the intuition is strong. It feels like Swampman thinks. But if I grant that, I lose the ability to naturalize normativity. If content is just current causal covariation, then as soon as the BB pellet enters the frog's environment and triggers the neuron, the content shifts to include BBs. The frog never makes a mistake; the world just changed.

  **Carter:** Not necessarily. I can argue that the BB connection depends on the Fly connection, even without history. The mechanism is structured to detect flies. The BB exploits that structure.

  **Telia:** "Structured to." There's the teleology again. "Structured to" implies a design or a function. If you strip out the selection history, "structure" is just physics. Atoms bouncing off atoms. Why is the structure *for* flies?

  **Carter:** Because of the nomic connections in the *actual* world. In the actual world, small black moving dots are flies. BBs are rare anomalies. The content is fixed by the robust, law-like connections, not the exceptions.

  **Telia:** But anomalies happen. If I create a world where BBs are common and flies are rare, but the frog still snaps, your theory says the content shifts to BBs. My theory says the frog is malfunctioning massively. My theory preserves the idea that the frog is *trying* to do one thing and failing. Yours says the frog is successfully doing whatever happens to trigger it.

  **Carter:** Okay, I'll concede that pure covariation is too simple. I need asymmetric dependency or some counterfactual robustness to rule out the BBs. But I still can't accept your Swampman conclusion. It implies that if we were the first creatures in the universe, created ex nihilo, we wouldn't have thoughts.

  **Telia:** If you were created ex nihilo with no selection history, you wouldn't have biological functions. You might have information-carrying states, but not semantic content with truth conditions.

  **Carter:** That sounds like dualism dressed up as naturalism. You're saying physical structure isn't enough; you need the blessing of Natural Selection.

  **Telia:** I'm saying physical structure isn't enough to generate *norms*. You can't get an "ought" from an "is" unless that "is" includes a history of success and failure. Swampman is all "is."

  **Carter:** But here is where your view creates a practical problem for cognitive science. If I'm studying Swampman's brain on day one, I can map his neural states to the environment. I can say, "State N fires when a tree is present." If you say that state has no content, you're telling me I can't use intentional psychology on him. But he's just like us. So, either intentional psychology is false for us too, or Swampman has content.

  **Telia:** *(Pauses, stirring coffee)* I hear you. And I admit, it is a cost. It's the price of admission for a fully naturalized normativity. But consider the alternative. If you grant Swampman content, you have to explain how error is possible without history. If Swampman sees a mirage and says "water," why is he wrong? He has no history of needing water to survive. He has no selected function for his water-detector. On your view, if the mirage causes the state, the state represents mirage.

  **Carter:** No, because the state is *type-identified* by its connection to real water, not mirages. The mirage connection is parasitic.

  **Telia:** Parasitic on what? If not on a history of selection, then on what? On logical possibility? On what holds in nearby possible worlds?

  **Carter:** On the nomic structure of reality.

  **Telia:** But nomic structure doesn't distinguish error from success. It just distinguishes correlation from non-correlation. A thermometer doesn't make a mistake; it just registers temperature. If you want the mind to be more than a thermometer—if you want it to have *opinions* that can be false—you need a standard. And nature only provides standards through selection.

  **Carter:** So we're at a stand-off. I can't accept a theory that makes Swampman a zombie. It violates the supervenience of the mental on the physical. Two identical brains should have identical minds.

  **Telia:** And I can't accept a theory that makes error impossible. It violates the normativity of the mental. If a state can't be false, it's not a belief.

  **Carter:** Maybe the issue is that we're asking "content" to do too much work. Maybe there are two kinds. There's "phenomenal content" or "narrow content" which Swampman has—he has an inner life, he reasons, he feels.

  **Telia:** I can grant him narrow content. I can grant him phenomenal states. But broad content—content that reaches out and hooks onto *flies* specifically, rather than fly-or-BBs—that requires the environment and history.

  **Carter:** But Swampman's content *reaches out*. He points to the tree. He refers.

  **Telia:** He refers *as if* he has content. It's a useful fiction for prediction. But strictly speaking, without the history, the hook hasn't set.

  **Carter:** *(Laughs softly)* You know, Millikan would be proud of you. But I worry that in saving normativity, you've lost the mind. If I have to choose between a theory that says Swampman doesn't think and a theory that struggles to define the frog's error, I'll take the frog's error. I can tweak the causal theory. I can add asymmetric dependencies, ideal conditions, maybe even a dash of learning history without full evolution. But I can't tweak the intuition that Swampman is one of us.

  **Telia:** And I can't tweak the intuition that without a function, there is no malfunction. If the frog's neuron is just a physical cause, snapping at a BB is just physics. It's not a mistake. And if nothing can be a mistake, nothing can be true, either. Truth and error stand together. I'd rather explain why Swampman is semantically empty than explain why the frog never lies to itself.

  **Carter:** So, we agree on the stakes. You save the normativity at the cost of intrinsicness. I save the intrinsicness at the cost of... well, struggling with the disjunction.

  **Telia:** Precisely.

  **Carter:** *(Picks up his cup)* Well, at least we can agree that this coffee is objectively terrible.

  **Telia:** *(Smiles)* Careful. On your view, "terrible" is just a causal reaction. On mine, unless my taste buds were selected to detect bad coffee, I'm not actually judging it.

  **Carter:** Touché. Let's get a fresh pot. Even if Swampman couldn't mean it by asking.
