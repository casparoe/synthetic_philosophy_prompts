          *   *Resolution:* This isn't a contradiction of #303, it's a nuance. Might is the *foundation* (the tyrant underneath), but Opinion is the *visible ruler* (the queen on the throne). People obey the queen (opinion/legitimacy), but the tyrant (force) keeps her there.

