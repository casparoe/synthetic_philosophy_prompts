  1. Validate the Milgrom-Stokey intuition.
  2. Explain the "Zero-Kelvin" nature of the theorem (assumptions).
  3. Detail the real-world frictions that allow trade (Liquidity, Hedging, Priors).
  4. Introduce Grossman-Stiglitz to justify their research effort.
  5. Warn about the difficulty of extraction (Limits to Arbitrage).
  6. Conclude.

