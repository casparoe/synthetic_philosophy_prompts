answer: |-
  It is a pleasure to speak with someone who understands that economic models, like physical models, are only as good as their boundary conditions. You have grasped the Milgrom-Stokey (1982) result correctly: in a world of common priors, rational expectations, and common knowledge of rationality, speculative trade based purely on information asymmetry should not occur. If I sell to you, I reveal I think the price is too high; you should infer I know something you don't, and the deal collapses. This is the formalization of the "Groucho Marx Theorem."

  However, your deduction that this implies all market volume is "irrational flailing" and that you should therefore be able to easily exploit it contains a few traps. As a fellow traveler in the land of models, let me suggest why the real market is not a violation of the theorem, but rather a system operating outside the theorem's specific constraints.

  ### 1. The "Zero-Kelvin" Assumption
  The Milgrom-Stokey result describes a market at absolute zero. It assumes agents trade *only* to speculate on asset values based on signals. In thermodynamics, if you remove all thermal noise, the system freezes. In markets, if you remove all non-speculative motives, trading stops.

  But the real market is at a finite temperature. The vast majority of trading volume is not speculative bets on price direction; it is **liquidity trading** and **hedging**.
  *   **Lifecycle Needs:** A pension fund sells not because they know the stock is overvalued, but because they need to pay retirees next month. An individual sells to buy a house.
  *   **Hedging:** An airline buys oil futures not because they have a superior model of oil prices, but because they need to stabilize input costs. A speculator takes the other side. Both parties gain utility (one reduces risk, the other accepts risk for a premium), so trade occurs without violating rationality.

  So, the volume you see isn't necessarily "irrational flailing." It is often rational agents satisfying constraints that the Milgrom-Stokey model assumes away.

  ### 2. Heterogeneous Priors vs. Common Priors
  The theorem relies on **common priors**. It assumes that if you and I had the same information, we would arrive at the same probability distribution of future prices.

  In physical chemistry, if we both have the same data and the same laws of thermodynamics, we should agree on the reaction outcome. In economics, we do not share the same "laws." You might value a company based on discounted cash flows (DCF); a quant might value it based on momentum factors; a macro trader might value it based on interest rate sensitivity.

  If we have different models (heterogeneous priors), we can look at the same public information and rationally come to different conclusions. I sell because my model says "overvalued"; you buy because your model says "undervalued." We both think we are rational; we just disagree on the physics of the market. This allows trade to persist without requiring one party to be "irrational."

  ### 3. The Grossman-Stiglitz Paradox
  This is the theorem you should actually hang your hat on. In 1980, Grossman and Stiglitz asked the exact question you are asking: *If prices fully reflect all information (Efficient Market Hypothesis), why would anyone bother paying the cost to gather information?*

  If no one gathers information, prices can't reflect information. Therefore, the market *cannot* be perfectly efficient. There must be enough inefficiency (profit opportunity) to compensate investors for the cost of research.

  Your 35 years of lab discipline and your current deep dives into annual reports represent an **information acquisition cost**. The market *must* offer you a potential return on that effort, or else no one would do it, and the market would become inefficient enough to reward you again. This is the equilibrium justification for your strategy. You are not hunting irrational fools; you are being compensated for the work of making the market more efficient.

  ### 4. The Danger of the "Rational" Counterparty
  You asked if it's "great news" that you can clean up against irrational money. Here is the risk: When you see a trade that looks like "irrational flailing," you must distinguish between **noise** and **information you don't have**.

  In your lab, if a measurement deviated from the expected curve, you checked the instrument calibration before declaring a new physical phenomenon. In the market, if a price moves irrationally, ask:
  *   Is this a liquidity shock (someone *must* sell)?
  *   Or does the counterparty know something about the regulatory environment, the supply chain, or the accounting that I missed in the annual report?

  The "No-Trade" intuition is a vital risk management tool. It tells you: *If this deal looks too good to be true, why is the other side taking it?* Sometimes the answer is "they are forced to sell" (opportunity). Sometimes the answer is "they know the auditor is resigning tomorrow" (trap).

  ### 5. Limits to Arbitrage
  Finally, even if you identify irrational actors, exploiting them is not frictionless. This is the **Limits to Arbitrage** literature (Shleifer, Vishny, et al.).
  *   **Fundamental Risk:** You buy the undervalued stock. It becomes *more* undervalued before it corrects.
  *   **Noise Trader Risk:** The irrational flailers might flail harder, margin-calling you out of your position before your thesis plays out.
  *   **Implementation Costs:** Spreads, fees, and taxes eat the edge.

  ### Summary
  The Milgrom-Stokey theorem is a beautiful proof that **purely speculative trade based on information asymmetry is impossible among identical rational agents.**

  But the market is not composed of identical agents, and they are not trading purely for speculation.
  1.  **Volume is mostly liquidity/hedging**, not speculative disagreement.
  2.  **Disagreement is often rational** (different models/priors), not irrational.
  3.  **Your research has value** (Grossman-Stiglitz), but the market is competitive.

  So, is it great news? Yes, but not because everyone else is an idiot. It is great news because the market requires people like you—willing to do the hard work of fundamental analysis—to maintain equilibrium. You aren't cleaning up against irrational money; you are collecting a fee for providing liquidity and price discovery to those who cannot or will not do the work you are doing.

  Keep reading those reports. Just remember to check your "instrument calibration" (assumptions) as rigorously as you did in the lab.
