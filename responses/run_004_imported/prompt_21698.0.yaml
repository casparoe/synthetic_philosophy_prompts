  3.  **Analyze Nozick on Newcomb's Problem:**
      *   Nozick's 1969 paper ("Newcomb's Problem and Two Principles of Choice") is the seminal text.
      *   He presents the dilemma: One-box (trust predictor, get \$1M) vs. Two-box (take what's there + \$1k).
      *   He *does not* definitively solve it in favor of one side in the 1969 paper. He highlights the conflict between the *Expected Utility Principle* (One-box) and the *Dominance Principle* (Two-box).
      *   *However*, in *Philosophical Explanations* (1981), he leans towards a view that respects the predictor's reliability. He acknowledges that if the predictor is sufficiently reliable, the causal structure is such that your choice is evidence of the prediction.
      *   *Relevance to Basilisk:* The Basilisk relies on TDT/UDT, which are descendants of the One-Box reasoning. Nozick recognized the force of the One-Box argument *if* the predictor is nearly infallible.
      *   *Nozick's Nuance:* He was wary of "causal fetishism." If the correlation is robust enough, ignoring it is irrational. But he also valued individual autonomy and rights.

  4.  **Analyze Nozick on Blackmail:**
