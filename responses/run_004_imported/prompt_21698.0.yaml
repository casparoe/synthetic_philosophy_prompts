      *   The Paradox: Act A (reveal info) is legal. Act B (request money) is legal. Act A + B (reveal info *unless* money) is illegal.
      *   Nozick's Solution: It's about the *structure of the proposal*. Blackmail alters the victim's options in a way that violates their rights or autonomy. It creates a "threat" rather than an "offer."
      *   Key distinction: Does the proposal make the victim worse off relative to the *normal/expected course of events*?
      *   *Relevance to Basilisk:* The Basilisk says, "I will torture you (worse off) unless you help." This fits the *structure* of a threat/blackmail.
