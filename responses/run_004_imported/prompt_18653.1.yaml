  **Move 1 (Claire): +2**
  Claire articulates the "Control Principle," which is the intuitive bedrock of most moral theories (especially Kantian): we are only responsible for what is within our control. Since the code quality and decision-making were identical, judging them differently violates this core principle.

  **Move 2 (Marcus): +1**
  Marcus correctly identifies the ubiquity of "resultant moral luck" in legal and social practices, but his argument relies heavily on an appeal to convention ("courts do it too") rather than moral justification. He accurately describes how the world works, but conflates descriptive accuracy with normative coherence.

  **Move 3 (Claire): +2**
  Claire correctly identifies the Is-Ought gap in Marcus's previous point. The fact that moral luck is woven into our institutions describes a sociological reality, but it does not philosophically justify that reality as fair or rational.

  **Move 4 (Marcus): +2**
  This is the strongest move because it invokes "constitutive moral luck," effectively deploying Nagel's skeptical challenge. If Claire rejects all luck, she risks eliminating the grounds for judging character itself, since temperament and upbringing are also unchosen.

  ***

  **Is there a principled place to stop?**

  If Claire holds strictly to the **Control Principle** as she stated it in Move 1 (that judgment must be based *only* on what is chosen), then **no, there is no principled place to stop.** Marcus is channeling Nagel's skeptical conclusion: if you peel away resultant luck (outcomes), circumstantial luck (situation), and constitutive luck (temperament/upbringing), nothing remains for responsibility to attach to. On these terms, Claire is stuck biting the bullet of skepticism (no one is responsible for anything) or admitting her first move was too absolute.

  However, you can stop the regress if you modify the framework. **Compatibilists** argue that "control" doesn't require metaphysical freedom from causation, but rather the ability to respond to reasons; under this view, Marcus's bug might reflect a failure of reason-responsiveness in a way that Claire's didn't (though your scenario makes this hard to argue). Alternatively, **P.F. Strawson** would argue we shouldn't look for a metaphysical stopping point at all; our "reactive attitudes" (blame/praise) are natural facts of human life that we cannot and should not try to justify from outside the system. So, Claire is stuck only if she demands a metaphysical justification that satisfies the pure Control Principle; if she accepts a pragmatic or compatibilist definition of responsibility, she can distinguish the two cases without collapsing into skepticism.
