answer: |-
  This is a fantastic question, and it cuts right to the heart of the tension between Hilbert's formalism and his underlying mathematical realism. Given your background in physics, you'll appreciate the analogy: it's a bit like asking whether Einstein would have accepted quantum indeterminacy as ontological or merely epistemic.

  To answer you directly: **I believe Hilbert would have rejected the idea that the Continuum Hypothesis (CH) lacks a determinate truth value.** He almost certainly would have taken the second path you suggested: insisting that there is a fact of the matter and that ZFC is simply insufficient, requiring new axioms to resolve it.

  Here is the reasoning, broken down by how Hilbert viewed mathematics, axioms, and Cantor's legacy.

  ### 1. Hilbert was not a "Hard" Formalist
  There is a common caricature of Hilbert as a strict formalist who believed mathematics was nothing more than manipulating symbols according to rules, devoid of meaning. If that were true, he would have accepted Cohen's result as proof that CH is merely undecidable within the "game" of ZFC, with no deeper truth.

  But historians of mathematics (like Leo Corry and Wilfried Sieg) have shown that Hilbert's position was more nuanced. While his *proof theory* was formalistic (treating proofs as finite objects to be analyzed), his *mathematical ontology* was deeply realist, particularly regarding the infinite.

  His famous defense of Cantor—"No one shall expel us from the Paradise that Cantor has created"—wasn't just rhetorical flair. It was a philosophical commitment. He believed the transfinite numbers described a real mathematical domain. If the domain is real, then statements about its structure (like CH) ought to be true or false, regardless of whether our current rulebook (ZFC) can capture them.

  ### 2. Axioms as Characterizations, Not Definitions
  For Hilbert, axioms were not necessarily self-evident truths or exhaustive definitions of a system. In his geometry work, he treated axioms as implicit definitions that characterize a structure. If a statement is independent of the axioms, it doesn't mean the statement is meaningless; it means the axioms don't fully characterize the structure.

  In a 1900 letter to Frege, Hilbert wrote:
  > "If the arbitrarily given axioms do not contradict one another with all their consequences, then they are true and the things defined by them exist. This is for me the criterion of truth and existence."

  This sounds like he's tying truth to consistency. However, in the context of set theory, Hilbert viewed the axioms of set theory as a work in progress aimed at capturing the "Cantorian universe." If Cohen showed that ZFC leaves CH open, Hilbert would likely have viewed this as a failure of ZFC to fully capture the intended model of the continuum, not as a failure of the continuum to have a definite size.

  ### 3. The "Wir werden wissen" Context
  When Hilbert said "We must know, we will know," he was speaking against the *ignorabimus* (we shall not know) agnosticism of du Bois-Reymond. He was making an epistemic claim about the solvability of problems in principle.

  Crucially, he did not say, "We will know using the axioms we currently possess." He believed that human mathematical ingenuity could always extend the framework.

  Think of it like a physicist encountering a phenomenon that Newtonian mechanics can't predict. You don't say, "The position of the planet has no truth value." You say, "Newtonian mechanics is an approximation; we need a deeper theory (General Relativity)." Hilbert would have viewed ZFC much like a physicist views the Standard Model: an incredibly successful framework, but not necessarily the final word on ontology.

  ### 4. The Gödel Connection
  It is worth noting that Kurt Gödel, who proved the first incompleteness theorem and later showed the consistency of CH with ZFC (1938), was a staunch Platonist. Gödel believed CH was either true or false and that we simply needed new "evident" axioms (perhaps involving large cardinals) to decide it.

  Hilbert and Gödel had a complex relationship, but Hilbert respected Gödel's work immensely. After Gödel's 1931 results, Hilbert didn't abandon his program; he tried to adjust it. He recognized that finitary methods might need to be extended. It is highly plausible that, faced with Cohen's forcing (which is technically quite distinct from Gödel's incompleteness but philosophically similar in outcome), Hilbert would have aligned with Gödel's Platonistic interpretation: **The system is incomplete, not the reality.**

  ### 5. Why He Might Have Hesitated (The Counter-Argument)
  The only reason to think Hilbert might have accepted indeterminacy is if he had fully retreated into a strict instrumentalism after 1931. If he decided that "truth" is *defined* as "provability within a fixed formal system," then independence implies truth-value gaps.

  However, this contradicts his lifelong devotion to solving specific problems (like the Well-Ordering Problem or CH itself). He listed CH as Problem #1 not as a logic puzzle, but as a question about the nature of infinity. He expected an answer (he actually thought CH was true and tried to prove it himself using his proof theory methods).

  ### Verdict
  If Hilbert had lived to 1963 and read Cohen's papers:

  1.  **He would not have accepted "independence" as "indeterminacy."** He would have distinguished between *undecidability in ZFC* and *undecidability in mathematics*.
  2.  **He would have called for new axioms.** He likely would have joined the search for "natural" axioms that settle CH, similar to the modern "Inner Model Program" or the search for large cardinal axioms that Gödel advocated.
  3.  **He would have viewed ZFC as provisional.** Just as he didn't view Euclid's axioms as the end of geometry, he wouldn't view Zermelo-Fraenkel as the end of set theory.

  In short, Hilbert's optimism was about the power of the human mind to grasp mathematical truth, not about the completeness of any specific static formal system. He would have seen Cohen's result not as a wall, but as a signpost pointing toward the need for new mathematical ideas. He would have insisted: *"Wir müssen wissen, wir werden wissen... wir brauchen nur neue Axiome"* (We must know, we will know... we just need new axioms).
