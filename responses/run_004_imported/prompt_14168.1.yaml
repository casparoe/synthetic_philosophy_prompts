  "Not if it leads nowhere," James countered. "Truth isn't a static property; it happens to an idea. It becomes true, is made true by events. If a belief guides you successfully through experience, verifies itself, it is true. What else could truth mean for living men? To call an idea true is to say it is profitable to our lives."

  "It means correspondence with a reality independent of us," Peirce insisted, leaning forward. "Consider a belief that satisfies everyone today—say, that Newtonian physics is complete. It works. It comforts. It predicts. By your account, it is true. But we know it may fail tomorrow. If truth is merely present satisfactoriness, you erase the distinction between truth and temporary utility. You leave no room for a belief to be universally satisfying yet false. You collapse ontology into psychology."

  James sighed, stirring his tea. "And you, Charlie, posit a 'final opinion' fated to be agreed upon at the limit of inquiry. But that limit is unreachable. It is a regulative ideal, nothing more. What work does this 'final opinion' actually do if it can never be cashed out or checked against anything? Isn't it just as much a human postulate as anything in my account? You accuse me of psychology, but you posit a metaphysical destiny that no human eye shall ever see. Is that not also a form of comfort?"

  "It does the work of restraint," Peirce said, his voice sharpening. "You speak of experience, but you neglect the brute facticity of the world. This is my second point against you. Reality is not just what we weave together; it is Secondness. It is the shock of resistance when I push against a door. That resistance is not my satisfaction; it is the object's independence. When the door refuses to open, it is not my mind that fails; it is the world asserting itself. Your 'satisfactoriness' implies the world yields to us. I say we must yield to the world. If your truth ignores this external constraint, it collapses into nominalism."

