      *   *Thesis:* Franklin is aware of the paradox but rejects the philosophical demand for "purity" of motive in favor of social utility. The regress is real, but he treats it as a feature of human nature, not a bug in his system. The focus on "appearance" is a pragmatic workaround, not a failure of the method, because the method's goal is behavioral improvement, not sanctification.
