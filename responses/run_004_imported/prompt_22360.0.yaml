      *   *Is it a structural problem?* Yes, it touches on the "paradox of hedonism" or the "self-effacing nature of virtue." If you aim at humility, you are asserting your ego's desire to be humble.
      *   *Franklin's Stance:* Does he care? Franklin is a utilitarian/pragmatist. If the *outcome* is better social relations, does the internal state matter as much?
