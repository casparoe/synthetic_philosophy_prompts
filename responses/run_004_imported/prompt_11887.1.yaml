answer: |-
  Here are 10 interview questions designed to move beyond a summary of the book and into the tough philosophical corners of the argument. They are structured to create a narrative arc: starting with the core accusation, moving through the technical moral defenses, testing the limits of the absolutism, and ending with the historical and modern legacy.

  ### 1. The Label "Murderer"
  **Question:** Your book leans heavily into Elizabeth Anscombe's provocation that Truman wasn't just a leader making a hard call, but literally a murderer. In common parlance, "murder" implies a kind of malicious, criminal intent that feels distinct from a President weighing millions of lives. Are you worried that using that specific word shuts down moral inquiry rather than deepening it?
  **Likely Answer:** He will likely argue that "murder" is a technical moral term, not just an emotional insult. It denotes the intentional killing of the innocent. He'll say that sanitizing the language (calling it a "tragic necessity") is actually what shuts down inquiry by removing the act from the realm of moral judgment.
  **Follow-up:** But if the language alienates the very audience who needs to hear it—the policymakers and citizens who authorize force—doesn't that render the moral truth politically impotent? Is there a cost to being right if no one listens?

  ### 2. The Doctrine of Double Effect
  **Question:** I want to drill down on the Doctrine of Double Effect. The standard defense is that Truman *foreseeably* killed civilians, but he didn't *intend* their deaths as an end in themselves; he intended to end the war. How do you distinguish the atomic bomb from, say, a conventional strike on a munitions factory where you know workers will die?
  **Likely Answer:** He will argue that the atomic bomb made the civilian destruction the *means* to the victory (coercion through terror), whereas in the factory case, the deaths are a side effect. He'll likely contend that if the civilians didn't die, the objective (surrender via shock) wouldn't be met, making their death intended.
  **Follow-up:** If that's the case, does that implicate the firebombing of Tokyo just as heavily? And if so, are we forced to conclude that the Allied victory in Europe and Japan was built on a foundation of mass murder, regardless of who won the war?

  ### 3. Walzer's "Supreme Emergency"
  **Question:** Michael Walzer offers a famous counter-argument with the "Supreme Emergency" exemption. He argues that when a community faces extinction or enslavement—like Britain in 1940—the usual rules of war can be suspended. Why does Anscombe's framework deny leaders this "dirty hands" escape hatch even when civilization is on the line?
  **Likely Answer:** He will likely say that rules are most necessary when the stakes are highest. He'll argue that "Supreme Emergency" is a slippery slope that allows leaders to define any threat as existential to justify atrocities. The prohibition on killing innocents is absolute, not conditional on the stakes.
  **Follow-up:** But if we face a hypothetical where the only way to stop a genocidal regime is to kill innocents, and we refuse, aren't we effectively choosing the victory of the genocidal regime? Does your absolutism risk becoming complicity in a greater evil?

  ### 4. The Threshold Question
  **Question:** Let's push that absolutism to the breaking point. Is there *any* hypothetical death toll on the other side that would justify dropping the bomb? If Truman knew for a certainty that not dropping the bomb would result in the deaths of 100 million Americans, does the math change?
  **Likely Answer:** He will likely hold the line: No. Numbers do not change the moral quality of the act. Killing an innocent person is intrinsically wrong; doing it once is murder, doing it to save a million is still murder, just with higher stakes.
  **Follow-up:** That suggests a morality that is internally consistent but potentially catastrophic in its outcomes. If a moral system demands we accept the destruction of our own people rather than violate a rule, is that a system fit for governing reality, or is it a form of moral purity testing?

  ### 5. Anscombe and "Consequentialism"
  **Question:** It's historically significant that Anscombe coined the term "consequentialism" in her 1958 paper *Modern Moral Philosophy*, shortly after her Truman protest. She essentially needed to invent a label for the reasoning she was fighting. Do you think she created a strawman, or did she correctly identify the dominant virus in modern ethics?
  **Likely Answer:** He will argue she identified a real shift where "good outcomes" replaced "good actions" as the metric of morality. He'll say she didn't create a strawman but named a prevailing tendency to justify any means by the ends.
  **Follow-up:** But isn't it human nature to weigh consequences? By framing consequence-based reasoning as a distinct "ism," did Anscombe inadvertently make it easier for philosophers to dismiss practical concerns as merely "consequentialist" and therefore irrelevant?

  ### 6. The Duty to Soldiers
  **Question:** A common defense of Truman is the duty of care a leader has to their own troops. An invasion of Japan was projected to cost hundreds of thousands of Allied lives. Does a President not have a stricter obligation to the citizens he represents than to the abstract rules of war regarding enemy civilians?
  **Likely Answer:** He will likely argue that you cannot protect your people by committing injustice. He might draw a parallel to a hostage situation: you don't kill a hostage to save your own police officer. The duty to justice constrains the duty to protection.
  **Follow-up:** That's a compelling analogy for an individual, but a state isn't an individual. If a Captain sacrifices one soldier to save his platoon, we call him a hero. Why does the moral arithmetic change when the scale becomes national?

  ### 7. Epistemic Uncertainty
  **Question:** One historical critique is that Truman didn't *know* the bomb would work, or that Japan was already on the verge of surrender. Does your moral judgment rely on the historical facts as we know them now, or on what Truman believed in the moment?
  **Likely Answer:** He will likely focus on the *intent*. Regardless of whether Japan was ready to surrender, Truman's intent was to coerce them via civilian destruction. The moral wrong is in the intention to use innocents as leverage, regardless of whether that leverage was strictly necessary.
  **Follow-up:** So even if the bomb *didn't* work, or if Japan surrendered the day before, the moral guilt remains the same? It's not about the outcome, it's purely about the state of Truman's mind?

  ### 8. Moral Luck
  **Question:** That leads to the concept of "moral luck." Legally, we treat a failed assassination attempt differently than a successful one. But you seem to argue that Truman's moral status is the same regardless of how many actually died. Why should we ignore the body count in the final moral judgment?
  **Likely Answer:** He will argue that the body count is a matter of luck, but the will is what matters morally. If I shoot at you and miss, I am still a murderer in intent. The bomb just made the intent horrifically efficient.
  **Follow-up:** If intent is all that matters, does that make the actual suffering of the victims in Hiroshima morally secondary? It feels like we're focusing so much on Truman's soul that we're losing sight of the actual horror experienced on the ground.

  ### 9. Modern Drone Warfare
  **Question:** Bringing this to the present: We now use drones for targeted killings where "collateral damage" is statistically calculated and accepted. Is this the ultimate triumph of the consequentialism Anscombe hated?
  **Likely Answer:** He will likely say yes. He'll argue that "signature strikes" or proportional collateral damage calculations are just sophisticated versions of the Truman logic—trading innocent lives for perceived security gains.
  **Follow-up:** If that logic is so deeply embedded in our current military infrastructure, is your argument actually a call for total pacifism? Because it's hard to see how modern warfare survives the Anscombe test at all.

  ### 10. The Takeaway
  **Question:** Finally, if we accept your thesis—that Truman was a murderer and the bomb was unjustifiable—what is the practical prescription for today? Do we need new international laws, or is this a change that has to happen in the individual conscience of leaders?
  **Likely Answer:** He will likely emphasize the need for a cultural shift in how we talk about war. We need to stop glorifying "tough choices" that involve killing innocents. Laws are good, but they follow moral consensus.
  **Follow-up:** But history suggests moral consensus often follows survival. If a leader follows your advice and loses a war because they wouldn't break the rules, history will remember them as a failure, not a saint. How do we reconcile moral victory with political survival?
