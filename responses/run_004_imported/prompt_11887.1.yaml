prompt: |-
  So I've got a podcast interview lined up next week with a moral philosopher whose new book basically dusts off Anscombe's old argument that Truman was, literally, a murderer for dropping the bomb -- not a tragic-but-necessary call, actual murder, no matter how many lives it supposedly saved. I don't want the episode to just be him restating that thesis for 40 minutes, so can you draft me 8-10 interview questions, each paired with the answer hes probably going to give and a pointed follow-up? I want at least one question on the doctrine of double effect (the intend/foresee distinction thats supposed to excuse ordinary bombing casualties but not Hiroshima), one on Walzer's "supreme emergency" comeback -- that some circumstances are extreme enough to justify breaking the rule -- one that pushes on whether ANY hypothetical death toll would get him to drop the absolutism, and one, if it fits naturally, on why Anscombe felt the need to invent the word "consequentialism" not long after, just to have a name for the reasoning she was up against.
