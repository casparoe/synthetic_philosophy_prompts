answer: |-
  **Setting:** *A courtyard in Cordoba, late afternoon. The light is gold and dust-heavy. Between ABŪ ḤĀMID AL-GHAZĀLĪ and ABŪ AL-WALĪD IBN RUSHD (AVERROES) sits a small brazier. A scrap of raw cotton rests on the coals. It has just caught; a small tongue of orange flame consumes it.*

  **AVERROES:** Watch it, Imam. The contact is made, and the burning follows. There is no pause for deliberation, no interval for a separate will to intervene. The fire acts according to what it is.

  **AL-GHAZĀLĪ:** I watch, Judge. I see the fire touch. I see the cotton blacken and flare. I see two occurrences placed side by side by the Hand that holds time. But I do not see the "according to." You say the fire acts. I ask you: Does the fire know it burns?

  **AVERROES:** It is not a matter of knowledge. It is a matter of form. The form of fire contains the active quality of heat and dryness. The form of cotton contains the passive quality of combustibility. When the active meets the passive, the effect is not a choice; it is a definition. To say fire does not burn is to say a triangle does not have three sides.

  **AL-GHAZĀLĪ:** A triangle is a concept in the mind. Fire is a created thing. If I say, "A man who does not write is a scribe," I contradict myself. But if I say, "Fire touches cotton and the cotton remains whole," where is the contradiction? The mind can conceive it.

  **AVERROES:** The mind can conceive many things that nature cannot suffer. I can conceive of a stone flying upward without a thrower, but I cannot find such a stone in the cosmos. You confuse logical possibility with natural possibility. In the realm of *logic*, yes, God could make the cotton cool. But in the realm of *nature*, which is the realm of demonstrative science, fire *must* burn. If you remove that "must," you remove the "is."

  **AL-GHAZĀLĪ:** You posit a "nature" (*tabi'a*) that stands between the Creator and the creature. You say this nature compels the effect. I say this nature is merely the name we give to the consistency of God's habit (*ʿāda*). When you say fire *must* burn, you limit the Power (*Qudra*). If the fire burns by its own necessity, then God cannot stop it without contradicting the fire's essence. Is God a prisoner of the essences He created?

  **AVERROES:** God is not a prisoner. He is the Author of the essence. But once He wills a thing to have a nature, He wills it to act according to that nature. To ask God to make fire that does not burn is not to ask for a miracle; it is to ask for nonsense. It is to ask for "fire" that is not "fire." If the connection is not necessary, then your knowledge of the fire is not knowledge. It is a guess that has happened to be right every time so far.

  **AL-GHAZĀLĪ:** It is not a guess. It is a witness to Divine Consistency. If I eat bread, I am satiated. Not because the bread has the power to satiate, but because God creates satiety at the moment of eating. He could, in principle, create hunger at the moment of eating. He does not, because He is faithful to His custom. But do not mistake the custom for a chain.

  **AVERROES:** *(Leaning forward, voice sharpening)* Here is the rupture, Imam. If the bread has no power to satiate, and the fire has no power to burn, then there are no secondary causes. There is only One Agent in the universe. If this is true, then medicine is a lie. The physician does not heal; God heals. The drug does not purge; God purges. Why then do we study the natures of things? Why did Aristotle write the *Physics*? To study shadows on a wall while ignoring the objects casting them?

  **AL-GHAZĀLĪ:** We study the shadows to know the Light. The physician studies the habits of God in the body. When he applies a remedy, he is not manipulating a necessary force; he is placing himself in the position where God's mercy usually flows. This does not make medicine a lie. It makes it a theology of the body. But you, Judge, you fear that if the link is not necessary, science collapses. I fear that if the link *is* necessary, Idolatry (*shirk*) begins. You grant the creature a power that belongs only to the Creator.

  **AVERROES:** I grant the creature a *derived* power. The sun gives light, not because it is the source of light, but because it participates in the source. If I strike a flint, the spark is real. If you deny the reality of the spark's cause, you make the universe a phantasm. Let us press this distinction you evade: Logical vs. Natural Necessity.
  I concede: It is not *logically* necessary that fire burns cotton. God could have created a world where fire cools. That is a contradiction only in terms of *this* world's order. But within *this* order, established by Divine Wisdom, the connection is *naturally* necessary. It is binding. To deny it is to deny the Wisdom that ordered it.

  **AL-GHAZĀLĪ:** *(Pauses, watching the cotton turn to ash)* You say "within this order." Who sustains the order moment to moment?

  **AVERROES:** The order sustains itself through the natures instantiated within it.

  **AL-GHAZĀLĪ:** There it is. The order does not sustain itself. Nothing sustains itself but God. If the "natural necessity" you speak of is real, it must be a quality inherent in the fire. Is this quality created?

  **AVERROES:** Yes.

  **AL-GHAZĀLĀLĪ:** Then it is contingent (*mumkin*). It relies on a cause for its existence. If it relies on a cause, it can cease if the cause wills it to cease. If the "necessity" can cease, it is not a true necessity. It is a contingent regularity. You call it "Natural Necessity" to save your science. I call it "Divine Habit" to save His Omnipotence.
  You say I confuse the conceivable with the possible. I say you confuse the *consistent* with the *compulsory*. Just because God does not break His habit does not mean He cannot. If you build your science on the idea that He *cannot*, you build on a limit you cannot prove.

  **AVERROES:** And if you build your science on the idea that He *might* break it at any moment, you build on fear. Demonstration (*burhān*) requires that the middle term necessitates the conclusion. "Fire is hot; Hot things burn cotton; Therefore fire burns cotton." If the middle term does not necessitate the conclusion, there is no demonstration. There is only prophecy. You reduce the Philosopher to the Soothsayer. We wait to see if God wills the cotton to burn *this time*.

  **AL-GHAZĀLĪ:** No. We know He will burn it, because He has promised us through His Sunna that the world will remain stable. But we know *why* it burns. It burns because He wills it now. You say it burns because it *must*.
  Tell me, Judge: When the cotton burns, does the fire perceive the cotton?

  **AVERROES:** Perception is for animals. Fire acts by essence.

  **AL-GHAZĀLĪ:** Then it is blind. It is dead matter. How can a dead thing be an agent? An agent must choose the effect. If the fire cannot choose *not* to burn, it is not an agent. It is an instrument. If it is an instrument, the Agent is the One who wields it. You are defending the agency of the sword, while ignoring the swordsman.

  **AVERROES:** The sword cuts by its sharpness. The sharpness is real. If the sharpness is real, the cutting is caused by the sword, even if the smith made the sword. You collapse the distinction between the Primary Cause and the secondary cause. If I drink poison, and I die, and you say "God killed you, the poison did nothing," you make a mockery of justice and law.

  **AL-GHAZĀLĪ:** I do not say the poison did nothing. I say the poison is the *occasion* (*sabab*), not the *agent* (*fāʿil*). God created the poison with a nature that is the occasion for death. He created the body with a nature that is the occasion for perishing. When they meet, God creates the death.
  Your "Natural Necessity" is a useful fiction for the marketplace and the clinic. I do not deny we should act *as if* fire burns necessarily. But when we enter the mosque of the intellect, we must admit the truth: The fire is powerless.

  **AVERROES:** *(Stands, looking at the brazier)* Then your truth makes the intellect powerless. If the connection is not in the things themselves, then the intellect cannot grasp the things. It can only grasp its own expectations. You save God's Power by sacrificing the reality of His Creation. You make the world a shadow play.
  I argue that God's Wisdom is shown precisely in that He created things with *real* powers. He delegated authority. A king who does not allow his governors to truly govern is not a great king; he is a micromanager. God's greatness is shown in that He created a fire that *truly* burns, not a fire that only *seems* to burn while He does the work secretly.

  **AL-GHAZĀLĪ:** *(Softly)* And I say, the King's greatness is shown in that no governor can move a finger without His leave. If the fire truly burns, then God could not extinguish it without violating its nature. Which is greater: A King who binds Himself to His laws, or a King whose Will is the law itself, moment by moment?
  You fear that without necessary connection, science is impossible. I tell you, science is the cataloging of God's habits. It is noble. But do not worship the catalog and call it the Master.

  **AVERROES:** And I tell you, Imam, that to call the catalog mere "habit" is to blind the eye that reads it. If there is no necessary connection, there is no "habit." There is only a sequence of miracles. And if everything is a miracle, nothing is a miracle. The burning of the cotton is wondrous enough without denying the fire its nature.

  **AL-GHAZĀLĪ:** The fire has a nature. But its nature is to be a locus for God's action, not a source of action.

  **AVERROES:** Then the locus *is* the source, insofar as it is the locus. We are arguing over words, but the stake is the cosmos. You want a cosmos of discrete atoms of time, stitched together by Will. I want a cosmos of continuous natures, flowing from Wisdom.

  **AL-GHAZĀLĪ:** And you fear that if I am right, you cannot be a chemist.

  **AVERROES:** *(A faint smile)* I fear that if you are right, there is no "chemist." There is only a witness.

  **AL-GHAZĀLĪ:** *(Looking at the ash)* Perhaps that is what I am asking you to be. A witness to the Power, not just the pattern.

  **AVERROES:** And I ask you to be a witness to the Wisdom, not just the Will. The pattern *is* the Power's signature. To deny the necessity of the pattern is to smudge the signature.

  **AL-GHAZĀLĪ:** The signature is clear, Judge. But do not mistake the ink for the Hand.

  **AVERROES:** Nor the Hand for the Mind that guides it.

  *(Silence falls between them. The fire in the brazier settles. The cotton is gone. The heat remains, radiating against their hands, undeniable, regular, and hot.)*
