answer: |-
  **Title:** The Perihelion of Reason: A Verdict on the Problem of Old Evidence

  **To:** A Skeptical Referee (and a Colleague)
  **From:** [Your Name/AI Assistant]
  **Subject:** Re: The Problem of Old Evidence and Bayesian Confirmation

  It is a distinct pleasure to correspond with someone who knows the weight of data firsthand. You are right to be agitated. In astronomy, we learn early that an anomaly in the data is not a nuisance to be smoothed over; it is often the only place where the truth is speaking. Mercury's perihelion was not merely "old data"; it was a standing rebuke to Newtonian mechanics for half a century. When Einstein's field equations yielded that 43 arcseconds per century as a natural consequence, it felt like a key turning in a lock that had been rusting since Le Verrier's time. To be told by a formal epistemological theory that this event constituted *zero* confirmation is not just counterintuitive; it is an insult to the scientific instinct.

  You have correctly identified the three main escape hatches: Worrall's methodological surrender, Howson's counterfactual reconstruction, and Garber's relaxation of logical omniscience. You asked for a verdict, defended as one would defend a result against a skeptical referee. I will not offer you the diplomatic "reasonable people disagree." I will argue that **Garber's solution (relaxing logical omniscience) is the only viable option**, but with a critical stipulation: it requires us to accept that Bayesianism is a theory of *bounded* rationality, not ideal rationality. The other two solutions fail because one abandons the project and the other relies on metaphysical fictions that an empiricist should reject.

  Here is the breakdown of the evidence.

  ### 1. The Formal Trap
  Let us briefly confirm the diagnosis is correct, so we know we are treating the same pathology. In standard Bayesian conditionalization, confirmation occurs when $P(H|E) > P(H)$. By Bayes' Theorem, this requires $P(E|H) > P(E)$.
  If $E$ is "old evidence," you know it with certainty. Thus, $P(E) = 1$.
  Since probabilities cannot exceed 1, $P(E|H)$ must also be 1 (assuming $H$ entails $E$).
  The ratio becomes $1/1$. The posterior equals the prior. $P(H|E) = P(H)$.
  Formally, the evidence is inert. It cannot boost the credence of the hypothesis.

  This is absurd on its face. It implies that the most profound theoretical unifications in physics—those that explain known anomalies—provide no rational grounds for increasing belief in the theory. If Bayesian confirmation theory cannot account for the single best argument for General Relativity, it is useless as a model of scientific reasoning. Something must give.

  ### 2. The Surrender: Worrall and Use-Novelty
  John Worrall's response is the most drastic. He argues that we should abandon the attempt to model this within Bayesian confirmation. Instead, he revives the heuristic of "use-novelty": evidence confirms a hypothesis only if it was not used to construct the hypothesis. Since Mercury's perihelion was known before GR, it is not "novel," and thus, strictly speaking, does not *confirm* GR, though it may show the theory's "systematic power."

  **The Verdict on Worrall:** This is a confession of defeat.
  Worrall effectively argues that because the Bayesian math doesn't work, the intuition must be wrong. He asks us to believe that Einstein's explanation of Mercury was not *confirmation* in the strict sense, but something else. For a scientist, this is semantic hair-splitting of the worst order. If a theory predicts a known value with high precision where its competitor failed, that *is* confirmation. To define "confirmation" in a way that excludes the strongest historical cases of theory acceptance is to save the theory by draining it of relevance. Worrall saves Bayesianism from the problem of old evidence by removing Bayesianism from the business of explaining scientific progress. We must reject this. It shoves the lump under the rug by claiming the rug was never meant to cover that part of the floor.

  ### 3. The Fiction: Howson and Counterfactuals
  Colin Howson's approach is more sophisticated. He suggests we evaluate confirmation not against our *actual* prior, but against a *counterfactual* prior. We ask: "What would my credence in $H$ have been if I had *not* known $E$?" If, in that counterfactual scenario, learning $E$ would have boosted $H$, then $E$ confirms $H$ now.

  **The Verdict on Howson:** This is methodologically untenable for an empiricist.
  While this preserves the standard Bayesian calculus, it asks us to perform an impossible subtraction. You cannot simply "delete" Mercury's perihelion from the astronomical record of 1915 without altering the entire conceptual framework in which General Relativity was born. The anomaly was part of the pressure that shaped the theory. To imagine a world where the anomaly is unknown is to imagine a world where the theory itself might not exist, or would look radically different.
  Furthermore, as a scientist, you deal with actual data, not reconstructed histories. Howson's move turns confirmation into a judgment about possible worlds rather than actual inferential relations. It makes the rationality of my current belief dependent on a fictional history of my own cognition. It is a useful heuristic, perhaps, but it lacks the ontological grounding required for a rigorous logic of science. It solves the math by ignoring the history.

  ### 4. The Realism: Garber and Logical Omniscience
  This leaves Daniel Garber's solution. Standard Bayesianism assumes "logical omniscience": that an agent automatically knows all the logical consequences of their hypotheses. If you believe $H$, and $H$ entails $E$, standard Bayesianism assumes you *already* know $H$ entails $E$.

  Garber argues that real agents are not logically omniscient. When Einstein formulated GR, he did not immediately know it entailed the specific value of Mercury's precession. He had to *calculate* it. The "new information" was not $E$ (the perihelion shift was already known), but the logical relation: $(H \vdash E)$.
  We should conditionalize not on $E$, but on the proposition "H entails E."
  Let $L$ be the proposition $(H \vdash E)$.
  Before the calculation, $P(L) < 1$. After the calculation, $P(L) = 1$.
  Conditionalizing on $L$ *does* shift the probability of $H$, even if $P(E)=1$.

  **The Verdict on Garber:** This is the only solution that respects the cognitive reality of discovery.
  This approach acknowledges that learning in science is not just acquiring new data points; it is acquiring new *connections* between data and theory. For forty years, you looked at spectra. The wavelengths were "old evidence." But when you realized a specific line profile implied a specific stellar atmosphere composition, your credence in that atmospheric model went up. Why? Not because the spectrum changed, but because your understanding of the *link* between the model and the spectrum changed.

  Garber's solution requires us to modify the Bayesian framework to allow probabilities to be assigned to logical relations (sentences about sentences), rather than just empirical events. Some purists balk at this, claiming it violates the axioms of probability. I argue that this is a feature, not a bug. The axioms of standard probability theory describe an ideal god-like mind. Garber's modification describes a human scientist.

  ### The Final Ruling

  Here is my commitment, offered as I would offer a conclusion in a paper:

  **The Problem of Old Evidence is not a problem with evidence; it is a problem with the idealization of the agent.**

  Bayesian confirmation theory, in its standard form, is a logic for beings who know all the consequences of their beliefs instantly. No such beings exist in science. Therefore, standard Bayesianism is descriptively false for scientific reasoning.

  To save Bayesianism as a normative theory for scientists, **we must adopt the Garber solution.** We must accept that "learning" includes the discovery of logical entailments.
  *   **Why Worrall fails:** It redefines confirmation to save the math, rendering the theory irrelevant to actual scientific practice.
  *   **Why Howson fails:** It relies on indeterminate counterfactual histories that an empiricist cannot verify.
  *   **Why Garber succeeds:** It identifies the actual locus of the epistemic gain. The "Aha!" moment is real. It is the moment the logical connection is established.

  **The Condition:**
  Bayesianism survives the Problem of Old Evidence *if and only if* we reject the assumption of logical omniscience. If you insist on standard, logically omniscient Bayesianism, then you must admit it cannot model the confirmation of General Relativity by Mercury's perihelion. If you cannot model the best confirmation in modern physics, your model is broken.

  So, the verdict is this: **Garber is right.** The "new evidence" was the derivation itself. The blood pressure spike you feel in your reading group is the friction of a formal system grinding against the messy reality of human cognition. The fix is not to change the history of science (Howson) or the definition of confirmation (Worrall), but to upgrade the model of the scientist. We are not oracle machines; we are explorers mapping the logical consequences of our own hypotheses. When we find a path that leads to a known landmark, we have learned something new, even if the landmark was already on the map.

  Keep fighting the good fight. The philosophy of science needs more people who know the difference between a spectrograph and a thought experiment.

  Sincerely,

  A Colleague in Reasoning
