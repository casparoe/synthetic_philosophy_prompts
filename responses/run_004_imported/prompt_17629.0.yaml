answer: |-
  # The Mercury Anomaly and the Limits of Logical Gods: A Defense of Bounded Bayesianism

  The problem of old evidence is the Bayesian's original sin. It is the one embarrassment that gets brought up in every intro philosophy of science seminar, the skeleton in the closet of rationality. The setup is, as you know, brutal in its simplicity: In 1915, Einstein derived the exact value of Mercury's perihelion precession from General Relativity (GR). This was rightly treated as a massive confirmation of GR. Yet, under standard Bayesian conditionalization, if $E$ (the precession) was already known with certainty ($P(E)=1$) before Einstein formulated $H$ (GR), then $P(H|E) = P(H)$. The posterior equals the prior. The evidence confirms nothing.

  Your reading group is stuck on a familiar fault line: the split between the "dynamic" problem (how did Einstein update his beliefs in 1915?) and the "static" problem (why does Mercury count as evidence for us *now*?). Your friend who claimed that solutions like Garber's or Howson's only fix the dynamic half is technically correct, but they are drawing the wrong conclusion from it. They are assuming that Bayesian confirmation theory *ought* to solve the static problem.

  Here is the verdict: **Bayesian confirmation theory can be saved, but only if we stop treating it as a logic of timeless support and accept it as a theory of bounded learning.** The "static" problem is not a failure of Bayesianism; it is a category error generated by conflating *confirmation* (a change in belief) with *support* (a logical relation). The only viable solution is the Garber/Jeffrey approach of dropping logical omniscience. The counterfactual approach is a fiction, and the demand for a static solution is a demand for Bayesianism to be something it isn't.

  ### The Formal Trap

  To see why the standard model breaks, we have to look at the ratio form of Bayes' Theorem:

  $$ \frac{P(H|E)}{P(H)} = \frac{P(E|H)}{P(E)} $$

  Confirmation occurs when the ratio is $>1$. If $E$ is old evidence, standard Bayesianism assigns $P(E) = 1$ (certainty). Since $H$ entails $E$, $P(E|H)$ is also 1. The ratio becomes $1/1$. No confirmation.

  This implies that a theory gains zero probabilistic boost from explaining known anomalies, which contradicts the entire history of science. If Bayesianism cannot account for the Mercury precession, it cannot account for the validation of GR, and if it can't account for GR, its utility as a model of scientific rationality is severely compromised.

  ### The Counterfactual Detour (and Why It Fails)

  The first major attempt to patch this was the counterfactual approach, championed by Colin Howson. The move is to ask: "What would Einstein's credence in $E$ have been *if* he hadn't known it?" We construct a hypothetical prior $P^*$ where $P^*(E) < 1$, calculate the boost, and claim that this counterfactual boost represents the confirmatory power of $E$.

  This solution is seductive because it preserves the math. But it fails on ontological grounds. It solves the problem by changing the subject. It tells us how much Einstein *would have* updated if he were ignorant, not how much he *did* update given his actual knowledge.

  More damningly, the counterfactual is radically underdetermined. There is no unique way to strip knowledge from a belief system. If you remove knowledge of Mercury's orbit, do you also remove knowledge of Newtonian mechanics that depended on it? Do you remove knowledge of optics? The resulting "ur-prior" is a fiction constructed post-hoc to yield the desired result. It saves the phenomenon by inventing a psychological history that never happened. It treats Bayesianism as a justificatory tool rather than a descriptive one, which might be fine for some, but it leaves the *actual* cognitive process of Einstein unexplained. It solves the static intuition by ignoring the dynamic reality.

  ### The Logical Omniscience Fix (Garber/Jeffrey)

  The second approach, developed by Daniel Garber (and Richard Jeffrey and Ilkka Niiniluoto), attacks the assumption that $P(E)=1$ is the relevant constraint. It argues that the problem arises from assuming **logical omniscience**.

  Standard Bayesianism assumes agents know all logical consequences of their beliefs instantly. If you know $H$, you automatically know $H \vdash E$. But Einstein didn't. He had to work for months to derive the precession from the field equations. The new information Einstein received in 1915 was not $E$ (he already knew that); it was the logical fact **$H \vdash E$**.

  Garber proposes we expand the probability space to include sentences about logical relations. We conditionalize not on $E$, but on the proposition "H entails E."
  $$ P_{new}(H) = P_{old}(H | (H \vdash E)) $$
  Since $P_{old}(H \vdash E) < 1$ (Einstein wasn't sure GR could solve Mercury until he did the math), this update allows $P(H)$ to rise.

  This is the superior solution because it models *learning*. It acknowledges that deduction is a computational process that costs time and effort. For a bounded agent, discovering a logical consequence is genuinely new information. This solves the dynamic problem perfectly: it explains exactly how Einstein's credence changed in 1915.

  ### The "Static" Objection and the Category Error

  This brings us to your friend's objection: Garber solves the dynamic problem (Einstein's update), but not the static problem (why Mercury supports GR for us today). We *now* know $H \vdash E$. For us, $P(H \vdash E) = 1$. So, by Garber's own logic, Mercury provides no confirmation boost to a modern physicist.

  Your friend sees this as a failure. I argue it is a feature.

  The "static problem" assumes that confirmation is a timeless, logical relation between a theory and a fact, independent of any agent's knowledge state. It assumes that if $E$ supports $H$, it must *always* support $H$, regardless of when $E$ was discovered.

  But Subjective Bayesianism is not a logic of timeless support; it is a theory of **rational belief updating**. Confirmation is defined as an *increase* in probability ($\Delta P$). If you already know $E$, and you already know $H \vdash E$, there is no update to be had. $E$ is part of your background knowledge $K$.

  The intuition that Mercury "still confirms" GR today is a confusion of **confirmation** with **support**.
  *   **Confirmation** is dynamic: It is the *act* of evidence raising probability. (Did Mercury boost GR in 1915? Yes.)
  *   **Support** is static: It is the *state* of high posterior probability given background knowledge. (Does GR have high probability today given Mercury? Yes.)

  Bayesianism handles support trivially: $P(GR | Mercury) \gg P(GR)$. The theory is highly probable given the evidence. The "problem" only arises if you demand that *old* evidence must continue to generate *new* probability boosts indefinitely. But that's not how learning works. Once you've learned the lesson, the lesson stops being new.

  If you demand a theory that explains timeless support relations independent of epistemic history, you are not asking for Bayesian Confirmation Theory; you are asking for a Logic of Scientific Discovery or a theory of Explanatory Coherence. Bayesianism is a theory of how agents *change* their minds. If there is no change in information (because the logical relation is already known), there is no change in mind. That isn't a bug; it's the definition of the system.

  ### The Verdict

  So, where does this leave us?

  1.  **Reject the Counterfactuals:** Howson's approach is a mathematical trick that ignores the cognitive reality of the agent. It saves the "static" intuition by sacrificing the "dynamic" truth.
  2.  **Accept Bounded Rationality:** The Garber solution is the only one that respects the actual history of science. It requires us to modify standard Bayesianism to allow probabilities over logical relations, effectively admitting that agents are not logically omniscient.
  3.  **Dissolve the Static Problem:** We must reject the premise that Bayesianism needs to solve the static problem. The static problem arises from a Platonist view of evidence that Subjective Bayesianism explicitly rejects. For a Bayesian, evidence is always evidence *for an agent at a time*.

  **The Final Position:**
  Bayesian confirmation theory is saved, but only by retreating from the claim that it is a universal logic of scientific support. It is a logic of **epistemic dynamics for bounded agents**.

  The Mercury anomaly *did* confirm GR, because for Einstein, the entailment was new information. It does *not* confirm GR for us today in the dynamic sense, because for us, the entailment is background knowledge. It *supports* GR for us, in that our credence in GR is high conditional on Mercury, but it does not *confirm* it (raise our credence) because we have already updated.

  The "Problem of Old Evidence" is only a problem if you insist that Bayesianism must serve two masters: it must model psychological learning *and* provide a timeless metric of theory quality. It cannot do both. If we accept that its primary job is modeling rational learning (the dynamic), then the Garber solution works flawlessly. The "static" residue is not a failure of the math; it is a reminder that once evidence is old, its work is done.

  Bayesianism doesn't need a patch for old evidence. It needs a clearer definition of what "confirmation" means. If confirmation is belief change, old evidence confirms nothing for an omniscient god, but it confirms plenty for a human scientist. Since we are humans, not gods, the Garber solution is sufficient. The static problem is a ghost story we tell ourselves when we forget that probability is in the mind, not in the world.
