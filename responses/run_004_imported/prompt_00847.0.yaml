answer: |-
  This is one of the sharpest questions you can ask about Chang's work. It cuts right to the heart of whether she is making a substantive metaphysical claim about value or simply offering a therapeutic reframing of an old problem.

  The short answer is: **She is carving out a new evaluative relation, not just rebranding incomparability.** However, the distinction is subtle, and it rests entirely on what that relation *allows you to do*.

  If you treat parity as just "fancy incomparability," you miss the normative engine of her argument. Here is the breakdown of why "on a par" is technically and practically distinct from the everyday "apples-to-oranges" view.

  ### 1. Comparability vs. Non-Comparability
  The everyday notion of "incommensurability" (or incomparability) usually implies a breakdown of rational comparison. If Option A and Option B are truly "apples and oranges," the logic goes, there is no common scale to weigh them. Therefore, reason runs out. If you choose one over the other, you are acting on whim, preference, or a "leap of faith," but not on *reasons*.

  Chang's parity argues the opposite. She claims that hard choices are **comparable**, just not via the standard trichotomy (better, worse, equal).
  *   **Incommensurability:** The relation fails. Reason is silent.
  *   **Parity:** The relation holds. Reason is active, but it functions differently.

  For Chang, saying two things are "on a par" is saying they are in the same "neighborhood" of value. They are comparable in terms of overall goodness, but one does not dominate the other, nor are they precisely equivalent.

  ### 2. The "Small Improvement" Argument (The Logical Proof)
  Chang uses a technical argument to prove parity isn't just equality or incomparability. It's worth summarizing because it shows she isn't just playing with words.

  Imagine you are choosing between two careers: Artist and Banker.
  *   **If they were Equal:** Then if you made the Artist career *slightly* better (e.g., $1 more salary), the improved Artist career would strictly be *better* than the Banker career.
  *   **If they are On a Par:** You can make the Artist career slightly better, and it might *still* just be on a par with the Banker career. The tiny improvement doesn't tip the scale into "better."

  This breaks the logic of equality. If A = B, then A+ > B. If A is on a par with B, it is possible that A+ is still on a par with B. This suggests "on a par" is a distinct logical relation, not just a fuzzy version of equality or a failure of comparison.

  ### 3. The Normative Consequence: Finding vs. Creating Reasons
  This is the crux of her TED Talk and where the "rebrand" accusation falls apart. The definition of the relation dictates how you should act.

  **If it's Incommensurability (The Standard View):**
  Since there is no common scale, you cannot find a reason to pick one over the other. Any choice is essentially arbitrary. You are a passive detector of value, and since the detector is broken, you must guess. This leads to anxiety and the fear of "getting it wrong."

  **If it's Parity (Chang's View):**
  Because the options are comparable (they are in the same neighborhood of value), reason hasn't run out; it has just shifted gears. Since the external facts don't dictate one option as better, **you** have the normative power to *create* a reason.
  *   By committing to one of the on-a-par options, you generate reasons for that choice that didn't exist prior to the commitment.
  *   This transforms the hard choice from a threat (where reason fails) into an opportunity (where you exercise agency).

  So, parity is not just a description of the options; it is a description of the **agent's relationship to the options.**

  ### 4. Why the "Rebrand" Critique Persists
  Critics (like some decision theorists and moral realists) do argue that she is essentially relabeling incomparability. Their argument is:
  *   If A is not better, worse, or equal to B, then by definition, they are incomparable.
  *   Calling it "parity" is just a linguistic trick to make us feel less anxious about the fact that reason has hit a wall.
  *   Her "creation of reasons" is just post-hoc rationalization of an arbitrary choice.

  Chang's counter is that this view assumes a "Platonic" view of reasons (that they must exist "out there" in the universe to be found). She advocates for a "Existentialist" view of reasons (that agents can generate them through will). If you accept her meta-ethical framework, parity is real. If you hold that reasons must be mind-independent facts, then yes, parity looks like a rebrand.

  ### Summary for Your Piece
  You can frame it this way:

  The everyday idea of **incommensurability** is a dead end: it says, "These values are different languages; you can't translate, so you can't compare." It implies paralysis or arbitrariness.

  Chang's **parity** is a bridge: it says, "These values are different languages, but they are both poetry." It implies that while you can't measure them with a ruler, you can still judge them as belonging to the same category of significance.

  She isn't just rebranding incomparability to make it sound nicer; she is rebranding it to make it **actionable.** Incommensurability leaves you stuck; parity hands you the pen to write the next chapter. Whether that is a genuine metaphysical discovery or a pragmatic psychological tool depends on whether you believe reasons are found or made.

  **The Hook:** "Chang's 'parity' isn't just a semantic shield against the anxiety of incomparability; it's a claim that the gap between 'apples and oranges' is exactly where human agency lives."
