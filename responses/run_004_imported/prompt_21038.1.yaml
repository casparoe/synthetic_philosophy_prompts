          *   Tone: Professional, actionable, intellectually rigorous but accessible (no jargon like "Toxin Puzzle" explicitly, though the logic should underpin it).

  2.  **Determine the Recommendation:**
      *   *Option A: Hard No-Pay.* Good for deterrence theory, but likely non-credible in a life-or-death med center scenario. If the policy is known to be breakable under pressure, it fails the Kavka test (no one believes the intention).
      *   *Option B: Drop the Idea.* Too risky. Leaves the university vulnerable to ad-hoc panic decisions. No deterrence value.
      *   *Option C: Conditional/Structured (The "Resolute Choice" approach).* This aligns best with the user's philosophical background (McClennen's resolute choice vs. sophisticated choice). It acknowledges the time-inconsistency problem. It sets a high bar for exceptions (e.g., imminent threat to life) without leaving it to the panic of the moment. It attempts to make the intention *credible* by pre-committing to specific, narrow exceptions rather than a blanket ban that will inevitably be broken.
      *   *Decision:* I will recommend the **Conditional/Structured Version**. It bridges the gap. It allows Legal to claim a "presumption against payment" (deterrence) while allowing Med Center to save lives (operational reality). It addresses the credibility issue by making the exceptions explicit *now*, rather than leaving them to the heat of the moment.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
