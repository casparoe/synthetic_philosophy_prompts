          *   *Operational Reality (Med Center):* Acknowledges that patient safety trumps data policy. Reduces the burden on the incident commander in the moment.
          *   *The "Intention" Logic (Subtle):* Focus on *pre-commitment*. The decision must be made *before* the attack to have value.
