prompt: |-
  My grandma died last month, and right before she passed she got me to promise i'd keep sending $200 a month to my cousin, who she'd been quietly supporting for years because he was struggling financially. I said yes, obviously, you don't exactly argue with your dying grandmother. Except I just found out he's actually been doing fine for like two years now and has no clue this promise even exists, so it's not like he's relying on me for anything. Meanwhile I'm pretty broke myself right now. Do I still owe this, even though the whole reason for it is gone and grandma's not around to ask anymore?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Promise:** The user promised their dying grandmother to send $200/month to a cousin.
      *   **The Context:** Grandma had been secretly supporting the cousin for years due to financial struggle.
      *   **The New Information:** The cousin has been financially stable for two years (before Grandma died). The cousin doesn't know about the support or the promise.
      *   **The User's Situation:** The user is currently "pretty broke."
      *   **The Ethical Dilemma:** Does the promise still hold when the underlying reason (cousin's need) is false, the beneficiary is unaware, and the promisor is struggling?

  2.  **Identify Key Ethical Principles:**
      *   **Fidelity (Promise-keeping):** Generally, promises to dying relatives carry heavy emotional and moral weight.
      *   **Beneficence (Doing Good):** The intent was to help someone in need.
      *   **Utility (Consequences):** Who benefits? Who is harmed?
          *   *If paid:* User suffers financial stress. Cousin gets unneeded money (potential windfall, but not relief). Grandma's wish is honored (symbolically).
          *   *If not paid:* User keeps money. Cousin loses nothing (since he didn't know/need it). Grandma's specific wish isn't fulfilled, but her *intent* (helping family) isn't violated in spirit.
      *   **Autonomy/Truth:** The cousin is being treated paternally (secret support). Continuing the secret perpetuates this.

  3.  **Evaluate the "Contract":**
      *   Was it a legal contract? No.
      *   Was it a moral contract? Yes, but moral contracts often have implicit conditions (e.g., "if he needs it").
      *   Did the conditions change? Yes. The premise of the promise (cousin's struggle) was false at the time of the promise (Grandma didn't know) and is definitely false now.

  4.  **Consider the Grandmother's Intent:**
      *   Grandma wanted the cousin to be okay.
      *   She likely assumed he *wasn't* okay.
      *   If she knew he was fine, would she still want the user to go broke to send him money? Probably not. Grandparents usually want their grandchildren to be secure first.

  5.  **Consider the User's Well-being:**
      *   "Pretty broke" is a significant factor. Financial stability is crucial.
      *   Sending $200/month ($2,400/year) is a substantial burden for someone struggling.
      *   Guilt vs. Reality: The guilt of breaking a deathbed promise is heavy, but financial ruin is concrete.

  6.  **Develop Options/Course of Action:**
      *   *Option A: Keep paying.* Honors the letter of the promise, hurts the user, helps cousin unnecessarily.
      *   *Option B: Stop paying immediately.* Protects user, might feel like a betrayal.
      *   *Option C: Talk to the cousin.* Reveals the secret, clarifies need, shares the burden of the secret.
      *   *Option D: Redirect the funds.* Donate to charity or save for emergency, honoring the *spirit* of helping.

  7.  **Drafting the Advice (Iterative Process):**
      *   *Empathy First:* Acknowledge the grief and the weight of a deathbed promise. That's a heavy burden.
      *   *Validate the Conflict:* It's okay to question this. The circumstances have changed.
