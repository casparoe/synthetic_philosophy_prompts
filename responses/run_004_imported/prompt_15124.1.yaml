      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Toxin Puzzle:**
      *   *The Setup:* Billionaire offers money if you *intend* to drink a toxin tomorrow.
      *   *The Catch:* Money is deposited tonight based on the intention. Drinking happens tomorrow.
      *   *The Paradox:* Once you have the money, why drink? It makes you sick and gives no extra reward. Therefore, a purely rational agent cannot form the intention, because they know they won't follow through.
      *   *The Solution (Standard Rationalist View):* You need a way to bind yourself or change your utility function so that keeping the promise *itself* has value, overriding the immediate cost.
      *   *The Wedding Connection:* Marriage is a promise about the future. But unlike the toxin, the value isn't in the *act* of suffering (drinking), it's in the *shared life* built on trust. The "rationality" of marriage isn't transactional; it's constitutive.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the audience. Acknowledge the niche background (online forum) without alienating everyone. Introduce the bride's intellectual curiosity.
      *   **Explaining the Puzzle:** Keep it simple. No jargon like "utility function" or "backward induction." Use a story format.
          *   *Drafting thought:* "Imagine a rich guy offers you a million dollars..."
