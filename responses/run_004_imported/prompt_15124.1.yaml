answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I've had the privilege of being [Bride]'s friend for over a decade. We actually met on an internet forum dedicated to rationality and decision theory. I know, I know—try to contain your shock that she spends her free time debating logic puzzles.

  Because of that history, when she asked me to give this toast, she gave me one constraint: It had to reference Gregory Kavka's Toxin Puzzle.

  Now, for the ninety percent of you currently checking your phones to see if you missed the program notes: don't worry. I'm going to explain it in thirty seconds.

  Imagine an eccentric billionaire offers you a deal. He has a machine that can scan your brain and tell, with perfect accuracy, what you genuinely intend to do. He tells you: "If, by midnight tonight, you sincerely intend to drink this foul, harmless toxin tomorrow morning, I will deposit one million dollars into your bank account immediately."

  Here is the catch: You don't actually have to drink the toxin to get the money. You only have to *intend* to drink it. The money hits your account at 12:01 AM. The drinking would happen at 8:00 AM.

  The puzzle is this: Can you form that intention?

  A purely cold, calculating rationalist would say no. Because once midnight strikes, the money is already in your bank. At 8:00 AM, drinking the toxin makes you sick, gives you no extra money, and serves no purpose. Since you know you won't drink it tomorrow, you can't sincerely intend to drink it tonight. So, you never get the money.

  [Bride] and I spent years arguing about this. She argued that the puzzle assumes you're a stranger to your future self. She believed that a rational person *could* solve this, not by tricking themselves, but by valuing something more than the immediate transaction: their own integrity. She argued that if being a person who keeps commitments is part of your identity, then the "cost" of the toxin is outweighed by the cost of becoming a liar.

  And that brings me to why this matters for today.

  On the surface, marriage might look a bit like the Toxin Puzzle. You stand here today, making promises about how you will act in the future, often when it might be difficult or inconvenient. If you view marriage as a transaction—"I put in love, I get out security"—then the logic of the toxin applies. Why keep the vow when it's hard? The "money" is already in the bank. You're already married.

  But [Bride] taught me that the Toxin Puzzle only works if you are alone. It only works if you are trying to maximize your own utility in a vacuum.

  Marriage is not a one-off transaction with a billionaire. It is an infinite game played with a partner.

  [Bride], you are the kind of person who realizes that the only way to solve the puzzle is to change the game. You don't keep your vows because you are forced to, or because you calculated it's profitable in the moment. You keep them because you are building a life where the "cost" of sacrifice isn't a loss—it's an investment in the "we."

  In the Toxin Puzzle, drinking the poison is a solitary suffering. In a marriage, the hard things are shared burdens. When you commit to [Groom], you aren't binding your future self to suffer for no reason. You are binding your future self to a partnership where the hard things become meaningful *because* you face them together.

  [Bride], you have always been the person who proves that rationality isn't about being cold. It's about understanding what actually has value. And you have shown me, and everyone in this room, that the most rational thing you can do is bet on love, bet on integrity, and bet on the person standing next to you.

  [Groom], she's going to keep her vows. Not because she has to, but because she's decided that being your wife is more important than being right, or being comfortable, or taking the easy way out.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May you always find that the best way to solve life's puzzles is to solve them together. And may you never have to drink any toxins—unless, perhaps, it's a really expensive bottle of wine that you're saving for a special occasion.

  To the happy couple!
