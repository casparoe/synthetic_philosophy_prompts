      *   *The Resolution:* It's about *mode of representation* vs. *content of analogy*.
      *   **Key Distinction:** Other arts represent the Ideas *directly* (mimetically/conceptually). Music represents the Will *directly*, but because the Will *objectifies itself* as Ideas, the structure of the Will (as heard in music) necessarily parallels the structure of the Ideas.
      *   **Analogy:** Think of a shadow vs. the object casting it. Other arts paint the shadow (Ideas). Music is the vibration of the object (Will). However, the vibration has a structure that corresponds to the shape of the shadow, because the shadow comes from the object.
      *   **Schopenhauer's Logic:** The Will is One. The Ideas are the graded objectification of that One Will. Music is the copy of the Will. Therefore, the internal structure of music must mirror the internal grading of the Will's objectification (the Ideas), *without* music needing to pass through the conceptual/visual mediation of the Ideas.
      *   **Direct vs. Indirect:** Other arts: Will -> Idea -> Phenomenon -> Art (Copy of Idea). Music: Will -> Music (Copy of Will). *However*, since the Idea is just the Will seen through a certain lens, the Music (Copy of Will) runs parallel to the Idea-hierarchy.
      *   **Crucial Phrase:** "Parallelism." Schopenhauer uses the word "parallel." Music is an *unconscious metaphysics* of the world. It doesn't *depict* the minerals; it *enacts* the same striving that constitutes minerals, but in sound.

