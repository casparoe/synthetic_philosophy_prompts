answer: |-
  This is one of the most technical and enduring debates in the philosophy of language. Your friend has identified the single greatest vulnerability in the supervaluationist project: the problem of **Higher-Order Vagueness (HOV)**.

  While supervaluationism successfully models first-order vagueness (the boundary between "bald" and "not bald"), it notoriously struggles to model the vagueness of that boundary itself without contradicting its own semantic machinery.

  Below is the strongest reconstruction of the argument against supervaluationism on this front. It is structured as a dilemma: Supervaluationism must either accept sharp boundaries at the meta-level (collapsing into epistemicism) or initiate a vicious regress that destroys its semantic coherence.

  ***

  ### The Argument from the Sharpness of the Meta-Language

  **Thesis:** Supervaluationism cannot account for higher-order vagueness without violating its core motivation (the rejection of sharp cutoffs) or abandoning the classical logic that defines its technical utility.

  #### 1. The Semantics of "Definiteness"
  Standard supervaluationism defines truth as **supertruth**: a sentence $p$ is true if and only if it is true on all *admissible precisifications* of the language. To handle vagueness, it introduces a "definitely" operator ($D$).
  *   $Dp$ is true iff $p$ is true on all admissible precisifications.
  *   $p$ is borderline iff $p$ is true on some admissible precisifications but false on others.

  For this semantics to function, the set of **admissible precisifications** must be well-defined. We must be able to determine, for any candidate precisification, whether it is "in" the set of admissible ones or "out."

  #### 2. The First Horn: Sharp Meta-Language (Collapse into Epistemicism)
  To define supertruth, the supervaluationist relies on a classical meta-language. In classical logic, predicates have sharp extensions. Therefore, the meta-linguistic predicate *"is an admissible precisification"* must have a sharp extension.
  *   There is a specific point where a precisification shifts from being admissible to inadmissible.
  *   Consequently, there is a sharp boundary between sentences that are true on *all* admissible precisifications ($Dp$) and those that are not ($\neg Dp$).
  *   This creates a sharp cutoff between the "definitely true" cases and the "borderline" cases.

  **The Implication:** This replicates the epistemicist position exactly, merely one level up. Williamson argues there is a sharp cutoff between "bald" and "not bald" that we cannot know. The supervaluationist denies this first-order cutoff but admits a sharp cutoff between "definitely bald" and "not definitely bald."
  *   **Why this fails:** The intuitive motivation for supervaluationism is that there are **no sharp boundaries** in vague discourse. By positing a sharp boundary at the level of $D$, the supervaluationist violates the very intuition their theory was designed to respect. They have not eliminated sharp cutoffs; they have merely hidden them in the meta-language. This is functionally equivalent to epistemicism regarding the distribution of truth values, differing only in metaphysical labeling.

  #### 3. The Second Horn: Vague Meta-Language (Vicious Regress)
  Suppose the supervaluationist tries to avoid this by claiming that the boundary of admissibility is *itself* vague. They might argue that "admissible precisification" is a vague predicate, allowing for borderline cases of precisifications.
  *   **The Problem:** If the set of admissible precisifications is vague, the definition of supertruth becomes incoherent. Supertruth is defined by a universal quantifier over the set of admissible precisifications ($\forall P \in Admissible$).
  *   If the set *Admissible* is vague, the quantifier lacks a determinate domain. We cannot determine if $p$ is true on *all* of them if we cannot determine which ones count as "them."
  *   **The Regress:** To fix this, the supervaluationist must introduce a higher-order semantics to define the boundaries of the first-order precisifications. They need "precisifications of precisifications."
      *   But if *this* higher-order boundary is sharp, we face the First Horn (Epistemicism) again.
      *   If *this* higher-order boundary is vague, we need a third-order semantics.
  *   **The Result:** This triggers an infinite regress. To explain the vagueness of order $n$, you need a precise semantics of order $n+1$. If you ever stop at a precise level to ground the theory, you have accepted sharp boundaries (Epistemicism). If you never stop, the theory never provides a truth condition for any statement.

  #### 4. The Logical Collapse (The S4/S5 Problem)
  Beyond the semantic regress, there is a logical proof that standard supervaluationism cannot model genuine higher-order vagueness.
  *   In standard supervaluationism, the logic of the $D$ operator is typically **S4** or **S5** modal logic.
  *   A key theorem of S4 is: $Dp \to DDp$ (If $p$ is definitely true, it is definitely definitely true).
  *   **The Conflict:** If there is genuine higher-order vagueness, there should be borderline cases of "definitely true." That is, there should be cases where $Dp$ is true, but $DDp$ is false (it is borderline whether $p$ is definite).
  *   However, if $Dp \to DDp$ holds, the boundary of $D$ is sharp. Once you are in the "definitely" zone, you are securely in it; there is no fuzzy edge to the "definitely" region.
  *   To model genuine HOV, the logic of $D$ must be weaker than S4. But if the logic is weaker, supervaluationism loses its ability to preserve classical logic for non-borderline statements, which is its primary technical advantage over fuzzy logic or intuitionism.

  ### Conclusion: The Inescapable Trilemma

  Your friend's objection holds because the supervaluationist is trapped in a trilemma. Regarding higher-order vagueness, they must choose one of the following:

  1.  **Accept Sharp Meta-Boundaries:** Admit that "admissible precisification" is a sharp predicate. **Result:** The theory collapses into epistemicism at the meta-level, violating the core intuition that vagueness precludes sharp cutoffs.
  2.  **Accept Vague Meta-Boundaries:** Claim "admissible precisification" is vague. **Result:** The definition of truth becomes incoherent, or the theory triggers a vicious regress of higher-order semantics that never grounds out.
  3.  **Alter the Logic:** Weaken the logic of $D$ (reject S4) to allow borderline definiteness. **Result:** The theory loses its ability to validate classical logic (e.g., Excluded Middle) for precise statements, surrendering its main advantage over rival theories.

  **The Verdict:** Supervaluationism claims to offer a middle path between classical sharpness and logical revisionism. However, the problem of higher-order vagueness demonstrates that this middle path is illusory. To make the theory formally coherent, one must employ a classical meta-language, which reintroduces the sharp cutoffs the theory sought to eliminate. Therefore, supervaluationism does not solve the problem of vagueness; it merely relocates the mystery from the object language to the meta-language, leaving it functionally indistinguishable from the epistemicism your friend defends.
