answer: |-
  ### The Empirical Challenge: Prosocial Lying and the Fragmentation of Moral Motives

  To move beyond the standard situationist critique—which typically focuses on cross-situational inconsistency (e.g., helping in one context but not another)—we must examine findings that threaten the **Reciprocity of the Virtues** (the Unity Thesis). The Unity Thesis, rooted in Socratic and Aristotelian thought, posits that the virtues are not isolated traits but mutually entailing dispositions bound by *phronesis* (practical wisdom). On this view, one cannot truly possess Honesty without Justice, nor Loyalty without Wisdom, because all virtues stem from a single, coherent grasp of the human good (*eudaimonia*).

  A potent empirical challenge to this thesis comes from the research on **prosocial lying** (e.g., Levine & Schweitzer, 2014, 2015; Erat & Gneezy, 2012).

  **The Finding:**
  In a series of experiments, Levine and Schweitzer demonstrated that individuals who lie to benefit others (prosocial liars) are often trusted *more* and judged as *more ethical* than truth-tellers who cause harm by being blunt. For example, in a trust game paradigm, participants were more likely to trust a partner who had previously lied to them to protect their earnings than a partner who told the truth and caused them to lose money. Crucially, the liars themselves did not experience the typical cognitive dissonance or moral distress associated with dishonesty; they viewed their deception as morally laudable.

  **Why This Threatens the Unity of Virtues:**
  This finding does not merely show that people are inconsistently honest. It shows that moral agents systematically treat virtues as **tradeable commodities** rather than unified expressions of character.
  1.  **Compartmentalization:** The Unity Thesis claims that *phronesis* integrates moral demands. A truly virtuous agent should perceive that Benevolence (caring for the other) and Honesty (respecting the other's autonomy/reality) are harmonized in the *kalon* (the noble). The prosocial lying data suggests that for most agents, these are modular, competing impulses. They feel they can "purchase" Benevolence by spending Honesty.
  2.  **Absence of *Phronesis*:** If *phronesis* were present, the agent would recognize that deception, even for benevolent ends, undermines the relational good that Benevolence seeks to promote. The fact that agents feel *morally justified* in fragmenting these virtues suggests that the psychological architecture of moral judgment is not unified by a single rational conception of the good, but is instead a collection of distinct heuristic modules (e.g., "care" vs. "fairness/truth") that can override one another without a higher-order rational integration.

  This is a deeper threat than standard situationism. A virtue ethicist can admit that a virtuous person might fail to help due to fatigue (inconsistency). It is much harder to admit that a virtuous person could sincerely believe that *violating* one virtue is the correct way to *fulfill* another, as this implies a fundamental error in practical reasoning that the Unity Thesis claims true virtue precludes.

  ***

  ### The Neo-Aristotelian Response: Julia Annas's Skill Model

  The most promising line of response for a neo-Aristotelian, particularly one following **Julia Annas** (e.g., *Intelligent Virtue*, 2011), is to reject the assumption that the participants in these studies are exhibiting *virtue* at all. Annas argues that virtue is structurally analogous to a **practical skill** (like playing the piano or practicing medicine), and this analogy provides a robust defense against the fragmentation implied by the prosocial lying data.

  **1. The Novice vs. Expert Distinction**
  Annas emphasizes that possessing a skill is a matter of degree. There is a vast difference between a novice pianist who plays the right notes but lacks expression and understanding, and a master who understands *why* the notes are played. Similarly, the participants in the prosocial lying studies are **moral novices**. They are exhibiting what Aristotle called "natural virtue" (*aretē physikē*)—a temperamental inclination toward care or loyalty—rather than "strict virtue" (*aretē kuriē*), which requires *phronesis*.
  *   **Response:** The finding does not show that Honesty and Benevolence are incompatible in a unified character. It shows that in the absence of *phronesis* (the expert understanding of the good), agents rely on crude heuristics. The fact that novices trade honesty for care no more disproves the Unity of Virtues than a novice pianist pounding out a melody with poor rhythm disproves the unity of musical technique.

  **2. Understanding vs. Behavior**
  For Annas, virtue is not just about doing the right thing; it is about doing it *for the right reason* and understanding *why* it is right. The Unity Thesis is a claim about the architecture of **practical reasoning**, not just behavioral output.
  *   **Response:** The prosocial liars lack the intellectual component of virtue. They fail to see that true Benevolence requires respecting the other's agency, which Honesty protects. A neo-Aristotelian can concede that the study participants fragment these values but argue that this fragmentation is precisely the definition of *vice* or *immaturity*, not a counter-example to ideal virtue. The Unity Thesis is a normative claim about the structure of *flourishing* agency, not a descriptive claim about the average psychological state of undergraduate participants.

  **3. The Aspiration to Unity**
  Annas's model treats virtue as an aspirational project. The "unity" of the virtues is the endpoint of moral development, where the agent learns to harmonize competing moral demands through experience and reflection.
  *   **Response:** The empirical data captures agents mid-journey. The tension they feel (or fail to feel) between Honesty and Benevolence is the raw material that *phronesis* is meant to resolve. The existence of the conflict confirms the need for *phronesis*, rather than disproving its possibility. The neo-Aristotelian argues that if these agents were to engage in the reflective practice characteristic of virtue (what Annas calls "aspiration"), they would eventually realize that the "prosocial lie" is a failure of imagination—a failure to find a way to be both kind and truthful.

  **Conclusion**
  The prosocial lying finding threatens the Unity of Virtues by suggesting that moral motives are modular and tradeable. However, Annas's skill model deflects this by re-categorizing the data: it describes the behavior of moral learners who have not yet integrated the goals of their "craft." The Unity Thesis remains intact as a claim about the structure of **moral expertise**, which the situationist experiments, by design, fail to capture. The defender argues that we should not expect the unity of the *phronimos* in data collected from the morally untrained.
