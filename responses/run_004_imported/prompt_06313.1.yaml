answer: |-
  It's great to hear from someone who's spent time in the trenches of experimental physics. You've got the right instinct for this: decision theory is often just statistics with consequences, and Good's theorem is one of those results that feels like it *ought* to be true, but you want to know exactly which gear turns which.

  Here is the back-of-the-envelope version of Good's theorem, followed by why the Hirshleifer effect doesn't break it, but rather steps outside its laboratory conditions.

  ### Part 1: The Intuition Behind Good's Theorem

  Your hunch ("you can always fall back on ignoring the evidence") is the right starting point, but to make it airtight, we need to tighten the logic slightly. The core trick isn't just that you *can* ignore the data; it's that you *optimize* based on the data, and the "maximum" function is convex.

  Here is the physicist's version of the proof.

  **1. The Setup**
  Imagine you have a decision to make (Action $A$ or Action $B$) and a state of the world ($\theta$). You have a utility function $U(Action, \theta)$.
  *   **Scenario 1 (No Look):** You calculate the expected utility for $A$ and $B$ based on your current prior. You pick the winner. Let's call this maximum expected value $V_{prior}$.
  *   **Scenario 2 (Look):** You observe data $D$. Now you have a posterior distribution for $\theta$. For *every specific outcome* of $D$, you recalculate the expected utility for $A$ and $B$ and pick the new winner.

  **2. The Inequality**
  The mathematical heart of Good's theorem is this inequality:
  $$ E_D [ \max_{Action} E_\theta [ U | D ] ] \ge \max_{Action} E_\theta [ U ] $$
  In plain English: **The expectation of the maximum is greater than or equal to the maximum of the expectation.**

  **3. The "Beer Mat" Explanation**
  Think of your decision rule as a cut you're placing on a histogram.
  *   **Without data:** You place the cut where you think the signal-to-noise is best on average. That's your baseline efficiency.
  *   **With data:** You get a calibration run.
      *   **Case 1:** The calibration says, "Your original cut was actually perfect." You keep the cut. Your efficiency is exactly the same as the baseline.
      *   **Case 2:** The calibration says, "Shift the cut to the left." You shift it. Because you only shift if it *improves* the expected efficiency for that specific calibration, you are now doing better than the baseline would have done for this specific case.
      *   **Case 3:** The calibration says, "Shift the cut to the right." Same logic. You improve.

  You never shift the cut to make things *worse*. You only shift when the new evidence tells you the old plan is sub-optimal.
  *   When the evidence agrees with your prior plan, you break even.
  *   When the evidence contradicts your prior plan, you gain.
  *   Since you can't lose, the average (expected) gain must be non-negative.

  **Where your intuition needed a tweak:**
  You said, "Looking can only open up better options." Technically, the *menu* of options (Action A vs. Action B) stays the same. What opens up is your **ability to discriminate**. You aren't adding a new button to the control panel; you're getting a better readout on which existing button to press. The "fallback" argument works because the strategy "Ignore $D$ and do what I would have done" is always *available* in Scenario 2, but the strategy "Use $D$ to optimize" is strictly dominant or equal.

  ### Part 2: The Hirshleifer Effect (The Wrinkle)

  Now, to the Hirshleifer effect. This is where economics gets messy, and it looks like a contradiction: Information comes in, and people end up poorer (in expected utility terms).

  **The Setup:**
  Imagine two farmers. One grows wheat (does well in dry years), one grows corn (does well in wet years). They don't know the weather yet. They can write an insurance contract: "I'll give you half my crop if it's dry, you give me half if it's wet." Because they are both ignorant, they can pool risk. Both sleep better.
  **The Information:**
  Now, suppose a perfect weather forecast becomes available *before* they sign contracts.
  **The Result:**
  If the forecast says "Dry," the wheat farmer has a valuable asset and the corn farmer has nothing. The wheat farmer won't insure the corn farmer because he knows he won't need the payout. The insurance market collapses. The corn farmer is exposed to ruin. Ex-ante (before the forecast exists), both farmers would have preferred *not* to have the forecast available, because it destroyed their ability to share risk.

  **Why this doesn't violate Good's Theorem:**
  Good's theorem has a silent, critical assumption that the Hirshleifer effect violates: **The Action Space must be fixed and independent of the information.**

  In Good's theorem, the set of actions $\{A, B\}$ is like the buttons on your detector console. They exist whether you look at the data or not.
  In the Hirshleifer effect, the "actions" are **contracts offered by other agents**.
  *   When you are ignorant, the set of available actions includes "Sign Insurance Contract."
  *   When you (and the counterparty) are informed, the set of available actions *shrinks*. "Sign Insurance Contract" disappears from the menu because the counterparty updates their priors and withdraws the offer.

  Good's theorem guarantees that information is valuable **for a single agent facing a passive world**. It says: "If the menu is fixed, knowing more helps you order better."
  The Hirshleifer effect happens in a **multi-agent game** where the menu itself depends on what everyone knows. The information changes the *rules of the game*, not just the player's strategy.

  **The "Airtight" Distinction:**
  1.  **Good's Theorem:** Decision Theory. Single agent. World is passive. Action set is constant. Information reduces uncertainty about the *state*.
  2.  **Hirshleifer Effect:** Game Theory / General Equilibrium. Multiple agents. World is reactive (other people change behavior). Action set is endogenous (depends on info). Information changes the *feasible set of contracts*.

  ### Summary for the Labmate

  If you're sitting at the pub, here's the pitch:

  "Good's theorem is basically Jensen's inequality applied to decision making. Since you always pick the best action for what you know, and knowing more never forces you to pick a worse action than you would have picked blind, the average value of looking is positive. It's like having a free trigger monitor; you never trigger worse than you would have blindly.

  The Hirshleifer effect isn't a bug in Good's theorem; it's a different experiment. Good assumes the detector stays on regardless of what you see. Hirshleifer is when the funding committee sees your data and decides to turn the detector off. If the information causes the *options themselves* to vanish (because other people react to the info), then you've violated the 'fixed action space' assumption. Good's theorem guarantees information is valuable for *control*, but it doesn't guarantee information is valuable for *commitment* or *risk-sharing*."

  So, your intuition was 90% there. The missing 10% is recognizing that "ignoring the evidence" is only an option if the evidence doesn't cause the rest of the world to change the rules on you.
