          3.  With data, you get a signal. Sometimes the signal says "Stick with A," sometimes it says "Switch to B."
          4.  If the signal says "Stick with A," you do as before (value = old value).
          5.  If the signal says "Switch to B," it means B is now better than A *given that signal*. So you gain value relative to sticking with A.
          6.  You never switch to something worse. So the average outcome is (Old Value) + (Gains from switching when beneficial). Gains are $\ge 0$.
      *   *Key Mathematical Insight:* $E[\max_x E[U|x]] \ge \max_x E[U]$. The expectation of the maximum is greater than the maximum of the expectation. (Jensen's inequality applied to the convex max function).

