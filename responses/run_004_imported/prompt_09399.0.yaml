answer: |-
  This is a superb disagreement to be having. You and your friend have stumbled upon one of the central fault lines in contemporary social ontology: the debate between **reductionist** accounts of shared action (which try to explain "we-ness" using only individual intentions and beliefs) and **non-reductionist** accounts (which posit that shared agency requires a distinct, irreducible kind of commitment or subject).

  Your friend is right that Hume is the grandfather of the reductionist project. You are right that Hume's account feels like it leaves out the normative "glue" that philosophers like Margaret Gilbert and Michael Bratman insist upon.

  To help you take this back to your friend, we need to dissect exactly what work Hume thinks "mutual expression" is doing, and then measure Hume's rowers against the Bratman/Gilbert bar.

  ### 1. What is doing the argumentative work in Hume's passage?

  You ask whether Hume's requirement that the sense of interest be "mutually express'd, and known to both" is a substantive ingredient or just a description of accurate expectations.

  **It is a substantive ingredient.** It is the difference between a *guess* and a *convention.*

  If I merely expect you to row because I know you are strong and want to get to shore, that is a private prediction. If you row for the same reason, we might coordinate. But if the water gets choppy, or I get tired, my private prediction might change, and I stop.

  When Hume says the sense of interest is "mutually express'd," he is describing the creation of **common knowledge** (or at least mutual knowledge).
  *   I know it is in my interest to row *if* you row.
  *   You know it is in your interest to row *if* I row.
  *   **Crucially:** I know that *you know* that I know this.

  This recursive knowledge transforms the situation from a Prisoner's Dilemma (where I might defect to save energy) into a Coordination Equilibrium. The "expression" (which Hume notes can be non-verbal, like the rhythm of the oars) signals that *I am relying on your knowledge of my reliance.*

  So, Hume is not merely saying "they have accurate expectations." He is saying "they have established a stable equilibrium of expectations through signaling." This is the "work" being done: it explains how stability arises without a contract.

  ### 2. Do Hume's rowers have "interlocking intentions"?

  You noted Hume's phrase: *"the actions of each of us have a reference to those of the other, and are perform'd upon the supposition, that something is to be perform'd on the other part."*

  You are astute to notice that this sounds very much like the **mutual responsiveness** that Michael Bratman identifies as a criterion for shared intention. Hume is indeed describing interlocking intentions. However, there is a subtle but vital difference in the *direction of fit*.

  *   **Hume's Rowers:** My intention is conditional. "I intend to pull *given that* you pull." My goal is my own interest (getting to shore/saving goods), and your action is a condition for my achieving it. The "reference" to your action is causal and prudential.
  *   **Bratman's Shared Intention:** The intention is joint. "We intend to row." My sub-plan is to pull *as part of our rowing.* If you stop, I don't just recalculate my interest; I recognize that *our* action has failed.

  Hume anticipates the structure of interlocking intentions but grounds them entirely in **convergent self-interest**. Bratman argues that convergent self-interest isn't enough for *shared* agency; you need the intentions to be about the *joint activity* itself, not just the individual outcome facilitated by the other.

  ### 3. Do they clear the Gilbert/Bratman bar?

  Here is where your intuition and your friend's citation likely talk past one another. They are answering different questions.

  **Margaret Gilbert (Joint Commitment):**
  Gilbert sets a very high bar. For her, acting together requires a **plural subject**. We must be jointly committed to emulating a single body. This creates normative obligations: if I stop rowing, you don't just get annoyed; you have a *right to rebuke* me.
  *   **Do Hume's rowers clear this?** **No.** Hume explicitly says this is *not* a promise and *not* an agreement in the binding sense. For Hume, if I stop rowing, you might be inconvenienced, and you might stop too, but you haven't been *wronged* in the normative sense. You've just encountered a change in circumstances that makes rowing no longer in your interest. Hume offers a causal explanation of cooperation; Gilbert offers a normative account of obligation.

  **Michael Bratman (Shared Intention):**
  Bratman is somewhere in the middle. He wants to avoid Gilbert's "mystical" plural subjects but thinks simple convergence (like two strangers walking side-by-side to avoid rain) isn't enough. He requires that we intend the joint action *because* of the other's intention.
  *   **Do Hume's rowers clear this?** **Debatable.** Hume's rowers come very close. They are mutually responsive. They adjust their sub-plans (the rhythm of the stroke) to match the other. However, a Bratmanian might argue that Hume's rowers are still operating on "I-intentions" (I intend to do my part) rather than "We-intentions" (We intend to row). If the boat springs a leak, do they bail water *together*, or does each bail their own side because it's still in their interest? Hume's model works best for coordination; it struggles with scenarios where individual interest diverges from joint success but the joint action continues anyway (e.g., sacrificing personal ease for the team).

  ### 4. The Verdict on the Coworkers

  Returning to your mundane case: Two coworkers divide a task cleanly, trusting competence, barely discussing it.

  *   **Your Friend (The Humean):** Will argue this is a paradigm case of **Convention**. The "mutual expression" is the workflow itself. I see you start the report, so I start the data analysis. We both know we are doing this because it benefits us both to finish the project. No "shared mind" is needed; just common knowledge of interest. This is not mystification; it is efficient social engineering.
  *   **You (The Gilbertian/Bratmanian):** Will argue this is **Parallel Play**. Unless they have a standing commitment to help each other if things go wrong (e.g., "If your data fails, I will help you fix it even if it delays my part"), they are not acting *together*. They are merely acting *in tandem*. If the project hits a snag that requires one to sacrifice their own efficiency for the other's sake, Hume's model predicts they might defect. A Shared Agency model predicts they would stay the course because they are committed to *us*, not just *me*.

  ### How to reply to your friend

  You can concede that Hume successfully explains the **genealogy** of cooperation without magic. He shows how "acting together" can emerge from individual psychology without a social contract. In that sense, he avoids mystification.

  However, you can maintain that Hume does not explain the **ontology** of shared agency.
  1.  **Normativity:** Hume explains why we *do* cooperate (interest), but not why we feel we *ought* to continue cooperating when interest wavers (commitment).
  2.  **The "We":** Hume's rowers have interlocking "I-intentions." They do not necessarily have a "We-intention."

  **The Synthesis:**
  Tell your friend: "Hume is right that we don't need a promise to coordinate. His account of 'convention' via common knowledge of interest is brilliant and sufficient for explaining stable coordination (like rowing or traffic laws). However, it is not sufficient for explaining **joint commitment**. If my coworker and I are merely calculating interests, we are partners of convenience. If we are acting 'together' in the full sense, I am answerable to you not just because it is useful, but because we are in it as a unit. Hume explains the mechanics of the boat moving; he doesn't explain the bond between the rowers."

  This grants your friend the textual victory (Hume does explain coordination without promises) while securing your philosophical point (coordination isn't the same as shared agency). Hume describes the *conditions* for acting together; Gilbert and Bratman describe the *state* of acting together.
