  1.  **Analyze the User's Query:**
      *   **Context:** The user is a journalist/reporter writing about sensory changes in new parents.
      *   **Observation:** Multiple mothers reported being able to identify their newborn's cry almost immediately after birth, even in a noisy nursery, without conscious effort.
      *   **Expert Opinion:** A psychologist dismissed this as "just attention," implying no physiological change in hearing, just cognitive prioritization.
