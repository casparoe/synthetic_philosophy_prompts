answer: |-
  The readout on the monitor was a single, jagged green line against a black field. To Elias, it looked like a mountain range. To Mara, it looked like a stutter.

  They were standing in the dim glow of the Spectral Analysis Lab at the Institute. Outside, the rain battered the glass, but inside, the only sound was the hum of the cooling fans and the tension tightening between the two physicists.

  Elias, sixty, with fingers stained by decades of chemical developers, pointed a trembling digit at the highest peak on the graph. "There," he said. "The saturation point. The Aether is fully compressed. If we push the voltage any higher, the vessel ruptures."

  Mara, thirty, didn't look at the peak. She was looking at the space between the peaks. She adjusted her glasses, her expression not one of disagreement, but of mild, polite confusion. "Elias, there is no compression. The Aether doesn't compress. It displaces."

  "It has density," Elias said, his voice tight. "We measured the specific gravity of the field in '98. You know this. When the needle spikes, the density increases. That is *pressure*."

  Mara turned to him. She didn't look annoyed; she looked like she was trying to translate a language that had no verbs. "Pressure implies a container. Pressure implies a substance pushing against a wall. But the field *is* the wall. The spike isn't pressure, Elias. It's a frequency shift. The field isn't getting heavier; it's getting faster."

  Elias sighed, rubbing his temples. This was the third time they had had this conversation this week. It was the third time they had had this conversation for three years, ever since Mara's cohort had taken over the doctoral program.

  "If it's just frequency," Elias said, picking up his stylus, "then explain the heat. Why does the containment ring glow red when the needle spikes? Friction requires resistance. Resistance requires *stuff* rubbing against *stuff*."

  "Thermal emission is a byproduct of state change, not friction," Mara said. She stepped forward and tapped the screen, right on the downward slope of the mountain. "See this decay? In your model, this is the Aether leaking out. Bleeding."

  "Exactly," Elias said. "Loss of mass."

  "In my model," Mara said softly, "that isn't a loss. It's a relaxation. The system is returning to equilibrium. Nothing left. Nothing bled. It just... stopped vibrating."

  Elias stared at her. He felt a familiar vertigo, the same sensation he got when he looked at one of the new textbooks. The words were English. The math was calculus. But the ontology—the furniture of the universe—was wrong.

  "You can't measure the leak?" Elias asked.

  "There is no leak to measure," Mara said.

  "Then what are you measuring when you calibrate the intake?"

  "Input variance."

  "Which is?"

  "The difference between the expected node and the actual node."

  Elias threw his hands up. "Expected by what standard? If you don't have a baseline mass, what are you comparing it to?"

  "We compare it to the vacuum state."

  "The vacuum is empty!"

  "The vacuum is the ground state," Mara corrected. "It's not empty. It's zero-potential."

  Elias turned back to the screen. He saw a mountain. He knew, with the certainty of instinct, that if he drilled into that mountain, he would find rock. He could calculate the tonnage. He could predict the stress fractures. His entire career, the safety protocols he had written, the machines he had built—they all relied on the mountain being real.

  Mara saw a stutter. She saw a glitch in a code. To her, asking for the tonnage of the mountain was like asking for the weight of a sigh.

  "Look," Elias said, trying one more time. He pulled up a schematic of the containment unit. "If I open valve three, the Aether flows to chamber B. Why? Because of the gradient. High to low. Like water."

  "Valve three changes the boundary conditions," Mara said, tracing the line of the pipe on the screen. "It alters the geometry of the field. The field reconfigures to minimize energy. It flows because that is the path of least resistance, not because it is being pushed."

  "It is being pushed!" Elias slammed his hand on the console. "The pump provides force!"

  "The pump provides excitation."

  "Force! Excitation! It's the same thing!"

  "No," Mara said. Her voice was calm, which infuriated him more than shouting would have. "It's not the same thing. Force is a vector. Excitation is a state. If I tell you the field is excited, I am telling you *what it is*. If I tell you it has force, I am telling you *what it is doing*. You think the doing is the being."

  Elias fell silent. He looked at the green line again. He tried, for a moment, to see it as Mara did. He tried to stop seeing it as a trace of a substance moving through time and see it as a static object existing in a multi-dimensional geometry.

  He squinted. He tilted his head.

  For a fraction of a second, the mountain wavered. The peak didn't look like a pile of accumulated stuff; it looked like a sharp turn.

  But then the image snapped back. The mountain was solid again. He could feel the weight of it pressing against his eyes.

  "I need to know the flow rate," Elias said, his voice quiet. "For the safety report. I need to know how much Aether passes through the valve per second."

  Mara looked at him. He saw a flicker of pity in her eyes, and that was the worst part. She didn't think he was wrong. She thought he was *archaic*.

  "I can give you the energy transfer rate," Mara said.

  "I need the mass flow."

  "I can't give you that."

  "Why not?"

  "Because the equation doesn't solve for mass. There is no variable for it."

  "Then add one."

  "I can't. It would be like adding a variable for 'phlogiston' to a combustion engine. It would just equal zero. It would break the math."

  Elias picked up his stylus again. He hovered it over the peak. "So you're saying this..." He tapped the glass. "...is nothing."

  "I'm saying it's not a *thing*," Mara said. "It's an event."

  "An event doesn't break pipes."

  "Energy breaks pipes."

  "Energy is a property of things!"

  "Energy is the capacity to do work. It doesn't need a thing to belong to. It belongs to the system."

  Elias put the stylus down. He realized then that they were not arguing about the data. They were not even arguing about the theory. They were arguing about the world.

  He was standing in a room filled with pipes and tanks and fluids. She was standing in a room filled with fields and nodes and geometries. They were looking at the same monitor, but they were not seeing the same image.

  "Can you translate it?" Elias asked. "For the report. Can you write it so the technicians understand? They need to know when the tank is full."

  Mara hesitated. She looked at the screen, then at him. "I can tell them when the field reaches critical density."

  "That means nothing to them."

  "It will have to."

  "It won't. They'll wait for the pressure gauge to redline."

  "The pressure gauge measures strain on the metal, not the field."

  "Which tells us how much Aether is in there."

  "Which tells us how much stress the metal is under."

  Elias laughed, a dry, humorless sound. "We're going in circles."

  "We're speaking different languages," Mara said. "Kuhn wrote about this. You know that."

  "I thought that was about history. About how we look at the past."

  "No," Mara said. She turned off the monitor. The green line vanished, leaving only their reflections in the dark glass. Two faces, overlapping. "It's about the present. It's about how we can't stand in the same room."

  Elias looked at his reflection. He looked old. He looked like a man who knew how the world worked, standing in a world that had quietly changed its rules while he wasn't looking.

  "Will the pipe hold?" Elias asked.

  Mara looked at the dark screen. "If the geometry remains stable, yes."

  "Will the geometry remain stable?"

  "I don't know. The variables are non-linear."

  Elias nodded. He picked up his notebook. He wrote: *Check pressure gauge at 0800.*

  He knew, as he wrote it, that the instruction was meaningless. The gauge measured strain. The strain was real. But the *cause* of the strain was a ghost to her, and the *solution* she proposed was a ghost to him.

  "Goodnight, Elias," Mara said.

  "Goodnight, Mara."

  She left the room. The door clicked shut.

  Elias stood alone in the dark. He reached out and touched the cold glass of the monitor. He tried to feel the vibration of the field, the hum of the geometry. But all he felt was the smooth, hard surface of the machine, and the silence of a world that had stopped making sense.
