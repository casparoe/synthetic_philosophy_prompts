prompt: |-
  ok so in my philosophy of science seminar we got to the section on popper and darwinism and i'm stuck on something the professor kind of breezed past. apparently popper originally argued that natural selection, at least in the bare "survival of the fittest" form, is basically a tautology (fitness just = whatever happens to survive), and that because of this the whole theory isn't really falsifiable in his sense -- he labeled it a "metaphysical research programme" rather than a proper scientific theory, which made a lot of biologists pretty furious at the time. then years later he seems to have publically recanted and said he'd changed his mind about the whole testability/tautology thing, even though he'd been a convinced evolutionist the entire time.

  what i can't tell is whether the original tautology worry was pointing at something real (like adaptationist explanations turning into unfalsifiable just-so stories) or whether it was just a confusion popper got talked out of once biologists explained how fitness actually gets measured independently of survival. can you write me an essay that weighs the original objection against the recantation and reaches a real verdict -- like, was early-popper righter, was late-popper righter, or does the honest answer split the difference? please don't just lay out both sides neutrally, i need an actual stance i can argue with for my response paper.
