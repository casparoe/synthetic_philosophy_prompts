          *   Honesty in Non-Linguistic Dealings: E.g., returning a wallet. Is there a convention? "Return lost property." Alternative: "Keep lost property." If everyone kept lost property, trust collapses. This looks like a Prisoner's Dilemma, not a Coordination Problem. Lewis's theory struggles with PDs.

