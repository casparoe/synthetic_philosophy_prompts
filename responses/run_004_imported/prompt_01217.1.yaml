      *   **Expectations:** Everyone expects everyone to do $R$.
      *   **Preferences:** Everyone prefers to do $R$ *if* others do $R$ (conditional preference).
      *   **Common Knowledge:** All of the above is common knowledge.
      *   **Arbitrariness:** There is an alternative regularity $R'$ that could have solved the problem just as well. This is the key sticking point for honesty.

  3.  **Deconstruct Lewis's Move in "Languages and Language":**
      *   **Problem:** Truthfulness in language $L$ isn't arbitrary. If everyone lied in $L$, communication would fail. So truthfulness in $L$ isn't a convention by the 1969 definition.
      *   **Solution:** The convention is *using* $L$ (where using $L$ means being truthful-and-trusting in $L$).
      *   **Arbitrariness Restored:** We could have used $L^*$ (a different language) instead. The choice of $L$ is arbitrary. The obligation to be truthful is internal to the definition of "using $L$."
      *   **Mechanism:** The norm of truthfulness is derived from the convention of language use.

  4.  **Evaluate the "Sleight of Hand" Charge:**
