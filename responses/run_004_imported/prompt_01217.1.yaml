answer: |-
  **The Limits of Coordination: Why Lewis's Account of Convention Cannot Ground Moral Norms**

  David Lewis's *Convention* (1969) offers one of the most rigorous reductions in modern social philosophy. By defining convention as a solution to a recurring coordination problem sustained by common knowledge and conditional preferences, Lewis aimed to explain normative social facts without invoking primitive normative properties. However, as your seminar has discovered, this machinery strains when applied to norms that appear non-arbitrary, such as truthfulness. Lewis's later maneuver in "Languages and Language" (1975)—relocating the arbitrariness from truthfulness itself to the choice of language—is ingenious. Yet, your suspicion is well-founded: while this saves the linguistic case, it functions as a special-case dodge that fails to generalize to non-linguistic norms like promise-keeping or honesty in dealings.

  To adjudicate this, we must look closely at the mechanics of Lewis's definition, evaluate the linguistic pivot, and test its limits against a concrete non-linguistic norm. The conclusion is decisive: Lewis's coordination-based analysis is a powerful tool for explaining *constitutive* social facts (like language and currency) but fails as a foundational theory of *moral* obligation because it cannot generate normativity where the alternative regularity is not a viable equilibrium.

  ### The Mechanics of Lewisian Convention

  Lewis's 1969 definition rests on four pillars. First, there must be a **recurrent coordination problem**: a situation where agents have common interests in coordinating their actions but multiple ways to do so. Second, there is a **regularity** $R$ in behavior (e.g., driving on the right). Third, there is a system of **expectations**: everyone conforms to $R$, everyone expects everyone else to conform, and everyone prefers to conform *on the condition* that others do (a coordination equilibrium). Fourth, and crucially, there is **common knowledge** of these facts.

  The linchpin of the definition is **arbitrariness**. For $R$ to be a convention, there must be an alternative regularity $R'$ that could have solved the coordination problem just as well. If we drive on the right, we could have driven on the left; both solve the collision-avoidance problem equally. If there is no such alternative—if $R$ is the *only* way to achieve the goal—then conformity to $R$ is not a convention; it is simply a rational necessity.

  ### The Problem of Honesty and the Linguistic Pivot

  This arbitrariness clause creates a crisis for honesty. In *Convention*, Lewis initially suggests truthfulness is a convention. But as you noted, a standing policy of universal lying does not solve the coordination problem of communication; it destroys it. If everyone lies, language ceases to convey information, and the goal of communication fails. Thus, truthfulness lacks an alternative equilibrium. It is not arbitrary; it is necessary for the function of language.

  In "Languages and Language," Lewis patches this. He concedes that truthfulness *in a specific language* is not arbitrary. However, he argues that the convention is not "be truthful," but rather "use language $L$." To "use $L$" is defined as being truthful-and-trusting in $L$. The arbitrariness is preserved because we could have used language $L^*$ (e.g., German instead of English). The obligation to be truthful rides on the back of the arbitrary choice to use English.

  Your friend sees this as a clean solution: the coordination problem is the choice of language, and the norm of truthfulness is internal to that choice. In the specific context of semantics, this holds water. Meaning is constitutive; there is no "English" without rules of truthfulness. By making the *selection* of the rule-set the convention, Lewis preserves the arbitrariness condition without denying the necessity of truthfulness within the selected set.

  ### The Generalization Test: Promise-Keeping

  The critical question is whether this maneuver generalizes to non-linguistic norms, specifically promise-keeping. Lewis treats promising as analogous to language: a convention where uttering certain words creates an obligation. Can we apply the same pivot?

  Consider the norm: "If you say 'I promise to $\phi$,' you must $\phi$."
  **Lewisian Analysis:** The convention is the practice of promising. The arbitrariness lies in the fact that we could have adopted a different convention where saying "I promise" meant "I intend to break this." As long as everyone conforms to *that* alternative, communication/cooperation could theoretically proceed (we would just translate "I promise" as "I won't do it").

  **The Breakdown:** Here, the Lewisian machinery jams against the nature of moral obligation.
  1.  **Viability of the Alternative:** In language, a world where everyone speaks German is functionally identical to a world where everyone speaks English. In promising, a world where "I promise" universally means "I will not do it" is not functionally identical to a world where it means "I will do it." The institution of promising exists to *assure* others of future performance. If the convention is inverted, the assurance mechanism requires a constant mental translation that undermines the efficiency of the practice. More importantly, if the convention is "promises are to be broken," the practice likely collapses into distrust, failing the coordination equilibrium test. Unlike driving on the left, which works perfectly well, a "lying promise" convention is inherently unstable.
  2.  **The Source of Obligation:** Lewis reduces the obligation to keep a promise to the *expectation* that others expect you to keep it. On his view, I ought to keep my promise because if I don't, I frustrate the expectations grounded in the convention. But this reduces a moral "ought" to a predictive "is." If I discover that everyone else expects me to break my promise (perhaps the convention is crumbling), Lewis's logic suggests my obligation dissolves. Yet, intuitively, the moral obligation to keep a promise persists even if the social convention is fraying.

  This reveals the sleight of hand. In the linguistic case, Lewis can define "truthfulness" into the definition of "using $L$." In the moral case, he cannot define "fidelity" into the definition of "promising" without begging the question. The reason we value the convention of promising is not merely that it coordinates us, but that it serves a pre-existing moral interest in fidelity and reliance. Lewis's account explains *which* signals we use to promise (the arbitrary part), but it cannot explain *why* we are bound by the signals once chosen (the non-arbitrary part).

  ### The Category Error: Coordination vs. Normativity

  The failure to generalize stems from a category error in Lewis's project. Lewis successfully explains **arbitrary social facts**. Why do we shake hands rather than bow? Why do we use dollars rather than shells? These are coordination problems with multiple viable equilibria.

  However, norms like honesty and promise-keeping are not merely arbitrary social facts; they are **moral norms** that often solve Prisoner's Dilemmas, not Coordination Problems. In a Coordination Problem (Driving), I prefer to drive on the right *if* you do. In a Prisoner's Dilemma (Honesty in dealings), I often prefer to lie *even if* you tell the truth (to gain an advantage), though we both prefer mutual truth-telling to mutual lying.

  Lewis's 1969 definition strictly requires a Coordination Problem. By moving to "Languages and Language," he implicitly relies on the fact that language use is constitutive: you literally cannot speak a language without being truthful in it. This is a unique feature of semantics. Non-linguistic honesty is not constitutive in the same way; I can interact with you dishonestly without ceasing to "interact."

  Therefore, the "pivot" Lewis uses for language is unavailable for general honesty. We cannot say the convention is "engage in honest dealings" because "honest dealings" is not an arbitrary label for a deeper neutral activity in the way "English" is for "communication." The alternative to "honest dealings" is "dishonest dealings," which is not a viable equilibrium for social welfare. Because the alternative is not a viable equilibrium, the arbitrariness condition fails. Lewis's definition simply does not apply.

  ### Conclusion

  Your friend is correct that Lewis's move saves the specific case of language. By locating the convention at the level of language-selection, Lewis preserves the arbitrariness required by his 1969 definition while accounting for the necessity of truthfulness within that language. However, you are right to identify this as a special-case dodge. The maneuver relies on the constitutive nature of linguistic meaning, where rules define the activity itself.

  This trick cannot be pushed to cover norms like promise-keeping or non-linguistic honesty. In those cases, the alternative regularities are not viable equilibria (failing the coordination test), or the normativity exceeds mere expectation (failing the reduction of obligation to coordination). Lewis's theory is a brilliant account of how we coordinate on arbitrary rules, but it is not a general theory of social obligation. It explains why we drive on the right, but it cannot explain why we ought to keep our word when driving on the left would have served us just as well. To treat Lewis's coordination equilibrium as the source of all social normativity is to mistake the map of our arbitrary habits for the terrain of our moral commitments.
