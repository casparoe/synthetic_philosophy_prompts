      *   **Conclusion:** Take the stand. The Lewisian framework is excellent for "arbitrary social facts" (language, traffic, money) but cannot serve as a foundational theory of social *morality* (honesty, promises) because it cannot account for norms where the alternative regularity is not a viable equilibrium or where the normativity exceeds mere coordination expectations.

