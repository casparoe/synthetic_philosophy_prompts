answer: |-
  This is a profound ethical dilemma, and the fact that it has stayed with you is a sign of good judgment. It indicates you understand that lifeguarding isn't just about physical skill; it's about bearing the weight of moral agency.

  You are correct that this differs from Peter Singer's "shallow pond." Singer's argument is about *positive duty* (you must help) versus *cost to self*. Your scenario is about *conflicting duties* (you must help Group A vs. you must help Group B) where helping one necessitates failing the other. In philosophy, this is often treated as a variation of the "Trolley Problem," but with high-stakes professional responsibilities attached.

  To give you the understanding you're looking for, we need to separate this into three layers: the abstract moral argument, the professional/role-based argument, and the psychological reality of emergency response.

  ### 1. The Strongest Case for the Trainee (The Individual Claim)

  The trainee who pushed back is arguing from a **Deontological** or **Rights-Based** framework. Her point is not that saving one person is *better* than saving three; it is that the *method of choosing* matters morally.

  **The Argument for Moral Equality:**
  The core of her objection is that human lives are not fungible units. In economics, dollars are fungible; three dollars are always worth more than one. In moral philosophy, many argue that a human life has infinite or absolute value. If Life A = $\infty$ and Life B = $\infty$, then $3 \times \infty$ does not mathematically exceed $1 \times \infty$. They are equally incalculable.

  **The "Fair Chance" Objection:**
  If every individual has an equal right to rescue, does the accident of geography (being in the deep end with two friends vs. being alone) justify a death sentence? The trainee is highlighting a fear of the "tyranny of the majority" applied to life and death. If we accept that numbers always dictate who lives, we risk sliding into a utilitarian calculus where vulnerable minorities (who are often fewer in number) are systematically deprioritized.

  **The Argument for Randomization:**
  The strongest philosophical alternative to "save the greater number" in this specific scenario is **randomization**. If the guard cannot save everyone, and every life has equal worth, some philosophers argue the guard should flip a coin (or choose randomly). This respects the moral equality of the individuals. It acknowledges that while the *outcome* (3 deaths vs. 1 death) is worse, the *decision process* honored the equal value of the teenager. By automatically choosing the three, the guard effectively says the teenager's claim on safety was worth 33% of a child's.

  **Why this matters:**
  The trainee is right that "save the greater number" is not a self-evident moral truth. It is a heuristic. If the teenager was a world-renowned surgeon on the verge of a cancer cure, and the three children were known violent criminals, would the numbers still rule? Most people hesitate. That hesitation proves we don't *actually* believe only numbers matter. The trainee is forcing you to admit that choosing the group feels easier, not necessarily morally purer.

  ### 2. The Strongest Case for the Majority (The Utilitarian/Triage View)

  The majority of your class and your instructor are arguing from a **Consequentialist** framework, specifically **Utilitarianism**, filtered through **Professional Triage Protocols**.

  **Minimizing Total Harm:**
  The simplest argument is that while life may be "priceless," death is a quantifiable loss of future experience. Three futures extinguished is a greater tragedy than one future extinguished. In a world of limited resources (one guard), the moral obligation is to produce the least amount of suffering. To choose the one over the three would be to actively accept two preventable deaths that could have been avoided.

  **The "Public Trust" Argument:**
  This is where the lifeguard context changes things. A private citizen at a lake might have the moral latitude to flip a coin. A lifeguard is an agent of the municipality. The pool operates on a social contract: the public pays taxes and fees, and the institution provides safety.
  If a lifeguard saves one person and lets three die when they could have saved the three, the institution has failed its mandate to protect the public *as a whole*. The "greater number" rule isn't just about math; it's about the fiduciary duty of the safety service to the community.

  **The Epistemic Problem (Time):**
  The strongest practical argument against the trainee's view is **time**. Randomization requires a moment of pause to decide "I am randomizing." Calculating individual worth requires investigation. Counting heads is the only metric available in seconds. In emergency medicine, triage protocols (like START) explicitly prioritize saving the most salvageable lives in the greatest numbers. This isn't a slogan; it is a cognitive algorithm designed to bypass paralysis. If the guard stops to contemplate the moral equality of the teenager, all four may die.

  ### 3. Why the Instructor's Answer Felt Like a Slogan

  You felt the instructor's response ("that's how triage works") was insufficient because it conflated **Procedure** with **Morality**.

  *   **Procedure:** "What does the protocol say?" (Answer: Save the greater number).
  *   **Morality:** "Why is that the right thing to do?" (Answer: Because minimizing total loss is our best proxy for 'good' in a tragedy).

  The instructor gave you the procedure to protect you from the morality. This is actually a feature, not a bug, of professional training. If you have to debate philosophy while someone is drowning, you have already failed. The protocol exists to shield you from the "moral residue"—the guilt that remains after making a tragic choice. By following the standard of care (save the greater number), you are protected legally and professionally, even if the philosophical tension remains.

  ### 4. Synthesis: Who is "Right"?

  In the context of **abstract moral philosophy**, the trainee is onto something real. There is no universally agreed-upon proof that $3 > 1$ when the units are human souls. The "equal worth" objection is a valid philosophical critique of pure utilitarianism.

  However, in the context of **Professional Role Morality**, the instructor and the majority are right. Here is why:

  1.  **Omission vs. Commission:** In the Singer pond scenario, you are the only one who *can* act. In the pool scenario, you are the designated agent. Your role is defined by the optimization of safety for the *patrons* (plural).
  2.  **Predictability:** Emergency systems rely on predictability. If lifeguards are trained to consider individual worth or randomize, outcomes become chaotic. Standardization saves lives in the aggregate, even if it feels cold in the specific.
  3.  **The "Survivability" Factor:** Real-world triage isn't just about numbers; it's about likelihood of success. However, in your hypothetical, we assume equal survivability. When survivability is equal, numbers are the only objective tiebreaker left.

  ### The Verdict for a Practitioner

  You asked if the "save the greater number" principle is obviously correct.
  *   **Philosophically:** No. It is a choice to prioritize *outcome* over *individual fairness*.
  *   **Professionally:** Yes. It is the only workable standard for a public safety official.

  The trainee's objection is valuable not because it should change your action in the water, but because it should change your **attitude after the action**.

  If you save the three children, you must not tell yourself, "The teenager didn't matter as much." That is false. The teenager mattered just as much. But your *capacity to act* was limited, and the tragedy of the situation forced a choice where loss was inevitable. The "greater number" rule is not a judgment on the value of the teenager's life; it is a judgment on the allocation of your limited agency.

  **Recommendation:**
  Carry the trainee's objection with you, but keep it in your pocket, not your hand.
  *   **In the water (Action):** Follow the protocol. Save the greater number. It minimizes total harm and aligns with your duty to the public trust.
  *   **On the deck (Reflection):** Acknowledge the trainee's point. If the worst happens, do not devalue the life you couldn't save. Acknowledge that a tragedy occurred, not just a calculation.

  The instructor gave you the tool to survive the shift. The trainee gave you the tool to survive the guilt. You need both.
