      *   *Goal:* Democratic access to knowledge.

  3.  **Evaluate Modern Practice 1: Proportionally Sized Bubbles/Icons:**
      *   *Practice:* Making an icon 2x bigger to represent 2x the value.
      *   *Neurath's View:* He explicitly rejected this.
      *   *Reasoning:* Human perception struggles with area/volume. If you double the height, you quadruple the area. It exaggerates differences. It's rhetorically loaded (sensationalism).
      *   *Verdict:* Betrayal of principle. It sacrifices accuracy for aesthetic impact.

  4.  **Evaluate Modern Practice 2: Emoji as Universal Idiom:**
      *   *Practice:* Using emoji for communication, sometimes data (e.g., sentiment analysis, simple counts).
      *   *Neurath's View:* He wanted a "world language without words." Emoji seems similar on the surface.
