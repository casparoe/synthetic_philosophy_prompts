      *   **Key Isotype Principles:**
          *   Quantities shown by *repeating* a fixed unit icon (not resizing).
          *   Reason: Resizing distorts perceived proportion (area/volume vs. linear dimension).
          *   Pictures supplement verbal/symbolic language (they show comparisons/distributions, *not* negation, causation, or theory).
          *   Goal: Convey quantitative knowledge across literacy/language barriers (logical empiricism, anti-rhetoric).
      *   **Modern Context:** Today's data visualization culture (infographics, dashboards, proportionally sized bubbles/icons, emoji).
      *   **Task:** Evaluate how Neurath would judge modern practices based on his principles. Is it an extension or a betrayal? On what specific grounds?

  2.  **Deconstruct Neurath's Philosophy (Mental Sandbox):**
      *   *Epistemology:* Logical Empiricism (Vienna Circle). Facts over metaphysics. Clarity over persuasion.
      *   *Pedagogy:* Education for the masses. "Transformation" of statistics into pictures.
      *   *Visual Grammar:* Isotype rules are strict for a reason. Consistency = Truthfulness.
