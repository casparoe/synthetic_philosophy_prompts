      *Refining the Leibnizian critique:* Leibniz distinguishes between "truths of reasoning" (necessary) and "truths of fact" (contingent). Acausal trade treats the cooperation as a truth of reasoning (if rational, then cooperate). Leibniz might argue that the existence of the agents is contingent, so their coordination is contingent, requiring a will to choose it.

