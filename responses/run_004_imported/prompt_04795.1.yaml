answer: |-
  Your intuition is spot on. If the existence of genuine moral dilemmas could be dispatched by a single, uncontroversial application of "ought implies can," the decades of literature by philosophers like Bernard Williams, Ruth Barcan Marcus, Walter Sinnott-Armstrong, and others would not exist.

  Your housemate's argument is **logically valid**, but it is **unsound**. It relies on a hidden premise that is far more controversial than "ought implies can." In fact, that hidden premise is essentially the very point at issue.

  Here is the breakdown of where the argument succeeds, where it fails, and how defenders of moral dilemmas respond.

  ### 1. Reconstructing the Argument

  To see the flaw, we need to formalize your housemate's reasoning using standard deontic logic notation.
  *   Let $O$ stand for "It is obligatory that..."
  *   Let $\diamond$ stand for "It is possible that..." (or "The agent can...")
  *   Let $A$ and $B$ be the two conflicting actions.

  **The Premises:**
  1.  **OIC (Ought Implies Can):** For any action $\phi$, if $O\phi$, then $\diamond\phi$.
  2.  **The Dilemma Fact:** The agent cannot do both $A$ and $B$. Formally: $\neg\diamond(A \land B)$.

  **The Conclusion:**
  *   It is not the case that the agent is obligated to do $A$ and obligated to do $B$. Formally: $\neg(OA \land OB)$.

  **The Housemate's Derivation:**
  1.  Assume for the sake of argument that there is a dilemma: $(OA \land OB)$.
  2.  **Hidden Step:** Therefore, $O(A \land B)$.
  3.  By **OIC**: If $O(A \land B)$, then $\diamond(A \land B)$.
  4.  But we know from **The Dilemma Fact** that $\neg\diamond(A \land B)$.
  5.  This is a contradiction.
  6.  Therefore, the assumption in step 1 must be false.

  ### 2. The Flaw: The Principle of Agglomeration

  The flaw is in **Step 2**. This step assumes the **Principle of Agglomeration** (also known as Adjunction or Conjunction for Obligation).

  **Agglomeration Principle:** $(OA \land OB) \rightarrow O(A \land B)$
  *(If you ought to do A and you ought to do B, then you ought to do (A and B).)*

  Your housemate is treating this principle as if it is self-evident or part of the definition of "ought." It is not. It is a specific axiom of **Standard Deontic Logic (SDL)**. While SDL is a useful system for many purposes, most ethicists who defend moral dilemmas argue that SDL is inadequate for modeling moral conflict precisely because it includes Agglomeration.

  **Why OIC does not entail Agglomeration:**
  "Ought implies can" tells us that obligations must be individually possible.
  *   If $OA$, then $\diamond A$.
  *   If $OB$, then $\diamond B$.

  In a typical moral dilemma (like Sartre's student), it *is* possible to join the Resistance ($\diamond A$) and it *is* possible to stay with the mother ($\diamond B$). OIC is satisfied for both individual obligations. OIC is only violated if we insist that there is a *single* obligation to do the conjunction $(A \land B)$.

  Your housemate's argument essentially says: "Because you can't do both, you can't be obligated to do both." The dilemmist replies: "I am not obligated to do 'both' as a single package. I am under two separate obligations that happen to be mutually exclusive in this context."

  ### 3. How Defenders of Dilemmas Resist

  Philosophers who defend the reality of moral dilemmas generally take one of two routes to block your housemate's argument.

  #### A. Rejecting Agglomeration (The Logical Route)
  This is the most direct counter. They argue that moral obligations do not always aggregate. When two obligations conflict, they retain their individual normative force without merging into a single impossible command.

  *   **The Logic:** We move from Standard Deontic Logic to a **non-adjunctive deontic logic**. In these systems, $(OA \land OB)$ does not entail $O(A \land B)$.
  *   **The Moral Phenomenology:** If Agglomeration were true, then in a dilemma, one obligation would simply vanish. But our moral experience suggests otherwise. If Sartre's student chooses the Resistance, he still feels guilt toward his mother. He feels he needs to apologize or make amends. This "moral residue" (a term coined by Ruth Barcan Marcus) suggests the obligation to the mother was genuine, even if unfulfilled. If the obligation had ceased to exist (as your housemate claims), there would be nothing to feel guilty about.

  #### B. Distinguishing Types of "Ought" (The Conceptual Route)
  Some ethicists argue that your housemate is conflating two different senses of "ought."
  1.  **Prima Facie Ought:** A binding moral requirement that can be overridden by other requirements (e.g., "I ought to keep my promise").
  2.  **All-Things-Considered Ought:** What the agent should actually do, all factors weighed (e.g., "I ought to save the drowning child").

  Your housemate is arguing that there cannot be conflicting *all-things-considered* oughts. Many dilemmists agree with this! They argue that dilemmas consist of conflicting *prima facie* obligations. However, serious dilemmists (like Williams) go further: they argue that even after weighing the factors, the unchosen option leaves a "remainder." The obligation isn't erased; it is just tragically unfulfillable.

  ### 4. Why Your Housemate Thinks She's Right

  It is understandable why a logic minor would make this move. In introductory logic courses, Standard Deontic Logic (SDL) is often taught as *the* logic of obligation. In SDL, Agglomeration is a theorem. If you accept the axioms of SDL, your housemate is right.

  However, in philosophy, logic is a tool to model reality, not the other way around. If the phenomenon of moral experience (guilt, regret, the need for apology) suggests that conflicting obligations exist, we must modify the logic (reject Agglomeration), not deny the experience.

  ### Summary for Your Next Argument

  You can tell your housemate that her argument is valid **only if** she assumes the Principle of Agglomeration. You can point out three things:

  1.  **OIC is preserved without Agglomeration:** We can accept "Ought Implies Can" while maintaining that $OA$ and $OB$ are both true, provided $\diamond A$ and $\diamond B$ are true individually. We simply deny that $O(A \land B)$ follows.
  2.  **Moral Residue:** If she is right that one obligation ceases to exist, it is hard to explain why agents in dilemmas feel genuine guilt or owe apologies for the unchosen path. (e.g., If Agamemnon sacrifices Iphigenia, he still owes her something; the obligation didn't just vanish).
  3.  **Begging the Question:** By assuming Agglomeration, she is assuming that obligations cannot conflict in the first place. She hasn't proven dilemmas are impossible; she has defined them out of existence by choosing a logical system that forbids them.

  **Verdict:** The debate is not settled by OIC. It is settled by whether one accepts that moral obligations can be non-agglomerative. Since that is a substantive ethical claim, not a logical tautology, the question remains very much live.
