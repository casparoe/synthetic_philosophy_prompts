answer: |-
  This is a fantastic question because it cuts right to the epistemological nerve of *Principia Ethica*. If you put G.E. Moore in a room with Sharon Street, you wouldn't get a modern "third-factor" theorist like David Enoch or Erik Wielenberg. You'd get Moore doubling down on the autonomy of ethics, likely accusing Street of committing a sophisticated version of the **Naturalistic Fallacy**.

  Here is how Moore would likely dismantle Street's Darwinian Dilemma, grounded in his actual texts and metaphysical commitments.

  ### 1. The Category Mistake: Genealogy vs. Validity
  Street's argument hinges on the idea that if the *cause* of our moral beliefs is evolutionary fitness, we have no reason to think those beliefs track independent moral *truths*. She assumes a causal theory of knowledge: for a belief to be justified, there must be an explanatory link between the truth-maker and the belief-forming mechanism.

  Moore would reject this premise entirely. In *Principia Ethica*, Moore is adamant that the question "What is the nature of good?" is distinct from "How do we come to know it?" and distinct from "Why do we believe it?"

  For Moore, the **Naturalistic Fallacy** isn't just about defining "good" as "pleasure" or "survival." It's the broader error of trying to ground normative validity in natural facts (including psychological or evolutionary facts). If Street argues, "Your belief is unjustified because its etiology is fitness-driven rather than truth-driven," Moore would reply that the etiology of a belief is irrelevant to its self-evidence.

  He treats moral intuition akin to mathematical or logical insight. If I grasp that $A = A$, it doesn't matter if my brain evolved to fear tigers. The truth of the proposition is necessary and *sui generis*. Moore would argue Street is confusing the **psychological history** of a judgment with its **logical justification**. To think that evolutionary history can debunk a self-evident truth is, for Moore, to misunderstand what "self-evident" means. It means the truth is apprehended directly, without inference from natural facts (including facts about evolution).

  ### 2. Intuition is Not "Tracking"
  Street's dilemma relies on a "tracking" metaphor: our minds are supposed to *track* moral truths like a compass tracks North. If evolution set the compass to "Survival," it won't point North unless by coincidence.

  Moore would reject the "tracking" metaphor as a naturalistic contamination of ethics. In *Principia*, intuition is not a sensory faculty that scans the world for moral properties. It is a rational apprehension of a non-natural property.

  *   **Natural properties** exist in time and space and participate in causal chains (where evolution operates).
  *   **Non-natural properties** (Good) do not exist in time and space; they are abstract objects of thought.

  Since "Good" is not part of the causal order, it cannot be "tracked" in the biological sense. Moore would argue that Street's dilemma only works if moral properties are the kind of things that *could* exert causal influence on our evolution. Since Moore explicitly denies this (Good is non-natural), the "coincidence" charge loses its bite. It's not a coincidence that my mind grasps a necessary truth; it's the function of reason. If evolution shaped my reason, it shaped my capacity to grasp *all* necessary truths (logic, math, ethics). If Street debunks ethics via evolution, she debunks logic and math too. Moore would likely be comfortable with that stalemate, viewing logical/moral truths as insulated from empirical debunking.

  ### 3. Why He Wouldn't Go "Third-Factor" (Enoch/Wielenberg)
  This is the crux of your question. Modern realists like Enoch argue: "Evolution selected for survival; survival is objectively good; therefore, evolution selected for (some) moral truths." This is the "third-factor" explanation.

  Moore would **hate** this. In fact, he would view it as a textbook Naturalistic Fallacy.

  In *Principia Ethica* (specifically Chapter 1), Moore attacks Utilitarians and Evolutionary Ethicists (like Herbert Spencer) who try to define "good" as "more evolved" or "conducive to survival." Moore argues you can always ask: "But is survival *good*?" If you say yes, you are admitting "good" is something *other* than "survival."

  If Enoch came to Moore and said, "We can solve the coincidence problem by noting that evolution aims at survival, and survival is objectively valuable," Moore would reply:
  > "You have just defined the Non-Natural Property (Good) in terms of a Natural Property (Survival/Evolutionary Fitness). You have committed the Naturalistic Fallacy. You cannot bridge the gap between 'is' (evolution selects X) and 'ought' (X is good) by simply asserting a correlation."

  Moore accepts brute non-natural facts, but he doesn't like brute *connections* between natural and non-natural realms that look like definitions. He keeps the realms strictly separate. Wielenberg's "brute necessary connections" (where moral facts supervene on natural facts without explanation) might be metaphysically palatable to Moore, but the *explanatory* move of using evolution to justify the connection would strike him as irrelevant. For Moore, the connection holds because it is necessary, not because evolution stumbled upon it.

  ### 4. The "Shrug" is Actually a Philosophical Position
  So, would he shrug? Yes, but it's a principled shrug.

  Moore's epistemology is **foundationalist**. He believes there are basic truths that require no further justification. In *Some Main Problems of Philosophy*, he argues that we know certain things with certainty (e.g., "Here is a hand," "Pleasure is good") and that demanding an evolutionary explanation for *why* we know them is a category error.

  He would likely tell Street:
  > "You are asking for a natural explanation for a non-natural apprehension. If my intuition tells me 'Kindness is good,' and this is self-evident, your story about Pleistocene survival rates is irrelevant. You are offering a causal explanation for a logical relation."

  He would view Street's argument as a form of **skepticism disguised as science**. He famously fought against skepticism (e.g., his "Proof of an External World"). His method is to trust common sense and clear intuition against skeptical hypotheses that rely on complex theoretical chains (like evolutionary psychology). If the intuition is clear, the theory must be wrong (or at least, irrelevant to the truth of the intuition).

  ### Summary: The Verdict
  If you explained Street to Moore:

  1.  **He would not adopt Third-Factor replies.** He would see them as attempts to define Good naturalistically (violating the Naturalistic Fallacy).
  2.  **He would not accept the "Coincidence" charge.** He views moral truths as necessary and abstract, not empirical facts that need to be "tracked" by causal mechanisms.
  3.  **He would double down on Intuition.** He would argue that the self-evidence of moral principles is immune to genealogical debunking because genealogy addresses the *cause of belief*, while intuition addresses the *ground of truth*.

  Moore's weakness, of course, is that this looks like dogmatism to modern ears. He offers no criterion for distinguishing "true intuition" from "evolved bias" other than the intensity of the self-evidence itself. Street's whole point is that evolved biases *feel* self-evident. Moore would likely find this circularity untroubling, resting on the conviction that some truths are simply "known" and that asking for an evolutionary warranty is a misunderstanding of the normative domain.

  So, in your debate: Your friend is right that Street wrecks *naturalistic* realism (which tries to ground morality in natural facts). But Moore is the one realist who explicitly said morality *isn't* natural facts. He'd tell Street she's fighting a straw man, or worse, committing the very fallacy he named.
