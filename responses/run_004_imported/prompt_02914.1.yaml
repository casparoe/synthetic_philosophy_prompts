      *   *Check:* Did I explain *why* electrons are different?
      *   *Correction:* Yes, electrons are posits within the theory that explains the physical evidence. Meaning is supposed to be *prior* to theory, but Quine argues it's actually *part* of the web of belief, subject to the same holistic revision. But crucially, reference itself is indeterminate.
      *   *Check:* Is the distinction between UT and IT clear?
