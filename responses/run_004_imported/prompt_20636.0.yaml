answer: |-
  Here are 8 interview questions designed to press the philosopher on the implications of decision-theoretic fanaticism, including the specific angles you requested.

  ### 1. The "Ad Hoc" Charge
  **Question:** You argue that solutions like Bostrom's leverage penalty are *ad hoc* theoretical patches designed to save our intuitions rather than the math. But critics argue that insisting on an unbounded utility function is equally dogmatic—that it's a commitment to saving the Von Neumann-Morgenstern axioms at the expense of reality. Why is positing an unbounded utility function any less of a "theoretical patch" than positing a leverage penalty?

  **Follow-up:** If she appeals to the necessity of the VNM axioms for rational agency: "Sure, but those axioms were designed for finite gambles. Are you certain they extend to infinite or near-infinite stakes without modification, or is that an unproven assumption you're making to preserve the elegance of the theory?"

  ### 2. The Longtermism Mirror
  **Question:** A common defense of the leverage penalty is that without it, Longtermism becomes indistinguishable from Pascal's Mugging—both rely on tiny probabilities of affecting vast numbers of lives. You reject the penalty to save Longtermism. But if we accept your view that we shouldn't discount claims based on their sheer scale, doesn't that open the door for religious or ideological claims of *infinite* impact (e.g., saving souls) to completely crowd out secular longtermist projects? If the mugger isn't discounted for affecting 10^30 people, why doesn't a theologian affecting 10^∞ people dominate your calculus?

  **Follow-up:** If she argues that religious claims have lower prior probabilities: "But how do you quantify that difference non-arbitrarily? If the stakes are infinite, even a massive probability gap might not be enough to outweigh them. Are you essentially smuggling in a leverage penalty via the priors to protect Longtermism from religion?"

  ### 3. The Problem of Conflicting Muggers
  **Question:** Let's talk about the 'Pascal's War' scenario. Two muggers approach you. One claims they will save 10^30 lives if you pay them; the other claims they will save 10^30 lives if you *don't* pay the first one. Both present symmetrical evidence. Under standard expected value maximization, these demands cancel out, leaving you paralyzed. Does your view imply that in high-stakes, low-probability environments, rational action becomes impossible?

  **Follow-up:** If she suggests we should look for asymmetries in the evidence: "Imagine the evidence is perfectly symmetrical—perhaps they are identical AIs running opposite simulations. If the math cancels out, does the fanatic really have to admit that rationality dictates doing nothing, even if one option is clearly less costly?"

  ### 4. Demarcating AI Risk from Mugging
  **Question:** Effective Altruists want to take AI extinction risk seriously without falling for Pascal's Mugging. What is the precise criterion that allows us to count the AI risk argument as 'legitimate' small-probability/high-stakes reasoning while dismissing the mugger? Is it just that AI risk fits within known physics?

  **Follow-up:** If she says it's about the quality of the causal mechanism: "But a sophisticated mugger can tell a story that fits within known physics—perhaps exploiting quantum uncertainty or simulation theory. If the distinction isn't the *scale* of the claim (which you reject discounting), what specific epistemic firewall stops a well-dressed mugger from qualifying as an existential risk analyst?"

  ### 5. Bounded Utility and Money Pumps
  **Question:** One of the strongest arguments for your position is that bounded utility functions make agents vulnerable to 'money pumps'—cycles of trades that leave them worse off. But isn't accepting fanaticism just trading one pathology for another? You avoid money pumps, but you become vulnerable to 'mugging pumps,' where you surrender all resources to the most extreme claimant. Why is avoiding the money pump the priority over avoiding the mugging pump?

  **Follow-up:** If she argues that money pumps violate transitivity (a core rationality axiom): "But mugging pumps violate the principle of *dominance*—you end up worse off in almost every possible world. Why is formal consistency (transitivity) more important than instrumental success (not going broke)?"

  ### 6. The "Zero Probability" Escape Hatch
  **Question:** Some critics suggest the only way out is to assign exactly zero probability to the mugger's claim. Do you assign *any* empirically contingent event exactly zero probability? If not, doesn't that mean you are committed to paying the mugger if they name a high enough number, regardless of how absurd the claim?

  **Follow-up:** If she admits she never assigns zero probability to contingent events: "So if a mugger claims to control the digits of pi in a way that affects utility, and you assign that non-zero probability, are you truly committed to acting on that? At what point does 'non-zero' become functionally irrelevant, and isn't 'functionally irrelevant' just a pragmatic way of saying 'discounted'?"

  ### 7. Psychological Feasibility and Normativity
  **Question:** Decision theory is often normative—it tells us how we *should* decide, not how we *do*. But if your version of expected utility theory requires humans to override deep-seated cognitive heuristics that reject huge numbers, is it still a theory of *human* rationality? Or is it a theory of idealized agents that no one can actually instantiate?

  **Follow-up:** If she argues that we should approximate the ideal as best we can: "But if the ideal requires ignoring the very heuristics that keep us from being scammed in the real world, isn't 'approximating the ideal' dangerous advice for actual Effective Altruists managing real funds?"

  ### 8. Practical Implications for EA Funding
  **Question:** If you are right, and we should maximize expected value without discounting for scale, shouldn't Effective Altruism funding shift dramatically toward the most speculative, highest-upside interventions, regardless of how thin the evidence is? Why isn't the 'fanatic' position actually *more* radical than the current Longtermist consensus, which still hedges with probability buffers?

  **Follow-up:** If she says we still need to account for the probability of the evidence being wrong: "But if the stakes are high enough, the probability of the evidence being wrong gets swamped. Are you prepared to argue that EA funders should be pouring money into projects that look like scams, provided the *theoretical* upside is high enough to clear the fanaticism threshold?"
