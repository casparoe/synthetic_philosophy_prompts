  8.  *(Self-Correction during final polish)*: Make sure the definition of "Muddle" and "Spread" is clear in context. Muddle = one person's values contradict even after extrapolation. Spread = Person A's extrapolated values contradict Person B's. Yudkowsky's solution is essentially "don't optimize for the contradictory parts." Marcus needs to point out that *not* optimizing is still a change in the world state that might violate the person's current wishes.

