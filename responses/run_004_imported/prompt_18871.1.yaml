      *   *Nuance:* Elena shouldn't claim CEV is perfect. She should claim it's the *least bad* reflection of what we mean by "good."

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Marcus:* Start with the "Stranger" argument. If my extrapolated self loves something I hate, why obey?
