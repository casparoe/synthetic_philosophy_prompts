answer: |-
  Good evening, everyone. For those of you I haven't met yet, I'm [Your Name]. I'm Marilyn's nephew, and apparently, I'm also "the writer" in the family.

  Though, depending on when you checked Twitter, you might know me by a different title. For about four days last month, I was "Unhinged Parking Guy" to a few hundred thousand strangers. It was… an education. There is a very specific kind of vertigo that comes from realizing thousands of people are discussing your character, none of whom have ever met you, and none of whom could pick you out of a lineup.

  I was pretty shaken up about it. So, naturally, I called my Aunt Marilyn.

  I expected her to tell me to ignore it, or to fight back. Instead, she asked if I'd ever heard of a Danish philosopher from the 1840s named Kierkegaard. She told me about how he was mocked by a gossip paper in Copenhagen for years, and how he wrote about the difference between "the people" and "the public."

  She explained that "the people" are actual neighbors, with names and faces and accountability. But "the public"? That's a phantom. It's a crowd that can shout without anyone ever having to open their mouth. It lets you feel like you've said something without ever having to stand behind it.

  Reading that helped me. But then Marilyn told me something else that helped even more. She said, "That phantom isn't new. And the cure isn't new, either."

  She told me that for forty-one years, her office philosophy was basically the antidote to that phantom. She told me she's been saying to journalism interns for decades: "Stop writing for 'the public.' The public is an abstraction. Write for the one actual reader sitting at the kitchen table with their coffee."

  When I heard that, I realized something. The last three weeks were miserable because I was being judged by a ghost. But Marilyn's career was fulfilling because she spent forty-one years serving the real.

  To the newsroom folks here: You know this better than anyone. You know Marilyn wasn't chasing clicks before clicks existed, and she wasn't chasing virality when virality became the currency. She was chasing the specific truth that mattered to the specific person holding the paper. She knew that if you take care of the one reader in front of you, the rest takes care of itself.

  And to the family: You know this in a different way. You know that Marilyn never treated people like content. She treated them like neighbors. Whether she was editing a front-page story or asking you how your second-grader's recital went, she was present. She was real. In a world that increasingly rewards shouting into the void, she chose to speak to the person in the room.

  I know the industry has changed. The paper went online, the newsroom got smaller, and the phantom feels louder than ever these days. But looking around this room, I don't see a legacy that's fading. I see the people she mentored, the stories she protected, and the family she grounded.

  The phantom will always be there. It's easy to be outraged by a crowd. It's much harder, and much braver, to sit down and write something true for one person who trusts you. Marilyn did that every single day.

  So, if everyone could please raise a glass.

  To Aunt Marilyn. Thank you for teaching us that the only thing that matters isn't the thousands who might be watching, but the one person right in front of us. Here's to the real readers, the real stories, and to you.

  Cheers.
