      *   Make sure the advice is actionable for the user's internal reasoning.
      *   (Self-Correction): Be careful not to diagnose Nietzsche's own collapse, but focus on his *arguments*.
      *   (Refinement): Emphasize that for Nietzsche, the body is the "great reason," the mind is the "small reason."

