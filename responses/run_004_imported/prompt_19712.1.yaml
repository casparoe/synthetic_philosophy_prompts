answer: |-
  Friends, family, colleagues, and students. Thank you for being here.

  Looking out at this room, I see two distinct groups who loved my mother in different ways. I see my father's family, who hold deeply to the sovereignty of God and the assurance that He holds all things in His hands. And I see my mother's doctoral students, who know that she spent forty years arguing that human freedom is real, that love cannot be coerced, and that the mechanics of divine providence are far more intricate than a simple script.

  Usually, these two groups debate in seminar rooms. Today, they unite in grief and gratitude. And I believe my mother would want me to speak in a way that honors both the God she served and the truth she sought.

  My mother was a philosopher. She believed that precision was a form of love. She taught that God is not merely watching history unfold, nor is He forcing every piece into place like a puppeteer. Instead, she believed that before the foundation of the world, God knew the deepest truths of every heart. He knew not only what we *would* do, but what we *would freely choose* to do in any circumstance He might place us.

  She often illustrated this with the story of my father. She said that God knew, before time began, that my father would stand under the oak tree behind her childhood home and propose. God knew she would say yes. But—and this was vital to her—God did not make him propose. He did not make her say yes. He simply knew them. He knew that if He placed them in that garden, at that hour, their free hearts would choose each other.

  For my mother, this was not a technicality. It was the difference between a robot and a bride. It was the difference between a forced march and a dance.

  She resisted the phrase "everything happens for a reason" when it was used to suggest that every tragedy was a direct decree from heaven, or that our choices were illusions. She believed that God is sovereign enough to weave even our free choices into a beautiful tapestry, without needing to pull the threads so tight that they break. He is the Master Weaver, but we are the thread that chooses its own color.

  So, how do we grieve her today?

  To my father's family: Do not fear that her view diminishes God's power. She believed God's knowledge was so perfect, and His wisdom so profound, that He could guarantee His promises without violating our wills. She trusted that God had prepared good works for her to walk in, and that He was present in every moment of her life, guiding the circumstances even as she guided her choices.

  To her students: Do not fear that I am collapsing her life's work into fatalism. She died as she lived: a free creature, loved by a God who knew her fully. Her passing is not a glitch in the system, nor was it a predetermined script she was forced to read. It is the final chapter of a story she wrote in cooperation with a God who knew exactly how she would end her race.

  For the rest of us, who just miss her: Her theology was a source of immense comfort. It meant that God never wasted her freedom. Every time she chose patience over anger, or truth over comfort, God knew she would choose it, and He had a place prepared for that choice in the history of the world. Her life mattered. Her choices mattered. They were not accidents, and they were not forced. They were known, and they were loved.

  There is a profound peace in knowing that we are never outside the reach of God's knowledge, yet never stripped of the dignity of our will. My mother is no longer wrestling with the counterfactuals. She is no longer defending the coherence of divine foreknowledge. She is standing in the reality that her arguments pointed toward.

  She is under the Oak Tree, so to speak. She is in the presence of the One who knew her before she took her first breath, who walked with her through every free choice she ever made, and who has now welcomed her into the fullness of the life she spent forty years describing.

  Let us grieve, for we loved her. But let us not grieve as those without hope. For the God who knew her perfectly has not lost her. He knew she would come to Him, and He was there to meet her.

  Amen.
