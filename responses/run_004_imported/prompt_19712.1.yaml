      *   **Constraint:** 5-minute speaking time (approx. 750-850 words).
      *   **Goal:** Comfort the mourners, honor the mother's specific theological view without misstating it, and bridge the gap between the Reformed relatives and the Molinist students.

  2.  **Deconstruct the Theological Tightrope:**
      *   *Reformed View (Calvinism):* Emphasizes sovereignty, often leaning towards compatibilism or determinism. God ordains all things.
      *   *Molinist View (Mother's):* Emphasizes sovereignty *and* libertarian freedom. God actualizes a world based on His knowledge of counterfactuals.
      *   *The Bridge:* Both agree God is sovereign and providential. Both agree God loves and has a plan. The difference is *how* God relates to human freedom.
      *   *The Trap:* Saying "God planned every detail" sounds like determinism to the students. Saying "God just watched it happen" sounds like Open Theism/Simple Foreknowledge to the students and disappoints the Reformed side.
      *   *The Solution:* Focus on *providence without coercion*. Use language of "orchestration," "invitation," "knowing the heart," and "weaving." Avoid "caused," "forced," "scripted," or "mere observation."

  3.  **Drafting - Section by Section:**

