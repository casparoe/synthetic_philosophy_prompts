      *   *Complaint 2:* Old age weakens the body (*corpus facit infirmius*).
      *   *Complaint 3:* Old age deprives us of almost all pleasures (*privat omnibus fere voluptatibus*).
      *   *Complaint 4:* Old age is not far from death (*non longe abesse a morte*).

