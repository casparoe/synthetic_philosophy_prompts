      *   **Context:** Observing ageism in tech (seniors managed out, "reorgs," perceived as slow/expensive/not hungry).
      *   **Source Material:** Cicero's *De Senectute* ("On Old Age"), specifically the arguments put in the mouth of Cato the Elder.
      *   **Task:** Reconstruct Cato's response to ageism in the software industry using his *own framework* (the four complaints).
      *   **Requirements:**
          1.  Map Cicero's four complaints to tech industry analogues.
