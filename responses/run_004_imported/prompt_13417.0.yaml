answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm [Your Name], and I have the privilege of being Priya's friend. Looking around this room, I realize we have a unique challenge tonight. On one side, we have the families, who are here to celebrate love, joy, and the open bar. On the other side, we have Priya's economics cohort, who are likely already scanning the room for inefficiencies in the seating chart.

  I want to speak to both of you, because the story of how Priya and [Fiancé's Name] got here is actually a story about how they make decisions.

  A few months ago, Priya and I got into a long, half-serious argument about the wedding budget. I took the traditional view. I said, "Look, you want to spend X, he wants to spend Y. Just split the difference. Meet in the middle. That's what compromise is."

  Priya looked at me like I had suggested serving instant coffee at the reception. She refused. Instead, she pulled out a napkin and drew a diagram. She talked about a "disagreement point" and an "ideal point." She insisted that real fairness wasn't about meeting in the middle; it was about making sure that whatever they decided, they were both giving up the same *proportion* of what they truly wanted.

  At the time, I thought she was overthinking it. But watching them plan this wedding, and watching their relationship over the years, I realized she wasn't overthinking it. She was protecting something vital.

  There is a concept in bargaining theory—and I promise I will keep this English—that suggests the best agreement isn't the one where you both lose the same amount. It's the one where you both get to keep the same percentage of your dreams.

  In a standard compromise, if one person has bigger dreams than the other, "splitting the difference" means the dreamer always loses more. But Priya and [Fiancé's Name] have chosen a different path. They have chosen a model where, if the horizon expands for one of them, the other doesn't just hold the line—they adjust the aim so that both are reaching for the same height relative to their own potential.

  To the families: This just means they promise to never ask each other to shrink. If [Fiancé's Name] has a massive opportunity for his career, Priya doesn't just "compromise" by staying small. They find a way to ensure she is just as fulfilled in her world as he is in his. And vice versa.

  To the economists: They are rejecting Independence of Irrelevant Alternatives in favor of Individual Monotonicity. They are ensuring that as the feasible set expands, their ratio of utopia remains equal.

  But to everyone, mostly to Priya and [Fiancé's Name]:

  Marriage is going to present you with a thousand budget negotiations. Some will be about money, some about where to live, some about how to spend a Sunday morning. It would be easy to just split the difference. To meet in the middle.

  But my wish for you is that you never settle for the middle.

  May you always look for the solution that honors the scale of each other's hopes. May you recognize that fairness isn't about equal sacrifice; it's about equal flourishing. When the circumstances change, as they inevitably will, may you redraw the line together so that you are always standing on the same frontier, holding the same share of the possible.

  Priya, you were right about the napkin. And [Fiancé's Name], the fact that you didn't run away when she drew it, but instead picked up a pen and added to the diagram, tells me everything I need to know about your future.

  Let's raise a glass. To the ideal point, to the Pareto frontier, but mostly, to the two of you.

  Cheers.
