answer: |-
  The reel-to-reel spun with a low, hypnotic whir, the magnetic tape catching the dust of the hut. Outside, the jungle night was a wall of sound—cicadas, tree frogs, the distant, rhythmic thrum of something that might have been water or machinery. Inside, the air was still and heavy.

  Elena paused the playback. The word hung in the silence between them. *Gavagai.*

  "We're writing fiction, Marcus," she said. She didn't look at him. She was staring at the spools, watching the feed.

  Marcus rubbed his face with both hands, the stubble rasping against his palms. "Don't start. Not tonight."

  "It's the only night we have. Tomorrow we go back out there, and you're going to point at another rabbit, and he's going to say *gavagai*, and you're going to write down *Rabbit* in the notebook with a capital R. As if it's settled."

  "It *is* settled," Marcus said, leaning forward, his elbows on his knees. "Context, Elena. Yesterday he skinned one. He ate the meat. He didn't worship the fur or bury the leg. He treated it as a discrete, enduring object. A rabbit."

  Elena finally turned to him. Her eyes were tired, rimmed with the red of mosquito bites and screen glare. "That's what *you* see. When you say he 'skinned it,' you're importing a verb that presupposes an object distinct from its surface. When you say he 'ate the meat,' you're assuming a mass noun distinction that might not exist in his ontology. You're describing his actions using English categories to prove English categories work."

  "I'm describing physical actions," Marcus snapped. "Knife touches hide. Hide separates. Fire cooks muscle. That's not ontology, that's physics."

  "Is it? To count as 'separating,' there has to be a 'whole' that was there before. If his language carves the world at the joints of 'undetached rabbit parts,' then the 'whole' rabbit is a logical construction, not a primary reality. If he speaks in 'rabbit stages,' then the rabbit that went into the pot is not numerically identical to the rabbit that hopped across the clearing. It's a temporal slice."

  Marcus stood up and walked to the window, looking out into the blackness. "Quine. Always Quine. You wrote your dissertation on it, you don't have to live the rest of your life inside it."

  "It's not a lifestyle, it's a logical constraint. No amount of stimulation can distinguish between 'rabbit,' 'rabbit part,' and 'rabbit stage.' They all trigger the same sensory receptors. The same retinal pattern."

  "So we just give up?" Marcus turned back, his voice rising. "We fill the notebook with question marks? 'Gloss: Rabbit? Or perhaps a temporal slice of rabbithood?' It's cowardice, Elena. It's using indeterminacy as an excuse for not doing the hard work of integration."

  "It's not cowardice to admit there is no fact of the matter!" She tapped the recorder. "There is nothing *there* to find. Meaning isn't a hidden object inside his head waiting for us to dig it out. It's a mapping of our sentences to his stimuli. And the mapping is radically underdetermined. You can build a manual that translates *gavagai* as 'rabbit,' and another manual that translates it as 'undetached rabbit part,' and both manuals will account for every possible utterance he ever makes. Both are compatible with all the evidence."

  "Quine's evidence is austere to the point of starvation," Marcus said, pacing the small room. "He limits us to assent and dissent. Pointing. Nodding. Shaking. But we aren't behaviorists. We're participants. We live with them. We share the fire. We share the food."

  "And to describe that sharing, you need language," Elena said, her voice dropping, calm and cutting. "If I ask, 'Is this the *same* gavagai as before?' I am already forcing his apparatus of identity to match mine. If he says 'No,' you'll think he means it's a different rabbit. But maybe he means it's a different *stage* of the same rabbit-process. You can't test for identity without already assuming a translation of identity. It's circular, Marcus. It's a closed loop."

  Marcus stopped pacing. He looked at the recorder, then at her. "So what's the alternative? Solipsism? We sit in the hut and don't translate anything because we can't guarantee the metaphysics?"

  "The alternative is humility. We write 'gavagai.' We leave it at that."

  "That's not linguistics. That's stamp collecting." Marcus walked over to the table and picked up the field notebook. He flipped it open to the page from that morning. *Gavagai = Rabbit.* "Look, I grant you the logic. In the abstract. In the armchair. But out here? The Principle of Charity isn't just a heuristic, it's a survival mechanism. If I assume he means 'rabbit' and I bring him a rabbit, he smiles. If I bring him a rabbit leg, he looks confused. That confusion is data."

  "Confusion is compatible with multiple hypotheses," Elena countered. "He might be confused because you brought him a part when he asked for the stage. Or a stage when he asked for the part. The behavioral response—the smile, the frown—is consistent with all three glosses. You're privileging 'rabbit' because it's the noun English speakers use. You're colonizing his ontology because it's easier than dismantling your own."

  Marcus slammed the notebook shut. The sound was sharp, like a gunshot in the small space. "I'm privileging it because it works. Not logically, maybe. Pragmatically. We hunt, we eat, we sleep. The world pushes back. If I walk off a cliff because I think the word for 'cliff' means 'solid ground,' I die. The reality constrains the translation."

  "The reality constrains the *behavior*," Elena corrected softly. "It doesn't constrain the *meaning*. You can survive perfectly well believing the cliff is a solid god who wants to catch you, as long as you don't jump. Your ontology can be wrong, or rather, indeterminate, and your survival can be perfect."

  "You think this is about survival?" Marcus laughed, a short, bitter sound. "You think I'm arguing for 'rabbit' because I want to stay alive? I'm arguing for it because I believe we can know each other. Not perfectly. Not with God's eye view. But enough. If you're right, Elena, then we're not talking to him at all. We're just mirroring noises. There's no connection. Just isomorphic structures."

  "Maybe there isn't," she said. "Maybe that's the terror you're running from."

  The silence returned, heavier than before. The recorder had stopped spinning, but neither of them moved to turn it off. The red light of the record button blinked slowly, like a watching eye.

  Marcus picked up his pen. He hovered it over the notebook, over the word *Rabbit*.

  "I'm going to keep writing it down," he said, his voice quiet but firm. "Not because I think I've solved Quine. But because if I stop assuming we can mean the same thing, I might as well pack up and go home. I need the fiction to do the work."

  Elena looked at the blinking light. "And I need the truth to know why the work feels like lying."

  Marcus capped the pen. He didn't look at her. "Then we're going to have a long field season."

  "We're already having it," Elena said. She reached out and pressed stop. The red light died. The room was dark, save for the kerosene lamp, and the jungle outside continued to scream, indifferent to whether it was full of rabbits, parts, or stages.
