answer: |-
  1. **Humphreys' Paradox and the Direction of Time**
  Paul Humphreys argued that if propensities are real physical dispositions, they must align with causal direction—causes produce effects, not vice versa. Yet the standard probability calculus allows us to invert conditionals via Bayes' theorem: if there is a propensity for a coin to land heads, the calculus implies a conditional probability of the *toss* given that it *landed heads*. This looks like a propensity running backward in time. If you accept Humphreys' critique, you seem forced to abandon the standard probability calculus; if you reject it, you seem to abandon the causal asymmetry that makes propensity theory attractive in the first place. How do you navigate this dilemma without sacrificing the very features that define your position?

  *   **Follow-up (If she suggests restricting the axioms):** You've suggested in past work that we can simply restrict the probability calculus to prevent these "inverse" propensities while keeping the physical disposition intact. But if the mathematical structure no longer obeys the standard axioms of probability, in what sense are you still talking about *probability*? At what point does patching the formalism to save the metaphysics turn the theory into a category error?

  2. **The Reference Class Problem for Setups**
  Frequentists are often criticized for the reference class problem: a single event belongs to infinite classes (e.g., a smoker, a male, a 50-year-old), each with different frequencies. You argue propensity theory escapes this by focusing on the specific "chance setup" of the single case. But a single case can also be described as an instance of many different physical setups depending on how finely we slice the conditions (e.g., the atom's energy state, the ambient temperature, the gravitational field). How do you non-arbitrarily pick out *the* relevant setup that carries *the* propensity without relying on the same description-relative choices that plague the frequentist's reference class?

  *   **Follow-up (If she appeals to the "complete physical state"):** If the propensity attaches only to the *complete* physical state of the universe at that moment, doesn't that make the propensity unknowable in principle, since we can never specify the complete state? And if it attaches to a *partial* description, aren't you back to the reference class problem, where different partial descriptions yield different propensities for the same event?

  3. **Lewis's Principal Principle and Undermining**
  David Lewis's Principal Principle links objective chance to rational credence: if you know the chance of an event is $X$, your belief should be $X$. But Lewis identified an "undermining" problem where a chance process could produce a long run of outcomes statistically at odds with the very propensities meant to generate them, potentially undermining the truth of the chance claim itself. Lewis patched this by restricting admissibility, but that patch relies on a Humean view of chance you reject. How do single-case propensities feed the Principal Principle without Lewis's Humean machinery, and do you have a solution to undermining that doesn't simply stipulate the connection by fiat?

  *   **Follow-up (If she posits a normative "bridge principle"):** If the link between the physical disposition and rational belief is a normative bridge principle rather than something derived from the metaphysics, what grounds that principle? If the propensity is truly a single-case disposition that doesn't guarantee long-run frequencies, why should a rational agent align their expectations with it rather than with their own empirical data?

  4. **The "Formalism vs. Physics" Defense**
  In your responses to technical objections, you often employ a line of defense that suggests the mathematical formalism is secondary to the physical reality—essentially, "the formalism can be patched; the physics can't." This implies that the probability calculus is merely a bookkeeping tool that we can alter to fit the metaphysical facts. But physicists rely on the calculus to make predictions; if the bookkeeping doesn't match the ledger, the theory loses its predictive utility. Is there a limit to how much you can distort the formalism before the "physics" you are saving becomes empirically inaccessible?

  5. **Explanatory Surplus**
  Let's assume for the sake of argument that single-case propensities exist. What explanatory work are they doing that a sophisticated subjectivist or Bayesian account cannot do? When a physicist says an atom has a 50 percent chance of decaying, the Bayesian says this quantifies our uncertainty, and you say it quantifies a physical disposition. In terms of experimental outcomes, predictions, or technological applications, what is the cash value of your claim? Is the propensity anything more than a reification of the model?

  6. **Quantum Mechanics and the Born Rule**
  Your favorite examples often come from quantum mechanics, where the Born Rule gives probabilities for single events. But the Born Rule is deeply integrated into the standard Hilbert space formalism, which obeys the standard probability calculus. If propensity theory requires us to patch or restrict the probability calculus to avoid paradoxes like Humphreys', does that not require a corresponding patch to quantum mechanics itself? Are you prepared to argue that the standard formalism of quantum theory is metaphysically misleading and needs revision to accommodate propensities?

  7. **Ontological Inflation**
  Critics often charge that propensity theory multiplies entities beyond necessity. We observe the setup; we observe the outcome; we observe the frequencies over time. The "propensity" is posited as a hidden property linking the setup to the outcome, yet it is never observed directly, only inferred from the very outcomes it is meant to explain. How do you respond to the charge that the propensity is an ontological ghost—a placeholder for our ignorance of deterministic causes or a mere projection of statistical regularities?

  8. **Falsification and Theory Death**
  Finally, I want to ask about the boundaries of your theory. Philosophical positions are often insulated from refutation by treating counter-evidence as a need for conceptual adjustment. So, plainly: what kind of empirical or theoretical discovery would count as evidence *against* propensity theory itself, as opposed to evidence that its formalism merely needs adjusting? Is there a possible world, or a possible experiment, where you would concede that single-case propensities do not exist?
