      *   **Einstein's SR:** Simultaneity is relative. No privileged frame. This aligns with Eternalism (Block Universe) via the Rietdijk-Putnam argument.
      *   **Neo-Lorentzianism:** Empirically equivalent to SR but posits a hidden ether/privileged frame. Saves Absolute Time but violates the spirit of relativity (and arguably *hypotheses non fingo* if the frame is undetectable).
