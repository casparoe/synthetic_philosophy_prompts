answer: |-
  It is a pleasure to correspond with someone who has spent a career in the lab and now turns the same rigorous eye toward metaphysics. Your summary of the Rietdijk-Putnam argument and the tension it creates for presentism is spot-on; it is indeed the sharpest spear in the eternalist's arsenal.

  Reconstructing Newton's reaction requires us to navigate three distinct layers of his thought: his empirical methodology, his metaphysical commitments regarding space and time, and his often-overlooked theological motivations. If we weigh these against the implications of Special Relativity (SR) and the Neo-Lorentzian alternative, I believe we can arrive at a plausible verdict.

  Here is how I suspect the great man would reason, and where he would ultimately stand.

  ### 1. The Misunderstanding of *Hypotheses Non Fingo*
  First, we must correct a common modern misconception about Newton's famous dictum. When Newton wrote *hypotheses non fingo* in the *Principia*, he was not establishing a positivist ban on unobservable entities. If he were, he would have had to discard Absolute Space and Time immediately, as they are no more directly observable than the Neo-Lorentzian privileged frame.

  Newton justified Absolute Space via the **Bucket Argument**. He argued that while relative velocity is undetectable, absolute *acceleration* (rotation) produces observable inertial effects (the water climbing the bucket walls). Therefore, there must be a substantive "space" relative to which this acceleration occurs. For Newton, an unobservable posit was permissible if it was the *necessary condition* for observable phenomena.

  Faced with SR, Newton would note that SR eliminates the possibility of detecting absolute *velocity*, but retains absolute *acceleration* (proper time differences in the Twin Paradox are real and measurable). He would likely argue that SR describes the behavior of measuring rods and clocks (which are material bodies subject to forces) rather than Time itself.

  ### 2. The Theological Anchor
  This is the factor most secular philosophers of physics tend to minimize, but for Newton, it was paramount. Newton was a devout, albeit heterodox, Christian (an Arian). For him, Absolute Space and Time were not merely physical conveniences; they were attributes of God.

  *   **Absolute Time** was a reflection of God's eternity and permanence.
  *   **Absolute Space** was a reflection of God's omnipresence (what he called God's "sensorium").

  The "Block Universe" of eternalism presents a severe theological problem for Newton. If the future is as real as the past, the universe is a static, four-dimensional object. This threatens the notion of Divine Providence and intervention. Newton famously believed that God occasionally needed to intervene to stabilize the solar system (to prevent gravitational instabilities from collapsing the system). In a Block Universe, there is no "now" in which God can act; the entire history is laid out.

  Consequently, Newton would likely view Eternalism not just as physically counter-intuitive, but as metaphysically impious. He would resist the ontological conclusion of the Rietdijk-Putnam argument with every fiber of his being.

  ### 3. The Neo-Lorentzian Temptation
  So, would he embrace Neo-Lorentzianism? This interpretation saves Absolute Time by positing a preferred frame that is empirically undetectable due to dynamical effects (length contraction, time dilation) masking our motion through the ether.

  Here, Newton would feel a genuine tug-of-war.
  *   **Pro:** It saves the "True Time" of the Scholium.
  *   **Con:** It renders that True Time causally idle regarding detection.

  Newton disliked "occult qualities"—properties that have no mechanical explanation. A privileged frame that nature conspires to hide from all experiments might strike him as suspiciously occult. However, recall that Newton's gravity was criticized by Leibniz as an occult quality because it acted at a distance without a medium. Newton accepted it because the *phenomena* demanded it.

  If Newton could be convinced that the *phenomena* of electrodynamics (Maxwell's equations) required a medium, he might accept the Neo-Lorentzian ether. But SR shows us that the equations work *without* it.

  ### 4. The Verdict: Phenomenal vs. Noumenal Time
  I believe Newton would ultimately split the difference, but in a way that preserves his core metaphysics. He would likely adopt a stance similar to **Kantianism before Kant**, or what we might call **Instrumentalism regarding SR, Realism regarding Absolute Time.**

  He would argue that Einstein's *t* (coordinate time) is what Newton called in the Scholium **"Relative, Apparent, and Common Time"** (e.g., an hour, a day, a month). It is a sensible measure of duration, liable to be inequable depending on the state of motion of the clock.

  However, he would insist that this does not refute **"Absolute, True, and Mathematical Time."** He would claim that SR proves only that *measuring* absolute simultaneity is impossible for material observers bound by the speed of light, not that absolute simultaneity does not *exist*.

  He would likely reject the Block Universe outright. To Newton, the inference from "we cannot measure a universal now" to "a universal now does not exist" is a logical non-sequitur. It confuses epistemology (what we can know) with ontology (what is real).

  ### Conclusion
  If forced to choose between the Block Universe and Neo-Lorentzianism, **Newton would choose Neo-Lorentzianism**, but with a caveat.

  He would view the undetectable privileged frame not as a scientific hypothesis to be tested, but as a **metaphysical necessity** required to ground causality and Divine action. He would likely argue that the relativity of simultaneity is a feature of the *interaction* between matter and light, not a feature of Time itself.

  However, his methodological scruples (*hypotheses non fingo*) would bother him. He would likely spend his "retirement" (much like your own) searching for a cosmological "bucket argument"—some large-scale inertial effect that could pick out the privileged frame. Ironically, he might find it in the **Cosmic Microwave Background (CMB)**. The CMB provides a rest frame for the universe that is empirically distinguishable. While this doesn't restore Newtonian Absolute Time in the strict sense (it's still a frame defined by matter/energy, not space itself), it restores a preferred "now" for cosmology.

  **Summary of Newton's Stance:**
  1.  **Physics:** Accepts the mathematical formalism of SR as the correct description of "Apparent Time" and material measurement.
  2.  **Metaphysics:** Rejects Eternalism/Block Universe as incompatible with causality and theology.
  3.  **Methodology:** Accepts a Neo-Lorentzian ontology not because it is empirically distinct, but because it is metaphysically required to make sense of the "Apparent" physics.

  He would likely tell Rovelli and the eternalists that they have confused the map for the territory. The relativity of the map (SR) does not prove the territory (Time) lacks a structure; it only proves that our surveying tools are limited. He would remain, to the end, an Absolute Presentist, viewing the Block Universe as a charming mathematical fiction, but a fiction nonetheless.
