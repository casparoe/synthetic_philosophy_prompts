      *   **Why Time Doesn't Save It:** Distinguish between the *generation* of the outcome and the *evaluation* of the gamble. Also, bring in the "Two Pasadena Games" scenario (Easwaran's point). If I play two independent Pasadena games, the sum is even worse behaved.
