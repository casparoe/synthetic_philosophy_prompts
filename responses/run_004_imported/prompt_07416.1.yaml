  2.  **Deconstruct the Core Philosophical Issue:**
      *   *The Math:* $\sum P_n V_n$. In Pasadena, $\sum |P_n V_n| = \infty$ but $\sum P_n V_n$ converges conditionally.
      *   *The Intuition:* Expectation = Long-run average value (Law of Large Numbers).
      *   *The Conflict:* If I play the game once, I get one outcome. If I play it infinitely many times, what happens to the average payoff?
      *   *The "Temporal Ordering" Objection:* The game *happens* in time. Toss 1 happens before Toss 2. Why can't we just sum in that order?
