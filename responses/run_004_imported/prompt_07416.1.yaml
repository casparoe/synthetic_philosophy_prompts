      *   **Philosophical Implications:** Mention Easwaran (2008) and the weak/strong expectation distinction. This shows the distinction is stable enough to build new theory on, even if classical expectation breaks.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Point 1: LLN.* If expectation = fair price, then over many plays, my average gain should match the price. In Pasadena, the average gain doesn't converge. It wanders. So no fair price exists.
      *   *Point 2: Partition Invariance.* If I tell you "You win \$X or \$Y" vs "You win \$Z", and it's the same physical situation, the value should be the same. Conditional convergence violates this.
      *   *Point 3: Temporal Ordering.* The user asks: "Why not sum in toss order?" Response: Because the "toss order" is just one indexing. If I bet on "Heads on odd tosses" vs "Heads on even tosses," I'm carving the space differently. Also, if I play the game twice, which toss happens first? The temporal order *within* the game is fixed, but the *summation* is a mathematical operation on the probability space, not a simulation of time.
