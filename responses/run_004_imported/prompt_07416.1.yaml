answer: |-
  This is one of the sharpest puzzles in contemporary formal epistemology, and your frustration is well-founded. The transition from "the math allows rearrangement" to "therefore the value is undefined" feels like a non sequitur unless one has a robust grasp of what *expectation* is supposed to *do* for a decision theorist.

  The short answer is that the problem isn't mathematical bookkeeping; it's that conditional convergence breaks the link between expectation and the **Law of Large Numbers (LLN)**. When that link breaks, expectation ceases to function as a guide to rational choice in repeated scenarios, and partition invariance (a core requirement of probability) is violated.

  Here is an intuitive account of why conditional convergence creates genuine indeterminacy, why the temporal ordering doesn't save it, and why the distinction between St. Petersburg and Pasadena is stable.

  ### 1. Expectation as Long-Run Average
  To understand why the Pasadena expectation is undefined, we must ask: What work is the number $E[X]$ supposed to do?

  In finite cases, and in absolutely convergent infinite cases (even St. Petersburg), the expectation corresponds to the **long-run average payoff**. If you play a gamble with expectation $E$ repeatedly $N$ times, the Strong Law of Large Numbers tells us that as $N \to \infty$, your average payoff per game will converge to $E$ with probability 1.
  *   **St. Petersburg:** The expectation is $+\infty$. If you play it repeatedly, your average payoff grows without bound. It doesn't settle on a number, but it *does* settle on a behavior: it goes to infinity. Every rearrangement agrees on this.
  *   **Pasadena:** The series is conditionally convergent. Here, the Strong Law of Large Numbers **fails**.

  If you play the Pasadena game repeatedly, your average payoff does *not* converge to $\ln 2$. In fact, it does not converge to *anything*. Depending on the sequence of outcomes you happen to get in your repeated plays, the running average can oscillate wildly, drift toward positive infinity, or drift toward negative infinity.

  **The Intuition:** If I tell you the "value" of the game is $\ln 2$, I am implying that if you pay slightly less than $\ln 2$ to play it many times, you will profit in the long run. But in the Pasadena case, this is false. There is no stable long-run average. Therefore, there is no single number that represents the "worth" of the gamble in terms of eventual return. The mathematical indeterminacy of the series mirrors a physical indeterminacy in the long-run behavior of the agent.

  ### 2. Why "Temporal Ordering" Doesn't Save It
  Your reading group's objection is natural: *"The game happens in time. Toss 1 happens, then Toss 2. Why isn't the sum $\sum_{n=1}^\infty$ privileged because it respects the causal/temporal structure of the chance process?"*

  There are two principled reasons why this doesn't resolve the indeterminacy.

  #### A. Partition Invariance
  Probability theory requires that the value of a gamble depend on the **events and their payoffs**, not on how we index or describe them.
  Imagine I describe the Pasadena game to you in two ways:
  1.  **Standard:** "Heads on toss $n$ pays $(-1)^{n+1} 2^n / n$."
  2.  **Re-indexed:** I group the outcomes differently. For example, I define outcome $A$ as "Heads on toss 1 or 2," outcome $B$ as "Heads on toss 3 or 4," etc., and assign the appropriate aggregated probabilities and payoffs.

  In standard decision theory, if two descriptions refer to the same physical probability space and payoff function, they must yield the same expectation. If the value of the gamble changes simply because I decided to group "Toss 3 and Toss 4" together before summing them, then the "value" is not a property of the gamble; it is a property of my *description* of the gamble.

  Conditional convergence means the sum depends on the ordering of the terms. But the sample space of outcomes is a **set**, and sets do not have an intrinsic order. Imposing the order $n=1, 2, 3...$ is an artifact of how we chose to enumerate the set. If the value of the gamble depends on that enumeration, the expectation operator is ill-defined on the probability space.

  #### B. The "Two Games" Problem
  Suppose you accept the temporal ordering argument for one game. Now consider playing **two independent Pasadena games** simultaneously (Game A and Game B).
  *   Game A has expectation $\ln 2$ (by your temporal logic).
  *   Game B has expectation $\ln 2$.
  *   Linearity of Expectation is a cornerstone of decision theory: $E[A + B]$ should equal $E[A] + E[B]$.

  However, if you add the payoffs of two Pasadena games, the resulting series is even more pathological. The combined series can be rearranged to sum to *anything*, even more easily than the single game. If you treat the temporal order of Game A and the temporal order of Game B as privileged, you run into conflicts when trying to evaluate the combined portfolio. The "temporal order" of the joint state space is not uniquely defined by the temporal orders of the components.

  ### 3. Infinite vs. Indeterminate (St. Petersburg vs. Pasadena)
  You asked whether the distinction between St. Petersburg (infinite) and Pasadena (undefined) is stable. It is.

  *   **St. Petersburg (Absolute Divergence):** The series diverges to $+\infty$. While $+\infty$ is not a real number, the behavior is **stable**. Every rearrangement diverges to $+\infty$. Every reasonable decision theory (that allows infinite values) agrees: if the cost to play is finite, you should play. The "value" is consistently infinite.
  *   **Pasadena (Conditional Convergence):** The series is **unstable**. One rearrangement says the value is $+1,000,000$; another says $-1,000,000$. This isn't just "infinity"; it's **directionless**.
      *   If the value is $+1,000,000$, you should pay \$100 to play.
      *   If the value is $-1,000,000$, you should pay \$100 *not* to play.
      *   Since the theory cannot tell you which rearrangement is the "correct" one, it cannot tell you whether to pay \$100 to play.

  This is why "undefined" is the correct label. It's not that the number is too big (St. Petersburg); it's that the concept of a single summarizing number fails to capture the gamble's properties. The gamble lacks a "center of gravity."

  ### 4. Is the Distinction Stable? (Easwaran's Contribution)
  You asked if this distinction falls apart under scrutiny. Interestingly, scrutinizing it led to some of the best recent work in the field (specifically Kenny Easwaran's 2008 *Philosophical Review* paper, "Strong and Weak Expectations").

  Easwaran argues that we should distinguish between:
  1.  **Strong Expectation:** The standard definition (requires absolute convergence). Pasadena fails this.
  2.  **Weak Expectation:** Defined by the limit of the average payoff in repeated play (LLN behavior).

  For the St. Petersburg game, the Weak Expectation is infinite. For the Pasadena game, **the Weak Expectation does not exist** (the average doesn't converge).
  However, Easwaran shows that for some variants (like the "Altadena" game, which is Pasadena + \$1), the Weak Expectation *does* exist even if the Strong Expectation doesn't.

  This suggests the distinction is **highly stable**. It carves the logical space of gambles into three distinct categories:
  1.  **Well-behaved:** Finite, absolute convergence (Standard gambles).
  2.  **Infinite but stable:** Absolute divergence to $+\infty$ or $-\infty$ (St. Petersburg).
  3.  **Pathological:** Conditional convergence (Pasadena).

  The Pasadena game is uniquely pathological because it violates **Linearity** and **Dominance** in ways the St. Petersburg game does not. In St. Petersburg, if Gamble A dominates Gamble B, $E[A] > E[B]$ holds (both are $\infty$, but the inequality holds in the extended reals). In Pasadena, you can construct scenarios where a dominated gamble has a higher "sum" than the dominating one, simply by rearranging terms.

  ### Summary for Your Reading Group
  To articulate this to your group, you might frame it this way:

  > "The problem isn't that the sum is hard to calculate; it's that the sum fails to represent the **stability** of the gamble. Expectation is supposed to tell us what happens in the long run. In the St. Petersburg game, the long run is consistently infinite. In the Pasadena game, the long run is chaotic—it has no stable average.
  >
  > Regarding the temporal ordering: Expectation is a property of the **probability space**, which is a set of outcomes. Sets don't have orders. If the value of a gamble depends on the order in which we choose to list the elements of a set, then 'value' is not a property of the gamble, but of our notation. Since rational choice shouldn't depend on notation, the expectation must be declared undefined."

  The Pasadena game shows that **countable additivity** (a standard axiom of probability) is incompatible with **unbounded utility** if we want to maintain that expectations guide long-run behavior. You have to give up one. Most formal epistemologists keep countable additivity and accept that Pasadena-style gambles simply have no expectation.
