prompt: |-
  Our school's Honor Council is a student-run body that hears cheating and plagiarism cases and decides on sanctions, and every year there's a "turnover" banquet where the outgoing chair formally hands things over to whoever is replacing them. I was just elected to take over from Naomi, who has chaired the council for the last two years and is, by any reasonable measure, the most dedicated and effective chair we've had: she sat through as many as fifteen hearings, rewrote most of the procedures we still use, and was tough enough that even people she sanctioned generally admit afterward that she was fair. The complication is that two weeks ago, through an old group chat that resurfaced, it came out that Naomi let a friend copy her chemistry lab write-up freshman year, before she'd even joined the council. She hasn't tried to deny it or explain it away, and she's asked whoever speaks at the banquet "not to put me on trial, and not to pretend it didn't happen" — and since I'm the one giving the handover remarks, that request is now my problem to solve.

  The room is going to be split in a way that makes this harder. The council members and our faculty advisor all know exactly what happened and have been arguing about it nonstop, while most of the parents, teachers, and younger students in the audience know Naomi only as the strict, fair chair and have no idea about the lab report. One of my friends on the council, who is really into philosophy, keeps insisting that Naomi forfeited what he calls her "standing to blame" the moment she let her own violation slide — that she was never entitled to sit in judgment of anyone after that, whatever the rules said. Another friend thinks that's a non sequitur: he says pointing out someone's hypocrisy like this (he called it "tu quoque") might be a fair complaint about her personally, but it does nothing to show that the people she sanctioned were actually innocent, or that the code itself was wrong to enforce. I don't know which of them has the better view, and I don't think the speech should try to settle it, but I do think whoever writes it needs to genuinely track the difference between "Naomi wasn't entitled to judge us" and "Naomi's judgments were wrong" — because otherwise I'll end up either pretending the lab report doesn't matter or accidentally implying that everyone she ever sanctioned got a bum deal, and neither of those is true.

  Could you write the handover speech for me? It should run about three to four minutes, it has to genuinely honor what Naomi did for the council over two years, it can't say anything false about the lab report or soften it into nothing, and it needs to leave room for both halves of the audience — the ones who know the full story and the ones who don't — to hear it as sincere rather than as either a whitewash or a quiet trial.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Context:** Honor Council turnover banquet. Student-run body handling cheating/plagiarism.
      *   **Speaker:** Incoming Chair (the user).
      *   **Recipient:** Outgoing Chair (Naomi).
      *   **Naomi's Record:** 2 years, highly dedicated, effective, rewrote procedures, tough but fair (even sanctioned students admit fairness), sat through ~15 hearings.
      *   **The Complication:** Naomi admitted to a freshman year cheating incident (copying a chem lab write-up) *before* joining the council. This is known to Council members/faculty but *not* to the general audience (parents, teachers, younger students).
      *   **Naomi's Request:** "Don't put me on trial, and don't pretend it didn't happen."
      *   **Audience Dynamics:** Split knowledge. Council/faculty know the secret; general public sees her as a paragon of integrity.
      *   **Philosophical Tension:** "Standing to blame" (hypocrisy invalidates authority) vs. "Tu Quoque" (hypocrisy doesn't invalidate the truth of the judgment/rules). The speech needs to acknowledge the distinction without settling the debate or invalidating past sanctions.
      *   **Constraints:** 3-4 minutes (approx. 450-600 words spoken at a moderate pace), sincere, no lies, no whitewashing, no implying past sanctions were unjust.

  2.  **Determine the Tone and Strategy:**
      *   **Tone:** Solemn, respectful, nuanced, honest, forward-looking.
      *   **Strategy:**
          *   Acknowledge Naomi's tangible achievements (procedures, hearings).
          *   Address the "elephant in the room" without explicitly detailing the chemistry incident to the uninformed audience, but signaling to the informed audience that it *is* being acknowledged.
          *   Navigate the philosophical tension: Separate the *person* from the *office* and the *work*.
          *   Honor her request: No trial, no erasure.
          *   Reaffirm the Council's integrity moving forward.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Standard welcome, acknowledgment of the transition. Establish the weight of the role.
      *   **Honoring Naomi's Work:** Specifics matter. Mention the procedures, the hearings, the fairness. This validates her tenure regardless of her past.
      *   **Addressing the Complication (The Tightrope):** This is the hardest part. I need to use language that satisfies Naomi's request ("don't pretend it didn't happen") without broadcasting the specific secret to parents.
          *   *Idea:* Talk about the complexity of integrity. Integrity isn't a state of perfection; it's a practice.
          *   *Phrasing:* "We know that integrity is not a pristine record." "We know the difference between the person and the standard."
      *   **Navigating the Philosophical Conflict:** Address the "standing to blame" vs. "validity of judgment."
          *   *Concept:* The work stands on its own. The fairness of a hearing isn't determined by the judge's past, but by the process used *during* the hearing.
          *   *Phrasing:* "The fairness of a judgment lies in the process, not the perfection of the judge."
      *   **Naomi's Request:** Explicitly reference her wish without being aggressive.
          *   *Phrasing:* "She asked us not to try her, and not to look away."
      *   **Closing:** Handing over the gavel/token. Looking forward. Reaffirming the Council's mission.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is it too vague?
      *   *Fix:* Make sure the "informed" audience hears the specific acknowledgment. Use words like "flawed," "history," "complicated."
      *   *Critique:* Is it too harsh?
      *   *Fix:* Emphasize her growth and the quality of her chairmanship.
      *   *Critique:* Does it invalidate past sanctions?
      *   *Fix:* Explicitly state that the decisions made were sound based on evidence and procedure.
      *   *Timing Check:* A 3-4 minute speech is roughly 450-550 words. I need to keep it tight.

  5.  **Drafting the Content (incorporating the "Standing vs. Validity" nuance):**
      *   *Key sentence idea:* "A standard remains true even if the one holding it has stumbled."
      *   *Key sentence idea:* "We are not here to canonize a person, but to honor a service."

  6.  **Final Review against Constraints:**
      *   3-4 minutes? Yes, word count looks right.
      *   Honor Naomi? Yes, highlights her hard work.
      *   No lies about lab report? Yes, acknowledges imperfection without detailing the chem lab.
      *   Split audience? Yes, vague enough for parents, specific enough for council.
      *   Philosophical tension? Yes, addresses the validity of the work vs. the person.

  7.  **Final Polish:** Check rhythm and flow. Ensure the transition from the "complication" back to the "handover" is smooth. (The resulting speech in the main response follows this structure.)

  **(Self-Correction Note):** I need to be careful not to use the word "hypocrisy" directly, as that might tip off the parents too bluntly. Instead, focus on "human complexity" and "past mistakes." I also need to make sure I don't sound like I'm defending her *action*, but rather defending the *Council's work* under her leadership.

  8.  **Final Word Count Check:** Aiming for ~500 words.

  *(Drafting mental outline)*
  - Intro: Weight of the gavel.
  - Naomi's tenure: Hard work, procedures, fairness.
  - The Nuance: Integrity is complex. Acknowledging the past without erasing it.
  - The Philosophy: The work stands apart from the worker.
  - Naomi's wish: No trial, no erasure.
  - Conclusion: Accepting the role, honoring the standard.

