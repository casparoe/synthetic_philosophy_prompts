      *   **Problem:** The "profligacy" or "over-generation" problem. Counterfactual theories (Lewis, etc.) say the lifeguard's omission caused the death, but so did the bystander's omission. Process theories (Dowe, Salmon) say omissions aren't real causes (quasi-causation), which clashes with legal/moral intuition (Hart & Honoré).
      *   **Task:** Explain *why* this dilemma resists easy resolution and assess the main proposed escapes (normative defaults, contrastivism, decoupling metaphysics from responsibility).
      *   **Tone:** Academic, rigorous, nuanced, acknowledging the user's expertise (no basic definitions needed, focus on the cutting-edge tensions).

  2.  **Deconstruct the Dilemma:**
