          *   *Idea:* Causation is a quaternary relation: $C$ rather than $C^*$ causes $E$ rather than $E^*$. We select the contrast based on context.
          *   *Assessment:* Explains why we *talk* about the lifeguard and not the bystander. In the context of "lifeguard duties," the contrast is "jumping vs. not jumping." For the bystander, the contrast isn't salient.
          *   *Verdict:* Elegant, preserves counterfactual structure. *But:* Does it solve the *metaphysical* problem or just the *pragmatic* one? If the relation is real, why does it depend on conversational context? Some argue this dissolves the problem rather than solving it.

      *   **Strategy 3: Decoupling Metaphysics from Responsibility (e.g., Moore, Dowe).**
          *   *Idea:* Stick to Process Theory. Omissions are *not* causes. Liability is based on something else (duty, opportunity, counterfactual dependence without causation).
