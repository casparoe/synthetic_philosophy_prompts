          *   Problem: Too many negative conditions satisfy this. The Queen of England didn't feed the swimmer. The bystander didn't. The lifeguard didn't. All are counterfactually necessary in the same logical sense. This leads to causal profligacy.
      *   *Horn 2: Physical Process/Conserved Quantity.* Causation requires transmission of energy/momentum.
          *   Problem: Omissions involve *no* physical process. Therefore, omissions aren't causes. But law and morality treat the lifeguard's omission differently from the bystander's. If it's not causation, what grounds the liability? "Quasi-causation" feels like a label, not an explanation.
      *   *Why it resists resolution:* It stems from a clash between two legitimate intuitions: (1) Causation is an objective, mind-independent relation in the world (favors Process), and (2) Causation is sensitive to agency, norms, and expectations ( favors Counterfactual + Norms). You can't easily have both without changing the definition of "causation."

  3.  **Evaluate Proposed Escapes:**

      *   **Strategy 1: Normative/Statistical Defaults (e.g., McGrath, Schaffer).**
          *   *Idea:* Only count omissions as causes if there was a duty or a statistical norm to act. The lifeguard had a duty; the bystander didn't.
          *   *Assessment:* Solves the legal/moral alignment. *But:* It makes causation mind-dependent or normative. Is causation really sensitive to job descriptions? This threatens the naturalistic ambition of metaphysics. It risks conflating *causation* with *responsibility*.
