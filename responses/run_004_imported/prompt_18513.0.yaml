      *   **The Unfinished Democracy (TP):** He died before finishing the democracy chapter. The fragment on women is troubling but consistent with his view of "natural power" (might makes right in the state of nature, but civil law should aim for rationality).

  3.  **Synthesize: Spinoza vs. Algorithmic Feeds:**
