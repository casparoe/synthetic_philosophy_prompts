answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two coffee cups sit between stacks of papers marked with dense marginalia. Elena (Expressivist) and Carl (Cognitivist) have been arguing for an hour.*

  **Carl:** Look, I'm willing to grant that the textbook version of the Frege-Geach problem is dead. If you tell me that validity is preserved because the *attitude* remains constant across embedded contexts, I can see the formal utility. But you're skipping the Unwin objection. It's not about validity; it's about the phenomenology of the mental states.

  **Elena:** I'm not skipping it. I'm saying your formulation of it relies on a crude picture of what the expressivist attitude is. You're assuming that if "Lying is wrong" expresses disapproval of lying, then "Lying is not wrong" must express... what? Disapproval of disapproval? That's the straw man.

  **Carl:** It's the natural inference. If the moral predicate maps to an attitude, negation must operate on that attitude. But accepting $\neg p$ isn't just refusing to accept $p$. I can withhold judgment on whether lying is wrong. But if I accept that lying is *not* wrong, I'm in a positive state. I'm tolerant. How does your apparatus distinguish *withholding* from *negating*? If you can't, you haven't solved the embedding problem; you've just hidden it under a blanket of "plan-laden" jargon.

  **Elena:** Fine. Let's get specific. I'm working with a Gibbardian framework, augmented by Schroeder's insights on inconsistency. I don't treat the attitude as a simple "boo." I treat it as *accepting a norm*. To judge "Lying is wrong" is to plan to blame liars. Now, how do we handle negation? We don't negate the *blaming*. We negate the *content of the plan* in a way that generates a specific inconsistency relation.

  **Carl:** Walk me through it. Concrete sentence.

  **Elena:** Take the embedded context: "If lying is not wrong, then stealing is not wrong." For this conditional to work, the antecedent "Lying is not wrong" must express a state that clashes with "Lying is wrong." On my view, to accept "Lying is not wrong" is to accept a norm that *permits* lying. It is to plan *not* to blame liars.

  **Carl:** So it's a second-order plan?

  **Elena:** No, that's the trap. It's a first-order plan regarding the same action, but with a different valence. Think of it as a coordinate system. "Wrong" assigns the coordinate *forbid*. "Not wrong" assigns the coordinate *permit*. The negation operator switches the coordinate. The "Unwin problem" dissolves because the mental state of permitting is distinct from the mental state of withholding. Withholding is having no plan regarding the blame. Permitting is having a plan *against* blaming.

  **Carl:** Okay, you've posited a distinction. But now you've bought it at a price. You've defined negation functionally by its role in generating inconsistency between plan-states. You say "Lying is wrong" and "Lying is not wrong" are inconsistent because you can't simultaneously plan to blame and plan not to blame for the same act.

  **Elena:** Exactly. That's the logic of planning.

  **Carl:** But here's where I pivot. You've saved the logic by making your "plan-states" behave exactly like beliefs. They have a direction of fit that allows for truth-apt embedding. They obey the laws of negation. They sustain *modus ponens*. Now we get to Dreier. If your expressivism is sophisticated enough to handle Unwin's negation problem by invoking a robust logic of attitudes, and you're willing to say that "It is true that lying is wrong" just expresses the same plan-state... haven't you just become a minimalist realist?

  **Elena:** We've been over this. We can use truth-talk without positing truth *properties*. "It is true that lying is wrong" is just a device for re-asserting the plan. It's endorsement.

  **Carl:** But that's the creeping minimalism charge! If you say the sentence "Lying is wrong" has a truth-condition— even a minimalist one— and you say the mental state is a cognitive-like state that tracks these truth-conditions via your inconsistency rules... what are you denying? The old-school expressivist denied that moral judgments describe reality. But you're admitting they function logically *as if* they describe reality. You're admitting they have truth-conditions. You're admitting they report on "facts" in the minimalist sense. So, what's left? What is the substantive disagreement between us?

  **Elena:** The explanation of the normativity. That's not just a leftover; it's the foundation. For you, the reason "Lying is wrong" entails "Don't lie" is because you have a belief about a property *and* a separate desire to do the right thing. The motivation is external to the judgment. For me, the judgment *is* the motivation. It's practical. The logic works like belief because planning requires logic, not because morality is a mirror of nature.

  **Carl:** But if the logic is identical, and the truth-conditions are identical (even if minimalist), the "practical" label looks like a metaphysical ghost. Suppose I, the cognitivist, say: "Moral properties are natural properties that essentially engage the planning faculty." I'm a synthetic naturalist. You say: "There are no properties, just planning." But if your planning is constrained by "normative facts" in the minimalist sense, and my properties are defined by their role in planning... our views are extensionally equivalent. You're just using different metaphors.

  **Elena:** It's not a metaphor. It's about explanatory priority. You think the *truth* of the judgment explains the rationality of the plan. I think the *rationality of the plan* explains why we treat the judgment as true. If we discover that our planning faculties are systematically mistaken—say, evolution wired us to blame harmless acts— you have to say we are detecting false properties. I say we are revising our plans.

  **Carl:** But you can't say "mistaken" without a truth-apt standard! If you say "We ought to revise our plans," you're making a normative claim. Is *that* claim true? If yes, you're back in my camp. If no, why should I listen? You're trying to have your cake—normative authority—and eat it too—by denying the metaphysical baggage of realism. But the baggage is required to carry the cake.

  **Elena:** I'm not denying authority. I'm grounding it in the nature of agency, not the nature of the universe. The "mistake" isn't failing to match a platonic form; it's a failure of coherence in the plan-laden psyche.

  **Carl:** And that coherence is governed by... laws of logic? Which apply to... propositions? Which have... truth values? Elena, you're speaking my language. You've solved Frege-Geach by becoming a cognitivist about the *structure* of the mind, even if you deny the *ontology* of morals. But Dreier's point is that ontology doesn't matter if the semantics are identical. If we both agree that "Lying is wrong" is true iff lying is wrong, and we both agree that negation flips the truth value, and we both agree that asserting it commits you to a stance... then the "Expressivist" label is historical residue. It's a solution that dissolves the solver.

  **Elena:** I think you're conflating semantic equivalence with metaphysical identity. We can agree on the surface grammar, Carl. We can even agree on the minimalist truth conditions. But the *what it is* to make a moral judgment is fundamentally different on my view. It's a practical commitment, not a theoretical mapping. If I convince you to stop blaming liars, I haven't changed your beliefs about the world; I've changed your stance toward it.

  **Carl:** But if changing your stance *just is* changing your belief about what is to be done, and "what is to be done" is a truth-apt matter... I'm not sure there's a "stance" left over that isn't a belief. You've pushed the expressivism so far back into the psychology that the semantics have become fully realist. You've won the battle for logic, but you've lost the war for distinctness.

  **Elena:** Then maybe the war for distinctness was based on a false dichotomy. Maybe the real insight isn't "Expressivism vs. Realism," but that the practical and the descriptive are woven together in a way that makes your "property" talk look empty and my "attitude" talk look too thin.

  **Carl:** Or maybe it means you've refined expressivism into a version of realism that's too shy to admit its name.

  **Elena:** *(Sighs, closing her notebook)* I don't think I'm shy, Carl. I think you're just comfortable with a metaphysics that does no explanatory work.

  **Carl:** And I think you're clinging to a psychology that can't bear the logical weight you've placed on it. But... *(he pauses)* ...your handling of the negation coordinate was better than I expected. Most of your cohort can't get past the *modus ponens* without sweating.

  **Elena:** Thanks. I still think your "properties" are ghosts.

  **Carl:** And I still think your "plans" are beliefs in disguise. Coffee?

  **Elena:** Black. Like the void between our ontologies.

  **Carl:** *(Smiles)* See? You're making a truth claim about the void.

  **Elena:** I'm expressing my intense disapproval of your metaphysics.

  **Carl:** Same thing.
