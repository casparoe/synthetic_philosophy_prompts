          *   *Argument for Distinction:* We are not intervening in "nature"; we are mitigating harm caused by *our* infrastructure (the fence). This is a duty of rectification, not a duty of benevolence to all wild beings.
          *   *Steel-manning the Opposition:* Acknowledge that feeding creates ecological distortion, disease risk, and sets a precedent. Acknowledge the "domestication" argument.
