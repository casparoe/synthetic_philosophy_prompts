      *   **Topic:** Prichard's Puzzle (the problem of how promising creates obligations *ex nihilo* via an act of will).
      *   **Task:** Evaluate three families of theory (Practice-based, Expectation-based/Scanlon, Normative Power/Joint Commitment) regarding their success in *dissolving* the puzzle.
