          *   *Core Idea:* Promising is a social institution/convention. Obligation comes from the utility of the practice, not the individual act.
          *   *Strength:* Explains the "rules of the game" aspect. Deflates the metaphysical mystery.
          *   *Weakness:* Fails on "non-conventional" promises (deathbed, strangers). Makes obligation external (social utility) rather than internal (bindingness to *this* person).
      *   **Expectation-Based (Scanlon/Principle F):**
          *   *Core Idea:* Wrongness lies in manipulating expectations/inducing reliance.
          *   *Strength:* Grounds it in general morality (harm/deception) rather than a special institution. Handles some edge cases better.
          *   *Weakness:* Struggles with "no reliance" cases (deathbed). Feels like it reduces promising to a species of lying/manipulation, missing the *sui generis* feel of a promise.
      *   **Normative Power/Joint Commitment (Raz, Owens, Gilbert):**
          *   *Core Idea:* We have a metaphysical capacity to change our normative status. Gilbert adds the "joint" aspect.
          *   *Strength:* Captures the intuition that the will *does* create the obligation. Handles deathbed cases well.
          *   *Weakness:* Risks circularity or magic (Prichard's original complaint). "Normative power" might just be a name for the mystery.

  3.  **Evaluate the "Dissolution" of the Puzzle:**
      *   *The Puzzle:* How can saying words change moral reality?
      *   *Practice:* Dissolves it by saying "it doesn't, the practice does." But this fails to capture the phenomenology of the individual act.
      *   *Scanlon:* Dissolves it by saying "it's about harm/expectations." But this fails to capture the *authority* aspect (the promisee's right to demand performance).
      *   *Normative Power:* Accepts the puzzle as a brute fact of agency. Doesn't dissolve it; embraces it.

  4.  **Develop the "Gut-Level Diagnosis":**
      *   Where is the *real* disagreement? It's not just about edge cases. It's about the **source of normativity**.
      *   Is morality *discovered* (Practice/Scanlon - obligations exist independently of the will) or *created* (Normative Power - the will creates obligations)?
      *   Prichard's worry is metaphysical: How can the will be creative?
      *   If you deny the will is creative (Practice/Scanlon), you save metaphysics but lose the phenomenon (the specific bindingness of a promise).
      *   If you affirm the will is creative (Raz/Owens/Gilbert), you save the phenomenon but risk metaphysical magic.
      *   *Conclusion:* The puzzle doesn't disappear; it shifts. It moves from "How do words bind?" to "What kind of agents are we?"

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate Prichard's worry. Set the stage: this isn't just about promising; it's about the metaphysics of agency.
      *   *Section 1: Practice-Based (The Deflationary Move).*
          *   Analyze: It treats the obligation as artificial.
          *   Critique: It solves the metaphysics by killing the phenomenon. It makes promising instrumental. The "deathbed" objection is fatal because it shows the obligation persists without the practice's utility.
          *   Verdict: Dissolves the puzzle by denying the premise, but at too high a cost.
      *   *Section 2: Scanlon/Expectation (The Reductionist Move).*
          *   Analyze: Reduces promising to a subset of not harming/manipulating.
          *   Critique: It captures the "why be moral" aspect but misses the "right to demand" aspect. A promise gives the *promisee* authority, not just a general duty not to disappoint. Scanlon's counterfactual reliance is indeed strained.
          *   Verdict: Dissolves the magic but loses the specific structure of the obligation (the directed duty).
      *   *Section 3: Normative Power/Joint Commitment (The Realist Move).*
          *   Analyze: Accepts the will has creative power. Gilbert makes it relational.
