answer: |-
  Thank you. For those of you who don't know me, I'm [Name]. I'm a novelist, which is why I'm standing here. The organizers reasoned that someone in the family must know how to write a eulogy. This is generous, but not quite true. I've written any number of deathbed scenes, but always for characters I was still free to revise. My mother lived in a reality she could not edit, only describe.

  She spent twenty-five years running this workshop. She spent even longer running a specific kind of dinner table. If you look at the front row, you will see the two other pillars of that table. To my left, a Copenhagenist who believed my mother would rather invent a fresh universe every few seconds than admit that measurement might just be special. To my right, a Bohmian who thought both of them were too squeamish to say plainly that the particle has to be somewhere the whole time.

  For as long as I can remember, these three conducted an argument with real stakes and no malice. They taught me that you can disagree on the fundamental nature of reality and still share the salt. They taught me that the truth is not a solitary pursuit, but a triangulation between friends.

  Now, I know what is often said about my mother's work in moments like this. I know that at least half of this room has read the same popular books. You want to hear that somewhere, in some branch of the wavefunction, she is still here. That in another sector of configuration space, she is walking through the door right now, ready to argue about decoherence.

  It is a beautiful thought. It is also, as she would have been the first to tell you, a misunderstanding.

  She was an Everettian, not a fantasy writer. She knew that *this* branch is the one we occupy. She knew that the loss we feel in this world is not illusory just because other worlds exist. To tell you otherwise would be to offer you a comfort she never accepted for herself. She believed in a universe without collapse, yes, but she also believed in the absolute reality of the path we are walking.

  So, if I cannot tell you she is alive elsewhere, what comfort does her view offer?

  It offers this: In a universe where the wavefunction never collapses, nothing is truly erased. The past is not a flickering candle snuffed out by the wind of the present. It is a fixed coordinate in a vast, eternal structure. Every interaction she had, every paper she wrote, every argument she won or lost at that dinner table, is woven into the fabric of the whole. She did not vanish into nothingness; she became part of the history of the universe in a way that cannot be undone.

  But the greater comfort, I think, lies not in the physics, but in the people.

  The Many-Worlds interpretation suggests that the universe splits when a measurement is made. But who makes the measurement? We do. We are the observers. By gathering here, by remembering her, by continuing this workshop, we are the ones who define the branch she cared about most. We are the ones who maintain the coherence of her life's work.

  To my aunt, and to the rest of our family: You do not need to understand the preferred-basis problem to understand this. You knew her love. That love was a physical force in this room, in this house, in this field. It changed the state of everyone it touched. That change persists.

  My mother believed in a reality that was vast enough to contain every possibility. But she chose, every day, to live in this one. She chose to be here, with us, in this specific timeline, for as long as she could.

  The workshop goes on. The argument goes on. The Copenhagenist and the Bohmian are still here, and I suspect they will continue to disagree for another twenty-five years. That is the tribute she would have wanted. Not a silence of reverence, but the noise of inquiry.

  She is not in another branch. She is in this one. She is in the questions we are about to ask, and in the friendship that allows us to ask them.

  Thank you.
