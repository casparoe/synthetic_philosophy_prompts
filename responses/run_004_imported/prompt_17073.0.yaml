answer: |-
  Good morning, families, faculty, and the Class of 2024.

  For those who don't know me, I'm the Salutatorian. Which, in practical terms, means I spent four years chasing my friend Priya—who is up there as Valedictorian—by exactly 0.02 GPA points. Priya, if you're listening: I've checked your math. It's correct. But I'm still keeping my eye on you.

  Standing at number two gives you a specific perspective. You're close enough to the top to see the view, but far enough back to notice the people running alongside you. And looking out at this class, I've been thinking about what actually bound us together. Was it school spirit? The shared trauma of the cafeteria pizza? Or was it something more structural?

  Junior year, about fifteen of us took an elective called Logic and Decision Theory with Mr. Alvarez. If you were in that class, you know there is one specific unit you cannot forget: Hofstadter's concept of *superrationality*.

  For the rest of the audience, here is the non-mathematical version. Imagine a game where you and a partner can either cooperate or defect. If you both cooperate, you both do well. If one defects while the other cooperates, the defector wins big and the cooperator loses. If you both defect, you both lose. Standard logic says you should always defect to protect yourself. It's the safe, selfish move.

  But Hofstadter argued that if you and the other player are *similar* reasoners—if you think alike—your decisions aren't actually independent. If I decide to cooperate, it's highly likely you will too, because you're running the same mental software I am. If I decide to defect, you'll probably defect. So, the real choice isn't between "I win, you lose" or "I lose, you win." The real choice is between "We both win" or "We both lose."

  Therefore, even if you are a completely selfish agent with zero moral commitments, the rational move is to cooperate. Not because it's "nice." Not because Kant told you to follow a universal moral law. Mr. Alvarez would fail me if I said that. It's because cooperation maximizes *your* own utility when you recognize the symmetry of the situation.

  I bring this up because, let's be honest, high school often felt like a Prisoner's Dilemma. We were curved against each other. There were moments where sharing a study guide felt like handing over a competitive advantage. There were times when keeping a insight to yourself seemed like the winning strategy for your own rank.

  We are all guilty of defecting sometimes. We're human, and the pressure was real. But looking back, the moments where this class thrived weren't the moments we guarded our knowledge. They were the moments we acted superrationally.

  When we formed study groups in the library until closing. When someone posted notes on the group chat at 11 PM because they knew someone else was stuck. When we cheered at games even if we weren't athletes. We did those things not necessarily because we are saints, but because deep down, we knew we were in the same boat. We recognized that my success is correlated with yours.

  If I help you understand calculus, I reinforce my own understanding. If you get into a great college, that raises the profile of this school, which helps me. If we build a network of trust now, that network pays dividends for decades. The "selfish" argument for kindness is actually stronger than the moral one.

  Mr. Alvarez taught us that superrationality only works if we acknowledge that we are reasoning in a mirror. When I look at this class, I don't see rivals. I see mirrors. I see people who solved problems the way I did, who stressed over the same essays, who laughed at the same inside jokes.

  So, as we leave, my challenge to you is this: Don't just cooperate because it's the "right thing to do." Do it because it's the smart thing to do. Recognize the symmetry. When you enter a workplace, a community, or a relationship, assume that the other person is running similar logic to you. If you approach the world expecting defection, you will invite it. If you approach the world assuming that your move influences their move, you unlock the cooperative outcome.

  To the parents and teachers: Thank you for being the external enforcement mechanism when our own logic failed us. Thank you for curving our grades, yes, but also for curving our character toward something better.

  And to the Class of 2024: Priya beat me by two-hundredths of a point. But in the game we're about to play out there, the score doesn't matter as much as the strategy. Let's play a game where we all win.

  Congratulations.
