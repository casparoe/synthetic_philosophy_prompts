      *   We want $P(H_L | E)$.
      *   Bayes: $P(H_L | E) = P(E | H_L) \cdot P(H_L) / P(E)$.
      *   $P(E | H_S)$: Probability of being #15 given total 30. If I am a random employee from the final roster, this is $1/30$.
      *   $P(E | H_L)$: Probability of being #15 given total 3000. If I am a random employee from the final roster, this is $1/3000$.
      *   Likelihood Ratio: $(1/30) / (1/3000) = 100$. This strongly favors Small. (Friend 1's math).
      *   *But wait*, this assumes I was sampled from the *final* roster. I wasn't. I was sampled at the *beginning*.
