      *   This is exactly SIA. $P(\text{Me} | \text{Large}) > P(\text{Me} | \text{Small})$ because there are more "Mes" (slots) in Large.
      *   If we combine SSA (Friend 1) and SIA (Friend 2), they mathematically cancel.
      *   $P(\text{Large} | \text{Me at 15}) \propto P(\text{Me at 15} | \text{Large}) \times P(\text{Me} | \text{Large}) \times P(\text{Large})$.
