answer: |-
  Here is a grading breakdown, rubric, and specific feedback you can use. Since this is a **Philosophy of Biology** seminar (rather than a pure biology intro), conceptual precision regarding theoretical frameworks (e.g., the distinction between kin selection and group selection, or inclusive fitness and the gene's-eye view) is weighted heavily. The student has a good grasp of the *narrative* of the controversy but stumbles on the *theoretical relationships*, which are core to the course.

  ### **Grade: 13 / 20 (C+)**
  ### **Letter Grade: C+**

  ### **Rubric Breakdown (JSON)**

  ```json
  {
    "rubric": [
      {
        "category": "Definition & Application of Hamilton's Rule",
        "points_possible": 5,
        "points_awarded": 5,
