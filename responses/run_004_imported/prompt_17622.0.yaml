      *   **Analysis of Side A (Individual Violations):** I need to give this its due. Why is it tempting? It's simple. It aligns with the text "individually assigned work." *Counter-argument:* It fails to capture the *conspiracy* element. It treats the chat as 4 separate bilateral exchanges rather than a coordinated effort. It undermines the deterrent effect for future group cheating.
      *   **Analysis of Side B (Group Act):** Why is this better? It reflects reality. It allows for distinguishing organizers from followers.
      *   **Recommendation (The Concrete Part):**
          *   Need specific sanctions. Common sanctions: F on assignment, F in course, Suspension, Expulsion, Probation, Educational penalty.
          *   *Tier 1 (Organizers/Active Dividers):* Heavier sanction. (e.g., F in course + Suspension).
          *   *Tier 2 (Active Participants):* Medium sanction. (e.g., F in course + Probation).
          *   *Tier 3 (The "Snowball" Claimants):* Lighter but still significant. (e.g., F on assignment + Probation + Educational Module). *Crucial:* Even if they claim no agreement, they still copied answers. They are still liable, just less so than organizers.
          *   *Timing:* When does it kick in? Usually immediately or upon appeal exhaustion. Let's say "immediately upon Dean's approval, stayed pending appeal."
      *   **Conclusion:** Reiterate the goal (integrity + fairness).

