          *   Side B: Treat as a group act, focus on the collective nature, potentially hold organizers more responsible than passive participants.
      *   **Honor Code:** "Collaborating on individually assigned work is a violation." (Vague on group dynamics/sanctioning).
      *   **Requirements:**
