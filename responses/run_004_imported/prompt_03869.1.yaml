      *   *Emphasis:* Highlight the definition of gratitude. It's not just "noticing good things"; it's "recognizing goodness *outside the self*." This is crucial. If I write "I'm grateful I'm smart," that's pride, not gratitude.
      *   *Key Distinction:* Instrumental vs. Intrinsic value. The coach treats it instrumentally (wellbeing tool). The user senses the intrinsic value (moral emotion).

  8.  **Final Polish:**
      *   Ensure tone is professional yet accessible (suitable for a reporter).
      *   Use clear headings.
