      *   **Faith vs. Bad Faith:** Sartre contrasts bad faith with "faith" (good faith), which has a similar structure but different aim.
      *   **Ontological vs. Psychological:** Sartre claims this is an ontological structure of consciousness, not just a psychological quirk.

