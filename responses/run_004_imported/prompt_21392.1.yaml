prompt: |-
  I've followed discussions of evidential cooperation in large worlds (ECL) on the EA Forum and LessWrong since back when Oesterheld's argument was still commonly going by "multiverse-wide superrationality," and one part of the standard case has never quite clicked for me. The usual motivation leans on evidential decision theory: choosing to act cooperatively toward the values of distant, causally disconnected agents counts as evidence that relevantly similar agents elsewhere are doing likewise, so the policy pays off in expectation across a sufficiently large or infinite population even without any causal link between the parties. Yet most people making this argument are otherwise committed updateless or functional decision theorists, precisely because they think EDT gets cases like the smoking lesion problem wrong. Could you explain whether ECL's cooperative payoff genuinely depends on EDT-style evidential reasoning, or whether an FDT/UDT agent can recover the same recommendation through the logical-correlation machinery FDT ordinarily reserves for Newcomb-like cases? And if it's the latter, what exactly plays the role that "running the same algorithm" plays in a standard Newcomb case, given that ECL is explicitly meant to cover agents with very different values -- and presumably rather different reasoning procedures too?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Topic:** Evidential Cooperation in Large Worlds (ECL), formerly "Multiverse-wide Superrationality" (MWSR).
      *   **Core Tension:** The standard argument for ECL relies on Evidential Decision Theory (EDT) logic (my action is *evidence* of theirs). However, many proponents (Oesterheld, Conitzer, etc.) favor Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) because EDT fails cases like the Smoking Lesion.
      *   **Question 1:** Does ECL *genuinely* depend on EDT-style reasoning, or can FDT/UDT recover the recommendation?
      *   **Question 2:** If FDT/UDT works, what plays the role of "running the same algorithm" (logical correlation) when agents have different values and reasoning procedures?

  2.  **Initial Assessment & Knowledge Retrieval:**

      *   *ECL/MWSR:* Proposed by Caspar Oesterheld. The idea is that in a vast/multiverse, there are many agents like you. If you cooperate with their values, they (being similar) will cooperate with yours.
      *   *EDT vs. FDT/UDT:* EDT says $P(O|A)$ matters. FDT/UDT says $Outcome(Output(MyDecisionAlgorithm, Input))$ matters, considering logical dependencies.
      *   *The Tension:* EDT is often criticized for "spurious correlations" (Smoking Lesion). ECL looks like a spurious correlation unless there's a logical link.
      *   *FDT/UDT on ECL:* FDT proponents *do* argue ECL works under FDT. The mechanism is "logical correlation" or "subjunctive dependence."
      *   *The "Different Algorithms" Problem:* In Newcomb's Problem, Omega predicts you because it simulates *you*. In ECL, the other agents aren't simulating you, nor are they running identical code. They are just "relevantly similar." How does FDT justify the link?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. It's a well-known tension in the community. State the thesis: ECL *can* be justified under FDT/UDT, but it requires a broader conception of "logical correlation" than simple algorithmic identity. It shifts from "same code" to "same abstract decision structure."

      *   **Part 1: EDT vs. FDT/UDT in ECL:**
          *   Explain why EDT is risky here (Smoking Lesion analogy). If cooperation is just a symptom of a "cooperative gene" but doesn't *cause* others to cooperate, EDT is deluded.
          *   Explain why FDT/UDT proponents believe they avoid this. They don't rely on *evidence*; they rely on *logical counterfactuals*. "If my algorithm outputs 'Cooperate', then any algorithm logically linked to mine also outputs 'Cooperate'."
          *   *Verdict:* ECL does not *need* EDT. In fact, FDT proponents argue EDT is the *wrong* justification for the *right* conclusion.

      *   **Part 2: The Mechanism of Logical Correlation (The Hard Part):**
          *   In Newcomb: Omega simulates Agent. Identity is high.
          *   In ECL: Agents are causally disconnected, different values, different code.
          *   *Key Concept:* **Subjunctive Dependence via Abstract Reasoning.**
          *   It's not about line-by-line code identity. It's about converging on the same *decision function* given similar inputs (the structure of the ECL situation).
          *   If I reason "I should cooperate because of ECL," and the other agent reasons "I should cooperate because of ECL," our outputs are logically linked because they derive from the same *argument*.
          *   *The "Acausal Trade" connection:* This is essentially acausal trade scaled up.
          *   *The "Different Values" issue:* FDT doesn't require identical utility functions. It requires that the *decision algorithm* takes the utility function as an input. If Algorithm $A$ optimizes $U_1$ and Algorithm $B$ optimizes $U_2$, but both implement "Cooperate if the other does," they are logically correlated in the *action* space, even if the *goal* space differs.
          *   *Reference:* Oesterheld's "Multiverse-wide Superrationality" paper and subsequent discussions on logical correlation strength.

      *   **Part 3: The Strength of the Correlation (The "Click" Problem):**
          *   Why might it not "click" for the user? Because the correlation is weaker than in Newcomb.
          *   In Newcomb, correlation $\approx 1$. In ECL, correlation $< 1$.
          *   Factors reducing correlation:
              *   Different priors.
              *   Different computational limits.
              *   Different interpretations of "similarity."
              *   Indexical uncertainty (Am I the one who should lead?).
          *   FDT handles this by weighing the *degree* of logical correlation. If correlation is $p$, expected gain is scaled by $p$. In a large world, even small $p$ times huge $N$ = positive EV.

      *   **Part 4: Addressing the "Different Reasoning Procedures" Objection:**
          *   User asks: What if they reason differently?
          *   Response: FDT agents care about the *output* of the reasoning, not the substrate. If two different mathematical proofs reach the same theorem, the theorem is logically necessary.
          *   However, if the reasoning is *too* different (e.g., one uses CDT, one uses FDT), the correlation breaks. ECL primarily appeals to other FDT/UDT agents (or those converging on similar norms).
          *   This limits the pool of partners but doesn't invalidate the logic.

      *   **Conclusion:** Summarize. ECL is compatible with FDT/UDT. The "algorithm" is the abstract policy of "cooperate with similar agents in large worlds." The correlation is subjunctive, based on logical necessity of mathematical truths, not causal influence. The weakness of the link is compensated by the size of the world.

  4.  **Refining and Polishing:**

      *   *Tone:* Respectful, technical but accessible, acknowledging the nuance.
      *   *Terminology:* Ensure correct use of "subjunctive dependence," "logical counterfactuals," "acausal trade."
      *   *Check:* Did I answer the specific question about "different values"? Yes, by distinguishing the decision algorithm from the utility function input.
      *   *Check:* Did I address the EDT vs. FDT tension? Yes, by clarifying that FDT replaces evidential conditioning with logical counterfactuals.

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Caution:* Don't claim FDT *proves* ECL works. Claim FDT *allows* the argument to be formulated without EDT's flaws. The empirical premise (are there enough similar agents?) remains contingent.
      *   *Nuance:* Acknowledge that some proponents *did* use EDT language initially, which causes the confusion. The shift to FDT was a refinement.
      *   *Specific Reference:* Mention the "Ghosts of ECL" or Oesterheld's specific papers if possible (mental check: Oesterheld's 2017 paper is the key source).
      *   *Clarification on "Algorithm":* Make sure to explain that in FDT, "My Algorithm" isn't just my brain code, it's the abstract mathematical function $P \to A$.

  6.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a sharp objection that cuts to the heart of the transition from "Multiverse-wide Superrationality" (MWSR) to the more refined "Evidential Cooperation in Large Worlds" (ECL) framework. You are right to sense a tension: if ECL relies on the idea that "my action is *evidence* of theirs," it smells like EDT, and if it relies on "my action *determines* theirs," it requires a logical link that seems tenuous given diverse values and codebases.

  The short answer is: **Proponents of ECL (specifically Oesterheld and colleagues) argue that the recommendation does not depend on EDT.** They contend that FDT/UDT can recover the cooperative payoff via **subjunctive dependence** (logical correlation), even among agents with different values and reasoning procedures. However, the strength of that logical correlation is the critical variable, and it is indeed weaker than in standard Newcomb problems.

  Here is the detailed breakdown of how FDT/UDT justifies ECL without falling into EDT's traps, and what constitutes the "algorithm" in this context.

  ### 1. Why EDT is Insufficient (and Dangerous) for ECL

  You correctly note that EDT is vulnerable to the Smoking Lesion problem. In a Smoking Lesion case, the correlation between smoking and cancer is caused by a common factor (the lesion), not by the decision itself. If you use EDT, you refrain from smoking to avoid "evidence" of cancer, but your action doesn't actually change the outcome.

  If ECL relied purely on EDT, it would be vulnerable to a "Cooperation Lesion" objection:
  *   Suppose there is a physical law or initial condition of the multiverse that causes agents to be cooperative.
  *   Your cooperation is merely *evidence* of this law, not a cause of other agents' cooperation.
  *   Therefore, your decision doesn't actually influence the multiverse; it just tells you what kind of multiverse you're in.
  *   If you are already in a "cooperative multiverse," you should defect to gain local advantage. If you are in a "defective multiverse," your cooperation won't save you.

  FDT/UDT proponents reject this. They argue that in ECL scenarios, the correlation is not merely statistical; it is **logical**. Your decision procedure and the other agents' decision procedures are instantiations of the same abstract mathematical truth. Therefore, changing your output (in the counterfactual sense) logically necessitates a change in their output.

  ### 2. How FDT/UDT Recovers the Payoff

  FDT (Functional Decision Theory) recommends choosing the output of your decision algorithm that yields the best expected utility, considering all places where that algorithm (or logical equivalents) determines outcomes.

  In Newcomb's Problem, the link is strong because Omega simulates *your specific algorithm*. In ECL, the link is more abstract. Here is how FDT bridges the gap:

  #### A. The "Algorithm" is an Abstract Policy, Not Source Code
  In FDT, "your algorithm" does not refer to the specific neurons firing in your brain or the Python script on your hard drive. It refers to the **abstract input-output function** you are instantiating.

  If you and a distant alien both reason: *"In a large world scenario with causally disconnected agents, the rational policy is to cooperate with those who reason similarly,"* then you are both instantiating the same abstract function $F(Input) \rightarrow Action$, even if your biological substrates or utility functions differ.

  FDT treats mathematical truths as necessary. If it is mathematically true that $2+2=4$, it is true everywhere. Similarly, if it is mathematically true that *"Agents reasoning via FDT in ECL scenarios should output Cooperate,"* then any agent correctly reasoning via FDT in that scenario must output Cooperate. Your decision is a "computation" of that mathematical truth.

  #### B. Handling Different Values
  This is the crux of your second question. How can agents with different values run the "same algorithm"?

  In FDT, the utility function is an **input** to the decision algorithm, not part of the algorithm's logic itself.
  *   **Agent A:** Algorithm $F$, Utility $U_A$.
  *   **Agent B:** Algorithm $F$, Utility $U_B$.

  Both agents run $F$. The logic of $F$ says: *"Check if the other agent is running $F$. If yes, cooperate to maximize their $U$ in exchange for them maximizing your $U$."*

  The logical correlation exists in the **decision to cooperate**, not in the valuation of the outcome. Agent A cooperates because it logically implies Agent B will cooperate. Agent B cooperates for the symmetric reason. They trade "favor for favor" acausally. The "same algorithm" is the **protocol for acausal trade**, not the specific goal being optimized.

  #### C. Subjunctive Dependence vs. Causal Influence
  FDT relies on **subjunctive dependence**. This means: "If I were to output Defect (counterfactually), then any agent logically linked to me would also output Defect."

  In ECL, the link is established through **convergent reasoning**. If the argument for ECL is sound (a mathematical truth), then any sufficiently rational agent who considers the argument will be compelled by it.
  *   If you decide to Cooperate based on the ECL argument, you are effectively "proving" the theorem that leads to Cooperation.
  *   Any other agent who "runs the proof" (reasons through the ECL argument) will arrive at the same result.
  *   Therefore, your action is logically linked to theirs via the necessity of the argument itself.

  ### 3. The Weakness of the Link (Why it might not "Click")

  The reason ECL feels less robust than Newcomb's Problem is that the **degree of logical correlation** is lower.

  In Newcomb's Problem, Omega's prediction is nearly perfectly correlated with your action ($\rho \approx 1$). In ECL, the correlation depends on several fragile premises:
  1.  **Common Knowledge of Rationality:** Do the other agents actually use FDT/UDT? If they use CDT, the logical link is broken.
  2.  **Convergence:** Do they interpret the "ECL argument" the same way? (e.g., disagreements over priors, measure problems in the multiverse, or indexical uncertainty).
  3.  **Recognition:** Can they identify you as a "relevantly similar" agent?

  FDT handles this by scaling the expected value by the probability of correlation.
  $$ EV(Cooperate) = P(\text{Correlation}) \times (\text{Gain from Multiverse Cooperation}) - \text{Local Cost} $$

  Because the "Large World" hypothesis suggests the number of potential partners ($N$) is astronomically large (potentially infinite), the term $P(\text{Correlation}) \times N$ can still be huge even if $P(\text{Correlation})$ is small.

  This is where the "Large World" part does the heavy lifting. You don't need perfect logical identity (Newcomb); you just need *some* logical correlation across *enough* agents.

  ### 4. Addressing "Different Reasoning Procedures"

  You asked: *What plays the role of "running the same algorithm" given different reasoning procedures?*

  If the reasoning procedures are truly different (e.g., one uses heuristics, one uses formal logic, one uses CDT), FDT admits the correlation drops. However, ECL proponents argue for a **basin of attraction** around the correct decision.

  *   **Logical Necessity:** If the ECL argument is essentially a mathematical truth (like a theorem in game theory), then any reasoning procedure that is *sound* should converge on it. Different paths up the mountain lead to the same peak.
  *   **The "FDT Cluster":** ECL is primarily a coordination mechanism for the "cluster" of agents who reason decision-theoretically. It doesn't necessarily claim you can acausally trade with a rock or a purely causal agent. It claims you can trade with the subset of the multiverse that is capable of recognizing the logical link.
  *   **Policy Selection:** Under UDT, you choose a *policy* before you know your specific reasoning limitations. You would choose a policy of "Cooperate with agents who appear to be cooperating based on logical correlation" because that policy wins in the ensemble of all possible worlds where such agents exist.

  ### Summary

  1.  **EDT is not required:** ECL proponents agree EDT is flawed. They argue ECL works via **logical counterfactuals** (FDT/UDT), not mere conditional probability.
  2.  **The "Algorithm" is Abstract:** The shared algorithm is not source code identity, but the **abstract decision function** that maps "ECL Scenario" to "Cooperate." Different utility functions are just different parameters passed to this function.
  3.  **Correlation Strength:** The logical link is weaker than in Newcomb's Problem because it relies on convergent reasoning rather than simulation. However, in a sufficiently large world, even a small probability of logical correlation across a vast number of agents yields a positive expected value.
  4.  **The "Click":** If it still doesn't click, it may be because you assess the **probability of logical correlation** to be lower than the proponents do. If you believe that diverse agents with diverse values are unlikely to converge on the same FDT policy, then ECL fails for you—not because the decision theory is wrong, but because the empirical premise (convergence) is false.

  The FDT justification essentially says: *"I am not influencing them causally, nor am I just gathering evidence. I am computing a logical truth that they are also computing. By outputting 'Cooperate', I make it true that the output of this computation is 'Cooperate' wherever it is instantiated."*
