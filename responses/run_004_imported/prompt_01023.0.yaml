answer: |-
  This is the exact right question to ask before walking into that room. If you get the "what hangs on this" right, you've grasped the normative engine of Chang's project.

  Here is the pressure test, broken down by the stakes, the fix, and the critique.

  ### 1. What breaks if we stick with Incomparability? (The Raz View)
  If you accept the standard trichotomy (Better, Worse, Equal) and conclude that hard choices are cases of **incomparability**, you are saying that the relation between the options is a *negation*. There is *no* positive value relation holding between them.

  **The Normative Cost:**
  *   **Reasons Run Out:** If A and B are incomparable, reason cannot guide you. There is no fact of the matter about which is choice-worthy.
  *   **Arbitrariness:** Any choice you make is, strictly speaking, irrational or arational. It becomes a brute act of will (a "leap"). You aren't choosing *for a reason*; you're just picking.
  *   **Agency as Defect:** Hard choices become defects in the normative landscape. They represent a failure of the world to be rationally ordered.

  **The Structural Problem (The Small Improvement Argument):**
  Chang's technical hammer here is the **Small Improvement Argument**.
  *   If Lawyer (L) and Clarinetist (C) are *equal*, then L+ (Lawyer with a slight bonus) must be better than C.
  *   If L and C are *incomparable*, it's possible L+ is still incomparable to C (since incomparability is often non-transitive or chaotic).
  *   **Intuition:** In hard choices, we feel that L+ *would* clearly be better than C. But L and C themselves don't feel equal.
  *   **Conclusion:** If they aren't equal, and they aren't incomparable (because L+ breaks the tie), there must be a fourth relation.

  ### 2. How does "Parity" fix it?
  Chang argues parity is a **positive, sui generis value relation**. It's not the absence of a relation; it's a specific kind of comparability.

  **The Normative Payoff:**
  *   **Comparability Preserved:** A and B are comparable (they are "on a par"), so reason hasn't failed. They are in the same "neighborhood" of value.
  *   **Room for Will:** Because they are on a par, reasons don't *dictate* the choice, but they don't *abandon* it either. This creates a normative space for **commitment**.
  *   **Creating Reasons:** This is Chang's big move. In parity cases, you can *make* one option better by committing to it. If you choose the Clarinet and commit to that life, your commitment generates new reasons that tip the scale retroactively.
  *   **Agency as Opportunity:** Hard choices aren't defects; they are opportunities to exercise normative power. You become the author of your life rather than just a tracker of pre-existing value facts.

  **Summary:** Incomparability makes choice **arbitrary**; Parity makes choice **authorial**.

  ### 3. The Pushback (Is it just semantic window-dressing?)
  This is where you want to push in seminar. Is "parity" doing real metaphysical work, or is it a label to save the phenomenon of rational choice?

  **A. The Metaphysical Worry (Queerness):**
  *   Better, Worse, and Equal have clear logical structures (transitivity, etc.). What are the logical properties of Parity?
  *   Is Parity just **vagueness**? Maybe "betterness" is a vague concept, and hard choices are just borderline cases. If so, we don't need a new relation; we just need supervaluationism. Chang insists parity is precise, not vague, but critics find this hard to swallow.
  *   **Objection:** Is she multiplying value relations beyond necessity? If it walks like incomparability and quacks like incomparability, why posit a fourth relation?

  **B. The Arbitrariness Objection (Does it actually solve the problem?):**
  *   Even if they are "on a par," if reason doesn't tell you to pick A over B, isn't picking A still arbitrary *at the moment of choice*?
  *   Chang says "No, because commitment creates reasons."
  *   **Counter:** That sounds like post-hoc rationalization. At $t_1$ (the moment of choice), if there is no sufficient reason to pick A over B, the choice is underdetermined. Calling it "parity" doesn't change the fact that the agent lacks a sufficient reason *ex ante*.
  *   **Elizabeth Anderson's Critique:** Anderson has argued that Chang's view risks making value too subjective. If I can "make" an option better just by choosing it, does value lose its objective grip on us?

  **C. The Phenomenological Check:**
  *   Does the experience of a hard choice actually feel like "these are comparable in a fourth way"? Or does it feel like "I literally cannot compare these"?
  *   If the phenomenology is confusion/absence of relation, positing a positive relation might be revisionary rather than descriptive.

  ### Seminar Cheat Sheet
  *   **If someone defends Raz:** Ask them how they handle the Small Improvement Argument without admitting a fourth relation.
  *   **If someone attacks Chang:** Ask if they think the "normative power" of commitment is enough to ground rationality, or if it's just psychological coping dressed up as metaphysics.
  *   **Key Distinction:** Incomparability = **Failure of Reason**. Parity = **Limit of Reason / Start of Will**.

  Good luck. If you keep the focus on the *normative significance of agency*, you'll steer the discussion well.
