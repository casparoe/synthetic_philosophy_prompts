prompt: |-
  So I'm in a reading group this semester finally working through On Certainty properly (feels late for someone doing an epistemology PhD, but here we are), and last week we hit the stretch around §609-612 where Wittgenstein imagines a community that consults an oracle instead of a physicist to settle some question, and asks whether we're even entitled to call that "wrong" given that doing so just means judging their language-game by the standards of ours -- plus that bit about how at the end of reasons comes persuasion, like changing someone's mind at that level is closer to converting them than winning an argument. Half the group came away convinced this basically commits Wittgenstein to a pretty strong relativism about hinges/world-pictures (any sufficiently basic framework is as good as any other from the inside, no neutral standpoint from which to rationally adjudicate between them), while the other half insisted he's got the resources to block that reading -- something to do with hinges not all being on a par, some universal and forced on any language user, others more local and optional, plus the fact that hinges still answer to our practices even when they don't answer to evidence.

  I've been going back and forth on this for days now and can't settle it on my own, so could you write me an actual essay on it? Lay out the strongest version of the case that hinge epistemology entails (or at least heavily invites) epistemic relativism, then the strongest non-relativist reply, and then pick a side and defend it instead of leaving things at "reasonable people disagree." Something like "yes, but only for a restricted class of hinges" totally counts as picking a side -- I just don't want the version where every consideration gets equal weight and nothing actually gets concluded. Feel free to bring in the Moore "here is a hand" stuff if its useful for the argument, but that's not really the crux for me -- the oracle/persuasion passage is what's actually bugging me.
