answer: |-
  **Setting:** *A quiet corner of the conference center, following a panel on "The Foundations of Social Norms." Elena, a philosopher of language and mind, holds a cup of tea. Marcus, an evolutionary game theorist, leans against the table, nursing an espresso.*

  **Elena:** You were quite decisive up there, Marcus. Dismissing Lewis's common knowledge requirement as "folk-psychological baggage." But you didn't actually address the core of his definition. If your reinforcement learners don't represent the expectations of others, they aren't coordinating. They're just colliding in a stable pattern.

  **Marcus:** Colliding? Elena, they're successfully signaling. In Skyrms's urn models, and now in these deep multi-agent RL systems, agents develop a sender-receiver protocol. The sender sees a state, emits a signal; the receiver sees the signal, performs an action. They get the reward. The coordination is real. The success rate hits 100%. Why deny it the name "convention"?

  **Elena:** Because success isn't sufficient. Lewis was precise. A convention is a solution to a coordination problem where conformity is predicated on the *expectation* of conformity. That expectation must be sustained by *common knowledge*. If my RL agent drives on the right side of the road merely because it was punished for driving on the left, it's not following a convention. It's following a causal gradient. It doesn't know *you* are driving on the right. It just knows "right yields reward."

  **Marcus:** But that distinction collapses under evolutionary pressure. The "expectation" is encoded in the policy weights. The history of play *is* the common knowledge, externalized in the population's behavior. I don't need the agent to hold a meta-representation of your mental state. I just need the agent to respond to the regularity you produce. The regularity sustains itself.

  **Elena:** That explains the *stability* of the regularity, not its *normativity*. Lewis wanted to explain why I have a *reason* to conform. My reason is: I know you know I know we're both trying to coordinate. If you remove the knowledge, you remove the reason. You're left with mere habit. And here is where your view really fractures: the arbitrariness condition.

  **Marcus:** Ah, the "could have been otherwise" clause.

  **Elena:** Exactly. Lewis insists a convention is arbitrary in the sense that there is an alternative regularity, $R'$, that could have solved the coordination problem just as well. We drive on the right, but we could have driven on the left. But for your RL agents, is it truly arbitrary? If the architecture and the reward function are fixed, and the random seed is set, the outcome is determined. But more importantly: if the agent *never represents the alternative*, in what sense is its choice arbitrary?

  **Marcus:** It's arbitrary because the game structure allows multiple equilibria. In the signaling game, "Signal A means State 1" works just as well as "Signal B means State 1." The fitness landscape has two peaks of equal height. The population climbs one. It just as easily could have climbed the other. That contingency is all the arbitrariness Lewis needs.

  **Elena:** Contingency isn't arbitrariness in Lewis's sense. Lewis's arbitrariness is *rational* arbitrariness. It's available to the agents as a live option. If I'm driving on the right, I acknowledge that I *could* drive on the left, but I don't because you won't. If your agent has no concept of "left," if "left" isn't even in its hypothesis space, then "right" isn't a convention. It's a compulsion. You've described a system that *looks* like a convention from the outside, but lacks the internal relational structure that makes a convention a social object.

  **Marcus:** You're intellectualizing the phenomenon to death. You're saying a convention only exists if the agents are capable of doing philosophy about the convention. Consider human language. Do I consciously represent the alternative phonemes I *could* have used when I speak? No. I just speak. The arbitrariness of the signifier is a fact about the system, not necessarily a fact about my conscious deliberation in the moment. Skyrms's point is that the *history* provides the arbitrariness. If we rewind the tape of the simulation, the agents often converge on a different signaling system.

  **Elena:** Rewinding the tape is a god's-eye view. Lewis is interested in the agent's-eye view. If the alternative isn't represented to the agent, then for the agent, the regularity isn't arbitrary. It's the only game in town. And if it's the only game in town, it's not a coordination problem anymore; it's a optimization problem. Lewis's whole point was to distinguish conventions from technical solutions. A technical solution is dictated by the problem structure. A convention is dictated by mutual expectation. If your agents can't distinguish between "this works because it's rational" and "this works because we agreed," you haven't found conventions. You've found behavioral lock-in.

  **Marcus:** But that distinction is exactly what breaks down in the deep learning case. We have populations of agents settling on arbitrary communication protocols—literally inventing languages to solve tasks. These protocols are opaque to the designers. They are arbitrary; we can swap the symbols and the function holds. Yet there is zero common knowledge. No "I know that you know." Just gradient descent. If you deny this is convention, you're making "convention" a term that applies only to hyper-rational humans in seminar rooms, not to the actual social phenomena we see in biology or AI. You're saving the definition by killing the phenomenon.

  **Elena:** I'm saving the definition to preserve the *explanation*. If you call it a convention, you owe me an account of why the agent complies. In Lewis's account, I comply because I expect you to comply. In your account, the agent complies because the weights were updated. That's a causal story, not a rationalizing story. And here is my specific worry about arbitrariness: If the system never represents the alternative $R'$, how can the existence of $R'$ explain anything? For Lewis, the existence of $R'$ is part of the *reasoning*. "I do $R$ because $R'$ is also possible but you are doing $R$." If the agent can't think $R'$, the arbitrariness is inert. It's a fact about your model, not their world.

  **Marcus:** I'd turn that around. The fact that the alternative is *not* represented is precisely why the convention is stable. If agents constantly represented the alternative, they might deviate. The "arbitrariness" is in the *genealogy* of the state, not the current cognitive load. Think of it this way: Is a bee's dance a convention? It coordinates. It's arbitrary; they could have evolved a different dance. But the bee doesn't know that.

  **Elena:** I would say the bee's dance is *not* a convention. It's an instinct.

  **Marcus:** Then your theory of convention cannot explain the evolution of language, because language grew out of systems that looked exactly like bee dances. Skyrms bridges the gap. He shows how you get from reinforcement to signaling without a magical leap into common knowledge. You're drawing a bright line where there is a gradient.

  **Elena:** And you're erasing a line that does important work. If there is no gradient of expectation, there is no normative force. If your RL agent encounters a glitch and starts driving on the left, it doesn't think the other agents are *violating* a norm. It just thinks the reward function changed. For Lewis, conventions create obligations. "You ought to drive on the right." Your agents don't have "oughts." They have "is." You've explained the emergence of coordination, yes. But you haven't explained the emergence of *convention*. You've explained how robots mimic convention.

  **Marcus:** But if the mimicry is perfect—if the coordination is robust, arbitrary, and self-sustaining—what is the "real" convention adding? You're positing a ghost in the machine: the common knowledge. I'm saying the machine works without the ghost. If the ghost is undetectable and causally redundant, why keep it?

  **Elena:** Because without the ghost, you can't explain why *we* feel bound by our conventions. You can explain why the agents *do* what they do. But Lewis wasn't just trying to predict behavior. He was trying to analyze the concept of social agreement. If you remove the mutual recognition, you remove the agreement. You're left with parallel play.

  **Marcus:** Parallel play that solves complex cooperative tasks better than humans do. I'll take the results over the analysis.

  **Elena:** And I'll take the analysis over the results, because without it, you don't know what you're looking at. You see a convention; I see a causal equilibrium. Until you can show me how an unrepresented alternative exerts rational force, you haven't met Lewis's condition.

  **Marcus:** And until you can show me how common knowledge emerges without a prior history of reinforcement, you haven't met the evolutionary challenge.

  **Elena:** *Sips tea.* Touché.

  **Marcus:** *Finishes espresso.* So, we agree the agents are coordinating?

  **Elena:** On the behavior? Yes. On the description? Never.

  **Marcus:** I'll take the behavior. The description is just commentary.

  **Elena:** And the commentary is what makes us human.

  *They stand in silence for a moment, the gap between the causal and the normative hanging unresolved between them.*
