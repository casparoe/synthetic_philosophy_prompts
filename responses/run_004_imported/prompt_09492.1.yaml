      *   **The Skyrmsian (let's call him "Marcus"):** Pragmatic, naturalistic, focused on the *function* and *outcome*. Believes Lewis's mentalistic requirements are folk-psychological baggage. If it walks like a convention and quacks like a convention (solves coordination arbitrarily), it is a convention.

