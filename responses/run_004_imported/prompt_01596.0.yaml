      *   Respectful to both the believer and the skeptic.
      *   Accurate to Wittgenstein (avoiding caricature).
      *   *Self-Correction during drafting:* Make sure not to say Wittgenstein thinks religious belief is *false*. He thinks it's *different*. Also, ensure the distinction between "belief that" (propositional) and "belief in" (trust/commitment) is clear, though Wittgenstein focuses more on the *use* of the words.

  6.  **Final Polish:** Check against the prompt requirements.
