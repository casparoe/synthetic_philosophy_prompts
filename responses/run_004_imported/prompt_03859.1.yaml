      *   **Critique 3: Different Beliefs (Heterogeneous Priors).**
          *   Harsanyi assumes everyone agrees on probabilities.
          *   If Person A thinks Climate Change is 90% likely and Person B thinks 10%, how do we aggregate?
          *   "Spurious Preferences." If preferences are driven by beliefs, summing them might double-count errors.
          *   This opens the door to non-utilitarian aggregation rules.

      *   **Critique 4: The "Identity" of Preferences.**
          *   Are vNM utilities the right currency for morality?
