answer: |-
  You are absolutely right to feel that Harsanyi's Aggregation Theorem is mathematically elegant. It is one of the cleanest results in social choice theory. If you accept the premises, the conclusion follows deductively. There is no mathematical error.

  However, the reason it hasn't ended the debate is that in philosophy and economics, **a theorem is only as strong as its axioms.** When critics (Rawlsians, prioritarians, deontologists) reject the conclusion, they aren't rejecting the math; they are rejecting the claim that the axioms describe moral reality.

  Here are the specific "steps" you are missing where the theorem fails to compel a moral conclusion, and why serious philosophers feel justified in rejecting them.

  ### 1. The "Society as a Rational Agent" Assumption
  The theorem requires that **society's preferences** satisfy the von Neumann-Morgenstern (vNM) axioms, specifically the **Independence Axiom**.

  The Independence Axiom basically says: If you prefer Lottery A to Lottery B, you should still prefer A to B even if both are mixed with some third Lottery C with the same probability.

  **Why critics reject this:**
  Many argue that society cares about **fairness** in a way that violates Independence. The classic counter-example is from Peter Diamond (1967):
  *   **Option A:** Give a life-saving drug to Person 1. (Person 2 dies).
  *   **Option B:** Give the drug to Person 2. (Person 1 dies).
  *   **Option C:** Flip a fair coin to decide who gets it.

  A utilitarian (and vNM rationality) is typically indifferent between A, B, and C (assuming equal utility gains). But many people have the intuition that **C is morally better** than A or B because it gives both people an equal *ex-ante* chance of survival.

  If you prefer C over A, you have violated the Independence Axiom. If society violates Independence, Harsanyi's theorem doesn't apply, and you are no longer bound to be a utilitarian. Rawlsians argue that social choice isn't just about maximizing outcomes; it's about the fairness of the procedure, which vNM rationality ignores.

  ### 2. Risk Attitudes as Moral Currency
  This is perhaps the deepest technical objection. Harsanyi's theorem sums up **vNM utility functions**.

  A vNM utility function captures two things:
  1.  How much you value an outcome (welfare).
  2.  **Your attitude toward risk.**

  If I am risk-averse, my utility curve is concave. If I am risk-seeking, it is convex. Harsanyi's theorem implies that if you are more risk-averse than me, your utility gains "count more" in the social sum, simply because your utility function is steeper.

  **Why critics reject this:**
  Most moral philosophers think **risk attitude is a psychological quirk, not a moral claim.**
  *   **Prioritarians** argue we should give priority to the worse off, but they don't want to do it just because someone happens to be psychologically risk-averse.
  *   To escape Harsanyi, they argue we need to distinguish between *welfare* (how well off you are) and *vNM utility* (how you rank lotteries).
  *   If you say, "We should normalize everyone's risk attitudes before summing," you have stepped outside the assumptions of Harsanyi's theorem. You are no longer summing $U_i$; you are summing $f(U_i)$. That breaks the theorem and allows for Prioritarianism.

  ### 3. The Interpersonal Comparison Problem (Your Roommate's Point)
  Your roommate was right, but you dismissed it too quickly. The theorem says $W = \sum a_i U_i$. It does **not** tell you what the $a_i$ (weights) are, nor does it tell you how to calibrate the $U_i$ scales.

  vNM utilities are unique only up to a **positive affine transformation**. That means if $U$ is my utility, $2U + 100$ represents the exact same preferences.
  *   If I scale my utility by 1,000,000, and you scale yours by 1, Harsanyi's theorem might suggest we should just satisfy my preferences because my numbers are bigger.
  *   To make the sum meaningful, you need a "zero point" and a "unit" that are comparable across people.

  **Why critics reject this:**
  Harsanyi assumes we *can* make these comparisons. Many critics (following Arrow or Sen) argue that utility is **ordinal**, not cardinal. If I can only say "I prefer A to B," but not "I prefer A to B twice as much as you prefer C to D," then the summation is mathematically meaningless.
  If you can't compare the *size* of utility units between people, you can't sum them. This forces you toward other systems (like Rawls's primary goods) that don't rely on summing subjective utility units.

  ### 4. The "Common Priors" Assumption
  Harsanyi's theorem implicitly assumes that everyone agrees on the probabilities of the states of the world (Common Priors).
  *   If I think a policy has a 90% chance of causing climate disaster, and you think it has a 10% chance, Harsanyi's aggregation becomes problematic.
  *   Should society average our beliefs? Or should we average our preferences given our beliefs?

  If people have different beliefs, aggregating preferences can lead to "spurious" social preferences that satisfy no one. This complication opens the door for non-utilitarian rules that might, for example, prioritize avoiding catastrophic risks (a Precautionary Principle) rather than maximizing expected utility.

  ### 5. The Pareto Condition is Stronger than You Think
  You mentioned the Pareto condition sounds weak ("if everyone is indifferent, society is indifferent"). Actually, the theorem usually requires **Strong Pareto**: "If everyone weakly prefers A to B, and at least one person strictly prefers A, society must strictly prefer A."

  **Why critics reject this:**
  This rules out **Paternalism** and **Rights**.
  *   **Rights:** If two people consent to a contract that harms them (e.g., selling themselves into slavery), Strong Pareto says society must allow it if they prefer it. A deontologist (like Nozick or Kantian liberals) would say society should forbid it regardless of preferences.
  *   **Adaptive Preferences:** If oppressed people prefer their oppression because they know no other life (a la Sen's "happy slave"), Pareto says society should respect that preference. Critics argue society should sometimes override individual preferences for the sake of objective well-being.

  ### Summary: Why the Debate Continues
  Harsanyi's theorem is a **conditional proof**:
  > **IF** (1) Individuals are vNM rational, **AND** (2) Society is vNM rational, **AND** (3) We accept Strong Pareto, **AND** (4) We can compare utility units...
  > **THEN** Social Welfare = Weighted Sum of Utilities.

  Critics aren't ignoring the math. They are arguing:
  1.  **Rawlsians:** Reject (2). Society shouldn't maximize expected utility; it should follow Maximin (protect the worst off), which violates Independence.
  2.  **Prioritarians:** Reject the interpretation of $U_i$. We should transform utilities (give extra weight to the worse off) before summing, which violates the direct summation form.
  3.  **Deontologists:** Reject (3). Rights constrain Pareto improvements.
  4.  **Measurement Skeptics:** Reject (4). Interpersonal utility comparisons are impossible.

  So, you aren't missing a step in the math. You are encountering the boundary where **mathematical rationality meets moral philosophy.** The theorem proves that *if* you view morality as a problem of rational choice under risk, you get utilitarianism. But many philosophers argue that morality *isn't* just a problem of rational choice under risk.

  Your professor showed you a beautiful engine. The critics are just arguing that it's the wrong engine for the car we're trying to build.
