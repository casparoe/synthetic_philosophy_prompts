      *   **Critique 2: Interpersonal Comparisons of Utility (The Weights).**
          *   The roommate was right, but the user dismissed it too quickly.
          *   $W = \sum a_i U_i$. The $U_i$ are unique only up to positive affine transformations ($U'_i = \alpha U_i + \beta$).
          *   To sum them, you need to normalize them. How do you compare the "size" of Person A's utility vs. Person B's?
          *   Harsanyi assumes we can make these comparisons. Critics (like Arrow, or expressivists) say utility is ordinal, not cardinal. If you can't compare levels or units, you can't sum them.
