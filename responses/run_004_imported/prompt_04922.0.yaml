prompt: |-
  I sit on my company's Experimentation Review Board, the internal group that must sign off before an A/B test result can be used to justify a permanent product change. The growth team stopped their onboarding-flow test on day 9 of a planned three-week run, the moment the frequentist p-value for the conversion-rate difference crossed 0.05, and now want to ship on that basis; our statistician objects on optional-stopping grounds, but the growth PM counters that a colleague re-ran the same nine days of data through a Bayesian beta-binomial model, got a 97% posterior probability that the new flow is better, and argues that number is untouched by the objection, since Bayesian updating doesn't care why or when you decided to look at the data. The board is split on whether that reply actually defeats the statistician's objection or just relocates it. Please draft the board's written decision memo: rule on whether the rollout can proceed, with a concrete timeline for whatever you recommend, and set a monitoring policy for future tests -- and make sure whichever side you rule against gets a fair hearing rather than a one-line dismissal.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Experimentation Review Board (ERB).
      *   **Task:** Draft a written decision memo regarding a specific A/B test situation.
      *   **Situation:** Growth team stopped an onboarding flow test early (Day 9 of 21) because $p < 0.05$. Statistician objects due to optional stopping (p-hacking/Type I error inflation). Growth PM counters with a Bayesian analysis (97% posterior probability) claiming immunity to optional stopping.
      *   **Requirements:**
          *   Rule on whether the rollout can proceed.
          *   Provide a concrete timeline for the recommendation.
          *   Set a monitoring policy for future tests.
          *   Ensure the losing side gets a fair hearing (no one-line dismissal).
          *   Tone: Professional, authoritative, nuanced, data-literate.

  2.  **Evaluate the Statistical Arguments:**
      *   **Frequentist (Growth Team's initial approach):** Stopping when $p < 0.05$ is classic "peeking." This inflates the false positive rate significantly (often doubling it or more depending on peek frequency). The statistician is correct; the p-value is invalid under optional stopping without correction (e.g., alpha spending).
      *   **Bayesian (Growth PM's counter-argument):** The claim is that "Bayesian updating doesn't care why or when you decided to look." This is the *Likelihood Principle*. Technically, the posterior distribution *given the data* is mathematically valid regardless of stopping rule *if* the prior was fixed beforehand.
      *   **The Catch:** However, decision-making based on Bayesian posteriors *does* require care. If you check repeatedly until Posterior > 95%, you are essentially doing the same optional stopping, just on a different metric. While the *calibration* of the posterior might hold better than the p-value, the *decision rule* ("Ship if Prob > 95%") suffers from similar multiplicity issues if not pre-registered. Furthermore, a 97% probability isn't a guarantee of truth; it depends heavily on the prior. If the prior was uninformative, 9 days might not be enough data to overcome noise, especially if the effect size is small.
      *   **The Verdict:** The Growth PM is partially right (Bayesian methods are more robust to peeking than frequentist p-values), but wrong to claim they are *immune* to decision-theoretic consequences of optional stopping. Relying on a 9-day sample for a permanent change is risky. The Statistician is right about the risk, but potentially too rigid if they dismiss Bayesian evidence entirely.
      *   **Best Path:** Do not ship yet. The risk of a false positive (implementing a change that actually hurts or does nothing) is too high given the early stop. The test should run to completion or be analyzed with proper sequential testing methods. However, acknowledging the Bayesian signal is important.

  3.  **Determine the Ruling:**
      *   **Decision:** Do not approve permanent rollout based *solely* on this early stop.
      *   **Compromise/Action:** Continue the test to the original duration (Day 21) OR run a sequential analysis properly. Given the memo needs a concrete timeline, extending to the original end date is the cleanest operational instruction.
      *   **Policy:** Establish clear rules for sequential testing (frequentist corrections or pre-registered Bayesian thresholds).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the decision clearly upfront.
      *   **Context:** Briefly summarize the test and the conflict.
      *   **Evaluation of Arguments (The "Fair Hearing"):**
          *   *Growth Team:* Acknowledge the Bayesian argument. It's sophisticated. The Likelihood Principle is real. 97% is compelling.
          *   *Statistician:* Acknowledge the Type I error risk. Optional stopping invalidates the standard frequentist claim.
          *   *Synthesis:* Explain why the Bayesian argument doesn't fully clear the hurdle (decision rules still matter, priors matter, 9 days might be unstable).
      *   **Decision & Timeline:** specific instructions. Run to Day 21. Re-evaluate.
      *   **Future Policy:** Define how to handle peeking, sequential tests, and Bayesian thresholds going forward.
      *   **Closing:** Encouraging tone about rigor vs. speed.

  5.  **Refining the Statistical Nuance (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say "Bayesian is wrong." It's not wrong mathematically. But *using* it to make a binary decision after peeking introduces bias in the *loss function*, even if the posterior is "correct." I should phrase this as "Decision-Theoretic Consistency."
      *   *Correction:* Make sure I don't sound like I'm ignoring the Growth PM's effort. They did the right thing by trying to find a valid statistical path, even if the conclusion was premature.
      *   *Tone Check:* Is it too academic? Keep it business-focused. We care about risk to the product.

  6.  **Final Polish:**
      *   Check constraints: Fair hearing? Yes. Concrete timeline? Yes. Monitoring policy? Yes.
      *   Ensure the distinction between *inference* (what the data says) and *decision* (what we do) is clear.

  7.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Growth Product Team, Data Science Team
  **FROM:** Experimentation Review Board (ERB)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Onboarding Flow Experiment (Exp-2023-44) & Updated Sequential Testing Policy

  ### 1. Executive Summary

  The Experimentation Review Board has reviewed the request to permanently ship the new onboarding flow based on interim results from Day 9 of a planned 21-day experiment.

  **Decision:** The Board **cannot approve** a permanent rollout at this time.

  **Action Required:** The experiment must continue running until the original conclusion date (Day 21). A final analysis, incorporating both frequentist and Bayesian metrics, will be reviewed on Day 22.

  This decision is not a rejection of the Bayesian methodology proposed by the Growth PM, nor is it a blanket endorsement of the Statistician's frequentist objections. Rather, it is a ruling on the intersection of statistical validity and business risk. Below, we detail our reasoning, the specific timeline for resolution, and new policies to prevent this impasse in future tests.

  ### 2. Evaluation of Arguments

  The Board recognizes that this dispute stems from a genuine methodological tension, not merely a disagreement over numbers. Both sides presented sophisticated arguments that deserve explicit acknowledgment.

  **The Growth Team's Position (Bayesian Robustness)**
  We appreciate the Growth PM's diligence in seeking a statistically valid path to ship early. The argument that Bayesian posterior probabilities adhere to the *Likelihood Principle*—meaning the inference depends only on the data observed, not the stopping intention—is theoretically sound. In a pure inference context, a 97% posterior probability that the variant is better is a strong signal. We acknowledge that rigid adherence to frequentist p-values can sometimes stifle innovation by ignoring valid probabilistic evidence simply because a "peek" occurred. The Growth Team correctly identified that Bayesian methods offer more flexibility in dynamic product environments.

  **The Statistician's Position (Optional Stopping Risk)**
  We also validate the Statistician's concern regarding *optional stopping*. While the Bayesian *posterior* may be mathematically consistent regardless of stopping rules, the *decision rule* ("Ship if Probability > 95%") is not immune to bias when applied sequentially. If we check the posterior daily and ship the moment it crosses 95%, we inflate the false discovery rate, similar to frequentist p-hacking. With only nine days of data, we risk capturing early-adopter noise or weekly seasonality effects that will regress to the mean by Day 21. The Statistician is correct that treating a 97% interim posterior as a final truth exposes the company to unacceptable risk of implementing a neutral or negative change.

  **The Board's Synthesis**
  The Growth PM's claim that Bayesian updating is "untouched" by the objection is partially correct regarding *estimation* but incorrect regarding *decision-making*. While the posterior distribution reflects the data seen so far, the *confidence* in that posterior depends on the stability of the data stream. Nine days is insufficient to rule out novelty effects in an onboarding flow. Therefore, while the Bayesian analysis is a valuable *monitoring* tool, it does not currently justify a *terminal* decision.

  ### 3. Immediate Timeline & Next Steps

  To resolve Experiment Exp-2023-44, the following steps are mandated:

  *   **Day 9 (Today):** The experiment remains live. No traffic allocation changes are to be made. The Bayesian monitor may continue to be viewed internally but cannot be used for shipment justification.
  *   **Day 21 (November 7):** The experiment concludes as originally planned.
  *   **Day 22 (November 8):** The Data Science team will submit a Final Analysis Report. This report must include:
      1.  The final frequentist p-value (with alpha spending correction if interim looks were formally recorded).
      2.  The final Bayesian posterior probability.
      3.  A check for weekly seasonality effects (comparing Week 1 vs. Week 2 vs. Week 3 performance).
  *   **Day 23 (November 9):** The ERB will reconvene for a final ship/no-ship decision based on the full dataset.

  ### 4. New Monitoring Policy for Future Tests

  To prevent future deadlocks between Speed (Growth) and Rigor (Data Science), the ERB is instituting the following **Sequential Testing Policy**, effective immediately:

  **A. Pre-Registration of Stopping Rules**
  All experiments must declare a stopping rule prior to launch. Teams may choose one of two paths:
  1.  **Fixed Horizon:** The test runs for a pre-determined sample size/duration. No early stopping is permitted.
  2.  **Sequential Monitoring:** If early stopping is desired, the team must use a method that controls error rates.
      *   *Frequentist Path:* Use alpha-spending functions (e.g., O'Brien-Fleming) to adjust p-value thresholds for interim looks.
      *   *Bayesian Path:* Teams may use Bayesian monitoring, but the threshold for shipment must be adjusted for the frequency of checks. For example, if checking daily, the threshold to ship early might need to be 99% rather than 95% to maintain equivalent risk levels.

  **B. The "Novelty Period" Lock**
  For user-facing onboarding or major feature changes, no experiment may be stopped for significance within the first 14 days (or two full weekly cycles), regardless of statistical metrics. This prevents shipping based on novelty effects or weekly seasonality.

  **C. Bayesian Priors**
  When using Bayesian methods to justify decisions, the prior distribution must be documented. Uninformative priors are acceptable for exploration, but informative priors (based on historical data) should be used for high-traffic decision points to stabilize early interim results.

  ### 5. Closing

  The Board understands the frustration of seeing a winning result and being asked to wait. The Growth Team's initiative to utilize Bayesian modeling shows a high level of data maturity, and we encourage that innovation. However, the Statistician's mandate is to protect the company from making changes that *appear* to work but actually degrade the user experience over time.

  By running this test to completion, we ensure that if the new flow is truly better, we ship it with confidence. If the effect fades, we save the users from a suboptimal experience. Rigor is not the enemy of speed; it is the guarantee that our speed is sustainable.

  **Signed,**

  **The Experimentation Review Board**
