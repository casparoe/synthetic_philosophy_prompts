          *   *Defense:* Distinguish types of evidence? Or distinguish *assertion* from *flat-out claiming*? Maybe the norm is right, but there's a separate conversational implicature rule? Or perhaps lottery propositions *are* knowable (contextualism)? *Correction:* Lackey usually argues that lottery assertions are improper because they aren't *reasonable enough* or because of specific defeaters, but the prompt asks R to confront the worry that RBN is *too permissive*. R needs to explain why lottery assertions fail RBN or why the intuition of impropriety is misleading.
