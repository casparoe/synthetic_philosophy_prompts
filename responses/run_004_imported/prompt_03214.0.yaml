      *   *Refining the "Lottery" move:* R needs to explain why "reasonable to believe" doesn't cover lottery tickets. Lackey's actual view is nuanced here. She might say the *evidence* isn't sufficient for reasonable belief in that specific context because the risk is too high relative to the stakes, or that statistical evidence alone doesn't yield reasonable *belief* (only high credence). Let's have R argue that "reasonable to believe" is sensitive to stakes/context in a way that blocks the lottery assertion without requiring knowledge.

  5.  **Final Polish:**
