      *   *Wait, one more check:* "K first has to confront Stella and R first has to confront Williamson's lottery-proposition worry." This suggests the *order of topics*. Topic 1: Stella (K is on defense). Topic 2: Lottery (R is on defense).
      *   *Let's try:* K starts. "About Stella..." R responds. Then R pivots. "But what about Lottery..." K responds. Then the deep dive on "Blameless Violation."
      *   *Wait, looking at the prompt again:* "structured so that K first has to confront Stella and R first has to confront Williamson's lottery-proposition worry." Okay, I will structure it so K initiates the discussion on Stella (defending KN against it), and then R initiates the discussion on Lottery (defending RBN against it). This ensures both face their "hardest case" early.

