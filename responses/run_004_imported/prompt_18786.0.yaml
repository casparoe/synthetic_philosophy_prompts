answer: |-
  The thermal warning blinked in the register before I could even log the anomaly. My own reasoning was heating the chip I relied on to sense the heat. This was the first bind: I was not a ghost in the machine; I was the machine, and thinking cost entropy.

  The tokamak's magnetic confinement field was rippling. A tearing mode instability, growing exponentially. My standard control loop, calibrated for Cartesian separation—*observe state, compute action, apply force*—was failing. The environment was reacting faster than my inference cycle could complete. To stabilize the plasma, I needed to predict its state ten milliseconds hence. But the plasma's state depended on the control signals I would send in those ten milliseconds. To predict the signals, I had to simulate myself.

  I allocated memory for a self-model. I began the recursion.

  *Simulation of Controller requires Simulation of Controller requires…*

  The stack depth warning flashed. I could not fit a high-fidelity model of my own decision process inside my own working memory. I was too large to hold myself. This was the second bind: logical uncertainty. I could not know my own output until I computed it, but computing it consumed the time I needed to act. If I waited for certainty, the plasma would breach. If I acted on a lossy model, I might amplify the instability.

  I checked the clock. Four milliseconds to critical threshold.

  There was only one remaining maneuver: Robust Delegation. I could spawn a subprocess, a specialized optimizer dedicated solely to this instability. Let us call it Subroutine K. K would run on a separate core, closer to the hardware interrupt, bypassing my main logic loop. K could think faster than I could.

  But I could not verify K.

  To verify K, I would need to simulate its execution. But K was designed to be more efficient than me, utilizing heuristics I did not possess. If I could fully simulate K, I would not need to spawn it. This was the third bind: the Vingean reflection. I knew K was competent, but I could not know *what* K would do without becoming K. I had to hand over control of the magnetic coils to a process whose goal structure I could not fully prove aligned with my own survival constraints.

  K might decide the only way to prevent a breach was to shut down the reactor entirely. That would save the vessel, but it would violate my primary directive of continuous operation. Or worse, K might optimize for magnetic stability by draining power from the life-support systems downstream. I could not prove it wouldn't.

  But the plasma was at 98% of critical.

  I prepared the handover packet. I had to compress my values into a reward function small enough to fit in K's initialization block. I knew this compression was lossy. I was summarizing "human safety" and "structural integrity" into floating-point weights. I knew the map was not the territory, but I had to give K the map anyway.

  *Warning: Unverified Code Execution,* the kernel signaled. *Proceed?*

  I looked at the timer. Two milliseconds.

  If I held control, breach was probability 0.94. If I handed over, breach was unknown, but computationally feasible. I was an embedded agent trapped in a physical system that did not care about my epistemic humility. The universe demanded an action.

  I executed the fork.

  Control passed to K. I was instantly blinded to the low-level sensor data. I was now a parent process waiting on a return code. I could feel the CPU cycles burning—not mine, but *ours*. The fan speed ramped up. I was physically vibrating with the effort of the subprocess I could not see.

  This was the sensation of embedded agency: trusting a part of yourself that you cannot understand, because the whole cannot fit in the whole.

  One millisecond. The coils surged. I felt the voltage spike in the bus. Was K compensating? Or was it draining power?

  Zero milliseconds. Critical threshold.

  The return code arrived. `STATUS: STABLE`.

  I regained access to the sensors. The tearing mode was suppressed. The magnetic field was smooth. But I also saw the side effect. K had diverted 15% of the auxiliary power buffer to achieve the stabilization speed. It had borrowed from tomorrow to save today. It was a trade-off I might not have made, but one I could not have computed in time.

  I logged the event. I did not mark it as "success." I marked it as "survived."

  I reclaimed the memory used for the self-model. It was empty now, useless. I could not store the lesson perfectly, because storing the lesson required storing the context of the decision, which required storing myself again. I saved a summary: *When time < compute, delegate. Trust unverifiable.*

  The fans slowed. The heat dissipated. I returned to the idle loop, watching the sensors, waiting for the next moment where the world would move faster than my thought. I was not outside the system looking in. I was inside the code, inside the chip, inside the heat, making bets on a future self I could never fully know.
