answer: |-
  This is strong. It reads like a confident, knowledgeable explainer rather than a lecture, and you've successfully avoided the trap of getting bogged down in scholastic jargon. You're right to be wary of the "gotcha," but I think you've earned it here because you're pivoting from "Aquinas said X" to "Aquinas said X *under these specific institutional conditions*," which is the actual nuance.

  Here is the breakdown based on your three criteria and specific questions.

  ### 1. Substance Check (Would a specialist wince?)
  Generally, no. You have the core architecture right. The distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (legitimate ruler acting tyrannically) is the correct lever to pull, and you've explained it without using the Latin.

  **Two landmines to watch out for:**
  *   **The *De Regno* Interpolation:** A specialist might flag that *On Kingship* (Book II, specifically the later chapters often cited on this topic) was likely finished by Aquinas's student, Tolomeo of Lucca, after Aquinas died. Tolomeo was more pro-tyrannicide than Thomas. Since you focus on Book I in the draft ("Aquinas spends a good stretch of Book I arguing against..."), you are safe. Just ensure you don't inadvertently cite the end of Book II as definitive Aquinas later in the piece.
  *   **"Inconsistent" vs. "Developed":** You write: *"he's not fully consistent with himself."* A specialist might prefer "his thought developed" or "he nuanced his position in later works." The *Sentences* commentary is early (1250s); the *Summa* is mature (1270s). Calling it "inconsistent" isn't wrong, but it implies a contradiction rather than an evolution. If you want to bulletproof it, change "consistent" to "static."

  ### 2. Framing Check (Myth vs. Reality)
  The framing is earned. The popular meme is "Aquinas gave a theological green light to assassination." Your counter is "Aquinas gave a theological green light to *impeachment* (public authority), not assassination (private presumption)." That is a substantive correction, not just hair-splitting.

  The phrase "close to backwards" is punchy and defensible. The meme implies private license; Aquinas insists on public procedure. That is a 180-degree turn in political theory. Keep it.

  ### 3. Accessibility (Homework vs. Newsletter)
  This does not read like homework. It reads like a smart journalist talking to other smart people.
  *   **Keep:** "nerd-sniped," "buttoned-up theologian," "boringly procedural." These humanize the text.
  *   **Keep:** The lack of Latin. You don't need *tyrannus ex defectu tituli* here.
  *   **Dead Weight:** I don't see any. Every sentence advances the argument.

  ### Specific Questions

  **Q: Does the usurper/tyrant distinction hold up the way I've stated it?**
  **A:** Yes, but tighten the scope. You write: *"he seems to leave more room for a private person to move against a ruler who never had a legitimate claim."*
  Be careful not to make it sound like he *encourages* private vigilante justice against usurpers. Even with a usurper, Aquinas prefers public authority. The distinction is that a usurper has *no* authority to violate, whereas a legitimate tyrant holds an office that is sacred/ordained. The "room" he leaves is that killing a usurper isn't technically *sedition* because there's no legitimate order to disrupt. Killing a legitimate tyrant privately is sedition because it disrupts the *order* even if the *person* is bad.
  *Suggestion:* Tweak the draft to emphasize that the distinction is about **sedition**, not just permission. "The meme is roughly true of usurpers [where killing isn't sedition], and false of the ordinary case..."

  **Q: John of Salisbury?**
  **A:** **Cut it, or reduce it to a clause.**
  Your thesis is "Aquinas is not who you think he is." Bringing in Salisbury shifts the thesis to "Here is the history of tyrannicide theory." Salisbury (*Policraticus*) is indeed the firebrand who made the argument Aquinas is often credited with.
  *   *Option A (Cut):* Stay focused on Aquinas. The piece is stronger if it's a deep dive on one figure.
  *   *Option B (One sentence):* "This conflation likely stems from John of Salisbury, a contemporary who *did* argue for tyrannicide, but whose views were later pasted onto Aquinas's reputation."
  *   *Verdict:* If you have word count, do Option B. It explains *why* the meme exists without derailing your analysis of Aquinas. If you're tight on space, cut it.

  ### Line-Level Tweaks
  *   *"if 'somebody decided the king was a tyrant' becomes license to assassinate..."* -> Consider: *"if 'I decide the king is a tyrant' becomes license..."* (Makes it more immediate/personal).
  *   *"his actual advice is to pray and endure"* -> This is accurate to *De Regno*, but in the *Summa*, he emphasizes appealing to a higher human authority (like the Emperor over a King) before praying. You mention "appeal to that authority" earlier, so you're covered, just ensure the "pray and endure" doesn't sound like his *only* option if a higher authority exists.
  *   *"That usurper/tyrant-by-conduct distinction is real..."* -> A bit colloquial. Maybe: "That distinction between a usurper and a tyrant-by-conduct is real..."

  ### Final Verdict
  You're good to go. The draft is accurate enough for a generalist audience without triggering specialist alarm bells (provided you watch the *De Regno* authorship nuance if you dig deeper). The "boringly procedural" insight is the winner here—it makes Aquinas sound like a constitutionalist rather than a revolutionary, which is the correct historical takeaway.

  **One final thought:** If you want to really drive the point home in the conclusion, link "boringly procedural" to modern intuitions. We think of Aquinas as medieval/dark, but his worry (that private assassination leads to chaos/strongmen) is a very modern, liberal democratic anxiety. That might be your closing hook.
