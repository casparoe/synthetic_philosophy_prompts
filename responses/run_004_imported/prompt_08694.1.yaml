prompt: |-
  A friend of mine and I spent an entire dinner arguing about a case they kept pushing on me: suppose I promise to help you move apartments on Saturday, and then back out at the last minute — but I hire and pay for professional movers on your behalf, cover whatever costs the delay causes, and make sure you end up at least as well off as if I had shown up myself. My friend insisted that our shared intuition that I have still wronged you shows that whatever grounds the duty to keep a promise cannot be reducible to protecting your reliance or fulfilling the expectations I invited you to form, since those are precisely what I have neutralized. I spent the rest of the evening trying to rescue some version of an expectation-based story and never quite managed it, which sent me back into the literature on why promises bind.

  As it happens, the philosophy society I belong to has invited a speaker next month who has built much of her research program around defending and extending a Scanlon-style, expectation-based account of promissory obligation: the view that breaking a promise wrongs the person you promised specifically because you deliberately led them to form and rely on an expectation, and that defeating that expectation without justification treats them in a way they could reasonably object to, without needing to presuppose any prior social convention of promise-keeping. Whenever a case like my friend's comes up in the Q&A after her talks, she has a practiced comeback: "that just shows we need a supplementary principle, not that Fidelity is the wrong principle." I would rather not let her deploy that line once and move on to the next question.

  Could you draft eight to ten interview questions for this Q&A that make that comeback progressively harder to lean on? I would like at least one question built around a compensation case like my friend's, pressing on whether repeatedly patching the account with supplementary principles starts to look ad hoc rather than principled; at least one question raising the objection, associated with Kolodny and Wallace, that any appeal to which expectations are "reasonable" quietly reintroduces the very social practice of promising that the account was supposed to explain without presupposing; and at least one question asking why the person you promised, specifically, rather than any bystander who happens to form and rely on that very same expectation, is the one with standing to release you from the obligation. For each question, please add a short follow-up keyed to the answer she is most likely to give, so the exchange can go a round deeper instead of stalling on her first response.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user is attending a philosophy society talk by a speaker who defends a Scanlon-style, expectation-based account of promissory obligation (Principle F).
      *   **The Problem:** The user's friend presented a counterexample (the "Mover Case"): breaking a promise but fully compensating the promisee (hiring movers, covering costs) such that the promisee is no worse off and reliance is neutralized. The intuition is that a wrong was still committed.
      *   **The Speaker's Defense:** She typically responds by saying this just requires a "supplementary principle," not a rejection of the core expectation-based view (Principle F).
      *   **The Goal:** Draft 8-10 interview/Q&A questions that make this "supplementary principle" defense progressively harder to sustain.
      *   **Specific Requirements:**
          *   At least one question on the compensation/mover case (ad hoc patching objection).
          *   At least one question on the Kolodny/Walace objection (circularity regarding "reasonable expectations" and social practice).
          *   At least one question on the "standing to release" problem (why the promisee specifically, not a bystander?).
          *   Each question needs a short follow-up keyed to her likely response.
          *   Tone: Philosophical, rigorous, polite but pressing.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Scanlon's Principle F:** It is wrong to lead someone to expect X, intend them to rely on it, and then fail to do X without justification, *if* the person prefers you to do X.
      *   **The "Mover Case" Challenge:** If I compensate you, you don't *prefer* I do X anymore (you're indifferent or prefer the money/movers). So Principle F says no wrong. Intuition says wrong.
      *   **The "Supplementary Principle" Defense:** Scanlon acknowledges other principles (like Principle D, or general duties of compensation). The speaker claims these supplement F.
      *   **The "Ad Hoc" Objection:** If you need a new principle for every counterexample, is the theory losing explanatory power? Is "Promise-Keeping" just a disjointed list of duties?
      *   **The Kolodny/Wallace Objection:** To determine which expectations are "reasonable" or "invited," we often implicitly rely on the existing norm of promise-keeping. If so, the theory explains promise-keeping by presupposing promise-keeping.
      *   **The "Standing" Objection:** Expectation-based views struggle to explain why *only* the promisee can release the promisor. A bystander can rely on my expectation too. Why don't they have standing?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Mover Case/Ad Hoc):* Start with the user's specific scenario.
          *   *Draft:* What about the mover case where I pay for everything? You say add a principle. Isn't that ad hoc?
          *   *Refinement:* Make it more precise. Focus on the fragmentation of the duty.
          *   *Follow-up:* She will say principles work together. Push on whether the *unity* of the obligation is lost.

      *   *Question 2 (Kolodny/Wallace/Circularity):* Address the "reasonable expectation" criterion.
          *   *Draft:* Kolodny says you need the practice to define reasonable expectations.
          *   *Refinement:* Frame it around the invitation to rely. How do we know an expectation is invited without the norm?
          *   *Follow-up:* She will say it's about assurance. Push on whether assurance is distinct from the norm.

      *   *Question 3 (Standing/Release):* Why only the promisee?
          *   *Draft:* If a bystander relies, why can't they release me?
          *   *Refinement:* Focus on the "directionality" of the obligation.
          *   *Follow-up:* She will say the invitation was specific. Push on whether the *harm* is what matters (which bystanders can suffer).

      *   *Question 4 (The "Supplementary" Proliferation):* Expand on Q1. How many principles?
          *   *Draft:* How many principles do we need?
          *   *Refinement:* Is there a unifying thread, or is it a checklist? If a checklist, why call it a theory of *promising*?
          *   *Follow-up:* She will say F is the core. Push on whether F covers the paradigmatic cases.

      *   *Question 5 (The Nature of the Wrong):* What is the specific injury?
          *   *Draft:* What exactly is the wrong if they are compensated?
          *   *Refinement:* Is it a dignitary harm? If so, isn't that non-consequentialist?
          *   *Follow-up:* She will try to fit it into reliance. Push on whether reliance is the *only* value.

      *   *Question 6 (Intent vs. Outcome):* Focus on the mental state.
          *   *Draft:* Does it matter if I meant to break it?
          *   *Refinement:* Scanlon focuses on intention to induce reliance. What if I induce reliance accidentally?
          *   *Follow-up:* She will say no obligation. Push on why the speech act matters more than the reliance.

      *   *Question 7 (The "Last Minute" Aspect):* Timing.
          *   *Draft:* What if I tell you early?
          *   *Refinement:* If I tell you Monday I won't come Saturday, is it less wrong?
          *   *Follow-up:* She will say reliance is less. Push on whether the *commitment* itself was violated earlier.

      *   *Question 8 (Comparison to Other Duties):* Promises vs. Predictions.
          *   *Draft:* How is this different from a prediction?
          *   *Refinement:* If I say "I will probably come" vs "I promise," what changes in the expectation account?
          *   *Follow-up:* She will say the assurance is stronger. Push on whether that strength comes from the convention.

      *   *Question 9 (Moral Residue):* Guilt/Remorse.
          *   *Draft:* Should I feel guilty in the mover case?
          *   *Refinement:* If I compensated fully, is remorse appropriate? If yes, why?
          *   *Follow-up:* She will say yes, because of the principle violation. Push on whether F explains the *depth* of that remorse.

      *   *Question 10 (Synthesis/Big Picture):* Theoretical cost.
          *   *Draft:* Is the theory worth it?
          *   *Refinement:* Given the patches, does a conventionalist view do better?
          *   *Follow-up:* She will say conventionalism has problems. Push on whether her problems are worse.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered (Mover/Ad Hoc, Kolodny/Wallace, Standing)? Yes. Follow-ups included? Yes.
      *   Tone check: Ensure they sound like a knowledgeable peer, not an attacker. Use terms like "Principle F," "normative force," "directionality."
      *   Ensure the progression makes sense (start with the concrete case, move to structural issues, end with meta-theoretical concerns).

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Q1:* Make sure the follow-up anticipates the "supplementary principle" line directly.
      *   *Correction on Q2:* Ensure Kolodny/Wallace is explicitly named or clearly referenced.
      *   *Correction on Q3:* Ensure the "bystander" distinction is sharp.
      *   *Check:* Did I include the specific "Mover Case" details? Yes, in Q1.
      *   *Check:* Are the follow-ups distinct from the main question? Yes.

  6.  **Final Output Generation** (Proceed to generate the response based on these thoughts).
answer: |-
  Here are ten questions designed to press the speaker on the limits of a Scanlon-style expectation-based account, specifically targeting the "supplementary principle" defense, the circularity objection, and the problem of standing. They are ordered to build pressure throughout the Q&A session.

  ### 1. The "Mover Case" and Theoretical Fragmentation
  **Question:** "Consider a case where I promise to help you move, but at the last minute, I hire professional movers on your behalf, cover all delay costs, and ensure you are materially better off than if I had shown up. My reliance is neutralized, and my expectations are met, yet the intuition persists that I have wronged *you* specifically by breaking the promise. You've suggested in past work that cases like this simply require a 'supplementary principle' alongside Principle F. At what point does adding supplementary principles to handle counterexamples risk turning your account into a disorganized list of duties rather than a unified theory of why promises bind?"

  **Follow-up:** "If the answer is that Principle F remains the 'core' while other principles handle the edges, how do you distinguish the core from the periphery without already presupposing which cases are paradigmatically 'promissory'? It seems we need the intuition of what a promise *is* to decide which principle applies, rather than the principles explaining what a promise is."

  ### 2. The Kolodny-Wallace Circularity Objection
  **Question:** "Niko Kolodny and R. Jay Wallace have argued that expectation-based accounts face a circularity problem: to determine which expectations are 'reasonable' or 'invited'—which triggers Principle F—we often implicitly rely on the very social practice of promise-keeping the theory is supposed to explain. If I say 'I'll be there,' how do we know I've invited reliance sufficient for obligation without already assuming a norm that such utterances create obligations? How does your account avoid presupposing the convention it aims to derive?"

  **Follow-up:** "You might reply that the invitation is based on evidence of intent rather than convention. But if I say 'I intend to be there' versus 'I promise to be there,' the reliance conditions might be identical. What creates the normative difference in the invitation if not the conventional force of the word 'promise' itself?"

  ### 3. The Problem of Standing and Release
  **Question:** "On an expectation-based view, the wrong seems to stem from the defeat of reliance-induced expectations. But suppose a bystander overhears my promise to you, forms the exact same expectation, and relies on it to their detriment if I break it. Why do *you* have the standing to release me from the obligation or complain of the wrong, while the bystander does not? If the ground of the duty is simply the creation of reliance, shouldn't anyone who relies have standing?"

  **Follow-up:** "If you argue that only the promisee was 'invited' to rely, doesn't that retreat back into a specific interpersonal authority that looks suspiciously like the conventional power of promising we were trying to explain? Why does the invitation grant *authority* rather than just creating a risk of harm?"

  ### 4. The Proliferation of Principles
  **Question:** "Returning to the idea of supplementary principles: Scanlon himself acknowledges principles beyond F, such as duties of compensation or duties regarding loss prevention. If we need Principle F for standard cases, Principle D for assurances, and further principles for compensated breaches, does the concept of 'promissory obligation' retain any unique explanatory work? Or is 'promise-keeping' just a label we slap on a cluster of unrelated moral duties that happen to overlap?"

  **Follow-up:** "If it is just a cluster, why do we feel a specific *residue* of guilt when breaking a promise that we don't feel when violating a general duty of kindness, even if the outcomes are identical? Does your fragmented account have the resources to explain the specific phenomenology of promissory remorse?"

  ### 5. The Nature of the Wrong in Compensated Breaches
  **Question:** "In the moving case where I fully compensate you, you are left no worse off. If the wrong is grounded in the harm of defeated expectations, there seems to be no wrong left to commit. If you insist there is still a wrong, are you not conceding that the duty is not actually about reliance or welfare, but about something like a transfer of right or authority over my actions?"

  **Follow-up:** "If you deny that it's a transfer of right and stick to reliance, you must argue that some 'non-material' expectation remains defeated. But if I have the movers and the money, what exactly is left to expect? Is it simply the expectation that I wouldn't break my word? If so, isn't that circular?"

  ### 6. Intent vs. Utterance
  **Question:** "Your account hinges on the *intention* to induce reliance. But consider a case where I sincerely promise, intending to keep it, but external forces prevent me, and I fail to notify you in time. I never intended to defeat your expectation. Yet, we typically think I still owe you an explanation or apology specific to the promise. Does Principle F capture the obligation that arises from the *commitment* itself, or only the obligation arising from the *manipulation* of expectation?"

  **Follow-up:** "If you say the obligation arises because I *should have known* I might fail, doesn't that shift the ground from a special promissory duty to a general duty of care or negligence? How do you preserve the special stringency of the promise?"

  ### 7. The "Last Minute" Variable
  **Question:** "In my moving case, suppose I tell you on Tuesday that I can't help on Saturday, rather than waiting until Saturday morning. Your view suggests this is less wrong because it allows you to adjust expectations and reduces reliance. But many would say the breach of commitment happened the moment I decided to break the promise, regardless of when I told you. Does your account undervalue the integrity of the commitment in favor of the management of the other's mental states?"

  **Follow-up:** "If you argue that the wrong is proportional to the reliance disrupted, does that imply that promising to someone who is naturally suspicious and relies less is less morally weighty than promising to someone trusting? That seems to make the obligation depend on the promisee's psychology rather than the promisor's act."

  ### 8. Assurance vs. Prediction
  **Question:** "What distinguishes a promise from a confident prediction on your view? If I say 'I will certainly be there' and provide overwhelming evidence, I induce the same expectation as 'I promise to be there.' If the obligation comes from the induced expectation, the two should be morally equivalent. But we treat the promise as creating a stronger bond. Is that extra strength just an illusion, or does your theory struggle to account for the normative boost provided by the explicit speech act?"

  **Follow-up:** "If you say the speech act provides 'assurance' that goes beyond evidence, isn't that assurance only effective because we share a social convention that treats such speech acts as binding? And if so, haven't we reintroduced the convention through the back door?"

  ### 9. Moral Residue and Apology
  **Question:** "When I break a promise even with full compensation, the appropriate response is usually an apology, not just a receipt of payment. An apology acknowledges a specific normative violation. If I have satisfied all reliance-based duties via compensation, what is the apology *for*? Does the need for an apology suggest that the promisee has a claim to my performance that cannot be bought out, which contradicts the reliance model?"

  **Follow-up:** "You might say the apology is for the *initial* formation of false expectation. But if that expectation was replaced by a guaranteed alternative (the movers) before any harm occurred, was the expectation actually 'false' in a morally relevant sense, or was it merely updated?"

  ### 10. Theoretical Cost-Benefit Analysis
  **Question:** "Finally, let's step back. Conventionalist accounts say promises bind because of a social practice that confers normative power. Your account tries to ground it in general moral principles about reliance to avoid circularity. But given the need for supplementary principles, the standing objections, and the circularity risks regarding 'reasonable expectations,' does the conventionalist view actually offer a more parsimonious explanation? What is the decisive advantage of your view that justifies these theoretical complexities?"

  **Follow-up:** "If the advantage is that it explains how promises can exist in small groups without established conventions, does that benefit outweigh the inability to explain the 'Mover Case' without ad hoc patches? Is it better to have a theory that works for Robinson Crusoe but fails for modern apartment moves?"
