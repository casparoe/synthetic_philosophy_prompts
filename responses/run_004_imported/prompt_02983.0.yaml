      *   *Diminishing Returns:* Glassdoor reviews from 2016 are likely low-value information compared to recent data. Cold messaging might yield noisy data.
      *   *The "Value of Information" (VoI):* VoI decreases as uncertainty decreases. At some point, the cost of acquiring info exceeds the expected benefit.

  4.  **Formulate the Argument:**
