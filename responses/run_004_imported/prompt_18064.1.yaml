      *   *Krip:* But how does he know "missed a sheep" means the same thing today as ten years ago?
      *   *Baker:* Because he was trained.
      *   *Krip:* Training is in the past. The rule is for the future.
      *   *Baker:* The practice lives in the present action.
      *   *Krip:* Without a community, the practice is solipsistic.

      *(Self-Correction)*: Let's make it more conversational. Use the "git branch" analogy explicitly since the user liked it.

  7.  **Final Review against constraints:**
