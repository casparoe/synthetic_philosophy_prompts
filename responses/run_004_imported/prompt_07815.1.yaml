          *   *Quote/Reference:* *Making Things Happen* (2003). The definition of an intervention variable $I$ is mathematical/structural.
          *   *Analogy:* We can ask "What if gravity were switched off?" even if we can't switch off gravity.
      *   **Applying to Examples:**
