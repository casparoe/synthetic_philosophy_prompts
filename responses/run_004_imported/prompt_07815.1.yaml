      *   **Objection:** They raise a classic and significant objection to Interventionism (specifically Woodward's Manipulability/Interventionist account): The problem of *unmanipulable causes* (singular historical events, cosmological initial conditions, etc.). If causation requires the *possibility* of intervention, does that rule out causation in cases where intervention is physically or logically impossible?
      *   **Question:** Why is Interventionism considered progress over Lewis if it seemingly excludes legitimate causal claims in history, cosmology, etc.?

  2.  **Initial Assessment & Fact-Checking:**
