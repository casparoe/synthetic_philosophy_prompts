          *   *Big Bang:* This is the edge case. Woodward might say causal talk breaks down at the absolute boundary, or we treat it as a boundary condition in a model.
      *   **Why it's still Progress (vs. Lewis):**
          *   *Vagueness:* Lewis's "similarity of worlds" is notoriously hard to cash out without circularity (causation often defines similarity).
          *   *Explanatory Power:* Interventionism ties causation to *invariance* and *explanation*. It tells us *why* the cause matters (stability under changes).
