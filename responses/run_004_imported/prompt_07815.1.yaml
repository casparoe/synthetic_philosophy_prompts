answer: |-
  This is an excellent question, and you have put your finger on one of the most significant and frequently discussed objections to Woodward's interventionist account. In the literature, this is often called the **"Problem of Unmanipulable Causes"** or the objection from **Human Relativity**.

  If Woodward's theory required that we be *actually able* to perform an experiment to verify a causal claim, it would indeed render most of history, cosmology, and evolutionary biology non-causal. That would be a disastrous result for a theory of causation intended to underwrite scientific practice.

  However, the reason interventionism is generally considered progress over Lewis (despite this cost) lies in a crucial clarification of what Woodward means by an "intervention," and how his account handles the *truth conditions* of causal claims versus the *epistemology* of discovering them.

  Here is how you should think about this tension in your seminar.

  ### 1. The Crucial Distinction: "In Principle" vs. "In Practice"
  Your worry rests on the assumption that an intervention must be something a human agent could physically carry out. Woodward explicitly rejects this.

  For Woodward, an intervention is a **theoretical construct**, not a pragmatic recipe. When he defines an intervention variable $I$ on a cause $X$ with respect to an effect $Y$, he provides a set of structural conditions (roughly: $I$ causes $X$, $I$ does not cause $Y$ except through $X$, $I$ is uncorrelated with other causes of $Y$, etc.).

  *   **Lewis:** Asks, "Is there a possible world similar to ours where $C$ does not occur, and in that world, does $E$ not occur?" The problem is defining "similarity" without begging the question.
  *   **Woodward:** Asks, "Is there a *conceptually coherent* scenario where $X$ is changed by an process that isolates it from other causes, such that $Y$ changes?"

  We do not need to be able to *build* the intervention machine. We only need to be able to *model* it.
  *   **The Dinosaur Example:** We cannot travel back in time to remove the asteroid. However, we can construct a structural model of the Cretaceous ecosystem. In that model, we can mathematically set the "Asteroid Impact" variable to 0 (off) while holding background conditions constant. If the "Dinosaur Survival" variable flips to 1 (on) in the model, the causal claim holds. The intervention is **counterfactual**, not practical.
  *   **The Big Bang:** This is harder. Woodward admits that causal talk may break down at the absolute boundary of the universe if there are no variables to vary. However, in cosmology, we usually compare our universe to *possible* universes with different initial parameters (e.g., varying the cosmological constant). As long as we can model the variation, we can assess the causation.

  **The Progress:** Woodward replaces the vague metaphysics of "world similarity" with the precise mathematics of **Structural Equation Models (SEMs)**. This makes causal claims testable against data and models, even if the intervention is never performed.

  ### 2. Causation vs. Epistemology
  A second defense Woodward offers is that his theory is about **what causation is**, not **how we know it**.

  It is true that we cannot *verify* the cause of the dinosaur extinction via a randomized control trial. But Woodward argues that the *meaning* of the claim "The asteroid caused the extinction" is tied to what *would* happen under an intervention, not our ability to perform it.

  Think of it like dispositions. A glass is fragile even if it is never struck. Its fragility consists in the fact that *if* it were struck, it would break. Similarly, the asteroid causation consists in the fact that *if* an intervention removed the asteroid, the dinosaurs would survive. The truth of the claim depends on the structure of the world, not our laboratory access.

  **The Progress:** Lewis's counterfactuals also rely on "what would happen," but Woodward provides a clearer criterion for when those counterfactuals are true (invariance under intervention) rather than relying on intuitive judgments about world similarity.

  ### 3. Invariance and Explanation
  The real reason interventionism is viewed as progress is that it links causation to **explanation** and **invariance**.

  Lewis's theory is primarily about the metaphysics of events. Woodward's theory is about **scientific explanation**. For Woodward, to explain an phenomenon is to show how it would change under various interventions.
  *   If a causal generalization holds only in very specific circumstances, it has low **invariance**.
  *   If it holds under a wide range of hypothetical interventions, it has high invariance.

  This allows Woodward to distinguish between "accidental regularities" and "causal laws" better than Lewis. For example, "All gold spheres are less than 1 mile in diameter" is true, but not causal, because there is no intervention on "being gold" that would change the size. Woodward's framework captures this distinction naturally; Lewis has to work harder to explain why some counterfactuals support laws and others don't.

  ### 4. Conceding the Point: Where Lewis Might Win
  You should not walk away thinking Woodward solves everything. Your objection highlights a genuine trade-off.

  *   **Token Causation:** Lewis is often better at handling singular, historical token events (e.g., "This specific spark caused this specific fire") because his counterfactuals are anchored in specific possible worlds. Woodward is primarily a theory of **type causation** (variables and generalizations). While Woodward tries to account for token causation, it is the weaker part of his theory.
  *   **The "God's Eye" View:** Woodward's account requires us to assume we can define variables and structural equations for systems like the entire universe. Some critics argue this is just as mysterious as Lewis's similarity spheres. If we can't specify the intervention even in principle (e.g., causes involving fundamental laws of nature that cannot be varied), Woodward must say there is no causation there.

  ### Summary for Your Seminar
  To answer your specific question: **Why is it progress?**

  1.  **Precision:** It replaces the vague "similarity of worlds" metric with defined structural conditions (SEMs).
  2.  **Scientific Utility:** It aligns causation with how scientists actually model systems (changing parameters in a simulation), even if they can't touch the real system.
  3.  **Invariance:** It provides a gradient of causal strength (how invariant is the relationship?) rather than Lewis's binary yes/no.

  **However,** you are right to note the cost. Interventionism is less intuitive for singular historical narratives where modeling is impossible.

  **Suggested Move:** In your seminar, you might frame it this way: *"Woodward sacrifices the intuitive applicability to singular historical tokens to gain precision and applicability to scientific modeling. Whether this is 'progress' depends on whether you think a theory of causation should serve historians or physicists."* (Though Woodward would argue physicists and historians both use models, so he serves both).

  **Reading Tip:** Look at **Chapter 3 of *Making Things Happen* (2003)**. Woodward explicitly addresses the "human relativism" objection there. He argues that interventions are defined relative to a set of variables, not relative to human abilities.
