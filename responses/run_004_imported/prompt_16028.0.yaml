      3.  Round 2 (R's rebuttal): R has the narrative high ground, but risks reductionism.
      4.  Round 3 (E's "Proves too much"): E wins the philosophical point.
      5.  Round 4 (R's "Cash out"): R holds the line, but it's a stalemate.
      6.  The Missing Piece: *Mediation*. How structure becomes story.

