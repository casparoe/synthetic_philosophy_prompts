  I'm taking an evolutionary psych elective this semester, and we just spent two weeks on sexual selection and mate choice — it's had me noticing weird parallels in my actual life lol. Anyway, here's what's actually been bugging me: I'm in a sorority, and every fall during pledging the actives put the new pledges through this whole ordeal before they're allowed to become full members — humiliating errands at 3am, sleep deprivation, that sort of thing (nothing dangerous, just genuinely miserable). When I asked one of the older sisters why we couldn't just, I don't know, have people write a paragraph about why they want to join, or sign something saying their committed, instead of putting everyone through actual misery, she just said "because talk is cheap," like that settled it.

  That answer's kind of stuck with me, but I don't think I could defend it myself if someone pushed back — it feels a little circular, like we're assuming the ordeal works just because its hard, without explaining why hard equals meaningful. Is there an actual principled reason costly or painful trials would accomplish something a cheap statement of commitment can't, or is "talk is cheap" just a post-hoc justification people reach for to make hazing feel less arbitrary? Two houses on campus dropped the harsh pledging stuff a few years back after the school cracked down on them, and people swear those chapters feel less tight-knit now, though that could easily just be everyone's biases talking. I'd genuinely like to know if there's real logic here before I decide how I feel about the whole practice.
