prompt: |-
  I cover science and ideas for a magazine, and next week I'm recording a long interview for a profile piece on the philosophical fault lines running through effective altruism and longtermism. My guest is a moral philosopher whose recent work pushes the "cluelessness" objection to consequentialism further than most people are comfortable with. She accepts Hilary Greaves's now-standard distinction between "simple" cluelessness -- unforeseeable effects we have no reason to think favor one act over its alternative, and so can treat as washing out in expectation -- and "complex" cluelessness, where the unforeseeable effects are backed by some evidence pointing each way with no principled method for weighing that evidence against the other. Her contribution, and the reason I'm interviewing her, is the claim that flagship longtermist interventions -- pandemic preparedness, AI-safety research, extinction-risk reduction generally -- are riddled with the complex kind, not the simple kind Greaves thought could be set aside, which would gut the "we can be reasonably confident this helps the far future" premise longtermism depends on. Whenever someone asks how she still manages to act at all given this, her stock answer is that cluelessness is a fact about our evidence rather than a license for nihilism -- a line she's given in at least three previous interviews I've listened to, which tells you what she denies without telling you what she'd have us do instead.

  Please draft eight interview questions, each followed by a short follow-up keyed to the answer she's most likely to give, that don't let her simply restate the simple/complex distinction. I want at least one question testing whether that distinction is principled or just relocates, rather than resolves, the very problem it was meant to dissolve; one that forces her "not a license for nihilism" line into an actual decision rule instead of a description of what she's ruling out; one on whether Christian Tarsney's persistent-difference strategy -- betting that some interventions lock a valuable state into place so firmly that only a rare, late-arriving disruption (what he calls an exogenous nullifying event) could undo it -- lets extinction-risk interventions specifically escape her critique even if nothing else does; one asking why any of this should count as a special problem for consequentialists specifically, rather than for any moral theory that needs facts about the world to apply its categories, given that earlier defenders of this same argument have simply exempted non-consequentialists from worrying about effects nobody could foresee; and a closing question about what kind of finding, empirical or philosophical, would make her retract the charge against longtermism in particular rather than against consequentialist ethics in general.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Role:** Science and ideas magazine journalist.
      *   **Task:** Draft 8 interview questions + follow-ups for a profile piece on a moral philosopher.
      *   **Subject:** Philosophical fault lines in Effective Altruism (EA) and Longtermism, specifically focusing on the "cluelessness" objection to consequentialism.
      *   **Guest's Position:** Pushes Hilary Greaves's distinction (simple vs. complex cluelessness) further. Claims flagship longtermist interventions (pandemic prep, AI safety, extinction risk) suffer from *complex* cluelessness, undermining the confidence longtermism needs.
      *   **Guest's Evasion:** When asked how to act, she says "cluelessness is a fact about evidence, not a license for nihilism" (a stock line from 3 previous interviews).
      *   **Constraints:**
          *   8 questions total.
          *   Each needs a short follow-up keyed to her likely evasive answer.
          *   Do *not* let her simply restate the simple/complex distinction.
          *   **Required Question 1:** Test if the simple/complex distinction is principled or just relocates the problem.
          *   **Required Question 2:** Force the "not nihilism" line into an actual decision rule.
          *   **Required Question 3:** Address Christian Tarsney's "persistent-difference" strategy (locking in value).
          *   **Required Question 4:** Ask why this is specific to consequentialists vs. other moral theories needing worldly facts.
          *   **Required Question 5 (Closing):** What finding (empirical/philosophical) would make her retract the charge against longtermism specifically, not just consequentialism generally.
          *   **Remaining 3 Questions:** Need to fit the theme and depth (filling out the 8 total).

  2.  **Deconstruct the Guest's Argument & Potential Evasions:**
      *   *Core Argument:* Longtermist interventions have complex cluelessness (conflicting evidence, no weighing method), so we can't be confident they help the far future.
      *   *Greaves's Distinction:* Simple (noise, washes out) vs. Complex (biased noise, doesn't wash out).
      *   *Guest's Twist:* Longtermism is *all* complex cluelessness.
      *   *Evasion:* "It's about evidence, not nihilism." (Translation: I'm describing epistemology, not prescribing action, even though my description paralyzes the action.)
      *   *Goal:* Pin her down on *action guidance* and the *robustness* of her distinction.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Required: Simple/Complex Distinction Validity):*
          *   *Draft:* Is the distinction between simple and complex cluelessness real or just moving the goalposts?
          *   *Refinement:* Make it sharper. Greaves says simple washes out. You say longtermism is complex. But isn't deciding which category an uncertainty falls into itself subject to cluelessness?
          *   *Follow-up:* If she says "We have meta-evidence," ask what that meta-evidence looks like without begging the question.

      *   *Question 2 (Required: Decision Rule vs. Nihilism):*
          *   *Draft:* You say it's not nihilism. So what should we do?
          *   *Refinement:* You call it a "fact about evidence." But agents need decision rules. If complex cluelessness dominates the long-term, does your view imply we should default to short-termism, or is there a positive heuristic you endorse?
          *   *Follow-up:* If she says "Use common sense," ask how common sense handles astronomical stakes where intuition fails.

      *   *Question 3 (Required: Tarsney's Persistent Difference):*
          *   *Draft:* What about Christian Tarsney's idea that we can lock in value?
          *   *Refinement:* Tarsney argues some interventions create a "persistent difference" immune to later noise. Does your complex cluelessness objection apply even if we assume the intervention successfully locks in a trajectory, or does your critique depend on the causal chain remaining fragile?
          *   *Follow-up:* If she says "Locking in is impossible," ask for the threshold of fragility that triggers complex cluelessness.

      *   *Question 4 (Required: Consequentialism vs. Others):*
          *   *Draft:* Why is this just a problem for consequentialists?
          *   *Refinement:* Deontologists also need to know if an act causes harm. Why is cluelessness a special poison for consequentialist calculation rather than a general epistemic humility applicable to all normative theories?
          *   *Follow-up:* If she says "Consequentialists maximize, others satisfy thresholds," ask if threshold satisfaction isn't equally vulnerable to unknown long-term side effects.

      *   *Question 5 (Required: Closing/Retraction):*
          *   *Draft:* What would change your mind?
          *   *Refinement:* You target longtermism specifically here. What specific empirical discovery or philosophical argument would convince you that extinction-risk reduction escapes complex cluelessness, without requiring you to abandon the broader critique of consequentialism?
          *   *Follow-up:* If she says "Better models," ask what kind of modeling overcomes the structural uncertainty you describe.

      *   *Question 6 (Filler/Deepening - The "Washing Out" Assumption):*
          *   *Focus:* Greaves says simple cluelessness washes out.
          *   *Draft:* You reject that simple cluelessness washes out in the long run. Why?
          *   *Refinement:* Greaves relies on the Law of Large Numbers for simple cluelessness. You argue the long-term future isn't a large sample of independent events but a path-dependent cascade. Is your objection actually about probability theory or about the causal structure of history?
          *   *Follow-up:* If she says "Path dependence," ask if that implies *no* long-term intervention is knowable, or just the ones currently proposed.

      *   *Question 7 (Filler/Deepening - The "Acting Anyway" Paradox):*
          *   *Focus:* Her personal behavior vs. her theory.
          *   *Draft:* Do you donate to longtermist causes?
          *   *Refinement:* If complex cluelessness undermines the expected value calculation, on what basis do *you* allocate your own resources or time? Do you act on a different moral theory privately than the one you analyze publicly?
          *   *Follow-up:* If she says "I act on probabilities," ask how those probabilities are generated if the evidence is allegedly balanced/complex.

      *   *Question 8 (Filler/Deepening - Policy Implications):*
          *   *Focus:* Real world impact.
          *   *Draft:* Should governments stop funding AI safety?
          *   *Refinement:* If longtermist interventions are epistemically opaque, does that imply we should defund them, or merely that we can't claim they are *optimal*? Is there a difference between "we don't know it helps" and "we have reason to think it might not"?
          *   *Follow-up:* If she says "Precautionary principle," ask if that principle isn't itself vulnerable to the same complex cluelessness regarding side effects.

  4.  **Review and Refine:**
      *   Check against constraints: 8 questions? Yes. Follow-ups included? Yes. Specific required topics covered? Yes (Distinction validity, Decision rule, Tarsney, Consequentialism specificity, Retraction criteria).
      *   Tone Check: Needs to be professional but piercing. Not hostile, but refusing to let her off the hook with stock phrases.
      *   Follow-up Check: Ensure the follow-ups anticipate her specific known evasions (e.g., the "fact about evidence" line).

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Q2:* Make sure the follow-up specifically targets the "fact about evidence" line since the prompt mentions she uses it in *every* interview.
      *   *Correction on Q4:* Ensure the distinction between maximizing and threshold views is clear.
      *   *Correction on Q1:* Ensure it challenges the *principled* nature of the distinction, not just the application.

  6.  **Final Output Generation** (Proceed to generate the response based on these thoughts).
answer: |-
  **1. The Principled Boundary**
  Hilary Greaves's distinction relies on the idea that "simple" cluelessness involves symmetrical uncertainty that washes out in expectation, whereas "complex" cluelessness involves asymmetrical evidence that doesn't. But doesn't determining *which* category a specific uncertainty falls into require the very kind of evidentiary weighing you say is impossible? Is this distinction a principled boundary, or does it just relocate the problem of indeterminacy one step back?

  *   **Follow-up:** If you argue we have "meta-evidence" to categorize the uncertainty, what does that meta-evidence look like in the context of AI safety, and why is it immune to the same complex cluelessness you attribute to the intervention itself?

  **2. From Description to Prescription**
  In previous conversations, you've described cluelessness as "a fact about our evidence rather than a license for nihilism." That tells us what you *don't* believe, but not what you *do*. If complex cluelessness guts the expected value calculation for longtermism, what positive decision rule replaces it? Are we to act on short-term proxies, intuitive heuristics, or something else entirely?

  *   **Follow-up:** If you suggest we rely on heuristics or "common sense," how do those tools avoid failure when dealing with astronomical stakes and novel technologies where human intuition has no evolutionary track record?

  **3. The Persistent-Difference Objection**
  Christian Tarsney has argued that some interventions create a "persistent difference," locking in a valuable trajectory so firmly that only a rare, exogenous nullifying event could undo it. Does your critique depend on the causal chain remaining fragile? If an intervention successfully locks in a state, does complex cluelessness still apply, or does the "locking in" itself resolve the evidentiary imbalance?

  *   **Follow-up:** If you maintain that even "locked-in" states are subject to complex cluelessness, are you essentially arguing that *no* intervention can ever be shown to benefit the far future, regardless of its causal robustness?

  **4. The Consequentialist Specificity**
  Defenders of this argument often note that non-consequentialists are exempt because they don't need to calculate total outcomes. But deontologists still need to know if an act violates a constraint, which often depends on foreseeable consequences. Why is complex cluelessness a special poison for consequentialist calculation rather than a general epistemic humility that applies to any moral theory requiring facts about the world?

  *   **Follow-up:** If you say consequentialists must *maximize* while others only need to satisfy thresholds, isn't threshold satisfaction equally vulnerable to unknown long-term side effects that might retroactively violate the constraint?

  **5. The Path-Dependence Assumption**
  Greaves's defense of simple cluelessness relies on something like the Law of Large Numbers—that errors cancel out over time. Your view seems to imply history is path-dependent, where early errors compound rather than cancel. Is your objection ultimately a claim about moral mathematics, or is it a claim about the causal structure of history being too chaotic for probabilistic modeling?

  *   **Follow-up:** If history is that chaotic, does that imply we should be equally clueless about *preventing* extinction, or is the negative case (avoiding disaster) epistemically easier to secure than the positive case (creating flourishing)?

  **6. Private Action vs. Public Critique**
  Given your public skepticism about the epistemic grounds for longtermist interventions, how do you personally allocate your own resources or time regarding existential risk? Do you act on a different moral framework privately than the one you analyze publicly, or do you accept that your own actions are epistemically unjustified by your own standards?

  *   **Follow-up:** If you say you act on "probabilistic beliefs," how are those probabilities generated if the evidence is, by your definition, complexly clueless and unweighable?

  **7. Policy Paralysis vs. Optimality**
  If we accept your critique, does it imply we should defund flagship longtermist projects like pandemic preparedness, or merely that we cannot claim they are *optimal*? Is there a normative difference between "we don't know if this helps" and "we have reason to think this might not," and which one does your argument support?

  *   **Follow-up:** If you advocate for a precautionary principle instead, isn't the application of *that* principle vulnerable to the same complex cluelessness regarding the economic or social costs of precaution?

  **8. Conditions for Retraction**
  To close: You've targeted longtermism specifically here, not just consequentialism in general. What specific empirical discovery or philosophical argument would convince you that extinction-risk reduction escapes complex cluelessness, without requiring you to abandon your broader critique of consequentialist ethics?

  *   **Follow-up:** If you answer that we need "better models," what specific variable or causal mechanism would those models need to capture to overcome the structural uncertainty you describe?
