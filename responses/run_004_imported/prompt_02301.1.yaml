answer: |-
  # The Tax on Reality

  The Counterfactual Mugging is not a puzzle about money. It is a puzzle about identity.

  When Omega stands before you, coin landed tails, hand outstretched for $100, your brain screams that this is a scam. The $10,000 reward exists only in a world that did not happen. To pay is to sacrifice real currency for a ghost. To refuse is to keep your wallet intact and walk away from a hypothetical.

  Most people, relying on standard Causal Decision Theory (CDT), refuse. They argue that the past is fixed. The coin is tails. Omega's prediction is already made. Your action now has zero causal leverage over the heads-branch of the timeline. Paying is literally burning money.

  They are wrong.

  If you want to be the kind of agent that wins—not just in this specific thought experiment, but in any universe where predictors, correlations, or logical dependencies exist—you must pay the $100. You must pay it gladly. You must pay it because refusing is an admission that your decision-making process is fundamentally fragmented, time-inconsistent, and doomed to leave free money on the table.

  ### The Seduction of Refusal

  To understand why paying is right, we must first steelman the refusal. The intuition against paying is not stupidity; it is the evolutionary default of a creature that lives in a local causal reality.

  The argument for refusal rests on **Causal Inertness**. In our everyday experience, effects follow causes. You cannot change the past. If the coin is already tails, the state of the world is fixed. Omega's prediction happened in the past. Whether you hand over the bill or burn it, the $10,000 in the counterfactual heads-world remains equally unreachable.

  From this perspective, the request is extortion. It asks you to suffer a certain loss ($100) for a benefit that is logically impossible to obtain (the $10,000 that *would have* been given). To pay feels like magical thinking. It feels like believing your action reaches backward through time to alter the coin flip. It violates the sanctity of sunk costs.

  Furthermore, there is a pragmatic objection: **Exploitability**. If you are the kind of person who pays counterfactual muggers, what stops Omega (or a scammer claiming to be Omega) from mugging you repeatedly? If you reward behavior that yields no local benefit, you invite predation. A rational agent should not be a sucker.

  This position is clean. It is simple. It aligns with how humans navigate 99% of reality. But it fails the moment you step into a universe where your decisions are predictable.

  ### The Logic of Payment

  The argument for paying rests on a shift in perspective: from **actions** to **policies**.

  Standard decision theory asks, "Given that I am here, in the tails world, what should I do?" Updateless Decision Theory (UDT) asks, "What policy should I have instantiated *before* the coin was flipped?"

  Imagine you are behind a veil of ignorance. You do not know if the coin will land heads or tails. You know the setup. Omega offers you a deal:
  1.  **Policy A (Pay):** If Tails, you lose $100. If Heads, you gain $10,000.
  2.  **Policy B (Refuse):** If Tails, you lose $0. If Heads, you gain $0.

  The expected value of Policy A is $4,950. The expected value of Policy B is $0. Any rational agent behind the veil would bind themselves to Policy A. They would sign the contract. They would precommit.

  The Counterfactual Mugging removes the ability to sign the contract beforehand. It forces you to make the decision *after* you know the outcome. The refusal argument says, "Now that I know it's Tails, I should renege."

  But why? What changed? Your source code didn't change. Your goals didn't change. Only your information changed.

  If you decide to renege now, you are admitting that your decision-making process is **time-inconsistent**. You are one agent before the flip (who wants to pay) and a different agent after the flip (who refuses). If you know you will renege, the "pre-flip you" knows the deal is off, and you forfeit the $10,000.

  To be a unified agent, you must act as the same algorithm at all times. You must pay the $100 not because it changes the past, but because *you are the kind of thing that pays*. Omega didn't predict what you would do *in the moment*; Omega predicted what your algorithm outputs. Your algorithm outputs "Pay" in the Tails branch only if it is the same algorithm that would accept the reward in the Heads branch.

  ### The Death of Causal Decision Theory

  The refusal argument relies on Causal Decision Theory (CDT), which dictates that you should only consider the causal consequences of your physical action *now*. CDT says you cannot causally affect the counterfactual past.

  But this is a bug, not a feature.

  Consider Newcomb's Problem. A predictor puts $1M in Box B if it predicts you'll take only Box B. CDT says take both boxes (Box A + Box B), because the money is already there or not. But one-boxers walk away with $1M and two-boxers walk away with $1,000. CDT loses.

  Counterfactual Mugging is Newcomb's Problem stripped of the physical boxes. It reveals that rationality is not about manipulating matter; it is about **logical correlation**.

  You and Omega are not causally linked in the moment. You are *logically* linked. Omega simulates you. The "you" in the simulation and the "you" standing in the rain are running the same logic. If the simulated you refuses, the real you (in the heads world) gets nothing. If the simulated you pays, the real you gets rich.

  When you stand in the Tails world, you are not just deciding for yourself. You are deciding for the simulation of yourself that determines the Heads payout. To refuse is to say, "I hope the simulation of me lies to Omega so I can get rich, but I will not honor that lie myself." That is not rationality; that is hypocrisy.

  ### Reflection Stability and the Money Pump

  The strongest defense of paying is the concept of **Reflection Stability**. A rational decision theory should be one that you never wish to change.

  If you adopt the "Refuse" policy (CDT), you will inevitably wish you were a "Pay" agent (UDT) before the coin flip. You will look at the $10,000 you missed and say, "I wish I had precommitted."

  But if you adopt the "Pay" policy (UDT), do you ever wish you were a "Refuse" agent? No. In the Heads world, you are rich. In the Tails world, you are down $100, but you know this was the cost of the ticket that won you the lottery in the other branch. You never regret your policy.

  A decision theory that makes you regret your own existence before the fact is broken.

  Critics argue this makes you vulnerable to exploitation. "What if Omega mugs me every day?" they ask. But this misunderstands the setup. Omega only mugs you once on the coin flip. If you live in a world where predictors exist, being the agent who honors counterfactual bargains is the *only* way to access the upside of prediction. If you refuse to pay the tax on the losing branch, you are barred from the reward on the winning branch.

  ### The Verdict

  So, Omega is standing there. The coin is tails. The $10,000 is gone.

  You reach into your pocket. You pull out $100.

  You are not paying Omega. You are paying the universe. You are paying for the privilege of being an agent whose decisions matter even when they feel like they don't. You are acknowledging that your rationality is a global property of your mind, not a local reaction to your immediate sensory input.

  The refusal argument feels better because it protects your ego. It lets you say, "I didn't lose $100 on a ghost." But it costs you $10,000 in expected value. It fragments your agency across time. It admits that you cannot trust yourself to keep a promise if the circumstances become inconvenient.

  Rationality is not about feeling smart in the moment. It is about winning. And in a universe where information can be predicted, the only winning move is to act as if you didn't know the outcome.

  Pay the mugger. Take the loss. Keep your algorithm clean.
