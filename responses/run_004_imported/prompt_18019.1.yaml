      *   **Commitment Races:** The idea that in bargaining, early/hard commitment wins (Schelling). If everyone can commit credibly, you get deadlock/catastrophe (Chicken/Doomsday Machine).
      *   **Updateless Decision Theory (UDT):** Agents choose a policy $\pi$ that maximizes expected utility across all possible worlds they could be in, *before* updating on specific observations. The idea is to avoid time-inconsistency and pre-commitment vulnerabilities.
      *   **The "Logical Time" Aspect:** In UDT, "before updating" isn't necessarily chronological time; it's logical time (before knowing specific logical facts).
      *   **Theo's Argument:** Ex-ante selection is calm/rational. Ex-post selection is panicked/threat-driven. UDT forces the former, avoiding the latter.
      *   **User's Counter (to be strengthened):** Ex-ante selection is *also* a bargaining problem. If multiple agents are UDT-ish, they are effectively bargaining over the "source code of the universe" or the "policy space."

  3.  **Brainstorming Arguments for the User's Side:**
      *   *Argument 1: The "Veil" isn't neutral.* Who defines the prior? Who defines the set of possible counterparts? If I assume a prior that favors my interests, I win the ex-ante game. This is a race to define the veil.
      *   *Argument 2: Logical Counterfactuals are Bargaining.* If Agent A and Agent B are both UDT, they are reasoning about each other's source code. If A thinks "I will commit to X," and B thinks "I will commit to Y," and X and Y are incompatible, who yields? In UDT, this is resolved by who has the "better" logical argument or who is more "stubborn" in their policy selection. This is still a contest of wills, just abstracted.
