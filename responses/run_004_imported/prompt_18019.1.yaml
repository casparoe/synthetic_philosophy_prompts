  9.  **Final Polish:** Ensure the distinction between "panic" (emotional state) and "incentive structure" (game theoretic pressure) is clear. Theo focuses on the former; the User needs to focus on the latter. (This is the crux of the rebuttal).

  *(Self-Correction during drafting)*: I should mention the "Chicken" game specifically. In standard Chicken, throwing the steering wheel works. In UDT Chicken, both throw the wheel *logically* before the game starts. If both do this, they crash. UDT says "don't throw the wheel if the other does," but how do you know what the other did *logically* before you? You simulate them. If they simulate you... infinite regress or fixed point. The fixed point selection is the race.

