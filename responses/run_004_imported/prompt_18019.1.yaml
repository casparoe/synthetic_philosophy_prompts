      *   *Make sure not to conflate UDT with CDT/EDT.* Keep the focus on the *commitment* aspect of UDT.
      *   *Key Insight:* The "Veil of Ignorance" isn't a magic solvent. It's just another negotiation table.

  8.  **Drafting the Content (Mental Outline):**
      *   Intro: You're right, Theo is missing the meta-game.
      *   Section 1: The "Prior Wars." UDT pushes the conflict up a level.
