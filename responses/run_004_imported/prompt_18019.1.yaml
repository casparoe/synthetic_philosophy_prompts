      *   *Argument 4: The "Bargaining over Priors" Problem.* This is the strongest technical point. UDT requires a prior over logical possibilities. Different agents have different priors. Reconciling these priors *is* the commitment race. If I can convince you to adopt my prior, I win. This leads to "prior warfare."
      *   *Argument 5: Simulating the Opponent.* To choose an ex-ante policy, I need to model you. You need to model me. If we both model each other choosing ex-ante policies, we are in a fixed-point problem. If there are multiple fixed points (equilibria), selecting one is a bargaining problem.

  4.  **Addressing Theo's Ex-Ante/Ex-Post Distinction:**
      *   Theo says ex-ante is "calm" and ex-post is "panicked."
      *   Counter: "Calm" doesn't mean "safe." A calm, calculated decision to destroy the world (because the math said it maximizes expected utility across the prior) is worse than a panicked one that might be talked down.
      *   Counter: The "calmness" is an illusion. The computational pressure to find the optimal policy *before* simulation/interaction is immense. If I suspect you are running a UDT variant that is more aggressive in its policy selection, I must adopt a more aggressive policy *ex-ante* to counter it. This is an arms race in policy space.

