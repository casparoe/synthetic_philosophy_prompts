      *   *Idealizations:* This is the strongest point for a condensed matter physicist. Humeanism saves the phenomena of effective theories. Anti-Humeanism risks making most of the user's career "not really about laws."
      *   *Conclusion:* Summarize the shift. Humeanism = Pragmatic tool for navigating the mosaic. Anti-Humean = Search for the engine driving the mosaic.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Be careful not to say Anti-Humeans *deny* effective laws. They just deny they are *fundamental* laws. But for a physicist, does that matter? Yes, because it affects whether you think you are discovering *new* ontological features or just summarizing old ones.
      *   *Correction on Constants:* Lewis's BSA actually allows constants to vary if the system is simpler with variables. But usually, constants are fixed parameters. The key is whether they *could* have been otherwise. Humean: Yes, the mosaic could have been different. DE: No, essences fix them.
