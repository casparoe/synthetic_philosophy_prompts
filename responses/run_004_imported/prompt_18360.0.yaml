      *   *The Argument:* Douglass shifted from looking at the *intentions* of the Framers to the *text* itself. He argued the words "slave" or "slavery" never appear in the document. He interpreted the 3/5ths clause as a penalty to the South, not a boon. He viewed the Preamble ("secure the Blessings of Liberty") as the governing purpose.

  3.  **Addressing the Core Question: Wishful Idealism vs. Real Argument?**
