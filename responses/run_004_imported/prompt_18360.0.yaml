prompt: |-
  Had a long argument with my friend last night about Frederick Douglass and the Constitution. She was saying his real view was that it's basically a pro-slavery document -- a "covenant with death," like Garrison put it -- since that's literally what Douglass believed for years and it lines up with what the framers actually intended (three-fifths clause, fugitive slave clause, etc). I said that's kind of unfair to him, since he later did a total 180 and worked out a whole argument for reading that same document as anti-slavery, and that his later position is the more interesting and mature one, not just naive hope. Can you actually lay out what his reasoning was for the switch? Was he just being a wishful idealist, or is there a real argument in there for why a text can mean something other then what the guys who wrote it intended it to mean?
