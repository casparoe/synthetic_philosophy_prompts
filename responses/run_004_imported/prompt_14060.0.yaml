      *   *The Horns:*
          *   Horn 1: The sign (prior indicator) *determines* the choice. If so, Jones is determined. Libertarians say no free will here anyway. So the case begs the question against libertarians.
          *   Horn 2: The sign *doesn't determine* the choice. If so, Jones could still have chosen otherwise at the last second, bypassing the sign. If he could have chosen otherwise, PAP holds (he had alternative possibilities).
      *   *Gut Level Analogy:* Imagine a guard watching a prisoner.
