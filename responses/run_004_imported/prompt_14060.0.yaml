          *   Crucially: Process B is indeterministic (libertarian friendly). Process A is set to trigger *only if* Process B fails.
          *   But Process B *doesn't* fail.
      *   *How it avoids the Dilemma:* There is no prior sign that *causes* the decision. The decision arises from the indeterministic process (Process B). The deterministic backup (Process A) is there but remains idle. Therefore, the agent *could* have done otherwise (in the sense that Process B was indeterministic), but the backup ensures she *wouldn't* have (in the sense that the outcome was guaranteed).
      *   *Wait, isn't that contradictory?* That's the crux. They argue she retains "leeway" (alternative possibilities exist in Process B) but those possibilities are "finked" or blocked from becoming actual outcomes by Process A.
      *   *Correction/Refinement:* Actually, Mele and Robb try to construct a case where the agent *lacks* alternative possibilities (satisfying Frankfurt's goal) *without* relying on a prior deterministic sign. They use a "pre-emptive" structure where the backup mechanism is triggered by the *absence* of the decision at a specific time, not a prior sign.
