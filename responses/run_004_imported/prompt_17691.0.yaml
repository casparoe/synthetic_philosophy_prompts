          *   "Arises gradually... slow progression": This sounds historical and evolutionary. It implies a process over time, not a single handshake moment.
      *   *Resolution Strategy:* Hume is likely describing the *logical structure* of the agreement (mutual expectation) vs. the *historical genesis* of the practice. The "mutual expression" isn't necessarily a speech act; it's the behavioral signaling that happens over the "slow progression." The boat example is key: rowers don't stop to talk; they adjust stroke by stroke until they sync. The "knowledge" is practical, not propositional.

  3.  **Analyze Lewis's Account:**
      *   *Lewis's Goal:* To make Hume's vague notion precise using game theory (coordination equilibria).
      *   *Lewis's Definition:* A regularity $R$ in population $P$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition* that others do (coordination equilibrium).
          4.  There is an alternative $R'$.
          5.  **Common Knowledge:** All of the above are common knowledge in $P$.
      *   *Lewis on Hume:* Lewis explicitly cites Hume as his inspiration. He acknowledges Hume's "gradual" account but formalizes the *state* of convention, not necessarily the *history*.
