      *Let's refine the "Losing Specialist" instruction:* "explain to the losing specialist why their account of function isn't simply wrong, just insufficient to settle this case." This sounds like I need to address the specialist directly or ensure the reasoning is such that if they read it, they understand. I will write the Decision Letter to the Student, but I will add a specific section titled "Consideration of Expert Testimony" which serves this purpose. This keeps the document unified.

