answer: |-
  Your intuition is excellent, and honestly, you've put your finger on why this debate is so notoriously tricky. In the standard "Bank Case" (the one you described), Epistemic Contextualism and Pragmatic Encroachment are **extensionally equivalent**. That is a fancy way of saying they predict the exact same output for the exact same input.

  If you ask, "Does Hannah know the bank is open?" in a low-stakes scenario, both say **Yes**.
  If you ask the same question in a high-stakes scenario, both say **No**.

  If your article only focuses on the standard Bank Case, they *are* the same theory. But your philosopher friend was right (despite the wine): they disagree violently on *why* this happens, and that disagreement leads to different predictions in more complex scenarios.

  Here is the substantive distinction, broken down for a feature article.

  ### 1. The Location of the Shift (Who moves?)

  The fundamental disagreement is about **where the variability lives.**

  **Epistemic Contextualism** claims the word "knows" is context-sensitive, similar to adjectives like "tall," "flat," or "rich."
  *   **The Mechanism:** When stakes rise, the *semantic standards* for the word "knows" rise.
  *   **The Implication:** Hannah's mental state and evidence remain exactly the same. She hasn't lost knowledge. Rather, the *conversation* has changed. In a low-stakes conversation, the sentence "Hannah knows" is true. In a high-stakes conversation, the sentence "Hannah knows" is false.
  *   **The Analogy:** Imagine a 5'10" man. Is he tall? If you're talking about jockeys, yes. If you're talking about NBA players, no. The man didn't shrink; the context of the comparison changed. Contextualists say "knowledge" works the same way.

  **Pragmatic Encroachment** (often technically called *Subject-Sensitive Invariantism*) claims the word "knows" is stable, but the *state of knowledge* itself depends on practical factors.
  *   **The Mechanism:** Practical stakes literally affect whether you are justified. When stakes rise, your evidence is no longer sufficient to constitute knowledge.
  *   **The Implication:** Hannah *actually loses knowledge* when the mortgage payment becomes due. It's not a trick of language; it's a change in her epistemic status. Practical reasons have "encroached" on the epistemic domain.
  *   **The Analogy:** Imagine a bridge rated for 10 tons. If you're driving a car, it's safe to cross. If you're driving a tank, it's not safe to cross. The bridge didn't change, but the *safety status* of crossing it depends on what you're driving. Encroachers say knowledge is like safety: it depends on what's riding on it.

  ### 2. The Smoking Gun: The Third-Party Test

  This is where the two theories diverge on verdicts. You can distinguish them by separating the **Subject** (the person who supposedly knows) from the **Attributor** (the person saying "they know").

  **The Scenario:**
  Hannah is the Subject. She has high stakes (mortgage due).
  Sarah is the Attributor. She is observing Hannah, but Sarah has low stakes (she's just curious, no mortgage).

  Sarah says: *"Hannah knows the bank is open."*

  *   **The Contextualist Verdict:** **True.**
      Why? Because the truth of "knows" is determined by the *Attributor's* context (Sarah). Sarah is in a low-stakes conversation, so the bar for "knows" is low. Hannah clears that bar. Sarah speaks truthfully.
  *   **The Encroachment Verdict:** **False.**
      Why? Because the truth of "knows" is determined by the *Subject's* situation (Hannah). Hannah's stakes are high, so the bar for knowledge is high. Hannah does not clear that bar. Sarah is mistaken, even though Sarah herself isn't under pressure.

  **Why this matters for your piece:**
  Contextualism suggests that knowledge is a social status we grant each other based on our conversational needs. Encroachment suggests knowledge is a real psychological state that is vulnerable to external pressure.

  ### 3. The "Purely Epistemic" Debate

  There is a deeper philosophical turf war underneath this, which might add color to your feature.

  For centuries, epistemologists wanted to keep **Practical Reasons** (what's at stake) separate from **Epistemic Reasons** (evidence, truth, reliability). They wanted knowledge to be about "getting it right," not "what happens if you're wrong."

  *   **Contextualists** are trying to **save** the traditional view. They want to say, "See? Practical stakes don't change knowledge itself! They only change how we talk about it. Evidence is still king."
  *   **Encroachers** are willing to **burn** the traditional view. They argue, "No, if it matters more, you need more evidence. Practical stakes are part of what knowledge *is*."

  ### Summary for your Article

  If you need a quick sidebar or boxout to clarify the distinction for readers, you can use this:

  | Feature | Epistemic Contextualism | Pragmatic Encroachment |
  | :--- | :--- | :--- |
  | **What changes?** | The **meaning** of the word "knows." | The **status** of the knower. |
  | **Whose context matters?** | The **Speaker's** (the person claiming knowledge). | The **Subject's** (the person acting on knowledge). |
  | **Is knowledge purely about evidence?** | **Yes.** (Practical stakes just change the conversation). | **No.** (Practical stakes help determine justification). |
  | **Analogy** | "Tall" (depends on who you compare to). | "Safe" (depends on the risk involved). |
  | **Vibe** | Linguistic flexibility. | High-stakes realism. |

  ### The Takeaway

  Your friend was right that they are rival schools, but you were right that they look identical in the basic cases.

  *   **Contextualism** says pressure warps our **language**.
  *   **Encroachment** says pressure warps our **minds**.

  For a feature on how stakes warp thinking, **Pragmatic Encroachment** is probably the more dramatic hook. It suggests that under enough pressure, we literally *lose* knowledge we previously held, not just the confidence to assert it. Contextualism is a bit drier—it suggests we're just being more careful with our words. Encroachment suggests the pressure gets inside our heads and dissolves the justification itself.
