  2.  **Deconstruct Du Bois's "Criteria of Negro Art":**
      *   *Key Quote:* "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
      *   *The Three Criteria:* Truth, Beauty, Goodness (Justice).
          *   **Truth:** Depicting Black life honestly, not hiding faults but not defining the race *only* by faults. "We want to be the people that we are... without having to apologize."
          *   **Beauty:** Aesthetic excellence. Art must be beautiful to be effective propaganda. "I do not care a damn for any art that is not used for propaganda." But also, "I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy."
          *   **Goodness/Justice:** The ultimate goal is racial uplift and fighting prejudice. Art should advance the cause of Black equality.
      *   *The Respectability Constraint:* Du Bois worried about "the lower classes" being presented as the *only* representation of Black life. He wanted to show the "talented tenth" and the dignity of the race to counteract racist caricatures. He criticized writers like Langston Hughes (in *Not Without Laughter* era) or Zora Neale Hurston for focusing too much on the "folk" or "low life."

  3.  **Analyze "Conscious Hip-Hop":**
      *   *Themes:* Systemic racism, police brutality, poverty, empowerment, Black history, liberation (aligns with Justice/Propaganda).
