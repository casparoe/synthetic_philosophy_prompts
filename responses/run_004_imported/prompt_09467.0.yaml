      *   *McMahan's View:* If the war is unjust, the soldiers fighting it are essentially participating in a collective crime. Their liability to be killed is different from those defending.
      *   *The Challenge:* How to honor the father's Walzerian wish without making the eulogy philosophically "false" to someone who knows McMahan, while keeping it simple for the veterans.
      *   *The Solution:* Focus on the *human experience* of the soldier rather than the abstract metaphysics of liability. Frame the "equality" not as a claim about the *war's* justice, but about the *soldier's* burden and humanity. Acknowledge the complexity (satisfying the journalist/cousin dynamic) without resolving it academically. The "equality" is in the shared risk, the shared obedience to orders, and the shared trauma, not necessarily in the cosmic ledger of guilt. This bridges Walzer (legal/moral convention) and McMahan (deep morality) by focusing on *empathy*.

