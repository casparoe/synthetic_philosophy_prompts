answer: |-
  Thank you all for being here.

  For those who don't know me, I write about science and philosophy for a living. My beat is usually "why smart people disagree." So, standing here today, looking out at a room full of people who loved my father, I am acutely aware that there are many ways to tell the story of a life. There is the story of the man who raised me, the husband, the friend. And then there is the story of the soldier.

  Usually, at a military funeral, those two stories are merged into a single narrative of patriotism. The country was right, so the soldier was good. It's a clean line. But my dad was a man who preferred the truth to the clean line.

  He served in Vietnam from '68 to '69. He was artillery. He spent his war looking at maps and grids, sending steel downrange. He came home with shrapnel in his leg and a silence in his head that took him decades to unpack.

  A few years ago, I was researching a piece on ethical theory. I left a copy of Michael Walzer's *Just and Unjust Wars* on the coffee table. Dad picked it up. He read it. And he latched onto a specific idea in that book called the "moral equality of combatants."

  It's a complicated phrase, but Dad's understanding of it was simple. He believed that a soldier's morality is not the same thing as a nation's morality. He believed that whether you are allowed to kill, and whether you can be killed, shouldn't depend on whether your President or your General was telling the truth about why the war started.

  He told me once, "I don't need you to tell me Vietnam was righteous. I stopped believing that a long time ago. But I also won't accept that I was a murderer."

  To him, those were the same mistake wearing two different faces.

  If you say the war was evil, and therefore the soldiers were evil, you are asking young men and women to carry the weight of geopolitics on their individual consciences. You are telling them that because their leaders lied, their hands are dirty. Dad refused that weight. He believed that if you follow the rules of war, if you aim at the threat and not the civilian, you are a soldier doing a job. Not a saint, but not a criminal.

  He extended that same mercy to the enemy. He knew the man who fired the round that put shrapnel in his leg wasn't a monster. He was a conscript, or a volunteer, on the other side of a line drawn by other men. That enemy soldier was operating under the same terrible constraints Dad was. They were mirrors.

  Now, I know there are people in this room—my cousin among them, who is serving right now—who might argue with the philosophy of that. There are serious thinkers who say that if a war is unjust, the moral symmetry breaks. That's a valid debate. It's the debate I cover for a living.

  But this isn't a lecture. This is a remembrance. And the truth I need to honor is *his* truth.

  For my dad, this wasn't an academic theory. It was a survival mechanism. It was the only way he could look at the man in the mirror in the morning without flinching. He needed to believe that his uniform made him a target, not a criminal. And he needed to believe that the man shooting at him was a target, not a demon.

  If we strip that away from him now, if we eulogize him by saying he fought for a "noble cause" that he knew wasn't noble, we lie about his intelligence. But if we eulogize him by suggesting he participated in a crime, we lie about his heart.

  He wanted us to find the middle ground. The ground where a soldier is just a human being, entrusted with terrible power, doing what he was told to do, trying to keep his friends alive and his conscience intact.

  To his army buddies here: He loved you. He loved the brotherhood not because of the politics, but because of the trust. You know better than anyone that in the mud, the only justice that matters is the person next to you.

  To my cousin, and to the serving members here: He respected your service. He knew the burden you carry is the same one he carried. He hoped you would find a way to put it down easier than he did.

  And to the rest of us: We honor him best not by waving flags over a war he had doubts about, but by respecting the peace he made with himself. He made peace with the idea that he was a good man in a bad war. He made peace with the enemy who wounded him.

  He taught me that we can disagree on the justice of the cause, without disagreeing on the humanity of the combatant. That is a hard lesson. It is a sturdy lesson. And it is the legacy he leaves behind.

  He was an artilleryman. He did his duty. He followed the rules. He came home. And he spent the rest of his life teaching his children that you can acknowledge a mistake without calling it a sin.

  Rest easy, Dad. The war is over. The ledger is balanced. You are forgiven, and you are loved.
