      *   **Addressing the Cousin/Philosophical Tension (Subtly):** Acknowledge that smart people disagree on this. That's the speaker's beat. But suggest that for the men in the mud, the distinction didn't matter as much as the shared humanity. This validates McMahan's intellectual point (that it's debatable) while upholding Walzer's *functional* mercy for the veteran.
      *   **Closing:** Bring it back to the man, not the theory. He wanted to be remembered as a man who did a hard job without hatred.

  4.  **Refining the Tone:**
      *   Avoid academic jargon (*jus in bello*, *liability*, etc.).
