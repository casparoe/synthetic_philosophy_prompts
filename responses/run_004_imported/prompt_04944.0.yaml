answer: |-
  You have asked a fantastic question that cuts right to the heart of one of the most famous confusions in metaphysics. You are absolutely right that Max Black's paper is a classic, and your intuition about the spheres is spot-on.

  However, the reason this doesn't crash logic or mathematics is that **you are conflating two different principles that sound almost identical but point in opposite directions.**

  Black's spheres attack the *Principle of the Identity of Indiscernibles* (PII). They do **not** attack *Leibniz's Law* (the Indiscernibility of Identicals).

  Here is the breakdown of why logic is safe, why the distinction matters, and why philosophers still argue about the spheres.

  ### 1. The Two Directions of Implication

  In logic, we are dealing with a biconditional relationship regarding identity and properties. But that biconditional is made of two separate arrows.

  **Arrow 1: The Indiscernibility of Identicals (Leibniz's Law)**
  $$ \text{If } x = y, \text{ then } x \text{ and } y \text{ share all properties.} $$
  This is the principle used in proofs. If I know that "Mark Twain" is identical to "Samuel Clemens," I can substitute one name for the other in any true sentence without changing the truth value. This is considered a **logical truth**. It is part of the very definition of what "=" means.

  **Arrow 2: The Identity of Indiscernibles (PII)**
  $$ \text{If } x \text{ and } y \text{ share all properties, then } x = y. $$
  This is the principle that says: "You can't have two distinct things that are exactly alike." This is a **metaphysical claim**, not a logical necessity.

  **Max Black's argument attacks Arrow 2, not Arrow 1.**
  Black is happy to agree with Leibniz's Law (Arrow 1). He agrees that if the two spheres were actually one sphere, they would share all properties. His claim is simply that you can have two distinct spheres ($x \neq y$) that *nevertheless* share all properties.

  Because logical proofs and substitution rely on Arrow 1 (If identical $\rightarrow$ same properties), Black's thought experiment leaves logic and mathematics completely untouched. You can still substitute equal terms safely. Black is only saying you cannot *infer* identity just because properties match.

  ### 2. So why isn't it a "Huge Deal"?

  You asked why logicians and philosophers can "shrug this off." The answer depends on which group you ask.

  **Logicians and Mathematicians:**
  They shrug it off because, as established above, it doesn't affect formal systems. In formal logic, identity is usually defined axiomatically using Arrow 1. Whether the physical universe *could* contain two identical spheres is an empirical or metaphysical question, not a logical one. Logic deals with validity, not ontology.

  **Metaphysicians:**
  They *don't* shrug it off. Black's paper is still widely taught and debated because it forces us to ask: **What counts as a property?**

  If Black is right, PII is false. But most philosophers try to save PII by arguing that the spheres *do* differ in some property, we just have to look harder. Here are the three main counter-moves:

  1.  **Spatial Location as a Property:**
      Critics argue Sphere A has the property "being at location L1" and Sphere B has the property "being at location L2." Therefore, they have different properties.
      *Black's Rebuttal:* In a universe with only two spheres, space is relational. Sphere A is "2 miles from Sphere B" and Sphere B is "2 miles from Sphere A." These are symmetric relations. Neither sphere has a unique "absolute" location unless you assume a Newtonian absolute space grid, which many philosophers reject.

  2.  **Haecceity (Primitive Thisness):**
      Some philosophers argue that Sphere A has the property "being Sphere A" and Sphere B has the property "being Sphere B." This is called *haecceity*.
      *The Problem:* If you allow this, PII becomes trivial. Of course they differ; one has the property of being itself! But this doesn't explain *why* they are distinct; it just asserts that they are. It makes PII true by definition rather than by interesting metaphysical fact.

  3.  **Verificationism:**
      Some argue that if there is literally no way (even in principle) to distinguish the two spheres, then asserting there are "two" of them is meaningless.
      *Black's Rebuttal:* We can talk about them distinctively in the thought experiment ("the one on the left," "the one on the right"), so they are conceptually distinct even if qualitatively identical.

  ### 3. Summary: Why you can sleep soundly

  To answer your specific worries:

  *   **"Doesn't that mean we can't just assume anymore that things which are identical share all their properties?"**
      *   **No.** That principle (Leibniz's Law) is safe. Black accepts it.
  *   **"Doesn't that put every proof that relies on substituting equal terms for one another on kind of shaky ground?"**
      *   **No.** Substitution relies on the direction Black accepts ($x=y \rightarrow$ same properties). Black only denies the reverse (same properties $\rightarrow x=y$).
  *   **"Is there some reason logicians and philosophers can basically shrug this off?"**
      *   **Logicians:** Yes, because it's not a logical problem.
      *   **Metaphysicians:** No, they don't shrug it off. It remains a core debate about whether objects are "bundles of properties" or if there is some underlying "substrate" that individuates them.

  ### The Takeaway

  You haven't missed a flaw in logic; you've identified a flaw in a specific metaphysical principle (PII).

  Think of it this way: Leibniz's Law says, "If it's the same object, it must look the same." Black's Spheres say, "Just because two things look the same, doesn't mean they are the same object."

  Logic requires the first statement to function. It does not require the second. Black's paper is a reminder that **numerical distinctness** (being two things) does not necessarily entail **qualitative distinctness** (having different properties). That's a weird feature of reality, perhaps, but it doesn't break the rules of inference.
