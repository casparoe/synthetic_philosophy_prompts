answer: |-
  This is a great question. You are right to be skeptical; a lot of summaries treat "complex cluelessness" as just "really big uncertainty," which implies it's just a matter of widening the error bars on your expected value (EV) calculation. If that were true, standard Bayesianism would handle it fine.

  But Greaves' point is sharper than that. The distinction isn't about the *width* of your credence function; it's about whether you are epistemically entitled to have a credence function **at all** in the specific way EV requires.

  Here is the intuition unpacked, focusing on why complex cluelessness breaks the machinery of expected value reasoning rather than just straining it.

  ### 1. The Prerequisite: EV Needs a Justified Distribution
  Expected Value theory doesn't just say "guess the outcome." It says:
  $$EV = \sum (Probability \times Value)$$

  To use this, you need a probability distribution. In "garden-variety" uncertainty (Simple Cluelessness), you have a model of the world, but you don't know the specific parameters.
  *   **Example:** You are estimating the carbon impact of a policy. You know the physics of combustion. You don't know exactly how many cars will be on the road.
  *   **Epistemic State:** You can justify a normal distribution centered on your best guess. You have reasons to think errors are random and will cancel out.
  *   **Result:** You can calculate an EV. It might have a wide confidence interval, but the *mean* is robust.

  **Complex Cluelessness** arises when you lack the model itself, not just the parameters. You don't know the causal structure well enough to justify *any* specific distribution, including a "neutral" one.

  ### 2. The "Symmetry" Trap
  The reason people think EV handles this fine is the **Symmetry Argument**: *"Sure, there are unforeseeable long-term effects, but for every good unforeseeable effect, there's probably a bad one. They cancel out. So the expected value of the unknown stuff is zero."*

  Greaves argues this symmetry is unjustified in complex cases. Here is why:

  **In Simple Cluelessness (Noise):**
  The unknown factors act like **statistical noise**.
  *   *Intuition:* Like measurement error. Sometimes you measure high, sometimes low.
  *   *Why Symmetry Holds:* Because the underlying mechanism is stable. The errors are independent and identically distributed.
  *   *EV Status:* Safe. You can assume the mean of the error is 0.

  **In Complex Cluelessness (Chaos/Structure):**
  The unknown factors act like **structural shifts**.
  *   *Intuition:* Like pressing a button that might trigger a cascade.
  *   *Why Symmetry Fails:* Causal chains in social/historical systems are non-linear. They have tipping points, lock-in effects, and value asymmetries.
  *   *Example:* Imagine a policy that slightly increases economic growth.
      *   *Positive unforeseeable effect:* We develop fusion power 10 years earlier.
      *   *Negative unforeseeable effect:* We develop AI alignment-breaking tech 10 years earlier.
      *   *The Problem:* These two outcomes do not have equal magnitude, nor do they have equal probability. One might lead to a utopia, the other to extinction. To assign them equal weight (canceling them out) is not "neutral"; it is a massive, unjustified substantive claim about the structure of the future.

  ### 3. What's Actually Doing the Work? (Model vs. Parameter Uncertainty)
  The work is being done by the distinction between **Parameter Uncertainty** and **Model Uncertainty**.

  *   **Simple Cluelessness is Parameter Uncertainty:** You know the equation $Y = mX + c$. You just aren't sure about $m$. You can put a probability distribution on $m$. EV works.
  *   **Complex Cluelessness is Model Uncertainty:** You don't know if the equation is linear, exponential, or sigmoidal. You don't even know what the variables are.

  When you try to apply EV to Complex Cluelessness, you are forced to **fake a model**. You arbitrarily assign a probability distribution (e.g., "50% chance it's good, 50% chance it's bad") to make the math work.

  Greaves' critique is that this arbitrariness is epistemically vicious. In standard Bayesianism, you are supposed to update on evidence. But in complex cluelessness, you have no evidence that justifies the *shape* of your prior. You are essentially smuggling in a claim that "the universe is symmetric regarding my ignorance," which is not a rational default; it's a guess.

  ### 4. Why This Matters for Consequentialism
  If this were just "hard math," it wouldn't matter. But for consequentialism, it strikes at the **action-guiding** nature of the theory.

  1.  **Decision Paralysis:** If Complex Cluelessness is prevalent (which Greaves suggests it is for long-term interventions), then for many actions, the "unforeseeable effects" term in the EV equation is not 0, it is **undefined**. If a significant chunk of your EV calculation is undefined, the total EV is undefined. You cannot compare Action A to Action B.
  2.  **The "Pascal's Mugging" of Cluelessness:** If you allow yourself to assign arbitrary distributions to complex cluelessness, you become vulnerable to manipulation. Someone can propose a bizarre causal chain ("If you don't give me $5, a demon will torture people") and say, "You can't prove the probability is zero!" If you treat complex cluelessness as garden-variety uncertainty, you have to assign *some* probability, and if the stakes are high enough (infinite utility), the EV dominates. Greaves' distinction is a firewall against this: it says "No, you are not epistemically allowed to assign a precise probability here."
  3.  **Imprecise Probabilities:** The distinction pushes us toward **Imprecise Bayesianism**. Instead of a single credence (0.5), you have a set of credences ([0.1, 0.9]).
      *   In **Simple** cases, the set is narrow (0.49, 0.51). EV maximization still works.
      *   In **Complex** cases, the set is massive (0.0, 1.0). EV maximization breaks down because the range of expected values for Action A overlaps completely with Action B.

  ### Summary Analogy
  Imagine you are betting on a game.

  *   **Simple Cluelessness:** You are betting on a coin flip, but the room is dark. You can't see the coin clearly.
      *   *Response:* You still know it's a coin. You assign 50/50. You bet.
  *   **Complex Cluelessness:** You are betting on a box. You don't know what's inside. The person running the game might put a coin in there, or a die, or a bomb, or nothing.
      *   *Response:* If you assign 50/50 to "Good Outcome vs. Bad Outcome," you are pretending you know it's a coin. You don't. You have no basis for the number.
      *   *Consequence:* You cannot calculate the Expected Value of opening the box. Any number you write down is fiction.

  **The "Click":** Complex cluelessness isn't a problem because the uncertainty is *large*; it's a problem because the uncertainty is *unquantifiable*. It denies you the very probabilities that Expected Value theory requires to function. It transforms the problem from "calculating a hard sum" to "realizing the sum cannot be written."
