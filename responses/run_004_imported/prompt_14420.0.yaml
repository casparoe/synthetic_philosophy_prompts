answer: |-
  **Setting:** *A sculptor's studio, late afternoon. Dust motes dance in the shafts of light cutting through the high windows. In the center of the room, on a turntable, sits a freshly molded clay bust of a grimacing philosopher. A large wire cutter rests on the table beside it. The sculptor, silent and impatient, stands with her hands on her hips, waiting for the two visitors to finish their debate so she can reclaim her material.*

  **Characters:**
  *   **Elena:** A constitution pluralist. She believes the statue and the lump are distinct, coincident objects.
  *   **Marcus:** A constitution monist. He believes there is only one object, described in two ways.

  ***

  **Elena:** (Gesturing to the bust) Look at it, Marcus. It's the perfect test case. Right now, in this exact spatial region, we have a lump of clay and a statue. The sculptor is about to crush it. If she does, the lump survives. It will be a ball of clay. But the statue? The statue is destroyed. It ceases to exist.

  **Marcus:** I see the bust. I see the clay. I don't see two things. I see one thing that is both a bust and a lump.

  **Elena:** That's the instinct I had when I started coding, too. "It's just two variables pointing to the same memory address." But metaphysics isn't syntax. If there is only one object, then by Leibniz's Law, it must share all its properties with itself. But this object has the property *could-survive-being-squashed* under the description "clay," and lacks that property under the description "statue." An object cannot both have and lack a property. Therefore, there must be two objects. Coincident, but distinct.

  **Marcus:** You're treating modal properties like they're monadic stickers you slap on a substance. "Could survive squashing" isn't a property the object has *simpliciter*, Elena. It's a property it has relative to a sortal concept.

  **Elena:** Relative to a concept? That sounds like you're retreating to linguistics. We aren't talking about words. We're talking about persistence conditions. If I squash it, reality changes. Does the object persist or not? If you say "yes," you deny the intuition that the statue is destroyed. If you say "no," you deny the intuition that the clay survives. You can't have it both ways with a single entity.

  **Marcus:** I can, if I reject the assumption that persistence is a brute fact independent of *what* the thing is. Look, I agree with you on the physical facts. If the wire cuts, the matter remains. The form is lost. My claim is that "object" isn't a neutral container that holds properties. To be an object is to be an object *of a kind*.

  **Elena:** So you're saying identity is sortal-relative? $x$ is the same $F$ as $y$, but not the same $G$?

  **Marcus:** Exactly. There is one particular here. Let's call it *t*. *t* is essentially clay. *t* is accidentally a statue. When we ask, "Will *t* survive squashing?" the question is incomplete. We must ask, "Will *t* survive *qua* clay?" Yes. "Will *t* survive *qua* statue?" No.

  **Elena:** But *t* is just *t*. If *t* is the statue, and *t* is the clay, and the clay survives, then the statue survives. You're trying to hide the contradiction behind the word "qua." If they are numerically identical, they share *all* properties, full stop. Not "properties relative to a description." If you admit the modal profiles differ, you've admitted they are distinct entities. You've just refused to count them as such.

  **Marcus:** (Steps closer to the turntable, hovering a hand over the clay without touching it) You're assuming that the modal profile is intrinsic to the particular in isolation. But think about the grounding problem you raised earlier. You say there are two objects here. What makes it the case that there are two? They share all the same microphysical parts. They share the same location. They share the same mass. The only difference is their persistence conditions. But persistence conditions aren't physical forces. They're rules of tracking.

  **Elena:** They're metaphysical rules, not just tracking. The statue has an essential property of having a certain form. The clay does not. That's a real difference in nature.

  **Marcus:** It is a real difference in *nature*, but not a difference that multiplies *entities*. Here is how my view accommodates the survival difference without splitting the object: The single object possesses a wide range of potentialities. Some of those potentialities involve retaining its current shape; others involve being reshaped. The sortal "statue" acts as a filter that selects only the shape-retaining potentialities as relevant to its identity. The sortal "clay" selects the matter-retaining potentialities.

  **Elena:** A filter? So the object *could* survive, but we just decide to say it didn't?

  **Marcus:** No. It's not a decision. It's about what constitutes the identity conditions for the thing we are discussing. When the sculptor crushes this, the *matter* continues to instantiate the kind "clay." It fails to instantiate the kind "statue." Since there is only one particular, the particular continues. But the *truth* of the sentence "The statue survives" is false, because the conditions required for the predicate "is a statue" are no longer met by the continuing particular.

  **Elena:** So, "The statue" refers to the particular *while* it satisfies the form condition.

  **Marcus:** Precisely. It's a phase sortal. Like "caterpillar" and "butterfly." There aren't two insects in the chrysalis. There is one organism undergoing a phase change. Here, the "statue" is a phase of the clay. When the phase ends, the statue goes out of existence. The clay does not. But the *subject* of the change—the underlying particular—is one and the same.

  **Elena:** (Frowns, tapping her chin) The caterpillar analogy is dangerous. A caterpillar biologically transforms. Here, the matter is static; the arrangement changes. But let's press the Grounding Problem. If there is only one object, why does it have *any* statue-like properties at all? Why isn't it just a lump? What grounds the fact that we can truly say "This is a statue" right now, if the statue isn't a distinct entity with its own essence?

  **Marcus:** Because the lump is arranged *statue-wise*. And that arrangement, combined with the sculptor's intention, realizes the functional role of a statue. The property "being a statue" is a higher-order property of the clay. It doesn't require a second substance. It just requires the clay to have a specific structure.

  **Elena:** But if the property "being a statue" brings with it specific persistence conditions—conditions the clay *doesn't* share—then you have one thing with contradictory persistence conditions. You're saying the object *must* keep its shape to remain a statue, but *need not* keep its shape to remain the object. If the object *is* the statue, the object must keep its shape.

  **Marcus:** (Turns to the sculptor, who is tightening her grip on the wire cutter) We're running out of time. Here is the crux, Elena. You think identity is absolute. I think existence is sortal-sensitive. When you ask, "Is the statue identical to the clay?" you are asking if the particular falling under the concept *Statue* is the same particular falling under the concept *Clay*. I say yes.
  When you ask, "Does the statue survive?" you are asking if the particular continues to fall under the concept *Statue*. I say no.
  When you ask, "Does the clay survive?" you are asking if the particular continues to fall under the concept *Clay*. I say yes.
  There is no contradiction because the survival question is always elliptical. It always means "Survive *as what*?"

  **Elena:** But that makes existence cheap. It makes the "statue" dependent on our concepts. If no one had the concept "statue," would the object still have the property of *being-destroyed-by-squashing*?

  **Marcus:** The *particular* would still be crushed. The *form* would still be lost. The physical event is mind-independent. But "destruction" implies the cessation of an *object*. And objects are countable units of reality. We count them by kinds. Without kinds, there is just undifferentiated matter. So yes, in a sense, the "statue" as a countable entity requires a conceptual scheme. But the *clay* does not. The clay is the primary substance. The statue is a dependent mode of that substance.

  **Elena:** (Sighs) So you're a substratum theorist. The clay is the substratum, the statue is the mode.

  **Marcus:** I'm saying the clay is the dominant sortal. There is one object. It has the modal property of *clay-survivability*. It lacks the modal property of *statue-survivability*. These are not contradictory because they are properties of the object *under different guises*. Leibniz's Law applies to objects *simpliciter*, but we never access objects *simpliciter*. We only access them as $F$ or as $G$.

  **Elena:** And if I say the object *simpliciter* has the property "could survive"?

  **Marcus:** Then I say that's false. The object *simpliciter* has no persistence conditions. Only objects-under-a-sortal do.

  **Elena:** (Looks at the bust, then at the wire) That's a bold move. You're denying that particulars have intrinsic modal profiles.

  **Marcus:** I'm denying that modal profiles exist apart from the kinds that define them.

  **Elena:** And you think this solves the grounding problem? What grounds the fact that this is a statue and not just a lump?

  **Marcus:** The arrangement grounds the classification. The classification determines the persistence conditions. There is no extra "statue substance" to ground.

  **Elena:** (Shakes her head slowly) I still think you're smuggling in a distinction without counting it. You say "one object," but you treat it as if it has two separate histories. One history where it ends at $t_1$ (the statue), and one where it continues past $t_1$ (the clay). If the histories diverge, the bearers of the histories must diverge.

  **Marcus:** The histories don't diverge. The *description* of the history diverges. The single timeline contains one event: the crushing. Under the clay-description, it's a reshaping. Under the statue-description, it's a termination. One event, two truth-values depending on the predicate.

  **Elena:** And that doesn't violate the Indiscernibility of Identicals?

  **Marcus:** Only if you insist properties are monadic. If properties are sortal-indexed, the law holds. The object is *identical* to itself. It just has different potentialities actualized depending on which sortal track we follow.

  *(The sculptor steps forward. The wire hums as she tightens her grip.)*

  **Sculptor:** Gentlemen. Ladies. It's getting late.

  **Elena:** (Watching the wire) If you cut that, and I'm right, you are destroying one thing and preserving another. You are killing a statue to save a lump.

  **Marcus:** If you cut that, and I'm right, you are changing one thing. You are ending its career as a statue and continuing its career as a lump.

  **Elena:** Same physical outcome. Different ontology.

  **Marcus:** Same ontology. Different grammar.

  **Elena:** (Smiles faintly) We'll see. If the ghost of the statue haunts this studio tonight, I'll know I was right.

  **Marcus:** If the clay remembers being a statue, I'll concede.

  *(The sculptor squeezes. The wire bites into the neck of the bust. The form slumps. The dust rises. The mass remains.)*

  **Elena:** (Watching the slumped form) There goes the statue.

  **Marcus:** (Watching the pile of clay) There goes the shape. The object remains.

  **Elena:** Distinct.

  **Marcus:** One.

  *(They stand in silence as the sculptor begins to knead the clay back into a sphere.)*
