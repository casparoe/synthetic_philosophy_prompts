prompt: |-
  So for my ancient philosophy seminar this semester we've basically spent three weeks slowly grinding through Book 1 and the start of Book 2 of Plato's Laws, specifically the part where the Athenian Stranger has to convince Megillus and Kleinias (who are both suspicious of drinking parties because Sparta and Crete basically ban them for soldiers) that supervised drunkenness is actually a legit tool for testing and training someone's character. There's the analogy with a hypothetical "fear drug" that would let you test courage without real danger, wine functioning as a kind of touchstone that loosens people up and shows their real disposition once shame stops holding it back, the bit about needing a sober president of the symposium so it doesn't turn into chaos, and then this weirdly touching part later about how men past a certain age (30-something? 40-something? my notes are unclear) basically need Dionysus's gift to loosen back up enough to sing and dance again, like a second childhood, so they can take part in the "third chorus" that's supposed to handle moral education for grown adults.

  Anyway the actual reason I'm asking is my best friend is getting married in a week and a half, and he's the best man's nightmare: a classics PhD student who has made "the real Plato book about wine isnt the Symposium, its the Laws" his whole personality at every party for like two years. He specifically asked me to give a toast that engages with THAT argument instead of the easy Eros/Symposium material everyone else keeps doing as a running joke at him. Problem is the room is genuinely split down the middle: half is his cohort and his advisor, who will absolutely clock it if I fake the argument or just namedrop "in vino veritas" and move on, and the other half is his 80-something grandma and my younger cousins, some of whom are minors, who have never heard of Kleinias and will tune out the second it turns into a lecture.

  Can you write me the toast? It needs to actually use the Laws argument to say something real about what a wedding is -- there's something there about vows being a lifelong test of character too, and about a toast itself being a tiny supervised ritual of communal drinking, I just can't get it to click into an actual bit. It has to be genuinely funny and warm rather than a seminar recap, it can't lean on the Symposium at all since that's the cliché he's sick of, and it needs an real glass-raised toast line at the end. And since minors are in the room, it obviously can't read as "Plato says get wasted, cheers" -- if anything, use his own caveats about age and supervision to make that joke work for me instead of against me.
