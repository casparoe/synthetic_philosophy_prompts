answer: |-
  Your nagging feeling is correct. There is a fundamental difference between the two situations, and your friend is looking at the surface mechanics while you are intuitively sensing the underlying purpose. The school isn't being inconsistent; they are applying two different principles of accountability.

  Here is the breakdown of why those two scenarios are not the same.

  ### 1. Restitution vs. Discipline
  The broken window and the detention serve two completely different functions.

  *   **The Window (Restitution):** The goal here is to make the school whole financially. A window is a material asset. When it is broken, the loss is monetary. In the eyes of the law and school policy, minors generally cannot enter into contracts or hold liability for property damage in the same way adults do. **Parents are financially liable for the actions of their minor children.** Therefore, you paying for the window isn't "stepping in" to save him; it is you fulfilling your legal and financial obligation as a guardian. The school doesn't need *him* to fix it; they need the window fixed.
  *   **The Detention (Discipline):** The goal here is behavioral correction. Detention is not about "losing an afternoon"; it is about the student experiencing a consequence for their actions to discourage future behavior. It is a pedagogical tool. If you sit in the detention, the asset (the afternoon) is lost, but the lesson is not learned. The consequence is non-transferable because the *experience* of the consequence is the point.

  ### 2. Fungibility
  This is an economic concept that applies perfectly here.
  *   **Money is fungible:** A $200 bill you pay is identical to a $200 bill your son might have earned. The school doesn't care where the money comes from, as long as the debt is settled.
  *   **Time and Reflection are not fungible:** Your afternoon is not the same as his afternoon. Your boredom, your reflection, and your loss of free time do not register in his brain as a consequence for *his* actions. You cannot serve a behavioral sentence for someone else any more than you can go to jail for a crime they committed.

  ### 3. Developmental Responsibility
  *   **Financial:** Children are not expected to have the means to replace a window. Expecting him to work off the cost might be legally complicated (child labor laws) or simply impossible. You paying it is the standard mechanism for this type of incident.
  *   **Behavioral:** Children *are* expected to learn self-regulation and respect for authority. If the school allows you to absorb the consequence, they are inadvertently teaching him that you will shield him from social or disciplinary repercussions. By saying "only he can serve it," the school is reinforcing that he is the agent of his own behavior.

  ### The Verdict
  Your friend sees both situations as **"Parent solves problem."**
  You are sensing that the situations are actually **"Parent pays debt"** vs. **"Student learns lesson."**

  The school is being consistent with educational and legal standards. They accepted your money for the window because you are financially responsible. They rejected your time for the detention because your son is behaviorally responsible.

  You aren't overthinking it; you've correctly identified that **accountability looks different depending on whether the debt is financial or behavioral.**
