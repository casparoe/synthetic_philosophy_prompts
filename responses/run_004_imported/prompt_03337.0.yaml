answer: |-
  This is a sophisticated narrative problem that cuts to the heart of metaphysical debates about properties and powers. Your philosopher friend is referencing a debate stemming from the work of C.B. Martin and David Lewis in the 1990s, which challenged the **Simple Conditional Analysis (SCA)** of dispositions.

  To help you defend the integrity of your protagonist, here is the precise distinction between the two concepts, why they preserve the reality of the trait, and which one applies to your novel.

  ### 1. The Simple Conditional Analysis (SCA)
  To understand the exceptions, we must first define the rule they break. The SCA proposes that to have a disposition is simply to satisfy a conditional statement:
  *   *Object $x$ is disposed to manifest $M$ in response to stimulus $S$ **if and only if** if $x$ were subjected to $S$, $x$ would manifest $M$.*

  In your case: *The protagonist is courageous **if and only if** if she were faced with danger, she would act courageously.*

  The problem arises when the disposition exists, but the conditional ("If S, then M") turns out false. Your friend is pointing out that your character represents a case where the disposition is real, but the manifestation is absent. Metaphysics offers two explanations for this: Masking and Finkishness.

  ### 2. Masked Dispositions
  A **masked disposition** occurs when an object possesses the intrinsic categorical basis for a disposition, but an **extrinsic interfering factor** prevents the manifestation *even when the stimulus occurs*.

  *   **The Mechanism:** The disposition remains intact throughout the process. The failure to manifest is due to something external blocking the causal chain.
  *   **Classic Example:** A fragile glass is wrapped in bubble wrap. It retains the molecular structure of fragility (intrinsic). If struck (stimulus), it does not break (no manifestation). The bubble wrap is the mask.
  *   **Why the disposition is genuine:** The intrinsic property (the molecular lattice) is unchanged. If you removed the bubble wrap, the glass would break. The disposition was always there; it was just prevented from expressing itself.

  ### 3. Finkish Dispositions
  A **finkish disposition** is more radical. It occurs when the **stimulus itself causes the disposition to vanish** just before the manifestation can occur.

  *   **The Mechanism:** The arrival of the stimulus triggers a change in the object's intrinsic properties, removing the disposition before it can produce the effect.
  *   **Classic Example:** A "finkish" fragile glass is guarded by a wizard. The moment the glass is struck (stimulus), the wizard instantly casts a spell to make the glass non-fragile (removes disposition) before it has time to shatter. The conditional "If struck, it would break" is false, yet intuitively, the glass *was* fragile before the strike.
  *   **Why the disposition is genuine:** The object possessed the categorical basis *prior* to the stimulus. The loss of the disposition is a causal consequence of the stimulus, not evidence that the disposition was absent to begin with.

  ### 4. Why Neither Implies the Disposition is Absent
  In both cases, philosophers argue that the disposition is real because dispositions are grounded in **categorical bases** (intrinsic physical or psychological structures), not just in what actually happens.

  *   **For the Mask:** The basis exists; the output is blocked.
  *   **For the Fink:** The basis exists *at the time of attribution*; it is lost only *during* the test.

  In both scenarios, saying the object "lacks the disposition" is a mistake because it ignores the intrinsic state of the object in favor of the extrinsic outcome. This is the shield your philosopher friend is handing you: **Manifestation is not a necessary condition for the existence of a disposition.**

  ### 5. Which Fits Your Protagonist?
  Between the two, your protagonist is a case of a **Masked Disposition** (or, more precisely, a disposition prevented from manifesting by extrinsic circumstances), and definitely **not Finkish**.

  **Why it is not Finkish:**
  For your character to be finkishly courageous, the *arrival of danger* would have to instantly strip her of her courage. If the plot involved her remaining brave until the exact moment a threat appeared, at which point her psychology instantly shifted to cowardice (perhaps due to a subconscious trigger), that would be finkish. Since you intend her courage to be stable and enduring, "finkish" is the wrong term.

  **Why it is (analogously) Masked:**
  In your novel, the "Narrative Accidents" function exactly like the bubble wrap around the glass.
  *   **The Intrinsic Basis:** Her psychological makeup (values, temperament, training) is courageous.
  *   **The Stimulus:** Dangerous situations.
  *   **The Mask:** The plot contrivances that remove or neutralize the danger before it requires a courageous act.

  Strictly speaking, in metaphysics, a mask usually operates *during* the stimulus (the glass is struck but doesn't break). In your case, the stimulus is being prevented from fully materializing (the danger is averted before action is needed). However, the logical function is identical to masking: **The extrinsic environment is interfering with the manifestation of an intrinsic power.**

  ### 6. Recommendation for Your Draft
  You can confidently assert that your protagonist possesses a **genuine, unmanifested disposition.**

  If you need to discuss this with your philosopher friend or use it to guide your writing, here is the precise stance:
  1.  **Reject the SCA:** Do not accept that "She is courageous" means "She *does* courageous things." It means "She *is built* to do courageous things."
  2.  **Identify the Mask:** Treat the "narrative accidents" as the masking factor. They are extrinsic blockers.
  3.  **Establish the Categorical Basis:** To ensure the reader believes the disposition is genuine (and not just a claim), you must show the **intrinsic basis** even if you cannot show the **manifestation**.
      *   *Narrative Strategy:* Show her internal deliberations, her training, her values, or her reactions to *minor* stimuli that parallel courage (e.g., social courage, or preparing for danger that never comes). This proves the "molecular structure" of her courage exists, even if the "glass" is never struck.

  **Verdict:** Your character has a **masked disposition**. The courage is real because the intrinsic psychological basis is present; the lack of action is due to extrinsic narrative interference, not a lack of the trait itself.
