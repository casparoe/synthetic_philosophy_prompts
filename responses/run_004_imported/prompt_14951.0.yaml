answer: |-
  **UNIVERSITY ATHLETIC CONFERENCE**
  **THERAPEUTIC USE EXEMPTION (TUE) COMMITTEE**

  **CASE ID:** 24-TUE-089
  **DATE:** October 14, 2023
  **SUBJECT:** Application for Stimulant Medication (Amphetamine Salts)
  **SPORT:** Track & Field (Middle Distance)
  **DECISION:** **DENIED**

  ### I. SUMMARY OF APPLICATION
  The applicant, a varsity middle-distance runner, seeks a Therapeutic Use Exemption (TUE) to use a banned stimulant medication (prescription amphetamine) during the upcoming Conference Championships. The application is supported by a letter of prescription from a licensed psychiatrist following a clinical consultation three weeks prior to the meet. The Committee notes that the diagnostic process consisted of a single forty-minute interview, rather than the neuropsychological testing battery recommended by Conference Policy 4.2.B due to time constraints cited by the provider.

  ### II. ANALYSIS AGAINST POLICY CRITERIA
  Conference Policy requires the satisfaction of three distinct criteria for a TUE to be granted. The Committee finds the application fails to satisfy the second criterion, with significant concerns regarding the first.

  **1. Significant Health Problem Without Treatment**
  While the Committee does not dispute the applicant's reported struggles with focus or the professional judgment of her provider, the deviation from standard diagnostic protocol introduces uncertainty. Policy 4.2.B explicitly recommends comprehensive testing to rule out situational stressors (e.g., end-of-semester academic pressure) that may mimic ADHD symptoms. While we acknowledge the time sensitivity, the lack of longitudinal data or objective testing makes it difficult to confirm the *severity* of the condition relative to the high-stakes context of championship competition.

  **2. No Performance Enhancement Beyond Normal Baseline**
  This is the determinative factor in this decision. Policy stipulates that the treatment must not enhance performance beyond what would be expected by a return to a "normal health baseline."
  *   **Pharmacological Evidence:** Amphetamines are well-documented to improve reaction time, vigilance, and fatigue resistance in neurotypical individuals, not solely those with ADHD.
  *   **Performance Data:** The applicant's coach has submitted training logs indicating a marked improvement in split times and recovery metrics since the initiation of medication three weeks ago. While improved focus may contribute to better training adherence, the magnitude of the physiological improvement aligns with known ergogenic effects of stimulants in healthy populations.
  *   **Conclusion:** Because the diagnosis rests on a limited dataset, the Committee cannot definitively distinguish between a *therapeutic restoration* of baseline function and a *pharmacological enhancement* of existing function. In cases of ambiguity regarding performance enhancement, the policy mandates the preservation of competitive integrity.

  **3. No Permitted Alternative**
  The application does not contain documentation demonstrating that non-stimulant alternatives (e.g., atomoxetine, behavioral therapy) were tried and failed, or are clinically contraindicated. Given the short timeline before competition, this criterion is difficult to satisfy retroactively.

  ### III. CONSIDERATION OF COMPETING INTERESTS
  The Committee is aware that a denial imposes a significant burden on the student-athlete. We have seriously engaged with the strongest argument presented in favor of granting this exemption: **The Primacy of Medical Authority and Student Welfare.**

  **The Argument for Approval:**
  Proponents of the application argue that a licensed medical professional has determined this medication is necessary for the athlete's health. To deny the TUE is to effectively force the athlete to choose between their medical treatment and their athletic participation. This argument posits that the TUE panel is not a medical board and should not second-guess a prescribing physician's judgment regarding a patient's mental health. Withholding medication could lead to academic deterioration, increased anxiety, and a genuine decline in the student's overall well-being, which contradicts the university's mission to support the "student" aspect of student-athlete.

  **The Committee's Rebuttal:**
  While we accept that the athlete's health is paramount, the TUE mechanism is not designed to adjudicate general medical necessity, but rather *competitive eligibility*. The Committee acknowledges the athlete may legitimately require this medication for daily life and academic success. However, the Conference Championships represent a specific, high-stakes environment where the rules of fair play apply distinctly from the classroom.

  Granting an exemption when there is objective evidence of performance enhancement (the coach's timing data) and subjective uncertainty regarding the diagnosis (the limited interview) would compromise the integrity of the competition for all other athletes. The policy is designed to ensure that no athlete competes with a chemical advantage, regardless of the medical origin of that advantage. To grant the exemption based solely on the prescription, while ignoring the performance data, would set a precedent that medical documentation overrides evidence of physiological enhancement. This would render the anti-doping policy unenforceable for any stimulant medication.

  Therefore, the Committee distinguishes between the *right to treatment* and the *privilege of competition*. The athlete is not prohibited from taking her medication for daily life and academic purposes (subject to NCAA out-of-competition rules); she is prohibited from competing under its influence until the therapeutic baseline can be verified without ambiguity.

  ### IV. RULING AND NEXT STEPS
  **The application for a Therapeutic Use Exemption for the Conference Championships is DENIED.**

  This decision is not a finding of intentional doping, nor is it a permanent ban on the medication. It is a determination that the current evidence does not meet the strict burden of proof required to waive the prohibition on performance-enhancing substances during competition.

  **Path to Reconsideration:**
  The athlete is encouraged to re-apply for a TUE for the subsequent competitive season. To support a future application, the Committee recommends:
  1.  Completion of the full neuropsychological testing battery recommended by Policy 4.2.B.
  2.  Documentation of a trial period using non-stimulant alternatives.
  3.  Submission of performance data over a longer period to establish a stable baseline independent of medication initiation timing.

  **Appeal:**
  The athlete has the right to appeal this decision to the Conference Ethics Board within 48 hours of receipt of this letter.

  **Signed,**

  *Dr. Elena Rostova, Chair*
  *University Athletic Conference TUE Committee*
