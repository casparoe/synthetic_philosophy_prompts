answer: |-
  **Leo (Taurekian):** The choice is stark. Left rock, one person. Right rock, five. You can't reach both. You say we must save the five. I say we flip a coin.

  **Sarah (Scanlonian):** A coin flip? You'd give the single survivor a fifty percent chance and condemn the five to a fifty percent risk of death? That isn't neutrality, Leo. That's disregarding the claims of the four extra people.

  **Leo:** It's respecting the claim of the *one*. You treat the five as a single bloc of "greater value." But there is no super-person. There are only individuals. To the one on the left, his death is the worst thing that can happen to him. The fact that others are dying on the right doesn't make his death worse for him.

  **Sarah:** We aren't saying his death is worse. We're saying the *principle* guiding the rescue must be justifiable to everyone. Imagine you are one of the five. Can you reasonably reject a principle that says, "When claims are equal, flip a coin between the groups"? Yes. You'd say, "Why should my life be gambled away when you could have saved me at no greater cost to the one?"

  **Leo:** "No greater cost"? The cost to the one is his life. That is the total cost to him. You're smuggling in aggregation by the back door. If the one's claim isn't stronger than any single member of the five, why does the presence of the others tip the scale?

  **Sarah:** Because it's not about tipping the scale of *weight*, it's about breaking a tie. Each individual claim is of equal strength. One life for one life is a standoff. But once that standoff is acknowledged, the existence of a second, third, and fourth claimant provides a reason to act that isn't present in the single case. It's not summing welfare; it's acknowledging that there are more reasons to save the group, not that the group's welfare is a bigger heap.

  **Leo:** That is semantic gymnastics. If the presence of the second person changes the outcome from "flip" to "save," you have admitted that two claims outweigh one. You've started counting. And if you count two, why not sum the utility? You're on the utilitarian slope.

  **Sarah:** I'm not summing. Utilitarianism says the *badness* of five deaths is greater than one. I'm saying that a principle allowing the rescue of the five cannot be reasonably rejected by the one, whereas a principle mandating a coin flip *can* be reasonably rejected by the five. The mechanics aren't about math; they're about justification. If I flip the coin and the five die, I have to tell four people, "You died so that this one person could have a 50% chance." What justification holds there?

  **Leo:** The justification of equality. If I save the five automatically, I tell the one, "You died because you were outnumbered." I made you a means to maximize survival. With a coin flip, I tell the one, "Your claim was not overridden by a greater sum; you simply lost a fair lottery." You ask what I tell the four who die? I tell them, "Your claims were not ignored. They were weighed equally against a peer, and chance decided."

  **Sarah:** But chance doesn't decide equally. A coin flip between *groups* gives the one person a 50% chance of survival, but each member of the five only a 25% chance if you split the group's probability. You're privileging the singleton.

  **Leo:** Because the singleton faces the loss alone. You want to merge the five into a collective to dilute his standing.

  **Sarah:** I'm not merging them. I'm asking what rule we could live with. If we accept your coin flip, we accept a rule where the majority can be sacrificed to give a minority a disproportionate chance of survival. That is not a contract equals could agree to. The tie-breaking mechanism isn't aggregation; it's the only way to respect the equal strength of every individual claim without arbitrarily privileging the one.

  **Leo:** And I say the only way to respect the separateness of persons is to admit that "more people" is not a moral force. You haven't explained how counting heads avoids summing badness. You've just given it a different name: "tie-breaking."

  **Sarah:** And you haven't explained how a 50/50 gamble respects the five any more than it respects the one. You protect the one from being outnumbered, but you expose the five to being ignored. We can't avoid loss, Leo. We can only choose the loss that is least unreasonable to justify.

  **Leo:** Then we are at the impasse. You see a tie to be broken. I see a boundary that cannot be crossed.

  **Sarah:** Then let's hope the rescuer knows which side of the line they stand on before they reach the rocks.
