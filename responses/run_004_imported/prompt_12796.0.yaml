answer: |-
  Thank you all for being here.

  Looking out at this room, I see the different circles of my mother's life. I see my father and my aunt, who have walked beside her for decades. I see her friends from the book club, her coworkers, the neighbors who knew her as the woman who brought over extra zucchini in the summer and remembered your birthday.

  For some of you, the story of my mother's life begins with her marriage, or her first job, or when I was born. For others, the story begins much earlier, on a sunny afternoon forty-seven years ago. I've been struggling with how to talk about that afternoon today. Not because it's a secret that needs keeping, but because it's a pain that doesn't fit easily into words.

  When my mother was a young woman, her younger brother died. He was three years old. He wandered out through a backyard gate that my mother had forgotten to latch. She was inside the house. He drowned in a neighbor's pool. It took only a few minutes.

  For the rest of her life, my mother carried the belief that she had killed him.

  I am telling you this not to shock anyone, but because you cannot truly know who she was without knowing what she carried. She never hid the fact that she had lost a brother. But she did hide the weight of the stone she kept in her pocket every day for forty-seven years. She believed that if she had just turned her wrist, just clicked that latch, he would be alive. And in the strictest sense, she was right. That small action, or lack of it, was part of the chain of things that led to that afternoon.

  But as I've prepared to stand here, I've found myself stuck on the rest of that chain. The neighbors' pool had no fence. The phone rang at that exact moment. A three-year-old boy was curious and quick. A hundred other things had to line up for that tragedy to happen. None of us ever blamed the neighbors. None of us blamed the phone. We blamed her. And more importantly, she blamed herself.

  I've talked to friends and counselors who tell me to call it "bad luck" or "an accident." They say she wasn't solely responsible. Logically, I know that. But standing here, looking at the life she lived after that day, I've come to think that maybe trying to argue her out of her guilt is missing the point.

  She didn't carry that guilt because she was bad at math or logic. She carried it because she loved him.

  In a world that often tries to minimize responsibility, my mother refused to look away from the cost of being human. She accepted that our smallest actions can have the biggest consequences. She accepted that we are not as in control as we think we are, and yet, we are still responsible for the care we owe each other. She took that burden onto herself so that no one else would have to carry it, and so that she would never forget the value of a moment.

  That afternoon defined her, but it did not confine her.

  If you only knew her from her book club, you knew a woman who was deeply present. When she listened to you, she wasn't thinking about her phone call or her to-do list. She was with you. I think that came from knowing how quickly a moment can slip away.

  If you knew her as a mother, you knew she was careful, yes. But more than that, you knew she was fierce. She loved us with a kind of urgency that came from knowing how fragile things are. She didn't love us *despite* what happened to her brother; in a way, she loved us *because* of it. She poured all that care, all that vigilance, into the rest of her life. She turned her grief into a kind of guardianship over everyone she loved.

  To my father, my aunt, and those who have known this story from the start: thank you for carrying this with her. Thank you for not letting her carry it entirely alone, even when she insisted she was the only one who could.

  To those who are hearing this for the first time: I hope you don't feel that this changes who she was. It doesn't. It only deepens it. It explains the quiet moments when she would look at a playground and go still. It explains why she hugged a little tighter than necessary. It explains the gravity she brought to kindness.

  I don't want to offer her a hollow acquittal today. I don't want to stand here and say, "It wasn't your fault," as if those words would have mattered to her. She wouldn't have believed me. And maybe, in her own way, she didn't want to be absolved. She wanted to honor him. She wanted to acknowledge that his life mattered enough to weigh heavy on her own.

  So, I am not going to tell you that the gate didn't matter. It did. Actions matter. Choices matter. We are our brother's keepers, and she took that commandment seriously.

  But I am going to tell you that the gate was not the end of the story. The story is what she did with the forty-seven years that followed. The story is the meals she cooked, the books she read, the way she taught me to notice when someone was hurting, the way she built a family that loved her enough to gather here today.

  The gate was a moment of human imperfection. Her life was a testament to human love.

  Mom, you carried the weight of that afternoon for a long time. You checked the locks. You watched the water. You kept the memory of a little boy alive in your heart every single day. You did your penance. You did your loving.

  You can put the weight down now. The gate is closed. The boy is safe. And you are free to rest.

  Thank you.
