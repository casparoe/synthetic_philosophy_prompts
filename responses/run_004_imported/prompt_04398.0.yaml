answer: |-
  This is a classic debate in decision theory. Your friend is arguing for the **Cartesian Boundary** (the agent is separate from the world), while you are arguing for **Embeddedness** (the agent is a subsystem of the world).

  The strongest concrete example to shut down the "just add a self-model" argument is the **5-and-10 Problem** (specifically the variant involving **Spurious Counterfactuals**).

  This scenario demonstrates that having a *better* self-model can actually make a standard expected-utility agent perform *worse*, leading it to leave free money on the table. It shows that the breakdown isn't about prediction accuracy; it's about the logic of counterfactuals when the decider is part of the system.

  ### The Scenario: The 5-and-10 Game

  **The Setup:**
  You are an agent (a computer program). You face two buttons:
  *   **Button A:** Pays you **$5**.
  *   **Button B:** Pays you **$10**.

  There are no predictors, no demons, no other agents. Just you and the buttons. Obviously, you should press Button B.

  **The Agent's Architecture:**
  To make a decision, your agent runs an internal algorithm:
  1.  It looks at its **Self-Model** (a simulation of its own code).
  2.  It searches for proofs/statements about the consequences of its actions (e.g., "If I press A, I get $5").
  3.  It calculates the Expected Utility (EU) for each action based on these statements.
  4.  It picks the action with the highest EU.

  ### 1. The Cartesian View (Your Friend's Take)
  A Cartesian agent assumes it stands outside the environment. It treats its own action as a "free variable" that isn't determined until it chooses.
  *   **Reasoning:** "If I press A, I get $5. If I press B, I get $10. $10 > $5."
  *   **Result:** Presses B.
  *   **Friend's Claim:** "See? Standard decision theory works. The self-model just confirms the physics of the buttons."

  ### 2. The Embedded View (The Breakdown)
  An embedded agent knows it is **part of the environment**. It knows its own source code is a deterministic function. If it has a "good enough self-model" (as your friend suggests), it can simulate itself.

  Here is where standard decision theory breaks:

  **Step 1: The Self-Model Predicts the Action**
  Because the agent is deterministic and has a good self-model, before it even acts, it can prove (or assign probability 1 to) the fact: **"I will press Button A."**
  *(Note: It might prove this simply because it finds a reason to do so, or due to logical quirks in how it searches for proofs.)*

  **Step 2: The Counterfactual Crash**
  Now the agent tries to evaluate Button B. It asks: *"What happens if I press Button B?"*
  But the agent *knows* (from Step 1) that **"I will press Button A"** is True.
  Therefore, **"I press Button B"** is **False**.

  In classical logic and standard probability theory, **conditioning on a known falsehood is undefined or explosive.**
  *   **Logic:** From a contradiction, anything follows (*Ex Falso Quodlibet*). If "I press B" is false, the agent can technically prove "If I press B, the universe explodes" just as easily as "If I press B, I get $10."
  *   **Probability:** If $P(\text{Press B}) = 0$, then calculating $E[\text{Utility} | \text{Press B}]$ involves dividing by zero.

  **Step 3: The Spurious Proof**
  If the agent is using proof-based decision theory (a common formalization for AI), it might find a "spurious proof" first.
  1.  The agent finds a proof that "I will press A."
  2.  It then evaluates the counterfactual: "If I press B..."
  3.  Since "I press B" contradicts "I will press A," the logic system allows it to infer *anything*. It might accidentally prove: "If I press B, I get -$1,000,000."
  4.  **Comparison:**
      *   EU(Press A) = $5
      *   EU(Press B) = -$1,000,000 (Spurious)
  5.  **Decision:** The rational agent **presses Button A** and takes $5.

  ### Why "Just Add a Self-Model" Doesn't Fix It

  Your friend's argument is that a better self-model solves the problem. In this scenario, **the self-model is the problem.**

  1.  **Knowledge Kills Counterfactuals:** To reason about "What if I did otherwise?", you must be ignorant of what you *will* do. An embedded agent with a perfect self-model *cannot* be ignorant of its own output. It removes the freedom required for standard Expected Utility calculations.
  2.  **You Can't "Wall Off" the Self:** Your friend might say, "Just don't let the agent model itself." But an embedded agent *needs* self-knowledge to navigate the world (e.g., "I am too heavy for that bridge," "I am the type of agent that keeps promises"). You cannot cleanly separate "self-model" from "world-model" when the self is in the world.
  3.  **Determinism is Physical:** Your friend might say, "Add random noise so $P(\text{Action}) \neq 0$." But real agents (brains, computers) are effectively deterministic. Relying on "fake noise" is an ad-hoc fix that admits the standard theory doesn't work on the actual hardware.

  ### The Takeaway for Your Friend

  The **5-and-10 Problem** shows that **standard decision theory assumes the agent's action is independent of its prior state.**

  *   **Cartesian Agent:** "I choose $A$. The world responds." (Action is a root cause).
  *   **Embedded Agent:** "My code outputs $A$. The world responds." (Action is a logical fact).

  When the agent treats its own action as a **logical fact** (which it must, if it is embedded and has a self-model), standard counterfactual reasoning ("If I did otherwise...") becomes mathematically undefined or logically explosive.

  **The concrete punchline:**
  > "If you give a standard expected-utility agent a perfect self-model, it can prove its own action before taking it. Once it knows its own action, it can no longer logically evaluate the alternative without running into contradictions. This causes it to potentially reject $10 in favor of $5, not because it's stupid, but because **standard decision theory has no way to handle counterfactuals about known facts.** Embedded agency requires a new theory of counterfactuals (like Functional Decision Theory), not just a bigger hypothesis space."

  This moves the debate from "Can we model the world?" to "How do we reason about things we know are impossible?" which is the core of the embedded agency problem.
