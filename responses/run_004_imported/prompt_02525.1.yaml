          3.  If the analogy breaks, what would a *non-pragmatic* hinge look like in engineering terms, or does it just not map?
      *   **Tone:** Intellectual, conversational, respectful of both philosophy and engineering rigor. Avoids condescension.

  2.  **Deconstruct the Philosophical Core (Wittgenstein's *On Certainty*):**
