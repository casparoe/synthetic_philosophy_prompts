  10. **Self-Correction during drafting:** I initially thought about suggesting "Logic gates" as hinges. But that's too physical. W is about language/games. So "Specification" or "Threat Model" is better. The Threat Model assumes certain things about the adversary (e.g., "they don't have physical access"). If you doubt that, the model dissolves. That's a hinge. TCB is the *implementation* of the trust. Threat Model is the *grammar* of the security.

      *Wait, let's look closer at §343.* "It is not that we *cannot* investigate..." It's that investigating *presupposes* the hinge.
      *Engineering equivalent:* You cannot run a vulnerability scan without assuming the scanner itself isn't compromised. But that's still TCB.
      *Better:* You cannot define "Vulnerability" without assuming a "Correct State." The definition of "Correct State" is the hinge. You don't prove the system *should* do X; you assert it.
      *Actually, the "Threat Model" is the strongest candidate.* A threat model defines what counts as an attack. If you change the threat model, the "security" changes. You don't prove the threat model; you adopt it.

      *Let's go with the "Threat Model / Specification" angle.* It distinguishes the *rules of the game* (Hinge) from the *pieces we trust* (TCB).

