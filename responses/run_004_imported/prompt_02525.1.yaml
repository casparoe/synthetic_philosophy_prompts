      *   *Validation:* Start by validating their reading. They caught the exact tension (§343) that trips up most readers. That's a good sign.
      *   *The "Smuggling" Charge:* Confirm their suspicion. Yes, TCB is pragmatic/epistemic. Hinges are grammatical/ontological. TCB = "We stop here because it's hard." Hinge = "Doubting here makes the game unplayable."
      *   *The "Cliché" Check:* It's a known analogy but usually superficial. Digging into the *failure* of the analogy is where the value lies.
      *   *Reframing the Analogy:* How to save it?
          *   Don't map Hinge -> TCB.
          *   Map Hinge -> *Protocol Semantics* or *Axioms of the Model*.
          *   Example: "Time is linear" in a consensus algorithm. If you doubt that, Raft/Paxos doesn't just become hard to verify; it becomes nonsensical.
