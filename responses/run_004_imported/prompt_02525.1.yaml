      *   **River-bed (96-99):** Hinges can shift, but slowly and as part of a "form of life," not by deliberate optimization.
      *   **Foundationalism:** W is *anti*-foundationalist in the Cartesian sense. Hinges aren't the *bottom* of a pyramid of justification; they are the *axis* around which justification rotates.

  3.  **Deconstruct the Engineering Core (Trusted Computing Base):**
      *   **TCB:** The set of all hardware, firmware, and software components that are critical to a system's security.
      *   **Nature:** It *is* pragmatic. We trust the CPU because verifying the transistor physics is too hard/expensive, not because it's logically impossible to doubt.
      *   **Minimization:** We actively try to shrink the TCB (e.g., microkernels, formal verification).
      *   **Verification:** We *can* verify lower layers (seL4), pushing the trust boundary.

  4.  **Evaluate the Analogy (The "Match"):**
