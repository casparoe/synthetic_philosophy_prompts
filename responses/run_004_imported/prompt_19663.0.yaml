    "S": ["Epistemicism"],
    "A": ["Contextualism"],
    "B": ["Paraconsistent or Subvaluationist"],
    "C": ["Degree-Theoretic or Fuzzy Approaches"],
    "D": ["Supervaluationism"]
  }
  ```
