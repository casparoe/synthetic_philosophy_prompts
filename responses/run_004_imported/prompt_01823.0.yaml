      *   *The Extended Church-Turing Thesis:* This is the specific concept they need to know. The original CTT says "computable." The *Extended* version says "efficiently computable." Quantum computing challenges the *Extended* version.
      *   *Shor's Algorithm:* It's not about doing the impossible. It's about breaking encryption. If factoring takes 10,000 years classically but 1 day quantumly, that's a paradigm shift, not a gimmick.
