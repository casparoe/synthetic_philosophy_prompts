prompt: |-
  I'm a PhD student working on Harlem Renaissance aesthetic debates, and I've run up against a passage in Du Bois's "Criteria of Negro Art" (delivered as an address to the NAACP in 1926 and published that October in The Crisis) that I can't fully reconstruct logically. Everyone cites the closing line that "all Art is propaganda," but I'm interested in the argument that is supposed to deliver that conclusion:

  "Thus it is the bounden duty of black America to begin this great work of the creation of Beauty, of the preservation of Beauty, of the realization of Beauty, and we must use in this work all the methods that men have used before. And what have been the tools of the artist in times gone by? First of all, he has used the Truth—not for the sake of truth, not as a scientist seeking truth, but as one upon whom Truth eternally thrusts itself as the highest handmaid of imagination, as the one great vehicle of universal understanding. Again artists have used Goodness—goodness in all its aspects of justice, honor and right—not for sake of an ethical sanction but as the one true method of gaining sympathy and human interest.

  The apostle of Beauty thus becomes the apostle of Truth and Right not by choice but by inner and outer compulsion. Free he is but his freedom is ever bounded by Truth and Justice; and slavery only dogs him when he is denied the right to tell the Truth or recognize an ideal of Justice.

  Thus all Art is propaganda and ever must be, despite the wailing of the purists."

  What I can't reconstruct is the inference itself. The premises look like historical or psychological claims: artists have, as a matter of fact, found truth and justice useful as instruments for imaginative and sympathetic effect. From this Du Bois concludes that the artist's freedom just is bounded by truth and justice, and then that art simply is, and "ever must be," propaganda. A few paragraphs earlier, though, he had been more careful, granting that perfect Beauty might in some ideal sense stand above Truth and Right, and that it is only "here and now and in the world in which I work" that the three are "unseparated and inseparable" for him. Is the later, unqualified claim actually consistent with that earlier hedge, or does Du Bois quietly shift from a historically specific claim about the situation of black art under Jim Crow to a universal claim about the nature of art as such? And is "propaganda" doing one job or two here—naming the fact that art inevitably expresses some vision of truth and justice, versus the much stronger claim that art ought to be deliberately harnessed to a political cause? I'd appreciate help walking through the actual steps of the argument rather than just glossing the aphorism it ends on.
