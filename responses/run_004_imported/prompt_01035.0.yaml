answer: |-
  This is an excellent question that cuts to the heart of Du Bois's aesthetic philosophy. You are right to identify a tension between the phenomenological description of what artists *do* (use Truth and Goodness as tools) and the ontological declaration of what art *is* (propaganda). The logical bridge is often elided in secondary literature because the aphorism is so catchy, but reconstructing it reveals that Du Bois is making a sophisticated move regarding the sociology of knowledge, not just a moral plea.

  To reconstruct the inference, we have to recover the 1926 semantic field of "propaganda" and understand how Du Bois links *aesthetic efficacy* to *social function*. Here is a reconstruction of the argument's steps, followed by an analysis of the consistency issues you raised.

  ### 1. Reconstructing the Syllogism

  The argument in the passage you quoted relies on a specific definition of "propaganda" that differs from the post-WWII connotation of "deceptive manipulation." For Du Bois, propaganda is closer to its etymological root (*propagare*): the active propagation of a faith, doctrine, or worldview.

  Here is the logical chain Du Bois constructs in this section:

  *   **Premise 1 (The Toolset):** Art achieves its effect (Beauty/Imagination/Sympathy) only by employing specific materials: Truth (understanding) and Goodness (justice/values).
  *   **Premise 2 (The Inevitability of Perspective):** One cannot employ Truth and Goodness neutrally. To select *which* Truth to show or *which* Goodness to honor is to take a stance. As Du Bois notes, the artist uses Truth "not as a scientist... but as one upon whom Truth eternally thrusts itself." This implies a subjective, positioned reception of reality.
  *   **Premise 3 (The Social Function):** Art is a communicative act intended to gain "sympathy and human interest." To gain sympathy for a specific view of Truth/Goodness is to persuade an audience of the validity of that view.
  *   **Intermediate Conclusion:** Therefore, all Art functions to persuade an audience of a specific worldview (a specific configuration of Truth and Goodness).
  *   **Definition:** Let "Propaganda" = The deliberate or inevitable propagation of a specific worldview to gain sympathy/interest.
  *   **Final Conclusion:** Therefore, all Art is propaganda.

  **The Logical Leap:** The move from "Art uses Truth/Goodness" to "Art is Propaganda" hinges entirely on the claim that **aesthetic selection is inherently political.** Du Bois argues that because the artist must choose *which* truths to render (especially in a racially stratified society), the act of creation is an act of advocacy.

  ### 2. Addressing the "Hedge": Ideal vs. Sociological Reality

  You note that earlier in the essay, Du Bois grants that Beauty *might* ideally stand above Truth and Right, but claims they are "unseparated and inseparable" for him "here and now." You ask if the closing universal claim ("All Art is propaganda and ever must be") contradicts this hedge.

  It is consistent, provided we read Du Bois as making a **sociological universal** rather than a **metaphysical universal.**

  *   **The Hedge (Metaphysical):** In a vacuum, perhaps Beauty could exist without moral or factual content. Du Bois concedes this theoretical possibility to show he understands the "Art for Art's Sake" argument (Locke's position).
  *   **The Conclusion (Sociological):** However, art is not created in a vacuum; it is created by humans in history. Du Bois's claim "ever must be" refers to the condition of *human* art, not *angelic* art. Because humans are social beings embedded in power structures, their expression of Beauty will always validate some social order (Truth/Justice) and invalidate another.

  When Du Bois says "All Art is propaganda," he is implicitly arguing that **white art is also propaganda.** This is the crucial, often overlooked step. White art propagates the "Truth" of white humanity and the "Goodness" of the status quo. It does not *feel* like propaganda to the dominant class because it aligns with their received reality. Black art *feels* like propaganda to critics because it challenges the received reality.

  Thus, the "universal" claim is consistent with the "specific" hedge: The separation of Beauty from Truth is a luxury of the dominant class. For the oppressed (and Du Bois argues, ultimately for all humans engaged in social communication), the separation is impossible.

  ### 3. Specific vs. Universal: Is there a Shift?

  There is a shift, but it is a shift in **scope of application**, not a logical contradiction.

  1.  **Phase 1 (Black Art):** Du Bois begins by arguing that *Black* artists have a duty to use art for racial uplift because the world denies Black humanity. Here, the propaganda is conscious and corrective.
  2.  **Phase 2 (All Art):** He expands the argument to claim that *all* artists are in the same position, though they may not realize it. The Black artist is simply more *conscious* of the propagandistic nature of art because their survival depends on it.

  The inference works like this:
  *   If Black Art must be propaganda to secure recognition...
  *   And if White Art *already functions* as propaganda to maintain recognition...
  *   Then Art *as such* is a mechanism of social validation (propaganda).

  Du Bois is universalizing the *condition* of the Black artist to reveal the hidden condition of *all* artists. He is arguing that the "purists" (who claim Art is not propaganda) are deluded about the social function of their own work.

  ### 4. Is "Propaganda" Doing One Job or Two?

  You ask if "propaganda" names an inevitability (descriptive) or an obligation (normative). The text suggests it is doing **both**, linked by a concept of **freedom.**

  Look closely at this sentence: *"Free he is but his freedom is ever bounded by Truth and Justice; and slavery only dogs him when he is denied the right to tell the Truth or recognize an ideal of Justice."*

  *   **Descriptive Job:** Art *is* propaganda because it is bounded by Truth/Justice. You cannot escape having a perspective.
  *   **Normative Job:** Art *ought* to be conscious propaganda. The "slavery" Du Bois mentions is not the fact that art is propaganda, but the fact that an artist might be *denied the right* to tell their Truth.

  Therefore, the command "All Art... ever must be [propaganda]" is a call for **consciousness.**
  *   **Unconscious Propaganda:** Art that claims to be "pure" but implicitly reinforces the status quo (Du Bois's critique of the Purists).
  *   **Conscious Propaganda:** Art that acknowledges its role in shaping human sympathy and deliberately advocates for Justice (Du Bois's prescription for Negro Art).

  The "must" is not a constraint on the *nature* of art (which is already propaganda), but a constraint on the *conscience* of the artist. You *are* a propagandist; you *must* choose what you propagate.

  ### 5. Summary of the Logical Reconstruction

  To summarize the inference you found difficult to reconstruct:

  1.  **Premise:** Art requires Truth and Goodness to generate Beauty/Sympathy.
  2.  **Premise:** In a stratified society, "Truth" and "Goodness" are contested terrains (e.g., Is the Negro human? Is segregation Just?).
  3.  **Inference:** Therefore, any artistic representation of Black life takes a side in this contest, whether the artist intends to or not.
  4.  **Definition:** Taking a side in a contest for human sympathy is "propaganda."
  5.  **Conclusion 1 (Descriptive):** Therefore, all Art is propaganda (even the art that claims neutrality is propagating the status quo).
  6.  **Conclusion 2 (Normative):** Therefore, Black artists should consciously wield this propaganda to correct the lies of racism, rather than pretending to a neutrality that does not exist.

  ### Scholarly Context for Your Dissertation

  Since you are working on aesthetic debates, you might find it useful to reference how scholars have handled this specific logical tension:

  *   **David Levering Lewis:** In *W.E.B. Du Bois: The Fight for Equality and the American Century*, he suggests Du Bois was strategically essentializing Black experience to counter Locke's cosmopolitanism. The "universal" claim is a rhetorical fortification for the specific political need.
  *   **Adolph Reed Jr.:** In *W.E.B. Du Bois and American Political Thought*, he critiques Du Bois's "propaganda" stance as potentially limiting artistic freedom, arguing Du Bois conflates *social function* with *aesthetic essence*. This aligns with your suspicion of the logical leap.
  *   **Brent Hayes Edwards:** In *The Practice of Diaspora*, he looks at how "propaganda" was an internationalist term in the 1920s, linking Du Bois to Comintern debates. This helps contextualize the "universal" claim as part of a global leftist aesthetic discourse, not just a local NAACP directive.
  *   **Tommie Shelby:** In *Dark Ghettos*, he revisits Du Bois's propaganda argument to argue for a "pragmatic" defense of cultural nationalism, which might help you frame the "normative" vs "descriptive" tension.

  **Final Verdict on the Text:** Du Bois is not shifting inconsistently; he is moving from a **phenomenology of creation** (what the artist experiences) to a **sociology of reception** (what the art does in the world). The "hedge" acknowledges the former (ideally, Beauty is free); the "conclusion" asserts the latter (actually, Art is functional). The logic holds if you accept Du Bois's premise that art is fundamentally a mode of social communication, not private expression.
