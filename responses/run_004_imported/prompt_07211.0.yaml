answer: |-
  **Title:** Beyond the Shrug: A Defense of the Self-Indication Assumption
  **Course:** Formal Epistemology Seminar
  **Topic:** Anthropic Reasoning and the Doomsday Argument

  The current stalemate in anthropic reasoning is epistemically expensive. We have two dominant frameworks: the Self-Sampling Assumption (SSA), which yields the Doomsday Argument but founders on the reference class problem; and the Self-Indication Assumption (SIA), which neutralizes Doomsday but invites the Presumptuous Philosopher. Faced with these respective monsters, the standard academic reflex is to catalogue the trade-offs and retreat to agnosticism. This essay rejects that retreat. I argue that the Self-Indication Assumption is the superior updating rule. While the Presumptuous Philosopher scenario is counterintuitive, it represents a manageable edge case in cosmological speculation. By contrast, the Doomsday Argument entailed by SSA constitutes a systematic, a priori veto on empirical optimism about the future of intelligence. Between a philosopher who is too confident in large cosmologies and a framework that predicts imminent extinction regardless of technological progress, the latter is the far costlier bullet to bite.

  To see why SSA must be rejected, we must look past the Doomsday Argument's conclusion and examine its mechanism. SSA instructs us to reason as if we are a random sample from the set of all *actual* observers in our reference class. The fatal flaw here is not merely the existential pessimism it generates, but the reference class dependency that renders the reasoning unstable. If my reference class is "all humans," the Doomsday Argument holds. If it is "all conscious beings," "all observer-moments," or "all beings capable of understanding the Doomsday Argument," the probability shifts drastically. SSA provides no principled metric for delineating this class. Consequently, SSA allows the conclusion of a probabilistic argument to hinge on a sociological or metaphysical definition that is external to the evidence at hand.

  More damningly, SSA treats your birth rank as evidence that swamps physical data regarding our capacity for survival. Under SSA, even if we develop interstellar colonization, fusion energy, and biological resilience, the fact that I am roughly the 100-billionth human remains strong evidence that there will not be a 100-trillionth human. This implies that indexical information (my birth order) consistently overrides non-indexical physical evidence (our technological trajectory). This is an untenable hierarchy of evidence. It suggests that the mere fact of my existence now allows me to predict the failure of future physics and engineering without looking at a single datum regarding those fields. SSA effectively mandates a form of solipsistic pessimism where the structure of the universe is constrained by the requirement that I be a "typical" observer, rather than the universe existing independently and me finding myself within it.

  SIA avoids this by shifting the sampling domain from *actual* observers to *possible* observers. It states that you should reason as if you are a random draw from all possible observers, which boosts hypotheses that entail more observers in proportion to the number of observers they entail. This cancels the Doomsday shift: a hypothesis with a trillion future humans is a trillion times more likely to contain *me* specifically than a hypothesis with only a billion future humans.

  The standard objection, of course, is the Presumptuous Philosopher. In Bostrom's thought experiment, two cosmological theories are empirically equivalent, but T2 implies a trillion times more observers than T1. SIA dictates that we should believe T2 is a trillion times more likely, seemingly allowing philosophy to overturn physics. Critics argue this is absurd; no amount of armchair reasoning should decide between physical theories.

  However, this objection relies on a misleadingly sterile setup. The Presumptuous Philosopher scenario only arises when physical evidence is *exactly* equal between two theories. In any real-world scientific context, physical evidence is never perfectly balanced. If T2 implies a trillion times more observers, it likely implies different physical constants, energy densities, or structural properties that would be detectable. SIA does not say "ignore physics"; it says "update on physics, then update on observer count." If the physical evidence favors T1 even slightly, that evidence will usually swamp the anthropic boost for T2. The Presumptuous Philosopher only wins in the limit where physics falls silent.

  Is it really so costly to admit that, in the absence of physical evidence, we should favor universes that are more populous? Consider the alternative. If we reject SIA to avoid the Presumptuous Philosopher, we must accept SSA. Accepting SSA means accepting that, in the absence of other evidence, we should favor universes with *fewer* observers (to keep our birth rank typical). This is the Doomsday Argument generalized. It is arguably more presumptuous to assume the universe is constrained to be small enough to make me typical than to assume it is large enough to make my existence probable. The "presumption" of the philosopher is an optimism about the size of reality; the "presumption" of the Doomsday proponent is a pessimism about the longevity of intelligence. Given the history of scientific progress, betting on abundance is a safer epistemic wager than betting on scarcity.

  Furthermore, SIA demonstrates superior coherence in related decision-theoretic contexts, most notably the Sleeping Beauty problem. In that scenario, SSA aligns with the "Halfer" position, while SIA aligns with the "Thirder" position. The Thirder position is generally robust because it aligns with betting behavior: if Beauty bets on "Tails" every time she wakes, she wins money in the long run. The Halfer position requires a disconnect between credence and rational betting odds. Since SIA naturally supports the Thirder view, it integrates more smoothly with standard decision theory. SSA requires additional, ad-hoc machinery to reconcile credence with action.

  There is, admittedly, a need for precision. A raw SIA can lead to the "Infinite Observer" problem, where any theory with infinite observers gets equal probability. However, this is a technical limitation of handling infinities in measure theory, not a conceptual flaw in the indication assumption itself. Solutions such as Full Non-indexical Conditioning (FNC)—which conditions on all available evidence, including the specific details of one's existence, rather than just "I exist"—retain the benefits of SIA while mitigating the Presumptuous Philosopher by making the specific evidence of *being me* much harder to satisfy in vast, chaotic universes. FNC essentially argues that while large universes have more observers, they don't necessarily have more observers *exactly like me* in proportion to their size, depending on the variance of observer types. This offers a principled way to keep SIA's anti-Doomsday benefits without granting the Presumptuous Philosopher carte blanche.

  In conclusion, the choice between SSA and SIA is not a choice between two equal evils. It is a choice between a framework that systematically undervalues the future of intelligence (SSA) and one that occasionally overvalues large cosmologies in evidence-poor environments (SIA). The Doomsday Argument is not merely a gloomy prediction; it is an epistemological error that privileges indexical luck over physical causality. The Presumptuous Philosopher is a curiosity, but one that operates only at the boundaries of empirical inquiry. We should accept SIA, perhaps refined by FNC, and accept the consequence: we are not evidence that the end is near. We are simply evidence that existence is possible. That is a bullet worth biting.
