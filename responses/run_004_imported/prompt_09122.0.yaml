prompt: |-
  I sit on the board of a mid-sized foundation that funds global-health work, and I'm now facing a live version of a question I've only ever debated on Overcoming Bias and LessWrong. Our executive director wants to settle next year's strategic bet -- bed-net scale-up versus pandemic-preparedness advocacy -- by defining a combined welfare metric (DALYs averted per dollar plus a grantee-capacity index), running conditional prediction markets among staff and trustees on each option, and pre-committing to fund whichever one the market prices higher once trading settles. Half the board is enthusiastic; the other half warns that advocacy's payoff is inherently harder to price, so its market will stay thin and never really get tested -- meaning we'd be dressing up a foregone conclusion as a forecast, with the further risk that a donor leak makes this look like a miniature 2003 DARPA "terrorism futures" episode. Draft the memo I'll circulate before the December board meeting: recommend adopt, reject, or adopt with modifications, with a concrete timeline, and engage the thin-market objection on its own terms rather than just invoking Hanson's standard rebuttal that manipulation is usually self-defeating.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a mid-sized global-health foundation.
      *   **Audience:** Fellow board members and the Executive Director (ED).
      *   **Context:** The ED proposes using conditional prediction markets to decide between two strategic bets: bed-net scale-up vs. pandemic-preparedness advocacy.
      *   **Metric:** Combined welfare metric (DALYs/$ + grantee-capacity index).
      *   **Conflict:** Half the board is enthusiastic; half is skeptical (thin markets for advocacy, risk of looking like DARPA terrorism futures).
      *   **Task:** Draft a memo for the December board meeting.
      *   **Recommendation:** Adopt, Reject, or Adopt with Modifications.
      *   **Requirements:** Concrete timeline, engage the "thin-market" objection on its own terms (not just citing Robin Hanson), address the PR risk (DARPA comparison).

  2.  **Deconstruct the Proposal & Objections:**
      *   *Proposal:* Use prediction markets to allocate funding between two very different interventions (tangible vs. intangible).
      *   *Metric:* DALYs/$ is standard for bed nets. Grantee-capacity index is vague/subjective. Combining them is tricky.
      *   *Objection 1 (Thin Markets):* Advocacy outcomes are hard to define and verify. Markets need liquidity and clear resolution criteria. If traders think the market is rigged or unresolvable, they won't trade, and the price won't reflect information.
      *   *Objection 2 (PR Risk):* "Betting on pandemics" sounds like profiting from death/suffering. The 2003 DARPA Policy Analysis Market (PAM) scandal is the canonical example.
      *   *Constraint:* Don't just say "Hanson says manipulation is hard." Address *why* the market might be thin for advocacy specifically.

  3.  **Determine the Recommendation:**
      *   *Reject?* Too dismissive of innovation. The ED is trying to be rational.
      *   *Adopt?* Too risky given the PR and metric issues.
      *   *Adopt with Modifications?* This is the sweet spot. It validates the ED's intent (rational decision-making) while mitigating the specific risks identified by the skeptical board members. It allows for a pilot approach.

  4.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Executive Summary:** State the recommendation clearly (Adopt with Modifications).
      *   **Context:** Acknowledge the ED's goal (epistemic humility, better allocation).
      *   **Analysis of the Proposal:**
          *   *Strengths:* Incentivizes information gathering, reduces groupthink.
          *   *Weaknesses:* Metric commensurability (DALYs vs. Capacity), Resolution risk (Advocacy is fuzzy), PR risk (DARPA).
      *   **Addressing the Thin-Market Objection:** This is crucial. I need to explain *why* advocacy markets fail (lack of verifiable resolution) and how to fix it (proxy metrics, longer timelines, internal-only).
      *   **Addressing the PR Risk:** Distinguish from DARPA (internal vs. external, non-profit vs. defense).
      *   **Modified Plan (The "How-To"):**
          *   Phase 1: Metric refinement.
          *   Phase 2: Internal pilot (no real money yet, or play money).
          *   Phase 3: Decision rule (market as input, not sole dictator).
      *   **Timeline:** Concrete dates leading to December and beyond.
      *   **Conclusion:** Call to action.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the metric "DALYs + Capacity" resolvable?
      *   *Fix:* Suggest decoupling them. Bed nets = DALYs. Advocacy = Specific Policy Milestones. Don't mix them into one token unless the conversion rate is fixed *ex-ante*.
      *   *Critique:* Is the DARPA comparison valid?
      *   *Fix:* Yes, visually it looks bad. "Betting on pandemics" is a headline nightmare. Recommendation must emphasize *internal* markets only, no public leakage.
      *   *Critique:* The prompt asks to engage the thin-market objection on its own terms.
      *   *Fix:* Explicitly discuss liquidity, informed traders, and resolution criteria. If advocacy success is "pass a bill," that's binary and tradable. If it's "increase capacity," that's subjective and kills market confidence.
      *   *Tone:* Professional, diplomatic, intellectually rigorous (fitting a LessWrong/Overcoming Bias alum), but pragmatic for a board setting.

  6.  **Final Polish:**
      *   Ensure the timeline is realistic for a December meeting.
      *   Make sure the recommendation is actionable.
      *   Check that I haven't just waved a hand at Hanson. (I will explicitly mention that liquidity matters more than manipulation risks in this specific context).

  7.  **Final Output Structure:**
      *   To/From/Date/Subject.
      *   Recommendation.
      *   Strategic Rationale.
      *   Addressing Key Risks (Thin Markets, PR).
      *   Proposed Modifications.
      *   Implementation Timeline.
      *   Closing.

  *(Self-Correction on Timeline)*: The meeting is in December. The memo needs to be circulated *before* the meeting. So the timeline should cover pre-meeting prep, the meeting decision, and post-meeting execution.

  *(Self-Correction on Metric)*: The prompt says "DALYs averted per dollar plus a grantee-capacity index." This is a composite. I should argue that composite metrics are hard to resolve. Better to have separate markets or a clear conversion formula. I will recommend separating the markets to ensure resolution clarity.

  *(Self-Correction on Thin Markets)*: The skeptical board members say advocacy markets will be thin. Why? Because informed traders (experts in advocacy) might not be on staff/trustees. I need to suggest expanding the trader pool or using a "decision market" structure where the payout is conditional on the decision *and* the outcome. Actually, keeping it simple: If the resolution criteria are vague, traders won't bet. I will propose specific, verifiable milestones for the advocacy arm.

