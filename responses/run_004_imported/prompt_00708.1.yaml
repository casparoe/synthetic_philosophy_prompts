  *(Self-Correction during drafting)*: I need to be careful not to say Morgan *solved* the problem. He clarified the logic. The hard work is still in defining "independent evidence." I should emphasize that the 1903 revision turns LMC into a rule about *evidential weight* rather than *metaphysical probability*.

