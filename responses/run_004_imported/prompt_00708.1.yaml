      *   Highlight that the 1903 version actually *saves* the canon from behaviorism. If taken strictly (1894), it leads to denying mind altogether. The 1903 version allows mind but requires proof.
      *   Address the "question-begging" charge: It's not begging the question *if* the independent evidence is non-behavioral (e.g., neural). If the independent evidence is just *other behaviors*, it risks circularity unless those behaviors are less ambiguous.
      *   *Crucial Point:* The canon is about *rival hypotheses for a specific behavior*. It says: "Do not jump to H for Behavior 1 if L explains Behavior 1, unless you have proof of H from Source 2."

