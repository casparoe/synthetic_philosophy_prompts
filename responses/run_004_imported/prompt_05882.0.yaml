answer: |-
  This is a fantastic observation. You have essentially stumbled upon one of the core concepts of political philosophy and applied it to personal psychology. The short answer is: **Yes, this is almost exactly the same problem your professor is talking about.**

  In political philosophy, what you and your friend enacted is often called a **"Ulysses Pact"** (or pre-commitment strategy), named after the Greek hero who had his crew tie him to the mast so he could hear the Sirens' song without jumping ship.

  Here is a breakdown of why your situation mirrors the constitutional debate, and why your friend was likely right to hold the line.

  ### 1. The Analogy: Constitutions vs. The "Blocking Deal"

  Your professor described constitutions as protecting the rules from the "passions of the present." In your scenario:
  *   **The Constitution** = The agreement you made with your friend while sober and rational.
  *   **The Temporary Majority** = You, when you are sad, drunk, or lonely.
  *   **The Amendment Process** = Asking your friend to unblock the number.
  *   **The Supermajority Requirement** = Your instruction that *no reason* would be good enough.

  The logic in both cases is identical: **Time-Inconsistency.**
  Political philosophers (like James Madison in *Federalist No. 10*) argue that people make different decisions when they are calm versus when they are agitated. A constitution assumes that "Past You" (who wrote the rules) knows better than "Present You" (who wants to break them).

  In your case, "Sober You" knew that "Drunk/Sad You" is a liar. "Sober You" knew that "Drunk/Sad You" would convince yourself that texting the ex is "just to ask about a hoodie" when it's actually to seek validation. By making the rule hard to amend (impossible, in fact), you protected your long-term well-being from your short-term impulses.

  ### 2. Was Your Friend Right?

  **Yes.** Here is the philosophical justification for why her refusal was the only correct move, based on the agreement you made.

  **The Epistemic Problem (The Knowledge Problem)**
  The core issue is that you cannot trust your own judgment in the moment. When you told her, "I need to pick up my stuff, that's a practical reason," your brain was telling you the truth. But the problem is that the *same* brain circuitry is used to rationalize emotional texting.
  If your friend had said, "Okay, that sounds practical," she would have had to become a judge of your internal state. She would have to decide: *Is he actually being practical, or is he being clever?*
  By refusing to judge the *content* of your request and only looking at the *rule*, she removed the possibility of manipulation. If she makes an exception for "practical stuff," next time you'll say, "I just need to ask him a practical question about his mom." The barrier dissolves.

  **Rule Utilitarianism**
  In ethics, there is a debate between *Act Utilitarianism* (do what creates the most good in this specific moment) and *Rule Utilitarianism* (follow the rule that creates the most good generally).
  *   **Act:** Unblocking you for 10 minutes to coordinate pickup causes minimal harm and saves you hassle.
  *   **Rule:** Maintaining a strict "no contact" boundary ensures you heal faster and don't relapse into emotional turmoil.
  Your friend prioritized the Rule over the Act. She understood that the *integrity of the barrier* is more valuable than the *convenience of the moment.*

  **The "Safety Valve" Existed**
  Crucially, the system worked. You needed your stuff; the rule blocked direct contact; you found an alternative channel (the mutual friend).
  In constitutional terms, this is like a bill being vetoed, so Congress finds a different way to pass the law. The goal (getting the stuff) was achieved without violating the principle (no direct contact). If you had been able to unblock him, you would have achieved the goal, but you would have weakened the constitution for next time.

  ### 3. Where the Analogy Gets Tricky (The "Rigidity" Trap)

  You asked if a rule like that is "a bad way to run your life since it can never respond to a real exception." This is the classic critique of constitutional rigidity.

  If a constitution is *too* hard to amend, it can break under pressure (e.g., leading to revolution because there's no legal way to fix a problem). In your personal life, if you had a **medical emergency** involving your ex, this rule would be dangerous.

  However, there is a key difference between a Nation and a Person in recovery:
  *   **Nations** need flexibility to adapt to changing technologies and social norms.
  *   **Addiction/Heartbreak** usually requires absolute abstinence to heal.

  In the context of breaking an emotional attachment, "exceptions" are rarely benign. They are usually the wedge that cracks the dam. Your friend treated your request like a "temporary passion" even though you felt it was rational, because she knows that **the feeling of rationality is often the first symptom of the relapse.**

  ### 4. Why You Were Annoyed (And Why That's Good)

  You felt annoyed because your "Present Self" felt restricted. But in political philosophy, **frustration is the feature, not the bug.**

  If the amendment process were easy, the constitution wouldn't protect you from the passions of the moment. If your friend had said, "Well, I guess this one time is okay," she would have validated the idea that the rules are negotiable. Next time you're drunk at 2 AM, you won't think, "I can't text him, my friend won't let me." You'll think, "I can text him, I just need to come up with a 'practical' reason like last time."

  Her refusal kept the cost of breaking the rule high.

  ### Conclusion

  Your friend did the right thing. She acted as a faithful guardian of the "constitution" you wrote together. She understood that **you delegated your authority to her specifically because you knew you couldn't trust yourself.**

  If she starts evaluating your reasons, she's no longer a guardian; she's an enabler. The annoyance you feel is the same annoyance a citizen feels when they can't pass a law they really want *right now*. But that friction is what prevents the system from collapsing when things get tough.

  You can tell your professor you found a real-world example of **Federalist No. 10** in action: You structured your personal life to defeat the "mischiefs of faction" (your own bad impulses) by making the rules harder to change than your impulses are strong.
