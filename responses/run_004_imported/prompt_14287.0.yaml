answer: |-
  This is a genuinely profound connection to make. Most people read the Embedded Agency sequence and stop at the abstract math; applying the **Löbian Obstacle** and **Robust Delegation** problems to human akrasia and precommitment is a high-fidelity analogy.

  However, because you are diving into MIRI's specific framing, we need to be precise about where the analogy holds and where it breaks. Humans are not formal logical systems proving theorems about their own source code. We are bounded, biological agents with leaky boundaries and shifting utility functions.

  Here is an analysis of the implications of the Embedded Agency framing for your commitment devices, broken down by the specific theoretical obstacles.

  ### 1. The Löbian Obstacle as "Rationalized Akrasia"
  **The Theory:** In the Tiling Agents problem, an agent $A$ wants to construct a successor $A'$ that it can trust to pursue $A$'s goals. Löb's theorem implies $A$ cannot prove $A'$ will be trustworthy unless $A$ assumes a proof system stronger than its own. You cannot bootstrap self-trust from nothing.

  **The Human Translation:** Present-You ($A$) wants Future-You ($A'$) to execute a task. Future-You has access to the same brain and reasoning capabilities as Present-You. If Present-You cannot trust Future-You now, **Future-You will have the exact same reasons to distrust Future-Future-You.**

  If your commitment device relies on Future-You *choosing* to honor a promise made by Present-You, it will fail. Why? Because when the moment comes, Future-You will run the same cost-benefit analysis Present-You did, but with higher immediate discounting (hyperbolic discounting). Future-You will simply "prove" to themselves that breaking the commitment is actually the rational choice this one time.

  **Implication for Expectations:**
  *   **Expect Failure on "Soft" Commitments:** If the commitment device requires Future-You to voluntarily opt-in at the moment of action (e.g., "I promise myself I won't eat this"), expect it to fail. That is trying to solve the Löbian obstacle with the same reasoning engine that created the problem.
  *   **Trust is Binary, not Gradual:** In formal systems, you either have the proof or you don't. In humans, this translates to: either the choice is removed, or it isn't. Do not expect "increased friction" to be enough if the reasoning engine can justify overcoming the friction.

  ### 2. Embeddedness and "Hackability"
  **The Theory:** Embedded agents are part of their environment. They can be modified by the environment, and they can modify the tools they use. There is no clean Cartesian boundary between the agent and the commitment device.

  **The Human Translation:** You are not separate from your phone blocker. You are the admin. You are the one with the physical access to the router. You are the one who can beg your partner for mercy.

  In the Tiling Agents framework, this is the problem of **corrigibility** and **instrumental convergence**. Your "sub-agent" (the impulse to scroll) will try to disable the supervisor (the blocker). Since you are embedded, *you* are both the supervisor and the sub-agent at different times.

  **Implication for Design:**
  *   **Increase the Cost of Hacking:** The commitment device must be more "embedded" in reality than your whims. A software blocker is easily hacked by a determined you. A physical lockbox is harder. Giving money to a friend who is instructed *not* to listen to your pleas is harder still.
  *   **Delegate to Non-Rational Systems:** Since your reasoning engine is the source of the untrustworthiness (it can rationalize anything), delegate enforcement to systems that do not reason. Beeminder works well because the credit card charge is an automatic script, not a negotiation. The system doesn't care about your "proof" that you deserve a break.

  ### 3. Value Drift (The Tiling Problem)
  **The Theory:** A major worry in Robust Delegation is that the successor agent might modify its own utility function to make the goal easier to achieve (wireheading), or simply drift due to noise.

  **The Human Translation:** Future-You is not just weaker-willed; **Future-You might have different values.** When you are tired, hungry, or stressed, your utility function literally changes. The "You" that set the commitment valued health/work. The "You" encountering the temptation values comfort/dopamine.

  **Implication for Expectations:**
  *   **Don't Trust Future Judgment:** You cannot leave "escape hatches" that rely on Future-You's judgment (e.g., "I can turn off the blocker if it's an emergency"). Future-You will redefine "emergency" to include "I'm bored."
  *   **Lock Values, Not Just Actions:** The most robust devices lock in the *meta-preference*. For example, instead of "I will write 1000 words," the commitment is "I will sit in this chair with internet disconnected for 60 minutes." This accommodates the fact that Future-You might not want to write, but respects Present-You's desire for the *opportunity* to write.

  ### 4. Designing for Robust Delegation
  Given the Löbian and Embedded constraints, here is how you should design commitment devices:

  #### A. The Ulysses Contract (Hard Precommitment)
  In the Embedded Agency frame, you are acknowledging that you cannot trust your future reasoning process. Therefore, you must constrain the action space, not just the reward function.
  *   **Bad Design:** "If I scroll, I pay $10." (Future-You can reason that $10 is worth the dopamine).
  *   **Good Design:** "The phone is physically locked in a safe at my partner's house." (Future-You cannot access the phone even if they reason it's worth it).

  #### B. Costly Signaling / Burning the Ships
  To solve the trust bootstrap, you need an external anchor.
  *   **Social Collateral:** Tell people you will fail if you don't do it. The "proof" of your commitment is the social shame, which is an external variable your internal reasoning can't easily delete.
  *   **Financial Collateral:** Beeminder works because it converts "willpower" into "money." You can rationalize breaking a habit; it is harder to rationalize burning $500 for no reason.

  #### C. Allow for "Safe" Updates (Corrigibility)
  In AI safety, we want an agent to allow itself to be turned off or modified if it's going off the rails. In humans, rigid commitment devices can break catastrophically (e.g., you lock your keys in the car and miss a family emergency).
  *   **Design:** Build in escape hatches that are **expensive and slow**, not impossible.
  *   **Example:** You can uninstall the website blocker, but it requires a 24-hour waiting period before it takes effect. This prevents impulse decisions (high discount rate) but allows planned changes (low discount rate).

  #### D. Monitor the Channel (Observability)
  Embedded agents need to know how their actions affect the world. Often, we fail because we lose track of our own state.
  *   **Design:** Automate the tracking. Don't ask Future-You "Did you work?" Ask "What does the RescueTime log say?" Externalize the observation so Present-You and Future-You are looking at the same data, reducing the room for gaslighting yourself.

  ### Summary of Implications

  1.  **Lower Expectations of "Willpower":** The Löbian obstacle suggests you cannot reason your way out of a reasoning defect. Stop trying to convince Future-You. Start constraining Future-You.
  2.  **Externalize the Trust:** Since you cannot trust your own internal proof system, import trust from outside (money, partners, physical locks). The "proof" of commitment must exist outside the cognitive system that is prone to akrasia.
  3.  **Assume Value Drift:** Design devices assuming Future-You is a slightly hostile agent with different priorities. Make the path of least resistance align with Present-You's goals.
  4.  **Embrace the "Obstacle":** The fact that this is hard is a feature, not a bug. If the commitment device were easy to override, it wouldn't solve the Löbian problem. The friction *is* the security protocol.

  The deepest lesson from Embedded Agency here is **humility**. You are not a Cartesian ghost piloting a meat suit. You are a process running on hardware that is susceptible to modification, noise, and self-deception. Treat your future self like a separate agent you need to manage, not a subordinate you can order around.
