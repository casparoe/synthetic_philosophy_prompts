      *   **Ockhamist (named after William of Ockham):**
          *   Core idea: There is one actual future path, even if we don't know it.
          *   Truth condition: A statement is true if it matches what happens on the *actual* future branch.
          *   Result: Bivalence holds. "There will be a sea battle" is either true or false right now.
