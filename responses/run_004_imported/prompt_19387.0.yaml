      *   Epistemic objection addressed? Yes (Excuse/Justification distinction).
      *   No easy outs? Yes.

  6.  **Final Polish:** (Writing the dialogue with attention to voice and philosophical precision.) *Self-correction: Ensure the distinction between 'liability' and 'permission' is clear in Marcus's voice.* *Ensure Elena emphasizes the 'symmetry of risk'.*

