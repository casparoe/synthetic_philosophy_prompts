answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two philosophy professors, Elena (Traditionalist) and Marcus (Revisionist), are finishing a debate that started in the faculty lounge.*

  **Elena:** Let's ground this. We're talking about Hans. He's twenty years old, conscripted into an army that invaded a neighbor without provocation. He didn't choose this. He's been told by his government that the invasion is a preemptive strike against a looming threat—a lie, but he has no way to know that. He's in a trench. An enemy soldier charges. Hans shoots him to save his own life. *Jus in bello* is satisfied: no civilians, no torture, uniform worn. My claim is simple: Hans has done nothing morally wrong.

  **Marcus:** I disagree. Hans has committed a wrongful act. It might be understandable, even excusable, but it is not *permissible*. The enemy soldier is defending his home against an unjust aggression. He is morally innocent in the relevant sense. Hans is part of an unjust threat. In ordinary morality, if I mistakenly believe you are about to kill me, and I kill you in "self-defense," I haven't acted permissibly just because I was scared. I've harmed someone who had a right not to be harmed.

  **Elena:** But war isn't ordinary morality. That's the whole point of Walzer's position. When two soldiers face each other, they enter a specific moral relationship defined by mutual threat. The moment they put on the uniform, they become legitimate targets. That status is symmetrical. If you deny that symmetry, you're asking Hans to make a geopolitical judgment in the split second before he pulls the trigger.

  **Marcus:** I'm not asking him to make a judgment in that split second. I'm making a claim about the *truth* of the situation, not Hans's mental state. There is a difference between being *excused* and being *justified*. A justification means you did the right thing. An excuse means you did the wrong thing, but we aren't going to punish you for it because you couldn't have known better. My view is that Hans is excused, but not justified. The enemy soldier, however, *is* justified. That asymmetry matters.

  **Elena:** Why does it matter if Hans can't access it? If the deep moral reality is invisible to the agent, does it actually exist? You're positing a moral fact that makes no difference to the practical reasoning of the person involved. If Hans is "excused," he's not liable to punishment. If he's not liable to punishment, in what sense is he a wrongdoer? It seems like you're inventing a sin that doesn't function like a sin.

  **Marcus:** It matters because it changes how we view the enemy soldier. On your view, the enemy soldier who kills Hans is doing the exact same moral thing as Hans who kills him. It's a wash. On my view, the enemy soldier is vindicating rights, and Hans is violating them, albeit non-culpably. If we treat them as moral equals, we obscure the fundamental injustice of the war itself. We turn the war into a sporting match where the only thing that matters is following the rules of the game, ignoring that one team is playing to enslave the other.

  **Elena:** But that's exactly what protects soldiers! If you tell Hans, "You are objectively a wrongdoer," you undermine the very constraint you want to uphold. The Laws of War work because they tell soldiers: "If you fight by the rules, you are safe from prosecution and moral condemnation, regardless of the cause." If you introduce a moral hierarchy where one side is "guilty" of fighting simply by fighting, you incentivize that side to abandon the rules. If I'm already a criminal for being here, why shouldn't I kill prisoners? Why shouldn't I use human shields? I have nothing left to lose morally.

  **Marcus:** That's a pragmatic argument, Elena. I accept it as a reason for *legal* conventions. We should write the Laws of War to reflect Moral Equality of Combatants because it reduces suffering. But we shouldn't confuse the *convention* with the *morality*. Just because we *should* treat Hans as equal in court doesn't mean he *is* equal in the eyes of moral truth. McMahan's point is that we need to keep these distinct. We can have a practical code that says "follow orders" while acknowledging that some orders are fundamentally unjust.

  **Elena:** You can't keep them that distinct. Morality is action-guiding. If a soldier believes your theory—that he is fighting unjustly even if he follows the rules—he faces a crisis of conscience that paralyzes him. But here is the harder objection: How does Hans know? You say he's excused because he can't know the war is unjust. But where is the line? If the war is *obviously* unjust—say, a genocidal war of extermination—is Hans still excused?

  **Marcus:** No. At a certain point, the injustice becomes manifest. If Hans is ordered to shoot infants, he is not excused. He has a duty to disobey. So there *is* an epistemic threshold.

  **Elena:** Exactly. And who sets that threshold? Most aggressive wars aren't Nazi Germany 1944. They're murky. "We are securing our borders," "We are protecting ethnic minorities," "We are preempting a threat." Both sides claim self-defense. If you tell Hans he is morally liable to be killed because his cause is unjust, you are forcing him to be a judge of international law. And if he gets it wrong, according to you, he's a killer. That burden is too heavy. It makes the morality of killing in war depend on facts that are often classified, debated by historians for decades, and obscured by propaganda.

  **Marcus:** I'm not saying he's liable to be killed in the sense that it's *easy* to kill him. I'm saying he lacks the *right* to kill the defender. Look, let's use your epistemic worry. If Hans truly cannot know, he is not *blameworthy*. I grant you that. But blameworthiness isn't the only moral category. Consider a driver who hits a pedestrian. The pedestrian jumps out in front of the car. The driver couldn't have seen them. The driver is not blameworthy. But did the driver have a *right* to hit the pedestrian? No. The pedestrian had a right not to be hit. The driver was merely excused. We need to preserve the victim's status. The defending soldier is the victim of aggression, even if he is armed.

  **Elena:** But the defending soldier isn't a pedestrian. He's a combatant. He's trying to kill Hans. This is the "mutual threat" argument. By entering the battlefield, the defending soldier has also made himself a threat. He has waived his right not to be killed, just as Hans has. They are engaged in a consensual practice of violence, regulated by the state. The morality comes from the *relationship* between them, not the *cause* of the war. If I break into your house to kill you, and you shoot me in self-defense, you are justified. But if I break in because I mistakenly think you kidnapped my daughter, and you shoot me... well, it's messy. But in war, the state authorizes the violence. The soldier is an instrument.

  **Marcus:** The "instrument" view is dangerous. It absolves individuals of too much responsibility. Soldiers aren't bullets; they are moral agents. If the state sends you to rob a bank, and you go wearing a uniform, you are still robbing a bank. The uniform doesn't magic away the injustice. The reason the defending soldier is permitted to kill Hans is that Hans is an *unjust threat*. The reason Hans is not permitted to kill the defender is that the defender is a *just threat*. You can't just wave that away by saying "they are both soldiers."

  **Elena:** Let's push the epistemic point harder. You say Hans is excused if he doesn't know. But suppose Hans *does* suspect. Suppose he thinks, "This war feels wrong." But if he refuses to fight, he goes to military prison, his family loses their pension, maybe he's executed for desertion. He is under duress. On your view, does the duress make the killing permissible?

  **Marcus:** Duress is an excuse, not a justification. It mitigates blame. It doesn't make the act right.

  **Elena:** But if the act isn't right, then the enemy soldier who kills Hans is preventing a wrong. But if Hans is under duress, he's barely an agent. Here is the consequence of your view: If Hans is an unjust threat, he is "liable" to be killed. That means the enemy soldier doesn't even need to exercise proportionality or necessity in the same way. If Hans is liable because he's fighting for the wrong side, he's lost his right to life. That makes war *more* brutal, not less. It turns the enemy into a target that doesn't need to be respected as a moral equal.

  **Marcus:** That's a misreading. Liability doesn't mean "kill him however you want." The defending soldier still has to follow *jus in bello*. He can't shoot Hans if Hans is surrendering. He can't use excessive force. Liability just means Hans cannot complain that his right to life was violated *by necessary defensive force*. It shifts the moral burden. It acknowledges that the tragedy of war falls disproportionately on those who are fighting for the wrong side, because they are the ones being stopped.

  **Elena:** But they don't know they are on the wrong side! That's the loop I can't get you out of. You're building a moral theory that relies on objective facts about *jus ad bellum* (the justice of the war) that are inaccessible to the people who have to act on them. A moral theory that demands impossible knowledge is a bad moral theory. Walzer's genius was realizing that we need a "moral reality" that soldiers can actually live inside. Inside that reality, they are equals. That equality allows them to look each other in the eye after the war. If we adopt your view, we tell the losers of every war, "You were all murderers, just excused ones." That makes reconciliation impossible.

  **Marcus:** Reconciliation requires truth, not just comfort. If we tell the losers they were moral equals, we lie to them about the nature of the conflict. We tell them the aggression was just a "dispute." Sometimes, one side is simply wrong. Acknowledging that Hans acted impermissibly—even if we don't punish him—is necessary to honor the soldier he killed. The defender died protecting his community from an unjust threat. Hans died posing one. To say they are morally identical insults the defender's sacrifice.

  **Elena:** And to tell Hans he was a wrongdoer insults his humanity by ignoring the coercion and ignorance he lived under. It creates a class of people who are "guilty but unpunished." That's a toxic place for a society to live.

  **Marcus:** Perhaps. But isn't it more toxic to say that a soldier fighting to defend his homeland from invasion is doing the exact same moral thing as the invader? That flattens the moral landscape so much that "justice" disappears from the battlefield entirely. It becomes pure mechanics.

  **Elena:** It doesn't disappear. It just shifts. The *leaders* bear the burden of *jus ad bellum*. The *soldiers* bear the burden of *jus in bello*. That division of labor is the only way to keep war from becoming total extermination. If soldiers start judging the cause, they become partisans, and the constraints on *how* they fight evaporate.

  **Marcus:** I think we might have to agree that there is a tension here between the "deep morality" of individual liability and the "practical morality" of international conventions. I'm arguing for the deep morality. You're arguing for the convention.

  **Elena:** I'm arguing that the convention *creates* the morality for the soldiers. There is no "deep" layer for them. Their moral world is defined by the uniform and the rules of engagement.

  **Marcus:** And I'm arguing that the uniform doesn't absolve you of the fundamental duty not to harm the innocent. The defender is innocent. Hans is not. No amount of convention changes that fact, even if we decide to treat Hans gently because of it.

  **Elena:** Then we're at an impasse. You want the truth, even if it's unusable. I want the rule, even if it's a fiction.

  **Marcus:** Maybe. Or maybe I want the truth so we stop treating war like a game, and you want the rule so soldiers don't break under the weight of the truth.

  **Elena:** Precisely. And until we figure out how to make the truth knowable to a conscript in a trench, I'm sticking with the fiction. It keeps more people alive.

  **Marcus:** And I'll stick with the truth. Because without it, we lose the ability to say that some wars—and some deaths—matter more than others.

  *(They sit in silence for a moment, the weight of the hypothetical conscript, Hans, hanging between them.)*
