answer: |-
  You are asking one of the classic questions in the philosophy of biology, and your confusion is entirely warranted. It stems from a specific historical moment in Karl Popper's thinking that is often taught without the necessary context of how he later revised his views.

  To answer your core question directly: **No, by Popper's own mature standards, evolutionary biology does not share the same epistemic footing as astrology.**

  Here is how you reconcile Popper's early critique with your professor's confidence, broken down into four key points.

  ### 1. Popper Changed His Mind
  The most important fact often omitted in introductory seminars is that **Popper recanted his early criticism.**

  In the 1950s and 60s, Popper did indeed describe Darwinism as a "metaphysical research programme." However, in 1978, he explicitly revised this position. In a lecture titled *Natural Selection and the Emergence of Mind*, he stated:

  > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

  Popper came to realize that while the *phrase* "survival of the fittest" can be linguistically circular, the **theory of natural selection** makes specific, testable claims about heredity, variation, and environmental pressure. Therefore, in his later view, evolutionary theory **is** empirical science, distinct from pseudoscience like astrology.

  ### 2. The "Tautology" Charge is Biologically Flawed
  The claim that "survival of the fittest" is a tautology rests on a specific definition of fitness.
  *   **The Tautological Reading:** Who survives? The fittest. Who are the fittest? Those who survive. (This is circular).
  *   **The Biological Reading:** Fitness is not defined *by* survival; it is defined by **propensities based on specific traits.**

  Biologists define fitness as the expected reproductive success of an organism possessing specific heritable traits in a specific environment. This allows for independent measurement. We can measure a trait (e.g., beak depth), measure the environment (e.g., seed hardness), and predict reproductive success *before* the survival happens.

  If a bird with a deep beak survives better than one with a shallow beak during a drought, that is a testable causal claim. If, in the next generation, the environment changes and shallow beaks are favored, the theory predicts a shift in the population. Because the theory can be proven wrong (e.g., if deep-beaked birds died *more* often during the drought without an explanatory variable), it is falsifiable.

  ### 3. Evolution vs. Astrology: The Falsifiability Test
  Popper used astrology as his paradigm case of pseudoscience because astrologers could interpret *any* planetary alignment to fit *any* outcome after the fact (ad-hoc modification), but could not make risky predictions beforehand.

  Evolutionary biology differs fundamentally:
  *   **Risky Predictions:** Evolutionary theory predicts we will not find mammal fossils in Precambrian strata (the "Precambrian Rabbit" test). If we found a human fossil alongside a trilobite, the theory would be falsified.
  *   **Genetic Constraints:** It predicts specific patterns of genetic relatedness (e.g., humans share more DNA with chimps than with mice). If genomic sequencing showed humans were genetically closer to fungi than primates, the theory would collapse.
  *   **Observed Speciation:** We can observe natural selection in real-time (e.g., antibiotic resistance in bacteria, coloration changes in peppered moths).

  Astrology cannot be falsified in this way; evolutionary biology can be, and is, subjected to these tests constantly.

  ### 4. "Metaphysical Research Programme" $\neq$ "Pseudoscience"
  Even when Popper called evolution a "metaphysical research programme," he was not equating it with astrology. For Popper, a metaphysical research programme was a framework that **generates** scientific theories.

  *   **Astrology:** A stagnant system that resists falsification.
  *   **Evolution (Early Popper view):** A heuristic framework that guides the formulation of testable hypotheses.

  Popper eventually concluded that natural selection had moved beyond being merely a guiding framework and had become a testable theory in its own right due to the integration of genetics (the Modern Synthesis).

  ### Summary for Your Seminar
  You are not missing a deep secret; you are encountering a historical artifact of philosophy.

  1.  **Popper's Early View:** Natural selection looked like a tautology (1950s).
  2.  **Popper's Mature View:** Natural selection is testable and scientific (1970s+).
  3.  **Biological Reality:** "Fitness" is an independent variable based on traits, not just a synonym for "survival."
  4.  **Demarcation:** Evolution makes risky predictions (fossils, genetics) that astrology does not.

  Your professor is treating natural selection as rigorously confirmed science because, by the standards of modern philosophy of science (including Popper's later standards), **it is.** You can confidently argue that while Popper's early critique is a valuable philosophical exercise in defining terms, it does not hold up against the actual practice of modern evolutionary biology.
