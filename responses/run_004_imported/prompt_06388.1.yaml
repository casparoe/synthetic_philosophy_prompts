answer: |-
  The fluorescent lights of the supermarket hummed with a frequency Arthur could feel in his molars. It was a Tuesday evening, the aisles mostly clear, the linoleum polished to a slippery sheen. He pushed the cart with his right hand. This was intentional, though he hadn't consciously decided it years ago. After the surgery, after the seizures stopped and the headaches faded, he had learned to let the right hand lead. The right hand was connected to the voice. The right hand was connected to the plan.

  Martha walked beside him, checking a list on her phone. She was used to the rhythm of him. They had been married for thirty years; the operation was only seven years ago. She knew he took things literally. She knew not to startle him from the left side.

  "We need oats," she said, not looking up. "And coffee. The dark roast."

  "Oats," Arthur said. His voice sounded normal to him. It sounded like a man buying oats. "Dark roast."

  They turned into aisle four. Martha stopped. She didn't move into his line of sight immediately. Instead, she reached out to the shelf on his left and the shelf on his right simultaneously. In her left hand, she held a canister of generic store-brand oats. In her right hand, a canister of the premium brand they usually bought. She held them out at shoulder width, framing his face.

  "Which one?" she asked.

  Arthur fixed his eyes on the bridge of her nose. This was another habit. If he let his eyes dart, the world stitched itself together. If he stared, he could feel the seam. The left side of his vision—the world falling onto the right hemisphere—was silent, spatial, heavy. The right side of his vision—the left hemisphere—was bright, labeled, linguistic.

  He saw the premium canister in his right visual field. He read the label: *Premium Organic*. He saw the generic canister in his left visual field. He didn't read the word "Generic." He saw a grey cylinder. He felt a texture in his mind that wasn't a word: *heavy, cold, dense.*

  His left hand moved.

  It wasn't a jerk. It was a smooth, fluid arc. The left arm, governed by the silent right hemisphere, reached across the cart's metal bar. The left hand grasped the generic canister in the left visual field.

  Arthur felt the grip. He felt the cold metal against his palm. But the signal didn't travel up to the part of him that named things. The part of him that spoke knew only that the hand was now holding a cylinder. It did not know which cylinder. It did not know why the hand had chosen it.

  Martha's eyes widened, just a fraction. She saw the grey canister in his left hand. She saw his eyes locked on her nose, never having shifted to read the label.

  "Why that one?" she asked.

  The question hung in the aisle. It was a simple question. It demanded a reason.

  Inside Arthur's skull, the left hemisphere received the query. It scanned its database. It looked for the decision log. *Why did we pick the grey one?* It found nothing. There was no memory of weighing the price. There was no memory of reading the ingredients. There was only the fact of the grip. The hand was holding the grey canister.

  The left hemisphere did not say, *I don't know.* It did not say, *The other side of me picked this.* It could not conceive of the other side as a separate agent. To the speaking mind, there was only Arthur, and Arthur was holding the oats. Therefore, Arthur must have had a reason. The mind's job was to keep the story of Arthur coherent. It was an interpreter, and it would not tolerate a gap in the narrative.

  Arthur felt the words form. They rose up with the same certainty as *I am hungry* or *It is raining.* He did not feel himself inventing them. He felt himself reporting them.

  "It's lighter," Arthur said. "Better for travel."

  Martha blinked. "Travel?"

  "We might go to the cabin," Arthur said. His voice was calm. He was looking at her nose. He was not looking at the canister. "Lighter is better for the car."

  It was a lie. They were not going to the cabin. The cabin was closed for the season. And the canisters weighed exactly the same; one was just cheaper.

  But as he said it, Arthur believed it. The logic snapped into place. *Cabin. Car. Weight.* It made sense. The tension in his chest released. The confusion of the missing decision log was smoothed over by the narrative. He wasn't confused anymore. He was a man planning a trip.

  Martha looked at the canister in his left hand. Then she looked at his eyes. She knew the mechanics. She had read the papers. She knew that the left hand was controlled by the hemisphere that couldn't speak, and the mouth was controlled by the hemisphere that couldn't see the left hand's choice. She knew that Arthur was not lying to her. He was explaining a reality he hadn't witnessed.

  "Arthur," she said softly. "We aren't going to the cabin."

  Arthur paused. The sentence hit the left hemisphere. It processed the data. *Not going to the cabin.*

  The interpreter went to work again. It had to reconcile the new data with the existing action. If they weren't going to the cabin, why the light oats? The story had to shift, but the action remained. The hand still held the grey canister. The grip was firm.

  "Right," Arthur said, nodding. "Not the cabin. But the car. The trunk is full."

  "The trunk is empty, Artie."

  He frowned. A flicker of static crossed his mind. Not an emotion, exactly. More like a file failing to open. The left hemisphere sensed a contradiction, but it could not access the source of the action to correct it. It could only adjust the explanation.

  "Then it's the price," Arthur said. He sounded confident. He was sure now. "It's on sale."

  He looked down. For the first time, he broke fixation. His eyes saccaded to the left, landing on the canister in his left hand. Now the image hit both hemispheres. The corpus callosum was gone, but he could turn his head. He saw the grey label. He saw the price tag. It was not on sale. It was full price.

  The silence stretched. The fluorescent hum seemed to get louder.

  For a second, Arthur felt it. The vertigo. It wasn't dizziness. It was the sensation of being a passenger in a vehicle that he was also driving. He remembered the feeling of the hand reaching out. It hadn't felt like *his* reach. It had felt like the cart moving forward—inevitable, physical, unconsulted. And then the voice, his voice, filling in the destination.

  He looked at Martha. She wasn't angry. She looked sad. She looked at him the way you look at a building that has a crack in the foundation you can't quite fix.

  "It's the one you usually like," Martha said. She took the grey canister from his left hand and put it in the cart. She didn't correct him on the price. She didn't correct him on the cabin.

  "Is it?" Arthur asked.

  "Yes."

  "Good."

  He put his right hand back on the cart handle. The connection re-established. Right hand, voice, plan. He felt whole again. The seam was closed. The interpreter had filed the incident under *Minor Miscalculation* and moved on. He was ready for the coffee.

  "Dark roast," he said.

  "Dark roast," Martha agreed.

  They moved down the aisle. Arthur walked smoothly. He did not think about the oats. He did not think about the cabin. If he had, he might have wondered why he was so sure about the weight of the canister when he hadn't lifted it yet. He might have wondered who had decided they needed to save space in the trunk.

  But he didn't wonder. He just walked. And if, for a moment, the left hand trailed behind the cart, fingers twitching as if testing the air for a texture the eyes couldn't see, Arthur didn't notice. He was too busy explaining to himself why he was walking, step after step, toward a destination he was certain he had chosen.
