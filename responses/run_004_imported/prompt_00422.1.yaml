prompt: |-
  A close friend who works at a mid-stage startup has offered to sell me a slice of his vested equity in a private secondary deal, at a price that values the company noticeably below what I understand the last funding round implied. He insists the sale has nothing to do with his view of the company's prospects — he says he's still bullish and is only parting with a fraction of his stake because he needs cash for a house down payment. The price is tempting, but something about the situation nags at me: he has far more visibility than I do into things like churn, hiring, and runway, and he's the one initiating the trade. I keep circling back to the thought that if he genuinely believed the shares were worth more, why would he be selling to me at all, personal liquidity needs notwithstanding — shouldn't he just borrow against the stake, or sell to someone with less access to information than me? Is my hesitation well-founded, or am I overanalyzing an ordinary transaction between a well-informed insider and a cautious outsider? I'd like to understand what's actually going on here conceptually — what should I make of his stated reason for selling, and how much should it change my willingness to take the other side of this trade?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Deconstruct the User's Query:**
      *   **Situation:** A close friend at a mid-stage startup is offering to sell vested equity in a private secondary deal.
      *   **Price:** Below the last funding round valuation (a discount).
      *   **Friend's Rationale:** Needs cash for a house down payment; still bullish on the company.
      *   **User's Concern:** Information asymmetry (friend knows more about churn, hiring, runway). Why sell to *me* if it's such a good deal? Why not borrow against it?
      *   **Core Question:** Is my hesitation well-founded? What's going on conceptually? How should this affect my willingness to buy?

  2.  **Initial Assessment & Gut Check:**
      *   The user's hesitation is *highly* well-founded. This is a classic "lemons problem" (Akerlof) scenario mixed with insider trading dynamics and liquidity constraints.
      *   The friend's rationale (house down payment) is plausible but doesn't negate the information asymmetry risk.
      *   The discount is a red flag. Why is the market pricing it lower than the last round? Usually, secondary markets price *at* or *above* the last round if things are going well. A discount suggests the "real" value is lower than the paper value.
      *   Borrowing against private startup stock is notoriously difficult/impossible for most employees unless there's a specific program (like EquityBee or a bank partnership), which the friend might not qualify for or know about.

  3.  **Conceptual Frameworks to Apply:**
      *   **Information Asymmetry:** The seller knows more than the buyer. This is the core issue.
      *   **Adverse Selection:** The fact that he is selling *to you* specifically might imply he can't sell elsewhere or wants to offload risk to someone he trusts.
      *   **Signaling:** Selling equity is a signal. Even if he says he's bullish, the action contradicts the words.
      *   **Liquidity Premium/Discount:** Private shares are illiquid. A discount is normal, but a *deep* discount relative to the last round is concerning.
      *   **Fiduciary/Compliance Risk:** Is this sale even allowed? (ROFR, insider trading policies).

  4.  **Drafting the Analysis - Section by Section:**

      *   **Validation:** Start by validating the user's intuition. It's not overanalyzing; it's prudent due diligence.
      *   **The "Why Sell?" Question (Signaling):** Address the friend's claim. Even if he needs cash, selling *some* is normal, but the *pricing* and the *counterparty* matter.
      *   **The Pricing Anomaly:** Explain why a discount to the last round is significant. Primary rounds are often "up rounds" with fresh capital. Secondaries reflect real market sentiment. If secondaries are down, the primary valuation might be stale or inflated.
      *   **Information Asymmetry (The Core Risk):** The friend knows the *real* metrics. The user only knows the *marketing* metrics. This is the "Lemons Market."
      *   **Alternative Liquidity Options:** Address the "why not borrow" point. It's hard to borrow against private stock. This makes the sale more rational for him, but doesn't remove the risk for the buyer.
      *   **Compliance & Structure:** Is this legal? ROFR (Right of First Refusal)? Company approval? Insider trading windows?
      *   **Decision Framework:** How to decide? (Risk capital only, assume it goes to zero, check company policy).

  5.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Correction:* I shouldn't tell them "Don't do it." I should tell them "Here are the risks so you can decide."
      *   *Nuance:* Friends selling to friends is common. It's not necessarily malicious. But the financial logic must be separated from the friendship.
      *   *Key Insight:* The "House Down Payment" is a *liquidity constraint*, not necessarily a *valuation insight*. However, the *discount* is the valuation insight.
      *   *Crucial Point:* The company might have a ROFR or block the transfer. If the friend is desperate, maybe he's already tried other buyers and got rejected or lowballed.

  6.  **Structuring the Response:**
      *   **Executive Summary:** Your hesitation is correct. This is high risk.
      *   **Concept 1: Information Asymmetry & Adverse Selection:** The "Lemons" problem.
      *   **Concept 2: Primary vs. Secondary Valuation:** Why the discount matters.
      *   **Concept 3: Liquidity Constraints:** Why he can't borrow.
      *   **Concept 4: Compliance & Friction:** ROFR, insider trading.
      *   **Actionable Advice:** Questions to ask, how to size the bet, protecting the friendship.

  7.  **Final Polish:**
      *   Tone: Empathetic but analytical.
      *   Avoid jargon where possible, or explain it (e.g., ROFR, 409A).
      *   Emphasize that private startup stock is essentially a lottery ticket, not an investment.

  8.  *(Self-Correction during drafting)*: I need to make sure I mention that the friend might be restricted from selling. If he's pushing hard, is he bypassing company policy? That's a huge red flag.
      *   *Add:* Check the Stock Purchase Agreement (SPA).

  9.  **Final Review against User Query:**
      *   Did I answer "Is my hesitation well-founded?" Yes.
      *   Did I answer "What should I make of his stated reason?" Yes (plausible but incomplete).
      *   Did I answer "How much should it change my willingness?" Yes (significantly).

  10. **Generate Output.** (Proceed to write the response based on these points.)
answer: |-
  Your hesitation is not only well-founded; it is the most rational part of this equation. You are identifying a classic problem in finance known as **information asymmetry**, compounded by the specific illiquidity and opacity of private markets.

  While your friend's personal reason (a house down payment) is plausible, it does not neutralize the financial risks you are taking on. In fact, the structure of this deal raises several conceptual red flags that you need to weigh heavily before proceeding.

  Here is a breakdown of what is actually going on conceptually, and how you should adjust your willingness to take the other side of this trade.

  ### 1. The "Lemons" Problem (Adverse Selection)
  In economics, George Akerlof's "Market for Lemons" theory describes a market where the seller has more information about the quality of the asset than the buyer. Because the buyer can't distinguish between a "peach" (good asset) and a "lemon" (bad asset), they are only willing to pay an average price. This drives sellers of "peaches" out of the market, leaving only "lemons."

  *   **The Dynamic:** Your friend knows the *real* metrics (churn, burn rate, pipeline health). You only know the *public* narrative.
  *   **The Signal:** Even if he is "bullish," the act of selling is a signal. If the secondary market is pricing the shares *below* the last primary round, the market is signaling that the primary valuation was inflated or that conditions have deteriorated since that round.
  *   **The Risk:** By selling to you, he is transferring the downside risk of those private metrics to you. If he knew for a certainty that a massive up-round or IPO was imminent in 6 months, he would likely find a way to bridge his liquidity (even at high interest) rather than sell equity at a discount.

  ### 2. Primary vs. Secondary Valuation
  You noted the price values the company "noticeably below" the last funding round. This is a critical data point.

  *   **Primary Rounds (VCs):** Venture capitalists often invest at inflated valuations to put capital to work, secure board seats, or support a friend. That valuation is "paper value."
  *   **Secondary Rounds (Employees/Investors):** This is "real money" exiting the cap table. When employees sell in secondaries, it is often the clearest signal of *true* market value.
  *   **The Discount:** A discount in a secondary market usually implies one of two things:
      1.  **Illiquidity Discount:** Private shares are hard to sell, so they trade at a discount. (Normal).
      2.  **Fundamental De-risking:** The company's prospects have dimmed since the last round, and insiders know the primary valuation is no longer supportable. (Dangerous).
      *   *Ask yourself:* Is the discount 10-20% (standard illiquidity) or 40-50% (distress)?

  ### 3. Liquidity Constraints vs. Alternatives
  You asked: *"Shouldn't he just borrow against the stake?"*

  *   **Reality Check:** It is extremely difficult for rank-and-file employees to borrow against private startup stock. Banks generally do not accept private pre-IPO stock as collateral unless the company is a late-stage unicorn with a specific banking partner (like SVB or specialized lenders like EquityBee).
  *   **Implication:** His inability to borrow doesn't necessarily mean the company is failing; it just means the asset is illiquid. However, if he is desperate enough to sell at a discount to a friend rather than waiting for a company-sanctioned tender offer, it suggests his liquidity need is immediate and perhaps urgent.

  ### 4. Compliance and Friction (The Hidden Risk)
  This is the most practical hurdle. Private companies tightly control their cap tables.

  *   **Right of First Refusal (ROFR):** Most Stock Purchase Agreements give the company the right to buy the shares back before the employee can sell them to a third party.
  *   **Board Approval:** Many companies require board approval for secondary sales to prevent "dead equity" (shares held by people who no longer work there) from accumulating, or to prevent shareholders they don't know from entering the cap table.
  *   **Insider Trading:** If your friend possesses Material Non-Public Information (MNPI)—for example, knowing that earnings will miss targets next month—selling shares could technically be illegal, even in a private transaction.
  *   **The Risk to You:** If the company blocks the transfer, you could be stuck in a legal limbo where you've paid cash but don't legally own the shares.

  ### 5. The Friendship Dynamic
  Mixing finance and friendship is risky, but this specific dynamic adds a layer of complexity.

  *   **The "Favor" Trap:** He may view this as helping you get into a "hot deal" at a discount. You may view it as a financial transaction. If the company fails, you lose money, and the friendship may suffer because you feel you were the "exit liquidity."
  *   **Selection Bias:** Why you? If this is such a good deal, why isn't he selling to a specialized secondary fund (like Forge or EquityZen) that could offer a cleaner process? It is possible he tried, and they offered a lower price, or the company blocked it, and you are the "plan B."

  ### How to Adjust Your Willingness to Trade

  Your hesitation should significantly reduce your willingness to buy, unless you treat this as **speculative gambling, not investing.**

  **1. Assume the Money is Gone**
  Private startup equity has a high failure rate. Treat this purchase as if you are buying a lottery ticket. If losing this capital would impact your life or your friendship, do not do it.

  **2. Verify the "Discount" Logic**
  Ask him (gently): *"I know the primary round was at $X. The secondary market is pricing at $Y. Is that discount standard for the company's stage, or have conditions changed?"* If he gets defensive or vague, walk away.

  **3. Demand Company Sanction**
  Do not do this "under the table." Ask: *"Has the company approved this transfer? Is there a ROFR?"* If he suggests bypassing company legal counsel, **do not proceed.** You do not want to be an unauthorized shareholder on a cap table.

  **4. Size the Position Appropriately**
  If you proceed, size the position at 1% to 5% of what you would normally invest in a liquid public stock. You are being compensated for illiquidity and information risk, but that compensation is not guaranteed.

  **5. Separate the Friendship**
  Have a frank conversation: *"I value our friendship more than this investment. If I buy this and it goes to zero, I need to know that won't be awkward between us. Also, if the company blocks the transfer, how do we unwind the cash?"*

  ### Summary
  Your intuition is correct. The combination of **information asymmetry**, a **discount to the primary round**, and the **illiquidity of the asset** makes this a high-risk transaction.

  Your friend is likely not trying to scam you; he likely does need cash for a house. However, in finance, **incentives matter more than intentions.** His incentive is to maximize liquidity now; your incentive is to maximize returns later. These are misaligned.

  **Verdict:** Unless you can afford to lose 100% of the capital without it affecting your relationship or your finances, the prudent move is to decline politely. You can support your friend's home purchase in other ways without taking on asymmetric equity risk.
