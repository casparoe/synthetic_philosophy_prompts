answer: |-
  This is a fantastic pivot point for a character. You are absolutely right to be suspicious of the "stubborn old man" trope. Hobbes wasn't stubborn in the way a gambler is stubborn; he was stubborn in the way a theologian is stubborn. He believed his opponents were not just incorrect, but *heretical*—not against God, but against Reason itself.

  To answer your specific philosophical bug: **You are correct that his epistemology should make him vulnerable, but only if he accepts his opponent's definitions.** Hobbes's materialism meant he believed mathematical objects must be physical (or at least imaginable as physical). Wallis and the new algebraists were moving toward abstract symbolic manipulation (infinitesimals, indivisibles) that Hobbes viewed as "ghosts" or "mysticism."

  For Hobbes, a line is the trace of a moving body. A point is a body with magnitude. If Wallis proves Hobbes wrong using a method that assumes a line has no width or a point has no size, Hobbes doesn't see a refutation; he sees a category error. He thinks Wallis is playing a different game with rigged rules.

  Here is a scene draft that dramatizes this specific philosophical deadlock, followed by a breakdown of the technical underpinnings so you can wield them in the rest of the novel.

  ***

  ### Scene Draft: The Trace of the Compass

  The room smelled of coal smoke and old paper, a scent that seemed to have soaked into the plaster of the Charing Cross lodgings. Thomas Hobbes sat in his high-backed chair, a blanket over his knees despite the June warmth. On the table before him lay a diagram, inked so heavily the paper had buckled.

  Ellis, who had been tasked with carrying the latest pamphlet to the printer, stood by the window. He held the sheaf of papers loosely, as if they might bite.

  "Mr. Wallis will not print it, sir," Ellis said. "The Society says the calculation is... deficient."

  Hobbes didn't look up from the diagram. "The Society says many things. They say air has weight. They say a vacuum is possible. They say a man can be cut in half and live if the blood is transfused. They are children playing with toys they do not understand."

  "They say your quadrature fails, Thomas." Ellis turned from the window. "They say you have assumed a ratio that does not hold. They have checked the sums. Three times, now."

  Hobbes finally looked up. His eyes were pale, watery, but the focus was sharp as a needle. "Sums. Arithmetic. They treat geometry as if it were a merchant's ledger. Tell me, boy. When you draw a circle, what do you draw?"

  "A circle."

  "With what?"

  "A compass."

  "And what is the compass doing?"

  "It moves," Ellis said.

  "It generates," Hobbes corrected. "It is a body in motion. The line it traces is the record of that motion. That is geometry. It is the only science God has allowed us, because it is the only one where we create the cause. We make the circle, so we know the circle."

  Hobbes tapped the buckled paper. "Mr. Wallis does not make circles. He writes equations. He speaks of 'indivisibles.' Lines made of points that have no size. Areas made of lines that have no width. This is not geometry. This is incantation. You cannot add up nothings and get a something."

  "But if the result is wrong..." Ellis stepped closer. "If the physical measurement fails? If you cut the shape from wood and weigh it, and the weight does not match your proof?"

  "Then the wood is imperfect," Hobbes snapped. "Or the knife. Or the eye. But the reason remains sound."

  "Is it?" Ellis pressed, risking the anger. "Or is it that you have defined 'magnitude' in a way that the world does not honor? You say a point must have size. But if a point has size, it is not a point. It is a speck. If you build your proof on specks, is it not built on sand?"

  Hobbes leaned forward, the blanket slipping. "If I say a point has no size, I speak nonsense. I speak of nothing. And from nothing, nothing comes. If I accept Wallis's 'indivisibles,' I accept that a thing can be divided until it ceases to be a thing, and yet still count. That is the logic of the Schoolmen. That is the logic of the priests who said God is three and one. It is mysticism dressed in symbols."

  He stood up, shaky but fierce, and walked to the table. He picked up a compass.

  "In my Commonwealth," Hobbes said, his voice dropping, "I argued that to avoid the war of all against all, men must yield their private judgment to a public Sovereign. We must agree on what 'Justice' means, or we cut each other's throats."

  Ellis nodded. "Leviathan."

  "Yes. And the Mathematicians claim to be that Sovereign now. They say, 'We have voted. The circle is squared thusly. Submit.' But Ellis, consider. In politics, the Sovereign makes the law true because there is no higher appeal. But in geometry? The truth is not in the vote. It is in the generation."

  He spun the compass on the paper. The point tore a small hole in the center.

  "Wallis demands I submit to his authority. But he has no authority. He has only a consensus of error. If I admit I am wrong, I do not just admit a sum is bad. I admit that *Reason* is broken. I admit that we can know things we did not make. I admit that words can mean things we cannot conceive."

  Hobbes dropped the compass. It clattered on the wood.

  "I would rather be the last madman in a world of fools than the first fool in a world of madmen. If my proof fails, it is because their definitions are lies. A line without width is a lie. A point without magnitude is a lie. I will not build my house on lies to please a club of virtuosi who think they can weigh the air."

  Ellis looked at the hole in the paper, the ink-stained fingers, the old man trembling not with age but with the vibration of a mind that had locked itself into a room with no door.

  "And if you are alone?" Ellis asked softly.

  Hobbes sat back down and pulled the blanket up. "Then I am alone. But I am coherent. Look at them, Ellis. They square the circle by cutting it into infinite slices. Infinite. Can you hold infinity in your hand? No. Then it is not science. It is faith." He picked up his pen. "Leave the pamphlet. I shall find a printer who knows the difference between a number and a ghost."

  ***

  ### The Philosophical "In-the-Weeds" Breakdown

  Here is the technical ammunition you need to sustain this characterization through the rest of the book.

  **1. The Materialist Objection (Why he can't admit the error)**
  *   **Standard View:** In Euclidean geometry (and Wallis's analytic geometry), a point is defined as "that which has no part." It has position but no magnitude. A line has length but no breadth.
  *   **Hobbes's View:** Hobbes was a thoroughgoing materialist. He believed "substance" must be corporeal. To speak of a "point" that has no size is to speak of nothing. For Hobbes, a point is a physical mark; a line is the trace of a moving body.
  *   **The Conflict:** Wallis's proof (and the eventual calculus) relies on limits and infinitesimals—quantities approaching zero. To Hobbes, this is nonsense. You cannot sum infinite zeros to get a finite area. Therefore, when Wallis proves Hobbes wrong using these methods, Hobbes genuinely believes Wallis has used invalid premises. He isn't ignoring the math; he is rejecting the *axioms* of the new math as metaphysical nonsense. He thinks he is defending Reason against Mysticism.

  **2. Construction vs. Calculation (The Epistemological Trap)**
  *   **Hobbes's Theory of Science:** We only have *scientia* (certain knowledge) of things we construct. We know geometry because we draw the figures. We know politics because we construct the Commonwealth (the "Artificial Man"). We *cannot* truly know physics (natural philosophy) because God made nature, and we cannot know the mind of God.
  *   **The Trap:** This should make him humble about physics, but arrogant about geometry. Because he believes geometry is purely a product of human definition, he believes the truth is entirely transparent to reason. If he sees a proof, he thinks he should see the "motion" that created it. Wallis's algebraic proofs are static symbols. Hobbes literally cannot "see" the truth in them because they lack causal generation. He isn't being proud; he is epistemologically blind to the new method.

  **3. The Sovereignty Irony (The Political Parallel)**
  *   **The Political Argument:** In *Leviathan*, Hobbes argues that in the state of nature, every man is judge of good and evil, which leads to war. To have peace, we must covenant to let the Sovereign be the public judge. Private reason must yield to public authority *in action*.
  *   **The Mathematical Irony:** The Royal Society (and Wallis) is acting as the "Sovereign" of mathematics. They are the public authority establishing the standard verdict.
  *   **Hobbes's Loophole:** Hobbes distinguishes between *Prudence* (experience/opinion) and *Science* (demonstration). He would argue that the Sovereign decides *controversies of fact* or *law* to keep peace, but the Sovereign cannot make $2+2=5$.
  *   **The Tragedy:** Hobbes believes he possesses *Science* (demonstration), while the Royal Society is merely voting on *Opinion*. Therefore, submitting to them isn't obedience; it's lying. However, the irony remains: his entire political philosophy is built on the idea that without a final arbiter, discourse becomes endless conflict. He is living out the "State of Nature" in mathematics, refusing the umpire, proving his own political theory that men are too vain to submit to reason when their reputation is at stake.

  **4. Specific Technical Hooks for Dialogue**
  *   **"Universals":** Hobbes was a Nominalist. He believed "universals" (like the concept of 'Circle' apart from any drawn circle) are just names, not real things. Wallis treats algebraic variables as universal truths. Hobbes sees this as reifying names into things.
      *   *Line:* "He worships the name 'Circle' and forgets the compass."
  *   **"Indivisibles":** This is the specific mathematical bone of contention. Cavalieri and Wallis used indivisibles (think of an area as a stack of infinite lines). Hobbes wrote *De Corpore* largely to refute this.
      *   *Line:* "You cannot stack ghosts to build a wall."
  *   **"Absurdity":** Hobbes has a specific definition of absurdity—it is meaningless speech, like saying "a quadrangular circle." He classifies Wallis's math as absurd in this technical sense, not just "incorrect."

  **5. Character Motivation**
  *   He isn't fighting for fame. He's fighting for **Consistency**.
  *   If he admits Wallis is right, he has to admit that incorporeal substances (mathematical abstractions) can have causal power.
  *   If incorporeal substances exist in math, the Church can argue they exist in theology (souls, angels, the Trinity).
  *   Hobbes's war on the circle is actually a proxy war against the Church and the "Darkness" of scholasticism. He thinks Wallis is letting the priests back in through the side door of calculus. This makes his stubbornness noble in his own eyes, which is much more compelling for a novel.

  **Summary for your notes:**
  Hobbes refuses to admit error because he believes Wallis is using a corrupted language that violates the materialist basis of all reality. To concede is to allow "mysticism" back into science, which threatens the entire philosophical system Hobbes built to protect humanity from superstition and civil war. He is the last defender of a purely materialist universe, even if it means he has to break the circle to save it.
