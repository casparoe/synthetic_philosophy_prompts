          1.  **Materialism:** Hobbes believed mathematical points must have magnitude. A "point" without size is nonsense to him. A line is a trace of a moving body. Therefore, geometry is physics.
          2.  **Rejection of Infinitesimals:** Wallis used methods involving indivisibles (Cavalieri's principle). Hobbes thought this was mysticism ("ghosts of departed quantities," though that phrase is Berkeley's later). To Hobbes, if you can't draw it or conceive of it as a body in motion, it's not geometry.
          3.  **Definition of "Demonstration":** For Hobbes, a demonstration isn't just logical validity; it's causal generation. If Wallis says Hobbes is wrong using algebra, Hobbes says Wallis isn't doing geometry at all. He's doing "arithmomancy."
          4.  **The "Sovereign" Irony:** In politics, the Sovereign defines truth to end conflict. In mathematics, the Royal Society/Wallis acts as the Sovereign. Hobbes rejects their authority because he believes they have corrupted the *definitions* themselves. If the definitions are wrong, the Sovereign's verdict is void.

