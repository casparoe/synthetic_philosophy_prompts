prompt: |-
  So I'm about a third of the way into a novel set in London in the 1670s, and I've got a minor character who's an old, cantankerous Thomas Hobbes hanging around the fringes of the Royal Society crowd (who never let him in, which is its own sore point for him), still fighting his endless war with John Wallis over whether he'd actually squared the circle. He hadn't -- he was just wrong -- but he never once backed down, for like two decades, pamphlet after pamphlet (Six Lessons, all that). I've got that historical outline down fine, I don't need a recap, I can get that off wikipedia. What I actually need is a scene where a younger character presses him on WHY he won't just admit it, and I don't want the answer to be a generic "proud old man" -- I want it to come out of his actual philosophy, because a friend of mine doing a philosophy postdoc mentioned there's something genuinely interesting buried in there and now I can't let it go.

  Here's the specific thing thats bugging me. As I understand it, part of why Hobbes thought geometry was basically the one place humans get real, demonstrable certainty is that we construct the objects ourselves out of definitions -- a circle is just whatever you get from a specific procedure, so unlike physics, where we're stuck guessing at causes we didn't make and can never fully recieve certainty about, in geometry we made the thing, so we get to know it all the way down. If that's roughly right, shouldn't it make him MORE exposed to correction on an actual flawed proof, not less -- his own standard for certainty is sitting right there ready to convict him? So is there something in his specific, kind of heterodox views on geometry (his stuff on indivisibles, or his own idiosyncratic redefinitions of terms, or just his particular theory of what counts as a "demonstration") that let him sincerely believe, on his own terms, that he'd actually pulled it off and everyone else was confused? And is there an irony worth putting into the scene, given that elsewhere Hobbes's whole case for absolute sovereignty rests on the idea that private judgment about disputed truths has to yield to one public, authorized verdict or you get endless conflict -- and yet here he is, for basically the second half of his life, playing the guy who won't accept the umpire's ruling? I want the in-the-weeds version of this, not the greatest-hits biography of the feud -- happy for you to get properly technical about his theory of science and demonstration if that's what's actually needed to answer it.
