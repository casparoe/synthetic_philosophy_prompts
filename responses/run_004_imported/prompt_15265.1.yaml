  **(Self-Correction during drafting):** I need to make sure I don't make Hobbes sound *too* reasonable. He needs to be wrong, but logically consistent within his own system. The tragedy is that his system *forces* him to be wrong here. His materialism, which grounds his politics, undermines his math.

  Let's focus on the definition of a "Point." For Euclid/Wallis, a point has no parts. For Hobbes, a point is a body with magnitude. This is the crux. If a point has magnitude, the calculus of indivisibles collapses.

