      *   Use Smithian terminology ("annual produce," "productive labor," "mercantile jealousy," "joint-stock").
      *   *Self-Correction during drafting:* Make sure not to let Smith sound like a modern neoliberal. He isn't against state infrastructure per se, but against state infrastructure used for political control or monopoly. He isn't against trade, but against trade driven by political rather than economic logic.

  7.  **Final Polish:** Check against specific WN references (Book IV, Chapter VII is key for colonies/companies; Chapter VIII for conclusion). Ensure the distinction between "formal sovereignty" and "effective independence" is handled with Smithian nuance (he cared about liberty and prosperity, not just legal flags).

      *(Self-Correction on the "Debt Trap" nuance)*: Smith didn't write about sovereign debt traps in the modern sense. He wrote about public debt (Book V). He hated public debt because it mortgages future labor. He would likely view the *borrowing* side's accumulation of unsustainable debt as a failure of prudence akin to Britain's own debt accumulation, regardless of the lender's intent. This adds depth to the advice for borrowing states.

  8.  **Final Structure:**
      1.  Introduction: Validating the user's nuanced reading.
      2.  The Nature of the Agent (Merchant vs. State).
      3.  The Nature of Sovereignty (Jurisdiction vs. Leverage).
      4.  The Economic Logic (Mercantilism vs. EIC Pathology).
      5.  Smith's Verdict (Refereeing the dispute).
      6.  Smithian Policy Prescriptions (For Borrowers and Lenders).

