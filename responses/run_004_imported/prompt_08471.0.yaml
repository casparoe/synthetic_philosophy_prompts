      *   *Section 2: Sovereignty and the "Sword".* Smith distinguishes between civil authority and military force. EIC had both. BRI lenders have financial leverage. Smith would argue financial leverage is weaker than military force but still corrosive to liberty.
      *   *Section 3: The Economic Calculation (Who Pays?).* Smith's argument that monopoly benefits the few at the expense of the many. Does BRI benefit Chinese citizens or the state apparatus? Does it benefit borrowing nations or their elites?
      *   *Section 4: The Verdict.* Smith would likely say: "Not the EIC, but still Mercantilism." The friend is right about the *risk* of dependency; the user is right about the *mechanism*.
