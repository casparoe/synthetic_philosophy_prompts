answer: |-
  **MEMORANDUM**

  **TO:** Faculty of Law
  **FROM:** Classroom Climate Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Policy Regarding the Oral Citation of Racial Slurs in Case Law

  **I. RECOMMENDATION**

  The Classroom Climate Committee recommends that instructors **may read racial slurs aloud from judicial opinions only when the specific term is legally material to the doctrinal point being taught**, subject to mandatory procedural safeguards. In all other instances, instructors should use euphemisms (e.g., "the n-word").

  This policy is effective immediately for the current semester and will be codified in the Faculty Handbook prior to the start of the Spring term.

  **II. RATIONALE: PEDAGOGICAL NECESSITY**

  In Employment Discrimination and Civil Rights litigation, the specific language used by a defendant is often the *res ipsa loquitur* of liability. As noted in the recent incident prompting this review, courts frequently distinguish between "severe" and "pervasive" harassment based on the specific epithet employed. A single utterance of a historically charged racial slur by a supervisor often establishes liability *per se*, whereas a milder insult might require a pattern of conduct to meet the same threshold.

  To substitute the actual term with a euphemism in these specific doctrinal contexts risks obscuring the legal reasoning. If students do not confront the specific weight the judiciary assigns to that specific word, they may fail to grasp why the law treats certain speech acts as uniquely destructive. Our mission requires that graduates understand not just the black-letter rule, but the social reality the rule adjudicates. Sanitizing the record in class can inadvertently minimize the severity of the conduct the law seeks to remedy.

  Therefore, we reject a categorical ban. We recognize the instructor's speech act here is evidentiary, not expressive. They are not deploying the slur to subordinate the students; they are citing the record to demonstrate how the law identifies subordination.

  **III. ENGAGEMENT WITH THE COUNTER-ARGUMENT**

  We recognize that this recommendation rejects the position that racial slurs should be categorically excluded from oral classroom discourse, regardless of context. We have engaged deeply with the argument that the harm of a slur is inherent to its phonetics and history, not merely its intent.

  The strongest version of this argument posits that a slur functions as a "forbidden item" in the language—a verbal weapon that inflicts trauma simply by being activated in the air, regardless of who wields it or why. Proponents argue that hearing the word reproduces the physiological and psychological stress of the original harm, rendering the speaker's intent (pedagogical vs. hostile) irrelevant. From this perspective, a white instructor reading the word aloud, even from a casebook, replicates the power dynamic of the original oppression: a person with institutional authority forcing a marginalized group to endure a racial toxin.

  The Committee acknowledges the validity of this concern. We concede that procedural safeguards (warnings, opt-outs) do not *erase* the potential for harm. A student who finds the word traumatic may still experience distress even if they were warned it was coming. We also acknowledge that the "reclamation" counter-example (e.g., a Black comedian using the term) is not a perfect analogy for a law professor citing a case; the professor is not reclaiming the term, they are analyzing it.

  However, the Committee ultimately finds that while the *risk* of harm is real, it is not *inevitable* in the same way it is in a hostile work environment. The pragmatic force of speech depends on context. In a hostile work environment, the slur is used to assert dominance and exclude. In a law classroom, when framed correctly, the slur is used as an exhibit to prove exclusion occurred. To treat these two speech acts as identical is to deny the law's own capacity to distinguish between harassment and evidence of harassment. If we cannot analyze the mechanics of discrimination without reproducing them, we limit our ability to dismantle them.

  We land on this side not because the harm argument is weak, but because the pedagogical cost of a categorical ban is too high for professional legal training. We are choosing to manage the risk of harm rather than eliminate the material, because the material is the subject matter of the law itself.

  **IV. PROCEDURAL SAFEGUARDS**

  To mitigate the recognized risks outlined above, the following protocols are mandatory when an instructor determines that reading the term is legally necessary:

  1.  **Syllabus Notice:** The syllabus must explicitly state that the course involves the analysis of case law containing racial slurs and that these terms may be read aloud for doctrinal precision.
  2.  **Advance Warning:** Instructors must provide a verbal warning at the end of the class *prior* to the session where the material will be covered. This allows students to prepare emotionally or utilize the opt-out without drawing attention to themselves during the class.
  3.  **Opt-Out Without Penalty:** Students may leave the classroom during the reading of the specific passage without academic penalty or requirement to explain their absence. The instructor must provide the relevant text in written form (via email or LMS) so the absent student can review the doctrinal point without hearing the oral recitation.
  4.  **Pedagogical Framing:** Instructors must explicitly frame *why* the specific word is being read. It cannot be read casually. The instructor must articulate the legal significance of the specific term (e.g., "I am reading this specific term because the court held that this word, unlike others, established severity on its own").
  5.  **No Gratuitous Repetition:** The term should be read only as many times as strictly necessary to make the legal point.

  **V. IMPLEMENTATION TIMELINE**

  *   **Immediate:** This guidance applies to all courses for the remainder of the current semester. Instructors currently teaching cases involving this issue should issue the advance warning at the next available opportunity.
  *   **Spring Semester:** The Handbook will be updated to reflect this policy. New faculty orientation will include specific training on handling sensitive case law under these guidelines.

  **VI. CONCLUSION**

  This policy attempts to thread the needle between our commitment to an inclusive environment and our obligation to teach the law as it exists, not as we wish it to be. We acknowledge that this will not satisfy everyone. Some will feel the safeguards are insufficient; others will feel they infringe on academic freedom. However, this framework ensures that when these words are spoken, they are done so with intention, necessity, and respect for the impact they carry.

  Respectfully submitted,

  The Classroom Climate Committee
