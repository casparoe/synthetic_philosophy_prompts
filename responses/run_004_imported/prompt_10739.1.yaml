answer: |-
  Your friend is referencing a real and well-studied area of game theory called **Mechanism Design**, specifically a sub-field known as **Partnership Dissolution**. While your skepticism is healthy and grounded in common sense, your friend is theoretically correct: there *are* rules that can break this deadlock without requiring trust or full disclosure, and they can guarantee that neither of you ends up worse off than the fallback option (selling on the open market).

  However, your intuition is also partially right: there are limits. No mechanism can magically create value if the house isn't worth more to one of you than the market price, and "guarantees" in game theory often come with technical caveats.

  Here is the breakdown of who is right, the theory behind it, and the specific practical tool you can use at the mediator's office next week.

  ### 1. The Theory: Why Your Friend is Right
  Your friend is likely thinking of a seminal paper by Cramton, Gibbons, and Klemperer (1987) titled *"Efficient Partnership Dissolution."*

  In standard bargaining (one buyer, one seller), a famous theorem (Myerson-Satterthwaite) proves that it is impossible to guarantee an efficient outcome without one party potentially losing out or requiring a subsidy. **However**, that theorem changes when **both parties already own a share** of the asset (like your 50/50 inheritance).

  Because you both already have an ownership stake, you both have a "property right" to a portion of the value. This dispersion of ownership allows for mechanisms that satisfy three conditions simultaneously:
  1.  **Incentive Compatibility:** It is in your best interest to bid honestly (no need to bluff).
  2.  **Individual Rationality:** You are guaranteed to do at least as well as your fallback option (selling on the market).
  3.  **Efficiency:** The person who values the house most ends up owning it.

  ### 2. The Practical Solution: The "Texas Shootout"
  The theoretical mechanisms described in academic papers can be complex, but in legal and business practice, this is solved using a **Buy-Sell Agreement**, often colloquially called a **"Texas Shootout."**

  This is a rule you can propose to your sister and mediator immediately. It requires no trust, no revelation of your true financial limits, and it protects you both from the "even split" fallback.

  #### How it Works
  1.  **The Setup:** You agree that the fallback option is listing the house on the open market. You also agree on a method to determine the "Market Value" (e.g., the average of three independent appraisals). Let's call the value of *your half* of the house $M/2$.
  2.  **The Trigger:** One of you (say, you) names a price $P$ for the *entire* property.
  3.  **The Choice:** Your sister then has the option to either:
      *   **Buy** your share at price $P/2$ (meaning she pays you $P/2$ and keeps the house).
      *   **Sell** her share to you at price $P/2$ (meaning you pay her $P/2$ and you keep the house).
  4.  **The Safety Valve:** Crucially, you add a clause that **$P$ cannot be lower than the agreed Market Value.** If the price named is below market value, the mechanism voids, and the house goes to the open market (your fallback).

  #### Why This Solves Your Problem
  *   **It Forces Honesty:** If you name a price that is too low, your sister will exercise her right to **buy** you out cheaply. If you name a price that is too high, your sister will exercise her right to **sell** to you at that inflated price. Because you don't know which choice she will make, your optimal strategy is to name the price that reflects the *true* value of the house to you.
  *   **It Protects the Fallback:** By setting the floor at the Market Value, you guarantee that neither of you receives less cash than you would have from a public sale.
  *   **It Captures the Surplus:** If you value the house at \$600k and the market value is \$500k, and your sister values it at \$450k:
      *   You name a price around \$600k.
      *   Your sister sees \$600k is higher than her value (\$450k) and higher than market (\$500k). She chooses to **sell**.
      *   You get the house. You pay her \$300k. She gets \$300k cash (which is \$50k more than the market split). You get the house for a price you are willing to pay.
      *   Both of you are better off than the fallback.

  ### 3. Addressing Your Skepticism
  You argued: *"Either the rule makes use of information... or it makes no use of that information at all."*

  The Texas Shootout makes use of information, but it **verifies** it through action rather than words. You don't have to *tell* your sister you value the house highly; you demonstrate it by being willing to name a high price, knowing she might force you to pay it. It converts "cheap talk" (offers through a mediator) into "costly signals" (binding financial commitments).

  You also worried about the "guarantee."
  *   **Your Instinct:** If both of you value the house *less* than the market price (e.g., it's a money pit), no mechanism can force a buyout that is better than selling it.
  *   **The Fix:** This is why the **Market Value Floor** is essential. If neither of you values the house above market price, the mechanism triggers the fallback (public sale), satisfying the condition that no one is worse off.

  ### 4. Recommendation for the Mediator
  Your stalemate is costing you money (mediator fees, taxes, maintenance). You should propose the following framework at your next meeting:

  1.  **Establish the Baseline:** Agree on a process to determine the current Fair Market Value (FMV) of the house immediately (e.g., 3 appraisals averaged).
  2.  **Propose the Clause:** "We propose a binding Buy-Sell provision. One party names a price for the whole property, which must be at least 100% of the FMV. The other party chooses to buy or sell at half that price."
  3.  **Decide Who Names the Price:** Since you want to buy it, you might volunteer to name the first price. However, to be perfectly fair, you could flip a coin to see who names the price.
  4.  **Stop the Bleeding:** Make this agreement contingent on closing within 60 days to stop the accrual of taxes and fees.

  ### Verdict
  **Your friend is right.** There is a genuine, non-trivial sense in which you can reach an arrangement that requires no trust, reveals no private information, guarantees you won't do worse than the market split, and allows you to do better if your valuations differ.

  **Your instinct is also right** to be wary of *simple* negotiations, because without a binding mechanism like the Texas Shootout, honesty is indeed punished.

  By moving from "negotiating a price" to "agreeing on a rule to determine the price," you bypass the need for trust. You can walk into the mediator's office and say: *"We don't need to agree on a number. We just need to agree on the rule that finds the number."*

  **Suggested Rule:**
  > "We will obtain three independent appraisals to set a Market Floor. I will name a buyout price at or above that Floor. My sister then chooses whether to sell her half to me at that price, or buy my half from me at that price."

  This ends the game of chicken and puts the solution in your hands.
