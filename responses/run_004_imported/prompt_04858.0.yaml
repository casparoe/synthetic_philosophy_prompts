      *   *Is IIA always bad?* No, it provides strategic stability. If I remove an option I wasn't going to take, why should the deal change? It prevents manipulation of the agenda. I need to present the strength of IIA too.
      *   *Climate Justice:* This is the user's hook. I must tie it back to "equitable burden-sharing."

  8.  **Final Polish:** Check for clarity, flow, and ensure all parts of the prompt are answered. (Compare solutions, compare axioms, give normative judgment, address Gauthier, address consensus).

      *(Self-Correction during drafting)*: Make sure to distinguish between *strategic* justification (Nash emerges from alternating offers) and *axiomatic/normative* justification (KS emerges from fairness principles). The user is asking about the normative principle of *fairness*, so lean into that.

  9.  **Final Output Structure:**
      *   Intro: Welcome to the club, validate the Gauthier choice.
      *   Technical Confirmation: You got the geometry right.
      *   Axiom Comparison: IIA (Stability/Local) vs. Monotonicity (Opportunity/Global).
      *   The Gauthier Link: Confirm MRC $\approx$ KS.
