      *   *Conclusion:* In modern economics, "preference" is mostly a summary of choices + constraints. But to explain *why* the choices happen (especially when definitions get tricky), we implicitly assume mental states. So, "really prefers" is mostly a summary, but a useful one that hints at underlying psychology.

