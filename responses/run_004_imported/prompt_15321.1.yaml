  2.  **Deconstruct the Economic/Philosophical Concepts:**
      *   **Revealed Preference Theory (RPT):** Developed by Paul Samuelson. The idea is to derive preferences from observed choices without assuming internal utility functions.
      *   **Weak Axiom of Revealed Preference (WARP):** If bundle A is chosen when bundle B is available, then in any other situation where both are available, B cannot be chosen unless A is unavailable.
      *   **Individuation of Goods/Options:** How do we define what the "options" are? Is a latte on Monday the same good as a latte on Friday? Is a latte the same good as a latte + pastry?
      *   **Falsifiability:** Can the theory be proven wrong? If we can redefine goods to fit any behavior, is it science?
      *   **Behaviorism vs. Mentalism:** RPT was originally behaviorist (choices = preferences). Modern economics often accepts underlying mental states (utility) as the *cause* of choices.

