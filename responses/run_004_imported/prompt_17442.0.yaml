  **Negative Utilitarian:** Better irrational by your decision theory than immoral by my moral axioms. If decision theory demands I accept torture to avoid infinite dust specks, then decision theory needs to accommodate lexical values, not the other way around.

  **Classical Utilitarian:** Fair, but in practice, under empirical uncertainty, don't our views converge? If you're unsure whether an action causes threshold suffering, you maximize expected value, which looks suspiciously like classical utilitarianism.

  **Negative Utilitarian:** Only if you assume symmetric risk. I apply a precautionary principle: the disvalue of risking lexical suffering outweighs the potential value of lexical pleasure, because lexical pleasure doesn't exist on my view.

  **Classical Utilitarian:** So you're a risk-averse maximizer. But if the probability of threshold suffering is low enough, you'd accept the trade-off. At that point, aren't you just doing cost-benefit analysis with a high weight on pain?

  **Negative Utilitarian:** No, because the weight isn't finite. It's not that pain is 1000x worse; it's that beyond point X, the utility function drops off the chart. You can't compensate for falling off a cliff with extra height elsewhere.

  **Classical Utilitarian:** But we can't measure 'falling off the cliff' precisely. Given measurement error, won't your policy look identical to mine in almost all real-world scenarios? We might be arguing over metaphysics that has no cash value.

  **Negative Utilitarian:** It has cash value in edge cases: prioritizing pain relief over pleasure creation in global health, or refusing technologies that risk extreme suffering for marginal happiness gains. The priority is different even if the math looks similar.

  **Classical Utilitarian:** So the disagreement isn't about the good itself, but about how to act under uncertainty regarding the good. You're saying my axiology is fine, but my risk profile is too neutral.

  **Negative Utilitarian:** I'm saying your axiology licenses the risk profile. If you truly believed suffering was lexically worse, you wouldn't be neutral. But maybe we're just pinning different labels on the same precautionary impulse.

  **Classical Utilitarian:** Then perhaps we agree on the practice but disagree on the justification. Or maybe we're both trying to formalize a moral intuition that resists formalization entirely.

  **Negative Utilitarian:** Exactly. We're arguing whether the map is wrong or the territory is unmappable. Until we know if value is continuous or discontinuous, we're both guessing at the decision rule.
