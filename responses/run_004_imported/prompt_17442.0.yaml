  **Classical Utilitarian:** Even if there's a break, if a future civilization faces inevitable, widespread threshold-level suffering, wouldn't your view mandate destroying them to prevent it? You're still committed to benevolent world-explosion in specific cases.

  **Negative Utilitarian:** I distinguish between preventing suffering and destroying sufferers. My view prioritizes alleviating the suffering, not eliminating the subject. The constraint against killing is a side-constraint, not just a calculation of net suffering.

