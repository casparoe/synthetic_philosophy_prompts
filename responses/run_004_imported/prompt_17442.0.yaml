  **Negative Utilitarian:** That's the Very Repugnant Conclusion in disguise. You're saying quantity can wash out quality. If welfare is just a scalar, you lose the distinction between a life worth living and a life that is a net burden, provided the sum is high enough.

  **Classical Utilitarian:** I don't lose the distinction; I just weigh it differently. A life of net suffering is negative, yes. But if adding millions of barely-happy lives outweighs the torture, that's a hard truth of maximizing total good, not a bug.

  **Negative Utilitarian:** It's a bug because it violates the separateness of persons. You're treating humanity as a single vessel for utility paste. My lexical view respects that some harms cannot be distributed across others to be nullified.

