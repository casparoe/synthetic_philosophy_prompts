answer: |-
  This is a sophisticated theoretical framing that cuts to the normative core of psychiatric advance directives (PADs). By mapping the "Ulysses contract" onto constitutional precommitment theory, you illuminate the tension between *diachronic autonomy* (the authority of the past competent self) and *contemporaneous sovereignty* (the authority of the present self, even if impaired).

  The constitutional literature, particularly following Elster, Holmes, and the debates between Jefferson and Madison regarding the "dead hand" of the past, offers three critical implications for the design and enforcement of psychiatric Ulysses contracts. Crucially, regarding your specific question on the disanalogy of personal identity: **the continuity of the self does not fully immunize the Ulysses contract from the "dead hand" objection, but it does shift the burden of proof regarding when enforcement is legitimate.**

  Here is an analysis of the implications for your dissertation chapter, structured by theoretical problem and normative application.

  ### 1. The Metaphysics of the Bound Self: Continuity vs. Rupture
  **The Constitutional Problem:** In constitutional theory, the "dead hand" objection rests on the discontinuity of the sovereign. The founding generation is distinct from the current electorate; therefore, binding the latter without their consent is democratically illegitimate (Jefferson's argument that "the earth belongs to the living").

  **The Psychiatric Disanalogy:** In PADs, the binder and the bound are biologically and legally the same person. Proponents argue this continuity validates the contract: it is not one generation binding another, but one temporal stage of an agent binding a future stage to preserve the agent's long-term values (Dworkin's "critical interests").

  **Implication for Enforcement:**
  However, the constitutional analogy reveals that *biological* continuity is insufficient for *normative* continuity. If a psychiatric crisis (e.g., severe mania or psychosis) alters the patient's fundamental value structure, preferences, and phenomenological experience of the world, the "crisis self" may be as discontinuous from the "competent self" as one generation is from another. Rebecca Dresser's critique of PADs relies on this: if the illness changes *who* the patient is, enforcing the prior directive is tyrannical.

  *   **Design Recommendation:** You cannot rely on the mere existence of a signature to prove continuity. Enforcement mechanisms must include a **continuity-of-values assessment**. Before enforcing a Ulysses contract against contemporaneous refusal, an independent adjudicator (not just the treating physician) should assess whether the current refusal stems from the pathology (the "Sirens") or from a genuine, albeit impaired, shift in values. If the latter, the "dead hand" objection holds within the single life, and the contract should yield.

  ### 2. The Problem of Absolute Entrenchment (Irrevocability)
  **The Constitutional Problem:** A constitution that is perfectly entrenched (impossible to amend) is incompatible with popular sovereignty. Even the U.S. Constitution, designed for stability, includes Article V for amendments. Absolute precommitment is viewed in political theory as a form of suicide for the sovereign; a sovereign that cannot change its mind ceases to be sovereign.

  **The Psychiatric Disanalogy:** The specific subclass of Ulysses contracts you are studying involves *forfeiting the right to revoke*. This is the psychiatric equivalent of a constitution without an amendment clause.

  **Implication for Enforcement:**
  The constitutional literature suggests that absolute irrevocability is normatively dangerous, even if precommitment is justified. The justification for precommitment is to overcome *akrasia* (weakness of will), not to eliminate agency entirely. If the "crisis self" retains even marginal capacity, absolute irrevocability treats the patient as a mere object of the past self's will.

  *   **Design Recommendation:** Move from "Hard" to "Soft" Ulysses Contracts. Instead of a total forfeiture of the right to revoke, design contracts with **super-majority revocation clauses**.
      *   *Analogy:* Just as a constitutional amendment requires more than a simple majority, revoking a Ulysses contract should require more than a simple contemporaneous refusal.
      *   *Mechanism:* Revocation during a crisis should require the concurrence of the patient *plus* an independent patient advocate *plus* a second psychiatric opinion confirming that the refusal is not a direct symptom of the crisis (e.g., paranoia about medication). This preserves the precommitment's force while acknowledging the sovereign status of the present self.

  ### 3. Interpretive Authority and the "Trigger" Mechanism
  **The Constitutional Problem:** Who decides when the emergency powers are triggered? In political theory, the risk of "constitutional dictatorship" arises when the executive branch self-certifies the emergency required to suspend rights.

  **The Psychiatric Disanalogy:** In psychiatry, the treating physician often holds the dual role of beneficiary (they want to treat) and adjudicator (they decide if the crisis criteria are met).

  **Implication for Enforcement:**
  The constitutional literature warns against self-judging triggers. If the agent who benefits from the suspension of rights also defines the emergency, abuse is structurally incentivized.

  *   **Design Recommendation:** **Separation of Powers in Clinical Enforcement.** The decision to invoke the Ulysses contract (the "trigger") must be separated from the treatment team.
      *   *Mechanism:* Utilize a specialized review board or a designated "Ulysses Guardian" (distinct from the treating psychiatrist) to certify that the specific conditions outlined in the directive (e.g., "when I stop sleeping and believe I am the prophet") are objectively met. This mirrors the role of a Constitutional Court in reviewing the invocation of emergency powers.

  ### Addressing Your Core Question: Does the Disanalogy Undermine Enforcement?

  You asked whether the disanalogy between personal continuity and generational discontinuity undermines the case for enforcing these contracts against contemporaneous refusal.

  **The Argument:**
  The disanalogy does not *undermine* the case entirely, but it *qualifies* it.
  1.  **Strengthens:** Because it is the same biological entity, we have a stronger prima facie duty to respect the long-term narrative unity of the life (Dworkin) than we do to respect the preferences of a past political generation. The "sovereign" is enduring.
  2.  **Weakens:** However, if the psychiatric condition creates a *functional* discontinuity (a rupture in rationality and identity), the moral force of the "same person" argument evaporates. In those moments, the patient is effectively a "different generation" inhabiting the same body.

  **Conclusion for the Chapter:**
  Therefore, the constitutional analogy suggests that **enforcement should not be binary (enforce vs. ignore) but procedural.**
  *   In constitutional law, we do not ask "Is the Constitution valid?" We ask "Was the proper procedure followed to amend or interpret it?"
  *   Similarly, in psychiatric Ulysses contracts, the question should not be "Is the past self sovereign?" but "Did the procedural safeguards ensure that the current refusal is indeed the 'Siren song' of illness rather than a legitimate constitutional amendment by the present self?"

  **Summary of Design Implications:**
  1.  **Sunset Clauses:** Like emergency powers, Ulysses contracts should expire after a set period unless re-ratified by the competent self (preventing the "dead hand" from ruling indefinitely).
  2.  **Specificity Requirements:** Vague precommitments (e.g., "treat me if I'm sick") are like vague constitutional clauses prone to abuse. Directives must specify the *exact* symptoms and treatments authorized (narrow tailoring).
  3.  **Procedural Hurdles for Revocation:** Do not ban revocation; make it difficult enough to filter out *akrasia* but possible enough to respect residual sovereignty.

  By framing the Ulysses contract not as a waiver of rights but as a **constitutional structure for the self**, you can argue that the goal is not to silence the crisis self, but to ensure that the "laws" governing the crisis are legitimate, stable, and resistant to the temporary passions of the episode.
