prompt: |-
  I'm the CTO at a small startup and I sit on the committee deciding how far to keep going in a bidding war to acquire another startup for its team. We lost a similar bidding war to this same rival last year. Our offer used to match our own internal valuation of the target; after several rounds of back and forth we're now 40% over that number, and we've already burned $250k in legal/diligence fees that we lose no matter what happens. Half the committee wants to raise again -- "we're already this deep, no point loosing that 250k for nothing" -- and the other half wants to walk. Someone joked this is basically the dollar auction thing from that game theory post everyone shared a while back, except "lol sunk cost fallacy" doesn't feel like the full answer here, since there's an actual live competitor still bidding against us, and the founders of the company we're fighting over come out ahead either way, which feels relevant but I can't say why. Write me the memo I'd bring to the committee: a clear recommendation (raise, hold, walk, or something else), a concrete stopping rule, and honest engagement with the "we're already this deep" argument instead of just waving it off as a bias.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** CTO at a small startup.
      *   **Audience:** Acquisition Committee (mixed opinions: 50% raise, 50% walk).
      *   **Situation:** Bidding war for a startup (acqui-hire focus). Rival won a similar war last year. Current offer is 40% above internal valuation. $250k sunk cost in fees.
      *   **Key Conflict:** Sunk cost fallacy ("we're already this deep") vs. Rational Economic Decision.
      *   **Specific Nuance:** The user recognizes the "Dollar Auction" game theory dynamic but feels "sunk cost" is too simplistic because there's a live competitor and the target founders win either way.
      *   **Deliverable:** A memo with a clear recommendation, a concrete stopping rule, and honest engagement with the sunk cost argument.

  2.  **Deconstruct the Game Theory & Economics:**
      *   **The Dollar Auction:** A game where the highest bidder wins the dollar, but the *second* highest bidder also pays their bid. This creates a trap where bidders keep raising to avoid losing the sunk cost.
      *   **The Current Situation:** This isn't a pure Dollar Auction because the loser *doesn't* pay their bid. They only lose the due diligence fees ($250k). However, the psychological pressure is similar.
      *   **Sunk Cost:** The $250k is gone. It should not influence the marginal decision of the next bid.
      *   **Winner's Curse:** Winning at 40% over valuation means overpaying. In an acqui-hire, this inflates salary expectations for the rest of the company and sets a bad precedent.
      *   **Competitor Dynamics:** The rival won last year. Do we *need* this team to catch up? Or is this ego?
      *   **Target Founders:** They are auctioneers in this scenario. They benefit from the war. Their incentive is to keep us in the room.

  3.  **Formulate the Recommendation:**
      *   *Raise?* No. 40% over valuation is dangerous for a small startup. Cash burn is critical.
      *   *Hold?* Meaning make a "Best and Final" offer. This is usually the strongest position.
      *   *Walk?* Eventually, if "Best and Final" is rejected.
      *   *Decision:* **Make a "Best and Final" offer (Hold the line), then Walk.** This acknowledges the effort without falling into the infinite escalation trap.

  4.  **Address the "We're Already This Deep" Argument:**
      *   Don't dismiss it as "bias." Acknowledge the pain.
      *   Reframe it: Spending another $1M to save $250k is bad math.
      *   The "Deep" argument is actually about *reputation* and *morale*, not just money. We need to address those.
      *   The real cost isn't the $250k; it's the *opportunity cost* of the capital and time spent on the next round.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Clear recommendation upfront. (Best & Final, then Walk).
      *   **The Situation:** Briefly recap numbers (40% over, $250k sunk).
      *   **The Game Theory (The "Dollar Auction" Nuance):** Address the user's specific insight. It's not just sunk cost; it's about the *rivalry*. But we must recognize the rival might be suffering from the same bias.
      *   **Addressing the "Deep" Argument:** Validate the feeling. $250k hurts. But explain the marginal cost. If we pay $X more to win, does the value justify it?
      *   **The "Founder Windfall" Factor:** The target founders are playing us. Acknowledge this. It changes the dynamic from "partnership" to "auction."
      *   **Strategic Risks:** Acquihire integration risks at inflated prices. Culture shock. Salary compression.
      *   **The Stopping Rule:** Define the exact trigger to walk.
      *   **Conclusion:** Final call to action.

  6.  **Refining the Tone:**
      *   Needs to be executive, decisive, but empathetic.
      *   Avoid academic jargon where possible, but use the game theory correctly.
      *   Show understanding of the startup context (cash preservation, team morale).

  7.  **Self-Correction/Iterative Thought during Drafting:**
      *   *Initial thought:* Just say "Walk away."
      *   *Correction:* That might be too abrupt for a committee 50% invested in winning. A "Best and Final" offer gives a dignified exit and tests the seller's resolve. It's a tactical pause before the walk.
      *   *Addressing the Rival:* The user mentioned losing to this rival last year. This suggests an ego component. I need to gently call out that "beating the rival" isn't a business strategy.
      *   *Addressing the Target:* The user noted the founders come out ahead. I need to highlight that if they *really* wanted us, they'd signal it. If they just want money, they are commoditizing themselves.

  8.  **Final Polish:** Check the stopping rule. It needs to be binary and unambiguous. "If they counter, we walk."

  9.  **(Post-Drafting Review against constraints):**
      *   Clear recommendation? Yes (Best & Final).
      *   Concrete stopping rule? Yes (No counters).
      *   Honest engagement with sunk cost? Yes (Reframed as marginal utility).
      *   Tone appropriate for CTO to Committee? Yes.

  10. **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Acquisition Committee
  **FROM:** [Your Name], CTO
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on [Target Company] Bidding Strategy

  ### Executive Summary

  We are currently in a bidding war for [Target Company] at a price point 40% above our internal valuation cap. We have incurred $250k in non-recoverable diligence costs. Half the committee advocates for increasing our offer to protect that investment; the other half advocates for walking.

  **Recommendation:** I recommend we submit a **single "Best and Final" offer** at our current level (or a nominal increase to signal seriousness, but within our original valuation cap). If this offer is not accepted unconditionally within 72 hours, **we walk.**

  We must not raise our bid further. Doing so converts a contained loss ($250k) into a strategic liability that threatens our runway and compensation equity.

  ### The "Deep in the Hole" Argument

  I want to address the argument that "we are already $250k deep; we can't let that go to waste." This is not merely a cognitive bias; it is a legitimate concern about resource efficiency and committee credibility. However, we must analyze this through **marginal utility**, not historical accounting.

  The $250k is gone. It purchases nothing but information. The decision we face now is not "Do we lose $250k or win the deal?" The decision is: **"Do we spend an *additional* $X million to acquire an asset we have already determined is not worth $X million?"**

  If we raise our bid by $1M to "save" the $250k, we are effectively spending $1M to recover 25 cents on the dollar. That is bad capital allocation. The pain of writing off the $250k is real, but it is a one-time hit. Overpaying for the acquisition is a recurring hit: it inflates the target team's salaries, creates resentment among our legacy employees (salary compression), and sets a dangerous precedent for future acqui-hires.

  ### The Game Theory: Dollar Auction vs. Live Competitor

  Several of you have referenced the "Dollar Auction" game theory scenario. In that model, the second-highest bidder must pay their bid but gets nothing. While we don't have to pay our bid if we lose, the psychological dynamic is identical: **escalation of commitment to avoid loss.**

  However, there is a nuance specific to our situation: **The Rival and The Target.**

  1.  **The Rival:** We lost to this same competitor last year. There is an emotional desire to "win" this time. But beating a rival is not a business strategy. If they are willing to overpay by 40%+, they are likely suffering from the same escalation bias. Let them have the asset at that price. In the current market, overpaying for talent is a greater risk than losing talent.
  2.  **The Target Founders:** As noted, the founders win either way. In a two-bidder auction, the seller's incentive is to keep both biders active as long as possible. If they truly preferred us culturally or strategically, they would have signaled that to end the auction. The fact that they are allowing a 40% premium war suggests they are maximizing price, not partnership fit. We are not buying partners; we are buying a commodity in an auction.

  ### Strategic Risks of Winning at This Price

  If we win this bid at 40% over valuation, we face three concrete downstream risks:

  1.  **Integration Friction:** A team brought in at a 40% premium knows they are expensive. This creates a class system within engineering. Our current high performers will notice.
  2.  **Runway Impact:** For a startup of our size, this premium represents [X] months of runway. That is capital we cannot deploy for product development or marketing.
  3.  **Signaling:** If word gets out (and it will) that we engaged in a bidding war and overpaid, we invite speculation that we are desperate. If we walk, we signal discipline.

  ### The Stopping Rule

  To prevent "just one more round" syndrome, I propose the following binding stopping rule:

  1.  **The Offer:** We submit a "Best and Final" offer at $[Amount]. This amount is based on our original internal valuation, potentially adjusted only for new information discovered in diligence (not for competitive pressure).
  2.  **The Condition:** The offer is valid for 72 hours.
  3.  **The Trigger:** If the Target counters, asks for more time, or indicates the competitor has beaten this number, **we terminate negotiations immediately.**
  4.  **The Announcement:** We inform the Target that while we admire their tech, the economics no longer make sense for our shareholders. We wish them well.

  ### Conclusion

  Writing off $250k is painful. But it is the cost of doing business, similar to a failed product sprint or a marketing campaign that didn't convert.

  If we raise again, we are no longer buying a team; we are buying the right to say we didn't lose. That is an expense our cap table cannot justify. I ask the committee to authorize the "Best and Final" approach so we can close this chapter, preserve our capital, and refocus on building our own product.

  **Decision Required:** Approval to submit Best and Final offer as described above.
