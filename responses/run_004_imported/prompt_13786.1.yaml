answer: |-
  Your intuition is correct, and your friend has fallen into a very common interpretive trap regarding Jain philosophy. The charge that *anekāntavāda* (the doctrine of many-sidedness) entails thoroughgoing relativism is one of the oldest and most persistent objections raised against Jainism, but classical Jain logicians had sophisticated mechanisms specifically designed to prevent this collapse.

  To answer your question directly: **No, *anekāntavāda* does not amount to relativism about truth.** It is better understood as **perspectival realism**.

  The mechanism that prevents the slide into relativism lies in the distinction between a valid *naya* (standpoint) and a *nayābhāsa* (fallacious standpoint), governed by the ontological structure of reality and the logical syntax of *syādvāda*. Here is how the doctrine rules out rival standpoints without abandoning pluralism.

  ### 1. The Distinction Between Partial Truth and Absolute Error
  The core of your friend's relativist argument is the assumption that if a view captures *some* aspect of reality, it must be accepted as "true from its own standpoint." Jainism agrees that rival systems often capture *aspects* of reality, but it denies that this makes their philosophical *conclusions* valid.

  For the Jains, error (*mithyātva*) does not usually arise from seeing something that isn't there; it arises from **taking a part for the whole** (*ekānta*).

  *   **Valid *Naya*:** "In terms of its modifying states (*paryāya*), the soul is changing." (This is a valid partial truth).
  *   **Fallacious *Ekānta*:** "The soul is *only* changing (and has no permanent substance)." (This is the error).

  The Buddhist doctrine of momentariness (*kṣaṇikavāda*) or the Nyāya-Vaiśeṣika doctrine of absolute permanence are not rejected because they see nothing true. They are rejected because they elevate a partial perspective into an absolute ontological claim. Relativism says, "Permanence is true for Nyāya, Momentariness is true for Buddhists." Jainism says, "Permanence (of substance) and Momentariness (of modes) are both objectively real features of the same entity; to deny either is to contradict reality itself."

  Therefore, a standpoint is not judged by its internal coherence alone (as in relativism), but by its **correspondence to the complex structure of the object.**

  ### 2. The Filter of *Nayābhāsa* (Fallacious Standpoints)
  You asked specifically what within the doctrine rules standpoints out. The technical answer is the theory of *nayābhāsa*.

  Jain logicians (such as Haribhadra and Hemacandra) classified *nayas* rigorously. A *naya* is a method of interpreting speech or reality. However, a *naya* becomes a *nayābhāsa* (a semblance of a standpoint, i.e., a fallacy) when it violates specific conditions.

  A standpoint is ruled out if:
  1.  **It contradicts direct perception (*pratyakṣa*):** If a standpoint claims nothing exists, but we perceive existence, it is fallacious.
  2.  **It contradicts the established nature of substance (*dravya*):** Reality is defined as characterized by origination, destruction, and permanence (*utpāda, vyaya, dhrauvya*). Any system that denies one of these three is objectively wrong, not just "differently right."
  3.  **It claims exclusivity:** This is the most important criterion. A *naya* is valid only as long as it acknowledges it is a *naya*. The moment a *naya* claims to be the *only* truth, it self-destructs into *nayābhāsa*.

  So, when a Jain argues against a rival, they are not saying, "Your standpoint is invalid because it is yours." They are saying, "Your standpoint is invalid because it claims exclusivity where there is none." This is an objective logical critique, not a relativistic accommodation.

  ### 3. *Syādvāda* as Logical Syntax, Not Hesitation
  Your friend likely interprets *syādvāda* (the doctrine of conditioned predication) as meaning "maybe" in the sense of uncertainty or subjective opinion. In classical Jain logic, *syāt* does not mean "maybe"; it means **"in some respect"** or "from a specific ontological perspective."

  *Syādvāda* functions as a logical syntax that forces the speaker to specify the conditions of their truth claim.
  *   **Relativist claim:** "X is true for me."
  *   **Jain claim:** "In respect to substance, X is; in respect to mode, X is not."

  If a rival philosopher asserts, "The world is eternal," without qualifying the respect (substance vs. mode), the Jain logician uses *syādvāda* to demonstrate that the proposition is logically incomplete. If the rival insists on the unqualified assertion, they are not presenting a "different truth"; they are committing a logical error akin to saying "This circle is square."

  *Syādvāda* is the tool used to demonstrate that the rival's position is **incomplete**, not merely **different**. In Jain epistemology, an incomplete description of reality that is asserted as complete is false.

  ### 4. The Ontological Anchor
  Relativism typically lacks an ontological anchor; it suggests reality is constituted by our views of it. Jainism is firmly realist. Reality (*sat*) exists independently of our knowledge of it.

  The Jain metaphysical structure (Substance (*dravya*), Quality (*guṇa*), and Mode (*paryāya*)) provides the objective standard against which all *nayas* are measured.
  *   If a philosophical system aligns with the triad of origination, destruction, and permanence, it is provisionally accepted as a valid *naya*.
  *   If it denies this triad (e.g., by claiming only permanence exists, or only destruction exists), it is rejected as *mithyātva* (false belief).

  Because there is an objective reality with a specific structure, there is an objective standard for truth. *Anekāntavāda* is the admission that human language and cognition are finite and cannot grasp that infinite structure all at once, not the claim that the structure itself is fluid.

  ### 5. The Soteriological Stake
  Finally, the strongest argument against the relativist interpretation is soteriological. The entire purpose of Jain philosophy is the cessation of karma and the attainment of liberation (*mokṣa*).

  *   **Karma** is bound by wrong belief (*mithyātva*).
  *   **Liberation** is achieved by right belief (*samyaktva*).

  If *anekāntavāda* were thoroughgoing relativism, then *mithyātva* and *samyaktva* would be equally valid standpoints. If all views are equally true from their own perspective, then the view "Karma does not exist" is just as valid as "Karma exists." If that were the case, liberation would be impossible, or everyone would already be liberated.

  The fact that Jainism posits a path from bondage to freedom implies that some views are objectively binding and others are objectively freeing. A view that denies the law of karma is not "true from its own standpoint"; it is a dangerous error that keeps one in *saṃsāra*.

  ### Summary for Your Argument
  To resolve your argument with your friend, you might frame it this way:

  1.  **Relativism** claims truth is relative to the subject or system, with no objective standard to judge between them.
  2.  **Anekāntavāda** claims reality is objective and complex, and truth is the accurate mapping of that complexity.
  3.  **The Exclusion Mechanism:** A standpoint is ruled out not because it is "rival," but because it violates the **law of non-contradiction regarding the whole**. To assert a part as the whole is an objective error (*nayābhāsa*), not a subjective alternative.
  4.  **The Stakes:** If Jainism were relativistic, the distinction between bondage and liberation would collapse. Since Jainism maintains that distinction, it must maintain that some views are objectively false.

  Your friend has confused **epistemic humility** (admitting our view is partial) with **ontological relativism** (claiming reality has no definite nature). Jainism demands the former to avoid the latter.

  **Recommended Reading for Backup:**
  If you want to press the textual authority, point to the *Tattvārtha Sūtra* (1.33-35), which defines wrong belief, or Haribhadra's *Anekāntajayapatākā*, which explicitly uses *anekāntavāda* to critique Buddhist and Nyāya metaphysics as one-sided errors, not valid alternatives. B.K. Matilal's *The Central Philosophy of Jainism* is also the standard modern scholarly work that dismantles the relativist interpretation.
