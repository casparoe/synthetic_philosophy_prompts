              *   *Syād nāsti* (In some respect, it is not).
              *   *Syād avaktavya* (In some respect, it is inexpressible).
              *   Crucially: The conditions must be specified. If you assert *asti* without qualification, it is false.

      *   **Ontological Grounding:**
