      *   **The Endurantist Move (Zimmerman):** Focus on instantaneous velocity as a primitive property/power. Address the "substance" worry.
      *   **The Perdurantist Move (Lewis):** Focus on temporal parts and the shape of the worm. Explain Lewis's concession regarding velocity.
      *   **The Humean Supervenience Crash:** Explain why this is the real battleground.
      *   **Verdict:** It's a wash regarding persistence, but a loss for Humean Supervenience.
      *   **Conclusion:** Tie back to the physicist's intuition (Phase Space).

  9.  **Tone Check:** Ensure I don't talk down about the physics. Use terms like "phase space," "Lagrangian," "initial conditions." Ensure I don't oversimplify the metaphysics (distinguish between HS and Perdurantism).

  10. **Final Polish:** Check names and titles. Zimmerman's paper is "The Coherence of Endurantism" (1996) or similar discussions. Lewis's reply is "Zimmerman and the Spinning Sphere" (1999/2000). Broad's "Scientific Thought" (1923). Leibniz's correspondence with Clarke. (Make sure to reference these correctly).

  *(Self-Correction during drafting)*: I need to be careful not to say Lewis *lost*. He adapted. But the adaptation costs HS. Zimmerman argues Endurantism handles it more naturally *if* you accept powers. I need to present the trade-off clearly.

