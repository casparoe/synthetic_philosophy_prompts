answer: |-
  It is a pleasure to speak with someone who actually understands the physics of the situation. Too often, this debate is mangled by philosophers who treat "rotation" as a mere linguistic puzzle rather than a dynamical state defined by angular momentum and stress tensors. You are correct that the Rotating Disc Argument (RDA) is not about caterpillars; it is a stress test for **Humean Supervenience (HS)** and the ontology of time.

  Given your background, I will skip the introductory fluff. You understand that in classical mechanics, the state of a system at time $t$ is not defined solely by configuration space ($q$) but by phase space ($q, p$). The RDA essentially asks: *Can a metaphysics of persistence account for the $p$ (momentum/velocity) component if it tries to reduce everything to the $q$ (position/quality) component at an instant?*

  Here is the mechanical breakdown of how Endurantism (Zimmerman) and Perdurantism (Lewis) attempt to solve this, and where the bodies are buried.

  ---

  ### 1. The Endurantist Solution (Dean Zimmerman)

  **The Position:** The disc is wholly present at $t$.
  **The Problem:** If the disc is wholly present, and its intrinsic qualitative properties (mass distribution, shape, texture) are identical in the static and rotating cases, what grounds the difference in kinetic energy?

  **The Move:**
  Zimmerman argues that **instantaneous velocity (and by extension, rotation) is a genuine, intrinsic property of the object at $t$.**

  For a physicist, this feels natural. In Lagrangian mechanics, velocity is a coordinate in the state space. But for a strict empiricist or Humean, velocity is a derivative: $v = dx/dt$. It is a relation between positions at $t$ and positions at $t \pm \epsilon$. If you only have the slice at $t$, the derivative is undefined.

  Zimmerman bites the bullet: Velocity is not merely a relation between temporal locations; it is a **vector property inherent to the matter at the instant.**
  *   **Static Disc:** Has mass $m$, radius $r$, velocity vector $\vec{v} = 0$ at every point.
  *   **Rotating Disc:** Has mass $m$, radius $r$, velocity vector $\vec{v} \neq 0$ (tangential) at every point.

  **Does this relocate the mystery to "substance"?**
  You asked if this is just hiding the mystery in an unanalyzed "substance." In a sense, yes, but Zimmerman would reframe it as **causal powers**.
  The endurantist claims the matter possesses a *disposition* or *power* at $t$ to occupy different positions at $t + \epsilon$. This is not a "ghostly substance"; it is a commitment to **Anti-Humeanism**. It asserts that the qualitative snapshot does *not* exhaust the ontology of the instant. There are "dynamic properties" (momentum, angular velocity) that are real features of the present, not just summaries of the past/future.

  **The Cost:**
  Endurantism solves the RDA easily *if* you abandon Humean Supervenience. It posits that the world contains more than just "local qualities arranged in spacetime." It contains "vectors" or "powers" at points. To a physicist, this looks like Phase Space realism. To a strict empiricist, it looks like occult qualities.

  ---

  ### 2. The Perdurantist Solution (David Lewis)

  **The Position:** The disc is a 4D "worm" composed of temporal parts.
  **The Problem:** If the disc is a worm, the difference between spinning and static should be visible in the *shape* of the worm in spacetime.
  *   **Static Worm:** A straight cylinder in spacetime.
  *   **Rotating Worm:** A twisted cylinder (a helix structure) in spacetime.

  **The snag (The Homogeneity Problem):**
  As you noted, if the disc is *homogeneous* (featureless), the "twist" is invisible. A temporal part at $t$ is a disc slice. A temporal part at $t + \epsilon$ is an identical disc slice. Because the matter is uniform, you cannot track *which* bit of matter moved *where*. The "helix" is empirically indistinguishable from the "cylinder" if you only look at the intrinsic qualities of the slices.

  **Lewis's Reply ("Zimmerman and the Spinning Sphere"):**
  Lewis initially wanted to maintain that velocity is *nothing over and above* the pattern of temporal parts (the shape of the worm). This preserves Humean Supervenience: everything supervenes on the arrangement of local qualities.
  However, the RDA forced Lewis into a corner. If the local qualities of the slices are identical, the arrangement is identical. Therefore, the worm shapes are identical *qualitatively*.

  Lewis's concession was subtle but significant. He admitted that to distinguish the worms, **instantaneous velocity must be treated as an intrinsic property of the temporal part.**
  He argued that a temporal part at $t$ has a property of *having a certain velocity*. This allows the perdurantist to distinguish the temporal parts of the rotating worm from the static worm, even if the matter is homogeneous.

  **The Cost:**
  This is a major retreat for the Humean-minded perdurantist.
  1.  **Loss of Reductionism:** Lewis effectively admitted that velocity cannot be fully reduced to the pattern of positions (the "at-at" theory of motion fails for homogeneous objects).
  2.  **Smuggling in Primitives:** You asked if they have to smuggle in "brute cross-time identities." Not exactly identities, but they must smuggle in **instantaneous dynamic properties**. If a temporal part has "velocity" as an intrinsic property, then Humean Supervenience (the idea that everything supervenes on *categorical* local qualities) is false. You need vector properties in the supervenience base.

  ---

  ### 3. The Verdict: Who Comes Out Ahead?

  If we judge this strictly on **internal coherence**, it is a **wash**. Both sides survive, but both must pay a tax that their foundational intuitions would prefer to avoid.

  **1. The Humean Supervenience Casualty**
  The real loser here is not Endurantism or Perdurantism, but **Humean Supervenience**.
  *   **Physics Reality:** As you know, the state of a mechanical system is not defined by $q$ alone, but by $(q, \dot{q})$.
  *   **Metaphysical Implication:** Any metaphysics that tries to reduce $\dot{q}$ (velocity/momentum) entirely to a history of $q$ (positions) will fail the RDA.
  *   **Result:** Both Lewis and Zimmerman ultimately agree that instantaneous velocity must be part of the fundamental ontology of the instant (or temporal part).

  **2. The Endurantist Advantage (and Disadvantage)**
  *   **Advantage:** Endurantism aligns better with the physicist's intuition of a "state at time $t$." In your lab, when you measure a gyroscope, you measure its angular momentum *now*. You don't need to wait for $t + \epsilon$ to verify it exists. Zimmerman's view codifies this: momentum is a property of the object *now*.
  *   **Disadvantage:** It requires a robust realism about "powers" or "vectors" that cannot be analyzed away into categorical qualities. If you are philosophically parsimonious (Occam's razor), positing invisible vector properties at every point feels like multiplying entities.

  **3. The Perdurantist Advantage (and Disadvantage)**
  *   **Advantage:** Perdurantism fits naturally with Special Relativity (block universe). The "worm" is the invariant object.
  *   **Disadvantage:** The RDA exposes a weakness in the "temporal parts" analogy. If temporal parts are truly independent existences (as Lewis sometimes suggested), how does one temporal part "know" it has velocity? Velocity is inherently a relation across time. By making velocity intrinsic to a temporal part, Lewis makes the temporal part less "slice-like" and more "state-like," blurring the line with endurantism.

  ### 4. Direct Answers to Your Specific Questions

  > *Does the endurantist really buy anything by insisting the disc is "wholly present" at every moment, or are they just relocating the same mystery into some unanalyzed notion of a persisting substance that "really" spins?*

  They are relocating the mystery, but they are buying **causal efficacy**.
  If you are a strict Humean, the "mystery" is that there is no difference at $t$. The Endurantist says: "The difference is the *power* to cause future displacement."
  Is it an unanalyzed substance? It depends. If you view "momentum" as a real physical quantity (which you do), then Endurantism treats it as a property of the *substance*. Perdurantism treats it as a property of the *temporal part*.
  The Endurantist buys the ability to say the object *itself* is the bearer of the momentum. The Perdurantist must say a *slice* of the object bears the momentum. Given that momentum is conserved across time, the Endurantist account of the *bearer* of that conservation is slightly more straightforward, but it comes at the cost of accepting "powers" as fundamental.

  > *Can the perdurantist keep both temporal parts and Humean supervenience here, or do they have to smuggle in something extra?*

  They **cannot** keep strict Humean Supervenience.
  Lewis realized this. To save Perdurantism from the RDA, he had to allow that the supervenience base includes **vector properties** (velocities) at points, not just categorical qualities (colors, shapes, masses).
  Once you admit vector properties into the base, you have conceded the main point of the RDA: **The instantaneous state is richer than the qualitative snapshot.**
  They do not need to smuggle in "cross-time identities" (which would be fatal to Perdurantism). They smuggle in **instantaneous velocities as primitives**. This saves the temporal parts ontology but sacrifices the reductionist dream that velocity is *just* a pattern of positions.

  ### Summary for a Physicist

  Think of it this way:
  *   **Configuration Space ($q$):** The qualitative snapshot (the "photo").
  *   **Phase Space ($q, p$):** The dynamical state (the "video frame with motion vectors").

  The RDA proves that **Persistence cannot be built on Configuration Space alone.** You need Phase Space.
  *   **Endurantism** says: The Object exists in Phase Space at every $t$.
  *   **Perdurantism** says: The Worm exists in Phase Space (each slice has a $p$-coordinate).

  **Who wins?**
  If you value **Relativity and Spacetime ontology**, Perdurantism wins, but you must accept that spacetime points have vector properties (tangent vectors) as fundamental, not derived.
  If you value **Dynamical States and Causal Powers**, Endurantism wins, but you must accept that objects have irreducible dispositions.

  **My assessment:** It is a wash regarding persistence, but a decisive victory for **Anti-Humeanism**. The RDA demonstrates that a universe of purely categorical, qualitative properties arranged in spacetime cannot account for rotation. Whether you stack those properties into 3D objects (Endurance) or 4D worms (Perdurance), you must admit that **velocity/momentum is a fundamental feature of reality**, not a derivative relation.

  Given your 30 years in gyroscopes, you likely find the idea that "angular momentum is real at an instant" obvious. The metaphysical dust-up exists only because philosophers tried to tell physicists that velocity is "just a relation between positions." The Rotating Disc Argument is essentially the physicists' revenge, proving that the state vector is ontologically fundamental.
