      *   *Does the moral transfer?* Yes. Both kill the "technocratic dream" that math can solve value conflicts.
      *   *Caveat:* In fairness, the conflict is often driven by *empirical reality* (base rates), whereas Arrow is driven by *logical structure* of preferences. This is a crucial distinction. In fairness, if base rates equalize (social intervention), the math works. In Arrow, even with "nice" preferences, the logic fails.

