      *   Special case? Yes (No).
      *   Moral licensing? Yes.
      *   No hedging? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the IIA mapping. IIA is about independence from other options. Calibration is about independence from group membership. It's a loose map. I should characterize it as "Context Independence."

