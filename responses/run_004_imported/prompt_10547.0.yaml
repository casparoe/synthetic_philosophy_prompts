prompt: |-
  I've spent the last few weeks reporting on why every recidivism-risk-scoring tool that courts adopt ends up in the exact same fight, and I keep coming back to the COMPAS/ProPublica saga as the cleanest example. ProPublica's investigation found the tool was flagging Black defendants who never went on to reoffend as "high risk" way more often than white defendants who never reoffended, while Northpointe (the company behind COMPAS) shot back that among people given any particular risk score, the actual reoffense rate was basically identical across races. The part that really got me is that both sides turn out to be right, and there's actual math behind it — the Kleinberg/Mullainathan/Raghavan paper and Chouldechova's paper, both from around 2016-17 — proving you can't have equal false-positive and false-negative rates across groups AND equal calibration within groups at the same time, unless the base rates of reoffending happen to be identical across those groups (they basically never are) or the model predicts with perfect accuracy.

  I mentioned all this to an economist friend over drinks and she just went "oh, that's Arrow's theorem for algorithms," like it was obvious, and now that line is stuck in my head and i can't tell if its a genuinely deep connection or just a cute rhetorical parallel. Could you actually walk through how far the resemblance goes between this fairness-impossibility result and Arrow's impossibility theorem from voting theory? I'm curious whether they rest on the same kind of structural assumption underneath (Arrow's independence-of-irrelevant-alternatives and unrestricted-domain conditions feel like they should map onto something on the fairness side, but I can't pin down what), whether one could honestly be described as a special case of the other or if that's forcing it, and whether the "this isn't an engineering bug, it's a forced value trade-off" moral everyone draws from the fairness result is a moral that Arrow's theorem actually supports too — or whether social-choice theory doesn't really license that reading and people are just borrowing its prestige. Don't hedge into "it's a bit of both" if you don't have to — I'd like your actual read on it.
