      *   **Event:** A researcher found a critical vuln, reported it privately (anonymous email), asked for no credit.
      *   **Status:** Vulnerability patched, no data exposed.
      *   **Dilemma:** The researcher is anonymous. There's no legal/reputational pressure to pay. One part of the user thinks keeping the money is "economically sensible" because the danger has passed. Another part feels uneasy.
      *   **Question:** Is declining to pay rational, or is the unease pointing to a flaw?

