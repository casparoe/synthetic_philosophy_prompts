answer: |-
  Here are eight interview questions designed to press the substance of the Model-Theoretic Argument without letting your guest retreat into a standard lecture. They are ordered to build tension, saving the Second-Order Logic objection for the close.

  ### 1. The Ontological Weight of Relativity
  **Question:** "Let's start with the engine of the paradox itself. The technical result is that a model can be countable from the 'outside' while satisfying the theorem 'there exists an uncountable set' on the 'inside.' Priya, my friend the mathematician, thinks this is just a lesson about the non-absoluteness of cardinality in first-order logic—a verbal trick about what 'uncountable' indexes to. If you want this to carry metaphysical weight against realism, you need more than a technical relativity. Precisely what is that gap between 'inside' and 'outside' doing philosophically? Why isn't it just a map/territory confusion where the map lacks the resolution to see the territory's true size?"

  *   **Follow-up:** "If he answers that truth is internal to the model: Press him on whether *existence* is equally internal. If the 'uncountable' set really is countable from the outside, are we forced to say the objects *themselves* are different, or just our description of them? If it's just the description, hasn't he conceded the realist point that the territory is fixed?"

  ### 2. The Generalization Gap (Skolem to Putnam)
  **Question:** "Skolem's original worry was local: it was about the limitations of *axiomatized* set theory. Putnam's Model-Theoretic Argument globalizes this to *all* discourse, including 'cat' and 'mat.' That's a massive leap. Skolem showed that formal constraints underdetermine the model. But ordinary reference seems constrained by causal interaction, not just sentences. What premise bridges the gap from 'formal theories have multiple models' to 'human reference is indeterminate'? Doesn't that generalization assume that our access to the world is *exhausted* by our theories, which is exactly what the realist denies?"

  *   **Follow-up:** "If he claims all access is theory-mediated: Ask him if the claim 'all access is theory-mediated' is itself a theory-mediated claim. If so, does that claim have a determinate reference? If not, why should we accept it?"

  ### 3. The "Just More Theory" Move vs. Lewis
  **Question:** "I want to press you on the 'just more theory' move. When a realist tries to fix reference by adding constraints—say, causal connections or perceptual links—you argue those constraints are just more sentences open to reinterpretation. But David Lewis argued that some properties are objectively more 'natural' than others, and reference latches onto the most natural eligible candidates. Naturalness isn't a sentence; it's a metaphysical feature of the world. Does your 'just more theory' move actually engage with Lewis, or does it just stipulate that naturalness is itself language-relative, thereby smuggling in the anti-realism you're trying to prove?"

  *   **Follow-up:** "If he says naturalness is theory-relative: Ask if that renders the concept of 'natural property' trivial. If 'natural' just means 'fits our current theory,' then isn't the Model-Theoretic Argument just a complicated way of saying 'we might change our minds'?"

  ### 4. Causal Constraints and the "Magic" Objection
  **Question:** "Putnam famously argued that even a 'magic theory' that includes all causal connections between words and objects can be permuted to fit a different model. But this relies on the idea that causal relations are just extensional relations between nodes in a model. In the real world, causation is a productive mechanism, not just a set of ordered pairs. Are you conflating the *model of causation* with *causation itself*? If I point at a cat and say 'cat,' isn't the physical causal chain doing work that no amount of model-permuting can break?"

  *   **Follow-up:** "If he says the causal chain is just more structure to be modeled: Ask him to explain how we distinguish between *using* a model to describe causation and *being inside* a model where causation is just a relation. Is there any external standpoint from which we can verify the causal link, or is that standpoint forbidden by his own view?"

  ### 5. The Error Theory of Determinacy
  **Question:** "Let's talk about the phenomenology. It feels intensely determinate to me that when I say 'set,' I'm talking about sets, not some permuted proxy. If you're right, this feeling is a global illusion. What is your error theory here? What psychological or linguistic mechanism generates the robust *illusion* of determinacy? And if that mechanism is reliable enough to make us *think* we're communicating, why isn't it reliable enough to actually *fix* reference?"

  *   **Follow-up:** "If he appeals to 'idealized rational acceptance': Ask if idealization presupposes a determinate target. To idealize my acceptance conditions, don't I need to know what I'm accepting *about*? If reference is indeterminate, what is being idealized?"

  ### 6. Mathematical Practice and Agreement
  **Question:** "My co-host Priya would ask: If reference is indeterminate, how do you explain the stability of mathematical practice? Mathematicians across centuries and cultures seem to agree on the consequences of ZFC. If we were all operating in different, non-isomorphic models without knowing it, shouldn't we expect divergent results much more often? How does your view account for the *coordination* of mathematical discourse without positing a shared, determinate model?"

  *   **Follow-up:** "If he says we share the same 'internal' truth conditions: Ask if 'internal truth conditions' are robust enough to rule out the Skolemian permutations. If the permutation preserves all truth values, in what sense is the reference *indeterminate* rather than just *multiply realizable*?"

  ### 7. Normative Consequences
  **Question:** "If there is no fact of the matter about which model we are talking about, does that bleed into logical validity? Validity is usually defined as truth-preservation across all models. But if our language doesn't pick out a specific domain, are we just shuffling symbols? Does your view force us to deflate logical consequence to mere syntactic derivability, or is there a semantic notion of validity that survives the indeterminacy?"

  *   **Follow-up:** "If he says validity is also internal: Ask if that allows for two speakers to be logically valid relative to their own models but contradictory to each other without one being 'wrong.' If so, isn't disagreement impossible?"

  ### 8. The Second-Order Logic Objection (The Closer)
  **Question:** "I want to save the strongest card for last. Zermelo argued that second-order logic yields categoricity for set theory—it pins down the model up to isomorphism. Realists argue this blocks the Skolemian permutation. You've argued that second-order logic just relocates the problem into the semantics of the second-order quantifiers (i.e., what counts as 'all subsets'). But isn't that an assumption? If we take second-order quantification at face value as ranging over the *actual* power set, doesn't that fix the model? Why is the burden on the realist to justify the semantics, rather than on you to show why 'all subsets' is indeterminate?"

  *   **Follow-up:** "If he says second-order semantics presuppose set theory (and thus are circular): Ask if that circularity is vicious. If we need set theory to explain second-order logic, and second-order logic to fix set theory, is that a failure of foundation, or just an acknowledgment that our concepts are interdefined? If it's the latter, doesn't the interdefinition still yield a unique structure?"
