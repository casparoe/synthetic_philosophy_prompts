      *   **Marcus (Logical Induction):**
          *   Impossible worlds are metaphysically spurious. "Worlds where $A \land \neg A$" are nonsense.
          *   Logical Induction provides a *criterion* for rationality (no Dutch Book), not just a model of ignorance.
