answer: |-
  You have identified a genuine epistemological black box. It is the journalist's equivalent of the "brain in a vat" problem: if your entire interface with reality is mediated by a single agent, you have no logical leverage to verify that agent without stepping outside the mediation—which, by definition, you cannot do in the moment.

  Your journalist friends are offering heuristics ("a feel for who to trust"), but you are asking for a protocol. The hard truth is that **there is no principled way to guarantee accuracy in a specific, uncheckable instance.** If you cannot verify the input or the output, the transformation process is opaque.

  However, while you cannot solve for *certainty* in the moment, you can engineer a system that maximizes *accountability* and aligns incentives. You can move from "faith" to "verified reliability over time." Here is a breakdown of how to structure that confidence, acknowledging the limits you correctly identified.

  ### 1. The Shadow Audit (Recording and Post-Hoc Verification)
  The single most effective structural change is to record every interaction, even if you cannot understand the audio in real-time.
  *   **The Mechanism:** Record the source audio. Later, hire a *different* translator (one with no stake in your story or relationship with the fixer) to translate random 10-minute segments or specific key passages.
  *   **The Logic:** You cannot check everything, but if you check 10% randomly and find high fidelity, the statistical probability of the other 90% being manipulated drops significantly.
  *   **The Deterrent:** Tell your primary fixer you do this. "I record all interviews for archival purposes and occasional quality control with our editorial team." Knowing that a random audit is *possible* changes the fixer's risk calculus. They must assume any lie could be the one you check later.

  ### 2. Incentive Realignment
  Fixers are often paid for access or for "making things happen." This incentivizes them to smooth over friction, including linguistic friction. If a source is evasive, a fixer motivated by a "good quote" might sharpen the answer. If a source is boring, they might spice it up.
  *   **The Mechanism:** Pay the fixer for *time and accuracy*, not for *content*. Explicitly state: "I need you to translate exactly what they say, even if it is repetitive, confusing, or contradicts what they said earlier. Do not summarize. Do not help me get a better quote."
  *   **The Test:** Intentionally ask a question you know the answer to, or ask a question that yields a "bad" or complex answer. If the fixer tries to clean it up or simplify it, correct them immediately. Reward them for delivering bad news or confusing answers accurately. You are training them that accuracy is more valuable to your workflow than narrative flow.

  ### 3. Triangulation via Redundancy
  You cannot verify the translation, but you can verify the *consistency* of the information through different vectors.
  *   **The Mechanism:** If possible, use two fixers for high-stakes interviews. One translates live; the other listens and takes notes, tasked specifically with monitoring the translation fidelity rather than the content.
  *   **The Low-Cost Version:** If two fixers are impossible, use the "Loop-Back" method. After the fixer translates an answer, summarize it back to the source in simple English and ask the fixer to translate your summary *back* to the source. "So, Minister, you are saying X?" Watch the source's reaction. If they look confused or glance nervously at the fixer, the initial translation may have been a summary rather than a translation.

  ### 4. Meta-Data Observation
  Since you cannot verify the *words*, verify the *context*. A fixer can lie about words, but they cannot easily fake the physical dynamics of the room without you noticing.
  *   **The Mechanism:** Observe the source's body language relative to the fixer's translation speed. If the source speaks for 30 seconds and the fixer gives you a five-second summary, you have a fidelity problem. If the source hesitates, looks down, or glances at the fixer, but the translation comes out confident and direct, flag it.
  *   **The Question:** Ask the fixer about the *difficulty* of the translation. "Was that idiom hard to translate?" "Did they seem to be choosing their words carefully?" A dishonest fixer wants the process to look seamless. An honest fixer will acknowledge the friction of language.

  ### 5. Expanding the "Checkable" Surface Area
  You mentioned you know enough to pick out stray words. Expand this strategically. You do not need fluency; you need **verification anchors.**
  *   **The Mechanism:** Before the interview, learn the local words for: *Yes, No, Never, Always, Maybe, Money, Police, President, Killed.*
  *   **The Logic:** These are the pivot points of truth. If you hear the source say the word for "No" three times, and the fixer tells you "He is open to the possibility," you have caught a structural lie. Learning 20 specific verification words gives you 20 opportunities to catch a fixer who is filtering reality to match your expectations.

  ### The Philosophical Conclusion
  To answer your final question directly: **No, you cannot earn justified confidence in the specific uncheckable case.** That is logically impossible.

  However, you *can* earn justified confidence in the **fixer as a system.**

  If a fixer knows you record, knows you spot-check with third parties, knows you reward accuracy over narrative flow, and knows you are learning verification anchors, the probability of them successfully deceiving you over the long term diminishes. You are not verifying the truth of the specific sentence; you are verifying the integrity of the channel.

  The confidence you are looking for is not "I know this sentence is true." It is "I know that if this sentence were false, the risk of detection would be high enough to deter the lie." That is not faith; it is risk management.
