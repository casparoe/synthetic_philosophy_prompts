answer: |-
  The Bureau of Ontological Continuity smelled of ozone and old paper. Arthur sat on a metal chair that was bolted to the floor, staring at the woman across the table.

  Sarah. She was wearing black. She looked exactly as she had the last time Arthur saw her, three days ago, before the Crossing. But she wasn't looking at him. She was looking *through* him, at the space his counterpart had occupied before a cerebral aneurysm took him ten weeks ago.

  "Mr. Vance," said the Adjudicator, a man named Halloway who wore glasses thick enough to distort his eyes into floating ovals. "You are petitioning for the Estate of Arthur Vance, deceased. Specifically, you are claiming the marital home and the residual pension under Statute 44: *Right of Continuity*."

  "I am Arthur Vance," Arthur said. His voice sounded rough. In his world—the Other Side—the air was drier. "Same parents. Same birth date. Same genetic code. I am not a claimant. I am the beneficiary."

  Halloway tapped a stylus against his tablet. "You are the Arthur Vance of Earth-B. The deceased was Earth-A. You diverged at the Junction Point, thirty years ago. You became a teacher; he became an architect. You married Sarah-B; he married Sarah-A."

  "Sarah is Sarah," Arthur said, glancing at the widow. She flinched. "The pension isn't for the job. It's for the *person*. Kripke would say I'm the same person. Rigid designator. My origin is essential. I came from the same sperm and egg. I am numerically identical to the man who died."

  Sarah finally looked up. Her eyes were red-rimmed. "You didn't live his life, Arthur. You didn't build the house I live in. You didn't hold his hand when the tremors started. You were teaching algebra in a world where the sky is a different shade of grey."

  "That's accidental properties," Arthur snapped, feeling the frustration rise. He'd rehearsed this with his lawyer back in B-Prime. "Where I live, what I do—that's contingent. It could have been otherwise. The fact that I *am* me, that's necessary. If I say 'Arthur Vance might have been a teacher,' I'm talking about myself. I'm not talking about some lookalike."

  Halloway sighed. "This is the Transworld Identity argument. It's seductive. But the Bureau operates on Lewisian Counterpart Theory for a reason. Mr. Vance, if you are literally, numerically identical to the deceased, then you were here when he died. You were in this room. But you weren't. You were eighty miles away in a different dimension."

  "Distance doesn't break identity," Arthur argued. "I could travel to Mars and still be me."

  "This isn't spatial distance. It's modal distance." Halloway swiped his tablet, and a hologram flickered to life between them. It showed a chain of figures. "Let's talk about Chisholm."

  Arthur frowned. "The paradox?"

  "Precisely. Imagine a World-C where Arthur Vance diverged from the deceased only slightly. Maybe he chose tea instead of coffee on the day of the aneurysm. World-D, he wore a blue tie instead of red. World-E, he took a different route to work." Halloway gestured, and the line of holographic Arthurs stretched out, each one subtly shifting. "By World-Z, Arthur Vance is a painter who never met Sarah and lives in Paris."

  "I'm not World-Z," Arthur said. "I'm World-B. I'm right next to him on the chain."

  "But where do you draw the line?" Halloway asked softly. "If World-B is identical to World-A, and World-C is identical to World-B... by the transitivity of identity, World-Z must be identical to World-A. But World-Z is clearly *not* Arthur Vance. He has a different name, a different life, a different soul. If you insist you are *literally* the same man as the deceased, you open the door to the absurdity that the Parisian painter is also the deceased. To avoid the Sorites paradox, the law must treat you as a *counterpart*. Similar, related, but distinct."

  Arthur slammed his hand on the table. "So because there's a hypothetical painter in Paris, I lose my wife? I lose my home? I'm a stranger to my own biology?"

  "You are a stranger to her," Sarah whispered.

  The silence hit harder than the shout. Arthur looked at her. Really looked at her. He saw the new lines around her mouth. He saw a scar on her chin he didn't recognize. In his world, Sarah had smooth skin. In this world, she'd fallen off a bike five years ago.

  "If I am a counterpart," Arthur said, his voice dropping, "then I am not him. Which means... I didn't love you."

  Sarah's breath hitched. "No. You didn't."

  "And you didn't love me. You loved him. The architect. The man who drank coffee."

  "Yes."

  Halloway cleared his throat. "The Bureau's finding is standard in Class-1 Divergence cases. Under Counterpart Theory, you are a distinct legal entity. You have no claim to the estate. You are, legally and ontologically, a surviving brother of the deceased, not the deceased himself."

  Arthur felt a hollowing out in his chest. It was the philosophical abstraction becoming flesh. For weeks, he had clung to the Kripkean view. It was the only way to make sense of the grief. If he was the *same*, then he hadn't lost her. He had just woken up in a slightly different dream. He could just pick up the threads.

  But the Chisholm chain was unbreakable. If he accepted he was the same, he had to accept that every tiny change didn't matter. But the changes *did* matter. The scar on Sarah's chin mattered. The fact that he didn't know where the spare key was hidden mattered. The fact that he was a teacher and not an architect mattered.

  "So," Arthur said. "If I'm a counterpart... does that mean he's dead? Really dead?"

  "To you, yes," Halloway said. "He is a counterpart in a world you cannot access. He is gone."

  Arthur looked at Sarah. "I thought... I thought if I could prove I was him, I could save you from being alone. I could step into his shoes."

  "You can't wear his shoes, Arthur," Sarah said, her voice trembling but firm. "They don't fit. You walk differently."

  It was the cruelty of Counterpart Theory. It saved logic, but it killed hope. David Lewis would say this was clean. Distinct entities, clear boundaries. No paradoxes. But Kripke was right about one thing: it felt wrong. It felt like a lie to say they were strangers. They shared a origin point. They shared a face.

  "But," Arthur said, leaning forward. "If I'm a counterpart... that means I'm not responsible for his debts, either."

  Halloway blinked. "Correct."

  "And I'm not bound by his contracts."

  "Correct."

  Arthur stood up. He looked at the hologram of the chain, the slow morphing of one man into another until the identity dissolved. He realized the trap wasn't in the logic; it was in the desire for certainty. He wanted to be the Same so he wouldn't have to grieve. He wanted to be the Same so he could claim the house.

  But if he was the Same, he was also the man who had neglected Sarah during the tremors. He was the man who had died and left her alone.

  "If I am a counterpart," Arthur said, "then I am a new person. With a new life."

  "Technically," Halloway said.

  Arthur turned to Sarah. "I don't want the house. And I don't want the pension."

  Sarah looked up, surprised.

  "I can't be him," Arthur said. "The logic... it eats itself. If I say I'm him, I have to accept all the ways I'm not. And I'm not him. I'm the guy who teaches algebra. I'm the guy who never gave you that scar."

  He reached into his pocket and pulled out a key. He'd picked the lock an hour ago, a habit from his world where security was laxer. He placed it on the table.

  "But," Arthur said, "Counterpart Theory says we resemble each other. It says there's a relationship of similarity. I look like him. I sound like him. And I... I care about you. Not because I'm him. But because I'm *like* him."

  Sarah stared at the key. "What are you saying?"

  "I'm saying I'm filing for immigration. Not Continuity. I'm a stranger. A foreigner. I have no rights here." Arthur took a breath. "But strangers can fall in love. Strangers can build houses. If I start over... as a counterpart... would you ever let me buy you a coffee? Tea, maybe?"

  It was a small thing. A trivial property. But it acknowledged the divergence. It acknowledged the Chisholm chain. He wasn't claiming the past; he was asking for a future.

  Halloway stopped typing. He looked over his glasses. "That is... outside the scope of this hearing."

  "I know," Arthur said. He looked at Sarah. "I'm not your husband. I know that now. The philosophy checks out. I'm just a man who looks like him."

  Sarah looked at the key, then at Arthur. For the first time, she didn't look through him. She looked *at* him. She saw the differences. The way he held his shoulders. The lack of familiarity in his eyes. It was terrifying. It was honest.

  "Tea," she said quietly. "I drink tea now. He switched, after the diagnosis. Said coffee made the tremors worse."

  Arthur nodded. A small smile touched his lips. "Then I'll have tea too."

  He turned to Halloway. "Dismiss the claim. I'm not Arthur Vance the Architect. I'm Arthur Vance the Teacher. I'll find my own way."

  "Very well," Halloway said, though he looked unsettled. The Bureau dealt in binaries: Same or Different. Identity or Counterpart. It wasn't equipped for the gray space where two distinct people choose to bridge the gap not because they *are* one, but because they *could* be.

  Arthur walked to the door. He didn't look back. If he looked back, he might try to convince himself again. He might try to force the Transworld Identity to hold, to claim the inheritance of a life he hadn't lived.

  But the Chisholm paradox had taught him something. Identity isn't a stone; it's a river. And you can't step into the same one twice, even if the banks look the same.

  He stepped out into the corridor. The air smelled of ozone. It was a different world. He was a different man. And for the first time since he crossed over, that felt like enough.
