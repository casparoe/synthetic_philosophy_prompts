      *   **Scene 2:** The Argument. Elias-2 argues Kripke: "I am him. I have his memories up to the Split." Elara argues Lewis: "You made different choices. You are a resemblance, not the substance."
      *   **Scene 3:** The Chisholm Trap. The Adjudicator brings up the gradual change. If Elias-2 is Elias-1, what about Elias-3 who diverged slightly more? Where is the cut-off?
