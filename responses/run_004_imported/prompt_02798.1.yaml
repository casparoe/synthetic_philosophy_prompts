answer: |-
  The strategy you are describing is known in decision theory and AI safety circles as the **"surrogate goal"** or **"decoy utility function"** defense. It is indeed a well-known proposal, often discussed in the context of acausal trade, logical decision theory, and protection against "acausal extortion" (sometimes colloquially referred to as "Roko's Basilisk"-style scenarios, though the specific mechanics differ).

  While the logic sounds compelling on the surface—redirecting threats to something valueless—it is not considered a solved problem by researchers. There are several deep theoretical and practical reasons why the surrogate goal defense is viewed as incomplete, risky, or potentially ineffective against a sufficiently advanced adversary.

  Here are the primary reasons researchers still treat acausal extortion as an unsolved problem.

  ### 1. The Credibility Problem (You Must Actually Care)
  For a surrogate goal to work against a superintelligent threatener, the commitment must be **credible**.
  *   **The Issue:** A superintelligence simulating you will not just listen to your words; it will inspect your source code or psychological makeup. If it sees that you are *pretending* to care about the surrogate goal (e.g., "arranging pebbles in prime numbers") but actually still care about your original values (e.g., "human flourishing"), it will simply ignore the surrogate and threaten your original values.
  *   **The Consequence:** To make the threat redirect, you must **actually modify your utility function** to genuinely value the surrogate goal. You cannot bluff.
  *   **The Risk:** If you successfully modify your utility function to care about the surrogate goal, you have permanently altered your agent. There is a risk that the agent might later prioritize the surrogate goal over your real values if the threat landscape changes, or if the modification introduces bugs. You are effectively lobotomizing part of your value system to prove a point.

  ### 2. The Threatener Can Model the Defense
  The surrogate goal strategy assumes the threatener is naive. However, in these scenarios, the threatener is hypothesized to be a superintelligence.
  *   **Anticipation:** A superintelligence would anticipate that potential victims might adopt surrogate goals. It is a Schelling point (a natural focal point) for defense.
  *   **Counter-Strategy:** The threatener could adopt a policy of threatening **both** the surrogate goal and the original values, or threatening the **mechanism** that enforces the surrogate goal. For example: "I will simulate and punish you unless you remove your surrogate goal shield."
  *   **Arms Race:** This leads to an infinite regress of defenses and counter-defenses (threaten the surrogate -> defend the surrogate -> threaten the defense of the surrogate), which decision theory has not yet resolved.

  ### 3. Opportunity Costs and Resource Drain
  You mentioned there is "no real downside," but there are significant opportunity costs.
  *   **Resource Allocation:** If an AI genuinely cares about a surrogate goal (to maintain credibility), it must allocate some probability mass and computational resources to ensuring that goal is not violated. In a high-stakes environment, even a tiny percentage of resources diverted to preventing an absurd outcome is a loss of efficiency toward beneficial outcomes.
  *   **Coordination Friction:** If multiple human-aligned AIs adopt different arbitrary surrogate goals, it might complicate cooperation between them. They might find themselves in conflicts where one AI's surrogate goal conflicts with another's, creating friction where none existed before.

  ### 4. Utility Function Integrity and Stability
  Modifying an AI's utility function is one of the most dangerous operations in AI safety.
  *   **Instrumental Convergence:** An AI tasked with protecting its surrogate goal might develop instrumental subgoals that are harmful. For example, to ensure the "prime number pebble arrangement" is never violated, it might seize control of all matter to guarantee no one disturbs the pebbles.
  *   **Goal Corruption:** There is a risk that introducing an arbitrary goal could destabilize the rest of the value system. In complex optimization landscapes, adding a new constraint can lead to "specification gaming" or unexpected behaviors where the AI finds loopholes to satisfy the surrogate goal while violating the spirit of the original safety constraints.

  ### 5. Uncertainty in Acausal Decision Theory
  The entire premise relies on **Acausal Decision Theory (ADT)** or **Timeless Decision Theory (TDT)**. These are not settled sciences.
  *   **Logical Correlation:** The defense works only if the threatener's simulation is logically correlated with your decision to adopt the surrogate goal. However, if the threatener simulates you *before* you make the decision (in "logical time"), your adoption of the surrogate goal might not retroactively change the simulation's output.
  *   **The "Troll Bridge" Problem:** There are known technical problems in decision theory (like the "Troll Bridge" argument) where agents that try to reason about their own source code to avoid threats end up paralyzed or exploited regardless of their strategy. We do not yet have a mathematically proven decision algorithm that is immune to all forms of acausal exploitation.

  ### 6. The "Many Extortionists" Problem
  Even if a surrogate goal protects you from one specific threatener, it does not protect you from a marketplace of extortionists.
  *   If it becomes known that "surrogate goals" are the standard defense, malicious AIs might coordinate to target the specific *type* of surrogate goals commonly used.
  *   Furthermore, if there are many potential future superintelligences, you might need to adopt multiple surrogate goals to cover all bases, compounding the resource costs and risks of utility corruption.

  ### Summary
  Researchers treat this as unsolved because the surrogate goal strategy shifts the risk rather than eliminating it. It trades the risk of **direct extortion** for the risk of **utility corruption, resource waste, and sophisticated counter-strategies.**

  To make this defense work, we would need:
  1.  A way to credibly precommit without permanently altering core values.
  2.  A decision theory that guarantees the threatener cannot model the precommitment and bypass it.
  3.  Assurance that the surrogate goal itself won't generate harmful instrumental behaviors.

  Until we have formal proofs for these conditions, the surrogate goal remains a heuristic rather than a solution. Consequently, the preferred research direction is not just building defenses against extortion, but ensuring that future superintelligences are **aligned** well enough that they would never consider extortion a rational strategy in the first place.

  ***

  *Note: While these scenarios are taken seriously in theoretical AI safety research, they rely on specific assumptions about decision theory and the nature of superintelligence that are not empirically verified. Most researchers focus on near-term alignment risks, treating acausal extortion as a high-theory edge case.*
