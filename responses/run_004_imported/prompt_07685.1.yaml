answer: |-
  Good evening. For those who don't know me, I'm the one marrying the person who just finished speaking. Usually, the rule is that you don't toast your own wedding. But given that half this room is family who wants to know how we *feel*, and the other half is my partner's History and Philosophy of Science cohort who would spot a methodological error from across the buffet table, I thought it was safer if I controlled the narrative. Literally.

  If you've ever been to a wedding, you know the script. The Best Man stands up and says, "I knew they were perfect the moment they met." The Mother of the Bride says, "They were destined for each other." It's comforting. It suggests there is a law of the universe—a covering law—that dictates when two souls click, and our job was just to instantiate it. Like gravity, but for romance.

  But anyone who knows my fiancé knows that is not how the world works. For the last four years, I have listened to them explain, over very expensive wine and very cheap takeout, that explaining human action isn't about finding a universal rule. It's about understanding the specific reasons people have for doing what they do. And it's about understanding that the meaning of an event often isn't clear until years later.

  So, I am not going to tell you that we were "meant to be." I am not going to tell you that you could tell from day one. Because on day one, we were just two people awkwardly navigating a crowded room. I was tired. You were wearing that blue shirt you thought was too formal. There was no law of nature forcing us to speak. We chose to.

  And that is the difference between a prediction and a promise.

  There is a concept my partner writes about, called a "narrative sentence." It's when you describe something that happened in the past using knowledge you only have in the present. For example: "In 1914, a Archduke was shot, starting the Great War." The people in 1914 didn't know it was the start of a war. Only we know that now.

  Looking back at us, I can finally write those sentences.

  I can look at that Tuesday night we ordered pizza and didn't speak for an hour because we were both too stressed to pretend. At the time, it was just exhaustion. But looking back now, I can say: *That was the night we learned we didn't have to perform for each other.*

  I can look at the time we got lost driving up the coast and missed the sunset. At the time, it was a failure of navigation. But looking back now, I can say: *That was the moment we realized the destination mattered less than who was in the passenger seat.*

  None of this was inevitable. There is no generalization that covers us. There is only the specific, messy, non-repeatable story of how we decided, again and again, to build something where there wasn't anything before.

  To my partner: You spend your life arguing that history is not a science of prediction, but a study of meaning. You teach me that the value of an action isn't in whether it was destined, but in the reasons we have for doing it. My reason for standing here is you. Not because you complete me, or because we are two halves of a whole. But because when I reconstruct the reasons for my life, every path of logic and emotion leads to the choice of you.

  To our families: Thank you for being the witnesses to this story. You are the context that makes our narrative possible.

  And to all of you: If you are looking for a law of love, I don't have one. I can't promise you that love follows a pattern, or that happy endings are guaranteed by the universe. But I can promise you this: I will honor the story we are writing. I will respect the contingency of our days. And I will spend the rest of my life making sure that when we look back on today, we can say, truthfully, *that was the day we began.*

  Please raise a glass. To the narrative. To the reasons. And to the future, which is not written yet, but will be written together.
