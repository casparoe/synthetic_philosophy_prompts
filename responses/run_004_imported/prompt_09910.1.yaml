answer: |-
  The Condorcet Jury Theorem (CJT) occupies a hallowed place in democratic theory because it offers something rare: a mathematical proof that democracy is epistemically superior to dictatorship. It suggests that if voters are slightly better than random at identifying the truth, and they vote independently, the majority will almost certainly be right as the group grows. It is a seductive justification for majority rule. However, the theorem rests on a behavioral assumption that is far more fragile than its statistical assumptions: the requirement that voters cast **sincere** votes based on their private signals.

  When voters are modeled not as truth-telling automatons but as rational agents who understand that their vote only matters when it is decisive, the CJT's guarantee of truth-tracking collapses. This "pivotal-voter problem" is not merely a technical idealization akin to the assumption of statistical independence; it is a structural flaw that severs the link between individual competence and collective wisdom. While game theorists have identified sophisticated equilibria that preserve some information aggregation, these models rely on conditions so stringent that they cannot sustain the CJT's robust defense of real-world majority rule.

  ### The Mechanism of Failure: The Swing Voter's Curse

  To understand why the pivotal-voter problem is fatal, one must distinguish between the statistical assumptions of the CJT and its behavioral assumptions. The assumption of **independence** posits that voters do not influence one another. While rarely perfectly true in reality (due to media echo chambers or social pressure), relaxing this assumption usually degrades the *rate* of convergence without necessarily stopping it. Correlated noise is still noise; if the average competence remains above 0.5, the law of large numbers can often still do its work.

  The assumption of **sincerity**, however, is different. It posits that voters ignore the strategic implications of their action and vote strictly on their private information. In a game-theoretic framework, this is irrational. A rational voter in a "common value" setting (where everyone wants the correct outcome) realizes that their vote only impacts the result if they are pivotal—i.e., if the rest of the electorate is perfectly tied.

  Being pivotal is itself a piece of data. If I am the tie-breaking vote in a large election where others are voting sincerely, it implies the public evidence is evenly split. In many configurations of priors and signal precision, the fact that the electorate is deadlocked suggests that the "public" information contained in the other votes outweighs my "private" signal. Consequently, the rational best response is often to vote *against* one's private signal to correct for the ambiguity implied by the tie. This phenomenon, known as the "swing voter's curse," means that sincere voting is not a Nash Equilibrium.

  If sincere voting is not an equilibrium, the CJT's input mechanism breaks. The theorem requires the aggregation of independent signals. But if rational voters strategically withhold or invert their signals based on inferences about others, the votes cast are no longer clean samples of private information. They are distorted reflections of strategic calculations. You cannot feed distorted data into the Condorcet formula and expect a truthful output. Unlike statistical noise, which averages out, strategic distortion is systematic; it biases the aggregate away from the truth.

  ### The Rejoinder: Sophisticated Equilibria and Their Fragility

  Proponents of the epistemic defense of democracy often counter this by citing the work of game theorists like Feddersen and Pesendorfer. They argue that while *sincere* voting may not be an equilibrium, there exist **informative equilibria** where voters adopt strategic thresholds but still aggregate information efficiently. In these models, as the electorate grows, the probability of a correct decision still converges to 1, even with strategic voting. If this is true, isn't the CJT's lesson preserved?

  There are three reasons why this rejoinder fails to rescue the CJT as a practical defense of majority rule.

  **1. The Equilibrium Selection Problem**
  Game-theoretic models of voting typically suffer from multiplicity. For every "good" equilibrium where information is aggregated, there often exists a "bad" equilibrium where voters ignore their private signals entirely and vote based on prior biases or focal points. For example, if everyone believes the election is predetermined, no one has an incentive to vote informatively, and that belief becomes self-fulfilling. The CJT promises convergence to the truth; the strategic models only promise convergence *if* the electorate coordinates on the specific equilibrium that tracks truth. In the real world, without a central coordinator to tell voters which equilibrium to play, there is no guarantee the electorate will find the informative one. A defense of democracy that relies on voters solving a complex coordination game to avoid epistemic collapse is no defense at all.

  **2. The Burden of Common Knowledge**
  The sophisticated equilibria that preserve truth-tracking require an immense cognitive burden. Voters must not only be rational but must have common knowledge of rationality, common priors, and common knowledge of the distribution of signal precision. They must be able to calculate the probability of being pivotal and update their beliefs accordingly. Real electorates are heterogeneous, boundedly rational, and lack shared priors. The CJT is appealing precisely because it seems to require so little of voters (just $p > 0.5$). The strategic fix requires everything. If the mechanism only works when voters are hyper-rational Bayesians, it cannot justify the truth-tracking credentials of actual human electorates.

  **3. The Divergence of Interests**
  Finally, the strategic models that salvage information aggregation rely heavily on the "common value" assumption—that all voters prefer the same outcome (the truth). However, real committees and electorates are often driven by "private values" (partisan interests). When preferences diverge, strategic voting ceases to be about information aggregation and becomes about preference manipulation. In these settings, the pivotal-voter logic does not lead to truth-tracking; it leads to polarization and gridlock. Since the CJT is often invoked to justify majority rule in general political contexts, not just jury trials, a defense that collapses the moment voters have conflicting interests is insufficient.

  ### Conclusion: A Mathematical Curiosity, Not a Political Principle

  The pivotal-voter problem is fatal to the Condorcet Jury Theorem's status as a rigorous justification for democracy because it transforms the voting mechanism from a passive aggregator of truth into an active game of inference. The assumption of sincerity is not a harmless idealization like independence; it is the linchpin that allows private information to enter the public tally without distortion. Once voters act strategically, they filter their information through the lens of pivotality, and that filter systematically blocks the flow of truth.

  The existence of sophisticated informative equilibria does not solve this problem; it merely relocates it from a behavioral assumption to a coordination problem that real-world electorates are ill-equipped to solve. The CJT demonstrates that a crowd of naive truth-tellers is wise. It does not demonstrate that a crowd of rational strategists is wise. Since real voters are neither naive nor perfectly coordinated game theorists, the theorem remains a beautiful mathematical result that fails to map onto the messy reality of democratic decision-making. To rely on it as a defense of majority rule is to build a political philosophy on the behavior of agents who do not exist.
