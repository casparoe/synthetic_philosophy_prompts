      *   Avoid hard sci-fi jargon. Use theological/philosophical terms mixed with empirical observation.
      *   *Key Image:* The flame and the fiber.
      *   *Key Concept:* The "Interval" (the moment between cause and effect where God acts).

  6.  **Refining the Philosophical Conflict:**
      *   Layla (Strict Occasionalist): Believes the anomaly is a Message. God is speaking by breaking the Habit.
      *   Hassan (Weak Occasionalist/Avicennan leanings): Believes the anomaly is a Decay. The secondary causes are wearing out, or the "Habit" is a mechanism that is failing.
      *   The twist: They can't tell the difference. Both look the same from the inside.

  7.  **Writing - Scene by Scene:**
