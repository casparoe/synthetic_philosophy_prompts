answer: |-
  **The Custom of Ash**

  The laboratory was silent, save for the hum of the air scrubbers and the soft *click* of the chronometer. It was not a smooth sweep of a second hand, but a digital tick. One. Two. Three. Discrete units of time, like beads on an abacus.

  Samir adjusted the calipers. On the pedestal sat a square of raw cotton, bleached white, perfectly woven. Above it, suspended on a tungsten arm, hung the igniter. It was not a match or a lighter; those introduced too many variables, too many secondary causes. This was a pure thermal spike, calibrated to the exact ignition temperature of cellulose.

  "Ready?" asked Elara. She stood behind the glass partition, her tablet glowing in the dim light.

  "Ready," Samir said. He did not look at her. He looked at the cotton.

  In the Avicennan worldview, which still dominated the popular imagination, the fire possessed a nature. It was *essentially* hot. To be fire was to burn. If you brought fire to cotton, the burning was a logical necessity, flowing from the essence of the things themselves. God created the world, wound the clock, and let the gears of causality grind on.

  But Samir was a Ghazalian. He worked for the Bureau of Habit. He knew that fire had no nature. Fire was merely a color, a heat, a shape. It had no power. The cotton had no fragility. When the thermal spike hit the fiber, nothing *had* to happen. The only reason the cotton burned was because the Agent—the Will that sustains the universe moment by moment—was accustomed to creating the sequence: *Contact. Heat. Ash.*

  It was a Custom. *Adah.* And like any custom, it could be broken.

  "Initiating sequence," Samir said.

  The arm lowered. The spike glowed orange. It touched the white square.

  Normally, the reaction was instantaneous. In the same tick of time that contact occurred, the blackening began. It was the most reliable thing in existence. More reliable than math.

  This time, the cotton remained white.

  The thermal spike hovered there, glowing at 400 degrees Celsius, pressing into the fiber. Smoke should have curled. The smell of char should have triggered the sensors. Instead, there was only the smell of ozone and the hum of the scrubbers.

  Samir didn't move. He didn't blink. He watched the cotton for ten full ticks.

  "Elara," he said, his voice flat.

  "I saw," she replied. Her fingers were already flying across her tablet. "Sensor check. Thermal spike is nominal. Cotton composition is nominal. Atmospheric oxygen at 21 percent."

  "The Habit slipped."

  "Or the sensor drifted," Elara said. She came out from behind the glass, her boots clicking on the tile. She leaned over the pedestal. "Samir, if the Habit slips, we have a Miracle. If the sensor drifted, we have a maintenance ticket. Do you know how many Miracle reports we filed last year?"

  "Zero."

  "Exactly. Because miracles are, by definition, rare interruptions of the Custom. If we report one every time a machine lags, the Director will shut us down."

  "It wasn't the machine." Samir reached out. He didn't touch the cotton, but he hovered his hand near the spike. He felt the heat. "The heat is real. The cotton is real. The conjunction is missing."

  Elara sighed. She was a Weak Occasionalist. She believed that secondary causes had *some* power, delegated to them by the Agent. A shadow of necessity. She thought Ghazali's strict view—that God literally recreates the universe in every atom, every tick—was metaphysical poetry, not engineering.

  "Run it again," she said.

  Samir reset the arm. He replaced the cotton with a fresh square from the sealed vacuum pack. He calibrated the igniter.

  "Initiating."

  The arm lowered. The spike touched.

  This time, the cotton didn't just burn. It froze.

  A layer of frost bloomed instantly across the white fibers, crystallizing around the point of contact with the 400-degree spike. The thermal sensor screamed an error code. Heat and cold occupied the same space in the same tick.

  Elara stepped back. "That's not a sensor error."

  "No," Samir said. "That is a contradiction."

  "In Avicenna's physics, that's impossible. A thing cannot be hot and cold in the same respect."

  "In Ghazali's physics," Samir corrected, "it is only impossible if the Agent wills consistency. The Agent is not bound by logic. He is bound by nothing."

  Elara stared at the frosted cotton. "If this is a Miracle, who is it for? A miracle is a sign. A prophecy. But we're in a basement in Zurich. There's no prophet here."

  "Maybe it's not a message," Samir said. He was thinking about the simulation theorists who came to their conferences, the ones who spoke of 'ticks' and 'rendering errors.' They used different words, but they meant the same thing. The world was discrete. It was sustained by an external Will. "Maybe it's not a Miracle. Maybe it's... fatigue."

  "Fatigue?"

  "The Custom is just a habit. What if the Habit is getting hard to maintain?"

  Elara laughed, a sharp, nervous sound. "You're suggesting the Agent is getting tired? That's heresy, Samir. Even for us."

  "I'm suggesting we cannot distinguish between a deliberate break and a structural failure." Samir turned to her. "That's the point, isn't it? From the inside, from within the creation, we can never know if the cotton burns because it *must* or because it is *willed*. If the Will wavers, the effect is the same as a broken law."

  "Then we test the limits," Elara said. Her scientific curiosity was overriding her caution. "We map the edges of the Custom."

  For three days, they worked in shifts. They stopped sleeping. The anomalies escalated.

  It wasn't just fire and cotton. They dropped a glass beaker. It hit the floor but did not shatter; it bounced like rubber. They mixed acid and base; the solution remained neutral, then suddenly turned solid gold for three ticks before reverting to liquid.

  But the most disturbing changes were temporal.

  Samir was recording a video of a candle burning. When he played it back, the wax flowed up into the wick. The flame shrank into the match. But when he looked at the candle in real time, it burned normally.

  "The past is decoupling," Elara whispered. She was staring at the playback screen. "The Agent is recreating the present, but the memory traces... the records of the past... they aren't being synchronized."

  "If causation is just constant conjunction," Samir said, "then the connection between *now* and *then* is also just a Custom. God creates you with a memory of yesterday. But He doesn't have to create the yesterday that matches the memory."

  "That means we can't trust our data," Elara said. "We can't trust our logs. We can't trust that we actually did the experiments we remember doing."

  "We can trust this," Samir said. He held up his hand. He looked at the veins, the skin, the pulse. "We trust the immediate experience. The *now*."

  "But the *now* is slipping." Elara pointed to the window.

  Outside, the Zurich night was supposed to be dark. It was raining. But through the glass, they saw a static field of grey. Not clouds. Just grey. No movement. No rain.

  "The sky," Samir said. "He's stopped rendering the sky to save processing."

  "Don't say that," Elara snapped. "Say 'The Agent is withholding the Custom of Weather.'"

  "Why does it matter?"

  "Because if it's processing, it's a machine. Machines break. They can be fixed. If it's the Agent... it's a decision. And we cannot negotiate with a decision."

  She walked over to the main console. "I'm initiating the Final Conjunction."

  Samir froze. "Elara, no."

  "We need to know if it's Strict or Weak. We need to know if secondary causes are dead or just dormant." She pulled a canister from the safe. It was pure fluorine. The most reactive element on earth. In any philosophy, Avicennan or Ghazalian, fluorine and hydrogen should explode with violent necessity.

  "If I mix these," Elara said, her hand trembling over the mixing chamber, "and nothing happens... then there is no power in matter. None. It is Strict Occasionalism. We are puppets."

  "And if it explodes?"

  "Then there is power in matter. There is *Necessity*. And if there is Necessity, then the Agent is bound by the laws He created. He cannot break them without contradicting Himself."

  "And if He contradicts Himself?"

  "Then the system crashes."

  She opened the valve.

  The gases hissed into the chamber. They swirled together.

  Samir held his breath. He thought of Al-Ghazali, writing in Baghdad a thousand years ago, defending the possibility of miracles against the philosophers who said God *could not* break the chain of cause. Ghazali said God *could*. He didn't say God *would*.

  The gases mixed.

  Silence.

  No flash. No sound. No heat. The fluorine and hydrogen sat in the glass chamber, intimate and deadly, doing nothing.

  Elara slumped against the console. "Strict," she whispered. "There is no power in things. We are alone with the Will."

  "Or," Samir said, watching the grey sky outside, "the Will is waiting."

  "Waiting for what?"

  Samir looked at the chronometer. The ticks were slowing down. The hum of the air scrubbers had dropped an octave.

  "For us to stop looking for the gear," Samir said. "The philosophers, the scientists, the simulationists... we all want to find the mechanism. Avicenna wanted the essence. The coders want the source code. Ghazali said there is no mechanism. There is only the Hand."

  He walked over to the mixing chamber. He placed his hand on the glass. It was cold.

  "If I break the glass," Samir said, "will the gases explode?"

  "I don't know," Elara said. "Does it matter?"

  "It matters if we want to survive the next tick."

  Samir took a heavy wrench from the tool rack. He raised it.

  If he struck the glass, and it shattered, and the gases exploded, it would mean the Custom had been restored. The Habit had returned.

  If he struck the glass, and it turned to water, or vanished, or if the wrench passed through it like a ghost... then the unraveling was complete.

  He looked at Elara. She nodded, once.

  Samir swung.

  The wrench hit the glass.

  There was a sound. A sharp, crisp *crack*.

  The glass shattered.

  But the gases did not explode. They didn't mix with the air. They didn't dissipate. The shards of glass hung in the air, suspended. The gas remained in the shape of the chamber, a invisible cloud held by nothing.

  And then, the smell of burning cotton filled the room.

  There was no fire. No cotton. Just the smell.

  Samir dropped the wrench. It didn't fall. It floated beside him.

  "The Custom of Gravity," Elara said. Her voice sounded like it was coming from inside his head, not the air. "Gone."

  "Is this the end?" Samir asked. He felt no fear. That was the strangest part. If the Agent was recreating him every tick, then fear was just a chemical state He chose to include. He could choose to leave it out.

  "No," Elara said. She was floating too, her hair drifting like seaweed. "I think... I think this is the Miracle."

  "A miracle for who?"

  "For us. To show us that we were never holding the reins."

  The grey sky outside the window began to brighten. Not with sunlight, but with white text. Lines of it, scrolling vertically, too fast to read. Arabic? Code? Mathematics?

  "It's the Ledger," Samir realized. "The record of the Habits."

  "Can you read it?"

  Samir squinted. The characters blurred. He could make out a pattern. *If... Then... Else...*

  No. That was the programmer's tongue.

  He looked closer. *Will... Permission... Habit...*

  "It's not code," Samir said. "It's a promise."

  "A promise?"

  "That the Custom will hold. Until it doesn't."

  The floating glass shards began to vibrate. The smell of burnt cotton intensified, becoming acrid, choking.

  "Samir," Elara said. "If the Agent is the only cause... then He is the only one who can stop this."

  "We can't pray to stop a physics engine," Samir said.

  "We can pray to the Agent."

  Samir closed his eyes. He didn't know what to ask for. To ask for gravity to return was to ask for the Custom to resume. It was to ask for the world to become boring again. To become predictable.

  But without the Custom, there was no life. Only chaos.

  "Restore the Habit," Samir whispered.

  He waited for a tick.

  Nothing happened.

  He waited for another.

  The wrench drifted closer to his face.

  "Maybe He doesn't hear us," Elara said. "Maybe He's... distracted."

  "Or maybe," Samir said, opening his eyes, "He's testing us. To see if we will act as if the fire burns, even when it doesn't."

  "What?"

  "Ghazali said we must live by the Custom, even while knowing it is not necessary. We must avoid the fire, not because it *must* burn us, but because it *usually* does. To ignore the Custom is arrogance."

  Samir reached out and caught the floating wrench. He gripped it tight. He treated it as solid, because that was the Habit. He pushed off the wall, treating the air as resistance, because that was the Habit.

  He moved toward the emergency breaker. It was a physical switch. A secondary cause.

  "Elara, the scrubbers. If I cut the power, the room seals."

  "If the Custom of Sealing is broken, we suffocate."

  "If we don't try, we accept the unraveling."

  Samir pulled the lever.

  The lights died. The hum stopped. The text on the window vanished.

  Darkness.

  Samir held his breath. He waited for the rush of air as the seals engaged. He waited for the gravity to return, to pull him to the floor.

  He felt his feet touch the tiles.

  He heard the heavy *thunk* of the blast doors locking.

  And then, in the darkness, a spark.

  A small, blue flame ignited on the tip of the wrench in his hand. It wasn't burning the metal. It was just there. A single point of light.

  It flickered. It wavered. It looked fragile.

  "It's back," Elara whispered from the dark.

  "For now," Samir said. He watched the flame. He knew, with a certainty that chilled him more than the zero-gravity had, that the flame existed only because it was being allowed to exist. There was no chemistry holding it there. There was no physics.

  There was only the Will.

  "Turn on the lights," Elara said.

  Samir reached for the switch. He hesitated. His finger hovered over the plastic.

  "What if it doesn't work?" she asked.

  "Then we sit in the dark," Samir said. "And we watch the flame."

  He pressed the switch.

  The lights hummed to life. The air scrubbers kicked in. The wrench was just metal again; the flame was gone.

  They stood in the silence of the laboratory, surrounded by the ordinary, boring, miraculous stability of things. The cotton on the pedestal was still white. The fluorine canister was still sealed.

  "We can't publish this," Elara said finally.

  "No."

  "If we do, everyone will stop trusting the Habit. People will walk into fires expecting miracles. They'll step off roofs expecting the Custom of Gravity to be optional."

  "And they'll fall," Samir said.

  "Because the Custom holds."

  "Because the Agent wills it to hold." Samir walked over to the pedestal. He picked up the square of cotton. It was soft, fragile. A single spark could destroy it. Or nothing could.

  He took the igniter. He looked at Elara.

  "One more time?"

  Elara nodded. She looked tired. Older.

  Samir lowered the arm. The spike touched the cotton.

  Blackness spread. Smoke curled. The smell of ash filled the air.

  Causation held.

  Samir exhaled. He wrote the result in the ledger: *Conjunction Stable. Probability: 100%.*

  He knew it was a lie. The probability was not 100%. It was whatever the Agent decided it was in the next tick. But to write anything else was to invite the chaos back.

  "Go home, Elara," he said. "Rest."

  "Will you be here tomorrow?"

  "I'll be here," Samir said. "Someone has to watch the fire."

  Elara left. The door hissed shut.

  Samir sat alone in the laboratory. He turned off the main lights, leaving only the standby glow of the servers. He took a match from his pocket. A simple wooden match. A secondary cause if ever there was one.

  He struck it against the box.

  It flared.

  He held the flame near his finger. He knew the Custom. He knew the pain that waited if he touched it. He knew the biology of the burn, the chemistry of the oxidation.

  But he also knew the truth.

  He held his finger in the flame.

  He did not pull away.

  For one tick, two ticks, three ticks, the fire licked his skin.

  It did not burn.

  Samir stared at the unblemished flesh. He felt the heat, but no damage. The Habit had bent, just for him, just for a moment. A private miracle. A reminder.

  He blew the match out.

  He sat in the dark, waiting for the next tick, wondering if the next one would come, and if it did, whether it would be the same as this one, or something entirely new.

  He closed his eyes and listened to the silence of the universe, holding its breath.
