      *   **Plot:** A character or community notices "cracks" in the custom of cause and effect.
      *   **Specific Constraint:** Avoid cartoonish "God zapped it." Embrace the scholarly ambiguity: Is it *strict* occasionalism (no secondary causes) or *weak* occasionalism (secondary causes exist but aren't necessary)? The characters should struggle with this distinction empirically.
      *   **Setting:** Open (11th-century Baghdad, generation ship, backyard, etc.).
      *   **Goal:** Show the mechanics of occasionalism driving the plot, not just explaining it.

