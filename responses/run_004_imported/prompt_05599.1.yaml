  2.  **Evaluate Each Species Concept against the Hard Cases:**

      *   **Biological Species Concept (BSC):**
          *   *Definition:* Reproductive isolation.
          *   *Hard Cases:* Fails asexuals (huge group), fails fossils (can't test reproduction), struggles with ring species (continuum of interbreeding vs. ends not interbreeding), struggles with hybridizing distinct populations (leakage vs. distinctness).
          *   *Verdict:* Very influential but practically fragile. Probably B or C tier given the specific hard cases listed.

      *   **Morphological Species Concept (MSC):**
          *   *Definition:* Physical similarity.
          *   *Hard Cases:* Fails cryptic species (look same, distinct), fails polymorphic species (look different, same), struggles with anagenesis (where do you draw the line in gradual change?).
          *   *Verdict:* Practical but theoretically weak. Often fails the "actually distinct" test. C or D tier.

      *   **Phylogenetic Species Concept (PSC):**
          *   *Definition:* Smallest monophyletic group/diagnosable cluster.
          *   *Hard Cases:* Good for asexuals, good for fossils (if DNA/morphology available). Struggles with hybridization (networks vs. trees), can lead to "taxonomic inflation" (splitting every little lineage). Ring species depend on how clades are defined.
          *   *Verdict:* Robust for many cases but prone to oversplitting. A or B tier.

      *   **Evolutionary Species Concept (ESC):**
          *   *Definition:* Lineage with separate evolutionary fate/tendencies.
          *   *Hard Cases:* Very broad. Handles asexuals, fossils, hybrids (if fate is separate). Vague operational criteria (how do you measure "fate"?).
          *   *Verdict:* Theoretically strong, operationally weak. A tier.

      *   **Ecological Species Concept:**
          *   *Definition:* Niche occupation.
          *   *Hard Cases:* Good for sympatric distinct populations. Struggles with neutral divergence, fails if niches overlap significantly despite reproductive isolation. Hard to apply to fossils (niche inference).
          *   *Verdict:* Useful but limited scope. B tier.

      *   **Cohesion Species Concept:**
          *   *Definition:* Mechanisms maintaining cohesion (gene flow + ecological selection).
          *   *Hard Cases:* Attempts to unify BSC and Ecological. Handles asexuals (via ecological cohesion). Still complex to apply.
          *   *Verdict:* Comprehensive but cumbersome. A or B tier.

      *   **Genotypic Cluster Concept:**
          *   *Definition:* Multilocus genotype clusters with few intermediates.
          *   *Hard Cases:* Good for hybridizing populations (looks for modes in genotype space). Good for asexuals. Hard for ring species (continuous variation). Hard for fossils (no DNA).
          *   *Verdict:* Empirically robust for extant sexually reproducing + hybridizing stuff. B tier.

