      *   **Conflict:** Postmortem credited the User. A coworker argues the User's action wasn't the "cause" of recovery because the service *would* have recovered at 3:00 PM anyway.
      *   **Goal:** The user wants a principled answer to settle the argument about causality and credit/responsibility.

