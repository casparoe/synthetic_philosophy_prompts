      *   **The "Unfortunately" Hedge:** This is the clincher. Rovelli explains the "unfortunately." He turns Borges's existential resignation into a thermodynamic necessity.
      *   **Conclusion:** Borges would treat Rovelli not as a refutation, but as a footnote that explains the punchline of his own essay.

  7.  **Drafting - Tone Check:**
