          *   *Conclusion:* If there is no matter and no self, there is no succession. Time requires a subject to experience succession. No subject = no time.
          *   *The Hedge:* "And yet, and yet... I, unfortunately, am Borges." He acknowledges the *psychological* or *pragmatic* inevitability of time and self, even if logically refuted. It's a skeptical victory but an existential defeat.

      *   **Rovelli (*The Order of Time*):**
          *   *Premise 1:* Fundamental physics (quantum gravity) equations are often timeless (no $t$ variable).
