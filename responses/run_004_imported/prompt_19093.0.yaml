  2.  **Deconstruct the Arguments:**

      *   **The Grounding Objection (Adams/Hasker):** CCFs (Counterfactuals of Creaturely Freedom) are true prior to creation. But what makes them true? Not God's will (or they aren't free). Not the creature's actual choice (doesn't exist yet). Not the circumstances (libertarian freedom means C doesn't determine choice). So, they seem ungrounded.
      *   **Molinist Reply 1 (Brute Facts):** Plantinga/Flint. They are just true. Truth doesn't *need* a ground in this specific metaphysical category.
