answer: |-
  The Molinist project is an attempt to square a circle that many philosophers of religion suspect has no square interior. You are correct to identify the Grounding Objection as the initial entry point, but you are also right to sense that the deeper, more structural threat lies in the Perszyk/Wierenga dispute regarding the transfer of powerlessness. The Grounding Objection is a metaphysical nuisance; the Consequence Argument-style objection is a logical executioner.

  To engage this at the object level, we must bypass the taxonomy of knowledge and look directly at the truth-conditions of Counterfactuals of Creaturely Freedom (CCFs) and the agent's relationship to them.

  ### The Grounding Objection: Stalemate vs. Tu Quoque

  The Grounding Objection (Adams, Hasker) posits that for a proposition to be true, there must be some ontological ground that makes it so. For CCFs (e.g., "If Peter were in C, he would freely deny Christ"), the potential grounds are exhausted:
  1.  **God's Will:** If God makes them true, Peter isn't free (determinism).
  2.  **Peter's Actual Choice:** Peter doesn't exist yet in the logical moment of Middle Knowledge.
  3.  **The Circumstances (C):** By libertarian definition, C does not causally necessitate the choice.

  Molinists generally offer two defenses. The first is the **Brute Fact** defense (Plantinga, Flint). They argue that CCFs are simply true *per se*. They belong to a category of necessary truths about contingent beings that do not require a truthmaker in the same way empirical propositions do. This is metaphysically costly. It asks us to accept a realm of ungrounded truths about non-existent agents. While logically possible, it violates the Principle of Sufficient Reason in a way that feels ad hoc solely to save the system.

  The second, stronger defense is the **Tu Quoque** (William Lane Craig). This argues that *any* view accepting true future contingents (including Simple Foreknowledge or Open Theism with bivalence) faces the same issue. If "Peter will deny Christ" is true today, what grounds it? Peter hasn't done it yet. The past and present don't necessitate it (if libertarianism holds). Therefore, if the anti-Molinist accepts truth about the actual future, they have already accepted ungrounded truths. Singling out CCFs is special pleading.

  **Verdict on Grounding:** The Tu Quoque succeeds. The Grounding Objection does not kill Molinism; it merely forces a choice on the metaphysics of time and truth. If you are an Open Theist who denies bivalence for future contingents, the objection holds. But if you accept that propositions about the future have truth values, Molinism is no worse off than Simple Foreknowledge regarding grounding. The Molinist can bite the bullet here without contradiction.

  ### The Perszyk Objection: The Structural Collapse

  However, surviving the Grounding Objection only leaves Molinism in the position of Simple Foreknowledge regarding metaphysics, while claiming the providential benefits of Calvinism. This is where Ken Perszyk's adaptation of the Consequence Argument becomes fatal.

  Van Inwagen's Consequence Argument argues that if determinism is true, we have no power over the past and the laws of nature; therefore, we have no power over the future (via the transfer of powerlessness principle). Perszyk applies this structure to Molinism:
  1.  CCFs are true logically prior to the creature's existence and volition.
  2.  The creature has no control over which CCFs are true (they are pre-volitional facts).
  3.  God actualizes a world based on these CCFs.
  4.  Therefore, the creature has no control over the actions that follow from the actualized CCFs.

  Edward Wierenga attempted to block this by arguing for a disanalogy: unlike laws of nature, CCFs are *about* the agent's free powers, not external constraints. He argues that having no control over the truth of "If C, then X" doesn't mean you have no control over X, because the truth of the counterfactual *consists in* your free power.

  This defense fails. It conflates the *content* of the proposition with the *fixity* of the proposition. Even if the CCF describes a free power, in the Molinist schema, that truth is fixed *before* the agent exists. When the agent is placed in C, they cannot make the CCF false. If the CCF says "If C, then X," and C obtains, X *must* obtain for the CCF to remain true (and it must remain true, as it is a necessary component of God's knowledge).

  This renders the libertarian "ability to do otherwise" vacuous. A libertarian requires that, given the exact same past and laws (or in this case, the exact same C and CCFs), the agent could have chosen ~X. But if the agent chose ~X, the CCF ("If C, then X") would have been false. But the CCF cannot be false, as it is a pre-creation truth God relied upon to create. Thus, the agent *cannot* choose ~X.

  Your intuition regarding decision theory is precise here. This is identical to the problem of "logical counterfactuals" in Functional Decision Theory (FDT). In FDT, an agent's output is treated as a logical fact about their algorithm. If the algorithm is fixed, the output is fixed across all logical counterfactuals. Molinism treats the agent's choice as a logical fact (the CCF) prior to the "run" of the program (creation). If the output is logically fixed prior to the run, the agent is not free in a libertarian sense; they are executing a script they did not write and cannot edit.

  ### The Verdict

  Does Molinism hold up as a genuinely libertarian account of providence? **No.**

  Molinism collapses under the weight of the Perszyk objection. While it successfully parries the Grounding Objection via the Tu Quoque maneuver, it fails to preserve the core definition of libertarian freedom. Libertarianism requires the **Principle of Alternate Possibilities (PAP)**: in the exact same metaphysical setup, the agent could have done otherwise.

  In Molinism, the "metaphysical setup" includes the truth of the CCFs. Since the agent has no causal or logical power to alter the CCFs (they are logically prior to the agent), and the CCFs dictate the outcome in the actualized world, the agent lacks the power to do otherwise. The freedom Molinism offers is compatible with the fixity of CCFs, which makes it a form of **compatibilism**, not libertarianism. It claims the label "libertarian" because the *mechanism* of the choice is internal to the agent (not coerced by God), but the *necessity* of the choice is guaranteed by the pre-existing truth of the CCF.

  Consequently, Molinism occupies the worst of both worlds:
  1.  **Unlike Calvinism:** It lacks the explanatory clarity of direct divine determination. God does not *will* the sin, He merely *permits* it based on CCFs, which complicates theodicy without solving it (why create a world where you know the sin occurs if you could have created one where the CCFs were different? Molinists say "He couldn't," which limits God's sovereignty).
  2.  **Unlike Simple Foreknowledge:** It claims to offer more providential control, but if the Perszyk objection holds, that control is achieved by sacrificing the very freedom it claims to protect.
  3.  **Unlike Open Theism:** It retains bivalence and divine certainty, but at the cost of introducing ungrounded brute facts that ultimately function as deterministic constraints.

  **Final Judgment:** Molinism is an elegant semantic framework, but it is metaphysically unstable. It attempts to secure divine sovereignty through the fixity of CCFs while maintaining creaturely freedom through the contingency of choices. These are incompatible. The fixity of the CCFs transfers powerlessness to the creature. Molinism is, in final analysis, a **theological determinism disguised as libertarianism**. It provides no more explanatory utility than Simple Foreknowledge regarding the problem of evil, and less coherence regarding the nature of free will. Your friend is wrong: Middle Knowledge does not solve the foreknowledge/free-will problem; it relocates the determinism from the divine decree to the divine knowledge, leaving the creature just as bound.
