      *   **The Perszyk/Consequence Argument Objection:** Van Inwagen's Consequence Argument says if determinism is true, we have no control over the past + laws, so no control over the future. Perszyk argues: If CCFs are true *logically prior* to creation, and God actualizes a world based on them, the creature has no control over which CCFs are true. Therefore, the creature has no control over their actions in that world. It transfers powerlessness from the CCFs to the action.
      *   **Wierenga's Defense:** Tries to find a disanalogy between laws/past and CCFs. Usually argues that CCFs are *about* the agent's power, not external constraints.
