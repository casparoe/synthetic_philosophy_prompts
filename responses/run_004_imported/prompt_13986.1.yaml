  **MEMORANDUM**

  **TO:** The Governing Body
  **FROM:** The Wine Committee
  **DATE:** 14 October 2023
  **SUBJECT:** Policy Regarding Alcohol Service at Freshers' Formals (Michaelmas Term)

  **1. Context and Purpose**
  Following the regrettable incident at the final Freshers' Formal of the previous academic year, wherein a first-year student required emergency hospital treatment due to alcohol poisoning, the Wine Committee was convened to review the interpretation of the College's alcohol policy. Specifically, we were tasked with defining the clause requiring that wine be served "in a manner appropriate to the welfare of all present."

  The Dean has proposed a temporary prohibition on wine service to first-year students at all Formal Halls until the conclusion of the Michaelmas Term. Conversely, our colleague and Laws Tutor has raised a substantive objection based on the pedagogical principles found in Plato's *Laws*. This memo outlines the Committee's deliberation on these competing views and sets forth our recommendation for the current academic year.

  **2. Summary of Deliberations**
  The Committee engaged in a rigorous debate regarding the nature of "welfare" within a collegiate context. Two distinct frameworks emerged.

  *The Pedagogical Argument (The Platonic Position)*
  The Laws Tutor argued that a policy of prohibition misunderstands the educational function of communal dining. Drawing on Plato's *Laws* (specifically Book I and II), the Tutor noted that the Athenian Stranger explicitly critiques the Spartan and Cretan models of total abstinence. In the dialogue, the Stranger posits that the *symposium*—when correctly ordered under a sober *symposiarch*—serves as a safe environment to test and train the soul. By facing the "danger" of pleasure under supervision, the young develop *enkrateia* (self-mastery). To ban wine entirely is to treat the student as incapable of moral education, potentially stunting the development of moderation by removing the very object upon which moderation must be practised. The Tutor contends that "welfare" includes moral and social acculturation, and that shielding first-years from wine denies them the opportunity to learn responsible consumption within a supportive, senior-heavy environment.

  *The Pastoral Argument (The Welfare Position)*
  The Dean, supported by the majority of the Committee, argued that while the Platonic ideal is philosophically coherent, the institutional conditions required to realise it are absent in the modern Oxford Formal. The Athenian *symposium* was a small, private gathering with a designated, authoritative leader and a cultural baseline of moderation. A Freshers' Formal involves over a hundred students, many meeting for the first time, in a setting where the primary focus is social celebration rather than philosophical dialectic.
  Furthermore, the Committee noted a significant disanalogy between the ancient *ephebe* and the modern eighteen-year-old. Contemporary drinking culture often encourages rapid intoxication rather than moderated enjoyment. Given the recent medical emergency, the Committee agrees that the College's primary duty of care must be physical safety. "Welfare," in this immediate context, must be interpreted as the prevention of foreseeable harm. We cannot replicate the controlled conditions of the *symposiarch*; therefore, we cannot assume the protective benefits of the Platonic model.

  **3. Committee Position**
  The Committee wishes to place on record that we do not dismiss the Laws Tutor's argument as merely anachronistic. We accept the principle that education in moderation is superior to enforced abstinence. However, we conclude that the College cannot currently guarantee the level of supervision required to make such education safe. To serve wine without the capacity to enforce the "sober president" model described in the *Laws* would be to invite the risk without the safeguard.

  Therefore, while we acknowledge that prohibition is not the ideal long-term educational strategy, it is the necessary short-term risk mitigation strategy. We view this not as a moral judgment on alcohol, nor a permanent policy, but as a "quarantine" period to allow first-years to acclimatise to university life before being introduced to College wine culture.

  **4. Recommendations**
  The Wine Committee recommends the following policy for the remainder of the Michaelmas Term:

  1.  **Temporary Restriction:** Wine shall not be served to first-year undergraduate students at any Formal Hall until the start of the Hilary Term (January 2024).
  2.  **Alternative Provision:** High-quality non-alcoholic beverages (including grape juices and complex alcohol-free wines) must be offered to first-years as a standard part of the service, ensuring they are not stigmatised during the toast.
  3.  **Senior Responsibility:** High Table must model moderate consumption. The Steward is authorised to cease service to any individual, regardless of year, whose behaviour suggests intoxication.

  **5. Review Date**
  This policy is an interim measure. The Wine Committee will review the efficacy and impact of this restriction on **15 January 2024**. At that time, we will assess whether a supervised introduction to wine service (perhaps in smaller group settings akin to the *symposium* model) can be safely implemented for the second term, thereby reconciling our pastoral duties with our educational ideals.

  **Signed,**

  *The Wine Committee*
