answer: |-
  You have sized up Quine's position correctly, and your intuition regarding the apparent inconsistency is shared by many philosophers who came after him. However, there is a principled reason—rooted in Quine's specific criteria for meaning and truth—why he treated epistemology and ethics differently.

  To a physicist, the distinction might look like a failure of nerve, but to Quine, it was a matter of logical hygiene regarding what counts as a "truth-apt" statement.

  Here is the breakdown of why Quine naturalized epistemology but stopped short of naturalizing ethics in the way you describe.

  ### 1. The Criterion: Truth and Sensory Stimulation
  Quine's naturalism is not a blanket claim that "everything is science." It is a claim about how language hooks onto the world. For Quine, a statement is cognitively meaningful (capable of being true or false) only if it plays a role in a conceptual scheme that ultimately predicts sensory stimulation.

  *   **Epistemology:** The goal of epistemology, for Quine, is the prediction of future experience based on past experience. Since science is the tool we use to predict sensory input, the norms of reasoning (logic, induction) are *instrumental*. We can study them empirically because there is a clear feedback loop: does this method of belief formation result in successful predictions? If not, we adjust. The "ought" of epistemology is hypothetical: *If* you want to predict the world, *then* you ought to reason this way.
  *   **Ethics:** Moral statements, Quine argued, do not predict sensory stimulation. Saying "Stealing is wrong" does not help you anticipate the behavior of physical objects or the input to your nerve endings in the way "Electrons have negative charge" does. Therefore, moral statements lack "truth conditions." They are not descriptions of the world; they are expressions of sentiment or commands.

  ### 2. Naturalizing the Origin vs. Naturalizing the Validity
  This is the crux of the matter. You suggested that Quine should dissolve "what one ought to value" into "what people do in fact value."

  Quine actually **did** do this regarding the *origin* of values. In "On the Nature of Moral Values," he fully naturalizes the *causes* of morality. He argues that moral values are acquired through conditioning, reinforcement, and evolutionary selection. They are sociological and psychological facts. We can study them empirically, just as you suggested.

  However, he refused to naturalize the *validity* of values.
  *   In **epistemology**, there is an external anchor: the success of prediction. This allows for a normative standard (truth/survival of theory).
  *   In **ethics**, Quine saw no external anchor. If you ask, "Why ought I value survival?" (the usual evolutionary bottom line), Quine would say that is not a question with a truth value. It is a expression of a fundamental sentiment.

  For Quine, a moral disagreement is not an "unfinished empirical inquiry" in the sense that more data will reveal who is *right*. It is a conflict of sentiments or goals. We can use empirical inquiry to find a compromise, but there is no "moral fact of the matter" to be discovered.

  ### 3. The "Guarded" Tone
  You noted that specialists read "On the Nature of Moral Values" as guarded. This is because Quine is walking a tightrope between **non-cognitivism** (moral statements aren't true/false) and **naturalism** (morality is part of the natural world).

  He writes:
  > "Moral values are not... discovered, like the laws of physics. They are... inculcated."

  He grants that moral values are real *as social phenomena* (just as money is real, though it has no value outside of human agreement), but he denies they are real *as objective features of the universe*.

  If he had taken the step you suggest—treating "X is good" as equivalent to "Society approves of X"—he would have committed what G.E. Moore called the "Naturalistic Fallacy." Quine was wary of this. He preferred to say that moral language serves a function (social cohesion, behavioral control) rather than describing a state of affairs.

  ### 4. Was it Inconsistent?
  Many contemporary naturalists (such as Richard Boyd or Nicholas Sturgeon) argue that Quine *was* inconsistent here. They argue that if you allow theoretical entities in physics (like electrons) because they explain observations, you should allow moral properties if they explain social observations (e.g., "The revolt happened because the regime was unjust").

  Quine would have rejected this. He maintained a strict behaviorist view of language learning. We learn the word "electron" through public observation and logical connection to stimuli. We learn "wrong" through reinforcement and emotional conditioning. For Quine, that difference in acquisition method signaled a difference in ontological status.

  ### Summary for a Physicist
  Think of it in terms of instrumentation:
  *   **Epistemology** is the calibration of the instrument. You can check the calibration against a standard signal (sensory prediction). Therefore, it can be naturalized normatively.
  *   **Ethics** is the decision of what to measure. You can study *why* the operator chooses to measure temperature rather than pressure (psychology/sociology), but the choice itself isn't "true" or "false."

  You are correct that a more thoroughgoing naturalism (like that of John Dewey or later neo-pragmatists) would dissolve the distinction you spotted. Quine stopped short because his naturalism was constrained by a verificationist theory of meaning: he could naturalize the *cause* of belief and value, but only belief could be *true*.

  So, your assessment is accurate: Quine treats ethics as a subject for empirical study regarding its *genesis*, but denies it empirical status regarding its *truth*. Whether that is a principled distinction or a philosophical blind spot remains one of the central debates in post-Quinean philosophy.
