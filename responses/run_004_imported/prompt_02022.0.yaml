prompt: |-
  I've been mulling over Bostrom and Ord's "parliamentary model" for moral uncertainty ever since I first ran into it on Overcoming Bias, and later watched people try to formalize it in that old Polymath-style thread on LessWrong. I want to write a post arguing that the model doesn't actually buy you anything over "maximize expected choiceworthiness" (MEC) plus a normalization scheme like MacAskill's variance normalization — it just relocates the problem rather than solving it. Before committing to a full post, I'd like comments on the argument, which really only takes four steps.

  1. MEC's classic difficulty is intertheoretic comparison: to take a credence-weighted expectation over "choiceworthiness" across theories, each theory's choiceworthiness function has to live on a common cardinal scale, and it's unclear what licenses treating a unit of utilitarian value as commensurable with a unit of Kantian "wrongness." Variance normalization is the best-known attempted fix, and it has taken a real beating in the recent literature.

  2. The parliamentary model is usually sold as sidestepping this entirely: instead of comparing theories directly, credence-weighted "delegates" bargain, and you act on whatever deal results. No common scale required — allegedly.

  3. But take a single up-or-down choice between A and B, where a theory with 51% credence weakly prefers A, while the remaining 49% goes to a theory that regards A as a catastrophe relative to B. A purely ordinal parliament — majority vote, no cardinal information — picks A, which seems like exactly the wrong answer. The natural fix is to let intensity of preference count: give delegates von Neumann–Morgenstern utility functions, so the 49% bloc can outbid the 51% bloc when it cares far more.

  4. But now you need, first, some way of extracting a cardinal utility function from theories that don't obviously come with one (what is deontology's utility function over lotteries?), and second, a disagreement point and a bargaining solution concept (Nash? Kalai–Smorodinsky?) to actually pin down a deal. Reasonable choices here move the answer around in ways the credences alone don't fix. When people have actually run the numbers on toy cases — I have in mind both the old LessWrong exchange and the later Greaves and Cotton-Barratt paper formalizing the model via an asymmetric Nash solution — the bargaining-derived verdict doesn't obviously coincide with what a normalization procedure delivers on the same case. So we've swapped "how do you compare theories' units" for "how do you cardinalize each theory, and pick a bargaining solution and a disagreement point," and I don't see why the second problem is smaller, or why it isn't the same arbitrariness wearing a game-theoretic costume.

  I'd appreciate comments on: whether I've got the Nash-bargaining requirements right, since that's the part I'm least sure of; whether there's a standard move available to defenders of the parliamentary model that blocks step 4; and whether the parallel with competing normalization conventions in interpersonal utility comparisons (where similar indeterminacy is usually shrugged off) actually rescues the model, or is beside the point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Moral Uncertainty, specifically comparing the "Parliamentary Model" (Bostrom/Ord) vs. "Maximize Expected Choiceworthiness" (MEC) with normalization (e.g., variance normalization).
      *   **User's Goal:** Writing a blog post arguing that the Parliamentary Model doesn't solve the intertheoretic comparison problem but merely relocates it to bargaining parameters (cardinalization, disagreement point, solution concept).
      *   **User's Argument Structure:**
          1.  MEC needs intertheoretic comparison (cardinal scale), which is hard. Variance normalization is the standard fix but criticized.
          2.  Parliamentary Model claims to avoid this by using bargaining/delegates.
          3.  Purely ordinal voting fails (tyranny of the majority on low-stakes issues). Intensity of preference is needed.
          4.  Intensity requires cardinal utility functions for theories + a bargaining solution (Nash, etc.) + disagreement point. This reintroduces arbitrariness similar to normalization.
      *   **Specific Questions for Feedback:**
          1.  Are the Nash-bargaining requirements understood correctly?
          2.  Is there a standard defense against Step 4?
          3.  Does the analogy to interpersonal utility comparison rescue the model?

  2.  **Evaluate the Argument (Step-by-Step):**

      *   *Step 1 (MEC & Normalization):* Accurate. MEC requires a common scale. Variance normalization (MacAskill) is the leading candidate but faces objections (e.g., sensitivity to theory individuation, cluelessness).
      *   *Step 2 (Parliamentary Claim):* Accurate. Bostrom/Ord originally suggested it avoids direct comparison.
      *   *Step 3 (Ordinal Failure):* Strong point. A simple majority vote ignores intensity. If 51% care a tiny bit and 49% care existentially, majority rule is morally suspect under uncertainty. This forces the model toward cardinal bargaining.
      *   *Step 4 (Cardinalization & Bargaining):* This is the crux. To do Nash bargaining, you need utility functions defined up to positive affine transformation. You also need a disagreement point (what happens if no deal is reached?).
          *   *Critique:* Does this reintroduce the comparison problem? Yes. To bargain, Theory A's "utils" must be comparable to Theory B's "utils" in terms of *exchange rates* during the deal. If Theory A says "I gain 10 utils" and Theory B says "I lose 5 utils," is the trade worth it? That requires a common metric or a fixed exchange rate, which is essentially what normalization provides.
          *   *Disagreement Point:* This is a huge source of arbitrariness. Is it random dictatorship? Status quo? War of all against all? Different points yield different outcomes.
          *   *Solution Concept:* Nash vs. Kalai-Smorodinsky yields different results. Why pick one?

  3.  **Address Specific Questions:**

      *   *Q1: Nash-bargaining requirements.*
          *   Yes, the user is right. Nash bargaining requires cardinal utilities. It also requires a feasible set of outcomes and a disagreement point.
          *   Crucially, the *units* of utility across players must be comparable for the product $(u_1 - d_1)(u_2 - d_2)$ to make sense maximization-wise. If $u_1$ is in "hedons" and $u_2$ is in "deontic points," multiplying them is category error unless normalized.
          *   *Correction/Nuance:* Some might argue the bargaining *process* determines the exchange rate. But the *inputs* still need to be cardinal.

      *   *Q2: Standard Defense against Step 4.*
          *   *Defense 1:* "Theories come with their own decision rules." (e.g., Expected Utility Theory is part of the theory). But many moral theories aren't decision theories.
          *   *Defense 2:* "Proportional Voting." Instead of bargaining, just vote with weights. But this returns to the intensity problem.
          *   *Defense 3:* "Myopic Voting." (Stewart Cohen). Delegates vote on each issue sequentially. But this leads to dynamic inconsistency and money pumps.
          *   *Defense 4:* "The disagreement point is natural." (e.g., random dictatorship based on credence). But why random dictatorship? That's already a normalization choice (linear in credence).
          *   *Key Insight:* The most sophisticated defense (Greaves/Cotton-Barratt) essentially *concedes* the user's point. They formalize it using Nash bargaining but acknowledge the need for a "meta-normative" choice on the bargaining parameters.

      *   *Q3: Interpersonal Utility Comparison Analogy.*
          *   In social choice, we often shrug and say "assume interpersonal comparability" or use a specific rule (utilitarianism).
          *   Does this rescue the Parliamentary Model? No, because the *point* of the Parliamentary Model was to avoid the hard metaphysical/epistemic work of intertheoretic comparison. If you have to assume intertheoretic comparability to make the bargaining work, you haven't gained anything over MEC. You've just added the complexity of game theory.
          *   If the analogy holds, it admits that the model relies on a controversial assumption (comparability), undermining its selling point.

  4.  **Synthesize and Structure the Response:**

      *   **Validation:** Acknowledge the strength of the argument. It aligns with recent academic consensus (e.g., MacAskill, Bykvist, Greaves).
      *   **Technical Check (Step 4):** Confirm the Nash Bargaining requirements. Emphasize the *unit comparability* issue in the Nash product. If utilities aren't on a common scale, the Nash solution is undefined or arbitrary.
      *   **The Disagreement Point:** Highlight this as the biggest vulnerability. It effectively encodes the "exchange rate" between theories.
      *   **Defenses:** Discuss the "Random Dictatorship" disagreement point. Show how this collapses back into MEC (or something very close). Discuss the "Proportional Voting" alternative and its flaws (intensity).
      *   **The "Relocation" Charge:** Affirm that this is the strongest part of the user's post. The arbitrariness hasn't vanished; it's moved from "normalization constant" to "bargaining parameters."
      *   **Interpersonal Analogy:** Argue that this analogy hurts the Parliamentary Model. In social choice, we accept arbitrariness because we *must* make a collective decision. In moral uncertainty, the hope was to find a *rational* constraint. If it's just as arbitrary as social choice rules, it loses its normative force.
      *   **Suggestions for the Post:**
          *   Cite Greaves & Cotton-Barratt (2019) explicitly.
          *   Mention the "individuation problem" (how you carve up theories affects variance, but also affects bargaining power).
          *   Consider the "dynamic inconsistency" angle if the parliament votes sequentially.

  5.  **Refine the Tone:**
      *   Keep it collegial and analytical.
      *   Ensure technical precision regarding Nash Bargaining (cardinality, unit comparability).
      *   Avoid taking a definitive stance on *which* model is true, but validate the critique that they are equivalent in terms of difficulty.

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, does Nash Bargaining strictly require unit comparability?* Yes, the Nash product maximizes $(u_1 - d_1) \times (u_2 - d_2)$. If $u_1$ is scaled by $k$, the solution changes. So the scale matters. This confirms the user's point.
      *   *Is there a version of the parliamentary model that doesn't use Nash?* Yes, simple voting. But the user already addressed that in Step 3 (intensity problem). I should reinforce that Step 3 is the "gotcha" that forces Step 4.
      *   *What about "Voting on Principles" vs "Voting on Actions"?* Some defenders argue delegates bargain on *principles* first. But this pushes the problem back, doesn't solve it.

  7.  **Final Polish:** Organize into clear sections matching the user's questions. (Technical accuracy, Defenses, Analogy). Add a section on "Suggestions for the Post" to add value.

  **(Self-Correction Note):** I need to make sure I don't conflate "interpersonal" with "intertheoretic." The user asks if the *analogy* rescues the model. I need to explain why the analogy might actually undermine the model's specific claim to solve uncertainty.

  8.  **Drafting the Response.** (Proceeds to generate output based on these thoughts.)
answer: |-
  This is a sharp, well-structured argument that aligns with the trajectory of the recent academic literature on moral uncertainty (specifically the work of Hilary Greaves, William MacAskill, and Andreas Mogensen). Your core thesis—that the Parliamentary Model relocates the intertheoretic comparison problem rather than dissolving it—is robust.

  Here is feedback on your specific questions, followed by a few suggestions to strengthen the post.

  ### 1. Are the Nash-bargaining requirements right?

  **Yes, you have the technical requirements correct.**

  To implement a Nash Bargaining Solution (NBS) among moral theories, you need three inputs that are just as problematic as the normalization constants in MEC:

  1.  **Cardinality:** As you noted, you cannot bargain with ordinal preferences. If Deontology says $A \succ B$ and Utilitarianism says $B \succ A$, you cannot find a compromise without knowing *how much* each theory cares. You need von Neumann–Morgenstern utility functions for each moral theory. This is non-trivial for deontological or virtue-ethical theories that are not naturally consequentialist in structure.
  2.  **Unit Comparability:** This is the critical technical point that supports your Step 4. The Nash product maximizes $\prod (u_i(x) - d_i)$. If Theory 1's utility is measured in "hedons" and Theory 2's in "deontic points," the product is mathematically undefined unless there is an exchange rate between them. If you rescale Theory 1's utility by a factor of $k$, the bargaining outcome changes. Therefore, **the bargaining solution presupposes a normalization of units across theories.**
  3.  **The Disagreement Point ($d$):** This is often the hidden normalization scheme. What happens if the delegates fail to agree?
      *   If $d$ is a "random dictatorship" (weighted by credence), the model often collapses back into something very close to MEC.
      *   If $d$ is the "status quo," you introduce status quo bias dependent on how you frame the options.
      *   Choosing $d$ is effectively choosing the relative bargaining power of the theories, which is isomorphic to choosing normalization weights in MEC.

  **Verdict:** Your technical grasp here is solid. The claim that bargaining avoids cardinal comparison is false; it merely hides the cardinal comparison inside the bargaining parameters.

  ### 2. Is there a standard move available to defenders?

  Defenders generally have three lines of response, but none successfully block Step 4 without conceding your main point.

  *   **Move A: "Theories bring their own decision rules."**
      *   *Argument:* If a theory is normative, it tells you how to act under uncertainty. We just follow the theory with the highest credence (Myopic Voting).
      *   *Counter:* As you noted in Step 3, this leads to the "tyranny of the majority" problem. If 51% credence is Utilitarianism (indifferent between A and B) and 49% is Deontology (A is murder), Myopic Voting kills the deontologist. This violates the "Principle of Preference Satisfaction" that motivates the parliamentary model in the first place.
  *   **Move B: "The Disagreement Point is Natural."**
      *   *Argument:* Some argue the natural disagreement point is a lottery over options weighted by credence (Random Dictatorship).
      *   *Counter:* As shown in *Greaves & Cotton-Barratt (2019)*, if you set the disagreement point to a credence-weighted lottery, the Nash Bargaining Solution often converges on the MEC outcome anyway (depending on the utility functions). If it converges on MEC, you haven't gained anything. If it diverges, the divergence is driven by the arbitrary choice of the disagreement point, not by the structure of the moral theories.
  *   **Move C: "Proportional Voting" (Stewart Cohen).**
      *   *Argument:* Instead of bargaining, delegates vote on every issue, but their voting power is proportional to credence.
      *   *Counter:* This ignores intensity of preference (your Step 3). To fix this, you must allow vote-trading (logrolling). But logrolling *is* bargaining, which returns you to the Nash/Unit Comparability problem.

  **Verdict:** There is no standard move that blocks Step 4 without admitting that the model requires arbitrary meta-normative choices equivalent to normalization.

  ### 3. Does the interpersonal utility comparison analogy rescue the model?

  You ask whether shrugging off the indeterminacy (as we often do in social choice theory) rescues the Parliamentary Model. I argue **no, it undermines it.**

  *   **The Goal is Different:** In social choice, we acknowledge that aggregating preferences is partly a political/constructive act. There is no "fact of the matter" about the correct social welfare function, so we pick one that satisfies certain axioms (Arrow, etc.).
  *   **Moral Uncertainty is Epistemic:** The Parliamentary Model is sold as a way to handle *epistemic* uncertainty about objective moral facts. The hope is that there is a *rational* way to act given uncertainty, not just a *conventional* one.
  *   **The Implication:** If you accept the analogy, you are admitting that acting under moral uncertainty is not a matter of finding the rational expectation, but of politically constructing a compromise between internal factions. This concedes that there is no unique rational answer to moral uncertainty, which defeats the purpose of proposing a normative decision rule like the Parliamentary Model. It turns the model from a solution to moral uncertainty into an admission of moral skepticism.

  Furthermore, in social choice, we usually accept interpersonal comparability as a *necessary assumption* to get utilitarianism. If the Parliamentary Model requires the same assumption (intertheoretic comparability) to function, it loses its unique selling point of avoiding that assumption.

  ### Suggestions for the Post

  1.  **Cite Greaves & Cotton-Barratt (2019):** Their paper *"An Axiomatic Approach to Moral Uncertainty"* is the formalization you allude to. They explicitly show that different bargaining solutions (and disagreement points) yield different results, and they acknowledge the need for a "meta-normative" choice. Quoting their concession would strengthen your argument significantly.
  2.  **Highlight the "Individuation Problem":** In variance normalization, the result changes if you split one theory into two identical sub-theories (variance changes). In the Parliamentary Model, the result changes if you split a faction into two delegates (bargaining power shifts). This parallel shows the structural equivalence of the arbitrariness.
  3.  **The "Black Box" Objection:** Emphasize that MEC is transparent about its arbitrariness (you pick a normalization). The Parliamentary Model obscures the arbitrariness inside the "black box" of the bargaining solution and disagreement point. Your post argues that obscurity is not a solution.
  4.  **Consider the "Dynamic Inconsistency" Angle:** If the parliament bargains sequentially (issue by issue), they are vulnerable to money pumps unless they bargain over a comprehensive plan. But bargaining over a comprehensive plan requires comparing utilities across all possible worlds, which is arguably harder than the intertheoretic comparison MEC requires.

  ### Summary
  Your four-step argument is sound. The Parliamentary Model does not escape the need for intertheoretic cardinal comparison; it merely embeds that comparison within the parameters of a bargaining solution (specifically the scaling of utility functions and the disagreement point). Because these parameters are not fixed by the moral theories or the credences alone, the model inherits the same arbitrariness it claims to avoid.

  This is a valuable contribution to the discourse, as the Parliamentary Model is often intuitively appealing precisely because it *seems* to avoid the hard math of normalization. Showing that the math is just hidden in the game theory is a strong critique.
