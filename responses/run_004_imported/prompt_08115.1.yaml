prompt: |-
  I sit on the discretionary grants committee of a small philanthropic fund that mostly supports fairly conventional global-health work, and this week I have to write the recommendation on a proposal that reproduces, almost too neatly, an argument I had with a friend just last weekend. She works in quantitative trading and took the hard line on Pascal's mugging: any decision procedure built on subjective expected utility is committed, by its own logic, to paying up whenever the product of stated probability and claimed payoff comes out positive, no matter how small the probability or how outlandish the payoff, and refusing once the numbers get uncomfortable is not a principled objection but a failure of nerve. I pushed back with something like Bostrom's leverage penalty -- the more good a claim says you personally are positioned to do, the more it should be discounted, since almost no one is ever actually in a position to swing outcomes for billions of people -- but she kept asking why the discount should track the size of the claim rather than just being a story we tell ourselves to avoid an uncomfortable conclusion, and I didn't have a clean answer. We left it there.

  Now the committee is facing a live version of the same problem. A two-person team has applied for a grant that would use roughly 80 percent of this year's discretionary budget to build a wastewater-surveillance protocol meant to catch a specific class of engineered pathogen before it can spread widely enough to end technological civilization. Their own written estimate puts the probability that the protocol is ever the decisive factor in averting such a release at around one in several million, but they argue -- and our technical reviewer confirms the arithmetic checks out once you accept the scale of what's at stake -- that the expected value of preventing that outcome is so large that this single proposal's expected value exceeds every other application combined, including our recurring bed-net and cash-transfer grants, whose effects are far more certain but smaller by many orders of magnitude. Two committee members want to fund it on exactly those grounds and call the rest of us timid; three others want to decline, but for different and not fully compatible reasons -- one repeats my leverage-penalty intuition, one simply says "we don't fund lottery tickets," and one worries aloud that we are all dressing up squeamishness as rigor. I have been asked to draft the memo the committee will actually vote on Thursday.

  Could you write that memo? It should recommend a specific, actionable disposition for the proposal -- fund in full, fund partially, decline, or defer pending some named further step -- together with the reasoning behind it, and it should set out a general criterion the committee could apply to future proposals with this same tiny-probability, enormous-payoff structure, so that we stop improvising case by case. Whichever way you come down, please give a genuinely fair hearing to the strongest version of the losing argument rather than dissolving it into a slogan: both "the expected value swamps everything else, and declining to act on your own numbers once they get large is not rationality, it's superstition" and "a policy of paying out to whoever names the largest number gets exploited without limit" deserve serious engagement before the committee will trust the recommendation.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a discretionary grants committee for a small philanthropic fund.
      *   **Task:** Write a recommendation memo for the committee to vote on.
      *   **Subject:** A proposal requesting 80% of the budget for wastewater surveillance to prevent engineered pathogens from ending civilization.
      *   **The Conflict:**
          *   *Pro-Funding:* Expected Value (EV) calculation dominates. Probability is tiny (1 in several million), but payoff (saving civilization) is huge. EV > all other grants combined. Refusing is "failure of nerve" / Pascal's Mugging.
          *   *Anti-Funding:* Leverage penalty, "no lottery tickets," suspicion of squeamishness disguised as rigor.
      *   **Requirements:**
          *   Recommend a specific disposition (Fund, Partial, Decline, Defer).
          *   Provide reasoning.
          *   Establish a general criterion for future similar proposals (policy).
          *   Give a *genuinely fair hearing* to the strongest version of the losing argument (no strawmanning).
          *   Tone: Professional, thoughtful, rigorous, suitable for a committee vote.

  2.  **Determine the Stance:**
      *   *Option A: Fund.* Risks the entire year's impact on a near-zero probability event. Ignores opportunity cost of proven interventions (bed nets, cash transfers). Hard to justify a general policy for a *small* fund (marginal impact on x-risk is likely negligible even if funded).
      *   *Option B: Decline.* Aligns with conventional philanthropy. Risks ignoring genuine tail risks. Needs to address the EV argument without just saying "it feels wrong."
      *   *Option C: Partial Fund/Defer.* A compromise. Allows testing the water without betting the farm.
      *   *Decision:* **Decline.** Why? Because for a *small* fund, the marginal impact on existential risk is effectively zero even if the project works, whereas the marginal impact on global health (bed nets/cash) is concrete and measurable. However, the reasoning needs to be nuanced to satisfy the "fair hearing" requirement. The core argument shouldn't just be "probability is too low," but rather "epistemic humility and comparative advantage."
      *   *Wait, reconsider:* If I decline, I need a policy that doesn't just ban high-EV x-risk work forever. If I fund, I open the door to Pascal's Mugging.
      *   *Better Decision:* **Decline, but with a specific policy framework.** The policy should focus on *tractability* and *comparative advantage* rather than just capping probabilities. A small fund cannot meaningfully move the needle on x-risk compared to governments or large foundations, so the "leverage" argument is actually about *marginal utility*, not just ego.
      *   *Actually, a "Defer/Partial" might be more diplomatic.* But the prompt asks for a recommendation to vote on. A clear "Decline" is stronger for setting policy. Let's go with **Decline**, but frame it around the *reliability of the probability estimate* and the *fund's comparative advantage*.
      *   *Refinement:* The prompt asks to engage deeply with Pascal's Mugging. The strongest argument for funding is that consistency demands we follow the math. The strongest argument against is that the math is broken when probabilities are epistemic rather than frequentist.
      *   *Final Decision:* **Decline.** It's the most responsible fiduciary position for a *small* fund, allowing me to articulate a policy against "epistemic black holes."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly (Decline).
      *   **The Proposal:** Briefly summarize the wastewater surveillance project.
      *   **The Core Tension:** Acknowledge the EV calculation. Don't dismiss it. Admit that *if* the numbers hold, the math wins.
      *   **Engaging the "Fund" Argument (The Strongest Losing Case):**
          *   This needs to be robust. Acknowledge that "timidity" is a bias.
          *   Acknowledge that x-risk is real.
          *   Acknowledge that expected utility theory is the gold standard for rationality.
          *   Concede that if we reject this *solely* because the number is big, we are being inconsistent.
      *   **Engaging the "Decline" Argument (The Winning Case):**
          *   It's not about "squeamishness." It's about *epistemic reliability*.
          *   Distinguish between *aleatory* (dice roll) and *epistemic* (model uncertainty) probability.
          *   The "Leverage Penalty" needs to be reframed not as "you aren't special" but as "prior probability of model correctness decreases as claims diverge from consensus."
          *   **Comparative Advantage:** A small fund spending 80% of budget won't stop a pandemic. It needs billions. Therefore, the *actual* marginal EV is lower than claimed.
          *   **Policy Formulation:** Need a rule for the future. "The Tractability & Scale Threshold."
      *   **The Policy:**
          *   Limit exposure to high-variance, low-probability grants.
          *   Require evidence of *tractability* (can *we* actually solve this?) not just *importance* (is the problem big?).
      *   **Conclusion:** Reiterate the decision.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Decline" too harsh given the friend's argument?
      *   *Fix:* Make sure the "Fund" argument is presented as intellectually honorable. It's not "crazy," it's "strict consequentialism."
      *   *Critique:* Is the leverage penalty explained well?
      *   *Fix:* Connect it to Bayesian priors. Extraordinary claims require extraordinary evidence. The "claim" here is the probability estimate itself.
      *   *Critique:* Is the policy actionable?
      *   *Fix:* Make it a specific cap (e.g., no single grant > X% of budget for projects with probability < Y). Or better, a requirement for "robustness checks" on probability estimates. Let's go with a "Marginal Tractability" test.

  5.  **Final Polish:**
      *   Ensure tone is respectful to the two members who want to fund.
      *   Ensure the "Pascal's Mugging" concept is addressed without using the term pejoratively.
      *   Check that the distinction between "subjective expected utility" and "epistemic confidence" is clear.

  6.  **Writing the Memo:** (Mental Outline)
      *   To/From/Date/Subject.
      *   Recommendation: Decline.
      *   Summary of Proposal.
      *   Analysis of the EV Argument (The "Pro" case).
      *   Analysis of the Epistemic/Tractability Argument (The "Con" case).
      *   Proposed Policy: The "Tractability and Scale" Framework.
      *   Final Justification.

      *(Self-Correction on Policy)*: The prompt asks for a criterion to stop improvising. A simple cap is too blunt. A criterion based on *evidence quality for the probability estimate* is better. If P is < 1%, the evidence for P must be robust, not just a back-of-envelope. Also, consider *marginal impact*.

      *(Refining the "Fund" Argument)*: I need to make sure I don't just say "the probability is wrong." I need to say "the *method* of deriving probability is vulnerable to error in a way that biases toward infinity." The "Fund" side says: "You're just scared of big numbers." I need to reply: "No, we are scared of *garbage inputs* producing *infinite outputs*."

      *(Refining the "Decline" Argument)*: The leverage penalty is good, but the "Comparative Advantage" argument is stronger for a *small fund*. Even if the project works, does *this* grant make the difference? Unlikely.

      *Let's synthesize:* The recommendation will be to **Decline**, based on a new policy regarding **Epistemic Robustness and Marginal Tractability**.

  7.  **Final Review against constraints:**
      *   Specific disposition? Yes (Decline).
      *   Reasoning? Yes.
      *   General criterion? Yes.
      *   Fair hearing to losing argument? Yes (dedicated section).
      *   Tone? Professional.

      *(One last thought)*: The prompt mentions the friend's argument about Pascal's Mugging specifically. I should reference the philosophical tension directly but in committee-appropriate language.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Discretionary Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Proposal 23-W-09 (Engineered Pathogen Surveillance) and Framework for High-Variance Grantmaking

  ### **I. Recommendation**

  I recommend that the committee **decline** Proposal 23-W-09 in its current form.

  While the project addresses a critical risk domain, the request for 80 percent of our annual discretionary budget cannot be justified given the epistemic uncertainty surrounding the probability estimates and the limited marginal tractability of a small fund in this specific intervention space.

  However, because this proposal raises structural questions about our mandate that will recur, I also recommend we adopt the **Epistemic Robustness and Marginal Tractability Framework** (detailed in Section IV) for evaluating future proposals characterized by low-probability, high-impact claims.

  ### **II. Summary of the Proposal and the Conflict**

  Proposal 23-W-09 seeks $400,000 (80% of our discretionary pool) to establish a wastewater-surveillance pilot. The applicants argue this protocol could detect a specific class of engineered pathogens prior to widespread release.

  The conflict before the committee is not about the severity of the threat, but about the decision procedure used to evaluate it.
  *   **The Pro-Funding Position:** Relying on subjective expected utility (SEU), the applicants calculate that even a probability as low as 1-in-5-million, when multiplied by the value of preventing civilizational collapse, yields an expected value (EV) that dwarfs our conventional global health grants. To reject this calculation is to prioritize psychological comfort over mathematical consistency.
  *   **The Anti-Funding Position:** Relying on heuristics regarding leverage, track records, and diversification, this side argues that accepting such calculations makes the fund vulnerable to error, exploitation, or "lottery ticket" thinking, potentially sacrificing certain good for speculative salvation.

  ### **III. Engagement with the Pro-Funding Argument**

  Before detailing why I recommend declining, it is essential to grant the pro-funding argument its full due. The case for funding is intellectually honorable and rests on a rigorous commitment to consequentialism.

  **1. The Consistency Objection**
  The strongest argument for funding is that refusing to act on positive expected value once the numbers become large is a form of superstition. If we accept that saving a life is good, and that preventing the death of billions is better, we are logically committed to acting on the product of probability and payoff. If we reject a grant because the payoff is *too* large, we are effectively imposing an arbitrary cap on the value of human life. To call this "Pascal's Mugging" is to dismiss a valid mathematical implication as a parlor trick. If our mission is to do the most good possible, and the math says the good is here, "timidity" is a vice, not a virtue.

  **2. The Asymmetry of Error**
  Proponents argue that the cost of error is asymmetrical. If we fund this and it fails, we lose $400,000 that could have bought bed nets. If we *decline* this and it was the decisive intervention, we lose everything. In a world where tail risks are real (e.g., nuclear war, pandemic), a policy of ignoring low-probability events is how civilizations end. The committee's discomfort may be a cognitive bias (probability neglect) rather than a rational assessment of risk.

  **3. The Leverage Counter-Counter**
  Regarding the "leverage penalty" (the idea that we should discount claims where we are uniquely positioned to help): Proponents argue that being in a position to help is not about ego, but about timing and niche. That this proposal landed on our desk *now* might be the very signal that we are the marginal funder. Discounting it because it feels "too important" for us is a self-fulfilling prophecy of irrelevance.

  I raise these points to acknowledge that voting "no" is not the mathematically naive option. It is the option that prioritizes *epistemic security* over *theoretical maximization*.

  ### **IV. Reasoning for Decline**

  I recommend declining not because the expected value is low, but because the *reliability* of the expected value calculation is insufficient to warrant 80 percent of our capital. This distinction allows us to reject the proposal without rejecting the importance of existential risk.

  **1. Epistemic Robustness vs. Arithmetic Precision**
  The applicants' arithmetic is correct, but their inputs are not. In quantitative trading (as my colleague in that field would note), a model is only as good as its priors. When a probability estimate drops below 1-in-10,000, it moves from frequentist territory (based on observed data) to subjective territory (based on model assumptions).
  At this level of granularity, subjective probability estimates are notoriously prone to overconfidence. A claim of "1-in-5-million" is functionally indistinguishable from "1-in-50-million" or "1-in-500,000" given the noise in the system. When the probability input is this fragile, multiplying it by an infinite (or near-infinite) payoff amplifies the error margin rather than the truth. We are not rejecting the math; we are rejecting the precision of the inputs.

  **2. Marginal Tractability and Comparative Advantage**
  This is the decisive factor for a fund of our size. Even if the wastewater protocol works perfectly, does *this specific grant* make the difference between extinction and survival?
  Existential risk mitigation is a public good that typically requires state-level coordination or billion-dollar budgets. For a small fund to be the "decisive factor" (as the proposal claims) requires a chain of assumptions: that no government will do this, that no larger foundation will do this, and that our specific pilot is the bottleneck.
  The probability of the threat is low; the probability that *we specifically* are the hinge of history is lower. Our comparative advantage lies in interventions where our marginal dollar has a proven, measurable impact (e.g., cash transfers). In x-risk mitigation, our marginal dollar is likely a drop in a bucket; in global health, it is a cup of water.

  **3. Portfolio Theory and Mission Continuity**
  A philanthropic fund is a going concern. Betting 80 percent of a single year's discretionary budget on a binary outcome violates basic portfolio theory. If the grant fails (which, by their own estimates, it likely will), we have effectively ceased to operate as a meaningful philanthropic entity for the year. We lose the option value of future grants. A policy that risks the existence of the fund itself to prevent the end of civilization is self-defeating if it renders the fund incapable of future action.

  ### **V. Proposed Policy: The Epistemic Robustness and Marginal Tractability Framework**

  To prevent future improvisation, I propose we adopt the following criteria for any proposal where the expected value is driven primarily by low-probability, high-impact scenarios (specifically, where <5% of the EV comes from outcomes with >1% probability).

  **1. The Input Robustness Test**
  For probability estimates below 1%, applicants must provide a "pre-mortem" or external audit of the probability model. We cannot accept back-of-envelope calculations for tail risks. If the probability is derived from a chain of conditional events (e.g., *pathogen created* AND *released* AND *undetected* AND *our sensor catches it*), each link must be evidenced. If the probability rests on a single subjective assertion, the grant is ineligible for >10% of the budget.

  **2. The Marginal Tractability Cap**
  We must assess the *marginal* impact of our specific contribution, not the *total* impact of the solution.
  *   *Criterion:* Can the applicant demonstrate that this specific grant amount is the binding constraint on the outcome?
  *   *Policy:* No single grant dedicated to existential risk mitigation may exceed 20% of the annual discretionary budget unless matched by capital from a larger institutional partner (government or major foundation). This ensures we are filling gaps, not attempting to build the whole bridge.

  **3. The Diversification Requirement**
  We may pursue high-variance strategies, but not at the expense of our baseline utility.
  *   *Policy:* A maximum of 30% of the annual discretionary budget may be allocated to "High-Variance" grants (as defined above). This allows us to place bets on the future without liquidating our ability to do certain good in the present.

  ### **VI. Conclusion**

  The argument for funding Proposal 23-W-09 is that rationality demands we follow the numbers wherever they lead, even into the uncomfortable realm of the extremely unlikely. That is a serious philosophical position.

  However, the argument for declining is that *garbage in, garbage out* applies even to expected utility theory. When the probability estimate is subjective and the payoff is incalculable, the "expected value" is a mirage. Furthermore, as a small fund, we must be honest about our leverage. We cannot save the world alone, but we can reliably improve thousands of lives.

  By declining this proposal and adopting the Framework above, we acknowledge the importance of long-term risk without sacrificing the rigor and sustainability of our philanthropy. We remain open to high-impact work, but we demand evidence that is robust enough to carry the weight of the claims being made.

  **Action Requested:** Vote to decline Proposal 23-W-09 and adopt the Epistemic Robustness and Marginal Tractability Framework for future cycles.
