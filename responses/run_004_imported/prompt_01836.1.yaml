      *   **Specific Tension:** Nozick himself seems uneasy about this (the "snapping fingers/killing cows" example, the "human utility monster" worry).
      *   **Task:** Write an essay grappling with whether this two-tier picture is a stable, principled position or an unstable halfway house.
      *   **Requirements:**
          *   Take the best case *for* it seriously (moral status comes in degrees, but modes of treatment might differ categorically).
          *   Take the best case *against* it seriously (the line-drawing problem, the discontinuity problem).
