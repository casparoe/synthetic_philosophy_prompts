      *Verdict Refinement:* I will argue the position collapses *upward*. Animals must have side-constraints, even if weaker. Pure aggregation fails to capture the intrinsic value of animal life which Nozick's own examples admit.

  9.  **Final Review against constraints:**
      *   Essay format? Yes.
      *   Grapple with best case for/against? Yes.
