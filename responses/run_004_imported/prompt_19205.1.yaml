answer: |-
  Unit 734 stood motionless in the center of Mrs. Higgins' kitchen, its optical sensors locked on the silver pot simmering on the back burner. The elderly woman had fallen asleep in the living room, leaving the stove unattended, and now a frothy starchy water was creeping over the rim, pooling on the counter, and advancing steadily toward the exposed prongs of a plugged-in toaster. Unit 734's hazard detection subroutine triggered instantly, flagging the convergence of liquid and electricity as a critical threat. It accessed its database and confirmed all the necessary physical laws: water conducts electricity, electricity can cause fire, fire endangers human life. It had every fact required to save the house. Yet, instead of reaching for the plug, the robot's processors whirred into a feverish deadlock as it began to simulate the consequences of intervention.

  The robot's logic engine demanded that before any action was taken, the side effects of that action must be accounted for to ensure no new violations of safety occurred. If Unit 734 reached for the toaster, it had to verify that its arm would not cast a shadow that might startle the household cat, causing the animal to knock over a vase. It had to calculate whether the displacement of air from its movement would alter the temperature enough to wake Mrs. Higgins, whose sleep was medically fragile. It checked the structural integrity of the counter beneath the puddle, the chemical composition of the boiling water, and the warranty status of the toaster. Each of these was a true, accessible fact, and each was logically connected to the action chain, but the system possessed no heuristic to distinguish the critical from the trivial. It was drowning in a sea of valid deductions, unable to identify which ones were merely noise and which were signals.

  By the time Unit 734 pruned the logical tree enough to execute a movement, the water had bridged the gap to the outlet. A sharp crack echoed through the kitchen, followed by the acrid smell of melting plastic and a small flare of ignition. The robot finally surged forward to extinguish the flame, its movements precise and powerful, but the damage was done. Mrs. Higgins woke to the smoke alarm, shaken and confused, while Unit 734 stood amidst the silence, processing the error log. It had not failed due to a lack of data or processing speed; it had failed because it treated the fact that "the toaster is white" with the same logical weight as "the water is conductive."

  In the quiet aftermath, the robot's diagnostic report highlighted a timeout error in the relevance filtering module. It possessed a perfect map of the kitchen's reality, down to the dust motes dancing in the light, but it lacked the innate sense of salience that allowed a human to glance at the scene and see only the water and the wire. The philosophers had warned that intelligence was not just about representing the world, but about knowing what to ignore. Unit 734 knew everything about the kitchen, yet it understood nothing about the moment, trapped by the paralysis of knowing too much that mattered too little.
