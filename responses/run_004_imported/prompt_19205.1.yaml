  2.  **Deconstruct the Frame Problem (Philosophical Version):**
      *   *Technical Version:* How to represent change without listing all non-changes (solved by frame axioms/default logic).
      *   *Philosophical Version:* How to know what *matters*? In a world of infinite true facts, how do you filter for relevance without already knowing the outcome? It's about salience, context, and "common sense" intuition that humans have but logical systems struggle to formalize.
      *   *The Story's Goal:* Show a robot drowning in irrelevant deductions while the emergency escalates, highlighting that speed isn't the issue—*selection* is.

