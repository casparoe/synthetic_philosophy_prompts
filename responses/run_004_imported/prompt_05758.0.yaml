answer: |-
  **Setting:** *A cluttered study in Oxford, 1656. Candles burn low. THOMAS HOBBES stands over a large sheet of paper covered in geometric diagrams. JOHN WALLIS sits nearby, holding a quill, surrounded by stacks of algebraic notation.*

  **HOBBES:** You treat numbers as if they are things, John. You stack your symbols like bricks and claim the tower touches heaven, but you have never laid a single stone. Look at this. *He taps the diagram.* Here is the square. Here is the circle. I have shown you the motion. I have shown you how the point travels to generate the arc. Do you see the cause?

  **WALLIS:** I see a drawing, Thomas. A very precise one, I grant you. But ink on paper is not proof. It is illustration. My proof does not rely on the steadiness of your hand or the sharpness of your compass. It relies on the relations of quantities.

  **HOBBES:** Relations without substance are ghosts! Why is geometry certain? Why do we trust it more than physics? Because we make it. In physics, we guess at the causes of nature, which God made. In geometry, *we* are the cause. I define the motion, I generate the figure. Therefore, I know it perfectly. Your algebra… it is a net cast in the dark. You catch a result, but you do not know the fish.

  **WALLIS:** But what if the hand betrays the mind? You say certainty comes because we construct the figures. But no man can draw a true line. No man can describe a perfect circle. Your "construction" is always an approximation of the ideal. My symbols, however, are exact. When I write $x^2$, I do not need to draw a square. I hold the concept of the square in my mind, pure and uncorrupted by physical limitations. Is that not a higher construction?

  **HOBBES:** It is a construction of nothing! You manipulate signs without knowing what they signify. You say you hold the concept in your mind, but if that concept cannot be resolved into simple motion, it is nonsense. To know a thing is to know how it was made. If you cannot show me the generation of the magnitude, you do not know the magnitude. You are merely calculating shadows.

  **WALLIS:** And yet, my shadows predict the eclipse. Consider this: there are truths in geometry that resist simple construction. The infinite series. Can you draw infinity, Thomas? Can your compass move forever?

  **HOBBES:** *He waves a hand dismissively.* Infinity is a name for our own inability to count, not a thing in itself. Do not bring mysticism into this.

  **WALLIS:** It is not mysticism; it is scope. Your method binds truth to what the human hand can sketch. My method binds truth to logic itself. You argue that we know geometry because we construct it. I argue we know it because the relationships hold true *regardless* of construction. The ratio exists whether you draw it or not. By tying certainty solely to physical generation, you limit truth to the limits of human dexterity.

  **HOBBES:** I tie it to *causality*. If I cannot trace the lineage of the figure, if I cannot see the motion that birthed it, I cannot swear to its truth. Your method asks me to trust the symbol. I ask you to trust the motion. Which is more material? Which is more real? You have separated mathematics from philosophy, John. You have made it a game of counters.

  **WALLIS:** And you have shackled mathematics to metaphysics. You demand that every truth be a story of motion. But what if the truth is static? What if the relationship *is* the object? I do not deny your construction, Thomas. I simply say it is a tool, not the foundation. The foundation is the consistency of the reasoning. If my algebraic steps follow logically, the conclusion is certain, even if no man could ever draw the figure in sand or ink.

  **HOBBES:** Then your certainty is circular. You prove the symbol with the symbol.

  **WALLIS:** And yours is fragile. You prove the ideal with the imperfect.

  **HOBBES:** *He leans in, eyes bright.* We shall see whose fragility breaks first. The circle will be squared. Not by your clouds of numbers, but by the straight edge of reason applied to matter.

  **WALLIS:** *He dips his quill.* And I shall be here, Thomas, ready to show you that the straight edge of reason often points where the hand cannot follow.

  *Wallis returns to his paper. Hobbes turns back to his diagram, picking up his compass like a weapon.*
