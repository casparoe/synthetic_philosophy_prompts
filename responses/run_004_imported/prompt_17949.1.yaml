answer: |-
  The auger bit into the earth with a wet suck, bringing up a core of mud that smelled of ancient iron and rot. Elias wiped the sludge from his thumb, rubbing it between his fingers until the texture was familiar. Grey. Mottled with rust.

  "Hydric," he whispered.

  But three inches to the left, the soil was brown. Oxidized. Dry.

  Elias Kael was a boundary surveyor for the County, and today he was standing on the edge of the Blackwood Tract. To the north lay the protected marsh; to the south, the development zone. The zoning law was absolute: no construction in "wetlands." The statute did not define wetlands by probability, nor by gradient. It treated the category as binary. You were either in the wetland, or you were not.

  The developer, a man named Sterling who wore loafers on mud, stood ten yards back on the gravel path. He checked his watch. He needed the stake driven in the ground. He needed the line.

  Elias knew the soil samples were a Sorites series. If you walked north, inch by inch, the water content increased imperceptibly. There was no single step where the mud shouted *now I am wet*. Yet, the law demanded a single step.

  Most of his colleagues were supervaluationists in practice. They drew the line where it seemed reasonable, acknowledging that the boundary was fuzzy, a matter of convention. They treated "wetland" as a cloud. But Elias had spent the last year reading philosophy in the quiet hours of the night, obsessed with a specific, jagged idea: Epistemicism.

  He believed the line was sharp. He believed there was a specific molecule of soil, a specific coordinate in the muck, where the predicate "wetland" ceased to apply and "dry land" began. It wasn't that the world was fuzzy; it was that his access to the world was coarse. The meaning of the word "wetland" was fixed by the complex, chaotic history of its usage in legal and colloquial contexts, and that usage, however unknowably, carved a precise extension into reality.

  The truth was there. It was just hiding.

  "Mr. Kael?" Sterling called out. "Can we build?"

  Elias stood up, his knees cracking. He held the core sample like a severed limb. "I'm finding the boundary."

  "You've been here for four hours. It's a swamp. Just draw the line where the grass stops."

  "The grass isn't the definition," Elias said, his voice tight. "The soil saturation is. And the saturation is a gradient."

  "So average it out."

  "There is no average," Elias snapped. "There is a fact."

  He turned back to the mud. This was the torment of it. If he were a nihilist, he could walk away, claiming the concept was broken. If he were a supervaluationist, he could pick a 'precisification' that satisfied the developer and sleep at night. But he was an epistemicist. He was haunted by the existence of a truth that was inaccessible.

  He imagined the boundary as a razor wire stretched through the reeds. It was perfectly taut. It existed. But the fog of his measurement tools—the auger, the pH strips, the satellite data—was too thick to see it. Williamson's margin-for-error principle gnawed at him: to *know* you are on the dry side, you must be far enough from the edge that a slight shift in context wouldn't push you over. But near the edge, safety is impossible. Knowledge is impossible.

  Yet, the fact remained.

  Elias took a step north. He drove the auger in. Brown.
  A step south. Grey.

  He was straddling the cutoff. He knew it. Somewhere between his left boot and his right, the universe flipped from *dry* to *wet*. The switch was real. It was metaphysical bedrock. But he could not know where it was. Any test he performed had a margin of error larger than the semantic precision of the law.

  "Damn it," he hissed.

  He closed his eyes. He tried to visualize the higher-order boundary. There was the boundary between wet and dry. But there was also a boundary between *clearly wet* and *borderline*. That line, too, had to be sharp. There was a specific grain of sand where the case stopped being clearly one thing and became disputable. And that line was also unknowable.

  It was sharpness all the way down. A fractal of hidden precision.

  He felt a sudden vertigo, not from the mud, but from the ontology of it. The world was infinitely more determinate than his mind could hold. The universe was high-resolution; he was low-resolution. He was trying to map a coastline with a ruler made of rubber.

  "Elias!" Sterling was walking closer, ruining his own loafers. "I don't pay you for metaphysics. I pay you for stakes."

  Elias looked at the stake in his hand. Oak, treated, pointed. To drive it was to lie. To drive it was to claim knowledge he could not possess. But to refuse was to deny the reality of the boundary itself.

  If he didn't drive the stake, he was acting as if the line didn't exist. But it *did* exist. That was the horror. The line was real, regardless of his ability to mark it. His ignorance did not dissolve the boundary; it only masked it.

  He realized then that his anxiety wasn't about the developer. It was about the silence of the fact. The fact that this patch of mud was *wet* and that patch was *dry* was sitting there, waiting, indifferent to his ignorance. It was a truth without a witness.

  He knelt again. He didn't take a sample this time. He just looked at the ground.

  He thought about the word "wetland." It had been used by farmers, lawyers, biologists, and poets for centuries. Each usage had nudged the boundary a micron. The accumulation of those nudges had settled into a specific, jagged shape in logical space. He was standing on the edge of a cliff made of language.

  "Where are you putting it?" Sterling asked, looming over him.

  Elias pointed to a spot of brown earth, six inches south of the greyest grey he had found.

  "That's safe?"

  "No," Elias said. "It's dry."

  "Same thing."

  "It isn't."

  Elias raised the hammer. He knew that even this spot, this 'dry' spot, might be within the margin of error. He might be wrong. He would always be wrong, because 'knowing' required a safety buffer he couldn't create. He was making a claim that exceeded his evidence. He was betting on the sharpness of the world against the bluntness of his mind.

  He struck the stake. The wood bit into the soil.

  *Thud.*

  Somewhere, in the space between the fibers of the wood and the grains of the dirt, the truth value flipped. Maybe the stake was in the wetland. Maybe it wasn't. The world knew. The law assumed it knew. Elias knew that he didn't know.

  He stood up, wiping mud on his trousers. He felt a strange, cold kinship with the marsh. It was full of hidden lines. The line where a frog becomes a tadpole. The line where a weed becomes a crop. The line where a man becomes a corpse. All sharp. All hidden.

  "Good," Sterling said, inspecting the stake. "Now I can build."

  "You can build south of the stake," Elias said.

  "And north?"

  "North is wet."

  Sterling nodded, satisfied with the binary. He turned and walked back to the path, already on his phone.

  Elias stayed behind. He looked at the stake. It was a monument to ignorance. He knew that if he moved it one millimeter to the left, it might be a violation. If he moved it one millimeter to the right, it might be an injustice. The exact location was fixed, but it was epistemically sealed.

  He knelt one last time and dug his finger into the mud right at the base of the stake. He pulled up a clump. It was brown, but damp.

  He held it up to the light. He waited for it to speak, to tell him if he had placed the stake on the true side of the divide. But the mud was silent. It held the secret of its own category tightly, guarding the sharp edge of the world from the blunt instruments of men.

  Elias dropped the mud. It landed with a soft slap, indistinguishable from the sound of wet earth falling on wet earth. He packed his auger, feeling the weight of the unseen line stretching out behind him, cutting through the reeds, through the county, through the world, precise as a laser, invisible as a ghost.

  He walked away, leaving the stake standing, a single, shaky pointer aiming at a truth no one could ever verify.
