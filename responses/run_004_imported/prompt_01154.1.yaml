answer: |-
  It is great to see such deep engagement with the formalization of moral uncertainty. The parliamentary model (often associated with Nick Bostrom, Toby Ord, and especially William MacAskill's *Uncertainty About What To Do*) is one of the most promising frameworks for handling normative uncertainty, and the choice of bargaining solution is indeed a critical technical detail.

  However, there is a significant factual error in your premise that likely explains the confusion: **The Kalai-Smorodinsky (KS) solution does *not* preserve Independence of Irrelevant Alternatives (IIA).** In fact, violating IIA is the specific price KS pays to achieve Individual Monotonicity.

  Nash and Kalai-Smorodinsky represent a trade-off between axioms, not a strict improvement. Here is a breakdown of why the Nash Bargaining Solution (NBS) remains the default in much of the moral uncertainty literature, correcting the axiom profile and highlighting specific difficulties KS faces in this context.

  ### 1. The Axiomatic Trade-off (Correcting the Premise)

  You wrote that KS "preserves Nash's independence of irrelevant alternatives while additionally guaranteeing individual monotonicity." The reverse is closer to the truth regarding IIA, though neither solution satisfies *all* desirable axioms.

  *   **Nash Bargaining Solution:** Satisfies **IIA**, but violates **Individual Monotonicity**.
      *   *IIA:* If you remove an option that was not selected, the solution doesn't change.
      *   *Violation of Monotonicity:* If the feasible set expands in a way that benefits Agent A (raising their maximum possible utility) but doesn't change the Pareto frontier near the solution, Nash might still shift utility away from A.
  *   **Kalai-Smorodinsky Solution:** Satisfies **Individual Monotonicity**, but violates **IIA**.
      *   *Monotonicity:* If the set of feasible utilities expands in favor of Agent A, A should not receive a lower utility in the new solution.
      *   *Violation of IIA:* Because KS relies on the "ideal point" (the maximum possible utility each agent could get in the feasible set), removing an option that was *not* chosen can change the ideal point. This changes the slope of the line connecting the disagreement point to the ideal point, which can alter the final solution.

  **Why this matters for Moral Uncertainty:**
  In the parliamentary model, IIA is often viewed as a desirable stability property. If I am deciding between donating to Charity A and Charity B, the introduction of a third option, Charity C (which turns out to be dominated or irrelevant), ideally shouldn't change the relative moral weight assigned to A vs. B. KS allows the "bargaining power" of a moral theory to shift based on the mere presence of extreme options that no one intends to choose, simply because those options define the "ideal point."

  ### 2. The "Ideal Point" Problem

  The KS solution requires calculating the **utopia/ideal point**: the maximum utility each moral theory could achieve within the feasible set. In the context of moral uncertainty, this introduces specific technical and philosophical headaches that NBS avoids:

  *   **Unbounded Utilities:** Many moral theories (particularly total utilitarianism) posit unbounded utility functions. If the feasible set is open or if there is no clear upper bound on how much utility a theory can generate in a given scenario, the KS ideal point is undefined. NBS only requires a disagreement point (often modeled as a random choice or status quo), which is usually easier to bound or define.
  *   **Sensitivity to Outliers:** Because KS anchors the solution to the maximum possible utility for each theory, it is highly sensitive to "outlier" actions that offer massive utility to one theory but are terrible for others. Even if those actions are never chosen, they stretch the bargaining line. In moral uncertainty, we often worry about "fanaticism" (giving too much weight to low-probability, high-stakes theories). KS might exacerbate this by letting a fanatic theory's maximum possible payoff dictate the bargaining ratio, whereas NBS focuses on the *product* of gains from the disagreement point, which dampens extreme asymmetries slightly more.

  ### 3. The Disagreement Point Ambiguity

  Both solutions require a **disagreement point** (what happens if the delegates fail to agree?). In the parliamentary model, this is already controversial (is it a random action? The status quo? A credence-weighted mix?).

  *   **Nash** is sensitive to the location of the disagreement point.
  *   **KS** is *also* sensitive to the disagreement point (the solution lies on the line segment between the disagreement point and the ideal point).

  However, because KS *also* requires the ideal point, it demands more information. In high-dimensional option spaces (which real-world moral decisions often are), computing the Pareto frontier and the specific ideal point for every theory can be computationally more demanding than maximizing the Nash product (which is often a concave maximization problem solvable via standard convex optimization techniques).

  ### 4. Normative Interpretations of "Bargaining Power"

  There is a philosophical argument that **IIA is actually preferable** for moral uncertainty, despite its counterintuitiveness in standard game theory.

  In the parliamentary model, we are trying to respect the *credence* we have in each theory. Some argue that a theory's bargaining power should depend on its credence and its utility *at the margin of the decision*, not on its potential utility in hypothetical scenarios that are not currently feasible.
  *   **Nash** focuses on the local geometry of the Pareto frontier at the solution.
  *   **KS** focuses on the global geometry (the distance to the ideal).

  If Theory A is Credence 10% and Theory B is Credence 90%, but Theory A has a "dream option" available that gives it infinite utility (even if Theory B gets -infinity), KS might struggle to normalize this. Nash handles the *gains from cooperation* relative to the disagreement point, which feels more aligned with the intuition of "compromise." We are compromising to avoid the disagreement outcome, not necessarily striving proportionally toward each theory's fantasy outcome.

  ### 5. Precedent and Tractability in Literature

  Finally, there is a path-dependence element. The foundational papers on the parliamentary model (e.g., MacAskill's thesis, subsequent work by Meacham) largely utilized Nash because it was the standard baseline in cooperative game theory.
  *   **Tractability:** The Nash solution is the unique solution maximizing the product of utilities $(u_1 - d_1) \times (u_2 - d_2)$. This is algebraically very clean.
  *   **KS Tractability:** KS requires finding the intersection of the Pareto frontier and the line segment to the ideal point. In discrete choice spaces (common in moral dilemmas), the Pareto frontier is a set of points, not a smooth curve, making the KS solution sometimes ambiguous or requiring further tie-breaking rules.

  ### Summary

  You aren't missing a hidden benefit of Nash; rather, the assessment of KS as a "strict improvement" relies on the incorrect assumption that it preserves IIA.

  The choice between them in moral uncertainty comes down to:
  1.  **Do you value Monotonicity over IIA?** (KS vs. Nash)
  2.  **Can you define bounded ideal points for all theories?** (Often no, favoring Nash)
  3.  **Do you want bargaining power determined by local trade-offs or global potential?** (Nash vs. KS)

  Many researchers stick with Nash not because they are unaware of KS, but because IIA is considered a vital stability condition for moral reasoning, and the "ideal point" requirement of KS introduces vulnerability to unbounded utilities and menu-dependence that seems undesirable for normative deliberation.

  *Recommended reading if you haven't seen it:* MacAskill's *Uncertainty About What To Do* (2014) discusses these bargaining solutions in Section 5.3, noting the axiom trade-offs explicitly. More recent discussions on the EA Forum regarding "normalization" often touch on why maximizing the product of utilities (Nash) is preferred for handling intertheoretic comparisons despite its flaws.
