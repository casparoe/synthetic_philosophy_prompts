answer: |-
  You are correct that I. J. Good's 1967 theorem is the standard decision-theoretic weapon against deliberate ignorance. In the context of classical Bayesian decision theory, your intuition is sound: for a rational agent, cost-free evidence that is relevant to a decision always has a non-negative expected value.

  To provide the rigorous explanation you requested, we must formalize the **Value of Information (VoI)**. Below is the decision-theoretic argument for why your friend's habits are, strictly speaking, mistakes *under the assumptions of standard rational choice theory*, followed by a necessary analysis of where those assumptions might fail in her specific examples.

  ### 1. The Formal Argument (Good's Theorem)

  Let us define the components of a standard decision problem:
  *   **$\Omega$**: A set of possible states of the world (e.g., the market went up, the market went down).
  *   **$A$**: A set of available actions (e.g., hold stocks, sell stocks).
  *   **$U(a, \omega)$**: A utility function representing the agent's preferences over actions and states.
  *   **$P(\omega)$**: The agent's prior probability distribution over states.

  **The Decision Without Information**
  If the agent must act without observing new evidence, she chooses the action $a^*$ that maximizes her expected utility based on her prior beliefs:
  $$EU_{\text{blind}} = \max_{a \in A} \sum_{\omega \in \Omega} P(\omega) U(a, \omega)$$

  **The Decision With Information**
  Suppose the agent can observe a piece of evidence (a signal) $E$, which can take on values $e \in \{e_1, e_2, ...\}$. The evidence is probabilistically related to the state $\omega$ via a likelihood function $P(e|\omega)$.
  Upon observing a specific outcome $e$, the agent updates her beliefs to the posterior $P(\omega|e)$ using Bayes' Rule. She then chooses the optimal action $a^*_e$ for that specific evidence:
  $$a^*_e = \arg\max_{a \in A} \sum_{\omega \in \Omega} P(\omega|e) U(a, \omega)$$

  The expected utility *with* the information is the weighted average of the best possible utilities she can achieve for each possible piece of evidence, weighted by the probability of receiving that evidence $P(e)$:
  $$EU_{\text{info}} = \sum_{e} P(e) \left[ \max_{a \in A} \sum_{\omega \in \Omega} P(\omega|e) U(a, \omega) \right]$$

  **The Proof of Non-Negative Value**
  Good's Theorem relies on the mathematical property that the **maximum of expectations is less than or equal to the expectation of the maximum**.
  Intuitively, having information allows you to tailor your action to the state of the world. Without information, you are forced to pick one "compromise" action for all states. With information, you can pick the best action for *each* state (or signal).

  Mathematically, for any fixed action $a$:
  $$\sum_{\omega} P(\omega) U(a, \omega) = \sum_{e} P(e) \sum_{\omega} P(\omega|e) U(a, \omega)$$
  Since $a^*_e$ is chosen to maximize utility for each $e$, it must yield at least as much utility as any fixed action $a$ (including the blind optimal action $a^*$):
  $$\max_{a} \sum_{\omega} P(\omega|e) U(a, \omega) \ge \sum_{\omega} P(\omega|e) U(a^*, \omega)$$
  Taking the expectation over $e$:
  $$EU_{\text{info}} = \sum_{e} P(e) \left[ \max_{a} \sum_{\omega} P(\omega|e) U(a, \omega) \right] \ge \sum_{e} P(e) \sum_{\omega} P(\omega|e) U(a^*, \omega) = EU_{\text{blind}}$$

  **Conclusion:** $EU_{\text{info}} \ge EU_{\text{blind}}$.
  Therefore, the **Value of Information** ($VoI = EU_{\text{info}} - EU_{\text{blind}}$) is always $\ge 0$. If the evidence is cost-free, a rational Bayesian agent should never refuse it.

  ### 2. Why Your Friend's Habits Are Theoretically Mistakes

  Based on the derivation above, your friend's policy of studied ignorance is suboptimal because it voluntarily restricts her **option value**.

  1.  **The Retirement Account:** By avoiding information about market drops, she removes her ability to condition her actions on the market state. Even if she does not plan to sell, a rational agent might identify a rebalancing opportunity (buying low) that she misses by remaining blind. Ignorance forces her to play a single strategy regardless of the terrain; information allows her to navigate the terrain.
  2.  **The Genetic Test:** Even if there is no medical treatment, information is instrumentally valuable for *life planning*. Knowing one's genetic status allows for optimized financial planning, insurance decisions, or reproductive choices. Refusing the test collapses these contingent plans into a single blind plan, lowering expected utility over her life course.
  3.  **The Sports Match:** This is the most subtle case. If we view "watching the match" as an action with utility derived from the *experience*, knowing the score changes the utility function of that action (surprise is a component of the utility). However, strictly speaking, if she values the *outcome* of her evening (enjoyment), seeking the information that maximizes that enjoyment is the rational move. If she *believes* she will enjoy it more ignorant, then seeking the info is actually costly (see below). But if she is avoiding it simply to "preserve hope," she is prioritizing a current emotional state over the instrumental value of truth, which Good's Theorem flags as irrational.

  ### 3. The Critical Caveats (Where Your Friend Might Be Right)

  While Good's Theorem is mathematically sound, it rests on specific axioms. Your friend's behavior suggests that her real-world utility function violates two key assumptions of the theorem. If these violations hold, her avoidance is not a mistake, but a rational adaptation.

  **A. The "Cost-Free" Assumption (Psychic Costs)**
  Good's Theorem assumes the evidence itself has no direct cost ($Cost(E) = 0$).
  *   **Genetic Test:** If receiving bad news causes significant anxiety or depression, this is a **psychic cost**. If the pain of knowing outweighs the instrumental benefit of planning (especially if no treatment exists), the net value becomes negative.
      *   *Correction:* $VoI_{net} = VoI_{instrumental} - Cost_{psychic}$. If $Cost_{psychic} > VoI_{instrumental}$, avoidance is rational.
  *   **Retirement Account:** If checking the account triggers stress hormones or temptation to panic-sell (a behavioral constraint), the "cost" of checking includes the risk of future irrationality.

  **B. The "State-Independent Utility" Assumption**
  Standard decision theory assumes $U(a, \omega)$ depends only on the action and the physical state of the world. It assumes you don't care about *what you know*, only about *what happens*.
  *   **Sports Match:** Your friend likely derives utility from the **state of knowledge** itself (specifically, the state of *not* knowing). The surprise is a consumption good. In this case, the information is not "free"; it consumes the good (surprise).
      *   If $U$ includes a term for "Suspense," then revealing the score reduces $U$ directly. Good's Theorem does not apply to information that directly alters the utility function's parameters.

  **C. The "Rational Agent" Assumption (Ulysses Pacts)**
  Good's Theorem assumes the agent will act optimally *after* receiving the information.
  *   **Retirement Account:** If your friend knows she is prone to panic-selling when she sees red numbers, she is acknowledging she is not a perfectly rational Bayesian agent in the heat of the moment. By avoiding the information, she is executing a **pre-commitment strategy** (a Ulysses Pact) to protect her long-term interests from her short-term irrationality. In behavioral economics, avoiding information can be a rational second-best solution for a non-ideal agent.

  ### Summary
  You are theoretically correct: **Under the strict assumptions of Bayesian decision theory (cost-free evidence, stable utility, rational updating), Good's Theorem proves that deliberate ignorance is always a mistake.** It demonstrates that information provides option value that ignorance forfeits.

  However, your friend is practically correct if her utility function includes **peace of mind** or **surprise** as intrinsic goods, or if she recognizes her own **behavioral limitations**. In those cases, the "cost" of information is positive, or the "rational updating" assumption is violated, and Good's Theorem no longer condemns her behavior.

  **The Verdict:** You win the argument on **principle** (the Value of Information is fundamental to rationality), but she may win on **application** (human utility functions often value ignorance instrumentally or intrinsically). To persuade her, you must argue that her "psychic costs" are temporary emotional reactions that a rational agent should override, whereas she will argue that peace of mind is a valid component of utility.
