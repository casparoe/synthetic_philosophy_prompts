      *   **Friend (Marco):** Long-term friend (since undergrad). Struggles with alcohol use disorder (AUD). Two serious relapses.
      *   **The Conflict:** Marco's behavior when drinking is harmful (missed wedding, cruel words). When sober, he is highly self-aware and apologetic.
      *   **The Core Dilemma:** The user oscillates between two modes:
          1.  *Personal/Resentful:* Holding him responsible, feeling hurt, accepting apologies as genuine restoration.
          2.  *Clinical/Detached:* Viewing him as a "patient with a relapsing illness," managing the situation, viewing apologies as symptoms.
      *   **The Problem:** Neither mode is sustainable. Mode 1 feels unfair to the reality of addiction. Mode 2 feels dehumanizing (friend $\to$ case manager).
      *   **The Question:** Is there a principled way to decide when to hold him responsible vs. treat it as illness? Is it coherent to relate to him both ways, or is this indecision?

  2.  **Deconstruct the Clinical/Philosophical Tension:**
      *   *Responsibility vs. Pathology:* This is the classic free will vs. determinism debate applied to addiction. The labmates suggest a binary choice (responsible OR not), but the user correctly intuits that reality is dialectical.
      *   *The "Choice" Aspect:* Friends observe Marco making choices (bar vs. wedding). This challenges the "loss of control" narrative, even if clinically, the *drive* to choose the bar is part of the disorder.
      *   *The "Apology" Aspect:* Sober Marco is insightful. Is this genuine remorse or part of the cycle (honeymoon phase of sobriety)?
      *   *The User's Role:* The user is slipping into a therapeutic role ("case manager"). This is dangerous for friendships, especially given their training.

  3.  **Formulate a Perspective/Strategy:**
      *   **Validate the Dialectic:** The user isn't failing to make up their mind; they are correctly identifying a paradox. Addiction exists in the space between choice and compulsion. A binary framework *will* fail.
      *   **Reframe the Modes:** Instead of "Resentful Friend" vs. "Clinician," propose a third way: "Boundaried Friend."
      *   **Address the Responsibility Question:** Responsibility isn't about blame for the *urge*, but accountability for the *impact* and the *management*.
      *   **Address the "Case Manager" Drift:** This is a specific risk for psych students. Need to warn against the "helper syndrome" or over-identification with the clinical role.
      *   **Practical Framework:** How to decide in the moment?
          *   *Safety/Severity:* High stakes = stricter boundaries.
          *   *Pattern vs. Incident:* Is this part of a cycle?
          *   *Action vs. Intent:* Focus on what he *does* to repair, not just what he *says*.
      *   **Self-Care:** The user's resentment is a signal. It needs to be listened to, not suppressed by clinical theory.

  4.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the difficulty. Validate that the binary advice from labmates is unhelpful. Confirm that holding both views is actually *more* clinically accurate than choosing one.
      *   *Section 1: The False Binary.* Explain why "Responsible vs. Ill" is a category error. Addiction affects the *mechanism* of choice, not the *existence* of choice. Use the concept of "capacity" vs. "action."
      *   *Section 2: The Trap of the Clinician Role.* Address the "case manager" feeling. This is countertransference (even if not a patient). It creates distance. Friendship requires mutuality, not management.
      *   *Section 3: A Principled Framework (The "How-To").*
          *   Distinguish between *Causality* (the disease caused the urge) and *Accountability* (he is responsible for the repair).
          *   The "Sober Contract": What matters is what Sober Marco does to prevent Drunk Marco from showing up.
          *   Boundaries vs. Punishment: Boundaries protect the user; punishment tries to control Marco.
      *   *Section 4: Integrating the Emotions.* Resentment is data. It shouldn't be pathologized away. It signals a boundary violation.
      *   *Section 5: Specific Advice for the User.* Given they are a PhD student, they might be over-intellectualizing. Encourage them to step out of the "psychologist" hat when with Marco.
      *   *Closing:* Reiterate that coherence comes from consistency of *boundaries*, not consistency of *theory*.

  5.  **Refining the Tone:**
      *   Needs to be peer-to-peer (respecting their expertise) but also supportive.
