answer: |-
  This is a profoundly difficult position to be in, and your intuition that the advice from your labmates ("decide once and for all") is insufficient is correct. In fact, from a clinical and philosophical standpoint, insisting on a binary choice between "he is responsible" and "he is ill" is a category error. Addiction exists precisely in the tension between those two states.

  You are not failing to make up your mind. You are oscillating because both perspectives contain truth, but neither is sufficient on its own to sustain a friendship. The friction you feel isn't a sign of confusion; it's a sign that you are trying to integrate two valid but conflicting realities: the reality of the *person* (Marco) and the reality of the *pathology* (AUD).

  Here is a perspective on how to structure this relationship without burning out or becoming his clinician.

  ### 1. Distinguish Causality from Accountability
  The binary trap your labmates suggest conflates *causality* with *accountability*.
  *   **Causality:** Clinically, you know the alcohol use disorder compromised his impulse control and judgment. The disease contributed to the cause of the behavior. You are right to acknowledge this.
  *   **Accountability:** This belongs to the agent. Even if the *urge* was pathological, the *impact* was real, and the *repair* is his responsibility.

  The incoherence you feel comes from trying to use causality to solve an accountability problem. If you focus only on causality (the illness), you become a case manager (Mode 2). If you focus only on accountability (the choice), you become a judge (Mode 1).

  **The Principled Shift:** You can hold the view that the *behavior* was symptomatic while insisting that the *consequences and repair* are his responsibility. It is coherent to say: *"I understand you were in a state of dependence where choice was compromised, AND I am holding you responsible for the damage caused and the steps required to prevent recurrence."*

  ### 2. The "Sober Contract"
  You mentioned that friends observe him making choices (e.g., choosing the bar over the wedding) *before* the heavy drinking starts. This is a critical distinction in addiction medicine. There is often a window of agency before the "loss of control" sets in.

  Instead of judging Drunk Marco (who has no control), your friendship terms need to be negotiated with Sober Marco (who has agency).
  *   **Drunk Marco** is a force of nature, like a storm. You don't hold a storm responsible; you board up the windows.
  *   **Sober Marco** is the architect. He is responsible for the windows.

  When you feel resentment, check: *Am I mad at the storm, or am I mad that the architect didn't board the windows?*
  If Sober Marco knows he has a pattern of missing major events when he drinks, the responsibility lies with Sober Marco to remove himself from the environment of the wedding if he cannot guarantee sobriety. His failure to do so is a failure of agency, not just a symptom of intoxication. This allows you to validate your resentment without denying the pathology.

  ### 3. Avoid the "Case Manager" Drift
  You noted that Mode 2 (clinical detachment) makes you feel like a case manager. This is a specific occupational hazard for psychology graduate students. It is a form of intellectualization that protects you from hurt but kills intimacy.

  Friendship requires mutuality. A therapeutic relationship is asymmetrical (you are there for the patient); a friendship is symmetrical (you are there for each other). When you switch into "clinician mode," you are unilaterally changing the contract of the relationship to protect yourself.
  *   **The Risk:** If you view his apologies as "symptoms to note," you strip him of his humanity and his capacity for genuine moral repair. If he *is* genuinely remorseful (which his self-awareness suggests), treating that remorse as pathology is actually a form of invalidation.
  *   **The Correction:** You do not need to diagnose his apologies. You only need to evaluate their *utility*. Does the apology lead to behavioral change? If yes, accept it as a friend. If no, view it as part of the cycle, not necessarily as a "symptom," but as a broken promise.

  ### 4. Resentment as Data, Not Noise
  In Mode 1, you feel resentment. In Mode 2, you try to set that reaction aside. I would argue you should not set it aside.

  In your training, you likely discuss how affect is information. Your resentment is not a failure of clinical understanding; it is a boundary signal. It is telling you that a limit has been crossed.
  *   **Sustainable Approach:** Instead of suppressing the resentment with theory ("he's sick"), or indulging it with judgment ("he's bad"), use it to set boundaries.
  *   **Example:** "Marco, I know you struggle with alcohol, and I care about you. But when you miss events like my sister's wedding, it causes me lasting pain. I cannot be in a position where I rely on you for high-stakes commitments until you have a longer period of stability."

  This is neither punitive nor clinical. It is relational. It protects you without requiring you to solve his addiction.

  ### 5. Integration: The "Both/And" Stance
  To answer your specific question: **Yes, it is coherent to relate to him both ways, provided you compartmentalize the *context*, not the *person*.**

  *   **In moments of crisis/relapse:** Lean toward the clinical understanding. Do not engage in arguments with intoxicated Marco. Do not take the cruel words personally (as hard as that is). View this as the illness speaking. This preserves your safety.
  *   **In moments of sobriety/repair:** Lean toward the friendship. Engage with his remorse as a human being, not a patient. Hold him accountable for future planning. This preserves the bond.

  The instability you feel comes from trying to apply the clinical lens to the sober moments, or the personal lens to the intoxicated moments.

  ### A Recommendation for You
  You are in a PhD program. You are surrounded by theories of behavior. But Marco is not your client.
  *   **Step out of the role:** When you are with him, consciously take off the "psychologist in training" hat. You are allowed to be just a friend who is hurt. You don't need to justify your hurt with DSM criteria.
  *   **Grieve the loss:** The missed wedding is a grief event. That version of the memory is gone. Allow yourself to mourn that without trying to "resolve" it through understanding his addiction. Understanding explains it; it doesn't fix the hurt.
  *   **Define your limits:** Decide what you can tolerate *for yourself*, regardless of his diagnosis. "I love you, but I won't answer the phone after 10 PM if you've been drinking," is a boundary that respects his illness but protects your peace.

  **Summary:**
  You are not failing to decide. You are correctly perceiving a dialectic. The solution is not to choose between "Friend" and "Clinician," but to be a **Friend with Boundaries informed by Clinical Knowledge.** Use your knowledge to understand *why* he fails, but use your humanity to decide *what you will accept*.

  If the cost of the friendship continues to outweigh the benefit, you are permitted to step back, not because you lack empathy for the illness, but because you have a responsibility to your own well-being. That is not a clinical judgment; it is a human one.
