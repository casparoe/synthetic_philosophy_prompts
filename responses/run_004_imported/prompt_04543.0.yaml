  8.  **Final Polish:** Ensure the distinction between *consequences* (which Kant ignores for moral worth) and *intentions* (which are central) is clear. Make sure the friend's cousin example is resolved at the end. (The cousin lacks moral worth, but the action is still legally/rightful).

