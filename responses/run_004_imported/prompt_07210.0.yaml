      *   Where does the slide happen? It happens in the final conclusion. The premises establish that the *requirements* for the search are different (intension), but the conclusion is phrased as an ontological claim about the object itself (extension).
      *   Specifically, the move from "The search criteria are different" to "The object is not a member of the class."
      *   Actually, looking closer at the text: "Hence it is settled: a white horse is not a horse."
      *   The Objector understands "is a horse" as class membership (If there is a white horse, there is a horse).
      *   The Advocate proves "is not" as conceptual non-identity (The definition of 'white horse' $\neq$ the definition of 'horse').
      *   The slide is in the interpretation of the copula "is".

  6.  **Refining the Analysis (Historical/Philosophical Context):**
      *   Need to acknowledge the School of Names (Logicians) context. They were interested in the relationship between *ming* (names) and *shi* (reality/actualities).
      *   The Advocate (Gongsun Long) is likely making a point about semantics/reference, not ontology.
