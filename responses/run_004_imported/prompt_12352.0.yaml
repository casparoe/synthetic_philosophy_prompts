answer: |-
  The highway unspooled like a gray ribbon, identical mile after identical mile. Elena kept her eyes on the white line, letting the hum of the engine settle into her bones. She was driving home from the coast, leaving Mark behind. The question sitting in the passenger seat was simple: *Am I still in love with him?*

  At the departure rest stop, Mile 0, the answer had been yes. It wasn't just a feeling; it was a fact she held. She knew she loved him. And she knew that she knew it. It was luminous, bright behind her eyes, undeniable. If someone had asked, she could have sworn on it. The state of loving him was transparent to her.

  She passed Mile 10. The landscape hadn't changed. The light hitting the dashboard was the same angle, shifted by imperceptible degrees. She checked in. The feeling in her chest was heavy, familiar. It felt exactly like it had at Mile 0. If she couldn't tell the difference between now and ten minutes ago, and she knew she loved him then, she must know she loves him now. The margin for error was zero. Her introspection was fine-grained. She knew she loved him, and she was certain she knew it.

  Mile 50. The sun dipped lower. The shadows stretched. She checked again. The ache was there. It felt indistinguishable from Mile 10. If she couldn't distinguish the state at Mile 50 from the state at Mile 10, and she knew she was in love at Mile 10, then she knew she was in love at Mile 50. To claim otherwise would be to claim she could feel a change that wasn't there. She trusted her senses. She trusted her mind. She knew that she knew.

  Mile 100. Twilight. The headlights flickered on.
  She pressed her thumb against the steering wheel. Was the ache the same? It seemed so. But a flicker of doubt sparked, not about the love, but about the knowing. At Mile 0, the knowledge had been solid. At Mile 50, it was solid. Now?
  She tried to grasp the knowledge itself. *I know I love him.* But could she grasp the knowing? Or was she just remembering the certainty of Mile 50?
  If she couldn't distinguish her current confidence from her confidence ten miles back, and she was sure of her knowledge then, she should be sure now. But the certainty felt thinner. She knew she loved him, but did she know that she knew? The second layer was fogging over. The luminosity was dimming, not because the feeling changed, but because her access to the fact of the feeling was slipping.

  Mile 150. Night.
  The road was a tunnel. She was tired. The feeling in her chest was still heavy, but was it love, or was it inertia?
  She tried to run the chain again.
  At Mile 140, she knew she loved him.
  Mile 141 is indistinguishable from 140. So she must know at 141.
  Mile 142 is indistinguishable from 141. So she must know at 142.
  ...
  Mile 150.
  The logic held, but the intuition screamed. The heavy feeling was there, but the *knowledge* was gone. She realized she was pretending. She was asserting she knew because the previous moment felt like knowledge, but the link was broken. She couldn't see the state clearly anymore. It wasn't that she stopped loving him; it was that she stopped knowing she did. The condition wasn't luminous. It never was.

  Mile 200. The exit sign glowed green. *Home.*
  She pulled into the driveway. The engine cut. The silence rushed in.
  She sat there, waiting for the answer. The heavy feeling was gone. It hadn't snapped; it had evaporated. She wasn't in love with him anymore.
  She traced the drive back in her head. There was no moment where she decided. No mile marker where the feeling broke. If there had been a sharp boundary, she would have felt it. She would have known the moment the love died. But there was no such moment.
  Because if she knew she loved him at Minute X, and Minute X+1 felt the same, she would have to know she loved him at X+1. Chain that across four hours, and she would know she loved him in her driveway. But she didn't.
  Therefore, she couldn't have known she loved him at the start. Not really.
  The certainty at Mile 0 was an illusion. She had thought she was in a luminous state, transparent and self-verifying. But she was just standing on a slope so gradual her feet couldn't feel the decline.

  She got out of the car. The air was cold. She shivered.
  *Am I cold?*
  She paused. She felt the chill on her skin. But did she know she was cold? Or did she just feel it? If she stood here long enough, would she warm up without noticing? If she couldn't tell the difference between being cold and being not-cold in the next minute, could she ever truly claim to know she was cold right now?
  She looked at her hands. They were steady.
  She knew she was home. But as she reached for the door handle, she wondered: Did she know that she knew? Or was that just another step on the slope, another indistinguishable moment in the dark, pretending there was a light switch when there was only the fade.
  She turned the key. The lock clicked. It sounded final. But she knew, even as she walked inside, that if she listened closely enough, the sound of the lock fading was indistinguishable from the silence that followed. And she wasn't sure she knew where one ended and the other began.
