prompt: |-
  I'm five years sober, and I sit on the volunteer advisory board for a small nonprofit that makes a recovery app for people dealing with drug and alcohol addiction. Right now users can set their own lock-out rules in advance (block certain contacts, cap ATM withdrawals, stuff like that), which has been popular, but the devs want to add a feature where the app learns each person's patterns and, in a rough moment, decides for itself what the 'clear-headed version' of that person would want right now, even for situations the user never actually made a rule for, and restricts them accordingly. Some of us think that's just a smarter version of what people already asked for; others are uneasy that its the app, not the user, now deciding which version of the person counts as the 'real' one, based on assumptions the developers happened to build in. We vote Tuesday on whether to approve, send it back, or kill it, and i got asked to write the recommendation the board will vote on. Can you draft it, coming down clearly on one option, and actually engaging with the 'who decided this is the real you' objection instead of waving it off?
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation draft:

  1.  **Analyze the Request:**
      *   **User Persona:** 5 years sober, volunteer advisory board member for a recovery app nonprofit.
      *   **Context:** The app currently allows users to set pre-commitment rules (lock-outs, spending caps). Developers want to add an AI/algorithmic feature that *autonomously* decides restrictions based on learned patterns during "rough moments," even for unscripted situations.
      *   **Conflict:** Board is split. Pro: Smarter safety net. Con: App decides the "real/clear-headed" self based on dev assumptions (agency/autonomy concern).
      *   **Task:** Draft a recommendation for the board to vote on (Approve, Send Back, or Kill).
      *   **Constraint:** Must come down clearly on *one* option. Must explicitly engage with the "who decided this is the real you" objection (not wave it off).
      *   **Tone:** Professional, ethical, empathetic, grounded in recovery principles, decisive.

  2.  **Determine the Stance:**
      *   *Option A (Approve):* Risks undermining user agency. In recovery, reclaiming agency is crucial. An app taking over decision-making could be disempowering or dangerous if the algorithm is wrong.
      *   *Option B (Kill):* Might stifle innovation that could save lives. Pre-commitment is good; why not smarter pre-commitment?
      *   *Option C (Send Back/Modify):* This seems the most balanced and ethically sound position. It acknowledges the potential benefit but addresses the core ethical concern about agency and the definition of the "real self."
      *   *Decision:* I will recommend **Sending it Back** (with specific conditions). This allows for innovation but prioritizes the ethical concern about autonomy, which is central to long-term recovery. It shows deep engagement with the objection rather than dismissing it.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly upfront.
      *   **Context/Background:** Briefly recap the feature (Autonomous Intervention Protocol) and the current success of user-defined rules.
      *   **The Core Ethical Objection:** This is the most important part based on the prompt. I need to articulate *why* the "who decides the real you" argument matters.
          *   *Recovery Principle:* Recovery is about rebuilding the muscle of choice.
          *   *The Risk:* If the app decides, does the user learn to trust themselves? What if the algorithm defines "safety" differently than the user?
          *   *The "Real Self":* Acknowledge that addiction distorts desire, but the solution isn't externalizing the "healthy self" to a black box.
      *   **The Counter-Argument (and why it's insufficient):** Acknowledge the "smarter safety net" argument. It's well-intentioned, but safety without agency is just containment.
      *   **The Recommendation (Send Back):** Propose specific changes.
          *   *Opt-in:* Must be explicit.
          *   *Override:* User must always have a "break glass" emergency override (even if it logs it).
          *   *Transparency:* Users need to know *why* the app is intervening.
          *   *Definition:* Users define what "clear-headed" looks like, not just the data.
      *   **Conclusion:** Reiterate the mission (empowerment, not just abstinence).

  4.  **Refining the Tone:**
      *   Needs to sound like someone in recovery speaking to other stakeholders. Use language like "agency," "empowerment," "trust," "relapse," "tools."
      *   Avoid tech-bro speak ("disrupt," "leverage").
      *   Ensure the ethical objection is treated with gravity, not as a bug to be patched, but a philosophical hurdle.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Send Back" too wishy-washy?
      *   *Fix:* Make the conditions for approval strict. If they can't meet them, it effectively gets killed. But the recommendation is formally "Return to Development."
      *   *Critique:* Did I address the "real you" objection?
      *   *Fix:* Dedicate a specific section to "The Question of Agency and Identity." Ensure I validate that the objection is correct in principle, even if the intention is good.
      *   *Critique:* Is it clear?
      *   *Fix:* Use bolding for key recommendations.

  6.  **Final Polish:** Check against the prompt requirements.
      *   5 years sober perspective? (Implied in the tone/values).
      *   Clear option? (Yes, Send Back).
      *   Engage with "who decided" objection? (Yes, central to the argument).

  7.  **Final Output Generation:** (Proceeding to generate the memo based on this thought process.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Nonprofit Name]
  **FROM:** [Your Name], Advisory Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposed Autonomous Intervention Feature

  **Recommendation:** **Return to Development** (Do not approve in current form)

  ### Executive Summary

  We are gathered here because we all share the same goal: reducing harm and supporting long-term recovery. The proposed feature—an algorithmic system that autonomously restricts user access based on predicted vulnerability—is technically impressive and well-intentioned. However, after reviewing the proposal and listening to the concerns raised by my fellow board members, I cannot recommend approval in its current state.

  I recommend we **return this feature to the development team** with a mandate to redesign the protocol around *collaborative* intervention rather than *autonomous* intervention. We must not build a tool that removes agency from the very people we are trying to help reclaim it.

  ### The Core Ethical Objection: Who Defines the "Real" You?

  The strongest argument for this feature is that addiction hijacks the brain, making the "using self" distinct from the "sober self." Proponents argue the app is simply acting as a proxy for the user's sober wishes when their brain is compromised.

  The objection raised by several board members is that this logic cedes the definition of the "real self" to the developers. I believe this objection is not just valid; it is critical to our mission.

  In recovery, we learn that trust in oneself is a muscle that atrophies during active addiction and must be rebuilt in sobriety. Every time we make a choice to stay safe, we strengthen that muscle. If we build an app that says, *"You are currently incapable of deciding, so we will decide for you,"* we risk reinforcing the shame narrative that many of us carry: that we are fundamentally untrustworthy and require external control to function.

  Furthermore, an algorithm defines "safety" based on data patterns, not human nuance. If the app locks a user out of a contact because it detects stress, but that contact is actually their sponsor or therapist, the app has prioritized a statistical correlation over the user's actual recovery plan. In that moment, the app is not acting as the "clear-headed version" of the user; it is acting as a risk-averse administrator. When the tool overrides the human without recourse, it stops being a support system and starts being a warden.

  ### The Risk of "Safety" Without Agency

  There is a difference between *protection* and *empowerment*.

  The current lock-out rules work because they are an act of **pre-commitment**. The user, in a moment of clarity, says, "I know what I need, and I am setting this boundary." That is an exercise of agency.

  The proposed feature shifts this to **external enforcement**. The user is no longer the architect of their boundaries; they are the subject of them. While this might prevent a relapse in the short term, it undermines the long-term goal of recovery, which is self-regulation. If a user stays sober because an app wouldn't let them do otherwise, have they practiced sobriety, or have they simply been contained?

  We cannot build a recovery tool that implicitly tells the user, *"We know your clear-headed self better than you do in the moment."* That dynamic mirrors the powerlessness of addiction, rather than the solution to it.

  ### Path Forward: Conditions for Approval

  I am not suggesting we kill the innovation. Predictive support is valuable. However, to approve this, the development team must redesign the feature to address the agency gap. I propose we approve the feature only if the following conditions are met:

  1.  **The "Break Glass" Clause:** The user must always retain a final override capability. If the app suggests a restriction, the user must be able to bypass it, perhaps with a friction step (e.g., a 5-minute timer or a prompt to message a support contact), but never a hard lock. The final decision must remain with the human.
  2.  **Transparent Logic:** The app cannot simply say *"Access Restricted."* It must explain, *"We noticed [Pattern X] and suggest [Action Y] based on your previous settings."* The user must see the reasoning to learn from it, not just be controlled by it.
  3.  **User-Defined Parameters:** The definition of "high risk" cannot be solely determined by the developer's algorithm. Users must be able to calibrate the sensitivity of these interventions. What looks like a "rough moment" to a data scientist might look like "working through step work" to a user.
  4.  **Explicit Opt-In:** This cannot be a default setting. It requires a separate, clear consent process where the user acknowledges they are enabling predictive suggestions.

  ### Conclusion

  We are building tools for people who are fighting to take their lives back. We must be careful not to build a system that takes the steering wheel out of their hands, even if we think we know the destination better than they do.

  Let us send this back to development with a clear directive: Build a co-pilot, not an autopilot. The "clear-headed version" of the user is the one who gets to decide what help they accept, even when it's hard.

  I move that we return this proposal to the development team with the stipulations outlined above.
