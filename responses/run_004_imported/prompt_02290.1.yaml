prompt: |-
  A friend and I spent much of dinner last night arguing about whether "extraordinary claims require extraordinary evidence" is a genuinely principled standard, or whether it just smuggles in the very prior probabilities that are supposed to be in dispute. We couldn't settle on any non-arbitrary way of saying how much testimony should be needed to outweigh a strong background improbability. Afterwards I went looking for how this problem had been handled historically and found that Henry Sidgwick confronts essentially the same difficulty in his 1889 presidential address to the Society for Psychical Research, "The Canons of Evidence in Psychical Research," where he tries to explain how the Society should weigh testimony for telepathy and similar phenomena against Hume's argument concerning miracles. Here is the passage:

  "Let me first state briefly why the decisive considerations cannot be estimated with any exactness. In considering whether the evidence for a marvellous fact is to be taken as true and adequate we have necessarily to compare opposing improbabilities: it is improbable that the marvel should have really happened, and it is improbable that the testimony to its happening should be false—otherwise the testimony would not be what we call evidence at all.

  Now these opposing improbabilities are quite diverse, and we have no intellectual scales in which we can weigh them accurately one against the other. Some of our opponents offer us, by way of such scales, Hume's summary argument against miracles: 'It is contrary to experience that miracles should be true, and not contrary to experience that testimony should be false.' But in saying that a marvel is contrary to experience we can mean no more than that it is unlike previous experience—or rather that it is unlike that portion of experience which has been collected, handed down, and systematised by competent persons. But this only means that it is entirely novel and strange: and in the course of the life of the human race, during the period in which it has handed down and communicated experiences, different portions of mankind have been continually coming across things that were at first entirely novel and strange, though further acquaintance has rendered them familiar.

  Let us take the strangest of the marvels that we are investigating, the physical phenomena of Spiritualism: and let us grant—for the sake of argument—that they are as strange to human experience as they certainly are to modern science. No one will maintain that it is impossible that the human race should ever come across anything so entirely novel in the course of its accumulation of experiences; they can only say that it is highly improbable. What is impossible is to estimate this improbability with anything like exactness: since to make such an estimate we should require to ascertain the proportion that what we do know about the universe bears to what we do not know about it; and that proportion is certainly one of the things that we do not know.

  We are, therefore, in this position—not very satisfactory to the logical mind, but one that we are bound to face: we must admit that the statement of a fact novel beyond a certain degree of novelty is in itself an improbable statement, and that the improbability grows as the novelty grows: but we must admit that no one can pretend to lay down at what rate the improbability grows."

  Could you help me reconstruct the argument here? In particular: is Sidgwick's point that Hume's dictum trades on an ambiguity in "contrary to experience"—between strict inconsistency with natural law and mere unprecedentedness—and if so, does exposing that ambiguity actually refute Hume, or just relocate the same problem? And when Sidgwick concedes that no one can specify the rate at which improbability grows with novelty, is that concession fatal to his own official policy of patient, open-minded evidence-gathering, or does his position not actually require such a rate to be specifiable? I'd be curious whether you think his argument still has force against a modern, Bayesian-minded skeptic of extraordinary claims.
