answer: |-
  This is a superb passage to bring to bear on your dinner debate. Sidgwick was a rigorous logician and utilitarian, not a gullible believer; his presidency of the Society for Psychical Research (SPR) was an attempt to apply scientific rigor to domains where the scientific establishment preferred *a priori* dismissal.

  Here is a reconstruction of his argument, followed by an analysis of his critique of Hume, the implications of his concession, and its relevance to modern Bayesian skepticism.

  ### 1. Reconstructing Sidgwick's Argument

  Sidgwick's argument can be formalized into four main steps:

  1.  **The Weighing Problem:** Evaluating a marvelous claim requires comparing two competing improbabilities:
      *   $P(M)$: The improbability that the marvel actually occurred.
      *   $P(\neg T|M)$: The improbability that the testimony supporting it is false (deceptive, mistaken, etc.).
      *   *Constraint:* We lack "intellectual scales" to measure these precisely against one another.
  2.  **The Critique of Hume:** Hume attempts to provide these scales by asserting miracles are "contrary to experience" while false testimony is "not contrary to experience."
      *   Sidgwick argues "contrary to experience" is ambiguous. It cannot mean "logically impossible," only "unlike systematized previous experience" (i.e., novel).
      *   History shows that novel things constantly become familiar. Therefore, novelty alone does not entail impossibility.
  3.  **The Ignorance Premise:** To calculate the true improbability of a novel event ($P(M)$), one would need to know the ratio of the **known universe** to the **unknown universe**.
      *   Since we do not know the unknown, we cannot calculate this ratio.
      *   Therefore, we cannot quantify the improbability of the marvel with exactness.
  4.  **The Conclusion:** We must admit that novelty implies *some* improbability, and that this improbability grows with novelty. However, **no one can specify the rate** at which this improbability grows. Therefore, we cannot declare the improbability insurmountable *a priori*.

  ### 2. Sidgwick vs. Hume: Ambiguity and Refutation

  You asked if Sidgwick's point is that Hume trades on an ambiguity in "contrary to experience," and if exposing this refutes Hume or just relocates the problem.

  **The Ambiguity:**
  Yes, Sidgwick identifies a slippage in Hume. Hume wants "contrary to experience" to do the heavy lifting of a logical contradiction (i.e., "This violates the Law of Conservation of Energy"). But epistemologically, all we actually have is a catalogue of past observations. To say a miracle is "contrary to experience" is merely to say "We haven't seen this before." Sidgwick points out that "We haven't seen this before" is a claim about the *history of observation*, not necessarily a claim about the *structure of reality*.

  **Refutation or Relocation?**
  It is more of a **dissolution** than a refutation. Sidgwick does not prove that miracles (or telepathy) are likely. He proves that Hume's argument cannot be used as a **conversation stopper**.

  *   **Hume's Position:** The improbability of the miracle is so high (based on uniform experience) that no testimony can ever outweigh it.
  *   **Sidgwick's Counter:** You cannot assert the improbability is *that* high because you cannot quantify the "unknown."
  *   **Result:** The problem is relocated from "Logic forbids belief" to "Empirical data is insufficient to calculate risk."

  This is a significant move. It shifts the burden of proof. For Hume, the skeptic wins by default because the prior probability of a miracle is effectively zero. For Sidgwick, the prior is merely "low but unspecified." This forces the skeptic to engage with the specific testimony rather than dismissing the category of events entirely.

  ### 3. The Concession: Is Ignorance of the "Rate" Fatal?

  Sidgwick concedes: *"No one can pretend to lay down at what rate the improbability grows [with novelty]."*

  **Is this fatal to his policy of open-minded evidence gathering?**
  No. In fact, it is the **necessary condition** for his policy.

  If Sidgwick claimed we *could* specify the rate, he would have to propose a function. If that function were steep (improbability rises quickly), it would vindicate the Humean skeptic. If it were flat, it would vindicate the credulous believer. By admitting the rate is unknowable, Sidgwick creates an epistemic space for investigation.

  *   **Dogmatism requires certainty:** To say "Do not investigate" requires knowing the rate is steep enough to make investigation a waste of resources.
  *   **Methodological Agnosticism requires uncertainty:** To say "Investigate carefully" only requires admitting the rate *might* be shallow enough for evidence to overcome the prior.

  Sidgwick's position is not that telepathy is probable, but that **epistemic humility** forbids us from closing the door. His "official policy" is not "believe everything," but "do not rule out anything based on an unquantifiable prior." The concession protects the SPR from the charge of irrationality; they are not ignoring probability, they are acknowledging the limits of our ability to calculate it.

  ### 4. Sidgwick vs. The Modern Bayesian Skeptic

  Does this argument have force against a modern Bayesian? This is the crux of your dinner debate.

  **The Bayesian Framework:**
  A Bayesian updates beliefs using Bayes' Theorem:
  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$
  Where $P(H)$ is the prior probability of the hypothesis (the "extraordinary claim"). The ECREE maxim is essentially a statement about $P(H)$: if $P(H)$ is extremely low, $P(E|H)$ (the likelihood of the evidence given the hypothesis) must be extremely high to result in a rational belief.

  **Where Sidgwick Bites:**
  Sidgwick attacks the justification for **$P(H)$**.
  A modern skeptic might say, "I assign $P(Telepathy) = 10^{-9}$ based on our current understanding of physics."
  Sidgwick replies: "That prior assumes you know the proportion of the known universe to the unknown universe. You are treating your current physical models as the total sample space of reality. But since you cannot quantify the 'unknown,' that prior is arbitrary."

  **The Force of the Argument:**
  1.  **Against Objective Priors:** Sidgwick's argument is devastating to "Objective Bayesians" who claim priors can be derived logically or from "uniform experience." He shows that "uniform experience" is just "experience so far," and extrapolating from that to a universal law involves an unquantifiable inductive leap.
  2.  **Against Dogmatic Subjective Priors:** It challenges the skeptic to admit their prior is a *subjective degree of belief* based on current paradigms, not an objective fact about the world. If the skeptic admits this, they must concede that a sufficiently robust $P(E|H)$ (testimony) *could* theoretically update their belief, even if the bar is high.
  3.  **The Reference Class Problem:** Sidgwick anticipates the modern "Reference Class Problem." When Hume says "contrary to experience," which experience? All human experience? Modern scientific experience? The experience of the specific witness? Sidgwick notes that "different portions of mankind have been continually coming across things that were at first entirely novel." This suggests the reference class for "novel events that turned out to be true" is not empty, making the prior non-zero.

  **Where the Bayesian Might Resist:**
  A sophisticated modern Bayesian (e.g., a Carnapian or a proponent of Solomonoff Induction) might argue that while we don't know the *total* universe, we have strong reasons to assign low priors to claims that violate **causal closure** or **conservation laws**. They would argue that Sidgwick underestimates the coherence of our existing web of belief. To accept telepathy isn't just to add a new fact; it's to unravel the causal structure that makes prediction possible. Therefore, the "rate" of improbability *is* steep, not because of ignorance, but because of the systemic cost of the belief.

  ### Summary for Your Debate

  Sidgwick offers a middle path between your positions:

  1.  **Against the "Principled Standard" view:** Sidgwick agrees that we cannot non-arbitrarily specify *how much* evidence is needed (the "rate"). There is no formula for ECREE.
  2.  **Against the "Smuggled Priors" view:** Sidgwick agrees that skeptics often smuggle in priors by treating "current science" as "all possible experience."

  **The Verdict:** Sidgwick suggests that "Extraordinary claims require extraordinary evidence" is a valid heuristic for **caution**, but an invalid argument for **dismissal**.
  *   It is valid because novelty *does* correlate with improbability (we should be cautious).
  *   It is invalid as a dismissal because the *degree* of that improbability is unknowable (we cannot rule it out).

  His argument remains powerful today because it targets the **epistemic arrogance** of assuming our current sample of "natural law" is the final draft of reality. It doesn't prove the extraordinary claim is true; it proves that the skeptic's certainty is unjustified.
