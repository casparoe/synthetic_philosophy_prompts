answer: |-
  The lead pig sat on the bench between them, a squat, grey cylinder scarred by decades of tongs and Geiger counters. Inside, the Cobalt-60 button hummed with a silence only a physicist hears. I'd calibrated sources against that button in '89, and my post-doc had calibrated against it in '15. It was the closest thing to a permanent object in the room.

  My guests were not physicists. Mara was a statistician of the old school, sharp-eyed and intolerant of metaphysics. Elias was a metaphysician who read physics papers for fun, wearing a tweed jacket that seemed to absorb the fluorescent light.

  I poured the coffee. "The question is simple," I said, gesturing to the pig. "Take one atom of Co-60. I tell my students it has a 50% chance of decaying within the next 5.27 years. What am I talking about? Is it in the atom, or is it in the ledger?"

  Mara didn't wait for the cream. "It's in the ledger, Arthur. Or rather, it's in the hypothetical sequence. You cannot have a probability of one. Probability is a ratio. A frequency. To say this specific nucleus has a probability is shorthand for saying *if* you had an infinite collection of identical nuclei, half would decay in that window."

  Elias leaned forward, resting his elbows on the lab bench. "But they aren't identical. They are distinct entities. And you're talking about a specific one. If I hold a glass and drop it, it has a disposition to shatter. That disposition is real *now*, before it hits the floor. It doesn't require me to drop a billion other glasses to make the fragility of this one real."

  "Fragility is a macro-property," Mara countered. "It supervenes on molecular bonds. Probability isn't a bond. If you say this single nucleus has a '50% disposition,' you're attributing a mathematical ratio to a physical object. It's a category error. What is the physical substance of '50%'? Is it a field? A force?"

  "It's a propensity," Elias said. "A physical tendency. Just as mass is a tendency to resist acceleration, decay constant is a tendency to transition states. It's an ontological feature of the nucleus, grounded in its wavefunction."

  "Grounded how?" Mara pounced. "Because here is where your house of cards falls. Humphreys' Paradox. You know it?"

  Elias sighed. "Paul Humphreys. 1985."

  "Walk Arthur through it," Mara said, turning to me. "Propensity theorists claim probabilities are causal tendencies. Causation runs forward. The state of the nucleus *causes* the decay. So, the propensity is $P(\text{Decay} | \text{State})$. That makes sense. But the probability calculus—Bayes' theorem—requires that probabilities be invertible. I can calculate $P(\text{State} | \text{Decay})$. If propensities *are* probabilities, then there must be an inverse propensity. A tendency of the *decay* to have been caused by the *state*."

  She tapped the table. "Causation doesn't run backwards, Arthur. Effects don't have propensities to produce causes. So, propensities cannot obey the axioms of probability. If they don't obey the axioms, they aren't probabilities. If they aren't probabilities, Elias's theory is empty."

  Elias rubbed his chin. He looked at the lead pig. "That assumes propensities must map one-to-one onto the mathematical calculus in every operation. I'd argue the calculus is a tool we use to model the propensities, not the propensities themselves. The inverse probability is epistemic—it's about our knowledge—not ontological."

  "Then you've surrendered," Mara said. "You've admitted that the 'single-case probability' isn't a physical fact about the world, but a fact about our information. That's Bayesianism, not Propensity. And if it's about information, why does the nucleus decay when no one is looking?"

  "Because the tendency is there regardless of the observer!" Elias's voice rose slightly. "But let's turn the table, Mara. You cling to the long-run frequency. The 'reference class.' Define it."

  Mara didn't blink. "The class of all Co-60 nuclei in the same quantum state."

  "Same quantum state," Elias repeated. "Identical in every relevant respect. But no two nuclei are in the exact same spacetime coordinate. No two experience the exact same vacuum fluctuations. If you include spacetime coordinates in the reference class, every nucleus is its own class of one. The frequency is either 0 or 1. It decays or it doesn't."

  "So we abstract away the irrelevant details," Mara said. "We hold constant the causal factors."

  "Who decides what's causal?" Elias pressed. "That's the Reference Class Problem. Reichenbach knew it. If I want to know the probability of *this* nucleus decaying, I need to know which class it belongs to. Is it the class of 'all Co-60'? The class of 'Co-60 in this specific magnetic field'? The class of 'Co-60 created in a supernova versus a reactor'? The frequency changes depending on how you slice the group. If the probability depends on how I choose the group, it's not a fact about the nucleus. It's a fact about my classification system."

  Mara leaned back, crossing her arms. "We choose the narrowest homogeneous class for which we have reliable statistics. It's pragmatic. Yes, it's derivative. Yes, applying it to a single case is a fiction. But it's a necessary fiction that allows science to function. I can test a frequency claim. I can count decays. I cannot test a 'propensity.' I can never observe a tendency, only the manifestation. If the nucleus doesn't decay, you just say 'the propensity was there, but didn't manifest.' It's unfalsifiable."

  "And if it does decay?" Elias shot back. "You say the frequency was realized. But until it decays, your theory says there is *no fact of the matter* about whether it will. That contradicts the physical reality of instability. The nucleus is vibrating, tunneling, evolving in time. The wavefunction is evolving deterministically until the collapse. That evolution *is* the propensity. To deny it is to deny the physical reality of the quantum state between measurements."

  "The wavefunction is a calculational device," Mara insisted.

  "It predicts interference patterns for single particles!" Elias argued. "Single cases! If the probability were only about ensembles, how do you explain single-particle interference? The particle interferes with itself. That implies a single-case physical reality of probability amplitudes."

  Mara paused. This was the weak point in the armor, and we both knew it. Quantum mechanics had made strict frequentism uncomfortable since 1927.

  "Quantum mechanics is a special case," Mara said, though less firmly. "It describes the statistics of measurement outcomes. Even in the double-slit experiment, we talk about the distribution of hits on the screen."

  "But the hits build up one by one," I interjected, finally stepping in. "I've watched the counter click. *Click. Click. Click.* Each click is a single event. The regularity emerges, but the event is singular."

  "Exactly," Elias said, seizing the opening. "The regularity emerges *because* each single case carries the same weight. The frequency is the shadow; the propensity is the object casting it."

  "But the shadow is all we can measure!" Mara slammed her hand on the bench, not in anger, but emphasis. "Arthur, you spent thirty-five years measuring rates. Did you ever measure a propensity? You measured counts per minute. You measured half-lives derived from aggregate data. You never put a propensity on a scale. If your theory posits entities that are in principle unmeasurable except through the very frequencies they are supposed to explain, isn't it just metaphysical padding?"

  Elias looked at the lead pig. "If I say this glass is fragile, and I never drop it, is it not fragile? If I say this nucleus is unstable, and it happens to be the one that lasts a million years, was it not unstable?"

  "If it lasts a million years, it wasn't Co-60," Mara said dryly.

  "You see?" Elias pointed. "You define the class by the outcome. That's circular."

  "I define the class by the preparation procedure," Mara corrected. "And if the outcome deviates significantly from the predicted frequency, I reject the hypothesis that the preparation was identical. It's a self-correcting system. Your propensity is a one-way ticket. You posit a magic glue inside the atom, and if the math works, you say 'see?'. If the math fails, you say 'the propensity was complex.' It explains everything, which means it explains nothing."

  Elias sat back, looking tired. "And your explanation is that for this specific atom, right now, there is no truth to the claim that it might decay. It's a truth-value gap. That feels... hollow. Physics is supposed to tell us what the world is made of. You're telling me the world is made of data sets."

  "I'm telling you the world is made of events," Mara said. "Patterns of events. Probability is the grammar of those patterns. It's not a noun. It's a verb."

  They sat in silence for a moment. The Geiger counter gave a solitary, random *crack*. We all looked at it.

  "Did you hear that?" I asked.

  "A single event," Elias said. "Caused by a real tendency in that specific atom."

  "A data point," Mara said. "Waiting for a cohort to give it meaning."

  I looked at the lead pig. It had outlived three generations of students. It would outlive us. Inside, billions of nuclei were wrestling with this exact question, one by one.

  "Mara," I said. "If I bet you a hundred dollars that this specific nucleus decays in the next hour, and I give you 50-to-1 odds... are you taking the bet?"

  Mara smiled, a thin, sharp expression. "I'd take the bet, Arthur. Because I know the frequency."

  "But why?" Elias asked. "If there's no fact of the matter about the single case, why is the bet rational?"

  "Because rationality is also about frequencies," Mara said. "I know that in the long run, taking that bet pays off."

  "But I only get to play once," Elias said.

  "Then you're gambling," Mara said. "And gambling is where philosophy ends."

  Elias shook his head. "No. Gambling is where the propensity reveals itself. The risk is real. The chance is real. Even if it's the only time I ever roll the dice."

  I poured more coffee. The counter stayed silent.

  "I think," I said, "that Sunday dinner is going to be very long."

  Mara picked up her cup. "Bring wine. We'll need to calibrate the reference class of the vintage."

  Elias chuckled. "Only if you admit the wine has a propensity to give me a headache."

  "Deal," Mara said. "But I'm calculating the frequency."

  They didn't resolve it. Mara had landed the heavy blow on Humphreys' Paradox—Elias still hadn't fully explained how a causal tendency inverts without becoming magic. But Elias had landed his hit on the Reference Class—Mara's "identical conditions" felt increasingly like a theoretical shield against the messy uniqueness of reality.

  As they packed up, I looked back at the Cobalt button. It didn't care about reference classes or propensities. It just sat there, waiting to be itself. I realized I wouldn't be defending a position at dinner. I'd be mediating a truce between two ways of seeing the world, both of which were necessary, and neither of which was complete.

  "Arthur?" Elias called from the door. "One last thing. When you calibrated that source... did you ever worry that the probability might change tomorrow?"

  "No," I said.

  "Neither did I," he said. "And that's why I'm a propensity theorist. The stability of the chance is a property of the object, not the history."

  Mara rolled her eyes. "Or it's a property of the laws of physics, which describe the frequencies of the universe."

  "Same thing," Elias said.

  "Isn't it," Mara replied.

  The door closed. I turned off the lights. The lab was dark, save for the faint, invisible hum of the lead pig, ticking away its own time, indifferent to how we counted it.
