answer: |-
  **Setting:** *A university conference room, late afternoon. The Research Ethics Board meeting has just adjourned. Files are being stacked, laptops closed. The chair, Dr. Aris (the moral philosopher), has already left. ELENA (a biologist, moral testimony optimist) and MARCUS (a psychologist, moral testimony pessimist) linger by the coffee urn.*

  **Marcus:** (Stirring sugar into a cold cup) Well, that was efficient. Aris spoke for twenty minutes, cited a principle I'd never heard of, and the rest of us raised our hands like trained seals.

  **Elena:** Trained seals keep the subjects safe, Marcus. That protocol involved vulnerable minors and deceptive coding. Unless you think Aris was wrong, I'd rather we voted right by deference than voted wrong by independence.

  **Marcus:** It's not about being *wrong*. It's about *how* we were right. I felt like I was outsourcing my conscience. If a structural engineer tells me this bridge won't collapse, I walk across it. I don't need to understand the load-bearing calculus. But morality isn't a bridge.

  **Elena:** Why not? In this context, it's a safety mechanism. We are the regulatory checkpoint. If the ethicist says "this violates autonomy," and she's right, then the study stops. What epistemic value did you add by struggling to derive that conclusion yourself?

  **Marcus:** The value is *mine*. Look, there's a distinction in the literature—Alison Hills writes about it—between moral *knowledge* and moral *understanding*. By deferring to Aris, maybe I gained knowledge. I now believe "Study X is impermissible." But I don't understand *why*. I can't weigh the competing principles. I can't apply the logic to a slightly different case next week. I just have the verdict.

  **Elena:** But testimony gives you reasons, doesn't it? Aris didn't just say "No." She gave an argument. She cited the Belmont Report, she discussed the coercive nature of the incentive structure.

  **Marcus:** She gave *her* reasons. I didn't grasp the force of them. Imagine a wine critic tells me this Bordeaux is sublime. I drink it. I trust her palate. But I haven't developed *my* palate. In aesthetics, that's fine; I just want the good wine. In morality, the point isn't just the "good outcome." The point is *my* agency. If I act solely because Aris told me to, I'm not acting morally. I'm acting obediently.

  **Elena:** That's a very Kantian purity test, Marcus. But let's look at the asymmetry you're implying. You're saying moral testimony is uniquely deficient. But we defer on facts all the time. If Aris told us, "The statistical power analysis is flawed," we'd defer. We aren't statisticians. Why is the moral domain special?

  **Marcus:** Because the statistical flaw is external to me. The moral flaw is internal to the action *I* am authorizing. When you defer to a mechanic, you care about the car running. The mechanic's expertise is instrumental. When you defer on morality, you are treating your own moral judgment as instrumental, something to be bypassed for efficiency. That's where the "ick" factor comes from. It's not just a feeling; it's a degradation of moral character. If I never exercise the muscle, it atrophies.

  **Elena:** Okay, but that assumes we all have the time and capacity to be moral bodybuilders. This is the "division of moral labor." I'm an immunologist. I know what a pathogen does. I don't know the nuances of deontological constraints on deception. Why should I spend three hundred hours mastering ethics to do my job, when I can identify a reliable expert?

  **Marcus:** And there's the rub. How do you identify the expert? That's the second problem with moral testimony, distinct from the mechanic. I know the mechanic is good because my car runs. I know the wine critic is good because her predictions align with consensus or my own refined taste. How do you verify a moral expert?

  **Elena:** Peer recognition, coherence of argument, track record. Aris has been doing this for twenty years. Her judgments align with federal regulations and precedents.

  **Marcus:** Those are institutional markers, not moral ones. A brilliant fascist could be coherent and recognized within their own circle. With the mechanic, the success condition is objective: the car works. With the moralist, the success condition is *moral truth*. But if I need testimony to know moral truth, I can't use moral truth to verify the testifier. It's circular. I have to already know the answer to know if she's an expert.

  **Elena:** That's skepticism, Marcus. That applies to medicine too. I can't verify the doctor's diagnosis without medical knowledge. I rely on credentials, institutional oversight, consensus. We do the same here. The IRB system *is* the oversight. You're asking for a level of verification that doesn't exist in any complex field.

  **Marcus:** But in medicine, if I defer to the doctor, I'm not "being healthy" second-hand. My body gets cured. In morality, *I* am the one acting. If I defer, I am essentially saying, "I don't trust my capacity to grasp the good." It creates a kind of alienation. I'm doing the right thing, but I'm not *with* the right thing. I'm just following orders.

  **Elena:** Let's push that. Suppose the study *had* gone ahead. Suppose it caused real psychological harm to those kids because we didn't listen to Aris. Would you tell the harmed families, "Well, at least our moral agency is intact because we tried to figure it out ourselves"?

  **Marcus:** No, obviously not. Consequences matter. But there's a difference between a *decision procedure* and a *criterion of rightness*. Aris might be the best criterion for what's right. But for *me*, as a board member, the procedure matters. I need to own the decision.

  **Elena:** But you *did* own it. You voted. You heard her reasons. You found her credible. That's not blind obedience; that's rational trust. You're treating moral reasons like facts that can be transmitted. If I tell you "The earth is round," you believe me. You don't need to measure the circumference. Why is "Deception is wrong here" different?

  **Marcus:** Because "The earth is round" doesn't demand anything of your will. "Deception is wrong" demands that *you* reject the deception. Hills puts it this way: To have moral worth, you need to act *because* it's right, based on your own grasp of the reasons. Testimony gives you the conclusion, maybe even the premises, but it doesn't give you the *grasp*. It's like me giving you my homework. You have the answers. You don't have the education.

  **Elena:** But this isn't school. It's governance. We aren't trying to cultivate virtue in the board members; we're trying to protect research subjects. If moral testimony allows us to reach the correct verdict more reliably than individual intuition, then pessimism is a luxury we can't afford. You're prioritizing the purity of the voter over the safety of the subject.

  **Marcus:** I'm prioritizing the long-term integrity of the institution. If the board becomes a place where scientists just wait for the philosopher to speak so they can vote, then the scientists stop thinking ethically about their own work. They compartmentalize. "Ethics is what Aris does." No. Ethics is what *we* do. Aris is supposed to facilitate our understanding, not replace it.

  **Elena:** Fair. But sometimes the material is too dense, the time is too short. In those cases, isn't it responsible to defer? Isn't the "optimist" view actually the more humble one? Admitting, "I am not the expert here, and the stakes are too high for my guesswork."

  **Marcus:** Humility is good. But there's a difference between humility and abdication. Maybe the solution isn't to vote on the spot. Maybe it's to say, "Aris, you've convinced us the stakes are high, but we need to recess and read the principles so we can vote next week understanding *why*."

  **Elena:** (Laughs) You'd like that, wouldn't you? Another meeting.

  **Marcus:** (Smiles) I'm a psychologist, Elena. I believe in the process.

  **Elena:** Look, I'll grant you this: If we *never* engage, we lose something. But I won't grant that the belief itself is epistemically flawed. If Aris is right, and I believe her because she's reliable, I know the truth.

  **Marcus:** You know the *that*. You don't know the *why*. And in morality, the *why* is the only thing that makes the action yours.

  **Elena:** Then let's hope the "why" sinks in later. But for the record, I'm sleeping better knowing that protocol is dead.

  **Marcus:** Me too. But I'd sleep better if I knew *I* killed it, not just her.

  **Elena:** (Picks up her bag) Next agenda item: Deception in recruitment. I'm reading the literature before we meet. Happy?

  **Marcus:** (Raises coffee cup) A start.
