prompt: |-
  I'm on the steering committee for my company's code review process (we call it the "guild," don't ask), and we're fighting over how many approvals a PR needs before it can merge into our main repo -- it's 2 right now. A principal engineer wants to bump it to 5, citing the Condorcet Jury Theorem: his argument is that if each reviewer is even a little better than a coin flip at catching a real bug, stacking on more independent reviewers should mathematically push the error rate toward zero. Some of us are skeptical, since our reviews aren't very independent in practice -- everyone reads the earlier comments before leaving their own. I need to send the committee's decision memo before next weeks meeting -- can you draft it? Land on an actual policy (5 approvals, 2, or something else, maybe changing how reviews get run rather than just headcount), give the real reasoning including the math, and actually engage with the principal engineer's arguement instead of just waving it off as "reviews are messy irl."
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Steering committee for a code review process ("the guild").
      *   **Conflict:** Current policy is 2 approvals. A Principal Engineer (PE) wants 5 approvals based on the Condorcet Jury Theorem (CJT). Skeptics argue reviews aren't independent (social proof/bias).
      *   **Task:** Draft a decision memo for the committee.
      *   **Requirements:**
          *   Land on an actual policy (2, 5, or alternative).
          *   Provide real reasoning, including the math (engage with CJT).
          *   Don't just wave off the PE's argument; address it substantively.
          *   Tone: Professional, decisive, technically grounded, collaborative but firm.
          *   Deadline: Before next week's meeting.

  2.  **Deconstruct the Principal Engineer's Argument (Condorcet Jury Theorem):**
      *   *Theorem:* If $n$ voters decide by majority rule, and each voter has an independent probability $p > 0.5$ of being correct, then the probability of the majority decision being correct approaches 1 as $n \to \infty$.
      *   *Application to Code Review:* Reviewers = voters. Correct = finding a bug/blocking a bad merge. $p$ = reviewer competence.
      *   *The Flaw:* The theorem relies heavily on *independence*. If reviewers see previous comments, their decisions become correlated. If Reviewer 1 says "LGTM," Reviewer 2 is biased toward "LGTM." This reduces the effective $n$.
      *   *The Cost:* Code review has diminishing returns and high latency costs. 5 approvals creates a bottleneck.

  3.  **Evaluate the Counter-Argument (Lack of Independence):**
      *   In GitHub/GitLab, comments are visible.
      *   Social pressure exists ("If the senior dev approved, who am I to say no?").
      *   This creates *correlated error*. If the first reviewer misses a bug, the second is more likely to miss it too.
      *   Mathematically, this violates the $i.i.d.$ (independent and identically distributed) assumption of CJT.

  4.  **Determine the Best Policy:**
      *   *Option A: 5 Approvals.* Too slow. Violates flow efficiency. Math doesn't hold due to correlation.
      *   *Option B: 2 Approvals (Status Quo).* Reasonable, but maybe we can improve quality without adding headcount.
      *   *Option C: Hybrid/Process Change.* Keep 2 approvals but enforce *blind* reviews or specific roles (e.g., one domain expert, one generalist). Or focus on *who* reviews rather than *how many*.
      *   *Decision:* Stick with 2 approvals but modify the *process* to increase independence and competence ($p$). Increasing $p$ is more effective than increasing $n$ when $n$ is already small and correlation is high.
      *   *Rationale:* Improving $p$ from 0.6 to 0.8 has a bigger impact on small $n$ than increasing $n$ from 2 to 5 with correlated errors. Also, latency costs outweigh marginal safety gains.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the decision clearly (Stay at 2, but change process).
      *   **Background:** Acknowledge the PE's proposal and the CJT argument.
      *   **Mathematical Analysis (The Core):**
          *   Explain CJT simply.
          *   Show the formula: $P_n = \sum_{k=\lceil n/2 \rceil}^{n} \binom{n}{k} p^k (1-p)^{n-k}$.
          *   Demonstrate the "Independence Assumption" failure. Introduce correlation coefficient ($\rho$).
          *   Show that with high correlation, adding reviewers yields diminishing returns.
      *   **Operational Reality:** Latency, context switching, bottlenecking.
      *   **The Decision:** 2 approvals remains.
      *   **New Mitigations:** How to actually improve quality (increase $p$).
          *   Reviewer assignment (domain experts).
          *   Blind reviews (maybe too hard technically, but suggest "independent first pass").
          *   Automated checks (increase $p$ for trivial stuff).
      *   **Conclusion:** Reiterate commitment to quality without sacrificing velocity.

  6.  **Refining the Math/Argument:**
      *   Need to be careful not to sound condescending to the PE. Acknowledge the theoretical soundness but highlight the practical violation of assumptions.
      *   *Key Insight:* CJT works for *independent* jurors. Code reviewers are *collaborative* jurors.
      *   *Alternative Metric:* Focus on $p$ (competence) rather than $n$ (count).
      *   *Cost Function:* $Cost = n \times Time + Risk(1 - Probability_{correct})$. Minimizing cost usually favors small $n$ and high $p$.

  7.  **Review against Constraints:**
      *   Did I engage with CJT? Yes.
      *   Is there a policy decision? Yes (2 + process changes).
      *   Is the tone appropriate? Yes, respectful but data-driven.
      *   Is it ready for a committee? Yes.

  8.  **Final Polish:** Check for clarity, formatting, and ensure the "guild" culture is respected (don't be too bureaucratic). *Self-Correction during drafting:* Make sure not to promise "blind reviews" if the tooling doesn't support it easily. Instead, suggest "parallel reviews" or "first comment embargo." Let's go with "Independent First Pass" as a guideline.

  9.  **Final Output Generation:** (Proceed to generate the memo based on these thoughts.)
answer: |-
  **TO:** Code Review Guild Steering Committee  
  **FROM:** [Your Name/Steering Committee Chair]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Decision Memo: PR Approval Threshold & Review Process Standards  

  ### Executive Summary

  After reviewing the proposal to increase the mandatory pull request (PR) approval threshold from two (2) to five (5) reviewers, the Steering Committee has decided to **maintain the current threshold of two approvals.** 

  However, to address the underlying concern regarding bug escape rates, we will implement **process changes designed to increase reviewer independence and competence.** We believe that improving the probability of individual reviewer accuracy ($p$) yields a higher return on investment than increasing reviewer headcount ($n$) in our current collaborative environment.

  This memo details the mathematical reasoning, operational constraints, and the new process guidelines effective November 15.

  ---

  ### 1. Background & The Proposal

  The proposal to increase approvals to five was grounded in the **Condorcet Jury Theorem (CJT)**. The argument posits that if each reviewer has a probability $p > 0.5$ of correctly identifying a defect, increasing the number of reviewers ($n$) should mathematically drive the probability of a correct collective decision toward 1.

  While theoretically sound in the abstract, the Committee determined that applying CJT to our specific code review workflow violates critical assumptions of the theorem. Specifically, CJT requires **statistical independence** between voters. In our workflow, this assumption does not hold.

  ### 2. Mathematical Analysis: Why $n=5$ Doesn't Solve the Problem

  The Condorcet Jury Theorem calculates the probability of a correct majority decision ($P_n$) as:

  $$ P_n = \sum_{k=\lceil n/2 \rceil}^{n} \binom{n}{k} p^k (1-p)^{n-k} $$

  Where:
  *   $n$ = Number of reviewers
  *   $p$ = Probability an individual reviewer is correct (competence)
  *   $k$ = Number of correct votes needed for majority

  **The Independence Assumption**
  This formula assumes every reviewer's decision is an independent event. In our GitHub/GitLab workflow, reviewers see previous comments before submitting their own. This introduces **correlation** ($\rho$).

  When Reviewer B sees Reviewer A has approved, social proof and anchoring bias increase the likelihood that Reviewer B will also approve, regardless of defects. If Reviewer A misses a bug, Reviewer B is statistically more likely to miss it too.

  When correlation exists, the effective sample size ($n_{eff}$) is significantly lower than the actual headcount. A simplified approximation for correlated voters suggests:

  $$ n_{eff} \approx \frac{n}{1 + (n-1)\rho} $$

  If we mandate 5 reviewers ($n=5$) but have a moderate correlation of $\rho = 0.4$ (due to visible comments and seniority bias), our effective reviewer count drops to:

  $$ n_{eff} \approx \frac{5}{1 + (4)(0.4)} = \frac{5}{2.6} \approx 1.92 $$

  **Conclusion:** Mandating 5 approvals in a non-blind system provides marginally more statistical safety than our current 2 approvals, while incurring 150% more latency cost. We are paying for headcount we do not statistically receive.

  ### 3. Operational Cost Analysis

  Increasing $n$ introduces linear latency costs and exponential context-switching overhead.

  *   **Merge Latency:** Waiting for 5 specific humans to find time in their schedules creates a bottleneck. This encourages "rubber stamping" to clear the queue, which ironically lowers $p$ (competence).
  *   **Diminishing Returns:** The first two reviewers typically catch 80-90% of issues. The 3rd, 4th, and 5th reviewers tend to focus on nitpicks (style, naming) rather than logic errors, as the "low hanging fruit" is already harvested.
  *   **Responsibility Diffusion:** With 5 approvers, individual accountability drops (the "Bystander Effect"). With 2 approvers, each feels personally responsible for the merge.

  ### 4. The Decision: Optimize $p$, Not $n$

  Since we cannot easily achieve independence without blinding reviewers (which hampers collaboration), we must focus on increasing $p$ (individual competence) and reducing $\rho$ (correlation).

  **Policy Decision:**
  1.  **Approval Threshold:** Remains at **2 approvals**.
  2.  **Reviewer Selection:** Mandatory assignment logic updated (see below).
  3.  **Process Change:** Implementation of "Independent First Pass" guidelines.

  ### 5. New Process Guidelines

  To mitigate the correlation risk and improve $p$, the Guild will adopt the following practices:

  **A. Domain-Expert Assignment (Increasing $p$)**
  Instead of grabbing any two available seniors, PRs must be assigned based on code ownership.
  *   **Reviewer 1:** Must be a "Code Owner" of the specific module being changed (high context, high $p$ for logic errors).
  *   **Reviewer 2:** Must be from a dependent or adjacent team (high $p$ for integration errors/API contracts).
  *   *Rationale:* Diverse expertise reduces the chance that both reviewers miss the same class of bug.

  **B. The "Blind Window" Recommendation (Reducing $\rho$)**
  We cannot technically enforce blind reviews in our current tooling, but we recommend a **24-hour parallel window** for the first two reviewers.
  *   Reviewers should be encouraged to post initial findings before reading others' comments.
  *   CI/CD bots will be configured to hide reviewer comments from *other reviewers* until the first review is submitted (if tooling allows via plugins), or we will adopt a cultural norm of "Post First, Read Later."

  **C. Automated Triage**
  To ensure human reviewers focus on logic rather than syntax:
  *   All linting, formatting, and static analysis must pass before a human review is requested.
  *   This ensures human $p$ is not diluted by trivial errors.

  ### 6. Addressing the Principal Engineer's Concern

  We want to explicitly acknowledge the validity of the Principal Engineer's concern: **bug escape rates are a critical risk.** The CJT argument is mathematically robust *if* the inputs are independent. 

  By rejecting the $n=5$ proposal, we are not rejecting the math; we are rejecting the input data. Our reviewers are not independent jurors; they are a collaborative team. Treating them as independent jurors creates a false sense of security. 

  We propose a trial period of **3 months** for the new guidelines above. We will track:
  1.  **Bug Escape Rate:** Post-merge defects found in staging/production.
  2.  **Cycle Time:** Time from PR open to merge.

  If bug escape rates do not improve, we will revisit the approval threshold, potentially considering a "weighted vote" system (e.g., 1 Senior + 1 Domain Expert) rather than a raw headcount increase.

  ### 7. Next Steps

  *   **Nov 1:** Update repository branch protection rules to enforce Code Owner reviews.
  *   **Nov 15:** Guild workshop on "Independent Reviewing Techniques."
  *   **Feb 1:** Review metrics and reassess policy.

  Thank you to everyone who contributed to this debate. The rigor of this discussion proves that the Guild is functioning exactly as intended: questioning assumptions to find the best engineering path forward.

  Signed,  
  The Steering Committee
