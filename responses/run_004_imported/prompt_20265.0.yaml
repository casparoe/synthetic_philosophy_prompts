      *(Self-Correction during drafting)*: I need to make sure I don't sound *hostile*. The prompt says "pins down," "built around," "makes her actually distinguish." It needs to be tough but fair podcasting, not a debate club attack. The host is retired and curious, not angry.

      *(Refining Q1 - Ghazali's Options)*: Ghazali actually argues *against* the philosophers who claim necessary connection. But does he affirm *no* natures at all, or just that natures are contingent? The prompt asks to distinguish between "God re-does burning at every instant" vs. "God built a suspendable disposition." This is a nuanced interpretive debate. I need to phrase this carefully so she doesn't just say "Ghazali was vague."

      *(Refining Q3 - Hume)*: This is a classic confusion. Hume says "We can't perceive the glue." Ghazali says "There is no glue." The follow-up needs to catch her if she conflates skepticism with ontological denial.

