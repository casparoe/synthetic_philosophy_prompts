answer: |-
  "The eulogy was generous," Marcus said, staring into his paper cup of funeral coffee. "Especially considering you think poor Arthur was deluded about the meeting point."

  Elena didn't look at him. She was watching the mourners cluster near the hydrangeas. "I think Arthur was comforted. There's a difference."

  "Is there? He believed he'd see his wife again. You believe he won't. That looks like a contradiction, El. Standard logic. One of you is wrong."

  "We've done this. Since '88. You treat 'belief' as a failed physics project."

  "I treat it as a claim about reality. If I say 'there's a tiger in the hall' and you say 'I believe there's a tiger,' but you mean 'the tiger organizes my hallway-walking,' I'm going to get eaten. Or you're being dishonest."

  "So when we stayed up till three arguing about God, you think we were wasting time?" Marcus pressed. "Because if your Wittgensteinian move holds, we were never actually disagreeing. I was making claims; you were... what? Expressing a stance? That renders thirty years of friendship intellectually void."

  Elena turned then, sharp. "We were disagreeing. Just not about ontology. We were fighting over authority. You wanted the universe to be silent unless science spoke; I wanted to know if silence could still mean something. That's a real fight, Marcus. It's just not a fight about data."

  "It's a fight where you changed the rules so you couldn't lose." Marcus stepped closer, voice dropping. "That's the problem. You keep the vocabulary. 'Truth.' 'Belief.' 'Knowledge.' But you strip them of the risk. If religious belief is just a picture that organizes life, it's immune to error. You get the comfort of conviction without the burden of evidence. It's convenient."

  "Convenient isn't false."

  "It's intellectually cowardly. It's exactly what Nielsen meant. Wittgensteinian fideism. You build a fortress where no counter-argument can reach you."

  "Fideism," Elena repeated, tasting the word. "You know Wittgenstein never used that term, don't you? That's your side's invention. Nielsen took a description of how language works and turned it into a prescription for insulation. Ludwig was looking at the grammar; you're accusing me of hiding."

  "I'm accusing you of having it both ways. When it suits you, you talk about God like He's a person who listens. When challenged, He becomes a metaphor for ethical orientation. You shift registers to avoid the hit."

  "Because the hit is category mistake! If I say 'I know my redeemer liveth,' I'm not proposing a hypothesis for peer review. I'm stating a commitment. Would you tell a grieving widow her hope is 'unfalsifiable' so therefore invalid?"

  "I'd tell her she's speaking poetically. I wouldn't let her claim it as knowledge." Marcus shook his head. "Here's the thing, El. If you're right, and these aren't truth-claims, then religion doesn't conflict with science. But believers *say* it conflicts. They say the Resurrection *happened*. Not 'the Resurrection is a useful narrative.' They claim event status. By softening their claims to protect them, you're not defending them. You're patronizing them."

  Elena sighed, the fight leaking out just enough to show the fatigue beneath. "I'm not protecting them from you. I'm protecting the phenomenon from your reduction. You want to say that because the claim can't be tested, it's empty. I'm saying the weight of the claim isn't in its testability. It's in its cost."

  "Cost?"

  "Arthur lived like he was answerable. That costs something. Your view says he was answerable to nothing. That costs something too. We're still disagreeing, Marcus. Just about what counts as a life."

  Marcus looked at her, the anger settling into a grim familiarity. "You always were better at framing the trap than escaping it."

  "And you were always better at springing it than seeing what was caught."

  He took a sip of the cold coffee. "So we're no closer than we were in grad school."

  "No," Elena said, turning back to the hydrangeas. "But we're older. And the silence is louder."
