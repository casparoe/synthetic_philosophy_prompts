answer: |-
  Imagine you are ordering dinner on a night you're starving. You have to choose between two restaurants twice, under different reliability conditions:

  **Scenario 1:**
  *   **Restaurant A:** 100% chance your food arrives **Hot**.
  *   **Restaurant B:** 89% chance **Hot**, 10% chance **Gourmet Upgrade**, 1% chance **Never Arrives**.
  *(Most people pick A to guarantee they eat.)*

  **Scenario 2:**
  *   **Restaurant C:** 11% chance **Hot**, 89% chance **Never Arrives**.
  *   **Restaurant D:** 10% chance **Gourmet Upgrade**, 90% chance **Never Arrives**.
  *(Most people pick D, because the difference between 11% and 10% feels negligible compared to the Gourmet upside.)*

  **Why this breaks the Independence Axiom:**
  Scenario 2 is mathematically identical to Scenario 1, except the shared 89% chance of "Hot" food was swapped for "Never Arrives" in both options. The axiom states that changing a *common* outcome shouldn't flip your preference, but humans overweight the **certainty** of eating in the first scenario, causing a logical reversal when that certainty is removed.
