      *   *Section 4: Propensity.* Popper. Tries to make it objective single-case. But defining the "experimental arrangement" faces similar issues.
      *   *Section 5: Conclusion/Synthesis.* Venn knew this was a weakness. He hoped practical aims would guide us. Modern frequentists (like von Mises) tried to fix it with "collectives." It remains a central tension. The colleague is half-right: it's a major structural weakness, but not necessarily a fatal one depending on what you want probability to *do*.

  8.  **Refining the Tone:**
