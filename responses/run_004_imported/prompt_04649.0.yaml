      *   *Did I address the Bayesian claim fairly?* Don't let the Bayesian off the hook. They have a "problem of the priors" which is analogous.
      *   *Historical accuracy:* Venn predates Reichenbach. Venn is an "actual frequentist" (finite), Reichenbach moved towards "limiting frequency." Keep this distinction in mind but don't get bogged down in it unless necessary. (Decided: Keep it simple, focus on the conceptual logic).

