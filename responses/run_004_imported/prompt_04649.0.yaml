      *   Probability is a physical disposition of the *generating conditions*.
      *   *Advantage:* Focuses on the physical setup rather than the classification.
      *   *Disadvantage:* Still need to specify the generating conditions. Is the "condition" that Smith is a man, or a consumptive man? If propensities are attached to the *whole situation*, it risks becoming trivial (single-case propensity). If attached to repeatable setups, we are back to defining the setup (which looks like a reference class).

