          *   *Higher-Order Vagueness:* If there's a sharp cutoff for "bald," is there a sharp cutoff for "definitely bald"?
          *   *Epistemicist Stance:* Yes. There is a sharp boundary between "definitely bald" and "borderline bald." We just don't know where it is.
          *   *Cost:* It seems incredibly counterintuitive to claim there's a precise fact of the matter about whether a "borderline case" is "definitely borderline." It implies a hierarchy of sharp boundaries we are all ignorant of.

      *   **Supervaluationism (e.g., Kit Fine, Rosanna Keefe):**
          *   *Core Claim:* Vagueness is semantic indecision. A statement is "supertrue" if it's true on all *admissible precisifications* (ways of making the language precise). Borderline cases are true on some, false on others.
          *   *Higher-Order Vagueness:* Is the set of *admissible precisifications* itself sharp?
          *   *Supervaluationist Stance:* This is the trouble spot. If the set of admissible precisifications is sharp, then there's a sharp boundary between "admissible" and "inadmissible," which looks like the Epistemicist's sharp boundary again. If the set is *not* sharp, then the logic becomes messy (truth value gaps multiply).
