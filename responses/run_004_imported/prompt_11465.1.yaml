prompt: |-
  I've spent a fair amount of time in the LessWrong/Overcoming Bias archives, and I keep running into the same rhetorical move in threads about the "value of information": someone cites I.J. Good's 1967 result (from "On the Principle of Total Evidence") that a Bayesian expected-utility maximizer facing a fixed decision problem can never be made worse off, in expectation, by costlessly observing a relevant signal before choosing an action — since she remains free to ignore it and act exactly as she would have otherwise — and then treats this as though it settles a much larger question: that a genuinely rational, truth-seeking agent should always want more evidence, should always be willing to hear out one more argument, and that any policy of declining to engage further (Scott Alexander's "epistemic learned helplessness" is usually the example people reach for) is at bottom just a polite name for motivated ignorance. A friend of mine, who thinks about formal epistemology for a living, insists this inference doesn't actually go through once you look closely at what Good's proof assumes, but he hasn't managed to pin down exactly where it fails to my satisfaction.

  I'd like you to make that argument in his place. Please argue against the generalization from Good's theorem — a claim about an idealized agent with a fixed utility function, a well-posed decision problem, and a costlessly and non-strategically supplied signal, who is guaranteed to update by Bayesian conditionalization and then act optimally on the result — to the informal norm that a boundedly rational human reasoner, especially one embedded in an adversarial or social argumentative context, should always prefer more evidence or argument-exposure to less. I'd like you to identify explicitly which of the theorem's assumptions (dynamic consistency of the post-signal self is one obvious candidate, but there may be others) a real reasoner is liable to violate, and then work through at least one concrete case — Alexander's essay is a natural starting point, but you're welcome to construct your own or draw on a different one — in which declining to look, read, or listen further leaves an agent genuinely better off by her own lights and in expectation. Please don't rest on the platitude that "real life is messier than the idealized model"; I want the essay to show exactly which premise gives out, and why its failure is enough to overturn the informal conclusion rather than merely complicate it.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Request:**
      *   **Topic:** The misuse/generalization of I.J. Good's "Value of Information" (VoI) theorem in rationalist communities (LessWrong/Overcoming Bias).
      *   **Core Claim to Refute:** The idea that Good's theorem implies a rational agent should *always* seek more evidence/arguments, and that refusing to do so (e.g., "epistemic learned helplessness") is irrational/motivated ignorance.
      *   **Task:** Argue against this generalization by identifying specific assumptions in Good's theorem that fail for real, boundedly rational humans in social/adversarial contexts.
      *   **Requirements:**
          *   Don't just say "real life is messy."
          *   Identify specific broken premises (e.g., dynamic consistency, costless signal, fixed utility, etc.).
          *   Work through at least one concrete case (Scott Alexander's "epistemic learned helplessness" is suggested).
          *   Show why the failure overturns the conclusion, not just complicates it.
          *   Tone: Analytical, rigorous, persuasive (speaking for the friend who does formal epistemology).

  2.  **Analyze I.J. Good's Theorem (The Target):**
      *   *What does it actually say?* For a Bayesian agent with a fixed utility function $U$, facing a decision $D$, observing a signal $S$ with $P(S|H)$ known, and updating via conditionalization, the expected utility of acting *after* seeing $S$ is $\ge$ the expected utility of acting *without* seeing $S$.
      *   *Key Assumptions:*
          1.  **Costless Information:** The signal $S$ has zero cost (time, cognitive, emotional, opportunity).
          2.  **Fixed Decision Problem:** The set of actions and utilities doesn't change while processing $S$.
          3.  **Perfect Bayesian Updating:** The agent updates exactly according to Bayes' rule. No bias, no fatigue, no misinterpretation.
          4.  **Dynamic Consistency:** The "future self" who receives the signal and chooses the action is the same agent with the same goals as the "current self" deciding whether to look.
          5.  **Non-Strategic Signal:** The signal isn't generated by an adversary trying to manipulate the posterior to the agent's detriment (Good assumes the likelihood function is known and fixed, not game-theoretic).
          6.  **Computational Tractability:** The agent can actually compute the posterior and the optimal action.

  3.  **Identify the Failure Points (The "Friend's" Argument):**
      *   *Bounded Rationality:* Humans aren't perfect Bayesians. Processing info costs cognitive resources (Assumption 1 & 6).
      *   *Adversarial Contexts:* In debates, the "signal" is often optimized to hack the brain, not convey truth (Assumption 5).
      *   *Preference/Identity Drift:* Exposure to certain arguments can change *what* you value or *who* you are, violating the fixed utility function (Assumption 2 & 4).
      *   *Akrasia/Time Inconsistency:* The self that decides to read might want to be wise, but the self *while* reading might get swept up (Assumption 4).

  4.  **Develop the Concrete Case (Scott Alexander's "Epistemic Learned Helplessness"):**
      *   *Context:* Alexander argues that for some people (especially those prone to anxiety or persuasion), engaging with high-quality arguments for dangerous/false ideas (e.g., eugenics, radical skepticism) leads to worse outcomes, not better.
      *   *Why Good's Theorem fails here:*
          *   **Cognitive Hazard:** The "signal" isn't just data; it's a cognitive virus. It alters the *processing mechanism* itself.
          *   **Utility Function Instability:** Reading the argument might change the utility function (e.g., making you care less about harm, or more about abstract consistency at the expense of well-being).
          *   **Processing Cost:** The emotional toll is a real cost, violating "costless."
          *   **The "Pandora's Box" Effect:** Once you know the argument, you can't "ignore it." Good's theorem says you can ignore the *action*, but the *belief* update is involuntary for a Bayesian. If the belief update is harmful (e.g., destroying motivation), the value is negative.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge Good's theorem's status. State the thesis: The leap from "costless signal in a vacuum" to "always listen to arguments in society" is a category error.
      *   **The Theorem's Guardrails:** Briefly list the strict assumptions of Good's result. Emphasize *costlessness*, *fixed utilities*, and *known likelihoods*.
      *   **Failure Mode 1: The Cost of Processing (Bounded Rationality).** It's not just time; it's cognitive load and emotional distress. If the cost > expected gain, VoI is negative.
      *   **Failure Mode 2: Adversarial Likelihoods (The Signal is a Weapon).** Good assumes $P(S|H)$ is fixed. In debate, $S$ is chosen by an opponent to maximize *their* utility, often by exploiting cognitive biases. This turns VoI into "Value of Manipulation."
      *   **Failure Mode 3: Dynamic Inconsistency & Utility Drift.** This is the big one. The "Epistemic Learned Helplessness" case. Reading an argument can change the agent's values. If $U$ changes to $U'$, and $U'$ ranks outcomes worse than $U$ did, the agent is worse off.
      *   **Concrete Case Study:** Scott Alexander's "Epistemic Learned Helplessness."
          *   Scenario: A vulnerable person considering eugenics arguments.
          *   Good's View: Listen, update, decide.
          *   Reality: The argument is "mind-killing." It exploits anxiety. It changes the utility function (makes you value "logic" over "humanity").
          *   Result: Refusing to listen preserves the original, preferred utility function.
      *   **Conclusion:** Summarize. Rationality isn't just about updating; it's about curating the input channel. "Ignorance" can be a rational shield.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "changing utility functions" cheating?
      *   *Fix:* Frame it as "meta-preferences." The agent *prefers* to have the utility function that cares about people, rather than the one that cares about cold efficiency. Preserving the self is a valid goal.
      *   *Critique:* Is "adversarial signal" just "costly information"?
      *   *Fix:* Distinguish them. Cost is resource drain. Adversarial signal is *negative* expected value because the likelihood ratio is manipulated to induce error, not just noise. It violates the "known likelihood" assumption.
      *   *Tone Check:* Ensure I'm not dismissing Good, but delimiting his scope. Good is right *within his model*. The error is applying the model to humans.

  7.  **Final Polish:** Check against the prompt's specific constraints.
      *   Did I identify specific assumptions? Yes (Cost, Fixed Utility, Known Likelihood, Dynamic Consistency).
      *   Did I use the Alexander example? Yes.
      *   Is it rigorous? Yes, focusing on the structural breakdown of the proof conditions.

  8.  *(Final thought before writing)*: Make sure to emphasize that Good's theorem relies on the agent being able to *ignore* the signal if it's unhelpful. But for humans, *belief* is often involuntary. You can't choose to un-hear a persuasive argument. This violates the "act exactly as she would have otherwise" clause because the internal state has changed irreversibly.

  9.  **Drafting the Content.** (Proceeds to generate response based on these points.)
answer: |-
  The appeal of I.J. Good's 1967 theorem is obvious. It offers a crisp, mathematical vindication of the open-minded ideal: *If you are rational, information cannot hurt you.* In the LessWrong and rationalist ecosystems, this result is often elevated from a technical lemma about decision theory into a moral imperative: the truly rational agent never refuses an argument, never declines a debate, and never cultivates ignorance. To do so is labeled "epistemic learned helplessness," "motivated stopping," or simply cowardice.

  Your friend is correct. This generalization is a category error. It takes a theorem derived under a specific set of constraints—constraints that describe a disembodied mathematical function, not a human brain embedded in a social ecology—and applies it to a context where almost every constraint is violated. When the assumptions of Good's theorem fail, the conclusion does not merely become "messier"; it can invert entirely. There are conditions under which a rational agent, seeking to maximize her own expected utility, *must* refuse information to preserve her ability to act effectively.

  To see why, we must look not at the conclusion of Good's proof, but at the load-bearing walls that hold it up. Good's result relies on at least four critical assumptions that real human reasoners systematically violate: **(1) Costless Processing**, **(2) Fixed Likelihood Functions**, **(3) Dynamic Consistency of Utility**, and **(4) Voluntary Belief Updating**.

  ### 1. The Assumption of Costless Processing
  Good's theorem assumes the signal $S$ is costless. In the formal model, "observing" is a zero-weight operation. For a human, "listening to an argument" is a metabolic, temporal, and emotional expenditure.

  This is often dismissed as a trivial practicality, but it is structurally significant. If the cost of processing the signal ($C_{proc}$) exceeds the expected gain in decision quality ($\Delta EU$), then the Value of Information is negative.
  $$ VoI = E[U|S] - E[U] - C_{proc} $$
  If $C_{proc} > E[U|S] - E[U]$, the rational move is ignorance.

  In high-stakes or high-complexity environments, $C_{proc}$ is massive. Engaging with a sophisticated bad-faith argument requires deploying cognitive defenses, fact-checking, and managing emotional regulation. If an agent is resource-constrained (which all humans are), spending those resources on low-yield information depletes the capacity to act on high-yield information. A policy of "always listen" leads to cognitive bankruptcy. But this is the *least* interesting failure mode. It merely complicates the theorem; it doesn't overturn the spirit of "truth-seeking." The deeper failures lie in the nature of the signal and the agent herself.

  ### 2. The Assumption of Fixed Likelihood Functions (The Adversarial Signal)
  Good's theorem assumes the agent knows the likelihood function $P(S|H)$. She knows how probable the signal is, given the state of the world. This implies the signal is generated by a process that is either random or benevolent, but crucially, *not strategic against her interests*.

  In social argumentation, this assumption is false. When you invite "one more argument," you are not drawing a sample from a fixed distribution of truth. You are inviting an adversary (or a memetic competitor) to select a signal $S$ specifically designed to maximize *their* utility, which often involves minimizing yours.

  In game-theoretic terms, this is not an observation problem; it is a signaling game with misaligned incentives. An adversary does not need to lie to hurt you; they only need to exploit the gap between your *perceived* likelihood function and the *actual* likelihood function. They craft arguments that trigger high-confidence updates in directions that serve them.

  If the source of information is adversarial, the "Value of Information" becomes the "Value of Exposure to Manipulation." A rational agent facing an adversary with superior knowledge of her own cognitive vulnerabilities should often restrict the channel. To listen is to hand the adversary the initiative. Good's theorem guarantees you can ignore the signal, but it does not guarantee you can ignore the *manipulation of your priors* that the signal induces.

  ### 3. The Assumption of Dynamic Consistency and Fixed Utility
  This is the most profound failure point, and it brings us directly to Scott Alexander's concept of "epistemic learned helplessness."

  Good's theorem assumes a fixed utility function $U$. The agent decides whether to observe $S$ based on $U$, updates her beliefs, and then chooses an action to maximize $U$. The "future self" who sees the signal is the same agent as the "current self" who decides to look.

  However, for human reasoners, exposure to certain arguments is not just a belief update; it is a *preference update*. Certain lines of reasoning are "mind-killing" not because they are false, but because they are corrosive to the utility function itself.

  Consider a person who values human flourishing and empathy ($U_{human}$). They are presented with a highly sophisticated, logically consistent argument for a nihilistic or eugenicist worldview ($S_{nihil}$). The argument is technically sound but relies on framing human suffering as statistically negligible.
  *   **Good's Model:** The agent hears $S_{nihil}$, updates beliefs, and acts to maximize $U_{human}$. If the argument doesn't change the optimal action, cost is zero. If it does, expected utility goes up.
  *   **Reality:** Exposure to $S_{nihil}$ may shift the agent's utility function from $U_{human}$ to $U_{nihil}$. The agent becomes the kind of person who no longer cares about flourishing.

  From the perspective of the *original* agent (the one deciding whether to listen), this is a catastrophe. She prefers to be a person who helps people ($U_{human}$) rather than a person who doesn't ($U_{nihil}$), even if the latter is "more logically consistent." If listening to the argument destroys the values that made her want to listen in the first place, the expected value of listening is negative.

  This violates **Dynamic Consistency**. The self that chooses to listen cannot trust the self that listens to retain the goals that motivated the listening. In such cases, rationality requires *pre-commitment*. Just as Ulysses tied himself to the mast to resist the Sirens, a rational agent may need to bind herself against hearing certain arguments to preserve the integrity of her utility function. This is not "motivated ignorance"; it is **identity preservation**.

  ### 4. The Assumption of Voluntary Belief Updating
  Finally, Good's theorem relies on the clause: *"since she remains free to ignore it and act exactly as she would have otherwise."*

  This assumes that belief updating is voluntary or, at least, that action selection is decoupled from belief. For a perfect Bayesian, you can have a posterior belief $P(H|S)$ but choose an action $A$ that ignores it if $A$ was already optimal.

  For humans, belief is often involuntary. You cannot choose to un-hear a persuasive argument. Once a "memetic hazard" enters the cognitive system, it alters the landscape of plausible options. If an argument successfully convinces you that *all* actions are futile (a common outcome of high-level skepticism), you cannot simply "ignore" that belief and act as if you weren't convinced. The belief itself paralyzes the action mechanism.

  If the signal $S$ has the property that $P(\text{Action} | S) \neq P(\text{Action} | \text{No } S)$ even when the optimal action remains the same, then the signal has a cost that Good's model does not account for: **the cost of cognitive inertia.** If hearing an argument makes it psychologically harder to do the right thing, even if you "know" it's the right thing, the information has negative value.

  ### Concrete Case: The Case of the Anxious Rationalist
  Let us apply this to Alexander's specific example of epistemic learned helplessness, formalized through the lens of Good's assumptions.

  **The Agent:** A bright but anxiety-prone individual ($A$) working on effective altruism projects. Her utility function $U$ prioritizes reducing existential risk. She is prone to rumination and "analysis paralysis."

  **The Signal:** A series of high-quality, technically dense forum posts arguing that *all* current EA interventions are likely net-negative due to complex second-order effects that are impossible to model. Let's call this signal $S_{doubt}$.

  **The Good's Theorem Analysis:**
  1.  $A$ observes $S_{doubt}$.
  2.  $A$ updates $P(\text{Intervention Works} | S_{doubt})$.
  3.  $A$ chooses the action that maximizes $U$ given the new probability.
  4.  If the intervention still looks best, she proceeds. If not, she stops. Expected utility $\ge$ prior.

  **The Real-World Breakdown:**
  1.  **Violation of Fixed Likelihood:** $S_{doubt}$ is not a random sample of truth. It is selected by a community that rewards skepticism. It is optimized to sound profound, exploiting $A$'s insecurity about being "rational enough."
  2.  **Violation of Fixed Utility:** Engaging with $S_{doubt}$ triggers $A$'s anxiety. Her utility function effectively shifts from "Maximize Good" to "Minimize Anxiety about Doing Harm." The argument hijacks her motivation system. She is no longer optimizing for the world; she is optimizing for her own peace of mind.
  3.  **Violation of "Free to Ignore":** $A$ cannot simply update and move on. The doubt introduced by $S_{doubt}$ creates a cognitive tax. Every time she acts, she must fight the intrusive thought generated by the argument. This reduces her efficacy.
  4.  **The Result:** Before hearing $S_{doubt}$, $A$ was working effectively. After hearing $S_{doubt}$, $A$ is paralyzed. She does less good. Her expected utility drops.

  **The Rational Move:**
  The rational move for $A$, *ex ante*, is to adopt a policy of **Epistemic Learned Helplessness**. She pre-commits to ignoring arguments of the type $S_{doubt}$ from sources she does not trust with her mental stability.

  Is this "irrational"? By the lights of Good's theorem, yes. By the lights of *A's* actual survival and efficacy in the world, no. She is protecting her cognitive machinery from a signal that her machinery is not equipped to process without damage. She is treating her mind not as an ideal Bayesian updater, but as a fragile engine that requires specific fuel.

  ### Conclusion
  The error in the LessWrong/Overcoming Bias generalization is the conflation of **epistemic rationality** (accurate mapping of territory) with **instrumental rationality** (achieving goals). Good's theorem is about instrumental rationality *conditional on* perfect epistemic mechanics.

  When the mechanics are broken—when the agent is boundedly rational, when the signal is adversarial, when the utility function is unstable, and when belief is involuntary—the theorem collapses. In these contexts, a policy of "declining to engage" is not a failure of courage or a surrender to bias. It is a sophisticated meta-rational strategy. It is the recognition that for a finite agent embedded in a hostile information environment, **curating the input is often more important than optimizing the processing.**

  To argue that one should always listen is to assume the mind is a fortress that cannot be breached, only informed. But if the mind is a garden, then the rational agent knows that some seeds are weeds, and the most rational thing one can do is refuse to let them in. Good's theorem tells us the value of water; it does not tell us the value of poison. Distinguishing the two is the work of wisdom, not just calculation.
