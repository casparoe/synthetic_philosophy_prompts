  I've been chewing on something for my formal epistemology reading group and can't fully untangle it, figured I'd throw it at you since it's somewhat related to what I want to do my dissertation on (decision-making under severe/unstructured uncertainty). We're working through the imprecise credence literature -- credal sets, "mushy" credence, all that -- and I keep getting stuck on Elga's argument in "Subjective Probabilities Should Be Sharp." The rough shape of it, if I'm remembering right: you've got some proposition you're maximally unopinionated about, so your credence is basically the whole interval [0,1], and he offers you two bets back to back -- one that pays off if the proposition's true, one that pays off if it's false -- rigged so that taking both together nets you a guaranteed gain no matter how things turn out. But a seemingly reasonable permissibility rule for imprecise credence (something like: an option's fine to choose as long as no other option beats it relative to every probability function in your set) apparently says its fine to decline each bet taken on its own. So the imprecise agent "rationally" walks away from free money, which Elga takes as basically enough to sink imprecise credence and push us back to sharp probabilities.

  What I can't get a good grip on is the actual mechanics of why the rule licenses declining each bet individually -- like what's doing the work such that isolated evaluation goes wrong but joint evaluation doesn't -- and whether that's really a mark against having imprecise credences at all, versus just a mark against evaluating choices one at a time instead of as a package deal. I know some people respond by saying imprecise agents should evaluate whole sequences of decisions instead of piecemeal, which supposedly gets them off the hook. Could you walk me through the argument properly (feel free to use your own numbers/example if you don't remember Elga's exact setup, that part isn't crucial), and then tell me honestly whether that "evaluate the whole plan" move actually rescues imprecise credence, or whether it's more of a patch that quietly gives up the game?
