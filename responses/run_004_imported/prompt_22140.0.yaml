prompt: |-
  I'm compiling a cycle of short stories that each dramatize a genuine scientific or philosophical puzzle rather than a familiar trope, and I need a draft for the entry on cosmic silence. Rather than the usual "great filter" or "they're hiding from something dangerous" explanations for the Fermi paradox, build the story around the aestivation hypothesis put forward by Sandberg, Armstrong, and Ćirković: the idea that a sufficiently advanced civilization, recognizing that the thermodynamic cost of computation falls as the background temperature of the universe falls (per Landauer's principle), might rationally choose near-total dormancy now, husbanding its usable energy so as to perform vastly more computation — more thought, more experience — once the cosmic microwave background has cooled far closer to absolute zero, many trillions of years hence, than it could ever manage by acting today. Write a short story of around 800 words in which some character — human, machine, or alien — confronts this logic directly, so that the story's emotional weight depends on the reader actually grasping why the civilization is waiting, rather than simply being told that it is. Avoid resolving the piece with a cheap twist; let it end on the strain between the reasoning and what the waiting costs whoever, or whatever, must keep the vigil.
