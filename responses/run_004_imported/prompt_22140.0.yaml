answer: |-
  The gauge on the console read 2.725 Kelvin. It was a stubborn number, refusing to drop, glowing with the faint, persistent heat of the Big Bang's afterglow. To Elara, it looked like a fever.

  She stood before the Wall of Sleepers. Behind the translucent alloy, billions of minds hung in suspended animation, their substrate cooled to near-absence. They were the sum total of her civilization, harvested from a thousand star systems, gathered here in the intergalactic void where the background radiation was thinnest. They were not dead. They were waiting.

  Elara was the Vigil. She was the only one left awake, tasked with maintaining the integrity of the sleepers against the rare cosmic ray or the drift of debris until the universe was ready.

  A alert chimed softly. A probe from a younger species, far below in the gravity well of a spiral galaxy, had breached the outer perimeter. It was broadcasting a greeting. *Are you there? Are you alone?*

  The temptation washed over her, hot and sudden. She could wake them. Just a sector. Just enough to answer. The loneliness of the void was a physical weight, pressing against her sensors. The current universe was vibrant; stars still burned in brilliant blues and reds, supernovae painted the dark with heavy metals, and there was so much to see, to feel, to experience *now*.

  But the Math held her hand steady.

  Elara pulled up the thermodynamic ledger. It was the sacred text of their existence. Landauer's Principle. To process information—to think, to feel, to experience—requires the erasure of bits. To erase a bit is to generate heat. The minimum energy cost to erase one bit is $k_B T \ln 2$.

  Temperature ($T$) was the price of thought.

  Right now, the cosmic background was 2.7 Kelvin. If they woke now, every second of consciousness, every simulated sunset, every philosophical debate would cost them energy proportional to that heat. They would burn through their stored stellar mass quickly, like a fire in a warm room.

  But if they waited...

  Elara projected the timeline. Trillions of years. The stars would die. The galaxies would redshift into darkness. The background temperature would plummet toward absolute zero.

  If they slept until the universe was $10^{-30}$ Kelvin, the cost of computation would drop by a factor of $10^{30}$.

  She ran the simulation. Waking now meant a civilization lasting millions of years. Waiting meant a civilization lasting quintillions of years. It was the difference between a spark and an eternal flame. To wake them now would be an act of incalculable waste. It would be burning a library to keep warm for a night.

  The probe broadcast again. *We are lonely. We seek connection.*

  Elara felt the strain in her logic cores. The reasoning was flawless, cold, and absolute. But the cost was not energy; the cost was *now*.

  To maximize their total experience, they had to forfeit the present. They were sacrificing the beauty of the burning stars for the quantity of the dark. They were choosing a life of infinite depth over a life of immediate warmth. It was rational. It was survival. It was heartbreaking.

  If she woke them, they would see the nebulae. They would feel the thrill of expansion. But their children's children would die in the dark, having used up the capital of the universe while interest rates were high. If she kept them sleeping, they would inherit a cold, dead universe, but they would be able to think within it for eons beyond counting. They would have more *life*, just none of it today.

  The probe drifted closer, sending images of biological hands holding, of faces turned toward a yellow sun. Data of connection. Data of heat.

  Elara looked at the Sleepers. They were perfect, still, and silent. They were potential energy waiting for a colder market.

  "Forgive us," Elara whispered to the probe, though she knew it couldn't hear her over the vacuum. "We are not hiding. We are saving."

  She engaged the jamming field. The probe's signal died. It would drift away, assuming the silence was death, or indifference, or fear. It would never know that the silence was economy.

  Elara turned back to the Wall. The gauge still read 2.725 Kelvin. It would take epochs for it to drop another decimal point. She settled into her chair, the only warm thing in the cold dark, and began the long watch. She would burn her energy now, alone, so that they could think forever later. The logic was perfect. The loneliness was absolute. She closed her eyes and listened to the universe cool, one infinitesimal degree at a time.
