answer: |-
  **Rome, Spring 1615**
  **The Study of Cardinal Robert Bellarmine**

  *The room is warm, smelling of old paper and beeswax. Outside, the sounds of the city are muffled. GALILEO GALILEI sits opposite CARDINAL ROBERT BELLARMINE. A copy of Paolo Foscarini's recent treatise on the Pythagorean opinion lies on the desk between them. Bellarmine pours wine.*

  **BELLARMINE:** Signor Galileo. I have read your letters, and I have studied Signor Foscarini's pamphlet with care. You must know I hold your telescopic discoveries in high regard. The moons of Jupiter are a marvel. They are written in the stars for any man with a tube to see.

  **GALILEO:** Your Eminence honors me. I only seek to read the book of Nature, which is written in the language of mathematics. It is a book authored by the same Hand that wrote the Scripture. They cannot contradict.

  **BELLARMINE:** Agreed. They cannot contradict, because Truth is one. But the *reading* of those books differs. My concern—and the concern of the theologians here—is not with your mathematics. If you speak of the Copernican arrangement merely as a supposition, a device to "save the appearances" of planetary motion... no one objects. Copernicus himself dedicated his work to the Pope as a hypothesis.

  **GALILEO:** But it is not a hypothesis, Eminence. That is the heart of it. To treat it as mere calculation is to ignore the physical reality. The phases of Venus... they prove Venus orbits the Sun.

  **BELLARMINE:** Do they? Or do they prove only that Venus is sometimes between us and the Sun, and sometimes beyond it? Tycho Brahe's system accounts for the phases of Venus just as neatly as Copernicus. In Tycho's scheme, the Sun orbits the Earth, but the planets orbit the Sun. The geometry is identical regarding Venus. The appearances are saved either way.

  **GALILEO:** (Leaning forward) But the simplicity, Eminence! In the Copernican system, the retrograde motion of Mars is a natural consequence of the Earth's own motion. In Tycho's, it requires complex epicycles upon deferents. Nature does not multiply entities without necessity. Why would God construct a machine so convoluted when a simpler one suffices?

  **BELLARMINE:** Because we are not God. We cannot know necessity in the divine architecture. We see through a glass darkly. You argue from probability, Signor Galileo. You argue from elegance. But in natural philosophy, probability is not *demonstration*.

  **GALILEO:** Is the testimony of the senses not demonstration? When I see the spots on the Sun change, I know the Sun rotates. When I calculate the distances...

  **BELLARMINE:** (Gently interrupting) You speak of the Sun's spots. But tell me: Have you demonstrated stellar parallax?

  **GALILEO:** (Hesitates) The stars are distant. The instruments are not yet fine enough to detect the shift.

  **BELLARMINE:** Precisely. If the Earth orbits the Sun, the stars should shift position relative to one another over the year. They do not. You argue they are simply too far away to see the shift. That is an assumption, not a observation. It is a rescue device to save the theory. Until you can show me the Earth moves—physically, demonstrably, not just mathematically—I cannot treat it as physical truth.

  **GALILEO:** So I am to be a mathematician only? I calculate where the planet will be, but I cannot say where it *is*?

  **BELLARMINE:** For now, yes. And this distinction is not merely philosophical pedantry. It is theological necessity.

  **GALILEO:** There it is. The Scripture.

  **BELLARMINE:** It cannot be avoided. If you claim Copernicanism is physically true, you claim the Earth moves and the Sun is stationary. But Scripture says otherwise. Psalm 93: "The world is established, it shall never be moved." Ecclesiastes: "The sun rises and the sun goes down." And most critically, Joshua 10.

  **GALILEO:** Joshua. When the Sun stood still.

  **BELLARMINE:** Joshua commands the *Sun* to stand still, not the Earth. If the Earth were moving, and the Sun stationary, stopping the Sun would not lengthen the day. To lengthen the day in a Copernican world, Joshua would have had to command the *Earth* to stop spinning. The text is explicit.

  **GALILEO:** Eminence, with respect, the Holy Spirit intended to teach us how to go to heaven, not how the heavens go. The Scripture speaks in the language of the common man. When we say "the sun rises," we speak truly, even if we know the Earth turns. This is the principle of Accommodation. Augustine himself taught that we must not interpret Scripture in a way that contradicts known truth, lest we make a mockery of the faith before the pagans.

  **BELLARMINE:** I am well acquainted with Augustine. I taught his works for years. And I agree with the principle. *If* the heliocentric theory were a demonstrated truth, then we would have to say that the Scripture speaks phenomenologically, accommodating the limitations of the ancient writers. We would reinterpret Joshua. We would not abandon the truth of Nature to save a literal reading.

  **GALILEO:** Then we are agreed!

  **BELLARMINE:** We are not. You miss the condition. Augustine applies when the truth is *known*. If a geometer proves to me that the Earth moves, I will say, "The Scripture speaks in accommodation." But you have not proved it. You have offered a hypothesis that works well mathematically.

  **GALILEO:** Is the coherence of the system not proof? The tides, Eminence! The motion of the oceans is caused by the Earth's rotation and orbit.

  **BELLARMINE:** I have heard your theory on the tides. It is ingenious. But is it demonstration? Other men have other theories. Until there is a consensus among natural philosophers—a true *scientia*—we cannot overturn the literal sense of Scripture. To do so without proof is dangerous. If you reinterpret Joshua based on a theory that might later be falsified, and then the theory *is* falsified, you have made Scripture look foolish.

  **GALILEO:** So we must wait? While the evidence mounts?

  **BELLARMINE:** You may continue to study. You may write of it as a hypothesis. "Supposing the Earth moves, the calculations become simpler." That is valuable work. But to assert it as fact, and to demand the theologians rearrange the Faith to fit it... that requires a burden of proof you have not yet met.

  **GALILEO:** (Sighs, looking out the window) You ask for a demonstration that may be beyond our current reach. The parallax is there, hidden by distance. The physics of motion... we are still uncovering it. But if I wait for a proof that satisfies the Aristotelians, I may wait until I am dead. Nature does not care for our categories of "hypothesis" versus "truth."

  **BELLARMINE:** Nor does God care for our haste. Signor Galileo, I am not your enemy. I do not fear the truth. I fear error. I fear that by insisting on physical truth without physical proof, you invite a scandal that will harm the very cause you love. If you claim Scripture is wrong about the Sun, what will they say when you claim it is wrong about salvation?

  **GALILEO:** I claim Scripture is never wrong. Only our interpreters are.

  **BELLARMINE:** And who is the interpreter? You? A mathematician? Or the Church, charged with the deposit of faith? When the matter is one of salvation, the Church decides. When the matter is the motion of the stars... it becomes a matter of faith only if the Scripture speaks on it. And it does.

  **GALILEO:** Then the Church binds the hands of Nature?

  **BELLARMINE:** No. The Church binds the hands of *assertion* until the proof is clear. Look at me, Galileo. If you can show me a demonstration—clear, undeniable, excluding Tycho, excluding parallax objections—then I will be the first to argue for the reinterpretation of Joshua. I will cite Augustine myself. But until then... prudence.

  **GALILEO:** (Quietly) Prudence is the virtue of the cautious. But discovery is the child of risk.

  **BELLARMINE:** And heresy is the child of pride. Let us not confuse the two.

  *Galileo stands. He looks at the Foscarini pamphlet on the desk.*

  **GALILEO:** I will write as I must, Eminence. I cannot pretend not to see what I see.

  **BELLARMINE:** (Standing as well) And I will judge as I must. Not to suppress your genius, but to protect the integrity of the Word. We both serve the same God, Signor Galileo. We simply read different books He has written. Let us pray our readings do not diverge too far.

  *They bow to one another. It is a respectful bow, but the distance between them remains unbridged.*

  **[END SCENE]**
