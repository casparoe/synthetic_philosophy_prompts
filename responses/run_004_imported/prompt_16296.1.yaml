answer: |-
  This is a profound question that cuts to the ontological heart of quantum foundations. As a fellow traveler in physics, I appreciate that you are looking past the "shut up and calculate" orthodoxy without falling for the caricatures often found in popular expositions. The ESSW (Englert, Scully, Süssmann, Walther) 1992 paper, "Surrealistic Bohm Trajectories," remains one of the most sophisticated challenges to de Broglie-Bohm (dBB) theory.

  To answer you properly, we must distinguish between the *mathematical formalism* of Bohmian mechanics (which is empirically equivalent to standard QM) and its *ontology* (what it claims exists). The "embarrassment" you perceive arises when one implicitly imports classical expectations about how an ontology ought to behave into a theory that is explicitly non-classical.

  Here is the deep structure of the Bohmian rejoinder, the specific work done by nonlocality and contextuality, and an assessment of the ontological cost.

  ### 1. The ESSW Charge: What is "Surreal"?

  In the ESSW setup (often involving a micromaser cavity or a spin-based which-path marker), the wavefunction splits into two packets, $\psi_L$ and $\psi_R$. A detector is arranged to interact with the particle such that, standard QM suggests, the detector state becomes entangled: $|\Psi\rangle = \psi_L |D_L\rangle + \psi_R |D_R\rangle$.

  ESSW identified specific Hamiltonian configurations where the Bohmian particle trajectory (guided by the phase of $\Psi$) passes through, say, the Left slit, but the detector ends up in the state $|D_R\rangle$ (indicating Right).

  The charge is intuitive: If the particle is a real corpuscle, and the detector is a real device, the corpuscle should trigger the detector it actually hits. If the theory predicts the particle goes Left but the detector says Right, either the particle isn't real, the detector isn't working, or the theory is wrong. ESSW argued this renders the trajectories "surreal"—mathematical artifacts without physical correspondence.

  ### 2. The Bohmian Rejoinder: The Ontology of Measurement

  The Bohmian defense, articulated most rigorously by Dürr, Goldstein, and Zanghì (DGZ), rests on a strict distinction between the **wavefunction** ($\Psi$) and the **configuration** ($Q$).

  In standard QM, a "measurement record" is often treated as a projection of the state vector. In Bohmian mechanics, a measurement record is **strictly the position of the apparatus particles**.

  #### The "Empty Wave" Argument
  In the ESSW scenario, the particle travels in the support of $\psi_L$. The branch $\psi_R$ is an "empty wave"—it contains no particle, but it still exists in configuration space and evolves according to Schrödinger's equation.

  ESSW assume that if the detector state $|D_R\rangle$ is populated in the wavefunction, a "record" exists. The Bohmian rejoinder is: **No.** A record only exists if the *actual configuration* of the detector particles ($Q_{det}$) lies within the support of the wavefunction component corresponding to $|D_R\rangle$.

  In the specific ESSW setups, the interaction is arranged such that the *empty wave* $\psi_R$ interacts with the detector and drives the detector's wavefunction into the $|D_R\rangle$ state. However, because the interaction is nonlocal (more on this below), the *actual configuration* of the detector particles ($Q_{det}$) remains guided by the total wavefunction in such a way that it does **not** indicate "Right" in the final readout, even if the wavefunction component suggests it.

  Wait—this sounds like wavefunction magic. Let's be precise.

  DGZ argue that for a device to be a genuine "which-path" detector, it must satisfy a condition of **reliability**: the final configuration of the pointer must correlate with the path taken by the particle.
  $$ \text{If } Q_{particle} \in \text{supp}(\psi_L) \implies Q_{pointer} \in \text{supp}(\text{"Left"}) $$
  ESSW construct scenarios where the wavefunction components suggest a mismatch. However, DGZ demonstrate that if you analyze the *full* Bohmian dynamics of the detector particles (not just their wavefunction), the trajectories of the detector's constituent particles ensure that the final macroscopic configuration is consistent with the particle's actual path.

  The "contradiction" arises only if you treat the detector's wavefunction as the reality. If you treat the detector's *particle configuration* as the reality (as BM demands), the consistency is restored. The detector does not "click" for the Right slit if the particle goes Left, even if the wavefunction branch associated with the Right slit is excited. The "click" is a configuration event, not a wavefunction event.

  ### 3. The Work of Nonlocality and Contextuality

  This resolution relies heavily on the two features you asked about.

  #### Nonlocality
  In BM, the velocity of any particle $k$ is given by the guidance equation:
  $$ \mathbf{v}_k = \frac{\hbar}{m_k} \text{Im} \frac{\nabla_k \Psi(Q_1, \dots, Q_N)}{\Psi(Q_1, \dots, Q_N)} $$
  Note that $\mathbf{v}_k$ depends on the positions of *all* other particles $Q_N$ instantaneously (in the preferred frame).

  In the ESSW setup, the "which-path" marker and the system particle are entangled. The velocity of the marker's pointer particles depends nonlocally on the position of the system particle. Even if the empty wave $\psi_R$ passes over the Right detector, the *actual* position of the system particle (at Left) exerts a nonlocal influence on the detector particles at Right, preventing them from moving into the "fired" configuration.

  The "surrealism" is essentially a failure of **local realism**. ESSW implicitly assume that the detector at Right should respond locally to the wave amplitude at Right. BM says the detector responds to the *global* configuration. The particle at Left "holds back" the detector at Right via the quantum potential/guidance equation.

  #### Contextuality
  In BM, observables (other than position) are contextual. There is no pre-existing value for "which path." The path is defined by the trajectory, which is determined by the initial configuration and the experimental context (the Hamiltonian).

  The ESSW argument assumes that "which-path information" is a property stored in the detector independent of how it is eventually read out. BM argues that the "path" is only meaningful relative to the entire experimental arrangement, including the final detection. If the arrangement allows the empty wave to interfere with the occupied wave later (which is often the case in these "surreal" setups), then the "which-path" distinction was never robustly established in the configuration space. The context did not allow for a definitive separation of support in $Q$-space.

  ### 4. Why Copenhagen and Everett Escape This

  **Copenhagen:**
  The Copenhagen interpretation (in its standard textbook form) posits no trajectories. The question "Which path did the particle take?" is meaningless unless a measurement collapses the wavefunction. If a which-path detector is present, the wavefunction collapses, interference is destroyed, and the particle is found at one slit. There is no underlying reality ($Q$) that can contradict the measurement record ($\Psi$ collapse) because there is no underlying reality besides the measurement outcomes. The contradiction requires two competing claims about reality (trajectory vs. record); Copenhagen denies the trajectory claim.

  **Everett (Many-Worlds):**
  Everettian QM retains the universal wavefunction but discards the single configuration $Q$. In the ESSW scenario, the universe branches. In one branch, the particle goes Left and the detector records Left. In the other, Right/Right.
  However, ESSW-style setups involve interference between branches. In MWI, if interference occurs, the branches have not fully decohered. There is no single "world" yet where a contradiction could be noted by an observer. An observer only perceives a contradiction if they exist in a branch where the records are inconsistent. MWI proponents argue that in a properly analyzed setup, the observer's state becomes entangled such that they only perceive consistent histories within their branch. The "surreal" trajectory is simply a feature of the wavefunction flow in configuration space, but since there is no single particle trajectory claiming exclusivity, there is no ontological conflict.

  ### 5. Assessment: Vindication or Concession?

  You asked for an honest assessment. Here is the tension:

  **The Case for Vindication:**
  The Bohmian rejoinder is mathematically consistent. DGZ have shown that if you follow the rules of BM strictly—treating the apparatus as a collection of Bohmian particles, not a black-box projector—empirical contradictions vanish. The theory saves the phenomena. The Steinberg experiment (2011), which used weak measurements to reconstruct average photon flow lines, found they matched the Bohmian trajectories. This suggests the velocity field $\mathbf{v} = \mathbf{j}/\rho$ is operationally accessible, lending weight to the idea that the trajectories are not merely mathematical fictions.

  **The Case for Concession:**
  However, the "cost" of this vindication is high. To save the trajectories, BM must accept that:
  1.  **Empty Waves are Real:** The branch of the wavefunction without the particle can exert causal influence (via nonlocality) on detectors, yet carries no energy or mass.
  2.  **Trajectories are Non-Classical:** A "real" trajectory that can be nonlocally suppressed from triggering a detector it "missed" behaves nothing like a classical corpuscle. It behaves like a non-local field singularity.
  3.  **Privileged Frame:** To make sense of the nonlocality required to resolve ESSW without paradox, BM generally requires a preferred foliation of spacetime, which is empirically hidden but ontologically present.

  **My Verdict:**
  The ESSW argument does not refute Bohmian mechanics empirically; the theory is constructed to be empirically equivalent to standard QM. However, it does refute a *naive realist* visualization of Bohmian mechanics.

  If your intuition of "real trajectory" is a local, continuous line that interacts only with matter it touches, then ESSW proves BM trajectories are not real in that sense. But if your definition of "real trajectory" is "the integral curve of the probability current density in a non-local theory," then the trajectories are vindicated.

  The Bohmian rejoinder essentially says: *"You are accusing us of a contradiction because you expect the particle to behave classically. We told you it was quantum."*

  Is this a concession? It concedes that the "Bohmian Particle" is a very strange object—more like a marker on a map than a car on a road. It is a "beable" (in Bell's terms), but one whose behavior is enslaved to a non-local wave.

  For a retired experimentalist, the takeaway is this: The Steinberg results confirm the *kinematics* (the flow lines are real in a weak-measurement sense). The ESSW paper highlights the *dynamics* (the interaction of those lines with detectors is radically non-local). The Bohmian defense holds, but it forces you to accept that "reality" in BM is the Configuration $Q$ guided by $\Psi$, and that $Q$ does not obey local causality. If you can accept that, the trajectories are "real." If you require local causality for reality, they are indeed surreal.

  In my view, the ESSW paper is not a refutation, but a necessary correction to the *pedagogy* of Bohmian mechanics. It prevents us from thinking of Bohmian particles as classical billiard balls. It forces the ontology to mature. Whether that mature ontology is preferable to Copenhagen's silence or Everett's extravagance is, ultimately, a metaphysical choice, not an empirical one.
