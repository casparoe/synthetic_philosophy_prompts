answer: |-
  This is a profound question that cuts to the heart of moral philosophy: does the binding force of a promise reside in the social fabric that surrounds it, or in the normative structure of the specific relationship between the promisor and the promisee? You have correctly identified the tension between Hume's sociological conventionalism and Scanlon's contractualist individualism.

  To answer you properly, we must look closely at the machinery of each theory. We cannot simply say "Hume says society, Scanlon says trust." We need to see *how* they generate obligation, and then test whether that mechanism survives the death of the promisee and the secrecy of the act.

  ### 1. Hume: The Artificial Virtue and the Social Engine

  To understand why Hume struggles with your case, we must first understand why he rejects the "natural" view of promising.

  **The Mechanism of Obligation**
  In *A Treatise of Human Nature* (Book 3, Part 2, Section 5), Hume argues against the idea that a promise is a "resolution" or an "act of the will." He points out that if I merely resolve to do something, I am not obligated until I act; if I merely will an obligation, it is magical thinking ("to will a new obligation... is as impossible as to will a new physical law").

  For Hume, the obligation of a promise is an **artificial virtue**. It is a human invention, akin to money or language.
  1.  **The Problem:** Humans have limited generosity and resources are scarce. We need to cooperate across time (I help you now, you help me later). But without a guarantee, I won't help you now.
  2.  **The Convention:** We invent a form of words ("I promise") that acts as a signal. By using these words, I place my reputation and my standing in the community at stake.
  3.  **The Sanction:** The obligation does not come from the words themselves, but from the **social pressure** attached to them. If I break the convention, I lose my credibility. Others will resent me, exclude me, or refuse to cooperate with me in the future.
  4.  **The Sentiment:** Over time, we cultivate a moral sentiment (approval/disapproval) regarding fidelity. We feel pain when a promise is broken because we sympathize with the public inconvenience it causes.

  **The Verdict on Your Case**
  Strictly on Humean terms, your promise **lacks binding force.** Here is the precise breakdown of why the machinery fails:

  *   **The Secrecy Problem:** Hume's convention relies on public visibility. The "sanction" that makes the promise binding is the fear of losing credit in the eyes of others. You say no living soul knows. If no one knows you made the promise, no one knows if you break it. If no one knows, your reputation is untouched. For Hume, the "obligation" is essentially the pressure of public opinion internalized. Without the public, the pressure evaporates.
  *   **The Utility Problem:** Hume justifies the convention based on **public utility**. The practice of promising is useful because it facilitates social coordination. Keeping a secret promise to a dead person generates zero social utility. It coordinates nothing. It aids no one. It prevents no social friction.
  *   **The "Monkish Virtue" Objection:** Hume is famously hostile to duties that are self-regarding or disconnected from social life (he calls them "monkish virtues"). If you keep this promise, Hume would likely view it as a form of superstition—a magical belief that the words themselves have power, which he explicitly argues against.

  **Is there a Humean "Move"?**
  There is one potential Humean defense, but it is weak. Hume argues that we internalize the general rule of fidelity so deeply that we feel unease even when breaking a promise in secret. However, he attributes this to the *habit* of living in society. If you break this promise, you might weaken your own habit of fidelity, which could leak into your public life.
  *   *Why this fails:* Hume is a psychological empiricist. If you are certain you can compartmentalize (i.e., "I will break this one secret promise but remain honest in public"), the utility argument collapses. Hume cannot ground a duty that is *in principle* undetectable and *in consequence* useless to the social scheme.

  **Conclusion on Hume:** On his own terms, Hume cannot explain why you are bound. He would likely suggest your feeling of obligation is a psychological ghost—a residual sentiment from when your aunt was alive, now detached from the social reality that gave it meaning.

  ---

  ### 2. Scanlon: Principle F and the Normativity of Assurance

  T.M. Scanlon's account in *What We Owe to Each Other* is designed specifically to avoid Hume's pitfalls. He wants to ground the obligation in the morality of the interaction itself, not in social utility.

  **The Mechanism of Obligation**
  Scanlon grounds morality in **contractualism**: an act is wrong if it violates principles that no one could reasonably reject. Regarding promises, he offers **Principle F** (Fidelity).

  Principle F states roughly that if:
  1.  I intentionally lead you to expect that I will do X (unless you release me);
  2.  I know you want this assurance;
  3.  I act for the purpose of providing this assurance (and to induce you to rely on it);
  4.  You do rely on it;
  Then I must do X.

  **The Key Difference:** For Scanlon, the obligation is not created by a social convention (Hume) or a magical act of will. It is created by the **manipulation of expectations**. When I ask you to trust me, I invoke a normative principle that protects you from being used. If I break the promise, I have treated your reliance as a mere tool for my own purposes at the time of promising. I have abused the authority I claimed to have over your expectations.

  **The Verdict on Your Case**
  Scanlon has the resources to explain why your promise remains binding, but it requires a specific move regarding the **status of the dead**.

  *   **The "Disappointment" Objection:** You worry that Scanlon requires the promisee to be *currently* disappointed. This is a misunderstanding of Principle F. The wrong is not the *feeling* of disappointment in the promisee's mind at the moment of breaking. The wrong is the **violation of the principle of assurance**.
  *   **The Temporal Move:** Scanlon argues that the obligation is grounded in the *past transaction*. At the moment you made the promise, you invoked a principle that bound your future self. The death of your aunt does not retroactively erase the fact that you induced her expectation.
  *   **Duties Regarding the Dead:** Scanlon explicitly addresses duties to the dead (e.g., executing wills). He argues that while the dead cannot be *harmed* (they have no current experiences), we still have duties *regarding* them based on the interests they had while alive. Your aunt had an interest in being reassured. She had an interest in her wishes being respected.
  *   **The "Reasonable Rejection" Test:** Could your aunt (while alive) have reasonably rejected a principle that said, "Assurances given to people are void if those people die before the promise is fulfilled"? Yes. That would make deathbed promises impossible, undermining the very comfort such promises are meant to provide. Could *you* reasonably reject a principle that binds you to the dead? Perhaps, but the weight of her past reliance outweighs your current convenience.

  **Is there a Scanlonian "Move"?**
  Yes. The move is to shift the focus from **current harm** to **past trust**.
  For Scanlon, the binding force comes from the fact that you *claimed* a right to her trust. You said, in effect, "You can count on me." That claim created a normative relationship. Even though she is gone, the *truth value* of that claim remains. If you break the promise, you render your past assertion a lie. You are not hurting her *now*; you are violating the integrity of the relationship that *existed*.

  Scanlon would argue that the obligation survives because the **principle** survives. The principle "One must fulfill assurances given to those who relied on them" does not contain a clause for "...unless they die." To add that clause would be to weaken the institution of assurance in a way that living people could reasonably reject (since we all know we will die).

  **Conclusion on Scanlon:** Scanlon can explain your obligation. The binding force is not dependent on her current ability to feel disappointment, but on your past act of claiming her trust. To break it is to disrespect the normative standing she held when she was alive.

  ---

  ### 3. Synthesis: Why One Fails and One Holds

  You asked for a precise understanding of why one fails and one succeeds, rather than a dismissal of the difficulty.

  **Why Hume Fails (Structural Incompatibility)**
  Hume's theory is **externalist** and **consequentialist** regarding social practices.
  *   *Externalist:* The obligation comes from outside the agent (social pressure, reputation).
  *   *Consequentialist:* The justification is the benefit to the social scheme.
  *   *The Failure:* Your case is **internal** (secret) and **non-consequential** (no social benefit). Hume's engine requires social friction to run. A secret promise to a dead person is frictionless. For Hume, an obligation without a sanction is not an obligation; it is a fantasy. He literally defines the obligation of promises *as* the social pressure to conform. Remove the society, remove the obligation.

  **Why Scanlon Succeeds (Normative Realism)**
  Scanlon's theory is **internalist** (regarding reasons) and **deontological** (regarding principles).
  *   *Internalist:* The obligation comes from the reasons generated between the individuals involved.
  *   *Deontological:* The justification is adherence to a principle of right conduct, not the outcome.
  *   *The Success:* Scanlon locates the obligation in the **history of the interaction**. The "debt" was incurred when the assurance was given. Death ends the *relationship*, but it does not necessarily erase the *debt*. Just as you owe it to a deceased friend to return their borrowed book (even though they can't read it), you owe it to your aunt to keep the promise (even though she can't know it). The duty is to the **truth of your past commitment**, not to her **present state of mind**.

  ### The Final Move: The "Impartial Observer" vs. The "Principle"

  If you want to know exactly where you stand:

  If you adopt **Hume**, you are free. You can tell yourself that the feeling of obligation is a sentimental hangover, a "ghost" of the social convention that no longer applies. Hume would advise you to prioritize your current utility and the living society around you.

  If you adopt **Scanlon**, you are bound. Not because your aunt is watching, but because **you** are the kind of agent who gave assurance. To break the promise is to act on a maxim ("I may break promises when the promisee dies") that undermines the very value of giving assurance to anyone who is mortal. Since we are all mortal, a principle that voids promises upon death would make promising useless for anyone facing mortality. Therefore, no one could reasonably accept such a principle.

  **The Deep Reason It Feels Binding**
  The reason your case feels binding, and why Scanlon captures it better than Hume, is that you intuitively recognize that the **normative force of a promise is time-neutral.** When you promised, you bound your *future* self. That future self is you, now. The fact that the *recipient* of the promise has moved out of time does not move *you* out of the obligation you accepted.

  Hume cannot see this because he thinks obligations are made of social pressure. Scanlon sees it because he thinks obligations are made of reasons generated by our interactions. Your intuition aligns with Scanlon: you feel bound because you recognize that the trust she placed in you was a real normative event, not just a social utility calculation. Her death changed her status, but it did not change the truth of what you did when you spoke.
