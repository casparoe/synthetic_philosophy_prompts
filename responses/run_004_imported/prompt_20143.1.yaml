          *   *Weakness:* Hume emphasizes the *social utility*. A secret promise to a dead person has zero social utility in terms of coordination. It's purely internal. Hume is skeptical of "monkish virtues" or duties that have no social cash value.
          *   *Verdict:* Hume struggles significantly here. The convention relies on mutual expectation and sanction. Without the possibility of sanction or the utility of coordination, the "artificial virtue" loses its engine.

  3.  **Deconstruct Scanlon's Account:**
      *   *Core Thesis:* Contractualism. Morality is about principles no one could reasonably reject.
      *   *Principle F (Fidelity):* If you intentionally lead someone to expect X, and you know they want that assurance, and you do it to get them to rely on you, you must do X unless they release you.
      *   *Mechanism:* It's about the wrong done to the *individual* by manipulating their expectations. It's not about social utility (like Hume) or a magical act of will. It's about the relationship of trust.
      *   *Application to the User's Case:*
