      *   **The Task:**
          1.  Explain in *real depth* how Hume generates the binding force of a promise.
          2.  Explain in *real depth* how Scanlon generates the binding force of a promise.
          3.  Evaluate whether *either* theory, on its own terms, can explain why the user's specific promise (secret, promisor alive, promisee dead) remains binding.
          4.  If one *can* handle it, show the move. If *both* fail, explain precisely why (no hand-waving).

  2.  **Deconstruct Hume's Account:**
      *   *Core Thesis:* Promises are not natural acts of will. They are human inventions (conventions) to facilitate cooperation.
      *   *Mechanism:* We feel a "sentiment of morals" (approval/disapproval) based on utility. The practice of promising is useful to society. Breaking a promise undermines the practice.
      *   *The "Will" Argument:* Hume famously argues you can't create an obligation just by willing it (like you can't move a chair by willing it). The obligation comes from the social pressure/sanction attached to the convention.
      *   *Application to the User's Case:*
          *   *Challenge:* The user thinks Hume needs living witnesses/enforcers.
