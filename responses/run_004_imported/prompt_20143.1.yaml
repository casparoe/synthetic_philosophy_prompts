  7.  **Final Polish:** Ensure tone is respectful, philosophical, and directly answers the prompt's constraints (depth, specific theories, specific verdict). (Self-correction: Make sure to explicitly address the "secret" aspect for Hume, as that kills the convention argument even harder than the death aspect).

