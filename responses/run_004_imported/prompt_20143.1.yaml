      *   *Check:* Is the verdict clear? I need to be careful not to say Scanlon *definitely* solves it, but that he has the *resources* to solve it better than Hume. Hume's system is structurally incompatible with private/dead obligations. Scanlon's is compatible but requires a specific interpretation of "what we owe."
      *   *Nuance on Scanlon:* Scanlon actually discusses promises to the dead in *What We Owe to Each Other* (Chapter 7, Section 4 roughly, regarding duties to the dead). He argues that we have duties regarding the interests people had while alive. This is the "move" the user is looking for.
