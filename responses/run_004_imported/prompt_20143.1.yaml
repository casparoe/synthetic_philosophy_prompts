          *   *Key Distinction:* Scanlon distinguishes between harming someone and violating a principle regarding them. The aunt formed expectations *while alive*. Breaking the promise renders her past trust misplaced. It treats her past self as a mere means.
          *   *Verdict:* Scanlon has a stronger case than Hume, but it requires extending "what we owe to each other" to include duties regarding the dead based on their ante-mortem expectations. Scanlon does discuss duties to the dead (e.g., wills), so there is textual ground to stand on.

  4.  **Synthesize and Evaluate:**
      *   *Hume:* Likely fails. The "artificial virtue" requires a living society to sustain the convention. A secret promise to a dead person is invisible to society. It lacks the "public utility" Hume demands.
      *   *Scanlon:* Likely succeeds (with nuance). The obligation is grounded in the *past interaction* and the principle governing such interactions. The death of the promisee doesn't retroactively invalidate the assurance given. The "wrong" is violating the principle that protects the integrity of assurance-giving, regardless of whether the recipient is around to feel the sting *now*.
