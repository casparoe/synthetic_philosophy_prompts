answer: |-
  Here are 10 interview questions tailored for your episode. They move from the normative foundations to the specific technical objections you requested, and end on implementation.

  I have marked the three mandatory topics with **[REQUIRED]** and included the specific follow-up and the "likely dodge" to watch out for in the notes below each.

  ### 1. The Intellectual Journey
  "You've spent a career defending the All-Affected Interests (AAI) principle against a lot of heavy hitters in political theory. I want to start with the motivation. Most people take the boundary of the state as a given. What was the specific case or moment that convinced you that the 'citizenship only' model is not just impractical, but morally illegitimate?"

  ### 2. The Normative Foundation
  "Let's get into the moral core of the claim. You argue that being *affected* grants you a right to a *say*. But in private life, if my neighbor's divorce affects my property value or my mood, I don't get a vote in their family court. Why does the creation of a 'political' decision change the moral math so drastically that impact equals authority?"

  ### 3. [REQUIRED] Affected vs. Coerced (The All-Subjected Principle)
  "There's a major rival theory called the 'All-Subjected Principle,' which says the demos should include everyone *coerced* by the law, not just affected by it. For example, border policy coerces the person trying to cross, but only 'affects' the citizen watching it on the news. Why is 'affectedness' the superior standard? Doesn't focusing on coercion protect communities from having to justify every internal decision to the entire world?"

  *   **Likely Dodge:** He will likely argue that coercion is too narrow because it misses soft power or structural influence (e.g., economic sanctions) that hurts people without technically "coercing" them legally.
  *   **Your Follow-Up:** "But if you expand 'affected' to include structural influence or economic ripple effects, don't you lose the bright line that makes a decision *democratic* rather than just a global stakeholder meeting? At what point does 'influence' become too thin to warrant a vote?"

  ### 4. [REQUIRED] The Circularity Worry
  "One of the oldest objections to your view is the circularity problem. To know who gets to vote on a decision, we need to know who is affected. But to know who is affected, we often need to know what the decision *is*—which is the very thing we're voting on. How do you determine the boundary of the demos *prior* to the vote without already making the decision yourself?"

  *   **Likely Dodge:** He will probably suggest a "provisional" or "rough and ready" assessment of affectedness before the vote, or distinguish between *possible* vs. *actual* affectedness.
  *   **Your Follow-Up:** "If we're relying on a provisional assessment, who makes that call? If a bureaucratic elite decides who counts as 'provisionally affected' before the vote, haven't we just recreated the exclusion problem you're trying to solve, only one step earlier in the process?"

  ### 5. [REQUIRED] Over-Inclusivity & The Global Demos
  "In a globalized economy, interest rate hikes in the US affect farmers in Kenya, and carbon emissions in China affect islanders in the Pacific. If we take the AAI principle seriously, doesn't almost every decision become a global decision? Do you actually bite the bullet that we need a global demos for most issues, or is there a threshold where an effect becomes too 'remote' to count?"

  *   **Likely Dodge:** He will likely argue for a threshold of "significant" or "vital" interests, claiming trivial effects don't trigger the right to a say (subsidiarity).
  *   **Your Follow-Up:** "But who defines 'significant'? If a Western policy slowly degrades the soil quality of a foreign nation over 20 years, that's vital to them but might look 'trivial' to the voters causing it. Doesn't letting the decision-makers define the significance of the impact render the principle toothless for the vulnerable?"

  ### 6. Intensity and Weighting
  "Let's talk about the intensity of the effect. If a zoning law slightly annoys 10,000 citizens but destroys the livelihood of 50 non-citizen neighbors, does the AAI principle demand that the 50 get *more* votes than the 10,000? Are you committed to some form of weighted voting based on how deeply your interests are impacted?"

  ### 7. Future Generations
  "Future generations are undeniably affected by our decisions on debt and climate, perhaps more than anyone alive today. But they can't vote. Does your theory require institutional guardians for the future, like a 'future senate,' or does the inability to participate mean the AAI principle hits a hard limit when time is involved?"

  ### 8. The "Tyranny of the Outsider"
  "Critics worry that if everyone affected gets a say, local communities lose the power to shape their own character. If a small town wants to zone for high-density housing, but outsiders who dislike urban sprawl are 'affected' psychologically or aesthetically, do those outsiders get a veto? How do you balance self-determination with the all-affected principle?"

  ### 9. Institutional Feasibility
  "Philosophers often distinguish between ideal theory and non-ideal theory. Is the All-Affected Interests principle a blueprint for actual institutional design tomorrow, or is it a critical tool to shame existing borders? If I asked you for one concrete policy change a single nation could adopt *now* to move closer to this ideal, what would it be?"

  ### 10. The "Exit" Option
  "Finally, if we can't perfectly solve the boundary problem, is there value in making exit easier rather than voice broader? If people can't vote on the decisions that affect them, does facilitating migration satisfy the moral core of your argument, or is political membership something that can't be substituted by mobility?"
