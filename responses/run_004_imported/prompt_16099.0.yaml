prompt: |-
  My studio art teacher is retiring after thirty-one years, and for as long as anyone can remember, she has had the same answer whenever a student asks, mid-critique, "but is it actually good?": "Go stand in front of it for twenty minutes and then tell me." She has never once simply told a student that a painting was good or bad, because she thinks a verdict you haven't earned through your own looking isn't really a verdict you have at all -- a position, I later found out, that philosophers actually have a name for: pessimism about aesthetic testimony. I've been asked to say a few words at her retirement dinner this Friday. Former students and fellow art teachers, who will instantly recognize what thirty-one years of that answer amounted to, will be sitting beside family, school board members, and administrators who just want a warm, simple story about a wonderful teacher with impeccable taste. Write the toast so it works for both halves of the room without ever actually asking anyone to just take her word, or mine, for what's good.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for a studio art teacher (31 years).
      *   **Key Characteristic:** She never answers "Is it good?" with a yes/no. Her standard response: "Go stand in front of it for twenty minutes and then tell me."
      *   **Philosophical Underpinning:** Pessimism about aesthetic testimony (you can't truly know aesthetic value through someone else's word; you must experience it yourself).
      *   **Audience:** Mixed.
          *   *Group A:* Former students and fellow art teachers (they know the "twenty minutes" line, understand the philosophy, appreciate the rigor).
          *   *Group B:* Family, school board, administrators (want a warm, simple story about a wonderful teacher).
      *   **Constraint:** The toast must work for *both* groups without violating the teacher's core principle. I cannot simply tell the audience "She was good" and expect them to accept it as the final verdict. I need to embody her philosophy in the speech itself.
      *   **Goal:** Write the toast.

  2.  **Deconstruct the Challenge:**
      *   *The Trap:* If I say "She was the best teacher," I'm violating her rule (asking people to take my word for it).
      *   *The Solution:* I need to structure the toast so that the *audience* has to do the work of verification. I need to invite them to look at the evidence (her career, her students, her impact) and draw their own conclusions.
      *   *Tone:* Warm, respectful, slightly intellectual (for the art crowd) but accessible (for the family/admin crowd).
      *   *Key Phrase:* "Go stand in front of it for twenty minutes and then tell me." This needs to be the anchor.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion and the mixed crowd. Establish the connection to the teacher.
      *   **The Core Anecdote:** Introduce the famous line ("Stand in front of it..."). This signals to the art crowd that I "get it," but for the family, it sounds like a quirky teaching habit.
      *   **The Philosophy (Subtle):** Explain *why* she did it without using jargon like "pessimism about aesthetic testimony." Frame it as empowerment and independent thinking. This appeals to administrators (critical thinking skills) and family (personal growth).
      *   **The Application to *Her* Career:** Here's the tricky part. I need to praise her without demanding they accept my praise. I should turn the question back on the audience. "Is she a good teacher? Don't ask me."
      *   **The "Twenty Minutes" Metaphor:** Extend the studio practice to life. Looking deeply at things matters.
      *   **Closing:** A toast that invites action/reflection rather than just drinking.

  4.  **Refining the Voice:**
      *   *Avoid:* "She was amazing." (Too direct/verdict-based).
      *   *Use:* "Look at what is in this room." (Evidence-based).
      *   *Avoid:* "We all love her." (Testimony).
      *   *Use:* "If you sit with the history of this place..." (Invitation to experience).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. We are here for [Teacher]. She taught art for 31 years. She had a catchphrase: "Look at it for 20 minutes." Art students know this. Parents might think that's weird. But she wanted us to trust our eyes. Now she is retiring. Is she a good teacher? I'm not going to tell you. Look around. Look at us. You decide. Cheers.

      *Critique 1:* Too blunt. Needs more warmth for the family. Needs more nuance for the art crowd. The transition needs to be smoother.

  6.  **Drafting - Iteration 2 (Adding Texture):**
      Good evening. For 31 years, [Teacher] stood in front of easels. When we asked "Is this good?", she said "Look for 20 minutes." Some thought she was avoiding the question. But she was teaching us that truth isn't handed down. It's found. Tonight, people ask me, "Was she a good teacher?" I could tell you yes. But that would be disrespectful to her. So I won't. Instead, look at the former students here. Look at the art on the walls. Stand with that evidence. Then decide. To [Teacher].

      *Critique 2:* Better. But "I won't" might sound cold to the family. I need to frame it as a gift. The constraint is "without ever actually asking anyone to just take her word, or mine, for what's good." So I must avoid making a definitive claim *for* them. I can describe the *effect*, but the *valuation* must be left to them.

  7.  **Final Polish (incorporating the "Pessimism about Aesthetic Testimony" concept without the jargon):**
      *   Start with the specific memory (the critique).
      *   Explain the intent (trusting oneself).
      *   Bridge to the retirement context (evaluating her career).
      *   Apply the rule to *her* legacy.
      *   End with a toast that mirrors the instruction.

      *Self-Correction on the Constraint:* The prompt says "without ever actually asking anyone to just take her word, or mine, for what's good." This means I cannot say "She was good." I have to invite them to judge. But it's a retirement dinner; I can't be *too* aloof. I need to balance the philosophical rigidity with human warmth. The warmth comes from the *invitation*, not the *verdict*.

      *Key Insight:* The toast itself should be a demonstration of her teaching method. I will present the "artwork" (her life/career) and ask the viewers to stand before it.

  8.  **Writing the Speech (incorporating the above):**
      *   *Salutation:* Welcome both groups.
      *   *The Story:* The "20 minutes" line.
      *   *The Meaning:* For art kids, it's about vision. For admins/parents, it's about integrity and critical thinking.
      *   *The Turn:* Applying this to tonight. "Is this retirement deserved?"
      *   *The Refusal:* I won't answer that.
      *   *The Invitation:* Look at the room. Look at the time.
      *   *The Toast:* To the looking.

  9.  **Review against constraints:**
      *   Does it mention the 20 minutes? Yes.
      *   Does it work for art teachers? Yes (they get the reference).
      *   Does it work for family? Yes (sounds like "take time to appreciate").
      *   Do I declare her "good"? No, I invite them to judge.
      *   Is it warm? Hopefully.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* cryptic to the family. Explain that "looking" is an act of love/respect.

  10. **Final Polish:** Check rhythm and flow. Ensure the ending lands emotionally without breaking the rule. (The resulting speech in the main response follows this structure.)
answer: |-
  Good evening.

  For those of you who don't know me, I'm a former student of [Teacher's Name]. And for those of you who *do* know me, you know that standing up here feels a bit like walking up to an easel with wet paint and asking the wrong question.

  For thirty-one years, [Teacher's Name] has occupied this studio. And for thirty-one years, whenever a student stood back, insecure and eager for validation, and asked, "But is it actually good?" she gave the same answer. She didn't say yes. She didn't say no. She said: "Go stand in front of it for twenty minutes. And then tell me."

  To the art teachers and former students in the room: you know the frustration of that timer. You know the silence of the studio while the clock ticked. You know that she wasn't withholding praise to be cruel. She was withholding it to be useful. She understood that a verdict handed down from authority is just data. But a verdict earned through your own looking? That is knowledge. That is growth.

  To the family, school board, and administrators in the room: this might sound like a quirky art school habit. But what she was actually teaching wasn't just how to paint. She was teaching how to be present. She was teaching that nothing worth understanding yields its value in a glance. She was teaching that the truth of a thing is found in the relationship between the viewer and the object, not in the opinion of a critic.

  Now, thirty-one years later, we find ourselves in a slightly different position. We are looking at a career that is finishing. And the temptation tonight is to ask the question she always refused to answer. We want to ask: "Was she a good teacher? Was this career successful? Is this retirement deserved?"

  If I were to stand here and tell you "Yes," I would be violating the only rule she ever truly enforced. I would be asking you to accept aesthetic testimony. I would be asking you to take my word for the value of what is in front of you. And [Teacher's Name] has spent three decades teaching us that there is no such thing as a verdict you haven't earned through your own looking.

  So, I am not going to tell you she was wonderful. I am not going to tell you that her impact was profound.

  Instead, I am going to ask you to do the work she assigned us.

  I am asking you to stand in front of this career for twenty minutes.
  Look at the former students sitting at these tables, who learned to trust their own eyes because she refused to trust hers for them.
  Look at the school board members, who have a curriculum that prioritizes critical thinking over rote approval.
  Look at the family, who supported a woman who spent thirty-one years telling children to slow down and look closer in a world that demands we scroll faster.

  Don't take my word for the value of this. Don't take the school's word. Don't even take hers.

  Stand in front of the evidence. Sit with the silence of what she didn't say, and listen to what that silence allowed us to become. If you do that—if you truly look for twenty minutes—I suspect you will find that the verdict you arrive at is far more durable than anything I could offer you.

  So, please raise your glasses. Not to a verdict, but to the looking. Not to the answer, but to the question. And not to me telling you who she was, but to you taking the time to see it for yourselves.

  To [Teacher's Name].
