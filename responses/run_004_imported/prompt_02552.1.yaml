      *   **Adaptation to Impairment:** As you get tired, your "normal" baseline shifts. You don't feel "tired" compared to your rested self; you feel "normal" compared to your tired self.
      *   **Microsleeps/Lapses:** Attention lapses happen without conscious awareness.

  4.  **Synthesize the Evidence:**
