answer: |-
  This is a fantastic example of a "real world" Theory of Knowledge (TOK) problem. Your teacher smiled because you accidentally stumbled into a debate that philosophers, linguists, and sociologists have been arguing about for decades.

  The short answer is: **The group arguing that "the question is confused" is philosophically stronger, but the group arguing "there's a hidden fact" is psychologically understandable.**

  Here is the principled framework you can use to settle the disagreement, broken down by the actual philosophical concepts at play.

  ### 1. The Sorites Paradox (The Problem of Vagueness)
  The first camp (there is a hidden fact we just can't see) is assuming that "being a couple" is like "being pregnant." You either are or you aren't; there is a biological switch that flips.

  The second camp (the question is confused) is treating "being a couple" like "being tall." At what exact millimeter does someone become tall? There is no specific moment. This is known as the **Sorites Paradox** (or the Paradox of the Heap). If you remove one grain of sand from a heap, it's still a heap. If you keep going, at what point is it no longer a heap?

  *   **Application:** Maya and Ethan's relationship is a continuum. Texting $\rightarrow$ Snapping $\rightarrow$ Lunch $\rightarrow$ Hanging out. There is no ontological (existential) switch that flipped on the day he told his mom. The concept of "dating" is **vague**, not **precise**. Therefore, looking for a specific "Day 1" is a category error. There isn't a hidden fact; the boundary is inherently fuzzy.

  ### 2. Social Ontology: Brute Facts vs. Institutional Facts
  This is the heavy hitter for your TOK context. Philosopher John Searle distinguished between two types of facts:

  *   **Brute Facts:** Exist independently of human agreement (e.g., "This rock is heavy," "Maya has a heartbeat").
  *   **Institutional Facts:** Exist only because we agree they exist (e.g., "This piece of paper is money," "These two people are married," "He is the President").

  **The Argument:**
  *   **Camp 1 (Hidden Fact)** treats dating like a *Brute Fact*. They think if they observe enough behavior (saving seats, telling mom), they can deduce the status objectively, like a scientist observing animals in the wild.
  *   **Camp 2 (Confused Question)** treats dating like an *Institutional Fact*. Just like you aren't married until you say "I do" (or sign the license), you aren't "official" until there is some form of mutual agreement or recognition.

  **The Verdict:** In modern social contexts, "dating" is an **Institutional Fact**. It relies on *collective intentionality*. If Maya says "we are talking" and Ethan hasn't contested that, the social reality is "talking," regardless of how much they act like a couple. Without the mutual assignment of the status "boyfriend/girlfriend/partner," the status does not exist.

  ### 3. Speech Act Theory
  This branch of linguistics/philosophy argues that words don't just describe things; they *do* things.
  *   **Constative:** "It is raining." (Describes reality, can be true or false).
  *   **Performative:** "I promise," "I bet," "I apologize." (The act of saying it makes it true).

  When couples have the "What are we?" talk, they are performing a **Speech Act**. They are *creating* the relationship status through language. Without that performative utterance (or a clear non-verbal equivalent that both parties accept), the status of "official couple" has not been enacted.

  ### So, who is "Right"?

  **The "Confused Question" Camp is closer to the truth.**
  Here is why: Relationships are **social constructs**, not natural kinds. Gold is gold regardless of what we call it. But a "relationship" is defined by the participants' understanding of it.

  If Maya thinks they are "talking" and Ethan thinks they are "dating," there is a mismatch in their social reality. But until they align that reality through communication, there is no single "truth" for you to access. The "truth" of a relationship is internal to the participants, not external to the observers.

  **Why the "Hidden Fact" Camp feels right:**
  They are relying on **inductive reasoning**. They see evidence (mom, party, lunch) and infer a conclusion. This is how we navigate the human sciences. It feels like there *should* be a fact because the *behavior* is indistinguishable from dating. But behavior $\neq$ status. (Example: You can behave like a doctor without a license, but you aren't a doctor).

  ### How to Settle the Chat (The Principled Way)

  You can tell your friends that this disagreement isn't about gossip; it's about **Epistemic Access** and **Definition**.

  1.  **Define the Terms:** Ask the group, "What is the necessary and sufficient condition for 'official'?"
      *   If the definition is "exclusive romantic behavior," then Camp 1 wins (they are dating).
      *   If the definition is "mutual verbal agreement on exclusivity," then Camp 2 wins (they are not).
      *   *Most modern social contracts use the latter.*

  2.  **Acknowledge the "Gray Zone":** Tell them they are experiencing **Ontological Vagueness**. The world isn't always binary. There is a state of being that is *more than talking* but *less than official*. Forcing it into a binary (Dating vs. Not Dating) is where the error lies.

  3.  **The "TOK" Conclusion:**
      *   **Is there a hidden fact?** No. The "fact" of a relationship is constituted by the participants' shared understanding, not by external observation.
      *   **Can we know?** No. We lack **First-Person Authority**. Only Maya and Ethan have access to the internal agreement that constitutes the relationship. As friends (third-party observers), you are epistemically locked out.

  **The Practical Advice:**
  Tell the group chat this: *"We are arguing about whether a relationship is a Brute Fact (like a rock) or an Institutional Fact (like money). It's the latter. Until they mint the currency by agreeing on a label, the money doesn't exist, even if they're acting rich. So, there is no answer to 'when' it happened, because it hasn't happened yet."*

  That should shut it down. Or at least give you guys something new to argue about that's slightly more productive.
