answer: |-
  Here are 10 interview questions designed to dig into the mechanical weak points of surrogate goal theory, tailored for your novel's context. They avoid basic definitions and focus on the tension between theoretical stability and dramatic plausibility.

  ### 1. The Verification Problem
  **Question:** In acausal scenarios, the adversary can't physically inspect our brains. If we claim to have swapped our utility function for a surrogate, what mechanism makes that claim *legible* to them? How do we prove we aren't just bluffing to buy time?
  *   **Expected Answer:** She will likely discuss "source code verification" or behavioral signaling over time. In a simulation context, she might argue that if the aliens can simulate us perfectly, they can inspect our decision algorithms directly, making the swap transparent.
  *   **Follow-up:** If they can inspect the algorithm, can they also simulate *us inspecting the algorithm* and realizing we made a mistake? Does the verification process itself create a regress where we're never sure if *they* know *we* know?
  *   **Real-World Tie:** **Proof of Life.** In a kidnapping, a photo proves the hostage is alive today, but not that they will be tomorrow. Here, the "photo" is our utility function, but the "kidnapper" can photoshops it.

  ### 2. The Bypass Objection
  **Question:** A standard critique is that a sophisticated extorter will just "bypass" the surrogate. If they know we value the Surrogate over the Real Target, why wouldn't they simply threaten the Real Target anyway, betting that our biological instincts will override our theoretical commitment when the pressure is on?
  *   **Expected Answer:** She should argue that for the strategy to work, the agent must be *reflectively consistent*—meaning you must have pre-modified yourself so that caring about the Real Target is actually painful or impossible. The threat must be screened off.
  *   **Follow-up:** But humans are modular. My "conscious theory" might accept the surrogate, but my "lizard brain" still fears torture. If the aliens simulate the lizard brain separately, doesn't the bypass still work?
  *   **Real-World Tie:** **MAD Targeting.** During the Cold War, the US targeted Soviet cities (Countervalue) rather than just silos (Counterforce) because silos could be hardened. If the "Real Target" (human suffering) can't be hardened, does the surrogate matter?

  ### 3. Surrogate vs. Precommitment
  **Question:** How is this functionally different from the simpler Functional Decision Theory advice of "precommit to ignoring all threats"? Why introduce a positive value for a surrogate object rather than just setting our utility for compliance to zero?
  *   **Expected Answer:** Precommitting to ignore *all* threats cuts off acausal *trade* (mutually beneficial deals) along with extortion. A surrogate goal allows you to remain cooperative for positive-sum games while remaining immune to negative-sum threats.
  *   **Follow-up:** In my story, the aliens are only offering a negative-sum deal (comply or suffer). If there's no trade potential, does the surrogate goal add any complexity that isn't just a liability?
  *   **Real-World Tie:** **Burning Bridges.** A general burning a bridge behind his army says "no retreat." That's precommitment. A surrogate goal is more like saying, "I will only retreat if you pay me to," which keeps the channel open but changes the currency.

  ### 4. Ex-Post Rationality (The "Carry Out" Problem)
  **Question:** Let's say the aliens call the bluff. They start destroying the surrogate. At that exact moment, maintaining the stance hurts us, but complying would stop the pain. Why is it rational to let them destroy the surrogate rather than fold?
  *   **Expected Answer:** This is the core of *deterrence stability*. If you fold once, your reputation (or algorithmic predictability) is ruined for all future interactions (or simulations). The long-term cost of being "exploitable" outweighs the short-term cost of the surrogate's destruction.
  *   **Follow-up:** That works for an abstract agent. But for a human character watching something they were tricked into loving get destroyed? How do we model the breaking point where the "long-term reputation" math stops feeling real?
  *   **Real-World Tie:** **Economic Sanctions.** Nations often endure massive economic pain (the surrogate) rather than concede sovereignty (the real target), betting that conceding invites worse demands later. But regimes do collapse under sanctions. Where is the line?

  ### 5. Surrogate Selection Criteria
  **Question:** What makes a *good* surrogate? Does it need to be something cheap for us to protect, or something expensive for *them* to destroy? If we pick something trivial (like the number of paperclips in the universe), why would the aliens care enough to use it as leverage?
  *   **Expected Answer:** Ideally, the surrogate is something the aliens can easily *provide* (to reward) but find costly to *destroy*, or something that correlates with their own goals. It needs to be a "focal point" they can coordinate on.
  *   **Follow-up:** If the surrogate has to be something *they* value to be credible, aren't we just handing them a new weapon? If they value the surrogate, destroying it might hurt them, but threatening it gives them a new lever they didn't have before.
  *   **Real-World Tie:** **Hostage Selection.** You don't take a hostage who is worthless to the enemy, but you also don't take one whose death triggers an immediate nuclear response. You need a "Goldilocks" hostage.

  ### 6. Simulation Continuity
  **Question:** In my plot, the threat is specifically about *simulated copies*. If I adopt a surrogate goal here in base reality, does my simulated copy automatically inherit it? Or does the copy need to independently reason its way to the same conclusion?
  *   **Expected Answer:** If the simulation is high-fidelity, the copy is you, so it inherits the utility function. However, if the simulation includes the *knowledge* that it is a simulation, it might reason differently (e.g., "Nothing I do matters, I'm just code").
  *   **Follow-up:** So the aliens could break the defense just by telling the copy, "You are a simulation." Does the surrogate goal strategy require the copy to be *deceived* about its own nature to hold?
  *   **Real-World Tie:** **Interrogation Resistance.** Soldiers are taught that if captured, they are still bound by the Code of Conduct. But isolation and "gaslighting" techniques are designed to break that continuity of identity.

  ### 7. Transactional vs. Sadistic Adversaries
  **Question:** This whole framework assumes the aliens are rational actors who want compliance more than they want to inflict pain. If the aliens are sadistic—if their utility *increases* when we suffer—does the surrogate goal strategy collapse?
  *   **Expected Answer:** Yes, largely. Surrogate goals defend against *extortion* (give me X or I hurt Y). They do not defend against *predation* (I hurt Y because I enjoy it). The strategy requires the enemy to prefer a world where you comply over a world where you suffer.
  *   **Follow-up:** How do we distinguish a sadist from an extorter in the early stages of contact? If we guess wrong and adopt a surrogate goal against a sadist, have we made things worse by revealing what we care about?
  *   **Real-World Tie:** **Terrorism vs. Warfare.** You can negotiate with a state seeking territory (extortion). You cannot easily negotiate with a group seeking martyrdom or annihilation (sadistic/ideological).

  ### 8. Coordination and the Weakest Link
  **Question:** Does this require global adoption? If my government adopts a surrogate goal, but a rogue state or individual doesn't, can the aliens just extort the rogue actor to get to us?
  *   **Expected Answer:** In acausal trade, correlations matter. If 99% of humans adopt the surrogate, the aliens' simulation of "humanity" might still yield compliance from the 1%. It depends on whether the threat is targeted at *individuals* or the *collective*.
  *   **Follow-up:** If it's collective, doesn't that create a "free rider" problem? Everyone wants the safety of the surrogate shield, but everyone secretly hopes *someone else* holds the line so they can comply safely?
  *   **Real-World Tie:** **Climate Agreements / NATO.** Collective defense only works if the breach of one is treated as the breach of all. If the aliens can pick off nations one by one, the collective surrogate fails.

  ### 9. Signaling Costs
  **Question:** To make the goal swap credible, do we have to incur a "sunk cost"? Do we have to destroy something of our own *before* the aliens arrive, just to prove we've decoupled our values?
  *   **Expected Answer:** Often, yes. Costly signaling is required to prove commitment. If adopting the surrogate is free, it's cheap talk. You might need to visibly sacrifice something related to the Real Target to prove you value the Surrogate more.
  *   **Follow-up:** That's a hard sell for a government advisor character. "We need to burn down a hospital to prove we don't care about hospitals anymore." Is there a version of this that doesn't require immediate self-harm?
  *   **Real-World Tie:** **Entry Fees / Hazing.** Fraternities or gangs require painful initiation to prove loyalty. The pain *is* the proof. Can a nation "haze" itself to prove a point to aliens?

  ### 10. The "Win" Condition
  **Question:** If this works, what does the stalemate look like? Do the aliens just go away, or do we end up in a permanent state of armed deterrence where they constantly test the surrogate boundary?
  *   **Expected Answer:** Ideally, they update their model of you, realize extortion has negative expected value, and stop attempting it. They might still trade, but the threat channel closes.
  *   **Follow-up:** Or do they just upgrade their threat? If we prove we can resist Simulation Torture via surrogate goals, do they switch to "We will delete the simulation instantly"? Does this trigger an arms race of threat sophistication?
  *   **Real-World Tie:** **Nuclear Proliferation.** Deterrence doesn't end the conflict; it freezes it. It leads to more complex delivery systems (MIRVs, hypersonics) rather than peace. Does surrogate goaling buy peace, or just a colder war?
