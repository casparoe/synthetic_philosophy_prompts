answer: |-
  This is a fantastic question. You have hit on exactly the spot where most people either give up on Kant or decide he's a moral monster. The Abbott translation is also notoriously stiff (it's from 1889), which doesn't help.

  Your intuition that this sounds like "empty duty-for-duty's-sake" is actually a very famous objection (Hegel made it later), but to see if it's a *fair* objection, we have to clear up the terminology first. Kant isn't saying the action should have no result; he's saying the *motive* shouldn't depend on the result.

  Here is the step-by-step logic of that specific stretch of the *Groundwork*, using your friend's cousin example to keep it grounded.

  ### 1. Maxim vs. Purpose (Object)
  You asked: *"Isn't a maxim just your own personal reason or plan for doing the thing, which sure sounds an awful lot like a purpose to me?"*

  This is the crucial distinction.
  *   **The Purpose (Object):** This is the **outcome** in the world you are trying to achieve. (e.g., "The poor get money," "The kid doesn't get ripped off," "I look generous at parties.")
  *   **The Maxim:** This is the **rule** you are following in your head to get there. It is the "because" statement. (e.g., "I will donate when it boosts my status," or "I will donate because rational beings ought to support one another.")

  **Why Kant separates them:**
  Kant argues that **Purposes are luck.** If I try to save a drowning man (Purpose: save life) but I slip and he dies, I failed my purpose. But did I do something morally wrong? No.
  Therefore, moral worth cannot depend on the *Purpose* (which relies on the world cooperating). It must depend on the *Maxim* (which is entirely inside my control).

  In your friend's cousin's case:
  *   **Purpose:** Money goes to charity (Good outcome).
  *   **Maxim:** "I will use charity to buy social clout."
  *   **Kant's Verdict:** The purpose was achieved, but the action has **zero moral worth** because the maxim was self-serving.

  ### 2. "Excluding every object of the will"
  You asked: *"It starts to sound like he wants dutiful actions to have zero content or aim... which seems like a weirdly empty thing to demand."*

  This is the hardest sentence in the passage. When Kant says "exclude every object of the will," he does **not** mean "do things that accomplish nothing." He means "do not let the *desire for the accomplishment* be the thing that moves your muscles."

  Here is the logic:
  1.  **Inclinations are contingent:** Sometimes you feel like helping people; sometimes you're tired, grumpy, or hate the specific people who need help. If your morality is based on "wanting to help" (an inclination/object), your morality fluctuates with your mood.
  2.  **Law is necessary:** 2+2=4 regardless of how you feel. Kant wants morality to be that solid.
  3.  **The Subtraction:** To find this solid moral core, you have to subtract everything that *could* change.
      *   Subtract the desire for money.
      *   Subtract the desire for happiness.
      *   Subtract the desire for the other person's welfare (yes, really—even sympathy is an inclination for Kant).
  4.  **What's left?** If you strip away all the *desires* for outcomes, what is left to motivate you? Only the **concept of Lawfulness itself.**

  So, "excluding the object" means: I will help the poor not because I *want* them to be fed (object), but because my reason tells me that *feeding the poor is a requirement of rationality* (law).

  ### 3. The Bridge to "Universal Law"
  You asked: *"There's clearly some connective tissue between 'exclude every object of the will' and 'universal law' that isn't showing up for me."*

  You are right; there is a missing link in that specific paragraph that Kant fills in later, but here is the shortcut:

  If I cannot act based on my personal desires (my "objects"), I cannot act on rules that are specific to *me*.
  *   I can't say: "I will lie when *I* need money." (That relies on my specific desire for money).
  *   I can't say: "I will help when *I* feel like it." (That relies on my specific mood).

  If I strip away everything personal, I am left only with **form**. What is the form of a rule? It's that it applies to everyone.
  *   If I am acting purely on "Law," I am acting on a rule that *could be a law for everyone.*
  *   Therefore, to act from Duty (respect for law) is identical to acting on a Maxim you could will to be a Universal Law.

  The "empty" feeling you get is actually the point. He is trying to find a moral rule that doesn't depend on *who you are* or *what you want*. The only thing that fits that description is a rule that applies to everyone equally.

  ### 4. Is your "Empty Duty" objection fair?
  You asked: *"Tell me straight up whether my 'this basically collapses into empty duty-for-duty's-sake with no real content' reaction is a fair objection, or whether I'm misreading him somewhere."*

  **The Verdict:** You are **not misreading him**, but your objection is a critique of his project, not a misunderstanding of it.

  **Where you are right:**
  Kant *does* demand that the specific content of your desires (happiness, welfare, love) cannot be the source of moral value. To many critics (like Hegel, Schopenhauer, and modern virtue ethicists), this makes Kantian ethics look cold, robotic, and alienated from human life. It feels "empty" because it ignores the emotional texture of being human. If you save a drowning child purely out of "respect for the law" and actively suppress your natural instinct to save a life because it's an "inclination," Kant says that action has *more* moral worth than if you saved them because you love children. That feels wrong to most people.

  **Where Kant would push back:**
  Kant would argue that "empty" is actually **"free."**
  *   If I act because I *want* to (inclination), I am a slave to my biology/psychology. I didn't choose to be hungry or sympathetic; it just happened to me.
  *   If I act because it is *Right* (Duty), I am acting as a free, rational agent. I am not being pushed by desires; I am pulling myself by reason.

  He isn't trying to describe how humans *do* act (psychology); he is trying to describe what gives an action *moral value* (normative ethics). He thinks if morality depends on feelings, it isn't morality, it's just preference.

  ### Summary for your argument with your friends
  1.  **Consequentialist Friend:** "The money helped people, so it's good."
      *   **Kantian Reply:** "The *outcome* was good, but the *agent* gets no moral credit. If the stock market crashed and he couldn't donate, he wouldn't have tried. His 'goodness' is dependent on luck and vanity."
  2.  **You:** "It feels different if he does it for status."
      *   **Kantian Backup:** "Exactly. Moral worth isn't about the physical event (money moving); it's about the **Maxim** (the rule in the head). One maxim is 'Use charity for status.' The other is 'Support humanity because it is right.' Only the second one counts as moral."
  3.  **Your Objection:** "But isn't that just empty duty?"
      *   **Resolution:** "It feels empty, but Kant argues that's the only way to make morality fair. If morality depends on 'caring,' then people who are naturally grumpy can never be moral. Kant wants a morality that is possible for everyone, regardless of their feelings."

  You read the text correctly. It *is* demanding. Whether that demand is profound or absurd is the debate that has been happening for 250 years. You're in good company.
