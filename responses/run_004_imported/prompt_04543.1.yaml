  2.  **Deconstruct Kant's Argument (Section I):**
      *   *Proposition 1:* Action has moral worth only if done *from duty* (not just *in accordance with* duty).
      *   *Proposition 2:* Moral worth doesn't come from the *purpose/outcome* (the object), but from the *maxim* (the principle of volition).
      *   *Proposition 3:* Duty is the necessity of acting from *respect for the law*.
      *   *Key Distinction:* Inclination (desires, feelings, outcomes) vs. Reason (Law).

  3.  **Address the Specific Confusions:**

      *   **Maxim vs. Purpose/Object:**
          *   *Purpose/Object:* The *result* I want (e.g., the kid has money, the poor are fed, I look good at parties). This is external/consequential.
          *   *Maxim:* The *rule* I am following (e.g., "I will lie when it benefits me" vs. "I will tell the truth because it is required"). This is internal/formal.
          *   *Analogy:* Driving. Purpose = getting to the store. Maxim = "I will obey traffic laws" vs. "I will drive however gets me there fastest." Kant cares about the rule, not the destination.

      *   **"Exclude every object of the will":**
          *   This is the trickiest part. It doesn't mean the action has no physical result. It means the *motivation* cannot be the desire for that result.
          *   If I help someone *because* I want them to be happy (object), that's inclination.
          *   If I help someone *because* helping is right (law), regardless of whether they end up happy, that's duty.
          *   Why? Because inclinations are contingent (I might not feel like it tomorrow). Reason/Law is necessary.

      *   **Connection to Universal Law:**
          *   If I strip away all my personal desires (objects/inclinations), what's left? Only the *form* of lawfulness itself.
          *   What does it mean to act on "law" generally? It means acting on a rule that could apply to everyone.
          *   Hence: Universalizability.

      *   **The "Empty Duty" Objection:**
          *   Is it fair? It's a common critique (Hegel called it "empty formalism").
          *   Is it a misreading? Yes and no. It *is* formal, but Kant argues morality *must* be formal to be universal. If it depends on content (happiness, wealth), it varies by person.
          *   Nuance: Kant isn't saying outcomes don't matter *at all* in life, just that they don't confer *moral worth*.

