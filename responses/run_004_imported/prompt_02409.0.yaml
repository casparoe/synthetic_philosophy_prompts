answer: |-
  A Causal Decision Theorist who moonlights as a Site Reliability Engineer runs into Death in Damascus.

  Death says, "I have an appointment with you at midnight. I am a perfect predictor. If you stay in Damascus, I will be here. If you flee to Aleppo, I will be there."

  The engineer panics and opens his laptop. "Hold on, I can optimize this. I'll just model your prediction as a function of my choice and find the utility-maximizing move."

  He types:
  `while (!ratifiable) { choice = decide(); location = Death.predict(choice); }`

  He hits enter. The laptop fans scream, the CPU hits 100%, and the cursor freezes.

  Death looks over his shoulder. "You're stuck in an infinite loop, aren't you?"

  "Yeah," says the engineer, fanning the smoke. "My decision updates your prediction, which invalidates my decision, which updates your prediction... I can't find a fixed point. There's no stable equilibrium."

  "That's because you're using Causal Decision Theory," Death says, checking his watch. "You're trying to solve for a variable that depends on its own solver."

  "Is there a patch?"

  "Switch to Evidential Decision Theory," Death says.

  "Will I survive?"

  "No," says Death. "But it stops treating your inevitable death as a critical exception. The system still goes down, but it exits gracefully."
