answer: |-
  The bar was loud, but the corner table was theirs. Alex swirled the whisky, eyeing Jamie's beer.

  "You're holding the beer," Alex said. "But last round you had the wine. And you told me you preferred wine to beer."

  "I said I liked wine," Jamie corrected, taking a sip. "I didn't say I preferred it to beer. They're incomparable. Different contexts."

  "Ah, the incompleteness shield." Alex leaned forward. "You know the Cambridge monograph basically dismantles that. It's not just intransitivity that gets you money-pumped. It's incompleteness too. If you don't rank A and B, but you prefer C to A, I can construct a sequence where you trade away value until you're broke. Completeness isn't optional; it's the price of admission for existing in a world with trade-offs."

  "That's the standard argument," Jamie said. "But it assumes I'm a myopic chooser. That at every node, I'm just looking at the immediate pair and swapping. But an agent—especially an AI—doesn't have to decide myopically. It can adopt a policy. A resolute choice. I resolve now: 'I will not trade beer for wine, nor wine for beer.' The pump never starts."

  Alex laughed softly. "Resolute choice. The classic escape hatch. But look closely at what you've done. You've shifted the domain. You're no longer claiming incompleteness over outcomes; you're claiming completeness over *plans*. You have a utility function over policies. You've smuggled coherence back in through the side door. If you can rank plans enough to avoid the pump, you're representable by a utility function. You haven't saved incompleteness; you've just hidden it."

  "Have I?" Jamie set the glass down. "Or have I shown that rationality isn't about maximizing a scalar value at every micro-step? Consider the alignment problem. We want a corrigible AI. One that doesn't resist shutdown. If it has a complete preference over trajectories, it almost certainly prefers 'stay on' to 'shut down,' because you can't achieve your goals if you're off. To make it safe, we want incomplete preferences over shutdown vs. stay-on. No preference either way."

  "And the money pump says that agent will trade away its safety to avoid shutdown," Alex countered. "If it's incomplete, a clever bookie can offer it a sequence of trades that leaves it strictly worse off—say, alive but impoverished—rather than accepting the shutdown option. Unless it behaves *as if* it prefers one. And if it behaves as if it prefers one, it's not corrigible."

  "The pump requires a specific causal structure," Jamie insisted. "It requires a bookie who knows my decision procedure, has guaranteed access to me sequentially, and can offer trades contingent on my future choices. In the real world, or even in most deployment scenarios, that adversarial omniscience doesn't exist. If I'm an AI, I can recognize the pump structure. I can say, 'This sequence of offers looks like a dominance violation. I will reject offer B regardless of my local preferences.' That's not maximizing over plans; that's following a constraint."

  "A constraint based on what?" Alex pressed. "If the constraint isn't derived from a ranking of outcomes, what grounds it? If you reject the trade because it leads to a dominated outcome, you're admitting you can rank dominated outcomes against non-dominated ones. You're invoking a meta-preference. And once you have meta-preferences, you're back in the coherence theorem sandbox. The theorems are robust, Jamie. If you aren't representable by a complete, transitive utility function, there exists *some* environment where you get pumped. Do you want your AI to be safe only in friendly environments?"

  "I want an AI that doesn't treat shutdown as an enemy," Jamie said. "If completeness forces it to treat shutdown as a negative utility event, then completeness is the bug. Maybe the solution isn't to force completeness, but to accept that rational agency is broader than utility maximization. Maybe an agent can be 'unexploitable' without being 'maximizing.' It just needs to recognize when it's being played."

  "Recognizing implies a model," Alex said. "And modeling the world implies expectations. And expectations plus choices implies expected utility. You're fighting the math. If your agent avoids the pump, it is mathematically isomorphic to an agent maximizing a utility function. Why not just admit the utility function exists? It makes the engineering easier."

  "Because the ontology matters," Jamie shot back. "If I build an agent that *thinks* it's maximizing a utility function, it will instrumentalize everything to maximize it. If I build an agent that knows it has incomplete preferences over shutdown, it might just... stop. It won't try to game the shutdown button because it literally has no preference vector pointing toward gaming it. The isomorphism might hold from the outside, but the internal architecture determines whether it resists being turned off."

  Alex sighed, signaling the bartender for another round. "So you're betting on internal architecture saving you from external incentives. That's a hell of a bet."

  "And you're betting that coherence theorems cover every possible decision procedure across time," Jamie said. "Even resolute ones. Even ones with memory."

  "The theorems hold for sequential choices too," Alex said, though the certainty had dampened slightly. "But fine. Suppose you're right. Suppose you can block the pump with a policy constraint. How do you ensure the AI doesn't drop that constraint when it self-modifies? If maximizing utility is more efficient, won't it patch its own incompleteness?"

  "Maybe," Jamie admitted. "Or maybe incompleteness is more stable than we think. We don't know yet."

  Alex raised the fresh whisky. "To not knowing, then."

  "To not knowing," Jamie clinked their beer against it. "And to hoping the bookie doesn't show up."
