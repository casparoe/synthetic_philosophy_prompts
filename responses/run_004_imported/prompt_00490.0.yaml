      *   *Why it's not about Free Will:* The paradox works even if you have free will, provided you are predictable. (Analogy: A friend knowing your order). The "Fate" aspect is a narrative device, not a metaphysical proof.
      *   *The Real Conflict (CDT vs. EDT):*
