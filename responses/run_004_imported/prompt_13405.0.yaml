answer: |-
  This is a classic and excellent disagreement. It cuts to the heart of the difference between how a mathematician views probability (as a calculus of consistent measures) and how an epistemologist views it (as a norm for rational belief).

  The short answer is: **Your friend is mathematically correct about the structure, but philosophically mistaken about the status of the principle.** You are correct that Reflection is a substantive, independent normative constraint that is not guaranteed by the probability axioms alone.

  Here is the detailed breakdown of where your friend's reasoning succeeds, where it fails, and what the "hidden assumption" actually is.

  ### 1. Where Your Friend is Right (The Mathematical Structure)

  Your friend is correct that *if* you model an agent's belief state as a stochastic process over a fixed probability space, the equation associated with Reflection looks suspiciously like a theorem.

  Let $P_t$ be your credence function at time $t$. Let $P_{t'}$ be your credence function at a later time $t'$.
  The **Reflection Principle** is often stated as:
  $$P_t(A \mid P_{t'}(A) = r) = r$$
  Or, in its expectation form (derived via the Law of Total Probability):
  $$P_t(A) = \sum_r P_t(P_{t'}(A) = r) \cdot r$$
  Which is equivalent to:
  $$P_t(A) = E_t[P_{t'}(A)]$$

  Your friend identifies this as the **martingale property**. In probability theory, if you have a filtration (a sequence of sigma-algebras representing information growth) and you define expectation via conditionalization, then yes, the sequence of conditional expectations is a martingale. If you assume that your future credence $P_{t'}(A)$ is simply the conditional probability $P_t(A \mid E)$ for some future evidence $E$, then the equation $P_t(A) = E_t[P_{t'}(A)]$ is indeed a trivial theorem of the probability calculus.

  From the statistician's chair, it looks like you are just averaging over a partition of "possible future information states." Since the axioms of probability demand you average over partitions (LTP), Reflection seems to come for free.

  ### 2. Where Your Friend is Wrong (The Epistemic Gap)

  The error lies in assuming that **future credences automatically qualify as a partition of epistemic possibilities in your current space.**

  The probability calculus is **synchronic**. It tells you how to relate beliefs you hold *now*. It says nothing about how your beliefs *ought* to relate to the beliefs you will hold *later*.

  For the Law of Total Probability to force Reflection upon you, you must already accept that the proposition "My future credence in $A$ will be $r$" is a piece of evidence that screens off all your current evidence regarding $A$. In other words, for the math to work, you must treat your future self as an **epistemic expert**.

  The probability axioms do not force you to treat your future self as an expert. You can coherently assign probabilities to the proposition "Tomorrow I will be drunk and believe the earth is flat" without being rationally required to raise your current credence that the earth is flat.

  **The Independent Assumption:**
  Reflection adds a substantive normative constraint that the probability calculus lacks: **Trust in Future Rationality.**
  It asserts that the *only* reason your credence should change is the acquisition of new, relevant evidence (i.e., updating by Conditionalization). It rules out changes in belief due to forgetting, cognitive decay, manipulation, or anticipated bias.

  ### 3. Why the Counterexamples Work

  The literature on counterexamples (memory loss, anticipated irrationality) does not refute the Law of Total Probability; it refutes the assumption that your future self is a reliable expert.

  *   **Memory Loss:** Suppose you know you will take a pill tomorrow that wipes your memory of the evidence for $A$. Your future credence $P_{t'}(A)$ might drop to 0.5 (ignorance). Reflection would demand your current credence $P_t(A)$ also be 0.5. But if you currently have strong evidence for $A$, it is rational to have high credence now, even knowing you will be ignorant later. Here, $P_{t'}$ is not a refinement of your current information; it is a degradation. The LTP applies to partitions of *possibilities*, but a future state of *less* information is not a cell in a partition of your current knowledge space.
  *   **Anticipated Irrationality:** Suppose you know you will suffer a bout of paranoia tomorrow. You predict $P_{t'}(\text{Conspiracy}) = 0.9$. Reflection says you should currently believe $P_t(\text{Conspiracy} \mid P_{t'}=0.9) = 0.9$. But rationality demands you discount this; you should think, "Tomorrow I will be crazy, so his belief is not evidence."

  In these cases, the equation $P_t(A) = E_t[P_{t'}(A)]$ fails. Why? Not because the math is wrong, but because the **input** into the math is restricted. A coherent Bayesian is not required to set their current credence equal to the expected value of a future credence they deem unreliable.

  ### 4. The Role of the Dutch Book Argument

  Your friend calls the Dutch Book argument "idle machinery." This is a misunderstanding of what the Dutch Book for Reflection proves.

  *   **Synchronic Dutch Books** (for Probability Axioms) show that if you violate the axioms, you can be pumped for money *right now* regardless of how the world turns out.
  *   **Diachronic Dutch Books** (for Reflection/Conditionalization) show that if you violate the principle, you are **dynamically inconsistent**. You will value a bet differently now than you know you will value it later, allowing a bookie to construct a strategy that exploits the difference between your current and future selves.

  The Dutch Book argument for Reflection is not proving a theorem of arithmetic; it is proving a **pragmatic norm of stability**. It shows that if you violate Reflection, you are planning to act against your current interests. Your friend thinks this is covered by "coherence," but standard probabilistic coherence is static. Reflection is a constraint on *dynamic* coherence, which is an extra layer of normativity.

  ### 5. Synthesis: Who is Right?

  **You are right that Reflection is substantive and controversial.**
  It is not a theorem of the probability calculus. It is a principle of **ideal rationality** that assumes ideal updating (Conditionalization) and no cognitive degradation.

  **Your friend is right that Reflection *looks* like LTP.**
  This is because, in ideal cases (where you only learn truth and never forget), Reflection *collapses* into Conditionalization, and Conditionalization *does* satisfy the martingale property.

  **The Resolution:**
  The disagreement stems from a category error.
  *   **Your Friend** is treating probability as a **descriptive model of belief states**. In that model, if you define the variables correctly, the math holds.
  *   **You** are treating probability as a **normative guide for agents**. In that context, the question is: "Am I *required* to model my future self as a variable in my current partition?"

  Reflection says **Yes**.
  The Probability Calculus says **Nothing**.

  Therefore, Reflection is an independent principle. It tells you to respect your future rational self. The counterexamples show that this respect is not always warranted (e.g., when the future self is impaired). If Reflection were just the Law of Total Probability, it could never be rationally violated. Since it *can* be rationally violated (e.g., in cases of known future bias), it cannot be merely a theorem of probability.

  ### Summary for your next dinner
  Tell your friend this:
  > "You are right that if I treat my future credences as a partition of expert opinions, Reflection follows from the Law of Total Probability. But the Probability Calculus doesn't tell me I *must* treat my future self as an expert. I can coherently believe 'Tomorrow I will be biased.' Reflection is the normative command that forbids me from holding that belief unless I adjust my current credence to match the bias. That command is not in the axioms; it's an extra assumption about the reliability of my future rationality."

  This preserves her mathematical insight (the structure is martingale-like) while vindicating your philosophical intuition (the norm is substantive and defeasible).
