          *   Tiling agents description is acceptable for summary, but note that parametric polymorphism is subtle (it doesn't fully solve the lifespan issue without caveats).
          *   Agrippa Analogy: It's good. The "Circularity" horn is the trickiest part. Löb doesn't just say circularity is bad; it says formal self-endorsement implies inconsistency (or triviality). Agrippa says circularity provides no *new* justification. The formal result is stronger.
