answer: |-
  **Setting:** *A dimly lit Italian restaurant. The remains of a meal sit between them. A bottle of Barolo is half-empty. ELENA (40s, sharp blazer, sharper eyes) swirls her glass. THOMAS (40s, clerical collar swapped for a turtleneck, tired but present) watches her.*

  **Elena:** You're dodging the wound, Thomas. Nietzsche isn't just saying morality has a history. He's saying the history is an infection. If you trace 'good' back to the *ressentiment* of the powerless, to the revenge fantasy of people who couldn't act, you don't get virtue. You get a poison tree.

  **Thomas:** And I'm saying you're committing the genetic fallacy in fancy prose, El. Where a thing comes from doesn't tell you what it *is*. Penicillin comes from mold. Does that make it less effective at saving your life?

  **Elena:** Penicillin isn't a value system. It doesn't demand you crush your instincts to justify its existence. If the root is spite, the fruit is spite. You can't eat that and claim it's nourishment.

  **Thomas:** But people *are* nourished. I sit in a box six hours a week and listen to people beg for forgiveness. They aren't acting out a slave revolt. They're in pain. They want to be better than they are. If the concept of 'sin' helps them bridge that gap, I don't care if a German philologist thinks it started as a power grab.

  **Elena:** That's exactly the Ascetic Priest move. You manage the pain. You tell them the pain is their own fault, then you sell them the cure. It's a closed loop. You keep them sick so they need your medicine.

  **Thomas:** I keep them honest. There's a difference. You think guilt is a construct? Try telling a mother who yelled at her dying child that her guilt is just a social artifact. She doesn't need a genealogy. She needs to know she's still loved despite the ruin.

  **Elena:** She needs to know the ruin isn't cosmic. That's the cruelty of it. You take a natural feeling—regret—and you metaphysicize it. You turn a mistake into an offense against the infinite. That's how you break them. Nietzsche wanted to free us from that debt.

  **Thomas:** Freedom isn't the highest good, Elena. Charity is. If believing in a divine judge makes a man treat his wife with kindness instead of indifference, I'll take the 'lie' over your 'truth' every day. Your truth leaves him alone.

  **Elena:** My truth leaves him *sovereign*. He stands on his own legs. Yours has him on a leash, looking up for a treat. It's infantilizing. You say charity, I say domestication.

  **Thomas:** Call it what you want. I call it keeping the wolves from the door. You talk about sovereignty like it's a warm coat. I've seen what happens when people decide they're truly sovereign. They eat each other. I'd rather they feel guilty than feel nothing at all.

  **Elena:** So you prefer the comfort of the herd. The safety of the cage.

  **Thomas:** I prefer the community of the broken. Look at us. You think our friendship is just sublimated drive? Old history, shared nostalgia, utility?

  **Elena:** I think it's a bond we've chosen, yes. But don't pretend it's holy. It's just us against the void.

  **Thomas:** Then pass the wine. If it's just us against the void, pour me a glass. Because if your genealogy is right, and my values are just a symptom of weakness... then I'm too weak to finish this bottle alone.

  **Elena:** *[She pauses, bottle hovering]* You're twisting it.

  **Thomas:** No. I'm living it. You say my morality is a crutch? Fine. Let me lean. But don't tell me I can't walk.

  **Elena:** *[She pours, but doesn't clink glasses]* You walk, Thomas. You just refuse to look at the ground beneath your feet.

  **Thomas:** I'm looking at the people walking on it. That's enough for me.
