      *   *Decision:* The *Restriction Strategy* (specifically Neil Tennant's "Cartesian Propositions" approach) offers the best ground for a technical debate about *ad hoc*-ness vs. principled restriction. It allows the AR to say "KP holds for all *knowable* truths," while the R attacks the definition of "knowable."
      *   *Refinement:* Let's go with a restriction based on *logical type* or *epistemic stability*. Tennant's view is that KP should be restricted to propositions that are *logically consistent* with being known. This is technically precise.
