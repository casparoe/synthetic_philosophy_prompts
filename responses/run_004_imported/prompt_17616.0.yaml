answer: |-
  **Setting:** *A whiteboard in a quiet corner of a co-working space. The board is covered in stochastic calculus notation and Python snippets. Two laptops are open. **Elena** (Expected Value Theorist) stands with a marker. **Marcus** (Ergodicity Theorist) is sitting, leaning forward.*

  **Elena:** Look, the code is trivial. The hard part is the policy. You're telling me that for a 55% win rate, even money, the bot should wager 10% of the bankroll. That's the Kelly fraction.

  **Marcus:** That's the growth-optimal fraction. Yes.

  **Elena:** But it's suboptimal for expected wealth. If I bet 100% of the bankroll every round, the expected value after $N$ rounds is $(1.1)^N$ times the stake. If I bet 10%, it's roughly $(1.055)^N$. The all-in strategy dominates. Strictly. At any finite $N$, the EV of betting everything is higher.

  **Marcus:** The EV is higher because of a ghost. It's higher because in the ensemble average, there is one path out of a trillion where you win every single time, and that path accumulates so much wealth it pulls the average up. But no one lives in the ensemble. We live in time. In 99.9% of the trajectories, betting 100% sends you to zero almost immediately. Once you hit zero, the game stops. The time-average growth rate for betting all-in is negative infinity.

  **Elena:** That's the standard risk-aversion argument, Marcus. You're smuggling in a utility function. If you have logarithmic utility over wealth, then yes, maximizing expected log wealth gives you Kelly. But that's a subjective preference. It's like saying, "I prefer apples to oranges, therefore apples are objectively the rational fruit." Samuelson demolished this in the 60s. He showed that maximizing the geometric mean does *not* maximize the expected utility of terminal wealth for any utility function other than log. If your goal is to have the most money possible on average, you bet more than Kelly. If you're scared of ruin, you bet less. But don't tell me Kelly is "rational" in a vacuum.

  **Marcus:** It's not about fear. It's about ergodicity. This is the point Ole Peters keeps making, and I think you're glossing over it. In an ergodic system, the time average equals the ensemble average. If I roll a die a million times, the average of my rolls equals the average of a million people rolling once. But wealth dynamics here are multiplicative. They are non-ergodic. The ensemble average—the EV you're clinging to—is a property of parallel universes. The time average is a property of *this* universe. Rationality should be defined by what happens to the agent in time, not by a snapshot of hypothetical copies.

  **Elena:** But "what happens to the agent" depends on what the agent *wants*. Suppose I'm a hedge fund. I have access to capital markets. If I blow up, I can recapitalize. I can borrow. If I have a positive edge, and I can survive the drawdowns, maximizing EV is the correct strategy for my investors. They care about the return on capital, not the specific path my personal account took. By capping myself at Kelly, I am leaving free money on the table. I am accepting a lower expected return to reduce variance. That is the definition of risk aversion.

  **Marcus:** You're assuming you can recapitalize. But in your bot, the bankroll is the constraint. There's no external injector of cash. In that closed system, ruin is absorbing. It's a physical boundary. When you say "leaving free money on the table," you're talking about money that exists in the branches of the decision tree that got pruned. You can't spend money from the timeline where you went bust.

  **Elena:** I can spend the money from the timeline where I won big. That's the point of expectation! Expectation is a weighting of all possible outcomes. If I play this game once, EV tells me what the bet is worth. If I play it repeatedly, EV still tells me the value of the strategy, provided I can handle the variance. You're conflating "rationality" with "survival." Survival is a constraint, sure. But if I set a constraint like "probability of ruin must be less than 5%," then I solve for the max EV under that constraint. That might land me near Kelly, or it might not. But Kelly isn't the *source* of the rationality; the constraint is.

  **Marcus:** Okay, let's press on that constraint. Why 5%? Why not 1%? Why not 0.0001%? If you admit that as $N \to \infty$, the probability of ruin for any fraction $f > f_{Kelly}$ goes to 1, then you're admitting that for any long enough horizon, the EV-maximizing strategy guarantees ruin.

  **Elena:** I admit that for $f=100\%$, ruin is certain. But for $f=20\%$? That's double Kelly. The growth rate is lower than optimal, but the probability of ruin over a human lifetime might be negligible. Yet the EV is significantly higher than Kelly. So why is Kelly the "golden mean"? You claim it's objective. I claim it's just the specific solution for Log Utility.

  **Marcus:** Because Log Utility isn't just a preference in this context; it's the measure of the flow of time in a multiplicative system. Think about geometric rationality. It's not just betting. When you pool probability forecasts from multiple experts, if you average their probabilities arithmetically, you get calibration issues. If you average their log-odds—the geometric mean—you get a coherent aggregate. Why? Because information combines multiplicatively. Wealth combines multiplicatively. The arithmetic mean treats gains and losses as additive, which they aren't. Losing 50% requires a 100% gain to recover. The geometry of the space dictates the aggregation method.

  **Elena:** That's a beautiful analogy, Marcus, really. But is it prescriptive? Just because information *aggregates* geometrically doesn't mean I *want* to maximize the geometric mean of my wealth. Suppose I have a one-off bet. I'm offered this 55% coin flip once. Do I bet 10%? No. If I have Log Utility, I bet 10%. If I have linear utility, I bet everything. The math of the coin hasn't changed. The ergodicity breaking only happens over repeated trials. So your "objective" rationality depends on the horizon.

  **Marcus:** The horizon is always greater than one. You are always in a sequence of decisions. Even if it's one bet, it's part of your life's wealth trajectory. But let's grant the one-off case. The ergodicity argument is strongest in the repeated case, which is your bot. Your bot is an algorithm operating in time. If you program it to maximize arithmetic expectation, you are programming it to optimize for a metric it will never experience. It will experience a single path. On that path, the arithmetic average of the ensemble is irrelevant. The Lyapunov exponent—the exponential growth rate of that single path—is what determines whether the bot succeeds or fails. That exponent is maximized *only* at Kelly.

  **Elena:** The bot succeeds or fails based on the user's goal. If the user wants to turn \$1,000 into \$1,000,000 as fast as possible, even with a 90% risk of ruin, Kelly is too conservative. The EV-maximizer has a higher probability of hitting that target *if* they don't hit zero first. You're saying that's irrational. I'm saying that's a risk preference. You keep using the word "objective." You say EV is a "category error." But EV is the foundation of pricing theory. Derivatives are priced on risk-neutral measures—essentially EV under a transformed probability. Are you saying Black-Scholes is a category error?

  **Marcus:** I'm saying that pricing is about hedging, which removes the risk. It creates an ergodic environment by offloading the variance to the market. Your bot isn't hedging. It's taking naked risk. In naked, multiplicative risk, the ensemble average diverges from the time average. The divergence isn't a bug; it's the feature. The "category error" is assuming that because the math of expectation works for additive processes (like insurance pools), it works for multiplicative ones (like investing). It doesn't. The Law of Large Numbers applies to the *log* of wealth, not wealth itself.

  **Elena:** Fine. The Law of Large Numbers applies to log wealth. So the median outcome is maximized at Kelly. I'll concede that. The median path does best with Kelly. But the *mean* path does best with higher leverage. Why is the median more "rational" than the mean?

  **Marcus:** Because the median is what you actually see. The mean is a phantom. In a skewed distribution, the mean can be orders of magnitude away from the typical outcome. If I tell you, "The expected payout of this lottery is \$1 million," but 99.99% of people get zero, I'm lying about your experience. I'm describing the universe, not your life.

  **Elena:** I'm not lying. I'm describing the value of the ticket before the draw. If I can buy a million tickets, the mean *becomes* my reality. That's the casino's perspective. Your bot could be the casino. If the bot can parallelize—run a thousand accounts—the ensemble average *becomes* the time average for the aggregate system. Then EV maximization is correct again.

  **Marcus:** But then you've changed the problem. You're no longer talking about a single bankroll compounding. You're talking about an additive pool of independent bets. That *is* ergodic. But your prompt said "fraction of your current bankroll." That implies a single trajectory. If you fragment the bankroll into a thousand accounts, you've effectively turned the multiplicative process into an additive one by diversification. But for a single account, the compounding is real. You can't diversify away the time order of returns. Sequence of returns risk is the non-ergodicity.

  **Elena:** Okay, let's look at the numbers. 55% win. Kelly says 10%. Let's say I bet 20%. My expected growth rate drops slightly. My variance doubles. But my expected wealth after 1,000 rounds is vastly higher than at 10%. If I'm building this bot for a friend who understands the risk, who says, "I want to maximize my expected net worth, I don't care about the distribution," then I am morally obligated to bet 20%. Or 50%. To impose Kelly is to impose my utility function on them.

  **Marcus:** But do they understand the risk? "I don't care about the distribution" is easy to say when you're looking at a spreadsheet. It's harder when you're down 90%. But more importantly: if they bet 50%, they *will* go to zero. With probability 1, as $N \to \infty$. So they are maximizing expected wealth conditional on survival, but the probability of survival goes to zero. They are maximizing a value that they will almost certainly never possess. Is that rational? To optimize for a ghost?

  **Elena:** It's rational if the payoff is infinite. If the one path where they survive yields \$10^{50}$, does it matter that the other paths are zero? In decision theory, we weigh by probability. A tiny probability of infinite wealth can dominate.

  **Marcus:** But wealth isn't infinite. And utility isn't linear. Even if you claim linear utility, there's a saturation point. Money has diminishing marginal utility. Once you have enough to buy everything you could possibly want, more money is just score-keeping. If the goal is score-keeping, fine, play EV. But if the goal is resource acquisition, Kelly is the speed limit of the universe for multiplicative growth.

  **Elena:** I think we're circling the drain. You believe rationality is defined by the physical constraints of a single trajectory in time. I believe rationality is defined by the consistency of preferences across possible states of the world, regardless of whether those states are temporal or parallel.

  **Marcus:** And I think your "states of the world" include worlds you can't visit.

  **Elena:** And I think your "time" ignores the value of optionality. If I bet big and win, I have more options. If I bet Kelly, I grow slower. Maybe I miss an opportunity because I was too conservative.

  **Marcus:** If you bet big and lose, you have no options.

  **Elena:** *(Puts the marker down)* So, for the bot...

  **Marcus:** For the bot, if it's a single bankroll, compounding over indefinite time, it has to be Kelly. Anything else is mathematically guaranteed to underperform in the long run.

  **Elena:** And if it's a short-term tournament? Fixed number of rounds, say 100. And the goal is to have the highest rank on a leaderboard?

  **Marcus:** *(Pauses)* Then it's not about growth rate. It's about beating the variance of the other players. You'd bet more than Kelly. Maybe much more.

  **Elena:** So the "objective" rationality depends on the game structure.

  **Marcus:** The ergodicity breaking is always there. But the cost of ignoring it depends on the horizon and the competition.

  **Elena:** So I should make the fraction a parameter.

  **Marcus:** Make it a parameter. But default to 10%.

  **Elena:** I'll default to 10%. But I'm adding a comment in the code: *"Maximizes time-average growth. Suboptimal for ensemble-average wealth."*

  **Marcus:** And I'll add: *"Ensemble average is physically inaccessible for a single agent."*

  **Elena:** *(Smiles)* Deal. Let's see if the backtest survives the drawdown.

  **Marcus:** It will. As long as you don't get greedy.

  **Elena:** As long as I don't get poor.
