      *   **Ergodicity Theorist (ET):** Let's call him *Marcus*. He represents the Ole Peters/Santa Fe Institute view. He focuses on time averages vs. ensemble averages, the physical reality of a single trajectory, and the idea that EV is physically meaningless for a single agent over time. He cites Peters and geometric rationality.

  3.  **Key Arguments to Include:**
