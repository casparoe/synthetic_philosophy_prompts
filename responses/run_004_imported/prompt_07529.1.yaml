answer: |-
  The file folder for Patient Zero smelled of damp wool and cheap tobacco. It was November 1978, and the rain against the clinic's brutalist concrete facade sounded like static. Mrs. Gable sat on the edge of the vinyl chair, her hands knotted in her lap. She wasn't hysterical. She was quiet, almost apologetic.

  "It's not that I don't recognize myself, Dr. Aris," she said, staring at the floor. "It's that when I wave… the woman in the mirror waits a moment before she waves back. Just a moment. Like she's tired."

  I wrote *delusional misidentification* in the margin, then crossed it out. There was no grandiosity here, no Capgras conviction that the reflection was an imposter. It was merely a latency. A lag. I watched her lift a hand in my office window's darkened pane. She moved slowly. The reflection moved slowly. I saw no delay, but I was looking for physics, and she was reporting experience.

  I coined the term *Specular Delay* in the case notes to avoid the baggage of *schizophrenia* or *hysteria*. It sounded neutral, mechanical. A glitch in the optical nerve, perhaps, or a minor dissociative tick. I filed it away, assuming it was an idiosyncrasy of Mrs. Gable's particular grief. She had lost a daughter six months prior. The world moving slower than the self seemed a poetic metaphor for mourning.

  I published the case study two years later in the *Journal of Nervous and Mental Disease*. It was a modest paper, three pages. I defined Specular Delay as a subjective sensation of temporal asynchrony between motor action and visual feedback in reflective surfaces. I emphasized its rarity. I thought I was describing a stone I had found on the beach. I didn't realize I was throwing it into the water.

  The first ripple arrived in 1981.

  Mr. Henderson was a schoolteacher, precise and nervous. He didn't sit when he entered. He walked straight to the sink in the corner of my office, turned on the tap, and looked into the mirror above it. He snapped his fingers.

  "Did you see it?" he asked, not turning around.

  "See what, Mr. Henderson?"

  "The lag. It's about two hundred milliseconds. Sometimes three."

  I felt a prickling at the base of my neck. Mrs. Gable had spoken of a "moment," a vague emotional delay. Henderson was measuring it. I asked him where he had heard of Specular Delay. He tapped the journal on my desk. He had found it in the university library. He had read my words, and somehow, my words had given him a ruler.

  "It's worse when I'm tired," he said, finally sitting. "And if the light is fluorescent. Did you know that?"

  I didn't. I noted it. *Environmental factor: lighting.* I added it to the growing addendum in my mind. Henderson's symptoms were cleaner than Gable's. He didn't weep about the delay; he managed it. He avoided mirrors in the evening. He wore watches with second hands to calibrate his own sense of time. He was treating the diagnosis as a manual for living.

  By 1983, the referrals were coming from other states. The file cabinet dedicated to Specular Delay expanded from one drawer to three. I was forced to revise the criteria for the upcoming DSM revision. The original definition required the sensation to be distressing. But many of these new patients weren't distressed; they were fascinated. They were experts.

  A young woman named Sarah came in wearing a shirt with a high collar. She explained that she avoided low necklines because seeing her own throat move out of sync made her nauseous.

  "Is it the Type A or Type B?" she asked me.

  I blinked. "There are no types, Sarah."

  "There should be," she said, leaning forward. "Type A is motor lag. The reflection moves after you. Type B is audio-visual. You hear your voice before you see your lips move. I have Type B. But sometimes it shifts."

  I looked at my notes. I had never distinguished between audio and visual components. Mrs. Gable hadn't mentioned sound. Henderson hadn't either. But now that Sarah had drawn the line, I saw it everywhere. I went back through the files. Once the distinction existed, the evidence arranged itself to support it. Patients who previously reported vague "wrongness" now recalled specific audio-visual splits. They were reorganizing their memories to fit the architecture I had built, and then reinforcing the architecture with their new memories.

  I revised the criteria. *Subtype A: Motor-Visual Asynchrony. Subtype B: Audio-Visual Asynchrony.* I felt a strange hollowness as I typed the words. I was no longer mapping a territory; I was zoning it.

  The loop tightened in 1985. A patient named David arrived with a videotape.

  "I recorded this," he said, placing the cassette on my desk. "I set up two cameras. One on me, one on the mirror. I synchronized the clocks."

  He wanted me to watch the footage. He wanted me to confirm the delay was objective, not subjective. I refused. The condition was psychogenic; the delay existed in the perception, not the photon. But David looked disappointed, not relieved. He wanted the reality of the label to match the solidity of the science. He wanted to be a kind of person that physics could acknowledge.

  "It's getting faster," David told me. "The lag. When I first read your paper, it was half a second. Now it's barely noticeable. Unless I focus on it. Then it stretches."

  "If you focus on it, you amplify the symptom," I said, using the standard clinical line.

  "No," David corrected gently. "If I focus on it, I find it. It's there because I'm looking for the gap. You told us there was a gap, Doctor. Now we know where to stand to see it."

  I dismissed him, but his words stayed in the room long after he left. I looked at the stack of files on my desk. The early cases were messy, tangled with grief, trauma, schizophrenia, migraine. The later cases were pristine. They presented with the symptoms exactly as described in the literature. They used the terminology. They sought the specific medications I had suggested might help. They were becoming the diagnosis.

  I began to wonder about the silence between the cases. Were there people suffering from this sensation before 1978 who simply called it fatigue? Or did the name *Specular Delay* create a container strong enough to hold the experience, allowing it to coalesce into something shareable?

  I started drafting the next revision of the criteria. I needed to account for the "focus effect" David described. I needed to add a note about media consumption. I needed to keep pace. If I stopped updating the definition, the patients would outgrow it. They were evolving faster than the paperwork. They were learning to be Specular Delay patients more efficiently than I was learning to treat them.

  Late one evening, I stayed at the clinic to work on the manuscript. The building was quiet, the hum of the ventilation system the only sound. I stood up to stretch and walked to the window. The glass was dark, reflecting the office behind me: the desk, the lamp, the stacks of paper.

  I raised my hand to adjust my glasses.

  In the reflection, my hand rose.

  I waited. I counted the seconds in my head. One, two.

  The reflection moved with me. Perfectly synchronized.

  I felt a surge of relief, followed immediately by a sharp, cold doubt. Was it synchronized because there was no lag? Or was it synchronized because I wasn't looking for the lag? If I stopped believing in Specular Delay, would the patients stop feeling it? Or would they simply find a new name for the gap, a new doctor to write the paper that taught them how to suffer precisely?

  I turned away from the window and looked at my typewriter. The page was blank except for the heading: *Diagnostic Criteria: Revision 4.*

  I sat down. I put my fingers on the keys. I had to write something. The patients were waiting for the new definition. They needed to know what kind of people they were this year. I began to type, describing the symptoms exactly as they had been described to me, by the people who had learned them from me. The words flowed easily, too easily, as if they were being dictated from the other side of the glass. I typed until the sun came up, documenting the movement of a target I knew I was pushing forward with every keystroke, unable to stop, unable to say whether I was chasing a ghost or feeding one.
