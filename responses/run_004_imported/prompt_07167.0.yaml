prompt: |-
  Got in a big argument with my friend last night about my mom. Mom keeps saying she wants to stay in her own house and would hate assisted living, but every time we visit my aunt's retirement community, she's the life of the party, cracking jokes and dancing, way more herself then she ever seems at home alone. My friend's take is that this settles it: forget what mom says, her behavior in that setting is the real evidence of what she actually wants. Something about that argument feels off to me but I couldn't explain why at the time. Is my friend right that how she acts in that setting tells us more about her true preferences than what she says, or is there a flaw in that reasoning?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Conflict:** The user had a big argument with a friend about the user's mom.
      *   **The Core Issue:** Mom *says* she wants to stay in her own house and hates the idea of assisted living. However, when visiting the user's aunt in a retirement community, Mom acts vibrant, social, and happy ("life of the party").
      *   **Friend's Argument:** Mom's *behavior* in the retirement community is the "real evidence" of what she wants, overriding her *words* about staying home. Therefore, she should move.
      *   **User's Intuition:** Something feels "off" about the friend's reasoning, but they couldn't articulate why.
      *   **Goal:** Validate the user's intuition, explain the flaw in the friend's reasoning, and provide a nuanced perspective on how to interpret the mom's conflicting signals.

  2.  **Deconstruct the Friend's Argument (The Flaw):**
      *   *Premise:* Behavior in a specific context reveals true preference more than stated preference.
      *   *Context:* Visiting an aunt (social occasion, temporary, no commitment).
      *   *Reality:* Living there (permanent, loss of autonomy, daily routine, health decline context).
      *   *Flaw:* Context matters. Enjoying a party $\neq$ wanting to live in the venue. It's a category error (confusing "enjoying a visit" with "wanting to reside").
      *   *Psychological Aspect:* Autonomy and control. Saying "I want to stay home" is about control. Acting happy at a party is about social connection. Both are valid needs.

  3.  **Validate the User's Intuition:**
