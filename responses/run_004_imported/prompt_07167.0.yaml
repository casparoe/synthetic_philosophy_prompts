      *   **Autonomy vs. Socialization:** Mom values independence (staying home) *and* connection (partying). The friend is prioritizing one over the other without consent.
      *   **The "Why" behind the words:** Why does she say she hates assisted living? Fear of loss of control, stigma, cost, leaving memories.
      *   **The "Why" behind the behavior:** Why is she happy there? Social stimulation, no chores (temporarily), seeing family.
