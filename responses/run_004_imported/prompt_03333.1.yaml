prompt: |-
  I've been increasingly interested in the "replication crisis" in psychology ever since we covered hypothesis testing in AP Statistics this year, especially the argument that traditional frequentist significance testing is partly responsible for it. My teacher mentioned that a lot of the proposed reforms point toward Bayesian methods instead, so over the summer I decided to trace the idea back to its root and actually read Thomas Bayes's original 1763 paper, "An Essay towards Solving a Problem in the Doctrine of Chances," published in the Philosophical Transactions of the Royal Society. It turned out to be a strange document: the word "Bayesian" never appears anywhere in it, and most of it is a dry geometric argument built around a billiard-table thought experiment. But right after Proposition 9, there's a short prose section called the "Scholium" where Bayes seems to step outside the math to justify why we're allowed to treat every possible value of a completely unknown probability as equally likely before we've seen any data — which I gather is basically the founding moment of the "flat prior," a concept that is still argued about today in exactly the kind of context that comes up in replication-crisis debates about how much conclusions should depend on an analyst's assumptions.

  Here is the passage, transcribed as written: "From the preceding proposition it is plain, that in the case of such an event as I there call M, from the number of times it happens and fails in a certain number of trials, without knowing any thing more concerning it, one may give a guess whereabouts it's probability is, and, by the usual methods computing the magnitudes of the areas there mentioned, see the chance that the guess is right. And that the same rule is the proper one to be used in the case of an event concerning the probability of which we absolutely know nothing antecedently to any trials made concerning it, seems to appear from the following consideration: viz. that concerning such an event I have no reason to think that, in a certain number of trials, it should rather happen any one possible number of times than another. For, on this account, I may justly reason concerning it as if its probability had been at first unfixed, and then determined in such a manner as to give me no reason to think that, in a certain number of trials, it should rather happen any one possible number of times rather than another. But this is exactly the case of the event M. For before the ball W is thrown, which determines it's probability in a single trial, (by cor. prop. 8.) the probability it has to happen p times and fail q in p + q or n trials is the ratio of AiB to CA, which ratio is the same when p + q or n is given, whatever number p is; as will appear by computing the magnitude of AiB by the method of fluxions. And consequently before the place of the point o is discovered, or the number of times the event M has happened in n trials, I have no reason to think it should rather happen one possible number of times than another."

  I haven't quoted the earlier propositions that actually set up the billiard table and define the event M, the ball W, and the points and areas he keeps referring to, so a fair amount of this is opaque on its own terms. Could you help me reconstruct, in plain language, what argument Bayes is actually making for treating an "unknown event" as if all its possible frequencies of success were equally probable in advance? I'm especially curious whether this amounts to just applying the "principle of indifference" directly to the unknown probability itself, which I've read is considered a somewhat questionable move, or whether Bayes is doing something subtler by reasoning about the symmetry of the number of successes rather than the probability parameter directly — I came across a claim that this distinction is precisely why later statisticians, including Fisher, disagreed about whether the Scholium's argument actually works. I'd also love to understand why historians and philosophers of statistics still treat this one paragraph as such a pivotal moment for the frequentist-versus-Bayesian divide that keeps resurfacing in discussions of the replication crisis.
