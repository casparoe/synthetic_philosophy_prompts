answer: |-
  Here is the strongest possible formulation of the circularity objection to Joyce-style accuracy-dominance arguments. This is not a balanced overview; it is the case for why the accuracy-first program is a mathematical sleight of hand that smuggles the conclusion into the premises.

  ### The "Rigged Metric" Objection

  The core charge is this: **The requirement of Strict Propriety is not an independent epistemic norm; it is a mathematical encoding of Probabilism itself.** By demanding that a legitimate inaccuracy measure be strictly proper, Joyce is not deriving probabilism from accuracy; he is defining "accuracy" in such a way that only probabilists can possess it.

  Here is the breakdown of why this renders the argument viciously circular.

  #### 1. The Mathematical Equivalence Thesis
  The most damning evidence against the non-circularity of the argument is the mathematical relationship between coherence and propriety. They are not merely compatible; they are structurally isomorphic.

  In the geometry of credence spaces, a scoring rule is strictly proper if and only if it is generated by a convex function. The set of probabilistically coherent credence functions is the convex hull of the set of possible worlds (the "veritic" states).

  When Joyce argues that incoherent credences are dominated *only if* we use proper scoring rules, he is relying on a geometric fact: **You can only guarantee that a point outside a convex set is dominated by a point inside the set if your distance metric respects the geometry of that convex set.**

  To demand a "legitimate" measure of accuracy be strictly proper is to demand that the measure respects the convex geometry of the probability simplex. But the probability simplex *is* probabilism. Therefore, the argument amounts to:
  1.  Assume the geometry of belief space is probabilistic (via the Strict Propriety constraint).
  2.  Prove that beliefs fitting that geometry are optimal.
  3.  Conclude that beliefs must fit that geometry.

  This is not a vindication; it is a tautology dressed up as a theorem. You have assumed the shape of the target to prove that the arrow hit the bullseye.

  #### 2. The "Truthlikeness" Gap
  The accuracy-first program claims to be grounded in the pre-theoretic intuition that beliefs aim at the truth. We need a measure that captures "closeness to the truth."

  However, Strict Propriety does not capture closeness to the truth; it captures **incentive compatibility**.
  *   **Closeness to Truth:** If the truth is 1 (True) and I believe 0.9, I am "close." If I believe 0.1, I am "far." A natural measure of this is absolute distance ($|x - v|$) or Euclidean distance.
  *   **Strict Propriety:** This requires that if I believe 0.9, my *expected* inaccuracy is minimized by reporting 0.9.

  The problem is that natural measures of distance (like absolute distance) are **not** strictly proper. If you use absolute distance to measure inaccuracy, an agent can often minimize expected inaccuracy by extremizing their beliefs (jumping to 0 or 1) rather than reporting their true credence.

  If the goal is genuinely "closeness to the truth," why is absolute distance illegitimate? The only answer the accuracy-firster can give is: "Because absolute distance doesn't yield probabilism."

  This exposes the circularity. There is no independent, pre-probabilistic intuition that says "A measure of accuracy must be such that you never want to misreport your credence." That is a pragmatic constraint about reporting, not an epistemic constraint about truth. By ruling out non-proper measures (like absolute distance) as "illegitimate," Joyce is ruling out any measure of truth-closeness that fails to validate the probability axioms. He is defining "truth-closeness" as "whatever makes probabilism work."

  #### 3. The Perspective of the Incoherent Agent
  The dominance argument claims to show the incoherent agent that they are making a mistake *by their own lights*. It says, "Even by your own standard of accuracy, you are dominated."

  But this is false if the agent does not accept Strict Propriety.
  *   To see the domination, the agent must calculate *expected* inaccuracy.
  *   To calculate expected inaccuracy, the agent must weight the inaccuracy in each world by their credence in that world.
  *   If the agent is incoherent, their weighting system violates the probability axioms.

  If the agent uses their actual (incoherent) weighting system to evaluate the inaccuracy measure, the domination often disappears. The domination only appears if you force the agent to evaluate the inaccuracy measure using *coherent* probabilities.

  Therefore, the argument tells the incoherent agent: "If you evaluate your accuracy using coherent probabilities, you will see you should be coherent." This is blatantly question-begging. It assumes the normative authority of coherent probabilities to prove the normative authority of coherent probabilities.

  #### 4. The Pragmatic Smuggle
  Historically, strictly proper scoring rules (Brier, Log, etc.) were not developed by epistemologists studying truth. They were developed by statisticians and decision theorists (de Finetti, Savage, Good) to solve **elicitation problems**.

  The question they answered was: "How do we design a betting payoff structure so that a risk-neutral agent maximizes their expected profit by reporting their true subjective probability?"

  Strict Propriety is a **pragmatic** condition about betting behavior and risk neutrality. By importing Strict Propriety into epistemology as a constraint on "accuracy," Joyce is smuggling pragmatic norms (Dutch Book vulnerability, betting consistency) back into the epistemic domain under a new name.

  The accuracy-first program promised to escape the pragmatism of Dutch Book arguments. It claimed to ground probabilism in pure epistemic value (truth). But by relying on scoring rules designed for betting elicitation, it silently re-imports the pragmatic constraints it claimed to transcend. It hasn't replaced the Dutch Book argument; it has merely translated the betting payoffs into "inaccuracy points" and pretended they are measures of truth.

  ### The Verdict

  The Joyce argument fails as a non-circular vindication because the constraint of **Strict Propriety** carries the entire normative weight of the argument, yet it lacks independent epistemic justification.

  1.  **Mathematically**, it is equivalent to assuming convexity/coherence.
  2.  **Intuitively**, it conflicts with natural notions of distance (absolute value).
  3.  **Historically**, it is a pragmatic tool for betting, not an epistemic tool for truth.

  To accept Strict Propriety as a requirement for "legitimate accuracy" just *is* to accept Probabilism. Therefore, the argument does not derive Probabilism from Accuracy; it derives Probabilism from Probabilism, using "Accuracy" as a camouflage. The rabbit hole doesn't lead to a foundation; it leads back to the entrance.
