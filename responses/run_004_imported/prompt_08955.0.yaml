      *   *Modal Profile:* If the cache had frozen 2 minutes earlier, she would believe she is waitlisted (false). If the cache had frozen 2 minutes later (or not at all), she would believe she is enrolled (true). The belief is sensitive to the glitch timing, not just the enrollment status.

