      *   Why? Yes.
      *   Note what both are missing? Yes.

      *Let's write it.*
answer: |-
  This exchange is a textbook dramatization of the **Rule-Following Paradox**, most famously articulated by Ludwig Wittgenstein in *Philosophical Investigations* and later expanded by Saul Kripke in *Wittgenstein on Rules and Private Language*. The core issue is whether past usage or private intention can logically fix the meaning of a rule for future, novel cases.

  Here is an analysis of the exchange move by move, followed by what both parties are missing.

  ### Move 1: Marcus's Appeal to Literalism
  **Marcus:** *The payout is obviously $10,000 -- that's just what 5% means, and it's what they've always meant by the rule.*

  *   **Who has the better of it:** **Marcus (Pragmatically).**
  *   **Why:** In ordinary life, language works. If you agree to "5%," you pay 5%. To suggest otherwise seems pedantic. Marcus is relying on the **semantic stability** of language. In a court of law or a casual conversation, his interpretation is the default "reasonable person" standard. He is operating within a "form of life" where words have standard uses.
  *   **Weakness:** He is begging the question. He asserts that "5% means 5%" without addressing *why* that meaning extends to this new, unprecedented case. He assumes the rule carries its own application with it, which is precisely what Lena is about to challenge.

  ### Move 2: Lena's Underdetermination Argument
  **Lena:** *It isn't obvious at all: every past payout is equally consistent with a rule that charges 5% up to some cap and then flattens out...*

  *   **Who has the better of it:** **Lena (Logically).**
  *   **Why:** This is the heart of the skeptical problem (often illustrated by the "Quus" function). Logically, any finite set of data points (past invoices under $10k) can be fitted by infinite mathematical curves. A rule of "5% up to a $500 cap" fits all past data perfectly. Because no invoice has ever tested the boundary, the past behavior does not *logically necessitate* the current payout. Lena correctly identifies that **past use does not logically guarantee future application.**
  *   **Weakness:** While logically sound, this is a "philosophical skeptic's" move. It ignores context, intent, and the purpose of the bonus. It treats a business agreement like a mathematical proof requiring absolute deductive certainty.

  ### Move 3: Marcus's Appeal to Introspection
  **Marcus:** *I can settle it by introspection: he's always privately had "5%, no matter how large the invoice" in mind...*

  *   **Who has the better of it:** **Lena (Philosophically).**
  *   **Why:** Marcus attempts to solve the logical gap by pointing to a mental state. He claims his *intention* fixes the meaning. However, as Wittgenstein argued, a mental state (an image, a feeling, a sentence in the head) is just another sign. How do you know you interpreted your own mental sign correctly? If the word "5%" is ambiguous, the thought "I mean 5%" is equally ambiguous. You cannot use a rule to interpret the rule.
  *   **Weakness:** Marcus assumes private access grants authority. But private states are not self-interpreting.

  ### Move 4: Lena's Attack on Private Meaning
  **Lena:** *That doesn't help, since whatever he had "in mind" is just as open to two readings as the rule itself was...*

  *   **Who has the better of it:** **Lena (Consistently).**
  *   **Why:** She extends the skepticism to Marcus's internal world. She points out that **dispositions** (what he *would* have done) are not **normative** (what he *meant* to do). Just because Marcus *might* have paid 5% on a million dollars doesn't mean he *meant* to. If he had balked at a billion dollars, would that prove he always had a cap in mind? Lena is winning the philosophical debate: neither external behavior nor internal states can logically *force* a specific interpretation of a rule.
  *   **Weakness:** She is trapped in skepticism. If she pushes this too hard, she undermines her own ability to argue that the rule *might* mean something else. She is sawing off the branch she sits on.

  ### Move 5: Marcus's Reductio ad Absurdum
  **Marcus:** *By this logic no agreement between two people could ever be shown to mean one determinate thing rather than another, which is absurd.*

  *   **Who has the better of it:** **Marcus (Existentially), but he misunderstands the implication.**
  *   **Why:** Marcus correctly identifies that Lena's skepticism, if accepted as a practical guide, makes communication and society impossible. This is the standard "stopper" to radical skepticism. We *must* act as if meaning is determinate. However, he thinks this *refutes* Lena's logical point. It doesn't. It just shows that logical certainty isn't the foundation of meaning.
  *   **Lena's Silence:** Lena has no answer because she recognizes the force of the *reductio*, but she also knows her logic holds. She is stuck between logical truth and practical falsehood.

  ---

  ### What Both of Them Are Missing

  Both Lena and Marcus are trapped in a false dichotomy: they assume meaning must be secured either by **logical necessity** (Lena's demand) or **private mental facts** (Marcus's defense). They are both missing the **social and normative context** that actually fixes meaning.

  **1. Meaning is Use in a Community (The Wittgensteinian Solution)**
  Neither realizes that the meaning of "5%" is not fixed by Marcus's brain or by logical deduction from past invoices. It is fixed by the **customs and practices of their business community**. In the design industry, "5% referral" is a standard convention. Unless a cap is explicitly stated, the convention dictates no cap. The "rule" isn't a mystical entity; it's a social practice. The "correct" application is what the community accepts as correct. Marcus is right practically, not because of introspection, but because he is adhering to the public custom.

  **2. The Principle of Charitable Interpretation**
  In contract law and friendship, ambiguity is resolved by **reasonable expectations**, not logical possibilities.
  *   **Marcus misses:** He should acknowledge that Lena has a logical point (the underdetermination is real), but that it is irrelevant to the *agreement*.
  *   **Lena misses:** She is treating a social contract like a mathematical axiom. In human agreements, we interpret rules based on the *purpose* of the rule. The purpose of a referral bonus is to incentivize bringing in clients. A $10,000 bonus on a $200,000 client is a strong incentive; a $500 cap (implied by her skepticism) would render the bonus meaningless for large clients, defeating the purpose of the agreement.

  **3. Normativity vs. Description**
  Lena is describing what *could* be the case (descriptive skepticism). Marcus is asserting what *ought* to be the case (normative commitment). The gap between them isn't about facts; it's about **commitment**. To follow a rule is to commit to a standard of correctness that transcends your current mood or calculation. Marcus is right to pay the $10,000, not because he can prove he "meant" it in the past, but because to do otherwise now would be to change the rules of the game mid-play, which violates the trust inherent in the partnership.

  ### Summary Verdict
  *   **Moves 1–4:** **Lena wins the philosophical debate.** She successfully demonstrates that neither past behavior nor private intention can logically guarantee the meaning of a rule in a novel case.
  *   **Move 5:** **Marcus wins the practical debate.** He correctly identifies that life cannot proceed on Lena's terms.
  *   **The Real Winner:** **The Context.** The answer lies outside their binary. They should pay the $10,000 because that is what the **practice** of their industry and the **purpose** of their agreement demands. Meaning is not a ghost in the machine (Marcus) nor a logical void (Lena); it is a public, social tool used to get things done.
