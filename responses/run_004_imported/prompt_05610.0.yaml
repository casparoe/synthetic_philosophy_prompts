prompt: |-
  Two friends of mine, Lena and Marcus, co-run a small design studio and have always paid a referral bonus of "5% of the invoice" to freelancers who bring them a client, a rule they've applied without incident to dozens of invoices, all comfortably under $10,000. Their first six-figure referral just came in: a $200,000 contract, which at 5% works out to a $10,000 bonus. (1) Marcus said the payout is obviously $10,000 -- that's just what 5% means, and it's what they've always meant by the rule. (2) Lena said it isn't obvious at all: every past payout is equally consistent with a rule that charges 5% up to some cap and then flattens out, since no invoice large enough to tell the two rules apart has ever come up before now, so nothing in their history actually settles which one they were following. (3) Marcus said he can settle it by introspection: he's always privately had "5%, no matter how large the invoice" in mind, and that fixes the answer. (4) Lena said that doesn't help, since whatever he had "in mind" is just as open to two readings as the rule itself was, and if the number had been outlandish enough he might well have balked or miscalculated, so his say-so doesn't obviously track a fact that already existed before this case came up. (5) Marcus, frustrated, said that by this logic no agreement between two people could ever be shown to mean one determinate thing rather than another, which is absurd. Lena had no good answer to that, and neither did I. Please go through the exchange move by move, including move 5, saying who has the better of it and why, and note anything important you think both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Scenario:** Two friends (Lena and Marcus) run a design studio. They have a standing rule: "5% of the invoice" referral bonus for freelancers.
      *   **Conflict:** A \$200,000 invoice arrives. 5% = \$10,000. Marcus says pay \$10k. Lena says the rule is ambiguous (could be capped) because past cases (all <\$10k) don't distinguish between "5% flat" and "5% up to a cap."
      *   **Dialogue Moves:**
          1.  Marcus: It's obvious, 5% means 5%.
          2.  Lena: Underdetermination problem (past cases fit multiple rules).
          3.  Marcus: Introspection fixes it (I meant 5% no matter what).
          4.  Lena: Introspection is also interpretable/dispositional (Wittgensteinian skepticism).
          5.  Marcus: Reductio ad absurdum (if this logic holds, no agreement ever means anything determinate). Lena (and the narrator) are stumped.
      *   **Task:** Go through moves 1-5, evaluate who has the better of it at each step, explain why, and identify what both are missing.

  2.  **Deconstruct the Philosophical Core:**
      *   This is a classic philosophical problem known as the **Rule-Following Paradox**, most famously associated with **Ludwig Wittgenstein** (specifically *Philosophical Investigations* §§185-242) and later **Saul Kripke** (*Wittgenstein on Rules and Private Language*).
      *   *The Paradox:* No finite set of past actions/instances can logically determine a unique rule for future application. (Quus vs. Plus).
      *   *Marcus's Position:* Realism/Intentionalism. Meaning is fixed by intention or the literal semantic content.
      *   *Lena's Position:* Skepticism. Meaning is underdetermined by past use and private mental states.
      *   *Move 5:* Marcus appeals to pragmatic absurdity. If skepticism is true, communication is impossible.

  3.  **Step-by-Step Analysis:**

      *   **Move 1 (Marcus):** "It's obvious... that's just what 5% means."
          *   *Analysis:* This is the naive realist view. In normal contexts, he's right. Language works. But logically, he's begging the question against the skeptical challenge.
          *   *Verdict:* Pragmatically strong, logically weak against the specific skeptical argument Lena is about to make.

      *   **Move 2 (Lena):** "Every past payout is equally consistent with a rule that charges 5% up to some cap..."
          *   *Analysis:* This is the core of the underdetermination argument (Hume/Wittgenstein/Kripke). Logically, she is correct. Finite data points cannot prove an infinite function.
          *   *Verdict:* Logically stronger. She identifies the gap between past practice and future application.

      *   **Move 3 (Marcus):** "I can settle it by introspection... I've always privately had '5%, no matter how large' in mind."
          *   *Analysis:* This is the "Private Ostensive Definition" or "Mental State" defense. Wittgenstein/Kripke specifically target this. How do you know your mental state meant *plus* and not *quus*?
          *   *Verdict:* Lena is poised to win this one based on standard philosophical critiques of private language.

      *   **Move 4 (Lena):** "Whatever he had 'in mind' is just as open to two readings... if the number had been outlandish enough he might well have balked..."
          *   *Analysis:* This is the Kripkensteinian skeptic's reply. Mental images/intentions are also subject to interpretation. Dispositions (what he *would* have done) don't establish normativity (what he *should* do).
          *   *Verdict:* Philosophically robust. She successfully counters the introspection argument.

      *   **Move 5 (Marcus):** "By this logic no agreement... could ever be shown to mean one determinate thing... which is absurd."
          *   *Analysis:* This is the *reductio ad absurdum*. If skepticism wins, society collapses. This forces a shift from "logical certainty" to "pragmatic necessity."
          *   *Verdict:* This is the turning point. Lena wins the logical battle, but Marcus wins the pragmatic war. However, Marcus thinks this *refutes* Lena, whereas it actually just shows the limits of the skeptical game.

  4.  **Identifying What They Are Missing:**
      *   **The Community View (Wittgenstein):** Meaning isn't just in the head (Marcus) nor is it purely skeptical (Lena). Meaning is established by *public practice* and *community agreement*. The "form of life" dictates that "5%" means 5% unless specified otherwise.
      *   **Normativity vs. Description:** The dispute is about what they *ought* to pay, not just what they *did* pay.
      *   **Charitable Interpretation:** In contract law and friendship, we interpret ambiguity based on reasonable expectations and context, not logical possibility.
      *   **The "Stop" Point:** Skepticism is a philosophical tool, not a practical guide. You have to stop somewhere to act.

  5.  **Drafting the Response:**
      *   *Structure:* Introduction (identifying the philosophical framework), Move-by-Move Analysis (1-5), Synthesis (What's missing), Conclusion.
      *   *Tone:* Analytical, fair, philosophical but accessible.
      *   *Key References:* Wittgenstein, Kripke, Rule-Following Paradox, Quus/Plus.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Lena is right because Wittgenstein." I need to evaluate *who has the better of it* in the context of the argument.
      *   Move 1: Marcus (Pragmatically).
      *   Move 2: Lena (Logically).
      *   Move 3: Lena (Philosophically).
      *   Move 4: Lena (Consistently).
      *   Move 5: Marcus (Pragmatically/Existentially), but he misunderstands *why* it's not absurd.
      *   *Crucial Nuance:* Move 5 is where the philosophical rubber meets the road. Marcus feels the force of skepticism but rejects the conclusion. He's right to reject the conclusion for practical life, but wrong to think it refutes Lena's logical point. The synthesis is needed here.

  6.  **Refining the "What They Miss" Section:**
      *   They are treating meaning as either *internal* (Marcus) or *logically unconstrained* (Lena).
      *   They miss the *social/normative* aspect. The meaning is fixed by the *practice* of the business community and the *reasonable expectations* of the parties.
      *   They miss the distinction between *metaphysical certainty* and *practical certainty*.

  7.  **Final Review:** Does this answer the prompt fully?
      *   Go through move by move? Yes.
