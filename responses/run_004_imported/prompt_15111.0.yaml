      *   **Task:** Rank four specific responses by how well they *actually defuse the multiple realizability threat* (effectiveness at saving reductionism), not by popularity.
      *   **Responses to Rank:**
          1.  Kim's "functionalization" move (local reduction).
          2.  Bechtel & Mundale's "grain matching" argument.
          3.  Shapiro's "causally relevant properties" argument.
