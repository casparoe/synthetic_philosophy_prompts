          *   Crucially, there is no "embedding space" (like the plane for the chords) that dictates the measure. The parameters ($L, A, V$) are logically equivalent descriptions of the *same* object, not different projections of a higher-dimensional physical process.
      *   *The Disanalogy:* Bertrand's problem can be embedded in a physical context (straws on a floor) that breaks the symmetry between parametrizations. The Cube Factory is purely about the description of a state. There is no "physical process" specified that privileges length over area.
