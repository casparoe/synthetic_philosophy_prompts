  2.  **Part 1: The Intuitive Appeal of the Three Methods:**
      *   *Goal:* Move beyond "math says they differ." Explain the *conceptual* justification for each.
      *   *Method 1: Random Endpoints.* Why does it feel uniform? We pick two points on the circumference. The circumference is a 1D manifold with a natural measure (arc length). If we have no reason to prefer one spot over another, uniform distribution over angle/arc length is the default. It feels like "throwing darts at the rim."
      *   *Method 2: Random Radius (Jaynes's choice).* Why does it feel uniform? We fix a direction (rotation invariance) and pick a distance from the center along a radius. The radius is a line segment. Uniform distribution over the length of the radius feels natural. It feels like "sweeping a line across the circle."
      *   *Method 3: Random Midpoint.* Why does it feel uniform? Every chord is uniquely defined by its midpoint (inside the circle). The set of midpoints is the disk area. Uniform distribution over the *area* of the disk feels like the most "spatial" interpretation of "random." It feels like "throwing darts at the face."
      *   *Key Insight:* Each method identifies a different *sample space* that carries a natural geometric measure (arc length, linear distance, area). The ambiguity lies in which geometric feature defines the "randomness."

  3.  **Part 2: Jaynes's Invariance Solution:**
      *   *Goal:* Explain the "Principle of Transformation Groups."
