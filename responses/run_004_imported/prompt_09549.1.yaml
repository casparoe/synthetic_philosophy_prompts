          *   Jaynes shows that only the measure $dp \, d\theta$ (which corresponds to the Random Radius/Method 2) is invariant under translation of the circle relative to the "field of chords."
          *   *Wait, check details:* Method 2 is "Random Radius." This implies uniform distribution of the perpendicular distance from the center ($p$). The density is $f(p) = 1/R$.
          *   Method 1 (Endpoints): Density depends on $\sin(\alpha)$. Not translation invariant.
          *   Method 3 (Midpoints): Uniform over area implies density proportional to $p$. Not translation invariant.
          *   *Why Translation Matters:* If the circle is a small target on a large floor where straws are thrown randomly, shifting the target shouldn't change the probability of a hit *given* a hit. The "field of straws" must be invariant. The unique measure on lines in a plane invariant under rigid motions is $dp \, d\theta$.
      *   *Conclusion:* Jaynes selects Method 2 because it's the only one derived from the unique invariant measure on the space of lines in a plane.

  4.  **Part 3: Van Fraassen's Cube Factory:**
      *   *Goal:* Test Jaynes's strategy against a different PoI failure.
      *   *The Problem:* A factory produces cubes with side length $L \in [0, 2]$. What is $P(L \le 1)$?
