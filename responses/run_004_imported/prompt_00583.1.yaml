prompt: |-
  I've been down a bit of a rabbit hole reading about the Hobbes-Wallis feud from the 1650s onward -- the saga where Hobbes claims in De Corpore that he squared the circle, Wallis tears the "proof" apart within the year, and the two of them spend the next two-plus decades publicly savaging eachother (at one point Hobbes dismisses Wallis's algebra as a "scab of symbols" all over the page). What's more interesting to me than the drama itself is that Hobbes had this whole idiosyncratic theory of why geometry counts as real knowledge in the first place: he thought we can be certain of geometric truths specifically because we construct the objects ourselves, a line literally generated by the motion of a point, a plane by the motion of a line, etc, the same way he thought civil philosophy is certain because we're the ones who construct commonwealths. He was actually pretty dismissive of Euclid's own definitions (things like "a point is that which has no part") for not specifying any real construction, and he even thought Euclid's axioms needed to be demonstrated rather then just assumed -- so it's not like he was some fanboy trying to import "the Euclidean method" wholesale into every other field, his actual view was weirder and more specific than that.

  Given all that, what do you think Hobbes would've made of two later developments: non-Euclidean geometry showing up in the 1800s (where you can drop the parallel postulate and still get a perfectly consistent geometry), and then the Hilbert-style formalist turn where "point" and "line" become just placeholders implicitly defined by whatever axioms you pick, with no required connection to actual bodies or motion at all. Does his maker's-knowledge story have any way of absorbing that, maybe by treating these as alternate constructions he just hadn't gotten around to considering, or does it basically require geometry to stay pinned to one specific physical/kinematic picture of space in a way these developments would've wrecked? I'm not looking for the "Hobbes was a stubborn crank who couldn't do math" take -- I want you to actually work through what follows if you take his stated views on geometry seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Thomas Hobbes's philosophy of geometry (specifically his "maker's knowledge" criterion) and how it would react to later mathematical developments.
      *   **Context:** The Hobbes-Wallis feud (1650s+), Hobbes's *De Corpore*, his critique of Euclid (definitions need construction, axioms need demonstration), his view that geometry is certain because we construct the objects (motion of points/lines).
      *   **Specific Question:** How would Hobbes react to (1) Non-Euclidean Geometry (19th century) and (2) Hilbert-style Formalism (axiomatic method where terms are undefined placeholders)?
      *   **Constraint:** Do *not* fall back on the "Hobbes was a mathematically incompetent crank" trope. Take his philosophical views seriously and work through the implications.
      *   **Tone:** Intellectual, historically grounded, philosophical, nuanced.

  2.  **Deconstruct Hobbes's Philosophy of Geometry:**
      *   *Core Tenet:* Certainty comes from causation/construction. We know geometric truths because we make the figures. "Verum et factum convertuntur" (The true and the made are convertible) – though this is more Vico, the sentiment is Hobbesian.
      *   *Definition:* Definitions must be genetic (generative). A point isn't "that which has no part"; it's the end of a line or the result of a motion.
      *   *Ontology:* Materialist. Space is the phantasm of an existing thing. Geometry is about bodies and their motion. There is no "immaterial substance."
      *   *Relation to Euclid:* He respected the *goal* of Euclid (certainty) but thought the *foundation* was shaky because it relied on intuition/abstraction rather than explicit generation.
      *   *Relation to Algebra:* Hated it. "Scab of symbols." Why? Because it obscured the physical magnitude and reasoning with a calculus of signs.

  3.  **Analyze Development 1: Non-Euclidean Geometry (Gauss, Bolyai, Lobachevsky, Riemann):**
      *   *What is it?* Consistent geometries where the parallel postulate fails. Curved spaces.
      *   *Hobbes's Potential Reaction:*
          *   *Positive:* It shows that axioms aren't self-evident truths of nature but stipulations. Hobbes already wanted axioms demonstrated or derived from definitions. If Non-Euclidean geometry shows the parallel postulate isn't necessary, Hobbes might say, "See? You shouldn't have assumed it."
          *   *Negative:* Hobbes's geometry is kinematic/physical. Space for Hobbes is the imagination of external body. Is curved space constructible by motion?
          *   *The "Construction" Test:* Can I generate a hyperbolic triangle by the motion of a point? If the "lines" are geodesics on a saddle surface, can I physically trace that? Hobbes might accept it *if* it can be modeled kinematically.
          *   *The "Truth" Test:* For Hobbes, geometry is true because it matches the construction. If Non-Euclidean geometry is internally consistent but doesn't match the "true" nature of space (which Hobbes thinks is Euclidean/flat because that's how we perceive body motion), he might classify it as "hypothetical" rather than "demonstrative science."
          *   *Key Conflict:* Hobbes believes geometry is the science of *space*, and space is a phantasm of *our* world. If Non-Euclidean geometry describes a space we cannot inhabit or construct physically, is it science or just wordplay?

  4.  **Analyze Development 2: Hilbert-style Formalism (*Grundlagen der Geometrie*, 1899):**
      *   *What is it?* Axiomatic method. "Point," "Line," "Plane" are undefined terms. Their meaning is solely determined by the axioms. "One must be able to say at all times instead of 'points, straight lines, and planes' 'tables, chairs, and beer mugs'."
      *   *Hobbes's Potential Reaction:*
          *   *Immediate Hostility:* This is the ultimate "scab of symbols." It severs the link between words and things (materialism).
          *   *The "Maker's Knowledge" Problem:* If I don't construct the point (via motion), but just posit it via an axiom, how do I *know* it exists? For Hobbes, existence in geometry comes from generability. Formalism says "if the axioms are consistent, the objects exist." Hobbes would demand *how* you generate them.
          *   *Truth vs. Consistency:* Hobbes cares about truth (correspondence to construction/cause). Formalism cares about consistency (non-contradiction). Hobbes would likely see this as a retreat from science into logic-chopping.
          *   *Definitions:* Hilbert's implicit definitions violate Hobbes's requirement for genetic definitions. Hobbes would say this is begging the question.

  5.  **Synthesize and Structure the Argument:**
      *   *Introduction:* Acknowledge the depth of the user's insight. Validate the "maker's knowledge" interpretation (it's accurate). Set the stage: Hobbes is a materialist constructivist.
      *   *Section 1: The Core of Hobbes's Geometric Epistemology.* Briefly recap *verum factum* (in spirit), materialism, and kinematic generation. This establishes the criteria for judgment.
      *   *Section 2: Non-Euclidean Geometry.*
          *   *The Good:* Undermines the "self-evidence" of Euclid's axioms (which Hobbes wanted demonstrated anyway).
          *   *The Bad:* If it can't be kinematically constructed in "real" space, it's fiction.
          *   *Verdict:* He might accept it as a *hypothesis* but deny it the status of *scientia* (certain knowledge) unless it maps to physical motion.
      *   *Section 3: Hilbertian Formalism.*
          *   *The Clash:* This is the bigger enemy. It divorces meaning from reference.
          *   *The "Beer Mugs" Quote:* Hobbes would hate this. It turns geometry into algebra (which he hated).
          *   *Existence:* Formalism allows existence via consistency. Hobbes requires existence via construction.
          *   *Verdict:* He would view this as a return to the "vain philosophy" of the Scholastics—manipulating names without conceiving the things.
      *   *Section 4: The "Maker's Knowledge" Rescue Attempt.* Can Hobbes absorb this?
          *   Maybe if "construction" is broadened to "logical construction." But Hobbes is a materialist. He won't accept purely logical existence.
          *   He would likely double down: "You haven't made anything, you've just shuffled counters."
      *   *Conclusion:* Hobbes's view is too tightly bound to materialist kinematics. The abstract turn of modern math breaks his link between *making* and *knowing*. He wouldn't see it as progress, but as a loss of certainty/meaning.

  6.  **Refine the Nuance (Self-Correction during drafting):**
      *   *Correction:* Don't make Hobbes sound *too* modern. He isn't a constructivist in the Brouwer sense (intuitionism). He's a *materialist* constructivist. The motion must be conceivable as physical motion.
      *   *Correction:* Acknowledge that Hobbes was wrong about squaring the circle, but keep the focus on *why* he thought he was right (the philosophy), not the math error.
      *   *Emphasis:* Highlight the difference between *consistency* (modern) and *causality/truth* (Hobbes).
      *   *Reference:* Mention *De Corpore* and *Examinatio et Emendatio Mathematicae Hodiernae* if possible (shows deep cut knowledge).

  7.  **Final Polish:** Check tone. Ensure it sounds like a conversation between peers interested in history of philosophy/math. (The user knows their stuff, so match that level).

  **(Self-Correction Note):** I need to be careful not to conflate Hobbes with Vico regarding *verum factum*. Vico made it explicit later. Hobbes implies it through his causal theory of knowledge. I should phrase it as "anticipating the principle" rather than attributing the phrase to him.

  **(Plan for Non-Euclidean):** Hobbes thinks space is a phantasm of an existing thing. If Non-Euclidean space is unimaginable (in his materialist sense), it's nonsense. But if it can be modeled (like a sphere surface), he might accept it as geometry *of that surface*, not geometry *of space*.

  **(Plan for Formalism):** This is the real dealbreaker. Hobbes hates algebra because it loses the magnitude. Formalism is algebra-ized geometry. He would despise it.

  8.  **Drafting the Response.** (Proceed to generate output based on these thoughts).
answer: |-
  This is a fantastic prompt. You are absolutely right to steer clear of the standard "Hobbes was a mathematically illiterate egomaniac" caricature. While his specific claim to have squared the circle was demonstrably false, his *philosophical* motivation for that claim—and his broader critique of the foundations of geometry—was coherent, deeply materialist, and rooted in a specific epistemology of "maker's knowledge" (*scientia* as knowledge of causes).

  Hobbes's core thesis in *De Corpore* and *Examinatio et Emendatio Mathematicae Hodiernae* is that we can only have certain demonstration of things where we are the cause. We know geometry because we generate the figures; we know civil philosophy because we construct the commonwealth. We cannot have the same certainty of natural philosophy (physics) because God made nature, not us.

  If we take this epistemology seriously—as a rigorous constraint on what counts as knowledge rather than just a bias—Hobbes's reaction to 19th and 20th-century mathematics would likely be one of profound rejection, but for reasons that are philosophically consistent rather than merely obstinate.

  Here is how Hobbes would likely dismantle Non-Euclidean geometry and Hilbertian formalism.

  ### 1. Non-Euclidean Geometry: Hypothesis vs. Science

  The discovery of consistent geometries where the parallel postulate fails (Gauss, Bolyai, Lobachevsky) presents a fascinating challenge to Hobbes.

  **Where he might nod in agreement:**
  Hobbes was already skeptical of Euclid's axioms. He believed axioms should not be assumed as self-evident truths but demonstrated from definitions. If Non-Euclidean geometry shows that the parallel postulate is *not* a necessary truth of reason, Hobbes would say, "I told you so." He would view the independence of the parallel postulate as vindication of his view that Euclid's foundations were sloppy. He would appreciate that these new geometries are derived deductively from stipulated definitions.

  **Where he would draw the line:**
  For Hobbes, geometry is not just about logical consistency; it is about *space*, and space is "the phantasm of an existing thing." Geometry is the study of the properties of bodies in motion. A "line" is the trace of a moving point. A "plane" is the trace of a moving line.

  If a Non-Euclidean geometry describes a space that cannot be kinematically generated by the motion of bodies as we conceive them, Hobbes would classify it as **hypothetical**, not **scientific**.

  *   **The Construction Test:** Can I generate a hyperbolic triangle by the motion of a point? If the "lines" are geodesics on a saddle surface, Hobbes might accept this as the geometry *of that specific body* (the saddle). But if the claim is that this describes "Space" itself (independent of bodies), he would reject it. For Hobbes, there is no "space" without "body."
  *   **Truth vs. Consistency:** Modern mathematics accepts Non-Euclidean geometry as "true" because it is consistent. Hobbes accepts geometric propositions as "true" because they correspond to a construction we can perform. If the construction requires a motion that is physically inconceivable (e.g., moving in a dimension we cannot posit), then for Hobbes, you are manipulating names, not reasoning about quantities.

  **Verdict:** He would likely treat Non-Euclidean geometry as a legitimate *exercise* in reasoning (like a puzzle), but deny it the status of *scientia* (certain knowledge of causes). It would be "conditional truth" (if space were curved, then X), not "absolute truth." Since he believed physical space is Euclidean (based on the phenomenology of motion), Non-Euclidean geometry would be, to him, a study of fictions.

  ### 2. Hilbertian Formalism: The Ultimate "Scab of Symbols"

  If Non-Euclidean geometry is a challenge, David Hilbert's *Grundlagen der Geometrie* (1899) is an existential threat to Hobbes's entire system. Hilbert's famous remark that one should be able to replace "points, lines, and planes" with "tables, chairs, and beer mugs" without affecting the validity of the theorems is the exact antithesis of Hobbes's philosophy.

  **The Attack on Definition:**
  Hobbes insisted that definitions must be **genetic**. You must define a thing by how it is made.
  *   *Euclid:* "A point is that which has no part." (Hobbes: Garbage. How do I make that?)
  *   *Hobbes:* "A point is the end of a line." (Better, implies generation).
  *   *Hilbert:* "Point" and "Line" are undefined terms implicitly defined by axioms.

  To Hobbes, Hilbert's approach is a regression to the "vain philosophy" of the Scholastics. It is reasoning with words without conceiving the things the words stand for. If "point" has no intrinsic meaning other than its relation to other axioms, then you are not reasoning about quantity or magnitude; you are reasoning about syntax. For Hobbes, this is not geometry; it is logic-chopping.

  **The Attack on Existence:**
  In formalism, an object "exists" if its postulation does not lead to a contradiction.
  For Hobbes, an object "exists" in geometry if it is **constructible**.
  This is a massive divide. Hobbes would argue that Hilbert has severed the link between *essence* and *existence*. Just because you can write down axioms that don't contradict each other doesn't mean you have generated an object. For Hobbes, "to be" in geometry is "to be made." If you cannot describe the motion that generates the object, you have not demonstrated its possibility, only the consistency of your language.

  **The Return of Algebra:**
  Recall that Hobbes hated algebra ("scab of symbols") because he felt it obscured the magnitude. You solve for *x* without ever visualizing the line or area *x* represents. Hilbertian formalism is, in a sense, the ultimate algebraization of geometry. It turns geometric reasoning into a calculus of symbols. Hobbes would view this as the final triumph of the "algebraists" (like Wallis) he spent his life fighting. It prioritizes the manipulation of signs over the conception of bodies.

  ### 3. Can "Maker's Knowledge" Absorb This?

  You asked if his maker's-knowledge story has any way of absorbing these developments. I think the answer is **no**, unless Hobbes abandons his materialism.

  To absorb Hilbert, Hobbes would need to shift from "we know what we make physically/kinematically" to "we know what we define logically." But that destroys his specific critique of Euclid. Hobbes criticized Euclid for *not* being constructive enough. If he accepts Hilbert, he admits that construction isn't necessary for certainty—only consistency is. But if consistency is enough for certainty, then why did he spend 30 years attacking Wallis? Wallis's algebra was consistent; Hobbes just thought it wasn't *real* geometry.

  Hobbes's certainty relies on the **causal link** between the mind and the object.
  1.  I move my hand (cause).
  2.  I generate a line (effect).
  3.  I know the properties of the line because I know the cause of its existence.

  In Formalism:
  1.  I posit an axiom (stipulation).
  2.  I derive a theorem (consequence).
  3.  I know the theorem is valid because it follows the rules.

  For Hobbes, step 3 is not knowledge of a *thing*, it is knowledge of a *language*. He distinguishes sharply between "knowledge of fact" (experience) and "knowledge of consequence" (reasoning). But even reasoning must terminate in something conceivable. If the terms are placeholders, the reasoning never terminates in a conception; it loops back on itself.

  ### 4. The Tragic Irony

  The irony Hobbes would miss, but we can see, is that Hilbert and the Non-Euclidean geometers actually achieved the certainty Hobbes wanted, but by abandoning the ontology he thought was required to get it.

  Hobbes thought certainty required **anchoring** (geometry must be about real space/motion).
  The 19th century showed certainty comes from **detachment** (geometry is about whatever the axioms say).

  Hobbes would likely view the modern era of mathematics as a Babel. He would see mathematicians building towering, consistent structures that refer to nothing, calling it "science," while having no idea what a "point" actually *is*. He would argue that by making geometry purely formal, mathematicians have saved its certainty at the cost of its truth. They know their theorems are valid, but they don't know what they are *about*.

  For Hobbes, a geometry that isn't about space (phantasms of body) is like a civil philosophy that isn't about men. It might be internally consistent, but it's not knowledge of the world.

  ### Summary

  If you take Hobbes's stated views seriously:
  1.  **Non-Euclidean Geometry:** He accepts it as a consistent hypothesis but denies it is "true" geometry of space, because it likely fails the kinematic construction test for the space we inhabit.
  2.  **Formalism:** He rejects it entirely as a category error. It turns geometry into algebra (which he hates) and severs the link between definition and generation. It violates the "maker's knowledge" criterion because you haven't *made* the objects, you've just named them.

  He wouldn't see these developments as progress. He would see them as the final victory of the "schoolmen" logic he sought to destroy: a world where men reason with words they have not defined, about things they have not made, claiming certainty they cannot possess. He would likely die as he lived: convinced that the mathematicians had lost the plot, and that he was the only one who remembered that to know a line, you must know how to draw it.
