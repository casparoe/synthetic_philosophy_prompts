answer: |-
  **Title:** The No-Touch Window

  The silence in Bay Four wasn't empty; it was heavy, pressurized by the expectation of what came next. I stood in the corner, near the crash cart that was currently useless, my back against the cool tile. I am an Organ Procurement Coordinator. My job is logistics, timing, and the delicate art of ensuring that biology aligns with bureaucracy.

  At the head of the bed, the intensivist had just withdrawn the endotracheal tube. The ventilator, which had been breathing for Mr. Garris for three days, was powered down. The rhythmic *hiss-click* was gone. Now, there was only the sporadic, weakening electrical struggle on the monitor.

  I watched the waveform. Tachycardic, then bradycardic. Then, a flat, green line. Asystole.

  "Time of circulatory arrest?" the surgeon asked. He was already scrubbed in, standing behind the sterile drape, gloves glistening under the OR lights. He wasn't looking at the patient; he was looking at his watch.

  "14:02," I said. My voice sounded too loud in the room.

  This was the window. The DCD protocol—the Donation after Circulatory Death—requires a waiting period. In this hospital, it was five minutes. Five minutes of continuous asystole before death can be declared and the incision made.

  I started the timer on my phone.

  The room froze. The nurses stopped charting. The respiratory therapist stepped back. We were all holding our breath, collectively suspended in a liminal space where the definition of life was being negotiated by a clock.

  I looked at Mr. Garris. His chest was still. His skin was already taking on the waxy pallor of the departed. But I knew the physiology. I knew that in these first sixty seconds, the heart was not *irreversibly* stopped. It was merely *permanently* stopped.

  That is the sleight of hand we perform. *Irreversible* means it cannot restart, no matter what we do. *Permanent* means it will not restart because we have agreed not to touch it.

  If I wanted to, right now, at minute one, I could shout "Code Blue." I could grab the paddles. I could shock the myocardium, push epinephrine, and likely bring Mr. Garris back. The cells weren't dead yet. The brainstem hadn't fully succumbed to ischemia. The biology of life was still clinging to the edges of the tissue, waiting for a spark.

  But the protocol forbids the spark.

  "Two minutes," the intensivist murmured.

  The surgeon shifted his weight. I saw the tension in his shoulders. Warm ischemia time—the time organs are without oxygen but still in the body—was ticking away. Every second I counted degraded the kidneys, the liver, the heart valves. We were racing against decay, but we had to let the decay begin to certify the death. It was a paradox wrapped in sterile drapes.

  I thought about the language we use in the consent forms. *Cessation of circulatory and respiratory function.* It sounds absolute. It sounds like a door slamming shut. But it's not a door; it's a gate we are choosing not to open. We are defining death not by the impossibility of return, but by the decision to forbear intervention.

  "Four minutes," I said.

  The monitor remained flat. The green line was a horizon.

  I wondered if Mr. Garris knew the difference. I wondered if the ethics committee slept better knowing that we waited three hundred seconds instead of two hundred and ninety. The wait isn't calibrated to when resuscitation becomes impossible; it's calibrated to when auto-resuscitation (the Lazarus phenomenon) becomes statistically unlikely. We aren't waiting for him to die. We are waiting to be sure he won't wake up on his own.

  There is a violence in that distinction. We are creating a state of permanence to satisfy a legal requirement for a biological event that is still, technically, reversible.

  "Five minutes."

  I stopped the timer. I looked at the surgeon. I looked at the intensivist.

  "I declare death," the intensivist said. His voice was flat, final. "Time of death, 14:07."

  The spell broke. The surgeon moved forward immediately. The nurses adjusted the lights. The hum of the room returned, sharper now, urgent. The body on the table shifted from *patient* to *donor* in the space of a heartbeat.

  I stepped back to make room for the incision. I put my phone in my pocket. The timer was reset to zero, ready for the next one. I watched the scalpel touch the skin, and I thought about the five minutes we just burned. We didn't wait for life to leave. We just waited long enough to make sure we were allowed to say it was gone.
