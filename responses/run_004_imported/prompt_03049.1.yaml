answer: |-
  There is a significant bibliographic difficulty with the premise of your question that must be addressed before engaging with the philosophical analysis. **David Lewis (the modal realist metaphysician, 1941–2001) did not publish a paper titled "Do We Believe in Penal Substitution?" in 1997, nor is there record of him advancing this specific argument in his known corpus.**

  Lewis's later work (collected in *Papers in Ethics and Social Philosophy*, 2000) deals with convention, decision theory, and some normative ethics, but he did not write on penal substitution or the specific intuition pump regarding fines versus prison time you described. This argument is more characteristic of contemporary legal philosophy (e.g., discussions by R.A. Duff or Victor Tadros) or analytic theology, and it is possible the prompt conflates David Lewis with another scholar or constructs a hypothetical scenario.

  However, the philosophical argument you have outlined is coherent and compelling on its own merits. If we treat the position described in your prompt as a **"Lewis-style" framework** (systematizing folk intuitions about punishment, rejecting pragmatic explanations in favor of principled distinctions), we can apply those tools to the phenomenon of online crowdfunding for fines.

  Here is an analysis of how a philosopher holding the views you attributed to Lewis would likely judge the practice of public, adversarial fine crowdfunding.

  ### 1. The Principled Distinction: Suffering vs. Burden
  The core of the "Lewis" argument you presented is that we accept fine-substitution but reject prison-substitution because we perceive a principled difference, not merely a practical one. Prison and execution involve **personal suffering** or the loss of **personal time/agency**, which cannot be transferred without nullifying the punitive experience. A fine, conversely, is viewed as a **pecuniary burden**.

  *   **Application to Crowdfunding:** Crowdfunding relies entirely on the "fine exception." If the punishment were prison, a "crowdfunded prison term" (where strangers take turns sitting in the cell) would be immediately recognized as absurd, reinforcing Lewis's intuition that some punishments are inherently non-transferable.
  *   **The Verdict:** Lewis would likely argue that crowdfunding confirms his diagnosis: we only tolerate substitution when the punishment is reducible to a transferable resource (money). The fact that crowdfunding works for fines but not for jail time validates the distinction he drew.

  ### 2. The Expressive Function of Punishment
  Lewis's framework (as described in your prompt) lists "expressive condemnation" as a goal of punishment. In his actual philosophical work, Lewis was deeply interested in **conventions** and **social meanings**. He understood many social facts as resting on shared understandings.

  *   **Private vs. Public Substitution:** Lewis rejected the idea that we tolerate fine-substitution merely because it is hard to police. He argued we tolerate it because we don't see it as undermining the punishment's purpose *in private cases*.
  *   **The Crowdfunding Shift:** When a friend quietly pays a fine, the social condemnation remains focused on the offender; the payment is a private mercy. When thousands of strangers crowdfund a fine **publicly as a protest**, the social meaning shifts. The fine is no longer a mark of condemnation; it becomes a **badge of honor** or a **membership fee** for a cause.
  *   **The Verdict:** Lewis would likely argue that public, adversarial crowdfunding **breaks the expressive function** of the fine. If punishment is a convention of condemnation, and the community (or a vocal subset) reframes the payment as solidarity, the convention is disrupted. The fine ceases to function *as punishment* and becomes a **price** for breaking the law (a distinction often associated with Ullmann-Margalit, but compatible with Lewis's conventionalism). Lewis might judge this not as "substitution" anymore, but as a **failure of the punishment to secure its normative uptake**.

  ### 3. Deterrence and the "Price" of Lawbreaking
  Lewis was a rationalist about decision theory. He would analyze the incentives.

  *   **The Deterrence Calculation:** If fines are meant to deter, they must impose a cost on the offender. If the cost is reliably externalized via crowdfunding, the deterrent effect is neutralized.
  *   **The "Impracticality" Revisited:** Lewis argued we don't list the substitutability of fines as a drawback because we implicitly accept it. However, crowdfunding makes the substitutability **efficient and scalable**.
  *   **The Verdict:** Lewis might argue that while we *tolerate* de facto substitution in private cases (perhaps assuming the offender still feels the social debt), organized crowdfunding removes even the *residual* burden. He might judge this as transforming the legal system from a system of **penalties** into a system of **licensing fees**. If the law says "Do not X, or pay $500," and a fund exists to pay the $500 for you, the law effectively says "You may X for $500." Lewis, who cared about the logical structure of our systems, might find this logically permissible but socially destabilizing if the intent was prohibition rather than pricing.

  ### 4. The Adversarial Element: Challenging the Convention
  The prompt notes that crowdfunding is often a "gesture of solidarity or protest against the law."

  *   **Lewis's Conventionalism:** In his actual work (e.g., *Convention*), Lewis argued that many social structures exist because we coordinate on them. Punishment is a social practice.
  *   **The Conflict:** If the crowdfund is adversarial, it is an attempt to **rewrite the convention**. It is a signal that a segment of the population does not accept the expressive condemnation inherent in the fine.
  *   **The Verdict:** Lewis would likely view this not as a metaphysical puzzle about substitution, but as a **clash of conventions**. The state intends condemnation; the crowd intends vindication. In this light, the "substitution" is secondary to the **semiotic war**. Lewis might argue that in these cases, the fine has failed to punish *regardless* of who pays it, because the normative consensus required for punishment to "work" is absent.

  ### Conclusion: Would Lewis Change His Analysis?
  If we apply the tools attributed to him in your prompt:

  1.  **Is it just "de facto substitution"?** No. Lewis would likely argue that the **public and adversarial nature** changes the category. Private substitution preserves the *condemnation* while relieving the *burden*. Public, protest-based substitution actively **inverts the condemnation**.
  2.  **Does it validate his rejection of the "impracticality" explanation?** Yes. If impracticality were the only reason we banned substitution, we would ban crowdfunding once technology made it easy. Instead, the debate shifts to whether it is *just* or *right*. This confirms Lewis's view that our hesitation is principled, not pragmatic.
  3.  **Final Judgment:** Lewis would likely conclude that while private fine-payment is a tolerated anomaly within the practice of punishment, **adversarial crowdfunding is an attack on the practice itself.** It does not fit neatly into his "ambivalence" category; rather, it exposes the fragility of fines as a form of condemnation. He might argue that when fines become crowdfundable protests, they reveal that fines were never about "suffering" (like prison) but about "cost," and thus are uniquely vulnerable to being redefined as mere prices.

  ***

  **Summary Note:** While this analysis engages deeply with the argument provided, please be aware that attributing this specific paper to David Lewis is bibliographically inaccurate. The analysis above treats the *argument* as the object of study, applying the logical rigor Lewis was known for, rather than claiming he actually held these specific views on penal substitution.
