  Quick one from procrastinating on my actual dissertation chapter (classics, ancient philosophy of death/consolation lit). I've been re-reading the closing stretch of Cicero's De Senectute, the part where Cato basically free-associates his way through every argument he can find for the soul's immortality before wrapping up the dialogue. What's kind of funny is that it's not really one argument, it's like 8 different, not obviously compatible ones stacked on top of each other — some lifted straight from Plato, a couple attributed to Cyrus via Xenophon, and a couple that are just Cato own gut feelings dressed up as philosophy. I want to rank them by how much actual argumentative work they do (i.e. how much they'd still carry weight for someone who doesn't already buy into Platonic psychology), not by how rhetorically satisfying they are. Here's the lineup:

  - the soul's powers (memory, quick uptake of new skills, foresight) are too impressive to belong to something merely mortal
  - the soul is self-moving, and a self-mover can never stop moving, so it can never stop existing
  - the soul is simple/has no parts, and only composite things can come apart, so it can't perish
  - kids pick up hard material so fast it must be "recollection" of stuff the soul already knew before birth
