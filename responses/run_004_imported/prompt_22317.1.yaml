      *(Self-Correction on Earman)*: Earman argues that if laws are regularities, a miracle is just a rare event. If it's a rare event, experience isn't "uniform" against it, just "mostly" against it. Therefore, the "full proof" claim collapses. I need to make sure I address this specific probabilistic point. Hume claims *uniform* experience. If a miracle happens, experience wasn't uniform. So how can we claim uniform experience *before* knowing if the miracle happened? This is the circularity.
