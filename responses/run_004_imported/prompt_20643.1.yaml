answer: |-
  You have correctly identified the source of the confusion: both models import the language of political economy to solve moral problems, but they operate on fundamentally different ontologies. One is a mechanism for cooperation between distinct agents; the other is a heuristic for coherence within a single agent.

  Here is the breakdown of the mechanics, followed by the verdict you asked for.

  ### The Mechanics of the Trade

  **1. Toby Ord's Moral Trade (Interpersonal)**
  *   **The Agents:** Two or more distinct human beings with conflicting moral values (e.g., a utilitarian and a deontologist, or two people with different cause priorities).
  *   **What is Traded:** *Behavioral compliance.* I agree to perform an action that scores high on your moral metric but low on mine, in exchange for you performing an action that scores high on mine but low on yours.
  *   **The Economic Analogy:** This is classical Ricardian comparative advantage applied to ethics. Just as two nations trade goods they produce efficiently for goods they produce inefficiently, moral agents "produce" moral value in domains where they are less sensitive to secure value in domains where they are more sensitive.
  *   **Where it Holds:** It creates a Pareto improvement. Both agents increase the expected moral value of the world *according to their own lights* without changing their minds.
  *   **Where it Strains:** Economic trade assumes fungibility (money). Moral trade assumes that moral constraints are fungible enough to be violated temporarily. It requires a level of trust and transparency that is rare in moral communities, and it risks "moral corruption"—the fear that by acting against your principles, you erode your commitment to them.

  **2. The Moral Parliament (Intrapersonal)**
  *   **The Agents:** Competing moral theories (Utilitarianism, Virtue Ethics, etc.) represented as delegates within a *single* uncertain mind.
  *   **What is Traded:** *Decision weight.* The "delegates" logroll. The Utilitarian delegate agrees to vote for a deontological constraint on Issue A in exchange for the Deontologist delegate voting for a utility-maximizing act on Issue B.
  *   **The Economic Analogy:** This is legislative bargaining. It treats moral credences not as probabilities to be calculated, but as voting blocs to be managed.
  *   **Where it Holds:** It offers a way to make decisions when you are morally uncertain but cannot compare the "units" of different theories (the problem of inter-theoretic comparison). It avoids the need to say "1 unit of utility equals 1 unit of duty."
  *   **Where it Strains:** It is a category error. In a real parliament, delegates have distinct agency and interests. In your head, *you* are all the delegates. There is no actual conflict to bargain over, only a calculation to be performed. The "bargaining" is a metaphor for a mathematical operation (maximizing expected choiceworthiness) that the model claims to bypass but ultimately relies upon.

  ### The Verdict

  You asked for a commitment, so here it is: **Toby Ord's Moral Trade is the more defensible normative idea.**

  The Moral Parliament model is ultimately a "just-so story" that collapses under scrutiny, whereas Moral Trade identifies a genuine, overlooked mechanism for moral value creation.

  Here is why the Parliamentary Model fails where Moral Trade succeeds:

  **1. The Homunculus Problem**
  The Parliamentary Model pretends that a single mind is a multiplicity. But when the "delegates" finish bargaining, who implements the decision? You do. If you have credences in different theories, you are already committed to maximizing *expected choiceworthiness*. The Parliament adds a layer of theatrical bargaining that implies the theories have agency they do not possess. If you can compare the theories enough to let them "trade" votes (e.g., "this issue is twice as important to me as that one"), you can simply do the math directly. If you *can't* compare them, they can't negotiate a trade ratio either. The model tries to have it both ways and ends up being either mathematically redundant or incoherent.

  **2. Real vs. Metaphorical Scarcity**
  Moral Trade addresses a real structural problem: distinct agents with distinct values are currently leaving moral value on the table because they refuse to coordinate. This is a tangible inefficiency in the world. Ord's model provides a literal algorithm to capture that value. The Parliamentary Model addresses a psychological discomfort (uncertainty) by modeling it as a political conflict. But uncertainty is an epistemic state, not a political one. Resolving it requires better epistemology, not better legislation.

  **3. Integrity vs. Calculation**
  The strongest objection to Moral Trade is the integrity objection: "I shouldn't do something I think is wrong, even for a trade." However, Ord's defense is robust: if the trade results in more good *by your own definition*, refusing the trade is actually the violation of your principles. The Parliamentary Model, conversely, invites you to violate your highest-credence theory to appease a lower-credence "delegate" inside your head. This creates dynamic inconsistency. If you are 90% sure Theory A is right, why should the 10% Theory B delegate have veto power or bargaining leverage that distorts the 90%? In Moral Trade, the partners are equals by necessity; in the Parliament, the weighting of the delegates is arbitrary.

  **Conclusion**
  The Moral Parliament is a useful pedagogical tool for visualizing moral uncertainty, but it is not a standalone normative theory. It is a metaphor masking a calculation. Moral Trade, however, is a genuine normative innovation. It correctly identifies that moral pluralism between people is a feature, not a bug, and that cooperation across value systems is a moral imperative in itself.

  If you are writing a piece on the weirder edges of EA, treat the Parliamentary Model as a fascinating historical footnote in decision theory, but treat Moral Trade as a serious, actionable proposal that challenges the notion of moral purity. One is a metaphor for thinking; the other is a method for acting.
