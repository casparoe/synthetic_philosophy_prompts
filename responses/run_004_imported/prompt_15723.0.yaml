answer: |-
  You are right to pause before committing to that structure. While your proposed dichotomy (rigorous day philosopher vs. credulous night ghost-hunter) offers a neat dramatic irony, it fundamentally misreads the engine driving Sidgwick's life and thought. If you adopt that structure, you risk turning a profound philosophical tragedy into a mere eccentricity.

  To answer your specific questions: **No, the "two compartments" approach does not do justice to the relationship.** The psychical research was not a separate hobby or a private consolation; it was a desperate, logical extension of his ethical theory. And **no, "credulous" is not the right word.** It actively misrepresents the methodology of the Society for Psychical Research (SPR), which was founded specifically to combat credulity with scientific rigor.

  Here is the deeper connection you should consider weaving into the novel, along with why correcting the "credulous" assumption matters for your protagonist's voice.

  ### 1. The Philosophical Engine: The Dualism of Practical Reason
  The link between Sidgwick's ethics and his ghost-hunting is not biographical coincidence; it is logical necessity.

  In *The Methods of Ethics* (1874), Sidgwick arrives at a conclusion that haunted him for the rest of his life: the **"Dualism of Practical Reason."** He demonstrates that human reason dictates two equally valid but potentially conflicting paths:
  1.  **Rational Egoism:** It is rational to pursue one's own happiness.
  2.  **Rational Utilitarianism:** It is rational to pursue the general happiness of all.

  In a secular universe without divine judgment, these two can conflict. If being moral requires sacrificing your own happiness, and there is no afterlife where that sacrifice is compensated, then **morality is ultimately irrational.** As Sidgwick famously wrote, "The Cosmos of Duty is thus really reduced to a Chaos."

  Sidgwick had lost his Christian faith (he resigned his fellowship at Trinity in 1869 because he could no longer sign the Thirty-Nine Articles in good conscience). He removed the traditional theological sanction (God/Heaven) that guaranteed virtue would be rewarded.

  **The Psychical Research was the attempt to restore that sanction empirically.**
  He did not go to séances to comfort his grief; he went to find *data*. If he could scientifically prove the survival of consciousness after death, he could restore the rationality of morality without returning to dogmatic religion. The "nighttime" work was an attempt to solve the "daytime" problem. The treatise creates the wound; the SPR is the attempt to stitch it up.

  **Narrative Implication:** Instead of irony based on contradiction (the smart man doing something silly), consider irony based on **desperation**. The most rigorous logician of his age is forced to hunt for ghosts because Reason itself demands it. The tragedy is that he applies scientific standards to a phenomenon that refuses to yield to them.

  ### 2. The Methodology: "Credulous" vs. "Skeptical"
  Describing Sidgwick or the early SPR as "credulous" would be historically inaccurate and would flatten the tension of your scenes.

  The SPR was founded in 1882 (precisely your novel's timeframe) by men like Sidgwick, Frederic Myers, and Edmund Gurney specifically because they were *dissatisfied* with the credulity of spiritualism and the dogmatic dismissal of mainstream science.
  *   **Their Goal:** To examine "that large body of debatable phenomena designated by such terms as mesmeric, psychical, and spiritualistic, without prejudice and in a scientific spirit."
  *   **Their Method:** They were fraud-hunters. Sidgwick was notorious for his cold, almost painful skepticism. He would sit through séances in silence, analyzing the mechanics of the room, the lighting, and the medium's sleeves. He resigned from the SPR presidency later in life over the Eusapia Palladino controversy because he felt his colleagues were becoming too lax in their controls.

  **Narrative Implication:** If your protagonist is "credulous," he becomes a victim. If he is "skeptical," he becomes an investigator. The drama lies in the friction between his desire to believe (to save his ethics) and his inability to find proof that satisfies his own high standards.
  *   *Wrong approach:* He sits in the dark and gasps at a floating table.
  *   *Right approach:* He sits in the dark with a notebook, measuring the distance of the table from the medium, noting the draft in the room, hoping for a miracle but documenting a trick.

  ### 3. Revising Your Structural Plan
  You mentioned building "quiet irony" out of the contrast between the two lives. I would suggest you keep the contrast but change the *nature* of the irony.

  **Current Plan:**
  *   *Day:* Rigorous, logical, real work.
  *   *Night:* Soft, emotional, consolation prize.
  *   *Irony:* How strange that the rational man believes in ghosts.

  **Proposed Alternative:**
  *   *Day:* He constructs a system of ethics that collapses without a theological sanction. He feels the "Chaos of Duty."
  *   *Night:* He applies the same ruthless rigor to the supernatural that he applies to ethics, looking for the empirical proof that will stabilize the Day.
  *   *Irony/Tragedy:* The "scientific" method fails him in the night, leaving the "philosophical" system in the day unstable.

  This makes the two compartments not separate lives, but **two halves of a single failing project.**

  ### Specific Details to Consider
  If you want to capture the specific texture of Sidgwick's dilemma in the 1880s:

  1.  **The "Residue of Fact":** The SPR wasn't looking for "ghosts" in the Gothic sense. They were looking for a "residue of fact" that materialism couldn't explain. Your protagonist should speak like a scientist, not a mystic. He should be interested in "telepathy" and "mediumistic phenomena" as data points.
  2.  **The Fear of Insanity:** Sidgwick had a family history of mental instability (his father was mentally ill). For him, the pursuit of psychical research was walking a tightrope between intellectual honesty and madness. This adds personal stakes to the "nighttime" scenes.
  3.  **The "Crisis of Faith":** Ensure the reader knows he didn't just "lose" faith; he sacrificed it for intellectual integrity. This makes his search for empirical proof of survival more poignant. He isn't trying to get back to church; he's trying to build a new church out of data.

  ### Summary
  If you write him as a credulous ghost-hunter seeking consolation, you create a character who has abandoned reason at night. If you write him as a skeptical investigator seeking the only possible foundation for reason, you create a character who is **drowning in reason.**

  The latter is historically accurate, but it is also much richer fiction. It transforms the novel from a period piece about a quirky professor into a study of a man trying to save the rationality of virtue in a universe that is rapidly going silent. The "quiet irony" you seek is best found not in the contrast between his two jobs, but in the failure of his immense intellect to bridge the gap between them.
