  7.  **Final Polish:** Check tone (analytical, neutral, insightful). Ensure all constraints of the prompt are met. (Move-by-move analysis + Overlooked consideration).

      *(Self-Correction on the "Overlooked" part)*: Is there something more philosophical? Maybe the *nature of the AI*? No, the regulatory aspect is more pertinent to the "brokerage" context. However, a philosophical angle on *epistemic humility* or *structural paternalism* could work. Let's stick with the Regulatory/Fiduciary duty because it's the real-world constraint that makes the philosophical debate somewhat academic. Actually, a blend: **The Fiduciary/Regulatory Context combined with the Nature of the Platform as a Gatekeeper.**

