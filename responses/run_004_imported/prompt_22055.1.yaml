answer: |-
  Good evening, everyone. For those who don't know me, I work with Marisol on the engineering team. I write Terraform for a living, not essays, so I'll keep this brief. But when I was asked to speak tonight, I found myself stuck. I wanted to honor Marisol's twenty-three years here, but the real story isn't in the code she committed or the systems she architected. It's in what she did when the laptops were closed.

  As many of you now know, for nearly every Saturday morning of those twenty-three years, Marisol ran a free robotics club for kids in the foster care system. She funded it herself. She organized it herself. And for most of those years, she asked us not to talk about it. She turned down company sponsorship. She declined features on the careers blog. When I once asked her why, she told me that being recognized for it would make it "stop being hers."

  Now, HR has asked me to use this moment to encourage everyone to "get more involved" in the community. And I want to be careful here. Because there is a risk in praising Marisol. If I frame what she did as simply "what a decent person does," I imply that the rest of us have been indecent for twenty years. That creates guilt, not inspiration. But if I say "it was nothing special, anyone could do it," I lie. It *was* special. It required a sacrifice of time, money, and energy that goes far beyond reasonable expectation.

  So, how do we honor the act without weaponizing it against everyone else?

  While preparing for this, I went down a bit of a rabbit hole and found a word that I think fits Marisol perfectly. It's a term from ethics called *supererogation*. It sounds technical, but the idea is simple. It refers to actions that are good to perform, but not wrong to omit. In philosophical terms: praiseworthy to do, not blameworthy to skip.

  This distinction matters. If we treat Marisol's work as a *duty*, we turn her gift into a debt we all owe. That cheapens it. Duty is the baseline; it's what we owe each other just to get by. But Marisol wasn't paying a debt. She was giving a gift. The beauty of her Saturday mornings wasn't that she *had* to do them; it was that she *chose* to.

  For the ethicists in the room, you'll know this category has its critics. Some argue that if an action produces the most good, it becomes obligatory. But I think Marisol's life argues otherwise. There is a space between "what we must do" and "what we aspire to do." That space is where freedom lives. And that is exactly where Marisol has been living for two decades.

  So, to my colleagues: HR wants me to tell you to get involved. I will say this instead: Look at what is possible when we operate in that space of freedom. You are not required to be Marisol. You are not failing because you spend your Saturdays sleeping in or coaching your own kids or just resting. Your worth is not measured by your output, professional or charitable. But, if you ever find yourself with the capacity to give more than is asked, know that there is profound beauty in that choice. Not because it's mandatory, but because it's yours to give.

  And to Marisol: You protected this work. You kept it separate from your title, your performance review, and your public profile. You kept it yours. Tonight, we aren't trying to take that ownership away. We are just bearing witness to it. We are acknowledging that while none of us are obligated to do what you did, we are all better for having known someone who did.

  You taught those kids how to build machines. But you've taught us something about building a life. You showed us that the best things we do often happen off the clock, without applause, and without obligation.

  So, if everyone could please raise a glass.

  To Marisol. For the systems you stabilized here, and for the sparks you ignited there. For the duty you fulfilled, and for the grace you gave beyond it. May your retirement be entirely, wonderfully, and exclusively your own.

  To Marisol.
