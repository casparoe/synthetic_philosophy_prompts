answer: |-
  **SEMINAR HANDOUT: THE WHITEBOARD STANDOFF**
  **Topic:** Fitch's Paradox & Anti-Realist Responses
  **Characters:** **ALEX** (Realist), **JORDAN** (Verificationist)

  *(The room is empty save for ALEX and JORDAN. The whiteboard is covered in modal logic derivations. JORDAN is wiping their hands of chalk dust. ALEX is leaning against the desk, smiling.)*

  **ALEX:** So. That's it then? *Omne verum est scitum.* Every truth is known. I always knew verificationism was ambitious, but I didn't think you lot claimed omniscience.

  **JORDAN:** Don't be glib, Alex. You know the Verificationist thesis isn't that everything *is* known. It's that truth *consists in* knowability. $\forall p (p \to \diamond Kp)$. That's the principle.

  **ALEX:** And look where it got you. You take that principle, plus the modest, commonsense claim that there are some unknown truths—$\exists p (p \land \neg Kp)$—and Fitch shows you derive a contradiction. If you keep the knowability principle, you have to deny there are unknown truths. If you keep the unknown truths, you have to deny knowability. Which one goes?

  **JORDAN:** Neither. You're applying the Knowability Principle indiscriminately. The proof works by instantiating the principle with a specific conjunction: let $q$ be $(p \land \neg Kp)$. You argue that if $q$ is true, it must be knowable. But $K(p \land \neg Kp)$ entails $Kp \land K\neg Kp$, which is inconsistent.

  **ALEX:** Exactly. It's a *reductio*.

  **JORDAN:** It's a *reductio* of the assumption that the Knowability Principle applies to *any* proposition whatsoever. Look, Neil Tennant's move is the right one here. We restrict the principle. Truth implies knowability only for **Cartesian propositions**.

  **ALEX:** Cartesian?

  **JORDAN:** Propositions that are logically consistent with being known. $(p \land \neg Kp)$ is not Cartesian. It's inherently unknowable. So, the Knowability Principle simply doesn't cover it. The proof fails because the substitution instance is illicit.

  **ALEX:** *(Pushes off the desk and walks to the board)* Okay, I see the technical block. You've patched the hole. But look at the cost. You've saved your principle by making it trivial.

  **JORDAN:** It's not trivial. It's a substantive constraint on meaning.

  **ALEX:** Isn't it? Your revised principle says: "For all $p$, if $p$ is true and $p$ is consistent with being known, then $p$ is knowable." But if a proposition is *inconsistent* with being known, what status does it have?

  **JORDAN:** It lacks a truth-value. Or rather, it cannot be truly asserted.

  **ALEX:** So, if I say, "There are truths that will never be known," I'm saying something that—by your lights—cannot be true. Because if it were true, it would be a non-Cartesian truth, and you only allow Cartesian truths to be... well, true.

  **JORDAN:** You can't *know* that there are unknown truths. But that doesn't mean realism wins. It means the sentence "There are unknown truths" is not a candidate for knowledge. It's epistemically unconstrained.

  **ALEX:** This is the silence objection, Jordan. To avoid the paradox, you have to say that the very sentence expressing the motivation for realism—"There are mind-independent truths we might miss"—is meaningless. You're buying consistency at the price of humility. You can't even coherently say you might be wrong.

  **JORDAN:** I can say I might be wrong about $p$. I just can't say "There is a $p$ such that $p$ is true and forever unknowable." Because "true" just *means* "verifiable in principle." If it's forever unknowable, the word "true" doesn't get a grip.

  **ALEX:** But that's begging the question! The realist intuition is that truth *outruns* verification. Fitch shows that if you identify them, you collapse modal distinctions. Your fix is to say, "Well, we only identify them for the propositions that don't cause a collapse." That looks like you're defining the problem away.

  **JORDAN:** *(Turns back to the board, picks up an eraser)* Not defining away. Delineating. Logic tells us we cannot quantify over all propositions indiscriminately when epistemic operators are involved. Why is it realist dogma that "truth" must apply to propositions like $(p \land \neg Kp)$? That proposition is a logical monster. It's designed to be unknowable.

  **ALEX:** It's not a monster, it's the human condition! We are finite. We miss things. If your theory of truth implies that every truth *must* be the kind of thing we could know, and Fitch shows that some truths *can't* be known without contradiction, then your theory of truth is too small for the world.

  **JORDAN:** *(Starts erasing the corner of the proof)* Or the world is too big for the theory. But I'd rather have a theory that explains what truth *is*—a normative status tied to evidence—than a theory that posits "truths" which are, in principle, detached from any possibility of recognition. You call my restriction *ad hoc*. I call your "unknowable truths" occult.

  **ALEX:** Occult? They're just facts I haven't seen yet.

  **JORDAN:** *(Stops erasing, turns around)* And if you can't, even in principle, construct a path to seeing them? Then Fitch says you can't call them "true" without collapsing knowledge into fact. So, are we keeping the restriction, or are you admitting that verificationism entails omniscience?

  **ALEX:** *(Grabs a marker)* Neither. I'm writing up the "Loss of Humility" objection for the handout. If your theory forbids you from admitting there are things you don't know, it's not a theory of knowledge. It's a theory of arrogance.

  **JORDAN:** *(Smiles faintly)* Make sure you cite Tennant correctly. And leave the box around the Cartesian restriction. I want to see if the seminar buys the triviality charge.

  **ALEX:** Oh, they'll buy it. Nobody likes being told they can't say they're fallible.

  **JORDAN:** Then let's see if they prefer fallibility to coherence.

  *(The door opens. Students begin to filter in. ALEX caps the marker. JORDAN tosses the eraser back into the tray.)*
