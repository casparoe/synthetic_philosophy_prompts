prompt: |-
  So I've been reporting on this whole "moral philosophy meets AI alignment" beat and keep running into people citing Harsanyi's aggregation theorem like it's basically a mathematical proof of utilitarianism -- the pitch being that if every individual's preferences under uncertainty satisfy the von Neumann-Morgenstern axioms, and "society's" preferences do too, plus some Pareto condition thats supposed to be totally uncontroversial, then the social welfare function HAS to come out as a weighted sum of everyone's individual utilities. One EA-adjacent researcher I interviewed said something like "that theorem is why you should just be a utilitarian, end of story." But then I fell down a rabbit hole into the older welfare-economics literature and found that people like Diamond (and I think Sen too, though I might be conflating names) pushed back hard on this in the 60s, with an objection about how the theorem's Pareto condition only ever looks at everybody's expected utility before uncertainty resolves -- so it apparently can't distinguish flipping a fair coin to decide who gets some scarce good from some other, rigged-but-expectation-equivalent way of just handing it to one person outright. If I'm remembering that right, that seems like more than a technical footnote.

  Could you write me an essay of maybe 800 words that actually resolves this for me rather than just describing "the debate"? Lay out what Harsanyi's proof actually needs in order to go through, explain the ex ante/ex post objection properly (correcting my version above if I've mangled it), and give the strongest response a defender of Harsanyi -- Broome, maybe, or someone else who engaged with this seriously -- could make. Then commit to an actual verdict: does the theorem succeed as an argument that rational aggregation of preferences under uncertainty has to be utilitarian, or does the objection sink it? I'd take "it proves X but not Y" over a mushy "both sides have a point" -- I've got enough of those in my drafts already.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Harsanyi's Aggregation Theorem vs. the Diamond/Sen critique (ex ante vs. ex post fairness).
      *   **Context:** The user is a journalist/reporter covering AI alignment and moral philosophy, encountering Effective Altruism (EA) claims that Harsanyi proves utilitarianism.
      *   **Task:** Write an ~800-word essay.
      *   **Requirements:**
          *   Explain Harsanyi's proof requirements clearly.
          *   Explain the ex ante/ex post objection accurately (correcting the user's understanding if needed).
          *   Provide the strongest defense (e.g., Broome).
          *   **Crucial:** Commit to a verdict (no "both sides have a point" mushiness).
      *   **Tone:** Analytical, decisive, informed.

  2.  **Deconstruct the Philosophical Content:**
      *   **Harsanyi's Aggregation Theorem (1955):**
          *   *Premises:* Individual preferences satisfy VNM axioms (rationality under uncertainty). Social preferences satisfy VNM axioms. Pareto principle (if everyone prefers A to B, society prefers A to B).
          *   *Conclusion:* Social welfare function is a weighted sum of individual utilities ($W = \sum a_i U_i$). This looks like utilitarianism.
          *   *Caveat:* It's formal utilitarianism (structure), not necessarily normative utilitarianism (why those weights? why maximize?).
      *   **The Critique (Diamond, 1967; Sen):**
          *   *Focus:* The Pareto condition used is *ex ante* (based on expected utility before the risk resolves).
          *   *Example:* Two people, one job.
              *   Option 1: Give to Person A outright.
              *   Option 2: Flip a coin.
              *   *Ex Ante:* Both prefer the coin flip (50% chance vs 0% for B, 100% vs 50% for A? Wait, need to set up the example carefully).
              *   *Standard Diamond Example:* Two individuals, one unit of good.
                  *   Allocation A: Give to Person 1. (U1=1, U2=0).
                  *   Allocation B: Give to Person 2. (U1=0, U2=1).
                  *   Allocation C: Fair Coin. (EU1=0.5, EU2=0.5).
                  *   If we compare Coin vs. Giving to Person 1: Person 2 prefers Coin. Person 1 is indifferent (assuming risk neutrality). So Pareto says Coin > Give to 1.
                  *   *The Problem:* Harsanyi's theorem aggregates *expected* utilities. It treats the coin flip as valuable only insofar as it boosts ex ante expectations. It ignores the *ex post* unfairness of the outcome or the intrinsic value of the procedure.
                  *   *Actually, the stronger critique:* Harsanyi's theorem implies society should be risk-neutral regarding utility. But individuals might care about fairness *as an outcome*, not just a probability. The theorem forces a specific attitude toward risk that might conflict with fairness intuitions.
                  *   *Refining the Objection:* The core issue is that Harsanyi assumes the "Pareto principle" applies to *expectations*. If Society cares about *ex post* equality (fairness of the realized outcome), it might violate the VNM independence axiom or the Pareto principle as Harsanyi defines it. Diamond showed that a social welfare function that values fairness (preferring the coin flip to a deterministic allocation even if expectations are identical) violates the VNM axioms required for Harsanyi's linear aggregation.
      *   **The Defense (Broome, Harsanyi himself):**
          *   Broome argues that "good" is defined by the satisfaction of rational preferences. If the Pareto principle holds for rational preferences, we must respect them.
          *   If individuals don't care about the fairness of the process, only their own outcome, society shouldn't either (welfarism).
          *   If individuals *do* care about fairness, that should be baked into their utility function.
          *   *Stronger Defense:* The theorem proves that *if* you accept welfarism and rationality constraints, utilitarianism is the only game in town. The objection just shows you have to reject welfarism or standard rationality to get fairness.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the EA claim. State the thesis (The theorem is mathematically sound but normatively brittle; it proves conditional consistency, not moral truth).
      *   **Harsanyi's Mechanism:** Briefly explain VNM + Pareto = Weighted Sum. Emphasize the "ex ante" nature of the Pareto condition.
      *   **The Diamond Objection:** Correct the user's understanding. It's not about rigged coins; it's about *fairness vs. efficiency*. Diamond showed that if you prefer a fair lottery over a deterministic assignment (even with same expected utility), you violate the independence axiom required for Harsanyi's sum. Society values "fairness" as a separate good from "utility sum."
      *   **The Defense:** Broome's line. If individuals are the best judges of their good, and they only care about their own consumption, imposing "fairness" is paternalistic. Or, if they care about fairness, include it in $U_i$.
      *   **The Verdict:** This is the hard part. I need to pick a side.
          *   *Option A:* Harsanyi wins. (Too dismissive of fairness).
          *   *Option B:* Diamond wins. (Too dismissive of rational aggregation).
          *   *Option C:* Harsanyi proves *consistency*, not *morality*. The verdict should be that the theorem fails as a *foundational proof of utilitarianism* because the premises smuggle in the conclusion (specifically the treatment of risk and the definition of "good").
          *   *Decision:* The objection sinks it *as a moral proof*. It shows Harsanyi assumes what he tries to prove: that only outcomes matter, not the distribution of chances.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on User's Example:* The user mentioned "rigged-but-expectation-equivalent." Diamond's point is usually: Compare (1) Give to A for sure vs (2) Coin flip. If Society prefers (2) due to fairness, but individuals only care about their own consumption, Harsanyi says Society is irrational. If individuals *also* prefer the coin flip (ex ante), Harsanyi accommodates it. The real bite is when Society cares about fairness *independently* of individual preferences, or when individuals have conflicting views on risk.
      *   *Wait, let's look closer at Diamond (1967).* Diamond's example: Two people, one unit of good.
          *   Option 1: Give to Person 1.
          *   Option 2: Give to Person 2.
          *   Option 3: 50/50 Lottery.
          *   If individuals are risk-neutral, EU(1) = 1 for P1, 0 for P2. EU(3) = 0.5 for P1, 0.5 for P2.
          *   Harsanyi's SWF sums these. Sum(1) = 1. Sum(3) = 1. Society is indifferent.
          *   But intuitively, Society might prefer (3) for fairness.
          *   To prefer (3), Society must be risk-averse regarding *utility distribution*. But Harsanyi's theorem forces Society to inherit the risk attitudes of individuals (via VNM). If individuals are risk-neutral, Society *must* be risk-neutral.
          *   Therefore, Harsanyi forbids "fairness" that isn't already captured in individual risk preferences.
      *   *Verdict Formulation:* The theorem is valid logic, but the premises are morally loaded. It doesn't prove utilitarianism; it proves that *if* you treat social choice like individual choice under risk, you get utilitarianism. Diamond shows we shouldn't treat social choice like individual choice under risk.

  5.  **Writing the Essay (incorporating constraints):**
      *   *Word Count:* Aim for ~800.
      *   *Tone:* Professional, decisive.
      *   *Key names:* Harsanyi, Diamond, Broome.

  6.  **Final Review against constraints:**
      *   Did I explain the proof needs? Yes (VNM + Pareto).
      *   Did I explain ex ante/ex post? Yes (Diamond's fairness critique).
      *   Did I give a defense? Yes (Broome/Welfarism).
      *   Did I commit to a verdict? Yes (It fails as a moral proof).

  *(Self-Correction during drafting the verdict)*: I need to be careful not to say the math is wrong. The math is right. The *application* is wrong. The verdict is that it fails to bridge the "is-ought" gap it claims to bridge.

  7.  **Final Polish:** Check flow and clarity. Ensure the distinction between "proving utilitarianism is consistent" vs "proving utilitarianism is required" is sharp.

  *(Drafting thought)*: Make sure to clarify the user's "rigged coin" confusion. Diamond's point isn't about rigged coins, it's about the *value of the lottery itself* independent of expected payoff.

  *(Final check on word count)*: Keep it tight. Don't meander into Rawls. Stick to Harsanyi/Diamond/Broome.

