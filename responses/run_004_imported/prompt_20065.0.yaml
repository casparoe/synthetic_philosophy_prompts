answer: |-
  Harsanyi's Aggregation Theorem is often brandished in AI alignment circles as a slam-dunk derivation of utilitarianism from rationality alone. The pitch is seductive: if individuals are rational (satisfying the von Neumann-Morgenstern axioms) and society respects their preferences (the Pareto principle), then social welfare *must* be a weighted sum of individual utilities. Q.E.D., you are a utilitarian.

  But this confidence rests on a category error. Harsanyi's theorem is mathematically valid, but it fails as a moral proof because its premises smuggle in the very conclusion they claim to derive. The objection raised by Peter Diamond (1967) and Amartya Sen does not merely nitpick the technicalities; it exposes that Harsanyi's framework is structurally incapable of accommodating fairness as a distinct moral value.

  To see why, we must look at what Harsanyi actually requires. The theorem assumes that "society" can be modeled as a single rational agent facing uncertainty. It requires that social preferences satisfy the VNM axioms, specifically the **Independence Axiom**. This axiom implies that if you prefer Lottery A to Lottery B, you should still prefer A to B even if both are mixed with some irrelevant Lottery C. Crucially, Harsanyi applies the Pareto principle **ex ante**: if every individual prefers Lottery A to Lottery B based on their *expected* utility, society must agree.

  This is where Diamond strikes. He demonstrated that a society that cares about **ex post fairness** cannot satisfy the VNM axioms required by Harsanyi. Consider Diamond's famous example: two individuals, one indivisible good. You can give it to Person 1, give it to Person 2, or flip a fair coin. If both individuals are risk-neutral, the expected utility sum is identical for all three options (1 unit of utility total). Harsanyi's theorem dictates that society must be indifferent between giving the good to Person 1 outright or flipping a coin.

  However, most moral intuitions suggest the coin flip is superior because it treats the individuals equally *ex ante*, even if the *ex post* outcome is unequal. To prefer the coin flip is to value the fairness of the procedure itself. But doing so violates the Independence Axiom. It implies society is risk-averse regarding the *distribution* of utility, even if individuals are not risk-averse regarding their own utility. Harsanyi's proof forbids this. It forces social risk attitudes to mirror individual risk attitudes. Consequently, the theorem doesn't prove utilitarianism is the only rational morality; it proves that **only** moralities that ignore distributional fairness can be represented as a sum of expected utilities.

  Defenders like John Broome argue that this is a feature, not a bug. Broome contends that if individuals do not care about the fairness of the process—only their own outcome—then imposing a "fair" coin flip is paternalistic. On this view, "good" is defined strictly by the satisfaction of rational preferences. If fairness matters, it should be modeled as a preference within the individual's utility function (e.g., Person 1 feels bad if Person 2 gets nothing). If we include these "sympathetic preferences," Harsanyi's sum can accommodate fairness.

  This defense, however, begs the question. It assumes welfarism—that the only thing that matters is the satisfaction of preferences. But the intuition behind Diamond's objection is precisely that fairness is an objective constraint on social choice, independent of whether individuals happen to care about it. If Person 1 and Person 2 are selfish egoists, Harsanyi demands we treat a rigged system and a fair lottery as morally equivalent provided the expected payoffs match. This reduces morality to accounting.

  So, does the theorem succeed? The verdict must be no. Harsanyi's Aggregation Theorem succeeds as a consistency check for a specific type of welfarist consequentialism, but it fails as a foundational argument for utilitarianism. It relies on the **ex ante Pareto principle**, which privileges individual expectations over social outcomes. By demanding that social rationality mirror individual rationality under risk, Harsanyi assumes that society is just a "super-individual." Diamond showed that society is not a person; it is a collection of persons among whom justice must be done.

  The theorem proves that *if* you believe fairness has no intrinsic value separate from expected utility, *then* you must be a utilitarian. But that is a tautology, not a derivation. For AI alignment, this is critical. Coding an AI to maximize the sum of expected preferences (as Harsanyi suggests) inherently blinds it to unfair distributions of risk unless those risks are explicitly priced into the utility function. The math holds, but the morality is incomplete. Harsanyi gives us a powerful engine for aggregation, but Diamond reminds us that he never told us where the car should go.
