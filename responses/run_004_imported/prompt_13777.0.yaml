prompt: |-
  For the past few years I've co-written a multi-volume fantasy series with a collaborator, and we've hit an impasse that has proven surprisingly hard to resolve. Across the earlier books we established, through a handful of scenes rather than any explicit statement, that a certain binding spell works whenever a mage learns a creature's true name, and that it succeeds on animals and humans but fails outright on ghosts. The volume we're drafting now hinges on whether that spell can bind a golem: a body of animated clay that was never alive and has no pulse, yet is very much physical. My collaborator is certain the spell must fail, on the grounds that it has only ever worked on things that are alive; I'm equally certain it must succeed, on the grounds that it has only ever failed on things without a physical body. Both readings fit every scene we've actually written, and even our old outlines and notes turn out to be silent on the question, so neither rereading the text nor comparing our original intentions has settled anything. Is one of us actually right about what our rule already implied, or is there something confused about assuming the earlier books settled this at all?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** Co-authored multi-volume fantasy series.
      *   **The Issue:** An impasse regarding a specific magic rule (binding spell via true name).
      *   **Established Canon:**
          *   Works on: Animals, Humans (Living, Physical).
          *   Fails on: Ghosts (Non-living, Non-physical).
          *   Mechanism: Learning a creature's *true name*.
      *   **The New Question:** Does it work on a Golem?
          *   Golem traits: Animated clay, never alive, no pulse, but physical.
      *   **Collaborator A (User):** Believes it *succeeds*. Logic: It only failed on things *without a physical body*. Golems are physical.
      *   **Collaborator B (Partner):** Believes it *fails*. Logic: It only worked on things that are *alive*. Golems are not alive.
      *   **Evidence:** Textual analysis of previous books, outlines, and notes yields no definitive answer. Both interpretations fit existing scenes equally well.
      *   **The Core Question:** Is one of us actually right about what the rule *already implied*, or is there something confused about assuming the earlier books settled this at all?

  2.  **Evaluate the Logic of the Magic System:**
      *   *Premise 1 (User):* The differentiator is Physicality vs. Ethereality.
          *   Humans/Animals = Physical.
          *   Ghosts = Ethereal.
          *   Golems = Physical. -> *Conclusion: Works.*
      *   *Premise 2 (Partner):* The differentiator is Life vs. Non-Life.
          *   Humans/Animals = Alive.
          *   Ghosts = Dead/Undead (Non-living).
          *   Golems = Construct (Non-living). -> *Conclusion: Fails.*
      *   *The Problem:* The existing data set (Humans, Animals, Ghosts) is insufficient to distinguish between "Physicality" and "Life" as the governing variable. This is a classic case of *underdetermination* in world-building.

  3.  **Address the Core Question:** "Is one of us actually right... or is there something confused about assuming the earlier books settled this at all?"
      *   *Answer:* Neither is "right" based *strictly* on the text. The text is ambiguous. Assuming the books settled this is the confusion.
      *   *Why?* Because the sample size of previous examples shares *two* common traits (Alive + Physical) for success, and *two* common traits (Dead + Ethereal) for failure. You cannot isolate the variable without a test case that splits the traits (e.g., Alive but Ethereal, or Dead but Physical). A Golem is exactly that test case (Dead but Physical).
      *   *Implication:* This isn't a continuity error; it's an opportunity.

  4.  **Formulate Advice/Strategy:**
      *   **Validate the Impasse:** Acknowledge that this is a common and healthy creative problem. It means the world is rich enough to have edge cases.
      *   **Deconstruct the Logic:** Explain *why* neither is objectively right based on past text (the "Underdetermination" concept).
      *   **Shift the Focus:** Move from "What did we write?" to "What serves the story best?"
      *   **Explore Narrative Consequences:** How does each choice affect the current volume's plot, themes, and character arcs?
      *   **Consider the "True Name" Mechanic:** What does a True Name *mean* in this world? Does a golem *have* one? Who gives it? The creator? The spirit inside (if any)?
      *   **Decision-Making Tools:** Suggest ways to break the tie (vote, flip a coin, test in draft, third-party opinion).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the situation. It's not a bug, it's a feature.
      *   *The Logical Analysis:* Explain that the previous data points are correlated (Life & Body go together usually). The Golem breaks the correlation. Therefore, the text doesn't dictate the answer.
      *   *The "True Name" Philosophy:* This is the deeper lore question. If a golem has no soul/life, can it have a True Name? If the Creator names it, is that its True Name? This might favor the Partner (Fail) or require a tweak (User's Success needs a reason).
      *   *Narrative Impact:* Which choice makes for a better story *now*?
          *   If it works: Golems become vulnerable. Mages can control them. Maybe the villain uses this?
          *   If it fails: Golems are the ultimate weapon against mages. Maybe the heroes need a golem bodyguard?
      *   *Resolution Strategies:*
          1.  **Story First:** Pick the one that creates more conflict/interest.
          2.  **Lore Deep Dive:** Define "True Name."
          3.  **The "It Depends" Option:** Maybe it works differently? (Partial binding?)
          4.  **Collaborative Exercise:** Write two versions of the scene.
      *   *Conclusion:* Reassure them that retroactive clarity is normal in long series.

  6.  **Refining the Tone:**
      *   Keep it professional, empathetic, and analytical.
      *   Avoid taking sides.
      *   Use terms like "underdetermination" or "confounding variables" to validate the logical stalemate.

  7.  **Final Polish:** Check against the prompt's specific question ("Is one of us actually right... or is there something confused..."). Ensure this is answered directly early on. (Yes, the confusion lies in assuming the earlier books settled it.)

      *(Self-Correction during drafting)*: I should make sure not to just say "it's ambiguous." I need to explain *why* it's ambiguous logically. The set of "Living Things" and "Physical Things" overlapped completely in the previous books. The Golem is the first instance where they diverge.

      *(Adding a nuance check)*: Wait, ghosts. Are ghosts "dead"? Yes. Are they "non-physical"? Yes. So Failure = Dead + Non-physical. Success = Alive + Physical.
      User says Failure = Non-physical. (Ignores the 'Dead' part).
      Partner says Failure = Dead/Not Alive. (Ignores the 'Non-physical' part).
      Both are cherry-picking a variable. I need to point this out gently.

  8.  **Final Output Structure:**
      1.  Direct Answer (The "Underdetermination" diagnosis).
