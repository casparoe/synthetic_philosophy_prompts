answer: |-
  This is an exceptionally sharp observation. You have hit upon precisely the conceptual hurdle that trips up almost everyone when they first transition from classical to intuitionistic logic. Your confusion stems from a single, very natural assumption that holds in classical logic but fails in intuitionistic logic: **the equivalence of a statement and its double negation.**

  In classical logic, $\neg\neg P \iff P$.
  In intuitionistic logic, only $P \implies \neg\neg P$ holds. The reverse, $\neg\neg P \implies P$, is **not** valid.

  Here is the breakdown of why this happens, why intuitionists don't refute Excluded Middle, and how to interpret "truth" in this system.

  ### 1. The Double Negation Wall

  You wrote: *"cancelling two negatives should presumably just return the original statement, so a proof of 'not not (P or not-P)' ought to already count as a proof of 'P or not-P'."*

  This is the exact point where intuitionistic logic diverges. To an intuitionist, "truth" is not a static property of the universe; it is the **possession of a proof**.

  *   **$P$**: I have a construction/proof of $P$.
  *   **$\neg P$**: I have a method that converts any proof of $P$ into a contradiction (absurdity).
  *   **$\neg\neg P$**: I have a method that converts any proof of "$\neg P$" (i.e., a method that turns proofs of $P$ into contradictions) into a contradiction.

  Do you see the gap?
  Knowing that "it is impossible to prove that $P$ is impossible" ($\neg\neg P$) is not the same thing as "I have a proof of $P$."

  **An Analogy:**
  Imagine $P$ is "There is a treasure in this box."
  *   **$P$**: I open the box and show you the treasure.
  *   **$\neg P$**: I show you a blueprint proving the box is empty.
  *   **$\neg\neg P$**: I show you that anyone claiming to have a blueprint proving the box is empty is lying.

  Does $\neg\neg P$ mean the treasure is there? No. It just means you can't prove it's empty. The box might still be empty, but you lack the blueprint to prove it. In intuitionistic logic, you cannot assert the treasure exists until you open the box ($P$), even if you know no one can prove it's empty ($\neg\neg P$).

  Because $\neg\neg P \implies P$ (Double Negation Elimination) is not a valid rule, proving $\neg\neg(P \lor \neg P)$ does **not** grant you $P \lor \neg P$.

  ### 2. Why don't they prove $\neg(P \lor \neg P)$?

  You asked: *"If intuitionists genuinely believe that the law of excluded middle fails... they should be willing to go further and actually prove its negation."*

  This is the second crucial distinction. Intuitionists do **not** assert that the Law of Excluded Middle (LEM) is *false*. They assert that it is **unjustified**.

  If an intuitionist proved $\neg(P \lor \neg P)$ for some specific $P$, they would be claiming that $(P \lor \neg P)$ leads to a contradiction. But as you noted, $\neg\neg(P \lor \neg P)$ is a theorem in intuitionistic logic!
  1.  We can prove $\neg\neg(P \lor \neg P)$.
  2.  If we could also prove $\neg(P \lor \neg P)$...
  3.  We would have a contradiction ($\neg A \land \neg\neg A$).

  So, an intuitionist *cannot* prove the negation of LEM without making their logic inconsistent.

  Instead, the intuitionistic stance is one of **suspension of judgment**.
  *   **Classical:** "For every $P$, the statement '$P \lor \neg P$' is True." (Even if we don't know which one).
  *   **Intuitionistic:** "For some $P$, we currently possess neither a proof of $P$ nor a proof of $\neg P$. Therefore, we cannot assert '$P \lor \neg P$'."

  They reject LEM as a *universal axiom*, not as a specific truth value for every proposition. They are saying, "You cannot assume you have a decision procedure for every mathematical statement," not "There exists a statement for which both options are false."

  ### 3. Why is $\neg\neg(P \lor \neg P)$ provable?

  It seems odd that you can prove the double-negated version but not the original. Here is the intuitionistic proof sketch for $\neg\neg(P \lor \neg P)$:

  To prove $\neg\neg A$, you assume $\neg A$ and derive a contradiction ($\bot$).
  1.  Assume $\neg(P \lor \neg P)$.
  2.  From this assumption, we can derive $\neg P$. (Why? Because if we had $P$, we would have $P \lor \neg P$, contradicting our assumption).
  3.  From $\neg P$, we can derive $P \lor \neg P$ (by the introduction rule for "or").
  4.  But this contradicts our initial assumption $\neg(P \lor \neg P)$.
  5.  Therefore, the assumption $\neg(P \lor \neg P)$ leads to a contradiction.
  6.  Thus, $\neg\neg(P \lor \neg P)$.

  This proof is valid constructively because it only uses the definition of negation (implication to falsehood). It never requires us to actually *choose* $P$ or $\neg P$. It merely shows that denying the disjunction is self-contradictory.

  ### 4. How this looks in Lean

  Since you are using Lean, this distinction is practical, not just philosophical.

  In Lean's core logic (without importing `classical`):
  *   You **cannot** write `by_cases h : P` for an arbitrary Prop `P`.
  *   You **cannot** use proof by contradiction (`by_contra`) to prove a positive statement `P`. You can only use it to prove a negative statement `¬P`.
  *   You **can** prove `¬¬(P ∨ ¬P)`.

  However, Lean is flexible. If you are working on finite types (like `Nat` with bounded quantifiers, or `Bool`), Lean can often decide the proposition computationally. In those cases, LEM holds because you can write a program to check it. The restriction applies to infinite domains or abstract propositions where no algorithm exists to determine truth.

  If you want classical logic in Lean, you simply write:
  ```lean
  open classical
  ```
  or use the axiom `em : ∀ (p : Prop), p ∨ ¬p`. Once you do that, $\neg\neg P \implies P$ becomes available, and the "wall" disappears.

  ### Summary

  Your reasoning went wrong at the step where you assumed **Double Negation Elimination** ($\neg\neg A \implies A$) is valid.

  1.  **Intuitionists accept:** $P \implies \neg\neg P$ (If I have a proof, I can't be proven wrong).
  2.  **Intuitionists reject:** $\neg\neg P \implies P$ (Knowing I can't be proven wrong doesn't give me a proof).
  3.  **Consequently:** Proving $\neg\neg(P \lor \neg P)$ is easy, but it doesn't give you $P \lor \neg P$.
  4.  **Consistency:** Intuitionists cannot prove $\neg(P \lor \neg P)$ because that would contradict $\neg\neg(P \lor \neg P)$. They simply refuse to assert $P \lor \neg P$ without evidence.

  You have correctly identified that $\neg\neg(P \lor \neg P)$ feels like it *should* be the same as $P \lor \neg P$. In classical logic, it is. In intuitionistic logic, the double negation acts like a "modal operator" (similar to "it is consistent that...") rather than a simple cancellation. It is a subtle but profound shift in what we mean by "mathematical truth."
