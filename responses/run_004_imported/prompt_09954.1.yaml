      *   **Point 1: The Phenomenological Cost of Walton.** Quasi-emotions are indistinguishable from real ones. Why posit a special category?
      *   **Point 2: Reconceptualizing Belief (The Core).** Move away from "full belief" to "fragmented belief" or "imaginary belief." Use contemporary epistemology (fragmented doxastic states).
      *   **Point 3: Addressing the "Call the Cops" Objection.** This needs a dedicated section.
          *   *Argument:* Action requires *practical* belief, not just *representational* belief.
          *   *Analogy:* Dreams. We believe the dream is real *while* dreaming, but we often don't act logically. Or better: Video games/VR.
          *   *The "Frame" Constraint:* We believe the events are happening *within a frame* where intervention is impossible.
