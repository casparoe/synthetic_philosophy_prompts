          *   *Option D (Strongest):* **Doxastic Fragmentation / Compartmentalization.** We hold the belief "Anna is suffering" in the "Fiction" compartment, but the belief "Anna is not real" in the "Actual" compartment. Action requires cross-compartmental access.
