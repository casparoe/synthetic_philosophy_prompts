answer: |-
  This is a fantastic intuition, and you are right to trust it. In analytic aesthetics, Kendall Walton's *Mimesis as Make-Believe* (1990) won the day because it solved a logical puzzle neatly, not because it accurately described the psychological experience of reading. Walton's theory is philosophically tidy but phenomenologically thin. It asks readers to accept that their tears, racing hearts, and sleepless nights are "quasi-emotions"—a special category of fake-feelings that mimic real ones.

  As a writer, you know that's nonsense. When a reader is gripped by a thriller, the fear is not "quasi-fear." It is fear.

  Here is the strongest contemporary case for a **Neo-Illusionism**. This approach updates Coleridge's "willing suspension of disbelief" using modern cognitive science and epistemology to defend the idea that readers *do* form temporary beliefs, while rigorously answering the "why don't they call the cops?" objection.

  ### 1. The Phenomenological Argument: Walton Gaslights the Reader
  The first pillar of the Neo-Illusionist case is that Walton's theory requires us to deny the evidence of our own nervous systems.

  If I read a scene where a child is in danger, my cortisol spikes. My pupils dilate. I hold my breath. If I cry at a funeral scene, the tears contain the same chemical composition as tears shed at a real funeral. Walton argues that because I know the child doesn't exist, the fear isn't "real."

  **The Counter:** Emotions are not defined by their ontological objects (whether the thing is real), but by their physiological and psychological impact. If a soldier has a nightmare and wakes up sweating and terrified, we do not say, "You didn't *really* fear the monster; it was a quasi-fear." We say the fear was real, even if the object was not.

  **The Neo-Illusionist Claim:** Immersion is a cognitive state where the brain processes narrative inputs *as if* they were perceptual inputs. The "illusion" is not that we think we are literally in the book; the illusion is that the **propositions** of the story are treated as true by the emotional centers of the brain, bypassing the logical centers that know it is fiction.

  ### 2. The Mechanism: Doxastic Fragmentation
  The old Illusion Theory failed because it suggested we *wholly* believe the fiction is real, then *wholly* stop believing it when we close the book. That sounds like insanity.

  The contemporary defense relies on **Doxastic Fragmentation** (championed by philosophers like David Lewis and Stephen Schiffer). This theory posits that the human mind does not hold beliefs in one single, consistent "bucket." We hold beliefs in fragmented, compartmentalized "files."

  *   **File A (Reality):** "I am sitting in a chair. Anna Karenina is a character in a book."
  *   **File B (Fiction):** "Anna is suffering. Anna is in danger."

  When you are deeply immersed, you are not deleting File A. You are granting **temporary executive authority** to File B. The illusion is that File B becomes the active lens through which you process emotion. This explains why the experience feels like belief: *It is a belief state, just a localized one.*

  ### 3. The "Call the Cops" Objection: The Stronghold Defense
  This is the hurdle where the old theory died. If I truly believe Anna is suffering, why don't I intervene? If I don't intervene, surely I don't *really* believe she is suffering.

  Here is the three-part Neo-Illusionist rebuttal. You can use this logic to understand exactly what is happening in your reader's mind.

  #### A. The Belief Includes "Causal Impotence"
  When a reader is immersed, they do not simply believe "Anna is in danger." They believe a more complex proposition: **"Anna is in danger *in a world to which I have no causal access*."**

  Think of watching a live news feed of a disaster in a war zone. You believe it is real. You feel horror. You might not call your local police because you believe (correctly) that they cannot intervene. The lack of action does not prove a lack of belief in the suffering; it proves a belief in your own **causal severance**.

  In fiction, this severance is absolute. The reader's belief state includes the premise: *"I am an observer outside the causal chain of this narrative."* Therefore, calling the cops is not just unnecessary; it is **irrational within the logic of the belief itself.** You cannot save someone you believe is unreachable.

  #### B. The "Fixed Past" Constraint
  In a novel, the events are already written. A sophisticated reader, even while immersed, operates with a background belief that the narrative is **fixed**.

  If I believe a car crash happened five minutes ago down the street, I call an ambulance. If I believe a car crash happened five years ago in a history book, I feel sadness, but I do not call an ambulance. Why? Because I believe the event is **unalterable**.

  Deep immersion creates a "present tense" emotion (fear, sadness) about a "past tense" reality (the text is already written). The reader feels the urgency of the moment, but the motor functions are inhibited by the deep-seated knowledge that the outcome is sealed. The emotion is real; the agency is nullified by the belief in the story's fixity.

  #### C. Motor Inhibition via Contextual Cues
  Finally, we must look at the physical act of reading. Belief triggers action only when the context permits.

  If you are playing a hyper-realistic VR game and a zombie jumps out, you might scream and flinch (emotional belief), but you probably won't try to reload a real gun (motor action). Why? Because your tactile senses (holding a controller, feeling the floor) are sending "Reality File" signals that inhibit complex motor responses.

  When reading, your hands are turning pages. Your eyes are scanning ink. These physical cues keep the "Reality File" active enough to inhibit motor action (calling the cops) while allowing the "Fiction File" to dominate the emotional landscape. The illusion is strong enough to make you *feel*, but the physical context is strong enough to stop you from *acting*.

  ### 4. Why This Matters for Your Draft
  Adopting this Neo-Illusionist framework isn't just philosophical gymnastics; it changes how you write.

  If Walton is right (it's all make-believe), your job is to build a fun game.
  If Neo-Illusionism is right (it's temporary belief), your job is to **maintain the fragility of the trance.**

  1.  **Protect the Causal Severance:** Don't break the fourth wall. If you remind the reader they are outside the causal chain (e.g., meta-commentary), you remind them they can't help. Paradoxically, to make them care *more*, you must make them feel the tragedy of their own inability to intervene.
  2.  **Minimize Contextual Cues:** The "Call the Cops" objection relies on the reader noticing the book in their hand. Your prose must be transparent enough that the "ink on paper" cues fade. This is what "flow state" is. Any clunky dialogue or plot hole acts as a tactile cue that snaps them back to File A (Reality).
  3.  **Treat Emotions as Real:** Don't write "safe" fiction. If readers are forming temporary beliefs, they are subjecting their nervous systems to real stress. Respect that. The "quasi-emotion" view lets writers off the hook ("It's just a story"); the Illusion view holds you accountable ("You made them feel real grief").

  ### Summary of the Case
  Walton's theory survives because it is logically safe, not because it is true to life. The Neo-Illusionist case argues:
  1.  **Phenomenology:** The emotions are physiologically real, so the belief driving them must be real.
  2.  **Fragmentation:** We hold contradictory beliefs in different mental compartments; immersion activates the fiction compartment.
  3.  **Action:** We don't call the cops because our belief state includes the premises that (a) we are causally severed from the story world, and (b) the events are fixed/unalterable.

  You are not asking your readers to be fooled into thinking the book is reality. You are asking them to grant a specific set of propositions **temporary authority over their emotional system**, while their motor system remains safely anchored in the chair. That is not make-believe. That is a controlled, voluntary illusion. And it is the most powerful tool you have.
