answer: |-
  You have put your finger on one of the most famous and contentious fault lines in the logic of future contingents. Your intuition is shared by many logicians and philosophers (including Arthur Prior, who initially resisted supervaluationism for exactly the reasons you state).

  The short answer is: **Your friend is technically correct about the Law of Excluded Middle (LEM), but you are correct that something "classical" has been sacrificed.** It isn't exactly sleight of hand, but it does rely on a distinction between **validity** and **bivalence** that often gets glossed over in casual discussion.

  Here is the breakdown of where you stand, where she stands, and what distinction is doing the heavy lifting.

  ### 1. The Distinction: LEM vs. Bivalence
  The core of the disagreement lies in conflating two principles that classical logic usually bundles together:

  *   **The Law of Excluded Middle (LEM):** The formula $P \lor \neg P$ is logically valid (always true).
  *   **The Principle of Bivalence:** Every proposition is either True or False.

  In standard classical logic, these stand or fall together. However, supervaluationism (the Thomason/Van Fraassen approach) deliberately **decouples** them.
  *   **Your Friend's Claim:** Supervaluationism preserves LEM. The statement "There will be a sea battle or there will not" is *true*.
  *   **Your Objection:** Supervaluationism abandons Bivalence. The statement "There will be a sea battle" is neither true nor false.

  Your friend is right that she can keep LEM. You are right that she cannot keep Bivalence. The "sleight of hand" you sense is the claim that this preserves classical logic *fully intact*. It preserves classical *tautologies*, but it requires a non-classical *semantics*.

  ### 2. How the Trick Works (Supervaluation)
  To see how $P \lor \neg P$ can be true when $P$ is neither true nor false, you have to look at how supervaluationism defines truth.

  In Thomason's branching time semantics:
  1.  **The Model:** Time branches into multiple possible futures (histories).
  2.  **Truth relative to a history:** On any *single* specific history, classical logic holds. $P$ is either T or F on that history.
  3.  **Truth simpliciter (Supertruth):** A statement is "true" (settled true) at a moment only if it is true on **all** possible histories passing through that moment.

  Now apply this to the Sea Battle:
  *   Let $P$ = "There is a sea battle tomorrow."
  *   On some histories, $P$ is True. On others, $P$ is False.
  *   Therefore, $P$ is **indeterminate** (not supertrue, not superfalse).
  *   Now consider $P \lor \neg P$. On *every* history, classical logic applies, so ($P \lor \neg P$) is True on every history.
  *   Since it is True on **all** histories, it is **Supertrue**.

  So, the disjunction comes out true even though neither disjunct is true. This is possible because supervaluationism is **non-truth-functional**. In classical logic, the truth value of a compound sentence is determined solely by the truth values of its parts. Supervaluationism rejects this. The truth of the whole is determined by the behavior of the parts across all *possibilities*, not just their current truth status.

  ### 3. Where You Are Right (The Cost)
  You feel like something classical has been abandoned because it has. While all classical tautologies (like LEM) remain valid, several classical **inference rules** and **metalogical properties** fail.

  **A. Failure of Disjunctive Syllogism (in some contexts)**
  If you accept $P \lor Q$ and $\neg P$, can you infer $Q$?
  In supervaluationism, if $P$ is indeterminate, $\neg P$ is also indeterminate (not supertrue). So you can't assert the premise $\neg P$. However, there are deeper issues. If we define validity as "preservation of supertruth," some classically valid arguments fail to preserve truth when indeterminate statements are involved.

  **B. Failure of Substitution of Equivalents**
  In classical logic, if $A$ and $B$ have the same truth value, you can swap them. In supervaluationism, two statements might both be indeterminate, but swapping them in a larger context (like inside a "Definitely" operator) can change a truth value from True to Indeterminate.

  **C. The "Truth-Value Gap" Intuition**
  Your intuition ("if neither disjunct is true, the disjunction can't be true") is based on the idea that truth is a property of the current state of affairs. Supervaluationism treats truth as a property of the *entire branching structure*. You are arguing from a **presentist** or **actualist** intuition; she is arguing from a **modal** intuition.

  ### 4. Is it "Sleight of Hand"?
  It is not dishonest, but it is a specific philosophical trade-off.
  *   **The 3-Valued Logic Approach (Łukasiewicz):** Adopts your view. $P$ is indeterminate, so $P \lor \neg P$ is indeterminate. LEM is abandoned. Fatalism is blocked, but classical logic is broken.
  *   **The Supervaluationist Approach (Thomason):** Adopts your friend's view. $P$ is indeterminate, but $P \lor \neg P$ is true. LEM is kept, classical tautologies are kept, but Bivalence and Truth-Functionality are abandoned.

  Your friend is insisting that "Classical Logic" refers to the set of valid formulas (the theorems). You are insisting that "Classical Logic" refers to the semantic behavior of truth values (bivalence and compositionality).

  ### Verdict
  **You are not wrong.** Your suspicion is philosophically robust. Supervaluationism is often criticized for exactly the reason you cite: it makes truth non-compositional and allows a disjunction to be true without a true disjunct (a violation of the **Disjunction Property**).

  However, **your friend is not wrong either**, provided she clarifies that she is preserving classical *validity*, not classical *semantics*.

  **How to resolve the argument:**
  Concede that she is right that $P \lor \neg P$ comes out true under supervaluationist semantics. But hold your ground that this is only achieved by sacrificing **truth-functionality** and **bivalence**, which are core features of the classical logic she claims to be preserving.

  The most precise way to put it is this: **Supervaluationism saves the letter of classical logic (the theorems) at the expense of its spirit (bivalent semantics).** Whether that counts as "fully intact" is a matter of definition, not logic.

  **Recommendation:** Tell her you accept that supervaluationism validates LEM, but point out that it invalidates the inference from "$P \lor Q$ is true" to "Either $P$ is true or $Q$ is true." If she admits that, you've exposed the non-classical cost she was glossing over.
