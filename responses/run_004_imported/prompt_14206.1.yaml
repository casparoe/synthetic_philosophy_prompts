answer: |-
  **The Sterile Token and the Just Measure: A Teleological Defense of Aristotle's Theory of Money**

  Scholars have long fretted over a perceived fracture in Aristotle's economic thought. In *Nicomachean Ethics* Book V, money appears as a necessary solution to a problem of justice: it renders disparate goods commensurable through the metric of need (*chreia*), even if its value rests on convention (*nomos*). Yet in *Politics* Book I, money is treated with suspicion, and charging interest (*tokos*) is condemned as the most unnatural form of wealth-getting because it makes money breed money. The standard critique suggests Aristotle is inconsistent: he treats money as a real measure of value when discussing justice, but as a sterile convention when attacking usury. Some, following Marx's famous footnote, argue he was groping toward a labor theory of value but failed due to the blinders of a slave society.

  This reading, however, imposes modern economic categories onto an ancient ethical framework. It assumes Aristotle is trying to construct a descriptive theory of price formation, when he is actually constructing a normative theory of human association. The tension between *Ethics* V and *Politics* I is not a contradiction, but a coherent application of Aristotelian teleology. Aristotle's theory of money is consistent because, for him, the "conventional" nature of money does not make it arbitrary; rather, it makes it a political tool subject to natural limits. The coherence lies in understanding that money is a *nomos* instituted to serve a *physis*—the natural end of the human community. When money serves that end, it is just; when it subverts that end, it is unnatural.

  To see this, we must first correct the misunderstanding of *nomos* in the *Ethics*. When Aristotle says money exists by convention and not nature, he is not saying its value is random or purely fiat-based in the modern sense. He is distinguishing it from biological growth. A tree grows by nature; a coin circulates by human agreement. However, for Aristotle, man is by nature a political animal. Therefore, the conventions (*nomoi*) that sustain the *polis* are not opposed to nature, but are the specific means by which human nature is realized. In *Ethics* V, money solves the problem of reciprocal justice. Without a way to compare a house to a shoe, there can be no community (*koinonia*), because there can be no exchange. Money acts as a guarantee of future need. It makes *chreia* (need/demand) measurable. Here, the "conventional" aspect of money is its mechanism, but the "natural" aspect is its purpose: to bind the city together through reciprocal proportionality.

  The *Politics* does not contradict this; it polices the boundaries of this purpose. Aristotle distinguishes between *oikonomia* (household management), which acquires goods necessary for life, and *chrematistics* (wealth-getting), which acquires wealth for its own sake. Trade is a borderline case, but usury is the clear outlier. Aristotle's objection to interest is not based on a physical claim that metal cannot reproduce. It is a functional claim. The *telos* (end) of money is exchange. As he states, money was invented for exchange, not for increase. When one charges interest, one uses money for a purpose other than that for which it was conventionally instituted.

  This is where the two texts lock together. In the *Ethics*, money is justified because it facilitates the exchange required for justice. In the *Politics*, interest is condemned because it bypasses exchange entirely. In a usurious transaction, money does not mediate the exchange of goods (shoes for houses); it mediates the exchange of money for more money. This severs the link between money and *chreia*. If money is a measure of need, then generating money without generating or moving goods is a lie. It is a measure that has detached itself from what is being measured. Thus, the "unnaturalness" of *tokos* is not a physical property of coins, but a moral property of their use. It is the corruption of the convention.

  The accusation of inconsistency arises only if we view Aristotle as a proto-economist trying to define "value" in the abstract. If he were asking, "What determines price?" then oscillating between "need" and "convention" would be confusing. But Aristotle is asking, "What makes association possible and just?" In this light, *nomos* and *physis* are not rivals. The convention of money is natural to the polis because the polis is natural to man. The value of money is conventional in its substance (we agree to use gold), but natural in its function (to satisfy need).

  This reading also supersedes the Marxian interpretation. Marx argued that Aristotle could not discover the substance of value (labor) because Greek society relied on slavery, making all labor appear unequal. While historically astute, this critiques Aristotle for failing to be Marx. It assumes the "truth" of value must be a quantitative substance like labor-hours. But Aristotle's point is qualitative. The commensurability of goods is not found in the production process, but in the social relationship of the users. Two shoes are not equal to one house because of the hours worked, but because the community needs them in that proportion to sustain itself. Money measures this social need. Therefore, Aristotle did not "fail" to find a labor theory of value; he rejected the premise that value resides in production rather than in the ethical fulfillment of need.

  Consequently, the charge that Aristotle treats money as conventional when convenient and real when convenient is false. He treats it as conventional in *substance* and real in *function* consistently across both texts. In the *Ethics*, he emphasizes the substance to explain how we can adjust the measure (inflation, changing currency) to maintain justice. In the *Politics*, he emphasizes the function to explain why perverting that measure (usury) destroys the community. The "arbitrariness" of *nomisma* is exactly why it must be regulated by *nomos* (law) to ensure it serves *physis* (nature). If money were naturally valuable in itself (like food), usury might be natural. Because it is a token of social credit, using it to extract wealth without social contribution is a violation of the social contract.

  We must conclude that Aristotle's theory is a unified teleological account. The apparent tension is actually a sophisticated distinction between the *ontology* of money (a conventional token) and the *ethics* of money (a tool for communal flourishing). Interest is unnatural not because coins cannot biologically reproduce, but because it represents the autonomy of the means from the end. It is money seeking its own growth rather than the growth of the household or the city.

  To read Aristotle as inconsistent is to demand he separate economics from ethics, a distinction he would not recognize. His theory holds together because it is not a theory of markets, but a theory of justice. Money is a convention established by nature-loving animals to survive. When it tracks need, it is just. When it breeds without need, it is a monstrosity. There is no contradiction here, only a rigorous insistence that human inventions must remain servants to human ends.
