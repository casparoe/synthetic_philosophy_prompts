answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Rain streaks the window. **ELENA** (philosophy of mind, formal epistemology) stirs her tea. **MARCUS** (bioethics, decision theory) leans forward, a half-eaten bagel forgotten on his plate.*

  **MARCUS:** So, she signed it. The psychiatric advance directive. Basically a Ulysses contract. If the mania comes back, the doctors can lock her down and medicate her, even if Manic-Her is screaming that she's a deity and doesn't need pills.

  **ELENA:** It's a brave thing to do. Practically speaking.

  **MARCUS:** But?

  **ELENA:** But philosophically? It's a confession. She's signing a document that says, "I am currently rational, but I expect my future self to be irrational, and I authorize my future self to be treated as incompetent."

  **MARCUS:** That's not a confession, Elena. That's prognosis. It's Bipolar I. We know the trajectory.

  **ELENA:** It violates the Reflection Principle. Bas van Fraassen's constraint. If I know *now* that my future self will believe $X$ with probability $r$, my current credence in $X$ should also be $r$. Otherwise, I'm incoherent. A bookie could Dutch Book me. I'd take bets now against what I know I'll believe later, guaranteeing a loss. Your sister is essentially saying, "I know Future-Me will believe she doesn't need meds, but I believe she does." She's bookmaking herself.

  **MARCUS:** You're treating credence like it's static currency. It's not. It's dependent on the machinery processing it. If I know my calculator is going to glitch and tell me $2+2=5$ tomorrow, I don't align my belief with the calculator. I override it.

  **ELENA:** But *you* are the calculator. Van Fraassen addressed this exact Ulysses scenario. He argues that pre-commitment is only rational if you anticipate a change in *values*, not a change in *judgment*. If Ulysses ties himself to the mast, it's because he knows his desire structure will shift—he'll *want* to crash into the rocks. But he doesn't think his *belief* about the rocks will change. He still believes they are sharp. Your sister isn't just changing values. She's rejecting the medical reality. She's denying the evidence.

  **MARCUS:** Is she? Or is the definition of "evidence" shifting? In a manic episode, the salience of data changes. A pattern on the wall becomes more "evident" than a blood test. If Reflection assumes a stable epistemic framework, it doesn't apply to a brain that is actively rewriting its own framework.

  **ELENA:** Then you're admitting the future self isn't a rational agent. And if the future self isn't a rational agent, why does their refusal matter at all? The contract makes sense, but Reflection isn't the victim here. The victim is the idea of a unified agent over time. You're fragmenting the self to save the body.

  **MARCUS:** Maybe the "unified agent" is the fantasy. Look at the Sleeping Beauty problem. It's the classic counterexample to Reflection. Beauty wakes up. She knows she'll be woken once or twice depending on a coin flip. Her credence shifts from $1/2$ to $1/3$ without receiving any new external evidence, just by virtue of her temporal location and memory loss.

  **ELENA:** Sleeping Beauty is about indexical uncertainty and self-locating beliefs. It's a specific technical niche. It doesn't license overriding your future self's judgment on life-saving treatment. In Sleeping Beauty, no one is harmed. In your sister's case, you're saying Present-Her knows better than Future-Her. That's paternalism turned inward. What if Present-Her is wrong? What if the "mania" was actually a breakthrough, and the meds just flatten her into a grey compliance?

  **MARCUS:** Then we rely on the contract to protect the *biological* continuity, because without that, there is no agent to have any beliefs at all. You're worried about diachronic coherence of credence. I'm worried about diachronic existence.

  **ELENA:** But there's a cost to your view. If we allow Reflection to be dropped whenever we suspect "cognitive degradation," the door opens for anyone to dismiss their future self. "I'm smoking now because Future-Me will want to quit, and I know Future-Me is just being a killjoy." You lose the normative force of your future desires. Van Fraassen's point was that trusting your future self is a constitutive rule of rationality. If you break it, you aren't just making a mistake; you're opting out of the game of reasoning.

  **MARCUS:** Unless the game is rigged. Van Fraassen assumes the transition from $t_1$ to $t_2$ is epistemically neutral or evidence-driven. He has a clause for "cognitive mishaps," sure. He says if you know you'll be drunk, Reflection doesn't hold. But he treats that as an exception. I'm saying for conditions like Bipolar, the "mishap" is the rule of the disorder. It's not a bug; it's a feature of the pathology.

  **ELENA:** Okay, let's grant that. Let's say Reflection is suspended during mania. That means Present-Her is treating Future-Her like a child. Or a patient. But here's the pressure point: To sign the contract, she has to be certain the mania *is* a degradation. But how does she know that *now*? She's relying on past episodes. That's inductive. But if her current state is also slightly hypomanic—which is common in the lead-up—her diagnosis of the past is compromised. She's using the very tool she claims is broken to diagnose the breakage.

  **MARCUS:** That's the skeptic's trap. You can always say, "But how do you know you're rational right now?"

  **ELENA:** It's not skepticism. It's the Reflection Principle's demand for transparency. If I can't trust my future self, I have to be incredibly sure about *why*. Van Fraassen argues that if I expect my future self to ignore evidence, I must currently believe they are ignoring evidence. But if I believe they are ignoring evidence, I must have access to the evidence they are ignoring. Do you have access to the evidence Manic-Her will ignore? Or do you just have the consensus of psychiatry?

  **MARCUS:** I have the consensus of her lived history. She loses money. She alienates friends. She stops sleeping until her heart races. That *is* the evidence.

  **ELENA:** That's pragmatic evidence. Not epistemic evidence. Manic-Her might say, "I don't care about the friends. I've found a higher purpose." If that's a value shift, Van Fraassen says Reflection *should* hold regarding the values, but you're overriding the values too. You're saying "Higher Purpose" is less valuable than "Stable Friendships." That's a value judgment Present-Her is imposing on Future-Her.

  **MARCUS:** Because Future-Her's value system is chemically induced to prioritize short-term reward over long-term survival. It's not a genuine axiological shift. It's a hijacking.

  **ELENA:** Who decides what's a hijacking and what's a transformation? If we say "chemistry decides," then we're biological determinists. If we say "Present-Her decides," then we're tyrants over our own timeline. The Reflection Principle tries to save us from that tyranny by demanding we respect our future epistemic state. You're willing to burn that respect to keep the lights on.

  **MARCUS:** I am. Because the lights are the prerequisite for the respect. You can't have diachronic coherence if you're dead or institutionalized for ten years. But I hear you. The danger is that "rationality" becomes a tool for the status quo. Present-Her is always the "sane" one, by definition.

  **ELENA:** Exactly. And that's why the contract feels heavy. It's not just a medical form. It's a metaphysical gag order. She's saying, "I silence the voice that will speak loudest."

  **MARCUS:** Sometimes the loudest voice is the siren. Ulysses didn't tie himself to the mast because he thought the Sirens were lying about the knowledge they offered. He tied himself because he knew the *cost* of listening was the ship.

  **ELENA:** But Ulysses didn't sign a contract saying the Sirens were wrong. He just plugged his ears. Your sister is signing a paper saying the Sirens are deluded. That's a claim about truth, not just prudence. And that's where Reflection bites back. If she believes Future-Her is deluded, she must believe Future-Her is not processing truth. But if she believes that, she can't use Future-Her's anticipated beliefs to update her own. She has to isolate herself from her own future.

  **MARCUS:** Isolation might be the only way to survive the storm.

  **ELENA:** But then who comes out the other side? If you sever the epistemic link between Present and Future to save the body, is it the same person walking out of the hospital? Or just a biological successor who happens to share the name?

  **MARCUS:** *pauses, looks at the rain* I don't know. But I'd rather have a successor than a ghost.

  **ELENA:** *softly* And I worry that in saving the ghost, we lose the machine that makes it haunt.

  **MARCUS:** So we're at an impasse. You want coherence, even if it risks ruin. I want survival, even if it fractures the agent.

  **ELENA:** Not coherence for its own sake. But coherence is what makes it *her* ruin. If she's not coherent over time, whose tragedy is it?

  **MARCUS:** It's the tragedy of the organism that feels it. And right now, that organism is signing the paper.

  **ELENA:** Then let's hope Present-Her is right. Because if she's wrong, Future-Her won't be allowed to say so.

  **MARCUS:** *picks up his coffee* That's the bet. And the stakes are everything.

  **ELENA:** *raises her tea cup slightly* To Ulysses.

  **MARCUS:** To the mast.
