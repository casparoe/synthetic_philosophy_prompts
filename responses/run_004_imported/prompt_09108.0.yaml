answer: |-
  **Setting:** *A university office, late afternoon. Rain taps against the window. Two philosophers, ELENA and MARCUS, sit in worn armchairs, cups of tea cooling on the desk between them.*

  **Marcus:** You're still defending it, then? Causation by omission?

  **Elena:** I am. It's indispensable. If I say, "The lack of oxygen caused the fire to die out," I am stating a fact about the world, not a moral judgment.

  **Marcus:** But that's the trick, isn't it? You pick the easy cases. Biological or mechanical systems where the "omission" is just the cessation of a process. But take the case that started this mess: your neighbor's plants. You say her *failure* to water them caused their death. Elena, nothing happened. She sat on her sofa. She drank tea. She watched TV. The event "sitting on sofa" did not kill the plants. The *absence* of watering did. But an absence is not an entity. It has no mass, no energy, no location. How can a non-entity push a physical effect into existence?

  **Elena:** You're clinging to a billiard-ball model of causation. Pushes and pulls. But modern causal analysis isn't about transmission of force; it's about dependence. The plants died *because* water did not arrive. There is a counterfactual dependency there. If she had poured the water, the plants would live. If she had not sat on the sofa, but still not poured the water, the plants would still die. The sitting is irrelevant. The non-watering is essential. That dependency is the causal relation.

  **Marcus:** Counterfactual dependence is not causation. It's correlation with a hypothetical. Here is the reductio: If the neighbor's failure to water the plants caused their death, then *my* failure to water them also caused their death. And the Queen of England's failure. And the failure of every passing stranger. For any person $P$, if $P$ had watered the plants, they would have survived. Therefore, on your view, the death of those plants was caused by billions of distinct omissions. The causal history of a dead petunia includes the non-actions of the entire human race. That is profligate. It renders the concept of "cause" useless for distinguishing what actually happened from what merely didn't.

  **Elena:** I agree that not all omissions are causes. But that doesn't mean *no* omissions are causes. It means we need a principled way to select the relevant ones. And we can do that without smuggling in morality.

  **Marcus:** Can we? Because the moment you select the neighbor and exclude me, you aren't talking about physics anymore. You're talking about agreements. She promised you. I didn't. That is a moral fact, a normative fact. You are using causal language to describe a breach of duty. You're saying "She caused the death" when you really mean "She is to blame for the death."

  **Elena:** That is the accusation I want to reject. That "causation by omission" is just blame in a tuxedo. Let's strip the morality away. Imagine a backup generator system for a hospital. There is a primary power line and a secondary generator. The primary fails. The secondary is supposed to kick in. It malfunctions and does not kick in. Patients die due to power loss. Was the cause of the death the primary failure, or the secondary's failure to engage?

  **Marcus:** The primary failure. The absence of electricity killed them.

  **Elena:** But the electricity was absent *because* the generator didn't engage. In causal modeling, we treat the generator as a variable. If the variable is set to "ON," patients live. If "OFF," they die. The generator's failure to switch is a causal factor. Now, did the generator have a *duty*? No. It's a machine. But we still say its omission caused the outage. Why? Because it was structurally positioned as the maintenance mechanism for the system.

  **Marcus:** Ah, but there it is. "Structurally positioned." Who positioned it? Engineers with a purpose. "Purpose" is teleological. In the human realm, "positioning" someone to water plants is done via agreement. You haven't escaped the normative; you've just buried it under "system design." In the natural world, there are no backup generators. There is just what is. When you say the neighbor caused the death, you are implicitly treating her as a component in a system she only joined via a moral contract. Without that contract, she is no more a part of the plant's survival system than I am. So the causation rests on the contract. The contract is moral. Therefore, the causation is moral.

  **Elena:** You're conflating the *origin* of the causal structure with the *nature* of the causal relation. Yes, a promise might establish the structure, just as a wrench establishes the structure of a machine. But once the structure exists, the causal relations are objective. Consider a lifeboat. There is one bailer. If he stops bailing, the boat sinks. If a passenger stops bailing, nothing happens, because he wasn't holding the bucket. The bailer's omission causes the sinking. The passenger's omission does not. Is that because the bailer is "more moral"? No. It's because the bailer is the *active variable* in the physical system of buoyancy at that moment. He holds the bucket. His muscles are the mechanism. When he stops, the mechanism halts.

  **Marcus:** But in the plant case, the neighbor doesn't hold the bucket. She is in her own house. The "mechanism" is entirely in her head. It's a decision. When you say her omission caused the death, you are saying her *decision process* was the mechanism. But a decision process is governed by reasons and obligations. If I walk past a drowning child, I did not cause the drowning. If a lifeguard walks past, you say he did. The physical facts are identical: a human walked, a child drowned. The only difference is the label "lifeguard." That label is a social norm. Therefore, the difference in causal attribution is driven by social norms, not metaphysical facts. You are projecting responsibility onto the fabric of the universe and calling it causation.

  **Elena:** I deny that the physical facts are identical. You are describing the scene from too high an altitude. From a granular perspective, the lifeguard is part of a surveillance and response network. He is equipped, trained, and stationed to intervene. His presence alters the probability field of the child's survival in a way mine does not. His non-action is a deviation from the *stable equilibrium* of the system.

  **Marcus:** "Stable equilibrium"? Whose equilibrium? Nature doesn't care if the child lives. The "equilibrium" you speak of is an expectation. It is what we *want* to happen. When reality diverges from what we want, we look for someone to hold accountable. We find the lifeguard. We say his "inaction" caused the death. But really, the water caused the death. The lungs filled. The heart stopped. Those are positive events. The lifeguard's standing still is just... background. You are elevating background conditions to causal status only when it suits our need to assign blame.

  **Elena:** If it were just blame, we wouldn't use it in contexts where no one is to blame. Suppose the neighbor suffered a sudden stroke and physically could not water the plants. We would still say, "The plants died because they weren't watered." We might not blame her, but we still cite the omission as the cause. If "causation by omission" were just a disguise for blame, it should vanish when blame vanishes. But it doesn't. The causal claim remains robust even when the moral claim dissolves.

  **Marcus:** That's a clever move, but it doesn't hold. In the stroke case, we shift the causal story. We say the *stroke* caused the failure to water, and the *lack of water* caused the death. But notice: we still treat the "lack of water" as the immediate cause. Why? Because it's a convenient shorthand. It's pragmatic. It saves us from listing the infinite chain of positive events (evaporation, soil chemistry, root decay). We say "lack of water" because it highlights the point of intervention for *future* prevention. It's about utility, not truth. It tells the next neighbor what to do. It is prescriptive masquerading as descriptive.

  **Elena:** Pragmatics doesn't negate ontology. Language is always selective. If I say "The spark caused the fire," I am ignoring the presence of oxygen, the dryness of the wood, the gravity holding the air down. I select the spark because it is the *difference maker* in that context. Omissions are difference makers. The neighbor's action (or lack thereof) made the difference between life and death. The Queen's did not, because the Queen was not a variable in that local system.

  **Marcus:** And who defines the "local system"? That is the question you keep dodging. If the system is defined by physical proximity, then I am in the system if I live next door. If the system is defined by *potential to intervene*, then anyone with a car and a hose is in the system. The only thing that narrows the system down to *just the neighbor* is the agreement. The agreement is a norm. So, the boundary of the causal system is drawn by norms. If the boundary is normative, the causation within it is normative. You cannot have it both ways. You cannot have a metaphysical relation that only exists when a moral contract is signed.

  **Elena:** I can, if I view the contract not as a moral bond, but as a physical coupling. When I ask her to water the plants and she agrees, she becomes a surrogate mechanism. I have offloaded a biological requirement onto her agency. She is now functionally equivalent to an irrigation timer. If the timer breaks, we say the timer's failure caused the death. We don't blame the timer. We don't say the timer had a duty. We say it was the causal link that snapped. The neighbor is the timer. The promise is just the installation protocol. Once installed, her agency is part of the causal chain. Her failure to act is a break in the chain. That break is a real feature of the world's topology, regardless of whether we praise or blame her for it.

  **Marcus:** But a timer is a physical object. Its "failure" is a positive state of affairs—gears stripped, circuit open. The neighbor's "failure" is a state of mind *not* translating into motion. You are reifying a choice not made. You are treating "not-choosing" as a thing that exerts force. It doesn't. The force came from the sun baking the soil. The force came from entropy. The neighbor simply... didn't stop it. To say she caused the death is to say that every rescuer who fails to save everyone they could is killing them. If causation by omission is real, then inaction is indistinguishable from action in terms of causal power.

  **Elena:** No. Action introduces a new force. Omission removes a preventative force. Both are causal. If I hold a dam back, and I let go, the water floods. Did my letting go cause the flood? Yes. Was "letting go" a positive event? It was a relaxation of muscle. But the *causal work* is done by the removal of the restraint. The neighbor was the restraint on the plants' desiccation. She removed the restraint by not acting. That is a causal mechanism. It is not moral. It is hydraulic, mediated by agency.

  **Marcus:** "Removal of restraint." You see? You have to describe the omission as a positive event ("relaxation of muscle," "letting go") to make it work. But in the plant case, she didn't "let go." She just never picked up the hose. There was no restraint to remove. There was only a void where an action might have been. You are trying to fill the void with causal power because you need someone to hold. Admit it, Elena. If the plants belonged to no one, and she walked by and saw them wilting, you wouldn't say her walking past caused their death. You'd only say it if she *owed* you the water. The causation tracks the obligation.

  **Elena:** If the plants belonged to no one, they are part of the wild ecosystem. Their death is caused by drought. If I hire her to maintain a patch of wild grass, and she doesn't water it, and it dies, the cause is her omission. The ontology of the plants hasn't changed. The causal structure has, because a maintenance system was introduced. The obligation is the *signal* that the system exists, but the causation is the *functioning* (or malfunctioning) of the system. You are confusing the map with the territory. The moral duty points us to the causal variable; it does not constitute it.

  **Marcus:** But without the map, there is no territory! Without the duty, she is just a human walking past a dying object. With the duty, she is a "negligent neighbor." The category "negligent neighbor" is a moral category, not a natural kind. There are no "negligent neighbors" in the physics of the universe. There are only atoms and void. When you say she caused the death, you are speaking in the language of social kinds. I am willing to grant that it is *useful* to speak this way. It helps us coordinate. It helps us punish the right people. But let's not pretend it is metaphysics. It is ethics wearing a lab coat.

  **Elena:** And I say that human agency *is* part of the natural world. Our decisions are physical events. Our failures to decide are physical states. If we include human agency in our causal models—which we must, if we are to explain history—then omissions must be included as causal variables. To exclude them is to pretend humans are ghosts who don't interact with the physical world unless they push something. But we interact by withholding, by waiting, by refusing. These are real interactions. The neighbor's refusal to water was a physical fact of the universe that locked the plants into a trajectory of death. That is causation. Whether we call it blame is a separate question.

  **Marcus:** Then we are at an impasse. You see a world where absences have weight, where the hole in the doughnut is as real as the dough. I see a world of positive existences, where the hole is just where the dough isn't. You think you can separate the weight of the hole from the baker who intended the doughnut. I think the weight is entirely in the intention.

  **Elena:** And I think you're afraid that if you admit absences can cause, you lose the precision of physics. But you lose the reality of human life instead.

  **Marcus:** And I think you're afraid that if you admit this is just blame, you lose the objectivity of science. But you gain the honesty of morality.

  **Elena:** *(Sips cold tea)* Well. At least we agree the tea has gone cold.

  **Marcus:** *(Smiles)* Did the lack of heat cause that? Or did you just forget to ask for a refill?

  **Elena:** Don't start.

  **Marcus:** I'm just testing your theory.

  **Elena:** The cause was your stalling. A positive event.

  **Marcus:** Finally, some common ground.
