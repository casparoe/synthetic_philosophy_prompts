prompt: |-
  Okay I need a tiebreaker because me and my friend Sam argued about this for like two hours last night over drinks, and neither of us really one the argument if I'm honest. It started because of some news story about a country trying to ban a private consensual thing that isn't hurting anybody, and it spiraled into us basically re-running the whole Hart-Devlin fight from my jurisprudence seminar, except worse because we'd both had a few beers by that point.

  Sam was Team Devlin: a society basically just is its shared morality, so if something provokes real, widespread indignation and disgust in the ordinary reasonable person (Devlin's "man on the Clapham omnibus," not just a few prudes), the state is entitled to treat tolerating it the same way it'd treat tolerating treason, because letting it slide is the first domino toward everything falling apart. I kept throwing Hart's stuff back at him from Law, Liberty, and Morality - that Devlin is smuggling in a totally unproven empirical claim (the "disintegration thesis") as if it were obvious, and that he's conflating a society's actual, contingent positive morality with anything that could count as a justified critical morality worth backing up with the criminal law. Sam's comeback was that Hart never actually explains why a society is obligated to defer to some abstract critical standard that, in practice, almost nobody in that society holds. At some point we also dragged in the Dworkin line about whether "everybody's grossed out by it" is ever really a moral reason at all, as opposed to just prejudice wearing a moral position as a costume, and that somehow made things worse instead of better.

  So can you write me an essay that actually adjudicates this, instead of just listing both sides the way my seminar readings do? Reconstruct the strongest version of Devlin's argument and the strongest Hart/Dworkin-style response to it, then actually commit to an answer: is a society ever justified in using the criminal law against conduct that harms no one, purely because it is sincerely and widely felt to be intolerable? "It depends" is allowed only if you spell out exactly what it depends on and defend that condition - I don't want the kind of both-sides non-answer we were both too stubborn to give each other last night.
