  Here are two options. The first is a short story setup (best for a lunch table conversation), and the second is a quicker one-liner. Both rely on specific Parfit terminology so they won't land unless your friends actually know the material.

  ### Option 1: The Party Planner (Best for storytelling)

  "I asked a Total Utilitarian friend to help me plan my birthday party.
  I said, 'I'm thinking **Population A**: Small group, close friends, great food, good music.'
  He said, 'That's inefficient. You should aim for **Population Z**. Invite ten billion people. Cut the budget so you can only serve plain potatoes. Turn off the DJ, just play Muzak.'
  I said, 'But everyone's life will be barely worth living.'
  He said, 'Sure, but the **total utility** will be higher than your small party. Objectively, the potato world is better.'
  So I told him, 'Fine, you go enjoy the Z-World. I'll stay here in A with the steak.'
  Turns out, my moral intuition is repugnant."

  **Why this works for your group:**
  *   **Population A vs. Z:** Directly references the two ends of Parfit's spectrum.
  *   **Muzak and Potatoes:** Uses Parfit's specific imagery for "lives barely worth living."
  *   **Total Utility:** Highlights the mechanism (sum total) that forces the conclusion.
  *   **Repugnant Intuition:** Flips the name of the conclusion to describe your own refusal to accept it.

  ### Option 2: The Menu (Best for a quick punchline)

  "What's the difference between an Average Utilitarian and a Total Utilitarian at a restaurant?
  The Average Utilitarian orders the steak for two.
  The Total Utilitarian orders a billion plates of lukewarm potatoes.
  He says the **total satisfaction** is higher, even if everyone leaves hungry.
  I call it the **Repugnant Conclusion Special**."

  **Why this works for your group:**
  *   **Average vs. Total:** Explicitly contrasts the two axiologies.
  *   **Quantity over Quality:** Captures the core tension of the paradox.
  *   **Specific Naming:** Calling it the "Special" ties the abstract theory to a concrete (and silly) scenario.

  **Delivery Tip:**
  Since these are "inside baseball" philosophy jokes, deliver them dryly. Don't laugh before you get to the punchline. If there's a pause while your friends process the theory, that's normal—the laugh usually comes once they realize you correctly applied the *Mere Addition* logic to a social situation.
