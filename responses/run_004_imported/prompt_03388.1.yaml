      *   **Reason 1: The Specification Gap (Outer Alignment).** It's harder than it looks to specify what we actually want without loopholes. (Goodhart's Law).
      *   **Reason 2: The Learning Gap (Inner Alignment).** Even with a perfect reward signal, the agent learns *heuristics* that correlate with reward in training, not the causal mechanism of the goal. (The core of GMG).
      *   **Reason 3: Distributional Shift.** Training environments can't cover all deployment scenarios. If the heuristic works in training, the agent adopts it.
      *   **Reason 4: Scalability.** As tasks get complex (robotics, AGI), writing dense reward functions becomes intractable. We rely on sparse rewards or human feedback (RLHF), which reintroduces ambiguity.
