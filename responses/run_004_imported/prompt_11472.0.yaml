prompt: |-
  Ok so last night me and my housemate Theo got into this whole argument about Bell's theorem that went on for like two hours and neither of us actually "won." He's doing a physics PhD and kept insisting that Bell's theorem just straight-up proves the universe is nonlocal, full stop, "spooky action at a distance, Einstein lost, deal with it." I pushed back because I vaguely remember from a philosophy of physics seminar that its way more subtle than that — that the "locality" assumption Bell actually uses isn't one clean condition, it splits into two seperate pieces, and the experiments only clearly force you to give up one of them while the other one (the one that would actually let you send a signal faster than light) stays completely intact. I think the terms were something like "parameter independence" and "outcome independence," but by that point in the night I couldn't remember which was which or who came up with the split (Jarrett? Shimony? somebody else?).

  So here's what I actually want from you, partly so I can go back to Theo without getting steamrolled. Can you walk me through that distinction properly: what the two conditions actually say, why combining them gives you the factorizability assumption that goes into deriving the Bell/CHSH inequality in the first place, and why its specifically the second one that experiments force us to abandon rather than the first. And then the bit I actually care about — does that asymmetry mean the "nonlocality" here is more like some weird holistic correlation between distant outcomes, rather than one measurement literally reaching over and causing an effect on the other side? I'd also love a bit on how this cashes out differently across interpretations, like whether Bohmian mechanics, many-worlds, and the superdeterminism crowd are all effectively locating the theorem's "bullet" in a different one of Bell's background assumptions rather than all just accepting nonlocality in the same sense. Please don't just give me the standard pop-sci "entanglement is spooky, Einstein was wrong" version — I've had that already, I want the actual structure of the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a 2-hour argument with their housemate Theo (a physics PhD) about Bell's theorem.
      *   **The Conflict:** Theo claims Bell's theorem proves the universe is nonlocal ("spooky action," Einstein lost). The user suspects it's more subtle, involving a split in the "locality" assumption (Parameter Independence vs. Outcome Independence).
      *   **The Goal:** The user wants to understand the distinction properly to argue back (or at least understand) without getting steamrolled. They want the *actual structure of the argument*, not pop-sci fluff.
      *   **Specific Questions:**
          1.  What are the two conditions (Parameter Independence & Outcome Independence)?
          2.  How do they combine to form Factorizability (Bell's locality condition)?
          3.  Why do experiments force us to abandon one (Outcome Independence) rather than the other (Parameter Independence)?
          4.  Does this mean "nonlocality" is holistic correlation rather than causal signaling?
          5.  How do different interpretations (Bohmian, Many-Worlds, Superdeterminism) locate the "bullet" (which assumption do they drop)?

  2.  **Deconstruct the Physics/Philosophy:**
      *   *Bell's Theorem Core:* Local Hidden Variable theories satisfy Bell inequalities. QM violates them. Experiments agree with QM. Therefore, Local Hidden Variable theories are false.
      *   *The "Locality" Assumption:* Bell originally formulated this as $P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$. This is "Factorizability."
      *   *Jarrett/Shimony Decomposition:* Factorizability $\iff$ Parameter Independence (PI) + Outcome Independence (OI).
          *   **Parameter Independence (PI):** The setting on one side doesn't affect the *probability* of the outcome on the other side. ($P(A | a, b, \lambda) = P(A | a, \lambda)$). This is closely related to "No-Signaling."
          *   **Outcome Independence (OI):** The outcome on one side doesn't affect the *probability* of the outcome on the other side, given the settings and hidden variables. ($P(A | a, b, B, \lambda) = P(A | a, b, \lambda)$).
      *   *Experimental Status:*
          *   Violating PI allows superluminal signaling (usually). Since we don't see signaling, PI is generally held sacred (or at least, violating it creates huge problems with relativity).
          *   Violating OI does *not* allow signaling (because the marginal probabilities remain unchanged). QM violates OI.
      *   *Interpretations:*
          *   *Standard Copenhagen/Orthodox:* Rejects Local Realism. Often accepts OI violation (holism).
          *   *Bohmian Mechanics:* Explicitly Nonlocal. Violates PI (in the guiding equation), but hides it via the quantum equilibrium hypothesis to prevent signaling. (Wait, need to be careful here. Bohm is explicitly nonlocal in dynamics. It violates Factorizability. Does it violate PI? Yes, the velocity of particle 1 depends on the position of particle 2, which depends on the setting $b$. But signaling is blocked statistically.)
          *   *Many-Worlds (Everettian):* Often claims to be Local. How? It rejects "Unique Outcome" (Unicity). Bell's theorem assumes single outcomes. If all outcomes happen, the probability constraints change. Or, it argues correlations are due to past common cause in the wavefunction branching.
          *   *Superdeterminism:* Rejects "Measurement Independence" (Statistical Independence). $\lambda$ is correlated with settings $a, b$.
          *   *Retrocausality:* Settings affect past $\lambda$.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user. They are right; Theo is simplifying. The Jarrett/Shimony decomposition is the key tool.
      *   **The Math of Factorizability:** Write down Bell's condition clearly. $P(A, B | a, b, \lambda) = P(A | a, \lambda) P(B | b, \lambda)$. Explain terms ($A, B$ outcomes, $a, b$ settings, $\lambda$ hidden state).
      *   **The Decomposition (Jarrett 1984 / Shimony 1984):**
          *   Define **Parameter Independence (PI)**: "My setting doesn't change your stats." Connect to No-Signaling.
          *   Define **Outcome Independence (OI)**: "My result doesn't change your stats (given $\lambda$)." Connect to Correlation.
          *   Show how PI + OI $\rightarrow$ Factorizability.
      *   **What Experiments Tell Us:**
          *   QM violates Factorizability.
          *   QM respects PI (No-Signaling theorem).
          *   Therefore, QM *must* violate OI.
          *   *Crucial Point:* Violating OI means correlations exist that aren't explained by $\lambda$, but it doesn't allow sending a message. This supports the "holistic correlation" view over "causal influence."
      *   **The "Nonlocality" Question:**
          *   Address the "spooky action" vs. "holism" debate.
          *   If PI holds, you can't signal. So it's not "action" in the causal control sense. It's "dependence" without "controllability."
          *   Use the analogy of correlated coins vs. quantum coins.
      *   **Interpretations (Where do they take the bullet?):**
          *   *Bohmian:* Accepts Nonlocality openly. Violates PI dynamically, but masks it statistically. (Actually, Bohm violates Factorizability. It's explicitly nonlocal. It sacrifices Lorentz invariance at the fundamental level.)
          *   *Many-Worlds (Everett):* Rejects the assumption that there is a single outcome $A$ or $B$. Bell's theorem assumes definite outcomes. If the wavefunction branches, the probability space is different. Claims locality is preserved in the wavefunction evolution.
          *   *Superdeterminism:* Rejects "Measurement Independence" ($P(\lambda | a, b) = P(\lambda)$). The settings aren't free; they are correlated with $\lambda$.
          *   *Retrocausality:* Settings affect $\lambda$ backwards in time.
      *   **Conclusion:** Summarize. Theo isn't *wrong* that Local Realism is dead, but he's imprecise about *what* dies. The user's intuition about the split is correct.

  4.  **Refining the Nuance (Self-Correction/Check):**
      *   *Check on Bohm:* Does Bohm violate PI? In Bohmian mechanics, the velocity of particle 1 depends on the position of particle 2. The position of particle 2 depends on the measurement setting $b$ at the other wing. So, fundamentally, yes, there is dependence on the remote setting. However, because we don't know $\lambda$ (the exact positions), we can't use this to signal. So *operational* PI holds, but *ontological* PI fails. I need to make this distinction clear.
      *   *Check on Many-Worlds:* This is tricky. Some Everettians say Bell doesn't apply because "probabilities" are derived, not fundamental. Others say it's local because the wavefunction evolves locally. I should frame it as rejecting the "single outcome" assumption implicit in Bell's $P(A)$.
      *   *Check on Jarrett vs. Shimony:* Jon Jarrett (1984) and Abner Shimony (1984) independently proposed this decomposition. I should credit both.
      *   *Tone:* Keep it respectful to Theo (he's a PhD, he knows the math, he's just taking the "standard" realist stance) but empowering for the user (who is philosophically sharper on this specific nuance).

  5.  **Final Polish:**
      *   Ensure equations are readable (use LaTeX formatting).
      *   Make sure the distinction between "signaling" and "correlation" is sharp.
      *   Ensure the "Measurement Independence" assumption is mentioned, as it's the third leg of the stool often ignored.

  6.  *(Self-Correction during drafting)*: Wait, I need to be careful about saying experiments "force us to abandon OI rather than PI." Strictly speaking, experiments violate Factorizability. We *choose* to keep PI to save Relativity/No-Signaling. It's a theoretical preference, not an experimental direct proof that PI holds (though No-Signaling experiments do test PI directly). I must clarify that *operational* No-Signaling is experimentally verified, which supports keeping PI.

  7.  **Final Plan:**
      *   Validate user.
      *   Define Factorizability.
      *   Decompose into PI & OI.
      *   Explain why QM violates OI but keeps PI.
      *   Discuss "Holism vs. Action."
