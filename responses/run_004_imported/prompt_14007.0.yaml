prompt: |-
  Okay so I was arguing with my friend Alex last night about pragmatist theories of truth and it kinda fizzled out unresolved, which is bugging me. Alex's whole position was "truth is just what works, that's literally the pragmatist theory," citing James for it. I tried to push back that this flattens a real fight — that Peirce's actual account (the "opinion that would be fated to be agreed upon by everyone who investigates, in the long run" thing) is doing something pretty different from James's cash-value/satisfaction talk, different enough that Peirce got annoyed enough at what people (including James) had done to "his" word that he ditched it and started calling his own view "pragmaticism" instead, reasoning that the name was ugly enough nobody would bother stealing it. Alex thinks im just insisting on a difference that isn't really there.

  Could you write me a dialogue between Peirce and James where they actually argue this out properly instead of trading slogans? Don't worry about the framing device, have them meet wherever, post-mortem philosopher's limbo is fine. I specifically want them to get concrete: have them work through a single example, like a belief that is genuinely satisfying and "works" for someone for decades — some folk cure they credit with their recovery, say — which the community of inquirers would, given enough time, come to reject. Does James have to say that belief was true back then and became false later, or does he have some other way of blocking that move? And can Peirce's whole "final settled opinion at the end of inquiry" idea actually cash out as anything other than an idealization that's useless for judging what's true right now, today, before inquiry has ended? I want each of them to land at least one real hit on the other and to actually concede something rather than just restate their opening position twice in fancier language. Keep it fairly tight, like a page — not a full treatise.
