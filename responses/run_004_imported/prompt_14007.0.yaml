answer: |-
  **Setting:** *A smoke-filled room in the afterlife. Peirce is meticulously cleaning a pipe; James is pacing.*

  **Peirce:** You see, William, this is precisely why I coined "pragmaticism." It was ugly enough to be safe from kidnappers like you. You took a logical maxim and turned it into a license for sentimentalism.

  **James:** And you took a living theory and turned it into a scholastic corpse. Let's be concrete. Take the case of the farmer who believes his grandfather's herbal tonic cured his fever. It worked for him. He recovered, he farmed, he raised a family, he died happy. For forty years, that belief guided his actions successfully. By my account, that belief had cash-value. It was true.

  **Peirce:** But suppose chemistry later proves the tonic was inert water. The recovery was spontaneous remission. The community of inquirers, pushing investigation to its limit, settles on the opinion that the tonic did nothing. Was the farmer's belief true in 1890 and false in 1990?

  **James:** Why not? Truth *happens* to an idea. It becomes true, is made true by events. In 1890, the belief led him through experience without collision. It married well with his other beliefs. It was true then.

  **Peirce:** Then truth is merely a compliment we pay to ideas that feel good in the moment. It renders reality subordinate to individual satisfaction. If truth changes with the calendar, it isn't truth; it's expediency. My definition—the opinion fated to be agreed upon in the long run—protects us from this. It anchors truth in a reality independent of what you or the farmer *wish* to be the case.

  **James:** But there's the rub, Charles. The "long run." It's a messianic hope. It's nowhere. If I'm standing here today, trying to decide whether to trust a doctor or a faith healer, your "final opinion" offers me no guidance. It's an idealization that collapses under the weight of the present. You've defined truth out of reach of any living soul.

  **Peirce:** *(Pauses, tamping tobacco)* I grant you... it is not a description of what we possess now. It is a regulative ideal. It doesn't tell you what *is* true today, but it dictates the *method* you must use to seek it. Without that anchor, your "what works" allows the farmer to ignore biology because ignorance makes him happier.

  **James:** And I grant you... "what works" cannot mean mere individual whim. If the tonic belief prevents him from accepting vaccination later, it stops working. It clashes with the wider web of experience. I shouldn't have let my followers think "satisfaction" meant private comfort. It must mean satisfaction of the *whole* demand of experience.

  **Peirce:** Then you are conceding that there is a constraint outside the individual mind. A reality that pushes back.

  **James:** I'm conceding that truth needs coherence, not just utility. But you must concede that your "final opinion" is a theological surrogate. You want a guarantee that inquiry won't be futile. That's faith, not logic.

  **Peirce:** *(Lights pipe)* Perhaps. But without that faith, inquiry lacks the courage to persist against immediate utility. You saved the spirit of philosophy from logic-chopping, William, but you risked losing the reality.

  **James:** And you saved reality, but risked making it useless for living. It seems we needed each other's errors to find the middle ground.

  **Peirce:** Indeed. Though I still maintain "pragmaticism" is the superior term.

  **James:** *(Laughs)* Ugly enough, certainly. But nobody steals it.
