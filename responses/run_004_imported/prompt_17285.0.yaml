answer: |-
  **Headline:** The Coin, The Crowd, and The Conscience
  **Subtitle:** John Taurek changed rescue ethics by arguing numbers shouldn't count. But does his own logic demand that they do?

  In 1977, the philosopher John Taurek published a paper titled *"Should the Numbers Count?"* It was a grenade tossed into the quiet garden of moral philosophy. The prevailing wisdom, inherited from utilitarianism, was intuitive: if you can save one person or five, you save the five. To do otherwise seemed like a mathematical error in morality.

  Taurek disagreed. He argued that there is no "super-entity" called "the group" that suffers when five people die. There are only five individuals, each suffering their own complete loss. Since one person's death is not "less bad" than five deaths in any aggregatable sense, the rescuer has no obligation to save the greater number. Taurek's proposed solution was radical in its symmetry: flip a coin. Give each group a 50 percent chance of survival, regardless of size.

  For decades, philosophers have battered Taurek's argument. Utilitarians call it cold; contractualists call it unfair. But the most damaging critique comes from those who accept Taurek's premises but reject his conclusion. They argue that Taurek's own commitment to the "separateness of persons" and "equal concern and respect" actually traps him. If you take Taurek seriously, these critics say, you shouldn't flip a coin between the groups. You should run a weighted lottery.

  Here is the case that Taurek betrayed his own principles, and the staunch defense of why he didn't.

  ***

  ### The Internal Indictment: Why Equal Concern Demands Weighted Odds

  The strongest argument against Taurek is not that he is wrong about morality, but that he is wrong about math. Specifically, the math of *individual* fairness.

  Taurek's moral engine runs on two cylinders: the **separateness of persons** (groups don't feel pain, people do) and **equal concern and respect** (every individual's claim to life is of equal weight). The critique argues that a flat coin flip between groups violates the second cylinder in service of a misunderstanding of the first.

  Imagine you are the rescuer. On your left is Person A. On your right are Persons B, C, D, E, and F. You have enough medicine for only one side.

  If you follow Taurek and flip a coin between the *groups*, you give Group A a 50% chance and Group B a 50% chance. But look at this from the perspective of the individuals, which Taurek insists we must do.
  *   Person A has a **50%** chance of survival.
  *   Person B has a **25%** chance (50% divided by 2).
  *   Person C, D, E, and F each have a **10%** chance (50% divided by 5).

  By treating the *groups* equally, Taurek treats the *individuals* unequally. Person A's life is effectively valued five times higher than Person F's life, simply because A happened to be standing alone.

  Philosophers like Peter Saunders and Michael Otsuka have pressed this point: If you truly believe in the separateness of persons, you cannot let an individual's odds of survival be diluted by the presence of others in their vicinity. To show "equal concern and respect" to every individual means giving every individual an equal *ex ante* probability of being rescued.

  The only way to achieve this is a weighted lottery. You put one ticket in the drum for Person A, and one ticket for each person in Group B. Now there are six tickets. Person A has a 1-in-6 chance. Each person in Group B has a 1-in-6 chance. The groups are no longer equal (Group B is five times more likely to be saved), but the *individuals* are.

  This preserves Taurek's anti-utilitarianism. You are not *obligated* to save the five. It is still possible, via the lottery, that the one is saved. You haven't aggregated value to say "five lives > one life." You have simply acknowledged that there are five distinct claims on your right and only one on your left. To ignore the number of claims is to ignore the number of people.

  In this view, Taurek's coin flip is a category error. He wanted to protect individuals from being swallowed by the collective, but in doing so, he allowed the collective to swallow the individual's chance. A weighted lottery is the only mechanism that respects the atomic nature of human beings. It counts the people without counting the "utility." It is the true mathematical expression of the separateness of persons.

  ***

  ### The Taurekian Defense: The Integrity of the Choice

  A committed Taurekian does not flinch at the charge of unequal individual odds. They argue that the critics have misunderstood the nature of the moral dilemma. The dispute isn't about arithmetic; it's about the structure of the choice itself.

  The Taurekian reply begins by rejecting the "raffle ticket" model. In a lottery, we are distributing a good among claimants. But rescue is not a distribution problem; it is a **conflict of claims**.

  When I stand before the burning building, I am not facing six separate individuals asking for help. I am facing two mutually exclusive *situations*: I can bring about Situation A (A lives, B-F die) or Situation B (B-F live, A dies). I cannot act upon "Person F" without acting upon "Group B." The physical reality of the rescue binds the individuals on the right into a single unit of agency, not because they form a super-person, but because my action cannot distinguish between them.

  The Taurekian argues that "equal concern" does not mean equalizing statistical probabilities across the board. It means acknowledging the symmetry of the *loss*.

  Consider the complaint from Person F: "Why do I only have a 10% chance while Person A has 50%?"
  The Taurekian answer is: "Because Person A represents a complete world of loss, just as the group of B-F represents a set of complete worlds of loss. But my choice is not between you and A. My choice is between *saving A* and *saving B-F*."

  To weight the lottery is to implicitly accept that the *sum* of the claims on the right outweighs the claim on the left. Taurek denies this is possible. There is no scale on which you can place "five losses" against "one loss." There is only the fact that A will suffer a total loss, and B will suffer a total loss. The fact that C, D, E, and F will *also* suffer total losses does not make B's loss "heavier." It just means more people are sad.

  If you weight the lottery, you are saying that C's death adds moral weight to B's claim against A. Taurek says this violates the separateness of persons. C's death is C's business. It cannot be transferred to B to strengthen B's bid for the medicine. C cannot lend his moral weight to B.

  Therefore, the only way to show respect to A, without violating the separateness of B, C, D, E, and F, is to acknowledge that the claim of the one (A) is incommensurable with the claim of the many (B-F). They are on different planes. Since we cannot compare the weight of the claims, we must treat the *options* as equal.

  A fair coin flip is the only procedure that admits this ignorance. It says: "I recognize A's claim is absolute. I recognize B's claim is absolute. I cannot add B+C+D to make a 'super-claim.' Therefore, I must choose between the options with equal regard."

  To the Taurekian, the weighted lottery is a sleight of hand. It pretends to respect individuals while actually aggregating their claims to tilt the odds. It smuggles utilitarianism in through the back door of probability. The coin flip is the harder, more honest path. It accepts that in a tragic choice, fairness is about the procedure of decision, not the statistical distribution of hope.

  ***

  ### The Unresolved Equation

  The debate between the weighted lottery and the Taurekian coin flip remains one of the most stubborn stalemates in ethics. It forces us to choose between two compelling intuitions: that every individual should have an equal shot, and that no individual's death can be used to outweigh another's.

  For the magazine reader, the stakes are higher than a thought experiment. This is the logic underlying triage protocols in emergency rooms, the programming of autonomous vehicles, and the allocation of scarce vaccines during a pandemic. Do we maximize the number of survivors (utilitarianism), give every human an equal statistical chance (weighted lottery), or treat every rescue scenario as a unique, non-aggregatable conflict (Taurek)?

  Taurek offered us a coin to resolve the tension. His critics handed it back, weighted with lead. Neither side has managed to pocket the change. We are left standing on the shore, watching the lifeboat drift, still unsure if the math of morality should be counted by the head, or by the heart.
