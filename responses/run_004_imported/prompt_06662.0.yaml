      *   **Section 4: Lewis's Own Nuance.** Lewis actually suggests the doctrine might be *true* even if our concepts don't fit, or that our concepts are the problem.
      *   **Conclusion:** Summarize. The argument shows PSA is *counter-intuitive* relative to human justice, not *incoherent* relative to divine justice.

