      *   **Audience:** 1/3 Historians/Colleagues (will catch the nuance), 2/3 Family/Neighbors (need comfort, don't know the history).
      *   **Goal:** A eulogy that embodies her philosophy without being an academic lecture. It must offer comfort without betraying her intellectual integrity (no "fate" or "destiny"). It needs to be loving and accessible.
      *   **Tone:** Respectful, warm, intellectually honest, comforting but not clichéd.

  2.  **Determine the Central Metaphor/Theme:**
      *   The tension is between *Fate* (comforting but false to her) and *Chance/Choice* (true to her but potentially unsettling in grief).
      *   *Solution:* Reframe "Contingency" not as cold chaos, but as the space where *love* and *agency* live. If things aren't inevitable, then every moment of kindness was a *choice*, making it more precious, not less.
