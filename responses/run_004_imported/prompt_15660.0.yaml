  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, establish the relationship (mother/child), and set the tone. Avoid "she's in a better place" tropes.
      *   **The Work (The Hook):** Introduce her career simply. Don't get bogged down in historiography. Focus on *why* she cared about 1914. She cared about the moments where things *could have gone differently*.
      *   **The Philosophy (The Bridge):** Connect her historical view to her life view. If history isn't a train on a track, then life is a series of open doors. This is where the colleagues nod and the family feels the weight of her choices.
      *   **The Personal (The Heart):** Apply this to the speaker's life. How did she treat *us*? She didn't treat us as inevitable outcomes. She nurtured choices. The "wrong turns" in our lives she supported.
      *   **The "Fatalism" Constraint:** Explicitly address the "meant to be" cliché she hated, but gently. Turn it around. Her death isn't "meant to be," it's a loss. But her life was a series of chosen goods.
      *   **Closing:** A farewell that honors her agency. Not "rest in peace" (passive), but "thank you for what you did" (active).

  4.  **Refining the Content (Self-Correction during drafting):**
