answer: |-
  Thank you all for being here.

  For those of you who knew my mother best, you know that she was a woman who paid very close attention to how things happen. She spent her life studying the summer of 1914. Specifically, she studied the weeks between the assassination in Sarajevo and the outbreak of the First World War.

  To most of us, that war feels like a landslide. Something massive, inevitable, that once it started, couldn't be stopped. There is a old idea in history that says once the trains started moving, once the mobilization schedules kicked in, the war was unavoidable. That the world was on a track, and we were just passengers.

  My mother spent forty years arguing that that was wrong.

  She taught that the war wasn't a landslide; it was a series of doors. Doors that closed, yes, but doors that stayed open much longer than we think. She wrote about the driver who took a wrong turn onto Franz Josef Street, putting the Archduke right in front of an assassin who had already given up. She wrote about the marginal notes in the Kaiser's diary, looking for a way out. She taught that peace was possible at four or five different moments that summer.

  She cared about this not because she loved argument, but because she believed that saying "it had to happen" is a way of letting people off the hook. If everything is fate, then no one is responsible for the choices they make. And conversely, if everything is fate, then the good things we do don't really belong to us, either.

  I mention this because I know my mother would be unhappy if I stood here and told you that she was "meant to leave us." Or that "her time had come."

  She used to elbow me in the pew at funerals when she heard people say that. She'd whisper, "No one's time comes. We just run out of time."

  She was right. And acknowledging that is painful. It is easier to believe in a plan, to believe that there is a script we are all following. It offers a certain kind of comfort to think that her death was necessary, part of a larger design.

  But my mother found a deeper comfort in the truth. And the truth is: her life was not a script. It was a series of choices.

  If the world is not a train on a track, if the future is not written, then every act of kindness is a miracle of contingency. She didn't love us because the universe told her to. She didn't raise me to be a philosopher, or help her neighbors, or grade papers until midnight because it was her destiny. She did it because, in a world of infinite possibilities, she *chose* to.

  In a world where things could have gone otherwise, her love stands out not as a certainty, but as a gift.

  I think about that wrong turn on Franz Josef Street. A tiny accident that changed the world. My mother taught me to look for the other turns. The turns we don't notice until later. The time she stayed up to listen when I could have been alone. The time she traveled across the ocean to sit with a friend who was sick. The time she forgave a slight that she could have held onto.

  None of that was inevitable. None of it was written in the stars. It was just her. Navigating the open water.

  To her colleagues here: We have lost the sharpest mind on the July Crisis. We have lost the person who reminded us that agency matters, even in the face of great structures.

  To her family and friends: We have lost the person who made sure we knew we were loved by choice, not by obligation.

  I know many of you are looking for a reason for this. I can't give you one. My mother didn't believe in false comforts, and I won't offer one now. It is not right that she is gone. The world is dimmer for it.

  But if she were here, she would tell us not to look for the inevitability in the past, but to look at the possibilities in the future. She would tell us that because nothing is guaranteed, the time we had with her is more precious, not less. It wasn't a down payment on eternity. It was the thing itself.

  So, I will not say she is at peace, as if she is resting from a journey she was destined to finish. I will say this: She navigated her time well. She kept the doors open as long as she could. She chose us, again and again, in a world that didn't require her to.

  And for that choice, we are who we are.

  Thank you, Mom. For the wrong turns, the right turns, and for teaching us that the road isn't fixed until we walk it.
