answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the honor of being Priya's Maid of Honor.

  If you're a parent or a cousin of the couple, you probably think Priya and Marcus are just very organized. You think they use shared Google Calendars and color-coded spreadsheets. And you're right. But if you're in the other third of this room—the ones who know that their first date was a debate on population ethics—you know the truth.

  Priya and Marcus don't just make decisions. They convene a Moral Parliament.

  For the uninitiated: when they disagree, they don't compromise. They assign credences. Utilitarianism gets forty percent of the vote; Kantian deontology gets thirty; virtue ethics takes the swing seats. That is unironically how they picked this venue. And yes, Marcus, we all know that's also how you decided to have a baby.

  Now, I mention this because last night at the rehearsal dinner, my friend Jae and I got into a heated argument about this framework. We were shushed by the waiter, which is a bad omen, but I stand by my position.

  Jae's position was that the Parliament is mathematically bogus. He argued that you can't compare "choiceworthiness" across theories that don't even agree on what makes something good. He said assigning votes is fake precision, like averaging a temperature and a distance and calling it a number.

  And look, I have to concede a point to the philosophers in the room: **Jae is technically right that intertheoretic value comparisons are metaphysically suspect, and you can't cardinalize ordinal preferences across distinct normative frameworks.**

  There. I said it. Can we move on to the cake?

  But here is what I realized while I was losing that argument: It doesn't matter if the math is shaky. Because the "Moral Parliament" was never about the calculation. It's about the convening.

  In a world where most couples shout over each other, Priya and Marcus built a system that *forces* them to listen. They built a ritual where they have to articulate not just what they want, but *why* it matters to them. They have to respect the opposing view enough to give it a vote.

  Yes, the framework might be resting on something shaky. But so is marriage. So is trust. So is the promise that you'll still love each other when you're old and grumpy and disagreeing about where to spend Christmas.

  The specific ethical theory doesn't matter. What matters is that when the lights go down and the spreadsheets are closed, they still choose each other. They choose to show up. They choose to do the hard work of understanding the other person's worldview, even when it's inconvenient.

  So, if the philosophy in this room is worried about the coherence of their utility functions, don't be. Because I've seen the data. And the expected choiceworthiness of their life together is off the charts.

  Please raise your glasses. To Priya and Marcus: May your credences be well-calibrated, your disagreements be productive, and your love be the one thing you never have to quantify.

  To Priya and Marcus!
