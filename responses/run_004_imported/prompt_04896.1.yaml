      *   *Check:* Is the distinction between "making up" and "making up people" clear? *Correction:* Use Hacking's phrase "Making Up People."

  7.  **Final Polish:** Ensure the distinction between "ontological reality" (does it exist?) and "historical ontology" (how did it come to exist?) is clear without being too dense. (Decided to keep "historical ontology" as a bonus term but explain it simply).

