answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Association General Assembly
  **FROM:** Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Electoral Procedure Reform

  **Recommendation**
  The Governance Committee recommends the adoption of **Instant-Runoff Voting (IRV)**, also known as Ranked-Choice Voting, for all GSA executive elections. Under this procedure, voters rank candidates in order of preference (1st, 2nd, 3rd). If a candidate receives a majority of first-choice votes, they win. If not, the candidate with the fewest votes is eliminated, and their votes are transferred to those voters' next-ranked choices. This process repeats until one candidate commands a majority. This system eliminates the "spoiler effect" observed in our recent election by ensuring the winner has broad support, without requiring a separate, low-turnout runoff election.

  **Theoretical Trade-offs: Arrow's Impossibility Theorem**
  As political science students, we recognize that no voting system is mathematically perfect. Arrow's Impossibility Theorem proves that no ordinal ranking system can simultaneously satisfy four fairness criteria: Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives (IIA). To have a functional election, we must sacrifice one.

  Our recommendation explicitly sacrifices **Independence of Irrelevant Alternatives (IIA)**. IIA dictates that the relative ranking between two candidates should not change if a third, losing candidate is added or removed. In IRV, the elimination order can theoretically change the winner if a non-viable candidate enters the race. We defend this as the least costly sacrifice because satisfying IIA is mathematically incompatible with producing a decisive majority winner in a multi-candidate field. Sacrificing IIA is preferable to violating Pareto Efficiency (electing a candidate everyone ranks lower than another) or Non-Dictatorship. Given the Assembly's constraint that the system must be decisive and majoritarian, IIA is the only condition we can theoretically afford to lose.

  **Adherence to Assembly Constraints**
  1.  **Explainability:** As demonstrated above, IRV can be explained in a single paragraph. More complex systems that satisfy stronger fairness criteria, such as Condorcet methods (e.g., Schulze or Minimax), require explaining pairwise matrices and cycle resolutions, which violates the Assembly's clarity constraint.
  2.  **Resistance to Manipulation:** While the Gibbard-Satterthwaite theorem proves all ordinal systems are susceptible to some strategic voting, IRV significantly reduces the incentive for "compromising" (voting against your favorite to stop a hated candidate) compared to Plurality. It prevents organized slates from splitting the opposition vote to install a minority-preferred winner, addressing the specific failure of our last election.

  **Objections and Vulnerabilities**
  We must give a fair hearing to the strongest objection against IRV, particularly raised by colleagues who favor more robust Condorcet methods. The primary critique is that **IRV does not guarantee the election of the Condorcet Winner**—the candidate who would beat every other opponent in a head-to-head contest. In a "center-squeeze" scenario, a broadly acceptable moderate can be eliminated early for lacking passionate first-choice support, even if they would have defeated the eventual winner one-on-one.

  Furthermore, while IRV reduces manipulation, it does not eliminate it. In tightly contested elections, voters may still have an incentive to "bury" a strong competitor by ranking them last, or slates may attempt to flood the field with clone candidates to manipulate elimination orders. However, given the Assembly's strict requirement for simplicity, Condorcet methods are too opaque for our membership to trust or audit effectively. IRV represents the optimal balance: it solves the immediate vote-splitting crisis, adheres to the transparency constraints, and accepts the IIA violation as the necessary theoretical cost of a practical, majoritarian democracy.

  The Committee moves to adopt this procedure immediately to ensure fairness before spring nominations.
