answer: |-
  Your intuition is sharp, and your skepticism is well-founded. You have identified what is arguably the deepest fissure in the Bayesian account of scientific rationality. The Garber-Jeffrey-Niiniluoto (GJN) solution is widely taught as the resolution to the Problem of Old Evidence (POE), but as you suspect, it functions more as a *psychological* patch for non-ideal agents than a *logical* resolution for the normative theory of confirmation.

  Below, I construct the case for your conclusion: that the GJN maneuver fails to dissolve the POE in principle because the structural difficulty re-emerges for any agent satisfying the standard axioms of logical omniscience. I will then engage the "incoherence" rejoinder and outline what remains for a Bayesian committed to ideal rationality.

  ### I. The Formal Case: Why GJN Fails the Ideal Agent

  To make this precise for a probability theorist, we must distinguish between the **Dynamic Problem** (how credences change over time) and the **Static Problem** (the logical relation of support between propositions at a time).

  **1. The Ideal Bayesian Agent (IBA)**
  Let an IBA be defined by a probability function $P$ over a language $\mathcal{L}$ satisfying the Kolmogorov axioms plus the **Logical Omniscience (LO)** constraint:
  $$ \text{If } A \models B, \text{ then } P(B|A) = 1 \text{ and } P(A \to B) = 1. $$
  Furthermore, for any proposition $E$ in the agent's background knowledge $K$, $P(E|K) = 1$.

  **2. The Static POE for the IBA**
  Consider the hypothesis $H$ (General Relativity) and evidence $E$ (Mercury's perihelion shift).
  In the actual historical context, $E \in K$. Thus, $P(E) = 1$.
  Since $H \models E$, by LO, $P(E|H) = 1$.
  The standard Bayesian measure of confirmation is the relevance criterion: $E$ confirms $H$ iff $P(H|E) > P(H)$.
  By Bayes' Theorem:
  $$ P(H|E) = \frac{P(E|H)P(H)}{P(E)} = \frac{1 \cdot P(H)}{1} = P(H). $$
  For the IBA, $E$ provides zero confirmation to $H$. The posterior equals the prior. The anomaly of Mercury is probabilistically inert regarding GR.

  **3. The GJN Maneuver**
  GJN propose expanding the language $\mathcal{L}$ to include logical propositions. Let $L$ be the proposition "$H$ entails $E$" (formally, $H \to E$).
  They argue agents are not logically omniscient, so initially $P(L) < 1$.
  When Einstein derives the field equations, the agent learns $L$.
  The update is not on $E$ (which is fixed at 1), but on $L$.
  $$ P_{new}(H) = P_{old}(H | L). $$
  Since $P_{old}(H|L) > P_{old}(H)$ (typically), $H$ is confirmed.

  **4. The Failure for the IBA**
  Your critique strikes here. The GJN solution works *only* by violating the LO constraint.
  For an IBA, $P(L) = 1$ at all times $t_0$ and $t_1$. There is no $P_{old}(H | \neg L)$ to condition against, nor is there a shift from $P(L) < 1$ to $P(L) = 1$.
  Consequently, for the IBA:
  $$ P_{new}(H) = P_{old}(H | L) = P_{old}(H). $$
  The IBA cannot model the confirmatory boost of GR via Mercury.

  **5. The Normative Implication**
  If Bayesian Confirmation Theory (BCT) is merely a descriptive model of human psychology, GJN suffices. But BCT claims to be a **normative** theory of scientific rationality. It purports to tell us why scientists *ought* to accept GR given Mercury.
  If the ideal limit of rationality (the IBA) cannot reconstruct this inference, then BCT fails to capture the *logic* of confirmation. It reduces confirmation to a byproduct of logical ignorance. This implies that a perfectly rational being would be unable to recognize that GR is supported by Mercury, which is absurd. The support relation should hold independently of the agent's computational limitations.

  Therefore, GJN masks the problem for humans but leaves the ideal theory bankrupt. The structural difficulty is not about *learning* entailments; it is about the **rigidity of conditionalization** when $P(E)=1$.

  ### II. Engaging the Rejoinder: "The Incoherence Objection"

  Your friend from the physics department likely relies on what I call the **Incoherence Objection**. It runs as follows:

  > "You are asking what an Ideal Bayesian Agent *learns* about logical entailments. But by definition, an IBA already knows all logical truths. To posit an IBA 'learning' $H \to E$ is to posit a contradiction in terms ($P(L) < 1$ and $P(L)=1$ simultaneously). Since the scenario is incoherent, the Bayesian owes no account of it. The theory is only defined for coherent scenarios."

  **Does this rejoinder succeed?**
  No. It succeeds only by retreating from a theory of **confirmation** to a theory of **belief updating**.

  **1. Confirmation vs. Updating**
  The Incoherence Objection conflates *dynamic rationality* (how to change beliefs when receiving new data) with *static support* (how propositions relate logically).
  Scientists do not merely ask, "How should I change my mind today?" They ask, "Does this theory explain the data?"
  The latter is a structural question about the relationship between $H$ and $E$. It should not depend on *when* the agent learned $E$.
  If the Incoherence Objection stands, Bayesianism admits it has no account of *static support* for known evidence. It can only account for *surprise*. This reduces scientific confirmation to a history of surprises, rather than a logical assessment of explanatory power.

  **2. The Trivialization of Science**
  If the Bayesian says, "My theory only applies to agents who don't know the logic of their own hypotheses," they effectively exclude mature sciences from their domain. In mature physics (like your field), $E$ is often well-established (e.g., conservation laws, spectral lines) before $H$ is proposed.
  If the ideal theory cannot handle this, it is not a theory of scientific inference; it is a theory of guesswork under ignorance.

  **3. The "Logical Learning" Category Error**
  The rejoinder assumes that logical relations are not proper objects of probabilistic support. But in the GJN framework, they *are* treated as propositions ($L$). If they are propositions, an IBA must assign them probability 1. If the Bayesian says "IBAs don't assign probabilities to logical relations," they are abandoning the universality of the probability calculus. If they say "IBAs do, but they never update on them," they admit that **confirmation via old evidence is impossible for ideal reasoners.**

  Thus, the Incoherence Objection does not dissolve the problem; it merely stipulates that the problem lies outside the theory's scope. This is an admission of defeat regarding the normative ambition of Bayesianism.

  ### III. What Should a Bayesian Committed to Logical Omniscience Say?

  If we reject GJN as merely a pragmatic fix for non-ideal agents, and we wish to retain Logical Omniscience (as many formal epistemologists do to keep the mathematics tractable), we must find a different route to account for the confirmatory power of old evidence.

  Here are the two most viable options for a Bayesian who wants to retain LO:

  **1. The Counterfactual (Ur-Prior) Strategy (Howson)**
  Proposed by Colin Howson, this approach suggests we evaluate confirmation not by actual updating, but by **counterfactual updating**.
  To determine if $E$ confirms $H$ for an agent with background $K$ (where $E \in K$), we construct a counterfactual prior $P_0$ representing the agent's state *had they not known $E$*.
  We then check if $P_0(H|E) > P_0(H)$.
  *   **Advantage:** It preserves LO. The agent is ideal at time $t$, but we simulate a non-ideal state to test the support relation.
  *   **Difficulty:** It requires a principled way to "subtract" $E$ from $K$ without altering other relevant probabilities (the problem of *holism*). Removing knowledge of Mercury's orbit might change our knowledge of telescopic reliability or Newtonian mechanics. There is no unique way to define $K^{-E}$.
  *   **Verdict:** This is the strongest defense for the LO-Bayesian. It acknowledges that confirmation is a relation between $H$ and $E$ relative to a *corpus*, not necessarily a historical update.

  **2. The Explanatory (Likelihood) Strategy**
  Some Bayesians argue we should focus on the **Likelihood Ratio** rather than the posterior shift.
  $$ \text{LR} = \frac{P(E|H\&K)}{P(E|\neg H\&K)} $$
  Even if $P(E|K) = 1$, it may be that $P(E|H\&K) = 1$ while $P(E|\neg H\&K) \ll 1$ (or requires fine-tuning).
  *   **Advantage:** It captures the intuition that $H$ *predicts* $E$ precisely, while rivals do not.
  *   **Difficulty:** Standard Bayesianism ties confirmation to the change in $P(H)$. If $P(H)$ doesn't change, calling it "confirmation" requires redefining the term. However, one could argue that the *reason* we assign a high prior to $H$ in the first place (or why we accept it) is precisely this likelihood ratio, even if the formal update on $E$ is null.
  *   **Verdict:** This moves Bayesianism closer to Inference to the Best Explanation (IBE). It suggests that the "confirmation" happened when $H$ was formulated *because* it was known to entail $E$, not when $E$ was observed.

  ### Conclusion

  Your assessment is correct. The Garber-Jeffrey-Niiniluoto solution resolves the Problem of Old Evidence only by **changing the subject** from the logical relation of confirmation to the psychological process of learning logical truths.

  For an Ideal Bayesian Agent, the problem remains unsolved: $P(H|E) = P(H)$. The Incoherence Objection fails because it protects the formalism by sacrificing its applicability to scientific practice, admitting that ideal rationality cannot account for one of the most famous confirmations in physics.

  If you wish to remain a Bayesian while respecting logical omniscience, you must adopt a **counterfactual account of support** (like Howson's). You must argue that confirmation is not what happens to your beliefs when you learn $E$, but what *would* happen to your beliefs if $E$ were uncertain. This preserves the normative force of the theory: it tells us that the support relation exists objectively, even if our actual credences (being conditioned on known facts) cannot dynamically reflect it.

  As a physicist, you might view this as analogous to a coordinate transformation. The physical reality (the support of GR by Mercury) is invariant, but the Bayesian formalism requires us to shift to a "counterfactual frame" where $E$ is not fixed to see the vector of confirmation. The GJN solution merely claims the vector doesn't exist in the ideal frame, which is why it feels unsatisfactory to a scientist who knows the support is real.
