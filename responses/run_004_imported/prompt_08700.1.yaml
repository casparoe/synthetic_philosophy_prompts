  Hey, I'm putting together a collection of short stories, each built around a philosophical idea I find genuinely unsettling, and the next one I want to tackle is Al-Ghazali's occasionalism. I've been reading the bit in the Tahafut where he argues fire has no actual power to burn cotton -- God just habitually creates the burning at the same moment as the contact, so theres no necessary link between the two, and that's also how he explains miracles (a prophet standing in fire and not burning is just God breaking his own custom for a moment). Could you write me a short story, maybe 1200-1800 words, set in an ordinary modern-day setting, where a character slowly notices that the "customary" links between cause and effect around them are starting to fray? Don't have anyone in the story actually say "occasionalism" or "Ghazali" out loud -- i want the idea embedded in what happens, not spelled out in a lecture.
