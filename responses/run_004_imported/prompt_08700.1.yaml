answer: |-
  Arthur lived his life by the comfort of the latch. He liked the specific click of the deadbolt sliding home, the reliable resistance of the car door handle, the way the toaster lever stayed down until the heat popped it back up. He was a man who believed in the architecture of consequence. You put the key in, you turned, the engine started. You pressed the switch, the light filled the room. It was a boring philosophy, perhaps, but it was the mortar that held the bricks of his Tuesday mornings together.

  The first fracture happened over coffee.

  It was 7:14 AM. Arthur stood in his kitchen, the ceramic mug warm in his left hand, the kettle heavy in his right. He poured. The water cascaded over the grounds, darkening them, swelling the bloom. He set the kettle down and lifted the mug to his lips. He blew across the surface, expecting the sting of steam, the reflexive pull-back of his head.

  The steam rose, curling in lazy ribbons, but the air against his lips was room temperature.

  Arthur paused. He looked at the mug. The liquid inside was visibly agitated, tiny bubbles breaking the surface, behaving exactly as boiling water should. He touched the side of the ceramic. It was cool. Not lukewarm—cool, like it had been sitting on the counter for an hour. He took a sip. It scalded his tongue.

  He dropped the mug. It hit the linoleum with a solid thud but did not break. The coffee splashed out, staining his socks, burning his skin where the liquid touched, yet the floor remained dry. The puddle sat on top of the tiles like a sheet of plastic, refusing to soak in.

  Arthur stood there, breathing hard, watching the steam rise from a cold cup. He wiped his foot with a towel, and the towel remained dry. The water was there, wetting his skin, but it had forgotten how to wet the cloth. He cleaned it up with a sponge, watching the liquid vanish into the porous yellow surface without leaving a trace of dampness. He told himself it was a trick of the light, a nerve glitch, a momentary lapse in sensory processing. He went to work.

  The subway was crowded, the air thick with the smell of ozone and unwashed wool. Arthur held the overhead strap. When the train lurched around a bend, the usual centrifugal force failed to pull him outward. He sway ed, but his body felt light, unmoored from the momentum of the car. Beside him, a woman dropped her phone. It fell in slow motion, not floating, but descending with a hesitant stutter, as if the space between the hand and the floor had become粘稠，thick with invisible syrup. It hit the ground with a sound like a wooden block tapping a table, not the sharp crack of glass on metal. The screen didn't crack. The woman picked it up, looked at it, and put it in her bag without expression. She hadn't noticed. Or she had noticed, and decided it wasn't worth the energy to acknowledge.

  Arthur got off at his stop. The turnstile beeped when he tapped his card, but the bar didn't unlock. He pushed anyway. His hand passed through the metal arm as if it were made of smoke. He stumbled forward, catching himself on the other side. He looked back. The arm was solid, gleaming steel. He tapped it with his knuckle. It rang true.

  He walked to the office building. It was raining, a grey, steady drizzle that slicked the city streets. Arthur opened his umbrella. The fabric snapped open, but the rain didn't hit it. He could hear the patter of drops around him, see the wet sheen on the pavement, but the space beneath his umbrella was perfectly still. The drops fell toward him and then simply ceased to exist inches above the nylon, or perhaps they curved around him in a wide, unseen arc. He closed the umbrella. Immediately, his shoulder was soaked. He opened it again. Dry.

  By the time he reached his desk, the anxiety had settled into a cold, hard knot in his stomach. It wasn't fear, exactly. It was the vertigo of realizing the floor might not be there when you step.

  His coworker, Sarah, was eating a bagel at her station. She bit into it. Arthur watched her jaw work. She chewed, swallowed, then frowned. She bit again, harder. She wasn't swallowing. She was accumulating the food in her mouth, her cheeks puffing out slightly, but nothing was going down. She panic-gagged, spitting the mush into a napkin.

  "Throat's closed," she whispered, her voice raspy. "Feels like... like the switch is off."

  Arthur watched her drink water. The water went down. She breathed a sigh of relief. "Okay. Okay, just a spasm."

  Arthur looked at his keyboard. He pressed the 'A' key. The letter appeared on the screen. He pressed it again. Nothing. He pressed it harder. Nothing. He pressed 'S'. Three 'S's appeared. He wasn't pressing the keys in a sequence; he was making requests, and the computer was deciding whether to honor them based on a whim.

  He stood up. "I'm going for a walk," he said to no one.

  He walked until the office buildings thinned out, until he found a small park tucked between two brutalist concrete structures. There was a maintenance worker there, kneeling by a gas lamp that had been lit for atmosphere, despite the daylight. The flame flickered orange and blue.

  Arthur stopped. He remembered the coffee. The heat that wasn't there. The burn that was.

  He approached the worker. "Does that burn?" he asked.

  The worker looked up, confused. "It's fire, buddy. Yeah, it burns."

  "Can I see?"

  The worker shrugged and went back to tightening a bolt on the lamp's base. Arthur knelt. He held out his hand. He moved his fingers toward the flame. His brain screamed *danger*, firing every evolutionary alarm bell it possessed. Fire destroys tissue. Fire causes pain. That is the law. It is the oldest law.

  He touched the flame.

  There was no heat. It felt like touching a draft of warm air, like the breath from a vent. He pushed his finger deeper into the orange tongue. He clenched his fist around the flame. It was weightless. Frictionless. He watched his skin. It did not blacken. It did not blister. The fire licked around his knuckles, dancing intimately against his skin, but the connection was severed. The cause was present. The effect was absent.

  He pulled his hand away. He looked at his fingers. They were pale, unmarked.

  Then, the worker stood up. He reached for the lamp to move it. His hand brushed the flame.

  The worker screamed. He jerked his hand back, clutching it to his chest. Smoke rose from his skin. The smell of seared meat filled the small space between the buildings.

  Arthur stared. "You... you just saw me."

  The worker was hyperventilating, tears in his eyes. "What? What did you do? How did you do that?"

  "I didn't do anything," Arthur said. His voice sounded thin, detached. "I held it. It didn't burn me."

  "You're lying. Fire burns. That's what fire *does*."

  "Not always," Arthur said. The realization washed over him, colder than the coffee mug had been.

  It wasn't that the fire had changed. It wasn't that he had changed. It was that the link between them was not a chain, but a habit. A custom. For every moment of existence, something else had to decide that the touch of fire results in the sensation of burn. For Arthur, for those ten seconds, the decision had been made otherwise. For the worker, the custom had been upheld with violent strictness.

  There was no machinery in the universe. There were no gears of physics grinding inevitably toward a result. There was only a sequence of events, stitched together by a consistency that was beginning to fray.

  Arthur looked at his hand again. He expected it to hurt now, delayed pain arriving late to the party. It didn't.

  He walked away from the park, back toward the city center. The traffic lights were changing at random intervals. Green to red to yellow, no pattern. Cars stopped when the light was green, went when it was red. Nobody crashed. They simply occupied the space where the collision should have happened, and then they were elsewhere. A bus phased through a sedan like ghosts passing through a wall. No one screamed. The passengers on the bus looked out the windows, bored.

  Arthur realized then that the horror wasn't in the breaking of the rules. The horror was in the understanding that there were no rules to break. There was only a rhythm, a beat that everyone had agreed to dance to, and now the music was skipping.

  He reached his apartment building. He fumbled for his keys. He put the key in the lock. He turned it. The latch didn't retract. He turned it again. The key snapped off in the lock. He pushed the door. It swung open. The lock had never been engaged.

  He went inside. He went to the kitchen. He picked up the kettle. He filled it with water. He set it on the stove and turned the gas on. The blue flame ignited.

  Arthur watched the water. He waited for the boil. He waited for the whistle. He waited for the heat to transfer, molecule to molecule, until the motion of the water became violent.

  The water sat still. The flame licked the bottom of the steel.

  Arthur reached out and touched the side of the kettle. It was ice cold.

  He left it there. He walked into the living room and sat on his couch. He looked at his hands. They were real. The couch was real. But the tension between them, the way gravity held him to the cushion, the way the fabric supported his weight—it felt tentative. Like a bridge made of smoke that held only because the wind hadn't decided to blow yet.

  He wondered what would happen if he stood up. Would gravity remember him? Or would he float, untethered, drifting toward the ceiling like dust in a sunbeam?

  He thought about the worker's hand. The smoke. The pain. He thought about his own fingers, untouched by the flame.

  It wasn't magic. Magic implied a system, a spell, a cause that produced a supernatural effect. This was worse. This was the absence of the system. This was the universe revealing itself as a series of isolated moments, each created anew, independent of the last. The past did not cause the future. They were just neighbors who happened to look alike.

  Arthur closed his eyes. He listened to the silence of the room. He waited for the next moment to arrive. He wondered who, or what, was deciding what would happen in it. He wondered if the decision-maker was tired. He wondered if the custom was being forgotten.

  He opened his eyes. The light in the room had changed, though no time seemed to have passed. The sun was now setting, casting long orange shadows across the floor, though he had sat down at noon.

  He didn't stand up. He didn't test the gravity. He just sat, waiting to see if he would still be there when the shadows disappeared. He hoped the habit would hold. He hoped the custom would remain. But he knew, with a quiet, sinking certainty, that habits are just things we do until we stop.
