      *   **Move 2 (Naomi):** Objects via No-Trade Theorem (Milgrom & Stokey). Key argument: If common knowledge of rationality + common priors, no trade should occur. Trade implies someone is wrong (adverse selection). Since trade *does* occur, the idealization fails. Felix needs to explain *why*.
          *   *Assessment:* Theoretically potent. Hits the foundational paradox of speculative trading. Forces Felix to move from "it works" to "why it works despite theory."
