answer: |-
  **Setting:** *A university seminar room, late afternoon. The whiteboard is still covered in diagrams of "Subjective Motivational Sets." Two philosophers, ELENA (Internalist) and MARCUS (Externalist), are packing up their notes.*

  **Marcus:** You're clinging to the text too tightly, Elena. Williams gives you a neat package, but it unwraps into nothing when you face the hard cases. We talked about the cruel man in the seminar, but you sidestepped the implication.

  **Elena:** I didn't sidestep it. I denied the premise. If the cruel man is truly, thoroughly cruel—constitutively so—and there is no sound deliberative route from his actual motivations to stopping his cruelty, then Williams is clear: he has no internal reason to stop.

  **Marcus:** And that is precisely where the theory collapses into sociology. You're telling me that if a man is sufficiently depraved, morality loses its grip on him? That he literally has *no reason* to refrain from torture?

  **Elena:** I'm telling you he has no *internal* reason. We can still blame him. We can still punish him. We can say he's vicious. But to say he has a "reason" when there is no possible link to his motivational set is to use the word "reason" in a way that is unintelligible. It's metaphysical queerness. What is this reason made of? Where does it exist if not in the agent's psychology?

  **Marcus:** It exists in the nature of the situation. Think of Owen Wingrave. Williams uses him to batter the externalist, but I think he misses the point. The father says Owen has a reason to join the army because it's the family tradition. Williams says: Nonsense. Owen hates the military. No route from his $S$ to enlistment. Therefore, the father is wrong.

  **Elena:** Exactly. The father is making a false reason statement. He's trying to compel Owen with a ghost.

  **Marcus:** But consider the inverse. Suppose the father says, "Owen, you have a reason not to murder your brother," and Owen says, "I have no desire not to. It doesn't fit my $S$." If Williams is right, and the father is wrong, then the prohibition against murder is contingent on Owen's desires. But Williams wants to save morality. So he stretches $S$. He says $S$ includes dispositions, patterns of evaluation, loyalty projects.

  **Elena:** He doesn't stretch it arbitrarily. He acknowledges that deliberation involves imagination. I can imagine a future state and come to desire it. I can correct my beliefs. If Owen believes the army is dishonorable, and he values honor, a sound deliberative route might show him the army *is* honorable. Then he has a reason.

  **Marcus:** That works for Owen. It doesn't work for the sadist. The sadist isn't making a cognitive error. He knows what pain is. He knows what society expects. He simply doesn't care. His $S$ contains a positive desire for cruelty. Now, here is the trap for you, Elena. To save the intuition that the sadist has a reason to stop, the Internalist usually expands $S$ to include a "disposition to be rational" or a "capacity to recognize moral claims."

  **Elena:** And I'm ready for that charge. It is not ad hoc to say that having a rational will is part of my $S$. But it *would* be ad hoc to say "a disposition to be motivated by external reasons" is in my $S$. That's circular. Williams allows for general dispositions—like prudence, or consistency. If the sadist is irrational in a formal sense—contradicting his own long-term interests—then he has an internal reason to stop. But if he is consistent, happy, and successful in his cruelty?

  **Marcus:** Then he has no reason to stop.

  **Elena:** Correct.

  **Marcus:** Then Internalism isn't a theory of *reasons*. It's a theory of *motives*. You've surrendered normativity. You've turned "You have a reason to $\phi$" into "You would be motivated to $\phi$ if you thought clearly." But moral claims aren't hypothetical. They don't say, "If you care about humanity, don't torture." They say, "Don't torture." Period.

  **Elena:** But who is the "You" in that command? If the "You" is an agent who fundamentally lacks the capacity to care about humanity, the command is like telling a stone to fall upward. It's not a reason; it's a wish. Look, Marcus, the externalist view makes reasons into entities that float around waiting to be grasped. If I lack the "moral eye" to see them, am I blind, or are they not there?

  **Marcus:** You're blind. That's the McDowell line. The virtuous agent perceives reasons that the vicious agent cannot. The vicious agent's $S$ is corrupted. But the reasons are still there. The fact that the cruel man cannot *see* the reason doesn't mean the reason doesn't exist. It means he is defective.

  **Elena:** Defective relative to what? A Platonic form of the Good?

  **Marcus:** Defective relative to what it is to be a human agent engaged in a shared form of life. But let's look closer at your defense of $S$. You said it isn't ad hoc to include dispositions like prudence. Why prudence? Why not include a disposition to recognize moral obligation? If you allow the former, why is the latter a bridge too far?

  **Elena:** Because prudence is instrumental. It serves the existing elements in $S$. If I desire health, prudence tells me to exercise. If I include a "disposition to recognize moral obligation," I am smuggling in an external standard. I am saying, "Part of your motivational set is to be motivated by things outside your motivational set." That's incoherent.

  **Marcus:** Is it? Or is it just an acknowledgment that human beings are socially constituted? My $S$ isn't a bucket of pre-social desires I was born with. It's formed by my upbringing, my language, my community. If my community is one where moral claims have authority, then the disposition to recognize those claims *is* part of my psychological makeup. When the sadist rejects them, he isn't just differing in taste; he's opting out of the space of reasons altogether.

  **Elena:** But Williams would say: If he *has* opted out, then relative to him, there are no reasons. We can fight him. We can lock him up. But we shouldn't lie and say he has a reason he cannot access. That's the integrity of the view. It respects the agent's perspective. Externalism is tyrannical; it imposes reasons from the outside.

  **Marcus:** Externalism isn't tyrannical; it's authoritative. It allows us to say to the sadist, "You are wrong," not just "You are different." If Internalism is true, and the sadist has no reason to stop, then when we stop him, we are merely exercising power. We aren't appealing to justification.

  **Elena:** We are appealing to *our* reasons. We have reasons to stop him. He has reasons to resist us. It's a conflict of motivations, not a conflict between motivation and "Reason."

  **Marcus:** That reduces ethics to a clash of forces. But consider the deliberative route again. You insist the route must start from the *actual* $S$. But Williams admits the agent can have false beliefs. If the sadist believes his victims enjoy the pain, he has an internal reason to stop (once corrected). But if he knows they suffer and enjoys it? You say no reason. I say the very capacity to recognize suffering as a claim *is* a rational capacity. If he lacks it, he is irrational, not just unmotivated.

  **Elena:** Here is where I press you back. If you define "irrational" as "failing to respond to external reasons," you've defined your way to victory. You need to show that failing to care about suffering is a failure of *rationality* akin to logical contradiction, not just a failure of sentiment. Can you do that without assuming the conclusion?

  **Marcus:** I can argue that agency itself implies valuing the conditions of agency. To act is to claim value for one's ends. To deny the value of another's agency while claiming it for one's own is a practical contradiction.

  **Elena:** Kantianism. The sadist doesn't care about contradictions in his will, only satisfactions in his world. Look, Marcus, the appeal of Internalism is that it explains action. Reasons explain why people do things. External reasons explain nothing, because they can exist without ever moving the agent.

  **Marcus:** And the appeal of Externalism is that it explains *criticism*. We criticize people precisely when their motivations fail to align with what they ought to do. If reasons were just motivations-in-waiting, criticism would be redundant. I wouldn't say, "You have a reason to stop," I'd say, "You might want to stop." But we don't say that to the torturer. We say, "You must stop."

  **Elena:** The "must" is the force of our reaction, not a feature of his rational landscape. But let's address your worry about the "ad hoc" expansion of $S$ directly. You think if I allow $S$ to include complex dispositions, I'm just pretending to be an Internalist.

  **Marcus:** I think if you expand $S$ enough to catch the sadist, you've turned $S$ into "everything that could possibly motivate a rational agent." And at that point, $S$ is doing no work. The work is being done by the definition of "rational."

  **Elena:** Fair. But Williams's point is that "rational" must be cashed out in psychological terms. If I say the sadist is irrational, I must point to a psychological mechanism failing. If I say he's irrational because he violates a moral law, I'm an Externalist. I'm willing to bite the bullet: The happy, consistent sadist has no internal reason to stop. He is our enemy, not a rational interlocutor.

  **Marcus:** And that is why Internalism cannot be the whole story of practical reason. It can explain advice, perhaps. "Given what you want, you should do X." But it cannot explain obligation. It cannot explain why the sadist is *answerable* to a standard he rejects. By making reasons internal, Williams makes them safe from metaphysical queerness, but he kills their normative authority.

  **Elena:** And by making them external, you give them authority but no purchase. You have a reason that is a reason for no one in particular. I'd rather have a reason that actually moves a human being, even if it leaves the monster untouched.

  **Marcus:** But ethics is precisely about the monster. If your theory of reasons goes silent when the stakes are highest, it isn't a theory of practical reason. It's a theory of prudent planning.

  **Elena:** Then we disagree on the subject matter. I thought we were discussing how agents navigate the world. You're discussing how the world judges agents.

  **Marcus:** And I thought we were discussing why agents *should* navigate the world differently than they do.

  *(Silence hangs between them. Marcus caps his pen. Elena erases the diagram of the deliberative route from the whiteboard, but leaves the circle labeled "S" intact.)*

  **Elena:** Coffee?

  **Marcus:** Yes. But I'm paying. You have a reason to let me.

  **Elena:** Only if I care about your dignity.

  **Marcus:** Precisely. And that, Elena, is where the trouble begins.
