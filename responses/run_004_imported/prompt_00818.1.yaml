answer: |-
  This is one of those dense, knotty Hume passages where the 18th-century metaphysics of "relations" and "volitions" obscures what is actually a very sharp logical point. You are right to focus on the regress; that is the engine of the argument.

  Here is the step-by-step reconstruction of the footnote, followed by an evaluation of its philosophical weight.

  ### The Step-by-Step Breakdown

  Hume is attacking the hypothesis that the essence of a promise is a unique mental act: **the willing of an obligation.**
  His opponent claims: "When I promise, I perform a special act of will where I voluntarily impose a duty on myself."
  Hume's footnote argues: "You cannot will a duty into existence just by willing it."

  Here is the chain of logic:

  **1. The Definition of Obligation (Premise 1)**
  For Hume (and many moral rationalists of his time), an "obligation" is not a physical object like a rock. It is a **moral relation** between an agent and an action.
  *   *To will an obligation* = *To will that a specific moral relation holds between me and action X.*
  *   Therefore: **Willing Obligation = Willing a New Relation.**

  **2. The Nature of Volition (Premise 2)**
  Hume assumes a standard view of intentionality: For the will to act, it must have an **object** distinct from itself that it aims at.
  *   I can will *to move my arm* (the object is the arm moving).
  *   I can will *to eat an apple* (the object is the apple being eaten).
  *   The object must be intelligible *before* or *independently* of the act of willing it, otherwise the will has nothing to "grasp."

  **3. The Trap (The Identity Problem)**
  The opponent claims the volition *creates* the obligation.
  *   If the **Volition** creates the **Relation**, then the **Relation** does not exist until the Volition is complete.
  *   But the **Volition** is defined as "Willing the **Relation**."
  *   *Problem:* How can the Volition aim at the Relation if the Relation only comes into existence *because* of the Volition?
  *   Hume's phrasing: "If this new relation... were form'd by the volition itself, we should in effect will the volition."
      *   *Translation:* If the object of your will is nothing but the product of your will, you aren't aiming at an external target; you are aiming at your own act of aiming.

  **4. The Regress (Where it kicks in)**
  This is the specific sequence Hume describes in the last sentence of the footnote:

  1.  **Volition 1** aims at **Obligation 1**.
  2.  **Obligation 1** consists of **Relation 1**.
  3.  **Relation 1** is created by **Volition 1**.
  4.  *Wait:* For **Volition 1** to aim at **Relation 1**, **Relation 1** must be available as an object.
  5.  But **Relation 1** doesn't exist yet (it's created by Volition 1).
  6.  So, we need a prior act to establish **Relation 1** so **Volition 1** has something to aim at. Let's call this **Volition 0**.
  7.  But **Volition 0** is also an act of "willing an obligation." So it needs an object (**Obligation 0** / **Relation 0**).
  8.  Which requires **Volition -1**...
  9.  **Result:** "Return upon itself in infinitum."

  **In short:** You cannot use your will to create the very target your will is aiming at. To create the target, you need a prior will. To aim that prior will, you need a prior target.

  ### Addressing Your Specific Confusions

  **"Why does willing a new obligation have to 'will a new relation of objects'?"**
  This is Hume's meta-ethical framework. He believes moral properties are not "out there" in the universe (like primary qualities); they are relations of approval/disapproval between minds and actions. An "obligation" is simply a specific kind of link between a person and a future action. If you claim you are creating an obligation, you are claiming you are altering the normative landscape—i.e., creating a new link (relation) between yourself and an act.

  **"Why does that supposedly force the volition to become its own object?"**
  Because if the *only* thing that makes the obligation real is the act of willing it, then the obligation has no independent status.
  *   Normal Willing: I will [Apple]. (Apple exists independently).
  *   Promise Willing (according to opponent): I will [The effect of this Will].
  *   If the object is defined as "the effect of this will," the will is trying to cause itself to have an object. It is bootstrapping. Hume says this is "willing the volition" because the object and the act are causally locked in a circle.

  ### Philosophical Evaluation: Real Work or Just Cute?

  Is this just Hume showing off with Latin ("in infinitum"), or is it a substantive argument?

  **1. It is doing real philosophical work.**
  This is a classic *reductio ad absurdum*. Hume is trying to kill the "Rationalist" or "Voluntarist" theory of promising. These theorists thought morality came from Reason or the Will alone. Hume is showing that if you try to ground the binding force of a promise *solely* in a mental act, you get a logical contradiction.
  It forces the opponent to admit that **something external** is required to make the promise binding. (For Hume, that "something external" is social convention and the public interest, which he argues for in the main text).
  So, the footnote isn't just flair; it's the logical wedge that forces the argument toward his Sentimentalist/Conventionalist conclusion.

  **2. Would it convince a skeptic?**
  *   **To a 1740s Rationalist:** Yes, probably. They accepted the metaphysics of "relations" and the idea that the will needs a distinct object. This argument shows their mechanism is broken.
  *   **To a Modern Philosopher:** It's weaker, but still insightful.
      *   *The Critique:* Modern Speech Act Theory (like J.L. Austin or John Searle) would argue Hume is missing the role of **constitutive rules**. Searle would say: "You *can* create a fact by speaking/willing, provided there is a background convention (like chess or money)." If we agree that saying 'I promise' counts as undertaking an obligation, the regress stops because the "relation" is constituted by the rule, not the bare metaphysical volition.
      *   *Hume's Defense:* Hume actually agrees with this! That is his main argument in Section 5. He says promises are *human inventions* (conventions), not natural mental acts. The footnote is specifically attacking the idea that the *mental act alone* does the work without the convention.
      *   *Verdict:* It would convince a skeptic that the "Mental Act" theory is dead. It would *not* convince them that Sentimentalism is true (that requires the rest of Book 3). But it successfully clears the field of the rival theory.

  **Summary for your Seminar:**
  You can tell your class that the footnote is a **metaphysical trap**. Hume is arguing that you cannot create a normative fact (obligation) simply by intending to create it, because the intention requires the fact to exist as its target. This forces us to look outside the mind (to social conventions) to explain why promises bind us. It's not just rhetorical; it's the logical pivot that moves the argument from "psychology of the will" to "sociology of conventions."
