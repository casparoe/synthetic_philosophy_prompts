answer: |-
  Good evening. Before I begin, I owe the room an apology. Specifically, I owe the people at Table Four an apology for the scene I caused last night during the tiramisu. I was informed, quite rightly, that a rehearsal dinner is not the proper venue to debate whether Bernard Williams successfully dismantled Kantian ethics with the phrase "one thought too many."

  But since Owen's dissertation is on exactly this literature, and since Mira has sat through more rants about Kant's "warm-hearted philanthropist" than any human being should endure before breakfast, I thought it was only fair to address the elephant in the room. Or rather, the German idealist in the room.

  For the family members wondering why I'm talking about ethics instead of how the couple met: Owen has spent the last five years studying a specific problem. Immanuel Kant argued that if you do something good because you *enjoy* it—like helping someone because you love them—you get no moral credit. You only get credit if you do it because it's your *duty*, even if you hate it.

  So, by strict Kantian standards, Owen's love for Mira is morally worthless. He brings her coffee because he likes seeing her smile, not because he's obeying a categorical imperative. He listens to her day because he's interested, not out of grim obligation. According to Kant, Owen is just a glorified philanthropist acting on inclination. He's getting away with murder.

  And this is where my friend Bernard Williams steps in. Williams asked: If your wife is drowning, and you jump in to save her, should you be thinking, "I am doing this because it is my moral duty"? Williams said no. That is "one thought too many." You should jump because she is *your wife*. You should act out of love, not calculation.

  So, for the last five minutes, I have successfully argued that Owen's love is both morally worthless *and* philosophically superior. I hope that clarifies things for everyone.

  But there is a resolution to this, and it's where Barbara Herman comes in. She suggested that duty doesn't have to be the motive you feel in the moment. It just has to be the background structure—the limiting condition that keeps everything else safe.

  And that, to me, is the perfect description of this marriage.

  Owen and Mira, looking at you two, we see the inclination. We see the joy. We see the "warm-hearted philanthropist." You help each other, you support each other, you choose each other every day because it brings you pleasure and meaning. In the Kantian sense, you are "unworthy." Thank god for that. I don't want a marriage built on grim obligation. I don't want Owen to bring Mira flowers because the moral law commanded it. I want him to do it because he can't imagine not doing it.

  But we also know that life is long. We know that there will be days when the inclination wavers. Days when the coffee isn't brought with a smile, but is brought anyway. Days when saving someone from drowning feels less like a romantic impulse and more like hard, heavy work.

  That is where the Kantian structure serves you. Not as the engine of your love, but as the guardrails. The duty is there, in the background, silent and steady. It means that even if the "one thought too many" ever needs to be thought, it won't corrupt the love; it will sustain it.

  So, here is the verdict. By the standards of the *Groundwork of the Metaphysics of Morals*, this union is suspect. But by the standards of a life well-lived, it is robust. You have the luck of inclination, and the strength of commitment. You have the love that makes duty unnecessary, backed by the duty that ensures the love survives.

  Owen, you may have argued about this for years, but tonight, the data is clear. Mira, you have proven that love is the only motive that matters, provided the promise is there to hold it up.

  Let's raise a glass. To Owen and Mira: May your motives always be impure, may your duties always be quiet, and may you never have to calculate the moral worth of a single moment together.

  To the happy couple.
