answer: |-
  This is one of the most famous case studies in the philosophy of language and metaphysics. You have stumbled upon a puzzle that was centrally discussed by **Hilary Putnam**, one of the 20th century's most influential philosophers, in his seminal essay *"The Meaning of 'Meaning'"* (1975).

  Your intuition is correct: it feels wrong to say the ancients were simply "mistaken," but it also feels scientifically imprecise to say jade is "one thing." To resolve this, we need to distinguish between different *types* of concepts and how they latch onto the world.

  Here is a framework for thinking about the "Jade Problem."

  ### 1. Putnam's Analysis: The Disjunctive Kind
  Putnam used jade specifically to test the theory of **Natural Kind Terms**. He argued that terms like "water," "gold," or "tiger" refer to things with a specific underlying microstructure (H₂O, Au, specific DNA). If you find something that looks like water but isn't H₂O (like Putnam's famous "Twin Earth" example of XYZ), it isn't water.

  However, Putnam acknowledged that "jade" is different. When mineralogists discovered that "jade" was actually two distinct minerals (jadeite and nephrite) with different chemical compositions, did the word "jade" cease to have meaning? Did the ancients fail to refer?

  Putnam's conclusion was that **"jade" is not a strict natural kind term.** Instead, its extension is **disjunctive**.
  *   **Water** = H₂O (Unified microstructure)
  *   **Jade** = Jadeite OR Nephrite (Disjunctive microstructure)

  According to this view, the ancients *did* successfully refer to something determinate, but the "determinate thing" they referred to was a disjunction. They weren't wrong to group them together, because the term "jade" was never committed to a single chemical essence in the way "water" is.

  ### 2. Functional Kinds vs. Microstructural Kinds
  The tension you feel comes from conflating two different ways of categorizing the world.

  **Microstructural Kinds (Science):**
  These categories are defined by what a thing *is* at the fundamental level (atomic structure, genetics). Science seeks these kinds because they support deep predictions and laws of nature. By this standard, jade is not a kind; it is two kinds.

  **Functional/Folk Kinds (Human Practice):**
  These categories are defined by what a thing *does* or how it interacts with human interests (carve-ability, color, durability, beauty). This is the level at which the ancient artisans operated.
  *   To an artisan, a "kind" is defined by a **Homeostatic Property Cluster**: a group of properties (hardness, toughness, polishability, green color) that tend to stay together.
  *   Jadeite and nephrite share enough of these functional properties to be treated as one kind for the purpose of carving, ritual, and trade.

  **The Resolution:** The artisans were not "mistaken" because they were operating within the framework of functional kinds. They successfully carved out a category that was real and useful for human purposes. They would only be "mistaken" if they claimed jade was a single *chemical* substance, but there is no evidence they made that claim; they lacked the conceptual framework of chemistry.

  ### 3. Reference is Interest-Relative
  Your worry asks: *Did their concept fail because it cuts across two distinct natural kinds?*

  This assumes that "Natural Kinds" (scientific categories) are the only things that are real or determinate. Many philosophers (like Ruth Millikan or Richard Boyd) argue that this is **scientific imperialism**.

  Reference is often **interest-relative**.
  *   If your interest is **geology**, "jade" is a sloppy term that fails to refer to a single natural kind.
  *   If your interest is **art history or lapidary work**, "jade" refers to a perfectly determinate class of materials defined by workability and aesthetic.

  Consider the word **"metal."** Before chemistry, "metal" referred to gold, silver, copper, iron, etc. Chemistry revealed these are distinct elements. Did the ancients fail to refer when they spoke of "metal"? No. They referred to a functional kind (shiny, malleable, conductive). "Jade" is similar. It is a category of human utility, not a category of fundamental physics.

  ### 4. The "Error" Theory vs. The "Refinement" Theory
  How should we view the transition from the ancient concept to the modern scientific one?

  *   **The Error Theory:** The ancients thought there was one kind, but there are two. Therefore, their belief was false.
      *   *Critique:* This is too harsh. It assumes their goal was mineralogy. Their goal was craftsmanship.
  *   **The Refinement Theory:** The ancients identified a genuine similarity in the world (toughness, beauty). Science later revealed that nature achieves this similarity via two different structural routes.
      *   *Benefit:* This preserves the success of the artisans. They correctly identified a real pattern in nature (convergent properties), even if they didn't know the underlying mechanism.

  ### 5. Summary: How to Think About It
  To answer your specific questions:

  **Did those artisans successfully refer to anything determinate?**
  Yes. They referred to a **functional kind**. They successfully picked out all objects in their environment that possessed a specific cluster of workable and aesthetic properties. That is a determinate set of objects, even if the mineralogy varies.

  **Did their concept fail because it cuts across two distinct natural kinds?**
  No, because their concept was not trying to capture a "natural kind" in the scientific sense. A concept only "fails" if it fails to do the job it was designed for. Since the concept of "jade" allowed them to create durable, beautiful artifacts for millennia, it was highly successful.

  **How should I think about cases like this?**
  Think of language as a toolkit with different tools for different jobs.
  *   **Scientific terms** (like *jadeite*) are scalpels: precise, cutting nature at its microstructural joints.
  *   **Folk/Functional terms** (like *jade*) are multi-tools: designed for human interaction, grouping things by how they affect us.

  The discovery that jade is two minerals doesn't invalidate the ancient concept; it simply adds a layer of scientific detail that was invisible to the naked eye. The artisans were right about the **phenomena** (the stone behaves this way), even if they couldn't know the **noumena** (the atomic structure).

  In philosophy, this teaches us **metaphysical humility**: just because science divides the world one way doesn't mean the human lifeworld's way of dividing it is "false." Both are real, but they serve different masters.
