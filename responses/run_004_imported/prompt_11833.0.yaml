answer: |-
  Ibn Sīnā and al-Ghazālī are standing before a brazier where a servant is about to touch a flame to a tuft of cotton.

  Ibn Sīnā says, "When the fire touches the cotton, combustion *must* occur. It is a necessary connection grounded in the nature of the elements."

  Al-Ghazālī replies, "When the fire touches the cotton, God *usually* creates combustion. It is a habitual connection (*ʿāda*) grounded in the Will of the Agent."

  Ibn Sīnā scoffs, "Practically, it is the same. The cotton burns either way. So, if you truly believe the fire possesses no causal power of its own, why do you not thrust your hand into the flame?"

  Al-Ghazālī pulls his sleeve down tightly. "I know the fire has no power. But I also know God's habits are revocable."

  Ibn Sīnā rolls his eyes. "He has never revoked this habit. The sun rises, the fire burns. It is consistent."

  Al-Ghazālī shrugs. "He never *had* to revoke it. But I am not willing to be the first piece of cotton to discover that He *can*."
