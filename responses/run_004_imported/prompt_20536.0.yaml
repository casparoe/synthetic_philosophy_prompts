answer: |-
  **Verdict:** William of Ockham would reject the Thin Red Line (TRL) semantics as a faithful rendering of his view. He would judge that the TRL reintroduces a form of *necessitas per accidens* regarding the future, thereby collapsing the very contingency he sought to preserve. While he would agree with the Ockhamist semanticist that future contingent propositions are bivalent (determinately true or false), he would argue that the TRL grounds that truth in a present metaphysical fact in a way that violates his distinction between certainty and necessity.

  Here is the breakdown of why Ockham would issue this rejection, based on his specific textual commitments.

  ### 1. The Violation of *Necessitas Per Accidens*
  Ockham's primary logical tool for saving contingency is the distinction between *necessitas absoluta* (logical/metaphysical necessity) and *necessitas per accidens* (the immutability of the past). In his *Tractatus de Praedestinatione*, Ockham argues that once a contingent event occurs, it becomes necessary *per accidens*—it cannot be undone. However, prior to the event, it is not necessary in any sense.

  The Thin Red Line semantics posits that among the branching histories, one is metaphysically privileged as "actual" *now*. Truth is evaluated relative to this line. For Ockham, this creates an insurmountable problem: if the "actualness" of a specific branch is a fact that obtains at the present moment, then the future events on that branch share the immutability of the past.

  In Ockham's framework, for a future proposition to be contingent, the opposite must be able to occur *without contradiction and without changing the past*. If the TRL is a fixed feature of the world's structure *now*, then for the opposite to occur, the TRL itself would have to shift. But in standard TRL semantics, the line does not shift; it is a rigid designator of the actual future. Ockham would argue that this renders the future *per accidens* necessary in the present, effectively treating the future as if it were already past. He writes in *Tractatus de Praedestinatione* (Part II, Q. 2) that we must not posit anything in reality that determines the will to one effect. The TRL posits exactly such a determinant: a structural fact about time that picks out one outcome as "the one that will happen" prior to the causal chain producing it.

  ### 2. The Violation of Theological Agnosticism
  Ockham's solution relies heavily on a deliberate epistemic boundary. He maintains that while we know *that* God knows future contingents, the *mode* (how) of this knowledge exceeds human comprehension. In *Reportatio* I, d. 38, q. 1, he insists that we cannot map the ontology of divine foreknowledge onto human logic without risking determinism. He accepts bivalence because revelation and reason demand it, but he refuses to provide a truth-maker in the present that explains *why* it is true, other than God's intuition, which is incomprehensible to us.

  The TRL semantics is an attempt to do exactly what Ockham forbids: it provides a comprehensible model for *how* a future contingent can be true now. It says, "It is true because this branch is actual." For Ockham, this is a category error. It attempts to naturalize a truth that belongs to the divine intuition. By offering a mechanism (the selection of a history), the TRL claims to solve the mystery that Ockham explicitly left as a mystery. Ockham would likely view the TRL not as a clarification, but as a presumption that tries to constrain divine power and contingency within a human logical grid.

  ### 3. The Strongest Reason for Resistance: Nominalist Ontology
  The most decisive reason Ockham would reject the TRL is ontological. Ockham is a nominalist; he denies that universals, relations, or complex structures have extra-mental reality. For Ockham, "possibility" is not a realm of concrete branching worlds (as in the Lewisian or Priorian realist sense); it is a property of terms or a power in agents.

  The TRL requires a robust realism about the branching structure itself. It requires that all branches exist as ontological candidates, with one singled out as "actual." Ockham would reject the reality of the non-actual branches entirely. For him, there are no "unactualized possibilities" sitting in a tree waiting to be pruned; there is only the present reality and the power of agents to produce different effects.

  Consequently, the TRL's "actual branch" looks to Ockham like a reified fate. If the branch is *already* there (even if branching), and it is *already* marked as actual, the contingency is merely epistemic (we don't know which line is red) rather than ontological (the world itself is open). Ockham fights for ontological contingency. He argues in *Tractatus de Praedestinatione* (Part II, Q. 3) that the proposition "The Antichrist will exist" is true, but the *thing* (Antichrist) does not exist, nor is it determined to exist. The TRL suggests the "thing" is determined by the geometry of time. Ockham would argue this makes the truth of the proposition prior to the freedom of the cause, which inverts the proper order of reality.

  ### Conclusion
  Ockham would conclude that the "Ockhamist" label is a misnomer when applied to the Thin Red Line. He would agree with Belnap and Green that the TRL smuggles in a form of fatalism, though for different reasons. Belnap and Green worry about the coherence of branching time; Ockham would worry about the coercion of the will and the nature of divine knowledge. He would argue that the TRL semantics secures bivalence only by sacrificing the very contingency it claims to protect, turning the "open future" into a "fixed future that we haven't seen yet." For Ockham, a future that is metaphysically singled out as actual *now* is a future that is necessary *per accidens* now, and that is a contradiction in terms.
