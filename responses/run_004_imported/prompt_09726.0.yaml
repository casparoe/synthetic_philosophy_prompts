answer: |-
  This is one of the most sophisticated and central interpretive challenges in *On Certainty*. You have identified the precise tension that occupies Wittgenstein in the final months of his life: **How can a proposition be immune to empirical doubt (like a necessary truth) without being a logical tautology, and yet still be capable of changing status over time (unlike a necessary truth)?**

  The short answer is that Wittgenstein is rejecting the traditional dichotomy between "empirical contingent truths" and "logical necessary truths." He is proposing a third category: **propositions that function as rules.**

  To resolve the tension you've identified, we must shift from an **ontological** understanding of these propositions (what they *are*) to a **functional** understanding (what they *do*). Here is how that distinction dissolves the apparent contradiction between "necessity" and the "shifting river-bed."

  ### 1. Why Hinges Are Not "Necessary Truths"
  You ask if Wittgenstein treats hinges as a "special class of necessary truths." In a strict logical sense, **no.**

  For Wittgenstein, logical necessary truths (tautologies) are true in all possible language games (e.g., "All bachelors are unmarried"). To deny them is to speak nonsense. However, hinge propositions (e.g., "The earth has existed for many years") look grammatically like empirical claims. They are not tautologies.

  If you deny a hinge proposition, you are not committing a logical error; you are exhibiting **madness** or stepping outside our "world-picture" (*Weltbild*).
  *   **Logical Necessity:** Denying it makes your sentence meaningless.
  *   **Hinge Certainty:** Denying it makes your *action* or *inquiry* impossible.

  Wittgenstein writes: *"I did not say 'propositions... are rules', but that they **function** as rules" (OC §136).*

  If hinges were truly necessary truths, they would be fixed forever. But Wittgenstein insists they are not. They are "held fast" not because of their intrinsic logical structure, but because of the **role they play in our system of verification.** They are the scaffolding that allows us to distinguish between true and false empirical claims. If you remove the scaffolding, you cannot test anything. Therefore, they are treated *as if* they were necessary, but they lack the modal status of logical necessity.

  ### 2. The River-Bed Metaphor and Fluidity
  This brings us to the "river-bed" metaphor (OC §§96–99). Wittgenstein compares the system of beliefs to a river:
  *   **The Water:** Ordinary empirical claims that flow, change, and are constantly tested.
  *   **The Bed:** The hinge propositions that guide the flow and appear solid.

  Crucially, Wittgenstein notes: *"The river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other" (OC §97).*

  This metaphor directly addresses your concern about fluidity. The "hard rock" of the river-bed *does* move, just much more slowly than the water.
  *   **Example:** "The sun revolves around the earth" was once a hinge proposition (part of the bed). To doubt it was to undermine the entire system of astronomy and theology of the time. Eventually, the bed shifted. That proposition became a testable empirical claim (and was found false), and "The earth revolves around the sun" took its place in the bed.
  *   **Example:** "Objects don't vanish when unobserved" is currently a hinge. If we discovered quantum macro-effects that violated this consistently, this hinge might become a testable hypothesis, and the "bed" would shift.

  ### 3. Resolving the Tension: Functional vs. Intrinsic Status
  The tension you perceive arises if we assume the status of a proposition is **intrinsic** to the sentence itself.
  *   *If "The earth exists" is a Necessary Truth, it must always be necessary.*
  *   *If it can become empirical later, it can't have been necessary.*

  Wittgenstein resolves this by arguing that the status is **extrinsic** and **pragmatic**. A proposition is not a hinge because of *what it says*, but because of *how we use it*.

  *   **At Time T1:** We use "The earth exists" as a rule for testing. We do not verify it; we use it to verify other things (e.g., dating fossils). In this context, it functions with the force of necessity.
  *   **At Time T2:** Due to scientific revolution or cultural shift, we begin to treat "The earth exists" as a hypothesis subject to verification (perhaps in a cosmological simulation context). Now it flows like water.

  Therefore, hinges are not a "special class of truths" in a Platonic or logical sense. They are a **special class of usage.**

  ### 4. Why This Matters: Dissolving Skepticism
  This distinction is Wittgenstein's weapon against skepticism.
  *   **The Skeptic** asks: "But can you *prove* the earth existed before you were born?" treating the hinge as an empirical claim that lacks evidence.
  *   **Wittgenstein** replies: "I do not treat it as an empirical claim. It is the ground on which I distinguish between proved and unproved."

  If hinges were logical necessities, the skeptic would be speaking nonsense. If they were ordinary empirical claims, the skeptic would be right (we can't prove them). By making them **groundless beliefs that function as rules**, Wittgenstein shows that the skeptic is trying to play a language game without the board. You cannot doubt the hinges *from within* the system, because the hinges define the system. You can only step outside the system entirely (which is not rational doubt, but a different form of life).

  ### Summary
  To answer your specific questions:

  1.  **Does Wittgenstein treat hinges as necessary truths?**
      No, not in the logical sense. He treats them as **grammatical rules disguised as empirical propositions.** They possess a *pragmatic* necessity (we cannot act without them) rather than a *logical* necessity (they are not true in all possible worlds).

  2.  **How does this square with the shifting river-bed?**
      It squares perfectly once you realize the "necessity" is not a property of the proposition, but of its **role**. Just as a chess piece is only a "King" because of the rules we currently follow (and we could change the rules tomorrow), a proposition is only a "hinge" because of the language game we are currently playing. The river-bed shifts because our forms of life and scientific world-pictures evolve, changing which propositions we treat as rules and which we treat as testable claims.

  Wittgenstein is ultimately teaching us that certainty is not a mental state or a logical relation, but a **way of acting.** We do not *know* the hinges; we *stand* on them. And where we stand can change, even if it rarely does.
