      *   *Premise 2:* To know an action is "good," one must know its total long-term consequences.
      *   *Conclusion:* Therefore, one cannot know if an action is "good."
      *   *Underlying Ethical Theory:* This is a specific, rigid form of **Act Utilitarianism** (specifically, *Total View* + *Epistemic Requirement*).

  3.  **Identify the Flaws/Counter-Arguments:**
      *   **Epistemic Impossibility:** If we require certainty about infinite futures to judge *any* action, ethics becomes impossible. Paralysis.
      *   **Probability vs. Certainty:** Ethics usually deals with *expected* value, not *actual* (but unknowable) value.
      *   **Proximity/Weighting:** Near-term, certain benefits usually outweigh distant, speculative harms.
      *   **Moral Luck:** We judge intentions and reasonable expectations, not just outcomes.
      *   **Rule/Constraint Ethics:** Some actions are good in themselves (deontology/virtue ethics), regardless of consequences.
      *   **The "No Difference" Problem:** If we can't know, does it matter? Practically, we must act on best available evidence.

  4.  **Drafting the Response - Structure:**
