prompt: |-
  My friend Mara is getting married in a few weeks. She wrote her dissertation on perdurantism -- the four-dimensionalist view that a person isn't wholly present at every moment (like endurantists think) but is really a series of temporal parts stitched into one long 'space-time worm.' She also goes back and forth between worm theory and stage theory, something about whether future Maras are parts of that same worm or just separate stages linked by a counterpart relation, which I don't totally get. Half the wedding is her old philosophy cohort, who'll catch every reference; the other half is family who've never heard the phrase 'temporal part' in their life. I'm giving the toast and I want to actually use the idea, not just drop it in as a punchline -- like, if shes right, what does it even mean to promise to love the same person forever, when its really only the part of her standing at the altar that can make any promise at all? Can you write me a warm, kind of funny, five minute toast that takes that seriously without turning into a metaphysics lecture, and that still lands for people who have zero idea what any of this means?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a friend named Mara.
      *   **Key Theme:** Perdurantism (4Dism), specifically the "space-time worm" vs. "stage theory" debate.
      *   **Audience:** Mixed (50% philosophy academics who know the jargon, 50% family/friends who don't).
      *   **Tone:** Warm, funny, serious about the concept (not just a punchline), accessible (no lecture), ~5 minutes long.
      *   **Core Philosophical Question:** How do you promise to love someone *forever* if they are just a series of temporal parts? Who is making the promise? Who is receiving it?

  2.  **Deconstruct the Philosophy (for accurate application):**
      *   *Endurantism:* You are wholly present at every moment. (The common sense view).
      *   *Perdurantism:* You are extended in time like you are extended in space. You have "temporal parts."
      *   *Worm Theory:* The whole person is the sum of all temporal parts from birth to death (the "worm").
      *   *Stage Theory:* Only the current moment exists as a "stage." Future/past stages are counterparts, not identical.
      *   *The Toast's Challenge:* If Mara is a worm, the "wedding Mara" is just a slice. If she's a stage, the "future Mara" is a different entity. How does marriage work?
      *   *The Solution:* Love binds the parts together. The commitment creates the continuity.

  3.  **Determine the Structure:**
      *   **Opening:** Welcome everyone, acknowledge Mara, introduce the "philosophy" angle gently.
      *   **The Hook (The Philosophy):** Explain perdurantism simply using a metaphor (like a movie reel or a loaf of bread). Acknowledge the two camps (worm vs. stage).
      *   **The Pivot (The Problem):** Raise the question: If she's changing every second, who are we marrying? Who is making the vows?
      *   **The Resolution (The Love):** Reframe the philosophy. Love isn't about static identity; it's about weaving the parts together. The vow *makes* the worm.
      *   **The Partner:** Bring the partner into the equation (they need to be part of the worm too).
      *   **Closing:** Raise a glass, warm wish for the future.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the honor of speaking. Mention Mara's dissertation. Keep it light. "She thinks about time differently."
      *   *Explaining the Concept:* Avoid jargon where possible, but use enough for the philosophers to nod. "Space-time worm." "Temporal parts." Explain it like a movie strip.
      *   *The Family Check-in:* Make sure the non-philosophers don't feel lost. "For those who didn't spend their 20s arguing about this..."
      *   *The Deep Question:* The prompt asks: "What does it mean to promise forever?" Address this. If the "Mara" at the altar is just a slice, is the promise valid for the next slice?
      *   *The Answer:* Marriage *is* the glue. It's the decision to treat all these slices as one. It's an act of will, not just metaphysics.
      *   *The Partner:* Let's call the partner [Partner's Name]. Their worm intertwines with Mara's.
      *   *Conclusion:* A toast to the "whole story."

  5.  **Refining the Tone:**
      *   *Humor:* Poke fun at the complexity. "I promise to love you... or at least your current temporal stage."
      *   *Warmth:* Ensure the philosophy serves the emotion, not the other way around. The philosophy should *enhance* the romance, not diminish it.
      *   *Accessibility:* Use analogies. A loaf of bread, a movie reel, a quilt. Let's go with a movie reel or a long road. Actually, a "story" is better for a wedding.

  6.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too dry? Need more emotion. Make sure I don't alienate the grandma in the front row.
      *   *Fix:* Explicitly address the non-philosophers. "Don't worry, I'll translate."
      *   *Fix:* Ensure the partner isn't left out of the metaphysics. They are a co-author of the worm.

  7.  **Drafting - Iteration 2 (Writing the content):**
      *   *Opening:* Good evening. Mara is brilliant. She wrote about how we exist in time.
      *   *The Bit:* Endurantism vs. Perdurantism. Keep it simple. "Are you the same person you were at birth?"
      *   *The Worm:* Mention the "space-time worm." It sounds scary but it's beautiful.
      *   *The Vow:* The vow is the commitment to love *all* the parts, even the ones that haven't happened yet.
      *   *The Stage Theory:* Even if tomorrow's Mara is a "counterpart," today's Mara promises to take care of her.
      *   *Closing:* To the Worm! (Maybe too nerdy). To the Story! (Better).

  8.  **Final Polish:**
      *   Check timing. 5 minutes is roughly 750-850 words spoken at a moderate pace.
      *   Check the prompt's specific constraint: "takes that seriously without turning into a metaphysics lecture."
      *   Ensure the "who is making the promise" paradox is addressed. *Answer:* The promise is the thread that sews the parts together.

  9.  **Final Review against constraints:**
      *   Warm? Yes.
      *   Funny? Yes (light jokes about the dissertation).
      *   5 Minutes? (Word count looks right).
      *   Accessible? (Explanations included).
      *   Philosophically accurate? (Yes, addresses worm/stage distinction).

  **(Self-Correction during drafting):** I need to make sure I don't imply that Mara *isn't* real. Perdurantism says she *is* real, just extended. The toast needs to celebrate that extension. Also, need to make sure the partner feels included in the metaphysics, not just Mara.

  10. **Final Polish of the Text:** (Proceeding to generate the response based on these thoughts).
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of being one of Mara's oldest friends.

  When Mara asked me to give this toast, she gave me one piece of advice. She said, "Please don't make it a lecture." And I promised her I wouldn't. But then I started thinking about who Mara is. And if you know Mara, you know that for the last several years, her brain has been living in the fourth dimension.

  Mara wrote her dissertation on perdurantism. Now, for the family members who are currently Googling that under the table: don't panic. It's actually a very romantic idea, once you translate it from "Philosophy" to "English."

  Basically, most of us think we exist like statues. We are wholly present, right here, right now. But Mara thinks we exist more like a movie reel. She argues that you aren't just the frame currently on the screen. You are the entire strip of film. Past, present, and future. You are a long, winding "space-time worm."

  Now, Mara also spends a lot of time debating whether she is the whole worm, or just a single "stage" of the worm linked to the future by a promise. And honestly, watching her argue with herself about whether "Future Mara" is literally the same person as "Present Mara" has been... educational.

  But standing here today, looking at her in that dress, I realized that this isn't just academic for her. It's the secret to why this marriage is going to work.

  Because if Mara is right, if we are all just a series of temporal parts stitched together, it raises a pretty big question for a wedding. Specifically: Who is making the vows?

  If the Mara standing at the altar is just a three-dimensional slice of a four-dimensional object, does she have the authority to promise things on behalf of the Mara of ten years from now? If "Future Mara" is a different temporal part, isn't asking her to be faithful or kind or patient basically asking a stranger to clean up someone else's mess?

  And if she's a "stage theorist," and the future is open and branching, how can she promise "forever" when she doesn't even know which stage comes next?

  It sounds like a loophole, doesn't it? "I promise to love you... or at least, the current stage of me does. No guarantees on the 2029 model."

  But I think the philosophy gets it backward. The vow isn't a description of reality. It's the glue.

  Mara's view teaches us that we are not static. We change. We shed parts of ourselves. The Mara who wrote her dissertation is not the Mara who planned this wedding, and she won't be the Mara who navigates the challenges of a shared life. We are constantly becoming new versions of ourselves.

  So, what does it mean to marry someone?

  It means you are looking at the person standing in front of you, and you are making a commitment to every other slice of their timeline. It means you are promising to love the past parts that shaped them, the present part that is nervous and happy right now, and the future parts that haven't even been written yet.

  In a way, marriage is the act of taking two separate space-time worms and weaving them together so tightly that they become a single, braided cable moving through time.

  To the philosophers in the room: You can argue about counterpart relations all you want. But I think the vow *creates* the identity. By saying "I do," you are deciding that despite the changes, despite the new temporal parts, the love remains the constant variable. You are binding the stages together with loyalty.

  And to the family and friends who just want to know if she's happy: She is. She's radiant. And [Partner's Name], you are the person who gets to travel through time with her.

  [Partner's Name], you know that Mara is brilliant, and stubborn, and that she will absolutely analyze the metaphysics of a burnt piece of toast at breakfast. But you also know that she loves deeply. She loves the whole story, not just the highlight reel.

  So, my wish for you both is this: May your worms be long. May your temporal parts be kind to one another. And when you hit the rough patches—because every long object has some knots in it—may you remember that you aren't just loving the person in the room today. You are loving the history that brought them here, and the future that is waiting for them.

  You are promising to be the constant in each other's changing universe.

  So, if everyone could please raise a glass.

  To Mara and [Partner's Name]. To the past that made you, the present that joins you, and the future that belongs to you both.

  To the whole story. Cheers.
