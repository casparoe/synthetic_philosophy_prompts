      *   *Point 2: Representation vs. Complexity.* Leibniz believed the *right* language (*Characteristica*) would make calculation trivial. He thought complexity was a failure of notation. P vs NP says complexity is intrinsic to the problem structure. This is the biggest blow. It attacks his optimism about the *Characteristica*.
      *   *Point 3: The Finite/Infinite Distinction.* The user's hunch is sharp but slightly off. Infinite analysis $\neq$ Exponential time. Infinite analysis is metaphysical (monads). However, Leibniz *did* recognize grades of difficulty. He would understand "feasibility."
