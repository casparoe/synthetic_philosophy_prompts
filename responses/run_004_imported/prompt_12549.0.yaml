      *   *Premise 3:* Impartiality requires giving equal weight to each individual's claim.
      *   *Conclusion:* When faced with saving 1 person vs. 5 people, you cannot say "5 deaths is worse than 1 death" in a summed sense. Instead, you have 1 claim vs. 5 claims. To respect the equality of claims, you should give each person an equal chance of being saved (e.g., flip a coin).
