      *   *The "Lesser Burden" Argument:* Parfit argues we don't need to sum *losses* to see that numbers count. We can look at *benefits* or *burdens* comparatively.
      *   *Key Move:* It's not about adding up pain into a "super-pain." It's about the fact that *more people* are burdened.
