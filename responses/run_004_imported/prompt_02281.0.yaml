      *   *Check:* Did I make Sarah sound too naive? *Fix:* Emphasize that her definition is useful for *finding* things, even if it overcounts.
      *   *Check:* Is the TV analogy clear? *Fix:* Ensure Marcus explains it well (breaking a TV doesn't stop the static).
      *   *Check:* Is the "Mutational Load" argument accurate? *Yes, Haldane's dilemma.* Keep it accessible but technically sound.
      *   *Check:* Did they engage? *Make sure they interrupt less and listen more as it goes on.*

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Bar setting? Yes.
      *   Causal Role vs. Selected Effect? Yes.
      *   TV argument included? Yes.
      *   No clear winner? Yes.

  8.  *(Mental Sandbox)*: Let's make sure Sarah doesn't just say "but we found transcripts." She needs to argue *why* her definition matters. It matters for medicine. If a non-selected element causes disease when mutated, isn't it functional in a medical sense? Marcus needs to concede that utility $\neq$ evolutionary function.

  9.  **Final Polish:** Check the voice. Sarah should sound like a lab person (wet bench, assays). Marcus should sound like a theory person (models, constraints).

