answer: |-
  Here is a toast drafted for the occasion. It runs about 550–600 words, which at a conversational, toast-making pace (with pauses for laughter and clinking glasses) should land right around the four-minute mark.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a neighbor, a friend, and, by trade, a philosophy professor. Which means I have a professional hazard of overthinking simple things. If I see a door, I wonder about the concept of thresholds. If I see a line, I ask who drew it.

  So, when Priya asked me to say a few words tonight, I'll admit I felt a moment of panic. Because usually, when we celebrate a moment like this, we talk about destiny. We talk about how someone was *meant* to be here, or how this country was waiting for them. We talk about the border as if it were a river or a mountain range—a natural line that nature drew for us.

  But anyone who has studied history, or maps, or philosophy, knows that borders aren't really like rivers. They're not natural kinds. They're human inventions. They're lines drawn through accidents of history, wars, treaties, and compromises. In my field, we have a name for the puzzle of how we decide who belongs inside the line and who stays outside. It's a messy problem. There is no perfect, cosmic formula for who gets to be part of the "us."

  And for a long time, I thought that made citizenship a little less magical. If the line is arbitrary, isn't the crossing just a paperwork error corrected?

  But watching Priya go through this process, I realized I had it backward.

  The fact that the line *isn't* natural is exactly what makes tonight so profound. If belonging were just about blood, or soil, or an accident of birth, then Priya standing here would just be biology. It would be fate. And fate doesn't require courage.

  But because the line is a human invention, crossing it is a human choice.

  The "us" of this country isn't a pre-existing club we were born into. It's a project we build. The boundary might be contingent, but the commitment isn't. The legitimacy of the line doesn't come from where it was drawn on a map two hundred years ago; it comes from the people standing on this lawn tonight, and the people like Priya who choose to step across it and say, "I will take responsibility for this place, and for you."

  Priya, you haven't just been sorted into a category. You have entered into a promise. You've looked at a line that history drew arbitrarily and decided to fill it with meaning. You've decided that "we" is a verb, not a noun. Something we *do*, not just something we *are*.

  And honestly, that's why I'm proud to be your neighbor. Because it reminds the rest of us who were just dropped here by luck that citizenship isn't a inheritance. It's a practice. It's the daily work of making the boundary matter by treating the people on the other side of it as equals.

  So, I know there are two colleagues of mine in the back who might hear a certain theoretical subtext in that. But for everyone else, I just mean this: The map is a fiction. But the community is real. And you, Priya, are a vital part of making it real.

  To Priya. To the choice you made. And to the work we all have to do to be worthy of that choice.

  Cheers.

  ***

  ### Notes on the Construction (For Your Eyes Only)

  1.  **The "Boundary Problem" Nod:** The section *"There is no perfect, cosmic formula for who gets to be part of the 'us'"* and *"The boundary might be contingent, but the commitment isn't"* signals to your colleagues that you acknowledge the Whelan/Dahl/Abizadeh critique without using the jargon. You are admitting the *demos* cannot be defined democratically from the inside, nor naturally from the outside.
  2.  **Reframing Arbitrariness:** Instead of letting the arbitrariness undermine the ceremony (the "downer" risk), the toast frames it as the *source* of agency. If the border were natural, Priya's inclusion would be deterministic. Because it is constructed, her inclusion is volitional. This aligns with a constructivist view of democratic legitimacy.
  3.  **The "Us" as Verb:** The line *"You've decided that 'we' is a verb"* is a subtle nod to the idea that the demos is constituted by the act of participation (constituent power), rather than pre-existing it.
  4.  **Audience Safety:** For the family and book club, this reads as a standard, slightly intellectual but warm sentiment about "choice vs. destiny." It avoids cynicism ("the state is fake") and lands on solidarity ("the community is real").
