answer: |-
  The automatic doors of the grocery store slid open, exhaling a blast of chilled air that smelled of floor wax and rotting bananas. Elias adjusted his grip on the cart with his right hand. His left hand hung loose at his side, fingers twitching slightly, as they sometimes did when he was tired.

  "You got the list?" Sarah asked. She was walking on his right side. This was important, though neither of them thought about it consciously anymore. If she walked on his right, her face fell into his right visual field. The information crossed to his left hemisphere, where the language lived. If she walked on his left, he sometimes had to pause a fraction of a second too long before answering, as if the audio signal had to take a detour through the subcortical backroads to find the words.

  "Got it," Elias said. His voice was smooth, confident. The left hemisphere liked to talk. It liked to have a plan.

  They moved into the cereal aisle. The fluorescent lights hummed, a high-frequency whine that Elias claimed he couldn't hear but which made his teeth ache. Sarah was talking about her mother, about the surgery, about the insurance forms. Elias nodded, keeping his eyes fixed on her profile. He was a good listener. His left hemisphere processed her syntax, parsed her grievances, and formulated empathetic responses.

  On his left, the shelves rushed by in a blur of primary colors. That data went to the right hemisphere. It saw shapes, spatial relationships, emotional tones. It didn't care about the insurance forms. It cared about the red box with the yellow star that had just come into the peripheral field.

  Elias stopped the cart. His left hand shot out, quick and decisive, and snatched the box from the shelf. It was a brand they hadn't bought in ten years. It was high in sugar, low in fiber, and cost twice as much as their usual brand.

  Sarah stopped talking. She looked at the box in his left hand, then up at his eyes. "Elias? We don't eat that."

  Elias looked down. He seemed surprised, but only for a microsecond. The surprise belonged to the left hemisphere, which had just become aware that the hand was holding an object it hadn't ordered. The right hemisphere knew exactly why it was holding the box. It remembered the texture of the cardboard. It remembered the Saturday morning light of a kitchen in 1998. It remembered a feeling of safety that had nothing to do with nutrition.

  But the right hemisphere couldn't say that. It had no vocabulary. It had no access to the vocal cords.

  Elias turned the box over in his left hand. His right hand reached over to steady it. "Yeah," Elias said. His tone was reasonable, explanatory. "I saw the label. It's the fortified kind. You were saying your iron levels were low."

  Sarah frowned. "I didn't say that. And that's the sugary kind, Eli. The fortified one is the blue box."

  Elias blinked. The left hemisphere registered the contradiction. It felt a spike of dissonance, a glitch in the narrative. But the left hemisphere's primary job was not truth; it was coherence. It was the Interpreter. It could not tolerate a gap in the story. It could not admit, *I don't know why my hand did that.*

  "Right," Elias said, without missing a beat. "The blue one. I grabbed this by mistake. But look, there's a coupon on the back."

  "There isn't," Sarah said softly.

  "There is," Elias insisted. He flipped the box. There was no coupon. He ran his thumb over the smooth cardboard where a coupon should have been. He felt the absence, but his mouth kept moving. "It's... it's peel-off. See?" He mimed the peeling motion.

  Sarah didn't look at the box. She was looking at his face. She had seen this before, years ago, before they learned to manage the aisles, before they learned which side of the bed to sleep on. She had seen the moment the bridge went down and the two banks of the river had to shout across the water.

  "Eli," she said. "Put it back."

  The left hand tightened its grip. The knuckles whitened. This wasn't a conscious squeeze; it was a resistance. The right hemisphere didn't want to let go. The memory of the yellow star was a physical weight.

  The right hand reached over and tried to pry the box loose. For a moment, the two hands fought over the cardboard. The right hand pulled; the left hand held. It was a silent tug-of-war inside a single body. Elias's face remained calm, mask-like, while his torso twisted slightly with the tension.

  The left hemisphere sensed the conflict. It needed to resolve the motor dispute just as it had resolved the verbal one. It needed a reason for the struggle that made sense.

  "I'm just checking the expiration date," Elias said. His voice was strained now, fighting the resistance of his own fingers. "It's important. You know how they rotate the stock."

  "The date is on the top," Sarah said. "Your hand is covering it."

  Elias looked at his hands. He saw the struggle. He saw the left hand refusing the right. The left hemisphere, which controlled the right hand and the voice, suddenly found itself in a minority vote. It was the CEO whose middle management was refusing to execute the order.

  He forced the right hand to let go. He stepped back, leaving the box in the left hand. He couldn't force the left hand to drop it without causing a scene, without admitting that the control was fractured.

  "Okay," Elias said. He placed the box in the cart with his left hand. "We'll get it. Just in case."

  "In case of what?"

  "In case guests come over," he said. "Kids like it."

  They don't have kids, Sarah thought. Theirs had died in infancy, five years before the aneurysm, five years before the surgery.

  She didn't say it. She knew that if she said it, the left hemisphere would have to construct a reason for the mistake. *I meant our nieces. I meant the neighbors.* It would build a scaffold of lies to cover the hole, and she would have to watch him climb it.

  "Okay," she said. "Guests."

  They moved to the end of the aisle. Elias kept his eyes on her. He kept her on his right. He was terrified of looking to the left. If he looked to the left, the visual fields would merge, the corpus callosum wouldn't be needed to transfer the image, and the illusion of unity would return. But he knew that the unity was a trick.

  As they turned the corner toward the produce section, a man in a red jacket walked past them on the left side.

  Elias's left hand lifted. It wasn't a wave. It was a defensive posture, palm open, fingers splayed. A stop signal.

  Elias didn't see the man. His eyes were locked on Sarah.

  "Watch out," Elias said.

  "For what?" Sarah asked. She looked left. There was nothing there but the man walking away.

  "Nothing," Elias said. He lowered his left hand. "Just... felt like someone was there."

  The right hemisphere had seen the red jacket. It had associated the color with danger, or perhaps authority, or perhaps a specific memory of a father's coat. It had reacted. The left hemisphere had felt the muscles tense and invented the threat to justify the tension.

  They reached the apples. Elias picked one up with his right hand. He inspected it. "These look good," he said. "Firm."

  He tossed it into the bag.

  Sarah watched him. She wondered, not for the first time, who she was walking with. Was it the man who spoke to her, the one who remembered their anniversary and made jokes about the insurance? Or was it the silent partner who chose the cereal and flinched at red jackets?

  Or was it neither? Was it just a body, a vessel where two incomplete circles tried to draw a whole one, constantly erasing the lines where they didn't match?

  "Eli?"

  He turned. His smile was warm. It was generated by the left hemisphere, which loved her, which knew her name, which knew the script of a marriage.

  "Yeah?"

  "Nothing," she said. "Just checking."

  "Checking what?"

  "Checking if you're still there."

  Elias laughed. It was a genuine laugh. The left hemisphere found the joke funny. The right hemisphere, she suspected, didn't get it. It was busy watching the shadows in the produce aisle, counting the apples, feeling the weight of the cart.

  "I'm here," Elias said. He reached out with his right hand and took hers. "I'm right here."

  His left hand stayed at his side, clenched into a fist, holding onto nothing, guarding a reason he couldn't speak.
