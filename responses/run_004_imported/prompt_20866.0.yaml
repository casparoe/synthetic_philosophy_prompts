answer: |-
  This is an excellent question that cuts to the heart of Moore's meta-ethics. You have identified what many scholars regard as the central structural tension in *Principia Ethica*: the relationship between the **Method of Isolation** (Chapter 2) and the **Principle of Organic Unities** (also Chapter 2, but applied throughout).

  The short answer is that Moore is not running two incompatible pictures together, but the coherence relies on a precise, often overlooked distinction regarding *what* is being isolated. The tension dissolves if we understand the Method of Isolation as testing for **external relations** (consequences/causes), while the Principle of Organic Unities governs **internal relations** (constituents/structure).

  Here is a reconstruction of how these two devices cohere, specifically tailored for your seminar discussion on "The Ideal."

  ### 1. Clarifying the Scope of the Isolation Test
  The primary source of confusion lies in what Moore means by "isolating" a thing. In Chapter 2 (Section 18), Moore defines the method thus:

  > "In order to decide whether a thing has intrinsic value... we must consider it in isolation... we must consider whether, if it existed **absolutely by itself**, it would still have value."

  Students (and critics) often interpret "absolutely by itself" to mean the thing must be **simple** or stripped of all internal complexity. If so, Organic Unities would indeed contradict Isolation, because Organic Unities insist that value often arises *only* from complex combinations.

  However, Moore's Isolation Test is designed to strip a candidate good of its **causal consequences and external accompaniments**, not its **internal constituents**.
  *   **Isolation asks:** "If this state of affairs obtained, and nothing else followed from it, would it still be good?"
  *   **It does not ask:** "If we dissect this state of affairs into its smallest metaphysical atoms, are those atoms good?"

  Therefore, the "thing" we isolate can be a complex whole. When Moore isolates "the consciousness of a beautiful object," he is treating that *entire complex state* as the unit of evaluation. He is not isolating the *emotion* from the *cognition*; he is isolating the *unified state* (emotion + cognition) from the *rest of the universe*.

  ### 2. Intrinsic Value vs. Value as a Part
  The principled reconciliation rests on a distinction Moore makes explicitly in Section 18, though he applies it inconsistently elsewhere. He distinguishes between:
  1.  **Intrinsic Value:** The value a thing has in itself (determined by Isolation).
  2.  **Value as a Part:** The contribution a thing makes to the value of a whole in which it is embedded (determined by Organic Unities).

  Moore's argument in "The Ideal" proceeds in two stages that utilize these distinct concepts:

  **Stage 1: Identifying the Whole (Using Isolation)**
  Moore uses the Isolation Test to determine that the *complex whole*—"the consciousness of a beautiful object"—has immense **Intrinsic Value**. He asks us to imagine a universe containing nothing but this state. He concludes it would still be good. Thus, the *whole state* passes the Isolation Test.

  **Stage 2: Analyzing the Constituents (Using Organic Unities)**
  Once the *whole* is established as the locus of value, Moore uses the Principle of Organic Unities to analyze the *parts*. He argues that:
  *   The cognition alone (without emotion) has little value.
  *   The emotion alone (without cognition) has little value.
  *   The **Whole** has great value.

  This is a classic Organic Unity: $Value(Whole) \gg Value(Part_A) + Value(Part_B)$.

  There is no contradiction here because the Isolation Test was never applied to the *parts* in isolation from each other; it was applied to the *whole* in isolation from *consequences*. The Organic Unity principle explains why we cannot attribute the value of the whole to either part individually.

  ### 3. Application to the "Supreme Goods" Passage
  In the passage you cite, Moore writes: *"certain states of consciousness, which may be roughly described as the pleasures of human intercourse and the enjoyment of beautiful objects."*

  For your seminar, it is crucial to parse "states of consciousness" carefully. Moore is not a hedonist; he does not mean "pleasure" as a simple feeling-tone. By "enjoyment," he means a **complex intentional state**.

  *   **The Tension:** If the value depends on the combination (Organic Unity), how can we say the "state of consciousness" is the good (implying the consciousness is the carrier of value)?
  *   **The Resolution:** For Moore, the "state of consciousness" *includes* the object as an intentional correlate. The "object" is not external to the state of consciousness in the relevant sense; it is a constituent of the state.
      *   When Moore applies Isolation, he isolates the *State* (Subject + Awareness + Object).
      *   When he applies Organic Unities, he notes that the *Subject's Awareness* and the *Object* are distinct constituents that generate value only when combined.

  If you isolate the *feeling* from the *object*, you are no longer isolating the "state of consciousness" Moore identified as the good; you are isolating a different, lesser thing. Moore anticipates this in Section 113, where he warns against thinking that the *feeling* is the sole locus of value. He insists that the *truth* of the cognition matters (a point where he gets notoriously tangled, but the structural point remains).

  ### 4. Why Commentaries Often Miss This
  You noted that commentaries tend to invoke one or the other. This is because Moore's own usage shifts.
  *   In **Chapter 2**, he is rigorous: Isolation tests the whole; Organic Unities analyze the parts.
  *   In **Chapter 6 ("The Ideal")**, he is rhetorical. He speaks loosely of "personal affection" or "appreciation" as if they are simple qualities.

  The Bloomsbury Group (Keynes, Strachey) famously latched onto the phrase "states of consciousness" and the Isolation Test to justify a kind of aesthetic hedonism—valuing the *feeling* above all. They effectively ignored the Organic Unity constraint that Moore places on those feelings (i.e., that they must be directed at *truly* beautiful objects or *truly* worthy persons to have maximum value). They treated the *part* (the emotion) as if it had the value of the *whole* (the organic unity of emotion + worthy object).

  For your seminar, pointing out this "Bloomsbury Misreading" is a powerful pedagogical tool. It shows the real-world consequence of collapsing the distinction between Intrinsic Value (of the whole state) and Value as a Part (of the emotion).

  ### 5. Seminar Discussion Strategy
  To lead your students through this, I suggest the following steps:

  1.  **Define the Units:** Ask students to identify exactly *what* Moore is isolating in the "supreme goods" passage. Is it the feeling? The object? Or the relation? (Answer: The relational state).
  2.  **The "Two-Step" Verification:** Have them apply the Method of Isolation to the *complex state* (Does a universe with only appreciation of beauty have value? Yes). Then apply Organic Unities to the *components* (Does a universe with only the feeling, but no object, have value? No/Little).
  3.  **The "Direction" of the Test:** Emphasize that Isolation looks **outward** (severing causal links to the rest of the universe), while Organic Unities looks **inward** (examining constitutive links within the state). They operate on different axes.
  4.  **The Problem of Truth:** Moore complicates this by suggesting the object must *really* exist for the highest value (Section 113). This tests the limits of Isolation. If the value depends on the *existence* of the object outside the mind, is the "state of consciousness" still the sole good? Moore struggles here, admitting that the *whole* includes the external existence. This is where the tension is most palpable and where Moore is most vulnerable to criticism (e.g., from Russell or later Broad). Acknowledging this vulnerability shows intellectual honesty while maintaining the structural coherence of the method.

  ### Conclusion
  Moore is not incompatible, but he is precarious. The Method of Isolation establishes the **locus** of value (the complex state of consciousness), while the Principle of Organic Unities explains the **structure** of that locus (why the parts don't sum to the whole).

  The isolation test survives contact with organic unities because isolation removes *external* context, whereas organic unities describe *internal* context. Moore's "supreme goods" are organic unities that have been successfully isolated from the rest of the universe. The Bloomsbury interpretation failed because they isolated the *parts* (the feelings) and assumed they retained the value of the *whole*.

  This reconstruction should provide your seminar with a robust textual anchor to explore not just Moore's ethics, but the meta-ethical machinery that underpins it.
