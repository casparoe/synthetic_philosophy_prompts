      *   **Goal:** A careful reconstruction of how these two methodological devices cohere in Moore's system, specifically regarding the "supreme goods" passage. The user wants to resolve the apparent incompatibility.

  2.  **Deconstruct the Tension:**
      *   *Isolation Test:* "Imagine $X$ exists alone. Is it good?" If yes, $X$ has intrinsic value.
      *   *Organic Unities:* "Whole $W$ contains parts $A$ and $B$. Value($W$) $\neq$ Value($A$) + Value($B$)." Sometimes $A$ has no value alone, but adds immense value to $W$. Or $W$ has value, but neither $A$ nor $B$ does alone.
      *   *The Conflict:* Moore uses Isolation to prove $X$ is intrinsically good. But then he says $X$ (e.g., consciousness of beauty) is only truly valuable when combined with $Y$ (the beautiful object). If $X$ needs $Y$ to be valuable, doesn't that mean $X$ isn't valuable *in isolation*?
      *   *Specific Case:* Moore argues that *mere* cognition of beauty isn't very good, and *mere* emotion isn't very good. The *whole* (consciousness of beauty) is the great good. But earlier, he seems to imply "states of consciousness" are the goods.

  3.  **Consult Moore's Text (Mental Retrieval & Verification):**
      *   *Principia Ethica*, Section 110 (The Ideal): "By far the most valuable things... are certain states of consciousness..."
      *   *Principia Ethica*, Section 18-23 (The Method of Isolation): Defined early on to distinguish intrinsic from instrumental value.
      *   *Principia Ethica*, Section 18 (Organic Unities): "The value of a whole must not be assumed to be the same as the sum of the values of its parts."
      *   *Crucial Distinction:* Moore distinguishes between *intrinsic value* (what belongs to the thing itself) and *value as a part* (what contribution it makes to a whole).
      *   *The "State of Consciousness" Nuance:* Moore doesn't isolate the *object* (the painting) from the *consciousness* (the appreciation). The "good" is the *whole state of consciousness* which includes the object as an intentional object.
      *   *Refining the Isolation Test:* Isolation isn't about physical separation; it's about causal/consequential separation. It asks: "Does this state of affairs have value even if nothing else follows?" It does *not* necessarily mean dissecting the internal structure of the state of affairs itself.

  4.  **Formulate the Resolution:**
      *   **Point 1: Clarify the Object of Evaluation.** Moore isn't isolating the *emotion* from the *object* to test the emotion's value. He is isolating the *complex whole* (consciousness of beauty) from its *consequences*. The "thing" being tested for intrinsic value is already a complex unity.
      *   **Point 2: Distinguish "Intrinsic Value" from "Value as a Part."** This is the technical key.
          *   *Intrinsic Value:* Value the thing has in itself (tested by isolation from *consequences*).
          *   *Value as a Part:* How much a component contributes to a whole.
          *   Moore argues the *whole state* (appreciation + object) has intrinsic value. The *parts* (mere feeling, mere object) have little intrinsic value and little value as parts *outside* that specific unity.
      *   **Point 3: The Scope of Isolation.** Isolation strips *external* relations (causes/effects), not *internal* relations (constituents). Organic unities deal with internal constitution. Therefore, they operate at different levels.
      *   **Point 4: Addressing the "Supreme Goods" Passage.** When Moore says "states of consciousness," he means the complex state (awareness *of* something). He isn't saying "pleasure" alone is the good (hedonism refuted). He is saying the complex state is the good.
      *   **Point 5: Pedagogical Angle.** How to teach this to grad students? Focus on the definition of "whole" vs. "part" and the direction of the isolation (outward vs. inward).

