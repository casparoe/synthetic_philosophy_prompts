      *   *Step 2: The Crucial Distinction.* Intrinsic Value vs. Value as a Part. This is the linchpin. Moore explicitly makes this distinction in Chapter 2.
      *   *Step 3: Applying to the "Ideal".* The "state of consciousness" is the *whole*. It contains the cognition and the emotion. We isolate *this whole* from the rest of the universe to test its intrinsic value. We use Organic Unities to analyze *why* the parts don't work without each other.
      *   *Step 4: Resolving the Tension.* Isolation doesn't require the good to be simple. It requires the good to be self-contained regarding *consequences*. Organic unities explain the *internal structure* of that self-contained good.
