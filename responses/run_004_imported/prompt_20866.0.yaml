      *   *Isolation Test Scope:* I need to be very clear that Isolation removes *causal* context, not *constitutive* context. If I isolate a "consciousness of beauty," I don't strip the "beauty" from the "consciousness." I strip the "consciousness of beauty" from the "political consequences" or "future happiness."
