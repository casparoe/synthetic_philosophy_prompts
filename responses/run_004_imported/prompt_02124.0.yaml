  *(Self-Correction during drafting)*: I need to be careful not to just say "panpsychism is weird." Tononi accepts panpsychism. The issue is specifically the *expander graph* case. The argument must be that *this specific implication* is a bug, not a feature, because it severs the link between causal power and phenomenological unity in a way that contradicts the very axioms IIT claims to honor.

  *Refining the Physics Analogy:* In QM, intuition was about *macroscopic* objects (balls, waves). The theory corrected intuition about *microscopic* objects. In IIT, the intuition is about *experience itself*. There is no "microscopic experience" to hide behind that we can verify independently. The subject *is* the verifier.

