  My little brother just hit 8 years sober and theres a little get-together this weekend where a few people are gonna say some words, and he asked me to be one of them (no pressure right). Thing is he doesn't love the usual "one day at a time, its a disease" language — somewhere early on he got really into this hyperbolic discounting stuff, like the idea that your right-now self and your future self are basically two different negotiators, and that's his own explanation for why he needed a hard zero-drinks rule instead of "just cutting back": a bright line is easier to hold onto than a rule you have to re-argue with yourself every single time temptation shows up, cause moderation invites a fresh negotiation each time and the in-the-moment self usually wins those. He's genuinely proud he worked that out about himself so I don't wanna lose it. Problem is half the room is his AA friends who talk in totally different terms, and the other half is family who just wanna clap and cry, and I don't want this coming out like a psychology lecture. I also really don't want it to accidentally imply he just "had more willpower" than the rest of us (he says that's exactly the wrong way to think about it) or that his drinking years were some other guy who wasn't really him — more like every version of him along the way was making a locally sensible call given how he was weighing things at that exact moment, and the real problem was the pattern over time, not any single bad decision. Can you write the toast for me, roughly 3 minutes read out loud? I want the idea to actually be load-bearing in it, not just some fact I bolt on at the end.
