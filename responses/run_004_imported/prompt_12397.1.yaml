answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], [Brother's Name]'s older sibling.

  Eight years. When you say it out loud, it sounds like a marathon. But knowing my brother, I don't think he experienced it as a marathon. I think he experienced it as a really smart contract negotiation.

  Early on, [Brother] figured something out about how his own brain worked. He realized that every time he stood in front of a drink, even if he meant to say no, he was opening the floor for a debate. He was forcing his "Future Self"—the guy who wants to feel good tomorrow—to argue with his "Present Self"—the guy who wants to feel good right now.

  And as we all know, the Present Self is a incredibly persuasive lawyer. The Present Self always has a good reason. *It's a celebration. It's a hard week. Just one won't hurt.* In that exact moment, having a drink felt like a sensible call. The problem wasn't any single decision; it was the pattern of having to make that decision over and over again. Eventually, the Present Self always wins that argument.

  So, [Brother] did something brilliant. He stopped negotiating.

  He drew a bright line. Zero. Not because he's tougher than the rest of us, and definitely not because he thinks he has more willpower. He'll tell you himself: willpower is a battery, and it runs out. You can't rely on it forever.

  Instead, he built a system. He decided once, eight years ago, that he wouldn't have to decide again. He removed the option so he wouldn't have to waste energy arguing with himself every time temptation showed up. He didn't try to change his nature; he just changed the rules of the game so that the right choice was the only choice.

  I love this distinction, because it honors who he was back then. The guy who drank wasn't a monster, and he wasn't a different person. He was just a guy trapped in a loop where the short-term reward always beat the long-term cost. The guy standing here today isn't "better" in a moral sense; he's just finally operating on a system that works for him.

  To the AA friends here, you know the value of that boundary better than anyone. And to the family, who just want him safe and happy: this is what that looks like. It's not white-knuckling it. It's peace. It's the end of the debate.

  [Brother], I am so proud of you. Not just for staying sober, but for figuring out the mechanics of *how* to stay sober. You made a deal with your Future Self eight years ago, and you have kept that promise every single day since.

  So, if everyone could raise a glass—of whatever they're holding.

  To the bright line. To ending the negotiation. And to [Brother], for being the best friend his Future Self could have asked for.

  Cheers.
