answer: |-
  **Setting:** *A sterile hallway outside Committee Room B in the State Capitol. Two briefcases sit on the floor between a pair of uncomfortable chairs. DR. ELENA ROSTOVA (40s, Statistics/Epistemology) is reviewing a handout. DR. MARCUS THORNE (50s, Ethics/Public Policy) is staring at the closed doors.*

  **Thorne:** You know they're going to ask about the base rates immediately. If you walk in there claiming COMPAS is fair because it's calibrated, the public defenders will eat you alive. They know the Chouldechova paper. They know that if the recidivism base rates differ between Group A and Group B, calibration and equalized odds are mutually exclusive.

  **Rostova:** I'm counting on them knowing it, Marcus. That's precisely why calibration is the only ethically defensible position. If I hand you a risk score of 0.7, it means there is a 70% probability of recidivism. It means that whether you are in Group A or Group B. If I distort that number to satisfy error rate balance, I am lying to the judge about the evidence.

  **Thorne:** You're not lying about the evidence. You're lying about the *consequence* of the evidence. Look, I'm not arguing against probability. I'm arguing against the downstream allocation of liberty. If the base rate for Group A is higher, and you maintain calibration, then at *any* given threshold for detention, Group A will suffer a higher False Positive Rate. You are systematically over-detaining people from Group A who wouldn't reoffend, compared to Group B.

  **Rostova:** But that's a decision problem, not a measurement problem. You're conflating the risk score with the cutoff. If the legislature decides that a False Positive (detaining someone safe) is ten times worse than a False Negative (releasing someone risky), they can set different thresholds for different groups *using my calibrated scores*. If I give you Equalized Odds scores, you've lost the informational content required to make that trade-off rationally. A score of 0.7 no longer means 0.7.

  **Thorne:** That's the "epistemic integrity" argument. I've heard it. It sounds noble until you realize nobody in that room is going to set group-specific thresholds. It's politically toxic. In the real world, the threshold is fixed. "Score above 6? Deny bail." If you hand me a calibrated tool in a world with fixed thresholds and differing base rates, you have mathematically guaranteed that the burden of error falls disproportionately on the high-risk group. You're washing your hands of the cost-shifting.

  **Rostova:** I'm not washing my hands. I'm refusing to hide the cost. Here is my strongest point, Marcus: Equalized Odds covertly imposes a specific utility function. By demanding equal FPR and FNR, you are asserting that the social cost of a False Positive is identical to the social cost of a False Negative, *and* that these costs are identical across groups. But you're doing it silently, inside the algorithm. Calibration exposes the trade-off. It says, "Here is the truth about the risk. Now you, the democracy, have to decide how much risk you tolerate." Forcing error balance pretends the trade-off doesn't exist.

  **Thorne:** That's a compelling frame, Elena, but it assumes the decision-makers are rational agents maximizing utility. They aren't. They're institutional actors operating with historical biases. If you give them a "truthful" score that results in 40% of Group A being falsely detained versus 10% of Group B, you haven't "exposed the trade-off." You've automated the disparity. You're saying, "The base rates are different, therefore the injustice is justified."

  **Rostova:** No. I'm saying the base rates are a fact of the world—perhaps a tragic fact, perhaps a result of prior systemic injustice—but the risk score is a *prediction*, not a *policy*. If I bake the policy into the prediction to fix the error rates, I destroy the score's ability to be used for anything else. What if we use this for parole instead of bail? The cost function changes. If I hard-code Equalized Odds for bail, the score is garbage for parole. Calibration is invariant to the decision context. It respects the separation of powers. The algorithm predicts; the legislature decides.

  **Thorne:** But the algorithm *is* the decision context. It's not a neutral thermometer. It's a gatekeeper. When you say "Calibration is invariant," what you mean is "The meaning of the number is invariant." But fairness isn't about the meaning of the number; it's about the distribution of the harm. Let's press on your "separation of powers" point. If you know the legislature won't set different thresholds, and you know the base rates differ, and you know calibration implies disparate FPR... then choosing calibration *is* choosing the policy. You are choosing the policy that prioritizes the semantic consistency of the score over the equitable distribution of freedom.

  **Rostova:** *(Pauses, tapping her pen on the briefcase)* Okay. That's the strongest version of your objection. You're arguing that in a non-ideal world, providing "true" probabilities to agents who will apply them unjustly makes you complicit in the injustice.

  **Thorne:** Exactly.

  **Rostova:** But consider the reverse. If I give you Equalized Odds, I am forcing the scores to be miscalibrated. For Group A, a score of 0.7 might actually mean 0.8 risk. For Group B, it might mean 0.6. If a judge knows this, they will mentally adjust. If they don't know this, they are being deceived. If they *do* know this, why not just give them the calibrated score and tell them to adjust the threshold?

  **Thorne:** Because "adjust the threshold" is code for "apply a different standard of justice based on group membership." That violates equal protection. I cannot stand before a judge and say, "For this demographic, we require a higher standard of proof to grant bail." That's legally and morally untenable. Equalized Odds ensures that the *procedure* treats groups equally, even if the *base rates* differ. It equalizes the opportunity to be correctly classified.

  **Rostova:** It equalizes the error, but it unequalizes the meaning. Look, I think we've located the disagreement. It's not about whether we want fairness. It's about whether fairness is a property of the *information* or a property of the *allocation*.

  **Thorne:** Go on.

  **Rostova:** I view the risk score as a public good, like a weather report. If it rains more in Seattle than Phoenix, a calibrated forecast will predict rain more often in Seattle. If you force the forecast to predict rain equally often in both cities to satisfy some "equalized odds" of getting wet, you ruin the forecast for everyone. You want the risk score to be a policy mechanism that corrects for the rain.

  **Thorne:** But people aren't cities. And "getting wet" isn't the same as "losing your liberty." The weather report analogy fails because the forecast doesn't *cause* the rain. But this risk score? It feeds directly into a cage. If the score is high, you stay. The measurement and the intervention are coupled. So I view the risk score not as a weather report, but as a rationing coupon. If we are rationing a scarce good—freedom, or safety—then the fairness constraint must apply to the distribution of the errors, not the semantic consistency of the coupon.

  **Rostova:** So you're admitting it. You don't actually care about the risk score's accuracy. You care about the *allocation rule*.

  **Thorne:** I care about accuracy *conditional on justice*. If the only way to get equal error rates is to sacrifice some calibration, I'll take that trade. Because the harm of disparate false positives outweighs the harm of semantic confusion.

  **Rostova:** And I'll take the opposite trade. Because if we sacrifice calibration, we lose the ability to even *measure* the disparity accurately. We can't fix the base rate problem if we're masking it in the algorithm. You want to treat the symptom; I want to ensure the diagnosis is correct so we can treat the disease.

  **Thorne:** *(Sighs, looks at his watch)* Here's the thing, Elena. The impossibility theorem says we can't have both. We are forced to choose which sin is venial and which is mortal. You think miscalibration is mortal. I think disparate impact is mortal.

  **Rostova:** Precisely. And I think the reason we're talking past each other is that I'm optimizing for *decision-theoretic flexibility* across potential contexts, and you're optimizing for *distributive justice* within this specific institutional constraint.

  **Thorne:** Which means...

  **Rostova:** Which means if the legislature were willing to adopt group-specific thresholds, my calibrated score would satisfy your concern.

  **Thorne:** Theoretically, yes. But they won't.

  **Rostova:** Then the disagreement isn't about the math. It's about whether we should build tools for the world as it *ought* to be, or the world as it *is*.

  **Thorne:** No. It's about whether we build tools that tell the truth and allow the world to remain unjust, or tools that lie slightly to force a more just outcome.

  **Rostova:** *(Stands up as the door opens)* Then I suppose we should let the committee decide which lie they prefer. Because refusing to choose is the only impossibility result that doesn't hold.

  **Thorne:** *(Stands as well)* After you, Doctor. Let's see if they understand the difference between a forecast and a verdict.

  *[They walk toward the open door, neither yielding the threshold.]*
