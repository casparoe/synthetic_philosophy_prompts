answer: |-
  **MEMORANDUM**

  **TO:** National Anti-Doping Organization (NADO) Ethics Panel & TUE Committee
  **FROM:** [Your Name/Title], Ethics Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Recommendation regarding TUE Application [Case ID: REDACTED] (Propranolol / Essential Tremor / Shooting)

  ### 1. Executive Recommendation

  I recommend the Panel **GRANT** the Therapeutic Use Exemption (TUE) for propranolol, subject to **strict, enforceable conditions** regarding dosage titration and performance monitoring.

  This recommendation rejects the proposal to deny the exemption outright. However, it fully incorporates the concerns of the faction advocating for denial by establishing a framework that acknowledges the inevitable "residual advantage" as a cost of inclusion, rather than pretending such an advantage does not exist. We cannot solve the physiological paradox pharmacologically; we must manage it administratively and ethically.

  ### 2. The Core Ethical Paradox: Baselines and Constitutive Skills

  The deadlock in this committee stems from a conflict between two interpretations of the ISTUE Criterion 3: *The therapeutic use of the prohibited substance must not produce any additional enhancement of performance other than that which might be anticipated by a return to a normal state of health.*

  In most sports, "normal state of health" aligns with "optimal competitive physiology." In precision shooting, it does not.
  *   **The Healthy Shooter Baseline:** Possesses a physiological tremor modulated by adrenaline control. A portion of the skill in shooting is managing this innate noise.
  *   **The Athlete's Baseline:** Pathological tremor (Essential Tremor - ET) exceeding normative physiological noise.
  *   **The Pharmacological Effect:** Propranolol dampens sympathetic nervous system activity. In the athlete, it reduces pathological tremor. In a healthy shooter, it reduces physiological tremor.

  **The Paradox:** A dose sufficient to return the athlete to a *medical* baseline (asymptomatic ET) may inadvertently place her below the *sport-specific* baseline of a healthy competitor (zero/super-low tremor). She is not just returning to "health"; she is potentially bypassing a constitutive challenge of the sport (adrenaline management) that her competitors must face.

  ### 3. The Argument for Denial (The Integrity Objection)

  *This section articulates the strongest version of the argument against granting the TUE, representing the faction I am recommending we override.*

  The argument for denial is not merely about "fairness" in a vague sense; it is about the **constitutive integrity of the sport**. Shooting is not a test of static mechanical stability; it is a test of *psychophysiological regulation under pressure*. The "adrenaline shake" is not a bug in the system of shooting; it is a feature of the contest. It tests the athlete's ability to execute fine motor skills despite the physiological arousal inherent to elite competition.

  By granting a TUE for a beta-blocker in shooting, we are not merely accommodating a disability; we are altering the fundamental test.
  1.  **The Ineliminable Advantage:** Because propranolol is non-selective regarding the *source* of the tremor (pathological vs. physiological), any dose effective for ET will necessarily dampen competition-induced adrenaline tremors more effectively than a healthy shooter can manage naturally.
  2.  **The Precedent Risk:** If we accept that a medical condition can grant a mechanical advantage that outweighs the normative constraints of the sport, we erode the "level playing field" principle. We risk moving from a model of *accommodation* (allowing participation) to *optimization* (allowing superior function).
  3.  **The "Unworkable" Claim:** If we cannot distinguish between therapeutic restoration and performance enhancement via blood levels or clinical observation, the rule is functionally unenforceable. Denial is the only way to maintain the enforceability of the Prohibited List for this discipline.

  **Assessment:** This argument is philosophically robust. It correctly identifies that "health" is not neutral in sport. In shooting, health *includes* a certain level of physiological noise. Removing that noise is, by definition, an enhancement relative to the sport's specific demands, even if it is therapeutic relative to general health.

  ### 4. The Argument for Granting (The Inclusion Objection)

  *This section articulates the argument for granting the TUE.*

  The argument for denial, while logically sound regarding sport integrity, fails the test of **proportionality and human rights**.
  1.  **Exclusion as Harm:** Denying the TUE does not preserve fairness; it preserves exclusion. It effectively bans the athlete from her profession due to a documented neurological condition. This transforms a health condition into a career termination event.
  2.  **Intent vs. Effect:** The ISTUE focuses on the *intent* of the treatment. The intent here is to manage a chronic neurological disorder diagnosed prior to elite participation. The performance benefit is a secondary effect of treating the pathology, not the primary driver (unlike a healthy shooter taking beta-blockers purely to steady aim).
  3.  **The "Normal Health" Definition:** We must interpret "normal state of health" relative to the *athlete*, not the *sport*. Her normal state of health is "absence of debilitating tremor." That her medical baseline confers a mechanical advantage in this specific sport is an unfortunate contingency, not a violation of the spirit of the rules. To demand she compete with untreated ET is to demand she compete in a state of *illness*.

  ### 5. Synthesis: The "Least Unjust" Accommodation

  We are faced with a choice between two injustices:
  1.  **Injustice A (Denial):** Excluding an athlete from competition due to a medical condition, prioritizing the abstract integrity of the sport over the concrete rights of the participant.
  2.  **Injustice B (Grant):** Allowing a participant to compete with a potential mechanical advantage over peers, prioritizing inclusion over strict equality of condition.

  **Ethical Resolution:** In cases of documented, pre-existing pathology, **Injustice A is morally weightier than Injustice B.**

  Exclusion is absolute and punitive. Advantage is probabilistic and manageable. We cannot cure the paradox (that treating ET makes one steadier than healthy), but we can mitigate the risk of *optimization*. We must grant the TUE but structure it to ensure the drug is used to manage *health*, not to optimize *aim*.

  We accept a "residual advantage" as the necessary cost of ensuring the sport remains open to athletes with chronic medical conditions. This aligns with the WADA Code's evolving stance on athlete welfare, provided the integrity of the competition is guarded through monitoring.

  ### 6. Recommended Conditions for Approval

  To address the valid concerns of the "Denial" faction, the TUE should not be unconditional. It must be structured to minimize the risk of performance optimization.

  **Condition 1: Minimum Effective Dose (MED) anchored in Daily Life.**
  The dosage must be titrated to the minimum level required to manage symptoms in **Activities of Daily Living (ADL)**, not competitive performance.
  *   *Requirement:* The treating neurologist must certify that the prescribed dose is the MED for ADL (e.g., writing, eating, holding objects).
  *   *Rationale:* This prevents the athlete and physician from titrating the dose upward to eliminate competition-specific adrenaline tremors. If the dose eliminates ADL tremor but is increased further for competition, it violates the TUE.

  **Condition 2: Out-of-Competition (OOC) Usage Mandate.**
  Since beta-blockers are banned OOC for shooters, the TUE must cover OOC use.
  *   *Requirement:* The athlete must demonstrate consistent therapeutic usage OOC.
  *   *Rationale:* This prevents "game-day dosing." If the drug is only taken during competition, it suggests performance intent. Consistent OOC use reinforces the therapeutic necessity for chronic management.

  **Condition 3: Performance Monitoring Clause.**
  *   *Requirement:* The NADO reserves the right to review the TUE if the athlete's performance metrics show a statistically significant deviation from pre-treatment baselines that exceeds normative improvement curves for the sport.
  *   *Rationale:* While difficult to enforce, this places the athlete on notice that super-normal steadiness (e.g., hold stability metrics significantly exceeding peer norms) will trigger a review. It acts as a deterrent against dose manipulation.

  **Condition 4: Annual Re-certification.**
  *   *Requirement:* TUE is valid for 12 months, requiring renewed neurologist confirmation of ET diagnosis and continued necessity.
  *   *Rationale:* Ensures the condition has not resolved or changed, and prevents the TUE from becoming a permanent "license" without oversight.

  ### 7. Conclusion

  Denying this TUE protects the abstract purity of the sport's competitive constraints at the cost of the athlete's livelihood and health. Granting it unconditionally ignores the reality that "treatment" in shooting is indistinguishable from "enhancement."

  By **Granting with Conditions**, we acknowledge the "Denial" side's valid concern: that this athlete *will* likely possess a mechanical steadiness advantage over healthy peers. We accept this not as fair, but as **necessary**. We prioritize the right to participate over the right to a perfectly level physiological playing field, provided the pharmacological intervention is strictly bounded by medical necessity rather than competitive optimization.

  This is the only path that respects the athlete as a person while maintaining the highest possible standard of integrity for the sport.

  **Recommendation:** **GRANT WITH CONDITIONS.**
