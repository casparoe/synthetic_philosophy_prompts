      *   Avoid armchair diagnosis.
      *   Use philosophical/sociological terms accessibly.
      *   Ensure the distinction between "social construction" and "not real" is clear. (Money is socially constructed but has real effects).

  6.  **Self-Correction/Critique during Drafting:**
