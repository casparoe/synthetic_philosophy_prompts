prompt: |-
  A close friend of mine was diagnosed with adult ADHD last year, after she brought her doctor a checklist of traits she had found circulating online. In the months since, she has become active in several ADHD communities on social media, adopted their vocabulary ("executive dysfunction," "time blindness," "ADHD paralysis"), and started redescribing large stretches of her childhood and work history in those terms, even though she used to tell the very same stories quite differently before her diagnosis. Her psychiatrist mentioned, almost in passing, that the formal criteria for the diagnosis have themselves loosened over the past decade or so, partly in order to capture adults and women whose presentation looks different from the hyperactive young boys the category was originally built around.

  Her partner, who has known her for well over a decade, has grown quietly skeptical of all this. He does not deny that she has always struggled with focus and follow-through, but he worries that the label, the online community, and the loosening criteria are together now producing a good deal of what they claim only to describe, rather than simply naming something that was already there before any of it. My friend finds this suggestion insulting, and points out that people said equally dismissive things about other psychiatric diagnoses that are now considered entirely legitimate. Having watched this same disagreement resurface over several dinners, I cannot decide whether her partner has identified a genuine problem with her diagnosis specifically, or is simply describing something that would be true of more or less any psychiatric category, and so cannot really count against this one in particular. Is there a principled way of telling these two possibilities apart, and if not, how should my friend and her partner reason about the diagnosis in the meantime?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Scenario:**
      *   **The Friend:** Diagnosed with adult ADHD last year based on an online checklist + doctor visit. Active in online communities, adopted specific vocabulary, reinterpreting past life events through this lens. Feels validated but defensive against skepticism.
      *   **The Partner:** Skeptical. Acknowledges struggles (focus, follow-through) but worries the diagnosis + community + loosening criteria are *producing* the behavior/identity rather than just describing it. Fears social contagion or performative aspects.
      *   **The Psychiatrist:** Noted criteria have loosened to include adults/women (historical context).
      *   **The Observer (User):** Watching this conflict. Wonders if the partner's skepticism points to a specific flaw in *this* diagnosis (ADHD) or a general feature of *all* psychiatric diagnoses (social construction/looping effects). Wants to know if there's a principled way to distinguish these, or how to navigate the uncertainty.

  2.  **Identify the Core Philosophical/Sociological Concepts:**
      *   **Medical Realism vs. Social Constructionism:** Is ADHD a "real" biological thing waiting to be found, or a category created by society to manage certain behaviors? (It's usually both).
      *   **Ian Hacking's "Looping Effects":** This is the crucial concept. When you classify people, they change their behavior in response to the classification, which in turn changes the classification. This directly addresses the partner's worry ("producing what they claim only to describe").
      *   **Diagnostic Expansion/Criteria Creep:** The psychiatrist's point about loosening criteria.
      *   **Illness Narratives:** How people make sense of suffering. The friend is rewriting her biography.
      *   **Utility vs. Truth:** Does the diagnosis help, regardless of its ontological status?

  3.  **Address the Specific Question:**
      *   *Is there a principled way to tell these two possibilities apart?* (Specific flaw in ADHD vs. General feature of psychiatry).
      *   *If not, how should they reason about the diagnosis in the meantime?*

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate both sides. State the thesis: The partner is describing a real phenomenon (looping effects), but it applies to *most* psychiatric (and many medical) categories, not just ADHD. It doesn't necessarily invalidate the diagnosis, but it complicates it.

      *   **Concept 1: The Looping Effect (Hacking):** Explain this clearly. When people know they are "ADHD," they act differently. This isn't faking; it's identity formation. This supports the partner's observation but frames it neutrally.
      *   **Concept 2: Diagnostic Expansion:** Acknowledge the psychiatrist's point. DSM changes *do* broaden categories. This increases false positives but also catches true positives previously missed (women, inattentive type).
      *   **Concept 3: The "Specific vs. General" Question:**
          *   *Is ADHD unique?* No. Depression, Anxiety, Autism, even Diabetes (patient behavior changes upon diagnosis) show this.
          *   *Is it exacerbated?* Maybe. Social media accelerates the "community" aspect. The "TikTok ADHD" phenomenon is real.
          *   *Conclusion:* It's a general feature of psychiatry, amplified by modern information ecosystems. It doesn't prove the diagnosis is *wrong*, just that it's interactive.

      *   **Concept 4: Pragmatism over Ontology:** Shift the debate from "Is this real?" to "Is this useful?"
          *   Does the label reduce shame? (Friend's view).
          *   Does the label encourage learned helplessness? (Partner's fear).
          *   Treatment response (medication) is a strong validator for ADHD specifically, more so than some other psych conditions.

      *   **Advice for the Friend and Partner:**
          *   Move away from "Real vs. Fake."
          *   Focus on Functionality.
          *   Beware of "Identity Totalism" (becoming *only* the diagnosis).
          *   Acknowledge the social component without dismissing the biological one.

  5.  **Refining the Tone:**
