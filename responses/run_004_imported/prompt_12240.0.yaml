      *   **Premise 2:** NBS uses Independence of Irrelevant Alternatives (IIA). KSS uses Individual Monotonicity (IM).
      *   **Conclusion:** KSS satisfies PO, SYM, IAT, *and* IM. NBS satisfies PO, SYM, IAT, *and* IIA. Since KSS has a "longer list of desiderata" (adding IM to the shared set), it should dominate NBS.
