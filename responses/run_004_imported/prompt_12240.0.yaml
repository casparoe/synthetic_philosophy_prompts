      *   *Premise 2:* Partially correct but misleading. NBS is characterized by PO, SYM, IAT, + IIA. KSS is characterized by PO, SYM, IAT, + IM.
      *   *The Crucial Error:* The user assumes that IIA and IM are compatible or that one is just an "add-on." In reality, **IIA and IM are incompatible** (given the other axioms). You cannot have a solution that satisfies *both* IIA and IM (along with PO, SYM, IAT). This is a fundamental impossibility result.
      *   *The "Longer List" Fallacy:* It's not that KSS has the NBS list *plus* IM. It's that KSS *drops* IIA to *gain* IM. They trade one axiom for another.

  3.  **Identify the Core Conflict:**
      *   The debate isn't about quantity of axioms; it's about the *normative plausibility* of IIA vs. IM.
      *   **IIA (Nash):** If you remove options that weren't chosen anyway, the solution shouldn't change. It implies local independence.
      *   **IM (Kalai-Smorodinsky):** If the feasible set expands in a way that benefits one player without hurting the other's maximum potential, that player shouldn't end up worse off. It implies a concern for relative gains/utopia points.

