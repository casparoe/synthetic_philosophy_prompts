prompt: |-
  so i've been down a bit of a rabbit hole lately -- it started with an offhand line in a rationalist forum thread about dutch-booking conditional bets, and it ended with me actually sitting down and working through Lewis's 1976 triviality proof for indicative conditionals (the 'Probabilities of Conditionals and Conditional Probabilities' paper). now i can't stop thinking about it. could you write me a dialogue between two philosophers of language arguing about it after a formal epistemology workshop? one of them takes the triviality result as vindicating the Adams/Edgington line that indicative conditionals just aren't truth-apt -- he thinks assertibility tracks conditional credence, full stop. the other still wants conditionals to have real truth conditions and is hunting for the exact premise in Lewis's proof to reject: have her actually try a couple of different moves (denying Adams thesis has to hold across every credence function you could update into, or retreating to some kind of restrictor semantics) instead of just asserting she disagrees, and have him come back with a genuine answer to each move, including the classic problem of what a non-truth-apt conditional even means once it's embedded inside a negation or a disjunction. neither should fold or strawman the other -- i want two actual steelmen finding the real crux, not a lecture.
reasoning: |-
