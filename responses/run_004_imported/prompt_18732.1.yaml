          *   *Elena:* Good for modals, but what about bare indicatives? "If it rains, the match is cancelled." Where's the operator? You're smuggling in a covert epistemic modal. That's just truth-conditions for the modal, not the conditional relation itself.
      *   **Move 3: The Embedding Problem (The Expressivist's Burden).**
