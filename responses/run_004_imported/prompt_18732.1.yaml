answer: |-
  **Setting:** *The lobby of the conference hotel, 11:30 PM. The formal epistemology workshop ended three hours ago, but the whiteboard in the corner is still covered in probability trees. Two philosophers, ELENA and MARCUS, are slumped in armchairs with lukewarm coffee.*

  **Elena:** You know, I watched you during the Q&A. When the speaker mentioned Lewis's 1976 proof, you actually winced.

  **Marcus:** Did I? I suppose I did. It's just… it's the ghost at every feast involving conditionals. You bring up Adams' Thesis—that the assertibility of "If A, then C" equals the conditional probability $P(C|A)$—and Lewis materializes to tell you that if you mean that as a truth condition, you've destroyed the probability space.

  **Elena:** So why wince? Why not just accept the gift? Lewis did us a favor. He proved that indicative conditionals *cannot* express propositions. Not without trivializing the world. If $P(A \to C) = P(C|A)$ for all probability functions, then $P(A \to C)$ can only be 0 or 1, unless $P(C|A) = P(C)$. Which is absurd. The only way out is to say conditionals aren't the kind of things that have probabilities of being true. They have degrees of acceptability. Full stop.

  **Marcus:** That's the Edgington line. I know it well. "Suppositionalism." But Elena, giving up truth conditions is a massive bullet to bite. It severs conditionals from the rest of our logic. If "If A, then C" isn't truth-apt, how does it interact with "not," or "or"? What am I asserting when I say, "It is not the case that if it rains, the match is cancelled"?

  **Elena:** You're expressing a state of mind where your conditional credence is low. You aren't describing a fact about the world that makes the conditional false. Look, Marcus, Lewis's proof is rigorous. I'd rather explain away the linguistic intuition that conditionals *look* like propositions than explain away the mathematical proof that they *can't* be.

  **Marcus:** But are we sure the proof applies to every semantic theory we might construct? Lewis makes a specific assumption. He assumes Adams' Thesis holds not just for our current credence function, but for *any* credence function we could update into. Specifically, he assumes we can conditionalize on the conditional itself.

  **Elena:** Go on.

  **Marcus:** Lewis argues that if you learn $A \to C$, you should update your credence such that $P_{new}(C|A) = 1$. But what if learning a conditional isn't standard Bayesian conditionalization? What if the constraint that $P(A \to C) = P(C|A)$ is a constraint only on *rational initial* credences, not on how those credences shift upon learning the conditional? If we deny that conditionals are the kind of things we can conditionalize *on*, the triviality result doesn't get off the ground.

  **Elena:** That's the "Limited Scope" objection. I respect it, but it feels like special pleading. Why would conditionals be immune to learning? If I tell you, "If the switch is flipped, the light goes on," and you believe me, your conditional credence goes to 1. That looks like learning. If you say, "I can't learn that proposition because it isn't a proposition," you're letting semantics dictate epistemology. Plus, Richard Bradley generalized Lewis's result. He showed you don't need the full strength of Lewis's updating assumption. You just need a few plausible constraints on how credences shift. The triviality comes back like a boomerang.

  **Marcus:** Okay, Bradley is tough. But what about the syntactic structure? Lewis treats the conditional as a binary connective, a two-place operator forming a proposition from two propositions. What if that's the category mistake?

  **Elena:** You're reaching for Kratzer.

  **Marcus:** I am. Restrictor semantics. "If A, C" isn't $A \to C$. It's a modal operator restricted by A. "If A, must C." Or even for bare indicatives, there's a covert epistemic modal. "If A, [epistemic necessity] C." The *if*-clause doesn't contribute a proposition; it restricts the domain of the modal. Since there's no binary connective, Lewis's proof doesn't apply. There is no proposition $A \to C$ to assign a probability to. We assign probabilities to the modal claim restricted by A.

  **Elena:** It's elegant, I'll give you that. It saves truth conditions for the whole sentence. But it feels like smoke and mirrors. Where is this covert modal? In "If it rains, the match is cancelled," what is the necessity operator? Epistemic? Metaphysical?

  **Marcus:** Epistemic. Given what we know, in all worlds where it rains, the match is cancelled.

  **Elena:** But then you've changed the meaning. Adams' Thesis works because $P(C|A)$ captures the *uncertainty* of the connection. If you analyze it as a strict conditional over epistemically accessible worlds, you run into the problem of logical omniscience. If I know the laws of physics, and the switch is flipped, then in all epistemically accessible worlds, the light goes on. So the conditional probability is 1. But I might not know the laws of physics. My conditional credence might be 0.9. Your truth conditions make the sentence false when my assertibility is high. You've saved truth conditions by making them too strong.

  **Marcus:** We can weaken the modal. Make it a probabilistic modal. "In most A-worlds..."

  **Elena:** Now you're just building the probability into the truth conditions. And then you're vulnerable to triviality results again, just shifted one level up. Look, Marcus, the real cost of my view isn't the logic; it's the embedding. You brought it up earlier. "Either if A then C, or if B then D." If neither disjunct is truth-apt, what is the disjunction?

  **Marcus:** Exactly. The Frege-Geach problem. If "If A, then C" is just an expression of conditional belief, it has no content to be operated on by "or." You can't disjoin two speech acts.

  **Elena:** Not in classical logic, no. But we can define a logic of acceptability. Gibbard tried this. Validity isn't preservation of truth; it's preservation of high conditional credence. For the embedding issue... look, maybe natural language is messy. Maybe when we embed conditionals, we are engaging in a pretense, or we are utilizing a higher-order propositional surrogate. Or, perhaps more honestly, maybe our intuition that complex sentences like "If A then C or if B then D" are meaningful is actually shaky. Try to find a real-world context where you assert that disjunction without being able to paraphrase it into a non-conditional form.

  **Marcus:** That's dangerous territory. Telling speakers their intuitions about complex sentences are wrong because your theory can't handle them? That's the tail wagging the dog. Consider this: "If the butler didn't do it, then if the gardener didn't do it, the cook must have." Nested conditionals. We reason with these constantly. If the inner conditional isn't a proposition, what is the outer conditional relating to? You're asking me to accept that the architecture of human reasoning is fundamentally different from the architecture of our semantics.

  **Elena:** I'm asking you to accept that the architecture of reasoning is suppositional, not truth-functional. When you process that nested conditional, you aren't evaluating the truth of a proposition. You're running a simulation. You suppose the butler didn't do it. Then, within that supposition, you suppose the gardener didn't do it. Then you check the cook. The "meaning" is the procedure, not the output.

  **Marcus:** But procedures don't compose cleanly. If I say, "I believe that if A then C," I am attributing a belief to you. Beliefs are relations to propositions. If there's no proposition, what is the relation?

  **Elena:** A functional state. Look, let's step back. We have two costs. My cost: We have to rebuild logic to handle non-truth-apt embeddings, and we have to explain away the intuition that conditionals describe facts. Your cost: You have to deny Lewis's proof, either by restricting learning (which feels ad hoc), adopting restrictor semantics (which posits hidden operators and risks mismatching credence), or accepting that conditional probabilities are actually probabilities of some weird, non-boolean proposition (which leads to triviality unless you make the logic non-classical).

  **Marcus:** I'd argue my cost is lower. Keeping truth conditions preserves the unity of language. Propositions are the currency of assertion, belief, and logic. If conditionals aren't propositions, they're aliens in the system. I'd rather tweak the semantics of the conditional—maybe accept a three-valued logic, or a world-relative proposition—than fragment the concept of assertion.

  **Elena:** A three-valued logic? De Finetti?

  **Marcus:** Why not? True, False, or Void. If A is false, the conditional is void. No truth value. Lewis's proof assumes bivalence. If you drop bivalence, the probability calculus changes.

  **Elena:** Now you're fighting on my turf. If it's "Void," it's not truth-apt in the classical sense. You're admitting that the conditional doesn't describe the world in the same way "The cat is on the mat" does. You're just dressing up the suppositional view in truth-conditional clothing. And even then, embedding voidable statements creates nightmares. What is "Not (If A then C)" if the inner part is void?

  **Marcus:** It's... complex. I admit it. But I think the intuition that we are *saying something about the world* when we use conditionals is too strong to discard. When I say, "If you drop that, it will break," I'm not just telling you my credence. I'm telling you about the fragility of the glass. That's a fact.

  **Elena:** But you're only telling them that fact *under the supposition* that they drop it. You're not asserting the fact categorically. That's the crux, Marcus. Lewis showed us that you can't have it both ways. You can't have a categorical fact that behaves exactly like a supposition. I choose the supposition. It explains why we don't bet on conditionals the same way we bet on facts. It explains why Modus Ponens feels right but "Or-to-If" feels wrong.

  **Marcus:** And I choose the fact. Because without it, I don't know what we're disagreeing *about*. If you have high conditional credence and I have low, and there's no fact of the matter, are we really disagreeing? Or just different?

  **Elena:** We're disagreeing about what to expect, given the evidence. That's enough for philosophy.

  **Marcus:** *(Sighs, picking up his coffee cup)* It's 11:45.

  **Elena:** *(Smiles)* If we go to bed now, we'll be tired tomorrow.

  **Marcus:** If we stay up, we'll be exhausted.

  **Elena:** See? You just used two conditionals. Did you express two propositions? Or did you just guide our decision-making?

  **Marcus:** I'm going to bed, Elena. But tomorrow, I'm reading Bradley again. There has to be a premise in that proof that isn't sacrosanct.

  **Elena:** Good luck. I'll be re-reading Edgington. Someone has to defend the sanity of the probabilistic mind.

  **Marcus:** *(Standing up)* Goodnight, Elena. If I see you at breakfast...

  **Elena:** ...then we can continue.

  **Marcus:** Exactly.

  *(Marcus walks away. Elena watches him go, then looks back at the whiteboard, tracing the probability tree with her finger.)*
