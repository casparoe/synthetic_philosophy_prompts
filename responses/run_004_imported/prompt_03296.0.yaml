answer: |-
  This is one of the best questions you can ask about Solomonoff induction and Algorithmic Information Theory (AIT). It cuts right to the heart of why these concepts are profound *mathematically* but frustrating *practically*.

  If Solomonoff induction were a calculator we could actually use, you'd be right: we could settle the String Theory vs. Loop Quantum Gravity (LQG) debate over lunch. But there are three massive reasons why we can't do this, ranging from "mathematically impossible" to "philosophically tricky."

  Here is why scientists can't just calculate $K(x)$ to end the debate.

  ### 1. The Showstopper: Kolmogorov Complexity is Uncomputable
  This is the technical knockout. You cannot calculate the exact Kolmogorov complexity of any non-trivial string.

  To find $K(x)$, you need to find the *shortest* program that outputs $x$. To do that, you would theoretically have to:
  1.  Generate all possible programs in order of length.
  2.  Run them to see if they output $x$.
  3.  Pick the shortest one that succeeds.

  The problem is **Step 2**. Many programs will run forever (the Halting Problem). There is no general algorithm that can tell you if a program will halt or run forever. Therefore, you can never know if a slightly shorter program exists that just happens to take a billion years to finish.

  Because $K(x)$ is uncomputable, Solomonoff induction is also uncomputable. It is a **normative ideal** (a definition of perfect reasoning), not a **prescriptive algorithm** (a method you can actually run). Scientists can't calculate it for the same reason they can't build a perpetual motion machine: the math forbids it.

  ### 2. The "Constant" Loophole (Language Dependence)
  You mentioned that $K(x)$ is supposed to be "language-independent." This refers to the **Invariance Theorem**, which states that the difference in complexity between two universal Turing machines (languages) is bounded by a constant $c$:
  $$|K_1(x) - K_2(x)| \leq c$$

  Philosophers and computer scientists often wave their hands at this and say, "See? It doesn't matter which language we pick." **But for finite, human-scale theories, the constant $c$ matters immensely.**

  The constant $c$ represents the size of the compiler/interpreter needed to translate one language into the other.
  *   If you choose a reference machine (language) that has "String Theory" hard-coded as a primitive opcode, $K(\text{String Theory})$ will be tiny.
  *   If you choose a machine that has "Loop Quantum Gravity" hard-coded, $K(\text{LQG})$ will be tiny.

  Since we don't have a "God's Reference Machine" (a truly neutral universal prior), any choice of programming language introduces a bias. When scientists argue about which theory is simpler, they are often implicitly arguing about **which reference machine (which conceptual framework) is the natural one for the universe.** Calculating $K(x)$ doesn't solve that; it just pushes the debate back to choosing the language.

  ### 3. Theories vs. Data Strings
  Solomonoff induction is designed to predict the next bit in a **sequence of observations**. Physical theories are not just bitstrings; they are generative models with parameters, domains of validity, and conceptual structures.

  How do you even convert "String Theory" into the $x$ for $K(x)$?
  *   Is it the text of the papers? (Bad measure, depends on writing style).
  *   Is it the Lagrangian? (Maybe, but requires defining the mathematical notation).
  *   Is it the code required to simulate a universe governed by those laws? (This is closer, but now you have to decide what counts as an "output"—particle masses? Scattering amplitudes?)

  If you measure the length of the Lagrangian, General Relativity looks incredibly simple. If you measure the complexity of calculating predictions from that Lagrangian for a specific scenario, it might be incredibly complex. Scientists argue because they disagree on *what aspect* of the theory constitutes its "complexity."

  ### So, what are scientists actually doing?
  They aren't calculating $K(x)$, but they **are** using computable approximations of it. You might recognize these from statistics:
  *   **AIC (Akaike Information Criterion)**
  *   **BIC (Bayesian Information Criterion)**
  *   **MDL (Minimum Description Length)**

  These are all practical attempts to implement Occam's Razor by balancing "goodness of fit" against "number of parameters" (a proxy for complexity).

  When String Theorists and Loop Quantum Gravitists argue, they are essentially arguing over an **MDL calculation where the variables are undefined.**
  *   **String Theory:** "Our equations unify forces more compactly (shorter program)!"
  *   **LQG:** "But you need 10 dimensions and supersymmetry to make it work (huge overhead data/parameters)!"

  ### The Verdict
  The debate isn't "dumb"; it's the human process of trying to approximate an uncomputable function.

  If $K(x)$ were computable, philosophy of science would be dead. We would just run the code. But because it's uncomputable, we are forced to use intuition, mathematical elegance, and empirical adequacy as heuristics.

  Solomonoff induction tells us **why** we value simplicity (because shorter programs have higher prior probability in the space of all possible computable universes). But it cannot tell us **which** theory is actually simpler in practice. That work is still up to the physicists.
