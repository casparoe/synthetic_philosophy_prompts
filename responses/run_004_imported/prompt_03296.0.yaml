          *   Mention MDL (Minimum Description Length) and AIC (Akaike Information Criterion).
          *   These are computable approximations.
          *   Debates persist because even the approximations depend on how you frame the problem (what counts as the "data" vs. the "model").

      *   **Point 5: Philosophical Implication (Why the debate is useful):**
