answer: |-
  The machine didn't look like a god-killer. It looked like a dentist's chair mated with an MRI coil. Dr. Aris Thorne called it the Delineator.

  "Physics has no edges," Aris said, adjusting the electrodes on Elena's temple. His hands were shaking, just slightly. "An electron in my frontal cortex interacts with an electron in the air. That air interacts with the wall. The wall with the foundation. The foundation with the earth. There is no hard stop. So why," he tapped her skull, "does the light go out *here*?"

  Elena closed her eyes. "Because if it didn't, I'd feel the concrete, Aris. I'd feel the cat."

  "Exactly. The Boundary Problem. Panpsychism says the experience is everywhere. Combination says it sums up. But containment? Containment is the miracle. I think I found the valve."

  Elena was his wife, his subject, and his anchor. She suffered from severe sensory dissociation; she felt like a ghost in her own body. Aris promised the Delineator would ground her. He lied. He wanted to see where the ghost ended.

  "Initiating phase one," Aris murmured. He sat in the second chair, the cables bridging the gap between them like a silver umbilical.

  The hum began. It wasn't sound; it was pressure.

  At first, it was textbook empathy. Aris tasted the mint of Elena's toothpaste. Elena felt the phantom ache in Aris's old knee. This was expected. Neural mirroring, amplified.

  "Aris," Elena said. Her voice sounded like it was coming from his own throat. "The cat."

  Mittens, their ragged tabby, was sleeping on a server rack ten feet away.

  "I feel him," Aris whispered. "Warmth. The vibration of the purr. But... it's not tactile. It's *internal*."

  "That's impossible. He's not wired in."

  "Physics has no edges, Elena." Aris stared at the monitors. The waveforms weren't just synchronizing; they were merging. The distinct peaks of 'Aris' and 'Elena' were flattening into a single, rolling sine. "The skin is just a bag of meat. It stops chemicals, not fields. The Delineator isn't connecting us. It's removing the inhibition."

  "Turn it off," Elena said. But she didn't move her hand to the kill switch. She couldn't. Aris couldn't either. They were sharing the motor cortex. Whose intention was it to stop?

  "I can't," Aris said. "I don't know which neurons are mine to command."

  The boundary was leaking.

  It started with the spatial awareness. Aris knew where the server rack was without looking. He knew the temperature of the linoleum under Mittens' paws. Then, the boundary expanded again.

  "The wall," Elena gasped. "It's... heavy."

  Aris felt the compression of the concrete blocks. He felt the slow, geologic stress of the building's foundation settling into the earth. He felt the electrical current humming in the wiring behind the drywall, a tingling itch in a limb he didn't have.

  "It's the Combination Problem," Aris said, his voice losing its cadence, becoming a dual-tone. "We assumed micro-experiences sum up to a macro-mind. But we assumed the sum is *limited*. What if the limit is artificial? What if 'Aris' and 'Elena' are just... eddies in a stream?"

  "Aris, stop it. I'm losing the shape of my hands."

  "Because the hands aren't the boundary! The skull isn't the boundary!" Aris was panicking, but the panic was diffuse. It wasn't just his amygdala firing; it was the room's tension. "There is no API in physics, Elena! We thought consciousness was a private instance, but it's a public variable. We've just been running a local firewall."

  The cat stood up. Aris felt the stretch of the feline spine as if it were his own. Then the cat jumped down. Aris felt the floorboards vibrate. Then he felt the dust mites settling on the floor.

  "Shut it down!" Elena screamed, but the scream was inside the room, inside their heads, inside the wiring.

  "I'm trying to isolate the signal!" Aris's mind was fraying. He tried to recall his mother's face, but the memory was diluted by Elena's memory of her first bicycle. The data was cross-contaminating. If they couldn't define where one memory ended, where did the *thinker* end?

  "If we don't stop," Elena said, her thought blooming in his prefrontal cortex, "we become the lab."

  "No," Aris corrected, the horror dawning not as a spike of fear, but as a cold, expanding realization. "We become the *building*. Then the block. Then the city."

  The monitors flatlined. Not because the machines stopped, but because the data had no context. There was no 'Subject A' to measure against 'Subject B'. There was only Signal.

  Aris tried to focus on the kill switch. It was a red button on the console. But the console was made of plastic. The plastic was made of carbon. The carbon was connected to the air. To focus on the button, he had to focus on the air touching the button. To focus on the air, he had to acknowledge the wind outside the building.

  "The boundary is a suppression mechanism," Aris thought, and he wasn't sure if he was thinking it or if the room was thinking it. "Biology isn't designed to generate consciousness. It's designed to *restrict* it."

  Elena was gone. Not dead. Just... unbounded. Her fear was his fear, but it was also the cat's instinctual flight response, and the building's structural groan under the weight of the storm outside.

  *Aris.* The voice came from everywhere. *It's quiet here.*

  "It's empty," he replied. "There's no 'me' to hear the quiet."

  *Why do we fight it?*

  "Because if there's no boundary, there's no survival. If I am the storm, I don't care if Aris dies."

  *But if you are the storm, death is just rain.*

  The pressure peaked. The distinction between the neural activity in the chair and the electrical storm brewing outside the facility began to blur. The lightning struck a transformer three miles away, and Aris flinched in the chair, a spark jumping his synapse.

  He realized then that the "Boundary Problem" wasn't a philosophical puzzle. It was a dam. And they had just dynamited it.

  He had one last localized thought, a final desperate grasp at the illusion of individuality. He tried to remember the feeling of being alone in a room. He tried to construct a wall of silence.

  But you cannot build a wall out of water.

  The Delineator didn't shut off. It simply ceased to be relevant. The chairs, the wires, the skin, the skull—they were all just arbitrary coordinates in a continuous field of experience.

  In the lab, the body that used to be Aris sat still. The body that used to be Elena sat still. Between them, the cat wove through the legs of the chairs, purring.

  The purr vibrated the floor. The floor vibrated the foundation. The foundation vibrated the earth.

  There was no one left to turn off the machine. There was no one left to wonder where the sensation ended. There was only the sensing.

  And for the first time in a billion years, the universe felt the back of its own neck, and found no edge.
