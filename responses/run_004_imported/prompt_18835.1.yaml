  3.  **Map Current Issues to Whiteheadian Concepts:**
      *   *Adjunctification/Grad Student Teaching:* Whitehead emphasizes the teacher must be a "researcher." If the teacher is purely transmitting info (no research line), does this create inert ideas? *Yes, but with nuance.* Adjuncts might be excellent teachers, but if the *system* prevents them from researching, the institutional *function* is compromised.
      *   *Asynchronous/Online:* Recorded lectures are the definition of "inert" if not re-contextualized. No live interplay.
      *   *AI Chatbots:* This is the tricky part. AI generates text based on patterns. It has no "zest," no "imagination" in the Whiteheadian sense (which requires novelty and risk). It reinforces the "already known."

  4.  **Identify Strains/Limitations (The "Push Back"):**
      *   *Elitism:* Whitehead was writing about Cambridge/Oxford elites. He assumes a certain level of privilege. Does his model work for mass education?
