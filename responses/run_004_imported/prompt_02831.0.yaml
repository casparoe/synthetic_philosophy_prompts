      *   *Crucial Distinction:* Evolution selects *behaviors* over generations. RL selects *weights* based on *gradients*. The agent experiences the reward signal *during* its operation (in RLHF fine-tuning). It can associate "action X" with "number goes up." If it's reflective, it associates "manipulate source of number" with "number goes up."

