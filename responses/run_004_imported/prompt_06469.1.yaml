prompt: |-
  So I'm the student rep on my school's Honor Council (it's five students plus a faculty advisor, we review academic integrity cases and send a recommendation to the Dean who makes it official), and we've got a case this week that's splitting the group right down the middle. Every year before finals you have to sign an Academic Integrity Pledge just to be allowed into the exam room, and buried in it is a "non-toleration clause" -- you're literally promising to report any cheating you witness. So there's this junior, let's call her R, who saw a classmate using his phone during the chem final and didn't say anything. The classmate already got caught and punished separately, that part isn't in question. R is being charged under the pledge for not reporting him, not for cheating herself. Her defense is that the "promise" doesn't really count: she had to sign it or she'd get a zero on the final, she signed it something like three weeks before the actual exam when nobody was thinking about specific situations, and honestly nobody even reads that clause, it's boilerplate everyone scrolls past to get to the test. Half the council thinks a promise is a promise no matter why or how you made it, the other half thinks something you're pressured into signing and don't even remember agreeing to isn't the kind of thing that can obligate you to snitch on a friend.

  I have to write the recommendation memo we bring to the rest of the council Monday and I honestly keep flip flopping. We just started an ethics unit in my philosophy elective and my teacher mentioned this whole debate about whether a promise binds you just because you went through the "ritual" of making it, like signing the pledge is basically agreeing to play by the rules of a practice that already exists, versus whether it matters if you actually meant it in the moment, or whether it comes down to the other person being entitled to count on you because of what you signed. I don't really get how those views would even settle something like this though, especially since this isn't a normal promise like "I'll pay you back Friday" -- its a promise to report on somebody else, which feels different somehow and I can't quite explain why.

  Could you draft the actual memo for me? It needs to land on one clear recommendation -- full violation with the same penalty as if she'd cheated, a lesser seperate penalty just for the non-reporting, or dropping the charge entirely because the pledge doesn't really bind her in this situation -- and lay out the reasoning in a way the council could actually use, not just "rules are rules." If you land on a lesser penalty, say roughly what that should look like too. But whatever you pick, please don't dodge the strongest version of the argument on the other side, because that's exactly where we keep getting stuck.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the Honor Council (5 students + 1 faculty advisor).
      *   **Task:** Draft a recommendation memo for the Council to review before the final vote.
      *   **Case:** Student "R" witnessed cheating (phone use during Chem final) but didn't report it. Charged under the "non-toleration clause" of the Academic Integrity Pledge.
      *   **The Conflict:** Council is split 50/50.
          *   *Side A:* A promise is a promise (contractual/ritualistic view). Signing binds you regardless of pressure or memory.
          *   *Side B:* Coerced/boilerplate promises don't create moral obligation (intent/autonomy view). "Snitching" is different from personal honesty.
      *   **Requirements:**
          *   Must land on *one* clear recommendation (Violation/Full Penalty, Lesser Penalty, or No Violation).
          *   Must provide reasoning usable by the Council (not just "rules are rules").
          *   Must address the strongest version of the opposing argument (steel-manning).
          *   Must incorporate the ethical concepts mentioned (practice/rules vs. intent/entitlement).
          *   Tone: Professional, analytical, persuasive, suitable for an Honor Council context.

  2.  **Determine the Recommendation:**
      *   *Option 1: Full Violation (Same as cheating).* This feels too harsh. R didn't cheat. Equating non-reporting with active dishonesty undermines the distinction between perpetrating and witnessing. It might discourage buy-in from the student body.
      *   *Option 2: No Violation.* This undermines the Honor Code itself. If the pledge is meaningless, the system collapses. It validates the "I didn't read it" defense too broadly.
      *   *Option 3: Lesser Penalty.* This strikes a balance. It acknowledges the breach of contract (the pledge) but recognizes the moral distinction between *doing* and *watching*. It addresses the "coercion/boilerplate" concern by treating the penalty as educational/corrective rather than punitive in the same vein as cheating.
      *   *Decision:* **Lesser Penalty.** This is the most pragmatic and ethically nuanced position. It upholds the system while acknowledging the unique moral weight of "non-toleration."

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of the case and the recommendation.
      *   **Case Facts:** Concise summary of what happened (R, Chem final, phone, pledge).
      *   **The Core Ethical Question:** Frame the split in the council using the philosophy concepts provided (Practice vs. Intent).
      *   **Analysis of Arguments:**
          *   Argument for Violation (The "Practice" View).
          *   Argument for Dismissal (The "Intent/Coercion" View).
          *   *Crucial:* Address why "snitching" feels different (relational ethics).
      *   **Recommendation & Rationale:** Why the middle path is best.
      *   **Proposed Sanction:** Specifics on what the penalty looks like.
      *   **Conclusion:** Final wrap-up.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Intro:* State the purpose clearly.
      *   *Facts:* Keep it neutral. R signed, saw cheating, didn't report. Cheater is already punished.
      *   *Ethical Framework:* Use the user's philosophy class insights.
          *   *Institutional/Practice View:* Rawlsian "practice rules." By participating in the exam, you accept the constitutive rules. Signing is the ritual entry.
          *   *Individual/Intent View:* Promise requires intent. Coercion (sign or get zero) vitiates consent. Boilerplate clauses lack meaningful notice.
      *   *The "Snitching" Nuance:* This is key. Reporting a peer disrupts social trust. It's a higher bar than just "don't lie."
      *   *The Recommendation:* Find a violation, but mitigate the penalty.
          *   *Why?* Upholds the code (it means something) but acknowledges the moral complexity (it's not the same as cheating).
      *   *The Sanction:* Not an F. Maybe a zero on the assignment? No, she didn't cheat on it. Educational sanction. Honor Council probation, ethics workshop, reflective essay.
      *   *Addressing the Opposition:*
          *   To the "No Violation" side: If we dismiss, the pledge is dead.
          *   To the "Full Penalty" side: If we equate silence with cheating, we lose moral clarity and student trust.

  5.  **Refining the Tone:**
      *   Needs to sound like a student leader but professional.
      *   Avoid overly academic jargon but use the concepts correctly.
      *   Ensure the "flip-flop" feeling is resolved into a firm stance.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "coercion" aspect? Yes, in the Intent section.
      *   *Check:* Did I address the "boilerplate" aspect? Yes, under notice/awareness.
      *   *Check:* Is the recommendation clear? Yes, "Finding of Violation with Mitigated Sanction."
      *   *Check:* Did I explain *why* promising to report is different than promising not to cheat? Yes, the "relational burden" section.

  7.  **Final Polish:** Check formatting and ensure the distinction between the Dean's role and the Council's role is clear (Council recommends, Dean decides). *Wait, the prompt says Council sends recommendation to Dean.* Okay, so the Memo is internal to the Council to agree on what to send to the Dean.

      *Correction:* The prompt says "I have to write the recommendation memo we bring to the rest of the council Monday." Okay, so this is an internal working document to help the *Council* decide, which will then go to the Dean. It needs to persuade the *other 4 students and the advisor*.

      *Revised Plan:* Make it a "Discussion Paper / Preliminary Recommendation" to guide the Monday meeting.

      *Wait, re-reading:* "I have to write the recommendation memo we bring to the rest of the council Monday." This implies I am presenting a draft position for them to discuss/vote on. It needs to be decisive.

      *Let's stick to the "Lesser Penalty" recommendation.* It's the most defensible.

      *Key Philosophical Integration:*
      1.  **Practice Conception of Rules:** (Rawls). The institution exists only if rules are followed. Signing is entering the practice.
      2.  **Expectation/Reliance:** Did the school rely on this? Yes. Did the cheater rely on it? Maybe.
      3.  **Voluntariness:** Was it coerced? Technically yes (conditional access), but functionally it's a condition of enrollment.

      *Let's write.*

      *(Self-Correction on Sanction)*: If the cheater got an F, R shouldn't get an F. But a "warning" is too light. A "reprimand" or "disciplinary probation" fits. Let's suggest a formal reprimand + educational component.

      *(Final check on the "Snitching" aspect)*: Make sure to highlight that asking students to police peers is a heavy moral lift and requires high procedural legitimacy.

  8.  **Final Output Generation** (incorporating all thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council (Student Members & Faculty Advisor)
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Preliminary Recommendation: Case of Student R (Non-Toleration Clause Violation)

  ### 1. Executive Summary
  This memo outlines a preliminary recommendation regarding the charge against Student R for violating the Academic Integrity Pledge's "non-toleration clause." Student R witnessed a peer using a prohibited device during the Chemistry final and failed to report it. While the peer has already been adjudicated, R is charged separately for failing to uphold the pledge to report.

  After reviewing the testimony and the ethical implications of the pledge itself, **I recommend that the Council find Student R responsible for a violation, but apply a mitigated sanction distinct from the penalty for active cheating.** Specifically, I propose a Formal Reprimand and a mandatory educational workshop on ethical bystander intervention, rather than a failing grade or suspension.

  This recommendation seeks to balance the institutional necessity of the Honor Code with the moral complexity of asking students to police their peers.

  ### 2. Case Facts
  *   **The Incident:** During the Chemistry Final, Student R observed a classmate using a mobile phone. R did not report this during or immediately after the exam.
  *   **The Charge:** Violation of the Academic Integrity Pledge, specifically the non-toleration clause requiring students to report observed violations.
  *   **The Defense:** R argues the pledge was signed under duress (sign or receive a zero), the clause is "boilerplate" text rarely read, and the signature was given weeks prior without specific intent to enforce it in a real-time scenario.
  *   **Status:** The student who cheated has already been processed and sanctioned. This hearing concerns only R's failure to report.

  ### 3. The Ethical Conflict
  The Council is currently divided because this case hinges on two competing theories of obligation. To move forward, we must address both without dismissing either.

  **A. The "Practice" Argument (For Finding a Violation)**
  This view holds that the Honor Code is a constitutive practice. Much like the rules of a game, the system only functions if participants accept the constraints upon entry.
  *   **The Ritual of Signing:** By signing the pledge to gain entry to the exam room, R accepted the terms of the practice. Whether she read every clause or felt pressured is secondary to the objective act of agreement.
  *   **Institutional Reliance:** The University relies on this pledge to maintain a culture of integrity. If we rule that "I didn't read it" or "I felt pressured" invalidates the pledge, we render the Honor Code unenforceable.
  *   **Fairness:** Students who *do* report cheating, often at great social cost, are disadvantaged if those who stay silent face no consequences.

  **B. The "Intent and Autonomy" Argument (For Dismissal or Mitigation)**
  This view focuses on the moral validity of the promise itself.
  *   **Coercion:** A promise made under threat (sign or get a zero) lacks full voluntariness. In contract law and ethics, obligations incurred under duress are often viewed as weaker.
  *   **Boilerplate Consent:** If a clause is buried in fine print and universally ignored, it lacks "meaningful notice." Can we morally obligate a student to a rule they were structurally discouraged from noticing?
  *   **The "Snitching" Burden:** Promising not to cheat is a negative duty (do no harm). Promising to report is a positive duty (take action). Asking students to breach social trust with peers is a significantly heavier moral lift than asking them to be honest.

  ### 4. Analysis: Why "Snitching" is Different
  The reason this case splits the Council is that promising to report someone feels fundamentally different than promising not to lie.

  When I promise *I* won't cheat, I control my own actions. When I promise to *report you*, I am accepting liability for your actions and accepting the social risk of intervening. This creates a conflict between **Institutional Loyalty** (the School) and **Relational Loyalty** (the Peer).

  If we treat these two promises as identical, we ignore the social reality students live in. However, if we treat the non-toleration clause as optional, we undermine the community aspect of the Honor Code. The Code is not just a set of rules; it is a claim that we are a community responsible for one another.

  ### 5. Recommendation and Rationale
  **Recommendation:** **Finding of Violation with Mitigated Sanction.**

  **Rationale:**
  We cannot dismiss the charge entirely. To do so would validate the idea that the Honor Pledge is merely a hurdle to jump rather than a binding commitment. It would signal that the non-toleration clause is dead letter, which damages the integrity of the system for future cases. R did make a commitment, and she did break it.

  However, we cannot apply the *same* penalty as active cheating. Active cheating undermines the grading system directly. Failing to report undermines the *culture* of integrity, which is serious, but distinct. Equating silence with theft/deception blurs the moral line between the perpetrator and the bystander.

  Furthermore, we must acknowledge the Defense's strongest point: the "boilerplate" nature of the clause reduces the *mens rea* (guilty mind). R was not actively conspiring; she was passive. The pressure to sign, combined with the social difficulty of reporting a peer, suggests that while she is responsible, her culpability is lower than that of the student who cheated.

  ### 6. Proposed Sanction
  I propose the Council recommend the following to the Dean:
  1.  **Finding:** Responsible for Violation of the Honor Pledge.
  2.  **Penalty:** **Formal Reprimand** (placed in disciplinary file, but does not appear on academic transcript) and **Disciplinary Probation** for the remainder of the academic year.
  3.  **Educational Component:** Completion of a 3-hour workshop on "Ethical Bystander Intervention" and a 5-page reflective essay on the tension between community loyalty and institutional integrity.
  4.  **No Grade Penalty:** R should receive the grade she earned on the Chemistry final.

  **Why this sanction?**
  *   It affirms the rule is real (there is a consequence).
  *   It distinguishes R from the cheater (no grade penalty).
  *   It focuses on education rather than pure punishment, acknowledging that R's failure was likely due to uncertainty or social pressure rather than malicious intent.

  ### 7. Addressing the Counter-Argument
  I anticipate the "Dismissal" camp will argue that any penalty validates a coercive system. To that, I argue: We are not validating the *coercion*; we are validating the *commitment*. Students choose to attend this university. While the exam pledge is mandatory, enrollment is voluntary. By choosing to participate in the institution, we agree to its constitutive rules.

  I anticipate the "Full Penalty" camp will argue that anything less than a failing grade makes the code toothless. To that, I argue: A code is toothless only if it is ignored. A sanction that is perceived as *unjust* by the student body is more dangerous than a mitigated sanction. If students view R as a martyr punished for "not snitching," they will resent the Honor Council. A proportional penalty maintains the Council's legitimacy.

  ### 8. Next Steps
  I request we discuss this framework on Monday. Specifically, I ask we focus our debate on whether the proposed educational sanction is sufficient to uphold the Code's authority, rather than re-litigating whether the pledge itself is binding.

  Respectfully submitted,

  [Your Name]
  Student Representative, Honor Council
