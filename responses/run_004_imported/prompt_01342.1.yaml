      *   It's the epistemic humility regarding *policy means*. Hayek admitted we don't know which policies work. Futarchy admits voters don't know which policies work. Both agree on the ignorance of the central planner/voter regarding causal mechanisms. Hayek's Model Constitution tries to solve the "short-termism" and "interest group capture" problem. Futarchy tries to solve the "ignorance" problem using markets. There is a shared enemy: the omnipotent legislature.
      *   *Refinement:* The strongest counter-argument is that Futarchy actually respects the *market process* for discovery more than Hayek's own Legislative Assembly, which is still a group of men deliberating on rules. Futarchy decentralizes the *belief* formation about causality. Hayek might appreciate that markets discover causal truths better than committees.

