      *   *Argument 2: Constructivist Rationalism.* Futarchy is a design. Hayek prefers evolution. The Model Constitution is a design too, but it aims to preserve evolved law, not optimize outcomes.
      *   *Argument 3: Rules vs. Commands.* Futarchy decides specific policies (commands) based on outcomes. Hayek wants abstract rules.
      *   *The "Cut Against":* The epistemic humility regarding causal knowledge. Hayek hated the "pretence of knowledge" regarding *outcomes*, but he also hated legislators pretending to know *means*. Futarchy admits ignorance of means and uses markets to find them. This aligns with his price theory.
      *   *Conclusion:* Reiterate that the definitional problem of "welfare" outweighs the epistemic benefit of the market mechanism.

  8.  **Checking against constraints:**
