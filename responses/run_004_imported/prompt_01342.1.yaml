      *   So the counter-argument is: Futarchy uses the *price mechanism* (which Hayek revered) to solve the *knowledge problem* (which Hayek identified) in the realm of legislation (which Hayek wanted to reform). It is more consistent with his *price theory* than his *constitutional theory* is. His constitutional theory relies on wise elders; Futarchy relies on the market. Hayek trusted the market more than wise elders usually.
      *   *Wait, correction:* Hayek trusted the *evolved* common law more than wise elders. But in *LLL Vol 3*, he does propose the Assembly of Elders.
      *   *Better Counter-Argument:* The strongest Hayekian point *for* Futarchy is that it acknowledges the dispersion of knowledge regarding policy efficacy. Hayek argued prices coordinate *economic* activity. Futarchy argues prediction markets coordinate *political* knowledge. If prices solve the calculation problem, why not prediction markets solve the policy problem? This is the internal tension.

