answer: |-
  Hayek would have **dismissed** futarchy. While he would have recognized in it a superficial kinship with his own praise of the price mechanism, he would have ultimately condemned it as a quintessential exercise in the "constructivist rationalism" and "pretence of knowledge" that he spent his career dismantling.

  The verdict rests on three pillars of Hayekian thought: the impossibility of aggregating social welfare, the distinction between *nomos* (law) and *thesis* (legislation), and the nature of spontaneous order.

  **1. The Impossibility of the Scalar Welfare Function**
  The fatal flaw of futarchy, from a Hayekian perspective, lies in its first step: "Vote on Values." Futarchy requires the polity to agree upon a single scalar measure of national welfare (e.g., GDP plus specific social metrics) to serve as the settlement condition for the prediction markets. Hayek argued repeatedly, particularly in *Law, Legislation and Liberty* and *The Counter-Revolution of Science*, that society possesses no single hierarchy of ends. The "Great Society" is a catallaxy—a spontaneous order of exchange among individuals pursuing incommensurable ends.

  To define a national welfare function is to commit the "pretence of knowledge." It assumes that dispersed, subjective values can be aggregated into an objective metric that a central mechanism can optimize. For Hayek, this is the same error as socialist central planning: it treats society as an organization (like a firm or an army) with a single purpose, rather than an order where the purpose is to facilitate the unknown and unknowable purposes of millions. A prediction market cannot aggregate knowledge about "welfare" if "welfare" is a fiction constructed by the planner. The prices in a futarchy market would not signal scarcity or subjective value in the Hayekian sense; they would signal probability relative to an arbitrary, politically constructed index.

  **2. Rules of Just Conduct vs. Outcome Optimization**
  Hayek's constitutional model in *Law, Legislation and Liberty* distinguishes between the Legislative Assembly, which lays down abstract, general rules of just conduct (*nomos*), and the Governmental Assembly, which administers resources (*thesis*). Hayek insisted that the Rule of Law requires rules to be end-independent; they must not aim at specific outcomes for specific groups, but rather provide a stable framework for action.

  Futarchy is inherently consequentialist and outcome-oriented. It selects policies based on their predicted ability to maximize a specific metric. This turns law into a series of commands designed to engineer social states. For Hayek, justice is a property of individual conduct and abstract rules, not of distributional outcomes. A system that automatically adopts policies to maximize a welfare metric violates the Rule of Law because it subordinates the abstract framework of liberty to the exigencies of social engineering. It legitimizes the idea that the state's role is to *produce* results, rather than to *maintain* the conditions of freedom.

  **3. Evolved Institutions vs. Engineered Mechanisms**
  While Hayek did propose a "Model Constitution," he viewed it as a restoration of evolved principles of liberty that had been corrupted, not as a new machine for social optimization. He was deeply skeptical of institutions designed from whole cloth to achieve specific social ends. Futarchy is a hyper-rationalist design: it attempts to mechanize the political process, turning governance into a cybernetic feedback loop. Hayek believed that successful institutions evolve through cultural selection, not through the intellectual design of theorists. He would likely view futarchy as an attempt to replace the wisdom of evolved common law and tradition with the "synthetic" wisdom of a betting market, ignoring the tacit knowledge embedded in traditional institutions that cannot be priced or bet upon.

  ### The Strongest Hayekian Consideration Cutting Against This Verdict

  The strongest genuinely Hayekian argument *for* futarchy—and the one that creates the deepest tension in this verdict—is **the epistemic superiority of the market process over deliberative bodies.**

  Hayek's Nobel lecture, "The Pretence of Knowledge," and his essay "The Use of Knowledge in Society" rest on the claim that no central mind can process the dispersed information held by individuals. He distrusted legislatures precisely because they pretend to know what policies will work. Futarchy accepts this epistemic humility regarding *means*. It admits that voters and politicians do not know which policies will improve welfare, and it delegates that discovery process to a market mechanism where participants stake capital on their private knowledge.

  In this specific regard, futarchy is more consistently Hayekian than Hayek's own "Legislative Assembly." Hayek's Model Constitution relies on a body of elders (45-year-olds elected for 15-year terms) deliberating on rules. This assumes that a specific group of humans, insulated from pressure, can discern abstract justice. Futarchy, by contrast, relies on the impersonal discovery procedure of the market to discern causal truths about policy efficacy. If Hayek believed prices could coordinate the production of pencils better than a ministry, the futarchic counter-argument is that prediction markets could coordinate the production of *policy* better than a legislature.

  Hayek might have been forced to concede that if one *must* have a Governmental Assembly managing specific outcomes, a market mechanism for selecting those policies is epistemically superior to majoritarian voting or bureaucratic planning. However, this concession would not save futarchy, because for Hayek, the error is not just in *how* we select policies to maximize welfare, but in the belief that we should be maximizing a collective welfare metric at all. He would reject the epistemic brilliance of the mechanism because he rejects the legitimacy of the goal.
