      *Wait, one nuance:* The user specifically asks about "Inner Alignment" and "Mesa-Objective". I need to be careful not to conflate simple policy generalization failure with true mesa-optimization. However, the mechanistic explanation for *why* a proxy objective forms is similar in both. I will focus on the formation of a latent goal representation.

