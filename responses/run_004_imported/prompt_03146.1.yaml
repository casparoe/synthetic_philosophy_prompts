answer: |-
  # The Bomb in the Box: Adjudicating the Conflict Between Ex-Post and Ex-Ante Rationality

  The "Bomb" thought experiment, advanced by philosopher Will MacAskill, stands as the most potent intuitive challenge to Functional Decision Theory (FDT) and its predecessor, Updateless Decision Theory (UDT). In the landscape of decision theory, Newcomb's Problem demonstrated that Causal Decision Theory (CDT) leaves money on the table, and the Prisoner's Dilemma showed it leaves utility on the table. FDT proponents argue their theory captures the rational verdict in these cases by treating the agent's decision as the output of a fixed algorithm. But Bomb is designed to break this intuition. It posits a scenario where following the FDT algorithm leads not to a missed million dollars, but to certain death, while the "irrational" CDT move guarantees survival for a trivial cost.

  This essay will adjudicate the dispute between the "Guaranteed Payoff" objection and the "Updateless Rejoinder." I will argue that while MacAskill's objection exposes a harrowing psychological and ontological cost of updatelessness, it does not constitute a logical flaw in the theory. Bomb reveals that FDT requires a commitment to *ex-ante* policy optimality that supersedes *ex-post* act optimality, a commitment that is rational only under a specific metaphysical condition: **The Principle of Logical Subjunctive Dependence.**

  ### The Case for the Guaranteed Payoff

  The objection to FDT in the Bomb scenario rests on a robust, pre-theoretical intuition about rationality: rational action should be guided by the world as it *is*, not the world as it *might have been*. MacAskill's argument leverages the asymmetry of time and the fixity of the past.

  When the agent stands before the boxes, the prediction has already occurred. The bomb is physically present in the Left box. The causal chain linking the agent's current neural firing to the predictor's past action is severed; no choice made now can reach back in time to move the bomb. In this specific, actualized branch of reality, the agent faces a binary choice: die (Left) or lose $100 (Right). To choose Left is to choose death when survival is available for the price of a dinner.

  Critics argue that FDT's recommendation to take Left relies on a form of "magical thinking." It asks the agent to act as though their choice influences the past prediction. But in this specific instance, the prediction has *already failed* to match the FDT-prescribed outcome. If the agent were truly following the FDT policy ("Take Left if Bomb"), the predictor (being near-perfect) would have predicted this and left the box empty. The fact that the bomb is present is empirical proof that the predictor made a mistake or that the agent is not in the timeline where the policy succeeded.

  Furthermore, the "one-off" constraint is crucial. If this were a repeated game, sacrificing oneself in round one might establish a reputation that pays off in round two. But in an isolated encounter, there is no future benefit to the policy. The utility of the policy exists only in counterfactual worlds that are no longer accessible. To sacrifice the actual world for the sake of counterfactual consistency is, according to this view, a category error. Rationality is about navigating the actual world, not appeasing the ghosts of possibilities that did not materialize.

  ### The Updateless Rejoinder

  Proponents of FDT, such as Eliezer Yudkowsky and Nate Soares, reject the premise that the agent is a momentary time-slice making an isolated choice. They argue that the proper object of rational evaluation is not the *act*, but the *algorithm* or *disposition* that generates the act.

  From the updateless perspective, you do not choose between Left and Right at the moment of decision. You chose your decision-making algorithm long before you entered the room. The predictor simulated that algorithm. Therefore, your current reasoning process is logically isomorphic to the simulation the predictor ran. When you ask, "What should I do?", you are effectively asking, "What output should my algorithm produce?"

  If your algorithm is "Take Right if I see a Bomb," the predictor's simulation of you outputs "Take Right," so she places the Bomb in Left. You then pay $100. This outcome occurs in nearly 100% of cases.
  If your algorithm is "Take Left if I see a Bomb," the predictor's simulation of you outputs "Take Left," so she leaves Left empty. You pay $0. This outcome occurs in nearly 100% of cases.

  The fact that you currently see a bomb means you are in the infinitesimally rare branch (1 in $10^{24}$) where the predictor made an error. However, FDT argues that you cannot condition your policy on being in the error branch. If you adopt the policy "Take Right if Bomb," you guarantee that you are the *kind of agent* who faces the bomb in the first place. By choosing Right to save yourself now, you validate the predictor's original reasoning that you would choose Right, effectively retroactively ensuring the bomb was placed there.

  To the FDT proponent, the "Guaranteed Payoff" objection commits the error of "updating" on information (the presence of the bomb) that is logically correlated with the decision itself. By updating, you treat the prediction as fixed history. But because the prediction was based on *your logic*, your logic is part of the causal structure that determined the past. Rationality is about winning *globally* across the logical landscape, not winning *locally* in a specific branch that only exists because you lost globally. To pay the $100 is to be a "money pump" for predictors; to take the bomb is to be the kind of agent predictors leave alone.

  ### Adjudication: The Clash of Temporal Perspectives

  The dispute ultimately hinges on the definition of the "agent." MacAskill views the agent as a temporal slice confronting a fixed environment. FDT views the agent as a temporally extended function confronting a logical environment.

  MacAskill's objection is devastating if one accepts Causal Decision Theory's ontology, where the past is immutable and independent of current logical reasoning. In that framework, dying for a counterfactual is indeed irrational. However, FDT's strength lies in its ability to solve problems where causal independence fails—specifically, where the environment contains mirrors of the agent's own logic (predictors, twins, simulations).

  The tension in Bomb is that it forces the FDT agent to pay the price of their policy in the one branch where the policy *appears* to have failed. This feels like a "sunk cost" fallacy. But it is not a sunk cost; it is the rent for living in a universe where predictors exist. If an FDT agent swerves and takes Right to save their life, they have not actually saved their life *qua* FDT agent. They have revealed that they are not, and never were, an FDT agent. If they were truly an FDT agent, the predictor would not have put the bomb there.

  Therefore, the agent facing the bomb is in a paradoxical epistemic state. If they are confident they are an FDT agent, they should assign near-zero probability to seeing the bomb. Seeing the bomb should induce a crisis of identity: "Am I really an FDT agent, or am I a CDT agent pretending?" If they conclude they are an FDT agent, they must act consistently with that identity, even in the face of overwhelming empirical evidence that the identity has led to a fatal error branch.

  ### Verdict: A Cost, Not a Flaw

  Does Bomb expose a genuine flaw in updateless decision theories? **No.** It reveals a **cost** that a rational agent should be willing to pay, provided they accept the ontological premises of logical correlation.

  A "flaw" in a decision theory implies that following it leads to lower expected utility *ex-ante* (before the scenario begins) compared to an alternative. FDT clearly wins *ex-ante*. An agent who commits to FDT before entering the room will, in $10^{24}-1$ out of $10^{24}$ cases, face an empty Left box and pay nothing. An agent who commits to CDT will, in nearly all cases, face a bomb in the Left box and pay $100. The FDT agent dies in the one error branch; the CDT agent survives but pays in every branch. In terms of expected utility across the logical distribution of outcomes, FDT dominates.

  Bomb feels like a flaw only because human intuition is hardcoded for *ex-post* rationality. We are evolved to survive the immediate threat, not to optimize across logical counterfactuals. But for a formal theory of rationality intended to govern agents (including AIs) that may face predictors or logical twins, *ex-ante* optimality is the correct metric. To abandon FDT in the Bomb case is to abandon the very mechanism that secures the better outcome in the Newcomb cases.

  However, this verdict is not unconditional. It relies on a specific principle that determines when updatelessness binds.

  **The Principle of Logical Subjunctive Dependence:**
  *Updateless decision-making is rationally binding if and only if the outcome of the scenario depends on the logical output of the agent's decision algorithm, rather than merely the physical execution of the act.*

  In Bomb, by stipulation, the predictor simulated the agent's algorithm. Thus, the outcome (bomb placement) depends on the logical output of the algorithm. The physical presence of the bomb is a downstream consequence of that logical dependency. Therefore, the agent must honor the logical dependency over the physical evidence.

  If, however, the predictor were merely a psychologist guessing based on demographics, with no simulation of the specific algorithm, Logical Subjunctive Dependence would not hold. In that case, the agent's current choice could not logically influence the past prediction, and CDT (Take Right) would be correct. Bomb is constructed specifically to ensure Logical Subjunctive Dependence holds.

  ### Conclusion

  Will MacAskill's Bomb argument succeeds in highlighting the terrifying implication of FDT: that being rational might require you to die in the unlikely event that the world fails to match your rationality. It strips away the comfort of "winning" and replaces it with the austerity of "being the winner."

  But this is not a refutation. It is a clarification. Rationality is not a guarantee of survival in every branch; it is the strategy that maximizes survival across the tree. The FDT agent who takes the bomb is not acting irrationally; they are paying the premium for a policy that keeps the box empty in almost every other world. To demand that rationality always offer a "guaranteed payoff" in the local moment is to demand that it cease to be updateless. Thus, Bomb does not break FDT; it breaks our intuition that rationality should always feel like a safe bet. The rational agent accepts the risk of the error branch to secure the dominance of the policy. They take the Left box, and in doing so, they validate the theory that says they shouldn't have had to.
