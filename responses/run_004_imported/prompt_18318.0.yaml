answer: |-
  This is a fantastic question that cuts right to the bone of Hobbes's epistemology. You have correctly identified the core of his position: for Hobbes, geometry is certain not because it is abstract, but because it is *made* by us. This is a proto-constructivist view (anticipating Vico's *verum factum* principle: "the true is the made").

  If we transport Hobbes into the 19th century to confront Non-Euclidean Geometry (NEG), we run into a fascinating collision between his **methodological constructivism** (which seems to allow for multiple geometries) and his **ontological materialism** (which demands one true description of space).

  Here is how Hobbes would likely analyze the situation, based on his works like *De Corpore* and his correspondence with Wallis.

  ### 1. The Status of Definitions: "Conceivability" as a Constraint
  You noted that Hobbes insisted definitions must be causal (e.g., a line is generated by a moving point). However, for Hobbes, a definition must satisfy two criteria to be valid:
  1.  **Causal/Genetic:** It must explain how the thing is produced.
  2.  **Conceivable:** It must be formable in the imagination based on sense experience.

  Hobbes was a strict empiricist regarding concepts. He believed all ideas originate from sense perception. We know what a "point" and "motion" are because we have seen things move.

  **The Hobbesian Objection to NEG:**
  Hobbes would likely argue that the axioms of Non-Euclidean geometry fail the test of *conceivability*. To a Hobbesian mind, the idea of two lines that are "parallel" (equidistant) yet eventually meet (elliptic) or diverge exponentially (hyperbolic) is not just false; it is *inconceivable*. It contradicts the "phantasm" of space that our senses provide.

  For Hobbes, you cannot simply "stipulate" a definition the way a modern formalist does. If the definition describes a generation of motion that the human mind cannot visualize or that contradicts universal sensory experience, it is not a definition of a real quantity; it is nonsense. He would likely view NEG not as a new geometry, but as a misuse of language—similar to how he viewed scholastic metaphysics.

  ### 2. Geometry vs. Logic: The Distinction Between Reasoning and Truth
  This is where your specific dilemma lies: *Does his logic commit him to treating all consistent systems as equally certain?*

  Hobbes would answer **no**, by drawing a sharp distinction between **ratiocination** (calculation/reasoning) and **scientia** (knowledge of causes).

  *   **Ratiocination:** If you grant the axioms of hyperbolic geometry, Hobbes would admit that the theorems derived from them follow logically. In this narrow sense, the reasoning is "certain." He might concede that NEG is a valid system of *logic* or *algebra*.
  *   **Scientia:** However, for Hobbes, Geometry is not just logic; it is the science of *quantity* and *space*. Truth requires that the terms refer to something real. Since Hobbes believes space is a real "accident of body" (the phantom of external reality), there is only one actual structure of space.

  Therefore, he would argue that while NEG is logically consistent, it is not **Geometry** in the strict sense. It is a game of symbols detached from the causal generation of figures in real space. He would say the NEG mathematicians are squaring circles in a different guise: they are manipulating marks on paper without reference to the motions that create actual magnitude.

  ### 3. Materialism and the "One True Space"
  Your second option asks if he can insist only one is the true geometry of physical space. Given his materialism, **this is exactly what he would do.**

  For Hobbes, the universe is a plenum of bodies in motion. Space is the "phantasm of a thing existing without the mind simply." While this sounds subjective, for Hobbes, it is grounded in the immutable nature of matter.
  *   **Motion is local:** Bodies move from place to place.
  *   **Space is the container:** It is the capacity for that motion.

  Hobbes assumes that the properties of this container are fixed and universal. The Parallel Postulate, for him, isn't an arbitrary assumption; it is an empirical generalization about how lines are generated in the space we inhabit. If you define a straight line as the path of a point moving without deviation, Hobbes believes it is self-evident (based on sense experience) that two such lines cannot enclose a space.

  If presented with General Relativity (which came later, but posits curved space), Hobbes would likely argue that "curved space" is a category error. For a materialist, only *bodies* can be curved. Space itself is just the extension of body. To say "space is curved" would sound to him like saying "nothingness has a shape." He would insist that if light bends, it is because a body acted upon it, not because the "geometry of space" changed.

  ### 4. The Feud with Wallis Revisited
  It is instructive to look at his actual feud with Wallis. Wallis represented the emerging symbolic algebraic tradition, where mathematics was becoming abstract and operational. Hobbes hated this. He insisted that math must always be tethered to diagrams and physical motion.

  When Wallis proved Hobbes wrong on the squaring of the circle, Hobbes didn't accept the algebraic proof; he insisted his geometric construction *felt* right.

  Faced with Non-Euclidean Geometry, Hobbes would likely treat it exactly as he treated Wallis's algebra: **as a detachment of reasoning from reality.** He would argue:
  > "You have constructed a consistent system of marks, but you have not described the generation of any figure that can exist in the world. Therefore, you have not done Geometry; you have done Logic."

  ### Conclusion: The Verdict
  Hobbes would resolve your dilemma by rejecting the premise that "constructibility implies truth."

  1.  **On Certainty:** He would admit that Non-Euclidean systems are *internally* certain (if the reasoning is valid), but deny they are *scientifically* certain because their first principles (axioms) do not correspond to the causal generation of real figures.
  2.  **On Truth:** He would insist that **Euclidean geometry is the only true geometry** because it is the only one that maps onto the actual properties of space (the phantom of body).
  3.  **On Materialism:** He would view the idea of alternative geometries as a slide back into the "vain philosophy" of the Scholastics—debating words rather than things. For Hobbes, there is only one universe of bodies, one kind of space, and therefore one geometry.

  In short, Hobbes would view the discovery of Non-Euclidean geometry not as an expansion of mathematical truth, but as a confusion of **logic** (the manipulation of consequences) with **geometry** (the measurement of real space). He would stand by Euclid, not because Euclid was logically unassailable (Hobbes thought Euclid made mistakes), but because Euclid's system was the only one that successfully tracked the causal motions of the material world.
