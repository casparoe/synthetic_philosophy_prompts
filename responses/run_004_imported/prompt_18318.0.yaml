      *   *What about truth?* Hobbes distinguishes between "truth" (propositions) and "knowledge" (causes). But for him, geometry isn't just a game of symbols; it's about *space* and *body*.
      *   *Materialism:* Hobbes is a thoroughgoing materialist. There is no abstract realm of forms. Geometry is the study of *phantasms* of bodies, but ultimately grounded in the real properties of space and matter.
      *   *The Parallel Postulate:* Hobbes loved Euclid but thought he was sloppy on definitions. He believed Euclidean geometry described the *actual* structure of space.

