      *   *Scenario B: Constructibility.* Can you *construct* a hyperbolic triangle via motion? Hobbes defines geometry by *generation* (motion of points/lines). If a non-Euclidean figure cannot be generated by simple motion in our intuitive space, he might reject it as not "real" geometry.
      *   *Scenario C: Physical Truth.* Hobbes believes geometry is the study of *space*. Space, for Hobbes, is the "phantasm of a thing existing without the mind simply." But he also thinks space is uniform and infinite. Non-Euclidean space implies curvature. Can "Space itself" curve for a materialist who sees space as the container of body?
      *   *The "One True Geometry" Argument:* Hobbes thinks geometry gives certain knowledge *because* we make the definitions. However, he also thinks these definitions must match the *nature of space*. If space is a real feature of the material universe (even if imagined), it has fixed properties.
