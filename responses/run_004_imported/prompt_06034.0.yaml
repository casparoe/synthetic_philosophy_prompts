      *   **Topic 1: Gin/Petrol & False Belief.**
          *   *The Issue:* Williams uses the gin/petrol case to show internal reasons depend on beliefs. If I want a gin and tonic, and I believe this is gin, I have a reason to drink it. If it's petrol, do I have a reason? Williams says no (because the belief is false). But if we correct beliefs, how much correction is allowed? If we correct *all* false beliefs and improve deliberation, does the "subjective motivational set" (S) expand so much that it includes *any* rational requirement, collapsing internalism into externalism?
          *   *Likely Defense:* The defender will argue there's a limit to "sound deliberative route." It must preserve the *identity* of the agent's projects. They might distinguish between instrumental error and constitutive error.
          *   *Follow-up Strategy:* Press on the "identity" constraint. If the corrected self is too different from the actual self, in what sense is it *their* reason?

      *   **Topic 2: Foot/Morality & Categorical Claims.**
          *   *The Issue:* Internalism seems to make moral reasons contingent. If a psychopath has no element in S linking to others' welfare, internalism says they have no reason to be moral. This undermines morality's categorical nature.
          *   *Likely Defense:* Williams accepts this! He thinks the "categorical imperative" is a philosophical myth. Or, she might argue that *most* humans have a general desire for social standing or self-conception that grounds moral reasons, even if not all.
          *   *Follow-up Strategy:* If she accepts the contingency (Williams's hard line), ask about the normative force of blaming someone who lacks the relevant S. If she argues most people *do* have the desire, ask about the edge cases (the amoralist) and whether internalism can explain why they are *wrong*, not just imprudent.

      *   **Topic 3: McDowell & Perception/Disclosure.**
          *   *The Issue:* McDowell argues that a virtuous person *sees* a reason. The reason isn't derived from a prior desire; the perception of the situation *creates* the motivation. Internalism gets the order wrong (Desire -> Reason vs. Reason -> Motivation).
          *   *Likely Defense:* Williamsians argue that "seeing" a reason presupposes a sensibility (a disposition to care). That sensibility is part of S. You can't have the perception without the underlying motivational disposition.
          *   *Follow-up Strategy:* Press on the source of normativity. If the sensibility is just a brute fact about S, why is it *rational* to have it? Does this reduce virtue to a kind of sophisticated taste?

