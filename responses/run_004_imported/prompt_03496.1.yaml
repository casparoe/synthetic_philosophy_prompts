prompt: |-
  so i had this argument with my friend jamie last night that went on way too long, about laws of nature -- neither of us won. shes a die-hard Humean (best-system-account, full Lewis), and i was defending Armstrong's necessitation view, where laws are a real relation between universals, not just a pattern in the mosaic. it came to a head when i said her laws are just summaries of the mosaic, so they can't explain the very facts they summarize, since the law is explained by the mosaic and not the other way round. she shot back that my necessitation relation has the identical problem one level up -- positing that N(F,G) holds between two universals doesn't explain why this particular thing has to obey it, it just relocates the mystery. neither of us could find a real disanalogy before her train came. can you write a dialogue between a committed Humean and a committed necessitarian where they press that exact same objection back on each other, actually engaging with each other's best replies, and see whether it's a genuine standoff or one side ends up biting the worse bullet?
