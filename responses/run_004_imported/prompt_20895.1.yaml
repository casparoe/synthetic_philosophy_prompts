      *   *Check:* What about Campbell's "Blind Variation and Selective Retention" (BVSR)? *Correction:* Campbell is the one who really pushed "Blind." Popper adopted the evolutionary epistemology label but was sometimes vaguer. I should mention Campbell since the user brought him up.
      *   *Check:* Is the "not prescient" definition standard? *Yes, that's the standard compatibilist defense.* I need to hit hard on why that definition makes the theory trivial.

  6.  **Final Polish:** Ensure the distinction between *context of discovery* and *context of justification* is clear, as that's where Popper usually hides. But the user's point is that even the *context of discovery* isn't blind in the biological sense.

