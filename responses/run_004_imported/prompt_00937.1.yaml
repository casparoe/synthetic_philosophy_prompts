answer: |-
  This is an exceptionally rich case study for a graduate seminar. Frederick Douglass's evolution from the Garrisonian view (the Constitution is pro-slavery) to the Spoonerian view (the Constitution is anti-slavery) cuts to the heart of modern debates about textualism, originalism, and the role of moral reasoning in law.

  To answer your specific question: **Douglass's mature position is best understood not as "original public meaning" originalism in the modern sense, but rather as a form of natural-law textualism that relies on a canon of construction favoring liberty.**

  However, the nuance lies in how one defines "meaning." If you distinguish between *semantic meaning* (what the words denote) and *expected application* (what the speakers thought would result), Douglass can be claimed by certain strands of modern originalism (specifically libertarian originalism).

  Here is a breakdown of the implications for your seminar, structured to help you guide the discussion.

  ### 1. Is Douglass an Original Public Meaning Originalist?

  If you define **Original Public Meaning (OPM)** as "how a reasonable speaker of English at the time of ratification would have understood the legal effect of the text," Douglass is **not** an OPM originalist.

  *   **The Historical Reality:** In 1787 and 1851, the "public meaning" of "person held to service or labor" was universally understood to refer to enslaved people in the South and indentured servants in the North. The euphemism was transparent. To argue otherwise requires ignoring the sociolinguistic context of the 19th century.
  *   **Douglass's Move:** Douglass explicitly rejects the *understood reality* in favor of the *strict letter*. He argues that because the text does not explicitly sanction slavery, the legal presumption must be freedom. This is a normative move, not a historical-linguistic one.
  *   **The Implication:** This highlights a fissure in modern originalism. If the "public meaning" yields an immoral result (as the early Douglass argued), does the interpreter have the license to retreat to a hyper-literal textualism to escape that meaning? Modern originalists generally say no; they argue we must accept the historical meaning and amend the document. Douglass argues the text itself, properly read, forbids the immoral result.

  ### 2. Is Douglass a Natural Law Textualist?

  This is the stronger classification. Douglass's 1851 turn was heavily influenced by Lysander Spooner's *The Unconstitutionality of Slavery* (1845). Spooner's argument rests on specific canons of construction derived from natural law theory:

  *   **The Presumption of Liberty:** Spooner and Douglass argue that no government can deprive a person of natural rights unless it does so in explicit, unambiguous terms. Silence or euphemism cannot suffice to authorize a violation of natural law.
  *   **The "Benefit of the Doubt" Canon:** When text is ambiguous (e.g., does "person" include slaves?), the interpretation consistent with justice must prevail over the interpretation consistent with injustice.
  *   **The Implication:** This challenges the modern positivist strain of originalism (like Justice Scalia's), which often seeks to separate law from morality. Douglass argues that the *legitimacy* of the Constitution depends on its compatibility with natural rights. For Douglass, the text is not a historical artifact to be decoded, but a legal instrument to be wielded for justice.

  ### 3. The Crucial Nuance: Semantic Meaning vs. Expected Application

  For a graduate seminar, the most sophisticated angle is to introduce the distinction made by modern originalists like Randy Barnett and Gary Lawson.

  *   **Original Expected Application:** What the Framers and the Public *thought* the clause would achieve (i.e., protecting slavery). Early Douglass and Garrison focused here.
  *   **Original Semantic Meaning:** What the words *actually say* (i.e., "persons," not "property"). Late Douglass focuses here.

  **The Argument for Douglass as a Proto-Originalist:**
  Randy Barnett has argued that Douglass *is* an originalist of sorts. He contends that the *semantic meaning* of "persons" is free human beings. The fact that the Framers *expected* those persons to be treated as slaves is an "expected application" that contradicts the "semantic meaning." Therefore, Douglass was right to prioritize the text over the expectation.

  **The Counter-Argument:**
  Critics would argue that in legal interpretation, "meaning" includes the legal consequences understood at the time. If everyone understood "person held to service" to legally encompass slaves, then the *legal meaning* was pro-slavery, regardless of the dictionary definition of "person." Douglass bypasses this by importing a natural-law presumption that changes the legal meaning.

  ### 4. Key Implications for the Seminar

  Here are four theoretical implications you might draw out for your students:

  **A. The Constraint Thesis**
  Originalism often claims to constrain judges by binding them to history. Douglass's reversal shows that "text" can be just as manipulable as "intent" if not bound by historical understanding. If a judge can ignore the universally understood context of "person held to service" because it offends natural law, what constrains them from doing the same with "equal protection" or "due process"? Douglass's method empowers the interpreter to moralize the text.

  **B. Interpretation vs. Construction**
  Modern originalists distinguish between *interpretation* (finding the meaning) and *construction* (deciding the legal effect when meaning is vague).
  *   **Early Douglass:** Interpreted the meaning as pro-slavery based on context.
  *   **Late Douglass:** Interpreted the text as ambiguous regarding slavery, then *constructed* the meaning using a natural-law canon (presumption of liberty).
  *   **Takeaway:** Douglass illustrates that "textualism" often hides a theory of construction. He wasn't finding a hidden meaning; he was applying a rule of decision to resolve ambiguity.

  **C. The Legitimacy of the Regime**
  Garrison's view ("covenant with death") suggests the Constitution is illegitimate and should be rejected (disunion). Douglass's mature view suggests the Constitution is legitimate but betrayed.
  *   **Implication:** This mirrors the modern debate over whether originalism preserves legitimacy by adhering to the founding, or undermines it by binding us to dead, potentially immoral hands. Douglass argues that adhering to the *textual principles* of the founding (liberty) saves the regime, even if it requires rejecting the *practices* of the founding.

  **D. The Role of Euphemism in Constitutional Drafting**
  Douglass's focus on the absence of the word "slave" highlights the strategic ambiguity of the Constitution.
  *   **Implication:** Does constitutional vagueness invite natural-law reasoning? If the Framers were too ashamed to write "slavery" explicitly, does that silence create a constitutional opening for abolitionists? This suggests that "shame" in drafting can be a resource for future interpreters seeking moral progress.

  ### 5. Suggested Discussion Questions

  1.  **On Meaning:** If 99% of the public in 1787 understood "person held to service" to include slaves, can a judge in 1851 (or 2024) legitimately say the meaning is "free persons only"? Is Douglass engaging in interpretation or revolution?
  2.  **On Constraint:** Garrison believed the text was too corrupted to save; Douglass believed the text was pure but the practice corrupt. Which view offers a more stable theory of constitutional fidelity?
  3.  **On Originalism:** Randy Barnett claims Douglass as a forebear of "original meaning" originalism. Does this stretch the definition of originalism too far? Does originalism require fidelity to *expected applications* or only *semantic definitions*?
  4.  **On Natural Law:** If Douglass's reading requires a presumption of liberty derived from natural law, does this make his theory incompatible with legal positivism? Can originalism survive without some underlying normative theory of rights?

  ### Recommended Secondary Literature for the Seminar
  *   **Lysander Spooner,** *The Unconstitutionality of Slavery* (1845) – Essential primary source for Douglass's shift.
  *   **Frederick Douglass,** "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1860 speech) – His mature articulation.
  *   **Randy Barnett,** "The Original Meaning of the Commerce Clause" (or his work on Douglass specifically) – For the argument that Douglass is a semantic originalist.
  *   **Philip Hamburger,** "Natural Law, Standard Laws, and the Constitution" – For the natural law context.
  *   **Michael Sandefur,** *Frederick Douglass: Self-Made Man* – Contains excellent analysis of his legal theory.
  *   **William Michael Treanor,** "Douglass's Constitution" – Specifically addresses the legal theory shift.

  ### Conclusion for the Seminar
  Douglass's reversal demonstrates that the binary between "intent" and "public meaning" is insufficient. There is a third category: **Principled Textualism.** This approach prioritizes the abstract semantic content of the text over the concrete historical expectations of the public, justified by a normative commitment to natural rights.

  For your students, the lesson is that **textualism is not historically neutral.** Douglass used the text to override history. Modern originalists often use history to override the text's abstract potential. Douglass forces us to ask: When text and history diverge, which one serves the legitimacy of the constitutional order?
