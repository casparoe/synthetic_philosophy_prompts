answer: |-
  The champagne in the green room was warm, but Elias didn't mind. He was still vibrating from the final note of *Variations on a Fracture*, his latest composition for cello and ensemble. The applause had been the kind that starts in the seats and climbs the walls, a physical pressure.

  "Transcendent," the conductor had said, gripping Elias's shoulder. "You took us to the edge."

  Elias nodded, accepting the compliment with the practiced humility of a man who expects it. He was fifty-two, tenured, respected. He believed in the work. He believed he had encoded a specific kind of modern alienation into the staff lines, a jagged, dissonant grief that only a sophisticated ear could decode.

  The room emptied until only Elias and Sarah remained. Sarah was a graduate student, twenty-three, sharp-eyed, holding a score she'd bought at the merch table. She hadn't left with the donors.

  "Are you heading out, Sarah?" Elias asked, loosening his tie.

  "I wanted to ask about the coda," she said. She wasn't smiling.

  "Ah. The resolution." Elias leaned against the piano. "It's meant to be ambiguous. A fading out, not an ending."

  Sarah looked down at the score, then up at him. "It didn't fade for me."

  Elias paused. "The dynamic markings indicate a diminuendo."

  "Not the sound," she said. "The feeling. In the second movement, the *allegro violento*... I watched your hand. You were sweating. You looked like you were fighting the instrument."

  "I was channeling the anger of the piece," Elias said.

  "But I didn't feel anger," Sarah said softly. "I felt... anxiety. But not the anger's anxiety. *My* anxiety. I was worried you were going to miss the shift in measure forty. I was watching your technique. I was impressed. But I wasn't... infected."

  She used the word casually, likely meaning 'moved.' But it snagged in Elias's mind like a burr.

  *Infected.*

  He drove home in silence. The city lights blurred against the rain on his windshield. Usually, after a premiere, he would replay the highlights in his head—the swell of the violins, the perfect intonation of the cello solo. Tonight, he replayed Sarah's face.

  *I was impressed. But I wasn't infected.*

  In his study, Elias poured a whiskey. On the shelf, spine cracked and yellowed, sat a copy of Tolstoy's *What Is Art?* He hadn't opened it in years. He'd bought it during a brief, pretentious phase in his thirties, dismissed it as the ramblings of a senile moralist, and shelved it.

  He pulled it down now. He didn't read the text; he remembered the gist from a seminar decades ago. *Art is not about beauty. Art is not about skill. Art is the transmission of feeling.*

  The artist must feel the emotion. The audience must catch it. Like a yawn. Like a disease. If the transmission fails, it is not art. It is a counterfeit.

  Elias sat in his leather chair. He thought about *Variations on a Fracture*.

  Had he felt alienation while writing it? He closed his eyes and searched the memory of that winter two years ago. He remembered the coffee. He remembered the deadline from the publisher. He remembered thinking, *The critics expect complexity here. If I resolve this chord too simply, they'll say I've gone soft.*

  He remembered calculating the dissonance. He remembered choosing a tritone because it was theoretically unstable, not because his chest hurt.

  He had constructed a vessel for emotion, labeled it *Grief*, and shipped it. But he hadn't put anything inside.

  He stood up and walked to the sound system. He needed to test the theory. He needed to hear something real. He put on Beethoven's *Late String Quartets*. The piece he and his friend had argued about over drinks last week. The piece his friend claimed was just "mathematical noise people pretend to love."

  Elias had been offended then. Now, he listened with a terrifying neutrality.

  The Op. 131 began. He waited for the infection. He waited for the sorrow to leap from the speakers and seize his throat.

  He heard the craftsmanship. He heard the genius of the counterpoint. He heard the historical weight of it. He felt a sense of reverence, the way one feels standing before a massive cathedral.

  But did he feel what Beethoven felt?

  Or was he feeling the *idea* of Beethoven? Was he performing the role of the Appreciative Listener, trained by a hundred years of critics to nod at the difficult passages?

  Tolstoy's voice seemed to whisper from the book on the desk: *If the feeling is not transmitted, the art has not happened. It is merely a puzzle.*

  Elias turned the music off. The silence of the apartment rushed in.

  He went to the corner where his cello stood in its case. He opened it. The wood smelled of rosin and old varnish. He took it out, sat on the stool, and tightened the bow.

  He didn't play *Variations*. He didn't play Bach.

  He tried to remember the last time he had felt a feeling so strong he needed to push it out of his body. He thought of his mother's funeral. He thought of the day his daughter was born.

  He put the bow to the string and tried to play the memory of the funeral. He played a low, slow C.

  It sounded like a C. It was in tune. The tone was rich.

  But as he played, he caught himself listening to the timbre. *Good resonance,* he thought. *Better bow pressure.*

  He stopped.

  He was evaluating the transmission while trying to transmit. He was the engineer, not the source.

  Tolstoy argued that the upper classes had lost the capacity for real art because they valued exclusivity over clarity. They wanted art that required a key to understand. Elias had built his career on making locks and selling keys.

  He looked at the framed reviews on the wall. *A Master of Modern Complexity.* *Elias Thorne Pushes Boundaries.*

  If the theory held—if the infection was the only metric—then these weren't reviews of art. They were receipts for a service rendered. He had provided intellectual stimulation and social capital, and they had paid him in status.

  It wasn't a lie, exactly. It was a trade. But it wasn't art.

  He looked at the cello in his hands. It was a tool. He was a craftsman. A very good one. A famous one.

  But the room felt hollow. The "transcendence" from three hours ago evaporated, leaving behind the cold residue of a job well done.

  He thought of Sarah. She had been honest. She had admitted she felt anxiety about his technique. That was a real feeling. In a twisted way, she had experienced more genuine art in that moment of honest anxiety than in the polished performance itself, because her feeling was *true*, even if the object of it was flawed.

  Elias loosened the bow hair. He put the cello back in the case.

  He walked back to the desk and looked at the manuscript for his next piece. It was scheduled for commission next fall. It was going to be about "the fragmentation of digital consciousness." He had already bought books on the subject. He had already sketched a motif based on notification sounds.

  He had not once felt fragmented. He had not once felt conscious of anything other than his own reputation.

  He picked up the manuscript. For a moment, he thought about tearing it up. It would be a dramatic gesture. A scene in a movie about an artist finding his soul.

  But that would be a performance, too. That would be artifice.

  He didn't tear it up. He just put it in the drawer. He turned off the lamp.

  In the dark, Elias sat and waited to feel something—regret, shame, relief, anything—that wasn't a calculation. He sat for a long time, listening to the hum of the refrigerator, the traffic outside, the beating of his own heart.

  He waited for the infection.

  Nothing came. Just the silence, clear and individual, and for the first time in twenty years, he realized he had nothing to say to it.
