      *   Key insight: Beliefs aim at truth. If the process generating the future belief is not truth-tracking, the prediction is not evidence.
      *   Analogy: Predicting you will be hungry later doesn't mean you should eat now. Predicting you will be tired doesn't mean you are tired. Predicting you will be biased doesn't mean you should be biased.

