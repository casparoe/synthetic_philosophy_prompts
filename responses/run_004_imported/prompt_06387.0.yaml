      *   Key distinction: *Why* does the belief change?
          *   **Information Accumulation:** If the change is driven by acquiring new, relevant evidence (e.g., experiencing the economy as a homeowner vs. renter), then the future belief is epistemically privileged.
          *   **Psychological/Physiological Change:** If the change is driven by bias, cognitive decline, or self-interest unrelated to truth-tracking (e.g., loss aversion, rigidity), then the future belief is epistemically suspect.
