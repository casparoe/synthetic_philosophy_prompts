prompt: |-
  Okay, weird research rabbit hole from my WIP, but maybe you can help settle it. My main character has to decide whether to sink her savings into reopening her late mom's bakery, and I wanted a real, defensible number for her odds of success so the stakes don't feel made up. Every source gives a different answer: the general 5-year survival rate for small businesses is one number, its worse specifically for food service, worse again for independent bakeries in small towns, and a trade report on bakeries run by someone with her exact background (prior industry experience, town under 20k people) gives a rosier number -- except thats based on like 40 bakeries total. My critique partner says just use the broadest, most reliable number and treat the rest as noise, which sounds reasonable but also feels like dodging what actually makes her situation specific. The more precisely a category matches her, the more "true" the number seems like it should be -- but keep narrowing and eventually you're just describing her alone, which doesn't feel like a probability of anything anymore. Is there an actual real probability of success for this one bakery, or is my critique partner right that the question's kind of confused?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is writing a Work In Progress (WIP). The protagonist is deciding whether to invest savings into reopening her late mom's bakery.
      *   **Conflict:** The user wants a realistic, defensible statistic for the bakery's odds of success to make the stakes feel real.
      *   **Data Conflict:** Different sources give different numbers (general small biz vs. food service vs. independent bakeries vs. specific demographic/town size). The most specific data has a tiny sample size ($N=40$).
      *   **Critique Partner's Advice:** Use the broadest, most reliable number and ignore the specifics.
      *   **User's Intuition:** Narrowing the category feels more "true," but narrowing too much makes probability meaningless (reference class problem).
      *   **Core Question:** Is there an *actual* real probability of success for this *one* bakery, or is the critique partner right that the question is confused?

  2.  **Identify the Underlying Concept:**
      *   This is a classic philosophical and statistical problem known as the **Reference Class Problem**.
      *   It was famously discussed by philosophers like Hans Reichenbach and John Venn, and applied to probability theory and decision-making.
      *   The problem: To assign a probability to a single event, you must place it in a class of similar events. But any single event belongs to infinite classes. Which class do you choose?
      *   The user has intuitively stumbled upon this exact problem ("keep narrowing and eventually you're just describing her alone, which doesn't feel like a probability of anything anymore").

  3.  **Evaluate the Critique Partner vs. User:**
      *   **Critique Partner:** Pragmatic. Broad data is more statistically significant ($N$ is large). Good for general atmosphere.
      *   **User:** Narratively driven. Specifics create tension and character connection. Good for internal conflict.
      *   **Truth:** Both are partially right, but the philosophical answer is that there is *no single true number*. Probability is epistemic (about knowledge), not ontological (about the object itself).

  4.  **Formulate the Answer:**
      *   **Validate the User:** Acknowledge that this is a brilliant insight, not just a "weird rabbit hole." Name-drop the "Reference Class Problem." This validates their intellectual curiosity.
      *   **Address the Statistical Reality:** Explain *why* the numbers vary. Small sample sizes ($N=40$) are noisy. Broad numbers mask specific risks.
      *   **Address the Philosophical Reality:** There is no "actual real probability" for a unique event. Probability is a tool for decision-making under uncertainty, not a property of the bakery itself.
      *   **Apply to Fiction/Writing:** How does this help the story?
          *   The *struggle* to find the number is the story.
          *   Different characters can advocate for different statistics (optimist vs. pessimist).
          *   The "truth" isn't the number; it's how she acts despite the uncertainty.
      *   **Provide a "Defensible" Middle Ground:** Suggest how to handle the data in the text without getting bogged down. (e.g., use the broad number as the "ghost" haunting her, but the specific number as the "hope" clinging to).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You've discovered the Reference Class Problem. It's a real thing in philosophy/stats.
      *   *The Stats:* Explain why the $N=40$ number is dangerous (high variance). Explain why the broad number is safe but impersonal.
      *   *The Philosophy:* Probability isn't a physical property like mass. It's a measure of uncertainty. So the critique partner is technically right (no single true number), but the user is right that the *choice* of number matters emotionally.
      *   *The Narrative Solution:* Don't pick one number. Make the *conflict* about the numbers.
          *   Bank manager uses the broad food service stat (Say 20%).
          *   Her research finds the specific stat (Say 60%).
          *   She has to choose which reality to believe.
      *   *Conclusion:* The stakes aren't the math; they're the trust in herself vs. the data.

  6.  **Refining the Tone:**
      *   Keep it encouraging but intellectually rigorous.
      *   Avoid giving a specific number (I'm an AI, not a market analyst, and it varies by location/year).
      *   Focus on the *utility* of the confusion for the story.

  7.  **Final Polish:** Check against the user's specific constraints (town under 20k, mom's bakery, prior experience). Ensure the distinction between "frequency" (past data) and "credence" (belief) is clear but accessible.

      *(Self-Correction during drafting)*: I should make sure not to get too bogged down in Bayesian vs. Frequentist debates unless it serves the story. Keep it focused on the *Reference Class Problem* as the key takeaway. That's the "aha" moment for the user.

  8.  **Final Output Structure:**
      1.  Validate the insight (Reference Class Problem).
      2.  Explain the statistical limitation (Sample size vs. Relevance).
      3.  Answer the philosophical question (No "true" probability).
      4.  Turn the problem into a narrative asset (How to write it).
      5.  Suggested approach for the "defensible number."

  9.  (Final check of the prompt requirements): The user asked "Is there an actual real probability... or is my critique partner right?" I need to answer that directly.
      *   Answer: There is no actual real probability (Partner is right on ontology), but the specificity matters for decision making (User is right on epistemology/narrative).

  10. *Ready to write.*
answer: |-
  You have accidentally stumbled onto one of the most famous problems in the philosophy of probability and statistics. It is called the **Reference Class Problem**.

  It was famously articulated by the philosopher Hans Reichenbach (and later John Venn), and it states exactly what you intuitively realized: *To assign a probability to a single event, you must place it in a class of similar events. But any single event belongs to infinite classes. Which class do you choose?*

  If you classify the bakery as "all small businesses," the survival rate is ~50% at 5 years.
  If you classify it as "restaurants," it drops to ~30%.
  If you classify it as "bakeries in towns under 20k run by women with prior experience," you have your specific number, but your sample size ($N=40$) makes the margin of error huge.
  If you classify it as "this specific bakery run by this specific woman," the sample size is 1, and probability ceases to exist.

  So, to answer your core question directly: **No, there is no "actual real probability" for this one bakery.** Your critique partner is ontologically right (the number doesn't exist in the universe), but you are epistemologically right (the specific data changes how we assess risk).

  Here is how you resolve this for your WIP without losing your mind or the narrative tension.

  ### 1. The Statistical Reality (Why the numbers fight)
  Your critique partner is advising you to use the **Broad Frequency** approach. This is statistically "safer" because large sample sizes reduce noise. If the general food service industry has a 60% failure rate in year one, that is a hard gravitational pull.

  However, you are arguing for the **Specific Predictor** approach. In actuarial science and insurance, this is exactly what they do. If you insure a building, you don't use the fire rate for "all buildings." You use the fire rate for "brick buildings in this zip code with this age of wiring."

  The problem with the trade report ($N=40$) isn't that it's irrelevant; it's that it has high **variance**. With only 40 bakeries, one or two outliers (a massive hit or a disastrous failure) skew the percentage wildly. It feels "truer" because it matches the *features*, but it is less reliable as a *predictor*.

  ### 2. The Narrative Solution (Make the conflict about the math)
  Since there is no "true" number, do not try to find one. Instead, **make the ambiguity of the number part of the character's conflict.**

  The fact that she *cannot* find a solid number is actually higher stakes than if she found one.
  *   **The Bank/Loan Officer:** Will use the broad, scary number. "Food service is high risk. 60% fail. We can't lend." This represents the cold, hard world.
  *   **The Trade Report/Her Hope:** She finds the specific, rosier number. "But look, experienced bakers in small towns do better!" This represents her justification and her love for her mother.
  *   **The Reality:** She knows the $N=40$ is shaky. She knows she might be fooling herself with "cherry-picked" data.

  This creates a beautiful internal conflict: *Is she making a calculated risk, or is she shopping for a statistic that tells her what she wants to hear?*

  ### 3. How to write the "Defensible Number"
  If you need a specific number for the text to ground the scene, here is the most defensible approach based on real Small Business Administration (SBA) and Bureau of Labor Statistics (BLS) trends:

  *   **General Small Business:** ~50% survive 5 years.
  *   **Restaurant/Food Service:** ~30% survive 5 years (some studies say 60% fail in year *one*).
  *   **The "Experience" Factor:** Having prior industry experience is the single biggest mitigator of risk. It doesn't guarantee success, but it drastically reduces the "year one" failure cliff.

  **Recommendation:**
  Give her the broad number as the "ghost" haunting her, and the specific number as the "sword" she tries to fight with.

  > *Example:*
  > "The SBA website said sixty percent of restaurants closed within the first year. But that was 'restaurants.' That was burgers and sit-down dinners and liquor licenses. The trade journal she'd ordered said independent bakeries in towns under twenty-five thousand had a seventy percent survival rate. Seventy. It sounded like a passing grade. It sounded like hope. But the footnote said the data was drawn from a sample of forty-two establishments. Forty-two. She could count the bakeries in her own county on one hand. Statistics required mass. She was a sample size of one."

  ### 4. Why this makes the story better
  If you pick one number and treat it as fact, you turn a human decision into a math problem. If the math says 70% success, why is she worried? If it says 30%, why would she ever try?

  By acknowledging the **Reference Class Problem**, you validate her anxiety. The uncertainty *is* the point. She isn't betting on odds; she's betting on herself. The statistics are just the language she uses to argue with her fear.

  **Verdict:** Your critique partner is right that there is no single "true" probability. But you are right that narrowing the category makes the decision feel more human. Use the conflict between the two to show her state of mind. The "real" odds are whatever she decides to believe when she signs the lease.
