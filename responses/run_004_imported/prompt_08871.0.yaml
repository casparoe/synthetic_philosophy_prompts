      *   *Option B (Lewis):* Captures the phenomenology and normative structure of human social interaction. However, the "common knowledge" requirement is notoriously difficult to satisfy in reality (infinite regress).
      *   *Decision:* For a *social ontology* seminar, the focus is usually on the nature of social reality, institutions, and norms. Lewis provides the better account of what makes a convention *social* and *normative* rather than just biological or behavioral. Skyrms explains the *causal history*, but Lewis explains the *ontological status*.
