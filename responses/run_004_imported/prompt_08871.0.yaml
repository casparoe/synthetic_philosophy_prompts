answer: |-
  Here is the verdict: **David Lewis wins.**

  For a social ontology seminar, Skyrms's evolutionary account is a powerful causal story, but it is an ontological category error. Skyrms explains the *genesis* of behavioral regularities, but he fails to capture the *constitutive nature* of convention. He has indeed swapped in something thinner—a stable behavioral pattern—and kept the word "convention" out of habit. If you want to know how signaling systems emerge in a population of bees or bots, read Skyrms. If you want to know what a convention *is* for beings who navigate a normative social world, you must read Lewis.

  Here is the defense.

  ### 1. Reasons vs. Causes
  The core failure of the Skyrmsian account in an ontological context is that it conflates *causes* of behavior with *reasons* for action.

  In Skyrms's replicator dynamics or reinforcement learning models, agents follow a regularity because it has been rewarded in the past. The "force" keeping the convention in place is historical success or evolutionary fitness. If the environment changes, the behavior shifts when the reinforcement schedule shifts. There is no "ought" here, only "is."

  Lewis, however, identifies that a convention is sustained by a specific structure of **reasons**. I follow the convention *because* I expect you to follow it, and I know you expect me to follow it. This recursive structure creates a conditional obligation: *given* that we want to coordinate, I *ought* to do my part. This is the "normative flavor" you mentioned. Skyrms strips this out. In his model, if I deviate, I don't violate a norm; I just make a suboptimal move that will be punished by reality. Lewis captures the distinctively *social* pressure of convention—the fact that we hold each other accountable to the regularity, not just to the outcome.

  ### 2. The Indispensability of Common Knowledge
  You asked if Lewis's common knowledge apparatus is indispensable or just baggage. It is indispensable. It is the bridge between mere regularity and social fact.

  Critics often dismiss common knowledge as psychologically unrealistic (who can hold infinite recursive beliefs?). But this misunderstands its ontological role. Common knowledge is not a psychological burden; it is the **transparency condition** required for a coordination equilibrium to become a *rule*.

  Without common knowledge, we have what Ullmann-Margalit called a "social norm" in the thin sense: we all happen to drive on the right. With common knowledge, we have a convention: we all drive on the right *because we know it is the agreed-upon solution*. This distinction matters for ontology because it determines the status of the act. If I drive on the left in Skyrms's world, I crash. If I drive on the left in Lewis's world, I violate a mutual expectation. The latter creates the possibility of blame, resentment, and normative sanction, which are the building blocks of social reality. Common knowledge is the logical structure that makes those attitudes possible. To call it "baggage" is to ignore the very phenomenon social ontology is tasked with explaining: the existence of normative social structures.

  ### 3. Genesis vs. Constitution
  Skyrms's strongest selling point is that he solves the "origin story" problem. Lewis assumes a coordination problem exists and asks how rational agents solve it; Skyrms shows how the problem gets solved without rationality.

  But for ontology, **genesis is not constitution.** Knowing how a sculpture was carved (the causal history) does not tell you what makes it art (its ontological status). Similarly, knowing how a signaling system evolved (Skyrms) does not tell you what makes it a convention *now*.

  Once the system is in place, human agents interact with it *as* a convention. We teach it to our children as a rule ("We shake hands, not bump heads"). We criticize violators ("He didn't shake hands!"). We reason about it using the logic Lewis describes. Skyrms explains how we got to the starting line, but Lewis explains the game being played. If your seminar is about the nature of social reality, you must prioritize the account that matches the agent's experience of that reality. We experience conventions as normative expectations, not as reinforcement schedules.

  ### The Bottom Line
  Skyrms naturalizes convention until it disappears into biology. He gives you a world of organisms adapting to stimuli. Lewis gives you a world of agents recognizing mutual obligations.

  If you adopt Skyrms's definition, you lose the ability to distinguish between a convention (like driving on the right) and a mere habit (like drinking coffee in the morning), provided both are stable regularities. Lewis's apparatus—specifically the common knowledge of mutual expectations—is the only thing robust enough to mark that boundary.

  Stick with Lewis. Skyrms explains the mechanics of the machine; Lewis explains the meaning of the signal. For social ontology, meaning wins.
