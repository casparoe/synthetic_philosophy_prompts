      *   **Skyrms:** Focuses on *stability and emergence*. Conventions are attractors in a dynamic system. Agents act because of past reinforcement or evolutionary fitness. It explains *how* conventions start without hyper-rational agents, but it risks reducing convention to mere habit or instinct.

