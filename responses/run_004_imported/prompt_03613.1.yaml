answer: |-
  This is a classic clash of ethical frameworks, and you are right to feel that "it grosses me out" and "it is morally wrong" are distinct claims. In philosophy, this is often the difference between **moral realism** (there is an objective truth about the act) and **moral sentimentalism** (morality is based on emotional response).

  Devon is making a specific philosophical argument, even if he's doing it intuitively. To give you the "sharp" adjudication you asked for, we need to break down his three specific claims: the "proves too much" objection, the argument from disgust, and the argument from tradition.

  Here is the rigorous breakdown of where Devon stands and where his logic holds or fails.

  ### 1. The "Proves Too Much" Objection
  **Devon's Claim:** If your only standard is "consent + no harm," you cannot call *anything* wrong (e.g., consensual cannibalism, self-degradation, etc.).
  **The Analysis:** This is a version of the **Slippery Slope** fallacy, but it touches on a real limit of Liberal Individualism.

  *   **Where he has a point:** Consent is not magic. We generally agree that you cannot consent to certain harms (e.g., selling yourself into slavery, certain types of physical maiming). So, "consent + no harm" is not actually the *whole* standard; the standard is usually "autonomy within the bounds of public reason."
  *   **Where he fails:** In the context of adult relationships, consent is the primary moral gatekeeper. Devon is implying there is a **Teleological Argument** here: that marriage has an inherent *purpose* (telos) that exists independent of the people in it. If marriage is *by definition* exclusive, then violating exclusivity is a "category error," like using a toaster to freeze ice cream.
  *   **The Adjudication:** Teleological arguments require agreement on the purpose. If Mara and her husband define the purpose of their marriage as mutual flourishing (which they say it is), Devon cannot impose an external purpose (exclusivity) without arguing *why* that purpose is objective. He hasn't done that; he's just asserted it. So, his claim that your standard "proves too much" is weak here because it assumes his definition of marriage is the only valid one.

  ### 2. The Argument from Disgust ("The Yuck Factor")
  **Devon's Claim:** It grosses him out, and that feeling signals a moral violation.
  **The Analysis:** This is known in bioethics as the **Wisdom of Repugnance**, a term coined by Leon Kass. He argued that deep disgust is an emotional expression of deep wisdom that reason cannot articulate.

  *   **The Counter-Argument:** Philosopher **Martha Nussbaum** dismantled this in her book *Hiding from Humanity*. She argues that disgust is a terrible moral compass because it is historically linked to **magical thinking** and **contamination**.
      *   Disgust evolved to protect us from pathogens (rotting meat, feces).
      *   When applied to social groups or behaviors, it projects "contamination" onto people who are actually harmless.
      *   Historically, disgust was the primary argument used against interracial marriage, homosexuality, and women working in factories. In all those cases, the "yuck factor" was cultural conditioning, not moral truth.
  *   **The Adjudication:** Disgust can carry moral weight *only if* it can be translated into a harm principle. If you say "eating rotting meat is wrong," you can explain the biological harm. If you say "open marriage is wrong because it's gross," but cannot identify a victim or a tangible negative outcome, the disgust is likely a **social phobia**, not a moral insight. Devon is experiencing **moral dumbfounding**: he feels it's wrong but can't explain why, so he relies on the emotion. That is not rigorous ethics; it's intuition masquerading as argument.

  ### 3. The Argument from Tradition
  **Devon's Claim:** Every culture throughout history has looked down on this; that universality counts for something.
  **The Analysis:** This is an appeal to **Chesterton's Fence**. The principle states: "Do not remove a fence until you know why it was put there." Traditions often encode survival wisdom.

  *   **Where he has a point:** Monogamy *does* have evolutionary and sociological utility. It reduces paternity uncertainty, stabilizes resource distribution, and lowers intra-male violence. A society where *everyone* had open marriages might face different stability challenges than one where they don't.
  *   **Where he fails:** This is the **Naturalistic Fallacy** (deriving an "ought" from an "is"). Just because something *has* been done (or banned) historically doesn't mean it *should* be.
      *   Historically, almost all cultures also looked down on democracy, atheism, and gender equality.
      *   Tradition often preserves power structures, not just moral truths. Traditional marriage norms were frequently about treating women as property and ensuring legitimate heirs for property transfer. If Mara's marriage is egalitarian and consensual, the "traditional" objection might be preserving a norm whose original purpose (property/paternity control) is no longer relevant.
  *   **The Adjudication:** Tradition creates a **presumption** of caution, but it is not a verdict. It shifts the burden of proof to the innovator (Mara) to show it works. If Mara and her husband are happy and stable, they have met that burden. Devon is treating the *history* of the norm as more important than the *outcome* of the specific instance.

  ### The Sharper Framework: Moral Foundations Theory
  To really settle this for yourself, look at **Moral Foundations Theory** (Jonathan Haidt). It suggests humans have different "taste buds" for morality.

  1.  **You are operating on Care/Harm and Liberty/Oppression.** Your metric is: "Is anyone suffering? Are they free?"
  2.  **Devon is operating on Sanctity/Degradation and Authority/Subversion.** His metric is: "Is this pure/noble? Does this respect the institution?"

  Neither of you is being "illogical." You are prioritizing different moral axes. However, in a pluralistic secular society, **Care/Harm and Liberty are the only foundations that can be universally legislated or enforced.**

  Why? Because I can prove to you that someone is hurt. I cannot prove to you that something is "sacred" if you don't share my religion or tradition. Therefore, when Devon says "It's wrong because it violates Sanctity," he is making a **private claim** but treating it like a **public truth**.

  ### The Verdict
  You were right to separate "squick" from "wrong." Here is the rigorous way to adjudicate whether disgust or tradition carries weight:

  **The Translation Test:**
  Ask Devon to translate his moral claim into secular harm.
  *   *Claim:* "It's disgusting." -> *Translation:* "It reminds me of pathogen contamination." (Irrelevant to morality).
  *   *Claim:* "It's against tradition." -> *Translation:* "It risks social instability." (Valid concern, but requires evidence that *this specific* marriage causes instability, which it doesn't).
  *   *Claim:* "It violates the purpose of marriage." -> *Translation:* "They are using the label 'marriage' incorrectly." (A semantic argument, not a moral one).

  **Conclusion:**
  Devon is not a bad guy, but he is committing the **Naturalistic Fallacy** (tradition = good) and relying on the **Wisdom of Repugnance** (disgust = truth) without being able to articulate a victim or a tangible harm.

  Your standard ("consent + no harm") does not prove too much; it is the baseline for liberal ethics. Devon's standard ("tradition + disgust") proves too *little* because it cannot distinguish between "immoral acts" and "unfamiliar acts." You can agree to disagree, but you don't need to concede that his gut reaction has the same ethical weight as your harm-based analysis. His is a preference; yours is a principle.
