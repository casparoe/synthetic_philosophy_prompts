answer: |-
  Your roommate is technically correct according to the standard model taught in most introductory decision theory courses, but your intuition is also supported by decades of Nobel Prize-winning research. What you experienced is a famous problem known as the **Allais Paradox**.

  Here is the breakdown of why this happened, why your roommate says it is a contradiction, and why you might still be "rational" in a broader sense.

  ### 1. The Mathematical Contradiction (Your Roommate's View)
  Your roommate is applying **Expected Utility Theory (EUT)**. This is the standard normative model of decision-making, which assumes that a rational agent chooses the option with the highest expected "utility" (subjective value). A core rule of EUT is the **Independence Axiom**.

  The Independence Axiom states that if you prefer Option X to Option Y, you should still prefer X to Y even if both are combined with a common, independent probability of a third outcome. Essentially, common outcomes should "cancel out."

  Let's look at the math of your two choices (assuming $0 has a utility of 0):

  **Situation 1 (Trivia Night):**
  *   **Choice A:** 100% chance of $100.
  *   **Choice B:** 89% chance of $100, 10% chance of $500, 1% chance of $0.
  *   **You chose A.** This implies:
      $$U(100) > 0.89 \cdot U(100) + 0.10 \cdot U(500) + 0.01 \cdot U(0)$$
      If we subtract $0.89 \cdot U(100)$ from both sides, we get:
      $$0.11 \cdot U(100) > 0.10 \cdot U(500)$$

  **Situation 2 (Raffle):**
  *   **Choice C:** 11% chance of $100, 89% chance of $0.
  *   **Choice D:** 10% chance of $500, 90% chance of $0.
  *   **You chose D.** This implies:
      $$0.10 \cdot U(500) + 0.90 \cdot U(0) > 0.11 \cdot U(100) + 0.89 \cdot U(0)$$
      If we subtract $0.89 \cdot U(0)$ from both sides, we get:
      $$0.10 \cdot U(500) + 0.01 \cdot U(0) > 0.11 \cdot U(100)$$
      *(Which simplifies to $0.10 \cdot U(500) > 0.11 \cdot U(100)$)*

  **The Contradiction:**
  In Situation 1, your choice implies that $0.11 \cdot U(100)$ is greater than $0.10 \cdot U(500)$. In Situation 2, your choice implies the exact opposite. Under Expected Utility Theory, you cannot hold both preferences simultaneously. One of the choices must be a "mistake" if you want to maintain a consistent utility function.

  ### 2. The Psychological Reality (Your View)
  You noted that "giving up something guaranteed seemed like a genuinely different kind of decision." You are describing the **Certainty Effect**.

  Human beings do not perceive probabilities linearly. The psychological difference between a 99% chance and a 100% chance feels massive, whereas the difference between an 89% chance and a 90% chance feels negligible.
  *   In **Situation 1**, the guarantee of $100 provides a sense of security. The 1% risk of getting *nothing* feels like a potential regret you want to avoid at all costs.
  *   In **Situation 2**, there is no certainty to lose. Both options are risky. Since the probabilities (11% vs 10%) are very close, you focus on the payout ($100 vs $500). The higher payout becomes the deciding factor.

  This pattern of preference is so common that when Maurice Allais presented it in 1953, he shocked the economics community. Later, Daniel Kahneman and Amos Tversky used this exact paradox to develop **Prospect Theory**, for which Kahneman won the Nobel Prize. Prospect Theory argues that people weight probabilities non-linearly (overweighting small probabilities and certainty) and value gains and losses relative to a reference point.

  ### 3. So, Who Is Right?
  The answer depends on how you define "rational."

  **If rationality means Logical Consistency (Normative):**
  Your roommate is right. If you accept the axioms of Expected Utility Theory as the definition of rationality, your preferences are inconsistent. In strict decision theory courses, this is often labeled an "error" because it makes you vulnerable to specific logical critiques (though in this static case, you aren't immediately vulnerable to a "money pump" without further framing).

  **If rationality means Ecological Validity (Descriptive/Pragmatic):**
  You are right. Your decision-making process accounts for the emotional value of certainty and the avoidance of regret. Many modern decision theorists argue that EUT is too narrow. If a model of rationality declares that the vast majority of human beings are "irrational" for making a choice that feels intuitively correct and protects them from regret, perhaps the model is flawed, not the humans.

  There are alternative frameworks, such as **Regret Theory** or **Weighted Utility Theory**, which modify the standard axioms to allow for the Allais Paradox preferences. In these models, your choices are perfectly consistent because the "utility" includes the emotional weight of certainty.

  ### Summary for Your Course
  Since you are taking a decision theory course, this is likely a specific learning objective.
  1.  **Acknowledge the inconsistency:** Admit that under von Neumann-Morgenstern Expected Utility Theory, your choices violate the Independence Axiom.
  2.  **Defend the intuition:** Explain that this is the Allais Paradox, demonstrating that human agents value certainty disproportionately.
  3.  **Conclusion:** You did not make a "mistake" in a practical sense; you revealed that your personal utility function includes a premium for certainty that standard EUT does not capture. Your roommate is correct about the *math*, but you are correct about the *psychology*.

  You are in excellent company: Maurice Allais, Daniel Kahneman, and much of the field of Behavioral Economics agree with your intuition over the strict axioms of traditional theory.
