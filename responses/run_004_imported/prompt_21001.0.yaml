          *   *Analysis:* Owen is right that the text calls life a "Great Dream." Naomi is right that Zhuangzi undercuts his own authority. This is the crux of the "Is he a skeptic?" debate. Naomi's point about the self-undermining nature is strong evidence against Owen's "Chinese Descartes" label, because Descartes wants to *escape* skepticism, whereas Zhuangzi seems comfortable *dwelling* in it without resolving it.

