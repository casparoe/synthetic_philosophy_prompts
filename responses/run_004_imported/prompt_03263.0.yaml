answer: |-
  The lighter clicked. A small flame bloomed in the twilight, caught the tip of the cigarette, and died. Dave inhaled, the cherry glowing bright orange, and exhaled a long, guilty stream of blue smoke that drifted across the patio table.

  Elena watched the smoke curl around her wine glass. "There it is," she said. "Textbook *akrasia*."

  Marcus didn't look at Dave; he was watching the ash form. "Don't be lazy. It's not weakness of will. It's hyperbolic discounting."

  "It is weakness of will," Elena snapped, turning to him. "Twenty minutes ago, Dave made an all-things-considered judgment. He weighed the health risks, the cost, the social pressure, and the craving. He concluded quitting was the rational choice. Now, he acts directly against that judgment. He is knowingly undermining his own agency."

  "He's not undermining anything. He's optimizing," Marcus said, tapping the table. "You're assuming 'Dave' is a single, continuous agent. He's not. There's Dave-at-8:00-PM, who wants to be healthy next year, and Dave-at-8:20-PM, who wants dopamine *now*. The 8:20 self isn't irrational. The reward is right in front of him. The cost is thirty years away. The discount rate just spiked."

  "So you're saying he didn't change his mind?"

  "I'm saying his preferences changed because the temporal proximity changed. If I offer you a hundred dollars today or a hundred and ten tomorrow, you take the ten extra. If I offer you a hundred dollars in ten years or a hundred and ten in ten years and one day, you wait the extra day. The preference reverses based on the horizon. That's not irrationality, Elena. That's math."

  "It's a convenient fiction," Elena countered, leaning in. "By splitting him into 'selves,' you erase the contradiction. If the 8:20 self wins, you say, 'Well, that's what *that* self wanted.' It makes failure impossible. It lets him off the hook. If it's just a negotiation between temporal clones, where is the responsibility? Where is the *will* in weakness of will?"

  Marcus laughed, a short, sharp sound. "Responsibility is a moral category, not a predictive one. I'm trying to explain why the cigarette got lit, not who to blame. Your 'will' is just a black box you stick things in when you can't model the variables. You call it 'irrational' because you can't quantify the craving."

  "I call it irrational because he believes smoking is bad for him! He believes it *right now*, while he's smoking it!"

  "Does he?" Marcus challenged. "At the exact moment of the inhale? The visceral utility of the nicotine is outweighing the abstract utility of 'health.' His brain is telling him the cigarette is more valuable than the lung. In that micro-second, it *is* the better judgment."

  Elena froze. She picked up her wine glass, swirling the Cabernet, her eyes narrowing. "Wait. Do you hear yourself? You're saying that at the moment of action, he always chooses what he perceives as the greater good."

  "Basically."

  "That's Socrates," she said, the realization landing heavy in her voice. "In the *Protagoras*. He argues that *akrasia* doesn't exist. He says no one ever willingly acts against their own better judgment. If they do the bad thing, it's because they were ignorant of the calculus. They misweighed the pleasure against the pain."

  Marcus shrugged, unbothered. "Socrates was an intuitive behavioralist. He knew people don't fight themselves; they fight their information gaps."

  "No, he knew that if you define 'good' as 'what is chosen,' then nobody ever chooses evil. But that's a tautology! It destroys the phenomenon we're watching." Elena gestured at Dave, who was staring at the ground, kicking at a loose paver stone. "Look at him. He feels guilt. He feels he *failed*. If Socrates was right, and you're right, he shouldn't feel guilt. He should just feel like he updated his data. Why does he look miserable if he just satisfied the 8:20 self's preference?"

  "Because the 8:00 self is still in the room," Marcus said quietly. "And he's going to be the one paying for the chemo. The conflict isn't in the action; it's in the aftermath. The selves are at war, sure. But the action itself? The action is always rational to the actor in the moment."

  "But that means we can never be weak," Elena pressed, her voice rising. "We can only be mistaken. If I eat the cake when I'm on a diet, I'm not weak, I'm just temporarily convinced the cake is more important than the diet. It turns a moral struggle into a calculation error."

  "Because it *is* a calculation error," Marcus said. "Your 'moral struggle' is just the 8:00 self screaming at the 8:20 self to use a lower discount rate. You want to treat the will like a muscle. It's not. It's a resource allocation system. Dave didn't lack willpower. He lacked a commitment device. He should have thrown the pack away."

  "If he threw the pack away, and then went to the store to buy another one, would that still be math?"

  "Yes. Cost of walking to the store plus cost of cigarettes versus cost of craving."

  Elena shook her head, looking back at Dave. The cigarette was half-gone. "You've sanitized the human condition, Marcus. You've taken the tragedy out of failure. If it's just discounting, then he's not a weak man. He's just a curve on a graph."

  "Better a curve on a graph than a sinner in need of grace," Marcus said, finally looking at her. "If it's a curve, we can fix it. We can change the incentives. If it's 'sin' or 'weakness,' he just has to pray for strength. And we saw how well that worked twenty minutes ago."

  Dave flicked the ash. It fell onto his shoe. He didn't brush it off.

  "He knows he shouldn't be doing that," Elena said softly. "He knows it, and he does it anyway. That gap between knowing and doing? That's the only thing that makes us human. You want to explain it away."

  "I want to solve it," Marcus corrected. "You want to admire the gap."

  "I want to acknowledge it. If you deny *akrasia*, you deny that we can stand outside our impulses. You're saying we are slaves to the nearest reward."

  "We are," Marcus said. "Unless we build a cage for the slave. That's what the quit plan was supposed to be. It just wasn't a strong enough cage."

  Elena watched the smoke drift away into the night. "Socrates thought knowledge was virtue. If you knew the good, you'd do it."

  "Socrates didn't have fMRI machines," Marcus said. "He didn't know the limbic system hijacks the prefrontal cortex when the reward is immediate. Knowledge isn't enough when the biology is screaming."

  "So we're just biology?"

  "We're biology that can write contracts with itself," Marcus said. "Dave didn't write a tight enough contract. That's all."

  Elena took a sip of wine, the taste sharp and bitter. "I suppose you'd say my insistence on *akrasia* is just my 8:00 self trying to punish Dave's 8:20 self."

  Marcus smiled, just a little. "Hyperbolic discounting of moral judgment. You're punishing him now for a crime he committed twenty minutes ago because the anger is fresh. Give it an hour, you'll forgive him."

  Elena looked at him, then at Dave, who was finally grinding the cigarette out under his heel, looking exhausted.

  "Maybe," she said. "But I still think he could have done otherwise. Even with the biology. Even with the math."

  "Maybe," Marcus said, turning back to his drink. "But I wouldn't bet money on it. Not at these odds."
