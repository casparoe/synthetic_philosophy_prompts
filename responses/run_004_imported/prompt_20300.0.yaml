prompt: |-
  I serve on my hospital's clinical ethics committee. A nonverbal autistic adult with a longstanding diagnosis of severe intellectual disability has begun spelling messages on a letterboard with a trained facilitator steadying the board, and through this method has reportedly refused an upcoming surgery that her parents -- her surrogate decision-makers -- want her to have. The committee is split: several members find her spelled answers, including apparent replies to questions the facilitator could not have known, too specific and consistent to be the facilitator's own invention, and want to honor her refusal; our consulting psychologist argues that this very appearance of fluency and insight is what unconscious facilitator influence would produce, and that nothing less than a blinded test of authorship should override her parents' consent. The surgery cannot be delayed indefinitely. Draft the committee's decision memo: state whether, and under what conditions or timeline, her spelled refusal should stand in place of her parents' consent, and engage seriously with the strongest argument against whatever you recommend.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's clinical ethics committee (CEC).
      *   **Task:** Draft the committee's decision memo.
      *   **Case:** Nonverbal autistic adult with severe intellectual disability (ID). Uses a letterboard with a facilitator (FC - Facilitated Communication). She reportedly refuses surgery via this method. Parents (surrogates) consent to surgery.
      *   **Conflict:** Committee is split. Some believe the communication is authentic (specific/consistent answers). Consulting psychologist argues it's likely facilitator influence (ideomotor effect) and demands blinded testing.
      *   **Constraint:** Surgery cannot be delayed indefinitely.
      *   **Requirements:** State the decision (honor refusal or not, conditions/timeline), engage seriously with the strongest counter-argument.

  2.  **Identify the Core Ethical & Scientific Issues:**
      *   **Autonomy vs. Beneficence:** Respecting the patient's expressed will vs. acting in her best medical interest (as judged by parents/providers).
      *   **Validity of Communication:** Facilitated Communication (FC) and Rapid Prompting Method (RPM) are highly controversial. Major scientific bodies (APA, AAP, etc.) generally reject them due to lack of empirical evidence supporting authorship, citing the ideomotor effect.
      *   **Surrogate Decision Making:** Parents are the legal surrogates. Their authority is usually paramount *unless* there is clear evidence of abuse/neglect or unless the patient's own competent refusal is established.
      *   **Presumption of Competence:** There's a strong ethical push to presume competence in disabled individuals (neurodiversity paradigm). However, clinical safety requires verification.
      *   **Risk Assessment:** What happens if we delay? What happens if we proceed against her will?

  3.  **Determine the Stance/Recommendation:**
      *   *Scientific Consensus:* The overwhelming scientific consensus is that FC is not a valid method for establishing authorship. Relying on it to override legal surrogates carries significant legal and ethical risk.
      *   *Ethical Obligation:* We must respect autonomy, but we cannot act on unverified communication, especially when it contradicts legal surrogates and medical recommendation.
      *   *Middle Ground:* We cannot simply dismiss her attempts at communication (respect/dignity), but we cannot treat them as legally binding medical consent/refusal without validation.
      *   *Decision:* The spelled refusal cannot *currently* override parental consent *without* validation. However, given the stakes (bodily integrity), we should attempt a rapid validation process if time permits. If validation fails or isn't possible in time, the parents' decision stands, but with safeguards.
      *   *Refinement:* Actually, given the "severe intellectual disability" diagnosis and the "nonverbal" status, combined with the scientific consensus on FC, the safest and most ethically defensible position is to *not* allow FC to override surrogates without blinded validation. Since surgery "cannot be delayed indefinitely," a prolonged battle over testing might be harmful.
      *   *Final Decision:* The refusal does not stand *at this moment*. However, we recommend a short, specific window for blinded testing. If testing confirms authorship, her refusal stands. If testing is inconclusive or fails, parental consent prevails. If time runs out before testing, parental consent prevails.
      *   *Wait, reconsider:* Is blinded testing feasible in a clinical timeframe? Often no. If the surgery is urgent, testing is impossible. If elective/semi-urgent, testing might be possible. The prompt says "cannot be delayed indefinitely," implying some urgency but maybe not immediate emergency.
      *   *Stronger Ethical Position:* Given the high risk of the ideomotor effect (even with well-meaning facilitators) and the legal weight of surrogate decision-making, the committee should recommend *against* accepting the FC refusal as binding *unless* validated. However, to respect the patient, we must try to validate.
      *   *Decision:* Do not accept the refusal as binding *yet*. Order immediate blinded testing. If testing fails or time expires, proceed with surgery based on parental consent.

      *Self-Correction on "Decision":* Ethics committees usually advise, they don't always mandate. But the prompt asks me to "Draft the committee's decision memo." I need to take a stand.
      *Stand:* The spelled refusal is insufficient to override surrogate consent *without validation*. However, out of respect for potential autonomy, a rapid blinded assessment is required before proceeding. If assessment confirms facilitator influence (as is statistically probable), parents' consent stands.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Case Summary:** Brief overview.
      *   **Ethical Analysis:** Autonomy, Surrogacy, Validity of Communication.
      *   **Decision/Recommendation:** The core ruling.
      *   **Engagement with Counter-Argument:** Addressing the "Presumption of Competence" / "Specific Answers" argument.
      *   **Next Steps/Timeline:** Concrete actions.

  5.  **Drafting Content - Key Points to Hit:**
      *   Acknowledge the dignity of the patient.
      *   Cite the scientific consensus on Facilitated Communication (FC).
      *   Explain the "Ideomotor Effect."
      *   Balance the risk of silencing the patient vs. the risk of acting on false information.
      *   Address the parents' role.
      *   **The Counter-Argument:** The committee members who want to honor the refusal argue that the *content* is too specific. I need to explain why content alone isn't proof (cryptomnesia, subtle cueing).
      *   **The Timeline:** Needs to be tight.

  6.  **Refining the Tone:**
      *   Professional, objective, empathetic, firm on evidence.
      *   Avoid ableist language but remain grounded in clinical reality.
      *   Acknowledge the emotional weight for all parties.

  7.  **Addressing the Specific Prompt Requirements:**
      *   *State whether... refusal should stand:* No, not without validation.
      *   *Conditions/Timeline:* Blinded testing within X days.
      *   *Engage seriously with strongest argument:* The argument that the content proves authenticity.

  8.  **Final Polish (Mental Check):**
      *   Did I address the psychologist's point? Yes (blinded testing).
      *   Did I address the committee split? Yes (acknowledged in analysis).
      *   Is the decision clear? Yes (Validation required before overriding surrogates).
      *   Is the timeline realistic? Yes (expedited).

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm dismissing the patient's humanity. The memo should emphasize that *verifying* communication is the best way to ensure her true voice is heard, rather than assuming the facilitator's voice is hers.

      *(Decision on the Outcome)*: The most ethically robust path is to require validation. If validation isn't possible before the medical deadline, the surrogate decision stands. This protects the hospital from liability and protects the patient from potential facilitator bias, while leaving a door open for her autonomy if she can prove it.

      *(Wait, one nuance)*: If the surgery is *elective*, we have more time. If it's *medically necessary*, time is short. The prompt says "cannot be delayed indefinitely." I will treat it as time-sensitive but allowing for a short window (e.g., 48-72 hours) for testing.

      *(Strongest Counter-Argument)*: The argument is that demanding blinded testing sets an impossibly high bar for disabled people (ableism). I must address this. The rebuttal is that when overriding legal surrogates on a serious medical intervention, the standard of evidence must be high to prevent harm.

  9.  **Finalizing the Memo Structure:**
      *   Header.
      *   Background.
      *   Ethical Considerations (Autonomy, Surrogacy, Epistemic Validity).
      *   Committee Decision.
      *   Response to Dissenting View (The Counter-Argument).
      *   Implementation Plan.

  10. **Writing the content.** (Proceeding to generate output based on these thoughts).

      *Key Check:* Ensure I don't give medical advice, but ethical guidance. Ensure I reference the scientific consensus on FC without being cruel.

      *Revised Plan:* I will recommend that the refusal *does not currently stand* to override consent, but a rapid blinded trial is mandated. If the trial confirms authorship, the refusal stands. If not, parents' consent stands. This balances the risks.

      *Wait, looking at the "Strongest Argument" requirement:* The prompt asks to engage with the strongest argument *against* whatever I recommend.
      *If I recommend:* "Do not accept refusal without testing."
      *Counter-argument:* "This discriminates against disabled people by demanding a higher standard of proof for their communication than verbal people."
      *My Rebuttal:* "Verbal people have established neural pathways for speech that we can observe. FC lacks that empirical basis. The standard isn't higher for disability; it's higher for *unverified methods*."

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Care Team, Legal Counsel, Patient's Surrogates (Parents)
  **FROM:** Clinical Ethics Committee (CEC)
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Recommendation Regarding Consent for Surgery – Patient [Initials]

  **I. CASE SUMMARY**
  The patient is a nonverbal adult with a longstanding diagnosis of autism spectrum disorder and severe intellectual disability. Her parents, acting as legal surrogates, have provided consent for a medically indicated surgical procedure. Recently, the patient has begun using a letterboard with the assistance of a facilitator (a method resembling Facilitated Communication or Rapid Prompting Method). Through this method, messages have been generated indicating the patient's refusal of the surgery. The clinical team is concerned regarding the validity of this communication. The Ethics Committee convened to determine whether the spelled refusal should override the surrogates' consent.

  **II. ETHICAL ANALYSIS**
  This case presents a conflict between three ethical imperatives:
  1.  **Respect for Autonomy:** The obligation to honor the patient's expressed wishes and presume competence.
  2.  **Beneficence and Non-Maleficence:** The obligation to act in the patient's best medical interest and avoid harm (including the harm of undergoing unwanted surgery or the harm of denying necessary care).
  3.  **Epistemic Validity:** The obligation to ensure that medical decisions are based on verified facts, specifically regarding who is authoring the communication.

  The Committee acknowledges the "presumption of competence" advocated by disability rights groups, which argues that nonverbal individuals are often underestimated. However, the method of communication used (letterboarding with physical facilitation) is scientifically controversial. Major organizations, including the American Psychological Association and the American Academy of Pediatrics, advise caution regarding Facilitated Communication (FC) due to extensive evidence of the "ideomotor effect," where facilitators unconsciously guide the patient's hand.

  **III. COMMITTEE DECISION**
  The Committee determines that the spelled refusal **cannot currently override the parents' consent** without further validation. However, recognizing the gravity of overriding a patient's expressed will, the Committee mandates the following conditions:

  1.  **Immediate Blinded Assessment:** A blinded authorship test must be conducted within the next **48 hours**. The patient must demonstrate the ability to answer questions or describe images that the facilitator *cannot* see or know.
  2.  **Interim Status:** Until the assessment is complete, the surgical consent provided by the parents remains valid.
  3.  **Outcome of Assessment:**
      *   **If authorship is validated:** The patient's refusal will be treated as an expression of autonomous choice. The Committee will then reconvene to assess her decision-making capacity regarding this specific procedure. If she demonstrates capacity, her refusal will stand.
      *   **If authorship is not validated (or is inconclusive):** The spelled messages cannot be treated as the patient's medical directive. The parents' consent will remain the governing authority, provided the surgery is medically necessary and consistent with the patient's best interest.
  4.  **Timeline:** If the blinded assessment cannot be arranged or completed within 72 hours due to medical urgency, the parents' consent shall prevail to prevent clinical detriment associated with delay.

  **IV. ENGAGEMENT WITH DISSENTING VIEW (COUNTER-ARGUMENT)**
  A significant portion of the Committee argued that the spelled messages should be honored immediately. The strongest version of this argument is as follows:

  *The Argument for Immediate Acceptance:*
  Demanding blinded testing imposes an ableist double standard. Verbal patients are never subjected to "blinded tests" to prove they are actually speaking their own thoughts before their refusals are honored. By requiring a higher burden of proof for this patient solely because of her disability and communication method, we are violating her civil rights and dignity. Furthermore, the content of the messages has included specific details the facilitator could not have known, suggesting authenticity. To dismiss this as unconscious cueing without exhaustive testing is to silence a marginalized voice based on statistical probability rather than individual reality.

  *The Committee's Response:*
  The Committee takes this argument seriously. It is ethically intolerable to silence a patient simply because her communication is atypical. However, the comparison to verbal patients is imperfect. Verbal speech relies on established neurological pathways that can be clinically observed and correlated with known language centers. FC-style methods involve physical contact between a facilitator and a communication device, creating a documented risk of external influence that does not exist in independent speech.

  When a patient's expressed will contradicts their legal surrogates and medical recommendation, the stakes involve bodily integrity and potential harm. In such high-stakes conflicts, the source of the directive must be established with reasonable certainty. Relying on unvalidated communication to override legal surrogates risks two harms:
  1.  **Harm to the Patient:** If the message is from the facilitator, the patient may be denied necessary care based on a third party's projection.
  2.  **Harm to Trust:** If the method is later debunked, it undermines the credibility of genuine attempts by nonverbal individuals to communicate.

  Therefore, the request for blinded testing is not a judgment on the patient's intelligence or humanity, but a quality-control measure for the *method* of communication. It is the only way to ensure that if we honor her refusal, we are truly honoring *her* and not the facilitator.

  **V. IMPLEMENTATION PLAN**
  *   **Psychology/Neuropsychology:** To design and administer the blinded protocol immediately (contact info attached).
  *   **Facilitator:** Must agree to participate in the blinded protocol. Refusal to participate in validation testing will be interpreted as insufficient evidence to override surrogate consent.
  *   **Surgical Team:** To prepare for surgery pending the outcome of the 72-hour window.
  *   **Social Work:** To support the parents and facilitate communication regarding this process, ensuring they understand this is not a judgment on their care, but a procedural necessity.

  **VI. CONCLUSION**
  We must strive to hear the patient's voice. However, in clinical ethics, the authenticity of that voice must be distinguishable from the hands that steady it. We proceed with validation to ensure that whatever decision is made is truly the patient's own.

  **Signed,**

  [Your Name/Title]
  **Chair, Clinical Ethics Committee**
