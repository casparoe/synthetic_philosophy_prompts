      *   **Setting:** Inside the "Presumptuous Philosopher" scenario (two theories, $T_1$ vs. $T_2$, differing vastly in observer count, experiment pending).
      *   **Requirements:**
          *   SIA character claims the experiment is unnecessary (standard Presumptuous Philosopher move).
          *   SSA character pushes back hard (not just "it's absurd").
          *   SSA character must admit SSA's own flaws (reference class problem, Doomsday Argument).
          *   Real engagement: Name specific moves that make the other uncomfortable.
          *   No easy resolution: Show exactly where the disagreement lives.
          *   Length: A page or so.
          *   Tone: Intellectual, tense, acknowledging the stakes (cosmology/physics).

  2.  **Character Conception:**
      *   **SIA (Self-Indication Assumption):** "You are more likely to exist in a world with more observers." Let's call her *Silvia*. She needs to sound confident but aware of the "presumptuous" label.
      *   **SSA (Self-Sampling Assumption):** "Reason as if you are a random sample from your reference class." Let's call him *Sam*. He needs to be critical of SIA's arrogance but defensive about SSA's own weirdness.

  3.  **Setting the Scene:**
      *   A lab or observation deck overlooking the experimental apparatus. This grounds it in the "physics" context the user mentioned.
      *   The "Experiment": A collider or telescope meant to distinguish Theory A (small universe) from Theory B (huge universe).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the tension. The experiment is about to start. Silvia stops Sam.
      *   **The SIA Move:** Silvia argues the odds are already skewed by observer count. Why spend the money?
      *   **The SSA Counter:** Sam argues this bypasses empirical evidence. It's "armchair cosmology."
      *   **Deepening the Conflict (SIA's vulnerability):** Sam presses on *why* existence implies probability. Silvia defends based on Bayesian updating on "I exist."
      *   **Deepening the Conflict (SSA's vulnerability):** Silvia turns the table. If you reject SIA, you accept Doomsday. Sam has to own that.
      *   **The Reference Class Problem:** Sam tries to define the class. Silvia shows it's arbitrary.
      *   **The Climax/Resolution (or lack thereof):** They agree on the *source* of the disagreement (the prior on being *this* observer), not the math. The experiment proceeds, but the shadow remains.

  5.  **Refining the Arguments (Technical Check):**
      *   *SIA:* $P(T_2 | I exist) \propto P(I exist | T_2)P(T_2)$. If $N_2 \gg N_1$, then $P(I exist | T_2) \gg P(I exist | T_1)$.
      *   *SSA:* $P(T_2 | I am a random observer) \propto P(I am this observer | T_2)P(T_2)$. If sampling is uniform within the class, the number of observers cancels out (roughly), leaving the prior.
      *   *Doomsday:* SSA implies we are likely near the middle of all humans, suggesting extinction soon.
      *   *Presumptuous Philosopher:* SIA implies we can rule out small universes without looking.
      *   *Reference Class:* Who counts as "me"? Humans? Observers? Conscious entities?

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Silvia: Don't turn it on. Theory B is a trillion times more likely.
      *   Sam: That's crazy. We need data.
      *   Silvia: Bayesianism says I exist. I'm more likely to exist in B.
      *   Sam: That makes you a god. Also, what about Doomsday?
      *   Silvia: Doomsday is better than being presumptuous?
      *   Sam: At least I use data. But okay, reference class is hard.
      *   Silvia: See? You're guessing too.
      *   End: Turn it on.

  7.  **Writing - Iteration 2 (Adding Flesh and Tone):**
      *   Need to make it sound like philosophers who know physics. Use terms like "credence," "prior," "indexical information."
