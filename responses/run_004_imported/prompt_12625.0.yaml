          *   *Locke:* Focus on *Association*. The "Blank Slate." Visual ideas and tactile ideas are separate coins. You need experience to spend them together.
          *   *Leibniz:* Focus on *Reason/Geometry*. The "Intellectual Structure." The mind grasps the *concept* of the cube, regardless of the sensory input. The senses are just windows; the mind sees the truth.
          *   *Berkeley:* Focus on *Heterogeneity*. This is the crucial distinction the user asked about. It's not just "unlinked," it's "incommensurable." Vision is a *language* of light that predicts touch, not a picture of the world.
          *   *Writer's Take:* How does this look in Ana's head? Locke = Confusion. Leibniz = Sudden epiphany of unity. Berkeley = Learning a new language where words don't match things.
      *   **Section 2: The Empirical Evidence (Project Prakash):**
