          *   *KS (Individual Monotonicity):* Why IM? If the set expands in my favor (my ideal point goes up), my payoff shouldn't drop. Normatively: Bargaining is about *claims*. My "ideal point" represents my maximum potential claim. If my potential claim grows relative to yours, my share should reflect that. It's about proportional satisfaction of claims.
