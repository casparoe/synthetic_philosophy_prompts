          *   Philosophical bite: It forces a choice between viewing bargaining as a *selection problem* (Nash: pick the best point based on intrinsic properties) vs. a *claims problem* (KS: divide based on relative maximum potential). You can't have a solution that ignores irrelevant alternatives *and* respects changes in maximum potential claims simultaneously.

