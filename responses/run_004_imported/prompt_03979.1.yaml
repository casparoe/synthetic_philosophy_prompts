answer: |-
  This is one of the densest and most technically demanding passages in the *Treatise*. You are right to feel that the "headline" view (promising is artificial) is easier to grasp than the metaphysical machinery Hume deploys to prove that a "natural" act of promising is impossible.

  Hume is performing a *reductio ad absurdum*. He is not arguing that we *do* will an obligation; he is arguing that **if** promising were a natural act of the will (as common sense or rationalist morality might suggest), it **would have to be** an act of willing an obligation. He then argues that "willing an obligation" is metaphysically impossible.

  Here is a reconstruction of the reasoning, broken down into your three requests.

  ---

  ### 1. The Elimination Argument (Main Text, Paragraph 1)

  Hume wants to isolate exactly what mental act could possibly constitute a promise. He assumes, for the sake of argument, that there *is* a specific mental act accompanying the words "I promise." He then tests the usual candidates for mental acts and eliminates them one by one.

  **The Goal:** Show that the only remaining candidate is "willing the obligation," which sets up the *reductio* for the next paragraph.

  *   **Candidate 1: A Resolution.**
      *   *Hume's Objection:* A resolution is just an intention. I can resolve to drink coffee tomorrow and change my mind tonight without being morally blameworthy. A promise, however, creates a *bond* I cannot break without fault.
      *   *Step:* Resolution $\neq$ Obligation. Therefore, the act of promising is not a resolution.
  *   **Candidate 2: A Desire.**
      *   *Hume's Objection:* We often promise things we do not desire. I may promise to pay a debt I resent, or to meet someone I currently wish to avoid. The obligation holds even if my desire is contrary to the performance.
      *   *Step:* Desire is contingent; Obligation is binding regardless of desire. Therefore, the act of promising is not a desire.
  *   **Candidate 3: Willing the Action.**
      *   *Hume's Objection:* This is a metaphysical point about the nature of the will. The will can only influence *present* actions (e.g., I will my hand to move *now*). A promise always regards a *future* action. I cannot "will" a future action into existence in the present; I can only will the *means* to it or resolve to do it.
      *   *Step:* The will acts on the present; promises regard the future. Therefore, the act of promising is not the willing of the promised action.
  *   **The Forced Conclusion:**
      *   If the mental act is not resolving, desiring, or willing the action, what is left? The only thing distinguishing a promise from a prediction or a resolution is the **creation of a bond**.
      *   *Result:* Therefore, if there is a mental act, it must be **the willing of the obligation itself.**

  **Crucial Note:** Hume does not endorse this conclusion. He immediately follows this by asking if there is a "manifest absurdity" in supposing this act. The elimination argument is a trap: it forces the opponent to admit that promising requires "willing an obligation," which Hume then destroys in Paragraph 2 and the Footnote.

  ---

  ### 2. The Regress Argument (Footnote)

  This is the hardest part. Hume is addressing a Rationalist opponent (like Samuel Clarke) who believes morality consists in eternal "relations of fitness" discoverable by reason, not sentiments.

  **The Rationalist's Position:** Morality = Relations between objects. To create a new moral obligation, you must create a new relation.
  **Hume's Trap:** A promise claims to create a new moral obligation *by the mere act of will*, without changing any physical objects.

  Here is the step-by-step reconstruction of the regress:

  1.  **Premise 1 (Rationalist Definition):** A new moral obligation is identical to a **new relation of objects**. (e.g., "Fit" or "Due").
  2.  **Premise 2 (The Nature of Will):** The will cannot create relations directly. It can only create relations by changing the **objects** themselves (e.g., I can change the relation of "distance" between me and the door by walking).
  3.  **Premise 3 (The Nature of Promising):** A promise creates an obligation *without* changing any external objects. It is a "pure effect of the will."
  4.  **The Inference:** If the will creates a new relation (obligation) without changing external objects, the only "object" it is changing is **itself** (the volition).
  5.  **The Circle:**
      *   To will a new obligation is to will a new relation.
      *   But this new relation is constituted by the fact that **this volition exists**. (The obligation is "I am bound *because* I willed this").
      *   Therefore, the object of the volition is **the volition itself** (specifically, the volition's own binding power).
  6.  **The Regress:**
      *   **Volition 1 (V1)** aims to create **Obligation 1 (O1)**.
      *   But **O1** is defined as "The relation created by **V1**."
      *   So, **V1** aims to create "The relation created by **V1**."
      *   For **V1** to have this object, **V1** must already exist (to be the thing creating the relation).
      *   But **V1** is in the process of coming into existence. It cannot presuppose its own existence to define its object.
      *   So, to define the object of **V1**, we need a prior volition to establish the relation. Let's call it **V2**.
      *   But **V2** is also a promise/volition of obligation. So **V2** needs **V3** to establish *its* binding power.
      *   *Result:* "The will... must return upon itself in infinitum."

  **Addressing your specific confusion:** *Why can't the rationalist say they are willing the future action that instantiates the relation?*

  Hume anticipates this. If you say, "I am willing the future action (paying the money)," you have fallen back into **Candidate 3** of the elimination argument (Willing the Action). Hume already ruled that out because the will cannot act on the future.

  Furthermore, for the Rationalist, the *obligation* arises at the moment of the promise, not the moment of the action. The "relation of fitness" is created *now*. If the relation is created *now* by the will, the will must grasp that relation *now*. But that relation is "being bound by this will." So the will is trying to grasp its own binding power before it has it.

  Think of it like **bootstrapping**: You are trying to lift yourself off the ground by pulling on your own shoelaces. To pull the laces (create the obligation), you need to be off the ground (have the authority/binding power). But you only get off the ground by pulling the laces. The Rationalist claims the promise creates the bond *ex nihilo* by reason. Hume says reason cannot create relations out of thin air; it requires existing objects. Since the only object is the will, the will tries to create the conditions of its own efficacy, which is circular.

  ---

  ### 3. Evaluative Question: Strength and Independence

  **Does the regress depend on an assumption a rationalist could reject?**
  Yes. It depends entirely on the Rationalist definition of morality as **"relations of objects."**
  *   A Sentimentalist (like Hume) thinks morality is a feeling of approval/disapproval.
  *   A Rationalist (like Clarke) thinks morality is a logical relation (like math).

  Hume explicitly acknowledges this in the first sentence of the footnote: *"Were morality discoverable by reason... 'twou'd be still more evident, that promises cou'd make no alteration upon it."*

  **Is this argument weaker than the sentiment-based argument?**
  In the context of Hume's overall system, the **Sentiment Argument (Main Text, Para 2)** is stronger.
  *   **Sentiment Argument:** "We cannot change our sentiments by fiat." This relies on Hume's positive psychology, which he has spent Book 1 and 2 establishing. It explains *why* we need conventions (to align sentiments with interests).
  *   **Regress Argument:** This is an *ad hominem* (in the philosophical sense) against the Rationalist. It says, "Even if I grant your false theory of morality, you *still* can't explain promising."

  **Is it doing independent philosophical work?**
  Yes, two specific things:
  1.  **Blocking the Escape Route:** Without the footnote, a Rationalist could say: "Hume, you say we can't change sentiments. Fine. But morality isn't sentiments; it's Reason. Reason can grasp the relation 'promising creates obligation' without needing a sentiment." The footnote blocks this by arguing that Reason cannot create relations by fiat any more than Sentiment can. It shows the problem is metaphysical, not just psychological.
  2.  **Highlighting the "Artificial" Nature:** By showing that a "natural" act of will cannot create an obligation (either psychologically or rationally), Hume forces us to look elsewhere for the source of obligation. If it's not in the will, and not in the sentiment, it must be in the **convention** (the social practice). The failure of the "natural" argument is what necessitates the "artificial" solution.

  **Summary for your seminar:**
  You can frame the footnote not as Hume's positive view, but as a *dialectical trap*. He is showing that **Naturalism about Promising** fails on *both* major meta-ethical frameworks of his time:
  1.  **Sentimentalism:** We can't will new sentiments (Main Text).
  2.  **Rationalism:** We can't will new relations (Footnote).

  Since both fail, the obligation of promises cannot be "natural." It must be derived from the artificial machinery of social convention and interest, which is Hume's ultimate goal. The footnote ensures that no intellectualist opponent can claim that "Reason alone" saves the natural obligation of promises.
