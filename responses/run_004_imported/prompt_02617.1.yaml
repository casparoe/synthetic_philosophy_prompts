      *   **Format:** A dialogue between two characters (a Virtue Ethicist and a Situationist).
      *   **Tone:** Intellectual, rigorous, respectful but challenging. Neither side should be a pushover.
      *   **Key Content:** Must address specific studies (Milgram, Derren Brown's "The Push", Good Samaritan study, phone booth dime study). Must address the core philosophical claim (stability of character traits vs. situational determinants).
      *   **Constraint:** No easy dodges (e.g., "most people aren't virtuous"). The Virtue Ethicist needs strong counter-arguments. No declared winner.

  2.  **Character Conception:**
      *   **The Situationist (let's call her "Elena"):** Grounded in empirical data, skeptical of global traits, focuses on the fragility of morality, emphasizes the power of context.
      *   **The Virtue Ethicist (let's call him "Marcus"):** Grounded in philosophical tradition, nuanced understanding of *hexis* (disposition), distinguishes between ideal virtue and ordinary behavior, emphasizes development and integration.

  3.  **Key Arguments to Include:**
      *   *Situationist:* The Good Samaritan study (hurry > personality), Milgram (authority > conscience), Phone Booth (dime > helpfulness). The argument that "global traits" don't exist because behavior isn't cross-situationally consistent.
      *   *Virtue Ethicist:* Virtue is rare (Aristotle admitted this). Traits are probabilistic, not deterministic. The "fragmentation" of situations in experiments vs. real life. The role of practical wisdom (*phronesis*) in recognizing moral salience.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A coffee shop or office. Start with the catalyst (Derren Brown/Milgram).
      *   **Round 1: The Empirical Assault.** Elena brings out the heavy hitters (Good Samaritan, Milgram). She argues that character is an illusion.
      *   **Round 2: The "Rare Virtue" Defense.** Marcus counters that experiments test ordinary people, not the *phronimos* (virtuous person). Aristotle never claimed everyone is virtuous.
      *   **Round 3: The "Fragmentation" Critique.** Elena pushes back. If traits don't show up in *these* situations, when do they? The "dime" study is trivial.
      *   **Round 4: Salience and Perception.** Marcus argues that virtue isn't just acting; it's *seeing* the situation correctly. The hurry condition blinds moral perception.
      *   **Round 5: Integration and Stability.** Elena argues that if context swamps character, "character" is useless. Marcus argues for *development* over time, not just snapshot behavior.
      *   **Closing:** Acknowledge the tension. A synthesis or agreed disagreement.

  5.  **Refining the Arguments (Self-Correction during drafting):**
