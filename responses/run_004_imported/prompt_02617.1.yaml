      *   *Philosophical Depth:* Bring in *hexis*, *phronesis*, global traits, cross-situational consistency.

      *(Self-Correction during drafting the middle section)*: I need to make sure Marcus doesn't just dismiss the studies. He needs to explain *why* the studies don't disprove virtue ethics. The key is the distinction between "continuous personality traits" (psychology) and "cultivated dispositions" (ethics). Also, the idea that virtues can conflict (honesty vs. kindness) which explains inconsistency.

      *(Refining the Ending)*: Don't resolve it. End on the implication for how we live. Do we fix the person or the room?

  7.  **Final Review:** Check against constraints.
