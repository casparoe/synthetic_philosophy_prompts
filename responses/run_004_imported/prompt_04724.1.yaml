  2.  **Deconstruct the Ergodicity Economics Argument (Ole Peters et al.):**
      *   *Core Premise:* Non-ergodic processes (like geometric growth) have different time averages and ensemble averages.
      *   *Critique of EV:* Standard economics uses ensemble averages (expected value across parallel universes). Real life happens in one universe over time (time average).
      *   *Conclusion:* Maximizing ensemble average EV leads to ruin in non-ergodic processes (like the St. Petersburg paradox or leveraged investing). Maximizing the time average growth rate (Kelly) is the "physically correct" way to behave.
