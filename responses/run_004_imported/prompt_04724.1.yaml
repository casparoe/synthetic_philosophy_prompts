answer: |-
  Your intuition is spot on. There *is* a bait and switch here, though it's a sophisticated one. Ole Peters and the ergodicity economics crowd are mathematically correct about the behavior of non-ergodic processes (like compounding wealth), but they are philosophically overreaching when they declare Expected Value (EV) maximization a "mathematical error."

  To defend EV maximization, we need to separate **mathematics** (what the numbers do) from **normative ethics** (what you should care about).

  Here is the strongest case that EV maximization is defensible, and that the ergodicity critique conflates a specific utility function with objective reality.

  ### 1. The "Error" is actually a Utility Function choice
  The strongest defense of EV is that standard economics already solved this problem 300 years ago with **Expected Utility Theory**, not Expected Wealth Theory.

  When people say "maximize EV," they usually mean "maximize the expected value of my *wealth*." This implies a **linear utility function** ($U(w) = w$). If you have linear utility, you value the 10th million dollars exactly as much as the first thousand.
  *   **If $U(w) = w$:** Maximizing EV is mathematically correct.
  *   **If $U(w) = \ln(w)$:** Maximizing Expected Utility is mathematically identical to the Kelly Criterion (maximizing geometric growth).

  Peters' critique is that using linear utility for compounding processes leads to ruin. That is true. But claiming EV is "wrong" is like claiming a hammer is "wrong" for driving screws. If your goal is to maximize the *arithmetic mean* of your final wealth distribution (perhaps because you plan to sell your portfolio to a diversified conglomerate at the end), EV is the correct tool.

  The "mathematical mistake" isn't in the EV calculation; it's in the unspoken assumption that humans should have linear utility over wealth. Economics already allows for risk aversion (concave utility). Peters is essentially rediscovering Log Utility but framing it as a law of physics rather than a preference.

  ### 2. Ensemble Averages *do* exist in the real world
  The ergodicity argument hinges on the idea that "you only live once," so ensemble averages (parallel universes) are irrelevant. This is true for an isolated individual with no ability to transfer risk. However, it is false for many economic actors:

  *   **Institutions & Funds:** A hedge fund or insurance company does not experience wealth as a single trajectory. They pool risk across thousands of independent bets. For them, the Law of Large Numbers turns the time average *into* the ensemble average. If you are an insurer writing 10,000 policies, the ensemble average is the physically correct metric, not the time average of a single policy.
  *   **Transferability:** If you have a positive EV bet but don't have the bankroll to withstand the volatility, you can often sell that bet to someone who does (e.g., securitization, selling a startup, backing a poker player). If the bet is transferable, its value is determined by its ensemble average (EV), not its time-average growth for you specifically.

  By declaring EV "wrong," ergodicity economics ignores the massive sector of the economy dedicated to **risk pooling**, where ensemble averages are the reality.

  ### 3. Finite Horizons vs. Asymptotics
  Kelly maximizes the growth rate as time approaches infinity ($t \to \infty$). But humans have finite horizons.

  In finite time, maximizing EV can actually produce a higher *median* outcome than Kelly depending on the distribution, or simply a higher arithmetic mean. If you have a fixed retirement date 20 years from now, the "optimal" strategy depends on what you want at that specific timestamp.
  *   If you want to ensure you don't go broke: Kelly.
  *   If you want to maximize the average amount of money you have at retirement (accepting a higher chance of zero): Full EV maximization (which often implies leveraging up way past Kelly).

  Neither is a "math error." They are optimizations for different objective functions. If I tell you, "I want to maximize the average outcome of this experiment," and you tell me, "No, you should maximize the median outcome," you aren't correcting my math; you're correcting my goals.

  ### 4. The "Bait and Switch": Normative vs. Positive
  Here is the specific feeling of "bait and switch" you are detecting.

  *   **Positive Claim (True):** "For a compounding process, the time-average growth rate differs from the ensemble-average expected value."
  *   **Normative Claim (Debatable):** "Therefore, rational agents *ought* to maximize time-average growth."

  Peters frames the normative claim as if it were a positive physical law. He defines "rationality" as "survival and growth over time." But rationality is generally defined as **acting consistently with one's preferences.**

  If my preference is: *"I want a 95% chance of going broke, but a 5% chance of owning the entire world's GDP,"* then EV maximization is the rational strategy for me. It honors my preference. Kelly forbids this. By saying EV is "wrong," Peters is saying your preferences are invalid. That is not mathematics; that is paternalism disguised as physics.

  ### 5. EV is the Price of Risk
  Finally, EV maximization is the foundation of pricing. If EV were "wrong" for compounding bets, then financial markets would not work.

  The price of a stock or an option is essentially the discounted expected value of its future cash flows (under a risk-neutral measure). If traders decided EV was a "mathematical error," liquidity would vanish. The market price reflects the ensemble average because the market *is* an ensemble of many participants.

  If you are a price-taker, the EV tells you if a bet is +EV relative to the market. Whether you *take* the bet (and how much) depends on your risk tolerance (Kelly/Utility), but the EV calculation itself remains the objective benchmark of value. Discarding EV discards the concept of "fair value."

  ### Summary: Why you feel the "Bait and Switch"
  You feel it because Peters is solving a **psychological/philosophical problem** (why do people avoid ruin?) and presenting it as a **mathematical correction**.

  *   **The Math:** He is right that time averages $\neq$ ensemble averages in non-ergodic systems.
  *   **The Economics:** He is wrong that this makes EV maximization an "error." EV maximization is the correct strategy for linear utility, for pooled risk, for finite horizons with specific goals, and for pricing assets.

  The most defensible position is this: **EV tells you the size of the pie; Utility (Kelly) tells you how much slice you can eat without starving.** You need both. Calling EV "wrong" is like saying "Measuring distance in miles is wrong because some people prefer kilometers." It confuses the map with the terrain, and the metric with the goal.
