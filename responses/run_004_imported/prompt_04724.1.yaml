      *   *Finite Horizons:* EV is perfectly valid for one-off bets or finite sequences where ruin isn't certain.
      *   *The "Mathematical Error" Claim:* Is it actually an error? No, it's a category error. EV calculates the mean of the distribution. If you care about the mean, EV is correct. If you care about the median or geometric mean, Kelly is correct. Neither is "wrong" math; they optimize different metrics.
      *   *Diversification/Pooling:* If you can pool risk (insurance, large funds), ensemble averages become relevant again.
