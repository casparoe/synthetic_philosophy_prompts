      *   **The "Mathematical Mistake" Charge:** Argue that this is a philosophical/category error, not a math error. Math doesn't tell you what to optimize.
      *   **Context Matters (Ensembles exist):** In many real-world scenarios (institutional investing, insurance), ensemble averages *do* apply because risk is pooled.
      *   **Finite Time Horizons:** Ergodicity is an asymptotic property ($t \to \infty$). In finite time, EV can outperform Kelly depending on the distribution.
      *   **The "Bait and Switch" Identified:** Explicitly name what the user is feeling. It's the move from "is" to "ought."

