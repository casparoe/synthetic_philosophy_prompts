answer: |-
  The book was dry, dense, and smelled of library glue, but the sentence on page twenty had stopped Elias's breathing for a full minute.

  *Actual is an indexical.*

  He sat in his kitchen at 3:00 AM, the hum of the refrigerator the only sound in the apartment. He had picked up David Lewis's *On the Plurality of Worlds* on a dare from a grad student friend who claimed it was "metaphysical horror disguised as logic." Elias had expected quantum mechanics. He expected the usual sci-fi comfort food: branching timelines, splitting atoms, the idea that every time he flipped a coin, the universe bifurcated, and a version of him caught the tails while this version caught the heads.

  That was physics. That was clean. That implied a connection, a shared origin, a family tree of realities.

  Lewis wasn't talking about physics. He was talking about logic. And he was saying something much colder.

  Elias looked at the cold coffee in his mug. In this world, he had let it go cold. In another world—a world just as real, just as concrete, made of the same stuff as this table and this mug—he had drunk it while it was hot. In that world, he had taken the job in Chicago. In that world, he had married Sarah. In that world, he was a painter. In that world, he had died in a car crash at age six.

  None of these worlds were created by his choices. They didn't branch off from this one. They had always been there, sitting alongside this one like books on an infinite shelf. They were causally isolated. No wormhole, no quantum tunnel, no magic mirror. They were not *elsewhere* in space; they were not *elsewhere* in time. They were just *elsewhere*.

  "Actual," Elias whispered to the empty room.

  He tested the word. It felt hollow. Before tonight, "actual" meant *real*. It meant the one true stage where the play was happening. But Lewis was saying "actual" was just like "here." If you stood in Chicago, Chicago was "here." If you stood in New York, New York was "here." Neither place was the *true* center of the map.

  So, this world wasn't the main reality. It was just the one he was standing in.

  He stood up and walked to the window. The city lights blurred in the rain. Somewhere out there, in the modal sense, there was a world where the rain was snow. There was a world where gravity was slightly weaker. There was a world where dragons existed, biologically coherent and scaly, hunting in the forests of a continent that didn't exist in this geometry.

  The loneliness hit him then, a physical weight in his chest.

  In the quantum multiverse stories, the other versions of you were *you*. They were your siblings, split from the same stem. You could feel a kinship. But Lewis's logic demanded Counterpart Theory. The man in the Chicago world wasn't Elias. He was a distinct individual who happened to resemble Elias in almost every way. He had Elias's memories up to the point of divergence, but he was a stranger.

  If Elias died tonight, he didn't wake up in the Chicago world. He didn't slide into the skin of the painter. He just ceased. The other men continued, living out lives that were vivid and real to them, but Elias would not experience a second of it. There was no trans-world identity. There was only this specific consciousness, anchored to this specific coordinate in logical space.

  He thought about the regret that had kept him up so many nights. The fight with his brother. The career path abandoned. The fear that he had wasted his potential.

  Usually, that fear was nagging. Tonight, it was absurd.

  He hadn't wasted the potential. In the grand sum of reality, every potential was realized. The sum total of "Elias-ness" was infinite. There was no scarcity of existence. But the cost was that *this* Elias was trapped. He was locked into the trajectory of this specific world-line. He couldn't nudge the others. He couldn't learn from the version of him who succeeded. He couldn't warn the version of him who failed.

  They were all shouting in separate soundproof rooms, and every single one of them thought they were the only one shouting.

  Elias went to the sink and poured the cold coffee down the drain. He watched the liquid swirl away. In a billion other worlds, the coffee was still in the mug. In a billion others, the mug was broken. In a billion others, he didn't have a sink.

  He dried his hands and looked at his reflection in the dark window.

  "Who are you?" he asked the glass.

  Just the one here. Just the indexical one.

  It should have been liberating. If every choice was made, why worry? But it wasn't liberating. It was isolating. It stripped his choices of their creative power. He wasn't writing the story of reality; he was just reading the page he was born on. The story was already written in every possible variation. He was just the ink on this specific sheet.

  He thought about his brother. They had argued about this weeks ago. His brother wanted the quantum version because it offered immortality. *Somewhere, I keep choosing to live.*

  Lewis denied him that. In the world where Elias choked on a piece of steak next year, Elias was dead. Full stop. The counterpart in the next world over, who looked just like him and had the same parents, would keep eating. But *this* Elias would be gone. The continuity of consciousness was a local phenomenon.

  Elias walked back to the table and closed the book. The cover was stark, academic. It didn't look like a key to the cosmos.

  He picked up his phone. He had been meaning to call his brother for days to apologize for the argument. In some worlds, he had already called. In some worlds, they had screamed until the phones overheated. In some worlds, they had never been born.

  He dialed the number. It rang.

  If he hung up, a counterpart would let it ring. If he spoke, a counterpart would stay silent. The action didn't change the total amount of reality in the universe. It only changed which reality *he* inhabited.

  That was the only thing that mattered. The "Here."

  "Hello?" His brother's voice, groggy, annoyed.

  "Hey," Elias said. His voice sounded thin to his own ears, fragile against the backdrop of the infinite plurality he now knew surrounded him. "It's me. I know it's late."

  "Eli? What's wrong?"

  "Nothing. I was just... thinking about what you said. About the other worlds."

  There was a pause. "The quantum stuff? Look, I was tired. I don't know if I believe it."

  "It's not the quantum stuff," Elias said. He looked around the kitchen. The fridge hummed. The rain hit the glass. It was so solid. It was so heavy. "It's weirder. I think... I think they're all real. All of them. Not just the ones where we make different choices. All of them. The impossible ones, too."

  "Okay," his brother said slowly. "So? If they're real, that's cool, right? Means I'm rich somewhere."

  "Yeah. You're rich somewhere. And I'm dead somewhere. And we're happy somewhere." Elias gripped the edge of the table. He felt a sudden, fierce love for this specific, mundane kitchen. Because it was the only one he could touch. The others were real, but they were not *here*. They were ghosts made of matter, separated by logic instead of distance. "But we can't go there. We're stuck here."

  "Stuck?"

  "Actual is just where we stand, Mark. That's all it means. Just where we stand."

  His brother laughed, a soft, sleepy sound. "You're talking like a philosopher. Go to bed, Eli."

  "Yeah. I will."

  "Love you."

  "Love you too."

  Elias hung up.

  He sat in the silence again. The infinite library of worlds stretched out around him, vast and silent and complete. He would never visit them. They would never visit him. He was a single point of light in a galaxy of other points, none of which could ever touch.

  He opened the book again, not to read, but to feel the weight of it. It was heavy. It was actual.

  He realized then that the horror wasn't that everything was possible. The horror was that he could only be one thing. The comfort, he decided, closing his eyes and listening to the rain that was falling only in this world, was that he got to be this one at all.

  "Here," he said softly.

  And for now, that had to be enough.
