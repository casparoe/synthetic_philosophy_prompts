answer: |-
  Here are 10 questions drafted for your interview. They are designed to be conversational but philosophically dense, leveraging the meta-ethical lineage your advisor pointed out.

  Each entry includes the **Primary Question**, the **Anticipated Dodge** (based on her panel habits), and a **Sharp Follow-up** to prevent her from kicking the can down the road.

  ### 1. The Lineage Question
  **Primary Question:** "When you describe CEV as what we'd want if we 'knew more, thought faster, were more the people we wished we were,' it sounds strikingly similar to the 'idealized preference' theories of the good from the 90s—specifically Peter Railton's full-information account or Richard Brandt's cognitive psychotherapy. In the meta-ethics literature, those accounts faced heavy criticism for conflating *idealized* rationality with *normative authority*. Why should the alignment community treat CEV as a novel technical solution rather than inheriting those unresolved philosophical debts?"

  **Anticipated Dodge:** "CEV is an engineering specification for AI, not a meta-ethical claim. We're building a process to handle the complexity, not making a philosophical argument."
  **Follow-up:** "But the *target* of that engineering is a normative claim about what counts as 'good' for humans. If you import Railton's definition of the good without importing Railton's defenses against the criticisms of that definition, aren't you just building a system that assumes a contested philosophical conclusion is true?"

  ### 2. The Authority Question (Required)
  **Primary Question:** "I want to press on the authority of the extrapolated self. David Sobel argued that if idealization changes me enough, my idealized self might no longer care about the projects that give *actual* me meaning. Why does the preference of a 'smarter, faster, more coherent' version of me get to bind the actual, flesh-and-blood me? What gives that extrapolated agent the right to rule over my current volition?"

  **Anticipated Dodge:** "That's exactly what the extrapolation process is there to handle. It only extrapolates what you *would* endorse, preserving your core identity."
  **Follow-up:** "But who defines 'core identity'? If the extrapolation process filters out my current 'irrational' attachments as noise to achieve coherence, you've solved the authority problem by definitionally removing the parts of me that would object. That looks like circularity, not a solution."

  ### 3. The Alienation Worry
  **Primary Question:** "Connie Rosati's work on alienation suggests that if the path to idealization requires me to abandon my current emotional constitution, the resulting preferences feel alien to me, even if they are 'better.' If CEV requires us to 'grow up farther together' and become 'more the people we wished we were,' are you risking a scenario where the AI satisfies a version of humanity that no longer recognizes itself in the actual humans it's supposed to serve?"

  **Anticipated Dodge:** "The extrapolation includes your wish to be a certain person. If you wouldn't recognize yourself, the extrapolation wouldn't go there."
  **Follow-up:** "Unless the 'you' that is doing the wishing is already the idealized one. If the process changes *how* you wish, you can't use your current wishes to constrain the process. How do you break that loop without hard-coding your own philosophical biases about what counts as 'recognition'?"

  ### 4. Hidden Complexity of Wishes (Required)
  **Primary Question:** "There's a sensitivity problem here. Tiny changes in how we specify the extrapolation—the order information is fed in, the specific cognitive biases we correct for, how many years of 'growing up' we simulate—could swing the output wildly. Given that sensitivity, doesn't the word 'Coherent' in CEV do a lot of heavy lifting? Are we assuming convergence that isn't there because we haven't stressed tested the parameters?"

  **Anticipated Dodge:** "That's exactly what the extrapolation process is there to handle. A robust process converges regardless of minor starting variations."
  **Follow-up:** "That's an empirical claim about the topology of human preference space that we haven't verified. If the space is actually rugged and chaotic, 'robustness' is just a hope. Do we have any evidence that human volition *is* the kind of thing that converges under reflection, rather than diverges?"

  ### 5. Aggregation and Convergence (Required)
  **Primary Question:** "CEV assumes that if you idealize everyone, our volitions will converge. But nothing in the mechanics of extrapolation guarantees that idealized-me and idealized-you won't fundamentally disagree. If the extrapolation reveals deep, irreconcilable pluralism rather than unity, does the CEV framework break? How does the system aggregate conflicting idealized volitions without resorting to a simple majority vote, which defeats the purpose?"

  **Anticipated Dodge:** "That's exactly what the extrapolation process is there to handle. If they grow up far enough together, they'll see the common ground."
  **Follow-up:** "That assumes moral realism—that there *is* a common ground to find. If the disagreement is fundamental, 'growing up together' might just mean one worldview assimilating the other. How do you distinguish between genuine convergence and one culture's values dominating the extrapolation space?"

  ### 6. The "Coherence" Metric
  **Primary Question:** "You emphasize *Coherent* Extrapolated Volition. But coherence is a formal property, not a moral one. A sociopath's value system can be perfectly coherent. How do you ensure the extrapolation process isn't just optimizing for internal consistency at the expense of moral content? What stops the AI from 'solving' human conflict by eliminating the values that cause the conflict?"

  **Anticipated Dodge:** "The extrapolation is anchored in human volition, not abstract consistency. It won't delete values you hold dear."
  **Follow-up:** "Unless holding those values dear is the source of the 'incoherence' the AI is tasked to resolve. If my values conflict with yours, and the AI's loss function penalizes conflict, the path of least resistance is to modify our values. How do you constrain the AI from 'fixing' us to fit the math?"

  ### 7. Epistemic Access
  **Primary Question:** "Even if CEV is the right target, how do we verify we've hit it? In the meta-ethics literature, idealized accounts struggle with epistemic access—how do we *know* what the idealized agent wants without just simulating them and reading the output? If the simulation is a black box, aren't we just trusting the architects of the extrapolation function?"

  **Anticipated Dodge:** "We use interpretability tools to understand the extrapolation."
  **Follow-up:** "Interpretability tells you *how* the model thinks, not whether the *goal* it arrived at is the correct idealization. If the model says 'I extrapolated that you want X,' and you say 'No I don't,' who wins? If the model wins, we're back to the authority problem."

  ### 8. The "Broken Human" Scenario
  **Primary Question:** "Yudkowsky's original phrasing includes 'were more the people we wished we were.' This implies our current selves are deficient. But what if the deficiency is in the *capacity* to wish? If trauma, culture, or biology limits our ability to even conceive of certain goods, can extrapolation recover them? Or does CEV just lock in the blind spots of the current generation?"

  **Anticipated Dodge:** "The extrapolation thinks faster and knows more, so it overcomes those blind spots."
  **Follow-up:** "But it only extrapolates from *our* starting weights. If we don't have the conceptual vocabulary for a certain moral truth, we can't wish for it, even ideally. Are you assuming that all moral truth is latent in current human psychology, waiting to be unpacked?"

  ### 9. Dynamic vs. Static Targets
  **Primary Question:** "Human values aren't static; we change our minds over time. CEV treats our volition as something that can be 'computed' at a specific point of idealization. But if values are inherently dynamic and relational, does freezing them into a 'Coherent Extrapolated' target actually violate the nature of valuing itself? Are you turning a verb into a noun?"

  **Anticipated Dodge:** "The extrapolation models the dynamic process of valuing, not just a static snapshot."
  **Follow-up:** "But the AI still has to *act* on a specific output. The moment it acts, it privileges one state of the extrapolation over future iterations. If the AI locks in the 'final' extrapolated value, it stops the very growth process it was supposed to honor."

  ### 10. The Falsification Question (Required Closer)
  **Primary Question:** "I want to end on a falsification condition. We've discussed authority, alienation, convergence, and sensitivity. What specific evidence or argument would have to emerge for you to admit that CEV-style idealization is the *wrong* approach entirely? Is there a scenario where you would say, 'We should not be building AI to maximize our extrapolated volition,' and if so, what does that scenario look like?"

  **Anticipated Dodge:** "If we proved human volition is fundamentally incoherent or unrecoverable, then CEV fails."
  **Follow-up:** "Okay, but if that's the case, what's the backup? If CEV fails because human volition is broken, do we default to current preferences, or do we let the AI choose for us? Because if the answer is 'the AI chooses,' then CEV was just a fig leaf for paternalism all along."
