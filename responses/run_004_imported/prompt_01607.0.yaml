      *   *Raj's Response:* It's not curve-fitting. It separates utility (value of outcomes) from risk attitude (weighting of probabilities). In EU, risk aversion *must* come from diminishing marginal utility. But I can be risk-averse about money even if I value linearly.
      *   *Elena's Counter:* But how do we measure $r$ independently? If we infer it from choices, aren't we back to square one?
      *   *Raj's Rebuttal:* We can elicit it via specific gambles, similar to utility. The point is structural: EU conflates valuing less and fearing uncertainty. REU disentangles them. That's the explanatory gain.

  4.  **Drafting - Stage 2: The Dynamic Choice/Exploitability Challenge:**
