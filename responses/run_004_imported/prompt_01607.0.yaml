      *   *Raj's Response:* This assumes *Naive* choice. A *Sophisticated* REU agent anticipates their future preferences.
      *   *Elena's Push:* Sophistication leads to dynamic inconsistency or "resolute choice" which looks like pre-commitment without a mechanism. If you know you'll violate Independence later, why not just fix it now?
      *   *Raj's Defense:* Resolute choice isn't irrational; it's sticking to a plan. The "exploitation" only works if the bookie knows your decision theory and you don't update on the fact that you're being pumped. But more importantly, the value of the information isn't neutral for a risk-weighter. The *risk* of the information changes the structure.
