answer: |-
  The sink was full of suds, but Elias kept scrubbing the same wine glass. The water had gone lukewarm. In the other room, the hum of the refrigerator was the only sound left from the gathering. The casseroles were stacked in the fridge, the condolences had been texted, and now it was just the two of them in the kitchen of the house their father had died in three days ago.

  Sarah was drying. She took the glass from Elias, wiped it, and set it on the rack.

  "I keep thinking he's in the garage," she said. Her voice was flat, not emotional, just stating a coordinate.

  Elias didn't turn around. He kept his hands in the water. "His body is at the funeral home, Sarah. We signed the papers."

  "Not his body." She picked up a fork, polished a tine that was already clean. "Him. The part that makes the decisions. I feel like he's just in the other room. Like he stepped out to get a tool."

  Elias turned off the tap. The silence rushed in, heavy and wet. He turned, leaning his hips against the counter, wiping his hands on a dish towel. "You feel it? Or you think it?"

  "I know it."

  "How?" Elias asked. He kept his voice low, trying to keep it from sounding like an interrogation, but the edge was there. "What's the mechanism? Is it energy? Is it memory? Because if it's memory, that's in us, not him."

  Sarah put the fork down. She looked at him, and her eyes weren't defensive. They looked confused, like he was asking her to explain why blue was blue. "It's not a mechanism, Eli."

  "Everything has a mechanism. Or it doesn't happen."

  "That's not true."

  "It is true. If something exists, it interacts with reality. If it interacts, we can measure it. If we can't measure it, it's a metaphor." Elias gestured toward the dark hallway leading to the garage. "You're talking about it like it's a fact. Like he's actually in there. But if I walked out there, I wouldn't find him. So in what sense is he there?"

  "In the sense that it matters," Sarah said. She picked up the towel to dry her own hands, though they were dry. "If I believe he's watching, I do things differently. If I believe he's gone, I do things differently. The truth of it changes what I do."

  "But does that make it *true*?" Elias pressed. "Or does it just make it useful? Because I can tell you a lie that makes you feel better, but it's still a lie. I need to know if you actually believe the proposition 'Dad is in the garage' is factually accurate."

  Sarah sighed, a short exhale through her nose. "You're asking if I think he's a ghost. Like a sheet with eyes."

  "I'm asking what you mean by 'is.' When you say 'he is,' what are you claiming?"

  "I'm claiming that death isn't the end of the conversation."

  "That's poetry, Sarah. I'm asking about physics. I'm asking about ontology."

  "Why?" She turned fully toward him now, leaning back against the sink. "Why does it have to be physics? Why is that the only language that counts?"

  "Because it's the language of reality!" Elias's voice cracked, just a little. "If we start saying things are true just because they feel true, then nothing is false. Ever. You can't live like that. You can't drive a car like that. You can't build a house like that."

  "I'm not building a house," she said softly. "I'm burying a father."

  "I know. I'm sorry. But I'm worried about you. I'm worried you're going to get hurt waiting for a conversation that isn't happening."

  "I'm not waiting," Sarah said. "I'm participating."

  "How?"

  "By talking to him."

  Elias stared at her. He waited for the punchline, the admission that she was speaking metaphorically. "You talk to the air?"

  "I talk to him. And sometimes I get an answer."

  "What kind of answer? A voice? A sign?"

  "A thought. A feeling. A sudden clarity about something he taught me."

  "That's your own brain," Elias said. "That's neural pathways firing. That's you, talking to yourself."

  "It doesn't feel like me."

  "Feelings aren't evidence."

  "They're evidence of *something*."

  "Of psychology. Not of an afterlife." Elias rubbed his face. "Look, I'm not trying to be cruel. I just... I need to know what we're dealing with. If you believe he's somewhere, I need to know if you think that's a location. A state of being. Because if it's not, then saying 'he's in a better place' is just... it's empty. It's noise."

  Sarah looked at the glass rack. She touched the rim of the wine glass he'd just washed. "It's not noise. It's a picture."

  "A picture of what?"

  "Of how the world fits together. Without it, the world doesn't fit. It's just... random. Cruel. Things break and they don't get fixed."

  "Things *don't* get fixed, Sarah."

  "Some things do."

  "Not people."

  She looked at him again, and for a second, Elias felt a chill. It wasn't that she looked sad. She looked like she was speaking a language he had forgotten the grammar for.

  "You keep asking me for proof," she said. "Like I'm trying to convince you to buy a car. Or vote for a candidate."

  "Because you're making a claim about existence."

  "I'm making a claim about *weight*." She pressed her hand to her chest. "Some things are heavy. Some things are light. Death is heavy. Believing he's gone makes it heavier. Believing he's here makes it bearable. That's not a calculation. It's a orientation."

  "But is it *real*?" Elias insisted. "That's all I'm asking. Is it real?"

  Sarah picked up the towel again. She folded it. She smoothed the crease. She folded it again. "If I tell you yes, you'll ask me where. If I tell you no, you'll say I'm lying. If I tell you I don't know, you'll say I'm being vague."

  "Because the answers are mutually exclusive."

  "Maybe the questions are."

  Elias threw his hands up, a small, sharp gesture of defeat. "That's a cop-out. You can't just opt out of logic because it's uncomfortable."

  "I'm not opting out. I'm just... I'm not playing that game."

  "There is only one game! Reality is the game!"

  "Not for this." She turned back to the counter. She started organizing the clean silverware, though the drawer was right there. She lined the forks up by the sink. "You want to know if he's in the garage. I'm telling you he's in the house. We're using the same words, Eli. But we're not talking about the same house."

  Elias opened his mouth. He had a dozen arguments. He had neuroscience, he had Occam's Razor, he had the history of human superstition. But looking at her back, at the rigid set of her shoulders, he realized that if he shouted *'Prove it!'* until he was hoarse, she wouldn't hear it as a challenge to her data. She would hear it as a refusal to enter the room she was standing in.

  And if she said *'You just don't understand,'* he wouldn't hear it as an invitation to learn. He would hear it as an admission that she had no grounds.

  He looked at the fork in her hand. Silver. Cold. Reflecting the kitchen light.

  "Okay," Elias said. The word felt like ash.

  "Okay," Sarah said.

  She put the fork in the drawer. It clinked against the others.

  "I'm going to bed," she said.

  "Yeah. Me too."

  She walked out of the kitchen. She didn't turn off the light. Elias stood there for a moment, listening to her footsteps go down the hall. He reached out and turned off the tap, even though it hadn't been running. He stood in the silence, waiting to see if the house felt different now that they had stopped speaking, but the air remained exactly the same, heavy and still, holding nothing he could measure.
