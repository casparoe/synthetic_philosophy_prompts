answer: |-
  This is a fantastic question that cuts to the heart of contemporary formal epistemology. You have correctly identified the two main pressure points in the accuracy-first program: the geometric dependence on **strictly proper scoring rules**, and the philosophical worry that this dependence might be **question-begging**.

  Jim Joyce's 1998 argument (and its subsequent refinements) is elegant, but as you suspect, the magic happens in the details of the metric. Here is an intuitive walkthrough of the geometry, the role of propriety/immodesty, and the circularity objection.

  ### 1. The Geometry of Domination

  To see why incoherence implies accuracy-domination, it helps to visualize credence functions as points in a geometric space.

  **The Setup**
  Imagine a simple world with two mutually exclusive and exhaustive possibilities: $A$ is true, or $\neg A$ is true.
  *   **The Worlds:** We can represent the two possible worlds as points in 2D space: $w_1 = (1, 0)$ (A is true) and $w_2 = (0, 1)$ (A is false). These are the "omniscient" credence functions.
  *   **The Coherent Region:** A coherent credence function must assign probabilities that sum to 1. Geometrically, the set of all coherent credences forms the line segment connecting $w_1$ and $w_2$. This is the **convex hull** of the worlds.
  *   **The Incoherent Point:** If you violate the axioms (e.g., $P(A) = 0.6$ and $P(\neg A) = 0.6$), your credence function is a point *outside* that line segment.

  **The Claim**
  Joyce's theorem states that if your point $c$ is outside the coherent line segment, there exists a point $c^*$ *on* the segment that is closer to $w_1$ **and** closer to $w_2$ than $c$ is. In other words, $c^*$ is more accurate than $c$ in every possible world.

  **Why Brier (Squared Euclidean) Works**
  The Brier score is mathematically equivalent to **squared Euclidean distance** from the truth.
  *   Imagine "contour lines" of equal inaccuracy around the world $w_1$. Under the Brier score, these are circles (or spheres in higher dimensions) centered on $w_1$.
  *   If you are at an incoherent point $c$ outside the line segment, you can geometrically project yourself onto the segment to find the closest coherent point $c^*$.
  *   Because the contours are circular (strictly convex), moving from $c$ to $c^*$ reduces the distance to *both* vertices $w_1$ and $w_2$. You are moving into the "valley" between the two peaks of truth.

  **Why Absolute Value Fails**
  Now, consider the absolute-value rule (L1 norm). Geometrically, the contour lines of equal inaccuracy are not circles; they are **diamonds** (squares rotated by 45 degrees).
  *   Let's use your example: $P(A) = 0.6, P(\neg A) = 0.6$. This is incoherent (sums to 1.2).
  *   **World 1 (A is true):** Truth is $(1, 0)$.
      *   Incoherent Score: $|1 - 0.6| + |0 - 0.6| = 0.4 + 0.6 = 1.0$.
      *   Coherent Alternative ($0.5, 0.5$): $|1 - 0.5| + |0 - 0.5| = 0.5 + 0.5 = 1.0$.
  *   **World 2 (A is false):** Truth is $(0, 1)$.
      *   Incoherent Score: $|0 - 0.6| + |1 - 0.6| = 0.6 + 0.4 = 1.0$.
      *   Coherent Alternative: $1.0$.

  Under the absolute-value rule, the incoherent credence is **not dominated**. It performs exactly as well as the coherent one. In fact, for L1 norms, any credence function where $P(A) = P(\neg A)$ yields the same total score regardless of whether they sum to 1. The "penalty" for being wrong is linear, so overconfidence in $A$ is perfectly cancelled by overconfidence in $\neg A$.

  **The Geometric Intuition:**
  Strictly proper scoring rules generate **Bregman divergences**. These have a specific curvature that ensures the "gradient" of inaccuracy always points away from the coherent region if you are outside it. Improper rules (like absolute value) lack this curvature; their level sets are "flat" in ways that allow incoherent points to sit on the same accuracy level as coherent ones.

  ### 2. Immodesty and Propriety

  You asked why this depends on "propriety" and how "immodesty" fits in.

  **Strict Propriety**
  A scoring rule is *strictly proper* if, given your actual credence $p$, your *expected* inaccuracy is minimized uniquely by reporting $p$.
  *   If you believe $A$ with 70% confidence, a proper rule ensures that you expect the score to be best if you report 70%.
  *   If the rule were improper, you might believe 70% but expect a better score by reporting 80%.

  **Immodesty**
  This is the normative flip-side of propriety. **Immodesty** is the requirement that a rational credence function should not expect *another* credence function to be more accurate than itself.
  *   If you have credence $p$, and you expect credence $q$ to have a better accuracy score than $p$, you are being "modest." You are admitting that, by your own lights, you should be someone else.
  *   Joyce and others argue that Immodesty is a requirement of rationality. If you think $q$ will be more accurate than $p$, you should just adopt $q$ immediately.

  **Why the Argument Breaks without Propriety**
  The accuracy argument for probabilism relies on the idea that rational agents seek to minimize expected inaccuracy.
  1.  If the scoring rule is **improper**, minimizing expected inaccuracy does *not* lead you to report your true credences. It leads you to distort them.
  2.  If the scoring rule is **proper**, minimizing expected inaccuracy aligns with honesty.
  3.  Crucially, the **Domination Theorem** (that incoherent points are always worse than coherent ones) is mathematically equivalent to the existence of a strictly proper scoring rule.
      *   If a rule is not proper, the geometry doesn't force incoherent points to be dominated.
      *   Therefore, if you reject propriety (and thus accept modesty), you lose the guarantee that coherence is instrumentally necessary for accuracy. You could be incoherent and yet not be dominated by any coherent alternative.

  ### 3. The Circularity Objection: Smuggling Probabilism?

  This is the most philosophically charged part of your query. Is restricting the argument to proper scoring rules a neutral methodological choice, or does it beg the question?

  **The Objection**
  To define a scoring rule as "proper," we must define **expectation**.
  *   $S$ is proper iff $E_P[S(P)] \leq E_P[S(Q)]$ for all $Q$.
  *   But the expectation operator $E_P$ is defined using the **probability axioms** (sum to 1, etc.).
  *   **Critique:** You are using a definition (properness) that presupposes the probabilistic structure of expectations to prove that agents ought to be probabilistic. It looks like you've defined "rational accuracy" as "accuracy measured by a tool that only probabilities optimize."

  **The Defense (Why it might not be circular)**
  Proponents of the accuracy-first program (like Pettigrew or Joyce) argue that propriety is motivated by **Immodesty**, which is a standalone normative norm, not a mathematical trick.
  *   **The Norm:** "Don't expect others to be more accurate than you." This seems like a plausible requirement of epistemic rationality independent of probability theory.
  *   **The Derivation:** It turns out that *if* you want a scoring rule that respects Immodesty, it *must* be proper. And *if* it is proper, it *must* dominate incoherent credences.
  *   **The Claim:** We aren't assuming probabilism to define propriety; we are assuming Immodesty to select a scoring rule, and probabilism falls out as the unique solution that satisfies that rule.

  **The "Separateness of Propositions" Worry**
  However, there is a deeper worry you alluded to regarding **additivity**.
  *   Most accuracy arguments assume the total inaccuracy of a credence function is the **sum** of the inaccuracies of individual propositions.
  *   Critics (like those invoking "separateness of propositions") argue that epistemic value might not be additive. Maybe getting $P(A)$ wrong is worse if you also get $P(A \land B)$ wrong in a correlated way.
  *   If you drop additivity, you can construct non-probabilistic norms that are still "immodest."
  *   **Verdict:** Many philosophers concede that the accuracy argument does not derive probabilism from *purely* logical constraints on truth. Instead, it derives probabilism from **Probabilism + Immodesty + Additivity**.
  *   Is this smuggling? It depends on whether you view Additivity and Immodesty as "thin" norms (obviously true for any rational agent) or "thick" norms (substantive commitments that already lean toward Bayesianism).

  ### Summary

  1.  **Geometry:** Coherent credences form a convex shape (simplex). Incoherent ones lie outside. Under **Brier/Proper** rules (squared distance), any point outside is strictly further from all "truth vertices" than some point inside. Under **Absolute/Improper** rules (linear distance), the contours are flat enough that incoherent points can tie with coherent ones, breaking the domination argument.
  2.  **Immodesty:** Propriety is the mathematical encoding of Immodesty (the norm that you shouldn't expect another credence function to outperform your own). Without propriety, the link between "minimizing expected inaccuracy" and "being honest about your credence" breaks, and the domination theorem fails.
  3.  **Circularity:** It is not a *logical* circle (the axioms of probability are not premises), but it is arguably a *conceptual* one. The justification for using proper scoring rules relies on norms (Immodesty, Additivity) that are highly congenial to probabilism. If you reject those norms, the argument loses its force. The accuracy argument doesn't prove probabilism from "nothing"; it proves that **if** you value epistemic honesty (immodesty) and separable accuracy, **then** you must be a probabilist.

  The accuracy-first program is best viewed not as a knock-down proof that non-probabilists are irrational, but as a demonstration that probabilism is the unique solution to a specific, plausible set of epistemic constraints. Whether those constraints are "neutral" is the ongoing debate.
