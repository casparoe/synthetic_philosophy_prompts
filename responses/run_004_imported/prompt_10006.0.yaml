prompt: |-
  I'm a junior on my high school's Honor Council, the student-run body that hears academic integrity cases and recommends sanctions to the Dean of Students. Next week's case has split us down the middle. A sophomore was reported for texting exam answers to a friend during chemistry. The complainant is a classmate who, it turns out from her own texts, did the identical thing on a different exam last year and was never caught — including by herself, until now. The accused isn't claiming innocence. Her defense is that the complaint itself is illegitimate: whoever brings a charge like this needs standing to, and given her history, the complainant doesn't have it. Half the council thinks that's beside the point, since cheating is cheating no matter who reports it; the other half thinks a report from someone guilty of the identical, undisclosed offense taints the whole hearing, or should at least soften the sanction. Could you draft the short written opinion I'll bring to our meeting? It should recommend whether the case proceeds, is dismissed, or proceeds with a reduced sanction, address what, if anything, should happen to the complainant, and take the standing objection seriously enough to say exactly what work it can and can't do, rather than just asserting that two wrongs don't make a right.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Junior on a High School Honor Council.
      *   **Task:** Draft a short written opinion for the upcoming council meeting.
      *   **Case:** Sophomore accused of texting exam answers (admits guilt). Complainant is a classmate who also cheated (texting answers) last year but wasn't caught until now (revealed via her own texts).
      *   **Conflict:** Council is split 50/50.
          *   Side A: Cheating is cheating; reporter's history is irrelevant.
          *   Side B: Reporter's hypocrisy taints the process/should reduce sanction.
      *   **Key Requirement:** Address the "standing objection" seriously (don't just say "two wrongs don't make a right"). Define what work the objection *can* and *cannot* do.
      *   **Recommendations Needed:** Proceed, dismiss, or reduce sanction? What happens to the complainant?

  2.  **Determine the Ethical & Procedural Framework:**
      *   *High School Context:* Needs to be educational, restorative, but firm on integrity. Legalistic "standing" doctrines (like in court) don't strictly apply, but fairness perceptions matter.
      *   *Honor Code Principles:* Usually focus on community trust, honesty, and accountability.
      *   *The "Standing" Argument:* In legal terms, standing is about injury. In an Honor Council context, it's about moral authority and community trust. If the accuser is violating the same norm, does it undermine the system?
      *   *The "Clean Hands" Doctrine:* Equity often requires one coming to court to have clean hands. While not a court, the *perception* of fairness is crucial for a student-run body.
      *   *The Accused:* Admitted guilt. Cannot escape responsibility based on who caught them.
      *   *The Complainant:* Violated the code, hid it, and is now weaponizing the system (perhaps to deflect or due to a falling out, though motive isn't specified, the hypocrisy is).

  3.  **Formulate the Position:**
      *   *Dismissal?* No. The accused admitted guilt. Dismissing would undermine the Honor Code itself.
      *   *Reduced Sanction?* No. The accused's violation stands on its own merits. Reducing it based on the accuser's behavior punishes the community's standards.
      *   *Proceed with Standard Sanction?* Yes, for the accused.
      *   *Address the Complainant?* Yes. She cannot remain unaccountable. Her violation must be processed separately.
      *   *Address "Standing":* Acknowledge it as a matter of *process integrity* rather than *defendant immunity*. The accuser's lack of moral high ground doesn't exonerate the accused, but it does require the Council to address the accuser to maintain system legitimacy.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Re).
      *   **Introduction:** State the purpose and the core recommendation (Proceed against Accused, Investigate Complainant).
      *   **The Standing Objection (The Core Intellectual Work):**
          *   Acknowledge the gravity of the argument.
          *   Define what standing means here: It's not a legal bar, but a credibility/trust issue.
          *   Explain why it *doesn't* dismiss the case: The violation is against the Community/School, not just the individual accuser. The "victim" is the integrity of the exam.
          *   Explain what it *does* do: It triggers a duty to investigate the accuser. It prevents the Council from looking like a tool for personal vendettas among cheaters.
      *   **Recommendation for the Accused:** Proceed. Admission of guilt is key. Sanction should be based on the violation, not the accuser.
      *   **Recommendation for the Complainant:** Refer for investigation. She admitted (via texts) to cheating. She must face the Council too.
      *   **Conclusion:** Reiterate the goal (maintaining trust).

  5.  **Refining the Tone:**
      *   Needs to sound like a thoughtful high school junior (articulate, serious, but not overly legalese).
      *   Needs to be persuasive to both sides of the split council.
      *   *Self-Correction during drafting:* Avoid sounding too much like a lawyer. Keep it grounded in "Honor" and "Community." Make sure I don't ignore the "standing" point as requested. I need to explicitly say what work it does.

  6.  **Final Review against Constraints:**
      *   Short written opinion? Yes.
      *   Recommend outcome (proceed/dismiss/reduce)? Yes (Proceed standard).
      *   Address complainant? Yes (Investigate).
      *   Take standing objection seriously? Yes (Dedicated section).
      *   Avoid "two wrongs make a right" cliché? Yes.

  7.  **Final Polish:** (Checking the logic on "Standing").
      *   *Argument:* If we say the accuser has no standing, we imply the code is a private contract between students. It's not. It's a covenant with the institution.
      *   *Counter-argument:* But if we ignore it, we look hypocritical.
      *   *Solution:* Decouple the cases. Case A (Accused) stands. Case B (Accuser) opens. This satisfies the "fairness" concern without granting immunity.

  8.  *(Drafting the response based on these thoughts...)* -> *See final output.*
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Junior Council Member
  **DATE:** October 26, 2023
  **RE:** Opinion on Case #24-09 (Chemistry Exam Integrity)

  **Recommendation**
  I recommend that the Council **proceed with the hearing** for the accused sophomore and apply the standard sanction range for academic dishonesty, without reduction. Simultaneously, I recommend we **open a separate investigation** into the complainant based on the evidence provided in the current file. We should not dismiss the case, nor should we reduce the sanction for the accused.

  **The Standing Objection**
  The argument that the complainant lacks "standing" because of her own undisclosed cheating is the most difficult ethical question in this room. It deserves more than a dismissal based on the cliché that "two wrongs don't make a right." We must be precise about what work this objection can and cannot do within our system.

  **What the Objection Cannot Do:**
  It cannot grant immunity to the accused. Our Honor Code is not a private contract between individual students; it is a covenant between each student and the school community. When the accused texted answers, she violated the trust of the institution and her peers, not just the trust of the complainant. Therefore, the moral failings of the accuser do not erase the factual reality of the accused's violation. To dismiss this case would be to say that a student's guilt is contingent on the purity of their accuser, which effectively nullifies the Code whenever a hypocrite is involved.

  **What the Objection Can Do:**
  It does, however, challenge the *legitimacy of the process*. An Honor Council relies on the community's belief that we act in good faith. If we allow a student to weaponize the Council to punish a peer for a crime they are actively committing themselves, we risk appearing as a tool for personal vendettas rather than guardians of integrity. The "standing" objection here is not a shield for the accused, but a spotlight on the complainant. It obligates the Council to ensure that the accuser is not placed above the Code they are invoking.

  **Disposition of the Parties**
  1.  **The Accused:** She has admitted to the violation. Her defense rests entirely on the complainant's status, not on her own innocence. Because the violation against the community is established, the sanction should reflect the breach of integrity, not the dynamics of the reporting party. Reducing her sanction would unfairly penalize the community's standards for the sake of procedural discomfort.
  2.  **The Complainant:** The texts submitted as evidence implicate her in an identical, undisclosed violation. We cannot accept her report while ignoring her confession. To maintain the Council's moral authority, we must refer her case for investigation immediately. If she is found responsible, she should face sanction regardless of the outcome of the current case.

  **Conclusion**
  We can reject the "standing" defense without ignoring the hypocrisy it highlights. We do this by holding both students accountable. We proceed against the accused for the breach she admitted, and we proceed against the complainant for the breach she revealed. This is the only path that upholds the Code without making the Council complicit in selective enforcement.
