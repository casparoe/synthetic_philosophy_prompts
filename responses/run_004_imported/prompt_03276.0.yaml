answer: |-
  This is an excellent catch, and your instinct to question the "Hobbesian" reading is spot on. You have stumbled onto one of the most famous tensions in Pascal scholarship. The reason you are finding conflicting interpretations is that Pascal is doing something much more subtle than Hobbes.

  While Hobbes writes political theory to solve the problem of order, Pascal writes theology to diagnose the problem of the human condition.

  Here is the breakdown you need for your paper. The short answer is: **Pascal is not endorsing the merger of might and justice as a good solution. He is diagnosing it as a tragic symptom of the Fall.** He is describing a *usurpation*, not a *constitution*.

  Here is the line-by-line walkthrough to help you build your argument.

  ### Line-by-Line Analysis (Lafuma 103)

  **1. "It is right that what is just should be obeyed; it is necessary that what is strongest should be obeyed."**
  *   **The Distinction:** Pascal opens with a distinction between the *normative* (what ought to be: right) and the *descriptive* (what is: necessary).
  *   **The Trap:** If you stop here, it sounds like he is setting up a balance. But notice the verbs. Justice *should* be obeyed (moral obligation). Might *is* obeyed (physical reality). He is already separating ideal justice from real power.

  **2. "Justice without might is helpless; might without justice is tyrannical."**
  *   **The Dilemma:** This looks like a practical problem. Justice needs enforcement; Power needs legitimacy.
  *   **The Hobbesian Temptation:** This is where readers think, "Okay, so we need a Sovereign to combine them."
  *   **The Pascal Twist:** Pascal isn't proposing a solution yet; he is outlining a logical requirement that humanity fails to meet.

  **3. "Justice without might is gainsaid, because there are always offenders; might without justice is condemned."**
  *   **Human Nature:** Why is justice helpless? Because humans are corrupt ("there are always offenders"). Why is might condemned? Because humans have an innate, lingering sense of fairness (a remnant of the Image of God) that recognizes tyranny.
  *   **Key Insight:** We are too corrupt to follow pure justice, but not corrupt enough to be satisfied with pure tyranny. We are stuck in the middle.

  **4. "We must then combine justice and might, and for this end make what is just strong, or what is strong just."**
  *   **The Fork in the Road:** There are two theoretical ways to solve this.
      1.  Empower Justice (make the good guys win).
      2.  Sanctify Might (declare the winners good).
  *   **The Logic:** Logically, option 1 is better. But Pascal is about to tell us why option 1 is impossible for fallen humans.

  **5. "Justice is subject to dispute; might is easily recognised and is not disputed."**
  *   **The Epistemological Kill Shot:** This is the most important line for your paper. Why can't we "make what is just strong"? Because we cannot agree on what is just.
  *   **Context:** Connect this to the fragments on **Custom** and **Opinion**. For Pascal, human reason is corrupted by the *Fall*. We cannot access objective Justice through reason alone. "Truth on this side of the Pyrenees, error on the other."
  *   **Contrast:** You can see a sword or an army (Might). You cannot see "Justice." Therefore, Might is a more reliable tool for social coordination than Truth.

  **6. "So we cannot give might to justice, because might has gainsaid justice, and has declared that it is she herself who is just."**
  *   **The Usurpation:** Notice the agency. *Might* speaks. Might "gainsays" (contradicts) justice. Might declares *itself* to be justice.
  *   **The Irony:** This isn't a lawful contract. It is a coup. Power hijacks the label of Justice to protect itself.

  **7. "And thus being unable to make what is just strong, we have made what is strong just."**
  *   **The Conclusion:** Look at the tense. "We *have made*." This is a historical confession, not a prescriptive rule.
  *   **The Tone:** It reads as a resignation. We wanted Justice, but because we were too corrupt/disputed to find it, we settled for Power and lied to ourselves that it was Justice.

  ### Why the "Hobbesian" Reading is Wrong

  Your teacher will be impressed if you explicitly address why this *isn't* Hobbes.

  *   **Hobbes (Leviathan):** The State of Nature is war. We rationally agree to surrender rights to a Sovereign. The Sovereign's law *becomes* Justice by definition. This is a **constructive** theory. It justifies the state.
  *   **Pascal (Pensées):** The State of Nature is Fallen. We cannot agree on Justice because our reason is broken. We submit to Power out of necessity, not rational consent. We *call* it Justice to soothe our consciences. This is a **diagnostic** theory. It exposes the state's lack of divine legitimacy.

  For Hobbes, "Might makes Right" is the foundation of peace. For Pascal, "Might makes Right" is a lie we tell ourselves to hide from the fact that we live in a disordered world without God's visible rule.

  ### The "Third Option": Augustinian Submission

  There is a nuance you should include to get an A. Just because Pascal thinks earthly justice is a sham doesn't mean he wants anarchy.

  Pascal is an Augustinian. St. Augustine argued that while the "City of Man" is flawed and based on domination, Christians must still obey its laws to maintain **order** (charity/peace), even if those laws aren't **true** Justice.

  So, Pascal isn't saying "Rebel against the strong." He is saying:
  1.  Obey the laws (because disorder is worse).
  2.  But do not *believe* the laws are truly Just (because only God is Just).
  3.  Recognize that your obedience is pragmatic, not moral.

  This connects to the fragment you mentioned: **"Opinion is the queen of the world."** We obey the King not because his divine right is real, but because the *opinion* of his authority holds society together. It is a "necessary fiction."

  ### Thesis Suggestion for Your Paper

  If I were writing this, my thesis would look something like this:

  > "While Pascal's fragment on Justice and Might superficially resembles a Hobbesian justification for sovereign power, a closer reading reveals it as a theological diagnosis of human corruption. Pascal does not endorse the merger of might and justice as a political solution; rather, he exposes it as a tragic usurpation necessitated by the Fall. Because human reason is too corrupted to agree on objective justice ('Justice is subject to dispute'), society is forced to sanctify power ('make what is strong just') as a pragmatic fiction. Thus, Pascal undermines the legitimacy of earthly law not to incite rebellion, but to direct the reader's longing for true Justice toward God alone."

  ### Key Fragments to Cross-Reference
  To back this up, mention these alongside Lafuma 103:
  *   **Lafuma 60 (Brunschvicg 44):** "Justice without force is powerless..." (Similar theme).
  *   **Lafuma 94 (Brunschvicg 60):** On Custom. "Custom is our nature." We obey laws because we are used to them, not because they are rational.
  *   **Lafuma 131 (Brunschvicg 94):** "Opinion is the queen of the world."
  *   **The Concept of *Divertissement* (Diversion):** We create political systems to distract ourselves from the terror of our condition (death and sin). Believing our laws are "Just" is a diversion.

  ### Summary for your "Dig Into It" Moment
  Your teacher said "dig into it" because they want you to realize that Pascal isn't doing Political Science; he's doing **Moral Theology using Political examples.**

  *   **Hobbes:** How do we build a stable state?
  *   **Pascal:** Why is every state fundamentally broken?

  If you argue that Pascal is being **ironic/pessimistic** rather than **prescriptive**, you will be aligning with the dominant scholarly consensus (think scholars like Lucien Goldmann or Michael Moriarty). You aren't guessing wrong; you're picking the harder, more textually supported path.

  Good luck with the paper. This is a great fragment to obsess over.
