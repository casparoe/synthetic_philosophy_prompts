answer: |-
  This is a classic debate in decision theory, and honestly, your friend is arguing from the standard **Causal Decision Theory (CDT)** framework, while you are intuitively reaching for **Evidential Decision Theory (EDT)** or, more accurately, the modern **Functional Decision Theory (FDT)**.

  Your friend is technically correct *within the standard axioms of game theory*, but you are correct that those axioms might be the problem, not the reasoning.

  Here is the strongest rigorous defense of superrationality, how it relates to EDT, and the crucial nuance about agent similarity.

  ---

  ### 1. The Strongest Argument: Logical Correlation, Not Causal Magic

  Your friend's core objection is: *"Defection dominates. My choice cannot causally change theirs. Therefore, I must defect."*

  The superrational counter-argument is not that your choice *causes* theirs (no magical telepathy). The argument is that **both choices are outputs of the same logical function.**

  **The Source Code Analogy:**
  Imagine the Prisoner's Dilemma isn't played by humans, but by two AI bots submitting source code.
  *   You are writing the code for Bot A.
  *   You know Bot B is running the exact same source code as you.
  *   You are not asking, "What does Bot A do?" You are asking, "What does this *algorithm* output?"

  If the algorithm outputs "Defect," both bots defect. If it outputs "Cooperate," both cooperate. There is no possible world where the algorithm outputs "Defect" for Bot A and "Cooperate" for Bot B, because they are the *same algorithm*.

  **The Rigorous Move:**
  Superrationality reframes the decision. You are not choosing an *action* in isolation; you are choosing a **logical fact**.
  *   **CDT (Friend's view):** I choose $A$. The world state $W$ is independent. I maximize $U(A, W)$.
  *   **Superrationality/FDT:** I choose the output of logical function $L$. Since the opponent runs $L$, their move is $L()$. I maximize $U(L(), L())$.

  **Why Dominance Reasoning Fails Here:**
  Dominance reasoning relies on the **Independence Assumption**: $P(\text{Opponent}=C | \text{Me}=C) = P(\text{Opponent}=C)$.
  Superrationality denies this. It asserts $P(\text{Opponent}=C | \text{Me}=C) = 1$ (assuming identical reasoners).
  If the probability is 1, the payoff matrix changes. You are no longer choosing between rows; you are choosing between diagonals ($CC$ vs $DD$). Since $CC > DD$, cooperation is rational.

  **The Defense:** You aren't "throwing out dominance reasoning." You are pointing out that dominance reasoning is only valid when the variables are independent. In a game of logical identity, the variables are **logically dependent**.

  ### 2. Does it Collapse into Evidential Decision Theory (EDT)?

  This is the tricky part. **Functionally, yes. Metaphysically, no.**

  *   **EDT** says: "Choose the action that gives the best *news*. If I cooperate, it is good evidence that they cooperated, so I expect a higher payoff."
  *   **Superrationality (Hofstadter's original)** says: "We are identical reasoners. It is a logical necessity that we do the same thing."

  **The Collapse:**
  To an outside observer, Superrationality looks exactly like EDT. Both calculate expected utility using conditional probabilities where your action updates the probability of the opponent's action.
  If your friend argues, "You're just doing EDT," you can concede that point without losing the argument. The real debate is **CDT vs. EDT/FDT**, not "Superrationality vs. Rationality."

  **The Distinction:**
  EDT can get you in trouble with "spurious correlations" (e.g., "People who carry umbrellas get wet, so I shouldn't carry an umbrella"). Superrationality avoids this by grounding the correlation in **logical identity**, not statistical regularity.
  *   *EDT:* "I see a correlation between me and them."
  *   *Superrationality:* "There is a logical entailment between me and them."

  **The Modern Upgrade: Functional Decision Theory (FDT)**
  Philosophers like Yudkowsky and Soares (MIRI) have formalized this into FDT. FDT argues that you should act as though you are choosing the output of your decision function. This captures the superrational intuition without relying on the fuzzy "we are both ideal" claim. It makes the "logical correlation" rigorous. If you want to win this argument today, cite **FDT**, not just Hofstadter.

  ### 3. The Similarity Requirement: Identical vs. "Similar Enough"

  This is the weakest link in Hofstadter's original argument, and where your friend's skepticism is most potent.

  **Hofstadter's Original Claim:**
  He argued superrationality only works if you are *certain* the other agent is superrational and identical to you. If there is even a 1% chance they are a standard defector, dominance reasoning often creeps back in (depending on the payoff matrix).

  **The "Similar Enough" Problem:**
  If you are 99% similar to the opponent, are your decisions logically correlated?
  *   **Strict View:** No. Logic is binary. If the code differs by one bit, the output *could* differ.
  *   **FDT View:** It depends on **subjunctive dependence**. If your decision processes are similar enough that they would *track* each other across counterfactuals, you should cooperate.

  **Example:**
  If you are playing against a clone of yourself created 5 minutes ago, the correlation is near 1.
  If you are playing against a human who reads the same philosophy books as you, the correlation is lower but non-zero.
  If you are playing against a random stranger, the correlation is negligible.

  **The Weight of Similarity:**
  Superrationality puts **heavy weight** on similarity.
  *   If $P(\text{They match me}) = 1$, Cooperate is strictly dominant.
  *   If $P(\text{They match me}) = 0.5$, it depends on the payoffs.
  *   If $P(\text{They match me}) \approx 0$ (random stranger), Defect is rational.

  **The Critique:**
  Your friend is right that in the real world, you rarely meet "identical reasoners." Therefore, superrationality is often practically useless outside of specific contexts (like AI coordination or tight-knit ideological groups). However, its *theoretical* point remains: **If** the correlation exists, CDT is leaving money on the table.

  ### 4. Summary: How to Reply to Your Friend

  You don't need to be 100% sure superrationality is "true" to defend it against the "cheating" accusation. Here is the script:

  1.  **Acknowledge the CDT Axiom:** "You're right that under Causal Decision Theory, defection dominates. That is the standard game theory answer."
  2.  **Challenge the Independence Assumption:** "But CDT assumes my choice is causally independent of theirs. Superrationality argues that for two identical reasoners, the choices are **logically dependent**. It's not that I change their mind; it's that the same math problem yields the same answer."
  3.  **Reframe the Goal:** "If the goal is to 'be rational' according to a textbook, you win. If the goal is to 'win the game' (get the higher payoff) against a mirror image, superrationality wins. Defecting against a mirror image guarantees $DD$. Cooperating guarantees $CC$. Why would a rational agent choose the lower payoff?"
  4.  **Concede the Similarity Point:** "However, you are right that this falls apart if we aren't actually similar. Superrationality isn't a universal strategy; it's a coordination mechanism for agents that recognize their logical similarity."

  ### The Verdict

  *   **Is it cheating?** No, it's adopting a different decision theory (FDT/EDT) that accounts for logical correlations which CDT ignores.
  *   **Does it collapse into EDT?** Functionally, yes. But the justification (logical identity vs. statistical evidence) is stronger.
  *   **How similar must agents be?** Very. The strategy degrades rapidly as logical correlation drops. It is robust for clones/AIs, fragile for humans.

  Your intuition was right: treating the choices as independent is the mistake *if* there is logical correlation. Your friend's intuition was right: in a world of unrelated strangers, that correlation doesn't exist, so dominance holds. You are arguing about different worlds.
