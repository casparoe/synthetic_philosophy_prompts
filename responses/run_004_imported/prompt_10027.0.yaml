      *   **Topic:** Superrationality (Douglas Hofstadter's concept) in the context of the one-shot Prisoner's Dilemma (PD).
      *   **The Conflict:** User vs. Friend.
          *   *Friend's View:* Superrationality is "cheating." Defection is a dominant strategy. Allowing "they'll think what I think" violates dominance reasoning.
