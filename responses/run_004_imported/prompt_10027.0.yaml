      *   *Dominance Reasoning:* In standard Game Theory (Causal Decision Theory - CDT), $D$ dominates $C$ because $P(\text{Opponent}=C)$ is independent of $P(\text{Me}=C)$.
      *   *EDT vs. CDT:* EDT maximizes expected utility based on conditional probabilities ($P(O|A)$). CDT maximizes based on causal impact ($P(O|\text{do}(A))$). Superrationality looks a lot like EDT because it treats the opponent's move as evidence of one's own move.
      *   *Logical Decision Theory (LDT):* This is the modern formalization (FDT, UDT). It's crucial to mention this to show the argument has evolved beyond Hofstadter's informal sketch.
      *   *Similarity:* Hofstadter emphasized "identical." Modern LDT relaxes this to "logical correlation."

  3.  **Drafting the Argument Structure:**

