prompt: |-
  So in my grad micro course we just finished the axiomatic bargaining unit and I'm kind of stuck comparing the Kalai-Smorodinsky solution to the Nash bargaining solution beyond just "one keeps IIA and the other doesn't." Like I get that Nash's solution maximizes the product of utility gains and satisfies independence of irrelevant alternatives, while KS drops IIA but adds individual monotonicity instead, but I dont really have a gut feel for *why* you'd want one axiom system over the other in practice, or what actually breaks in the Nash solution that motivated Kalai and Smorodinsky to come up with their alternative in the first place.

  Could you walk me through the comparison in more depth -- like what's a concrete example where the two solutions actually diverge for the same bargaining problem, and why intuitively monotonicity fails for Nash's solution when you expand the feasible set for one player? Also curious if there's a deeper interpretive difference here, like does KS embody a different notion of "fairness" or "proportionality" than Nash's solution, or is it mostly a technical fix to get monotonicity at the cost of IIA? My professor mentioned this in passing but didn't really unpack it and now it's bugging me before the midterm.
