answer: |-
  First off, welcome to the rabbit hole. Your friend who said "they're basically the same vibe" gave you the classic philosophy department shrug. It's technically true that they are *allies* against the traditional view (Invariantism), but saying they are the same is like saying a cardiologist and a heart surgeon are the same because they both care about hearts. One diagnoses the language, the other operates on the organ.

  You have correctly identified the core intuition: **Traditional Epistemology** says knowledge is a pure relationship between a mind and the world (Evidence + Truth + Belief = Knowledge). Stakes shouldn't matter.
  **Contextualism** and **Pragmatic Encroachment** both say: "Actually, stakes *do* matter."

  But they disagree violently on *why* and *how*. Here is the breakdown, the divergence case, and the verdict.

  ---

  ### 1. The Agreement vs. The Disagreement

  **Where they agree:**
  They both agree that the traditional definition of knowledge is incomplete. They both look at the Bank Case (low stakes = "I know"; high stakes = "I don't know") and say, "The traditionalist is wrong. Practical stakes affect whether we count as knowing."

  **Where they part ways:**
  The split is about **what is changing**.

  *   **Epistemic Contextualism** says the **word** "knows" is changing.
      *   It claims "knows" is an indexical, like "here," "now," or "tall."
      *   If I say "That bottle is empty," I might mean "no liquid," but a scientist might mean "no atoms." The bottle didn't change; the standard for the word "empty" changed based on who is speaking.
      *   **The Mechanism:** When stakes go up, the *conversational context* raises the semantic standard for the word "know."
      *   **The Implication:** The person in the high-stakes situation *does* have the exact same mental state and evidence as the low-stakes person. They technically still "know" (by low standards), but it becomes false to *say* they know in a high-stakes conversation.

  *   **Pragmatic Encroachment** (often called Subject-Sensitive Invariantism) says the **state of knowledge** is changing.
      *   It claims the meaning of "knows" is stable, but what it *takes* to be in that state includes your practical situation.
      *   Knowledge isn't just Mind + World; it's Mind + World + **Action**.
      *   **The Mechanism:** When stakes go up, the *threshold for justification* actually gets higher. You need *more* evidence to know when more is on the line.
      *   **The Implication:** The person in the high-stakes situation genuinely lacks knowledge. It's not a linguistic trick; their epistemic position has objectively worsened because the risk of error is now intolerable.

  **The One-Sentence Distinction:**
  Contextualism says the **speaker's** context determines if the sentence "S knows" is true. Encroachment says the **subject's** stakes determine if S actually knows.

  ---

  ### 2. The Divergence Case: "The Proxy Deposit"

  This is the holy grail you were looking for. Most examples (like the Bank Case) feature the Subject and the Speaker as the same person, or people in the same situation. That's why both theories fit. To break them apart, we need to **cross the wires** between the Subject's stakes and the Speaker's stakes.

  **The Scenario:**
  *   **Hannah (The Subject):** She is standing at the bank. She has a small amount of cash in her account. If the bank is closed, she just buys coffee elsewhere. **Her stakes are Low.** She has standard evidence (was there last Saturday).
  *   **Sarah (The Speaker/Attributor):** Sarah is Hannah's friend. Sarah needs Hannah to deposit a check for *Sarah's* rent payment immediately. If the bank is closed, Sarah's rent bounces and she gets evicted. **Sarah's stakes are High.**
  *   **The Utterance:** Sarah asks her husband, "Does Hannah know the bank is open?"

  **The Verdicts:**

  **1. The Contextualist Verdict:**
  Contextualism cares about the **Speaker's (Sarah's)** context. Sarah is in a high-stakes conversation about eviction. Therefore, the standard for the word "knows" is raised to "High."
  *   Does Hannah meet the High Standard? No (she only has standard evidence).
  *   **Result:** It is **FALSE** for Sarah to say "Hannah knows."
  *   *Why:* The word "knows" has stretched to mean "knows well enough for Sarah's eviction crisis."

  **2. The Pragmatic Encroachment Verdict:**
  Encroachment cares about the **Subject's (Hannah's)** stakes. Knowledge is a property of Hannah's mind relative to her situation. Hannah's rent is not on the line; only her coffee is.
  *   Does Hannah meet the threshold for *her* situation? Yes. Her evidence is sufficient for her low stakes.
  *   **Result:** It is **TRUE** that Hannah knows.
  *   *Why:* Hannah genuinely possesses knowledge. Sarah shouldn't *rely* on it (because Sarah's stakes are high), but that doesn't erase Hannah's knowledge state.

  **Why this matters:**
  In this scenario, Contextualism says the sentence "Hannah knows" is false. Encroachment says the sentence "Hannah knows" is true (even if Sarah shouldn't act on it). This is a hard contradiction. They cannot both be right here.

  ---

  ### 3. The Bet: Which is closer to the truth?

  If I had to place a chip on the table, I would bet on **Pragmatic Encroachment**.

  Here is the reasoning, stripped of the jargon:

  **The Problem with Contextualism (Semantic Blindness):**
  Contextualism requires us to believe that we are constantly shifting the meaning of the word "know" without realizing it. If Contextualism is true, when a skeptic says "You don't know anything" (high standard) and you say "Yes I do" (low standard), you are both telling the truth. You are just talking past each other.
  The problem is: **We don't feel like we are talking past each other.** We feel like we are disagreeing. Contextualism implies humans are "semantically blind" to the way our own language works. That's a heavy cost. It makes knowledge too fragile; it suggests I can lose my knowledge just because *you* started asking tricky questions, even if my situation hasn't changed.

  **The Strength of Encroachment (Knowledge is for Action):**
  Encroachment aligns better with why we care about knowledge in the first place. We don't collect knowledge like baseball cards; we use it to navigate the world.
  *   If knowledge is the norm of action (i.e., "You should only act on what you know"), then it makes perfect sense that high stakes require more evidence.
  *   It respects the intuition that the person in the high-stakes situation is in a *different* position, not just using different words.
  *   It avoids the "Semantic Blindness" issue. The meaning of "know" stays stable; the world just gets more demanding.

  **The Caveat:**
  Encroachment is risky because it threatens to make knowledge too subjective. If my stakes determine what I know, do we all live in different epistemic realities? (e.g., The doctor "knows" the medicine is safe, but the desperate patient "doesn't know" it's safe, even with the same data).
  However, most Encroachment theorists handle this by saying the *evidence required* scales with the stakes. The patient needs *more* evidence to know, not a different reality.

  **Conclusion:**
  Contextualism is a better theory of **linguistics** (how we talk).
  Pragmatic Encroachment is a better theory of **epistemology** (how we know).

  Since you asked about how knowledge *works*, not just how we talk about it, Encroachment wins. It treats knowledge as a robust tool for action that sharpens when the danger increases, rather than a word that wobbles depending on who is listening.

  ### Summary for your next rabbit hole dive:
  *   **Contextualism:** "Knows" is a shapeshifter. The speaker sets the rules.
  *   **Encroachment:** Knowledge is a relationship. The subject's stakes set the rules.
  *   **The Test:** Look for cases where the Speaker has high stakes but the Subject has low stakes. That's where the theories fight to the death.
