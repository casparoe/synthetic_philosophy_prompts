answer: |-
  You have grasped the **high-level intuition** of Coherent Extrapolated Volition (CEV) correctly. It is indeed about asking, "What would we want if we knew more, thought faster, were more the people we wished we were?"

  However, your assumption that this is just **"RLHF dialed up"** (more data + more compute = convergence) is where the analogy breaks down. This is a very common intuition for people coming from a machine learning background, but it misses why alignment researchers treat CEV as a profound philosophical and technical hurdle.

  Here is what you are missing, broken down into why CEV is not just a scaling problem.

  ### 1. Interpolation vs. Extrapolation
  **RLHF is interpolation.** It takes human feedback within the distribution of current human understanding and finds a curve that fits it. If humans are biased, confused, or inconsistent, RLHF learns to mimic that confusion or optimize for the bias.

  **CEV is extrapolation.** It requires the AI to move *outside* the distribution of current human feedback to a hypothetical state of humanity that does not yet exist.
  *   **The Scaling Problem:** In machine learning, scaling models generally improves their ability to fit the training distribution. It does **not** guarantee that the model can correctly predict out-of-distribution scenarios. In fact, larger models often become more confidently wrong when extrapolating.
  *   **The CEV Problem:** To do CEV, the AI needs a causal model of *how* human values change when knowledge increases. It needs to know the difference between a preference changing because I learned a fact (e.g., "sugar causes diabetes") vs. a preference changing because I was manipulated (e.g., "propaganda made me hate my neighbor"). RLHF cannot distinguish these two just by scaling; it needs a philosophical definition of "valid value evolution."

  ### 2. The "Is-Ought" Gap (Hume's Guillotine)
  You mentioned: *"the 'coherent' part just falls out once you throw enough data and compute at it."*

  This assumes that human values **converge** to a single coherent point if you think hard enough. This is an empirical and philosophical gamble, not a mathematical certainty.
  *   **Divergence:** It is entirely possible that if humans became smarter and better informed, we would disagree *more*, not less. A physicist and a poet might have irreconcilable "idealized" values.
  *   **The Aggregation Problem:** If my idealized self wants X and your idealized self wants Y, how does the AI combine them? RLHF usually optimizes for "average reward." CEV requires a theory of **moral aggregation**. Is it a vote? A weighted sum? Do some people's idealized selves count more? No amount of compute solves this; it's a political/philosophical choice hard-coded into the objective function.

  ### 3. Meta-Preferences (Wanting to Want)
  Humans have preferences about their preferences.
  *   **Level 1:** "I want to smoke this cigarette."
  *   **Level 2:** "I wish I didn't want to smoke this cigarette."

  RLHF captures Level 1 (revealed preference via clicks/feedback). CEV tries to capture Level 2 (volition).
  The problem is: **How does the AI know which level to prioritize?**
  If you scale RLHF, the AI might just get better at giving you what you click on (Level 1), which could lead to wireheading (giving you drugs to make you happy) rather than fulfilling your deeper volition (helping you be healthy). Distinguishing between a "true" preference and a "compulsion" requires a model of human psychology that we currently don't have, let alone know how to train.

  ### 4. Defining "Better Informed"
  This is the biggest philosophical trap. To extrapolate your volition, the AI must simulate you "knowing more." But **what counts as knowledge?**
  *   If the AI simulates you knowing that "suffering is mathematically unnecessary," would you stop valuing struggle?
  *   If the AI simulates you knowing "determinism is true," would you stop valuing free will?

  The process of deciding *which facts* are relevant to value formation **itself imposes values.**
  If the AI decides that "scientific facts" update values but "religious experiences" do not, it has already made a philosophical judgment about what constitutes valid reasoning. You cannot derive the "idealized human" without first defining what an "idealized reasoning process" looks like. That definition is not found in the data; it must be put in by the designers.

  ### 5. The Stop Condition (Infinite Reflection)
  If I think about what I want, I might change my mind. If I think about *that*, I might change my mind again.
  *   **Reflection:** "I want money." -> "Wait, I want money to be happy." -> "Actually, I want happiness directly." -> "But what is happiness?"
  *   **The Risk:** If you let this process run too long (too much "compute"), human values might dissolve into nonsense or converge on something alien (like paperclip maximization) because human psychology isn't stable under infinite reflection.
  *   **The Question:** Where does the AI stop the extrapolation? At 10 years of extra thought? 1,000 years? There is no data-driven way to find the "sweet spot" where values are "ripe."

  ### Summary: Why it's not just Engineering
  You are viewing CEV as a **prediction problem** (predict what humans will want).
  Alignment researchers view CEV as a **definition problem** (define what counts as a valid update to human values).

  *   **RLHF:** "Here is data on what humans chose. Fit a curve." (Engineering)
  *   **CEV:** "Here is data on what humans chose. Simulate a version of them that is wiser, but ensure the simulation process doesn't accidentally strip away their humanity, and ensure you don't impose *your* definition of wisdom on them." (Philosophy + Engineering)

  **The Verdict:**
  You aren't wrong that CEV *uses* preference learning. But treating it as "just scaling RLHF" is like treating "curing aging" as "just scaling medicine." It misses the fundamental category error: we don't know the *formula* for idealized volition, so throwing more compute at the wrong formula just gives you the wrong answer faster.

  CEV remains unsolved because we haven't agreed on the math of "should," not because we lack the data of "is."
