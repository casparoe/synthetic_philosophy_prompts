      *Refining the "Missing Piece":* The key is that Turing is a *computationalist*. If ESP is real, it might violate the Church-Turing thesis regarding physical processes. Turing is essentially saying, "For the purpose of this test, let's assume the universe is computable enough that we don't need to worry about magic." It's a *ceteris paribus* clause.

