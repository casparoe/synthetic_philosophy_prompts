answer: |-
  You have read the texts with far more care than your deacon did, and your instincts are correct: his summary was a significant oversimplification that flattens Aquinas's nuanced moral architecture into a soundbite. To answer your specific questions: yes, the proviso about harm is constitutive of justice for Aquinas, not merely practical caution; yes, "disturbing" a government is distinct from assassinating a ruler; and yes, the *Sentences* and the *Summa* describe distinct scenarios regarding *who* may act and *against what kind* of ruler.

  Here is a breakdown of the distinctions you are sensing, followed by a more accurate summary.

  ### 1. The Proviso: Prudence or Justice?
  You asked whether the requirement that the disturbance must not cause "greater harm" is just practical caution layered on top of an unconditional moral judgment, or if it is built into justice itself. For Aquinas, it is the latter.

  Aquinas's political theory is teleological: the purpose of government is the **common good**. A tyrannical government is unjust precisely because it substitutes the *private good* of the ruler for the *common good*. However, the moral evaluation of *resisting* that government is also measured by the common good. If the act of resistance destroys the social order, invites civil war, or results in a worse tyranny, it fails to serve the common good. Therefore, the act ceases to be an act of justice and becomes an act of disorder (sedition). It is not merely that the outcome is bad; it is that the moral object of the act is disordered if it disproportionately harms the very community it intends to save.

  ### 2. "Disturbing" vs. Killing
  In *Summa Theologiae* IIa–IIae, q. 42, a. 2, Aquinas is defining **sedition**, not tyrannicide. When he says it is not sedition to "disturb" a tyrannical government, he is speaking broadly about deposition, rebellion, or regime change. He is not explicitly licensing the physical killing of the ruler in this text.

  The deacon's leap from "it is not sedition to disturb a tyranny" to "a tyrant may licitly be killed" ignores the question of *means*. For Aquinas, the execution of justice generally belongs to **public authority**, not private individuals. A private citizen killing a ruler is usually an act of murder, even if the ruler is wicked, because the private citizen lacks the jurisdiction to execute judgment. This is why Aquinas warns (in *De Regno*) that allowing private individuals to kill tyrants is dangerous, as it often leads to the killing of good kings by malcontents.

  ### 3. The *Sentences* vs. The *Summa* (Usurper vs. Legitimate Ruler)
  You are right to identify two distinct scenarios. This is the crucial key the deacon missed.

  *   **In the *Commentary on the Sentences* (Early Work):** Aquinas addresses the specific case of a **usurper** (a tyrant by defect)—someone who seized power by force without any legitimate title. He argues that if there is no higher authority (like an Emperor or Pope) to judge the usurper, a private citizen *may* kill him. This is an exception based on the lack of legitimate title; the usurper is essentially an aggressor in a state of war against the polity.
  *   **In the *Summa Theologiae* (Mature Work):** Aquinas focuses on the **tyrant by exercise** (a legitimate ruler who rules unjustly). Here, he is much more cautious. He emphasizes that the *tyrant* is the true seditionist, but he does not explicitly grant license for private assassination. He leaves the removal of such a ruler to public mechanisms or divine intervention to avoid the greater evil of social chaos.

  ### A More Accurate Summary
  If you were to offer a correction in class, or simply for your own clarity, a faithful Thomistic summary would look like this:

  > "Aquinas distinguishes between a usurper, whom a private citizen may kill if no public authority exists to judge him, and a legitimate ruler who becomes tyrannical, whose removal generally requires public authority; in either case, resistance is only licit if it is ordered to the common good and does not inflict greater harm on the community than the tyranny itself."

  ### A Note for Your RCIA Journey
  It is worth noting that the Catholic Church's teaching has developed further since Aquinas. The *Catechism of the Catholic Church* (2242–2243) sets an extremely high bar for armed resistance, requiring that all other means be exhausted, that there be a well-founded hope of success, and that the resistance not provoke worse disorders.

  The deacon likely wanted to convey that the Church does not demand absolute pacifism in the face of grave injustice (which is true), but he utilized a "proof-text" that requires significant scholastic footnotes to be accurate. Your willingness to track down the source and grapple with the nuance is exactly the kind of intellectual honesty the Church values in the *fides quaerens intellectum* (faith seeking understanding). Do not let a simplified catechetical moment discourage you; the tradition is robust enough to handle your questions.
