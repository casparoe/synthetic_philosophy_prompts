      *   Maintain theological precision (Scholastic terms like "common good," "public authority," "usurpation").
      *   Ensure the distinction between the *Summa* (mature thought) and *Sentences* (early thought) is clear but not dismissive of the latter.

  6.  **Final Review against User Query:**
