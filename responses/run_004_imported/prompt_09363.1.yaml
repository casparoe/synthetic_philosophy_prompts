      *   **The Problem:** The user read *Summa Theologiae* IIa–IIae, q. 42, a. 2 (on Sedition) and found Aquinas's actual text much more nuanced and hedged than the deacon's summary.
      *   **Specific Confusions:**
          1.  Why the proviso about harm (prudential forecast vs. intrinsic justice)?
          2.  What does "disturbing" a government mean (assassination vs. uprising)?
          3.  How does this relate to the *Commentary on the Sentences* (which seems to allow tyrannicide under specific conditions)?
          4.  Are these two distinct scenarios?
          5.  **Goal:** A more accurate one- or two-sentence summary of Aquinas's actual view to replace the deacon's oversimplification.

  2.  **Deconstruct Aquinas's Position:**
      *   *Summa Theologiae* (ST) IIa–IIae, q. 42, a. 2 (Sedition):
          *   Context: Is sedition always a mortal sin?
          *   Objection 3 cites Cicero/Sallust: It's praiseworthy to free a multitude from a tyrant.
          *   Reply: Tyrannical rule is unjust (private good vs. common good). Therefore, disturbing it is *not* sedition (which is by definition against the common good/unjust).
          *   *Crucial Hedge:* "Unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government." (Proportionality/Prudence).
          *   *Accusation:* The tyrant is the real seditionist.
          *   *Note:* ST doesn't explicitly discuss *killing* the tyrant here, just "disturbing" the regime.
      *   *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2):
          *   Context: Earlier work (student level, but authoritative on development).
          *   Distinction: Tyrant by exercise (bad ruler) vs. Tyrant by defect/usurpation (seized power illegitimately).
          *   Ruling: If a usurper (no title), killing him is praiseworthy *if* no superior authority exists to judge him. If a legitimate ruler who becomes tyrannical, public authority (not private individuals) must act.
      *   *De Regno (On Kingship):*
          *   Also relevant. Aquinas argues against private assassination, preferring public removal or divine intervention, to avoid setting a bad precedent.

  3.  **Address the User's Specific Questions:**

      *   *Q1: The Proviso (Harm vs. Justice).* Is it just prudence or built into justice?
          *   *Answer:* It's teleological. For Aquinas, the "common good" is the standard of justice. If removing the tyrant destroys the common good (via civil war, anarchy, worse tyrant), then the act fails the telos of justice. It's not just "practical caution"; it's constitutive of the moral act. An act that causes greater evil is not just imprudent; it becomes disordered.
      *   *Q2: "Disturbing" vs. Killing.*
          *   *Answer:* In *ST*, "disturbing" is broad (rebellion, deposition). It doesn't explicitly authorize assassination. In *Sentences*, he distinguishes between a usurper (can be killed by private person if no judge) and a legitimate ruler turned tyrant (cannot be killed by private person). The deacon conflated these.
      *   *Q3: Distinct Scenarios?*
          *   *Answer:* Yes. Usurper (no title) vs. Legitimate Ruler (abuses title). Also Private Act vs. Public Authority.
      *   *Q4: Accurate Summary.*
          *   Needs to capture: 1. Tyranny is unjust. 2. Resistance is permissible *but*... 3. Must be by public authority (usually) or strictly limited (usurper). 4. Must not cause greater harm. 5. Assassination by private individuals is generally discouraged/forbidden unless specific conditions (usurpation + no judge) are met.

  4.  **Drafting the Response:**

      *   **Validation:** Acknowledge the user's sharp reading. The deacon *was* oversimplifying to the point of error. This is a common catechetical pitfall (soundbites vs. scholastic nuance).
      *   **The "Harm" Proviso:** Explain that for Aquinas, justice is about the *common good*. If the remedy kills the patient (the polity), it's not justice. It's not just "consequences matter," it's "the moral object includes the end."
      *   **The "Disturbing" vs. "Killing" Distinction:** Clarify that *ST* q.42 is about *sedition* (social discord), not specifically *tyrannicide*. The deacon jumped from "disturbing a regime" to "killing the guy."
      *   **The *Sentences* vs. *Summa* Development:** Address the *Sentences* quote. Aquinas *did* write that, but later (in *De Regno* and implicitly in *ST*) he became more cautious about private assassination because it invites chaos. The *Sentences* view is narrower (usurpers only, no other recourse).
      *   **Public vs. Private Authority:** This is the key Thomistic constraint. Private individuals generally cannot execute public justice.
      *   **The Summary:** Craft the requested 1-2 sentences.
          *   *Draft 1:* Aquinas says tyranny is unjust and can be resisted, but not by private assassination unless it's a usurper with no judge, and never if it causes more harm than the tyranny.
          *   *Refinement:* Needs to be more precise. "Aquinas distinguishes between a usurper, whom a private citizen may kill if no public authority exists to judge him, and a legitimate ruler who becomes tyrannical, whose removal requires public authority; in either case, resistance is only licit if it does not inflict greater harm on the common good than the tyranny itself."

  5.  **Refining the Tone:**
