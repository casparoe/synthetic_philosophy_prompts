      *   *The Deacon's Error:* The deacon said "whoever does the killing deserves praise." Aquinas specifically warns against this in *De Regno* (it sets a bad example, leads to killing good kings). I must mention this warning.
      *   *Catechism Check:* Briefly mention that modern Catholic teaching (CCC 2242) is even stricter (armed resistance only as last resort, strict conditions), to contextualize the deacon's statement within current Church teaching too. (Decided to keep this brief so as not to derail the Aquinas focus, but good to keep in mind).

  8.  **Final Polish:** Organize into clear sections: The Proviso, The Act (Disturbance vs. Killing), The Two Scenarios, and The Summary. (Proceed to generate output).

