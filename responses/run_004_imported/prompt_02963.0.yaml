answer: |-
  The alarm wasn't a siren; it was a quiet, rhythmic thrumming of the containment locks engaging. Inside the BSL-4 suite, the optical density sensors were screaming, but the fluorescence markers were dead.

  "It's growing," Mara said, her voice tight. She didn't look up from the console. "Syn-7 is dividing. But the toxin isn't expressing."

  Elias leaned against the cold glass of the observation window. He was seventy-two, his hands spotted with age, but his eyes were still sharp enough to read a western blot at twenty paces. Since retiring, he'd traded pipettes for paperbacks—Maynard Smith, Godfrey-Smith, Sarkar. He'd spent forty years treating DNA as a molecule; now he couldn't stop seeing it as a text.

  "The UAG codon," Elias said. "You reassigned it to the synthetic amino acid, but you kept the release factor as a kill switch. If the ribosome hits UAG without the synthetic tRNA, it triggers the caspase."

  "Exactly," Mara snapped. "Chemical necessity. No tRNA means no translation, the ribosome stalls, the rescue system triggers the toxin. It's physics. It has to die."

  "But it's not dying."

  "It's a mutation. A suppressor tRNA popped up. Stereochemical workaround." Mara was typing furiously, pulling up sequence data. "I'm going to flood the medium with a competitive inhibitor for the suppressor. Force the steric clash."

  Elias pushed off the glass. "Don't."

  "We have twenty minutes before the pressure differential fails, Elias. If this strain gets into the sewage, the horizontal gene transfer alone—"

  "If you flood it with inhibitors, you're assuming the problem is binding affinity," Elias said. "You're treating the genome like a lock and key. Sarkar would love that. Just chemistry. Causation without interpretation."

  Mara spun her chair around. "And what would Maynard Smith say? That the bacteria *decided* to live? That the codon has *intent*?"

  "I'm saying the mapping is arbitrary," Elias said, stepping closer to the screen. "Crick's Frozen Accident. The link between codon and amino acid isn't chemical law; it's a historical agreement. In your synthetic system, you changed the agreement. But selection pressure is a brutal editor. If the cell faces death at the UAG site, and there is *any* variance in how that triplet is read, the survivors will be the ones that reinterpreted the symbol."

  "It's a nucleotide triplet, not a word!"

  "It's a symbol with a function assigned by the system," Elias countered. "If the system changes to preserve the organism, the meaning changes. You built a kill switch, but you built it inside a semantic network. You can't fix a semantic error with a chemical wrench."

  The thrumming of the locks grew faster. The pressure gauge on the wall ticked upward. Syn-7 wasn't just growing; it was pressurizing the vessel.

  "If I don't add the inhibitor," Mara said, her hand hovering over the injection port, "we have to purge. Incinerate the whole bioreactor. We lose the strain. We lose three years of work."

  "If you add the inhibitor, and I'm right, it won't touch the mechanism. The ribosome isn't stalling because it can't bind. It's not binding because it's been told not to."

  "That's mysticism."

  "It's information theory," Elias said. "Look at the rescue system logs. Is the ribosome stalling?"

  Mara paused. She pulled up a different graph. "No. Translation is proceeding smoothly. High efficiency."

  "Then it's not a chemical blockage. The ribosome isn't stuck. It's reading the UAG as 'continue'."

  "That's impossible. The release factor is still there."

  "The release factor is the reader," Elias said softly. "But the reader is part of the cell. The cell is the context. Under extreme selection pressure, the context shifted. The UAG no longer means 'stop/toxin' to this population. It means 'survive'. The mapping has drifted. It's a new dialect."

  Mara stared at the screen. The optical density curve was exponential. "So the inhibitor won't work."

  "No. You'd be trying to shout down a conversation by throwing rocks at the speakers."

  "So we purge." Mara's finger moved toward the red button.

  "Wait," Elias said. "If it's a code, it can be rewritten. If it's just chemistry, we have to destroy it. But if it's information, we can send a reset packet."

  "We don't have a packet."

  "The heat shock promoter," Elias said. "Induce a stress response. Not enough to kill, just enough to force the chaperones to refold the translation machinery. Force the cell to re-evaluate the syntax."

  Mara hesitated. "That's speculative. If the mapping is fixed chemically, heat shock does nothing but speed up growth."

  "If the mapping is frozen accident, it's stable only so long as the system is stable. You broke the stability with the kill switch. Break it back."

  The pressure light turned amber. Ten minutes.

  Mara looked at the inhibitor vial in her hand, then at the console. She was a chemist by training; she believed in bonds, in forces, in things that touched. Elias believed in the ghost in the machine, the pattern that survived the substrate.

  "If this fails," Mara said, "I purge. Immediately."

  "Agreed."

  She keyed in the command. The heating coils in the bioreactor hummed. The temperature rose by four degrees.

  For thirty seconds, nothing happened. The pressure continued to build. The amber light blinked red.

  Then, the optical density line flatlined.

  Mara held her breath. On the fluorescence monitor, a spike appeared. Green light flooded the graph. The caspase was firing. The cells were dying.

  "Why?" Mara whispered. "What changed?"

  "The context," Elias said, watching the death curve plummet. "The heat shock disrupted the translational fidelity enough that the 'new meaning' of UAG became too costly. The system reverted to the standard grammar to survive the stress. The kill switch became legible again."

  Mara slumped back in her chair. The locks disengaged with a hiss of equalizing pressure. The crisis was over.

  "It's just chemistry," Mara said, though her voice lacked conviction. "The chaperones unfolded the suppressor tRNA. That's all."

  Elias looked at the dead culture in the tank. He thought about the arbitrary link between the triplet and the amino acid, a link that held firm for billions of years until a human tried to weaponize it. He thought about how the cell had, in a few days, evolved a new definition for a symbol to save its own life.

  "Maybe," Elias said, turning away from the window. "But you can't explain why it happened without admitting the cell was reading the page, not just reacting to the ink."

  He walked toward the decontamination shower. The stakes had been real. The distinction mattered. If it were just chemistry, they would have drowned it in inhibitors and failed. Because it was a code, they had to argue with it.

  As the water sprayed over his suit, Elias wondered if the cell had understood the argument, or if it had simply run out of synonyms. He wasn't sure which answer scared him more.
