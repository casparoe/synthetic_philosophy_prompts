      *   No lecture? Keep the philosophy in the subtext and character motivation.

  10. **Final Polish:** Check the flow. Ensure the ending resonates with the "Frozen Accident" vs. "Selection" debate. The cell *chose* (via selection) to change the meaning. That validates Maynard Smith over Sarkar in this instance.

  *(Self-Correction during drafting)*: Avoid making Elias sound like a wizard. He's an old scientist. His insight comes from experience + philosophy. Make sure Mara isn't a villain, just a pragmatist.

  *(Final thought on the ending)*: The story should end with the realization that they are dealing with *information*, not just matter. The stakes are that you can't control information with wrenches.

