      *   **Section 4: The Verdict.** Take the side. Abolition is impossible/dangerous. But the Functionalist acceptance is too complacent. The middle path: *Abolish Party Discipline, not Parties.* Use Weil's moral standard to judge the *behavior* of parties, not their existence.
