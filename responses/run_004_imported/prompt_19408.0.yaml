  3.  **Deconstruct the Functionalist/Defense of Parties (The Antithesis):**
      *   *Premise 1: Scale and Complexity.* Modern states are too big for direct deliberation by all.
      *   *Premise 2: Coordination.* Parties reduce transaction costs. They bundle issues so voters don't need to research every candidate's stance on every issue (Branding).
      *   *Premise 3: Accountability.* If things go wrong, you know who to blame (The Incumbents). Without parties, blame is diffuse.
      *   *Premise 4: Madisonian Reality.* Factions are inevitable. Suppressing them suppresses liberty. Better to pit them against each other (checks and balances).

