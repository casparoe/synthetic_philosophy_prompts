prompt: |-
  I'm working on a novel based loosly on my great-grandmother's diary, about a mine disaster in the early 1900s (Ive changed the names and the town, but the emotional core is real). The diary says the foreman was warned that morning about gas building up in the shaft and sent the men down anyway, and that the company scrubbed every record of the warning afterward. There's no source for that warning except her account, written decades later. I've got a line in my author's note calling this detail "true," and two people in my writing group really got into it over that after our last session.

  Marisol said of course I can call it true -- we take people's word for things constantly without independently checking, and holding a family's own oral history to a higher standard than we hold basically everything else we believe is a weird, arbitrary bar.

  Deb said the everyday cases work because we've got a mountain of background experience that people are generally reliable about that kind of claim -- but a single, decades-later, emotionally loaded account from someone with every reason to want it to be true is exactly the case where you'd want something independent, and "no official record survives" fits a cover-up just as well as it fits a detail that crept in somewhere over fifty years of retelling.

  Marisol shot back that this proves too much: our background sense that people are usually reliable is itself mostly built out of more testimony we never personally checked, so if that disqualifies a claim, almost nothing we believe survives.

  Deb said fine, that's fair, but vague doesn't mean anything goes -- wherever exactly the line is, an uncorroborated, high-stakes, fifty-year-old family story sits way on the weak side of it.

  They both want me to referee and I honestly can't tell who's winning. Can you go through the exchange and say who's right at each point, not just overall, and mention anything you think they're both missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel based on a great-grandmother's diary about an early 1900s mine disaster.
      *   **Conflict:** A specific detail (foreman warned about gas, sent men down anyway, records scrubbed) is in the diary (written decades later) but has no other source.
      *   **The Dispute:** Two writing group members (Marisol and Deb) are arguing about whether the author can call this detail "true" in the author's note.
      *   **Task:** Evaluate the exchange point-by-point (who is right at each step), determine if there's an overall "winner," and identify what both might be missing.
      *   **Tone:** Objective, analytical, nuanced, helpful to a writer.

  2.  **Deconstruct the Arguments:**

      *   **Marisol's Core Argument:** Epistemic humility/egalitarianism. We accept testimony all the time without verification. Holding family oral history to a higher standard than general historical consensus is arbitrary.
      *   **Deb's Core Argument:** Epistemic rigor/contextual reliability. General testimony works because of background reliability. Specific, high-stakes, uncorroborated, decades-later testimony from an interested party is inherently less reliable. "No record" is ambiguous (cover-up vs. non-event).
      *   **Marisol's Rebuttal:** Infinite regress argument. Our belief in general reliability is *also* based on unchecked testimony. If we demand independent verification for everything, skepticism wins too broadly.
      *   **Deb's Rebuttal:** Concedes the philosophical point but maintains the practical distinction. Vague standards don't mean *no* standards. This specific claim falls on the "weak" side of the spectrum.

  3.  **Evaluate Point-by-Point:**

      *   *Point 1: Marisol (We accept testimony constantly).*
          *   **Verdict:** Philosophically strong, practically risky for a historical novel. She is right about how humans function socially, but maybe less right about the ethics of historical non-fiction/faction.
      *   *Point 2: Deb (Background experience vs. specific high-stakes claim).*
          *   **Verdict:** Stronger on historical methodology. Distinguishes between "I believe my neighbor saw a bird" and "I believe my neighbor's great-grandmother's claim of corporate manslaughter."
      *   *Point 3: Marisol (Infinite regress/Skepticism proves too much).*
          *   **Verdict:** Philosophically sound (Pyrrhonian skepticism). She wins the logic game here. If we can't trust unchecked testimony, we can't trust history books either.
      *   *Point 4: Deb (Practical distinction/Weight of evidence).*
