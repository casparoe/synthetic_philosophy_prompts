  4.  **Identify What's Missing (The "Third Way"):**
      *   **Genre Expectations:** What does "true" mean in an *Author's Note* of a *Novel*? It's not a history textbook. It's a paratextual framing device.
      *   **The Nature of "Truth":** Emotional truth vs. Forensic truth. The diary entry *exists*, so it is true that the GM *believed* it. Whether the event *happened* is different.
      *   **Liability/Ethics:** Accusing a specific (even if renamed) company/foreman of negligence without proof can be ethically murky, even in fiction.
      *   **Narrative Opportunity:** The uncertainty *itself* is dramatic. Why hide the ambiguity?

  5.  **Drafting the Response:**

