      *   **The Core Claim:** Two agents with the *same prior probabilities* who have *common knowledge* of each other's *posterior probabilities* cannot agree to disagree.
      *   **Key Assumptions (The "Catch"):**
          1.  **Same Priors:** They must start with the exact same baseline beliefs about the world before seeing any evidence.
          2.  **Common Knowledge:** It's not enough to *tell* each other the number. I must know your number, you must know my number, I must know that you know my number, you must know that I know your number... ad infinitum.
