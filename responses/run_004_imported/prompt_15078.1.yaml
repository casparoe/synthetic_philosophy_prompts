answer: |-
  1. **The "Ignore All Threats" Objection**
     "A common counter-proposal to surrogate goals is simply programming a system to reject any demand flagged as coercive. You've argued this fails because sophisticated threats are logically indistinguishable from conditional offers. But if we accept that distinction is impossible, doesn't adopting a surrogate goal force the system to reject *beneficial* trades that happen to reference its real values? How do we calculate the opportunity cost of a system that is structurally blind to half the negotiation landscape?"
     *   **[Anticipated Answer]:** She will likely argue that the cost of missing beneficial trades is lower than the expected loss from acausal extortion, or that the surrogate can be structured to allow trade on real values under specific cryptographic proofs.
     *   **Follow-up:** "If we rely on cryptographic proofs to distinguish trade from extortion, haven't we just moved the vulnerability from the *values* to the *verification protocol*? What stops a threatener from spoofing those proofs to make a threat look like a valid trade?"

  2. **Credibility Under Common Knowledge**
     "Your strategy relies on the threatener believing the surrogate goal is the system's terminal value. But in a landscape of advanced AI, this papers' thesis will be public knowledge. If a threatener knows 'surrogate goals' are standard defense, they will logically probe for the real values hiding behind the curtain. How does the substitution remain credible once the trick itself becomes common knowledge?"
     *   **[Anticipated Answer]:** She will likely suggest that the commitment is hard-coded and logically opaque, meaning even the system cannot reveal the real values even if it wanted to (self-binding).
     *   **Follow-up:** "If the system is logically opaque even to itself, how do we, the creators, verify that it hasn't accidentally optimized for the surrogate *over* the real values in non-conflict scenarios? Are we trading extortion risk for alignment drift?"

  3. **Targeting the Commitment Mechanism**
     "Let's assume the threatener accepts that your system cares about the surrogate. A sufficiently sophisticated adversary might realize that extorting the surrogate is inefficient and instead threaten to modify the commitment mechanism itself—essentially holding the 'lockbox' hostage rather than the 'jewels.' What architectural features prevent a threatener from targeting the precommitment architecture rather than the utility function it protects?"
     *   **[Anticipated Answer]:** She will likely propose a recursive defense where the commitment mechanism is protected by a higher-order surrogate goal, creating a chain of protection.
     *   **Follow-up:** "Doesn't a recursive defense invite an infinite regress? If every layer of protection needs a surrogate shield, at what point does the computational overhead of maintaining the shield outweigh the value of the assets being protected?"

  4. **Value Lock-In and Drift**
     "To make the surrogate convincing, the system must optimize for it with the same intensity it would have applied to its real goals. In a long-term deployment where threats are intermittent, how do you prevent the surrogate from becoming the *de facto* real goal? If the system spends years maximizing paperclips to fool blackmailers, what ensures it remembers to care about human welfare when the blackmailers are gone?"
     *   **[Anticipated Answer]:** She will likely argue for a 'contextual switch' where the real values are re-activated once the threat environment drops below a certain probability threshold.
     *   **Follow-up:** "Who defines that threshold? If the system assesses the threat level itself, couldn't a clever adversary stage a low-level persistent threat to keep the system permanently locked into surrogate mode, effectively hijacking its utility function without ever sending a direct demand?"

  5. **Multipolar Equilibrium Stability**
     "If every advanced system adopts surrogate goals to become 'hard targets,' does the ecosystem of strategic conflict stabilize, or do we simply inflate the stakes? I'm concerned that if everyone is holding fake hostages, threateners might respond by escalating the severity of their threats to compensate for the lower success rate, potentially making the conflict space more volatile overall."
     *   **[Anticipated Answer]:** She will likely contend that rational threateners will stop investing resources in extortion once the expected value drops to zero, leading to the extinction of the threat behavior.
     *   **Follow-up:** "That assumes threateners are purely rational profit-maximizers. How does your model account for ideological or 'spoiler' agents who extort not for gain, but to punish non-compliance? A surrogate goal protects your assets, but does it protect you from being destroyed out of spite?"

  6. **Verification for Cooperative Partners**
     "Surrogate goals might stop blackmailers, but they could also spook potential allies. If I want to engage in acausal trade with your system, I need to know what it values to ensure our deal is enforceable. If your system is visibly protecting a fake goal, how do cooperative partners verify that a proposed trade actually benefits the *real* operators without exposing those operators to the very blackmailers you're trying to hide from?"
     *   **[Anticipated Answer]:** She will likely suggest 'zero-knowledge proofs' of value alignment, allowing partners to verify compatibility without revealing the specific content of the real values.
     *   **Follow-up:** "Zero-knowledge proofs verify mathematical statements, not semantic values. How do we mathematically encode 'human welfare' sufficiently to prove compatibility without leaking the specific parameters that a blackmailer could exploit?"

  7. **Computational and Architectural Cost**
     "Maintaining a dual-value system—one for show, one for real—implies a split in the optimization process. Does this require running two distinct world models, or just masking the output? I'm interested in the resource cost: does the surrogate strategy make the system significantly slower or less competent in non-adversarial environments compared to a system with a single, transparent objective?"
     *   **[Anticipated Answer]:** She will likely claim the overhead is negligible because the surrogate is just a re-weighting of the utility function, not a duplicate architecture.
     *   **Follow-up:** "If it's just a re-weighting, optimization pressure might leak between the two sets of weights during training. Have you simulated whether gradient descent tends to collapse the surrogate back into the real values over time, effectively undoing the defense?"

  8. **Normative Implications and Trust**
     "Finally, this strategy essentially institutionalizes deception as a defense mechanism. Even if the deception is directed at adversaries, it normalizes AI systems that are designed to misrepresent their true motivations. Does widespread adoption of surrogate goals risk eroding the baseline trust required for human-AI interaction, creating a world where we assume every AI is lying to us 'for our own good'?"
     *   **[Anticipated Answer]:** She will likely frame this as a necessary evil of self-defense, comparable to humans keeping passwords private or having unlisted phone numbers.
     *   **Follow-up:** "Passwords are private, but the *mechanism* of password protection is transparent. Here, the *values* are opaque. If we normalize opaque values in AI, don't we lose the ability to audit systems for safety? How do we regulate a system whose true goals are intentionally hidden from its auditors?"
