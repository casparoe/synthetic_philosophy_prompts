answer: |-
  Here are ten interview questions designed for a specialist audience, focusing on technical objections and metaphysical implications rather than introductory exposition.

  **1. The Truth-Functionality Cost**
  On the supervaluationist account, the law of excluded middle holds globally even when neither disjunct is supertrue. This preserves classical validity, but it severs the link between the truth of a disjunction and the truth of its disjuncts. Critics argue this forces you to abandon truth-functionality, making the semantic value of a complex sentence dependent on more than just the semantic values of its parts. If "truth" no longer tracks compositional semantics, aren't you effectively redefining the word "truth" to mean "validity-preserving" rather than "world-matching"?
  *Follow-up:* You'll likely reply that preserving classical logic is worth the cost of truth-functionality. But if the property we care about for assertion and belief is the world-matching one, doesn't this render "supertruth" practically inert for guiding action, since the world doesn't match the disjunction in virtue of matching a specific disjunct?

  **2. Supervaluationism vs. The Thin Red Line**
  A rival approach posits a "Thin Red Line"—a single, actual future history among the branching possibilities—which preserves bivalence without committing to determinism. You reject this, presumably because it privileges one branch metaphysically. But why can't the privilege be semantic rather than metaphysical? If we treat the actual future as indexical to the moment of utterance, couldn't we keep bivalence intact without claiming the future is causally determined?
  *Follow-up:* I anticipate you'll argue that a Thin Red Line undermines the genuine openness of the future. However, if the branching structure is real, isn't the "openness" already secured by the metaphysics of branching time, rendering the semantic gap redundant? Why does openness require a truth-value gap rather than just a lack of causal necessitation?

  **3. Retroactive Truth-Fixing**
  Consider a statement made today: "There will be a sea battle tomorrow." On your view, this is currently neither true nor false. Suppose a battle occurs tomorrow. Did the statement *become* true, or was it true all along and we just couldn't access that value? If it became true, you seem committed to the idea that truth-values can change retroactively. If it was true all along, doesn't that collapse back into the bivalent view you reject?
  *Follow-up:* You will likely say truth is relative to a history, so the statement is true-relative-to-the-actual-history. But if the "actual history" wasn't fixed at the time of utterance, doesn't this mean the truth-condition of the utterance itself shifts? How do we avoid the conclusion that the *proposition expressed* changes once the gap closes?

  **4. The Norm of Assertion**
  Ordinary speakers flatly assert future contingents like "It will rain tomorrow" without hedging, even when the outcome is genuinely contingent. If your semantics is correct, most of these assertions express propositions that are neither true nor false. Given the standard norm that one should assert only what is true, doesn't your view imply that ordinary discourse is systematically flawed or irrational?
  *Follow-up:* You might propose a relaxed norm, such as "assert what is determinately true" or "assert what is highly probable." But if we can successfully communicate using a relaxed norm, what theoretical work is the truth-value gap actually doing? Does this reduce supervaluationism to a pragmatic account disguised as a semantic one?

  **5. Divine Foreknowledge**
  If future contingents lack a truth-value, then there is no fact of the matter for an omniscient being to know. This suggests that on your view, God (or any omniscient agent) cannot know the outcome of future contingents. Does this force you to accept a limitation on omniscience, or must you redefine omniscience as "knowing all *truths*" (where future contingents are excluded)?
  *Follow-up:* If you choose the redefinition strategy, critics will argue this is ad hoc—a "no-true-Scotsman" defense of omniscience. If God cannot distinguish between a future where a battle happens and one where it doesn't, isn't that a substantive limitation on knowledge regardless of whether we label the missing content "truths"?

  **6. The Behavior of Conditionals**
  Supervaluationism is notorious for its treatment of conditionals. McGee has argued that supervaluationism validates Modus Ponens but invalidates Conditional Proof, or vice versa depending on the formulation. If I say, "If there is a sea battle, there will be violence," and "There will be a sea battle," I should be able to infer "There will be violence." But if the antecedent is indeterminate, does your semantics block this inference? How do you handle the probability of conditionals when the antecedent lacks a truth-value?
  *Follow-up:* You may argue that we must restrict classical rules in indeterminate contexts. But if we have to restrict basic inference rules like Conditional Proof in ordinary reasoning about the future, doesn't that make the logic too weak to model actual reasoning, where we constantly reason *from* hypothetical futures?

  **7. The "Determinately" Operator**
  To handle higher-order vagueness or indeterminacy, supervaluationists often introduce a "Determinately" operator ($D$). If $p$ is indeterminate, then $\neg Dp$ and $\neg D\neg p$. But is it determinately indeterminate? If you iterate the operator, do you face a regress where it's never determinately settled that a value is indeterminate? Does your system require a sharp cutoff between the determinate and the indeterminate, thereby reintroducing the precision you sought to avoid?
  *Follow-up:* If you deny a sharp cutoff for the $D$ operator, you seem to need a supervaluationist semantics for the $D$ operator itself. Does this force you into a hierarchy of meta-languages to evaluate determinacy, and if so, how do speakers ever grasp the semantics of their own object language?

  **8. Past Fixity and "Was Going To"**
  If the future is open, what happens to past-tense claims about the future? Consider the statement made yesterday: "Tomorrow was going to be a battle." If today turns out peaceful, was that statement false yesterday, or does it become false today? If the past is fixed, it seems the truth-value of past statements about the future must be fixed too. Does your view imply that the past itself changes its truth-conditions as the future settles?
  *Follow-up:* You will likely distinguish between the "past future" and the "actual future." But if the proposition "It was going to happen" is false now, wasn't it also false *then*, given that the possibility of failure existed then? Doesn't this imply that we were never justified in claiming the future was open, even retrospectively?

  **9. Epistemicism about Future Contingents**
  Why prefer truth-value gaps over epistemicism? An epistemicist could argue that "There will be a sea battle" is either true or false right now, determined by the current state of the world and laws, but simply unknowable to us. This preserves classical semantics without requiring gaps. What is the specific metaphysical commitment that makes the gap view superior to the ignorance view?
  *Follow-up:* You'll argue that epistemicism implies determinism. But if the laws are indeterministic, the truth-value could be grounded in a propensity or chance rather than a deterministic cause. Why isn't an indeterministic ground sufficient for a truth-value, rendering the gap unnecessary?

  **10. Classical Logic in the Metalanguage**
  Supervaluationism uses classical logic to define the set of histories over which quantification occurs to determine supertruth. You use classical logic in the metalanguage to validate a non-bivalent object language. Is this stable? If the object language reflects the fundamental indeterminacy of reality, why is the metalanguage exempt? Does this suggest that indeterminacy is merely a feature of our representation, not the world?
  *Follow-up:* If you concede the metalanguage must be classical for the theory to be intelligible, doesn't that imply that "indeterminacy" is ultimately ineffable? We can only talk *about* the gaps using a logic that assumes there are no gaps, which seems to undermine the ontological significance of the view.
