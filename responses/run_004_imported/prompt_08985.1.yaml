  **Final Note for Your Feature**

  Since you are writing about how DDE resurfaces in autonomous weapons and drone strikes, this student's error is actually a perfect cautionary tale for your piece.

  In contemporary discourse, people often use DDE as a **shield**: *"We didn't intend to kill those civilians; it was a foreseen side effect, and the military gain was proportional."*
  Anscombe uses DDE as a **sword**: *"You claim it was a side effect, but your strategy relied on their destruction to force surrender; therefore, you intended it, and the act is murder."*

  If you conflate "proportionality" (was the collateral damage worth it?) with "intention" (was the collateral damage the method?), you will reproduce the very consequentialist reasoning Anscombe sought to destroy. Ensure your article makes clear that for Anscombe, if the civilians are the *means*, the math doesn't matter.

  Well done on catching the historical thread, but be careful not to let the modern "collateral damage" framing distort the stricter moral logic of the 1956 text.
