  Here is the assessment you requested. I have adopted the persona of the Oxford tutor: rigorous, precise, and focused on the philosophical mechanics rather than just the historical narrative.

  ***

  **Assessment of Tutorial Essay: Anscombe and *Mr Truman's Degree***

  **Grade:** C+ (Lower Second Class / 2:2)
  **Mark:** 12 / 20

  **Tutor's Commentary**

  This is a competent piece of writing that demonstrates you have done the background reading regarding the historical outcome of the controversy. You clearly understand the stakes of the debate and have a strong intuitive grasp of Anscombe's hostility toward consequentialism. However, as a philosophical reconstruction, the answer contains a significant category error regarding how Anscombe deploys the Doctrine of Double Effect (DDE). You have conflated the *conditions* for applying DDE with the *intrinsic nature* of the act itself. In a tutorial setting, this distinction is the difference between a pass and a distinction.

  Below is a point-by-point breakdown of your claims:

  **1. "Her campaign was in fact successful... Truman never received the degree."**
  *   **Verdict:** **Correct.**
  *   **Comment:** Historically accurate. The Hebdomadal Council voted to postpone the degree indefinitely following Anscombe's intervention, and it was never awarded. This is a solid opening.

  **2. "Her case rests on the scholastic doctrine of double effect, which distinguishes two ways a bad effect can be related to an action..."**
  *   **Verdict:** **Correct (in abstract).**
  *   **Comment:** Your definition of DDE is technically sound. You correctly identify the distinction between intended ends/means and merely foreseen side effects. This shows you understand the tool Anscombe is holding, even if you misunderstand how she uses it in this specific instance.

  **3. "Anscombe's central complaint was that the scale of civilian death... was wildly disproportionate... failed the proportionality test any legitimate instance of side-effect killing has to satisfy."**
  *   **Verdict:** **Clear Error.**
  *   **Comment:** This is the critical philosophical mistake. Anscombe does not argue that the bombings failed the *proportionality* condition of DDE (i.e., that the good didn't outweigh the bad). She argues that DDE *cannot apply at all* because the killing of the civilians was **intended** as a means to force surrender, not merely foreseen.
  *   **Why this matters:** For Anscombe, the killing of innocents is intrinsically evil (*malum in se*). DDE only permits side effects if the act itself is good or neutral. If the act is murder (killing innocents intentionally), no amount of "proportionality" can justify it. By framing her argument as a failure of proportionality, you imply that if fewer civilians had died, the bombing might have been permissible under her view. Anscombe would reject this; the intentional targeting of innocents is forbidden regardless of the numbers.

  **4. "Even setting the intention behind the bombings aside..."**
  *   **Verdict:** **Subtly Off / Misleading.**
  *   **Comment:** You cannot set the intention aside in Anscombe's framework. The moral species of the act is determined by the intention. If the intention is to kill civilians to end the war, the act is murder. Anscombe's pamphlet is specifically an attack on the idea that we can look *only* at the outcome (the end of the war) and ignore the intentional structure of the act.

  **5. "This is also where her wider quarrel with consequentialism comes in: she thought that once you let yourself weigh a large number of enemy lives against a smaller number of your own soldiers' lives..."**
  *   **Verdict:** **Correct (in spirit).**
  *   **Comment:** This is the strongest part of your answer. You correctly identify that Anscombe's objection is deontological, not calculative. She rejects the "weighing" itself.
  *   **Critique:** However, this creates an internal contradiction in your essay. In point #3, you claim she argued the bombings failed a "proportionality test" (which *is* a form of weighing). In point #5, you say she rejects weighing entirely. You need to reconcile this: She rejects the consequentialist weighing *because* it violates the absolute prohibition against intending the death of innocents.

  **6. "...it is only a short step from there to justifying the deliberate killing of civilians whenever the numbers are judged to favour it."**
  *   **Verdict:** **Correct.**
  *   **Comment:** This accurately captures the thrust of her later paper, *Modern Moral Philosophy* (1958), and how *Mr Truman's Degree* serves as a practical precursor to it. You understand that for Anscombe, consequentialism dissolves the concept of "justice" into "management."

  ***

