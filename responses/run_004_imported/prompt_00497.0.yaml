      *   *Refining the "Engagement" Constraint:* I need to make sure Alex doesn't just say "No, coherence matters." Alex needs to say, "I see your point about routing around, but here's why your solution breaks the coherence." And Sarah needs to say, "I see your point about coherence, but here's why indifference is the only safe path."

