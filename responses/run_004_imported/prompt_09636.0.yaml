          *   *Chalmers's Reply:* Chalmers does accept a form of epiphenomenalism (qualia don't cause physical events). He posits "psychophysical laws" to explain the *correlation* between judgment and experience. In *The Conscious Mind*, he suggests a kind of "double-aspect" theory or panpsychism later to mitigate this, but strictly speaking, in the zombie argument context, he accepts the causal closure of the physical.
