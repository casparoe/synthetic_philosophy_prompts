      *   *Alternative Hypothesis:* Is the "Third Party" the *abstraction itself*? No, the text says the public levels *with the help of* a third party. So Public + Third Party = The Mechanism. The Third Party is the agent of action (the dog).
      *   *Conclusion on Roles:*
          1.  **The Victim:** The exceptional individual (SK).
