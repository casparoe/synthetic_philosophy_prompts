      *   *Clarify "Risk Aversion":* In EU, risk aversion is *derivative* of diminishing marginal utility. In REU, risk aversion can be *primitive* (via $r$) even if $u$ is linear. This is a key distinction.
      *   *Make sure to mention "Global vs. Local":* EU evaluates prospects outcome-by-outcome weighted by probability. REU evaluates the *structure* of the risk.

  6.  **Final Polish:**
      *   Tone: Supportive, academic but accessible (quals prep style).
