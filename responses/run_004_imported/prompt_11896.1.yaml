          5.  Quick Allais Demo.

  7.  (Mental Check against Buchak's specific claims): Buchak argues that risk-weighting is a distinct rational attitude. She explicitly argues against the "reduction" of risk aversion to utility curvature. The explanation must highlight this separability thesis.

