answer: |-
  This is an ambitious and philosophically significant project. Harsanyi's Aggregation Theorem is indeed one of the central pillars of modern welfare economics and moral philosophy. Your interpretation of the formal result is broadly correct: **if** you accept the von Neumann-Morgenstern (vNM) axioms for both individuals and society, **and** you accept the Strong Pareto Principle, **then** the Social Welfare Function (SWF) must be a linear combination of individual utilities (Utilitarianism).

  However, claiming that prioritarian or egalitarian opponents are "confused" is a very strong rhetorical move. In the academic literature, the consensus is not that these opponents have missed a mathematical proof, but rather that they reject one or more of the **normative interpretations** of the theorem's premises. To write a successful paper, you cannot simply assert the theorem; you must defend the *interpretation* of the theorem's variables against specific, sophisticated challenges.

  Here are the four strongest objections a prioritarian (drawing on work by philosophers like John Broome, Marc Fleurbaey, Alex Voorhoeve, and Matthew Adler) will raise against your argument. If you can address these, your paper will be significantly stronger.

  ### 1. The Distinction Between vNM Utility and Moral Welfare
  This is the most critical technical objection. Harsanyi's theorem operates on **vNM utility functions**, which represent an individual's attitude toward risk. Prioritarianism operates on a concept of **moral welfare** (or well-being).

  *   **The Objection:** A prioritarian will argue that vNM utility is not the same thing as the "currency" of justice.
      *   vNM utility measures the strength of preference under uncertainty. If I am risk-averse, my vNM utility function is concave.
      *   Prioritarianism argues that we should maximize the sum of a *concave transformation* of well-being.
      *   **The Clash:** If you use vNM utilities as the input for the SWF, and the individual is already risk-averse, their utility function is *already* concave. If society then applies a prioritarian weighting, it might look like "double counting" risk aversion. However, the prioritarian argues that **social risk aversion** (concern for inequality) is distinct from **individual risk aversion** (prudence).
  *   **Why this threatens your argument:** Harsanyi's theorem proves society must sum *vNM utilities*. It does not prove society must sum *well-being*. If vNM utility $\neq$ well-being, then Harsanyi proves Utilitarianism about *preferences*, not Utilitarianism about *justice*. A prioritarian can accept Harsanyi's math but argue that the "utility" in the theorem is the wrong metric for distributive justice.
  *   **How to address it:** You need to argue that vNM utility is the only empirically meaningful measure of individual good available for the calculus, or that any distinction between "preference satisfaction" and "well-being" collapses under the axioms of rational choice.

  ### 2. Ex Ante vs. Ex Post Pareto (The Diamond Critique)
  Your argument relies heavily on the Pareto Principle. However, in contexts of uncertainty, there are two versions of Pareto, and they can conflict.

  *   **The Objection:**
      *   **Ex Ante Pareto:** If every individual prefers Prospect A to Prospect B (based on their expected utility), Society should prefer A to B. Harsanyi relies on this.
      *   **Ex Post Pareto:** If in every possible state of the world, the outcome of A is socially preferable to the outcome of B, Society should prefer A to B.
      *   **Peter Diamond's Example:** Imagine a single indivisible good (e.g., a kidney) and two patients who need it equally.
          *   *Option 1 (Utilitarian/Harsanyi):* Give it to Patient 1 with 50% probability, Patient 2 with 50% probability. (Expected utility for each = 0.5).
          *   *Option 2 (Egalitarian):* Flip a coin to decide who gets it. (Expected utility for each = 0.5).
          *   Wait, that's not the conflict. The conflict arises when we compare a certain unequal distribution vs. a risky equal distribution.
          *   *Better Example:* Two people. Option A: Person 1 gets 10, Person 2 gets 0 (Certain). Option B: 50% chance (10, 0), 50% chance (0, 10).
          *   Both individuals might prefer Option B (due to risk neutrality or the fair chance). Ex Ante Pareto says Society must prefer B. But Ex Post, Option A is arguably better than the realized outcome of (0,0) if that were possible, or simply that Option A avoids the risk of someone getting nothing.
      *   Prioritarians often argue that **Ex Ante Pareto** is too strong when it forces society to endorse lotteries that create unfair ex post inequalities. They may accept Ex Post Pareto but reject Ex Ante Pareto.
  *   **Why this threatens your argument:** Harsanyi's theorem requires Ex Ante Pareto. If a prioritarian rejects Ex Ante Pareto in favor of a principle that cares about the *realized distribution* of outcomes (Ex Post), they can block the derivation of Utilitarianism without being "irrational."
  *   **How to address it:** You must defend Ex Ante Pareto as a requirement of respect for individual sovereignty. If you deny Ex Ante Pareto, you are saying "I know you prefer this gamble, but the State knows better," which is paternalistic.

  ### 3. The "Common Scale" and Interpersonal Comparability
  Harsanyi's theorem assumes that individual utility functions are cardinally measurable and unit-comparable (up to a common scale).

  *   **The Objection:** The vNM axioms only guarantee that utility is unique up to a positive affine transformation ($U' = aU + b$). To sum them ($\sum U_i$), you need to fix the zero point and the unit for everyone. Harsanyi's theorem *itself* does not solve this; it assumes it.
  *   **The Prioritarian Move:** A prioritarian argues that fixing the scale is an *ethical* decision, not a mathematical one. By choosing a specific normalization, you might be smuggling in egalitarian concerns. For example, if we normalize utilities such that the worst-off person's utility has a larger "unit" size, the linear sum begins to look like a weighted prioritarian view.
  *   **Why this threatens your argument:** If the scaling is arbitrary or ethical, then the resulting "Utilitarian" sum is only Utilitarian relative to a specific, contestable ethical choice about measurement. The theorem doesn't force Utilitarianism; it forces a linear sum *given* a specific measurement convention.
  *   **How to address it:** You need to argue for a naturalistic or standard normalization (e.g., zero at death, one at perfect health) that renders the units comparable without ethical stipulation.

  ### 4. Separability and the Independence Axiom
  Harsanyi's theorem relies on the vNM **Independence Axiom** (if you prefer A to B, you should prefer a mixture of A+C to a mixture of B+C).

  *   **The Objection:** Many distributive justice theorists argue that the Independence Axiom is plausible for individual prudence but implausible for social justice.
      *   In justice, the *correlation* of outcomes matters. I might prefer a gamble where we both win or both lose (solidarity) over a gamble where one wins and one loses (inequality), even if the expected utilities are the same.
      *   Prioritarianism often violates Independence because the moral value of a benefit depends on the *level* of the recipient (the concave transformation). Adding a constant amount of welfare to a poor person matters more than adding it to a rich person, which violates the linearity required by Independence.
  *   **Why this threatens your argument:** If the Independence Axiom is not normatively binding on *social* preferences (even if it is on individual preferences), the mathematical proof collapses. The prioritarian isn't "confused" about math; they are rejecting an axiom they deem inappropriate for the domain of justice.
  *   **How to address it:** You must argue that violating Independence leads to dynamic inconsistency or money-pump arguments for society, just as it does for individuals.

  ### Strategic Advice for Your Paper

  If you want to argue that opponents are "confused," you must be careful not to sound like you are ignoring decades of literature (Broome, Sen, Weymark, etc., have all debated this). Instead, frame your argument as follows:

  1.  **Grant the Distinctions:** Acknowledge that Prioritarians distinguish between vNM utility and welfare.
  2.  **Attack the Coherence:** Argue that once you make that distinction, you lose the ability to measure the "welfare" objectively. If we can't measure welfare independently of revealed preference (vNM utility), then Harsanyi's theorem *is* the theory of welfare.
  3.  **Defend Ex Ante Pareto:** Argue that rejecting Ex Ante Pareto is fundamentally disrespectful to persons, treating them as vessels for outcomes rather than agents with preferences.
  4.  **Reframe "Confusion":** Instead of saying they are confused, argue that their position is **unstable**. They want the rigor of formal theory but wish to exempt their moral intuitions from the axioms that make formal theory possible.

  **Recommended Reading to Anticipate Counter-Arguments:**
  *   **John Broome, *Weighing Goods*:** He grapples deeply with whether vNM utility is the right measure for justice.
  *   **Peter Diamond, "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility" (1967):** The classic critique of Harsanyi.
  *   **Alex Voorhoeve & Marc Fleurbaey, "Priority or Equality?":** They discuss the Ex Ante/Ex Post conflict specifically regarding Harsanyi.
  *   **John Weymark, "Harsanyi's Aggregation Theorem":** A technical breakdown of the assumptions.

  If you can show that the Prioritarian must either (a) accept Utilitarianism, (b) reject Pareto (and thus be paternalistic), or (c) reject rationality axioms (and thus be incoherent), you will have made a formidable case. Good luck with the seminar!
