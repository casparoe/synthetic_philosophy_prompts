          *   *Point:* No utility function (concave or otherwise) solves this.
      *   *The "Why" (Independence Axiom):* Explain the axiom intuitively. If two options share a common outcome (89% chance of \$1M in Choice 1, 89% chance of \$0 in Choice 2), that commonality should cancel out. People treat the "sure thing" status as special, which EUT says it shouldn't be.
