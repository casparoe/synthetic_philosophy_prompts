      *   **Risk Aversion in EUT:** Modeled by a concave utility function ($u''(x) < 0$). This explains preferring a sure \$50 over a 50/50 shot at \$0 or \$100.
      *   **The Independence Axiom:** If you prefer $A$ over $B$, you should still prefer a mixture of $A$ and $C$ over the same mixture of $B$ and $C$. Formally: $A \succ B \implies \alpha A + (1-\alpha)C \succ \alpha B + (1-\alpha)C$.
      *   **The Allais Paradox:** A specific choice setup where people violate Independence.
          *   Choice 1: Sure \$1M vs. Gamble (10% \$5M, 89% \$1M, 1% \$0). Most pick Sure.
