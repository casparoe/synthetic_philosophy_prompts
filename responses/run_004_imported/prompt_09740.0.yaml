answer: |-
  This is a exceptionally sharp puzzle. You have identified the precise friction point between classical utilitarianism and modern liberal ethics. Your intuition is correct: while Bentham's conclusions regarding sexual liberty often align with modern progressive standards, the *architecture* of his reasoning is fundamentally different from the rights-based autonomy that undergirds "affirmative consent."

  To give you the depth you need for your piece, we have to disentangle three layers: the instrumental value of consent in Bentham's system, the metaphysical clash between sovereignty and aggregation, and the dangerous edge cases where a pure felicific calculus might diverge from strict consent norms.

  ### 1. Consent as Heuristic, Not Veto
  In modern sexual ethics (particularly the Kantian or rights-based liberal tradition), consent functions as a **moral veto**. It is a deontological constraint. If a person does not affirmatively consent, the act is impermissible, *regardless* of the consequences. The violation of autonomy is itself a harm, distinct from physical pain or psychological trauma.

  For Bentham, consent is not a veto; it is a **heuristic for pleasure**.

  Bentham's entire moral system rests on the idea that individuals are the best judges of their own pleasure and pain. Therefore, seeking consent is the most reliable method for an agent to determine if an action will produce net utility. If a partner says "yes," it is highly probable they will derive pleasure. If they say "no," it is highly probable they will derive pain (fear, resentment, physical discomfort).

  Consequently, Bentham would strongly endorse affirmative consent protocols as a matter of **legal and social policy**. He would argue that a rule requiring clear communication maximizes utility by:
  1.  Reducing the anxiety of uncertainty for both parties.
  2.  Minimizing the risk of miscalculation (which leads to pain).
  3.  Preventing the severe secondary pains of social conflict, trauma, and legal retribution.

  However, this endorsement is *contingent*. In Bentham's view, consent matters because it tracks pleasure, not because it embodies a sacred right of bodily sovereignty. As you noted, Bentham famously dismissed natural rights as "nonsense upon stilts." For him, there is no "sovereignty" to violate, only a person's interest in not suffering pain.

  ### 2. The Importation of Rights-Based Sovereignty
  This leads to your second point: does affirmative consent import a notion of bodily sovereignty that sits awkwardly with aggregative calculus? **Yes, unequivocally.**

  Modern "yes means yes" standards are often justified by the idea that each person owns their body and has the absolute authority to grant or deny access. This is a property-right model of the self.

  Bentham's utilitarianism is aggregative. It sums up pleasures and pains across all affected parties. In a strict Act Utilitarian reading (evaluating each specific act on its own merits), the "ownership" of the body is irrelevant; only the *experience* of the body matters.

  If we strip away the rights language and look purely at the calculus, a tension emerges. In a rights framework, if Person A hesitates or says "no," Person B must stop, even if Person B is certain that Person A would actually enjoy the act and suffer no lasting trauma. The violation of the "no" is the wrong.

  In a pure Benthamite calculus, the "no" is evidence of pain, but it is not conclusive proof. If Person B could somehow know with certainty that Person A's hesitation was based on a false belief (e.g., shame instilled by religious dogma, which Bentham viewed as a source of "false pleasures" or misguided pain-avoidance) and that the act would result in net pleasure for A without harming others, a strict Act Utilitarian logic struggles to explain why the act is forbidden.

  This is why your philosopher friend might argue that affirmative consent is not a natural extension of Bentham. It is a **deontological constraint grafted onto a consequentialist framework.** It says, "Do not cross this line," whereas Bentham says, "Calculate the cost of crossing the line."

  ### 3. The Edge Case: Paternalism and Overriding Hesitation
  You asked if there is a consistent version of Bentham's utilitarianism that could end up in tension with strict consent requirements. The answer is yes, and it lies in the distinction between **Act Utilitarianism** and **Rule Utilitarianism**.

  **The Act Utilitarian Danger:**
  If we apply Bentham's calculus to a specific encounter without general rules, we open the door to what we might call "hedonic paternalism."
  *   *Scenario:* A partner is hesitant due to internalized shame about a specific act.
  *   *Calculation:* The shame is a "false pain" (in Bentham's view, based on prejudice). The physical pleasure is real. The long-term psychological harm is negligible.
  *   *Verdict:* A strict Act Utilitarian could argue that coaxing or even gently overriding the hesitation maximizes net pleasure by liberating the partner from irrational prejudice.

  This is obviously horrifying to modern sensibilities, but it is logically consistent with a system that values *pleasure* over *autonomy*. Bentham himself flirted with this in his views on law; he believed the legislator knew better than the individual how to maximize social welfare. While he was a libertarian on "self-regarding" acts (like sodomy or masturbation), his logic relies on the assumption that the individual is the best judge of their own interest. If the individual is mistaken about their interest, the utilitarian justification for deferring to them weakens.

  **The Rule Utilitarian Resolution:**
  However, Bentham was primarily a legal theorist, and legal systems deal in rules, not case-by-case calculations. This is where Bentham likely converges with modern consent standards again, but for different reasons.

  A Benthamite legislator would ask: "What rule regarding consent produces the most utility for society?"
  *   **Rule A:** Sex is permissible unless there is active resistance.
  *   **Rule B:** Sex is permissible only with affirmative, enthusiastic consent.

  Bentham would almost certainly choose Rule B. Why? Because Rule A creates a society of high anxiety, frequent miscalculation, and significant pain for victims. The "error cost" of allowing non-affirmative sex is too high. Even if *some* specific acts of overriding hesitation produce pleasure, the *rule* allowing it would create a climate of insecurity that diminishes the total pleasure of the population.

  Therefore, Bentham would support affirmative consent laws as a **utility-maximizing rule**, even if he rejected the **rights-based justification** for them.

  ### 4. The "Mischief" vs. "Violation" Distinction
  This distinction is crucial for your magazine piece. In *Of Sexual Irregularities*, Bentham's argument against criminalizing sodomy rests on the absence of "mischief." For Bentham, mischief equals pain or risk of pain to others.

  Modern affirmative consent frameworks define "mischief" differently. They define it as the **violation of will**.
  *   **Bentham:** If two men have sex in private, and both enjoy it, and no one finds out (no blackmail, no scandal), there is zero mischief. It is morally neutral or good.
  *   **Modern Consent:** If two men have sex, and one coerced the other through subtle pressure without a clear "yes," there is mischief, even if the coerced party derived physical pleasure.

  Here lies the rub. Bentham's system struggles to account for the harm of *violation* independent of *suffering*. If a person is coerced but doesn't realize it, or is coerced but enjoys the result, Bentham's calculus sees little to no harm. Modern ethics sees a fundamental wrong.

  This suggests that affirmative consent is **not** a natural extension of Bentham's reasoning. It is a correction to it. It introduces a constraint (autonomy) that limits the calculus. It says, "You cannot sum up the pleasures of this act if the input of one party was not freely given," whereas Bentham says, "Sum up the pleasures; if the input was coerced, the resulting fear/pain will likely make the sum negative."

  ### 5. Conclusion for Your Piece
  For your research, the nuanced verdict is this:

  Bentham is a **consequentialist ally** of sexual liberty, but a **foundational opponent** of the language used to defend it today. He would support affirmative consent statutes because they are the most efficient technology for preventing pain and maximizing pleasure in a complex social world. He would view them as brilliant social engineering.

  However, he would reject the idea that consent is a freestanding moral category. To Bentham, consent is valuable *because* it correlates with pleasure, not because it is an expression of sovereignty.

  The tension you sensed is real. A purely aggregative utilitarianism always retains the theoretical capacity to override individual hesitation if the "greater good" (or greater net pleasure) can be demonstrably secured. Modern affirmative consent ethics exists precisely to slam the door on that calculation, asserting that some boundaries cannot be crossed even for the sake of net pleasure.

  So, is Bentham the patron saint of sexual liberalism? He is the patron saint of **decriminalization** based on harm reduction. But he is not the patron saint of **autonomy** based on rights. Your piece could compellingly argue that while Bentham cleared the ground for sexual liberty by removing religious and natural-law prohibitions, modern ethics had to import a non-utilitarian concept (bodily sovereignty) to fully protect the vulnerable from the cold logic of the calculus itself.
