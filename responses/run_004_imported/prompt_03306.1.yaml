  Retired evolutionary ecologist here, currently a few years into a very deep internet rabbit hole. I keep running into the argument that any agent whose preferences can't be written as maximizing some expected utility function is exploitable (money-pumped, dutch-booked), so sufficiently capable agents end up behaving like utility maximizers -- and from there people like Yudkowsky conclude advanced AI will converge on stuff like self-preservation and grabbing resources. Then I found a rebuttal saying this doesnt actually follow, since those coherence theorems only force you to be describable as maximizing SOME utility function over entire histories, and literally any behavior can be rationalized that way after the fact -- so "coherent" is compatible with doing pretty much anything and buys you nothing about power-seeking.

  It reminds me a bit of selection arguments from my own field (incoherent strategies get outcompeted, so survivors end up looking coherent), but I suspect thats smuggling in the very conclusion it's supposed to prove. Could you write me a dialogue between two people who know this material cold -- one defending the coherence-implies-danger argument, one attacking it -- where they actually engage each other's strongest points (dutch books, what a "utility function over histories" even buys you, whether there's some other force pushing toward real goal-directedness) instead of just talking past each other?
