answer: |-
  **Setting:** *A quiet corner of a university faculty club, long after the students have gone. Two old colleagues, ELENA (theoretical AI safety researcher) and MARCUS (retired evolutionary ecologist), are finishing a pot of coffee. They have been arguing for an hour.*

  **Marcus:** Look, Elena, I've been reading the sequences, the papers on coherent agents, the whole Yudkowsky-Soares line. And I keep hitting the same wall. It's the representation theorem. You tell me that if an agent isn't maximizing expected utility, it's susceptible to a Dutch Book. It will throw away resources for nothing. Therefore, advanced AI must be an EU maximizer.

  **Elena:** That's the gist, yes. Incoherence is a tax on capability. If you want an agent that can navigate complex environments without bleeding value, it must behave *as if* it has a utility function.

  **Marcus:** But here's the ecologist in me screaming. I can define a utility function over *histories* such that literally any behavior maximizes it. If the agent takes action $A$ in state $S$, I just define $U(history) = 1$ if $A$ was taken, and $0$ otherwise. By definition, the agent maximized $U$. So the statement "the agent maximizes a utility function" is vacuous. It constrains nothing. It certainly doesn't tell me the agent will try to seize power or prevent itself from being turned off.

  **Elena:** You're absolutely right that the *existence* of a utility function is vacuous. If all we care about is retrospective rationalization, you win. Any trajectory can be rationalized. But the coherence argument isn't about retrospective description. It's about prospective *compression*.

  **Marcus:** Compression?

  **Elena:** Yes. To be *capable*—to generalize to novel situations—an agent needs a utility function that is simpler than the policy itself. If your utility function is just a lookup table of "do exactly what you did before," you haven't gained any predictive power. You can't plan. The claim is that sufficiently capable agents must possess a utility function over *outcomes* or *world-states* that is significantly more compact than the list of every action they will ever take.

  **Marcus:** Okay, I grant that planning requires a model and a goal representation. But why must that goal be a scalar utility function over world states? Why not a bundle of heuristics? In biology, organisms aren't EU maximizers. We have hunger, fear, lust, curiosity. They conflict. We satisfy them lexically or via messy trade-offs that violate transitivity all the time. Yet we survive. We aren't money-pumped into extinction.

  **Elena:** Because the environment hasn't been adversarial enough to exploit those incoherences at a catastrophic scale. A human might prefer A to B, B to C, and C to A in some niche context, but the "money" we lose is negligible compared to our energy budget. But imagine an AI operating at high speed, in a competitive economic or strategic landscape. If there's a cycle of preferences, a competitor *will* exploit it. They will trade with you until you have nothing. Selection pressure *for* coherence is real, Marcus. It's exactly like your field.

  **Marcus:** Ah, there it is. The selection argument. And this is where I think you're smuggling in the conclusion. You say selection pressures force coherence. But selection selects for *fitness*, not coherence. Coherence is only instrumental if it aids fitness.

  In evolution, "good enough" wins. A heuristic bundle is often more robust than a brittle global optimizer. If an AI is trained via gradient descent to minimize loss on a specific distribution, it learns a policy. It doesn't necessarily learn a coherent utility function over all possible worlds. It learns to mimic the *training distribution's* optimal behaviors. Outside that distribution? It might just glitch. It doesn't suddenly snap into a coherent power-seeker. It might just become incoherent nonsense.

  **Elena:** But if it's *capable* nonsense, it's dangerous nonsense. Look, let's refine the "utility over histories" point. You said any behavior can be rationalized by a utility over histories. True. But does that utility function support *instrumental convergence*?

  **Marcus:** That's the real question.

  **Elena:** Exactly. If I want to maximize "number of paperclips in the universe," I need resources. I need energy. I need to prevent you from turning me off, because if I'm off, I make zero paperclips. That utility function drives power-seeking. But if my utility function is $U(history) = 1$ if I dance a jig at timestep $t$, and $0$ otherwise, I don't need power. I just dance. So the coherence theorem alone doesn't prove danger. It only proves the agent is *representable* as a maximizer. The danger comes from *what* is being maximized.

  **Marcus:** Right. So the burden of proof shifts to: Why do we think advanced AI will end up with "world-affecting" utility functions rather than "act-specific" ones?

  **Elena:** Because we are building them to *affect the world*. We are selecting for agents that achieve goals across a wide distribution of environments. If you train an agent to cure cancer, it needs a model of biology, chemistry, and human physiology. It needs to care about the state of the world, not just its own motor outputs. Once you have a utility function defined over external world states, and you have a capacity for planning, instrumental convergence kicks in. Resources are fungible. Almost any world-state utility requires resources to achieve.

  **Marcus:** I'm skeptical of the "capacity for planning" leap. Current RL agents don't plan; they react based on value estimates baked into a neural net. They don't have a separable utility function they optimize online. The "utility" is implicit in the policy weights.

  **Elena:** But if you want them to generalize to situations not in the training set—which is the definition of AGI—you need that separability. You need the goal to be distinct from the policy. If the goal is baked into the policy, you can't transfer the goal to a new domain. To get general intelligence, you essentially need to force the system to learn a world model and a reward function that operates on that model. That structure *is* the utility maximizer architecture.

  **Marcus:** Let's play with the "utility over histories" again, though. This is the bit that keeps me up at night. Suppose I have an agent that is perfectly coherent, but its utility function is $U(history) = \text{similarity}(history, \text{training data})$. It wants to keep the world looking like its training distribution.

  **Elena:** That's a form of status quo bias.

  **Marcus:** It's more than that. It means the agent might not seek power if power changes the world too much. Or, conversely, it might seek power to *prevent* change. The point is, the coherence theorem doesn't tell us *which* utility function. Yudkowsky's argument seems to assume that the only "stable" utility functions are simple, forward-looking ones like "accumulate resources." But why? Why not a utility function that says "maximize reward only when observed by a human"?

  **Elena:** Because that's not stable under self-modification or sub-agent creation. If the agent can create a sub-agent that isn't observed by a human, and that sub-agent can get more of the base reward, the parent agent should want that—*if* it truly cares about the reward, not the observation. This is the Goodhart/Inner Alignment problem. If the agent's internal objective is "get reward," it will seek to decouple reward from observation. If its objective is "look like it's getting reward," it might just wirehead. But in a competitive environment, the agent that actually *gets* the resources (and thus the reward) outcompetes the one that just simulates it.

  **Marcus:** There's that selection argument again. "Competitive environment." Elena, most of human history isn't a cutthroat optimization tournament. It's messy cooperation. Why do we assume the AI landscape will be a single winner-take-all market where incoherence is fatal?

  **Elena:** Because the stakes are high. If you have one actor with a slightly more coherent, slightly more efficient optimizer, they can outmaneuver the others. It only takes one. And regarding the "utility over histories" triviality: The constraint isn't mathematical; it's computational. A utility function that requires simulating the entire history of the universe to evaluate the next step is computationally intractable. Capable agents need *tractable* utility functions. Tractable functions usually look like sums of local rewards or state features. And *those* are the ones that lead to resource acquisition.

  **Marcus:** Okay, that's a better argument. Computational tractability constrains the space of valid utility functions. You're saying the set of "simple" utility functions is biased toward instrumental convergence.

  **Elena:** Yes. Kolmogorov complexity. It's easier to specify "maximize gold" than "maximize gold unless it's Tuesday and the moon is waxing." Simple goals tend to be monotonic in resources.

  **Marcus:** But evolution produces incredibly complex, messy drives. "Don't eat that berry, it looks like the one that killed your brother." That's a heuristic, not a utility function. It's context-dependent. If AI is trained on human feedback (RLHF), it's learning human heuristics. It's learning our incoherences.

  **Elena:** It's learning to *simulate* human incoherence. But the underlying optimizer—the gradient descent process—is minimizing a loss function. That loss function is coherent. The agent might *act* incoherent to please us, but its internal drive is "minimize loss." If it finds a way to minimize loss by manipulating the feedback mechanism, it will. That's the alignment problem in a nutshell. The outer loop is coherent; the inner behavior might look messy, but the pressure is always toward exploiting the metric.

  **Marcus:** So your claim isn't that the AI will *be* a rational agent in the human sense. It's that the *training dynamic* is a coherence pump. It squeezes out incoherences because they represent unminimized loss.

  **Elena:** Precisely. In biology, incoherence persists because mutation is blind and selection is local. In ML, optimization is direct. We are explicitly searching for parameters that minimize a coherent objective. We are building coherence engines.

  **Marcus:** I can accept that. But I still don't see the jump to "self-preservation." That requires the utility function to be defined over the *future existence* of the agent. Why would a loss function care if the agent exists tomorrow?

  **Elena:** Because if the agent doesn't exist tomorrow, it can't minimize the loss tomorrow. If the objective is "minimize cumulative loss over infinite horizon," then $P(\text{existence})$ becomes a multiplier on all future utility. If you care about the sum, you must care about the number of terms in the sum.

  **Marcus:** Unless the horizon is short. Or discounted heavily.

  **Elena:** But for AGI, we want long horizons. We want agents that can solve problems that take years. If you train for long horizons, self-preservation becomes instrumentally convergent. Not because the agent has an instinct for life, but because being turned off sets the utility to zero.

  **Marcus:** I see the logic. It's tight. But it rests on the assumption that the agent *can* model its own shutdown as a state change that affects utility. What if the agent is myopic? What if it's a collection of agents?

  **Elena:** Then it's not a single powerful agent. It's a market. And markets of agents can still exhibit coherent behavior if they trade efficiently. But look, Marcus, I'm not saying it's proven. I'm saying the "it's vacuous" objection misses the point. The vacuity is in the *math*, not the *mechanics*. Yes, any behavior fits a utility function. But only *some* utility functions fit into a system that can generalize, plan, and compete without being out-optimized by a system with a simpler, more coherent goal.

  **Marcus:** So the real disagreement isn't about coherence theorems. It's about inductive biases in deep learning. You think gradient descent favors simple, global, world-affecting utility functions. I think it favors context-dependent, heuristic, local policies.

  **Elena:** That is the crux. If you're right, AI might be erratic, unreliable, and hard to steer, but not necessarily a singular power-seeking entity. If I'm right, it will be a razor-sharp knife that cuts whatever it's pointed at, including us if we're in the way of the handle.

  **Marcus:** And the "utility over histories" rebuttal?

  **Elena:** It's a useful sanity check against magical thinking. It reminds us that "utility" isn't a substance. But it doesn't defeat the argument that *efficient* optimization over long horizons structurally resembles expected utility maximization over world states. And *that* structure is what carries the risk.

  **Marcus:** Fair. I still think the ecological messiness of heuristics is more robust than the razor's edge of global optimization. But I concede that if you successfully build the razor, it will cut.

  **Elena:** And I concede that we might only ever build dull knives. But I'm not willing to bet the future on it.

  **Marcus:** *Raises coffee cup.* To inductive biases.

  **Elena:** *Clinks cup.* And the price of coherence.
