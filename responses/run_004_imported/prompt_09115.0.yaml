answer: |-
  This is a sophisticated and defensible thesis. It aligns with the most rigorous strand of Thomistic scholarship, which seeks to harmonize Aquinas's corpus by distinguishing between the *ontological status* of the ruler rather than assuming a chronological evolution in moral principle.

  Below is an argument constructed to support your reconciling thesis, followed by an analysis of the strongest counter-argument (the "developmental" view) and how to neutralize it within your paper.

  ### Argument for Compatibility: The Distinction of Title vs. Exercise

  To argue that Aquinas did not change his mind, you must demonstrate that the *object* of the action in the two texts is fundamentally different. The apparent contradiction dissolves once we distinguish between the **tyrant without title** (*tyrannus ex defectu tituli*) and the **tyrant by exercise** (*tyrannus ex parte exercitii*).

  **1. The Ontological Status of the Usurper (*Sentences*)**
  In *Commentary on the Sentences* II, d. 44, Aquinas is discussing a specific scenario: a ruler who "seizes dominion by violence" (*qui dominium violenter arripuit*). In this context, the ruler possesses no legitimate authority. He is not a fallen magistrate; he is an aggressor.
  *   **The Logic:** Because he lacks a legitimate title, he does not hold the "public authority." He is, in effect, a private criminal on a massive scale.
  *   **The Implication:** Killing him is not "tyrannicide" in the sense of killing a head of state; it is an act of defense against an unjust aggressor. Therefore, it does not constitute sedition (which is opposition to the *unity of the multitude* under legitimate authority). Aquinas's praise for the killer here is consistent with natural law self-defense. The "private individual" acts justly not because they have superior political authority, but because there is *no* political authority to violate.

  **2. The Ontological Status of the Degenerate Ruler (*De Regimine*)**
  In *De Regimine Principum* I, c. 6, the scenario shifts. Aquinas addresses a ruler who was legitimately instituted but has "degenerated into tyranny."
  *   **The Logic:** This ruler *holds* a legitimate title, even if he abuses the office. The "public authority" resides in him by virtue of his institution, even if he acts against the common good.
  *   **The Implication:** Because he holds the office, only the authority that instituted him (the public authority, the community, or a superior) can depose him. For a private individual to kill him is to usurp a judgment they do not possess. This act *is* sedition because it disrupts the order of public authority, even if the intention is good.

  **3. The Continuity of "Public Authority"**
  Your thesis hinges on the work done by the phrase "public authority."
  *   In the *Sentences*, the usurper has *usurped* the public authority; he does not embody it. Therefore, the community (even via a private agent acting on its behalf implicitly) retains the right of defense.
  *   In *De Regimine*, the tyrant *embodies* the public authority, however poorly. To kill him privately is to attack the office itself. Aquinas insists the correction belongs to the authority that instituted him. This is not a retraction; it is an application of the same principle: **authority can only be removed by the source of that authority.** In the first case, the source never granted it; in the second, the source must revoke it.

  **4. Prudential Continuity**
  Finally, you can argue that the prudential warnings in *De Regimine* are actually latent in the *Sentences*. In the *Sentences* passage, Aquinas adds a crucial caveat: if the tyranny is not excessive, it is better to bear it than to risk greater dangers by trying to remove it. *De Regimine* expands this prudential calculus. It argues that even if the killing is theoretically just (as against a usurper), the *consequences* (ambition, worse tyranny, sedition) often make it illicit in practice. Thus, *De Regimine* is not a doctrinal reversal but a elaboration of the prudential conditions required to enact the justice described in the *Sentences*.

  ### Addressing the Strongest Counter-Argument

  The strongest reason for thinking Aquinas changed his mind is the **shift in tone regarding private judgment.**

  **The Counter-Argument:**
  Critics (such as those favoring a developmental hypothesis) argue that in the *Sentences*, Aquinas seems to allow the private individual to judge the legitimacy of the ruler ("holds power by no legitimate title") and act on it. In *De Regimine*, he explicitly warns against "private presumption." The counter-argument posits that the young Aquinas was more idealistic about the capacity of individuals to recognize justice, while the mature Aquinas, seeing the chaos of Italian communal politics, realized that allowing private judgment on legitimacy inevitably leads to anarchy. Therefore, he moved from a permissive stance to a restrictive one to preserve order.

  **How to Neutralize This in Your Paper:**
  You can concede the *prudential* shift without conceding a *doctrinal* shift.

  1.  **Manifest vs. Disputed Usurpation:** Argue that the *Sentences* case assumes the usurpation is *manifest* (open violence, undeniable lack of title). In such cases, private judgment is not "presumption" but recognition of fact. *De Regimine* deals with degeneration, which is a matter of degree and open to dispute. Aquinas isn't banning private judgment in the *Sentences*; he is acknowledging that some facts (like violent invasion) are self-evident, whereas others (like administrative cruelty) require public adjudication.
  2.  **The Definition of Sedition:** Point out that Aquinas's definition of sedition remains constant: it is opposition to the unity of the multitude. In the *Sentences*, the usurper has *already* broken the unity of the multitude by seizing power violently; killing him restores unity. In *De Regimine*, the tyrant maintains the formal unity of the regime; killing him privately breaks that unity. The principle (preserve unity) is unchanged; the application differs based on who broke the unity first.
  3.  **Genre Context:** Remind the reader that the *Sentences* is a commentary on theological cases (often biblical, like Ehud and Eglon), whereas *De Regimine* is a political treatise addressed to a King of Cyprus. The former deals with exceptional, almost miraculous interventions; the latter deals with constitutional norms. A difference in genre explains the difference in emphasis without requiring a change in mind.

  ### Recommendations for Strengthening the Paper

  To make this thesis bulletproof for a seminar paper, consider these three adjustments:

  1.  **Introduce the *Summa Theologiae* (II-II, q. 42, a. 2):** Even if your paper focuses on the two specific texts, acknowledging the *Summa* shows you know the broader context. In the *Summa*, Aquinas condemns sedition but allows for deposition by public authority. This aligns perfectly with *De Regimine* and suggests the *Sentences* is the outlier only if read superficially. You can frame the *Sentences* as the "exceptional case" (usurpation) and the *Summa/De Regimine* as the "constitutional norm."
  2.  **Clarify "Private Individual":** In the *Sentences*, when Aquinas says a "private individual" may kill the usurper, is he implying *anyone* can, or that anyone *can who is able* (effectively acting as an agent of the community)? If you can argue that the "private individual" in the *Sentences* is acting as a de facto instrument of the community's right to defense, the gap between the two texts narrows significantly.
  3.  **Refine the "Legitimate Title" Definition:** Be precise about what constitutes a "legitimate title" for Aquinas. Is it divine appointment? Election? Custom? If you can show that Aquinas views the "community" as the secondary cause of authority (under God), then *De Regimine*'s insistence on "public authority" removing the tyrant is simply the community reclaiming what was lent to the ruler. This makes the *Sentences* view (killing a usurper) consistent: the community never lent the authority to the usurper in the first place.

  ### Conclusion

  Your thesis is robust. By framing the difference as one of **category (usurper vs. degenerate)** rather than **chronology (young vs. old)**, you preserve the coherence of Aquinas's political natural law. The "change of mind" argument relies on flattening Aquinas's nuanced distinction between the *source* of authority and the *exercise* of authority. If you maintain that distinction rigorously, you can persuasively argue that *De Regimine* does not retract the *Sentences*, but rather protects it from being misapplied to cases where the ruler's title remains intact.
