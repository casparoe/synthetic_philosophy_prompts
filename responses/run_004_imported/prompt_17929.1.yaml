          *   Recommendation: Don't rely on the LLM for state truth. Use it for planning/relevance, use a DB for state. This hybrid approach acknowledges both problems.

  4.  **Refining the Tone:**
      *   Needs to be respectful of the user's CS background.
      *   Avoid overly dense philosophical jargon where possible, but define terms (isotropic, Quinean) when needed.
