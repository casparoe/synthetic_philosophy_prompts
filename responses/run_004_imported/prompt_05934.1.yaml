answer: |-
  This is one of those questions where the standard textbook explanation ("the prior is too diffuse") is technically correct but emotionally unsatisfying. It tells you *what* is happening, but not *why* it feels like a trick, or why sample size is the trigger.

  Here is the "felt sense" of Lindley's Paradox, followed by the verdict on the replication crisis.

  ### Part 1: The Intuition (Why does $N$ break it?)

  To feel this paradox, you have to stop thinking about "significance" and start thinking about **prediction precision.**

  Imagine two weather forecasters, $H_0$ and $H_1$, arguing about tomorrow's temperature anomaly (deviation from average).
  *   **$H_0$ (The Null):** Says, "The anomaly will be **exactly 0**."
  *   **$H_1$ (The Alternative):** Says, "The anomaly will be somewhere between -10 and +10, and I have no idea where." (This is your diffuse prior).

  Now, imagine you have a thermometer. The quality of that thermometer is your sample size ($N$).

  #### Small $N$ (The Blurry Thermometer)
  When $N$ is small, your measurement is noisy. You measure an anomaly of 0.5 degrees. But your thermometer has a margin of error of $\pm 2$ degrees.
  *   **$H_0$ says:** "I predicted 0. Your reading of 0.5 is well within my noise."
  *   **$H_1$ says:** "I predicted anything from -10 to +10. Your reading of 0.5 is right in the meat of my prediction."

  In this scenario, $H_1$ looks pretty good. The data is too blurry to distinguish "exactly zero" from "small non-zero." The likelihood function (the data's story) is a wide hill that overlaps comfortably with the bulk of $H_1$'s prior probability. The paradox is invisible because the data lacks the resolution to punish $H_1$ for being vague.

  #### Large $N$ (The Laser Thermometer)
  Now crank $N$ to infinity. Your thermometer is now a laser spectrometer. It is incredibly precise.
  **Here is the crucial constraint of the paradox:** To keep the p-value fixed at 0.05 as $N$ grows, the observed effect size **must shrink**.
  *   In a small study, a p=0.05 might require an effect of 0.5.
  *   In a massive study, a p=0.05 might require an effect of 0.0001.

  Why? Because with huge $N$, even a tiny deviation from zero screams "statistically significant." To stay *barely* significant (p=0.05), the data must whisper.

  So, in the Large $N$ scenario, your laser thermometer reads an anomaly of **0.0001**.

  *   **$H_0$ says:** "I predicted exactly 0. You measured 0.0001. That is incredibly close to my prediction. I look great."
  *   **$H_1$ says:** "I predicted anything from -10 to +10 with equal probability."

  Here is where the Bayesian penalty hits. $H_1$ spread its probability mass over a huge range (-10 to +10). Because probability must sum to 1, the **density** at any specific point is tiny.
  *   The probability density $H_1$ assigned to "exactly 0.0001" is microscopic.
  *   The probability density $H_0$ assigned to "exactly 0" (which covers 0.0001 given measurement noise) is effectively a spike.

  **The Intuitive Shift:**
  As $N$ grows, the likelihood function (the data) becomes a needle.
  1.  **Under $H_0$:** The needle lands right on the spike.
  2.  **Under $H_1$:** The needle lands on a vast, flat plain.

  Even though the needle is *not* on zero, it is so close to zero that $H_0$ predicts it much better than $H_1$ does. $H_1$ is being punished for **over-confidence in vagueness.** It said, "It could be anything!" The data came back and said, "It is *specifically* this tiny number." $H_1$ didn't predict "tiny"; it predicted "anywhere." $H_0$ predicted "zero," which is the ultimate "tiny."

  **Why doesn't this wash out?**
  In most stats problems, more data washes out the prior. That happens when the true effect is *substantial*. If the true effect were 5.0, the likelihood needle would move far away from 0 as $N$ grew. It would slide off the $H_0$ spike and land on a part of the $H_1$ plain where there is actually some density.
  But Lindley's Paradox specifically fixes the **p-value**. By fixing the p-value, you are forcing the observed effect to track toward zero as $N$ increases. You are forcing the data to look more and more like the Null, while the Alternative remains stubbornly diffuse.

  ### Part 2: Is this driving the Replication Crisis?

  This is the million-dollar question. The short answer: **No, but it explains a specific, growing flavor of it.**

  **1. The Standard Replication Crisis is usually "Small N"**
  Most of the classic replication failures (psychology, social priming) are driven by the opposite of Lindley's Paradox. They are underpowered studies with noisy estimates where p-hacking and publication bias create false positives. In those cases, $N$ is too small to distinguish signal from noise. Lindley's Paradox requires $N$ to be *massive*.

  **2. The "Big Data" Crisis is Lindley's Territory**
  However, we are entering the era of Biobanks, GWAS studies, and tech A/B testing with millions of users. Here, Lindley's Paradox is absolutely a contributor to **interpretational failure.**
  *   **Scenario:** A pharmaceutical company tests a drug on 500,000 people. They find a statistically significant reduction in blood pressure (p < 0.001).
  *   **Frequentist view:** "The effect is real! Reject the null!"
  *   **Lindley/Bayesian view:** "The effect size is 0.1 mmHg. Given the precision of this study, an effect this small is more consistent with 'no clinically meaningful effect' than with a diffuse prior of 'drug effects vary widely'."

  In this context, Lindley's Paradox isn't causing false *positives* in the sense of noise; it's highlighting that **statistical significance is not evidence of a meaningful hypothesis.**

  **3. The Real Culprit: The Point Null**
  The deepest lesson of Lindley's Paradox isn't that Bayesians are right and Frequentists are wrong. It's that **the Point Null ($H_0: \theta = 0$) is almost always a lie.**
  In the real world, no two things are *exactly* equal. If you measure with enough precision (large enough $N$), you will *always* reject the point null.
  *   If you believe the null is literally "exactly zero," Lindley's Paradox shows that huge studies will convince you the null is true even when p < 0.05.
  *   If you acknowledge the null is actually "negligibly small" (a ROPE: Region of Practical Equivalence), the paradox largely evaporates.

  **Verdict:**
  Lindley's Paradox is not the main driver of the replication crisis (which is mostly p-hacking and small samples). **It is, however, a major driver of the "Replication of Trivialities" crisis.**
  It is the mathematical reason why huge preregistered studies can return "significant" results that fail to change anyone's mind or inform policy. It explains why a result can be "statistically significant" but "evidentially weak."

  **The Takeaway for your friend:**
  "Priors matter" is the technical answer. The human answer is: **"With enough data, a vague hypothesis cannot compete with a precise one, even if the precise one is slightly wrong."** In large samples, 'significance' detects the *presence* of an effect, but Lindley's Paradox warns that it may simultaneously provide evidence that the effect is *too small to matter*, making the Null (or a 'null-ish' region) the more credible bet.

  If you want to avoid the paradox in practice: Stop testing point nulls. Test whether the effect is *outside a range of practical equivalence*. If you do that, the paradox dissolves, because you aren't asking "Is it zero?" you're asking "Is it big enough to care about?"
