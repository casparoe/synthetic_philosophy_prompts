answer: |-
  **MEMORANDUM**

  **TO:** Medical Policy Committee
  **FROM:** Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Appeal Case #23-894 (Growth Hormone for Idiopathic Short Stature)

  **RECOMMENDATION**
  I recommend that the Committee **overturn the initial denial and approve coverage, subject to specific clinical and psychosocial conditions.**

  This decision should not be viewed as a blanket approval for all patients with Idiopathic Short Stature (ISS). Rather, it establishes a precedent for coverage based on *documented functional impairment* rather than statistical deviation alone. This approach resolves the inconsistency in our current policy while establishing guardrails to prevent the medicalization of normal human variation.

  **RATIONALE**

  **1. Addressing Policy Consistency (The "Arbitrary Line" Objection)**
  The Medical Director's denial relies on the position that this patient is healthy, merely falling at the tail end of a normal distribution. Biologically, this is accurate. However, our plan currently covers growth hormone (GH) for children born Small for Gestational Age (SGA) who often share this same biological profile: they are healthy, hormone-sufficient, but statistically short.

  If we cover GH for SGA based on the *risk* of psychosocial disadvantage and adult height limitation, but deny it for a child with ISS facing the *actualization* of that same disadvantage, our distinction is not principled; it is diagnostic coding arbitrage. To maintain internal consistency, we cannot use "biological pathology" as the sole gatekeeper if we already make exceptions for SGA. We must acknowledge that our coverage criteria already incorporate quality-of-life considerations, not just biological defect.

  **2. Defining "Medical Necessity" in this Context**
  The core tension in this case is whether we cover a *biological condition* (which this patient lacks) or a *functional handicap* (which she may possess).

  *   **The Risk of Approval:** If we approve based on height alone, we risk validating the idea that statistical normality defines health. This opens the door to covering interventions for any statistical outlier (e.g., extreme intelligence, athletic performance) where "enhancement" is sought rather than "treatment." The Medical Director is correct that shortness itself is not a disease.
  *   **The Risk of Denial:** If we deny based solely on biology, we ignore the welfare-based reality of the patient. If a physical trait prevents a child from participating in ordinary social and educational activities, the *outcome* is indistinguishable from a pathological one.

  **3. The Precedent: Functional Impairment vs. Statistical Deviation**
  To navigate this, we must shift the coverage trigger from *diagnosis* to *impairment*. We are not covering "short stature"; we are covering the mitigation of severe functional impairment caused by short stature. This aligns our decision with the SGA precedent without conceding that all shortness is pathological.

  **PROPOSED CONDITIONS FOR COVERAGE**
  To ensure this ruling applies safely to future cases, approval for this patient (and subsequent ISS cases) must be contingent on the following:

  1.  **Predicted Adult Height:** Must remain below the 1st percentile (consistent with current policy).
  2.  **Documented Psychosocial Impairment:** A letter from a licensed child psychologist or social worker is required, attesting that the child's stature is causing measurable interference with age-appropriate activities (e.g., bullying resulting in school avoidance, inability to participate in peer activities, significant anxiety/depression linked to stature). Parental concern alone is insufficient.
  3.  **Exclusion of Contraindications:** Confirmation that epiphyses are not fused and that there are no underlying contraindications to GH therapy.
  4.  **Trial Period:** Authorization is granted for 12 months. Continuation requires documentation of growth velocity response and reassessment of psychosocial status.

  **ADDRESSING THE STRONGEST OBJECTION**
  The strongest argument against this recommendation is the "Slippery Slope" objection: *By covering this, are we not allowing social prejudice to dictate medical spending? If society values height, should the health plan pay to fix it?*

  This is a valid concern. If we define "harm" purely subjectively, we risk turning the health plan into a subsidy for conforming to social norms. However, we mitigate this risk through the **conditions above**. By requiring third-party verification of *functional* impairment (school avoidance, clinical anxiety) rather than subjective dissatisfaction, we ensure we are treating a disability-like impact, not merely a cosmetic preference.

  We are not agreeing that shortness is a disease. We are agreeing that when a physical trait—regardless of its biological origin—creates a barrier to basic functioning comparable to a disease state, our plan's existing exceptions (like SGA) compel us to intervene.

  **NEXT STEPS**
  If approved, I move that we refer this case to the Policy Drafting Subcommittee to revise the written GH policy language. The new language should explicitly codify the "Functional Impairment" pathway for ISS to ensure future decisions are consistent, transparent, and insulated from accusations of arbitrary adjudication.

  **[Signature]**
  Public Member, Medical Policy Committee
