      *   Discuss the normative vs. descriptive nature.
      *   Conclude encouragingly.

  *(Self-Correction during drafting)*: I should be careful not to dismiss the theorem. It's profound. I need to emphasize that the *failure* of the assumptions is the interesting part, not that the theorem is "wrong."

