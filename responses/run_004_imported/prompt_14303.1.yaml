      *   *Skeptic's Core:* Correlation requires a common cause or direct influence. Without causal contact, asserting correlation is epistemically unjustified. It looks like magical thinking. "Defection" implies a threat/promise mechanism; without causal contact, how can you punish defection? It's just hoping the other guy is nice.

