      *Counter:* But we *do* make judgments like "It would be a tragedy if that art was destroyed even if no one saw it."
      *Okay, I'll stick with Moore succeeds.* It highlights that Mill is smuggling non-hedonic values into his definition of pleasure.

  7.  **Final Polish:** Ensure the distinction between "Instrumental" and "Intrinsic" is clear. Ensure the "Organic Unities" concept (Moore) is hinted at regarding relationships (the whole is greater than sum of parts).

      *(Self-Correction)*: I should be careful not to make Moore sound *too* mystical. Focus on the logical structure: If Hedonism is true, A=B. Moore says A>B. Therefore Hedonism is false. The only way out is to deny A>B. Mill must deny A>B. Is that plausible? I will argue it is *not* plausible for most people, hence Moore succeeds.

  8.  **Structure:**
