          *   Explain why $A$ isn't constant. In the $2A$ case, $A$ is the smaller amount. In the $A/2$ case, $A$ is the larger amount.
          *   Use concrete numbers (e.g., \$10 and \$20) to illustrate.
      *   **Discuss the Prior Distribution:**
