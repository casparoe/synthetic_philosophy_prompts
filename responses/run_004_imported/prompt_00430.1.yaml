prompt: |-
  So in my decision theory seminar we covered the two-envelope paradox, and I think I basically get it now: the math shows that no matter which envelope you pick, switching always gives you a higher expected value (like 1.25x whatever's in your current envelope). My professor said the expected-value reasoning here is "obviously flawed" but kinda breezed past explaining why and moved on to the next topic. Ever since then I've been telling my friends that this basically proves expected value theory itself is broken as a decision-making tool, since it literally tells you to switch envelopes forever and "expect" infinite money, which is absurd. Is that the right takeaway, or is there something wrong with how the expected value is being calculated in this specific setup rather than a problem with EV reasoning generally? I want to make sure I'm not misrepresenting this to people when it comes up in conversation.
reasoning: |-
