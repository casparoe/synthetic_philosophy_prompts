prompt: |-
  I am writing a historical novel whose central figure is a fictionalized version of Henry Sidgwick: a rigorously skeptical utilitarian moral philosopher who nonetheless devoted decades to the Society for Psychical Research, from early table-turning sessions through the census of hallucinations to his sittings with the medium Leonora Piper. As I understand it, this was never mere eccentricity on his part but a considered attempt to find empirical evidence for personal survival after death, since he found it unsatisfying to rest the "dualism of practical reason" between rational self-interest and impartial duty on an unevidenced Kantian postulate of immortality alone. Please describe the most important implications of how that research actually proceeded and ultimately failed to settle his doubts, even by the time of his death, for how I might portray this character's private motives, his discipline through repeated disappointment, and the note on which his arc should close.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** A fictionalized version of Henry Sidgwick (Victorian moral philosopher).
      *   **Core Conflict:** A rigorously skeptical utilitarian who devoted decades to the Society for Psychical Research (SPR).
      *   **Motivation:** Not eccentricity, but a philosophical necessity. He needed empirical evidence for personal survival to resolve the "dualism of practical reason" (conflict between self-interest and duty) without relying on a blind Kantian postulate.
      *   **Task:** Describe the implications of how the research proceeded/failed, focusing on:
          *   Private motives.
          *   Discipline through disappointment.
          *   The closing note of his arc (death).
      *   **Tone:** Historical, philosophical, nuanced, empathetic but rigorous.

  2.  **Deconstruct Sidgwick's Philosophy & Psychical Research:**
      *   *The Dualism of Practical Reason:* In *The Methods of Ethics*, Sidgwick concludes that Rational Egoism (pursuing one's own good) and Universal Hedonism/Utilitarianism (pursuing the general good) are both rational but often conflict. Reason cannot reconcile them *unless* there is a moral government of the universe (i.e., God and Immortality) ensuring that duty and self-interest coincide in the long run.
      *   *The Need for Evidence:* Sidgwick was an empiricist. He couldn't just *believe* in immortality on faith (like a religious person) or as a mere postulate (like Kant). He needed *proof*. Hence, the SPR.
      *   *The SPR Work:* He was a founding member. He investigated mediums (like Eusapia Palladino and Leonora Piper). He conducted the "Census of Hallucinations."
      *   *The Outcome:* Ambiguous. He never found conclusive proof. He died still hoping but not knowing. His famous last words (to his wife, Eleanor Balfour) were about keeping the secret if there was one.

  3.  **Address the Specific Prompts:**

      *   **Private Motives:** It's not about ghosts; it's about *ethics*. If there is no afterlife, the universe is ethically fractured. His research is a desperate bid to make morality rational.
      *   **Discipline through Disappointment:** How does a skeptic handle hope? He must apply the same rigorous standards to the spirits as he does to ethical axioms. Every fraud hurts, but false hope hurts more. It's a slow erosion of certainty, not a sudden crash.
      *   **The Closing Note:** He didn't convert on his deathbed. He remained agnostic but hopeful. The "secret" aspect is crucial.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's accurate understanding. This is the hook. Validate the philosophical stakes.
      *   **1. The Nature of the Motive (The Ethical Wager):**
          *   Explain *why* he did it. It's not curiosity; it's structural integrity of his moral system.
          *   *Implication for Character:* He isn't chasing spooks; he's chasing coherence. He is terrified of a universe where being good is irrational.
          *   *Scene Idea:* Contrast a dry lecture on ethics with a tense séance. The same mind at work.
      *   **2. The Methodology as Moral Discipline:**
          *   The SPR was about *testing*, not believing.
          *   *Implication for Character:* He must suppress his own desire for the result to be true. This is intellectual asceticism.
          *   *The "Piper" Case:* Leonora Piper was the best hope. She gave specific info. But was it telepathy (living minds) or survival (dead minds)? Sidgwick couldn't decide.
          *   *Discipline:* The pain of "almost." The need to publish negative results even when they hurt the cause.
      *   **3. The Trajectory of Disappointment:**
          *   It wasn't a straight line. It was a slow grinding down.
          *   Early days: Table-turning (naive hope).
          *   Middle: Census of Hallucinations (statistical, dry).
          *   Late: Piper (complex, ambiguous).
          *   *Character Arc:* From seeking *proof* to seeking *probability* to accepting *uncertainty*.
      *   **4. The Ending (Death & The Secret):**
          *   Historical fact: He told his wife if he could communicate, he would try.
          *   *Implication:* The ultimate test. He becomes the subject.
          *   *The Note:* Not triumph, not despair. A "holy suspension." He dies holding the tension.
          *   *Key Quote:* "I should like to communicate if I can."

  5.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Needs to be advice for a novelist. Use evocative language ("intellectual asceticism," "metaphysical starvation").
      *   *Accuracy Check:* Ensure the distinction between telepathy and survival is clear (Sidgwick struggled with this). Ensure the "Dualism" is explained simply but correctly.
      *   *Character Advice:* Focus on the *internal* cost. The loneliness of being a skeptic among believers and a believer among skeptics.

  6.  **Self-Correction Example during Drafting:**
      *   *Initial thought:* Maybe suggest he finds proof at the end.
      *   *Correction:* No, historically he didn't. It's more powerful if he doesn't. The tragedy is the *lack* of resolution. The novel should reflect the historical truth that the evidence remained inconclusive. The drama is in the *struggle*, not the solution.
      *   *Focus:* Emphasize that for Sidgwick, "inconclusive" was a moral crisis, not just a scientific one.

  7.  **Final Review against User Prompt:**
      *   Private motives? Covered (ethical coherence).
      *   Discipline through disappointment? Covered (rigorous skepticism applied to hope).
      *   Closing note? Covered (the pact with his wife/agnostic hope).

  8.  **Final Polish:** Organize into clear thematic headers for the writer's ease. (Proceed to generate output).

  *(Self-Correction Note: Make sure to mention Eleanor Balfour Sidgwick. She was crucial to the SPR and his wife. Their partnership is key to the emotional core.)*

