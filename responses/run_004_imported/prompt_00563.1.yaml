answer: |-
  This is a profound and historically astute premise. You have correctly identified that Sidgwick's involvement with the Society for Psychical Research (SPR) was not a lapse in judgment or a Victorian parlor game, but a direct extension of his ethical system. For Sidgwick, the "Dualism of Practical Reason" was a scandal: reason dictates that we pursue our own happiness (Rational Egoism) and also the general happiness (Utilitarianism), but these often conflict. Without a divine moral order (God and Immortality) to reconcile them in the long run, morality is ultimately irrational.

  As an empiricist, Sidgwick could not accept this moral order on faith alone. He needed data.

  Here are the implications of that historical reality for your characterization, structured by motives, discipline, and the closing arc.

  ### 1. Private Motives: The Ethical Wager
  To portray Sidgwick accurately, you must internalize the stakes. He is not hunting for ghosts; he is hunting for the **coherence of the universe.**

  *   **The Fear of Fragmentation:** His motivation should not be curiosity, but a quiet, existential dread. If death is the end, then the sacrifice of self-interest for duty is a biological error. Your character should view the materialist worldview not as "scientific," but as ethically catastrophic.
  *   **The Burden of Leadership:** As a public intellectual, he had to maintain the persona of the dry, analytical don. Privately, he is engaged in a desperate metaphysical rescue mission. This creates a dual life: the public skeptic who demands rigorous proof, and the private man who *needs* the proof to be true to save his own philosophy.
  *   **The "Godless" God:** He isn't looking for a religious deity. He is looking for a mechanism. He approaches the afterlife like an accountant looking for a missing ledger entry. If the entry isn't there, the books don't balance. This makes his sittings with mediums feel less like spiritual rituals and more like cross-examinations in a courtroom.

  ### 2. Discipline Through Disappointment: Intellectual Asceticism
  The history of the SPR is a history of fraud, error, and ambiguity. Sidgwick spent decades wading through this. For your character, this requires a specific kind of emotional discipline.

  *   **Skepticism as Self-Defense:** Most skeptics disprove spirits to protect science. Sidgwick disproved spirits to protect the *truth*. If he accepted a fake medium, he polluted the only evidence that could save morality. Therefore, his ruthlessness in debunking frauds (even those he wanted to be true) is an act of moral integrity. He must break his own heart to keep his philosophy honest.
  *   **The Telepathy Trap:** A crucial historical nuance for your novel is the distinction between *survival* and *telepathy*. Even when a medium like Leonora Piper produced accurate information, Sidgwick had to consider if it came from the dead or from the living minds of the sitters (telepathy).
      *   *Dramatic Implication:* Every success is ambiguous. A "hit" in a séance is almost as frustrating as a miss, because it doesn't prove survival. Your character should feel a unique form of torture: getting the answer he wanted, but not for the reason he needed.
  *   **The Slow Erosion:** Do not portray his disappointment as a series of dramatic explosions, but as a slow erosion. Early on, there might be a thrill in table-turning. By the time of the Census of Hallucinations, it is statistical and dry. By the Piper sittings, it is weary. He is an old man applying the rigorous standards of his youth to phenomena that resist them. He must show the reader the toll of hoping against hope while maintaining the facade of impartiality.

  ### 3. The Closing Arc: The Pact of Uncertainty
  Sidgwick did not die a convert, nor did he die a cynic. He died in a state of "rational hope." This is the most difficult but rewarding note on which to close his arc.

  *   **The Pact with Eleanor:** Historically, Sidgwick made an agreement with his wife, Eleanor Balfour Sidgwick (who was also a prominent SPR researcher): if there was any way to communicate after death, he would try to contact her.
      *   *The Scene:* This should be the emotional climax. It is not a dramatic deathbed conversion. It is a quiet, practical arrangement between two researchers. "If I can, I will." It acknowledges the possibility of failure.
  *   **The Final Ambiguity:** In your novel, do not give him a vision on his deathbed. Do not have a table rattle. The power of Sidgwick's story is the **lack of resolution.**
      *   *The Philosophical Stance:* He should face death accepting that the "Dualism" might remain unresolved. He has done the work. The universe is under no obligation to make sense to him.
      *   *The Final Thought:* His final internal monologue should not be "I know now," but "I have kept the question open." He dies holding the tension between faith and reason without collapsing it.
  *   **The Legacy:** The closing image might be the survivors (Eleanor, colleagues) waiting for a sign that never conclusively comes. The tragedy is not that he was wrong, but that the universe remained silent. Yet, the *attempt* itself validates the human need for moral coherence.

  ### Summary of Character Notes
  *   **Voice:** Precise, understated, devoid of mystical flourish. Even when describing a séance, he should describe it like a laboratory experiment.
  *   **Conflict:** The war between his *hope* (which desires survival) and his *method* (which demands evidence).
  *   **Key Metaphor:** The Ledger. He is trying to balance the books of the universe.
  *   **Ending:** Agnostic Hope. He does not solve the Dualism, but he refuses to surrender the *possibility* of its solution.

  **A Suggested Closing Passage Concept:**
  > *He lay still, the breathing shallow. Eleanor held his hand, not in prayer, but in readiness. They had agreed: if the barrier was permeable, he was to push against it. He closed his eyes, not to sleep, but to observe. There was no light, no chorus, no sudden unburdening. There was only the fading of the pain, and then the fading of the observer. He died as he had lived: waiting for evidence that did not come, still hoping that the silence was merely a lack of signal, and not a lack of a sender.*

  This approach honors the historical Sidgwick: a man who found that the rigorous application of reason led him to the edge of the mystic, but who possessed the integrity to stand on that edge without jumping.
