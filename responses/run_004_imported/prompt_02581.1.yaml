      *   *Idea 3: Rescue/Medical.* A dying person needs a transplant. A counterpart from a healthy world is available. Is it murder to harvest the organs? *Critique:* Strong ethical stakes.
      *   *Idea 4: The "Return" Ticket.* A portal opens. Someone steps through. Do they have the right to stay? Are they displacing the local version? *Critique:* Good, but needs a specific mechanism where the *identity* matters more than the *physics*.
      *   *Idea 5: The Grief/Consolation Angle (Kripke's Humphrey).* A woman loses her husband. A version of him exists in a nearby branch where he didn't die. She wants to bring him "home." The authorities say he's not *her* husband. *Critique:* This hits the emotional core of the Humphrey objection directly. It makes the metaphysical distinction matter for *love* and *legal status*.

  3.  **Developing Idea 5 (The Grief/Consolation Angle):**
      *   *Setting:* A bureaucracy that manages "cross-branch contact." Let's call it the Modal Affairs Bureau (MAB).
      *   *Characters:* Elena (the widow), Agent Thorne (the bureaucrat enforcing Lewisian logic), and the "Husband" (let's call him Mark-Prime vs. Mark-Alt).
      *   *Conflict:* Elena's Mark died saving a kid. In World B, Mark didn't save the kid (kid died), but Mark is alive. Elena wants *that* Mark to come live with her.
      *   *The Crux:* If Transworld Identity is true, it *is* her husband, just from a different timeline. He belongs with her. If Counterpart Theory is true, it's a stranger who looks like her dead husband. Forcing him to stay is slavery/kidnapping. Letting him go denies Elena her "husband."
      *   *The Twist/Decision:* The story needs to force a choice based on the theory. Let's make it a legal hearing. The "Mark" from the other world *wants* to stay. But does he have the *right* to assume the identity?
      *   *Refining the Stakes:* Let's make it about *memory and guilt*. In Elena's world, Mark is a hero. In the other world, Mark is a coward (let the kid die). If they merge identities, does the cowardice stain the hero's legacy? Or does the heroism redeem the coward?
      *   *Better Stakes:* Custody. They have a child. In World A, the child is orphaned. In World B, the child died (that's why Mark is alive? No, too complex). Let's stick to the spousal claim.
      *   *Revised Stakes:* The "Visa." To stay permanently, the immigrant must prove they are the *same person* as the citizen's spouse. If they are merely a counterpart, they are an illegal alien. If they are transworld identical, they are a returning citizen.
      *   *The Test:* How do you test metaphysics? You can't. So the test must be phenomenological. But the prompt asks for the *theory* to be load-bearing. So the *law* must be written based on one theory, and the characters are fighting to interpret it.
      *   *Actually, let's flip it:* The law assumes Counterpart Theory (Lewis) for safety reasons (prevents world-hopping chaos). Elena is arguing for Transworld Identity (Kripke) to reclaim her life. The "Mark" involved is the variable.

