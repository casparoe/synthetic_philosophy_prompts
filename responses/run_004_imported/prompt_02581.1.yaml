      *   *The Divergence Point:* The moment of death. In World A, Mark dives in front of a car. In World B, Mark freezes.
      *   *The Conflict:* Elena wants the living Mark. But if she admits he's a counterpart, he has no legal right to her dead husband's assets, name, or marriage. If she insists he's the *same* man, she admits her husband is a coward who let a child die (in the other timeline). She has to choose: A stranger who loves her, or a husband who died a hero.
      *   *Wait, the prompt asks for the plot to hinge on the theory.*
      *   *Okay, let's go with a Rescue Scenario.* A team goes to retrieve a lost astronaut. They find him. But is he *their* astronaut or a counterpart? If he's a counterpart, bringing him back violates the "Non-Interference with Distinct Worlds" treaty (Lewisian isolationism). If he's transworld identical, it's a rescue mission.
      *   *The Twist:* The astronaut *knows* he's different. He remembers dying in the other timeline.
      *   *Let's try the Custody/Inheritance angle again, it's more human.*
      *   *Setup:* "The Continuity Act." Law states: Only Transworld Identical entities can inherit. Counterparts are legally distinct.
      *   *Characters:* Sarah (widow), David (the counterpart from a world where he didn't die), Judge.
      *   *Conflict:* David wants to stay with Sarah and her daughter. The State says he's an impostor.
      *   *The Kicker:* David remembers the divergence. He knows he *didn't* make the sacrifice Sarah's husband did.
      *   *Resolution:* Sarah has to testify. Does she believe in essences (Kripke) or haecceities (Lewis)?

  5.  **Writing - Focusing on the "Intuition Pump":**
      *   I need to make sure the reader feels the weight of the "Humphrey Objection."
      *   If David is a counterpart, Sarah is loving a ghost.
      *   If David is transworld identical, Sarah is loving a man who made a different choice.
      *   The legal ruling depends on whether "Identity" is defined by *origin* (Lewis) or *essence/history* (Kripke).
      *   Let's create a device: The "Haecceity Scanner." It's a MacGuffin that represents the metaphysical stance. It either registers a match or it doesn't. But the *interpretation* of the match is the story.
      *   *Actually, let's keep it low-tech.* A courtroom drama.
      *   *Key moment:* The Judge asks, "If he is the same man, why did he let the child die in his world?"
      *   *Sarah's answer determines the metaphysics.*

  6.  **Refining the Plot for Maximum Impact:**
      *   Title: *The Humphrey Variance*.
      *   Setting: Bureau of Cross-Temporal Adjudication.
      *   Protagonist: Elara.
      *   Antagonist: The Magistrate (Lewisian strict constructionist).
      *   Subject: Julian (the counterpart).
