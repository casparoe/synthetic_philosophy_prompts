  7.  **Final Polish:** Check the pacing. Ensure the philosophical terms aren't lectured but enacted. Ensure the emotional weight lands on the "Humphrey" aspect—does it matter if *he* won the election (or lived) if it wasn't *him*?

      *Wait, one more tweak:* To make it truly load-bearing, the *outcome* must change based on the theory.
      *   If Lewis is true: Julian is a stranger. He can stay as a refugee, but he cannot be the husband. The marriage is void.
      *   If Kripke is true: Julian is the husband. The marriage holds.
      *   Elara wants the marriage to hold. Julian wants to be the husband. The State wants to void it to prevent "branch contamination."
      *   The ending should leave the reader wondering which is right.

