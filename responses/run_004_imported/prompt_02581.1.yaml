answer: |-
  **The Humphrey Variance**

  The Magistrate's chamber smelled of ozone and old paper, the scent of a bureaucracy that managed reality itself. Elara sat on the hard wooden bench, her hands clasped tight around a purse that contained a wedding ring and a death certificate. Beside her sat Julian.

  He looked exactly like David. The scar on the chin, the slight asymmetry of the ears, the way his left foot tapped when he was nervous. But Elara knew the difference. In her world, David had died three years ago, pushing a child out of the path of a speeding delivery van. In Julian's world—World 88-Delta—the van had braked. The child lived. David lived.

  And then David had walked through a rift, found Elara, and asked to come home.

  The Magistrate, a severe woman with eyes augmented by spectral overlays, shuffled a stack of forms. "Mrs. Vance. Mr. Vance. We are here to adjudicate the Petition for Reintegration under the Singularity Statute. As you know, the law is binary. Either Mr. Vance is Transworld Identical to the deceased David Vance, in which case he is a returning citizen reclaiming his estate and marriage. Or he is a Counterpart, a numerically distinct entity, in which case he is an illegal alien subject to immediate repatriation."

  "Repatriation means death," Julian said. His voice was David's, but the cadence was flatter. "My branch is collapsing. If you send me back, I cease."

  "The Statute does not account for collateral entropy," the Magistrate said without looking up. "It accounts for Identity. Mrs. Vance, the burden of proof is on you. You claim this man is your husband."

  "He *is* my husband," Elara said. She reached for Julian's hand. He flinched, then let her take it. "The atoms are different. The timeline is different. But *he* is David. If you strip a man of his memories, his personality, his love, what is left? Haecceity? A 'thisness' that doesn't matter?"

  "The Lewisian Precedent matters," the Magistrate corrected. "David Lewis was clear. No entity exists in more than one world. When you say 'David could have lived,' you speak poetically. Literally, a counterpart lived. This man before me is a neighbor, not a returnee. To grant him your husband's identity is to commit fraud against the deceased."

  "It's not fraud, it's recognition!" Elara leaned forward. "Kripke showed us that names are rigid designators. 'David Vance' refers to the same person in every possible world where he exists. If this man is David Vance in 88-Delta, he is David Vance here. The divergence is accidental, not essential."

  "Is it?" The Magistrate finally looked up. Her gaze pinned Julian. "Mr. Vance. In the primary timeline, David Vance sacrificed his life to save a child named Toby Miller. In your timeline, what happened?"

  Julian looked at the floor. "I... I froze. The brakes held. I didn't do anything."

  "So," the Magistrate said, turning to Elara. "Your husband was a hero. This man is a coward. They made different moral choices. If identity is tied to the continuity of character, they are not the same. If identity is tied to origin, they are not the same. On what grounds do you claim him?"

  Elara felt the trap closing. This was the Humphrey Objection made flesh. Hubert Humphrey shouldn't care that a counterpart won the presidency in another world; it doesn't help *him*. Should Elara care that a counterpart lives? Does it comfort her grief if it's not *really* him?

  But if she says it's not him, Julian dies.

  "Identity isn't about the choices we make," Elara said, her voice trembling. "It's about the capacity to make them. He is the same seed, planted in different soil. If a tree grows crooked because of the wind, is it a different tree?"

  "The law treats the fruit, not the seed," the Magistrate said. "If I rule he is Transworld Identical, I validate the claim that David Vance—the hero—is a man who would let a child die given the chance. I tarnish the record of the deceased. If I rule he is a Counterpart, I condemn a living man to death for the crime of resembling a citizen."

  She slid a single sheet of paper across the desk.

  "There is a third option. A Loophole. The 'Theseus Protocol.' You can grant him asylum as a distinct individual. He lives. But he cannot be David Vance. He must take a new name. Your marriage remains void. You are strangers who share a face."

  Julara pulled her hand away from Julian. "You're asking me to choose. Do I save the man, or do I save the memory?"

  "I am asking you to choose your metaphysics, Mrs. Vance," the Magistrate said softly. "If you believe in essences, sign the Reintegration form. You get your husband back, but you admit he is capable of cowardice. You admit the hero you mourned was just a lucky version of this man. If you believe in counterparts, sign the Asylum form. You save a stranger, but you keep your husband's grave pure."

  Elara looked at Julian. He wasn't looking at her. He was looking at the Reintegration form. He wanted to be David. He wanted the life, the wife, the validity. But she saw the shame in his eyes. He knew he hadn't earned the heroism.

  If she signed the Reintegration, she was forcing him to wear a skin that didn't fit, a moral history he hadn't written. She would be loving a ghost and enslaving a man.

  If she signed the Asylum, she admitted that love is specific to the individual, not the pattern. That David was gone, and no amount of similarity could bridge the gap between *him* and *not-him*.

  "The Humphrey objection," Julian whispered. "I'm not him, Elara. I know I'm not. I remember freezing. He didn't."

  Elara picked up the pen. The room was silent, save for the hum of the reality stabilizers. She realized then that the Magistrate wasn't testing the law. She was testing *them*. The law was just the mechanism to force the truth out.

  If Transworld Identity was true, then moral luck was an illusion, and David's sacrifice meant nothing because in some world, he didn't make it. If Counterpart Theory was true, then David's sacrifice was absolute, unique, and gone forever.

  Elara looked at the Magistrate. "The law assumes identity is a property of the object," she said. "But it's a property of the observer."

  "That is not a legal argument," the Magistrate warned.

  "It is if the law is meant to serve the living." Elara turned to Julian. "I can't make you him. That's a lie. And I won't make him you. That's a cruelty."

  She signed the Asylum form.

  Julian let out a breath he seemed to have been holding for three years. His shoulders slumped, not in defeat, but in relief. The weight of the dead hero's legacy slid off him.

  "Name?" the Magistrate asked, stamping the document.

  "Julian," he said. "Just Julian."

  "Mrs. Vance," the Magistrate said, standing up. "You understand the consequence? He is a stranger. You have no claim on him, and he has no claim on you. You are alone."

  Elara stood up. She looked at Julian—this man who had her husband's face, but his own soul. A counterpart. A neighbor. A distinct, numerically separate human being who deserved to live for his own sake, not as a replacement.

  "I know," Elara said. She walked to the door, then paused. She didn't look back. If she looked back, she might try to see David in him again. She had to let the metaphysics hold. She had to let the dead be dead, and the living be living.

  "Wait," Julian said.

  Elara stopped, but she didn't turn.

  "In my world," Julian said to her back. "We were happy. Before the divergence. Before the van."

  "I know," Elara said. "But that was a different story."

  She walked out into the corridor. The air was thin and cold. She clutched the purse with the death certificate. It was heavy. It was real. It was hers.

  Behind her, the door to the chamber closed, sealing Julian in his new life, a stranger in a strange world, saved by the truth that he was not the man she loved. And for the first time in three years, Elara felt the sharp, clean pain of a grief that was finally, metaphysically, honest.
