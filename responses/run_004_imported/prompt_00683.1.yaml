          *   If analysis/theorem: Secures the mathematical foundation, isolates it from physics.

  3.  **Deconstruct Question 2: Kripke's Argument:**
      *   *The Claim:* Kripke (2013, "The Church-Turing Thesis as a Special Corollary of Gödel's Completeness Theorem").
      *   *The Logic:*
          1.  Computation is a mechanical process.
          2.  Mechanical processes can be described in first-order logic (FOL).
          3.  Gödel's Completeness Theorem says if something is valid in all models, it's provable.
