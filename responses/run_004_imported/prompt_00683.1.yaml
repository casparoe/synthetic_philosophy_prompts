          *   **Empirical Hypothesis:** Post's view. Like a law of physics. Can be corroborated but not proved. Fits the user's prior view.
          *   **Conceptual Analysis:** The standard philosophical view (e.g., Soare, Mendelson). It analyzes the pre-theoretic concept of "algorithm" and shows it extensionally matches Turing machines.
          *   **Theorem (Kripke/Gandy):** It can be derived from more basic axioms about computation.
      *   *Implications:*
          *   If definition: No debate, but potentially misses the point of *why* it holds.
