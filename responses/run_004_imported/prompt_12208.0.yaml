answer: |-
  Here are ten questions designed to press the speaker on the structural and philosophical vulnerabilities of Updateless Decision Theory (UDT), complete with anticipated responses and follow-ups to keep the pressure on.

  ### 1. The Scope of Rational Commitment
  **Question:** "Standard defenses of UDT lean heavily on cases like Parfit's Hitchhiker or Newcomb's Problem, where a predictor rewards the *disposition* to pay. But in those cases, the payoff is contingent on a specific mechanism—a predictor—tracking your policy. If we remove the predictor, the updateless agent still refuses to update on its location in the decision tree, effectively paying costs in branches where the causal leverage is gone. Why should we view this as a general norm of rationality, rather than a specialized hack that only yields dividends in the presence of Omega-like entities?"

  *   **Likely Answer:** "Rationality is about selecting the best policy ex-ante, not the best act ex-post. The 'cost' in the losing branch is the price of admission for the reward in the winning branch; removing the predictor just changes the expected utility calculation, but the *method* of policy selection remains the same."
  *   **Follow-up:** "But if the method prescribes incurring a cost in a branch where no predictor is watching and no future benefit is possible, isn't the agent effectively acting on a counterfactual dependency that doesn't exist? At what point does 'policy selection' become indistinguishable from simply ignoring available information?"

  ### 2. The Prior over Logical Facts
  **Question:** "UDT requires an agent to optimize a policy relative to a prior before updating on observations. This is manageable for empirical uncertainty, but UDT is often touted as handling logical uncertainty as well. But if the agent is a fixed program, what does it mean for it to have a prior over its own output or mathematical truths? If the prior assigns probability to logical sentences the agent hasn't yet proven, isn't that just a placeholder for the computation it is about to perform?"

  *   **Likely Answer:** "We use a distribution over logical sentences, like a logical inductor, to represent uncertainty about what the computation will output before it runs. The agent optimizes against this distribution."
  *   **Follow-up:** "If the agent updates that distribution as it deduces more theorems during the computation, hasn't it effectively updated? If it *doesn't* update the distribution during computation, isn't it optimizing against a known false prior? Where exactly is the 'updateless' line drawn in a reasoning process?"

  ### 3. The Commitment Race
  **Question:** "In game-theoretic settings, UDT seems to reward the agent who commits earliest and most irrevocably, since later agents must treat the early commitment as a fixed fact of the environment. Doesn't this generate a 'commitment race' where rational agents are incentivized to commit before they have deliberated on the merits of the case? It seems the theory prescribes rashness as a strategic virtue."

  *   **Likely Answer:** "That is a risk in uncoordinated environments. However, in equilibrium, agents should adopt norms that penalize rash commitment, or use cryptographic commitments that allow for deliberation time before the commitment becomes visible."
  *   **Follow-up:** "But doesn't appealing to 'norms' or external coordination mechanisms just import standard causal or evidential reasoning to fix a hole in UDT? If UDT itself dictates that the first mover wins, isn't the theory itself the driver of the race, regardless of the social norms we layer on top?"

  ### 4. Self-Locating Uncertainty and Copies
  **Question:** "Proponents often claim UDT dissolves the Sleeping Beauty problem or the halfer/thirder dispute by treating all copies of the agent as a single locus of decision-making. But isn't this just a relabeling of the halfer position? If I wake up and know I am one of two copies, but I act as if I control both, haven't I simply defined away the subjective uncertainty rather than solving it?"

  *   **Likely Answer:** "It's not relabeling; it's recognizing that subjective probability is the wrong tool for decision problems. The question isn't 'where am I?' but 'what policy should the algorithm instantiate?' The 'halfer' betting odds emerge naturally from optimizing the global policy."
  *   **Follow-up:** "But if the copies have divergent interests—for instance, if only one copy will survive the experiment—does the 'global policy' still hold? If the theory tells the copy to sacrifice itself for the other copy solely because they share a source code, are we still talking about individual rationality, or have we shifted to a theory of group agency?"

  ### 5. The "Troll Bridge" Problem
  **Question:** "In proof-based variants of UDT, there is the 'Troll Bridge' scenario: an agent refuses to cross a bridge because it reasons, 'If I were the type of agent to cross, I would have proven it safe, but since I can't prove it safe, crossing implies inconsistency, so the troll will blow it up.' The agent ends up stuck on the side of the road due to a spurious counterfactual. How does UDT distinguish between valid logical correlations and these self-fulfilling prophecies of doom?"

  *   **Likely Answer:** "This is a problem for specific implementations using proof-based logic, not necessarily for the general UDT framework. We can use probabilistic logical reasoning rather than strict proof to avoid the agent reasoning itself into a corner."
  *   **Follow-up:** "But if we move to probabilistic reasoning, don't we lose the guarantee of logical consistency that made the proof-based approach attractive? If the agent can be wrong about logical implications, how do we ensure it doesn't simply update on its own errors, violating the updateless constraint?"

  ### 6. Bounded Rationality and Tractability
  **Question:** "UDT requires searching the space of all possible policies to find the one that maximizes expected utility. For any non-trivial environment, this space is computationally intractable. Is UDT intended as a normative ideal for omniscient agents, or is there a tractable approximation that bounded agents like us can actually use without collapsing back into CDT or EDT?"

  *   **Likely Answer:** "It is a normative ideal, much like Bayesian coherence. We aim to approximate it using heuristics or limited policy searches."
  *   **Follow-up:** "If the approximation requires us to ignore vast swathes of the policy space, isn't it likely that the 'optimal' policy we find is only optimal relative to our blindness? If the theory is uncomputable, in what sense does it guide action rather than just describe a hypothetical optimum?"

  ### 7. Interaction with CDT Agents
  **Question:** "In a mixed population, a UDT agent will cooperate with other UDT agents in Prisoner's Dilemmas, treating the other's move as logically correlated with its own. But against a standard Causal Decision Theorist who defects, the UDT agent still cooperates (if it predicts the CDT agent's move is fixed). Doesn't this make UDT agents evolutionarily unstable, systematically exploited by CDT defectors in non-Newcomb scenarios?"

  *   **Likely Answer:** "UDT agents can model the CDT agent and recognize that their output is *not* logically correlated. In that case, UDT reduces to CDT and defects. It only cooperates when there is actual logical correlation."
  *   **Follow-up:** "But determining whether there is 'actual logical correlation' requires modeling the other agent's source code. If the CDT agent is an opaque black box, doesn't the UDT agent have to assume correlation to be safe, thereby inviting exploitation? Where is the threshold for assuming correlation?"

  ### 8. Successor Agents and Lock-In
  **Question:** "If I am an updateless agent designing a successor AI, UDT suggests I should bind the successor to my current prior and values, preventing it from updating on information I don't yet have. But if my current prior is flawed, this locks in my errors forever. Doesn't UDT imply a radical conservatism that prevents moral or epistemic progress in successor agents?"

  *   **Likely Answer:** "You would design the successor to optimize the policy *you* would have chosen had you known what you know now. You can build in mechanisms for the successor to correct for your known blind spots."
  *   **Follow-up:** "But if the successor is correcting for your blind spots based on information you don't have, isn't it effectively updating? If it updates, it's not UDT. If it doesn't, it's locked in. How do you square the circle of delegating to a smarter agent without relinquishing updateless control?"

  ### 9. Empirical Distinctions
  **Question:** "Outside of thought experiments involving predictors, copies, or logical correlations, does UDT make different empirical predictions than Causal Decision Theory? In standard real-world decisions where my choice doesn't logically correlate with others' choices or a predictor's past action, does UDT prescribe a different action?"

  *   **Likely Answer:** "In standard cases with no logical correlations, UDT collapses to CDT. The divergence only happens in specific structural cases."
  *   **Follow-up:** "If the theories converge in 99% of real-world cases, and diverge only in scenarios we rarely encounter, isn't the debate largely about the metaphysics of counterfactuals rather than practical guidance? Why should a department of decision theory prioritize a framework that changes so little in practice?"

  ### 10. The Metaphysics of the "Policy"
  **Question:** "UDT treats the 'policy' as the primary object of evaluation rather than the 'act.' But a policy is just a mapping from observations to acts. If the agent is physically instantiated in time, it only ever executes one act at one time. What is the ontological status of the 'policy' that makes it a suitable target for utility maximization? Are we maximizing over abstract mathematical objects rather than physical events?"

  *   **Likely Answer:** "We are maximizing over the output of the algorithm. The physical instantiation is just a realization of that algorithm. The utility is defined over the consequences of the algorithm's output."
  *   **Follow-up:** "But if the physical instantiation is what causes the consequences, and the algorithm is abstract, how does the abstract policy exert causal power? If you say 'logical causation,' aren't we relying on a metaphysical notion that is even less understood than the causal counterfactuals UDT was meant to replace?"
