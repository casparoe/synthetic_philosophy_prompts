  **Move 1 (Marcus):** Score: 1. Marcus is historically robust regarding Original Public Meaning; the consensus in 1787–1850 was indeed that these clauses protected slavery. However, calling Douglass's textualism a "card trick" is rhetorically dismissive of a serious jurisprudential argument, reducing a methodological shift to mere deceit.

  **Move 2 (Leah):** Score: 2. Leah accurately identifies Douglass's actual legal mechanism: he wasn't just counting missing words, he was applying a specific canon of construction (ambiguity resolved in favor of liberty) anchored in the Preamble's normative goals. This aligns perfectly with the Dworkinian "moral reading" you're teaching.

  **Move 3 (Marcus):** Score: 0. While Marcus raises a valid theoretical concern about indeterminacy (the Scalia critique of Dworkin), he undermines his own position by committing the genetic fallacy he later gets charged with. Dismissing an argument because of the timing of its adoption weakens the jurisprudential critique.

  **Move 4 (Leah):** Score: 2. Leah is logically precise here. She correctly identifies that the validity of a legal interpretation is independent of the political motives behind it, and she rightly notes that Garrison's abolitionism was equally motivated, just overtly theological rather than legalistic.

  **Move 5 (Marcus):** Score: 1. This is Marcus's strongest point: euphemism in a legal text usually signals complicity, not opposition. However, it scores a 1 rather than 2 because Douglass's counter-argument relies on federalism (that the Constitution grants no *power* to support slavery), which makes the "embarrassment" inference debatable rather than definitive.

  ***

  **The Deeper Interpretive Issue**

  Neither student quite isolates the fundamental tension driving the debate: **the source of Constitutional legitimacy.** Marcus is arguing from **historical authority** (the document is binding because of the original agreement and understanding), while Leah/Douglass are arguing from **normative authority** (the document is binding because its text *can* be reconciled with justice). Douglass's genius—and his vulnerability—lies in trying to claim the historical authority of the text while rejecting the historical understanding of it. The unresolved question isn't just how to read the clauses, but whether a Constitution can remain legitimate if its original public meaning is morally bankrupt, even if its semantic text allows for a moral reading. This is the exact friction point between Scalia's Originalism and Dworkin's Law as Integrity.
