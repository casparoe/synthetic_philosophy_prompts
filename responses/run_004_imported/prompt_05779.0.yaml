answer: |-
  Here are nine interview questions designed to probe the tensions within epistocratic theory, including the three specific thematic requirements you requested. Each includes a follow-up tailored to the philosopher's most probable defense.

  **1. The "Enlightened Preference" Trap**
  Some proponents suggest we could weight votes not by actual test scores, but by demographically corrected estimates of what a fully informed citizen *would* prefer. Critics argue this is a statistical mirage that simply re-entrenches existing hierarchies by assuming the preferences of the currently educated class are the "correct" counterfactual for everyone. If the model of the "fully informed citizen" is built on data from a society already shaped by inequality, doesn't this just relabel bias as competence?
  *   **Follow-up:** If she argues that *better data* can isolate ignorance from identity, ask: "Who determines which variables in that dataset count as 'ignorance' and which count as 'lived experience'?"

  **2. The Estlund Objection**
  David Estlund argues that for a political system to be legitimate, its criteria must be acceptable to all "qualified points of view." He charges that epistocracy fails because no criterion for identifying superior political judgment can be accepted by every reasonable citizen without feeling insulted by the implication that their moral standing is secondary to their cognitive performance. Do you believe political legitimacy can survive being unmoored from the principle of equal respect?
  *   **Follow-up:** If she claims that *competence is a neutral fact* and not an insult, ask: "Is political authority a technical management role, or does it inherently express a judgment on the moral worth of the governed?"

  **3. The Partisan Incentive**
  There is a risk that institutionalizing testing for voting privileges manufactures confident partisans rather than the dispassionate reasoners epistocracy is supposed to elevate. If citizens know their franchise depends on passing a civics or economics exam, they may invest in learning rationalizations for their tribe's positions rather than engaging in genuine inquiry. How do you prevent the testing regime from becoming a machine for producing sophisticated dogmatists?
  *   **Follow-up:** If she suggests *testing for cognitive bias* rather than policy knowledge, ask: "Isn't the identification of 'bias' itself culturally loaded, potentially penalizing non-dominant modes of reasoning?"

  **4. The Transition Paradox**
  Your theory suggests a superior outcome to universal suffrage, but the transition to epistocracy would seemingly require a democratic mandate. If the majority must vote to limit their own voting power, why would they ever agree to it? And if they don't, does implementing epistocracy by any other means not constitute a kind of benevolent coup?
  *   **Follow-up:** If she argues for *gradual implementation* (e.g., starting with local elections), ask: "Won't the newly enfranchised elite use their initial advantage to block further reform and cement their status?"

  **5. Guarding the Guardians**
  In any system where a specific body administers the competence tests, that body holds immense power over the composition of the electorate. History suggests that administrative discretion often drifts toward self-preservation. What institutional checks exist to prevent the testing authority from subtly adjusting the difficulty or content of exams to favor their own political allies?
  *   **Follow-up:** If she proposes *independent oversight* similar to a judiciary, ask: "Courts are already accused of political capture; what makes an epistocratic council immune to the same pressures?"

  **6. The Solidarity Deficit**
  Universal suffrage serves a expressive function: it signals that every citizen is an equal stakeholder in the regime, regardless of their utility or intellect. By stratifying the franchise, do you risk eroding the civic solidarity required to sustain redistributive policies or shared sacrifice during crises? Does a "two-tier" citizenship invite the disenfranchised to view the state as an occupier rather than a representative?
  *   **Follow-up:** If she claims *civil rights remain intact* regardless of voting weight, ask: "Is the right to petition power a sufficient substitute for the right to constitute it?"

  **7. Long-Termism vs. Class Interest**
  A common defense of epistocracy is that weighted voting encourages long-term thinking over populist short-termism. However, the demographic most likely to score high on political competence tests is also the demographic most likely to hold capital assets. How do you distinguish between policies that benefit the *future* and policies that merely benefit the *asset-holding class* in the long run?
  *   **Follow-up:** If she cites *empirical studies* on voter knowledge and economic growth, ask: "Do those studies control for the possibility that 'growth' is being measured by metrics that favor capital over labor?"

  **8. Exit, Voice, and Loyalty**
  Political scientist Albert Hirschman noted that when members of an organization lose the ability to exercise "voice" (voting), they often resort to "exit" (disengagement or capital flight) or "loyalty" (radicalization). If a significant portion of the population is effectively downgraded to second-class citizens, do you fear an epistocratic state would face higher rates of civil unrest or secessionist movements than a democratic one?
  *   **Follow-up:** If she argues that *policy outcomes will be better* so unrest will decrease, ask: "Do people rebel based on objective outcomes, or based on the perceived legitimacy of the process that delivered them?"

  **9. Fiction as a Stress Test**
  As a novelist, I construct scenarios to see how systems break under human pressure. Philosophers often construct idealized models to see how systems function in theory. When you read fiction about epistocracies, do you look for flaws in the *logic* of the system, or flaws in the *human nature* that must operate it? And does your theory account for the fact that humans often resent being judged more than they resent being ruled?
  *   **Follow-up:** If she says *fiction is useful for thought experiments*, ask: "Does your model survive the narrative test of human messiness, or does it require citizens to be more rational than they actually are?"
