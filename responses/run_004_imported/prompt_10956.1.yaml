answer: |-
  **MEMORANDUM**

  **TO:** Civil Jury Instructions Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **RE:** Revision of Causation Instruction: Multiple Sufficient Causes (Overdetermination)

  ### I. Introduction

  Per our last meeting, I have reviewed the current draft instruction regarding legal causation in scenarios involving multiple independent sufficient causes (often termed "overdetermination"). The classic fact pattern involves two negligently set fires merging to destroy a plaintiff's barn, where either fire alone would have sufficed to destroy the structure.

  Our current instruction relies on the "substantial factor" test derived from the *Restatement (Second) of Torts*. While functional, this standard is increasingly criticized for lacking analytical rigor. It tells the jury *what* to decide but not *how* to reason through the logical gap left by traditional "but-for" causation.

  This memo proposes a revised instruction grounded in the *Restatement (Third) of Torts* approach, which aligns more closely with modern causal theory (specifically structural/interventionist models). It also provides an analysis of why we might nevertheless retain the *Restatement (Second)* language.

  ### II. The Problem: Counterfactuals vs. Overdetermination

  Our standard "but-for" instruction asks the jury to engage in counterfactual reasoning: *But for the defendant's conduct, would the harm have occurred?*

  In overdetermination cases, this logic breaks down. If Defendant A and Defendant B both negligently set fires that merge:
  1.  **But-for A:** If A hadn't acted, B's fire would have burned the barn. (No causation).
  2.  **But-for B:** If B hadn't acted, A's fire would have burned the barn. (No causation).

  Strict counterfactual theory (à la David Lewis) struggles here because the outcome is invariant to the removal of either single cause. To avoid absolving both defendants of liability, courts historically deployed the "substantial factor" test. However, as a conceptual matter, "substantial factor" is a conclusion, not a test. It asks the jury to intuit causation without explaining *why* intuition overrides the failed counterfactual test.

  ### III. Theoretical Grounding: From Counterfactuals to Structures

  Recent developments in the philosophy of causation—specifically the interventionist and structural-equation frameworks (e.g., Woodward, Pearl, Halpern)—offer a more robust justification for liability in these cases.

  Unlike simple counterfactual theory, which looks at single alternative worlds, structural models analyze the **causal architecture** of the actual event. They ask whether the defendant's conduct was part of the *actual mechanism* that produced the harm, regardless of whether a backup mechanism existed.

  **Why this matters for the instruction:**
  Under a structural view, Defendant A is a cause not because the barn *would* have survived without them (it wouldn't have), but because A's fire was an **active component of the sufficient set** that actually occurred. The existence of a redundant cause (B's fire) does not negate the causal status of A's fire within the actual structure of events.

  Therefore, the instruction should not ask the jury to pretend the "but-for" test works. It should explicitly acknowledge the exception and direct them to focus on the **sufficiency** of the negligence rather than the **necessity** of it.

  ### IV. Proposed Instruction (Restatement Third Approach)

  I recommend we move away from the generic "substantial factor" language for this specific subset of cases and adopt language mirroring *Restatement (Third) of Torts: Liability for Physical and Emotional Harm* § 27. This captures the structural insight without burdening the jury with academic jargon.

  > **Proposed Instruction: Multiple Sufficient Causes**
  >
  > "Usually, you must find that the defendant's negligence was a 'but-for' cause of the harm. This means you must find that the harm would not have happened without the defendant's negligence.
  >
  > However, there is an exception when there are multiple causes. If you find that:
  > 1. The defendant was negligent; and
  > 2. The defendant's negligence alone would have been enough to cause the harm; and
  > 3. Another cause (whether negligent or not) was also present and would have been enough on its own to cause the same harm;
  >
  > Then you may find the defendant's negligence was a legal cause of the harm, even if the harm would have happened anyway because of the other cause. In this situation, you do not need to find that the harm would have been avoided without the defendant's negligence."

  **Rationale:** This instruction validates the structural intuition. It tells the jury: "We know the but-for test fails here logically. We are instructing you that independent sufficiency is a substitute for necessity."

  ### V. The Case for Retaining the "Substantial Factor" (Status Quo)

  Despite the theoretical advantages of the proposed instruction, there is a compelling pragmatic argument for retaining our current "substantial factor" language.

  1.  **Stare Decisis and Predictability:** Our state's case law for the last 40 years is built on "substantial factor." Changing the verbal formulation risks inviting appeals based on semantic distinctions rather than substantive justice. Defense counsel will argue that "independent sufficiency" is a higher burden than "substantial factor," while plaintiffs will argue the opposite.
  2.  **Jury Cognitive Load:** The *Restatement (Third)* approach requires the jury to engage in a hypothetical determination: *Would this specific fire have burned the barn on its own?* In a merged-fire scenario, this is empirically difficult for a layperson to ascertain. The "substantial factor" test, while vague, allows the jury to use a holistic intuition: *Did this defendant contribute meaningfully to the disaster?*
  3.  **Flexibility:** The "substantial factor" test acts as a catch-all for various causal complexities (overdetermination, preemptive causation, indeterminate defendants). Narrowing the instruction to "multiple sufficient causes" might leave gaps in other complex causation scenarios where the structural path is less clear.

  ### VI. Recommendation

  I recommend the Committee adopt the **Proposed Instruction** above, but retain the "substantial factor" phrase as a bridging concept to maintain continuity with existing case law.

  We can hybridize the instruction to honor the structural theory while respecting precedent. By explicitly defining *when* a factor is "substantial" in overdetermination cases, we provide the jury with the logical tool they currently lack, without breaking from our legal tradition.

  > **Revised Hybrid Instruction**
  >
  > "To be a legal cause of harm, the defendant's negligence usually must be a 'but-for' cause. However, when multiple forces act together to cause harm, a defendant's negligence is a legal cause if it was a **substantial factor** in bringing about the harm.
  >
  > A negligent act is a 'substantial factor' if it was enough on its own to cause the harm, even if another cause was also present that would have been enough on its own. In this specific situation, you do not need to find that the harm would have been avoided without the defendant's negligence."

  **Conclusion:**
  This approach acknowledges the failure of the counterfactual test (satisfying the theoretical critique) while retaining the familiar "substantial factor" terminology (satisfying the pragmatic concern). It guides the jury toward the structural reality of the event without requiring them to solve causal equations.

  I look forward to discussing this at the next meeting.
