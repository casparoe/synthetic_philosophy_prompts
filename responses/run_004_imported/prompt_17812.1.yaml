answer: |-
  This is a fantastic question that cuts right to the heart of modern formal epistemology. You have correctly identified the pivot point: the move from pragmatic consistency (Dutch Books) to epistemic consistency (Accuracy Dominance) relies entirely on the geometry of the scoring rule chosen.

  Here is an intuitive walkthrough of the geometry, the necessity of propriety (and immodesty), and the philosophical worry about circularity.

  ### 1. The Geometry of Dominance

  To see why coherence guarantees accuracy dominance, it helps to visualize credences as points in space.

  **The Setup**
  Imagine you have two mutually exclusive and exhaustive propositions: $P$ and $\neg P$.
  *   **The Truth:** There are only two possible ways the world can be. Either $P$ is true (World 1) or $\neg P$ is true (World 2). We can represent these "omniscient" states as vectors: $W_1 = (1, 0)$ and $W_2 = (0, 1)$.
  *   **The Coherent Credences:** A rational agent must assign probabilities that sum to 1. Geometrically, all coherent credence functions lie on the line segment connecting $(1,0)$ and $(0,1)$. This line is the **probability simplex**.
  *   **The Incoherent Credences:** Any point *off* that line is incoherent. For example, $c = (0.6, 0.6)$ sums to 1.2. This point lies "outside" the simplex, further from the origin.

  **The Accuracy Measure as Distance**
  Joyce's argument treats inaccuracy as a "distance" between your credence point $c$ and the actual world point $W$.
  *   If the world is $W_1$, your inaccuracy is the distance between $c$ and $(1,0)$.
  *   If the world is $W_2$, your inaccuracy is the distance between $c$ and $(0,1)$.

  **The Dominance Claim**
  The theorem states: If your credence $c$ is incoherent (off the line), there exists a coherent credence $c^*$ (on the line) that is **strictly closer** to $W_1$ *and* **strictly closer** to $W_2$ than $c$ is.

  **Why Quadratic (Brier) Works**
  The Brier score corresponds to **Euclidean distance** (specifically, squared Euclidean distance).
  Imagine your incoherent credence is a point floating above the line segment. The "iso-accuracy" contours (lines of equal distance) for Euclidean distance are circles centered on the truth points.
  Because the probability simplex is a convex set (a straight line in this 2D case), and the distance function is strictly convex (circles curve inward), you can geometrically "project" your incoherent point perpendicularly onto the line.
  *   By the Pythagorean theorem, the hypotenuse (distance from incoherent point to truth) is always longer than the leg (distance from projected coherent point to truth).
  *   Therefore, the projected point is closer to *both* truth vertices simultaneously. You reduce your error in World 1 *and* World 2 just by moving onto the line.

  **Why Absolute Value Fails**
  Now, imagine measuring distance using **absolute value** (Manhattan distance). The "iso-accuracy" contours are no longer circles; they are **diamonds** (squares rotated 45 degrees).
  If you are at an incoherent point like $(0.6, 0.6)$, and you project to the coherent point $(0.5, 0.5)$:
  *   **World 1 $(1,0)$:**
      *   Incoherent loss: $|0.6 - 1| + |0.6 - 0| = 0.4 + 0.6 = 1.0$
      *   Coherent loss: $|0.5 - 1| + |0.5 - 0| = 0.5 + 0.5 = 1.0$
  *   **World 2 $(0,1)$:**
      *   Incoherent loss: $|0.6 - 0| + |0.6 - 1| = 0.6 + 0.4 = 1.0$
      *   Coherent loss: $|0.5 - 0| + |0.5 - 1| = 0.5 + 0.5 = 1.0$

  Under the absolute value rule, the incoherent credence is **not strictly dominated**. It is merely *equal* in accuracy to the coherent one. In other configurations, an incoherent credence might even be closer to one truth point than its coherent projection, provided it is further from the other. The "diamond" geometry allows you to slide along the edge of an iso-accuracy contour without improving your score.

  Because the absolute value rule is not *strictly* convex in the right way, it cannot guarantee that *every* incoherent point is strictly worse than *some* coherent point in *every* world. The dominance argument collapses.

  ### 2. Immodesty and Propriety

  You asked about the connection to **immodesty**. This is the bridge between the geometry and the agent's perspective.

  **Definition:** A scoring rule is **proper** if, when you have a credence $p$, you minimize your *expected* inaccuracy by reporting $p$. It is **strictly proper** if reporting $p$ is the *unique* minimizer.
  **Immodesty:** A credence function is immodest if, by its own lights, it expects itself to be more accurate than any alternative credence function.

  **The Connection**
  If a scoring rule is improper, it violates immodesty.
  Imagine a rule where, if you truly believe $P$ with 70% confidence, the rule tells you that you would get a better (lower) expected score by reporting 90%.
  *   This means your own credence function looks at itself and says, "I am not the best estimator; that guy over there reporting 90% is better."
  *   This severs the link between *truth-seeking* and *honesty*. If the metric of accuracy incentivizes you to misreport your actual belief, then minimizing that metric isn't about being accurate to the world; it's about gaming the metric.

  **Why Dominance Requires Propriety**
  The dominance argument relies on the idea that the "closest" coherent point is the one you *should* adopt. But why that point?
  Under a strictly proper rule, the geometry of the scoring rule aligns with the agent's expectations. The "gradient" of the accuracy function points toward the truth in a way that respects the agent's current information.
  If the rule is improper, the "closest" coherent point geometrically might not be the one that minimizes *expected* inaccuracy from the agent's perspective. The dominance argument proves that a coherent alternative exists that is better in every world, but without propriety, the agent cannot recognize that alternative as an improvement *from their own perspective*. Propriety ensures that the external measure of accuracy aligns with the internal rational requirement to maximize expected accuracy.

  ### 3. Is This Circular? (The "Smuggling" Objection)

  This is the most contentious philosophical point. You asked: *Is restricting to proper scoring rules a neutral methodological choice, or does it smuggle probabilism in?*

  **The Charge**
  Critics (like Hilary Greaves, David Fallis, and others) argue that **propriety essentially encodes probabilism.**
  To demand a scoring rule be "proper" is to demand that it satisfy the mathematical condition:
  $$ p \cdot S(1, p) + (1-p) \cdot S(0, p) \text{ is minimized at } p $$
  This equation looks suspiciously like the expectation formula for probabilities. By insisting that a rational measure of accuracy *must* satisfy this, aren't we just assuming that rational agents must maximize expected utility defined over probabilities? If so, Joyce hasn't *derived* probabilism; he has assumed a definition of accuracy that only probabilists can satisfy.

  **The Defense (Joyce, Pettigrew, Leitgeb)**
  Proponents argue that propriety is not about probabilities; it is about **truth-directedness**.
  *   **The Argument:** If I believe $P$ with 0.7 confidence, I judge that $P$ is likely true. A measure of *accuracy* should reflect that judgment. If a scoring rule tells me that reporting 0.9 yields a better expected score than reporting 0.7, that rule is not measuring accuracy; it is measuring something else (like boldness, or calibration, or information content).
  *   **Neutrality:** They claim propriety is a minimal constraint on what it means to care about the truth. To care about the truth is to want your reported confidence to match your actual confidence. Any rule that incentivizes you to report otherwise is, by definition, not a pure measure of accuracy.

  **The "Separateness of Propositions" Objection**
  A deeper objection comes from the "separateness of propositions." Epistemic utility theory is consequentialist: it aggregates accuracy across propositions to judge a belief system.
  Some argue that rationality is deontological regarding individual beliefs. I should believe $P$ to the degree the evidence supports, regardless of whether doing so makes my *overall system* score better on a Brier scale.
  If you accept this, the dominance argument fails because it assumes we ought to minimize global inaccuracy scores. If we only care about the accuracy of *this* belief right now, the fact that a different *system* of beliefs would dominate globally is irrelevant.

  **Verdict**
  Is it circular? **Not formally, but arguably materially.**
  It does not assume the probability axioms as a premise. However, it assumes that "epistemic utility" must be measured by a strictly proper scoring rule. Since the class of strictly proper scoring rules is mathematically isomorphic to the class of expectations generated by probability functions, the choice of scoring rule does a lot of heavy lifting.
  It is best viewed not as a "proof from nowhere," but as a **dominance argument conditional on a specific norm of truth-seeking.**
  *   **If** you accept that rational accuracy requires immodesty (you should expect your own beliefs to be best),
  *   **And** you accept that rational choice requires avoiding dominated strategies,
  *   **Then** you must be probabilistic.

  The debate is whether the first "If" is a neutral constraint on accuracy or a disguised version of the conclusion. Most accuracy-first epistemologists argue it is the former: a rule that tells you to lie about your confidence to maximize score is simply not a rule about accuracy.

  ### Summary
  1.  **Geometry:** Coherent credences lie on a simplex. Incoherent ones lie off it. With Brier (quadratic/Euclidean), you can always project an off-line point onto the line to get strictly closer to all truth vertices. With Absolute Value (linear/diamonds), you can only guarantee you won't do worse, not that you'll do better.
  2.  **Propriety:** Ensures that the external accuracy metric aligns with the agent's internal expectations (Immodesty). Without it, "maximizing accuracy" might mean "misreporting belief."
  3.  **Circularity:** It's not a logical circle, but it relies on a substantive normative premise: that accuracy must be measured in a way that makes honesty the optimal policy. Whether that premise is "neutral" or "loaded" is the main battleground in contemporary formal epistemology.
