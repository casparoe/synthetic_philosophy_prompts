      *(Self-Correction on Move 3)*: Walter's defense of Equivalence is very strong. I must emphasize that denying Equivalence is very costly (intensional contexts). Renata doesn't actually deny Equivalence in Move 2, she denies the *relevance* of the confirmation. In Move 4, she attacks Nicod to save the intuition. I need to make sure I track that shift.

