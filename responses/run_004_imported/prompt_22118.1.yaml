answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Justice Reform Commission
  **FROM:** Dr. [Your Name], Embedded Methods Advisor
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on the Adoption of the Meridian Risk Assessment Instrument

  ### Executive Summary

  This memo recommends that the Commission **adopt the Meridian Score with specific binding conditions**, rather than rejecting the instrument or adopting it in its current vendor-recommended configuration.

  Specifically, I recommend that Meridian be used solely as an **advisory input** rather than a mandatory determinant of bail, and that the Commission formally adjust the **decision threshold for detention** to prioritize the reduction of False Positives (unnecessary detention) over predictive accuracy.

  This recommendation acknowledges a mathematical constraint identified in recent computational social science literature (the "Impossibility Theorem") which proves that when base rates of rearrest differ by race, we cannot simultaneously satisfy calibration, equal false-positive rates, and equal false-negative rates. We must choose which metric to optimize. Given the legal risks of explicit race-norming and the ethical imperative of the presumption of innocence, this memo argues for optimizing for liberty (lowering False Positives) even at the cost of overall predictive accuracy.

  ### The Mathematical Bind: Why We Cannot Have It All

  The dispute before this Commission is not merely political; it is mathematical. The vendor and the Data-Equity Subcommittee are both correct within their own frames, but neither frame can fully prevail without violating the other.

  This is an instance of the incompatibility theorem described by Kleinberg, Mullainathan, and Raghavan (2016) and Chouldechova (2017). The theorem demonstrates that when two groups have different underlying base rates of an outcome—in this case, rearrest (46% for Black defendants vs. 26% for white defendants)—a risk model cannot satisfy three fairness criteria simultaneously:
  1.  **Calibration:** (Satisfied by Meridian) A score of "7" means the same risk level regardless of race.
  2.  **False Positive Rate Balance:** (Failed by Meridian) The rate at which non-rearrested defendants are flagged as high risk.
  3.  **False Negative Rate Balance:** (Failed by Meridian) The rate at which rearrested defendants are flagged as low risk.

  Because the base rates differ, Meridian's success at calibration *guarantees* the error rate disparity the Subcommittee has identified. Black defendants who do not reoffend are flagged as high-risk at nearly double the rate of white defendants (41% vs. 21%).

  **To the Vendor:** You are correct that this is not a defect unique to Meridian. Any algorithm calibrated to these data will exhibit this tension. Demanding a tool that is both perfectly calibrated and has equal error rates across races is mathematically impossible without altering the underlying data generation process.

  **To the Subcommittee:** You are correct that "mathematical inevitability" is not a moral absolution. A tool that is "equally accurate on average" can still distribute the burden of its errors unequally. In this case, the cost of the tool's mistakes is indeed loaded onto Black defendants in the form of unnecessary pretrial detention (False Positives).

  ### The Legal Constraint: Why Race-Specific Cutoffs Are Not Viable

  The Subcommittee has proposed race-specific decile cutoffs to force error-rate balance. While this would mathematically correct the FPR gap, our outside counsel has correctly identified the Equal Protection risk.

  Establishing different scoring thresholds based explicitly on race constitutes a facial racial classification. Under current Fourteenth Amendment jurisprudence, this triggers strict scrutiny. To survive, the County would need to demonstrate a compelling government interest and that the policy is narrowly tailored. While reducing disparity is compelling, courts have historically been hostile to explicit racial classifications in criminal justice algorithms (see *State v. Loomis* dicta and recent DOJ guidance). Adopting race-normed cutoffs invites litigation that could dismantle the entire reform framework.

  ### Recommendation: Adopt with Conditions

  We cannot solve the mathematical impossibility, but we can manage its consequences through policy. We must choose which error is more costly. In a pretrial system grounded in the presumption of innocence, **False Positives (detaining the innocent) are ethically and legally more costly than False Negatives (releasing the risky).**

  Therefore, I recommend the following:

  **1. Advisory Use Only:**
  Meridian scores shall not be the sole basis for detention. Judges must provide written justification if they detain a defendant against the instrument's recommendation. This prevents the automation of bias.

  **2. Threshold Adjustment for Liberty:**
  To address the False Positive disparity without explicit race-norming, the Commission should lower the global threshold for "High Risk" designation. Currently, Deciles 1–5 might be presumptive release. I recommend expanding presumptive release to **Deciles 1–6**.
  *   **Why this works:** Lowering the threshold for detention reduces the False Positive Rate for *all* defendants. Because the Black FPR is currently higher, this reduction narrows the absolute gap between groups without using race as an input.
  *   **The Trade-off:** This will increase the False Negative Rate (more released defendants may be rearrested). We must accept this risk as the cost of prioritizing liberty and reducing disparate impact.

  **3. Continuous Disparity Auditing:**
  Adoption is contingent on a quarterly audit. If the FPR gap widens beyond a specified tolerance (e.g., 5 percentage points) despite the threshold shift, the Commission will suspend use of the instrument for a review period.

  ### Implementation Timeline

  *   **November 15, 2023:** Commission Vote. If passed, vendor contract amended to reflect "Advisory Use Only" status.
  *   **December 1, 2023:** Judicial Training. Judges trained not on how to *follow* the score, but on how to *weigh* it against the new presumptive release guidelines (Deciles 1–6).
  *   **March 1, 2024:** First Quarterly Audit. My office will release a public report on FPR/FNR disparity by race.
  *   **June 1, 2024:** Review Point. Commission votes to continue, modify thresholds further, or terminate based on Audit #1 and #2 data.

  ### Conclusion

  We are facing a choice between imperfect options. Rejecting Meridian returns us to unstructured judicial discretion, which historical data suggests is less calibrated and often more disparate than algorithmic aid. Adopting Meridian as-vendor-sold institutionalizes a disparate False Positive burden on Black defendants.

  The path forward is to adopt the tool but refuse the vendor's operating parameters. We accept the vendor's mathematical reality—that we cannot balance all metrics—but we reject their policy conclusion that we must accept the current error distribution. By shifting the threshold to favor release, we acknowledge that in a free society, the cost of a False Positive (loss of liberty) outweighs the cost of a False Negative (risk of rearrest). This does not solve the mathematical impossibility, but it aligns the tool's inevitable errors with our constitutional values.

  **Recommendation:** **Adopt with Conditions** as outlined above.
