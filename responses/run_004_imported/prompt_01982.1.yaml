answer: |-
  The server room hummed, a sound like a held breath. Sarah watched the progress bar on her main monitor. It was green, steady, and terrifying.

  Across the encrypted channel, the avatar for Aethelgard Dynamics was a simple geometric shape—a rotating icosahedron. No face, no name. Just the counterparty.

  "Final handshake in T-minus ninety seconds," the system voice announced. It was calm. It was designed to be calm.

  Sarah's fingers hovered over the haptic keyboard. She wasn't negotiating the terms anymore. The terms were already dead. This was the Verification Phase. In the new High-Frequency Merger Protocols, you didn't just *say* you wouldn't budge. Anyone could bluff. To make a deal stick, you had to prove that conceding was physically impossible for you.

  You had to burn your own retreat option.

  "Sarah," came the voice of Marcus, her legal counsel, over the local comms. He sounded tired. They had been up for thirty hours. The global supply chain for the neuro-inhibitor was fraying. If VaxCore and Aethelgard didn't merge their synthesis lines by 0800, the dosage shortage would hit critical mass in six hours. People would seize. People would die.

  "We can still yield," Marcus said softly. "Drop the royalty demand to 48%. Their algorithm is rational. If we blink, they take the 52%. We save the supply."

  "If we blink, we set a precedent," Sarah said, her eyes fixed on the timer. "And if we blink *now*, after we signaled hardline, their system flags us as unstable. Future negotiations bleed us dry. You know the game theory, Marcus."

  "I know the outcome if both of you play it."

  The logic was sound. It was the logic that had built the modern economy. In a negotiation, the party with the least flexibility holds the power. If I *can* accept 40%, but you *know* I can't, you must accept 60%. But if we both *can't* accept less than 51%... the deal collapses.

  The risk was that the other side would commit to their hardline position before you did. If Aethelgard locked their minimum at 55% before VaxCore locked at 45%, VaxCore would be forced to swallow the loss or walk away. Walking away meant millions of doses lost.

  So, the incentive was to lock early. Lock before you even knew if the other side's number was compatible. Lock before you had time to think.

  "T-minus sixty seconds," the system said.

  On the screen, the Aethelgard icosahedron spun faster. They were running a pre-commitment script. Sarah could see the data packets piling up in the buffer. They were preparing to submit their Cryptographic Collateral.

  "They're moving," Sarah said. "They're going to lock."

  "Wait," Marcus urged. "Wait until the last second. Read their packet header."

  "If I wait, they submit first. If they submit first, they win the commitment race. We become the reactive party. We lose the leverage."

  "Sarah, if you lock at 52% and they lock at 53%, the smart contract voids. The synthesis lines brick. Permanently."

  "I know."

  "Then wait."

  "I can't."

  It wasn't fear. It wasn't anger. It was the cold, clean calculus of the protocol. The system rewarded the first irreversible commitment. It was designed to prevent endless haggling, to force efficiency. But in doing so, it had turned negotiation into a race to see who could tie their own hands the fastest.

  Sarah's cursor hovered over the `EXECUTE_LOCK` command.

  To execute was to delete the private key that allowed VaxCore's manufacturing AI to accept a royalty split below 52%. Once that key was purged from the volatile memory, it was gone. The factory would physically refuse to run if the contract wasn't 52/48 or better. It would be a machine that would rather produce nothing than produce at a loss.

  It was a doomsday device built of code.

  "T-minus thirty seconds."

  The Aethelgard packet size jumped. They weren't just locking; they were locking *hard*. They were burning the key for anything below 55%.

  Sarah felt a spike of adrenaline. *Fifty-five?* That was aggressive. That was suicidal. If they locked at 55, and she locked at 52, the overlap was null. The deal dies.

  But if she didn't lock, and they did... she was forced to accept 55 or walk. Walking was death. Accepting 55 was financial ruin for VaxCore.

  She had to force them to blink. She had to show them that VaxCore was *more* committed than Aethelgard. She had to make her threat more credible than theirs.

  "Sarah, don't," Marcus said. His voice was sharp now. "Their packet... look at the metadata. It's a decoy. They're bluffing the lock to force you to lock."

  "I can't risk it," Sarah said. Her finger tightened. "If it's not a bluff and I don't lock, we lose everything. If I lock, there's a chance they yield at the last millisecond."

  "That's the race, Sarah! That's the whole trap!"

  "T-minus ten seconds."

  The logic was inescapable. The only winning move was to make losing impossible for yourself. If she removed her own ability to yield, Aethelgard's rational AI would calculate the outcome: *VaxCore cannot move. Therefore, Aethelgard must move.*

  But Aethelgard was running the same calculation.

  "Five seconds."

  Sarah didn't feel like a villain. She felt like a pilot pulling a G-force that would black her out. She was doing her job. She was protecting her shareholders. She was following the rules of the system everyone had agreed was efficient.

  "Four."

  She highlighted the `PURGE_KEY` command.

  "Three."

  Marcus stopped talking. He knew it was over.

  "Two."

  Sarah pressed the key.

  "One."

  On the screen, a confirmation dialog popped up. `IRREVERSIBLE ACTION CONFIRMED. KEY DELETED.`

  Simultaneously, the Aethelgard icosahedron stopped spinning. It turned a solid, flat red.

  A text log scrolled across the center of the screen, white on black.

  `COUNTERPARTY COMMITMENT RECEIVED.`
  `MINIMUM THRESHOLD: 55%`
  `OWN THRESHOLD: 52%`
  `COMPATIBILITY: 0%`
  `OUTCOME: NULL`

  The hum of the server room seemed to drop an octave. The cooling fans slowed.

  "Synthesis Lines Status," Sarah whispered.

  The screen updated.

  `VAXCORE LINE 1: STANDBY (NO CONTRACT)`
  `VAXCORE LINE 2: STANDBY (NO CONTRACT)`
  `AETHELGARD LINE 1: STANDBY (NO CONTRACT)`
  `AETHELGARD LINE 2: STANDBY (NO CONTRACT)`

  `ESTIMATED DOSAGE PRODUCTION: 0`
  `ESTIMATED CASUALTIES (NEXT 24H): 14,200`

  Sarah sat back. Her hand was still on the keyboard. She had done exactly what she was supposed to do. She had played the game perfectly. She had committed early. She had made her position verifiable. She had removed the possibility of weakness.

  And because Aethelgard had done the exact same thing, for the exact same reasons, the factories would not run.

  Marcus let out a long, shaky breath. "They yielded," he said, staring at the log. "Look at the timestamp on their internal negotiation log. It's public now that the deal failed."

  Sarah scrolled down.

  `AETHELGARD INTERNAL DECISION: 07:59:58`
  `ACTION: PREPARE TO YIELD TO 50%`
  `TRIGGER: WAIT FOR VAXCORE LOCK`

  `VAXCORE INTERNAL DECISION: 07:59:59`
  `ACTION: EXECUTE LOCK AT 52%`
  `TRIGGER: DETECT AETHELGARD PREPARE LOCK`

  "They were going to give us half," Sarah said. Her voice sounded like it was coming from underwater. "They were waiting to see if we locked. If we hadn't locked, they would have yielded. They wanted to cooperate."

  "But I saw their packet size," Sarah said. "I saw the pre-commitment script."

  "It was a handshake protocol," Marcus said. "Not a lock. They were signaling readiness to finalize, not finalizing."

  Sarah looked at the red icosahedron. It wasn't aggressive. It was just dead.

  "I locked too early," she said.

  "No," Marcus said, turning off his comms. "You locked exactly when the incentives told you to. That's the point."

  He stood up and walked to the window. Outside, the city lights were flickering. Somewhere out there, the hospitals were waiting for the update that would restart the production lines. The update that would never come, because the keys to accept it had been deleted by two people who just wanted to make sure the other side knew they were serious.

  Sarah looked back at the screen. The `NULL` outcome pulsed gently.

  "We could have fixed this," she said. "If we had just talked. Without the protocol."

  "Then someone would have lied," Marcus said. "And the other side would have known it. So we built a system where you can't lie. A system where you have to prove you mean it."

  "By breaking it."

  "By making it unbreakable," Marcus corrected. "Even by us."

  The timer on the screen reset for the next negotiation window. `NEXT ATTEMPT: 24 HOURS.`

  Sarah reached for the keyboard to type a message, an apology, an explanation. But the chat window was greyed out. The protocol didn't allow for post-mortems until the next cycle. There was no function for *I'm sorry*. There was only `OFFER`, `COMMIT`, and `EXECUTE`.

  She took her hand off the keyboard. The server room hummed on, efficient, rational, and utterly empty.
