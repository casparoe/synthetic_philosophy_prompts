answer: |-
  The machine looked less like a portal to the multiverse and more like a 1950s telephone switchboard that had survived a fire. It smelled of ozone, stale tobacco, and the specific, dusty scent of old libraries. Elena sat on the metal stool, her hands clasped tight in her lap, knuckles white.

  "Three minutes," said the operator. He was a man named Silas, whose eyes were the color of washed-out denim and who looked as though he hadn't slept since the Cold War. He adjusted a row of brass dials. "And remember, the connection is one-way audio. You talk, she hears. She talks, you hear. But you can't touch. You can't cross."

  "I know the rules," Elena said. Her voice sounded thin in the soundproofed basement. "Just connect me."

  "Right. The Zurich offer." Silas didn't look up. He was tracing a circuit path with a grease-stained finger. "Tenure track. Big money. But your mother needs care here. If you go, you miss the end. If you stay, you miss your life. You want to know which regret tastes worse."

  "I want to know what happens," Elena corrected. "I want to know if *I* survive it."

  Silas paused, his hand hovering over a large red toggle. He looked at her then, really looked at her, with a pity that felt intellectual rather than emotional. "That's the question, isn't it? Identity. Transworld identity."

  "Is this the part where you give me the disclaimer?"

  "It's the part where I ask you why you care," Silas said. He flipped the toggle. The machine hummed, a low vibration that Elena felt in her teeth. Static hissed through the headset, sounding like rain on a tin roof. "David Lewis would say you're about to have a very emotional conversation with a stranger. A counterpart. Someone who shares your origin, your biology, maybe even your memories up to a point. But not *you*."

  "It feels like me," Elena snapped. "It's the nearest possible world. It's the world where I made the other choice."

  "Kripke," Silas muttered, turning a dial until the static sharpened into a rhythmic pulse. "You're a Kripkean. You believe in rigid designators. You think 'Elena' picks out the same person in every world, like a name tag stitched into your soul."

  "I think it's my life," she said.

  "Hubert Humphrey didn't think so," Silas said. He leaned against the console, crossing his arms. "When Lewis proposed this, Kripke hammered him with Humphrey. Humphrey lost the '68 election. Lewis says there's a world where Humphrey won. But Kripke asked: why should the real Humphrey care? If it's not him winning, if it's just some look-alike in a concrete universe somewhere else, then the real Humphrey still lost. You're about to eavesdrop on a woman who looks like you, sounds like you, but whose happiness has no causal connection to yours. If she's happy in Zurich, why should you be comforted? You're still the one staying in Chicago."

  "Because it shows me what I'm capable of," Elena said, though her stomach turned over. "If she can handle the guilt, I can."

  "Or," Silas said softly, "if she's miserable, you'll spend the next forty years wondering if you could have saved her by staying. You're outsourcing your fate to a ghost."

  The static cleared abruptly. A voice came through the headset. It was Elena's voice, but lower, rougher, as if worn down by years of smoking or shouting.

  "Hello?" the voice said.

  Elena gripped the headset. "Hi. It's... it's me."

  A pause on the other end. A dry chuckle. "I know. I was wondering when you'd call. I called mine, three years ago."

  Elena looked at Silas. He was watching the levels on the meter, expressionless.

  "You took the job?" Elena asked.

  "I took the job," the other Elena said. "Zurich. The department was... competitive. Brilliant, but cold."

  "Mom?"

  "Mom died six months after you left. Alone. In the house."

  The air left the room. Elena felt a physical blow to her chest. She looked at Silas, expecting him to stop it, to cut the feed. He didn't move.

  "I didn't make it back for the funeral," the other Elena continued. Her voice wasn't crying. It was flat. Resigned. "I was in the middle of a grant review. I couldn't get a flight."

  "Oh god," Elena whispered. "I can't... I can't do that."

  "Wait," the other Elena said. "Listen to me. It wasn't... it wasn't a tragedy. Not the way you think."

  "How is that not a tragedy?"

  "Because she was ready," the other voice said. "Mom. She told me, before I left, that she didn't want me to watch her fade. She wanted me to be where I was alive. I carried the guilt, yes. For years. But I built a life. I published. I taught. I found a kind of joy I wouldn't have found here. If I had stayed... I would have resented her. And she would have known."

  The static surged, swallowing the words for a second.

  "You're saying it was worth it?" Elena asked.

  "I'm saying I'm whole," the other Elena said. "And you will be too. Whichever way you jump. But don't stay because you think you're saving me. You're not. You're just saving yourself from the guilt. And that's a heavy thing to carry, but it's lighter than regret."

  The timer on the console blinked red. Ten seconds.

  "Thank you," Elena said, tears running hot down her cheeks.

  "Good luck," the voice said. "Tell Silas to fix the grounding. It's getting worse."

  The line cut. The silence in the basement was absolute, heavier than the noise had been.

  Elena sat there, breathing hard. A strange sensation was washing over her, a mix of devastation and profound relief. The guilt was still there, the image of her mother alone in the house, but it was accompanied by a vision of herself in Zurich, standing in a lecture hall, alive. It was a trade. A valid trade.

  She took off the headset and placed it on the console. Her hands were shaking.

  "Well?" Silas asked. He was wiping his hands on a rag.

  "She's okay," Elena said. "She made it. So I can make it."

  Silas stopped wiping. He looked at her, and for the first time, the cynicism dropped from his face, replaced by a weary honesty. "Elena. Think about what just happened."

  "I know what happened. I spoke to myself."

  "No," Silas said. "You spoke to a woman who shares your DNA and your past up until the point of divergence. That's the Lewis view. Counterpart theory. She is not you. Her resilience is hers, not yours. Her ability to metabolize that guilt is a biological quirk of *her* brain, in *that* world."

  "But she said—"

  "She said what she needed to say to make sense of her own life," Silas interrupted. "You're feeling relief right now. You feel like you have permission. But that permission is a category mistake. You are basing a decision on the emotional state of a stranger."

  "It felt like me," Elena insisted. "It was the nearest world."

  "The 'nearest' world is a metric of similarity, not identity," Silas said. He began powering down the machine, the dials clicking back into place. "And here is the thing the brochure doesn't tell you. The act of observing the other world changes the similarity metric. The Elena you just spoke to made her choice without a phone call. She didn't have this data. You do."

  Elena froze. "What?"

  "By listening to her, you have diverged from her," Silas said. "She acted on instinct. You are acting on intelligence. You are no longer in the nearest possible world. You are in a new one. One where you know the outcome of the other path. That changes the psychological landscape entirely. Her coping mechanisms might not work for you, because your burden is different now. You're carrying knowledge she never had."

  Elena stared at the switchboard. The hum was fading. "So it was useless."

  "No," Silas said. He tossed the rag onto the console. "It was human. Kripke would say you care about her because you identify with her. Lewis would say you're fooling yourself. But the truth is, it doesn't matter which metaphysics is true."

  He stood up and opened the door to the stairs, letting in a sliver of gray street light from above.

  "You came here because you couldn't bear the uncertainty," Silas said. "You wanted to know if the other Elena survived. And she told you she did. Whether she is literally you or just a twin, the fact remains: a woman with your face and your history survived that choice. That is data. Whether it's fate or statistics is up to you."

  Elena stood up. Her legs felt unsteady. "How much do I owe you?"

  "On the house," Silas said. "Consider it a contribution to the humanities."

  Elena walked to the door. She put her hand on the frame, looking back at the machine. It was just wires and vacuum tubes. It wasn't magic. It was a mirror.

  "Silas," she said.

  "Yeah?"

  "If I stay... will I call her?"

  Silas paused, his hand on the main breaker. "In the world where you stay? Maybe. In the world where you go? She already did."

  Elena nodded. She stepped out into the cool night air. The city was loud, full of people making choices, millions of diverging paths splitting every second. She thought of the woman in the headset. A stranger. A sister. A self.

  She pulled out her phone. She had the number for the university in Zurich. She had the number for the care facility in Chicago.

  She didn't know if the woman in the basement was her. She didn't know if the relief she felt was a trick of the mind, a philosophical error regarding transworld identity. She only knew that the voice had sounded tired, but alive.

  Elena dialed Zurich. She couldn't know if she was sealing her fate or just making a choice. But as the line rang, she realized the machine hadn't given her the answer. It had given her the weight. And that was something she had to carry herself, in this world, alone.
