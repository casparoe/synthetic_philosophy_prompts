      The gut punch is that if Lewis is right, the other woman's happiness is irrelevant to Elena. If Kripke is right, Elena has no free will (the outcome is fixed). The machine sells certainty, but delivers either irrelevance or determinism.
      Actually, the Humphrey point is about *concern*. "Why should Humphrey care?"
