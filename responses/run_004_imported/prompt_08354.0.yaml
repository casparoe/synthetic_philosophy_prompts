      *   **The Glitch/Decay:** The environment starts to lose resolution. Not like a simulation glitching, but like thermodynamics failing. Colors bleaching. Memories overlapping.
      *   **The Climax:** The acceptance of the paradox. The thought process itself begins to randomize. The logic that proved he is a BB is now dissolving.
      *   **The End:** Silence. Vacuum.

  5.  **Focusing on the "Vertigo":**
