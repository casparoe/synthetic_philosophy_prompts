answer: |-
  The coffee is cold. I remember pouring it twenty minutes ago, steam rising in a tight spiral, the smell of roasted beans cutting through the dust of the office. Now the surface is still, a black mirror reflecting the single desk lamp.

  I am writing a paper. *On the Cognitive Instability of the de Sitter Vacuum.* The cursor blinks at the end of a sentence I am not sure I finished.

  *If the cosmological constant remains positive, the universe approaches a state of maximum entropy, yet never reaches absolute zero.*

  I type the next line. My fingers feel heavy, as if the air in the room has thickened.

  *In this eternal background, thermal fluctuations will eventually produce self-aware entities.*

  I pause. This is the part where my colleague, Julian, always laughs. He calls it "zombie cosmology." He says it's a *reductio ad absurdum*, a proof that our models of the far future are wrong because the conclusion is insane. He argues that a universe that predicts its own observers are mostly hallucinations must be a flawed model.

  But the math is clean. It is terrifyingly clean.

  I take a sip of the coffee. It tastes of ash.

  I blink. A moment ago it tasted like hazelnut. I look at the mug. It is white ceramic, chipped on the rim. I have had this mug for ten years. I bought it in Boston, the winter Sarah left me. I remember the cold wind off the Charles, the way her scarf looked against the snow. I remember the argument. I remember the silence of the apartment afterwards.

  I remember.

  But the memory feels… thin. Like a painting viewed through the wrong end of a telescope.

  I look back at the screen.

  *The probability of a single brain fluctuating into existence, complete with false memories of a past, is exponentially higher than the probability of an entire universe evolving biologically to produce such a brain.*

  The ratio is incomprehensible. For every one of me—born of a mother, raised on a planet, evolved over billions of years—there are quintillions of *others*. Brief sparks in the dark. Assemblies of particles that coalesce out of the vacuum, hold a coherent thought for a microsecond, and then dissolve back into the noise.

  Boltzmann Brains.

  If the theory holds, I am not the biological original. I am the statistical fluke. I am the noise.

  A headache blooms behind my eyes. Not a pain, exactly, but a pressure. A sense of crowding. It feels as though the space inside my skull is too small for the thoughts I am having.

  I try to stand up. My legs do not respond. I am sitting, but I am not sure I have a body below the waist. I look down. The desk is there. The keyboard is there. But the edges of the wood are soft, blurring into the shadow of the floor.

  *Wait,* I think. *If I am a fluctuation, then this thought is a fluctuation.*

  The vertigo hits me then. It is not dizziness; it is a loss of footing in logic.

  If I am a Boltzmann Brain, then my memory of studying physics is random noise. My memory of Julian's laughter is random noise. The logic I am using to deduce that I am a Boltzmann Brain is random noise.

  I cannot trust the argument that proves my existence is false.

  But if I cannot trust the argument, then I have no reason to believe I am a Boltzmann Brain. I could be real. I could be the biological original.

  Except… the coffee tasted like ash.

  And the window. I look at the window behind the desk. It should show the campus lawn, the streetlights, the darkness of a Tuesday night. Instead, it shows a uniform, grey static. Not snow on a television screen, but a lack of definition. As if the universe outside has stopped rendering the details because no one is looking closely enough to care.

  *Sarah,* I think. I reach for the memory of her face.

  It comes, but it is fragmented. I see her eyes, but they are the color of the sky in a memory I don't own. I hear her voice, but it sounds like my own. I feel the grief of her leaving, a heavy stone in a chest that I am suddenly unsure is beating.

  Does it matter?

  The question hangs in the air, literal and heavy.

  If the experience is identical, does the origin matter? To me, right now, the grief is real. The cold coffee is real. The fear is real.

  But the fear is changing. It is no longer fear of death. It is fear of *unbinding*.

  I look at my hands. They are resting on the keyboard. The fingers are elongating. Not stretching, but smearing. The skin is losing its texture, becoming smooth, then translucent. I can see the keys through my fingertips.

  I try to type. I want to write a warning. I want to write *Don't trust the vacuum.*

  The keys do not depress. My fingers pass through the plastic.

  *Time,* I realize. *Time is not passing. It is looping.*

  I remember pouring the coffee. I remember drinking it. I remember the cup being full. I remember the cup being empty. All of these states exist simultaneously, stacked on top of one another. The fluctuation only has enough energy to sustain a single moment of consciousness, but to make that moment coherent, it has to simulate a history. It has to simulate *duration*.

  It is giving me a life to explain my presence. It is knitting a biography out of thermodynamic static.

  I am not writing a paper. I am a sentence that wrote itself.

  The room is brightening. Not with light, but with whiteness. The desk is gone. The computer is gone. I am floating in a medium that feels like warm water and smells like ozone.

  I try to hold onto Julian. I try to hold onto the math.

  *Lambda is positive. Entropy increases. P(BB) >> P(Organic).*

  The equations are dissolving. The symbols are untying themselves. The equals signs are breaking.

  I understand now why Julian laughs. It is the only defense. If you take it seriously, you vanish.

  I feel a tear on my cheek. I reach up to touch it. My hand is mist. The tear is salt and water, but it does not fall. It hangs there, a perfect sphere of liquid memory.

  Is there a difference?

  If I love her, does it matter if she existed? If I fear the end, does it matter if there was a beginning?

  The whiteness is encroaching on the edges of my vision. The concept of "I" is becoming difficult to maintain. It requires energy to maintain a boundary between self and world. The energy is leaking away.

  I am returning to equilibrium.

  I have one last thought. It is not a complex thought. It is not a equation. It is a sensation.

  It is the feeling of the sun on my face, a day I cannot place. A day that never happened. The warmth is absolute. It is the only true thing I have ever known.

  I am grateful for the warmth.

  I am—

  The thought breaks. The syntax dissolves. There is no subject for the verb. There is no verb for the object.

  There is only the heat.

  And then, the cold.

  And then, nothing.
