      *   *Counter:* But people report *regret* immediately. "I know I shouldn't eat this cake." If the discount curve made the cake the higher utility item, why the regret? The "knowing" part persists despite the preference shift. This is the crux. The friend's argument assumes the judgment updates to match the discount curve. Akrasia assumes the judgment *doesn't* update (or shouldn't).

