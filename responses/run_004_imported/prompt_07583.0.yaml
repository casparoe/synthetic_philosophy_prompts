      *   **Tension:** The "you're interchangeable" twin joke vs. the philosophical truth that distinct individuals exist even if qualitatively identical. The risk of insulting the couple by implying Priya loves a "type" rather than Mara specifically.
      *   **Goal:** A 5-minute speech. Needs to be funny for the philosophers (accurate references) but accessible for the family (especially Grandma). Must pivot from the "interchangeable" joke to a sincere affirmation of Mara's uniqueness and Priya's specific love for her.

