          *   *Crucial Insight:* KS ignores the *curvature* between the ideal points. Nash is sensitive to it.
          *   *Example Construction:*
              *   $d = (0,0)$.
              *   $a = (100, 50)$. (User has twice the potential).
              *   KS says: Split gains proportionally. User gets 2/3 of their max, Friend gets 2/3 of their max.
              *   Nash: Depends on the frontier. If the frontier is linear ($u_1 + 2u_2 = 100$), NBS = KS. If the frontier is highly concave favoring the User (e.g., User can get 100 easily, but Friend's gain costs User a lot), Nash might give User *more* than KS because the marginal cost of giving to Friend is high.
              *   *Wait, the prompt asks for asymmetric fallbacks.*
              *   Let's stick to the core difference: **Nash cares about the shape of the frontier (substitutability); KS cares about the relative range of aspirations.**
              *   *Example:*
                  *   $d = (10, 0)$.
                  *   Ideal $a = (100, 100)$. (Symmetric ideals, asymmetric fallbacks).
