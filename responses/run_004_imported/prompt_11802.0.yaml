          *   *Nash:* Favors the person with the better fallback (threat point) because it maximizes the product of *gains*.
          *   *KS:* Favors the person with the larger *range* of possible improvement ($a_i - d_i$).
      *   *Specific Numbers:*
          *   $d = (20, 0)$.
          *   Ideal point $a = (80, 60)$. (User can get up to 80, Friend up to 60).
          *   Feasible Frontier: Concave. Let's say $u_2 = 60 \cdot \sqrt{\frac{80 - u_1}{60}}$. (Just ensuring it passes through $a$ and is concave).
