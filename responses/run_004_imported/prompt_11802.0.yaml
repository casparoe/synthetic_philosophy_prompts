                      *   $100u_1 - 1000 = 90(110 - u_1) = 9900 - 90u_1$.
                      *   $190u_1 = 10900 \Rightarrow u_1 \approx 57.3$.
                      *   Here Nash favors the person with the better fallback (User) *more* than KS does.
                      *   Why? Nash maximizes product of gains. KS equalizes proportion of *potential* gain. Since User has a head start (fallback), Nash protects that head start more aggressively in terms of absolute surplus division on a linear frontier.
              *   *Wait, check the logic:* In the linear case with asymmetric $d$, NBS usually favors the player with the better $d$ *more* than KS does?
              *   Let's verify. NBS splits the *surplus* $(S - d_1 - d_2)$ equally in the symmetric linear case. So $u_1 = d_1 + 0.5(S - d_1 - d_2)$.
              *   KS splits the *range* $(a_i - d_i)$ proportionally.
              *   If $a_1 - d_1 = a_2 - d_2$, KS gives equal relative gains.
              *   In my example: $a_1 = 100, d_1 = 10 \Rightarrow Range_1 = 90$. $a_2 = 100, d_2 = 0 \Rightarrow Range_2 = 100$.
              *   KS gives User less relative gain because their range is smaller (due to high fallback).
              *   NBS gives User more absolute gain because of the fallback advantage.
              *   *Conclusion:* This is a good example. Nash protects the status quo (fallback) more; KS focuses on the "room to grow."

  5.  **Drafting Section (c): The "Ideal Point" Problem (Manipulability):**

      *   **Theoretical Ideal Point:** Defined by the feasible set $S$. $a_i = \max \{ u_i : (u_i, u_{-i}) \in S, u_{-i} \ge d_{-i} \}$. It is *objective* given $S$.
      *   **Practical Reality:** $S$ is unknown. It's a startup. "Best case" is a projection.
      *   **Incentive:** If I claim my ideal point is higher (I am more essential to the best-case scenario), KS moves in my favor.
      *   **Nash Comparison:** Nash requires knowing the *shape* of the frontier (marginal trade-offs). This is also hard to know. But Nash relies on $d$ (fallback), which is often more observable (job offer letter vs. dream projection).
      *   **Trustworthiness:** KS is *more* vulnerable to "aspiration inflation." If you can convince the other party your potential is higher, you get more. Nash is vulnerable to "threat inflation" (exaggerating fallback), but fallbacks are usually harder to fake (need proof of job offer) than future potential.
      *   **Verdict:** KS is riskier in early-stage ventures where $S$ is undefined. Nash is more grounded in $d$ (BATNA), which is standard negotiation advice anyway ("know your BATNA").

  6.  **Synthesizing and Refining:**

      *   *Tone:* Academic but practical. Acknowledge the user's sophistication (they know the axioms) but bridge the gap to application.
      *   *Structure:*
          1.  Intro: Validate the question (it's a classic critique).
          2.  Part (a): Fallbacks vs. Ideals. Explain the math intuitively.
