                  *   Nash: Maximizes $(u_1 - 10)u_2$.
                  *   If the frontier is $u_1 + u_2 = 110$ (Linear).
                      *   KS: $u_2 = \frac{100}{90}(u_1 - 10)$. Substitute into $u_1 + u_2 = 110$.
                      *   Nash: Symmetric around midpoint of gains. Midpoint of feasible gains is $(55, 55)$ shifted? No. Maximize $(u_1-10)(110-u_1)$. Derivative: $110 - u_1 - (u_1 - 10) = 0 \Rightarrow 120 = 2u_1 \Rightarrow u_1 = 60, u_2 = 50$.
