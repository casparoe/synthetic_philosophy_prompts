              *   *Comparison:* Nash gives the User more (60 vs 55.5) because it splits the *surplus* equally. KS gives the Friend more (44.4 vs 40) because it equalizes the *percentage of potential* gained. Since the User already has a head start (fallback), their "potential range" is smaller (80 vs 100), so KS penalizes them slightly to help the friend catch up proportionally.
              *   *This is perfect.* It highlights the "fallback protection" of Nash vs. the "aspiration equalization" of KS.

      *   *Refining Part (c):* Emphasize that in a startup, the "Ideal Point" is basically a business plan projection. It's cheap talk. The Fallback is a signed offer letter. This makes Nash more robust empirically, even if KS feels "fairer" regarding effort/potential.

