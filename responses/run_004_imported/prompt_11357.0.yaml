answer: |-
  This is a profound question that sits at the intersection of property law, moral philosophy, and family dynamics. You are asking about the concept known in law as *mortmain* (literally "dead hand")—the control exerted by people long dead over the property and choices of the living.

  Your friends' advice ("just sell") treats the cabin as a purely economic asset. Your grandmother treated it as a moral vessel. Your second cousin treats the trust as a binding contract. You are asking if there is a moral framework that resolves the tension between these views.

  While I cannot offer legal advice (trust law varies wildly by jurisdiction, and the specific wording of your trust is paramount), I can offer a philosophical framework to help you distinguish between a rule that deserves honor and one that has become a hostage situation.

  Here are three principles often used to evaluate when the "dead hand" should release its grip.

  ### 1. The Principle of Frustrated Purpose
  The strongest moral argument for overriding a deceased person's wishes arises when adhering to the *letter* of their instruction defeats the *spirit* of their intent.

  Your grandmother's intent was not "preserve this wood and glass structure at all costs." Her intent was "preserve a place where this family gathers, bonds, and creates memories." She saw neighbors lose that *function* because they sold the *asset*. She used the asset as a means to secure the function.

  **The Test:** Is the asset still serving the function?
  In your case, the answer appears to be no. With 19 beneficiaries across three countries and almost no visits in a decade, the cabin is no longer a gathering place. It is a line item in a budget. By forcing the family to keep the cabin, the clause is actively damaging the family (causing strife, financial drain, resentment) rather than bonding it.

  **Verdict:** When the mechanism (keeping the cabin) destroys the goal (family unity), the mechanism loses its moral authority. Honoring your grandmother might actually mean admitting the cabin no longer serves her purpose.

  ### 2. The Principle of Proportionate Burden
  A restriction on property is a form of obligation. Philosophers and jurists generally agree that obligations passed down through generations must be proportionate to the benefits received.

  In the early years, the benefit (a free vacation spot for the siblings) likely outweighed the burden (splitting taxes). Now, the burden is high (upkeep, taxes, coordination costs) and the benefit is near zero (no one goes there).

  **The Test:** Does the burden fall unfairly on the living to satisfy the preferences of the dead?
  Your grandmother made a calculation based on a family of three sisters living nearby. She could not anticipate a diaspora of 19 people across three countries. To force the current generation to subsidize a property they cannot use, based on a demographic reality that no longer exists, is to treat the living as resources for the dead, rather than stewards of their own lives.

  **Verdict:** When the cost of compliance becomes a hardship rather than a stewardship, the "dead hand" becomes oppressive.

  ### 3. The "Veil of Ignorance" Renegotiation
  This is a thought experiment derived from political philosophy. Imagine your grandmother could be brought back today, not as an authority figure, but as a participant. Imagine she is placed behind a "veil of ignorance"—she doesn't know she is the grandmother; she is just one of the 19 beneficiaries. She doesn't know if she is the one who wants to sell or the one who wants to keep it. She only knows the facts: *19 owners, 3 countries, 0 visits, high cost.*

  **The Test:** Would she still agree to the clause knowing these facts?
  Given that her motivation was to prevent the *loss of the family place*, and given that the family place is effectively already lost (due to non-use), it is highly probable she would agree that the clause has served its term. She wanted to prevent a "restless heir" from selling a *vibrant* family hub. She did not intend to force a *dormant* liability onto descendants.

  **Verdict:** If the original architect of the rule would likely agree to change it given the new data, the rule is no longer binding in spirit.

  ### Where Your Family Falls
  Based on the details you provided, your situation leans heavily toward the side where the rule **no longer binds morally**, even if it still binds legally.

  Here is why the distinction matters in your specific case:

  **The Dissenter's Argument:** Your second cousin is technically correct about the *history*. The clause was designed to stop a majority from overriding a minority who wanted to keep it. However, the cousin is missing the *teleology* (the end goal). The cousin is protecting the *cabin*, but the grandmother wanted to protect the *family*. If keeping the cabin divides the family into warring factions (half hiring lawyers, half digging in), the clause is doing the exact damage your grandmother feared, just via a different route.

  **The "Exception" Trap:** You mentioned the fear that "assuming we are the exception is precisely the mistake she was guarding against." This is a valid concern. Every generation thinks *their* hardship is unique. However, there is a difference between "we are tired of maintaining this" and "the fundamental demographics of the family have shifted so drastically that the property is functionally useless." The latter is not an excuse; it is a material change in circumstances.

  ### A Principled Path Forward
  If you accept that the moral bond has loosened, how do you handle the one dissenting cousin?

  1.  **Reframing the Sale:** Do not frame the sale as "breaking grandmother's rule." Frame it as "fulfilling grandmother's wish in a new context." The wish was family connection. If the proceeds of the sale are used to fund a family reunion every two years, or a scholarship for grandchildren, or a new gathering spot in a more central location, you are preserving the *intent* while liquidating the *liability*.
  2.  **The Buyout:** Is it possible for the dissenting cousin to buy out the 18 others? If they value the cabin so highly, they should own it outright. This respects their wish to keep it without holding the other 18 hostage. If they cannot afford it, that confirms the burden is too high for a single heir as well.
  3.  **The Legal Reality:** In many jurisdictions, trusts cannot last forever (rules against perpetuities), and courts can modify trusts under the doctrine of *cy pres* if the original purpose becomes impossible or impracticable. A judge might well rule that a cabin nobody visits is "impracticable."

  ### Conclusion
  There is a principled distinction between **stewardship** and **hostage-taking**.

  *   **Stewardship** is when the past provides a foundation for the present to build upon.
  *   **Hostage-taking** is when the past consumes the present's resources to sustain a memory that no longer lives.

  Your grandmother built a foundation. For sixty years, it worked. Now, the foundation is cracking under the weight of a changed world. Honoring her does not require you to drown with the ship. It requires you to acknowledge that the ship has sailed, and the life raft is the family itself, not the wood it was built from.

  You are not breaking her trust by selling; you are acknowledging that the trust has completed its lifecycle. The most respectful thing you can do is to have the conversation openly, acknowledging her wisdom while explaining why the world has outgrown the specific container she built.
