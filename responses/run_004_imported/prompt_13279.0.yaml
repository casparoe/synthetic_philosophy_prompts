          *   *Refinement:* Focus on a specific case where evidence crumbled. How did Sidgwick react? Did he double down or retreat?
          *   *Follow-up:* If she says he remained skeptical, ask if that skepticism undermined the urgency of the ethical project.

      *   *Requirement 3: Inconclusive Reports (Honesty vs. Paralysis).*
          *   *Draft 1:* Why did they always say "no conclusion"?
          *   *Critique:* Needs to frame the tension between rigor and institutional stagnation.
          *   *Refinement:* The Sidgwicks (Henry and Eleanor) were known for cautious language. Is this scientific integrity or a way to keep the project alive without committing to a falsifiable claim?
          *   *Follow-up:* If she says "integrity," ask if that integrity inadvertently made the field unfalsifiable.

      *   *Requirement 4: Modern Parallel (Daryl Bem).*
          *   *Draft 1:* Compare Sidgwick to Daryl Bem.
          *   *Critique:* Needs to focus on *evidential standards*. Bem used standard psych methods to prove ESP. Sidgwick tried to use standard empirical methods for ghosts.
          *   *Refinement:* Bem's "Feeling the Future" faced replication crises. Sidgwick faced fraud. Is the parallel in the *method* or the *desire* for the result?
          *   *Follow-up:* If she draws a parallel, ask if modern parapsychology suffers the same philosophical burden Sidgwick did.

      *   *Requirement 5: Definition of Success.*
          *   *Draft 1:* What would have been enough proof?
          *   *Critique:* Needs to be about Sidgwick's *lights*, not general standards.
          *   *Refinement:* After 30 years, what specific datum would have allowed him to close the *Methods of Ethics* argument?

