      *   **Goal:** 8-9 interview questions that challenge the thesis rather than letting the interviewee restate it.
      *   **Specific Requirements:**
          1.  Question on how empirical proof of survival closes the "dualism of practical reason" gap (ethical vs. empirical). + Follow-up.
          2.  Question on a specific failed/qualified investigation and Sidgwick's response (philosophical weight vs. being fooled). + Follow-up.
          3.  Question on the Sidgwicks' habit of inconclusive reports (honesty vs. paralysis). + Follow-up.
          4.  Question on evidential standards compared to modern anomalies (e.g., Daryl Bem). + Follow-up.
          5.  Closing question on what would have actually counted as "success" for Sidgwick.
      *   **Total:** 8-9 questions (4 main + 4 follow-ups + 1 closing = 9 total).
      *   **Tone:** Intellectual, rigorous, probing, suitable for a long-form science/ideas piece.

  2.  **Deconstruct the Core Tension:**
      *   *The Problem:* Sidgwick found a conflict in ethics: Rational Self-Interest vs. Rational Duty. They don't align unless there's a moral order (God/Afterlife) that rewards duty.
      *   *The SPR Solution:* If we can prove survival/afterlife empirically, does that solve the ethical problem?
      *   *The Critique:* Proving ghosts doesn't necessarily prove *moral* justice. Also, Sidgwick never found proof. Why keep looking?
      *   *The Historian's Thesis:* It's not a hobby; it's applied philosophy.
      *   *The Interviewer's Goal:* Press on the *logic* of that application. Is it a category error? Is it desperation? Is it methodological rigor or avoidance of closure?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: The Ethical/Empirical Gap.*
          *   *Draft 1:* How does proving ghosts fix his ethics problem?
          *   *Critique:* Too simple. Needs to address the "dualism of practical reason."
          *   *Refinement:* Sidgwick's dualism is about *reason*, not just facts. Even if survival is real, does it guarantee moral justice?
          *   *Follow-up:* If she says "it provides hope," push on whether hope is a rational foundation for ethics.

      *   *Requirement 2: Specific Failure & Response.*
          *   *Draft 1:* Tell me about a time they were wrong.
