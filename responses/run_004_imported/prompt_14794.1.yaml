answer: |-
  This is a classic case of **causal overdetermination by omission**, wrapped in a layer of **normative ambiguity**. You know the literature: if $A$, $B$, and $C$ all fail to prevent $E$, and any one of them succeeding would have prevented $E$, standard counterfactual analysis suggests none of them is a "but-for" cause (since $E$ would have happened anyway due to the others' inaction). Yet, intuitively, someone is responsible.

  You want a non-skeptical answer. You want to know if Ana is a *cause* in a way that justifies her guilt, or if she is a *scapegoat* of our cognitive bias toward salient agents.

  Here is the cut: **Ana is not the cause of the damage in any morally or metaphysically relevant sense.** She is a *condition* of the accident, but not the *cause* of the failure. To tell her otherwise is to confuse **descriptive regularity** (habit) with **prescriptive normativity** (duty).

  Here is the breakdown you can use to structure your conversation, moving from the metaphysics to the dinner table.

  ### 1. The Metaphysics: Omissions and Normality
  The problem with omissions is that they are profligate. If we say "the cause of the fire damage was the lack of oxygen," we are physically correct but uselessly so. To identify *the* cause, we need a **Normality Condition** (drawing on Hart and Honoré, or more recently, Hitchcock and Knobe).

  A cause is not just a counterfactual dependency; it is a **deviation from the expected or required course of events.**

  *   **The Landlord:** Their contract created a *prescriptive norm*. They were *required* to check. Their failure was a deviation from the required course. **They are a cause.**
  *   **The Brother-in-Law:** His role as owner creates a *fiduciary/managerial norm*. He was *required* to formalize safety protocols. His procrastination was a deviation from the required course. **He is a cause.**
  *   **Ana:** Her checking was a *descriptive norm*. It happened often, but it was not *required*. It was a supererogatory habit. When she stopped checking, she deviated from what *usually* happened, but not from what *should* have happened. **She is not a cause of the failure.**

  If we treat Ana's habit as a causal duty, we are effectively saying that **unpaid, unassigned vigilance is structurally equivalent to contractual obligation.** That is a category error. If we accept that, we make every employee causally responsible for every safety failure they *could* have noticed but weren't hired to manage. That collapses the distinction between a worker and a safety inspector.

  ### 2. The "Too Many Causes" Objection
  You asked: *If she counts as a cause, don't the other three have to count too?*

  Yes, they do. But notice the asymmetry. The Landlord and the Owner are causes of the **systemic failure**. Ana is merely a variable within the system.

  Think of it like a dam.
  *   The **Landlord** was hired to maintain the spillway and didn't.
  *   The **Owner** knew the spillway was risky and didn't upgrade it.
  *   **Ana** was a hiker who usually walked by and picked up loose rocks, but one day didn't.

  When the dam breaks, the hiker did not cause the flood. The hiker was a **gratuitous safeguard** that the system had come to rely on without compensating or authorizing. The reliance itself was the Owner's failure, not the hiker's.

  Ana feels guilty because she is applying a **counterfactual test** ("If I had looked, this wouldn't have happened") rather than a **normative test** ("Was I supposed to look?"). Counterfactually, yes, she could have saved it. Normatively, she was not the safety net. The safety net was the inspection contract and the management structure. Those are the things that broke.

  ### 3. The "Flavors of Expectation"
  You asked if the different expectations (habit vs. contract vs. duty) should change who we single out. **Absolutely.** This is not irrelevant psychology; this is the metaphysics of social reality.

  *   **Contract/Duty:** These create **causal channels**. When you sign a contract or take a management role, you insert yourself into the causal chain as a necessary node. Your omission breaks the chain.
  *   **Habit:** This is **causal noise**. It is a statistical regularity. Relying on noise for safety is a design flaw.

  The Brother-in-Law committed the primary metaphysical error here: he **reified a habit into a protocol.** He treated Ana's voluntary behavior as a fixed variable in his business model without locking it in with authority or compensation. When that variable fluctuated (because she's human), the system failed. He cannot outsource *structural causality* to *voluntary habit*.

  ### 4. What to Tell Ana (The Practical Application)
  You need to move her from "I failed to prevent this" to "I was set up to be the fall guy for a systemic failure." Do not tell her "it's not your fault" in a vague, comforting way. Tell her *why* it isn't her fault using the logic above.

  **The Script:**
  > "Ana, I've been thinking about the fire like a philosopher, because that's what I do. And the answer is clear: You are carrying guilt that belongs to the system, not to you.
  >
  > "In safety engineering, there's a difference between a **control** and a **culture**. A control is a locked door, a signed contract, a scheduled inspection. A culture is people caring enough to look twice. You provided the culture. The Owner and the Landlord were supposed to provide the controls.
  >
  > "You feel like you caused the damage because you *could* have stopped it. But in a business, 'could' doesn't equal 'should.' The Landlord *should* have checked. The Owner *should* have assigned the job. You just *did* check, out of kindness. When you stopped, the business broke because it was leaning on your kindness instead of its own procedures.
  >
  > "That's not your failure. That's the Owner's failure for letting the business depend on something he didn't guarantee. You didn't burn the bakery down. The safety protocol burned the bakery down. And you weren't the safety protocol."

  ### The Bottom Line
  Ana is the **salient** cause because she is the most proximate human agent we can blame, but she is not the **actual** cause of the *negligence*. The negligence was the structural reliance on an unenforced habit.

  If you tell her this, you aren't just comforting her; you're correcting a metaphysical error in how the business assigns responsibility. She wasn't the guardian who fell asleep; she was the volunteer who went home, and the owner forgot to hire a guard.
