  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is part of a group of five novelists ("the pool"). They each put \$2,000 into a joint account per book. They set quarterly page targets/deadlines. If they miss, the money goes to a political cause they *hate* (anti-charity).
